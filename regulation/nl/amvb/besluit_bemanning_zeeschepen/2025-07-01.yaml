      voldoet aan tabel A-III/1, onderdeel 3, van de STCW-code.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.2.15
  - number: 3.2.16
    text: |-
      Een wachtlopend gezel machinekamer die deel uitmaakt van de machinekamerwacht of is aangewezen om dienst te doen in
      een tijdelijk onbemande machinekamer van een zeeschip is in het bezit van een vaarbevoegdheidsbewijs dat ten minste
      voldoet aan voorschrift III/4, tweede lid, van bijlage I bij [richtlijn (EU) 2022/993](32022L0993).
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.2.16
  - number: 3.2.17
    text: |-
      Een gekwalificeerd gezel machinekamer in een bemande machinekamer of in een tijdelijk onbemande machinekamer van
      een zeeschip is in het bezit van een vaarbevoegdheidsbewijs dat ten minste voldoet aan voorschrift III/5, tweede
      lid, van bijlage I bij [richtlijn (EU) 2022/993](32022L0993).
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.2.17
  - number: 3.2.18
    text: |-
      Een officier elektrotechniek van een zeeschip is in het bezit van een vaarbevoegdheidsbewijs dat ten minste voldoet
      aan voorschrift III/6, tweede lid, van bijlage I bij [richtlijn (EU) 2022/993](32022L0993).
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.2.18
  - number: 3.2.19
    text: |-
      Een gezel elektrotechniek van een zeeschip met een hoofdvoortstuwingsinstallatie van 750 kW voortstuwingsvermogen
      of meer is in het bezit van een vaarbevoegdheidsbewijs dat ten minste voldoet aan voorschrift III/7, tweede lid,
      van bijlage I bij [richtlijn (EU) 2022/993](32022L0993).
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.2.19
  - number: 3.2.20
    text: |-
      Een vaarbevoegdheidsbewijs maritiem officier of eerste maritiem officier dat is afgegeven op grond van voorschrift
      VII/1 van bijlage I bij [richtlijn (EU) 2022/993](32022L0993) is gelijkwaardig aan een vaarbevoegdheidsbewijs
      voor een functie van wachtstuurman, eerste stuurman, kapitein, wachtwerktuigkundige, tweede werktuigkundige of
      hoofdwerktuigkundige, voor zover dat vaarbevoegdheidsbewijs voldoet aan de eisen voor de desbetreffende, functie,
      bedoeld in bijlage I bij [richtlijn (EU) 2022/993](32022L0993).
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.2.20
  - number: 3.2.21
    text: |-
      Een vaarbevoegdheidsbewijs wachtlopend gezel dek en machinekamer dat is afgegeven op grond van voorschrift VII/1
      van bijlage I bij [richtlijn (EU) 2022/993](32022L0993) is gelijkwaardig aan een vaarbevoegdheidsbewijs voor een
      wachtlopend gezel dek of een wachtlopend gezel machinekamer, voor zover dat vaarbevoegdheidsbewijs voldoet aan de
      eisen voor de desbetreffende, functie, bedoeld in bijlage I bij [richtlijn (EU) 2022/993](32022L0993).
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.2.21
  - number: 3.2.22
    text: |-
      Een vaarbevoegdheidsbewijs gekwalificeerd gezel dek en machinekamer dat is afgegeven op grond van voorschrift VII/1
      van bijlage I bij [richtlijn (EU) 2022/993](32022L0993) is gelijkwaardig aan een vaarbevoegdheidsbewijs voor een
      gekwalificeerd gezel dek of een gekwalificeerd gezel machinekamer, voor zover dat vaarbevoegdheidsbewijs voldoet
      aan de eisen voor de desbetreffende, functie, bedoeld in bijlage I bij [richtlijn (EU) 2022/993](32022L0993).
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.2.22
  - number: 3.2.23
    text: |-
      Bij ministeriële regeling worden voor elk vaarbevoegdheidsbewijs, genoemd in deze paragraaf, kennisbewijzen,
      bekwaamheidsbewijzen, diensttijdvereisten en bijzondere of aanvullende beroepseisen vastgesteld waarmee
      voldaan wordt aan de voor die functie gestelde minimumeisen en die recht geven op een vaarbevoegdheidsbewijs of
      bekwaamheidsbewijs voor de betreffende functie.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.2.23
  - number: 3.3.1
    text: |-
      1 Een zeevarende aan wie speciale taken en verantwoordelijkheden zijn opgedragen met betrekking tot de lading en
      de daarbij behorende uitrusting van een olie- of chemicaliëntankschip, is in het bezit van een bekwaamheidsbewijs
      basis ladingbehandeling olie- en chemicaliëntankschepen dat ten minste voldoet aan voorschrift V/1-1, tweede lid,
      van bijlage I bij [richtlijn (EU) 2022/993](32022L0993).

      2 Een kapitein, hoofdwerktuigkundige, eerste stuurman, tweede werktuigkundige, eerste maritiem officier of
      zeevarende die rechtstreeks verantwoordelijk is voor het laden, lossen, de te nemen voorzorgsmaatregelen tijdens de
      reis, de behandeling van de lading, het reinigen van tanks of andere werkzaamheden met betrekking tot de lading van
      een olietankschip, is in het bezit van een bekwaamheidsbewijs ladingbehandeling olietankschepen voor gevorderden
      dat ten minste voldoet aan voorschrift V/1-1, vierde lid, van bijlage I bij [richtlijn (EU) 2022/993](32022L0993).

      3 Een kapitein, hoofdwerktuigkundige, eerste stuurman, tweede werktuigkundige, eerste maritiem officier of
      zeevarende die rechtstreeks verantwoordelijk is voor het laden, lossen, de te nemen voorzorgsmaatregelen tijdens de
      reis, de behandeling van de lading, het reinigen van tanks of andere werkzaamheden met betrekking tot de lading van
      een chemicaliëntankschip, is in het bezit van een bekwaamheidsbewijs ladingbehandeling chemicaliëntankschepen voor
      gevorderden dat ten minste voldoet aan voorschrift V/1-1, zesde lid, van bijlage I bij [richtlijn (EU) 2022/993]
      (32022L0993).

      4 Een in het eerste tot en met derde lid bedoeld bekwaamheidsbewijs van een kapitein, hoofdwerktuigkundige, eerste
      stuurman, tweede werktuigkundige, of eerste maritiem officier wordt op verzoek vernieuwd indien de houder:

      a. in de periode van 5 jaar voorafgaand aan de datum van de aanvraag tot vernieuwing ten minste 3 maanden heeft
      dienstgedaan op een bij ministeriële regeling voorgeschreven type tankschip; of

      b. in bezit is van een bekwaamheidsbewijs ten bewijze van het gevolgd hebben van een passende herhalingstraining
      die ten minste voldoet aan voorschrift V/1-1 van bijlage I bij [richtlijn (EU) 2022/993](32022L0993).
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.3.1
  - number: 3.3.2
    text: |-
      1 Een zeevarende aan wie speciale taken en verantwoordelijkheden zijn opgedragen met betrekking tot de lading en
      de daarbij behorende uitrusting van een vloeibaargastankschip, is in het bezit van een bekwaamheidsbewijs basis
      ladingbehandeling gastankschepen dat ten minste voldoet aan voorschrift V/1-2, tweede lid, van bijlage I bij
      [richtlijn (EU) 2022/993](32022L0993).

      2 Een kapitein, hoofdwerktuigkundige, eerste stuurman, tweede werktuigkundige, eerste maritiem officier of
      zeevarende die rechtstreeks verantwoordelijkheid is voor het laden, lossen, de te nemen voorzorgsmaatregelen
      tijdens de reis, de behandeling van de lading, het reinigen van tanks of andere werkzaamheden met betrekking tot de
      lading van een vloeibaargastankschip, is in het bezit van een bekwaamheidsbewijs ladingbehandeling gastankschepen
      voor gevorderden dat ten minste voldoet aan voorschrift V/1-2, vierde lid, van bijlage I bij [richtlijn (EU)
      2022/993](32022L0993).

      3 Een in het eerste en tweede lid bedoeld bekwaamheidsbewijs van een kapitein, hoofdwerktuigkundige, eerste
      stuurman, tweede werktuigkundige of eerste maritiem officier wordt op verzoek vernieuwd indien de houder:

      a. in de periode van 5 jaar voorafgaand aan de datum van de aanvraag tot vernieuwing ten minste 3 maanden heeft
      dienstgedaan op een bij ministeriële regeling voorgeschreven type tankschip; of

      b. in bezit is van een bekwaamheidsbewijs ten bewijze van het gevolgd hebben van een passende herhalingstraining
      die ten minste voldoet aan voorschrift V/1-2 van bijlage I bij [richtlijn (EU) 2022/993](32022L0993).
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.3.2
  - number: 3.3.3
    text: |-
      1 Een zeevarende van een passagiersschip die in overeenstemming met zijn functie of werkzaamheden en
      verantwoordelijkheden vertrouwd is met noodsituaties aan boord van dat passagiersschip, is in het bezit van een
      schriftelijk bewijs dat hij geoefend is in familiarisatie voor noodsituaties aan boord van passagiersschepen als
      bedoeld in voorschrift V/2, vijfde lid, van bijlage I bij [richtlijn (EU) 2022/993](32022L0993).

      2 Een zeevarende die in de passagiersruimten van een passagiersschip direct bij de dienstverlening aan
      passagiers in passagiersruimten is betrokken, is in het bezit van een schriftelijk bewijs dat hij geoefend is in
      dienstverlening aan passagiers aan boord van dat zeeschip dat ten minste voldoet aan voorschrift V/2, zesde lid,
      van bijlage I bij [richtlijn (EU) 2022/993](32022L0993).

      3 Een kapitein, officier of zeevarende die in de alarmrol is belast met de hulpverlening aan passagiers van
      een passagiersschip, is in het bezit van een bekwaamheidsbewijs of schriftelijk bewijs dat hij geoefend is in
      groepsbegeleiding dat ten minste voldoet aan voorschrift V/2, zevende lid, van bijlage I bij [richtlijn (EU)
      2022/993](32022L0993).

      4 Een kapitein, hoofdwerktuigkundige, eerste stuurman, tweede werktuigkundige, eerste maritiem officier of
      zeevarende die in de alarmrol is aangewezen en verantwoordelijkheid draagt voor de veiligheid van passagiers
      in noodsituaties van een passagiersschip, is in het bezit van een bekwaamheidsbewijs of schriftelijk bewijs
      crisisbeheersing en menselijk gedrag dat ten minste voldoet aan voorschrift V/2, achtste lid, van bijlage I bij
      [richtlijn (EU) 2022/993](32022L0993).

      5 Een kapitein, hoofdwerktuigkundige, eerste stuurman, tweede werktuigkundige, eerste maritiem officier of
      zeevarende die directe verantwoordelijkheid draagt voor het aan en van boord gaan van passagiers, het laden, lossen
      of veilig stuwen van de lading of het sluiten van openingen in de romp van een ro-ro-passagierschip, is in het
      bezit van een bekwaamheidsbewijs of schriftelijk bewijs passagiersveiligheid, ladingveiligheid en waterdichtheid
      van de scheepsromp dat ten minste voldoet aan voorschrift V/2, negende lid, van bijlage I bij [richtlijn (EU)
      2022/993](32022L0993).

      6 Een zeevarende als bedoeld in het eerste tot en met het vijfde lid toont door middel van schriftelijk bewijs, met
      tussenpozen van niet meer dan 5 jaar, aan:

      a. in de voorgaande periode van 5 jaar ten minste 12 maanden dienst te hebben gedaan op een passagiersschip;

      b. in de voorgaande periode van 6 maanden ten minste 3 maanden dienst te hebben gedaan op een passagiersschip; of

      c. met goed gevolg te hebben deelgenomen aan een passende herhalingstraining die ten minste voldoet aan voorschrift
      V/2, vierde lid, van bijlage I bij [richtlijn (EU) 2022/993](32022L0993).

      7 In plaats van een bekwaamheidsbewijs of schriftelijk bewijs als bedoeld in het vierde of vijfde lid
      kan worden volstaan met een aantekening van de door de zeevarende gevolgde training in het krachtens
      [artikel 5, eerste lid, van de wet][ref1] bij te houden overzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel5
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '5'
  - number: 3.3.4
    text: |-
      1 Een zeevarende van een zeeschip dat is onderworpen aan de IGF-code is op passende wijze vertrouwd gemaakt met het
      zeeschip en de uitrusting als bedoeld in voorschrift V/3, derde lid, van bijlage I bij [richtlijn (EU) 2022/993]
      (32022L0993).

      2 Een zeevarende die is belast met aangewezen veiligheidstaken die verband houden met de zorg voor, het gebruik
      van of de noodrespons ten aanzien van de brandstof van een zeeschip dat is onderworpen aan de IGF-code, is in het
      bezit van een bekwaamheidsbewijs basistraining IGF-code dat ten minste voldoet aan voorschrift V/3, vijfde lid, van
      bijlage I bij [richtlijn (EU) 2022/993](32022L0993).

      3 Een kapitein, hoofdwerktuigkundige, tweede werktuigkundige, werktuigkundige, maritiem officier, eerste
      maritiem officier of zeevarende die rechtstreeks is belast met de zorg voor en het gebruik van brandstoffen en
      brandstofsystemen van een zeeschip dat is onderworpen aan de IGF-code, is in het bezit van een bekwaamheidsbewijs
      gevorderdentraining IGF-code dat ten minste voldoet aan voorschrift V/3, achtste lid, van bijlage I bij [richtlijn
      (EU) 2022/993](32022L0993).

      4 Een bekwaamheidsbewijs als bedoeld in het tweede of derde lid wordt op verzoek vernieuwd indien de houder
      aantoont dat hij gedurende vijf jaar voorafgaand aan de vernieuwing ten minste drie maanden relevante diensttijd
      heeft opgedaan of met goed gevolg heeft deelgenomen aan een passende herhalingstraining die voldoet aan voorschrift
      V/3, elfde lid, van bijlage I bij [richtlijn (EU)2022/993](32022L0993).

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de beroepsvereisten van
      zeevarenden die varen op een met gas of brandstof met een laag vlampunt aangedreven zeeschip van minder dan 500 GT,
      niet zijnde een passagiersschip, bedoeld in de IGF-Code.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.3.4
  - number: 3.3.5
    text: |-
      1 Een kapitein, eerste stuurman, wachtstuurman, eerste maritiem officier of maritiem officier van een tankschip
      of een passagiersschip dat in open polaire wateren vaart is in het bezit van een bekwaamheidsbewijs basistraining
      Polar-code, dat ten minste voldoet aan voorschrift V/4, eerste lid, van bijlage I bij [richtlijn (EU) 2022/993]
      (32022L0993).

      2 Een kapitein, eerste stuurman of eerste maritiem officier van een zeeschip dat in andere polaire wateren vaart is
      in het bezit van een bekwaamheidsbewijs gevorderdentraining Polar-code, dat ten minste voldoet aan voorschrift V/4,
      derde lid, van bijlage I bij [richtlijn (EU) 2022/993](32022L0993).

      3 Een wachtstuurman of maritiem officier van een zeeschip dat in andere polaire wateren vaart is in het bezit van
      een bekwaamheidsbewijs basistraining Polar-code, als bedoeld in het eerste lid.

      4 Een zeevarende van een zeeschip dat in polaire wateren vaart, is bekend met de apparatuur en de werkprocedures
      opgenomen in het operationeel handboek polaire wateren, bedoeld in hoofdstuk 2 van de Polar-code.

      5 Een bekwaamheidsbewijs als bedoeld in het eerste en tweede lid is geldig tot ten hoogste 5 jaar na de datum van
      afgifte.

      6 Een bekwaamheidsbewijs als bedoeld in het eerste en tweede lid wordt op verzoek vernieuwd indien de houder:

      a. in de periode van 5 jaar voorafgaand aan de datum van vernieuwing ten minste 2 maanden heeft dienstgedaan in een
      functie waarvoor het bezit van dat bekwaamheidsbewijs;

      b. ervaring heeft opgedaan in een relevante functie waarbij de opgedane ervaring als gelijkwaardig kan worden
      beschouwd als bedoeld in sectie A-I/11, onderdeel 4, onderdeel 2, van de STCW-code; of

      c. met goed gevolg een training voor het bekwaamheidsbewijs heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.3.5
  - number: 3.3.6
    text: |-
      1 Een zeevarende die op grond van paragraaf 12.3.2 van de Polar-code is belast met de uitvoering van paragraaf
      12.3.1 van de Polar-code is ten minste in het bezit van een geldig vaarbevoegdheidsbewijs als eerste stuurman
      of eerste maritiem officier voor het zeeschip waarop gevaren wordt en is in het bezit van een bekwaamheidsbewijs
      gevorderdentraining Polar-code als bedoeld in [artikel 3.3.5, tweede lid][ref1].

      2 [Artikel 3.3.5, vijfde en zesde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3.3.5
