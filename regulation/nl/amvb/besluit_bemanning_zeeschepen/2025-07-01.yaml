      2 Een bekwaamheidsbewijs als bedoeld in het eerste lid is geldig tot ten hoogste 5 jaar na de datum van afgifte.

      3 Een bekwaamheidsbewijs als bedoeld in het eerste lid wordt op verzoek vernieuwd indien de houder met tussenpozen
      van niet meer dan 5 jaar aantoont een passende herhalingstraining te hebben gevolgd.

      4 Het tweede en derde lid zijn niet van toepassing op vissers.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.5.4
  - number: 3.5.5
    text: |-
      1 Een kapitein of zeevarende die is aangewezen om eerste hulp te verlenen aan boord van een zeeschip is in het
      bezit van een bekwaamheidsbewijs medische eerste hulp dat ten minste voldoet aan voorschrift VI/4, eerste lid, van
      bijlage I bij [richtlijn (EU) 2022/993](32022L0993) en [richtlijn 92/29/EEG](31992L0029).

      2 Een kapitein of zeevarende die is aangewezen om medische verzorging aan boord van een zeeschip op zich te nemen
      is in het bezit van een bekwaamheidsbewijs medische eerste hulp dat ten minste voldoet aan voorschrift VI/4,
      eerste lid, van bijlage I bij [richtlijn (EU) 2022/993](32022L0993) en [richtlijn 92/29/EEG](31992L0029) en een
      bekwaamheidsbewijs medische zorg dat ten minste voldoet aan de bekwaamheidsvereisten inzake medische verzorging,
      bedoeld in voorschrift VI/4, tweede lid, van bijlage I bij [richtlijn (EU) 2022/993](32022L0993) en [richtlijn
      92/29/EEG](31992L0029).

      3 Een bekwaamheidsbewijs als bedoeld in het eerste en tweede lid is geldig tot ten hoogste 5 jaar na de datum van
      afgifte.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.5.5
  - number: 3.5.6
    text: |-
      1 Een zeevarende die is aangesteld als scheepsbeveiligingsfunctionaris is in het bezit van een bekwaamheidsbewijs
      scheepsbeveiligingsfunctionaris dat ten minste voldoet aan voorschrift VI/5, eerste lid, van bijlage I, bij
      [richtlijn (EU) 2022/993](32022L0993).

      2 Andere zeevarenden dan zeevarenden als bedoeld in het eerste lid die zijn belast met taken op het gebied
      van beveiliging zoals aangegeven in het scheepsbeveiligingsplan, zijn in het bezit van een bekwaamheidsbewijs
      uitvoering beveiligingstaken dat ten minste voldoet aan voorschrift VI/6, vierde lid, van bijlage I bij [richtlijn
      (EU) 2022/993](32022L0993).

      3 Elke andere zeevarende dan een zeevarende als bedoeld in het eerste en tweede lid is in het bezit van een
      bekwaamheidsbewijs bewustwording scheepsbeveiliging dat ten minste voldoet aan voorschrift VI/6, eerste lid, van
      bijlage I bij [richtlijn (EU) 2022/993](32022L0993).

      4 Iedere zeevarende volgt, alvorens zijn taak aan boord te beginnen, een familiarisatietraining in
      scheepsbeveiliging of krijgt voldoende informatie en instructie om:

      a. een beveiligingsincident te kunnen rapporteren;

      b. de procedures bij een beveiligingsdreiging te kunnen volgen; en

      c. deel te kunnen nemen aan beveiligingsgerelateerde nood- en eventualiteitenprocedures.

      5 Het tweede en derde lid zijn niet van toepassing op zeevarenden in het bezit van het bekwaamheidsbewijs
      scheepsbeveiligingsfunctionaris.

      6 Het derde en vierde lid zijn niet van toepassing op zeevarenden van zeeschepen waarvoor op grond van
      [artikel 9, eerste lid, aanhef en onderdeel b, van het Schepenbesluit 2004][ref1] geen internationaal
      scheepsbeveiligingscertificaat benodigd is.

      7 Het eerste tot en met zesde lid zijn niet van toepassing op vissers.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel9
