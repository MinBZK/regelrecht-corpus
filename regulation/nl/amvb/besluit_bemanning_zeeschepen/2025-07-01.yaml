  - number: 3.1.7
    text: |-
      1 Bij ministeriële regeling wordt bepaald welke beperkingen of aanvullingen mogen worden aangebracht op
      een vaarbevoegdheidsbewijs in verband met de aard van de lading, het soort zeeschip, het brutotonnage, het
      voortstuwingsvermogen, het type voortstuwing, de scheepslengte of het vaargebied.

      2 Onverminderd het eerste lid kunnen op een vaarbevoegdheidsbewijs voor een functie in de handelsvaart of zeilvaart
      dan wel in de zeevisvaart in elk geval de aanvullingen en beperkingen worden opgenomen die bij die functie zijn
      vermeld in de [paragrafen 3.2 tot en met 3.4][ref1].

      3 Bij ministeriële regeling wordt bepaald op welke wijze de in het eerste en tweede lid, genoemde aanvullingen dan
      wel beperkingen op vaarbevoegdheidsbewijzen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Hoofdstuk3
