  - number: '5.3'
    text: |-
      Een verzoek of een klacht wordt schriftelijk of als geautomatiseerd bestand en met redenen omkleed ingediend bij de
      voorzitter van het tuchtcollege. Een klacht van een belanghebbende vermeldt de naam, het adres en de woonplaats van
      de klager. Een verzoek en een klacht bevatten voorts ten minste de volgende gegevens:

      a. de naam en, voor zover bekend, het adres en de woonplaats van de kapitein of de scheepsofficier op wie het
      verzoek of de klacht betrekking heeft, en indien het verzoek of de klacht betrekking heeft op een scheepsofficier,
      de functie aan boord van het zeeschip die de scheepsofficier ten tijde van de gewraakte gedraging vervulde;

      b. de naam en, voor zover bekend, het type van het zeeschip, aan boord waarvan de gewraakte gedraging heeft
      plaatsgevonden;

      c. een omschrijving van de gedraging, waarop het verzoek of de klacht betrekking heeft;

      d. de bezwaren die tegen de gewraakte gedraging zijn gerezen.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel5.3
  - number: '5.4'
    text: |-
      1 De secretaris zendt onverwijld een afschrift van de beslissing van het tuchtcollege:

      a. bij aangetekende brief en als geautomatiseerd bestand aan de betrokken kapitein of scheepsofficier;

      b. bij gewone brief en als geautomatiseerd bestand aan Onze Minister en aan de klager.

      2 Indien het tuchtcollege in zijn uitspraak een schorsing van de vaarbevoegdheid heeft opgelegd, deelt
      de secretaris in zijn aangetekende brief en als geautomatiseerd bestand aan de betrokken kapitein of
      scheepsofficier mede: de datum waarop de schorsing ingaat, de verplichting om zijn vaarbevoegdheidsbewijs
      vóór die datum in te leveren bij het in [artikel 76, eerste lid, van de wet][ref1] genoemde Centraal register
      bemanningsgegevens, alsmede de gevolgen van het niet tijdig inleveren van het vaarbevoegdheidsbewijs, bedoeld in
      [artikel 57, vierde lid van de wet][ref2].

      3 De secretaris zendt een afschrift van de schriftelijke beslissing van het tuchtcollege alsmede van de
      aangetekende brief aan de betrokken kapitein of scheepsofficier tevens ter registratie aan het Centraal register
      bemanningsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel76
