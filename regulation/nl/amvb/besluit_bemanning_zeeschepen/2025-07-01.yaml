  - number: 3.6.4
    text: |-
      1 Een geneeskundige verklaring zeevaart wordt afgegeven met een geldigheidsduur van ten hoogste twee jaar dan wel
      een jaar indien het een verklaring met betrekking tot een persoon onder de leeftijd van achttien jaar betreft.

      2 Op medische gronden kan de keuringsarts een geneeskundige verklaring zeevaart afgeven voor een kortere duur dan
      die, genoemd in het eerste lid.

      3 De keuringsarts kan voorts een geneeskundige verklaring zeevaart afgeven voor een beperkt vaargebied dan wel met
      andere in die verklaring te vermelden beperkingen.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.6.4
  - number: 3.6.5
    text: |-
      1 De keuringsarts kan de gekeurde zeevarende tijdelijk of blijvend ongeschikt voor de zeevaart verklaren.

      2 De gekeurde zeevarende is:

      a. tijdelijk ongeschikt, indien op medische gronden wordt verwacht dat hij niet langer dan drie jaar voor de
      zeevaart ongeschikt zal zijn;

      b. blijvend ongeschikt, indien op medische gronden wordt verwacht dat hij langer dan drie jaar voor de zeevaart
      ongeschikt zal zijn.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.6.5
  - number: 3.6.6
    text: |-
      De keuringsarts die het onderzoek uitvoert, neemt de in [artikel 3.6.3, eerste lid][ref1], bedoelde medische eisen,
      de in artikel 3.6.3, tweede lid, bedoelde procedures en andere voorschriften, en voor zover van toepassing, de
      [artikelen 3.6.4][ref2] en [3.6.5][ref3] in acht.


