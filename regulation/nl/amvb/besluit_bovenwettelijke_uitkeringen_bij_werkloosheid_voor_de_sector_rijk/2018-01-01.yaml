    text: |-
      Onverminderd het bepaalde in [de artikelen 20e][ref1] en [20f][ref2] van dit besluit, blijft op uitkeringen op
      grond van dit besluit, ingegaan vóór 1 juli 2015, dit besluit van toepassing, zoals dat luidde op 30 juni 2015.


