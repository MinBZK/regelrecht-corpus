    text: |-
      De aansluitende uitkering bedraagt de uitkomst van de formule 0,7 * (A – B).

      in welke formule voorstelt:

      A: het bedrag van het bovenwettelijk maandloon;

      B: het bedrag van het inkomen in een kalendermaand.
