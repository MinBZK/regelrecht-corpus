  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. betrokkene:

      1e. de ambtenaar in vaste dienst, die op basis van het [Algemeen Rijksambtenarenreglement][ref1],
      het [Ambtenarenreglement Staten-Generaal][ref2] of het [Reglement Dienst Buitenlandse Zaken][ref3] in
      burgerlijke rijksdienst werkzaam is of is geweest en die ten gevolge van een ontslag, met uitzondering
      van een ontslag op grond van de [artikelen 49vv, zesde lid][ref4], [81, eerste lid, onderdeel l][ref5],
      [94][ref6] voor zover toepassing is gegeven aan [artikel 49tt, eerste lid][ref7],
      [94b, tweede en vierde lid][ref8], [94c, tweede lid, van het Algemeen Rijksambtenarenreglement][ref9],
      [130d, eerste lid, van het Algemeen Rijksambtenarenreglement][ref10] zoals deze luidde op 31
      maart 2015, de [artikelen 1][ref11] en [2 van het Ambtenarenreglement Staten-Generaal][ref12]
      j° artikel 81, eerste lid, onder l, van het Algemeen Rijksambtenarenreglement of
      [artikel 87, eerste lid, onder l, van het Reglement Dienst Buitenlandse Zaken][ref13], werkloos is geworden in de
      zin van de [Werkloosheidswet][ref14];

      2e. de ambtenaar in vaste dienst die is aangesteld op basis van het [Algemeen Rijksambtenarenreglement][ref15],
      het [Ambtenarenreglement Staten-Generaal][ref16] of het [Reglement Dienst Buitenlandse Zaken][ref17] en die
      tengevolge van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte werkloos is geworden in de zin van
      de [Werkloosheidswet][ref18];

      c. aanvullende uitkering: de aanvullende uitkering bedoeld in [Hoofdstuk 2][ref19] van dit besluit;

      d. aansluitende uitkering: de aansluitende uitkering bedoeld in [Hoofdstuk 3][ref20] van dit besluit;

      e. bovenwettelijke uitkering: aanvullende en aansluitende uitkering;

      f. dagloon: het dagloon in de zin van [artikel 1b, eerste en zesde lid, van de Werkloosheidswet][ref21],
      evenwel zonder toepassing van het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref22] met betrekking tot een loontijdvak
      van een dag;

      g. pensioengerechtigde leeftijd: de leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref23];

      h. werkloosheidsuitkering: een uitkering in de zin van de [Werkloosheidswet][ref24];

      i. maandloon: het maandloon, bedoeld in [artikel 1b, tweede lid, van de Werkloosheidswet;][ref25]

      j. bovenwettelijk maandloon: het maandloon, evenwel zonder toepassing van het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref26];

      k. inkomen in een kalendermaand: het inkomen in een kalendermaand, bedoeld in
      [artikel 1b, vierde lid, van de Werkloosheidswet][ref27].

      2 Indien op het salaris van de betrokkene op de dag voorafgaande aan het ontslag
      een inhouding werd toegepast op grond van [artikel 21a, vijfde lid][ref28],
      [artikel 57b, eerste lid, van het Algemeen Rijksambtenarenreglement][ref29], dan wel de [artikelen 35][ref30]
      en [38 van het Reglement Dienst Buitenlandse Zaken][ref31], wordt voor het dagloon bedoeld in het eerste lid,
      onderdeel f, uitgegaan van het dagloon zoals dat zou zijn vastgesteld indien geen sprake was geweest van bedoelde
      inhouding.


