  - number: '9'
    text: |-
      De duur van de aansluitende uitkering is de op het moment van ontslag berekende uitkeringsduur op basis
      van [artikel 2][ref1] verminderd met de terzake van dat ontslag berekende uitkeringsduur krachtens de
      [Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008114#Artikel2
