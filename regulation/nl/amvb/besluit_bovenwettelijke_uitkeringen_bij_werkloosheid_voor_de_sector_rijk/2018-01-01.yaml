        artikel: '36'
  - number: '7'
    text: |-
      Indien ten aanzien van de uitkering die betrokkene krachtens de [Werkloosheidswet][ref1] of krachtens de
      [Ziektewet][ref2] geniet een verplichting of een sanctie wordt opgelegd, wordt die verplichting eveneens opgelegd
      dan wel die sanctie op overeenkomstige wijze toegepast op de aanvullende uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008114/2018-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
  - number: '8'
    text: |-
      1 Indien op het moment van ontslag de duur van de uitkering berekend op basis van [artikel 2][ref1] van dit besluit
      langer is dan de duur van de uitkering berekend op basis van de [Werkloosheidswet][ref2], heeft betrokkene, die het
      einde van de uitkeringsduur krachtens de [Werkloosheidswet][ref3] heeft bereikt, met ingang van dat moment recht
      op een aansluitende uitkering, met dien verstande dat de verloren arbeidsuren waarvoor hij geen betrokkene is geen
      aanspraak geven op een uitkering krachtens dit besluit.

      2 Op de aansluitende uitkering zijn [hoofdstuk II, paragrafen 1 tot en met 3][ref4], en de [artikelen 47a][ref5],
      [47b][ref6], [75][ref7], [76][ref8], [76a][ref9], [77a][ref10] en [78 van de Werkloosheidswet][ref11] van
      overeenkomstige toepassing.

      3 In afwijking van het tweede lid zijn de [artikelen 19, eerste lid, onderdelen a, b, c en h][ref12], en
      [20, eerste lid, onderdeel b, van de Werkloosheidswet][ref13], niet van overeenkomstige toepassing op de
      aansluitende uitkering, bedoeld in het eerste en tweede lid.

      4 Het recht op aansluitende uitkering eindigt na ommekomst van de duur van de aansluitende uitkering, maar
      uiterlijk op de dag waarop betrokkene de pensioengerechtigde leeftijd bereikt.


