  - number: 20e
    text: |-
      1 Ten aanzien van de betrokkene die op 31 december 2011 recht had op een bovenwettelijke uitkering op basis van dit
      besluit, blijft dit besluit van toepassing zoals het op die dag luidde, met dien verstande dat:

      a. voor de ambtenaar bedoeld in [artikel 2, derde lid][ref1], van het besluit zoals dit gold op 31 december 2011,
      de uitkeringsduur wordt verlengd tot de dag waarop betrokkene de pensioengerechtigde leeftijd bereikt;

      b. voor de ambtenaar bedoeld in [artikel 8, vierde lid][ref2], van het besluit zoals dit gold op 31 december 2011,
      het recht op aansluitende uitkering eindigt na ommekomst van de duur van de aansluitende uitkering, dan wel op de
      dag waarop betrokkene de pensioengerechtigde leeftijd bereikt indien dat eerder is.

      2 Ten aanzien van de ambtenaar die voor 1 januari 2012 is aangewezen als herplaatsingskandidaat als bedoeld
      in [artikel 49d][ref3] of [artikel 49e, tweede lid, van het Algemeen Rijksambtenarenreglement][ref4],
      [artikel 84d][ref5] of [artikel 84e, tweede lid, van Ambtenarenreglement Staten-Generaal][ref6] en
      [artikel 58c][ref7] of [artikel 58d, tweede lid, van het Reglement Dienst Buitenlandse Zaken][ref8]
      en waarvan het ontslag, bedoeld in [artikel 96 van het Algemeen Rijksambtenarenreglemen][ref9]t
      respectievelijk in [artikel 126 van het Ambtenarenreglement Staten-Generaal][ref10] of in
      [artikel 99 van het Reglement Dienst Buitenlandse Zaken][ref11], ingaat op of na 1 januari 2012, blijft
      [artikel 2][ref12] van dit besluit van toepassing zoals het op 31 december 2011 luidde, met dien verstande dat de
      uitkeringsduur wordt verlengd tot de dag waarop betrokkene de pensioengerechtigde leeftijd bereikt.


