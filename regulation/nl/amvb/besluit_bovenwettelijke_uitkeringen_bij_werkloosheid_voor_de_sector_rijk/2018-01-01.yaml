  - number: 11b
    text: |-
      1 De betrokkene die uitsluitend op grond van artikel 65 van de Verordening (EG) nr. 883/2004 van het
      Europees Parlement en de Raad van de Europese Unie van 29 april 2004 betreffende de coördinatie van de
      socialezekerheidsstelsels (PbEU L 200) of op grond van artikel 71, eerste lid, onderdeel a ii en b ii van
      de Verordening (EEG) nr. 1408/71 van de Raad van de Europese Unie van 14 juni 1971 betreffende de toepassing
      van de sociale zekerheidsregelingen op werknemers en zelfstandigen, alsmede hun gezinsleden, die zich binnen
      de Gemeenschap verplaatsen (PbEU L28), geen recht op een werkloosheidsuitkering heeft, heeft recht op een
      bovenwettelijke werkloosheidsuitkering op grond van dit artikel, wanneer hij in zijn woonland recht heeft op een
      wettelijke werkloosheidsuitkering als bedoeld in artikel 3, eerste lid, onder h, respectievelijk artikel 4, eerste
      lid, onder g, van de verordening.

      2 De bovenwettelijke werkloosheidsuitkering waarop de betrokkene op grond van het eerste lid recht heeft, is in
      hoogte en duur gelijk aan de werkloosheidsuitkering en de bovenwettelijke uitkering waarop de betrokkene recht zou
      hebben gehad indien hij in Nederland zou hebben gewoond.

      3 De uitkering wegens werkloosheid, die de betrokkene ontvangt naar het recht van zijn woonland, wordt geheel in
      mindering gebracht op de uitkering op grond van dit artikel over dezelfde periode.

      4 Indien de betrokkene gedurende de periode dat hij krachtens werkloosheidswetgeving recht heeft op een
      werkloosheidsuitkering, (tijdelijk) wegens ziekte verhinderd is om arbeid te kunnen verrichten, waarbij in het
      woonland de werkloosheidsuitkering hierdoor niet tot uitbetaling kan komen omdat voor de werkloosheidsuitkering
      (tijdelijk) een uitkering wegens ziekte, zwangerschapsverlof of bevallingsverlof, naar het recht van zijn woonland
      in de plaats komt, wordt die uitkering voor de toepassing van het tweede lid gelijkgesteld met de overeenkomstige
      uitkering op grond van de [Ziektewet][ref1]. Deze gelijkstelling vindt plaats met een maximale duur van de
      overeenkomstige uitkering op grond van de Ziektewet. Zolang deze gelijkstelling duurt, is de uitkering op grond van
      dit artikel gelijk aan de uitkering op grond van de Ziektewet en de bovenwettelijke uitkering waarop de betrokkene
      recht zou hebben gehad indien hij in Nederland had gewoond.

      5 Voor de toepassing van het vierde lid wordt een uitkering op grond van
      [artikel 3:10 van de Wet arbeid en zorg][ref2] gelijkgesteld met een uitkering op grond van de [Ziektewet][ref3].

      6 De uitkering wegens ziekte, zwangerschap, bevalling, arbeidsongeschiktheid of adoptie en pleegzorg die de
      betrokkene ontvangt naar het recht van zijn woonland, wordt geheel in mindering gebracht op de uitkering op grond
      van dit artikel over dezelfde periode.

      7 Sancties die zijn opgelegd krachtens de werkloosheidswetgeving, dan wel ziektewetgeving of
      arbeidsongeschiktheidswetgeving van de andere lidstaat, werken op gelijke wijze door in de hoogte van de uitkering
      op grond van dit besluit.

      8 Betrokkene is te allen tijde verplicht alle informatie die betrekking heeft, of kan hebben, op de hoogte van of
      het recht op de uitkering op grond van dit besluit, door te geven aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel310
      [ref3]: https://wetten.overheid.nl/BWBR0001888
