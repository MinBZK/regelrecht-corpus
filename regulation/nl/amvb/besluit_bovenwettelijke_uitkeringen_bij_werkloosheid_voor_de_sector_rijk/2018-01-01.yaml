  - number: '4'
    text: |-
      1 De aanvulling op de werkloosheidsuitkering bedraagt de uitkomst van de formule: 0,7 * (A – B) – C,

      in welke formule voorstelt:

      A: het bedrag van het bovenwettelijk maandloon;

      B: het bedrag van het inkomen in een kalendermaand;

      C: het bedrag van de werkloosheidsuitkering.

      2 Voor de toepassing van dit artikel wordt de uitkering krachtens de [Werkloosheidswet][ref1] steeds geacht door
      betrokkene onverminderd te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2018-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '5'
    text: |-
      1 Indien de betrokkene gedurende de periode dat hij krachtens de [Werkloosheidswet][ref1] recht heeft op een
      uitkering, wegens ziekte verhinderd wordt arbeid te verrichten en deswege een uitkering geniet krachtens de
      [Ziektewet][ref2], wordt die uitkering krachtens de [Ziektewet][ref3] aangevuld tot 70% van het voor betrokkene
      geldende dagloon.

      2 Voor de toepassing van dit artikel wordt de uitkering krachtens de [Ziektewet][ref4] steeds geacht onverminderd
      door betrokkene te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0001888
