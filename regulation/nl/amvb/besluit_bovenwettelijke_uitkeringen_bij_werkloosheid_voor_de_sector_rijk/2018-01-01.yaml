  - number: '15'
    text: |-
      1 De betrokkene die een nieuwe dienstbetrekking aanvaardt, kan op zijn aanvraag gedurende de op basis van
      [artikel 2][ref1] voor hem vastgestelde uitkeringsduur een loonaanvulling krijgen, indien het dagloon in de nieuwe
      dienstbetrekking minder bedraagt dan het dagloon uit de betrekking waaruit hij werkloos werd.

      2 Het bedrag van de loonaanvulling bedraagt de uitkomst van de formule (C – 1) * (B – (D/E)*A)

      in welke formule voorstelt:

      A: het bedrag van het bovenwettelijk maandloon;

      B: het bedrag van inkomen in een kalendermaand;

      C: het voor betrokkene geldende uitkeringspercentage van de bovenwettelijke uitkering;

      D: het aantal uren van de nieuwe dienstbetrekking, waarbij geldt dat indien D groter is dan E, D wordt gemaximeerd
      op E;

      E: het aantal arbeidsuren dat betrokkene gemiddeld per week in de dienstbetrekking waaruit hij werkloos werd
      werkzaam was in de 26 weken voorafgaand aan de kalenderweek waarin de eerste werkloosheidsdag is gelegen.

      Bij een uitkomst kleiner dan nul is de loonaanvulling nihil.

      3 De loonaanvulling eindigt:

      a. zodra de nieuwe dienstbetrekking eindigt;

      b. zodra het totaal aan werkloosheidsuitkering, aanvullende of aansluitende uitkering en inkomen uit de nieuwe
      dienstbetrekking per maand gelijk is aan of hoger is dan het maandloon, of

      c. zodra de voor betrokkene op basis van [artikel 2][ref2] vastgestelde uitkeringsduur is verstreken.

      4 De aanvraag om loonaanvulling wordt binnen drie maanden na het aanvaarden van de nieuwe betrekking ingediend.
      De loonaanvulling wordt door middel van een beschikbaar gesteld formulier aangevraagd. Bij overschrijding van deze
      termijn wordt de loonaanvulling toegekend vanaf het moment dat de aanvraag werd ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0008114#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008114#Artikel2
