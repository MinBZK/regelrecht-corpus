  - number: '21'
    text: Onze Minister is belast met de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0008114/2018-01-01#Artikel21
  - number: '22'
    text: |-
      Dit besluit zoals dat luidde op de dag voorafgaand aan de dag waarop
      [artikel I van de Wet normalisering rechtspositie ambtenaren][ref1] in werking treedt blijft van toepassing ten
      aanzien van ambtenaren die:

      a. op 31 december 2017 verplichte VWNW-kandidaat, als bedoeld in [artikel 49r, onderdeel e][ref2], zijn;

      b. uiterlijk op de dag voorafgaand aan de dag waarop dat artikel in werking treedt verplichte VWNW-kandidaat
      worden, of

      c. ambtenaren die op of na de dag voorafgaand aan de dag waarop dat artikel in werking treedt verplichte VWNW-
      kandidaat worden vanwege een reorganisatiebesluit dat voor die datum is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0039393#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49r
    url: https://wetten.overheid.nl/BWBR0008114/2018-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0039393
        artikel: I
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49r
  - number: '24'
    text: Dit besluit treedt in werking met ingang van 1 januari 2001.
    url: https://wetten.overheid.nl/BWBR0008114/2018-01-01#Artikel24
  - number: '25'
    text: 'Dit besluit kan worden aangehaald als: Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk.'
    url: https://wetten.overheid.nl/BWBR0008114/2018-01-01#Artikel25
