    text: |-
      de ambtenaar in vaste dienst die is aangesteld op basis van het [Algemeen Rijksambtenarenreglement][ref1], het
      [Ambtenarenreglement Staten-Generaal][ref2] of het [Reglement Dienst Buitenlandse Zaken][ref3] en die tengevolge
      van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte werkloos is geworden in de zin van de
      [Werkloosheidswet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0003229
      [ref3]: https://wetten.overheid.nl/BWBR0004052
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
      - id: ref2
        bwb_id: BWBR0003229
      - id: ref3
        bwb_id: BWBR0004052
      - id: ref4
        bwb_id: BWBR0004045
  - number: 1.1.c
    text: |-
      aanvullende uitkering: de aanvullende uitkering bedoeld in [Hoofdstuk 2][ref1] van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0008114#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008114
        hoofdstuk: '2'
  - number: 1.1.d
    text: |-
      aansluitende uitkering: de aansluitende uitkering bedoeld in [Hoofdstuk 3][ref1] van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0008114#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008114
        hoofdstuk: '3'
  - number: 1.1.e
    text: 'bovenwettelijke uitkering: aanvullende en aansluitende uitkering;'
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.f
    text: |-
      dagloon: het dagloon in de zin van [artikel 45 van de Werkloosheidswet][ref1], evenwel zonder toepassing van het
      bedrag, bedoeld in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref2] met betrekking tot
      een loontijdvak van een dag;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '17'
  - number: 1.1.g
    text: |-
      diensttijd: 'voorzover gelegen voor 1 januari 1996: de tijd zoals die voor betrokkene per 31 december 1995'
      meetelt voor de pensioenberekening, bedoeld in de [Algemene burgerlijke pensioenwet](onbekend); voorzover
      gelegen op of na 1 januari 1996: de tijd gedurende welke de betrokkene overheidswerknemer is in de zin van de
      [Wet privatisering ABP][ref1]; in beide gevallen met uitzondering van de tijd:


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: 1.1.g.a
    text: |-
      die voorafgaat aan een ontslag uit een betrekking waaraan een functioneel leeftijdsontslag is verbonden, mits uit
      hoofde van dat ontslag een uitkering is toegekend;
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.g.b
    text: |-
      die in aanmerking is genomen bij de berekening van de duur van een wachtgeld of van een uitkering terzake van
      onvrijwillige werkloosheid ten laste van de overheid;
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.g.c
    text: die voorafgaat aan een onderbreking in de diensttijd door ontslag van langer dan een jaar;
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.g.d
    text: bedoeld in artikel 5.4 van het pensioenreglement;
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.g.e
    text: in een aangehouden betrekking.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.h
    text: |-
      minimumloon: het minimumloon bedoeld in de [Wet minimumloon en minimumvakantiebijslag][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: 1.1.i
    text: 'pensioenreglement: pensioenreglement Stichting Pensioenfonds ABP;'
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.j
    text: 'pensioen: een pensioen in de zin van het pensioenreglement;'
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.k
    text: |-
      privatiseringsoperatie: een operatie die ten doel heeft werkzaamheden van de overheid uit te besteden of over te
      dragen aan een bestaande of voor dat doel opgerichte privaatrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.l
    text: |-
      privaatrechtelijke organisatie: de privaatrechtelijke organisatie die de werkzaamheden uitvoert die in het kader
      van een privatiseringsoperatie door de overheid zijn uitbesteed of overgedragen;
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.m
    text: 'privatiseringsontslag: het ontslag uit een overheidsbetrekking in het kader van een privatiseringsoperatie;'
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.n
    text: 'ontslag als werknemer: het ontslag uit de betrekking bij de privaatrechtelijke organisatie;'
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.o
    text: |-
      suppletie: een suppletie krachtens de [Suppletieregeling gedeeltelijk arbeidsongeschikten sector Rijk][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007758
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007758
  - number: 1.1.p
    text: |-
      werkloosheidsuitkering: een uitkering in de zin van de [Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '1.2'
    text: |-
      Indien op het salaris van de betrokkene op de dag voorafgaande aan het ontslag
      een inhouding werd toegepast op grond van [artikel 21a, vijfde lid][ref1], dan wel
      [artikel 57b, eerste lid, van het Algemeen Rijksambtenarenreglement][ref2], wordt voor het dagloon bedoeld in het
      eerste lid, onderdeel f, uitgegaan van het dagloon zoals dat zou zijn vastgesteld indien geen sprake was geweest
      van bedoelde inhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel57b
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21a
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 57b
  - number: '2.1'
    text: |-
      Met ingang van de dag waarop het ontslag ingaat wordt de duur van de uitkering vastgesteld op drie maanden,
      vermeerderd voor betrokkene:
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel2
  - number: 2.1.a
    text: |-
      die op de dag van ontslag de leeftijd van 21 jaar nog niet heeft bereikt met een periode gelijk aan 18% van de
      diensttijd;
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel2
  - number: 2.1.b
    text: |-
      die op de dag van ontslag 21 jaar oud is met een duur van 19,5% van de diensttijd en zo vervolgens per
      leeftijdsjaar opklimmend met 1,5%;
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel2
  - number: 2.1.c
    text: die op de dag van ontslag 60 jaar of ouder is, met een duur gelijk aan 78% van de diensttijd.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel2
  - number: '2.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid, is de duur van de uitkering in ieder geval gelijk aan de periode
      gedurende welke recht op een werkloosheidsuitkering bestaat.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel2
  - number: '2.3'
    text: |-
      De duur van de uitkering van betrokkene die ten tijde van het ontslag 55 jaar of ouder is en een diensttijd, voor
      zover geldig voor pensioen, van tenminste tien jaar heeft volbracht, wordt na afloop van de termijn, welke op
      basis van het eerste lid is toegekend, verlengd tot de eerste dag van de kalendermaand volgend op die waarin hij de
      leeftijd van 65 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel2
  - number: '3.1'
    text: |-
      De betrokkene heeft gedurende de periode dat recht bestaat op een uitkering krachtens de [Werkloosheidswet][ref1],
      recht op een aanvullende uitkering, met dien verstande dat het recht op een aanvullende uitkering niet eerder
      ingaat dan de dag waarop het ontslag in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '3.2'
    text: |-
      Op de aanvullende uitkering, bedoeld in het eerste lid, zijn de artikelen van [afdeling I van Hoofdstuk IIA]
      (onbekend) en [IIB](onbekend), alsmede de [artikelen 47, tweede en derde lid][ref1], [75][ref2], [76][ref3] en
      [78 van de Werkloosheidswet][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel76
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel78
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '75'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '76'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '78'
  - number: '3.3'
    text: |-
      In afwijking van het tweede lid is [artikel 41 van de Werkloosheidswet][ref1] niet van overeenkomstige
      toepassing op de aanvullende uitkering, bedoeld in het eerste lid en zijn de artikelen [34][ref2] en
      [35 van de Werkloosheidswet][ref3] slechts van overeenkomstige toepassing op de aanvullende uitkering indien de
      hoogte van de in mindering te brengen inkomsten de uitkering krachtens de [Werkloosheidswet][ref4] overstijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0004045
  - number: '4.1'
    text: |-
      De uitkering krachtens de [Werkloosheidswet][ref1] wordt aangevuld tot 70% van het voor betrokkene geldende
      dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '4.2'
    text: |-
      Voor de toepassing van dit artikel wordt de uitkering krachtens de [Werkloosheidswet][ref1] steeds geacht door
      betrokkene onverminderd te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '5.1'
    text: |-
      Indien de betrokkene gedurende de periode dat hij krachtens de [Werkloosheidswet][ref1] recht heeft op een
      uitkering, wegens ziekte verhinderd wordt arbeid te verrichten en deswege een uitkering geniet krachtens de
      [Ziektewet][ref2], wordt die uitkering krachtens de [Ziektewet][ref3] aangevuld tot 70% van het voor betrokkene
      geldende dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0001888
  - number: '5.2'
    text: |-
      Voor de toepassing van dit artikel wordt de uitkering krachtens de [Ziektewet][ref1] steeds geacht onverminderd
      door betrokkene te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 5a.1
    text: |-
      De uitkering krachtens de [Wet arbeid en zorg][ref1] die betrokkene heeft, wordt


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 5a.1.a
    text: |-
      in verband met haar zwangerschap en bevalling gedurende ten minste 16 weken aangevuld tot 100% van het voor haar
      geldende dagloon, en wel voor de periode
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel5a
  - number: 5a.1.a.1°
    text: |-
      die aanvangt zes weken voor de vermoedelijke datum van bevalling, zoals aangegeven in een schriftelijke verklaring
      van een arts of verloskundige, tot en met de dag van de bevalling. Indien de betrokkene dat wenst, vangt het recht
      op uitkering in verband met zwangerschap aan op een later tijdstip, doch uiterlijk vier weken voor de dag na de
      vermoedelijk datum van bevalling; en
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel5a
  - number: 5a.1.a.2°
    text: |-
      die aanvangt op de dag na de bevalling en bedraagt tien aaneengesloten weken of zoveel meer als het aantal dagen
      dat de uitkering in verband met zwangerschap minder dan zes weken heeft geduurd; of
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel5a
  - number: 5a.1.b
    text: |-
      in verband met adoptie gedurende ten hoogste vier aaneengesloten weken vanaf twee weken vóór de eerste dag dat de
      feitelijke opneming ter adoptie een aanvang heeft genomen of zal nemen, aangevuld tot 100% van het voor betrokkene
      geldende dagloon; of
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel5a
  - number: 5a.1.c
    text: |-
      in verband met het opnemen van een pleegkind gedurende ten hoogste vier aaneengesloten weken vanaf twee weken vóór
      de eerste dag dat de feitelijke opneming van het pleegkind een aanvang heeft genomen of zal nemen, aangevuld tot
      100% van het voor betrokkene geldende dagloon.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel5a
  - number: 5a.2
    text: |-
      Voor de toepassing van dit artikel wordt de uitkering krachtens de [Wet arbeid en zorg][ref1] steeds geacht
      onverminderd door betrokkene te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: '6.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van betrokkene wordt de uitkering bedoeld in
      [artikel 35 van de Ziektewet][ref1] aangevuld tot 100% van het voor betrokkene geldende dagloon over een tijdvak
      van 3 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
  - number: '6.2'
    text: |-
      Voor de toepassing van het eerste lid wordt de uitkering krachtens de [Ziektewet][ref1] steeds geacht onverminderd
      door betrokkene te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '7'
    text: |-
      Indien ten aanzien van de werkloosheidsuitkering die betrokkene krachtens de [Werkloosheidswet][ref1] of krachtens
      de [Ziektewet][ref2] geniet een verplichting of een sanctie wordt opgelegd, wordt die verplichting eveneens
      opgelegd dan wel die sanctie op overeenkomstige wijze toegepast op de aanvullende uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
  - number: '8.1'
    text: |-
      Indien op het moment van ontslag de duur van de uitkering berekend op basis van [artikel 2][ref1] van dit besluit
      langer is dan de duur van de uitkering berekend op basis van de [Werkloosheidswet][ref2], heeft betrokkene, die het
      einde van de uitkeringsduur krachtens de [Werkloosheidswet][ref3] heeft bereikt, met ingang van dat moment recht
      op een aansluitende uitkering, met dien verstande dat de verloren arbeidsuren waarvoor hij geen betrokkene is geen
      aanspraak geven op een uitkering krachtens dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008114#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008114
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0004045
  - number: '8.2'
    text: |-
      Op de aansluitende uitkering zijn de artikelen van [Hoofdstuk IIA, afdeling I](onbekend), en de
      [artikelen 75][ref1], [76][ref2] en [78 van de Werkloosheidswet][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel78
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '76'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '78'
  - number: '8.3'
    text: |-
      In afwijking van het tweede lid zijn de [artikelen 19, eerste lid, onderdelen a, b en i][ref1], en
      [20, eerste lid, onderdeel e, van de Werkloosheidswet][ref2], niet van overeenkomstige toepassing op de
      aansluitende uitkering, bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '20'
  - number: '8.4'
    text: |-
      Het recht op aansluitende uitkering eindigt na ommekomst van de duur van de aansluitende uitkering, maar uiterlijk
      op de eerste dag van de kalendermaand volgend op die waarin de betrokkene de leeftijd van 65 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel8
  - number: '9'
    text: |-
      De duur van de aansluitende uitkering is de op het moment van ontslag berekende uitkeringsduur op basis van
      [artikel 2, eerste en tweede lid][ref1], van dit besluit verminderd met de terzake van dat ontslag berekende
      uitkeringsduur krachtens de [Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008114#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008114
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004045
  - number: '10.1'
    text: De aansluitende uitkering bedraagt 70% van het voor betrokkene geldende dagloon.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel10
  - number: '10.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid bedraagt de aansluitende uitkering van de betrokkene die ten
      tijde van het ontslag de leeftijd van 55 jaar nog niet had bereikt, in de laatste twee jaar voor ommekomst van
      de aansluitende uitkering, 75% van het minimumloon dat voor betrokkene zou gelden, doch ten hoogste 70% van het
      dagloon.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel10
  - number: '10.3'
    text: |-
      Ten aanzien van de hoogte van de aansluitende uitkering zijn de [artikelen 45][ref1] en
      [47, tweede en derde lid, van de Werkloosheidswet][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel47
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '47'
  - number: '11.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van betrokkene wordt onder overeenkomstige toepassing van
      [artikel 35 van de Ziektewet][ref1] een overlijdensuitkering toegekend ten bedrage van 100% van het voor betrokkene
      geldende dagloon over een tijdvak van 3 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
  - number: '11.2'
    text: |-
      Op het uit te keren bedrag, bedoeld in het eerste lid, wordt in mindering gebracht het bedrag van de uitkering
      waarop de nagelaten betrekkingen van betrokkene ter zake van diens overlijden aanspraak kunnen maken uit
      hoofde van een of meer werkloosheidsuitkeringen, arbeidsongeschiktheidsuitkeringen, uitkeringen op grond van de
      [Ziektewet][ref1] danwel uitkeringen die naar aard en strekking overeenkomen met laatstgenoemde uitkeringen, waarop
      betrokkene recht had. Alleen uitkeringen die voortvloeien uit de dienstbetrekking op grond waarvan de uitkering
      bedoeld in het eerste lid wordt toegekend worden in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '12.1'
    text: |-
      Voor betrokkene, die terzake van eenzelfde ontslag recht op een bovenwettelijke uitkering krachtens dit besluit
      en recht op een suppletie heeft, komt gedurende de termijn dat hij recht heeft op die suppletie het recht op een
      bovenwettelijke uitkering niet tot uitbetaling.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel12
  - number: '12.2'
    text: |-
      Betrokkene, bedoeld in het eerste lid, heeft met ingang van de eerste dag volgende op die waarop de suppletie op
      grond van [artikel 5, onderdeel ][ref1] is geëindigd, recht op een bovenwettelijke uitkering krachtens dit besluit,
      voor de periode dat de duur van de bovenwettelijke uitkering, waarop betrokkene krachtens dit besluit recht zou
      hebben gehad indien hij geen recht op suppletie zou hebben gehad, langer is dan de duur van de suppletie.


      [ref1]: https://wetten.overheid.nl/BWBR0007758#Artikel5
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007758
        artikel: '5'
  - number: '13.1'
    text: |-
      Betrokkene, die terzake van een ontslag wegens ongeschiktheid tot het verrichten van zijn arbeid wegens
      ziekte recht heeft op een WAO-uitkering, berekend naar een arbeidsongeschiktheid van 80% of meer, heeft recht
      op een bovenwettelijke uitkering krachtens dit besluit op het moment dat de mate van arbeidsongeschiktheid
      op een lager percentage wordt vastgesteld dan 80% en daardoor recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref1]. Indien de WAO-uitkering, als bedoeld in de eerste volzin, is ontstaan uit twee of
      meer dienstbetrekkingen wordt het recht op bovenwettelijke uitkering krachtens dit besluit toegerekend aan de
      dienstbetrekking ter zake waarvan hij betrokkene is in de zin van dit besluit, naar rato van de feitelijk genoten
      inkomsten uit hoofde van de desbetreffende dienstbetrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '13.2'
    text: |-
      Ter bepaling van de duur van de bovenwettelijke uitkering krachtens [artikel 2][ref1] van dit besluit wordt
      uitgegaan van de datum van het ontslag, als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008114#Artikel2
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008114
        artikel: '2'
        hoofdstuk: '1'
  - number: '14.1'
    text: |-
      Indien het recht op een bovenwettelijke uitkering geheel of gedeeltelijk is geëindigd wegens het gaan
      verrichten van arbeid als werknemer en betrokkene vervolgens wederom werkloos is geworden in de zin van de
      [Werkloosheidswet][ref1], herleeft op zijn verzoek het recht op een bovenwettelijke uitkering voor zover er een
      nieuw recht op een uitkering krachtens de [Werkloosheidswet][ref2] bestaat, met ingang van de eerste dag waarop
      het nieuwe recht op uitkering krachtens de [Werkloosheidswet][ref3] is ontstaan. De duur en de hoogte van de
      bovenwettelijke uitkering zijn gelijk aan de duur en hoogte van de uitkering waarop betrokkene op grond van dit
      besluit nog recht zou hebben gehad indien hij onafgebroken werkloos zou zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0004045
  - number: '14.2'
    text: |-
      Betrokkene aan wie een ontslag is verleend en die onmiddellijk aansluitend aan dat ontslag arbeid als werknemer
      gaat verrichten en die werkloos wordt in de zin van de [Werkloosheidswet][ref1], heeft op zijn verzoek recht
      op een bovenwettelijke uitkering krachtens dit besluit voor zover er een recht op een uitkering krachtens de
      [Werkloosheidswet][ref2] zou bestaan op het moment van ontslagverlening en voor zover er een recht op uitkering
      krachtens de [Werkloosheidswet][ref3] bestaat op het moment van werkloos worden, met ingang van de eerste
      dag waarop recht op uitkering krachtens de [Werkloosheidswet][ref4] is ontstaan. De duur en hoogte van de
      bovenwettelijke uitkering zijn gelijk aan de duur en hoogte van de bovenwettelijke uitkering, waarop betrokkene op
      het moment van ontslag recht zou hebben gehad, met dien verstande dat het recht op bovenwettelijke uitkering ingaat
      met ingang van de dag waarop het ontslag is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0004045
  - number: '14.3'
    text: |-
      De betrokkene die binnen twee jaar na het privatiseringsontslag als werknemer is ontslagen ten gevolge
      van opheffing van zijn betrekking bij de privaatrechtelijke organisatie of overtolligheid van personeel
      door verandering of inkrimping van die organisatie, die daardoor werkloos wordt in de zin van de
      [Werkloosheidswet][ref1] en ten aanzien van wie een recht op uitkering krachtens de [Werkloosheidswet][ref2]
      bestaat, heeft op zijn verzoek recht op een bovenwettelijke uitkering krachtens dit besluit. De duur en hoogte van
      de bovenwettelijke uitkering zijn gelijk aan de duur en hoogte van de bovenwettelijke uitkering, waarop betrokkene
      op het moment van privatiseringsontslag recht zou hebben gehad, met dien verstande dat het recht op bovenwettelijke
      uitkering ingaat met ingang van de dag van het ontslag als werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
  - number: '14.4'
    text: |-
      Een recht op een bovenwettelijke uitkering, als bedoeld in het eerste en tweede lid, kan slechts ontstaan gedurende
      de termijn welke betrokkene in het geval dat hij onafgebroken werkloos zou zijn geweest, een bovenwettelijke
      uitkering terzake van dat ontslag zou hebben genoten.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel14
  - number: '15.1'
    text: |-
      Betrokkene, wiens recht op uitkering geheel of gedeeltelijk is beëindigd wegens het gaan verrichten van arbeid als
      werknemer, ontvangt op zijn verzoek, gedurende de voor hem op de datum van ontslag vastgestelde uitkeringsduur,
      voor zover deze nog niet is verstreken, een loonaanvulling, indien het dagloon in de nieuwe betrekking minder
      bedraagt dan het dagloon uit de betrekking waaruit hij werkloos werd.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel15
  - number: '15.2'
    text: |-
      De loonaanvulling vervalt met ingang van de dag, waarop de betrokkene opnieuw volledig werkloos wordt of niet meer
      voldoet aan de voorwaarde, bedoeld in het eerste lid of als de duur van de uitkering is verstreken.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel15
  - number: '15.3'
    text: |-
      De hoogte van de loonaanvulling is gelijk aan het verschil tussen het dagloon in zijn nieuwe betrekking en het
      dagloon van de betrekking waaruit betrokkene werkloos is geworden.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel15
  - number: '15.4'
    text: |-
      De loonaanvulling wordt proportioneel toegekend, indien de omvang van de nieuwe betrekking minder bedraagt dan de
      betrekking waaruit de betrokkene is ontslagen. Indien de omvang van de nieuwe betrekking groter is dan de omvang
      van de betrekking waaruit de betrokkene is ontslagen, bedraagt de hoogte van de loonaanvulling het feitelijke
      verschil in dagloon tussen de oude en nieuwe betrekking.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel15
  - number: '15.5'
    text: |-
      De aanvraag om loonaanvulling wordt binnen drie maanden na het aanvaarden van de nieuwe betrekking ingediend. De
      loonaanvulling wordt door middel van een beschikbaar gesteld formulier aangevraagd. Bij overschrijding van deze
      termijn wordt de loonaanvulling toegekend vanaf het moment dat de aanvraag werd ingediend.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel15
  - number: '15.6'
    text: |-
      De loonaanvulling vormt geen onderdeel van het ambtelijk inkomen en telt niet mee voor de berekening van het
      pensioen.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel15
  - number: '16'
    text: |-
      Aan de betrokkene, die buiten de rijksdienst arbeid of bedrijf ter hand gaat nemen, kan op zijn verzoek ter zake
      van de kosten, die voor hem aan een daartoe nodige verhuizing zijn verbonden, een eenmalige tegemoetkoming worden
      toegekend van € 1 361,34 onder verrekening van een tegemoetkoming in verhuiskosten uit anderen hoofde.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel16
  - number: '17'
    text: |-
      Op aanvraag van betrokkene kan het recht op bovenwettelijke uitkering op grond van dit besluit voor 30% van de
      nominale waarde worden afgekocht.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel17
  - number: '18'
    text: |-
      In afwijking van de [artikelen 4][ref1] en [10][ref2] van dit besluit
      bedraagt het percentage 67% in plaats van 70% van het dagloon, zolang de
      __REF002___________________________________________________________________________________________________________
      _________________________________________________________________________________________________________ (*Stb*.
      657) op betrokkene van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0008114#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008114#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003739
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008114
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008114
        artikel: '10'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0003739
  - number: '19.1'
    text: |-
      Indien het niveau van de uitkering krachtens de [Werkloosheidswet][ref1] een algemeen neerwaartse wijziging
      ondergaat, wordt deze neerwaartse wijziging, behoudens indien in het Sectoroverleg Rijkspersoneel overeenstemming
      wordt bereikt, binnen zes maanden na de datum van het *Staatsblad* waarin de maatregel is gepubliceerd, op
      overeenkomstige wijze doorgevoerd ten aanzien van het totaal aan wettelijke en bovenwettelijke aanspraken van
      betrokkene, vanaf de in het *Staatsblad* vermelde datum van inwerkingtreding van bedoelde maatregel, doch niet
      eerder dan zes maanden na de datum van het *Staatsblad*.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '19.2'
    text: |-
      Indien in het overleg als bedoeld in het eerste lid, een geschil ontstaat, wordt de doorvoering van de
      neerwaartse wijziging in afwijking van het eerste lid, opgeschort met ingang van de dag waarop het geschil
      voor advies dan wel arbitrale uitspraak is voorgelegd aan de Advies- en Arbitragecommissie, genoemd in
      [artikel 110g van het Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 110g
  - number: '20'
    text: |-
      Het dagloon wordt steeds aangepast overeenkomstig een algemene wijziging van het salaris, van de vakantie-uitkering
      en van de eindejaarsuitkering van het burgerlijk rijkspersoneel, met ingang van de dag waarop die wijziging van het
      salaris, de vakantie-uitkering respectievelijk de eindejaarsuitkering van kracht wordt.
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel20
  - number: 20a
    text: |-
      Ten aanzien van de betrokkene van wie de ingangsdatum van het ontslag gelegen is op of na 11 augustus 2003 en
      voor 1 januari 2006, wordt voor de toepassing van [artikel 2, tweede lid][ref1], uitgegaan van de bepalingen in de
      [Werkloosheidswet][ref2] zoals deze luidden op 10 augustus 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0008114#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0008114
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004045
  - number: 20b
    text: |-
      Ten aanzien van de betrokkene die op de dag vóór 1 januari 2006 recht had op een bovenwettelijke uitkering op basis
      van dit besluit, zijn de [artikelen 4][ref1], [5][ref2], [10][ref3] en [18][ref4], zoals die luidden op de dag
      vóór 1 januari 2006 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008114#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008114#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008114#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0008114#Artikel18
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel20b
    references:
      - id: ref1
