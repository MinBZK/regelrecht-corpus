    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 31 juli 1995, nr. AD95/U734, directoraat-generaal
    Management en Personeelsbeleid, directie Personeelsmanagement Rijksdienst, afdeling Arbeidsvoorwaarden en Sociaal
    Beleid;

    Gelet op artikel 125, eerste lid, van de Ambtenarenwet;

    De Raad van State gehoord (advies van 14 november 1995, nr. W0.95.0423.);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 12 juni 1996, nr. AD95/1165, directoraat-
    generaal Management en Personeelsbeleid, directie Personeelsmanagement Rijksdienst, afdeling Arbeidsvoorwaarden en
    Sociaal Beleid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#ArtikelAanhef
