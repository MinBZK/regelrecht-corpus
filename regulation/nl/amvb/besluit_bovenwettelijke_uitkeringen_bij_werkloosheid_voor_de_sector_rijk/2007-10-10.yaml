  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.b
    text: 'betrokkene:'
    url: https://wetten.overheid.nl/BWBR0008114/2007-10-10#Artikel1
  - number: 1.1.b.1e
    text: |-
      de ambtenaar in vaste dienst, die op basis van het [Algemeen Rijksambtenarenreglement][ref1], het
      [Ambtenarenreglement Staten-Generaal][ref2] of het [Reglement Dienst Buitenlandse Zaken][ref3] in
      burgerlijke rijksdienst werkzaam is of is geweest en die ten gevolge van een ontslag, met uitzondering
      van een ontslag op grond van de artikelen [81, eerste lid, onder l][ref4], [94a, eerste lid][ref5], en
      [97, eerste lid, van het Algemeen Rijksambtenarenreglement][ref6], de [artikelen 116, eerste lid, onderdeel l][ref7],
      en [124a, eerste lid, van het Ambtenarenreglement Staten-Generaal][ref8], of de [artikelen 91][ref9] en
      [101, dertiende en veertiende lid, van het Reglement Dienst Buitenlandse Zaken][ref10], werkloos is geworden in de
      zin van de [Werkloosheidswet][ref11];


