  - number: 20f
    text: |-
      Ten aanzien van de ambtenaar:

      a. die in de periode van 1 januari 2012 tot en met 14 april 2013 is aangewezen als herplaatsingskandidaat als
      bedoeld in [artikel 49d][ref1] of [artikel 49e, tweede lid, van het Algemeen Rijksambtenarenreglement][ref2],
      [artikel 84d][ref3] of [artikel 84e, tweede lid, van Ambtenarenreglement Staten-Generaal][ref4] of
      [artikel 58c][ref5] of [artikel 58d, tweede lid, van het Reglement Dienst Buitenlandse Zaken][ref6],
      en van wie het ontslag, bedoeld in [artikel 96 van het Algemeen Rijksambtenarenreglement][ref7],
      [artikel 126 van het Ambtenarenreglement Staten-Generaal][ref8] of
      [artikel 99 van het Reglement Dienst Buitenlandse Zaken][ref9], ingaat op of na het tijdstip van inwerkingtreding
      van het Besluit van [..] houdende wijziging van het Algemeen Rijksambtenarenreglement, het Ambtenarenreglement
      Staten-Generaal, het Reglement Dienst Buitenlandse Zaken, het Besluit bovenwettelijke uitkeringen bij werkloosheid
      voor de sector Rijk en het Rijkswachtgeldbesluit 1959 in verband met de verhoging van de pensioengerechtigde
      leeftijd (Stb. 2014, nr. 000), of

      b. van wie het moment van ontslag ligt in de periode vanaf 1 juli 2013 tot en met de dag voor het tijdstip
      van inwerkingtreding van het Besluit van [..] houdende wijziging van het Algemeen Rijksambtenarenreglement,
      het Ambtenarenreglement Staten-Generaal, het Reglement Dienst Buitenlandse Zaken, het Besluit bovenwettelijke
      uitkeringen bij werkloosheid voor de sector Rijk en het Rijkswachtgeldbesluit 1959 in verband met de verhoging van
      de pensioengerechtigde leeftijd (Stb. 2014, nr. 000),

      blijft [artikel 2, tweede lid][ref10], van dit besluit van toepassing zoals dat luidde voor dat tijdstip, met dien
      verstande dat de uitkeringsduur wordt verlengd tot de dag waarop hij de pensioengerechtigde leeftijd bereikt.


