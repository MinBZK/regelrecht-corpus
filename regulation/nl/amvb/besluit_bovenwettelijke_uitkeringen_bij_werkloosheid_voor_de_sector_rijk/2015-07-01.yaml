      Indien voor 1 oktober 2006 sprake was van aftrek van arbeidsinkomsten met toepassing of overeenkomstige toepassing
      van [artikel 35 van de Werkloosheidswet][ref1], zoals dat artikel luidde op 30 september 2006 worden, zolang op
