  - number: '15'
    text: >-
      1 Betrokkene, wiens recht op uitkering geheel of gedeeltelijk is beëindigd wegens het gaan verrichten van arbeid
      als werknemer, ontvangt op zijn verzoek, gedurende de voor hem op de datum van ontslag vastgestelde uitkeringsduur,
      voor zover deze nog niet is verstreken, een loonaanvulling, indien het dagloon in de nieuwe betrekking minder
      bedraagt dan het dagloon uit de betrekking waaruit hij werkloos werd.


      2 De loonaanvulling vervalt met ingang van de dag, waarop de betrokkene opnieuw volledig werkloos wordt of niet
      meer voldoet aan de voorwaarde, bedoeld in het eerste lid of als de duur van de uitkering is verstreken.


      3 De hoogte van de loonaanvulling is gelijk aan het verschil tussen het dagloon in zijn nieuwe betrekking en het
      dagloon van de betrekking waaruit betrokkene werkloos is geworden.


      4 De loonaanvulling wordt proportioneel toegekend, indien de omvang van de nieuwe betrekking minder bedraagt dan
      de betrekking waaruit de betrokkene is ontslagen. Indien de omvang van de nieuwe betrekking groter is dan de omvang
      van de betrekking waaruit de betrokkene is ontslagen, bedraagt de hoogte van de loonaanvulling het feitelijke
      verschil in dagloon tussen de oude en nieuwe betrekking.


      5 De aanvraag om loonaanvulling wordt binnen drie maanden na het aanvaarden van de nieuwe betrekking ingediend.
      De loonaanvulling wordt door middel van een beschikbaar gesteld formulier aangevraagd. Bij overschrijding van deze
      termijn wordt de loonaanvulling toegekend vanaf het moment dat de aanvraag werd ingediend.
    url: https://wetten.overheid.nl/BWBR0008114/2015-07-01#Artikel15
  - number: '16'
    text: >-
      Aan de betrokkene, die buiten de rijksdienst arbeid of bedrijf ter hand gaat nemen, kan op zijn verzoek ter zake
      van de kosten, die voor hem aan een daartoe nodige verhuizing zijn verbonden, een eenmalige tegemoetkoming worden
      toegekend van € 1 361,34 onder verrekening van een tegemoetkoming in verhuiskosten uit anderen hoofde.
    url: https://wetten.overheid.nl/BWBR0008114/2015-07-01#Artikel16
  - number: '17'
    text: >-
      Op aanvraag van betrokkene kan het recht op bovenwettelijke uitkering op grond van dit besluit voor 30% van de
      nominale waarde worden afgekocht.
    url: https://wetten.overheid.nl/BWBR0008114/2015-07-01#Artikel17
