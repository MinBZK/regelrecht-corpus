      1 Ten aanzien van de betrokkene die op 31 december 2011 recht had op een bovenwettelijke uitkering op basis van dit
      besluit, blijft dit besluit van toepassing zoals het op die dag luidde, met dien verstande dat voor de ambtenaar
      bedoeld in artikel 2, derde lid van het besluit zoals dit gold op 31 december 2011, de uitkeringsduur wordt
      verlengd tot de dag waarop betrokkene de pensioengerechtigde leeftijd bereikt.

      2 Ten aanzien van de ambtenaar die voor 1 januari 2012 is aangewezen als herplaatsingskandidaat als bedoeld
      in [artikel 49d][ref1] of [artikel 49e, tweede lid, van het Algemeen Rijksambtenarenreglement][ref2],
      [artikel 84d][ref3] of [artikel 84e, tweede lid, van Ambtenarenreglement Staten-Generaal][ref4] en
      [artikel 58c][ref5] of [artikel 58d, tweede lid, van het Reglement Dienst Buitenlandse Zaken][ref6]
      en waarvan het ontslag, bedoeld in [artikel 96 van het Algemeen Rijksambtenarenreglemen][ref7]t
      respectievelijk in [artikel 126 van het Ambtenarenreglement Staten-Generaal][ref8] of in
      [artikel 99 van het Reglement Dienst Buitenlandse Zaken][ref9], ingaat op of na 1 januari 2012, blijft
      [artikel 2][ref10] van dit besluit van toepassing zoals het op 31 december 2011 luidde, met dien verstande dat de
      uitkeringsduur wordt verlengd tot de dag waarop betrokkene de pensioengerechtigde leeftijd bereikt.


