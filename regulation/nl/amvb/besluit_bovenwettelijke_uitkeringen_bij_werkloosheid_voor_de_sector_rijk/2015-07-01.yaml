      - id: ref2
        bwb_id: BWBR0013008
  - number: '6'
    text: |-
      1 Zo spoedig mogelijk na het overlijden van betrokkene wordt de uitkering bedoeld in [artikel 35][ref1] of
      [36 van de Ziektewet][ref2] aangevuld tot 100% van het voor betrokkene geldende dagloon over een tijdvak van
      3 maanden.

      2 Voor de toepassing van het eerste lid wordt de betrokkene geacht steeds onverminderd ziekengeld te hebben
      genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel36
    url: https://wetten.overheid.nl/BWBR0008114/2015-07-01#Artikel6
