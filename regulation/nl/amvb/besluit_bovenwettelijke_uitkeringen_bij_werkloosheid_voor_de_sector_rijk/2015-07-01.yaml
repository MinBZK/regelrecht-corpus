        artikel: '2'
        hoofdstuk: '1'
  - number: '14'
    text: |-
      1 Indien het recht op een bovenwettelijke uitkering geheel of gedeeltelijk is geëindigd wegens het gaan
      verrichten van arbeid als werknemer en betrokkene vervolgens wederom werkloos is geworden in de zin van de
      [Werkloosheidswet][ref1], herleeft op zijn verzoek het recht op een bovenwettelijke uitkering voor zover er een
      nieuw recht op een uitkering krachtens de [Werkloosheidswet][ref2] bestaat, met ingang van de eerste dag waarop
      het nieuwe recht op uitkering krachtens de [Werkloosheidswet][ref3] is ontstaan. De duur en de hoogte van de
      bovenwettelijke uitkering zijn gelijk aan de duur en hoogte van de uitkering waarop betrokkene op grond van dit
      besluit nog recht zou hebben gehad indien hij onafgebroken werkloos zou zijn geweest.

      2 Betrokkene aan wie een ontslag is verleend en die onmiddellijk aansluitend aan dat ontslag arbeid als werknemer
      gaat verrichten en die werkloos wordt in de zin van de [Werkloosheidswet][ref4], heeft op zijn verzoek recht
      op een bovenwettelijke uitkering krachtens dit besluit voor zover er een recht op een uitkering krachtens de
      [Werkloosheidswet][ref5] zou bestaan op het moment van ontslagverlening en voor zover er een recht op uitkering
      krachtens de [Werkloosheidswet][ref6] bestaat op het moment van werkloos worden, met ingang van de eerste
      dag waarop recht op uitkering krachtens de [Werkloosheidswet][ref7] is ontstaan. De duur en hoogte van de
      bovenwettelijke uitkering zijn gelijk aan de duur en hoogte van de bovenwettelijke uitkering, waarop betrokkene op
      het moment van ontslag recht zou hebben gehad, met dien verstande dat het recht op bovenwettelijke uitkering ingaat
      met ingang van de dag waarop het ontslag is verleend.

      3 De betrokkene die binnen twee jaar na het privatiseringsontslag als werknemer is ontslagen ten gevolge
      van opheffing van zijn betrekking bij de privaatrechtelijke organisatie of overtolligheid van personeel
      door verandering of inkrimping van die organisatie, die daardoor werkloos wordt in de zin van de
      [Werkloosheidswet][ref8] en ten aanzien van wie een recht op uitkering krachtens de [Werkloosheidswet][ref9]
      bestaat, heeft op zijn verzoek recht op een bovenwettelijke uitkering krachtens dit besluit.

      De duur en hoogte van de bovenwettelijke uitkering zijn gelijk aan de duur en hoogte van de bovenwettelijke
      uitkering, waarop betrokkene op het moment van privatiseringsontslag recht zou hebben gehad, met dien verstande dat
      het recht op bovenwettelijke uitkering ingaat met ingang van de dag van het ontslag als werknemer.

      4 Een recht op een bovenwettelijke uitkering, als bedoeld in het eerste en tweede lid, kan slechts ontstaan
      gedurende de termijn welke betrokkene in het geval dat hij onafgebroken werkloos zou zijn geweest, een
      bovenwettelijke uitkering terzake van dat ontslag zou hebben genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0004045
      [ref6]: https://wetten.overheid.nl/BWBR0004045
