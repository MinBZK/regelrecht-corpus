  - number: '2'
    text: |-
      1 De uitkeringsduur van de bovenwettelijke uitkering bedraagt drie maal de uitkeringsduur zoals vastgesteld op
      grond van [hoofdstuk 2, paragraaf 4, van de Werkloosheidswet][ref1].

      2 De uitkeringsduur, bedoeld in het eerste lid, wordt verlengd tot de dag waarop betrokkene de pensioengerechtigde
      leeftijd bereikt, indien het moment van ontslag ten hoogste acht jaar ligt voor die leeftijd en hij direct
      voorafgaand aan het ontslag een diensttijd van ten minste tien jaar heeft volbracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0008114/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        paragraaf: '4'
  - number: '3'
    text: |-
      1 De betrokkene heeft gedurende de periode dat recht bestaat op een uitkering krachtens de
      [Werkloosheidswet][ref1], recht op een aanvullende uitkering, met dien verstande dat het recht op een aanvullende
      uitkering niet eerder ingaat dan de dag waarop het ontslag in werking treedt.

      2 Op de aanvullende uitkering, bedoeld in het eerste lid, zijn [hoofdstuk II, paragrafen 1 tot en met 3][ref2],
      alsmede de [artikelen 47, tweede en derde lid][ref3], [75][ref4], [76][ref5], [76a][ref6], [77a][ref7] en
      [78 van de Werkloosheidswet][ref8] van overeenkomstige toepassing.

      3 In afwijking van het tweede lid is [artikel 41 van de Werkloosheidswet][ref9] niet van overeenkomstige
      toepassing op de aanvullende uitkering, bedoeld in het eerste lid en zijn de [artikelen 34][ref10], [35a][ref11] en
      [35aa van de Werkloosheidswet][ref12] slechts van overeenkomstige toepassing op de aanvullende uitkering indien de
      hoogte van de in mindering te brengen inkomsten de uitkering krachtens de [Werkloosheidswet][ref13] overstijgen.


