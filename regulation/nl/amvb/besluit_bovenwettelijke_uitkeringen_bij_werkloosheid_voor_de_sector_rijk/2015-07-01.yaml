      1 De uitkering krachtens de [Werkloosheidswet][ref1] wordt aangevuld tot 70% van het voor betrokkene geldende
      dagloon.

      2 Voor de toepassing van dit artikel wordt de uitkering krachtens de [Werkloosheidswet][ref2] steeds geacht door
      betrokkene onverminderd te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
