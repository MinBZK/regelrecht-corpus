articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. betrokkene:

      1e. de ambtenaar in vaste dienst, die op basis van het [Algemeen Rijksambtenarenreglement][ref1], het
      [Ambtenarenreglement Staten-Generaal][ref2] of het [Reglement Dienst Buitenlandse Zaken][ref3] in burgerlijke
      rijksdienst werkzaam is of is geweest en die ten gevolge van een ontslag, met uitzondering van een ontslag op grond
      van de artikelen [81, eerste lid, onder l][ref4], [94a, eerste lid][ref5], en [97, tweede en derde lid][ref6],
      [130c][ref7] en [130d, eerste lid, van het Algemeen Rijksambtenarenreglement][ref8],
      de [artikelen 116, eerste lid, onderdeel l][ref9], en
      [124a, eerste lid, van het Ambtenarenreglement Staten-Generaal][ref10], of
      [artikel 87, eerste lid, onder l, van het Reglement Dienst Buitenlandse Zaken][ref11], werkloos is geworden in de
      zin van de [Werkloosheidswet][ref12];

      2e. de ambtenaar in vaste dienst die is aangesteld op basis van het [Algemeen Rijksambtenarenreglement][ref13],
      het [Ambtenarenreglement Staten-Generaal][ref14] of het [Reglement Dienst Buitenlandse Zaken][ref15] en die
      tengevolge van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte werkloos is geworden in de zin van
      de [Werkloosheidswet][ref16];

      c. aanvullende uitkering: de aanvullende uitkering bedoeld in [Hoofdstuk 2][ref17] van dit besluit;

      d. aansluitende uitkering: de aansluitende uitkering bedoeld in [Hoofdstuk 3][ref18] van dit besluit;

      e. bovenwettelijke uitkering: aanvullende en aansluitende uitkering;

      f. dagloon: het dagloon in de zin van [artikel 45 van de Werkloosheidswet][ref19], evenwel zonder toepassing
      van het bedrag, bedoeld in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref20] met
      betrekking tot een loontijdvak van een dag;

      g. diensttijd:

      voorzover gelegen voor 1 januari 1996:

      de tijd zoals die voor betrokkene per 31 december 1995 meetelt voor de pensioenberekening, bedoeld in de [Algemene
      burgerlijke pensioenwet](onbekend);

      voorzover gelegen op of na 1 januari 1996:

      de tijd gedurende welke de betrokkene overheidswerknemer is in de zin van de [Wet privatisering ABP][ref21];

      in beide gevallen met uitzondering van de tijd:

      a. die voorafgaat aan een ontslag uit een betrekking waaraan een functioneel leeftijdsontslag is verbonden, mits
      uit hoofde van dat ontslag een uitkering is toegekend;

      b. die in aanmerking is genomen bij de berekening van de duur van een wachtgeld of van een uitkering terzake van
      onvrijwillige werkloosheid ten laste van de overheid;

      c. die voorafgaat aan een onderbreking in de diensttijd door ontslag van langer dan een jaar;

      d. bedoeld in artikel 5.4 van het pensioenreglement;

      e. in een aangehouden betrekking.

      Bij de bepaling van diensttijd wordt in voorkomend geval de diensttijd, bedoeld in [artikel D1, tweede lid, van de
      Algemene burgerlijke pensioenwet ](onbekend) zoals deze luidde op 31 december 1995 mede in aanmerking genomen. Het
      verzoek als bedoeld in [artikel D2 van genoemde wet](onbekend) wordt daarbij geacht te zijn gedaan.

      Indien en voor zover diensttijd bij de berekening van de bovenwettelijke uitkering in aanmerking is genomen, met
      een overheidspensioen, anders dan ten laste van de Stichting Pensioenfonds ABP, wordt vergolden, worden de duur
      en het bedrag van de bovenwettelijke uitkering met ingang van de dag waarop dit pensioen is ingegaan herberekend,
      waarbij die diensttijd buiten beschouwing wordt gelaten;

      h. minimumloon: het minimumloon bedoeld in de [Wet minimumloon en minimumvakantiebijslag][ref22];

      i. pensioenreglement: pensioenreglement Stichting Pensioenfonds ABP;

      j. pensioen: een pensioen in de zin van het pensioenreglement;

      k. pensioengerechtigde leeftijd: de leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref23];

      l. privatiseringsoperatie: een operatie die ten doel heeft werkzaamheden van de overheid uit te besteden of over te
      dragen aan een bestaande of voor dat doel opgerichte privaatrechtelijke organisatie;

      m. privaatrechtelijke organisatie: de privaatrechtelijke organisatie die de werkzaamheden uitvoert die in het kader
      van een privatiseringsoperatie door de overheid zijn uitbesteed of overgedragen;

      n. privatiseringsontslag: het ontslag uit een overheidsbetrekking in het kader van een privatiseringsoperatie;

      o. ontslag als werknemer: het ontslag uit de betrekking bij de privaatrechtelijke organisatie;

      p. suppletie: een suppletie krachtens de [Suppletieregeling gedeeltelijk arbeidsongeschikten sector Rijk][ref24];

      q. werkloosheidsuitkering: een uitkering in de zin van de [Werkloosheidswet][ref25].

      2 Indien op het salaris van de betrokkene op de dag voorafgaande aan het ontslag
      een inhouding werd toegepast op grond van [artikel 21a, vijfde lid][ref26], dan wel
      [artikel 57b, eerste lid, van het Algemeen Rijksambtenarenreglement][ref27], wordt voor het dagloon bedoeld in het
      eerste lid, onderdeel f, uitgegaan van het dagloon zoals dat zou zijn vastgesteld indien geen sprake was geweest
      van bedoelde inhouding.


