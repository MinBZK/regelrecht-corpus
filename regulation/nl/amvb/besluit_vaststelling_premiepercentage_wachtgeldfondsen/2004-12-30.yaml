$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_vaststelling_premiepercentage_wachtgeldfondsen
regulatory_layer: AMVB
publication_date: '2005-11-29'
valid_from: '2004-12-30'
bwb_id: BWBR0010118
url: https://wetten.overheid.nl/BWBR0010118/2004-12-30
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst, van 23 november
    1998, Directie Sociale Verzekeringen, Nr. SV/AVF/98/36134;

    Gelet op artikel 85, eerste lid, van de Werkloosheidswet;

    De Raad van State gehoord (advies van 3 december 1998, Nr. W12.98.0542);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst, van 14
    december 1998, Directie Sociale Verzekeringen, nr. SV/AVF/98/40798;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel1
  - number: 1.a
    text: |-
      het wachtgeldpremiepercentage: het percentage van het loon dat op grond van
      [artikel 85, eerste lid, van de Werkloosheidswet][ref1] wordt vastgesteld ter bepaling van het deel van de premie
      dat ten gunste komt van het wachtgeldfonds;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel85
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '85'
  - number: 1.b
    text: |-
      de verzekerde loonsom: het totaalbedrag van het loon, bedoeld in [artikel 84 van de Werkloosheidswet][ref1],
      waarover het Uitvoeringsinstituut werknemersverzekeringen in een jaar ten gunste van een wachtgeldfonds
      de aldaar bedoelde premies ontvangt, met uitzondering van de uitkeringen en het loon waarop
      [artikel 85, derde lid, van de Werkloosheidswet][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel85
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '84'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '85'
  - number: 1.c
    text: |-
      de ziekengeldlasten: de uitkeringen die op grond van
      [artikel 90, eerste lid, onderdeel c, van de Werkloosheidswet][ref1] ten laste van een wachtgeldfonds komen alsmede
      de uitvoeringskosten met betrekking tot die uitkeringen en de op grond van enige wet over die uitkeringen door het
      Uitvoeringsinstituut werknemersverzekeringen verschuldigde premies die niet op die uitkeringen in mindering kunnen
      worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel90
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '90'
  - number: 1.d
    text: |-
      de werkloosheidslasten: hetgeen op grond van [artikel 90, eerste lid, van de Werkloosheidswet][ref1]
      ten laste van een wachtgeldfonds komt, met uitzondering van de ziekengeldlasten en hetgeen op grond van
      [artikel 90, vierde lid, van de Werkloosheidswet][ref2] ten laste van het Algemeen Werkloosheidsfonds wordt
      gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel90
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '90'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '90'
  - number: 1.e
    text: |-
      het lastenplafond: het percentage van de verzekerde loonsom in een jaar, waarin de werkloosheidslasten in dat jaar
      tot uitdrukking komen, dat op grond van [artikel 94 van de Werkloosheidswet][ref1] wordt vastgesteld als maximum;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel94
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '94'
  - number: 1.f
    text: 'het jaar: het kalenderjaar;'
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel1
  - number: 1.g
    text: |-
      het dekkingssaldo: het verschil tussen het feitelijke vermogen van een wachtgeldfonds en de op grond van
      [artikel 51, achtste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] aan te houden reserve.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel51
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '51'
  - number: '2.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt voorafgaand aan elk jaar een wachtgeldpremiepercentage
      over dat jaar vast ter dekking van de werkloosheidslasten in dat jaar. Het wachtgeldpremiepercentage bedraagt ten
      hoogste het lastenplafond.
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel2
  - number: '2.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt voor de dekking van de ziekengeldlasten een opslagpercentage
      vast, waarmee het wachtgeldpremiepercentage met betrekking tot dat wachtgeldfonds wordt verhoogd.
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel2
  - number: '2.3'
    text: |-
      Indien in een wachtgeldfonds op 31 december van het jaar waarin het wachtgeldpremiepercentage wordt vastgesteld
      naar verwachting van het Uitvoeringsinstituut werknemersverzekeringen een positief of negatief dekkingssaldo
      aanwezig zal zijn, stelt het Uitvoeringsinstituut werknemersverzekeringen, in afwijking van het eerste lid, in dat
      jaar en de daaropvolgende jaren een zodanig wachtgeldpremiepercentage vast dat dat overschot dan wel tekort binnen
      drie jaar na die datum is ingelopen onderscheidenlijk aangezuiverd.
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel2
  - number: '2.4'
    text: De toepassing van het derde lid mag er niet toe leiden dat een negatieve wachtgeldpremie wordt geheven.
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel2
  - number: '2.5'
    text: |-
      Voorzover een positief dekkingssaldo door de toepassing van het vierde lid niet binnen de termijn van drie jaar kan
      worden ingelopen, geldt een zodanig langere termijn tot 31 december van enig jaar dat het overschot wel kan worden
      ingelopen.
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel2
  - number: '2.6'
    text: |-
      Indien de toepassing van het derde lid leidt tot vaststelling van een wachtgeldpremiepercentage boven het
      lastenplafond behoeft de aanzuivering van een negatief dekkingssaldo niet binnen de termijn van drie jaar te
      geschieden. In dat geval wordt het wachtgeldpremiepercentage vastgesteld op ten minste het lastenplafond.
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel2
  - number: '2.7'
    text: |-
      Indien een wachtgeldfonds bestaat uit onderdelen die niet afzonderlijk worden beheerd, terwijl het deel van de
      premie dat ten gunste komt van het wachtgeldfonds voor elk van die onderdelen afzonderlijk wordt vastgesteld, zijn
      het eerste tot en met het zesde lid met betrekking tot deze onderdelen gezamenlijk van overeenkomstige toepassing,
      met dien verstande, dat onder het wachtgeldpremiepercentage wordt verstaan het gewogen gemiddelde van de voor die
      onderdelen afzonderlijk vastgestelde wachtgeldpremiepercentages.
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel2
  - number: '4'
    text: Het Besluit premievaststelling wachtgeldfondsen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel4
  - number: '5.1'
    text: Dit besluit treedt in werking met ingang van 1 januari 1999.
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel5
  - number: '5.2'
    text: |-
      Indien de datum van uitgifte van het Staatsblad waarin dit besluit wordt geplaatst gelegen is na 31 december 1998,
      treedt dit besluit in werking met ingang van de dag na de datum van uitgifte waarin het wordt geplaatst en werkt
      het terug tot en met 1 januari 1999.
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit vaststelling premiepercentage wachtgeldfondsen.'
    url: https://wetten.overheid.nl/BWBR0010118/2004-12-30#Artikel6
