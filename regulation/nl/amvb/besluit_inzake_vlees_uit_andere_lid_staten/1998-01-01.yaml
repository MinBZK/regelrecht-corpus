        bwb_id: BWBR0002496
        artikel: '4'
  - number: '6'
    text: |-
      1 Indien bij één van de in [artikel 4][ref1] bedoelde controles blijkt dat niet is voldaan aan het hierna bepaalde,
      mag de partij vlees niet verder in de handel worden gebracht.

      2 Een partij vlees waarop [artikel 3][ref2] van toepassing is, met uitzondering van vlees van vrij wild, voldoet
      aan de eisen dat:

      a. hele karkassen, halve karkassen, halve karkassen die in ten hoogste drie stukken zijn verdeeld, of voeten:

      1°. zijn verkregen in een door de bevoegde autoriteit van de betrokken lid-staat erkend slachthuis, dan wel indien
      het vlees afkomstig is uit een derde land, in een door Onze Minister krachtens artikel 30 *a* van de wet aangewezen
      slachthuis,

      2°. afkomstig zijn van een slachtdier dat vóór het slachten is gekeurd door een officiële dierenarts en daarbij
      geschikt is bevonden om voor de toepassing van richtlijn no. 64/433/EEG te worden geslacht,

      3°. op voldoende hygiënische wijze zijn behandeld,

      4°. na het slachten door een officiële dierenarts zijn gekeurd en daarbij geen enkele afwijking vertoonden, met
      uitzondering van kort vóór het slachten opgelopen traumatische laesies en plaatselijke misvormingen of afwijkingen,
      voor zover is vastgesteld, zo nodig door passend laboratoriumonderzoek, dat het karaks en de daarbij behorende
      slachtafvallen door deze laesies, misvormingen of afwijkingen niet ongeschikt zijn voor menselijke consumptie of
      gevaarlijk voor de gezondheid van de mens,

      5°. zijn voorzien van een keurmerk,

      6°. gedurende het vervoer vergezeld gaan van een handelsdocument,

      7°. na de keuring na het slachten onder voldoende hygiënische omstandigheden zijn opgeslagen in een door de
      bevoegde autoriteit van de betrokken lid-staat erkende inrichting,

      8°. in voldoende hygiënische omstandigheden zijn vervoerd, en

      9°. geschikt zijn voor menselijke consumptie.

      b. uitgesneden delen of stukken die kleiner zijn dan die bedoeld in onderdeel *a* of uitgebeend vlees:

      1°. uitgesneden of uitgebeend zijn in een door de bevoegde autoriteit van de betrokken lid-staat erkende
      uitsnijderij,

      2°. uitgesneden of uitgebeend en verkregen zijn onder voldoende hygiënische omstandigheden, en

        - afkomstig zijn van vers vlees dat voldoet aan de in onderdeel *a* genoemde voorwaarden, behalve die welke zijn
      genoemd in sub 8, en dat op voldoende hygiënische wijze is vervoerd, of
        - afkomstig zijn van vers vlees, dat uit derde landen is ingevoerd overeenkomstig richtlijn no. 90/675/EEG,

      3°. onder voldoende hygiënische omstandigheden zijn opgeslagen in een door de bevoegde autoriteit van de betrokken
      lid-staat erkende inrichting,

      4°. gekeurd zijn door een officiële dierenarts,

      5°. op voldoende wijze zijn verpakt, en

      6°. voldoen aan het bepaalde in onderdeel *a*, sub 3, 5, 6, 8 en 9.

      c. slachtafvallen:

      1°. afkomstig zijn van een door de bevoegde autoriteit van de betrokken lid-staat erkend slachthuis of erkende
      uitsnijderij,

      2°. indien het hele slachtafvallen betreft, voldoen aan het bepaalde in onderdeel *a* en *b*, en

      3°. indien het slachtafvallen betreft in plakken gesneden, voldoen aan het bepaalde in onderdeel *b*.

      d. vers vlees dat overeenkomstig dit besluit in een erkend koel- of vrieshuis is opgeslagen en nadien geen andere
      behandeling dan voor de opslag heeft ondergaan:

      1°. voldoet aan het bepaalde in onderdeel *a*, sub 3, 5, 7, 8 en 9, en onderdeel *b* en *c*, of overeenkomstig
      richtlijn no. 90/675/EEG uit een derde land is ingevoerd, en

      2°. tijdens het vervoer naar de plaats van bestemming vergezeld gaat van een gezondheidscertificaat of een
      handelsdocument.

      e. vers vlees dat overeenkomstig dit besluit is verkregen en dat onder douanetoezicht is opgeslagen in een
      overeenkomstig richtlijn no. 72/462/EEG goedgekeurd koel- of vrieshuis van een derde land en nadien geen andere
      behandeling dan voor de opslag heeft ondergaan:

      1°. voldoet aan het bepaalde in onderdeel *a, b* en *c*,

      2°. beantwoordt aan de bijzondere waarborgen betreffende de keuring en de verklaring dat is voldaan aan de eisen
      met betrekking tot de opslag en het vervoer, en

      3°. vergezeld gaat van een certificaat.

      f. gehakt vlees:

      1°. is bereid uit dwarsgestreept spiervlees met inbegrip van aangrenzend vetweefsel dat voldoet aan de onderdelen
      *a* tot en met *e*, met uitzondering van de hartspier en het vlees dat op grond van bijlage I, hoofdstuk II, van
      richtlijn no. 94/65/EG niet mag worden gebruikt voor de produktie van gehakt vlees,

      2°. is geproduceerd in een werkplaats die is erkend door de bevoegde autoriteit van de betrokken lid-staat,

      3°. indien het is bereid met varkensvlees, overeenkomstig richtlijn no. 77/96/EEG is onderzocht op trichinen of een
      koudebehandeling heeft ondergaan als bedoeld in bijlage IV van die richtlijn,

      4°. is onderworpen geweest aan een controle door de bevoegde autoriteit in de lidstaat van produktie,

      5°. op voldoende hygiënische wijze is geproduceerd, verpakt, opgeslagen en vervoerd,

      6°. op voldoende wijze is geëtiketteerd,

      7°. is voorzien van een onmiddellijke verpakking en een eindverpakking,

      8°. voldoet aan onderdeel *a*, onder 5°, 6° en 9°,

      9°. niet is verkregen van vlees van eenhoevige dieren en van vlees van vrij wild en gekweekt wild,

      10°. binnen een door Onze Minister vastgestelde termijn is onderworpen geweest aan een koudebehandeling, met
      uitzondering van gehakt vlees waarvan de inwendige temperatuur tijdens de bereiding moet worden verlaagd,

      11°. indien het is bereid van of met bevroren of diepgevroren vlees zonder been of gekoeld vlees, van dit vlees is
      verkregen binnen een door Onze Minister vastgestelde termijn,

      12°. voldoet aan de door Onze Minister vastgestelde eisen met betrekking tot de benaming,

      13°. niet is behandeld met ioniserende of ultraviolette stralen, en

      14°. wordt aangeboden in een door Onze Minister vastgestelde vorm.

      3 Een partij vlees van vrij wild waarop [artikel 3][ref3] van toepassing is, met uitzondering van gehele stukken
      niet onthuid grof wild, voldoet aan de volgende eisen:

      a. het is afkomstig van vrij wild dat is gedood in een jachtgebied met door de betrokken lid-staat of derde land in
      de nationale [jachtwet][ref4] geoorloofde middelen,

      b. het is afkomstig van vrij wild dat onmiddellijk na de dood overeenkomstig door Onze Minister vast te stellen
      regels is behandeld,

      c. het is afkomstig van vrij wild dat binnen een termijn van twaalf uur is vervoerd naar een verzamelplaats waar
      het op de door Onze Minister voorgeschreven temperaturen is gebracht en waarvandaan het naar een in onderdeel *d*
      bedoelde verwerkingsinrichting, slachthuis of uitsnijderij is vervoerd binnen een termijn van twaalf uur;

      d. het is verkregen:

      1°. in een door de bevoegde centrale autoriteit van de betrokken lid-staat, overeenkomstig artikel 7 van richtlijn
      no. 92/45/EEG erkende vrij-wildverwerkingsinrichting, of

      2°. in een door de bevoegde centrale autoriteit van de betrokken lid-staat erkende slachthuis of uitsnijderij,

      e. het is gehanteerd onder bevredigende hygiënische omstandigheden,

      f. het is post-mortem gekeurd door een officiële dierenarts en vertoonde geen afwijkingen, met uitzondering
      van eventueel bij het doden opgelopen traumatische laesies of van plaatselijke misvormingen of afwijkingen voor
      zover geconstateerd, zonodig met behulp van geschikte laboratoriumtests, die het vlees niet ongeschikt maken voor
      menselijke consumptie, noch enig gevaar opleveren voor de gezondheid van de mens,

      g. het is voorzien van een officieel goedkeuringsmerk, en

      h. het is vergezeld van een gezondheidscertificaat of ander document.

      4 Een partij vlees bestaande uit gehele stukken niet onthuid of grof wild, waarop [artikel 3][ref5] van toepassing
      is, voldoet aan het bepaalde in het derde lid, onderdeel *a, b, c* en *e* en aan de volgende eisen:

      a. het heeft in een vrij-wild verwerkingsinrichting een keuring van de ingewanden ondergaan,

      b. het is vergezeld van een gezondheidscertificaat, dat door de officiële dierenarts is ondertekend en waarin wordt
      verklaard dat het resultaat van de keuring bedoeld in onderdeel *a* bevredigend is en dat het vlees geschikt is
      voor menselijke consumptie,

      c. het is gebracht op een temperatuur die hoger is dan of gelijk is aan -1°C en lager dan +7°C en is op deze
      temperatuur gehouden tijdens het vervoer naar een verwerkingsinrichting binnen een termijn van ten hoogste zeven
      dagen die begint te lopen vanaf de in onderdeel *a* bedoelde keuring of lager dan +1°C en op deze temperatuur
      gehouden tijdens het vervoer naar een verwerkingsinrichting binnen een termijn van ten hoogste vijftien dagen die
      begint te lopen vanaf de in onderdeel *a* bedoelde keuring, en

      d. het wordt in de verwerkingsinrichting van bestemming onthuid en ondergaat een keuring post mortem, als bedoeld
      in het derde lid, onderdeel *f*.

      5 De afzender van een partij vlees mag, binnen een door de ambtenaar die de controle heeft verricht vast te stellen
      termijn, gebreken aan het vereiste certificaat of ander document laten herstellen door de bevoegde autoriteit in
      het land van verzending, waarna door de in dit lid bedoelde ambtenaar kan worden bepaald dat hij geen toepassing
      geeft aan het gestelde in het eerste lid.

      6 Onze Minister kan met betrekking tot het het tweede, derde en vierde lid nadere regelen stellen.

      7 Het tweede lid, onderdeel *f*, is niet van toepassing op gehakt vlees afkomstig uit door Onze Minister aangewezen
      Lid-Staten.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002496#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0002496#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0002155
