  - number: 6a
    text: |-
      [Artikel 6][ref1] is niet van toepassing op vlees dat

      a. met toestemming van Onze Minister na overleg met Onze Minister van Landbouw en Visserij bestemd wordt voor ander
      gebruik dan menselijke consumptie. Onze Minister kan aan deze toestemming voorwaarden verbinden;

      b. bestemd is voor tentoonstellingen, bijzonder onderzoek of analyses, mits het na afloop van de tentoonstelling
      of voltooiing van het onderzoek of de analyse, met uitzondering van de voor de analyse gebruikte hoeveelheid,
      onbruikbaar wordt gemaakt voor voedsel voor mens en dier;

      c. bestemd is voor de bevoorrading van internationale organisaties en in Nederland gelegerde strijdkrachten van
      andere landen.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel6
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6a
