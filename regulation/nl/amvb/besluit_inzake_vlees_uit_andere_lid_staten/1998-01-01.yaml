        bwb_id: BWBR0002496
        artikel: '6'
  - number: '7'
    text: |-
      1 Indien een partij niet verder in de handel mag worden gebracht als bedoeld in [artikel 6, eerste lid][ref1],
      wordt dit vanwege de ambtenaar die de controle heeft verricht ter kennis gebracht van de afzender van het vlees of
      diens lasthebber, alsmede van de bevoegde autoriteit in de lid-staat van verzending.

      2 Indien een partij vlees niet verder in de handel mag worden gebracht als bedoeld in
      [artikel 6, eerste lid][ref2], kan de afzender of diens lasthebber het nader oordeel van de inspecteur vragen. Het
      aanvragen van een nader oordeel dient schriftelijk te geschieden en uiterlijk binnen 24 uur na het eindigen van
      de dag waarop de beslissing tot het niet verder in de handel mogen brengen van een partij vlees is genomen; volgt
      op deze dag een zaterdag, een zondag of één of meer algemeen erkende feestdagen, dan wordt de termijn van 24 uur
      verlengd tot en met de eerstvolgende dat die niet een zaterdag, zondag of een algemeen erkende feestdag is. De
      inspecteur neemt alsdan een beslissing, welke in de plaats treedt van de beslissing van de Rijkskeuringsdierenarts.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002496#Artikel6
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel7
