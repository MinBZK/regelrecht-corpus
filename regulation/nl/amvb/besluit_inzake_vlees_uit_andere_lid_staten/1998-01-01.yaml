---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_inzake_vlees_uit_andere_lid_staten
regulatory_layer: AMVB
publication_date: '1996-02-27'
valid_from: '1998-01-01'
bwb_id: BWBR0002496
url: https://wetten.overheid.nl/BWBR0002496/1998-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Volksgezondheid van 28 juni 1965, Directoraat-
    Generaal van de Volksgezondheid, Hoofdafdeling Gezondheidsbescherming, Afd. V.A., No. 102351;

    Gelet op artikel 30a van de Vleeskeuringswet;

    De Raad van State gehoord (advies van 30 juni 1965, No. 85);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Volksgezondheid van 13 juli 1965, Directoraat-
    Generaal van de Volksgezondheid, Hoofdafd. Gezondheidsbescherming, Afd. V.A., No. 103363;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.a
    text: |-
      *de wet:* de [Vleeskeuringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001896
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001896
  - number: 1.b
    text: '*Onze Minister:* Onze Minister van Sociale Zaken en Volksgezondheid;'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.c
    text: '*inspecteur:* de inspecteur, voor het betrokken deel des lands belast met het toezicht op de naleving van de wet;'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.d
    text: 'vlees: alle voor menselijke consumptie geschikte delen van:'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.d.1°
    text: |-
      als landbouwhuisdieren gehouden runderen (de soort Bubalus, bubalis en Bison bison daaronder begrepen), varkens,
      schapen, geiten en eenhoevigen,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.d.2°
    text: |-
      gekweekt wild, zijnde niet-gedomesticeerde landzoogdieren met uitzondering van lagomorfen, die niet worden vermeld
      onder 1, die in gevangenschap zijn gekweekt, gehouden en geslacht, en
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.d.3°
    text: |-
      vrij wild, zijnde bejaagde niet-gedomesticeerde landzoogdieren (met inbegrip van niet-gedomesticeerde zoogdieren
      die in een gesloten gebied leven met dezelfde vrijheid als vrij wild) met uitzondering van lagomorfen, die niet in
      gevangenschap zijn gekweekt, gehouden en geslacht;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.e
    text: |-
      *officiële dierenarts:* door de bevoegde centrale autoriteit van een der andere lid-Staten van de Europese Unie
      aangewezen dierenarts;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.f
    text: |-
      separatorvlees; vlees van slachtdieren als genoemd in onderdeel *d*, onder 1, 2 en 3 dat machinaal is afgescheiden
      van beenderen met daaraan vastzittend vlees;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.g
    text: '*derde land:* ander land dan de Lid-Staten van de Europese Unie;'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.h
    text: |-
        - richtlijn no. 77/99/EEG: - Richtlijn van de Raad van de Europese gemeenschappen van 21 december 1976, betreffende
      de gezondheidsvoorschriften voor de produktie en het in de handel brengen van vleesprodukten en bepaalde andere
      produkten van dierlijke oorsprong (*PbEG* 1977, L 26),
        - richtlijn no. 64/433/EEG: - Richtlijn van de Raad van de Europese Gemeenschappen betreffende de
      gezondheidsvoorschriften voor de produktie en het in de handel brengen van vers vlees (*PbEG* 1964, 121),
        - richtlijn no. 90/675/EEG: - Richtlijn van de Raad van de Europese Gemeenschappen van 10 december 1990, tot
      vaststelling van de beginselen voor de organisatie van de veterinaire controles voor produkten uit derde landen die
      in de Gemeenschap worden binnengebracht (*PbEG* 1990, L 373),
        - richtlijn no. 94/65/EG: Richtlijn van de Raad van de Europese Unie van 14 december 1994, tot vaststelling van
      voorschriften voor de produktie en het in de handel brengen van gehakt vlees en vleesbereidingen (*PbEG* L 368),
        - richtlijn no. 86/469/EEG: - Richtlijn van de Raad van de Europese Gemeenschappen van 16 september 1986, inzake
      het onderzoek van dieren en vers vlees op de aanwezigheid van residuen (*PbEG* 1986, L 275),
        - richtlijn no. 77/96/EEG: - Richtlijn van de Raad van de Europese Gemeenschappen van 21 december 1976 inzake het
      opsporen van trichinen bij de invoer van vers vlees van varkens, huisdieren, uit derde landen ( *PbEG* 1977, L 26),
        - richtlijn no. 92/45/EEG: - Richtlijn van de Raad van de Europese Gemeenschappen van 16 juni 1992, betreffende
      de gezondheidsvoorschriften en veterinairrechtlijke voorschriften voor het doden van vrij wild en het in de handel
      brengen van vlees van vrij wild (*PbEG* 1992, L 268), en
        - richtlijn no. 72/462/EEG: - Richtlijn van de Raad van de Europese Gemeenschappen van 12 december 1972, inzake
      gezondheidsvraagstukken en veterinairrechtelijke vraagstukken bij de invoer van runderen, varkens, schapen en
      geiten, van vers vlees of van vleesprodukten uit derde landen (*PbEG* 1972, L 302);
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.i
    text: |-
      gehakt vlees: vlees dat in kleine stukken is gehakt of door een hakmolen is gehaald en waaraan ten hoogste 1% zout
      is toegevoegd;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.j
    text: |-
      werkplaats: elke uitsnijderij of inrichting voor de produktie van gehakt vlees, dat voldoet aan de eisen genoemd in
      bijlage I, hoofdstuk I, van de richtlijn no. 94/65/EG;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.k
    text: |-
      een partij: een hoeveelheid vlees van dezelfde aard waarvoor één veterinair certificaat of document geldt, die met
      hetzelfde vervoermiddel wordt vervoerd en die afkomstig is uit dezelfde inrichting;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.l
    text: |-
      in de handel brengen: het verkopen, te koop aanbieden, het afleveren of het ten geschenke geven, het tot vervoer of
      aflevering voorhanden hebben, het in voorraad hebben, het vervoeren of doen vervoeren, anders dan ter naleving van
      enig wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.m
    text: |-
      bevoegde autoriteit: de centrale autoriteit van een lid-staat van de Europese Unie, die bevoegd is tot het
      verrichten van de veterinaire controles of de autoriteit waaraan de centrale autoriteit deze bevoegdheid heeft
      overgedragen;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.n
    text: 'inrichting: onderneming waar vlees wordt geproduceerd, opgeslagen of bewerkt;'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.o
    text: |-
      plaats van bestemming: eerste plaats op Nederlands grondgebied waar een partij vlees verzonden uit een lid-staat
      van de Europese Unie in ontvangst wordt genomen;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.p
    text: |-
      materiële controle: controle van het vlees zelf, die mede monsterneming ten behoeve van onderzoek in een
      laboratorium kan omvatten;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.q
    text: |-
      vrij-wildverwerkingsinrichting: een inrichting waar het vrij wild wordt behandeld en het vlees van vrij wild wordt
      verkregen en gekeurd;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.r
    text: |-
      speciale noodslachting: het doden, op last van een dierenarts, wegens een ongeval of ernstige lichamelijke en
      functionele stoornissen. De speciale noodslachting wordt buiten een slachthuis uitgevoerd indien de dierenarts
      meent dat vervoer onmogelijk is of onnodig lijden van het dier zou meebrengen;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.s
    text: |-
      karkas: het uitgebloede gehele slachtdier dat is ontdaan van de ingewanden, waarvan de poten zijn afgesneden ter
      hoogte van het voorkniegewricht respectievelijk het spronggewricht, en waarvan de kop, de staart en de uier zijn
      verwijderd; voor runderen, schapen, geiten en eenhoevigen betreft het karkassen als hierboven bedoeld na het
      onthuiden. Bij varkens hoeven de poten niet ter hoogte van het voorkniegewricht, respectievelijk het spronggewricht
      te worden afgesneden en hoeft de kop niet te worden verwijderd wanneer het vlees bestemd is om te worden behandeld
      overeenkomstig de regelen gesteld krachtens richtlijn no. 77/99/EEG;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.t
    text: |-
      slachtafval: vlees dat geen deel uitmaakt van het karkas als omschreven onder *s*, ook indien het op natuurlijke
      wijze met het karkas verbonden blijft;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: 1.u
    text: 'ingewanden: het slachtafval in de borst-, buik- en de bekkenholte, met inbegrip van de luchtpijp en de slokdarm.'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel1
  - number: '2'
    text: |-
      De artikelen 27-29 van de wet zijn niet van toepassing ten aanzien van vlees, hetwelk uit een der andere lid-Staten
      van de Europese Unie naar Nederland is verzonden, met uitzondering van vlees afkomstig van slachtdieren die zijn
      geslacht in een slachthuis dat gelegen is in een derde land en dat niet door Onze Minister op grond van artikel
      30*a* van de wet is aangewezen, danwel gehakt geproduceerd in een derde land.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het is verboden uit een der lid-staten van de Europese Unie naar Nederland verzonden vlees op Nederlands
      grondgebied te brengen, anders dan in doorvoer naar een derde land, indien het betreft:
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.a
    text: 'vlees van:'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.a.1°
    text: |-
      dieren waarbij een van de volgende ziekten is vastgesteld: - Mond- en klauwzeer (MKZ),
        - Klassieke varkenspest (KVP),
        - Afrikaanse varkenspest (AVP),
        - Vesiculaire varkensziekte (VVZ),
        - Newcastle Disease (ND),
        - Runderpest,
        - Ziekte van kleine herkauwers ("Peste des petits ruminants"),
        - Vesiculaire stomatitis (VS),
        - Bluetongue,
        - Paardepest,
        - Virale paardepest-encefalomyelitis,
        - Teschener-ziekte,
        - Vogelpest,
        - Schape- en geitepokken,
        - Nodulaire dermatose,
        - Rifvalleykoorts,
        - Besmettelijke bovine pleuropneumonie,
        - gegeneraliseerde actinobacillose of gegeneraliseerde actinomycose,
        - miltvuur en boutvuur,
        - gegeneraliseerde tuberculose,
        - gegeneraliseerde lymfadenitis,
        - kwade droes,
        - hondsdolheid,
        - tetanus,
        - acute salmonellose,
        - acute brucellose,
        - vlekziekte,
        - botulisme,
        - septicemie, pyaemie, toxemie en viremie,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.a.2°
    text: |-
      dieren die acute laesies vertoonden van bronchopneumonie, pleuritis, peritonitis, metritis, mastitis, arthritis,
      pericarditis, enteritis of menningo-encephalomyelitis, bevestigd door een gedetailleerde keuring, eventueel
      aangevuld met een bacteriologisch onderzoek en een onderzoek op residuen van stoffen met farmacologische werking.
      Wanneer de resultaten van deze bijzondere onderzoeken gunstig zijn, worden de karkassen evenwel geschikt voor
      menselijke consumptie verklaard na verwijdering van de voor consumptie ongeschikte delen,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.a.3°
    text: |-
      dieren die leden aan de volgende parasitaire ziekten: gegeneraliseerde sarcosporidiose en gegeneraliseerde
      cysticercose en trichinose,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.a.4°
    text: gestorven dieren, doodgeboren dieren of ongeboren dode vruchten,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.a.5°
    text: te jong geslachte dieren waarvan het vlees oedeemverschijnselen vertoont,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.a.6°
    text: sterk vermagerde dieren of dieren met uitgesproken anemie, en
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.a.7°
    text: |-
      dieren die multiple tumoren, multiple abcessen of multiple ernstige verwondingen in verschillende delen van het
      karkas of in verschillende ingewanden vertoonden,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.b
    text: 'vlees van:'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.b.1°
    text: |-
      dieren die positief of onduidelijk hebben gereageerd op tuberculine waarbij bij de keuring na het slachten
      verricht onderzoek plaatselijke tubeerculoselaesies heeft aangetoond in meerdere organen of meerdere delen van het
      karkas. Wanneer een tuberculoselaesie is geconstateerd in de klieren van een zelfde orgaan of deel van een karkas,
      worden evenwel enkel het aangetaste orgaan of deel van het karakas en de bijbehorende lymfklieren ongeschikt voor
      menselijke consumptie verklaard,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.b.2°
    text: |-
      dieren die positief of onduidelijk hebben gereageerd op een brucellosetest waarbij de ziekte is bevestigd door
      laesies die wijzen op een acute aandoening. Zelfs indien dergelijke laesies niet zijn geconstateerd, worden toch de
      uier, het genitaal apparaat en het bloed ongeschikt voor menselijke consumptie verklaard,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.c
    text: |-
      delen van karkassen die ernstige serum- of bloedinfiltraties, gelokaliseerde abcessen of gelokaliseerde
      verontreinigingen vertonen,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.d
    text: |-
      slachtafvallen en ingewanden die pathologische laesies van infectieuze, parasitaire of traumatische oorsprong
      vertonen,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.e
    text: vlees van koortsige dieren,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.f
    text: vlees dat ernstige afwijkingen vertoont inzake kleur, geur, consistentie en smaak,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.g
    text: |-
      wanneer de keuringsdierenarts constateert dat karkassen of slachtafvallen aangetast zijn door lymfadenitis caseosus
      of een andere etterige aandoening die echter niet gegeneraliseerd is noch gepaard gaat met sterke vermagering:
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.g.1°
    text: alle organen en daarmee verbonden lymfeklieren die deze aandoening in- of uitwendig vertonen, en
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.g.2°
    text: |-
      in alle gevallen waarop sub 1 niet van toepassing is, de laesie en de aangrenzende delen, die hij, te zijner
      beoordeling, ongeschikt acht, de ouderdom en de activiteit van de laesie in aanmerking genomen, met dien verstande
      dat een oude goed ingekapselde laesie als inactief mag worden beschouwd,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.h
    text: vlees van de weggesneden steekplaats,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.i
    text: |-
      wanneer de keuringsdierenarts constateert dat hele karkassen of delen van karkassen dan wel slachtafvallen
      aangetast zijn door een andere ziekte of aandoening dan die vermeld in de voorgaande punten, het gehele karkas
      en de slachtafvallen of het deel van het karkas of het slachtafval waarvan hij denkt dat het ongeschikt voor
      menselijke consumptie moet worden verklaard,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.j
    text: karkassen waarvan de slachtafvallen niet aan de keuring na het slachten zijn onderworpen,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.k
    text: |-
      het bloed van dieren waarvan het vlees overeenkomstig de bovenstaande punten ongeschikt voor menselijke consumptie
      is verklaard, alsmede bloed dat besmet is door de maaginhoud of door een andere stof,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.l
    text: 'vlees van dieren waaraan de volgende stoffen zijn toegediend:'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.l.1°
    text: |-
      door Onze Minister aangewezen produkten waardoor het vlees gevaarlijk of schadelijk voor de gezondheid van de mens
      kan zijn, en
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.l.2°
    text: malsmakers (tenderizers),
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.m
    text: |-
      vlees dat residuen bevat van door Onze Minister aangewezen stoffen en residuen van geneesmiddelen, van antibiotica,
      van bestrijdingsmiddelen of van andere stoffen die schadelijk zijn of er eventueel toe te kunnen leiden dat de
      consumptie van vers vlees gevaarlijk of schadelijk is voor de gezondheid van de mens, in hoeveelheden die de door
      Onze Minister vastgestelde toleranties overschrijden,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.n
    text: vlees dat besmet of aangetast is in een door Onze Minister vastgestelde mate.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.o
    text: |-
      levers en nieren van dieren van meer dan twee jaar oud afkomstig uit gebieden waarin men bij de uitvoering van
      overeenkomstig richtlijn no. 86/469/EEG goedgekeurde plannen een algemene aanwezigheid van zware metalen in het
      milieu heeft kunnen constateren,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.p
    text: |-
      vlees dat behandeld is met ioniserende of ultraviolette stralen, onverminderd eventuele communautaire voorschriften
      inzake doorstraling,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.q
    text: vlees dat een uitgesproken seksuele geur verspreidt,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.r
    text: vlees van dieren die bij een speciale noodslachting zijn gedood,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.s
    text: |-
      vlees afkomstig van op grond van artikel 4 van richtlijn no. 64/433/EEG door de bevoegde autoriteit van de
      betrokken lid-staat erkende inrichtingen,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.t
    text: |-
      vlees van vrij wild, dat door Onze Minister aan te wijzen stoffen heeft opgenomen, waardoor de consumptie van het
      vlees gevaarlijk of schadelijk voor de gezondheid van de mens kan zijn,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.u
    text: vlees van vrij wild waarbij de dood aan andere oorzaken is te wijten dan de jacht,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.v
    text: vlees dat met andere kleurstoffen is gemerkt dan door Onze Minister voorgeschreven,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.w
    text: |-
      vlees, niet zijnde vlees van gehouden wild of vrij wild, van mannelijke varkens bestemd voor de fok, van
      cryptorchiede en hermafrodiete varkens en van niet-gecastreerde mannelijke varkens met een geslacht gewicht
      hoger dan 80 kg, tenzij de inrichting op basis van een door Onze Minister goedgekeurde methode kan garanderen dat
      karkassen met een uitgesproken seksuele geur kunnen worden opgespoord en het vlees is voorzien van het speciale
      merk als bedoeld in beschikking no. 84/371/EEG van de Commissie van de Europese Gemeenschappen van 3 juli 1984
      (*PbEG* L 196) en bestemd is om een behandeling als bedoeld in richtlijn no. 77/99/EEG te ondergaan,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.x
    text: |-
      vlees van dieren die niet op gegeneraliseerde wijze zijn aangetast door Cysticercus bovis of Cysticercus
      cellulosae, tenzij het een koudebehandeling heeft ondergaan, overeenkomstig een door Onze Minister goedgekeurde
      methode,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.y
    text: |-
      vlees van varkens of paarden, dat niet overeenkomstig het bepaalde in richtlijn no. 77/96/EEG op trichinen is
      onderzocht, tenzij het een koudebehandeling heeft ondergaan overeenkomstig bijlage IV van die richtlijn. Vlees
      van everzwijnen of van andere voor besmetting met trichinen vatbare soorten gekweekt wild of vrij wild, moet zijn
      onderzocht met behulp van een digestiemethode overeenkomstig richtlijn no. 77/96/EEG,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.z
    text: separatorvlees,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.aa
    text: slachtafvallen van vrij wild,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.1.ab
    text: |-
      delen van organen met uitzondering van in plakken gesneden levers van als huisdier gehouden runderen als bedoeld in
      [artikel 1, onderdeel ][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel1
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '1'
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid kan Onze Minister onder door hem vast te stellen voorwaarden, toestemming verlenen
      om uit door hem aangewezen lid-staten vlees als bedoeld in het eerste lid, onderdelen *z* en *ab* op Nederlands
      grondgebied te brengen.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister kan toestemming verlenen om uit door hem aangewezen lid-staten of delen van lid-staten vlees op
      Nederlands grondgebied te brengen, dat niet voldoet aan het eerste lid, onderdeel *y*, wanneer:
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.3.a
    text: met epidemiologische studies is aangetoond dat er geen trichinen aanwezig zijn, en
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3.3.b
    text: de levende en gedode dieren worden onderworpen aan een doeltreffende opsporings- en controlemethode.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: '3.4'
    text: |-
      De in het eerste lid, onderdeel *w*, bedoelde behandeling wordt uitgevoerd in een door de bevoegde autoriteit
      overeenkomstig richtlijn no. 77/99/EEG aangewezen inrichting.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3
  - number: 3a
    text: |-
      Het is tevens verboden uit één der andere lid-staten van de Europese Unie naar Nederland verzonden vlees op
      Nederlands grondgebied te brengen, anders dan als doorvoer naar een derde land, indien niet is voldaan aan het
      bepaalde in [artikel 4, eerste, tweede, zevende en achtste lid][ref1], 8 en 10*a*.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel4
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '4'
  - number: '4.1'
    text: |-
      Degene die zich partijen vlees rechtstreeks laat toezenden waarop [artikel 3][ref1] van toepassing is, is verplicht
      voorafgaande aan de toezending, zich te laten registreren bij de door Onze Minister, na overleg met Onze Minister
      van Landbouw, Natuurbeheer en Visserij aangewezen autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: 3a
  - number: '4.2'
    text: |-
      Degene die zich een partij vlees rechtstreeks laat toezenden en geregistreerd is als bedoeld in het eerste lid,
      dient nadat de partij vlees op Nederlands grondgebied is gebracht, voorafgaand aan de ontvangst, onderscheidenlijk
      de verdere verhandeling of verdeling van de partij vlees, een controle te verrichten op de aanwezigheid van de
      krachtens richtlijn no. 64/433/EEG, onderscheidenlijk indien het gehakt vlees betreft, krachtens richtlijn no.
      94/65/EG vereiste merken en certificaten of andere documenten en dient de bevoegde autoriteit in kennis te stellen
      van nalatigheden of onregelmatigheden.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4
  - number: '4.3'
    text: |-
      Een partij vlees die bestemd is voor Nederland en die op Nederlands grondgebied is gebracht, kan op de plaats van
      bestemming steekproefsgewijs en op niet discriminerende wijze worden gecontroleerd of zij voldoet aan het bepaalde
      in [artikel 3][ref1] en 6, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel3
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '3'
  - number: '4.4'
    text: |-
      Een partij vlees die bestemd is voor een andere lid-staat en die op Nederlands grondgebied is gebracht kan, indien
      er een ernstig vermoeden bestaat dat het vlees niet overeenkomstig de bepalingen krachtens richtlijn no. 64/433/
      EEG, onderscheidenlijk indien het gehakt vlees betreft, krachtens richtlijn no. 94/65/EG, in het intracommunautaire
      handelsverkeer is gebracht, tijdens het vervoer worden gecontroleerd op de aanwezigheid van krachtens deze
      richtlijnen vereiste merken en certificaten of andere documenten, alsmede of aan de overige bepalingen van de
      desbetreffende richtlijn is voldaan.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4
  - number: '4.5'
    text: |-
      Indien de in het tweede, derde en vierde lid bedoelde controles daartoe aanleiding geven, wordt het vlees aan een
      materiële controle onderworpen.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4
  - number: '4.6'
    text: |-
      De controles bedoeld in het derde, vierde en vijfde lid, worden verricht door een krachtens artikel 27, eerste lid,
      van de wet aangewezen ambtenaar, die zich bij de uitoefening van de controles kan laten bijstaan door één of meer
      personen als bedoeld in artikel 25, laatste zinsnede, van de wet.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4
  - number: '4.7'
    text: |-
      Degene die vlees onder zich heeft is verplicht medewerking te verlenen aan de in het derde, vierde en vijfde lid
      bedoelde controles, indien de hiertoe aangewezen ambtenaar of de hiertoe aangewezen personen hierom verzoeken.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4
  - number: '4.8'
    text: |-
      Onze Minister kan na overleg met Onze Minister van Landbouw, Natuurbeheer en Visserij nadere regels stellen met
      betrekking tot de registratie bedoeld in het eerste lid en de controles bedoeld in het tweede, derde, vierde en
      vijfde lid, alsmede met betrekking tot de opslag en het vervoer van vlees, dat ingevolge [artikel 6][ref1] niet
      verder in de handel mag worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel6
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '6'
  - number: 4a.1
    text: |-
      Met betrekking tot de registratie bedoeld in [artikel 4, eerste lid][ref1], gelden de navolgende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel4
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '4'
  - number: 4a.1.a
    text: |-
      registratie wordt verricht van een natuurlijke persoon of van een rechtspersoon, zij is gebonden aan de
      geregistreerde natuurlijke persoon of rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4a
  - number: 4a.1.b
    text: |-
      alle geregistreerde natuurlijke personen en rechtspersonen worden door de krachtens [artikel 4, eerste lid][ref1],
      aangewezen autoriteit op een lijst geplaatst,


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel4
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '4'
  - number: 4a.1.c
    text: 'degene die overeenkomstig onderdeel *b* is geregistreerd moet:'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4a
  - number: 4a.1.c.1°
    text: |-
      een register bijhouden waarin ten minste de leveringen en de verdere bestemming van vlees bedoeld in
      [artikel 3][ref1] worden vermeld,


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: 3a
  - number: 4a.1.c.2°
    text: |-
      gedurende ten minste zes maanden alle certificaten of andere documenten bewaren die het vlees bedoeld in
      [artikel 3][ref1] vergezelden en deze desgevraagd tonen aan de in [artikel 4, zesde lid][ref2], bedoelde ambtenaar,
      dan wel aan de in onderdeel *b* bedoelde autoriteit en


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0002496#Artikel4
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0002496
        artikel: '4'
  - number: 4a.1.c.3°
    text: |-
      op verzoek van de in [artikel 4, zesde lid][ref1], bedoelde ambtenaar de aankomst melden van vlees bedoeld in
      [artikel 3][ref2], voor zover dit noodzakelijk is voor het verrichten van wettelijk voorgeschreven controles,


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002496#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002496
        artikel: 3a
  - number: 4a.1.d
    text: |-
      een registratie kan door de in onderdeel *b* bedoelde autoriteit worden beëindigd, indien blijkt dat de
      geregistreerde natuurlijke of rechtspersoon de bij of krachtens dit besluit geldende voorschriften niet heeft
      nageleefd,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4a
  - number: 4a.1.e
    text: |-
      een registratie kan door de in onderdeel *b* bedoelde autoriteit eveneens worden beëindigd indien gedurende een
      ononderbroken tijdvak van een jaar geen handelingen zijn verricht met gebruikmaking van de registratie als bedoeld
      in [artikel 4, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel4
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '4'
  - number: 4a.1.f
    text: |-
      de beschikking tot beëindiging van een registratie vermeldt de gronden waarop zij steunt en wordt aan de
      geregistreerde natuurlijke persoon of rechtspersoon bij aangetekende brief toegezonden.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4a
  - number: 4a.2
    text: |-
      De in het eerste lid, onderdeel *c*, genoemde voorschriften kunnen door Onze Minister worden gewijzigd, aangevuld
      of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel4a
  - number: '5.1'
    text: |-
      [Artikel 4][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel4
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '4'
  - number: 5.1.a
    text: |-
      vlees, dat zich bevindt in of op een middel van vervoer en dat bestemd is uitsluitend voor het persoonlijk gebruik
      van hen, die daarin of daarop verblijven, voorzover daarbij geen sprake is van meer dan 10 kg per persoon;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel5
  - number: 5.1.b
    text: |-
      vlees dat zich in de persoonlijke bagage van reizigers bevindt en voor eigen gebruik wordt vervoerd, voorzover de
      gevoerde hoeveelheid 3 kg per persoon niet overschrijdt;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel5
  - number: 5.1.c
    text: |-
      vlees dat bestemd is voor de bevoorrading van internationale organisaties en in Nederland gelegerde strijdkrachten
      van andere landen.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel5
  - number: '5.2'
    text: Onze Minister stelt nadere regelen ten aanzien van het in het eerste lid, onder *b*, bepaalde.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel5
  - number: '6.1'
    text: |-
      Indien bij één van de in [artikel 4][ref1] bedoelde controles blijkt dat niet is voldaan aan het hierna bepaalde,
      mag de partij vlees niet verder in de handel worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel4
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '4'
  - number: '6.2'
    text: |-
      Een partij vlees waarop [artikel 3][ref1] van toepassing is, met uitzondering van vlees van vrij wild, voldoet aan
      de eisen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: 3a
  - number: 6.2.a
    text: 'hele karkassen, halve karkassen, halve karkassen die in ten hoogste drie stukken zijn verdeeld, of voeten:'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.a.1°
    text: |-
      zijn verkregen in een door de bevoegde autoriteit van de betrokken lid-staat erkend slachthuis, dan wel indien het
      vlees afkomstig is uit een derde land, in een door Onze Minister krachtens artikel 30 *a* van de wet aangewezen
      slachthuis,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.a.2°
    text: |-
      afkomstig zijn van een slachtdier dat vóór het slachten is gekeurd door een officiële dierenarts en daarbij
      geschikt is bevonden om voor de toepassing van richtlijn no. 64/433/EEG te worden geslacht,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.a.3°
    text: op voldoende hygiënische wijze zijn behandeld,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.a.4°
    text: |-
      na het slachten door een officiële dierenarts zijn gekeurd en daarbij geen enkele afwijking vertoonden, met
      uitzondering van kort vóór het slachten opgelopen traumatische laesies en plaatselijke misvormingen of afwijkingen,
      voor zover is vastgesteld, zo nodig door passend laboratoriumonderzoek, dat het karaks en de daarbij behorende
      slachtafvallen door deze laesies, misvormingen of afwijkingen niet ongeschikt zijn voor menselijke consumptie of
      gevaarlijk voor de gezondheid van de mens,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.a.5°
    text: zijn voorzien van een keurmerk,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.a.6°
    text: gedurende het vervoer vergezeld gaan van een handelsdocument,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.a.7°
    text: |-
      na de keuring na het slachten onder voldoende hygiënische omstandigheden zijn opgeslagen in een door de bevoegde
      autoriteit van de betrokken lid-staat erkende inrichting,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.a.8°
    text: in voldoende hygiënische omstandigheden zijn vervoerd, en
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.a.9°
    text: geschikt zijn voor menselijke consumptie.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.b
    text: 'uitgesneden delen of stukken die kleiner zijn dan die bedoeld in onderdeel *a* of uitgebeend vlees:'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.b.1°
    text: uitgesneden of uitgebeend zijn in een door de bevoegde autoriteit van de betrokken lid-staat erkende uitsnijderij,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.b.2°
    text: |-
      uitgesneden of uitgebeend en verkregen zijn onder voldoende hygiënische omstandigheden, en - afkomstig zijn van
      vers vlees dat voldoet aan de in onderdeel *a* genoemde voorwaarden, behalve die welke zijn genoemd in sub 8, en
      dat op voldoende hygiënische wijze is vervoerd, of
        - afkomstig zijn van vers vlees, dat uit derde landen is ingevoerd overeenkomstig richtlijn no. 90/675/EEG,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.b.3°
    text: |-
      onder voldoende hygiënische omstandigheden zijn opgeslagen in een door de bevoegde autoriteit van de betrokken lid-
      staat erkende inrichting,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.b.4°
    text: gekeurd zijn door een officiële dierenarts,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.b.5°
    text: op voldoende wijze zijn verpakt, en
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.b.6°
    text: voldoen aan het bepaalde in onderdeel *a*, sub 3, 5, 6, 8 en 9.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.c
    text: 'slachtafvallen:'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.c.1°
    text: |-
      afkomstig zijn van een door de bevoegde autoriteit van de betrokken lid-staat erkend slachthuis of erkende
      uitsnijderij,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.c.2°
    text: indien het hele slachtafvallen betreft, voldoen aan het bepaalde in onderdeel *a* en *b*, en
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.c.3°
    text: indien het slachtafvallen betreft in plakken gesneden, voldoen aan het bepaalde in onderdeel *b*.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.d
    text: |-
      vers vlees dat overeenkomstig dit besluit in een erkend koel- of vrieshuis is opgeslagen en nadien geen andere
      behandeling dan voor de opslag heeft ondergaan:
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.d.1°
    text: |-
      voldoet aan het bepaalde in onderdeel *a*, sub 3, 5, 7, 8 en 9, en onderdeel *b* en *c*, of overeenkomstig
      richtlijn no. 90/675/EEG uit een derde land is ingevoerd, en
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.d.2°
    text: |-
      tijdens het vervoer naar de plaats van bestemming vergezeld gaat van een gezondheidscertificaat of een
      handelsdocument.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.e
    text: |-
      vers vlees dat overeenkomstig dit besluit is verkregen en dat onder douanetoezicht is opgeslagen in een
      overeenkomstig richtlijn no. 72/462/EEG goedgekeurd koel- of vrieshuis van een derde land en nadien geen andere
      behandeling dan voor de opslag heeft ondergaan:
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.e.1°
    text: voldoet aan het bepaalde in onderdeel *a, b* en *c*,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.e.2°
    text: |-
      beantwoordt aan de bijzondere waarborgen betreffende de keuring en de verklaring dat is voldaan aan de eisen met
      betrekking tot de opslag en het vervoer, en
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.e.3°
    text: vergezeld gaat van een certificaat.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f
    text: 'gehakt vlees:'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f.1°
    text: |-
      is bereid uit dwarsgestreept spiervlees met inbegrip van aangrenzend vetweefsel dat voldoet aan de onderdelen
      *a* tot en met *e*, met uitzondering van de hartspier en het vlees dat op grond van bijlage I, hoofdstuk II, van
      richtlijn no. 94/65/EG niet mag worden gebruikt voor de produktie van gehakt vlees,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f.2°
    text: is geproduceerd in een werkplaats die is erkend door de bevoegde autoriteit van de betrokken lid-staat,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f.3°
    text: |-
      indien het is bereid met varkensvlees, overeenkomstig richtlijn no. 77/96/EEG is onderzocht op trichinen of een
      koudebehandeling heeft ondergaan als bedoeld in bijlage IV van die richtlijn,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f.4°
    text: is onderworpen geweest aan een controle door de bevoegde autoriteit in de lidstaat van produktie,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f.5°
    text: op voldoende hygiënische wijze is geproduceerd, verpakt, opgeslagen en vervoerd,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f.6°
    text: op voldoende wijze is geëtiketteerd,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f.7°
    text: is voorzien van een onmiddellijke verpakking en een eindverpakking,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f.8°
    text: voldoet aan onderdeel *a*, onder 5°, 6° en 9°,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f.9°
    text: niet is verkregen van vlees van eenhoevige dieren en van vlees van vrij wild en gekweekt wild,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f.10°
    text: |-
      binnen een door Onze Minister vastgestelde termijn is onderworpen geweest aan een koudebehandeling, met
      uitzondering van gehakt vlees waarvan de inwendige temperatuur tijdens de bereiding moet worden verlaagd,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f.11°
    text: |-
      indien het is bereid van of met bevroren of diepgevroren vlees zonder been of gekoeld vlees, van dit vlees is
      verkregen binnen een door Onze Minister vastgestelde termijn,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f.12°
    text: voldoet aan de door Onze Minister vastgestelde eisen met betrekking tot de benaming,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f.13°
    text: niet is behandeld met ioniserende of ultraviolette stralen, en
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.2.f.14°
    text: wordt aangeboden in een door Onze Minister vastgestelde vorm.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: '6.3'
    text: |-
      Een partij vlees van vrij wild waarop [artikel 3][ref1] van toepassing is, met uitzondering van gehele stukken niet
      onthuid grof wild, voldoet aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: 3a
  - number: 6.3.a
    text: |-
      het is afkomstig van vrij wild dat is gedood in een jachtgebied met door de betrokken lid-staat of derde land in de
      nationale [jachtwet][ref1] geoorloofde middelen,


      [ref1]: https://wetten.overheid.nl/BWBR0002155
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002155
  - number: 6.3.b
    text: |-
      het is afkomstig van vrij wild dat onmiddellijk na de dood overeenkomstig door Onze Minister vast te stellen regels
      is behandeld,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.3.c
    text: |-
      het is afkomstig van vrij wild dat binnen een termijn van twaalf uur is vervoerd naar een verzamelplaats waar
      het op de door Onze Minister voorgeschreven temperaturen is gebracht en waarvandaan het naar een in onderdeel *d*
      bedoelde verwerkingsinrichting, slachthuis of uitsnijderij is vervoerd binnen een termijn van twaalf uur;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.3.d
    text: 'het is verkregen:'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.3.d.1°
    text: |-
      in een door de bevoegde centrale autoriteit van de betrokken lid-staat, overeenkomstig artikel 7 van richtlijn no.
      92/45/EEG erkende vrij-wildverwerkingsinrichting, of
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.3.d.2°
    text: in een door de bevoegde centrale autoriteit van de betrokken lid-staat erkende slachthuis of uitsnijderij,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.3.e
    text: het is gehanteerd onder bevredigende hygiënische omstandigheden,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.3.f
    text: |-
      het is post-mortem gekeurd door een officiële dierenarts en vertoonde geen afwijkingen, met uitzondering van
      eventueel bij het doden opgelopen traumatische laesies of van plaatselijke misvormingen of afwijkingen voor
      zover geconstateerd, zonodig met behulp van geschikte laboratoriumtests, die het vlees niet ongeschikt maken voor
      menselijke consumptie, noch enig gevaar opleveren voor de gezondheid van de mens,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.3.g
    text: het is voorzien van een officieel goedkeuringsmerk, en
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.3.h
    text: het is vergezeld van een gezondheidscertificaat of ander document.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: '6.4'
    text: |-
      Een partij vlees bestaande uit gehele stukken niet onthuid of grof wild, waarop [artikel 3][ref1] van toepassing
      is, voldoet aan het bepaalde in het derde lid, onderdeel *a, b, c* en *e* en aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: 3a
  - number: 6.4.a
    text: het heeft in een vrij-wild verwerkingsinrichting een keuring van de ingewanden ondergaan,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.4.b
    text: |-
      het is vergezeld van een gezondheidscertificaat, dat door de officiële dierenarts is ondertekend en waarin wordt
      verklaard dat het resultaat van de keuring bedoeld in onderdeel *a* bevredigend is en dat het vlees geschikt is
      voor menselijke consumptie,
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.4.c
    text: |-
      het is gebracht op een temperatuur die hoger is dan of gelijk is aan -1°C en lager dan +7°C en is op deze
      temperatuur gehouden tijdens het vervoer naar een verwerkingsinrichting binnen een termijn van ten hoogste zeven
      dagen die begint te lopen vanaf de in onderdeel *a* bedoelde keuring of lager dan +1°C en op deze temperatuur
      gehouden tijdens het vervoer naar een verwerkingsinrichting binnen een termijn van ten hoogste vijftien dagen die
      begint te lopen vanaf de in onderdeel *a* bedoelde keuring, en
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6.4.d
    text: |-
      het wordt in de verwerkingsinrichting van bestemming onthuid en ondergaat een keuring post mortem, als bedoeld in
      het derde lid, onderdeel *f*.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: '6.5'
    text: |-
      De afzender van een partij vlees mag, binnen een door de ambtenaar die de controle heeft verricht vast te stellen
      termijn, gebreken aan het vereiste certificaat of ander document laten herstellen door de bevoegde autoriteit in
      het land van verzending, waarna door de in dit lid bedoelde ambtenaar kan worden bepaald dat hij geen toepassing
      geeft aan het gestelde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: '6.6'
    text: Onze Minister kan met betrekking tot het het tweede, derde en vierde lid nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: '6.7'
    text: |-
      Het tweede lid, onderdeel *f*, is niet van toepassing op gehakt vlees afkomstig uit door Onze Minister aangewezen
      Lid-Staten.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6
  - number: 6a
    text: |-
      [Artikel 6][ref1] is niet van toepassing op vlees dat


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel6
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '6'
  - number: 6a.a
    text: |-
      met toestemming van Onze Minister na overleg met Onze Minister van Landbouw en Visserij bestemd wordt voor ander
      gebruik dan menselijke consumptie. Onze Minister kan aan deze toestemming voorwaarden verbinden;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6a
  - number: 6a.b
    text: |-
      bestemd is voor tentoonstellingen, bijzonder onderzoek of analyses, mits het na afloop van de tentoonstelling
      of voltooiing van het onderzoek of de analyse, met uitzondering van de voor de analyse gebruikte hoeveelheid,
      onbruikbaar wordt gemaakt voor voedsel voor mens en dier;
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6a
  - number: 6a.c
    text: |-
      bestemd is voor de bevoorrading van internationale organisaties en in Nederland gelegerde strijdkrachten van andere
      landen.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel6a
  - number: '7.1'
    text: |-
      Indien een partij niet verder in de handel mag worden gebracht als bedoeld in [artikel 6, eerste lid][ref1], wordt
      dit vanwege de ambtenaar die de controle heeft verricht ter kennis gebracht van de afzender van het vlees of diens
      lasthebber, alsmede van de bevoegde autoriteit in de lid-staat van verzending.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel6
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '6'
  - number: '7.2'
    text: |-
      Indien een partij vlees niet verder in de handel mag worden gebracht als bedoeld in [artikel 6, eerste lid][ref1],
      kan de afzender of diens lasthebber het nader oordeel van de inspecteur vragen. Het aanvragen van een nader oordeel
      dient schriftelijk te geschieden en uiterlijk binnen 24 uur na het eindigen van de dag waarop de beslissing tot het
      niet verder in de handel mogen brengen van een partij vlees is genomen; volgt op deze dag een zaterdag, een zondag
      of één of meer algemeen erkende feestdagen, dan wordt de termijn van 24 uur verlengd tot en met de eerstvolgende
      dat die niet een zaterdag, zondag of een algemeen erkende feestdag is. De inspecteur neemt alsdan een beslissing,
      welke in de plaats treedt van de beslissing van de Rijkskeuringsdierenarts.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel6
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '6'
  - number: '8'
    text: |-
      Degene die vlees dat aan één van de in [artikel 4, derde, vierde of vijfde lid][ref1], bedoelde controles wordt
      onderworpen, onder zich heeft, is gehouden dit vlees op te slaan overeenkomstig de aanwijzingen gegeven door de in
      [artikel 4, zesde lid][ref2], bedoelde ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002496#Artikel4
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002496
        artikel: '4'
  - number: '9.1'
    text: |-
      Vlees dat krachtens [artikel 6, eerste lid][ref1], niet verder in de handel mag worden gebracht, kan binnen
      tweemaal vierentwintig uur na de kennisgeving bedoeld in [artikel 7, eerste lid][ref2], met toestemming van de
      afzender of diens lasthebber, worden teruggevoerd naar het land van verzending, dan wel in Nederland worden bestemd
      uitsluitend voor ander gebruik dan voor menselijke consumptie, tenzij daartegen uit een oogpunt van volksgezondheid
      bezwaar bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002496#Artikel7
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002496
        artikel: '7'
  - number: '9.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid is de afzender bevoegd omtrent de redenen, welke geleid hebben tot
      een beslissing, als bedoeld in [artikel 6][ref1], uiterlijk binnen één maand na het eindigen van de dag waarop
      die beslissing is genomen het advies in te winnen van een der veterinaire deskundigen, die daartoe door de
      Commissie van de Europese Gemeenschappen zijn aangewezen, zulks met inachtneming van de door die commissie gestelde
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel6
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '6'
  - number: '9.3'
    text: |-
      Onze Minister kan nadere regels stellen met betrekking tot de opslag en het vervoer van vlees waarop het eerste en
      tweede lid van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel9
  - number: '10'
    text: |-
      Vlees, dat krachtens [artikel 6][ref1] niet verder in de handel mag worden gebracht, wordt, indien het niet
      binnen de in [artikel 9, eerste lid][ref2], gestelde termijn is teruggevoerd of niet tot terugvoering daarvan mag
      worden overgegaan dan wel indien het niet wordt bestemd of niet mag worden bestemd voor ander gebruik dan voor
      menselijke consumptie, overeenkomstig door Onze Minister gestelde regelen gemerkt en door de zorg van de ambtenaar,
      die het onderzoek heeft verricht, onbruikbaar gemaakt voor voedsel voor mens en dier. Indien de afzender van dit
      vlees gebruik heeft gemaakt van de hem in [artikel 9, tweede lid][ref3], toegekende bevoegdheid, heeft bedoelde
      onbruikbaarmaking niet plaats dan nadat de veterinaire deskundige zich een oordeel heeft kunnen vormen omtrent de
      redenen, welke tot de tot het niet verder in de handel mogen brengen hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002496#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002496#Artikel9
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002496
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0002496
        artikel: '9'
  - number: 10a
    text: |-
      De kosten welke voortvloeien uit het terugzenden van een partij vlees of het bestemmen van vlees voor ander gebruik
      dan voor menselijke consumptie, als bedoeld in [artikel 9, eerste lid][ref1], dan wel het onbruikbaar maken van een
      partij vlees, als bedoeld in [artikel 10][ref2], komen voor rekening van degene die zich deze partij vlees heeft
      laten toezenden, bedoeld in [artikel 4, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002496#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002496#Artikel4
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002496
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002496
        artikel: '4'
  - number: '11'
    text: |-
      Onze Minister kan bepalen, dat vlees, dat in Nederland wordt bestemd uitsluitend voor ander gebruik dan voor
      menselijke consumptie, als bedoeld in [artikel 9, eerste lid][ref1], overeenkomstig door hem te stellen regelen
      wordt voorzien van een merk.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel9
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '9'
  - number: '13.1'
    text: |-
      Indien een partij vlees niet verder in de handel mag worden gebracht als bedoeld in [artikel 6, eerste lid][ref1],
      dan wel indien Onze Minister van oordeel is dat in een inrichting gelegen in een der andere lid-staten van de
      Europese Unie, de bepalingen waarvan de erkenning van die inrichting afhankelijk is, niet of niet meer worden
      nageleefd, stelt hij de bevoegde autoriteit van de betrokken lid-staat daarvan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel6
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '6'
  - number: '13.2'
    text: |-
      Indien Onze Minister vreest, dat in de in het eerste lid bedoelde Staat de nodige maatregelen niet worden genomen
      of de genomen maatregelen niet voldoende zijn, stelt hij de Commissie van de Europese Gemeenschappen en de bevoegde
      autoriteiten van de andere lid-staten daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister kan, indien de in het tweede lid bedoelde commissie daartoe machtiging heeft verleend, het
      overbrengen naar Nederlands grondgebied van vlees, dat uit de betrokken inrichting afkomstig is verbieden totdat
      die commissie de verleende machtiging heeft ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel13
  - number: '15.1'
    text: |-
      Een wijziging van een of meer onderdelen van richtlijnen waarnaar in dit besluit wordt verwezen, treedt voor de
      toepassing van de artikelen van dit besluit waarin naar die onderdelen van deze richtlijnen wordt verwezen, in
      werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven dan wel
      zoveel eerder in de betrokken lid-staat aan die wijziging uitvoering is gegeven.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel15
  - number: '15.2'
    text: Dit besluit treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel15
  - number: '15.3'
    text: 'Dit besluit wordt aangehaald als: Besluit inzake vlees uit andere lid-staten.'
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel15
