        bwb_id: BWBR0002496
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002496
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002496
        artikel: '4'
  - number: '11'
    text: |-
      Onze Minister kan bepalen, dat vlees, dat in Nederland wordt bestemd uitsluitend voor ander gebruik dan voor
      menselijke consumptie, als bedoeld in [artikel 9, eerste lid][ref1], overeenkomstig door hem te stellen regelen
      wordt voorzien van een merk.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel9
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel11
