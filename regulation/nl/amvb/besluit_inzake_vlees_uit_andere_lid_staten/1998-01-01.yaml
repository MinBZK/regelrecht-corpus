        artikel: '6'
  - number: '8'
    text: |-
      Degene die vlees dat aan één van de in [artikel 4, derde, vierde of vijfde lid][ref1], bedoelde controles wordt
      onderworpen, onder zich heeft, is gehouden dit vlees op te slaan overeenkomstig de aanwijzingen gegeven door de in
      [artikel 4, zesde lid][ref2], bedoelde ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002496#Artikel4
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel8
