        artikel: '9'
  - number: '13'
    text: |-
      1 Indien een partij vlees niet verder in de handel mag worden gebracht als bedoeld in
      [artikel 6, eerste lid][ref1], dan wel indien Onze Minister van oordeel is dat in een inrichting gelegen in een der
      andere lid-staten van de Europese Unie, de bepalingen waarvan de erkenning van die inrichting afhankelijk is, niet
      of niet meer worden nageleefd, stelt hij de bevoegde autoriteit van de betrokken lid-staat daarvan in kennis.

      2 Indien Onze Minister vreest, dat in de in het eerste lid bedoelde Staat de nodige maatregelen niet worden genomen
      of de genomen maatregelen niet voldoende zijn, stelt hij de Commissie van de Europese Gemeenschappen en de bevoegde
      autoriteiten van de andere lid-staten daarvan in kennis.

      3 Onze Minister kan, indien de in het tweede lid bedoelde commissie daartoe machtiging heeft verleend, het
      overbrengen naar Nederlands grondgebied van vlees, dat uit de betrokken inrichting afkomstig is verbieden totdat
      die commissie de verleende machtiging heeft ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel6
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel13
    references:
