        artikel: '6'
  - number: '15'
    text: |-
      1 Een wijziging van een of meer onderdelen van richtlijnen waarnaar in dit besluit wordt verwezen, treedt voor
      de toepassing van de artikelen van dit besluit waarin naar die onderdelen van deze richtlijnen wordt verwezen,
      in werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven dan wel
      zoveel eerder in de betrokken lid-staat aan die wijziging uitvoering is gegeven.

      2 Dit besluit treedt in werking op een door Ons te bepalen tijdstip.

      3 Dit besluit wordt aangehaald als: Besluit inzake vlees uit andere lid-staten.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel15
