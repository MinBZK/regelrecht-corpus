articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt verstaan onder:

      a. *de wet:* de [Vleeskeuringswet][ref1];

      b. *Onze Minister:* Onze Minister van Sociale Zaken en Volksgezondheid;

      c. *inspecteur:* de inspecteur, voor het betrokken deel des lands belast met het toezicht op de naleving van de
      wet;

      d. vlees: alle voor menselijke consumptie geschikte delen van:

      1°. als landbouwhuisdieren gehouden runderen (de soort Bubalus, bubalis en Bison bison daaronder begrepen),
      varkens, schapen, geiten en eenhoevigen,

      2°. gekweekt wild, zijnde niet-gedomesticeerde landzoogdieren met uitzondering van lagomorfen, die niet worden
      vermeld onder 1, die in gevangenschap zijn gekweekt, gehouden en geslacht, en

      3°. vrij wild, zijnde bejaagde niet-gedomesticeerde landzoogdieren (met inbegrip van niet-gedomesticeerde
      zoogdieren die in een gesloten gebied leven met dezelfde vrijheid als vrij wild) met uitzondering van lagomorfen,
      die niet in gevangenschap zijn gekweekt, gehouden en geslacht;

      e. *officiële dierenarts:* door de bevoegde centrale autoriteit van een der andere lid-Staten van de Europese Unie
      aangewezen dierenarts;

      f. separatorvlees; vlees van slachtdieren als genoemd in onderdeel *d*, onder 1, 2 en 3 dat machinaal is
      afgescheiden van beenderen met daaraan vastzittend vlees;

      g. *derde land:* ander land dan de Lid-Staten van de Europese Unie;

      h. - richtlijn no. 77/99/EEG: - Richtlijn van de Raad van de Europese gemeenschappen van 21 december 1976,
      betreffende de gezondheidsvoorschriften voor de produktie en het in de handel brengen van vleesprodukten en
      bepaalde andere produkten van dierlijke oorsprong (*PbEG* 1977, L 26),
        - richtlijn no. 64/433/EEG: - Richtlijn van de Raad van de Europese Gemeenschappen betreffende de
      gezondheidsvoorschriften voor de produktie en het in de handel brengen van vers vlees (*PbEG* 1964, 121),
        - richtlijn no. 90/675/EEG: - Richtlijn van de Raad van de Europese Gemeenschappen van 10 december 1990, tot
      vaststelling van de beginselen voor de organisatie van de veterinaire controles voor produkten uit derde landen die
      in de Gemeenschap worden binnengebracht (*PbEG* 1990, L 373),
        - richtlijn no. 94/65/EG: Richtlijn van de Raad van de Europese Unie van 14 december 1994, tot vaststelling van
      voorschriften voor de produktie en het in de handel brengen van gehakt vlees en vleesbereidingen (*PbEG* L 368),
        - richtlijn no. 86/469/EEG: - Richtlijn van de Raad van de Europese Gemeenschappen van 16 september 1986, inzake
      het onderzoek van dieren en vers vlees op de aanwezigheid van residuen (*PbEG* 1986, L 275),
        - richtlijn no. 77/96/EEG: - Richtlijn van de Raad van de Europese Gemeenschappen van 21 december 1976 inzake het
      opsporen van trichinen bij de invoer van vers vlees van varkens, huisdieren, uit derde landen ( *PbEG* 1977, L 26),
        - richtlijn no. 92/45/EEG: - Richtlijn van de Raad van de Europese Gemeenschappen van 16 juni 1992, betreffende
      de gezondheidsvoorschriften en veterinairrechtlijke voorschriften voor het doden van vrij wild en het in de handel
      brengen van vlees van vrij wild (*PbEG* 1992, L 268), en
        - richtlijn no. 72/462/EEG: - Richtlijn van de Raad van de Europese Gemeenschappen van 12 december 1972, inzake
      gezondheidsvraagstukken en veterinairrechtelijke vraagstukken bij de invoer van runderen, varkens, schapen en
      geiten, van vers vlees of van vleesprodukten uit derde landen (*PbEG* 1972, L 302);

      i. gehakt vlees: vlees dat in kleine stukken is gehakt of door een hakmolen is gehaald en waaraan ten hoogste 1%
      zout is toegevoegd;

      j. werkplaats: elke uitsnijderij of inrichting voor de produktie van gehakt vlees, dat voldoet aan de eisen genoemd
      in bijlage I, hoofdstuk I, van de richtlijn no. 94/65/EG;

      k. een partij: een hoeveelheid vlees van dezelfde aard waarvoor één veterinair certificaat of document geldt, die
      met hetzelfde vervoermiddel wordt vervoerd en die afkomstig is uit dezelfde inrichting;

      l. in de handel brengen: het verkopen, te koop aanbieden, het afleveren of het ten geschenke geven, het tot vervoer
      of aflevering voorhanden hebben, het in voorraad hebben, het vervoeren of doen vervoeren, anders dan ter naleving
      van enig wettelijk voorschrift;

      m. bevoegde autoriteit: de centrale autoriteit van een lid-staat van de Europese Unie, die bevoegd is tot het
      verrichten van de veterinaire controles of de autoriteit waaraan de centrale autoriteit deze bevoegdheid heeft
      overgedragen;

      n. inrichting: onderneming waar vlees wordt geproduceerd, opgeslagen of bewerkt;

      o. plaats van bestemming: eerste plaats op Nederlands grondgebied waar een partij vlees verzonden uit een lid-staat
      van de Europese Unie in ontvangst wordt genomen;

      p. materiële controle: controle van het vlees zelf, die mede monsterneming ten behoeve van onderzoek in een
      laboratorium kan omvatten;

      q. vrij-wildverwerkingsinrichting: een inrichting waar het vrij wild wordt behandeld en het vlees van vrij wild
      wordt verkregen en gekeurd;

      r. speciale noodslachting: het doden, op last van een dierenarts, wegens een ongeval of ernstige lichamelijke en
      functionele stoornissen. De speciale noodslachting wordt buiten een slachthuis uitgevoerd indien de dierenarts
      meent dat vervoer onmogelijk is of onnodig lijden van het dier zou meebrengen;

      s. karkas: het uitgebloede gehele slachtdier dat is ontdaan van de ingewanden, waarvan de poten zijn afgesneden
      ter hoogte van het voorkniegewricht respectievelijk het spronggewricht, en waarvan de kop, de staart en de uier
      zijn verwijderd; voor runderen, schapen, geiten en eenhoevigen betreft het karkassen als hierboven bedoeld na het
      onthuiden. Bij varkens hoeven de poten niet ter hoogte van het voorkniegewricht, respectievelijk het spronggewricht
      te worden afgesneden en hoeft de kop niet te worden verwijderd wanneer het vlees bestemd is om te worden behandeld
      overeenkomstig de regelen gesteld krachtens richtlijn no. 77/99/EEG;

      t. slachtafval: vlees dat geen deel uitmaakt van het karkas als omschreven onder *s*, ook indien het op natuurlijke
      wijze met het karkas verbonden blijft;

      u. ingewanden: het slachtafval in de borst-, buik- en de bekkenholte, met inbegrip van de luchtpijp en de slokdarm.


