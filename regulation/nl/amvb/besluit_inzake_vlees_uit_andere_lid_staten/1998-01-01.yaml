  - number: 4a
    text: |-
      1 Met betrekking tot de registratie bedoeld in [artikel 4, eerste lid][ref1], gelden de navolgende bepalingen:

      a. registratie wordt verricht van een natuurlijke persoon of van een rechtspersoon, zij is gebonden aan de
      geregistreerde natuurlijke persoon of rechtspersoon,

      b. alle geregistreerde natuurlijke personen en rechtspersonen worden door de krachtens
      [artikel 4, eerste lid][ref2], aangewezen autoriteit op een lijst geplaatst,

      c. degene die overeenkomstig onderdeel *b* is geregistreerd moet:

      1°. een register bijhouden waarin ten minste de leveringen en de verdere bestemming van vlees bedoeld in
      [artikel 3][ref3] worden vermeld,

      2°. gedurende ten minste zes maanden alle certificaten of andere documenten bewaren die het vlees bedoeld in
      [artikel 3][ref4] vergezelden en deze desgevraagd tonen aan de in [artikel 4, zesde lid][ref5], bedoelde ambtenaar,
      dan wel aan de in onderdeel *b* bedoelde autoriteit en

      3°. op verzoek van de in [artikel 4, zesde lid][ref6], bedoelde ambtenaar de aankomst melden van vlees bedoeld in
      [artikel 3][ref7], voor zover dit noodzakelijk is voor het verrichten van wettelijk voorgeschreven controles,

      d. een registratie kan door de in onderdeel *b* bedoelde autoriteit worden beëindigd, indien blijkt dat de
      geregistreerde natuurlijke of rechtspersoon de bij of krachtens dit besluit geldende voorschriften niet heeft
      nageleefd,

      e. een registratie kan door de in onderdeel *b* bedoelde autoriteit eveneens worden beëindigd indien gedurende een
      ononderbroken tijdvak van een jaar geen handelingen zijn verricht met gebruikmaking van de registratie als bedoeld
      in [artikel 4, eerste lid][ref8], en

      f. de beschikking tot beëindiging van een registratie vermeldt de gronden waarop zij steunt en wordt aan de
      geregistreerde natuurlijke persoon of rechtspersoon bij aangetekende brief toegezonden.

      2 De in het eerste lid, onderdeel *c*, genoemde voorschriften kunnen door Onze Minister worden gewijzigd, aangevuld
      of ingetrokken.


