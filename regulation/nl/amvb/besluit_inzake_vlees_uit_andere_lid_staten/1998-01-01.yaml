  - number: '2'
    text: |-
      De artikelen 27-29 van de wet zijn niet van toepassing ten aanzien van vlees, hetwelk uit een der andere lid-Staten
      van de Europese Unie naar Nederland is verzonden, met uitzondering van vlees afkomstig van slachtdieren die zijn
      geslacht in een slachthuis dat gelegen is in een derde land en dat niet door Onze Minister op grond van artikel
      30*a* van de wet is aangewezen, danwel gehakt geproduceerd in een derde land.
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden uit een der lid-staten van de Europese Unie naar Nederland verzonden vlees op Nederlands
      grondgebied te brengen, anders dan in doorvoer naar een derde land, indien het betreft:

      a. vlees van:

      1°. dieren waarbij een van de volgende ziekten is vastgesteld:

        - Mond- en klauwzeer (MKZ),
        - Klassieke varkenspest (KVP),
        - Afrikaanse varkenspest (AVP),
        - Vesiculaire varkensziekte (VVZ),
        - Newcastle Disease (ND),
        - Runderpest,
        - Ziekte van kleine herkauwers ("Peste des petits ruminants"),
        - Vesiculaire stomatitis (VS),
        - Bluetongue,
        - Paardepest,
        - Virale paardepest-encefalomyelitis,
        - Teschener-ziekte,
        - Vogelpest,
        - Schape- en geitepokken,
        - Nodulaire dermatose,
        - Rifvalleykoorts,
        - Besmettelijke bovine pleuropneumonie,
        - gegeneraliseerde actinobacillose of gegeneraliseerde actinomycose,
        - miltvuur en boutvuur,
        - gegeneraliseerde tuberculose,
        - gegeneraliseerde lymfadenitis,
        - kwade droes,
        - hondsdolheid,
        - tetanus,
        - acute salmonellose,
        - acute brucellose,
        - vlekziekte,
        - botulisme,
        - septicemie, pyaemie, toxemie en viremie,

      2°. dieren die acute laesies vertoonden van bronchopneumonie, pleuritis, peritonitis, metritis, mastitis,
      arthritis, pericarditis, enteritis of menningo-encephalomyelitis, bevestigd door een gedetailleerde keuring,
      eventueel aangevuld met een bacteriologisch onderzoek en een onderzoek op residuen van stoffen met farmacologische
      werking. Wanneer de resultaten van deze bijzondere onderzoeken gunstig zijn, worden de karkassen evenwel geschikt
      voor menselijke consumptie verklaard na verwijdering van de voor consumptie ongeschikte delen,

      3°. dieren die leden aan de volgende parasitaire ziekten: gegeneraliseerde sarcosporidiose en gegeneraliseerde
      cysticercose en trichinose,

      4°. gestorven dieren, doodgeboren dieren of ongeboren dode vruchten,

      5°. te jong geslachte dieren waarvan het vlees oedeemverschijnselen vertoont,

      6°. sterk vermagerde dieren of dieren met uitgesproken anemie, en

      7°. dieren die multiple tumoren, multiple abcessen of multiple ernstige verwondingen in verschillende delen van het
      karkas of in verschillende ingewanden vertoonden,

      b. vlees van:

      1°. dieren die positief of onduidelijk hebben gereageerd op tuberculine waarbij bij de keuring na het slachten
      verricht onderzoek plaatselijke tubeerculoselaesies heeft aangetoond in meerdere organen of meerdere delen van het
      karkas. Wanneer een tuberculoselaesie is geconstateerd in de klieren van een zelfde orgaan of deel van een karkas,
      worden evenwel enkel het aangetaste orgaan of deel van het karakas en de bijbehorende lymfklieren ongeschikt voor
      menselijke consumptie verklaard,

      2°. dieren die positief of onduidelijk hebben gereageerd op een brucellosetest waarbij de ziekte is bevestigd door
      laesies die wijzen op een acute aandoening. Zelfs indien dergelijke laesies niet zijn geconstateerd, worden toch de
      uier, het genitaal apparaat en het bloed ongeschikt voor menselijke consumptie verklaard,

      c. delen van karkassen die ernstige serum- of bloedinfiltraties, gelokaliseerde abcessen of gelokaliseerde
      verontreinigingen vertonen,

      d. slachtafvallen en ingewanden die pathologische laesies van infectieuze, parasitaire of traumatische oorsprong
      vertonen,

      e. vlees van koortsige dieren,

      f. vlees dat ernstige afwijkingen vertoont inzake kleur, geur, consistentie en smaak,

      g. wanneer de keuringsdierenarts constateert dat karkassen of slachtafvallen aangetast zijn door lymfadenitis
      caseosus of een andere etterige aandoening die echter niet gegeneraliseerd is noch gepaard gaat met sterke
      vermagering:

      1°. alle organen en daarmee verbonden lymfeklieren die deze aandoening in- of uitwendig vertonen, en

      2°. in alle gevallen waarop sub 1 niet van toepassing is, de laesie en de aangrenzende delen, die hij, te zijner
      beoordeling, ongeschikt acht, de ouderdom en de activiteit van de laesie in aanmerking genomen, met dien verstande
      dat een oude goed ingekapselde laesie als inactief mag worden beschouwd,

      h. vlees van de weggesneden steekplaats,

      i. wanneer de keuringsdierenarts constateert dat hele karkassen of delen van karkassen dan wel slachtafvallen
      aangetast zijn door een andere ziekte of aandoening dan die vermeld in de voorgaande punten, het gehele karkas
      en de slachtafvallen of het deel van het karkas of het slachtafval waarvan hij denkt dat het ongeschikt voor
      menselijke consumptie moet worden verklaard,

      j. karkassen waarvan de slachtafvallen niet aan de keuring na het slachten zijn onderworpen,

      k. het bloed van dieren waarvan het vlees overeenkomstig de bovenstaande punten ongeschikt voor menselijke
      consumptie is verklaard, alsmede bloed dat besmet is door de maaginhoud of door een andere stof,

      l. vlees van dieren waaraan de volgende stoffen zijn toegediend:

      1°. door Onze Minister aangewezen produkten waardoor het vlees gevaarlijk of schadelijk voor de gezondheid van de
      mens kan zijn, en

      2°. malsmakers (tenderizers),

      m. vlees dat residuen bevat van door Onze Minister aangewezen stoffen en residuen van geneesmiddelen, van
      antibiotica, van bestrijdingsmiddelen of van andere stoffen die schadelijk zijn of er eventueel toe te kunnen
      leiden dat de consumptie van vers vlees gevaarlijk of schadelijk is voor de gezondheid van de mens, in hoeveelheden
      die de door Onze Minister vastgestelde toleranties overschrijden,

      n. vlees dat besmet of aangetast is in een door Onze Minister vastgestelde mate.

      o. levers en nieren van dieren van meer dan twee jaar oud afkomstig uit gebieden waarin men bij de uitvoering van
      overeenkomstig richtlijn no. 86/469/EEG goedgekeurde plannen een algemene aanwezigheid van zware metalen in het
      milieu heeft kunnen constateren,

      p. vlees dat behandeld is met ioniserende of ultraviolette stralen, onverminderd eventuele communautaire
      voorschriften inzake doorstraling,

      q. vlees dat een uitgesproken seksuele geur verspreidt,

      r. vlees van dieren die bij een speciale noodslachting zijn gedood,

      s. vlees afkomstig van op grond van artikel 4 van richtlijn no. 64/433/EEG door de bevoegde autoriteit van de
      betrokken lid-staat erkende inrichtingen,

      t. vlees van vrij wild, dat door Onze Minister aan te wijzen stoffen heeft opgenomen, waardoor de consumptie van
      het vlees gevaarlijk of schadelijk voor de gezondheid van de mens kan zijn,

      u. vlees van vrij wild waarbij de dood aan andere oorzaken is te wijten dan de jacht,

      v. vlees dat met andere kleurstoffen is gemerkt dan door Onze Minister voorgeschreven,

      w. vlees, niet zijnde vlees van gehouden wild of vrij wild, van mannelijke varkens bestemd voor de fok, van
      cryptorchiede en hermafrodiete varkens en van niet-gecastreerde mannelijke varkens met een geslacht gewicht
      hoger dan 80 kg, tenzij de inrichting op basis van een door Onze Minister goedgekeurde methode kan garanderen dat
      karkassen met een uitgesproken seksuele geur kunnen worden opgespoord en het vlees is voorzien van het speciale
      merk als bedoeld in beschikking no. 84/371/EEG van de Commissie van de Europese Gemeenschappen van 3 juli 1984
      (*PbEG* L 196) en bestemd is om een behandeling als bedoeld in richtlijn no. 77/99/EEG te ondergaan,

      x. vlees van dieren die niet op gegeneraliseerde wijze zijn aangetast door Cysticercus bovis of Cysticercus
      cellulosae, tenzij het een koudebehandeling heeft ondergaan, overeenkomstig een door Onze Minister goedgekeurde
      methode,

      y. vlees van varkens of paarden, dat niet overeenkomstig het bepaalde in richtlijn no. 77/96/EEG op trichinen is
      onderzocht, tenzij het een koudebehandeling heeft ondergaan overeenkomstig bijlage IV van die richtlijn. Vlees
      van everzwijnen of van andere voor besmetting met trichinen vatbare soorten gekweekt wild of vrij wild, moet zijn
      onderzocht met behulp van een digestiemethode overeenkomstig richtlijn no. 77/96/EEG,

      z. separatorvlees,

      aa. slachtafvallen van vrij wild,

      ab. delen van organen met uitzondering van in plakken gesneden levers van als huisdier gehouden runderen als
      bedoeld in [artikel 1, onderdeel ][ref1],

      2 In afwijking van het eerste lid kan Onze Minister onder door hem vast te stellen voorwaarden, toestemming
      verlenen om uit door hem aangewezen lid-staten vlees als bedoeld in het eerste lid, onderdelen *z* en *ab* op
      Nederlands grondgebied te brengen.

      3 Onze Minister kan toestemming verlenen om uit door hem aangewezen lid-staten of delen van lid-staten vlees op
      Nederlands grondgebied te brengen, dat niet voldoet aan het eerste lid, onderdeel *y*, wanneer:

      a. met epidemiologische studies is aangetoond dat er geen trichinen aanwezig zijn, en

      b. de levende en gedode dieren worden onderworpen aan een doeltreffende opsporings- en controlemethode.

      4 De in het eerste lid, onderdeel *w*, bedoelde behandeling wordt uitgevoerd in een door de bevoegde autoriteit
      overeenkomstig richtlijn no. 77/99/EEG aangewezen inrichting.


