  - number: 3a
    text: |-
      Het is tevens verboden uit één der andere lid-staten van de Europese Unie naar Nederland verzonden vlees op
      Nederlands grondgebied te brengen, anders dan als doorvoer naar een derde land, indien niet is voldaan aan het
      bepaalde in [artikel 4, eerste, tweede, zevende en achtste lid][ref1], 8 en 10*a*.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel4
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002496
        artikel: '4'
  - number: '4'
    text: |-
      1 Degene die zich partijen vlees rechtstreeks laat toezenden waarop [artikel 3][ref1] van toepassing is, is
      verplicht voorafgaande aan de toezending, zich te laten registreren bij de door Onze Minister, na overleg met Onze
      Minister van Landbouw, Natuurbeheer en Visserij aangewezen autoriteit.

      2 Degene die zich een partij vlees rechtstreeks laat toezenden en geregistreerd is als bedoeld in het eerste lid,
      dient nadat de partij vlees op Nederlands grondgebied is gebracht, voorafgaand aan de ontvangst, onderscheidenlijk
      de verdere verhandeling of verdeling van de partij vlees, een controle te verrichten op de aanwezigheid van de
      krachtens richtlijn no. 64/433/EEG, onderscheidenlijk indien het gehakt vlees betreft, krachtens richtlijn no.
      94/65/EG vereiste merken en certificaten of andere documenten en dient de bevoegde autoriteit in kennis te stellen
      van nalatigheden of onregelmatigheden.

      3 Een partij vlees die bestemd is voor Nederland en die op Nederlands grondgebied is gebracht, kan op de plaats van
      bestemming steekproefsgewijs en op niet discriminerende wijze worden gecontroleerd of zij voldoet aan het bepaalde
      in [artikel 3][ref2] en 6, tweede lid.

      4 Een partij vlees die bestemd is voor een andere lid-staat en die op Nederlands grondgebied is gebracht kan,
      indien er een ernstig vermoeden bestaat dat het vlees niet overeenkomstig de bepalingen krachtens richtlijn
      no. 64/433/EEG, onderscheidenlijk indien het gehakt vlees betreft, krachtens richtlijn no. 94/65/EG, in het
      intracommunautaire handelsverkeer is gebracht, tijdens het vervoer worden gecontroleerd op de aanwezigheid
      van krachtens deze richtlijnen vereiste merken en certificaten of andere documenten, alsmede of aan de overige
      bepalingen van de desbetreffende richtlijn is voldaan.

      5 Indien de in het tweede, derde en vierde lid bedoelde controles daartoe aanleiding geven, wordt het vlees aan een
      materiële controle onderworpen.

      6 De controles bedoeld in het derde, vierde en vijfde lid, worden verricht door een krachtens artikel 27, eerste
      lid, van de wet aangewezen ambtenaar, die zich bij de uitoefening van de controles kan laten bijstaan door één of
      meer personen als bedoeld in artikel 25, laatste zinsnede, van de wet.

      7 Degene die vlees onder zich heeft is verplicht medewerking te verlenen aan de in het derde, vierde en vijfde lid
      bedoelde controles, indien de hiertoe aangewezen ambtenaar of de hiertoe aangewezen personen hierom verzoeken.

      8 Onze Minister kan na overleg met Onze Minister van Landbouw, Natuurbeheer en Visserij nadere regels stellen met
      betrekking tot de registratie bedoeld in het eerste lid en de controles bedoeld in het tweede, derde, vierde en
      vijfde lid, alsmede met betrekking tot de opslag en het vervoer van vlees, dat ingevolge [artikel 6][ref3] niet
      verder in de handel mag worden gebracht.


