      - id: ref2
        bwb_id: BWBR0002496
        artikel: '4'
  - number: '9'
    text: |-
      1 Vlees dat krachtens [artikel 6, eerste lid][ref1], niet verder in de handel mag worden gebracht, kan binnen
      tweemaal vierentwintig uur na de kennisgeving bedoeld in [artikel 7, eerste lid][ref2], met toestemming van de
      afzender of diens lasthebber, worden teruggevoerd naar het land van verzending, dan wel in Nederland worden bestemd
      uitsluitend voor ander gebruik dan voor menselijke consumptie, tenzij daartegen uit een oogpunt van volksgezondheid
      bezwaar bestaat.

      2 Onverminderd het bepaalde in het eerste lid is de afzender bevoegd omtrent de redenen, welke geleid hebben tot
      een beslissing, als bedoeld in [artikel 6][ref3], uiterlijk binnen één maand na het eindigen van de dag waarop
      die beslissing is genomen het advies in te winnen van een der veterinaire deskundigen, die daartoe door de
      Commissie van de Europese Gemeenschappen zijn aangewezen, zulks met inachtneming van de door die commissie gestelde
      voorschriften.

      3 Onze Minister kan nadere regels stellen met betrekking tot de opslag en het vervoer van vlees waarop het eerste
      en tweede lid van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002496#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002496#Artikel6
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel9
