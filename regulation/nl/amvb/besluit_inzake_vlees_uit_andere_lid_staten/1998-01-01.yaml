  - number: '5'
    text: |-
      1 [Artikel 4][ref1] is niet van toepassing op:

      a. vlees, dat zich bevindt in of op een middel van vervoer en dat bestemd is uitsluitend voor het persoonlijk
      gebruik van hen, die daarin of daarop verblijven, voorzover daarbij geen sprake is van meer dan 10 kg per persoon;

      b. vlees dat zich in de persoonlijke bagage van reizigers bevindt en voor eigen gebruik wordt vervoerd, voorzover
      de gevoerde hoeveelheid 3 kg per persoon niet overschrijdt;

      c. vlees dat bestemd is voor de bevoorrading van internationale organisaties en in Nederland gelegerde
      strijdkrachten van andere landen.

      2 Onze Minister stelt nadere regelen ten aanzien van het in het eerste lid, onder *b*, bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002496#Artikel4
    url: https://wetten.overheid.nl/BWBR0002496/1998-01-01#Artikel5
