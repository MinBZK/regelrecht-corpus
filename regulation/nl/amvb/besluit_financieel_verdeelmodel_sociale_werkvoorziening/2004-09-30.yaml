        artikel: '9'
  - number: '5'
    text: |-
      1 De subsidie wordt als volgt betaalbaar gesteld: in de maand mei 14,75 procent en in de overige maanden 7,75
      procent van het berekende bedrag.

      2 De betalingen vinden plaats op of omstreeks de 15e dag van iedere maand.
    url: https://wetten.overheid.nl/BWBR0008953/2004-09-30#Artikel5
  - number: '6'
    text: |-
      1 Indien bij ministeriële regeling vastgestelde bescheiden niet of niet volledig binnen de daarvoor gestelde
      termijnen zijn ontvangen kan de betaling van de subsidie door Onze Minister worden opgeschort.

      2 Hervatting van de betaling vindt zo spoedig mogelijk plaats na ontvangst van de in het eerste lid bedoelde
      bescheiden, doch uiterlijk op of omstreeks de 15e dag van de maand volgend op de maand waarin de bescheiden zijn
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0008953/2004-09-30#Artikel6
  - number: '9'
    text: |-
      1 Personen die op de dag voorafgaand aan de datum van inwerkingtreding van de wet reeds in de sociale
      werkvoorziening werkzaam zijn, worden, zolang die dienstbetrekking voortduurt, ingedeeld in de
      arbeidshandicapcategorie matig.

      2 Het eerste lid is van overeenkomstige toepassing op een werknemer die na toepassing van
      [artikel 8, eerste lid, van het Besluit arbeidsinpassing en begeleiding sociale werkvoorziening][ref1] of
      [artikel 8, vijfde lid, van het Besluit indicatie sociale werkvoorziening][ref2] een arbeidsovereenkomst aangaat
      als bedoeld in hoofdstuk 3 van de wet.

      3 Personen met beperkingen ten gevolge van stoornissen, zoals gekwalificeerd in de internationale classificatie van
      stoornissen, beperkingen en handicaps onder punt 50.0 tot en met 50.5, 51 en 52 en die op de dag voorafgaand aan
      de inwerkingtreding van de wet werkzaam zijn bij een bij ministeriële regeling aangewezen rechtspersoon, worden,
      zolang die dienstbetrekking voortduurt, ingedeeld in de arbeidshandicapcategorie ernstig.


      [ref1]: https://wetten.overheid.nl/BWBR0008952#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008954#Artikel8
    url: https://wetten.overheid.nl/BWBR0008953/2004-09-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008952
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0008954
        artikel: '8'
  - number: '10'
    text: |-
      1 Op verzoek van een gemeente, gedaan vóór 1 juli van enige kalenderjaar, wordt de subsidie over een komend
      subsidiejaar verleend en betaald aan en vastgesteld ten behoeve van een andere gemeente dan over het lopende
      subsidiejaar. Bij een dergelijk verzoek geeft de gemeente aan op welke wijze de subsidie wordt verdeeld en overlegt
      zij een verklaring van de andere gemeente waaruit blijkt dat:

      a. die gemeente bereid is de uitvoering van de wet op zich te nemen, en

      b. de door de gemeente aangegeven wijze van verdeling van de subsidie juist is.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot de verklaring en de gegevens die de gemeente
      bij het verzoek, bedoeld in het eerste lid, aan Onze Minister overlegt.
    url: https://wetten.overheid.nl/BWBR0008953/2004-09-30#Artikel10
  - number: '12'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008953/2004-09-30#Artikel12
