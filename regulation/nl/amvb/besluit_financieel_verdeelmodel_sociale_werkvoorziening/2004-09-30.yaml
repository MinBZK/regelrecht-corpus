preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 8 juli 1997, directie Arbeidsmarkt, nr.
    AM/RAW/97/1421;

    Gelet op de artikelen 7, tweede lid, 8, derde, vijfde en achtste lid, 9, derde lid, en 18 van de Wet sociale
    werkvoorziening;

    De Raad van State gehoord (advies van 12 augustus 1997, no. W12.970416);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 1 oktober 1997, directie
    Arbeidsmarkt nr. AM/RAW/97/1946;

    Hebben goed gevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008953/2004-09-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Wet sociale werkvoorziening][ref1];

      b. de standaardeenheid: de eenheid die overeenkomt met een arbeidsplaats van 36 uur voor een werknemer
      die op grond van de indicatie of herindicatie, bedoeld in artikel 11 van de wet, op grond van
      [artikel 6, eerste lid, van het Besluit indicatie sociale werkvoorziening][ref2], is ingedeeld in de
      arbeidshandicapcategorie matig;

      c. arbeidsplaats: een of meer dienstbetrekkingen met de gemeente, bedoeld in hoofdstuk 2 van de wet, alsmede een of
      meer arbeidsovereenkomsten, bedoeld in hoofdstuk 3 van de wet, die het gehele kalenderjaar zijn vervuld op tienden
      nauwkeurig omgerekend naar een werkweek van 36 uur, waarbij vijfhonderdste of meer naar boven wordt afgerond op
      een tiende;

      d. subsidiejaar: het jaar (t) waarvoor de subsidie wordt verleend;

      e. toekenning: het aantal standaardeenheden over enig subsidiejaar waarvoor aan een gemeente subsidie wordt
      verstrekt;

      f. realisatie: het aantal arbeidsplaatsen uitgedrukt in standaardeenheden dat door een gemeente in enig jaar
      feitelijk is gerealiseerd;

      g. overrealisatie: het deel van de realisatie dat door een gemeente in enig jaar boven de toekenning is
      gerealiseerd;

      h. onderrealisatie: het deel van de toekenning dat door een gemeente in enig jaar niet is gerealiseerd;

      i. grondslag: de toekenning van het jaar (t-1) voorafgaand aan het subsidiejaar (t) zoals dat op 1 oktober van het
      jaar voorafgaand aan het subsidiejaar bij Onze Minister bekend is, gecorrigeerd door een bij ministeriële regeling
      vast te stellen factor;

      j. gecorrigeerde gemeentelijke wachtlijst: het in het jaar (t-2) voorafgaand aan het jaar (t-1) van
      de grondslag gemiddeld in standaardeenheden uitgedrukt aantal personen van de wachtlijst, bedoeld in
      [artikel 7 van het Besluit indicatie sociale werkvoorziening][ref3], vermeerderd met de overrealisatie in dat jaar
      (t-2), en verminderd met de onderrealisatie in dat jaar (t-2);

      k. gecorrigeerde landelijke wachtlijst: de som van de gecorrigeerde gemeentelijke wachtlijsten;

      l. relatieve wachtlijst: de gecorrigeerde gemeentelijke wachtlijst gedeeld door de gecorrigeerde landelijke
      wachtlijst;

      m. netto uitstroompercentage: het aantal arbeidsplaatsen uitgedrukt in standaardeenheden dat in enig jaar door de
      gemeente is beëindigd op grond van titel 10 van boek 7 van het Burgerlijk Wetboek of de wet als percentage van het
      aantal arbeidsplaatsen, uitgedrukt in standaardeenheden, dat in dat jaar door de gemeente is gerealiseerd;

      n. gemiddelde netto uitstroompercentage: het gemiddelde van de netto uitstroompercentages over de drie jaren (t-4,
      t-3 en t-2) voorafgaand aan het jaar (t-1) van de grondslag;

      o. gemeentelijke vacatureruimte: een bij ministeriële regeling vast te stellen deel van het gemiddelde netto
      uitstroompercentage vermenigvuldigd met de grondslag;

      p. landelijke vacatureruimte: de som van de gemeentelijke vacatureruimten vermenigvuldigd met een bij ministeriële
      regeling vast te stellen factor.

      2 Een arbeidsplaats voor een werknemer die op grond van
      [artikel 6, eerste lid, van het Besluit indicatie sociale werkvoorziening][ref4] is ingedeeld in de
      arbeidshandicapcategorie licht en een arbeidsplaats voor een werknemer die op grond van voornoemde bepaling is
      ingedeeld in de arbeidshandicapcategorie ernstig, wordt als factor van de standaardeenheid uitgedrukt. De hoogte
      van de factoren wordt jaarlijks bij ministeriële regeling vastgesteld.

      3 De realisatie, bedoeld in het eerste lid, onder *f*, wordt berekend door de eindaantallen uitgedrukt in
      standaardeenheden van de maanden van het jaar bij elkaar op te tellen en te delen door twaalf.

      4 Het gemiddeld in standaardeenheden uitgedrukt aantal personen van de wachtlijst, bedoeld in het eerste lid,
      onder *j*, wordt berekend door de eindaantallen uitgedrukt in standaardeenheden van de kwartalen van het jaar van
      de genoemde personen bij elkaar op te tellen en te delen door vier. Daarbij wordt bij de berekening een persoon
      die op de wachtlijst is geplaatst, gelijkgesteld aan een werknemer met dezelfde arbeidshandicapcategorie die een
      arbeidsplaats vervult.

      5 Bij de berekening van het netto uitstroompercentage, bedoeld in het eerste lid, onder *m*, worden werknemers die
      in onmiddellijke aansluiting op een dienstbetrekking of arbeidsovereenkomst als bedoeld in de hoofdstukken 2 en 3
      van de wet, arbeid aanvaarden op basis van een arbeidsovereenkomst onder normale omstandigheden, buiten beschouwing
      gelaten.


