        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008953
        artikel: '4'
  - number: '3'
    text: |-
      1 De subsidie van de standaardeenheid wordt bepaald door het totaal van de voor het subsidiejaar (t) ter uitvoering
      van de wet beschikbare begrotingsmiddelen, nadat daarop de voor [artikel 4, eerste en tweede lid][ref1], benodigde
      middelen en andere bij ministeriële regeling vastgestelde middelen in mindering zijn gebracht, te delen door het
      totaal van de in het subsidiejaar (t) bij de gemeenten te subsidiëren aantal standaardeenheden.

      2 Het landelijk te subsidiëren aantal standaardeenheden wordt bepaald door het totaal aantal toegekende
      standaardeenheden in het jaar (t-1) voorafgaand aan het subsidiejaar (t) te corrigeren met een bij ministeriële
      regeling vast te stellen factor.


      [ref1]: https://wetten.overheid.nl/BWBR0008953#Artikel4
    url: https://wetten.overheid.nl/BWBR0008953/2004-09-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008953
        artikel: '4'
  - number: '4'
    text: |-
      1 De subsidie over enig jaar, verleend vóór 1 oktober van het voorgaande jaar t-1, wordt vóór 1 oktober van het
      jaar t aangevuld tot 95% van de realisatie van het jaar t-1, wanneer blijkt dat de subsidie meer dan 5% lager is
      dan de realisatie in het jaar t-1. De eerste volzin geldt voor zover de realisatie de toekenning in het jaar t-1
      niet te boven gaat.

      2 Bij de berekening van de subsidie op basis van het eerste lid worden wijzigingen van de subsidie als bedoeld in
      [artikel 8, zesde lid, van de wet][ref1] en afwijkingen van de verleende subsidie bij de definitieve vaststelling
      op grond van [artikel 9, eerste lid, van de wet][ref2] buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel9
    url: https://wetten.overheid.nl/BWBR0008953/2004-09-30#Artikel4
