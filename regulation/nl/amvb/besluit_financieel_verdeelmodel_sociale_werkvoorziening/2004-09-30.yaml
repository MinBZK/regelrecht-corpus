  - number: '2'
    text: |-
      1 De subsidie aan de gemeente, bedoeld in artikel 8 van de wet, wordt berekend door de subsidie per
      standaardeenheid, bedoeld in [artikel 3, eerste lid][ref1], te vermenigvuldigen met het aantal standaardeenheden
      dat bepaald wordt door de grondslag van de gemeente te verminderen met de gemeentelijke vacatureruimte en te
      vermeerderen met het product van de landelijke vacatureruimte en de relatieve wachtlijst.

      2 Aan een gemeente wordt over enig jaar geen subsidie verstrekt als de toekenning voor de gemeente minder dan één
      bedraagt. In dat geval wordt [artikel 4][ref2] niet toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0008953#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008953#Artikel4
    url: https://wetten.overheid.nl/BWBR0008953/2004-09-30#Artikel2
    references:
