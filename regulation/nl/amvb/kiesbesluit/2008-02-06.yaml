        artikel: D_3
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '139'
  - number: D 4
    text: |-
      1 Bij inwilliging van het verzoek stellen burgemeester en wethouders van 's-Gravenhage op het verzoekschrift
      daaromtrent een aantekening en registreren zij de verzoeker als kiezer.

      2 Indien een verzoek niet kan worden ingewilligd, vermelden burgemeester en wethouders van 's-Gravenhage de reden
      hiervan op het verzoekschrift, waarna dit onverwijld aan de verzoeker wordt teruggezonden.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelD_4
  - number: D 5
    text: |-
      Indien aan het orgaan waarbij overeenkomstig [artikel D 3, derde, vierde of vijfde lid, van de Kieswet][ref1] een
      verzoek tot registratie van de kiesgerechtigdheid kan worden ingediend, omstandigheden bekend worden, op grond
      waarvan een persoon die ingevolge [artikel D 3, eerste lid, van de Kieswet][ref2] als kiezer is geregistreerd, niet
      als kiezer behoort te zijn geregistreerd, wordt daarvan terstond mededeling gedaan aan burgemeester en wethouders
      van 's-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
