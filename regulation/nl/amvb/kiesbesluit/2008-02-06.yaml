  - number: I 2
    text: |-
      1 Het tijdstip en de plaats van de zitting van het hoofdstembureau, bedoeld in [artikel I 4 van de Kieswet][ref1],
      worden tijdig door de voorzitter ter openbare kennis gebracht. Indien het betreft de verkiezing van de leden van
      de Tweede Kamer, geschiedt de kennisgeving in één of meer dag- of nieuwsbladen die verspreid worden in de gemeente
      waar het hoofdstembureau is gevestigd. Indien het betreft de verkiezing van de leden van provinciale staten of de
      gemeenteraad, geschiedt de kennisgeving op de in de provincie, onderscheidenlijk de gemeente, gebruikelijke wijze.

      2 Het tijdstip en de plaats van de zitting van het centraal stembureau, bedoeld in
      [artikel I 12 van de Kieswet][ref2], worden tijdig door de voorzitter ter openbare kennis gebracht. Indien
      het betreft de verkiezing van de leden van de Tweede Kamer, geschiedt de kennisgeving in de *Nederlandse
      Staatscourant*. Indien het betreft de verkiezing van de leden van provinciale staten of de gemeenteraad, geschiedt
      de kennisgeving op de in de provincie, onderscheidenlijk de gemeente, gebruikelijke wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_12
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelI_2
