  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken van 29 augustus 1989, nr. CW89/1/U9, Stafafdeling
    Constitutionele Zaken en Wetgeving;

    Gelet op de Kieswet;

    Gezien het advies van de Kiesraad van 5 april 1989, nr. 4129; De Raad van State gehoord (advies van 10 oktober
    1989, nr. W04.89.0517);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken van 16 oktober 1989, nr. CW89/1/U13
    Stafafdeling Constitutionele Zaken en Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelAanhef
articles:
  - number: D 1
    text: |-
      Burgemeester en wethouders ontlenen aan de gemeentelijke basisadministratie persoonsgegevens de gegevens die nodig
      zijn voor de vaststelling van de kiesgerechtigdheid van de personen die als ingezetene hierin zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelD_1
  - number: D 1a
    text: |-
      1 Ten aanzien van personen die werkelijke woonplaats in de gemeente hebben, niet zijnde personen als bedoeld in
      [artikel D 1][ref1], en die als kiesgerechtigd in de gemeentelijke administratie worden opgenomen, registreren
      burgemeester en wethouders de volgende gegevens:

      a. de geslachtsnaam;

      b. de voornamen of voorletters;

      c. de geboortedatum

      d. het adres;

      e. de nationaliteit.

      2 Burgemeester en wethouders schrappen de registratie van de kiesgerechtigdheid van de in het eerste lid bedoelde
      personen indien aan hen omstandigheden bekend worden op grond waarvan de desbetreffende persoon niet als kiezer
      behoort te zijn geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004632#ArtikelD_1
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelD_1a
    references:
      - id: ref1
        bwb_id: BWBR0004632
        artikel: D_1
        hoofdstuk: D
        afdeling: II
  - number: D 2
    text: |-
      1 De formulieren voor het verzoek tot registratie van de kiesgerechtigdheid, in te dienen overeenkomstig [artikel
      D3, derde, vierde of zesde lid, van de Kieswet](onbekend), zijn verkrijgbaar bij het orgaan waarbij het verzoek
      moet worden ingediend, en ter secretarie van elke gemeente.

      2 De formulieren voor het verzoek tot registratie van de kiesgerechtigdheid, in te dienen overeenkomstig
      [artikel D 3, vijfde lid, van de Kieswet][ref1], zijn verkrijgbaar bij het ministerie waaronder de werkzaamheden
      van de betrokken functionaris ressorteren.

      3 De formulieren, bedoeld in het eerste en tweede lid, zijn verkrijgbaar gedurende de termijn waarbinnen het
      desbetreffende verzoek kan worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelD_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: D_3
  - number: D 3
    text: |-
      1 Het orgaan waarbij overeenkomstig [artikel D 3, derde, vierde of vijfde lid, van de Kieswet][ref1] een verzoek
      tot registratie van de Kiesgerechtigdheid is ingediend, gaat na of aan dat orgaan met betrekking tot de verzoeker
      gegevens bekend zijn en, zo dit het geval is, of deze overeenstemmen met de in het verzoek vermelde gegevens.
      Het orgaan zendt het verzoekschrift vervolgens onder mededeling van zijn bevindingen door aan burgemeester en
      wethouders van 's-Gravenhage. Het orgaan houdt van deze verzending aantekening.

      2 Burgemeester en wethouders van 's-Gravenhage gaan na of er met betrekking tot de verzoeker
      die zich vóór 1 oktober 1994, dan wel op of na 1 oktober 1994 buiten Nederland heeft gevestigd,
      gegevens bekend zijn in het persoonskaartenarchief of het schakelregister, bedoeld in
      [artikel 139 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref2], onderscheidenlijk in de
      gemeentelijke basisadministratie persoonsgegevens van de gemeente waarin de kiezer is ingeschreven, en, zo dit het
      geval is, of deze overeenstemmen met de in het verzoek tot registratie vermelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel139
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelD_3
    references:
      - id: ref1
