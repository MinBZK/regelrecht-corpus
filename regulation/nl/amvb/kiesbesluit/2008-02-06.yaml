  - number: I 1
    text: |-
      1 De processen-verbaal van de in de [artikelen I 1][ref1] en [I 4 van de Kieswet][ref2] bedoelde zittingen worden
      tot en met de dag waarop de kandidatenlijsten openbaar worden gemaakt, ter inzage gelegd ter secretarie van de
      gemeente waar het hoofdstembureau is gevestigd.

      2 Het proces-verbaal van de in [artikel I 12 van de Kieswet][ref3] bedoelde zitting wordt tot en met de dag
      waarop de kandidatenlijsten openbaar worden gemaakt, ter inzage gelegd op het ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties, indien het de verkiezing van de leden van de Tweede Kamer betreft, en ter secretarie van de
      gemeente waar het centraal stembureau is gevestigd, indien het de verkiezing van de leden van provinciale staten of
      de gemeenteraad betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_12
