        artikel: N_11
        hoofdstuk: N
        paragraaf: '2'
        afdeling: II
  - number: N 13
    text: |-
      1 Bij de hervatting van de stemopneming overeenkomstig [hoofdstuk N van de Kieswet][ref1] vindt
      de vaststelling, bedoeld in [artikel N 15 van de Kieswet][ref2], mede plaats aan de hand van de
      processen-verbaal van de extra zittingen van de briefstembureaus en vindt de vaststelling, bedoeld in
      [artikel N 6 van de Kieswet][ref3], mede plaats aan de hand van het proces-verbaal van de stemopneming, bedoeld in
      [artikel N 16a, eerste lid, van de Kieswet][ref4].

      2 Van de hervatting van de stemopneming wordt proces-verbaal opgemaakt.

      3 Bij ministeriële regeling wordt voor het proces-verbaal van de hervatting van de stemopneming een model
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukN
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_15
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_6
      [ref4]: https://wetten.overheid.nl/BWBR0004627#HoofdstukN
