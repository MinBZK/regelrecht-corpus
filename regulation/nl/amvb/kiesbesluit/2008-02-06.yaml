        bwb_id: BWBR0004627
        artikel: N_9
      - id: ref2
        bwb_id: BWBR0004627
        artikel: N_10
  - number: N 11
    text: |-
      Onmiddellijk na de ondertekening van het proces-verbaal, wordt dit tezamen met de verzegelde pakken met
      stembiljetten door de voorzitter van het stembureau of een door hem aan te wijzen ander lid bij de burgemeester of
      een door deze aan te wijzen ambtenaar in bewaring gegeven.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelN_11
  - number: N 12
    text: |-
      Zodra de handelingen, bedoeld in de [artikelen M 10][ref1] en [M 11 van de Kieswet][ref2], ten aanzien
      van alle tijdig binnengekomen retourenveloppen zijn beëindigd, stelt de burgemeester de hem ingevolge
      [artikel M 6][ref3] overhandigde verzegelde pakken en processen-verbaal van de extra zittingen en het hem ingevolge
      [artikel N 11][ref4] overhandigde proces-verbaal van de stemopneming en de verzegelde pakken met stembiljetten ter
      beschikking van het stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_10
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_11
      [ref3]: https://wetten.overheid.nl/BWBR0004632#ArtikelM_6
      [ref4]: https://wetten.overheid.nl/BWBR0004632#ArtikelN_11
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelN_12
