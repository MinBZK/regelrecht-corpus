  - number: J 1
    text: |-
      1 De kandidatenlijsten worden ter kennis van de kiezers gebracht door deze uiterlijk op de vierde dag voor de
      stemming in afdruk aan het adres van de kiezers te bezorgen.

      2 Op de lijsten, zoals deze ter kennis van de kiezers worden gebracht, worden vermeld de nummers van de lijsten
      en, in voorkomend geval, de aanduidingen van de politieke groeperingen en de nummers van de lijsten waarmee
      die lijsten tot een lijstencombinatie zijn verbonden en worden de kandidaten kolomsgewijs vermeld zoals ze op
      de kandidatenlijst voorkomen, met weglating van het adres en de geboortedatum. De lijsten worden gedrukt in de
      volgorde van de toegekende nummers. De kandidaten worden per lijst doorlopend genummerd.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_1
  - number: J 2
    text: |-
      De opgave, bedoeld in [artikel J 17, eerste lid, van de Kieswet][ref1], bevat van elke kiezer de naam, de voornamen
      of voorletters, de geboortedatum en het adres.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_17
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_17
  - number: J 3
    text: |-
      De stembus moet aan de volgende vereisten voldoen:

      a. De bus kan worden afgesloten met een deksel dat voorzien is van een slot.

      b. Het deksel is in het midden voorzien van een sleuf waardoor de stembiljetten in de bus kunnen worden gestoken.

      c. De sleuf kan op zodanige wijze worden afgesloten dat deze daarna slechts kan worden geopend, nadat het deksel
      is losgemaakt.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_3
  - number: J 4
    text: |-
      In elk stemlokaal bevindt zich een zodanig aantal stemhokjes dat een goede voortgang van de stemming is
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_4
  - number: J 5
    text: |-
      1 Het stemhokje bestaat uit een achterwand en twee zijwanden die elk ten minste een meter breed en twee meter
      hoog zijn. Wordt het stemhokje met de achterzijde tegen een ondoorzichtig deel van een wand van het stemlokaal
      geplaatst, dan kan de achterwand vervallen.

      2 In elk stemhokje bevindt zich een lessenaar met rood schrijfmateriaal.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_5
  - number: J 6
    text: |-
      In elk stemlokaal is een voor het publiek bestemde ruimte. De tafel van het stembureau en de stemhokjes bevinden
      zich in de niet voor het publiek bestemde ruimte.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_6
  - number: J 7
    text: |-
      Het onbruikbaar maken van teruggegeven stembiljetten geschiedt door het aanbrengen van het woord "onbruikbaar" op
      de beide zijden van het stembiljet.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_7
  - number: J 8
    text: Nadat de laatste tot de stemming toegelaten kiezer heeft gestemd, wordt de sleuf van de stembus afgesloten.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_8
  - number: J 9
    text: |-
      Indien met toepassing van [artikel J 6 van de Kieswet][ref1] tegelijk met de stemming in het stemlokaal een of meer
      andere stemmingen plaatsvinden, gelden de [artikelen J 10 tot en met J 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_6
      [ref2]: https://wetten.overheid.nl/BWBR0004632#ArtikelJ_9
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_9
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_6
      - id: ref2
        bwb_id: BWBR0004632
        artikel: J_9
        hoofdstuk: J
        paragraaf: '2'
        afdeling: II
  - number: J 10
    text: |-
      1 Voor zover de stemgerechtigden voor de stemming ingevolge de [Kieswet][ref1] en de andere stemming,
      onderscheidenlijk stemmingen, dezelfde zijn, kan de burgemeester besluiten dat tevens voor een of meer andere
      stemmingen gelden:

      a. de oproepingskaart, bedoeld in [artikel J 7 van de Kieswet][ref2];

      b. het afschrift, bedoeld in [artikel J 17, eerste lid, van de Kieswet][ref3];

      c. het verzoekschrift, bedoeld in [artikel K 6 van de Kieswet][ref4];

      d. het verzoekschrift, bedoeld in [artikel L 8 van de Kieswet][ref5];

      e. het volmachtbewijs, bedoeld in [artikel L 14 van de Kieswet][ref6];

      2 Indien de burgemeester een besluit als bedoeld in het eerste lid neemt, gelden de volgende bepalingen:

      a. De tekst van de bescheiden, bedoeld in het eerste lid, wordt aangepast, voor zover dit met het oog op de
      combinatie van de stemmingen noodzakelijk is.

      b. De verzegelde pakken, bedoeld in [artikel N 2 van de Kieswet][ref7], kunnen zo nodig voor de beoordeling van
      de geldigheid van de andere stemming, onderscheidenlijk stemmingen, of van de juistheid van de vaststelling van de
      uitslag van de andere stemming, onderscheidenlijk stemmingen, worden geopend. Na gebruik worden de pakken opnieuw
      verzegeld.

      c. De kiezers zijn bevoegd bij de handelingen, bedoeld onder *b* , aanwezig te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_7
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_17
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_6
      [ref5]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_8
      [ref6]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_14
      [ref7]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_10
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
        artikel: J_7
      - id: ref3
