  - number: H 2
    text: |-
      1 Een kandidaat wordt op de kandidatenlijst vermeld met naam, voorletters, geboortedatum, adres en woonplaats.
      Achter de voorletters kan tussen haakjes de roepnaam van de kandidaat worden vermeld.

      2 Nadere aanduidingen van de naam, mits op de gebruikelijke wijze afgekort, mogen aan de naam worden toegevoegd.

      3 Een persoon die gehuwd is of gehuwd is geweest, dan wel wiens partnerschap geregistreerd is of geregistreerd
      is geweest, wordt op de lijst vermeld hetzij met de eigen geslachtsnaam, hetzij, voor zover hij daartoe op
      grond van artikel 9 van Boek 1 van het Burgerlijk Wetboek bevoegd is, met de geslachtsnaam van de echtgenoot of
      geregistreerde partner, dan wel met de eigen geslachtsnaam door middel van een liggend streepje gevolgd door of
      voorafgegaan door de geslachtsnaam van de echtgenoot of geregistreerde partner.

      4 Achter de voorletters of, indien vermeld, de roepnaam, mag ter aanduiding van het geslacht van de kandidaat de
      toevoeging «(m)» of «(v)» worden geplaatst.

      5 Indien het betreft de verkiezing van de leden van provinciale staten van Fryslân of van de raden van gemeenten in
      de provincie Fryslân, mogen aanduidingen op de kandidatenlijst in de Friese taal worden vermeld.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelH_2
  - number: H 3
    text: |-
      1 De waarborgsommen, bedoeld in de [artikelen H 12][ref1], [H 13][ref2] en [H 14 van de Kieswet][ref3], dienen
      uiterlijk op de veertiende dag voor de kandidaatstelling te zijn ontvangen op de daartoe bestemde rekening van
      onderscheidenlijk Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, de gemeente waar het centraal
      stembureau voor de verkiezingen van de leden van provinciale staten is gevestigd of de gemeente, bij een een
      financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref4] in Nederland het bedrijf van
      kredietinstelling mag uitoefenen, onder vermelding van de woorden "waarborgsom kandidaatstelling".

      2 De voorzitter van het centraal stembureau deelt het orgaan waaraan de waarborgsommen zijn betaald, zo
      spoedig mogelijk na de openbaarmaking van de uitslag van de verkiezing mee welke waarborgsommen ingevolge
      het [vierde of vijfde lid van artikel H 12][ref5], [H 13][ref6] of [H 14 van de Kieswet][ref7] moeten worden
      terugbetaald. Dit orgaan gaat vervolgens zo spoedig mogelijk over tot terugbetaling van die waarborgsommen. Over de
      terug te geven waarborgsommen wordt geen rente vergoed.


