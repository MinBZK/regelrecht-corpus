  - number: P 1
    text: |-
      De bekendmaking, bedoeld in [artikel P 20, tweede lid, van de Kieswet][ref1], geschiedt, indien het betreft de
      verkiezing van de leden van de Tweede Kamer, in de *Nederlandse Staatscourant* en, indien het betreft de verkiezing
      van de leden van provinciale staten of de gemeenteraad, op de in de provincie, onderscheidenlijk de gemeente,
      gebruikelijke wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_20
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelP_1
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_20
  - number: P 2
    text: |-
      Indien het centraal stembureau ingevolge het bepaalde in [artikel P 21, tweede lid, van de Kieswet][ref1]
      verzegelde pakken heeft geopend, worden deze pakken na gebruik wederom verzegeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_21
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelP_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_21
  - number: R 1
    text: |-
      De formulieren voor de kandidatenlijsten, bedoeld in [artikel R 1, tweede lid, van de Kieswet][ref1], en voor de
      verklaringen, bedoeld in de [artikelen R 7, derde lid, en R 8, vierde lid, van de Kieswet][ref2], zijn gedurende
      drie weken vóór en op de dag van de kandidaatstelling verkrijgbaar ter provinciale griffie.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_7
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelR_1
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: R_1
      - id: ref2
        bwb_id: BWBR0004627
        artikel: R_7
  - number: R 2
    text: |-
      1 Een kandidaat wordt op de kandidatenlijst vermeld met naam, voorletters, geboortedatum, adres en woonplaats.
      Achter de voorletters kan tussen haakjes de roepnaam van de kandidaat worden vermeld.

      2 Nadere aanduidingen van de naam, mits op de gebruikelijke wijze afgekort, mogen aan de naam worden toegevoegd.

      3 Een persoon die gehuwd is of gehuwd is geweest, dan wel wiens partnerschap geregistreerd is of geregistreerd
      is geweest, wordt op de lijst vermeld hetzij met de eigen geslachtsnaam, hetzij, voor zover hij daartoe op
      grond van artikel 9 van Boek 1 van het Burgerlijk Wetboek bevoegd is, met de geslachtsnaam van de echtgenoot of
      geregistreerde partner, dan wel met de eigen geslachtsnaam door middel van een liggend streepje gevolgd door of
      voorafgegaan door de geslachtsnaam van de echtgenoot of geregistreerde partner.

      Achter de voorletters of, indien vermeld, de roepnaam, mag ter aanduiding van het geslacht van de kandidaat de
      toevoeging «(m)» of «(v)» worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelR_2
  - number: Y 1
    text: |-
      Ten aanzien van de verkiezing van de leden van het Europese Parlement zijn, voor zover deze afdeling niet anders
      bepaalt, de bij [afdeling II][ref1] van dit besluit gestelde bepalingen inzake de verkiezing van de leden van de
      Tweede Kamer van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004632#AfdelingII
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelY_1
    references:
      - id: ref1
        bwb_id: BWBR0004632
        afdeling: II
  - number: Y 1a
    text: |-
      De formulieren voor het verzoek, bedoeld in [artikel Y 32, eerste lid, van de Kieswet](onbekend), zijn ten minste 6
      weken voor de dag en op de dag van kandidaatstelling verkrijgbaar ter secretarie van elke gemeente.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelY_1a
  - number: Y 2
    text: |-
      De formulieren voor de kandidatenlijsten en de verklaringen, bedoeld in [artikel H 1][ref1], zijn gedurende drie
      weken vóór en op de dag van de kandidaatstelling mede verkrijgbaar bij het centraal stembureau voor de verkiezing
      van de leden van het Europese Parlement.


      [ref1]: https://wetten.overheid.nl/BWBR0004632#ArtikelH_1
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelY_2
    references:
      - id: ref1
        bwb_id: BWBR0004632
        artikel: H_1
        hoofdstuk: H
        afdeling: II
  - number: Y 3
    text: |-
      1 De formulieren voor de schriftelijke verklaring, bedoeld in [artikel Y 13, eerste lid, van de Kieswet][ref1],
      zijn gedurende drie weken vóór en op de dag van de kandidaatstelling verkrijgbaar bij het centraal stembureau voor
      de verkiezing van de leden van het Europese Parlement.

      2 Indien de kandidaat zich buiten Nederland bevindt, is de verklaring niet aan enig formulier gebonden en kan zij
      ook telegrafisch of per telex geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_13
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelY_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_13
  - number: Y 4
    text: |-
      Het tijdstip en de plaats van de zitting, bedoeld in [artikel I 4 van de Kieswet][ref1], worden tijdig door
      de voorzitter van het centraal stembureau voor de verkiezing van de leden van het Europese Parlement in de
      *Nederlandse Staatscourant* bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelY_4
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: I_4
  - number: Y 5
    text: |-
      De formulieren voor de verklaring, bedoeld in [artikel Y 19, eerste lid, van de Kieswet][ref1], zijn gedurende drie
      weken vóór en op de dag van de kandidaatstelling mede verkrijgbaar bij het centraal stembureau voor de verkiezing
      van de leden van het Europese Parlement.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_19
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelY_5
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_19
  - number: Y 7
    text: |-
      Bij regeling van Onze Minister voor Bestuurlijke Vernieuwing en Koninkrijksrelaties kunnen
      nadere regels worden gesteld omtrent de wijze en het tijdstip waarop de mededeling, bedoeld in
      [artikel Y 32, achtste lid, van de Kieswet][ref1], dient te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_32
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelY_7
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_32
  - number: Z 1
    text: Het Kiesbesluit (*Stb.* 1951, 441) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelZ_1
  - number: Z 2
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelZ_2
  - number: Z 3
    text: Dit besluit kan worden aangehaald als Kiesbesluit.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelZ_3
