  - number: D 6
    text: |-
      Het in [artikel D 3a, eerste lid, van de Kieswet][ref1] bedoelde bestand bevat met betrekking tot elke persoon
      die hierin is opgenomen de naam, de voorletters, het woonadres, de geboortedatum en, indien van toepassing, het
      correspondentie-adres, zoals verstrekt door de verzoeker, alsmede de datum van opname in het bestand en, indien van
      toepassing, de datum van het laatste registratieverzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3a
