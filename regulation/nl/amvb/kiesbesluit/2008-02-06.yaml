        artikel: N_2
  - number: J 11
    text: |-
      De leden van het stembureau kunnen ook werkzaamheden voor de andere stemming, onderscheidenlijk stemmingen,
      verrichten, mits deze werkzaamheden de voortgang van de stemming ingevolge de [Kieswet][ref1] niet belemmeren.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_11
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: J 12
    text: |-
      1 In het stemlokaal worden, voor zover nodig, stembussen bijgeplaatst.

      2 De stembiljetten voor de andere stemming, onderscheidenlijk stemmingen, hebben een zodanige kleur dat zij
      voldoende kunnen worden onderscheiden van de stembiljetten voor de stemming ingevolge de [Kieswet][ref1].

      3 Indien in een stemlokaal stembussen zijn bijgeplaatst, worden de stembussen onmiddellijk na elkaar geopend.

      4 Na het openen van de stembus of stembussen worden de stembiljetten voor de stemming ingevolge de [Kieswet][ref2]
      gescheiden van de stembiljetten voor de andere stemming, onderscheidenlijk stemmingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_12
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
  - number: J 26
    text: |-
      1 Schorsing van de zitting van het stembureau wordt bekendgemaakt door aan de deur van het stemlokaal een
      kennisgeving te bevestigen dat de zitting is geschorst. Zo spoedig mogelijk wordt op dezelfde wijze bekendgemaakt
      waar en wanneer de zitting wordt hervat.

      2 Van de schorsing van de zitting van het stembureau doet de burgemeester, tenzij het de verkiezing betreft van de
      leden van de gemeenteraad, onverwijld mededeling aan de voorzitter van het hoofdstembureau.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_26
  - number: J 27
    text: |-
      1 Indien de stemming is geschorst, wordt de sleuf van de stembus onmiddellijk in tegenwoordigheid van de in het
      stemlokaal aanwezige kiezers afgesloten.

      2 Vervolgens wordt de stembus verzegeld en wordt de sleutel waarmee de stembus is afgesloten, in een te verzegelen
      enveloppe gedaan.

      3 Daarna worden in afzonderlijke, te verzegelen, pakken gedaan:

      a. de niet gebruikte stembiljetten;

      b. de teruggegeven en onbruikbaar gemaakte stembiljetten;

      c. de ingeleverde oproepingskaarten;

      d. het afschrift, bedoeld in [artikel J 17 van de Kieswet][ref1], dan wel de verzoekschriften, bedoeld in
      [artikel M 4, vierde lid, van de Kieswet][ref2];

      e. de ingeleverde kiezerspassen, volmachtbewijzen en briefstembewijzen;

      f. de ingevolge [artikel M 11 van de Kieswet][ref3] terzijde gelegde retourenveloppen;

      g. de nog niet geopende retourenveloppen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_17
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_4
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_11
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_27
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_17
      - id: ref2
        bwb_id: BWBR0004627
        artikel: M_4
      - id: ref3
        bwb_id: BWBR0004627
        artikel: M_11
  - number: J 28
    text: |-
      Indien de stemopneming is geschorst voordat de stembus zou worden geopend, is
      [artikel J 27, tweede lid en derde lid, aanhef en onder a tot en met f][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004632#ArtikelJ_27
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_28
    references:
      - id: ref1
        bwb_id: BWBR0004632
        artikel: J_27
        hoofdstuk: J
        paragraaf: '4'
        afdeling: II
  - number: J 29
    text: |-
      Indien de stemopneming is geschorst nadat de stembus is geopend, worden alle stembiljetten die zich in de stembus
      bevonden, daarin teruggedaan, waarna de stembus wordt gesloten en verzegeld. De sleutel waarmee de stembus is
      afgesloten, wordt in een te verzegelen enveloppe gedaan.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_29
  - number: J 30
    text: |-
      Van de geschorste zitting wordt proces-verbaal opgemaakt. Bij ministeriële regeling wordt voor het proces-verbaal
      een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_30
  - number: J 31
    text: |-
      Onmiddellijk na de ondertekening van het proces-verbaal wordt dit met de stembus, de verzegelde pakken en de
      verzegelde enveloppe door de voorzitter bij de burgemeester in bewaring gegeven.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_31
  - number: J 32
    text: |-
      De burgemeester stelt tijdig voor de aanvang van de hervatte zitting de hem ingevolge [artikel J 31][ref1]
      overgegeven stembus, verzegelde pakken en verzegelde enveloppe ter beschikking van het stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004632#ArtikelJ_31
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_32
    references:
      - id: ref1
        bwb_id: BWBR0004632
        artikel: J_31
        hoofdstuk: J
        paragraaf: '4'
        afdeling: II
  - number: J 33
    text: |-
      1 In geval van een schorsing als bedoeld in [artikel J 27][ref1] opent het stembureau tijdig voor de aanvang van de
      hervatte stemming de verzegelde pakken en de verzegelde enveloppe en stelt het het aantal biljetten opnieuw vast.
      Voor deze stemming wordt een andere stembus gebezigd.

      2 De hervatte stemming duurt tot eenentwintig uur.

      3 Daarna vindt het bepaalde in [artikel J 30 van de Kieswet][ref2] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004632#ArtikelJ_27
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_30
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_33
    references:
      - id: ref1
        bwb_id: BWBR0004632
        artikel: J_27
        hoofdstuk: J
        paragraaf: '4'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: J_30
  - number: J 34
    text: |-
      In geval van een schorsing als bedoeld in [artikel J 28][ref1] opent het stembureau na de aanvang van de hervatte
      zitting de verzegelde pakken en verzegelde enveloppe en begint het opnieuw met de stemopneming.


      [ref1]: https://wetten.overheid.nl/BWBR0004632#ArtikelJ_28
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_34
    references:
      - id: ref1
        bwb_id: BWBR0004632
        artikel: J_28
        hoofdstuk: J
        paragraaf: '4'
        afdeling: II
  - number: J 35
    text: |-
      In geval van een schorsing als bedoeld in [artikel J 29][ref1] opent het stembureau na de aanvang van de hervatte
      zitting de verzegelde enveloppe en de stembus en zet het de stemopneming voort.


      [ref1]: https://wetten.overheid.nl/BWBR0004632#ArtikelJ_29
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_35
    references:
      - id: ref1
        bwb_id: BWBR0004632
        artikel: J_29
        hoofdstuk: J
        paragraaf: '4'
        afdeling: II
  - number: J 36
    text: |-
      1 Indien, ter uitvoering van een verdrag of een internationale afspraak, waarnemers bij een verkiezing dienen
      te worden toegelaten of Onze Minister van Buitenlandse Zaken tot zodanige toelating heeft besloten, brengt
      Onze Minister van Buitenlandse Zaken deze verkiezing tijdig onder de aandacht van de bij het verdrag of de
      internationale afspraak betrokken staten dan wel internationale organisaties, onder vermelding van de mogelijkheid
      om personen bij de verkiezing als waarnemer op te laten treden.

      2 Een aankondiging als bedoeld in het eerste lid bevat ten minste de volgende informatie:

      a. de termijn, bedoeld in [artikel J 37, eerste lid][ref1], voor het aanmelden van personen, en de verdere
      procedure die gevolgd moet worden om personen in aanmerking te laten komen als waarnemer;

      b. de bij de aanmelding te vermelden gegevens, genoemd in [artikel J 37, tweede lid][ref2];

      c. de verplichting, bedoeld in [artikel J 37, derde lid][ref3], tot overlegging van een afschrift van een geldig
      paspoort.


      [ref1]: https://wetten.overheid.nl/BWBR0004632#ArtikelJ_37
      [ref2]: https://wetten.overheid.nl/BWBR0004632#ArtikelJ_37
      [ref3]: https://wetten.overheid.nl/BWBR0004632#ArtikelJ_37
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_36
    references:
      - id: ref1
        bwb_id: BWBR0004632
        artikel: J_37
        hoofdstuk: J
        paragraaf: '5'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004632
        artikel: J_37
        hoofdstuk: J
        paragraaf: '5'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0004632
        artikel: J_37
        hoofdstuk: J
        paragraaf: '5'
        afdeling: II
  - number: J 37
    text: |-
      1 Een aanmelding van een andere staat of een internationale organisatie om personen als waarnemer bij de
      verkiezingen in Nederland op te laten treden, dient ten minste zes weken voor de desbetreffende verkiezingen
      ontvangen te zijn door Onze Minister van Buitenlandse Zaken.

      2 De aanmelding bevat ten aanzien van iedere voorgedragen persoon ten minste de naam, de voorletters, het adres, de
      leeftijd, alsmede een nadere omschrijving van zijn functie.

      3 Bij de aanmelding wordt ten aanzien van iedere voorgedragen persoon een afschrift van een geldig paspoort
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_37
  - number: J 38
    text: |-
      1 Onze Minister van Buitenlandse Zaken bepaalt na overleg met de desbetreffende staat of internationale organisatie
      welke voorgedragen persoon als waarnemer wordt toegelaten en deelt dit zo spoedig mogelijk aan de desbetreffende
      staat of organisatie mee.

      2 Onze Minister van Buitenlandse Zaken kan voorwaarden verbinden aan de toelating.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_38
  - number: J 39
    text: |-
      Tijdens de uitoefening van zijn functie neemt de waarnemer strikte neutraliteit in acht, geeft geen blijk van
      zijn politieke gezindheid, mengt zich niet in de verkiezingsprocedure en houdt zich aan de Nederlandse wet- en
      regelgeving.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_39
  - number: J 40
    text: |-
      Onze Minister van Buitenlandse Zaken verstrekt de waarnemer een speciaal legitimatiebewijs van internationale
      waarnemer. Tijdens de uitoefening van zijn functie draagt de waarnemer dit bewijs voor een ieder zichtbaar op zijn
      kleding.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_40
  - number: J 41
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de aanmeldingsprocedure voor waarneming, het
      maximum aantal waarnemers en de duur van de waarneming en omtrent de rechten en verplichtingen van waarnemers.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelJ_41
  - number: M 1
    text: |-
      De stukken, bedoeld in [artikel M 6, eerste lid, van de Kieswet][ref1], worden aan de kiezer gezonden per
      luchtpost, tenzij het adres waarheen zij gezonden moeten worden, in België is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_6
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelM_1
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: M_6
  - number: M 2
    text: |-
      Indien burgemeester en wethouders van 's-Gravenhage gebruik hebben gemaakt van hun bevoegdheid, bedoeld in
      [artikel M 9, tweede lid, van de Kieswet][ref1], gelden ten aanzien van de extra zittingen van de briefstembureaus
      voorafgaande aan de dag van de stemming de [artikelen M 3 tot en met M 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_9
      [ref2]: https://wetten.overheid.nl/BWBR0004632#ArtikelM_3
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelM_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: M_9
      - id: ref2
        bwb_id: BWBR0004632
        artikel: M_3
        hoofdstuk: M
        afdeling: II
  - number: M 3
    text: |-
      Ten minste twee weken vóór de eerste zitting brengen burgemeester en wethouders van 's-Gravenhage ter openbare
      kennis in de Staatscourant op welke dag of dagen en gedurende welke tijden de briefstembureaus extra zitting
      houden, alsmede op welke plaats.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelM_3
  - number: M 4
    text: |-
      1 Aan het eind van elke zitting wordt de sleuf van de stembus onmiddellijk in tegenwoordigheid van de in het
      stemlokaal aanwezige kiezers afgesloten, waarna de stembus verzegeld wordt en de sleutel waarmee de stembus is
      afgesloten, in een te verzegelen enveloppe wordt gedaan.

      2 Vervolgens stelt het stembureau vast:

      a. het aantal door het briefstembureau op de zitting verwerkte retourenveloppen;

      b. het aantal ingevolge [artikel M 11 van de Kieswet][ref1] terzijde gelegde retourenveloppen.

      3 De aantallen, bedoeld in het tweede lid, worden door de voorzitter aan de aanwezige kiezers bekend gemaakt.

      4 Daarna worden in afzonderlijke, te verzegelen, pakken gedaan:

      a. de verzoekschriften, bedoeld in [artikel M 4, vierde lid, van de Kieswet][ref2], waarvan de handtekening is
      vergeleken met die op het briefstembewijs, tezamen met een gewaarmerkte verklaring van het stembureau betreffende
      het aantal gestelde parafen;

      b. de ingeleverde briefstembewijzen;

      c. de ingevolge [artikel M 11 van de Kieswet][ref3] terzijde gelegde retourenveloppen;


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_11
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_4
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_11
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelM_4
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: M_11
      - id: ref2
        bwb_id: BWBR0004627
        artikel: M_4
      - id: ref3
        bwb_id: BWBR0004627
        artikel: M_11
  - number: M 5
    text: |-
      1 Van elke zitting wordt proces-verbaal opgemaakt.

      2 [Artikel N 10, eerste lid, laatste volzin, tweede en derde lid, van de Kieswet][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_10
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelM_5
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_10
  - number: M 6
    text: |-
      1 Onmiddellijk na de ondertekening van het proces-verbaal, wordt dit tezamen met de stembus, de verzegelde pakken,
      de verzegelde enveloppe en de verzoekschriften waarvan de handtekening nog niet vergeleken is, door de voorzitter
      van het stembureau of een door hem aan te wijzen ander lid bij de burgemeester van 's-Gravenhage of een door deze
      aan te wijzen ambtenaar in bewaring gegeven.

      2 De burgemeester van 's-Gravenhage of een door deze aan te wijzen ambtenaar stelt tijdig voor de aanvang van elke
      volgende extra zitting de aan hem ingevolge het eerste lid overgedragen verzoekschriften waarvan de handtekening
      nog niet vergeleken is, ter beschikking aan de voorzitter van het briefstembureau.

      3 Voor elke extra zitting wordt een andere stembus gebruikt.
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelM_6
  - number: M 7
    text: |-
      1 De burgemeester van 's-Gravenhage of een door deze aan te wijzen ambtenaar stelt tijdig voor de aanvang
      van de stemopneming bedoeld in [artikel N 16a, eerste lid, van de Kieswet][ref1] de aan hem ingevolge
      [artikel M 6, eerste lid][ref2], overgedragen stembussen, verzegelde enveloppen en verzoekschriften waarvan de
      handtekening nog niet vergeleken is, ter beschikking aan de voorzitter van het briefstembureau.

      2 Tijdig voor de aanvang van de stemopneming opent het stembureau de verzegelde enveloppen, waarna het vervolgens
      de stembussen opent.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_16a
      [ref2]: https://wetten.overheid.nl/BWBR0004632#ArtikelM_6
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelM_7
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_16a
      - id: ref2
        bwb_id: BWBR0004632
        artikel: M_6
        hoofdstuk: M
        afdeling: II
  - number: N 9
    text: |-
      Indien met toepassing van [artikel N 16a van de Kieswet][ref1] de briefstembureaus te 's-Gravenhage op de
      dag van stemming aanvangen met de stemopneming, gelden ten aanzien van de schorsing en hervatting hiervan
      de[ artikelen N 10 tot en met N 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_16a
      [ref2]: https://wetten.overheid.nl/BWBR0004632#ArtikelN_10
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelN_9
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_16a
      - id: ref2
        bwb_id: BWBR0004632
        artikel: N_10
        hoofdstuk: N
        paragraaf: '2'
        afdeling: II
  - number: N 10
    text: |-
      1 Nadat de stemmen zijn opgenomen en aan [artikel N 9, tweede lid, van de Kieswet][ref1] toepassing is gegeven,
      schorst de voorzitter van het briefstembureau de stemopneming. Van de geschorste stemopneming wordt proces-verbaal
      opgemaakt.

      2 [ Artikel N 10, eerste lid, laatste volzin, tweede en derde lid van de Kieswet][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_10
    url: https://wetten.overheid.nl/BWBR0004632/2008-02-06#ArtikelN_10
    references:
