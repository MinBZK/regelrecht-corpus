        artikel: J_14
        hoofdstuk: J
        paragraaf: '3'
        afdeling: II
  - number: Ya 5a
    text: |-
      1 Voor zover bij gecombineerde stemmingen voor de verkiezing van de leden van de eilandsraden en de leden van de
      kiescolleges, het centraal stembureau voor één verkiezing tot een nieuwe stemopneming besluit, doet het daarvan
      verslag aan het vertegenwoordigend orgaan van de andere verkiezing.

      2 Voor zover bij de gecombineerde stemmingen het vertegenwoordigend orgaan van de ene verkiezing tot een nieuwe
      stemopneming besluit, geschiedt deze mede in aanwezigheid van het vertegenwoordigend orgaan van de andere
      verkiezing.
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelYa_5a
  - number: Ya 5b
    text: |-
      De formulieren voor de kandidatenlijsten, bedoeld in[ artikel R 1, derde lid, van de Kieswet][ref1],
      en voor de verklaringen, bedoeld in de [artikelen R 2, eerste lid][ref2], [R 7, vierde lid][ref3], en
      [R 8, vierde lid, van die wet][ref4], zijn gedurende drie weken vóór en op de dag van de kandidaatstelling
      verkrijgbaar op het bestuurskantoor in Bonaire, Sint Eustatius en Saba. De voorzitter van het centraal stembureau
      draagt er zorg voor dat de formulieren daartoe langs elektronische weg worden verzonden naar de gezaghebbers.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_1
