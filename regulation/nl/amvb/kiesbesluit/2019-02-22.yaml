        bwb_id: BWBR0004627
        artikel: N_10
  - number: M 11
    text: |-
      1 Onmiddellijk na de ondertekening van het proces-verbaal, wordt dit tezamen met de stembus, de verzegelde pakken,
      de verzegelde enveloppe en de verzoekschriften waarvan de handtekening nog niet vergeleken is, door de voorzitter
      van het stembureau bij de burgemeester van 's-Gravenhage in bewaring gegeven.

      2 De burgemeester van 's-Gravenhage stelt tijdig voor de aanvang van elke volgende extra zitting de aan hem
      ingevolge het eerste lid overgedragen verzoekschriften waarvan de handtekening nog niet vergeleken is, ter
      beschikking aan de voorzitter van het briefstembureau.

      3 Voor elke extra zitting wordt een andere stembus gebruikt.
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelM_11
  - number: M 12
    text: |-
      1 De burgemeester van 's-Gravenhage stelt tijdig voor de aanvang van de stemopneming bedoeld in
      [artikel N 16a, eerste lid, van de Kieswet][ref1] de aan hem overgedragen stembussen, verzegelde enveloppen
      en verzoekschriften waarvan de handtekening nog niet vergeleken is, ter beschikking aan de voorzitter van het
      briefstembureau.

      2 Tijdig voor de aanvang van de stemopneming opent het stembureau de verzegelde enveloppen, waarna het vervolgens
      de stembussen opent.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_16a
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelM_12
    references:
