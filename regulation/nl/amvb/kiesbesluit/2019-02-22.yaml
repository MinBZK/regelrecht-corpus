        bwb_id: BWBR0004627
        artikel: L_9
  - number: M 1
    text: |-
      Een formulier als bedoeld in [artikel M 3 van de Kieswet][ref1] is kosteloos verkrijgbaar bij elke gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_3
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelM_1
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: M_3
  - number: M 2
    text: |-
      Een verzoek als bedoeld in [artikel M 3 van de Kieswet][ref1] bevat een adres buiten Nederland waar de persoon de
      stukken, bedoeld in artikel M 6 van de Kieswet, wenst te ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_3
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelM_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: M_3
  - number: M 3
    text: |-
      1 De vertegenwoordiger van Nederland in Aruba, Curaçao en Sint Maarten zendt de personen die in Aruba, Curaçao of
      Sint Maarten wonen, de stukken, bedoeld in [artikel M 6, eerste lid, van de Kieswet][ref1].

      2 De vertegenwoordiger van Nederland in Aruba, Curaçao en Sint Maarten draagt er zorg voor dat de stembiljetten
      alsmede de formulieren voor de processen-verbaal voor de briefstembureaus in Aruba, Curaçao, respectievelijk Sint
      Maarten tijdig in gereedheid worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_6
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelM_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: M_6
  - number: M 4
    text: |-
      1 De burgemeester van ’s-Gravenhage zet op de retourenveloppe, bedoeld in [artikel M 6 van de Kieswet][ref1], het
      adres van:

      a. het hoofd van de ingevolge [artikel M 13, eerste of tweede lid, van de Kieswet][ref2] aangewezen diplomatieke
      of consulaire vertegenwoordiging dan wel de Nederlandse leiding van de ingevolge artikel M 13, vierde lid, van de
      Kieswet aangewezen militaire missie;

      b. de vertegenwoordiger van Aruba, Curaçao of Sint Maarten, indien een briefstembureau is ingesteld op grond van
      [artikel M 13, derde lid, van de Kieswet][ref3];

      c. de burgemeester van de ingevolge [artikel M 13, vijfde lid, van de Kieswet][ref4] aangewezen gemeente;

      d. de burgemeester van ’s-Gravenhage, in de overige gevallen.

      2 De kiezer kan een andere retourenveloppe dan de retourenveloppe, bedoeld in het eerste lid, retourneren aan het
      hoofd van de diplomatieke of consulaire vertegenwoordiging, de Nederlandse leiding van de militaire missie, de
      vertegenwoordiger van Nederland in Aruba, Curaçao of Sint Maarten, de burgemeester van de aangewezen gemeente of de
      burgemeester van ’s-Gravenhage, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_6
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_13
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_13
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_13
