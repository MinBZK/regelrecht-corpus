  - number: E 1
    text: Het stembureau bestaat uit ten minste drie en ten hoogste zeven leden.
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelE_1
  - number: E 2
    text: |-
      1 Voor het houden van een zitting van het hoofdstembureau is de aanwezigheid van ten minste drie leden vereist.

      2 De leden die verhinderd zijn de zitting bij te wonen, geven hiervan onverwijld kennis aan de voorzitter. Deze
      zorgt voor de oproeping van plaatsvervangende leden.

      3 Bij verhindering van de voorzitter en de plaatsvervangend voorzitter treedt het oudste lid naar benoeming als
      voorzitter op dan wel, indien verscheidene leden even oud naar benoeming zijn, het oudste lid.

      4 Het hoofdstembureau neemt zijn beslissingen bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelE_2
  - number: G 1
    text: |-
      1 De waarborgsommen, bedoeld in het tweede lid van de [artikelen G 1][ref1], [G 2][ref2], [G 2a][ref3] en
      [G 3][ref4], alsmede de waarborgsom, bedoeld in het derde lid van [artikel Q 6][ref5] juncto het tweede lid van
      artikel G 1 van de Kieswet, dienen te worden overgemaakt op de daartoe bestemde rekening van onderscheidenlijk
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, de gemeente waar het centraal stembureau voor de
      verkiezingen van de leden van provinciale staten is gevestigd, het waterschap of de gemeente, bij een financiële
      onderneming die ingevolge de [Wet op het financieel toezicht][ref6] in Nederland het bedrijf van bank mag
      uitoefenen, onder vermelding van de woorden "waarborgsom registratie".

      2 De voorzitter van het centraal stembureau deelt het orgaan waaraan de waarborgsommen zijn betaald, zo
      spoedig mogelijk na de openbaarmaking van de kandidatenlijsten mee welke waarborgsommen ingevolge het tweede
      lid van [artikel G 1][ref7], [G 2][ref8], [G 2a][ref9] of [G 3][ref10], dan wel ingevolge het derde lid van
      [artikel Q 6][ref11] juncto het tweede lid van artikel G 1 van de Kieswet moeten worden terugbetaald. Dit orgaan
      gaat vervolgens zo spoedig mogelijk over tot terugbetaling van die waarborgsommen. Over de terug te betalen
      waarborgsommen wordt geen rente vergoed.


