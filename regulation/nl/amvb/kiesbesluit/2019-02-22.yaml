  - number: M 5
    text: |-
      De stembescheiden, bedoeld in [artikel M 7 van de Kieswet][ref1], bevatten een kopie van een geldig Nederlands
      paspoort, een kopie van een geldige Nederlandse identiteitskaart, een kopie van een geldige identiteitskaart van
      Bonaire, Sint Eustatius of Saba of een kopie van een geldige identiteitskaart van Aruba, Curaçao of Sint Maarten
      waarop de Nederlandse nationaliteit staat vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_7
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelM_5
