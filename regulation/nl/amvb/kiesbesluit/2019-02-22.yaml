        artikel: D_5
  - number: D 9
    text: |-
      Op een aanvraag als bedoeld in [hoofdstuk D van de Kieswet][ref1] alsmede ter uitoefening van het recht op
      rectificatie, bedoeld in artikel 16 van de Algemene verordening gegevensbescherming, ten aanzien van een
      registratie als bedoeld in [artikel D 2 van de Kieswet][ref2] of [artikel D 1][ref3] van het Kiesbesluit, wordt
      uiterlijk op de zevende dag na ontvangst door burgemeester en wethouders of burgemeester en wethouders van ’s-
      Gravenhage beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukD
