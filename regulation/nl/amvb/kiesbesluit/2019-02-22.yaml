        bwb_id: BWBR0004627
        artikel: M_6
  - number: M 7
    text: |-
      Indien burgemeester en wethouders van 's-Gravenhage gebruik hebben gemaakt van hun bevoegdheid, bedoeld in
      [artikel M 9, tweede lid, van de Kieswet][ref1], gelden ten aanzien van de extra zittingen van de briefstembureaus
      voorafgaande aan de dag van de stemming de [artikelen M 8 tot en met M 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_9
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_10
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelM_7
