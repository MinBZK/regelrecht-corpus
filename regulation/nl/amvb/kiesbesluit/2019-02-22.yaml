  - number: Ya 4
    text: |-
      1 Afschriften van de processen-verbaal van de zittingen, bedoeld in [artikel I 1][ref1] worden, indien het betreft
      de verkiezing van de leden van de Tweede Kamer, tevens ter inzage gelegd op het bestuurskantoor in Bonaire, Sint
      Eustatius en Saba. De voorzitter van het centraal stembureau draagt er zorg voor dat de processen-verbaal daartoe
      langs elektronische weg ter kennis worden gebracht van de gezaghebbers van Bonaire, Sint Eustatius en Saba.

      2 Afschriften van de processen-verbaal van de zittingen, bedoeld in [artikel I 1][ref2] in samenhang met
      [artikel Y 1][ref3], worden, indien het betreft de verkiezing van de leden van het Europees Parlement, tevens ter
      inzage gelegd op het bestuurskantoor in Bonaire, Sint Eustatius en Saba. De voorzitter van het centraal stembureau
      draagt er zorg voor dat de processen-verbaal daartoe langs elektronische weg ter kennis worden gebracht van de
      gezaghebbers van Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0004632#ArtikelI_1
      [ref2]: https://wetten.overheid.nl/BWBR0004632#ArtikelI_1
      [ref3]: https://wetten.overheid.nl/BWBR0004632#ArtikelY_1
