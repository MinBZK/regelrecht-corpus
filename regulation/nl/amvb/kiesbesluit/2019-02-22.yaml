  - number: Ya 2
    text: |-
      Indien het betreft de verkiezing van de leden van de eilandsraden of de verkiezing van de leden van de
      kiescolleges, mogen aanduidingen op de kandidatenlijst in het Engels of in het Papiaments worden vermeld.
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelYa_2
  - number: Ya 3
    text: |-
      De waarborgsommen, bedoeld in [artikel Ya 17][ref1], in samenhang met [artikel H 14][ref2], en
      [artikel Ya 28][ref3], in samenhang met de [artikelen Ya 17][ref4] en [H 13, van de Kieswet][ref5], dienen
      uiterlijk op de veertiende dag voor de kandidaatstelling te zijn ontvangen op de daartoe bestemde rekening van
      het openbaar lichaam, bij een financiële onderneming die ingevolge de [Wet financiële markten BES][ref6] in de
      openbare lichamen het bedrijf van kredietinstelling mag uitoefenen, onder vermelding van de woorden «waarborgsom
      kandidaatstelling».


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelYa_17
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_14
