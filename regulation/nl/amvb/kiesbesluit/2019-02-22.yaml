  - number: H 2
    text: |-
      1 Een kandidaat wordt op de kandidatenlijst vermeld met naam, voorletters, geboortedatum en gemeente of woonplaats
      als bedoeld in [artikel 1, onderdeel n, van de Wet basisregistratie adressen en gebouwen][ref1]. Achter de
      voorletters kan tussen haakjes de roepnaam van de kandidaat worden vermeld.

      2 Nadere aanduidingen van de naam, mits op de gebruikelijke wijze afgekort, mogen aan de naam worden toegevoegd.

      3 Een persoon die gehuwd is of gehuwd is geweest, dan wel wiens partnerschap geregistreerd is of geregistreerd is
      geweest, wordt op de lijst vermeld hetzij met de eigen geslachtsnaam, hetzij, voor zover hij daartoe op grond van
      [artikel 9 van Boek 1 van het Burgerlijk Wetboek][ref2] dan wel artikel 9 van Boek 1 van het Burgerlijk Wetboek BES
      bevoegd is, met de geslachtsnaam van de echtgenoot of geregistreerde partner, dan wel met de eigen geslachtsnaam
      door middel van een liggend streepje gevolgd door of voorafgegaan door de geslachtsnaam van de echtgenoot of
      geregistreerde partner.

      4 Achter de voorletters of, indien vermeld, de roepnaam, mag ter aanduiding van het geslacht van de kandidaat de
      toevoeging «(m)» of «(v)» worden geplaatst.

      5 Indien het betreft de verkiezing van de leden van provinciale staten van Fryslân, het algemeen bestuur van het
      Wetterskip Fryslân of van de raden van gemeenten in de provincie Fryslân, mogen aanduidingen op de kandidatenlijst
      in de Friese taal worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel9
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelH_2
