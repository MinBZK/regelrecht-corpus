    text: |-
      Indien met toepassing van [artikel N 16a van de Kieswet][ref1] de briefstembureaus te 's-Gravenhage op de
      dag van stemming aanvangen met de stemopneming, gelden ten aanzien van de schorsing en hervatting hiervan
      de[ artikelen N 10 tot en met N 13][ref2].


