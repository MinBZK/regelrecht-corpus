        artikel: '9'
  - number: Y 1
    text: |-
      Ten aanzien van de verkiezing van de leden van het Europese Parlement zijn, voor zover deze afdeling niet anders
      bepaalt, de bij [afdeling II][ref1] van dit besluit gestelde bepalingen inzake de verkiezing van de leden van de
      Tweede Kamer van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004632#AfdelingII
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelY_1
    references:
      - id: ref1
        bwb_id: BWBR0004632
        afdeling: II
  - number: Y 1a
    text: |-
      De formulieren voor het verzoek, bedoeld in [artikel Y 32, eerste lid, van de Kieswet][ref1], zijn ten minste 6
      weken voor de dag en op de dag van kandidaatstelling verkrijgbaar bij elke gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_32
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelY_1a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_32
  - number: Y 2
    text: |-
      De formulieren voor de kandidatenlijsten en de verklaringen, bedoeld in [artikel H 1][ref1], zijn gedurende drie
      weken vóór en op de dag van de kandidaatstelling mede verkrijgbaar bij het centraal stembureau voor de verkiezing
      van de leden van het Europese Parlement.


      [ref1]: https://wetten.overheid.nl/BWBR0004632#ArtikelH_1
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelY_2
    references:
      - id: ref1
        bwb_id: BWBR0004632
        artikel: H_1
        hoofdstuk: H
        afdeling: II
  - number: Y 3
    text: |-
      1 De formulieren voor de schriftelijke verklaring, bedoeld in [artikel Y 13, eerste lid, van de Kieswet][ref1],
      zijn gedurende drie weken vóór en op de dag van de kandidaatstelling verkrijgbaar bij het centraal stembureau voor
      de verkiezing van de leden van het Europese Parlement.

      2 Indien de kandidaat zich buiten het Europese deel van Nederland bevindt, is de verklaring niet aan enig formulier
      gebonden en kan zij ook elektronisch geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_13
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelY_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_13
  - number: Y 4
    text: |-
      Het tijdstip en de plaats van de zitting, bedoeld in [artikel I 4 van de Kieswet][ref1], worden tijdig door
      de voorzitter van het centraal stembureau voor de verkiezing van de leden van het Europese Parlement in de
      *Nederlandse Staatscourant* bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelY_4
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: I_4
  - number: Y 7
    text: |-
      Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kunnen nadere
      regels worden gesteld omtrent de wijze en het tijdstip waarop de mededeling, bedoeld in
      [artikel Y 32, achtste lid, van de Kieswet][ref1], dient te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_32
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelY_7
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_32
  - number: Ya 1
    text: |-
      De waarborgsommen, bedoeld in [artikel Ya 15][ref1] in samenhang met [artikel G 3, tweede lid][ref2], en
      [artikel Ya 25, tweede lid][ref3], in samenhang met [artikel G 2, tweede lid, van de Kieswet][ref4], dienen te
      worden overgemaakt op de daartoe bestemde rekening van het openbaar lichaam, bij een financiële onderneming die
      ingevolge de [Wet financiële markten BES][ref5] in de openbare lichamen het bedrijf van kredietinstelling mag
      uitoefenen, onder vermelding van de woorden «waarborgsom registratie».


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelYa_15
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_3
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelYa_25
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_2
      [ref5]: https://wetten.overheid.nl/BWBR0030883
