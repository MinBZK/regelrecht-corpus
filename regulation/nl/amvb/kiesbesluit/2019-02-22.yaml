        artikel: D_3
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '4.5'
  - number: D 7
    text: |-
      Indien aan het orgaan waarbij een aanvraag tot registratie als bedoeld in [artikel D 3 van de Kieswet][ref1]
      kan worden ingediend, omstandigheden bekend worden, op grond waarvan een persoon die ingevolge
      [artikel D 2 van de Kieswet][ref2] als kiezer is geregistreerd, niet als kiezer behoort te zijn geregistreerd,
      wordt daarvan terstond mededeling gedaan aan burgemeester en wethouders van ’s-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelD_7
