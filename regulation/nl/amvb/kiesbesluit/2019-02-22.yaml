  - number: I 1
    text: |-
      De processen-verbaal van de in de [artikelen I 1][ref1] en [I 4 van de Kieswet][ref2] bedoelde zittingen
      worden tot en met de dag waarop de kandidatenlijsten openbaar worden gemaakt, ter inzage gelegd bij het centraal
      stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelI_1
