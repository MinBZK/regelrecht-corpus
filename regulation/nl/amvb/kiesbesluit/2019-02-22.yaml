  - number: Z 1
    text: Het Kiesbesluit (*Stb.* 1951, 441) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelZ_1
  - number: Z 1a
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijkrelaties kan voorafgaand aan een verkiezing informatie aan
      gemeenten verstrekken ter nadere invulling van de modellen, bedoeld in de [artikelen D 3, vierde lid][ref1],
      [K 4, vierde lid][ref2], [K 6, eerste lid][ref3], [L 8, vierde lid][ref4], [L 11, tweede lid][ref5],
      [M 3, derde lid][ref6], [M 6, tweede lid][ref7] en [Y 32, vierde lid, van de Kieswet][ref8].


