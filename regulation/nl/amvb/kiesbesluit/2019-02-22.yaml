  - number: D 6
    text: |-
      1 Het orgaan waarbij een aanvraag tot registratie als bedoeld in [artikel D 3 van de Kieswet][ref1] is ingediend,
      gaat na of aan dat orgaan met betrekking tot de aanvrager gegevens bekend zijn en, zo dit het geval is, of deze
      overeenstemmen met de in de aanvraag vermelde gegevens. Bij doorzending van de aanvraag deelt het orgaan zijn
      bevindingen mee en houdt van deze verzending aantekening.

      2 Burgemeester en wethouders van ’s-Gravenhage gaan na of er met betrekking tot de aanvrager
      gegevens bekend zijn in het persoonskaartenarchief of het schakelregister, bedoeld in
      [artikel 4.5 van de Wet basisregistratie personen][ref2], onderscheidenlijk in de basisregistratie personen, en, zo
      dit het geval is, of deze overeenstemmen met de in de aanvraag tot registratie vermelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel4.5
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelD_6
    references:
