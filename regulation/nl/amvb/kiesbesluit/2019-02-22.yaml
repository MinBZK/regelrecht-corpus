  - number: N 11
    text: |-
      Onmiddellijk na de ondertekening van het proces-verbaal, wordt dit tezamen met de verzegelde pakken met
      stembiljetten door de voorzitter van het stembureau bij de burgemeester in bewaring gegeven.
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelN_11
  - number: N 12
    text: |-
      Zodra de handelingen, bedoeld in de [artikelen M 10][ref1] en [M 11 van de Kieswet][ref2], ten aanzien van
      alle tijdig binnengekomen retourenveloppen zijn beëindigd, stelt de burgemeester de hem ingevolge artikel
      M 11 overhandigde verzegelde pakken en processen-verbaal van de extra zittingen en het hem ingevolge
      [artikel N 11][ref3] overhandigde proces-verbaal van de stemopneming en de verzegelde pakken met stembiljetten ter
      beschikking van het stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_10
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_11
      [ref3]: https://wetten.overheid.nl/BWBR0004632#ArtikelN_11
