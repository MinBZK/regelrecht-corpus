  - number: Ya 5
    text: |-
      De [artikelen J 13][ref1] en [J 14][ref2] zijn van overeenkomstige toepassing op de gecombineerde stemmingen voor
      de verkiezing van de leden van de eilandsraden en de leden van de kiescolleges, met dien verstande dat in artikel J
      14, eerste lid, in plaats van «de leden van provinciale staten» wordt gelezen «de leden van de kiescolleges» en in
      plaats van «de leden van de algemene besturen» wordt gelezen «de leden van de eilandsraden».


      [ref1]: https://wetten.overheid.nl/BWBR0004632#ArtikelJ_13
      [ref2]: https://wetten.overheid.nl/BWBR0004632#ArtikelJ_14
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelYa_5
