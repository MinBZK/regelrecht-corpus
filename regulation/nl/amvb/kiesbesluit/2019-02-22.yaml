        bwb_id: BWBR0004627
        artikel: N_16a
  - number: M 13
    text: |-
      De [artikelen M 7 tot en met M 12][ref1] zijn van overeenkomstige toepassing op briefstembureaus als bedoeld in
      [artikel M 13 van de Kieswet][ref2], met dien verstande dat:

      a. aan de burgemeester opgedragen taken worden verricht door het briefstembureau, door de vertegenwoordiger van
      Nederland in Aruba, Curaçao of Sint Maarten dan wel door de burgemeester van de aangewezen gemeente;

      b. de bevoegdheden van burgemeester en wethouders bevoegdheden zijn van Onze Minister van Buitenlandse Zaken, Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties, Onze Minister van Defensie, respectievelijk burgemeester en
      wethouders van de aangewezen gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0004632#ArtikelM_7
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_13
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelM_13
