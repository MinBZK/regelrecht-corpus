  - number: H 1
    text: |-
      De formulieren voor de kandidatenlijsten, bedoeld in [artikel H 1, derde lid, van de Kieswet][ref1],
      en voor de verklaringen, bedoeld in de [artikelen H 3, vijfde lid][ref2], [H 4, zevende lid][ref3], en
      [H 9, vierde lid, van de Kieswet][ref4], zijn gedurende drie weken vóór en op de dag van de kandidaatstelling
      verkrijgbaar bij elke gemeente. De verklaring, bedoeld in artikel H 9, vierde lid, van de Kieswet is tevens
      gedurende drie weken vóór en op de dag van kandidaatstelling verkrijgbaar bij het centraal stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_3
