        artikel: D_2
  - number: D 8
    text: |-
      Indien aan een persoon een mededeling is gedaan dat hij niet als kiezer is geregistreerd als bedoeld in
      [artikel D 5 van de Kieswet][ref1], worden hem uiterlijk op de zevende dag na ontvangst van zijn verzoek de
      redenen daarvan meegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_5
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelD_8
