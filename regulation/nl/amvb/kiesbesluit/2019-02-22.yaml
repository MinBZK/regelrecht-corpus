      - id: ref2
        bwb_id: BWBR0004627
        artikel: M_10
  - number: M 8
    text: |-
      Ten minste twee weken vóór de eerste zitting brengen burgemeester en wethouders van 's-Gravenhage ter openbare
      kennis op welke dag of dagen en gedurende welke tijden de briefstembureaus extra zitting houden, alsmede op welke
      plaats.
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelM_8
  - number: M 9
    text: |-
      1 Aan het eind van elke zitting wordt de sleuf van de stembus onmiddellijk in tegenwoordigheid van de in het
      stemlokaal aanwezige kiezers afgesloten, waarna de stembus verzegeld wordt en de sleutel waarmee de stembus is
      afgesloten, in een te verzegelen enveloppe wordt gedaan.

      2 Vervolgens stelt het stembureau vast:

      a. het aantal door het briefstembureau op de zitting verwerkte retourenveloppen;

      b. het aantal ingevolge [artikel M 11 van de Kieswet][ref1] terzijde gelegde retourenveloppen.

      3 De aantallen, bedoeld in het tweede lid, worden door de voorzitter aan de aanwezige kiezers bekend gemaakt.

      4 Daarna worden in afzonderlijke, te verzegelen, pakken gedaan:

      a. de ingewilligde registratieverzoeken van kiezers in het buitenland, waarvan de handtekening is vergeleken met
      die op het briefstembewijs, tezamen met een gewaarmerkte verklaring van het stembureau betreffende het aantal
      gestelde parafen;

      b. de ingeleverde briefstembewijzen;

      c. de ingevolge [artikel M 11 van de Kieswet][ref2] terzijde gelegde retourenveloppen;


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_11
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_11
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelM_9
