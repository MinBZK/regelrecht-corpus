  - number: H 3
    text: |-
      1 De waarborgsommen, bedoeld in de [artikelen H 12][ref1], [H 13][ref2], [H 13a][ref3] en
      [H 14 van de Kieswet][ref4], dienen uiterlijk op de veertiende dag voor de kandidaatstelling te zijn ontvangen op
      de daartoe bestemde rekening van onderscheidenlijk Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, de
      gemeente waar het centraal stembureau voor de verkiezingen van de leden van provinciale staten is gevestigd, het
      waterschap of de gemeente, bij een financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref5]
      in Nederland het bedrijf van bank mag uitoefenen, onder vermelding van de woorden "waarborgsom kandidaatstelling".

      2 De voorzitter van het centraal stembureau deelt het orgaan waaraan de waarborgsommen zijn betaald, zo
      spoedig mogelijk na de openbaarmaking van de uitslag van de verkiezing mee welke waarborgsommen ingevolge het
      [vierde of vijfde lid van artikel H 12][ref6], [H 13][ref7], [H 13a][ref8] of [H 14 van de Kieswet][ref9] moeten
      worden terugbetaald. Dit orgaan gaat vervolgens zo spoedig mogelijk over tot terugbetaling van die waarborgsommen.
      Over de terug te geven waarborgsommen wordt geen rente vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_12
