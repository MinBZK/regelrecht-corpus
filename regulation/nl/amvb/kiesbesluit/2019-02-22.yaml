  - number: P 1
    text: |-
      1 Indien het centraal stembureau programmatuur ten behoeve van de berekening van de uitslag van de verkiezingen of
      de berekening van de zetelverdeling gebruikt, zijn de volgende leden van toepassing.

      2 Het centraal stembureau stelt voor de programmatuur een specificatie op van de voor de berekening van de uitslag
      van de verkiezingen of de berekening van de zetelverdeling geldende wet- en regelgeving. De specificatie maakt
      duidelijk op welke wijze in de programmatuur de wet- en regelgeving moet worden toegepast bij de berekening van de
      uitslag van de verkiezingen of de berekening van de zetelverdeling.

      3 Het centraal stembureau laat de specificatie, bedoeld in het tweede lid, door een onafhankelijke instantie
      toetsen en maakt de specificatie en de uitkomst van de toets openbaar.

      4 Het centraal stembureau laat de programmatuur, bedoeld in het eerste lid, door een onafhankelijke instantie
      toetsen en maakt de uitkomst van de toets uiterlijk op de dag van de kandidaatstelling openbaar.

      5 Het centraal stembureau maakt uiterlijk op de dag van kandidaatstelling ten minste de documentatie en de broncode
      met betrekking tot de programmatuur die bij de daaropvolgende verkiezingen wordt gebruikt, openbaar.

      6 De onafhankelijke instantie, bedoeld in het vierde lid, toetst of de programmatuur:

      a. voldoet aan de specificatie, bedoeld in het tweede lid;

      b. voldoet aan de eisen, die bij ministeriële regeling aan de programmatuur zijn gesteld.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld over de toetsing door en de deskundigheid van de
      onafhankelijke instantie, de openbaarmaking van de uitkomst van de toets en de eisen aan de programmatuur, met dien
      verstande dat deze eisen geen betrekking hebben op de wijze waarop de programmatuur de wet- en regelgeving moet
      toepassen bij de berekening van de uitslag van de verkiezingen of de berekening van de zetelverdeling.
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelP_1
  - number: P 2
    text: |-
      1 Het centraal stembureau maakt de aantallen stemmen, zoals deze aantallen door het centraal stembureau zijn
      ingevoerd in de programmatuur, gelijktijdig met het vaststellen van de uitslag openbaar.

      2 Bij ministeriële regeling kan een internetadres worden aangewezen waarop de openbaarmaking geschiedt.
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelP_2
  - number: P 3
    text: |-
      De bekendmaking, bedoeld in [artikel P 20, tweede lid, van de Kieswet][ref1], geschiedt, indien het betreft de
      verkiezing van de leden van de Tweede Kamer, in de *Nederlandse Staatscourant* en, indien het betreft de verkiezing
      van de leden van provinciale staten, het algemeen bestuur of de gemeenteraad, op de in de provincie, het waterschap
      onderscheidenlijk de gemeente, gebruikelijke wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_20
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelP_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_20
  - number: P 4
    text: |-
      Indien het centraal stembureau ingevolge het bepaalde in [artikel P 21, tweede lid, van de Kieswet][ref1]
      verzegelde pakken heeft geopend, worden deze pakken na gebruik wederom verzegeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_21
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelP_4
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_21
  - number: P 5
    text: |-
      1 Voor zover, bij gecombineerde stemmingen, het centraal stembureau dan wel vertegenwoordigend orgaan van de ene
      verkiezing tot een nieuwe stemopneming besluit, geschiedt deze mede in aanwezigheid van het centraal stembureau
      respectievelijk vertegenwoordigend orgaan van de andere verkiezing.

      2 Het centraal stembureau dat mede aanwezig is bij de nieuwe stemopneming doet daarvan verslag aan het
      vertegenwoordigend orgaan waarvoor het de verkiezingsuitslag vaststelt of heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelP_5
  - number: R 1
    text: |-
      De formulieren voor de kandidatenlijsten, bedoeld in [artikel R 1, derde lid, van de Kieswet][ref1],
      en voor de verklaringen, bedoeld in de [artikelen R 2, eerste lid][ref2], [R 7, vierde lid][ref3], en
      [R 8, vierde lid, van de Kieswet][ref4], zijn gedurende drie weken vóór en op de dag van de kandidaatstelling
      verkrijgbaar bij het centraal stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_1
