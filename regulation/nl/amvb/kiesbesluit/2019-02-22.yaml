preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken van 29 augustus 1989, nr. CW89/1/U9, Stafafdeling
    Constitutionele Zaken en Wetgeving;

    Gelet op de Kieswet;

    Gezien het advies van de Kiesraad van 5 april 1989, nr. 4129; De Raad van State gehoord (advies van 10 oktober
    1989, nr. W04.89.0517);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken van 16 oktober 1989, nr. CW89/1/U13
    Stafafdeling Constitutionele Zaken en Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelAanhef
articles:
  - number: D 1
    text: |-
      Burgemeester en wethouders ontlenen aan de basisregistratie personen de gegevens die nodig zijn voor de
      vaststelling van de kiesgerechtigdheid van de personen die als ingezetene hierin zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelD_1
  - number: D 2
    text: |-
      1 Ten aanzien van personen die hun werkelijke woonplaats in de gemeente hebben, niet zijnde personen als bedoeld
      in [artikel D 1][ref1], en die als kiesgerechtigd in de gemeentelijke administratie worden opgenomen, registreren
      burgemeester en wethouders de volgende gegevens:

      a. de geslachtsnaam;

      b. de voornamen of voorletters;

      c. de geboortedatum;

      d. het adres;

      e. de nationaliteit.

      2 Burgemeester en wethouders schrappen de registratie van de kiesgerechtigdheid van de in het eerste lid bedoelde
      personen indien aan hen omstandigheden bekend worden op grond waarvan de desbetreffende persoon niet als kiezer
      behoort te zijn geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004632#ArtikelD_1
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelD_2
    references:
      - id: ref1
        bwb_id: BWBR0004632
        artikel: D_1
        hoofdstuk: D
        afdeling: II
  - number: D 3
    text: |-
      Op verzoek van burgemeester en wethouders verstrekt het dagelijks bestuur informatie over de grenzen van het gebied
      van het waterschap.
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelD_3
  - number: D 4
    text: |-
      Een registratie als bedoeld in [artikel D 2 van de Kieswet][ref1] bevat de volgende gegevens en bescheiden:

      a. de geslachtsnaam, de voornamen of voorletters, de geboortedatum, het geslacht, het woonadres, de nationaliteit
      en, indien van toepassing, het burgerservicenummer, het correspondentieadres, het e-mailadres en het
      telefoonnummer;

      b. een kopie van een geldig Nederlands paspoort, een kopie van een geldige Nederlandse identiteitskaart, een kopie
      van een geldige identiteitskaart van Bonaire, Sint Eustatius of Saba of een kopie van een geldige identiteitskaart
      van Aruba, Curaçao of Sint Maarten waarop de Nederlandse nationaliteit staat vermeld;

      c. de verklaring dat de persoon of zijn Nederlandse echtgenoot, geregistreerde partner of levensgezel en kinderen,
      voor zover dezen met hem een gemeenschappelijke huishouding voeren, in Nederlandse openbare dienst werkzaam is in
      Aruba, Curaçao of Sint Maarten.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelD_4
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: D_2
  - number: D 5
    text: |-
      1 Een aanvraag als bedoeld in [artikel D 3 van de Kieswet][ref1] wordt ingediend bij burgemeester en wethouders
      van ’s-Gravenhage, het hoofd van de consulaire post waaronder de woonplaats van aanvrager ressorteert of, als het
      een persoon betreft die in Aruba, Curaçao of Sint Maarten woont, bij de vertegenwoordiger van Nederland in deze
      landen. Het hoofd van de consulaire post of de vertegenwoordiger zendt de aanvraag zo spoedig mogelijk door naar
      burgemeester en wethouders van ’s-Gravenhage.

      2 In afwijking van het eerste lid dient een persoon als bedoeld in
      [artikel B 1, tweede lid, onder b, van de Kieswet][ref2] die niet gedurende ten minste tien jaren zijn werkelijke
      woonplaats in Nederland heeft gehad, de aanvraag in bij Onze Minister onder wiens verantwoordelijkheid de
      betrokken functionaris zijn werkzaamheden verricht. Onze Minister zendt de aanvraag zo spoedig mogelijk door naar
      burgemeester en wethouders van ’s-Gravenhage.

      3 Formulieren als bedoeld in [artikel D 3 van de Kieswet][ref3] zijn kosteloos verkrijgbaar bij de organen waarbij
      de aanvragen worden ingediend, en bij elke gemeente.

      4 Indiening van aanvragen langs elektronische weg kan uitsluitend bij burgemeester en wethouders van ’s-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelB_1
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelD_5
