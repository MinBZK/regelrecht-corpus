        bwb_id: BWBR0004627
        artikel: M_7
  - number: M 6
    text: |-
      De stukken, bedoeld in [artikel M 6, eerste lid, van de Kieswet][ref1], worden per post aan de kiezer gezonden
      voorzien van een Priority-aanduiding of per koerier.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_6
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelM_6
