  - number: N 10
    text: |-
      1 Nadat de stemmen zijn opgenomen en aan [artikel N 9, tweede lid, van de Kieswet][ref1] toepassing is gegeven,
      schorst de voorzitter van het briefstembureau de stemopneming. Van de geschorste stemopneming wordt proces-verbaal
      opgemaakt.

      2 [ Artikel N 10, eerste lid, laatste volzin, tweede en derde lid van de Kieswet][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_10
    url: https://wetten.overheid.nl/BWBR0004632/2019-02-22#ArtikelN_10
