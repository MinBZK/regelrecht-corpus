  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 26 maart 1996, nr. HDTP/96/755/HP Hoofddirectie
    Telecommunicatie en Post;


    Gelet op artikelen 4a, 4b, 9, 12, 15, 21, 23, 41, aanhef, onder a en b, en 48 van de Wet op de
    telecommunicatievoorzieningen en artikel 24 van de Vergunningenwet kabelgebonden telecommunicatie-infrastructuur;


    De Raad van State gehoord (advies van 19 juni 1996, nr. W09.96.0138);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat a.i., van 1 juli 1996, nr. HDTP/96/1691/HW,
    Hoofddirectie Telecommunicatie en Post;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008156/1999-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de wet: de Wet op de telecommunicatievoorzieningen;

      b. de houder van de concessie: de rechtspersoon, bedoeld in [artikel 3, eerste lid][ref1], van de wet;

      c. een houder van een infrastructuurvergunning: een houder van een infrastructuurvergunning als bedoeld in
      [artikel 2 van de Vergunningenwet kabelgebonden telecommunicatie-infrastructuur][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008156#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007973#Artikel2
    url: https://wetten.overheid.nl/BWBR0008156/1999-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008156
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007973
        artikel: '2'
  - number: '2'
    text: >-
      1 Voorzieningen die de houder van de concessie op grond van artikel 4 van de wet ter beschikking stelt aan een
      houder van een infrastructuurvergunning, zijn in ieder geval:


      a. lokaties waar koppelingen van de telecommunicatie-infrastructuur van een houder van een infrastructuurvergunning
      aan de telecommunicatie-infrastructuur van de houder van de concessie naar het oordeel van een houder van een
      infrastructuurvergunning gewenst zijn en door de houder van de concessie gerealiseerd kunnen worden, en


      b. koppelvlakken tussen de telecommunicatie-infrastructuur van een houder van een infrastructuurvergunning en
      de telecommunicatie-infrastructuur van de houder van de concessie die voldoen aan de door een houder van een
      infrastructuurvergunning gevraagde capaciteit, kwaliteit en eigenschappen.


      2 De houder van de concessie stelt de in het eerste lid bedoelde voorzieningen aan een houder van een
      infrastructuurvergunning ter beschikking binnen vier weken nadat deze een verzoek daartoe aan de houder van de
      concessie heeft gedaan indien de gevraagde voorzieningen in vooraanleg reeds aanwezig zijn. In geval de gevraagde
      voorzieningen niet in vooraanleg aanwezig zijn dient de houder van de concessie binnen vier weken aan een houder
      van een infrastructuurvergunning een bindende offerte te leveren waarin in ieder geval is opgenomen:


      a. een beschrijving van de te leveren voorzieningen, waarbij is uitgegaan van de door een houder van een
      infrastructuurvergunning gevraagde voorzieningen, en


      b. de prijs waarvoor en de termijn waarbinnen de gevraagde voorzieningen door de houder van de concessie geleverd
      zullen worden.
    url: https://wetten.overheid.nl/BWBR0008156/1999-04-01#Artikel2
  - number: '3'
    text: >-
      1 Een houder van een infrastructuurvergunning is verplicht binnen een bij ministeriële regeling te bepalen
      termijn na het afgeven van de infrastructuurvergunning een ieder in het gebied waarop de infrastructuurvergunning
      betrekking heeft, tegen vergoeding het gebruik van vaste verbindingen ter beschikking te stellen.


      2 In de ministeriële regeling, bedoeld in het eerste lid, kan voor wat betreft de termijnen waarbinnen het gebruik
      van vaste verbindingen ter beschikking wordt gesteld, onderscheid gemaakt worden tussen verschillende houders van
      een infrastructuurvergunning.
    url: https://wetten.overheid.nl/BWBR0008156/1999-04-01#Artikel3
  - number: '4'
    text: |-
      Na afloop van de in [artikel 3][ref1] bedoelde termijnen is met betrekking tot het door een houder van
      een infrastructuurvergunning ter beschikking stellen van voorzieningen ten behoeve van koppelingen aan
      de telecommunicatie-infrastructuur van de houder van de concessie, onderscheidenlijk aan de kabelgebonden
      telecommunicatie-infrastructuur van een andere houder van een infrastructuurvergunning, [artikel 2][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008156#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008156#Artikel2
    url: https://wetten.overheid.nl/BWBR0008156/1999-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008156
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008156
        artikel: '2'
        paragraaf: '2'
  - number: '5'
    text: |-
      1 De houder van een infrastructuurvergunning draagt er zorg voor dat bij de bedrijfsvoering met betrekking
      tot de kabelgebonden telecommunicatie-infrastructuur het telefoon- en telegraafgeheim, bedoeld in
      [artikel 13, tweede lid, van de Grondwet][ref1], wordt nageleefd.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot de overige verplichtingen van een houder van
      een infrastructuurvergunning.

      3 De krachtens het tweede lid gestelde regels zien mede op de vermindering van de ongelijkwaardigheid in de
      mededingingspositie, welke het gevolg is van de eerdere aanleg en exploitatie van kabelgebonden telecommunicatie-
      infrastructuur door de houder van de concessie.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel13
    url: https://wetten.overheid.nl/BWBR0008156/1999-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '13'
