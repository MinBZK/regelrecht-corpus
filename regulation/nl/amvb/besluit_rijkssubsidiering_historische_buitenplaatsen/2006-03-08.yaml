preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 26 oktober 1992; CDWJZ-U-92 1925;

    Gelet op artikel 34 van de Monumentenwet 1988;

    Gezien het advies van de Raad voor het cultuurbeheer;

    De Raad van State gehoord (advies van 17 maart 1993, nr. W13.92.0510);

    Gezien het nader rapport van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 25 juni 1993, CDWJZ-U-
    931050;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. eigenaar:

      1. een natuurlijke persoon die het recht van eigendom of een ander zakelijk recht heeft op een beschermde
      historische buitenplaats;

      2. een naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid waarvan de bezittingen
      en schulden worden beschouwd als bezittingen en schulden van de gezamenlijke aandeelhouders, als bedoeld in
      [artikel 7][ref1], en die het recht van eigendom of een ander zakelijk recht heeft op een beschermde historische
      buitenplaats;

      3. een rechtspersoon die krachtens privaatrecht is ingesteld en die het recht van eigendom of een ander zakelijk
      recht op een beschermde historische buitenplaats heeft verkregen van een natuurlijke persoon als bedoeld onder
      1 of van een vennootschap als bedoeld onder 2 en die zich uitsluitend of nagenoeg uitsluitend ten doel stelt die
      buitenplaats in stand te houden;

      b. beschermde historische buitenplaats: een in het register, bedoeld in [artikel 6 van de Monumentenwet 1988][ref2],
      als zodanig vermeld complex waarin van oorsprong één of meer gebouwen een compositorisch geheel vormen met een tuin
      of met een park van tenminste 1 hectare, waarvan de aanleg dateert van vóór 1850 en herkenbaar aanwezig is;

      c. restauratie: werkzaamheden aan de vervaardigde zaken in een tuin of park van een beschermde historische
      buitenplaats, het normale onderhoud te boven gaand, die voor het herstel van die zaken noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel6
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel1
    references:
      - id: ref1
