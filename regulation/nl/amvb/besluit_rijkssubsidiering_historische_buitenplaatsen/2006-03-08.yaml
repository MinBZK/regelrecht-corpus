        artikel: 7a
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '6'
  - number: '2'
    text: |-
      1 Subsidie wordt in ieder geval niet verstrekt:

      a. voor zover de kosten van de restauratie op grond van een verzekering worden gedekt en voorzover de in rekening
      gebrachte omzetbelasting op grond van de [Wet op de omzetbelasting][ref1] op verschuldigde belasting in aftrek kan
      worden gebracht, dan wel anderszins niet ten laste van de aanvrager komen;

      b. voor zover in de kosten van de restauratie subsidie is verstrekt op grond van een andere rijkssubsidieregeling;

      c. indien met het uitvoeren van de restauratie is begonnen voordat Onze minister heeft ingestemd met het
      restauratieplan en de begroting van de bijbehorende kosten.

      2 Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002629
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '3'
    text: |-
      1 Onze minister kan een eigenaar subsidie verstrekken in de kosten van een naar het oordeel van Onze
      Minister sober en doelmatig uitgevoerde restauratie van zaken die compositorisch of functioneel deel uitmaken
      van de tuin of het park van de beschermde historische buitenplaats, en die in het register, bedoeld in
      [artikel 6 van de Monumentenwet 1988][ref1], zijn vermeld.

      2 Subsidie wordt slechts verstrekt indien de restauratie, bedoeld in het eerste lid, bijdraagt aan het
      beheer van de beschermde historische buitenplaats, dat gericht is op het behoud van de cultuurhistorische- en
      natuurwetenschappelijke waarden en van het natuurschoon.

      3 Onze minister verstrekt geen subsidie dan na overleg met Onze Minister van Landbouw, Natuurbeheer en Visserij.

      4 Onze minister verstrekt geen subsidie dan nadat hij het college van burgemeester en wethouders van de gemeente
      waarin de desbetreffende beschermde historische buitenplaats is gelegen, en indien de gemeente, niet een
      budgethoudende gemeente, als bedoeld in [artikel 1, eerste lid, onderdeel ][ref2] is of indien de gemeente een
      budgethoudende gemeente is die ingevolge [artikel 13 van dat besluit][ref3] bij het vaststellen van het provinciaal
      restauratieuitvoeringsprogramma wordt betrokken, gedeputeerde staten in de gelegenheid heeft gesteld hun zienswijze
      naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008615#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0008615#Artikel13
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0008615
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0008615
        artikel: '13'
  - number: '4'
    text: |-
      De subsidie bedraagt 70% van de totale kosten van de restauratie die is verricht overeenkomstig een restauratieplan
      en begroting van de bijbehorende kosten, waarmee Onze minister heeft ingestemd, met dien verstande dat per jaar ten
      hoogste € 36 300 als subsidie voor een bepaalde beschermde historische buitenplaats wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel4
  - number: 4a
    text: |-
      Onze minister kan ieder jaar een subsidieplafond vaststellen voor de verstrekking van subsidie als bedoeld in
      [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006058#Artikel3
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0006058
        artikel: '3'
        hoofdstuk: II
  - number: 4b
    text: |-
      Onze minister verdeelt de voor de verstrekking van subsidie als bedoeld in [artikel 3][ref1] beschikbare bedragen
      in volgorde van urgentie van de restauraties waarvoor subsidie is gevraagd, waarbij in ieder geval rekening wordt
      gehouden met de technische staat van de te restaureren zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0006058#Artikel3
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006058
        artikel: '3'
        hoofdstuk: II
  - number: '5'
    text: |-
      1 Een subsidieaanvraag wordt door de eigenaar ingediend bij Onze minister vóór 1 februari van het jaar dat
      voorafgaat aan het jaar waarin de restauratie wordt uitgevoerd.

      2 De aanvraag is vergezeld van:

      a. een globale beschrijving van de restauratie en van de overige werkzaamheden die bijdragen aan het beheer,
      bedoeld in [artikel 3, tweede lid][ref1].

      b. een globale begroting in tweevoud.

      3 Onze minister zendt terstond een afschrift van de aanvraag naar gedeputeerde staten van de provincie en het
      college van burgemeester en wethouders van de gemeente waarin de desbetreffende beschermde historische buitenplaats
      gelegen is.


      [ref1]: https://wetten.overheid.nl/BWBR0006058#Artikel3
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006058
        artikel: '3'
        hoofdstuk: II
  - number: '6'
    text: |-
      1 Onze minister deelt vóór 1 mei van het jaar dat voorafgaat aan het jaar waarin de restauratie wordt uitgevoerd
      aan de aanvrager mede of de aanvraag voor een verlening in aanmerking kan komen.

      2 Indien de mededeling, bedoeld in het eerste lid, positief is, vermeldt Onze minister daarbij welk bedrag voor een
      mogelijke verlening is gereserveerd alsmede het jaar of de jaren waarin tot eventuele uitbetaling zou kunnen worden
      overgegaan. Tevens wordt aangegeven welke nadere stukken aan Onze minister dienen te worden toegezonden.

      3 Tot de nadere stukken, bedoeld in het tweede lid, behoren in ieder geval een restauratieplan en een begroting van
      de bijbehorende kosten.

      4 Het restauratieplan bestaat uit:

      a. een beschrijving van de technische staat van de te restaureren zaken;

      b. een op de onder *a* bedoelde beschrijving gebaseerd bestek of gebaseerde werkomschrijving per onderdeel van de
      toe te passen constructies, materialen, afwerkingen en kleuren alsmede van de wijze van verwerking daarvan.

      5 De begroting omvat alle kosten van de restauratie en is gespecificeerd in hoeveelheden, uren en materialen.
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel6
  - number: '7'
    text: |-
      1 De nadere stukken, bedoeld in [artikel 6][ref1], worden vóór 1 augustus van het jaar dat voorafgaat aan het jaar
      waarin de restauratie wordt uitgevoerd, aan Onze minister toegezonden.

      2 Onze minister zendt terstond een afschrift van de nadere stukken naar gedeputeerde staten van de provincie en het
      college van burgemeester en wethouders van de gemeente waarin de desbetreffende beschermde historische buitenplaats
      gelegen is.


      [ref1]: https://wetten.overheid.nl/BWBR0006058#Artikel6
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006058
        artikel: '6'
        hoofdstuk: III
  - number: '8'
    text: |-
      1 Onze minister zendt de aanvrager vóór 1 november van het jaar dat voorafgaat aan het jaar waarin de restauratie
      wordt uitgevoerd de beschikking op de subsidieaanvraag toe.

      2 Indien de beschikking een subsidieverlening inhoudt, vermeldt Onze minister daarin:

      a. in hoeverre hij instemt met het plan en de begroting van de bijbehorende kosten;

      b. het jaar of de jaren waarin de subsidie kan worden bevoorschot.

      3 Nadat subsidie is verleend kunnen aan de eigenaar voorschotten worden verstrekt in het jaar of de jaren, bedoeld
      in het tweede lid, onderdeel *b*, met dien verstande dat gedurende de restauratie ten hoogste 80% van het bedrag
      dat ten hoogste als subsidie kan worden verstrekt, kan worden bevoorschot en dat het resterende percentage bij
      tijdige ontvangst van de financiële verantwoording, bedoeld in [artikel 13][ref1], kan worden bevoorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0006058#Artikel13
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006058
        artikel: '13'
        hoofdstuk: V
  - number: '9'
    text: De restauratie wordt begonnen en beëindigd voor de data die Onze minister vermeldt in de verlening.
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel9
  - number: '11'
    text: |-
      De eigenaar doet zo spoedig mogelijk schriftelijk mededeling aan Onze minister indien er zich omstandigheden
      voordoen die van invloed kunnen zijn op de subsidieverlening, onder overlegging van de relevante stukken.
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel11
  - number: '12'
    text: |-
      De eigenaar is verplicht na afloop van de restauratie de gerestaureerde zaken onveranderd te bewaren en te
      onderhouden in de staat waarin ze door de restauratie zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel12
  - number: '13'
    text: |-
      1 Binnen drie maanden na afloop van de restauratie dient de eigenaar in tweevoud een aanvraag tot vaststelling van
      de subsidie in bij Onze minister.

      2 Bij de aanvraag tot subsidievaststelling legt de eigenaar rekening en verantwoording af, gerelateerd aan de
      ingediende begroting, onder overlegging van de desbetreffende rekeningen en bewijzen van betaling.

      3 Indien rekeningen betrekking hebben op kosten van personeel dat in loondienst is bij de eigenaar, is de
      financiële verantwoording tevens vergezeld van een verklaring van een registeraccountant, een accountant-
      administratieconsulent of een door Onze minister aanvaarde onafhankelijke deskundige op het gebied van bouwkosten,
      waaruit blijkt hoeveel uren door dat personeel is besteed aan werkzaamheden waarvoor de subsidie ingevolge
      [artikel 8, tweede lid][ref1], kan worden besteed.


      [ref1]: https://wetten.overheid.nl/BWBR0006058#Artikel8
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006058
        artikel: '8'
        hoofdstuk: III
  - number: '14'
    text: |-
      1 De aanvraag tot subsidievaststelling kan geen kosten bevatten die niet reeds bij de verlening als subsidiabele
      restauratiekosten zijn vastgesteld.

      2 De eigenaar stort teveel ontvangen voorschotten onmiddellijk terug, tenzij Onze minister tot verrekening op
      andere wijze heeft besloten.
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel14
  - number: '15'
    text: |-
      Onze minister kan een formulier vaststellen voor:

      a. de aanvragen, bedoeld in de [artikelen 5][ref1] en [13][ref2];

      b. het restauratieplan en de begroting, bedoeld in [artikel 6][ref3];

      c. de financiële verantwoording, bedoeld in [artikel 13][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006058#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006058#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0006058#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0006058#Artikel13
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006058
        artikel: '5'
        hoofdstuk: III
      - id: ref2
