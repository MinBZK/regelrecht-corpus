        artikel: '6'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0006058
        artikel: '13'
        hoofdstuk: V
  - number: '16'
    text: |-
      Onze minister kan artikelen van dit besluit buiten toepassing laten of daarvan afwijken voor zover toepassing gelet
      op het belang dat dit besluit beoogt te beschermen zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel16
  - number: '22'
    text: 'Dit besluit wordt aangehaald als: Besluit rijkssubsidiëring historische buitenplaatsen.'
    url: https://wetten.overheid.nl/BWBR0006058/2006-03-08#Artikel22
