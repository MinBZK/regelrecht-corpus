---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_typekeuring_luchtverontreiniging_motoren_voor_mobiele_machines
regulatory_layer: AMVB
publication_date: '2018-06-28'
valid_from: '2014-02-18'
bwb_id: BWBR0012169
url: https://wetten.overheid.nl/BWBR0012169/2014-02-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 13 september
    2000, nr. MJZ2000108272, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan in overeenstemming met Onze
    Minister van Verkeer en Waterstaat en Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op de richtlijn nr. 97/68/EG van het Europees Parlement en de Raad van de Europese Unie van 16 december 1997
    betreffende de onderlinge aanpassing van de wetgevingen van de lidstaten inzake maatregelen tegen de uitstoot van
    verontreinigende gassen en deeltjes door inwendige verbrandingsmotoren die worden gemonteerd in niet voor de weg
    bestemde mobiele machines (PbEG 1998, L 59), op richtlijn nr. 2000/25/EG van het Europees Parlement en de Raad
    van de Europese Unie van 22 mei 2000 (PbEG L 173) inzake maatregelen tegen de uitstoot van verontreinigende gassen
    en deeltjes door motoren bestemd voor het aandrijven van landbouw- of bosbouwtrekkers en houdende wijziging van
    Richtlijn 74/150/EEG van de Raad en op de artikelen 13, 15 en 17 van de Wet inzake de luchtverontreiniging;

    De Raad van State gehoord (advies van 3 november 2000, nr. W08.00.0431/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    16 januari 2001, nr. MJZ20010026174, Centrale Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht in
    overeenstemming met Onze Minister van Verkeer en Waterstaat en Onze Minister van Landbouw, Natuurbeheer en
    Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop rustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.a
    text: |-
      [richtlijn 97/68](31997L0068): [richtlijn nr. 97/68/EG](31997L0068) van het Europees Parlement en de Raad van de
      Europese Unie van 16 december 1997 betreffende de onderlinge aanpassing van de wetgevingen van de lidstaten inzake
      maatregelen tegen de uitstoot van verontreinigende gassen en deeltjes door inwendige verbrandingsmotoren die worden
      gemonteerd in niet voor de weg bestemde mobiele machines (PbEG 1998, L 59);
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.b
    text: 'Onze Minister: Onze Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.c
    text: |-
      fabrikant: persoon of organisatie die tegenover de keuringsinstantie verantwoordelijk is voor alle aspecten van de
      goedkeuringsprocedure en zich garant stelt voor de overeenstemming van de productie met het goedgekeurde type;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.d
    text: 'keuringsinstantie: een door Onze Minister aangewezen keuringsinstantie;'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.e
    text: |-
      mobiele machine: mobiel werktuig, vervoerbare industriële uitrusting of voertuig met of zonder carrosserie, niet
      bestemd voor personen- of goederenvervoer over de weg als bedoeld in bijlage I, deel 1, van [richtlijn 97/68]
      (31997L0068);
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.f
    text: 'motortype: motortype als bedoeld in artikel 2 van richtlijn 97/68;'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.g
    text: 'motorfamilie: motorfamilie als bedoeld in artikel 2 van richtlijn 97/68;.'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.h
    text: 'oudermotor: oudermotor als bedoeld in artikel 2 van richtlijn 97/68;'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.i
    text: 'motor:'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.i.1°
    text: |-
      verbrandingsmotor als bedoeld in bijlage I, deel 1, van richtlijn 97/68 bestemd om te worden gemonteerd in een
      mobiele machine dan wel gemonteerd in een mobiele machine;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.i.2°
    text: secundaire verbrandingsmotor als bedoeld in bijlage I, deel 1, van richtlijn 97/68;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.j
    text: 'informatiedossier: informatiedossier als bedoeld in artikel 2 van richtlijn 97/68;'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.k
    text: |-
      in de handel brengen: in de handel brengen als bedoeld in artikel 2, achtste gedachtestreepje, van [richtlijn
      97/68](31997L0068);
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.l
    text: |-
      ruilmotor: nieuw gebouwde motor ter vervanging van een motor in een reeds in gebruik zijnde mobiele machine of
      trekker;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: 1.m
    text: |-
      flexibele regeling: procedure als bedoeld in de artikelen 4, zesde lid, 10, vijfde lid, en 10, zevende lid, in
      samenhang met bijlage XIII van richtlijn 97/68 waarbij een motorenfabrikant in de periode tussen twee opeenvolgende
      stadia van grenswaarden een beperkt aantal in niet voor weggebruik bestemde mobiele machines in te bouwen motoren
      in de handel mag brengen die uitsluitend voldoen aan de emissiegrenswaarden uit het vorige stadium.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel1
  - number: '3.1'
    text: |-
      Het is verboden om een motor in de handel te brengen of in voorraad te hebben indien de motor niet behoort tot een
      motortype dat of een motorfamilie die wat betreft luchtverontreiniging is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel3
  - number: '3.2'
    text: 'De goedkeuring, bedoeld in het eerst lid, betreft een goedkeuring:'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel3
  - number: 3.2.a
    text: |-
      op grond van typegoedkeuring door de keuringsinstantie, verricht aan de hand van de bij of krachtens dit besluit
      vastgestelde voorschriften;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel3
  - number: 3.2.b
    text: blijkens een goedkeuringscertificaat als bedoeld in richtlijn 97/68, of
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel3
  - number: 3.2.c
    text: |-
      op grond van een typegoedkeuring die ingevolge richtlijn 97/68, bijlage XII, ten minste een gelijkwaardig
      beschermingsniveau biedt.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel3
  - number: '4.1'
    text: |-
      Het verbod, bedoeld in [artikel 3][ref1], is niet van toepassing op een motor:


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: 4.1.a
    text: voor het gebruik door de krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4
  - number: 4.1.b
    text: in mobiele machines die voornamelijk zijn bestemd voor het te water laten en binnenhalen van reddingsboten;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4
  - number: 4.1.c
    text: |-
      in mobiele machines die voornamelijk zijn bestemd voor het te water laten en binnenhalen van vanaf het strand te
      water gelaten boten;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4
  - number: 4.1.d
    text: waarop de flexibele regeling van toepassing is;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4
  - number: 4.1.e
    text: |-
      die bestemd is voor uitvoer naar gebieden waarop de Overeenkomst betreffende de Europese Economische Ruimte niet
      van toepassing is.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4
  - number: '4.2'
    text: |-
      De keuringsinstantie kan op verzoek van de fabrikant toestaan dat in afwijking van artikel 3 gedurende 12 maanden
      na het verstrijken van de geldigheidsduur van een goedkeuring als bedoeld in [artikel 3][ref1] een motor in de
      handel wordt gebracht, indien aan de eisen, bedoeld in [artikel 10, tweede lid][ref2], in samenhang met artikel 10,
      zesde lid, van richtlijn 97/68 is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012169#Artikel10
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012169
        artikel: '10'
  - number: '4.3'
    text: |-
      Onze Minister kan categorieën motoren aanwijzen waarop het verbod, bedoeld in [artikel 3][ref1], niet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: 4a.1
    text: |-
      Een typegoedkeuring als bedoeld in [artikel 3, tweede lid, onderdeel a][ref1], wordt door de fabrikant aangevraagd
      bij de keuringsinstantie.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: 4a.2
    text: 'Een aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4a
  - number: 4a.2.a
    text: een informatiedossier, en
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4a
  - number: 4a.2.b
    text: |-
      een motor die voldoet aan de motortypekenmerken, bedoeld in bijlage II, aanhangsel 1, van richtlijn 97/68. Indien
      de aanvraag een motorfamilie betreft en de oudermotor vertegenwoordigt volgens de keuringsinstantie onvoldoende
      de motorfamilie als bedoeld in bijlage II, aanhangsel 2, van richtlijn 97/68, wordt een andere oudermotor ter
      beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4a
  - number: 4a.3
    text: Een aanvraag wordt niet in meer dan één lidstaat van de Europese Unie ingediend.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4a
  - number: 4a.4
    text: |-
      Voor ieder goed te keuren motortype en voor iedere goed te keuren motorfamilie wordt een afzonderlijke aanvraag
      ingediend.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4a
  - number: 4a.5
    text: |-
      Een wijziging of uitbreiding van een typegoedkeuring wordt niet in behandeling genomen indien de keuringsinstantie
      de oorspronkelijke typegoedkeuring niet heeft verleend.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel4a
  - number: '5.1'
    text: 'Typegoedkeuring wordt slechts geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel5
  - number: 5.1.a
    text: |-
      het motortype of de motorfamilie niet voldoet aan de voorschriften in dit besluit of de voorschriften, bedoeld in
      het derde lid, en
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel5
  - number: 5.1.b
    text: het motortype of de motorfamilie niet in overeenstemming is met de gegevens van het informatiedossier.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel5
  - number: '5.2'
    text: |-
      Indien het motortype of de motorfamilie waarvoor goedkeuring is aangevraagd slechts functioneert dan wel een
      kenmerk slechts vertoont in combinatie met andere onderdelen van de mobiele machine waarin deze is gemonteerd,
      wordt de typegoedkeuring dienovereenkomstig beperkt.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister stelt de voorschriften vast aan de hand waarvan de in
      [artikel 3, aanhef en tweede lid, onder a][ref1], bedoelde typegoedkeuringen worden verricht. De voorschriften
      hebben betrekking op eigenschappen en onderdelen van motoren, die bepalend zijn voor de door deze veroorzaakte
      luchtverontreiniging en bevatten mede een omschrijving van het keuringsproces.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '5.4'
    text: |-
      In geval van wijziging van de keuringsvoorschriften die ten grondslag hebben gelegen aan de
      typegoedkeuringen, bedoeld in het eerste lid of aan een goedkeuringscertificaat als bedoeld in
      [artikel 3, aanhef en tweede lid, onder b][ref1], kan Onze Minister een termijn stellen bij het verstrijken waarvan
      die typegoedkeuring zijn geldigheid verliest.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '5.5'
    text: |-
      Een typegoedkeuring wordt geacht niet verleend te zijn, zo lang aan de bediener, bestuurder of fabrikant in
      voorkomend geval de informatie, bedoeld in bijlage I, voorschrift 8.4.6.1, 8.4.7.1 of 8.5.5, van richtlijn 97/68,
      niet is verstrekt.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel5
  - number: '6.1'
    text: 'Degene aan wie de typegoedkeuring is verleend:'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel6
  - number: 6.1.a
    text: 'brengt merktekens aan op:'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel6
  - number: 6.1.a.1°
    text: |-
      iedere eenheid die in overeenstemming met het goedgekeurde type is geproduceerd, overeenkomstig bijlage I,
      voorschrift 3, van richtlijn 97/68;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel6
  - number: 6.1.a.2°
    text: |-
      motoren met compressieontsteking die volgens de flexibele regeling in de handel zijn gebracht, overeenkomstig
      bijlage XIII van richtlijn 97/68;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel6
  - number: 6.1.b
    text: |-
      brengt op een vrijgestelde ruilmotor een etiket aan met de tekst RUILMOTOR en de unieke referentie van de afwijking
      in kwestie;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel6
  - number: 6.1.c
    text: |-
      verstrekt bij iedere gefabriceerde eenheid gedetailleerde gegevens over eventuele beperkingen als bedoeld in
      [artikel 5, tweede lid][ref1], en vermeldt eventuele voorwaarden waaraan bij montage moet worden voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel5
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '5'
  - number: 6.1.d
    text: |-
      verschaft, periodiek dan wel op verzoek, informatie aan de keuringsinstantie in verband met de in richtlijn 97/68
      genoemde rapportageverplichtingen;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel6
  - number: 6.1.e
    text: |-
      informeert de keuringsinstantie over wijzigingen van de gegevens in het in informatiepakket en andere gegevens die
      ten grondslag hebben gelegen aan het verlenen van een typegoedkeuring;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel6
  - number: 6.1.f
    text: |-
      verstrekt aan alle eigenaars van nieuwe motoren of mobiele machines schriftelijke instructies over het NO-
      emissiebeheersingssysteem en de correcte werking ervan, overeenkomstig bijlage I, aanhangsel I, van richtlijn
      97/68;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel6
  - number: 6.1.g
    text: |-
      volgt ten behoeve van de verificatie van de duurzaamheid van compressieontstekingsmotoren de procedure,
      bedoeld in bijlage III, aanhangsel 5, van richtlijn 97/68 voor de selectie van motoren die volgens een
      bedrijfsaccumulatieschema worden getest en voert onderhoud en reparaties van deze motoren uit overeenkomstig
      bijlage III, aanhangsel 5, voorschrift 2.5 tot en met 2.5.4.2, van richtlijn 97/68;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel6
  - number: 6.1.h
    text: |-
      verstrekt in voorkomend geval aan de bediener, bestuurder of fabrikant de informatie, bedoeld in bijlage I,
      8.4.6.1, 8.4.7.1 of 8.5.5, van richtlijn 97/68.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel6
  - number: '6.2'
    text: Degene die een motor invoert, vermeldt de typegoedkeuringsgegevens op de handelsbescheiden.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel6
  - number: '6.3'
    text: Onze Minister kan nadere regels stellen ter uitvoering van het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel6
  - number: '7.1'
    text: |-
      De keuringsinstantie houdt toezicht op het overeenstemmen van motoren en trekkers met het type waarvoor een
      typegoedkeuring is verleend als bedoeld in [artikel 3][ref1]. Tot dit toezicht kan behoren het steekproefsgewijs
      keuren van motoren, het periodiek controleren van de organisatie van de fabrikant alsmede het proces volgens
      hetwelk hij zijn werkzaamheden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '7.2'
    text: |-
      Degene aan wie de goedkeuring is verleend, is gehouden de nodige medewerking te verlenen aan de werkzaamheden die
      verband houden met het in het eerste lid bedoelde toezicht.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel7
  - number: '7.3'
    text: Onze Minister kan nadere regels stellen ter uitvoering van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel7
  - number: '8.1'
    text: De keuringsinstantie trekt een typegoedkeuring in indien degene aan wie deze is verleend daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel8
  - number: '8.2'
    text: 'De keuringsinstantie kan een typegoedkeuring intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel8
  - number: 8.2.a
    text: |-
      degene aan wie de typegoedkeuring is verleend ten onrechte een motor of een trekker doet of laat doorgaan als
      behorende tot een goedgekeurd type;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel8
  - number: 8.2.b
    text: |-
      degene aan wie de goedkeuring is verleend in strijd handelt met de voorschriften, bedoeld in artikel 6 van dit
      besluit of met artikel 7, tweede lid;
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel8
  - number: 8.2.c
    text: |-
      uit het toezicht, bedoeld in [artikel 7, eerste lid][ref1], blijkt dat een motor of een trekker niet overeenstemt
      met het type waarvoor de typegoedkeuring is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel7
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '7'
  - number: 8.2.d
    text: de typegoedkeuring ten onrechte is verleend.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel8
  - number: '9'
    text: |-
      Onze Minister, handelende in overeenstemming met Onze Ministers die het mede aangaat, kan de keuringsinstantie
      aanwijzingen geven van algemene aard omtrent de uitoefening van de aan de keuringsinstantie opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel9
  - number: '11'
    text: |-
      Een wijziging van [richtlijn 97/68](31997L0068) gaat voor de toepassing van dit besluit gelden met ingang van de
      dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat
      in de Staatscourant wordt bekend gemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel11
  - number: '13'
    text: |-
      Goedkeuringen van de Dienst Wegverkeer voor motoren verleend vóór het tijdstip van inwerkingtreding van dit
      besluit, die voldoen aan [richtlijn 97/68](31997L0068), worden aangemerkt als goedkeuringen die zijn verleend op
      grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel13
  - number: '14'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel14
  - number: '15'
    text: 'Dit besluit wordt aangehaald als: Besluit typekeuring luchtverontreiniging motoren voor mobiele machines.'
    url: https://wetten.overheid.nl/BWBR0012169/2014-02-18#Artikel15
