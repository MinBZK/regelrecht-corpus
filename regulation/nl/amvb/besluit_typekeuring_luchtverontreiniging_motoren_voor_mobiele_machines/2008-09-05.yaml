  - number: '3'
    text: |-
      Het is verboden een motor bestemd om te worden gemonteerd in een mobiele machine dan wel gemonteerd in een
      mobiele machine of een secundaire motor bestemd om te worden gemonteerd in een voertuig bestemd voor personen- of
      goederenvervoer over de weg te vervaardigen, in te voeren, in voorraad te hebben of af te leveren indien deze niet
      behoort tot een type dat wat betreft luchtverontreiniging:

      a. hetzij is goedgekeurd ingevolge een typegoedkeuring door de keuringsinstantie, verricht aan de hand van de
      krachtens [artikel 5, derde lid][ref1], vastgestelde voorschriften;

      b. hetzij blijkens een goedkeuringscertificaat als bedoeld in [richtlijn 97/68](31997L0068) is goedgekeurd;

      c. hetzij is goedgekeurd op grond van een typegoedkeuring die ingevolge [richtlijn 97/68](31997L0068) ten minste
      een gelijkwaardig beschermingsniveau biedt.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel5
