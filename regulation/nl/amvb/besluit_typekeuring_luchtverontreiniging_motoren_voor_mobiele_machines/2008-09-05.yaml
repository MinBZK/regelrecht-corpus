  - number: '11'
    text: |-
      Een wijziging van [richtlijn 97/68](31997L0068) of van [richtlijn 2000/25](32000L0025) gaat voor de toepassing
      van dit besluit gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn
      gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekend gemaakt, een ander tijdstip wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel11
  - number: '12'
    text: Het Besluit typekeuring luchtverontreiniging motoren voor mobiele machines wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel12
  - number: '13'
    text: |-
      1 Goedkeuringen van de Dienst Wegverkeer voor motoren bestemd om te worden gemonteerd in een mobiele machine dan
      wel gemonteerd in een mobiele machine verleend vóór het tijdstip van inwerkingtreding van dit besluit, die voldoen
      aan [richtlijn 97/68](31997L0068), worden aangemerkt als goedkeuringen die zijn verleend op grond van dit besluit.

      2 Goedkeuringen van de Dienst Wegverkeer voor trekkers of motoren bestemd voor het aandrijven van een trekker
      verleend vóór het tijdstip van inwerkingtreding van dit besluit, die voldoen aan [richtlijn 2000/25](32000L0025),
      worden aangemerkt als goedkeuringen die zijn verleend op grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel13
  - number: '14'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel14
  - number: '15'
    text: |-
      Dit besluit wordt aangehaald als: Besluit typekeuring luchtverontreiniging trekkers en motoren voor mobiele
      machines.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel15
