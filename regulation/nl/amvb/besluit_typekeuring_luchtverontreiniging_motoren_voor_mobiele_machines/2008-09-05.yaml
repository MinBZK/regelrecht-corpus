  - number: '4'
    text: |-
      1 De in de [artikelen 2][ref1] en [3][ref2] gestelde verboden zijn niet van toepassing indien de handelingen
      geschieden met het oog op uitvoer van motoren naar gebieden waarop de Overeenkomst betreffende de Europese
      Economische Ruimte niet van toepassing is.

      2 De in de [artikelen 2][ref3] en [3][ref4] gestelde verboden zijn voorts niet van toepassing ten aanzien van
      motoren:

      a. voor gebruik door het leger;

      b. die zich nog in een stadium van beproeving of onderzoek bevinden;

      c. die uitsluitend bestemd zijn om te worden tentoongesteld of aan overeenkomstige manifestaties deel te nemen; of

      d. die dienen als monster voor een ingevolge dit besluit te verrichten keuring.

      3 Het in [artikel 2][ref5] gestelde verbod is voorts niet van toepassing ten aanzien van ruilmotoren voor in
      gebruik zijnde trekkers die voor de inwerkingtreding van dit besluit in de handel zijn gebracht.

      4 Het in [artikel 3][ref6] gestelde verbod is voorts niet van toepassing ten aanzien van motoren:

      a. die voornamelijk zijn bestemd voor het te water laten en binnenhalen van reddingsboten;

      b. die voornamelijk zijn bestemd voor het binnenhalen van vanaf het strand te water gelaten boten.

      5 De ruilmotor van een mobiele machine of een trekker voldoet aan de grenswaarden waaraan de vervangen motor moest
      voldoen op het tijdstip dat deze in de handel werd gebracht.

      6 Het vijfde lid is niet van toepassing ten aanzien van motoren bestemd om te worden gemonteerd in dan wel
      gemonteerd in spoorvoertuigen en binnenschepen.


