  - number: '2'
    text: |-
      Het is verboden een trekker of een motor bestemd voor het aandrijven van een trekker te vervaardigen, in te voeren,
      in voorraad te hebben of af te leveren indien deze niet behoort tot een type dat wat betreft luchtverontreiniging:

      a. hetzij is goedgekeurd ingevolge een typegoedkeuring door de keuringsinstantie, verricht aan de hand van de
      krachtens [artikel 5, derde lid][ref1], vastgestelde voorschriften;

      b. hetzij blijkens een goedkeuringscertificaat als bedoeld in [richtlijn 2000/25](32000L0025) is goedgekeurd;

      c. hetzij is goedgekeurd op grond van een typegoedkeuring die ingevolge [richtlijn 2000/25](32000L0025) ten minste
      een gelijkwaardig beschermingsniveau biedt.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel5
