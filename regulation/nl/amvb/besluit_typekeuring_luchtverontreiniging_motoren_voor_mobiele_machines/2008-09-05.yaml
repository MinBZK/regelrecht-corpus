preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 13 september
    2000, nr. MJZ2000108272, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan in overeenstemming met Onze
    Minister van Verkeer en Waterstaat en Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op de richtlijn nr. 97/68/EG van het Europees Parlement en de Raad van de Europese Unie van 16 december 1997
    betreffende de onderlinge aanpassing van de wetgevingen van de lidstaten inzake maatregelen tegen de uitstoot van
    verontreinigende gassen en deeltjes door inwendige verbrandingsmotoren die worden gemonteerd in niet voor de weg
    bestemde mobiele machines (PbEG 1998, L 59), op richtlijn nr. 2000/25/EG van het Europees Parlement en de Raad
    van de Europese Unie van 22 mei 2000 (PbEG L 173) inzake maatregelen tegen de uitstoot van verontreinigende gassen
    en deeltjes door motoren bestemd voor het aandrijven van landbouw- of bosbouwtrekkers en houdende wijziging van
    Richtlijn 74/150/EEG van de Raad en op de artikelen 13, 15 en 17 van de Wet inzake de luchtverontreiniging;

    De Raad van State gehoord (advies van 3 november 2000, nr. W08.00.0431/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    16 januari 2001, nr. MJZ20010026174, Centrale Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht in
    overeenstemming met Onze Minister van Verkeer en Waterstaat en Onze Minister van Landbouw, Natuurbeheer en
    Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop rustende bepalingen wordt verstaan onder:

      a. [richtlijn 97/68](31997L0068): [richtlijn nr. 97/68/EG](31997L0068) van het Europees Parlement en de Raad van de
      Europese Unie van 16 december 1997 betreffende de onderlinge aanpassing van de wetgevingen van de lidstaten inzake
      maatregelen tegen de uitstoot van verontreinigende gassen en deeltjes door inwendige verbrandingsmotoren die worden
      gemonteerd in niet voor de weg bestemde mobiele machines (PbEG 1998, L 59);

      b. [richtlijn 2000/25](32000L0025): [richtlijn nr. 2000/25/EG](32000L0025) van het Europees Parlement en de Raad
      van de Europese Unie van 22 mei 2000 (PbEG L 173) inzake maatregelen tegen de uitstoot van verontreinigende gassen
      en deeltjes door motoren bestemd voor het aandrijven van landbouw- of bosbouwtrekkers en houdende wijziging van
      [Richtlijn 74/150/EEG](31974L0150) van de Raad;

      c. Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      d. fabrikant: persoon of organisatie die tegenover de keuringsinstantie verantwoordelijk is voor alle aspecten van
      de goedkeuringsprocedure en zich garant stelt voor de overeenstemming van de productie met het goedgekeurde type;

      e. keuringsinstantie: een door Onze Minister aangewezen keuringsinstantie;

      f. mobiele machine: mobiel werktuig, vervoerbare industriële uitrusting of voertuig met of zonder carrosserie,
      niet bestemd voor personen- of goederenvervoer over de weg als bedoeld in bijlage I, deel 1, van [richtlijn 97/68]
      (31997L0068);

      g. motor bestemd om te worden gemonteerd in een mobiele machine dan wel gemonteerd in een mobiele machine:
      een verbrandingsmotor als bedoeld in bijlage I, deel 1, van [richtlijn 97/68](31997L0068) bestemd om te worden
      gemonteerd in een mobiele machine dan wel gemonteerd in een mobiele machine;

      h. trekker: een voertuig als bedoeld in artikel 1, eerste lid, van [richtlijn nr. 74/150/EEG](31974L0150) van de
      Raad van de Europese Gemeenschappen van 4 maart 1974 inzake de onderlinge aanpassing van de wetgevingen van de
      lidstaten betreffende de goedkeuring van landbouw- of bosbouwtrekkers op wielen (PbEG L 84);

      i. motor bestemd voor het aandrijven van een trekker: een verbrandingsmotor als bedoeld in bijlage I van [richtlijn
      2000/25](32000L0025) bestemd voor het aandrijven van een trekker;

      j. motor:

      1°. verbrandingsmotor bestemd om te worden gemonteerd in een mobiele machine dan wel gemonteerd in een mobiele
      machine;

      2°. verbrandingsmotor bestemd voor het aandrijven van een trekker, en

      3°. secundaire verbrandingsmotor gemonteerd in een voertuig bestemd voor personen- of goederenvervoer over de weg;

      k. secundaire motor bestemd om te worden gemonteerd in een voertuig bestemd voor personen- of goederenvervoer over
      de weg: secundaire verbrandingsmotor als bedoeld in bijlage I, deel 1, van [richtlijn 97/68](31997L0068);

      l. binnenschip: binnenschip als bedoeld in artikel 2, drieëntwintigste gedachtestreepje, van [richtlijn 97/68]
      (31997L0068);

      m. in de handel brengen: in de handel brengen als bedoeld in artikel 2, achtste gedachtestreepje, van [richtlijn
      97/68](31997L0068).

      n. spoorvoertuig: spoorvoertuig als bedoeld in [artikel 1, onderdeel e, van de Spoorwegwet][ref1];

      o. ruilmotor: nieuw gebouwde motor ter vervanging van een motor in een reeds in gebruik zijnde mobiele machine
      of trekker.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel1
