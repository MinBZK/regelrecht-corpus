  - number: '6'
    text: |-
      1 Degene aan wie de typegoedkeuring is verleend:

      a. brengt merktekens als bedoeld in [richtlijn 2000/25](32000L0025) aan op elke motor bestemd voor de aandrijving
      van een trekker die behoort tot het goedgekeurde type overeenkomstig de bij die richtlijn bepaalde voorschriften;

      b. brengt merktekens als bedoeld in [richtlijn 97/68](31997L0068) aan op elke motor bestemd om te worden
      gemonteerd in een mobiele machine dan wel gemonteerd in een mobiele machine die behoort tot het goedgekeurde type
      overeenkomstig de bij die richtlijn bepaalde voorschriften;

      c. brengt op een ruilmotor van een mobiele machine en een trekker of in de handleiding voor de mobiele machine en
      de trekker de vermelding «RUILMOTOR» aan;

      d. verschaft informatie aan degene die de motor inbouwt, indien de typegoedkeuring is verleend onder beperkingen
      als bedoeld in [artikel 5, tweede lid][ref1];

      e. verschaft, periodiek dan wel op verzoek, informatie aan de keuringsinstantie in verband met de in [richtlijn
      97/68](31997L0068) genoemde rapportageverplichtingen; en

      f. stelt de keuringsinstantie in kennis van wijziging van de gegevens die ten grondslag hebben gelegen aan het
      verlenen van een typegoedkeuring.

      2 Degene die een motor of een trekker invoert, vermeldt de typegoedkeuringsgegevens op de handelsbescheiden.

      3 Onze Minister kan nadere regels stellen ter uitvoering van het eerste en het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel5
