        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '8'
    text: |-
      1 De keuringsinstantie trekt een typegoedkeuring in indien degene aan wie deze is verleend daarom verzoekt.

      2 De keuringsinstantie kan een typegoedkeuring intrekken indien:

      a. degene aan wie de typegoedkeuring is verleend ten onrechte een motor of een trekker doet of laat doorgaan als
      behorende tot een goedgekeurd type;

      b. degene aan wie de goedkeuring is verleend in strijd handelt met de voorschriften, bedoeld in artikel 6 van dit
      besluit of met artikel 7, tweede lid;

      c. uit het toezicht, bedoeld in [artikel 7, eerste lid][ref1], blijkt dat een motor of een trekker niet
      overeenstemt met het type waarvoor de typegoedkeuring is verleend;

      d. de typegoedkeuring ten onrechte is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel7
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel8
