  - number: '9'
    text: |-
      Onze Minister, handelende in overeenstemming met Onze Ministers die het mede aangaat, kan de keuringsinstantie
      aanwijzingen geven van algemene aard omtrent de uitoefening van de aan de keuringsinstantie opgedragen taken.
      Indien als keuringsinstantie de Dienst Wegverkeer wordt aangewezen, worden de aanwijzingen gegeven door Onze
      Minister van Verkeer en Waterstaat in overeenstemming met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel9
  - number: '10'
    text: |-
      1 [Artikel 2][ref1] is van toepassing met ingang van:

      a. 1 juli 2001: voor trekkers en motoren bestemd voor het aandrijven van een trekker met een vermogen groter dan of
      gelijk aan 37 kW doch kleiner dan of gelijk aan 560 kW;

      b. 1 januari 2002: voor trekkers en motoren bestemd voor het aandrijven van een trekker met een vermogen groter dan
      of gelijk aan 18 kW doch kleiner dan 37 kW.

      2 Voor motoren bestemd om te worden gemonteerd in een mobiele machine dan wel gemonteerd in een mobiele machine met
      een vermogen groter dan of gelijk aan 18 kW doch kleiner dan 37 kW is [artikel 3][ref2] van toepassing met ingang
      van 1 januari 2001.

      3 Voor benzinemotoren met elektrische ontsteking bestemd om te worden gemonteerd in een mobiele machine dan wel
      gemonteerd in een mobiele machine met een vermogen van ten hoogste 19 kW is [artikel 3][ref3] van toepassing met
      ingang van 11 februari 2005.

      4 Voor motoren met een compressieontsteking, werkend met een constant toerental, bestemd om te worden gemonteerd in
      een mobiele machine dan wel gemonteerd in een mobiele machine met een vermogen groter dan of gelijk aan 19 kW doch
      kleiner dan of gelijk aan 560 kW, is [artikel 3][ref4] van toepassing met ingang van 1 januari 2007.

      5 Voor motoren met een compressieontsteking van de motorcategorieën V1:1, V1:2 en V1:3, bedoeld in artikel 9, derde
      lid sexies, van [richtlijn 97/68](31997L0068), is [artikel 3][ref5] van toepassing met ingang van 1 januari 2007.

      6 Voor motoren met een compressieontsteking van de motorcategorieën V1:4 en V2, bedoeld in artikel 9, derde lid
      sexies, van [richtlijn 97/68](31997L0068), is [artikel 3][ref6] van toepassing met ingang van 1 januari 2009.

      7 Voor motoren met een compressieontsteking van de motorcategorie RC A, bedoeld in artikel 9, derde lid septies,
      van [richtlijn 97/68](31997L0068), is [artikel 3][ref7] van toepassing met ingang van 1 januari 2006.

      8 Voor motoren met een compressieontsteking van de motorcategorie RL A, bedoeld in artikel 9, derde lid nonies, van
      [richtlijn 97/68](31997L0068), is [artikel 3][ref8] van toepassing met ingang van 1 januari 2007.

      9 Voor motoren met een compressieontsteking van de motorcategorie RH A, bedoeld in artikel 9, derde lid nonies, van
      [richtlijn 97/68](31997L0068), is [artikel 3][ref9] van toepassing met ingang van 1 januari 2009.

      10 Het vijfde en zesde lid zijn ook van toepassing op hulpmotoren van binnenschepen met een vermogen van meer dan
      560 kW.

      11 In afwijking van het in [artikel 3][ref10] gestelde verbod kunnen motoren als bedoeld in het vijfde tot en met
      zevende lid, die voor de in die leden genoemde data zijn geproduceerd, tot uiterlijk 24 maanden na die datum in de
      handel worden gebracht.

      12 In afwijking van het in [artikel 3][ref11] gestelde verbod kunnen motoren als bedoeld in het achtste en negende
      lid tot uiterlijk 24 maanden na de in die leden genoemde data in de handel worden gebracht, indien:

      a. de betreffende motoren voor de in die leden genoemde data zijn geproduceerd, of

      b. met betrekking tot de betreffende motoren of motorfamilies een koopcontract is afgesloten voor 20 mei 2004.

      13 In afwijking van het in [artikel 3][ref12] gestelde verbod kunnen motoren met compressieontsteking, met
      uitzondering van motoren voor de voortstuwing van spoorvoertuigen en binnenschepen, volgens de procedure, bedoeld
      in artikel 4, zesde lid, van [richtlijn 97/68](31997L0068), in de handel worden gebracht.

      14 Onverminderd de in de [artikelen 2][ref13] en [3][ref14] gestelde verboden, kunnen motoren als bedoeld in het
      eerste onderscheidenlijk tweede lid, die voor de in die leden genoemde data zijn geproduceerd tot uiterlijk twaalf
      maanden na die data voor de eerste maal in het verkeer worden gebracht.

      15 De keuringsinstantie kan op een overeenkomstig artikel 10, tweede lid, van [richtlijn 97/68](31997L0068)
      ingediend verzoek van de fabrikant toestaan dat gedurende twaalf maanden na de datum, waarop de geldigheidsduur
      van een goedkeuring als bedoeld in de [artikelen 2][ref15] en [3][ref16] is verstreken, motoren die voldoen aan de
      voorwaarden van artikel 10, tweede lid, van [richtlijn 97/68](31997L0068) in het verkeer worden gebracht.


