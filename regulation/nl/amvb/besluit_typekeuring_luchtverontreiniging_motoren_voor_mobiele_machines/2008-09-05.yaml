  - number: '5'
    text: |-
      1 Een aanvraag voor een typegoedkeuring als bedoeld in de
      [artikelen 2, aanhef en onder a, en 3, aanhef en onder a][ref1], wordt ingediend door de fabrikant bij de
      keuringsinstantie. Een aanvraag voor een typegoedkeuring mag niet in meer dan één lidstaat van de Europese Unie
      of een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte worden ingediend.
      Voor ieder goed te keuren motortype, motorfamilie of trekkertype wordt een afzonderlijke aanvraag ingediend
      overeenkomstig [richtlijn 97/68](31997L0068) of [richtlijn 2000/25](32000L0025).

      2 Een typegoedkeuring wordt slechts geweigerd indien een motor of trekker niet voldoet aan de krachtens het derde
      lid vastgestelde voorschriften. Indien de goed te keuren motor slechts functioneert dan wel een kenmerk slechts
      vertoont in combinatie met andere onderdelen van de trekker of de mobiele machine waarin deze is gemonteerd, wordt
      de typegoedkeuring dienovereenkomstig beperkt.

      3 Onze Minister stelt de voorschriften vast aan de hand waarvan de in de
      [artikelen 2, aanhef en onder a, en 3, aanhef en onder a][ref2], bedoelde typegoedkeuringen worden verricht. De
      voorschriften hebben betrekking op eigenschappen en onderdelen van motoren en trekkers, die bepalend zijn voor de
      door deze veroorzaakte luchtverontreiniging en bevatten mede een omschrijving van het keuringsproces.

      4 In geval van wijziging van de keuringsvoorschriften die ten grondslag hebben gelegen aan de
      typegoedkeuringen, bedoeld in het eerste lid of aan een goedkeuringscertificaat als bedoeld in de
      [artikelen 2, aanhef en onder b, en 3, aanhef en onder b][ref3], kan Onze Minister een termijn stellen bij het
      verstrijken waarvan die typegoedkeuring zijn geldigheid verliest.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012169#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012169#Artikel2
