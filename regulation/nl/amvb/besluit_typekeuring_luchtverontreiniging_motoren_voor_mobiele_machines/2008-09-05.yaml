  - number: '7'
    text: |-
      1 De keuringsinstantie houdt toezicht op het overeenstemmen van motoren en trekkers met het type waarvoor een
      typegoedkeuring is verleend als bedoeld in de [artikelen 2][ref1] en [3][ref2]. Tot dit toezicht kan behoren het
      steekproefsgewijs keuren van motoren, het periodiek controleren van de organisatie van de fabrikant alsmede het
      proces volgens hetwelk hij zijn werkzaamheden verricht.

      2 Degene aan wie de goedkeuring is verleend, is gehouden de nodige medewerking te verlenen aan de werkzaamheden die
      verband houden met het in het eerste lid bedoelde toezicht.

      3 Onze Minister kan nadere regels stellen ter uitvoering van het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel7
    references:
