---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_typekeuring_luchtverontreiniging_motoren_voor_mobiele_machines
regulatory_layer: AMVB
publication_date: '2018-06-28'
valid_from: '2008-09-05'
bwb_id: BWBR0012169
url: https://wetten.overheid.nl/BWBR0012169/2008-09-05
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 13 september
    2000, nr. MJZ2000108272, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan in overeenstemming met Onze
    Minister van Verkeer en Waterstaat en Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op de richtlijn nr. 97/68/EG van het Europees Parlement en de Raad van de Europese Unie van 16 december 1997
    betreffende de onderlinge aanpassing van de wetgevingen van de lidstaten inzake maatregelen tegen de uitstoot van
    verontreinigende gassen en deeltjes door inwendige verbrandingsmotoren die worden gemonteerd in niet voor de weg
    bestemde mobiele machines (PbEG 1998, L 59), op richtlijn nr. 2000/25/EG van het Europees Parlement en de Raad
    van de Europese Unie van 22 mei 2000 (PbEG L 173) inzake maatregelen tegen de uitstoot van verontreinigende gassen
    en deeltjes door motoren bestemd voor het aandrijven van landbouw- of bosbouwtrekkers en houdende wijziging van
    Richtlijn 74/150/EEG van de Raad en op de artikelen 13, 15 en 17 van de Wet inzake de luchtverontreiniging;

    De Raad van State gehoord (advies van 3 november 2000, nr. W08.00.0431/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    16 januari 2001, nr. MJZ20010026174, Centrale Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht in
    overeenstemming met Onze Minister van Verkeer en Waterstaat en Onze Minister van Landbouw, Natuurbeheer en
    Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop rustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.a
    text: |-
      [richtlijn 97/68](31997L0068): [richtlijn nr. 97/68/EG](31997L0068) van het Europees Parlement en de Raad van de
      Europese Unie van 16 december 1997 betreffende de onderlinge aanpassing van de wetgevingen van de lidstaten inzake
      maatregelen tegen de uitstoot van verontreinigende gassen en deeltjes door inwendige verbrandingsmotoren die worden
      gemonteerd in niet voor de weg bestemde mobiele machines (PbEG 1998, L 59);
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.b
    text: |-
      [richtlijn 2000/25](32000L0025): [richtlijn nr. 2000/25/EG](32000L0025) van het Europees Parlement en de Raad van
      de Europese Unie van 22 mei 2000 (PbEG L 173) inzake maatregelen tegen de uitstoot van verontreinigende gassen
      en deeltjes door motoren bestemd voor het aandrijven van landbouw- of bosbouwtrekkers en houdende wijziging van
      [Richtlijn 74/150/EEG](31974L0150) van de Raad;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.c
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.d
    text: |-
      fabrikant: persoon of organisatie die tegenover de keuringsinstantie verantwoordelijk is voor alle aspecten van de
      goedkeuringsprocedure en zich garant stelt voor de overeenstemming van de productie met het goedgekeurde type;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.e
    text: 'keuringsinstantie: een door Onze Minister aangewezen keuringsinstantie;'
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.f
    text: |-
      mobiele machine: mobiel werktuig, vervoerbare industriële uitrusting of voertuig met of zonder carrosserie, niet
      bestemd voor personen- of goederenvervoer over de weg als bedoeld in bijlage I, deel 1, van [richtlijn 97/68]
      (31997L0068);
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.g
    text: |-
      motor bestemd om te worden gemonteerd in een mobiele machine dan wel gemonteerd in een mobiele machine: een
      verbrandingsmotor als bedoeld in bijlage I, deel 1, van [richtlijn 97/68](31997L0068) bestemd om te worden
      gemonteerd in een mobiele machine dan wel gemonteerd in een mobiele machine;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.h
    text: |-
      trekker: een voertuig als bedoeld in artikel 1, eerste lid, van [richtlijn nr. 74/150/EEG](31974L0150) van de Raad
      van de Europese Gemeenschappen van 4 maart 1974 inzake de onderlinge aanpassing van de wetgevingen van de lidstaten
      betreffende de goedkeuring van landbouw- of bosbouwtrekkers op wielen (PbEG L 84);
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.i
    text: |-
      motor bestemd voor het aandrijven van een trekker: een verbrandingsmotor als bedoeld in bijlage I van [richtlijn
      2000/25](32000L0025) bestemd voor het aandrijven van een trekker;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.j
    text: 'motor:'
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.j.1°
    text: verbrandingsmotor bestemd om te worden gemonteerd in een mobiele machine dan wel gemonteerd in een mobiele machine;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.j.2°
    text: verbrandingsmotor bestemd voor het aandrijven van een trekker, en
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.j.3°
    text: secundaire verbrandingsmotor gemonteerd in een voertuig bestemd voor personen- of goederenvervoer over de weg;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.k
    text: |-
      secundaire motor bestemd om te worden gemonteerd in een voertuig bestemd voor personen- of goederenvervoer over de
      weg: secundaire verbrandingsmotor als bedoeld in bijlage I, deel 1, van [richtlijn 97/68](31997L0068);
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.l
    text: |-
      binnenschip: binnenschip als bedoeld in artikel 2, drieëntwintigste gedachtestreepje, van [richtlijn 97/68]
      (31997L0068);
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.m
    text: |-
      in de handel brengen: in de handel brengen als bedoeld in artikel 2, achtste gedachtestreepje, van [richtlijn
      97/68](31997L0068).
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: 1.n
    text: |-
      spoorvoertuig: spoorvoertuig als bedoeld in [artikel 1, onderdeel e, van de Spoorwegwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel1
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '1'
  - number: 1.o
    text: |-
      ruilmotor: nieuw gebouwde motor ter vervanging van een motor in een reeds in gebruik zijnde mobiele machine of
      trekker.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel1
  - number: '2'
    text: |-
      Het is verboden een trekker of een motor bestemd voor het aandrijven van een trekker te vervaardigen, in te voeren,
      in voorraad te hebben of af te leveren indien deze niet behoort tot een type dat wat betreft luchtverontreiniging:
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel2
  - number: 2.a
    text: |-
      hetzij is goedgekeurd ingevolge een typegoedkeuring door de keuringsinstantie, verricht aan de hand van de
      krachtens [artikel 5, derde lid][ref1], vastgestelde voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel5
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '5'
  - number: 2.b
    text: hetzij blijkens een goedkeuringscertificaat als bedoeld in [richtlijn 2000/25](32000L0025) is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel2
  - number: 2.c
    text: |-
      hetzij is goedgekeurd op grond van een typegoedkeuring die ingevolge [richtlijn 2000/25](32000L0025) ten minste een
      gelijkwaardig beschermingsniveau biedt.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel2
  - number: '3'
    text: |-
      Het is verboden een motor bestemd om te worden gemonteerd in een mobiele machine dan wel gemonteerd in een
      mobiele machine of een secundaire motor bestemd om te worden gemonteerd in een voertuig bestemd voor personen- of
      goederenvervoer over de weg te vervaardigen, in te voeren, in voorraad te hebben of af te leveren indien deze niet
      behoort tot een type dat wat betreft luchtverontreiniging:
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel3
  - number: 3.a
    text: |-
      hetzij is goedgekeurd ingevolge een typegoedkeuring door de keuringsinstantie, verricht aan de hand van de
      krachtens [artikel 5, derde lid][ref1], vastgestelde voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel5
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '5'
  - number: 3.b
    text: hetzij blijkens een goedkeuringscertificaat als bedoeld in [richtlijn 97/68](31997L0068) is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel3
  - number: 3.c
    text: |-
      hetzij is goedgekeurd op grond van een typegoedkeuring die ingevolge [richtlijn 97/68](31997L0068) ten minste een
      gelijkwaardig beschermingsniveau biedt.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel3
  - number: '4.1'
    text: |-
      De in de [artikelen 2][ref1] en [3][ref2] gestelde verboden zijn niet van toepassing indien de handelingen
      geschieden met het oog op uitvoer van motoren naar gebieden waarop de Overeenkomst betreffende de Europese
      Economische Ruimte niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '4.2'
    text: |-
      De in de [artikelen 2][ref1] en [3][ref2] gestelde verboden zijn voorts niet van toepassing ten aanzien van
      motoren:


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012169
        artikel: '3'
  - number: 4.2.a
    text: voor gebruik door het leger;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel4
  - number: 4.2.b
    text: die zich nog in een stadium van beproeving of onderzoek bevinden;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel4
  - number: 4.2.c
    text: die uitsluitend bestemd zijn om te worden tentoongesteld of aan overeenkomstige manifestaties deel te nemen; of
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel4
  - number: 4.2.d
    text: die dienen als monster voor een ingevolge dit besluit te verrichten keuring.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel4
  - number: '4.3'
    text: |-
      Het in [artikel 2][ref1] gestelde verbod is voorts niet van toepassing ten aanzien van ruilmotoren voor in gebruik
      zijnde trekkers die voor de inwerkingtreding van dit besluit in de handel zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel2
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '2'
  - number: '4.4'
    text: |-
      Het in [artikel 3][ref1] gestelde verbod is voorts niet van toepassing ten aanzien van motoren:


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: 4.4.a
    text: die voornamelijk zijn bestemd voor het te water laten en binnenhalen van reddingsboten;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel4
  - number: 4.4.b
    text: die voornamelijk zijn bestemd voor het binnenhalen van vanaf het strand te water gelaten boten.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel4
  - number: '4.5'
    text: |-
      De ruilmotor van een mobiele machine of een trekker voldoet aan de grenswaarden waaraan de vervangen motor moest
      voldoen op het tijdstip dat deze in de handel werd gebracht.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel4
  - number: '4.6'
    text: |-
      Het vijfde lid is niet van toepassing ten aanzien van motoren bestemd om te worden gemonteerd in dan wel gemonteerd
      in spoorvoertuigen en binnenschepen.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel4
  - number: '5.1'
    text: |-
      Een aanvraag voor een typegoedkeuring als bedoeld in de
      [artikelen 2, aanhef en onder a, en 3, aanhef en onder a][ref1], wordt ingediend door de fabrikant bij de
      keuringsinstantie. Een aanvraag voor een typegoedkeuring mag niet in meer dan één lidstaat van de Europese Unie
      of een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte worden ingediend.
      Voor ieder goed te keuren motortype, motorfamilie of trekkertype wordt een afzonderlijke aanvraag ingediend
      overeenkomstig [richtlijn 97/68](31997L0068) of [richtlijn 2000/25](32000L0025).


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel2
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '2'
  - number: '5.2'
    text: |-
      Een typegoedkeuring wordt slechts geweigerd indien een motor of trekker niet voldoet aan de krachtens het derde
      lid vastgestelde voorschriften. Indien de goed te keuren motor slechts functioneert dan wel een kenmerk slechts
      vertoont in combinatie met andere onderdelen van de trekker of de mobiele machine waarin deze is gemonteerd, wordt
      de typegoedkeuring dienovereenkomstig beperkt.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister stelt de voorschriften vast aan de hand waarvan de in de
      [artikelen 2, aanhef en onder a, en 3, aanhef en onder a][ref1], bedoelde typegoedkeuringen worden verricht. De
      voorschriften hebben betrekking op eigenschappen en onderdelen van motoren en trekkers, die bepalend zijn voor de
      door deze veroorzaakte luchtverontreiniging en bevatten mede een omschrijving van het keuringsproces.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel2
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '2'
  - number: '5.4'
    text: |-
      In geval van wijziging van de keuringsvoorschriften die ten grondslag hebben gelegen aan de
      typegoedkeuringen, bedoeld in het eerste lid of aan een goedkeuringscertificaat als bedoeld in de
      [artikelen 2, aanhef en onder b, en 3, aanhef en onder b][ref1], kan Onze Minister een termijn stellen bij het
      verstrijken waarvan die typegoedkeuring zijn geldigheid verliest.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel2
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '2'
  - number: '6.1'
    text: 'Degene aan wie de typegoedkeuring is verleend:'
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel6
  - number: 6.1.a
    text: |-
      brengt merktekens als bedoeld in [richtlijn 2000/25](32000L0025) aan op elke motor bestemd voor de aandrijving van
      een trekker die behoort tot het goedgekeurde type overeenkomstig de bij die richtlijn bepaalde voorschriften;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel6
  - number: 6.1.b
    text: |-
      brengt merktekens als bedoeld in [richtlijn 97/68](31997L0068) aan op elke motor bestemd om te worden gemonteerd in
      een mobiele machine dan wel gemonteerd in een mobiele machine die behoort tot het goedgekeurde type overeenkomstig
      de bij die richtlijn bepaalde voorschriften;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel6
  - number: 6.1.c
    text: |-
      brengt op een ruilmotor van een mobiele machine en een trekker of in de handleiding voor de mobiele machine en de
      trekker de vermelding «RUILMOTOR» aan;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel6
  - number: 6.1.d
    text: |-
      verschaft informatie aan degene die de motor inbouwt, indien de typegoedkeuring is verleend onder beperkingen als
      bedoeld in [artikel 5, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel5
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '5'
  - number: 6.1.e
    text: |-
      verschaft, periodiek dan wel op verzoek, informatie aan de keuringsinstantie in verband met de in [richtlijn 97/68]
      (31997L0068) genoemde rapportageverplichtingen; en
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel6
  - number: 6.1.f
    text: |-
      stelt de keuringsinstantie in kennis van wijziging van de gegevens die ten grondslag hebben gelegen aan het
      verlenen van een typegoedkeuring.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel6
  - number: '6.2'
    text: Degene die een motor of een trekker invoert, vermeldt de typegoedkeuringsgegevens op de handelsbescheiden.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel6
  - number: '6.3'
    text: Onze Minister kan nadere regels stellen ter uitvoering van het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel6
  - number: '7.1'
    text: |-
      De keuringsinstantie houdt toezicht op het overeenstemmen van motoren en trekkers met het type waarvoor een
      typegoedkeuring is verleend als bedoeld in de [artikelen 2][ref1] en [3][ref2]. Tot dit toezicht kan behoren het
      steekproefsgewijs keuren van motoren, het periodiek controleren van de organisatie van de fabrikant alsmede het
      proces volgens hetwelk hij zijn werkzaamheden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '7.2'
    text: |-
      Degene aan wie de goedkeuring is verleend, is gehouden de nodige medewerking te verlenen aan de werkzaamheden die
      verband houden met het in het eerste lid bedoelde toezicht.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel7
  - number: '7.3'
    text: Onze Minister kan nadere regels stellen ter uitvoering van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel7
  - number: '8.1'
    text: De keuringsinstantie trekt een typegoedkeuring in indien degene aan wie deze is verleend daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel8
  - number: '8.2'
    text: 'De keuringsinstantie kan een typegoedkeuring intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel8
  - number: 8.2.a
    text: |-
      degene aan wie de typegoedkeuring is verleend ten onrechte een motor of een trekker doet of laat doorgaan als
      behorende tot een goedgekeurd type;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel8
  - number: 8.2.b
    text: |-
      degene aan wie de goedkeuring is verleend in strijd handelt met de voorschriften, bedoeld in artikel 6 van dit
      besluit of met artikel 7, tweede lid;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel8
  - number: 8.2.c
    text: |-
      uit het toezicht, bedoeld in [artikel 7, eerste lid][ref1], blijkt dat een motor of een trekker niet overeenstemt
      met het type waarvoor de typegoedkeuring is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel7
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '7'
  - number: 8.2.d
    text: de typegoedkeuring ten onrechte is verleend.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel8
  - number: '9'
    text: |-
      Onze Minister, handelende in overeenstemming met Onze Ministers die het mede aangaat, kan de keuringsinstantie
      aanwijzingen geven van algemene aard omtrent de uitoefening van de aan de keuringsinstantie opgedragen taken.
      Indien als keuringsinstantie de Dienst Wegverkeer wordt aangewezen, worden de aanwijzingen gegeven door Onze
      Minister van Verkeer en Waterstaat in overeenstemming met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel9
  - number: '10.1'
    text: |-
      [Artikel 2][ref1] is van toepassing met ingang van:


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel2
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '2'
  - number: 10.1.a
    text: |-
      1 juli 2001: voor trekkers en motoren bestemd voor het aandrijven van een trekker met een vermogen groter dan of
      gelijk aan 37 kW doch kleiner dan of gelijk aan 560 kW;
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
  - number: 10.1.b
    text: |-
      1 januari 2002: voor trekkers en motoren bestemd voor het aandrijven van een trekker met een vermogen groter dan of
      gelijk aan 18 kW doch kleiner dan 37 kW.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
  - number: '10.2'
    text: |-
      Voor motoren bestemd om te worden gemonteerd in een mobiele machine dan wel gemonteerd in een mobiele machine met
      een vermogen groter dan of gelijk aan 18 kW doch kleiner dan 37 kW is [artikel 3][ref1] van toepassing met ingang
      van 1 januari 2001.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '10.3'
    text: |-
      Voor benzinemotoren met elektrische ontsteking bestemd om te worden gemonteerd in een mobiele machine dan wel
      gemonteerd in een mobiele machine met een vermogen van ten hoogste 19 kW is [artikel 3][ref1] van toepassing met
      ingang van 11 februari 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '10.4'
    text: |-
      Voor motoren met een compressieontsteking, werkend met een constant toerental, bestemd om te worden gemonteerd in
      een mobiele machine dan wel gemonteerd in een mobiele machine met een vermogen groter dan of gelijk aan 19 kW doch
      kleiner dan of gelijk aan 560 kW, is [artikel 3][ref1] van toepassing met ingang van 1 januari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '10.5'
    text: |-
      Voor motoren met een compressieontsteking van de motorcategorieën V1:1, V1:2 en V1:3, bedoeld in artikel 9, derde
      lid sexies, van [richtlijn 97/68](31997L0068), is [artikel 3][ref1] van toepassing met ingang van 1 januari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '10.6'
    text: |-
      Voor motoren met een compressieontsteking van de motorcategorieën V1:4 en V2, bedoeld in artikel 9, derde lid
      sexies, van [richtlijn 97/68](31997L0068), is [artikel 3][ref1] van toepassing met ingang van 1 januari 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '10.7'
    text: |-
      Voor motoren met een compressieontsteking van de motorcategorie RC A, bedoeld in artikel 9, derde lid septies, van
      [richtlijn 97/68](31997L0068), is [artikel 3][ref1] van toepassing met ingang van 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '10.8'
    text: |-
      Voor motoren met een compressieontsteking van de motorcategorie RL A, bedoeld in artikel 9, derde lid nonies, van
      [richtlijn 97/68](31997L0068), is [artikel 3][ref1] van toepassing met ingang van 1 januari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '10.9'
    text: |-
      Voor motoren met een compressieontsteking van de motorcategorie RH A, bedoeld in artikel 9, derde lid nonies, van
      [richtlijn 97/68](31997L0068), is [artikel 3][ref1] van toepassing met ingang van 1 januari 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '10.10'
    text: |-
      Het vijfde en zesde lid zijn ook van toepassing op hulpmotoren van binnenschepen met een vermogen van meer dan
      560 kW.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
  - number: '10.11'
    text: |-
      In afwijking van het in [artikel 3][ref1] gestelde verbod kunnen motoren als bedoeld in het vijfde tot en met
      zevende lid, die voor de in die leden genoemde data zijn geproduceerd, tot uiterlijk 24 maanden na die datum in de
      handel worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '10.12'
    text: |-
      In afwijking van het in [artikel 3][ref1] gestelde verbod kunnen motoren als bedoeld in het achtste en negende lid
      tot uiterlijk 24 maanden na de in die leden genoemde data in de handel worden gebracht, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: 10.12.a
    text: de betreffende motoren voor de in die leden genoemde data zijn geproduceerd, of
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
  - number: 10.12.b
    text: met betrekking tot de betreffende motoren of motorfamilies een koopcontract is afgesloten voor 20 mei 2004.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
  - number: '10.13'
    text: |-
      In afwijking van het in [artikel 3][ref1] gestelde verbod kunnen motoren met compressieontsteking, met uitzondering
      van motoren voor de voortstuwing van spoorvoertuigen en binnenschepen, volgens de procedure, bedoeld in artikel 4,
      zesde lid, van [richtlijn 97/68](31997L0068), in de handel worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '10.14'
    text: |-
      Onverminderd de in de [artikelen 2][ref1] en [3][ref2] gestelde verboden, kunnen motoren als bedoeld in het eerste
      onderscheidenlijk tweede lid, die voor de in die leden genoemde data zijn geproduceerd tot uiterlijk twaalf maanden
      na die data voor de eerste maal in het verkeer worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '10.15'
    text: |-
      De keuringsinstantie kan op een overeenkomstig artikel 10, tweede lid, van [richtlijn 97/68](31997L0068) ingediend
      verzoek van de fabrikant toestaan dat gedurende twaalf maanden na de datum, waarop de geldigheidsduur van
      een goedkeuring als bedoeld in de [artikelen 2][ref1] en [3][ref2] is verstreken, motoren die voldoen aan de
      voorwaarden van artikel 10, tweede lid, van [richtlijn 97/68](31997L0068) in het verkeer worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012169#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012169#Artikel3
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012169
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012169
        artikel: '3'
  - number: '11'
    text: |-
      Een wijziging van [richtlijn 97/68](31997L0068) of van [richtlijn 2000/25](32000L0025) gaat voor de toepassing
      van dit besluit gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn
      gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekend gemaakt, een ander tijdstip wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel11
  - number: '12'
    text: Het Besluit typekeuring luchtverontreiniging motoren voor mobiele machines wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel12
  - number: '13.1'
    text: |-
      Goedkeuringen van de Dienst Wegverkeer voor motoren bestemd om te worden gemonteerd in een mobiele machine dan wel
      gemonteerd in een mobiele machine verleend vóór het tijdstip van inwerkingtreding van dit besluit, die voldoen aan
      [richtlijn 97/68](31997L0068), worden aangemerkt als goedkeuringen die zijn verleend op grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel13
  - number: '13.2'
    text: |-
      Goedkeuringen van de Dienst Wegverkeer voor trekkers of motoren bestemd voor het aandrijven van een trekker
      verleend vóór het tijdstip van inwerkingtreding van dit besluit, die voldoen aan [richtlijn 2000/25](32000L0025),
      worden aangemerkt als goedkeuringen die zijn verleend op grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel13
  - number: '14'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel14
  - number: '15'
    text: |-
      Dit besluit wordt aangehaald als: Besluit typekeuring luchtverontreiniging trekkers en motoren voor mobiele
      machines.
    url: https://wetten.overheid.nl/BWBR0012169/2008-09-05#Artikel15
