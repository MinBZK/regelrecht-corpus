  - number: '62'
    text: |-
      1 Een geconsolideerde begroting, onderscheidenlijk een geconsolideerde meerjarenraming, is een begroting,
      onderscheidenlijk een meerjarenraming, waarin de baten en de lasten van de organisatie en van één of meer
      deelnemingen, bedoeld in [artikel 39, tweede lid][ref1], als één geheel worden opgenomen.

      2 Een geconsolideerde begroting, onderscheidenlijk een geconsolideerde meerjarenraming vormt een onderdeel van de
      toelichting op onderscheidenlijk de begroting en de meerjarenraming.


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel39
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006654
        artikel: '39'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '63'
    text: |-
      1 Een geconsolideerde jaarrekening is een jaarrekening waarin de activa, de passiva, de baten en de lasten van
      de organisatie en van één of meer deelnemingen, bedoeld in [artikel 39, tweede lid][ref1], als één geheel worden
      opgenomen.

      2 Een geconsolideerde jaarrekening is onderdeel van het verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel39
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0006654
        artikel: '39'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '64'
    text: >-
      Indien tot consolidatie wordt overgegaan, worden in de toelichtingen op de begroting en op de meerjarenraming
      onderscheidenlijk in het verslag opgenomen:


      a. de grondslagen van de consolidatie;


      b. de derde-rechtspersonen die in de consolidatie zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel64
  - number: '66'
    text: |-
      1 In afwijking van [artikel 4][ref1] kunnen de lasten wegens rente van door de gemeenten vóór 1 januari 1985
      opgenomen langlopende geldleningen in het begrotingsjaar worden verantwoord overeenkomstig de bedragen die op de
      onderscheidene vervaldata van die leningen in het desbetreffende begrotingsjaar verschuldigd onderscheidenlijk
      opvorderbaar worden.

      2 In afwijking van [artikel 4][ref2] kunnen de lasten wegens rente van door de provincies vóór 1 januari 1995
      opgenomen langlopende geldleningen in het begrotingsjaar worden verantwoord overeenkomstig de bedragen die op de
      onderscheidene vervaldata van die leningen in het desbetreffende begrotingsjaar verschuldigd onderscheidenlijk
      opvorderbaar worden.


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel4
