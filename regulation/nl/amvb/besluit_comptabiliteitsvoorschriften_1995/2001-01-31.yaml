  - number: 20a
    text: |-
      De financieringsparagraaf, bedoeld in [artikel 14, onderdeel i][ref1], bevat in ieder geval de beleidsvoornemens
      ten aanzien van het risicobeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel14
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0006654
        artikel: '14'
        hoofdstuk: IV
  - number: '21'
    text: >-
      De meerjarenraming en de toelichting geven voor elk jaar duidelijk en stelselmatig de omvang van de geraamde baten
      en lasten, alsmede het saldo daarvan weer.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel21
  - number: '22'
    text: >-
      1 In de meerjarenraming worden ten minste tot uitdrukking gebracht de financiële gevolgen van het beleid dat
      ten grondslag ligt aan de bedragen, opgenomen in de begroting, voor zover die gevolgen voor de periode van de
      meerjarenraming voorzienbaar zijn.


      2 De meerjarenraming biedt inzicht in de jaarlijkse kapitaallastenontwikkeling.


      3 De meerjarenraming biedt inzicht in de jaarlijkse ontwikkeling van de stand van de reserves.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel22
  - number: '23'
    text: >-
      1 De toelichting op de meerjarenraming bevat de gronden waarop de ramingen zijn gebaseerd en, in geval van
      aanmerkelijk verschil met de raming van het begrotingsjaar en tussen de ramingen van de opeenvolgende jaren, de
      oorzaken van het verschil.


      2 Bij de toepassing van het eerste lid wordt in het bijzonder aandacht besteed aan de gehanteerde percentages en
      aan de loon- en prijsniveaus.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel23
  - number: '24'
    text: De verslaglegging van de organisatie bestaat uit de jaarrekening en het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel24
  - number: '25'
    text: >-
      De jaarrekening bestaat uit:


      a. de rekening van baten en lasten en de toelichting daarop;


      b. een recapitulatie van de totaalbedragen per hoofdfunctie;


      c. een balans en de toelichting daarop.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel25
  - number: '26'
    text: |-
      De jaarrekening wordt vastgesteld met inachtneming van hetgeen omtrent de financiële positie op de balansdatum is
      gebleken tussen het moment van opmaken van de jaarrekening en het tijdstip van vaststelling daarvan, voor zover
      deze aanvullende informatie onontbeerlijk is voor het in [artikel 3][ref1] bedoelde inzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel3
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006654
        artikel: '3'
        hoofdstuk: II
  - number: 26a
    text: |-
      1 Het jaarverslag gaat in op de financiële positie op de balansdatum, de gang van zaken gedurende het
      begrotingsjaar van de organisatie en van de deelnemingen, waarvan de financiële gegevens in haar jaarrekening zijn
      opgenomen.

      2 Het jaarverslag geeft aan in hoeverre het beleid dat aan de begroting ten grondslag heeft gelegen, is
      gerealiseerd.

      3 Het jaarverslag besteedt aandacht aan de bestemming danwel dekking van het rekeningsaldo.

      4 Het jaarverslag bevat een financieringsparagraaf waarin informatie wordt gegeven over de realisatie
      van de beleidsvoornemens die zijn opgenomen in de financieringsparagraaf bij de begroting, bedoeld in
      [artikel 14, onderdeel i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel14
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0006654
        artikel: '14'
        hoofdstuk: IV
  - number: '27'
    text: >-
      De rekening van baten en lasten en de toelichting geven getrouw, duidelijk en stelselmatig de omvang van alle baten
      en alle lasten, alsmede het saldo daarvan weer.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel27
  - number: '28'
    text: >-
      1 In de rekening van baten en lasten worden per hoofdfunctie en per functie opgenomen het geraamde bedrag van het
      begrotingsjaar na wijziging, het gerealiseerde bedrag van het begrotingsjaar en het gerealiseerde bedrag van het
      vorige begrotingsjaar.


      2 In de rekening worden de baten en de lasten van de onderscheidene functies, alsmede de nadere splitsing daarvan,
      op dezelfde wijze gerangschikt als in de begroting zoals deze luidt na wijzigingen.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel28
  - number: '29'
    text: >-
      In de recapitulatie van de totaalbedragen worden per hoofdfunctie opgenomen de baten en de lasten, alsmede het
      nadelige of batige saldo.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel29
  - number: '30'
    text: >-
      1 Het saldo van de rekening van baten en lasten wordt afzonderlijk opgenomen in de balans.


      2 De bestemming van het saldo vindt plaats nadat de jaarrekening is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel30
  - number: '31'
    text: >-
      De toelichting bij de rekening van baten en lasten bevat ten minste:


      a. een analyse per functie van de afwijkingen tussen de begroting en de rekening;


      b. een toelichting per functie op de belangrijke afwijkingen tussen de rekening over het vorige begrotingsjaar en
      die van het begrotingsjaar;


      c. een kostenverdeelstaat;


      d. een overzicht kapitaallasten;


      e. een overzicht personele sterkte en personeelslasten;


      f. een verzamel- en consolidatiestaat.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel31
  - number: '32'
    text: |-
      [De artikelen 17][ref1] tot en met [20][ref2] zijn van toepassing op de toelichting bij de rekening met dien
      verstande dat [artikel 20, eerste lid, onder ][ref3], wordt vervangen door [artikel 40][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006654#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0006654#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0006654#Artikel40
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006654
        artikel: '17'
        hoofdstuk: IV
