preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken van 27 september 1993, nr. FO93/U 1991, directie
    Bestuurlijke en Financiële Organisatie, afdeling Financiële Organisatie Binnenlands Bestuur;


    Gelet op de artikelen 189, vierde lid, en 190 van de Provinciewet en de artikelen 185, vierde lid en 186 van de
    Gemeentewet;


    Gezien het advies van de commissie voor de provinciale en gemeentelijke comptabiliteitsvoorschriften (advies van 7
    september 1993, nr. GCV/YA/93/11);


    De Raad van State gehoord (advies van 21 februari 1994, nr. WO4.93.0642);


    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken van 22 april 1994, nr. FO94/425;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken;

      b. algemeen bestuur: provinciale staten, onderscheidenlijk de gemeenteraad;

      c. dagelijks bestuur: gedeputeerde staten, onderscheidenlijk het college van burgemeester en wethouders;

      d. organisatie: provincie, onderscheidenlijk gemeente;

      e. begroting: de begroting, bedoeld in [artikel 193, eerste lid, van de Provinciewet][ref1], onderscheidenlijk
      [artikel 189, eerste lid, van de Gemeentewet][ref2];

      f. jaarrekening: de rekening, bedoeld in [artikel 201, eerste lid, van de Provinciewet][ref3], onderscheidenlijk
      [artikel 197, eerste lid, van de Gemeentewet][ref4];

      g. jaarverslag: het jaarverslag, bedoeld in [artikel 201, eerste lid, van de Provinciewet][ref5], onderscheidenlijk
      [artikel 197, eerste lid, van de Gemeentewet][ref6];.

      h. hoofdfuncties en functies: zorggebieden, gerangschikt overeenkomstig de indeling, opgenomen in
      [bijlage 1][ref7], behorende bij dit besluit;

      i. subfunctie: een door het algemeen bestuur verbijzonderd onderdeel van een functie;

      j. categorieën: rubrieken van de indeling van baten en lasten en van balansmutaties naar soorten, ongeacht hun
      bestemming, zoals opgenomen in [bijlage 2][ref8] van dit besluit;

      k. kostenplaats: een organisatie-eenheid waarvan de lasten en de baten aan onderscheiden functies en aan relevante
      balansposten worden doorberekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel193
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel189
