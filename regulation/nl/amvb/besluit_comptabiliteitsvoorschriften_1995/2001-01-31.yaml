  - number: '68'
    text: >-
      De Provinciale comptabiliteitsvoorschriften 1979 en de Gemeentelijke comptabiliteitsvoorschriften worden
      ingetrokken, met dien verstande, dat zij van kracht blijven voor de begrotingen en de rekeningen over de aan 1995
      voorafgaande begrotingsjaren.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel68
