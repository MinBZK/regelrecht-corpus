  - number: '2'
    text: >-
      Onze Minister is bevoegd nadere regels te stellen voor de inrichting van de begroting, de meerjarenraming, de
      jaarrekening en het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel2
  - number: '3'
    text: >-
      De begroting, de meerjarenraming, de jaarrekening en de toelichtingen geven volgens normen die in het
      maatschappelijk verkeer als aanvaardbaar worden beschouwd, een zodanig inzicht dat een verantwoord oordeel kan
      worden gevormd over de financiële positie en over de baten en de lasten.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel3
  - number: '4'
    text: |-
      1 Voor de begroting, de meerjarenraming en de jaarrekening wordt het stelsel van baten en lasten gehanteerd.

      2 De baten en de lasten van het begrotingsjaar worden in de begroting en in de rekening opgenomen, onverschillig of
      zij tot inkomsten of uitgaven in dat jaar leiden, onderscheidenlijk hebben geleid.

      3 Als baten en lasten worden niet aangemerkt de neutrale uitgaven en inkomsten, gedefinieerd in [bijlage 3][ref1]
      bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006654
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006654
  - number: '5'
    text: >-
      1 Onverminderd het tweede lid worden alle baten en lasten geraamd, respectievelijk verantwoord tot hun brutobedrag.


      2 Terugbetalingen in hetzelfde begrotingsjaar op baten en van lasten worden in mindering gebracht op de functie en
      de categorie, waarop de oorspronkelijke boeking is opgenomen.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel5
  - number: '6'
    text: |-
      1 Alle baten en lasten worden ingedeeld naar de hoofdfuncties, de functies en de categorieën, gedefinieerd in
      [de bijlagen 1][ref1] en [2][ref2] bij dit besluit.

      2 De indeling naar categorieën, bedoeld in het eerste lid, is niet van toepassing voor de meerjarenraming.

      3 De bijlagen, genoemd in het eerste lid, kunnen bij regeling van Onze Minister worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006654
      [ref2]: https://wetten.overheid.nl/BWBR0006654
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006654
      - id: ref2
        bwb_id: BWBR0006654
  - number: '7'
    text: |-
      1 De onderscheidene functies worden zo ver gesplitst als nodig is ter verkrijging van een overzichtelijk beeld van
      het te voeren beleid.

      2 De bepaling van de baten en de lasten geschiedt voorts met inachtneming van de regels die in paragraaf 5 van
      [hoofdstuk VIII][ref1] worden gegeven voor de waardering.


      [ref1]: https://wetten.overheid.nl/BWBR0006654#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006654
        hoofdstuk: VIII
  - number: '8'
    text: >-
      1 Slechts om gegronde redenen mogen de waardering van de activa en de passiva en de bepaling van de baten en de
      lasten geschieden op andere grondslagen dan die welke in het voorafgaande begrotingsjaar zijn toegepast. De reden
      van de verandering wordt in de toelichting uiteengezet. Tevens wordt inzicht gegeven in haar betekenis voor de
      financiële positie en voor de baten en de lasten aan de hand van aangepaste cijfers voor het begrotingsjaar of voor
      het voorafgaande begrotingsjaar.


      2 De indeling van de begroting, de meerjarenraming en de jaarrekening mag slechts om gegronde redenen afwijken van
      die van het voorafgaande begrotingsjaar; in de toelichting worden de verschillen aangegeven en worden de redenen
      die tot de afwijking hebben geleid, uiteengezet.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel8
  - number: '9'
    text: >-
      De begroting en de toelichting geven duidelijk en stelselmatig de omvang van alle begrote baten en lasten van het
      begrotingsjaar, alsmede het saldo daarvan weer.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel9
  - number: '10'
    text: >-
      De begroting bestaat uit:


      a. een raming van de baten en de lasten;


      b. een recapitulatie van de totaalbedragen per hoofdfunctie.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel10
  - number: '11'
    text: >-
      In de raming van baten en lasten worden per hoofdfunctie en per functie opgenomen het gerealiseerde bedrag van het
      voorvorige begrotingsjaar, het geraamde bedrag van het vorige begrotingsjaar na wijziging en het geraamde bedrag
      van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel11
  - number: '12'
    text: >-
      In de recapitulatie van de totaalbedragen worden per hoofdfunctie opgenomen de baten en de lasten, alsmede het
      nadelige of batige saldo.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel12
  - number: '13'
    text: >-
      1 In de besluiten tot wijziging van de begroting worden per functie de verlaging, dan wel de verhoging, en het
      nieuwe geraamde bedrag genoemd.


      2 Overboekingen tussen functies zijn niet toegestaan.


      3 Het algemeen bestuur kan het dagelijks bestuur machtigen tot overschrijving van begrotingsbedragen tussen
      functies onder de volgende voorwaarden:


      a. overschrijvingen zijn alleen toegestaan indien deze passen binnen het vastgestelde beleid;


      b. overschrijvingen mogen het begrotingssaldo niet beïnvloeden;


      c. het algemeen bestuur wijst van te voren clusters van functies aan waarbinnen overschrijvingen mogen
      plaatsvinden;


      d. het algemeen bestuur bepaalt van te voren tot welk maximaal bedrag of percentage de overschrijvingen mogen
      geschieden.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel13
  - number: '14'
    text: >-
      De toelichting bij de begroting bevat ten minste:


      a. de gronden waarop de ramingen zijn gebaseerd en, in geval van aanmerkelijk verschil met de raming van het vorig
      begrotingsjaar, de oorzaken van het verschil;


      b. een uiteenzetting over de financiële positie van de organisatie;


      c. een risicoparagraaf;


      d. een investerings- en financieringsstaat;


      e. een kostenverdeelstaat;


      f. een overzicht kapitaallasten;


      g. een overzicht personele sterkte en personeelslasten;


      h. een verzamel- en consolidatiestaat;


      i. een financieringsparagraaf.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel14
  - number: '15'
    text: |-
      1 In de risicoparagraaf, genoemd in [artikel 14, onder ][ref1], noemt het dagelijks bestuur alle risico's die tot
      het moment van aanbieden van de begroting en de meerjarenraming bij hem bekend zijn en licht deze toe.

      2 Het algemeen bestuur bevestigt bij de vaststelling van de begroting alle risico's naar de laatste stand van
      zaken.

      3 Onder risico's, bedoeld in de vorige leden, worden verstaan alle voorzienbare risico's waarvoor geen
      voorzieningen zijn gevormd of die niet tot afwaardering van activa hebben geleid en die van materiële betekenis
      kunnen zijn in relatie tot het balanstotaal of de financiële positie.


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel14
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006654
        artikel: '14'
        hoofdstuk: IV
  - number: '16'
    text: |-
      1 De investerings- en financieringsstaat, genoemd in [artikel 14, onder ][ref1], geeft weer de stand per 31
      december van het begrotingsjaar van en de begrote mutaties in de vaste activa, het onderhanden werk inzake
      grondexploitatie, het eigen vermogen, de opgenomen langlopende geldleningen en de voorzieningen.

      2 Onverminderd de [artikelen 193 van de Provinciewet][ref2], onderscheidenlijk [189][ref3] van de
      [Gemeentewet][ref4], kunnen de mutaties, genoemd in het eerste lid, ten laste of ten bate van de organisatie
      slechts worden gerealiseerd tot de bedragen die het algemeen bestuur heeft vastgesteld.

      3 De vaststelling van de bedragen, bedoeld in het tweede lid, kan op een ander tijdstip plaatsvinden dan de
      vaststelling van de bedragen van de begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel193
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel189
      [ref4]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006654
        artikel: '14'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '193'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '189'
      - id: ref4
        bwb_id: BWBR0005416
  - number: '17'
    text: |-
      1 De kostenverdeelstaat, genoemd in [artikel 14, onder ][ref1], bevat de toerekening van de lasten en van de baten
      van de kostenplaatsen aan functies, investeringen, reserves en voorzieningen.

      2 In de kostenverdeelstaat worden afzonderlijk of geaggregeerd de kostenplaatsen opgenomen die worden gehanteerd
      bij het toerekenen van lasten en baten aan meer dan één functie.

      3 De kostenplaatsen worden zo ver geaggregeerd als nodig is ter verkrijging van een overzichtelijk beeld van de
      toerekening van de lasten en de baten.

      4 De lasten en de baten van de kostenplaatsen worden gespecificeerd volgens de categorieën, genoemd in
      [bijlage 2][ref2].

      5 Bij de kostenverdeelstaat behoort een toelichting waarin de kwantitatieve grondslagen van de verdeling, bedoeld
      in het tweede lid, worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006654
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006654
        artikel: '14'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006654
  - number: '18'
    text: |-
      1 De lasten in het overzicht van de kapitaallasten, genoemd in [artikel 14, onder ][ref1], worden onderscheiden in:

      a. rente gespecificeerd naar:

      1°. rente en premies van aangegane langlopende geldleningen;

      2°. rente van de in de kas van de organisatie gestorte langlopende waarborgsommen;

      3°. rente van aangegane kortlopende geldleningen;

      4°. toegerekende rente over eigen vermogen;

      5°. rente op overig vreemd vermogen;

      b. overige goederen en diensten gespecificeerd naar:

      1°. toegerekende kosten van het sluiten van geldleningen en disagio;

      2°. kosten van uitbetaling van aflosbaar gestelde obligaties en vervallen rentecoupons;

      c. toevoegingen aan fondsen voor premieleningen;

      d. overgeboekte rente wegens het aantrekken van extra kasmiddelen;

      e. afschrijvingen.

      2 De baten in het overzicht van de kapitaallasten, genoemd in [artikel 14, onder ][ref2], worden onderscheiden in:

      a. rente van verstrekte kortlopende geldleningen;

      b. overgeboekte rente wegens belegging van overtollige kasmiddelen;

      c. vrijval uit fondsen voor premieleningen;

      d. doorberekende kapitaallasten aan functies, kostenplaatsen en investeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006654#Artikel14
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006654
        artikel: '14'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006654
        artikel: '14'
        hoofdstuk: IV
  - number: '19'
    text: |-
      1 Voor de personele sterkte, bedoeld in [artikel 14, onder ][ref1], worden op basis van de organisatiestructuur
      voor de begroting opgenomen het aantal personeelsleden in dienst van de organisatie en hetzelfde aantal, omgerekend
      naar fulltime-eenheden. Voorts wordt deze informatie ook verstrekt voor de begroting van het vorige begrotingsjaar.

      2 Onder de personeelslasten, bedoeld in [artikel 14, onder ][ref2], worden voor de organisatie als geheel
      afzonderlijk opgenomen de totaalbedragen van:

      a. salarissen;

      b. sociale-verzekeringspremies;

      c. pensioenpremie;

      d. niet in premieverband betaalde sociale lasten van het eigen personeel;

      e. salarissen van het tijdelijk personeel.

      Voorts worden opgenomen het totaalbedrag dat met de personeelslasten is gemoeid en het totaalbedrag van de
      personeelslasten uit de begroting van het vorige begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006654#Artikel14
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006654
        artikel: '14'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006654
        artikel: '14'
        hoofdstuk: IV
  - number: '20'
    text: |-
      1 In de verzamel- en consolidatiestaat, bedoeld in [artikel 14, onder ][ref1], worden opgenomen:

      a. de baten en de lasten per functie uit de raming van baten en lasten, bedoeld in [artikel 10][ref2];

      b. de baten en de lasten uit het overzicht kapitaallasten bedoeld in [artikel 14, onder ][ref3];

      c. de baten en de lasten uit de kostenverdeelstaat, bedoeld in [artikel 17][ref4];

      d. de mutaties uit de investerings- en financieringsstaat, bedoeld in [artikel 16][ref5].

      2 De baten en de lasten, alsmede de mutaties uit de investerings- en financieringsstaat worden gerubriceerd naar de
      categorieën, genoemd in [bijlage 2][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006654#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0006654#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0006654#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0006654#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0006654
