      - id: ref4
        bwb_id: BWBR0006654
        artikel: '40'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '33'
    text: >-
      1 De balans met toelichting geeft getrouw, duidelijk en stelselmatig de financiële positie en de samenstelling
      daarvan in actief- en passiefposten op het einde van het begrotingsjaar weer.


      2 De balans bevat ook de cijfers van het voorafgaande begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel33
  - number: '34'
    text: >-
      1 Op de balans worden de activa onderscheiden in vaste en vlottende activa, al naar gelang zij zijn bestemd om de
      uitoefening van de werkzaamheid van de organisatie al dan niet duurzaam te dienen.


      2 Onder de vaste activa worden afzonderlijk opgenomen de immateriële, de materiële en de financiële vaste activa en
      de geactiveerde tekorten.


      3 Onder de vlottende activa worden afzonderlijk opgenomen de voorraden, de vorderingen, de effecten, de liquide
      middelen en de overlopende activa.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel34
  - number: '35'
    text: >-
      1 Onder de passiva worden afzonderlijk opgenomen het eigen vermogen, de voorzieningen, de langlopende schulden en
      de vlottende passiva.


      2 Onder de vlottende passiva worden afzonderlijk opgenomen de kortlopende schulden en de overlopende passiva.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel35
  - number: '36'
    text: >-
      1 Onder immateriële vaste activa worden begrepen die vaste activa die niet stoffelijk van aard zijn, niet onder de
      financiële vaste activa worden begrepen, en niet kunnen worden aangemerkt als ongedekte tekorten.


      2 In de toelichting op de balans worden de immateriële vaste activa onderscheiden naar:


      a. kosten verbonden aan het sluiten van geldleningen en disagio;


      b. kosten van onderzoek en ontwikkeling;


      c. bijdragen aan activa in eigendom van derden;


      d. overige immateriële vaste activa.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel36
  - number: '37'
    text: >-
      In de toelichting op de balans worden onder de materiële vaste activa afzonderlijk opgenomen:


      a. gronden en terreinen;


      b. woonruimten;


      c. bedrijfsgebouwen;


      d. grond-, weg- en waterbouwkundige werken;


      e. vervoermiddelen;


      f. machines, apparaten en installaties;


      g. overige materiële vaste activa.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel37
  - number: '38'
    text: >-
      In de toelichting op de balans wordt vermeld tot welke belangrijke, niet in de balans opgenomen, financiële
      verplichtingen de organisatie voor een aantal toekomstige jaren is verbonden, zoals die welke voortvloeien uit
      langlopende overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel38
  - number: '39'
    text: >-
      1 In de toelichting op de balans worden onder de financiële vaste activa afzonderlijk opgenomen:


      a. leningen aan woningbouwcorporaties;


      b. overige langlopende leningen;


      c. aandelen in gemeenschappelijke regelingen alsmede deelnemingen;


      d. effecten.


      2 Van een deelneming is sprake indien de organisatie aan een derde-rechtspersoon een kapitaalverschaffing heeft
      gedaan of daarop aanspraken heeft.


      3 In de toelichting op de balans wordt informatie verstrekt over de omvang en de aard van de deelneming(en).
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel39
  - number: '40'
    text: |-
      1 Het bruto-verloop van de vaste activa, bedoeld in [de artikelen 36][ref1], [37][ref2] en [39][ref3], gedurende
      het begrotingsjaar wordt in een sluitend overzicht weergegeven. Daaruit blijken, voor zover van toepassing:

      a. de boekwaarde aan het begin van het begrotingsjaar;

      b. de uitbreidingen, gespecificeerd naar categorieën en functies/kostenplaatsen;

      c. de afschrijvingen gespecificeerd naar functies/kostenplaatsen;

      d. de overige verminderingen, gespecificeerd naar categorieën en functies/kostenplaatsen;

      e. de boekwaarde aan het einde van het begrotingsjaar.

      2 Voorts wordt voor elke geactiveerde post, behorende tot de vaste activa, vermeld de som van afschrijvingen en
      waardeverminderingen op de balansdatum.

      3 Voor zover onder de materiële vaste activa, bedoeld in [artikel 37][ref4], in uitvoering zijnde
      investeringswerken zijn begrepen, wordt in de toelichting op de balans aangegeven hoe de werkelijke
      investeringsuitgaven in het begrotingsjaar zich verhouden tot de daarvoor door het algemeen bestuur vastgestelde
      bedragen, bedoeld in [artikel 16, tweede lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006654#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006654#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0006654#Artikel37
      [ref5]: https://wetten.overheid.nl/BWBR0006654#Artikel16
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006654
        artikel: '36'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006654
        artikel: '37'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006654
        artikel: '39'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0006654
        artikel: '37'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0006654
        artikel: '16'
        hoofdstuk: IV
  - number: '41'
    text: >-
      1 In de toelichting op de balans worden de stille reserves van niet-bedrijfsgebonden activa, die tot het moment van
      aanbieden van de jaarrekening bekend zijn, opgenomen.


      2 Onder een stille reserve wordt verstaan het verschil tussen de actuele waarde en de boekwaarde, waarbij de eerste
      materieel hoger uitvalt dan de tweede.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel41
  - number: '42'
    text: >-
      In de toelichting op de balans worden onder de tot de vlottende activa behorende voorraden afzonderlijk opgenomen:


      a. grond- en hulpstoffen gespecificeerd naar:


      1°. niet in exploitatie genomen bouwgronden;


      2°. overige grond- en hulpstoffen;


      b. onderhanden werk;


      c. gereed produkt en handelsgoederen;


      d. vooruitbetalingen op voorraden.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel42
  - number: '43'
    text: |-
      1 Met betrekking tot het onderhanden werk inzake grondexploitatie, mede bedoeld in [artikel 42, onder ][ref1],
      worden voor het totaal van de in exploitatie zijnde complexen aangegeven:

      a. de boekwaarde per 1 januari;

      b. de bestedingen in het jaar gespecificeerd naar investeringen en overige vermeerderingen;

      c. de opbrengsten in het jaar;

      d. de verminderingen in het jaar wegens afsluitingen van complexen;

      e. de boekwaarde per 31 december;

      f. de geraamde nog te maken kosten;

      g. de geraamde opbrengsten van nog uit te geven gronden ten behoeve van woningbouw;

      h. de geraamde opbrengsten van overige nog uit te geven gronden;

      i. de geraamde bijdragen van derden;

      j. de geraamde bijdrage tot het sluitend maken van de exploitatie;

      k. het geraamde eindresultaat.

      2 De investeringen en overige vermeerderingen, bedoeld in het eerste lid, onder *b*, worden gespecificeerd in:

      a. grondaankopen;

      b. interne doorberekeningen binnen de organisatie;

      c. rentebijschrijving;

      d. overige bestedingen.

      3 De opbrengsten, bedoeld in het eerste lid, onder *c*, worden gespecificeerd naar:

      a. verkopen;

      b. afschrijvingen;

      c. ontvangen subsidies van het Rijk;

      d. ontvangen subsidies van overige organisaties;

      e. overige verminderingen/opbrengsten.

      4 Van de afgesloten complexen, bedoeld in het eerste lid, onder *d*, wordt per complex het resultaat vermeld.

      5 Van de nog niet in exploitatie genomen gronden wordt in de toelichting op de balans de boekwaarde per m2 vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel42
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006654
        artikel: '42'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '44'
    text: >-
      In de toelichting op de balans worden onder de tot de vlottende activa behorende vorderingen afzonderlijk
      opgenomen:


      a. vorderingen op andere publiekrechtelijke lichamen;


      b. verstrekte kasgeldleningen;


      c. rekening-courantverhoudingen met niet-financiële instellingen;


      d. overige vorderingen.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel44
  - number: '45'
    text: >-
      Effecten die niet bestemd zijn om de uitoefening van de werkzaamheid van de organisatie duurzaam te dienen, worden
      in de toelichting op de balans afzonderlijk onder de vlottende activa opgenomen.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel45
  - number: '46'
    text: Onder de liquide middelen worden opgenomen de kas-, bank- en girosaldi.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel46
  - number: '47'
    text: |-
      Het eigen vermogen bestaat uit de reserves en het saldo van de rekening van baten en lasten, bedoeld in
      [artikel 30, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel30
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006654
        artikel: '30'
        hoofdstuk: VII
  - number: '48'
    text: >-
      1 In de toelichting op de balans worden de reserves onderscheiden naar:


      a. de algemene reserve;


      b. bestemmingsreserves.


      2 Tot de algemene reserve worden gerekend alle reserves, niet zijnde een bestemmingsreserve.


      3 Onder een bestemmingsreserve wordt verstaan een reserve waaraan door het algemeen bestuur een bepaalde bestemming
      is gegeven.


      4 Tot de bestemmingsreserves worden ook gerekend:


      a. de nog niet bestede verkregen middelen, verkregen van derden onder stringente condities voor de richting van
      de aanwending;


      b. de egalisatierekeningen die dienen om ongewenste schommelingen op te vangen in de tarieven die aan derden in
      rekening worden gebracht wegens door de organisatie geleverde prestaties;


      c. de egalisatierekeningen voor investeringsbijdragen die zijn bedoeld om ontvangen investeringsbijdragen gedurende
      de gebruiksduur van het investeringsgoed in jaarlijkse termijnen ten gunste van de rekening van baten en lasten te
      laten komen.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel48
  - number: '49'
    text: >-
      1 In de toelichting op de balans worden elke reserve en de wijze van aanwending van de in verband met die reserve
      ontvangen rente afzonderlijk vermeld en toegelicht.


      2 Per reserve wordt het bruto verloop gedurende het begrotingsjaar in een sluitend overzicht weergegeven. Daaruit
      blijken:


      a. het saldo aan het begin van het jaar;


      b. de rentebijschrijving rechtstreeks aan de reserve in het jaar;


      c. toevoegingen van het saldo van de begroting/rekening of van bijschrijvingen ten laste van de rekening van baten
      en lasten of ten laste van andere reserves in het jaar;


      d. vermeerderingen in het jaar door ontvangen subsidies;


      e. vermeerderingen in het jaar door overige ontvangsten van derden;


      f. verminderingen in het jaar, al dan niet door vrijval, ten gunste van:


      1°. de rekening van baten en lasten;


      2°. andere reserves;


      3°. de balansposten vaste activa;


      g. aanwending in het jaar;


      h. saldo aan het einde van het jaar.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel49
  - number: '50'
    text: >-
      Voorzieningen worden gevormd wegens:


      a. verplichtingen en verliezen waarvan de omvang op de balansdatum onzeker is, doch redelijkerwijs te schatten;


      b. op de balansdatum bestaande risico's ter zake van bepaalde te verwachten verplichtingen of verliezen waarvan de
      omvang redelijkerwijs is te schatten;


      c. kosten die in een volgend begrotingsjaar zullen worden gemaakt, mits het maken van die kosten zijn oorsprong
      mede vindt in het begrotingsjaar of in een voorafgaand begrotingsjaar en de voorziening strekt tot gelijkmatige
      verdeling van lasten over een aantal begrotingsjaren.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel50
  - number: '51'
    text: Waardevermindering van een actief wordt niet door vorming van een voorziening tot uitdrukking gebracht.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel51
  - number: '52'
    text: >-
      1 In de toelichting op de balans wordt elke voorziening afzonderlijk vermeld en toegelicht.


      2 Per voorziening wordt het bruto verloop gedurende het begrotingsjaar in een sluitend overzicht weergegeven.
      Daaruit blijken:


      a. het saldo aan het begin van het jaar;


      b. toevoegingen in het jaar ten laste van de rekening van baten en lasten;


      c. vermeerderingen in het jaar door ontvangen subsidies;


      d. vermeerderingen in het jaar door overige ontvangsten van derden;


      e. vrijgevallen bedragen in het jaar;


      f. aanwending in het jaar;


      g. saldo aan het einde van het jaar.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel52
  - number: '53'
    text: >-
      1 Rentetoevoegingen aan voorzieningen zijn niet toegestaan.


      2 Het verbod, neergelegd in het eerste lid, is niet van toepassing indien de voorziening tegen contante waarde
      is gewaardeerd.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel53
  - number: '54'
    text: >-
      1 Onder langlopende schulden worden verstaan de schulden met een oorspronkelijke looptijd van twee jaar of langer.


      2 In de toelichting op de balans worden onder de langlopende schulden afzonderlijk opgenomen:


      a. obligatieleningen;


      b. onderhandse leningen;


      c. door derden belegde reserves gespecificeerd naar:


      1°. reserves van woningbouwcorporaties;


      2°. overige reserves.


      d. waarborgsommen.


      3 Voor elk van de categorieën onder het tweede lid wordt de rentelast voor het begrotingsjaar vermeld.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel54
  - number: '55'
    text: >-
      1 Aan de passiefzijde van de balans wordt buiten de balanstelling opgenomen het bedrag waartoe waarborgen zijn
      verstrekt voor nog uitstaande geldleningen van andere instellingen.


      2 In de toelichting op de balans wordt het bedrag, bedoeld in het eerste lid, gespecificeerd naar de aard van de
      geldleningen.


      3 Per groep geldleningen worden vermeld:


      a. het oorspronkelijk bedrag van de aangegane geldlening;


      b. het percentage van het leningbedrag waarvoor borg verleend is;


      c. het restantbedrag van de lening bij aanvang van het begrotingsjaar;


      d. het restantbedrag van de lening aan het eind van het begrotingsjaar;


      e. het totaalbedrag van de betalingen die inzake de garantstelling zijn gedaan tot en met het eind van het
      begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel55
  - number: '56'
    text: >-
      In de toelichting op de balans worden onder de tot de vlottende passiva behorende kortlopende schulden afzonderlijk
      opgenomen:


      a. schulden aan publiekrechtelijke lichamen;


      b. kasgeldleningen;


      c. bank- en girosaldi;


      d. overige rekening-courantsaldi;


      e. overige schulden.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel56
  - number: '57'
    text: Bij de toepassing van de waarderings- en afschrijvingsmethoden wordt het toerekeningsbeginsel in acht genomen.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel57
  - number: '58'
    text: Activa en passiva worden gewaardeerd op basis van de verkrijgings- of vervaardigingsprijs.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel58
  - number: '59'
    text: >-
      1 De methoden volgens welke de afschrijvingen zijn berekend worden in de toelichting op de balans uiteengezet.


      2 Op vaste activa met een beperkte gebruiksduur wordt in beginsel jaarlijks afgeschreven volgens een stelsel dat is
      afgestemd op de verwachte toekomstige gebruiksduur.


      3 Voor de als immateriële vaste activa opgenomen kosten van het sluiten van geldleningen en disagio is de
      afschrijvingsduur maximaal gelijk aan de looptijd van de lening.


      4 De overige immateriële vaste activa worden afgeschreven in ten hoogste tien jaar.


      5 Van de maximale afschrijvingsduur, genoemd in het vierde lid, mag slechts worden afgeweken indien het materiële
      vaste activa in eigendom van derden betreft, en het nuttigheidscriterium, bedoeld in het tweede lid, dit
      rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel59
  - number: '60'
    text: >-
      1 Waardeverminderingen van activa worden onafhankelijk van het resultaat van het begrotingsjaar in aanmerking
      genomen.


      2 Bij de waardering van de vaste activa wordt rekening gehouden met een vermindering van hun waarde, indien deze
      vermindering naar verwachting duurzaam is.
    url: https://wetten.overheid.nl/BWBR0006654/2001-01-31#Artikel60
  - number: '61'
    text: |-
      1 In afwijking van [artikel 58][ref1] zijn voor voorraden, vorderingen, effecten, schulden, voorzieningen en
      liquide middelen andere waarderingsgrondslagen van toepassing.

      2 Voorraden worden tegen de marktwaarde gewaardeerd indien de marktwaarde lager is dan de verkrijgings- of
      vervaardigingsprijs.

      3 Vorderingen worden, onder aftrek van eventuele voorzieningen wegens oninbaarheid, tegen de nominale waarde
      gewaardeerd.

      4 Effecten bedoeld in [artikel 34][ref2], worden tegen de marktwaarde gewaardeerd, indien de marktwaarde lager is
      dan de verkrijgingsprijs.

      5 Schulden worden tegen de nominale waarde gewaardeerd.

      6 Voorzieningen worden, met uitzondering van hetgeen in [artikel 53, tweede lid][ref3], is bepaald, gewaardeerd
      tegen de nominale waarde.

      7 Liquide middelen worden gewaardeerd tegen de nominale waarde waarbij rekening wordt gehouden met de te verwachten
      verliezen.


