  - number: '67'
    text: |-
      In afwijking van [artikel 58][ref1] worden activa die vóór 1 januari 1995 tegen actuele waarde zijn gewaardeerd
      volgens de op dat moment aanwezige boekwaarde voor de rest van de periode afgeschreven als waren zij gewaardeerd
      tegen de verkrijgings- of vervaardigingsprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006654#Artikel58
