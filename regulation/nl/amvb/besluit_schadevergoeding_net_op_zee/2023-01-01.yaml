        bwb_id: BWBR0009755
  - number: '2.1'
    text: |-
      Een producent heeft slechts recht op vergoeding van schade, bedoeld in [artikel 16f, eerste lid, van de wet][ref1],
      voor zover de funderingen van het windpark zijn aangelegd en, indien het windpark niet gebruiksklaar is, indien de
      producent aannemelijk kan maken dat het windpark gebruiksklaar zou zijn geweest als daar niet vanaf was gezien om
      de schade te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16f
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16f
  - number: '2.2'
    text: |-
      Onder het voor de ontsluiting van het windpark noodzakelijk deel van het net op zee, bedoeld in
      [artikel 16f, eerste lid, onderdeel a, van de wet][ref1], wordt verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16f
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16f
  - number: 2.2.a
    text: de aansluiting van het windpark en
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel2
  - number: 2.2.b
    text: |-
      het net op zee tussen het windpark en het transformatorstation op land met de in het ontwikkelkader, bedoeld in
      [artikel 16e, eerste lid, van de wet][ref1], vastgestelde minimale transportcapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16e
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16e
  - number: '2.3'
    text: |-
      Onder gemiddeld voor het net op zee redelijkerwijs noodzakelijk onderhoud als bedoeld in
      [artikel 16f, eerste lid, onderdeel b, van de wet][ref1] wordt verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16f
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16f
  - number: 2.3.a
    text: een onderhoudsperiode van vijf dagen per kalenderjaar; of
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel2
  - number: 2.3.b
    text: |-
      een onderhoudsperiode van ten hoogste 38 dagen ter vervanging van componenten van het net op zee die van belang
      zijn voor beveiliging en besturing van het net op zee.
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel2
  - number: 2a.1
    text: |-
      De netbeheerder van het net op zee stelt de producent ten minste twee jaar van te voren op de hoogte van de
      startdatum van de werkzaamheden, bedoeld in [artikel 2, derde lid, onderdeel b][ref1], en geeft daarbij aan de
      producent tevens aan wat de planning van die werkzaamheden is.


      [ref1]: https://wetten.overheid.nl/BWBR0037775#Artikel2
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0037775
        artikel: '2'
        hoofdstuk: '1'
  - number: 2a.2
    text: |-
      De producent heeft voordat hij overeenkomstig het eerste lid de producent op de hoogte heeft gesteld van de
      startdatum en planning, voor het bepalen van die startdatum en planning afstemming gezocht met de producent.
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel2a
  - number: 2a.3
    text: |-
      De onderhoudsperiode, bedoeld in [artikel 2, derde lid][ref1], hoeft niet aaneengesloten te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037775#Artikel2
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0037775
        artikel: '2'
        hoofdstuk: '1'
  - number: 2b
    text: |-
      [Artikel 2, derde lid, aanhef en onderdeel b][ref1], is niet van toepassing op de houder van een vergunning als
      bedoeld in [artikel 12 van de Wet windenergie op zee][ref2] indien die vergunning is verleend voor 14 april 2022
      en er na 14 april 2022 geen besluit is genomen door Onze Minister tot instemming met verlenging van de looptijd van
      die vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0037775#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel12
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0037775
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0036752
        artikel: '12'
  - number: '3.1'
    text: 'Voor het bepalen van de schade ten gevolge van gederfde of uitgestelde inkomsten worden ingeval van:'
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel3
  - number: 3.1.a
    text: |-
      gehele of gedeeltelijke te late oplevering van het net op zee uitgestelde inkomsten uit elektriciteitsverkopen en
      subsidie in aanmerking genomen;
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel3
  - number: 3.1.b
    text: |-
      gehele of gedeeltelijke niet-beschikbaarheid van het net op zee gederfde inkomsten uit elektriciteitsverkopen en
      uitgestelde inkomsten uit subsidie in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel3
  - number: '3.2'
    text: |-
      Gevolgschade is het totaal van de financiële gevolgen die een causaal verband hebben met de gebeurtenis die een
      recht op vergoeding van schade doet ontstaan, waaronder in ieder geval zijn begrepen de kosten die de producent
      maakt ter beperking van de schade en extra kosten voor materieel, personeel, opslag en zaakschade aan het windpark.
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel3
  - number: '3.3'
    text: |-
      De schade, bedoeld in het eerste en tweede lid, wordt vermeerderd met de wettelijke rente die verschuldigd is
      voor de tijd die verstrijkt tussen het moment waarop de schade is ontstaan en het moment waarop de schade wordt
      uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel3
  - number: '4.1'
    text: |-
      Bij gehele of gedeeltelijke te late oplevering van het net op zee betreft de vergoeding van schade een vergoeding
      van schade door uitgestelde inkomsten en de gevolgschade, bedoeld in [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037775#Artikel3
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037775
        artikel: '3'
        hoofdstuk: '1'
  - number: '4.2'
    text: |-
      Bij gehele of gedeeltelijke niet-beschikbaarheid van het net op zee wordt de hoogte van de vergoeding van schade
      berekend door de som van:
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel4
  - number: 4.2.a
    text: |-
      het SDEK-subsidiebedrag verminderd met het SDEK-subsidiebedrag gedeeld door (1+i)5, waarbij i staat voor de
      discontovoet en
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel4
  - number: 4.2.b
    text: de voor dat jaar geldende SDEK-elektriciteitsprijs
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel4
  - number: '4.3'
    text: 'De schade door uitgestelde inkomsten wordt berekend door de som van:'
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel4
  - number: 4.3.a
    text: het SDEK-subsidiebedrag verminderd met het SDEK-subsidiebedrag gedeeld door (1+i)16 en
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel4
  - number: 4.3.b
    text: |-
      de SDEK-elektriciteitsprijs verminderd met de SDEK-elektriciteitsprijs gedeeld door (1+i)v-5 te vermenigvuldigen
      met de hoeveelheid elektriciteit die niet getransporteerd kon worden, berekend op basis van het productieprofiel
      van het windpark. Hierin is v gelijk aan de periode waarvoor de vergunning van het windpark is afgegeven.
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel4
  - number: '4.4'
    text: |-
      De hoeveelheid elektriciteit die niet getransporteerd kon worden, wordt bepaald op basis de gemiste
      elektriciteitsproductie. De gemiste elektriciteitsproductie wordt berekend door de windsnelheid te vermenigvuldigen
      met het productieprofiel van een windpark vermenigvuldigd met de tijd waarin het net op zee niet of verminderd
      beschikbaar was of, indien voor deze wijze van berekenen onvoldoende gegevens zijn, op een andere wijze. De gemiste
      elektriciteitsproductie wordt verminderd met de hoeveelheid elektriciteit die niet kon worden geproduceerd als
      gevolg van productiebeperkingen van het windpark zelf en, in voorkomend geval, de hoeveelheid elektriciteit die wel
      getransporteerd kon worden.
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel4
  - number: '4.5'
    text: |-
      Wanneer de netbeheerder van het net op zee dit noodzakelijk acht, voegt de producent bij de berekening van de
      hoogte van het recht op vergoeding van schade en de gegevens waarop deze berekening is gebaseerd een goedkeurende
      verklaring van een onafhankelijk accountant bij.
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel4
  - number: '4.6'
    text: |-
      Bij ministeriële regeling worden regels gesteld over het bepalen van het productieprofiel van het windpark en de
      gemiste elektriciteitsproductie.
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel4
  - number: '4.7'
    text: Onze Minister stelt jaarlijks de discontovoet i, bedoeld in het tweede en derde lid, vast.
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel4
  - number: '5'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [wet van 23 maart 2016 tot wijziging van de
      Elektriciteitswet 1998 (tijdig realiseren doelstellingen Energieakkoord)](onbekend) (Stb. 2016, 116) in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit schadevergoeding net op zee.'
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel6
