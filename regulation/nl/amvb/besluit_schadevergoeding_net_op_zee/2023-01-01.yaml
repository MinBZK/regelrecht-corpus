preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 8 maart 2016, nr. WJZ / 16031798;

    Gelet op artikel 16f, vierde lid, van de Elektriciteitswet 1998;

    De Afdeling advisering van de Raad van State gehoord (advies van 16 maart 2016, nr. W15.16.0049/IV);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 23 maart 2016, nr. WJZ / 16044086;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *SDEK-elektriciteitsprijs:*
      in [artikel 22 van het Besluit stimulering duurzame energieproductie en klimaattransitie][ref1]
      bedoelde elektriciteitsprijs of, indien de elektriciteitsprijs lager is dan de in
      [artikel 20 van het Besluit stimulering duurzame energieproductie en klimaattransitie][ref2] bedoelde
      basiselektriciteitsprijs, de in dat artikel bedoelde basiselektriciteitsprijs;
        - *SDEK-subsidiebedrag:* tenderbedrag per kilowattuur waarvoor subsidie is
      verstrekt op grond van het Besluit stimulering duurzame energieproductie of het
      [Besluit stimulering duurzame energieproductie en klimaattransitie][ref3], verminderd met de voor dat jaar geldende
      SDEK-elektriciteitsprijs;
        - *wet:* [Elektriciteitswet 1998][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0022735
      [ref4]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0037775/2023-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '22'
      - id: ref2
