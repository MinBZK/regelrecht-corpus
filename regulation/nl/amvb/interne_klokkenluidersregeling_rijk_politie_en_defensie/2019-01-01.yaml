    De Afdeling advisering van de Raad van State gehoord (advies van 14 december 2016, nr.WO4.16.0326/I);

    Gezien het nader rapport van Onze Minister voor Wonen en Rijksdienst van 20 december 2016, nr. 2016-0000794978,
    Directie Constitutionele Zaken en Wetgeving;

