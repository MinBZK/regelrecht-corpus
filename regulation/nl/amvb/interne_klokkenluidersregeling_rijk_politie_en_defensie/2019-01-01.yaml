    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op voordracht van Onze Minister voor Wonen en Rijksdienst, mede namens Onze Minister van Buitenlandse Zaken,
    Onze Minister van Veiligheid en Justitie en Onze Minister van Defensie, van 10 oktober 2016, nr. 2016-0000635876,
    Directie Constitutionele Zaken Wetgeving;

    Gelet op artikel 2, eerste en tweede lid, van de Wet Huis voor klokkenluiders, de artikelen 125, eerste lid, onder
    j, 125quinquies, eerste lid, onder f, en 134, eerste lid, van de Ambtenarenwet, artikel 47, eerste lid, van de
