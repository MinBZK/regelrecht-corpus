  - number: 1.d
    text: |-
      *hoogste leidinggevende:* de ambtenaar die de hoogste zeggenschap uitoefent bij de leiding van de arbeid in de
      ambtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel1
  - number: 1.e
    text: |-
      *melder:* de ambtenaar, de gewezen ambtenaar en degene die anderszins arbeid verricht of heeft verricht bij een
      ambtelijke organisatie die een vermoeden van een misstand meldt overeenkomstig [hoofdstuk 2][ref1] van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0038940#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0038940
        hoofdstuk: '2'
  - number: 1.f
    text: '*melding:* de melding van een vermoeden van een misstand door een melder.'
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel1
  - number: '2.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een melder als gevolg van het te goeder trouw en naar behoren melden van
      een vermoeden van een misstand of een vertrouwenspersoon integriteit vanwege diens functie als vertrouwenspersoon
      integriteit bij de uitoefening van zijn functie geen nadelige gevolgen ondervindt tijdens en na de behandeling van
      de melding.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel2
  - number: '2.2'
    text: |-
      Ten aanzien van een melder die anderszins arbeid verricht of heeft verricht bij een ambtelijke organisatie wordt
      als gevolg van het te goeder trouw en naar behoren melden van een vermoeden van een misstand geen beslissing
      genomen of handeling verricht met nadelige gevolgen voor zijn rechtspositie tijdens en na de behandeling van deze
      melding bij het bevoegd gezag, een andere werkgever, de afdeling onderzoek van het Huis voor klokkenluiders of een
      andere daartoe bevoegde instantie.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel2
  - number: '2.3'
    text: |-
      Ten aanzien van een vertrouwenspersoon integriteit of een gewezen vertrouwenspersoon integriteit wordt vanwege
      de uitoefening van zijn taken op basis van dit besluit geen beslissing genomen of handeling verricht met nadelige
      gevolgen voor zijn rechtspositie.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel2
  - number: '3.1'
    text: Het bevoegd gezag wijst een of meer vertrouwenspersonen integriteit aan bij de ambtelijke organisatie.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel3
  - number: '3.2'
    text: 'De vertrouwenspersoon integriteit heeft in elk geval tot taak:'
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel3
  - number: 3.2.a
    text: een ambtenaar op diens verzoek te adviseren over het omgaan met een vermoeden van een misstand; en
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel3
  - number: 3.2.b
    text: de hoogste leidinggevende te informeren over een melding.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel3
  - number: '4.1'
    text: |-
      Een ambtenaar doet een melding bij zijn direct leidinggevende, bij een hogere leidinggevende, bij een daartoe
      ingericht organisatieonderdeel of bij een vertrouwenspersoon integriteit. Indien dit niet in redelijkheid van
      hem kan worden gevraagd, kan hij rechtstreeks een melding doen bij de afdeling onderzoek van het Huis voor
      klokkenluiders of een andere daartoe bevoegde instantie.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel4
  - number: '4.2'
    text: |-
      Een melding over een andere organisatie doet een ambtenaar bij een leidinggevende of bij een vertrouwenspersoon
      van die organisatie of, indien dit in redelijkheid niet van hem kan worden gevraagd, rechtstreeks bij de afdeling
      onderzoek van het Huis voor klokkenluiders of een andere daartoe bevoegde instantie.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel4
  - number: '5'
    text: |-
      Een ambtenaar kan een krachtens [artikel 3, eerste lid][ref1], aangewezen vertrouwenspersoon integriteit in
      vertrouwen raadplegen over een vermoeden van een misstand.


      [ref1]: https://wetten.overheid.nl/BWBR0038940#Artikel3
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0038940
        artikel: '3'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      De vertrouwenspersoon integriteit maakt de identiteit van de melder niet bekend zonder schriftelijke instemming van
      de melder.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel6
  - number: '7'
    text: |-
      Degene bij wie een melding is gedaan, stelt de hoogste leidinggevende onverwijld in kennis van de melding en de
      datum waarop deze is ontvangen.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel7
  - number: '8'
    text: |-
      Diegenen die betrokken zijn bij de behandeling van de melding gaan vertrouwelijk met de melding en de identiteit
      van de melder om.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel8
  - number: '9'
    text: |-
      De hoogste leidinggevende bevestigt de ontvangst van de melding schriftelijk aan de melder, al dan niet via de
      vertrouwenspersoon integriteit, en informeert de persoon of personen op wie de melding betrekking heeft over
      de melding, tenzij daardoor een onderzoeksbelang of een belang van de melder onnodig of onevenredig kan worden
      geschaad.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel9
  - number: '10.1'
    text: 'Het bevoegd gezag stelt onverwijld een onderzoek in naar het vermoeden van een misstand, tenzij:'
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel10
  - number: 10.1.a
    text: het vermoeden van een misstand kennelijk ongegrond is;
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel10
  - number: 10.1.b
    text: de melding kennelijk onredelijk laat is gedaan.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel10
  - number: '10.2'
    text: |-
      Het bevoegd gezag meldt het achterwege laten van een onderzoek en van de verdere behandeling van de melding zo
      spoedig mogelijk schriftelijk en gemotiveerd aan de melder, al dan niet via de vertrouwenspersoon integriteit,
      alsmede aan de persoon of personen op wie de melding betrekking heeft, indien deze op de hoogte zijn gebracht van
      de melding.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel10
  - number: '10.3'
    text: |-
      Bij de kennisgeving, bedoeld in het tweede lid, wordt mededeling gedaan van de mogelijkheid het vermoeden van
      een misstand te melden bij de afdeling onderzoek van het Huis voor klokkenluiders of een andere daartoe bevoegde
      instantie.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel10
  - number: '10.4'
    text: |-
      Het onderzoek wordt niet verricht door een persoon die mogelijk betrokken is of is geweest bij de vermoedelijke
      misstand of op onvoldoende afstand staat van de te onderzoeken kwestie of personen.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel10
  - number: '11.1'
    text: |-
      Het bevoegd gezag stelt de melder, al dan niet via de vertrouwenspersoon integriteit, binnen twaalf weken na de
      melding schriftelijk en gemotiveerd in kennis van de bevindingen van het onderzoek, het oordeel daarover en de
      eventuele consequenties die daaraan worden verbonden.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel11
  - number: '11.2'
    text: |-
      Als niet binnen twaalf weken toepassing kan worden gegeven aan het eerste lid, wordt de melder, al dan niet via
      de vertrouwenspersoon integriteit, voordat deze termijn verlopen is daarvan schriftelijk en gemotiveerd op de
      hoogte gesteld. Daarbij wordt de termijn aangegeven waarbinnen de melder, al dan niet via de vertrouwenspersoon
      integriteit, een kennisgeving als bedoeld in het eerste lid ontvangt.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel11
  - number: '11.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de persoon of personen op wie de melding betrekking
      heeft, tenzij daardoor een onderzoeksbelang kan worden geschaad.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel11
  - number: '11.4'
    text: |-
      Bij de kennisgeving, bedoeld in het eerste lid, wordt mededeling gedaan van de mogelijkheid het vermoeden van
      een misstand te melden bij de afdeling onderzoek van het Huis voor klokkenluiders of een andere daartoe bevoegde
      instantie.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel11
  - number: '12.1'
    text: |-
      Indien de afdeling onderzoek van het Huis voor klokkenluiders aan het bevoegd gezag in haar rapport een aanbeveling
      doet als bedoeld in [artikel 17, tweede lid, onder c, van de Wet Huis voor klokkenluiders][ref1], stelt het bevoegd
      gezag de melder, al dan niet via de vertrouwenspersoon integriteit, en de persoon of personen op wie de melding
      betrekking heeft, uiterlijk binnen twaalf weken na openbaarmaking van het rapport schriftelijk in kennis van zijn
      standpunt dienaangaande en de eventuele consequenties die het daaraan verbindt.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel17
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: '17'
  - number: '12.2'
    text: |-
      Als het standpunt en de consequenties afwijken van de aanbeveling, vermeldt het bevoegd gezag de reden voor de
      afwijking.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel12
  - number: '13.1'
    text: |-
      De melder, de vertrouwenspersoon integriteit of de gewezen vertrouwenspersoon integriteit, die bezwaar maakt of
      een gerechtelijke procedure instelt, kan aanspraak maken op een tegemoetkoming in de kosten van die procedure, op
      voorwaarde dat:
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel13
  - number: 13.1.a
    text: |-
      de procedure is gericht tegen een gestelde benadeling als gevolg van een melding dan wel de procedure is gericht
      tegen een gestelde benadeling van de vertrouwenspersoon integriteit of de gewezen vertrouwenspersoon integriteit
      als gevolg van de uitoefening van zijn functie als vertrouwenspersoon integriteit;
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel13
  - number: 13.1.b
    text: |-
      de benadeling, bedoeld in onderdeel a, heeft plaatsgevonden binnen vijf jaar nadat het bevoegd gezag kennis
      heeft gegeven van de bevindingen en het oordeel, bedoeld in [artikel 10, eerste lid][ref1], of binnen vijf jaar
      na openbaarmaking van een rapport als bedoeld in [artikel 17 van de Wet Huis voor klokkenluiders][ref2] door
      de afdeling onderzoek van het Huis voor klokkenluiders, dan wel binnen vijf jaar nadat de melding anderszins is
      afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0038940#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0037852#Artikel17
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0038940
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0037852
        artikel: '17'
  - number: '13.2'
    text: |-
      De melder, de vertrouwenspersoon integriteit of de gewezen vertrouwenspersoon integriteit die zijn zienswijze
      naar voren brengt met betrekking tot een voorgenomen beslissing of handeling die naar zijn oordeel een benadeling
      inhoudt als gevolg van een melding of van de uitoefening van zijn functie als vertrouwenspersoon integriteit, kan
      aanspraak maken op een tegemoetkoming in de kosten, indien:
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel13
  - number: 13.2.a
    text: het voornemen is kenbaar gemaakt binnen de in het eerste lid, onder b, genoemde termijn, en
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel13
  - number: 13.2.b
    text: |-
      in de zienswijze naar voren wordt gebracht dat de voorgenomen beslissing of handeling het gevolg is van de melding
      of van de uitoefening van zijn functie als vertrouwenspersoon integriteit.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel13
  - number: '13.3'
    text: |-
      De melder, de vertrouwenspersoon integriteit, of de gewezen vertrouwenspersoon integriteit richt een verzoek om een
      tegemoetkoming aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel13
  - number: '13.4'
    text: |-
      Aanspraak op een tegemoetkoming bestaat alleen voor zover in verband met de in het eerste en tweede lid bedoelde
      procedures daadwerkelijk kosten worden of zijn gemaakt met betrekking tot door een derde beroepsmatig verleende
      rechtsbijstand.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel13
  - number: '14.1'
    text: |-
      De tegemoetkoming voor iedere afzonderlijke procedure, bedoeld in [artikel 13, eerste en tweede lid][ref1], is
      gelijk aan tweemaal het bedrag, genoemd in onderdeel B1 van de [bijlage bij het Besluit proceskosten bestuursrecht]
      (onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0038940#Artikel13
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0038940
        artikel: '13'
        hoofdstuk: '3'
  - number: '14.2'
    text: |-
      [Artikel 3 van het Besluit proceskosten bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006358#Artikel3
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006358
        artikel: '3'
  - number: '15.1'
    text: Het bevoegd gezag beslist binnen zes weken op het verzoek.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel15
  - number: '15.2'
    text: |-
      Het bevoegd gezag kan de beslissing voor ten hoogste vier weken verdagen. Van de verdaging wordt schriftelijk
      mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel15
  - number: '16'
    text: |-
      Degene aan wie een tegemoetkoming is toegekend, kan worden verplicht tot terugbetaling, indien hij de procedure
      waarop de tegemoetkoming betrekking heeft voortijdig staakt. Deze verplichting geldt niet, indien het staken van
      de procedure direct voortvloeit uit de intrekking door het bevoegd gezag van de beslissing of het herzien van de
      handeling, waartegen de procedure is gericht.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel16
  - number: '17.1'
    text: |-
      Als een beslissing of handeling of een voorgenomen beslissing of handeling waarvoor op grond van
      [artikel 13][ref1] aanspraak bestaat op een tegemoetkoming in de kosten van de procedures, in de bezwaarprocedure
      of zienswijzeprocedure wordt herroepen wegens een aan het bevoegd gezag te wijten onrechtmatigheid of
      de bestreden beslissing of handeling als gevolg van een uitspraak van de rechter die onherroepelijk is
      geworden wordt vernietigd, waarbij de rechtsgevolgen niet in stand worden gelaten, vergoedt het bevoegd
      gezag voor iedere afzonderlijke procedure aan de melder, de vertrouwenspersoon integriteit of de gewezen
      vertrouwenspersoon integriteit alle daadwerkelijk en in redelijkheid door hem gemaakte kosten als bedoeld in
      [artikel 1 van het Besluit proceskosten bestuursrecht][ref2], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0038940#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006358#Artikel1
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0038940
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006358
        artikel: '1'
  - number: 17.1.a
    text: de vergoeding wordt toegekend zonder toepassing van het tariefsysteem in voornoemd besluit;
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel17
  - number: 17.1.b
    text: |-
      de kosten van door een derde beroepsmatig verleende rechtsbijstand worden vergoed voor een bedrag van ten hoogste €
      258,57 per uur tot een bedrag van ten hoogste € 6205,71, beide bedragen exclusief BTW en kantoorkosten;
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel17
  - number: 17.1.c
    text: |-
      aan de betrokkene toegekende bedragen waarop hij op grond van een ander wettelijk voorschrift of een uitspraak van
      een gerechtelijke instantie aanspraak heeft in verband met de vergoeding van kosten als bedoeld in dit artikel, in
      aftrek worden gebracht op de vergoeding.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel17
  - number: '17.2'
    text: |-
      De in het eerste lid genoemde bedragen worden per 1 januari van elk jaar bij ministeriële regeling gewijzigd aan de
      hand van de consumentenprijsindex, geldend voor de maand september van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel17
  - number: '18.1'
    text: |-
      Het [Besluit melden vermoeden van misstand bij Rijk en Politie][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0026951
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0026951
  - number: '18.2'
    text: |-
      Op een melding ingediend bij de Commissie integriteit overheid voor het tijdstip
      van inwerkingtreding van dit besluit blijft hetgeen ter zake was bepaald in het
      [Besluit melden vermoeden van misstand bij Rijk en Politie][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026951
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0026951
  - number: '21'
    text: |-
      Onze Minister voor Wonen en Rijksdienst zendt binnen vijf jaar na de inwerkingtreding van dit besluit aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van dit besluit in de praktijk.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel21
  - number: '22'
    text: Dit besluit treedt in werking met ingang van 1 januari 2017.
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel22
  - number: '23'
    text: 'Dit besluit wordt aangehaald als: Interne klokkenluidersregeling Rijk, Politie en Defensie.'
    url: https://wetten.overheid.nl/BWBR0038940/2019-01-01#Artikel23
