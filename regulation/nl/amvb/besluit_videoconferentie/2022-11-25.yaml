  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie en Onze Minister voor Vreemdelingenzaken en Integratie van
    13 januari 2006, 5396943/06/1;

    Gelet op artikel 97 van de Vreemdelingenwet 2000;

    De Raad van State gehoord (advies van 13 maart 2006, nr. W03.06.0013/I);

