articles:
  - number: '1'
    text: |-
      1 Het horen van een vreemdeling in een beroepsprocedure tegen een vrijheidsontnemende maatregel als bedoeld in de
      [artikelen 94][ref1] en [96 van de Vreemdelingenwet 2000][ref2], kan per videoconferentie geschieden, waarbij een
      directe beeld- en geluidsverbinding tussen de betrokken personen totstandkomt.

      2 De rechtbank beslist of van videoconferentie gebruik wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel96
    url: https://wetten.overheid.nl/BWBR0019836/2022-11-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '94'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '96'
  - number: '2'
    text: |-
      1 In de navolgende gevallen wordt geen gebruik gemaakt van videoconferentie, tenzij met instemming van de verdachte
      of diens raadsman:

      a. ten aanzien van de verdachte, die in de desbetreffende zaak wordt voorgeleid voor de rechter-commissaris in
      verband met de inbewaringstelling;

      b. ten aanzien van de verdachte, bij de inhoudelijke behandeling van de zaak ter terechtzitting van de meervoudige
      kamer.

      2 Van toepassing van videoconferentie wordt bovendien geen gebruik gemaakt indien de te horen persoon een zodanige
      auditieve of visuele handicap heeft waardoor redelijkerwijs kan worden verondersteld dat videoconferentie afbreuk
      doet aan zijn inbreng of positie in het strafproces, dan wel aan de rechten van andere procesdeelnemers.

      3 In afwijking van het eerste lid kan van videoconferentie gebruik worden gemaakt indien de meervoudige kamer of de
      rechter-commissaris bepaalt dat videoconferentie noodzakelijk is in het bijzondere belang van de beveiliging van de
      zitting of van het vervoer naar of van de zitting.
    url: https://wetten.overheid.nl/BWBR0019836/2022-11-25#Artikel2
  - number: '3'
    text: |-
      1 Indien de te horen persoon schriftelijk wordt opgeroepen teneinde te worden gehoord, geeft deze oproep aan of
      tijdens het horen gebruik zal worden gemaakt van videoconferentie. De oproep vermeldt op welke wijze en binnen
      welke termijn hij kan aangeven zich niet te kunnen verenigen met het gebruik van videoconferentie.

      2 De mededeling van de te horen persoon dan wel in voorkomende gevallen de officier van justitie, dat hij zich niet
      met de gebruikmaking van videoconferentie kan verenigen, wordt schriftelijk gedaan en bevat de gronden waarop het
      verzoek berust. De mededeling wordt gericht aan de voorzitter van de meervoudige of enkelvoudige kamer, de rechter-
      commissaris of de ambtenaar die met de leiding over het horen is belast.

      3 Op een mededeling als bedoeld in het tweede lid wordt zo spoedig mogelijk beslist door de voorzitter van de
      meervoudige of enkelvoudige kamer, de rechter-commissaris of de ambtenaar die met de leiding over het horen is
      belast. Aan de te horen persoon en diens raadsman, onderscheidenlijk in voorkomende gevallen de officier van
      justitie, wordt de beslissing uiterlijk vierentwintig uur voor aanvang van het horen meegedeeld.

      4 Indien geen schriftelijke oproep aan het horen voorafgaat, kan de te horen persoon, dan wel in voorkomende
      gevallen de officier van justitie, niet later dan direct bij aanvang van het verhoor aan de voorzitter van
      de meervoudige of enkelvoudige kamer, de rechter-commissaris of de ambtenaar die met de leiding over het
      horen is belast, mondeling dan wel schriftelijk mededelen zich niet te kunnen verenigen met het gebruik van
      videoconferentie, onder vermelding van de gronden. Op deze mededeling wordt beslist door de voorzitter van de
      meervoudige of enkelvoudige kamer, de rechter-commissaris of de ambtenaar die met de leiding over het horen is
      belast.
    url: https://wetten.overheid.nl/BWBR0019836/2022-11-25#Artikel3
  - number: '4'
    text: |-
      1 Het systeem door middel waarvan videoconferentie wordt toegepast, is zodanig ingericht dat:

      a. de betrokken personen een natuurgetrouwe weergave krijgen van hetgeen zich in de andere ruimte afspeelt;

      b. overleg kan worden gevoerd zonder dat dit voor derden hoorbaar is;

      c. stukken kunnen worden uitgewisseld, en

      d. het systeem is beveiligd tegen verlies of tegen enige vorm van onrechtmatige verwerking;

      e. het systeem aan de internationale standaarden voldoet indien de videoconferentie plaatsvindt met een persoon die
      zich buiten Nederland bevindt.

      2 Bij regeling van Onze Minister van Justitie kunnen nadere eisen worden gesteld aan het systeem, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0019836/2022-11-25#Artikel4
  - number: '5'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0019836/2022-11-25#Artikel5
  - number: '6'
    text: |-
      1

      Dit besluit wordt aangehaald als: Besluit videoconferentie.

      2 Dit besluit berust mede op [artikel 78a, eerste, tweede en vierde lid, van het Wetboek van Strafrecht][ref1] en
      [artikel 131a, eerste, tweede en vierde lid, van het Wetboek van Strafvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel78a
