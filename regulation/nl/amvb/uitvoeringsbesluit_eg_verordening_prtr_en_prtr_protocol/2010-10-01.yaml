  - number: '4'
    text: |-
      De aanduiding van de grond waarop tot geheimhouding is besloten in:

      a. de mededeling, bedoeld in [artikel 12.24, vierde lid, aanhef en onder b, van de wet][ref1] en

      b. de aanduiding, bedoeld in [artikel 12.26, derde lid, aanhef en onder b, van de wet][ref2],

      bevat naast de toegepaste in [artikel 10 van de Wet openbaarheid van bestuur][ref3] opgenomen uitzonderingsgrond,
      tevens een samenvatting van de motivering van het besluit waarbij tot geheimhouding is besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12.24
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel12.26
      [ref3]: https://wetten.overheid.nl/BWBR0005252#Artikel10
