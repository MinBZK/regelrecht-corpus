articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      *meet- en registratiesysteem:* de voor de gegevensinzameling gebruikte methodiek, bedoeld in artikel 5, vijfde lid,
      van de EG-verordening PRTR;

      *wet*: [Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0023431/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '2'
    text: |-
      1 Degene die een inrichting drijft, waarop ingevolge [artikel 12.19 van de wet][ref1][titel 12.3 van de wet][ref2]
      van toepassing is, beschikt over een meet- en registratiesysteem.

      2 Het meet- en registratiesysteem wordt zodanig ingericht dat hiermee:

      a. volledige, consistente en geloofwaardige gegevens als bedoeld in artikel 9, tweede lid, van de EG-verordening
      PRTR kunnen worden gegenereerd,

      b. kan worden voldaan aan de in artikel 5, derde lid, van de EG-verordening PRTR opgenomen eisen en

      c. voor zover degene die de inrichting drijft, met betrekking tot een verslagjaar ingevolge artikel 5, eerste lid,
      van de EG-verordening PRTR of [artikel 12.20a, eerste lid, van de wet][ref3] rapportageplichtig is: kan worden
      voldaan aan de in artikel 5, eerste, tweede en vierde lid, van die verordening opgenomen eisen en, voorzover
      [artikel 12.20a, eerste lid, van de wet][ref4] van toepassing is, aan de in artikel 5, tweede en vierde lid, van de
      EG-verordening PRTR en de bij en krachtens [artikel 2a, eerste tot en met derde lid][ref5], gestelde eisen.

      3 Artikel 5, vijfde lid, van de EG-verordening PRTR is van toepassing op degenen die een inrichting drijven, waarop
      ingevolge [artikel 12.19 van de wet][ref6][titel 12.3 van de wet][ref7] van toepassing is, ongeacht of de betrokken
      persoon ingevolge artikel 5, eerste lid, van die verordening of [artikel 12.20a, eerste lid, van de wet][ref8]
      rapportageplichtig is.

      4 Bij ministeriële regeling kunnen nadere eisen worden gesteld met betrekking tot de inrichting van het meet- en
      registratiesysteem.


