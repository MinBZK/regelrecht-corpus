        artikel: 12.20a
  - number: 2a
    text: |-
      1 Bij ministeriële regeling kunnen gegevens als bedoeld in [artikel 12.20a, eerste lid, van de wet][ref1] worden
      aangewezen, die eveneens in het PRTR-verslag moeten worden opgenomen. Bij die regeling kunnen drempelwaarden worden
      vastgesteld bij overschrijding waarvan de rapportageplicht intreedt. Als gegevens als bedoeld in de eerste volzin
      kunnen onder meer worden aangewezen:

      a. gegevens over emissies van niet in bijlage II bij de EG-verordening PRTR genoemde verontreinigende stoffen;

      b. gegevens over emissies van in bijlage II bij de EG-verordening PRTR genoemde verontreinigende stoffen, die onder
      de in die bijlage vermelde drempelwaarden liggen.

      2 Bij de rapportage van de gegevens, bedoeld in het eerste lid, wordt vermeld of het gaat om informatie gebaseerd
      op metingen, berekeningen of ramingen.

      3 Op de gegevens, bedoeld in het eerste lid, is artikel 5, eerste lid, derde alinea, van de EG-verordening PRTR van
      overeenkomstige toepassing. Voor zover deze gegevens betrekking hebben op emissies, is ook artikel 5, eerste lid,
      vierde alinea, van de EG-verordening PRTR van overeenkomstige toepassing.

      4 De gegevens, bedoeld in het eerste lid, worden voorzien van een toelichting, indien dit voor een goed begrip van
      die gegevens noodzakelijk is.

      5 Het bestuursorgaan dat bevoegd is een omgevingsvergunning voor de betrokken inrichting te verlenen, kan, voor
      zover dat noodzakelijk is voor de kwaliteitsbeoordeling van een PRTR-verslag, bedoeld in artikel 9, tweede lid, van
      de EG-verordening PRTR, aan de vergunning een voorschrift verbinden, dat de verplichting inhoudt om met betrekking
      tot emissies in het PRTR-verslag gegevens van een lager aggregatieniveau te verstrekken dan ingevolge het krachtens
      [artikel 5][ref2] vastgestelde model is vereist. Bij ministeriële regeling kunnen ter zake nadere regels worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12.20a
      [ref2]: https://wetten.overheid.nl/BWBR0023431#Artikel5
