    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 13 november 2007,
    nr. DJZ2007111188, Directie Juridische Zaken, Afdeling Wetgeving, gedaan in overeenstemming met Onze Minister van
    Landbouw, Natuur en Voedselkwaliteit en de Staatssecretaris van Verkeer en Waterstaat;

    Gelet op verordening (EG) nr. 166/2006 van het Europees Parlement en de Raad van de Europese Unie van 18 januari
    2006 betreffende de instelling van een Europees register inzake de uitstoot en overbrenging van verontreinigende
    stoffen en tot wijziging van de Richtlijnen 91/689/EEG en 96/61/EG van de Raad (PbEU L 33) en de artikelen 12.4,
    tweede lid, 12.5, eerste lid, 12.10, tweede lid, 12.29 en 18.3, eerste lid, van de Wet milieubeheer;

    De Raad van State gehoord (advies van 20 december 2007, nr. W08.07.0422/IV);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 14
    januari 2008, nr. DJZ2008003740, Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht in overeenstemming met
    Onze Minister van Landbouw, Natuur en Voedselkwaliteit en de Staatssecretaris van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
