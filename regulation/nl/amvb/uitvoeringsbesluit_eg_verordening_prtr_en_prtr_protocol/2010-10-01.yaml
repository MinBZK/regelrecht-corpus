  - number: 2b
    text: |-
      Het bestuursorgaan dat bevoegd is een omgevingsvergunning voor de betrokken inrichting te verlenen, kan aan de
      vergunning een voorschrift verbinden, dat de verplichting inhoudt om gegevens inzake de onderwerpen geur of geluid
      in het PRTR-verslag op te nemen. Bij ministeriële regeling kunnen ter zake nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0023431/2010-10-01#Artikel2b
  - number: '3'
    text: |-
      1 In een verzoek om geheimhouding als bedoeld in [artikel 12.24, derde lid, van de wet][ref1] wordt, voor zover
      dat verzoek de naam van een verontreinigende stof betreft, tevens de naam aangegeven van de groep verontreinigende
      stoffen waartoe de geheim te houden verontreinigende stof behoort.

      2 In een mededeling als bedoeld in [artikel 12.24, vierde lid, aanhef en onder a, van de wet][ref2] wordt,
      voor zover die mededeling de naam van een verontreinigende stof betreft, tevens de naam aangegeven van de groep
      verontreinigende stoffen waartoe de geheimgehouden verontreinigende stof behoort.

      3 Indien een op grond van [artikel 12.21 van de wet][ref3] bevoegde instantie een mededeling als bedoeld in het
      tweede lid heeft gedaan, wordt in het PRTR de naam van de betrokken groep verontreinigende stoffen aangegeven.

      4 De aanduiding van de naam van een groep verontreinigende stoffen, bedoeld in het eerste tot en met derde lid,
      geschiedt met inachtneming van daaromtrent bij ministeriële regeling te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12.24
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel12.24
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel12.21
    url: https://wetten.overheid.nl/BWBR0023431/2010-10-01#Artikel3
