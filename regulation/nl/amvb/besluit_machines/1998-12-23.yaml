preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid, directoraat-generaal van de Arbeid,
    afdeling Wetgeving en Juridische Zaken, no. DGA/AIB/WJZ/92/09706 gedaan in overeenstemming met de Staatssecretaris
    van Welzijn, Volksgezondheid en Cultuur;


    Overwegende, dat het, gelet op richtlijn 89/392/EEG van de Raad van de Europese Gemeenschappen van 14 juni 1989
    (PbEG L 183) en richtlijn 91/368/EEG van de Raad van de Europese Gemeenschappen van 14 juni 1991 (PbEG L 198),
    inzake de onderlinge aanpassing van de wetgevingen van de Lid-Staten betreffende machines, noodzakelijk is regels
    te stellen ten aanzien van de veiligheid van machines;


    Gelet op de artikelen 1, eerste lid, onder a, 2, 3, eerste en tweede lid, 6, 12, derde lid, en 25a van de Wet op de
    gevaarlijke werktuigen (Stb. 1952, 104) en artikel 24 van de Arbeidsomstandighedenwet (Stb. 1990, 94);


    De Arboraad gehoord;


    De Raad van State gehoord (advies van 18 december 1992, nr. W12.92.0537);


    Gezien het nader rapport van Onze Minister voornoemd, directoraat-generaal van de Arbeid, afdeling Wetgeving en
    Juridische Zaken no. DGA/AIB/WJZ/9217330, uitgebracht in overeenstemming met de Staatssecretaris van Welzijn,
    Volksgezondheid en Cultuur;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. machine:

      1°. een samenstel van onderling verbonden onderdelen of organen waarvan er tenminste één kan bewegen, alsmede, in
      voorkomend geval, van aandrijfmechanismen, bedienings- en vermogensschakelingen en dergelijke, die in hun samenhang
      bestemd zijn voor een bepaalde toepassing, onder meer de verwerking, bewerking, verplaatsing en verpakking van
      een materiaal, alsmede een combinatie van dergelijke samenstellingen die, teneinde tot een zelfde resultaat bij te
      dragen, zodanig zijn opgesteld en worden bediend dat zij in samenhang functioneren;

      2°. een verwisselbaar uitrustingsstuk waardoor de functie van de machine, bedoeld onder 1°, wordt gewijzigd en dat
      op de markt is gebracht om door de bediener zelf aan een machine of een aantal verschillende machines, dan wel een
      trekker te worden gekoppeld, voor zover dit uitrustingsstuk geen vervangingsonderdeel of verwisselbaar gereedschap,
      dat al of niet tot de uitrusting van de machine behoort, is;

      3°. elke combinatie van de onder 1° en 2° genoemde machines.

      b. veiligheidscomponent: een component, voor zover die geen verwisselbaar uitrustingsstuk is, die binnen de
      Europese Economische Ruimte afzonderlijk op de markt wordt gebracht om bij gebruik een veiligheidsfunctie te
      vervullen en die bij een gebrekkige of slechte werking een gevaar vormt voor de veiligheid of de gezondheid van de
      blootgestelde personen;

      c. de Gemeenschap: de gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is;

      d. richtlijn: [richtlijn nr. 98/37/EG](31998L0037) van het Europees Parlement en de Raad van de Europese Unie van
      22 juni 1998 inzake de onderlinge aanpassing van de wetgevingen van de lidstaten betreffende machines (PbEG L 207);

      e. Europese Economische Ruimte: de gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is
      en voorts het grondgebied van de Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische
      Ruimte;

      f. keuringsinstantie: een ingevolge artikel 5, eerste lid, van de wet, in het kader van de richtlijn aangewezen
      dienst, instelling, onderzoekingsbureau of onderneming dan wel een door een andere Lid-Staat bij de Europese
      Commissie aangemelde instantie, die als zodanig bevoegd is het EG-typeonderzoek te verrichten, een technisch
      constructiedossier te beoordelen en een zodanig dossier te bewaren.

      g. wet: [Wet op de gevaarlijke werktuigen][ref1] (*Stb.* 1952, 104).


      [ref1]: https://wetten.overheid.nl/BWBR0002087
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002087
  - number: '2'
    text: >-
      1 Als gevaarlijke werktuigen, bedoeld in artikel 1, eerste lid, onderdeel *a*, van de wet, worden aangewezen
      machines.


      2 Als beveiligingsmiddelen, bedoeld in artikel 1, eerste lid, onderdeel *b*, van de wet, worden aangewezen
      veiligheidscomponenten.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel2
  - number: '3'
    text: >-
      Dit besluit is niet van toepassing op:


      a. machines of veiligheidscomponenten bestemd voor uitsluitend niet-beroepsmatige toepassing;


      b. machines, waarvan de risico’s hoofdzakelijk van elektrische oorsprong zijn;


      c. andere, door Onze Minister in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport aan te
      wijzen machines of veiligheidscomponenten.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel3
  - number: '4'
    text: >-
      Machines of veiligheidscomponenten dienen zodanig te zijn ontworpen en vervaardigd en zodanige eigenschappen te
      hebben alsmede van zodanige vermeldingen te zijn voorzien, dat zij bij gebruik overeenkomstig hun bestemming geen
      gevaar opleveren voor de veiligheid en gezondheid van personen, huisdieren en goederen, wanneer zij op passende
      wijze zijn geïnstalleerd en onderhouden. Zij dienen daartoe te voldoen aan de in bijlage I van de richtlijn
      opgenomen fundamentele eisen.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel4
  - number: '5'
    text: >-
      Machines of veiligheidscomponenten die voldoen aan de, door Onze Minister in overeenstemming met Onze Minister van
      Volksgezondheid, Welzijn en Sport aangewezen, geharmoniseerde normen, worden in zoverre vermoed te voldoen aan het
      in artikel 4, tweede volzin, bepaalde.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel5
  - number: '6'
    text: >-
      1 Machines dienen te zijn onderworpen aan een certificeringsprocedure overeenkomstig het in dit artikel bepaalde,
      te zijn voorzien van de in Bijlage III van de richtlijn bedoelde CE-markering, en vergezeld te gaan van de in
      Bijlage II van de richtlijn bedoelde EG-verklaring van overeenstemming bestaande uit de in die bijlage aangegeven
      onderdelen voor zover deze van toepassing zijn. Indien een certificeringsprocedure de afgifte van een verklaring
      van EG-typeonderzoek voorschrijft, dient de machine of het model van de machines waarop dat voorschrift betrekking
      heeft, te zijn gekeurd.


      2 De in het eerste lid bedoelde CE-markering mag uitsluitend worden aangebracht:


      a. op machines welke niet worden genoemd in bijlage IV van de richtlijn indien de in de Gemeenschap of in een
      andere Staat, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte gevestigde fabrikant
      of diens gemachtigde dan wel, in het geval zij geen van beide in de Gemeenschap of in één van de andere hiervoor
      bedoelde Staten zijn gevestigd, degene die de machines in de Gemeenschap of in één van de andere hiervoor bedoelde
      Staten in de handel brengt, de in bijlage V van de richtlijn onder punt 3, onderdelen *a* en *b*, bedoelde
      documenten heeft samengesteld met inachtneming van het onder punt 4 van laatstgenoemde bijlage bepaalde.


      b. op machines welke worden genoemd in bijlage IV van de richtlijn en waarvan de vervaardiging niet of slechts ten
      dele plaatsvindt met inachtneming van de in artikel 5 bedoelde normen, of indien deze normen ontbreken, dan wel
      in het geval dat dergelijke normen weliswaar in acht worden genomen maar op het moment van vervaardiging van de
      machines deze normen niet alle van toepassing zijnde fundamentele eisen opgenomen in bijlage I van de richtlijn
      betreffen, indien een van de onder *a* genoemde personen een EG-typeonderzoekverklaring als bedoeld in bijlage VI
      van de richtlijn voor het betrokken type machine heeft verkregen van een keuringsinstantie.


      c. op machines welke worden genoemd in bijlage IV van de richtlijn en waarvan de vervaardiging plaatsvindt met
      inachtneming van de in artikel 5 bedoelde normen indien een van de onder *a* genoemde personen:


      1°. het in bijlage VI, onder punt 2, tweede gedachtenstreepje, van de richtlijn, genoemde technische
      constructiedossier heeft samengesteld en ter bewaring heeft doen toekomen aan een keuringsinstantie en daarvan
      bericht van ontvangst van deze instantie heeft verkregen, hetzij;


      2°. het in bijlage VI, onder punt 2, tweede gedachtenstreepje, van de richtlijn genoemde technische
      constructiedossier heeft samengesteld en doen toekomen aan een keuringsinstantie en deze instantie een
      schriftelijke verklaring heeft afgegeven inhoudende dat, volgens voornoemd dossier, de in artikel 5 bedoelde normen
      juist zijn toegepast en voor het overige het dossier in overeenstemming is met het dienaangaande in bijlage VI,
      onder punt 2, tweede gedachtenstreepje, van de richtlijn bepaalde, hetzij;


      3°. een EG-typeonderzoekverklaring als bedoeld in bijlage VI van de richtlijn heeft verkregen van een
      keuringsinstantie.


      3 In de in het eerste lid genoemde EG-verklaring van overeenstemming wordt voor wat betreft het onderwerp
      overeenstemming:


      a. indien de verklaring betrekking heeft op machines waarvoor:


      1°. de in het tweede lid, onderdeel *a*, bedoelde procedure is gevolgd, dan wel


      2°. de in het tweede lid, onderdeel *c*, onder 1° en 2°, bedoelde procedures zijn gevolgd,


      uitsluitend vermeld dat overeenstemming met de fundamentele eisen opgenomen in bijlage I van de richtlijn bestaat,


      b. indien de verklaring betrekking heeft op machines waarvoor:


      1°. de in het tweede lid, onderdeel *b*, bedoelde procedure is gevolgd, dan wel


      2°. de in het tweede lid, onderdeel *c*, onder 3° bedoelde procedure is gevolgd,


      de overeenstemming vermeld met het type waarvoor een EG-typeonderzoekverklaring is verkregen.


      4 Wat betreft machines waarvoor:


      a. de in het tweede lid, onderdeel *c*, onder 1°, bedoelde procedure is gevolgd, is het bepaalde onder punt 5,
      eerste volzin en punt 7 van bijlage VI van de richtlijn van overeenkomstige toepassing;


      b. de in het tweede lid, onderdeel *c*, onder 2°, bedoelde procedure is gevolgd, is het bepaalde onder de punten 5,
      6 en 7 van bijlage VI van de richtlijn van overeenkomstige toepassing.


      5 Machines die met inachtneming van de procedures genoemd in dit artikel zijn voorzien van de CE-markering en
      vergezeld gaan van de EG-verklaring van overeenstemming, worden vermoed te voldoen aan het in artikel 4, tweede
      volzin, bepaalde.


      6 a. Indien de fabrikant, diens in Nederland gevestigde gemachtigde, of, in het geval zij geen van beide in
      Nederland zijn gevestigd, degene die de machines in Nederland in de handel brengt, voornemens is aan het model van
      een machine, of aan te vervaardigen en in de handel te brengen machines, waarvoor een verklaring van typeonderzoek
      is afgegeven, wijzigingen aan te brengen, stelt hij de krachtens artikel 5 van de wet aangewezen keuringsinstantie
      die de verklaring van type-onderzoek heeft afgegeven hiervan onverwijld in kennis.


      b. De in onderdeel *a* bedoelde keuringsinstantie beoordeelt de wijzigingen en deelt de in onderdeel *a* bedoelde
      persoon mede of de typeonderzoekverklaring voor het aldus gewijzigde model of de gewijzigde machines geldig is.


      c. Indien de in onderdeel *a* bedoelde keuringsinstantie van oordeel is dat de verklaring van EG-typeonderzoek voor
      de gewijzigde machine niet geldig is, moet deze machine aan een EG-typeonderzoek worden onderworpen.


      7 Een gedraging in strijd met het het eerste en het tweede lid is verboden.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel6
  - number: 6a
    text: >-
      1 Veiligheidscomponenten dienen te zijn onderworpen aan een certificeringsprocedure overeenkomstig het
      in dit artikel bepaalde en vergezeld te gaan van de in bijlage II van de richtlijn bedoelde EG-verklaring
      van overeenstemming, bestaande uit de in onderdeel C van die bijlage aangegeven onderdelen. Indien
      een certificeringsprocedure de afgifte van een verklaring van EG-typeonderzoek voorschrijft, dient de
      veiligheidscomponent of het model van de veiligheidscomponenten waarop dat voorschrift betrekking heeft, te zijn
      gekeurd.


      2 De in het eerste lid bedoelde EG-verklaring van overeenstemming wordt uitsluitend gebezigd:


      a. voor veiligheidscomponenten welke niet worden genoemd in bijlage IV, onderdeel B, van de richtlijn, indien de
      in de Gemeenschap of in een andere Staat, die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte gevestigde fabrikant of diens gemachtigde dan wel, in het geval zij geen van beide in de Gemeenschap of in
      één van de andere hiervoor bedoelde Staten zijn gevestigd, degene die de veiligheidscomponenten in de Gemeenschap
      of in één van de andere hiervoor bedoelde Staten in de handel brengt, de in bijlage V van de richtlijn onder
      punt 3, onderdelen *a* en *b*, bedoelde documenten heeft samengesteld met inachtneming van het onder punt 4 van
      laatstgenoemde bijlage bepaalde;


      b. voor veiligheidscomponenten welke worden genoemd in bijlage IV, onderdeel B, van de richtlijn en waarvan de
      vervaardiging niet of slechts ten dele plaatsvindt met inachtneming van de in artikel 5 bedoelde normen, of indien
      deze normen ontbreken, dan wel in het geval dat dergelijke normen weliswaar in acht worden genomen maar op het
      moment van vervaardiging van de veiligheidscomponenten deze normen niet alle van toepassing zijnde fundamentele
      eisen opgenomen in bijlage I van de richtlijn betreffen, indien een van de onder *a* genoemde personen een EG-
      typeonderzoekverklaring als bedoeld in bijlage VI van de richtlijn voor het betrokken type veiligheidscomponent
      heeft verkregen van een keuringsinstantie;


      c. voor veiligheidscomponenten welke worden genoemd in bijlage IV, onderdeel B, van de richtlijn en waarvan
      de vervaardiging plaatsvindt met inachtneming van de in artikel 5 bedoelde normen, indien een van de onder *a*
      genoemde personen:


      1°. het in bijlage VI, onder punt 2, tweede gedachtenstreepje, van de richtlijn genoemde technische
      constructiedossier heeft samengesteld en ter bewaring heeft doen toekomen aan een keuringsinstantie en daarvan
      bericht van ontvangst van deze instantie heeft verkregen, hetzij


      2°. het in bijlage VI, onder punt 2, tweede gedachtenstreepje, van de richtlijn genoemde technische
      constructiedossier heeft samengesteld en doen toekomen aan een keuringsinstantie en deze instantie een
      schriftelijke verklaring heeft afgegeven inhoudende dat, volgens voornoemd dossier, de in artikel 5 bedoelde normen
      juist zijn toegepast en voor het overige het dossier in overeenstemming is met het dienaangaande in bijlage VI,
      onder punt 2, tweede gedachtenstreepje, van de richtlijn bepaalde, hetzij


      3°. een EG-typeonderzoekverklaring als bedoeld in bijlage VI van de richtlijn heeft verkregen van een
      keuringsinstantie.


      3 In de in het eerste lid genoemde EG-verklaring van overeenstemming wordt voor wat betreft het onderwerp
      overeenstemming:


      a. indien de verklaring betrekking heeft op veiligheidscomponenten waarvoor:


      1°. de in het tweede lid, onderdeel *a*, bedoelde procedure is gevolgd, dan wel


      2°. de in het tweede lid, onderdeel *c*, onder 1° en 2°, bedoelde procedures zijn gevolgd, uitsluitend vermeld dat
      overeenstemming met de fundamentele eisen opgenomen in bijlage I van de richtlijn bestaat,


      b. indien de verklaring betrekking heeft op veiligheidscomponenten waarvoor:


      1°. de in het tweede lid, onderdeel *b*, bedoelde procedure is gevolgd, dan wel


      2°. de in het tweede lid, onderdeel *c*, onder 3°, bedoelde procedure is gevolgd, de overeenstemming vermeld met
      het type waarvoor een EG-typeonderzoekverklaring is verkregen.


      4 Wat betreft veiligheidscomponenten waarvoor:


      a. de in het tweede lid, onderdeel *c*, onder 1°, bedoelde procedure is gevolgd, is het bepaalde onder punt 5,
      eerste volzin, en punt 7 van bijlage VI van de richtlijn van overeenkomstige toepassing;


      b. de in het tweede lid, onderdeel *c*, onder 2°, bedoelde procedure is gevolgd, is het bepaalde onder de punten 5,
      6 en 7 van bijlage VI van de richtlijn van overeenkomstige toepassing.


      5 Veiligheidscomponenten die met inachtneming van de procedures genoemd in dit artikel vergezeld gaan van de EG-
      verklaring van overeenstemming, worden vermoed te voldoen aan het in artikel 4, tweede volzin, bepaalde.


      6 a. Indien de fabrikant, diens in Nederland gevestigde gemachtigde, of, in het geval zij geen van beide in
      Nederland zijn gevestigd, degene die de veiligheidscomponenten in Nederland in de handel brengt, voornemens is aan
      het model van een veiligheidscomponent, of aan te vervaardigen en in de handel te brengen veiligheidscomponenten,
      waarvoor een verklaring van typeonderzoek is afgegeven, wijzigingen aan te brengen, stelt hij de krachtens artikel
      5 van de wet aangewezen keuringsinstantie die de verklaring van type-onderzoek heeft afgegeven hiervan onverwijld
      in kennis.


      b. De in onderdeel *a* bedoelde keuringsinstantie beoordeelt de wijzigingen en deelt de in onderdeel *a* bedoelde
      persoon mede of de typeonderzoekverklaring voor het aldus gewijzigde model of de gewijzigde veiligheidscomponenten
      geldig is.


      c. Indien de in onderdeel *a* bedoelde keuringsinstantie van oordeel is dat de verklaring van EG-typeonderzoek voor
      de gewijzigde veiligheidscomponent niet geldig is, moet die veiligheidscomponent aan een EG-typeonderzoek worden
      onderworpen.


      7 Een gedraging in strijd met het eerste en het tweede lid is verboden.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel6a
  - number: '7'
    text: |-
      1 De verplichtingen van de artikelen 6 en 6*a* rusten tevens op degene die machines, machineonderdelen of
      veiligheidscomponenten van verschillende herkomst assembleert of die machines of veiligheidscomponenten voor eigen
      gebruik vervaardigt.

      2 De verplichtingen van artikel 6 gelden niet voor degenen die een verwisselbaar uitrustingsstuk als bedoeld in
      artikel 1, onderdeel *a*, sub 2° op een machine of een trekker aansluiten, mits de elementen compatibel zijn, en
      alle delen waaruit de machine na de aansluiting bestaat voorzien zijn van de CE-markering en vergezeld gaan van de
      EG-verklaring van overeenstemming.

      3 Het eerste lid van artikel 6 is niet van toepassing op machines, die volgens de in bijlage II, onderdeel B, van
      de richtlijn bedoelde verklaring van de in de Gemeenschap of in een andere Staat, die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte gevestigde fabrikant of diens gemachtigde of, indien zij geen van beide
      in de Gemeenschap of in één van de andere hiervoor bedoelde Staten zijn gevestigd, degene die de machines in de
      Gemeenschap of in één van de andere hiervoor bedoelde Staten in de handel brengt, bestemd zijn om

      - te worden ingebouwd in een machine, of
      - met andere machines te worden samengebouwd tot één machine, en op de samenstellingen dit besluit van toepassing
      is, tenzij de machines waarop de verklaring betrekking heeft, zelfstandig kunnen werken.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel7
  - number: '8'
    text: >-
      1 De CE-markering moet duidelijk leesbaar en onuitwisbaar op de machine zijn aangebracht overeenkomstig punt 1.7.3.
      van bijlage I alsmede overeenkomstig bijlage III van de richtlijn.


      2 Met betrekking tot machines worden geen markeringen gebezigd, die derden kunnen misleiden omtrent de betekenis of
      grafische vorm van de CE-markering. Op de machines mogen andere markeringen worden aangebracht op voorwaarde dat de
      zichtbaarheid en de leesbaarheid van de CE-markering niet worden verminderd.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel8
  - number: '9'
    text: >-
      Een EG-typeonderzoekverklaring wordt door de krachtens artikel 5 van de wet aangewezen keuringsinstantie die haar
      heeft afgegeven ingetrokken indien de fundamentele eisen van Bijlage I van de richtlijn zodanig zijn gewijzigd dat
      het model niet aan de gewijzigde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel9
  - number: '10'
    text: >-
      1 Degene die een machine of een veiligheidscomponent voorhanden heeft, aflevert, tentoonstelt of gebruikt is
      verplicht ervoor te zorgen dat de machine of de veiligheidscomponent in goede staat van onderhoud verkeert.


      2 Het eerste lid is niet van toepassing op degene die een machine of een veiligheidscomponent voorhanden heeft die
      hetzij is afgekeurd, hetzij onklaar gemaakt, hetzij anderszins kennelijk niet meer voor gebruik bestemd is.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel10
  - number: '11'
    text: >-
      Machines of veiligheidscomponenten, die niet in overeenstemming zijn met de bepalingen van dit besluit mogen op
      (jaar)beurzen, exposities en bij demonstraties worden tentoongesteld en gedemonstreerd, mits op een zichtbaar bord
      is aangegeven dat de machines of de veiligheidscomponenten niet in overeenstemming met die bepalingen zijn, en dat
      zij niet te koop zijn voordat zij door de fabrikant of zijn in de Gemeenschap, of in een andere Staat, die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte gevestigde gevolmachtigde in overeenstemming
      met die bepalingen zijn gebracht. Bij demonstraties moeten alle passende veiligheidsmaatregelen zijn genomen om de
      bescherming van personen te waarborgen.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel11
  - number: '12'
    text: >-
      1 Het is verboden een op een machine of op een veiligheidscomponent aangebracht merk van afkeuring te verwijderen,
      te beschadigen of onleesbaar te maken.


      2 Het in het eerste lid gestelde verbod geldt niet ten aanzien van de ambtenaren die ingevolge artikel 12, eerste
      lid, eerste zin van de wet ten aanzien van machines en veiligheidscomponenten aangewezen zijn.


      3 Onze Minister kan ten aanzien van merken van afkeuring nadere bepalingen vaststellen.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel12
  - number: '13'
    text: >-
      1 Indien naar het oordeel van Onze Minister bepaalde machines, die voorzien zijn van de CE-markering, die vergezeld
      gaan van de EG-verklaring van overeenstemming, die overeenkomstig hun bestemming worden gebruikt en die op passende
      wijze geïnstalleerd zijn en onderhouden worden, gevaar opleveren voor de veiligheid of de gezondheid van personen,
      huisdieren of goederen, kan hij de fabrikant, diens in de Europese Economische Ruimte gevestigde gemachtigde dan
      wel degene de machines in de Europese Economische Ruimte in de handel brengt, gelasten om de bezitters, dan wel
      de vermoedelijke bezitters van die machines onverwijld en op doeltreffende wijze op de hoogte te stellen van het
      gevaar.


      2 Het eerste lid, met uitzondering van de zinsnede "die voorzien zijn van de CE-markering", is van overeenkomstige
      toepassing op veiligheidscomponenten.


      3 Indien de fabrikant of één van de andere in het eerste lid genoemde personen de krachtens het eerste of tweede
      lid gelaste maatregelen niet onverwijld of niet op doeltreffende wijze uitvoert, kan Onze Minister die maatregelen
      op kosten van de nalatige persoon treffen.


      4 Onze Minister geeft van een krachtens dit artikel genomen maatregel en van de intrekking daarvan onverwijld
      kennis aan betrokkenen, aan de Europese Commissie en in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel13
  - number: '14'
    text: >-
      1 Indien naar het oordeel van Onze Minister bepaalde machines, die voorzien zijn van een CE-markering, die
      vergezeld gaan van de EG-verklaring van overeenstemming, die overeenkomstig hun bestemming worden gebruikt en die
      op passende wijze geïnstalleerd zijn en onderhouden worden, gevaar opleveren voor de veiligheid of de gezondheid
      van personen, huisdieren of goederen, kan hij


      a. een verbod uitvaardigen tot het vervaardigen, het in Nederland invoeren en het verhandelen van die machines;


      b. de fabrikant of de andere, in het eerste lid van artikel 13 genoemde personen verplichten om overeenkomstig de
      daarbij gegeven aanwijzingen passende maatregelen te nemen om die machines zoveel mogelijk uit de handel te nemen.


      2 Het eerste lid, met uitzondering van de zinsnede "die voorzien zijn van de CE-markering", is van overeenkomstige
      toepassing op veiligheidscomponenten.


      3 Onze Minister neemt een maatregel krachtens het eerste lid in overeenstemming met Onze Ministers wie het mede
      aangaat.


      4 Artikel 13, vierde lid, is van overeenkomstige toepassing.


      5 Een gedraging in strijd met een krachtens het eerste of het tweede lid genomen maatregel is verboden.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel14
  - number: '15'
    text: >-
      Voor een aanwijzing als keuringsinstantie komen in aanmerking instanties die tenminste voldoen aan de in bijlage
      VII van de richtlijn neergelegde voorwaarden. Onze Minister kan, in overeenstemming met Onze Minister van
      Volksgezondheid, Welzijn en Sport, nadere voorwaarden stellen.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel15
  - number: '16'
    text: >-
      Indien één van de bijlagen van de richtlijn, waarnaar in dit besluit wordt verwezen, wordt gewijzigd, dan wel
      indien een specifieke communautaire richtlijn als bedoeld in artikel 1, vierde lid, van de richtlijn wordt
      vastgesteld of gewijzigd, maakt Onze Minister dit bekend in de *Staatscourant*; hij vermeldt daarbij met ingang
      van welke datum, en zonodig met betrekking tot welke machines of veiligheidscomponenten, de wijziging moet worden
      toegepast.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel16
  - number: '26'
    text: >-
      1 Met ingang van 1 januari 1993 worden het Besluit slijpmachines (*Stb.* 1968, 498) en het Besluit centrifuges
      (*Stb.* 1968, 651) ingetrokken.


      2 Met ingang van 1 januari 1995 worden het Veiligheidsbesluit gevaarlijke werktuigen (*Stb.* 1940, 842),
      het Dorsgarniturenbesluit (*Stb.* 1956, 150) en het Besluit verplaatsbare transporteurs ( *Stb.* 1972, 520)
      ingetrokken.


      3 Met ingang van 1 januari 1996 wordt het Besluit gemotoriseerde transportwerktuigen ingetrokken.


      4 Met ingang van 1 januari 1997 wordt het Besluit kantel- en valbeveiligingen bouwmachines ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel26
  - number: '27'
    text: >-
      1 Onverminderd het tweede tot en met vijfde lid zijn op gevaarlijke werktuigen die voor het tijdstip van
      inwerkingtreding van dit besluit in de handel zijn gebracht en in gebruik genomen, de artikelen 4 en 6 niet van
      toepassing voor zover zij niet alsnog in overeenstemming met artikel 4 worden gebracht.


      2 Op de gevaarlijke werktuigen ten aanzien waarvan op 31 december 1992 de algemene maatregelen van bestuur genoemd
      in de artikelen 22 en 26, tweede lid, van toepassing zijn en die vóór 1 januari 1995 in overeenstemming met de
      bepalingen van die algemene maatregelen van bestuur zijn vervaardigd en in gebruik genomen, zijn de artikelen 4 en
      6 niet van toepassing, voor zover zij niet alsnog in overeenstemming met artikel 4 worden gebracht.


      3 Op de gevaarlijke werktuigen ten aanzien waarvan op 31 december 1992 het Besluit gemotoriseerde
      transportwerktuigen van toepassing was en die vóór 1 januari 1996 in overeenstemming met de bepalingen van dat
      besluit zijn vervaardigd en in gebruik genomen, zijn de artikelen 4, 6 en 6*a* niet van toepassing, voor zover zij
      niet alsnog in overeenstemming met artikel 4 worden gebracht.


      4 Op de gevaarlijke werktuigen ten aanzien waarvan op 14 juni 1993 het Besluit kantel- en valbeveiligingen
      bouwmachines van toepassing was en die vóór 1 januari 1997 in overeenstemming met de bepalingen van dat besluit
      zijn vervaardigd en in gebruik genomen, zijn de artikelen 4, 6 en 6*a* niet van toepassing, voor zover zij niet
      alsnog in overeenstemming met artikel 4 worden gebracht.


      5 De artikelen 4, 6 en 6a zijn niet van toepassing op machines voor het heffen of verplaatsen van personen
      en op veiligheidscomponenten die voldoen aan de wettelijke voorschriften zoals die luidden op de dag voor de
      inwerkingtreding van dit besluit en die voor 1 januari 1997 in de handel zijn gebracht en in gebruik genomen, voor
      zover zij niet alsnog in overeenstemming met artikel 4 worden gebracht.


      6 Met betrekking tot de gevaarlijke werktuigen en machines, bedoeld in de voorgaande leden, waarop dit besluit niet
      wordt toegepast en waarop ingevolge een of meer andere wettelijke regelingen de CE-markering wordt aangebracht,
      worden op de bij die gevaarlijke werktuigen en machines gevoegde documenten, handleidingen of gebruiksaanwijzingen
      de in het *Publikatieblad van de Europese Gemeenschappen* bekendgemaakte referenties van de aan die wettelijke
      regelingen ten grondslag liggende richtlijnen vermeld.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel27
  - number: '28'
    text: >-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het zal
      worden geplaatst, met dien verstande dat artikel 22, onderdelen B tot en met G, in werking treden op 1 januari
      1995.
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel28
  - number: '29'
    text: 'Dit besluit wordt aangehaald als: Besluit machines.'
    url: https://wetten.overheid.nl/BWBR0005884/1998-12-23#Artikel29
