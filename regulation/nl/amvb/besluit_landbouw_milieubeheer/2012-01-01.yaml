  - number: '9'
    text: |-
      1 Indien op het tijdstip van inwerkingtreding van dit besluit een inrichting reeds was opgericht en voor die
      inrichting voor dat tijdstip geen vergunning in werking of onherroepelijk was of geen melding was gedaan krachtens
      het [Besluit melkrundveehouderijen milieubeheer][ref1], het [Besluit akkerbouwbedrijven milieubeheer][ref2], het
      [Besluit inrichtingen voor motorvoertuigen milieubeheer][ref3] of het Besluit tuinbouwbedrijven met bedekte teelt
      milieubeheer voorzover laatstgenoemd besluit betrekking heeft op een inrichting die uitsluitend of in hoofdzaak
      bestemd is voor de witloftrek of de teelt van eetbare paddestoelen, meldt degene die de inrichting drijft aan het
      bevoegd gezag dat hij de inrichting in werking heeft.

      2 De melding, bedoeld in het eerste lid, geschiedt ten hoogste twaalf weken na het tijdstip van inwerkingtreding
      van dit besluit. [Artikel 7, derde tot en met het negende lid][ref4], is van overeenkomstige toepassing.

      3 Het eerste en tweede lid zijn niet van toepassing, indien op het tijdstip van inwerkingtreding van dit besluit
      een aanvraag om een vergunning voor het oprichten van de inrichting door het bevoegd gezag in behandeling
      is genomen. De aanvraag om de vergunning wordt in dat geval aangemerkt als een melding als bedoeld in
      [artikel 7][ref5].


