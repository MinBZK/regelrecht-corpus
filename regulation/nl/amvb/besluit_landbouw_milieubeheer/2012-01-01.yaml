    text: |-
      Indien op grond van een vergunning die in werking of onherroepelijk was, het
      [Besluit melkrundveehouderijen milieubeheer][ref1], het [Besluit akkerbouwbedrijven milieubeheer][ref2], het
      [Besluit inrichtingen voor motorvoertuigen milieubeheer][ref3] of het Besluit tuinbouwbedrijven met bedekte teelt
