  - number: '8'
    text: |-
      1 Voor een inrichting die voor het tijdstip van inwerkingtreding van dit besluit is opgericht en waarvoor voor
      dat tijdstip een vergunning in werking en onherroepelijk was, blijven de voorschriften van die vergunning in
      verbinding met de gegevens die behoren bij de aanvraag en de aanvraag voorzover die deel uitmaakt van de vergunning
      en gegevens bevat die zich lenen voor opname of omzetting in voorschriften, gedurende drie jaar na het tijdstip
      van inwerkingtreding van dit besluit gelden als maatwerkvoorschriften als bedoeld in [artikel 6][ref1], behoudens
      wijziging of intrekking van die maatwerkvoorschriften, mits het voorschrift betrekking heeft op een onderwerp dat
      is genoemd in [artikel 6, eerste lid, onderdeel a][ref2].

      2 De maatwerkvoorschriften die voor het tijdstip van inwerkingtreding van dit besluit
      golden krachtens een vergunning, het [Besluit melkrundveehouderijen milieubeheer][ref3], het
      [Besluit akkerbouwbedrijven milieubeheer][ref4], het [Besluit inrichtingen voor motorvoertuigen milieubeheer][ref5]
      of het Besluit tuinbouwbedrijven met bedekte teelt milieubeheer voorzover laatstgenoemd besluit betrekking heeft op
      een inrichting die uitsluitend of in hoofdzaak bestemd is voor de witloftrek of de teelt van eetbare paddestoelen,
      blijven na het tijdstip van inwerkingtreding van dit besluit gelden als maatwerkvoorschriften als bedoeld in
      [artikel 6][ref6] van dit besluit, mits het voorschrift betrekking heeft op een onderwerp dat is genoemd in
      [artikel 6, eerste lid, onderdeel a][ref7].


