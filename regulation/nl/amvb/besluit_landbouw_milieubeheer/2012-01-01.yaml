  - number: '10'
    text: |-
      1 Met voorzieningen, toestellen en installaties genoemd in dit besluit of de bijlage worden gelijkgesteld
      voorzieningen, toestellen en installaties die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een
      andere lidstaat van de Europese Unie dan wel rechtmatig zijn vervaardigd of in de handel zijn gebracht in een
      staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe
      strekkend Verdrag dat Nederland bindt, en die voldoen aan eisen die een beschermingsniveau bieden dat ten minste
      gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.

      2 Met een verklaring, keuring of erkenning als bedoeld in dit besluit of de bijlage wordt gelijkgesteld een
      verklaring van goedkeuring, afgegeven door een onafhankelijke keuringsinstelling in een andere lidstaat van
      de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een
      daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, welke verklaring is afgegeven op basis
      van onderzoekingen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de
      nationale onderzoekingen wordt nagestreefd.

      3 Met de beroepseisen ter zake van controle, beoordeling, inspectie, onderhoud of afstelling als bedoeld in dit
      besluit of de bijlage worden gelijkgesteld beroepseisen die worden gesteld in een andere lidstaat van de Europese
      Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend
      of mede daartoe strekkend Verdrag dat Nederland bindt, en die een beroepsniveau waarborgen dat ten minste
      gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0020112/2012-01-01#Artikel10
