  - number: '4'
    text: |-
      1 Dit besluit is niet van toepassing op een inrichting waar landbouwhuisdieren worden gehouden die is opgericht:

      a. op of na 1 januari 2002 en waarvan een tot de inrichting behorend dierenverblijf geheel of gedeeltelijk is
      gelegen in een zeer kwetsbaar gebied in de zin van de [Wet ammoniak en veehouderij][ref1] of in een zone van 250
      meter rondom een zodanig gebied;

      b. voor 1 januari 2002 en waarvan een tot de inrichting behorend dierenverblijf geheel of gedeeltelijk is gelegen
      in een zeer kwetsbaar gebied in de zin van de [Wet ammoniak en veehouderij][ref2] of in een zone van 250 meter
      rondom een zodanig gebied, en waarvan het aantal gehouden landbouwhuisdieren van een of meer diercategorieën hoger
      is dan op 31 december 2001:

      1°. overeenkomstig een algemene maatregel van bestuur krachtens [artikel 8.40 van de Wet milieubeheer][ref3], zoals
      die op die datum luidde, in de veehouderij aanwezig mocht zijn, of

      2°. ingevolge een vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref4] in de veehouderij aanwezig
      mocht zijn.

      2 Dit besluit is niet van toepassing op een inrichting als bedoeld in [artikel 2][ref5] waar landbouwhuisdieren
      worden gehouden:

      a. die is gelegen op een afstand van minder dan 100 meter van een object categorie I of II, of

      b. die is gelegen op een afstand van minder dan 50 meter van een object categorie III, IV of V.

      3 In afwijking van het tweede lid is dit besluit van toepassing op:

      a. een inrichting die is gelegen op een afstand van minder dan 100 meter van een object categorie I of II, of op
      een afstand van minder dan 50 meter van een object categorie III, IV of V en die is opgericht voor het tijdstip van
      inwerkingtreding van dit besluit, indien:

      1°. per diercategorie het aantal landbouwhuisdieren dat gehouden wordt niet groter is dan het
      aantal landbouwhuisdieren van die diercategorie dat op grond van een vergunning of op grond van het
      [Besluit melkrundveehouderijen milieubeheer][ref6] of het [Besluit akkerbouwbedrijven milieubeheer][ref7] of het
      [Besluit landbouw milieubeheer][ref8] zoals dat luidde voor 1 oktober 2009 gehouden mocht worden, en

      2°. voor zover de afstand tot enig object categorie I of II, gelegen op een afstand van minder dan 100 meter van
      de inrichting, of tot enig object categorie III, IV of V, gelegen op een afstand van minder dan 50 meter van de
      inrichting, niet is afgenomen;

      b. een kinderboerderij die is gelegen op een afstand van minder dan 100 meter van een object categorie I of II, of
      op een afstand van minder dan 50 meter van een object categorie III, IV of V.

      4 De afstanden bedoeld in het tweede en het derde lid, worden gemeten vanaf de buitenzijde van een object categorie
      I, II, III, IV of V tot het dichtstbijzijnde emissiepunt van het dierenverblijf.

      5 Dit besluit is niet van toepassing op een inrichting die is opgericht na het tijdstip van inwerkingtreding van
      dit besluit en:

      a. die is gelegen op een afstand van minder dan 50 meter van een object categorie I of II, of

      b. die is gelegen op een afstand van minder dan 25 meter van een object categorie III, IV of V

      6 In afwijking van het vijfde lid is dit besluit van toepassing op:

      a. een inrichting die is gelegen op een afstand van minder dan 50 meter van een object categorie I of II,
      of op een afstand van minder dan 25 meter van een object categorie III, IV of V, die is opgericht voor
      het tijdstip van inwerkingtreding van dit besluit en waarvan de afstand die moet worden aangehouden op
      grond van een vergunning of op grond van het [Besluit melkrundveehouderijen milieubeheer][ref9] of het
      [Besluit akkerbouwbedrijven milieubeheer][ref10] of het Besluit bedekte teelt milieubeheer tot enig object
      categorie I of II, gelegen op een afstand van minder dan 50 meter van de inrichting, of tot enig object categorie
      III, IV of V, gelegen op een afstand van minder dan 25 meter van de inrichting, niet is afgenomen, en

      b. een kinderboerderij die is gelegen op een afstand van minder dan 50 meter van een object categorie I of II, of
      op een afstand van minder dan 25 meter van een object categorie III, IV of V.

      7 De afstanden bedoeld in het vijfde en zesde lid, worden gemeten vanaf het onderdeel van het bedrijf dat het
      dichtst bij het genoemde object is gelegen, waarbij een waterbassin, een watersilo, een warmwateropslagtank, in
      plastic folie verpakte veevoederbalen als bedoeld in voorschrift 2.3.4 van de bijlage en het erf niet als een
      zodanig onderdeel worden beschouwd.


