  - number: 1a
    text: Dit besluit strekt mede tot implementatie van de kaderrichtlijn afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0020112/2012-01-01#Artikel1a
  - number: '2'
    text: |-
      1 Dit besluit is van toepassing op:

      a. een melkrundveehouderij;

      b. een akkerbouw- of tuinbouwbedrijf met open grondteelt;

      c. een gemechaniseerd loonbedrijf;

      d. een paardenhouderij;

      e. een kinderboerderij;

      f. een kleinschalige veehouderij, en

      g. een inrichting die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] aangewezen
      categorie behoort en die uitsluitend of in hoofdzaak bestemd is voor:

      1°. witloftrek of teelt van eetbare paddestoelen of andere gewassen in een gebouw;

      2°. opslag van vaste mest, bloembollenafval, afgedragen gewas of gebruikt substraatmateriaal;

      3°. een spoelbassin.

      2 Dit besluit is eveneens van toepassing op een inrichting waarin sprake is van een samenstel van bedrijvigheden
      als bedoeld in het eerste lid, onderdelen a tot en met g.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0020112/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1.1'
  - number: '3'
    text: |-
      1 Dit besluit is niet van toepassing op een inrichting als bedoeld in [artikel 2][ref1], indien:

      a. meer dan 50 mestvarkeneenheden, daarbij niet meegerekend ten hoogste 50 schapen die gedurende de aflamperiode in
      de inrichting worden gehouden.

      b. meer dan 200 stuks melkrundvee worden gehouden, waarbij het aantal stuks vrouwelijk jongvee tot 2 jaar niet
      wordt meegeteld;

      c. meer dan 340 stuks vrouwelijk jongvee worden gehouden, of het totaal aantal gehouden stuks vrouwelijk jongvee
      tot 2 jaar en overig melkrundvee meer dan 340 stuks bedraagt;

      d. meer dan 50 geiten worden gehouden;

      e. meer dan 50 voedsters worden gehouden;

      f. pelsdieren bedrijfsmatig worden gehouden;

      g. meer dan 50 paarden worden gehouden;

      h. meer dan 50 landbouwhuisdieren, anders dan bedoeld in de onderdelen a tot en met g worden gehouden, tenzij de
      inrichting een kinderboerderij betreft;

      i. een permanente opstand van glas of van kunststof voor het telen van gewassen groter is dan 2.500 m2;

      j. afvalstoffen worden op- of overgeslagen, die niet binnen het eigen bedrijf zijn ontstaan, voorzover de
      inrichting beschikt over een opslagcapaciteit:

      1°. van meer dan 35 m3 voor de opslag van afvalstoffen, behoudens zand, grind en grond voor zover deze stoffen
      bedoeld en geschikt zijn voor nuttige toepassing;

      2°. voor de opslag van gevaarlijke afvalstoffen, of

      3°. van meer dan 1.000 m3 per jaar voor de overslag van afvalstoffen;

      k. een of meer werkplaatsen aanwezig zijn die in hoofdzaak worden gebruikt voor onderhoud, ondersteuning of
      reparatie van niet tot de inrichting behorende gebouwen, installaties, toestellen of voertuigen, van derden;

      l. bij de teelt van eetbare paddestoelen de teeltoppervlakte meer bedraagt dan 5.000 m2 of verse compost wordt
      gepasteuriseerd;

      m. apparatuur aanwezig is voor het verspuiten van gewasbeschermingsmiddelen of biociden met een vliegtuig;

      n. in de inrichting of een onderdeel daarvan voorzieningen of installaties aanwezig zijn voor het:

      1°. opslaan van meer dan 600 m3 vaste mest;

      2°. opslaan van meer dan 500 m3 strooizout;

      3°. opslaan of bewerken en verwerken van meer dan in totaal 2.000 m3 zand, grind en grond;

      4°. opslaan of bewerken en verwerken van zand, grind en grond dat niet afkomstig is van eigen werkzaamheden of niet
      wordt aangewend voor eigen werkzaamheden;

      5°. afleveren van LPG of aardgas voor tractie;

      6°. opslaan van verpakte gevaarlijke stoffen, niet zijnde vaste kunstmeststoffen, in een opslagvoorziening met een
      opslagcapaciteit van meer dan 10.000 kilogram;

      7°. opslaan van vloeibare gevaarlijke stoffen, vloeibare brandstoffen of afgewerkte olie in tanks, tenzij sprake
      is van:

      a. opslaan van vloeibare brandstoffen of afgewerkte olie in ondergrondse tanks met een gezamenlijke inhoud van ten
      hoogste 150 m3,

      b. opslaan van diesel, huisbrandolie, gasolie, lichte stookolie of afgewerkte olie in bovengrondse tanks in de
      buitenlucht met een gezamenlijke inhoud van ten hoogste 150 m3,

      c. opslaan van diesel, huisbrandolie, gasolie, lichte stookolie of afgewerkte olie in bovengrondse tanks inpandig
      met een gezamenlijke inhoud van ten hoogste 15 m3,

      d. opslaan van petroleum in een of meer bovengrondse tanks met een gezamenlijke inhoud van ten hoogste 1,5 m3, of

      e. opslaan van vloeibare kunstmeststoffen in bovengrondse tanks;

      8°. opslaan van gassen of gasmengsels in tanks, tenzij sprake is van de opslag van propaan waarop het
      [Besluit algemene regels voor inrichtingen milieubeheer][ref2] van toepassing is;

      9°. opslaan van dunne mest in mestbassins met een gezamenlijke oppervlakte van meer dan 750 m2, of een gezamenlijke
      inhoud van meer dan 2.500 m3;

      10°. beluchten, geforceerd vergisten of op andere wijze bewerken of verwerken, behoudens mengen of roeren, van
      dunne mest in mestbassins;

      11°. vullen van gasflessen met uitzondering van het vullen van gasflessen met propaan of butaan vanuit een gasfles
      van maximaal 150 liter van gasflessen met een inhoud kleiner dan 12 liter en met uitzondering van het vullen van
      persluchtflessen door middel van een compressor;

      12°. aflevering van andere motorbrandstoffen dan LPG of aardgas voor tractie, tenzij dit plaats vindt voor eigen
      gebruik;

      13°. verrichten in vast opgestelde voorzieningen en installaties van werkzaamheden met chemische
      gewasbeschermingsmiddelen voor derden;

      14°. verven van bloemen en planten; of

      15°. composteren van materiaal of het opslaan van afgedragen gewas of bloembollenafval met een totaal volume van
      meer dan 600 m3.

      o. kunstmeststoffen worden opgeslagen behorende tot groep 3 of groep 4 als bedoeld in PGS 7 of meer dan 50 ton
      kunstmeststoffen behorende tot groep 2 wordt opgeslagen als bedoeld in PGS 7;

      p. een of meer stookinstallaties, met uitzondering van een smidse, aanwezig zijn, die kunnen worden gebruikt voor
      het verstoken of verbranden van andere brandstoffen dan aardgas, propaangas, butaangas, gasolie of petroleum,
      tenzij sprake is van een open haard of houtkachel voor het verbranden van hout, die alleen is bedoeld voor
      sfeerverwarming;

      q. windenergie in elektrische energie wordt omgezet met een of meer windturbines;

      r. in de inrichting of een onderdeel daarvan:

      1°. een of meer stookinstallaties aanwezig zijn met een thermisch vermogen per installatie van 7.500 kilowatt of
      meer;

      2°. een warmtekrachtinstallatie aanwezig is met een gezamenlijk nominaal elektrisch vermogen van 10 megawatt of
      meer;

      s. koel- en vriesinstallaties of warmtepompen aanwezig zijn met een inhoud per installatie van meer dan 1.500
      kilogram ammoniak of van meer dan 100 kilogram propaan, butaan of mengsels van propaan of butaan;

      t. activiteiten of handelingen plaatsvinden als bedoeld in categorie 21 van
      [bijlage I, onder C, bij het Besluit omgevingsrecht][ref3].

      2 Dit besluit is eveneens niet van toepassing op een inrichting als bedoeld in [artikel 2][ref4], waarvoor
      krachtens [hoofdstuk 7 van de Wet milieubeheer][ref5] een milieueffectrapport is vereist.

      3 Dit besluit is eveneens niet van toepassing op een inrichting waarop het
      [Besluit externe veiligheid inrichtingen][ref6] van toepassing is.


