preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 21 oktober
    2005, nr. DJZ2005186687, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens Onze Minister van
    Landbouw, Natuur en Voedselkwaliteit;

    Gelet op richtlijn nr. 91/689/EEG van de Raad van 12 december 1991 betreffende gevaarlijke afvalstoffen (PbEG L
    377) en richtlijn nr. 91/271/EEG van de Raad van 21 mei 1991 betreffende stedelijk afvalwater (PbEG L 135) en de
    artikelen 8.40, 8.41, 8.42 en 21.8 van de Wet milieubeheer,

    De Raad van State gehoord (advies van 1 februari 2006, nr. W08.05.0478/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 6
    juli 2006, nr. DJZ2006282748, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens Onze Minister van
    Landbouw, Natuur en Voedselkwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020112/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *ADR:* op 30 september 1957 te Genève totstandgekomen Europese Overeenkomst betreffende het internationale
      vervoer van gevaarlijke stoffen over de weg (Trb. 1959, 171);
        - *afgedragen gewas:* gedeelte van het gewas dat resteert aan het einde van de teelt, nadat de voor consumptie
      bedoelde delen van het gewas zijn verwijderd;
        - *afgewerkte olie:* afgewerkte olie als bedoeld in [artikel 1 van het Besluit inzamelen afvalstoffen][ref1];
        - *akkerbouw- of tuinbouwbedrijf met open grondteelt:* inrichting die tot een krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref2] aangewezen categorie behoort en die deel uitmaakt van een
      bedrijf dat uitsluitend of in hoofdzaak is bestemd voor het telen van akkerbouwproducten of tuinbouwproducten op of
      in de open grond;
        - *ammoniakemissie:* emissie van ammoniak, uitgedrukt in kilogram NH per jaar;
        - *bevoegd gezag:* bestuursorgaan dat bevoegd is een vergunning te verlenen voor een inrichting als bedoeld in
      [artikel 2][ref3];
        - *bijlage:* bij dit besluit behorende bijlage;
        - *bodembedreigende stof:* stof die de bodem kan verontreinigen als bedoeld in paragraaf 3.1 van deel A3 van de
      NRB;
        - *compost:* een product dat geheel of grotendeels bestaat uit één of meer organische afvalstoffen die met behulp
      van micro-organismen zijn afgebroken en omgezet tot een zodanig stabiel eindprodukt dat daarin alleen nog een
      langzame afbraak van humeuze verbindingen plaatsvindt;
        - *composteren:* omzetten van plantaardig restmateriaal en hulpstoffen in compost;
        - *diercategorie:* categorie dieren, bedoeld in [bijlage 1 van de Regeling ammoniak en veehouderij][ref4];
        - *dierenverblijf:* al dan niet overdekte ruimte waarbinnen landbouwhuisdieren worden gehouden;
        - *dunne mest:* mest die verpompbaar is en die bestaat uit faeces of urine van landbouwhuisdieren, al dan niet
      vermengd met mors-, spoel-, schrob-, reinigings- of regenwater;
        - *gebruikt substraatmateriaal:* materiaal van natuurlijke of kunstmatige oorsprong, nadat het is gebruikt voor het
      telen van gewassen los van de grond;
        - *gemechaniseerd loonbedrijf:* inrichting die tot een krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref5] aangewezen categorie behoort en die deel uitmaakt van
      een bedrijf dat uitsluitend of in hoofdzaak agrarisch gemechaniseerd loonwerk, zoals cultuurtechnische werken,
      mestdistributie en grondverzet, en soortgelijke dienstverlening verricht;
        - *gevaarlijke stoffen:* stoffen, preparaten en voorwerpen, waarvan het vervoer volgens het ADR is verboden of
      slechts onder daarin opgenomen voorwaarden is toegestaan;
        - *huisvestingssysteem:* gedeelte van een dierenverblijf, waarin landbouwhuisdieren van één diercategorie op
      dezelfde wijze worden gehouden;
        - *kleinschalige veehouderij:* inrichting, die tot een krachtens
      [artikel 1.1, derde lid van de Wet milieubeheer][ref6] aangewezen categorie behoort en uitsluitend of in hoofdzaak
      is bestemd voor het houden van landbouwhuisdieren en waarin niet meer landbouwhuisdieren en geen andere categorieën
      landbouwhuisdieren worden gehouden dan genoemd in [artikel 3, eerste lid][ref7];
        - *maatwerkvoorschrift:* voorschrift als bedoeld in [artikel 8.42, eerste lid, van de Wet milieubeheer][ref8],
      inhoudende: a. een beschikking waarbij het bevoegd gezag aanvullende eisen stelt; dan wel b. een ontheffing waarbij
      het bevoegd gezag de daarbij aangewezen bepalingen niet van toepassing verklaart al dan niet onder het stellen van
      beperkingen of voorwaarden;
        - *melkrundvee:* 1°. melkvee, dat overwegend wordt gehouden voor de melkproductie, met inbegrip van de dieren
      die in de mestperiode worden gemolken, tijdens de lactatie worden gemest of zijn drooggezet en worden afgemest;
      2°. vrouwelijk vleesvee ouder dan 2 jaar, dat op een met melkvee vergelijkbare manier wordt gehouden voor de
      vleesproductie en het voortbrengen en zogen van kalveren; 3°. Vrouwelijk jongvee tot 2 jaar dat bestemd is om te
      worden gehouden als melkvee bedoeld onder 1° dan wel als vrouwelijk vleesvee bedoeld onder 2°;
        - *melkrundveehouderij:* inrichting die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref9]
      aangewezen categorie behoort en die uitsluitend of in hoofdzaak is bestemd voor het houden van melkrundvee;
        - *mestbassin:* reservoir bestemd voor het bewaren van dunne mest, dat niet geheel of gedeeltelijk is gelegen onder
      een stal;
        - *mestvarkeneenheid:* rekeneenheid voor geuremissie, bedoeld in de Richtlijn veehouderij en stankhinder 1996, nr.
      DWL/96057153, uitgegeven door het Ministerie van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;
        - *object categorie I:* 1°. bebouwde kom met stedelijk karakter; 2°. ziekenhuis, sanatorium en internaat, en 3°.
      objecten voor verblijfsrecreatie,
        - *object categorie II:* 1°. bebouwde kom of aaneengesloten woonbebouwing van beperkte omvang in een overigens
      agrarische omgeving; 2°. objecten voor dagrecreatie;
        - *object categorie III:* verspreid liggende niet-agrarische bebouwing die aan het betreffende buitengebied een
      overwegende woon- of recreatiefunctie verleent;
        - *object categorie IV:* 1°. woning behorend bij een agrarisch bedrijf, niet zijnde een veehouderij waar 50 of
      meer mestvarkeneenheden op grond van een vergunning of een algemene maatregel van bestuur aanwezig mogen zijn; 2°.
      verspreid liggende niet-agrarische bebouwing;
        - *object categorie V:* woning, behorend bij een veehouderij waar 50 of meer mestvarkeneenheden op grond van een
      vergunning of een algemene maatregel van bestuur aanwezig mogen zijn;
        - *paardenhouderij:* inrichting, die tot een krachtens [artikel 1.1, derde lid van de Wet milieubeheer][ref10]
      aangewezen categorie behoort uitsluitend of in hoofdzaak is bestemd voor het houden van paarden;
        - *PGS 7:* publicatie 7 in de Publicatiereeks gevaarlijke stoffen, getiteld «Opslag van vaste minerale anorganische
      meststoffen», uitgave oktober 2007;
        - *PGS 23:* publicatie 23 in de Publicatiereeks gevaarlijke stoffen, getiteld «Propaan, vulstations van butaan- en
      propaanflessen», uitgave juli 2005;
        - *spoelbassin:* voorziening bestemd voor de verwijdering van tarra van in de grond geteelde gewassen waarbij
      gebruik wordt gemaakt van een spoelmachine en een bezinkbassin;
        - *stookinstallatie:* stookinstallatie als bedoeld in het
      [Besluit emissie-eisen middelgrote stookinstallaties milieubeheer][ref11];
        - *vaste mest:* mest die geheel of gedeeltelijk bestaat uit faeces of urine van landbouwhuisdieren en die niet
      verpompbaar is, met uitzondering van compost;
        - *vergunning:* omgevingsvergunning voor een inrichting;
        - *warmtekrachtinstallatie:* stookinstallatie, bestemd voor het gelijktijdig opwekken van warmte en kracht waarbij
      de warmte nuttig wordt aangewend;
        - *vloeibare brandstof:* lichte olie, halfzware olie of gasolie als bedoeld in
      [artikel 26 van de Wet op de accijns][ref12].

      2 Onder objecten als bedoeld in het eerste lid, onderdelen v tot en met z, worden niet verstaan van een agrarisch
      bedrijf deel uitmakende kleinschalige terreinen die ter beschikking worden gesteld voor het plaatsen van enkele
      kampeermiddelen, waarbij onder kampeermiddelen worden verstaan onderkomens of voertuigen die bestemd of geschikt
      zijn voor recreatief nachtverblijf en die geen bouwwerk zijn in de zin van de [Woningwet][ref13].


