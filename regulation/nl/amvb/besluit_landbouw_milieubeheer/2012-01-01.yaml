  - number: '5'
    text: |-
      1 De voorschriften, bedoeld in de hoofdstukken 1 tot en met 3 van de bijlage gelden voor degene die de inrichting
      drijft. Die draagt er zorg voor dat de voorschriften worden nageleefd.

      2 Indien een voorschrift als bedoeld in de hoofdstukken 1 tot en met 3 van de bijlage inhoudt dat daarbij
      aangegeven middelen ter bescherming van het milieu worden toegepast, meldt degene die de inrichting drijft en die
      voornemens is andere middelen toe te passen, dat voornemen ten minste vier weken voordat hij die andere middelen
      zal toepassen aan het bevoegd gezag.

      3 Bij de melding worden aan het bevoegd gezag gegevens verstrekt waaruit blijkt dat met de toe te passen andere
      middelen een ten minste gelijkwaardige bescherming voor het milieu wordt bereikt.

      4 Het bevoegd gezag beslist of door toepassing van het andere middel een ten minste gelijkwaardige bescherming voor
      het milieu zal worden bereikt.
    url: https://wetten.overheid.nl/BWBR0020112/2012-01-01#Artikel5
  - number: '6'
    text: |-
      1 Het bevoegd gezag kan maatwerkvoorschriften stellen met betrekking tot:

      a. de in de bijlage opgenomen voorschriften voorzover dat in hoofdstuk 4 van die bijlage is aangegeven, en

      b. de aanwezigheid van brandbestrijdingsmiddelen, de veiligheid van toestellen en installaties voor gas of
      elektriciteit uitgezonderd verwarmings- en stookinstallaties, de veiligheid van de opslag van stoffen, de gevolgen
      van het verkeer van personen of goederen van en naar de inrichting en de nadelige gevolgen voor het milieu die de
      inrichting kan veroorzaken waarop paragraaf 1.9 van de bijlage betrekking heeft, indien dat is aangewezen in het
      belang van de bescherming van het milieu.

      2 Maatwerkvoorschriften gelden voor degene die de inrichting drijft. Die draagt er zorg voor dat de
      maatwerkvoorschriften wordt nageleefd.

      3 Het bevoegd gezag kan maatwerkvoorschriften wijzigen, aanvullen of intrekken indien het belang van de bescherming
      van het milieu zich daartegen niet verzet.

      4 Van de beschikking waarbij maatwerkvoorschriften worden gesteld krachtens dit besluit wordt kennisgegeven in een
      of meer dagbladen, nieuwsbladen of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0020112/2012-01-01#Artikel6
  - number: '7'
    text: |-
      1 Degene die voornemens is een inrichting op te richten, meldt dat ten minste vier weken voor de oprichting aan het
      bevoegd gezag.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting en het
      veranderen van de werking daarvan. Een melding is niet vereist, indien eerder een melding overeenkomstig dit
      artikel is gedaan en door het veranderen geen afwijking ontstaat ten opzichte van de bij die melding verstrekte
      gegevens.

      3 Bij de melding, bedoeld in het eerste en tweede lid, wordt vermeld:

      a. het adres van de inrichting;

      b. de naam en het adres van degene die de inrichting opricht, verandert of de werking daarvan verandert en van
      degene die de inrichting drijft of zal drijven;

      c. de aard en omvang van de activiteiten of processen binnen de inrichting;

      d. de indeling en de uitvoering van de inrichting;

      e. de aard, omvang en frequentie van de transportactiviteiten;

      f. de geluidsbronnen en per vast opgestelde voorziening of installatie de plaats waar deze wordt opgesteld, de
      gebruiksfrequentie en het bronvermogen;

      g. de plaats waar wordt geladen en gelost, en

      h. het tijdstip waarop de inrichting of de verandering daarvan in werking zal worden gebracht of de verandering van
      de werking daarvan verwezenlijkt zal zijn.

      4 Indien aannemelijk is dat het langtijdgemiddeld beoordelingsniveau of het piekniveau vanwege de geluidsbronnen
      hoger zal zijn dan de waarden, bedoeld in voorschrift 1.1.1, 1.1.2, 1.1.3 of 4.1.1 van de bijlage, kan het bevoegd
      gezag binnen vier weken na ontvangst van de melding besluiten dat een rapport van een onderzoek naar de akoestische
      situatie moet worden overgelegd.

      5 Het onderzoek richt zich met gebruikmaking van geluidmetingen of geluidberekeningen op de bestaande en te
      verwachten geluidniveaus en op maatregelen en voorzieningen die ertoe kunnen leiden dat de geluidniveaus de waarden
      bedoeld in voorschrift 1.1.1, 1.1.2, 1.1.3 of 4.1.1 van de bijlage niet zullen overschrijden.

      6 Indien aannemelijk is dat de geluidniveaus vanwege werkzaamheden en activiteiten een significante bijdrage
      leveren aan de totale geluidsbelasting, kan het bevoegd gezag binnen vier weken na ontvangst van de melding
      besluiten dat een rapport van een onderzoek naar de akoestische situatie moet worden overgelegd. Het onderzoek
      richt zich met gebruikmaking van geluidmetingen of geluidberekeningen op de bestaande en te verwachten
      geluidniveaus vanwege de werkzaamheden en activiteiten.

      7 Indien een toekomstige bodemverontreiniging als gevolg van de bedrijfsactiviteiten aannemelijk is, kan het
      bevoegd gezag binnen vier weken na ontvangst van de melding besluiten dat een rapport van een onderzoek naar
      de nulsituatie van de bodem moet worden overgelegd. Het onderzoek naar de nulsituatie richt zich op de stoffen
      die door de werkzaamheden ter plaatse een bedreiging voor de bodemkwaliteit vormen en op de plaatsen waar
      bodembedreigende handelingen plaatsvinden of zullen plaatsvinden.

      8 De gegevens, bedoeld in het derde lid, behoeven niet te worden verstrekt indien degene die de inrichting drijft
      die gegevens reeds aan het bevoegd gezag heeft verschaft en het bevoegd gezag over die gegevens beschikt. Degene
      die de melding doet, geeft bij de melding aan welke van de ingevolge dit artikel over te leggen gegevens hij reeds
      aan het bevoegd gezag heeft verschaft.

      9 Indien binnen de inrichting een bassin voor de opslag van dunne mest aanwezig is waarop de voorschriften uit
      het [Besluit mestbassins milieubeheer][ref1] niet van toepassing zijn, worden bij de melding tevens de volgende
      gegevens verstrekt:

      a. gegevens waaruit kan worden afgeleid of omstandigheden als bedoeld in [artikel 3, onder n, sub 9 en 10][ref2]
      zich voordoen en gegevens waaruit de noodzaak tot het stellen van maatwerkvoorschriften kan blijken;

      b. een door de installateur van het bassin verstrekte verklaring waaruit blijkt dat het bassin overeenkomstig de
      betreffende voorschriften van de bijlage is uitgevoerd en welke referentieperioden van toepassing zijn, en

      c. gegevens over de wijze van afdekken van het bassin.


      [ref1]: https://wetten.overheid.nl/BWBR0004990
      [ref2]: https://wetten.overheid.nl/BWBR0020112#Artikel3
