preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 21 oktober
    2005, nr. DJZ2005186687, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens Onze Minister van
    Landbouw, Natuur en Voedselkwaliteit;

    Gelet op richtlijn nr. 91/689/EEG van de Raad van 12 december 1991 betreffende gevaarlijke afvalstoffen (PbEG L
    377) en richtlijn nr. 91/271/EEG van de Raad van 21 mei 1991 betreffende stedelijk afvalwater (PbEG L 135) en de
    artikelen 8.40, 8.41, 8.42 en 21.8 van de Wet milieubeheer,

    De Raad van State gehoord (advies van 1 februari 2006, nr. W08.05.0478/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 6
    juli 2006, nr. DJZ2006282748, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens Onze Minister van
    Landbouw, Natuur en Voedselkwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.a
    text: |-
      afgedragen gewas: gedeelte van het gewas dat resteert aan het einde van de teelt, nadat de voor consumptie bedoelde
      delen van het gewas zijn verwijderd;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.b
    text: |-
      akkerbouw- of tuinbouwbedrijf met open grondteelt: inrichting die tot een krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] aangewezen categorie behoort en die deel uitmaakt van een
      bedrijf dat uitsluitend of in hoofdzaak is bestemd voor het telen van akkerbouwproducten of tuinbouwproducten op of
      in de open grond;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.1.c
    text: 'ammoniakemissie: emissie van ammoniak, uitgedrukt in kilogram NH per jaar;'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.d
    text: |-
      bevoegd gezag: bestuursorgaan dat bevoegd is een vergunning te verlenen voor een inrichting als bedoeld in
      [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020112#Artikel2
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020112
        artikel: '2'
  - number: 1.1.e
    text: 'bijlage: bij dit besluit behorende bijlage;'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.f
    text: 'brandbare vloeistof: stof in vloeibare toestand die een vlampunt heeft dat hoger ligt dan 55°C;'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.g
    text: |-
      compost: een product dat geheel of grotendeels bestaat uit één of meer organische afvalstoffen die met behulp van
      micro-organismen zijn afgebroken en omgezet tot een zodanig stabiel eindprodukt dat daarin alleen nog een langzame
      afbraak van humeuze verbindingen plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.h
    text: 'composteren: omzetten van plantaardig restmateriaal en hulpstoffen in compost;'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.i
    text: |-
      CPR 1: Richtlijn 1 van de Commissie Preventie van Rampen door Gevaarlijke Stoffen, getiteld «Nitraathoudende
      meststoffen, vervoer en opslag”, derde druk, uitgave 1991;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.j
    text: |-
      CPR 11-5: Richtlijn 11-5 van de Commissie Preventie van Rampen door Gevaarlijke Stoffen, getiteld «Propaan,
      vulstations van butaan- en propaanflessen», eerste druk, uitgave 1994;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.k
    text: |-
      diercategorie: categorie dieren, bedoeld in [bijlage 1 van de Regeling ammoniak en veehouderij][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013629
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013629
  - number: 1.1.l
    text: 'dierenverblijf: al dan niet overdekte ruimte waarbinnen landbouwhuisdieren worden gehouden;'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.m
    text: |-
      dunne mest: mest die verpompbaar is en die bestaat uit faeces of urine van landbouwhuisdieren, al dan niet vermengd
      met mors-, spoel-, schrob-, reinigings- of regenwater;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.n
    text: |-
      gebruikt substraatmateriaal: materiaal van natuurlijke of kunstmatige oorsprong, nadat het is gebruikt voor het
      telen van gewassen los van de grond;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.o
    text: |-
      gemechaniseerd loonbedrijf: inrichting die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1]
      aangewezen categorie behoort en die deel uitmaakt van een bedrijf dat uitsluitend of in hoofdzaak agrarisch
      gemechaniseerd loonwerk, zoals cultuurtechnische werken, mestdistributie en grondverzet, en soortgelijke
      dienstverlening verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.1.p
    text: |-
      gevaarlijke stof: stof die of preparaat dat bij of krachtens het
      [Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref1] is ingedeeld in een categorie als
      bedoeld in [artikel 34, tweede lid, van de Wet milieugevaarlijke stoffen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004220
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004220
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '34'
  - number: 1.1.q
    text: |-
      huisvestingssysteem: gedeelte van een dierenverblijf, waarin landbouwhuisdieren van één diercategorie op dezelfde
      wijze worden gehouden;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.r
    text: |-
      kleinschalige veehouderij: inrichting, die tot een krachtens [artikel 1.1, derde lid van de Wet milieubeheer][ref1]
      aangewezen categorie behoort en die deel uitmaakt van een bedrijf dat uitsluitend of in hoofdzaak is bestemd
      voor het houden van landbouwhuisdieren en waarin niet meer landbouwhuisdieren en geen andere categorieën
      landbouwhuisdieren worden gehouden dan genoemd in [artikel 3, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020112#Artikel3
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020112
        artikel: '3'
  - number: 1.1.s
    text: 'melkrundvee:'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.s.1°
    text: |-
      melkvee met bijbehorend vrouwelijk jongvee, dat overwegend wordt gehouden voor de melkproductie, met inbegrip van
      de dieren die in de mestperiode worden gemolken, tijdens de lactatie worden gemest of zijn drooggezet en worden
      afgemest;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.s.2°
    text: |-
      vrouwelijk vleesvee ouder dan 2 jaar met bijbehorend vrouwelijk jongvee, dat op een met melkvee vergelijkbare
      manier wordt gehouden voor de vleesproductie en het voortbrengen en zogen van kalveren;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.t
    text: |-
      melkrundveehouderij: inrichting die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1]
      aangewezen categorie behoort en die uitsluitend of in hoofdzaak is bestemd voor het houden van melkrundvee;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.1.u
