      mestbassin: reservoir bestemd voor het bewaren van dunne mest, dat niet geheel of gedeeltelijk is gelegen onder
      een stal;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.v
    text: |-
      mestvarkeneenheid: rekeneenheid voor geuremissie, bedoeld in de Richtlijn veehouderij en stankhinder 1996, nr.
      DWL/96057153, uitgegeven door het Ministerie van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.w
    text: 'object categorie I:'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.w.1°
    text: bebouwde kom met stedelijk karakter;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.w.2°
    text: ziekenhuis, sanatorium en internaat, en
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.w.3°
    text: objecten voor verblijfsrecreatie,
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.x
    text: 'object categorie II:'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.x.1°
    text: bebouwde kom of aaneengesloten woonbebouwing van beperkte omvang in een overigens agrarische omgeving;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.x.2°
    text: objecten voor dagrecreatie;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.y
    text: |-
      object categorie III: verspreid liggende niet-agrarische bebouwing die aan het betreffende buitengebied een
      overwegende woon- of recreatiefunctie verleent;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.z
    text: 'object categorie IV:'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.z.1°
    text: |-
      woning behorend bij een agrarisch bedrijf, niet zijnde een veehouderij waar 50 of meer mestvarkeneenheden op grond
      van een vergunning of een algemene maatregel van bestuur aanwezig mogen zijn;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.z.2°
    text: verspreid liggende niet-agrarische bebouwing;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.aa
    text: |-
      object categorie V: woning, behorend bij een veehouderij waar 50 of meer mestvarkeneenheden op grond van een
      vergunning of een algemene maatregel van bestuur aanwezig mogen zijn;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.ab
    text: |-
      paardenhouderij: inrichting, die tot een krachtens [artikel 1.1, derde lid van de Wet milieubeheer][ref1]
      aangewezen categorie behoort en die deel uitmaakt van een bedrijf dat uitsluitend of in hoofdzaak is bestemd voor
      het houden van paarden;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.1.ac
    text: |-
      spoelbassin: voorziening bestemd voor de verwijdering van tarra van in de grond geteelde gewassen waarbij gebruik
      wordt gemaakt van een spoelmachine en een bezinkbassin;
