    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel2
  - number: 2.1.d
    text: een paardenhouderij;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel2
  - number: 2.1.e
    text: een kinderboerderij;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel2
  - number: 2.1.f
    text: een kleinschalige veehouderij, en
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel2
  - number: 2.1.g
    text: |-
      een inrichting die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] aangewezen categorie
      behoort en die uitsluitend of in hoofdzaak bestemd is voor:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 2.1.g.1°
    text: witloftrek of teelt van eetbare paddestoelen of andere gewassen in een gebouw;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel2
  - number: 2.1.g.2°
    text: opslag van vaste mest, bloembollenafval, afgedragen gewas of gebruikt substraatmateriaal;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel2
  - number: 2.1.g.3°
    text: een spoelbassin.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel2
  - number: '2.2'
    text: |-
      Dit besluit is eveneens van toepassing op een inrichting waarin sprake is van een samenstel van bedrijvigheden als
      bedoeld in het eerste lid, onderdelen a tot en met g.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel2
  - number: '3.1'
    text: |-
      Dit besluit is niet van toepassing op een inrichting als bedoeld in [artikel 2][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020112#Artikel2
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020112
        artikel: '2'
  - number: 3.1.a
    text: |-
      meer dan 50 mestvarkeneenheden, daarbij niet meegerekend ten hoogste 50 schapen die gedurende de aflamperiode in de
      inrichting worden gehouden.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.b
    text: meer dan 200 stuks melkrundvee worden gehouden, exclusief bijbehorend vrouwelijk jongvee jonger dan 2 jaar;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.c
    text: meer dan 50 geiten worden gehouden;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.d
    text: meer dan 50 voedsters worden gehouden;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.e
    text: pelsdieren bedrijfsmatig worden gehouden;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.f
    text: meer dan 50 paarden worden gehouden;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.g
    text: |-
      meer dan 50 landbouwhuisdieren, anders dan bedoeld in de onderdelen a tot en met f worden gehouden, tenzij de
      inrichting een kinderboerderij betreft;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
