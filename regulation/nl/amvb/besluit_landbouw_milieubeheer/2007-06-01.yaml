    text: |-
      afvalstoffen worden op- of overgeslagen, die niet binnen het eigen bedrijf zijn ontstaan, voorzover de inrichting
      beschikt over een opslagcapaciteit:
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.i.1°
    text: |-
      van meer dan 35 m3 voor de opslag van afvalstoffen, behoudens zand, grind en grond van categorie 1 en 2 van het
      [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1] en van onbekende kwaliteit;


      [ref1]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
  - number: 3.1.i.2°
    text: voor de opslag van gevaarlijke afvalstoffen, of
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.i.3°
    text: van meer dan 1.000 m3 per jaar voor de overslag van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.j
    text: |-
      een of meer werkplaatsen aanwezig zijn die in hoofdzaak worden gebruikt voor onderhoud, ondersteuning of reparatie
      van niet tot de inrichting behorende gebouwen, installaties, toestellen of voertuigen, van derden;
