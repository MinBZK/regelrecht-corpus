      vaste mest: mest die geheel of gedeeltelijk bestaat uit faeces of urine van landbouwhuisdieren en die niet
      verpompbaar is, met uitzondering van compost;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
  - number: 1.1.ae
    text: |-
      vergunning: vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
