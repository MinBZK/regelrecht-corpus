    text: apparatuur aanwezig is voor het verspuiten van gewasbeschermingsmiddelen of biociden met een vliegtuig;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m
    text: 'in de inrichting of een onderdeel daarvan voorzieningen of installaties aanwezig zijn voor het:'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.1°
    text: opslaan van meer dan 600 m3 vaste mest;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.2°
    text: opslaan van meer dan 500 m3strooizout;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.3°
    text: opslaan of bewerken en verwerken van meer dan in totaal 2.000 m3 zand, grind en grond;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.4°
    text: |-
      opslaan of bewerken en verwerken van zand, grind en grond dat niet afkomstig is van eigen werkzaamheden of niet
      wordt aangewend voor eigen werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.5°
    text: afleveren van LPG of aardgas voor tractie;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.6°
    text: |-
      opslaan van gewasbeschermingsmiddelen of biociden als bedoeld in
      [artikel 1, eerste lid, onderdelen g en h, van de Bestrijdingsmiddelenwet 1962][ref1] met een capaciteit van 10.000
      kilogram of meer;


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel1
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '1'
  - number: 3.1.m.7°
    text: opslaan van gevaarlijke stoffen in emballage met een capaciteit van 10.000 kilogram of meer;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.8°
    text: |-
      opslaan van vloeibare gevaarlijke stoffen, vloeibare gevaarlijke afvalstoffen of brandbare vloeistoffen in tanks,
      tenzij sprake is van:
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.8°.a
    text: |-
      opslaan in een of meer ondergrondse tanks, waarop het [Besluit opslaan in ondergrondse tanks 1998][ref1] van
      toepassing is,


      [ref1]: https://wetten.overheid.nl/BWBR0009747
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009747
  - number: 3.1.m.8°.b
    text: opslaan van diesel, huisbrandolie, gasolie, lichte stookolie of afgewerkte olie in een of meer bovengrondse tanks,
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.8°.c
    text: |-
      opslaan van petroleum in een of meer bovengrondse tanks met een gezamenlijke inhoud van ten hoogste 15.000 liter,
      of
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.8°.d
    text: opslaan van vloeibare kunstmeststoffen in bovengrondse tanks;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.9°
    text: |-
      opslaan van gassen of gasmengsels in tanks, tenzij sprake is van opslag waarop het
      [Besluit voorzieningen en installaties milieubeheer][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012897
  - number: 3.1.m.10°
    text: |-
      opslaan van dunne mest in mestbassins met een gezamenlijke oppervlakte van meer dan 750 m2, of een gezamenlijke
      inhoud van meer dan 2.500 m3;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.11°
    text: |-
      beluchten, geforceerd vergisten of op andere wijze bewerken of verwerken, behoudens mengen of roeren, van dunne
      mest in mestbassins;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.12°
    text: |-
      vullen van gasflessen door middel van een vulstation anders dan de in richtlijn CPR 11-5 opgenomen type A of type
      B vulstations;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.13°
    text: |-
      aflevering van andere motorbrandstoffen dan LPG of aardgas voor tractie, tenzij dit plaats vindt voor eigen
      gebruik;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.14°
    text: |-
      verrichten in vast opgestelde voorzieningen en installaties van werkzaamheden met chemische
      gewasbeschermingsmiddelen voor derden;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.15°
    text: verven van bloemen en siergewassen; of
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.m.16°
    text: |-
      composteren van materiaal of het opslaan van afgedragen gewas of bloembollenafval met een totaal volume van meer
      dan 600 m3.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.n
    text: nitraathoudende kunstmeststoffen worden bewaard van de klassen A of B als bedoeld in CPR-1;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.o
    text: |-
      een of meer installaties of voorzieningen, met uitzondering van een smidse, aanwezig zijn, die kunnen worden
      gebruikt voor het verstoken of verbranden van andere brandstoffen dan aardgas, propaangas, butaangas, gasolie of
      petroleum, tenzij sprake is van een open haard of houtkachel voor het verbranden van hout, die alleen is bedoeld
      voor sfeerverwarming;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.p
    text: windenergie in elektrische energie wordt omgezet met een of meer windturbines;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.q
    text: 'in de inrichting of een onderdeel daarvan:'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.q.1°
    text: |-
      een of meer stooktoestellen voor verwarming aanwezig zijn met een thermisch vermogen per toestel van 7.500 kW of
      meer;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.q.2°
    text: een warmtekrachtopwekking aanwezig is met een gezamenlijk nominaal elektrisch vermogen van 10 MW of meer;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.r
    text: |-
      koel- en vriesinstallaties of warmtepompen aanwezig zijn met een capaciteit of een totale capaciteit van meer dan
      200 kilogram ammoniak of van meer dan 100 kilogram propaan, butaan of mengsels van propaan of butaan;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
  - number: 3.1.s
    text: |-
      activiteiten of handelingen plaatsvinden als bedoeld in
      [categorie 21, bijlage I, behorende bij het Inrichtingen- en vergunningenbesluit milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005829
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005829
  - number: '3.2'
    text: |-
      Dit besluit is eveneens niet van toepassing op een inrichting als bedoeld in [artikel 2][ref1], waarvoor krachtens
      [hoofdstuk 7 van de Wet milieubeheer][ref2] een milieu-effectrapport is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0020112#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020112
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '7'
  - number: '4.1'
    text: 'Dit besluit is niet van toepassing op een inrichting waar landbouwhuisdieren worden gehouden die is opgericht:'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
  - number: 4.1.a
    text: |-
      op of na 1 januari 2002 en waarvan een tot de inrichting behorend dierenverblijf geheel of gedeeltelijk is gelegen
      in een kwetsbaar gebied als bedoeld in [artikel 2 van de Wet ammoniak en veehouderij][ref1] of in een zone van 250
      meter rondom een zodanig gebied;


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel2
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '2'
  - number: 4.1.b
    text: |-
      voor 1 januari 2002 en waarvan een tot de inrichting behorend dierenverblijf geheel of gedeeltelijk is gelegen in
      een kwetsbaar gebied als bedoeld in [artikel 2 van de Wet ammoniak en veehouderij][ref1] of in een zone van 250
      meter rondom een zodanig gebied, en waarvan het aantal gehouden landbouwhuisdieren van een of meer diercategorieën
      hoger is dan op 31 december 2001:


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel2
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '2'
  - number: 4.1.b.1°
    text: |-
      overeenkomstig een algemene maatregel van bestuur krachtens [artikel 8.40 van de Wet milieubeheer][ref1], zoals die
      op die datum luidde, in de veehouderij aanwezig mocht zijn, of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 4.1.b.2°
    text: |-
      ingevolge een vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1] in de veehouderij aanwezig
      mocht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '4.2'
    text: |-
      Dit besluit is niet van toepassing op een inrichting waar landbouwhuisdieren worden gehouden met uitzondering van
      een kinderboerderij:
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
  - number: 4.2.a
    text: die is gelegen op een afstand van minder dan 100 meter van een object categorie I of II, of
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
  - number: 4.2.b
    text: die is gelegen op een afstand van minder dan 50 meter van een object categorie III, IV of V.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
  - number: '4.3'
    text: |-
      In afwijking van het tweede lid is dit besluit van toepassing op een inrichting die is gelegen op een afstand
      van minder dan 100 meter van een object categorie I of II, of op een afstand van minder dan 50 meter van een
      object categorie III, IV of V en die is opgericht voor het tijdstip van inwerkingtreding van dit besluit,
      indien het aantal landbouwhuisdieren dat gehouden wordt niet groter is dan het aantal landbouwhuisdieren dat
      op grond van een vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1] of op grond van het
      [Besluit melkrundveehouderijen milieubeheer][ref2] of het [Besluit akkerbouwbedrijven milieubeheer][ref3] gehouden
      mocht worden en voorzover de afstand tot het dichtstbijzijnde object categorie I, II, III, IV of V niet is
      afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005158
      [ref3]: https://wetten.overheid.nl/BWBR0006449
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005158
      - id: ref3
        bwb_id: BWBR0006449
  - number: '4.4'
    text: |-
      De afstanden bedoeld in het tweede en het derde lid, worden gemeten vanaf de buitenzijde van een object categorie
      I, II, III, IV of V tot het dichtstbijzijnde emissiepunt van het dierenverblijf.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
  - number: '4.5'
    text: |-
      Dit besluit is niet van toepassing op een inrichting waar geen landbouwhuisdieren worden gehouden en die is
      opgericht na het tijdstip van inwerkingtreding van dit besluit en:
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
  - number: 4.5.a
    text: die is gelegen op een afstand van minder dan 50 meter van een object categorie I of II, of
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
  - number: 4.5.b
    text: die is gelegen op een afstand van minder dan 25 meter van een object categorie III, IV of V
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
  - number: '4.6'
    text: |-
      In afwijking van het vijfde lid is dit besluit van toepassing op een inrichting waarin geen landbouwhuisdieren
      worden gehouden, die is gelegen op een afstand van minder dan 50 meter van een object categorie I of II,
      of op een afstand van minder dan 25 meter van een object categorie III, IV of V, die is opgericht voor
      het tijdstip van inwerkingtreding van dit besluit en waarvan de afstand die moet worden aangehouden op
      grond van een vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1] of op grond van het
      [Besluit melkrundveehouderijen milieubeheer][ref2] of het [Besluit akkerbouw-bedrijven milieubeheer][ref3] of
      het Besluit bedekte teelt milieubeheer tot het dichtstbijzijnde object categorie I, II, III, IV of V, niet is
      afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005158
      [ref3]: https://wetten.overheid.nl/BWBR0006449
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005158
      - id: ref3
        bwb_id: BWBR0006449
  - number: '4.7'
    text: |-
      De afstanden bedoeld in het vijfde en zesde lid, worden gemeten vanaf het onderdeel van het bedrijf dat het dichtst
      bij het genoemde object is gelegen, waarbij een waterbassin, een watersilo, een warmwateropslagtank en het erf niet
      als een zodanig onderdeel worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel4
  - number: '5.1'
    text: |-
      De voorschriften, bedoeld in de hoofdstukken 1 tot en met 3 van de bijlage gelden voor degene die de inrichting
      drijft. Die draagt er zorg voor dat de voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel5
  - number: '5.2'
    text: |-
      Indien een voorschrift als bedoeld in de hoofdstukken 1 tot en met 3 van de bijlage inhoudt dat daarbij aangegeven
      middelen ter bescherming van het milieu worden toegepast, meldt degene die de inrichting drijft en die voornemens
      is andere middelen toe te passen, dat voornemen ten minste vier weken voordat hij die andere middelen zal toepassen
      aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel5
  - number: '5.3'
    text: |-
      Bij de melding worden aan het bevoegd gezag gegevens verstrekt waaruit blijkt dat met de toe te passen andere
      middelen een ten minste gelijkwaardige bescherming voor het milieu wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel5
  - number: '5.4'
    text: |-
      Het bevoegd gezag beslist of door toepassing van het andere middel een ten minste gelijkwaardige bescherming voor
      het milieu zal worden bereikt.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel5
  - number: '6.1'
    text: 'Het bevoegd gezag kan nadere eisen stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel6
  - number: 6.1.a
    text: de in de bijlage opgenomen voorschriften voorzover dat in hoofdstuk 4 van die bijlage is aangegeven, en
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel6
  - number: 6.1.b
    text: |-
      de aanwezigheid van brandbestrijdingsmiddelen, de veiligheid van toestellen en installaties voor gas of
      elektriciteit, de veiligheid van de opslag van stoffen, de gevolgen van het verkeer van personen of goederen van en
      naar de inrichting en de nadelige gevolgen voor het milieu die de inrichting kan veroorzaken waarop paragraaf 1.9
      van de bijlage betrekking heeft, indien dat is aangewezen in het belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel6
  - number: '6.2'
    text: |-
      Nadere eisen gelden voor degene die de inrichting drijft. Die draagt er zorg voor dat de nadere eisen wordt
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel6
  - number: '6.3'
    text: |-
      Het bevoegd gezag kan nadere eisen wijzigen, aanvullen of intrekken indien het belang van de bescherming van het
      milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel6
  - number: '6.4'
    text: |-
      Van de beschikking waarbij nadere eisen worden gesteld krachtens dit besluit wordt kennisgegeven in een of meer
      dagbladen, nieuwsbladen of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel6
  - number: '7.1'
    text: |-
      Degene die voornemens is een inrichting op te richten, meldt dat ten minste vier weken voor de oprichting aan het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting en het
      veranderen van de werking daarvan. Een melding is niet vereist, indien eerder een melding overeenkomstig dit
      artikel is gedaan en door het veranderen geen afwijking ontstaat ten opzichte van de bij die melding verstrekte
      gegevens.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: '7.3'
    text: 'Bij de melding, bedoeld in het eerste en tweede lid, wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: 7.3.a
    text: het adres van de inrichting;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: 7.3.b
    text: |-
      de naam en het adres van degene die de inrichting opricht, verandert of de werking daarvan verandert en van degene
      die de inrichting drijft of zal drijven;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: 7.3.c
    text: de aard en omvang van de activiteiten of processen binnen de inrichting;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: 7.3.d
    text: de indeling en de uitvoering van de inrichting;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: 7.3.e
    text: de aard, omvang en frequentie van de transportactiviteiten;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: 7.3.f
    text: |-
      de geluidsbronnen en per vast opgestelde voorziening of installatie de plaats waar deze wordt opgesteld, de
      gebruiksfrequentie en het bronvermogen;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: 7.3.g
    text: de plaats waar wordt geladen en gelost, en
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: 7.3.h
    text: |-
      het tijdstip waarop de inrichting of de verandering daarvan in werking zal worden gebracht of de verandering van de
      werking daarvan verwezenlijkt zal zijn.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: '7.4'
    text: |-
      Indien aannemelijk is dat het langtijdgemiddeld beoordelingsniveau of het piekniveau vanwege de geluidsbronnen
      hoger zal zijn dan de waarden, bedoeld in voorschrift 1.1.1, 1.1.2 of 1.1.3 van de bijlage, kan het bevoegd gezag
      binnen vier weken na ontvangst van de melding besluiten dat een rapport van een onderzoek naar de akoestische
      situatie moet worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: '7.5'
    text: |-
      Het onderzoek richt zich met gebruikmaking van geluidmetingen of geluidberekeningen op de bestaande en te
      verwachten geluidniveaus en op maatregelen en voorzieningen die ertoe kunnen leiden dat de geluidniveaus de waarden
      bedoeld in voorschrift 1.1.1, 1.1.2 of 1.1.3 van de bijlage niet zullen overschrijden.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: '7.6'
    text: |-
      Indien aannemelijk is dat de geluidniveaus vanwege werkzaamheden en activiteiten hoger zullen zijn dan de waarden
      als bedoeld in voorschrift 1.1.1 of 1.1.2 van de bijlage, kan het bevoegd gezag binnen vier weken na ontvangst van
      de melding besluiten dat een rapport van een onderzoek naar de akoestische situatie moet worden overgelegd. Het
      onderzoek richt zich met gebruikmaking van geluidmetingen of geluidberekeningen op de bestaande en te verwachten
      geluidniveaus vanwege de werkzaamheden en activiteiten.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: '7.7'
    text: |-
      Indien een toekomstige bodemverontreiniging als gevolg van de bedrijfsactiviteiten aannemelijk is, kan het bevoegd
      gezag binnen vier weken na ontvangst van de melding besluiten dat een rapport van een onderzoek naar de nulsituatie
      van de bodem moet worden overgelegd. Het onderzoek naar de nulsituatie richt zich op de stoffen die door de
      werkzaamheden ter plaatse een bedreiging voor de bodemkwaliteit vormen en op de plaatsen waar bodembedreigende
      handelingen plaatsvinden of zullen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: '7.8'
    text: |-
      De gegevens, bedoeld in het derde lid, behoeven niet te worden verstrekt indien degene die de inrichting drijft die
      gegevens reeds aan het bevoegd gezag heeft verschaft en het bevoegd gezag over die gegevens beschikt. Degene die de
      melding doet, geeft bij de melding aan welke van de ingevolge dit artikel over te leggen gegevens hij reeds aan het
      bevoegd gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: '7.9'
    text: |-
      Indien binnen de inrichting een bassin voor de opslag van dunne mest aanwezig is waarop de voorschriften uit
      het [Besluit mestbassins milieubeheer][ref1] niet van toepassing zijn, worden bij de melding tevens de volgende
      gegevens verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0004990
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004990
  - number: 7.9.a
    text: |-
      gegevens waaruit kan worden afgeleid of omstandigheden als bedoeld in
      [artikel 3, eerste lid onder m, sub 10 en 11][ref1] zich voordoen en gegevens waaruit de noodzaak tot het stellen
      van nadere eisen kan blijken;


      [ref1]: https://wetten.overheid.nl/BWBR0020112#Artikel3
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020112
        artikel: '3'
  - number: 7.9.b
    text: |-
      een door de installateur van het bassin verstrekte verklaring waaruit blijkt dat het bassin overeenkomstig de
      betreffende voorschriften van de bijlage is uitgevoerd en welke referentieperioden van toepassing zijn, en
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: 7.9.c
    text: gegevens over de wijze van afdekken van het bassin.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel7
  - number: '8.1'
    text: |-
      Voor een inrichting die voor het tijdstip van inwerkingtreding van dit besluit is opgericht en waarvoor voor dat
      tijdstip een vergunning in werking en onherroepelijk was, blijven de voorschriften van die vergunning in verbinding
      met de gegevens die behoren bij de aanvraag en de aanvraag voorzover die deel uitmaakt van de vergunning en
      gegevens bevat die zich lenen voor opname of omzetting in voorschriften, gedurende drie jaar na het tijdstip van
      inwerkingtreding van dit besluit gelden als nadere eisen als bedoeld in [artikel 6][ref1], behoudens wijziging of
      intrekking van die nadere eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0020112#Artikel6
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020112
        artikel: '6'
  - number: '8.2'
    text: |-
      De nadere eisen die voor het tijdstip van inwerkingtreding van dit besluit golden krachtens een vergunning, het
      [Besluit melkrundveehouderijen milieubeheer][ref1], het [Besluit akkerbouwbedrijven milieubeheer][ref2], het
      [Besluit inrichtingen voor motorvoertuigen milieubeheer][ref3] of het Besluit tuinbouwbedrijven met bedekte teelt
      milieubeheer voorzover laatstgenoemd besluit betrekking heeft op een inrichting die uitsluitend of in hoofdzaak
      bestemd is voor de witloftrek of de teelt van eetbare paddestoelen, blijven na het tijdstip van inwerkingtreding
      van dit besluit gelden als nadere eisen als bedoeld in [artikel 6][ref4] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005158
      [ref2]: https://wetten.overheid.nl/BWBR0006449
      [ref3]: https://wetten.overheid.nl/BWBR0011409
      [ref4]: https://wetten.overheid.nl/BWBR0020112#Artikel6
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005158
      - id: ref2
        bwb_id: BWBR0006449
      - id: ref3
        bwb_id: BWBR0011409
      - id: ref4
        bwb_id: BWBR0020112
        artikel: '6'
  - number: '9.1'
    text: |-
      Indien op het tijdstip van inwerkingtreding van dit besluit een inrichting reeds was opgericht en voor die
      inrichting voor dat tijdstip geen vergunning in werking of onherroepelijk was of geen melding was gedaan krachtens
      het [Besluit melkrundveehouderijen milieubeheer][ref1], het [Besluit akkerbouwbedrijven milieubeheer][ref2], het
      [Besluit inrichtingen voor motorvoertuigen milieubeheer][ref3] of het Besluit tuinbouwbedrijven met bedekte teelt
      milieubeheer voorzover laatstgenoemd besluit betrekking heeft op een inrichting die uitsluitend of in hoofdzaak
      bestemd is voor de witloftrek of de teelt van eetbare paddestoelen, meldt degene die de inrichting drijft aan het
      bevoegd gezag dat hij de inrichting in werking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005158
      [ref2]: https://wetten.overheid.nl/BWBR0006449
      [ref3]: https://wetten.overheid.nl/BWBR0011409
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005158
      - id: ref2
        bwb_id: BWBR0006449
      - id: ref3
        bwb_id: BWBR0011409
  - number: '9.2'
    text: |-
      De melding, bedoeld in het eerste lid, geschiedt ten hoogste twaalf weken na het tijdstip van inwerkingtreding van
      dit besluit. [Artikel 7, derde tot en met het negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020112#Artikel7
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020112
        artikel: '7'
  - number: '9.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing, indien op het tijdstip van inwerkingtreding van dit besluit een
      aanvraag om een vergunning voor het oprichten van de inrichting door het bevoegd gezag in behandeling is genomen.
      De aanvraag om de vergunning wordt in dat geval aangemerkt als een melding als bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020112#Artikel7
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020112
        artikel: '7'
  - number: '10.1'
    text: |-
      Met voorzieningen, toestellen en installaties genoemd in dit besluit of de bijlage worden gelijkgesteld
      voorzieningen, toestellen en installaties die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een
      andere lidstaat van de Europese Unie dan wel rechtmatig zijn vervaardigd of in de handel zijn gebracht in een
      staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe
      strekkend Verdrag dat Nederland bindt, en die voldoen aan eisen die een beschermingsniveau bieden dat ten minste
      gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel10
  - number: '10.2'
    text: |-
      Met een verklaring, keuring of erkenning als bedoeld in dit besluit of de bijlage wordt gelijkgesteld een
      verklaring van goedkeuring, afgegeven door een onafhankelijke keuringsinstelling in een andere lidstaat van
      de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een
      daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, welke verklaring is afgegeven op basis
      van onderzoekingen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de
      nationale onderzoekingen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel10
  - number: '10.3'
    text: |-
      Met de beroepseisen ter zake van controle, beoordeling, inspectie, onderhoud of afstelling als bedoeld in dit
      besluit of de bijlage worden gelijkgesteld beroepseisen die worden gesteld in een andere lidstaat van de Europese
      Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend
      of mede daartoe strekkend Verdrag dat Nederland bindt, en die een beroepsniveau waarborgen dat ten minste
      gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel10
  - number: '11'
    text: |-
      Indien op grond van een vergunning die in werking of onherroepelijk was, het
      [Besluit melkrundveehouderijen milieubeheer][ref1], het [Besluit akkerbouwbedrijven milieubeheer][ref2], het
      [Besluit inrichtingen voor motorvoertuigen milieubeheer][ref3] of het Besluit tuinbouwbedrijven met bedekte teelt
      milieubeheer voorzover laatstgenoemd besluit betrekking heeft op een inrichting die uitsluitend of in hoofdzaak
      bestemd is voor de witloftrek of de teelt van eetbare paddestoelen, een termijn voor keuring niet is verstreken, is
      de termijn als bedoeld in dit besluit van toepassing vanaf het tijdstip na afloop van die termijn voor keuring.


      [ref1]: https://wetten.overheid.nl/BWBR0005158
      [ref2]: https://wetten.overheid.nl/BWBR0006449
      [ref3]: https://wetten.overheid.nl/BWBR0011409
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005158
      - id: ref2
        bwb_id: BWBR0006449
      - id: ref3
        bwb_id: BWBR0011409
  - number: '12'
    text: |-
      Het [Besluit akkerbouwbedrijven milieubeheer][ref1] en het [Besluit melkrundveehouderijen milieubeheer][ref2]
      worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006449
      [ref2]: https://wetten.overheid.nl/BWBR0005158
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006449
      - id: ref2
        bwb_id: BWBR0005158
  - number: '16'
    text: |-
      Na de inwerkingtreding van dit besluit berust de [Regeling slibvangputten en vetafscheiders][ref1] mede op
      voorschrift 1.3.13, onderdelen b en f, van de bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0010396
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010396
  - number: '18'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel18
  - number: '19'
    text: 'Dit besluit wordt aangehaald als: Besluit landbouw milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel19
