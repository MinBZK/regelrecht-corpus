      bij de teelt van eetbare paddestoelen de teeltoppervlakte meer bedraagt dan 5.000 m2 of verse compost wordt
      gepasteuriseerd;
    url: https://wetten.overheid.nl/BWBR0020112/2007-06-01#Artikel3
