    text: |-
      Onder objecten als bedoeld in het eerste lid, onderdelen v tot en met z, worden niet verstaan kampeerterreinen als
      bedoeld in [artikel 8, tweede lid, onderdeel a, of derde lid, van de Wet op de openluchtrecreatie][ref1], gebouwen
      of als kamphuis of blokhut aan te merken bouwwerken, voorzover die gebouwen of bouwerken deel uitmaken van een
      agrarisch verblijf en bestemd zijn voor het houden van recreatief nachtverblijf.


