        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002506
        artikel: '7'
        paragraaf: '3'
  - number: '4'
    text: |-
      1 De verstrekking van de gegevens moet geschieden door inzending van twee afschriften van de gesloten schriftelijke
      overeenkomst, dan wel, indien de overeenkomst mondeling is gesloten, door inzending van een formulier in tweevoud,
      waarop de gegevens bedoeld in [artikel 3][ref1] zijn vermeld.

      2 Onze Minister kan modellen voor het formulier, bedoeld in het eerste lid, vaststellen en nadere aanwijzingen
      geven over de wijze van invullen der gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002506#Artikel3
    url: https://wetten.overheid.nl/BWBR0002506/2002-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002506
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: |-
      Onze Minister draagt zorg, dat de datum van ontvangst op de ingezonden afschriften of op de ingezonden formulieren
      wordt aangetekend.
    url: https://wetten.overheid.nl/BWBR0002506/2002-07-01#Artikel5
  - number: '6'
    text: |-
      In afwijking van het bepaalde in [artikel 2][ref1] behoeven geen gegevens te worden verstrekt van de volgende
      overeenkomsten:

      a. een overeenkomst betreffende vervoer over de weg of over de binnenwateren over een afstand van minder dan 50 km;

      b. een overeenkomst betreffende vervoer van een zending met een betalend gewicht van minder dan 5000 kg;

      c. een overeenkomst betreffende vervoer over de binnenwateren tussen in Nederland gelegen plaatsen, welke door
      tussenkomst, als bedoeld in artikel 65, eerste lid, der Wet Goederenvervoer Binnenscheepvaart, van of vanwege de
      Rijksinspecteur is gesloten of tot het sluiten waarvan goedkeuring, als bedoeld in artikel 65, derde lid, der Wet
      Goederenvervoer Binnenscheepvaart, door of vanwege de Rijksinspecteur is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002506#Artikel2
    url: https://wetten.overheid.nl/BWBR0002506/2002-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002506
        artikel: '2'
        paragraaf: '2'
  - number: '7'
    text: |-
      1 Onze Minister of de door deze daartoe aangewezen instanties of ambtenaren doen op aanvraag mededeling dan wel
      verlenen op aanvraag inzage aan elke deelnemer aan de gemeenschappelijke markt, van de door de vervoerondernemers
      verstrekte gegevens, omschreven in [artikel 3, eerste lid, onder ][ref1], inzake overeenkomsten betreffende vervoer
      van kolen of staal, met uitzondering van:

      a. overeenkomsten betreffende vervoer van kolen per spoor van mijn tot mijn binnen Nederland;

      b. overeenkomsten betreffende vervoer van kolen per spoor van een der mijnen in de provincie Limburg naar de haven
      te Born;

      c. overeenkomsten betreffende vervoer over de binnenwateren tussen in Nederland gelegen plaatsen;

      d. overeenkomsten, waarvan de gegevens door meer dan een vervoerondernemer zijn verstrekt, terwijl een van
      hen daarbij als de opdrachtgever is vermeld, mits deze overeenkomsten strekken tot uitvoering van een reeds
      eerder door laatstbedoelde vervoerondernemer aangemelde overeenkomst betreffende vervoer over de weg of over de
      binnenwateren over een tijdruimte van meer dan dertig dagen en het aannemelijk is, dat deze vervoerondernemer ten
      tijde van het sluiten van deze overeenkomst in staat was ten minste 20% van het vervoer van kolen en staal, voor
      de uitvoering waarvan hij verplichtingen op zich heeft genomen, zelf te verrichten met eigen vervoermiddelen of met
      vervoermiddelen, welke hem gedurende ten minste één jaar uitsluitend ter beschikking staan.

      2 In afwijking van het bepaalde in het vorige lid wordt van de in dit lid bedoelde gegevens, welke betrekking
      hebben op overeenkomsten betreffende vervoer van kolen of staal per spoor tussen in Nederland gelegen plaatsen over
      een afstand van minder dan 50 km uitsluitend mededeling gedaan of inzage verleend

      a. aan een producent van kolen of staal, gevestigd binnen de Europese Gemeenschap voor Kolen en Staal,

      alsmede

      b. aan een handelaar, die hetzij direct, hetzij door toepassing van artikel 63 van het Verdrag tot oprichting van
      de Europese Gemeenschap voor Kolen en Staal, is onderworpen aan het bepaalde in artikel 60 van dit Verdrag en aan
      de uitvoeringsbeschikkingen van dit artikel.

      3 Gegevens betreffende overeenkomsten, waarvan de geldigheidsduur meer dan zes jaren is verstreken, worden niet
      meer medegedeeld of ter inzage gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002506#Artikel3
    url: https://wetten.overheid.nl/BWBR0002506/2002-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002506
        artikel: '3'
        paragraaf: '2'
  - number: '8'
    text: |-
      Onze Minister of de door deze daartoe aangewezen instanties of ambtenaren delen op aanvraag aan een in
      [artikel 7, tweede lid, onder ][ref1], bedoelde producent of handelaar mede, welke van de in [artikel 7][ref2]
      bedoelde gegevens betrekking hebben op het vervoer van kolen of staal, verkocht door zijn concurrent aan een koper,
      met wie hij op het punt staat eveneens een overeenkomst tot koop en verkoop van kolen of staal te sluiten, met het
      oog op de uitoefening door de aanvrager van het recht van prijsaanpassing, voortvloeiende uit artikel 60, tweede
      lid, onder *b,* van het Verdrag tot oprichting van de Europese Gemeenschap voor Kolen en Staal.


      [ref1]: https://wetten.overheid.nl/BWBR0002506#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002506#Artikel7
    url: https://wetten.overheid.nl/BWBR0002506/2002-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002506
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002506
        artikel: '7'
        paragraaf: '3'
  - number: '9'
    text: |-
      Het verstrekken van inlichtingen ingevolge [de artikelen 7][ref1] en [8][ref2] kan door Onze Minister worden
      geweigerd, indien het aan de betrokken aanvrager is te wijten, dat de aan hem ingevolge een eerdere aanvraag
      verstrekte inlichtingen zijn gebruikt voor doeleinden, die niet zijn eigen deelneming aan de gemeenschappelijke
      markt betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002506#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002506#Artikel8
    url: https://wetten.overheid.nl/BWBR0002506/2002-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002506
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002506
        artikel: '8'
        paragraaf: '3'
  - number: '10'
    text: |-
      1 Van de overeenkomsten betreffende vervoer van zendingen kolen of staal met een betalend gewicht van 5000 kg
      of meer over een afstand van 50 km of meer over de binnenwateren tussen in Nederland gelegen plaatsen worden de
      gegevens, omschreven in [artikel 3, eerste lid, onder ][ref1], onmiddellijk na het afsluiten der overeenkomsten dan
      wel onmiddellijk na ontvangst der gegevens schriftelijk door middel van aanplakking bekend gemaakt.

      2 Onze Minister wijst de plaatsen aan, waar door of vanwege de Rijksinspecteur de aanplakking zal geschieden
      en stelt de tijdsduur daarvan vast. Voorts kan Onze Minister nadere voorschriften geven omtrent de wijze van
      aanplakking en omtrent de vorm en inhoud van het geschrift, dat wordt aangeplakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002506#Artikel3
    url: https://wetten.overheid.nl/BWBR0002506/2002-07-01#Artikel10
    references:
