        artikel: '3'
        paragraaf: '2'
  - number: '14'
    text: |-
      Onze Minister stelt de Hoge Autoriteit op haar verzoek in kennis van alle gegevens, bedoeld in
      [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002506#Artikel3
    url: https://wetten.overheid.nl/BWBR0002506/2002-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002506
        artikel: '3'
        paragraaf: '2'
  - number: '15'
    text: |-
      Dit besluit is niet van toepassing ten aanzien van overeenkomsten inzake vervoer over de wateren, waarop de Acte
      van Mannheim van 1868 van toepassing is, voor zover zij vervoer met binnenschepen van onderdanen van andere staten
      dan Nederland en van rechtspersonen opgericht naar buitenlands recht of vervoer tussen Nederland en een ander land
      van de Europese Gemeenschap voor Kolen en Staal betreffen.
    url: https://wetten.overheid.nl/BWBR0002506/2002-07-01#Artikel15
  - number: '17'
    text: Dit besluit kan worden aangehaald onder de titel "Uitvoeringsbesluit vrachtprijzen vervoer van kolen en staal".
    url: https://wetten.overheid.nl/BWBR0002506/2002-07-01#Artikel17
  - number: '18'
    text: |-
      De artikelen van dit besluit treden in werking met ingang van een door Ons te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002506/2002-07-01#Artikel18
