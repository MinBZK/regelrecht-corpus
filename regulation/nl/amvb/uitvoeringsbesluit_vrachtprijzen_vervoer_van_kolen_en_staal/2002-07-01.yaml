preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 11 augustus 1965, no. A-2/031447
    Directoraat-Generaal van het Verkeer;

    Gelet op de artikelen 3 en 4 van de Wet vrachtprijzen vervoer van kolen en staal;

    De Raad van State gehoord (advies van 8 september 1965, no. 37);

    Gezien het nader rapport van de voornoemde Staatssecretaris van 15 november 1965, no. A-2/032741, Directoraat-
    Generaal van het Verkeer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002506/2002-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      b. Hoge Autoriteit: de Hoge Autoriteit, ingesteld bij het Verdrag tot oprichting van de Europese Gemeenschap voor
      Kolen en Staal (*Trb.* 1951, 82);

      c. kolen en staal: kolen en staal als bedoeld in artikel 81 van het Verdrag tot oprichting van de Europese
      Gemeenschap voor Kolen en Staal;

      d. vervoerondernemer: een ondernemer, die vervoer van kolen of staal tegen vergoeding per spoor, over de weg of
      over de binnenwateren verricht;

      e. deelnemer aan de gemeenschappelijke markt: een producent van, een handelaar in en een koper van kolen of staal,
      gevestigd binnen de Europese Gemeenschap voor Kolen en Staal;

      f. zending: een hoeveelheid kolen of staal, welke ten behoeve van één opdrachtgever op één vervoerdocument naar één
      geadresseerde wordt vervoerd, dan wel, bij gebreke van een zodanig document, een hoeveelheid kolen of staal, welke
      ten behoeve van één opdrachtgever gezamenlijk naar één geadresseerde wordt vervoerd;

      g. betalend gewicht: het gewicht, dat als grondslag dient voor de vrachtprijsberekening;

      h. afstand: de tariefafstand, overeenkomstig de voor het betrokken vervoer toepasselijke tariefvoorschriften, dan
      wel bij gebreke van wettelijk voorgeschreven tarieven of een daarbij gegeven tariefafstand de werkelijke afstand,
      waarover de zending wordt vervoerd;

      i. week: kalenderweek;

      j. Rijksinspecteur: de door Onze Minister aangewezen ambtenaar van de divisie Vervoer van de Inspectie Verkeer
      en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0002506/2002-07-01#Artikel1
  - number: '2'
    text: |-
      1 De in Nederland gevestigde vervoerondernemer is verplicht aan Onze Minister of aan de door deze daartoe
      aangewezen ambtenaren schriftelijk gegevens, als nader omschreven in [artikel 3][ref1], te verstrekken over door
      hem afgesloten overeenkomsten, als bedoeld in het tweede en vijfde lid, betreffende vervoer van kolen en van staal,
      indien en voor zover deze overeenkomsten betrekking hebben op vervoer tussen in Nederland gelegen plaatsen of op
      vervoer tussen Nederland en een ander land, behorende tot de Europese Gemeenschap voor Kolen en Staal, dan wel
      op vervoer per spoor in doorvoer door Nederland, onverschillig of hijzelf dan wel een andere vervoerondernemer
      het vervoer zal verrichten. Een gelijke verplichting rust op de in het buitenland gevestigde vervoerondernemer,
      indien en voor zover de door hem afgesloten overeenkomsten betrekking hebben op vervoer tussen in Nederland gelegen
      plaatsen.

      2 De verplichting, bedoeld in het eerste lid, geldt, voorzover betreft de overeenkomsten betreffende vervoer per
      spoor dan wel over de weg, slechts ten aanzien van die overeenkomsten, waarbij een vrachtprijs is vastgesteld,
      welke afwijkt van een door Onze Minister te bepalen en in de *Nederlandse Staatscourant* te publiceren grens.

      3 De inzending van de gegevens bedoeld in het eerste lid, inzake overeenkomsten betreffende vervoer per spoor, over
      de weg of over de binnenwateren over een tijdruimte van meer dan dertig dagen, moet geschieden onmiddellijk na het
      sluiten van de overeenkomst.

      4 De vervoerondernemer is verplicht het annuleren van een overeenkomst, als bedoeld in het derde
      lid, alsmede een wijziging van of een aanvulling op een zodanige overeenkomst, welke betreft de in
      [artikel 3, eerste lid, onder ][ref2] bedoelde gegevens, onmiddellijk na het tijdstip, waarop het annuleren plaats
      vond dan wel de wijziging of de aanvulling tot stand kwam, schriftelijk mede te delen aan Onze Minister of aan de
      door deze daartoe aangewezen ambtenaren.

      5 De inzending van de gegevens, bedoeld in het eerste lid, inzake de overeenkomsten betreffende vervoer over de weg
      of over de binnenwateren over een tijdruimte van ten hoogste vier weken, welke in één week zijn afgesloten, moet
      geschieden uiterlijk op de tweede werkdag van de volgende week. Deze gegevens moeten worden verstrekt onverschillig
      of de overeenkomst nog moet worden uitgevoerd, dan wel reeds geheel of ten dele is uitgevoerd.

      6 De vervoerondernemer is verplicht het annuleren van een overeenkomst, als bedoeld in het vorige lid, waarvan
      reeds gegevens zijn verstrekt, alsmede een wijziging van of een aanvulling op een zodanige overeenkomst, welke
      betreft de in [artikel 3, eerste lid, onder ][ref3] bedoelde gegevens, binnen een week na het tijdstip, waarop het
      annuleren plaats vond dan wel de wijziging of de aanvulling tot stand kwam, schriftelijk mede te delen aan Onze
      Minister of aan de door deze daartoe aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002506#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002506#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002506#Artikel3
