  - number: '3'
    text: |-
      1 Van iedere overeenkomst, waarvoor de in [artikel 2, eerste lid][ref1], bedoelde verplichting bestaat, moeten van
      de daarin voorkomende gegevens de volgende worden verstrekt:

      a. naam en adres van de vervoerondernemer;

      b. naam en adres van de opdrachtgever;

      c. naam en adres van de geadresseerde;

      d. de datum van afsluiting en de geldigheidsduur van de overeenkomst;

      e. aard en betalend gewicht van de goederen;

      f. plaats van lading en plaats van lossing;

      g. afstand;

      h. de vrachtprijs of de wijze van berekening van de vrachtprijs;

      i. overige vervoervoorwaarden;

      j. de datum waarop of het tijdvak waarin het vervoer wordt verricht;

      k. wijze van vervoer (per spoor, over de weg of over de binnenwateren, dan wel een combinatie van twee of meer
      vervoertakken).

      2 In de gevallen, dat de vervoerondernemer van mening is, dat het bepaalde in [artikel 7, eerste lid, onder ][ref2]
      toepassing behoort te vinden, moet hij dit aangeven bij de inzending der gegevens van de desbetreffende
      overeenkomsten en desgevraagd de nodige aanvullende gegevens verstrekken, die zulks aannemelijk maken.

      3 De gegevens moeten zo volledig mogelijk en naar waarheid worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002506#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002506#Artikel7
    url: https://wetten.overheid.nl/BWBR0002506/2002-07-01#Artikel3
    references:
      - id: ref1
