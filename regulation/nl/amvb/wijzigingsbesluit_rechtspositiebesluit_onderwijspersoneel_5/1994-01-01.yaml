  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs en Wetenschappen van 5 maart 1993, nr. 93004765, directie
    Arbeidsvoorwaarden en Beroepskwaliteit, gedaan mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op de artikelen 20, tweede lid, en 32 van de Wet op het basisonderwijs;

    de artikelen 28, tweede lid, en 42 van de Interimwet op het speciaal onderwijs en het voortgezet speciaal
    onderwijs;

    de artikelen 38 en 39, tweede lid, 61, 78 en 79, achtste en negende lid, van de Wet op het voortgezet onderwijs;

    artikel 23, tweede en derde lid, van de Wet op het leerlingwezen;

    de artikelen 55, tweede lid, en 76 van de Wet op het hoger beroepsonderwijs;

    artikel 4 van de Experimentenwet onderwijs;

    de artikelen 9, 11, vierde lid, en 45, vijfde lid, van de Kaderwet Volwasseneneducatie 1991;

    artikel 58, tweede en derde lid, van de Wet op de onderwijsverzorging;

    de artikelen 4.5, 4.6, 9.74, 11.12, 12.5, 13.1.5, 16.23 en 16.27 van de Wet op het hoger onderwijs en
    wetenschappelijk onderzoek;

    de artikelen 14 en 35 van de Wet op de nederlandse organisatie voor Wetenschappelijk onderzoek;

    de artikelen 125 en 126 van de Ambtenarenwet 1929;

    De Raad van State gehoord (advies van 20 juli 1993, nr. W05.93.0147);

    Gezien het nader rapport van Onze Minister van Onderwijs en Wetenschappen van 12 november 1993, nr. 93063831,
    uitgebracht mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
