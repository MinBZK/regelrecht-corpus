      2 In afwijking van het bepaalde in het eerste lid, werkt het bepaalde
      in[ artikel I, onderdeel A, onder 1, sub ][ref1], alsmede artikel IV, terug tot en met 1 januari 1992.

      3 In afwijking van het bepaalde in het eerste lid, werkt het bepaalde in
      [artikel I, onderdeel C, onder 19, sub ][ref2] en [artikel III][ref3], terug tot en met 1 juni 1992.

      4 In afwijking van het bepaalde in het eerste lid, werkt het bepaalde in
      [artikel I, onderdeel B, onder 1, onderdeel E, onder 1, 2, 3, sub ][ref4], [artikel V][ref5] en [artikel VI][ref6],
      teruig tot en met 1 augustus 1992.

      5 In afwijking van het bepaalde in het eerste lid, werkt het bepaalde in
      [artikel I, onderdeel C, onder 26, en onderdeel T][ref7], terug tot en met 1 maart 1993.

      6 In afwijking van het bepaalde in het eerste lid, werkt het bepaalde in [artikel I, onderdeel A, onder 2][ref8],
      terug tot en met 1 april 1993.

