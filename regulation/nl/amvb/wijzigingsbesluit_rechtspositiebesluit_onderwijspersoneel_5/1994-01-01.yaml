articles:
  - number: II
    text: |-
      1 In dit artikel wordt verstaan onder:

      a. Rechtspositiebesluit: Het [Rechtspositiebesluit onderwijspersoneel][ref1];

      b. belanghebbende:

      1. een belanghebbende, bedoeld in artikel I-S201, eerste lid, die op 1 januari 1994 is benoemd aan een instelling
      als bedoeld in artikel I-A1, onder *d*1, en sedert 31 december 1985 zonder onderbreking aan dezelfde instelling
      benoemd is gebleven.

      2. een belanghebbende, bedoeld in artikel I-S301, onderdeel *c*2, die op 1 januari 1994 is benoemd aan een
      instelling als bedoeld in artikel I-A1, onder *d*2, en sedert 31 december 1985 zonder onderbreking aan dezelfde
      instelling benoemd is gebleven.

      c. schaalsalaris: een bedrag in een schaal dat behoort bij een normbetrekking.

      2 Het bepaalde in de overige leden van dit artikel is niet van toepassing ten aanzien van de belanghebbende wiens
      betrekking op zijn verzoek op 31 december 1993 wordt beëindigd en die aansluitend wordt belast met een functie
      waarbij een maximumschaal behoort die lager is dan de maximumschaal die behoort bij de functie die hem zou kunnen
      worden toebedeeld. De belanghebbende wordt in dat geval voor de toepassing van het bepaalde in de hoofdstukken I-P
      tot en met I-S van het Rechtspositiebesluit aangemerkt als een belanghebbende die in dienst treedt.

      3 De aan de hand van dit artikel uit te voeren berekeningen geschieden op basis van het loonpeil dat geldt op 31
      december 1993.

      4 Indien de belanghebbende op 31 december 1993 verlof volgens het bepaalde in een of meer der hoofdstukken I-C, I-D
      of I-E genoot, wordt dat verlof alsmede de daarmee samenhangende vermindering van de bezoldiging voor de toepassing
      van het bepaalde in de overige bepalingen van dit artikel buiten beschouwing gelaten.

      5 Ten aanzien van de belanghebbende op wiens bezoldiging op de dag voorafgaande aan de overgang, in verband met
      andere door hem genoten inkomsten een anticumulatie als bedoeld in het Rechtspositiebesluit dan wel enige andere
      daarmee overeenkomende regeling, werd toegepast, wordt die anticumulatie voor de toepassing van het bepaalde in de
      overige bepalingen van dit artikel buiten beschouwing gelaten.

      6 Voor de belanghebbende wordt op 1 januari 1994 een schaalsalaris vastgesteld in de hoogst mogelijke schaal
      die bij zijn functie behoort, dat zo dicht mogelijk ligt bij en tenminste gelijk is aan het salaris bij een
      normbetrekking dat voor hem op 31 december 1993 gold.

      7 Indien het salaris van een belanghebbende bij een normbetrekking op 31 december 1993 hoger is dan het hoogste
      bedrag in de bij zijn functie behorende maximumschaal, geschiedt de inpassing op een schaalsalaris dat zo dicht
      mogelijk ligt bij en tenminste gelijk is aan zijn salaris bij een normbetrekking op 31 december 1993 en wel in de
      laagste schaal waarvan het maximum gelijk is aan of hoger is dan dat salaris bij normbetrekking.

      8 Voor de belanghebbende wordt een uitzicht op salarisvaststelling na 31 december 1993 vastgesteld op het
      maximumsalaris behorende bij een normbetrekking dat voor hem volgens de op 31 december 1993 geldende regeling gold,
      voor zover dat maximumsalaris hoger zou zijn dan het hoogste bedrag in de bij zijn functie behorende maximumschaal.

      9 Het in het achtste lid bedoelde uitzicht wordt uitgedrukt in het nummer van de schaal en het salarisnummer binnen
      die schaal waarbij het bedrag waarop uitzicht wordt gegeven, is vermeld.

      10 Het in het negende lid bedoelde bedrag is een schaalsalaris, dat zo dicht mogelijk ligt bij het ingevolge het
      negende lid vast te stellen bedrag bij een normbetrekking op 31 december 1993, in de laagste schaal waarvan het
      maximum gelijk is aan of hoger dan het bedrag waarop uitzicht wordt gegeven; indien het laatstbedoelde bedrag op
      gelijke afstand ligt tot twee bedragen in de laagste schaal, wordt het schaalsalaris vastgesteld op het naasthogere
      bedrag.

      11 Voor de belanghebbende, voor wie volgens het bepaalde in het achtste tot en met tiende lid een uitzicht zou
      moeten worden vastgesteld dat lager is dan het schaalsalaris dat voor hem per 1 januari 1994 met toepassing van het
      bepaalde in het zesde en zevende lid is berekend, wordt het uitzicht vastgesteld op het laatstbedoelde niveau.


