  - number: IV
    text: |-
      Artikel A1 1. In de paragrafen van dit artikel zijn de begripsbepalingen van het
      [Rechtspositiebesluit onderwijspersoneel][ref1] van overeenkomstige toepassing, behoudens het
      bepaalde in het tweede lid. 2. In dit artikel wordt verstaan onder: a. *Rechtspositiebesluit:* het
      [Rechtspositiebesluit onderwijspersoneel][ref2]; b. *instelling:* de instelling, bedoeld in artikel I-A1,
      onder *d*13, sub *b*, van het Rechtspositiebesluit, de instelling, bedoeld in artikel I-A1, onder *d*3, van het
      Rechtspositiebesluit voor zover het betreft een avondschool voor vwo, havo, mavo of meao dan wel een instelling
      voor algemeen en op het beroep gericht onderwijs, alsmede de instelling, bedoeld in artikel I-A1, onder *d*6,
      van het Rechtspositiebesluit; c. *instituut:* de instelling, bedoeld in artikel I-A1, onder *d*13, sub *a*, van
      het Rechtspositiebesluit; d. *belanghebbende:* degene die is benoemd bij een instituut en zonder onderbreking
      wordt benoemd bij een instelling; e. *overgang:* de benoeming van de belanghebbende vanuit een instituut bij een
      instelling op een dag in de periode van 1 januari 1992 tot 1 januari 1996 in verband met de opheffing dan wel
      de overdracht van bestuur, bedoeld in respectievelijk artikel 45, tweede lid en 45, derde lid, van de Kaderwet
      Volwasseneneducatie 1991, van dat instituut op die dag.

      Artikel A2 De overige artikelen van deze regeling zijn niet van toepassing ten aanzien van de belanghebbende wiens
      betrekking wordt beëindigd in verband met de overgang en die aansluitend op zijn verzoek wordt belast met een
      functie waarbij een maximumschaal behoort die lager is dan de maximumschaal die behoort bij de functie die hem op
      grond van het bepaalde in dit besluit zou kunnen worden toegedeeld. De belanghebbende wordt in dat geval voor de
      toepassing van het bepaalde in de hoofdstukken I-P tot en met I-S van het Rechtspositiebesluit aangemerkt als een
      belanghebbende die in dienst treedt.

      Artikel A3 Indien de belanghebbende op de dag voorafgaande aan de overgang verlof volgens een of meer der
      hoofdstukken I-C, I-D of I-E, of een taakvermindering als bedoeld in artikel C4 van de Overgangsregeling
      ondersteuning VE genoot, wordt dat verlof alsmede de daarmee eventueel samenhangende vermindering van de
      bezoldiging voor de toepassing van de overige bepalingen van deze regeling buiten beschouwing gelaten.

      Artikel A4 Ten aanzien van de belanghebbende op wiens bezoldiging op de dag voorafgaand aan de overgang, in verband
      met andere door hem genoten inkomsten, een anticumulatie als bedoeld in het Rechtspositiebesluit werd toegepast,
      wordt die anticumulatie voor de toepassing van de overige bepalingen van dit besluit buiten beschouwing gelaten.

      Artikel B1 1. Behoudens het geval waarin een instelling is ontstaan door overdracht van het bestuur als bedoeld
      in artikel 45, derde lid van de Kaderwet Volwasseneneducatie 1991, van één instituut, stelt het bevoegd gezag
      uiterlijk zes maanden nadat de bij de instelling te verrichten werkzaamheden daadwerkelijk zijn aangevangen de
      formatie en de daarin voorkomende functies ten behoeve van de ondersteuning van de volwasseneneducatie vast. 2. Het
      bevoegd gezag deelt de functies aan de belanghebbenden toe, daarbij rekening houdend met de overige bepalingen in
      dit besluit.

      Artikel B2 1. Zolang het bevoegd gezag het formatiebeleid als bedoeld in artikel B1 nog niet heeft vastgesteld,
      behoudt de belanghebbende een functie die naar aard overeenkomt met zijn functie binnen het instituut. 2. Na
      overleg met de belanghebbende kan het bevoegd gezag, in het belang van de instelling, aan hem andere werkzaamheden
      met andere verantwoordelijkheden opdragen tot het moment waarop hem een functie als bedoeld in B1 wordt toegedeeld.

      Artikel B3 Aan de belanghebbende wordt, na vaststelling van de formatie ten behoeve van de ondersteuning van de
      volwasseneneducatie, een functie toegedeeld die naar niveau en maximumsalaris zo veel mogelijk overeenkomt met de
      functie die hij bij het instituut vervulde.

      Artikel C1 Op de dag van overgang wordt voor de belanghebbende bij de instelling een salaris vastgesteld in
      dezelfde schaal en op hetzelfde salarisnummer als voor hem op evenbedoelde dag zouden hebben gegolden volgens de
      regeling zoals die op de dag voor de overgang luidde.

      Artikel C2 1. Indien het salaris van een belanghebbende bij een normbetrekking hoger is dan het maximum van de
      bij zijn functie, als bedoeld in artikel B3, behorende maximumschaal, geschiedt de inpassing op een salaris dat zo
      dicht mogelijk ligt bij en tenminste gelijk is aan zijn salaris bij een normbetrekking en wel in de laagste schaal
      waarvan het maximum gelijk is aan of hoger is dan dat salaris bij een normbetrekking. 2. Na toepassing van het
      eerste lid wordt het voor de belanghebbende vastgestelde inpassingsbedrag uitgedrukt in een salarisnummer in de
      voor hem vastgestelde schaal.

      Artikel C3 Met ingang van de dag van overgang blijft voor de belanghebbende de betrekkingsomvang ten minste gelijk
      aan die welke voor hem op evenbedoelde datum zou hebben gegolden volgens de regeling zoals die laatstelijk voor hem
      van toepassing was.

      Artikel D1 In de gevallen waarin deze regeling niet of niet naar billijkheid voorziet, beslist Onze Minister.

      Artikel D2 Dit artikel kan worden aangehaald als "Overgangsregeling gewijzigde ondersteuningsstructuur VE".


