  - number: III
    text: |-
      1 In dit artikel wordt verstaan onder:

      a. Rechtspositiebesluit: het [Rechtspositiebesluit onderwijspersoneel][ref1];

      b. belanghebbende: de speltherapeut/creatieve therapeut bedoeld in artikel I-S302, eerste lid, die op 31 mei en 1
      juni 1992 aan dezelfde instelling is verbonden.

      2 Op 1 juni 1992 wordt voor de belanghebbende het salaris in afwijking van artikel I-P14 vastgesteld overeenkomstig
      artikel I-S103.

      3 Het in het tweede lid bedoelde salaris wordt in het nieuwe carrièrepatroon zodanig vastgesteld dat het tenminste
      gelijk blijft aan het salaris dat voor de belanghebbende zou hebben gegolden in het oude carrièrepatroon.


