  url: https://wetten.overheid.nl/BWBR0008638/1998-08-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In aanvulling op [artikel 1, tweede lid, van de Visserijwet 1963][ref1] wordt in dit besluit mede verstaan onder
      vis: vissen (Pisces) van de niet door Onze Minister aangewezen soorten.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0008638/1998-08-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '2'
    text: |-
      Het is verboden bij het vissen in de wateren, bedoeld in [artikel 1, vierde lid, onder ][ref1], levende vissen,
      amfibieën, reptielen, vogels of zoogdieren als aas te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0008638/1998-08-21#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '3'
    text: |-
      Indien het bij geleidende brief van 4 december 1997 ingediende
      [voorstel van wet tot wijziging van de Visserijwet 1963, kamerstukken II 1997/98, 25 795][ref1], nr. 2, tot wet
      wordt verheven en in werking treedt, treedt dit besluit op hetzelfde tijdstip in werking als artikel I, onderdeel
      C, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009735
    url: https://wetten.overheid.nl/BWBR0008638/1998-08-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009735
  - number: '4'
    text: 'Dit besluit wordt aangehaald als: Besluit verbod gebruik van levend aas.'
    url: https://wetten.overheid.nl/BWBR0008638/1998-08-21#Artikel4
