    Gelet op artikel 2c van de Visserijwet 1963;

    Gezien de adviezen van de Nederlandse Vereniging van Sportvissersfederaties, de Organisatie ter Verbetering van de
    Binnenvisserij, de Nederlandse Vereniging tot Bescherming van Dieren, de Vereniging Landelijke Organisatie DIBEVO
