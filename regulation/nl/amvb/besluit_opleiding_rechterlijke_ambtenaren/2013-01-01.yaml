---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_opleiding_rechterlijke_ambtenaren
regulatory_layer: AMVB
publication_date: '2016-12-16'
valid_from: '2013-01-01'
bwb_id: BWBR0003871
url: https://wetten.overheid.nl/BWBR0003871/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 25 februari 1985, Hoofddirectie Organisatie Rechtspleging en
    Rechtshulp, nr. 334 P 885;

    Gelet op artikel 125, eerste lid, van de Ambtenarenwet 1929 (Stb. 530), artikel 59i van de Wet op de rechterlijke
    organisatie (Stb. 1972, 463), de artikelen 4, vijfde lid, en 31, vijfde lid, van de Beroepswet (Stb. 1955, 47) en
    artikel 5, vijfde lid, van de Ambtenarenwet 1929 (Stb. 530);

    De Raad van State gehoord (advies van 17 mei 1985, nr. W03.85.0127/11.5.19);

    Gezien het nader rapport van Onze Minister van Justitie van 22 oktober 1985, Hoofddirectie Organisatie
    Rechtspleging en Rechtshulp, nr. 2069 P 885;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel1
  - number: 1.a
    text: |-
      opleiding: de opleiding, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel2
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '2'
        paragraaf: '2'
  - number: 1.b
    text: |-
      binnenstage: de stage, bedoeld in [artikel 3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel3
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '3'
        paragraaf: '2'
  - number: 1.c
    text: |-
      buitenstage: de stage, bedoeld in [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel3
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '3'
        paragraaf: '2'
  - number: '2'
    text: |-
      Er is een opleiding die ten doel heeft toekomstige rechterlijke ambtenaren de kennis, de vaardigheden en de
      ervaring te verschaffen, die nodig zijn om een rechtsprekende functie, dan wel de functie van officier van
      justitie te kunnen uitoefenen. De opleiding duurt zes jaar en omvat een binnenstage, een buitenstage en een
      vormingsprogramma.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      De binnenstage bestaat uit vijf deelstages, die worden doorgebracht bij een rechtbank en een tot het openbaar
      ministerie behorend parket. Tevens kunnen elders door te brengen deelstages van korte duur worden ingelast.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel3
  - number: '3.2'
    text: |-
      De buitenstage wordt elders dan bij een rechtbank of een tot het openbaar ministerie behorend parket doorgebracht.
      Onze Minister bepaalt op voorstel van de rector, waar deze stage wordt doorgebracht. Tijdens de buitenstage worden
      werkzaamheden verricht die kunnen bijdragen aan het verwerven van kennis, vaardigheden en ervaring, dienstig voor
      de uitoefening van de in [artikel 2][ref1] bedoelde functies.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel2
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '2'
        paragraaf: '2'
  - number: '3.3'
    text: |-
      De tijdsduur en volgorde van de binnenstage en buitenstage worden geregeld in het opleidingsreglement, bedoeld
      in [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel12
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '12'
        paragraaf: '3'
  - number: '3.4'
    text: |-
      In bijzondere individuele gevallen, kan Onze Minister de tijdsduur en de volgorde der binnenstage en buitenstage
      vaststellen in afwijking van het bepaalde in het opleidingsreglement. Zodanige vaststelling geschiedt niet dan
      nadat de rector en, bij verlenging, de functionele autoriteit, daaromtrent zijn gehoord.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het vormingsprogramma bestaat uit vaardigheidsleergangen en studiebijeenkomsten; het wordt doorlopen tijdens de
      binnenstage.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel4
  - number: '4.2'
    text: |-
      Voor het deelnemen aan het vormingsprogramma is de rechterlijk ambtenaar in opleiding voor een door Onze Minister
      te bepalen gedeelte van de arbeidsduur vrijgesteld van het verrichten van werkzaamheden in de binnenstage.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel4
  - number: '5.1'
    text: |-
      Bij de aanvang van de binnenstage stelt de functionele autoriteit na overleg met de betrokkene en in
      overeenstemming met de rector voor elke rechterlijk ambtenaar in opleiding afzonderlijk een werkprogramma vast,
      aangevende:
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel5
  - number: 5.1.a
    text: met welke werkzaamheden de rechterlijk ambtenaar in opleiding zal worden belast;
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel5
  - number: 5.1.b
    text: welke deelstages de rechterlijk ambtenaar in opleiding zal moeten volgen.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel5
  - number: '5.2'
    text: |-
      Jaarlijks stelt de rector na overleg met de betrokkene en in overeenstemming met de functionele autoriteit
      voor elke rechterlijk ambtenaar in opleiding afzonderlijk een studieprogramma vast, aangevende welke
      vaardigheidsleergangen en studiebijeenkomsten de rechterlijk ambtenaar in opleiding zal volgen. Zoveel mogelijk
      worden daarbij tijdstippen en perioden vermeld.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel5
  - number: '5.3'
    text: |-
      De functionele autoriteit, respectievelijk de rector, draagt er zorg voor dat aan het werkprogramma,
      respectievelijk het studieprogramma, de hand wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel5
  - number: '5.4'
    text: |-
      De functionele autoriteit wijst voor de begeleiding van de rechterlijk ambtenaar in opleiding tijdens de
      deelstages, in overeenstemming met de rector, een mentor aan.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel5
  - number: '5.5'
    text: |-
      Bij verschil van opvatting tussen de functionele autoriteit en de rector over de inhoud van het werkprogramma en
      het studieprogramma, over de uitvoering van deze programma's en over het aanwijzen van een mentor, beslist Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel5
  - number: '6'
    text: Het toezicht op de buitenstage berust bij de rector.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel6
  - number: '7.1'
    text: |-
      Indien een rechterlijk ambtenaar in opleiding voor zijn benoeming reeds meer dan een jaar ervaring in de
      rechtspraktijk of andere naar het oordeel van Onze Minister relevante ervaring heeft verworven, kan Onze Minister
      de opleiding bekorten met ten hoogste de duur van die ervaring, voor zover die meer dan een jaar bedraagt, doch
      niet met meer dan drie jaar.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel7
  - number: '7.2'
    text: Onze Minister kan de opleiding verlengen
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel7
  - number: 7.2.a
    text: |-
      indien de periode, waarvoor de benoeming in tijdelijke dienst van een rechterlijk ambtenaar in opleiding is
      verleend, ingevolge [artikel 21, derde lid, onderdelen a en b][ref1], is verlengd: met ten hoogste eenzelfde
      periode;


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel21
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '21'
        paragraaf: '5'
  - number: 7.2.b
    text: |-
      indien de volledige arbeidsduur van een rechterlijk ambtenaar in opleiding op zijn eigen verzoek is gewijzigd in
      een niet volledige arbeidsduur dan wel zijn arbeidsduur op zijn eigen verzoek anderszins is gewijzigd: met ten
      hoogste een jaar;
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel7
  - number: 7.2.c
    text: |-
      in andere gevallen, indien Onze Minister zulks, met het oog op het met gunstig resultaat beëindigen van de
      opleiding, nodig oordeelt: met ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      In de gevallen, bedoeld in het eerste en tweede lid, bepaalt Onze Minister op welke onderdelen van de opleiding de
      bekorting of de verlenging betrekking heeft en in welke volgorde de binnenstage en buitenstage worden doorlopen. De
      laatste volzin van [artikel 3, vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel3
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '3'
        paragraaf: '2'
  - number: '7.4'
    text: |-
      In de gevallen, bedoeld in het eerste en tweede lid, worden het werkprogramma en het studieprogramma aangepast en
      vastgesteld overeenkomstig [artikel 5, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel5
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '5'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Indien Onze Minister in de loop van de opleiding op grond van een beoordeling, bedoeld in [artikel 25][ref1], op
      grond van het oordeel van de rector, bedoeld in [artikel 26][ref2], dan wel op grond van andere ambtsberichten,
      alsnog tot het oordeel komt dat de rechterlijk ambtenaar in opleiding de opleiding niet met gunstig resultaat
      zal kunnen afsluiten of niet geschikt is voor een der in [artikel 2][ref3] bedoelde functies, beëindigt hij diens
      opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003871#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0003871#Artikel2
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '25'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0003871
        artikel: '26'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0003871
        artikel: '2'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Indien Onze Minister na voltooiing van de opleiding op een van de gronden als bedoeld in het eerste lid, alsnog tot
      het oordeel komt dat de rechterlijk ambtenaar in opleiding de opleiding niet met gunstig resultaat heeft beëindigd
      of niet geschikt is voor een der in [artikel 2][ref1] bedoelde functies, maakt hij bekend niet te zullen overgaan
      tot een benoeming dan wel de voordracht voor een benoeming als bedoeld in [artikel 29][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003871#Artikel29
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003871
        artikel: '29'
        paragraaf: '6'
  - number: '8.3'
    text: |-
      Alvorens de in het eerste en tweede lid bedoelde beslissingen te nemen hoort Onze Minister de functionele
      autoriteit en de rector.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel8
  - number: '9'
    text: |-
      Het studiecentrum rechtspleging is belast met de uitvoering van de opleiding van rechterlijke
      ambtenaren. Het studiecentrum rechtspleging is een onder de Raad ressorterende dienst als bedoeld in
      [artikel 40 van het Besluit financiering rechtspraak 2005][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel40
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '40'
  - number: '10'
    text: |-
      De Raad en het College van procureurs-generaal kunnen gezamenlijk algemene en bijzondere aanwijzingen geven aan het
      studiecentrum rechtspleging.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel10
  - number: '11.1'
    text: |-
      De Raad en het College van procureurs-generaal wijzen gezamenlijk een rector en een conrector van de opleiding aan;
      als zodanig zijn de rector en de conrector verantwoording verschuldigd aan de Raad en het College van procureurs-
      generaal gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel11
  - number: '11.2'
    text: Een aanwijzing ingevolge het eerste lid wordt eerst van kracht nadat Onze Minister daarin heeft toegestemd.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel11
  - number: '12.1'
    text: |-
      Het studiecentrum rechtspleging dient met inachtneming van het bepaalde in dit besluit een opleidingsreglement vast
      te stellen.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel12
  - number: '12.2'
    text: |-
      Het opleidingsreglement en wijzigingen daarin treden niet in werking dan nadat de Raad en het College van
      procureurs-generaal gezamenlijk daarin hebben toegestemd.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel12
  - number: '13'
    text: |-
      Het studiecentrum rechtspleging bekostigt de opleiding uit de daarvoor door de Raad en het College van procureurs-
      generaal beschikbaar gestelde gelden.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel13
  - number: '16'
    text: |-
      Onze Minister beslist omtrent de toelating tot de opleiding na advies van een selectiecommissie. Hij laat geen
      kandidaat tot de opleiding toe dan op aanbeveling van die commissie.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel16
  - number: '17.1'
    text: |-
      Leden van de in [artikel 16][ref1] bedoelde selectiecommissie zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel16
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '16'
        paragraaf: '4'
  - number: 17.1.a
    text: twee presidenten van een rechtbank alsmede zes andere bij een rechtbank werkzame rechterlijke ambtenaren;
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel17
  - number: 17.1.b
    text: |-
      een hoofdofficier met de titel hoofd van het arrondissementsparket, alsmede drie andere rechterlijke ambtenaren die
      werkzaam zijn bij een tot het openbaar ministerie behorend parket;
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel17
  - number: 17.1.c
    text: |-
      vier personen, niet behorend tot een der onder a en b bedoelde groepen en niet werkzaam bij het Ministerie van
      Veiligheid en Justitie;
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel17
  - number: 17.1.d
    text: vier ambtenaren van het Ministerie van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel17
  - number: '17.2'
    text: |-
      Elk jaar treden drie van de in het eerste lid, onder a tot en met c, bedoelde leden af volgens een door de
      commissie op te stellen rooster van aftreden. Zij zijn niet aansluitend herbenoembaar, behoudens in de gevallen,
      bedoeld in de laatste volzin. Tussentijds benoemden treden af op het tijdstip waarop degenen, wier plaats zij
      hebben ingenomen, volgens het rooster zouden zijn afgetreden. Eerst- en tussentijds benoemden zijn aansluitend
      herbenoembaar indien zij niet meer dan twee jaar lid van de commissie zijn geweest.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel17
  - number: '17.3'
    text: |-
      Onze Minister wijst uit de leden een voorzitter aan. De commissie kiest uit haar midden één of meer
      plaatsvervangende voorzitters.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel17
  - number: '18.1'
    text: |-
      De selectiecommissie heeft tot taak Onze Minister, ten behoeve van diens beslissing omtrent de toelating tot de
      opleiding, van advies te dienen over het vermogen van kandidaten om de opleiding met gunstig resultaat te doorlopen
      en over hun geschiktheid voor een der in [artikel 2][ref1] bedoelde functies.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel2
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '2'
        paragraaf: '2'
  - number: '18.2'
    text: |-
      Ten behoeve van haar advies stelt de selectiecommissie ten aanzien van de kandidaten een onderzoek in; dit kan
      zowel een beperkt als een volledig onderzoek zijn.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel18
  - number: '18.3'
    text: |-
      Indien de selectiecommissie een beperkt onderzoek heeft ingesteld en reeds op grond van het resultaat daarvan
      oordeelt dat zij geen gunstig advies zal kunnen uitbrengen, doet zij daarvan terstond mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel18
  - number: '18.4'
    text: |-
      In andere gevallen dan die, bedoeld in het derde lid, stelt de selectiecommissie een volledig onderzoek in, dat ten
      minste omvat:
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel18
  - number: 18.4.a
    text: het inwinnen van schriftelijke inlichtingen bij door de kandidaat opgegeven referenten;
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel18
  - number: 18.4.b
    text: een persoonlijk onderhoud met de kandidaat door niet meer dan vijf leden van de commissie;
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel18
  - number: 18.4.c
    text: kennisneming van de uitslag van een ten aanzien van de kandidaat ingesteld psychologisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel18
  - number: '18.5'
    text: |-
      De selectiecommissie kan haar voorzitter machtigen bepaalde beslissingen namens de commissie te nemen. Een zodanige
      machtiging, de aard en omvang van het beperkt onderzoek en wat overigens met betrekking tot de werkwijze van de
      commissie behoort te worden geregeld, legt de commissie neer in een reglement van orde dat de instemming van Onze
      Minister behoeft.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel18
  - number: '19'
    text: Onze Minister beslist zo spoedig mogelijk na de ontvangst van het advies.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel19
  - number: '20'
    text: |-
      Onverminderd het bepaalde in de [artikelen 16 tot en met 19][ref1] kan Onze Minister, gehoord de selectiecommissie,
      zonodig de toelatingsprocedure nader regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel16
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '16'
        paragraaf: '4'
  - number: '21.1'
    text: |-
      Degene, die is toegelaten tot de opleiding, wordt door Onze Minister benoemd als rechterlijk ambtenaar in opleiding
      in tijdelijke dienst bij de gerechten voor de duur van drie jaar en twee maanden. Onze Minister stelt tevens vast
      bij welke rechtbank en welk tot het openbaar ministerie behorend parket de rechterlijk ambtenaar in opleiding zijn
      ambt gedurende deze periode vervult.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21
  - number: '21.2'
    text: |-
      Onze Minister kan in het kader van een reorganisatie als bedoeld in
      [hoofdstuk 4A van het Besluit rechtspositie rechterlijke ambtenaren][ref1] de vaststelling van de rechtbank of
      het tot het openbaar ministerie behorend parket waarbij een rechterlijk ambtenaar in opleiding zijn ambt vervult
      wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006530
        hoofdstuk: 4a
  - number: '21.3'
    text: |-
      Onze Minister kan, de functionele autoriteit en de rector gehoord, de periode waarvoor een benoeming in tijdelijke
      dienst is verleend verlengen:
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21
  - number: 21.3.a
    text: |-
      indien een rechterlijk ambtenaar in opleiding dit verzoekt en naar het oordeel van Onze Minister voortzetting van
      de opleiding nog zinvol kan zijn: met ten hoogste één jaar;
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21
  - number: 21.3.b
    text: |-
      indien daarvoor naar het oordeel van Onze Minister redenen aanwezig zijn: met de periode gedurende welke de
      rechterlijk ambtenaar in opleiding geheel of gedeeltelijk geen werkzaamheden heeft verricht;
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21
  - number: 21.3.c
    text: |-
      indien de opleiding, ingevolge [artikel 7, tweede lid, onderdelen b en c][ref1], is verlengd: per grond met ten
      hoogste een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel7
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '7'
        paragraaf: '2'
  - number: '21.4'
    text: |-
      Indien de opleiding met toepassing van [artikel 7, eerste lid][ref1], is bekort, kan Onze Minister, na overleg met
      de rector, de duur van de benoeming in tijdelijke dienst bepalen op een periode korter dan drie jaar, doch niet
      korter dan twee jaar. Ten aanzien van de verlenging van een verkorte benoeming in tijdelijke dienst is het derde
      lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel7
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '7'
        paragraaf: '2'
  - number: 21a.1
    text: |-
      Om benoemd te kunnen worden als rechterlijk ambtenaar in opleiding dient het afsluitend examen, bedoeld in
      [artikel 5, eerste lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1], te voldoen aan de eisen van het
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '5'
  - number: 21a.2
    text: |-
      Het afsluitend examen is zodanig samengesteld dat ten minste grondige kennis van en inzicht in de volgende
      rechtsgebieden is verkregen:
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21a
  - number: 21a.2.a
    text: burgerlijk recht, met inbegrip van burgerlijk procesrecht;
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21a
  - number: 21a.2.b
    text: strafrecht, met inbegrip van strafprocesrecht; en
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21a
  - number: 21a.2.c
    text: bestuursrecht, met inbegrip van bestuursprocesrecht.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21a
  - number: 21a.3
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt onder afsluitend
      examen, bedoeld in die leden, tevens begrepen het schakelprogramma, bedoeld in
      [artikel 2b, eerste en tweede lid, van het Besluit rechtspositie rechterlijke ambtenaren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel2b
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 2b
  - number: 21b.1
    text: |-
      De rechterlijk ambtenaar in opleiding legt aan het begin van de opleiding ten overstaan van de rector en in
      aanwezigheid van een getuige, de eed of belofte af volgens het formulier zoals dat is vastgesteld in de bijlage bij
      dit besluit.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21b
  - number: 21b.2
    text: |-
      Het formulier, bedoeld in het eerste lid, wordt na het afleggen van de eed of belofte ondertekend door de
      rechterlijk ambtenaar in opleiding, de rector en de getuige.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21b
  - number: 21b.3
    text: |-
      De rector houdt een register bij waarin de formulieren betreffende de door de rechterlijke ambtenaren in opleiding
      afgelegde eed of belofte worden bewaard.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21b
  - number: 21b.4
    text: |-
      De rechterlijk ambtenaar in opleiding ontvangt van de rector een afschrift van het formulier betreffende de door
      hem afgelegde eed of belofte.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel21b
  - number: '22.1'
    text: |-
      Tenzij de opleiding op grond van het bepaalde in [artikel 8, eerste lid][ref1], is beëindigd, wordt een rechterlijk
      ambtenaar in opleiding aansluitend aan de benoeming in tijdelijke dienst benoemd in vaste dienst bij de gerechten.
      Onze Minister stelt tevens vast bij welke rechtbank of welk tot het openbaar ministerie behorend parket de
      rechterlijk ambtenaar in opleiding, die in vaste dienst is benoemd, zijn ambt vervult.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel8
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '8'
        paragraaf: '2'
  - number: '22.2'
    text: |-
      Onze Minister kan in het kader van een reorganisatie als bedoeld in
      [hoofdstuk 4A van het Besluit rechtspositie rechterlijke ambtenaren][ref1] de vaststelling van de rechtbank of
      het tot het openbaar ministerie behorend parket waarbij een rechterlijk ambtenaar in opleiding zijn ambt vervult
      wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        hoofdstuk: 4a
  - number: '24.1'
    text: |-
      De rechterlijk ambtenaar in opleiding volgt de opleiding overeenkomstig hetgeen bij of krachtens dit besluit
      is bepaald. Hij dient zich daarbij te houden aan de hem door of namens zijn functionele autoriteit en de rector
      gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel24
  - number: '24.2'
    text: |-
      De rechterlijk ambtenaar in opleiding brengt tijdens en na beëindiging van de binnenstage en de buitenstage aan de
      rector schriftelijk verslag uit van zijn verrichtingen en bevindingen. Van dit verslag verstrekt hij een afschrift
      aan zijn hoofd van dienst.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel24
  - number: '25.1'
    text: |-
      Een rechterlijk ambtenaar in opleiding wordt regelmatig beoordeeld. Daarbij wordt tegen de achtergrond van
      zijn toekomstige functie gelet op de wijze waarop hij de hem opgedragen werkzaamheden heeft uitgevoerd. Bij de
      beoordeling wordt rekening gehouden met het stadium van opleiding waarin de rechterlijk ambtenaar in opleiding
      verkeert.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25
  - number: '25.2'
    text: |-
      De beoordeling wordt voorbereid door een door de functionele autoriteit aan te wijzen functionaris tezamen met
      degene die verantwoordelijk is of medeverantwoordelijk is voor het functioneren van de rechterlijk ambtenaar in
      opleiding.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25
  - number: '25.3'
    text: |-
      De beoordeling geschiedt telkens tegen het einde van de eerste, de tweede, de derde, de vierde en de vijfde
      deelstage van de binnenstage en tegen het einde van de buitenstage door de functionele autoriteit.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25
  - number: '25.4'
    text: |-
      Ten behoeve van het opmaken van de beoordeling kan de functionele autoriteit bepalen dat bepaalde functionarissen
      als informant of adviseurs optreden.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25
  - number: '25.5'
    text: |-
      Op verzoek van de te beoordelen rechterlijk ambtenaar in opleiding om bepaalde functionarissen als adviseur of
      informant aan te wijzen beslist de functionele autoriteit.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25
  - number: 25a
    text: |-
      De rector stelt, na instemming van de Raad en het College van procureurs-generaal, het model vast van de lijst,
      waarop de beoordeling wordt vastgelegd.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25a
  - number: 25b.1
    text: Een beoordeling wordt opgemaakt op basis van op competenties en resultaatsgebieden gerichte functieprofielen.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25b
  - number: 25b.2
    text: |-
      Indien de feitelijke verrichte werkzaamheden afwijken van die welke in [artikel 25, eerste lid][ref1], zijn
      bedoeld, worden die op de beoordelingslijst vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel25
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '25'
        paragraaf: '6'
  - number: 25b.3
    text: |-
      Nadat de beoordeling is opgemaakt wordt deze door degene die verantwoordelijk is voor het functioneren van de
      rechterlijk ambtenaar in opleiding met de rechterlijk ambtenaar in opleiding besproken. Een samenvatting van dit
      beoordelingsgesprek wordt op de beoordelingslijst vastgelegd.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25b
  - number: 25c.1
    text: |-
      De rechterlijk ambtenaar in opleiding kan binnen twee weken na het beoordelingsgesprek schriftelijk bedenkingen
      tegen de beoordeling indienen bij de functionele autoriteit. De functionele autoriteit kan de termijn van twee
      weken verlengen.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25c
  - number: 25c.2
    text: |-
      De functionele autoriteit stelt de beoordeling vast, wanneer de rechterlijk ambtenaar in opleiding geen bedenkingen
      heeft in gediend binnen de in het eerste lid genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25c
  - number: 25c.3
    text: |-
      De rechterlijk ambtenaar in opleiding die bedenkingen heeft ingediend, wordt in de gelegenheid gesteld deze
      mondeling bij de functionele autoriteit toe te lichten. Deze kan bepalen dat andere personen bij dit gesprek
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25c
  - number: 25c.4
    text: |-
      De functionele autoriteit wijzigt de beoordeling in zover hij de bedenkingen van de rechterlijk ambtenaar in
      opleiding deelt en stelt de beoordeling vast.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25c
  - number: 25c.5
    text: |-
      Bij de vaststelling van de beoordeling deelt de functionele autoriteit de rechterlijk ambtenaar in opleiding
      schriftelijk mee of hij wijzigingen in de beoordeling heeft aangebracht, en, zo ja welke. Daarbij vermeldt hij in
      voorkomend geval de redenen waarom hij niet of niet volledig aan de bedenkingen is tegemoet gekomen.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25c
  - number: 25d.1
    text: De rechterlijk ambtenaar in opleiding kan bezwaar maken tegen de vastgestelde beoordeling.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25d
  - number: 25d.2
    text: |-
      Indien de rechterlijk ambtenaar in opleiding bezwaar heeft gemaakt tegen de vastgestelde beoordeling wint de
      functionele autoriteit, alvorens hierop te beslissen, het advies in van een commissie, tenzij het bezwaar reeds
      aanstonds gegrond wordt geacht.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25d
  - number: 25d.3
    text: |-
      Indien het bevoegd gezag niet onder toepassing van [artikel 7:13 van de Algemene wet bestuursrecht][ref1] een
      adviescommissie heeft belast met het adviseren omtrent bezwaren tegen vastgestelde beoordelingen, stelt het daartoe
      een commissie in. Van de commissie maakt in elk geval deel uit een ambtenaar aangewezen door de Sectorcommissie
      rechterlijke macht als bedoeld in [artikel 50 van de Wet rechtspositie rechterlijke ambtenaren][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel50
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '50'
  - number: '26.1'
    text: |-
      Ten minste eenmaal per jaar vormt de rector zich een oordeel omtrent de wijze waarop de rechterlijk ambtenaar in
      opleiding de onderscheidene vaardigheidsleergangen en studiebijeenkomsten heeft doorlopen.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel26
  - number: '26.2'
    text: |-
      De rector vermeldt zijn oordeel op een lijst waarvan het model door Onze Minister wordt vastgesteld en bespreekt
      daarna dit oordeel met de rechterlijk ambtenaar in opleiding. Een samenvatting van het gesprek wordt eveneens op
      de lijst vastgelegd. De rector zendt de lijst vervolgens zo spoedig mogelijk aan Onze Minister. De rechterlijk
      ambtenaar in opleiding ontvangt een afschrift van de lijst.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel26
  - number: '26.3'
    text: Tegen het oordeel van de rector kan een belanghebbende beroep instellen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel26
  - number: '26.4'
    text: |-
      Indien Onze Minister de bezwaren kennelijk geheel gegrond acht, stelt hij dienovereenkomstig het oordeel nader
      vast. In andere gevallen dan in de vorige volzin bedoeld stelt Onze Minister het oordeel, al dan niet gewijzigd,
      eerst vast na terzake het advies te hebben ingewonnen van de commissie, bedoeld in [artikel 25d, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel25d
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: 25d
        paragraaf: '6'
  - number: '27'
    text: |-
      Indien Onze Minister een der beslissingen, bedoeld in [artikel 8][ref1], heeft genomen, kan hij de rechterlijk
      ambtenaar in opleiding op die grond ontslaan. Indien de rechterlijk ambtenaar in opleiding reeds in vaste dienst is
      benoemd, kan hij evenwel, in afwijking van de eerste volzin, slechts worden ontslagen, indien het na een zorgvuldig
      onderzoek van maximaal zes maanden niet mogelijk is gebleken om hem binnen het gezagsbereik van Onze Minister of
      bij een gerecht een andere, mede in verband met zijn persoonlijkheid en omstandigheden, passende functie aan te
      bieden dan wel indien hij weigert deze functie te aanvaarden. De mededeling dat tot ontslag wordt overgegaan wordt
      uiterlijk vijfenveertig dagen gedaan voor afloop van de in de vorige zin bedoelde termijn van zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel8
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '8'
        paragraaf: '2'
  - number: '28'
    text: |-
      Een rechterlijk ambtenaar in opleiding maakt voor het voltooien van de vierde deelstage van de binnenstage aan Onze
      Minister zijn keuze bekend voor een van de in [artikel 2][ref1] bedoelde functies. Een gemaakte keuze kan na het
      voltooien van de vierde deelstage van de binnenstage alleen in zeer bijzondere gevallen worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel2
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '2'
        paragraaf: '2'
  - number: 28a.1
    text: |-
      Een rechterlijk ambtenaar in opleiding die gedurende de buitenstage de keuze, bedoeld in [artikel 28][ref1], wenst
      te wijzigen, dient daartoe een met redenen omkleed verzoek bij Onze Minister in.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel28
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '28'
        paragraaf: '6'
  - number: 28a.2
    text: Onze Minister beslist op het verzoek na overleg met de rector en de functionele autoriteit.
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel28a
  - number: 28a.3
    text: 'Indien het verzoek wordt toegewezen:'
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel28a
  - number: 28a.3.a
    text: |-
      past, indien nodig, de functionele autoriteit het werkprogramma en de rector het studieprogramma aan en stellen zij
      deze programma's overeenkomstig [artikel 5, eerste en tweede lid][ref1], opnieuw vast, en


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel5
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '5'
        paragraaf: '2'
  - number: 28a.3.b
    text: |-
      bepaalt Onze Minister overeenkomstig [artikel 3, tweede lid][ref1], waar de buitenstage wordt doorgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel3
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '3'
        paragraaf: '2'
  - number: '29'
    text: |-
      Een rechterlijk ambtenaar in opleiding, die de opleiding met gunstig resultaat heeft beëindigd en geschikt
      wordt geacht voor een van de in [artikel 2][ref1] bedoelde functies, wordt, overeenkomstig diens keuze, benoemd
      in de functie van gerechtsauditeur dan wel benoemd in de functie van substituut-officier van justitie. Bij de
      vaststelling van de rechtbank of het parket waarbij het ambt, bedoeld in de eerste volzin, wordt vervuld, wordt de
      voorkeur van de betrokken rechterlijk ambtenaar in opleiding en het dienstbelang in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel2
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '2'
        paragraaf: '2'
  - number: '31'
    text: 'Dit besluit wordt aangehaald als: Besluit opleiding rechterlijke ambtenaren.'
    url: https://wetten.overheid.nl/BWBR0003871/2013-01-01#Artikel31
