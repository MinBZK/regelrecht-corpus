---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_opleiding_rechterlijke_ambtenaren
regulatory_layer: AMVB
publication_date: '2016-12-16'
valid_from: '2005-02-11'
bwb_id: BWBR0003871
url: https://wetten.overheid.nl/BWBR0003871/2005-02-11
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 25 februari 1985, Hoofddirectie Organisatie Rechtspleging en
    Rechtshulp, nr. 334 P 885;

    Gelet op artikel 125, eerste lid, van de Ambtenarenwet 1929 (Stb. 530), artikel 59i van de Wet op de rechterlijke
    organisatie (Stb. 1972, 463), de artikelen 4, vijfde lid, en 31, vijfde lid, van de Beroepswet (Stb. 1955, 47) en
    artikel 5, vijfde lid, van de Ambtenarenwet 1929 (Stb. 530);

    De Raad van State gehoord (advies van 17 mei 1985, nr. W03.85.0127/11.5.19);

    Gezien het nader rapport van Onze Minister van Justitie van 22 oktober 1985, Hoofddirectie Organisatie
    Rechtspleging en Rechtshulp, nr. 2069 P 885;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel1
  - number: 1.b
    text: |-
      opleiding: de opleiding, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel2
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '2'
        paragraaf: '2'
  - number: 1.c
    text: 'rechterlijk ambtenaar in opleiding: degene, die is aangesteld om de opleiding te volgen;'
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel1
  - number: 1.d
    text: |-
      hoofd van dienst: het bestuur van de rechtbank, dan wel het hoofd van het arrondissementsparket, waarbij de
      rechterlijk ambtenaar in opleiding is tewerkgesteld;
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel1
  - number: 1.e
    text: |-
      rector: degene, die overeenkomstig [artikel 11][ref1] als rector van de opleiding is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel11
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '11'
        paragraaf: '3'
  - number: 1.f
    text: |-
      de binnenstage: de stage, bedoeld in [artikel 3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel3
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '3'
        paragraaf: '2'
  - number: 1.g
    text: |-
      de buitenstage: de stage, bedoeld in [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel3
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '3'
        paragraaf: '2'
  - number: 1a
    text: |-
      Dit besluit berust op de [artikelen 145, tweede lid, van de Wet op de rechterlijke organisatie][ref1] en
      [54, tweede lid, van de Wet rechtspositie rechterlijke ambtenaren][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel145
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel54
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '145'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '54'
  - number: '2'
    text: |-
      Er is een opleiding die ten doel heeft toekomstige rechterlijke ambtenaren de kennis, de vaardigheden en de
      ervaring te verschaffen, die nodig zijn om een rechtsprekende functie, dan wel de functie van Officier van Justitie
      te kunnen uitoefenen. De opleiding duurt zes jaar en omvat een binnenstage, een buitenstage en een theoretisch
      vormingsprogramma.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel2
  - number: '3.1'
    text: |-
      De binnenstage bestaat uit vijf deelstages, die worden doorgebracht bij een rechtbank en een arrondissementsparket.
      Tevens kunnen elders door te brengen deelstages van korte duur worden ingelast.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel3
  - number: '3.2'
    text: |-
      De buitenstage wordt elders dan bij een rechtbank of een arrondissementsparket doorgebracht. Onze Minister bepaalt
      op voorstel van de rector, waar deze stage wordt doorgebracht. Tijdens de buitenstage worden werkzaamheden verricht
      die kunnen bijdragen aan het verwerven van kennis, vaardigheden en ervaring, dienstig voor de uitoefening van de in
      [artikel 2][ref1] bedoelde functies.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel2
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '2'
        paragraaf: '2'
  - number: '3.3'
    text: |-
      De tijdsduur en volgorde van de binnenstage en buitenstage worden geregeld in het opleidingsreglement, bedoeld
      in [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel12
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '12'
        paragraaf: '3'
  - number: '3.4'
    text: |-
      In bijzondere individuele gevallen, kan Onze Minister de tijdsduur en de volgorde der binnenstage en buitenstage
      vaststellen in afwijking van het bepaalde in het opleidingsreglement. Zodanige vaststelling geschiedt niet dan
      nadat de rector en, bij verlenging, het hoofd van dienst, daaromtrent zijn gehoord.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel3
  - number: '4.1'
    text: |-
      Het theoretisch vormingsprogramma bestaat uit vaardigheidsleergangen en studiebijeenkomsten; het wordt doorlopen
      tijdens de binnenstage.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel4
  - number: '4.2'
    text: |-
      Voor het deelnemen aan het theoretisch vormingsprogramma is de rechterlijk ambtenaar in opleiding voor een door
      Onze Minister te bepalen gedeelte van de arbeidsduur vrijgesteld van het verrichten van werkzaamheden in de
      binnenstage.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel4
  - number: '5.1'
    text: |-
      Bij de aanvang van de binnenstage stelt het hoofd van dienst na overleg met de betrokkene en in overeenstemming met
      de rector voor elke rechterlijk ambtenaar in opleiding afzonderlijk een werkprogramma vast, aangevende:
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel5
  - number: 5.1.a
    text: met welke werkzaamheden de rechterlijk ambtenaar in opleiding zal worden belast;
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel5
  - number: 5.1.b
    text: welke deelstages de rechterlijk ambtenaar in opleiding zal moeten volgen.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel5
  - number: '5.2'
    text: |-
      Jaarlijks stelt de rector na overleg met de betrokkene en in overeenstemming met het hoofd van dienst voor elke
      rechterlijk ambtenaar in opleiding afzonderlijk een studieprogramma vast, aangevende welke vaardigheidsleergangen
      en studiebijeenkomsten de rechterlijk ambtenaar in opleiding zal volgen. Zoveel mogelijk worden daarbij tijdstippen
      en perioden vermeld.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel5
  - number: '5.3'
    text: |-
      Het hoofd van dienst, respectievelijk de rector, draagt er zorg voor dat aan het werkprogramma, respectievelijk het
      studieprogramma, de hand wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel5
  - number: '5.4'
    text: |-
      Het hoofd van dienst wijst voor de begeleiding van de rechterlijk ambtenaar in opleiding tijdens de deelstages, in
      overeenstemming met de rector, een mentor aan.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel5
  - number: '5.5'
    text: |-
      Bij verschil van opvatting tussen het hoofd van dienst en de rector over de inhoud van het werkprogramma en
      het studieprogramma, over de uitvoering van deze programma's en over het aanwijzen van een mentor, beslist Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel5
  - number: '6'
    text: Het toezicht op de buitenstage berust bij de rector.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel6
  - number: '7.1'
    text: |-
      Indien een rechterlijk ambtenaar in opleiding voor zijn aanstelling reeds meer dan een jaar ervaring in de
      rechtspraktijk of andere naar het oordeel van Onze Minister relevante ervaring heeft verworven, kan Onze Minister
      de opleiding bekorten met ten hoogste de duur van die ervaring, voor zover die meer dan een jaar bedraagt, doch
      niet met meer dan drie jaar.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel7
  - number: '7.2'
    text: Onze Minister kan de opleiding verlengen
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel7
  - number: 7.2.a
    text: |-
      indien de aanstelling in tijdelijke dienst van een rechterlijk ambtenaar in opleiding ingevolge
      [artikel 21, tweede lid][ref1], is verlengd: met ten hoogste eenzelfde periode;


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel21
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '21'
        paragraaf: '5'
  - number: 7.2.b
    text: |-
      indien de aanstelling voor een volledige taak op grond van [artikel 22][ref1] is gewijzigd in een aanstelling voor
      een gedeeltelijke taak dan wel een aanstelling voor een gedeeltelijke taak is gewijzigd in een aanstelling voor een
      andere gedeeltelijke taak: met ten hoogste een jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel22a
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: 22a
        paragraaf: '5'
  - number: 7.2.c
    text: |-
      in andere gevallen, indien Onze Minister zulks, met het oog op het met gunstig resultaat beëindigen van de
      opleiding, nodig oordeelt: met ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel7
  - number: '7.3'
    text: |-
      In de gevallen, bedoeld in het eerste en tweede lid, bepaalt Onze Minister op welke onderdelen van de opleiding de
      bekorting of de verlenging betrekking heeft en in welke volgorde de binnenstage en buitenstage worden doorlopen. De
      laatste volzin van [artikel 3, vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel3
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '3'
        paragraaf: '2'
  - number: '7.4'
    text: |-
      In de gevallen, bedoeld in het eerste en tweede lid, worden het werkprogramma en het studieprogramma aangepast en
      vastgesteld overeenkomstig [artikel 5, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel5
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '5'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Indien Onze Minister in de loop van de opleiding op grond van een beoordeling, bedoeld in [artikel 25][ref1], op
      grond van het oordeel van de rector, bedoeld in [artikel 26][ref2], dan wel op grond van andere ambtsberichten,
      alsnog tot het oordeel komt dat de rechterlijk ambtenaar in opleiding de opleiding niet met gunstig resultaat
      zal kunnen afsluiten of niet geschikt is voor een der in [artikel 2][ref3] bedoelde functies, beëindigt hij diens
      opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003871#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0003871#Artikel2
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '25'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0003871
        artikel: '26'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0003871
        artikel: '2'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Indien Onze Minister na voltooiing van de opleiding op een van de gronden als bedoeld in het eerste lid, alsnog tot
      het oordeel komt dat de rechterlijk ambtenaar in opleiding de opleiding niet met gunstig resultaat heeft beëindigd
      of niet geschikt is voor een der in [artikel 2][ref1] bedoelde functies, maakt hij bekend niet te zullen overgaan
      tot een voordracht, als bedoeld in [artikel 29][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003871#Artikel29
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003871
        artikel: '29'
        paragraaf: '6'
  - number: '8.3'
    text: |-
      Alvorens de in het eerste en tweede lid bedoelde beslissingen te nemen hoort Onze Minister het hoofd van dienst en
      de rector.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel8
  - number: '9'
    text: |-
      Het studiecentrum rechtspleging is belast met de uitvoering van de opleiding van rechterlijke
      ambtenaren. Het studiecentrum rechtspleging is een onder de Raad ressorterende dienst als bedoeld in
      [artikel 40 van het Besluit financiering rechtspraak 2005][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel40
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '40'
  - number: '10'
    text: |-
      De Raad voor de rechtspraak en het College van procureurs-generaal kunnen gezamenlijk algemene en bijzondere
      aanwijzingen geven aan het studiecentrum rechtspleging.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel10
  - number: '11.1'
    text: |-
      De Raad voor de rechtspraak en het College van procureurs-generaal wijzen gezamenlijk een rector en een conrector
      van de opleiding aan; als zodanig zijn de rector en de conrector verantwoording verschuldigd aan de Raad voor de
      rechtspraak en het College van procureurs-generaal gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel11
  - number: '11.2'
    text: Een aanwijzing ingevolge het eerste lid wordt eerst van kracht nadat Onze Minister daarin heeft toegestemd.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel11
  - number: '12.1'
    text: |-
      Het studiecentrum rechtspleging dient met inachtneming van het bepaalde in dit besluit een opleidingsreglement vast
      te stellen.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel12
  - number: '12.2'
    text: |-
      Het opleidingsreglement en wijzigingen daarin treden niet in werking dan nadat de Raad voor de rechtspraak en het
      College van procureurs-generaal gezamenlijk daarin heeft toegestemd.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel12
  - number: '13'
    text: |-
      Het studiecentrum rechtspleging bekostigt de opleiding uit de daarvoor door de Raad voor de rechtspraak en het
      College van procureurs-generaal beschikbaar gestelde gelden.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel13
  - number: '16'
    text: |-
      Onze Minister beslist omtrent de toelating tot de opleiding na advies van een selectiecommissie. Hij laat geen
      kandidaat tot de opleiding toe dan op aanbeveling van die commissie.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel16
  - number: '17.1'
    text: |-
      Leden van de in [artikel 16][ref1] bedoelde selectiecommissie zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel16
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '16'
        paragraaf: '4'
  - number: 17.1.a
    text: twee presidenten en zes andere leden van een rechtbank;
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel17
  - number: 17.1.b
    text: een officier van justitie, hoofd van een arrondissementsparket, en drie andere leden van het openbaar ministerie;
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel17
  - number: 17.1.c
    text: |-
      vier personen, niet behorend tot een der onder *a* en *b* bedoelde groepen en niet werkzaam bij het Ministerie
      van Justitie;
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel17
  - number: 17.1.d
    text: vier ambtenaren van het Ministerie van Justitie.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel17
  - number: '17.2'
    text: |-
      Elk jaar treden drie van de in het eerste lid, onder *a* tot en met *c*, bedoelde leden af volgens een door de
      commissie op te stellen rooster van aftreden. Zij zijn niet aansluitend herbenoembaar, behoudens in de gevallen,
      bedoeld in de laatste volzin. Tussentijds benoemden treden af op het tijdstip waarop degenen, wier plaats zij
      hebben ingenomen, volgens het rooster zouden zijn afgetreden. Eerst- en tussentijds benoemden zijn aansluitend
      herbenoembaar indien zij niet meer dan twee jaar lid van de commissie zijn geweest.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel17
  - number: '17.3'
    text: |-
      Onze Minister wijst uit de leden een voorzitter aan. De commissie kiest uit haar midden één of meer
      plaatsvervangende voorzitters.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel17
  - number: '18.1'
    text: |-
      De selectiecommissie heeft tot taak Onze Minister, ten behoeve van diens beslissing omtrent de toelating tot de
      opleiding, van advies te dienen over het vermogen van kandidaten om de opleiding met gunstig resultaat te doorlopen
      en over hun geschiktheid voor een der in [artikel 2][ref1] bedoelde functies.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel2
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '2'
        paragraaf: '2'
  - number: '18.2'
    text: |-
      Ten behoeve van haar advies stelt de selectiecommissie ten aanzien van de kandidaten een onderzoek in; dit kan
      zowel een beperkt als een volledig onderzoek zijn.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel18
  - number: '18.3'
    text: |-
      Indien de selectiecommissie een beperkt onderzoek heeft ingesteld en reeds op grond van het resultaat daarvan
      oordeelt dat zij geen gunstig advies zal kunnen uitbrengen, doet zij daarvan terstond mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel18
  - number: '18.4'
    text: |-
      In andere gevallen dan die, bedoeld in het derde lid, stelt de selectiecommissie een volledig onderzoek in, dat ten
      minste omvat:
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel18
  - number: 18.4.a
    text: het inwinnen van schriftelijke inlichtingen bij door de kandidaat opgegeven referenten;
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel18
  - number: 18.4.b
    text: een persoonlijk onderhoud met de kandidaat door niet meer dan vijf leden van de commissie;
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel18
  - number: 18.4.c
    text: kennisneming van de uitslag van een ten aanzien van de kandidaat ingesteld psychologisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel18
  - number: '18.5'
    text: |-
      De selectiecommissie kan haar voorzitter machtigen bepaalde beslissingen namens de commissie te nemen. Een zodanige
      machtiging, de aard en omvang van het beperkt onderzoek en wat overigens met betrekking tot de werkwijze van de
      commissie behoort te worden geregeld, legt de commissie neer in een reglement van orde dat de instemming van Onze
      Minister behoeft.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel18
  - number: '19'
    text: Onze Minister beslist zo spoedig mogelijk na de ontvangst van het advies.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel19
  - number: '20'
    text: |-
      Onverminderd het bepaalde in de [artikelen 16 tot en met 19][ref1] kan Onze Minister, gehoord de selectiecommissie,
      zonodig de toelatingsprocedure nader regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel16
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '16'
        paragraaf: '4'
  - number: '21.1'
    text: |-
      Degene, die is toegelaten tot de opleiding, wordt door Onze Minister aangesteld als rechterlijk ambtenaar in
      opleiding in tijdelijke dienst bij de gerechten voor de duur van drie jaar en tewerkgesteld bij een met name te
      noemen rechtbank of arrondissementsparket.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21
  - number: '21.2'
    text: |-
      De rechterlijk ambtenaar in opleiding kan in het kader van een reorganisatie als bedoeld in
      [hoofdstuk 4A van het Besluit rechtspositie rechterlijke ambtenaren][ref1] door Onze Minister tewerkgesteld worden
      bij een andere rechtbank of ander arrondissementsparket.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006530
        hoofdstuk: 4a
  - number: '21.3'
    text: 'Onze Minister kan, het hoofd van dienst en de rector gehoord, de aanstelling in tijdelijke dienst verlengen:'
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21
  - number: 21.3.a
    text: |-
      indien een rechterlijk ambtenaar in opleiding dit verzoekt en naar het oordeel van Onze Minister voortzetting van
      de opleiding nog zinvol kan zijn: met ten hoogste één jaar;
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21
  - number: 21.3.b
    text: |-
      indien daarvoor naar het oordeel van Onze Minister redenen aanwezig zijn: met de tijd welke de rechterlijk
      ambtenaar in opleiding niet in werkelijke dienst heeft doorgebracht.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21
  - number: '21.4'
    text: |-
      Indien de opleiding met toepassing van [artikel 7, eerste lid][ref1], is bekort, kan Onze Minister, na overleg met
      de rector, de duur van de aanstelling in tijdelijke dienst bepalen op een periode korter dan drie jaar, doch niet
      korter dan twee jaar. Ten aanzien van de verlenging van een verkorte aanstelling in tijdelijke dienst is het tweede
      lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel7
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '7'
        paragraaf: '2'
  - number: 21a.1
    text: |-
      Om aangesteld te kunnen worden als rechterlijk ambtenaar in opleiding dient het afsluitend examen, bedoeld in
      [artikel 1d, eerste lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1], te voldoen aan de eisen van het
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel1d
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 1d
  - number: 21a.2
    text: |-
      Het afsluitend examen is zodanig samengesteld dat ten minste grondige kennis van en inzicht in de volgende
      rechtsgebieden is verkregen:
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21a
  - number: 21a.2.a
    text: burgerlijk recht, met inbegrip van burgerlijk procesrecht;
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21a
  - number: 21a.2.b
    text: strafrecht, met inbegrip van strafprocesrecht; en
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21a
  - number: 21a.2.c
    text: bestuursrecht, met inbegrip van bestuursprocesrecht.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21a
  - number: 21b.1
    text: |-
      De rechterlijk ambtenaar in opleiding legt aan het begin van de opleiding ten overstaan van de rector en in
      aanwezigheid van een getuige, de eed of belofte af overeenkomstig het als bijlage bij dit besluit gehechte
      formulier.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21b
  - number: 21b.2
    text: |-
      Het formulier, bedoeld in het eerste lid, wordt na het afleggen van de eed of belofte ondertekend door de
      rechterlijk ambtenaar in opleiding, de rector en de getuige.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21b
  - number: 21b.3
    text: De rector houdt een register bij waarin de formulieren, bedoeld in het eerste lid, worden bewaard.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21b
  - number: 21b.4
    text: Een uittreksel uit dit register wordt aan de rechterlijk ambtenaar in opleiding uitgereikt.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel21b
  - number: '22.1'
    text: |-
      Tenzij de opleiding op grond van het bepaalde in [artikel 8, eerste lid][ref1], is beëindigd, wordt een rechterlijk
      ambtenaar in opleiding aansluitend aan de aanstelling in tijdelijke dienst aangesteld in vaste dienst bij de
      gerechten en tewerkgesteld bij een met name te noemen rechtbank of arrondissementsparket.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel8
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '8'
        paragraaf: '2'
  - number: '22.2'
    text: |-
      De rechterlijk ambtenaar in opleiding kan in het kader van een reorganisatie als bedoeld in
      [hoofdstuk 4A van het Besluit rechtspositie rechterlijke ambtenaren][ref1] door Onze Minister tewerkgesteld worden
      bij een andere rechtbank of ander arrondissementsparket.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        hoofdstuk: 4a
  - number: 22a.1
    text: |-
      De rechterlijk ambtenaar in opleiding wordt aangesteld voor het vervullen van een volledige of een gedeeltelijke
      taak.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel22a
  - number: 22a.2
    text: |-
      De gedeeltelijke taak kan niet minder zijn dan de helft van de volledige taak en kan niet anders worden vervuld dan
      door wekelijks gemiddeld gedurende de in het aanstellingsbesluit genoemde arbeidsduur werkzaamheden te verrichten.
      De vervulling van de gedeeltelijke taak kan niet eerder ingaan dan na afloop van de vierde deelstage van de
      binnenstage.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel22a
  - number: '24.1'
    text: |-
      De rechterlijk ambtenaar in opleiding volgt de opleiding overeenkomstig hetgeen bij of krachtens dit besluit is
      bepaald. Hij dient zich daarbij te houden aan de hem door of namens zijn hoofd van dienst en de rector gegeven
      aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel24
  - number: '24.2'
    text: |-
      De rechterlijk ambtenaar in opleiding brengt tijdens en na beëindiging van de binnenstage en de buitenstage aan de
      rector schriftelijk verslag uit van zijn verrichtingen en bevindingen. Van dit verslag verstrekt hij een afschrift
      aan zijn hoofd van dienst.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel24
  - number: '25.1'
    text: |-
      Een rechterlijk ambtenaar in opleiding wordt beoordeeld. Daarbij wordt tegen de achtergrond van zijn toekomstige
      taak gelet op de wijze waarop hij de hem opgedragen werkzaamheden heeft uitgevoerd. Bij de beoordeling wordt
      rekening gehouden met het stadium van opleiding waarin de rechterlijk ambtenaar in opleiding verkeert.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel25
  - number: '25.2'
    text: |-
      De beoordeling geschiedt telkens na de tweede, de derde, de vierde en de vijfde deelstage van de binnenstage door
      het hoofd van dienst of door een door deze aangewezen functionaris en tegen het einde van de buitenstage door een
      door Onze Minister aan te wijzen functionaris.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel25
  - number: '25.3'
    text: |-
      Het Beoordelingsvoorschrift burgerlijk rijkspersoneel 1985 (Stcrt. 81) is op de in [dit artikel][ref1] bedoelde
      beoordelingen van toepassing, met dien verstande dat in [artikel 8, derde lid][ref2], van dat voorschrift, in
      plaats van "de tot de Centrale Commissie voor Georganiseerd Overleg in Ambtenarenzaken toegelaten centrales van
      verenigingen van ambtenaren." wordt gelezen: de Nederlandse Vereniging voor Rechtspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003871#Artikel8
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '25'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0003871
        artikel: '8'
        paragraaf: '2'
  - number: '26.1'
    text: |-
      Ten minste eenmaal per jaar vormt de rector zich een oordeel omtrent de wijze waarop de rechterlijk ambtenaar in
      opleiding de onderscheidene vaardigheidsleergangen en studiebijeenkomsten heeft doorlopen.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel26
  - number: '26.2'
    text: |-
      De rector vermeldt zijn oordeel op een lijst waarvan het model door Onze Minister wordt vastgesteld en bespreekt
      daarna dit oordeel met de rechterlijk ambtenaar in opleiding. Een samenvatting van het gesprek wordt eveneens op
      de lijst vastgelegd. De rector zendt de lijst vervolgens zo spoedig mogelijk aan Onze Minister. De rechterlijk
      ambtenaar in opleiding ontvangt een afschrift van de lijst.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel26
  - number: '26.3'
    text: Tegen het oordeel van de rector kan een belanghebbende beroep instellen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel26
  - number: '26.4'
    text: |-
      Indien Onze Minister de bezwaren kennelijk geheel gegrond acht, stelt hij dienovereenkomstig het oordeel nader
      vast. In andere gevallen dan in de vorige zin bedoeld stelt Onze Minister het oordeel, al dan niet gewijzigd,
      eerst vast na terzake het advies te hebben ingewonnen van de commissie, bedoeld in artikel 8, derde lid, van het
      Beoordelingsvoorschrift burgerlijk rijkspersoneel 1985 (*Stcrt.* 81) met dien verstande dat voor de toepassing van
      dat artikel in plaats van "de tot de Centrale Commissie voor Georganiseerd Overleg in Ambtenarenzaken toegelaten
      centrales van verenigingen van ambtenaren." wordt gelezen: de Nederlandse Vereniging voor Rechtspraak.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel26
  - number: '27'
    text: |-
      Indien Onze Minister een der beslissingen, bedoeld in [artikel 8][ref1], heeft genomen, kan hij de rechterlijk
      ambtenaar in opleiding ontslaan. Indien de rechterlijk ambtenaar in opleiding ten tijde van het te verlenen ontslag
      reeds was aangesteld in vaste dienst, kan het ontslag evenwel slechts worden verleend, indien het na een zorgvuldig
      onderzoek niet mogelijk is gebleken de betrokkene binnen het gezagsbereik van Onze Minister andere, mede in verband
      met zijn persoonlijkheid en omstandigheden voor hem passende, werkzaamheden op te dragen, dan wel indien deze
      weigert zodanige werkzaamheden te aanvaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel8
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '8'
        paragraaf: '2'
  - number: '28'
    text: |-
      Een rechterlijk ambtenaar in opleiding maakt na het voltooien van de vierde deelstage van de binnenstage aan Onze
      Minister zijn voorkeur bekend voor een van de in [artikel 2][ref1] bedoelde functies.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel2
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '2'
        paragraaf: '2'
  - number: 28a.1
    text: |-
      Een rechterlijk ambtenaar in opleiding die gedurende de buitenstage de voorkeur, bedoeld in [artikel 28][ref1],
      wenst te wijzigen, dient daartoe een met redenen omkleed verzoek bij Onze Minister in.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel28
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '28'
        paragraaf: '6'
  - number: 28a.2
    text: Onze Minister beslist op het verzoek na overleg met de rector en het hoofd van dienst.
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel28a
  - number: 28a.3
    text: 'Indien het verzoek wordt toegewezen:'
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel28a
  - number: 28a.3.a
    text: |-
      past, indien nodig, het hoofd van dienst het werkprogramma en de rector het studieprogramma aan en stellen zij deze
      programma's overeenkomstig [artikel 5, eerste en tweede lid][ref1], opnieuw vast, en


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel5
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '5'
        paragraaf: '2'
  - number: 28a.3.b
    text: |-
      bepaalt Onze Minister overeenkomstig [artikel 3, tweede lid][ref1], waar de buitenstage wordt doorgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel3
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '3'
        paragraaf: '2'
  - number: '29'
    text: |-
      Op voordracht van Onze Minister benoemen Wij een rechterlijk ambtenaar in opleiding, die de opleiding met
      gunstig resultaat heeft beëindigd en geschikt wordt geacht voor een der in [artikel 2][ref1] bedoelde functies,
      overeenkomstig diens voorkeur tot gerechtsauditeur bij een door Ons aan te wijzen gerecht of tot officier van
      justitie in de rang van substituut-officier van justitie in een door Ons aan te wijzen arrondissement. Bij de
      aanwijzing letten wij zowel op de voorkeur van de betrokken rechterlijk ambtenaar in opleiding als op het belang
      van de dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0003871#Artikel2
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003871
        artikel: '2'
        paragraaf: '2'
  - number: '30'
    text: |-
      Dit besluit berust mede op [artikel 2, tweede lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
  - number: '31'
    text: 'Dit besluit wordt aangehaald als: Besluit opleiding rechterlijke ambtenaren.'
    url: https://wetten.overheid.nl/BWBR0003871/2005-02-11#Artikel31
