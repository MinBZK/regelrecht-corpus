  - number: '2'
    text: >-
      1 Het is met ingang van 1 juli 1996 verboden beroeps- of bedrijfsmatig een gewasbeschermingsmiddel voorhanden of in
      voorraad te hebben zonder een vergunning uitvoeren gewasbescherming, een vergunning bedrijfsvoeren gewasbescherming
      of een vergunning distribueren gewasbeschermingsmiddelen.


      2 Het in het eerste lid vermelde verbod geldt niet voor gewasbeschermingsmiddelen bestemd voor de bestrijding van
      mollen en woelratten, die de werkzame stof fosforwaterstof bevatten of kunnen opleveren.


      3 Het is verboden een gewasbeschermingsmiddel bestemd voor de bestrijding van mollen en woelratten, dat de werkzame
      stof fosforwaterstof bevat of kan opleveren, beroeps- of bedrijfsmatig voorhanden of in voorraad te hebben zonder
      een vergunning mollen- en woelrattenbestrijding.


      4 Het in het derde lid vermelde verbod geldt niet voor de handel.


      5 Het eerste en derde lid zijn niet van toepassing ten aanzien van de ondernemer van een bedrijf of
      hoofdverantwoordelijke voor een instelling waar een beheerder in dienst is die beschikt over een vergunning als
      bedoeld in het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0006814/2001-07-28#Artikel2
  - number: '3'
    text: >-
      1 Het is met ingang van 1 juli 1996 verboden beroeps- of bedrijfsmatig een gewasbeschermingsmiddel te gebruiken
      zonder een vergunning uitvoeren gewasbescherming, een vergunning bedrijfsvoeren gewasbescherming of een vergunning
      distribueren gewasbeschermingsmiddelen.


      2 Het in het eerste lid vermelde verbod geldt niet voor gewasbeschermingsmiddelen bestemd voor de bestrijding van
      mollen en woelratten, die de werkzame stof fosforwaterstof bevatten of kunnen opleveren.


      3 Het is verboden een gewasbeschermingsmiddel bestemd voor de bestrijding van mollen en woelratten, dat de werkzame
      stof fosforwaterstof bevat of kan opleveren, beroeps- of bedrijfsmatig te gebruiken zonder een vergunning mollen-
      en woelrattenbestrijding.


      4 Het eerste lid is niet van toepassing ten aanzien van de ondernemer van een bedrijf of hoofdverantwoordelijke
      voor een instelling die uitsluitend een gewasbeschermingsmiddel laat gebruiken door:


      a. een beheerder die in dienst is en die beschikt over een vergunning als bedoeld in het eerste lid of


      b. een landbouwspuitbedrijf.


      5 Het derde lid is niet van toepassing ten aanzien van de ondernemer van een bedrijf of hoofdverantwoordelijke voor
      een instelling die een gewasbeschermingsmiddel bestemd voor de bestrijding van mollen en woelratten uitsluitend
      laat gebruiken door:


      a. een beheerder die in dienst is en die beschikt over een vergunning mollen- en woelrattenbestrijding;


      b. een persoon die niet in dienst is en die beschikt over een vergunning mollen- en woelrattenbestrijding.
    url: https://wetten.overheid.nl/BWBR0006814/2001-07-28#Artikel3
  - number: '4'
    text: >-
      1 Het is de beheerder van een landbouwspuitbedrijf met ingang van 1 juli 1996 verboden een gewasbeschermingsmiddel
      voorhanden of in voorraad te hebben of te gebruiken zonder een vergunning bedrijfsvoeren gewasbescherming of een
      vergunning distribueren gewasbeschermingsmiddelen.


      2 Het in het eerste lid vermelde verbod geldt niet voor gewasbeschermingsmiddelen bestemd voor de bestrijding van
      mollen en woelratten, die de werkzame stof fosforwaterstof bevatten of kunnen opleveren.


      3 Het is de beheerder van een landbouwspuitbedrijf verboden een gewasbeschermingsmiddel bestemd voor de bestrijding
      van mollen en woelratten, dat de werkzame stof fosforwaterstof bevat of kan opleveren, voorhanden of in voorraad te
      hebben of te gebruiken zonder een vergunning mollen- en woelrattenbestrijding.
    url: https://wetten.overheid.nl/BWBR0006814/2001-07-28#Artikel4
  - number: '5'
    text: >-
      Het is met ingang van 1 juli 1996 verboden een gewasbeschermingsmiddel af te leveren of daartoe in voorraad of
      voorhanden te hebben indien:


      a. de beheerder van een verkooppunt niet beschikt over een vergunning distribueren gewasbeschermingsmiddelen en


      b. degene die verkoopt, niet zijnde de beheerder, niet in het bezit is van een vergunning bedrijfsvoeren
      gewasbescherming of een vergunning distribueren gewasbeschermingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0006814/2001-07-28#Artikel5
  - number: '6'
    text: >-
      Onze Minister verleent op aanvraag de vergunning uitvoeren gewasbescherming, de vergunning bedrijfsvoeren
      gewasbescherming, de vergunning distribueren gewasbeschermingsmiddelen onderscheidenlijk de vergunning mollen-
      en woelrattenbestrijding aan degene die in het bezit is van één van de bij regeling van Onze Minister aangewezen
      diploma's, certificaten, getuigschriften, verklaringen van vakbekwaamheid of andere bescheiden.
    url: https://wetten.overheid.nl/BWBR0006814/2001-07-28#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister verleent op aanvraag aan degene die aantoont aan een buitenlandse instelling een aan de bij
      ministeriële regeling, bedoeld in [artikel 6][ref1], gestelde opleidingsvereisten gelijkwaardig examen met
      goed gevolg te hebben afgelegd, een daarbij behorende vergunning uitvoeren gewasbescherming, bedrijfsvoeren
      gewasbescherming, distribueren gewasbeschermingsmiddelen of mollen- en woelrattenbestrijding.

      2 Onze Minister verleent op aanvraag aan een onderdaan van een Lid-Staat als bedoeld
      in de [Algemene wet erkenning EG-beroepsopleidingen][ref2] die aantoont op grond van
      [artikel 7 van de Algemene wet erkenning EG-beroepsopleiding][ref3] te voldoen aan de bij ministeriële
      regeling, bedoeld in [artikel 6][ref4], gestelde opleidingsvereisten, een daarbij behorende vergunning uitvoeren
      gewasbescherming, bedrijfsvoeren gewasbescherming, distribueren gewasbeschermingsmiddelen of mollen- en
      woelrattenbestrijding.


      [ref1]: https://wetten.overheid.nl/BWBR0006814#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006781
      [ref3]: https://wetten.overheid.nl/BWBR0006781#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0006814#Artikel6
    url: https://wetten.overheid.nl/BWBR0006814/2001-07-28#Artikel7
