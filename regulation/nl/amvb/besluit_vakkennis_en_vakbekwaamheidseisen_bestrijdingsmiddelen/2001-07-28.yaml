  - number: '8'
    text: >-
      1 Onze Minister verleent op aanvraag voor de periode van vijf jaren aan degene die op 1 juli 1996 zestig jaren of
      ouder is de vergunning uitvoeren gewasbescherming.


      2 Onze Minister verleent op aanvraag voor de periode van vijf jaren aan de beheerder van een landbouwspuitbedrijf
      die op 1 juli 1996 zestig jaren of ouder is de vergunning bedrijfsvoeren gewasbescherming, mits ten genoege van
      Onze Minister wordt aangetoond dat hij reeds op 1 januari 1994 beheerder van het landbouwspuitbedrijf was.


      3 Onze Minister verleent op aanvraag voor de periode van vijf jaren aan de beheerder van een verkooppunt
      van bestrijdingsmiddelen die op 1 juli 1996 zestig jaren of ouder is de vergunning distribueren
      gewasbeschermingsmiddelen, mits ten genoege van Onze Minister wordt aangetoond dat hij reeds op 1 januari 1994
      beheerder was.


      4 Onze Minister verleent op aanvraag voor een periode van twee jaar tot uiterlijk 1 juli 1998 een vergunning
      uitvoeren gewasbescherming, een vergunning bedrijfsvoeren gewasbescherming dan wel een vergunning distribueren
      gewasbeschermingsmiddelen aan degene die een verklaring overlegt van een Agrarisch Opleidingscentrum. Uit deze
      verklaring moet blijken dat hij zich vóór 1 juli 1996 bij een Agrarisch Opleidingscentrum voor het betreffende
      cursusonderwijs gewasbescherming heeft aangemeld, en dat dit centrum niet in staat is de betrokkene de gewenste
      opleiding te geven vóór 1 juli 1996.


      5 De vergunningen, bedoeld in de bovenstaande leden, kunnen niet worden verlengd.
    url: https://wetten.overheid.nl/BWBR0006814/2001-07-28#Artikel8
  - number: '9'
    text: >-
      Bij ministeriële regeling worden nadere regels gesteld omtrent het indienen van een aanvraag voor een vergunning,
      de daarbij te verschaffen gegevens, en de wijze van verlening van de vergunning.
    url: https://wetten.overheid.nl/BWBR0006814/2001-07-28#Artikel9
  - number: '10'
    text: |-
      1 Onverminderd het bepaalde in [artikel 8, vierde lid][ref1], zijn de vergunningen uitvoeren gewasbescherming,
      bedrijfsvoeren gewasbescherming en distribueren gewasbeschermingsmiddelen geldig gedurende vijf jaren vanaf
      1 juli 1996 of bij verlening na 1 juli 1996 vanaf de datum van verlening. Onverminderd het bepaalde in
      [artikel 8, vijfde lid][ref2], kunnen deze vergunningen telkens met een periode van vijf jaren worden verlengd.

      2 De vergunning mollen- en woelrattenbestrijding is geldig gedurende vijf jaren vanaf de datum waarop deze
      vergunning is verleend. Deze vergunning kan telkens met een periode van vijf jaar worden verlengd.

      3 Bij ministeriële regeling worden nadere regels gesteld omtrent het verlengen van de vergunningen, bedoeld in
      het eerste en tweede lid. Daartoe kunnen tevens voorwaarden aan de verlenging worden gesteld, die mede betrekking
      kunnen hebben op nascholing.


      [ref1]: https://wetten.overheid.nl/BWBR0006814#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006814#Artikel8
    url: https://wetten.overheid.nl/BWBR0006814/2001-07-28#Artikel10
