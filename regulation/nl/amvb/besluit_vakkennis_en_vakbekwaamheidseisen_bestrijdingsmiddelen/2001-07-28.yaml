articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      wet: [Bestrijdingsmiddelenwet 1962][ref1];

      Onze Minister: Onze Minister van Landbouw, Natuurbeheer en Visserij;

      beheerder: degene die onmiddellijke leiding geeft aan de uitoefening van een bedrijf of instelling;

      landbouwspuitbedrijf: bedrijf dat ten behoeve van derden gewasbeschermingsmiddelen gebruikt;

      handel: als uitoefening van een bedrijf aan- en verkopen van gewasbeschermingsmiddelen;

      een dierplaag:

      1. een bruine of zwarte rat, een kakkerlak, een tropische mier of een hondenteek;

      2. insecten, mijten of dieren als bedoeld in [artikel 1, eerste lid, onderdeel h, van de wet][ref2] met
      uitzondering van micro-organismen of virussen, of

      3. insecten of mijten als bedoeld in [artikel 1, vijfde lid van de wet.][ref3]

      2 [De artikelen 2 tot en met 10][ref4] van dit besluit zijn niet van toepassing ten aanzien van

      a. gewasbeschermingsmiddelen als bedoeld in [artikel 1, vijfde lid][ref5], van de wet of niet-
      landbouwbestrijdingsmiddelen;

      b. gewasbeschermingsmiddelen bestemd om te worden gebruikt bij het machinaal coaten van zaad;

      c. het gebruiken, voorhanden of in voorraad hebben van gewasbeschermingsmiddelen als bedoeld in
      [artikel 1, eerste lid, onderdeel g , ten tweede, van de wet][ref6] bestemd om te worden gebruikt in een
      laboratorium bij weefselkweek in vitro;

      d. het gebruiken van gewasbeschermingsmiddelen op basis van de werkzame stof glyfosaat ter bestrijding van
      aardappelopslag door middel van handapparatuur mits het gewasbeschermingsmiddel reeds door een houder van een
      vergunning als genoemd in [artikel 2, eerste lid][ref7], in deze apparatuur is aangebracht;

      e. het gebruiken van gewasbeschermingsmiddelen op basis van de werkzame stoffen diquat of glyfosaat ten behoeve
      van het selecteren van bloembollen met apparatuur zoals voorgeschreven in het daarbij behorende wettelijk
      gebruiksvoorschrift respectievelijk de gebruiksaanwijzing, mits het gewasbeschermingsmiddel reeds door een houder
      van een vergunning als genoemd in [artikel 2, eerste lid][ref8], in deze apparatuur is aangebracht;

      3 De [artikelen 2 tot en met 10][ref9] van dit besluit zijn niet van toepassing met betrekking tot het voorhanden
      hebben, in voorraad hebben of afleveren door een fabrikant, importeur of handelaar indien het bestrijdingsmiddel
      is bestemd

      a. ter aflevering aan de handel of

      b. voor niet beroeps- of bedrijfsmatig gebruik.


