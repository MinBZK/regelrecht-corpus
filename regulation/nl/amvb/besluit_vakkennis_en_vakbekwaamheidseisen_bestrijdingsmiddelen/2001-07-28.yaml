preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 2 februari 1994, No. J. 942053,
    Directie Juridische en Bedrijfsorganisatorische Zaken, gedaan in overeenstemming met de Staatssecretaris van
    Welzijn, Volksgezondheid en Cultuur, Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en
    Onze Minister van Sociale Zaken en Werkgelegenheid;


    Gelet op artikel 13 van de Bestrijdingsmiddelenwet 1962;


    Gezien het advies van de Bestrijdingsmiddelencommissie;


    De Raad van State gehoord (advies van 3 mei 1994, No. W11.94.0056);


    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 30 juni 1994, No. J.
    948162, Directie Juridische en Bedrijfsorganisatorische Zaken, uitgebracht in overeenstemming met Onze Minister van
    Welzijn, Volksgezondheid en Cultuur, Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en
    Onze Minister van Sociale Zaken en Werkgelegenheid;


    Hebben goedgevonden en verstaan:
