  - number: '11'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst met uitzondering van [artikel 7, tweede lid][ref1]. Indien het bij koninklijke boodschap van 25 mei 1993
      ingediende voorstel van wet houdende regels inzake een algemeen stelsel van erkenning van beroepsopleidingen in
      de Europese Gemeenschappen ([Algemene wet erkenning EG-beroepsopleidingen][ref2]) (Kamerstukken II, 1992/1993, nr.
      23 169) tot wet wordt verheven en in werking treedt, treedt [artikel 7, tweede lid][ref3], op hetzelfde tijdstip
      in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0006814#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006781
      [ref3]: https://wetten.overheid.nl/BWBR0006814#Artikel7
    url: https://wetten.overheid.nl/BWBR0006814/2001-07-28#Artikel11
