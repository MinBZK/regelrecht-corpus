  - number: 10a
    text: |-
      1 Het is verboden beroeps- of bedrijfsmatig een bestrijdingsmiddel te gebruiken voor het afweren of bestrijden van
      een dierplaag of het bestrijden van een houtrotverwekkende schimmel.

      2 Het eerste lid is niet van toepassing ten aanzien van de gebruiker die in het bezit is van:

      a. een vakbekwaamheidsdiploma, dat is afgegeven of verlengd door een door Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer geregistreerde instelling of geregistreerd bedrijf, waarmee wordt voldaan aan
      door genoemde minister vastgestelde eindtermen, en dat niet ouder is dan vijf jaren, of

      b. een op aanvraag door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer afgegeven bewijs
      van gelijkstelling dan wel verlenging daarvan, dat niet ouder is dan vijf jaren, inhoudende:

      1. dat door de gebruiker is aangetoond dat hij met goed gevolg een opleiding heeft gevolgd aan een buitenlandse
      instelling, die gelijkwaardig is aan een in [onderdeel a][ref1] bedoelde instelling of bedoeld bedrijf, of

      2. dat door de gebruiker, zijnde een onderdaan van een Lid-Staat als bedoeld in de Algemene wet erkenning EG-
      beroepsopleidingen, is aangetoond op grond van [artikel 7 van de Algemene wet erkenning EG-beroepsopleidingen][ref2]
      dat hij over aan [onderdeel a][ref3] gelijkwaardige kwalificaties beschikt.

      3 Het eerste lid is niet van toepassing ten aanzien van de ondernemer van een bedrijf of hoofdverantwoordelijke
      voor een instelling die een bestrijdingsmiddel laat gebruiken door een persoon die beschikt over een diploma,
      bewijs van gelijkstelling of verlenging daarvan, als bedoeld in het tweede lid.

      4 Het eerste lid is niet van toepassing met betrekking tot een middel als bedoeld in of aangewezen op grond van
      [artikel 14, eerste of derde lid, van het Bestrijdingsmiddelenbesluit][ref4].

      5 Het eerste lid is niet van toepassing op een agrarische ondernemer die op het eigen bedrijf bestrijdingsmiddelen
      gebruikt voor het afweren of bestrijden van een dierplaag of het bestrijden van een houtrotverwekkende schimmel.

      6 Het eerste lid is gedurende vijf jaren na 1 juli 1999 niet van toepassing op degene die op 1 januari 1999 zestig
      jaren of ouder is.

      7 Het eerste lid is gedurende twee jaren na 1 juli 1999 niet van toepassing op degene die aantoont dat hij voor ten
      hoogste de tweede maal aan de opleiding voor het diploma of de verlenging daarvan, bedoeld in het tweede lid onder
      a, is begonnen.

      8 Het eerste lid is gedurende vijf jaren vanaf 1 juli 1999 niet van toepassing op degene die een diploma van de
      Stichting Vakopleiding Ongediertebestrijding heeft verkregen waarvan de geldigheid niet aan een bepaalde tijdsduur
      is verbonden.

      9 Het eerste lid is gedurende vijf jaren vanaf 1 juli 1999 niet van toepassing op degene die een diploma van
      Rentokil heeft verkregen.

      10 Een registratie als bedoeld in het tweede lid, onder a, wordt in de Staatscourant gepubliceerd. Aan een
      dergelijke registratie kunnen eisen worden gesteld. Een dergelijke registratie kan worden ingetrokken, wanneer niet
      meer wordt voldaan aan de door de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer vastgestelde
      eindtermen.


      [ref1]: https://wetten.overheid.nl/BWBR0006814#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0006781#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006814#Artikel10a
      [ref4]: https://wetten.overheid.nl/BWBR0002450#Artikel14
