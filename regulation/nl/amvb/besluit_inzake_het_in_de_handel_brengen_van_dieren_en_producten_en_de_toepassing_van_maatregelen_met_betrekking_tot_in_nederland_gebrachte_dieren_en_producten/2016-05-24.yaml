preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 13 december 1993, No. J. 9319
    743, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Gelet op Richtlijn nr. 89/662/EEG van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake
    veterinaire controles in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van
    de interne markt (Pb EG L 395), Richtlijn No. 90/425/EEG van de Raad van de Europese Gemeenschappen van 26 juni
    1990 inzake veterinaire en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende
    dieren en produkten in het vooruitzicht van de totstandbrenging van de interne markt (Pb EG L 224), Richtlijn
    nr. 90/675/EEG van de Raad van de Europese Gemeenschappen van 10 december 1990 tot vaststelling van de beginselen
    voor de organisatie van de veterinaire controles voor produkten uit derde landen die in de Gemeenschap worden
    binnengebracht (Pb EG L 373), Richtlijn nr. 91/496/EEG van de Raad van de Europese Gemeenschappen van 15 juli 1991
    tot vaststelling van de beginselen voor de organisatie van de veterinaire controles voor dieren uit derde landen
    die in de Gemeenschap worden binnengebracht en tot wijziging van de Richtlijnen 89/662/EEG, 90/425/EEG en 90/675/
    EEG (Pb EG L 268), Beschikking nr. 93/13/EEG van de Commissie van de Europese Gemeenschappen van 22 december
    1992 tot vaststelling van de procedures voor de veterinaire controles in de inspectieposten aan de grens van de
    Gemeenschap bij het binnenbrengen van produkten uit derde landen (Pb EG L 9) en Beschikking nr. 93/14/EEG van de
    Commissie van de Europese Gemeenschappen van 23 december 1992 tot vaststelling van uitvoeringsbepalingen inzake de
    veterinaire controles van produkten uit derde landen in vrije entrepots, vrije zones en douane-entrepots, alsmede
    tijdens het vervoer van een derde land naar een ander derde land via de Gemeenschap (Pb EG L 9);

    Gelet op de artikelen 78, 108 en 111 van de Gezondheids- en welzijnswet voor dieren;

    Gezien het advies van de Raad voor Dierenaangelegenheden, het Landbouwschap, het Produktschap Vee en Vlees,
    het Produktschap voor Pluimvee en Eieren, het Produktschap voor Vis en Visprodukten, het Bedrijfschap voor de
    Pluimveehandel en -industrie en het Bedrijfschap voor de Handel in Vee;

    De Raad van State gehoord (advies van 28 maart 1994, no. W11.93.0834);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 25 april 1994, no. J.
    946060, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006659/2016-05-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. [richtlijn nr. 89/662/EEG](31989L0662): Richtlijn van de Raad van de Europese Gemeenschappen van 11
      december 1989 inzake veterinaire controles in het intracommunautaire handelsverkeer in het vooruitzicht van de
      totstandbrenging van de interne markt (*PbEG* L 395);

      b. [richtlijn nr. 90/425/EEG](31990L0425): Richtlijn van de Raad van de Europese Gemeenschappen van 26 juni 1990
      inzake veterinaire en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende dieren
      en producten in het vooruitzicht van de totstandbrenging van de interne markt (*Pb EG* L 224);

      c. [richtlijn nr. 97/78/EG](31997L0078): [richtlijn nr. 97/78/EG](31997L0078) van de Raad van de Europese Unie van
      18 december 1997 tot vaststelling van de beginselen voor de organisatie van de veterinaire controles voor producten
      die uit derde landen in de Gemeenschap worden binnen gebracht (PbEG 1998, L 24);

      d. [richtlijn nr. 91/496/EEG](31991L0496): Richtlijn van de Raad van de Europese Gemeenschappen van 15 juli 1991
      tot vaststelling van de beginselen voor de organisatie van de veterinaire controles voor dieren uit derde landen
      die in de Gemeenschap worden binnengebracht en tot wijziging van de [Richtlijnen 89/662/EEG](31989L0662), [90/425/
      EEG](31990L0425) en [90/675/EEG](31990L0675) (*Pb EG* L 268);

      e. belanghebbende bij de lading: belanghebbende bij de lading als bedoeld in artikel 2, tweede lid, onderdeel e,
      van [richtlijn nr. 97/78/EG](31997L0078);

      f. wet: [Gezondheids- en welzijnswet voor dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0006659/2016-05-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: '2'
    text: |-
      1 Onze Minister kan, ter uitvoering van de [richtlijnen nrs. 89/662/EEG](31989L0662), [90/425/EEG]
      (31990L0425), [91/496/EEG](31991L0496) en [97/78/EG](31997L0078), de door de Europese Commissie op grond
      van [richtlijn nr. 97/78/EG](31997L0078) vastgestelde uitvoeringsbepalingen, alsmede ter uitvoering van
      de besluiten, bedoeld in artikel 33, tweede zin, van [richtlijn nr. 97/78/EG](31997L0078), onder nader
      door hem te stellen regelen bepalen dat, indien dieren of producten van dierlijke oorsprong op grond
      van het bepaalde krachtens [artikel 10 van de wet][ref1] dan wel op grond van de [artikelen 8][ref2]
      of [9, eerste en tweede lid, van het Fokkerijbesluit][ref3] of van het bepaalde krachtens de
      [artikelen 7, tweede lid][ref4], [9, vierde lid][ref5], of [10 van laatstgenoemd besluit][ref6], niet in Nederland
      hadden mogen worden gebracht:

      a. voor rekening van de belanghebbende bij de lading:

        - producten van dierlijke oorsprong voor andere doeleinden dan de menselijke consumptie worden gebruikt;
        - producten van dierlijke oorsprong worden teruggezonden naar een plaats die buiten het in bijlage I van [richtlijn
      nr. 97/78/EG](31997L0078) omschreven grondgebied is gelegen dan wel worden vernietigd;

      b. voor rekening van de importeur of diens gemachtigde:

        - dieren worden ondergebracht, gevoerd, gedrenkt en verzorgd;
        - dieren in tijdelijke afzondering worden geplaatst;
        - dieren worden doorgezonden naar een plaats die buiten het in bijlage I van [richtlijn nr. 97/78/EG](31997L0078)
      omschreven grondgebied is gelegen, worden geslacht dan wel gedood en vernietigd;

      c. voor rekening van de verzender, diens gemachtigde of degene die met de zorg van de dieren of de producten van
      dierlijke oorsprong is belast:

        - dieren in tijdelijke afzondering worden geplaatst:
        - dieren worden gedood en vernietigd of producten van dierlijke oorsprong worden vernietigd;
        - dieren of producten van dierlijke oorsprong onder toezicht van een door Onze Minister aangewezen ambtenaar worden
      geplaatst;
        - dieren worden geslacht;
        - dieren of producten van dierlijke oorsprong worden teruggezonden;

      d. voor rekening van de afnemer:

        - producten van dierlijke oorsprong worden vernietigd;

      -producten van dierlijke oorsprong worden teruggezonden;

        - producten van dierlijke oorsprong voor andere doeleinden worden gebruikt dan waarvoor ze zijn bestemd.

      2 Onze Minister kan ter uitvoering van het eerste lid afwijken van artikel 106 van de wet in die zin, dat hij kan
      bepalen dat de in die leden genoemde maatregelen worden genomen zonder vergoeding van Staatswege.


