  - number: '3'
    text: |-
      Onze Minister kan onder nader door hem te stellen regelen bepalen dat de maatregelen worden genomen die de
      Europese Commissie op grond van artikel 8, eerste lid, onderdeel a, laatste alinea, van [richtlijn nr. 90/425/EEG]
      (31990L0425) en van artikel 7, eerste lid, onderdeel a, laatste alinea, van [richtlijn nr. 89/662/EEG](31989L0662)
      heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006659/2016-05-24#Artikel3
  - number: '4'
    text: |-
      1 Ter uitvoering van de artikelen 12 en 13 van [richtlijn nr. 97/78/EG](31997L0078), ter uitvoering van de door
      de Europese Commissie op grond van die artikelen vastgestelde uitvoeringsbepalingen, alsmede ter uitvoering van de
      besluiten, bedoeld in artikel 33, tweede zin, van [richtlijn nr. 97/78/EG](31997L0078), stelt Onze Minister regelen
      met betrekking tot:

      a. de inslag in, de opslag in, alsmede de uitslag uit een douane-entrepot van producten van dierlijke oorsprong of
      andere producten die dragers van smetstof kunnen zijn;

      b. de behandeling van producten van dierlijke oorsprong of andere producten die dragers van smetstof kunnen zijn
      tijdens de opslag als bedoeld in onderdeel a;

      c. de erkenning van douane-entrepots als bedoeld in onderdeel a.

      2 Ter uitvoering van artikel 13 van [richtlijn nr. 97/78/EG](31997L0078) en ter uitvoering van de door de Europese
      Commissie op grond van dat artikel vastgestelde uitvoeringsbepalingen, stelt Onze Minister regelen met betrekking
      tot de erkenning van handelaren die rechtstreeks producten van dierlijke oorsprong leveren als proviand voor
      bemanning en passagiers aan zeevervoermiddelen.

      3 Onze Minister heft, onder nader door hem te stellen regelen en overeenkomstig een door hem vastgesteld tarief,
      bij de belanghebbende bij de lading een vergoeding van kosten ter zake van:

      a. de controles die worden verricht, op grond van de krachtens het eerste lid, onderdeel a, gestelde regelen, bij
      de inslag in of de uitslag uit een douane-entrepot van producten als bedoeld in het eerste lid, onderdeel a;

      b. de verlening en de instandhouding van de erkenningen, bedoeld in het eerste lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0006659/2016-05-24#Artikel4
  - number: '5'
    text: |-
      Onze Minister kan ter uitvoering van krachtens het Verdrag tot oprichting van de Europese Gemeenschap vastgestelde
      verplichtingen inzake de diergezondheid regelen stellen met betrekking tot het in Nederland in de handel brengen
      van dieren en producten van dierlijke oorsprong.
    url: https://wetten.overheid.nl/BWBR0006659/2016-05-24#Artikel5
  - number: '8'
    text: |-
      Onze Minister kan ter uitvoering van de [richtlijnen nrs. 89/662/EEG](31989L0662), [90/425/EEG](31990L0425),
      [97/78/EG](31997L0078) en [91/496/EEG](31991L0496) regelen stellen inzake veterinairrechtelijke of zoötechnische
      controles.
    url: https://wetten.overheid.nl/BWBR0006659/2016-05-24#Artikel8
  - number: '10'
    text: |-
      1 Een wijziging van één of meer onderdelen van de in [artikel 1][ref1] genoemde richtlijnen treedt voor de
      toepassing van de artikelen van dit besluit, waarin naar die onderdelen wordt verwezen, in werking met ingang van
      de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit,
      dat in de *Staatscourant* wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.

      2 Een wijziging van één of meer onderdelen van de in [artikel 1][ref2] genoemde beschikkingen treedt voor de
      toepassing van de artikelen van dit besluit, waarin naar die onderdelen wordt verwezen, in werking met ingang van
      de dag waarop aan de betrokken wijzigingsbeschikking uitvoering moet zijn gegeven.

      3 Onze Minister doet van een wijzigingsrichtlijn of -beschikking als bedoeld in het eerste en tweede lid mededeling
      in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0006659#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006659#Artikel1
    url: https://wetten.overheid.nl/BWBR0006659/2016-05-24#Artikel10
