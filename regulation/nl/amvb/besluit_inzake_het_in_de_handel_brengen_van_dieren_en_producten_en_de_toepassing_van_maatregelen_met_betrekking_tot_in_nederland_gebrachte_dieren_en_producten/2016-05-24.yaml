        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006659
        artikel: '1'
  - number: '11'
    text: |-
      Dit besluit wordt aangehaald als: Besluit inzake het in de handel brengen van dieren en producten en de toepassing
      van maatregelen met betrekking tot in Nederland gebrachte dieren en producten.
    url: https://wetten.overheid.nl/BWBR0006659/2016-05-24#Artikel11
  - number: '12'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006659/2016-05-24#Artikel12
