        artikel: '36'
  - number: '36'
    text: |-
      Aan een inrichting zijn geestelijke verzorgers van verschillende godsdiensten of levensovertuigingen verbonden,
      doch in elk geval geestelijke verzorgers van protestantse en rooms-katholieke gezindte en geestelijke verzorgers
      behorend tot het humanistisch verbond.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel36
  - number: '37'
    text: |-
      1 Bij het Ministerie van Veiligheid en Justitie zijn een hoofdpredikant, een hoofdaalmoezenier en een hoofd
      humanistisch geestelijke verzorging aangesteld. Zij treden op als vertegenwoordiging van de zendende instanties en
      dienen Onze Minister gevraagd en ongevraagd van advies omtrent de geestelijke verzorging in de inrichtingen.

      2 De hoofden, genoemd in het eerste lid, zijn in ieder geval belast met het doen van voordrachten voor aanstelling
      van geestelijke verzorgers bij de rijksinrichtingen behorende tot hun gezindte of levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel37
  - number: '38'
    text: |-
      1 De aanstelling van een geestelijke verzorger van protestantse of rooms-katholieke gezindte of een geestelijke
      verzorger behorend tot het humanistisch verbond bij een rijksinrichting geschiedt door of vanwege Onze Minister op
      voordracht van de betrokken hoofdgeestelijke, genoemd in [artikel 37, eerste lid][ref1].

      2 De aanstelling van een geestelijke verzorger van protestantse of rooms-katholieke gezindte of een
      geestelijke verzorger behorend tot het humanistisch verbond bij een justitiële particuliere inrichting
      geschiedt door of vanwege het bestuur van de inrichting gehoord de betrokken hoofdgeestelijke, genoemd in
      [artikel 37, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0008690#Artikel37
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '37'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0008690
        artikel: '37'
        hoofdstuk: '11'
  - number: '39'
    text: |-
      1 Een geestelijke verzorger van een andere dan de in [artikel 36][ref1] genoemde gezindte of levensovertuiging
      kan door het hoofd van de rijksinrichting aan diens inrichting worden verbonden anders dan bij wijze van een
      aanstelling. Het hoofd van de rijksinrichting neemt deze beslissing niet dan na overleg met de reeds aan de
      inrichting verbonden geestelijke verzorgers.

      2 Onze Minister kan functievereisten vaststellen ten aanzien van geestelijk verzorgers zoals bedoeld in de eerste
      volzin van het eerste lid.

      3 Een geestelijke verzorger die aan een rijksinrichting is verbonden anders dan bij wijze van aanstelling, ontvangt
      een bij regeling van Onze Minister vast te stellen vergoeding voor zijn werkzaamheden en de door hem gemaakte
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel36
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '36'
        hoofdstuk: '11'
  - number: '40'
    text: |-
      1 Onder eigen geld wordt verstaan:

      a. het geld dat de verpleegde bij binnenkomst in de inrichting in zijn bezit heeft;

      b. het geld dat tijdens zijn verblijf in de inrichting te zijnen gunste wordt ontvangen;

      c. de vergoeding voor het verrichten van werkzaamheden en het arbeidsloon, bedoeld in
      [artikel 46, tweede lid, van de wet][ref1].

      2 Het beheer van het eigen geld van de verpleegde berust bij het hoofd van de inrichting, tenzij in het
      verplegings- en behandelingsplan anders is bepaald.

      3 Wanneer de verpleegde geen beheer over zijn eigen geld heeft, heeft hij de beschikking over een rekening-courant
      bij de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel46
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '46'
  - number: '41'
    text: |-
      De ter beschikking gestelde of anderzins verpleegde die geen inkomen heeft, ontvangt vanwege Onze Minister een door
      deze vast te stellen zak- en kleedgeld.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel41
  - number: '42'
    text: |-
      1 De verpleegdenraad, bedoeld in [artikel 70, eerste lid, van de wet][ref1], bestaat uit ten minste drie en ten
      hoogste zeven leden.

      2 De leden worden gekozen bij meerderheid van stemmen.

      3 Het lidmaatschap van de verpleegdenraad eindigt na verloop van een termijn van twee jaar of zoveel eerder als de
      verpleging van het betreffende lid in de inrichting eindigt, aan hem proefverlof is verleend, dan wel zodra deze
      schriftelijk voor het lidmaatschap heeft bedankt.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel70
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '70'
  - number: '43'
    text: |-
      Het hoofd van de inrichting biedt de verpleegdenraad ten minste eenmaal per maand de gelegenheid tot het voeren van
      het overleg, bedoeld in [artikel 70, tweede lid, van de wet][ref1], tenzij bijzondere omstandigheden zich hiertegen
      verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel70
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '70'
  - number: '44'
    text: |-
      1 Het hoofd van de inrichting verschaft de verpleegdenraad de informatie, de tijd en de materiële middelen die voor
      zijn functioneren nodig zijn en biedt de verpleegdenraad eenmaal per maand gedurende twee uren de gelegenheid zich
      intern te beraden en daartoe te vergaderen.

      2 De leden van de verpleegdenraad hebben het recht aan het overleg, bedoeld in
      [artikel 70, tweede lid, van de wet][ref1], alsmede aan het in het eerste lid genoemde intern beraad deel te nemen.

      3 Het intern beraad, bedoeld in het eerste lid, vindt zonder toezicht plaats.

      4 Het hoofd van de inrichting kan op grond van de handhaving van de orde of veiligheid in de inrichting van het
      bepaalde in het tweede en derde lid afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel70
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '70'
  - number: '45'
    text: |-
      Geschillen tussen de verpleegdenraad en het hoofd van de inrichting kunnen door elk van beide partijen ter
      bemiddeling worden voorgelegd aan de commissie van toezicht.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel45
  - number: '46'
    text: |-
      1 Indien drie maanden voor het tijdstip waarop de termijn van de terbeschikkingstelling met bevel tot verpleging
      van overheidswege zal zijn verstreken, de verpleging nog niet is beëindigd, maakt het hoofd van de inrichting voor
      verpleging van ter beschikking gestelden binnen een maand te rekenen vanaf voornoemd tijdstip een advies, bedoeld
      in [artikel 509][ref1], op en zendt dit aan Onze Minister. Het advies betreft:

      a. de wenselijkheid van de verlenging van de terbeschikkingstelling;

      b. de termijn, waarover naar zijn mening, de verlenging zich zou moeten uitstrekken.

      2 Indien de uit de stoornis van de geestvermogens voortvloeiende gevaarlijkheid van de ter beschikking gestelde
      voor de veiligheid van anderen dan de ter beschikking gestelde of de algemene veiligheid van personen of goederen
      dusdanig is teruggebracht dat het verantwoord is de verpleging onder voorwaarden te beëindigen, doet het hoofd van
      de inrichting voor verpleging van ter beschikking gestelden bij het advies, bedoeld in het eerste lid, een daartoe
      strekkend schriftelijk voorstel.

      3 Bij het advies wordt een afschrift van de aantekeningen, bedoeld in [artikel 509][ref2], overgelegd alsmede,
      indien het hoofd van de inrichting voor verpleging van ter beschikking gestelden niet zelf psychiater is, het
      advies van een aan de inrichting verbonden psychiater.

      4 Indien in het geval, bedoeld in het eerste lid, de ter beschikking gestelde op grond van proefverlof buiten de
      inrichting voor verpleging van ter beschikking gestelden verblijft en in zijn proefverlof door de reclassering
      wordt begeleid, voegt het hoofd van de inrichting voor verpleging van ter beschikking gestelden bij zijn advies
      de beschouwingen van de reclassering inzake de wenselijkheid van verlenging van de terbeschikkingstelling of de
      voorwaardelijke beëindiging van de verpleging.

      5 Onze Minister zendt het advies met de bijlagen aan het openbaar ministerie bij de rechtbank die in eerste aanleg
      heeft kennis genomen van het misdrijf ter zake waarvan de terbeschikkingstelling is gelast.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel509o
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel509o
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 509o
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 509o
  - number: '47'
    text: |-
      Indien de verlenging van de terbeschikkingstelling er toe zou kunnen leiden dat de totale duur van de
      terbeschikkingstelling een periode van vier jaar of een veelvoud van vier jaar te boven gaat, zendt het hoofd van
      de inrichting voor verpleging van ter beschikking gestelden zes maanden voor het tijdstip waarop de termijn van de
      terbeschikkingstelling zal zijn verstreken, een voorlopig advies betreffende de wenselijkheid van de verlenging van
      de terbeschikkingstelling aan Onze Minister. [Artikel 46, vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel46
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '46'
        hoofdstuk: '14'
  - number: '48'
    text: |-
      1 Indien de verpleging voorwaardelijk is beëindigd of aan de terbeschikkingstelling voorwaarden zijn
      verbonden, zendt de reclassering die de ter beschikking gestelde hulp en steun verleent, indien verlenging
      van de terbeschikkingstelling wettelijk mogelijk is, drie maanden voor het tijdstip waarop de termijn van de
      terbeschikkingstelling zal zijn verstreken, advies inzake de wenselijkheid van die verlenging aan Onze Minister.
      Dit advies gaat vergezeld van een met redenen omkleed, gedagtekend en ondertekend advies van een psychiater die
      zelf de ter beschikking gestelde heeft onderzocht.

      2 De in het eerste lid bedoelde stukken worden twee maanden voor het tijdstip waarop de termijn van de
      terbeschikkingstelling zal zijn verstreken door tussenkomst van Onze Minister toegezonden aan het openbaar
      ministerie, bedoeld in [artikel 46, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel46
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '46'
        hoofdstuk: '14'
  - number: '49'
    text: |-
      1 Indien het openbaar ministerie naar aanleiding van het voorlopig advies, bedoeld in [artikel 47][ref1],
      voornemens is een vordering tot verlenging van de terbeschikkingstelling in te dienen waardoor de totale duur van
      de terbeschikkingstelling een periode van vier jaar of een veelvoud van vier jaar te boven gaat, doet het daarvan
      zo spoedig mogelijk mededeling aan Onze Minister.

      2 Na ontvangst van de mededeling, bedoeld in het eerste lid, draagt Onze Minister zorg voor het tijdig
      totstandkomen van een advies of rapport van deskundigen als bedoeld in [artikel 509][ref2] en voor tijdige
      toezending daarvan aan het openbaar ministerie, bedoeld in [artikel 46, vijfde lid][ref3].

      3 Onze Minister kan nadere regels stellen omtrent het onderzoek dat ten grondslag ligt aan het advies of rapport,
      bedoeld in [artikel 509][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel509o
      [ref3]: https://wetten.overheid.nl/BWBR0008690#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel509o
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel49
