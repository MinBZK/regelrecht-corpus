        artikel: 34b
        hoofdstuk: '10'
  - number: 34f
    text: |-
      1 De inspecteur stelt na beëindiging van elke a- of b-dwangbehandeling doch in ieder geval na afloop van de
      termijn, bedoeld in [artikel 16c, vierde lid, van de wet][ref1], een onderzoek in of de beslissing tot de
      behandeling zorgvuldig is genomen en of de uitvoering van de behandeling zorgvuldig is geschied.

      2 De inspecteur stelt eveneens een onderzoek in na beëindiging van elke gedwongen geneeskundige handeling, indien
      die handeling is verricht ter afwending van een gevaar dat voortvloeit uit de stoornis van de geestvermogens van
      de verpleegde.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16c
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel34f
    references:
