  - number: '71'
    text: |-
      1 Indien de ter beschikking gestelde de voorwaarden overtreedt, of anderzins het belang van de veiligheid van
      anderen dan wel de algemene veiligheid van personen of goederen zulks eist, kan de reclassering een voorstel tot
      het geven van een bevel tot verpleging door tussenkomst van Onze Minister zenden aan het openbaar ministerie bij
      de rechtbank die in eerste aanleg heeft kennis genomen van het misdrijf ter zake waarvan de terbeschikkingstelling
      is gelast.

      2 De reclassering dient desgevraagd Onze Minister en het openbaar ministerie, bedoeld in het eerste lid, van
      advies.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel71
  - number: '72'
    text: |-
      Van een inrichting als bedoeld in [artikel 38][ref1], wordt vereist dat deze:

      a. een instelling is als bedoeld in [artikel 1, eerste lid, onderdeel f, van de Wet toelating zorginstellingen][ref2]
      die is toegelaten voor het verlenen van zorg waarop aanspraak bestaat ingevolge de [Wet langdurige zorg][ref3], of

      b. is aangemerkt als psychiatrisch ziekenhuis als bedoeld in [artikel 1, onder ][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38a
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0035917
      [ref4]: https://wetten.overheid.nl/BWBR0005700#Artikel1
