      1 Bij elke inrichting is een commissie van toezicht waarvan de leden worden benoemd voor de tijd van vijf jaren.
      Zij kunnen tweemaal voor herbenoeming in aanmerking komen.

      2 De commissie bestaat uit ten minste zes en ten hoogste een door Onze Minister vast te stellen aantal leden.

      3 De commissie van toezicht is zo breed mogelijk samengesteld. Van elke commissie maken in elk geval deel uit:

      a. een met rechtspraak belast lid van de rechterlijke macht;

      b. een psychiater;

      c. een gedragsdeskundige met kennis van de intramurale zorg voor geestelijk gestoorden;

      d. een advocaat.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel7
  - number: '8'
    text: |-
      1 De leden van de commissie van toezicht worden door Onze Minister benoemd. Onze Minister wijst uit de leden een
      voorzitter aan.

      2 Aan de commissie is een secretaris verbonden. Deze is geen lid van de commissie. De secretaris wordt door
      Onze Minister benoemd en ontslagen. De secretaris van de commissie van toezicht is tevens secretaris van de
      beklagcommissie.

      3 De commissie kan uit haar midden een of meer plaatsvervangende secretarissen aanwijzen om, in overleg met de
      secretaris, bepaalde secretariaatswerkzaamheden te verrichten en de secretaris bij diens afwezigheid te vervangen.
      Onze Minister kan aan een commissie van toezicht een of meerdere plaatsvervangende secretarissen toevoegen die geen
      lid zijn van de commissie.

      4 Onze Minister beslist binnen drie maanden op een verzoek tot benoeming.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel8
  - number: '9'
    text: |-
      1 De benoeming van de leden en de secretaris alsmede de aanwijzing van de voorzitter van de commissie van toezicht
      bij een justitiële particuliere inrichting geschiedt op voordracht van het bestuur dan wel de Raad van Toezicht
      indien die de taken van het bestuur vervult.

      2 Een lid van het bestuur of de Raad van Toezicht indien die de taken van het bestuur vervult, kan niet worden
      benoemd tot lid, secretaris of plaatsvervangend secretaris van de commissie van toezicht.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel9
  - number: '10'
    text: |-
      Voor benoeming als lid, secretaris of plaatsvervangend secretaris komen niet in aanmerking:

      a. ambtenaren of andere personen, werkzaam onder de verantwoordelijkheid van Onze Minister op het terrein van
      de tenuitvoerlegging van vrijheidsbenemende straffen en maatregelen, niet zijnde ambtenaren bij het openbaar
      ministerie;

      b. personeelsleden of medewerkers, werkzaam bij een inrichting voor verpleging van ter beschikking gestelden;

      c. personen, werkzaam bij een door Onze Minister gesubsidieerde instelling die werkzaam is op het terrein van de
      tenuitvoerlegging van vrijheidsbenemende straffen en maatregelen indien zij in het kader van de uitoefening van hun
      functie te maken hebben met de personen ingesloten in de inrichting waarbij de commissie van toezicht is ingesteld;

      d. personen, werkzaam onder de verantwoordelijkheid van Onze Minister, indien hun onafhankelijkheid of
      onpartijdigheid hetzij door hun positie, hetzij door de aard van hun werkzaamheden in het geding zou kunnen komen;

      e. personen tegen wie bezwaren bestaan tegen de vervulling van de functie die blijken uit de algemene
      documentatieregisters als bedoeld in het [Besluit justitiële gegevens][ref1] of de politiegegevens, bedoeld
      in [artikel 1, onderdeel a, van de Wet politiegegevens][ref2]. De bezwaren dienen betrekking te hebben op het
      vertrouwelijk karakter van de functie alsmede de aan de functie verbonden bevoegheden.


      [ref1]: https://wetten.overheid.nl/BWBR0016544
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel10
