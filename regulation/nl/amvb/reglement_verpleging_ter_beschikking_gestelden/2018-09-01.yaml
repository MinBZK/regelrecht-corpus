articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de wet: de [Beginselenwet verpleging ter beschikking gestelden][ref1];

      b. de reclassering: een reclasseringsinstelling als bedoeld in
      [artikel 1, onder b, van de Reclasseringsregeling 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008765
      [ref2]: https://wetten.overheid.nl/BWBR0007120
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008765
      - id: ref2
        bwb_id: BWBR0007120
  - number: '2'
    text: |-
      1 Een aanvraag tot aanwijzing als particuliere inrichting voor verpleging van ter beschikking gestelden, bedoeld in
      [artikel 37][ref1], wordt bij Onze Minister ingediend.

      2 De aanvraag bevat de volgende bescheiden:

      a. de statuten of reglementen van de rechtspersoon die het psychiatrisch ziekenhuis beheert;

      b. een schriftelijke verklaring inhoudende dat een voorgenomen wijziging van de situatie met betrekking tot een
      der onderwerpen genoemd onder a en in het derde lid, ten minste een maand voordat de desbetreffende wijziging wordt
      doorgevoerd ter kennis van Onze Minister wordt gebracht.

      3 De rechtspersoon die het psychiatrisch ziekenhuis beheert legt tevens over:

      a. de door Onze Minister verlangde gegevens over de bouwkundige voorzieningen die van belang zijn voor de
      beoordeling van de veiligheid binnen de inrichting en de maatschappelijke veiligheid daarbuiten;

      b. de door Onze Minister verlangde gegevens over de personele en materiële toerusting die van belang zijn voor de
      beoordeling van de geschiktheid van de inrichting voor de verpleging van ter beschikking gestelden.

      4 Onze Minister beslist binnen zes maanden na ontvangst van de aanvraag, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37d
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37d
  - number: '3'
    text: |-
      1 De aanwijzing als particuliere inrichting wordt door Onze Minister ingetrokken:

      a. op verzoek van de rechtspersoon die het psychiatrisch ziekenhuis beheert;

      b. indien de beveiliging dan wel de personele of materiële toerusting van de inrichting, bedoeld in artikel 2,
      derde lid, niet meer voldoet aan de eisen die daaraan naar het oordeel van Onze Minister moeten worden gesteld.

      2 De aanwijzing als particuliere inrichting kan door Onze Minister worden ingetrokken, indien de
      rechtspersoon heeft gehandeld in strijd met de toepasselijke regelgeving alsmede hetgeen overeenkomstig
      [artikel 2, tweede lid, onder b][ref1], is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel2
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel3
    references:
