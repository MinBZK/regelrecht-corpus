        artikel: '54'
        hoofdstuk: '16'
  - number: '58'
    text: |-
      Bijzondere voorwaarden, bedoeld in [artikel 51, tweede lid, van de wet][ref1], strekkende tot het verkrijgen van
      hulp en steun worden door het hoofd van de inrichting voor verpleging van ter beschikking gestelden ter kennis
      gebracht van de reclassering die de ter beschikking gestelde hulp en steun verleent. Hetzelfde geldt met betrekking
      tot beslissingen die strekken tot wijziging, aanvulling of opheffing van de voorwaarden waarop de verlening van
      hulp en steun betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel51
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '51'
  - number: '59'
    text: |-
      1 De reclassering, bedoeld in [artikel 58][ref1], stelt zich zo spoedig mogelijk nadat zij is belast met het
      verlenen van hulp en steun in verbinding met met het hoofd van de inrichting voor verpleging van ter beschikking
      gestelden dat aan de ter beschikking gestelde proefverlof heeft verleend.

      2 De reclassering draagt er zorg voor dat het hoofd van de inrichting voor verpleging van ter beschikking gestelden
      in kennis wordt gesteld van alle bijzondere voorvallen welke de ter beschikking gestelde betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel58
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '58'
        hoofdstuk: '16'
  - number: '60'
    text: |-
      1 De reclassering rapporteert regelmatig aan het hoofd van de inrichting voor verpleging van ter beschikking
      gestelden dat proefverlof heeft verleend, met dien verstande dat de eerste rapportage plaatsvindt nadat een maand
      van het proefverlof is verstreken en dat vervolgens telkens wordt gerapporteerd over een periode van twee maanden.

      2 Indien de ter beschikking gestelde de veiligheid van anderen of de algemene veiligheid van personen of goederen
      in gevaar brengt of dreigt te brengen dan wel de bij het proefverlof opgelegde verplichtingen niet nakomt, wordt
      daarover tussentijds gerapporteerd.

      3 In de loop van de eerste helft van de derde maand voor het tijdstip waarop de termijn van de
      terbeschikkingstelling met verpleging van overheidswege zal zijn verstreken, zendt de reclassering aan het hoofd
      van de inrichting voor verpleging van ter beschikking gestelden haar beschouwingen inzake de wenselijkheid van
      verlenging van de terbeschikkingstelling. Deze beschouwingen gaan zo mogelijk vergezeld van het advies van de aan
      de reclassering verbonden psychiater die bemoeienis heeft gehad met de ter beschikking gestelde.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel60
  - number: '61'
    text: |-
      1 De reclassering kan uit eigen beweging aan het hoofd van de inrichting voor verpleging van ter
      beschikking gestelden een voorstel doen tot wijziging of opheffing van de voorwaarden, bedoeld in
      [artikel 51, tweede lid, van de wet][ref1].

      2 De reclassering kan uit eigen beweging door tussenkomst van het hoofd van de inrichting voor verpleging van
      ter beschikking gestelden en Onze Minister aan het openbaar ministerie een voorstel doen tot het vorderen van
      voorwaardelijke beëindiging van de verpleging van overheidswege.

      3 De reclassering dient desgevraagd het hoofd van de inrichting voor verpleging van ter beschikking gestelden en
      Onze Minister van advies.


