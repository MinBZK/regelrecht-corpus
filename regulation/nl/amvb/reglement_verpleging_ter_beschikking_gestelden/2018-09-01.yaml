  - number: '63'
    text: |-
      Het algemeen toezicht op ter beschikking gestelden die niet van overheidswege worden verpleegd, berust bij Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel63
  - number: '64'
    text: |-
      1 Bij beëindiging van het verblijf in de inrichting voor verpleging van ter beschikking gestelden ontvangt de
      ter beschikking gestelde of anderszins verpleegde vergoeding voor een reis of reisgelegenheid naar zijn woon- of
      verblijfplaats binnen Nederland.

      2 Indien de omstandigheden daartoe grond opleveren, kan Onze Minister beslissen dat de betrokkene onder geleide
      naar de plaats van zijn bestemming wordt overgebracht.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel64
  - number: '65'
    text: |-
      1 Onze Minister ontvangt ten behoeve van het toezicht, bedoeld in [artikel 63][ref1], zo spoedig mogelijk
      mededeling van elke op een niet van overheidswege verpleegde ter beschikking gestelde betrekking hebbende:

      a. onherroepelijk geworden uitspraak waarbij terbeschikkingstelling met voorwaarden is gelast, als bedoeld in
      [artikel 38, eerste lid, van het Wetboek van Strafrecht][ref2];

      b. rechterlijke beslissing inzake een vordering op grond van [artikel 38b][ref3], [38c][ref4], [38i ][ref5] of
      [38k van het Wetboek van Strafrecht][ref6];

      c. beslissing tot vrijheidsontneming door het bevoegd gezag;

      d. onherroepelijk geworden uitspraak van een burgerlijk of militair gerecht waarbij ten aanzien van de ter
      beschikking gestelde opnieuw is beslist dat hij zich aan een misdrijf heeft schuldig gemaakt.

      2 De in het eerste lid genoemde feiten worden aan Onze Minister medegedeeld door de ambtenaren met de
      tenuitvoerlegging van de in dat lid bedoelde rechterlijke beslissingen belast, onderscheidenlijk elke ambtenaar van
      het openbaar ministerie die van de in het eerste lid, onder *c*, bedoelde beslissing tot vrijheidsontneming kennis
      krijgt.


