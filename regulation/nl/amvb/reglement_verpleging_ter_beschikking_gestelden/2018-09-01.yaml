  - number: '22'
    text: |-
      1 Overbrenging van een ter beschikking gestelde met het oog op de aanvang van de tenuitvoerlegging van het bevel
      tot verpleging van overheidswege geschiedt op last van het openbaar ministerie bij de rechtbank die in eerste
      aanleg heeft kennis genomen van het misdrijf ter zake waarvan de terbeschikkingstelling is gelast.

      2 Overbrenging van een ter beschikking gestelde of anderszins verpleegde naar een psychiatrisch ziekenhuis met
      machtiging van de rechter geschiedt op last van het openbaar ministerie bij het gerecht dat de machtiging op grond
      van de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1] heeft verleend.

      3 Indien [artikel 14, tweede lid, van de wet][ref2] is toegepast, indien het hoofd van de inrichting voor
      verpleging van ter beschikking gestelden het proefverlof heeft beëindigd of in geval van ongeoorloofde afwezigheid,
      geschiedt de overbrenging krachtens beslissing van het hoofd van de inrichting voor verpleging van ter beschikking
      gestelden. Deze kan ter uitvoering van zijn beslissing de hulp inroepen van het openbaar ministerie van het
      arrondissement waarin de ter beschikking gestelde of anderszins verpleegde verblijft.

      4 In de andere gevallen geschiedt de overbrenging bij beslissing van Onze Minister.

      5 Onze Minister kan omtrent overbrenging, bedoeld in dit artikel, nadere regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005700
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel14
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005700
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '14'
  - number: '23'
    text: |-
      1 Ongeoorloofde afwezigheid vangt aan op de dag dat de ter beschikking gestelde of anderszins verpleegde zich aan
      de tenuitvoerlegging van de vrijheidsbenemende straf of maatregel heeft onttrokken.

      2 Ongeoorloofde afwezigheid eindigt op de dag dat de ter beschikking gestelde of anderszins verpleegde zich meldt,
      hij wordt aangehouden, of door intrekking van het verzoek om signalering. Deze dag wordt niet meegerekend in de
      duur van de ongeoorloofde afwezigheid, bedoeld in [artikel 38][ref1].

      3 Het hoofd van de inrichting voor verpleging van ter beschikking gestelden verzoekt de politie de ongeoorloofd
      afwezig ter beschikking gestelde of anderszins verpleegde te signaleren. Onze Minister kan aanwijzingen geven ten
      aanzien van dit verzoek alsmede de intrekking daarvan.

      4 Van het verzoek om signalering en van de intrekking van een verzoek om signalering wordt aantekening gehouden in
      een daartoe bestemd register dat volgens een door Onze Minister vastgesteld model is ingericht.

      5 Onze Minister wordt onverwijld in kennis gesteld van elk verzoek om signalering of een intrekking van een verzoek
      om signalering.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38f
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38f
  - number: '24'
    text: |-
      Het hoofd van de inrichting meldt onverwijld andere bijzondere voorvallen aan Onze Minister. Hij verstrekt Onze
      Minister te allen tijde alle verlangde inlichtingen. Onze Minister kan nadere regels stellen omtrent de inhoud en
      de wijze van melding.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel24
  - number: '25'
    text: |-
      1 In het verplegings- en behandelingsplan worden ten minste opgenomen:

      a. de diagnose van de stoornis van de verpleegde;

      b. de therapeutische middelen die zullen worden toegepast, zo mogelijk gerelateerd aan de verschillende aspecten
      die in de stoornis te onderscheiden zijn;

      c. of er overeenstemming over het verplegings- en behandelingsplan is;

      d. de vrijheden die de verpleegde zijn toegekend boven de hem bij of krachtens de wet toekomende rechten, alsmede
      de voorwaarden die daaraan verbonden zijn en de consequenties van het niet opvolgen van die voorwaarden.

      2 In geval van een behandeling overeenkomstig [artikel 16b, onder a of b, van de wet][ref1] wordt in het
      verplegings- en behandelingsplan eveneens opgenomen:

      a. welke minder bezwarende middelen zijn aangewend om het gevaar dat de stoornis van de geestvermogens de
      verpleegde doet veroorzaken weg te nemen dan wel af te wenden; en

      b. de wijze waarop rekening wordt gehouden met de voorkeuren van de verpleegde ten aanzien van de behandeling.

      3 Het deel van het verplegings- en behandelingsplan waarover geen overeenstemming kan worden bereikt met
      de verpleegde dan wel diens curator of mentor, wordt slechts vastgesteld door een psychiater nadat een
      multidisciplinair overleg heeft plaatsgehad waaraan in ieder geval een psychiater, een arts, een psycholoog en een
      verpleegkundige hebben deelgenomen.

      4 Ingeval van een behandeling overeenkomstig [artikel 16b, onder a, van de wet][ref2] worden de verklaringen van
      de psychiaters, bedoeld in [artikel 16c, tweede lid, van de wet][ref3], bij het in het derde lid bedoelde overleg
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
      [ref3]: https://wetten.overheid.nl/BWBR0008765#Artikel16c
