  - number: '73'
    text: |-
      De directeur van een inrichting als bedoeld in [artikel 38][ref1], verleent de door Onze Minister aangewezen
      ambtenaren te allen tijde toegang tot de plaatsen waar ter beschikking gestelden verblijven. De ambtenaren zijn,
      voor zover dit voor de uitoefening van hun taak redelijkerwijs nodig is, bevoegd de op deze personen betrekking
      hebbende stukken in te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38a
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38a
  - number: '74'
    text: |-
      De directeur van een inrichting als bedoeld in [artikel 38][ref1], houdt van de in deze inrichting opgenomen ter
      beschikking gestelden aantekeningen als bedoeld in [artikel 5][ref2]. Het tweede en derde lid van [artikel 5][ref3]
      zijn van toepassing. [Artikel 24][ref4] is van overeenkomstige toepassing, met dien verstande dat de melding tevens
      wordt gedaan aan het openbaar ministerie dat op grond van [artikel 67, eerste lid][ref5], het toezicht op de ter
      beschikking gestelde uitoefent alsmede aan de reclassering, bedoeld in [artikel 62][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38a
