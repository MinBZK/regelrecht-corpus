  - number: '26'
    text: |-
      1 Het verplegings- en behandelingsplan bestrijkt ten minste een periode van één jaar.

      2 Gedurende de verpleging kan het verplegings- en behandelingsplan worden gewijzigd. Bij een wijziging wordt het
      evaluatieverslag betrokken.

      3 Een wijziging in het verplegings- en behandelingsplan wordt, in overleg met de verpleegde, vastgesteld. De
      wijziging wordt hem voor het ingaan daarvan medegedeeld.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel26
  - number: '27'
    text: |-
      1 Het hoofd van de inrichting geeft in het evaluatieverslag zijn visie op de persoon van de verpleegde weer en
      besteedt daarbij in elk geval aandacht aan de volgende aspecten:

      a. het verblijf op de afdeling;

      b. de vraag, het aanbod en het gebruik dat gemaakt wordt van de behandeling;

      c. de veranderingen in het psychische toestandsbeeld van de verpleegde in het kader van de verpleging en
      behandeling;

      d. de bewegingsvrijheid binnen en buiten de inrichting;

      e. incidenten waarbij de verpleegde betrokken is geweest;

      f. toegepaste individuele beperkingen;

      g. de mening van de verpleegde.

      2 Het verslag bevat voornemens die van belang zijn voor de verpleging en behandeling.

      3 Het verslag komt tot stand in samenwerking met de bij de verpleging en behandeling meest betrokken
      personeelsleden of medewerkers.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel27
  - number: '28'
    text: |-
      1 Indien de verpleegde gedurende de verslagperiode heeft verbleven in een andere inrichting voor verpleging van
      ter beschikking gestelden of in een psychiatrisch ziekenhuis, dan wel in een huis van bewaring, verschaft het hoofd
      van die inrichting, de geneesheer-directeur van dat ziekenhuis onderscheidenlijk de directeur van dat huis van
      bewaring, de nodige gegevens aan hem die met de vaststelling van het verslag is belast.

      2 Dezelfde verplichting geldt voor de instelling, bedoeld in [artikel 51, tweede lid, van de wet][ref1], die
      gedurende de verslagperiode belast is geweest met het verlenen van hulp en steun aan de verpleegde in het kader
      van proefverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel51
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel28
