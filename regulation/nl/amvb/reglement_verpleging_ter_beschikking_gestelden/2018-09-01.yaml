  - number: '4'
    text: |-
      1 Het hoofd van de rijksinrichting brengt jaarlijks vóór 1 oktober aan Onze Minister een jaarplan voor het volgende
      jaar uit. Het jaarplan omvat in ieder geval een begroting van de kosten en opbrengsten voor dat jaar.

      2 Het hoofd van de rijksinrichting brengt jaarlijks vóór 1 maart aan Onze Minister verslag over zijn werkzaamheden
      in het voorgaande jaar uit. Bij dit verslag wordt een jaarrekening gevoegd.

      3 Onze Minister kan regels stellen aan de vorm en de inhoud van de in het eerste en tweede lid genoemde stukken.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel4
  - number: '5'
    text: |-
      1 Omtrent iedere ter beschikking gestelde of anderszins verpleegde worden door het hoofd van de inrichting
      voor verpleging van ter beschikking gestelden aantekeningen gehouden omtrent diens lichamelijke en geestelijke
      gesteldheid, bedoeld in [artikel 509][ref1].

      2 De aantekeningen bevatten in elk geval:

      a. zo volledig mogelijke gegevens betreffende de afkomst en het verleden;

      b. gegevens omtrent de lichamelijke en geestelijke gesteldheid bij binnenkomst;

      c. gegevens omtrent de ontwikkelingen gedurende de verpleging;

      d. gegevens omtrent belangrijke voorvallen gedurende de verpleging.

      3 Onze Minister kan een model voor de aantekeningen vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel509o
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 509o
  - number: '6'
    text: |-
      1 Het hoofd van de inrichting houdt in een register aantekening van de beslissingen tot beperking van het
      recht op onaantastbaarheid van het lichaam van de verpleegde, genoemd in de [artikelen 16b, onder b][ref1],
      [16c, eerste en vijfde lid][ref2], [24 tot en met 28][ref3] en [30][ref4], alsmede de beslissingen tot afzondering
      of separatie, genoemd in [artikel 34][ref5], en van elke strafoplegging, genoemd in [artikel 49 van de wet][ref6].

      2 De aantekening bevat in elk geval:

      a. de personalia van de verpleegde;

      b. de aard van de genomen beslissing;

      c. de omstandigheden die aanleiding gaven tot het nemen van de beslissing;

      d. de diagnose, voor zover de beslissing wordt genomen ter afwending van ernstig gevaar dat voortvloeit uit de
      stoornis van de geestvermogens van de verpleegde;

      e. indien de verpleegde zich tegen de beslissing heeft verzet, een mededeling daarvan;

      f. voor zover van toepassing, de duur van de beperkende maatregel.

      3 Onze Minister kan een model voor het register vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
