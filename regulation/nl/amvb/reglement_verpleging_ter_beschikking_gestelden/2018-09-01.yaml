  - number: '75'
    text: |-
      De directeur van een inrichting als bedoeld in [artikel 38][ref1], verschaft de reclassering die is belast met de
      hulp en steun van een ter beschikking gestelde die in zijn inrichting verblijft de informatie die nodig is met het
      oog op de verlening van hulp en steun en de opstelling van de adviezen die de reclassering opstelt met betrekking
      tot de ter beschikking gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38a
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel75
