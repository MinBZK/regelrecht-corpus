  - number: 33a
    text: |-
      1 Een geneeskundige behandeling wordt verricht in een daartoe geschikte ruimte, onder verantwoordelijkheid van de
      behandelend arts.

      2 Er is ten behoeve van de geneeskundige behandeling vierentwintig uur per dag, zeven dagen per week, voldoende
      psychiatrisch geschoold verpleegkundig personeel aanwezig. Bovendien is vierentwintig uur per dag, zeven dagen per
      week, een psychiater beschikbaar.

      3 Een geneeskundige behandeling wordt slechts uitgevoerd door een arts of verpleegkundige die over voldoende
      deskundigheid beschikt deze behandeling uit te voeren en indien daartoe voldoende voorzieningen beschikbaar zijn.

      4 Eens per twee weken, of vaker indien het belang van de verpleegde dit eist, vindt een multidisciplinair overleg
      plaats, waaraan in ieder geval een psychiater, een arts, een psycholoog en een verpleegkundige deelnemen.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel33a
  - number: '34'
    text: |-
      1 Voordat het hoofd van de inrichting beslist dat een door de arts noodzakelijk geachte b-dwangbehandeling of
      gedwongen geneeskundige handeling zal worden verricht, pleegt het hoofd van de inrichting overleg met die arts
      en met het hoofd van de afdeling waar de verpleegde verblijft. Indien de behandeling door een andere arts wordt
      verricht, wordt tevens met hem overlegd.

      2 Ingeval van b-dwangbehandeling of indien het verrichten van een gedwongen geneeskundige handeling noodzakelijk is
      ter afwending van gevaar dat voortvloeit uit de stoornis van de geestvermogens van de verpleegde, pleegt het hoofd
      van de inrichting bovendien overleg met de voor de behandeling verantwoordelijke psychiater.

      3 In het in het eerste en tweede lid bedoelde overleg wordt nagegaan of het gevaar niet op een andere wijze kan
      worden afgewend.

      4 In de situatie bedoeld in [artikel 26, tweede lid, van de wet][ref1], pleegt het afdelingshoofd het in het eerste
      respectievelijk tweede lid bedoelde overleg. Het overleg van het hoofd van de inrichting met de in het eerste en
      tweede lid bedoelde personen vindt vervolgens zo spoedig mogelijk na de aanvang van de geneeskundige behandeling
      plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel26
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '26'
  - number: 34a
    text: |-
      1 Zo spoedig mogelijk na de aanvang van de gedwongen geneeskundige handeling wordt door of onder
      verantwoordelijkheid van een arts een plan opgesteld gericht op een zodanige verbetering van de toestand van
      de verpleegde dat de toepassing van de gedwongen geneeskundige handeling kan worden beëindigd. Dit plan wordt
      opgenomen in het verplegings- en behandelingsplan.

      2 Bij de keuze voor een bepaalde geneeskundige handeling wordt steeds gekozen voor de voor de verpleegde minst
      ingrijpende handeling.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel34a
  - number: 34b
    text: |-
      1 Voordat het hoofd van de inrichting de beslissing tot voortzetting van a-dwangbehandeling neemt, pleegt hij
      overleg met in ieder geval de voor de behandeling verantwoordelijke psychiater en met het hoofd van de afdeling
      waar de verpleegde verblijft.

      2 In het in het eerste lid bedoelde overleg wordt nagegaan of van de voortzetting van de behandeling alsnog het
      beoogde effect kan worden verwacht.

      3 De uitkomsten van het multidisciplinaire overleg, bedoeld in [artikel 33a, vierde lid][ref1], worden bij de
      beslissing meegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel33a
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: 33a
        hoofdstuk: '10'
  - number: 34c
    text: |-
      De verpleegde wordt gedurende de periode dat de a- of b-dwangbehandeling of de gedwongen geneeskundige handeling
      wordt verricht, zo vaak als nodig is bezocht door een arts of in diens opdracht een verpleegkundige. Het verslag
      van diens bevindingen wordt opgenomen in het verpleegdedossier.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel34c
  - number: 34d
    text: |-
      1 Het hoofd van de inrichting stelt de voorzitter van de commissie van toezicht, de raadsman van de verpleegde,
      de curator en de mentor in kennis van het voornemen tot een beslissing tot a-dwangbehandeling uiterlijk drie dagen
      voor het nemen van die beslissing. Zij worden in de gelegenheid gesteld bezwaren tegen de beslissing kenbaar te
      maken.

      2 De voorzitter van de commissie van toezicht doet onverwijld een melding aan de maandcommissaris. De
      maandcommissaris bezoekt na de melding onverwijld de verpleegde.

      3 Van de toepassing van een a-dwangbehandeling, b-dwangbehandeling, gedwongen geneeskundige handeling of
      voortzetting van a-dwangbehandeling wordt uiterlijk bij de aanvang van de behandeling melding gedaan aan Onze
      Minister en de commissie van toezicht. Ingeval van een a-dwangbehandeling, b-dwangbehandeling of ingeval een
      gedwongen geneeskundige handeling wordt toegepast in verband met een gevaar dat voortvloeit uit een stoornis van de
      geestvermogens van de verpleegde, wordt bovendien melding gedaan aan de inspecteur.

      4 Bij de aanvang van een a-dwangbehandeling geeft het hoofd van de inrichting daarvan eveneens kennis aan de in het
      eerste lid genoemde personen.

      5 Het hoofd van de inrichting zendt met de melding, bedoeld in het derde lid, een afschrift van de beslissing tot
      de behandeling mee waarin hij in ieder geval vermeldt:

      a. in verband met welk gevaar is besloten tot een a-dwangbehandeling, b-dwangbehandeling of een gedwongen
      geneeskundige handeling;

      b. welke minder bezwarende middelen zijn aangewend om het gevaar weg te nemen dan wel af te wenden;

      c. welke personen, bedoeld in [artikel 16a, onder c, van de wet][ref1], zich tegen de behandeling verzetten;

      d. de wijze waarop rekening wordt gehouden met de voorkeuren van de verpleegde ten aanzien van de behandeling; en

      e. indien een behandeling plaatsvindt in een situatie waarin het de verpleegde is die zich verzet, of deze in
      staat kan worden geacht gebruik te kunnen maken van de regeling, vervat in de [hoofdstukken XIV–XV][ref2]
      respectievelijk [XVI van de wet][ref3].

      6 Ingeval van een beslissing tot a-dwangbehandeling, b-dwangbehandeling of een beslissing tot voortzetting van
      a-dwangbehandeling, vermeldt het hoofd tevens welke pogingen zijn gedaan om tot overeenstemming als bedoeld in
      [artikel 16a, onder b, van de wet][ref4] te komen. In geval van een beslissing tot a-dwangbehandeling vermeldt hij
      bovendien welke bezwaren tegen de behandeling zijn aangevoerd door de personen, bedoeld in het eerste lid.

      7 Van een beëindiging van een a-dwangbehandeling, b-dwangbehandeling, of gedwongen geneeskundige handeling geeft
      het hoofd van de inrichting kennis aan de personen, genoemd in het derde en – indien van toepassing – vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXIV
      [ref3]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXVI
      [ref4]: https://wetten.overheid.nl/BWBR0008765#Artikel16a
