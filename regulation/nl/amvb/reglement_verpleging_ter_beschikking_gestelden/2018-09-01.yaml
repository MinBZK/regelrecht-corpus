        bwb_id: BWBR0001903
        artikel: 509w
  - number: '52'
    text: |-
      1 Het hoofd van de inrichting voor verpleging van ter beschikking gestelden stelt de ter beschikking gestelde of
      anderszins verpleegde in de gelegenheid de inrichting voor verpleging van ter beschikking gestelden te verlaten
      teneinde een gerechtelijke procedure bij te wonen:

      a. indien hij krachtens wettelijk voorschrift verplicht is voor een rechter of bestuursorgaan te verschijnen;

      b. indien hij ter zake van een misdrijf moet terecht staan;

      c. indien hij bij het bijwonen van de procedure een aanmerkelijk belang heeft en tegen het verlaten van de
      inrichting hiertoe geen overwegend bezwaar bestaat.

      2 Het hoofd van de inrichting voor verpleging van ter beschikking gestelden kan bepalen dat gedurende het verblijf
      buiten de inrichting toezicht wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel52
  - number: '53'
    text: |-
      1 Verlof als bedoeld in [artikel 50, eerste lid, van de wet][ref1], wordt in de navolgende vormen onderscheiden:

      a. begeleid verlof;

      b. onbegeleid verlof;

      c. transmuraal verlof;

      d. incidenteel verlof.

      2 Voordat het hoofd van de inrichting voor verpleging van ter beschikking gestelden overgaat tot het verlenen
      van een vorm van verlof, bedoeld in het eerste lid, verzoekt deze Onze Minister schriftelijk een machtiging.
      De machtiging van Onze Minister kan mede omvatten het meermalen verlenen van de in het eerste lid onderscheiden
      verlofsoort. De machtiging wordt verleend voor de duur van een jaar. Ten behoeve van het verlenen van een nieuwe
      machtiging draagt de inrichting voor verpleging van ter beschikking gestelden twee maanden voor het verlopen van
      de machtiging zorg voor een evaluatie aan Onze Minister. Een nieuwe machtiging wordt slechts verleend indien een
      evaluatie afgegeven is.

      De machtiging vervalt:

      1°. zodra de ter beschikking gestelde of anderszins verpleegde vierentwintig uur ongeoorloofd afwezig is, tenzij
      sprake is van overmacht, of

      2°. zodra het openbaar ministerie aan het hoofd van de inrichting voor verpleging van ter beschikking gestelden
      meldt dat de ter beschikking gestelde of anderszins verpleegde wordt aangemerkt als verdachte van een strafbaar
      feit waarvoor voorlopige hechtenis is toegelaten, begaan tijdens de tenuitvoerlegging van de terbeschikkingstelling
      met bevel tot verpleging van overheidswege of tijdens de opneming in de inrichting.

      Het hoofd van de inrichting voor verpleging van ter beschikking gestelden doet van een strafbaar feit als bedoeld
      in onderdeel 2° binnen een week aangifte bij een opsporingsambtenaar. Indien aan de ter beschikking gestelde ten
      aanzien van wie door het hoofd van de inrichting voor verpleging van ter beschikking gestelden aangifte wordt
      gedaan, verlof is verleend, wordt dit verlof terstond ingetrokken door het hoofd van de inrichting voor verpleging
      van ter beschikking gestelden. Het hoofd van de inrichting voor verpleging van ter beschikking gestelden verleent
      geen verlof aan de ter beschikking gestelde ten aanzien van wie door het hoofd van de inrichting voor verpleging
      van ter beschikking gestelden aangifte wordt gedaan, tot aan de mededeling van het openbaar ministerie als bedoeld
      in onderdeel 2°.

      3 Onze Minister kan de machtiging intrekken bij overtreding van de voorwaarden, gesteld bij het verlenen van verlof
      of indien feiten of omstandigheden bekend worden waardoor, indien deze ten tijde van het verlenen van de machtiging
      bekend waren geweest, de machtiging niet of niet in deze vorm zou zijn verleend. Onze Minister kan per inrichting
      voor verpleging van ter beschikking gestelden of afdeling daarvan alle verlofmachtigingen intrekken indien er
      aanwijzingen zijn dat zich bij die inrichting of afdeling een patroon voordoet van meerdere onttrekkingen of andere
      incidenten.

      4 Het verzoek van het hoofd van de inrichting voor verpleging van ter beschikking gestelden komt tot stand na
      multidisciplinair overleg binnen diens inrichting.

      5 Het hoofd van de inrichting voor verpleging van ter beschikking gestelden stelt in de huisregels een nadere
      procedure vast die voorafgaat aan het verlenen van verlof. In de huisregels wordt tevens een procedure opgenomen
      betreffende de wijze en de frequentie van controle op het verlof.

      6 Bij aanvang van het verlof ontvangt de ter beschikking gestelde of anderzins verpleegde een verlofpas. Hierop
      staat in ieder geval het tijdstip van aanvang en einde van het verlof aangegeven.

      7 Er is een proef elektronisch volgsysteem als voorwaarde bij verlof. De proef is tijdelijk van aard en duurt ten
      hoogste zes jaar. Deelname aan deze proef geschiedt op vrijwillige basis. Bij ministeriële regeling worden regels
      gesteld over deze proef waaronder de doelgroep, de criteria en de rechtspositie van de ter beschikking gestelde.

      8 Onze Minister stelt nadere regels aangaande het verlaten van de inrichting bij wijze van verlof.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel50
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '50'
  - number: '54'
    text: |-
      1 De machtiging tot het verlenen van proefverlof van Onze Minister, bedoeld in
      [artikel 51, eerste lid, van de wet][ref1], wordt schriftelijk door het hoofd van de inrichting voor verpleging van
      ter beschikking gestelden aangevraagd.

      2 Bij dit verzoek wordt overgelegd een proefverlofplan, opgesteld in samenwerking met de reclassering, zo mogelijk
      die in het arrondissement waarin de ter beschikking gestelde tijdens dit proefverlof zal zijn gehuisvest.

      3 Onze Minister beslist zo spoedig mogelijk op dit verzoek. Deze beslissing wordt schriftelijk medegedeeld aan
      het hoofd van de inrichting voor verpleging van ter beschikking gestelden. De machtiging van Onze Minister wordt
      verleend voor de duur van een jaar.

      4 Onze Minister brengt een machtiging als bedoeld in het eerste lid schriftelijk ter kennis van het openbaar
      ministerie bij de rechtbank die in eerste aanleg kennis heeft genomen van het misdrijf ter zake waarvan de
      terbeschikkingstelling is gelast, het openbaar ministerie in het arrondissement waarin de ter beschikking gestelde
      zich op grond van het proefverlofplan zal vestigen en van de reclassering die aan de ter beschikking gestelde hulp
      en steun zal verlenen.

      5 Onze Minister stelt nadere regels aangaande het verlaten van de inrichting bij wijze van proefverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel51
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '51'
  - number: 54a
    text: |-
      Er is een proef forensisch psychiatrisch toezicht in de fase van proefverlof. De proef is tijdelijk van aard
      en duurt ten hoogste drie jaar. Onze Minister wijst inrichtingen voor verpleging van ter beschikking gestelden
      aan waar de proef plaatsvindt. In de proef wordt, onverminderd de betrokkenheid van de reclassering, op de
      ter beschikking gestelde die met proefverlof is, toezicht gehouden door de inrichting voor verpleging van ter
      beschikking gestelden.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel54a
  - number: '55'
    text: |-
      Bij aanvang van het proefverlof ontvangt de ter beschikking gestelde van het hoofd van de inrichting voor
      verpleging van ter beschikking gestelden een schriftelijke verklaring waarin de voorwaarden zijn vermeld die aan
      het proefverlof zijn verbonden, benevens de gronden waarop het hoofd van de inrichting voor verpleging van ter
      beschikking gestelden overeenkomstig [artikel 50, derde lid, van de wet][ref1], het proefverlof kan intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel50
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '50'
  - number: '56'
    text: |-
      De ter beschikking gestelde of anderzins verpleegde ontvangt zo nodig vergoeding voor een reis of reisgelegenheid
      naar de plaats van bestemming en voor de terugkeer, voor zover daarin niet bij een andere wettelijke regeling is
      voorzien.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel56
  - number: '57'
    text: |-
      1 Indien het hoofd van de inrichting voor verpleging van ter beschikking gestelden het proefverlof intrekt, geeft
      hij daarvan terstond kennis aan Onze Minister. Deze kennisgeving wordt onder vermelding van de datum van ingang van
      de beslissing schriftelijk bevestigd.

      2 Het hoofd van de inrichting voor verpleging van ter beschikking gestelden stelt de ter beschikking gestelde zo
      spoedig mogelijk schriftelijk in kennis van de beslissing tot intrekking van het proefverlof.

      3 Het hoofd van de inrichting voor verpleging van ter beschikking gestelden geeft van de beslissing tot intrekking
      van het proefverlof schriftelijk bericht aan de instanties genoemd in [artikel 54, vierde lid][ref1].

      4 De machtiging van Onze Minister vervalt:

      1°. zodra de ter beschikking gestelde vierentwintig uur ongeoorloofd afwezig is, tenzij sprake is van overmacht, of

      2°. zodra het openbaar ministerie aan het hoofd van de inrichting voor verpleging van ter beschikking gestelden
      meldt dat de ter beschikking gestelde wordt aangemerkt als verdachte van een strafbaar feit waarvoor voorlopige
      hechtenis is toegelaten, begaan tijdens het proefverlof.

      Het hoofd van de inrichting voor verpleging van ter beschikking gestelden doet van een strafbaar feit, als bedoeld
      in onderdeel 2°, binnen een week aangifte bij een opsporingsambtenaar. Indien aan de ter beschikking gestelde
      ten aanzien van wie door het hoofd van de inrichting voor verpleging van ter beschikking gestelden aangifte wordt
      gedaan, proefverlof is verleend, wordt dit verlof terstond ingetrokken door het hoofd van de inrichting voor
      verpleging van ter beschikking gestelden. Het hoofd van de inrichting voor verpleging van ter beschikking gestelden
      verleent geen proefverlof aan de ter beschikking gestelde ten aanzien van wie door het hoofd van de inrichting voor
      verpleging van ter beschikking gestelden aangifte wordt gedaan, tot aan de mededeling van het openbaar ministerie
      als bedoeld in onderdeel 2°.

      5 Onze Minister kan de machtiging intrekken bij overtreding van de voorwaarden, gesteld bij het verlenen van
      proefverlof of indien feiten of omstandigheden bekend worden waardoor, indien deze ten tijde van het verlenen van
      de machtiging bekend waren geweest, de machtiging niet of niet in deze vorm zou zijn verleend. Onze Minister geeft
      terstond kennis van het intrekken van de machtiging tot proefverlof aan het hoofd van de inrichting voor verpleging
      van ter beschikking gestelden.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel54
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel57
