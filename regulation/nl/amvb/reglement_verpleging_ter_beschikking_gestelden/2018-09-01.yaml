        artikel: 16c
  - number: '35'
    text: |-
      1 Indien de toepassing van de behandeling, bedoeld in [artikel 34, tweede lid][ref1], de duur van twee weken
      te boven gaat, wordt door het hoofd van de inrichting een commissie samengesteld bestaande uit ten minste een
      afdelingshoofd, een psychiater, een arts en een psycholoog.

      2 De in het eerste lid bedoelde commissie brengt binnen twee dagen na de in het eerste lid bedoelde termijn en,
      indien de onvrijwillige behandeling langer wordt voortgezet, om de twee weken, advies uit aan het hoofd van de
      inrichting over de voortzetting van die behandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel34
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '34'
        hoofdstuk: '10'
  - number: 35a
    text: |-
      1 Telefoongesprekken die in verband met het toezicht, bedoeld in [artikel 38, tweede lid, van de wet][ref1] worden
      opgenomen, worden bewaard voor een periode van ten hoogste acht maanden.

      2 Na het verstrijken van de periode, genoemd in het eerste lid, wordt een opgenomen telefoongesprek gewist.

      3 Indien bij de uitoefening van het toezicht blijkt dat een telefoongesprek met een persoon als bedoeld in
      [artikel 36, eerste lid, van de wet][ref2] is opgenomen, wordt dit opgenomen gesprek terstond gewist.

      4 De verpleegde wordt van het opnemen van het telefoonverkeer op de hoogte gesteld.

      5 Opgenomen telefoongesprekken worden slechts verstrekt aan derden die ingevolge de uitvoering van hen bij of
      krachtens de wet opgedragen taken, tot kennisneming daarvan bevoegd zijn.

      6 De verstrekking, bedoeld in het vijfde lid, kan slechts geschieden in verband met:

      a. de bescherming van de maatschappij tegen de gevaarlijkheid van de verpleegde voor de veiligheid van anderen dan
      de verpleegde of de algemene veiligheid van personen of goederen;

      b. de handhaving van de orde of de veiligheid in de inrichting;

      c. de bescherming van slachtoffers van of anderszins betrokkenen bij misdrijven;

      d. de voorkoming of opsporing van strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel36
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel35a
