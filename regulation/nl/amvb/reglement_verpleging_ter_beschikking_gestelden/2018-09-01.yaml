  - number: '66'
    text: |-
      1 Onze Minister doet de hem overeenkomstig artikel 65 alsmede overige met betrekking tot de ter beschikking
      gestelde die niet van overheidswege wordt verpleegd, verschafte gegevens, voor zover hem dit wenselijk voorkomt,
      opnemen in een algemeen op zijn departement gehouden register.

      2 Indien met betrekking tot een ter beschikking gestelde die niet van overheidswege wordt verpleegd, de
      kennisneming van de gegevens uit het algemeen register naar het oordeel van Onze Minister van belang kan zijn
      voor het openbaar ministerie bij de rechtbank die in eerste aanleg heeft kennis genomen van het misdrijf ter zake
      waarvan de terbeschikkingstelling is gelast, doet Onze Minister dit openbaar ministerie die gegevens toekomen, al
      dan niet onder bijvoeging van zijn beschouwingen.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel66
  - number: '67'
    text: |-
      1 Met het toezicht op de naleving van de voorwaarden, bedoeld in [artikel 38, eerste lid][ref1], en van de
      voorwaarden, bedoeld in [artikel 38][ref2], is steeds mede belast het openbaar ministerie in het arrondissement
      waarin de ter beschikking gestelde feitelijk woont.

      2 Het openbaar ministerie, bedoeld in het eerste lid, wordt, voor zover nodig, door Onze Minister in kennis gesteld
      van de voorwaarden, bedoeld in het eerste lid, en van een verstrekte opdracht tot het verlenen van hulp en steun.
      Een op een later tijdstip gegeven rechterlijke beslissing met betrekking tot voorwaarden, opdracht tot het verlenen
      van hulp en steun of verlenging van de terbeschikkingstelling wordt eveneens, voor zover nodig, ter kennis van
      dit openbaar ministerie gebracht. Het openbaar ministerie doet zo nodig de nieuwe of gewijzigde voorwaarden op de
      ontslagbrief aantekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38g
