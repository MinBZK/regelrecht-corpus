        artikel: '51'
  - number: '29'
    text: |-
      Het verpleegdedossier wordt op zorgvuldige wijze, volgens een vaste standaardindeling opgebouwd. In ieder geval
      worden hierin onderscheiden:

      a. persoons- en identificatiegegevens;

      b. justitiële gegevens;

      c. behandelgegegevens;

      d. gegevens omtrent het verblijf.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel29
  - number: '30'
    text: |-
      Naast de in [artikel 19, eerste lid, van de wet][ref1] genoemde gegevens, worden in het verpleegdedossier
      opgenomen:

      a. een afschrift van de mededelingen, bedoeld in [artikel 54 van de wet][ref2];

      b. de uitspraken van de beklagcommissie en de beroepscommissie alsmede de verslagen bedoeld in
      [artikel 55, zesde lid, van de wet][ref3];

      c. de ontvangen afschriften van rechterlijke beslissingen betreffende de terbeschikkingstelling;

      d. machtigingen van Onze Minister, bedoeld in de [artikelen 50, eerste lid][ref4], en
      [51, eerste lid, van de wet][ref5];

      e. gegevens met betrekking tot de toepassing van [artikel 26 van de wet][ref6];

      f. gegevens met betrekking tot de toepassing van [artikel 16b, onder a of b, van de wet][ref7];

      g. overige gegevens omtrent de gezondheid van de verpleegde en te diens aanzien uitgevoerde verrichtingen, een en
      ander voor zover de opname van deze gegevens voor een goede verpleging en behandeling aan hem noodzakelijk is.


