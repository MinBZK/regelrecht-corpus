        artikel: '1'
  - number: '11'
    text: |-
      1 Een lid van de commissie van toezicht wordt door Onze Minister tussentijds ontslagen:

      a. op eigen verzoek;

      b. bij de aanvaarding van een ambt of betrekking dat onverenigbaar is verklaard met het lidmaatschap van een
      commissie van toezicht;

      c. wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      d. wanneer hij naar het oordeel van Onze Minister door handelen of nalaten ernstig nadeel toebrengt aan het in hem
      te stellen vertrouwen.

      2 Aan een lid kan door Onze Minister tussentijds ontslag worden verleend bij het verlies van de hoedanigheid of
      beëindiging van de ambts- of beroepsvervulling in verband waarmede de benoeming heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel11
  - number: '12'
    text: |-
      1 De leden van de commissie van toezicht hebben te allen tijde toegang tot alle plaatsen in de inrichting en tot
      alle plaatsen waar de verpleegden verblijven.

      2 De leden van de commissie van toezicht ontvangen van het hoofd van de inrichting en de personeelsleden of
      medewerkers in de inrichting alle door hen gewenste inlichtingen ten aanzien van de verpleegden en kunnen alle
      op de wijze van tenuitvoerlegging van vrijheidsbenemende straffen en maatregelen betrekking hebbende stukken
      inzien. Zij zijn tot geheimhouding verplicht behoudens voor zover enig wettelijk voorschrift hen tot bekendmaking
      verplicht of in verband met de tenuitvoerlegging van hun taak de noodzaak tot bekendmaking voortvloeit. Dossiers
      die verpleegden betreffen kunnen worden ingezien, tenzij de verpleegde bezwaar maakt.

      3 Het hoofd van de inrichting brengt alle voor de uitoefening van de taak der commissie belangrijke feiten en
      omstandigheden ter kennis van de commissie.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel12
  - number: '13'
    text: |-
      1 De commissie van toezicht vergadert, zo mogelijk, eenmaal in de maand.

      2 Het hoofd van de inrichting woont de vergaderingen van de commissie van toezicht bij. Hij brengt op iedere
      vergadering een algemeen verslag uit over hetgeen sedert de vorige vergadering in de inrichting is geschied.

      3 De commissie kan besluiten buiten tegenwoordigheid van het hoofd van de inrichting te vergaderen.

      4 Onze Minister is bevoegd vergaderingen van de commissie van toezicht door een door hem aan te wijzen ambtenaar
      van zijn ministerie te doen bijwonen.

      5 In iedere vergadering van de commissie van toezicht wordt mededeling gedaan van de grieven terzake waarvan
      werd bemiddeld, de door de beklagcommissie behandelde klaagschriften, en de bijzondere opmerkingen waartoe zij
      aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel13
  - number: '14'
    text: |-
      1 De maandcommissaris, bedoeld in [artikel 10, vierde lid, tweede volzin, van de wet][ref1], houdt ten minste
      tweemaal per maand in de inrichting spreekuur. Dit spreekuur wordt tijdig bekend gemaakt en kan worden bezocht door
      elke verpleegde die de wens daartoe te kennen geeft.

      2 De maandcommissaris doet van zijn werkzaamheden verslag aan de commissie van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel10
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '10'
  - number: '15'
    text: |-
      1 De beklagcommissie, of, indien [artikel 59, derde lid, van de wet][ref1] wordt toegepast, de voorzitter dan
      wel de door hem aangewezen persoon, houdt zitting zo dikwijls als een onverwijlde behandeling en afdoening van de
      klaagschriften dit noodzakelijk maken. Deze wordt bijgestaan door een secretaris.

      2 Indien de beklagcommissie zitting houdt treedt bij voorkeur als voorzitter op een met rechtspraak belast lid van
      de rechterlijke macht.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel59
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '59'
  - number: '16'
    text: |-
      1 De commissie van toezicht brengt jaarlijks vóór 1 maart aan Onze Minister en aan de sectie terbeschikkingstelling
      en, voor zover het een justitiële particuliere inrichting betreft, tevens aan het bestuur, verslag uit over haar
      werkzaamheden in het voorgaande jaar.

      2 Zij schenkt in haar verslag in het bijzonder aandacht zowel aan de door haar ingevolge
      [artikel 55 van de wet][ref1] verrichte bemiddeling en de uitkomsten daarvan als aan de werkzaamheden van de
      beklagcommissie, onder meer door een overzicht van de klaagschriften en de daarop genomen beslissingen. Onze
      Minister kan een model vaststellen omtrent de inrichting van het verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel55
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '55'
  - number: '17'
    text: |-
      1 De kosten van de commissie van toezicht worden door de Staat gedragen.

      2 De leden van de commissie van toezicht genieten vergoeding van reis- en verblijfskosten en een vacatiegeld
      met betrekking tot hun werkzaamheden overeenkomstig de bepalingen welke te dien aanzien voor de burgerlijke
      rijksambtenaren zijn vastgesteld.

      3 Voor zover de secretaris of de plaatsvervangend secretaris geen ambtenaar is geniet deze tevens de in het tweede
      lid bedoelde vergoeding.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel17
  - number: '18'
    text: |-
      Van een uitspraak waarbij door de rechter ten aanzien van een ter beschikking gestelde met toepassing van
      [artikel 37][ref1] of [38][ref2] een bevel tot verpleging van overheidswege is gegeven, doet het openbaar
      ministerie zo spoedig mogelijk mededeling aan Onze Minister, onder bijvoeging van het dossier van de zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38c
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38c
  - number: '19'
    text: |-
      De beslissing van Onze Minister omtrent de plaatsing in een inrichting voor verpleging van ter beschikking
      gestelden die strekt tot tenuitvoerlegging van het bevel tot verpleging van overheidswege wordt door hem zo spoedig
      mogelijk medegedeeld aan het hoofd van de betreffende inrichting en aan het openbaar ministerie bij de rechtbank
      die in de eerste aanleg heeft kennis genomen van het misdrijf ter zake waarvan de terbeschikkingstelling is gelast,
      alsmede het openbaar ministerie binnen wiens arrondissement de betrokkene wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel19
  - number: '20'
    text: |-
      1 Met inachtneming van [artikel 11, tweede lid, van de wet][ref1] kan, indien de omstandigheden zulks wenselijk
      maken, Onze Minister ambtshalve of op schriftelijk verzoek van het hoofd van de inrichting voor verpleging van ter
      beschikking gestelden waarin de ter beschikking gestelde verblijft, beslissen dat de ter beschikking gestelde naar
      een andere inrichting zal worden overgeplaatst.

      2 Het hoofd van de inrichting voor verpleging van ter beschikking gestelden stelt in dit geval een eindverslag op
      van de verpleging in diens inrichting. Hij voegt dit toe aan het verpleegdedossier.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel11
    url: https://wetten.overheid.nl/BWBR0008690/2018-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '11'
  - number: '21'
    text: |-
      1 De beslissing van Onze Minister tot overplaatsing, bedoeld in [artikel 20,][ref1] wordt zo spoedig mogelijk
      medegedeeld aan het hoofd van de inrichting voor verpleging van ter beschikking gestelden waarin de ter beschikking
      gestelde verblijft en aan het hoofd van de inrichting voor verpleging van ter beschikking gestelden waarheen de
      ter beschikking gestelde zal worden overgeplaatst. De beslissing van Onze Minister, bedoeld in [artikel 13][ref2]
      en [14, eerste lid, van de wet][ref3] wordt zo spoedig mogelijk medegedeeld aan het hoofd van de inrichting
      voor verpleging van ter beschikking gestelden waarin de ter beschikking gestelde verblijft en aan de inrichting
      tot klinische observatie bestemd onderscheidenlijk aan het psychiatrisch ziekenhuis waarheen de ter beschikking
      gestelde zal worden overgeplaatst. De voorgaande beslissingen worden tevens gemeld aan het openbaar ministerie bij
      de rechtbank die in eerste aanleg heeft kennis genomen van het misdrijf ter zake waarvan de terbeschikkingstelling
      is gelast, het openbaar ministerie van het arrondissement waarin de verpleging geschiedt, en het openbaar
      ministerie van het arrondissement waarin de verpleging zal worden voortgezet.

      2 Ingeval het hoofd van de inrichting voor verpleging van ter beschikking gestelden met toepassing van
      [artikel 14, tweede lid, van de wet][ref4] voorlopig beslist tot overplaatsing naar een psychiatrisch ziekenhuis
      deelt hij dit onverwijld mede aan Onze Minister. Indien Onze Minister de beslissing bekrachtigt is het eerste lid
      van dit artikel van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel20
