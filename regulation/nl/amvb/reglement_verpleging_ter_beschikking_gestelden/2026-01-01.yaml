preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Onze Minister van Justitie, van 21 november 1996, nr. 591920/96/6;

    Gelet op artikel 89 van de Grondwet en de artikelen 37c , eerste lid, 38, eerste lid, en 38a, tweede lid, van
    het Wetboek van Strafrecht en voorts de artikelen 5, tweede lid, 6, tweede lid, 8, derde lid, 10, vijfde lid, 15,
    eerste en tweede lid, 16, tweede lid, 18, vierde lid, 19, tweede lid, 26, derde lid, 40, vierde lid, 45, 51, tweede
    en vierde lid, 70, derde lid, en 75 van de Beginselenwet verpleging ter beschikking gestelden;

    Gezien het advies van de Centrale Raad voor Strafrechtstoepassing van 11 oktober 1996, nr. RA 88/96;

    De Raad van State gehoord (advies van 17 maart 1997, No.W03.96.0563);

    Gezien het nader rapport van Onze Minister van Justitie van 13 mei 1997, nr. 626752/97/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Beginselenwet verpleging ter beschikking gestelden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008765
  - number: 1.b
    text: |-
      de reclassering: een reclasseringsinstelling als bedoeld in
      [artikel 1, onder b, van de Reclasseringsregeling 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007120
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007120
  - number: '7.1'
    text: |-
      Bij elke inrichting is een commissie van toezicht waarvan de leden worden benoemd voor de tijd van vijf jaren. Zij
      kunnen tweemaal voor herbenoeming in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel7
  - number: '7.2'
    text: De commissie bestaat uit ten minste zes en ten hoogste een door Onze Minister vast te stellen aantal leden.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel7
  - number: '7.3'
    text: 'De commissie van toezicht is zo breed mogelijk samengesteld. Van elke commissie maken in elk geval deel uit:'
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel7
  - number: 7.3.a
    text: een met rechtspraak belast lid van de rechterlijke macht;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel7
  - number: 7.3.b
    text: een psychiater;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel7
  - number: 7.3.c
    text: een gedragsdeskundige met kennis van de intramurale zorg voor geestelijk gestoorden;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel7
  - number: 7.3.d
    text: een advocaat.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel7
  - number: '8.1'
    text: |-
      De leden van de commissie van toezicht worden door Onze Minister benoemd. Onze Minister wijst uit de leden een
      voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel8
  - number: '8.2'
    text: |-
      Aan de commissie is een secretaris verbonden. Deze is geen lid van de commissie. De secretaris wordt door
      Onze Minister benoemd en ontslagen. De secretaris van de commissie van toezicht is tevens secretaris van de
      beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel8
  - number: '8.3'
    text: |-
      De commissie kan uit haar midden een of meer plaatsvervangende secretarissen aanwijzen om, in overleg met de
      secretaris, bepaalde secretariaatswerkzaamheden te verrichten en de secretaris bij diens afwezigheid te vervangen.
      Onze Minister kan aan een commissie van toezicht een of meerdere plaatsvervangende secretarissen toevoegen die geen
      lid zijn van de commissie.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel8
  - number: '8.4'
    text: Onze Minister beslist binnen drie maanden op een verzoek tot benoeming.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel8
  - number: '9.1'
    text: |-
      De benoeming van de leden en de secretaris alsmede de aanwijzing van de voorzitter van de commissie van toezicht
      bij een justitiële particuliere inrichting geschiedt op voordracht van het bestuur dan wel de Raad van Toezicht
      indien die de taken van het bestuur vervult.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel9
  - number: '9.2'
    text: |-
      Een lid van het bestuur of de Raad van Toezicht indien die de taken van het bestuur vervult, kan niet worden
      benoemd tot lid, secretaris of plaatsvervangend secretaris van de commissie van toezicht.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel9
  - number: '10'
    text: 'Voor benoeming als lid, secretaris of plaatsvervangend secretaris komen niet in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel10
  - number: 10.a
    text: |-
      ambtenaren of andere personen, werkzaam onder de verantwoordelijkheid van Onze Minister op het terrein van
      de tenuitvoerlegging van vrijheidsbenemende straffen en maatregelen, niet zijnde ambtenaren bij het openbaar
      ministerie;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel10
  - number: 10.b
    text: personeelsleden of medewerkers, werkzaam bij een inrichting voor verpleging van ter beschikking gestelden;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel10
  - number: 10.c
    text: |-
      personen, werkzaam bij een door Onze Minister gesubsidieerde instelling die werkzaam is op het terrein van de
      tenuitvoerlegging van vrijheidsbenemende straffen en maatregelen indien zij in het kader van de uitoefening van hun
      functie te maken hebben met de personen ingesloten in de inrichting waarbij de commissie van toezicht is ingesteld;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel10
  - number: 10.d
    text: |-
      personen, werkzaam onder de verantwoordelijkheid van Onze Minister, indien hun onafhankelijkheid of onpartijdigheid
      hetzij door hun positie, hetzij door de aard van hun werkzaamheden in het geding zou kunnen komen;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel10
  - number: 10.e
    text: |-
      personen tegen wie bezwaren bestaan tegen de vervulling van de functie die blijken uit de algemene
      documentatieregisters als bedoeld in het [Besluit justitiële gegevens][ref1] of de politiegegevens, bedoeld
      in [artikel 1, onderdeel a, van de Wet politiegegevens][ref2]. De bezwaren dienen betrekking te hebben op het
      vertrouwelijk karakter van de functie alsmede de aan de functie verbonden bevoegheden.


      [ref1]: https://wetten.overheid.nl/BWBR0016544
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016544
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '1'
  - number: '11.1'
    text: 'Een lid van de commissie van toezicht wordt door Onze Minister tussentijds ontslagen:'
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel11
  - number: 11.1.a
    text: op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel11
  - number: 11.1.b
    text: |-
      bij de aanvaarding van een ambt of betrekking dat onverenigbaar is verklaard met het lidmaatschap van een commissie
      van toezicht;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel11
  - number: 11.1.c
    text: |-
      wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij zulk
      een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel11
  - number: 11.1.d
    text: |-
      wanneer hij naar het oordeel van Onze Minister door handelen of nalaten ernstig nadeel toebrengt aan het in hem te
      stellen vertrouwen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel11
  - number: '11.2'
    text: |-
      Aan een lid kan door Onze Minister tussentijds ontslag worden verleend bij het verlies van de hoedanigheid of
      beëindiging van de ambts- of beroepsvervulling in verband waarmede de benoeming heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel11
  - number: '12.1'
    text: |-
      De leden van de commissie van toezicht hebben te allen tijde toegang tot alle plaatsen in de inrichting en tot alle
      plaatsen waar de verpleegden verblijven.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel12
  - number: '12.2'
    text: |-
      De leden van de commissie van toezicht ontvangen van het hoofd van de inrichting en de personeelsleden of
      medewerkers in de inrichting alle door hen gewenste inlichtingen ten aanzien van de verpleegden en kunnen alle
      op de wijze van tenuitvoerlegging van vrijheidsbenemende straffen en maatregelen betrekking hebbende stukken
      inzien. Zij zijn tot geheimhouding verplicht behoudens voor zover enig wettelijk voorschrift hen tot bekendmaking
      verplicht of in verband met de tenuitvoerlegging van hun taak de noodzaak tot bekendmaking voortvloeit. Dossiers
      die verpleegden betreffen kunnen worden ingezien, tenzij de verpleegde bezwaar maakt.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel12
  - number: '12.3'
    text: |-
      Het hoofd van de inrichting brengt alle voor de uitoefening van de taak der commissie belangrijke feiten en
      omstandigheden ter kennis van de commissie.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel12
  - number: '13.1'
    text: De commissie van toezicht vergadert, zo mogelijk, eenmaal in de maand.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel13
  - number: '13.2'
    text: |-
      Het hoofd van de inrichting woont de vergaderingen van de commissie van toezicht bij. Hij brengt op iedere
      vergadering een algemeen verslag uit over hetgeen sedert de vorige vergadering in de inrichting is geschied.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel13
  - number: '13.3'
    text: De commissie kan besluiten buiten tegenwoordigheid van het hoofd van de inrichting te vergaderen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel13
  - number: '13.4'
    text: |-
      Onze Minister is bevoegd vergaderingen van de commissie van toezicht door een door hem aan te wijzen ambtenaar van
      zijn ministerie te doen bijwonen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel13
  - number: '13.5'
    text: |-
      In iedere vergadering van de commissie van toezicht wordt mededeling gedaan van de grieven terzake waarvan
      werd bemiddeld, de door de beklagcommissie behandelde klaagschriften, en de bijzondere opmerkingen waartoe zij
      aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel13
  - number: '14.1'
    text: |-
      De maandcommissaris, bedoeld in [artikel 10, vierde lid, tweede volzin, van de wet][ref1], houdt ten minste
      tweemaal per maand in de inrichting spreekuur. Dit spreekuur wordt tijdig bekend gemaakt en kan worden bezocht door
      elke verpleegde die de wens daartoe te kennen geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel10
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '10'
  - number: '14.2'
    text: De maandcommissaris doet van zijn werkzaamheden verslag aan de commissie van toezicht.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel14
  - number: '15.1'
    text: |-
      De beklagcommissie, of, indien [artikel 59, derde lid, van de wet][ref1] wordt toegepast, de voorzitter dan wel
      de door hem aangewezen persoon, houdt zitting zo dikwijls als een onverwijlde behandeling en afdoening van de
      klaagschriften dit noodzakelijk maken. Deze wordt bijgestaan door een secretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel59
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '59'
  - number: '15.2'
    text: |-
      Indien de beklagcommissie zitting houdt treedt bij voorkeur als voorzitter op een met rechtspraak belast lid van de
      rechterlijke macht.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel15
  - number: '16.1'
    text: |-
      De commissie van toezicht brengt jaarlijks vóór 1 maart aan Onze Minister en aan de sectie terbeschikkingstelling
      en, voor zover het een justitiële particuliere inrichting betreft, tevens aan het bestuur, verslag uit over haar
      werkzaamheden in het voorgaande jaar.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel16
  - number: '16.2'
    text: |-
      Zij schenkt in haar verslag in het bijzonder aandacht zowel aan de door haar ingevolge
      [artikel 55 van de wet][ref1] verrichte bemiddeling en de uitkomsten daarvan als aan de werkzaamheden van de
      beklagcommissie, onder meer door een overzicht van de klaagschriften en de daarop genomen beslissingen. Onze
      Minister kan een model vaststellen omtrent de inrichting van het verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel55
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '55'
  - number: '17.1'
    text: De kosten van de commissie van toezicht worden door de Staat gedragen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel17
  - number: '17.2'
    text: |-
      De leden van de commissie van toezicht genieten vergoeding van reis- en verblijfskosten en een vacatiegeld met
      betrekking tot hun werkzaamheden overeenkomstig hetgeen daarover is overeengekomen in de laatstelijk afgesloten
      collectieve arbeidsovereenkomst voor ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel17
  - number: '17.3'
    text: |-
      Voor zover de secretaris of de plaatsvervangend secretaris geen ambtenaar is geniet deze tevens de in het tweede
      lid bedoelde vergoeding.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel17
  - number: 17a.1
    text: |-
      De leden van de commissie van toezicht voor het vervoer, genoemd in artikel 15b, eerste lid, van de Beginselenwet
      verpleging ter beschikking gestelden, worden benoemd voor een periode van vijf jaren. Zij kunnen tweemaal voor
      herbenoeming in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel17a
  - number: 17a.2
    text: |-
      De [artikelen 7, derde lid][ref1], [8][ref2], [11][ref3], [13][ref4], [15][ref5], [16][ref6] en [17][ref7] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008690#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0008690#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0008690#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0008690#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0008690#Artikel16
      [ref7]: https://wetten.overheid.nl/BWBR0008690#Artikel17
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '7'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0008690
        artikel: '8'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0008690
        artikel: '11'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0008690
        artikel: '13'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0008690
        artikel: '15'
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0008690
        artikel: '16'
        hoofdstuk: '5'
      - id: ref7
        bwb_id: BWBR0008690
        artikel: '17'
        hoofdstuk: '5'
  - number: 17a.3
    text: |-
      [Artikel 10][ref1] is van overeenkomstige toepassing, met dien verstande dat voor benoeming als lid eveneens niet
      in aanmerking komen ambtenaren of andere personen, werkzaam onder de verantwoordelijkheid van Onze Minister op het
      terrein van de tenuitvoerlegging van vrijheidsbenemende straffen en maatregelen, niet zijnde ambtenaren bij het
      openbaar ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel10
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '10'
        hoofdstuk: '5'
  - number: 17b.1
    text: |-
      De leden van de commissie van toezicht voor het vervoer hebben te allen tijde toegang tot de plaatsen waar en de
      vervoersmiddelen waarmee handelingen betreffende het vervoer worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel17b
  - number: 17b.2
    text: |-
      De leden van de commissie van toezicht ontvangen van Onze Minister en het hoofd van de inrichting alle door hen
      gewenste inlichtingen ten aanzien van het vervoer van verpleegden en kunnen alle op het vervoer betreffende stukken
      inzien. Zij zijn tot geheimhouding verplicht, behoudens voor zover enig wettelijk voorschrift hen tot bekendmaking
      verplicht of uit de tenuitvoerlegging van hun taak de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel17b
  - number: 17b.3
    text: |-
      Onze Minister en het hoofd van de inrichting brengen alle voor de uitoefening van de taak van de commissie van
      toezicht belangrijke feiten en omstandigheden ter kennis van de commissie van toezicht.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel17b
  - number: '23.1'
    text: |-
      Ongeoorloofde afwezigheid vangt aan op de dag dat de ter beschikking gestelde of anderszins verpleegde zich aan de
      tenuitvoerlegging van de vrijheidsbenemende straf of maatregel heeft onttrokken.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel23
  - number: '23.2'
    text: |-
      Ongeoorloofde afwezigheid eindigt op de dag dat de ter beschikking gestelde of anderszins verpleegde zich meldt,
      hij wordt aangehouden, of door intrekking van het verzoek om signalering. Deze dag wordt niet meegerekend in de
      duur van de ongeoorloofde afwezigheid, bedoeld in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38f
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38f
  - number: '23.3'
    text: |-
      Het hoofd van de inrichting voor verpleging van ter beschikking gestelden verzoekt de politie de ongeoorloofd
      afwezig ter beschikking gestelde of anderszins verpleegde te signaleren. Onze Minister kan aanwijzingen geven ten
      aanzien van dit verzoek alsmede de intrekking daarvan.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel23
  - number: '23.4'
    text: |-
      Van het verzoek om signalering en van de intrekking van een verzoek om signalering wordt aantekening gehouden in
      een daartoe bestemd register dat volgens een door Onze Minister vastgesteld model is ingericht.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel23
  - number: '23.5'
    text: |-
      Onze Minister wordt onverwijld in kennis gesteld van elk verzoek om signalering of een intrekking van een verzoek
      om signalering.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel23
  - number: '24'
    text: |-
      Het hoofd van de inrichting meldt onverwijld andere bijzondere voorvallen aan Onze Minister. Hij verstrekt Onze
      Minister te allen tijde alle verlangde inlichtingen. Onze Minister kan nadere regels stellen omtrent de inhoud en
      de wijze van melding.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel24
  - number: 24a
    text: |-
      Onze Minister kan bij ministeriële regeling nadere regels stellen aan instellingen, bedoeld in
      [artikel 3.3, eerste lid, van de wet][ref1]. Deze regels hebben met het oog op de veiligheid in de instelling en de
      naleving van de bij of krachtens de wet gegeven regels, betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel3
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '3'
  - number: 24a.a
    text: de toelating en de weigering van bezoek aan die instellingen, en
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel24a
  - number: 24a.b
    text: de toegang van personeel werkzaam bij die instellingen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel24a
  - number: '25.1'
    text: 'In het verplegings- en behandelingsplan worden ten minste opgenomen:'
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel25
  - number: 25.1.a
    text: de diagnose van de stoornis van de verpleegde;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel25
  - number: 25.1.b
    text: |-
      de therapeutische middelen die zullen worden toegepast, zo mogelijk gerelateerd aan de verschillende aspecten die
      in de stoornis te onderscheiden zijn;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel25
  - number: 25.1.c
    text: of er overeenstemming over het verplegings- en behandelingsplan is;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel25
  - number: 25.1.d
    text: |-
      de vrijheden die de verpleegde zijn toegekend boven de hem bij of krachtens de wet toekomende rechten, alsmede de
      voorwaarden die daaraan verbonden zijn en de consequenties van het niet opvolgen van die voorwaarden.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel25
  - number: '25.2'
    text: |-
      In geval van een behandeling overeenkomstig [artikel 16b, onder a of b, van de wet][ref1] wordt in het verplegings-
      en behandelingsplan eveneens opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16b
  - number: 25.2.a
    text: |-
      welke minder bezwarende middelen zijn aangewend om het gevaar dat de stoornis van de geestvermogens de verpleegde
      doet veroorzaken weg te nemen dan wel af te wenden; en
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel25
  - number: 25.2.b
    text: de wijze waarop rekening wordt gehouden met de voorkeuren van de verpleegde ten aanzien van de behandeling.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel25
  - number: '25.3'
    text: |-
      Het deel van het verplegings- en behandelingsplan waarover geen overeenstemming kan worden bereikt met
      de verpleegde dan wel diens curator of mentor, wordt slechts vastgesteld door een psychiater nadat een
      multidisciplinair overleg heeft plaatsgehad waaraan in ieder geval een psychiater, een arts, een psycholoog en een
      verpleegkundige hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel25
  - number: '25.4'
    text: |-
      Ingeval van een behandeling overeenkomstig [artikel 16b, onder a, van de wet][ref1] worden de verklaringen van
      de psychiaters, bedoeld in [artikel 16c, tweede lid, van de wet][ref2], bij het in het derde lid bedoelde overleg
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel16c
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16b
      - id: ref2
        bwb_id: BWBR0008765
        artikel: 16c
  - number: '26.1'
    text: Het verplegings- en behandelingsplan bestrijkt ten minste een periode van één jaar.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel26
  - number: '26.2'
    text: |-
      Gedurende de verpleging kan het verplegings- en behandelingsplan worden gewijzigd. Bij een wijziging wordt het
      evaluatieverslag betrokken.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel26
  - number: '26.3'
    text: |-
      Een wijziging in het verplegings- en behandelingsplan wordt, in overleg met de verpleegde, vastgesteld. De
      wijziging wordt hem voor het ingaan daarvan medegedeeld.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel26
  - number: '27.1'
    text: |-
      Het hoofd van de inrichting geeft in het evaluatieverslag zijn visie op de persoon van de verpleegde weer en
      besteedt daarbij in elk geval aandacht aan de volgende aspecten:
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel27
  - number: 27.1.a
    text: het verblijf op de afdeling;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel27
  - number: 27.1.b
    text: de vraag, het aanbod en het gebruik dat gemaakt wordt van de behandeling;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel27
  - number: 27.1.c
    text: de veranderingen in het psychische toestandsbeeld van de verpleegde in het kader van de verpleging en behandeling;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel27
  - number: 27.1.d
    text: de bewegingsvrijheid binnen en buiten de inrichting;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel27
  - number: 27.1.e
    text: incidenten waarbij de verpleegde betrokken is geweest;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel27
  - number: 27.1.f
    text: toegepaste individuele beperkingen;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel27
  - number: 27.1.g
    text: de mening van de verpleegde.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel27
  - number: '27.2'
    text: Het verslag bevat voornemens die van belang zijn voor de verpleging en behandeling.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel27
  - number: '27.3'
    text: |-
      Het verslag komt tot stand in samenwerking met de bij de verpleging en behandeling meest betrokken personeelsleden
      of medewerkers.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel27
  - number: '28.1'
    text: |-
      Indien de verpleegde gedurende de verslagperiode heeft verbleven in een andere inrichting voor verpleging van ter
      beschikking gestelden of in een psychiatrisch ziekenhuis, dan wel in een huis van bewaring, verschaft het hoofd
      van die inrichting, de geneesheer-directeur van dat ziekenhuis onderscheidenlijk de directeur van dat huis van
      bewaring, de nodige gegevens aan hem die met de vaststelling van het verslag is belast.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel28
  - number: '28.2'
    text: |-
      Dezelfde verplichting geldt voor de instelling, bedoeld in [artikel 51, tweede lid, van de wet][ref1], die
      gedurende de verslagperiode belast is geweest met het verlenen van hulp en steun aan de verpleegde in het kader
      van proefverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel51
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '51'
  - number: '29'
    text: |-
      Het verpleegdedossier wordt op zorgvuldige wijze, volgens een vaste standaardindeling opgebouwd. In ieder geval
      worden hierin onderscheiden:
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel29
  - number: 29.a
    text: persoons- en identificatiegegevens;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel29
  - number: 29.b
    text: justitiële gegevens;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel29
  - number: 29.c
    text: behandelgegegevens;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel29
  - number: 29.d
    text: gegevens omtrent het verblijf.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel29
  - number: '30'
    text: |-
      Naast de in [artikel 19, eerste lid, van de wet][ref1] genoemde gegevens, worden in het verpleegdedossier
      opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel19
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '19'
  - number: 30.a
    text: |-
      een afschrift van de mededelingen, bedoeld in [artikel 54 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel54
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '54'
  - number: 30.b
    text: |-
      de uitspraken van de beklagcommissie en de beroepscommissie alsmede de verslagen bedoeld in
      [artikel 55, zesde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel55
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '55'
  - number: 30.c
    text: de ontvangen afschriften van rechterlijke beslissingen betreffende de terbeschikkingstelling;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel30
  - number: 30.d
    text: |-
      machtigingen van Onze Minister, bedoeld in de [artikelen 50, eerste lid][ref1], en
      [51, eerste lid, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel51
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '51'
  - number: 30.e
    text: |-
      gegevens met betrekking tot de toepassing van [artikel 26 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel26
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '26'
  - number: 30.f
    text: |-
      gegevens met betrekking tot de toepassing van [artikel 16b, onder a of b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16b
  - number: 30.g
    text: |-
      overige gegevens omtrent de gezondheid van de verpleegde en te diens aanzien uitgevoerde verrichtingen, een en
      ander voor zover de opname van deze gegevens voor een goede verpleging en behandeling aan hem noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel30
  - number: '31.1'
    text: |-
      Gedurende het verblijf van een verpleegde in een inrichting wordt het verpleegdedossier in een afsluitbare ruimte
      in de inrichting bewaard.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel31
  - number: '31.2'
    text: |-
      Het hoofd van de inrichting zendt het verpleegdedossier gelijktijdig met de overplaatsing van de verpleegde,
      bedoeld in [artikel 11, derde lid, van de wet][ref1], aan het hoofd van de inrichting waar de verpleegde
      verder zal worden verpleegd. Bij overplaatsing van en naar een particuliere inrichting, niet zijnde een
      justitiële particuliere inrichting, wordt het verpleegdedossier onderscheidenlijk het dossier, bedoeld in het
      [Besluit patiëntendossier Bopz][ref2], gelijktijdig met de formele overplaatsing meegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006224
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0006224
  - number: '32.1'
    text: |-
      Het hoofd van de inrichting bewaart het verpleegdedossier gedurende een termijn van tien jaren, te rekenen vanaf
      het tijdstip dat de terbeschikkingstelling eindigde.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel32
  - number: '32.2'
    text: |-
      Na de in het eerste lid genoemde termijn worden de bescheiden, opgenomen in het verpleegdedossier, met
      uitzondering van de vingerafdrukken die overeenkomstig [artikel 22, tweede lid, van de wet][ref1] zijn genomen,
      overeenkomstig de [Archiefwet 1995][ref2] overgebracht naar een rijksarchiefbewaarplaats of naar de algemene
      rijksarchiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0007376
  - number: '32.3'
    text: |-
      Indien de verpleegde vóór de afloop van de in het eerste lid bedoelde termijn opnieuw ter beschikking wordt gesteld
      met bevel tot verpleging van overheidswege vervalt de bewaartermijn en vangt deze aan op het tijdstip dat de nieuwe
      terbeschikkingstelling eindigt.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel32
  - number: '33'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *a-dwangbehandeling:* een onvrijwillige geneeskundige behandeling als
      bedoeld in [artikel 16b, onder a, van de wet][ref1];
        - *b-dwangbehandeling:* een onvrijwillige geneeskundige behandeling als bedoeld in
      [artikel 16b, onder b, van de wet][ref2];
        - *gedwongen geneeskundige handeling:* de gedwongen geneeskundige handeling, bedoeld in
      [artikel 26 van de wet][ref3];
        - *geneeskundige behandeling:* de onvrijwillige geneeskundige behandelingen, bedoeld in de onderdelen a tot en met
      c, en de vrijwillige geneeskundige behandeling, bedoeld in [artikel 16a van de wet][ref4];
        - *inspecteur:* de inspecteur, bedoeld in
      [artikel 1, onder c, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref5];
        - *voortzetting van a-dwangbehandeling:* de voortzetting van a-dwangbehandeling, bedoeld in
      [artikel 16c, vijfde lid, van de wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
      [ref3]: https://wetten.overheid.nl/BWBR0008765#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0008765#Artikel16a
      [ref5]: https://wetten.overheid.nl/BWBR0005700#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0008765#Artikel16c
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16b
      - id: ref2
        bwb_id: BWBR0008765
        artikel: 16b
      - id: ref3
        bwb_id: BWBR0008765
        artikel: '26'
      - id: ref4
        bwb_id: BWBR0008765
        artikel: 16a
      - id: ref5
        bwb_id: BWBR0005700
        artikel: '1'
      - id: ref6
        bwb_id: BWBR0008765
        artikel: 16c
  - number: 33a.1
    text: |-
      Een geneeskundige behandeling wordt verricht in een daartoe geschikte ruimte, onder verantwoordelijkheid van de
      behandelend arts.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel33a
  - number: 33a.2
    text: |-
      Er is ten behoeve van de geneeskundige behandeling vierentwintig uur per dag, zeven dagen per week, voldoende
      psychiatrisch geschoold verpleegkundig personeel aanwezig. Bovendien is vierentwintig uur per dag, zeven dagen per
      week, een psychiater beschikbaar.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel33a
  - number: 33a.3
    text: |-
      Een geneeskundige behandeling wordt slechts uitgevoerd door een arts of verpleegkundige die over voldoende
      deskundigheid beschikt deze behandeling uit te voeren en indien daartoe voldoende voorzieningen beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel33a
  - number: 33a.4
    text: |-
      Eens per twee weken, of vaker indien het belang van de verpleegde dit eist, vindt een multidisciplinair overleg
      plaats, waaraan in ieder geval een psychiater, een arts, een psycholoog en een verpleegkundige deelnemen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel33a
  - number: '34.1'
    text: |-
      Voordat het hoofd van de inrichting beslist dat een door de arts noodzakelijk geachte b-dwangbehandeling of
      gedwongen geneeskundige handeling zal worden verricht, pleegt het hoofd van de inrichting overleg met die arts
      en met het hoofd van de afdeling waar de verpleegde verblijft. Indien de behandeling door een andere arts wordt
      verricht, wordt tevens met hem overlegd.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34
  - number: '34.2'
    text: |-
      Ingeval van b-dwangbehandeling of indien het verrichten van een gedwongen geneeskundige handeling noodzakelijk is
      ter afwending van gevaar dat voortvloeit uit de stoornis van de geestvermogens van de verpleegde, pleegt het hoofd
      van de inrichting bovendien overleg met de voor de behandeling verantwoordelijke psychiater.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34
  - number: '34.3'
    text: |-
      In het in het eerste en tweede lid bedoelde overleg wordt nagegaan of het gevaar niet op een andere wijze kan
      worden afgewend.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34
  - number: '34.4'
    text: |-
      In de situatie bedoeld in [artikel 26, tweede lid, van de wet][ref1], pleegt het afdelingshoofd het in het eerste
      respectievelijk tweede lid bedoelde overleg. Het overleg van het hoofd van de inrichting met de in het eerste en
      tweede lid bedoelde personen vindt vervolgens zo spoedig mogelijk na de aanvang van de geneeskundige behandeling
      plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel26
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '26'
  - number: 34a.1
    text: |-
      Zo spoedig mogelijk na de aanvang van de gedwongen geneeskundige handeling wordt door of onder verantwoordelijkheid
      van een arts een plan opgesteld gericht op een zodanige verbetering van de toestand van de verpleegde dat
      de toepassing van de gedwongen geneeskundige handeling kan worden beëindigd. Dit plan wordt opgenomen in het
      verplegings- en behandelingsplan.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34a
  - number: 34a.2
    text: |-
      Bij de keuze voor een bepaalde geneeskundige handeling wordt steeds gekozen voor de voor de verpleegde minst
      ingrijpende handeling.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34a
  - number: 34b.1
    text: |-
      Voordat het hoofd van de inrichting de beslissing tot voortzetting van a-dwangbehandeling neemt, pleegt hij overleg
      met in ieder geval de voor de behandeling verantwoordelijke psychiater en met het hoofd van de afdeling waar de
      verpleegde verblijft.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34b
  - number: 34b.2
    text: |-
      In het in het eerste lid bedoelde overleg wordt nagegaan of van de voortzetting van de behandeling alsnog het
      beoogde effect kan worden verwacht.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34b
  - number: 34b.3
    text: |-
      De uitkomsten van het multidisciplinaire overleg, bedoeld in [artikel 33a, vierde lid][ref1], worden bij de
      beslissing meegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel33a
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: 33a
        hoofdstuk: '10'
  - number: 34c
    text: |-
      De verpleegde wordt gedurende de periode dat de a- of b-dwangbehandeling of de gedwongen geneeskundige handeling
      wordt verricht, zo vaak als nodig is bezocht door een arts of in diens opdracht een verpleegkundige. Het verslag
      van diens bevindingen wordt opgenomen in het verpleegdedossier.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34c
  - number: 34d.1
    text: |-
      Het hoofd van de inrichting stelt de voorzitter van de commissie van toezicht, de raadsman van de verpleegde, de
      curator en de mentor in kennis van het voornemen tot een beslissing tot a-dwangbehandeling uiterlijk drie dagen
      voor het nemen van die beslissing. Zij worden in de gelegenheid gesteld bezwaren tegen de beslissing kenbaar te
      maken.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34d
  - number: 34d.2
    text: |-
      De voorzitter van de commissie van toezicht doet onverwijld een melding aan de maandcommissaris. De
      maandcommissaris bezoekt na de melding onverwijld de verpleegde.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34d
  - number: 34d.3
    text: |-
      Van de toepassing van een a-dwangbehandeling, b-dwangbehandeling, gedwongen geneeskundige handeling of voortzetting
      van a-dwangbehandeling wordt uiterlijk bij de aanvang van de behandeling melding gedaan aan Onze Minister en
      de commissie van toezicht. Ingeval van een a-dwangbehandeling, b-dwangbehandeling of ingeval een gedwongen
      geneeskundige handeling wordt toegepast in verband met een gevaar dat voortvloeit uit een stoornis van de
      geestvermogens van de verpleegde, wordt bovendien melding gedaan aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34d
  - number: 34d.4
    text: |-
      Bij de aanvang van een a-dwangbehandeling geeft het hoofd van de inrichting daarvan eveneens kennis aan de in het
      eerste lid genoemde personen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34d
  - number: 34d.5
    text: |-
      Het hoofd van de inrichting zendt met de melding, bedoeld in het derde lid, een afschrift van de beslissing tot de
      behandeling mee waarin hij in ieder geval vermeldt:
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34d
  - number: 34d.5.a
    text: |-
      in verband met welk gevaar is besloten tot een a-dwangbehandeling, b-dwangbehandeling of een gedwongen
      geneeskundige handeling;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34d
  - number: 34d.5.b
    text: welke minder bezwarende middelen zijn aangewend om het gevaar weg te nemen dan wel af te wenden;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34d
  - number: 34d.5.c
    text: |-
      welke personen, bedoeld in [artikel 16a, onder c, van de wet][ref1], zich tegen de behandeling verzetten;


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16a
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16a
  - number: 34d.5.d
    text: de wijze waarop rekening wordt gehouden met de voorkeuren van de verpleegde ten aanzien van de behandeling; en
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34d
  - number: 34d.5.e
    text: |-
      indien een behandeling plaatsvindt in een situatie waarin het de verpleegde is die zich verzet, of deze in
      staat kan worden geacht gebruik te kunnen maken van de regeling, vervat in de [hoofdstukken XIV–XV][ref1]
      respectievelijk [XVI van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXIV
      [ref2]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXVI
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0008765
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0008765
        hoofdstuk: XVI
  - number: 34d.6
    text: |-
      Ingeval van een beslissing tot a-dwangbehandeling, b-dwangbehandeling of een beslissing tot voortzetting van a-
      dwangbehandeling, vermeldt het hoofd tevens welke pogingen zijn gedaan om tot overeenstemming als bedoeld in
      [artikel 16a, onder b, van de wet][ref1] te komen. In geval van een beslissing tot a-dwangbehandeling vermeldt hij
      bovendien welke bezwaren tegen de behandeling zijn aangevoerd door de personen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16a
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16a
  - number: 34d.7
    text: |-
      Van een beëindiging van een a-dwangbehandeling, b-dwangbehandeling, of gedwongen geneeskundige handeling geeft het
      hoofd van de inrichting kennis aan de personen, genoemd in het derde en – indien van toepassing – vierde lid.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34d
  - number: 34e
    text: |-
      De verantwoordelijke arts draagt zorg dat de melding van de toepassing van een a-dwangbehandeling, b-
      dwangbehandeling, gedwongen geneeskundige handeling of voorzetting van a-dwangbehandeling wordt opgenomen in het
      register als bedoeld in [artikel 6][ref1] en in het verpleegdedossier. Hij draagt tevens zorg dat de resultaten
      van het overleg, bedoeld in [artikel 33a, vierde lid][ref2], [artikel 34][ref3], en [artikel 34b][ref4], alsmede
      de adviezen die daarbij zijn gegeven en de afspraken die zijn gemaakt worden opgenomen in het verplegings- en
      behandelingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008690#Artikel33a
      [ref3]: https://wetten.overheid.nl/BWBR0008690#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0008690#Artikel34b
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34e
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '6'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008690
        artikel: 33a
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0008690
        artikel: '34'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0008690
        artikel: 34b
        hoofdstuk: '10'
  - number: 34f.1
    text: |-
      De inspecteur stelt na beëindiging van elke a- of b-dwangbehandeling doch in ieder geval na afloop van de termijn,
      bedoeld in [artikel 16c, vierde lid, van de wet][ref1], een onderzoek in of de beslissing tot de behandeling
      zorgvuldig is genomen en of de uitvoering van de behandeling zorgvuldig is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16c
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34f
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16c
  - number: 34f.2
    text: |-
      De inspecteur stelt eveneens een onderzoek in na beëindiging van elke gedwongen geneeskundige handeling, indien
      die handeling is verricht ter afwending van een gevaar dat voortvloeit uit de stoornis van de geestvermogens van
      de verpleegde.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel34f
  - number: '35.1'
    text: |-
      Indien de toepassing van de behandeling, bedoeld in [artikel 34, tweede lid][ref1], de duur van twee weken
      te boven gaat, wordt door het hoofd van de inrichting een commissie samengesteld bestaande uit ten minste een
      afdelingshoofd, een psychiater, een arts en een psycholoog.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel34
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '34'
        hoofdstuk: '10'
  - number: '35.2'
    text: |-
      De in het eerste lid bedoelde commissie brengt binnen twee dagen na de in het eerste lid bedoelde termijn en,
      indien de onvrijwillige behandeling langer wordt voortgezet, om de twee weken, advies uit aan het hoofd van de
      inrichting over de voortzetting van die behandeling.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel35
  - number: 35a.1
    text: |-
      Telefoongesprekken die in verband met het toezicht, bedoeld in [artikel 38, tweede lid, van de wet][ref1] worden
      opgenomen, worden bewaard voor een periode van ten hoogste vier maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel38
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '38'
  - number: 35a.2
    text: Na het verstrijken van de periode, genoemd in het eerste lid, wordt een opgenomen telefoongesprek gewist.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel35a
  - number: 35a.3
    text: |-
      Indien bij de uitoefening van het toezicht blijkt dat een telefoongesprek met een persoon als bedoeld in
      [artikel 36, eerste lid, van de wet][ref1] is opgenomen, wordt dit opgenomen gesprek terstond gewist.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel36
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '36'
  - number: 35a.4
    text: De verpleegde wordt van het opnemen van het telefoonverkeer op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel35a
  - number: 35a.5
    text: |-
      Opgenomen telefoongesprekken worden slechts verstrekt aan derden die ingevolge de uitvoering van hen bij of
      krachtens de wet opgedragen taken, tot kennisneming daarvan bevoegd zijn.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel35a
  - number: 35a.6
    text: 'De verstrekking, bedoeld in het vijfde lid, kan slechts geschieden in verband met:'
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel35a
  - number: 35a.6.a
    text: |-
      de bescherming van de maatschappij tegen de gevaarlijkheid van de verpleegde voor de veiligheid van anderen dan de
      verpleegde of de algemene veiligheid van personen of goederen;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel35a
  - number: 35a.6.b
    text: de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel35a
  - number: 35a.6.c
    text: de bescherming van slachtoffers van of anderszins betrokkenen bij misdrijven;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel35a
  - number: 35a.6.d
    text: de voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel35a
  - number: '36.1'
    text: |-
      Bij het Ministerie van Justitie en Veiligheid zijn een hoofd boeddhistische geestelijke verzorging, een hoofd
      hindoeïstische geestelijke verzorging, een hoofd islamitische geestelijke verzorging, een hoofdrabbijn, een
      hoofdpredikant, een hoofdaalmoezenier en een hoofd humanistische geestelijke verzorging aangesteld. Zij treden op
      als vertegenwoordiging van de zendende instanties en dienen Onze Minister gevraagd en ongevraagd van advies omtrent
      de geestelijke verzorging in de inrichtingen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel36
  - number: '36.2'
    text: |-
      De hoofden zijn in ieder geval belast met het doen van voordrachten voor aanstelling van geestelijk verzorgers bij
      de rijksinrichtingen behorende tot hun gezindte of levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel36
  - number: '37'
    text: |-
      Aan een inrichting zijn geestelijk verzorgers van verschillende godsdiensten of levensovertuigingen verbonden, doch
      in elk geval geestelijk verzorgers van boeddhistische, hindoeïstische, islamitische, joodse, protestantse en rooms-
      katholieke gezindte en geestelijk verzorgers van het humanistisch verbond.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel37
  - number: '38'
    text: |-
      De aanstelling van een geestelijk verzorger van boeddhistische, hindoeïstische, islamitische, joodse, protestantse
      of rooms-katholieke gezindte of een geestelijk verzorger behorend tot het humanistisch verbond bij een
      rijksinrichting geschiedt door of vanwege Onze Minister op voordracht van de betrokken hoofdgeestelijke, genoemd
      in [artikel 36, eerste lid][ref1]. De aanstelling van een geestelijk verzorger van boeddhistische, hindoeïstische,
      islamitische, joodse, protestantse of rooms-katholieke gezindte of een geestelijk verzorger behorend tot het
      humanistisch verbond bij een justitiële particuliere inrichting geschiedt door of vanwege het bestuur van de
      inrichting gehoord de betrokken hoofdgeestelijke, genoemd in artikel 36, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel36
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '36'
        hoofdstuk: '11'
  - number: '39'
    text: |-
      Een andere geestelijk verzorger dan de in [artikel 37][ref1] genoemde kan door de directeur toegang worden verleend
      tot de inrichting. De directeur neemt deze beslissing niet dan na overleg met Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel37
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '37'
        hoofdstuk: '11'
  - number: '40.1'
    text: 'Onder eigen geld wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel40
  - number: 40.1.a
    text: het geld dat de verpleegde bij binnenkomst in de inrichting in zijn bezit heeft;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel40
  - number: 40.1.b
    text: het geld dat tijdens zijn verblijf in de inrichting te zijnen gunste wordt ontvangen;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel40
  - number: 40.1.c
    text: |-
      de vergoeding voor het verrichten van werkzaamheden en het arbeidsloon, bedoeld in
      [artikel 46, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel46
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '46'
  - number: '40.2'
    text: |-
      Het beheer van het eigen geld van de verpleegde berust bij het hoofd van de inrichting, tenzij in het verplegings-
      en behandelingsplan anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel40
  - number: '40.3'
    text: |-
      Wanneer de verpleegde geen beheer over zijn eigen geld heeft, heeft hij de beschikking over een rekening-courant
      bij de inrichting.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel40
  - number: '41'
    text: |-
      De ter beschikking gestelde of anderzins verpleegde die geen inkomen heeft, ontvangt vanwege Onze Minister een door
      deze vast te stellen zak- en kleedgeld.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel41
  - number: '42.1'
    text: |-
      De verpleegdenraad, bedoeld in [artikel 70, eerste lid, van de wet][ref1], bestaat uit ten minste drie en ten
      hoogste zeven leden.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel70
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '70'
  - number: '42.2'
    text: De leden worden gekozen bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel42
  - number: '42.3'
    text: |-
      Het lidmaatschap van de verpleegdenraad eindigt na verloop van een termijn van twee jaar of zoveel eerder als de
      verpleging van het betreffende lid in de inrichting eindigt, aan hem proefverlof is verleend, dan wel zodra deze
      schriftelijk voor het lidmaatschap heeft bedankt.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel42
  - number: '43'
    text: |-
      Het hoofd van de inrichting biedt de verpleegdenraad ten minste eenmaal per maand de gelegenheid tot het voeren van
      het overleg, bedoeld in [artikel 70, tweede lid, van de wet][ref1], tenzij bijzondere omstandigheden zich hiertegen
      verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel70
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '70'
  - number: '44.1'
    text: |-
      Het hoofd van de inrichting verschaft de verpleegdenraad de informatie, de tijd en de materiële middelen die voor
      zijn functioneren nodig zijn en biedt de verpleegdenraad eenmaal per maand gedurende twee uren de gelegenheid zich
      intern te beraden en daartoe te vergaderen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel44
  - number: '44.2'
    text: |-
      De leden van de verpleegdenraad hebben het recht aan het overleg, bedoeld in
      [artikel 70, tweede lid, van de wet][ref1], alsmede aan het in het eerste lid genoemde intern beraad deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel70
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '70'
  - number: '44.3'
    text: Het intern beraad, bedoeld in het eerste lid, vindt zonder toezicht plaats.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel44
  - number: '44.4'
    text: |-
      Het hoofd van de inrichting kan op grond van de handhaving van de orde of veiligheid in de inrichting van het
      bepaalde in het tweede en derde lid afwijken.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel44
  - number: '45'
    text: |-
      Geschillen tussen de verpleegdenraad en het hoofd van de inrichting kunnen door elk van beide partijen ter
      bemiddeling worden voorgelegd aan de commissie van toezicht.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel45
  - number: '46.1'
    text: |-
      Indien drie maanden voor het tijdstip waarop de termijn van de terbeschikkingstelling met bevel tot verpleging
      van overheidswege zal zijn verstreken, de verpleging nog niet is beëindigd, maakt het hoofd van de inrichting voor
      verpleging van ter beschikking gestelden binnen een maand te rekenen vanaf voornoemd tijdstip een advies, bedoeld
      in [artikel 509][ref1], op en zendt dit aan Onze Minister. Het advies betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel509o
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 509o
  - number: 46.1.a
    text: de wenselijkheid van de verlenging van de terbeschikkingstelling;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel46
  - number: 46.1.b
    text: de termijn, waarover naar zijn mening, de verlenging zich zou moeten uitstrekken.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel46
  - number: '46.2'
    text: |-
      Indien de uit de stoornis van de geestvermogens voortvloeiende gevaarlijkheid van de ter beschikking gestelde
      voor de veiligheid van anderen dan de ter beschikking gestelde of de algemene veiligheid van personen of goederen
      dusdanig is teruggebracht dat het verantwoord is de verpleging onder voorwaarden te beëindigen, doet het hoofd van
      de inrichting voor verpleging van ter beschikking gestelden bij het advies, bedoeld in het eerste lid, een daartoe
      strekkend schriftelijk voorstel.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel46
  - number: '46.3'
    text: |-
      Bij het advies wordt een afschrift van de aantekeningen, bedoeld in [artikel 509][ref1], overgelegd alsmede, indien
      het hoofd van de inrichting voor verpleging van ter beschikking gestelden niet zelf psychiater is, het advies van
      een aan de inrichting verbonden psychiater.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel509o
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 509o
  - number: '46.4'
    text: |-
      Indien in het geval, bedoeld in het eerste lid, de ter beschikking gestelde op grond van proefverlof buiten de
      inrichting voor verpleging van ter beschikking gestelden verblijft en in zijn proefverlof door de reclassering
      wordt begeleid, voegt het hoofd van de inrichting voor verpleging van ter beschikking gestelden bij zijn advies
      de beschouwingen van de reclassering inzake de wenselijkheid van verlenging van de terbeschikkingstelling of de
      voorwaardelijke beëindiging van de verpleging.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel46
  - number: '46.5'
    text: |-
      Onze Minister zendt het advies met de bijlagen aan het openbaar ministerie bij de rechtbank die in eerste aanleg
      heeft kennis genomen van het misdrijf ter zake waarvan de terbeschikkingstelling is gelast.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel46
  - number: '47'
    text: |-
      Indien de verlenging van de terbeschikkingstelling er toe zou kunnen leiden dat de totale duur van de
      terbeschikkingstelling een periode van vier jaar of een veelvoud van vier jaar te boven gaat, zendt het hoofd van
      de inrichting voor verpleging van ter beschikking gestelden zes maanden voor het tijdstip waarop de termijn van de
      terbeschikkingstelling zal zijn verstreken, een voorlopig advies betreffende de wenselijkheid van de verlenging van
      de terbeschikkingstelling aan Onze Minister. [Artikel 46, vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel46
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '46'
        hoofdstuk: '14'
  - number: '48.1'
    text: |-
      Indien de verpleging voorwaardelijk is beëindigd of aan de terbeschikkingstelling voorwaarden zijn verbonden,
      zendt de reclassering die de ter beschikking gestelde hulp en steun verleent, indien verlenging van de
      terbeschikkingstelling wettelijk mogelijk is, drie maanden voor het tijdstip waarop de termijn van de
      terbeschikkingstelling zal zijn verstreken, advies inzake de wenselijkheid van die verlenging aan Onze Minister.
      Dit advies gaat vergezeld van een met redenen omkleed, gedagtekend en ondertekend advies van een psychiater of een
      psycholoog die zelf de ter beschikking gestelde heeft onderzocht.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel48
  - number: '48.2'
    text: |-
      De in het eerste lid bedoelde stukken worden twee maanden voor het tijdstip waarop de termijn van de
      terbeschikkingstelling zal zijn verstreken door tussenkomst van Onze Minister toegezonden aan het openbaar
      ministerie, bedoeld in [artikel 46, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel46
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '46'
        hoofdstuk: '14'
  - number: '49.1'
    text: |-
      Indien het openbaar ministerie naar aanleiding van het voorlopig advies, bedoeld in [artikel 47][ref1], voornemens
      is een vordering tot verlenging van de terbeschikkingstelling in te dienen waardoor de totale duur van de
      terbeschikkingstelling een periode van vier jaar of een veelvoud van vier jaar te boven gaat, doet het daarvan zo
      spoedig mogelijk mededeling aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel47
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '47'
        hoofdstuk: '14'
  - number: '49.2'
    text: |-
      Na ontvangst van de mededeling, bedoeld in het eerste lid, draagt Onze Minister zorg voor het tijdig totstandkomen
      van een advies of rapport van deskundigen als bedoeld in [artikel 509][ref1] en voor tijdige toezending daarvan aan
      het openbaar ministerie, bedoeld in [artikel 46, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel509o
      [ref2]: https://wetten.overheid.nl/BWBR0008690#Artikel46
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 509o
      - id: ref2
        bwb_id: BWBR0008690
        artikel: '46'
        hoofdstuk: '14'
  - number: '49.3'
    text: |-
      Onze Minister kan nadere regels stellen omtrent het onderzoek dat ten grondslag ligt aan het advies of rapport,
      bedoeld in [artikel 509][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel509o
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 509o
  - number: '50'
    text: |-
      Indien het openbaar ministerie daarom verzoekt, wordt terstond een nieuw advies als bedoeld
      in [artikel 46, eerste lid][ref1], of [48, eerste lid][ref2], aan Onze Minister gezonden.
      [Artikel 46, vijfde lid][ref3], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0008690#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0008690#Artikel46
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '46'
        hoofdstuk: '14'
      - id: ref2
        bwb_id: BWBR0008690
        artikel: '48'
        hoofdstuk: '14'
      - id: ref3
        bwb_id: BWBR0008690
        artikel: '46'
        hoofdstuk: '14'
  - number: '51.1'
    text: |-
      Het openbaar ministerie, bedoeld in [artikel 46, vijfde lid][ref1], doet Onze Minister zo spoedig mogelijk
      mededeling:


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel46
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '46'
        hoofdstuk: '14'
  - number: 51.1.a
    text: van zijn beslissing geen vordering tot verlenging van de terbeschikkingstelling in te dienen;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel51
  - number: 51.1.b
    text: |-
      van zijn vordering tot voorwaardelijke beëindiging van de verpleging van overheidswege overeenkomstig
      [artikel 38g, eerste lid, van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38g
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38g
  - number: 51.1.c
    text: |-
      indien een vordering tot verlenging van de terbeschikkingstelling is ingediend of een vordering als
      bedoeld onder *b* is ingediend, van de beslissing van de rechtbank op deze vordering en, indien deze
      niet onherroepelijk is geworden, van het instellen van beroep bij de bijzondere kamer van het gerechtshof
      Arnhem-Leeuwarden, van een voorlopige beëindiging van de verpleging van overheidswege als bedoeld in
      [artikel 509w, derde lid, van het Wetboek van Strafvordering][ref1], en van de beslissing op het beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel509w
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 509w
  - number: '51.2'
    text: |-
      Het hoofd van de inrichting voor verpleging van ter beschikking gestelden waarin de betrokkene wordt verpleegd
      en de reclassering die de betrokkene tijdens proefverlof hulp en steun verleent, worden door Onze Minister op de
      hoogte gesteld van een beslissing van de rechter als bedoeld in het eerste lid, tenzij andere wettelijke bepalingen
      reeds op andere wijze in die kennisgeving voorzien.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel51
  - number: '52.1'
    text: |-
      Het hoofd van de inrichting voor verpleging van ter beschikking gestelden stelt de ter beschikking gestelde of
      anderszins verpleegde in de gelegenheid de inrichting voor verpleging van ter beschikking gestelden te verlaten
      teneinde een gerechtelijke procedure bij te wonen:
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel52
  - number: 52.1.a
    text: indien hij krachtens wettelijk voorschrift verplicht is voor een rechter of bestuursorgaan te verschijnen;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel52
  - number: 52.1.b
    text: indien hij ter zake van een misdrijf moet terecht staan;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel52
  - number: 52.1.c
    text: |-
      indien hij bij het bijwonen van de procedure een aanmerkelijk belang heeft en tegen het verlaten van de inrichting
      hiertoe geen overwegend bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel52
  - number: '52.2'
    text: |-
      Het hoofd van de inrichting voor verpleging van ter beschikking gestelden kan bepalen dat gedurende het verblijf
      buiten de inrichting toezicht wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel52
  - number: '53.1'
    text: |-
      Verlof als bedoeld in [artikel 50, eerste lid, van de wet][ref1], wordt in de navolgende vormen onderscheiden:


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel50
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '50'
  - number: 53.1.a
    text: begeleid verlof;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel53
  - number: 53.1.b
    text: onbegeleid verlof;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel53
  - number: 53.1.c
    text: transmuraal verlof;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel53
  - number: 53.1.d
    text: incidenteel verlof.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel53
  - number: '53.2'
    text: |-
      Voordat het hoofd van de inrichting voor verpleging van ter beschikking gestelden overgaat tot het verlenen van een
      vorm van verlof, bedoeld in het eerste lid, verzoekt deze Onze Minister schriftelijk een machtiging. De machtiging
      van Onze Minister kan mede omvatten het meermalen verlenen van de in het eerste lid onderscheiden verlofsoort. De
      machtiging wordt verleend voor de duur van een jaar. Ten behoeve van het verlenen van een nieuwe machtiging draagt
      de inrichting voor verpleging van ter beschikking gestelden twee maanden voor het verlopen van de machtiging zorg
      voor een evaluatie aan Onze Minister. Een nieuwe machtiging wordt slechts verleend indien een evaluatie afgegeven
      is. De machtiging vervalt:
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel53
  - number: 53.2.1°
    text: |-
      zodra de ter beschikking gestelde of anderszins verpleegde vierentwintig uur ongeoorloofd afwezig is, tenzij sprake
      is van overmacht, of
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel53
  - number: 53.2.2°
    text: |-
      zodra het openbaar ministerie aan het hoofd van de inrichting voor verpleging van ter beschikking gestelden meldt
      dat de ter beschikking gestelde of anderszins verpleegde wordt aangemerkt als verdachte van een strafbaar feit
      waarvoor voorlopige hechtenis is toegelaten, begaan tijdens de tenuitvoerlegging van de terbeschikkingstelling met
      bevel tot verpleging van overheidswege of tijdens de opneming in de inrichting.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel53
  - number: '53.3'
    text: |-
      Onze Minister kan de machtiging intrekken bij overtreding van de voorwaarden, gesteld bij het verlenen van verlof
      of indien feiten of omstandigheden bekend worden waardoor, indien deze ten tijde van het verlenen van de machtiging
      bekend waren geweest, de machtiging niet of niet in deze vorm zou zijn verleend. Onze Minister kan per inrichting
      voor verpleging van ter beschikking gestelden of afdeling daarvan alle verlofmachtigingen intrekken indien er
      aanwijzingen zijn dat zich bij die inrichting of afdeling een patroon voordoet van meerdere onttrekkingen of andere
      incidenten.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel53
  - number: '53.4'
    text: |-
      Het verzoek van het hoofd van de inrichting voor verpleging van ter beschikking gestelden komt tot stand na
      multidisciplinair overleg binnen diens inrichting.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel53
  - number: '53.5'
    text: |-
      Het hoofd van de inrichting voor verpleging van ter beschikking gestelden stelt in de huisregels een nadere
      procedure vast die voorafgaat aan het verlenen van verlof. In de huisregels wordt tevens een procedure opgenomen
      betreffende de wijze en de frequentie van controle op het verlof.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel53
  - number: '53.6'
    text: |-
      Bij aanvang van het verlof ontvangt de ter beschikking gestelde of anderzins verpleegde een verlofpas. Hierop staat
      in ieder geval het tijdstip van aanvang en einde van het verlof aangegeven.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel53
  - number: '53.7'
    text: |-
      Er is een proef elektronisch volgsysteem als voorwaarde bij verlof. De proef is tijdelijk van aard en duurt ten
      hoogste zes jaar. Deelname aan deze proef geschiedt op vrijwillige basis. Bij ministeriële regeling worden regels
      gesteld over deze proef waaronder de doelgroep, de criteria en de rechtspositie van de ter beschikking gestelde.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel53
  - number: '53.8'
    text: Onze Minister stelt nadere regels aangaande het verlaten van de inrichting bij wijze van verlof.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel53
  - number: '54.1'
    text: |-
      De machtiging tot het verlenen van proefverlof van Onze Minister, bedoeld in
      [artikel 51, eerste lid, van de wet][ref1], wordt schriftelijk door het hoofd van de inrichting voor verpleging van
      ter beschikking gestelden aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel51
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '51'
  - number: '54.2'
    text: |-
      Bij dit verzoek wordt overgelegd een proefverlofplan, opgesteld in samenwerking met de reclassering, zo mogelijk
      die in het arrondissement waarin de ter beschikking gestelde tijdens dit proefverlof zal zijn gehuisvest.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel54
  - number: '54.3'
    text: |-
      Onze Minister beslist zo spoedig mogelijk op dit verzoek. Deze beslissing wordt schriftelijk medegedeeld aan
      het hoofd van de inrichting voor verpleging van ter beschikking gestelden. De machtiging van Onze Minister wordt
      verleend voor de duur van een jaar.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel54
  - number: '54.4'
    text: |-
      Onze Minister brengt een machtiging als bedoeld in het eerste lid schriftelijk ter kennis van het openbaar
      ministerie bij de rechtbank die in eerste aanleg kennis heeft genomen van het misdrijf ter zake waarvan de
      terbeschikkingstelling is gelast, het openbaar ministerie in het arrondissement waarin de ter beschikking gestelde
      zich op grond van het proefverlofplan zal vestigen en van de reclassering die aan de ter beschikking gestelde hulp
      en steun zal verlenen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel54
  - number: '54.5'
    text: Onze Minister stelt nadere regels aangaande het verlaten van de inrichting bij wijze van proefverlof.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel54
  - number: 54a
    text: |-
      Er is een proef forensisch psychiatrisch toezicht in de fase van proefverlof. De proef is tijdelijk van aard
      en duurt ten hoogste drie jaar. Onze Minister wijst inrichtingen voor verpleging van ter beschikking gestelden
      aan waar de proef plaatsvindt. In de proef wordt, onverminderd de betrokkenheid van de reclassering, op de
      ter beschikking gestelde die met proefverlof is, toezicht gehouden door de inrichting voor verpleging van ter
      beschikking gestelden.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel54a
  - number: '55'
    text: |-
      Bij aanvang van het proefverlof ontvangt de ter beschikking gestelde van het hoofd van de inrichting voor
      verpleging van ter beschikking gestelden een schriftelijke verklaring waarin de voorwaarden zijn vermeld die aan
      het proefverlof zijn verbonden, benevens de gronden waarop het hoofd van de inrichting voor verpleging van ter
      beschikking gestelden overeenkomstig [artikel 50, derde lid, van de wet][ref1], het proefverlof kan intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel50
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '50'
  - number: '56'
    text: |-
      De ter beschikking gestelde of anderzins verpleegde ontvangt zo nodig vergoeding voor een reis of reisgelegenheid
      naar de plaats van bestemming en voor de terugkeer, voor zover daarin niet bij een andere wettelijke regeling is
      voorzien.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel56
  - number: '57.1'
    text: |-
      Indien het hoofd van de inrichting voor verpleging van ter beschikking gestelden het proefverlof intrekt, geeft hij
      daarvan terstond kennis aan Onze Minister. Deze kennisgeving wordt onder vermelding van de datum van ingang van de
      beslissing schriftelijk bevestigd.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel57
  - number: '57.2'
    text: |-
      Het hoofd van de inrichting voor verpleging van ter beschikking gestelden stelt de ter beschikking gestelde zo
      spoedig mogelijk schriftelijk in kennis van de beslissing tot intrekking van het proefverlof.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel57
  - number: '57.3'
    text: |-
      Het hoofd van de inrichting voor verpleging van ter beschikking gestelden geeft van de beslissing tot intrekking
      van het proefverlof schriftelijk bericht aan de instanties genoemd in [artikel 54, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel54
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '54'
        hoofdstuk: '16'
  - number: '57.4'
    text: 'De machtiging van Onze Minister vervalt:'
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel57
  - number: 57.4.1°
    text: zodra de ter beschikking gestelde vierentwintig uur ongeoorloofd afwezig is, tenzij sprake is van overmacht, of
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel57
  - number: 57.4.2°
    text: |-
      zodra het openbaar ministerie aan het hoofd van de inrichting voor verpleging van ter beschikking gestelden meldt
      dat de ter beschikking gestelde wordt aangemerkt als verdachte van een strafbaar feit waarvoor voorlopige hechtenis
      is toegelaten, begaan tijdens het proefverlof.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel57
  - number: '57.5'
    text: |-
      Onze Minister kan de machtiging intrekken bij overtreding van de voorwaarden, gesteld bij het verlenen van
      proefverlof of indien feiten of omstandigheden bekend worden waardoor, indien deze ten tijde van het verlenen van
      de machtiging bekend waren geweest, de machtiging niet of niet in deze vorm zou zijn verleend. Onze Minister geeft
      terstond kennis van het intrekken van de machtiging tot proefverlof aan het hoofd van de inrichting voor verpleging
      van ter beschikking gestelden.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel57
  - number: '58'
    text: |-
      Bijzondere voorwaarden, bedoeld in [artikel 51, tweede lid, van de wet][ref1], strekkende tot het verkrijgen van
      hulp en steun worden door het hoofd van de inrichting voor verpleging van ter beschikking gestelden ter kennis
      gebracht van de reclassering die de ter beschikking gestelde hulp en steun verleent. Hetzelfde geldt met betrekking
      tot beslissingen die strekken tot wijziging, aanvulling of opheffing van de voorwaarden waarop de verlening van
      hulp en steun betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel51
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '51'
  - number: '59.1'
    text: |-
      De reclassering, bedoeld in [artikel 58][ref1], stelt zich zo spoedig mogelijk nadat zij is belast met het verlenen
      van hulp en steun in verbinding met met het hoofd van de inrichting voor verpleging van ter beschikking gestelden
      dat aan de ter beschikking gestelde proefverlof heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel58
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '58'
        hoofdstuk: '16'
  - number: '59.2'
    text: |-
      De reclassering draagt er zorg voor dat het hoofd van de inrichting voor verpleging van ter beschikking gestelden
      in kennis wordt gesteld van alle bijzondere voorvallen welke de ter beschikking gestelde betreffen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel59
  - number: '60.1'
    text: |-
      De reclassering rapporteert regelmatig aan het hoofd van de inrichting voor verpleging van ter beschikking
      gestelden dat proefverlof heeft verleend, met dien verstande dat de eerste rapportage plaatsvindt nadat een maand
      van het proefverlof is verstreken en dat vervolgens telkens wordt gerapporteerd over een periode van twee maanden.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel60
  - number: '60.2'
    text: |-
      Indien de ter beschikking gestelde de veiligheid van anderen of de algemene veiligheid van personen of goederen
      in gevaar brengt of dreigt te brengen dan wel de bij het proefverlof opgelegde verplichtingen niet nakomt, wordt
      daarover tussentijds gerapporteerd.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel60
  - number: '60.3'
    text: |-
      In de loop van de eerste helft van de derde maand voor het tijdstip waarop de termijn van de terbeschikkingstelling
      met verpleging van overheidswege zal zijn verstreken, zendt de reclassering aan het hoofd van de inrichting
      voor verpleging van ter beschikking gestelden haar beschouwingen inzake de wenselijkheid van verlenging van de
      terbeschikkingstelling.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel60
  - number: '61.1'
    text: |-
      De reclassering kan uit eigen beweging aan het hoofd van de inrichting voor verpleging van ter
      beschikking gestelden een voorstel doen tot wijziging of opheffing van de voorwaarden, bedoeld in
      [artikel 51, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel51
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '51'
        hoofdstuk: '14'
  - number: '61.2'
    text: |-
      De reclassering kan uit eigen beweging door tussenkomst van het hoofd van de inrichting voor verpleging van
      ter beschikking gestelden en Onze Minister aan het openbaar ministerie een voorstel doen tot het vorderen van
      voorwaardelijke beëindiging van de verpleging van overheidswege.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel61
  - number: '61.3'
    text: |-
      De reclassering dient desgevraagd het hoofd van de inrichting voor verpleging van ter beschikking gestelden en Onze
      Minister van advies.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel61
  - number: '62'
    text: |-
      Van de uitspraak waarbij de rechter aan de reclassering opdracht geeft de ter beschikking gestelde bij de naleving
      van de voorwaarden hulp en steun te verlenen, bedoeld in [artikel 38, eerste lid][ref1], of [38][ref2], doet het
      openbaar ministerie zo spoedig mogelijk mededeling aan Onze Minister en aan de reclassering in het arrondissement
      waar de voorwaarden ten uitvoer worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38g
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38g
  - number: '63'
    text: |-
      Het algemeen toezicht op ter beschikking gestelden die niet van overheidswege worden verpleegd, berust bij Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel63
  - number: '64.1'
    text: |-
      Bij beëindiging van het verblijf in de inrichting voor verpleging van ter beschikking gestelden ontvangt de ter
      beschikking gestelde of anderszins verpleegde vergoeding voor een reis of reisgelegenheid naar zijn woon- of
      verblijfplaats binnen Nederland.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel64
  - number: '64.2'
    text: |-
      Indien de omstandigheden daartoe grond opleveren, kan Onze Minister beslissen dat de betrokkene onder geleide naar
      de plaats van zijn bestemming wordt overgebracht.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel64
  - number: '65.1'
    text: |-
      Onze Minister ontvangt ten behoeve van het toezicht, bedoeld in [artikel 63][ref1], zo spoedig mogelijk mededeling
      van elke op een niet van overheidswege verpleegde ter beschikking gestelde betrekking hebbende:


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel63
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '63'
        hoofdstuk: '17'
  - number: 65.1.a
    text: |-
      onherroepelijk geworden uitspraak waarbij terbeschikkingstelling met voorwaarden is gelast, als bedoeld in
      [artikel 38, eerste lid, van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '38'
  - number: 65.1.b
    text: |-
      rechterlijke beslissing inzake een vordering op grond van [artikel 38b][ref1], [38c][ref2], [38i ][ref3] of
      [38k van het Wetboek van Strafrecht][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38c
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel38i
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel38k
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38c
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 38i
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 38k
  - number: 65.1.c
    text: beslissing tot vrijheidsontneming door het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel65
  - number: 65.1.d
    text: |-
      onherroepelijk geworden uitspraak van een burgerlijk of militair gerecht waarbij ten aanzien van de ter beschikking
      gestelde opnieuw is beslist dat hij zich aan een misdrijf heeft schuldig gemaakt.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel65
  - number: '65.2'
    text: |-
      De in het eerste lid genoemde feiten worden aan Onze Minister medegedeeld door de ambtenaren met de
      tenuitvoerlegging van de in dat lid bedoelde rechterlijke beslissingen belast, onderscheidenlijk elke ambtenaar van
      het openbaar ministerie die van de in het eerste lid, onder *c*, bedoelde beslissing tot vrijheidsontneming kennis
      krijgt.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel65
  - number: '66.1'
    text: |-
      Onze Minister doet de hem overeenkomstig artikel 65 alsmede overige met betrekking tot de ter beschikking gestelde
      die niet van overheidswege wordt verpleegd, verschafte gegevens, voor zover hem dit wenselijk voorkomt, opnemen in
      een algemeen op zijn departement gehouden register.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel66
  - number: '66.2'
    text: |-
      Indien met betrekking tot een ter beschikking gestelde die niet van overheidswege wordt verpleegd, de kennisneming
      van de gegevens uit het algemeen register naar het oordeel van Onze Minister van belang kan zijn voor het openbaar
      ministerie bij de rechtbank die in eerste aanleg heeft kennis genomen van het misdrijf ter zake waarvan de
      terbeschikkingstelling is gelast, doet Onze Minister dit openbaar ministerie die gegevens toekomen, al dan niet
      onder bijvoeging van zijn beschouwingen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel66
  - number: '67.1'
    text: |-
      Met het toezicht op de naleving van de voorwaarden, bedoeld in [artikel 38, eerste lid][ref1], en van de
      voorwaarden, bedoeld in [artikel 38][ref2], is steeds mede belast het openbaar ministerie in het arrondissement
      waarin de ter beschikking gestelde feitelijk woont.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38g
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38g
  - number: '67.2'
    text: |-
      Het openbaar ministerie, bedoeld in het eerste lid, wordt, voor zover nodig, door Onze Minister in kennis gesteld
      van de voorwaarden, bedoeld in het eerste lid, en van een verstrekte opdracht tot het verlenen van hulp en steun.
      Een op een later tijdstip gegeven rechterlijke beslissing met betrekking tot voorwaarden, opdracht tot het verlenen
      van hulp en steun of verlenging van de terbeschikkingstelling wordt eveneens, voor zover nodig, ter kennis van
      dit openbaar ministerie gebracht. Het openbaar ministerie doet zo nodig de nieuwe of gewijzigde voorwaarden op de
      ontslagbrief aantekenen.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel67
  - number: '68'
    text: |-
      De reclassering, bedoeld in [artikel 62][ref1], stelt zich zo spoedig mogelijk nadat zij is belast met het verlenen
      van hulp en steun in verbinding met het openbaar ministerie dat op grond van [artikel 67, eerste lid][ref2], het
      toezicht op de ter beschikking gestelde uitoefent. Zij draagt er zorg voor dat deze instantie in kennis wordt
      gesteld van misdrijven en andere bijzondere voorvallen welke de ter beschikking gestelde betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0008690#Artikel67
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '62'
        hoofdstuk: '17'
      - id: ref2
        bwb_id: BWBR0008690
        artikel: '67'
        hoofdstuk: '17'
  - number: '69'
    text: |-
      Met betrekking tot de voorwaarden, bedoeld in [artikel 38, eerste lid][ref1], en [38][ref2], rapporteert de
      reclassering ten minste eenmaal per drie maanden aan Onze Minister en aan het openbaar ministerie dat op grond van
      [artikel 67, eerste lid][ref3], het toezicht op de ter beschikking gestelde uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38g
      [ref3]: https://wetten.overheid.nl/BWBR0008690#Artikel67
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38g
      - id: ref3
        bwb_id: BWBR0008690
        artikel: '67'
        hoofdstuk: '17'
  - number: '70'
    text: |-
      De reclassering kan een voorstel doen aan het openbaar ministerie tot wijziging, aanvulling of opheffing van de
      voorwaarden, bedoeld in [artikel 38, eerste lid][ref1], en [artikel 38][ref2]. Het voorstel wordt door tussenkomst
      van Onze Minister aan het openbaar ministerie bij de rechtbank die in eerste aanleg heeft kennis genomen van het
      misdrijf ter zake waarvan de terbeschikkingstelling is gelast, gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38g
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38g
  - number: '71.1'
    text: |-
      Indien de ter beschikking gestelde de voorwaarden overtreedt, of anderzins het belang van de veiligheid van anderen
      dan wel de algemene veiligheid van personen of goederen zulks eist, kan de reclassering een voorstel tot het geven
      van een bevel tot verpleging door tussenkomst van Onze Minister zenden aan het openbaar ministerie bij de rechtbank
      die in eerste aanleg heeft kennis genomen van het misdrijf ter zake waarvan de terbeschikkingstelling is gelast.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel71
  - number: '71.2'
    text: De reclassering dient desgevraagd Onze Minister en het openbaar ministerie, bedoeld in het eerste lid, van advies.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel71
  - number: '76.1'
    text: |-
      De beloning van de tolk of de vertaler en de vergoeding van de door hen gemaakte kosten, bedoeld in
      [artikel 78, onder ][ref1] geschieden volgens het bepaalde bij of krachtens de [Wet tarieven in strafzaken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '78'
      - id: ref2
        bwb_id: BWBR0002406
  - number: '76.2'
    text: |-
      De secretaris van de beklag- of beroepscommissie stelt op basis van de in het eerste lid genoemde bepalingen de
      hoogte van de beloning en vergoeding vast. Met de uitbetaling is het hoofd van de inrichting belast.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel76
  - number: '77'
    text: |-
      De vergoeding van de door een persoon als bedoeld in artikel 61, vierde lid, van de wet gemaakte kosten geschiedt
      volgens de [Wet tarieven in strafzaken][ref1]. Artikel 76, tweede lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: '78'
    text: |-
      Bij overlijden van een ter beschikking gestelde of anderzins verpleegde komen de kosten van begrafenis of crematie
      voor zover die redelijkerwijs noodzakelijk kunnen worden geacht en niet ten laste van het vermogen van betrokkene
      of diens erfgenamen kunnen worden gebracht, ten laste van de Staat.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel78
  - number: '79.1'
    text: |-
      Onverminderd het bepaalde bij of krachtens de [Wet langdurige zorg][ref1] komen ten laste van de Staat:


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: 79.1.a
    text: |-
      de kosten van verpleging en behandeling van de ter beschikking gestelde of anderszins verpleegde die voortvloeien
      uit hulpverlening door gedragsdeskundigen in verband met de geestesstoornis van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel79
  - number: 79.1.b
    text: andere kosten van geneeskundige verzorging van de ter beschikking gestelde die van overheidswege wordt verpleegd;
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel79
  - number: 79.1.c
    text: |-
      de kosten van overbrenging van een ter beschikking gestelde of anderzins verpleegde naar enige voor hem in het
      kader van de verpleging bestemde plaats.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel79
  - number: '79.2'
    text: De noodzakelijke kosten van bestaan tijdens proefverlof komen niet ten laste van de Staat.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel79
  - number: '80'
    text: |-
      Een ieder die betrokken is bij de uitvoering van de wet en dit besluit en daarbij de beschikking krijgt over
      gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds
      uit hoofde van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is
      verplicht tot geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht
      of uit zijn taak bij de uitvoering van dit besluit de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel80
  - number: '88'
    text: |-
      Het Reglement tenuitvoerlegging terbeschikkingstelling van 6 juni 1988 (*Stb.* 1988, 282) en de Tijdelijke regeling
      van de rechtspositie van ter beschikking gestelden van 29 januari 1987 (*Stb.* 1987, 55) worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel88
  - number: '89'
    text: |-
      Indien een inrichting voor verpleging van ter beschikking gestelden op het moment van inwerkingtreding van dit
      besluit is aangewezen op grond van artikel 26, eerste lid, Reglement tenuitvoerlegging terbeschikkingstelling,
      geldt deze aanwijzing als aanwijzing op grond van [artikel 2][ref1] van het onderhavige besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel2
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '2'
        hoofdstuk: '2'
  - number: '90'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel90
  - number: '91'
    text: 'Dit besluit wordt aangehaald als: Reglement verpleging ter beschikking gestelden.'
    url: https://wetten.overheid.nl/BWBR0008690/2026-01-01#Artikel91
