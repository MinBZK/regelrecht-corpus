  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen, van 15 juli 1993, nr. 92091035/4675,
    directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op artikel 2.6, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek;

    Gezien het advies van de Onderwijsraad (advies van 23 april 1993, nr. OR 93000072/T);

    De Raad van State gehoord (advies van 13 december 1993, nr. W05.93.0520);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, van 17 december 1993, nr.
    93099780/4675, directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#ArtikelAanhef
