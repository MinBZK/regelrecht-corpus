        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '2.5'
    text: 'Het landelijk beschikbaar onderwijsdeel bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.5
  - number: 2.5.a
    text: een component eerstejaars,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.5
  - number: 2.5.b
    text: een component getuigschriften,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.5
  - number: 2.5.c
    text: een component basisvoorziening onderwijs, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.5
  - number: 2.5.d
    text: |-
      in voorkomende gevallen bedragen ten behoeve van de numerus fixus geneeskunde, de werkplaats diergeneeskunde en de
      werkplaats tandheelkunde.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.5
  - number: 2.6.1
    text: |-
      De landelijke component eerstejaars, voor een begrotingsjaar vastgesteld op grond van [artikel 2.4][ref1], wordt
      over de universiteiten verdeeld op basis van het aantal eerstejaars dat in het tweede kalenderjaar voorafgaand aan
      het begrotingsjaar aan een universiteit ingeschreven staat, met inachtneming van het tweede tot en met vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6.2
    text: |-
      Ten behoeve van de verdeling van de landelijke component eerstejaars over de universiteiten wordt het aantal
      eerstejaars per universiteit onderscheiden naar:
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6
  - number: 2.6.2.a
    text: het aantal eerstejaars aan opleidingen met een laag bekostigingsniveau, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6
  - number: 2.6.2.b
    text: het aantal eerstejaars aan opleidingen met een hoog bekostigingsniveau.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6
  - number: 2.6.3
    text: |-
      Het aantal te bekostigen eerstejaars per universiteit bedraagt de som van de in het tweede lid berekende aantallen,
      nadat deze zijn vermenigvuldigd met 1 onderscheidenlijk 1,5.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6
  - number: 2.6.4
    text: |-
      Voor de bepaling van het aantal eerstejaars, bedoeld in het eerste lid, wordt uitgegaan van de in het Centraal
      register inschrijving opgenomen gegevens die de desbetreffende universiteit uiterlijk op 1 maart van het
      voorafgaande begrotingsjaar aan Onze minister verstrekt, vergezeld van een verklaring van een accountant.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6
  - number: 2.6.5
    text: |-
      De landelijke component eerstejaars wordt over de universiteiten verdeeld naar rato van het in het derde lid
      berekende aantal eerstejaars.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6
  - number: 2.6a.1
    text: |-
      De landelijke component getuigschriften, voor een begrotingsjaar vastgesteld op grond van [artikel 2.4][ref1],
      wordt over de universiteiten verdeeld op basis van het aantal door een universiteit uitgereikte getuigschriften in
      het studiejaar dat eindigt in het tweede kalenderjaar voorafgaand aan het begrotingsjaar, met inachtneming van het
      tweede tot en met zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6a.2
    text: |-
      Ten behoeve van de verdeling van de landelijke component getuigschriften over de universiteiten wordt het aantal
      getuigschriften per universiteit onderscheiden naar:
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.2.a
    text: getuigschriften van bacheloropleidingen met een laag bekostigingsniveau,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.2.b
    text: getuigschriften van bacheloropleidingen met een hoog bekostigingsniveau,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.2.c
    text: getuigschriften van de bacheloropleidingen diergeneeskunde, farmacie, geneeskunde en tandheelkunde,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.2.d
    text: getuigschriften van masteropleidingen met een laag bekostigingsniveau,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.2.e
    text: getuigschriften van masteropleidingen met een hoog bekostigingsniveau,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.2.f
    text: getuigschriften van de masteropleidingen diergeneeskunde, farmacie, geneeskunde en tandheelkunde,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.2.g
    text: getuigschriften van ongedeelde opleidingen met een laag bekostigingsniveau,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.2.h
    text: getuigschriften van ongedeelde opleidingen met een hoog bekostigingsniveau, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.2.i
    text: getuigschriften van de ongedeelde opleidingen diergeneeskunde, farmacie, geneeskunde en tandheelkunde.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.3
    text: |-
      Op het aantal getuigschriften, bedoeld in het tweede lid, eerste volzin, onderdelen a, b en c, blijven buiten
      beschouwing:
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.3.a
    text: |-
      het aantal getuigschriften van een bacheloropleiding die zijn uitgereikt aan degenen aan wie reeds een
      getuigschrift is uitgereikt van het met goed gevolg afgelegd afsluitend examen van een bacheloropleiding in het
      hoger beroepsonderwijs of van een opleiding in het hoger beroepsonderwijs, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.3.b
    text: |-
      het aantal kandidaatsgetuigschriften van een opleiding in het wetenschappelijk onderwijs die zijn uitgereikt aan
      degenen aan wie reeds een getuigschrift is uitgereikt van het met goed gevolg afgelegd afsluitend examen van een
      bacheloropleiding in het hoger beroepsonderwijs of van een opleiding in het hoger beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.4
    text: |-
      Voor de toepassing van dit artikel, tweede lid, eerste volzin, onderdelen g, h en i, worden de getuigschriften
      van een ongedeelde opleiding in het wetenschappelijk onderwijs die zijn uitgereikt aan degenen aan wie reeds een
      getuigschrift is uitgereikt van het met goed gevolg afgelegd afsluitend examen van een bacheloropleiding in het
      hoger onderwijs of van het met goed gevolg afgelegd kandidaatsexamen van een opleiding in het wetenschappelijk
      onderwijs, aangemerkt als getuigschriften van een masteropleiding. Getuigschriften die zijn uitgereikt vóór
      1 september van het achtste kalenderjaar voorafgaand aan het begrotingsjaar blijven voor de toepassing van dit lid
      buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.5
    text: |-
      Het aantal te bekostigen getuigschriften per universiteit bedraagt de som van de in het tweede, derde en vierde lid
      berekende aantallen, nadat deze zijn vermenigvuldigd met onderscheidenlijk 2/3, 1, 6/5, 1/3, 1/2, 9/5, 1, 3/2 en 3.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6a.6
    text: |-
      [Artikel 2.6, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.6a.7
    text: |-
      De landelijke component getuigschriften wordt over de universiteiten verdeeld naar rato van het in het vijfde lid
      berekende aantal getuigschriften.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6a
  - number: 2.6b
    text: |-
      De landelijke component basisvoorziening onderwijs voor een begrotingsjaar is gelijk aan het na toepassing van de
      [artikelen 2.6][ref1], [2.6a][ref2], [2.6d][ref3] en [2.6e][ref4] voor dat begrotingsjaar resterende landelijke
      beschikbare onderwijsdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6b
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.6c.1
    text: |-
      De landelijke component basisvoorziening onderwijs, voor een begrotingsjaar vastgesteld op grond van
      [artikel 2.4][ref1], wordt over de universiteiten verdeeld op basis van de omvang van de component basisvoorziening
      onderwijs per universiteit in het voorafgaande begrotingsjaar, met inachtneming van het tweede tot en met zevende
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6c
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6c.2
    text: |-
      Ten behoeve van de verdeling van de component basisvoorziening onderwijs over de universiteiten worden het bedrag
      basisvoorziening onderwijs plus en het bedrag compensatie onderwijs onderscheiden.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6c
  - number: 2.6c.3
    text: |-
      Het bedrag basisvoorziening onderwijs plus omvat de op grond van [artikel 2.4][ref1] vastgestelde component
      basisvoorziening onderwijs, vermeerderd met de op grond van [artikel 2.4][ref2] vastgestelde component
      getuigschriften en verminderd met 50% van het op grond van [artikel 2.4][ref3] vastgestelde onderwijsdeel, nadat
      dat bedrag is verminderd met de op grond van [artikel 2.4][ref4] vastgestelde bedragen voor de numerus fixus, de
      werkplaats diergeneeskunde en de werkplaats tandheelkunde.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6c
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6c.4
    text: |-
      Het bedrag compensatie onderwijs omvat de op grond van [artikel 2.4][ref1] vastgestelde component getuigschriften,
      verminderd met een bij ministeriële regeling vast te stellen percentage van het op grond van [artikel 2.4][ref2]
      vastgestelde onderwijsdeel, nadat dat bedrag is verminderd met de op grond van [artikel 2.4][ref3] vastgestelde
      bedragen voor de numerus fixus, de werkplaats diergeneeskunde en de werkplaats tandheelkunde.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6c
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6c.5
    text: |-
      Het bedrag basisvoorziening onderwijs plus wordt over de universiteiten verdeeld naar rato van de omvang van het
      bedrag basisvoorziening onderwijs plus per universiteit in het voorafgaande begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6c
  - number: 2.6c.6
    text: |-
      Het bedrag compensatie onderwijs wordt over de universiteiten verdeeld naar rato van de omvang van het bedrag
      compensatie onderwijs per universiteit in het voorafgaande begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6c
  - number: 2.6c.7
    text: |-
      De component basisvoorziening onderwijs per universiteit is het bedrag per universiteit, bedoeld in het vijfde lid,
      verminderd met het bedrag per universiteit, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6c
  - number: 2.6d
    text: |-
      De landelijke bedragen ten behoeve van de numerus fixus geneeskunde, de werkplaats diergeneeskunde, de werkplaats
      tandheelkunde en de numerus fixus klinische technologie, voor een begrotingsjaar vastgesteld op grond van
      [artikel 2.4][ref1], worden over de universiteiten verdeeld naar rato van de omvang van die bedragen per
      universiteit in het voorafgaande begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6d
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6e.1
    text: |-
      Bij de berekening van de component eerstejaars en de component getuigschriften van de openbare universiteit
      te Maastricht worden de op grond van [artikel 2.6][ref1] onderscheidenlijk [artikel 2.6a][ref2] berekende
      aantallen vermeerderd met de aantallen eerstejaars van de transnationale Universiteit Limburg met de Nederlandse
      nationaliteit onderscheidenlijk met de aantallen door de transnationale Universiteit Limburg uitgereikte
      getuigschriften. Hieronder worden tevens begrepen de aantallen eerstejaars en getuigschriften van ingeschrevenen
      die noch de Nederlandse noch de Belgische nationaliteit bezitten, en die voor bekostiging door de Nederlandse
      overheid in aanmerking worden genomen op grond van artikel 7 van het Verdrag tussen het Koninkrijk der Nederlanden
      en de Vlaamse Gemeenschap van België inzake de transnationale Universiteit Limburg.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6e
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.6e.2
    text: |-
      De [artikelen 2.6, tweede, derde en vierde lid][ref1], en [2.6a, tweede tot en met vijfde lid][ref2], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.6e
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '2.7'
    text: |-
      Het onderwijsdeel van een universiteit bestaat uit de som van de component eerstejaars per universiteit, de
      component getuigschriften per universiteit en de component basisvoorziening onderwijs per universiteit. In
      voorkomende gevallen wordt het onderwijsdeel van die universiteit vermeerderd met bedragen per universiteit ten
      behoeve van de numerus fixus geneeskunde, de werkplaats diergeneeskunde en de werkplaats tandheelkunde.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.7
  - number: 2.7a
    text: |-
      In deze paragraaf wordt onder universiteit verstaan een universiteit als bedoeld in de [onderdelen a, b en h van de
      bijlage van de wet](onbekend).
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.7a
  - number: '2.8'
    text: 'Het onderzoekdeel van een universiteit bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.8
  - number: 2.8.a
    text: een component basisvoorziening onderzoek,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.8
  - number: 2.8.b
    text: een component proefschriften en ontwerperscertificaten,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.8
  - number: 2.8.c
    text: een component afbouw dynamisering Smart Mix,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.8
  - number: 2.8.d
    text: een component onderzoekscholen,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.8
  - number: 2.8.e
    text: in voorkomende gevallen een component toponderzoekscholen, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.8
  - number: 2.8.f
    text: een component strategische overwegingen.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.8
  - number: 2.9.1
    text: |-
      De landelijke component basisvoorziening onderzoek, voor een begrotingsjaar op grond van [artikel 2.4][ref1]
      vastgesteld, wordt over de universiteiten verdeeld op basis van het aantal door een universiteit uitgereikte
      getuigschriften in het studiejaar dat eindigt in het tweede kalenderjaar voorafgaand aan het begrotingsjaar, met
      inachtneming van het tweede tot en met vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.9.2
    text: |-
      Ten behoeve van de verdeling van de landelijke component basisvoorziening onderzoek over de universiteiten wordt
      het aantal getuigschriften per universiteit onderscheiden naar:
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
  - number: 2.9.2.a
    text: getuigschriften van bacheloropleidingen met een laag bekostigingsniveau,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
  - number: 2.9.2.b
    text: getuigschriften van bacheloropleidingen met een hoog bekostigingsniveau,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
  - number: 2.9.2.c
    text: getuigschriften van de bacheloropleidingen diergeneeskunde, farmacie, geneeskunde en tandheelkunde,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
  - number: 2.9.2.d
    text: getuigschriften van masteropleidingen met een laag bekostigingsniveau,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
  - number: 2.9.2.e
    text: getuigschriften van masteropleidingen met een hoog bekostigingsniveau,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
  - number: 2.9.2.f
    text: getuigschriften van de masteropleidingen diergeneeskunde, farmacie, geneeskunde en tandheelkunde,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
  - number: 2.9.2.g
    text: getuigschriften van ongedeelde opleidingen met een laag bekostigingsniveau,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
  - number: 2.9.2.h
    text: getuigschriften van ongedeelde opleidingen met een hoog bekostigingsniveau, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
  - number: 2.9.2.i
    text: getuigschriften van de ongedeelde opleidingen diergeneeskunde, farmacie, geneeskunde en tandheelkunde.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
  - number: 2.9.3
    text: |-
      Artikel [2.6a, derde en vierde lid][ref1], is van toepassing, met dien verstande dat de tweede volzin van deze
      leden voor de Open Universiteit niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.9.4
    text: |-
      Het aantal te bekostigen getuigschriften per universiteit bedraagt de som van de in het tweede en derde lid
      berekende aantallen, nadat deze zijn vermenigvuldigd met onderscheidenlijk 1/3, 1/2, 1, 2/3, 1, 2, 1, 3/2 en
      3 zijn.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
  - number: 2.9.5
    text: |-
      Voor de bepaling van het aantal getuigschriften, bedoeld in het eerste lid, wordt uitgegaan van de in het
      Centraal register inschrijving opgenomen gegevens die de desbetreffende universiteit uiterlijk op 1 maart van
      het voorafgaande begrotingsjaar aan Onze minister verstrekt, vergezeld van een verklaring van een accountant.
      [Artikel 2.6e][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.9.6
    text: |-
      In afwijking van het vijfde lid wordt voor de bepaling van het aantal getuigschriften, bedoeld in het eerste
      lid, van de Open Universiteit, uitgegaan van de opgave die de Open Universiteit uiterlijk op 1 maart van het
      kalenderjaar voorafgaand aan het begrotingsjaar aan Onze minister verstrekt, vergezeld van een verklaring van een
      accountant.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.9
  - number: 2.10.1
    text: |-
      De landelijke component proefschriften en ontwerperscertificaten, voor een begrotingsjaar vastgesteld op
      grond van [artikel 2.4][ref1], wordt over de universiteiten verdeeld op basis van het aantal proefschriften en
      ontwerperscertificaten aan een universiteit in het tweede kalenderjaar voorafgaand aan het begrotingsjaar, met
      inachtneming van het tweede tot en met zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.10.2
    text: |-
      Ten behoeve van de verdeling van de landelijke component proefschriften en ontwerperscertificaten over de
      universiteiten wordt het aantal proefschriften per universiteit onderscheiden naar:
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.10
  - number: 2.10.2.a
    text: het aantal proefschriften betreffende een wetenschapsgebied met een laag bekostigingsniveau, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.10
  - number: 2.10.2.b
    text: het aantal proefschriften betreffende een wetenschapsgebied met een hoog bekostigingsniveau.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.10
  - number: 2.10.3
    text: |-
      Het aantal per universiteit te bekostigen proefschriften bedraagt de som van het aantal proefschriften
      betreffende een wetenschapsgebied met een laag bekostigingsniveau en het aantal proefschriften betreffende een
      wetenschapsgebied met een hoog bekostigingsniveau, nadat deze zijn vermenigvuldigd met 1 onderscheidenlijk 2.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.10
  - number: 2.10.4
    text: |-
      Het aantal per universiteit te bekostigen ontwerperscertificaten bedraagt het aantal ontwerperscertificaten aan een
      universiteit, nadat dat aantal is vermenigvuldigd met 5/3.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.10
  - number: 2.10.5
    text: |-
      Voor de bepaling van de in het eerste lid genoemde aantallen wordt uitgegaan van de gegevens die door de
      desbetreffende universiteit vergezeld van een verklaring van een accountant aan Onze minister worden verstrekt
      uiterlijk op 1 maart van het voorafgaande begrotingsjaar. De universiteit geeft bij het leveren van de gegevens aan
      op welk wetenschapsgebied een proefschrift betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.10
  - number: 2.10.6
    text: |-
      De landelijke component proefschriften en ontwerperscertificaten wordt over de universiteiten verdeeld naar rato
      van het aantal proefschriften, berekend op grond van het derde lid, en het aantal ontwerperscertificaten, berekend
      op grond van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.10
  - number: '2.11'
    text: |-
      De verdeling van de landelijke component afbouw dynamisering Smart Mix over de universiteiten wordt bij
      ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.11
  - number: '2.12'
    text: |-
