        paragraaf: '1'
  - number: 2.13.2
    text: |-
      Van de bedragen, bedoeld in het eerste lid, wordt een bedrag verdeeld op basis van de volgende percentages per
      universiteit:







                    a.


                    de openbare universiteit te Leiden:


                    7,492%,




                    b.


