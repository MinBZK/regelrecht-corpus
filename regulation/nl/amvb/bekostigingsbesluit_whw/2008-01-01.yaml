    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip worden in afwijking van de [artikelen 2.6a][ref1] en
      [2.9][ref2] de getuigschriften van het met goed gevolg afgelegd afsluitend examen van een masteropleiding in het
      wetenschappelijk onderwijs aangemerkt als getuigschriften van het met goed gevolg afgelegd afsluitend examen van
      een ongedeelde opleiding in het wetenschappelijk onderwijs, indien uit het Centraal register inschrijving blijkt


