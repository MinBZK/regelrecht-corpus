      dat een student voor een ongedeelde opleiding was ingeschreven in een van de vijf studiejaren die voorafgaan aan
      het studiejaar dat eindigt in het tweede kalenderjaar voorafgaand aan het begrotingsjaar, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel5.28
  - number: 5.28.b
    text: |-
      dat aan die student in het studiejaar dat eindigt in het tweede kalenderjaar voorafgaand aan het begrotingsjaar, en
      in de vijf daaraan voorafgaande studiejaren geen getuigschrift van een bacheloropleiding in het hoger onderwijs of
      van een kandidaatsexamen in het wetenschappelijk onderwijs is uitgereikt.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel5.28
  - number: 5.29.1
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip bevat de rijksbijdrage van de openbare universiteit te Utrecht,
      de openbare universiteit te Enschede en de openbare universiteit te Rotterdam naast de onderdelen, bedoeld in
      artikel 2.4, een onderdeel internationaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel5.29
  - number: 5.29.2
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip wordt door Onze minister in overeenstemming met het
      desbetreffende onderdeel van de voor het desbetreffende begrotingsjaar vastgestelde rijksbegroting ten behoeve
      van de universiteiten de omvang vastgesteld van de landelijk voor het deel internationaal onderwijs van de
      rijksbijdrage van de universiteiten beschikbare middelen.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel5.29
  - number: '5.30'
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip worden de bedragen voor de universiteiten, bedoeld in artikel
      5.29, door Onze minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel5.30
  - number: 5.31.1
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip bevat de rijksbijdrage van de Open Universiteit naast de
      onderdelen, bedoeld in artikel 4.1, een onderdeel internationaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel5.31
  - number: 5.31.2
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip stelt Onze minister ten behoeve van het eerstvolgende
      kalenderjaar voor de Open Universiteit de omvang vast van het deel internationaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel5.31
