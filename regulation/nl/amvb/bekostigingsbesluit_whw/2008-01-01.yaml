  - number: 2.13.1
    text: |-
      Uit de landelijke component toponderzoekscholen, vastgesteld op grond van [artikel 2.4][ref1], verdeelt Onze
      minister na advies van de Nederlandse organisatie voor wetenschappelijk onderzoek bedragen over universiteiten ten
      behoeve van toponderzoekscholen. Bij haar advies betrekt de Nederlandse organisatie voor wetenschappelijk onderzoek
      in ieder geval de kwaliteit van het onderzoek.


