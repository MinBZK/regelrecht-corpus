    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.13
  - number: 2.13.3
    text: |-
      Indien in een begrotingsjaar het totaal van de bedragen, bedoeld in het eerste lid, kleiner is dan de landelijke
      component toponderzoekscholen, wordt het resterende bedrag over de universiteiten verdeeld volgens de in
      [artikel 2.12][ref1] genoemde percentages.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.13a.1
    text: Het bedrag strategische overwegingen van de Open Universiteit bedraagt 4,1 miljoen euro.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.13a
  - number: 2.13a.2
    text: |-
      De landelijke component strategische overwegingen voor een begrotingsjaar is gelijk aan het na toepassing van de
      [artikelen 2.9 tot en met 2.13][ref1] en het eerste lid voor dat begrotingsjaar resterende landelijk beschikbare
      onderzoekdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.13a
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.14.1
    text: |-
      Onverminderd [artikel 2.16][ref1] wordt de landelijke component strategische overwegingen, voor een begrotingsjaar
      vastgesteld op grond van [artikel 2.4][ref2], over de universiteiten verdeeld op basis van de omvang van de
      component strategische overwegingen per universiteit in het voorafgaande begrotingsjaar, met inachtneming van het
      tweede tot en met zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.14.2
    text: |-
      Ten behoeve van de verdeling van de landelijke component strategische overwegingen over de universiteiten worden
      het bedrag strategische overwegingen plus en het bedrag compensatie onderzoek onderscheiden.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.14
  - number: 2.14.3
    text: |-
      Het bedrag strategische overwegingen plus omvat de op grond van [artikel 2.4][ref1] vastgestelde component
      strategische overwegingen, verhoogd met de op grond van [artikel 2.4][ref2] vastgestelde component basisvoorziening
      onderzoek en verminderd met 15% van het op grond van [artikel 2.4][ref3] vastgestelde onderzoekdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.14.4
    text: |-
      Het bedrag compensatie onderzoek omvat de op grond van [artikel 2.4][ref1] vastgestelde component basisvoorziening
      onderzoek verminderd met een bij ministeriële regeling vast te stellen percentage van het op grond van
      [artikel 2.4][ref2] vastgestelde onderzoekdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.14.5
    text: |-
      Het bedrag strategische overwegingen plus wordt over de universiteiten verdeeld naar rato van de omvang van het
      bedrag strategische overwegingen plus per universiteit in het voorafgaande begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.14
  - number: 2.14.6
    text: |-
      Het bedrag compensatie onderzoek wordt over de universiteiten verdeeld naar rato van de omvang van het bedrag
      compensatie onderzoek per universiteit in het voorafgaande begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.14
  - number: 2.14.7
    text: |-
      De component strategische overwegingen per universiteit is het bedrag per universiteit, bedoeld in het vijfde lid,
      verminderd met het bedrag per universiteit, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.14
  - number: 2.15.1
    text: |-
      In het hoger onderwijs- en onderzoekplan wordt door Onze minister een aanduiding gegeven van de wetenschapsgebieden
      waaraan prioriteit en posterioriteit moet worden gegeven.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.15
  - number: 2.15.2
    text: |-
      Indien uit de instellingsplannen, bedoeld in [artikel 2.2][ref1] van de wet, of anderszins blijkt, dat
      de universiteiten naar het oordeel van Onze minister onvoldoende rekening houden met de prioriteit- en
      posterioriteitstelling, bedoeld in het eerste lid, wordt daarover en over de mogelijke gevolgen voor de bekostiging
      van de universiteiten overleg gevoerd als bedoeld in [artikel 3.1][ref2] van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel3
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '3'
  - number: 2.16.1
    text: |-
      Indien het overleg, bedoeld in [artikel 2.15, tweede lid][ref1], daartoe aanleiding geeft, kan Onze minister, met
      inachtneming van [artikel 2.6a, derde lid, van de wet][ref2] besluiten tot herverdeling van middelen, behorend tot
      de component strategische overwegingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
  - number: 2.16.2
    text: |-
      Een besluit tot herverdeling als bedoeld in het eerste lid, wordt niet genomen dan nadat Onze minister daarover
      overleg heeft gepleegd als bedoeld in [artikel 3.1 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel3
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '3'
  - number: 2.16.3
    text: |-
      Een besluit tot herverdeling kan ten hoogste drie procent van de component strategische overwegingen per
      universiteit voor een begrotingsjaar betreffen.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.16
  - number: 2.16a
    text: |-
      Onze minister besluit op welk niveau een wetenschapsgebied als bedoeld in [artikel 2.10][ref1] zal worden
      bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.16a
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.16b
    text: |-
      De Open Universiteit ontvangt jaarlijks vanwege de bijdrage aan de innovatie van het hoger onderwijs, bedoeld in
      [artikel 1.3, derde lid, van de wet][ref1], een bedrag van 6,9 miljoen euro.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.16b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 2.17.1
    text: 'Het deel leraartraject van een universiteit bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.17
  - number: 2.17.1.a
    text: een component basisvoorziening leraartraject, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.17
  - number: 2.17.1.b
    text: een component inschrijvingen leraartraject en getuigschriften.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.17
  - number: 2.17.2
    text: |-
      Voor de toepassing van deze paragraaf wordt onder universiteit verstaan een universiteit waaraan een of
      meer masteropleidingen als bedoeld in het derde lid, onderdelen a, b en c, dan wel een of meer universitaire
      eerstegraads lerarenopleidingen als bedoeld in het derde lid, onderdeel e, zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.17
  - number: 2.17.3
    text: |-
      Voor de toepassing van deze paragraaf wordt onder inschrijving leraartraject verstaan de eerste maal dat een
      student of extraneus blijkens het Centraal register inschrijving aan een universiteit is ingeschreven voor:
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.17
  - number: 2.17.3.a
    text: |-
      een masteropleiding, bedoeld in [artikel 7.4a, derde lid, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 2.17.3.b
    text: |-
      een masteropleiding waaraan een afstudeerrichting gericht op het beroep van leraar is verbonden, voor zover een
      student binnen die opleiding onderwijs gericht op het beroep van leraar volgt,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.17
  - number: 2.17.3.c
    text: |-
      een masteropleiding op het gebied van onderwijs voor zover die opleiding gericht is op het beroep van leraar en een
      student binnen die opleiding onderwijs gericht op het beroep van leraar volgt,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.17
  - number: 2.17.3.d
    text: |-
      een ongedeelde opleiding waaraan een afstudeerrichting gericht op het beroep van leraar is verbonden en een student
      binnen die opleiding onderwijs aan die afstudeerrichting volgt, of
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.17
  - number: 2.17.3.e
    text: |-
      een universitaire eerstegraads lerarenopleiding, bedoeld in [artikel 18.16 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
  - number: 2.18.1
    text: |-
      Uit het landelijk beschikbare deel leraartraject, vastgesteld op grond van [artikel 2.4][ref1], wordt aan de
      landelijke component basisvoorziening leraartraject een bedrag van 2,1 miljoen euro toebedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.18.2
    text: |-
      De landelijke component basisvoorziening leraartraject wordt als volgt over de universiteiten verdeeld:






                    a. de openbare universiteit te Leiden:


                    €  300 000,




                    b. de openbare universiteit te Groningen:


                    €  300 000,




                    c. de openbare universiteit te Amsterdam:


                    €  420 000,




                    d. de openbare universiteit te Utrecht:


                    €  300 000,




                    e. de openbare universiteit te Delft:


                    €   60 000,




                    f. de openbare universiteit te Eindhoven:


                    €   60 000,




                    g. de openbare universiteit te Enschede:


                    €   60 000,




                    h. de bijzondere universiteit te Amsterdam:


                    €  300 000, en




                    i. de bijzondere universiteit te Nijmegen:


                    €  300 000.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.18
  - number: 2.19.1
    text: |-
      De landelijke component inschrijvingen leraartraject en getuigschriften, vastgesteld op grond van
      [artikel 2.4][ref1], wordt over de universiteiten verdeeld op basis van het aantal inschrijvingen
      leraartraject en het aantal door de universiteit uitgereikte getuigschriften van de opleidingen, bedoeld in
      [artikel 2.17, derde lid][ref2], voor zover dat getuigschrift leidt tot de bevoegdheid van leraar voortgezet
      onderwijs van de eerste graad.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.19.2
    text: |-
      Voor de bepaling van de in het eerste lid bedoelde aantallen wordt uitgegaan van de gegevens die door de
      desbetreffende universiteit aan Onze minister worden verstrekt. Deze gegevens gaan vergezeld van een verklaring van
      een accountant.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.19
  - number: 2.20.1
    text: 'De component inschrijvingen leraartraject en getuigschriften per universiteit omvat de som van:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.20
  - number: 2.20.1.a
    text: het aantal inschrijvingen leraartraject in de telperiode, vermenigvuldigd met een bedrag van € 650, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.20
  - number: 2.20.1.b
    text: het aantal getuigschriften in de telperiode, vermenigvuldigd met een bedrag van € 2 600.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.20
  - number: 2.20.2
    text: |-
      De telperiode, bedoeld in het eerste lid, is de periode van 1 oktober van het tweede kalenderjaar voorafgaand aan
      het begrotingsjaar tot 1 oktober van het kalenderjaar voorafgaand aan het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.20
  - number: 2.20.3
    text: |-
      Indien het totaal van de sommen, bedoeld in het eerste lid, de landelijke component, bedoeld in
      [artikel 2.19, eerste lid][ref1], overschrijdt, worden door Onze minister voor het desbetreffende begrotingsjaar de
      sommen van de afzonderlijke universiteiten vermenigvuldigd met een factor, zodanig dat het totaal van de sommen van
      de universiteiten en de landelijke component aan elkaar gelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.20.4
    text: |-
      Onze minister doet gelijktijdig met de in [artikel 2.7, tweede lid, van de wet][ref1] bedoelde bekendmaking van de
      vastgestelde rijksbijdrage mededeling van de op grond van het derde lid toe te passen factor.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
  - number: 2.21.1
    text: 'Het deel academisch ziekenhuis van een universiteit waaraan een academisch ziekenhuis is verbonden, bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.21
  - number: 2.21.1.a
    text: 'een component rente en afschrijvingen, gevormd door de som van:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.21
  - number: 2.21.1.a.1°
    text: een gedeelte 1988 tot en met 1992,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.21
  - number: 2.21.1.a.2°
    text: een gedeelte 1993 tot en met 1996,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.21
  - number: 2.21.1.a.3°
    text: een gedeelte 1997 tot en met 2003, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.21
  - number: 2.21.1.a.4°
    text: een gedeelte vanaf 2004.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.21
  - number: 2.21.1.b
    text: een component basisvoorziening, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.21
  - number: 2.21.1.c
    text: een component onderwijs en onderzoek.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.21
  - number: 2.21.2
    text: |-
      Voor de toepassing van deze paragraaf wordt onder universiteit verstaan een universiteit waaraan een academisch
      ziekenhuis is verbonden.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.21
  - number: '2.22'
    text: |-
      Uit het landelijk beschikbare deel academische ziekenhuizen, vastgesteld op grond van [artikel 2.4][ref1], wordt
      aan de rijksbijdrage van de openbare universiteit te Maastricht en van de bijzondere universiteit te Amsterdam
      een bij ministeriële regeling vast te stellen bedrag toegevoegd ten behoeve van de klinische ondersteuning van het
      wetenschappelijk onderwijs en onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.23.1
    text: |-
      Het gedeelte 1988 tot en met 1992 van de component rente en afschrijvingen van een universiteit omvat de som van de
      vergoedingen die op grond van het tweede lid zijn berekend over het in [bijlage 1][ref1] bij dit besluit vermelde
      OCenW-deel van de investeringsbedragen voor de projecten van het desbetreffende academisch ziekenhuis. De projecten
      zijn ingedeeld in de categorieën bouw, startkosten, bouwrente, en kleine werken.


      [ref1]: https://wetten.overheid.nl/BWBR0006338
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0006338
  - number: 2.23.2
    text: 'De vergoeding per categorie, bedoeld in het eerste lid, is samengesteld uit:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.23
  - number: 2.23.2.a
    text: |-
      het jaarlijkse afschrijvingsbedrag, genoemd in [bijlage 1][ref1], totdat het investeringsbedrag, genoemd in die
      bijlage, volledig is vergoed, en


      [ref1]: https://wetten.overheid.nl/BWBR0006338
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0006338
  - number: 2.23.2.b
    text: |-
      de rente, bedoeld in het vierde lid, voor het desbetreffende jaar, over het verschil tussen het investeringsbedrag,
      genoemd in [bijlage 1][ref1], en de gecumuleerde afschrijvingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006338
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0006338
  - number: 2.23.3
    text: |-
      Onder de gecumuleerde afschrijvingen, bedoeld in het tweede lid, met betrekking tot enig begrotingsjaar wordt
      verstaan het gecumuleerde afschrijvingsbedrag (stand 1996), genoemd in [bijlage 1][ref1], vermeerderd met het
      product van het afschrijvingsbedrag, genoemd in die bijlage, en het aantal jaren dat sinds 1996 is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006338
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0006338
  - number: 2.23.4
    text: |-
      De voor de onderscheiden academische ziekenhuizen in [bijlage 1][ref1] opgenomen rentepercentages gelden voor het
      tijdvak 1997 tot en met 2002. Vanaf het jaar 2003 wordt het rentepercentage telkens voor een tijdvak van 10 jaar
      bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006338
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0006338
  - number: 2.24.1
    text: |-
      Het gedeelte 1993 tot en met 1996 van de component rente en afschrijvingen van een universiteit omvat de som van de
      vergoedingen die op grond van het tweede lid zijn berekend over het in [bijlage 2][ref1] bij dit besluit vermelde
      OCenW-deel van de investeringsbedragen voor de projecten van het desbetreffende academisch ziekenhuis. De projecten
      zijn ingedeeld in de categorieën bouw, startkosten, en kleine werken.


      [ref1]: https://wetten.overheid.nl/BWBR0006338
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0006338
  - number: 2.24.2
    text: 'De vergoeding per categorie, bedoeld in het eerste lid, is samengesteld uit:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.24
  - number: 2.24.2.a
    text: |-
      het uit [bijlage 2][ref1] jaarlijks te berekenen afschrijvingsbedrag, totdat het investeringsbedrag, genoemd in die
      bijlage, volledig is vergoed, en


      [ref1]: https://wetten.overheid.nl/BWBR0006338
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0006338
  - number: 2.24.2.b
    text: |-
      de uit [bijlage 2][ref1] te berekenen rentevergoeding over het verschil tussen het investeringsbedrag, genoemd in
      die bijlage, en de gecumuleerde afschrijvingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006338
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0006338
  - number: 2.24.3
    text: |-
      [Artikel 2.23, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.24.4
    text: |-
      De voor de onderscheiden jaren in [bijlage 2][ref1] opgenomen rentepercentages gelden voor een tijdvak van 10
      jaar. Na die periode wordt het rentepercentage telkens voor een tijdvak van 10 jaar bij ministeriële regeling
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006338
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0006338
  - number: 2.25.1
    text: |-
      Het gedeelte 1997 tot en met 2003 van de component rente en afschrijvingen van een universiteit omvat de som van de
      vergoedingen die op grond van het tweede lid zijn berekend over het in de besluiten inzake bouwvolume, bedoeld in
      het zesde lid, vermelde OCenW-deel van de investeringsbedragen voor de projecten van het desbetreffende academisch
      ziekenhuis. De projecten zijn ingedeeld in de categorieën bouw, startkosten, en kleine werken.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25
  - number: 2.25.2
    text: 'De vergoeding per project, bedoeld in het eerste lid, is samengesteld uit:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25
  - number: 2.25.2.a
    text: |-
      het jaarlijks over het investeringsbedrag te berekenen afschrijvingsbedrag, totdat het investeringsbedrag volledig
      is vergoed, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25
  - number: 2.25.2.b
    text: |-
      de jaarlijks te berekenen rentevergoeding over het verschil tussen het investeringsbedrag en de gecumuleerde
      afschrijvingen.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25
  - number: 2.25.3
    text: |-
      Onder gecumuleerde afschrijvingen, bedoeld in het tweede lid, met betrekking tot enig begrotingsjaar wordt verstaan
      de som van de totaal vergoede afschrijvingsbedragen met betrekking tot het OCenW-deel van een investeringsbedrag
      sedert de vaststelling van het besluit inzake bouwvolume waarin dat investeringsbedrag is opgenomen, met inbegrip
      van het afschrijvingsbedrag voor dat begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25
  - number: 2.25.4
    text: |-
      Het afschrijvingspercentage voor de in het eerste lid genoemde categorieën bedraagt onderscheidenlijk 3,2%, 2,5%
      en 5%.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25
  - number: 2.25.5
    text: |-
      Bij ministeriële regeling wordt ten behoeve van de investeringen voor academische ziekenhuizen ten behoeve van
      een bepaald begrotingsjaar een rentepercentage vastgesteld voor een tijdvak van 10 jaar. Na die periode wordt het
      rentepercentage telkens voor een tijdvak van 10 jaar bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25
  - number: 2.25a.1
    text: |-
      Het gedeelte vanaf 2004 van de component rente en afschrijvingen van een universiteit omvat de som van de
      vergoedingen die op grond van het tweede lid zijn berekend over het in de besluiten inzake bouwvolume, bedoeld in
      het zesde lid, vermelde OCenW-deel van de investeringsbedragen voor het desbetreffende academisch ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25a
  - number: 2.25a.2
    text: 'De vergoeding, bedoeld in het eerste lid, is samengesteld uit:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25a
  - number: 2.25a.2.a
    text: |-
      het jaarlijks over het investeringsbedrag te berekenen afschrijvingsbedrag, totdat het investeringsbedrag volledig
      is vergoed, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25a
  - number: 2.25a.2.b
    text: |-
      de jaarlijks te berekenen rentevergoeding over het verschil tussen het investeringsbedrag en de gecumuleerde
      afschrijvingen.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25a
  - number: 2.25a.3
    text: |-
      Onder gecumuleerde afschrijvingen, bedoeld in het tweede lid, met betrekking tot enig begrotingsjaar wordt verstaan
      de som van de totaal vergoede afschrijvingsbedragen met betrekking tot het OCenW-deel van een investeringsbedrag
      sedert de vaststelling van het besluit inzake bouwvolume waarin dat investeringsbedrag is opgenomen, met inbegrip
      van het afschrijvingsbedrag voor dat begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25a
  - number: 2.25a.4
    text: Het afschrijvingspercentage voor het investeringsbedrag bedraagt 3,36%.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25a
  - number: 2.25a.5
    text: |-
      Bij ministeriële regeling wordt ten behoeve van de investeringen voor academische ziekenhuizen ten behoeve van
      een bepaald begrotingsjaar een rentepercentage vastgesteld voor een tijdvak van 10 jaar. Na die periode wordt het
      rentepercentage telkens voor een tijdvak van 10 jaar bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25a
  - number: 2.25a.6
    text: |-
      Jaarlijks voor 1 november nemen Onze minister en Onze Minister van Volksgezondheid, Welzijn en Sport een besluit
      waarin het voor het daaropvolgende begrotingsjaar toegestane bouwvolume wordt vastgesteld. In dat besluit worden
      in elk geval opgenomen het investeringsbedrag per academisch ziekenhuis en het OCenW-deel daarvan. Indien het
      investeringsbedrag ten behoeve van een academisch ziekenhuis in het begrotingsjaar, bedoeld in de eerste volzin,
      niet of niet volledig is besteed, kan het besluit worden bijgesteld.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.25a
  - number: 2.26.1
    text: |-
      De landelijke component basisvoorziening voor een begrotingsjaar wordt bepaald op 75 procent van het na toepassing
      van de[ artikelen 2.22 tot en met 2.25][ref1] voor dat begrotingsjaar resterende landelijk beschikbare deel
      academische ziekenhuizen.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.26.2
    text: |-
      Uit de landelijke component basisvoorziening, bedoeld in het eerste lid, wordt voor elke universiteit een bedrag
      van € 13 613 400 toebedeeld aan de component basisvoorziening van die universiteit.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.26
  - number: 2.26.3
    text: |-
      Het na toepassing van het tweede lid resterende gedeelte van de landelijke component basisvoorziening wordt over
      de universiteiten verdeeld naar evenredigheid van het aantal van de hieronder opgenomen vierkante meters van een
      academisch ziekenhuis, verbonden aan de hieronder genoemde universiteit:
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.26
  - number: 2.26.3.a
    text: de openbare universiteit te Leiden 102.189,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.26
  - number: 2.26.3.b
    text: de openbare universiteit te Groningen 120.341,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.26
  - number: 2.26.3.c
    text: de openbare universiteit te Amsterdam 154.733,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.26
  - number: 2.26.3.d
    text: de openbare universiteit te Utrecht 120.947,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.26
  - number: 2.26.3.e
    text: de openbare universiteit te Rotterdam 121.102,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.26
  - number: 2.26.3.f
    text: de openbare universiteit te Maastricht 72.567,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.26
  - number: 2.26.3.g
    text: de bijzondere universiteit te Amsterdam 91.629, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.26
  - number: 2.26.3.h
    text: de bijzondere universiteit te Nijmegen 99.675.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.26
  - number: 2.27.1
    text: |-
      De landelijke component onderwijs en onderzoek voor een begrotingsjaar wordt bepaald op 25 procent van het na
      toepassing van de[ artikelen 2.22 tot en met 2.25][ref1] voor dat begrotingsjaar resterende landelijk beschikbare
      deel academische ziekenhuizen.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.27.2
    text: |-
      Van het bedrag dat beschikbaar is voor de landelijke component onderwijs en onderzoek wordt 30 procent gelijkelijk
      verdeeld over de universiteiten.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.27
  - number: 2.27.3
    text: |-
      Het na toepassing van het tweede lid resterende bedrag wordt over de universiteiten verdeeld op de wijze als
      bepaald in het vierde tot en met zesde lid.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.27
  - number: 2.27.4
    text: |-
      Van het in het derde lid bedoelde bedrag wordt 20 procent over de universiteiten verdeeld naar rato van
      het gemiddeld aantal te bekostigen eerstejaars dat in het tweede en derde kalenderjaar voorafgaand aan het
      begrotingsjaar aan de opleiding voor het beroep van arts van de universiteit ingeschreven staat.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.27
  - number: 2.27.5
    text: |-
      Van het in het derde lid bedoelde bedrag wordt 30 procent over de universiteiten verdeeld naar rato van het
      gemiddeld aantal door de universiteit uitgereikte getuigschriften van het afsluitend examen verbonden aan de
      opleiding voor het beroep van arts in het studiejaar dat eindigt in het tweede, derde en vierde kalenderjaar
      voorafgaand aan het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.27
  - number: 2.27.6
    text: |-
      Van het in het derde lid bedoelde bedrag wordt 50 procent over de universiteiten verdeeld naar rato van het
      gemiddeld aantal proefschriften aan de faculteit der geneeskunde in het tweede, derde en vierde kalenderjaar
      voorafgaand aan het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.27
  - number: '2.28'
    text: |-
      Indien ten aanzien van een universiteit [artikel 2.25, zesde lid derde volzin][ref1], voor een of meer
      begrotingsjaren toepassing heeft gevonden, worden de teveel toegekende vergoedingen voor rente en afschrijvingen
      met betrekking tot het OCenW-deel van investeringsbedragen, bedoeld in genoemd artikel, over een of meer
      begrotingsjaren verrekend met de component rente en afschrijvingen van het deel academisch ziekenhuis van de
      desbetreffende universiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '2.30'
    text: |-
      Het landelijk investeringsdeel, door Onze minister vastgesteld op grond van [artikel 2.4][ref1], wordt verdeeld
      over de universiteiten naar evenredigheid van de som van het onderwijsdeel, het onderzoekdeel en in voorkomende
      gevallen het deel universitaire eerstegraads lerarenopleidingen per universiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '3.1'
    text: |-
      De bepalingen van dit hoofdstuk hebben betrekking op de algemene berekeningswijze voor het exploitatiedeel, het
      huisvestingsdeel en het deel ontwerp en ontwikkeling hbo van de rijksbijdrage van de hogescholen.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.1
  - number: 3.2.1
    text: |-
      In overeenstemming met het desbetreffende onderdeel van de voor het desbetreffende begrotingsjaar vastgestelde
      rijksbegroting, wordt jaarlijks door Onze minister de omvang vastgesteld van het landelijk voor de hogescholen
      beschikbare exploitatiedeel.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.2
  - number: 3.2.2
    text: |-
      Het landelijk beschikbare exploitatiedeel wordt over de hogescholen verdeeld op basis van de onderwijsvraag van de
      door de desbetreffende hogeschool aangeboden opleidingen.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.2
  - number: 3.3.1
    text: |-
      De onderwijsvraag van een hogeschool wordt per opleiding of groep van opleidingen die door de desbetreffende
      hogeschool worden aangeboden, bepaald door de onderwijsvraagfactor, bedoeld in het tweede lid, te vermenigvuldigen
      met het aantal studenten dat op 1 oktober van het tweede kalenderjaar voorafgaand aan het begrotingsjaar aan
      een hogeschool ingeschreven staat. Bij ministeriële regeling wordt de indeling van de groepen van opleidingen
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.3
  - number: 3.3.2
    text: |-
      De onderwijsvraagfactor wordt berekend met de volgende formule: In deze formule wordt verstaan onder: A: het
      aantal personen aan wie blijkens het Centraal register inschrijving een getuigschrift is uitgereikt voorzover
      deze personen aan die hogeschool een inschrijving hebben gehad als bedoeld in het eerste lid, op meer dan 2,25
      x S peildata, waarbij S de factor studielast is die op de opleiding waarvoor het getuigschrift is uitgereikt van
      toepassing is; U: het aantal studenten op 1 oktober van het derde kalenderjaar voorafgaand aan het begrotingsjaar
      dat op 1 oktober van het tweede kalenderjaar voorafgaand aan het begrotingsjaar geen student is aan die hogeschool
      en aan wie in die periode blijkens het Centraal register inschrijving door die hogeschool geen getuigschrift is
      uitgereikt. Niet tot U wordt gerekend: 1°. de student die in deze periode is overleden; 2°. degene die: a. als
      student was ingeschreven voor een opleiding die in deze periode is overgegaan naar een andere hogeschool en b. die
      op 1 oktober van het tweede kalenderjaar voorafgaand aan het begrotingsjaar voor de desbetreffende opleiding bij
      die andere hogeschool als student is ingeschreven; S: de factor studielast, waarbij S gelijk is aan het quotiënt
      van de studielast van de opleiding en 240. Ja: a. voor de onder A bedoelde personen die op 1 oktober van het derde
      kalenderjaar voorafgaand aan het begrotingsjaar niet als student aan de betreffende hogeschool waren ingeschreven:
      per persoon 4,5 voor degene aan wie in de periode tussen 1 augustus 1991 en 1 oktober van het derde kalenderjaar
      voorafgaand aan het begrotingsjaar door die hogeschool een getuigschrift is uitgereikt en 1,35 in de overige
      gevallen, b. voor de onder A bedoelde personen bij wie sprake is van herinstroom: het aantal peildata waarop zij
      vanaf het moment van herinstroom zonder onderbreking aan de betreffende hogeschool zijn ingeschreven geweest, per
      persoon vermeerderd met 4,5 voor degene aan wie in de periode tussen 1 augustus 1991 en het moment van herinstroom
      door die hogeschool een getuigschrift is uitgereikt en met 1,35 in de overige gevallen, en c. voor de overige
      onder A bedoelde personen het aantal peildata waarop de onder A bedoelde personen aan de betreffende hogeschool als
      student zijn ingeschreven geweest. Ju: a. voor de onder U bedoelde studenten bij wie sprake is van herinstroom: het
      aantal peildata waarop zij vanaf het moment van herinstroom zonder onderbreking aan de betreffende hogeschool zijn
      ingeschreven geweest, per student vermeerderd met 4,5 voor degene aan wie in de periode tussen 1 augustus 1991 en
      het moment van herinstroom door die hogeschool een getuigschrift is uitgereikt en met 1,35 in de overige gevallen,
      en b. voor de overige onder U bedoelde studenten het aantal peildata waarop de onder U bedoelde studenten aan de
      betrokken hogeschool als student zijn ingeschreven geweest.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.3
  - number: 3.3.3
    text: |-
      Onder het aantal studiejaren van afgestudeerden en uitvallers, bedoeld in tweede lid, zijn tevens begrepen de
      studiejaren gedurende welke zij aan een andere hogeschool als student zijn ingeschreven geweest, voor zover het
      betreft een opleiding die naar de betrokken hogeschool is overgegaan en voor zover deze studenten in het studiejaar
      voorafgaand aan de overgang van de opleiding aan de andere hogeschool voor die opleiding zijn ingeschreven geweest.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.3
  - number: 3.3.4
    text: |-
      Bij de toepassing van het tweede lid wordt verstaan onder: herinstroom: de situatie waarin een persoon op
      een peildatum na 30 september 1999 als student aan een hogeschool ingeschreven staat waar deze op de daaraan
      voorafgaande peildatum niet stond ingeschreven maar wel op een eerdere peildatum na 31 juli 1991; peildatum:
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.3
  - number: 3.3.4.a
    text: 15 september voor de studiejaren tot en met het studiejaar 1992/1993, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.3
  - number: 3.3.4.b
    text: 1 oktober voor de studiejaren vanaf het studiejaar 1993/1994.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.3
  - number: 3.3.5
    text: |-
      De in het tweede lid onder A bedoelde gegevens ten aanzien van de getuigschriften hebben betrekking op het tijdvak
      van 12 maanden voorafgaand aan het tijdstip genoemd in het eerste lid. De in het tweede lid onder A bedoelde
      gegevens ten aanzien van de studenten hebben betrekking op de situatie per 1 oktober van het derde kalenderjaar
      voorafgaand aan het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.3
  - number: 3.3.6
    text: |-
      Indien de in het tweede lid onder A en U bedoelde gegevens ten aanzien van een groep van opleidingen die door de
      desbetreffende hogeschool wordt aangeboden, in een tijdvak als bedoeld in het tweede en vijfde lid, beide gelijk
      zijn aan nul, is ten aanzien van die groep [artikel 3.5][ref1] van overeenkomstige toepassing in het tweede op
      bedoeld tijdvak volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel3
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.3a.1
    text: |-
      In dit artikel wordt onder opleiding verstaan: een opleiding of lerarenopleiding op het gebied van de kunst, dan
      wel een groep van die opleidingen. Bij ministeriële regeling wordt de indeling van de groepen van opleidingen
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.3a
  - number: 3.3a.2
    text: |-
      In afwijking van [artikel 3.3][ref1] wordt de onderwijsvraag van een opleiding berekend met de formule: I +
      ½ x A. In deze formule wordt verstaan onder: I: het aantal studenten dat op 1 oktober van het tweede aan het
      begrotingsjaar voorafgaande kalenderjaar voor de desbetreffende opleiding is ingeschreven, met dien verstande dat
      niet worden meegeteld:


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel3
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.3a
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.3a.2.1°
    text: |-
      studenten die op meer dan vier peildata na 1 september 2000 voor de opleiding of dezelfde opleiding aan een andere
      hogeschool als student waren ingeschreven, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.3a
  - number: 3.3a.2.2°
    text: |-
      studenten die op enige peildatum tussen 1 augustus 1991 en 1 september 2000 als student waren ingeschreven voor de
      opleiding of dezelfde opleiding aan een andere hogeschool;
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.3a
  - number: 3.3a.3
    text: |-
      Voor de toepassing van dit artikel wordt bij ministeriële regeling bepaald welke opleidingen als dezelfde
      opleidingen worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.3a
  - number: '3.4'
    text: |-
      In afwijking van [artikel 3.3][ref1] wordt de onderwijsvraag voor de opleidingen, bedoeld in
      [artikel 7.3a, tweede lid, onder b][ref2], en [artikel 18.20 van de wet][ref3], bepaald op het aantal ingeschreven
      studenten op 1 oktober van het tweede aan het begrotingsjaar voorafgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '18'
  - number: 3.4a
    text: |-
      In afwijking van [artikel 3.3][ref1] wordt de onderwijsvraag voor de tweedegraads lerarenopleidingen verpleegkunde,
      de opleidingen tot verpleegkundige in de maatschappelijke gezondheidszorg, de opleidingen management in de zorg en
      de opleidingen van kader in de gezondheidszorg bepaald op het aantal ingeschreven studenten op 1 oktober van het
      tweede aan het begrotingsjaar voorafgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel3
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.4a
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '3.5'
    text: 'Voor de bepaling van de onderwijsvraag van een opleiding die:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.5
  - number: 3.5.a
    text: |-
      in het tweede kalenderjaar voorafgaande aan het begrotingsjaar voor het eerst in het Centraal register opleidingen
      is opgenomen, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.5
  - number: 3.5.b
    text: |-
      geen voortzetting vormt van een opleiding met gelijke studielast, wordt de onderwijsvraagfactor gesteld op de
      landelijk gemiddelde onderwijsvraagfactor. Deze berekening wordt toegepast tot en met het tweede begrotingsjaar
      volgend op het begrotingsjaar waarin de eerste getuigschriften, gelet op de studielast, kunnen worden uitgereikt.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      Voor de bepaling van de onderwijsvraag van een opleiding waarvan de registratie wordt beëindigd overeenkomstig
      [artikel 6.15 van de wet][ref1], ten aanzien waarvan [artikel 3.5][ref2] niet van toepassing is en die niet wordt
      voortgezet in een opleiding met gelijke studielast, wordt met betrekking tot de begrotingsjaren volgend op het
      derde begrotingsjaar waarin geen studenten zich voor het eerst inschrijven aan die opleiding, de laatstelijk voor
      deze opleiding vastgestelde onderwijsvraagfactor aangehouden, totdat de registratie is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel3
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0006338
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.7.1
    text: |-
      Uit het landelijk beschikbare exploitatiedeel kan aan hogescholen met opleidingen op het gebied van de kunst,
      lerarenopleidingen op het gebied van de kunst of opleidingen op het gebied van de gezondheidszorg een bij
      ministeriële regeling te bepalen bedrag worden toegekend. Het resterende landelijk beschikbare exploitatiedeel
      wordt evenredig met de in het tweede lid bedoelde gewogen onderwijsvraag verdeeld over de hogescholen.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.7
  - number: 3.7.2
    text: |-
      De gewogen onderwijsvraag van een hogeschool is gelijk aan het totaal van de uit de
      [artikelen 3.3 tot en met 3.6][ref1] voortvloeiende onderwijsvraag van de door de desbetreffende hogeschool
      aangeboden opleidingen, nadat deze voor bij ministeriële regeling aangewezen opleidingen is vermenigvuldigd met
      1,28.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel3
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '3.8'
    text: |-
      Onze minister maakt jaarlijks voor 1 juli aan de desbetreffende hogeschool bekend op welk niveau een opleiding die
      in dat kalenderjaar voor het eerst in het Centraal register opleidingen wordt opgenomen, zal worden bekostigd.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.8
  - number: 3.9.1
    text: |-
      In overeenstemming met het desbetreffende onderdeel van de voor het desbetreffende begrotingsjaar vastgestelde
      rijksbegroting, wordt jaarlijks door Onze minister de omvang vastgesteld van het landelijk voor de hogescholen
      beschikbare deel ontwerp en ontwikkeling hbo.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.9
  - number: 3.9.2
    text: |-
      De toevoeging aan de rijksbijdrage van een hogeschool vanwege het verrichten van ontwerp en ontwikkeling geschiedt
      naar rato van de som van het exploitatiedeel en het huisvestingsdeel per hogeschool.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.9
  - number: 3.12.1
    text: |-
      In overeenstemming met het desbetreffende onderdeel van de voor het desbetreffende begrotingsjaar vastgestelde
      rijksbegroting, wordt jaarlijks door Onze minister de omvang vastgesteld van het landelijk voor de hogescholen
      beschikbare huisvestingsdeel.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.12
  - number: 3.12.2
    text: |-
      Het landelijk beschikbare huisvestingsdeel wordt over de hogescholen verdeeld op basis van de in vierkante
      meters uitgedrukte ruimtebehoefte per hogeschool in het betreffende begrotingsjaar. De ruimtebehoefte wordt
      jaarlijks berekend door de onderwijsvraag van de hogeschool in het desbetreffende begrotingsjaar, bedoeld in
      de[ artikelen 3.3 tot en met 3.6][ref1] te vermenigvuldigen met de ruimtebehoeftenorm van de hogeschool. Bij
      ministeriële regeling wordt de ruimtebehoeftenorm per hogeschool vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel3
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.12.3
    text: |-
      Het huisvestingsdeel van een hogeschool omvat ten minste de normatieve uitgaven voor rente en aflossing ten gevolge
      van:
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.12
  - number: 3.12.3.a
    text: |-
      het bedrag dat door het instellingsbestuur aan het Rijk is betaald op grond van
      [artikel II van de Wet van 11 november 1993][ref1], Stb. 628,


      [ref1]: https://wetten.overheid.nl/BWBR0006250#ArtikelII
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0006250
        artikel: II
  - number: 3.12.3.b
    text: |-
      de schuld die resteert van het op 31 december 1993 nog uitstaande door het Rijk aan een instelling overgedragen
      leenbedrag ter zake van een investering waarvoor door het Rijk toestemming is verleend,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.12
  - number: 3.12.3.c
    text: |-
      de na 31 december 1993 resterende projectkosten voor een bouwproject in uitvoering dat op 31 december 1993 nog niet
      is opgeleverd, overeenkomstig de met het Rijk overeengekomen projectkosten en wijze van vergoeding en voorzover de
      kosten nog niet door het Rijk zijn vergoed.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.12
  - number: 3.12.4
    text: |-
      Het huisvestingsdeel van een hogeschool omvat tevens ten minste de vergoeding van de huurpenningen voor een gebouw,
      die door het instellingsbestuur worden betaald als verplichting voortvloeiend uit een huurovereenkomst die door
      het instellingsbestuur is gesloten vóór 17 november 1992, en waarvoor door het Rijk toestemming is verleend,
      onderscheidenlijk als verplichting uit een huurovereenkomst waarvan het instellingsbestuur het voornemen tot het
      sluiten daarvan vóór 17 november 1992 aan Onze minister heeft medegedeeld, en waarvoor door het Rijk toestemming is
      verleend. De vergoeding, bedoeld in de eerste volzin, wordt verleend tot de bedragen, perioden en condities zoals
      in de goedkeuring vermeld, doch uiterlijk tot en met 31 december 1997.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.12
  - number: 3.12.5
    text: |-
      De vergoeding van de normatieve uitgaven voor rente en aflossing, bedoeld in het derde lid, wordt verleend
      gedurende dertig jaar.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.12
  - number: 3.12.6
    text: |-
      De normatieve uitgaven voor rente en aflossing, bedoeld in het derde lid, worden berekend op de grondslag van 50%
      lineaire en 50% annuïtaire leningen, een rentevoet van 9% en een aflossingsperiode van dertig jaar.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.12
  - number: 3.13.1
    text: |-
      Ten behoeve van de verdeling van het landelijk beschikbaar huisvestingsdeel wordt de landelijke
      ruimtebehoefte vastgesteld. De landelijke ruimtebehoefte is het totaal van het aantal op grond van
      de[ artikelen 3.12, tweede lid][ref1], en [5.7][ref2] berekende vierkante meters.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel5
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006338
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 3.13.2
    text: |-
      Het huisvestingsdeel per hogeschool wordt voorlopig vastgesteld door het landelijk beschikbare huisvestingsdeel te
      vermenigvuldigen met de ruimtebehoefte van de hogeschool en te delen door de landelijke ruimtebehoefte.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.13
  - number: 3.13.3
    text: |-
      Indien het op grond van het tweede dan wel het vierde lid berekende huisvestingsdeel van een hogeschool lager of
      gelijk is aan de vergoedingen voor de uitgaven bedoeld in [artikel 3.12, derde en vierde lid][ref1], wordt het
      huisvestingsdeel van deze hogeschool definitief vastgesteld ter hoogte van die vergoedingen. De huisvestingsdelen
      van deze hogescholen en de ruimtebehoefte worden in mindering gebracht op respectievelijk het landelijk
      huisvestingsdeel en de landelijke ruimtebehoefte.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel3
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.13.4
    text: |-
      Het huisvestingsdeel van de hogeschool, waarvan het huisvestingsdeel nog niet definitief is vastgesteld, wordt
      opnieuw voorlopig vastgesteld door het na toepassing van het derde lid nog landelijk beschikbare huisvestingsdeel
      te vermenigvuldigen met de ruimtebehoefte van de hogeschool en te delen door de na toepassing van het derde lid
      resterende landelijke ruimtebehoefte.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.13
  - number: 3.13.5
    text: |-
      Het vierde lid wordt toegepast totdat het huisvestingsdeel minimaal het niveau bedraagt van de vergoedingen bedoeld
      in [artikel 3.12, derde en vierde lid][ref1]. De op dat moment berekende voorlopige huisvestingsdelen van alle
      resterende hogescholen worden definitief vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel3
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '4.1'
    text: 'De rijksbijdrage van de Open Universiteit is samengesteld uit:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.1
  - number: 4.1.a
    text: een deel basisvoorziening,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.1
  - number: 4.1.b
    text: een prestatiegebonden deel,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.1
  - number: 4.1.c
    text: een investeringsdeel, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.1
  - number: 4.1.d
    text: een deel uitkeringen na ontslag.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.1
  - number: 4.2.1
    text: |-
      Onze minister stelt jaarlijks ten behoeve van het eerstvolgende kalenderjaar voor de Open Universiteit de omvang
      vast van:
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.2
  - number: 4.2.1.a
    text: de beschikbare basisvoorziening, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.2
  - number: 4.2.1.b
    text: het prestatiegebonden deel.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Onze minister stelt voor ten hoogste 4 jaren de voor de Open Universiteit beoogde ontwikkeling van de rijksbijdrage
      vast, waarbij de in [artikel 4.3][ref1] bedoelde factoren de grondslag vormen voor de vaststelling van de beoogde
      ontwikkeling van het prestatiegebonden deel. Onze minister stelt de beoogde ontwikkeling van de rijksbijdrage vast
      voor 1 november van het jaar voorafgaand aan het tijdvak waarop die beoogde ontwikkeling betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel4
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.3
    text: |-
      Ten behoeve van de in het tweede lid bedoelde vaststelling zendt de Open Universiteit aan Onze minister voor 1
      juli van het jaar voorafgaand aan het tijdvak waarop de beoogde ontwikkeling van de rijksbijdrage betrekking heeft,
      haar voornemens betreffende de eerstvolgende 4 kalenderjaren ten aanzien van de in [artikel 4.3][ref1] bedoelde
      factoren. Onze minister kan de Open Universiteit verzoeken ten behoeve van de vaststelling nadere gegevens te
      overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel4
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.1
    text: |-
      Het prestatiegebonden deel, genoemd in [artikel 4.1, onderdeel b][ref1], omvat ten hoogste 20% van de totale
      rijksbijdrage van de Open Universiteit per jaar en wordt gebaseerd op:


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel4
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.1.a
    text: |-
      het door Onze minister voor het desbetreffende jaar in aanmerking genomen aantal bewijsstukken en getuigschriften,
      bedoeld in [artikel 7.11, eerste lid][ref1], van de wet, waarbij Onze minister tevens bepaalt dat een bepaald
      percentage van die bewijsstukken en getuigschriften wordt ontvangen door ingeschrevenen bij de Open Universiteit,
      die niet in het bezit zijn van een getuigschrift van een met goed gevolg afgelegd afsluitend examen van een
      universiteit of hogeschool, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 4.3.1.b
    text: |-
      de door Onze minister voor het desbetreffende jaar in aanmerking genomen activiteiten die de Open Universiteit
      verricht ten behoeve van de vernieuwing van het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.3
  - number: 4.3.2
    text: 'De activiteiten, bedoeld in het eerste lid onderdeel b, hebben in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.3
  - number: 4.3.2.a
    text: het bijdragen aan de kwaliteit van het onderwijs aan universiteiten en hogescholen,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.3
  - number: 4.3.2.b
    text: |-
      het bijdragen aan de verbetering van de organisatie en de inrichting van de onderwijsprogramma’s van universiteiten
      en hogescholen, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.3
  - number: 4.3.2.c
    text: |-
      de verbetering van de kwaliteit van het onderwijs en de organisatie en inrichting van de onderwijsprogramma’s van
      de Open Universiteit.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.3
  - number: 4.3.3
    text: |-
      De activiteiten, bedoeld in het tweede lid onderdeel a en b, worden verricht in samenwerkingsverbanden tussen de
      Open Universiteit en één of meer andere instellingen voor hoger onderwijs. De Open Universiteit besteedt jaarlijks
      ten minste € 6 806 700 aan de activiteiten, bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.3
  - number: 4.5.1
    text: |-
      Indien uit de jaarverslagen die betrekking hebben op de jaren van het tijdvak, bedoeld in
      [artikel 4.2, derde lid][ref1], blijkt dat minder bewijsstukken en getuigschriften zijn afgegeven of minder
      activiteiten zijn verricht dan door Onze minister op grond van [artikel 4.3][ref2] in aanmerking zijn genomen,
      besluit Onze minister tot vermindering van de beoogde ontwikkeling van het prestatiegebonden deel voor het
      eerstvolgende tijdvak waarvoor de beoogde ontwikkeling van de rijksbijdrage wordt vastgesteld, tot ten hoogste de
      omvang van het prestatiegebonden deel.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel4
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006338
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.5.2
    text: |-
      Indien op 1 juli van het derde jaar van het tijdvak waarop de vaststelling, bedoeld in [4.2, tweede lid][ref1],
      betrekking heeft, uit het jaarverslag blijkt dat minder dan 80% van de vastgestelde bewijsstukken, getuigschriften
      en activiteiten, bedoeld in [artikel 4.3, eerste lid onderdeel a][ref2], zijn gerealiseerd, dan wel indien dan uit
      het jaarverslag blijkt dat de kwaliteit van de activiteiten ten behoeve van de vernieuwing van het hoger onderwijs,
      bedoeld in [artikel 4.3, eerste lid onderdeel b][ref3], onvoldoende is geweest, wordt het prestatiegebonden
      deel van de rijksbijdrage voor het resterende deel van het tijdvak waarop de vaststelling, bedoeld in
      [artikel 4.2, tweede lid][ref4], betrekking heeft, verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006338#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0006338#Artikel4
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006338
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006338
        artikel: '4'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0006338
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.5.3
    text: |-
      De vermindering van de rijksbijdrage, bedoeld in het eerste en tweede lid, vindt plaats naar rato van
      het aantal bewijsstukken en getuigschriften dat minder is afgegeven of het aantal activiteiten dat minder
      is verricht ten behoeve van de vernieuwing van het hoger onderwijs, dan door Onze minister op grond van
      [artikel 4.2, tweede lid][ref1], was vastgesteld, met dien verstande dat de vermindering niet meer bedraagt dan de
      omvang van het prestatiegebonden deel van de rijksbijdrage. Ingeval uit het jaarverslag blijkt dat de kwaliteit van
      de activiteiten onvoldoende is geweest, wordt de rijksbijdrage in overeenstemming daarmede verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel4
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.5.4
    text: |-
      Onze minister kan van de vorige leden afwijken, indien het feit dat de vastgestelde beoogde ontwikkeling van de
      factoren van het prestatiegebonden deel niet of niet geheel is gerealiseerd, de Open Universiteit niet kan worden
      tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel4.5
  - number: '4.6'
    text: |-
      De rijksbijdrage van de Open Universiteit omvat de som van de door Onze minister vastgestelde,
      in [artikel 4.1][ref1] bedoelde delen van de rijksbijdrage, berekend met toepassing van
      de[ artikelen 4.2 tot en met 4.5][ref2].


