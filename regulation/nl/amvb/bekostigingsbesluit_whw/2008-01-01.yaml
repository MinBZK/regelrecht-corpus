  - number: 2.2.3
    text: 'In dit hoofdstuk wordt onder getuigschrift verstaan:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.2
  - number: 2.2.3.a
    text: een getuigschrift van het met goed gevolg afgelegd afsluitend examen van een bacheloropleiding,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.2
  - number: 2.2.3.b
    text: een getuigschrift van het met goed gevolg afgelegd afsluitend examen van een masteropleiding,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.2
  - number: 2.2.3.c
    text: een getuigschrift van het met goed gevolg afgelegd afsluitend examen van een ongedeelde opleiding, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.2
  - number: 2.2.3.d
    text: |-
      een getuigschrift van het met goed gevolg afgelegd kandidaatsexamen van een opleiding in het wetenschappelijk
      onderwijs, in welke opleiding blijkens de onderwijs- en examenregeling het instellingsbestuur op 31 december
      2001 een kandidaatsfase en een kandidaatsexamen als bedoeld in [artikel 7.8a van de wet][ref1], zoals
      [dat artikel][ref2] op 31 augustus 2002 luidde, had onderscheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 2.2.4
    text: |-
      In dit hoofdstuk wordt onder ongedeelde opleiding verstaan een opleiding als bedoeld in
      [artikel 18.15 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
  - number: '2.3'
    text: 'De rijksbijdrage van een universiteit is samengesteld uit:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.3
  - number: 2.3.a
    text: |-
      een onderwijsdeel, waaronder een component eerstejaars, een component getuigschriften, een component
      basisvoorziening onderwijs en in voorkomende gevallen bedragen ten behoeve van numerus fixus geneeskunde, de
      werkplaats diergeneeskunde en de werkplaats tandheelkunde,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.3
  - number: 2.3.b
    text: |-
      een onderzoekdeel, waaronder een component basisvoorziening onderzoek, een component proefschriften en
      ontwerperscertificaten, een component afbouw dynamisering Smart Mix, een component onderzoekscholen, een component
      strategische overwegingen en in voorkomende gevallen een component toponderzoekscholen,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.3
  - number: 2.3.c
    text: in voorkomende gevallen een deel leraartraject,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.3
  - number: 2.3.d
    text: in voorkomende gevallen een deel academisch ziekenhuis, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.3
  - number: 2.3.e
    text: een investeringsdeel.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.3
  - number: '2.4'
    text: |-
      In overeenstemming met het desbetreffende onderdeel van de voor het desbetreffende begrotingsjaar vastgestelde
      rijksbegroting, wordt jaarlijks door Onze minister de omvang vastgesteld van de landelijk voor de in
      [artikel 2.3][ref1] genoemde samenstellende delen, componenten en bedragen van de rijksbijdrage van de
      universiteiten beschikbare middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.4a
    text: |-
      Voor 1 januari besluit Onze minister op welk niveau de opleidingen die in de periode van 2 oktober van het derde
      kalenderjaar voorafgaand aan het begrotingsjaar tot en met 1 oktober van het tweede kalenderjaar voorafgaand aan
      het begrotingsjaar, voor het eerst in het Centraal register opleidingen zijn opgenomen, zullen worden bekostigd ten
      aanzien van de componenten eerstejaars en getuigschriften, bedoeld in de [artikelen 2.6][ref1] en [2.6a][ref2], en
      de component basisvoorziening onderzoek, bedoeld in [artikel 2.9][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006338#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
