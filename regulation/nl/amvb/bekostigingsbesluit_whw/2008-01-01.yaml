  - number: 1.1.b
    text: |-
      Onze minister: Onze Minister van Onderwijs, Cultuur en Wetenschap en, voorzover het betreft het onderwijs
      en onderzoek op het gebied van landbouw en natuurlijke omgeving, Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit;
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel1.1
  - number: 1.1.c
    text: 'universiteit: een universiteit als bedoeld in de [onderdelen a en b van de bijlage van de wet](onbekend);'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel1.1
  - number: 1.1.d
    text: 'hogeschool: een hogeschool als bedoeld in de [onderdelen c, d, e, f en g van de bijlage van de wet](onbekend);'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel1.1
  - number: 1.1.e
    text: 'Open Universiteit: de Open Universiteit, genoemd in [onderdeel h van de bijlage van de wet](onbekend);'
