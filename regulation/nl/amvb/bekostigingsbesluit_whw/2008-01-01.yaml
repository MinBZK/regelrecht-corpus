  - number: 1.3.1
    text: |-
      Bij ministeriële regeling worden voorschriften vastgesteld over de uitvoering van de controle door de accountant
      van de boekhouding, de jaarrekening en de administratie van de instellingen.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel1.3
  - number: 1.3.2
    text: |-
      De voorschriften hebben betrekking op de controle op de rechtmatigheid van de verkrijging en de rechtmatigheid
      en doelmatigheid van de besteding van de rijksbijdrage, de controle op de bekostigingsgegevens, bedoeld
      in dit besluit, en de controle op de studievoortganggegevens, bedoeld in de [artikelen 7.9a][ref1] en
      [7.9d van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '2.1'
    text: |-
      De bepalingen van dit hoofdstuk hebben betrekking op de universiteiten, bedoeld in [artikel 2.1 van de wet][ref1],
      waarvoor de rijksbijdrage wordt vastgesteld door Onze Minister van Onderwijs, Cultuur en Wetenschap. Deze
      bepalingen zijn van overeenkomstige toepassing op de openbare universiteit te Wageningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
  - number: 2.2.1
    text: 'In dit hoofdstuk wordt onder eerstejaars verstaan degene die:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.2
  - number: 2.2.1.a
    text: |-
      voor de eerste maal op 1 oktober als student is ingeschreven aan de universiteit in de periode, te rekenen vanaf
      het vijfde studiejaar voorafgaande aan die datum,
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.2
  - number: 2.2.1.b
    text: |-
      het collegegeld, bedoeld in de [artikelen 7.43][ref1] en [7.44 van de wet][ref2], is verschuldigd en geen
      vrijstelling van het betalen van collegegeld op grond van [artikel 7.48, vierde lid, van de wet][ref3] heeft
      verkregen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 2.2.1.c
    text: |-
      niet reeds in het bezit is van een getuigschrift van het met goed gevolg afgelegd afsluitend examen van een
      bacheloropleiding in het hoger beroepsonderwijs of van een opleiding in het hoger beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.2
  - number: 2.2.2
    text: 'In dit hoofdstuk wordt onder eerstejaars tevens verstaan degene die:'
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.2
  - number: 2.2.2.a
    text: |-
      in het bezit is van een getuigschrift van het met goed gevolg afgelegd afsluitend examen van een bacheloropleiding
      in het hoger beroepsonderwijs of van een opleiding in het hoger beroepsonderwijs, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.2
  - number: 2.2.2.b
    text: |-
      voor de eerste maal op 1 oktober als student is ingeschreven voor een masteropleiding of voor een ongedeelde
      opleiding aan de universiteit in de periode, te rekenen vanaf het vijfde studiejaar voorafgaande aan die datum, en
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.2
  - number: 2.2.2.c
    text: |-
      het collegegeld, bedoeld in de [artikelen 7.43][ref1] en [7.44 van de wet][ref2], is verschuldigd en geen
      vrijstelling van het betalen van collegegeld op grond van [artikel 7.48, vierde lid][ref3], van de wet heeft
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0006338/2008-01-01#Artikel2.2
    references:
