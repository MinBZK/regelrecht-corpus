  - number: '2.16'
    text: |-
      1 Indien het overleg, bedoeld in [artikel 2.15, tweede lid][ref1], daartoe aanleiding geeft, kan Onze minister, met
      inachtneming van [artikel 2.6a, derde lid, van de wet][ref2] besluiten tot herverdeling van middelen, behorend tot
      de component strategische overwegingen.

      2 Een besluit tot herverdeling als bedoeld in het eerste lid, wordt niet genomen dan nadat Onze minister daarover
      overleg heeft gepleegd als bedoeld in [artikel 3.1 van de wet][ref3].

      3 Een besluit tot herverdeling kan ten hoogste drie procent van de component strategische overwegingen per
      universiteit voor een begrotingsjaar betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.15
