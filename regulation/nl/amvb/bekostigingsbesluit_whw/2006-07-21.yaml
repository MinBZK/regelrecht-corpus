        artikel: '2.4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.23'
    text: |-
      1 Het gedeelte 1988 tot en met 1992 van de component rente en afschrijvingen van een universiteit omvat de som
      van de vergoedingen die op grond van het tweede lid zijn berekend over het in [bijlage 1][ref1] bij dit besluit
      vermelde OCenW-deel van de investeringsbedragen voor de projecten van het desbetreffende academisch ziekenhuis. De
      projecten zijn ingedeeld in de categorieën bouw, startkosten, bouwrente, en kleine werken.

      2 De vergoeding per categorie, bedoeld in het eerste lid, is samengesteld uit:

      a. het jaarlijkse afschrijvingsbedrag, genoemd in [bijlage 1][ref2], totdat het investeringsbedrag, genoemd in die
      bijlage, volledig is vergoed, en

      b. de rente, bedoeld in het vierde lid, voor het desbetreffende jaar, over het verschil tussen het
      investeringsbedrag, genoemd in [bijlage 1][ref3], en de gecumuleerde afschrijvingen.

      3 Onder de gecumuleerde afschrijvingen, bedoeld in het tweede lid, met betrekking tot enig begrotingsjaar wordt
      verstaan het gecumuleerde afschrijvingsbedrag (stand 1996), genoemd in [bijlage 1][ref4], vermeerderd met het
      product van het afschrijvingsbedrag, genoemd in die bijlage, en het aantal jaren dat sinds 1996 is verstreken.

      4 De voor de onderscheiden academische ziekenhuizen in [bijlage 1][ref5] opgenomen rentepercentages gelden voor het
      tijdvak 1997 tot en met 2002. Vanaf het jaar 2003 wordt het rentepercentage telkens voor een tijdvak van 10 jaar
      bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006338
      [ref2]: https://wetten.overheid.nl/BWBR0006338
      [ref3]: https://wetten.overheid.nl/BWBR0006338
      [ref4]: https://wetten.overheid.nl/BWBR0006338
      [ref5]: https://wetten.overheid.nl/BWBR0006338
