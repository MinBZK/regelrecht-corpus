        paragraaf: '2'
  - number: '3.8'
    text: |-
      Onze minister maakt jaarlijks voor 1 juli aan de desbetreffende hogeschool bekend op welk niveau een opleiding die
      in dat kalenderjaar voor het eerst in het Centraal register opleidingen wordt opgenomen, zal worden bekostigd.
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel3.8
  - number: '3.12'
    text: |-
      1 In overeenstemming met het desbetreffende onderdeel van de voor het desbetreffende begrotingsjaar vastgestelde
      rijksbegroting, wordt jaarlijks door Onze minister de omvang vastgesteld van het landelijk voor de hogescholen
      beschikbare huisvestingsdeel.

      2 Het landelijk beschikbare huisvestingsdeel wordt over de hogescholen verdeeld op basis van de in vierkante
      meters uitgedrukte ruimtebehoefte per hogeschool in het betreffende begrotingsjaar. De ruimtebehoefte wordt
      jaarlijks berekend door de onderwijsvraag van de hogeschool in het desbetreffende begrotingsjaar, bedoeld in
      de[ artikelen 3.3 tot en met 3.6][ref1] te vermenigvuldigen met de ruimtebehoeftenorm van de hogeschool. Bij
      ministeriële regeling wordt de ruimtebehoeftenorm per hogeschool vastgesteld.

      3 Het huisvestingsdeel van een hogeschool omvat ten minste de normatieve uitgaven voor rente en aflossing ten
      gevolge van:

      a. het bedrag dat door het instellingsbestuur aan het Rijk is betaald op grond van
      [artikel II van de Wet van 11 november 1993][ref2], Stb. 628,

      b. de schuld die resteert van het op 31 december 1993 nog uitstaande door het Rijk aan een instelling overgedragen
      leenbedrag ter zake van een investering waarvoor door het Rijk toestemming is verleend,

      c. de na 31 december 1993 resterende projectkosten voor een bouwproject in uitvoering dat op 31 december 1993
      nog niet is opgeleverd, overeenkomstig de met het Rijk overeengekomen projectkosten en wijze van vergoeding en
      voorzover de kosten nog niet door het Rijk zijn vergoed.

      4 Het huisvestingsdeel van een hogeschool omvat tevens ten minste de vergoeding van de huurpenningen voor een
      gebouw, die door het instellingsbestuur worden betaald als verplichting voortvloeiend uit een huurovereenkomst die
      door het instellingsbestuur is gesloten vóór 17 november 1992, en waarvoor door het Rijk toestemming is verleend,
      onderscheidenlijk als verplichting uit een huurovereenkomst waarvan het instellingsbestuur het voornemen tot het
      sluiten daarvan vóór 17 november 1992 aan Onze minister heeft medegedeeld, en waarvoor door het Rijk toestemming is
      verleend. De vergoeding, bedoeld in de eerste volzin, wordt verleend tot de bedragen, perioden en condities zoals
      in de goedkeuring vermeld, doch uiterlijk tot en met 31 december 1997.

      5 De vergoeding van de normatieve uitgaven voor rente en aflossing, bedoeld in het derde lid, wordt verleend
      gedurende dertig jaar.

      6 De normatieve uitgaven voor rente en aflossing, bedoeld in het derde lid, worden berekend op de grondslag van 50%
      lineaire en 50% annuïtaire leningen, een rentevoet van 9% en een aflossingsperiode van dertig jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel3.3
      [ref2]: https://wetten.overheid.nl/BWBR0006250#ArtikelII
