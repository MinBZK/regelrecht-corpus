        artikel: '2.10'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '2.17'
    text: |-
      1 Het deel leraartraject van een universiteit bestaat uit:

      a. een component basisvoorziening leraartraject, en

      b. een component inschrijvingen leraartraject en getuigschriften.

      2 Voor de toepassing van deze paragraaf wordt onder universiteit verstaan een universiteit waaraan een of
      meer masteropleidingen als bedoeld in het derde lid, onderdelen a, b en c, dan wel een of meer universitaire
      eerstegraads lerarenopleidingen als bedoeld in het derde lid, onderdeel e, zijn verbonden.

      3 Voor de toepassing van deze paragraaf wordt onder inschrijving leraartraject verstaan de eerste maal dat een
      student of extraneus blijkens het Centraal register inschrijving aan een universiteit is ingeschreven voor:

      a. een masteropleiding, bedoeld in [artikel 7.4a, derde lid, van de wet][ref1],

      b. een masteropleiding waaraan een afstudeerrichting gericht op het beroep van leraar is verbonden, voor zover een
      student binnen die opleiding onderwijs gericht op het beroep van leraar volgt,

      c. een masteropleiding op het gebied van onderwijs voor zover die opleiding gericht is op het beroep van leraar en
      een student binnen die opleiding onderwijs gericht op het beroep van leraar volgt,

      d. een ongedeelde opleiding waaraan een afstudeerrichting gericht op het beroep van leraar is verbonden en een
      student binnen die opleiding onderwijs aan die afstudeerrichting volgt, of

      e. een universitaire eerstegraads lerarenopleiding, bedoeld in [artikel 18.16 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.4a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel18.16
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.17
