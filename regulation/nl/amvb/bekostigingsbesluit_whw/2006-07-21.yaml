  - number: '1.3'
    text: |-
      1 Bij ministeriële regeling worden voorschriften vastgesteld over de uitvoering van de controle door de accountant
      van de boekhouding, de jaarrekening en de administratie van de instellingen.

      2 De voorschriften hebben betrekking op de controle op de rechtmatigheid van de verkrijging en de rechtmatigheid
      en doelmatigheid van de besteding van de rijksbijdrage, de controle op de bekostigingsgegevens, bedoeld
      in dit besluit, en de controle op de studievoortganggegevens, bedoeld in de [artikelen 7.9a][ref1] en
      [7.9d van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.9a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.9d
