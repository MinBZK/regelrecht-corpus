  - number: 2.16a
    text: |-
      Onze minister besluit op welk niveau een wetenschapsgebied als bedoeld in [artikel 2.10][ref1] zal worden
      bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.10
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.16a
