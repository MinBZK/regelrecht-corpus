  - number: '2.15'
    text: |-
      1 In het hoger onderwijs- en onderzoekplan wordt door Onze minister een aanduiding gegeven van de
      wetenschapsgebieden waaraan prioriteit en posterioriteit moet worden gegeven.

      2 Indien uit de instellingsplannen, bedoeld in [artikel 2.2][ref1] van de wet, of anderszins blijkt, dat
      de universiteiten naar het oordeel van Onze minister onvoldoende rekening houden met de prioriteit- en
      posterioriteitstelling, bedoeld in het eerste lid, wordt daarover en over de mogelijke gevolgen voor de bekostiging
      van de universiteiten overleg gevoerd als bedoeld in [artikel 3.1][ref2] van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel3.1
