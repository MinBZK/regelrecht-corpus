        artikel: '2.4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6a
    text: |-
      1 De landelijke component getuigschriften, voor een begrotingsjaar vastgesteld op grond van [artikel 2.4][ref1],
      wordt over de universiteiten verdeeld op basis van het aantal door een universiteit uitgereikte getuigschriften in
      het studiejaar dat eindigt in het tweede kalenderjaar voorafgaand aan het begrotingsjaar, met inachtneming van het
      tweede tot en met zevende lid.

      2 Ten behoeve van de verdeling van de landelijke component getuigschriften over de universiteiten wordt het aantal
      getuigschriften per universiteit onderscheiden naar:

      a. getuigschriften van bacheloropleidingen met een laag bekostigingsniveau,

      b. getuigschriften van bacheloropleidingen met een hoog bekostigingsniveau,

      c. getuigschriften van de bacheloropleidingen diergeneeskunde, farmacie, geneeskunde en tandheelkunde,

      d. getuigschriften van masteropleidingen met een laag bekostigingsniveau,

      e. getuigschriften van masteropleidingen met een hoog bekostigingsniveau,

      f. getuigschriften van de masteropleidingen diergeneeskunde, farmacie, geneeskunde en tandheelkunde,

      g. getuigschriften van ongedeelde opleidingen met een laag bekostigingsniveau,

      h. getuigschriften van ongedeelde opleidingen met een hoog bekostigingsniveau, en

      i. getuigschriften van de ongedeelde opleidingen diergeneeskunde, farmacie, geneeskunde en tandheelkunde.

      Voor de toepassing van dit artikel wordt het kandidaatsgetuigschrift aangemerkt als het getuigschrift van een
      bacheloropleiding.

      3 Op het aantal getuigschriften, bedoeld in het tweede lid, eerste volzin, onderdelen a, b en c, blijven buiten
      beschouwing:

      a. het aantal getuigschriften van een bacheloropleiding die zijn uitgereikt aan degenen aan wie reeds een
      getuigschrift is uitgereikt van het met goed gevolg afgelegd afsluitend examen van een bacheloropleiding in het
      hoger beroepsonderwijs of van een opleiding in het hoger beroepsonderwijs, en

      b. het aantal kandidaatsgetuigschriften van een opleiding in het wetenschappelijk onderwijs die zijn uitgereikt aan
      degenen aan wie reeds een getuigschrift is uitgereikt van het met goed gevolg afgelegd afsluitend examen van een
      bacheloropleiding in het hoger beroepsonderwijs of van een opleiding in het hoger beroepsonderwijs.

      4 Voor de toepassing van dit artikel, tweede lid, eerste volzin, onderdelen g, h en i, worden de getuigschriften
      van een ongedeelde opleiding in het wetenschappelijk onderwijs die zijn uitgereikt aan degenen aan wie reeds een
      getuigschrift is uitgereikt van het met goed gevolg afgelegd afsluitend examen van een bacheloropleiding in het
      hoger onderwijs of van het met goed gevolg afgelegd kandidaatsexamen van een opleiding in het wetenschappelijk
      onderwijs, aangemerkt als getuigschriften van een masteropleiding.

      5 Het aantal te bekostigen getuigschriften per universiteit bedraagt de som van de in het tweede, derde en vierde
      lid berekende aantallen, nadat deze zijn vermenigvuldigd met onderscheidenlijk 2/3, 1, 6/5, 1/3, 1/2, 9/5, 1, 3/2
      en 3.

      6 [Artikel 2.6, vierde lid][ref2], is van overeenkomstige toepassing.

      7 De landelijke component getuigschriften wordt over de universiteiten verdeeld naar rato van het in het vijfde lid
      berekende aantal getuigschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel2.6
