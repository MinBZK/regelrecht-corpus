  - number: '3.13'
    text: |-
      1 Ten behoeve van de verdeling van het landelijk beschikbaar huisvestingsdeel wordt de landelijke
      ruimtebehoefte vastgesteld. De landelijke ruimtebehoefte is het totaal van het aantal op grond van
      de[ artikelen 3.12, tweede lid][ref1], en [5.7][ref2] berekende vierkante meters.

      2 Het huisvestingsdeel per hogeschool wordt voorlopig vastgesteld door het landelijk beschikbare huisvestingsdeel
      te vermenigvuldigen met de ruimtebehoefte van de hogeschool en te delen door de landelijke ruimtebehoefte.

      3 Indien het op grond van het tweede dan wel het vierde lid berekende huisvestingsdeel van een hogeschool lager
      of gelijk is aan de vergoedingen voor de uitgaven bedoeld in [artikel 3.12, derde en vierde lid][ref3], wordt het
      huisvestingsdeel van deze hogeschool definitief vastgesteld ter hoogte van die vergoedingen. De huisvestingsdelen
      van deze hogescholen en de ruimtebehoefte worden in mindering gebracht op respectievelijk het landelijk
      huisvestingsdeel en de landelijke ruimtebehoefte.

      4 Het huisvestingsdeel van de hogeschool, waarvan het huisvestingsdeel nog niet definitief is vastgesteld, wordt
      opnieuw voorlopig vastgesteld door het na toepassing van het derde lid nog landelijk beschikbare huisvestingsdeel
      te vermenigvuldigen met de ruimtebehoefte van de hogeschool en te delen door de na toepassing van het derde lid
      resterende landelijke ruimtebehoefte.

      5 Het vierde lid wordt toegepast totdat het huisvestingsdeel minimaal het niveau bedraagt van de vergoedingen
      bedoeld in [artikel 3.12, derde en vierde lid][ref4]. De op dat moment berekende voorlopige huisvestingsdelen van
      alle resterende hogescholen worden definitief vastgesteld.


