  - number: 3.3a
    text: |-
      1 In dit artikel wordt onder opleiding verstaan: een opleiding of lerarenopleiding op het gebied van de kunst,
      dan wel een groep van die opleidingen. Bij ministeriële regeling wordt de indeling van de groepen van opleidingen
      vastgesteld.

      2 In afwijking van [artikel 3.3][ref1] wordt de onderwijsvraag van een opleiding berekend met de formule: I + ½
      x A.

      In deze formule wordt verstaan onder:

      I: het aantal studenten dat op 1 oktober van het tweede aan het begrotingsjaar voorafgaande kalenderjaar voor de
      desbetreffende opleiding is ingeschreven, met dien verstande dat niet worden meegeteld:

      1°. studenten die op meer dan vier peildata na 1 september 2000 voor de opleiding of dezelfde opleiding aan een
      andere hogeschool als student waren ingeschreven, en

      2°. studenten die op enige peildatum tussen 1 augustus 1991 en 1 september 2000 als student waren ingeschreven voor
      de opleiding of dezelfde opleiding aan een andere hogeschool;

      A: het aantal personen aan wie blijkens het Centraal register inschrijving een getuigschrift is uitgereikt in de
      periode van 12 maanden voorafgaand aan de datum, genoemd in de aanhef van de omschrijving van I.

      3 Voor de toepassing van dit artikel wordt bij ministeriële regeling bepaald welke opleidingen als dezelfde
      opleidingen worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel3.3a
