  - number: '2.3'
    text: |-
      De rijksbijdrage van een universiteit is samengesteld uit:

      a. een onderwijsdeel, waaronder een component eerstejaars, een component getuigschriften, een component
      basisvoorziening onderwijs en in voorkomende gevallen bedragen ten behoeve van numerus fixus geneeskunde, de
      werkplaats diergeneeskunde en de werkplaats tandheelkunde,

      b. een onderzoekdeel, waaronder een component basisvoorziening onderzoek, een component proefschriften en
      ontwerperscertificaten, een component dynamisering Smart Mix, een component onderzoekscholen, een component
      strategische overwegingen en in voorkomende gevallen een component toponderzoekscholen,

      c. in voorkomende gevallen een deel leraartraject,

      d. in voorkomende gevallen een deel academisch ziekenhuis, en

      e. een investeringsdeel.
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.3
  - number: '2.4'
    text: |-
      In overeenstemming met het desbetreffende onderdeel van de voor het desbetreffende begrotingsjaar vastgestelde
      rijksbegroting, wordt jaarlijks door Onze minister de omvang vastgesteld van de landelijk voor de in
      [artikel 2.3][ref1] genoemde samenstellende delen, componenten en bedragen van de rijksbijdrage van de
      universiteiten beschikbare middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.4
    references:
