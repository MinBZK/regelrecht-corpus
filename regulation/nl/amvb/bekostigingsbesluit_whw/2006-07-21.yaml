        artikel: '18.20'
  - number: 3.4a
    text: |-
      In afwijking van [artikel 3.3][ref1] wordt de onderwijsvraag voor de tweedegraads lerarenopleidingen verpleegkunde,
      de opleidingen tot verpleegkundige in de maatschappelijke gezondheidszorg en de opleidingen van kader in de
      gezondheidszorg bepaald op het aantal ingeschreven studenten op 1 oktober van het tweede aan het begrotingsjaar
      voorafgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel3.4a
