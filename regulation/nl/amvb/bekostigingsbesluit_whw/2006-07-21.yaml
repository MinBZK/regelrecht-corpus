        artikel: '2.4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6e
    text: |-
      1 Bij de berekening van de component eerstejaars en de component getuigschriften van de openbare universiteit
      te Maastricht worden de op grond van [artikel 2.6][ref1] onderscheidenlijk [artikel 2.6a][ref2] berekende
      aantallen vermeerderd met de aantallen eerstejaars van de transnationale Universiteit Limburg met de Nederlandse
      nationaliteit onderscheidenlijk met de aantallen door de transnationale Universiteit Limburg uitgereikte
      getuigschriften. Hieronder worden tevens begrepen de aantallen eerstejaars en getuigschriften van ingeschrevenen
      die noch de Nederlandse noch de Belgische nationaliteit bezitten, en die voor bekostiging door de Nederlandse
      overheid in aanmerking worden genomen op grond van artikel 7 van het Verdrag tussen het Koninkrijk der Nederlanden
      en de Vlaamse Gemeenschap van België inzake de transnationale Universiteit Limburg.

      2 De [artikelen 2.6, tweede, derde en vierde lid][ref3], en [2.6a, tweede tot en met vijfde lid][ref4], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel2.6a
