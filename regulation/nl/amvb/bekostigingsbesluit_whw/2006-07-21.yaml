      Tot een bij koninklijk besluit te bepalen tijdstip worden in afwijking van de [artikelen 2.6a][ref1] en
      [2.9][ref2] de getuigschriften van het met goed gevolg afgelegd afsluitend examen van een masteropleiding in het
      wetenschappelijk onderwijs aangemerkt als getuigschriften van het met goed gevolg afgelegd afsluitend examen van
      een ongedeelde opleiding in het wetenschappelijk onderwijs, indien uit het Centraal register inschrijving blijkt

      a. dat een student voor een ongedeelde opleiding was ingeschreven in een van de vijf studiejaren die voorafgaan aan
      het studiejaar dat eindigt in het tweede kalenderjaar voorafgaand aan het begrotingsjaar, en

      b. dat aan die student in het studiejaar dat eindigt in het tweede kalenderjaar voorafgaand aan het begrotingsjaar,
      en in de vijf daaraan voorafgaande studiejaren geen getuigschrift van een bacheloropleiding in het hoger onderwijs
      of van een kandidaatsexamen in het wetenschappelijk onderwijs is uitgereikt.


