  - number: '2.14'
    text: |-
      1 Onverminderd [artikel 2.16][ref1] wordt de landelijke component strategische overwegingen, voor een
      begrotingsjaar vastgesteld op grond van [artikel 2.4][ref2], over de universiteiten verdeeld op basis van de omvang
      van de component strategische overwegingen per universiteit in het voorafgaande begrotingsjaar, met inachtneming
      van het tweede tot en met zevende lid.

      2 Ten behoeve van de verdeling van de landelijke component strategische overwegingen over de universiteiten worden
      het bedrag strategische overwegingen plus en het bedrag compensatie onderzoek onderscheiden.

      3 Het bedrag strategische overwegingen plus omvat de op grond van [artikel 2.4][ref3] vastgestelde component
      strategische overwegingen, verhoogd met de op grond van [artikel 2.4][ref4] vastgestelde component basisvoorziening
      onderzoek en verminderd met 15% van het op grond van [artikel 2.4][ref5] vastgestelde onderzoekdeel.

      4 Het bedrag compensatie onderzoek omvat de op grond van [artikel 2.4][ref6] vastgestelde component
      basisvoorziening onderzoek verminderd met 15% van het op grond van [artikel 2.4][ref7] vastgestelde onderzoekdeel.

      5 Het bedrag strategische overwegingen plus wordt over de universiteiten verdeeld naar rato van de omvang van het
      bedrag strategische overwegingen plus per universiteit in het voorafgaande begrotingsjaar.

      6 Het bedrag compensatie onderzoek wordt over de universiteiten verdeeld naar rato van de omvang van het bedrag
      compensatie onderzoek per universiteit in het voorafgaande begrotingsjaar.

      7 De component strategische overwegingen per universiteit is het bedrag per universiteit, bedoeld in het vijfde
      lid, verminderd met het bedrag per universiteit, bedoeld in het zesde lid.


