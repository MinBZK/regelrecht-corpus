    text: |-
      1 De component inschrijvingen leraartraject en getuigschriften per universiteit omvat de som van:

      a. het aantal inschrijvingen leraartraject in de telperiode, vermenigvuldigd met een bedrag van € 650, en

      b. het aantal getuigschriften in de telperiode, vermenigvuldigd met een bedrag van € 2 600.

      2 De telperiode, bedoeld in het eerste lid, is de periode van 1 oktober van het tweede kalenderjaar voorafgaand aan
      het begrotingsjaar tot 1 oktober van het kalenderjaar voorafgaand aan het begrotingsjaar.

      3 Indien het totaal van de sommen, bedoeld in het eerste lid, de landelijke component, bedoeld in
      [artikel 2.19, eerste lid][ref1], overschrijdt, worden door Onze minister voor het desbetreffende begrotingsjaar de
      sommen van de afzonderlijke universiteiten vermenigvuldigd met een factor, zodanig dat het totaal van de sommen van
      de universiteiten en de landelijke component aan elkaar gelijk zijn.

      4 Onze minister doet gelijktijdig met de in [artikel 2.7, tweede lid, van de wet][ref2] bedoelde bekendmaking van
      de vastgestelde rijksbijdrage mededeling van de op grond van het derde lid toe te passen factor.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.19
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2.7
