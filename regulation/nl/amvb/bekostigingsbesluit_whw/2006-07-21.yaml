        artikel: '2.1'
  - number: '3.2'
    text: |-
      1 In overeenstemming met het desbetreffende onderdeel van de voor het desbetreffende begrotingsjaar vastgestelde
      rijksbegroting, wordt jaarlijks door Onze minister de omvang vastgesteld van het landelijk voor de hogescholen
      beschikbare exploitatiedeel.

      2 Het landelijk beschikbare exploitatiedeel wordt over de hogescholen verdeeld op basis van de onderwijsvraag van
      de door de desbetreffende hogeschool aangeboden opleidingen.
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel3.2
  - number: '3.3'
    text: |-
      1 De onderwijsvraag van een hogeschool wordt per opleiding of groep van opleidingen die door de desbetreffende
      hogeschool worden aangeboden, bepaald door de onderwijsvraagfactor, bedoeld in het tweede lid, te vermenigvuldigen
      met het aantal studenten dat op 1 oktober van het tweede kalenderjaar voorafgaand aan het begrotingsjaar aan
      een hogeschool ingeschreven staat. Bij ministeriële regeling wordt de indeling van de groepen van opleidingen
      vastgesteld.

      2 De onderwijsvraagfactor wordt berekend met de volgende formule:

      In deze formule wordt verstaan onder:

      A: het aantal personen aan wie blijkens het Centraal register inschrijving een getuigschrift is uitgereikt
      voorzover deze personen aan die hogeschool een inschrijving hebben gehad als bedoeld in het eerste lid, gedurende
      meer dan de helft van de NBA die op de opleiding waarvoor het getuigschrift is uitgereikt van toepassing is;

      U: het aantal studenten op 1 oktober van het derde kalenderjaar voorafgaand aan het begrotingsjaar dat op 1 oktober
      van het tweede kalenderjaar voorafgaand aan het begrotingsjaar geen student is aan die hogeschool en aan wie in die
      periode blijkens het Centraal register inschrijving door die hogeschool geen getuigschrift is uitgereikt, tenzij
      het een student betreft die in deze periode is overleden;

      S: de factor studielast, waarbij S gelijk is aan het quotiënt van de studielast van de opleiding en 240.

      Ja:

      a. voor de onder A bedoelde personen die op 1 oktober van het derde kalenderjaar voorafgaand aan het begrotingsjaar
      niet als student aan de betreffende hogeschool waren ingeschreven: per persoon 4,5 voor degene aan wie in de
      periode tussen 1 augustus 1991 en 1 oktober van het derde kalenderjaar voorafgaand aan het begrotingsjaar door die
      hogeschool een getuigschrift is uitgereikt en 1,35 in de overige gevallen,

      b. voor de onder A bedoelde personen bij wie sprake is van herinstroom: het aantal peildata waarop zij vanaf het
      moment van herinstroom zonder onderbreking aan de betreffende hogeschool zijn ingeschreven geweest, per persoon
      vermeerderd met 4,5 voor degene aan wie in de periode tussen 1 augustus 1991 en het moment van herinstroom door die
      hogeschool een getuigschrift is uitgereikt en met 1,35 in de overige gevallen, en

      c. voor de overige onder A bedoelde personen het aantal peildata waarop de onder A bedoelde personen aan de
      betreffende hogeschool als student zijn ingeschreven geweest.

      Ju:

      a. voor de onder U bedoelde studenten bij wie sprake is van herinstroom: het aantal peildata waarop zij vanaf het
      moment van herinstroom zonder onderbreking aan de betreffende hogeschool zijn ingeschreven geweest, per student
      vermeerderd met 4,5 voor degene aan wie in de periode tussen 1 augustus 1991 en het moment van herinstroom door die
      hogeschool een getuigschrift is uitgereikt en met 1,35 in de overige gevallen, en

      b. voor de overige onder U bedoelde studenten het aantal peildata waarop de onder U bedoelde studenten aan de
      betrokken hogeschool als student zijn ingeschreven geweest.

      3 Onder het aantal studiejaren van afgestudeerden en uitvallers, bedoeld in tweede lid, zijn tevens begrepen de
      studiejaren gedurende welke zij aan een andere hogeschool als student zijn ingeschreven geweest, voor zover het
      betreft een opleiding die naar de betrokken hogeschool is overgegaan en voor zover deze studenten in het studiejaar
      voorafgaand aan de overgang van de opleiding aan de andere hogeschool voor die opleiding zijn ingeschreven geweest.

      4 Bij de toepassing van het tweede lid wordt verstaan onder: herinstroom: de situatie waarin een persoon op
      een peildatum na 30 september 1999 als student aan een hogeschool ingeschreven staat waar deze op de daaraan
      voorafgaande peildatum niet stond ingeschreven maar wel op een eerdere peildatum na 31 juli 1991; peildatum:

      a. 15 september voor de studiejaren tot en met het studiejaar 1992/1993, en

      b. 1 oktober voor de studiejaren vanaf het studiejaar 1993/1994.

      5 De in het tweede lid onder A bedoelde gegevens ten aanzien van de getuigschriften hebben betrekking op het
      tijdvak van 12 maanden voorafgaand aan het tijdstip genoemd in het eerste lid. De in het tweede lid onder A
      bedoelde gegevens ten aanzien van de studenten hebben betrekking op de situatie per 1 oktober van het derde
      kalenderjaar voorafgaand aan het begrotingsjaar.

      6 Indien de in het tweede lid onder A en U bedoelde gegevens ten aanzien van een groep van opleidingen die door de
      desbetreffende hogeschool wordt aangeboden, in een tijdvak als bedoeld in het tweede en vijfde lid, beide gelijk
      zijn aan nul, is ten aanzien van die groep [artikel 3.5][ref1] van overeenkomstige toepassing in het tweede op
      bedoeld tijdvak volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel3.3
