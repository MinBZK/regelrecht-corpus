  - number: '2.21'
    text: |-
      1 Het deel academisch ziekenhuis van een universiteit waaraan een academisch ziekenhuis is verbonden, bestaat uit:

      a. een component rente en afschrijvingen, gevormd door de som van:

      1°. een gedeelte 1988 tot en met 1992,

      2°. een gedeelte 1993 tot en met 1996,

      3°. een gedeelte 1997 tot en met 2003, en

      4°. een gedeelte vanaf 2004.

      b. een component basisvoorziening, en

      c. een component onderwijs en onderzoek.

      2 Voor de toepassing van deze paragraaf wordt onder universiteit verstaan een universiteit waaraan een academisch
      ziekenhuis is verbonden.
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.21
  - number: '2.22'
    text: |-
      Uit het landelijk beschikbare deel academische ziekenhuizen, vastgesteld op grond van [artikel 2.4][ref1], wordt
      aan de rijksbijdrage van de openbare universiteit te Maastricht en van de bijzondere universiteit te Amsterdam
      een bij ministeriële regeling vast te stellen bedrag toegevoegd ten behoeve van de klinische ondersteuning van het
      wetenschappelijk onderwijs en onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.22
