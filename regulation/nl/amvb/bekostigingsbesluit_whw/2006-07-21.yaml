        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006338
        artikel: '2.9'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '2.5'
    text: |-
      Het landelijk beschikbaar onderwijsdeel bestaat uit:

      a. een component eerstejaars,

      b. een component getuigschriften,

      c. een component basisvoorziening onderwijs, en

      d. in voorkomende gevallen bedragen ten behoeve van de numerus fixus geneeskunde, de werkplaats diergeneeskunde en
      de werkplaats tandheelkunde.
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.5
  - number: '2.6'
    text: |-
      1 De landelijke component eerstejaars, voor een begrotingsjaar vastgesteld op grond van [artikel 2.4][ref1], wordt
      over de universiteiten verdeeld op basis van het aantal eerstejaars dat in het tweede kalenderjaar voorafgaand aan
      het begrotingsjaar aan een universiteit ingeschreven staat, met inachtneming van het tweede tot en met vijfde lid.

      2 Ten behoeve van de verdeling van de landelijke component eerstejaars over de universiteiten wordt het aantal
      eerstejaars per universiteit onderscheiden naar:

      a. het aantal eerstejaars aan opleidingen met een laag bekostigingsniveau, en

      b. het aantal eerstejaars aan opleidingen met een hoog bekostigingsniveau.

      3 Het aantal te bekostigen eerstejaars per universiteit bedraagt de som van de in het tweede lid berekende
      aantallen, nadat deze zijn vermenigvuldigd met 1 onderscheidenlijk 1,5.

      4 Voor de bepaling van het aantal eerstejaars, bedoeld in het eerste lid, wordt uitgegaan van de in het Centraal
      register inschrijving opgenomen gegevens die de desbetreffende universiteit uiterlijk op 1 maart van het
      voorafgaande begrotingsjaar aan Onze minister verstrekt, vergezeld van een verklaring van een accountant.

      5 De landelijke component eerstejaars wordt over de universiteiten verdeeld naar rato van het in het derde lid
      berekende aantal eerstejaars.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.6
    references:
      - id: ref1
