  - number: '2.7'
    text: |-
      Het onderwijsdeel van een universiteit bestaat uit de som van de component eerstejaars per universiteit, de
      component getuigschriften per universiteit en de component basisvoorziening onderwijs per universiteit. In
      voorkomende gevallen wordt het onderwijsdeel van die universiteit vermeerderd met bedragen per universiteit ten
      behoeve van de numerus fixus geneeskunde, de werkplaats diergeneeskunde en de werkplaats tandheelkunde.
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.7
  - number: '2.8'
    text: |-
      Het onderzoekdeel van een universiteit bestaat uit:

      a. een component basisvoorziening onderzoek,

      b. een component proefschriften en ontwerperscertificaten,

      c. een component dynamisering Smart Mix,

      d. een component onderzoekscholen,

      e. in voorkomende gevallen een component toponderzoekscholen, en

      f. een component strategische overwegingen.
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.8
  - number: '2.9'
    text: |-
      1 De landelijke component basisvoorziening onderzoek, voor een begrotingsjaar op grond van [artikel 2.4][ref1]
      vastgesteld, wordt over de universiteiten verdeeld op basis van het aantal door een universiteit uitgereikte
      getuigschriften in het studiejaar dat eindigt in het tweede kalenderjaar voorafgaand aan het begrotingsjaar, met
      inachtneming van het tweede tot en met vijfde lid.

      2 Ten behoeve van de verdeling van de landelijke component basisvoorziening onderzoek over de universiteiten wordt
      het aantal getuigschriften per universiteit onderscheiden naar:

      a. getuigschriften van bacheloropleidingen met een laag bekostigingsniveau,

      b. getuigschriften van bacheloropleidingen met een hoog bekostigingsniveau,

      c. getuigschriften van de bacheloropleidingen diergeneeskunde, farmacie, geneeskunde en tandheelkunde,

      d. getuigschriften van masteropleidingen met een laag bekostigingsniveau,

      e. getuigschriften van masteropleidingen met een hoog bekostigingsniveau,

      f. getuigschriften van de masteropleidingen diergeneeskunde, farmacie, geneeskunde en tandheelkunde,

      g. getuigschriften van ongedeelde opleidingen met een laag bekostigingsniveau,

      h. getuigschriften van ongedeelde opleidingen met een hoog bekostigingsniveau, en

      i. getuigschriften van de ongedeelde opleidingen diergeneeskunde, farmacie, geneeskunde en tandheelkunde.

      Voor de toepassing van dit artikel wordt het kandidaatsgetuigschrift aangemerkt als het getuigschrift van een
      bacheloropleiding.

      3 Artikel [2.6a, derde en vierde lid][ref2], is van toepassing.

      4 Het aantal te bekostigen getuigschriften per universiteit bedraagt de som van de in het tweede en derde lid
      berekende aantallen, nadat deze zijn vermenigvuldigd met onderscheidenlijk 1/3, 1/2, 1, 2/3, 1, 2, 1, 3/2 en
      3 zijn.

      5 De [artikelen 2.6, vierde lid][ref3], en [2.6e][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel2.6a
      [ref3]: https://wetten.overheid.nl/BWBR0006338#Artikel2.6
      [ref4]: https://wetten.overheid.nl/BWBR0006338#Artikel2.6e
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.9
