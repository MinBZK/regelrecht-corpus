  - number: 2.13a
    text: |-
      De landelijke component strategische overwegingen voor een begrotingsjaar is gelijk aan het na toepassing van de
      [artikelen 2.9 tot en met 2.13][ref1] voor dat begrotingsjaar resterende landelijk beschikbare onderzoekdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.9
