        artikel: '2.25'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '2.30'
    text: |-
      Het landelijk investeringsdeel, door Onze minister vastgesteld op grond van [artikel 2.4][ref1], wordt verdeeld
      over de universiteiten naar evenredigheid van de som van het onderwijsdeel, het onderzoekdeel en in voorkomende
      gevallen het deel universitaire eerstegraads lerarenopleidingen per universiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.4
