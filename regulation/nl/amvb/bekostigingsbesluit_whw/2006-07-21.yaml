  - number: '3.1'
    text: |-
      De bepalingen van dit hoofdstuk hebben betrekking op de algemene berekeningswijze voor het exploitatiedeel en het
      huisvestingsdeel van de rijksbijdrage van de hogescholen, bedoeld in [artikel 2.1][ref1] van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel3.1
