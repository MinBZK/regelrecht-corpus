  - number: '2.24'
    text: |-
      1 Het gedeelte 1993 tot en met 1996 van de component rente en afschrijvingen van een universiteit omvat de som
      van de vergoedingen die op grond van het tweede lid zijn berekend over het in [bijlage 2][ref1] bij dit besluit
      vermelde OCenW-deel van de investeringsbedragen voor de projecten van het desbetreffende academisch ziekenhuis. De
      projecten zijn ingedeeld in de categorieën bouw, startkosten, en kleine werken.

      2 De vergoeding per categorie, bedoeld in het eerste lid, is samengesteld uit:

      a. het uit [bijlage 2][ref2] jaarlijks te berekenen afschrijvingsbedrag, totdat het investeringsbedrag, genoemd in
      die bijlage, volledig is vergoed, en

      b. de uit [bijlage 2][ref3] te berekenen rentevergoeding over het verschil tussen het investeringsbedrag, genoemd
      in die bijlage, en de gecumuleerde afschrijvingen.

      3 [Artikel 2.23, derde lid][ref4], is van overeenkomstige toepassing.

      4 De voor de onderscheiden jaren in [bijlage 2][ref5] opgenomen rentepercentages gelden voor een tijdvak van 10
      jaar. Na die periode wordt het rentepercentage telkens voor een tijdvak van 10 jaar bij ministeriële regeling
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006338
      [ref2]: https://wetten.overheid.nl/BWBR0006338
