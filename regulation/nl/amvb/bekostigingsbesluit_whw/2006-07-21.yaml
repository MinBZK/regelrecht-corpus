  - number: '3.4'
    text: |-
      In afwijking van [artikel 3.3][ref1] wordt de onderwijsvraag voor de opleidingen, bedoeld in
      [artikel 7.3a, tweede lid, onder b][ref2], en [artikel 18.20 van de wet][ref3], bepaald op het aantal ingeschreven
      studenten op 1 oktober van het tweede aan het begrotingsjaar voorafgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel3.3
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.3a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel18.20
