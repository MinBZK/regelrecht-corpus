preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen, van 15 juli 1993, nr. 92091035/4675,
    directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op artikel 2.6, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek;

    Gezien het advies van de Onderwijsraad (advies van 23 april 1993, nr. OR 93000072/T);

    De Raad van State gehoord (advies van 13 december 1993, nr. W05.93.0520);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, van 17 december 1993, nr.
    93099780/4675, directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];

      b. Onze minister: Onze Minister van Onderwijs, Cultuur en Wetenschap en, voorzover het betreft het onderwijs
      en onderzoek op het gebied van landbouw en natuurlijke omgeving, Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit;

      c. universiteit: een universiteit als bedoeld in de [onderdelen a en b van de bijlage van de wet](onbekend);

      d. hogeschool: een hogeschool als bedoeld in de [onderdelen c, d, e, f en g van de bijlage van de wet](onbekend);

      e. Open Universiteit: de Open Universiteit, genoemd in [onderdeel h van de bijlage van de wet](onbekend);

      f. academisch ziekenhuis: een academisch ziekenhuis als bedoeld in [onderdeel i van de bijlage van de wet]
      (onbekend);

      g. Centraal register inschrijving: het Centraal register inschrijving hoger onderwijs, bedoeld in
      [artikel 7.52 van de wet][ref2];

      h. Centraal register opleidingen: het Centraal register opleidingen hoger onderwijs, bedoeld in
      [artikel 6.13 van de wet][ref3];

      i. opleiding: een opleiding, opgenomen in het Centraal register opleidingen;

      j. opleiding van eerste inschrijving: opleiding waarvoor degene die zich inschrijft het volledige collegegeld als
      bedoeld in de [artikelen 7.43][ref4] en [7.44 van de wet][ref5] heeft voldaan;

      k. student: een blijkens het Centraal register inschrijving voor een opleiding van eerste inschrijving ingeschreven
      student;

      l. getuigschrift: een getuigschrift van een met goed gevolg afgelegd afsluitend examen van een opleiding;

      m. proefschrift: een proefschrift dan wel een proefontwerp uitmondend in een promotie als bedoeld in
      [artikel 7.18 van de wet][ref6];

      n. ontwerperscertificaat: een getuigschrift uitgereikt aan een technologisch ontwerper, met dien verstande dat
      de desbetreffende ontwerpersopleiding door een door Onze minister aangewezen, door de openbare universiteiten te
      Groningen, Delft, Eindhoven en Enschede gezamenlijk ingestelde, commissie dient te zijn gecertificeerd;

      o. accountant: een door het instellingsbestuur aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref7].


