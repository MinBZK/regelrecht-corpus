  - number: '2.18'
    text: |-
      1 Uit het landelijk beschikbare deel leraartraject, vastgesteld op grond van [artikel 2.4][ref1], wordt aan de
      landelijke component basisvoorziening leraartraject een bedrag van 2,1 miljoen euro toebedeeld.

      2 De landelijke component basisvoorziening leraartraject wordt als volgt over de universiteiten verdeeld:








                    a. de openbare universiteit te Leiden:


                    €  300 000,




                    b. de openbare universiteit te Groningen:


                    €  300 000,




                    c. de openbare universiteit te Amsterdam:


                    €  420 000,




                    d. de openbare universiteit te Utrecht:


                    €  300 000,




                    e. de openbare universiteit te Delft:


                    €   60 000,




                    f. de openbare universiteit te Eindhoven:


                    €   60 000,




                    g. de openbare universiteit te Enschede:


                    €   60 000,




                    h. de bijzondere universiteit te Amsterdam:


                    €  300 000, en




                    i. de bijzondere universiteit te Nijmegen:


                    €  300 000.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.4
