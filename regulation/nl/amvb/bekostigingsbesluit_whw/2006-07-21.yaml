  - number: 2.6b
    text: |-
      De landelijke component basisvoorziening onderwijs voor een begrotingsjaar is gelijk aan het na toepassing van de
      [artikelen 2.6][ref1], [2.6a][ref2], [2.6d][ref3] en [2.6e][ref4] voor dat begrotingsjaar resterende landelijke
      beschikbare onderwijsdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel2.6a
      [ref3]: https://wetten.overheid.nl/BWBR0006338#Artikel2.6d
      [ref4]: https://wetten.overheid.nl/BWBR0006338#Artikel2.6e
