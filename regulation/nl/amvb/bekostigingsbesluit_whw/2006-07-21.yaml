  - number: '2.25'
    text: |-
      1 Het gedeelte 1997 tot en met 2003 van de component rente en afschrijvingen van een universiteit omvat de som
      van de vergoedingen die op grond van het tweede lid zijn berekend over het in de besluiten inzake bouwvolume,
      bedoeld in het zesde lid, vermelde OCenW-deel van de investeringsbedragen voor de projecten van het desbetreffende
      academisch ziekenhuis. De projecten zijn ingedeeld in de categorieën bouw, startkosten, en kleine werken.

      2 De vergoeding per project, bedoeld in het eerste lid, is samengesteld uit:

      a. het jaarlijks over het investeringsbedrag te berekenen afschrijvingsbedrag, totdat het investeringsbedrag
      volledig is vergoed, en

      b. de jaarlijks te berekenen rentevergoeding over het verschil tussen het investeringsbedrag en de gecumuleerde
      afschrijvingen.

      Vergoeding van het bedrag onder *a* vindt plaats met ingang van het begrotingsjaar na het jaar waarvoor het
      investeringsbedrag in het besluit inzake bouwvolume is opgenomen. Vergoeding van het bedrag onder b wordt over het
      begrotingsjaar waarvoor het investeringsbedrag in het besluit inzake bouwvolume is opgenomen, berekend over 50% van
      het OCenW-deel van dat investeringsbedrag.

      3 Onder gecumuleerde afschrijvingen, bedoeld in het tweede lid, met betrekking tot enig begrotingsjaar
      wordt verstaan de som van de totaal vergoede afschrijvingsbedragen met betrekking tot het OCenW-deel van een
      investeringsbedrag sedert de vaststelling van het besluit inzake bouwvolume waarin dat investeringsbedrag is
      opgenomen, met inbegrip van het afschrijvingsbedrag voor dat begrotingsjaar.

      4 Het afschrijvingspercentage voor de in het eerste lid genoemde categorieën bedraagt onderscheidenlijk 3,2%, 2,5%
      en 5%.

      5 Bij ministeriële regeling wordt ten behoeve van de investeringen voor academische ziekenhuizen ten behoeve van
      een bepaald begrotingsjaar een rentepercentage vastgesteld voor een tijdvak van 10 jaar. Na die periode wordt het
      rentepercentage telkens voor een tijdvak van 10 jaar bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.25
  - number: 2.25a
    text: |-
      1 Het gedeelte vanaf 2004 van de component rente en afschrijvingen van een universiteit omvat de som van de
      vergoedingen die op grond van het tweede lid zijn berekend over het in de besluiten inzake bouwvolume, bedoeld in
      het zesde lid, vermelde OCenW-deel van de investeringsbedragen voor het desbetreffende academisch ziekenhuis.

      2 De vergoeding, bedoeld in het eerste lid, is samengesteld uit:

      a. het jaarlijks over het investeringsbedrag te berekenen afschrijvingsbedrag, totdat het investeringsbedrag
      volledig is vergoed, en

      b. de jaarlijks te berekenen rentevergoeding over het verschil tussen het investeringsbedrag en de gecumuleerde
      afschrijvingen.

      Vergoeding van het bedrag onder a vindt plaats met ingang van het begrotingsjaar na het jaar waarvoor het
      investeringsbedrag in het besluit inzake bouwvolume is opgenomen. Vergoeding van het bedrag onder b wordt over het
      begrotingsjaar waarvoor het investeringsbedrag in het besluit inzake bouwvolume is opgenomen, berekend over 50% van
      het OCenW-deel van het investeringsbedrag.

      3 Onder gecumuleerde afschrijvingen, bedoeld in het tweede lid, met betrekking tot enig begrotingsjaar
      wordt verstaan de som van de totaal vergoede afschrijvingsbedragen met betrekking tot het OCenW-deel van een
      investeringsbedrag sedert de vaststelling van het besluit inzake bouwvolume waarin dat investeringsbedrag is
      opgenomen, met inbegrip van het afschrijvingsbedrag voor dat begrotingsjaar.

      4 Het afschrijvingspercentage voor het investeringsbedrag bedraagt 3,36%.

      5 Bij ministeriële regeling wordt ten behoeve van de investeringen voor academische ziekenhuizen ten behoeve van
      een bepaald begrotingsjaar een rentepercentage vastgesteld voor een tijdvak van 10 jaar. Na die periode wordt het
      rentepercentage telkens voor een tijdvak van 10 jaar bij ministeriële regeling vastgesteld.

      6 Jaarlijks voor 1 november nemen Onze minister en Onze Minister van Volksgezondheid, Welzijn en Sport een besluit
      waarin het voor het daaropvolgende begrotingsjaar toegestane bouwvolume wordt vastgesteld. In dat besluit worden
      in elk geval opgenomen het investeringsbedrag per academisch ziekenhuis en het OCenW-deel daarvan. Indien het
      investeringsbedrag ten behoeve van een academisch ziekenhuis in het begrotingsjaar, bedoeld in de eerste volzin,
      niet of niet volledig is besteed, kan het besluit worden bijgesteld.
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.25a
  - number: '2.26'
    text: |-
      1 De landelijke component basisvoorziening voor een begrotingsjaar wordt bepaald op 75 procent van het na
      toepassing van de[ artikelen 2.22 tot en met 2.25][ref1] voor dat begrotingsjaar resterende landelijk beschikbare
      deel academische ziekenhuizen.

      2 Uit de landelijke component basisvoorziening, bedoeld in het eerste lid, wordt voor elke universiteit een bedrag
      van € 13 613 400 toebedeeld aan de component basisvoorziening van die universiteit.

      3 Het na toepassing van het tweede lid resterende gedeelte van de landelijke component basisvoorziening wordt over
      de universiteiten verdeeld naar evenredigheid van het aantal van de hieronder opgenomen vierkante meters van een
      academisch ziekenhuis, verbonden aan de hieronder genoemde universiteit:

      a. de openbare universiteit te Leiden 102.189,

      b. de openbare universiteit te Groningen 120.341,

      c. de openbare universiteit te Amsterdam 154.733,

      d. de openbare universiteit te Utrecht 120.947,

      e. de openbare universiteit te Rotterdam 110.834,

      f. de openbare universiteit te Maastricht 72.567,

      g. de bijzondere universiteit te Amsterdam 91.629, en

      h. de bijzondere universiteit te Nijmegen 99.675.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.22
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2.22'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '2.27'
    text: |-
      1 De landelijke component onderwijs en onderzoek voor een begrotingsjaar wordt bepaald op 25 procent van het na
      toepassing van de[ artikelen 2.22 tot en met 2.25][ref1] voor dat begrotingsjaar resterende landelijk beschikbare
      deel academische ziekenhuizen.

      2 Van het bedrag dat beschikbaar is voor de landelijke component onderwijs en onderzoek wordt 30 procent
      gelijkelijk verdeeld over de universiteiten.

      3 Het na toepassing van het tweede lid resterende bedrag wordt over de universiteiten verdeeld op de wijze als
      bepaald in het vierde tot en met zesde lid.

      4 Van het in het derde lid bedoelde bedrag wordt 20 procent over de universiteiten verdeeld naar rato van
      het gemiddeld aantal te bekostigen eerstejaars dat in het tweede en derde kalenderjaar voorafgaand aan het
      begrotingsjaar aan de opleiding voor het beroep van arts van de universiteit ingeschreven staat.

      5 Van het in het derde lid bedoelde bedrag wordt 30 procent over de universiteiten verdeeld naar rato van het
      gemiddeld aantal door de universiteit uitgereikte getuigschriften van het afsluitend examen verbonden aan de
      opleiding voor het beroep van arts in het studiejaar dat eindigt in het tweede, derde en vierde kalenderjaar
      voorafgaand aan het begrotingsjaar.

      6 Van het in het derde lid bedoelde bedrag wordt 50 procent over de universiteiten verdeeld naar rato van het
      gemiddeld aantal proefschriften aan de faculteit der geneeskunde in het tweede, derde en vierde kalenderjaar
      voorafgaand aan het begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.22
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '2.22'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '2.28'
    text: |-
      Indien ten aanzien van een universiteit [artikel 2.25, zesde lid derde volzin][ref1], voor een of meer
      begrotingsjaren toepassing heeft gevonden, worden de teveel toegekende vergoedingen voor rente en afschrijvingen
      met betrekking tot het OCenW-deel van investeringsbedragen, bedoeld in genoemd artikel, over een of meer
      begrotingsjaren verrekend met de component rente en afschrijvingen van het deel academisch ziekenhuis van de
      desbetreffende universiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.25
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.28
    references:
