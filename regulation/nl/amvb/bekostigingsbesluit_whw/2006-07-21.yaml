      het financieel jaarverslag 2004 van de Nederlandse Organisatie voor Wetenschappelijk Onderzoek, en

      b. de opgaven van Onze Minister van Economische Zaken aan Onze minister van de bedragen van de toekenningen
      per universiteit in 2004 voor de subsidieregelingen [Innovatiesubsidie Samenwerkingsprojecten][ref1],
      [Innovatiegerichte Onderzoekprogramma’s][ref2], het Vijfde Kaderprogramma van de Europese Unie en het
      [Besluit subsidies investeringen kennisinfrastructuur (BSIK)][ref3] voorzover toegewezen door Onze Minister van
      Economische Zaken, nadat de bedragen van de toekenningen voor BSIK in verband met de meerjarige looptijd zijn
      gedeeld door 5.


