  - number: '2.10'
    text: |-
      1 De landelijke component proefschriften en ontwerperscertificaten, voor een begrotingsjaar vastgesteld op
      grond van [artikel 2.4][ref1], wordt over de universiteiten verdeeld op basis van het aantal proefschriften en
      ontwerperscertificaten aan een universiteit in het tweede kalenderjaar voorafgaand aan het begrotingsjaar, met
      inachtneming van het tweede tot en met zesde lid.

      2 Ten behoeve van de verdeling van de landelijke component proefschriften en ontwerperscertificaten over de
      universiteiten wordt het aantal proefschriften per universiteit onderscheiden naar:

      a. het aantal proefschriften betreffende een wetenschapsgebied met een laag bekostigingsniveau, en

      b. het aantal proefschriften betreffende een wetenschapsgebied met een hoog bekostigingsniveau.

      3 Het aantal per universiteit te bekostigen proefschriften bedraagt de som van het aantal proefschriften
      betreffende een wetenschapsgebied met een laag bekostigingsniveau en het aantal proefschriften betreffende een
      wetenschapsgebied met een hoog bekostigingsniveau, nadat deze zijn vermenigvuldigd met 1 onderscheidenlijk 2.

      4 Het aantal per universiteit te bekostigen ontwerperscertificaten bedraagt het aantal ontwerperscertificaten aan
      een universiteit, nadat dat aantal is vermenigvuldigd met 5/3.

      5 Voor de bepaling van de in het eerste lid genoemde aantallen wordt uitgegaan van de gegevens die door de
      desbetreffende universiteit vergezeld van een verklaring van een accountant aan Onze minister worden verstrekt
      uiterlijk op 1 maart van het voorafgaande begrotingsjaar. De universiteit geeft bij het leveren van de gegevens aan
      op welk wetenschapsgebied een proefschrift betrekking heeft.

      6 De landelijke component proefschriften en ontwerperscertificaten wordt over de universiteiten verdeeld naar rato
      van het aantal proefschriften, berekend op grond van het derde lid, en het aantal ontwerperscertificaten, berekend
      op grond van het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.10
