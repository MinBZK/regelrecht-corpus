  - number: 2.6c
    text: |-
      1 De landelijke component basisvoorziening onderwijs, voor een begrotingsjaar vastgesteld op grond van artikel
      2.4, wordt over de universiteiten verdeeld op basis van de omvang van de component basisvoorziening onderwijs per
      universiteit in het voorafgaande begrotingsjaar, met inachtneming van het tweede tot en met zevende lid.

      2 Ten behoeve van de verdeling van de component basisvoorziening onderwijs over de universiteiten worden het bedrag
      basisvoorziening onderwijs plus en het bedrag compensatie onderwijs onderscheiden.

      3 Het bedrag basisvoorziening onderwijs plus omvat de op grond van artikel 2.4 vastgestelde component
      basisvoorziening onderwijs, vermeerderd met de op grond van artikel 2.4 vastgestelde component getuigschriften
      en verminderd met 50% van het op grond van artikel 2.4 vastgestelde onderwijsdeel, nadat dat bedrag is verminderd
      met de op grond van artikel 2.4 vastgestelde bedragen voor de numerus fixus, de werkplaats diergeneeskunde en de
      werkplaats tandheelkunde.

      4 Het bedrag compensatie onderwijs omvat de op grond van artikel 2.4 vastgestelde component getuigschriften,
      verminderd met 50% van het op grond van artikel 2.4 vastgestelde onderwijsdeel, nadat dat bedrag is verminderd
      met de op grond van artikel 2.4 vastgestelde bedragen voor de numerus fixus, de werkplaats diergeneeskunde en de
      werkplaats tandheelkunde.

      5 Het bedrag basisvoorziening onderwijs plus wordt over de universiteiten verdeeld naar rato van de omvang van het
      bedrag basisvoorziening onderwijs plus per universiteit in het voorafgaande begrotingsjaar.

      6 Het bedrag compensatie onderwijs wordt over de universiteiten verdeeld naar rato van de omvang van het bedrag
      compensatie onderwijs per universiteit in het voorafgaande begrotingsjaar.

      7 De component basisvoorziening onderwijs per universiteit is het bedrag per universiteit, bedoeld in het vijfde
      lid, verminderd met het bedrag per universiteit, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.6c
  - number: 2.6d
    text: |-
      De landelijke bedragen ten behoeve van de numerus fixus geneeskunde, de werkplaats diergeneeskunde, de werkplaats
      tandheelkunde en de numerus fixus klinische technologie, voor een begrotingsjaar vastgesteld op grond van
      [artikel 2.4][ref1], worden over de universiteiten verdeeld naar rato van de omvang van die bedragen per
      universiteit in het voorafgaande begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.6d
