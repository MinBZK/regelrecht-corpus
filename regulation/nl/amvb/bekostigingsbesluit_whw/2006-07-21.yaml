  - number: '2.1'
    text: |-
      De bepalingen van dit hoofdstuk hebben betrekking op de universiteiten, bedoeld in [artikel 2.1 van de wet][ref1],
      waarvoor de rijksbijdrage wordt vastgesteld door Onze Minister van Onderwijs, Cultuur en Wetenschap. Deze
      bepalingen zijn van overeenkomstige toepassing op de openbare universiteit te Wageningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2.1'
  - number: '2.2'
    text: |-
      1 In dit hoofdstuk wordt onder eerstejaars verstaan degene die:

      a. voor de eerste maal op 1 oktober als student is ingeschreven aan de universiteit in de periode, te rekenen vanaf
      het vijfde studiejaar voorafgaande aan die datum,

      b. het collegegeld, bedoeld in de [artikelen 7.43][ref1] en [7.44 van de wet][ref2], is verschuldigd en geen
      vrijstelling van het betalen van collegegeld op grond van [artikel 7.48, vierde lid, van de wet][ref3] heeft
      verkregen, en

      c. niet reeds in het bezit is van een getuigschrift van het met goed gevolg afgelegd afsluitend examen van een
      bacheloropleiding in het hoger beroepsonderwijs of van een opleiding in het hoger beroepsonderwijs.

      2 In dit hoofdstuk wordt onder eerstejaars tevens verstaan degene die:

      a. in het bezit is van een getuigschrift van het met goed gevolg afgelegd afsluitend examen van een
      bacheloropleiding in het hoger beroepsonderwijs of van een opleiding in het hoger beroepsonderwijs, en

      b. voor de eerste maal op 1 oktober als student is ingeschreven voor een masteropleiding of voor een ongedeelde
      opleiding aan de universiteit in de periode, te rekenen vanaf het vijfde studiejaar voorafgaande aan die datum, en

      c. het collegegeld, bedoeld in de [artikelen 7.43][ref4] en [7.44 van de wet][ref5], is verschuldigd en geen
      vrijstelling van het betalen van collegegeld op grond van [artikel 7.48, vierde lid][ref6], van de wet heeft
      verkregen.

      3 In dit hoofdstuk wordt onder getuigschrift verstaan:

      a. een getuigschrift van het met goed gevolg afgelegd afsluitend examen van een bacheloropleiding,

      b. een getuigschrift van het met goed gevolg afgelegd afsluitend examen van een masteropleiding,

      c. een getuigschrift van het met goed gevolg afgelegd afsluitend examen van een ongedeelde opleiding, en

      d. een getuigschrift van het met goed gevolg afgelegd kandidaatsexamen van een opleiding in het wetenschappelijk
      onderwijs, in welke opleiding blijkens de onderwijs- en examenregeling het instellingsbestuur op 31 december
      2001 een kandidaatsfase en een kandidaatsexamen als bedoeld in [artikel 7.8a van de wet][ref7], zoals
      [dat artikel][ref8] op 31 augustus 2002 luidde, had onderscheiden.

      4 In dit hoofdstuk wordt onder ongedeelde opleiding verstaan een opleiding als bedoeld in
      [artikel 18.15 van de wet][ref9].


