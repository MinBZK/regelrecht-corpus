  - number: '4.1'
    text: |-
      De rijksbijdrage van de Open Universiteit is samengesteld uit:

      a. een deel basisvoorziening,

      b. een prestatiegebonden deel,

      c. een investeringsdeel, en

      d. een deel uitkeringen na ontslag.
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel4.1
  - number: '4.2'
    text: |-
      1 Onze minister stelt jaarlijks ten behoeve van het eerstvolgende kalenderjaar voor de Open Universiteit de omvang
      vast van:

      a. de beschikbare basisvoorziening, en

      b. het prestatiegebonden deel.

      2 Onze minister stelt voor ten hoogste 4 jaren de voor de Open Universiteit beoogde ontwikkeling van de
      rijksbijdrage vast, waarbij de in [artikel 4.3][ref1] bedoelde factoren de grondslag vormen voor de vaststelling
      van de beoogde ontwikkeling van het prestatiegebonden deel. Onze minister stelt de beoogde ontwikkeling van
      de rijksbijdrage vast voor 1 november van het jaar voorafgaand aan het tijdvak waarop die beoogde ontwikkeling
      betrekking heeft.

      3 Ten behoeve van de in het tweede lid bedoelde vaststelling zendt de Open Universiteit aan Onze minister voor
      1 juli van het jaar voorafgaand aan het tijdvak waarop de beoogde ontwikkeling van de rijksbijdrage betrekking
      heeft, haar voornemens betreffende de eerstvolgende 4 kalenderjaren ten aanzien van de in [artikel 4.3][ref2]
      bedoelde factoren. Onze minister kan de Open Universiteit verzoeken ten behoeve van de vaststelling nadere gegevens
      te overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0006338#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '4.3'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006338
        artikel: '4.3'
        hoofdstuk: '4'
  - number: '4.3'
    text: |-
      1 Het prestatiegebonden deel, genoemd in [artikel 4.1, onderdeel b][ref1], omvat ten hoogste 20% van de totale
      rijksbijdrage van de Open Universiteit per jaar en wordt gebaseerd op:

      a. het door Onze minister voor het desbetreffende jaar in aanmerking genomen aantal bewijsstukken en
      getuigschriften, bedoeld in [artikel 7.11, eerste lid][ref2], van de wet, waarbij Onze minister tevens bepaalt dat
      een bepaald percentage van die bewijsstukken en getuigschriften wordt ontvangen door ingeschrevenen bij de Open
      Universiteit, die niet in het bezit zijn van een getuigschrift van een met goed gevolg afgelegd afsluitend examen
      van een universiteit of hogeschool, en

      b. de door Onze minister voor het desbetreffende jaar in aanmerking genomen activiteiten die de Open Universiteit
      verricht ten behoeve van de vernieuwing van het hoger onderwijs.

      2 De activiteiten, bedoeld in het eerste lid onderdeel b, hebben in ieder geval betrekking op:

      a. het bijdragen aan de kwaliteit van het onderwijs aan universiteiten en hogescholen,

      b. het bijdragen aan de verbetering van de organisatie en de inrichting van de onderwijsprogramma’s van
      universiteiten en hogescholen, en

      c. de verbetering van de kwaliteit van het onderwijs en de organisatie en inrichting van de onderwijsprogramma’s
      van de Open Universiteit.

      3 De activiteiten, bedoeld in het tweede lid onderdeel a en b, worden verricht in samenwerkingsverbanden tussen de
      Open Universiteit en één of meer andere instellingen voor hoger onderwijs. De Open Universiteit besteedt jaarlijks
      ten minste € 6 806 700 aan de activiteiten, bedoeld in het eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0006338#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.11
    url: https://wetten.overheid.nl/BWBR0006338/2006-07-21#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0006338
        artikel: '4.1'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7.11'
  - number: '4.5'
    text: |-
      1 Indien uit de jaarverslagen die betrekking hebben op de jaren van het tijdvak, bedoeld in
      [artikel 4.2, derde lid][ref1], blijkt dat minder bewijsstukken en getuigschriften zijn afgegeven of minder
      activiteiten zijn verricht dan door Onze minister op grond van [artikel 4.3][ref2] in aanmerking zijn genomen,
      besluit Onze minister tot vermindering van de beoogde ontwikkeling van het prestatiegebonden deel voor het
      eerstvolgende tijdvak waarvoor de beoogde ontwikkeling van de rijksbijdrage wordt vastgesteld, tot ten hoogste de
      omvang van het prestatiegebonden deel.

      2 Indien op 1 juli van het derde jaar van het tijdvak waarop de vaststelling, bedoeld in [4.2, tweede lid][ref3],
      betrekking heeft, uit het jaarverslag blijkt dat minder dan 80% van de vastgestelde bewijsstukken, getuigschriften
      en activiteiten, bedoeld in [artikel 4.3, eerste lid onderdeel a][ref4], zijn gerealiseerd, dan wel indien dan uit
      het jaarverslag blijkt dat de kwaliteit van de activiteiten ten behoeve van de vernieuwing van het hoger onderwijs,
      bedoeld in [artikel 4.3, eerste lid onderdeel b][ref5], onvoldoende is geweest, wordt het prestatiegebonden
      deel van de rijksbijdrage voor het resterende deel van het tijdvak waarop de vaststelling, bedoeld in
      [artikel 4.2, tweede lid][ref6], betrekking heeft, verminderd.

      3 De vermindering van de rijksbijdrage, bedoeld in het eerste en tweede lid, vindt plaats naar rato van
      het aantal bewijsstukken en getuigschriften dat minder is afgegeven of het aantal activiteiten dat minder
      is verricht ten behoeve van de vernieuwing van het hoger onderwijs, dan door Onze minister op grond van
      [artikel 4.2, tweede lid][ref7], was vastgesteld, met dien verstande dat de vermindering niet meer bedraagt dan de
      omvang van het prestatiegebonden deel van de rijksbijdrage. Ingeval uit het jaarverslag blijkt dat de kwaliteit van
      de activiteiten onvoldoende is geweest, wordt de rijksbijdrage in overeenstemming daarmede verminderd.

      4 Onze minister kan van de vorige leden afwijken, indien het feit dat de vastgestelde beoogde ontwikkeling van de
      factoren van het prestatiegebonden deel niet of niet geheel is gerealiseerd, de Open Universiteit niet kan worden
      tegengeworpen.


