  - number: VIII
    text: |-
      Indien een verzekerde op 31 december 1997 op grond van
      [artikel 9 van het Vergoedingenbesluit particulier verzekerden][ref1] een vergoeding van de kosten van verpleging
      of verzorging ten huize van de verzekerde ontvangt, behoudt hij tot uiterlijk 1 april 1998 aanspraak op die
      vergoeding overeenkomstig de op 31 december 1997 geldende wettelijke voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003935#Artikel9
    url: https://wetten.overheid.nl/BWBR0009002/1999-01-01#ArtikelVIII
    references:
      - id: ref1
