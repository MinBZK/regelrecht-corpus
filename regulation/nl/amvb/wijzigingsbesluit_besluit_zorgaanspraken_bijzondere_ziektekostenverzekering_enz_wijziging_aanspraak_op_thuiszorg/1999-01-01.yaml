        artikel: '9'
  - number: IX
    text: |-
      1 [Artikel I][ref1] treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip.

      2 De [artikelen II][ref2] tot en met [VIII][ref3] treden in werking met ingang van 1 januari 1998, met uitzondering
      van [artikel III, onderdeel A][ref4], en [artikel V, onderdeel C][ref5], die in werking treden met ingang van 1
      januari 1999.


