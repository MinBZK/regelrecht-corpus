preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport en de Staatssecretaris van
    Volksgezondheid, Welzijn en Sport, van 30 september 1997, VPZ/VU-973567, gedaan in overeenstemming met de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Gelet op de artikelen 6, eerste en derde lid, 8, tweede lid, en 45, vierde lid, van de Algemene Wet Bijzondere
    Ziektekosten, de artikelen 8, tweede lid, 8a, tweede lid, en 47, tweede lid, van de Ziekenfondswet en artikel 2,
    tweede lid, van de Wet op de toegang tot ziektekostenverzekeringen;

    De Raad van State gehoord (advies van 22 oktober 1997, no. W13.97.0630);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport en de Staatssecretaris van
    Volksgezondheid, Welzijn en Sport van 3 november 1997, VPZ/VU-973948, uitgebracht in overeenstemming met de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009002/1999-01-01#ArtikelAanhef
articles:
  - number: VI
    text: |-
      Indien een verzekerde op 31 december 1997 op grond van [artikel 15, eerste lid, onder ][ref1] verpleging of
      verzorging gedurende meer dan 3 uren per dag ontvangt, behoudt hij tot uiterlijk 1 juli 1998 aanspraak op die zorg
      overeenkomstig de op 31 december 1997 geldende wettelijke voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel15
    url: https://wetten.overheid.nl/BWBR0009002/1999-01-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '15'
  - number: VII
    text: |-
      1 Een instelling waarmee onmiddellijk voor het tijdstip van inwerkingtreding van dit besluit voor het verlenen
      van de zorg, bedoeld in [artikel 15 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref1], een
      overeenkomst ingevolge [artikel 42, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref2] was gesloten, is
      tot 1 januari 1999 op grond van artikel 8, eerste lid, van die wet toegelaten.

      2 Een instelling die op 31 december 1996 als kruisorganisatie ingevolge
      [artikel 8, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref3] was toegelaten, is tot 1
      januari 1999 op grond van artikel 8, eerste lid, van die wet voor het verlenen van de zorg, bedoeld in
      [artikel 15 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref4], toegelaten.

      3 Een instelling die op 31 december 1996 als instelling voor gezinsverzorging op grond van
      [artikel 39, derde lid, onder ][ref5] subsidie ontving, is tot 1 januari 1999 op grond van
      [artikel 8, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref6] voor het verlenen van de zorg, bedoeld
      in [artikel 15 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref7], toegelaten.

      4 Instellingen als bedoeld in het eerste, tweede en derde lid, die voor 1 januari 1999 aan Onze Minister van
      Volksgezondheid, Welzijn en Sport schriftelijk hebben medegedeeld dat zij vanaf 1 januari 1999 de zorg, bedoeld in
      [artikel 15, eerste lid, van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref8] leveren, zijn met
      ingang van 1 januari 1999 voor het verlenen van die zorg toegelaten.


