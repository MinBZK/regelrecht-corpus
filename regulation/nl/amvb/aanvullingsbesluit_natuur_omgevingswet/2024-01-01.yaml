  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 13 juli 2020, nr. WJZ / 20186584,
    mede namens Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op de vogelrichtlijn, de habitatrichtlijn, de Europese cites-regelgeving, de Europese flegt-regelgeving,
    de Europese houtregelgeving, de Europese invasieve-exotenregelgeving, de Europese zeehondenregelgeving, de
    wildklemverordening, EU-richtlijn 2017/853 over de controle op de verwerving en het voorhanden hebben van
    wapens, het verdrag van Bern, het verdrag van Bonn, het walvisverdrag, de benelux-overeenkomst over jacht
    en vogelbescherming, de Tweede Beschikking van het Comité van Ministers van de Benelux Economische Unie met
    betrekking tot de bescherming van de vogelstand M(76)15, de Beschikking van het Comité van Ministers van de Benelux
    Economische Unie strekkende tot de limitatieve opsomming van de te bezigen geweren en munitie bij de jacht op de
    onderscheiden wildsoorten (M(83)17 en de Beschikking van het Comité van Ministers van de Benelux Economische Unie
    met betrekking tot de jacht en vogelbescherming M(96)8;

    Gelet op de artikelen 2.18, eerste lid, onder f, onder 3°, 2.18, vierde lid, onder b, 2.24, eerste lid, 3.13, 3.15,
    tweede lid, 3.16, tweede lid, 4.3, eerste, tweede lid en derde lid, 5.1, 5.2, 5.7, derde lid, 5.10, 5.11, 5.18,
    5.34, tweede lid, 5.40, tweede lid, 8.1, derde en vijfde lid, 8.2, zesde lid, 8.3, derde lid, 8.4, eerste lid, 8.5,
    15.53, eerste lid, 16.1, eerste lid, 16.15, eerste lid, 16.16, eerste lid, 16.20, tweede lid, 16.55, eerste lid,
    16.139, eerste lid, 17.3, 18.15a, eerste en derde lid, 20.1, vierde lid, 20.2, eerste, vijfde en zevende lid, 20.3,
    eerste lid, 20.6, eerste lid, 20.10, eerste lid, 20.14, tweede, derde en vijfde lid, en 23.1 van de Omgevingswet;

    De Afdeling advisering van de Raad van State gehoord (advies van 22 oktober 2020 nr. W11.20.0270/IV);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 14 december 2020, nr. WJZ /
    20286913, uitgebracht mede namens Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
