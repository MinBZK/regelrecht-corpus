articles:
  - number: IV
    text: |-
      1 Het verbod, bedoeld in [artikel 5.1, tweede lid, aanhef en onder g, van de Omgevingswet][ref1] om
      zonder omgevingsvergunning een flora- en fauna-activiteit te verrichten, geldt niet voor activiteiten als
      bedoeld in de [artikelen 11.37, eerste lid][ref2], [11.39, eerste lid][ref3], [11.46, eerste lid][ref4],
      [11.47, eerste lid][ref5], en [11.54, eerste lid, van het Besluit activiteiten leefomgeving][ref6], die
      aantoonbaar worden uitgevoerd in overeenstemming met de wijze die is beschreven in een gedragscode als
      bedoeld in [artikel 3.31, eerste lid][ref7], of [9.6, vijfde lid, van de Wet natuurbescherming][ref8],
      zoals deze artikelen luidden onmiddellijk voorafgaand aan de inwerkingtreding van
      [artikel 3.1 van de Aanvullingswet natuur Omgevingswet][ref9], waarvoor een goedkeuring van Onze Minister van
      Landbouw, Natuur en Voedselkwaliteit geldt, totdat de periode waarvoor de goedkeuring geldt is verstreken of de
      goedkeuring wordt ingetrokken.

      2 De [artikelen 11.126][ref10] en [11.129, eerste en tweede lid, van het Besluit activiteiten leefomgeving][ref11]
      zijn niet van toepassing op het vellen van houtopstanden en herbeplanten die aantoonbaar worden
      uitgevoerd in overeenstemming met de wijze die is beschreven in een gedragscode als bedoeld in
      [artikel 4.4, eerste lid, onder d, van de Wet natuurbescherming][ref12], zoals dat artikel luidde onmiddellijk
      voorafgaand aan de inwerkingtreding van [artikel 3.1 van de Aanvullingswet natuur Omgevingswet][ref13], waarvoor
      een goedkeuring van Onze Minister van Landbouw, Natuur en Voedselkwaliteit geldt, totdat de periode waarvoor de
      goedkeuring geldt is verstreken of de goedkeuring wordt ingetrokken.

      3 Zolang in het omgevingsplan geen bebouwingscontour jacht is aangewezen, geldt de bij besluit van de
      gemeenteraad aangewezen bebouwde kom, bedoeld in [artikel 3.21, derde lid, van de Wet natuurbescherming][ref14],
      zoals dat artikel luidde onmiddellijk voorafgaand aan de inwerkingtreding van
      [artikel 3.1 van de Aanvullingswet natuur Omgevingswet][ref15], als bebouwingscontour jacht.

      4 Zolang in het omgevingsplan geen bebouwingscontour houtkap is aangewezen, geldt de bij besluit van de
      gemeenteraad aangewezen bebouwde kom, bedoeld in [artikel 4.1, onder a, van de Wet natuurbescherming][ref16],
      zoals dat artikel luidde onmiddellijk voorafgaand aan de inwerkingtreding van
      [artikel 3.1 van de Aanvullingswet natuur Omgevingswet][ref17], als bebouwingscontour houtkap.

      5 [Artikel 11.129, eerste lid, van het Besluit activiteiten leefomgeving][ref18] is van toepassing op degene
      voor wie voor inwerkingtreding van dit besluit een verplichting tot herbeplanting is ontstaan op grond van
      [artikel 4.3, eerste lid, van de Wet natuurbescherming][ref19], zoals dat artikel luidde onmiddellijk voorafgaand
      aan de inwerkingtreding van [artikel 3.1 van de Aanvullingswet natuur Omgevingswet][ref20].

      6 [Artikel 11.129, tweede lid, van het Besluit activiteiten leefomgeving][ref21] is van toepassing op degene
      voor wie voor inwerkingtreding van dit besluit een verplichting tot vervanging van herbeplanting is ontstaan op
      grond van [artikel 4.3, tweede lid, van de Wet natuurbescherming][ref22], zoals dat artikel luidde onmiddellijk
      voorafgaand aan de inwerkingtreding van [artikel 3.1 van de Aanvullingswet natuur Omgevingswet][ref23].

      7 Onherroepelijke ontheffingen als bedoeld in de [artikelen 3.25, vierde lid][ref24], [3.40][ref25] en
      [4.5, eerste lid][ref26], en [4.9 van de Wet natuurbescherming][ref27], zoals deze artikelen luidden onmiddellijk
      voorafgaand aan de inwerkingtreding van [artikel 3.1 van de Aanvullingswet natuur Omgevingswet][ref28],
      gelden als maatwerkvoorschrift als bedoeld in [artikel 11.31, tweede lid][ref29], respectievelijk
      [artikel 11.119, tweede lid, van het Besluit activiteiten leefomgeving][ref30].

      8 Vrijstellingen als bedoeld in de [artikelen 3.25, vierde lid][ref31], en
      [4.5, vierde lid, van de Wet natuurbescherming][ref32], zoals deze artikelen luidden onmiddellijk voorafgaand aan
      de inwerkingtreding van [artikel 3.1 van de Aanvullingswet natuur Omgevingswet][ref33], gelden als maatwerkregels
      als bedoeld in [artikel 11.117, tweede lid, van het Besluit activiteiten leefomgeving][ref34].

      9 Het besluit tot aanwijzing van gebieden als nationaal park, neergelegd in
      [artikel 2 van de Regeling aanwijzing nationale parken][ref35], zoals dat artikel luidde
      onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van [artikel II, onder A][ref36],
      geldt als besluit als bedoeld in [artikel 2.44, derde lid, van de Omgevingswet][ref37] en
      [artikel 3.68 van het Besluit kwaliteit leefomgeving][ref38].

      10 Een register waarin stikstofdepositieruimte is geregistreerd op grond van
      [artikel 5.5a van de Wet natuurbescherming][ref39], zoals dat artikel luidde onmiddellijk voorafgaand aan de
      inwerkingtreding van [artikel 3.1 van de Aanvullingswet natuur Omgevingswet][ref40], geldt als register als
      bedoeld in [artikel 11.71 van het Besluit kwaliteit leefomgeving][ref41].


