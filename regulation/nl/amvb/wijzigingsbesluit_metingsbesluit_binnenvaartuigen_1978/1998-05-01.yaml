articles:
  - number: II
    text: |-
      Ten aanzien van een binnenvaartuig waarvan het vlak van de grootste toegelaten diepgang bij de laatste meting
      is vastgesteld volgens [artikel 5 van het Metingsbesluit Binnenvaartuigen 1978][ref1] zoals dit luidde voor de
      inwerkingtreding van dit besluit, kan bij hermeting het vlak van de grootste toegelaten diepgang op verzoek van de
      belanghebbende worden vastgesteld met toepassing van dat vervallen artikel 5, mits het vaartuig sinds de laatste
      meting geen verbouwing heeft ondergaan die van invloed kan zijn op de vaststelling van dat vlak.


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel5
    url: https://wetten.overheid.nl/BWBR0009497/1998-05-01#ArtikelII
