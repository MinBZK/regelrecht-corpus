        artikel: '9'
        paragraaf: '4'
  - number: '11'
    text: |-
      Bij regeling van Onze Minister kunnen regelen worden gesteld omtrent de omvang van de toelating, bedoeld in
      [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel9
    url: https://wetten.overheid.nl/BWBR0005210/2002-08-09#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005210
        artikel: '9'
        paragraaf: '4'
  - number: '12'
    text: |-
      1 Onze Minister kan personen toelaten om, voor zover de wering en de bestrijding van besmettelijke dierziekten
      zulks noodzakelijk maakt, voor een periode van ten hoogste één jaar onder door hem te stellen regelen door hem
      aangewezen diergeneeskundige handelingen te verrichten.

      2 De regelen, bedoeld in het eerste lid, hebben tenminste betrekking op:

      a. de opleiding die dient te zijn gevolgd alsmede het examen of de onderdelen daarvan die met goed gevolg dienen te
      zijn afgelegd;

      b. de wijze waarop de werkzaamheden worden uitgeoefend, waarbij wordt bepaald of deze onder leiding of op
      aanwijzing en onder controle van een dierenarts moeten geschieden, en

      c. de geldingsduur van de toelating.
    url: https://wetten.overheid.nl/BWBR0005210/2002-08-09#Artikel12
  - number: '13'
    text: |-
      Degene die vóór 1 augustus 2006 de opleiding tot embryotransplanteur of embryotransplanteur/-winner met goed gevolg
      afrondt, kan worden toegelaten tot het als beroep verrichten van handelingen als bedoeld in [artikel 5][ref1]
      indien diegene op 30 juli 2002:

      a. recht heeft op het als beroep verrichten van handelingen als bedoeld in [artikel 5][ref2], of

      b. door Onze Minister is geregistreerd als ingeschreven aan een door hem aangewezen opleiding


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005210#Artikel5
    url: https://wetten.overheid.nl/BWBR0005210/2002-08-09#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005210
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005210
        artikel: '5'
        paragraaf: '3'
  - number: 13a
    text: |-
      Degene die vóór 1 augustus 2006 de opleiding tot dierenartsassistent paraveterinair met goed gevolg afrondt, kan
      worden toegelaten tot het als beroep verrichten van handelingen als bedoeld in [artikel 9, tweede lid][ref1],
      indien diegene op 30 juli 2002:

      a. recht heeft op toelating tot het als beroep verrichten van handelingen met betrekking tot het winnen en
      overzetten van embryo's of eicellen bij dieren en het bij runderen toepassen van epiduraalanesthesie in relatie tot
      dat winnen en overzetten;

      b. recht heeft op toelating tot het als beroep verrichten van diergeneeskundige handelingen als bedoeld in
      [artikel 9, tweede lid][ref2], of

      c. door de minister is geregistreerd als ingeschreven aan een door hem aangewezen opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005210#Artikel9
    url: https://wetten.overheid.nl/BWBR0005210/2002-08-09#Artikel13a
