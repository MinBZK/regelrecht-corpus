    text: |-
      1 Aan een toelating kunnen door Onze Minister nadere voorschriften en beperkingen worden verbonden.

      2 Een toelating, met uitzondering van een toelating, als bedoeld in [artikel 12][ref1], geldt voor onbepaalde tijd.

      3 Een toelating kan door Onze Minister worden ingetrokken, indien gehandeld wordt in strijd met het bepaalde
