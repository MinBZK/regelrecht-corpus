  - number: '9'
    text: |-
      1 Onze Minister laat tot het verrichten van diergeneeskundige handelingen, bedoeld in het tweede lid, toe degene,
      die aantoont dat hij:

      a. een door Onze Minister aangewezen opleiding heeft gevolgd ter verkrijging van de noodzakelijke theoretische en
      praktische vaardigheid om de handelingen, bedoeld in het tweede lid, te kunnen verrichten, en

      b. met goed gevolg een examen heeft afgelegd na de opleiding, bedoeld in onderdeel *a,* waaruit blijkt van
      voldoende theoretische kennis en praktische vaardigheid om de handelingen, bedoeld in het tweede lid, te kunnen
      verrichten.

      2 De handelingen, bedoeld in het eerste lid, zijn:

      a. het onderzoeken van een dier, het toepassen van een behandeling, een operatie daaronder niet begrepen, bij een
      dier, één en ander voor zover zulks strekt ter voorkoming of genezing van een infectieziekte of een parasitaire
      ziekte bij een dier dan wel ter genezing, leniging, onderkenning of opheffing van een aandoening, ziekte of
      ziekteverschijnsel, in- of uitwendig letsel, pijn of gebrek bij dat dier;

      b. het afnemen van bloed en het geven van injecties, andere dan met diergeneesmiddelen als bedoeld in
      [artikel 30, vierde lid, van de Diergeneesmiddelenwet][ref1];

      c. het toepassen bij een dier van een algemene of plaatselijke verdoving;

      d. het verlenen van hulp met betrekking tot de geboorte van een dier, waaronder niet begrepen een operatie;

      e. handelingen ten behoeve van een door een dierenarts uit te voeren verwijdering van een vrucht van een dier
      alsmede het onvruchtbaar maken van een dier.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel30
    url: https://wetten.overheid.nl/BWBR0005210/1996-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '30'
  - number: '10'
    text: |-
      Aan een toelating, als bedoeld in [artikel 9, eerste lid][ref1], worden de voorschriften verbonden dat:

      a. de handelingen, bedoeld in [artikel 9, tweede lid, onderdelen ][ref2] uitsluitend geschieden op aanwijzing van
      en onder controle van een dierenarts;

      b. de handelingen, bedoeld in [artikel 9, tweede lid, onderdelen ][ref3] uitsluitend geschieden onder leiding van
      een dierenarts.


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel9
