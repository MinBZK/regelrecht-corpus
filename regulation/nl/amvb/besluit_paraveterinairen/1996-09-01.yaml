preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 25 september 1990, No. J. 9013239,
    Directie Juridische en Bedrijfsorganisatorische Zaken;


    Gelet op de artikelen 1, tweede lid, en4 van de Wet op de uitoefening van de diergeneeskunde 1990 (Stb. 214);


    De Raad van State gehoord (advies van 14 januari 1991, No. W11.90.0479);


    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 18 september 1991, No.
    J. 9112323, Directie Juridische en Bedrijfsorganisatorische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005210/1996-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      wet: [Wet op de uitoefening van de diergeneeskunde 1990][ref1] (*Stb.* 214).

      fysiotherapie bij dieren: een of meer van de volgende vormen van therapie bij dieren:

      a. bewegingstherapie, als hoedanig wordt aangemerkt het uitvoeren van bewegingen op dieren;

      b. massagetherapie, als hoedanig wordt aangemerkt het toepassen van massagetechnieken op dieren;

      c. fysische therapie in engere zin, als hoedanig wordt aangemerkt het op dieren toepassen van fysische prikkels,
      niet zijnde ioniserende stralen, door middel van:

      1°. electrotherapie, bestaande in laag frequente, midden frequente en hoog frequente stromen alsmede
      electrodiagnostiek bestaande in IT-curve en galvanopalpatie;

      2°. ultra-geluidtherapie, bestaande in behandeling met ultra-geluid, al of niet in combinatie met chemische
      middelen;

      3°. thermotherapie, bestaande in behandeling met verschillende warmte- en koude-applicaties;

      4°. hydrotherapie, bestaande in behandeling met water in diverse toepassingsvormen met hydrokinetische en
      hydrostatische invloeden;

      5°. balneotherapie, bestaande in behandeling met baden waaraan een chemisch middel is toegevoegd;

      winnen: verkrijgen van een embryo uit een bevrucht dier;

      overzetten: inbrengen in de gastmoeder van een embryo.


      [ref1]: https://wetten.overheid.nl/BWBR0004730
    url: https://wetten.overheid.nl/BWBR0005210/1996-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004730
  - number: '2'
    text: >-
      Onze Minister laat tot het uitoefenen van fysiotherapie bij dieren toe degene, die aantoont dat hij:


      a. de bevoegdheid tot de uitoefening van het beroep van fysiotherapeut bezit ingevolge de Wet op de paramedische
      beroepen (*Stb.* 1963, 113),


      b. een door Onze Minister aangewezen opleiding heeft gevolgd ter verkrijging van de noodzakelijke theoretische
      kennis en praktische vaardigheid om fysiotherapie bij dieren te kunnen uitoefenen, en


      c. met goed gevolg een examen heeft afgelegd na de opleiding, bedoeld in onderdeel *b,* waaruit blijkt van
      voldoende theoretische kennis en praktische vaardigheid om fysiotherapie bij dieren te kunnen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005210/1996-09-01#Artikel2
  - number: '3'
    text: |-
      Aan een toelating, als bedoeld in [artikel 2][ref1], wordt het voorschrift verbonden dat de houder de fysiotherapie
      bij een dier uitsluitend toepast ingevolge verwijzing door een dierenarts met betrekking tot dat dier.


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel2
    url: https://wetten.overheid.nl/BWBR0005210/1996-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005210
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      Onze Minister kan regelen stellen omtrent:

      a. de eisen waaraan de opleiding, bedoeld in [artikel 2, onderdeel ][ref1] dient te voldoen, en

      b. de inrichting en de inhoud van het examen, bedoeld in [artikel 2, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005210#Artikel2
    url: https://wetten.overheid.nl/BWBR0005210/1996-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005210
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005210
        artikel: '2'
        paragraaf: '2'
  - number: '5'
    text: >-
      Met uitoefening van de diergeneeskunde wordt gelijkgesteld het als beroep winnen en overzetten in het kader van het
      transplanteren van embryo's of eicellen bij dieren.
    url: https://wetten.overheid.nl/BWBR0005210/1996-09-01#Artikel5
  - number: '6'
    text: |-
      Onze Minister laat tot het verrichten van handelingen, bedoeld in [artikel 5][ref1], bij runderen alsmede tot
      het toepassen van epiduraalanesthesie ten behoeve van het winnen en het overzetten bij runderen degene toe, die
      aantoont dat hij:

      a. een door Onze Minister aangewezen opleiding heeft gevolgd ter verkrijging van de noodzakelijke theoretische en
      praktische vaardigheid om die handelingen toe te kunnen passen, en

      b. met goed gevolg een examen heeft afgelegd na de opleiding, bedoeld in onderdeel *a,* waaruit blijkt van
      voldoende theoretische kennis en praktische vaardigheid om de handelingen, bedoeld in [artikel 5][ref2], alsmede de
      epiduraalanesthesie bij runderen te kunnen toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005210#Artikel5
    url: https://wetten.overheid.nl/BWBR0005210/1996-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005210
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005210
        artikel: '5'
        paragraaf: '3'
  - number: '7'
    text: |-
      Aan een toelating, als bedoeld in [artikel 6][ref1], wordt het voorschrift verbonden dat de houder overeenkomstig
      de toelating uitsluitend embryo's wint of overzet en de epiduraalanesthesie uitvoert op aanwijzing van en onder
      controle van een dierenarts.


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel6
    url: https://wetten.overheid.nl/BWBR0005210/1996-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005210
        artikel: '6'
        paragraaf: '3'
  - number: '8'
    text: |-
      Onze Minister kan regelen stellen omtrent:

      a. de omvang van de toelating, bedoeld in [artikel 6][ref1];

      b. de eisen waaraan de opleiding, bedoeld in [artikel 6, onderdeel ][ref2] dient te voldoen, welke eisen ook
      betrekking kunnen hebben op het toelatingsniveau tot die opleiding;

      c. de inrichting van en de inhoud van het examen, bedoeld in [artikel 6, onderdeel b][ref3];

      d. de wijze waarop de dierenarts dient te worden geïnformeerd over de verrichte handelingen, bedoeld in
      [artikel 5][ref4], en de toegepaste epiduraalanesthesie alsmede de omstandigheden waaronder die plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel6
