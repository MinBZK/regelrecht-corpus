      1 Onze Minister stelt nadere regelen omtrent de wijze waarop om een toelating, als bedoeld in de
      [artikelen 2][ref1], [6][ref2], [9][ref3], [12][ref4] en [13][ref5], kan worden verzocht en welke gegevens
      daarbij dienen te worden verstrekt.

      2 Degene aan wie een toelating, als bedoeld in de [artikelen 2][ref6], [6][ref7], [9][ref8] en [13][ref9], is
      verstrekt, is verplicht indien ten aanzien van diens op de toelating vermelde gegevens ter zake adres of plaats van
      vestiging wijzigingen zijn opgetreden, dan wel heeft opgehouden de werkzaamheden waarvoor de toelating strekt te
      verrichten, Onze Minister daarvan binnen een maand schriftelijk in kennis te stellen.


