  - number: '12'
    text: >-
      1 Onze Minister kan personen toelaten om, voor zover de wering en de bestrijding van besmettelijke dierziekten
      zulks noodzakelijk maakt, voor een periode van ten hoogste één jaar onder door hem te stellen regelen door hem
      aangewezen diergeneeskundige handelingen te verrichten.


      2 De regelen, bedoeld in het eerste lid, hebben tenminste betrekking op:


      a. de opleiding die dient te zijn gevolgd alsmede het examen of de onderdelen daarvan die met goed gevolg dienen te
      zijn afgelegd;


      b. de wijze waarop de werkzaamheden worden uitgeoefend, waarbij wordt bepaald of deze onder leiding of op
      aanwijzing en onder controle van een dierenarts moeten geschieden, en


      c. de geldingsduur van de toelating.
    url: https://wetten.overheid.nl/BWBR0005210/1996-09-01#Artikel12
  - number: '13'
    text: |-
      1 In afwijking van het bepaalde in de [artikelen 2][ref1], [6][ref2], onderscheidenlijk [9][ref3], laat Onze
      Minister op diens verzoek toe

      a. tot het uitoefenen van de fysiotherapie bij dieren, bedoeld in [artikel 2][ref4], degene, die in het bezit
      is van de bevoegdheid tot het uitoefenen van de fysiotherapie, bedoeld in [artikel 2, onderdeel ][ref5] en die
      bewijsstukken overlegt waaruit blijkt, dat hij

      - in een periode van drie jaar voorafgaande aan de inwerkingtreding van dit besluit bij tenminste dertig dieren een
      fysiotherapeutische behandeling heeft toegepast, danwel
      - in het bezit is van een verklaring waaruit blijkt dat een door Onze Minister aangewezen opleiding ter zake
      fysiotherapie bij dieren is gevolgd;

      b. tot het toepassen van de handelingen, bedoeld in [artikel 5][ref6], alsmede het toepassen van
      epiduraalanesthesie, bedoeld in [artikel 6][ref7], degene, die:

      - een verklaring van een dierenarts overlegt waaruit blijkt dat deze werkzaamheden reeds zijn verricht op
      aanwijzing van en onder controle van een dierenarts vóór de inwerkingtreding van dit besluit, dan wel
      - een verklaring van een dierenarts overlegt waaruit blijkt dat hij in staat is de betrokken handelingen te
      verrichten;

      c. tot het verrichten van diergeneeskundige handelingen, bedoeld in [artikel 9, tweede lid][ref8], degene, die:

      - een verklaring van een dierenarts overlegt waaruit blijkt dat deze werkzaamheden reeds zijn verricht onder de
      leiding dan wel op aanwijzing van en onder controle van een dierenarts vóór de inwerkingtreding van dit besluit,
      dan wel
      - een bewijsstuk overlegt waaruit blijkt dat met goed gevolg een door Onze Minister aangewezen opleiding tot
      dierenarts-assistent is gevolgd.

      2 Een verzoek voor een toelating, als bedoeld in het eerste lid, onderdeel *a,* eerste gedachtenstreepje,
      onderscheidenlijk onderdeel *b,* eerste gedachtenstreepje, onderscheidenlijk onderdeel *c,* eerste
      gedachtenstreepje, dient binnen een jaar na inwerkingtreding van dit besluit bij Onze Minister te worden ingediend.

      3 Een verzoek voor een toelating, als bedoeld in het eerste lid, onderdeel *a,* tweede gedachtenstreepje,
      onderscheidenlijk onderdeel *b,* tweede gedachtenstreepje, onderscheidenlijk onderdeel *c,* tweede
      gedachtenstreepje, kan slechts worden ingediend totdat de opleiding, bedoeld in [artikel 2][ref9],
      onderscheidenlijk [artikel 6][ref10], onderscheidenlijk [artikel 9, eerste lid, onderdeel ][ref11] is aangewezen en
      daarvan mededeling is gedaan in de Staatscourant.

      4 Totdat op een verzoek, als bedoeld in het eerste lid, is beslist, wordt een verzoek tot toelating gelijkgesteld
      met een toelating.


