---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: kostuum_en_titulatuurbesluit_rechterlijke_organisatie
regulatory_layer: AMVB
publication_date: '2014-09-16'
valid_from: '2015-01-01'
bwb_id: BWBR0009255
url: https://wetten.overheid.nl/BWBR0009255/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 19 september 1997, Directie Wetgeving, nr. 653157/97/6;

    Gelet op artikel 19 van de Wet op de rechterlijke organisatie;

    De Raad van State gehoord (advies van 6 november 1997, nr. W03.79.0609);

    Gezien het nader rapport van Onze Minister van Justitie van 17 december 1997, Directie Wetgeving, nr. 671101/97/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'De rechterlijke ambtenaren voeren de volgende titulatuur:'
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel1
  - number: 1.a
    text: |-
      de rechterlijke ambtenaren met rechtspraak belast, die werkzaam zijn bij een rechtbank, alsmede de hoofdofficieren
      van justitie, de plaatsvervangende hoofdofficieren van justitie, de senior officieren van justitie A, de senior
      officieren van justitie, de officieren van justitie, de substituut-officieren van justitie, de plaatsvervangende
      officieren van justitie, de officieren enkelvoudige zittingen en de plaatsvervangende officieren enkelvoudige
      zittingen, die werkzaam zijn bij een arrondissementsparket, het landelijk parket, het functioneel parket, het
      parket centrale verwerking openbaar ministerie of het parket-generaal: die van edelachtbare heer of vrouwe;
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel1
  - number: 1.b
    text: |-
      de rechterlijke ambtenaren met rechtspraak belast, die werkzaam zijn bij een gerechtshof, de landelijk
      hoofdadvocaat-generaal, alsmede de hoofdadvocaten-generaal, de senior advocaten-generaal, de advocaten-generaal en
      de plaatsvervangende advocaten-generaal, die werkzaam zijn bij het ressortsparket of het parket-generaal: die van
      edelgrootachtbare heer of vrouwe;
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel1
  - number: 1.c
    text: |-
      de rechterlijke ambtenaren met rechtspraak belast, die werkzaam zijn bij de Hoge Raad, de procureur-generaal, de
      plaatsvervangend procureur-generaal, de advocaten-generaal en de advocaten-generaal in buitengewone dienst bij de
      Hoge Raad, alsmede de griffier en de substituut-griffier van de Hoge Raad: die van edelhoogachtbare heer of vrouwe;
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel1
  - number: 1.d
    text: 'de procureurs-generaal die het College van procureurs-generaal vormen: die van edelgrootachtbare heer of vrouwe.'
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel1
  - number: '2.1'
    text: |-
      De in artikel 1 genoemde rechterlijke ambtenaren, en degenen die door het bestuur zijn aangewezen of benoemd voor
      het verrichten van griffierswerkzaamheden en de waarnemend griffiers bij de Hoge Raad zijn gekleed in het voor
      hun ambt voorgeschreven kostuum, bestaande uit een toga en een bef en, met inachtneming van de volgende artikelen,
      een baret, wanneer zij binnen een gebouw, dat als gerechtsgebouw dienst doet, in de uitoefening van hun ambt
      aanwezig zijn op een terechtzitting of wanneer zij in een gebouw als vorenbedoeld anders dan ter terechtzitting een
      ambtsverrichting vervullen, waarbij het dragen van het kostuum gepast is.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel2
  - number: '2.2'
    text: Het eerste lid is niet van toepassing op de procureurs-generaal die het College van procureurs-generaal vormen.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel2
  - number: '3.1'
    text: |-
      De toga is een lange wijde mantel met een staande kraag ter hoogte van ongeveer 4 cm, welke kraag aan de voorzijde
      in het midden een opening heeft van 8 cm. De toga is geheel gemaakt van zwarte stof, neerhangende tot ongeveer
      10 cm boven de grond, in het midden van de achterzijde onder de kraag, evenals zijwaarts aan de bovenkant van de
      wijde mouwen, geplooid ingenomen, met aan de onderkant der mouwen omslagen ter breedte van ongeveer 20 cm en aan de
      voorzijde in het midden van boven tot onder om de 5 cm voorzien van een niet glimmende kleine zwarte knoop, een en
      ander in overeenstemming met de bij dit Reglement gevoegde afbeeldingen.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel3
  - number: '3.2'
    text: |-
      De toga wordt gesloten gedragen. Aan de onderkant der mouwen behoort een voorziening te zijn getroffen, welke het
      terugvallen der mouwen verhindert.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel3
  - number: '4'
    text: |-
      Voor zover de toga is voorzien van banen, zijn deze ter breedte van ongeveer 18 cm evenwijdig aan elkander met een
      tussenruimte van ongeveer 8 cm verticaal aan de voorzijde aangebracht en wel van de bovenkant van elke schouder af
      tot aan de onderkant der toga.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel4
  - number: '5.1'
    text: |-
      De toga van de rechterlijke ambtenaren met rechtspraak belast, werkzaam bij de Hoge Raad, van de procureur-
      generaal, van de plaatsvervangend procureur-generaal, van de advocaten-generaal en van de advocaten-generaal in
      buitengewone dienst bij de Hoge Raad en van de griffier van de Hoge Raad is van zijde met banen en mouwomslagen van
      zwart fluweel.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel5
  - number: '5.2'
    text: |-
      De toga van de president van en de procureur-generaal bij de Hoge Raad is aan de buitenwaartse randen van de banen
      en aan de bovenzijde van de mouwomslagen voorzien van een hermelijnen boordsel.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel5
  - number: '5.3'
    text: |-
      De toga van de substituut-griffier en van de waarnemende griffiers van de Hoge Raad is van zijde zonder banen met
      mouwomslagen van zwart fluweel.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel5
  - number: '6.1'
    text: |-
      De toga van de rechterlijke ambtenaren, bedoeld in [artikel 1, onderdeel b][ref1], is van dof grein of van een
      hierop gelijkende stof met banen en mouwomslagen van zwarte zijde. Het gedeelte tussen de banen is van zwart moiré.


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel1
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '1'
        hoofdstuk: Eerste
  - number: '6.2'
    text: |-
      De toga van degenen die door het bestuur van het gerechtshof zijn aangewezen of benoemd voor het verrichten van
      griffierswerkzaamheden bij een gerechtshof is van dof grein of van een hierop gelijkende stof zonder banen en
      mouwomslagen van zwarte zijde.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel6
  - number: '7.1'
    text: |-
      De toga van de rechterlijke ambtenaren, bedoeld in [artikel 1, onderdeel a][ref1], is van dof grein of van een
      hierop gelijkende stof met banen en mouwomslagen van zwarte zijde.


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel1
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '1'
        hoofdstuk: Eerste
  - number: '7.2'
    text: |-
      De toga van degenen die door het bestuur van de rechtbank zijn aangewezen of benoemd voor het verrichten van
      griffierswerkzaamheden bij een rechtbank is van dof grein of van een hierop gelijkende stof zonder banen en
      mouwomslagen van zwarte zijde.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel7
  - number: '10.1'
    text: |-
      De bef bestaat uit twee aan de bovenzijde aan elkander bevestigde stukken geplooid wit batist of een hierop
      gelijkende stof, beide stukken tezamen in geplooide toestand aan de bovenzijde 8 cm breed.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel10
  - number: '10.2'
    text: De bef heeft een lengte van 30 cm en mag aan de onderzijde niet breder zijn dan 15 cm.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel10
  - number: '10.3'
    text: |-
      De bef wordt zodanig bevestigd, dat hetgeen zonder van de toga deel uit te maken om de hals wordt gedragen niet
      zichtbaar is.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel10
  - number: '10.4'
    text: |-
      Het bepaalde in het vorige lid is niet van toepassing indien en voor zover een gesteven witte boord met witte strik
      wordt gedragen.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel10
  - number: '11'
    text: |-
      De baret is rond en heeft een staande rand ter hoogte van 5 cm en een 5 cm buiten die rand uitstekend plat
      geplooid bovenstuk, dat in het midden is voorzien van een platte knoop, bekleed met de stof, waarvan de baret is
      vervaardigd, een en ander in overeenstemming met de bij dit besluit gevoegde afbeeldingen.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel11
  - number: '12.1'
    text: |-
      De baret van de rechterlijke ambtenaren met rechtspraak belast, werkzaam bij de Hoge Raad, van de procureur-
      generaal, de plaatsvervangend procureur-generaal, de advocaten-generaal en de advocaten-generaal in buitengewone
      dienst bij de Hoge Raad en van de griffier van de Hoge Raad is van zwart fluweel met om de rand een hermelijnen
      boordsel.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel12
  - number: '12.2'
    text: |-
      De baret van de substituut-griffier en van de waarnemende griffiers van de Hoge Raad is van zwarte zijde zonder
      boordsel.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel12
  - number: '13.1'
    text: |-
      De baret van de rechterlijke ambtenaren, bedoeld in [artikel 1, onderdeel b][ref1], is van zwart fluweel, die van
      de advocaten-generaal en de plaatsvervangend advocaten-generaal met de rand in zwarte zijde geborduurd met eiken-en
      oranjetakken als aangegeven in de bij dit besluit gevoegde afbeelding.


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel1
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '1'
        hoofdstuk: Eerste
  - number: '13.2'
    text: |-
      De rechterlijk ambtenaar met rechtspraak belast die tevens president is van een gerechtshof kan een baret dragen
      met de rand in zwarte zijde geborduurd met eiken- en oranjetakken als aangegeven in de bij dit besluit gevoegde
      afbeelding.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel13
  - number: '13.3'
    text: |-
      De baret van degenen die door het bestuur van het gerechtshof zijn aangewezen of benoemd voor het verrichten van
      griffierswerkzaamheden bij een gerechtshof is van zwarte zijde of van dezelfde stof als waarvan de daarbij gedragen
      toga is vervaardigd.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel13
  - number: '14.1'
    text: |-
      De baret van de rechterlijke ambtenaren, bedoeld in [artikel 1, onderdeel a][ref1], is van zwarte zijde, die van de
      hoofdofficier van justitie met de rand van zwart fluweel.


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel1
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '1'
        hoofdstuk: Eerste
  - number: '14.2'
    text: |-
      De rechterlijk ambtenaar met rechtspraak belast die tevens president is van een rechtbank kan een baret dragen met
      de rand van zwart fluweel.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel14
  - number: '14.3'
    text: |-
      De baret van degenen die door het bestuur van de rechtbank zijn aangewezen of benoemd voor het verrichten van
      griffierswerkzaamheden bij een rechtbank is van zwarte zijde of van dezelfde stof als waarvan de daarbij gedragen
      toga is vervaardigd.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel14
  - number: '17'
    text: |-
      Tenzij het bestuur van een gerecht of de president van de Hoge Raad voor plechtige terechtzittingen anders bepaalt,
      kan de baret tijdens de terechtzitting of de ambtsverrichting ter zijde worden gelegd.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel17
  - number: '18'
    text: |-
      De raadsheer-plaatsvervanger in een gerechtshof, de rechter-plaatsvervanger in een rechtbank, de plaatsvervangend
      advocaat-generaal, de plaatsvervangend officier van justitie en de plaatsvervangend officier enkelvoudige zittingen
      zijn, wanneer zij tijdens de vervulling van hun ambt ingevolge het bepaalde in artikel 2 een ambtskostuum dragen,
      gekleed hetzij in het kostuum, behorende bij het door hen waargenomen ambt, hetzij in het kostuum van de advocaat.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel18
  - number: '19'
    text: |-
      De rechterlijk ambtenaar, werkzaam bij het openbaar ministerie, die wordt belast met de waarneming van een ander
      rechterlijk ambt bij het openbaar ministerie, is, wanneer hij tijdens het vervullen van de werkzaamheden behorende
      bij dat andere ambt het in [artikel 2][ref1] bedoelde kostuum moet dragen, gekleed in het voor zijn eigen ambt
      voorgeschreven kostuum.


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel2
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '2'
        hoofdstuk: Tweede
  - number: '20.1'
    text: |-
      Tijdens plechtige terechtzittingen en eveneens wanneer zij in het bij artikel 2 bedoelde kostuum een buiten een
      gerechtsgebouw plaats vindende openbare plechtigheid bijwonen, dragen de aldaar genoemde personen onder de toga
      donkere kleding en zwarte schoenen.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel20
  - number: '20.2'
    text: |-
      Het bestuur van een gerecht of de president van de Hoge Raad is bevoegd ter gelegenheid van een terechtzitting of
      plechtigheid als in het eerste lid bedoeld, het dragen van ridderorden en eretekenen voor te schrijven. Deze dienen
      alsdan door hen, die daartoe gerechtigd zijn, gedragen te worden in modelformaat overeenkomstig het gebruik en
      overeenkomstig de desbetreffende statuten en reglementen.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel20
  - number: '21'
    text: |-
      Individueel ten Hove verschijnende of openbare plechtigheden bijwonende, kunnen de in artikel 1 genoemde
      rechterlijke ambtenaren een kostuum dragen, bestaande uit:
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel21
  - number: 21.a
    text: |-
      een geklede zwarte lakense rok, met zwarte zijde gevoerd en voorzien van zakken met kleppen, van mouwen met
      omslagen en van de navolgende knopen met rijkswapen: 9 stuks aan de voorzijde, 2 stuks in de taille, 2 stuks op de
      onderzijde van de rokpanden en 3 stuks onder elke zakklep;
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel21
  - number: 21.b
    text: een zwarte lakense broek met op de buitennaden een galon ter breedte van 4 cm;
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel21
  - number: 21.c
    text: |-
      een tweebladige steek met zwarte liggende struisveren, oranje cocarde, een lis van zes strengen en een knoop als
      op de rok; bij welk kostuum wordt gedragen een degen met verguld gevest in een zwarte schede; een en ander met
      inachtneming van het bepaalde bij de artikelen 22 tot en met 26 en in overeenstemming met de afbeeldingen, welke
      door Onze Minister van Justitie zullen worden bewaard.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel21
  - number: '22.1'
    text: |-
      De rok, gedragen door de rechterlijke ambtenaren met rechtspraak belast, werkzaam bij de Hoge Raad, de procureur-
      generaal, de plaatsvervangend procureur-generaal, de advocaten-generaal en de advocaten-generaal in buitengewone
      dienst bij de Hoge Raad, zomede de griffier van de Hoge Raad is in goud geborduurd met eiken- en oranjetakken op
      de kraag, op de zakkleppen, op het rugstuk tussen deze kleppen en op de omslagen der mouwen, het borduursel ter
      breedte van 6 cm, de knopen verguld.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel22
  - number: '22.2'
    text: De broek, gedragen door de in het eerste lid genoemde rechterlijke ambtenaren, is voorzien van goudgalon.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel22
  - number: '22.3'
    text: De steek, gedragen door de in het eerste lid genoemde rechterlijke ambtenaren, heeft een lis van goud.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel22
  - number: '23.1'
    text: |-
      De rok, gedragen door de rechterlijke ambtenaren, bedoeld in [artikel 1, onderdeel b][ref1], alsmede degenen die
      door het bestuur zijn aangewezen of benoemd voor het verrichten van griffierswerkzaamheden bij een gerechtshof is
      in zilver geborduurd met eiken- en oranjetakken op de kraag, op de zakkleppen, op het rugstuk tussen deze kleppen
      en op de omslagen der mouwen, het borduursel ter breedte van 6 cm, de knopen verzilverd.


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel1
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '1'
        hoofdstuk: Eerste
  - number: '23.2'
    text: De broek, gedragen door de in het eerste lid genoemde rechterlijke ambtenaren, is voorzien van zilvergalon.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel23
  - number: '23.3'
    text: De steek, gedragen door de in het eerste lid genoemde rechterlijke ambtenaren, heeft een lis van zilver.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel23
  - number: '24.1'
    text: |-
      De rok, gedragen door de rechterlijke ambtenaren, bedoeld in [artikel 1, onderdeel a][ref1], en degenen die door
      het bestuur zijn aangewezen of benoemd voor het verrichten van griffierswerkzaamheden bij een rechtbank, is in
      zilver geborduurd met eiken- en oranjetakken op de kraag, op de zakkleppen, op het rugstuk tussen deze kleppen en
      op de omslagen der mouwen, het borduursel ter breedte van 4 cm, de knopen verzilverd.


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel1
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '1'
        hoofdstuk: Eerste
  - number: '24.2'
    text: De broek, gedragen door de in het eerste lid genoemde rechterlijke ambtenaren, is voorzien van zilvergalon.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel24
  - number: '24.3'
    text: De steek, gedragen door de in het eerste lid genoemde rechterlijke ambtenaren, heeft een lis van zilver.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel24
  - number: '26'
    text: |-
      Het in [artikel 21][ref1] bedoelde kostuum voor de substituut-griffier van de Hoge Raad is gelijk aan het
      kostuum dat in [artikel 22][ref2] is voorgeschreven voor de griffier van de Hoge Raad, met dien verstande dat het
      borduursel op de omslagen van de mouwen de halve breedte heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009255#Artikel22
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '21'
        hoofdstuk: Derde
      - id: ref2
        bwb_id: BWBR0009255
        artikel: '22'
        hoofdstuk: Derde
  - number: '27.1'
    text: |-
      De advocaten, in hun hoedanigheid binnen een gebouw, dat als gerechtsgebouw dienst doet, optredende ter
      terechtzitting van een in [artikel 1][ref1] genoemd college of ter gelegenheid van een ambtsverrichting bij de
      vervulling waarvan het college of de hiervan lid zijnde rechterlijke ambtenaar het kostuum draagt, zomede tijdens
      hun beëdiging zijn gekleed in toga met bef.


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel1
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '1'
        hoofdstuk: Eerste
  - number: '27.2'
    text: |-
      De advocaten mogen de toga met bef eveneens dragen, wanneer zij in hun hoedanigheid binnen een gebouw, dat
      als gerechtsgebouw dienst doet, optreden ter terechtzitting van een kantonrechter of ter gelegenheid van een
      ambtsverrichting, bij de vervulling waarvan de kantonrechter het kostuum draagt.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel27
  - number: '27.3'
    text: |-
      Het bepaalde in het tweede lid is van overeenkomstige toepassing, indien een advocaat in zijn hoedanigheid optreedt
      voor een niet in [artikel 1][ref1] genoemd rechtscollege, waarvan de leden of een lid ter terechtzitting een
      ambtskostuum dragen of draagt.


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel1
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '1'
        hoofdstuk: Eerste
  - number: '27.4'
    text: |-
      Indien het bestuur van een gerecht of de president van de Hoge Raad ter gelegenheid van een terechtzitting of
      plechtigheid als bedoeld in [artikel 20][ref1] het dragen van ridderorden en eretekenen heeft voorgeschreven, geldt
      zijn voorschrift ook voor de advocaten, die de zitting of plechtigheid bijwonen.


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel20
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '20'
        hoofdstuk: Tweede
  - number: '28'
    text: |-
      De toga van de advocaten is gelijk aan die, welke is omschreven in [artikel 3][ref1], met dien verstande, dat de
      toga is van dof grein of van een hierop gelijkende stof zonder banen met aan de mouwen omslagen van dezelfde stof.


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel3
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '3'
        hoofdstuk: Tweede
  - number: '29.1'
    text: |-
      De door de advocaten te dragen bef is gelijk aan die, welke is omschreven in het
      [eerste en tweede lid van artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel10
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '10'
        hoofdstuk: Tweede
  - number: '29.2'
    text: |-
      De bef wordt door de advocaten zodanig bevestigd, dat hetgeen zonder van de toga deel uit te maken om de hals wordt
      gedragen niet zichtbaar is.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel29
  - number: '29.3'
    text: |-
      Het bepaalde in het vorige lid is niet van toepassing, indien en voor zover een gesteven witte boord met witte
      strik wordt gedragen.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel29
  - number: '30.1'
    text: De advocaten mogen in de gevallen, waarin zij een toga met bef dragen, desverkiezende gedekt zijn met een baret.
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel30
  - number: '30.2'
    text: |-
      De door de advocaten gedragen baret is gelijk aan die, welke is omschreven in [artikel 11][ref1], met dien
      verstande, dat de baret moet zijn van dezelfde stof als waarvan de daarbij gedragen toga is vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel11
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '11'
        hoofdstuk: Tweede
  - number: '33'
    text: 'Dit besluit wordt aangehaald als: Kostuum- en titulatuurbesluit rechterlijke organisatie.'
    url: https://wetten.overheid.nl/BWBR0009255/2015-01-01#Artikel33
