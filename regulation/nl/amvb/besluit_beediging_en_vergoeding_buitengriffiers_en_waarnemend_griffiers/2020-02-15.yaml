$id: besluit_beediging_en_vergoeding_buitengriffiers_en_waarnemend_griffiers
regulatory_layer: AMVB
publication_date: '2020-02-14'
valid_from: '2020-02-15'
bwb_id: BWBR0013133
url: https://wetten.overheid.nl/BWBR0013133/2020-02-15
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 19 november 2001, Directie Wetgeving, nr. 5134479/01/6;

    Gelet op de artikelen 14, vierde lid, en73, derde lid, van de Wet op de rechterlijke organisatie;

    De Raad van State gehoord (advies van 29 november 2001, nr. W03.01.0616/I);

    Gezien het nader rapport van onze Minister van Justitie van 5 december 2001, Directie Wetgeving, nr. 5137512/01/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De buitengriffier, bedoeld in [artikel 14, vierde lid, van de Wet op de rechterlijke organisatie][ref1], legt de
      eed of belofte af ten overstaan van het bestuur van het gerecht. Bij het afleggen van de eed of belofte is een
      getuige aanwezig. De eed of belofte wordt afgelegd volgens het formulier zoals dat is vastgesteld in de bijlage bij
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel14
    url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '14'
  - number: '1.2'
    text: |-
      Na het afleggen van de eed of belofte, bedoeld in het eerste lid, wordt het formulier ondertekend door de
      buitengriffier, de getuige en een lid van het bestuur ten overstaan van wie de eed of belofte is afgelegd.
    url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#Artikel1
  - number: '1.3'
    text: |-
      Het bestuur van het gerecht houdt een register bij waarin de formulieren betreffende de door de buitengriffiers
      afgelegde eed of belofte worden bewaard.
    url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#Artikel1
  - number: '1.4'
    text: |-
      De buitengriffier ontvangt van het bestuur van het gerecht een afschrift van het formulier betreffende de door hem
      afgelegde eed of belofte.
    url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#Artikel1
  - number: '2.1'
    text: |-
      De waarnemend griffier, bedoeld in [artikel 73, derde lid, van de Wet op de rechterlijke organisatie][ref1], legt
      de eed of belofte af ten overstaan van de president van de Hoge Raad. Bij het afleggen van de eed of belofte is een
      getuige aanwezig. De eed of belofte wordt afgelegd volgens het formulier zoals dat is vastgesteld in de bijlage bij
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel73
    url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '73'
  - number: '2.2'
    text: |-
      Na het afleggen van de eed of belofte, bedoeld in het eerste lid, wordt het formulier ondertekend door de
      waarnemend griffier, de getuige en de president van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#Artikel2
  - number: '2.3'
    text: |-
      De president van de Hoge Raad houdt een register bij waarin de formulieren betreffende de door de waarnemend
      griffiers afgelegde eed of belofte worden bewaard.
    url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#Artikel2
  - number: '2.4'
    text: |-
      De waarnemend griffier ontvangt van de president een afschrift van het formulier betreffende de door hem afgelegde
      eed of belofte.
    url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#Artikel2
  - number: '3.1'
    text: |-
      De buitengriffier, bedoeld in [artikel 1][ref1], en de waarnemend griffier, bedoeld in [artikel 2][ref2], ontvangt
      een vergoeding per zitting. Zittingen die op één dag worden gehouden, worden samen als één zitting beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0013133#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013133#Artikel2
    url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013133
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013133
        artikel: '2'
  - number: '3.2'
    text: |-
      De vergoeding, bedoeld in het eerste lid, wordt niet toegekend indien de buitengriffier of de waarnemend griffier
      bij het gerecht werkzaam is op basis van een stage of uitzendovereenkomst, als rechterlijk ambtenaar salaris geniet
      overeenkomstig het bij en krachtens de [Wet rechtspositie rechterlijke ambtenaren][ref1] bepaalde, dan wel dan wel
      als ambtenaar werkzaam bij een gerecht of het openbaar ministerie salaris geniet krachtens arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0008365
    url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008365
  - number: '3.3'
    text: Onze Minister stelt regels ten aanzien van de hoogte van de in het eerste lid bedoelde vergoeding.
    url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#Artikel3
  - number: '4'
    text: De Regeling vergoeding waarnemende griffiers rechterlijke macht wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#Artikel4
  - number: '5'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit beëdiging en vergoeding buitengriffiers en waarnemend griffiers.'
    url: https://wetten.overheid.nl/BWBR0013133/2020-02-15#Artikel6
