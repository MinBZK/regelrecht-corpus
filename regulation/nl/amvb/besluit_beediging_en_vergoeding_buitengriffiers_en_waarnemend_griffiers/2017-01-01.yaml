  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 19 november 2001, Directie Wetgeving, nr. 5134479/01/6;

    Gelet op de artikelen 14, vierde lid, en73, derde lid, van de Wet op de rechterlijke organisatie;

    De Raad van State gehoord (advies van 29 november 2001, nr. W03.01.0616/I);

    Gezien het nader rapport van onze Minister van Justitie van 5 december 2001, Directie Wetgeving, nr. 5137512/01/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013133/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De buitengriffier, bedoeld in [artikel 14, vierde lid, van de Wet op de rechterlijke organisatie][ref1], legt
      de eed of belofte af ten overstaan van het bestuur van het gerecht. Bij het afleggen van de eed of belofte is een
      getuige aanwezig. De eed of belofte wordt afgelegd volgens het formulier zoals dat is vastgesteld in de bijlage bij
      dit besluit.

      2 Na het afleggen van de eed of belofte, bedoeld in het eerste lid, wordt het formulier ondertekend door de
      buitengriffier, de getuige en een lid van het bestuur ten overstaan van wie de eed of belofte is afgelegd.

      3 Het bestuur van het gerecht houdt een register bij waarin de formulieren betreffende de door de buitengriffiers
      afgelegde eed of belofte worden bewaard.

      4 De buitengriffier ontvangt van het bestuur van het gerecht een afschrift van het formulier betreffende de door
      hem afgelegde eed of belofte.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel14
    url: https://wetten.overheid.nl/BWBR0013133/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '14'
  - number: '2'
    text: |-
      1 De waarnemend griffier, bedoeld in [artikel 73, derde lid, van de Wet op de rechterlijke organisatie][ref1], legt
      de eed of belofte af ten overstaan van de president van de Hoge Raad. Bij het afleggen van de eed of belofte is een
      getuige aanwezig. De eed of belofte wordt afgelegd volgens het formulier zoals dat is vastgesteld in de bijlage bij
      dit besluit.

      2 Na het afleggen van de eed of belofte, bedoeld in het eerste lid, wordt het formulier ondertekend door de
      waarnemend griffier, de getuige en de president van de Hoge Raad.

      3 De president van de Hoge Raad houdt een register bij waarin de formulieren betreffende de door de waarnemend
      griffiers afgelegde eed of belofte worden bewaard.

      4 De waarnemend griffier ontvangt van de president een afschrift van het formulier betreffende de door hem
      afgelegde eed of belofte.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel73
    url: https://wetten.overheid.nl/BWBR0013133/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '73'
  - number: '3'
    text: |-
      1 De buitengriffier, bedoeld in [artikel 1][ref1], en de waarnemend griffier, bedoeld in [artikel 2][ref2],
      ontvangt een vergoeding per zitting. Zittingen die op één dag worden gehouden, worden samen als één zitting
      beschouwd.

      2 De vergoeding, bedoeld in het eerste lid, wordt niet toegekend indien de buitengriffier of de waarnemend
      griffier bij het gerecht werkzaam is op basis van een stage op uitzendovereenkomst, als rechterlijk ambtenaar
      salaris geniet overeenkomstig het bij en krachtens de [Wet rechtspositie rechterlijke ambtenaren][ref3]
      bepaalde, dan wel uit hoofde van een aanstelling in een functie bij een gerecht of parket salaris krachtens het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref4] geniet.

      3 Onze Minister stelt regels ten aanzien van de hoogte van de in het eerste lid bedoelde vergoeding.


