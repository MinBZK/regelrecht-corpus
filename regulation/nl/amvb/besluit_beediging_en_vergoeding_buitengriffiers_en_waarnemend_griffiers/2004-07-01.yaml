articles:
  - number: '1'
    text: |-
      1 Bij het afleggen van de eed of belofte door de buitengriffier bedoeld in
      [artikel 14, vierde lid, van de Wet op de rechterlijke organisatie][ref1], is een getuige aanwezig. De eed of
      belofte wordt afgelegd overeenkomstig het formulier dat is gevoegd als bijlage bij dit besluit.

      2 Na het afleggen van de eed of belofte, bedoeld in het eerste lid, wordt het formulier ondertekend door de
      buitengriffier en de getuige en het bestuur die bij de beëdiging aanwezig waren.

      3 Het bestuur van het gerecht, bedoeld in het eerste lid, houdt een register bij waarin het formulier van de eed of
      belofte wordt bewaard.

      4 Het bestuur verstrekt een kopie van het formulier aan de buitengriffier.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel14
    url: https://wetten.overheid.nl/BWBR0013133/2004-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '14'
  - number: '2'
    text: |-
      1 Bij het afleggen van de eed of belofte door de waarnemend griffier bedoeld in
      [artikel 73, derde lid, van de Wet op de rechterlijke organisatie][ref1], is een getuige aanwezig. De eed of
      belofte wordt afgelegd overeenkomstig het formulier dat is gevoegd als bijlage bij dit besluit.

      2 Na het afleggen van de eed of belofte door de waarnemend griffier, wordt het formulier ondertekend door de
      waarnemend griffier en de president en de getuige die bij de beëdiging aanwezig waren.

      3 De president van de Hoge Raad houdt een register bij waarin het formulier van de eed of belofte wordt bewaard.

      4 De president van de Hoge Raad verstrekt een kopie van het formulier aan de waarnemend griffier.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel73
    url: https://wetten.overheid.nl/BWBR0013133/2004-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '73'
  - number: '3'
    text: |-
      1 De buitengriffiers ontvangen een vergoeding van € 91,- per zitting. Zittingen die op één dag worden gehouden,
      worden samen als één zitting beschouwd.

      2 De vergoeding in het eerste lid wordt niet toegekend als een betrokkene bij een gerecht werkzaam is op
      basis van een stage of uitzendovereenkomst en aan hen die reeds een volledige of gedeeltelijke bezoldiging
      ontvangen krachtens de [Wet rechtspositie rechterlijke ambtenaren][ref1] en aan de bij de rechterlijke macht
      behorende werkzame ambtenaren die reeds een gehele of gedeeltelijke bezoldiging ontvangen krachtens het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2].

      3 Het eerste lid is van overeenkomstige toepassing op de waarnemend griffiers bij de Hoge Raad, met dien
      verstande dat de vergoeding niet wordt toegekend aan hen die reeds een volledige of gedeeltelijke bezoldiging
      ontvangen krachtens de [Wet rechtspositie rechterlijke ambtenaren][ref3] en aan de bij de rechterlijke macht
      behorende werkzame ambtenaren die reeds een gehele of gedeeltelijke bezoldiging ontvangen krachtens het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref4].


