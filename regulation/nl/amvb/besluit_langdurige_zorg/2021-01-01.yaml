  - number: 3.3.2.1
    text: |-
      1 De eigen bijdrage bedraagt per maand een twaalfde gedeelte van het bijdrageplichtig inkomen, berekend volgens
      [artikel 3.3.2.3][ref1], voor:

      a. de ongehuwde verzekerde die in een instelling verblijft,

      b. de gehuwde verzekerden tezamen die beiden in een instelling verblijven,

      c. de gehuwde verzekerde die in een instelling verblijft en wiens echtgenoot verblijft in een instelling voor
      beschermd wonen of een persoonsgebonden budget voor beschermd wonen is verleend.

      2 De bijdrage, bedoeld in het eerste lid, bedraagt niet meer dan € 2.469,20 per maand.

      3 In het geval, bedoeld in het eerste lid, onderdeel c, zijn de verzekerde en zijn echtgenoot tezamen slechts
      eenmaal de eigen bijdrage, berekend overeenkomstig het eerste en tweede lid, verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.3
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.3.2.1
