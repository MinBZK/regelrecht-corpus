        artikel: 3.3.2.8
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3.1.5
    text: |-
      1 De eigen bijdrage wordt zo spoedig mogelijk vastgesteld nadat de gegevens, bedoeld in
      [artikel 3.3.1.3, vierde lid, onderdelen a en b][ref1], door het CAK zijn ontvangen.

      2 De eigen bijdrage is verschuldigd met ingang van de maand waarin de verzekerde zorg is verleend of, indien het
      een persoonsgebonden budget betreft, met ingang van de eerste maand waarover dat is verleend, doch ten hoogste
      over de 12 maanden die voorafgaan aan de maand waarin het besluit, waarmee de eigen bijdrage is vastgesteld, aan de
      verzekerde is verzonden.

      3 Uit eigen beweging door het CAK of op aanvraag van de verzekerde kan, in afwijking van het tweede lid, de termijn
      waarover de bijdrage is verschuldigd worden verkort tot ten hoogste een maand of worden besloten dat de bijdrage
      niet verschuldigd is, indien het CAK van oordeel is dat het verzuim om de bijdrage op te leggen:

      a. het gevolg is van een ernstige tekortkoming of vertraging in de gegevensuitwisseling of verwerking daarvan die
      noodzakelijk is voor het vaststellen van de bijdrage;

      b. de tekortkoming of vertraging, bedoeld onder a, niet aan de verzekerde te wijten is; en

      c. zich bijzondere of verzwarende omstandigheden voordoen voor de verzekerde.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.1.3
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.3.1.5
    references:
