        artikel: 3.1.1
  - number: 3.1.3
    text: |-
      1 Logeeropvang als bedoeld in [artikel 3.1.1, eerste lid, onderdeel g, van de wet][ref1] omvat het gedurende
      maximaal 156 etmalen per kalenderjaar door verzekerde logeren in een voor hem beschermende woonomgeving waarin hij
      samenhangende zorg ontvangt.

      2 Indien een indicatiebesluit gedurende een deel van een kalenderjaar geldig is, wordt het maximum aantal etmalen,
      bedoeld in het eerste lid, berekend door het aantal weken in dat kalenderjaar gedurende welke het indicatiebesluit
      geldig is, te vermenigvuldigen met drie.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3.1.1
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.1.3
