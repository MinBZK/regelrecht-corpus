  - number: 3.3.2.2a
    text: |-
      1 In geval aan een verzekerde of gehuwde verzekerden tezamen meerdere leveringsvormen zijn toegekend, wordt met
      het oog op de samenloop van bijdragen bij de toepassing van de [artikelen 3.3.2.1][ref1] en [3.3.2.2][ref2] de
      volgende rangorde in acht genomen bij de verschuldigdheid van bijdragen door de ongehuwde verzekerde of de gehuwde
      verzekerden tezamen:

      1°. verblijf in een instelling;

      2°. een volledig pakket thuis;

      3°. een persoonsgebonden budget; of

      4°. een modulair pakket thuis.

      2 Indien de verzekerde meerdere leveringsvormen, bedoeld in het eerste lid, onderdelen 1° tot en met 4°, ontvangt,
      is telkens enkel de bijdrage voor de bovenstaande leveringsvorm in de rangorde, bedoeld in het eerste lid,
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.2
