  - number: 3.3.2.5
    text: |-
      1 Voor de berekening van het bijdrageplichtig inkomen over het jaar waarin een verzekerde of zijn echtgenoot
      voor het eerst inkomen geniet wordt, in afwijking van [artikel 3.3.2.3, eerste lid, onderdeel a][ref1], of
      [artikel 3.3.2.4, eerste lid][ref2], uitgegaan van het inkomen dat de verzekerde of zijn echtgenoot over het
      desbetreffende kalenderjaar naar verwachting zal genieten, alsmede van het te verwachten vermogen van dat
      kalenderjaar, verminderd met de naar verwachting over dat kalenderjaar verschuldigde of ingehouden belasting.

      2 Voor de berekening van het bijdrageplichtig inkomen over het jaar volgende op het jaar
      waarin een verzekerde of zijn echtgenoot voor het eerst inkomen geniet, wordt, in afwijking van
      [artikel 3.3.2.3, eerste lid, onderdeel a][ref3], of [artikel 3.3.2.4, eerste lid][ref4], uitgegaan van het inkomen
      dat de verzekerde of zijn echtgenoot over het dan lopende kalenderjaar naar verwachting zal genieten, alsmede
      van het te verwachten vermogen van dat kalenderjaar, verminderd met de naar verwachting over dat kalenderjaar
      verschuldigde of ingehouden belasting.

      3 Voor de berekening van het bijdrageplichtig inkomen over het tweede jaar volgend op het jaar waarin een
      verzekerde of zijn echtgenoot voor het eerst inkomen geniet, wordt uitgegaan van de in het tweede lid bedoelde
      bedragen.


