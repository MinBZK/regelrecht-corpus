  - number: 3.3.2.7
    text: |-
      1 Indien ten aanzien van de ongehuwde of gehuwde verzekerden geen gegevens inzake het inkomen of de grondslag
      sparen en beleggen beschikbaar zijn, wordt de eigen bijdrage vastgesteld op het minimumbedrag, genoemd in
      [artikel 3.3.2.2, derde lid][ref1].

      2 Indien na de vaststelling van de eigen bijdrage uit alsnog beschikbaar gekomen gegevens inzake het inkomen of de
      grondslag sparen en beleggen of uit een wijziging van deze gegevens, blijkt dat de eigen bijdrage op een te hoog
      of te laag bedrag is vastgesteld, herziet het CAK de eigen bijdrage met inachtneming van de beschikbaar gekomen
      gegevens dan wel van die wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.2
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.3.2.7
    references:
      - id: ref1
        bwb_id: BWBR0035948
        artikel: 3.3.2.2
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3.2.8
    text: |-
      1 De hoogte van de eigen bijdrage wordt jaarlijks opnieuw berekend voor de periode van de eerste dag van januari
      tot en met de eenendertigste dag van de daaropvolgende maand december.

      2 In afwijking van [artikel 3.3.2.7, eerste lid][ref1], geldt, indien het inkomen bij de jaarlijkse herberekening
      nog moet worden vastgesteld, als eigen bijdrage, de eigen bijdrage die over de laatste maand in het vorige
      kalenderjaar verschuldigd was.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.7
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.3.2.8
    references:
      - id: ref1
        bwb_id: BWBR0035948
        artikel: 3.3.2.7
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3.2.9
    text: |-
      1 Bij de berekening van de eigen bijdrage wordt afwezigheid uit de instelling, anders dan in verband met
      beëindiging van de zorgverlening, buiten beschouwing gelaten.

      2 Over een gedeelte van een maand is de eigen bijdrage gelijk aan het vastgestelde bedrag per maand,
      vermenigvuldigd met twaalf maal het aantal dagen waarover de bijdrage binnen die maand verschuldigd is en gedeeld
      door 365.

      3 Van de voor gehuwde verzekerden gezamenlijk berekende eigen bijdrage is ieder van de echtgenoten een gedeelte
      verschuldigd naar rato van ieders aandeel in het inkomen.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.3.2.9
  - number: 3.4.1
    text: |-
      Degene die, komend van buiten Nederland, in Nederland is gaan wonen en als gevolg daarvan verzekerd is geworden
      in de zin van de wet, heeft gedurende de eerste twaalf maanden na het tijdstip waarop hij zich in Nederland heeft
      gevestigd, geen recht op zorg indien hij op dat tijdstip reeds op de desbetreffende zorg is aangewezen, dan wel
      indien de gezondheidstoestand van betrokkene kennelijk moest doen verwachten, dat hij binnen een half jaar op de
      desbetreffende zorg zou zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.4.1
  - number: 3.4.2
    text: |-
      1 In afwijking van [artikel 3.4.1][ref1] bedraagt voor de daar bedoelde verzekerde die in Nederland is gaan wonen
      binnen twaalf jaar nadat zijn verzekering ingevolge de wet of de [Algemene Wet Bijzondere Ziektekosten][ref2]
      laatstelijk is geëindigd of, indien het een minderjarige betreft, de verzekering ingevolge de wet dan wel de
      Algemene Wet Bijzondere Ziektekosten van zijn wettelijk vertegenwoordiger laatstelijk is geëindigd, de periode
      gedurende welke hij geen recht op de in artikel 3.4.1 bedoelde zorg heeft, een aantal maanden overeenkomend met het
      aantal volle jaren liggende tussen het tijdstip van vestiging in Nederland en het einde van het laatste tijdvak van
      verzekering ingevolge de wet dan wel de Algemene Wet Bijzondere Ziektekosten.

      2 Indien de verzekerde, bedoeld in het eerste lid, in die periode van twaalf jaar ten laste van Nederland recht
      heeft gehad op verstrekkingen met toepassing van een Verordening van de Raad van de Europese gemeenschappen of van
      een verdrag inzake sociale zekerheid waarbij Nederland partij is, wordt het aantal volle jaren gedurende welke hij
      dat recht ten laste van Nederland had, in mindering gebracht op de periode, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.4.2
    references:
      - id: ref1
        bwb_id: BWBR0035948
        artikel: 3.4.1
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002614
  - number: 3.4.3
    text: |-
      De [artikelen 3.4.1][ref1] en [3.4.2][ref2] zijn niet van toepassing op:

      a. vreemdelingen die rechtmatig in Nederland verblijf hebben als bedoeld in
      [artikel 8, onder c en d, van de Vreemdelingenwet 2000][ref3];

      b. personen die hier te lande terugkeren na werkzaam te zijn geweest in het kader van ontwikkelingssamenwerking,
      in een naar het oordeel van Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking als
      ontwikkelingsgebied te beschouwen gebied, alsmede de vorenbedoelde personen vergezellende echtgenoten, eigen en
      aangehuwde kinderen en pleegkinderen;

      c. personen die tot de dag voorafgaand aan het tijdstip waarop zij verzekerd zijn geworden in de zin van
      de wet dan wel de [Algemene wet Bijzondere Ziektekosten][ref4], vergoeding ter zake van de kosten van zorg
      ontvingen op grond van [artikel 3.1.2 van de Invoerings- en aanpassingswet Zorgverzekeringswet][ref5] of
      [artikel 1.22 van het Aanpassingsbesluit Zorgverzekeringswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0035948#Artikel3.4.2
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002614
      [ref5]: https://wetten.overheid.nl/BWBR0018830#Artikel3.1.2
      [ref6]: https://wetten.overheid.nl/BWBR0019289#Artikel1.22
