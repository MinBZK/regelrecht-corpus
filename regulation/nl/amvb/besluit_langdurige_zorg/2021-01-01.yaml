      1 De administratieve werkzaamheden die een op grond van [artikel 4.2.4 van de wet][ref1] aangewezen Wlz-uitvoerder
      verricht, betreffen:

      a. het verzorgen van de administratie ten aanzien van de zorg, verleend aan de verzekerden die wonen in de regio
      waarvoor de Wlz-uitvoerder is aangewezen;

      b. het bevorderen van het administratieve contact tussen de zorgaanbieders in die regio enerzijds en het CAK
      anderzijds.

      2 Ten behoeve van het verrichten van de in het eerste lid bedoelde werkzaamheden beschikt de aangewezen Wlz-
      uitvoerder over een adequate cliëntvolgende bedrijfsadministratie, waarin een verband kan worden gelegd tussen de
      indicatiebesluiten van de Wlz-verzekerden, de in opdracht van Wlz-uitvoerders geleverde zorg en de betalingen van
      zorgaanbieders die deze zorg geleverd hebben.


