  - number: 3.3.2.2
    text: |-
      1 In afwijking van [artikel 3.3.2.1][ref1] bedraagt een eigen bijdrage per maand een twaalfde gedeelte van 10% van
      het bijdrageplichtig inkomen, berekend volgens [artikel 3.3.2.4][ref2] voor:

      a. de ongehuwde verzekerde gedurende de eerste vier maanden van verblijf in een instelling;

      b. de gehuwde verzekerden tezamen, zolang niet ten aanzien van elk van hen een periode van vier maanden is
      verstreken;

      c. de ongehuwde verzekerde die moet of gehuwde verzekerden tezamen die moeten voorzien in de kosten van onderhoud
      van eigen, aangehuwde of pleegkinderen, mits voor die kinderen op grond van de [Algemene Kinderbijslagwet][ref3]
      recht op een uitkering bestaat of aan die kinderen, voor zover ze de leeftijd van 27 jaar nog niet hebben bereikt,
      studiefinanciering is toegekend krachtens de [Wet studiefinanciering 2000][ref4];

      d. de ongehuwde verzekerde of de gehuwde verzekerden tezamen indien de Wlz-uitvoerder het waarschijnlijk
      acht dat het verblijf in de instelling voor de ongehuwde verzekerde, voor beide of voor een van beide gehuwde
      verzekerden binnen vier maanden kan worden beëindigd en terugkeer naar de maatschappij mogelijk is en zal worden
      bewerkstelligd;

      e. de ongehuwde verzekerde of de gehuwde verzekerden tezamen indien de Wlz-uitvoerder aan elk van hen
      deeltijdverblijf in een instelling heeft toegekend.

      2 De eigen bijdrage bedraagt voorts per maand een twaalfde deel van 10% van het bijdrageplichtig inkomen, berekend
      volgens [artikel 3.3.2.4][ref5] voor:

      a. de gehuwde verzekerde die in een instelling verblijft, een volledig pakket thuis, een modulair pakket thuis of
      een persoonsgebonden budget ontvangt, en wiens echtgenoot geen zorg in natura of persoonsgebonden budget ontvangt;

      b. de gehuwde verzekerden tezamen van wie één in een instelling verblijft, een volledig pakket thuis, een modulair
      pakket thuis of een persoonsgebonden budget ontvangt, en de ander een volledig pakket thuis, een modulair pakket
      thuis of een persoonsgebonden budget ontvangt;

      c. de ongehuwde verzekerde die een volledig pakket thuis, een modulair pakket thuis of een persoonsgebonden budget
      ontvangt;

      d. de gehuwde verzekerde die een volledig pakket thuis, een modulair pakket thuis of een persoonsgebonden
      budget ontvangt dan wel deeltijd in een instelling verblijft als bedoeld in het eerste lid, onderdeel e, en
      wiens echtgenoot verblijft in een instelling voor beschermd wonen dan wel daarvoor een persoonsgebonden budget
      is verleend, met dien verstande dat de verzekerde en zijn echtgenoot tezamen de eigen bijdrage slechts eenmaal
      verschuldigd zijn.

      3 De eigen bijdrage, bedoeld in het eerste en tweede lid, bedraagt ten minste € 171,40 en niet meer dan € 899,80
      per maand.

      4 De eigen bijdrage wordt verminderd met € 147 per maand voor:

      a. de ongehuwde verzekerde die een persoonsgebonden budget of een modulair pakket thuis ontvangt;

      b. de gehuwde verzekerden tezamen die beiden een modulair pakket thuis of een persoonsgebonden budget ontvangen of
      van wie één een modulair pakket thuis of een persoonsgebonden budget ontvangt;

      c. de ongehuwde verzekerde en de gehuwde verzekerde die een modulair pakket thuis of een persoonsgebonden
      budget ontvangt indien hij of zijn echtgenoot een maatwerkvoorziening, anders dan voor beschermd
      wonen, dan wel een persoonsgebonden budget, anders dan voor beschermd wonen, op grond van de
      [Wet maatschappelijke ondersteuning 2015][ref6] ontvangt.

      5 In afwijking van het eerste tot en met vierde lid wordt de eigen bijdrage voorlopig vastgesteld op het
      minimumbedrag, genoemd in het derde lid, en verminderd met het kortingsbedrag, genoemd in de aanhef van het
      vierde lid, indien de verzekerde per maand twintig uur of minder aan zorg in natura via een modulair pakket thuis
      ontvangt, indien:

      a. de ongehuwde verzekerde niet tevens een persoonsgebonden budget ontvangt;

      b. de gehuwde verzekerden tezamen beiden een modulair pakket thuis ontvangen of van wie één een modulair pakket
      thuis ontvangt, maar één of beiden geen persoonsgebonden budget of anderszins zorg in natura ontvangen;

      c. de ongehuwde verzekerde of de gehuwde verzekerde die niet tevens een persoonsgebonden budget ontvangt, indien
      hij of zijn echtgenoot een maatwerkvoorziening, anders dan voor beschermd wonen, dan wel een persoonsgebonden
      budget, anders dan voor beschermd wonen, op grond van de [Wet maatschappelijke ondersteuning 2015][ref7] ontvangt;

      d. de ongehuwde verzekerde of de gehuwde verzekerde niet tevens deeltijd in een instelling verblijft als bedoeld in
      het eerste lid, onderdeel e.

      6 Indien het vijfde lid is toegepast, vindt uiterlijk zes maanden na de voorlopige vaststelling, bedoeld in het
      vijfde lid, de definitieve vaststelling plaats. Indien uit de definitieve gegevens over de ontvangen zorg blijkt
      dat de ongehuwde verzekerde of de gehuwde verzekerden ieder meer dan twintig uur aan zorg in natura via een
      modulair pakket thuis heeft of hebben ontvangen, vindt definitieve vaststelling plaats op grond van dit besluit
      zonder toepassing van het vijfde lid.

      7 De onderdelen a en b van het eerste lid zijn niet van toepassing indien:

      a. het een verzekerde betreft van wie het recht op verblijf en de daarbij behorende medisch noodzakelijke
      geneeskundige zorg in verband met een psychische stoornis krachtens zijn zorgverzekering is geëindigd omdat de
      krachtens de [Zorgverzekeringswet][ref8] geldende maximumduur voor die zorg is bereikt, of

      b. het verblijf aanvangt binnen vier maanden na beëindiging van een verblijf in een instelling waarvoor de
      ongehuwde verzekerde of de gehuwde verzekerden tezamen een eigen bijdrage als bedoeld in [artikel 3.3.2.1][ref9]
      verschuldigd was of waren, of

      c. het verblijf aanvangt binnen vier maanden na beëindiging van een verblijf in een instelling voor
      beschermd wonen waarvoor de ongehuwde cliënt of de gehuwde cliënten tezamen een bijdrage als bedoeld in
      [artikel 3.11 van het Uitvoeringsbesluit Wmo 2015][ref10] verschuldigd was of waren.

      8 Voor de berekening van de periode van vier maanden, bedoeld in het zevende lid, worden perioden van verblijf
      in instellingen of waarover een persoonsgebonden budget wordt verleend samengeteld, tenzij tussen twee zodanige
      perioden meer dan zestig dagen zijn verlopen. De eerste volzin is niet van toepassing op verzekerden die maximaal
      twee weken per twee maanden in een instelling verblijven dan wel aan die verzekerden gedurende die perioden een
      persoonsgebonden budget voor beschermd wonen is verleend.

      9 Uit eigen beweging door het CAK of op aanvraag van de verzekerde is de eigen bijdrage niet verschuldigd indien
      de verzekerde die in een instelling verblijft, een volledig pakket thuis, een modulair pakket thuis of een
      persoonsgebonden budget ontvangt:

      a. een inkomen heeft dat gelijk is aan of lager is dan de in
      [artikel 23, eerste en tweede lid, van de Participatiewet][ref11], genoemde normbedragen, die gelden voor de
      verzekerden in de daarbij genoemde burgerlijke staat, waarbij die normbedragen opgehoogd worden met de voor de
      verzekerde op grond van het derde, vierde of vijfde lid, vastgestelde minimale eigen bijdrage; of

      b. op grond van [artikel 13, tweede lid, onderdeel a, van de Participatiewet][ref12] geen uitkering ontvangt.

      10 Bij ministeriële regeling kunnen regels worden gesteld over de verschillende tijdsaanduidingen die per zorgvorm
      worden gehanteerd en de wijze waarop die meetellen voor de berekening van de urengrens, bedoeld in het vijfde en
      zesde lid.


