  - number: 2.1.2
    text: |-
      1 Terstond nadat de verzekerde is ingeschreven verstrekt de Wlz-uitvoerder hem een bewijs van inschrijving, dat de
      verzekerde, desverlangd, bij het tot gelding brengen van zijn recht op zorg kan overleggen.

      2 Het Zorginstituut kan een model vaststellen voor het bewijs van inschrijving, bedoeld in het eerste lid. Het
      Zorginstituut kan technische specificaties vaststellen waaraan een inschrijvingsbewijs moet voldoen als gebruik
      wordt gemaakt van een magneetstripkaart of een chipkaart.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel2.1.2
  - number: 2.1.3
    text: |-
      Indien het Zorginstituut met toepassing van [artikel 35, derde lid, van de Zorgverzekeringswet][ref1]
      zorgverzekeraars op de hoogte heeft gesteld van zijn constatering dat een verzekerde bij twee of meer
      zorgverzekeraars verzekerd is, is [artikel 2.2.1, eerste lid, van de wet][ref2], slechts van toepassing op de
      oudste inschrijving bij een zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel2.2.1
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel2.1.3
