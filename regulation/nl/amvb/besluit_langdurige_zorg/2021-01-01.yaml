      Tot uiterlijk 1 mei 2015 is het [derde lid van artikel 2.10 van het Besluit zorgverzekering][ref1]
      niet van toepassing op de verzekerde aan wie onmiddellijk voorafgaand aan de intrekking van de
      [Algemene Wet Bijzondere Ziektekosten][ref2] een persoonsgebonden budget op grond van die wet was verleend voor
      persoonlijke verzorging als bedoeld in [artikel 4 van het Besluit zorgaanspraken AWBZ][ref3] of voor verpleging als
      bedoeld in [artikel 5 van dat besluit][ref4].


