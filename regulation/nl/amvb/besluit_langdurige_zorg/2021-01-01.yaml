  - number: 6.1.1
    text: |-
      Bij de bespreking, bedoeld in [artikel 8.1.1, eerste lid, van de wet][ref1], tussen de zorgaanbieder en de
      verzekerde die zijn zorg geleverd wenst te krijgen in natura over de wijze waarop de verzekerde zijn leven wenst in
      te richten en de ondersteuning die de verzekerde daarbij van de zorgaanbieder zal ontvangen, wordt in ieder geval
      aandacht besteed aan:

      a. zeggenschap van de verzekerde over de inrichting van zijn leven, waaronder de betrokkenheid van mantelzorgers
      en vrijwilligers;

      b. de mogelijkheid om dagelijks te douchen, tijdige hulp bij toiletgang en het tijdig verwisselen van
      incontinentiemateriaal;

      c. voldoende en gezonde voeding en drinken;

      d. een schone en verzorgde leefruimte;

      e. een respectvolle bejegening, passend bij de eigenheid van de verzekerde, en een veilige en aangename leefsfeer;

      f. mogelijkheden voor de verzekerde tot het beleven van en leven overeenkomstig zijn godsdienst of
      levensovertuiging;

      g. een zinvolle daginvulling en beweging;

      h. de mogelijkheid om dagelijks in de buitenlucht te verkeren; en

      i. ontwikkeling en ontplooiing van de verzekerde waaronder, in geval van deelname aan onderwijs, afstemming met de
      school waar verzekerde is aangemeld of toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel8.1.1
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel6.1.1
