    text: |-
      1 De aanmelding, bedoeld in [artikel 2.2.1, tweede lid, van de wet][ref1], geschiedt door inlevering van een
      volledig ingevuld en door of namens de verzekerde ondertekend formulier.

      2 Het Zorginstituut kan een of meer model-aanmeldingsformulieren vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel2.2.1
