        artikel: 3.1.1
  - number: 3.1.4
    text: |-
      1 De vergoeding van een woningaanpassing, bedoeld in [artikel 3.1.3 van de wet][ref1], betreft kosten voor het
      verrichten van aard- en nagelvaste aanpassingen aan de woning die noodzakelijk zijn in verband met het opheffen van
      ergonomische belemmeringen bij het verlenen van zorg in en direct rond de woning, met uitzondering van de kosten
      van achterstallig onderhoud.

      2 Als een kleinschalig wooninitiatief als bedoeld in [artikel 3.1.3, eerste lid, onderdeel a, van de wet][ref2],
      wordt aangemerkt een woonsituatie waarbij:

      a. minimaal drie en maximaal zesentwintig bewoners een persoonsgebonden budget als bedoeld in de [wet][ref3], de
      [Wet maatschappelijke ondersteuning 2015][ref4], de [Jeugdwet][ref5] of de [Zorgverzekeringswet][ref6] ontvangen
      voor zorg en hiervoor door bundeling van persoonsgebonden budgetten gezamenlijk de zorg inkopen, en

      b. de bewoners verblijven op één woonadres als bedoeld in [artikel 1.1 van de Wet basisregistratie personen][ref7],
      of op verschillende woonadressen binnen een straal van honderd meter, waarin ten minste één gemeenschappelijke
      verblijfsruimte aanwezig is die geschikt is voor het ontplooien van gezamenlijke activiteiten.

      3 Een verzekerde die inwoont bij een ouder, pleegouder of pleegoudervoogd als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref8] wordt niet aangemerkt als bewoner van een kleinschalig wooninitiatief.

      4 Bij ministeriële regeling kan het recht op woningaanpassingen nader worden geregeld en afhankelijk worden gesteld
      van daarbij te stellen voorwaarden.


