      1 Het Zorginstituut voert ten behoeve van de gezamenlijke zorg voor de instandhouding van het elektronisch
      gegevensverkeer, bedoeld in [artikel 9.1.6 van de wet][ref1], de volgende beheertaken uit:

      a. de vaststelling van standaarden die in het elektronisch gegevensverkeer worden gebruikt, en

      b. het beheer van de standaarden, bedoeld in onderdeel a.

      2 Het Zorginstituut bevordert de samenwerking tussen de Wlz-uitvoerders, zorgaanbieders, het CAK en het CIZ op het
      terrein van het elektronisch gegevensverkeer.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de functionele beveiligingseisen voor het bewerken
      en vaststellen van gegevens en over de werkzaamheden van het Zorginstituut voor de instandhouding van het
      elektronische gegevensverkeer.


