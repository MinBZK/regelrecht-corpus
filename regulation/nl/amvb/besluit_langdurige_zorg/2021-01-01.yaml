        bwb_id: BWBR0006251
        artikel: '3'
  - number: 3.6.6
    text: |-
      1 De Sociale verzekeringsbank voert het budgetbeheer uit:

      a. overeenkomstig de beschikking tot verlening van het persoonsgebonden budget, bedoeld in
      [artikel 3.3.3, eerste lid, van de wet][ref1];

      b. overeenkomstig de door de verzekerde met de zorgaanbieder of mantelzorger gesloten, geldige
      overeenkomst die voldoet aan de bij ministeriële regeling gestelde regels en voorwaarden als bedoeld in
      [artikel 3.6.4, derde lid][ref2];

      c. tot afdracht van eventuele loonheffing, premies voor de sociale verzekeringen en inkomensafhankelijke bijdragen
      op grond van de [Zorgverzekeringswet][ref3];

      d. ter verkrijging door de verzekerde van gelden voor het verrichten van betalingen vanuit een bij ministeriële
      regeling te bepalen verantwoordingsvrij bedrag.

      2 Bij ministeriële regeling worden regels gesteld omtrent het staken van betaling door de Sociale verzekeringsbank.
      Deze regels zullen in ieder geval betrekking hebben op betalingen in strijd met wettelijke voorschriften, in strijd
      met beschikkingen omtrent het persoonsgebonden budget of in strijd met overeenkomsten, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3.3.3
      [ref2]: https://wetten.overheid.nl/BWBR0035948#Artikel3.6.4
      [ref3]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.6.6
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: 3.3.3
      - id: ref2
        bwb_id: BWBR0035948
        artikel: 3.6.4
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0018450
  - number: 3.6.7
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld in het belang van een goede uitvoering van het
      persoonsgebonden budget. Deze regels kunnen mede betrekking hebben op:

      a. de hulp van een vertegenwoordiger en beperkingen aan de kring van vertegenwoordigers,

      b. de inhoud, intrekking en wijziging van de beschikking tot verlening en van de beschikking tot vaststelling van
      het persoonsgebonden budget,

      c. de verantwoording en de controle,

      d. het budgetplan,

      e. de uitvoering door de Sociale verzekeringsbank van het budgetbeheer, de werkgeverstaken daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.6.7
  - number: 3.7.1
    text: |-
      1 Aan een verzekerde wordt een vergoeding verstrekt voor kosten van zorg, indien die zorg buiten Nederland is
      verleend en anders dan op de in [artikel 3.3.1, eerste of tweede lid, van de wet][ref1] omschreven wijze is
      verkregen als gevolg van de navolgende omstandigheden:

        - *voortzetting van reeds in Nederland aangevangen zorg:* een verzekerde aan wie zorg wordt verleend, behoudt dit
      recht gedurende ten hoogste dertien weken per kalenderjaar buiten Nederland;
        - *voortzetting van palliatief terminale zorg:* in afwijking van het bepaalde in onderdeel a geldt een periode van
      in totaal ten hoogste één jaar indien het palliatief terminale zorg betreft;
        - *onvoldoende binnenlands zorgaanbod:* een verzekerde kan met voorafgaande toestemming van de Wlz-
      uitvoerder gedurende een periode van ten hoogste één jaar zorg buiten Nederland inroepen, indien, gezien de
      gezondheidstoestand van betrokkene en het te verwachten verloop daarvan, de noodzakelijke zorg binnen Nederland
      niet of niet tijdig kan worden verkregen, in welk geval de in rekening gebrachte kosten vergoed, met dien verstande
      dat voor zover deze kosten die welke in de Nederlandse marktomstandigheden passend zijn te achten overschrijden,
      wordt het meerdere vergoed voor zover dit naar het oordeel van de Wlz-uitvoerder in redelijkheid in rekening is
      gebracht;
        - *verblijf buiten Nederland wegens uitoefening van bedrijf of beroep of uitsluitend wegens studieredenen:* een
      verzekerde die in verband met de uitoefening van bedrijf of beroep al dan niet in dienstbetrekking of uitsluitend
      wegens studieredenen buiten Nederland verblijft, kan zolang deze omstandigheid voortduurt en de betrokkene
      ingevolge de wet verzekerd blijft, buiten Nederland zorg inroepen;
        - *gezinsleden:* onderdeel d is van overeenkomstige toepassing op een verzekerde die met de verzekerde, bedoeld in
      dat onderdeel, deel uitmaakt van een gezamenlijke huishouding als bedoeld in de wet;
        - *spoedeisende zorg bij tijdelijk verblijf:* een verzekerde die gedurende een tijdelijk verblijf buiten Nederland
      onvoorzien en onmiddellijk noodzakelijke zorg moet inroepen die gelet op de gezondheidstoestand van betrokkene en
      het te verwachten verloop daarvan, niet kan worden uitgesteld tot de verzekerde is teruggekeerd in Nederland, kan
      deze zorg gedurende ten hoogste dertien weken ontvangen, welke termijn door de Wlz-uitvoerder kan worden verlengd
      indien de verzekerde om medische redenen niet gerepatrieerd kan worden.

      2 De in rekening gebrachte kosten worden vergoed tot ten hoogste de kosten die in de Nederlandse
      marktomstandigheden in redelijkheid passend zijn te achten, met dien verstande dat de vergoeding in de situatie,
      bedoeld in het eerste lid, onderdeel c, hoger kan zijn.

      3 Indien de verzekerde krachtens [artikel 3.2.5 van de wet][ref2], voor de verleende zorg een bijdrage in de kosten
      is verschuldigd, wordt deze bijdrage door de Wlz-uitvoerder vastgesteld zoveel mogelijk overeenkomstig dit besluit,
      en in mindering gebracht op de in het eerste of tweede lid bedoelde vergoeding.

      4 Het eerste lid is slechts van toepassing indien door een onafhankelijke arts is vastgesteld dat en in welke
      omvang de verzekerde op de desbetreffende zorg is aangewezen.

      5 De verzekerde heeft gedurende het reizen of het tijdelijk verblijven buiten Nederland geen recht op zorg of op
      een vergoeding van de kosten daarvan, indien de zorg aan de verzekerde wordt verleend door een instelling in de zin
      van de [Wet toelating zorginstellingen][ref3].


