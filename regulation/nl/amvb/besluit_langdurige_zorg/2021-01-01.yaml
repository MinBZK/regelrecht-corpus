  - number: 3.1.5
    text: |-
      De verzekerde heeft geen recht op zorg ingevolge de wet indien hij:

      a. krachtens zijn zorgverzekering recht heeft op verpleging en verzorging als bedoeld in [artikel 2.10][ref1] of
      [artikel 2.12, van het Besluit zorgverzekering][ref2], die noodzakelijk is in verband met palliatief terminale
      zorg, tenzij die zorg wordt verleend als voortzetting van zorg ingevolge de wet;

      b. minderjarig is en voornamelijk in verband met complexe somatische problematiek of een lichamelijke handicap is
      aangewezen op verpleging en verzorging als bedoeld in [artikel 2.10 van het Besluit zorgverzekering][ref3];

      c. minderjarig is en in verband met een verstandelijke beperking is aangewezen op zorg en ondersteuning in
      een veilige en vertrouwde leef- en woonomgeving, gericht op opvoeding en het waar mogelijk deelnemen aan het
      maatschappelijk leven zoals bedoeld in het zorgprofiel voor wonen met begeleiding en verzorging.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2.10
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2.12
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel2.10
