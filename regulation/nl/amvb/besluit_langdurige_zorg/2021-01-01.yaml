  - number: 3.1.1
    text: |-
      1 De verzekerde die is aangewezen op zorg, heeft recht op samenhangende zorg behorende bij het bij de verzekerde
      best passende zorgprofiel. Bij ministeriële regeling worden zorgprofielen vastgesteld.

      2 De verzekerde heeft recht op meer zorg dan waarop hij op grond van het eerste lid recht heeft, voor zover meer
      zorg nodig is om te voorzien in zijn behoefte aan zorg.

      3 De aard, inhoud en de omvang van de zorg worden mede bepaald door de stand van de wetenschap en praktijk en, bij
      het ontbreken van een zodanige maatstaf, door hetgeen in het betrokken vakgebied geldt als verantwoorde en adequate
      zorg en diensten.

      4 Het recht op zorg kan nader worden geregeld bij ministeriële regeling. Aan het recht op zorg, met inbegrip van
      het recht op meer zorg, bedoeld in het tweede lid, kunnen bij ministeriële regeling voorwaarden worden verbonden
      en beperkingen worden gesteld. Deze beperkingen kunnen mede betrekking hebben op gebruikelijke zorg en algemeen
      gebruikelijke voorzieningen.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.1.1
  - number: 3.1.2
    text: |-
      1 Het individuele gebruik van mobiliteitshulpmiddelen, bedoeld in
      [artikel 3.1.1, eerste lid, onderdeel e, van de wet][ref1], omvat het gebruik van bij ministeriële regeling
      aangewezen hulpmiddelen voor het zich verplaatsen of laten verplaatsen:

      a. in en rondom de instelling of woning ten behoeve van het behoud of het verbeteren van de zelfredzaamheid, en

      b. in de lokale omgeving ten behoeve van het aangaan of onderhouden van sociale contacten.

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent het gebruik van hulpmiddelen, met inbegrip van
      regels omtrent het vereist zijn en het verkrijgen van voorafgaande toestemming van de Wlz-uitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3.1.1
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.1.2
    references:
