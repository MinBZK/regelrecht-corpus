  - number: 3.3.2.6
    text: |-
      1 Indien[ artikel 3.3.2.3, tweede lid][ref1], of [artikel 3.3.2.5, eerste of tweede lid][ref2], voor zover het
      betreft de afwijking van artikel 3.3.2.3, eerste lid, van toepassing is, worden, in afwijking van artikel 3.3.2.3,
      eerste lid, onderdeel b, subonderdeel 2, twaalf maal het in het lopende kalenderjaar geldende bedrag voor zak-
      en kleedgeld, de in het lopende kalenderjaar te betalen premies voor een zorgverzekering gecorrigeerd voor de
      zorgtoeslag en, indien van toepassing, de algemene korting voor wie de pensioensgerechtigde leeftijd nog niet heeft
      bereikt onderscheidenlijk de algemene korting voor wie de pensioengerechtigde leeftijd heeft bereikt, alsmede extra
      vrijlatingen als bedoeld in artikel 3.3.2.3, eerste lid, onderdeel b, subonderdeel 2, in mindering gebracht.

      2 Indien [artikel 3.3.2.5, eerste lid][ref3], voor zover het betreft de afwijking van
      [artikel 3.3.2.3, eerste lid][ref4], van toepassing is en de werkzaamheden in de loop van het kalenderjaar
      aanvangen, worden de bedragen, bedoeld in artikel 3.3.2.3, eerste lid, onderdeel b, naar rato van het deel van het
      kalenderjaar waarover de inkomsten worden verworven, in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.5
      [ref3]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.5
      [ref4]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.3
