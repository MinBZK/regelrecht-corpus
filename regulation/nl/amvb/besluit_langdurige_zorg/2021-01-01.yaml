  - number: 3.7.2
    text: |-
      1 De verzekerde kan een aan hem verleend persoonsgebonden budget voor ten hoogste dertien weken per kalenderjaar
      tijdens verblijf buiten Nederland gebruiken voor betaling van zorg, indien die zorg is verkregen als voortzetting
      van reeds binnen Nederland aangevangen zorg.

      2 In afwijking van het eerste lid kan de verzekerde voor ten hoogste een jaar tijdens verblijf buiten Nederland een
      persoonsgebonden budget gebruiken voor betaling van voortzetting van palliatief terminale zorg.

      3 Indien de verzekerde langer dan zes weken aaneengesloten buiten Nederland verblijft en daar zorgverleners
      contracteert die niet vallen onder de Nederlandse fiscale en sociale zekerheidswetgeving, wordt het
      persoonsgebonden budget berekend overeenkomstig de volgende formule:

      waarbij wordt verstaan onder:

      A: het aantal weken dat de verzekerde binnen Nederland verblijft;

      B: het getal 52;

      C: het aan de verzekerde verleende persoonsgebonden budget;

      D: het aantal weken dat de verzekerde buiten Nederland verblijft;

      E: het voor het desbetreffende land bij ministeriële regeling vastgestelde aanvaardbaarheidspercentage.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.7.2
  - number: 4.1.1
    text: |-
      1 Ten behoeve van de beoordeling, bedoeld in [artikel 4.1.1, vierde lid, van de wet][ref1], gaat de zorgautoriteit
      ten minste na of de rechtspersoon die de wet wenst te gaan uitvoeren voldoet aan de volgende eisen:

      a. de rechtspersoon behoort tot een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2]
      waarvan ten minste één zorgverzekeraar deel uitmaakt;

      b. de statuten van de rechtspersoon voldoen aan het bij en krachtens [artikel 4.1.2 van de wet][ref3] gestelde;

      c. de rechtspersoon heeft een duidelijke, evenwichtige en adequate organisatiestructuur;

      d. de rechtspersoon heeft een duidelijke, evenwichtige en adequate verdeling van taken, bevoegdheden en
      verantwoordelijkheden;

      e. de rechten en verplichtingen binnen de rechtspersoon zijn adequaat vastgelegd;

      f. de rechtspersoon beschikt over adequate rapportagelijnen en over een adequaat systeem van informatievoorziening
      en communicatie;

      g. de bedrijfsvoering van de rechtspersoon is op een inzichtelijke wijze vastgelegd en is afgestemd op de
      werkzaamheden die de rechtspersoon als Wlz-uitvoerder zal uitvoeren of laten uitvoeren;

      h. gegeven de verwachte beheerskosten die de rechtspersoon als Wlz-uitvoerder zal maken, zal kunnen worden voorzien
      in een recht- en doelmatige uitvoering van de wet.

      2 Ter beoordeling van de vragen, bedoeld in het eerste lid, laat de zorgautoriteit zich door de rechtspersoon zijn
      statuten alsmede een programma van werkzaamheden overleggen.

      3 Het programma van werkzaamheden omvat ten minste een raming van de kosten voor de inrichting van de administratie
      en een raming voor de eerste drie boekjaren van de andere kosten van beheer.

      4 De zorgautoriteit is bevoegd nadere regels te stellen omtrent de inhoud van het programma van werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel4.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0035917#Artikel4.1.2
