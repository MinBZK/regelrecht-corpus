      1 Het CIZ beoordeelt of een verzekerde op grond van [artikel 10.1.4, van de wet][ref1], in aanmerking komt voor
      ADL-assistentie.

      2 Het CIZ beoordeelt of een verzekerde in aanmerking komt voor de vormen van zorg, bedoeld in
      [artikel 11.1.5, eerste lid, van de wet][ref2].

      3 Het CIZ beoordeelt of een verzekerde in aanmerking komt voor medisch noodzakelijk kortdurend verblijf als bedoeld
      in [artikel 11.1.5, derde lid, onderdeel c, van de wet][ref3].

      4 Het CIZ stelt de aanspraak op zorg vast voor in het buitenland wonende personen die verzekerd zijn of met
      toepassing van Verordening (EG) nr. 883/2004 van het Europees Parlement en de Raad van 29 april 2004 betreffende
      de coördinatie van sociale zekerheidsstelsels dan wel toepassing daarvan krachtens de overeenkomst betreffende de
      Europese Economische Ruimte of een verdrag inzake sociale zekerheid tijdens een verblijf in Nederland recht hebben
      op verstrekkingen overeenkomst de Nederlandse wetgeving.

      5 Het besluit, bedoeld in het vierde lid, houdt rekening met de verwachte verblijfsduur van de zorgvrager in
      Nederland en heeft een maximale geldigheidsduur van zes maanden, welke eenmalig kan worden verlengd met maximaal
      zes maanden.

      6 Indien daartoe aanleiding bestaat, verzoekt het CIZ de zorgvrager, bedoeld in het vierde lid, zich te behoeve
      van het onderzoek in persoon te melden. De daaraan verbonden reis- en verblijfskosten zijn voor rekening van de
      zorgvrager.


