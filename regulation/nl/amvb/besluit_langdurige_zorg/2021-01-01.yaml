  - number: 3.3.2.4a
    text: |-
      1 Voor de toepassing van [artikel 3.3.2.4, eerste of tweede lid][ref1], bestaat het bijdrageplichtig inkomen voor
      de berekening van de eigen bijdrage, bedoeld in [artikel 3.3.2.2, eerste of tweede lid][ref2], uit het inkomen
      van de ongehuwde verzekerde, dan wel van de gehuwde verzekerden tezamen, verminderd met de compensatie vervallen
      ouderentoeslag, indien het inkomen van de verzekerde die de pensioengerechtigde leeftijd heeft bereikt, verminderd
      met 4% van dat vermogen, minder dan € 20.540 bedraagt.

      2 De uitkomst van de berekening, bedoeld in het eerste lid, wordt vermeerderd met de vermogensinkomensbijtelling.

      3 De uitkomst van de berekening, bedoeld in het eerste lid, wordt vermeerderd met de compensatie vervallen
      ouderentoeslag van de echtgenoot, indien de echtgenoot van de verzekerde de pensioengerechtigde leeftijd heeft
      bereikt en het inkomen van de echtgenoot, verminderd met 4% van zijn vermogen, minder dan € 20.540 bedraagt.

      4 Het op grond van het eerste en tweede lid berekende bijdrageplichtig inkomen uit het inkomen over het peiljaar
      van de ongehuwde verzekerde, onderscheidenlijk van de gehuwde verzekerden tezamen, wordt verminderd met € 6.226
      indien een verzekerde een modulair pakket thuis of een persoonsgebonden budget ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.4
      [ref2]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.2
