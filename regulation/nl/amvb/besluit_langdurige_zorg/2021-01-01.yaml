  - number: 3.3.1.2a
    text: |-
      1 De compensatie vervallen ouderentoeslag bedraagt een percentage van het vermogen van de verzekerde die
      de pensioengerechtigde leeftijd heeft bereikt. Dat percentage bestaat uit de som van het percentage van de
      vermogensinkomensbijtelling en 4%.

      2 De compensatie vervallen ouderentoeslag bedraagt ten hoogste de som van het percentage van de
      vermogensinkomensbijtelling en 2,8%, vermenigvuldigd met 25.000.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de echtgenoot van de verzekerde.

      4 De vermogensinkomensbijtelling bedraagt 4% van het vermogen van de ongehuwde verzekerde, dan wel de opgetelde
      vermogens van de gehuwde verzekerden.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.3.1.2a
  - number: 3.3.1.3
    text: |-
      1 De verzekerde is de eigen bijdrage verschuldigd aan het CAK.

      2 De verzekerde betaalt de eigen bijdrage binnen dertig dagen nadat het CAK het besluit bekend heeft gemaakt
      waarbij vastgesteld is of en in welke omvang de verzekerde een eigen bijdrage verschuldigd is, tenzij dat besluit
      een later tijdstip vermeldt.

      3 Het CAK is bevoegd tot verrekening van vorderingen krachtens de wet van of op de verzekerde met
      vorderingen van of op de verzekerde krachtens de wet, de [Algemene Wet Bijzondere Ziektekosten][ref1], de
      [Wet maatschappelijke ondersteuning][ref2] of de[ Wet maatschappelijke ondersteuning 2015][ref3].

      4 Het CAK maakt voor de vaststelling van de eigen bijdrage gebruik van:

      a. het inkomensgegeven, bedoeld in [artikel 21, onderdeel e, van de Algemene wet inzake rijksbelastingen][ref4],
      en van andere door de inspecteur, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref5], verstrekte gegevens;

      b. gegevens van het zorgkantoor over het verstrekken van zorg als bedoeld bij of krachtens de wet aan een
      verzekerde waaronder, indien van toepassing, de ingangsdatum van de periode waarover een persoonsgebonden budget
      wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0020031
      [ref3]: https://wetten.overheid.nl/BWBR0035362
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.3.1.3
