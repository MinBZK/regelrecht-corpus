  - number: 3.3.1.4
    text: |-
      1 Een wijziging in de burgerlijke staat van de verzekerde en het bereiken van een voor de toepassing van dit
      besluit van belang zijnde leeftijd door de verzekerde of zijn echtgenoot wordt in aanmerking genomen met ingang van
      de datum waarop de bijdrage wordt vastgesteld, met dien verstande dat bij de jaarlijkse herberekening, bedoeld in
      [artikel 3.3.2.8, eerste lid][ref1], een verzekerde als pensioengerechtigde wordt beschouwd indien hij uiterlijk
      op 31 januari van het kalenderjaar waarop de herberekening betrekking heeft, de pensioengerechtigde leeftijd heeft
      bereikt.

      2 De verzekerde meldt aan het CAK wijzigingen als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.8
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.3.1.4
