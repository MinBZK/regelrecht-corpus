articles:
  - number: 1.1.1
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *ADL-assistentie:* gedurende het gehele etmaal direct oproepbare assistentie bij algemene dagelijkse
      levensverrichtingen in en om de ADL-woning, bedoeld in [artikel 1.1.1 van de wet][ref1], waaronder alarmopvolging
      bij een noodoproep;
        - *belasting:* 1°. indien over het peiljaar een aanslag of navorderingsaanslag inkomstenbelasting
      is of wordt vastgesteld: over dat jaar verschuldigde inkomstenbelasting, bedoeld in
      [artikel 2.7 van de Wet inkomstenbelasting 2001][ref2], vermeerderd met de over dat jaar verschuldigde premie
      voor de volksverzekeringen, bedoeld in [artikel 9 van de Wet financiering sociale verzekeringen][ref3];
      2°. in de overige gevallen: in dat jaar ingehouden loonbelasting, bedoeld in
      [artikel 20 van de Wet op de loonbelasting 1964][ref4], vermeerderd met de in dat jaar ingehouden premie voor de
      volksverzekeringen bedoeld in [artikel 9 van de Wet financiering sociale verzekeringen][ref5];
        - *beschermd wonen:* beschermd wonen als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref6];
        - *budgetplan:* overzicht van de door de verzekerde of diens wettelijk vertegenwoordiger voorgenomen besteding van
      een aan te vragen persoonsgebonden budget;
        - *compensatie vervallen ouderentoeslag:* een aftrek in de berekening van het bijdrageplichtig inkomen als bedoeld
      in [artikel 3.3.1.2a, eerste tot en met derde lid][ref7];
        - *dag:* kalenderdag;
        - *deeltijdverblijf:* verblijf in een instelling zonder behandeling van gemiddeld zeven etmalen gedurende een
      periode van veertien aaneengesloten etmalen overeenkomstig van tevoren vastgestelde tijdsperioden;
        - *eigen bijdrage:* bijdrage van de verzekerde in de kosten van zorg;
        - *gebruikelijke zorg:* normale, dagelijkse zorg die ouders geacht worden te bieden aan inwonende kinderen;
        - *grondslag sparen en beleggen:* grondslag sparen en beleggen, bedoeld in
      [artikel 5.2, eerste lid, van de Wet inkomstenbelasting 2001][ref8];
        - *inkomen:* 1°. indien over het peiljaar een aanslag of navorderingsaanslag
      inkomstenbelasting is of wordt vastgesteld: inkomensgegeven, bedoeld in
      [artikel 21, onderdeel e, onder 1°, van de Algemene wet inzake rijksbelastingen][ref9];
      2°. in de overige gevallen: inkomensgegeven, bedoeld in
      [artikel 21, onderdeel e, onder 2°, van de Algemene wet inzake rijksbelastingen][ref10];
        - *modulair pakket thuis:* modulair pakket thuis als bedoeld in
      [artikel 3.3.2, eerste lid, onderdeel b, van de wet][ref11];
        - *palliatief terminale zorg:* zorg die betrekking heeft op de levensfase waarin de levensverwachting van de
      verzekerde naar het oordeel van de behandelend arts korter is dan drie maanden;
        - *peiljaar:* tweede kalenderjaar voorafgaande aan het jaar waarin de verzekerde zijn recht op zorg tot gelding
      brengt;
        - *pensioengerechtigde leeftijd:* pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref12].
        - *standaardpremie:* bedrag, bedoeld in [artikel 1, eerste lid, onderdeel g, van de Wet op de zorgtoeslag][ref13];
        - *vermogen:* vermogen, bedoeld in [artikel 3.3.1.2][ref14];
        - *vermogensinkomensbijtelling:* bijtelling van het vermogen als bedoeld in [artikel 3.3.1.2a][ref15];
        - *volledig pakket thuis:* integraal en volledig pakket thuis als bedoeld in
      [artikel 3.3.2, eerste lid, onderdeel a, van de wet][ref16];
        - *wet:* [Wet langdurige zorg][ref17];
        - *zak- en kleedgeld:* bedrag, vermeld in [artikel 23, eerste lid, van de Participatiewet][ref18];
        - *zorgprofiel:* een algemene typering van vergelijkbare zorgbehoeften of beperkingen op dezelfde terreinen,
      waarbij de verzorgings-, verplegings-, begeleidings- of behandelingsdoelen naar aard, inhoud en globale omvang
      overeenkomen;
        - *zorgtoeslag:* tegemoetkoming als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Wet op de zorgtoeslag][ref19];


