  - number: 3.3.2.4
    text: |-
      1 Voor de berekening van de eigen bijdrage, bedoeld in [artikel 3.3.2.2, eerste en tweede lid][ref1], bestaat het
      bijdrageplichtig inkomen uit het inkomen over het peiljaar van de ongehuwde verzekerde, onderscheidenlijk van de
      gehuwde verzekerden tezamen, vermeerderd met de vermogensinkomensbijtelling. Dit bijdrageplichtig inkomen wordt
      verminderd met € 6.226, indien een verzekerde een modulair pakket thuis of een persoonsgebonden budget ontvangt.

      2 Op aanvraag van de verzekerde stelt het CAK, in afwijking van het eerste lid, het bijdrageplichtig inkomen
      voorlopig vast op grond van het inkomen en het vermogen van het lopende jaar, indien redelijkerwijs te
      verwachten is dat het bijdrageplichtig inkomen in het lopende jaar ten minste € 2.653 lager zal zijn dan het
      bijdrageplichtig inkomen, bedoeld in het eerste lid, dan wel indien de verzekerde algemene bijstand op grond van de
      [Participatiewet][ref2] ontvangt.

      3 De aanvraag, bedoeld in het tweede lid, wordt gedaan uiterlijk vier maanden na afloop van het kalenderjaar waarop
      de aanvraag betrekking heeft of uiterlijk vier maanden na de datum waarop de bijdrage, bedoeld in het eerste lid,
      wordt vastgesteld.

      4 Indien het tweede lid is toegepast, vindt na afloop van het jaar en na ontvangst van de definitieve inkomens- en
      vermogensgegevens definitieve vaststelling plaats. Indien daarbij blijkt dat het bijdrageplichtig inkomen over het
      lopende jaar minder dan € 2.653 lager is geweest dan het bijdrageplichtig inkomen, bedoeld in het eerste lid, vindt
      definitieve vaststelling plaats overeenkomstig het eerste lid.

      5 Inkomen dat in het buitenland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen
      van internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen. Op aanvraag van de verzekerde wordt daarop de in het buitenland verschuldigde belasting in mindering
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0015703
