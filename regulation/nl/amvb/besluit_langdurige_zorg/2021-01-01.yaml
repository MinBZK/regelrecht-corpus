  - number: 2.1.4
    text: |-
      1 De inschrijving bij een Wlz-uitvoerder, bedoeld in [artikel 2.2.1, tweede en vierde lid, van de wet][ref1], geldt
      gedurende één kalenderjaar. Indien een inschrijving later dan per 1 januari van een jaar tot stand is gekomen,
      geldt de inschrijving tot en met 31 december van het volgende kalenderjaar.

      2 De inschrijving, bedoeld in het eerste lid, wordt na afloop van de daar bedoelde termijn, telkens met één
      kalenderjaar verlengd, tenzij de verzekerde vóór de dag waarop deze termijn is verstreken, schriftelijk aan de Wlz-
      uitvoerder heeft meegedeeld na afloop van die termijn de inschrijving niet te willen verlengen.

      3 De Wlz-uitvoerder kan schriftelijk een termijn van ten hoogste twee maanden vaststellen die de verzekerde in acht
      moet nemen bij het doen van een mededeling als bedoeld in het tweede lid.

      4 In afwijking van het eerste en tweede lid, beëindigt een Wlz-uitvoerder de inschrijving van een verzekerde met
      ingang van de dag waarop [artikel 2.2.1, eerste lid, van de wet][ref2] ten aanzien van de verzekerde is toegepast
      of indien inschrijving bij die Wlz-uitvoerder bij of krachtens de wet niet of niet langer is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel2.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel2.2.1
