  - number: 4.1.2
    text: |-
      1 De zorgautoriteit stelt vast of de Wlz-uitvoerder er zorg voor heeft gedragen dat de geschiktheid en de
      betrouwbaarheid van personen als bedoeld in [artikel 4.1.1, vijfde lid, van de wet][ref1] buiten twijfel staat, op
      basis van de voornemens, handelingen en antecedenten van deze personen.

      2 De Wlz-uitvoerder neemt voor de beoordeling van de geschiktheid van een persoon als bedoeld in
      [artikel 4.1.1, vijfde lid, van de wet][ref2] in ieder geval in aanmerking de opleiding, werkervaring
      en competenties van deze persoon, alsmede zijn kennis van de financiële sector in het algemeen en van de
      maatschappelijke functies van de Wlz-uitvoerder en de risico’s die daarbij gelopen worden in het bijzonder, aan de
      hand van ten minste:

      a. het curriculum vitae van deze persoon;

      b. de relevante geldige diploma’s van deze persoon.

      3 De Wlz-uitvoerder neemt voor de beoordeling van de betrouwbaarheid van een persoon als bedoeld in
      [artikel 4.1.1, vijfde lid, van de wet][ref3] in ieder geval in aanmerking:

      a. strafrechtelijke antecedenten;

      b. financiële antecedenten;

      c. toezichtantecedenten;

      d. fiscaal bestuursrechtelijke antecedenten; en

      e. overige antecedenten als bedoeld in [artikel 6 van het Besluit prudentiële regels Wft][ref4].

      4 De Wlz-uitvoerder verkrijgt inzicht in de in het eerste lid bedoelde voornemens, handelingen en antecedenten op
      grond van:

      a. de door betrokkene verstrekte gegevens en inlichtingen;

      b. inlichtingen, verkregen van door betrokkene opgegeven referenties;

      c. een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 en volgende van de Wet justitiële en strafvorderlijke gegevens][ref5];

      d. gegevens uit openbare bronnen;

      e. inlichtingen, verkregen van organisaties van huidige of voormalige beroepsgenoten van betrokkene;

      f. gegevens en inlichtingen, verkregen van Nederlandse of buitenlandse overheidsinstanties dan wel van Nederlandse
      of buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële markten of
      op personen die op die markten werkzaam zijn, of

      g. inlichtingen, verkregen van curatoren of bewindvoerders met betrekking tot faillissementen, surseances,
      schuldsaneringen, bewindvoeringen of noodregelingen, waarbij de in het eerste lid bedoelde persoon betrokken is
      geweest.

      5 Indien de gegevens of inlichtingen, verkregen overeenkomstig het vierde lid, de Wlz-uitvoerder aanleiding geven
      tot nader onderzoek, kan de Wlz-uitvoerder ook inlichtingen inwinnen en gegevens opvragen bij andere personen of
      instanties dan genoemd in dat lid. De Wlz-uitvoerder stelt de betrokkene in dat geval vooraf schriftelijk in kennis
      van:

      a. de reden van het nadere onderzoek;

      b. de personen of instanties bij wie nadere gegevens of inlichtingen zullen worden ingewonnen; en

      c. de aard van de nadere gegevens of inlichtingen.

      6 De Wlz-uitvoerder neemt bij de vaststelling, bedoeld in het eerste lid, in aanmerking:

      a. het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging of gedragingen en de
      overige omstandigheden van het geval;

      b. de belangen die de wet beoogt te beschermen; en

      c. de overige belangen van de Wlz-uitvoerder en de betrokkene.

      7 De zorgautoriteit maakt bij de beoordeling, bedoeld in het eerste lid, onverminderd haar bevoegdheid tot eigen
      onderzoek, zoveel mogelijk gebruik van de resultaten van door anderen verrichte controles.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel4.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel4.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0035917#Artikel4.1.1
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0014194#Artikel28
