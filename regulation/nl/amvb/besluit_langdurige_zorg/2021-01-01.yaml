        bwb_id: BWBR0005537
        artikel: 4:2
  - number: 3.2.2
    text: |-
      1 De voorbereiding van een indicatiebesluit omvat in ieder geval een onderzoek van de verzekerde in persoon.

      2 Bij de beoordeling van de mate waarin een verzekerde is aangewezen op zorg betrekt het CIZ de gebruikelijke zorg
      en algemeen gebruikelijke voorzieningen.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de voorbereiding van een indicatiebesluit en het
      onderzoek. In deze regels kan ook bepaald worden in welke gevallen het in het eerste lid bedoelde onderzoek niet
      hoeft plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.2.2
  - number: 3.2.3
    text: |-
      Indien de verzekerde is aangewezen op zorg, vermeldt het indicatiebesluit:

      a. de resultaten van het voorbereidend onderzoek, bedoeld in [artikel 3.2.2, eerste lid][ref1];

      b. aandoeningen, beperkingen, stoornissen of handicaps als gevolg waarvan hij op de zorg is aangewezen;

      c. het zorgprofiel waarop hij is aangewezen;

      d. bij ministeriële regeling te bepalen kenmerken van de verzekerde of van zijn zorgbehoefte die aanleiding kunnen
      geven tot de toekenning van meer zorg als bedoeld in [artikel 3.1.1, tweede lid][ref2];

      e. voorwaarden en beperkingen die aan het geïndiceerde recht op zorg verbonden zijn;

      f. de datum met ingang waarvan hij recht heeft op zorg; en

      g. de geldigheidsduur van het indicatiebesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0035948#Artikel3.1.1
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.2.3
    references:
