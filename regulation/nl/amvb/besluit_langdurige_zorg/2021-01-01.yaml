  - number: 3.5.1
    text: |-
      In een besluit tot het verlenen van een modulair pakket thuis, drukt de Wlz-uitvoerder het recht op zorg van de
      verzekerde uit in modules, die bij ministeriële regeling per zorgprofiel worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.5.1
  - number: 3.5.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de berekening van de maximumkosten van een modulair
      pakket thuis, bedoeld in [artikel 3.3.2, vierde lid, onderdeel b, van de wet][ref1] en over de bestanddelen van de
      kosten die daarbij buiten beschouwing dienen te blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3.3.2
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.5.2
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: 3.3.2
  - number: 3.5.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de aanvraag, de verlening of de
      weigering van een modulair pakket thuis of een volledig pakket thuis.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.5.3
  - number: 3.6.1
    text: Een persoonsgebonden budget wordt per kalenderjaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.6.1
  - number: 3.6.2
    text: |-
      1 Het zorgkantoor verleent geen persoonsgebonden budget indien:

      a. de verzekerde krachtens een indicatiebesluit is aangewezen op een bij ministeriële regeling genoemd zorgprofiel;

      b. de verzekerde weigert om het budgetplan met het zorgkantoor te bespreken of, na daartoe door het zorgkantoor te
      zijn opgeroepen, niet verschijnt;

      c. de verzekerde het door het zorgkantoor vastgestelde aanvraagformulier niet volledig en juist heeft ingevuld;

      d. de verzekerde, gelet op de door hem verstrekte gegevens of bescheiden, voornemens is om het persoonsgebonden
      budget uitsluitend te besteden aan de inkoop van zorg bij zorgaanbieders die gecontracteerd zijn door de Wlz-
      uitvoerder.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de verlening of weigering van een
      persoonsgebonden budget.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.6.2
  - number: 3.6.3
    text: |-
      Een persoonsgebonden budget bedraagt ten hoogste een bij ministeriële regeling te bepalen bedrag. Bij deze regeling
      kunnen nadere regels worden gesteld omtrent de:

      a. vermindering van het bedrag voor de bestanddelen behandeling, kapitaallasten, kosten voor verblijf of andere
      bestanddelen,

      b. vermeerdering van het bedrag voor verzekerden die wonen in een kleinschalig wooninitiatief als bedoeld in
      [artikel 3.1.3, tweede lid][ref1],

      c. de hoogte van het bedrag indien de verzekerde naast het persoonsgebonden budget ook een modulair pakket thuis
      ontvangt of wenst te ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.1.3
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.6.3
    references:
      - id: ref1
        bwb_id: BWBR0035948
        artikel: 3.1.3
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.6.4
    text: |-
      1 De verzekerde sluit een schriftelijke overeenkomst met iedere zorgaanbieder of mantelzorger die hij ten laste van
      zijn persoonsgebonden budget zorg wenst te laten verlenen.

      2 De verzekerde laat de betalingen verrichten door de Sociale verzekeringsbank.

      3 Bij ministeriële regeling worden regels gesteld over de overeenkomst, bedoeld in het eerste lid.

      4 In afwijking van het eerste en het tweede lid kan de verzekerde zelf betalingen verrichten ten
      laste van zijn persoonsgebonden budget indien het gaat om kosten verbonden aan vervoer als bedoeld in
      [artikel 3.1.1, eerste lid, onderdeel f, van de wet][ref1] waarvoor de verzekerde geen schriftelijke overeenkomst
      heeft gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3.1.1
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.6.4
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: 3.1.1
  - number: 3.6.5
    text: |-
      1 Bij ministeriële regeling worden maximumtarieven vastgesteld voor de verlening van zorg die vanuit het
      persoonsgebonden budget kan worden bekostigd.

      2 De in het eerste lid bedoelde tarieven worden vastgesteld voor zorg die geleverd wordt door:

      a. een zorgaanbieder, voor zover deze voldoet aan in ieder geval één van de in het derde lid gestelde eisen, of

      b. een andere zorgaanbieder dan een zorgaanbieder als bedoeld in onderdeel a of een mantelzorger.

      3 Van het tweede lid, onder a, is sprake indien de zorg is verleend door:

      1°. een onderneming als bedoeld in [artikel 5, onderdelen a, c, d of e, van de Handelsregisterwet 2007][ref1]
      waarvan de activiteiten blijkens de inschrijving in het handelsregister, bedoeld in [artikel 2 van die wet][ref2],
      geheel of gedeeltelijk bestaan uit het verlenen van zorg;

      2°. een onderneming als bedoeld in [artikel 5, onderdeel b, van de Handelsregisterwet 2007][ref3] waarvan de
      activiteiten blijkens de inschrijving in het handelsregister, bedoeld in [artikel 2 van die wet][ref4], geheel of
      gedeeltelijk bestaan uit het verlenen van zorg en die toebehoort aan een zelfstandige zonder personeel;

      3°. een persoon die is ingeschreven in het register, bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref5], voor het uitoefenen van een beroep
      voor het verlenen van zorg.

      4 Indien onderdeel a en onderdeel b, van het tweede lid, gelijktijdig van toepassing zijn op een mantelzorger, dan
      geldt het tarief voor mantelzorgers bedoeld in het tweede lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.6.5
    references:
