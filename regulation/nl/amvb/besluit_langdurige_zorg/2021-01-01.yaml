        bwb_id: BWBR0035948
        artikel: 3.3.1.3
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.3.1.6
    text: |-
      1 De eigen bijdrage wordt zo spoedig mogelijk herzien na het tijdstip waarop het CAK in kennis is gesteld van de
      omstandigheid die aanleiding geeft tot de wijziging.

      2 De eigen bijdrage is verschuldigd of wordt gerestitueerd over ten hoogste 36 maanden voor de maand waarin het
      besluit, waarmee de bijdrage is herzien, aan de verzekerde is verzonden.

      3 De herziene eigen bijdrage wordt voor zover mogelijk verrekend met de eerder vastgestelde bijdrage.

      4 Voor zover de bevoegdheid tot herziening van de eigen bijdrage over een maand is vervallen op grond van het
      tweede tot en met zesde lid wordt de over die maand eerder vastgestelde eigen bijdrage van rechtswege definitief.

      5 De termijn van 36 maanden als bedoeld in het tweede lid, waarover een eigen bijdrage verschuldigd is, kan worden
      verkort naar 12 maanden indien het CAK van oordeel is dat het verzuim om de bijdrage te herzien voorafgaand aan de
      laatstgenoemde termijn:

      a. het gevolg is van een ernstige tekortkoming of vertraging in de gegevensuitwisseling of verwerking daarvan die
      noodzakelijk is voor het herzien van de bijdrage; en

      b. de tekortkoming of vertraging, bedoeld onder a, niet aan de verzekerde te wijten is.

      6 Uit eigen beweging of op aanvraag van de verzekerde kan, bij het voordoen van de situatie, bedoeld in het vijfde
      lid, het CAK de termijn verkorten tot ten hoogste een maand of besluiten dat de herziene bijdrage niet verschuldigd
      is in bijzondere of voor de verzekerde verzwarende omstandigheden.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.3.1.6
  - number: 3.3.1.7
    text: |-
      1 Bij ministeriële regeling worden de bedragen, genoemd in de [artikelen 3.3.2.1, tweede lid][ref1],
      [3.3.2.2, derde en vierde lid][ref2] en [3.3.2.4, eerste, tweede en vierde lid][ref3], jaarlijks gewijzigd aan de
      hand van de prijsindex voor de gezinsconsumptie. De berekende bedragen worden naar beneden afgerond op een veelvoud
      van € 0,2. Bij de jaarlijkse toepassing van de eerste zin wordt de afronding buiten beschouwing gelaten.

      2 Bij ministeriële regeling worden de bedragen, genoemd in [artikel 3.3.1.2, eerste lid, onderdeel b][ref4],
      [3.3.2.3, eerste lid, onderdeel b, onder 4° en 5°][ref5], en [3.3.2.4a, eerste en vierde lid][ref6],
      jaarlijks gewijzigd aan de hand van het indexcijfer waarmee het bedrag, genoemd in
      [artikel 5.5 van de Wet inkomstenbelasting 2001][ref7], jaarlijks wordt gewijzigd.

      3 Bij ministeriële regeling, bedoeld in het eerste en tweede lid, worden de bedragen voor de toepassing van de
      [artikelen 3.3.2.3, eerste lid, onderdeel b, tweede en vierde lid][ref8], [3.3.2.4, tweede en vierde lid][ref9],
      [artikel 3.3.2.5, eerste en tweede lid][ref10], en [3.3.2.6, eerste lid][ref11], afzonderlijk vastgesteld voor
      zowel het peiljaar als het lopende kalenderjaar.


