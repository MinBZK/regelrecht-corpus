        artikel: 8.1.1
  - number: 7.1.1
    text: |-
      1 Het Zorginstituut verstrekt aan organisaties subsidies voor het verlenen van ADL-assistentie voor zover die
      organisaties de ADL-assistentie verlenen aan verzekerden die woonachtig zijn in ADL-woningen.

      2 De organisaties, bedoeld in het eerste lid, verlenen ADL-assistentie aan verzekerden volgens een door het CIZ
      genomen besluit als bedoeld in [artikel 5.2.1, eerste lid][ref1].

      3 In de ADL-woningen wordt zorg geleverd aan verzekerden:

      a. met een lichamelijke handicap of een somatische aandoening of beperking;

      b. die zijn aangewezen op een rolstoeldoorgankelijke woning;

      c. die zijn aangewezen op ten minste vijf uur oproepbare ADL-assistentie per week, en

      d. die voldoende sociaal zelfredzaam zijn om zelfstandig te wonen en om zelfstandig zorg op te roepen en
      aanwijzingen te geven.

      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de subsidieverlening voor ADL-
      assistentie, met inbegrip van de uitvoering daarvan, van wat onder ADL-woningen kan worden verstaan en de controle.


