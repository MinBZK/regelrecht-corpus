  - number: 3.3.2.3
    text: |-
      1 Het bijdrageplichtig inkomen, bedoeld in [artikel 3.3.2.1, eerste lid][ref1], wordt als volgt berekend:

      a. het inkomen over het peiljaar van de ongehuwde verzekerde onderscheidenlijk de gehuwde verzekerden tezamen wordt
      verminderd met de door die verzekerde onderscheidenlijk die verzekerden verschuldigde of ingehouden belasting;

      b. op het met toepassing van onderdeel a berekende bedrag worden in mindering gebracht:

      1°. 15% van de netto-opbrengst van in het voorafgaande kalenderjaar verrichte arbeid van een loon- of
      salarisdoorbetaling wegens ziekte of van een uitkering ingevolge de [Ziektewet][ref2] dan wel, indien dit onbekend
      of niet beschikbaar is, 15% van de redelijkerwijs te verwachten netto-opbrengst van in het lopende kalenderjaar
      verrichte arbeid, van een loon- of salarisdoorbetaling wegens ziekte of van een uitkering ingevolge de Ziektewet;

      2°. het in het peiljaar geldende bedrag voor zak- en kleedgeld, premies voor een zorgverzekering gecorrigeerd voor
      de zorgtoeslag, een aftrekpost die verschillend kan zijn voor een verzekerde die de pensioengerechtigde leeftijd
      heeft bereikt en een verzekerde die die leeftijd nog niet heeft bereikt of extra vrijlatingen, een en ander volgens
      bij ministeriële regeling te bepalen regels;

      3°. op aanvraag van de verzekerde, de in het peiljaar geldende uitkering op grond van
      [artikel 14 van de Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref3] of op grond van
      [artikel 20 van de Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref4];

      4°. de compensatie vervallen ouderentoeslag, indien het inkomen van de verzekerde die de pensioengerechtigde
      leeftijd heeft bereikt, verminderd met 4% van dat vermogen, minder dan € 20.540 bedraagt;

      5°. de compensatie vervallen ouderentoeslag van de echtgenoot, indien de echtgenoot van de verzekerde de
      pensioengerechtigde leeftijd heeft bereikt en het inkomen van de echtgenoot, verminderd met 4% van zijn vermogen,
      minder dan € 20.540 bedraagt;

      c. het met toepassing van onderdeel b berekende bedrag wordt vermeerderd met de vermogensinkomensbijtelling over
      het peiljaar.

      2 Op aanvraag van de verzekerde stelt het CAK, in afwijking van het eerste lid, onderdelen a en c, het
      bijdrageplichtig inkomen voorlopig vast op basis van het redelijkerwijs gedurende het lopende kalenderjaar
      te verwachten inkomen, vermeerderd met de vermogensinkomensbijtelling van het verwachte vermogen, en de
      over dat kalenderjaar te verwachten belasting indien toepassing van het eerste lid, onderdelen a en c,
      ertoe zou leiden dat na afdracht van de bijdrage maandelijks gemiddeld minder over zou blijven dan het
      zak- en kleedgeld, zoals dat geldt in het lopende kalenderjaar, alsmede een bedrag in verband met de
      standaardpremie, vermeerderd met de inkomensafhankelijke premie [Zorgverzekeringswet][ref5], bedoeld in
      [artikel 43, eerste lid, van de Zorgverzekeringswet][ref6], en verminderd met de zorgtoeslag, zoals deze
      bedragen gelden in het lopende kalenderjaar. Het aldus berekende bijdrageplichtig inkomen wordt, om de per maand
      verschuldigde bijdrage vast te stellen, gedeeld door twaalf.

      3 De aanvraag, bedoeld in het tweede lid, wordt gedaan uiterlijk vier maanden na afloop van het kalenderjaar
      waarop de aanvraag betrekking heeft of uiterlijk vier maanden na de datum waarop de bijdrage op basis van het
      bijdrageplichtig inkomen, bedoeld in het eerste lid wordt vastgesteld.

      4 Indien het tweede lid is toegepast, vindt na afloop van het jaar en na ontvangst van de definitieve inkomens- en
      vermogensgegevens de definitieve vaststelling plaats. Indien daaruit blijkt dat niet voldaan is aan het tweede lid,
      vindt definitieve vaststelling plaats met toepassing van het eerste lid.

      5 Inkomen dat buiten Nederland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen
      van internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen. Op aanvraag van de verzekerde wordt daarop de in het buitenland verschuldigde belasting in mindering
      gebracht.


