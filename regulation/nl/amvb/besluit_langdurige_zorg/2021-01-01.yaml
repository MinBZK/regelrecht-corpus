  - number: 3.2.4
    text: |-
      1 Het CIZ neemt zo snel mogelijk, doch binnen zes weken na ontvangst van de aanvraag een beslissing op de aanvraag.

      2 Indien een verzekerde wegens bijzondere omstandigheden reeds zorg ontvangt, wordt een indicatiebesluit uiterlijk
      binnen twee weken genomen. Indien de verzekerde ingevolge het indicatiebesluit is aangewezen op in de wet geregelde
      zorg, werkt het indicatiebesluit terug tot en met de dag waarop de zorg is aangevangen.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.2.4
  - number: 3.2.5
    text: |-
      Een indicatiebesluit geldt voor onbepaalde tijd, tenzij het indicatiebesluit behoort tot een bij ministeriële
      regeling aangewezen categorie indicatiebesluiten waarvoor de geldigheidsduur wordt vastgesteld door het CIZ binnen
      de door deze regeling gestelde maximumduur.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.2.5
  - number: 3.3.1.1
    text: |-
      1 De verzekerde van achttien jaar of ouder draagt bij in de kosten van de zorg.

      2 De eigen bijdrage is mede afhankelijk van het inkomen en het vermogen van de verzekerde en diens echtgenoot.
    url: https://wetten.overheid.nl/BWBR0035948/2021-01-01#Artikel3.3.1.1
  - number: 3.3.1.2
    text: |-
      1 Het vermogen van een persoon is zijn vermogensgrondslag, bedoeld in het tweede of derde lid, waarvan de volgende
      vermogensbestanddelen worden afgetrokken:

      a. op aanvraag van de verzekerde, het bedrag ter grootte van door de verzekerde in het peiljaar of enig eerder
      jaar ontvangen eenmalige uitkeringen die bij ministeriële regeling van Onze Minister of Onze Minister van Financiën
      krachtens [artikel 47 van de Algemene wet inkomensafhankelijke regelingen][ref1] zijn aangewezen;

      b. voor de toepassing van [artikel 3.3.2.3, eerste lid, onderdeel c][ref2], en [artikel 3.3.2.4, eerste lid][ref3],
      een bedrag van € 10.376 voor de verzekerde die de pensioengerechtigde leeftijd nog niet heeft bereikt en van
      € 10.376 voor zijn echtgenoot die:

      1°. de pensioengerechtigde leeftijd heeft bereikt, of

      2°. de pensioengerechtigde leeftijd niet heeft bereikt en geen bijdrage als bedoeld in
      [artikel 3.3.2.1, eerste lid][ref4], of [artikel 3.3.2.2, eerste of tweede lid][ref5], dan wel
      [artikel 3.11, eerste lid][ref6], of [artikel 3.12, eerste of tweede lid, van het Uitvoeringsbesluit Wmo 2015][ref7]
      verschuldigd is,

      met dien verstande dat het vermogen ten minste nihil bedraagt.

      2 De vermogensgrondslag van een persoon is zijn grondslag sparen en beleggen, over het peiljaar, of indien over het
      peiljaar [artikel 5.2, tweede lid, van de Wet inkomstenbelasting 2001][ref8] op de persoon van toepassing is, het
      aan hem toegerekende gedeelte van de toepasselijke gezamenlijke grondslag sparen en beleggen, bedoeld in dat lid.

      3 In afwijking van het tweede lid is de vermogensgrondslag van een persoon bij toepassing
      jegens hem van [artikel 3.3.2.3, tweede lid][ref9],[ artikel 3.3.2.4, tweede lid][ref10], of
      [artikel 3.3.2.5][ref11], de te verwachten grondslag sparen en beleggen over het lopende jaar, of indien
      [artikel 5.2, tweede lid, van de Wet inkomstenbelasting 2001][ref12] vermoedelijk op de persoon van toepassing
      zal zijn, het te verwachten aan hem toe te rekenen deel van de toepasselijke te verwachten gezamenlijke grondslag
      sparen en beleggen, bedoeld in artikel 5.2, tweede lid, van de Wet inkomstenbelasting 2001.

      4 Het deel van het bedrag, bedoeld in het eerste lid, onderdeel a, dat de vermogensgrondslag van de persoon
      overtreft, wordt voor zijn echtgenoot als vermindering toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel47
