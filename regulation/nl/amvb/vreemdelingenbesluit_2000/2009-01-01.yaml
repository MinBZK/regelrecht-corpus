        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 1.4.1
    text: |-
      Onze Minister kan van zijn bevoegdheden mandaat verlenen aan de burgemeester, de korpschef en de bevelhebber van de
      Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.4
  - number: 1.4.2
    text: |-
      De burgemeester, de korpschef en de bevelhebber van de Koninklijke marechaussee kunnen ondermandaat verlenen aan de
      onder hen ressorterende ambtenaren voorzover dat in overeenstemming is met de taak en functie van de desbetreffende
      ambtenaar.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.4
  - number: '1.6'
    text: |-
      De commissie kan haar werkwijze nader vaststellen in een reglement van orde als bedoeld in
      [artikel 21 van de Kaderwet adviescolleges][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel21
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '21'
  - number: 1.7.1
    text: De commissie adviseert schriftelijk en met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.7
  - number: 1.7.2
    text: |-
      De adviezen vermelden de namen van de personen die ter vergadering aanwezig zijn geweest. Zij vermelden tevens met
      welke stemmenverhouding zij zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.7
  - number: 1.7.3
    text: Het advies wordt door de voorzitter en de secretaris ondertekend.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.7
  - number: 2.1.1
    text: |-
      De toegang wordt geweigerd op grond van [artikel 3, eerste lid, van de Wet][ref1], indien de vreemdeling het doel
      van het voorgenomen verblijf of de verblijfsomstandigheden onvoldoende aannemelijk heeft gemaakt, dan wel ter
      staving daarvan onvoldoende documenten heeft overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
  - number: 2.1.2
    text: |-
      Het eerste lid is niet van toepassing op de vreemdeling die rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onder e, dan wel l, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2.1a
    text: |-
      De toegang wordt niet geweigerd, indien de vreemdeling naar Nederland terugkeert als gezinslid van een
      langdurig ingezetene, die houder is van een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20 van de Wet][ref1] en die na verblijfsbeëindiging door een andere staat die partij is bij het Verdrag
      tot oprichting van de Europese Gemeenschap uit die staat naar Nederland terugkeert.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 2.2.1
    text: |-
      De vervoerder, bedoeld in [artikel 4, eerste lid, van de Wet][ref1] neemt afschrift van het op de vreemdeling
      betrekking hebbende document voor grensoverschrijding, indien hij de vreemdeling rechtstreeks dan wel na transfer
      of transit naar Nederland vervoert vanaf een luchthaven die is aangewezen bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '4'
  - number: 2.2.2
    text: |-
      De vervoerder neemt afschrift door het maken van een duidelijke en goed leesbare afbeelding van de pagina's met
      de relevante gegevens van het document voor grensoverschrijding van de vreemdeling die hij vervoert. De vervoerder
      overhandigt het afschrift desgevraagd aan een ambtenaar belast met de grensbewaking, indien bij inreis in Nederland
      geen geldig document voor grensoverschrijding door de vreemdeling kan worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2.3
    text: 'Onder de relevante gegevens wordt in ieder geval verstaan:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2.3.a
    text: naam en voornaam of voornamen van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2.3.b
    text: geboortedatum van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2.3.c
    text: geboorteplaats van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2.3.d
    text: nationaliteit van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2.3.e
    text: |-
      plaats en datum van afgifte van het document voor grensoverschrijding van de vreemdeling, alsmede het nummer
      daarvan;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2.3.f
    text: geldigheidsduur van het document voor grensoverschrijding van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2.3.g
    text: |-
      plaats en datum van afgifte van het in het document voor grensoverschrijding van de vreemdeling aangebrachte visum
      voor Nederland of het Schengengebied dan wel het verblijfsdocument, alsmede de nummers daarvan;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2.3.h
    text: |-
      geldigheidsduur van de in het document voor grensoverschrijding aangebrachte visa of verblijfsdocumenten,
      ook indien een visumverklaring is afgegeven, dan wel gebruik wordt gemaakt van niet in het document voor
      grensoverschrijding aangebrachte verblijfsdocumenten;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2.3.i
    text: |-
      plaats en datum van afgifte van de in het document voor grensoverschrijding aangebrachte visa of
      verblijfsdocumenten voor derde landen, welke noodzakelijk zijn voor de reis naar Nederland, dan wel voor het
      uiteindelijke land van bestemming, ook indien die visa dan wel verblijfsdocumenten niet in het document voor
      grensoverschrijding zijn aangebracht, maar afzonderlijk aan de vreemdeling zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2.3.j
    text: |-
      het meest recente uitreisstempel voorzover dit is aangebracht door de grensbewakingautoriteiten van het land waarin
      de luchthaven van vertrek gelegen is, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2.3.k
    text: de in het document voor grensoverschrijding aangebrachte foto.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2.4
    text: |-
      De afbeelding van de in het document voor grensoverschrijding aangebrachte foto, bedoeld in het derde lid, onder k,
      dient van zodanige kwaliteit te zijn, dat deze goed tot de houder van het geldige document voor grensoverschrijding
      herleidbaar is.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2.5
    text: |-
      De ambtenaar belast met de grensbewaking maakt de afbeelding definitief onbruikbaar, zodra de
      grensbewakingsbelangen dit toestaan.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2
  - number: 2.2a.1
    text: |-
      De vervoerder, bedoeld in [artikel 4, eerste lid, van de Wet][ref1], die passagiers vervoert door de lucht,
      verzamelt op vordering van een ambtenaar belast met de grensbewaking de in het derde lid van dat artikel bedoelde
      passagiersgegevens en overhandigt deze voor het eind van de instapcontroles aan een ambtenaar belast met de
      grensbewaking.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '4'
  - number: 2.2a.2
    text: |-
      Het eerste lid is niet van toepassing op de vervoerder door wiens tussenkomst de vreemdeling vanuit een lidstaat
      van de Europese Unie of een land dat betrokken is bij de uitvoering, de toepassing en de ontwikkeling van het
      Schengenacquis, aan een buitengrens of binnen het grondgebied van Nederland wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.3
    text: |-
      De in [artikel 4, derde lid, van de Wet][ref1], bedoelde passagiersgegevens omvatten:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '4'
  - number: 2.2a.3.a
    text: het nummer en de aard van het gebruikte reisdocument;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.3.b
    text: de nationaliteit;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.3.c
    text: de volledige naam;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.3.d
    text: de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.3.e
    text: de grensdoorlaatpost van binnenkomst;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.3.f
    text: het vervoermiddel;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.3.g
    text: het tijdstip van vertrek en van aankomst van het vervoermiddel;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.3.h
    text: het totale aantal met dat vervoermiddel vervoerde passagiers, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.3.i
    text: het eerste instappunt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.4
    text: |-
      Bij ministeriële regeling kunnen gevallen worden aangewezen waarin vervoerders verplicht zijn de in het derde lid
      bedoelde passagiersgegevens te verzamelen en te verstrekken zonder vordering daartoe.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.5
    text: De vervoerder vernietigt de krachtens het eerste lid verzamelde gegevens binnen 24 uur na aankomst in Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.6
    text: 'De vervoerder verstrekt de passagier informatie betreffende:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.6.a
    text: zijn identiteit;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.6.b
    text: de doeleinden waarvoor de gegevens worden verzameld;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.6.c
    text: de gegevens die worden verzameld;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.6.d
    text: de ontvangers van de gegevens, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.6.e
    text: |-
      het bestaan van het recht om kennis te nemen van zijn gegevens en het recht om om correctie van onjuiste gegevens
      te verzoeken.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2a.7
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze waarop de gegevens door de vervoerder worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2a
  - number: 2.2b
    text: |-
      De ambtenaar belast met de grensbewaking vernietigt de op grond van [artikel 2.2a][ref1] verkregen
      passagiersgegevens binnen 24 uur na binnenkomst van de passagiers in Nederland, tenzij deze later nodig zijn voor
      de uitoefening van diens taken.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 2.2c
    text: |-
      Onze Minister zendt binnen twee jaar na de inwerkingtreding van dit besluit aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van de toepassing van de [artikelen 2.2a][ref1] en [2.2b][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.2c
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 2.3.1
    text: |-
      Onverminderd de overige terzake bij de [Wet][ref1] gestelde vereisten, wordt toegang tot Nederland niet geweigerd
      op grond van [artikel 3, eerste lid, onder a, van de Wet][ref2], indien de vreemdeling in het bezit is van:


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '3'
  - number: 2.3.1.a
    text: |-
      een geldig document voor grensoverschrijding dat is voorzien van een geldige machtiging tot voorlopig verblijf,
      indien hij zich naar Nederland begeeft voor een verblijf aldaar van langer dan drie maanden, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.3
  - number: 2.3.1.b
    text: een door Onze Minister afgegeven verklaring die aan hem recht geeft op terugkeer naar Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Een afzonderlijke geldige machtiging tot voorlopig verblijf wordt gelijkgesteld met een geldig document voor
      grensoverschrijding, indien de vreemdeling tevens in het bezit is van het in deze machtiging vermelde document.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.3
  - number: 2.3.3
    text: |-
      In afwijking van het eerste lid wordt toegang niet geweigerd indien de vreemdeling zich naar Nederland begeeft voor
      een verblijf van langer dan drie maanden en hij in het bezit is van een geldig document voor grensoverschrijding
      waarin de benodigde machtiging tot voorlopig verblijf ontbreekt, mits de vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.3
  - number: 2.3.3.a
    text: de nationaliteit bezit van één van bij ministeriële regeling aan te wijzen staten, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.3
  - number: 2.3.3.b
    text: behoort tot een bij ministeriële regeling aan te wijzen categorie.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Bij ministeriële regeling kan, ter uitvoering van een verdrag, dan wel een besluit van een volkenrechtelijke
      organisatie, van het eerste lid worden afgeweken ten gunste van vreemdelingen ten aanzien van het bezit van een
      document voor grensoverschrijding.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Aan de vreemdeling, die als passagier van een vliegtuig een vliegveld aandoet en in wiens geldig document voor
      grensoverschrijding het voor binnenkomst in het Beneluxgebied vereiste reisvisum of doorreisvisum met oponthoud
      ontbreekt, kan toegang tot het Beneluxgebied worden verleend.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.4
  - number: 2.4.2
    text: 'Toegang wordt slechts verleend, indien:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.4
  - number: 2.4.2.a
    text: de onderbreking plaats vindt wegens van de wil van de vreemdeling onafhankelijke omstandigheden;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.4
  - number: 2.4.2.b
    text: hij van één van de in het derde lid van dit artikel bedoelde vliegvelden zal vertrekken;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.4
  - number: 2.4.2.c
    text: |-
      hij in het bezit is van een geldig document voor grensoverschrijding en reisbiljetten op grond waarvan zijn
      doorreis naar en zijn toegang tot het land van bestemming vaststaat, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.4
  - number: 2.4.2.d
    text: |-
      hij voldoet aan [artikel 12, eerste lid, onder b en d, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel12
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '12'
  - number: 2.4.3
    text: |-
      De toegang wordt slechts verleend, indien de vreemdeling een bij ministeriële regeling aangewezen vliegveld in
      Nederland aandoet, dan wel een daartoe aangewezen vliegveld in België of Luxemburg.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.4
  - number: 2.4.4
    text: De toegang wordt verleend voor de duur waarop de doorreis per eerstvolgende gelegenheid kan worden voortgezet.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.4
  - number: 2.4.5
    text: |-
      Indien toegang wordt verleend, stelt de ambtenaar belast met de grensbewaking ter plaatse in het geldig document
      voor grensoverschrijding van de vreemdeling een aantekening, dan wel verstrekt hij aan de vreemdeling een
      afzonderlijke verklaring, waaruit het verlenen van toegang blijkt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.4
  - number: 2.4.6
    text: Het model van de aantekening en verklaring, bedoeld in het vijfde lid, wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.4
  - number: 2.9.1
    text: |-
      Toegang tot Nederland wordt in ieder geval geweigerd op grond van het feit dat de vreemdeling een gevaar oplevert
      voor de openbare orde of de nationale veiligheid, bedoeld in [artikel 3, eerste lid, onder b, van de Wet][ref1],
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
  - number: 2.9.1.a
    text: |-
      er ten aanzien van de vreemdeling concrete aanwijzingen zijn dat deze een inbreuk op de openbare orde of nationale
      veiligheid heeft gepleegd of zal plegen, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.9
  - number: 2.9.1.b
    text: |-
      de vreemdeling in het opsporingsregister of het Schengen Informatiesysteem ter fine van weigering staat
      gesignaleerd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.9
  - number: 2.9.2
    text: |-
      Het eerste lid blijft buiten toepassing, indien Onze Minister op grond van humanitaire overwegingen, om redenen van
      nationaal belang of wegens internationale verplichtingen een afwijking noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.9
  - number: 2.9.3
    text: |-
      Het eerste lid is niet van toepassing op de vreemdeling die rechtmatig verblijf heeft als
      bedoeld in [artikel 8, onder e, dan wel l, van de Wet][ref1], en het familielid, bedoeld in
      [artikel 8.7, tweede en derde lid][ref2], en de vreemdeling, bedoeld in [artikel 8.7, vierde lid][ref3]. Op deze
      vreemdelingen is [artikel 8.8][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.10.1
    text: |-
      Bij de vaststelling of de vreemdeling beschikt over de in [artikel 3, eerste lid, onderdeel c, van de Wet][ref1]
      bedoelde middelen om te voorzien zowel in de kosten van verblijf in Nederland als in die van zijn reis naar een
      plaats buiten Nederland waar zijn toegang is gewaarborgd, kunnen middelen waarover de vreemdeling reeds beschikt en
      middelen waarover de vreemdeling kan beschikken uit wettelijk toegestane arbeid worden betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
  - number: 2.10.2
    text: Onder middelen worden in ieder geval verstaan geldelijke middelen alsmede vervoersbewijzen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.10
  - number: 2.10.3
    text: |-
      Het eerste lid is niet van toepassing op de vreemdeling die rechtmatig verblijf heeft als
      bedoeld in [artikel 8, onder e, dan wel l, van de Wet][ref1], het familielid, bedoeld in
      [artikel 8.7, tweede en derde lid][ref2], en de vreemdeling, bedoeld in [artikel 8.7, vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.11.1
    text: |-
      De toegang wordt geweigerd op grond van [artikel 3, eerste lid, onder c en d, van de Wet][ref1], indien de
      vreemdeling niet voldoet aan de door de ambtenaar belast met grensbewaking gestelde voorwaarde om zekerheid te
      stellen voor de kosten van verblijf in Nederland en voor de kosten van zijn reis naar een plaats buiten Nederland
      waar zijn toegang gewaarborgd is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
  - number: 2.11.2
    text: 'De zekerheid, bedoeld in het eerste lid, kan bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.11
  - number: 2.11.2.a
    text: het deponeren van een retour-passagebiljet;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.11
  - number: 2.11.2.b
    text: het deponeren van een garantiesom, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.11
  - number: 2.11.2.c
    text: een verklaring van een solvabele derde die zich voor de kosten garant stelt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.11
  - number: 2.11.3
    text: Het model van de garantverklaring wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.11
  - number: 2.11.4
    text: |-
      Het eerste lid is niet van toepassing op de vreemdeling die rechtmatig verblijf heeft als
      bedoeld in [artikel 8, onder e, dan wel l, van de Wet][ref1], het familielid, bedoeld in
      [artikel 8.7, tweede en derde lid][ref2], en de vreemdeling, bedoeld in [artikel 8.7, vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.11.5
    text: |-
      De in het eerste lid bedoeld voorwaarde om zekerheid te stellen voor de kosten van verblijf in Nederland en voor de
      kosten van zijn reis naar een plaats buiten Nederland waar zijn toegang is gewaarborgd, kan, op grond van artikel
      5, derde lid, van de Schengengrenscode, ook worden gesteld ten aanzien van een onderdaan van een derde land die
      toegang vraagt voor een verblijf van ten hoogste drie maanden per periode van zes maanden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel2.11
  - number: 3.1.1
    text: |-
      Het indienen van een aanvraag tot het verlenen, wijzigen of verlengen van een verblijfsvergunning heeft tot gevolg
      dat de uitzetting achterwege blijft, tenzij de aanvraag naar het voorlopig oordeel van Onze Minister een herhaalde
      aanvraag betreft.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Uitzetting blijft niet achterwege, indien de aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde
      tijd, bedoeld in de [artikelen 14][ref1] en [28 van de Wet][ref2], naar het voorlopig oordeel van Onze Minister,
      op grond van de Wet kan worden afgewezen op de grond dat de vreemdeling een gevaar vormt voor de openbare orde of
      nationale veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.1a.1
    text: |-
      Het indienen van een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de wet][ref1] heeft tot gevolg dat de uitzetting achterwege blijft zo lang een besluit als bedoeld
      in artikel 5, derde lid, van de richtlijn tijdelijke bescherming van kracht is, indien de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.1a.1.a
    text: |-
      behoort tot de specifieke groep vreemdelingen zoals omschreven in een besluit van de Raad van de Europese Unie als
      bedoeld in artikel 5, derde lid, van de richtlijn tijdelijke bescherming;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.1.b
    text: |-
      de echtgenoot is van de vreemdeling, bedoeld onder a, of de ongehuwde partner met wie die vreemdeling een duurzame
      relatie onderhoudt, en ten tijde van de gebeurtenissen die hebben geleid tot het in de aanhef bedoelde besluit met
      die vreemdeling samenwoonde;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.1.c
    text: het minderjarige, ongehuwde, al dan niet geadopteerde kind is van de vreemdeling, bedoeld onder a of b;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.1.d
    text: |-
      een ander naast familielid is van de vreemdeling, bedoeld onder a, die ten tijde van de gebeurtenissen die hebben
      geleid tot het in de aanhef bedoelde besluit volledig of grotendeels afhankelijk was van die vreemdeling en met het
      gezin samenwoonde, en wiens achterlating een schrijnende situatie zou vormen; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.1.e
    text: |-
      behoort tot de bij regeling van Onze Minister aan te wijzen groep vreemdelingen uit hetzelfde land of dezelfde
      regio als de vreemdeling, bedoeld onder a, die om dezelfde reden ontheemd zijn en die niet reeds bescherming
      genieten in een ander land dat partij is bij het Verdrag tot oprichting van de Europese Gemeenschap of de
      Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.2
    text: 'In afwijking van het eerste lid kan Onze Minister bepalen dat uitzetting niet achterwege blijft, indien:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.2.a
    text: |-
      de aanvraag met toepassing van [artikel 30, eerste lid, onder a, van de wet][ref1] wordt afgewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
  - number: 3.1a.2.b
    text: |-
      de vreemdeling reeds tijdelijke bescherming geniet in een ander land dat partij is bij het Verdrag tot oprichting
      van de Europese Gemeenschap of de Overeenkomst betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.2.c
    text: |-
      de vreemdeling met toepassing van de richtlijn tijdelijke bescherming wordt overgebracht naar een ander land dat
      partij is bij het Verdrag tot oprichting van de Europese Gemeenschap of de Overeenkomst betreffende de Europese
      Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.2.d
    text: de vreemdeling naar het land of regio van herkomst is teruggekeerd;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.2.e
    text: 'ernstige redenen aanwezig zijn om aan te nemen dat de vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.2.e.1°
    text: |-
      een misdrijf tegen de vrede, een oorlogsmisdrijf, of een misdrijf tegen de menselijkheid heeft begaan als
      omschreven in de internationale instrumenten die bepalingen inzake dergelijke misdrijven bevatten;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.2.e.2°
    text: buiten Nederland een ernstig niet-politiek misdrijf heeft begaan alvorens hij tijdelijke bescherming verkreeg;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.2.e.3°
    text: zich schuldig heeft gemaakt aan daden die in strijd zijn met de doeleinden en beginselen van de Verenigde Naties;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.2.f
    text: |-
      de vreemdeling ingevolge een onherroepelijk geworden veroordeling wegens een bijzonder ernstig misdrijf een gevaar
      vormt voor de Nederlandse samenleving; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.2.g
    text: er redelijke gronden aanwezig zijn om de vreemdeling als gevaar voor de nationale veiligheid te beschouwen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.3
    text: |-
      Bij de toepassing van het tweede lid, onderdeel e, onder 2°, wordt de ernst van de verwachte vervolging afgewogen
      tegen de aard van het misdrijf waarvan de vreemdeling wordt verdacht, en kunnen bijzonder wrede handelingen,
      ook indien deze met een vermeend politiek oogmerk zijn verricht, worden aangemerkt als ernstige, niet-politieke
      misdrijven. Dit geldt voor alle deelnemers aan het misdrijf, met inbegrip van hen die het misdrijf hebben
      uitgelokt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: 3.1a.4
    text: |-
      Een besluit op grond van het tweede lid, onder e tot en met g, wordt met inachtneming van het
      evenredigheidsbeginsel gebaseerd op het persoonlijke gedrag van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.1a
  - number: '3.2'
    text: |-
      Voor de toepassing van [artikel 12, eerste lid, onder b en d, van de Wet][ref1] zijn de [artikelen 2.9][ref2],
      [2.10][ref3] en [2.11][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 3.3.1
    text: |-
      De termijn gedurende welke het aan vreemdelingen krachtens [artikel 12 van de Wet][ref1] is toegestaan in Nederland
      te verblijven is:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel12
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '12'
  - number: 3.3.1.a
    text: |-
      voor houders van een doorreisvisum en voor vreemdelingen aan wie uitsluitend voor doorreis een bijzonder
      doorlaatbewijs is afgegeven: de tijd welke voor de voortzetting van hun reis noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.3
  - number: 3.3.1.b
    text: |-
      voor houders van een doorreisvisum met bevoegdheid tot oponthoud of van een reisvisum: de duur waarvoor het visum
      is afgegeven of verlengd dan wel, voorzover het een visum voor meer reizen betreft, de in het visum aangegeven duur
      waarvoor ononderbroken verblijf is toegestaan;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.3
  - number: 3.3.1.c
    text: |-
      voor vreemdelingen die voor een verblijf van niet langer dan drie maanden naar Nederland zijn gekomen: drie
      maanden;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.3
  - number: 3.3.1.d
    text: |-
      voor de houder van een EG-verblijfsvergunning voor langdurig ingezetenen die is afgegeven door een andere staat die
      partij is bij het Verdrag tot oprichting van de Europese Gemeenschap, dan wel voor de echtgenoot of het minderjarig
      kind van die houder in geval het gezin reeds was gevormd in die staat: drie maanden;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.3
  - number: 3.3.1.e
    text: 'voor andere vreemdelingen: acht dagen.'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.3
  - number: 3.3.2
    text: |-
      De in het eerste lid, onder b en c, bedoelde termijn verstrijkt in geen geval later dan op de achtste dag nadat
      zich omstandigheden hebben voorgedaan, waaruit kan worden afgeleid dat de vreemdeling het voornemen heeft langer
      dan drie maanden binnen een tijdvak van zes maanden in Nederland te verblijven.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.3
  - number: 3.4.1
    text: |-
      De in [artikel 14, tweede lid, van de Wet][ref1] bedoelde beperkingen houden verband met:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
