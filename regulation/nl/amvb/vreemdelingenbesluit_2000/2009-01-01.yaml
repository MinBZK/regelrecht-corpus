  - number: 1.1.r
    text: |-
      gezinsvorming: gezinshereniging van de echtgenoot, geregistreerd partner of niet-geregistreerde partner, voor zover
      de gezinsband tot stand is gekomen op een tijdstip waarop de hoofdpersoon in Nederland hoofdverblijf had;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.1
  - number: 1.1.s
    text: |-
      richtlijn 2005/71/EG: richtlijn 2005/71/EG van de Raad van 12 oktober 2005 betreffende een specifieke procedure
      voor de toelating van onderdanen van derde landen met het oog op wetenschappelijk onderzoek (PbEU L 289).
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.1
  - number: 1.2.1
    text: 'In dit besluit wordt verstaan onder reisvisum:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.2
  - number: 1.2.1.a
    text: |-
      een visum, verleend door de bevoegde autoriteiten van één van de staten, die partij zijn bij een verdrag waarbij de
      grenscontrole is verlegd naar buitengrenzen, geldig voor het gehele of een gedeelte van het grondgebied van de bij
      dat verdrag aangesloten staten waarover de werking van dat verdrag zich uitstrekt, hetwelk krachtens dat verdrag
      kan worden afgegeven voor een verblijf van ten hoogste drie maanden, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.2
  - number: 1.2.1.b
    text: |-
      voorzover bij of krachtens dit besluit niet anders is bepaald; een visumverklaring, afgegeven krachtens het onder a
      bedoelde verdrag.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.2
  - number: 1.2.2
    text: 'In dit besluit wordt verstaan onder doorreisvisum:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.2
  - number: 1.2.2.a
    text: |-
      een visum, verleend door de bevoegde autoriteiten van één van de staten, die partij zijn bij een verdrag waarbij
      de grenscontrole is verlegd naar buitengrenzen, hetwelk overeenkomstig het bepaalde onder «reisvisum» kan worden
      afgegeven voor een doorreis al dan niet met een oponthoud van ten hoogste vijf dagen, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.2
  - number: 1.2.2.b
    text: |-
      voorzover bij of krachtens dit besluit niet anders is bepaald: doorreisvisumverklaring, afgegeven krachtens het
      onder «reisvisum» bedoelde verdrag.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.2
  - number: '1.3'
    text: |-
      Ter uitvoering van een verdrag waarbij de grenscontrole is verlegd naar buitengrenzen, wordt
      in [hoofdstuk 4, afdeling 1][ref1], de [artikelen 4.24][ref2] en [4.25][ref3], alsmede in
      [artikel 4.29, eerste lid, onderdeel i][ref4], onder «Nederland» mede verstaan het grondgebied van andere bij dat
      verdrag aangesloten landen waarover de werking van dat verdrag zich uitstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0011825
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011825
