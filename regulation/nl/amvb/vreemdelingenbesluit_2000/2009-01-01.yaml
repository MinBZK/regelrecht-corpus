  - number: 3.4.1.x
    text: verblijf als alleenstaande minderjarige vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.4
  - number: 3.4.1.y
    text: |-
      verblijf als kennismigrant als bedoeld in [artikel 1d van het Besluit uitvoering Wet arbeid vreemdelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007523#Artikel1d
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.4
    references:
