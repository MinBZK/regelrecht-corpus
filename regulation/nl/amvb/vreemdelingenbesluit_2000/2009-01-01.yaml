        artikel: 1e
  - number: 3.4.1.aa
    text: verblijf als economisch niet-actieve langdurig ingezetene;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.4
  - number: 3.4.1.bb
    text: verblijf als onderzoeker in de zin van richtlijn 2005/71/EG.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.4
  - number: 3.4.2
    text: |-
      De beperkingen, bedoeld in het eerste lid, kunnen nader worden omschreven bij de verlening van de
      verblijfsvergunning.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.4
  - number: 3.4.3
    text: |-
      Tenzij het doel waarvoor de vreemdeling in Nederland wil verblijven een zodanig verband houdt met de situatie
      in het land van herkomst dat voor de beoordeling daarvan naar het oordeel van Onze Minister de indiening van een
      aanvraag als bedoeld in [artikel 28 van de Wet][ref1] noodzakelijk is, kan Onze Minister de verblijfsvergunning
      voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref2], verlenen onder een andere beperking, dan genoemd in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.4.4
    text: |-
      Een beroep op de publieke middelen kan in ieder geval gevolgen hebben voor het verblijfsrecht, indien de
      verblijfsvergunning is verleend onder één van de beperkingen, bedoeld in het eerste lid, onder a tot en met r, en
      het derde lid. Bij ministeriële regeling kunnen regels worden gesteld over deze beperkingen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.4
  - number: 3.5.1
    text: |-
      Het verblijfsrecht op grond van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref1], is tijdelijk of niet-tijdelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.5.2
    text: |-
      Het verblijfsrecht is tijdelijk, indien de verblijfsvergunning is verleend onder een beperking, verband houdend
      met:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.5
  - number: 3.5.2.a
    text: |-
      gezinsvorming of gezinshereniging met, of verblijf ter adoptie of als pleegkind bij, een persoon met tijdelijk
      verblijfsrecht of een houder van de verblijfsvergunning bedoeld in [artikel 28 van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.5
    references:
