  - number: 1.1.f
    text: |-
      proces-uren: de uren die voor het onderzoek naar de aanvraag tot het verlenen van een verblijfsvergunning voor
      bepaalde tijd als bedoeld in [artikel 28 van de Wet][ref1] in een Aanmeldcentrum beschikbaar zijn, waarbij de uren
      van 18.00 tot 08.00 en, met uitzondering van het Aanmeldcentrum Schiphol, de uren gedurende het weekeinde en de
      dagen die bij of krachtens de Algemene termijnenwet zijn aangemerkt als algemeen erkende feestdagen niet meetellen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.1
    references:
