        artikel: '28'
  - number: 1.1.g
    text: |-
      Schengengebied: het grondgebied van de landen waarop de Schengengrenscode en de Schengen Uitvoeringsovereenkomst
      van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.1
  - number: 1.1.h
    text: |-
      Schengen Informatiesysteem: het in titel IV van de Schengen Uitvoeringsovereenkomst bedoelde gemeenschappelijke
      informatiesysteem;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.1
  - number: 1.1.i
    text: |-
      Schengen Uitvoeringsovereenkomst: de op 19 juni 1990 te Schengen tot stand gekomen Overeenkomst ter uitvoering van
      het tussen de regeringen van de staten van de Benelux Economische Unie, de bondsrepubliek Duitsland en de Franse
      republiek op 14 juni 1985 te Schengen gesloten akkoord betreffende de geleidelijke afschaffing van de controles aan
      de gemeenschappelijke grenzen (Trb. 1990, 145), alsmede de daarop gebaseerde Protocollen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.1
  - number: 1.1.j
    text: |-
      schip: hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, onder b, van de Scheepvaartverkeerswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel1
