      het afwachten van onderzoek naar de geschiktheid van de aspirant-adoptiefouders, bedoeld in
      [artikel 11 van de Wet opneming buitenlandse kinderen ter adoptie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel11
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.5
    references:
