        bwb_id: BWBR0003738
        artikel: '17'
  - number: 3.5.2.q
    text: verblijf als alleenstaande minderjarige vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.5
  - number: 3.5.2.r
    text: verblijf als vreemdeling die buiten zijn schuld niet uit Nederland kan vertrekken; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.5
  - number: 3.5.2.s
    text: |-
      werkzaamheid in het kader van grensoverschrijdende dienstverlening, als bedoeld in
      [artikel 1e van het Besluit uitvoering Wet arbeid vreemdelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007523#Artikel1e
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0007523
        artikel: 1e
  - number: 3.5.2.t
    text: het doorbrengen van verlof in Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.5
  - number: 3.5.3
    text: |-
      Indien de verblijfsvergunning is verleend onder een andere beperking dan genoemd in het tweede lid, is het
      verblijfsrecht niet-tijdelijk, tenzij bij de verlening van de verblijfsvergunning anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.5
  - number: 3.6.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan slechts ambtshalve worden
      verleend onder een beperking verband houdend met:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.6.1.a
    text: verblijf als vreemdeling die buiten zijn schuld niet uit Nederland kan vertrekken;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.6
  - number: 3.6.1.b
    text: verblijf als alleenstaande minderjarige vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.6
  - number: 3.6.2
    text: |-
      Bij ministeriële regeling kunnen andere beperkingen dan genoemd in het eerste lid worden aangewezen waaronder de
      verblijfsvergunning ambtshalve kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.6
  - number: 3.7.1
    text: |-
      Aan de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan als voorschrift tot
      het stellen van zekerheid worden verbonden:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.7.1.a
    text: |-
      het deponeren van een waarborgsom ter dekking van de kosten, verbonden aan de reis van de vreemdeling naar een
      plaats buiten Nederland waar zijn toegang is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.7
  - number: 3.7.1.b
    text: |-
      de schriftelijke garantstelling door een solvabele derde voor de kosten die voor de Staat en andere openbare
      lichamen uit het verblijf van de houder van de verblijfsvergunning kunnen voortvloeien, alsmede voor de kosten van
      diens reis naar een plaats buiten Nederland waar zijn toegang is gewaarborgd, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.7
  - number: 3.7.1.c
    text: |-
      het voldoende verzekerd zijn tegen ziektekosten met inbegrip van de kosten verbonden aan opname en verpleging in
      een sanatorium of een psychiatrische inrichting.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.7
  - number: 3.7.2
    text: In plaats van een waarborgsom kan een passagebiljet worden gedeponeerd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.7
  - number: 3.7.3
    text: |-
      In plaats van zekerheid, gesteld overeenkomstig het eerste lid, onder a of b, kan zakelijke zekerheid worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.7
  - number: 3.7.4
    text: |-
      Het voorschrift, bedoeld in het eerste lid, onder a, wordt niet aan de verblijfsvergunning verbonden dan op
      aanwijzing van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      De waarborgsom, bedoeld in [artikel 3.7, eerste lid, onder a][ref1], wordt gedeponeerd bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.9.1
    text: |-
      De waarborgsom, bedoeld in [artikel 3.7, eerste lid, onder a][ref1], wordt in ieder geval door Onze Minister aan de
      rechthebbende teruggegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.9.1.a
    text: |-
      zodra de verblijfsvergunning, bedoeld in [artikel 14 van de Wet][ref1], of het desbetreffende voorschrift, is
      ingetrokken, dan wel de geldigheidsduur van de verblijfsvergunning is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.9.1.b
    text: |-
      zodra aan de vreemdeling de verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20 van de Wet][ref1],
      is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.9.1.c
    text: zodra de vreemdeling Nederlander wordt of krachtens enige wet als Nederlander moet worden behandeld;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.9
  - number: 3.9.1.d
    text: bij overlijden van de vreemdeling, dan wel
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.9
  - number: 3.9.1.e
    text: uiterlijk vijf jaar nadat de waarborgsom is gestort.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.9
  - number: 3.9.2
    text: |-
      Indien een waarborgsom wordt teruggegeven wegens het intrekken of het verstrijken van de geldigheidsduur van
      de verblijfsvergunning, bedoeld in het eerste lid, onder a, vindt de teruggave plaats met aftrek van de door de
      overheid gemaakte of te maken kosten, verbonden aan de reis van de vreemdeling naar een plaats buiten Nederland
      waar zijn toegang is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.9
  - number: 3.10.1
    text: |-
      Onze Minister berekent rente over waarborgsommen, gedeponeerd krachtens [artikel 3.7, eerste lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.10.2
    text: |-
      De rente wordt berekend vanaf het kalenderjaar volgend op het jaar waarin de waarborgsom is gestort. Over het
      kalenderjaar waarin de waarborgsom is gedeponeerd, wordt geen rente vergoed. Bij de berekening van de termijn
      waarover rente wordt vergoed, wordt het kalenderjaar waarin de waarborgsom wordt terugbetaald als vol jaar
      meegeteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.10
  - number: '3.11'
    text: |-
      De waarborgsom wordt teruggegeven en de rente wordt uitbetaald zo spoedig mogelijk nadat één van de in
      [artikel 3.9, eerste lid][ref1], genoemde gronden zich voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.12.1
    text: |-
      Verplichtingen, voortvloeiende uit een garantstelling overeenkomstig [artikel 3.7, eerste lid, onder b][ref1], of
      het stellen van zakelijke zekerheid overeenkomstig [artikel 3.7, derde lid][ref2], hebben uitsluitend betrekking
      op kosten, veroorzaakt binnen vijf jaren, nadat de verblijfsvergunning, bedoeld in [artikel 14 van de Wet][ref3],
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.12.2
    text: 'Onze Minister kan bepalen dat de in het eerste lid genoemde termijn korter is dan vijf jaren, indien:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.12
  - number: 3.12.2.a
    text: op andere wijze voldoende zekerheid is gesteld;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.12
  - number: 3.12.2.b
    text: de vreemdeling Nederland definitief heeft verlaten;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.12
  - number: 3.12.2.c
    text: |-
      aan de vreemdeling een verblijfsvergunning onder een andere beperking of een verblijfsvergunning voor onbepaalde
      tijd is verleend; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.12
  - number: 3.12.2.d
    text: de vreemdeling de Nederlandse nationaliteit heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.12
  - number: 3.12.3
    text: Het model van de garantstelling wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.12
  - number: 3.13.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], wordt onder een
      beperking verband houdend met gezinshereniging of gezinsvorming, verleend aan het in [artikel 3.14][ref2]
      genoemde gezinslid van de in [artikel 3.15][ref3] bedoelde hoofdpersoon, indien wordt voldaan aan alle in de
      [artikelen 3.16 tot en met 3.22][ref4] genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.13.2
    text: In de overige gevallen kan de in het eerste lid bedoelde verblijfsvergunning worden verleend.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.13
  - number: 3.14.1
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend aan:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.14.1.a
    text: |-
      de vreemdeling van achttien jaar of ouder die met de hoofdpersoon een naar Nederlands internationaal privaatrecht
      geldig huwelijk of een in Nederland geregistreerd partnerschap is aangegaan;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.14
  - number: 3.14.1.b
    text: |-
      de vreemdeling van achttien jaar of ouder, die met de hoofdpersoon een duurzame en exclusieve relatie onderhoudt,
      waarin de partners:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.14
  - number: 3.14.1.b.1°
    text: |-
      niet tot elkaar in een zodanig nauwe relatie staan dat die naar Nederlands recht een huwelijksbeletsel zou vormen,
      en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.14
  - number: 3.14.1.b.2°
    text: |-
      ongehuwd zijn en geen in Nederland geregistreerd partnerschap zijn aangegaan, tenzij het huwelijk door wettelijke
      beletselen, waarop geen invloed kan worden uitgeoefend, niet is ontbonden; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.14
  - number: 3.14.1.c
    text: |-
      het minderjarige biologische of juridische kind van de hoofdpersoon, dat naar het oordeel van Onze Minister
      feitelijk behoort en reeds in het land van herkomst feitelijk behoorde tot het gezin van die hoofdpersoon en dat
      onder het rechtmatige gezag van die hoofdpersoon staat.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.14
  - number: 3.14.2
    text: |-
      Ingeval van gezinsvorming wordt de verblijfsvergunning, in afwijking van het eerste lid, onder a en b, verleend
      indien de vreemdeling 21 jaar of ouder is.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.14
  - number: 3.15.1
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend aan het in [artikel 3.14][ref2]
      bedoelde gezinslid van:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.15.1.a
    text: een Nederlander van achttien jaar of ouder, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.15
  - number: 3.15.1.b
    text: |-
      een vreemdeling van achttien jaar of ouder met rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], dat niet-tijdelijk is in de zin van
      [artikel 3.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.15.2
    text: |-
      Ingeval van gezinsvorming wordt de verblijfsvergunning, in afwijking van het eerste lid, onder a en b, verleend
      indien de hoofdpersoon 21 jaar of ouder is.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.15
  - number: 3.15.3
    text: |-
      Indien de vreemdeling als gezinslid in Nederland wil verblijven bij een hoofdpersoon die houder is van de
      verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], onder een beperking verband
      houdend met het doorbrengen van verlof in Nederland en die hoofdpersoon werkzaam is op een mijnbouwinstallatie op
      het continentaal plat, wordt de verblijfsvergunning eerst verleend, nadat deze hoofdpersoon een arbeidsverleden op
      een mijnbouwinstallatie op het continentaal plat heeft van ten minste zeven jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '3.16'
    text: |-
      Zolang de vreemdeling of de hoofdpersoon met meer dan één andere persoon tegelijkertijd door een huwelijk of een
      partnerschap is verbonden, wordt de verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], slechts
      verleend aan één echtgenoot, geregistreerd partner of partner tegelijkertijd, alsmede aan de uit die vreemdeling
      geboren minderjarige kinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: '3.17'
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.17.a
    text: de vreemdeling en de hoofdpersoon samenwonen en een gemeenschappelijke huishouding voeren, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.17
  - number: 3.17.b
    text: |-
      het huwelijk of het geregistreerd partnerschap is ingeschreven in de gemeentelijke basisadministratie
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.17
  - number: '3.18'
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend, indien de vreemdeling
      beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel waarvoor
      de verblijfsvergunning is aangevraagd of behoort tot één van de in [artikel 17 van de Wet][ref2] of in
      [artikel 3.71, tweede lid][ref3], bedoelde categorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '3.19'
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend, indien de vreemdeling beschikt
      over een geldig document voor grensoverschrijding, dan wel naar het oordeel van Onze Minister heeft aangetoond
      dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van een geldig
      document voor grensoverschrijding kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: '3.20'
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend, indien de vreemdeling geen
      gevaar vormt voor de openbare orde of nationale veiligheid. De [artikelen 3.77][ref2] en [3.78][ref3] zijn van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '3.21'
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend, indien de vreemdeling
      bereid is een onderzoek naar of behandeling voor tuberculose te ondergaan en daaraan mee te werken, dan wel de
      nationaliteit bezit van een van de bij ministeriële regeling vast te stellen landen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.22.1
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend, indien de hoofdpersoon:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.22.1.a
    text: |-
      duurzaam en zelfstandig beschikt over een netto-inkomen als bedoeld in [artikel 3.74, onder a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.22.1.b
    text: een garantstelling heeft ondertekend, voorzover de vreemdeling als partner van die persoon wil verblijven.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.22
  - number: 3.22.2
    text: |-
      Ingeval van gezinsvorming wordt de verblijfsvergunning, in afwijking van het eerste lid, verleend
      indien de hoofdpersoon duurzaam en zelfstandig beschikt over een netto-inkomen dat ten minste
      gelijk is aan 120 procent van het minimumloon, bedoeld in [artikel 8, eerste lid, onder a][ref1], en
      [artikel 14 van de Wet minimumloon en minimumvakantiebijslag][ref2], met inbegrip van de vakantiebijslag, bedoeld
      in [artikel 15 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 3.22.3
    text: |-
      In afwijking van het eerste en tweede lid wordt de verblijfsvergunning eveneens verleend, indien de hoofdpersoon 65
      jaar of ouder is of naar het oordeel van Onze Minister blijvend en volledig arbeidsongeschikt is.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.22
  - number: 3.22.4
    text: |-
      Tenzij sprake is van gezinsvorming, wordt de verblijfsvergunning in afwijking van het eerste lid eveneens verleend,
      indien de aanvraag is ingediend binnen drie maanden nadat aan de hoofdpersoon een verblijfsvergunning voor bepaalde
      tijd als bedoeld in [artikel 28 van de wet][ref1] is verleend en gezinshereniging niet mogelijk is in een derde
      land waarmee de vreemdeling of de hoofdpersoon bijzondere banden heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.23.1
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend aan de in Nederland geboren
      vreemdeling, die het hoofdverblijf niet buiten Nederland heeft verplaatst en die naar het oordeel van Onze Minister
      feitelijk is blijven behoren tot het in Nederland gevestigde gezin van de ouder, die rechtmatig verblijf heeft
      als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2], en die sedert de geboorte van de
      vreemdeling het hoofdverblijf niet buiten Nederland heeft verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.23.2
    text: |-
      Indien de aanvraag is ontvangen voordat de vreemdeling de leeftijd van negen maanden heeft bereikt, wordt de
      verblijfsvergunning eveneens verleend aan de buiten Nederland geboren vreemdeling, die naar het oordeel van Onze
      Minister feitelijk is blijven behoren tot het gezin van beide ouders, die sedert de geboorte van de vreemdeling
      rechtmatig verblijf als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], hebben en het
      hoofdverblijf niet buiten Nederland hebben verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.23.3
    text: |-
      Indien de vader van de in het tweede lid bedoelde vreemdeling onbekend is, wordt de verblijfsvergunning
      verleend, indien de moeder sedert de geboorte van de vreemdeling rechtmatig verblijf op grond van
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1] heeft en het hoofdverblijf niet buiten Nederland
      heeft verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.23.4
    text: 'De verblijfsvergunning wordt verleend, indien de vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23
  - number: 3.23.4.a
    text: |-
      beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel waarvoor
      de verblijfsvergunning is aangevraagd, of behoort tot één van de in [artikel 17 van de Wet][ref1] of in
      [artikel 3.71, tweede lid][ref2], bedoelde categorieën;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.23.4.b
    text: |-
      beschikt over een geldig document voor grensoverschrijding, of naar het oordeel van Onze Minister heeft aangetoond
      dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van een geldig
      document voor grensoverschrijding kan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23
  - number: 3.23.4.c
    text: |-
      bereid is een onderzoek naar of behandeling voor tuberculose te ondergaan en daaraan mee te werken, of de
      nationaliteit bezit van een van de bij ministeriële regeling vast te stellen landen, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23
  - number: 3.23.4.d
    text: geen gevaar vormt voor de openbare orde of nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23
  - number: 3.23.5
    text: |-
      Bij de toepassing van het vierde lid, onder d, zijn de [artikelen 3.77][ref1] en [3.78][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.23a.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend
      onder een beperking verband houdend met gezinshereniging, aan de echtgenoot, de geregistreerde
      partner dan wel de ongehuwde partner van de langdurig ingezetene met rechtmatig verblijf in de zin van
      [artikel 8, onder a, b dan wel l, van de Wet][ref2], en het minderjarige kind van die echtgenoot, partner of
      langdurig ingezetene, indien dat kind, die echtgenoot of partner:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.23a.1.a
    text: |-
      in een andere staat die partij is bij het Verdrag tot oprichting van de Europese Gemeenschap is toegelaten als
      gezinslid van de langdurig ingezetene;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23a
  - number: 3.23a.1.b
    text: beschikt over een geldig document voor grensoverschrijding;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23a
  - number: 3.23a.1.c
    text: |-
      al dan niet tezamen met de langdurig ingezetene duurzaam en zelfstandig beschikt over een netto-inkomen als bedoeld
      in [artikel 3.74, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.23a.1.d
    text: |-
      geen gevaar vormt voor de openbare orde als bedoeld in de [artikelen 3.77][ref1] en [3.78][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.23a.1.e
    text: geen gevaar vormt voor de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23a
  - number: 3.23a.2
    text: |-
      De verblijfsvergunning, bedoeld in het eerste lid, kan worden verleend onder een beperking verband houdend met
      gezinshereniging, aan het ongehuwde meerderjarige kind van de langdurig ingezetene, de echtgenoot of partner,
      bedoeld in het eerste lid, indien de achterlating van dat kind naar het oordeel van Onze Minister een onevenredige
      hardheid zou betekenen. De onderdelen a tot en met e van het eerste lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23a
  - number: 3.23a.3
    text: |-
      In afwijking van het eerste en tweede lid wordt de verblijfsvergunning niet verleend aan de ongehuwde partner of
      het kind van die partner, indien de relatie van die partner met de langdurig ingezetene niet duurzaam is of niet
      naar behoren is geattesteerd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.23a
  - number: '3.24'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met gezinshereniging worden verleend aan een ander familielid van een Nederlander of van een
      vreemdeling met rechtmatig verblijf als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2],
      dan de echtgenoot of echtgenote, de al dan niet geregistreerde partner, of het minderjarige kind, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.24.a
    text: |-
      de vreemdeling naar het oordeel van Onze Minister feitelijk behoort en reeds in het land van herkomst feitelijk
      behoorde tot het gezin van de persoon bij wie deze vreemdeling wil verblijven, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.24
  - number: 3.24.b
    text: de achterlating van de vreemdeling naar het oordeel van Onze Minister een onevenredige hardheid zou betekenen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.24
  - number: 3.24a.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], wordt onder een
      beperking verband houdend met gezinshereniging verleend aan de bloedverwant in rechtstreekse opgaande lijn
      van de alleenstaande minderjarige houder van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de wet][ref2], die niet daadwerkelijk onder de hoede staat van een krachtens wettelijk voorschrift
      of gewoonterecht voor hem verantwoordelijke volwassene, indien die bloedverwant:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.24a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.24a.1.a
    text: |-
      beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel waarvoor
      de verblijfsvergunning is aangevraagd, of behoort tot één van de in [artikel 17 van de Wet][ref1] of in
      [artikel 3.71, tweede lid][ref2], bedoelde categorieën;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.24a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.24a.1.b
    text: |-
      beschikt over een geldig document voor grensoverschrijding, of naar het oordeel van Onze Minister heeft aangetoond
      dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van een geldig
      document voor grensoverschrijding kan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.24a
  - number: 3.24a.1.c
    text: |-
      bereid is een onderzoek naar of behandeling voor tuberculose te ondergaan en daaraan mee te werken of de
      nationaliteit bezit van een van de bij ministeriële regeling vast te stellen landen, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.24a
  - number: 3.24a.1.d
    text: |-
      geen gevaar vormt voor de openbare orde of nationale veiligheid als bedoeld in de [artikelen 3.77][ref1] en
      [3.78][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.24a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.24a.2
    text: |-
      Indien gezinshereniging mogelijk is in een derde land waarmee de alleenstaande minderjarige of de bloedverwant,
      bedoeld in het eerste lid, bijzondere banden heeft of indien de aanvraag niet is ingediend binnen drie maanden
      nadat aan de alleenstaande minderjarige, bedoeld in het eerste lid, de verblijfsvergunning voor bepaalde tijd,
      bedoeld in [artikel 28 van de wet][ref1], is verleend, wordt de vergunning eerst verleend, nadat de alleenstaande
      minderjarige heeft aangetoond duurzaam en zelfstandig te beschikken over een netto-inkomen als bedoeld in
      [artikel 3.74, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.24a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.25.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met gezinshereniging worden verleend aan de vreemdeling, die vijfenzestig jaar of ouder is, die in
      het land van herkomst alleenstaand is en die in Nederland wil verblijven bij zijn kinderen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.25.1.a
    text: |-
      vrijwel alle kinderen rechtmatig als bedoeld in [artikel 8, onder b, c en d, van de Wet][ref1], of als Nederlander
      in Nederland verblijven, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.25.1.b
    text: |-
      er in het land van herkomst geen kind van de vreemdeling woont dat naar het oordeel van Onze Minister geacht kan
      worden in de opvang van de vreemdeling te kunnen voorzien.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.25
  - number: 3.25.2
    text: |-
      In afwijking van [artikel 3.74][ref1] zijn middelen van bestaan voldoende, indien de in het eerste lid, onder a,
      bedoelde kinderen gezamenlijk duurzaam en zelfstandig beschikken over een netto-inkomen gelijk aan de som van de
      bestaansminima, bedoeld in de [Wet werk en bijstand][ref2], voor de desbetreffende categorie, aangevuld met het
      bestaansminimum voor alleenstaanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0015703
  - number: 3.26.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met verblijf ter adoptie worden verleend aan de minderjarige vreemdeling, die ter adoptie
      wil verblijven in het gezin van een of meer Nederlanders of vreemdelingen met rechtmatig verblijf als
      bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2], indien aan de vereisten van de
      [Wet opneming buitenlandse kinderen ter adoptie][ref3] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004447
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0004447
  - number: 3.26.2
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder b of c, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.27.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met het afwachten van het onderzoek naar de geschiktheid van de aspirant-adoptiefouders als bedoeld
      in [artikel 11 van de Wet opneming buitenlandse kinderen ter adoptie][ref2], worden verleend aan de minderjarige
      vreemdeling die door de aspirant-adoptiefouders in een periode waarin zij hun gewone verblijfplaats in het
      buitenland hadden, is opgenomen en door hen aldaar is verzorgd en opgevoed, tezamen met de aspirant-adoptiefouders
      Nederland is ingereisd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004447#Artikel11
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0004447
        artikel: '11'
  - number: 3.27.1.a
    text: |-
      de aspirant-adoptiefouders Nederlanders zijn of vreemdelingen met rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.27.1.b
    text: |-
      de ouders van de vreemdeling, of indien deze zijn overleden of een onbekende verblijfplaats hebben de autoriteiten
      van het land van verblijf voor de komst naar Nederland, hebben ingestemd met het vertrek van de vreemdeling naar
      het land van verblijf vóór de komst van het gezin naar Nederland en met de opneming van de vreemdeling ter adoptie.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.27
  - number: 3.27.2
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder b of c, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.27.3
    text: |-
      Dit artikel is niet van toepassing indien de vreemdeling op het tijdstip van de inreis sinds meer dan een jaar
      bij de aspirant-adoptiefouders verblijft en door hen is verzorgd en opgevoed of indien het kind is geadopteerd
      in overeenstemming met het op 29 mei 1993 te 's-Gravenhage tot stand gekomen verdrag inzake de bescherming van
      kinderen en de samenwerking op het gebied van de interlandelijke adoptie (Trb. 1993, 197), welke overeenstemming
      blijkt uit een schriftelijke verklaring van de centrale autoriteit van de staat waar de adoptie heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.27
  - number: 3.28.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met verblijf als pleegkind worden verleend aan de minderjarige vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.28.1.a
    text: |-
      die als pleegkind in Nederland wil verblijven in het gezin van één of meer Nederlanders of vreemdelingen met
      rechtmatig verblijf, als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.28.1.b
    text: die naar het oordeel van Onze Minister in het land van herkomst geen aanvaardbare toekomst heeft.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.28
  - number: 3.28.2
    text: De aspirant-pleegouders dienen in staat te zijn de vreemdeling een goede opvoeding en verzorging te geven.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.28
  - number: 3.28.3
    text: Bij de aanvraag wordt een medische verklaring overgelegd en een garantverklaring ondertekend.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.28
  - number: 3.28.4
    text: |-
      De aanvraag wordt niet op grond van [artikel 16, eerste lid, onder c, van de Wet][ref1] afgewezen, indien de
      persoon bij wie de vreemdeling wil verblijven 65 jaar of ouder is of naar het oordeel van Onze Minister blijvend en
      volledig arbeidsongeschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.29.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met familiebezoek worden verleend aan de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.29.1.a
    text: |-
      die zes maanden of korter in Nederland wil verblijven bij een in Nederland verblijvend familielid dat rechtmatig
      verblijf als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1] heeft, of Nederlander is, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.29.1.b
    text: wiens terugkeer naar het oordeel van Onze Minister redelijkerwijs is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.29
  - number: 3.29.2
    text: |-
      In afwijking van [artikel 3.75][ref1] zijn middelen van bestaan duurzaam, indien zij voor de duur van het
      voorgenomen verblijf van de vreemdeling beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.29.3
    text: |-
      Indien het verblijf van de vreemdeling wordt bekostigd door een in Nederland gevestigd familielid of andere
      relatie, wordt onder voldoende middelen van bestaan verstaan een netto-inkomen, gelijk aan het bestaansminimum,
      bedoeld in de [Wet werk en bijstand][ref1], voor de desbetreffende categorie, aangevuld met het bestaansminimum
      voor alleenstaanden van 21 jaar of ouder. Het familielid ondertekent een garantstelling. Het model van de
      garantstelling wordt bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 3.29a
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], wordt verleend onder
      een beperking verband houdend met verblijf als economisch niet-actieve langdurig ingezetene aan de langdurig
      ingezetene, die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.29a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.29a.a
    text: beschikt over een geldig document voor grensoverschrijding;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.29a
  - number: 3.29a.b
    text: |-
      duurzaam en zelfstandig beschikt over een netto-inkomen als bedoeld in [artikel 3.74, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.29a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.29a.c
    text: |-
      geen gevaar vormt voor de openbare orde als bedoeld in de [artikelen 3.77][ref1] en [3.78][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.29a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.29a.d
    text: geen gevaar vormt voor de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.29a
  - number: 3.30.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking,
      verband houdende met het verrichten van arbeid als zelfstandige worden verleend aan de vreemdeling die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.30.1.a
    text: |-
      arbeid als zelfstandige verricht of gaat verrichten, waarmee naar het oordeel van Onze Minister een wezenlijk
      Nederlands belang is gediend;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.30
  - number: 3.30.1.b
    text: uit die werkzaamheden duurzaam en zelfstandig voldoende middelen van bestaan verwerft, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.30
  - number: 3.30.1.c
    text: |-
      voldoet aan de bevoegdheidsvereisten voor de uitoefening van die arbeid en aan de vereisten voor het uitoefenen van
      het desbetreffende bedrijf.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.30
  - number: 3.30.2
    text: |-
      Bij ministeriële regeling kunnen in overeenstemming met Onze Minister van Economische Zaken
      ondernemingsactiviteiten worden aangewezen waarmee geen wezenlijk Nederlands economisch belang is gediend.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.30
  - number: 3.30.3
    text: |-
      De aanvraag wordt niet afgewezen wegens het ontbreken van een wezenlijk Nederlands belang, indien de vreemdeling op
      het moment waarop de aanvraag is ontvangen een ononderbroken arbeidsverleden heeft van ten minste zeven jaar:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.30
  - number: 3.30.3.a
    text: aan boord van een Nederlands zeeschip;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.30
  - number: 3.30.3.b
    text: op het Nederlandse deel van het continentaal plat;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.30
  - number: 3.30.3.c
    text: in de internationale binnenscheepvaart aan boord van Nederlandse schepen of daarmee gelijkgestelde inrichtingen, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.30
  - number: 3.30.3.d
    text: |-
      in het internationale wegtransport in dienst van een Nederlandse werkgever, voorzover dat transport vanuit of naar
      Nederland plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.30
  - number: 3.30.4
    text: |-
      Voor de toepassing van het derde lid worden niet als onderbrekingen aangemerkt tussentijdse perioden van
      onvrijwillige werkloosheid, voorzover die in Nederland zijn doorgebracht en elk zes maanden of korter duurden, en
      die perioden in totaal niet langer dan twaalf maanden bedragen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.30
  - number: 3.30.5
    text: De verblijfsvergunning kan aan een langdurig ingezetene worden verleend in afwijking van het eerste lid, onder a.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.30
  - number: 3.31.1
    text: |-
      Met inachtneming van het tweede lid en de [artikelen 3.33][ref1] en [3.99 tot en met 3.104][ref2],
      wordt de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref3], onder een
      beperking verband houdend met het verrichten van arbeid in loondienst verleend aan de vreemdeling
      die in Nederland arbeid in loondienst verricht of gaat verrichten en waarvoor na toetsing aan
      prioriteitgenietend aanbod op de Nederlandse arbeidsmarkt een tewerkstellingsvergunning als bedoeld in
      [artikel 1, onder e, van de Wet arbeid vreemdelingen][ref4] is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0007149#Artikel1
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0007149
        artikel: '1'
  - number: 3.31.2
    text: 'De in het eerste lid bedoelde verblijfsvergunning wordt verleend, indien de vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.31
  - number: 3.31.2.a
    text: |-
      beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel waarvoor
      de verblijfsvergunning is aangevraagd, of behoort tot één van de in [artikel 17 van de Wet][ref1] of in
      [artikel 3.71, tweede lid][ref2], bedoelde categorieën;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.31.2.b
    text: |-
      beschikt over een geldig document voor grensoverschrijding, of naar het oordeel van Onze Minister heeft aangetoond
      dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van een geldig
      document voor grensoverschrijding kan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.31
  - number: 3.31.2.c
    text: |-
      met de arbeid in loondienst duurzaam en zelfstandig een netto-inkomen als bedoeld in [artikel 3.74, onder a][ref1],
      verwerft;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.31.2.d
    text: |-
      bereid is een onderzoek naar of behandeling voor tuberculose te ondergaan en daaraan mee te werken of de
      nationaliteit bezit van een van de bij ministeriële regeling vast te stellen landen, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.31
  - number: 3.31.2.e
    text: |-
      geen gevaar vormt voor de openbare orde of nationale veiligheid als bedoeld in de [artikelen 3.77][ref1] en
      [3.78][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.31.3
    text: |-
      Indien de tewerkstellingsvergunning is afgegeven met een geldigheidsduur korter dan één jaar, zijn de middelen van
      bestaan in afwijking van [artikel 3.75][ref1] duurzaam, indien de vreemdeling gedurende de geldigheidsduur van de
      tewerkstellingsvergunning zelfstandig zal beschikken over voldoende middelen van bestaan uit die arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.31.4
    text: In andere gevallen kan de in het eerste lid bedoelde verblijfsvergunning worden verleend.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.31
  - number: 3.31.5
    text: |-
      De aanvraag die is ingediend door een langdurig ingezetene wordt niet afgewezen op de gronden, bedoeld in het
      tweede lid, onder a of d.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.31
  - number: 3.31a.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking,
      verband houdend met werkzaamheid in het kader van grensoverschrijdende dienstverlening als bedoeld in
      [artikel 1e, eerste lid, van het Besluit uitvoering Wet arbeid vreemdelingen][ref2], worden verleend indien de daar
      bedoelde melding is gedaan, onder verstrekking van de in het tweede lid van dat artikel voorgeschreven gegevens
      en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007523#Artikel1e
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.31a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0007523
        artikel: 1e
  - number: 3.31a.2
    text: |-
      De aanvraag, bedoeld in het eerste lid, wordt niet afgewezen op de gronden, bedoeld in
      [artikel 16, eerste lid, onder c of e, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.31a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: '3.32'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], wordt niet verleend onder
      een beperking verband houdend met het verrichten van arbeid als zelfstandige of in loondienst, indien die arbeid
      geheel of gedeeltelijk bestaat uit het verrichten van seksuele handelingen met derden of het verlenen van seksuele
      diensten aan derden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.32
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.33.1
    text: |-
      Onverminderd [artikel 3.31][ref1] kan de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref2], onder een beperking verband houdend met het verrichten van arbeid in loondienst
      als geestelijk voorganger of godsdienstleraar slechts worden verleend, indien de vreemdeling tevens schriftelijk
      verklaart ermee bekend te zijn dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.33.1.a
    text: |-
      slechts verblijf wordt toegestaan voor het verrichten van werkzaamheden als geestelijk voorganger of
      godsdienstleraar ten behoeve van de met name te noemen groepering;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.33
  - number: 3.33.1.b
    text: het verblijf slechts kan worden toegestaan voor de duur van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.33
  - number: 3.33.1.c
    text: hij na beëindiging daarvan Nederland dient te verlaten, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.33
  - number: 3.33.1.d
    text: het hem niet is toegestaan om gedurende zijn verblijf in Nederland werkzaamheden van andere aard te verrichten.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.33
  - number: 3.33.2
    text: Het model van de verklaring wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.33
  - number: 3.34.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden verleend onder een
      beperking verband houdend met het verrichten van arbeid in loondienst aan boord van een Nederlands schip of op een
      mijnbouwinstallatie op het continentaal plat, aan de vreemdeling die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.34.1.a
    text: |-
      een arbeidsverleden aan boord van een Nederlands zeeschip of op een mijnbouwinstallatie op het continentaal plat
      heeft van ten minste zeven jaar;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.34
  - number: 3.34.1.b
    text: |-
      tijdens het arbeidsverleden, voorzover opgebouwd aan boord van een Nederlands zeeschip, frequent Nederlandse havens
      heeft aangedaan, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.34
  - number: 3.34.1.c
    text: |-
      gedurende ten minste nog een jaar beschikt over een arbeidsplaats aan boord van een Nederlands schip of op een
      mijnbouwinstallatie op het continentaal plat, waarmee hij duurzaam voldoende middelen van bestaan verwerft.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.34
  - number: 3.34.2
    text: 'Het arbeidsverleden, bedoeld in het eerste lid, onder a, is niet onderbroken ingeval van:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.34
  - number: 3.34.2.a
    text: |-
      tussentijdse, in Nederland doorgebrachte perioden van onvrijwillige werkloosheid van elk ten hoogste zes maanden,
      of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.34
  - number: 3.34.2.b
    text: |-
      tussentijdse perioden van tewerkstelling buiten de desbetreffende sector van de internationale arbeidsmarkt van,
      tezamen genomen, ten hoogste twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.34
  - number: 3.35.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden verleend aan de
      vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.35.1.a
    text: |-
      met een arbeidsverleden aan boord van een Nederlands zeeschip of op een mijnbouwinstallatie op het continentaal
      plat;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.35
  - number: 3.35.1.b
    text: |-
      die uit hoofde van zijn dienstbetrekking ingevolge een door Nederland gesloten sociaal zekerheidsverdrag verzekerd
      is of is geweest voor de Nederlandse sociale verzekeringen, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.35
  - number: 3.35.1.c
    text: |-
      die als uitvloeisel daarvan recht heeft op een uitkering krachtens de[ Werkloosheidswet][ref1], die niet in het
      land van herkomst geldend kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 3.35.2
    text: |-
      De verblijfsvergunning kan worden verleend onder een beperking, verband houdend met het zoeken en verrichten van
      arbeid al dan niet in loondienst in Nederland, indien het arbeidsverleden ten minste zeven jaar bedraagt. Het
      arbeidsverleden is niet onderbroken ingeval van:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.35
  - number: 3.35.2.a
    text: |-
      tussentijdse, in Nederland doorgebrachte perioden van onvrijwillige werkloosheid van elk ten hoogste zes maanden,
      en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.35
  - number: 3.35.2.b
    text: |-
      tussentijdse perioden van tewerkstelling buiten de desbetreffende sector van de internationale arbeidsmarkt van,
      tezamen genomen, ten hoogste twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.35
  - number: 3.35.3
    text: |-
      De verblijfsvergunning kan worden verleend onder een beperking verband houdend met het zoeken van arbeid in
      loondienst aan boord van een Nederlands zeeschip of op een mijnbouwinstallatie op het continentaal plat, indien het
      arbeidsverleden korter is dan zeven jaar.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.35
  - number: '3.36'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met het zoeken en verrichten van arbeid al dan niet in loondienst in Nederland worden verleend
      aan de vreemdeling met een arbeidsverleden van ten minste zeven jaar aan boord van een Nederlands zeeschip of
      op een mijnbouwinstallatie op het continentaal plat, die in Nederland arbeid binnen de werkingssfeer van de
      [Wet arbeid vreemdelingen][ref2] wil verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.36
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0007149
  - number: 3.37.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden verleend onder een
      beperking verband houdend met het doorbrengen van verlof in Nederland aan de vreemdeling, die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.37
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.37.1.a
    text: |-
      een arbeidsverleden aan boord van een Nederlands zeeschip heeft van ten minste zeven jaar, waarin de totale duur
      van de onderbrekingen niet langer is dan achttien maanden;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.37
  - number: 3.37.1.b
    text: tijdens dat arbeidsverleden zijn verlofperioden nagenoeg geheel in Nederland heeft doorgebracht, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.37
  - number: 3.37.1.c
    text: |-
      gedurende ten minste nog een jaar beschikt over een arbeidsplaats aan boord van een Nederlands schip, waarmee hij
      duurzaam voldoende middelen van bestaan verwerft.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.37
  - number: 3.37.2
    text: |-
      De verblijfsvergunning, bedoeld in het eerste lid, kan eveneens worden verleend aan de vreemdeling, die gedurende
      nog ten minste een jaar beschikt over een arbeidsplaats op een mijnbouwinstallatie op het continentaal plat,
      waarmee hij duurzaam voldoende middelen van bestaan verwerft.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.37
  - number: '3.38'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan voor de duur van
      de uitkering krachtens de [Ziektewet][ref2] worden verleend onder een beperking verband houdend met het
      afwachten van herstel en hervatting van de arbeid in loondienst aan boord van een Nederlands zeeschip of op een
      mijnbouwinstallatie op het continentaal plat aan de vreemdeling die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0001888
  - number: 3.38.a
    text: |-
      een arbeidsverleden aan boord van een Nederlands zeeschip of op een mijnbouwinstallatie op het continentaal plat
      heeft;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.38
  - number: 3.38.b
    text: |-
      uit hoofde van zijn dienstbetrekking ingevolge een door Nederland gesloten sociaal-zekerheidsverdrag verzekerd is
      of is geweest voor de Nederlandse sociale verzekeringen, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.38
  - number: 3.38.c
    text: |-
      als uitvloeisel daarvan recht heeft op een uitkering krachtens de [Ziektewet][ref1], die niet in het land van
      herkomst geldend kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '3.39'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met verblijf als stagiaire of als practicant worden verleend aan de vreemdeling die als stagiaire
      onderscheidenlijk als practicant arbeid in loondienst wil verrichten, indien ten behoeve van die arbeid een
      tewerkstellingvergunning als bedoeld in de [Wet arbeid vreemdelingen][ref2] is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.39
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0007149
  - number: 3.40.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden verleend onder een
      beperking verband houdend met verblijf als niet-geprivilegieerd militair of niet-geprivilegieerd burgerpersoneel
      aan:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.40.1.a
    text: |-
      de militair die in Nederland woonachtig is en die niet behoort tot een in Nederland gelegerde of op doortocht
      zijnde krijgsmacht en evenmin verbonden is aan een hier te lande gevestigd internationaal militair hoofdkwartier en
      niet geprivilegieerd is;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.40
  - number: 3.40.1.b
    text: |-
      de vreemdeling die behoort tot het burgerpersoneel, die in Nederland woont en die in dienst is van een krijgsmacht
      of van een internationaal militair hoofdkwartier, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.40
  - number: 3.40.1.c
    text: de vreemdeling die gezinslid of familielid is van de vreemdeling, bedoeld onder a of b.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.40
  - number: 3.40.2
    text: 'Onder gezinslid of familielid wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.40
  - number: 3.40.2.a
    text: de echtgenoot of echtgenote;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.40
  - number: 3.40.2.b
    text: het kind beneden de leeftijd van 21 jaar, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.40
  - number: 3.40.2.c
    text: |-
      de bloedverwant of aanverwant van de vreemdeling of zijn echtgenoot, in opgaande en neerdalende lijn, voorzover die
      te zijnen laste komt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.40
  - number: 3.41.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met het volgen van studie worden verleend aan de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.41
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.41.1.a
    text: |-
      die voltijds hoger, voortgezet of beroepsonderwijs volgt aan een bij ministeriële regeling aan te wijzen
      onderwijsinstelling;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.41
  - number: 3.41.1.b
    text: |-
      die met een door de bevoegde autoriteiten van de onder a bedoelde onderwijsinstelling afgegeven schriftelijke
      verklaring aantoont dat hij als student is of zal worden ingeschreven voor voltijdsonderwijs, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.41
  - number: 3.41.1.c
    text: |-
      wiens vertrek uit Nederland na voltooiing of tussentijdse beëindiging van de studie naar het oordeel van Onze
      Minister redelijkerwijs is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.41
  - number: 3.41.2
    text: |-
      Indien de vreemdeling in Nederland wil verblijven voor het volgen van voortgezet onderwijs of beroepsonderwijs,
      kan de verblijfsvergunning slechts worden verleend, indien het een dagopleiding betreft waarvoor Nederland naar het
      oordeel van Onze Minister het meest aangewezen land is en waarmee de vreemdeling naar het oordeel van Onze Minister
      een positieve bijdrage kan leveren aan de ontwikkeling van het land van herkomst.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.41
  - number: 3.41.3
    text: |-
      In afwijking van het eerste lid, onder b, kan de verblijfsvergunning worden verleend aan de vreemdeling die
      in Nederland wil verblijven ter voorbereiding op hoger onderwijs in Nederland, indien uit een door de bevoegde
      autoriteiten afgegeven schriftelijke verklaring blijkt dat de vreemdeling als student zal worden ingeschreven voor
      voltijdsonderwijs.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.41
  - number: 3.41.4
    text: |-
      De aanvraag die is ingediend door een langdurig ingezetene die in Nederland hoger of beroepsonderwijs als bedoeld
      in het eerste lid, onder a, wil volgen wordt niet afgewezen op grond dat hij het onderwijs niet voltijds wil volgen
      en evenmin op de grond, bedoeld in het eerste lid, onder c.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.41
  - number: 3.41a
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de behandeling van de aanvraag tot
      het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14 van de Wet][ref1], onder een
      beperking verband houdend met het volgen van studie als bedoeld in [artikel 3.41][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.41a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.42.1
    text: |-
      Voor de toepassing van [artikel 3.41][ref1] wordt onder voldoende middelen van bestaan verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.42.1.a
    text: |-
      indien de vreemdeling of een buiten Nederland gevestigde persoon of rechtspersoon de studie en het verblijf
      bekostigt: een netto-inkomen als bedoeld in [artikel 3.74 onder b][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.42.1.b
    text: |-
      indien een in Nederland gevestigde persoon of rechtspersoon de studie en het verblijf van de vreemdeling bekostigt:
      een netto-inkomen als bedoeld in [artikel 3.74, onder a][ref1], aangevuld met het in onderdeel a bedoelde bedrag;
      de in Nederland gevestigde persoon ondertekent een garantstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.42.2
    text: |-
      Indien de studie en het verblijf middels periodieke betalingen worden bekostigd, zijn middelen van bestaan in
      afwijking van [artikel 3.75][ref1] slechts duurzaam, indien naar het oordeel van Onze Minister voldoende zekerheid
      is verschaft over het ongestoorde verloop van de periodieke geldstroom.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.42.3
    text: |-
      In afwijking van [artikel 3.75][ref1] zijn middelen van bestaan duurzaam, indien deze op het tijdstip waarop de
      aanvraag is ontvangen of de beschikking wordt gegeven, voor een jaar of zoveel korter als de voorgenomen studie in
      Nederland zal duren, beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.42.4
    text: |-
      In afwijking van [artikel 3.75][ref1] zijn middelen van bestaan eveneens duurzaam, indien op een ten name van de
      vreemdeling gestelde bankrekening in Nederland een bedrag beschikbaar is, gelijk aan het maandelijkse normbedrag,
      bedoeld in het eerste lid, vermenigvuldigd met twaalf of zoveel minder als het aantal maanden dat de voorgenomen
      studie in Nederland zal duren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.43.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met verblijf als au pair worden verleend aan de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.43
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.43.1.a
    text: die achttien jaar of ouder, maar jonger dan zesentwintig jaar is;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.43
  - number: 3.43.1.b
    text: die ongehuwd is en niet de zorg heeft voor kinderen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.43
  - number: 3.43.1.c
    text: |-
      die niet eerder rechtmatig verblijf als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1],
      heeft gehad;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.43
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.43.1.d
    text: |-
      die als au pair verblijft in een gastgezin, bestaande uit twee of meer personen, voor wie de vreemdeling niet
      eerder werkzaamheden heeft verricht;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.43
  - number: 3.43.1.e
    text: |-
      die als tegenprestatie voor het verblijf in het gastgezin niet meer dan dertig uur per week lichte huishoudelijke
      werkzaamheden verricht, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.43
  - number: 3.43.1.f
    text: wiens vertrek uit Nederland naar het oordeel van Onze Minister redelijkerwijs is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.43
  - number: 3.43.2
    text: |-
      De verblijfsvergunning kan worden verleend, indien het gastgezin duurzaam en zelfstandig beschikt over voldoende
      middelen van bestaan en een garantverklaring heeft ondertekend. Middelen van bestaan zijn voldoende, indien het
      gastgezin beschikt over een inkomen gelijk aan het bestaansminimum, bedoeld in de [Wet werk en bijstand][ref1],
      voor de desbetreffende categorie, aangevuld met het bestaansminimum voor alleenstaanden van eenentwintig jaar en
      ouder. In afwijking van [artikel 3.75][ref2], zijn middelen van bestaan duurzaam, indien zij voor ten minste één
      jaar beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.43
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.43.3
    text: |-
      Bij de aanvraag wordt door de vreemdeling en het gastgezin een schriftelijke verklaring ondertekend, waarin zij
      onder meer verklaren dat de vreemdeling als au pair tijdelijk in het gastgezin verblijft.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.43
  - number: 3.43.4
    text: Het model van de verklaringen wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.43
  - number: 3.44.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden verleend onder een
      beperking verband houdend met verblijf in het kader van uitwisseling aan de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.44.1.a
    text: die vijftien jaar of ouder, maar jonger dan zesentwintig jaar is;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.44
  - number: 3.44.1.b
    text: die ongehuwd is en niet de zorg heeft voor kinderen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.44
  - number: 3.44.1.c
    text: |-
      die op grond van een door Onze Minister goedgekeurd uitwisselingsprogramma tijdelijk in Nederland wil verblijven
      in een gastgezin, bestaande uit twee of meer personen voor wie de vreemdeling niet eerder werkzaamheden heeft
      verricht;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.44
  - number: 3.44.1.d
    text: |-
      die niet eerder rechtmatig verblijf als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1],
      heeft gehad, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.44.1.e
    text: wiens vertrek uit Nederland naar het oordeel van Onze Minister redelijkerwijs is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.44
  - number: 3.44.2
    text: |-
      Bij de aanvraag wordt door de uitwisselingsorganisatie een garantverklaring ondertekend. Het model van de
      verklaring wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.44
  - number: 3.45.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden verleend onder
      een beperking verband houdend met uitwisseling aan de vreemdeling van achttien jaar of ouder met de Australische,
      Canadese of Nieuw-Zeelandse nationaliteit:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.45.1.a
    text: die voldoet aan de nader door Onze Minister te stellen vereisten ten aanzien van leeftijd en burgerlijke staat;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.45
  - number: 3.45.1.b
    text: die niet de zorg heeft voor afhankelijke gezinsleden, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.45
  - number: 3.45.1.c
    text: wiens vertrek uit Nederland naar het oordeel van Onze Minister redelijkerwijs is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.45
  - number: 3.45.2
    text: |-
      Onder voldoende middelen van bestaan wordt verstaan een netto-inkomen als bedoeld in [artikel 3.74, onder b][ref1].
      In afwijking van [artikel 3.75][ref2] zijn middelen van bestaan duurzaam, indien zij voor een periode van zes weken
      beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.45
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.46.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met het ondergaan van medische behandeling worden verleend, indien Nederland naar het oordeel van
      Onze Minister het meest aangewezen land is voor het ondergaan van een noodzakelijke medische behandeling en de
      financiering van die medische behandeling naar het oordeel van Onze Minister deugdelijk is geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.46
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.46.2
    text: |-
      Bij de aanvraag ondertekent de vreemdeling een medische verklaring, ertoe strekkende dat hij toestemming verleent
      voor medisch onderzoek, voor zover dat onderzoek noodzakelijk is voor de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.46
  - number: 3.47.1
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.46][ref1], kan worden verleend aan de vreemdeling van Surinaamse
      nationaliteit, die op medische indicatie en in het bezit van een daartoe afgegeven visum naar Nederland is gekomen,
      indien voortzetting van de medische behandeling in Nederland zes maanden na zijn inreis medisch noodzakelijk is en
      de financiering daarvan naar het oordeel van Onze Minister deugdelijk is geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.47
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.47.2
    text: |-
      Bij de aanvraag ondertekent de vreemdeling een medische verklaring, ertoe strekkende dat hij toestemming verleent
      voor medisch onderzoek, voor zover dat onderzoek noodzakelijk is voor de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.47
  - number: 3.48.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met de vervolging van mensenhandel worden verleend aan de vreemdeling die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.48
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.48.1.a
    text: |-
      slachtoffer-aangever is van mensenhandel, voorzover er sprake is van een strafrechtelijk opsporingsonderzoek
      of vervolgingsonderzoek naar of berechting in feitelijke aanleg van de verdachte van het strafbare feit waarvan
      aangifte is gedaan;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.48
  - number: 3.48.1.b
    text: |-
      slachtoffer is van mensenhandel, voorzover er sprake is van een strafrechtelijk opsporingsonderzoek of
      vervolgingsonderzoek naar of berechting in feitelijke aanleg van de verdachte van het strafbare feit, bedoeld in
      [artikel 273f van het Wetboek van Strafrecht][ref1], en het slachtoffer hieraan op andere wijze dan door het doen
      van aangifte medewerking verleent; of


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel273f
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.48
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 273f
  - number: 3.48.1.c
    text: |-
      getuige-aangever is van mensenhandel, voorzover er sprake is van een strafrechtelijk opsporingsonderzoek of
      vervolgingsonderzoek naar of berechting in feitelijke aanleg van de verdachte van het strafbare feit waarvan
      aangifte is gedaan en het verblijf in Nederland van de getuige-aangever naar het oordeel van Onze Minister in het
      belang van de opsporing of vervolging van de verdachte noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.48
  - number: 3.48.2
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder c, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.48
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.49.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden verleend
      onder een beperking verband houdend methet afwachten van een beslissing op een verzoek als bedoeld in
      [artikel 17 van de Rijkswet op het Nederlanderschap][ref2] aan de in Nederland verblijvende vreemdeling die bij
      de rechtbank te 's-Gravenhage een verzoek heeft ingediend tot vaststelling van zijn Nederlanderschap, indien dat
      verzoek naar het oordeel van Onze Minister niet klaarblijkelijk van elke grond is ontbloot.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel17
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.49
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '17'
  - number: 3.49.2
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder b en c, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.49
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.50.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], wordt onder een beperking
      verband houdend met voortgezet verblijf verleend aan de vreemdeling die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.50
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.50.1.a
    text: |-
      als minderjarige houder is geweest van een verblijfsvergunning onder een beperking verband houdend met
      gezinshereniging, verblijf ter adoptie of verblijf als pleegkind, bij een Nederlander of een vreemdeling met niet-
      tijdelijk verblijfsrecht in de zin van [artikel 3.5][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.50
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.50.1.b
    text: |-
      langer dan een jaar houder is geweest van de in onderdeel a bedoelde verblijfsvergunning, dan wel in Nederland is
      geboren uit ouders met niet-tijdelijk verblijfsrecht in de zin van [artikel 3.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.50
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.50.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder persoon met niet-tijdelijk verblijfsrecht niet verstaan de houder
      van de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.50
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.50.3
    text: 'De verblijfsvergunning wordt verleend, tenzij:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.50
  - number: 3.50.3.a
    text: |-
      de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden die tot afwijzing van de
      oorspronkelijke aanvraag tot het verlenen zouden hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.50
  - number: 3.50.3.b
    text: de vreemdeling een gevaar voor de nationale veiligheid vormt;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.50
  - number: 3.50.3.c
    text: |-
      de aanvraag met toepassing van de [artikelen 3.86][ref1] of [3.87][ref2] kan worden afgewezen, of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.50
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.50.3.d
    text: de vreemdeling het hoofdverblijf buiten Nederland heeft verplaatst.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.50
  - number: 3.50.4
    text: |-
      Indien een van de ouders in Nederland is gevestigd en de Nederlandse nationaliteit heeft, wordt de
      verblijfsvergunning aan de minderjarige vreemdeling verleend, tenzij de vreemdeling onjuiste gegevens heeft
      verstrekt dan wel gegevens heeft achtergehouden die tot afwijzing van de oorspronkelijke aanvraag tot het verlenen
      zouden hebben geleid, of de vreemdeling het hoofdverblijf buiten Nederland heeft verplaatst.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.50
  - number: 3.51.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking,
      verband houdend met voortgezet verblijf worden verleend aan de vreemdeling die drie jaar in Nederland verblijft als
      houder van een verblijfsvergunning onder een beperking verband houdend met:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.51.1.a
    text: gezinshereniging of gezinsvorming met een persoon met niet-tijdelijk verblijfsrecht;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.51
  - number: 3.51.1.b
    text: |-
      het ondergaan van medische behandeling, voorzover die medische behandeling naar het oordeel van Onze Minister
      gedurende ten minste nog één jaar in Nederland noodzakelijk zal zijn;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.51
  - number: 3.51.1.c
    text: verblijf als alleenstaande minderjarige vreemdeling, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.51
  - number: 3.51.1.d
    text: verblijf als vreemdeling die buiten zijn schuld niet uit Nederland kan vertrekken.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.51
  - number: 3.51.2
    text: |-
      De verblijfsvergunning kan worden verleend, indien in de in het eerste lid bedoelde periode is voldaan aan de
      voorwaarden voor het verlengen van de geldigheidsduur van de oorspronkelijke verblijfsvergunning.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.51
  - number: 3.51.3
    text: |-
      De verblijfsvergunning kan eveneens worden verleend, indien de relatie tussen de vreemdeling aan wie de
      verblijfsvergunning onder een beperking verband houdend met gezinsvorming of gezinshereniging, of verblijf ter
      adoptie of als pleegkind is verleend en de persoon met het niet-tijdelijke verblijfsrecht door het overlijden van
      die persoon is verbroken.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.51
  - number: 3.51.4
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder c, van de Wet][ref1].
      [Artikel 3.80a][ref2] is van toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.51.5
    text: |-
      Voor de toepassing van het eerste lid, onder a, en het derde lid, wordt onder persoon met niet-
      tijdelijk verblijfsrecht niet verstaan de houder van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28 van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: '3.52'
    text: |-
      In andere gevallen dan genoemd in de [artikelen 3.50][ref1] en [3.51][ref2], kan de verblijfsvergunning
      voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref3], onder een beperking verband houdend
      met voortgezet verblijf worden verleend aan de vreemdeling die rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met e dan wel l, van de Wet][ref4]heeft gehad en van wie naar het oordeel van Onze
      Minister wegens bijzondere individuele omstandigheden niet gevergd kan worden dat hij Nederland verlaat.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.52
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.53.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met wedertoelating worden verleend aan de oud-Nederlander die in Nederland is geboren en getogen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.53
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.53.2
    text: 'De verblijfsvergunning, bedoeld in het eerste lid, kan eveneens worden verleend:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.53
  - number: 3.53.2.a
    text: |-
      aan de meerderjarige oud-Nederlander die buiten Nederland is geboren, indien deze in een ander land woont dan dat
      waarvan hij onderdaan is en naar het oordeel van Onze Minister bijzondere banden heeft met Nederland, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.53
  - number: 3.53.2.b
    text: aan andere oud-Nederlanders.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.53
  - number: 3.53.3
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder b en c, van de Wet][ref1], indien de
      aanvraag is ingediend door de in het eerste lid bedoelde vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.53
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.54.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met wedertoelating voorts worden verleend aan de minderjarige vreemdeling, in wiens opvang en
      wettelijke vertegenwoordiging in Nederland is voorzien en die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.54
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.54.1.a
    text: |-
      vanaf zijn vierde levensjaar tien jaren rechtmatig in Nederland heeft verbleven als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], of als Nederlander, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.54
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.54.1.b
    text: |-
      vóór indiening van de aanvraag vijf jaren rechtmatig in Nederland heeft verbleven als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], of als Nederlander.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.54
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.54.2
    text: |-
      Het eerste lid, onder b, is alleen van toepassing voorzover Nederland naar het oordeel van Onze Minister het meest
      aangewezen land is voor de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.54
  - number: 3.54.3
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder c, van de Wet][ref1]. De
      [artikelen 3.77][ref2] en [3.78][ref3] zijn niet van toepassing. De [artikelen 3.86][ref4] en [3.87][ref5] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.54
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.55.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met wedertoelating voorts worden verleend aan de vreemdeling, die in aanmerking komt voor de
      terugkeeroptie op grond van [artikel 8 van de Remigratiewet][ref2], en die direct voorafgaande aan de remigratie:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.55
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '8'
  - number: 3.55.1.a
    text: |-
      gedurende drie achtereenvolgende jaren rechtmatig verblijf als bedoeld in
      [artikel 8, onder a, c, e dan wel l, van de Wet][ref1], in Nederland had;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.55
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.55.1.b
    text: |-
      als het minderjarige kind van een Nederlander of van een vreemdeling met rechtmatig verblijf als bedoeld
      in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], zelf rechtmatig verblijf als bedoeld in
      [artikel 8, onder a, c, e dan wel l, van de Wet][ref2] had, ongeacht de duur daarvan, en tegelijkertijd met die
      Nederlander of die vreemdeling om verblijf verzoekt, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.55
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.55.1.c
    text: |-
      als het minderjarige kind van een Nederlander of van een vreemdeling met rechtmatig verblijf als bedoeld
      in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], zelf rechtmatig verblijf als bedoeld in
      [artikel 8, onder a, c, e dan wel l, van de Wet][ref2] had, ongeacht de duur daarvan, die binnen een jaar na
      remigratie meerderjarig is geworden en die zelfstandig om verblijf verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.55
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.55.2
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder c, van de Wet][ref1].
      De[ artikelen 3.77][ref2] en [3.78][ref3] zijn niet van toepassing. De [artikelen 3. 86][ref4] en [3.87][ref5] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.55
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.56.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met verblijf als alleenstaande minderjarige vreemdeling worden verleend aan de alleenstaande
      minderjarige vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.56
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.56.1.a
    text: |-
      wiens aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 28 van de Wet][ref1] is
      afgewezen, anders dan met toepassing van [artikel 30 van de Wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.56
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '30'
  - number: 3.56.1.b
    text: |-
      die zich naar het oordeel van Onze Minister niet zelfstandig kan handhaven in het land van herkomst of een ander
      land waar hij redelijkerwijs naar toe kan gaan, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.56
  - number: 3.56.1.c
    text: |-
      voor wie naar het oordeel van Onze Minister, naar plaatselijke maatstaven gemeten, adequate opvang ontbreekt in het
      land van herkomst of een ander land waar hij redelijkerwijs naar toe kan gaan.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.56
  - number: 3.56.2
    text: |-
      [Artikel 16, eerste lid, onder d en e, van de Wet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.56
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.56a.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met het verblijf als onderzoeker in de zin van richtlijn 2005/71/EG worden verleend aan de
      vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.56a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.56a.1.a
    text: die onderzoek verricht bij een bij ministeriële regeling aan te wijzen onderzoeksinstelling;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.56a
  - number: 3.56a.1.b
    text: 'die een met een onderzoeksinstelling gesloten gastovereenkomst overlegt, waaruit blijkt:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.56a
  - number: 3.56a.1.b.1°
    text: 'dat het onderzoeksproject is goedgekeurd, na toetsing van:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.56a
  - number: 3.56a.1.b.1°.a
    text: het doel en de duur van het onderzoek en de beschikbaarheid van de hiervoor benodigde financiële middelen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.56a
  - number: 3.56a.1.b.1°.b
    text: |-
      de kwalificaties van de vreemdeling in het licht van het doel van het onderzoek, die gestaafd worden met een
      gewaarmerkte kopie van een door de vreemdeling behaald passend diploma van hoger onderwijs, dat toegang geeft tot
      doctoraatprogramma’s; en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.56a
  - number: 3.56a.1.b.2°
    text: wat de rechtsbetrekking en de arbeidsvoorwaarden van de vreemdeling zijn, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.56a
  - number: 3.56a.1.c
    text: die een garantstelling van de onderzoeksinstelling overlegt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.56a
  - number: 3.56a.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.56a
  - number: '3.57'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], wordt verleend voor ten
      hoogste één jaar en kan telkens met ten hoogste één jaar worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.57
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '3.58'
    text: |-
      In afwijking van [artikel 3.57][ref1] kan de verblijfsvergunning worden verleend onder een beperking
      verband houdend met gezinshereniging als minderjarige of verblijf ter adoptie of als pleegkind, voor de
      duur van het verblijfsrecht op grond van [artikel 8, onder a, c, e, of l, van de Wet][ref2], van de ouder,
      adoptiefouder of pleegouder, dan wel, indien deze rechtmatig verblijf in Nederland heeft als bedoeld in
      [artikel 8, onder b of d, van de Wet][ref3] of als Nederlander voor vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.58
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3.59'
    text: |-
      In afwijking van [artikel 3.57][ref1] kan de verblijfsvergunning onder een beperking verband
      houdend met het verrichten van arbeid in loondienst worden verleend voor de duur waarvoor de
      tewerkstellingsvergunning ten behoeve van die arbeid is verleend. Indien ten behoeve van die arbeid op grond
      van [artikel 1, eerste lid, onder j of l, van het Besluit uitvoering Wet arbeid vreemdelingen][ref2] geen
      tewerkstellingvergunning is vereist, kan de verblijfsvergunning worden verleend voor de duur van maximaal vijf
      jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007523#Artikel1
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.59
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007523
        artikel: '1'
  - number: 3.59a
    text: |-
      In afwijking van [artikel 3.57][ref1] kan de verblijfsvergunning onder een beperking verband houdend met verblijf
      als kennismigrant als bedoeld in [artikel 1d van het Besluit uitvoering Wet arbeid vreemdelingen][ref2] worden
      verleend voor de duur van maximaal vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007523#Artikel1d
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.59a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007523
        artikel: 1d
  - number: 3.59b.1
    text: |-
      In afwijking van [artikel 3.57][ref1] kan de verblijfsvergunning met het oog op
      werkzaamheid in het kader van grensoverschrijdende dienstverlening, als bedoeld in
      [artikel 1e van het Besluit uitvoering Wet arbeid vreemdelingen][ref2], worden verleend voor de duur van de
      werkzaamheden als vermeld in de krachtens [artikel 1e, tweede lid][ref3], door de dienstverrichter verstrekte
      verklaring, met een maximum van twee jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007523#Artikel1e
      [ref3]: https://wetten.overheid.nl/BWBR0007523#Artikel1e
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.59b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007523
        artikel: 1e
      - id: ref3
        bwb_id: BWBR0007523
        artikel: 1e
  - number: 3.59b.2
    text: De geldigheidsduur van de in het eerste lid bedoelde verblijfsvergunning wordt na twee jaren niet verlengd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.59b
  - number: '3.60'
    text: |-
      In afwijking van [artikel 3.57][ref1] kan de verblijfsvergunning onder een beperking verband houdend met medische
      behandeling worden verleend voor vijf jaren, indien de medische behandeling naar verwachting van Onze Minister
      blijvend aan Nederland is gebonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.60
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '3.62'
    text: |-
      In afwijking van [artikel 3.57][ref1] kan de verblijfsvergunning onder een beperking verband houdend met
      wedertoelating worden verleend voor vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.62
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '3.63'
    text: |-
      In afwijking van [artikel 3.57][ref1] kan de verblijfsvergunning onder een beperking verband houdend met verblijf
      als niet-geprivilegieerd militair of niet-geprivilegieerd burgerpersoneel worden verleend voor drie jaren, maar
      niet langer dan de duur van de tewerkstelling van de vreemdeling of het verblijfsrecht van de persoon bij wie
      verblijf als gezinslid is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.63
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '3.64'
    text: |-
      In afwijking van [artikel 3.57][ref1] kan de verblijfsvergunning onder een beperking verband houdend met voortgezet
      verblijf worden verleend voor de duur van vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.64
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '3.65'
    text: |-
      In afwijking van [artikel 3.57][ref1] kan de verblijfsvergunning onder een beperking verband houdend met verblijf
      als au pair worden verleend voor de duur van ten hoogste een jaar, te rekenen vanaf de dag na de dag waarop de
      vreemdeling Nederland is ingereisd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.65
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '3.66'
    text: |-
      In afwijking van [artikel 3.57][ref1] kan de verblijfsvergunning onder een beperking verband houdend met verblijf
      in het kader van uitwisseling worden verleend voor de duur van ten hoogste een jaar, te rekenen vanaf de dag na de
      dag waarop de vreemdeling Nederland is ingereisd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.66
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 3.67.1
    text: |-
      In afwijking van [artikel 3.57][ref1], kan de geldigheidsduur van de verblijfsvergunning worden verlengd met vijf
      jaren, indien de houder van de verblijfsvergunning op het moment waarop de aanvraag is ontvangen of de beschikking
      wordt gegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.67
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 3.67.1.a
    text: |-
      gedurende een jaar rechtmatig verblijf als bedoeld in [artikel 8, onder a, van de Wet][ref1] heeft op grond van een
      huwelijk, een geregistreerd partnerschap of een relatie als bedoeld in [artikel 3.14][ref2], en het verblijfsrecht
      niet-tijdelijk in de zin van [artikel 3.5][ref3] is, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.67
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.67.1.b
    text: |-
      gedurende vijf jaren aaneengesloten rechtmatig verblijf als bedoeld in [artikel 8, onder a, van de Wet][ref1] heeft
      en het verblijfsrecht niet-tijdelijk in de zin van [artikel 3.5][ref2] is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.67
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.67.2
    text: |-
      In afwijking van [artikel 3.57][ref1], kan de verblijfsvergunning worden verleend of verlengd met een langere
      geldigheidsduur, indien de geldigheidsduur van de te verlenen of te verlengen verblijfsvergunning op het moment
      waarop deze wordt verstrekt ingevolge [artikel 3.57][ref2] alweer zou zijn geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.67
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 3.67.3
    text: |-
      In afwijking van [artikel 3.57][ref1] wordt de verblijfsvergunning aan de echtgenoot van een langdurig ingezetene
      met rechtmatig verblijf in de zin van [artikel 8, onder a, b dan wel l, van de Wet][ref2], en het minderjarige kind
      van die echtgenoot of die langdurig ingezetene, verleend en verlengd met een geldigheidsduur die gelijk is aan de
      duur van de verblijfsvergunning van die langdurig ingezetene.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.67
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.68.1
    text: |-
      In afwijking van [artikel 3.57][ref1] wordt de verblijfsvergunning onder een beperking verband houdend met verblijf
      als onderzoeker in de zin van richtlijn 2005/71/EG verleend voor de duur van het onderzoek als omschreven in de
      gastovereenkomst met een maximum van vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.68
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 3.68.2
    text: |-
      In afwijking van [artikel 3.57][ref1] wordt de geldigheidsduur van de verblijfsvergunning verlengd voor de duur van
      het onderzoek, bedoeld in het eerste lid, telkens met een maximum van vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.68
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '3.69'
    text: |-
      In afwijking van [artikel 3.57][ref1] wordt de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref2] onder een beperking verband houdend met de voorbereiding op een studie, verblijf als
      au pair of verblijf in het kader van uitwisseling ten hoogste voor één jaar verleend en wordt de geldigheidsduur
      ervan na één jaar niet verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.69
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '3.70'
    text: |-
      In afwijking van [artikel 3.57][ref1] wordt de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref2], onder een beperking verband houdend met familiebezoek, verleend voor ten hoogste zes
      maanden en wordt de geldigheidsduur ervan na zes maanden niet verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.70
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.71.1
    text: |-
      De aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref1], wordt afgewezen, indien de vreemdeling niet beschikt over een geldige machtiging tot
      voorlopig verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.71.2
    text: |-
      Van het vereiste van een geldige machtiging tot verblijf is, op grond van
      [artikel 17, eerste lid, onder g, van de Wet][ref1], vrijgesteld de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel17
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '17'
  - number: 3.71.2.a
    text: |-
      die voor het bereiken van het negentiende levensjaar vijf achtereenvolgende jaren rechtmatig verblijf in Nederland
      heeft gehad als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1] of als Nederlander en in
      die periode niet het hoofdverblijf buiten Nederland heeft verplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.71.2.b
    text: |-
      van twaalf jaar of jonger, die in Nederland is geboren en naar het oordeel van Onze Minister feitelijk is blijven
      behoren tot het gezin van een ouder die
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
  - number: 3.71.2.b.1°
    text: |-
      sedert het moment van geboorte van de vreemdeling rechtmatig verblijf in Nederland heeft op grond van
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1] of als Nederlander, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.71.2.b.2°
    text: |-
      op het moment van de geboorte van de vreemdeling rechtmatig verblijf in Nederland had op grond van
      [artikel 8, onder f tot en met k, van de Wet][ref1] en die sedertdien aansluitend rechtmatig verblijf op grond van
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2] heeft, voor zover geen van beiden het hoofdverblijf
      buiten Nederland heeft verplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.71.2.c
    text: |-
      die in Nederland verblijft op grond van een geprivilegieerde status als gezinslid van een in Nederland
      geaccrediteerd personeelslid van een buitenlandse diplomatieke of consulaire post die zelf in aanmerking komt voor
      de verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 21 van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
  - number: 3.71.2.d
    text: |-
      die ten minste zeven jaren werkzaam is of is geweest op een Nederlands zeeschip of een mijnbouwinstallatie op het
      continentaal plat;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
  - number: 3.71.2.e
    text: |-
      die in aanmerking komt voor een verblijfsvergunning op grond van het Associatiebesluit 1/80 van de Associatieraad
      EEG/Turkije;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
  - number: 3.71.2.f
    text: |-
      die in aanmerking komt voor terugkeer naar Nederland op grond van [artikel 8 van de Remigratiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '8'
  - number: 3.71.2.g
    text: |-
      die in Nederland verblijft, bij de rechtbank te 's-Gravenhage een verzoek heeft ingediend tot vaststelling van zijn
      Nederlanderschap dat naar het oordeel van Onze Minister niet klaarblijkelijk van elke grond ontbloot is;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
  - number: 3.71.2.h
    text: |-
      die tijdelijke bescherming heeft en in aanmerking komt voor de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de wet][ref1], onder een beperking als bedoeld in [artikel 3.30][ref2] of [3.31][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.71.2.i
    text: |-
      die houder is van een verblijfsvergunning voor onderzoekers in de zin van richtlijn 2005/71/EG afgegeven door
      een andere staat die Partij is bij het Verdrag tot oprichting van de Europese Gemeenschap, dan wel de echtgenoot,
      partner of het minderjarig kind is van die houder, tenzij sprake is van gezinsvorming.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
  - number: 3.71.3
    text: |-
      Het tweede lid, met uitzondering van onderdeel h, is niet van toepassing op de vreemdeling die als geestelijk
      voorganger of godsdienstleraar wil verblijven.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
  - number: 3.71.4
    text: |-
      Onze Minister kan het eerste lid buiten toepassing laten, voorzover toepassing daarvan naar zijn oordeel zal leiden
      tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71
  - number: 3.71a.1
    text: |-
      Een vreemdeling beschikt over kennis op basisniveau van de Nederlandse taal en van de Nederlandse maatschappij als
      bedoeld in [artikel 16, eerste lid, onder h, van de Wet][ref1], indien hij binnen één jaar direct voorafgaand aan
      de aanvraag om de machtiging tot voorlopig verblijf het basisexamen inburgering, bedoeld in [artikel 3.98a][ref2],
      met goed gevolg heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '4'
  - number: 3.71a.2
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd,
      bedoeld in [artikel 14 van de Wet][ref1], wordt niet afgewezen op grond van
      [artikel 16, eerste lid, onder h, van de Wet][ref2], indien de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.71a.2.a
    text: |-
      in Nederland wil verblijven als gezinslid van een houder van een verblijfsvergunning als bedoeld in
      [artikel 28][ref1] of [33 van de Wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
  - number: 3.71a.2.b
    text: |-
      ingevolge de wetgeving van een lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte heeft voldaan aan een inburgeringsvereiste om de status van langdurig
      ingezetene in de zin van [richtlijn 2003/109/EG](32003L0109) van 25 november 2003 betreffende de status van
      langdurig ingezeten onderdanen van derde landen (PbEU L 16) te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71a
  - number: 3.71a.2.c
    text: |-
      ten genoegen van Onze Minister voor Wonen, Wijken en Integratie heeft aangetoond door een geestelijke
      of lichamelijke belemmering blijvend niet in staat te zijn het basisexamen inburgering, bedoeld in
      [artikel 3.98a][ref1], af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '4'
  - number: 3.71a.3
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de toepassing van het tweede lid,
      onderdelen a en b, en bij regeling van Onze Minister voor Wonen, Wijken en Integratie kunnen nadere regels worden
      gesteld omtrent de toepassing van het tweede lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.71a
  - number: '3.72'
    text: |-
      Een aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref1], wordt niet op grond van [artikel 16, eerste lid, onder b, van de Wet][ref2]
      afgewezen, indien de vreemdeling naar het oordeel van Onze Minister heeft aangetoond dat hij vanwege de
      regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van een geldig document voor
      grensoverschrijding kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.73.1
    text: |-
      De in [artikel 16, eerste lid, onder c, van de Wet][ref1] bedoelde middelen van bestaan zijn in ieder geval
      zelfstandig, indien verworven uit:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.73
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.73.1.a
    text: wettelijk toegestane arbeid in loondienst, voorzover de vereiste premies en belastingen zijn afgedragen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.73
  - number: 3.73.1.b
    text: wettelijk toegestane arbeid als zelfstandige, voorzover de vereiste premies en belastingen zijn afgedragen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.73
  - number: 3.73.1.c
    text: inkomensvervangende uitkeringen krachtens een sociale verzekeringswet waarvoor premies zijn afgedragen, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.73
  - number: 3.73.1.d
    text: |-
      eigen vermogen, voorzover de bron van de inkomsten niet wordt aangetast en de vereiste premies en belastingen zijn
      afgedragen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.73
  - number: 3.73.2
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.73
  - number: '3.74'
    text: |-
      De in [artikel 16, eerste lid, onder c, van de Wet][ref1] bedoelde middelen van bestaan zijn voldoende, indien het
      netto-inkomen gelijk is aan:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.74
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.74.a
    text: |-
      de bijstandsnormen als bedoeld in [artikel 21 van de Wet werk en bijstand][ref1], voor de desbetreffende categorie
      alleenstaanden, alleenstaande ouders of echtparen en gezinnen, met inbegrip van vakantiegeld;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel21
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.74
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '21'
  - number: 3.74.b
    text: |-
      in bij ministeriële regeling vast te stellen gevallen: het normbedrag voor uitwonende studenten, bedoeld in de
      [Wet op de Studiefinanciering 2000][ref1], aangevuld met de college- en lesgelden die de vreemdeling verschuldigd
      is;


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.74
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 3.74.c
    text: 'in bij ministeriële regeling vast te stellen gevallen: een combinatie van de onder a en b genoemde normbedragen;'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.74
  - number: 3.74.d
    text: |-
      ingeval van gezinsvorming: 120 procent van het minimumloon, bedoeld in [artikel 8, eerste lid, onder a][ref1], en
      [artikel 14 van de Wet minimumloon en minimumvakantiebijslag][ref2], met inbegrip van de vakantiebijslag, bedoeld
      in [artikel 15 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.74
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 3.75.1
    text: |-
      De in [artikel 16, eerste lid, onder c, van de Wet][ref1] bedoelde middelen van bestaan zijn duurzaam, indien zij
      nog één jaar beschikbaar zijn op het tijdstip waarop de aanvraag is ontvangen of de beschikking wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.75
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.75.2
    text: |-
      Middelen van bestaan verkregen uit eigen vermogen zijn duurzaam, indien zij gedurende een aaneengesloten periode
      van een jaar beschikbaar zijn geweest en nog één jaar beschikbaar zijn op het tijdstip waarop de aanvraag is
      ontvangen of de beschikking wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.75
  - number: 3.75.3
    text: |-
      In afwijking van het eerste lid, zijn middelen van bestaan verkregen uit arbeid in loondienst eveneens duurzaam,
      indien op het tijdstip waarop de aanvraag is ontvangen of de beschikking wordt gegeven gedurende een ononderbroken
      periode van drie jaren middelen van bestaan uit arbeid in loondienst zijn verworven en de middelen van bestaan
      gedurende nog zes maanden beschikbaar zijn. Indien tijdens de periode van drie jaren gedurende een periode
      van in totaal niet langer dan zesentwintig weken een werkloosheidsuitkering is ontvangen, wordt die uitkering
      gelijkgesteld met inkomen uit arbeid in loondienst.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.75
  - number: 3.75.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de duurzaamheid van middelen van bestaan uit
      arbeid als zelfstandige.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.75
  - number: '3.76'
    text: |-
      Indien de arbeidsovereenkomst voor onbepaalde duur is aangegaan, legt de vreemdeling bij zijn aanvraag daartoe
      strekkende bewijsmiddelen over.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.76
  - number: 3.77.1
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref1], kan op grond van [artikel 16, eerste lid, onder d, van de Wet][ref2] worden
      afgewezen wegens gevaar voor de openbare orde, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.77.1.a
    text: |-
      er ernstige redenen zijn om te veronderstellen dat de vreemdeling zich schuldig heeft gemaakt aan gedragingen als
      bedoeld in artikel 1F van het Vluchtelingenverdrag;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.77
  - number: 3.77.1.b
    text: |-
      de vreemdeling de echtgenoot of echtgenote, het minderjarige kind, de partner of het meerderjarige kind, bedoeld in
      [artikel 29, onder e en f, van de Wet][ref1], is van een in Nederland verblijvende vreemdeling ten aanzien van wie
      er ernstige redenen zijn om te veronderstellen dat deze zich schuldig heeft gemaakt aan gedragingen als bedoeld in
      artikel 1F van het Vluchtelingenverdrag, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.77.1.c
    text: |-
      de vreemdeling terzake van een misdrijf is veroordeeld tot een onvoorwaardelijke gevangenisstraf of
      vrijheidsontnemende maatregel, tot een taakstraf of tot een onvoorwaardelijke geldboete, dan wel indien hij terzake
      van misdrijf een transactieaanbod heeft aanvaard of jegens hem een strafbeschikking is uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.77
  - number: 3.77.2
    text: |-
      Bij de toepassing van het eerste lid, onder c, wordt mede betrokken de buiten Nederland gepleegde inbreuk op de
      openbare orde, voorzover die naar Nederlands recht een misdrijf oplevert.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.77
  - number: 3.77.3
    text: Bij de toepassing van het eerste en tweede lid komt aan gratieverlening geen betekenis toe.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.77
  - number: 3.77.4
    text: |-
      In geval de aanvraag verband houdt met gezinshereniging of gezinsvorming houdt Onze Minister bij de toepassing van
      het eerste lid, onder c, ten minste rekening met de aard en de hechtheid van de gezinsband van de vreemdeling en
      de duur van zijn verblijf, alsmede het bestaan van familiebanden of culturele of sociale banden met het land van
      herkomst.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.77
  - number: 3.77.5
    text: |-
      In geval de aanvraag is ingediend door een vreemdeling die houder is van een EG-verblijfsvergunning voor langdurig
      ingezetenen die is afgegeven door een andere staat die partij is bij het Verdrag tot oprichting van de Europese
      Gemeenschap, houdt Onze Minister bij de toepassing van het eerste lid, onder c, mede rekening met de ernst van
      de inbreuk of het soort van inbreuk dat door de langdurig ingezetene of diens gezinslid op de openbare orde is
      gepleegd, respectievelijk met het gevaar dat van de langdurig ingezetene of dat gezinslid uitgaat.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.77
  - number: 3.77.6
    text: |-
      Bij de toepassing van het vijfde lid houdt Onze Minister tevens rekening met de leeftijd van de vreemdeling, de
      gevolgen voor de vreemdeling en de leden van zijn gezin, het bestaan van banden met Nederland dan wel het ontbreken
      van banden met het land van herkomst.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.77
  - number: 3.77.7
    text: |-
      Bij de indiening van de aanvraag ondertekent de vreemdeling van twaalf jaar of ouder een antecedentenverklaring.
      Het model van de verklaring wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.77
  - number: '3.78'
    text: |-
      Buiten de gevallen, bedoeld in [artikel 3.77][ref1], kan de aanvraag tot het verlenen van een
      verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref2], slechts op grond van
      [artikel 16, eerste lid, onder d, van de Wet][ref3] worden afgewezen wegens gevaar voor de openbare orde, indien
      zwaarwegende belangen naar het oordeel van Onze Minister daartoe nopen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.78
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.79.1
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref1], kan slechts op grond van [artikel 16, eerste lid, onder e, van de Wet][ref2] worden
      afgewezen, indien de vreemdeling niet bereid is een onderzoek naar of behandeling voor tuberculose te ondergaan of
      daaraan niet meewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.79
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.79.2
    text: |-
      De aanvraag kan niet op grond van [artikel 16, eerste lid, onder e, van de Wet][ref1] worden afgewezen, indien
      de vreemdeling de nationaliteit bezit van een van de bij ministeriële regeling vast te stellen landen, langdurig
      ingezetene is dan wel als gezinslid van een langdurig ingezetene in een andere staat die partij is bij het Verdrag
      tot oprichting van de Europese Gemeenschap is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.79
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.80.1
    text: |-
      De aanvraag tot het wijzigen of het verlengen van de geldigheidsduur van de verblijfsvergunning, bedoeld in
      [artikel 14 van de Wet][ref1], is tijdig ingediend, indien deze is ontvangen uiterlijk op de dag voor de dag
      waarop de geldigheidsduur verstrijkt, dan wel, indien deze later is ontvangen, indien de termijnoverschrijding de
      vreemdeling niet kan worden toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.80
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.80.2
    text: |-
      De niet-tijdig ingediende aanvraag tot het wijzigen of tot het verlengen van de geldigheidsduur van de
      verblijfsvergunning, bedoeld in [artikel 14 van de Wet][ref1], wordt gelijkgesteld met een aanvraag tot het
      verlenen van de verblijfsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.80
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.80a.1
    text: |-
      Een aanvraag tot het wijzigen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref1], in een
      verblijfsvergunning onder een beperking verband houdend met voortgezet verblijf wordt afgewezen, indien de aanvraag
      is ingediend door een vreemdeling als bedoeld in [artikel 3.51, eerste lid, aanhef en onderdeel a][ref2], die het
      inburgeringsexamen, bedoeld in [artikel 13 van de Wet inburgering][ref3], niet heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel13
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.80a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '13'
  - number: 3.80a.2
    text: 'Het eerste lid is niet van toepassing, indien de vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.80a
  - number: 3.80a.2.a
    text: jonger dan 16 jaar of 65 jaar of ouder is;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.80a
  - number: 3.80a.2.b
    text: |-
      ten minste acht jaren tijdens de leerplichtige leeftijd in Nederland heeft verbleven overeenkomstig het bepaalde
      bij en krachtens [artikel 2.6 van het Besluit inburgering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.80a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.80a.2.c
    text: |-
      beschikt over een document als bedoeld in
      [artikel 2.3, eerste lid, onder b tot en met l, en tweede lid, van het Besluit inburgering][ref1], dan wel voldoet
      aan een van de criteria, genoemd in [artikel 2.5, onder a tot en met c, van dat besluit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.80a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.80a.2.d
    text: |-
      op grond van [artikel 6, eerste lid][ref1], of [artikel 31, tweede lid, van de Wet inburgering][ref2] van de
      inburgeringsplicht is ontheven;


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel31
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.80a
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '31'
  - number: 3.80a.2.e
    text: |-
      verblijf heeft in Nederland op basis van een afhankelijke verblijfstitel en de relatie waarop die afhankelijke
      titel is gebaseerd is verbroken in verband met huiselijk geweld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.80a
  - number: 3.80a.3
    text: |-
      Onze Minister kan het eerste lid voorts buiten toepassing laten, indien de vreemdeling
      naar zijn oordeel blijkens een door deze vreemdeling overgelegd advies als bedoeld in
      [artikel 2.8, eerste lid, van het Besluit inburgering][ref1] door een psychische of lichamelijke belemmering, dan
      wel een verstandelijke handicap blijvend niet in staat is het inburgeringsexamen te behalen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.80a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.80a.4
    text: |-
      Onze Minister kan het eerste lid voorts buiten toepassing laten, voorzover toepassing daarvan naar zijn oordeel zal
      leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.80a
  - number: 3.80a.5
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de afwijzing van de aanvraag om wijziging van
      de verblijfsvergunning in andere gevallen dan bedoeld in het eerste lid, en omtrent de toepassing van het tweede
      lid, onder d, en derde lid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.80a
  - number: '3.81'
    text: |-
      Onverminderd [artikel 3.80a][ref1], wordt een aanvraag tot het wijzigen van de verblijfsvergunning, bedoeld in
      [artikel 14 van de Wet][ref2], beoordeeld als een aanvraag tot het verlenen van een verblijfsvergunning, met dien
      verstande dat de [artikelen 3.71][ref3], [3.77][ref4], [3.78][ref5] en [3.79][ref6] niet van toepassing zijn en de
      [artikelen 3.86][ref7] en [3.87][ref8] van overeenkomstige toepassing zijn, indien de aanvraag tijdig is ingediend.


