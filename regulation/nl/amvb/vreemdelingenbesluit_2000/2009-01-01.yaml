    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.4
  - number: 3.4.1.q
    text: verblijf in het kader van uitwisseling;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.4
  - number: 3.4.1.r
    text: het ondergaan van medische behandeling;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.4
  - number: 3.4.1.s
