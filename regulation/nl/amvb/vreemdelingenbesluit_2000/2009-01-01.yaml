  - number: 3.82.2
    text: 'Het eerste is niet van toepassing, indien de vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.82
  - number: 3.82.2.a
    text: zijn hoofdverblijf buiten Nederland heeft gevestigd;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.82
  - number: 3.82.2.b
    text: |-
      onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden, terwijl die gegevens tot afwijzing van de
      oorspronkelijke aanvraag tot het verlenen of verlengen zouden hebben geleid, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.82
  - number: 3.82.2.c
    text: |-
      in Nederland wil verblijven als geestelijk voorganger of godsdienstleraar, tenzij de houder verblijfsrecht ontleent
      aan het Associatiebesluit 1/80 van de Associatieraad EEG/Turkije.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.82
  - number: '3.83'
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning voor bepaalde tijd, bedoeld
      in [artikel 14 van de Wet][ref1], wordt niet op grond van [artikel 18, eerste lid, onder b, van de Wet][ref2]
      afgewezen, indien de vreemdeling naar het oordeel van Onze Minister heeft aangetoond dat hij vanwege de
      regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van een geldig document voor
      grensoverschrijding kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.83
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '18'
  - number: '3.84'
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning voor bepaalde tijd, bedoeld
      in [artikel 14 van de Wet][ref1], wordt niet op grond van [artikel 18, eerste lid, onder c, van de Wet][ref2]
      afgewezen om reden dat de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden die
      tot afwijzing van de oorspronkelijke aanvraag tot het verlenen of verlengen zouden hebben geleid, indien er sedert
      de verlening, verlenging of wijziging van de verblijfsvergunning een periode van twaalf jaren is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.84
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.85.1
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning voor bepaalde tijd, bedoeld
      in [artikel 14 van de Wet][ref1], wordt niet op grond van [artikel 18, eerste lid, onder d, van de Wet][ref2]
      afgewezen, indien de vreemdeling en degene bij wie hij als gezinslid verblijft gezamenlijk zelfstandig en duurzaam
      beschikken over een netto-inkomen als bedoeld in [artikel 3.74, onder a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.85
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.85.2
    text: |-
      De aanvraag wordt evenmin op grond van [artikel 18, eerste lid, onder d, van de Wet][ref1] afgewezen, indien de
      persoon bij wie de vreemdeling als gezinslid verblijft 65 jaar of ouder is of naar het oordeel van Onze Minister
      blijvend en volledig arbeidsongeschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.85
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.86.1
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning voor
      bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden afgewezen op grond van
      [artikel 18, eerste lid, onder e, van de Wet][ref2] wegens gevaar voor de openbare orde, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.86.1.a
    text: |-
      er ernstige redenen zijn om te veronderstellen dat de vreemdeling zich schuldig heeft gemaakt aan gedragingen als
      bedoeld in artikel 1F van het Vluchtelingenverdrag;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.1.b
    text: |-
      de vreemdeling de echtgenoot of de echtgenote, het minderjarige kind, de partner of het meerderjarige kind, bedoeld
      in [artikel 29, onder e of f, van de Wet][ref1], is van een in Nederland verblijvende vreemdeling ten aanzien van
      wie er ernstige redenen zijn om te veronderstellen dat deze zich schuldig heeft gemaakt aan gedragingen als bedoeld
      in artikel 1F van het Vluchtelingenverdrag, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.86.1.c
    text: |-
      de vreemdeling met een verblijfsduur korter dan drie jaar wegens een misdrijf waartegen een gevangenisstraf
      van twee jaar of meer is bedreigd, bij onherroepelijk geworden rechterlijk vonnis een gevangenisstraf
      of jeugddetentie, een taakstraf of een maatregel als bedoeld in [artikel 37a][ref1], [38m][ref2] of
      [77h, vierde lid, onder a, van het Wetboek van Strafrecht][ref3], dan wel het buitenlandse equivalent daarvan, is
      opgelegd, en het onvoorwaardelijk ten uitvoer te leggen gedeelte van die straf of maatregel ten minste gelijk is
      aan de in het tweede lid bedoelde norm;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38m
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 77h
  - number: 3.86.1.d
    text: |-
      de vreemdeling wegens een misdrijf waartegen een gevangenisstraf van drie jaar of meer is bedreigd, bij
      onherroepelijk geworden rechterlijk vonnis een gevangenisstraf of jeugddetentie, een taakstraf of een maatregel als
      bedoeld in [artikel 37a][ref1], [38m][ref2] of [77h, vierde lid, onder a, van het Wetboek van Strafrecht][ref3],
      dan wel het buitenlandse equivalent daarvan, is opgelegd, en het onvoorwaardelijk ten uitvoer te leggen gedeelte
      van die straf of maatregel ten minste gelijk is aan de in het tweede lid bedoelde norm.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38m
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 77h
  - number: 3.86.2
    text: |-
      De in het eerste lid, onder c en d, bedoelde norm bedraagt bij een verblijfsduur van: minder dan 1 jaar: 1 maand;
      ten minste 1 jaar, maar minder dan 2 jaar: 3 maanden; ten minste 2 jaar, maar minder dan 3 jaar: 6 maanden; ten
      minste 3 jaar, maar minder dan 4 jaar: 9 maanden; ten minste 4 jaar, maar minder dan 5 jaar: 12 maanden; ten minste
      5 jaar, maar minder dan 6 jaar: 24 maanden; ten minste 6 jaar, maar minder dan 7 jaar: 30 maanden; ten minste 7
      jaar, maar minder dan 8 jaar: 36 maanden; ten minste 8 jaar, maar minder dan 9 jaar: 45 maanden; ten minste 9 jaar,
      maar minder dan 10 jaar: 54 maanden; ten minste 10 jaar, maar minder dan 15 jaar: 60 maanden; ten minste 15 jaar,
      maar minder dan 20 jaar: 96 maanden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.3
    text: |-
      Bij de toepassing van het eerste lid, onder c en d, wordt mede betrokken de buiten Nederland gepleegde of
      bestrafte inbreuk op de openbare orde, voorzover die naar Nederlands recht een misdrijf oplevert waartegen een
      gevangenisstraf van twee, onderscheidenlijk drie jaren of meer is bedreigd en waarbij de strafmaat vergelijkbaar is
      met de strafmaat die in Nederland zou zijn opgelegd wanneer het feit in Nederland zou zijn gepleegd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.4
    text: |-
      Voor de toepassing van het tweede lid wordt onder verblijfsduur verstaan: de duur van het rechtmatige verblijf als
      bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1] of als Nederlander, direct voorafgaande
      aan het moment waarop het misdrijf is gepleegd of aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.86.5
    text: 'Bij de berekening van de in het tweede lid bedoelde norm wordt betrokken:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.5.a
    text: |-
      ingeval van een verblijfsduur van vijf jaren of minder, de totale duur van alle onvoorwaardelijk opgelegde
      gedeelten van de straffen en maatregelen, bedoeld in het eerste lid, onder c en d; en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.5.b
    text: |-
      ingeval van een veroordeling tot een taakstraf: de duur van de vervangende hechtenis die de rechter heeft
      vastgesteld voor het geval de veroordeelde de taakstraf niet naar behoren verricht.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.6
    text: |-
      In afwijking van het eerste lid wordt de aanvraag niet afgewezen, indien de vreemdeling minderjarig is en één van
      zijn ouders met de Nederlandse nationaliteit in Nederland is gevestigd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.7
    text: 'In afwijking van het eerste lid wordt de aanvraag niet afgewezen:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.7.a
    text: bij een verblijfsduur van tien jaren, tenzij er sprake is van een geweldsmisdrijf of handel in verdovende middelen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.7.b
    text: bij een verblijfsduur van vijftien jaren, tenzij er sprake is van handel in verdovende middelen, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.7.c
    text: bij een verblijfsduur van twintig jaren.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.8
    text: |-
      Indien de vreemdeling in Nederland is geboren of voor zijn tiende jaar rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met e dan wel l van de Wet][ref1], heeft gekregen, wordt de aanvraag in afwijking van
      het eerste lid niet afgewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.86.8.a
    text: bij een verblijfsduur van tien jaar, tenzij er sprake is van handel in verdovende middelen, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.8.b
    text: bij een verblijfsduur van vijftien jaar.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.9
    text: |-
      In geval de verblijfsvergunning, bedoeld in het eerste lid, is verleend onder een beperking verband houdende
      met gezinshereniging of gezinsvorming houdt Onze Minister bij de toepassing van de voorgaande leden ten minste
      rekening met de aard en de hechtheid van de gezinsband van de vreemdeling, alsmede het bestaan van familiebanden of
      culturele of sociale banden met het land van herkomst.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.10
    text: |-
      In geval de aanvraag is ingediend door een vreemdeling die houder is van een EG-verblijfsvergunning voor langdurig
      ingezetenen die is afgegeven door een andere staat die partij is bij het Verdrag tot oprichting van de Europese
      Gemeenschap, houdt Onze Minister bij de toepassing van het eerste lid, onder c, mede rekening met de ernst van
      de inbreuk of het soort van inbreuk dat door de langdurig ingezetene of diens gezinslid op de openbare orde of
      nationale veiligheid is gepleegd, respectievelijk met het gevaar dat van de langdurig ingezetene of dat gezinslid
      uitgaat.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.11
    text: |-
      Bij de toepassing van het tiende lid houdt Onze Minister rekening met de leeftijd van de vreemdeling, de gevolgen
      voor de vreemdeling en de leden van zijn gezin, het bestaan van banden met Nederland dan wel het ontbreken van
      banden met het land van herkomst.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: 3.86.12
    text: |-
      Bij de indiening van de aanvraag ondertekent de vreemdeling van twaalf jaar of ouder een antecedentenverklaring.
      Het model van de verklaring wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.86
  - number: '3.87'
    text: |-
      Buiten de gevallen, bedoeld in [artikel 3.86][ref1], kan de aanvraag tot het verlengen van een
      verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref2], slechts op grond van
      [artikel 18, eerste lid, onder e, van de Wet][ref3] worden afgewezen wegens gevaar voor de openbare orde, indien
      zwaarwegende belangen naar het oordeel van Onze Minister daartoe nopen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.87
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '18'
  - number: '3.88'
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref1], verleend onder een beperking verband houdend met de vervolging van mensenhandel,
      wordt niet op grond van [artikel 18, eerste lid, onder f, van de Wet][ref2] afgewezen om de enkele reden dat een
      beslissing tot niet vervolging of niet verdere vervolging van de verdachte is genomen, indien de vreemdeling tegen
      die beslissing schriftelijk beklag heeft gedaan bij het Gerechtshof en op dat beklag nog niet is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.88
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.89.1
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning voor bepaalde tijd, bedoeld
      in [artikel 14 van de Wet][ref1], verleend onder een beperking verband houdend met het verrichten van arbeid in
      loondienst, wordt niet op grond van [artikel 18, eerste lid, onder f, van de Wet][ref2] afgewezen op de grond
      dat de vreemdeling voor een periode van korter dan één jaar beschikt over arbeid in loondienst waarmee voldoende
      zelfstandige middelen van bestaan worden verworven. In dat geval wordt de geldigheidsduur verlengd met een periode
      gelijk aan de periode waarin de vreemdeling beschikt over de arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.89
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.89.2
    text: |-
      De in het eerste lid bedoelde aanvraag wordt evenmin afgewezen op de grond dat niet wordt voldaan aan de beperking
      of de vreemdeling niet meer zelfstandig en duurzaam beschikt over voldoende middelen van bestaan, indien de
      vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.89
  - number: 3.89.2.a
    text: volledig arbeidsongeschikt is en een arbeidsongeschiktheidsuitkering ontvangt, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.89
  - number: 3.89.2.b
    text: arbeid verricht ingevolge de Wet Sociale Werkvoorziening en aanspraak heeft op een arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.89
  - number: 3.89a
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning voor bepaalde tijd,
      bedoeld in [artikel 14 van de Wet][ref1], verleend onder een beperking verband houdend met het verblijf
      als onderzoeker in de zin van richtlijn 2005/71/EG, wordt, indien de aanwijzing van de onderzoeksinstelling
      na afgifte van de verblijfsvergunning niet verlengd of ingetrokken wordt, eerst op grond van
      [artikel 18, eerste lid, onder f, van de Wet][ref2] afgewezen nadat de vreemdeling die te goeder trouw is gedurende
      een termijn van drie maanden in de gelegenheid is geweest om alsnog aan de beperking te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.89a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.90.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], die is verleend onder een
      beperking verband houdend met gezinshereniging of gezinsvorming, wordt niet ingetrokken op de enkele grond dat
      de samenwoning tijdelijk is verbroken, indien de vreemdeling de persoon bij wie verblijf is toegestaan wegens
      gewelddaden heeft verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.90
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.90.2
    text: Het eerste lid is niet van toepassing, indien er sedert de verbreking van de samenwoning een jaar is verstreken.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.90
  - number: '3.91'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], die is verleend onder een
      beperking verband houdend met het verrichten van arbeid in loondienst, wordt niet ingetrokken op de enkele grond
      dat de vreemdeling werkloos is, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.91
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.91.a
    text: |-
      de verblijfsvergunning is verleend voor een tijdelijk doel als bedoeld in [artikel 3.5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.91
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.91.b
    text: de werkloosheid is ingetreden na beëindiging van een arbeidsovereenkomst voor bepaalde duur of uitzendwerk;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.91
  - number: 3.91.c
    text: de vreemdeling van de werkloosheid een verwijt kan worden gemaakt, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.91
  - number: 3.91.d
    text: |-
      de werkgever beschikt over een tewerkstellingsvergunning, die op grond van
      [artikel 8, tweede lid, onder 3°, van de Wet arbeid vreemdelingen][ref1] in samenhang met paragraaf 23 van
      de Uitvoeringsregels Wet arbeid vreemdelingen behorende bij het Delegatie- en uitvoeringsbesluit Wet arbeid
      vreemdelingen, is verleend zonder toetsing aan prioriteitgenietend aanbod voor de desbetreffende functie op de
      arbeidsmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.91
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '8'
  - number: 3.91a
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], die is verleend onder
      een beperking verband houdend met het verblijf als onderzoeker in de zin van richtlijn 2005/71/EG, wordt eerst
      ingetrokken op de grond dat de aanwijzing van de onderzoeksinstelling na afgifte van de verblijfsvergunning niet
      verlengd of ingetrokken wordt, nadat de vreemdeling die te goeder trouw is gedurende drie maanden in de gelegenheid
      is geweest om alsnog aan de beperking te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.91a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.92.1
    text: |-
      De aanvraag tot het verlenen of wijzigen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20 van de Wet][ref1] wordt niet op grond van [artikel 21, eerste lid, onder a, van de Wet][ref2]
      afgewezen, om reden dat het rechtmatig verblijf, bedoeld in [artikel 8 onder a, b, dan wel l, van de Wet][ref3]
      niet vijf jaren aaneensluitend is geweest, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.92.1.a
    text: 'de aanvraag is ingediend door een meerderjarige vreemdeling die:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
  - number: 3.92.1.a.1°
    text: |-
      tussen het vierde en het negentiende levensjaar tien jaren rechtmatig in Nederland heeft verbleven als bedoeld
      in [artikel 8, onder a, b dan wel l, van de Wet][ref1], en wiens aanvraag is ontvangen voor het drieëntwintigste
      levensjaar, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.92.1.a.2°
    text: |-
      voor het negentiende levensjaar vijf jaren rechtmatig in Nederland heeft verbleven als bedoeld in
      [artikel 8, onder a, b dan wel l, van de Wet][ref1], en voor wie Nederland naar het oordeel van Onze Minister het
      meest aangewezen land is;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.92.1.b
    text: de vreemdeling niet het hoofdverblijf buiten Nederland heeft verplaatst.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
  - number: 3.92.2
    text: |-
      De aanvraag, ingediend door vreemdeling met niet-tijdelijk verblijfsrecht, wordt niet op grond van
      [artikel 21, eerste lid, onder b, van de Wet][ref1] afgewezen, indien de duur van het niet-tijdelijke
      verblijfsrecht en de helft van het verblijf op grond van een verblijfsvergunning onder een beperking verband
      houdend met studie, waaronder begrepen beroepsopleiding, tezamen ten minste vijf jaar bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
  - number: 3.92.3
    text: |-
      De aanvraag wordt niet op grond van [artikel 21, eerste lid, onder a of c, van de Wet][ref1] afgewezen, indien
      de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
  - number: 3.92.3.a
    text: |-
      buiten Nederland heeft verbleven in verband met beroepsmatige detachering in een staat die partij is bij het
      Verdrag tot oprichting van de Europese Gemeenschap;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
  - number: 3.92.3.b
    text: |-
      als langdurig ingezetene houder is geweest van een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20 van de Wet][ref1] en deze vergunning heeft verloren wegens:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.92.3.b.1°
    text: |-
      verblijf voor studie of beroepsopleiding in een andere staat die partij is bij het Verdrag tot oprichting van
      de Europese Gemeenschap, zonder in die staat de status van langdurig ingezetene te hebben verkregen, indien de
      aanvraag wordt gedaan binnen zes maanden na beëindiging van die studie of opleiding, dan wel de verblijfstitel in
      die staat,
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
  - number: 3.92.3.b.2°
    text: |-
      verblijf buiten het grondgebied van de Gemeenschap gedurende een aaneengesloten periode van tenminste twaalf
      maanden, indien de aanvraag wordt gedaan binnen twaalf maanden na het onherroepelijk worden van het verlies, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
  - number: 3.92.3.b.3°
    text: |-
      verkrijging van de status van langdurig ingezetene in een andere staat als bedoeld onder 1°, indien de aanvraag
      wordt gedaan binnen twaalf maanden na het onherroepelijk worden van het verlies.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
  - number: 3.92.4
    text: |-
      Voor de toepassing van [artikel 21, eerste lid, onder d, van de Wet][ref1], zijn de
      [artikelen 3.73 tot en met 3.76][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.92.5
    text: |-
      Behoudens gevallen als bedoeld in [artikel 3.87][ref1], kan de aanvraag slechts op grond van
      [artikel 21, eerste lid, onder e, van de Wet][ref2] worden afgewezen, indien de totale duur van de straffen
      of maatregelen ten minste gelijk is aan de normen, bedoeld in [artikel 3.86, eerste dan wel tweede lid][ref3].
      [Artikel 3.86, derde tot en met negende lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.92.6
    text: |-
      Bij de toepassing van het vijfde lid houdt Onze Minister mede rekening met de ernst van de inbreuk of het soort
      van inbreuk dat door de vreemdeling op de openbare orde is gepleegd, respectievelijk met het gevaar dat van de
      vreemdeling uitgaat en het bestaan van banden met Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
  - number: 3.92.7
    text: |-
      In de gevallen, bedoeld in het eerste lid, wordt bij de berekening van het tijdvak van vijf jaar buiten beschouwing
      gelaten het gedeelte van het verblijf buiten Nederland, dat tien maanden in totaal of bij aaneengesloten verblijf
      buiten Nederland zes maanden te boven gaat.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.92
  - number: 3.93.1
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20 van de Wet][ref1] wordt niet op grond van [artikel 21, eerste lid, onder a, van de Wet][ref2]
      afgewezen, indien de aanvraag is ingediend door een meerderjarige vreemdeling die tien aaneengesloten jaren in
      Nederland heeft verbleven:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel21
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.93
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '21'
  - number: 3.93.1.a
    text: op grond van een bijzondere geprivilegieerde status, die anders dan door eigen toedoen is verloren;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.93
  - number: 3.93.1.b
    text: 'op grond van een bijzondere geprivilegieerde status als:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.93
  - number: 3.93.1.b.1°
    text: |-
      geaccrediteerd lid van het administratief, technisch of bedienend personeel dan wel als particulier bediende, in
      dienst van een buitenlandse diplomatieke of consulaire post,
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.93
  - number: 3.93.1.b.2°
    text: |-
      geaccrediteerd lid van het hoogste kader, het hoofd inbegrepen, van een internationale organisatie, van het
      geaccrediteerd lid van het administratief, technisch of bedienend personeel van een internationale organisatie, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.93
  - number: 3.93.1.c
    text: als afhankelijk gezinslid van een vreemdeling als bedoeld onder a of b.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.93
  - number: 3.93.2
    text: |-
      De aanvraag wordt niet op grond van [artikel 21, eerste lid, onder b][ref1], afgewezen, indien de vreemdeling
      op het tijdstip waarop de aanvraag is ontvangen niet-tijdelijk verblijfsrecht heeft en in de periode
      van vijf aaneengesloten jaren direct voorafgaande aan dat tijdstip rechtmatig verblijf als bedoeld in
      [artikel 8 onder a tot en met e, dan wel l, van de Wet][ref2] had.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.93
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.93.3
    text: |-
      De aanvraag wordt niet op grond van [artikel 21, eerste lid, onder d, van de Wet][ref1] afgewezen, indien de
      aanvraag is ingediend door een vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.93
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
  - number: 3.93.3.a
    text: |-
      als bedoeld in [artikel 3.92, eerste lid, onder a][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.93
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 3.93.3.b
    text: |-
      die duurzaam beschikt over een uitkering op grond van de Wet op de arbeidsongeschiktheidsverzekering op basis
      van arbeidsongeschiktheid van ten minste vijfenvijftig procent en op basis van een volledige werkweek, of een
      vergelijkbare arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.93
  - number: 3.93.4
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd, bedoeld in
      [artikel 20 van de Wet][ref1], wordt niet afgewezen op de in [artikel 21, eerste lid, onder h, van de Wet][ref2]
      genoemde grond dat de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden die tot
      afwijzing van de oorspronkelijke aanvraag tot het verlenen of verlengen zouden hebben geleid, indien sedert de
      verlening, de verlenging of de wijziging een periode van twaalf jaren is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel21
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.93
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '21'
  - number: 3.93.5
    text: |-
      In afwijking van [artikel 3.92, vierde lid][ref1], zijn de middelen van bestaan van de vreemdeling als bedoeld in
      het eerste lid duurzaam indien zij nog gedurende ten minste één jaar beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.93
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 3.93.6
    text: |-
      Bij de berekening van de in het eerste lid bedoelde periode van tien aaneengesloten jaren van verblijf worden
      ten aanzien van de vreemdeling als bedoeld in het eerste lid onderdeel b, onder 2°, alsmede zijn afhankelijke
      gezinslid, bedoeld in onderdeel c, mede in aanmerking genomen perioden waarin die vreemdeling respectievelijk dat
      afhankelijke gezinslid rechtmatig verblijf als bedoeld in [artikel 8, onder a tot en met e, of l, van de Wet][ref1]
      heeft gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.93
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3.94'
    text: |-
      De [artikelen 3.92, eerste en zevende lid][ref1], en [3.93, derde lid][ref2], zijn van overeenkomstige toepassing,
      indien de aanvraag is ingediend door een vreemdeling die in aanmerking komt voor de terugkeeroptie op grond van
      [artikel 8 van de Remigratiewet][ref3] en die direct voorafgaande aan de remigratie:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.94
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0010424
        artikel: '8'
  - number: 3.94.a
    text: als Nederlander in Nederland verbleef;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.94
  - number: 3.94.b
    text: |-
      rechtmatig verblijf als bedoeld in [artikel 8, onder b of d, van de Wet][ref1] in Nederland had; of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.94
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.94.c
    text: |-
      gedurende vijf jaren rechtmatig verblijf als bedoeld in [artikel 8, onder a, c, e dan wel l, van de Wet][ref1] in
      Nederland had.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.94
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.95.1
    text: |-
      De verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20 van de Wet][ref1], wordt niet met toepassing
      van [artikel 22, eerste lid, onder a, van de Wet][ref2] ingetrokken, indien de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel22
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.95
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '22'
  - number: 3.95.1.a
    text: niet het hoofdverblijf buiten Nederland heeft verplaatst;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.95
  - number: 3.95.1.b
    text: |-
      aantoont dat hij langer dan zes jaar voor studie verblijft in een andere staat die partij is bij het Verdrag tot
      oprichting van de Europese Gemeenschap; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.95
  - number: 3.95.1.c
    text: |-
      aantoont dat hij, in geval van verblijf gedurende een aaneengesloten periode van twaalf maanden of meer buiten het
      grondgebied van de staten die partij zijn bij de Overeenkomst tot oprichting van de Europese Gemeenschap, gedurende
      die periode op het grondgebied heeft verbleven van de staten die partij zijn bij de Overeenkomst betreffende de
      Europese Economische Ruimte van 2 mei 1992, dan wel de Zwitserse Bondsstaat, tenzij hij langer dan zes jaar afwezig
      is geweest van het Nederlands grondgebied.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.95
  - number: 3.95.2
    text: |-
      Indien de verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20 van de Wet][ref1], op frauduleuze wijze
      is verkregen, wordt de verblijfsvergunning ingetrokken op de in [artikel 22, eerste lid, onder b, van de Wet][ref2]
      genoemde grond, tenzij sedert de verkrijging een periode van twaalf jaren is verstreken, in welk geval de
      verblijfsvergunning wordt gewijzigd, indien daarop de aantekening «EG-langdurig ingezetene» was gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel22
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.95
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '22'
  - number: 3.95.3
    text: |-
      De verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20 van de Wet][ref1], kan, op de grond
      dat de vreemdeling een actuele en ernstige bedreiging voor de openbare orde vormt slechts op grond van
      [artikel 22, eerste lid, onder c, van de Wet][ref2] worden ingetrokken, indien de totale duur van de
      straffen of maatregelen ten minste gelijk is aan een of meer van de toepasselijke normen, bedoeld in
      [artikel 3.86, eerste dan wel tweede lid][ref3]. [Artikel 3.86, derde tot en met negende lid][ref4], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.95
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.95.4
    text: |-
      Onze Minister houdt bij de toepassing van het derde lid mede rekening met de ernst van de inbreuk of het soort
      inbreuk dat door de vreemdeling op de openbare orde is gepleegd, respectievelijk met het gevaar dat van de
      vreemdeling uitgaat.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.95
  - number: 3.95.5
    text: |-
      Bij de toepassing van het derde lid houdt Onze Minister tevens rekening met de leeftijd van de vreemdeling, de
      gevolgen voor de vreemdeling en de leden van zijn gezin, het bestaan van banden met Nederland dan wel het ontbreken
      van banden met het land van herkomst.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.95
  - number: 3.95.6
    text: |-
      Indien de intrekking van de verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20 van de Wet][ref1],
      overeenkomstig het derde lid niet leidt tot verwijdering, wordt de verblijfsvergunning gewijzigd, in geval daarop
      de aantekening «EG-langdurig ingezetene» was gesteld, door die aantekening te vervangen door de aantekening «II».


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.95
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.96a.1
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20 van de Wet][ref1] wordt afgewezen, indien de vreemdeling het inburgeringsexamen, bedoeld in
      [artikel 13 van de Wet inburgering][ref2] niet heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel13
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.96a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '13'
  - number: 3.96a.2
    text: 'Het eerste lid is niet van toepassing, indien de vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.96a
  - number: 3.96a.2.a
    text: 65 jaar of ouder is;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.96a
  - number: 3.96a.2.b
    text: |-
      ten minste acht jaren tijdens de leerplichtige leeftijd in Nederland heeft verbleven overeenkomstig het bepaalde
      bij en krachtens [artikel 2.6 van het Besluit inburgering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.96a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.96a.2.c
    text: |-
      beschikt over een document als bedoeld in
      [artikel 2.3, eerste lid, onder b tot en met l, en tweede lid, van het Besluit inburgering][ref1], dan wel voldoet
      aan een van de criteria, genoemd in [artikel 2.5, onder a tot en met c, van dat besluit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.96a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.96a.2.d
    text: |-
      op grond van [artikel 6, eerste lid][ref1], of [artikel 31, tweede lid, van de Wet inburgering][ref2] van de
      inburgeringsplicht is ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel31
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.96a
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '31'
  - number: 3.96a.3
    text: |-
      Onze Minister kan het eerste lid voorts buiten toepassing laten, indien de vreemdeling
      naar zijn oordeel blijkens een door deze vreemdeling overgelegd advies als bedoeld in
      [artikel 2.8, eerste lid, van het Besluit inburgering][ref1] door een psychische of lichamelijke belemmering, dan
      wel een verstandelijke handicap blijvend niet in staat is het inburgeringsexamen te behalen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.96a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.96a.4
    text: |-
      Onze Minister kan het eerste lid voorts buiten toepassing laten, voorzover toepassing daarvan naar zijn oordeel zal
      leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.96a
  - number: 3.96a.5
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de toepassing van het tweede lid, onder d, en
      derde lid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.96a
  - number: 3.98a.1
    text: |-
      Onze Minister voor Wonen, Wijken en Integratie stelt het basisexamen inburgering ter beoordeling
      van de kennis van de Nederlandse taal en van de Nederlandse maatschappij als bedoeld in
      [artikel 16, eerste lid, onder h, van de Wet][ref1], vast door middel van een geautomatiseerd systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.98a.2
    text: |-
      Het basisexamen inburgering omvat een onderzoek naar de Nederlandse luister- en spreekvaardigheid van de
      vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.3
    text: |-
      Onze Minister voor Wonen, Wijken en Integratie stelt een examenprogramma vast voor de vereiste luister- en
      spreekvaardigheid. Dit examenprogramma strekt tot waarborg dat de vreemdeling die het basisexamen inburgering met
      goed gevolg heeft afgelegd, op een niveau lager dan niveau A1 van het Europees Raamwerk voor Moderne Vreemde Talen:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.3.a
    text: kan luisteren naar aankondigingen en instructies;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.3.b
    text: eenvoudige vragen en antwoorden betrekking hebbend op de directe persoonlijke levenssfeer kan begrijpen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.3.c
    text: elementaire informatie over de eigen persoon kan geven, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.3.d
    text: enkele eenvoudige taalhandelingen kan verrichten.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.4
    text: |-
      De normering van het onderdeel luister- en spreekvaardigheid van het basisexamen inburgering wordt gerelateerd aan
      een van de niveaus van het Europees Raamwerk voor Moderne Vreemde Talen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.5
    text: Het basisexamen inburgering omvat tevens een onderzoek naar de kennis van de Nederlandse samenleving.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.6
    text: |-
      Onze Minister voor Wonen, Wijken en Integratie stelt een examenprogramma vast voor de vereiste kennis van de
      Nederlandse samenleving. Dit examenprogramma waarborgt dat de vreemdeling die het basisexamen inburgering met goed
      gevolg heeft afgelegd, beschikt over elementaire praktische kennis van:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.6.a
    text: Nederland, waaronder topografie, geschiedenis en staatsinrichting;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.6.b
    text: huisvesting, onderwijs, arbeid, gezondheidszorg en inburgering in Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.6.c
    text: zijn rechten en zijn verplichtingen na aankomst in Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.6.d
    text: rechten en verplichtingen van anderen in Nederland, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.6.e
    text: in Nederland gangbare omgangsregels.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.7
    text: |-
      Het basisexamen inburgering wordt mondeling afgelegd in de Nederlandse taal op een niveau dat niet hoger is dan het
      niveau, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98a.8
    text: |-
      De examenprogramma’s, bedoeld in het derde en zesde lid, worden overeenkomstig door Onze Minister voor Wonen,
      Wijken en Integratie te stellen regels en tegen een door Onze Minister voor Wonen, Wijken en Integratie te stellen
      bedrag beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98a
  - number: 3.98b.1
    text: 'Tot het basisexamen inburgering wordt niet toegelaten de vreemdeling die:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98b
  - number: 3.98b.1.a
    text: |-
      niet overeenkomstig door Onze Minister voor Wonen, Wijken en Integratie te stellen regels de aan het basisexamen
      verbonden kosten heeft voldaan, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98b
  - number: 3.98b.1.b
    text: geen medewerking heeft verleend aan het vastleggen van gegevens met het oog op zijn identificatie.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98b
  - number: 3.98b.2
    text: De kosten, bedoeld in het eerste lid, onder a, bedragen € 350,00.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98b
  - number: 3.98b.3
    text: |-
      De medewerking, bedoeld in het eerste lid, onder b, bestaat uit het zich digitaal laten fotograferen, het laten
      nemen van digitale vingerafdrukken en het laten maken van een scan of kopie van het paspoort of, indien de
      vreemdeling door de autoriteiten van het land waarvan hij onderdaan is, niet in het bezit kan worden gesteld van
      een paspoort, een ander identiteitsbewijs.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98b
  - number: 3.98b.4
    text: |-
      Onze Minister voor Wonen, Wijken en Integratie stelt een examenreglement vast. Het examenreglement bevat in elk
      geval bepalingen omtrent:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98b
  - number: 3.98b.4.a
    text: de gang van zaken tijdens het basisexamen inburgering;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98b
  - number: 3.98b.4.b
    text: de maatregelen om onregelmatigheden en ordeverstoring tijdens het basisexamen inburgering te voorkomen, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98b
  - number: 3.98b.4.c
    text: de maatregelen die in geval van onregelmatigheden of ordeverstoring kunnen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98b
  - number: 3.98c.1
    text: |-
      Het basisexamen inburgering wordt onder toezicht van een door het hoofd van de Nederlandse diplomatieke of
      consulaire vertegenwoordiging aan te wijzen ambtenaar, medewerker, autoriteit of instelling afgelegd op een door
      dat hoofd vast te stellen tijdstip en in een door dat hoofd aan te wijzen ruimte.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98c
  - number: 3.98c.2
    text: |-
      Het basisexamen inburgering wordt afgelegd door middel van een telefonische of digitale verbinding met een
      geautomatiseerd systeem, dat door een door Onze Minister voor Wonen, Wijken en Integratie aan te wijzen instantie
      volgens door Onze Minister voor Wonen, Wijken en Integratie te stellen regels wordt beheerd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98c
  - number: 3.98c.3
    text: |-
      Onze Minister voor Wonen, Wijken en Integratie beoordeelt de resultaten van het basisexamen inburgering door middel
      van het geautomatiseerde systeem, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98c
  - number: 3.98c.4
    text: |-
      Het resultaat van het basisexamen inburgering wordt in de gevallen waarin Onze Minister voor Wonen, Wijken en
      Integratie niet door middel van het geautomatiseerde systeem, bedoeld in het tweede lid, tot een beoordeling
      daarvan heeft kunnen komen, beoordeeld door examinatoren.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98c
  - number: 3.98d.1
    text: De resultaten van het basisexamen inburgering worden niet heroverwogen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98d
  - number: 3.98d.2
    text: |-
      Onverminderd [artikel 3.98b][ref1], kan de vreemdeling die het basisexamen inburgering niet met goed gevolg heeft
      afgelegd, het examen te allen tijde opnieuw afleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.98d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '4'
  - number: 3.99.1
    text: |-
      De aanvraag, bedoeld in de [artikelen 14][ref1] en [20 van de Wet][ref2], wordt gedaan door het indienen van een
      formulier, waarvan het model bij ministeriële regeling wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.99
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.99.2
    text: |-
      De door een vreemdeling ingediende aanvraag tot het verlenen, het wijzigen of het verlengen van de geldigheidsduur
      van de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan mede betrekking hebben
      op diens inwonende kinderen jonger dan twaalf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.99
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '3.100'
    text: |-
      Indien de vreemdeling, hangende de besluitvorming op een eerdere aanvraag, wijziging van het gevraagde
      verblijfsdoel wenst, dient hij een nieuwe aanvraag in.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.100
  - number: 3.101.1
    text: |-
      De aanvraag, bedoeld in de [artikelen 14][ref1] en [20 van de Wet][ref2], wordt ingediend op een bij ministeriële
      regeling aan te wijzen plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.101
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.101.2
    text: |-
      In afwijking van het eerste lid wordt, indien de vreemdeling rechtens de vrijheid is ontnomen, de aanvraag
      ingediend op de plaats waar de vrijheidsontneming ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.101
  - number: 3.101.3
    text: |-
      In afwijking van het eerste lid kan de aanvraag, bedoeld in [artikel 14 van de Wet][ref1], tevens worden ingediend
      bij de Nederlandse diplomatieke of consulaire vertegenwoordiging in Australië, Nieuw Zeeland of Canada, indien de
      vreemdeling de Australische, Nieuw Zeelandse of Canadese nationaliteit bezit en in Nederland wil verblijven in het
      kader van een uitwisselingsprogramma tussen Nederland en die landen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.101
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.102.1
    text: |-
      De vreemdeling legt bij de in persoon ingediende aanvraag tot het verlenen, het wijzigen of het verlengen van de
      geldigheidsduur van een verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], of tot
      het verlenen van een verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20 van de Wet][ref2], in ieder
      geval over een geldig document voor grensoverschrijding, alsmede, voorzover redelijkerwijs mogelijk, de gegevens
      en bescheiden op basis waarvan kan worden vastgesteld dat wordt voldaan aan de voorwaarden voor de verlening,
      wijziging of verlenging.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.102
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.102.2
    text: |-
      Bij de niet in persoon ingediende aanvraag legt de vreemdeling afschriften over van de in het eerste lid genoemde
      gegevens en bescheiden en overlegt hij op verzoek van Onze Minister de originelen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.102
  - number: 3.102.3
    text: |-
      In afwijking van het eerste en tweede lid, legt de vreemdeling die niet beschikt over een geldig document voor
      grensoverschrijding, voorzover redelijkerwijs mogelijk, gegevens en bescheiden over waarmee wordt aangetoond
      dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van een geldig
      document voor grensoverschrijding kan worden gesteld. In dat geval overlegt hij tevens aanvullende gegevens of
      bescheiden omtrent zijn identiteit en nationaliteit.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.102
  - number: '3.103'
    text: |-
      De aanvraag wordt getoetst aan het recht dat gold op het tijdstip waarop de aanvraag is ontvangen, tenzij uit deWet
      anders voortvloeit of het recht dat geldt op het tijdstip waarop de beschikking wordt gegeven, voor de vreemdeling
      gunstiger is.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.103
  - number: 3.103a.1
    text: |-
      Indien Onze Minister een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref1] verleent aan of verlengt
      van een vreemdeling die houder is van een door een andere staat die partij is bij het Verdrag tot oprichting van
      de Europese Gemeenschap, ter uitvoering van artikel 8 van de [Richtlijn nr. 2003/109/EG](32003L0109) van de Raad
      van 25 november 2003 betreffende de status van langdurig ingezeten onderdanen van derde landen (PbEU 2004, L16)
      afgegeven EG-verblijfsvergunning voor langdurig ingezetenen, doet hij daarvan mededeling aan de autoriteiten van
      die staat. Indien Onze Minister aan die houder ter uitvoering van artikel 8, tweede lid, van deze richtlijn een EG-
      verblijfsvergunning voor langdurig ingezetenen verleent, doet hij daarvan eveneens mededeling aan die autoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.103a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.103a.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien Onze Minister besluit de verblijfsvergunning van de in het
      eerste lid bedoelde houder in te trekken of niet te verlengen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.103a
  - number: 3.103a.3
    text: |-
      Indien Onze Minister overweegt een vreemdeling, die houder is als bedoeld in het eerste lid, uit te zetten naar een
      staat die geen partij is bij het Verdrag, bedoeld in het eerste lid, raadpleegt hij de autoriteiten van de andere
      staat, bedoeld in het eerste lid. Indien Onze Minister dienovereenkomstig besluit uit te zetten, verstrekt hij die
      autoriteiten alle nodige informatie met betrekking tot de uitzetting.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.103a
  - number: 3.103a.4
    text: |-
      Onze Minister vormt het contactpunt dat door een staat als bedoeld in het eerste lid kan worden geraadpleegd, ter
      uitvoering van de in het eerste lid bedoelde richtlijn, en is verantwoordelijk voor het ontvangen en toezenden van
      de informatie, bedoeld in de voorgaande leden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.103a
  - number: 3.104.1
    text: |-
      De beschikking, waarbij de aanvraag tot het verlenen, het wijzigen of het verlengen van de geldigheidsduur van
      de verblijfsvergunning, bedoeld in [artikel 14][ref1] en [20 van de Wet][ref2], geheel of gedeeltelijk wordt
      ingewilligd, of waarbij de verblijfsvergunning ambtshalve wordt verleend of gewijzigd, wordt bekendgemaakt door
      uitreiking van het document, bedoeld in [artikel 9, eerste lid, van de Wet][ref3], waaruit het rechtmatig verblijf
      op grond van [artikel 8, onder a onderscheidenlijk onder b, van de Wet][ref4] blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.104.2
    text: |-
      Indien de vreemdeling, niet zijnde gemeenschapsonderdaan, in aanmerking komt voor meer dan één verblijfsdocument
      wordt één document uitgereikt en worden de overige beschikkingen bekendgemaakt door het stellen van een aantekening
      op dat document.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.104
  - number: 3.104.3
    text: |-
      De beschikking ten aanzien van een zich in het buitenland bevindende vreemdeling, waarbij de aanvraag tot het
      verlenen, het wijzigen of het verlengen van de geldigheidsduur van een verblijfsvergunning geheel of gedeeltelijk
      wordt ingewilligd, of waarbij de verblijfsvergunning ambtshalve wordt verleend of gewijzigd, wordt bekendgemaakt na
      zijn aankomst in Nederland. Het eerste en tweede lid zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.104
  - number: 3.104.4
    text: |-
      De beschikking, die niet of niet mede strekt tot het verlenen, wijzigen of verlengen van de geldigheidsduur van
      een verblijfsvergunning als bedoeld in [artikel 14][ref1] of [20 van de Wet][ref2], wordt bekend gemaakt door
      toezending naar het laatst bekende adres van de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.104.5
    text: |-
      Bij de bekendmaking van de beschikking, waarbij wordt beslist op de aanvraag, bedoeld in
      [artikel 20 van de Wet][ref1], wordt de aanvrager meegedeeld welke rechten en plichten hij heeft krachtens de
      [Richtlijn nr. 2003/109/EG](32003L0109) van de Raad van 25 november 2003 betreffende de status van langdurig
      ingezeten onderdanen van derde landen (PbEU 2004, L16).


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.105.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref1], wordt verleend of verlengd
      voor vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.105.2
    text: |-
      Bij dit besluit kunnen gevallen worden aangewezen waarin de verblijfsvergunning wordt verleend of verlengd
      voor minder dan vijf achtereenvolgende jaren, met dien verstande dat de verblijfsvergunning op grond van
      [artikel 29, eerste lid, onder a, van de Wet][ref1] voor ten minste drie jaar en de verblijfsvergunning op grond
      van [artikel 29, eerste lid, onder b, van de Wet][ref2] voor ten minste één jaar wordt verleend of verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.105a
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de beoordeling of sprake is van
      omstandigheden als bedoeld in [artikel 31, eerste lid, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel31
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '31'
  - number: 3.105b
    text: |-
      Aan de vreemdeling die aannemelijk heeft gemaakt dat hij verdragsvluchteling als bedoeld in
      [artikel 29, eerste lid, onder a, van de Wet][ref1] is, kan verlening van een verblijfsvergunning voor bepaalde
      tijd als bedoeld in [artikel 28 van de Wet][ref2] op grond van die toelatingsgrond slechts worden geweigerd,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.105b.a
    text: er goede redenen bestaan om de vreemdeling te beschouwen als een gevaar voor de nationale veiligheid; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105b
  - number: 3.105b.b
    text: |-
      de vreemdeling bij onherroepelijk geworden rechterlijk vonnis veroordeeld is voor een bijzonder ernstig misdrijf en
      een gevaar vormt voor de gemeenschap.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105b
  - number: 3.105c.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref1], die is verleend op
      grond van [artikel 29, eerste lid, onder a, van die wet][ref2], wordt ingetrokken dan wel de aanvraag tot
      het verlengen van de geldigheidsduur ervan wordt afgewezen indien sprake is van de situatie, bedoeld in
      [artikel 32, eerste lid, onder a dan wel c, van de Wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel32
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '32'
  - number: 3.105c.2
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref1], die is
      verleend op grond van [artikel 29, eerste lid, onder a, van die wet][ref2], kan slechts op grond van
      [artikel 32, eerste lid, onder b, van de Wet][ref3] worden ingetrokken dan wel de aanvraag tot het verlengen van de
      geldigheidsduur ervan worden afgewezen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel32
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '32'
  - number: 3.105c.2.a
    text: er goede redenen bestaan om de vreemdeling te beschouwen als een gevaar voor de nationale veiligheid; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105c
  - number: 3.105c.2.b
    text: |-
      de vreemdeling bij onherroepelijk geworden rechterlijk vonnis veroordeeld is voor een bijzonder ernstig misdrijf en
      een gevaar vormt voor de gemeenschap.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105c
  - number: 3.105c.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de beoordeling of sprake is van de
      situatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105c
  - number: 3.105d
    text: |-
      Onder folteringen, onmenselijke of vernederende behandelingen of bestraffingen als bedoeld in
      [artikel 29, eerste lid, onder b, van de Wet][ref1], wordt mede verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105d
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.105d.a
    text: doodstraf of executie;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105d
  - number: 3.105d.b
    text: |-
      ernstige en individuele bedreiging van het leven of de persoon van een burger als gevolg van willekeurig geweld in
      het kader van een internationaal of binnenlands gewapend conflict.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105d
  - number: 3.105e
    text: |-
      Aan de vreemdeling die aannemelijk heeft gemaakt dat zijn aanvraag is gegrond op omstandigheden die de
      rechtsgrond voor verlening, bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref1], vormen, wordt een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28 van die wet][ref2] verleend, tenzij er ernstige
      redenen zijn om aan te nemen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105e
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.105e.a
    text: |-
      de vreemdeling een misdrijf tegen de vrede, een oorlogsmisdrijf of een misdrijf tegen de menselijkheid heeft
      gepleegd, zoals gedefinieerd in de internationale instrumenten waarmee wordt beoogd regelingen te treffen ten
      aanzien van dergelijke misdrijven;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105e
  - number: 3.105e.b
    text: de vreemdeling een ernstig misdrijf heeft gepleegd;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105e
  - number: 3.105e.c
    text: |-
      de vreemdeling zich schuldig heeft gemaakt aan daden die in strijd zijn met de doelstellingen en beginselen van de
      Verenigde Naties als vervat in de preambule en de artikelen 1 en 2 van het Handvest van de Verenigde Naties;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105e
  - number: 3.105e.d
    text: de vreemdeling een gevaar vormt voor de gemeenschap of de nationale veiligheid; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105e
  - number: 3.105e.e
    text: |-
      de vreemdeling heeft aangezet tot of anderszins heeft deelgenomen aan de onder a tot en met c vermelde misdrijven
      of daden,
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105e
  - number: 3.105f.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref1], die is verleend op
      grond van [artikel 29, eerste lid, onder b, van die wet][ref2] wordt ingetrokken dan wel de aanvraag tot
      het verlengen van de geldigheidsduur ervan wordt afgewezen, indien sprake is van de situatie, bedoeld in
      [artikel 32, eerste lid, onder a dan wel c, van de Wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel32
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105f
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '32'
  - number: 3.105f.2
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref1], die is verleend
      op grond van [artikel 29, eerste lid, onder b, van die wet][ref2] wordt slechts ingetrokken dan
      wel de aanvraag tot het verlengen van de geldigheidsduur ervan wordt slechts afgewezen op grond van
      [artikel 32, eerste lid, onder b, van de Wet][ref3], indien er ernstige redenen zijn om aan te nemen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel32
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105f
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '32'
  - number: 3.105f.2.a
    text: |-
      de vreemdeling een misdrijf tegen de vrede, een oorlogsmisdrijf of een misdrijf tegen de menselijkheid heeft
      gepleegd, zoals gedefinieerd in de internationale instrumenten waarmee wordt beoogd regelingen te treffen ten
      aanzien van dergelijke misdrijven;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105f
  - number: 3.105f.2.b
    text: de vreemdeling een ernstig misdrijf heeft gepleegd;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105f
  - number: 3.105f.2.c
    text: |-
      de vreemdeling zich schuldig heeft gemaakt aan daden die in strijd zijn met de doelstellingen en beginselen van de
      Verenigde Naties als vervat in de preambule en de artikelen 1 en 2 van het Handvest van de Verenigde Naties;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105f
  - number: 3.105f.2.d
    text: de vreemdeling een gevaar vormt voor de gemeenschap of voor de nationale veiligheid; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105f
  - number: 3.105f.2.e
    text: |-
      de vreemdeling heeft aangezet tot of anderszins heeft deelgenomen aan de onder a tot en met c genoemde misdrijven
      of daden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105f
  - number: 3.105f.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de beoordeling of sprake is van de
      situatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.105f
  - number: '3.106'
    text: |-
      De indicatoren die in ieder geval zullen worden betrokken in de beoordeling of er sprake is van een situatie als
      bedoeld in [artikel 29, eerste lid, onder d, van de Wet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.106
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.106.a
    text: |-
      de aard van het geweld in het land van herkomst, met name de ernst van de schendingen van de mensenrechten en het
      oorlogsrecht, de mate van willekeur, de mate waarin het geweld voorkomt en de mate van geografische spreiding van
      het geweld;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.106
  - number: 3.106.b
    text: |-
      de activiteiten van internationale organisaties ten aanzien van het land van herkomst indien en voorzover deze een
      graadmeter vormen voor de positie van de internationale gemeenschap ten aanzien van de situatie in het land van
      herkomst, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.106
  - number: 3.106.c
    text: het beleid in andere landen van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.106
  - number: 3.106a.1
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de Wet][ref1] wordt slechts afgewezen op grond van [artikel 30, eerste lid, onder d][ref2], of met
      toepassing van [artikel 31, tweede lid, onder h, van de Wet][ref3] indien, naar het oordeel van Onze Minister, alle
      relevante feiten en omstandigheden in aanmerking nemend, de vreemdeling in het betrokken derde land overeenkomstig
      de volgende beginselen zal worden behandeld:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel31
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.106a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '31'
  - number: 3.106a.1.a
    text: |-
      het leven en de vrijheid worden niet bedreigd om redenen van ras, religie, nationaliteit, lidmaatschap van een
      bepaalde sociale groep of politieke overtuiging, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.106a
  - number: 3.106a.1.b
    text: het beginsel van non-refoulement overeenkomstig het Vluchtelingenverdrag wordt nageleefd, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.106a
  - number: 3.106a.1.c
    text: |-
      het verbod op verwijdering in strijd met het recht op vrijwaring tegen foltering en andere wrede, onmenselijke of
      vernederende behandeling, zoals neergelegd in het internationaal recht, wordt nageleefd, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.106a
  - number: 3.106a.1.d
    text: |-
      de mogelijkheid bestaat om om de vluchtelingenstatus te verzoeken en, indien hij als vluchteling wordt erkend,
      bescherming te ontvangen overeenkomstig het Vluchtelingenverdrag.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.106a
  - number: 3.106a.2
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de Wet][ref1] wordt slechts afgewezen op grond van [artikel 30, eerste lid, onder d][ref2], of met
      toepassing van [artikel 31, tweede lid, onder h, van de Wet][ref3] indien de vreemdeling een zodanige band heeft
      met het betrokken derde land dat het voor hem redelijk zou zijn naar dat land te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel31
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.106a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '31'
  - number: 3.106a.3
    text: |-
      Bij de beoordeling of sprake is van een band als bedoeld in het tweede lid, worden alle relevante feiten en
      omstandigheden betrokken, waaronder begrepen de aard, duur en omstandigheden van het eerder verblijf.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.106a
  - number: 3.106a.4
    text: |-
      Bij de beoordeling of de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de Wet][ref1] wordt afgewezen op grond van [artikel 30, eerste lid, onder d, van de Wet][ref2],
      wordt mede betrokken het beroep van de vreemdeling inhoudende dat hij in het derde land zal worden blootgesteld aan
      foltering, wrede, onmenselijke of vernederende behandeling of bestraffing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.106a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '30'
  - number: 3.107.1
    text: |-
      Onder een persoon als bedoeld in artikel 1F van het Vluchtelingenverdrag wordt mede verstaan een persoon die heeft
      aangezet tot of anderszins heeft deelgenomen aan de in dat artikel genoemde misdrijven of daden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.107
  - number: 3.107.2
    text: |-
      Indien artikel 1F van het Vluchtelingenverdrag aan het verlenen van een verblijfsvergunning aan de vreemdeling op
      grond van [artikel 29, eerste lid, onder a, van de Wet][ref1] in de weg staat, wordt aan die vreemdeling evenmin
      een verblijfsvergunning verleend op één van de andere gronden bedoeld in [artikel 29 van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.107
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.107.3
    text: |-
      Aan de echtgenoot of echtgenote, het minderjarig kind, de partner of het meerderjarig kind, bedoeld in
      [artikel 29, eerste lid, onder e of f, van de Wet][ref1], van de vreemdeling, bedoeld in het eerste lid, wordt
      geen verblijfsvergunning als bedoeld in [artikel 28 van de Wet][ref2], verleend, tenzij dit gezinslid aannemelijk
      heeft gemaakt dat zijn aanvraag is gegrond op omstandigheden die zelfstandig een rechtsgrond voor verlening van een
      verblijfsvergunning op grond van [artikel 29, eerste lid, onder a, b of c, van de Wet][ref3] vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.107
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.107a.1
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd, bedoeld in
      [artikel 33 van de Wet][ref1], wordt afgewezen indien de vreemdeling het inburgeringsexamen, bedoeld in
      [artikel 13 van de Wet inburgering][ref2] niet heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel13
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '13'
  - number: 3.107a.2
    text: 'Het eerste lid is niet van toepassing, indien de vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.107a
  - number: 3.107a.2.a
    text: 65 jaar of ouder is;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.107a
  - number: 3.107a.2.b
    text: |-
      ten minste acht jaren tijdens de leerplichtige leeftijd in Nederland heeft verbleven overeenkomstig het bepaalde
      bij en krachtens [artikel 2.6 van het Besluit inburgering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.107a.2.c
    text: |-
      beschikt over een document als bedoeld in
      [artikel 2.3, eerste lid, onder b tot en met l, en tweede lid, van het Besluit inburgering][ref1], dan wel voldoet
      aan een van de criteria, genoemd in [artikel 2.5, onder a tot en met c, van dat besluit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.107a.2.d
    text: |-
      op grond van [artikel 6, eerste lid][ref1], of [artikel 31, tweede lid, van de Wet inburgering][ref2] van de
      inburgeringsplicht is ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel31
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '31'
  - number: 3.107a.3
    text: |-
      Onze Minister kan het eerste lid buiten toepassing, voor zover de vreemdeling naar zijn oordeel blijkens een door
      deze vreemdeling overgelegd advies als bedoeld in [artikel 2.8, eerste lid, van het Besluit inburgering][ref1]
      door een psychische of lichamelijke belemmering, dan wel een verstandelijke handicap blijvend niet in staat is het
      inburgeringsexamen te behalen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.107a.4
    text: |-
      Onze Minister kan het eerste lid voorts buiten toepassing laten, voorzover toepassing daarvan naar zijn oordeel zal
      leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.107a
  - number: 3.107a.5
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de toepassing van het tweede lid, onder d, en
      derde lid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.107a
  - number: 3.108.1
    text: |-
      Het model van de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in de [artikelen 28][ref1] en
      [33 van de Wet][ref2], wordt bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.108
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
  - number: 3.108.2
    text: |-
      De aanvraag wordt door de vreemdeling of zijn wettelijk vertegenwoordiger in persoon ingediend op een bij
      ministeriële regeling te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.108
  - number: 3.108.3
    text: |-
      In afwijking van het tweede lid wordt, indien de vreemdeling rechtens de vrijheid is ontnomen, de aanvraag
      ingediend op de plaats waar de vrijheidsontneming ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.108
  - number: '3.109'
    text: |-
      Van de vreemdeling die te kennen geeft de aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde
      tijd, bedoeld in [artikel 28 van de Wet][ref1], in te willen dienen, worden door Onze Minister identificatiefoto's
      vervaardigd en wordt een dactyloscopisch signalement opgemaakt. De vreemdeling verleent hieraan zijn medewerking.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.109
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.110.1
    text: |-
      Zo spoedig mogelijk nadat de vreemdeling de aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde
      tijd, bedoeld in [artikel 28 van de Wet][ref1], heeft ingediend, wordt hij door Onze Minister aan een eerste gehoor
      onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.110
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.110.2
    text: |-
      Het eerste gehoor geschiedt overeenkomstig een bij ministeriële regeling vastgestelde vragenlijst. De vragenlijst
      bevat geen vragen omtrent de beweegredenen van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.110
  - number: 3.110.3
    text: Een afschrift van de ingevulde vragenlijst wordt zo spoedig mogelijk aan de vreemdeling ter kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.110
  - number: 3.111.1
    text: |-
      Niet eerder dan zes dagen nadat de vreemdeling de aanvraag tot het verlenen van de verblijfsvergunning voor
      bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref1], heeft ingediend, wordt hij door Onze Minister aan een
      nader gehoor onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.111
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.111.2
    text: |-
      Van het nader gehoor wordt een schriftelijk verslag gemaakt. Een afschrift van het verslag van nader gehoor wordt
      zo spoedig mogelijk aan de vreemdeling ter kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.111
  - number: 3.111.3
    text: |-
      Het verslag van nader gehoor vermeldt de termijn binnen welke de vreemdeling uit eigen beweging of desgevraagd
      nadere gegevens kan verstrekken. Deze termijn bedraagt ten minste twee dagen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.111
  - number: 3.112.1
    text: |-
      De termijnen, genoemd in [artikel 3.111, eerste en derde lid][ref1], zijn niet van toepassing op de aanvraag van
      de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.112
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.112.1.a
    text: aan wie rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.112
  - number: 3.112.1.b
    text: |-
      ten aanzien van wie Onze Minister naar aanleiding van het in [artikel 3.110][ref1] bedoelde eerste gehoor overweegt
      de aanvraag binnen 48 proces-uren af te wijzen, of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.112
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.112.1.c
    text: |-
      ten aanzien van wie Onze Minister naar aanleiding van het in [artikel 3.110][ref1] bedoelde eerste gehoor overweegt
      de aanvraag af te wijzen op grond van [artikel 30, onder a, van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.112
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '30'
  - number: 3.112.2
    text: |-
      De in het eerste lid bedoelde vreemdeling wordt door Onze Minister zo spoedig mogelijk nadat aan
      [artikel 3.110, derde lid][ref1], is voldaan, aan een nader gehoor onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.112
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: '3.113'
    text: |-
      Aan de vreemdeling wordt tijdig mededeling gedaan van de hem toekomende bevoegdheid zich bij een gehoor als
      bedoeld in de [artikelen 3.110, eerste lid][ref1], [3.111, eerste lid][ref2], en [3.112, tweede lid][ref3], te
      doen bijstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.113
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.114.1
    text: |-
      Bij de aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28 van de Wet][ref1], worden door de vreemdeling in persoon alle gegevens verstrekt, waaronder begrepen
      de relevante documenten, op basis waarvan in samenwerking met de vreemdeling beoordeeld kan worden of er een
      rechtsgrond voor verlening van de vergunning aanwezig is


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.114
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.114.2
    text: Bij ministeriële regeling kan worden aangewezen waaruit de gegevens, bedoeld in het eerste lid, bestaan.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.114
  - number: 3.115.1
    text: 'Het schriftelijke voornemen om:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.115
  - number: 3.115.1.a
    text: |-
      de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 28 van de Wet][ref1], af te wijzen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.115.1.b
    text: |-
      de aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning, bedoeld in
      [artikel 28 van de Wet][ref1], af te wijzen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.115.1.c
    text: |-
      de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 33 van de Wet][ref1], af te wijzen, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
  - number: 3.115.1.d
    text: |-
      de verblijfsvergunning, bedoeld in de [artikelen 28][ref1] en [33 van de Wet][ref2], in te trekken, wordt aan de
      vreemdeling meegedeeld door uitreiking of toezending ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
  - number: 3.115.2
    text: |-
      De termijn waarbinnen de vreemdeling zijn zienswijze schriftelijk naar voren brengt, bedraagt, tenzij een met
      redenen omkleed verzoek om verlenging van deze termijn wordt gehonoreerd:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.115
  - number: 3.115.2.a
    text: in het geval, bedoeld in het eerste lid, onder a, vier weken, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.115
  - number: 3.115.2.b
    text: in de gevallen, bedoeld in het eerste lid, onder b, c en d, zes weken.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.115
  - number: 3.115.3
    text: |-
      De termijn, bedoeld in het tweede lid, vangt aan met ingang van de dag na die waarop het voornemen is uitgereikt
      of toegezonden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.115
  - number: 3.115.4
    text: |-
      De schriftelijke zienswijze is tijdig bij Onze Minister ingediend, indien deze voor het einde van de termijn is
      ontvangen. Bij verzending per post is de zienswijze tijdig ingediend, indien deze voor het einde van de termijn ter
      post is bezorgd, mits deze niet later dan een week na afloop van de termijn is ontvangen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.115
  - number: 3.115.5
    text: De ontvangst van de schriftelijke zienswijze wordt door Onze Minister bevestigd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.115
  - number: 3.115.6
    text: |-
      Onze Minister houdt rekening met een na afloop van de termijn ontvangen schriftelijke zienswijze, indien de
      beschikking nog niet bekend is gemaakt. Met een na afloop van de termijn ontvangen aanvulling op een eerder
      ingediende schriftelijke zienswijze wordt rekening gehouden, indien de beschikking nog niet bekend is gemaakt en de
      afdoening van de zaak daardoor niet ontoelaatbaar wordt vertraagd. Het ontbreken van de schriftelijke zienswijze,
      na het verstrijken van de termijn waarbinnen de vreemdeling zijn zienswijze schriftelijk naar voren kan brengen,
      staat aan het geven van de beschikking niet in de weg.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.115
  - number: 3.116.1
    text: |-
      Indien Onze Minister voornemens is de aanvraag, bedoeld in [artikel 3.115, eerste lid, onder a, b en c][ref1],
      van een vreemdeling aan wie rechtens zijn vrijheid is ontnomen op grond van [artikel 6][ref2] of
      [artikel 59 van de Wet][ref3], af te wijzen terwijl de vrijheidsontneming voortduurt, wordt het schriftelijk
      voornemen daartoe aan de vreemdeling uitgereikt. [Artikel 3.115, eerste tot en met vierde lid][ref4], is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.116
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '59'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.116.2
    text: |-
      De vreemdeling brengt zijn zienswijze binnen twee weken schriftelijk naar voren, tenzij onze Minister voornemens is
      de aanvraag af te wijzen binnen 48 proces-uren, in welk geval [artikel 3.117][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.116
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.116.3
    text: De termijn, bedoeld in het tweede lid, vangt aan direct na de uitreiking van het voornemen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.116
  - number: 3.116.4
    text: |-
      De schriftelijke zienswijze is tijdig bij Onze Minister ingediend, indien deze voor het einde van de termijn is
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.116
  - number: 3.117.1
    text: |-
      Indien Onze Minister voornemens is de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in
      [artikel 28 van de Wet][ref1], af te wijzen binnen 48 proces-uren, wordt het schriftelijk voornemen daartoe aan de
      vreemdeling uitgereikt. [Artikel 3.115][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.117
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.117.2
    text: De vreemdeling brengt zijn zienswijze binnen drie proces-uren schriftelijk naar voren.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.117
  - number: 3.117.3
    text: |-
      De schriftelijke zienswijze is tijdig bij Onze Minister ingediend, indien deze voor het einde van de termijn is
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.117
  - number: 3.117.4
    text: |-
      Het tijdstip van uitreiken van het voornemen en de ontvangst van de schriftelijke zienswijze worden door Onze
      Minister vastgelegd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.117
  - number: 3.117.5
    text: |-
      Onze Minister houdt rekening met een na afloop van de termijn ontvangen schriftelijke zienswijze, indien de
      beschikking nog niet bekend is gemaakt. Met een na afloop van de termijn ontvangen aanvulling op een eerder
      ingediende schriftelijke zienswijze wordt rekening gehouden indien de beschikking nog niet bekend is gemaakt en de
      afdoening van de zaak daardoor niet ontoelaatbaar wordt vertraagd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.117
  - number: 3.118.1
    text: |-
      Indien Onze Minister oordeelt dat een ander land ingevolge een verdrag of een voor dit land en Nederland bindend
      besluit van een volkenrechtelijke organisatie verantwoordelijk is voor de behandeling van een aanvraag tot het
      verlenen van de verblijfsvergunning, bedoeld in [artikel 28 van de Wet][ref1], en uit dien hoofde het andere
      land om overname zal verzoeken, wordt het schriftelijk voornemen om de aanvraag af te wijzen, vooruitlopend op
      aanvaarding van het verzoek tot overname door het andere land, aan de vreemdeling uitgereikt. [Artikel 3.115][ref2]
      is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.118.2
    text: |-
      Indien Onze Minister het voornemen, bedoeld in het eerste lid, binnen 48 proces-uren aan de vreemdeling uitreikt,
      brengt de vreemdeling zijn zienswijze binnen drie procesuren schriftelijk naar voren.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.118
  - number: 3.118.3
    text: |-
      Indien Onze Minister het voornemen, bedoeld in het eerste lid, na ommekomst van het in het tweede lid genoemde
      aantal proces-uren aan de vreemdeling uitreikt, brengt de vreemdeling zijn zienswijze binnen drie dagen
      schriftelijk naar voren, tenzij een met redenen omkleed verzoek om verlenging van deze termijn wordt gehonoreerd.
      Deze termijn vangt aan met ingang van de dag na die waarop het voornemen is uitgereikt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.118
  - number: 3.118.4
    text: |-
      De schriftelijke zienswijze is tijdig bij Onze Minister ingediend, indien deze voor het einde van de termijn is
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.118
  - number: 3.118.5
    text: |-
      In het geval, bedoeld in het tweede lid, worden het tijdstip van uitreiken van het voornemen en de ontvangst van de
      schriftelijke zienswijze door Onze Minister vastgelegd. In het geval, bedoeld in het derde lid, wordt de ontvangst
      van de schriftelijke zienswijze door Onze Minister bevestigd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.118
  - number: 3.118.6
    text: |-
      Onze Minister houdt rekening met een na afloop van de termijn ontvangen schriftelijke zienswijze, indien de
      beschikking nog niet bekend is gemaakt. Met een na afloop van de termijn ontvangen aanvulling op een eerder
      ingediende schriftelijke zienswijze wordt rekening gehouden, indien de beschikking nog niet bekend is gemaakt en de
      afdoening van de zaak daardoor niet ontoelaatbaar wordt vertraagd. Het ontbreken van de schriftelijke zienswijze,
      na het verstrijken van de termijn waarbinnen de vreemdeling zijn zienswijze schriftelijk naar voren kan brengen,
      staat niet aan het verzoek om overname in de weg, en evenmin aan het nemen van de beschikking bij aanvaarding van
      het verzoek tot overname.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.118
  - number: '3.119'
    text: 'Wanneer na het uitreiken of toezenden van het voornemen feiten of omstandigheden:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.119
  - number: 3.119.a
    text: bekend worden, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.119
  - number: 3.119.b
    text: |-
      reeds bekend waren maar naar aanleiding van de zienswijze van de vreemdeling anders worden beoordeeld of gewogen,
      die voor de te nemen beslissing van aanmerkelijk belang kunnen zijn en Onze Minister voornemens blijft de aanvraag
      af te wijzen, wordt dit aan de vreemdeling meegedeeld en wordt hij in de gelegenheid gesteld zijn zienswijze
      daarover naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.119
  - number: '3.120'
    text: |-
      Indien de termijn voor het geven van de beschikking op grond van [artikel 42, vierde lid, van de Wet][ref1] wordt
      verlengd, wordt de vreemdeling hiervan schriftelijk in kennis gesteld. Bij de kennisgeving wordt aangegeven op welk
      moment de verlengde beslistermijn eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel42
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.120
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '42'
  - number: '3.121'
    text: 'Bij ministeriele regeling worden voorschriften gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.121
  - number: 3.121.a
    text: het verstrekken van inlichtingen aan de vreemdeling over de te volgen procedure, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.121
  - number: 3.121.b
    text: het stellen van aantekeningen in het dossier van de vreemdeling ingeval van intrekking van diens aanvraag.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.121
  - number: 3.122.1
    text: |-
      Aan de vreemdeling aan wie op grond van [artikel 29, eerste lid, onder a of b, van de Wet][ref1] een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28 van die wet][ref2] is verleend, wordt zo spoedig
      mogelijk na verlening van die verblijfsvergunning in een voor hem begrijpelijke taal informatie verschaft over de
      rechten en plichten die verbonden zijn aan de verblijfsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.122
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.122.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de wijze waarop de informatie,
      bedoeld in het eerste lid, wordt verschaft.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.122
  - number: 4.1.1
    text: |-
      Grensbewaking als bedoeld in [artikel 46 van de Wet][ref1] wordt uitgeoefend met het oog op het Nederland in- en
      uitreizen van personen via een buitengrens.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel46
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '46'
  - number: 4.1.2
    text: |-
      Onder uitreizen wordt begrepen het zich aan boord begeven of bevinden van een schip of luchtvaartuig, dat voor de
      uitreis uit Nederland bestemd is.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.1
  - number: 4.2.1
    text: In het belang van de grensbewaking worden aan de buitengrenzen grensdoorlaatposten ingesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Bij ministeriële regeling worden de plaatsen aangewezen waar grensdoorlaatposten, al dan niet tijdelijk, zijn
      gevestigd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.2
  - number: 4.2.3
    text: |-
      De grensdoorlaatposten worden bediend door ambtenaren van de Koninklijke marechaussee. De in de politieregio
      Rotterdam-Rijnmond gelegen grensdoorlaatposten worden eveneens bediend door de ambtenaren van het regionale
      politiekorps Rotterdam-Rijnmond.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.2
  - number: 4.2.4
    text: Bij ministeriële regeling worden de tijden vastgesteld gedurende welke de grensdoorlaatposten zijn opengesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.2
  - number: '4.4'
    text: Benelux-onderdanen behoeven Nederland niet in- of uit te reizen via een grensdoorlaatpost.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.4
  - number: 4.5.1
    text: 'De vreemdeling die Nederland inreist, is verplicht desgevorderd aan een ambtenaar, belast met de grensbewaking:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.5
  - number: 4.5.1.a
    text: |-
      het in zijn bezit zijnde document voor grensoverschrijding, de benodigde machtiging tot voorlopig verblijf dan wel
      het benodigde reisvisum of doorreisvisum te tonen en te overhandigen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.5
  - number: 4.5.1.b
    text: inlichtingen te verstrekken over het doel en de duur van zijn voorgenomen verblijf in Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.5
  - number: 4.5.1.c
    text: aan te tonen over welke middelen hij met het oog op de toegang tot Nederland beschikt of kan beschikken.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.5
  - number: 4.5.2
    text: |-
      Het eerste lid, onder a, is van overeenkomstige toepassing op de vreemdeling die Nederland uitreist via een
      buitengrens.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.5
  - number: 4.5.3
    text: |-
      Het eerste lid, onder b en c, is niet van toepassing op de vreemdeling die rechtmatig verblijf
      heeft als bedoeld in [artikel 8, onder e, dan wel l, van de Wet][ref1], het familielid, bedoeld in
      [artikel 8.7, tweede en derde lid][ref2], en de vreemdeling, bedoeld in [artikel 8.7, vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: '4.6'
    text: |-
      Een ieder die zich op of nabij een plaats bevindt waar een grensdoorlaatpost is gevestigd, houdt zich aan de aldaar
      door de ambtenaren, belast met de grensbewaking, in het kader van de uitoefening van hun taak gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      De Nederlander die Nederland in- of uitreist, toont en overhandigt, desgevorderd, aan een ambtenaar, belast met
      de grensbewaking, het in zijn bezit zijnde reis- of identiteitspapier of maakt zo nodig op andere wijze zijn
      Nederlanderschap aannemelijk.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.7
  - number: '4.8'
    text: |-
      De bestuurder van een voertuig geeft eigener beweging aan een ambtenaar, belast met de grensbewaking, kennis van
      de aanwezigheid in zijn voertuig van vreemdelingen ten aanzien van wie hij weet of redelijkerwijs kan vermoeden dat
      zij niet voldoen aan de bij de Schengengrenscode of de bij of krachtens de [Wet][ref1] vastgestelde verplichtingen
      waaraan personen bij grensoverschrijding zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: '4.9'
    text: |-
      De gezagvoerder van een schip verleent, desgevorderd, de medewerking aan een ambtenaar, belast met de
      grensbewaking, welke nodig is om deze ambtenaar in staat te stellen de door hem op grond van de Schengengrenscode
      uit te oefenen grenscontrole uit te voeren. Deze medewerking bestaat uit:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.9
  - number: 4.9.a
    text: |-
      het op een daartoe gegeven teken zodanig vaart verminderen en het zodanig op of bijdraaien van zijn schip, dat een
      dienstvaartuig behoorlijk langszij kan komen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.9
  - number: 4.9.b
    text: het toelaten van ambtenaren, belast met de grensbewaking, aan boord van zijn schip;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.9
  - number: 4.9.c
    text: het op vordering van een ambtenaar, belast met de grensbewaking, tot stilstand brengen of aanleggen van zijn schip.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.9
  - number: '4.10'
    text: |-
      [Artikel 4.8][ref1] is van overeenkomstige toepassing op gezagvoerders van andere schepen dan zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 4.11.1
    text: |-
      De op grond van bijlage VI, onder 3.1.2, van de Schengengrenscode te verstrekken bemanningslijst en
      passagierslijst, worden bij het binnenvaren van Nederland onmiddellijk verstrekt aan de ambtenaar belast met de
      grensbewaking. Bij ministeriële regeling kunnen modellen worden vastgesteld van de in bijlage VI, onder 3.1.2, van
      de Schengengrenscode bedoelde bemanningslijst en passagierslijst.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.11
  - number: 4.11.2
    text: |-
      De in bijlage VI, onder 3.1.2, van de Schengengrenscode bedoelde grensdoorlaatposten waar de kopie van de
      bemanningslijst of, in voorkomend geval, de passagierslijst kan worden afgegeven, zijn:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.11
  - number: 4.11.2.a
    text: de grensdoorlaatpost ter plaatse waar het schip voor het eerst ligplaats neemt;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.11
  - number: 4.11.2.b
    text: |-
      voor schepen die bestemd zijn om rechtstreeks ligplaats te nemen in een gemeente, waar geen grensdoorlaatpost is
      gevestigd:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.11
  - number: 4.11.2.b.1°
    text: |-
      één van de doorlaatposten Hoek van Holland-haven, Rotterdam-havens (ambulant), Dordrecht-haven of Moerdijk, indien
      Nederland over de Nieuwe Waterweg wordt binnengevaren;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.11
  - number: 4.11.2.b.2°
    text: |-
      de Beneluxdoorlaatpost Gent-Terneuzen (ambulant), indien de kanaalzone Gent-Terneuzen wordt bevaren en het schepen
      betreft die niet, of anders dan rechtstreeks, uit open zee naar België varen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.11
  - number: 4.11.2.b.3°
    text: |-
      de eerste grensdoorlaatpost na binnenkomst, gelegen aan de waterweg waardoor het schip vaart, in alle overige
      gevallen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.11
  - number: '4.12'
    text: |-
      De in bijlage VI, onder 3.1.4, van de Schengengrenscode bedoelde bevoegde autoriteit aan wie onverwijld alle
      wijzigingen met betrekking tot de samenstelling van de bemanning of de passagiers wordt doorgegeven, is het
      hoofd van de grensdoorlaatpost in de gemeente waar het schip zich bevindt of, indien in die gemeente geen
      grensdoorlaatpost is gevestigd, aan het hoofd van de grensdoorlaatpost via welke hij Nederland is binnengekomen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.12
  - number: 4.13.1
    text: |-
      De in bijlage VI, onder 3.1.5, van de Schengengrenscode bedoelde kennisgeving van afvaart wordt gedaan aan het
      hoofd van de grensdoorlaatpost waarlangs hij zal vertrekken. Indien in de gemeente waar het schip ligplaats heeft
      geen grensdoorlaatpost is gevestigd, wordt de kennisgeving gedaan aan het hoofd van de grensdoorlaatpost waaraan de
      bemanningslijst overeenkomstig [artikel 4.11, tweede lid][ref1], is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: 4.13.2
    text: 'De in bijlage VI, onder 3.1.5, van de Schengengrenscode bedoelde kennisgeving wordt gedaan:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.13
  - number: 4.13.2.a
    text: ten hoogste zes en ten minste drie uur vóór het daadwerkelijke vertrek van het schip;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.13
  - number: 4.13.2.b
    text: |-
      indien het schip zich korter dan drie uur bevindt op de plaats waar de kennisgeving moet geschieden, op een zodanig
      tijdstip dat de met de bediening van de grensdoorlaatpost belaste ambtenaar in staat is de door hem uit te oefenen
      personencontrole uit te voeren.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.13
  - number: '4.14'
    text: |-
      De [artikelen 4.11 tot en met 4.13][ref1], gelden niet voor gezagvoerders van zeeschepen die, zonder ligplaats in
      een Nederlandse haven te nemen, door de Nederlandse territoriale zee varen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: 4.15.1
    text: |-
      De gezagvoerder van een vliegtuig verstrekt in tweevoud aan een ambtenaar, belast met de grensbewaking, de in
      bijlage VI, onder 2.3.1, van de Schengengrenscode bedoelde algemene verklaring en de in bijlage VII, onder 2.1, van
      de Schengengrenscode bedoelde gegevens over de bemanning.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.15
  - number: 4.15.2
    text: Bij ministeriële regeling wordt het model van de bemannings- en passagierslijst aangewezen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.15
  - number: '4.16'
    text: |-
      De vordering aan de gezagvoerder van een luchtvaartuig, bedoeld in [artikel 51, derde lid, van de Wet][ref1], wordt
      gedaan door tussenkomst van de luchtverkeersleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel51
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '51'
  - number: 4.17.1
    text: 'De korpschef verstrekt periodiek ten minste de volgende gegevens aan Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.17
  - number: 4.17.1.a
    text: gegevens over de wijze van behandeling van aanvragen betreffende een verblijfsvergunning;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.17
  - number: 4.17.1.b
    text: gegevens over het aantal en soort van de verleende verblijfsvergunningen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.17
  - number: 4.17.1.c
    text: gegevens over de uitzetting van vreemdelingen, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.17
  - number: 4.17.1.d
    text: gegevens over de uitvoering van het toezicht op vreemdelingen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.17
  - number: 4.17.2
    text: |-
      De bevelhebber van de Koninklijke marechaussee en, voorzover van toepassing, de korpschef van het regionale
      politiekorps Rotterdam-Rijnmond verstrekken periodiek ten minste de volgende inlichtingen aan Onze Minister:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.17
  - number: 4.17.2.a
    text: gegevens over de toegangsweigering;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.17
  - number: 4.17.2.b
    text: gegevens over de controle op de zorgplicht van vervoerders;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.17
  - number: 4.17.2.c
    text: gegevens over de uitzetting van vreemdelingen, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.17
  - number: 4.17.2.d
    text: gegevens over de uitvoering van het toezicht op vreemdelingen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.17
  - number: 4.18.1
    text: |-
      Aan de vreemdeling die met toepassing van [artikel 50, tweede of derde lid, van de Wet][ref1] is overgebracht naar
      een plaats, bestemd voor verhoor, wordt tijdig mededeling gedaan van de hem toekomende bevoegdheid zich bij het
      verhoor te doen bijstaan door een raadsman.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '50'
  - number: 4.18.2
    text: |-
      De in het eerste lid bedoelde vreemdeling wordt niet verder beperkt in de uitoefening van grondrechten, dan
      wordt gevorderd door het doel van de maatregel en de handhaving van de orde en de veiligheid op de plaats van
      tenuitvoerlegging.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.18
  - number: 4.19.1
    text: |-
      Een beslissing van de bevelhebber van de Koninklijke marechaussee of de korpschef, genomen krachtens
      [artikel 50, vierde lid, van de Wet][ref1], wordt ten uitvoer gelegd in een cel van de Koninklijke marechaussee
      respectievelijk op een politiebureau. De Regeling politiecellencomplex is van overeenkomstige toepassing op de
      tenuitvoerlegging van de beslissing in een cel van de Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '50'
  - number: 4.19.2
    text: |-
      De [artikelen 5.3][ref1] en [5.5][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '4.20'
    text: |-
      Indien de bevelhebber van de Koninklijke marechaussee of de korpschef zijn bevoegdheid, bedoeld in
      [artikel 50, vierde lid, van de Wet][ref1] mandateert doet hij dat niet dan aan een ambtenaar, belast met het
      toezicht op vreemdelingen, die tevens hulpofficier van justitie is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '50'
  - number: 4.21.1
    text: |-
      Als documenten in de zin van [artikel 50, eerste lid, laatste volzin, van de Wet][ref1], worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '50'
  - number: 4.21.1.a
    text: |-
      voor vreemdelingen die rechtmatig verblijven als bedoeld in [artikel 8, onder a tot en met d, van de Wet][ref1]:
      een vanwege de bevoegde autoriteiten verstrekt document waaruit zulks blijkt en waarvan het model is vastgesteld
      bij ministeriële regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.21.1.b
    text: |-
      voor vreemdelingen die rechtmatig verblijven als bedoeld in [artikel 8 onder e, van de Wet][ref1]: een geldig
      nationaal paspoort of geldige identiteitskaart, indien zij de nationaliteit van een staat bezitten als bedoeld in
      [artikel 8.7, eerste lid][ref2], of, indien zij een zodanige nationaliteit niet bezitten:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 4.21.1.b.1°
    text: |-
      een geldig nationaal paspoort met een voor inreis benodigd visum, indien na inreis nog geen drie maanden zijn
      verstreken;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.21
  - number: 4.21.1.b.2°
    text: |-
      een geldig nationaal paspoort met een stempel van de inreis, indien voor inreis geen visum benodigd is en na inreis
      nog geen drie maanden zijn verstreken;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.21
  - number: 4.21.1.b.3°
    text: |-
      een geldig nationaal paspoort met een door de bevoegde autoriteiten afgegeven verklaring als bedoeld in
      [artikel 8.13, vierde lid][ref1], indien na afgifte van de verklaring nog geen zes maanden zijn verstreken; of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 4.21.1.b.4°
    text: |-
      een door de bevoegde autoriteiten afgegeven verblijfsdocument als bedoeld in [artikel 8.13, vijfde lid][ref1], dan
      wel [artikel 8.20, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 4.21.1.c
    text: |-
      voor vreemdelingen die een aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28 van de Wet][ref1], hebben ingediend: een vanwege de bevoegde autoriteiten verstrekt document waaruit
      zulks blijkt en waarvan het model wordt vastgesteld bij ministeriële regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 4.21.1.d
    text: |-
      voor vreemdelingen, anders dan bedoeld onder c, die rechtmatig verblijf in de zin van
      [artikel 8, onder f, g, h, j, of k, van de Wet][ref1] hebben en die niet beschikken over een ingevolge
      [de Wet][ref2] vereist geldig document voor grensoverschrijding: een vanwege de bevoegde autoriteiten verstrekt
      document, waarvan het model wordt vastgesteld bij ministeriële regeling, dat is voorzien van een inlegvel als
      bedoeld in [artikel 4.29, derde lid][ref3], waarop de verblijfsrechtelijke positie is aangetekend;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.21.1.e
    text: |-
      voor andere vreemdelingen: een ingevolge de Wet voor het hebben van toegang tot Nederland vereist geldig document
      voor grensoverschrijding dan wel een document voor grensoverschrijding waarin het benodigde visum is aangetekend of
      waarin een aantekening omtrent de verblijfsrechtelijke positie is geplaatst.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.21
  - number: 4.21.2
    text: |-
      Geen document, anders dan bedoeld in het eerste lid, onder a of b, wordt verstrekt aan kinderen beneden de leeftijd
      van twaalf jaar, tenzij zij er naar het oordeel van Onze Minister een redelijk belang bij hebben in het bezit van
      zulk een document te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.21
  - number: 4.21.3
    text: |-
      Op het ingevolge het eerste lid, onder a tot en met d, afgegeven document wordt aangetekend of het de vreemdeling
      toegestaan is arbeid te verrichten en of voor deze arbeid ingevolge de [Wet arbeid vreemdelingen][ref1] een
      tewerkstellingsvergunning is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 4.21.4
    text: |-
      Indien aan het verblijf in Nederland van de in het eerste lid, onder a en b, bedoelde vreemdelingen een beperking
      als bedoeld in [artikel 3.4, vierde lid][ref1], is verbonden, wordt op het document de aantekening «beroep op de
      publieke middelen kan gevolgen hebben voor verblijfsrecht» gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 4.22.1
    text: |-
      De documenten, bedoeld in [artikel 4.21, eerste lid, onder a tot en met d][ref1], worden door Onze Minister
      vervangen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.22.1.a
    text: |-
      de vreemdeling aan wie het document werd afgegeven, overeenkomstig [artikel 4.44][ref1] aangifte heeft gedaan van
      vermissing, verlies of het voor identificatie ondeugdelijk worden van dat document, en


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '3'
  - number: 4.22.1.b
    text: |-
      Onze Minister heeft vastgesteld dat er gegronde redenen zijn om te veronderstellen dat de aangifte naar waarheid
      is gedaan.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.22
  - number: 4.22.2
    text: |-
      Onverminderd het eerste lid worden de documenten, bedoeld in [artikel 4.21, eerste lid, onder a][ref1], telkens
      vijf jaren na de afgifte ervan, vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.23.1
    text: |-
      De ambtenaren belast met de grensbewaking of de ambtenaren belast met het toezicht op vreemdelingen, nemen op
      grond van [artikel 52, eerste lid, van de Wet][ref1] het reis- of identiteitspapier van een persoon tijdelijk in
      bewaring:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel52
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '52'
  - number: 4.23.1.a
    text: |-
      voorzover zulks nodig is voor het verkrijgen van de gegevens, bedoeld in [artikel 4.45][ref1], of voor het stellen
      van een aantekening als bedoeld in [artikel 4.24 tot en met artikel 4.35][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.23.1.b
    text: |-
      indien de persoon ter vaststelling van zijn identiteit is staande gehouden en niet aanstonds blijkt dat
      het hem is toegestaan in Nederland te verblijven, terwijl de gelegenheid ontbreekt hem, met toepassing van
      [artikel 50, tweede of derde lid, van de Wet][ref1] naar een plaats, bestemd voor verhoor, over te brengen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '50'
  - number: 4.23.1.c
    text: gedurende de tijd dat de persoon rechtens zijn vrijheid is ontnomen, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.23
  - number: 4.23.1.d
    text: |-
      voorzover zulks nodig is met het oog op de uitzetting of de overgave aan de buitenlandse grensautoriteiten als
      bedoeld in [artikel 52, tweede lid, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel52
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '52'
  - number: 4.23.2
    text: |-
      In het geval, bedoeld in het eerste lid, onder b, wordt het reis- of identiteitspapier aan de persoon teruggegeven,
      indien hij aan de korpschef of de bevelhebber van de Koninklijke marechaussee de gegevens heeft verstrekt die
      deze in het belang van de toepassing van de Wet vraagt, tenzij er uit anderen hoofde gronden aanwezig zijn om het
      document in bewaring te houden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.23
  - number: 4.24.1
    text: |-
      Naast het plaatsen van de in artikel 10 en bijlage IV van de Schengengrenscode bedoelde inreis- en uitreisstempel,
      kunnen ambtenaren belast met de grensbewaking, op grond van [artikel 52, eerste lid, van de Wet][ref1], in het
      reis- of identiteitspapier van de vreemdeling aantekeningen stellen omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel52
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '52'
  - number: 4.24.1.a
    text: inreis in Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.24
  - number: 4.24.1.b
    text: het doel en de duur van het voorgenomen verblijf in Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.24
  - number: 4.24.1.c
    text: de middelen waarover de vreemdeling met het oog op de toegang tot Nederland beschikt of kan beschikken;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.24
  - number: 4.24.1.d
    text: aanmelding bij een korpschef;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.24
  - number: 4.24.1.e
    text: |-
      de toepassing van [artikel 2.4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 4.24.1.f
    text: het weigeren van toegang tot Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.24
  - number: 4.24.1.g
    text: vertrek of uitzetting uit Nederland, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.24
  - number: 4.24.1.h
    text: uitreis uit Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.24
  - number: 4.24.2
    text: |-
      Elke doorhaling of vervallenverklaring van een in een reis- of identiteitspapier van een vreemdeling gestelde
      aantekening, wordt door de ambtenaar die de doorhaling of vervallenverklaring verricht, gedateerd en van diens
      paraaf voorzien.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.24
  - number: 4.25.1
    text: |-
      De ambtenaren belast met de grensbewaking, stellen in het reis- of identiteitspapier van de vreemdeling die
      toegang tot Nederland heeft en die Nederland langs een doorlaatpost in- of uitreist een aantekening als bedoeld in
      [artikel 4.24, eerste lid, onder a en h][ref1], waaruit blijkt langs welke doorlaatpost en op welke datum de in- of
      uitreis heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.25.2
    text: |-
      Bij de aantekening, welke ingevolge het eerste lid wordt gesteld in het reis- of identiteitspapier van een
      vreemdeling die Nederland inreist, wordt vermeld het aantal in gezelschap van de houder van dat document reizende
      vreemdelingen dat daarin is opgenomen of staat bijgeschreven. Bij inreis in Nederland van een vreemdeling, reizende
      in groepsverband op een collectief paspoort of op een collectieve lijst, worden de namen van de in het document
      opgenomen vreemdelingen die zich niet bij het gezelschap bevinden of aan wie de toegang tot Nederland wordt
      geweigerd, door de ambtenaar, belast met de grensbewaking, doorgehaald.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.25
  - number: '4.26'
    text: |-
      De ambtenaren belast met de grensbewaking, stellen in het reis- of identiteitspapier van een vreemdeling een
      aantekening als bedoeld in [artikel 4.24, eerste lid, onder d][ref1], inhoudende dat de vreemdeling zich binnen
      drie dagen bij de korpschef, onder vermelding van de plaats, moet melden, indien daartoe naar het oordeel van de
      ambtenaar belast met de grensbewaking in het belang van het toezicht op vreemdelingen gegronde reden bestaat. Deze
      aantekening kan ook geplaatst worden in een bijzonder doorlaatbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.26
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.27.1
    text: |-
      De ambtenaren belast met de grensbewaking, stellen in het reis- of identiteitspapier van een vreemdeling een
      aantekening als bedoeld in [artikel 4.24, eerste lid, onder f][ref1], indien zij vermoeden dat de vreemdeling
      andermaal zal trachten Nederland in te reizen zonder te voldoen aan de vereisten voor toegang, bedoeld in artikel 5
      van de Schengengrenscode of [artikel 3 van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.27
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '3'
  - number: 4.27.2
    text: |-
      Uit de aantekening, bedoeld in het eerste lid, blijkt dat de toegang is geweigerd, met vermelding van de datum en
      zo nodig de grond waarop deze weigering berust.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.27
  - number: 4.28.1
    text: |-
      De ambtenaren belast met de grensbewaking, stellen in het reis- of identiteitspapier van een vreemdeling een
      aantekening als bedoeld in [artikel 4.24, eerste lid, onder g][ref1], indien zij vermoeden dat de vreemdeling zal
      trachten zich andermaal naar Nederland te begeven zonder te voldoen aan de vereisten voor toegang tot Nederland.
      Een zodanige aantekening wordt niet gesteld indien het vertrek, de uitzetting of de doorreis van de vreemdeling
      door of diens toegang tot een derde land daardoor wordt bemoeilijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.28
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.28.2
    text: |-
      Uit de aantekening, bedoeld in het eerste lid, blijkt het vertrek of de uitzetting van de vreemdeling, met
      vermelding van de datum en zo nodig de reden van het vertrek of de uitzetting.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.28
  - number: 4.29.1
    text: |-
      De ambtenaren belast met het toezicht op vreemdelingen, stellen in het reis- en identiteitspapier van een
      vreemdeling aantekeningen omtrent:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
  - number: 4.29.1.a
    text: aanmelding of vervoeging bij een korpschef;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
  - number: 4.29.1.b
    text: de woon- of verblijfplaats binnen Nederland en vertrek naar het buitenland;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
  - number: 4.29.1.c
    text: het verlenen, het verlengen van de geldigheidsduur of het intrekken van een verblijfsvergunning voor bepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
  - number: 4.29.1.d
    text: het verlenen of het intrekken van een verblijfsvergunning voor onbepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
  - number: 4.29.1.e
    text: |-
      het opleggen van een individuele verplichting tot periodieke aanmelding overeenkomstig
      [artikel 54, tweede lid, van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
  - number: 4.29.1.f
    text: |-
      het beperken van de vrijheid van beweging overeenkomstig [artikel 56 van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel56
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '56'
  - number: 4.29.1.g
    text: vertrek of uitzetting uit Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
  - number: 4.29.1.h
    text: ongewenstverklaring, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
  - number: 4.29.1.i
    text: de datum en plaats van inreis in Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
  - number: 4.29.2
    text: |-
      Elke doorhaling of vervallenverklaring van een in het reis- of identiteitspapier van een vreemdeling gestelde
      aantekening wordt door de ambtenaar die de doorhaling of vervallenverklaring verricht, gedateerd en van diens
      paraaf voorzien.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
  - number: 4.29.3
    text: |-
      In afwijking van het eerste lid, wordt een aantekening op een aan de vreemdeling te verstrekken afzonderlijk
      inlegblad gesteld, indien:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
  - number: 4.29.3.a
    text: het reis- of identiteitspapier van de vreemdeling zich niet voor het stellen van een zodanige aantekening leent;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
  - number: 4.29.3.b
    text: de vreemdeling houder is van een buitenlands vreemdelingen- of vluchtelingenpaspoort;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
  - number: 4.29.3.c
    text: |-
      de vreemdeling in Nederland rechtmatig verblijft als bedoeld in [artikel 8, onder f, van de Wet][ref1]
      indien de vreemdeling een aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 14][ref2]
      of [20 van de Wet][ref3] heeft ingediend en, naar het oordeel van de korpschef, termen aanwezig zijn de aanvraag af
      te wijzen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 4.29.3.d
    text: de vreemdeling geen geldig document voor grensoverschrijding heeft, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
  - number: 4.29.3.e
    text: |-
      de vreemdeling houder is van een document als bedoeld in [artikel 4.21, eerste lid, onder a, b, c of d][ref1], en
      niet in het bezit is van een geldig document voor grensoverschrijding.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.29
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.30.1
    text: |-
      De aantekeningen, bedoeld in [artikel 4.29, eerste lid, onder a][ref1], hebben betrekking op de aanmelding
      ingevolge de [artikelen 4.47 tot en met 4.51][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '3'
  - number: 4.30.2
    text: Uit de aantekening blijkt de datum van aanmelding.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.30
  - number: 4.30.3
    text: |-
      Uit de aantekening blijkt of het de vreemdeling is toegestaan arbeid te verrichten en of voor deze arbeid ingevolge
      de [Wet arbeid vreemdelingen][ref1] een tewerkstellingsvergunning vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 4.30.4
    text: |-
      Indien het betreft een vreemdeling die naar Nederland is gekomen om als zeeman werk te zoeken aan boord van een
      zeeschip kan de aantekening worden aangevuld met een zinsnede waaruit zulks blijkt en wordt een uiterlijke datum
      van verblijf opgenomen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.30
  - number: 4.31.1
    text: |-
      De aantekening, bedoeld in [artikel 4.29, eerste lid, onder g][ref1], wordt gesteld indien op grond van
      [artikel 3.1][ref2] uitzetting van de vreemdeling achterwege blijft. De datum waarop de aanvraag is ontvangen wordt
      eveneens aangetekend. Indien de aanvraag wordt afgewezen, wordt «vervallen» aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.31
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 4.31.2
    text: |-
      Uit de aantekening blijkt of het de vreemdeling is toegestaan arbeid te verrichten en of voor deze arbeid ingevolge
      de [Wet arbeid vreemdelingen][ref1] een tewerkstellingsvergunning vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.31
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 4.32.1
    text: |-
      Uit de aantekening, bedoeld in [artikel 4.29, eerste lid, onder b][ref1], blijkt op welke datum de vreemdeling is
      veranderd van woon- of verblijfplaats binnen Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.32
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.32.2
    text: |-
      De aantekening, bedoeld in het eerste lid, wordt door de korpschef van het regionale politiekorps waarin de nieuwe
      woon- of verblijfplaats is gelegen, gesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.32
  - number: 4.33.1
    text: |-
      Uit de aantekening, bedoeld in [artikel 4.29, eerste lid, onder e][ref1], blijkt de verplichte periode van
      aanmelding overeenkomstig [artikel 54, tweede lid, van de Wet][ref2] alsmede eventuele verdere bijzonderheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.33
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '54'
  - number: 4.33.2
    text: |-
      Nadat de vreemdeling voor de eerste maal heeft voldaan aan de verplichting tot periodieke aanmelding
      ingevolge [artikel 4.51][ref1], kunnen de daarop volgende aanmeldingen worden aangetekend door in het reis- of
      identiteitspapier de datum van de aanmelding te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.33
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
        afdeling: '3'
  - number: 4.33.3
    text: |-
      Uit de aantekening, bedoeld in het eerste en tweede lid, blijkt of het de vreemdeling is toegestaan arbeid te
      verrichten en of voor deze arbeid ingevolge de [Wet arbeid vreemdelingen][ref1] een tewerkstellingsvergunning
      vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.33
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 4.34.1
    text: |-
      De aantekeningen, bedoeld in [artikel 4.29, eerste lid, onder g][ref1], betreffen:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.34
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.34.1.a
    text: |-
      een aantekening waaruit de uiterlijke datum van vertrek blijkt, indien aan de vreemdeling overeenkomstig
      [artikel 62 van de Wet][ref1] een termijn is gegund waarbinnen hij Nederland uit eigen beweging dient te verlaten;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.34
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
  - number: 4.34.1.b
    text: |-
      een aantekening waaruit blijkt tot welke datum uitzetting van de vreemdeling achterwege blijft ingevolge
      [artikel 64 van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.34
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '64'
  - number: 4.34.1.c
    text: |-
      een aantekening waaruit de datum van indienen van een bezwaarschrift blijkt, indien de uitzetting achterwege blijft
      hangende een beslissing op een door de vreemdeling ingediend bezwaar, eventueel met doorhaling van de aantekening,
      bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.34
  - number: 4.34.1.d
    text: |-
      een aantekening omtrent uitzetting, indien naar het oordeel van de korpschef of de bevelhebber van de Koninklijke
      marechaussee gegronde reden bestaat om te vermoeden dat de vreemdeling zal trachten naar Nederland terug te keren
      zonder te voldoen aan de vereisten voor toegang tot Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.34
  - number: 4.34.2
    text: Bij een aantekening als bedoeld in het eerste lid, onder b, wordt tevens gesteld dat arbeid niet is toegestaan.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.34
  - number: 4.34.3
    text: |-
      De aantekening, bedoeld in het eerste lid, onder d, wordt niet gesteld, indien het vertrek, de uitzetting of de
      doorreis van de vreemdeling door, of diens toelating tot een derde land daardoor wordt bemoeilijkt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.34
  - number: 4.35.1
    text: |-
      De aantekening, bedoeld in [artikel 4.29, eerste lid, onder h][ref1], wordt geplaatst, indien de korpschef of
      de bevelhebber van de Koninklijke marechaussee vermoedt dat de vreemdeling zal trachten naar Nederland terug te
      keren zonder te voldoen aan de vereisten voor toegang tot Nederland. De aantekening wordt niet gesteld indien het
      vertrek, de uitzetting of de doorreis van de vreemdeling door, of diens toelating tot een derde land daardoor wordt
      bemoeilijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.35
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.35.2
    text: Uit de aantekening blijkt de datum waarop de vreemdeling ongewenst is verklaard.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.35
  - number: '4.36'
    text: Bij ministeriële regeling kunnen modellen van de aantekeningen, bedoeld in deze afdeling, worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.36
  - number: 4.37.1
    text: |-
      De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder a tot en met h, van de Wet][ref1], is
      verplicht om in geval van:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.37
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.37.1.a
    text: |-
      verandering van adres binnen de gemeente waar de vreemdeling woont of verblijft, hiervan binnen vijf dagen kennis
      te geven aan de korpschef van het regionale politiekorps waarin de gemeente is gelegen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.37
  - number: 4.37.1.b
    text: |-
      verandering van woon- of verblijfplaats binnen Nederland, zo mogelijk onder opgave van het nieuwe adres, hiervan
      vóór het vertrek kennis te geven aan de korpschef van het regionale politiekorps waarin de gemeente is gelegen van
      waaruit de vreemdeling vertrekt;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.37
  - number: 4.37.1.c
    text: |-
      verandering van woon- of verblijfplaats binnen Nederland, onder opgave van het nieuwe adres, hiervan binnen
      vijf dagen na aankomst in de nieuwe woon- of verblijfplaats in persoon kennis te geven aan de korpschef van het
      regionale politiekorps waarin de nieuwe woon- of verblijfsplaats is gelegen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.37
  - number: 4.37.1.d
    text: |-
      vertrek naar het buitenland, zo mogelijk onder opgave van het nieuwe adres, hiervan vóór het vertrek kennis
      te geven aan de korpschef van het regionale politiekorps waarin de gemeente waaruit de vreemdeling vertrekt is
      gelegen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.37
  - number: 4.37.2
    text: |-
      De in het eerste lid, onder a en c, bedoelde kennisgeving blijft achterwege indien de vreemdeling als ingezetene is
      ingeschreven in de gemeentelijke basisadministratie persoonsgegevens van de nieuwe woonplaats.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.37
  - number: 4.37.3
    text: |-
      De vreemdeling die niet rechtmatig verblijft als bedoeld in [artikel 8, onder a tot en met h, van de Wet][ref1],
      geeft kennis van verandering van woon- of verblijfplaats binnen Nederland als bedoeld in het eerste lid, onder b,
      indien Onze Minister dat vordert.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.37
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.37.4
    text: |-
      De in het eerste en derde lid omschreven verplichtingen rusten ten aanzien van kinderen beneden de leeftijd van
      twaalf jaar op de wettelijke vertegenwoordiger. Voor kinderen van twaalf jaar en ouder kan aan deze verplichtingen
      ook worden voldaan door de wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.37
  - number: 4.37.5
    text: |-
      De in het eerste en derde lid omschreven verplichtingen rusten niet op de onderdaan van een staat die partij is bij
      het Verdrag tot oprichting van de Europese Gemeenschap, de Overeenkomst betreffende de Europese Economische Ruimte
      of de onderdaan van Zwitserland met verblijfsrecht van maximaal drie maanden als bedoeld in [artikel 8.11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.37
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 4.37.6
    text: |-
      Van vertrek naar het buitenland wordt geen kennis gegeven door de vreemdeling die rechtmatig verblijft als bedoeld
      in [artikel 8, onder a tot en met e, van de Wet][ref1], indien de vreemdeling zijn hoofdverblijf niet naar het
      buitenland verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.37
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.38.1
    text: |-
      De vreemdeling verstrekt op vordering van Onze Minister de gegevens, bedoeld in de
      [artikelen 4.39 tot en met 4.44][ref1], binnen de in de vordering aangegeven tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.38
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '3'
  - number: 4.38.2
    text: |-
      Indien daartoe in het belang van het toezicht op vreemdelingen gegronde reden bestaat kan de in het voorgaande lid
      bedoelde vordering inhouden dat de vreemdeling de gegevens in persoon verstrekt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.38
  - number: 4.38.3
    text: |-
      In het belang van de vreemdelingenregistratie kan een vordering als bedoeld in het eerste lid bij algemene
      bekendmaking worden gedaan.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.38
  - number: 4.38.4
    text: |-
      Indien de vreemdeling jonger is dan twaalf jaar, dan kan de vordering, bedoeld in het eerste tot en met derde lid,
      worden gericht tot de wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.38
  - number: '4.39'
    text: |-
      De vreemdeling die geen rechtmatig verblijf heeft, doet onmiddellijk van zijn aanwezigheid in persoon mededeling
      aan de korpschef van het regionale politiekorps waarin de gemeente waar hij verblijft is gelegen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.39
  - number: '4.40'
    text: |-
      Personen die nachtverblijf verschaffen aan een vreemdeling, van wie zij weten of redelijkerwijs kunnen vermoeden
      dat deze vreemdeling niet rechtmatig in Nederland verblijft als bedoeld in [artikel 8 van de Wet][ref1], doen
      daarvan onmiddellijk mededeling aan de korpschef van het regionale politiekorps waarin de gemeente waar de
      vreemdeling verblijft is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.40
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '4.41'
    text: |-
      Werkgevers, van wie bij Onze Minister bekend is dat zij een vreemdeling in dienst hebben gehad die niet rechtmatig
      verbleef of aan wie het niet was toegestaan arbeid te verrichten, verstrekken aan Onze Minister, op diens
      vordering, onmiddellijk de gegevens omtrent de vreemdeling die bij hen tewerkgesteld wordt, in dienst is of in
      dienst is geweest. Onze Minister kan een termijn stellen waarbinnen de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.41
  - number: 4.42.1
    text: |-
      De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder i, van de Wet][ref1] en die arbeid gaat
      zoeken of arbeid gaat verrichten, deelt dit onmiddellijk mee aan de korpschef van het regionale politiekorps,
      waarin de gemeente waar de vreemdeling verblijft is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.42
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.42.2
    text: 'Het eerste lid is niet van toepassing op de vreemdeling die:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.42
  - number: 4.42.2.a
    text: |-
      houder is van een geldige machtiging tot voorlopig verblijf afgegeven voor een verblijfsdoel waarbij het verrichten
      van arbeid is toegestaan;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.42
  - number: 4.42.2.b
    text: |-
      kan aantonen dat hij naar Nederland is gekomen voor het verrichten van arbeid gedurende ten hoogste drie maanden,
      te rekenen vanaf het tijdstip van zijn binnenkomst, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.42
  - number: 4.42.2.c
    text: naar Nederland is gekomen om aan te monsteren of als zeeman werk te zoeken aan boord van een zeeschip.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.42
  - number: 4.42.3
    text: |-
      Het tweede lid is niet van toepassing indien de arbeid geheel of gedeeltelijk bestaat uit het verrichten van
      seksuele handelingen met derden of het verlenen van seksuele diensten aan derden, tenzij de vreemdeling onderdaan
      is van een staat die partij is bij het Verdrag tot oprichting van de Europese Gemeenschap of de Overeenkomst
      betreffende de Europese Economische Ruimte of onderdaan is van Zwitserland.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.42
  - number: '4.43'
    text: |-
      De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder a, van de Wet][ref1] en die niet langer
      voldoet aan de beperking waaronder de verblijfsvergunning is verleend, deelt dit onmiddellijk mee aan de korpschef
      van het regionale politiekorps waarin de gemeente waar de vreemdeling verblijft is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.43
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '4.44'
    text: |-
      De vreemdeling die rechtmatig verblijft als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1] en wiens document, bedoeld in
      [artikel 9 van de Wet][ref2], waaruit het rechtmatig verblijf blijkt, vermist wordt, verloren is gegaan of
      ondeugdelijk is geworden voor identificatie, doet daarvan onmiddellijk in persoon aangifte bij de korpschef van het
      regionale politiekorps waarin de gemeente waar hij woon- of verblijfplaats heeft is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '9'
  - number: '4.45'
    text: |-
      De medewerking van de vreemdeling, bedoeld in [artikel 54, eerste lid, onderdeel c, van de Wet][ref1], bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
  - number: 4.45.a
    text: |-
      het op vordering van een ambtenaar belast met de grensbewaking of een ambtenaar belast met het toezicht op
      vreemdelingen, beschikbaar stellen van een goedgelijkende pasfoto, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.45
  - number: 4.45.b
    text: |-
      het zich laten fotograferen en het laten afnemen van vingerafdrukken, indien daartoe naar het oordeel van de
      ambtenaar, belast met de grensbewaking of een ambtenaar belast met het toezicht op vreemdelingen, gegronde reden
      bestaat.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.45
  - number: 4.46.1
    text: |-
      De vreemdeling die naar Nederland is gekomen voor een verblijf van langer dan drie maanden, werkt op grond van
      [artikel 54, eerste lid, onderdeel d, van de Wet][ref1] mee aan een onderzoek naar tuberculose.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
  - number: 4.46.2
    text: |-
      Het eerste lid geldt niet voor onderdanen van een staat die partij is bij de Europese Gemeenschap, onderdanen van
      een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, Australië, Canada, Israël,
      Japan, Monaco, Nieuw Zeeland, Suriname, de Verenigde Staten van Amerika en Zwitserland. Het eerste lid is evenmin
      van toepassing op familieleden als bedoeld in [artikel 8.7, tweede, derde en vierde lid][ref1], die voor hun
      komst naar Nederland reeds rechtmatig verblijf hebben verkregen in een andere staat die partij is bij het Verdrag
      tot oprichting van de Europese Gemeenschap of de Overeenkomst betreffende de Europese Economische Ruimte dan wel
      Zwitserland en die zich vanuit die staat dan wel Zwitserland naar Nederland verplaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 4.47.1
    text: |-
      De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder i, van de Wet][ref1] en die naar Nederland
      is gekomen voor een verblijf van langer dan drie maanden, meldt zich binnen drie dagen na binnenkomst in Nederland
      in persoon aan bij de korpschef van het regionale politiekorps waarin de gemeente is gelegen waar hij woon- of
      verblijfplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.47
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.47.2
    text: |-
      Voor de berekening van de in het eerste lid bedoelde termijn van drie maanden wordt eerder verblijf in Nederland
      binnen een tijdvak van zes maanden, onmiddellijk voorafgaande aan de binnenkomst, mede in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.47
  - number: 4.47.3
    text: Indien de vreemdeling jonger is dan twaalf jaar, doet degene bij wie de vreemdeling woont of verblijft de melding.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.47
  - number: 4.48.1
    text: |-
      De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder i, van de Wet][ref1] en die naar Nederland
      is gekomen voor een verblijf van ten hoogste drie maanden, meldt zich binnen drie dagen na binnenkomst in Nederland
      in persoon aan bij de korpschef van het regionale politiekorps waarin de gemeente is gelegen waar hij woon- of
      verblijfplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.48
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.48.2
    text: |-
      Een verplichting tot aanmelding krachtens het voorgaande lid rust ten aanzien van de vreemdeling beneden de
      leeftijd van twaalf jaar op degene bij wie de vreemdeling woont of verblijft.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.48
  - number: 4.48.3
    text: |-
      Het eerste lid is niet van toepassing op de vreemdeling die zijn intrek neemt in een hotel of in een inrichting,
      waarvan de eigenaar, houder of beheerder bij of krachtens gemeentelijke verordening verplicht is aan de daartoe
      aangewezen autoriteit kennis te geven van het verschaffen van nachtverblijf aan personen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.48
  - number: 4.49.1
    text: |-
      De vreemdeling die houder is van een visum of een document voor grensoverschrijding waarin door de daartoe bevoegde
      autoriteit een aantekening is gesteld omtrent aanmelding bij een vreemdelingendienst in Nederland, meldt zich
      binnen drie dagen na binnenkomst in Nederland in persoon aan bij de korpschef van het regionale politiekorps waarin
      de in deze aantekening vermelde gemeente is gelegen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.49
  - number: 4.49.2
    text: |-
      Het eerste lid is niet van toepassing op onderdanen van een staat die partij is bij het Verdrag tot oprichting
      van de Europese Gemeenschap of de Overeenkomst betreffende de Europese Economische Ruimte en op onderdanen van
      Zwitserland.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.49
  - number: 4.50.1
    text: |-
      De vreemdeling die naar Nederland is gekomen om als zeeman werk te zoeken aan boord van een zeeschip, meldt zich
      binnen drie dagen na binnenkomst in Nederland in persoon aan bij de korpschef van het regionale politiekorps waarin
      de gemeente waar hij werk zoekt is gelegen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.50
  - number: 4.50.2
    text: |-
      Het eerste lid is niet van toepassing op onderdanen van een staat die partij is bij het Verdrag tot oprichting
      van de Europese Gemeenschap of de Overeenkomst betreffende de Europese Economische Ruimte en op onderdanen van
      Zwitserland.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.50
  - number: 4.51.1
    text: |-
      Tot periodieke aanmelding als bedoeld in [artikel 54, eerste lid, onder f, van de Wet][ref1], bij de korpschef van
      het regionale politiekorps waarin de gemeente van verblijf is gelegen, is verplicht de vreemdeling die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.51
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
  - number: 4.51.1.a
    text: geen rechtmatig verblijf heeft en in afwachting is van de feitelijke mogelijkheid tot vertrek of uitzetting, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.51
  - number: 4.51.1.b
    text: |-
      rechtmatig verblijft als bedoeld in [artikel 8, onder f, g of h, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.51
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.51.2
    text: |-
      De vreemdeling, bedoeld in het eerste lid, meldt zich wekelijks, tenzij Onze Minister een andere termijn stelt, dan
      wel ontheffing verleent.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.51
  - number: 4.51.3
    text: Het eerste lid is niet van toepassing, indien de vreemdeling rechtens zijn vrijheid is ontnomen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.51
  - number: 4.51.4
    text: |-
      Het eerste lid is niet van toepassing op onderdanen van een staat die partij is bij het Verdrag tot oprichting
      van de Europese Gemeenschap of de Overeenkomst betreffende de Europese Economische Ruimte en op onderdanen van
      Zwitserland.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.51
  - number: 4.52.1
    text: |-
      De vreemdeling levert het document, bedoeld in [artikel 9 van de Wet][ref1], in ieder geval in persoon in bij de
      korpschef van het regionale politiekorps waarin de gemeente van verblijf is gelegen:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 4.52.1.a
    text: |-
      zodra hij niet meer rechtmatig verblijft, doch uiterlijk op het moment waarop de vertrektermijn, bedoeld in
      [artikel 62 van de Wet][ref1], verstrijkt, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
  - number: 4.52.1.b
    text: vóór zijn vertrek naar het buitenland, indien hij zijn hoofdverblijf buiten Nederland verplaatst.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.52
  - number: 4.52.2
    text: |-
      De persoon die het Nederlanderschap heeft verkregen levert het document, bedoeld in [artikel 9 van de Wet][ref1],
      in bij de korpschef van het regionale politiekorps waarin de gemeente waar hij zijn woon- of verblijfsplaats heeft
      is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 5.1.1
    text: |-
      De maatregel van beperking van vrijheid van beweging, bedoeld in [artikel 56, eerste lid, van de Wet][ref1] kan
      bestaan uit:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel56
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '56'
  - number: 5.1.1.a
    text: een verplichting zich bij verblijf in Nederland in een bepaald gedeelte van Nederland te bevinden, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.1
  - number: 5.1.1.b
    text: |-
      een verplichting zich te houden aan een verbod om zich in een bepaald gedeelte of bepaalde gedeelten van Nederland
      te bevinden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.1
  - number: 5.1.2
    text: |-
      De maatregel, bedoeld in het eerste lid, wordt niet opgelegd aan de vreemdeling die rechtmatig verblijf heeft op
      grond van [artikel 8, onderdeel a, van de Wet][ref1] en houder is van een EG-verblijfsvergunning voor langdurig
      ingezetenen die is afgegeven door een andere staat die partij is bij het Verdrag tot oprichting van de Europese
      Gemeenschap anders dan om redenen van veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 5.2.1
    text: |-
      Voordat de vreemdeling op grond van [artikel 59 van de Wet][ref1] in bewaring wordt gesteld, wordt hij gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
  - number: 5.2.2
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.2
  - number: 5.2.2.a
    text: de vreemdeling reeds op een andere grond in bewaring gesteld is, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.2
  - number: 5.2.2.b
    text: het voorafgaande gehoor van de vreemdeling niet kan worden afgewacht.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.2
  - number: 5.2.3
    text: |-
      Slechts in het geval bedoeld in het tweede lid, onder b, wordt de vreemdeling zo spoedig mogelijk na de
      tenuitvoerlegging van de bewaring gehoord.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.2
  - number: 5.2.4
    text: Van het gehoor wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.2
  - number: 5.2.5
    text: |-
      Aan de vreemdeling wordt tijdig mededeling gedaan van de hem toekomende bevoegdheid zich bij het gehoor te doen
      bijstaan door zijn raadsman.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.2
  - number: 5.3.1
    text: |-
      De maatregel waarbij de bewaring op grond van [artikel 59 van de Wet][ref1] wordt opgelegd wordt gedagtekend en
      ondertekend; de maatregel wordt met redenen omkleed. Aan de vreemdeling op wie de maatregel betrekking heeft, wordt
      onmiddellijk een afschrift daarvan uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
  - number: 5.3.2
    text: Op de voortzetting van de bewaring op een andere grond is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.3
  - number: 5.4.1
    text: |-
      De bewaring op grond van [artikel 59 van de Wet][ref1] wordt ten uitvoer gelegd op een politiebureau,
      een cel van de Koninklijke marechaussee, in een huis van bewaring of een ruimte of plaats als bedoeld in
      [artikel 6, tweede lid][ref2], of [artikel 58, eerste lid van de Wet][ref3]. Bij de tenuitvoerlegging van de
      bewaring wordt de vreemdeling niet verder beperkt in de uitoefening van grondrechten dan wordt gevorderd door het
      doel van deze maatregel en de handhaving van de orde en de veiligheid op de plaats van tenuitvoerlegging.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel58
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '58'
  - number: 5.4.2
    text: |-
      Indien de tenuitvoerlegging van de bewaring een aanvang neemt op een politiebureau of in een cel van de Koninklijke
      marechaussee, wordt zodra dit redelijkerwijs mogelijk is de tenuitvoerlegging voortgezet in een huis van bewaring
      of een ruimte of plaats als bedoeld in [artikel 6, tweede lid][ref1] of [artikel 58, eerste lid, van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel58
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '58'
  - number: 5.4.3
    text: De bewaring wordt opgeheven zodra er geen grond meer aanwezig is.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.4
  - number: 5.5.1
    text: |-
      Gedurende de tenuitvoerlegging van een vrijheidsontnemende maatregel ingevolge de [artikelen 6, tweede lid][ref1],
      [58, eerste lid][ref2], of [59, eerste lid, van de Wet][ref3], kan de vreemdeling voor korte duur naar elders
      worden gebracht, wanneer dit redelijkerwijs nodig is voor de toepassing van de Wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '58'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '59'
  - number: 5.5.2
    text: |-
      Van de tenuitvoerlegging van een vrijheidsontnemende maatregel als bedoeld in het eerste lid, wordt op verzoek van
      de vreemdeling zo spoedig mogelijk kennis gegeven aan diens naaste verwanten of aan een in Nederland gevestigde
      diplomatieke of consulaire vertegenwoordiging van de staat waarvan hij onderdaan is.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.5
  - number: 5.5.3
    text: |-
      In geval de vrijheidsontnemende maatregel een minderjarige betreft wordt daarvan, zo daartoe de gelegenheid
      bestaat, ambtshalve zo spoedig mogelijk kennis gegeven aan degenen die de ouderlijke macht of de voogdij over die
      minderjarige uitoefenen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.5
  - number: '5.6'
    text: |-
      Overeenkomstig door Onze Minister te geven algemene en bijzondere aanwijzingen stelt de korpschef of
      de bevelhebber van de Koninklijke marechaussee Onze Minister tijdig vóór het verstrijken van de in
      [artikel 94, eerste lid, van de wet][ref1] genoemde termijn in kennis van de bewaring dan wel het voortduren
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel94
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '94'
  - number: 5.7.1
    text: |-
      De aanwijzing bedoeld in de [artikelen 57, eerste lid][ref1], en [58, eerste lid, van de Wet][ref2] wordt zoveel
      mogelijk gegeven bij de beschikking waarbij de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in
      [artikel 28 van de Wet][ref3], is afgewezen. De aanwijzing wordt met redenen omkleed.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '58'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 5.7.2
    text: |-
      [Artikel 5.3][ref1] is van overeenkomstige toepassing indien de aanwijzing, bedoeld in het eerste lid, gegeven
      wordt bij afzonderlijke beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Onze Minister is bevoegd om, bij de uitoefening van zijn bevoegdheid tot uitzetting als bedoeld in
      [artikel 63, tweede lid, van de Wet][ref1] alle daartoe benodigde handelingen te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel63
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '63'
  - number: '6.2'
    text: |-
      Onze Minister is bevoegd de kosten van uitzetting, bedoeld in de [artikelen 65, tweede lid][ref1], en
      [66 van de Wet][ref2] te verhalen op de vreemdeling of op een vervoersonderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel66
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '66'
  - number: 6.3.1
    text: |-
      De kosten van uitzetting van een vreemdeling welke ingevolge [artikel 65, tweede lid, van de Wet][ref1] op een
      vervoersonderneming kunnen worden verhaald, zijn verschuldigd aan het openbaar lichaam te welks laste die kosten
      zijn gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel65
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '65'
  - number: 6.3.2
    text: 'De in het voorgaande lid bedoelde kosten van uitzetting omvatten in ieder geval de kosten verbonden aan:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.3
  - number: 6.3.2.a
    text: |-
      het vervoer van de uit te zetten vreemdeling per eerste gelegenheid, doch op de wijze die, gelet op de
      omstandigheden, de goedkoopste is, naar een plaats buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.3
  - number: 6.3.2.b
    text: |-
      de begeleiding van de vreemdeling naar een plaats van vertrek uit Nederland alsmede zijn begeleiding naar een
      plaats buiten Nederland, voorzover deze noodzakelijk is, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.3
  - number: 6.3.2.c
    text: |-
      het verblijf van de vreemdeling in Nederland in de periode nadat de vervoersonderneming van een ambtenaar belast
      met de grensbewaking de aanwijzing heeft gekregen de vreemdeling terug te vervoeren naar een plaats buiten
      Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.3
  - number: 6.4.1
    text: |-
      De noodzakelijke kosten van uitzetting die ten laste komen van de Staat of van andere openbare lichamen kunnen door
      de Staat, of door het andere openbare lichaam te welks laste zij zijn gekomen, worden verhaald op de vreemdeling
      en, indien hij minderjarig is, op degenen die het wettig gezag over hem uitoefenen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.4
  - number: 6.4.2
    text: |-
      De in het voorgaande lid bedoelde kosten van uitzetting omvatten de kosten, genoemd in
      [artikel 6.3, tweede lid, onder a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel6
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: 6.6.1
    text: |-
      De aanvraag om opheffing van de ongewenstverklaring, bedoeld in [artikel 68, eerste lid, van de Wet][ref1], wordt
      door Onze Minister in ieder geval ingewilligd, indien de vreemdeling niet aan strafvervolging terzake van misdrijf
      is onderworpen en ongewenst verklaard is:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel68
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '68'
  - number: 6.6.1.a
    text: |-
      naar aanleiding van geweldsdelicten of opiumdelicten en sinds de ongewenstverklaring en het vertrek uit Nederland
      tien achtereenvolgende jaren buiten Nederland heeft verbleven;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.6
  - number: 6.6.1.b
    text: |-
      naar aanleiding van andere misdrijven en sinds de ongewenstverklaring en het vertrek uit Nederland vijf
      achtereenvolgende jaren buiten Nederland heeft verbleven, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.6
  - number: 6.6.1.c
    text: |-
      op grond van [artikel 67, eerste lid, onder a, van de Wet][ref1] en sinds de ongewenstverklaring één jaar buiten
      Nederland heeft verbleven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel67
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '67'
  - number: 6.6.2
    text: 'De in het eerste lid genoemde termijnen vangen opnieuw aan, indien de vreemdeling tijdens de ongewenstverklaring:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.6
  - number: 6.6.2.a
    text: |-
      een als misdrijf strafbaar gestelde inbreuk op de openbare orde heeft gepleegd die tot ongewenstverklaring zou
      kunnen leiden, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.6
  - number: 6.6.2.b
    text: |-
      zonder voorafgaande tijdelijke opheffing of in strijd met de aan die tijdelijke opheffing verbonden voorwaarden in
      Nederland heeft verbleven.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.6
  - number: 6.6.3
    text: |-
      De gegevens, bedoeld in [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref1], die de vreemdeling
      verstrekt zijn in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 6.6.3.a
    text: |-
      een schriftelijke verklaring van de vreemdeling dat hij sinds zijn vertrek uit Nederland na de ongewenstverklaring
      tien, onderscheidenlijk vijf achtereenvolgende jaren of één jaar buiten Nederland heeft verbleven en dat hij zich
      in die periode niet schuldig heeft gemaakt aan misdrijven en dat hij niet aan strafvervolging onderworpen is;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.6
  - number: 6.6.3.b
    text: |-
      een kopie van de documenten voor grensoverschrijding die de vreemdeling sinds zijn ongewenstverklaring heeft
      gehouden;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.6
  - number: 6.6.3.c
    text: |-
      een overzicht van de plaatsen waar de vreemdeling sinds zijn ongewenstverklaring heeft verbleven, voorzien van
      bewijsstukken, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.6
  - number: 6.6.3.d
    text: |-
      een schriftelijke verklaring, afgegeven door de terzake bevoegde autoriteiten van het land of de landen waar de
      vreemdeling sinds zijn ongewenstverklaring heeft verbleven, dat de vreemdeling zich tijdens dat verblijf niet
      schuldig heeft gemaakt aan misdrijven en niet aan strafvervolging onderworpen is.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.6
  - number: '6.7'
    text: |-
      In zeer uitzonderlijke en dringende gevallen kan Onze Minister de ongewenstverklaring tijdelijk opheffen. Aan de
      tijdelijke opheffing worden voorwaarden gesteld omtrent de plaats van binnenkomst en de duur van het verblijf in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel6.7
  - number: 7.2.1
    text: |-
      De uitzetting van de vreemdeling blijft, in afwijking van [artikel 73, tweede lid, van de Wet][ref1] achterwege,
      indien het betreft een vreemdeling, die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel73
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '73'
  - number: 7.2.1.a
    text: onderdaan is van een land dat partij is bij het Europees Vestigingsverdrag;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel7.2
  - number: 7.2.1.b
    text: |-
      onmiddellijk voorafgaande aan het tijdstip waarop het rechtmatig verblijf, bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1] is geëindigd, gedurende twee aaneengesloten jaren
      dit rechtmatig verblijf heeft gehad;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 7.2.1.c
    text: zijn hoofdverblijf niet buiten Nederland heeft gevestigd, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel7.2
  - number: 7.2.1.d
    text: |-
      tijdig bezwaar heeft gemaakt dan wel administratief beroep heeft ingesteld tegen een beschikking waarbij het
      rechtmatig verblijf is beëindigd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel7.2
  - number: 7.2.2
    text: |-
      Het eerste lid blijft buiten toepassing, indien de uitzetting van de vreemdeling wegens dwingende redenen van
      nationale veiligheid gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel7.2
  - number: 8.1.1
    text: |-
      Onze Minister onderscheidenlijk de korpschef verstrekt op de wijze als beschreven in dit artikel de gegevens
      betreffende de verblijfsrechtelijke positie van een vreemdeling die een bestuursorgaan of een orgaan als bedoeld
      in [artikel 107, vijfde lid, van de Wet][ref1] nodig hebben voor de toekenning van verstrekkingen, voorzieningen,
      uitkeringen, ontheffingen of vergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 8.1.2
    text: |-
      De basisgegevens betreffende de verblijfsrechtelijke positie van vreemdelingen worden door Onze Minister
      onderscheidenlijk de korpschef verstrekt aan de gemeentelijke basisadministratie persoonsgegevens, met het oog op
      de verstrekking daarvan ingevolge de [Wet gemeentelijke basisadministratie persoonsgegevens][ref1] aan een orgaan
      als bedoeld in het eerste lid. De basisgegevens zijn de gegevens betreffende het verblijfsrecht van de vreemdeling,
      bedoeld in [bedoeld in bijlage 1a van het Besluit gemeentelijke basisadministratie persoonsgegevens][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723
      [ref2]: https://wetten.overheid.nl/BWBR0006933
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0006723
      - id: ref2
        bwb_id: BWBR0006933
  - number: 8.1.3
    text: |-
      Een bestuursorgaan of een orgaan als bedoeld in [artikel 107, vijfde lid, van de Wet][ref1] vraagt Onze
      Minister onmiddellijk nadere gegevens over de verblijfsrechtelijke positie van een vreemdeling, indien bij
      het bestuursorgaan of een orgaan als bedoeld in [artikel 107, vijfde lid, van de Wet][ref2], na raadpleging
      van de basisgegevens betreffende de verblijfsrechtelijke positie van een vreemdeling uit de gemeentelijke
      basisadministratie persoonsgegevens onduidelijkheid bestaat omtrent de verblijfsrechtelijke positie van die
      vreemdeling, omdat:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 8.1.3.a
    text: |-
      de vreemdeling niet voorkomt in de gemeentelijke basisadministratie persoonsgegevens, maar wel beschikt over het
      bescheid, bedoeld in [artikel 9, tweede lid, van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 8.1.3.b
    text: |-
      de verblijfsrechtelijke gegevens in de gemeentelijke basisadministratie persoonsgegevens afwijken van de gegevens
      omtrent het verblijf van die vreemdeling op het bescheid, bedoeld in [artikel 9, tweede lid, van de Wet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 8.1.3.c
    text: |-
      de verblijfsrechtelijke gegevens in de gemeentelijke basisadministratie persoonsgegevens en het bescheid, bedoeld
      in [artikel 9, tweede lid, van de Wet][ref1] afwijken van andere bescheiden, waarover het bestuursorgaan beschikt,
      waardoor gerede twijfel over de juistheid van de gegevens over de verblijfsrechtelijke positie van de vreemdeling
      is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 8.1.4
    text: |-
      Onze Minister verstrekt het bestuursorgaan of een orgaan als bedoeld in
      [artikel 107, vijfde lid, van de Wet][ref1], in de gevallen, bedoeld in het derde lid, desgevraagd onmiddellijk de
      nadere gegevens over de verblijfsrechtelijke positie van de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 8.1.5
    text: |-
      Indien een bestuursorgaan of een orgaan als bedoeld in [artikel 107, vijfde lid, van de Wet][ref1], in een
      individueel geval aanwijzingen heeft dat op korte termijn een wijziging in de verblijfsrechtelijke positie
      van een vreemdeling optreedt of recent een wijziging in de verblijfsrechtelijke positie is opgetreden en het
      bestuursorgaan heeft met redenen omkleed aannemelijk gemaakt dat vanwege het spoedeisende karakter bij het
      toekennen van een verstrekking, voorziening, uitkering, ontheffing of vergunning niet gewacht kan worden op de
      aanpassing van de basisgegevens in de gemeentelijke basisadministratie persoonsgegevens, verstrekt Onze Minister
      desgevraagd onmiddellijk nadere gegevens over een desbetreffende wijziging in de verblijfsrechtelijke positie van
      de vreemdeling. Het verzoek wordt schriftelijk gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 8.1.6
    text: |-
      De korpschef, bedoeld in het eerste en tweede lid, is de korpschef van het regionale politiekorps waarin de
      gemeente is gelegen waar de vreemdeling is ingeschreven in de gemeentelijke basisadministratie persoonsgegevens
      dan wel waar hij tijdelijke woon- of verblijfplaats heeft. Indien de vreemdeling geen woon- of verblijfplaats
      heeft, verstrekt de korpschef van het regionale politiekorps waarin het bestuursorgaan of een orgaan als bedoeld in
      [artikel 107, vijfde lid, van de Wet][ref1], waarbij de vreemdeling zich meldt, is gelegen, de gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 8.2.1
    text: |-
      Een bestuursorgaan of een orgaan als bedoeld in [artikel 107, vijfde lid, van de Wet][ref1] verstrekt Onze Minister
      of de korpschef desgevraagd de gegevens omtrent de toekenning of de beëindiging van verstrekkingen, voorzieningen,
      uitkeringen, ontheffingen of vergunningen aan een vreemdeling, die nodig zijn voor:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 8.2.1.a
    text: |-
      de verlening, de verlenging van de geldigheidsduur van, de wijziging van het verblijfsdoel van of intrekking van
      een verblijfsvergunning als bedoeld in de [artikel 8, onder a tot en met d, van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 8.2.1.b
    text: |-
      de beoordeling of aan de voorwaarden en beperkingen waaronder die verblijfsvergunning is verleend, wordt voldaan,
      of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.2
  - number: 8.2.1.c
    text: |-
      de beoordeling of een vreemdeling als gemeenschapsonderdaan rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onder e, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 8.2.2
    text: |-
      Indien uit de verblijfsrechtelijke gegevens in de gemeentelijke basisadministratie persoonsgegevens, dan wel uit
      een aantekening op het bescheid, bedoeld in [artikel 9, tweede lid, van de Wet][ref1] blijkt dat het verblijfsrecht
      is toegekend onder de beperking dat een beroep op publieke middelen gevolgen kan hebben voor het verblijfsrecht,
      verstrekt een bestuursorgaan, niet zijnde een orgaan als bedoeld in [artikel 107, vijfde lid, van de Wet][ref2],
      uit eigen beweging zo spoedig mogelijk de gegevens, bedoeld in het eerste lid, die nodig zijn voor de beoordeling
      of aan deze beperking wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 8.2.3
    text: |-
      Indien uit de verblijfsrechtelijke gegevens in de gemeentelijke basisadministratie persoonsgegevens, dan
      wel uit een aantekening op het bescheid, bedoeld in [artikel 9, tweede lid, van de Wet][ref1] blijkt dat
      het verblijfsrecht is toegekend onder de beperking dat arbeid niet is toegestaan, dan wel arbeid uitsluitend
      is toegestaan bij een bepaalde werkgever, dan wel arbeid slechts is toegestaan indien de werkgever beschikt
      over een tewerkstellingsvergunning, verstrekt een bestuursorgaan, niet zijnde een orgaan als bedoeld in
      [artikel 107, vijfde lid, van de Wet][ref2], belast met de verstrekking van ontheffingen of vergunningen als
      bedoeld in de [artikelen 8.3][ref3] en [8.4][ref4], uit eigen beweging zo spoedig mogelijk de gegevens, bedoeld in
      het eerste lid die nodig zijn voor de beoordeling of aan deze beperking wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '1'
  - number: 8.2.4
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister die het aangaat, bepalen dat de gegevens, bedoeld in dit
      artikel, periodiek of in gestandaardiseerde vorm worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.2
  - number: 8.2.5
    text: Het bestuursorgaan verstrekt de gegevens, bedoeld in het tweede en derde lid, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.2
  - number: 8.3.1
    text: |-
      De vreemdeling die geen rechtmatig verblijf heeft op grond van [artikel 8 van de Wet][ref1] kan geen aanspraak
      maken op een beschikking als bedoeld in:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 8.3.1.a
    text: |-
      de [artikelen 4, eerste lid][ref1], en [15 van de Vestigingswet Bedrijven 1954][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002130#Artikel15
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002130
        artikel: '15'
  - number: 8.3.1.b
    text: |-
      de [artikelen 30b][ref1] en [30h van de Wet op de kansspelen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30h
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30b
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30h
  - number: 8.3.1.c
    text: |-
      [artikel 3 van de Drank- en Horecawet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
  - number: 8.3.1.d
    text: |-
      de [artikelen 2, eerste lid][ref1], en
      [7 van de Wet particuliere beveiligingsorganisaties en recherchebureaus][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008973#Artikel7
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008973
        artikel: '7'
  - number: 8.3.1.e
    text: |-
      [artikel 4, tweede lid, van de Wet personenvervoer 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '4'
  - number: 8.3.2
    text: |-
      De vreemdeling, bedoeld in het eerste lid, kan geen aanspraak maken op de toekenning van vergunningen
      en ontheffingen door bestuursorganen van gemeenten, provincies, waterschappen en met toepassing van de
      [Wet gemeenschappelijke regelingen][ref1] ingestelde openbare lichamen of gemeenschappelijke regelingen, voorzover
      die vergunningen of ontheffingen betrekking hebben op standplaatsen, markten, venten, collecteren, evenementen of
      beroepsmatige dan wel bedrijfsmatige activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '8.4'
    text: |-
      De vreemdeling die rechtmatig in Nederland verblijf heeft op de gronden, genoemd in
      [artikel 8, onder f tot en met j, van de Wet][ref1], kan geen aanspraak maken op een beschikking als bedoeld in
      [artikel 8.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '1'
  - number: 8.5.1
    text: |-
      Aan een vreemdeling die onderdaan is van België of Luxemburg en die het vereiste document voor grensoverschrijding
      bezit, kan, in afwijking van [hoofdstuk 2][ref1], de toegang tot Nederland slechts worden geweigerd, indien hij een
      actuele bedreiging voor de openbare orde of de nationale veiligheid vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0011825
        hoofdstuk: '1'
  - number: 8.5.2
    text: |-
      De ambtenaren belast met de grensbewaking of de ambtenaren belast met het toezicht op vreemdelingen, weigeren niet
      dan ingevolge een bijzondere aanwijzing van Onze Minister de toegang tot Nederland aan een vreemdeling als bedoeld
      in het eerste lid. De weigering geschiedt schriftelijk.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.5
  - number: 8.6.1
    text: |-
      De aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref1], ingediend door een vreemdeling die onderdaan is van België of Luxemburg die geen
      gemeenschapsonderdaan is, kan slechts worden afgewezen, indien de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 8.6.1.a
    text: een actuele bedreiging voor de openbare orde of de nationale veiligheid vormt; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.6
  - number: 8.6.1.b
    text: niet over voldoende middelen van bestaan beschikt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.6
  - number: 8.6.2
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref1], ingediend door de in het eerste lid bedoelde vreemdeling, wordt niet afgewezen,
      en de verblijfsvergunning wordt niet ingetrokken, op grond van de omstandigheid dat de vreemdeling niet meer over
      voldoende middelen van bestaan beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 8.6.3
    text: |-
      In afwijking van [artikel 21, eerste en tweede lid, van de Wet][ref1], wordt de aanvraag tot het verlenen van een
      verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20 van de Wet][ref2], ingediend door een vreemdeling
      als bedoeld in het eerste lid die nog niet gedurende een tijdvak van vijf jaren rechtmatig verblijf heeft gehad,
      slechts afgewezen, indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 8.6.3.a
    text: een actuele bedreiging voor de openbare orde of de nationale veiligheid vormt; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.6
  - number: 8.6.3.b
    text: niet zelfstandig en duurzaam beschikt over voldoende middelen van bestaan.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.6
  - number: 8.6.4
    text: |-
      In afwijking van [artikel 21 van de Wet][ref1], kan de verblijfsvergunning voor onbepaalde tijd, bedoeld in
      [artikel 20 van de Wet][ref2], die is verleend aan de vreemdeling, bedoeld in het eerste lid, slechts worden
      ingetrokken op de in het derde lid, onder a, bedoelde grond.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 8.7.1
    text: |-
      Deze paragraaf is van toepassing op vreemdelingen die de nationaliteit bezitten van een staat die partij is bij
      het Verdrag tot oprichting van de Europese Gemeenschap of bij de Overeenkomst betreffende de Europese Economische
      Ruimte, dan wel van Zwitserland, en die zich naar Nederland begeven of in Nederland verblijven.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.7
  - number: 8.7.2
    text: |-
      Deze paragraaf is eveneens van toepassing op de familieleden die een vreemdeling als bedoeld in het eerste lid naar
      Nederland begeleiden of zich bij hem in Nederland voegen, voor zover het betreft:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.7
  - number: 8.7.2.a
    text: de echtgenoot;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.7
  - number: 8.7.2.b
    text: |-
      de partner, waarmee de vreemdeling een naar Nederlands internationaal privaatrecht geldig geregistreerd
      partnerschap is aangegaan;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.7
  - number: 8.7.2.c
    text: |-
      de rechtstreekse bloedverwant in neergaande lijn, van een vreemdeling als bedoeld in het eerste lid, of van diens
      echtgenoot of geregistreerd partner, voor zover die bloedverwant jonger is dan 21 jaar of ten laste is van die
      echtgenoot of geregistreerd partner; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.7
  - number: 8.7.2.d
    text: |-
      de rechtstreekse bloedverwant in opgaande lijn die ten laste is van de vreemdeling of van het gezinslid, bedoeld
      onder a of b.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.7
  - number: 8.7.3
    text: |-
      Deze paragraaf is voorts van toepassing op andere familieleden dan bedoeld in het tweede lid, die een vreemdeling
      als bedoeld in het eerste lid naar Nederland begeleiden of zich bij hem in Nederland voegen, in geval zij:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.7
  - number: 8.7.3.a
    text: in het land van herkomst ten laste zijn van of inwonen bij die vreemdeling; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.7
  - number: 8.7.3.b
    text: vanwege ernstige gezondheidsredenen een persoonlijke verzorging door die vreemdeling strikt behoeven.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.7
  - number: 8.7.4
    text: |-
      Deze paragraaf is eveneens van toepassing op de ongehuwde partner die een vreemdeling als bedoeld in het eerste lid
      naar Nederland begeleidt of zich bij hem in Nederland voegt en die een deugdelijk bewezen duurzame relatie met die
      vreemdeling heeft, en op de rechtstreekse bloedverwant in de neergaande lijn van een zodanige partner, voor zover
      die bloedverwant jonger is dan 18 jaar en die partner vergezelt of zich bij die partner in Nederland voegt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.7
  - number: 8.8.1
    text: |-
      Aan een vreemdeling als bedoeld in [artikel 8.7][ref1], die in het bezit is van een geldig document voor
      grensoverschrijding, kan de toegang tot Nederland slechts worden geweigerd om redenen van openbare orde of openbare
      veiligheid, dan wel volksgezondheid:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.8.1.a
    text: |-
      indien de vreemdeling op grond van zijn persoonlijke gedrag een actuele, werkelijke en ernstige bedreiging voor een
      fundamenteel belang van de samenleving vormt;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.8
  - number: 8.8.1.b
    text: |-
      in het geval van potentieel epidemische ziekten zoals gedefinieerd in de relevante instrumenten van de
      Wereldgezondheidsorganisatie dan wel andere infectieziekten of besmettelijke parasitaire ziekten, ten aanzien
      waarvan in Nederland beschermende regelingen ten aanzien van Nederlanders worden getroffen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.8
  - number: 8.8.1.c
    text: |-
      indien hij om redenen van de openbare orde of openbare veiligheid uit Nederland is verwijderd en sinds de
      verwijdering nog geen redelijke termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.8
  - number: 8.8.2
    text: |-
      De ambtenaren, belast met de grensbewaking of met het toezicht op vreemdelingen, weigeren niet dan ingevolge een
      bijzondere aanwijzing van Onze Minister de toegang tot Nederland aan een vreemdeling als bedoeld in het eerste lid.
      De weigering geschiedt schriftelijk.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.8
  - number: 8.8.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op de onderdaan van België of Luxemburg die geen
      gemeenschapsonderdaan is. Op deze vreemdeling is [artikel 8.5][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
        afdeling: '2'
  - number: 8.8.4
    text: |-
      Een vreemdeling die niet beschikt over het vereiste document voor grensoverschrijding, wordt niet uitgezet dan
      nadat hem gedurende een redelijke termijn de gelegenheid is gegeven dat document te verkrijgen of op andere wijze
      te laten vaststellen of bewijzen dat hij het recht op vrij verkeer en verblijf geniet.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.8
  - number: '8.9'
    text: |-
      Aan een vreemdeling als bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die niet de nationaliteit
      bezit van een staat als bedoeld in het eerste lid van dat artikel, en die beschikt over een geldige verblijfskaart,
      afgegeven door de bevoegde autoriteiten van een staat als bedoeld in [artikel 8.7, eerste lid][ref2], waaruit het
      verblijfsrecht als familielid blijkt, wordt de toegang niet geweigerd wegens het ontbreken van een geldig visum. In
      het paspoort wordt geen aantekening gesteld omtrent inreis in Nederland of uitreis uit Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: '8.10'
    text: |-
      De toegang van een persoon die in het bezit is van een door de Nederlandse autoriteiten afgegeven Nederlands
      paspoort of Nederlandse identiteitskaart, en die om redenen van openbare orde, openbare veiligheid of
      volksgezondheid uit een andere lidstaat is verwijderd, wordt de toegang, ook indien het document is vervallen
      of de Nederlandse nationaliteit van de houder wordt betwist, niet geweigerd, indien deze persoon naar Nederland
      terugkeert uit een staat waar hem verblijf was toegestaan ingevolge het Verdrag tot oprichting van de Europese
      Gemeenschap, bij de Overeenkomst betreffende de Europese Economische Ruimte of ingevolge de Overeenkomst van
      21 juni 1999 van de Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat, anderzijds, over
      het vrije verkeer van personen (Trb. 2000, 16 en 86).
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.10
  - number: 8.11.1
    text: |-
      De vreemdeling, bedoeld in [artikel 8.7, eerste lid][ref1], heeft rechtmatig verblijf gedurende een periode van
      drie maanden na inreis, indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.11
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.11.1.a
    text: beschikt over een geldige identiteitskaart of een geldig paspoort; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.11
  - number: 8.11.1.b
    text: het bewijs van zijn identiteit en nationaliteit ondubbelzinnig met andere middelen levert.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.11
  - number: 8.11.2
    text: |-
      De vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die niet de nationaliteit bezit
      van een staat als bedoeld in het [eerste lid van dat artikel][ref2] en beschikt over een geldig paspoort, heeft
      rechtmatig verblijf gedurende een periode van drie maanden na inreis.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.11
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.12.1
    text: |-
      De vreemdeling, bedoeld in [artikel 8.7, eerste lid][ref1], heeft langer dan drie maanden na inreis rechtmatig
      verblijf in Nederland, indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.12.1.a
    text: |-
      in Nederland werknemer of zelfstandige is dan wel Nederland is ingereisd om werk te zoeken en kan bewijzen dat hij
      werk zoekt en een reële kans op werk heeft;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
  - number: 8.12.1.b
    text: |-
      voor zichzelf en zijn familieleden beschikt over voldoende middelen van bestaan en over een verzekering die de
      ziektekosten in Nederland volledig dekt;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
  - number: 8.12.1.c
    text: |-
      is ingeschreven voor een opleiding die is opgenomen in het Centraal register opleidingen hoger onderwijs, bedoeld
      in [artikel 6.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], of in het Centraal
      register beroepsopleidingen, bedoeld in [artikel 6.4.1 van de Wet educatie en beroepsonderwijs][ref2], om als
      hoofdbezigheid een studie of beroepsopleiding te volgen, beschikt over een verzekering die de ziektekosten in
      Nederland volledig dekt, en hij met een verklaring of een gelijkwaardig middel naar zijn keuze de zekerheid
      verschaft dat hij beschikt over voldoende middelen van bestaan voor zichzelf en zijn familieleden;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
  - number: 8.12.1.d
    text: |-
      een familielid als bedoeld in [artikel 8.7, tweede lid][ref1], is van een vreemdeling als bedoeld onder a of b;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.12.1.e
    text: de echtgenoot, de geregistreerde partner of een kind is dat ten laste is van een vreemdeling als bedoeld onder c;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
  - number: 8.12.1.f
    text: |-
      familielid is als bedoeld in [artikel 8.7, derde lid][ref1], en hij in het land van herkomst ten laste is van of
      inwoont bij een vreemdeling als bedoeld in het eerste lid, onder a, b of c;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.12.1.g
    text: |-
      familielid is als bedoeld in [artikel 8.7, derde lid][ref1], en hij vanwege ernstige gezondheidsredenen een
      persoonlijke verzorging door een vreemdeling als bedoeld in het eerste lid, onder a, b of c, strikt behoeft; of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.12.1.h
    text: |-
      partner is als bedoeld in [artikel 8.7, vierde lid][ref1], en hij een deugdelijk bewezen duurzame relatie heeft met
      een vreemdeling als bedoeld in het eerste lid, onder a, b of c, dan wel rechtstreekse bloedverwant in de neergaande
      lijn, jonger dan 18 jaar, is van een zodanige partner.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.12.2
    text: |-
      Het rechtmatig verblijf van de vreemdeling, bedoeld in het eerste lid, onder a, eindigt niet om de enkele reden dat
      die vreemdeling niet langer werknemer of zelfstandige is:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
  - number: 8.12.2.a
    text: in geval van tijdelijke arbeidsongeschiktheid als gevolg van ziekte of ongeval;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
  - number: 8.12.2.b
    text: |-
      indien hij na werkzaamheden als werknemer of zelfstandige van ten minste een jaar onvrijwillig werkloos is en als
      werkzoekende bij het Uitvoeringsinstituut werknemersverzekeringen is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
  - number: 8.12.2.c
    text: |-
      gedurende een periode van ten minste zes maanden, nadat hij onvrijwillige werkloos is geworden door de afloop van
      een arbeidsovereenkomst korter dan een jaar, dan wel nadat hij gedurende de eerste twaalf maanden onvrijwillig
      werkloos geworden is, indien hij als werkzoekende bij het Uitvoeringsinstituut werknemersverzekeringen is
      ingeschreven;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
  - number: 8.12.2.d
    text: |-
      indien hij een beroepsopleiding gaat volgen, die, behoudens ingeval van onvrijwillige werkloosheid, verband houdt
      met de voorafgaande beroepsactiviteit.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
  - number: 8.12.3
    text: |-
      Voor de toepassing van het eerste lid, onder b, beschikt de vreemdeling met een inkomen ter hoogte van het
      normbedrag dat ingevolge de [Wet werk en bijstand][ref1] voor de desbetreffende categorie is vastgesteld, in ieder
      geval over voldoende middelen van bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 8.12.4
    text: |-
      De vreemdeling, bedoeld in het eerste lid, meldt zich uiterlijk binnen een maand na afloop van de
      in [artikel 8.11, eerste lid][ref1], bedoelde periode aan bij Onze Minister ter inschrijving in de
      vreemdelingenadministratie in geval hij beoogt langer dan drie maanden in Nederland te verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.12.5
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de gegevens en bescheiden die de vreemdeling
      bij de in het vorige lid bedoelde melding moet verstrekken of overleggen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
  - number: 8.12.6
    text: |-
      Onze Minister verstrekt na de in het vierde lid bedoelde inschrijving onmiddellijk een verklaring van inschrijving,
      waarin naam en adres van de ingeschreven vreemdeling en de datum van inschrijving worden vermeld.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
  - number: 8.12.7
    text: |-
      De in het vierde en vijfde lid omschreven verplichtingen rusten ten aanzien van kinderen beneden de leeftijd van
      twaalf jaar op de wettelijk vertegenwoordiger. Voor kinderen van twaalf jaar en ouder kan aan deze verplichtingen
      ook worden voldaan door de wettelijk vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.12
  - number: 8.13.1
    text: |-
      De vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die niet de nationaliteit bezit
      van een staat als bedoeld in het [eerste lid van dat artikel][ref2], heeft langer dan drie maanden na inreis
      rechtmatig verblijf in Nederland, voor zover hij in Nederland verblijft bij een vreemdeling als bedoeld in
      [artikel 8.12, eerste lid, onder a, b of c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.13.2
    text: |-
      De vreemdeling, bedoeld in het eerste lid, meldt zich uiterlijk binnen een maand na afloop van de in
      [artikel 8.11, tweede lid][ref1], bedoelde periode aan bij Onze Minister, in geval hij beoogt langer dan drie
      maanden in Nederland te verblijven, en dient daarbij een aanvraag in tot afgifte van een verblijfsdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.13.3
    text: 'Bij de indiening van de aanvraag legt de vreemdeling over:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
  - number: 8.13.3.a
    text: een geldig paspoort;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
  - number: 8.13.3.b
    text: |-
      de verklaring van inschrijving van de vreemdeling, bedoeld in [artikel 8.7, eerste lid][ref1], bij wie hij in
      Nederland verblijft;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.13.3.c
    text: |-
      een document waaruit de familierechtelijke relatie of duurzame relatie blijkt met de vreemdeling, bedoeld onder
      b; en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
  - number: 8.13.3.d
    text: |-
      voor zover hij in Nederland verblijft als familielid als bedoeld in [artikel 8.7, tweede lid, onder c of d][ref1]:
      bewijs dat hij een dergelijk familielid is;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.13.3.e
    text: |-
      voor zover hij in Nederland verblijft als familielid als bedoeld in [artikel 8.7, derde lid][ref1]: een door de
      bevoegde instantie van het land van herkomst afgegeven verklaring dat hij ten laste komt van of inwoont bij de
      vreemdeling, bedoeld onder b, onderscheidenlijk bewijs van ernstige gezondheidsredenen die de persoonlijke zorg
      door die vreemdeling noodzakelijk maken;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.13.3.f
    text: |-
      voor zover hij in Nederland verblijft als partner als bedoeld in [artikel 8.7, vierde lid][ref1]: een bij regeling
      van Onze Minister vast te stellen relatieverklaring;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.13.3.g
    text: |-
      voor zover hij in Nederland verblijft als rechtstreekse bloedverwant in de neergaande lijn, jonger dan 18 jaar, van
      een partner als bedoeld onder f: bewijs dat is voldaan aan de [artikelen 3.13 tot en met 3.22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 8.13.4
    text: Onze Minister verstrekt onmiddellijk na de ontvangst van de aanvraag een verklaring dat de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
  - number: 8.13.5
    text: |-
      Onze Minister verstrekt de verblijfsgerechtigde vreemdeling binnen zes maanden na de ontvangst van
      de aanvraag een verblijfsdocument waarvan het model wordt vastgesteld bij ministeriële regeling.
      [Artikel 25, tweede en derde lid, van de Wet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel25
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '25'
  - number: 8.13.6
    text: 'Het verblijfsdocument wordt afgegeven met een geldigheidsduur:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
  - number: 8.13.6.a
    text: |-
      die gelijk is aan de duur van het voorgenomen verblijf van de vreemdeling, bedoeld in
      [artikel 8.7, eerste lid][ref1], bij wie de vreemdeling in Nederland verblijft, indien die duur korter is dan vijf
      jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.13.6.b
    text: van vijf jaar in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
  - number: 8.13.7
    text: |-
      De in het tweede en derde lid omschreven verplichtingen rusten ten aanzien van kinderen beneden de leeftijd van
      twaalf jaar op de wettelijk vertegenwoordiger. Voor kinderen van twaalf jaar en ouder kan aan deze verplichtingen
      ook worden voldaan door de wettelijk vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.13
  - number: '8.14'
    text: |-
      Het rechtmatig verblijf van de vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die de
      nationaliteit bezit van een staat als bedoeld in het [eerste lid van dat artikel][ref2], eindigt niet door het
      overlijden of het vertrek van de vreemdeling, bedoeld in [artikel 8.7, eerste lid][ref3], bij wie hij in Nederland
      verbleef. Het eindigt evenmin door de ontbinding of nietigverklaring van het huwelijk of de beëindiging van het
      geregistreerde partnerschap.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.14
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.15.1
    text: |-
      Het rechtmatig verblijf van de vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die niet
      de nationaliteit bezit van een staat als bedoeld in het eerste lid van dat artikel, eindigt niet door afwezigheid
      uit Nederland:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.15.1.a
    text: van ten hoogste zes maanden per jaar;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
  - number: 8.15.1.b
    text: om belangrijke redenen gedurende een eenmalige periode van ten hoogste twaalf maanden;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
  - number: 8.15.1.c
    text: voor de vervulling van militaire verplichtingen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
  - number: 8.15.1.d
    text: wegens uitzending voor het verrichten van werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
  - number: 8.15.2
    text: |-
      Onverminderd het vijfde lid eindigt het rechtmatig verblijf evenmin door het overlijden van de vreemdeling, bedoeld
      in [artikel 8.7, eerste lid][ref1], bij wie hij in Nederland verbleef:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.15.2.a
    text: indien hij ten minste een jaar voor het overlijden van die vreemdeling in Nederland verbleef;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
  - number: 8.15.2.b
    text: |-
      voor voltooiing van de studie, indien hij in Nederland verbleef als het kind van die vreemdeling en voor studie is
      ingeschreven bij een onderwijsinstelling, dan wel indien hij de verzorgende ouder is van een zodanig kind.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
  - number: 8.15.3
    text: |-
      Het tweede lid, aanhef en onder b, is van overeenkomstige toepassing bij het vertrek van de vreemdeling, bedoeld in
      [artikel 8.7, eerste lid][ref1], bij wie de vreemdeling in Nederland verbleef.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.15.4
    text: |-
      Onverminderd het vijfde lid eindigt het rechtmatig verblijf evenmin door de ontbinding of nietigverklaring van het
      huwelijk of de beëindiging van het geregistreerde partnerschap:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
  - number: 8.15.4.a
    text: |-
      indien het huwelijk voor het begin van de gerechtelijke procedure tot scheiding of nietigverklaring,
      onderscheidenlijk het partnerschap voor beëindiging daarvan, ten minste drie jaar heeft geduurd, waarvan de
      vreemdeling ten minste één jaar in Nederland heeft verbleven;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
  - number: 8.15.4.b
    text: |-
      indien het gezag over de kinderen bij overeenkomst tussen de voormalige echtgenoten of partners, dan wel bij
      rechterlijke beslissing aan de vreemdeling is toegewezen;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
  - number: 8.15.4.c
    text: |-
      voor de duur waarvoor de omgang is voorgeschreven, indien de vreemdeling op grond van een overeenkomst of
      gerechtelijke beslissing het omgangsrecht met betrekking tot een minderjarig kind heeft en de omgang ingevolge een
      rechterlijke beslissing in Nederland moet plaatsvinden, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
  - number: 8.15.4.d
    text: indien klemmende redenen van humanitaire aard tot aanvaarding van voortgezet verblijf nopen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
  - number: 8.15.5
    text: |-
      In afwijking van het tweede lid, onder a, en het vierde lid, kan het rechtmatig verblijf van de vreemdeling,
      bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die niet de nationaliteit van een staat bezit als
      bedoeld in het eerste lid van dat artikel, worden beëindigd indien hij een onredelijke belasting voor het sociale
      bijstandsstelsel vormt, tenzij hij het duurzaam verblijfsrecht, bedoeld in [artikel 8.17][ref2] heeft verkregen,
      of hij:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.15.5.a
    text: werknemer of zelfstandige is;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
  - number: 8.15.5.b
    text: |-
      voor zichzelf en zijn familieleden beschikt over voldoende middelen van bestaan om te voorkomen dat zij tijdens
      hun verblijf in Nederland ten laste komen van de algemene middelen, en beschikt over een verzekering die de
      ziektekosten in Nederland volledig dekt; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
  - number: 8.15.5.c
    text: |-
      gezinslid is van het reeds in Nederland gevormde gezin van een persoon die voldoet aan de voorwaarden, bedoeld
      onder a of b.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
  - number: 8.15.6
    text: |-
      Voor de toepassing van het vijfde lid, onder b, beschikt de vreemdeling met een inkomen ter hoogte van het
      normbedrag dat ingevolge de [Wet werk en bijstand][ref1] voor de desbetreffende categorie is vastgesteld, in ieder
      geval over voldoende middelen van bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 8.16.1
    text: |-
      Onverminderd de [artikelen 8.22][ref1] en [8.23][ref2] eindigt het rechtmatig verblijf niet zolang de vreemdeling
      aan de in de [artikelen 8.12 tot en met 8.15][ref3] genoemde voorwaarden voldoet. In specifieke gevallen van
      redelijke twijfel kan Onze Minister onderzoeken of aan de voorwaarden wordt voldaan. Het onderzoek geschiedt
      niet stelselmatig. Een beroep op de algemene middelen leidt niet zonder meer tot beëindiging van het rechtmatig
      verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.16
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.16.2
    text: |-
      Onverminderd de [artikelen 8.22][ref1] en [8.23][ref2], eindigt het rechtmatig verblijf niet zolang de vreemdeling,
      bedoeld in [artikel 8.7, eerste lid][ref3]:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.16
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.16.2.a
    text: werknemer of zelfstandige is; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.16
  - number: 8.16.2.b
    text: |-
      naar Nederland is gekomen om werk te zoeken en hij kan bewijzen dat hij nog steeds werk zoekt en een reële kans op
      werk heeft.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.16
  - number: 8.17.1
    text: 'Duurzaam verblijfsrecht in Nederland heeft:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.1.a
    text: |-
      de vreemdeling, bedoeld in [artikel 8.7, eerste lid][ref1], die gedurende vijf jaar ononderbroken rechtmatig
      verblijf in Nederland heeft gehad;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.17.1.b
    text: |-
      de vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die gedurende vijf jaar ononderbroken
      rechtmatig verblijf heeft gehad bij een vreemdeling als bedoeld onder a, waarbij mede wordt betrokken de periode
      waarin hij voldeed aan de voorwaarden van [artikel 8.15, vijfde lid, onder a, b of c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.17.2
    text: |-
      Voor de berekening van het ononderbroken verblijf, bedoeld in het eerste lid, vormt geen onderbreking een
      afwezigheid uit Nederland:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.2.a
    text: van ten hoogste zes maanden per jaar;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.2.b
    text: om belangrijke redenen gedurende een eenmalige periode van ten hoogste twaalf achtereenvolgende maanden;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.2.c
    text: voor de vervulling van militaire verplichtingen; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.2.d
    text: wegens uitzending voor het verrichten van werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.3
    text: 'De periode van vijf jaar, bedoeld in eerste lid, geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.3.a
    text: |-
      de werknemer of zelfstandige die langer dan drie jaar ononderbroken in Nederland heeft gewoond, die gedurende
      de laatste twaalf maanden in Nederland werkzaamheden heeft verricht en die op het tijdstip waarop hij zijn
      werkzaamheid staakt, de 65-jarige leeftijd heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.3.b
    text: |-
      de werknemer die langer dan drie jaar ononderbroken in Nederland heeft gewoond, die gedurende de laatste twaalf
      maanden in Nederland werkzaamheden heeft verricht en die zijn werkzaamheden staakt ten gevolge van vervroegde
      uittreding;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.3.c
    text: |-
      de werknemer of zelfstandige die zijn werkzaamheden na meer dan twee jaar ononderbroken verblijf in Nederland
      staakt als gevolg van blijvende arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.3.d
    text: |-
      de werknemer of zelfstandige die in Nederland zijn werkzaamheden staakt wegens blijvende arbeidsongeschiktheid als
      gevolg van een arbeidsongeval of een beroepsziekte waardoor recht is ontstaan op een uitkering die geheel of ten
      dele ten laste komt van een Nederlandse instelling;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.3.e
    text: |-
      de werknemer of zelfstandige die, na drie jaar ononderbroken in Nederland werkzaam te zijn geweest en in Nederland
      te hebben verbleven, werkzaam is in een andere lidstaat, zijn woning in Nederland aanhoudt en daar ten minste
      eenmaal per week naar terugkeert.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.4
    text: 'Bij de toepassing van het derde lid worden als arbeidsperioden mede in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.4.a
    text: |-
      het naar behoren door het Uitvoeringsinstituut werknemersverzekeringen vastgestelde tijdvak van onvrijwillige
      werkloosheid waarin de vreemdeling wegens een niet-toerekenbare reden niet heeft gewerkt;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.4.b
    text: de periode van afwezigheid of arbeidsonderbreking wegens ziekte of ongeval.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.5
    text: |-
      Bij de toepassing van het derde lid, onder a tot en met d, worden de tijdvakken van werkzaamheid in de lidstaat
      waarin de betrokkene werkzaam is, aangemerkt als in Nederland vervulde tijdvakken van werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.6
    text: |-
      De in het derde lid, onder a en b, gestelde voorwaarden inzake de duur van het verblijf en van de werkzaamheid, en
      de in het derde lid, onder c en d, gestelde voorwaarde inzake de duur van het verblijf, zijn niet van toepassing
      indien de echtgenoot of de geregistreerde partner van de werknemer of zelfstandige Nederlander is of de Nederlandse
      nationaliteit heeft verloren als gevolg van het huwelijk met die werknemer of zelfstandige.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.7
    text: |-
      De bij hem in Nederland verblijvende familieleden van de werknemer of zelfstandige hebben duurzaam verblijfsrecht,
      indien de werknemer of zelfstandige een nationaliteit als bedoeld in [artikel 8.7, eerste lid][ref1], bezit en:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.17.7.a
    text: op grond van het derde tot en met het zesde lid duurzaam verblijfsrecht in Nederland heeft verkregen; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.7.b
    text: |-
      tijdens zijn werkzame leven is overleden, voordat hij op grond van het derde tot en met het zesde lid duurzaam
      verblijfsrecht in Nederland verkreeg, en:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.7.b.1°
    text: hij op het tijdstip van zijn overlijden gedurende twee jaar ononderbroken in Nederland heeft verbleven;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.7.b.2°
    text: zijn overlijden het gevolg was van een arbeidsongeval of beroepsziekte; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: 8.17.7.b.3°
    text: zijn echtgenoot de Nederlandse nationaliteit als gevolg van hun huwelijk heeft verloren.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.17
  - number: '8.18'
    text: 'Duurzaam verblijfsrecht kan slechts worden beëindigd:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.18
  - number: 8.18.a
    text: bij afwezigheid van meer dan twee achtereenvolgende jaren uit Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.18
  - number: 8.18.b
    text: indien ernstige redenen van openbare orde of openbare veiligheid daartoe nopen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.18
  - number: '8.19'
    text: |-
      Onze Minister verstrekt de vreemdeling, bedoeld in [artikel 8.7 eerste lid][ref1], met duurzaam verblijfsrecht
      op aanvraag en na verificatie van de verblijfsduur een verblijfsdocument, waarvan het model wordt vastgesteld bij
      ministeriële regeling. Het verblijfsdocument wordt zo spoedig mogelijk verstrekt. [Artikel 25 van de Wet][ref2] is
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel25
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.19
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '25'
  - number: 8.20.1
    text: |-
      Onze Minister verstrekt de vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], met
      duurzaam verblijfsrecht en die niet de nationaliteit bezit van een staat als bedoeld in het eerste lid van
      dat artikel, op aanvraag een verblijfsdocument, waarvan het model wordt vastgesteld bij ministeriële regeling.
      [Artikel 25, tweede en derde lid, van de Wet][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel25
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.20
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '25'
  - number: 8.20.2
    text: |-
      De aanvraag, bedoeld in het eerste lid, wordt ingediend voor het verstrijken van de geldigheidsduur van het
      verblijfsdocument, bedoeld in [artikel 8.13, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.20
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: '8.21'
    text: |-
      Beëindiging van het rechtmatig verblijf van de vreemdeling vormt een onderbreking vanaf het tijdstip waarop de
      vreemdeling Nederland heeft verlaten.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.21
  - number: 8.22.1
    text: |-
      Onze Minister kan het rechtmatig verblijf ontzeggen of beëindigen, om redenen van openbare orde of openbare
      veiligheid, indien het persoonlijke gedrag van de vreemdeling een actuele, werkelijke en ernstige bedreiging voor
      een fundamenteel belang van de samenleving vormt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.22
  - number: 8.22.2
    text: |-
      Onze Minister kan bij de afgifte van de verklaring van inschrijving of het verblijfsdocument aan de lidstaat van
      oorsprong of andere lidstaten verzoeken om inlichtingen omtrent de gerechtelijke antecedenten.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.22
  - number: 8.22.3
    text: |-
      Tenzij dwingende redenen van openbare veiligheid daartoe nopen, wordt het rechtmatig verblijf niet beëindigd,
      indien de vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.22
  - number: 8.22.3.a
    text: in de voorafgaande tien jaar in Nederland heeft gewoond; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.22
  - number: 8.22.3.b
    text: minderjarig is, tenzij verwijdering noodzakelijk is in het belang van het kind.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.22
  - number: 8.22.4
    text: |-
      De aanvraag tot opheffing van de ongewenstverklaring kan slechts worden gedaan nadat sinds de verwijdering om
      redenen van openbare orde of openbare veiligheid een redelijke termijn is verstreken of indien die verwijdering
      tenminste drie jaren voorafgaand aan de aanvraag heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.22
  - number: 8.22.5
    text: Binnen zes maanden wordt een beschikking gegeven op de in het vierde lid bedoelde aanvraag.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.22
  - number: 8.22.6
    text: |-
      Indien de verwijdering niet binnen twee jaren na de ontzegging of beëindiging, bedoeld in het eerste lid, heeft
      plaatsgevonden, onderzoekt Onze Minister of de bedreiging, bedoeld in het eerste lid, nog werkelijk en actueel is,
      waarbij Onze Minister sinds die ontzegging of beëindiging eventueel opgetreden wijzigingen in materiële zin in de
      omstandigheden beoordeelt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.22
  - number: 8.23.1
    text: |-
      Onze Minister kan het rechtmatig verblijf op grond van de volksgezondheid ontzeggen of beëindigen in het geval van
      potentieel epidemische ziekten als gedefinieerd in de relevante instrumenten van de Wereldgezondheidsorganisatie
      dan wel in geval van andere infectieziekten of besmettelijke parasitaire ziekten, ten aanzien waarvan in Nederland
      beschermende regelingen ten aanzien van Nederlanders worden getroffen.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.23
  - number: 8.23.2
    text: |-
      Rechtmatig verblijf wordt niet op grond van de volksgezondheid beëindigd, indien de ziekte langer dan drie maanden
      na inreis van de vreemdeling is opgetreden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.23
  - number: 8.23.3
    text: |-
      Onze Minister kan de vreemdeling binnen drie maanden na inreis onderwerpen aan een kosteloos medisch onderzoek
      indien ernstige aanwijzingen daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.23
  - number: 8.24.1
    text: |-
      De uitzetting van de vreemdeling, ten aanzien van wie het rechtmatig verblijf om redenen van openbare
      orde, openbare veiligheid of volksgezondheid is geweigerd of beëindigd, blijft, indien de vreemdeling de
      voorzieningenrechter heeft verzocht een voorlopige voorziening te treffen, achterwege tot op dat verzoek is
      beslist, tenzij het besluit:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.24
  - number: 8.24.1.a
    text: |-
      met toepassing van [artikel 4:6 van de Algemene wet bestuursrecht][ref1] is genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 8.24.1.b
    text: reeds door de rechtbank of de voorzieningenrechter is beoordeeld; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.24
  - number: 8.24.1.c
    text: gebaseerd is op dwingende redenen van openbare veiligheid.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.24
  - number: 8.24.2
    text: |-
      De toegang van de vreemdeling die voor de behandeling van een bezwaarschrift, beroepschrift, dan wel een verzoek om
      een voorlopige voorziening, gericht tegen beëindiging van het rechtmatig verblijf, geen gemachtigde heeft gesteld,
      wordt niet geweigerd, tenzij:
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.24
  - number: 8.24.2.a
    text: zijn aanwezigheid de openbare orde of de openbare veiligheid ernstig zal verstoren; of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.24
  - number: 8.24.2.b
    text: het bezwaar of beroep is gericht tegen de weigering van toegang.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.24
  - number: 8.24.3
    text: |-
      Onze Minister kan de vertrektermijn, bedoeld in [artikel 62, vierde lid, van de Wet][ref1] slechts in naar behoren
      aangetoonde dringende gevallen verkorten tot minder dan vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.24
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
  - number: '8.25'
    text: |-
      Onze Minister kan het rechtmatig verblijf beëindigen, indien de vreemdeling onjuiste gegevens heeft verstrekt dan
      wel gegevens heeft achtergehouden terwijl die gegevens zouden hebben geleid tot weigering van toegang of verblijf.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.25
  - number: '8.26'
    text: 'Onze Minister kan regels stellen over de rechten die vreemdelingen ontlenen aan de volgende verdragen:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.26
  - number: 8.26.a
    text: het Europees Vestigingsverdrag (Trb. 1957, 20);
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.26
  - number: 8.26.b
    text: het Vluchtelingenverdrag (Trb. 1954, 88);
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.26
  - number: 8.26.c
    text: het Verdrag betreffende de status van staatlozen (Trb. 1955, 42);
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.26
  - number: 8.26.d
    text: |-
      de Overeenkomst waarbij een associatie tot stand wordt gebracht tussen de Europese Economische Gemeenschap en
      Turkije (PB EG 1964, L 217) en het Associatiebesluit 1/80 van de Associatieraad EEG/Turkije;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.26
  - number: 8.26.e
    text: het Nederlands-Duits Vestigingsverdrag (Stb. 1906, 279);
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.26
  - number: 8.26.f
    text: het Nederlands-Zwitsers Tractaat (Stb. 1878, nr. 137);
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.26
  - number: 8.26.g
    text: het Nederlands-Amerikaans Vriendschapsverdrag (Trb. 1956, 40);
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.26
  - number: 8.26.h
    text: |-
      de Overeenkomst tussen het Koninkrijk der Nederlanden en de Republiek Suriname inzake het verblijf en de vestiging
      van wederzijde onderdanen (1975) (Trb. 1975, 133);
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.26
  - number: 8.26.i
    text: |-
      de Overeenkomst tussen het Koninkrijk der Nederlanden en de Republiek Suriname inzake de binnenkomst en het
      verblijf van wederzijdse onderdanen met bijlage en protocol inzake verkregen rechten (1981) (Trb. 1981, 35);
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.26
  - number: 8.26.j
    text: |-
      de Associatieverdragen EG met Hongarije (PbEG 1993, L 347), Polen (PbEG 1993, L 348), Roemenië (PbEG 1994, L 357),
      Bulgarije (PbEG 1994, L 358), Slowakije (PbEG 1994, L 359) en Tsjechië (PbEG 1994, L 360);
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.26
  - number: 8.26.k
    text: |-
      de Overeenkomst tussen de Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat,
      anderzijds, over het vrije verkeer van personen (Trb. 2000, 16 en 86).
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel8.26
  - number: '9.1'
    text: 'Bij de berekening van de periode van rechtmatig verblijf, als bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.1
  - number: 9.1.a
    text: |-
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], wordt mede betrokken de periode van verblijf op
      grond van de artikelen 9, 9a of 10 van de Vreemdelingenwet alsmede de periode waarin verblijfsrecht werd ontleend
      aan het Associatiebesluit 1/80 van de Associatieraad EEG/Turkije;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 9.1.b
    text: |-
      [artikel 8, onder f, g en h, van de Wet][ref1], wordt mede betrokken de periode van rechtmatig verblijf als bedoeld
      in artikel 1b, onder 3, van de Vreemdelingenwet;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 9.1.c
    text: |-
      [artikel 8, onder i, van de Wet][ref1], wordt mede betrokken de periode van rechtmatig verblijf als bedoeld in
      artikel 1b, onder 4, van de Vreemdelingenwet;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 9.1.d
    text: |-
      [artikel 8, onder j, van de Wet][ref1], wordt mede betrokken de periode van rechtmatig verblijf op grond van
      artikel 1b, onder 5 van de Vreemdelingenwet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '9.3'
    text: |-
      Voor de toepassing van [artikel 3.14, onder c][ref1], wordt met een minderjarig kind gelijk gesteld het biologische
      of het juridische kind:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 9.3.a
    text: |-
      dat nog geen twintig jaren oud is en niet gehuwd of geregistreerd is, of is geweest, of met toepassing van
      [artikel 253ha van Boek I van het Burgerlijk Wetboek][ref1] meerderjarig is verklaard;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253ha
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253ha
  - number: 9.3.b
    text: |-
      wiens aanvraag tot het verlenen van een vergunning tot verblijf in het kader van gezinshereniging is afgewezen op
      de enkele grond dat de ouder bij wie hij wil verblijven, niet beschikt over passende huisvesting;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.3
  - number: 9.3.c
    text: |-
      wiens ouder bij wie hij wil verblijven, sedert het tijdstip waarop de vreemdeling nog geen vijftien jaren oud was,
      als woningzoekende is ingeschreven, en
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.3
  - number: 9.3.d
    text: dat tegelijkertijd met de overige gezinsleden om verblijf in Nederland vraagt.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.3
  - number: 9.4.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met voortgezet verblijf als bedoeld in [artikel 3.4, eerste lid, onder u][ref2], worden
      verleend aan de vreemdeling die inmiddels achttien jaar oud is en aan wie een vergunning tot verblijf onder de
      beperking verband houdende met verblijf als alleenstaande minderjarige asielzoeker is verleend op grond van een
      asielaanvraag, welke is ingediend vóór een door Onze Minister te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 9.4.2
    text: |-
      De aanvraag wordt niet afgewezen op de grond dat de vreemdeling nog geen drie jaren in Nederland verblijft als
      houder van een verblijfsvergunning als bedoeld in [artikel 3.51, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 9.4.3
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder c, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 9.5.1
    text: |-
      Gedurende drie jaren na het tijdstip van inwerkingtreding van de Wet, kan de verblijfsvergunning voor bepaalde
      tijd, bedoeld in [artikel 14 van de Wet][ref1], onder een beperking verband houdend met voortgezet verblijf, als
      bedoeld in [artikel 3.4, eerste lid, onder u][ref2], worden verleend aan de vreemdeling, die voor het tijdstip van
      inwerkingtreding van deWet:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 9.5.1.a
    text: |-
      drie jaren in Nederland heeft verbleven als houder van een verblijfsvergunning onder een beperking verband houdend
      met gezinshereniging of gezinsvorming met een persoon met niet-tijdelijk verblijfsrecht, of
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.5
  - number: 9.5.1.b
    text: |-
      als echtgenoot, partner of kind, waaronder begrepen pleegkind of adoptiefkind, van een persoon met niet-tijdelijk
      verblijfsrecht verblijf was toegelaten, indien deze persoon is overleden.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.5
  - number: 9.5.2
    text: |-
      De verblijfsvergunning kan worden verleend, indien de vreemdeling rechtmatig verblijf in Nederland heeft behouden
      en het hoofdverblijf niet buiten Nederland heeft gevestigd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.5
  - number: 9.6.1
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden verleend onder
      een beperking verband houdend met het zoeken en verrichten van arbeid al dan niet in loondienst, als bedoeld in
      [artikel 3.4, eerste lid, onder h][ref2], aan de vreemdeling wiens huwelijk met een persoon met niet-tijdelijk
      verblijfsrecht na drie jaar is ontwricht of ontbonden, indien de vreemdeling op een door Onze Minister te bepalen
      tijdstip op grond van dat huwelijk was toegelaten en één jaar direct voorafgaande aan ontwrichting of ontbinding
      van het huwelijk rechtmatig verblijf als bedoeld in [artikel 8, onder a, van de Wet][ref3] in Nederland had.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 9.6.2
    text: |-
      De verblijfsvergunning wordt verleend voor de duur van ten hoogste één jaar, te berekenen vanaf de datum van
      verbreking of ontwrichting van het huwelijk, of zoveel langer als de vreemdeling wegens het ontbreken van een
      verblijfsvergunning geen toegang tot de arbeidsmarkt had.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.6
  - number: 9.6.3
    text: |-
      De verblijfsvergunning kan worden gewijzigd in een verblijfsvergunning onder een beperking verband houdend met
      voortgezet verblijf, indien de vreemdeling uiterlijk op het moment waarop de geldigheidsduur verstrijkt, beschikt
      over een arbeidsplaats voor nog een jaar waarmee hij zelfstandig en duurzaam voldoende middelen van bestaan
      verwerft.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.6
  - number: '9.7'
    text: |-
      [Artikel 3.41, eerste lid, onder a][ref1], blijft buiten toepassing zolang geen onderwijsinstellingen bij
      ministeriële regeling zijn aangewezen. In plaats daarvan blijft het oude recht van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: '9.8'
    text: |-
      Voor de toepassing van de [artikelen 3.20, tweede lid][ref1], en [3.77, eerste lid, onder c][ref2],
      wordt onder taakstraf mede verstaan de voor inwerkingtreding van de
      __REF002___________________________________________________________________________________________________________
      _____________________________________________________________________________________________________________
      opgelegde straf tot het verrichten van arbeid ten algemene nutte, bedoeld in
      [artikel 22b van het Wetboek van Strafrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011615
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel22b
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011615
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 22b
  - number: 9.9.1
    text: |-
      Bij de toepassing van de [artikelen 3.86, eerste lid, onder c][ref1],[3.95][ref2] en [3.98][ref3] blijft buiten
      beschouwing de periode van de terbeschikkingstelling, die op het tijdstip van inwerkingtreding van de Wet reeds
      was beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '3'
  - number: 9.9.2
    text: |-
      Het eerste lid is niet van toepassing, indien de vreemdeling na beëindiging van de maatregel wederom een misdrijf
      heeft gepleegd, waartegen een gevangenisstraf van drie jaren of meer is bedreigd.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.9
  - number: '9.10'
    text: |-
      Indien de vreemdeling wegens afloop van de geldigheidsduur van de verblijfsvergunning voor bepaalde tijd, bedoeld
      in [artikel 28 van de Wet][ref1], die hem is verleend na omzetting van rechtswege van de voorwaardelijke vergunning
      tot verblijf op grond van [artikel 115 van de Wet][ref2], een aanvraag tot het verlenen van de verblijfsvergunning
      voor bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref3] indient, kan deze verblijfsvergunning worden verleend
      voor minder dan drie achtereenvolgende jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel115
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '115'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '28'
  - number: '9.11'
    text: Het Vreemdelingenbesluit wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.11
  - number: '9.12'
    text: |-
      Indien het bij koninklijke boodschap van 16 september 1999 ingediende voorstel van wet tot algehele herziening van
      de Vreemdelingenwet (Vreemdelingenwet 2000) (Kamerstukken I 1999–2000, nr. 26 732, nr. 263) nadat het tot wet is
      verheven, in werking treedt, treedt dit besluit op hetzelfde tijdstip in werking.
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.12
  - number: '9.13'
    text: 'Dit besluit wordt aangehaald als: Vreemdelingenbesluit 2000.'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel9.13
