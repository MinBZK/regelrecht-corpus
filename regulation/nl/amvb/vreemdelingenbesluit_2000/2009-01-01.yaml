articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.1
  - number: 1.1.a
    text: |-
      Benelux-onderdanen: de onderdanen van de staten die partij zijn bij het op 3 februari 1958 te 's-Gravenhage tot
      stand gekomen Verdrag tot instelling van de Benelux Economische Unie (Trb. 1958, 18);
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.1
  - number: 1.1.b
    text: |-
      Beneluxgebied: het gezamenlijke grondgebied in Europa van het Koninkrijk België, van het Groothertogdom Luxemburg
      en van het Koninkrijk der Nederlanden;
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.1
  - number: 1.1.c
    text: 'cruiseschip: hetgeen daaronder in de Schengengrenscode wordt verstaan;'
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel1.1
  - number: 1.1.d
    text: |-
