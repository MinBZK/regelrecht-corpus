        artikel: 1d
  - number: 3.4.1.z
    text: |-
      werkzaamheid in het kader van grensoverschrijdende dienstverlening, als bedoeld in
      [artikel 1e van het Besluit uitvoering Wet arbeid vreemdelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007523#Artikel1e
    url: https://wetten.overheid.nl/BWBR0011825/2009-01-01#Artikel3.4
    references:
