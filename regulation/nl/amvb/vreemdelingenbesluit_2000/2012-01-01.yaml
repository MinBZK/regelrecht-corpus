  - number: '3.84'
    text: |-
      1 De aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning voor bepaalde tijd, bedoeld
      in [artikel 14 van de Wet][ref1], wordt niet op grond van [artikel 18, eerste lid, onder c, van de Wet][ref2]
      afgewezen om reden dat de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden die
      tot afwijzing van de oorspronkelijke aanvraag tot het verlenen of verlengen zouden hebben geleid, indien er sedert
      de verlening, verlenging of wijziging van de verblijfsvergunning een periode van twaalf jaren is verstreken.

      2 Het eerste lid is niet van toepassing, indien de houder van de Europese blauwe kaart die kaart heeft vervalst,
      veranderd of op frauduleuze wijze heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
