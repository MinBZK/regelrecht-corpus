  - number: '3.109'
    text: |-
      1 De aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28 van de Wet][ref1], wordt door de vreemdeling niet eerder ingediend dan zes dagen nadat hij
      overeenkomstig door Onze Minister gestelde regels te kennen heeft gegeven die aanvraag in te willen dienen.

      2 Gedurende de in het eerste lid bedoelde termijn wordt de vreemdeling in de gelegenheid gesteld om te worden
      voorgelicht over de asielprocedure en om zich op de asielprocedure voor te bereiden en zich daartoe te laten
      bijstaan. Aan de vreemdeling die te kennen geeft de in het eerste lid bedoelde aanvraag in te willen dienen
      wordt tijdig mededeling gedaan van de hem toekomende bevoegdheid zich bij een gehoor als bedoeld in de
      [artikelen 3.112, eerste lid][ref2] en [3.113, tweede lid][ref3], te doen bijstaan.

      3 Gedurende de in het eerste lid bedoelde termijn worden de vreemdeling van overheidswege geen vragen gesteld naar
      zijn asielmotieven.

      4 Van de vreemdeling die te kennen geeft de in het eerste lid bedoelde aanvraag in te willen dienen, worden door
      Onze Minister identificatiefoto’s vervaardigd en wordt een dactyloscopisch signalement opgemaakt. De vreemdeling
      verleent hieraan zijn medewerking.

      5 De vreemdeling die te kennen geeft de in het eerste lid bedoelde aanvraag in te willen dienen wordt een medisch
      onderzoek aangeboden. Voor dit onderzoek is de schriftelijke toestemming van de vreemdeling vereist.

      6 In afwijking van het eerste lid wordt geen termijn gesteld indien:

      a. de vreemdeling een gevaar vormt voor de openbare orde of nationale veiligheid;

      b. de vreemdeling overlast bezorgt aan vreemdelingen die in een opvangvoorziening verblijven, aan personen die
      werkzaam zijn in de voorziening of aan anderen;

      c. de vreemdeling reeds eerder een aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in artikel 28 van
      de Wet, heeft ingediend, of

      d. de vreemdeling rechtens zijn vrijheid is ontnomen op grond van [artikel 59 van de Wet][ref4], tenzij de aanvraag
      wordt ingediend in een Aanmeldcentrum.

      7 Bij ministeriële regeling kan worden bepaald dat de in het eerste lid bedoelde termijn niet van toepassing is
      indien de aanvraag wordt ingediend in het Aanmeldcentrum Schiphol.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3.112
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3.113
