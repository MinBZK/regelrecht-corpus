  - number: '4.38'
    text: |-
      1 De vreemdeling verstrekt op vordering van Onze Minister de gegevens, bedoeld in de
      [artikelen 4.39 tot en met 4.44][ref1], binnen de in de vordering aangegeven tijd.

      2 Indien daartoe in het belang van het toezicht op vreemdelingen gegronde reden bestaat kan de in het voorgaande
      lid bedoelde vordering inhouden dat de vreemdeling de gegevens in persoon verstrekt.

      3 In het belang van de vreemdelingenregistratie kan een vordering als bedoeld in het eerste lid bij algemene
      bekendmaking worden gedaan.

      4 Indien de vreemdeling jonger is dan twaalf jaar, dan kan de vordering, bedoeld in het eerste tot en met derde
      lid, worden gericht tot de wettelijke vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.39
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.38
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4.39'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '3'
  - number: '4.39'
    text: |-
      De vreemdeling die geen rechtmatig verblijf heeft, doet onmiddellijk van zijn aanwezigheid in persoon mededeling
      aan de korpschef van het regionale politiekorps waarin de gemeente waar hij verblijft is gelegen.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.39
  - number: '4.40'
    text: |-
      Personen die nachtverblijf verschaffen aan een vreemdeling, van wie zij weten of redelijkerwijs kunnen vermoeden
      dat deze vreemdeling niet rechtmatig in Nederland verblijft als bedoeld in [artikel 8 van de Wet][ref1], doen
      daarvan onmiddellijk mededeling aan de korpschef van het regionale politiekorps waarin de gemeente waar de
      vreemdeling verblijft is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.40
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '4.41'
    text: |-
      Werkgevers, van wie bij Onze Minister bekend is dat zij een vreemdeling in dienst hebben gehad die niet rechtmatig
      verbleef of aan wie het niet was toegestaan arbeid te verrichten, verstrekken aan Onze Minister, op diens
      vordering, onmiddellijk de gegevens omtrent de vreemdeling die bij hen tewerkgesteld wordt, in dienst is of in
      dienst is geweest. Onze Minister kan een termijn stellen waarbinnen de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.41
  - number: '4.42'
    text: |-
      1 De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder i, van de Wet][ref1] en die arbeid
      gaat zoeken of arbeid gaat verrichten, deelt dit onmiddellijk mee aan de korpschef van het regionale politiekorps,
      waarin de gemeente waar de vreemdeling verblijft is gelegen.

      2 Het eerste lid is niet van toepassing op de vreemdeling die:

      a. houder is van een geldige machtiging tot voorlopig verblijf afgegeven voor een verblijfsdoel waarbij het
      verrichten van arbeid is toegestaan;

      b. kan aantonen dat hij naar Nederland is gekomen voor het verrichten van arbeid gedurende ten hoogste drie
      maanden, te rekenen vanaf het tijdstip van zijn binnenkomst, of

      c. naar Nederland is gekomen om aan te monsteren of als zeeman werk te zoeken aan boord van een zeeschip.

      3 Het tweede lid is niet van toepassing indien de arbeid geheel of gedeeltelijk bestaat uit het verrichten
      van seksuele handelingen met derden of het verlenen van seksuele diensten aan derden, tenzij de vreemdeling
      gemeenschapsonderdaan is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.42
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '4.43'
    text: |-
      1 De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder a, van de Wet][ref1] en die niet langer
      voldoet aan de beperking waaronder de verblijfsvergunning is verleend, deelt dit onmiddellijk mee aan de korpschef
      van het regionale politiekorps waarin de gemeente waar de vreemdeling verblijft is gelegen.

      2 Onverminderd het eerste lid, stelt de houder van de door Onze Minister afgegeven Europese blauwe kaart, voor
      zover deze nog geen drie jaar als houder van die kaart in Nederland verblijft, Onze Minister vooraf in kennis van
      zijn voornemen om een arbeidsovereenkomst te sluiten met een andere werkgever. Hij stelt Onze Minister zo mogelijk
      vooraf in kennis van zijn werkloosheid en van andere wijzigingen die van belang kunnen zijn voor de intrekking van
      de Europese blauwe kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.43
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '4.44'
    text: |-
      De vreemdeling die rechtmatig verblijft als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1] en wiens document, bedoeld in
      [artikel 9 van de Wet][ref2], waaruit het rechtmatig verblijf blijkt, vermist wordt, verloren is gegaan of
      ondeugdelijk is geworden voor identificatie, doet daarvan onmiddellijk in persoon aangifte bij de korpschef van het
      regionale politiekorps waarin de gemeente waar hij woon- of verblijfplaats heeft is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '9'
  - number: '4.45'
    text: |-
      De medewerking van de vreemdeling, bedoeld in [artikel 54, eerste lid, onderdeel c, van de Wet][ref1], bestaat uit:

      a. het op vordering van een ambtenaar belast met de grensbewaking of een ambtenaar belast met het toezicht op
      vreemdelingen, beschikbaar stellen van een goedgelijkende pasfoto, en

      b. het zich laten fotograferen en het laten afnemen van vingerafdrukken, indien daartoe naar het oordeel van de
      ambtenaar, belast met de grensbewaking of een ambtenaar belast met het toezicht op vreemdelingen, gegronde reden
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
  - number: '4.46'
    text: |-
      1 De vreemdeling die naar Nederland is gekomen voor een verblijf van langer dan drie maanden, werkt op grond van
      [artikel 54, eerste lid, onderdeel d, van de Wet][ref1] mee aan een onderzoek naar tuberculose.

      2 Het eerste lid geldt niet voor onderdanen van een staat die partij is bij het Verdrag betreffende de werking van
      de Europese Unie, onderdanen van een staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte, Australië, Canada, Israël, Japan, Monaco, Nieuw Zeeland, Suriname, de Verenigde Staten van Amerika en
      Zwitserland.

      Het eerste lid is evenmin van toepassing op familieleden als bedoeld in
      [artikel 8.7, tweede, derde en vierde lid][ref2], die voor hun komst naar Nederland reeds rechtmatig verblijf
      hebben verkregen in een andere staat die partij is bij het Verdrag betreffende de werking van de Europese Unie of
      de Overeenkomst betreffende de Europese Economische Ruimte dan wel Zwitserland en die zich vanuit die staat dan wel
      Zwitserland naar Nederland verplaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8.7
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.46
