        artikel: '21'
  - number: '1.7'
    text: |-
      1 De commissie adviseert schriftelijk en met redenen omkleed.

      2 De adviezen vermelden de namen van de personen die ter vergadering aanwezig zijn geweest. Zij vermelden tevens
      met welke stemmenverhouding zij zijn vastgesteld.

      3 Het advies wordt door de voorzitter en de secretaris ondertekend.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel1.7
  - number: '2.1'
    text: |-
      1 De toegang wordt geweigerd op grond van [artikel 3, eerste lid, van de Wet][ref1], indien de vreemdeling het
      doel van het voorgenomen verblijf of de verblijfsomstandigheden onvoldoende aannemelijk heeft gemaakt, dan wel ter
      staving daarvan onvoldoende documenten heeft overgelegd.

      2 Het eerste lid is niet van toepassing op de vreemdeling die rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onder e, dan wel l, van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel2.1
