        artikel: '4.24'
        hoofdstuk: '4'
        afdeling: '2'
  - number: '4.29'
    text: |-
      1 De ambtenaren belast met het toezicht op vreemdelingen, stellen in het reis- en identiteitspapier van een
      vreemdeling aantekeningen omtrent:

      a. aanmelding of vervoeging bij een korpschef;

      b. de woon- of verblijfplaats binnen Nederland en vertrek naar het buitenland;

      c. het verlenen, het verlengen van de geldigheidsduur of het intrekken van een verblijfsvergunning voor bepaalde
      tijd;

      d. het verlenen of het intrekken van een verblijfsvergunning voor onbepaalde tijd;

      e. het opleggen van een individuele verplichting tot periodieke aanmelding overeenkomstig
      [artikel 54, tweede lid, van de Wet][ref1];

      f. het beperken van de vrijheid van beweging overeenkomstig [artikel 56 van de Wet][ref2];

      g. vertrek of uitzetting uit Nederland;

      h. ongewenstverklaring;

      i. de datum en plaats van inreis in Nederland, en

      j. het inreisverbod.

      2 Elke doorhaling of vervallenverklaring van een in het reis- of identiteitspapier van een vreemdeling gestelde
      aantekening wordt door de ambtenaar die de doorhaling of vervallenverklaring verricht, gedateerd en van diens
      paraaf voorzien.

      3 In afwijking van het eerste lid, wordt een aantekening op een aan de vreemdeling te verstrekken afzonderlijk
      inlegblad gesteld, indien:

      a. het reis- of identiteitspapier van de vreemdeling zich niet voor het stellen van een zodanige aantekening leent;

      b. de vreemdeling houder is van een buitenlands vreemdelingen- of vluchtelingenpaspoort;

      c. de vreemdeling in Nederland rechtmatig verblijft als bedoeld in [artikel 8, onder f, van de Wet][ref3]
      indien de vreemdeling een aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 14][ref4]
      of [20 van de Wet][ref5] heeft ingediend en, naar het oordeel van de korpschef, termen aanwezig zijn de aanvraag af
      te wijzen;

      d. de vreemdeling geen geldig document voor grensoverschrijding heeft, of

      e. de vreemdeling houder is van een document als bedoeld in [artikel 4.21, eerste lid, onder a, b, c of d][ref6],
      en niet in het bezit is van een geldig document voor grensoverschrijding.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref6]: https://wetten.overheid.nl/BWBR0011825#Artikel4.21
