  - number: '4.21'
    text: |-
      1 Als documenten in de zin van [artikel 50, eerste lid, laatste volzin, van de Wet][ref1], worden aangewezen:

      a. voor vreemdelingen die rechtmatig verblijven als bedoeld in [artikel 8, onder a tot en met d, van de Wet][ref2]:
      een vanwege de bevoegde autoriteiten verstrekt document waaruit zulks blijkt en waarvan het model is vastgesteld
      bij ministeriële regeling;

      b. voor vreemdelingen die rechtmatig verblijven als bedoeld in [artikel 8 onder e, van de Wet][ref3]: een geldig
      nationaal paspoort of geldige identiteitskaart, indien zij de nationaliteit van een staat bezitten als bedoeld in
      [artikel 8.7, eerste lid][ref4], of, indien zij een zodanige nationaliteit niet bezitten:

      1°. een geldig nationaal paspoort met een voor inreis benodigd visum, indien na inreis nog geen drie maanden zijn
      verstreken;

      2°. een geldig nationaal paspoort met een stempel van de inreis, indien voor inreis geen visum benodigd is en na
      inreis nog geen drie maanden zijn verstreken;

      3°. een geldig nationaal paspoort met een door de bevoegde autoriteiten afgegeven verklaring als bedoeld in
      [artikel 8.13, vierde lid][ref5], indien na afgifte van de verklaring nog geen zes maanden zijn verstreken; of

      4°. een door de bevoegde autoriteiten afgegeven verblijfsdocument als bedoeld in [artikel 8.13, vijfde lid][ref6],
      dan wel [artikel 8.20, eerste lid][ref7];

      c. voor vreemdelingen die een aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28 van de Wet][ref8], hebben ingediend: een vanwege de bevoegde autoriteiten verstrekt document waaruit
      zulks blijkt en waarvan het model wordt vastgesteld bij ministeriële regeling;

      d. voor vreemdelingen, anders dan bedoeld onder c, die rechtmatig verblijf in de zin van
      [artikel 8, onder f, g, h, j, k, of m, van de Wet][ref9] hebben en die niet beschikken over een ingevolge
      [de Wet][ref10] vereist geldig document voor grensoverschrijding: een vanwege de bevoegde autoriteiten verstrekt
      document, waarvan het model wordt vastgesteld bij ministeriële regeling, dat is voorzien van een inlegvel als
      bedoeld in [artikel 4.29, derde lid][ref11], waarop de verblijfsrechtelijke positie is aangetekend;

      e. voor andere vreemdelingen: een ingevolge de Wet voor het hebben van toegang tot Nederland vereist geldig
      document voor grensoverschrijding dan wel een document voor grensoverschrijding waarin het benodigde visum is
      aangetekend of waarin een aantekening omtrent de verblijfsrechtelijke positie is geplaatst.

      2 Geen document, anders dan bedoeld in het eerste lid, onder a of b, wordt verstrekt aan kinderen beneden de
      leeftijd van twaalf jaar, tenzij zij er naar het oordeel van Onze Minister een redelijk belang bij hebben in het
      bezit van zulk een document te worden gesteld.

      3 Op het ingevolge het eerste lid, onder a tot en met d, afgegeven document wordt aangetekend of het de vreemdeling
      toegestaan is arbeid te verrichten en of voor deze arbeid ingevolge de [Wet arbeid vreemdelingen][ref12] een
      tewerkstellingsvergunning is vereist.

      4 Indien aan het verblijf in Nederland van de in het eerste lid, onder a en b, bedoelde vreemdelingen een beperking
      als bedoeld in [artikel 3.4, vierde lid][ref13], is verbonden, wordt op het document de aantekening «beroep op de
      publieke middelen kan gevolgen hebben voor verblijfsrecht» gesteld.


