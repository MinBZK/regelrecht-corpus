  - number: 3.29a
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], wordt verleend onder
      een beperking verband houdend met verblijf als economisch niet-actieve langdurig ingezetene aan de langdurig
      ingezetene, die:

      a. beschikt over een geldig document voor grensoverschrijding;

      b. duurzaam en zelfstandig beschikt over voldoende middelen van bestaan als bedoeld in
      [artikel 3.74, eerste lid, onder a][ref2];

      c. geen gevaar vormt voor de openbare orde als bedoeld in de [artikelen 3.77][ref3] en [3.78][ref4]; en

      d. geen gevaar vormt voor de nationale veiligheid.


