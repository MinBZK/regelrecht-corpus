  - number: '8.5'
    text: |-
      1 Aan een vreemdeling die onderdaan is van België of Luxemburg en die het vereiste document voor
      grensoverschrijding bezit, kan, in afwijking van [hoofdstuk 2][ref1], de toegang tot Nederland slechts worden
      geweigerd, indien hij een actuele bedreiging voor de openbare orde of de nationale veiligheid vormt.

      2 De ambtenaren belast met de grensbewaking of de ambtenaren belast met het toezicht op vreemdelingen, weigeren
      niet dan ingevolge een bijzondere aanwijzing van Onze Minister de toegang tot Nederland aan een vreemdeling als
      bedoeld in het eerste lid. De weigering geschiedt schriftelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel8.5
