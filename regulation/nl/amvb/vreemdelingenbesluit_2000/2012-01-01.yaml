  - number: '3.92'
    text: |-
      1 De aanvraag tot het verlenen of wijzigen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20 van de Wet][ref1] wordt niet op grond van [artikel 21, eerste lid, onder a, van de Wet][ref2]
      afgewezen, om reden dat het rechtmatig verblijf, bedoeld in [artikel 8 onder a, b, dan wel l, van de Wet][ref3]
      niet vijf jaren aaneensluitend is geweest, indien:

      a. de aanvraag is ingediend door een meerderjarige vreemdeling die:

      1°. tussen het vierde en het negentiende levensjaar tien jaren rechtmatig in Nederland heeft verbleven als bedoeld
      in [artikel 8, onder a, b dan wel l, van de Wet][ref4], en wiens aanvraag is ontvangen voor het drieëntwintigste
      levensjaar, of

      2°. voor het negentiende levensjaar vijf jaren rechtmatig in Nederland heeft verbleven als bedoeld in
      [artikel 8, onder a, b dan wel l, van de Wet][ref5], en voor wie Nederland naar het oordeel van Onze Minister het
      meest aangewezen land is;

      b. de vreemdeling niet het hoofdverblijf buiten Nederland heeft verplaatst.

      2 De aanvraag, ingediend door vreemdeling met niet-tijdelijk verblijfsrecht, wordt niet op grond van
      [artikel 21, eerste lid, onder b, van de Wet][ref6] afgewezen, indien de duur van het niet-tijdelijke
      verblijfsrecht en de helft van het verblijf op grond van een verblijfsvergunning onder een beperking verband
      houdend met studie, waaronder begrepen beroepsopleiding, tezamen ten minste vijf jaar bedraagt.

      3 De aanvraag wordt niet op grond van [artikel 21, eerste lid, onder a of c, van de Wet][ref7] afgewezen, indien
      de vreemdeling:

      a. buiten Nederland heeft verbleven in verband met beroepsmatige detachering in een staat die partij is bij het
      Verdrag betreffende de werking van de Europese Unie;

      b. als langdurig ingezetene houder is geweest van een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20 van de Wet][ref8] en deze vergunning heeft verloren wegens:

      1°. verblijf voor studie of beroepsopleiding in een andere staat die partij is bij het Verdrag betreffende de
      werking van de Europese Unie, zonder in die staat de status van langdurig ingezetene te hebben verkregen, indien de
      aanvraag wordt gedaan binnen zes maanden na beëindiging van die studie of opleiding, dan wel de verblijfstitel in
      die staat,

      2°. verblijf buiten het grondgebied van de Gemeenschap gedurende een aaneengesloten periode van tenminste twaalf
      maanden, indien de aanvraag wordt gedaan binnen twaalf maanden na het onherroepelijk worden van het verlies, of

      3°. verkrijging van de status van langdurig ingezetene in een andere staat als bedoeld onder 1°, indien de aanvraag
      wordt gedaan binnen twaalf maanden na het onherroepelijk worden van het verlies;

      c. de vreemdeling vijf jaar legaal en ononderbroken op het grondgebied van de Europese Unie verblijft als houder
      van een Europese blauwe kaart, onmiddellijk voorafgaand aan de indiening van de aanvraag ten minste achttien
      achtereenvolgende maanden als houder van een Europese blauwe kaart in een andere staat die partij is bij het
      Verdrag betreffende de werking van de Europese Unie en ten minste twee achtereenvolgende jaren direct voorafgaande
      aan de aanvraag als houder van een door Onze Minister afgegeven Europese blauwe kaart in Nederland heeft verbleven,
      waarbij perioden van afwezigheid van het grondgebied van de Europese Unie geen onderbreking vormen van de termijn
      van vijf jaar, indien zij minder dan twaalf achtereenvolgende maanden beslaan en niet langer dan achttien maanden
      hebben geduurd;

      d. de vreemdeling als houder van een Europese blauwe kaart in de periode van vijf jaar niet langer dan twaalf
      achtereenvolgende maanden en in totaal niet langer dan achttien maanden buiten Nederland heeft verbleven.

      4 Voor de toepassing van [artikel 21, eerste lid, onder d, van de Wet][ref9], zijn de
      [artikelen 3.73 tot en met 3.76][ref10] van overeenkomstige toepassing.

      5 Behoudens gevallen als bedoeld in [artikel 3.87][ref11], kan de aanvraag slechts op grond van
      [artikel 21, eerste lid, onder e, van de Wet][ref12] worden afgewezen, indien de totale duur van de straffen
      of maatregelen ten minste gelijk is aan de normen, bedoeld in [artikel 3.86, eerste dan wel tweede lid][ref13].
      [Artikel 3.86, derde tot en met negende lid][ref14], is van overeenkomstige toepassing.

      6 Bij de toepassing van het vijfde lid houdt Onze Minister mede rekening met de ernst van de inbreuk of het soort
      van inbreuk dat door de vreemdeling op de openbare orde is gepleegd, respectievelijk met het gevaar dat van de
      vreemdeling uitgaat en het bestaan van banden met Nederland.

      7 In de gevallen, bedoeld in het eerste lid, wordt bij de berekening van het tijdvak van vijf jaar buiten
      beschouwing gelaten het gedeelte van het verblijf buiten Nederland, dat tien maanden in totaal of bij
      aaneengesloten verblijf buiten Nederland zes maanden te boven gaat.

      8 Bij regeling van Onze Minister kan worden bepaald dat het derde lid, aanhef en onder c en d, slechts
      van toepassing is, indien de vreemdeling het in die onderdelen bedoelde grondgebied van de Europese Unie,
      respectievelijk Nederland heeft verlaten om in het land van herkomst:

      a. arbeid in loondienst of als zelfstandige, dan wel vrijwilligerswerk te verrichten;

      b. een studie te volgen.


