  - number: '3.12'
    text: |-
      1 Verplichtingen, voortvloeiende uit een garantstelling overeenkomstig [artikel 3.7, eerste lid, onder b][ref1],
      of het stellen van zakelijke zekerheid overeenkomstig [artikel 3.7, derde lid][ref2], hebben uitsluitend betrekking
      op kosten, veroorzaakt binnen vijf jaren, nadat de verblijfsvergunning, bedoeld in [artikel 14 van de Wet][ref3],
      is verleend.

      2 Onze Minister kan bepalen dat de in het eerste lid genoemde termijn korter is dan vijf jaren, indien:

      a. op andere wijze voldoende zekerheid is gesteld;

      b. de vreemdeling Nederland definitief heeft verlaten;

      c. aan de vreemdeling een verblijfsvergunning onder een andere beperking of een verblijfsvergunning voor onbepaalde
      tijd is verleend; of

      d. de vreemdeling de Nederlandse nationaliteit heeft verkregen.

      3 Het model van de garantstelling wordt bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.7
