        bwb_id: BWBR0011823
        artikel: '59'
  - number: '5.4'
    text: |-
      1 De bewaring op grond van [artikel 59 van de Wet][ref1] wordt ten uitvoer gelegd op een politiebureau,
      een cel van de Koninklijke marechaussee, in een huis van bewaring of een ruimte of plaats als bedoeld in
      [artikel 6, tweede lid][ref2], of [artikel 58, eerste lid van de Wet][ref3]. Bij de tenuitvoerlegging van de
      bewaring wordt de vreemdeling niet verder beperkt in de uitoefening van grondrechten dan wordt gevorderd door het
      doel van deze maatregel en de handhaving van de orde en de veiligheid op de plaats van tenuitvoerlegging.

      2 Indien de tenuitvoerlegging van de bewaring een aanvang neemt op een politiebureau of in een cel van
      de Koninklijke marechaussee, wordt zodra dit redelijkerwijs mogelijk is de tenuitvoerlegging voortgezet
      in een huis van bewaring of een ruimte of plaats als bedoeld in [artikel 6, tweede lid][ref4] of
      [artikel 58, eerste lid, van de Wet][ref5].

      3 De bewaring wordt opgeheven zodra er geen grond meer aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel6
