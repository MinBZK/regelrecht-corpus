  - number: '2.2'
    text: |-
      1 De vervoerder, bedoeld in [artikel 4, eerste lid, van de Wet][ref1] neemt afschrift van het op de vreemdeling
      betrekking hebbende document voor grensoverschrijding, indien hij de vreemdeling rechtstreeks dan wel na transfer
      of transit naar Nederland vervoert vanaf een luchthaven die is aangewezen bij ministeriële regeling.

      2 De vervoerder neemt afschrift door het maken van een duidelijke en goed leesbare afbeelding van de pagina's met
      de relevante gegevens van het document voor grensoverschrijding van de vreemdeling die hij vervoert. De vervoerder
      overhandigt het afschrift desgevraagd aan een ambtenaar belast met de grensbewaking, indien bij inreis in Nederland
      geen geldig document voor grensoverschrijding door de vreemdeling kan worden overgelegd.

      3 Onder de relevante gegevens wordt in ieder geval verstaan:

      a. naam en voornaam of voornamen van de vreemdeling;

      b. geboortedatum van de vreemdeling;

      c. geboorteplaats van de vreemdeling;

      d. nationaliteit van de vreemdeling;

      e. plaats en datum van afgifte van het document voor grensoverschrijding van de vreemdeling, alsmede het nummer
      daarvan;

      f. geldigheidsduur van het document voor grensoverschrijding van de vreemdeling;

      g. plaats en datum van afgifte van het in het document voor grensoverschrijding van de vreemdeling aangebrachte
      visum voor Nederland of het Schengengebied dan wel het verblijfsdocument, alsmede de nummers daarvan;

      h. geldigheidsduur van de in het document voor grensoverschrijding aangebrachte visa of verblijfsdocumenten,
      ook indien een visumverklaring is afgegeven, dan wel gebruik wordt gemaakt van niet in het document voor
      grensoverschrijding aangebrachte verblijfsdocumenten;

      i. plaats en datum van afgifte van de in het document voor grensoverschrijding aangebrachte visa of
      verblijfsdocumenten voor derde landen, welke noodzakelijk zijn voor de reis naar Nederland, dan wel voor het
      uiteindelijke land van bestemming, ook indien die visa dan wel verblijfsdocumenten niet in het document voor
      grensoverschrijding zijn aangebracht, maar afzonderlijk aan de vreemdeling zijn verstrekt;

      j. het meest recente uitreisstempel voorzover dit is aangebracht door de grensbewakingautoriteiten van het land
      waarin de luchthaven van vertrek gelegen is, en

      k. de in het document voor grensoverschrijding aangebrachte foto.

      De gegevens, bedoeld onder g, worden ook vastgelegd indien een visumverklaring is afgegeven of het
      verblijfsdocument als afzonderlijk document is verstrekt.

      4 De afbeelding van de in het document voor grensoverschrijding aangebrachte foto, bedoeld in het derde lid,
      onder k, dient van zodanige kwaliteit te zijn, dat deze goed tot de houder van het geldige document voor
      grensoverschrijding herleidbaar is.

      5 De ambtenaar belast met de grensbewaking maakt de afbeelding definitief onbruikbaar, zodra de
      grensbewakingsbelangen dit toestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '4'
  - number: 2.2a
    text: |-
      1 De vervoerder, bedoeld in [artikel 4, eerste lid, van de Wet][ref1], die passagiers vervoert door de lucht,
      verzamelt op vordering van een ambtenaar belast met de grensbewaking de in het derde lid van dat artikel bedoelde
      passagiersgegevens en overhandigt deze voor het eind van de instapcontroles aan een ambtenaar belast met de
      grensbewaking.

      2 Het eerste lid is niet van toepassing op de vervoerder door wiens tussenkomst de vreemdeling vanuit een lidstaat
      van de Europese Unie of een land dat betrokken is bij de uitvoering, de toepassing en de ontwikkeling van het
      Schengenacquis, aan een buitengrens of binnen het grondgebied van Nederland wordt gebracht.

      3 De in [artikel 4, derde lid, van de Wet][ref2], bedoelde passagiersgegevens omvatten:

      a. het nummer en de aard van het gebruikte reisdocument;

      b. de nationaliteit;

      c. de volledige naam;

      d. de geboortedatum;

      e. de grensdoorlaatpost van binnenkomst;

      f. het vervoermiddel;

      g. het tijdstip van vertrek en van aankomst van het vervoermiddel;

      h. het totale aantal met dat vervoermiddel vervoerde passagiers, en

      i. het eerste instappunt.

      4 Bij ministeriële regeling kunnen gevallen worden aangewezen waarin vervoerders verplicht zijn de in het derde lid
      bedoelde passagiersgegevens te verzamelen en te verstrekken zonder vordering daartoe.

      5 De vervoerder vernietigt de krachtens het eerste lid verzamelde gegevens binnen 24 uur na aankomst in Nederland.

      6 De vervoerder verstrekt de passagier informatie betreffende:

      a. zijn identiteit;

      b. de doeleinden waarvoor de gegevens worden verzameld;

      c. de gegevens die worden verzameld;

      d. de ontvangers van de gegevens, en

      e. het bestaan van het recht om kennis te nemen van zijn gegevens en het recht om om correctie van onjuiste
      gegevens te verzoeken.

      7 Bij ministeriële regeling worden regels gesteld over de wijze waarop de gegevens door de vervoerder worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel2.2a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '4'
  - number: 2.2b
    text: |-
      De ambtenaar belast met de grensbewaking vernietigt de op grond van [artikel 2.2a][ref1] verkregen
      passagiersgegevens binnen 24 uur na binnenkomst van de passagiers in Nederland, tenzij deze later nodig zijn voor
      de uitoefening van diens taken.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2.2a
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel2.2b
