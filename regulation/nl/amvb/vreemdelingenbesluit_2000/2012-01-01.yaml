    text: |-
      Onverminderd [artikel 3.80a][ref1], wordt een aanvraag tot het wijzigen van de verblijfsvergunning, bedoeld in
      [artikel 14 van de Wet][ref2], beoordeeld als een aanvraag tot het verlenen van een verblijfsvergunning, met dien
      verstande dat de [artikelen 3.71][ref3], [3.77][ref4], [3.78][ref5] en [3.79][ref6] niet van toepassing zijn en de
      [artikelen 3.86][ref7] en [3.87][ref8] van overeenkomstige toepassing zijn, indien de aanvraag tijdig is ingediend.


