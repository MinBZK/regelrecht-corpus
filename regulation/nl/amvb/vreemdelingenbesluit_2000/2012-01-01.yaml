  - number: 3.1b
    text: |-
      1 Het indienen van een aanvraag tot het verlenen van een Europese blauwe kaart heeft tot gevolg dat uitzetting
      achterwege blijft, indien de vreemdeling direct voorafgaande aan de indiening van de aanvraag houder was van een
      door de autoriteiten van een andere staat die partij is bij het Verdrag betreffende de werking van de Europese Unie
      afgegeven Europese blauwe kaart.

      2 Het indienen van een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 3.13, eerste lid][ref1], heeft tot gevolg dat uitzetting achterwege blijft, indien:

      a. de vreemdeling de echtgenoot, de geregistreerde partner dan wel de ongehuwde partner van een houder van een
      Europese blauwe kaart is, dan wel het minderjarige kind van die echtgenoot, partner of houder van de Europese
      blauwe kaart;

      b. de houder van de Europese blauwe kaart, bedoeld in onderdeel a, direct voorafgaande aan de indiening van de
      aanvraag houder was van een door de autoriteiten van een andere staat die partij is bij het Verdrag betreffende de
      werking van de Europese Unie afgegeven Europese blauwe kaart, en

      c. geen sprake is van gezinsvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.13
