        artikel: 3.98b
        hoofdstuk: '3'
        afdeling: '4'
  - number: '3.99'
    text: |-
      1 De aanvraag, bedoeld in de [artikelen 14][ref1] en [20 van de Wet][ref2], wordt gedaan door het indienen van een
      formulier, waarvan het model bij ministeriële regeling wordt vastgesteld.

      2 De door een vreemdeling ingediende aanvraag tot het verlenen, het wijzigen of het verlengen van de
      geldigheidsduur van de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref3], kan mede
      betrekking hebben op diens inwonende kinderen jonger dan twaalf jaar.

      3 Overeenkomstig bij regeling van Onze Minister te stellen regels wordt de aanvraag door de vreemdeling in persoon
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel14
