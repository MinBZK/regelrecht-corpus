  - number: 4.52a
    text: |-
      1 De ambtenaar belast met de grensbewaking of het toezicht op vreemdelingen kan van de vreemdeling die Nederland
      ingevolge [artikel 62, eerste lid, van de Wet][ref1] uit eigen beweging binnen vier weken moet verlaten zekerheid
      verlangen, teneinde het risico te beperken dat de vreemdeling zich zal onttrekken aan het toezicht.

      2 De zekerheid, bedoeld in het eerste lid, kan ook worden verlangd in geval van uitstel van vertrek of uitzetting:

      a. op grond dat het vertrek of de uitzetting in strijd zou zijn met het beginsel van non-refoulement;

      b. zolang de vreemdeling rechtmatig verblijf heeft als bedoeld in [artikel 8, onder h of j, van de Wet][ref2]; of

      c. wegens technische redenen, zoals het ontbreken van vervoermiddelen of het mislukken van het vertrek of de
      uitzetting wegens onvoldoende identificatie.

      3 De zekerheid, bedoeld in het eerste lid, kan bestaan uit:

      a. de overlegging van een reis- of identiteitsdocument;

      b. de overlegging van een passagebiljet;

      c. het deponeren van een waarborgsom;

      d. een verklaring van een solvabele derde die zich voor de kosten garant stelt;

      e. de overlegging van bewijs van het voldoende verzekerd zijn tegen ziektekosten met inbegrip van opname en
      verpleging in een sanatorium of psychiatrische inrichting.

      3 Het model van de garantverklaring wordt bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.52a
