        bwb_id: BWBR0011823
        artikel: '14'
  - number: '3.102'
    text: |-
      1 De vreemdeling legt bij de in persoon ingediende aanvraag tot het verlenen, het wijzigen of het verlengen van de
      geldigheidsduur van een verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], of tot
      het verlenen van een verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20 van de Wet][ref2], in ieder
      geval over een geldig document voor grensoverschrijding, alsmede, voorzover redelijkerwijs mogelijk, de gegevens
      en bescheiden op basis waarvan kan worden vastgesteld dat wordt voldaan aan de voorwaarden voor de verlening,
      wijziging of verlenging.

      2 Bij de niet in persoon ingediende aanvraag legt de vreemdeling afschriften over van de in het eerste lid genoemde
      gegevens en bescheiden en overlegt hij op verzoek van Onze Minister de originelen.

      3 In afwijking van het eerste en tweede lid, legt de vreemdeling die niet beschikt over een geldig document voor
      grensoverschrijding, voorzover redelijkerwijs mogelijk, gegevens en bescheiden over waarmee wordt aangetoond
      dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van een geldig
      document voor grensoverschrijding kan worden gesteld. In dat geval overlegt hij tevens aanvullende gegevens of
      bescheiden omtrent zijn identiteit en nationaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.102
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
  - number: '3.103'
    text: |-
      De aanvraag wordt getoetst aan het recht dat gold op het tijdstip waarop de aanvraag is ontvangen, tenzij uit deWet
      anders voortvloeit of het recht dat geldt op het tijdstip waarop de beschikking wordt gegeven, voor de vreemdeling
      gunstiger is.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.103
  - number: 3.103a
    text: |-
      1 Indien Onze Minister een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref1] verleent aan of
      verlengt van een vreemdeling die houder is van een door een andere staat die partij is bij het Verdrag betreffende
      de werking van de Europese Unie, ter uitvoering van artikel 8 van de [Richtlijn nr. 2003/109/EG](32003L0109) van
      de Raad van 25 november 2003 betreffende de status van langdurig ingezeten onderdanen van derde landen (PbEU 2004,
      L16) afgegeven EG-verblijfsvergunning voor langdurig ingezetenen, doet hij daarvan mededeling aan de autoriteiten
      van die staat. Indien Onze Minister aan die houder ter uitvoering van artikel 8, tweede lid, van deze richtlijn
      een EG-verblijfsvergunning voor langdurig ingezetenen verleent, doet hij daarvan eveneens mededeling aan die
      autoriteiten.

      2 Het eerste lid is van overeenkomstige toepassing indien Onze Minister besluit de verblijfsvergunning van de in
      het eerste lid bedoelde houder in te trekken of niet te verlengen.

      3 Indien Onze Minister overweegt een vreemdeling, die houder is als bedoeld in het eerste lid, uit te zetten naar
      een staat die geen partij is bij het Verdrag, bedoeld in het eerste lid, raadpleegt hij de autoriteiten van de
      andere staat, bedoeld in het eerste lid. Indien Onze Minister dienovereenkomstig besluit uit te zetten, verstrekt
      hij die autoriteiten alle nodige informatie met betrekking tot de uitzetting.

      4 Indien Onze Minister beslist op een aanvraag tot het verlenen van een Europese blauwe kaart ten behoeve van een
      vreemdeling die door een andere staat die partij is bij het Verdrag betreffende de werking van de Europese Unie
      reeds in het bezit is gesteld van een Europese blauwe kaart, doet hij daarvan mededeling aan de autoriteiten van
      die andere staat.

      5 Onze Minister vormt het contactpunt dat door een staat als bedoeld in het eerste en vierde lid kan worden
      geraadpleegd, ter uitvoering van de in het eerste en vierde lid bedoelde richtlijn, en is verantwoordelijk voor het
      ontvangen en toezenden van de informatie, bedoeld in de voorgaande leden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.103a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.103b
    text: |-
      1 Indien Onze Minister een inreisverbod uitvaardigt, registreert Onze Minister dit inreisverbod in het Schengen
      Informatiesysteem.

      2 Indien Onze Minister overweegt een vreemdeling die houder is van een verblijfstitel of andere toestemming tot
      verblijf, afgegeven door een andere staat als bedoeld in [artikel 1.3][ref1], uit te zetten naar de staat waarvan
      de vreemdeling de nationaliteit bezit of bij het ontbreken van een nationaliteit naar de staat van zijn vroegere
      verblijfplaats, wint Onze Minister de nodige informatie in bij de autoriteiten van die andere staat. Indien Onze
      Minister besluit de vreemdeling uit te zetten, verstrekt hij de autoriteiten van die andere staat alle nodige
      informatie met betrekking tot de uitzetting.

      3 Onze Minister vormt het contactpunt ter uitvoering van de Richtlijn 2008/115/EG van het Europees Parlement en
      de Raad van 16 december 2008 over gemeenschappelijke normen en procedures in de lidstaten voor de terugkeer van
      onderdanen van derde landen die illegaal op hun grondgebied verblijven (PbEU, L 348) en is verantwoordelijk voor
      het inwinnen en verstrekken van de informatie, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.103b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '1.3'
        hoofdstuk: '1'
        afdeling: '1'
  - number: '3.104'
    text: |-
      1 De beschikking, waarbij de aanvraag tot het verlenen, het wijzigen of het verlengen van de geldigheidsduur
      van de verblijfsvergunning, bedoeld in [artikel 14][ref1] en [20 van de Wet][ref2], geheel of gedeeltelijk wordt
      ingewilligd, of waarbij de verblijfsvergunning ambtshalve wordt verleend of gewijzigd, wordt bekendgemaakt door
      uitreiking van het document, bedoeld in [artikel 9, eerste lid, van de Wet][ref3], waaruit het rechtmatig verblijf
      op grond van [artikel 8, onder a onderscheidenlijk onder b, van de Wet][ref4] blijkt.

      2 Indien de vreemdeling, niet zijnde gemeenschapsonderdaan, in aanmerking komt voor meer dan één verblijfsdocument
      wordt één document uitgereikt en worden de overige beschikkingen bekendgemaakt door het stellen van een aantekening
      op dat document.

      3 De beschikking ten aanzien van een zich in het buitenland bevindende vreemdeling, waarbij de aanvraag tot het
      verlenen, het wijzigen of het verlengen van de geldigheidsduur van een verblijfsvergunning geheel of gedeeltelijk
      wordt ingewilligd, of waarbij de verblijfsvergunning ambtshalve wordt verleend of gewijzigd, wordt bekendgemaakt na
      zijn aankomst in Nederland. Het eerste en tweede lid zijn van toepassing.

      4 De beschikking, die niet of niet mede strekt tot het verlenen, wijzigen of verlengen van de geldigheidsduur
      van een verblijfsvergunning als bedoeld in [artikel 14][ref5] of [20 van de Wet][ref6], wordt bekend gemaakt door
      toezending naar het laatst bekende adres van de vreemdeling.

      5 Bij de bekendmaking van de beschikking, waarbij wordt beslist op de aanvraag, bedoeld in
      [artikel 20 van de Wet][ref7], wordt de aanvrager meegedeeld welke rechten en plichten hij heeft krachtens de
      [Richtlijn nr. 2003/109/EG](32003L0109) van de Raad van 25 november 2003 betreffende de status van langdurig
      ingezeten onderdanen van derde landen (PbEU 2004, L16).


