        afdeling: '2'
  - number: '4.6'
    text: |-
      Een ieder die zich op of nabij een plaats bevindt waar een grensdoorlaatpost is gevestigd, houdt zich aan de aldaar
      door de ambtenaren, belast met de grensbewaking, in het kader van de uitoefening van hun taak gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      De Nederlander die Nederland in- of uitreist, toont en overhandigt, desgevorderd, aan een ambtenaar, belast met
      de grensbewaking, het in zijn bezit zijnde reis- of identiteitspapier of maakt zo nodig op andere wijze zijn
      Nederlanderschap aannemelijk.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.7
  - number: '4.8'
    text: |-
      De bestuurder van een voertuig geeft eigener beweging aan een ambtenaar, belast met de grensbewaking, kennis van
      de aanwezigheid in zijn voertuig van vreemdelingen ten aanzien van wie hij weet of redelijkerwijs kan vermoeden dat
      zij niet voldoen aan de bij de Schengengrenscode of de bij of krachtens de [Wet][ref1] vastgestelde verplichtingen
      waaraan personen bij grensoverschrijding zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: '4.9'
    text: |-
      De gezagvoerder van een schip verleent, desgevorderd, de medewerking aan een ambtenaar, belast met de
      grensbewaking, welke nodig is om deze ambtenaar in staat te stellen de door hem op grond van de Schengengrenscode
      uit te oefenen grenscontrole uit te voeren. Deze medewerking bestaat uit:

      a. het op een daartoe gegeven teken zodanig vaart verminderen en het zodanig op of bijdraaien van zijn schip, dat
      een dienstvaartuig behoorlijk langszij kan komen;

      b. het toelaten van ambtenaren, belast met de grensbewaking, aan boord van zijn schip;

      c. het op vordering van een ambtenaar, belast met de grensbewaking, tot stilstand brengen of aanleggen van zijn
      schip.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.9
  - number: '4.10'
    text: |-
      [Artikel 4.8][ref1] is van overeenkomstige toepassing op gezagvoerders van andere schepen dan zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.8
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4.8'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: '4.11'
    text: |-
      1 De op grond van bijlage VI, onder 3.1.2, van de Schengengrenscode te verstrekken bemanningslijst en
      passagierslijst, worden bij het binnenvaren van Nederland onmiddellijk verstrekt aan de ambtenaar belast met de
      grensbewaking. Bij ministeriële regeling kunnen modellen worden vastgesteld van de in bijlage VI, onder 3.1.2, van
      de Schengengrenscode bedoelde bemanningslijst en passagierslijst.

      2 De in bijlage VI, onder 3.1.2, van de Schengengrenscode bedoelde grensdoorlaatposten waar de kopie van de
      bemanningslijst of, in voorkomend geval, de passagierslijst kan worden afgegeven, zijn:

      a. de grensdoorlaatpost ter plaatse waar het schip voor het eerst ligplaats neemt;

      b. voor schepen die bestemd zijn om rechtstreeks ligplaats te nemen in een gemeente, waar geen grensdoorlaatpost
      is gevestigd:

      1°. één van de doorlaatposten Hoek van Holland-haven, Rotterdam-havens (ambulant), Dordrecht-haven of Moerdijk,
      indien Nederland over de Nieuwe Waterweg wordt binnengevaren;

      2°. de Beneluxdoorlaatpost Gent-Terneuzen (ambulant), indien de kanaalzone Gent-Terneuzen wordt bevaren en het
      schepen betreft die niet, of anders dan rechtstreeks, uit open zee naar België varen;

      3°. de eerste grensdoorlaatpost na binnenkomst, gelegen aan de waterweg waardoor het schip vaart, in alle overige
      gevallen.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.11
  - number: '4.12'
    text: |-
      De in bijlage VI, onder 3.1.4, van de Schengengrenscode bedoelde bevoegde autoriteit aan wie onverwijld alle
      wijzigingen met betrekking tot de samenstelling van de bemanning of de passagiers wordt doorgegeven, is het
      hoofd van de grensdoorlaatpost in de gemeente waar het schip zich bevindt of, indien in die gemeente geen
      grensdoorlaatpost is gevestigd, aan het hoofd van de grensdoorlaatpost via welke hij Nederland is binnengekomen.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.12
  - number: '4.13'
    text: |-
      1 De in bijlage VI, onder 3.1.5, van de Schengengrenscode bedoelde kennisgeving van afvaart wordt gedaan aan het
      hoofd van de grensdoorlaatpost waarlangs hij zal vertrekken. Indien in de gemeente waar het schip ligplaats heeft
      geen grensdoorlaatpost is gevestigd, wordt de kennisgeving gedaan aan het hoofd van de grensdoorlaatpost waaraan de
      bemanningslijst overeenkomstig [artikel 4.11, tweede lid][ref1], is afgegeven.

      2 De in bijlage VI, onder 3.1.5, van de Schengengrenscode bedoelde kennisgeving wordt gedaan:

      a. ten hoogste zes en ten minste drie uur vóór het daadwerkelijke vertrek van het schip;

      b. indien het schip zich korter dan drie uur bevindt op de plaats waar de kennisgeving moet geschieden, op een
      zodanig tijdstip dat de met de bediening van de grensdoorlaatpost belaste ambtenaar in staat is de door hem uit te
      oefenen personencontrole uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.11
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4.11'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: '4.14'
    text: |-
      De [artikelen 4.11 tot en met 4.13][ref1], gelden niet voor gezagvoerders van zeeschepen die, zonder ligplaats in
      een Nederlandse haven te nemen, door de Nederlandse territoriale zee varen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.11
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4.11'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: '4.15'
    text: |-
      1 De gezagvoerder van een vliegtuig verstrekt in tweevoud aan een ambtenaar, belast met de grensbewaking, de in
      bijlage VI, onder 2.3.1, van de Schengengrenscode bedoelde algemene verklaring en de in bijlage VII, onder 2.1, van
      de Schengengrenscode bedoelde gegevens over de bemanning.

      2 Bij ministeriële regeling wordt het model van de bemannings- en passagierslijst aangewezen.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.15
  - number: '4.16'
    text: |-
      De vordering aan de gezagvoerder van een luchtvaartuig, bedoeld in [artikel 51, derde lid, van de Wet][ref1], wordt
      gedaan door tussenkomst van de luchtverkeersleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel51
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '51'
  - number: '4.17'
    text: |-
      1 De korpschef verstrekt periodiek ten minste de volgende gegevens aan Onze Minister:

      a. gegevens over de wijze van behandeling van aanvragen betreffende een verblijfsvergunning;

      b. gegevens over het aantal en soort van de verleende verblijfsvergunningen;

      c. gegevens over de uitzetting van vreemdelingen, en

      d. gegevens over de uitvoering van het toezicht op vreemdelingen.

      2 De bevelhebber van de Koninklijke marechaussee en, voorzover van toepassing, de korpschef van het regionale
      politiekorps Rotterdam-Rijnmond verstrekken periodiek ten minste de volgende inlichtingen aan Onze Minister:

      a. gegevens over de toegangsweigering;

      b. gegevens over de controle op de zorgplicht van vervoerders;

      c. gegevens over de uitzetting van vreemdelingen, en

      d. gegevens over de uitvoering van het toezicht op vreemdelingen.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.17
  - number: 4.17a
    text: |-
      1 De bevoegdheid, bedoeld in [artikel 50, eerste lid, van de Wet][ref1], om ter bestrijding van illegaal
      verblijf na grensoverschrijding personen staande te houden ter vaststelling van hun identiteit, nationaliteit en
      verblijfsrechtelijke positie, wordt uitsluitend uitgeoefend in het kader van toezicht op vreemdelingen:

      a. op luchthavens bij de aankomst van vluchten vanuit het Schengengebied;

      b. in treinen gedurende ten hoogste dertig minuten na het passeren van de gemeenschappelijke landgrens met België
      of Duitsland of, als binnen deze periode het tweede station na het passeren van de grens nog niet is bereikt, tot
      uiterlijk het tweede station na het passeren van de grens;

      c. op wegen en vaarwegen in een gebied tot twintig kilometer vanaf de gemeenschappelijke landgrens met België of
      Duitsland.

      2 Het toezicht, bedoeld in het eerste lid, wordt uitgevoerd op basis van informatie of ervaringsgegevens over
      illegaal verblijf na grensoverschrijding. Het toezicht kan daarnaast in beperkte mate worden uitgevoerd met het oog
      op het verkrijgen van informatie over dergelijk illegaal verblijf.

      3 Het toezicht, bedoeld in het eerste lid, onderdeel a, wordt ten hoogste zeven keer per week uitgevoerd ten
      aanzien van vluchten op eenzelfde vliegroute, met een maximum van eenderde van het totale aantal geplande vluchten
      per maand op die vliegroute. In het kader van dit toezicht wordt slechts een deel van de passagiers op een vlucht
      staande gehouden.

      4 Het toezicht, bedoeld in het eerste lid, onderdeel b, wordt per dag in ten hoogste twee treinen per traject en
      ten hoogste acht treinen in totaal uitgevoerd, en per trein in ten hoogste twee treincoupés.

      5 Het toezicht, bedoeld in het eerste lid, onderdeel c, wordt op eenzelfde weg of vaarweg ten hoogste negentig uur
      per maand en ten hoogste zes uur per dag uitgevoerd. In het kader van dit toezicht wordt slechts een deel van de
      passerende vervoermiddelen stilgehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.17a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '50'
  - number: '4.18'
    text: |-
      1 Aan de vreemdeling die met toepassing van [artikel 50, tweede of derde lid, van de Wet][ref1] is overgebracht
      naar een plaats, bestemd voor verhoor, wordt tijdig mededeling gedaan van de hem toekomende bevoegdheid zich bij
      het verhoor te doen bijstaan door een raadsman.

      2 De in het eerste lid bedoelde vreemdeling wordt niet verder beperkt in de uitoefening van grondrechten, dan
      wordt gevorderd door het doel van de maatregel en de handhaving van de orde en de veiligheid op de plaats van
      tenuitvoerlegging.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.18
