        artikel: '14'
  - number: 2.1b
    text: |-
      1 De toegang wordt niet geweigerd indien de vreemdeling van een andere staat als bedoeld in [artikel 1.3][ref1]
      het bevel heeft gekregen onmiddellijk naar Nederland terug te keren, en hij op dat moment rechtmatig verblijf als
      bedoeld in [artikel 8 van de Wet][ref2] had.

      2 De toegang wordt evenmin geweigerd indien Nederland op grond van een op 13 januari 2009 geldende
      bilaterale of multilaterale overeenkomst of regeling een vreemdeling van een andere staat als bedoeld in
      [artikel 1.3][ref3] moet terugnemen en die vreemdeling in die andere staat verblijft zonder verblijfstitel of
      andere toestemming tot verblijf. In dat geval geeft Onze Minister aan die vreemdeling de kennisgeving, bedoeld
      in [artikel 62a, eerste lid, van de Wet][ref4], tenzij de vreemdeling rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onder a tot en met e, of l, van de Wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel1.3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
