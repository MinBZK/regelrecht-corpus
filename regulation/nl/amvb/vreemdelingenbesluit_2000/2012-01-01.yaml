  - number: '2.4'
    text: |-
      1 Aan de vreemdeling, die als passagier van een vliegtuig een vliegveld aandoet en in wiens geldig document voor
      grensoverschrijding het voor binnenkomst in het Beneluxgebied vereiste reisvisum of doorreisvisum met oponthoud
      ontbreekt, kan toegang tot het Beneluxgebied worden verleend.

      2 Toegang wordt slechts verleend, indien:

      a. de onderbreking plaats vindt wegens van de wil van de vreemdeling onafhankelijke omstandigheden;

      b. hij van één van de in het derde lid van dit artikel bedoelde vliegvelden zal vertrekken;

      c. hij in het bezit is van een geldig document voor grensoverschrijding en reisbiljetten op grond waarvan zijn
      doorreis naar en zijn toegang tot het land van bestemming vaststaat, en

      d. hij voldoet aan [artikel 12, eerste lid, onder b en d, van de Wet][ref1].

      3 De toegang wordt slechts verleend, indien de vreemdeling een bij ministeriële regeling aangewezen vliegveld in
      Nederland aandoet, dan wel een daartoe aangewezen vliegveld in België of Luxemburg.

      4 De toegang wordt verleend voor de duur waarop de doorreis per eerstvolgende gelegenheid kan worden voortgezet.

      5 Indien toegang wordt verleend, stelt de ambtenaar belast met de grensbewaking ter plaatse in het geldig
      document voor grensoverschrijding van de vreemdeling een aantekening, dan wel verstrekt hij aan de vreemdeling een
      afzonderlijke verklaring, waaruit het verlenen van toegang blijkt.

      6 Het model van de aantekening en verklaring, bedoeld in het vijfde lid, wordt bij ministeriële regeling
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel12
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel2.4
