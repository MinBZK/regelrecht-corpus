  - number: '4.34'
    text: |-
      1 De aantekeningen, bedoeld in [artikel 4.29, eerste lid, onder g][ref1], betreffen:

      a. een aantekening waaruit de uiterlijke datum van vertrek blijkt, indien aan de vreemdeling overeenkomstig
      [artikel 62 van de Wet][ref2] een termijn is gegund waarbinnen hij Nederland uit eigen beweging dient te verlaten;

      b. een aantekening waaruit blijkt tot welke datum uitzetting van de vreemdeling achterwege blijft ingevolge
      [artikel 64 van de Wet][ref3];

      c. een aantekening waaruit de datum van indienen van een bezwaarschrift blijkt, indien de uitzetting achterwege
      blijft hangende een beslissing op een door de vreemdeling ingediend bezwaar, eventueel met doorhaling van de
      aantekening, bedoeld onder a;

      d. een aantekening omtrent uitzetting, indien naar het oordeel van de korpschef of de bevelhebber van de
      Koninklijke marechaussee gegronde reden bestaat om te vermoeden dat de vreemdeling zal trachten naar Nederland
      terug te keren zonder te voldoen aan de vereisten voor toegang tot Nederland.

      2 Bij een aantekening als bedoeld in het eerste lid, onder b, wordt tevens gesteld dat arbeid niet is toegestaan.

      3 De aantekening, bedoeld in het eerste lid, onder d, wordt niet gesteld, indien het vertrek, de uitzetting of de
      doorreis van de vreemdeling door, of diens toelating tot een derde land daardoor wordt bemoeilijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel64
