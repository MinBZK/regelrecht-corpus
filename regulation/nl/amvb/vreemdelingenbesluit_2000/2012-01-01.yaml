  - number: '3.22'
    text: |-
      1 De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend, indien de hoofdpersoon:

      a. duurzaam en zelfstandig beschikt over voldoende middelen van bestaan als bedoeld in
      [artikel 3.74, eerste lid, onder a][ref2], en

      b. een garantstelling heeft ondertekend, voorzover de vreemdeling als partner van die persoon wil verblijven.

      2 In afwijking van het eerste en tweede lid wordt de verblijfsvergunning eveneens verleend, indien de hoofdpersoon
      65 jaar of ouder is of naar het oordeel van Onze Minister blijvend en volledig arbeidsongeschikt is.

      3 Tenzij sprake is van gezinsvorming, wordt de verblijfsvergunning in afwijking van het eerste lid eveneens
      verleend, indien de aanvraag is ingediend binnen drie maanden nadat aan de hoofdpersoon een verblijfsvergunning
      voor bepaalde tijd als bedoeld in [artikel 28 van de wet][ref3] is verleend en gezinshereniging niet mogelijk is in
      een derde land waarmee de vreemdeling of de hoofdpersoon bijzondere banden heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.13
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3.74
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.22
