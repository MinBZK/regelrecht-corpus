        artikel: '16'
  - number: '3.74'
    text: |-
      1 De in [artikel 16, eerste lid, onder c, van de Wet][ref1] bedoelde middelen van bestaan zijn in ieder geval
      voldoende, indien de som van het loon, bedoeld in [artikel 16 van de Wet financiering sociale verzekeringen][ref2],
      uit arbeid in loondienst, het bruto inkomen uit een inkomensvervangende uitkering krachtens een
      socialeverzekeringswet waarvoor premies zijn afgedragen, de bruto-winst uit arbeid als zelfstandige en het inkomen
      uit eigen vermogen ten minste gelijk is aan:

      a. het minimumloon, bedoeld in de [artikelen 8, eerste lid, onder a][ref3], en
      [14, van de Wet minimumloon en minimumvakantiebijslag][ref4], met inbegrip van de vakantiebijslag, bedoeld in
      [artikel 15 van die wet][ref5];

      b. in bij regeling van Onze Minister aangewezen gevallen: 150 procent van het minimumloon, bedoeld in onderdeel a.

      2 De in [artikel 16, eerste lid, onder c, van de Wet][ref6] bedoelde middelen van bestaan zijn eveneens voldoende,
      indien het netto-inkomen ten minste gelijk is aan het normbedrag voor uitwonende studenten, bedoeld in de
      [Wet op de Studiefinanciering 2000][ref7], indien de vreemdeling in Nederland verblijft of wil verblijven voor
      studie of in het kader van uitwisseling.

      3 Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de voorgaande leden. Daarbij kunnen
      gevallen worden vastgesteld waarin de in [artikel 16, eerste lid, onder c, van de Wet][ref8] bedoelde middelen van
      bestaan voldoende zijn, indien het inkomen ten minste gelijk is aan een combinatie van de in het eerste en tweede
      lid genoemde normbedragen.

      4 De normbedragen, bedoeld in de voorgaande leden, worden door Onze Minister bekendgemaakt.


