  - number: '3.10'
    text: |-
      1 Onze Minister berekent rente over waarborgsommen, gedeponeerd krachtens [artikel 3.7, eerste lid, onder a][ref1].

      2 De rente wordt berekend vanaf het kalenderjaar volgend op het jaar waarin de waarborgsom is gestort. Over het
      kalenderjaar waarin de waarborgsom is gedeponeerd, wordt geen rente vergoed. Bij de berekening van de termijn
      waarover rente wordt vergoed, wordt het kalenderjaar waarin de waarborgsom wordt terugbetaald als vol jaar
      meegeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.7
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.10
