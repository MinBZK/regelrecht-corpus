      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met verblijf als pleegkind worden verleend aan de minderjarige vreemdeling:

      a. die als pleegkind in Nederland wil verblijven in het gezin van één of meer Nederlanders of vreemdelingen met
      rechtmatig verblijf, als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2]; en

      b. die naar het oordeel van Onze Minister in het land van herkomst geen aanvaardbare toekomst heeft.

      2 De aspirant-pleegouders dienen in staat te zijn de vreemdeling een goede opvoeding en verzorging te geven.

      3 Bij de aanvraag wordt een medische verklaring overgelegd en een garantverklaring ondertekend.

      4 De aanvraag wordt niet op grond van [artikel 16, eerste lid, onder c, van de Wet][ref3] afgewezen, indien de
      persoon bij wie de vreemdeling wil verblijven 65 jaar of ouder is of naar het oordeel van Onze Minister blijvend en
      volledig arbeidsongeschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
