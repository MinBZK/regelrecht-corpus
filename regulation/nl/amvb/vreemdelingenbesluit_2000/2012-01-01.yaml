        artikel: '28'
  - number: '4.1'
    text: |-
      1 Grensbewaking als bedoeld in [artikel 46 van de Wet][ref1] wordt uitgeoefend met het oog op het Nederland in- en
      uitreizen van personen via een buitengrens.

      2 Onder uitreizen wordt begrepen het zich aan boord begeven of bevinden van een schip of luchtvaartuig, dat voor de
      uitreis uit Nederland bestemd is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel46
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '46'
  - number: '4.2'
    text: |-
      1 In het belang van de grensbewaking worden aan de buitengrenzen grensdoorlaatposten ingesteld.

      2 Bij ministeriële regeling worden de plaatsen aangewezen waar grensdoorlaatposten, al dan niet tijdelijk, zijn
      gevestigd.

      3 De grensdoorlaatposten worden bediend door ambtenaren van de Koninklijke marechaussee. De in de politieregio
      Rotterdam-Rijnmond gelegen grensdoorlaatposten worden eveneens bediend door de ambtenaren van het regionale
      politiekorps Rotterdam-Rijnmond.

      4 Bij ministeriële regeling worden de tijden vastgesteld gedurende welke de grensdoorlaatposten zijn opengesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.2
  - number: '4.4'
    text: Benelux-onderdanen behoeven Nederland niet in- of uit te reizen via een grensdoorlaatpost.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      1 De vreemdeling die Nederland inreist, is verplicht desgevorderd aan een ambtenaar, belast met de grensbewaking:

      a. het in zijn bezit zijnde document voor grensoverschrijding, de benodigde machtiging tot voorlopig verblijf dan
      wel het benodigde reisvisum of doorreisvisum te tonen en te overhandigen;

      b. inlichtingen te verstrekken over het doel en de duur van zijn voorgenomen verblijf in Nederland;

      c. aan te tonen over welke middelen hij met het oog op de toegang tot Nederland beschikt of kan beschikken.

      2 Het eerste lid, onder a, is van overeenkomstige toepassing op de vreemdeling die Nederland uitreist via een
      buitengrens.

      3 Het eerste lid, onder b en c, is niet van toepassing op de vreemdeling die rechtmatig verblijf
      heeft als bedoeld in [artikel 8, onder e, dan wel l, van de Wet][ref1], het familielid, bedoeld in
      [artikel 8.7, tweede en derde lid][ref2], en de vreemdeling, bedoeld in [artikel 8.7, vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8.7
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8.7
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.5
    references:
