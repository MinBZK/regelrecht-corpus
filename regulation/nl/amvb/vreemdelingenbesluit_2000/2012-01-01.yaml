  - number: '3.23'
    text: |-
      1 De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend aan de in Nederland geboren
      vreemdeling, die het hoofdverblijf niet buiten Nederland heeft verplaatst en die naar het oordeel van Onze Minister
      feitelijk is blijven behoren tot het in Nederland gevestigde gezin van de ouder, die rechtmatig verblijf heeft
      als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2], en die sedert de geboorte van de
      vreemdeling het hoofdverblijf niet buiten Nederland heeft verplaatst.

      2 Indien de aanvraag is ontvangen voordat de vreemdeling de leeftijd van negen maanden heeft bereikt, wordt de
      verblijfsvergunning eveneens verleend aan de buiten Nederland geboren vreemdeling, die naar het oordeel van Onze
      Minister feitelijk is blijven behoren tot het gezin van beide ouders, die sedert de geboorte van de vreemdeling
      rechtmatig verblijf als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref3], hebben en het
      hoofdverblijf niet buiten Nederland hebben verplaatst.

      3 Indien de vader van de in het tweede lid bedoelde vreemdeling onbekend is, wordt de verblijfsvergunning
      verleend, indien de moeder sedert de geboorte van de vreemdeling rechtmatig verblijf op grond van
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref4] heeft en het hoofdverblijf niet buiten Nederland
      heeft verplaatst.

      4 De verblijfsvergunning wordt verleend, indien de vreemdeling:

      a. beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel waarvoor
      de verblijfsvergunning is aangevraagd, of behoort tot één van de in [artikel 17 van de Wet][ref5] of in
      [artikel 3.71, tweede lid][ref6], bedoelde categorieën;

      b. beschikt over een geldig document voor grensoverschrijding, of naar het oordeel van Onze Minister heeft
      aangetoond dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van
      een geldig document voor grensoverschrijding kan worden gesteld;

      c. bereid is een onderzoek naar of behandeling voor tuberculose te ondergaan en daaraan mee te werken, of de
      nationaliteit bezit van een van de bij ministeriële regeling vast te stellen landen, en

      d. geen gevaar vormt voor de openbare orde of nationale veiligheid.

      5 Bij de toepassing van het vierde lid, onder d, zijn de [artikelen 3.77][ref7] en [3.78][ref8] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.13
