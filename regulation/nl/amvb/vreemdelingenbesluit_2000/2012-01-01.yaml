  - number: '3.14'
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend aan:

      a. de vreemdeling van 21 jaar of ouder die met de hoofdpersoon een naar Nederlands internationaal privaatrecht
      geldig huwelijk of een naar Nederlands internationaal privaatrecht geldig geregistreerd partnerschap is aangegaan;

      b. de vreemdeling van 21 jaar of ouder, die met de hoofdpersoon een duurzame en exclusieve relatie onderhoudt,
      waarin de partners:

      1°. niet tot elkaar in een zodanig nauwe relatie staan dat die naar Nederlands recht een huwelijksbeletsel zou
      vormen, en

      2°. ongehuwd zijn en geen in Nederland geregistreerd partnerschap zijn aangegaan, tenzij het huwelijk door
      wettelijke beletselen, waarop geen invloed kan worden uitgeoefend, niet is ontbonden; of

      c. het minderjarige biologische of juridische kind van de hoofdpersoon, dat naar het oordeel van Onze Minister
      feitelijk behoort en reeds in het land van herkomst feitelijk behoorde tot het gezin van die hoofdpersoon en dat
      onder het rechtmatige gezag van die hoofdpersoon staat.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.13
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.14
