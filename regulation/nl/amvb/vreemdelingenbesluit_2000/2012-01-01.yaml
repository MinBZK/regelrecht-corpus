  - number: '3.67'
    text: |-
      1 In afwijking van [artikel 3.57][ref1], kan de geldigheidsduur van de verblijfsvergunning worden verlengd met vijf
      jaren, indien de houder van de verblijfsvergunning op het moment waarop de aanvraag is ontvangen of de beschikking
      wordt gegeven:

      a. gedurende een jaar rechtmatig verblijf als bedoeld in [artikel 8, onder a, van de Wet][ref2] heeft op grond
      van een huwelijk, een geregistreerd partnerschap of een relatie als bedoeld in [artikel 3.14][ref3], en het
      verblijfsrecht niet-tijdelijk in de zin van [artikel 3.5][ref4] is, of

      b. gedurende vijf jaren aaneengesloten rechtmatig verblijf als bedoeld in [artikel 8, onder a, van de Wet][ref5]
      heeft en het verblijfsrecht niet-tijdelijk in de zin van [artikel 3.5][ref6] is.

      2 In afwijking van [artikel 3.57][ref7], kan de verblijfsvergunning worden verleend of verlengd met een langere
      geldigheidsduur, indien de geldigheidsduur van de te verlenen of te verlengen verblijfsvergunning op het moment
      waarop deze wordt verstrekt ingevolge [artikel 3.57][ref8] alweer zou zijn geëindigd.

      3 In afwijking van [artikel 3.57][ref9] wordt de verblijfsvergunning aan de echtgenoot van een langdurig ingezetene
      met rechtmatig verblijf in de zin van [artikel 8, onder a, b dan wel l, van de Wet][ref10], en het minderjarige
      kind van die echtgenoot of die langdurig ingezetene, verleend en verlengd met een geldigheidsduur die gelijk is aan
      de duur van de verblijfsvergunning van die langdurig ingezetene.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.57
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3.14
