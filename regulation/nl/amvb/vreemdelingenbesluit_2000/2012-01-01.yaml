  - number: '1.4'
    text: |-
      1 Onze Minister kan van zijn bevoegdheden mandaat verlenen aan de burgemeester, de korpschef en de bevelhebber van
      de Koninklijke marechaussee.

      2 De burgemeester, de korpschef en de bevelhebber van de Koninklijke marechaussee kunnen ondermandaat verlenen
      aan de onder hen ressorterende ambtenaren voorzover dat in overeenstemming is met de taak en functie van de
      desbetreffende ambtenaar.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel1.4
  - number: '1.6'
    text: |-
      De commissie kan haar werkwijze nader vaststellen in een reglement van orde als bedoeld in
      [artikel 21 van de Kaderwet adviescolleges][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel21
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel1.6
