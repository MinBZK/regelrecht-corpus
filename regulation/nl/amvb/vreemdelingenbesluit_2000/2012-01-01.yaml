  - number: '3.116'
    text: |-
      1 Het schriftelijke voornemen om:

      a. de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 28 van de Wet][ref1],
      af te wijzen indien de termijnen, bedoeld in de [artikelen 3.112, eerste en derde lid][ref2],
      [3.113, tweede en derde lid][ref3], of [3.114, eerste en zesde lid][ref4], dan wel de op grond van
      [artikel 3.115, eerste lid][ref5], verlengde termijn, zijn overschreden;

      b. de aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning, bedoeld in
      [artikel 28 van de Wet][ref6], af te wijzen;

      c. de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 33 van de Wet][ref7], af te wijzen,
      of

      d. de verblijfsvergunning, bedoeld in de [artikelen 28][ref8] en [33 van de Wet][ref9], in te trekken, wordt aan de
      vreemdeling meegedeeld door uitreiking of toezending ervan.

      2 De termijn waarbinnen de vreemdeling zijn zienswijze schriftelijk naar voren brengt bedraagt, tenzij een met
      redenen omkleed verzoek om verlenging van deze termijn wordt ingewilligd:

      a. in het geval, bedoeld in het eerste lid, onder a: vier weken, en

      b. in de gevallen, bedoeld in het eerste lid, onder b, c en d: zes weken.

      3 De termijn, bedoeld in het tweede lid, vangt aan met ingang van de dag na die waarop het voornemen is uitgereikt
      of toegezonden.

      4 De schriftelijke zienswijze is tijdig bij Onze Minister ingediend, indien deze voor het einde van de termijn is
      ontvangen. Bij verzending per post is de zienswijze tijdig ingediend, indien deze voor het einde van de termijn ter
      post is bezorgd, mits deze niet later dan een week na afloop van de termijn is ontvangen.

      5 De ontvangst van de schriftelijke zienswijze wordt door Onze Minister bevestigd.

      6 Onze Minister houdt rekening met een na afloop van de termijn ontvangen schriftelijke zienswijze, indien de
      beschikking nog niet bekend is gemaakt. Met een na afloop van de termijn ontvangen aanvulling op een eerder
      ingediende schriftelijke zienswijze wordt rekening gehouden, indien de beschikking nog niet bekend is gemaakt en de
      afdoening van de zaak daardoor niet ontoelaatbaar wordt vertraagd. Het ontbreken van de schriftelijke zienswijze,
      na het verstrijken van de termijn waarbinnen de vreemdeling zijn zienswijze schriftelijk naar voren kan brengen,
      staat aan het geven van de beschikking niet in de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
