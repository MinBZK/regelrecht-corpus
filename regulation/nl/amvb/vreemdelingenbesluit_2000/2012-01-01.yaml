  - number: '5.2'
    text: |-
      1 Voordat de vreemdeling op grond van [artikel 59 van de Wet][ref1] in bewaring wordt gesteld, wordt hij gehoord.

      2 Het eerste lid is niet van toepassing indien:

      a. de vreemdeling reeds op een andere grond in bewaring gesteld is, of

      b. het voorafgaande gehoor van de vreemdeling niet kan worden afgewacht.

      3 Slechts in het geval bedoeld in het tweede lid, onder b, wordt de vreemdeling zo spoedig mogelijk na de
      tenuitvoerlegging van de bewaring gehoord.

      4 Van het gehoor wordt proces-verbaal opgemaakt.

      5 Aan de vreemdeling wordt tijdig mededeling gedaan van de hem toekomende bevoegdheid zich bij het gehoor te doen
      bijstaan door zijn raadsman.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
  - number: '5.3'
    text: |-
      1 De maatregel waarbij de bewaring op grond van [artikel 59 van de Wet][ref1] wordt opgelegd wordt gedagtekend en
      ondertekend; de maatregel wordt met redenen omkleed. Aan de vreemdeling op wie de maatregel betrekking heeft, wordt
      onmiddellijk een afschrift daarvan uitgereikt.

      2 Op de voortzetting van de bewaring op een andere grond is het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel5.3
    references:
