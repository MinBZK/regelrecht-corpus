  - number: '3.32'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], wordt niet verleend onder
      een beperking verband houdend met het verrichten van arbeid als zelfstandige of in loondienst, waaronder begrepen
      verblijf als houder van de Europese blauwe kaart, indien die arbeid geheel of gedeeltelijk bestaat uit het
      verrichten van seksuele handelingen met derden of het verlenen van seksuele diensten aan derden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.32
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '3.33'
    text: |-
      1 Onverminderd [artikel 3.31][ref1] kan de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref2], onder een beperking verband houdend met het verrichten van arbeid in loondienst
      als geestelijk voorganger of godsdienstleraar slechts worden verleend, indien de vreemdeling tevens schriftelijk
      verklaart ermee bekend te zijn dat:

      a. slechts verblijf wordt toegestaan voor het verrichten van werkzaamheden als geestelijk voorganger of
      godsdienstleraar ten behoeve van de met name te noemen groepering;

      b. het verblijf slechts kan worden toegestaan voor de duur van de werkzaamheden;

      c. hij na beëindiging daarvan Nederland dient te verlaten, en

      d. het hem niet is toegestaan om gedurende zijn verblijf in Nederland werkzaamheden van andere aard te verrichten.

      2 Het model van de verklaring wordt bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.31
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.33
