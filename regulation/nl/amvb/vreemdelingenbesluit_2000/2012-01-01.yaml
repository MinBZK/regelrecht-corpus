  - number: 6.1a
    text: |-
      1 Onze Minister is bevoegd om, bij de uitoefening van zijn bevoegdheid tot uitzetting als bedoeld in
      [artikel 63, tweede lid, van de Wet][ref1] alle daartoe benodigde handelingen te verrichten.

      2 Bij toepassing van het eerste lid worden de grondrechten, de waardigheid en fysieke integriteit van de
      vreemdeling geëerbiedigd.

      3 In geval van uitzetting door de lucht houdt Onze Minister rekening met de gemeenschappelijke richtsnoeren voor
      veiligheidsvoorzieningen voor gezamenlijke verwijdering door de lucht, bedoeld in artikel 7 van de beschikking van
      de Raad van de Europese Unie van 29 april 2004, nr. 2004/573/EG (PbEU, L 261).


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel63
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel6.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '63'
  - number: 6.1b
    text: |-
      1 Ingeval de vreemdeling ingevolge [artikel 62, tweede lid, van de Wet][ref1] onmiddellijk moet vertrekken of
      niet is vertrokken binnen de voor hem geldende vertrektermijn, kan de uitzetting worden uitgesteld. Bij het
      uitstel wordt in ieder geval rekening gehouden met de fysieke of mentale gesteldheid van de vreemdeling en
      technische redenen, zoals het ontbreken van vervoermiddelen of het mislukken van de uitzetting wegens onvoldoende
      identificatie.

      2 Ingeval de uitzetting wordt uitgesteld op grond van het eerste lid, is [artikel 4.52a][ref2] van overeenkomstige
      toepassing, onverminderd het overigens krachtens de [artikelen 54][ref3] en [56 van de Wet][ref4] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
