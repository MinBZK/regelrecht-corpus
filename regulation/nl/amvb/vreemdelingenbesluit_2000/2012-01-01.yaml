  - number: 3.89b
    text: |-
      1 De aanvraag tot het verlengen van de geldigheidsduur van de Europese blauwe kaart kan worden afgewezen, indien de
      houder niet voldoet aan de voorwaarden voor verlening van die kaart, zoals opgenomen in [artikel 3.30b][ref1], met
      uitzondering van het eerste lid, onder e.

      2 In afwijking van het eerste lid, onder a, wordt de aanvraag tot het verlengen van de geldigheidsduur van de
      Europese blauwe kaart niet met toepassing van [artikel 18, eerste lid, onder d, van de Wet][ref2] afgewezen op de
      grond dat de houder werkloos is, tenzij deze:

      a. langer dan drie achtereenvolgende maanden werkloos is;

      b. tijdens de geldigheidsduur van de Europese blauwe kaart eerder werkloos is geweest, of

      c. een uitkering krachtens de [Wet werk en bijstand][ref3] heeft aangevraagd.

      3 De aanvraag tot het verlengen van de geldigheidsduur van de Europese blauwe kaart wordt niet met toepassing van
      [artikel 18, eerste lid, onder f, van de Wet][ref4], afgewezen op grond van werkloosheid als bedoeld in het tweede
      lid, onder a of b.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de toepassing van het eerste en tweede
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.30b
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
