  - number: '3.117'
    text: |-
      1 De termijnen, genoemd in de [artikelen 3.112][ref1], [3.113, eerste tot en met vierde lid][ref2], en
      [3.114][ref3], zijn niet van toepassing op de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld
      in [artikel 28 van de Wet][ref4], van de vreemdeling aan wie rechtens zijn vrijheid is ontnomen op grond van
      [artikel 59 van de Wet][ref5] terwijl de vrijheidsontneming voortduurt, tenzij de aanvraag is ingediend in een
      Aanmeldcentrum.

      2 De vreemdeling wordt door Onze Minister zo spoedig mogelijk na de indiening van de aanvraag aan een eerste gehoor
      onderworpen.

      3 De vreemdeling wordt door Onze Minister zo spoedig mogelijk nadat een afschrift van de ingevulde vragenlijst,
      bedoeld in [artikel 3.112, derde lid][ref6], aan hem ter kennis is gebracht, aan een nader gehoor onderworpen.

      4 Indien Onze Minister voornemens is de aanvraag af te wijzen, wordt het schriftelijk voornemen daartoe zo spoedig
      mogelijk uitgereikt of toegezonden.

      5 De vreemdeling brengt zijn zienswijze binnen twee weken schriftelijk naar voren.

      6 De termijn, bedoeld in het vijfde lid, vangt aan met ingang van de dag na die waarop het voornemen is uitgereikt
      of toegezonden.

      7 De schriftelijke zienswijze is tijdig bij Onze Minister ingediend, indien deze voor het einde van de termijn
      is ontvangen.

      8 [Artikel 3.116, vijfde en zesde lid][ref7], zijn van toepassing.


