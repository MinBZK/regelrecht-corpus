  - number: '3.111'
    text: |-
      1 Bij de aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28 van de Wet][ref1], worden door de vreemdeling in persoon alle gegevens verstrekt, waaronder begrepen
      de relevante documenten, op basis waarvan in samenwerking met de vreemdeling beoordeeld kan worden of er een
      rechtsgrond voor verlening van de vergunning aanwezig is.

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent de verstrekking van de in het eerste lid bedoelde
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.111
