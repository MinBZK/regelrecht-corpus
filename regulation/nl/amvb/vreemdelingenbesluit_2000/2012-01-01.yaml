  - number: '5.1'
    text: |-
      1 De maatregel van beperking van vrijheid van beweging, bedoeld in [artikel 56, eerste lid, van de Wet][ref1] kan
      bestaan uit:

      a. een verplichting zich bij verblijf in Nederland in een bepaald gedeelte van Nederland te bevinden, of

      b. een verplichting zich te houden aan een verbod om zich in een bepaald gedeelte of bepaalde gedeelten van
      Nederland te bevinden.

      2 De maatregel, bedoeld in het eerste lid, wordt niet opgelegd aan de vreemdeling die rechtmatig verblijf heeft
      op grond van [artikel 8, onderdeel a, van de Wet][ref2] en houder is van een EG-verblijfsvergunning voor langdurig
      ingezetenen die is afgegeven door een andere staat die partij is bij het Verdrag betreffende de werking van de
      Europese Unie anders dan om redenen van veiligheid.

      3 De maatregel wordt evenmin opgelegd aan een houder van een door Onze Minister afgegeven Europese blauwe kaart
      anders dan om redenen van veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
