        bwb_id: BWBR0011823
        artikel: '28'
  - number: '3.113'
    text: |-
      1 Gedurende de tweede dag wordt de vreemdeling in staat gesteld zich op het nader gehoor voor te bereiden.

      2 Op de derde dag wordt de vreemdeling door Onze Minister aan een nader gehoor onderworpen.

      3 Van het nader gehoor wordt een schriftelijk verslag gemaakt. Een afschrift van het verslag van nader gehoor wordt
      op de derde dag aan de vreemdeling ter kennis gebracht.

      4 De vreemdeling kan uit eigen beweging of desgevraagd nadere gegevens verstrekken uiterlijk op de vierde dag. Het
      verslag van nader gehoor vermeldt deze termijn.

      5 In afwijking van het tweede lid blijft een nader gehoor in een Aanmeldcentrum achterwege:

      a. indien de vreemdeling om medische redenen niet aan een nader gehoor kan worden onderworpen, of

      b. ten aanzien van een alleenstaande minderjarige vreemdeling beneden de leeftijd van twaalf jaar.

      Bij ministeriële regeling kunnen andere gevallen worden aangewezen waarin een nader gehoor in een Aanmeldcentrum
      achterwege blijft.

      6 Indien een nader gehoor in een Aanmeldcentrum achterwege is gebleven wordt de vreemdeling door Onze Minister zo
      spoedig mogelijk aan een nader gehoor onderworpen. Van het nader gehoor wordt een schriftelijk verslag gemaakt.
      Een afschrift van het verslag van nader gehoor wordt zo spoedig mogelijk aan de vreemdeling ter kennis gebracht.
      Het verslag van nader gehoor vermeldt de termijn waarbinnen de vreemdeling uit eigen beweging of desgevraagd nadere
      gegevens kan verstrekken. Deze termijn bedraagt ten minste twee dagen.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.113
  - number: '3.114'
    text: |-
      1 Indien Onze Minister voornemens is de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in
      [artikel 28 van de Wet][ref1], af te wijzen binnen acht dagen, wordt het schriftelijk voornemen daartoe aan de
      vreemdeling uitgereikt op de vijfde dag.

      2 De vreemdeling brengt zijn zienswijze op het in het eerste lid bedoelde voornemen schriftelijk naar voren
      uiterlijk op de zesde dag.

      3 De schriftelijke zienswijze is tijdig bij Onze Minister ingediend, indien deze voor het einde van de termijn
      is ontvangen.

      4 Het tijdstip van uitreiken van het voornemen en de ontvangst van de schriftelijke zienswijze worden door Onze
      Minister vastgelegd.

      5 Onze Minister houdt rekening met een na afloop van de termijn ontvangen schriftelijke zienswijze, indien de
      beschikking nog niet bekend is gemaakt. Met een na afloop van de termijn ontvangen aanvulling op een eerder
      ingediende schriftelijke zienswijze wordt rekening gehouden, indien de beschikking nog niet bekend is gemaakt en de
      afdoening van de zaak daardoor niet ontoelaatbaar wordt vertraagd. Het ontbreken van de schriftelijke zienswijze,
      na het verstrijken van de termijn waarbinnen de vreemdeling zijn zienswijze schriftelijk naar voren kan brengen,
      staat aan het geven van de beschikking niet in de weg.

      6 Onze Minister maakt de beschikking uiterlijk op de achtste dag bekend door uitreiking of toezending ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.114
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: '3.115'
    text: |-
      1 Onze Minister kan de in [artikel 3.110, eerste lid][ref1], genoemde termijn verlengen:

      a. in geval van overschrijding van de termijnen, bedoeld in de [artikelen 3.112, eerste en derde lid][ref2],
      [3.113, tweede en derde lid][ref3], en [3.114, eerste en zesde lid][ref4], tenzij de overschrijding aan Onze
      Minister kan worden toegerekend;

      b. in geval van overschrijding van de termijnen, bedoeld in de [artikelen 3.113, eerste en vierde lid][ref5], of
      [3.114, tweede lid][ref6], en de vreemdeling een met redenen omkleed verzoek om verlenging heeft ingediend, tenzij
      de overschrijding aan de vreemdeling kan worden toegerekend;

      c. indien naar het oordeel van Onze Minister nader onderzoek naar de identiteit of nationaliteit van de vreemdeling
      noodzakelijk is, of

      d. indien de vreemdeling zijn eerder tijdens het onderzoek afgelegde verklaringen essentieel wijzigt of aanvult.

      2 De vreemdeling wordt van de verlenging schriftelijk in kennis gesteld. Bij de kennisgeving wordt de reden van de
      verlenging aangegeven alsmede op welk moment de verlengde termijn eindigt.

      3 Indien Onze Minister de in [artikel 3.110, eerste lid][ref7], genoemde termijn heeft verlengd en voornemens is de
      aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 28 van de Wet][ref8], af te wijzen binnen
      veertien dagen, wordt het schriftelijk voornemen daartoe aan de vreemdeling uitgereikt.

      4 De vreemdeling brengt zijn zienswijze uiterlijk op de dag na de uitreiking van het voornemen naar voren, tenzij
      een met redenen omkleed verzoek om verlenging van deze termijn wordt ingewilligd.

      5 [Artikel 3.114, derde tot en met vijfde lid][ref9], is van toepassing.

      6 Onze Minister maakt de beschikking uiterlijk op de veertiende dag bekend door uitreiking of toezending ervan.

      7 Bij ministeriële regeling kunnen nadere regels gesteld worden omtrent de toepassing van het eerste lid alsmede
      de wijze waarop het onderzoek naar de aanvraag wordt vervolgd indien de in [artikel 3.110, eerste lid][ref10],
      genoemde termijn wordt verlengd.


