  - number: '8.21'
    text: |-
      Beëindiging van het rechtmatig verblijf van de vreemdeling vormt een onderbreking vanaf het tijdstip waarop de
      vreemdeling Nederland heeft verlaten.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel8.21
  - number: '8.22'
    text: |-
      1 Onze Minister kan het rechtmatig verblijf ontzeggen of beëindigen, om redenen van openbare orde of openbare
      veiligheid, indien het persoonlijke gedrag van de vreemdeling een actuele, werkelijke en ernstige bedreiging voor
      een fundamenteel belang van de samenleving vormt.

      2 Onze Minister kan bij de afgifte van de verklaring van inschrijving of het verblijfsdocument aan de lidstaat van
      oorsprong of andere lidstaten verzoeken om inlichtingen omtrent de gerechtelijke antecedenten.

      3 Tenzij dwingende redenen van openbare veiligheid daartoe nopen, wordt het rechtmatig verblijf niet beëindigd,
      indien de vreemdeling:

      a. in de voorafgaande tien jaar in Nederland heeft gewoond; of

      b. minderjarig is, tenzij verwijdering noodzakelijk is in het belang van het kind.

      4 De aanvraag tot opheffing van de ongewenstverklaring kan slechts worden gedaan nadat sinds de verwijdering om
      redenen van openbare orde of openbare veiligheid een redelijke termijn is verstreken of indien die verwijdering
      tenminste drie jaren voorafgaand aan de aanvraag heeft plaatsgevonden.

      5 Binnen zes maanden wordt een beschikking gegeven op de in het vierde lid bedoelde aanvraag.

      6 Indien de verwijdering niet binnen twee jaren na de ontzegging of beëindiging, bedoeld in het eerste lid, heeft
      plaatsgevonden, onderzoekt Onze Minister of de bedreiging, bedoeld in het eerste lid, nog werkelijk en actueel is,
      waarbij Onze Minister sinds die ontzegging of beëindiging eventueel opgetreden wijzigingen in materiële zin in de
      omstandigheden beoordeelt.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel8.22
  - number: '8.23'
    text: |-
      1 Onze Minister kan het rechtmatig verblijf op grond van de volksgezondheid ontzeggen of beëindigen
      in het geval van potentieel epidemische ziekten als gedefinieerd in de relevante instrumenten van de
      Wereldgezondheidsorganisatie dan wel in geval van andere infectieziekten of besmettelijke parasitaire ziekten, ten
      aanzien waarvan in Nederland beschermende regelingen ten aanzien van Nederlanders worden getroffen.

      2 Rechtmatig verblijf wordt niet op grond van de volksgezondheid beëindigd, indien de ziekte langer dan drie
      maanden na inreis van de vreemdeling is opgetreden.

      3 Onze Minister kan de vreemdeling binnen drie maanden na inreis onderwerpen aan een kosteloos medisch onderzoek
      indien ernstige aanwijzingen daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel8.23
  - number: '8.24'
    text: |-
      1 De uitzetting van de vreemdeling, ten aanzien van wie het rechtmatig verblijf om redenen van openbare
      orde, openbare veiligheid of volksgezondheid is geweigerd of beëindigd, blijft, indien de vreemdeling de
      voorzieningenrechter heeft verzocht een voorlopige voorziening te treffen, achterwege tot op dat verzoek is
      beslist, tenzij het besluit:

      a. met toepassing van [artikel 4:6 van de Algemene wet bestuursrecht][ref1] is genomen;

      b. reeds door de rechtbank of de voorzieningenrechter is beoordeeld; of

      c. gebaseerd is op dwingende redenen van openbare veiligheid.

      2 De toegang van de vreemdeling die voor de behandeling van een bezwaarschrift, beroepschrift, dan wel een verzoek
      om een voorlopige voorziening, gericht tegen beëindiging van het rechtmatig verblijf, geen gemachtigde heeft
      gesteld, wordt niet geweigerd, tenzij:

      a. zijn aanwezigheid de openbare orde of de openbare veiligheid ernstig zal verstoren; of

      b. het bezwaar of beroep is gericht tegen de weigering van toegang.

      3 Onze Minister kan de vertrektermijn, bedoeld in [artikel 62, vierde lid, van de Wet][ref2] slechts in naar
      behoren aangetoonde dringende gevallen verkorten tot minder dan vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel8.24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:6
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '62'
  - number: '8.25'
    text: |-
      Onze Minister kan het rechtmatig verblijf beëindigen, indien de vreemdeling onjuiste gegevens heeft verstrekt dan
      wel gegevens heeft achtergehouden terwijl die gegevens zouden hebben geleid tot weigering van toegang of verblijf.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel8.25
  - number: '8.26'
    text: |-
      Onze Minister kan regels stellen over de rechten die vreemdelingen ontlenen aan de volgende verdragen:

      a. het Europees Vestigingsverdrag (Trb. 1957, 20);

      b. het Vluchtelingenverdrag (Trb. 1954, 88);

      c. het Verdrag betreffende de status van staatlozen (Trb. 1955, 42);

      d. de op 12 september 1963 te Ankara gesloten Overeenkomst waarbij een associatie tot stand wordt gebracht tussen
      de Europese Economische Gemeenschap en Turkije (Trb. 1964, 217), het op 23 november 1970 te Brussel tot stand
      gekomen Aanvullend Protocol bij die overeenkomst (Trb. 1971, 70), Besluit 1/80 van de Associatieraad EEG-Turkije
      betreffende de ontwikkeling van de Associatie;

      e. het Nederlands-Duits Vestigingsverdrag (Stb. 1906, 279);

      f. het Nederlands-Zwitsers Tractaat (Stb. 1878, nr. 137);

      g. het Nederlands-Amerikaans Vriendschapsverdrag (Trb. 1956, 40);

      h. de Overeenkomst tussen het Koninkrijk der Nederlanden en de Republiek Suriname inzake het verblijf en de
      vestiging van wederzijde onderdanen (1975) (Trb. 1975, 133);

      i. de Overeenkomst tussen het Koninkrijk der Nederlanden en de Republiek Suriname inzake de binnenkomst en het
      verblijf van wederzijdse onderdanen met bijlage en protocol inzake verkregen rechten (1981) (Trb. 1981, 35);

      j. de Associatieverdragen EG met Roemenië (PbEG 1994, L 357) en Bulgarije (PbEG 1994, L 358);

      k. de Overeenkomst tussen de Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat,
      anderzijds, over het vrije verkeer van personen (Trb. 2000, 16 en 86).
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel8.26
  - number: '9.9'
    text: |-
      1 Bij de toepassing van de [artikelen 3.86, eerste lid, onder c][ref1],[3.95][ref2] en [3.98][ref3] blijft buiten
      beschouwing de periode van de terbeschikkingstelling, die op het tijdstip van inwerkingtreding van de Wet reeds
      was beëindigd.

      2 Het eerste lid is niet van toepassing, indien de vreemdeling na beëindiging van de maatregel wederom een misdrijf
      heeft gepleegd, waartegen een gevangenisstraf van drie jaren of meer is bedreigd.


