        artikel: '14'
  - number: '3.7'
    text: |-
      1 Aan de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan als voorschrift tot
      het stellen van zekerheid worden verbonden:

      a. het deponeren van een waarborgsom ter dekking van de kosten, verbonden aan de reis van de vreemdeling naar een
      plaats buiten Nederland waar zijn toegang is gewaarborgd;

      b. de schriftelijke garantstelling door een solvabele derde voor de kosten die voor de Staat en andere openbare
      lichamen uit het verblijf van de houder van de verblijfsvergunning kunnen voortvloeien, alsmede voor de kosten van
      diens reis naar een plaats buiten Nederland waar zijn toegang is gewaarborgd, en

      c. het voldoende verzekerd zijn tegen ziektekosten met inbegrip van de kosten verbonden aan opname en verpleging in
      een sanatorium of een psychiatrische inrichting.

      2 In plaats van een waarborgsom kan een passagebiljet worden gedeponeerd.

      3 In plaats van zekerheid, gesteld overeenkomstig het eerste lid, onder a of b, kan zakelijke zekerheid worden
      gesteld.

      4 Het voorschrift, bedoeld in het eerste lid, onder a, wordt niet aan de verblijfsvergunning verbonden dan op
      aanwijzing van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '3.8'
    text: |-
      De waarborgsom, bedoeld in [artikel 3.7, eerste lid, onder a][ref1], wordt gedeponeerd bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.7
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.8
