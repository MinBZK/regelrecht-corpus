  - number: 6.5a
    text: |-
      1 De duur van het inreisverbod bedraagt ten hoogste twee jaren.

      2 In afwijking van het eerste lid, bedraagt de duur van het inreisverbod ten hoogste één jaar, indien het betreft
      de vreemdeling die de vrije termijn, bedoeld in [artikel 3.3][ref1], heeft overschreden met meer dan drie dagen
      maar niet meer dan drie maanden.

      3 In afwijking van het eerste en tweede lid, bedraagt de duur van het inreisverbod ten hoogste drie jaren, indien
      het betreft een vreemdeling die is veroordeeld tot een vrijheidsstraf van minder dan zes maanden.

      4 In afwijking van het eerste tot en met derde lid, bedraagt de duur van het inreisverbod ten hoogste vijf jaren,
      indien het betreft een vreemdeling die:

      a. is veroordeeld tot een vrijheidsstraf van zes maanden of langer;

      b. gebruik heeft gemaakt van valse of vervalste reis- of identiteitspapieren dan wel opzettelijk reis- of
      identiteitspapieren heeft overgelegd die niet op hem betrekking hebben;

      c. reeds het onderwerp is geweest van meer dan één terugkeerbesluit, of

      d. zich op het grondgebied van Nederland heeft begeven terwijl een inreisverbod van kracht was.

      5 In afwijking van het eerste tot en met vierde lid, bedraagt de duur van het inreisverbod ten hoogste tien
      jaren, indien het betreft een vreemdeling die een ernstige bedreiging vormt voor de openbare orde of de openbare
      veiligheid. Deze ernstige bedreiging kan blijken uit onder meer:

      a. een veroordeling naar aanleiding van een geweldsdelict of opiumdelict;

      b. een veroordeling tot een vrijheidsstraf wegens een misdrijf waartegen een gevangenisstraf van meer dan zes jaren
      is bedreigd;

      c. de omstandigheid dat hem artikel 1F van het Vluchtelingenverdrag wordt tegengeworpen, of

      d. de oplegging van een maatregel als bedoeld in [artikel 37a van het Wetboek van Strafrecht][ref2].

      6 In afwijking van het eerste tot en met vijfde lid, bedraagt de duur van het inreisverbod ten hoogste twintig
      jaren, indien de vreemdeling naar het oordeel van Onze Minister een ernstige bedreiging vormt voor de nationale
      veiligheid of indien naar zijn oordeel zwaarwegende belangen nopen tot een duur van meer dan tien jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.3
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
