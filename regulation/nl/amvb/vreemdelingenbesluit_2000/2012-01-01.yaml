        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.105c
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref1], die is verleend op
      grond van [artikel 29, eerste lid, onder a, van die wet][ref2], wordt ingetrokken dan wel de aanvraag tot
      het verlengen van de geldigheidsduur ervan wordt afgewezen indien sprake is van de situatie, bedoeld in
      [artikel 32, eerste lid, onder a dan wel c, van de Wet][ref3].

      2 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref4], die is
      verleend op grond van [artikel 29, eerste lid, onder a, van die wet][ref5], kan slechts op grond van
      [artikel 32, eerste lid, onder b, van de Wet][ref6] worden ingetrokken dan wel de aanvraag tot het verlengen van de
      geldigheidsduur ervan worden afgewezen, indien:

      a. er goede redenen bestaan om de vreemdeling te beschouwen als een gevaar voor de nationale veiligheid; of

      b. de vreemdeling bij onherroepelijk geworden rechterlijk vonnis veroordeeld is voor een bijzonder ernstig misdrijf
      en een gevaar vormt voor de gemeenschap.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de beoordeling of sprake is van
      de situatie, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel32
