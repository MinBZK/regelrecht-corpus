  - number: '3.76'
    text: |-
      Indien de arbeidsovereenkomst voor onbepaalde duur is aangegaan, legt de vreemdeling bij zijn aanvraag daartoe
      strekkende bewijsmiddelen over.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.76
  - number: '3.77'
    text: |-
      1 De aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref1], kan op grond van [artikel 16, eerste lid, onder d, van de Wet][ref2] worden
      afgewezen wegens gevaar voor de openbare orde, indien:

      a. er ernstige redenen zijn om te veronderstellen dat de vreemdeling zich schuldig heeft gemaakt aan gedragingen
      als bedoeld in artikel 1F van het Vluchtelingenverdrag;

      b. de vreemdeling de echtgenoot of echtgenote, het minderjarige kind, de partner of het meerderjarige kind, bedoeld
      in [artikel 29, onder e en f, van de Wet][ref3], is van een in Nederland verblijvende vreemdeling ten aanzien van
      wie er ernstige redenen zijn om te veronderstellen dat deze zich schuldig heeft gemaakt aan gedragingen als bedoeld
      in artikel 1F van het Vluchtelingenverdrag, of

      c. de vreemdeling terzake van een misdrijf is veroordeeld tot een onvoorwaardelijke gevangenisstraf of
      vrijheidsontnemende maatregel, tot een taakstraf of tot een onvoorwaardelijke geldboete, dan wel indien hij terzake
      van misdrijf een transactieaanbod heeft aanvaard of jegens hem een strafbeschikking is uitgevaardigd.

      2 Bij de toepassing van het eerste lid, onder c, wordt mede betrokken de buiten Nederland gepleegde inbreuk op de
      openbare orde, voorzover die naar Nederlands recht een misdrijf oplevert.

      3 Bij de toepassing van het eerste en tweede lid komt aan gratieverlening geen betekenis toe.

      4 In geval de aanvraag verband houdt met gezinshereniging of gezinsvorming houdt Onze Minister bij de toepassing
      van het eerste lid, onder c, ten minste rekening met de aard en de hechtheid van de gezinsband van de vreemdeling
      en de duur van zijn verblijf, alsmede het bestaan van familiebanden of culturele of sociale banden met het land
      van herkomst.

      5 In geval de aanvraag is ingediend door een vreemdeling die houder is van een EG-verblijfsvergunning voor
      langdurig ingezetenen die is afgegeven door een andere staat die partij is bij het Verdrag betreffende de werking
      van de Europese Unie, houdt Onze Minister bij de toepassing van het eerste lid, onder c, mede rekening met de ernst
      van de inbreuk of het soort van inbreuk dat door de langdurig ingezetene of diens gezinslid op de openbare orde is
      gepleegd, respectievelijk met het gevaar dat van de langdurig ingezetene of dat gezinslid uitgaat.

      6 Bij de toepassing van het vijfde lid houdt Onze Minister tevens rekening met de leeftijd van de vreemdeling, de
      gevolgen voor de vreemdeling en de leden van zijn gezin, het bestaan van banden met Nederland dan wel het ontbreken
      van banden met het land van herkomst.

      7 Bij de indiening van de aanvraag ondertekent de vreemdeling van twaalf jaar of ouder een antecedentenverklaring.
      Het model van de verklaring wordt bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.77
