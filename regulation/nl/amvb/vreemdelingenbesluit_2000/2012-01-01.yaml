  - number: '4.36'
    text: Bij ministeriële regeling kunnen modellen van de aantekeningen, bedoeld in deze afdeling, worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.36
  - number: '4.37'
    text: |-
      1 De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder a tot en met h, van de Wet][ref1], is
      verplicht om in geval van:

      a. verandering van adres binnen de gemeente waar de vreemdeling woont of verblijft, hiervan binnen vijf dagen
      kennis te geven aan de korpschef van het regionale politiekorps waarin de gemeente is gelegen;

      b. verandering van woon- of verblijfplaats binnen Nederland, zo mogelijk onder opgave van het nieuwe adres, hiervan
      vóór het vertrek kennis te geven aan de korpschef van het regionale politiekorps waarin de gemeente is gelegen van
      waaruit de vreemdeling vertrekt;

      c. verandering van woon- of verblijfplaats binnen Nederland, onder opgave van het nieuwe adres, hiervan binnen
      vijf dagen na aankomst in de nieuwe woon- of verblijfplaats in persoon kennis te geven aan de korpschef van het
      regionale politiekorps waarin de nieuwe woon- of verblijfsplaats is gelegen;

      d. vertrek naar het buitenland, zo mogelijk onder opgave van het nieuwe adres, hiervan vóór het vertrek kennis
      te geven aan de korpschef van het regionale politiekorps waarin de gemeente waaruit de vreemdeling vertrekt is
      gelegen.

      2 De in het eerste lid, onder a en c, bedoelde kennisgeving blijft achterwege indien de vreemdeling als ingezetene
      is ingeschreven in de gemeentelijke basisadministratie persoonsgegevens van de nieuwe woonplaats.

      3 De vreemdeling die niet rechtmatig verblijft als bedoeld in [artikel 8, onder a tot en met h, van de Wet][ref2],
      geeft kennis van verandering van woon- of verblijfplaats binnen Nederland als bedoeld in het eerste lid, onder b,
      indien Onze Minister dat vordert.

      4 De in het eerste en derde lid omschreven verplichtingen rusten ten aanzien van kinderen beneden de leeftijd van
      twaalf jaar op de wettelijke vertegenwoordiger. Voor kinderen van twaalf jaar en ouder kan aan deze verplichtingen
      ook worden voldaan door de wettelijke vertegenwoordiger.

      5 De in het eerste en derde lid omschreven verplichtingen rusten niet op de onderdaan van een staat die
      partij is bij het Verdrag betreffende de werking van de Europese Unie, de Overeenkomst betreffende de Europese
      Economische Ruimte of de onderdaan van Zwitserland met verblijfsrecht van maximaal drie maanden als bedoeld in
      [artikel 8.11][ref3].

      6 Van vertrek naar het buitenland wordt geen kennis gegeven door de vreemdeling die rechtmatig verblijft als
      bedoeld in [artikel 8, onder a tot en met e, van de Wet][ref4], indien de vreemdeling zijn hoofdverblijf niet naar
      het buitenland verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
