      De [artikelen 3.92, eerste en zevende lid][ref1], en [3.93, derde lid][ref2], zijn van overeenkomstige toepassing,
      indien de aanvraag is ingediend door een vreemdeling die in aanmerking komt voor de terugkeeroptie op grond van
      [artikel 8 van de Remigratiewet][ref3] en die direct voorafgaande aan de remigratie:

      a. als Nederlander in Nederland verbleef;

      b. rechtmatig verblijf als bedoeld in [artikel 8, onder b of d, van de Wet][ref4] in Nederland had; of

      c. gedurende vijf jaren rechtmatig verblijf als bedoeld in [artikel 8, onder a, c, e dan wel l, van de Wet][ref5]
      in Nederland had.


