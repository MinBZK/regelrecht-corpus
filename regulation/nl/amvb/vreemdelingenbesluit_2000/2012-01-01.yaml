  - number: '4.33'
    text: |-
      1 Uit de aantekening, bedoeld in [artikel 4.29, eerste lid, onder e][ref1], blijkt de verplichte periode van
      aanmelding overeenkomstig [artikel 54, tweede lid, van de Wet][ref2] alsmede eventuele verdere bijzonderheden.

      2 Nadat de vreemdeling voor de eerste maal heeft voldaan aan de verplichting tot periodieke aanmelding
      ingevolge [artikel 4.51][ref3], kunnen de daarop volgende aanmeldingen worden aangetekend door in het reis- of
      identiteitspapier de datum van de aanmelding te stellen.

      3 Uit de aantekening, bedoeld in het eerste en tweede lid, blijkt of het de vreemdeling is toegestaan arbeid te
      verrichten en of voor deze arbeid ingevolge de [Wet arbeid vreemdelingen][ref4] een tewerkstellingsvergunning
      vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel54
