  - number: '3.119'
    text: |-
      Wanneer na het uitreiken of toezenden van het voornemen feiten of omstandigheden:

      a. bekend worden, of

      b. reeds bekend waren maar naar aanleiding van de zienswijze van de vreemdeling anders worden beoordeeld of
      gewogen, die voor de te nemen beslissing van aanmerkelijk belang kunnen zijn en Onze Minister voornemens blijft
      de aanvraag af te wijzen, wordt dit aan de vreemdeling meegedeeld en wordt hij in de gelegenheid gesteld zijn
      zienswijze daarover naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.119
  - number: '3.120'
    text: |-
      Indien de termijn voor het geven van de beschikking op grond van [artikel 42, vierde lid, van de Wet][ref1] wordt
      verlengd, wordt de vreemdeling hiervan schriftelijk in kennis gesteld. Bij de kennisgeving wordt aangegeven op welk
      moment de verlengde beslistermijn eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel42
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.120
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '42'
  - number: '3.121'
    text: |-
      Bij ministeriele regeling worden voorschriften gesteld omtrent:

      a. het verstrekken van inlichtingen aan de vreemdeling over de te volgen procedure, en

      b. het stellen van aantekeningen in het dossier van de vreemdeling ingeval van intrekking van diens aanvraag.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.121
  - number: '3.122'
    text: |-
      1 Aan de vreemdeling aan wie op grond van [artikel 29, eerste lid, onder a of b, van de Wet][ref1] een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28 van die wet][ref2] is verleend, wordt zo spoedig
      mogelijk na verlening van die verblijfsvergunning in een voor hem begrijpelijke taal informatie verschaft over de
      rechten en plichten die verbonden zijn aan de verblijfsvergunning.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de wijze waarop de informatie,
      bedoeld in het eerste lid, wordt verschaft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.122
