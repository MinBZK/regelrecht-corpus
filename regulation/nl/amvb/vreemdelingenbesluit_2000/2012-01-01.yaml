  - number: '3.31'
    text: |-
      1 Met inachtneming van het tweede lid en de [artikelen 3.33][ref1] en [3.99 tot en met 3.104][ref2],
      wordt de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref3], onder een
      beperking verband houdend met het verrichten van arbeid in loondienst verleend aan de vreemdeling
      die in Nederland arbeid in loondienst verricht of gaat verrichten en waarvoor na toetsing aan
      prioriteitgenietend aanbod op de Nederlandse arbeidsmarkt een tewerkstellingsvergunning als bedoeld in
      [artikel 1, onder e, van de Wet arbeid vreemdelingen][ref4] is afgegeven.

      2 De in het eerste lid bedoelde verblijfsvergunning wordt verleend, indien de vreemdeling:

      a. beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel waarvoor
      de verblijfsvergunning is aangevraagd, of behoort tot één van de in [artikel 17 van de Wet][ref5] of in
      [artikel 3.71, tweede lid][ref6], bedoelde categorieën;

      b. beschikt over een geldig document voor grensoverschrijding, of naar het oordeel van Onze Minister heeft
      aangetoond dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van
      een geldig document voor grensoverschrijding kan worden gesteld;

      c. met de arbeid in loondienst duurzaam en zelfstandig voldoende middelen van bestaan als bedoeld in
      [artikel 3.74, eerste lid, onder a][ref7], verwerft;

      d. bereid is een onderzoek naar of behandeling voor tuberculose te ondergaan en daaraan mee te werken of de
      nationaliteit bezit van een van de bij ministeriële regeling vast te stellen landen, en

      e. geen gevaar vormt voor de openbare orde of nationale veiligheid als bedoeld in de [artikelen 3.77][ref8] en
      [3.78][ref9].

      3 Indien de tewerkstellingsvergunning is afgegeven met een geldigheidsduur korter dan één jaar, zijn de middelen
      van bestaan in afwijking van [artikel 3.75][ref10] duurzaam, indien de vreemdeling gedurende de geldigheidsduur van
      de tewerkstellingsvergunning zelfstandig zal beschikken over voldoende middelen van bestaan uit die arbeid.

      4 In andere gevallen kan de in het eerste lid bedoelde verblijfsvergunning worden verleend.

      5 De aanvraag die is ingediend door een langdurig ingezetene wordt niet afgewezen op de gronden, bedoeld in het
      tweede lid, onder a of d.


