        artikel: '50'
  - number: '4.19'
    text: |-
      1 Een beslissing van de bevelhebber van de Koninklijke marechaussee of de korpschef, genomen krachtens
      [artikel 50, vierde lid, van de Wet][ref1], wordt ten uitvoer gelegd in een cel van de Koninklijke marechaussee
      respectievelijk op een politiebureau. De Regeling politiecellencomplex is van overeenkomstige toepassing op de
      tenuitvoerlegging van de beslissing in een cel van de Koninklijke marechaussee.

      2 De [artikelen 5.3][ref2] en [5.5][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel5.3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel5.5
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.19
