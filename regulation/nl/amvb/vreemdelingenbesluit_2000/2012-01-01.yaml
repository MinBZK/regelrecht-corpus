  - number: '3.110'
    text: |-
      1 Voor het onderzoek naar de aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28 van de Wet][ref1], zijn in een Aanmeldcentrum acht dagen beschikbaar.

      2 Onze Minister kan de in het eerste lid genoemde termijn verlengen. In dat geval zijn voor het onderzoek in een
      Aanmeldcentrum ten hoogste veertien dagen beschikbaar.

      3 De termijnen, genoemd in het eerste en tweede lid, vangen aan op de dag waarop de aanvraag tot het verlenen van
      de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref2], wordt ingediend. Voor die
      termijnen tellen, met uitzondering van het Aanmeldcentrum Schiphol, de dagen gedurende het weekeinde en de dagen
      die bij of krachtens de [Algemene termijnenwet][ref3] zijn aangemerkt als algemeen erkende feestdagen niet mee,
      tenzij bij ministeriële regeling wordt bepaald dat deze wel meetellen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002448
