  - number: '4.32'
    text: |-
      1 Uit de aantekening, bedoeld in [artikel 4.29, eerste lid, onder b][ref1], blijkt op welke datum de vreemdeling is
      veranderd van woon- of verblijfplaats binnen Nederland.

      2 De aantekening, bedoeld in het eerste lid, wordt door de korpschef van het regionale politiekorps waarin de
      nieuwe woon- of verblijfplaats is gelegen, gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.29
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.32
