  - number: '3.105'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref1], wordt verleend of verlengd
      voor vijf jaar.

      2 Bij dit besluit kunnen gevallen worden aangewezen waarin de verblijfsvergunning wordt verleend of verlengd
      voor minder dan vijf achtereenvolgende jaren, met dien verstande dat de verblijfsvergunning op grond van
      [artikel 29, eerste lid, onder a, van de Wet][ref2] voor ten minste drie jaar en de verblijfsvergunning op grond
      van [artikel 29, eerste lid, onder b, van de Wet][ref3] voor ten minste één jaar wordt verleend of verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel29
