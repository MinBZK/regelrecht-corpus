  - number: '8.17'
    text: |-
      1 Duurzaam verblijfsrecht in Nederland heeft:

      a. de vreemdeling, bedoeld in [artikel 8.7, eerste lid][ref1], die gedurende vijf jaar ononderbroken rechtmatig
      verblijf in Nederland heeft gehad;

      b. de vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref2], die gedurende vijf jaar
      ononderbroken rechtmatig verblijf heeft gehad bij een vreemdeling als bedoeld onder a, waarbij mede wordt betrokken
      de periode waarin hij voldeed aan de voorwaarden van [artikel 8.15, vijfde lid, onder a, b of c][ref3].

      2 Voor de berekening van het ononderbroken verblijf, bedoeld in het eerste lid, vormt geen onderbreking een
      afwezigheid uit Nederland:

      a. van ten hoogste zes maanden per jaar;

      b. om belangrijke redenen gedurende een eenmalige periode van ten hoogste twaalf achtereenvolgende maanden;

      c. voor de vervulling van militaire verplichtingen; of

      d. wegens uitzending voor het verrichten van werkzaamheden.

      3 De periode van vijf jaar, bedoeld in eerste lid, geldt niet voor:

      a. de werknemer of zelfstandige die langer dan drie jaar ononderbroken in Nederland heeft gewoond, die gedurende
      de laatste twaalf maanden in Nederland werkzaamheden heeft verricht en die op het tijdstip waarop hij zijn
      werkzaamheid staakt, de 65-jarige leeftijd heeft bereikt;

      b. de werknemer die langer dan drie jaar ononderbroken in Nederland heeft gewoond, die gedurende de laatste twaalf
      maanden in Nederland werkzaamheden heeft verricht en die zijn werkzaamheden staakt ten gevolge van vervroegde
      uittreding;

      c. de werknemer of zelfstandige die zijn werkzaamheden na meer dan twee jaar ononderbroken verblijf in Nederland
      staakt als gevolg van blijvende arbeidsongeschiktheid;

      d. de werknemer of zelfstandige die in Nederland zijn werkzaamheden staakt wegens blijvende arbeidsongeschiktheid
      als gevolg van een arbeidsongeval of een beroepsziekte waardoor recht is ontstaan op een uitkering die geheel of
      ten dele ten laste komt van een Nederlandse instelling;

      e. de werknemer of zelfstandige die, na drie jaar ononderbroken in Nederland werkzaam te zijn geweest en in
      Nederland te hebben verbleven, werkzaam is in een andere lidstaat, zijn woning in Nederland aanhoudt en daar ten
      minste eenmaal per week naar terugkeert.

      4 Bij de toepassing van het derde lid worden als arbeidsperioden mede in aanmerking genomen:

      a. het naar behoren door het Uitvoeringsinstituut werknemersverzekeringen vastgestelde tijdvak van onvrijwillige
      werkloosheid waarin de vreemdeling wegens een niet-toerekenbare reden niet heeft gewerkt;

      b. de periode van afwezigheid of arbeidsonderbreking wegens ziekte of ongeval.

      5 Bij de toepassing van het derde lid, onder a tot en met d, worden de tijdvakken van werkzaamheid in de lidstaat
      waarin de betrokkene werkzaam is, aangemerkt als in Nederland vervulde tijdvakken van werkzaamheid.

      6 De in het derde lid, onder a en b, gestelde voorwaarden inzake de duur van het verblijf en van de werkzaamheid,
      en de in het derde lid, onder c en d, gestelde voorwaarde inzake de duur van het verblijf, zijn niet van toepassing
      indien de echtgenoot of de geregistreerde partner van de werknemer of zelfstandige Nederlander is of de Nederlandse
      nationaliteit heeft verloren als gevolg van het huwelijk met die werknemer of zelfstandige.

      7 De bij hem in Nederland verblijvende familieleden van de werknemer of zelfstandige hebben
      duurzaam verblijfsrecht, indien de werknemer of zelfstandige een nationaliteit als bedoeld in
      [artikel 8.7, eerste lid][ref4], bezit en:

      a. op grond van het derde tot en met het zesde lid duurzaam verblijfsrecht in Nederland heeft verkregen; of

      b. tijdens zijn werkzame leven is overleden, voordat hij op grond van het derde tot en met het zesde lid duurzaam
      verblijfsrecht in Nederland verkreeg, en:

      1°. hij op het tijdstip van zijn overlijden gedurende twee jaar ononderbroken in Nederland heeft verbleven;

      2°. zijn overlijden het gevolg was van een arbeidsongeval of beroepsziekte; of

      3°. zijn echtgenoot de Nederlandse nationaliteit als gevolg van hun huwelijk heeft verloren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8.7
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8.7
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8.15
