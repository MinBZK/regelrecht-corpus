  - number: '3.88'
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref1], verleend onder een beperking verband houdend met de vervolging van mensenhandel,
      wordt niet op grond van [artikel 18, eerste lid, onder f, van de Wet][ref2] afgewezen om de enkele reden dat een
      beslissing tot niet vervolging of niet verdere vervolging van de verdachte is genomen, indien de vreemdeling tegen
      die beslissing schriftelijk beklag heeft gedaan bij het Gerechtshof en op dat beklag nog niet is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
