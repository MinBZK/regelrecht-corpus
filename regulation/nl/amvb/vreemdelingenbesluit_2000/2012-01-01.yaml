  - number: '4.22'
    text: |-
      1 De documenten, bedoeld in [artikel 4.21, eerste lid, onder a tot en met d][ref1], worden door Onze Minister
      vervangen, indien:

      a. de vreemdeling aan wie het document werd afgegeven, overeenkomstig [artikel 4.44][ref2] aangifte heeft gedaan
      van vermissing, verlies of het voor identificatie ondeugdelijk worden van dat document, en

      b. Onze Minister heeft vastgesteld dat er gegronde redenen zijn om te veronderstellen dat de aangifte naar waarheid
      is gedaan.

      2 Onverminderd het eerste lid worden de documenten, bedoeld in [artikel 4.21, eerste lid, onder a][ref3], telkens
      vijf jaren na de afgifte ervan, vervangen.


