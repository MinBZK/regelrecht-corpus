  - number: '4.31'
    text: |-
      1 De aantekening, bedoeld in [artikel 4.29, eerste lid, onder g][ref1], wordt gesteld indien op grond van
      [artikel 3.1][ref2] uitzetting van de vreemdeling achterwege blijft. De datum waarop de aanvraag is ontvangen wordt
      eveneens aangetekend. Indien de aanvraag wordt afgewezen, wordt «vervallen» aangetekend.

      2 Uit de aantekening blijkt of het de vreemdeling is toegestaan arbeid te verrichten en of voor deze arbeid
      ingevolge de [Wet arbeid vreemdelingen][ref3] een tewerkstellingsvergunning vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.29
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3.1
      [ref3]: https://wetten.overheid.nl/BWBR0007149
