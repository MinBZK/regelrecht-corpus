  - number: 3.98b
    text: |-
      1 Tot het basisexamen inburgering wordt niet toegelaten de vreemdeling die:

      a. niet overeenkomstig door Onze Minister voor Wonen, Wijken en Integratie te stellen regels de aan het basisexamen
      verbonden kosten heeft voldaan, of

      b. geen medewerking heeft verleend aan het vastleggen van gegevens met het oog op zijn identificatie.

      2 De kosten, bedoeld in het eerste lid, onder a, bedragen € 350,00.

      3 De medewerking, bedoeld in het eerste lid, onder b, bestaat uit het zich digitaal laten fotograferen, het
      laten nemen van digitale vingerafdrukken en het laten maken van een scan of kopie van het paspoort of, indien de
      vreemdeling door de autoriteiten van het land waarvan hij onderdaan is, niet in het bezit kan worden gesteld van
      een paspoort, een ander identiteitsbewijs.

      4 Onze Minister voor Wonen, Wijken en Integratie stelt een examenreglement vast. Het examenreglement bevat in elk
      geval bepalingen omtrent:

      a. de gang van zaken tijdens het basisexamen inburgering;

      b. de maatregelen om onregelmatigheden en ordeverstoring tijdens het basisexamen inburgering te voorkomen, en

      c. de maatregelen die in geval van onregelmatigheden of ordeverstoring kunnen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.98b
  - number: 3.98c
    text: |-
      1 Het basisexamen inburgering wordt onder toezicht van een door het hoofd van de Nederlandse diplomatieke of
      consulaire vertegenwoordiging aan te wijzen ambtenaar, medewerker, autoriteit of instelling afgelegd op een door
      dat hoofd vast te stellen tijdstip en in een door dat hoofd aan te wijzen ruimte.

      2 Het basisexamen inburgering wordt afgelegd door middel van een telefonische of digitale verbinding met een
      geautomatiseerd systeem, dat door een door Onze Minister voor Wonen, Wijken en Integratie aan te wijzen instantie
      volgens door Onze Minister voor Wonen, Wijken en Integratie te stellen regels wordt beheerd.

      3 Onze Minister voor Wonen, Wijken en Integratie beoordeelt de resultaten van het basisexamen inburgering door
      middel van het geautomatiseerde systeem, bedoeld in het tweede lid.

      4 Het resultaat van het basisexamen inburgering wordt in de gevallen waarin Onze Minister voor Wonen, Wijken
      en Integratie niet door middel van het geautomatiseerde systeem, bedoeld in het tweede lid, tot een beoordeling
      daarvan heeft kunnen komen, beoordeeld door examinatoren.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.98c
  - number: 3.98d
    text: |-
      1 De resultaten van het basisexamen inburgering worden niet heroverwogen.

      2 Onverminderd [artikel 3.98b][ref1], kan de vreemdeling die het basisexamen inburgering niet met goed gevolg heeft
      afgelegd, het examen te allen tijde opnieuw afleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.98b
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.98d
