        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2.1a
    text: |-
      1 De toegang wordt niet geweigerd, indien de vreemdeling naar Nederland terugkeert als gezinslid van
      een langdurig ingezetene, die houder is van een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20 van de Wet][ref1] en die na verblijfsbeëindiging door een andere staat die partij is bij het Verdrag
      betreffende de werking van de Europese Unie uit die staat naar Nederland terugkeert.

      2 De toegang wordt evenmin geweigerd, indien de vreemdeling uit een andere staat die partij is bij het Verdrag
      betreffende de werking van de Europese Unie naar Nederland terugkeert als:

      a. houder of voormalig houder van een door Onze Minister afgegeven Europese blauwe kaart;

      b. gezinslid van een vreemdeling als bedoeld in onderdeel a, voor zover dat gezinslid houder is of
      is geweest van een door Onze Minister afgegeven verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Wet][ref2], onder een beperking verband houdend met gezinshereniging of gezinsvorming met die
      vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel2.1a
