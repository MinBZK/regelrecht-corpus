        artikel: '8'
  - number: '3.45'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden verleend onder
      een beperking verband houdend met uitwisseling aan de vreemdeling van achttien jaar of ouder met de Australische,
      Canadese of Nieuw-Zeelandse nationaliteit:

      a. die voldoet aan de nader door Onze Minister te stellen vereisten ten aanzien van leeftijd en burgerlijke staat;

      b. die niet de zorg heeft voor afhankelijke gezinsleden, en

      c. wiens vertrek uit Nederland naar het oordeel van Onze Minister redelijkerwijs is gewaarborgd.

      2 In afwijking van [artikel 3.75][ref2] zijn middelen van bestaan duurzaam, indien zij voor een periode van zes
      weken beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3.75
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.45
