  - number: 4.35a
    text: |-
      1 De aantekening, bedoeld in [artikel 4.29, eerste lid, onder j][ref1], wordt geplaatst, indien de korpschef of
      de bevelhebber van de Koninklijke marechaussee vermoedt dat de vreemdeling zal trachten naar Nederland terug te
      keren zonder te voldoen aan de vereisten voor toegang tot Nederland. De aantekening wordt niet gesteld indien het
      vertrek, de uitzetting of de doorreis van de vreemdeling door, of diens toegang tot een derde land, niet zijnde een
      andere staat als bedoeld in [artikel 1.3][ref2], daardoor wordt bemoeilijkt.

      2 Uit de aantekening blijken de duur van het inreisverbod en de datum waarop het is uitgevaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.29
