    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Justitie van 18 augustus 2000, nr. 5077321/00/6;

    Gelet op de artikelen 2, vierde lid, onder b, vijfde en zesde lid, 3, eerste lid, onder d, en tweede lid, 4, derde
    lid, 8, onder f en g, 10, eerste lid, 11, eerste en derde lid, 12, eerste en tweede lid, 14, tweede en derde lid,
