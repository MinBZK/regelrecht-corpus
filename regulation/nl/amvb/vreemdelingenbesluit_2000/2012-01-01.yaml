  - number: '5.5'
    text: |-
      1 Gedurende de tenuitvoerlegging van een vrijheidsontnemende maatregel ingevolge de
      [artikelen 6, tweede lid][ref1], [58, eerste lid][ref2], of [59, eerste lid, van de Wet][ref3], kan de vreemdeling
      voor korte duur naar elders worden gebracht, wanneer dit redelijkerwijs nodig is voor de toepassing van de Wet.

      2 Van de tenuitvoerlegging van een vrijheidsontnemende maatregel als bedoeld in het eerste lid, wordt op verzoek
      van de vreemdeling zo spoedig mogelijk kennis gegeven aan diens naaste verwanten of aan een in Nederland gevestigde
      diplomatieke of consulaire vertegenwoordiging van de staat waarvan hij onderdaan is.

      3 In geval de vrijheidsontnemende maatregel een minderjarige betreft wordt daarvan, zo daartoe de gelegenheid
      bestaat, ambtshalve zo spoedig mogelijk kennis gegeven aan degenen die de ouderlijke macht of de voogdij over die
      minderjarige uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59
