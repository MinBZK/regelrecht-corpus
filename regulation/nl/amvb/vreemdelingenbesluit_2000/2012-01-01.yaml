      1 Onder een persoon als bedoeld in artikel 1F van het Vluchtelingenverdrag wordt mede verstaan een persoon die
      heeft aangezet tot of anderszins heeft deelgenomen aan de in dat artikel genoemde misdrijven of daden.

      2 Indien artikel 1F van het Vluchtelingenverdrag aan het verlenen van een verblijfsvergunning aan de vreemdeling
      op grond van [artikel 29, eerste lid, onder a, van de Wet][ref1] in de weg staat, wordt aan die vreemdeling evenmin
      een verblijfsvergunning verleend op één van de andere gronden bedoeld in [artikel 29 van de Wet][ref2].

      3 Aan de echtgenoot of echtgenote, het minderjarig kind, de partner of het meerderjarig kind, bedoeld in
      [artikel 29, eerste lid, onder e of f, van de Wet][ref3], van de vreemdeling, bedoeld in het eerste lid, wordt
      geen verblijfsvergunning als bedoeld in [artikel 28 van de Wet][ref4], verleend, tenzij dit gezinslid aannemelijk
      heeft gemaakt dat zijn aanvraag is gegrond op omstandigheden die zelfstandig een rechtsgrond voor verlening van een
      verblijfsvergunning op grond van [artikel 29, eerste lid, onder a, b of c, van de Wet][ref5] vormen.


