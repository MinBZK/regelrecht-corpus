        bwb_id: BWBR0007149
  - number: '3.40'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden verleend
      onder een beperking verband houdend met verblijf als niet-geprivilegieerd militair of niet-geprivilegieerd
      burgerpersoneel aan:

      a. de militair die in Nederland woonachtig is en die niet behoort tot een in Nederland gelegerde of op doortocht
      zijnde krijgsmacht en evenmin verbonden is aan een hier te lande gevestigd internationaal militair hoofdkwartier en
      niet geprivilegieerd is;

      b. de vreemdeling die behoort tot het burgerpersoneel, die in Nederland woont en die in dienst is van een
      krijgsmacht of van een internationaal militair hoofdkwartier, of

      c. de vreemdeling die gezinslid of familielid is van de vreemdeling, bedoeld onder a of b.

      2 Onder gezinslid of familielid wordt verstaan:

      a. de echtgenoot of echtgenote;

      b. het kind beneden de leeftijd van 21 jaar, en

      c. de bloedverwant of aanverwant van de vreemdeling of zijn echtgenoot, in opgaande en neerdalende lijn, voorzover
      die te zijnen laste komt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '3.41'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met het volgen van studie worden verleend aan de vreemdeling:

      a. die voltijds hoger, voortgezet of beroepsonderwijs volgt aan een bij ministeriële regeling aan te wijzen
      onderwijsinstelling;

      b. die met een door de bevoegde autoriteiten van de onder a bedoelde onderwijsinstelling afgegeven schriftelijke
      verklaring aantoont dat hij als student is of zal worden ingeschreven voor voltijdsonderwijs, en

      c. wiens vertrek uit Nederland na voltooiing of tussentijdse beëindiging van de studie naar het oordeel van Onze
      Minister redelijkerwijs is gewaarborgd.

      2 Indien de vreemdeling in Nederland wil verblijven voor het volgen van voortgezet onderwijs of beroepsonderwijs,
      kan de verblijfsvergunning slechts worden verleend, indien het een dagopleiding betreft waarvoor Nederland naar het
      oordeel van Onze Minister het meest aangewezen land is en waarmee de vreemdeling naar het oordeel van Onze Minister
      een positieve bijdrage kan leveren aan de ontwikkeling van het land van herkomst.

      3 In afwijking van het eerste lid, onder b, kan de verblijfsvergunning worden verleend aan de vreemdeling die
      in Nederland wil verblijven ter voorbereiding op hoger onderwijs in Nederland, indien uit een door de bevoegde
      autoriteiten afgegeven schriftelijke verklaring blijkt dat de vreemdeling als student zal worden ingeschreven voor
      voltijdsonderwijs.

      4 De aanvraag die is ingediend door een langdurig ingezetene die in Nederland hoger of beroepsonderwijs als bedoeld
      in het eerste lid, onder a, wil volgen wordt niet afgewezen op grond dat hij het onderwijs niet voltijds wil volgen
      en evenmin op de grond, bedoeld in het eerste lid, onder c.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.41
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.41a
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de behandeling van de aanvraag tot
      het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14 van de Wet][ref1], onder een
      beperking verband houdend met het volgen van studie als bedoeld in [artikel 3.41][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3.41
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.41a
