  - number: '4.24'
    text: |-
      1 Naast het plaatsen van de in artikel 10 en bijlage IV van de Schengengrenscode bedoelde inreis- en uitreisstempel,
      kunnen ambtenaren belast met de grensbewaking, op grond van [artikel 52, eerste lid, van de Wet][ref1], in het
      reis- of identiteitspapier van de vreemdeling aantekeningen stellen omtrent:

      a. inreis in Nederland;

      b. het doel en de duur van het voorgenomen verblijf in Nederland;

      c. de middelen waarover de vreemdeling met het oog op de toegang tot Nederland beschikt of kan beschikken;

      d. aanmelding bij een korpschef;

      e. de toepassing van [artikel 2.4][ref2];

      f. het weigeren van toegang tot Nederland;

      g. vertrek of uitzetting uit Nederland, of

      h. uitreis uit Nederland.

      2 Elke doorhaling of vervallenverklaring van een in een reis- of identiteitspapier van een vreemdeling gestelde
      aantekening, wordt door de ambtenaar die de doorhaling of vervallenverklaring verricht, gedateerd en van diens
      paraaf voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.24
