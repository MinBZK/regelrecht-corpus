        bwb_id: BWBR0011823
        artikel: '8'
  - number: '4.52'
    text: |-
      1 De vreemdeling levert het document, bedoeld in [artikel 9 van de Wet][ref1], in ieder geval in persoon in bij de
      korpschef van het regionale politiekorps waarin de gemeente van verblijf is gelegen:

      a. zodra hij niet meer rechtmatig verblijft, doch uiterlijk op het moment waarop de vertrektermijn, bedoeld in
      [artikel 62 van de Wet][ref2], verstrijkt, en

      b. vóór zijn vertrek naar het buitenland, indien hij zijn hoofdverblijf buiten Nederland verplaatst.

      2 De persoon die het Nederlanderschap heeft verkregen levert het document, bedoeld in [artikel 9 van de Wet][ref3],
      in bij de korpschef van het regionale politiekorps waarin de gemeente waar hij zijn woon- of verblijfsplaats heeft
      is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
