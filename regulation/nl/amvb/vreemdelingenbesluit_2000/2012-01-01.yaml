  - number: '7.2'
    text: |-
      1 De uitzetting van de vreemdeling blijft, in afwijking van [artikel 73, tweede lid, van de Wet][ref1] achterwege,
      indien het betreft een vreemdeling, die:

      a. onderdaan is van een land dat partij is bij het Europees Vestigingsverdrag;

      b. onmiddellijk voorafgaande aan het tijdstip waarop het rechtmatig verblijf, bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2] is geëindigd, gedurende twee aaneengesloten jaren
      dit rechtmatig verblijf heeft gehad;

      c. zijn hoofdverblijf niet buiten Nederland heeft gevestigd, en

      d. tijdig bezwaar heeft gemaakt dan wel administratief beroep heeft ingesteld tegen een beschikking waarbij het
      rechtmatig verblijf is beëindigd.

      2 Het eerste lid blijft buiten toepassing, indien de uitzetting van de vreemdeling wegens dwingende redenen van
      nationale veiligheid gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
