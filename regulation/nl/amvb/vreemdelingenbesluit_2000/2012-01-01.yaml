  - number: '8.15'
    text: |-
      1 Het rechtmatig verblijf van de vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die niet
      de nationaliteit bezit van een staat als bedoeld in het eerste lid van dat artikel, eindigt niet door afwezigheid
      uit Nederland:

      a. van ten hoogste zes maanden per jaar;

      b. om belangrijke redenen gedurende een eenmalige periode van ten hoogste twaalf maanden;

      c. voor de vervulling van militaire verplichtingen;

      d. wegens uitzending voor het verrichten van werkzaamheden.

      2 Onverminderd het vijfde lid eindigt het rechtmatig verblijf evenmin door het overlijden van de vreemdeling,
      bedoeld in [artikel 8.7, eerste lid][ref2], bij wie hij in Nederland verbleef:

      a. indien hij ten minste een jaar voor het overlijden van die vreemdeling in Nederland verbleef;

      b. voor voltooiing van de studie, indien hij in Nederland verbleef als het kind van die vreemdeling en voor studie
      is ingeschreven bij een onderwijsinstelling, dan wel indien hij de verzorgende ouder is van een zodanig kind.

      3 Het tweede lid, aanhef en onder b, is van overeenkomstige toepassing bij het vertrek van de vreemdeling, bedoeld
      in [artikel 8.7, eerste lid][ref3], bij wie de vreemdeling in Nederland verbleef.

      4 Onverminderd het vijfde lid eindigt het rechtmatig verblijf evenmin door de ontbinding of nietigverklaring van
      het huwelijk of de beëindiging van het geregistreerde partnerschap:

      a. indien het huwelijk voor het begin van de gerechtelijke procedure tot scheiding of nietigverklaring,
      onderscheidenlijk het partnerschap voor beëindiging daarvan, ten minste drie jaar heeft geduurd, waarvan de
      vreemdeling ten minste één jaar in Nederland heeft verbleven;

      b. indien het gezag over de kinderen bij overeenkomst tussen de voormalige echtgenoten of partners, dan wel bij
      rechterlijke beslissing aan de vreemdeling is toegewezen;

      c. voor de duur waarvoor de omgang is voorgeschreven, indien de vreemdeling op grond van een overeenkomst of
      gerechtelijke beslissing het omgangsrecht met betrekking tot een minderjarig kind heeft en de omgang ingevolge een
      rechterlijke beslissing in Nederland moet plaatsvinden, of

      d. indien klemmende redenen van humanitaire aard tot aanvaarding van voortgezet verblijf nopen.

      5 In afwijking van het tweede lid, onder a, en het vierde lid, kan het rechtmatig verblijf van de vreemdeling,
      bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref4], die niet de nationaliteit van een staat bezit als
      bedoeld in het eerste lid van dat artikel, worden beëindigd indien hij een onredelijke belasting voor het sociale
      bijstandsstelsel vormt, tenzij hij het duurzaam verblijfsrecht, bedoeld in [artikel 8.17][ref5] heeft verkregen,
      of hij:

      a. werknemer of zelfstandige is;

      b. voor zichzelf en zijn familieleden beschikt over voldoende middelen van bestaan om te voorkomen dat zij tijdens
      hun verblijf in Nederland ten laste komen van de algemene middelen, en beschikt over een verzekering die de
      ziektekosten in Nederland volledig dekt; of

      c. gezinslid is van het reeds in Nederland gevormde gezin van een persoon die voldoet aan de voorwaarden, bedoeld
      onder a of b.

      6 Voor de toepassing van het vijfde lid, onder b, beschikt de vreemdeling met een inkomen ter hoogte van het
      normbedrag dat in [artikel 3.74][ref6] voor de desbetreffende categorie is vastgesteld, in ieder geval over
      voldoende middelen van bestaan.


