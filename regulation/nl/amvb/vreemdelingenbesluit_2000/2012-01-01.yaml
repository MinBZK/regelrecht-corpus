  - number: '3.9'
    text: |-
      1 De waarborgsom, bedoeld in [artikel 3.7, eerste lid, onder a][ref1], wordt in ieder geval door Onze Minister aan
      de rechthebbende teruggegeven:

      a. zodra de verblijfsvergunning, bedoeld in [artikel 14 van de Wet][ref2], of het desbetreffende voorschrift, is
      ingetrokken, dan wel de geldigheidsduur van de verblijfsvergunning is verstreken;

      b. zodra aan de vreemdeling de verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20 van de Wet][ref3],
      is verleend;

      c. zodra de vreemdeling Nederlander wordt of krachtens enige wet als Nederlander moet worden behandeld;

      d. bij overlijden van de vreemdeling, dan wel

      e. uiterlijk vijf jaar nadat de waarborgsom is gestort.

      2 Indien een waarborgsom wordt teruggegeven wegens het intrekken of het verstrijken van de geldigheidsduur van
      de verblijfsvergunning, bedoeld in het eerste lid, onder a, vindt de teruggave plaats met aftrek van de door de
      overheid gemaakte of te maken kosten, verbonden aan de reis van de vreemdeling naar een plaats buiten Nederland
      waar zijn toegang is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.7
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.9
