  - number: '3.55'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met wedertoelating voorts worden verleend aan de vreemdeling, die in aanmerking komt voor de
      terugkeeroptie op grond van [artikel 8 van de Remigratiewet][ref2], en die direct voorafgaande aan de remigratie:

      a. gedurende drie achtereenvolgende jaren rechtmatig verblijf als bedoeld in
      [artikel 8, onder a, c, e dan wel l, van de Wet][ref3], in Nederland had;

      b. als het minderjarige kind van een Nederlander of van een vreemdeling met rechtmatig verblijf als bedoeld
      in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref4], zelf rechtmatig verblijf als bedoeld in
      [artikel 8, onder a, c, e dan wel l, van de Wet][ref5] had, ongeacht de duur daarvan, en tegelijkertijd met die
      Nederlander of die vreemdeling om verblijf verzoekt, of

      c. als het minderjarige kind van een Nederlander of van een vreemdeling met rechtmatig verblijf als bedoeld
      in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref6], zelf rechtmatig verblijf als bedoeld in
      [artikel 8, onder a, c, e dan wel l, van de Wet][ref7] had, ongeacht de duur daarvan, die binnen een jaar na
      remigratie meerderjarig is geworden en die zelfstandig om verblijf verzoekt.

      2 De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder c, van de Wet][ref8].
      De[ artikelen 3.77][ref9] en [3.78][ref10] zijn niet van toepassing. De [artikelen 3. 86][ref11] en [3.87][ref12]
      zijn van overeenkomstige toepassing.


