  - number: '3.90'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], die is verleend onder een
      beperking verband houdend met gezinshereniging of gezinsvorming, wordt niet ingetrokken op de enkele grond dat
      de samenwoning tijdelijk is verbroken, indien de vreemdeling de persoon bij wie verblijf is toegestaan wegens
      gewelddaden heeft verlaten.

      2 Het eerste lid is niet van toepassing, indien er sedert de verbreking van de samenwoning een jaar is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.90
