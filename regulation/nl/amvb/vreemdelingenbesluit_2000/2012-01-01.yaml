  - number: '8.3'
    text: |-
      1 De vreemdeling die geen rechtmatig verblijf heeft op grond van [artikel 8 van de Wet][ref1] kan geen aanspraak
      maken op een beschikking als bedoeld in:

      a. de [artikelen 4, eerste lid][ref2], en [15 van de Vestigingswet Bedrijven 1954][ref3];

      b. de [artikelen 30b][ref4] en [30h van de Wet op de kansspelen][ref5];

      c. [artikel 3 van de Drank- en Horecawet][ref6];

      d. de [artikelen 2, eerste lid][ref7], en
      [7 van de Wet particuliere beveiligingsorganisaties en recherchebureaus][ref8];

      e. [artikel 4, tweede lid, van de Wet personenvervoer 2000][ref9].

      2 De vreemdeling, bedoeld in het eerste lid, kan geen aanspraak maken op de toekenning van vergunningen
      en ontheffingen door bestuursorganen van gemeenten, provincies, waterschappen en met toepassing van de
      [Wet gemeenschappelijke regelingen][ref10] ingestelde openbare lichamen of gemeenschappelijke regelingen, voorzover
      die vergunningen of ontheffingen betrekking hebben op standplaatsen, markten, venten, collecteren, evenementen of
      beroepsmatige dan wel bedrijfsmatige activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
