  - number: '8.7'
    text: |-
      1 Deze paragraaf is van toepassing op vreemdelingen die de nationaliteit bezitten van een staat die partij is bij
      het Verdrag betreffende de werking van de Europese Unie of bij de Overeenkomst betreffende de Europese Economische
      Ruimte, dan wel van Zwitserland, en die zich naar Nederland begeven of in Nederland verblijven.

      2 Deze paragraaf is eveneens van toepassing op de familieleden die een vreemdeling als bedoeld in het eerste lid
      naar Nederland begeleiden of zich bij hem in Nederland voegen, voor zover het betreft:

      a. de echtgenoot;

      b. de partner, waarmee de vreemdeling een naar Nederlands internationaal privaatrecht geldig geregistreerd
      partnerschap is aangegaan;

      c. de rechtstreekse bloedverwant in neergaande lijn, van een vreemdeling als bedoeld in het eerste lid, of van
      diens echtgenoot of geregistreerd partner, voor zover die bloedverwant jonger is dan 21 jaar of ten laste is van
      die echtgenoot of geregistreerd partner; of

      d. de rechtstreekse bloedverwant in opgaande lijn die ten laste is van de vreemdeling of van het gezinslid, bedoeld
      onder a of b.

      3 Deze paragraaf is voorts van toepassing op andere familieleden dan bedoeld in het tweede lid, die een vreemdeling
      als bedoeld in het eerste lid naar Nederland begeleiden of zich bij hem in Nederland voegen, in geval zij:

      a. in het land van herkomst ten laste zijn van of inwonen bij die vreemdeling; of

      b. vanwege ernstige gezondheidsredenen een persoonlijke verzorging door die vreemdeling strikt behoeven.

      4 Deze paragraaf is eveneens van toepassing op de ongehuwde partner die een vreemdeling als bedoeld in het eerste
      lid naar Nederland begeleidt of zich bij hem in Nederland voegt en die een deugdelijk bewezen duurzame relatie met
      die vreemdeling heeft, en op de rechtstreekse bloedverwant in de neergaande lijn van een zodanige partner, voor
      zover die bloedverwant jonger is dan 18 jaar en die partner vergezelt of zich bij die partner in Nederland voegt.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel8.7
  - number: '8.8'
    text: |-
      1 Aan een vreemdeling als bedoeld in [artikel 8.7][ref1], die in het bezit is van een geldig document voor
      grensoverschrijding, kan de toegang tot Nederland slechts worden geweigerd om redenen van openbare orde of openbare
      veiligheid, dan wel volksgezondheid:

      a. indien de vreemdeling op grond van zijn persoonlijke gedrag een actuele, werkelijke en ernstige bedreiging voor
      een fundamenteel belang van de samenleving vormt;

      b. in het geval van potentieel epidemische ziekten zoals gedefinieerd in de relevante instrumenten van de
      Wereldgezondheidsorganisatie dan wel andere infectieziekten of besmettelijke parasitaire ziekten, ten aanzien
      waarvan in Nederland beschermende regelingen ten aanzien van Nederlanders worden getroffen;

      c. indien hij om redenen van de openbare orde of openbare veiligheid uit Nederland is verwijderd en sinds de
      verwijdering nog geen redelijke termijn is verstreken.

      2 De ambtenaren, belast met de grensbewaking of met het toezicht op vreemdelingen, weigeren niet dan ingevolge een
      bijzondere aanwijzing van Onze Minister de toegang tot Nederland aan een vreemdeling als bedoeld in het eerste lid.
      De weigering geschiedt schriftelijk.

      3 Het eerste en tweede lid zijn niet van toepassing op de onderdaan van België of Luxemburg die geen
      gemeenschapsonderdaan is. Op deze vreemdeling is [artikel 8.5][ref2] van toepassing.

      4 Een vreemdeling die niet beschikt over het vereiste document voor grensoverschrijding, wordt niet uitgezet dan
      nadat hem gedurende een redelijke termijn de gelegenheid is gegeven dat document te verkrijgen of op andere wijze
      te laten vaststellen of bewijzen dat hij het recht op vrij verkeer en verblijf geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8.7
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8.5
