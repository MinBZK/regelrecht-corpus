        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.106a
    text: |-
      1 De aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de Wet][ref1] wordt slechts afgewezen op grond van [artikel 30, eerste lid, onder d][ref2], of met
      toepassing van [artikel 31, tweede lid, onder h, van de Wet][ref3] indien, naar het oordeel van Onze Minister, alle
      relevante feiten en omstandigheden in aanmerking nemend, de vreemdeling in het betrokken derde land overeenkomstig
      de volgende beginselen zal worden behandeld:

      a. het leven en de vrijheid worden niet bedreigd om redenen van ras, religie, nationaliteit, lidmaatschap van een
      bepaalde sociale groep of politieke overtuiging, en

      b. het beginsel van non-refoulement overeenkomstig het Vluchtelingenverdrag wordt nageleefd, en

      c. het verbod op verwijdering in strijd met het recht op vrijwaring tegen foltering en andere wrede, onmenselijke
      of vernederende behandeling, zoals neergelegd in het internationaal recht, wordt nageleefd, en

      d. de mogelijkheid bestaat om om de vluchtelingenstatus te verzoeken en, indien hij als vluchteling wordt erkend,
      bescherming te ontvangen overeenkomstig het Vluchtelingenverdrag.

      2 De aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de Wet][ref4] wordt slechts afgewezen op grond van [artikel 30, eerste lid, onder d][ref5], of met
      toepassing van [artikel 31, tweede lid, onder h, van de Wet][ref6] indien de vreemdeling een zodanige band heeft
      met het betrokken derde land dat het voor hem redelijk zou zijn naar dat land te gaan.

      3 Bij de beoordeling of sprake is van een band als bedoeld in het tweede lid, worden alle relevante feiten en
      omstandigheden betrokken, waaronder begrepen de aard, duur en omstandigheden van het eerder verblijf.

      4 Bij de beoordeling of de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld
      in [artikel 28 van de Wet][ref7] wordt afgewezen op grond van [artikel 30, eerste lid, onder d, van de Wet][ref8],
      wordt mede betrokken het beroep van de vreemdeling inhoudende dat hij in het derde land zal worden blootgesteld aan
      foltering, wrede, onmenselijke of vernederende behandeling of bestraffing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
