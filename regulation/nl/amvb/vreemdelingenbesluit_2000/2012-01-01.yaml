  - number: '4.47'
    text: |-
      1 De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder i, van de Wet][ref1] en die naar
      Nederland is gekomen voor een verblijf van langer dan drie maanden, meldt zich binnen drie dagen na binnenkomst
      in Nederland in persoon aan bij de korpschef van het regionale politiekorps waarin de gemeente is gelegen waar hij
      woon- of verblijfplaats heeft.

      2 Voor de berekening van de in het eerste lid bedoelde termijn van drie maanden wordt eerder verblijf in Nederland
      binnen een tijdvak van zes maanden, onmiddellijk voorafgaande aan de binnenkomst, mede in aanmerking genomen.

      3 Indien de vreemdeling jonger is dan twaalf jaar, doet degene bij wie de vreemdeling woont of verblijft de
      melding.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.47
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '4.48'
    text: |-
      1 De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder i, van de Wet][ref1] en die naar
      Nederland is gekomen voor een verblijf van ten hoogste drie maanden, meldt zich binnen drie dagen na binnenkomst
      in Nederland in persoon aan bij de korpschef van het regionale politiekorps waarin de gemeente is gelegen waar hij
      woon- of verblijfplaats heeft.

      2 Een verplichting tot aanmelding krachtens het voorgaande lid rust ten aanzien van de vreemdeling beneden de
      leeftijd van twaalf jaar op degene bij wie de vreemdeling woont of verblijft.

      3 Het eerste lid is niet van toepassing op de vreemdeling die zijn intrek neemt in een hotel of in een inrichting,
      waarvan de eigenaar, houder of beheerder bij of krachtens gemeentelijke verordening verplicht is aan de daartoe
      aangewezen autoriteit kennis te geven van het verschaffen van nachtverblijf aan personen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.48
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '4.49'
    text: |-
      1 De vreemdeling die houder is van een visum of een document voor grensoverschrijding waarin door de daartoe
      bevoegde autoriteit een aantekening is gesteld omtrent aanmelding bij een vreemdelingendienst in Nederland, meldt
      zich binnen drie dagen na binnenkomst in Nederland in persoon aan bij de korpschef van het regionale politiekorps
      waarin de in deze aantekening vermelde gemeente is gelegen.

      2 Het eerste lid is niet van toepassing op onderdanen van een staat die partij is bij het Verdrag betreffende de
      werking van de Europese Unie of de Overeenkomst betreffende de Europese Economische Ruimte en op onderdanen van
      Zwitserland.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.49
  - number: '4.50'
    text: |-
      1 De vreemdeling die naar Nederland is gekomen om als zeeman werk te zoeken aan boord van een zeeschip, meldt zich
      binnen drie dagen na binnenkomst in Nederland in persoon aan bij de korpschef van het regionale politiekorps waarin
      de gemeente waar hij werk zoekt is gelegen.

      2 Het eerste lid is niet van toepassing op onderdanen van een staat die partij is bij het Verdrag betreffende de
      werking van de Europese Unie of de Overeenkomst betreffende de Europese Economische Ruimte en op onderdanen van
      Zwitserland.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.50
  - number: '4.51'
    text: |-
      1 Tot periodieke aanmelding als bedoeld in [artikel 54, eerste lid, onder f, van de Wet][ref1], bij de korpschef
      van het regionale politiekorps waarin de gemeente van verblijf is gelegen, is verplicht de vreemdeling die:

      a. geen rechtmatig verblijf heeft en in afwachting is van de feitelijke mogelijkheid tot vertrek of uitzetting, of

      b. rechtmatig verblijft als bedoeld in [artikel 8, onder f, g of h, van de Wet][ref2].

      2 De vreemdeling, bedoeld in het eerste lid, meldt zich wekelijks, tenzij Onze Minister een andere termijn stelt,
      dan wel ontheffing verleent.

      3 Het eerste lid is niet van toepassing, indien de vreemdeling rechtens zijn vrijheid is ontnomen.

      4 Het eerste lid is niet van toepassing op onderdanen van een staat die partij is bij het Verdrag betreffende de
      werking van de Europese Unie of de Overeenkomst betreffende de Europese Economische Ruimte en op onderdanen van
      Zwitserland.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel4.51
