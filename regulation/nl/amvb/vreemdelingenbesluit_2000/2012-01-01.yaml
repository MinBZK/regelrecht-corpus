  - number: 3.1a
    text: |-
      1 Het indienen van een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de wet][ref1] heeft tot gevolg dat de uitzetting achterwege blijft zo lang een besluit als bedoeld
      in artikel 5, derde lid, van de richtlijn tijdelijke bescherming van kracht is, indien de vreemdeling:

      a. behoort tot de specifieke groep vreemdelingen zoals omschreven in een besluit van de Raad van de Europese Unie
      als bedoeld in artikel 5, derde lid, van de richtlijn tijdelijke bescherming;

      b. de echtgenoot is van de vreemdeling, bedoeld onder a, of de ongehuwde partner met wie die vreemdeling een
      duurzame relatie onderhoudt, en ten tijde van de gebeurtenissen die hebben geleid tot het in de aanhef bedoelde
      besluit met die vreemdeling samenwoonde;

      c. het minderjarige, ongehuwde, al dan niet geadopteerde kind is van de vreemdeling, bedoeld onder a of b;

      d. een ander naast familielid is van de vreemdeling, bedoeld onder a, die ten tijde van de gebeurtenissen die
      hebben geleid tot het in de aanhef bedoelde besluit volledig of grotendeels afhankelijk was van die vreemdeling en
      met het gezin samenwoonde, en wiens achterlating een schrijnende situatie zou vormen; of

      e. behoort tot de bij regeling van Onze Minister aan te wijzen groep vreemdelingen uit hetzelfde land of dezelfde
      regio als de vreemdeling, bedoeld onder a, die om dezelfde reden ontheemd zijn en die niet reeds bescherming
      genieten in een ander land dat partij is bij het Verdrag betreffende de werking van de Europese Unie of de
      Overeenkomst betreffende de Europese Economische Ruimte.

      2 In afwijking van het eerste lid kan Onze Minister bepalen dat uitzetting niet achterwege blijft, indien:

      a. de aanvraag met toepassing van [artikel 30, eerste lid, onder a, van de wet][ref2] wordt afgewezen;

      b. de vreemdeling reeds tijdelijke bescherming geniet in een ander land dat partij is bij het Verdrag betreffende
      de werking van de Europese Unie of de Overeenkomst betreffende de Europese Economische Ruimte;

      c. de vreemdeling met toepassing van de richtlijn tijdelijke bescherming wordt overgebracht naar een ander land dat
      partij is bij het Verdrag betreffende de werking van de Europese Unie of de Overeenkomst betreffende de Europese
      Economische Ruimte;

      d. de vreemdeling naar het land of regio van herkomst is teruggekeerd;

      e. ernstige redenen aanwezig zijn om aan te nemen dat de vreemdeling:

      1°. een misdrijf tegen de vrede, een oorlogsmisdrijf, of een misdrijf tegen de menselijkheid heeft begaan als
      omschreven in de internationale instrumenten die bepalingen inzake dergelijke misdrijven bevatten;

      2°. buiten Nederland een ernstig niet-politiek misdrijf heeft begaan alvorens hij tijdelijke bescherming verkreeg;

      3°. zich schuldig heeft gemaakt aan daden die in strijd zijn met de doeleinden en beginselen van de Verenigde
      Naties;

      f. de vreemdeling ingevolge een onherroepelijk geworden veroordeling wegens een bijzonder ernstig misdrijf een
      gevaar vormt voor de Nederlandse samenleving; of

      g. er redelijke gronden aanwezig zijn om de vreemdeling als gevaar voor de nationale veiligheid te beschouwen.

      3 Bij de toepassing van het tweede lid, onderdeel e, onder 2°, wordt de ernst van de verwachte vervolging afgewogen
      tegen de aard van het misdrijf waarvan de vreemdeling wordt verdacht, en kunnen bijzonder wrede handelingen,
      ook indien deze met een vermeend politiek oogmerk zijn verricht, worden aangemerkt als ernstige, niet-politieke
      misdrijven. Dit geldt voor alle deelnemers aan het misdrijf, met inbegrip van hen die het misdrijf hebben
      uitgelokt.

      4 Een besluit op grond van het tweede lid, onder e tot en met g, wordt met inachtneming van het
      evenredigheidsbeginsel gebaseerd op het persoonlijke gedrag van de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30
