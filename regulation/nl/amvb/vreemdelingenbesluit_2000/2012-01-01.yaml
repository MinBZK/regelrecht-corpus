  - number: '3.48'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met de vervolging van mensenhandel worden verleend aan de vreemdeling die:

      a. slachtoffer-aangever is van mensenhandel, voorzover er sprake is van een strafrechtelijk opsporingsonderzoek
      of vervolgingsonderzoek naar of berechting in feitelijke aanleg van de verdachte van het strafbare feit waarvan
      aangifte is gedaan;

      b. slachtoffer is van mensenhandel, voorzover er sprake is van een strafrechtelijk opsporingsonderzoek of
      vervolgingsonderzoek naar of berechting in feitelijke aanleg van de verdachte van het strafbare feit, bedoeld in
      [artikel 273f van het Wetboek van Strafrecht][ref2], en het slachtoffer hieraan op andere wijze dan door het doen
      van aangifte medewerking verleent; of

      c. getuige-aangever is van mensenhandel, voorzover er sprake is van een strafrechtelijk opsporingsonderzoek of
      vervolgingsonderzoek naar of berechting in feitelijke aanleg van de verdachte van het strafbare feit waarvan
      aangifte is gedaan en het verblijf in Nederland van de getuige-aangever naar het oordeel van Onze Minister in het
      belang van de opsporing of vervolging van de verdachte noodzakelijk is;

      d. zonder verblijfstitel slachtoffer is geworden van arbeidsgerelateerde uitbuiting, dan wel als minderjarige
      zonder verblijfstitel is tewerkgesteld, voor zover er sprake is van een strafrechtelijk opsporingsonderzoek of
      vervolgingsonderzoek naar of berechting in feitelijke aanleg van de voormalig werkgever en de vreemdeling hieraan
      medewerking verleent.

      2 De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder c, van de Wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel273f
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel16
