      1 De aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20 van de Wet][ref1] wordt niet op grond van [artikel 21, eerste lid, onder a, van de Wet][ref2]
      afgewezen, indien de aanvraag is ingediend door een meerderjarige vreemdeling die tien aaneengesloten jaren in
      Nederland heeft verbleven:

      a. op grond van een bijzondere geprivilegieerde status, die anders dan door eigen toedoen is verloren;

      b. op grond van een bijzondere geprivilegieerde status als:

      1°. geaccrediteerd lid van het administratief, technisch of bedienend personeel dan wel als particulier bediende,
      in dienst van een buitenlandse diplomatieke of consulaire post,

      2°. geaccrediteerd lid van het hoogste kader, het hoofd inbegrepen, van een internationale organisatie, van het
      geaccrediteerd lid van het administratief, technisch of bedienend personeel van een internationale organisatie, of

      c. als afhankelijk gezinslid van een vreemdeling als bedoeld onder a of b.

      2 De aanvraag wordt niet op grond van [artikel 21, eerste lid, onder b][ref3], afgewezen, indien de
      vreemdeling op het tijdstip waarop de aanvraag is ontvangen niet-tijdelijk verblijfsrecht heeft en in de
      periode van vijf aaneengesloten jaren direct voorafgaande aan dat tijdstip rechtmatig verblijf als bedoeld in
      [artikel 8 onder a tot en met e, dan wel l, van de Wet][ref4] had.

      3 De aanvraag wordt niet op grond van [artikel 21, eerste lid, onder d, van de Wet][ref5] afgewezen, indien de
      aanvraag is ingediend door een vreemdeling:

      a. als bedoeld in [artikel 3.92, eerste lid, onder a][ref6], of

      b. die duurzaam beschikt over een uitkering op grond van de Wet op de arbeidsongeschiktheidsverzekering op basis
      van arbeidsongeschiktheid van ten minste vijfenvijftig procent en op basis van een volledige werkweek, of een
      vergelijkbare arbeidsongeschiktheidsuitkering.

      4 De aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd, bedoeld in
      [artikel 20 van de Wet][ref7], wordt niet afgewezen op de in [artikel 21, eerste lid, onder h, van de Wet][ref8]
      genoemde grond dat de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden die tot
      afwijzing van de oorspronkelijke aanvraag tot het verlenen of verlengen zouden hebben geleid, indien sedert de
      verlening, de verlenging of de wijziging een periode van twaalf jaren is verstreken.

      5 In afwijking van [artikel 3.92, vierde lid][ref9], zijn de middelen van bestaan van de vreemdeling als bedoeld in
      het eerste lid duurzaam indien zij nog gedurende ten minste één jaar beschikbaar zijn.

      6 Bij de berekening van de in het eerste lid bedoelde periode van tien aaneengesloten jaren van
      verblijf worden ten aanzien van de vreemdeling als bedoeld in het eerste lid onderdeel b, onder 2°,
      alsmede zijn afhankelijke gezinslid, bedoeld in onderdeel c, mede in aanmerking genomen perioden
      waarin die vreemdeling respectievelijk dat afhankelijke gezinslid rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met e, of l, van de Wet][ref10] heeft gehad.


