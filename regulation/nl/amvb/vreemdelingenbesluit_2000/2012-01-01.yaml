  - number: '3.34'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden verleend onder
      een beperking verband houdend met het verrichten van arbeid in loondienst aan boord van een Nederlands schip of op
      een mijnbouwinstallatie op het continentaal plat, aan de vreemdeling die:

      a. een arbeidsverleden aan boord van een Nederlands zeeschip of op een mijnbouwinstallatie op het continentaal plat
      heeft van ten minste zeven jaar;

      b. tijdens het arbeidsverleden, voorzover opgebouwd aan boord van een Nederlands zeeschip, frequent Nederlandse
      havens heeft aangedaan, en

      c. gedurende ten minste nog een jaar beschikt over een arbeidsplaats aan boord van een Nederlands schip of op een
      mijnbouwinstallatie op het continentaal plat, waarmee hij duurzaam voldoende middelen van bestaan verwerft.

      2 Het arbeidsverleden, bedoeld in het eerste lid, onder a, is niet onderbroken ingeval van:

      a. tussentijdse, in Nederland doorgebrachte perioden van onvrijwillige werkloosheid van elk ten hoogste zes
      maanden, of

      b. tussentijdse perioden van tewerkstelling buiten de desbetreffende sector van de internationale arbeidsmarkt van,
      tezamen genomen, ten hoogste twaalf maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '3.35'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden verleend aan
      de vreemdeling:

      a. met een arbeidsverleden aan boord van een Nederlands zeeschip of op een mijnbouwinstallatie op het continentaal
      plat;

      b. die uit hoofde van zijn dienstbetrekking ingevolge een door Nederland gesloten sociaal zekerheidsverdrag
      verzekerd is of is geweest voor de Nederlandse sociale verzekeringen, en

      c. die als uitvloeisel daarvan recht heeft op een uitkering krachtens de[ Werkloosheidswet][ref2], die niet in het
      land van herkomst geldend kan worden gemaakt.

      2 De verblijfsvergunning kan worden verleend onder een beperking, verband houdend met het zoeken en verrichten
      van arbeid al dan niet in loondienst in Nederland, indien het arbeidsverleden ten minste zeven jaar bedraagt. Het
      arbeidsverleden is niet onderbroken ingeval van:

      a. tussentijdse, in Nederland doorgebrachte perioden van onvrijwillige werkloosheid van elk ten hoogste zes
      maanden, en

      b. tussentijdse perioden van tewerkstelling buiten de desbetreffende sector van de internationale arbeidsmarkt van,
      tezamen genomen, ten hoogste twaalf maanden.

      3 De verblijfsvergunning kan worden verleend onder een beperking verband houdend met het zoeken van arbeid in
      loondienst aan boord van een Nederlands zeeschip of op een mijnbouwinstallatie op het continentaal plat, indien het
      arbeidsverleden korter is dan zeven jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0004045
  - number: '3.36'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met het zoeken en verrichten van arbeid al dan niet in loondienst in Nederland worden verleend
      aan de vreemdeling met een arbeidsverleden van ten minste zeven jaar aan boord van een Nederlands zeeschip of
      op een mijnbouwinstallatie op het continentaal plat, die in Nederland arbeid binnen de werkingssfeer van de
      [Wet arbeid vreemdelingen][ref2] wil verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.36
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0007149
  - number: '3.37'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden verleend onder
      een beperking verband houdend met het doorbrengen van verlof in Nederland aan de vreemdeling, die:

      a. een arbeidsverleden aan boord van een Nederlands zeeschip heeft van ten minste zeven jaar, waarin de totale duur
      van de onderbrekingen niet langer is dan achttien maanden;

      b. tijdens dat arbeidsverleden zijn verlofperioden nagenoeg geheel in Nederland heeft doorgebracht, en

      c. gedurende ten minste nog een jaar beschikt over een arbeidsplaats aan boord van een Nederlands schip, waarmee
      hij duurzaam voldoende middelen van bestaan verwerft.

      2 De verblijfsvergunning, bedoeld in het eerste lid, kan eveneens worden verleend aan de vreemdeling, die gedurende
      nog ten minste een jaar beschikt over een arbeidsplaats op een mijnbouwinstallatie op het continentaal plat,
      waarmee hij duurzaam voldoende middelen van bestaan verwerft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.37
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '3.38'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan voor de duur van
      de uitkering krachtens de [Ziektewet][ref2] worden verleend onder een beperking verband houdend met het
      afwachten van herstel en hervatting van de arbeid in loondienst aan boord van een Nederlands zeeschip of op een
      mijnbouwinstallatie op het continentaal plat aan de vreemdeling die:

      a. een arbeidsverleden aan boord van een Nederlands zeeschip of op een mijnbouwinstallatie op het continentaal
      plat heeft;

      b. uit hoofde van zijn dienstbetrekking ingevolge een door Nederland gesloten sociaal-zekerheidsverdrag verzekerd
      is of is geweest voor de Nederlandse sociale verzekeringen, en

      c. als uitvloeisel daarvan recht heeft op een uitkering krachtens de [Ziektewet][ref3], die niet in het land van
      herkomst geldend kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0001888
  - number: '3.39'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met verblijf als stagiaire of als practicant worden verleend aan de vreemdeling die als stagiaire
      onderscheidenlijk als practicant arbeid in loondienst wil verrichten, indien ten behoeve van die arbeid een
      tewerkstellingvergunning als bedoeld in de [Wet arbeid vreemdelingen][ref2] is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.39
