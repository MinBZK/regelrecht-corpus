  - number: '3.6'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan slechts ambtshalve
      worden verleend onder een beperking verband houdend met:

      a. verblijf als vreemdeling die buiten zijn schuld niet uit Nederland kan vertrekken;

      b. verblijf als alleenstaande minderjarige vreemdeling;

      c. de vervolging van mensenhandel.

      2 Bij ministeriële regeling kunnen andere beperkingen dan genoemd in het eerste lid worden aangewezen waaronder de
      verblijfsvergunning ambtshalve kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.6
