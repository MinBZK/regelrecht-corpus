  - number: 3.23a
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 3.13, eerste lid][ref1], wordt
      verleend onder een beperking verband houdend met gezinshereniging, aan de echtgenoot, de geregistreerde
      partner dan wel de ongehuwde partner van de langdurig ingezetene met rechtmatig verblijf in de zin van
      [artikel 8, onder a, b dan wel l, van de Wet][ref2], en het minderjarige kind van die echtgenoot, partner of
      langdurig ingezetene, indien dat kind, die echtgenoot of partner:

      a. in een andere staat die partij is bij het Verdrag tot oprichting van de Europese Gemeenschap is toegelaten als
      gezinslid van de langdurig ingezetene;

      b. beschikt over een geldig document voor grensoverschrijding;

      c. al dan niet tezamen met de langdurig ingezetene duurzaam en zelfstandig beschikt over voldoende middelen van
      bestaan als bedoeld in [artikel 3.74, eerste lid, onder a][ref3];

      d. geen gevaar vormt voor de openbare orde als bedoeld in de [artikelen 3.77][ref4] en [3.78][ref5]; en

      e. geen gevaar vormt voor de nationale veiligheid.

      2 De verblijfsvergunning, bedoeld in het eerste lid, kan worden verleend onder een beperking verband houdend met
      gezinshereniging, aan het ongehuwde meerderjarige kind van de langdurig ingezetene, de echtgenoot of partner,
      bedoeld in het eerste lid, indien de achterlating van dat kind naar het oordeel van Onze Minister een onevenredige
      hardheid zou betekenen. De onderdelen a tot en met e van het eerste lid zijn van overeenkomstige toepassing.

      3 In afwijking van het eerste en tweede lid wordt de verblijfsvergunning niet verleend aan de ongehuwde partner of
      het kind van die partner, indien de relatie van die partner met de langdurig ingezetene niet duurzaam is of niet
      naar behoren is geattesteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.13
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
