    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met het afwachten van het onderzoek naar de geschiktheid van de aspirant-adoptiefouders als bedoeld
      in [artikel 11 van de Wet opneming buitenlandse kinderen ter adoptie][ref2], worden verleend aan de minderjarige
      vreemdeling die door de aspirant-adoptiefouders in een periode waarin zij hun gewone verblijfplaats in het
      buitenland hadden, is opgenomen en door hen aldaar is verzorgd en opgevoed, tezamen met de aspirant-adoptiefouders
      Nederland is ingereisd, indien:

      a. de aspirant-adoptiefouders Nederlanders zijn of vreemdelingen met rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref3], en

      b. de ouders van de vreemdeling, of indien deze zijn overleden of een onbekende verblijfplaats hebben de
      autoriteiten van het land van verblijf voor de komst naar Nederland, hebben ingestemd met het vertrek van de
      vreemdeling naar het land van verblijf vóór de komst van het gezin naar Nederland en met de opneming van de
      vreemdeling ter adoptie.

      2 De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder b of c, van de Wet][ref4].

      3 Dit artikel is niet van toepassing indien de vreemdeling op het tijdstip van de inreis sinds meer dan een jaar
      bij de aspirant-adoptiefouders verblijft en door hen is verzorgd en opgevoed of indien het kind is geadopteerd
      in overeenstemming met het op 29 mei 1993 te 's-Gravenhage tot stand gekomen verdrag inzake de bescherming van
      kinderen en de samenwerking op het gebied van de interlandelijke adoptie (Trb. 1993, 197), welke overeenstemming
      blijkt uit een schriftelijke verklaring van de centrale autoriteit van de staat waar de adoptie heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
