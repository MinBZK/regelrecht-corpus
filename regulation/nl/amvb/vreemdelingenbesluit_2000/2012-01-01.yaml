  - number: '8.13'
    text: |-
      1 De vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die niet de nationaliteit bezit
      van een staat als bedoeld in het [eerste lid van dat artikel][ref2], heeft langer dan drie maanden na inreis
      rechtmatig verblijf in Nederland, voor zover hij in Nederland verblijft bij een vreemdeling als bedoeld in
      [artikel 8.12, eerste lid, onder a, b of c][ref3].

      2 De vreemdeling, bedoeld in het eerste lid, meldt zich uiterlijk binnen een maand na afloop van de in
      [artikel 8.11, tweede lid][ref4], bedoelde periode aan bij Onze Minister, in geval hij beoogt langer dan drie
      maanden in Nederland te verblijven, en dient daarbij een aanvraag in tot afgifte van een verblijfsdocument.

      3 Bij de indiening van de aanvraag legt de vreemdeling over:

      a. een geldig paspoort;

      b. de verklaring van inschrijving van de vreemdeling, bedoeld in [artikel 8.7, eerste lid][ref5], bij wie hij in
      Nederland verblijft;

      c. een document waaruit de familierechtelijke relatie of duurzame relatie blijkt met de vreemdeling, bedoeld onder
      b; en

      d. voor zover hij in Nederland verblijft als familielid als bedoeld in
      [artikel 8.7, tweede lid, onder c of d][ref6]: bewijs dat hij een dergelijk familielid is;

      e. voor zover hij in Nederland verblijft als familielid als bedoeld in [artikel 8.7, derde lid][ref7]: een door
      de bevoegde instantie van het land van herkomst afgegeven verklaring dat hij ten laste komt van of inwoont bij de
      vreemdeling, bedoeld onder b, onderscheidenlijk bewijs van ernstige gezondheidsredenen die de persoonlijke zorg
      door die vreemdeling noodzakelijk maken;

      f. voor zover hij in Nederland verblijft als partner als bedoeld in [artikel 8.7, vierde lid][ref8]: een bij
      regeling van Onze Minister vast te stellen relatieverklaring;

      g. voor zover hij in Nederland verblijft als rechtstreekse bloedverwant in de neergaande lijn, jonger dan 18 jaar,
      van een partner als bedoeld onder f: bewijs dat is voldaan aan de [artikelen 3.13 tot en met 3.22][ref9].

      4 Onze Minister verstrekt onmiddellijk na de ontvangst van de aanvraag een verklaring dat de aanvraag is ingediend.

      5 Onze Minister verstrekt de verblijfsgerechtigde vreemdeling binnen zes maanden na de ontvangst
      van de aanvraag een verblijfsdocument waarvan het model wordt vastgesteld bij ministeriële regeling.
      [Artikel 25, tweede en derde lid, van de Wet][ref10] is niet van toepassing.

      6 Het verblijfsdocument wordt afgegeven met een geldigheidsduur:

      a. die gelijk is aan de duur van het voorgenomen verblijf van de vreemdeling, bedoeld in
      [artikel 8.7, eerste lid][ref11], bij wie de vreemdeling in Nederland verblijft, indien die duur korter is dan
      vijf jaar;

      b. van vijf jaar in de overige gevallen.

      7 De in het tweede en derde lid omschreven verplichtingen rusten ten aanzien van kinderen beneden de leeftijd van
      twaalf jaar op de wettelijk vertegenwoordiger. Voor kinderen van twaalf jaar en ouder kan aan deze verplichtingen
      ook worden voldaan door de wettelijk vertegenwoordiger.


