  - number: '4.20'
    text: |-
      Indien de bevelhebber van de Koninklijke marechaussee of de korpschef zijn bevoegdheid, bedoeld in
      [artikel 50, vierde lid, van de Wet][ref1] mandateert doet hij dat niet dan aan een ambtenaar, belast met het
      toezicht op vreemdelingen, die tevens hulpofficier van justitie is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
