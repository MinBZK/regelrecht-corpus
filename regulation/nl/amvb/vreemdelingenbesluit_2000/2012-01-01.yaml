  - number: '3.106'
    text: |-
      De indicatoren die in ieder geval zullen worden betrokken in de beoordeling of er sprake is van een situatie als
      bedoeld in [artikel 29, eerste lid, onder d, van de Wet][ref1] zijn:

      a. de aard van het geweld in het land van herkomst, met name de ernst van de schendingen van de mensenrechten en
      het oorlogsrecht, de mate van willekeur, de mate waarin het geweld voorkomt en de mate van geografische spreiding
      van het geweld;

      b. de activiteiten van internationale organisaties ten aanzien van het land van herkomst indien en voorzover deze
      een graadmeter vormen voor de positie van de internationale gemeenschap ten aanzien van de situatie in het land van
      herkomst, en

      c. het beleid in andere landen van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.106
