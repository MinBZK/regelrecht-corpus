  - number: '2.11'
    text: |-
      1 De toegang wordt geweigerd op grond van [artikel 3, eerste lid, onder c en d, van de Wet][ref1], indien de
      vreemdeling niet voldoet aan de door de ambtenaar belast met grensbewaking gestelde voorwaarde om zekerheid te
      stellen voor de kosten van verblijf in Nederland en voor de kosten van zijn reis naar een plaats buiten Nederland
      waar zijn toegang gewaarborgd is.

      2 De zekerheid, bedoeld in het eerste lid, kan bestaan uit:

      a. het deponeren van een retour-passagebiljet;

      b. het deponeren van een garantiesom, of

      c. een verklaring van een solvabele derde die zich voor de kosten garant stelt.

      3 Het model van de garantverklaring wordt bij ministeriële regeling vastgesteld.

      4 Het eerste lid is niet van toepassing op de vreemdeling die rechtmatig verblijf heeft als
      bedoeld in [artikel 8, onder e, dan wel l, van de Wet][ref2], het familielid, bedoeld in
      [artikel 8.7, tweede en derde lid][ref3], en de vreemdeling, bedoeld in [artikel 8.7, vierde lid][ref4].

      5 De in het eerste lid bedoeld voorwaarde om zekerheid te stellen voor de kosten van verblijf in Nederland en
      voor de kosten van zijn reis naar een plaats buiten Nederland waar zijn toegang is gewaarborgd, kan, op grond van
      artikel 5, derde lid, van de Schengengrenscode, ook worden gesteld ten aanzien van een onderdaan van een derde land
      die toegang vraagt voor een verblijf van ten hoogste drie maanden per periode van zes maanden.


