  - number: 6.5c
    text: |-
      In zeer uitzonderlijke en dringende gevallen kan Onze Minister het inreisverbod tijdelijk opheffen. Aan de
      tijdelijke opheffing worden voorwaarden gesteld omtrent de plaats van binnenkomst en de duur van het verblijf in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel6.5c
  - number: '6.6'
    text: |-
      1 De aanvraag om opheffing van de ongewenstverklaring, bedoeld in [artikel 68, eerste lid, van de Wet][ref1],
      wordt ingewilligd, indien de vreemdeling niet aan strafvervolging terzake van enig misdrijf is onderworpen, en
      deze vreemdeling:

      a. indien hij ongewenst is verklaard wegens een geweldsdelict, een opiumdelict of een misdrijf waartegen een
      gevangenisstraf van meer dan zes jaren is bedreigd, na de ongewenstverklaring ten minste tien achtereenvolgende
      jaren buiten Nederland heeft verbleven;

      b. indien hij ongewenst is verklaard wegens andere misdrijven dan bedoeld in onderdeel a, na de ongewenstverklaring
      tenminste vijf achtereenvolgende jaren buiten Nederland heeft verbleven;

      c. indien hij ongewenst is verklaard op grond van [artikel 67, eerste lid, onder a, van de Wet][ref2], na de
      ongewenstverklaring tenminste één jaar buiten Nederland heeft verbleven.

      2 In afwijking van het eerste lid, aanhef en onder b, wordt de aanvraag ingewilligd nadat de daar bedoelde
      vreemdeling tenminste tien achtereenvolgende jaren buiten Nederland heeft verbleven, indien zwaarwegende belangen
      zich naar het oordeel van Onze Minister verzetten tegen opheffing van de ongewenstverklaring na vijf jaren.

      3 De in het eerste lid genoemde termijnen vangen opnieuw aan, indien de vreemdeling tijdens de ongewenstverklaring:

      a. een als misdrijf strafbaar gestelde inbreuk op de openbare orde heeft gepleegd die tot ongewenstverklaring zou
      kunnen leiden, of

      b. zonder voorafgaande tijdelijke opheffing of in strijd met de aan die tijdelijke opheffing verbonden voorwaarden
      in Nederland heeft verbleven.

      4 De gegevens, bedoeld in [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref3], die de vreemdeling
      verstrekt zijn in ieder geval:

      a. een schriftelijke verklaring van de vreemdeling dat hij sinds zijn vertrek uit Nederland na de
      ongewenstverklaring tien, onderscheidenlijk vijf achtereenvolgende jaren of één jaar buiten Nederland heeft
      verbleven en dat hij zich in die periode niet schuldig heeft gemaakt aan misdrijven en dat hij niet aan
      strafvervolging onderworpen is;

      b. een kopie van de documenten voor grensoverschrijding die de vreemdeling sinds zijn ongewenstverklaring heeft
      gehouden;

      c. een overzicht van de plaatsen waar de vreemdeling sinds zijn ongewenstverklaring heeft verbleven, voorzien van
      bewijsstukken, en

      d. een schriftelijke verklaring, afgegeven door de terzake bevoegde autoriteiten van het land of de landen waar
      de vreemdeling sinds zijn ongewenstverklaring heeft verbleven, dat de vreemdeling zich tijdens dat verblijf niet
      schuldig heeft gemaakt aan misdrijven en niet aan strafvervolging onderworpen is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel42
