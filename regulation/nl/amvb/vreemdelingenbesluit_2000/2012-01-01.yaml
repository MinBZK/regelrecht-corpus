  - number: '8.12'
    text: |-
      1 De vreemdeling, bedoeld in [artikel 8.7, eerste lid][ref1], heeft langer dan drie maanden na inreis rechtmatig
      verblijf in Nederland, indien hij:

      a. in Nederland werknemer of zelfstandige is dan wel Nederland is ingereisd om werk te zoeken en kan bewijzen dat
      hij werk zoekt en een reële kans op werk heeft;

      b. voor zichzelf en zijn familieleden beschikt over voldoende middelen van bestaan en over een verzekering die de
      ziektekosten in Nederland volledig dekt;

      c. is ingeschreven voor een opleiding die is opgenomen in het Centraal register opleidingen hoger onderwijs,
      bedoeld in [artikel 6.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], of in het
      Centraal register beroepsopleidingen, bedoeld in [artikel 6.4.1 van de Wet educatie en beroepsonderwijs][ref3],
      om als hoofdbezigheid een studie of beroepsopleiding te volgen, beschikt over een verzekering die de ziektekosten
      in Nederland volledig dekt, en hij met een verklaring of een gelijkwaardig middel naar zijn keuze de zekerheid
      verschaft dat hij beschikt over voldoende middelen van bestaan voor zichzelf en zijn familieleden;

      d. een familielid als bedoeld in [artikel 8.7, tweede lid][ref4], is van een vreemdeling als bedoeld onder a of b;

      e. de echtgenoot, de geregistreerde partner of een kind is dat ten laste is van een vreemdeling als bedoeld onder
      c;

      f. familielid is als bedoeld in [artikel 8.7, derde lid][ref5], en hij in het land van herkomst ten laste is van of
      inwoont bij een vreemdeling als bedoeld in het eerste lid, onder a, b of c;

      g. familielid is als bedoeld in [artikel 8.7, derde lid][ref6], en hij vanwege ernstige gezondheidsredenen een
      persoonlijke verzorging door een vreemdeling als bedoeld in het eerste lid, onder a, b of c, strikt behoeft; of

      h. partner is als bedoeld in [artikel 8.7, vierde lid][ref7], en hij een deugdelijk bewezen duurzame relatie
      heeft met een vreemdeling als bedoeld in het eerste lid, onder a, b of c, dan wel rechtstreekse bloedverwant in de
      neergaande lijn, jonger dan 18 jaar, is van een zodanige partner.

      2 Het rechtmatig verblijf van de vreemdeling, bedoeld in het eerste lid, onder a, eindigt niet om de enkele reden
      dat die vreemdeling niet langer werknemer of zelfstandige is:

      a. in geval van tijdelijke arbeidsongeschiktheid als gevolg van ziekte of ongeval;

      b. indien hij na werkzaamheden als werknemer of zelfstandige van ten minste een jaar onvrijwillig werkloos is en
      als werkzoekende bij het Uitvoeringsinstituut werknemersverzekeringen is ingeschreven;

      c. gedurende een periode van ten minste zes maanden, nadat hij onvrijwillige werkloos is geworden door de afloop
      van een arbeidsovereenkomst korter dan een jaar, dan wel nadat hij gedurende de eerste twaalf maanden onvrijwillig
      werkloos geworden is, indien hij als werkzoekende bij het Uitvoeringsinstituut werknemersverzekeringen is
      ingeschreven;

      d. indien hij een beroepsopleiding gaat volgen, die, behoudens ingeval van onvrijwillige werkloosheid, verband
      houdt met de voorafgaande beroepsactiviteit.

      3 Voor de toepassing van het eerste lid, onder b, beschikt de vreemdeling met een inkomen ter hoogte van het
      normbedrag dat in [artikel 3.74][ref8] voor de desbetreffende categorie is vastgesteld, in ieder geval over
      voldoende middelen van bestaan.

      4 De vreemdeling, bedoeld in het eerste lid, meldt zich uiterlijk binnen een maand na afloop van de
      in [artikel 8.11, eerste lid][ref9], bedoelde periode aan bij Onze Minister ter inschrijving in de
      vreemdelingenadministratie in geval hij beoogt langer dan drie maanden in Nederland te verblijven.

      5 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de gegevens en bescheiden die de vreemdeling
      bij de in het vorige lid bedoelde melding moet verstrekken of overleggen.

      6 Onze Minister verstrekt na de in het vierde lid bedoelde inschrijving onmiddellijk een verklaring van
      inschrijving, waarin naam en adres van de ingeschreven vreemdeling en de datum van inschrijving worden vermeld.

      7 De in het vierde en vijfde lid omschreven verplichtingen rusten ten aanzien van kinderen beneden de leeftijd van
      twaalf jaar op de wettelijk vertegenwoordiger. Voor kinderen van twaalf jaar en ouder kan aan deze verplichtingen
      ook worden voldaan door de wettelijk vertegenwoordiger.


