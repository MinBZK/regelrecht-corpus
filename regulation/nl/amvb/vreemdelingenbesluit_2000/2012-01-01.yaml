  - number: '3.80'
    text: |-
      1 De aanvraag tot het wijzigen of het verlengen van de geldigheidsduur van de verblijfsvergunning, bedoeld in
      [artikel 14 van de Wet][ref1], is tijdig ingediend, indien deze is ontvangen uiterlijk op de dag voor de dag
      waarop de geldigheidsduur verstrijkt, dan wel, indien deze later is ontvangen, indien de termijnoverschrijding de
      vreemdeling niet kan worden toegerekend.

      2 De niet-tijdig ingediende aanvraag tot het wijzigen of tot het verlengen van de geldigheidsduur van de
      verblijfsvergunning, bedoeld in [artikel 14 van de Wet][ref2], wordt gelijkgesteld met een aanvraag tot het
      verlenen van de verblijfsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
