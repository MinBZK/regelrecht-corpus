  - number: 3.105f
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref1], die is verleend op
      grond van [artikel 29, eerste lid, onder b, van die wet][ref2] wordt ingetrokken dan wel de aanvraag tot
      het verlengen van de geldigheidsduur ervan wordt afgewezen, indien sprake is van de situatie, bedoeld in
      [artikel 32, eerste lid, onder a dan wel c, van de Wet][ref3].

      2 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref4], die is verleend
      op grond van [artikel 29, eerste lid, onder b, van die wet][ref5] wordt slechts ingetrokken dan
      wel de aanvraag tot het verlengen van de geldigheidsduur ervan wordt slechts afgewezen op grond van
      [artikel 32, eerste lid, onder b, van de Wet][ref6], indien er ernstige redenen zijn om aan te nemen dat:

      a. de vreemdeling een misdrijf tegen de vrede, een oorlogsmisdrijf of een misdrijf tegen de menselijkheid heeft
      gepleegd, zoals gedefinieerd in de internationale instrumenten waarmee wordt beoogd regelingen te treffen ten
      aanzien van dergelijke misdrijven;

      b. de vreemdeling een ernstig misdrijf heeft gepleegd;

      c. de vreemdeling zich schuldig heeft gemaakt aan daden die in strijd zijn met de doelstellingen en beginselen van
      de Verenigde Naties als vervat in de preambule en de artikelen 1 en 2 van het Handvest van de Verenigde Naties;

      d. de vreemdeling een gevaar vormt voor de gemeenschap of voor de nationale veiligheid; of

      e. de vreemdeling heeft aangezet tot of anderszins heeft deelgenomen aan de onder a tot en met c genoemde
      misdrijven of daden.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de beoordeling of sprake is van
      de situatie, bedoeld in het eerste lid.


