  - number: '3.85'
    text: |-
      1 De aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning voor bepaalde tijd, bedoeld
      in [artikel 14 van de Wet][ref1], wordt niet op grond van [artikel 18, eerste lid, onder d, van de Wet][ref2]
      afgewezen, indien de vreemdeling en degene bij wie hij als gezinslid verblijft gezamenlijk zelfstandig en duurzaam
      beschikken over voldoende middelen van bestaan als bedoeld in [artikel 3.74, eerste lid, onder a][ref3].

      2 De aanvraag wordt evenmin op grond van [artikel 18, eerste lid, onder d, van de Wet][ref4] afgewezen, indien de
      persoon bij wie de vreemdeling als gezinslid verblijft 65 jaar of ouder is of naar het oordeel van Onze Minister
      blijvend en volledig arbeidsongeschikt is.


