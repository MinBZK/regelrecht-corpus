  - number: '3.53'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met wedertoelating worden verleend aan de oud-Nederlander die in Nederland is geboren en getogen.

      2 De verblijfsvergunning, bedoeld in het eerste lid, kan eveneens worden verleend:

      a. aan de meerderjarige oud-Nederlander die buiten Nederland is geboren, indien deze in een ander land woont dan
      dat waarvan hij onderdaan is en naar het oordeel van Onze Minister bijzondere banden heeft met Nederland, of

      b. aan andere oud-Nederlanders.

      3 De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder b en c, van de Wet][ref2], indien de
      aanvraag is ingediend door de in het eerste lid bedoelde vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
