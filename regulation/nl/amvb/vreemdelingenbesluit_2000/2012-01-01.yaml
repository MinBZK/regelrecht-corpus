  - number: '6.2'
    text: |-
      Onze Minister is bevoegd de kosten van uitzetting, bedoeld in de [artikelen 65, tweede lid][ref1], en
      [66 van de Wet][ref2] te verhalen op de vreemdeling of op een vervoersonderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel66
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '66'
  - number: '6.3'
    text: |-
      1 De kosten van uitzetting van een vreemdeling welke ingevolge [artikel 65, tweede lid, van de Wet][ref1] op een
      vervoersonderneming kunnen worden verhaald, zijn verschuldigd aan het openbaar lichaam te welks laste die kosten
      zijn gekomen.

      2 De in het voorgaande lid bedoelde kosten van uitzetting omvatten in ieder geval de kosten verbonden aan:

      a. het vervoer van de uit te zetten vreemdeling per eerste gelegenheid, doch op de wijze die, gelet op de
      omstandigheden, de goedkoopste is, naar een plaats buiten Nederland;

      b. de begeleiding van de vreemdeling naar een plaats van vertrek uit Nederland alsmede zijn begeleiding naar een
      plaats buiten Nederland, voorzover deze noodzakelijk is, en

      c. het verblijf van de vreemdeling in Nederland in de periode nadat de vervoersonderneming van een ambtenaar
      belast met de grensbewaking de aanwijzing heeft gekregen de vreemdeling terug te vervoeren naar een plaats buiten
      Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel65
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '65'
  - number: '6.4'
    text: |-
      1 De noodzakelijke kosten van uitzetting die ten laste komen van de Staat of van andere openbare lichamen
      kunnen door de Staat, of door het andere openbare lichaam te welks laste zij zijn gekomen, worden verhaald op de
      vreemdeling en, indien hij minderjarig is, op degenen die het wettig gezag over hem uitoefenen.

      2 De in het voorgaande lid bedoelde kosten van uitzetting omvatten de kosten, genoemd in
      [artikel 6.3, tweede lid, onder a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel6.3
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel6.4
