  - number: '2.9'
    text: |-
      1 Toegang tot Nederland wordt in ieder geval geweigerd op grond van het feit dat de vreemdeling een gevaar oplevert
      voor de openbare orde of de nationale veiligheid, bedoeld in [artikel 3, eerste lid, onder b, van de Wet][ref1],
      indien:

      a. er ten aanzien van de vreemdeling concrete aanwijzingen zijn dat deze een inbreuk op de openbare orde of
      nationale veiligheid heeft gepleegd of zal plegen, of

      b. de vreemdeling in het opsporingsregister of het Schengen Informatiesysteem ter fine van weigering staat
      gesignaleerd.

      2 Het eerste lid blijft buiten toepassing, indien Onze Minister op grond van humanitaire overwegingen, om redenen
      van nationaal belang of wegens internationale verplichtingen een afwijking noodzakelijk acht.

      3 Het eerste lid is niet van toepassing op de vreemdeling die rechtmatig verblijf heeft als
      bedoeld in [artikel 8, onder e, dan wel l, van de Wet][ref2], en het familielid, bedoeld in
      [artikel 8.7, tweede en derde lid][ref3], en de vreemdeling, bedoeld in [artikel 8.7, vierde lid][ref4]. Op deze
      vreemdelingen is [artikel 8.8][ref5] van toepassing.


