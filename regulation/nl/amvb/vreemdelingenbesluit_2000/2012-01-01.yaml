  - number: '3.15'
    text: |-
      1 De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend aan het in
      [artikel 3.14][ref2] bedoelde gezinslid van:

      a. een Nederlander van 21 jaar of ouder, of

      b. een vreemdeling van 21 jaar of ouder met rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref3], dat niet-tijdelijk is in de zin van
      [artikel 3.5][ref4].

      2 Indien de vreemdeling als gezinslid in Nederland wil verblijven bij een hoofdpersoon die houder is van de
      verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref5], onder een beperking verband
      houdend met het doorbrengen van verlof in Nederland en die hoofdpersoon werkzaam is op een mijnbouwinstallatie op
      het continentaal plat, wordt de verblijfsvergunning eerst verleend, nadat deze hoofdpersoon een arbeidsverleden op
      een mijnbouwinstallatie op het continentaal plat heeft van ten minste zeven jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.13
