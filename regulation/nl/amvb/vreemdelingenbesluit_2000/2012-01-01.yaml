  - number: '3.46'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met het ondergaan van medische behandeling worden verleend, indien Nederland naar het oordeel van
      Onze Minister het meest aangewezen land is voor het ondergaan van een noodzakelijke medische behandeling en de
      financiering van die medische behandeling naar het oordeel van Onze Minister deugdelijk is geregeld.

      2 Bij de aanvraag ondertekent de vreemdeling een medische verklaring, ertoe strekkende dat hij toestemming verleent
      voor medisch onderzoek, voor zover dat onderzoek noodzakelijk is voor de toepassing van het eerste lid.

      3 De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder a of c, van de Wet][ref2] of
      op de grond dat de financiering van de medische behandeling niet deugdelijk is geregeld, indien ten minste
      een jaar direct voorafgaande aan de aanvraag tegen de uitzetting beletselen hebben bestaan als bedoeld in
      [artikel 64 van de Wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel64
