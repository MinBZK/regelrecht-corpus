  - number: '3.75'
    text: |-
      1 De in [artikel 16, eerste lid, onder c, van de Wet][ref1] bedoelde middelen van bestaan zijn in ieder geval
      duurzaam, indien zij nog één jaar beschikbaar zijn op het tijdstip waarop de aanvraag is ontvangen of de
      beschikking wordt gegeven.

      2 Middelen van bestaan verkregen uit eigen vermogen zijn duurzaam, indien zij gedurende een aaneengesloten periode
      van een jaar beschikbaar zijn geweest en nog beschikbaar zijn op het tijdstip waarop de aanvraag is ontvangen of de
      beschikking wordt gegeven.

      3 In afwijking van het eerste lid, zijn middelen van bestaan verkregen uit arbeid in loondienst eveneens duurzaam,
      indien op het tijdstip waarop de aanvraag is ontvangen of de beschikking wordt gegeven gedurende een aaneengesloten
      periode van drie jaren jaarlijks voldoende middelen van bestaan uit arbeid in loondienst zijn verworven en
      de middelen van bestaan nog beschikbaar zijn. Indien tijdens de periode van drie jaren gedurende een periode
      van in totaal niet langer dan zesentwintig weken een werkloosheidsuitkering is ontvangen, wordt die uitkering
      gelijkgesteld met inkomen uit arbeid in loondienst.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten aanzien van de duurzaamheid van middelen
      van bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
