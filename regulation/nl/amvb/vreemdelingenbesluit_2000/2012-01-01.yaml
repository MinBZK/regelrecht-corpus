  - number: '6.1'
    text: |-
      1 Een risico als bedoeld in [artikel 62, tweede lid, onder a, van de Wet][ref1] kan worden aangenomen indien feiten
      of omstandigheden als bedoeld in [artikel 5.1b, eerste lid][ref2], op de vreemdeling van toepassing zijn.

      2 [Artikel 5.1b, tweede lid][ref3], is van overeenkomstige toepassing.


