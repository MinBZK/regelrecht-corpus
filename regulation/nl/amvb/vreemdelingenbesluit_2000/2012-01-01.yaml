      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], wordt onder een
      beperking verband houdend met gezinshereniging of gezinsvorming, verleend aan het in [artikel 3.14][ref2]
      genoemde gezinslid van de in [artikel 3.15][ref3] bedoelde hoofdpersoon, indien wordt voldaan aan alle in de
      [artikelen 3.16 tot en met 3.22][ref4] genoemde voorwaarden.

      2 In de overige gevallen kan de in het eerste lid bedoelde verblijfsvergunning worden verleend.


