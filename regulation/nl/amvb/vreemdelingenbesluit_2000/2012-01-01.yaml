  - number: '3.1'
    text: |-
      1 Het indienen van een aanvraag tot het verlenen, wijzigen of verlengen van een verblijfsvergunning heeft tot
      gevolg dat de uitzetting achterwege blijft, tenzij de aanvraag naar het voorlopig oordeel van Onze Minister een
      herhaalde aanvraag betreft.

      2 Uitzetting blijft niet achterwege, indien de aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde
      tijd, bedoeld in de [artikelen 14][ref1] en [28 van de Wet][ref2], naar het voorlopig oordeel van Onze Minister,
      op grond van de Wet kan worden afgewezen op de grond dat de vreemdeling een gevaar vormt voor de openbare orde of
      nationale veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
