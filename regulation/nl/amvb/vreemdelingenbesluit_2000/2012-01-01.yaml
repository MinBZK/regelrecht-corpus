  - number: '4.23'
    text: |-
      1 De ambtenaren belast met de grensbewaking of de ambtenaren belast met het toezicht op vreemdelingen, nemen op
      grond van [artikel 52, eerste lid, van de Wet][ref1] het reis- of identiteitspapier van een persoon tijdelijk in
      bewaring:

      a. voorzover zulks nodig is voor het verkrijgen van de gegevens, bedoeld in [artikel 4.45][ref2], of voor het
      stellen van een aantekening als bedoeld in [artikel 4.24 tot en met artikel 4.35][ref3];

      b. indien de persoon ter vaststelling van zijn identiteit is staande gehouden en niet aanstonds blijkt dat
      het hem is toegestaan in Nederland te verblijven, terwijl de gelegenheid ontbreekt hem, met toepassing van
      [artikel 50, tweede of derde lid, van de Wet][ref4] naar een plaats, bestemd voor verhoor, over te brengen;

      c. gedurende de tijd dat de persoon rechtens zijn vrijheid is ontnomen, of

      d. voorzover zulks nodig is met het oog op de uitzetting of de overgave aan de buitenlandse grensautoriteiten als
      bedoeld in [artikel 52, tweede lid, van de Wet][ref5].

      2 In het geval, bedoeld in het eerste lid, onder b, wordt het reis- of identiteitspapier aan de persoon
      teruggegeven, indien hij aan de korpschef of de bevelhebber van de Koninklijke marechaussee de gegevens heeft
      verstrekt die deze in het belang van de toepassing van de Wet vraagt, tenzij er uit anderen hoofde gronden aanwezig
      zijn om het document in bewaring te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4.45
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel4.24
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel50
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel52
