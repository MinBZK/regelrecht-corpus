  - number: '3.44'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden verleend onder
      een beperking verband houdend met verblijf in het kader van uitwisseling aan de vreemdeling:

      a. die vijftien jaar of ouder, maar jonger dan zesentwintig jaar is;

      b. die ongehuwd is en niet de zorg heeft voor kinderen;

      c. die op grond van een door Onze Minister goedgekeurd uitwisselingsprogramma tijdelijk in Nederland wil verblijven
      in een gastgezin, bestaande uit twee of meer personen voor wie de vreemdeling niet eerder werkzaamheden heeft
      verricht;

      d. die niet eerder rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2], heeft gehad, en

      e. wiens vertrek uit Nederland naar het oordeel van Onze Minister redelijkerwijs is gewaarborgd.

      2 Bij de aanvraag wordt door de uitwisselingsorganisatie een garantverklaring ondertekend. Het model van de
      verklaring wordt bij ministeriële regeling vastgesteld.

      3 Overeenkomstig bij regeling van Onze Minister te stellen regels kan de verblijfsvergunning in afwijking van
      het eerste lid, onder a, b en c, worden verleend ter uitvoering van het Europese uitwisselingsprogramma «Youth
      in action».


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.44
