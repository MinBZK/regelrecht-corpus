  - number: 6.5b
    text: |-
      1 Onze Minister kan op aanvraag het inreisverbod dat is uitgevaardigd met toepassing van
      [artikel 66a, tweede lid, van de Wet][ref1], opheffen indien de vreemdeling aantoont Nederland geheel in
      overeenstemming met de op hem rustende verplichting, bedoeld in [artikel 61, eerste lid, van de Wet][ref2], te
      hebben verlaten.

      2 In andere gevallen dan bedoeld in het eerste lid, kan Onze Minister op aanvraag het inreisverbod opheffen, indien
      de vreemdeling aantoont dat hij sinds zijn vertrek uit Nederland na het inreisverbod een ononderbroken periode van
      ten minste de helft van de duur van het inreisverbod buiten Nederland heeft verbleven en hij zich in die periode
      niet schuldig heeft gemaakt aan misdrijven en dat hij niet aan strafvervolging onderworpen is.

      3 De gegevens, bedoeld in [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref3], die de vreemdeling
      bij de aanvraag, bedoeld in het tweede lid, verstrekt, zijn in ieder geval:

      a. een schriftelijke verklaring dat hij voldoet aan de in het tweede lid bedoelde voorwaarden voor opheffing van
      het inreisverbod;

      b. een kopie van de documenten voor grensoverschrijding die de vreemdeling sinds zijn inreisverbod heeft gehouden;

      c. een overzicht van de plaatsen waar de vreemdeling sinds zijn inreisverbod heeft verbleven, voorzien van
      bewijsstukken;

      d. een schriftelijke verklaring, afgegeven door de daartoe bevoegde autoriteiten van de staat of staten waar de
      vreemdeling sinds zijn inreisverbod heeft verbleven, dat de vreemdeling zich tijdens dat verblijf niet schuldig
      heeft gemaakt aan misdrijven en niet aan strafvervolging onderworpen is.

      4 Het derde lid, onderdeel d, is niet van toepassing op de vreemdeling ten aanzien wie van de duur van het
      inreisverbod is bepaald met toepassing van [artikel 6.5a, eerste of tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel66a
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel6.5a
