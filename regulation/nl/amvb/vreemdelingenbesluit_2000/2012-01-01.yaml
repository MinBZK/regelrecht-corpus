  - number: 3.118a
    text: |-
      1 Indien Onze Minister oordeelt dat een ander land ingevolge een verdrag of een voor dit land en Nederland bindend
      besluit van een volkenrechtelijke organisatie verantwoordelijk is voor de behandeling van een aanvraag tot het
      verlenen van de verblijfsvergunning, bedoeld in [artikel 28 van de Wet][ref1], en uit dien hoofde het andere land
      om overname of terugname zal verzoeken, wordt het schriftelijk voornemen om de aanvraag af te wijzen, vooruitlopend
      op aanvaarding van het verzoek tot overname of terugname door het andere land, aan de vreemdeling uitgereikt.

      2 Indien Onze Minister het voornemen, bedoeld in het eerste lid, op de vijfde dag aan de vreemdeling uitreikt,
      brengt de vreemdeling zijn zienswijze uiterlijk op de zesde dag schriftelijk naar voren. Indien Onze Minister de
      in [artikel 3.110, eerste lid][ref2], genoemde termijn heeft verlengd en dat voornemen aan de vreemdeling uitreikt,
      brengt de vreemdeling zijn zienswijze uiterlijk op de dag na de uitreiking van het voornemen naar voren, tenzij een
      met redenen omkleed verzoek om verlenging van deze termijn wordt ingewilligd.

      3 Indien Onze Minister het voornemen, bedoeld in het eerste lid, na ommekomst van de in
      [artikel 3.110, eerste of tweede lid][ref3], genoemde termijn aan de vreemdeling uitreikt, brengt de vreemdeling
      zijn zienswijze binnen een week schriftelijk naar voren, tenzij een met redenen omkleed verzoek om verlenging
      van deze termijn wordt ingewilligd. Deze termijn vangt aan met ingang van de dag na die waarop het voornemen is
      uitgereikt.

      4 De schriftelijke zienswijze is tijdig bij Onze Minister ingediend, indien deze voor het einde van de termijn
      is ontvangen.

      5 In het geval, bedoeld in het tweede lid, worden het tijdstip van uitreiken van het voornemen en de ontvangst
      van de schriftelijke zienswijze door Onze Minister vastgelegd. In het geval, bedoeld in het derde lid, wordt de
      ontvangst van de schriftelijke zienswijze door Onze Minister bevestigd.

      6 Onze Minister houdt rekening met een na afloop van de termijn ontvangen schriftelijke zienswijze, indien de
      beschikking nog niet bekend is gemaakt. Met een na afloop van de termijn ontvangen aanvulling op een eerder
      ingediende zienswijze wordt rekening gehouden, indien de beschikking nog niet bekend is gemaakt en de afdoening
      van de zaak daardoor niet ontoelaatbaar wordt vertraagd. Het ontbreken van de schriftelijke zienswijze, na het
      verstrijken van de termijn waarbinnen de vreemdeling zijn zienswijze schriftelijk naar voren kan brengen, staat
      niet aan het verzoek om overname in de weg, en evenmin aan het nemen van de beschikking bij aanvaarding van het
      verzoek tot overname.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3.110
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3.110
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.118a
