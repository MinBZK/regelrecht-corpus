  - number: '3.42'
    text: |-
      1 Indien de studie en het verblijf middels periodieke betalingen worden bekostigd, zijn middelen van bestaan in
      afwijking van [artikel 3.75][ref1] slechts duurzaam, indien naar het oordeel van Onze Minister voldoende zekerheid
      is verschaft over het ongestoorde verloop van de periodieke geldstroom.

      2 In afwijking van [artikel 3.75][ref2] zijn middelen van bestaan duurzaam, indien deze op het tijdstip waarop de
      aanvraag is ontvangen of de beschikking wordt gegeven, voor een jaar of zoveel korter als de voorgenomen studie in
      Nederland zal duren, beschikbaar zijn.

      3 In afwijking van [artikel 3.75][ref3] zijn middelen van bestaan eveneens duurzaam, indien op een ten name van de
      vreemdeling gestelde bankrekening in Nederland een bedrag beschikbaar is, gelijk aan het maandelijkse normbedrag,
      bedoeld in het eerste lid, vermenigvuldigd met twaalf of zoveel minder als het aantal maanden dat de voorgenomen
      studie in Nederland zal duren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.75
