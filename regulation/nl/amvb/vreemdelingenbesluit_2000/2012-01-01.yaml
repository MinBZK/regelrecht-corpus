      1 Op de aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning voor bepaalde tijd als
      bedoeld in [artikel 28 van de Wet][ref1] wordt binnen zes maanden na ontvangst van de aanvraag een beschikking
      gegeven.

      2 De termijn voor het geven van de beschikking, bedoeld in het eerste lid, kan ten hoogste voor zes maanden worden
      verlengd indien naar het oordeel van Onze Minister voor de beoordeling van de aanvraag advies van of onderzoek door
      derden of het openbaar ministerie nodig is.

      3 De [artikelen 43][ref2] en [43a van de Wet][ref3] zijn van overeenkomstige toepassing.


