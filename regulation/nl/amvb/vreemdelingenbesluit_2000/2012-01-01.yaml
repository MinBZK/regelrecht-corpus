  - number: '3.78'
    text: |-
      Buiten de gevallen, bedoeld in [artikel 3.77][ref1], kan de aanvraag tot het verlenen van een
      verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref2], slechts op grond van
      [artikel 16, eerste lid, onder d, van de Wet][ref3] worden afgewezen wegens gevaar voor de openbare orde, indien
      zwaarwegende belangen naar het oordeel van Onze Minister daartoe nopen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.77
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel16
