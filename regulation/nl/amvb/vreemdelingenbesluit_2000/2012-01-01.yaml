  - number: '4.30'
    text: |-
      1 De aantekeningen, bedoeld in [artikel 4.29, eerste lid, onder a][ref1], hebben betrekking op de aanmelding
      ingevolge de [artikelen 4.47 tot en met 4.51][ref2].

      2 Uit de aantekening blijkt de datum van aanmelding.

      3 Uit de aantekening blijkt of het de vreemdeling is toegestaan arbeid te verrichten en of voor deze arbeid
      ingevolge de [Wet arbeid vreemdelingen][ref3] een tewerkstellingsvergunning vereist is.

      4 Indien het betreft een vreemdeling die naar Nederland is gekomen om als zeeman werk te zoeken aan boord van een
      zeeschip kan de aantekening worden aangevuld met een zinsnede waaruit zulks blijkt en wordt een uiterlijke datum
      van verblijf opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.29
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4.47
      [ref3]: https://wetten.overheid.nl/BWBR0007149
