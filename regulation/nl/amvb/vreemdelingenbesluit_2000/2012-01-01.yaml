        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '3.70'
    text: |-
      In afwijking van [artikel 3.57][ref1] wordt de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref2], onder een beperking verband houdend met familiebezoek, verleend voor ten hoogste zes
      maanden en wordt de geldigheidsduur ervan na zes maanden niet verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.57
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.70
