  - number: 3.98a
    text: |-
      1 Onze Minister voor Wonen, Wijken en Integratie stelt het basisexamen inburgering ter beoordeling
      van de kennis van de Nederlandse taal en van de Nederlandse maatschappij als bedoeld in
      [artikel 16, eerste lid, onder h, van de Wet][ref1], vast door middel van een geautomatiseerd systeem.

      2 Het basisexamen inburgering omvat een onderzoek naar de Nederlandse lees-, luister- en spreekvaardigheid van
      de vreemdeling.

      3 Onze Minister voor Wonen, Wijken en Integratie stelt een examenprogramma vast voor de vereiste lees-, luister- en
      spreekvaardigheid. Dit examenprogramma strekt tot waarborg dat de vreemdeling die het basisexamen inburgering met
      goed gevolg heeft afgelegd, beschikt over de volgende vaardigheden in de Nederlandse taal op het niveau A1 van het
      Europees Raamwerk voor Moderne Vreemde Talen:

      a. leesvaardigheid;

      b. luistervaardigheid, en

      c. spreekvaardigheid.

      4 De normering van de onderdelen lees-, luister- en spreekvaardigheid van het basisexamen inburgering wordt
      gerelateerd aan een van de niveaus van het Europees Raamwerk voor Moderne Vreemde Talen.

      5 Het basisexamen inburgering omvat tevens een onderzoek naar de kennis van de Nederlandse samenleving.

      6 Onze Minister voor Wonen, Wijken en Integratie stelt een examenprogramma vast voor de vereiste kennis van de
      Nederlandse samenleving. Dit examenprogramma waarborgt dat de vreemdeling die het basisexamen inburgering met goed
      gevolg heeft afgelegd, beschikt over elementaire praktische kennis van:

      a. Nederland, waaronder topografie, geschiedenis en staatsinrichting;

      b. huisvesting, onderwijs, arbeid, gezondheidszorg en inburgering in Nederland;

      c. zijn rechten en zijn verplichtingen na aankomst in Nederland;

      d. rechten en verplichtingen van anderen in Nederland, en

      e. in Nederland gangbare omgangsregels.

      7 Het basisexamen inburgering wordt afgelegd in de Nederlandse taal op een niveau dat niet hoger is dan het niveau,
      bedoeld in het derde lid.

      8 De examenprogramma’s, bedoeld in het derde en zesde lid, worden overeenkomstig door Onze Minister voor Wonen,
      Wijken en Integratie te stellen regels en tegen een door Onze Minister voor Wonen, Wijken en Integratie te stellen
      bedrag beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
