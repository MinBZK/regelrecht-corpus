  - number: '2.3'
    text: |-
      1 Onverminderd de overige terzake bij de [Wet][ref1] gestelde vereisten, wordt toegang tot Nederland niet geweigerd
      op grond van [artikel 3, eerste lid, onder a, van de Wet][ref2], indien de vreemdeling in het bezit is van:

      a. een geldig document voor grensoverschrijding dat is voorzien van een geldige machtiging tot voorlopig verblijf,
      indien hij zich naar Nederland begeeft voor een verblijf aldaar van langer dan drie maanden, of

      b. een door Onze Minister afgegeven verklaring die aan hem recht geeft op terugkeer naar Nederland.

      2 Een afzonderlijke geldige machtiging tot voorlopig verblijf wordt gelijkgesteld met een geldig document voor
      grensoverschrijding, indien de vreemdeling tevens in het bezit is van het in deze machtiging vermelde document.

      3 In afwijking van het eerste lid wordt toegang niet geweigerd indien de vreemdeling zich naar Nederland
      begeeft voor een verblijf van langer dan drie maanden en hij in het bezit is van een geldig document voor
      grensoverschrijding waarin de benodigde machtiging tot voorlopig verblijf ontbreekt, mits de vreemdeling:

      a. de nationaliteit bezit van één van bij ministeriële regeling aan te wijzen staten, of

      b. behoort tot een bij ministeriële regeling aan te wijzen categorie.

      4 Bij ministeriële regeling kan, ter uitvoering van een verdrag, dan wel een besluit van een volkenrechtelijke
      organisatie, van het eerste lid worden afgeweken ten gunste van vreemdelingen ten aanzien van het bezit van een
      document voor grensoverschrijding.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel2.3
