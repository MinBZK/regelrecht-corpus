  - number: '3.50'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], wordt onder een beperking
      verband houdend met voortgezet verblijf verleend aan de vreemdeling die:

      a. als minderjarige houder is geweest van een verblijfsvergunning onder een beperking verband houdend met
      gezinshereniging, verblijf ter adoptie of verblijf als pleegkind, bij een Nederlander of een vreemdeling met niet-
      tijdelijk verblijfsrecht in de zin van [artikel 3.5][ref2], en

      b. langer dan een jaar houder is geweest van de in onderdeel a bedoelde verblijfsvergunning, dan wel in Nederland
      is geboren uit ouders met niet-tijdelijk verblijfsrecht in de zin van [artikel 3.5][ref3].

      2 Voor de toepassing van het eerste lid wordt onder persoon met niet-tijdelijk verblijfsrecht niet verstaan de
      houder van de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28 van de Wet][ref4].

      3 De verblijfsvergunning wordt verleend, tenzij:

      a. de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden die tot afwijzing van de
      oorspronkelijke aanvraag tot het verlenen zouden hebben geleid;

      b. de vreemdeling een gevaar voor de nationale veiligheid vormt;

      c. de aanvraag met toepassing van de [artikelen 3.86][ref5] of [3.87][ref6] kan worden afgewezen, of

      d. de vreemdeling het hoofdverblijf buiten Nederland heeft verplaatst.

      4 Indien een van de ouders in Nederland is gevestigd en de Nederlandse nationaliteit heeft, wordt de
      verblijfsvergunning aan de minderjarige vreemdeling verleend, tenzij de vreemdeling onjuiste gegevens heeft
      verstrekt dan wel gegevens heeft achtergehouden die tot afwijzing van de oorspronkelijke aanvraag tot het verlenen
      zouden hebben geleid, of de vreemdeling het hoofdverblijf buiten Nederland heeft verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3.5
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3.5
