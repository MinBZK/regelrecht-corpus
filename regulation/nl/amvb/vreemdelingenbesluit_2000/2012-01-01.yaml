  - number: '8.6'
    text: |-
      1 De aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref1], ingediend door een vreemdeling die onderdaan is van België of Luxemburg die geen
      gemeenschapsonderdaan is, kan slechts worden afgewezen, indien de vreemdeling:

      a. een actuele bedreiging voor de openbare orde of de nationale veiligheid vormt; of

      b. niet over voldoende middelen van bestaan beschikt.

      2 De aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref2], ingediend door de in het eerste lid bedoelde vreemdeling, wordt niet afgewezen,
      en de verblijfsvergunning wordt niet ingetrokken, op grond van de omstandigheid dat de vreemdeling niet meer over
      voldoende middelen van bestaan beschikt.

      3 In afwijking van [artikel 21, eerste en tweede lid, van de Wet][ref3], wordt de aanvraag tot het verlenen van een
      verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20 van de Wet][ref4], ingediend door een vreemdeling
      als bedoeld in het eerste lid die nog niet gedurende een tijdvak van vijf jaren rechtmatig verblijf heeft gehad,
      slechts afgewezen, indien hij:

      a. een actuele bedreiging voor de openbare orde of de nationale veiligheid vormt; of

      b. niet zelfstandig en duurzaam beschikt over voldoende middelen van bestaan.

      4 In afwijking van [artikel 21 van de Wet][ref5], kan de verblijfsvergunning voor onbepaalde tijd, bedoeld in
      [artikel 20 van de Wet][ref6], die is verleend aan de vreemdeling, bedoeld in het eerste lid, slechts worden
      ingetrokken op de in het derde lid, onder a, bedoelde grond.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
