        artikel: '14'
  - number: '3.91'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], die is verleend onder een
      beperking verband houdend met het verrichten van arbeid in loondienst, wordt niet ingetrokken op de enkele grond
      dat de vreemdeling werkloos is, tenzij:

      a. de verblijfsvergunning is verleend voor een tijdelijk doel als bedoeld in [artikel 3.5][ref2];

      b. de werkloosheid is ingetreden na beëindiging van een arbeidsovereenkomst voor bepaalde duur of uitzendwerk;

      c. de vreemdeling van de werkloosheid een verwijt kan worden gemaakt, of

      d. de werkgever beschikt over een tewerkstellingsvergunning, die op grond van
      [artikel 8, tweede lid, onder 3°, van de Wet arbeid vreemdelingen][ref3] in samenhang met paragraaf 23 van
      de Uitvoeringsregels Wet arbeid vreemdelingen behorende bij het Delegatie- en uitvoeringsbesluit Wet arbeid
      vreemdelingen, is verleend zonder toetsing aan prioriteitgenietend aanbod voor de desbetreffende functie op de
      arbeidsmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3.5
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel8
