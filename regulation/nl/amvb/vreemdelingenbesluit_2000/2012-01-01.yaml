  - number: 4.52b
    text: |-
      1 De waarborgsom, bedoeld in [artikel 4.52a, derde lid, onder c][ref1], wordt door Onze Minister in ieder geval aan
      de rechthebbende teruggegeven:

      a. zodra de vreemdeling, bedoeld in [artikel 4.52a, eerste lid][ref2], binnen de voor hem geldende vertrektermijn
      uit eigen beweging Nederland heeft verlaten zonder zich tussentijds aan het toezicht te hebben onttrokken; dan wel

      b. zodra de vreemdeling na uitstel van het vertrek of de uitzetting, bedoeld in [artikel 4.52a, tweede lid][ref3],
      Nederland heeft verlaten of is uitgezet zonder zich tussentijds aan het toezicht te hebben onttrokken.

      2 Onze Minister berekent rente over de waarborgsommen, gedeponeerd krachtens
      [artikel 4.52a, derde lid, onder c][ref4]. [Artikel 3.9, tweede lid][ref5], en [artikel 3.10, tweede lid][ref6]
      zijn van overeenkomstige toepassing.

      3 De waarborgsom wordt teruggegeven en de rente wordt uitbetaald zo spoedig mogelijk nadat één van de in het eerste
      lid genoemde gronden zich voordoet.


