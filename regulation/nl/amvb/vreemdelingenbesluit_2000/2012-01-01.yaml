  - number: 3.24a
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], wordt onder een
      beperking verband houdend met gezinshereniging verleend aan de bloedverwant in rechtstreekse opgaande lijn
      van de alleenstaande minderjarige houder van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de wet][ref2], die niet daadwerkelijk onder de hoede staat van een krachtens wettelijk voorschrift
      of gewoonterecht voor hem verantwoordelijke volwassene, indien die bloedverwant:

      a. beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel waarvoor
      de verblijfsvergunning is aangevraagd, of behoort tot één van de in [artikel 17 van de Wet][ref3] of in
      [artikel 3.71, tweede lid][ref4], bedoelde categorieën;

      b. beschikt over een geldig document voor grensoverschrijding, of naar het oordeel van Onze Minister heeft
      aangetoond dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van
      een geldig document voor grensoverschrijding kan worden gesteld;

      c. bereid is een onderzoek naar of behandeling voor tuberculose te ondergaan en daaraan mee te werken of de
      nationaliteit bezit van een van de bij ministeriële regeling vast te stellen landen, en

      d. geen gevaar vormt voor de openbare orde of nationale veiligheid als bedoeld in de [artikelen 3.77][ref5] en
      [3.78][ref6].

      2 Indien gezinshereniging mogelijk is in een derde land waarmee de alleenstaande minderjarige of de bloedverwant,
      bedoeld in het eerste lid, bijzondere banden heeft of indien de aanvraag niet is ingediend binnen drie maanden
      nadat aan de alleenstaande minderjarige, bedoeld in het eerste lid, de verblijfsvergunning voor bepaalde tijd,
      bedoeld in [artikel 28 van de wet][ref7], is verleend, wordt de vergunning eerst verleend, nadat de alleenstaande
      minderjarige heeft aangetoond duurzaam en zelfstandig te beschikken over voldoende middelen van bestaan als bedoeld
      in [artikel 3.74, eerste lid, onder a][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
