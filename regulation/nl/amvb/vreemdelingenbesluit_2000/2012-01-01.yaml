  - number: 3.23b
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend onder
      een beperking verband houdend met gezinshereniging of gezinsvorming, aan de echtgenoot, de geregistreerde partner
      dan wel de ongehuwde partner van de houder van de door Onze Minister afgegeven Europese blauwe kaart, en het
      minderjarige kind van die echtgenoot, partner of houder van de Europese blauwe kaart, indien:

      a. dat kind, die echtgenoot of die partner in een andere staat die partij is bij het Verdrag betreffende de werking
      van de Europese Unie gedurende ten minste achttien maanden is toegelaten als gezinslid van die houder van de
      Europese blauwe kaart;

      b. dat kind, die echtgenoot of die partner in het bezit is van een geldig document voor grensoverschrijding of een
      gewaarmerkt afschrift daarvan;

      c. dat kind, die echtgenoot of die partner geen gevaar voor de openbare orde als bedoeld in de
      [artikelen 3.77][ref2] en [3.78][ref3] of de nationale veiligheid vormt;

      d.

      2 De verblijfsvergunning wordt verleend, indien de houder van de Europese blauwe kaart:

      a. direct voorafgaande aan de verlening van die kaart door Onze Minister houder was van een door de autoriteiten
      van een andere staat die partij is bij het Verdrag betreffende de werking van de Europese Unie afgegeven Europese
      blauwe kaart;

      b. duurzaam en zelfstandig beschikt over voldoende middelen van bestaan als bedoeld in
      [artikel 3.74, eerste lid, onder a][ref4].

      3


