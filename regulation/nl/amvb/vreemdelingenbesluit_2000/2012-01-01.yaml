  - number: 3.80a
    text: |-
      1 Een aanvraag tot het wijzigen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref1], in een
      verblijfsvergunning onder een beperking verband houdend met voortgezet verblijf wordt afgewezen, indien de aanvraag
      is ingediend door een vreemdeling als bedoeld in [artikel 3.51, eerste lid, aanhef en onderdeel a][ref2], die het
      inburgeringsexamen, bedoeld in [artikel 13 van de Wet inburgering][ref3], niet heeft behaald.

      2 Het eerste lid is niet van toepassing, indien de vreemdeling:

      a. jonger dan 16 jaar of 65 jaar of ouder is;

      b. ten minste acht jaren tijdens de leerplichtige leeftijd in Nederland heeft verbleven overeenkomstig het bepaalde
      bij en krachtens [artikel 2.6 van het Besluit inburgering][ref4];

      c. beschikt over een document als bedoeld in
      [artikel 2.3, eerste lid, onder b tot en met l, en tweede lid, van het Besluit inburgering][ref5], dan wel voldoet
      aan een van de criteria, genoemd in [artikel 2.5, onder a tot en met c, van dat besluit][ref6];

      d. op grond van [artikel 6, eerste lid][ref7], of [artikel 31, tweede lid, van de Wet inburgering][ref8] van de
      inburgeringsplicht is ontheven;

      e. verblijf heeft in Nederland op basis van een afhankelijke verblijfstitel en de relatie waarop die afhankelijke
      titel is gebaseerd is verbroken in verband met huiselijk geweld.

      3 Onze Minister kan het eerste lid voorts buiten toepassing laten, indien de vreemdeling
      naar zijn oordeel blijkens een door deze vreemdeling overgelegd advies als bedoeld in
      [artikel 2.8, eerste lid, van het Besluit inburgering][ref9] door een psychische of lichamelijke belemmering, dan
      wel een verstandelijke handicap blijvend niet in staat is het inburgeringsexamen te behalen.

      4 Onze Minister kan het eerste lid voorts buiten toepassing laten, voorzover toepassing daarvan naar zijn oordeel
      zal leiden tot een onbillijkheid van overwegende aard.

      5 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de afwijzing van de aanvraag om wijziging van
      de verblijfsvergunning in andere gevallen dan bedoeld in het eerste lid, en omtrent de toepassing van het tweede
      lid, onder d, en derde lid.


