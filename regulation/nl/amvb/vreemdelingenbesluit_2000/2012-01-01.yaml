  - number: '3.100'
    text: |-
      Indien de vreemdeling, hangende de besluitvorming op een eerdere aanvraag, wijziging van het gevraagde
      verblijfsdoel wenst, dient hij een nieuwe aanvraag in.
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.100
  - number: '3.101'
    text: |-
      1 De aanvraag, bedoeld in de [artikelen 14][ref1] en [20 van de Wet][ref2], wordt ingediend op een bij ministeriële
      regeling aan te wijzen plaats.

      2 In afwijking van het eerste lid wordt, indien de vreemdeling rechtens de vrijheid is ontnomen, de aanvraag
      ingediend op de plaats waar de vrijheidsontneming ten uitvoer wordt gelegd.

      3 In afwijking van het eerste lid kan de aanvraag, bedoeld in [artikel 14 van de Wet][ref3], tevens worden
      ingediend bij de Nederlandse diplomatieke of consulaire vertegenwoordiging in Australië, Nieuw Zeeland of Canada,
      indien de vreemdeling de Australische, Nieuw Zeelandse of Canadese nationaliteit bezit en in Nederland wil
      verblijven in het kader van een uitwisselingsprogramma tussen Nederland en die landen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.101
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
