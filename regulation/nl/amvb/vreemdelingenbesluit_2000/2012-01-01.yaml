  - number: 3.71a
    text: |-
      1 Een vreemdeling beschikt over kennis op basisniveau van de Nederlandse taal en van de Nederlandse maatschappij
      als bedoeld in [artikel 16, eerste lid, onder h, van de Wet][ref1], indien hij binnen één jaar direct
      voorafgaand aan de aanvraag om de machtiging tot voorlopig verblijf het basisexamen inburgering, bedoeld in
      [artikel 3.98a][ref2], met goed gevolg heeft afgelegd.

      2 De aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd,
      bedoeld in [artikel 14 van de Wet][ref3], wordt niet afgewezen op grond van
      [artikel 16, eerste lid, onder h, van de Wet][ref4], indien de vreemdeling:

      a. in Nederland wil verblijven als gezinslid van een houder van een verblijfsvergunning als bedoeld in
      [artikel 28][ref5] of [33 van de Wet][ref6];

      b. ingevolge de wetgeving van een lidstaat van de Europese Unie of een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte heeft voldaan aan een inburgeringsvereiste om de status van
      langdurig ingezetene in de zin van [richtlijn 2003/109/EG](32003L0109) van 25 november 2003 betreffende de status
      van langdurig ingezeten onderdanen van derde landen (PbEU L 16) te verkrijgen;

      c. ten genoegen van Onze Minister voor Wonen, Wijken en Integratie heeft aangetoond door een geestelijke
      of lichamelijke belemmering blijvend niet in staat te zijn het basisexamen inburgering, bedoeld in
      [artikel 3.98a][ref7], af te leggen;

      d. het basisexamen inburgering, bedoeld in [artikel 3.98a][ref8], niet met goed gevolg heeft afgelegd en
      afwijzing van die aanvraag naar het oordeel van Onze Minister voor Wonen, Wijken en Integratie zou leiden tot een
      onbillijkheid van overwegende aard.

      3 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de toepassing van het tweede lid,
      onderdelen a en b, en bij regeling van Onze Minister voor Wonen, Wijken en Integratie kunnen nadere regels worden
      gesteld omtrent de toepassing van het tweede lid, onderdelen c en d.


