      1 Het model van de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in de [artikelen 28][ref1] en
      [33 van de Wet][ref2], wordt bij ministeriële regeling vastgesteld.

      2 De aanvraag wordt door de vreemdeling of zijn wettelijk vertegenwoordiger in persoon ingediend op een bij
      ministeriële regeling te bepalen plaats.

      3 In afwijking van het tweede lid wordt, indien de vreemdeling rechtens de vrijheid is ontnomen, de aanvraag
      ingediend op de plaats waar de vrijheidsontneming ten uitvoer wordt gelegd.


