  - number: 3.96a
    text: |-
      1 De aanvraag tot het verlenen of het wijzigen van een verblijfsvergunning voor onbepaalde tijd als bedoeld
      in [artikel 20 van de Wet][ref1] wordt afgewezen, indien de vreemdeling het inburgeringsexamen, bedoeld in
      [artikel 13 van de Wet inburgering][ref2] niet heeft behaald.

      2 Het eerste lid is niet van toepassing, indien de vreemdeling:

      a. 65 jaar of ouder is;

      b. ten minste acht jaren tijdens de leerplichtige leeftijd in Nederland heeft verbleven overeenkomstig het bepaalde
      bij en krachtens [artikel 2.6 van het Besluit inburgering][ref3];

      c. beschikt over een document als bedoeld in
      [artikel 2.3, eerste lid, onder b tot en met l, en tweede lid, van het Besluit inburgering][ref4], dan wel voldoet
      aan een van de criteria, genoemd in [artikel 2.5, onder a tot en met c, van dat besluit][ref5];

      d. op grond van [artikel 6, eerste lid][ref6], of [artikel 31, tweede lid, van de Wet inburgering][ref7] van de
      inburgeringsplicht is ontheven;

      e. meerderjarig is en:

      1°. voor het negentiende levensjaar tien jaren rechtmatig in Nederland heeft verbleven als bedoeld in
      [artikel 8, onder a, b dan wel l, van de Wet][ref8], voor zover diens aanvraag is ontvangen voor het
      negenentwintigste levensjaar, of

      2°. voor het negentiende levensjaar vijf jaren rechtmatig in Nederland heeft verbleven als bedoeld in
      [artikel 8, onder a, b dan wel l, van de Wet][ref9], en voor wie Nederland naar het oordeel van Onze Minister het
      meest aangewezen land is;

      f. oud-Nederlander is, die het Nederlanderschap heeft verloren door het afleggen van een verklaring van
      afstand, dan wel door intrekking van het besluit waarbij het Nederlanderschap is verleend op de grond dat hij
      heeft nagelaten na de totstandkoming van zijn naturalisatie al het mogelijke te doen om zijn oorspronkelijke
      nationaliteit te verliezen, en die voorafgaand aan de naturalisatie ten minste vijf jaren rechtmatig verblijf in
      Nederland als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref10] heeft gehad;

      g. meerderjarig is, in aanmerking komt voor de terugkeeroptie op grond van [artikel 8 van de Remigratiewet][ref11]
      en voorafgaand aan de remigratie ten minste vijf jaren rechtmatig verblijf in Nederland als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref12] heeft gehad.

      3 Onze Minister kan het eerste lid voorts buiten toepassing laten, indien de vreemdeling
      naar zijn oordeel blijkens een door deze vreemdeling overgelegd advies als bedoeld in
      [artikel 2.8, eerste lid, van het Besluit inburgering][ref13] door een psychische of lichamelijke belemmering, dan
      wel een verstandelijke handicap blijvend niet in staat is het inburgeringsexamen te behalen.

      4 Onze Minister kan het eerste lid voorts buiten toepassing laten, voorzover toepassing daarvan naar zijn oordeel
      zal leiden tot een onbillijkheid van overwegende aard.

      5 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de toepassing van het tweede lid, onder d, en
      derde lid.


