        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '3.71'
    text: |-
      1 De aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref1], wordt afgewezen, indien de vreemdeling niet beschikt over een geldige machtiging tot
      voorlopig verblijf.

      2 Van het vereiste van een geldige machtiging tot verblijf is, op grond van
      [artikel 17, eerste lid, onder g, van de Wet][ref2], vrijgesteld de vreemdeling:

      a. die voor het bereiken van het negentiende levensjaar vijf achtereenvolgende jaren rechtmatig verblijf in
      Nederland heeft gehad als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref3] of als
      Nederlander en in die periode niet het hoofdverblijf buiten Nederland heeft verplaatst;

      b. van twaalf jaar of jonger, die in Nederland is geboren en naar het oordeel van Onze Minister feitelijk is
      blijven behoren tot het gezin van een ouder die

      1°. sedert het moment van geboorte van de vreemdeling rechtmatig verblijf in Nederland heeft op grond van
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref4] of als Nederlander, of

      2°. op het moment van de geboorte van de vreemdeling rechtmatig verblijf in Nederland had op grond van
      [artikel 8, onder f tot en met k, van de Wet][ref5] en die sedertdien aansluitend rechtmatig verblijf op grond van
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref6] heeft, voor zover geen van beiden het hoofdverblijf
      buiten Nederland heeft verplaatst;

      c. die in Nederland verblijft op grond van een geprivilegieerde status als gezinslid van een in Nederland
      geaccrediteerd personeelslid van een buitenlandse diplomatieke of consulaire post die zelf in aanmerking komt voor
      de verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 21 van de Wet][ref7];

      d. die ten minste zeven jaren werkzaam is of is geweest op een Nederlands zeeschip of een mijnbouwinstallatie op
      het continentaal plat;

      e. die in aanmerking komt voor een verblijfsvergunning op grond van Besluit 1/80 van de Associatieraad EEG-Turkije
      betreffende de ontwikkeling van de Associatie of van wie uitzetting in strijd zou zijn met de op 12 september 1963
      te Ankara gesloten Overeenkomst waarbij een associatie tot stand wordt gebracht tussen de Europese Economische
      Gemeenschap en Turkije (Trb. 1964, 217), het op 23 november 1970 te Brussel tot stand gekomen Aanvullend Protocol
      bij die overeenkomst (Trb. 1971, 70) of dat Besluit nr. 1/80;

      f. die in aanmerking komt voor terugkeer naar Nederland op grond van [artikel 8 van de Remigratiewet][ref8];

      g. die in Nederland verblijft, bij de rechtbank te 's-Gravenhage een verzoek heeft ingediend tot vaststelling van
      zijn Nederlanderschap dat naar het oordeel van Onze Minister niet klaarblijkelijk van elke grond ontbloot is;

      h. die tijdelijke bescherming heeft en in aanmerking komt voor de verblijfsvergunning voor bepaalde tijd, bedoeld
      in [artikel 14 van de wet][ref9], onder een beperking als bedoeld in [artikel 3.30][ref10] of [3.31][ref11];

      i. die houder is van een verblijfsvergunning voor onderzoekers in de zin van richtlijn 2005/71/EG afgegeven door
      een andere staat die Partij is bij het Verdrag betreffende de werking van de Europese Unie, dan wel de echtgenoot,
      partner of het minderjarig kind is van die houder, tenzij sprake is van gezinsvorming;

      j. die binnen drie maanden nadat aan de hoofdpersoon een verblijfsvergunning voor bepaalde tijd als bedoeld
      in [artikel 28 van de Wet][ref12] is verleend, een aanvraag heeft ingediend tot het verlenen van een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14 van de Wet][ref13], onder een beperking
      verband houdend met gezinshereniging, voor zover de gezinsband reeds bestond voordat de hoofdpersoon in Nederland
      hoofdverblijf had en er geen gezinshereniging mogelijk is in een derde land waarmee de vreemdeling of de
      hoofdpersoon bijzondere banden heeft;

      k. die minderjarig is, schoolgaand is en drie jaar ononderbroken hoofdverblijf in Nederland heeft en een
      aanvraag heeft ingediend tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Wet][ref14], onder een beperking verband houdend met gezinshereniging bij een Nederlander of een
      hoofdpersoon met rechtmatig verblijf, als bedoeld in [artikel 8, onder a tot en met e dan wel l, van de Wet][ref15];

      l. van wie uitzetting in strijd met artikel 8 van het Verdrag tot bescherming van de rechten van de mens en de
      fundamentele vrijheden zou zijn.

      3 Het tweede lid, met uitzondering van onderdeel h, is niet van toepassing op de vreemdeling die als geestelijk
      voorganger of godsdienstleraar wil verblijven.

      4 Onze Minister kan het eerste lid buiten toepassing laten, voorzover toepassing daarvan naar zijn oordeel zal
      leiden tot een onbillijkheid van overwegende aard.


