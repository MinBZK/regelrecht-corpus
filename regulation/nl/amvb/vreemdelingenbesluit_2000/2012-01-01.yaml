  - number: '3.43'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met verblijf als au pair worden verleend aan de vreemdeling:

      a. die achttien jaar of ouder, maar jonger dan zesentwintig jaar is;

      b. die ongehuwd is en niet de zorg heeft voor kinderen;

      c. die niet eerder rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2], heeft gehad;

      d. die als au pair verblijft in een gastgezin, bestaande uit twee of meer personen, voor wie de vreemdeling niet
      eerder werkzaamheden heeft verricht;

      e. die als tegenprestatie voor het verblijf in het gastgezin niet meer dan dertig uur per week lichte
      huishoudelijke werkzaamheden verricht, en

      f. wiens vertrek uit Nederland naar het oordeel van Onze Minister redelijkerwijs is gewaarborgd.

      2 De verblijfsvergunning kan worden verleend, indien het gastgezin duurzaam en zelfstandig beschikt over voldoende
      middelen van bestaan als bedoeld in [artikel 3.74, eerste lid, onderdeel b][ref3] en een garantverklaring heeft
      ondertekend. In afwijking van [artikel 3.75][ref4], zijn middelen van bestaan duurzaam, indien zij voor ten minste
      één jaar beschikbaar zijn.

      3 Bij de aanvraag wordt door de vreemdeling en het gastgezin een schriftelijke verklaring ondertekend, waarin zij
      onder meer verklaren dat de vreemdeling als au pair tijdelijk in het gastgezin verblijft.

      4 Het model van de verklaringen wordt bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3.74
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3.75
