  - number: '8.16'
    text: |-
      1 Onverminderd de [artikelen 8.22][ref1] en [8.23][ref2] eindigt het rechtmatig verblijf niet zolang de vreemdeling
      aan de in de [artikelen 8.12 tot en met 8.15][ref3] genoemde voorwaarden voldoet. In specifieke gevallen van
      redelijke twijfel kan Onze Minister onderzoeken of aan de voorwaarden wordt voldaan. Het onderzoek geschiedt
      niet stelselmatig. Een beroep op de algemene middelen leidt niet zonder meer tot beëindiging van het rechtmatig
      verblijf.

      2 Onverminderd de [artikelen 8.22][ref4] en [8.23][ref5], eindigt het rechtmatig verblijf niet zolang de
      vreemdeling, bedoeld in [artikel 8.7, eerste lid][ref6]:

      a. werknemer of zelfstandige is; of

      b. naar Nederland is gekomen om werk te zoeken en hij kan bewijzen dat hij nog steeds werk zoekt en een reële kans
      op werk heeft.


