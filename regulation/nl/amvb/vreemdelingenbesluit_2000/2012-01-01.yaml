  - number: '3.118'
    text: |-
      1 Indien Onze Minister voornemens is om:

      a. de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 28 van de Wet][ref1], af te wijzen
      na ommekomst van de in [artikel 3.110, eerste of tweede lid][ref2], genoemde termijn;

      b. de aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning, bedoeld in
      [artikel 28 van de Wet][ref3], af te wijzen, of

      c. de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 33 van de Wet][ref4], af
      te wijzen, terwijl de vreemdeling rechtens zijn vrijheid is ontnomen op grond van [artikel 6][ref5] of
      [artikel 59 van de Wet][ref6] en de vrijheidsontneming voortduurt, wordt het schriftelijk voornemen daartoe
      uitgereikt of toegezonden.

      2 De [artikelen 3.117, vijfde tot en met zevende lid][ref7], en [3.116, vijfde en zesde lid][ref8], zijn van
      toepassing.


