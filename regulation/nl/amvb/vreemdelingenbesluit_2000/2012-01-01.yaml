      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met familiebezoek worden verleend aan de vreemdeling:

      a. die zes maanden of korter in Nederland wil verblijven bij een in Nederland verblijvend familielid dat rechtmatig
      verblijf als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2] heeft, of Nederlander is, en

      b. wiens terugkeer naar het oordeel van Onze Minister redelijkerwijs is gewaarborgd.

      2 In afwijking van [artikel 3.75][ref3] zijn middelen van bestaan duurzaam, indien zij voor de duur van het
      voorgenomen verblijf van de vreemdeling beschikbaar zijn.

      3 Indien het verblijf van de vreemdeling wordt bekostigd door een in Nederland gevestigd familielid
      of andere relatie, wordt onder voldoende middelen van bestaan verstaan een inkomen als bedoeld in
      [artikel 3.74, eerste lid, onderdeel b][ref4]. Het familielid ondertekent een garantstelling. Het model van de
      garantstelling wordt bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
