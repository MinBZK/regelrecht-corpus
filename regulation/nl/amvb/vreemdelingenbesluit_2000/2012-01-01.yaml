  - number: '3.86'
    text: |-
      1 De aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning voor
      bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan worden afgewezen op grond van
      [artikel 18, eerste lid, onder e, van de Wet][ref2] wegens gevaar voor de openbare orde, indien:

      a. de vreemdeling met een verblijfsduur korter dan drie jaar wegens een misdrijf waartegen een gevangenisstraf
      van twee jaar of meer is bedreigd, bij onherroepelijk geworden rechterlijk vonnis een gevangenisstraf
      of jeugddetentie, een taakstraf of een maatregel als bedoeld in [artikel 37a][ref3], [38m][ref4] of
      [77h, vierde lid, onder a of b, van het Wetboek van Strafrecht][ref5] is opgelegd, bij onherroepelijke
      strafbeschikking een taakstraf is opgelegd, dan wel het buitenlandse equivalent van een dergelijke straf of
      maatregel is opgelegd, en de totale duur van de onvoorwaardelijk ten uitvoer te leggen gedeelten van die straffen
      en maatregelen ten minste gelijk is aan de in het tweede lid bedoelde norm;

      b. de vreemdeling wegens een misdrijf waartegen een gevangenisstraf van drie jaar of meer is bedreigd, bij
      onherroepelijk geworden rechterlijk vonnis een gevangenisstraf of jeugddetentie, een taakstraf of een maatregel als
      bedoeld in [artikel 37a][ref6], [38m][ref7] of [77h, vierde lid, onder a of b, van het Wetboek van Strafrecht][ref8]
      is opgelegd, bij onherroepelijke strafbeschikking een taakstraf is opgelegd, dan wel het buitenlandse equivalent
      van een dergelijke straf of maatregel is opgelegd, en de totale duur van de onvoorwaardelijk ten uitvoer te leggen
      gedeelten van die straffen en maatregelen ten minste gelijk is aan de in het tweede lid bedoelde norm.

      2 De in het eerste lid, bedoelde norm bedraagt bij een verblijfsduur van:








                    minder dan 1 jaar:


                    1 maand;




                    ten minste 1 jaar, maar minder dan 2 jaar:


                    3 maanden;




                    ten minste 2 jaar, maar minder dan 3 jaar:


                    6 maanden;




                    ten minste 3 jaar, maar minder dan 4 jaar:


                    9 maanden;




                    ten minste 4 jaar, maar minder dan 5 jaar:


                    12 maanden;




                    ten minste 5 jaar, maar minder dan 6 jaar:


                    24 maanden;




                    ten minste 6 jaar, maar minder dan 7 jaar:


                    30 maanden;




                    ten minste 7 jaar, maar minder dan 8 jaar:


                    36 maanden;




                    ten minste 8 jaar, maar minder dan 9 jaar:


                    45 maanden;




                    ten minste 9 jaar, maar minder dan 10 jaar:


                    54 maanden;




                    ten minste 10 jaar, maar minder dan 15 jaar:


                    60 maanden;




                    ten minste 15 jaar, maar minder dan 20 jaar:


                    96 maanden.






      3 Bij de toepassing van het eerste en tweede lid wordt de duur van het onvoorwaardelijk opgelegde gedeelte van de
      gevangenisstraf wegens een misdrijf waartegen een gevangenisstraf van meer dan zes jaar is bedreigd, met de factor
      twee vermenigvuldigd.

      4 De aanvraag kan voorts worden afgewezen op grond van [artikel 18, eerste lid, onder e, van de Wet][ref9],
      indien de vreemdeling wegens ten minste vijf misdrijven, dan wel bij een verblijfsduur korter dan twee
      jaar wegens ten minste drie misdrijven, bij onherroepelijk geworden rechterlijk vonnis een gevangenisstraf
      of jeugddetentie, een taakstraf of een maatregel als bedoeld in [artikel 37a][ref10], [38m][ref11] of
      [77h, vierde lid, onder a of b, van het Wetboek van Strafrecht][ref12] is opgelegd, bij onherroepelijke
      strafbeschikking een taakstraf is opgelegd, dan wel het buitenlandse equivalent van een dergelijke straf of
      maatregel is opgelegd, en de totale duur van de onvoorwaardelijk ten uitvoer te leggen gedeelten van die straffen
      en maatregelen ten minste gelijk is aan de in het vijfde lid bedoelde norm.

      5 De in het vierde lid bedoelde norm bedraagt bij een verblijfsduur van:








                    minder dan 1 jaar:


                    2 weken;




                    ten minste 1 jaar, maar minder dan 2 jaar:


                    1 maand;




                    ten minste 2 jaar, maar minder dan 3 jaar:


                    3 maanden;




                    ten minste 3 jaar, maar minder dan 4 jaar:


                    4 maanden;




                    ten minste 4 jaar, maar minder dan 5 jaar:


                    5 maanden;




                    ten minste 5 jaar, maar minder dan 6 jaar:


                    6 maanden;




                    ten minste 6 jaar, maar minder dan 7 jaar:


                    7 maanden;




                    ten minste 7 jaar, maar minder dan 8 jaar:


                    8 maanden;




                    ten minste 8 jaar, maar minder dan 9 jaar:


                    9 maanden;




                    ten minste 9 jaar, maar minder dan 10 jaar:


                    10 maanden;




                    ten minste 10 jaar, maar minder dan 15 jaar:


                    12 maanden;




                    ten minste 15 jaar, maar minder dan 20 jaar:


                    14 maanden.






      6 Voor de toepassing van de voorgaande leden wordt onder verblijfsduur verstaan: de duur van het rechtmatige
      verblijf als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref13] of als Nederlander, direct
      voorafgaande aan het moment waarop het misdrijf is gepleegd of aangevangen.

      7 Bij de berekening van de in het tweede en vijfde lid bedoelde normen wordt betrokken:

      a. indien een taakstraf is opgelegd:

      1°. de duur van de vrijheidsstraf die de rechter heeft vastgesteld voor het geval de veroordeelde de taakstraf niet
      naar behoren verricht;

      2°. voor iedere twee uren bij strafbeschikking opgelegde taakstraf: een dag vrijheidsstraf;

      b. indien een maatregel als bedoeld in [artikel 77h, vierde lid, onder b, van het Wetboek van Strafrecht][ref14]
      is opgelegd: de duur van de vervangende jeugddetentie die de rechter heeft vastgesteld voor het geval dat de
      veroordeelde niet naar behoren aan de tenuitvoerlegging van de maatregel heeft meegewerkt.

      8 Bij de toepassing van de voorgaande leden, wordt mede betrokken de buiten Nederland gepleegde of bestrafte
      inbreuk op de openbare orde, voor zover die naar Nederlands recht een misdrijf oplevert waartegen een
      gevangenisstraf van twee, onderscheidenlijk drie of zes jaren of meer is bedreigd en waarbij de strafmaat
      vergelijkbaar is met de strafmaat die in Nederland zou zijn opgelegd wanneer het feit in Nederland zou zijn
      gepleegd.

      9 In afwijking van de voorgaande leden wordt de aanvraag niet afgewezen, indien de vreemdeling minderjarig is en
      één van zijn ouders met de Nederlandse nationaliteit in Nederland is gevestigd.

      10 Indien de vreemdeling in Nederland is geboren of voor zijn tiende jaar rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met e dan wel l van de Wet][ref15], heeft gekregen, wordt de aanvraag in afwijking van
      de voorgaande leden niet afgewezen:

      a. bij een verblijfsduur van tien jaar, tenzij er sprake is van een geweldsmisdrijf of handel in verdovende
      middelen, of

      b. bij een verblijfsduur van vijftien jaar.

      11 In afwijking van de voorgaande leden wordt de aanvraag niet afgewezen:

      a. bij een verblijfsduur van tien jaren, tenzij er sprake is van een geweldsmisdrijf of handel in verdovende
      middelen;

      b. bij een verblijfsduur van twintig jaren.

      12 In afwijking van de voorgaande leden kan de aanvraag eveneens op grond van
      [artikel 18, eerste lid, onder e, van de Wet][ref16] worden afgewezen, indien:

      a. er ernstige redenen zijn om te veronderstellen dat de vreemdeling zich schuldig heeft gemaakt aan gedragingen
      als bedoeld in artikel 1F van het Vluchtelingenverdrag;

      b. de vreemdeling de echtgenoot of de echtgenote, het minderjarige kind, de partner of het meerderjarige kind,
      bedoeld in [artikel 29, onder e of f, van de Wet][ref17], is van een in Nederland verblijvende vreemdeling ten
      aanzien van wie er ernstige redenen zijn om te veronderstellen dat deze zich schuldig heeft gemaakt aan gedragingen
      als bedoeld in artikel 1F van het Vluchtelingenverdrag.

      13 In geval de verblijfsvergunning is verleend onder een beperking verband houdende met verblijf als familie- of
      gezinslid houdt Onze Minister bij de toepassing van de voorgaande leden in ieder geval terdege rekening met de aard
      en de hechtheid van de gezinsband van de vreemdeling, alsmede het bestaan van familiebanden of culturele of sociale
      banden met het land van herkomst.

      14 In geval de aanvraag is ingediend door een vreemdeling die houder is van een EG-verblijfsvergunning voor
      langdurig ingezetenen die is afgegeven door een andere staat die partij is bij het Verdrag betreffende de werking
      van de Europese Unie, houdt Onze Minister bij de toepassing van de voorgaande leden mede rekening met de ernst
      van de inbreuk of het soort van inbreuk dat door de langdurig ingezetene of diens gezinslid op de openbare orde of
      nationale veiligheid is gepleegd, respectievelijk met het gevaar dat van de langdurig ingezetene of dat gezinslid
      uitgaat.

      15 Bij de toepassing van het veertiende lid houdt Onze Minister rekening met de leeftijd van de vreemdeling, de
      gevolgen van verblijfsbeëindiging voor de vreemdeling en zijn gezinsleden en met de banden met Nederland en het
      land van herkomst.

      16 In afwijking van de voorgaande leden wordt de aanvraag niet afgewezen, indien de vreemdeling verblijfsrecht
      ontleent aan Besluit 1/80 van de Associatieraad EEG-Turkije betreffende de ontwikkeling van de Associatie, tenzij
      diens persoonlijke gedrag een actuele, werkelijke en ernstige bedreiging voor een fundamenteel belang van de
      samenleving vormt.

      17 Onverminderd het zestiende lid, wordt de aanvraag niet afgewezen, indien uitzetting van de vreemdeling in
      strijd zou zijn met de op 12 september 1963 te Ankara gesloten Overeenkomst waarbij een associatie tot stand wordt
      gebracht tussen de Europese Economische Gemeenschap en Turkije (Trb. 1964, 217), het op 23 november 1970 te Brussel
      tot stand gekomen Aanvullend Protocol bij die overeenkomst (Trb. 1971, 70) of Besluit 1/80 van de Associatieraad
      EEG-Turkije betreffende de ontwikkeling van de Associatie.

      18 De aanvraag wordt niet afgewezen, indien uitzetting van de vreemdeling in strijd zou zijn met artikel 8 van het
      Verdrag tot bescherming van de rechten van de mens en de fundamentele vrijheden.

      19 De vreemdeling van twaalf jaar of ouder ondertekent een antecedentenverklaring, waarvan het model bij
      ministeriële regeling is vastgesteld.

      20 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de toepassing van het dertiende tot
      en met het zeventiende lid.


