  - number: 3.56a
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met het verblijf als onderzoeker in de zin van richtlijn 2005/71/EG worden verleend aan de
      vreemdeling:

      a. die onderzoek verricht bij een bij ministeriële regeling aan te wijzen onderzoeksinstelling;

      b. die een met een onderzoeksinstelling gesloten gastovereenkomst overlegt, waaruit blijkt:

      1°. dat het onderzoeksproject is goedgekeurd, na toetsing van:

      a. het doel en de duur van het onderzoek en de beschikbaarheid van de hiervoor benodigde financiële middelen;

      b. de kwalificaties van de vreemdeling in het licht van het doel van het onderzoek, die gestaafd worden met een
      gewaarmerkte kopie van een door de vreemdeling behaald passend diploma van hoger onderwijs, dat toegang geeft tot
      doctoraatprogramma’s; en

      2°. wat de rechtsbetrekking en de arbeidsvoorwaarden van de vreemdeling zijn, en

      c. die een garantstelling van de onderzoeksinstelling overlegt.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.56a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '3.57'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], wordt verleend voor ten
      hoogste één jaar en kan telkens met ten hoogste één jaar worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.57
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '3.58'
    text: |-
      In afwijking van [artikel 3.57][ref1] kan de verblijfsvergunning worden verleend onder een beperking
      verband houdend met gezinshereniging als minderjarige of verblijf ter adoptie of als pleegkind, voor de
      duur van het verblijfsrecht op grond van [artikel 8, onder a, c, e, of l, van de Wet][ref2], van de ouder,
      adoptiefouder of pleegouder, dan wel, indien deze rechtmatig verblijf in Nederland heeft als bedoeld in
      [artikel 8, onder b of d, van de Wet][ref3] of als Nederlander voor vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.57
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.58
    references:
