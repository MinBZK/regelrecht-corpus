        artikel: '28'
  - number: '3.112'
    text: |-
      1 Nadat de vreemdeling op de eerste dag de aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd
      als bedoeld in [artikel 28 van de Wet][ref1] heeft ingediend, wordt hij op diezelfde dag door Onze Minister aan een
      eerste gehoor onderworpen.

      2 Het eerste gehoor geschiedt overeenkomstig een bij ministeriële regeling vastgestelde vragenlijst. De vragenlijst
      bevat geen vragen omtrent de beweegredenen van de aanvraag.

      3 Een afschrift van de ingevulde vragenlijst wordt op de eerste dag aan de vreemdeling ter kennis gebracht.

      4 In afwijking van het eerste lid kan een eerste gehoor achterwege worden gelaten indien de vreemdeling reeds
      eerder een aanvraag om een verblijfsvergunning, als bedoeld in [artikel 28 van de Wet][ref2], heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.112
