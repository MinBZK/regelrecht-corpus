      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking,
      verband houdende met het verrichten van arbeid als zelfstandige worden verleend aan de vreemdeling die:

      a. arbeid als zelfstandige verricht of gaat verrichten, waarmee naar het oordeel van Onze Minister een wezenlijk
      Nederlands belang is gediend;

      b. uit die werkzaamheden duurzaam en zelfstandig voldoende middelen van bestaan verwerft, en

      c. voldoet aan de bevoegdheidsvereisten voor de uitoefening van die arbeid en aan de vereisten voor het uitoefenen
      van het desbetreffende bedrijf.

      2 Bij ministeriële regeling kunnen in overeenstemming met Onze Minister van Economische Zaken
      ondernemingsactiviteiten worden aangewezen waarmee geen wezenlijk Nederlands economisch belang is gediend.

      3 De aanvraag wordt niet afgewezen wegens het ontbreken van een wezenlijk Nederlands belang, indien de vreemdeling
      op het moment waarop de aanvraag is ontvangen een ononderbroken arbeidsverleden heeft van ten minste zeven jaar:

      a. aan boord van een Nederlands zeeschip;

      b. op het Nederlandse deel van het continentaal plat;

      c. in de internationale binnenscheepvaart aan boord van Nederlandse schepen of daarmee gelijkgestelde inrichtingen,
      of

      d. in het internationale wegtransport in dienst van een Nederlandse werkgever, voorzover dat transport vanuit of
      naar Nederland plaatsvindt.

      4 Voor de toepassing van het derde lid worden niet als onderbrekingen aangemerkt tussentijdse perioden van
      onvrijwillige werkloosheid, voorzover die in Nederland zijn doorgebracht en elk zes maanden of korter duurden, en
      die perioden in totaal niet langer dan twaalf maanden bedragen.

      5 De verblijfsvergunning kan aan een langdurig ingezetene worden verleend in afwijking van het eerste lid, onder a.


