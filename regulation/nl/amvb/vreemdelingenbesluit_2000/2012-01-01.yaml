  - number: 5.1a
    text: |-
      1 De vreemdeling die geen rechtmatig verblijf heeft, kan in bewaring worden gesteld op grond dat het belang van de
      openbare orde of nationale veiligheid zulks vordert, indien:

      a. een risico bestaat dat de vreemdeling zich aan het toezicht zal onttrekken, of

      b. de vreemdeling de voorbereiding van het vertrek of de uitzettingsprocedure ontwijkt of belemmert.

      2 De vreemdeling kan eveneens in bewaring worden gesteld op grond dat de het belang van de openbare orde of de
      nationale veiligheid zulks vordert, indien een concreet aanknopingspunt bestaat voor een overdracht als bedoeld
      in de Verordening (EG) nr. 343/2003 van de Raad van de Europese Unie van 18 februari 2003 tot vaststelling van de
      criteria en instrumenten om te bepalen welke lidstaat verantwoordelijk is voor de behandeling van een asielverzoek
      dat door een onderdaan van een derde land bij een van de lidstaten wordt ingediend (PbEU, L 50).
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel5.1a
  - number: 5.1b
    text: |-
      1 Aan de voorwaarden voor inbewaringstelling, bedoeld in [artikel 5.1a, eerste lid][ref1], wordt voldaan indien
      de vreemdeling:

      a. Nederland niet op de voorgeschreven wijze is binnengekomen en zich in strijd met de vreemdelingenwetgeving
      gedurende enige tijd aan het toezicht op vreemdelingen heeft onttrokken;

      b. zich niet aan een of meer andere voor hem geldende verplichtingen van [hoofdstuk 4][ref2] heeft gehouden;

      c. eerder een visum, besluit, kennisgeving of aanzegging heeft ontvangen waaruit de plicht Nederland te verlaten
      blijkt en hij daaraan niet uit eigen beweging binnen de daarin besloten of gestelde termijn gevolg heeft gegeven;

      d. niet dan wel niet voldoende meewerkt aan het vaststellen van zijn identiteit en nationaliteit;

      e. meerdere aanvragen tot het verlenen van een verblijfsvergunning heeft ingediend die niet tot verlening van een
      verblijfsvergunning hebben geleid;

      f. in verband met zijn aanvraag om toelating onjuiste of tegenstrijdige gegevens heeft verstrekt met betrekking tot
      zijn identiteit, nationaliteit of de reis naar Nederland of een andere lidstaat;

      g. zich zonder noodzaak heeft ontdaan van zijn reis- of identiteitsdocumenten;

      h. in het Nederlandse rechtsverkeer gebruik heeft gemaakt van valse of vervalste documenten;

      i. geen vaste woon- of verblijfplaats heeft;

      j. niet beschikt over voldoende middelen van bestaan;

      k. arbeid heeft verricht in strijd met de [Wet arbeid vreemdelingen][ref3];

      l. verdachte is van enig misdrijf dan wel daarvoor is veroordeeld; of

      m. tot ongewenst vreemdeling is verklaard als bedoeld in [artikel 67 van de Wet][ref4] of tegen hem een
      inreisverbod is uitgevaardigd met toepassing van artikel 66a, zevende lid, van de Wet.

      2 Aan de voorwaarden voor inbewaringstelling, bedoeld in [artikel 5.1a, eerste lid][ref5], wordt niet voldaan
      indien slechts één van de feiten of omstandigheden, bedoeld in het eerste lid, van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel5.1a
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Hoofdstuk4
