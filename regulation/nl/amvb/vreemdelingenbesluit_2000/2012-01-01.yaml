  - number: 3.105e
    text: |-
      Aan de vreemdeling die aannemelijk heeft gemaakt dat zijn aanvraag is gegrond op omstandigheden die de
      rechtsgrond voor verlening, bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref1], vormen, wordt een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28 van die wet][ref2] verleend, tenzij er ernstige
      redenen zijn om aan te nemen dat:

      a. de vreemdeling een misdrijf tegen de vrede, een oorlogsmisdrijf of een misdrijf tegen de menselijkheid heeft
      gepleegd, zoals gedefinieerd in de internationale instrumenten waarmee wordt beoogd regelingen te treffen ten
      aanzien van dergelijke misdrijven;

      b. de vreemdeling een ernstig misdrijf heeft gepleegd;

      c. de vreemdeling zich schuldig heeft gemaakt aan daden die in strijd zijn met de doelstellingen en beginselen van
      de Verenigde Naties als vervat in de preambule en de artikelen 1 en 2 van het Handvest van de Verenigde Naties;

      d. de vreemdeling een gevaar vormt voor de gemeenschap of de nationale veiligheid; of

      e. de vreemdeling heeft aangezet tot of anderszins heeft deelgenomen aan de onder a tot en met c vermelde
      misdrijven of daden,

      in welk geval verlening van evenbedoelde verblijfsvergunning op voormelde grond wordt geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
