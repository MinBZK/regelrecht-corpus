      1 Bij de vaststelling of de vreemdeling beschikt over de in [artikel 3, eerste lid, onderdeel c, van de Wet][ref1]
      bedoelde middelen om te voorzien zowel in de kosten van verblijf in Nederland als in die van zijn reis naar een
      plaats buiten Nederland waar zijn toegang is gewaarborgd, kunnen middelen waarover de vreemdeling reeds beschikt en
      middelen waarover de vreemdeling kan beschikken uit wettelijk toegestane arbeid worden betrokken.

      2 Onder middelen worden in ieder geval verstaan geldelijke middelen alsmede vervoersbewijzen.

      3 Het eerste lid is niet van toepassing op de vreemdeling die rechtmatig verblijf heeft als
      bedoeld in [artikel 8, onder e, dan wel l, van de Wet][ref2], het familielid, bedoeld in
      [artikel 8.7, tweede en derde lid][ref3], en de vreemdeling, bedoeld in [artikel 8.7, vierde lid][ref4].


