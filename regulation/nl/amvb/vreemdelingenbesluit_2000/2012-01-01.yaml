        artikel: '94'
  - number: '5.7'
    text: |-
      1 De aanwijzing bedoeld in de [artikelen 57, eerste lid][ref1], en [58, eerste lid, van de Wet][ref2] wordt zoveel
      mogelijk gegeven bij de beschikking waarbij de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in
      [artikel 28 van de Wet][ref3], is afgewezen. De aanwijzing wordt met redenen omkleed.

      2 [Artikel 5.3][ref4] is van overeenkomstige toepassing indien de aanwijzing, bedoeld in het eerste lid, gegeven
      wordt bij afzonderlijke beschikking.


