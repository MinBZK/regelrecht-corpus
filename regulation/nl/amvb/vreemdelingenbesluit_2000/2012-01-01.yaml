  - number: '8.2'
    text: |-
      1 Een bestuursorgaan of een orgaan als bedoeld in [artikel 107, vijfde lid, van de Wet][ref1] verstrekt Onze
      Minister of de korpschef desgevraagd de gegevens omtrent de toekenning of de beëindiging van verstrekkingen,
      voorzieningen, uitkeringen, ontheffingen of vergunningen aan een vreemdeling, die nodig zijn voor:

      a. de verlening, de verlenging van de geldigheidsduur van, de wijziging van het verblijfsdoel van of intrekking van
      een verblijfsvergunning als bedoeld in de [artikel 8, onder a tot en met d, van de Wet][ref2];

      b. de beoordeling of aan de voorwaarden en beperkingen waaronder die verblijfsvergunning is verleend, wordt
      voldaan, of

      c. de beoordeling of een vreemdeling als gemeenschapsonderdaan rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onder e, van de Wet][ref3].

      2 Indien uit de verblijfsrechtelijke gegevens in de gemeentelijke basisadministratie persoonsgegevens, dan wel uit
      een aantekening op het bescheid, bedoeld in [artikel 9, tweede lid, van de Wet][ref4] blijkt dat het verblijfsrecht
      is toegekend onder de beperking dat een beroep op publieke middelen gevolgen kan hebben voor het verblijfsrecht,
      verstrekt een bestuursorgaan, niet zijnde een orgaan als bedoeld in [artikel 107, vijfde lid, van de Wet][ref5],
      uit eigen beweging zo spoedig mogelijk de gegevens, bedoeld in het eerste lid, die nodig zijn voor de beoordeling
      of aan deze beperking wordt voldaan.

      3 Indien uit de verblijfsrechtelijke gegevens in de gemeentelijke basisadministratie persoonsgegevens, dan
      wel uit een aantekening op het bescheid, bedoeld in [artikel 9, tweede lid, van de Wet][ref6] blijkt dat
      het verblijfsrecht is toegekend onder de beperking dat arbeid niet is toegestaan, dan wel arbeid uitsluitend
      is toegestaan bij een bepaalde werkgever, dan wel arbeid slechts is toegestaan indien de werkgever beschikt
      over een tewerkstellingsvergunning, verstrekt een bestuursorgaan, niet zijnde een orgaan als bedoeld in
      [artikel 107, vijfde lid, van de Wet][ref7], belast met de verstrekking van ontheffingen of vergunningen als
      bedoeld in de [artikelen 8.3][ref8] en [8.4][ref9], uit eigen beweging zo spoedig mogelijk de gegevens, bedoeld in
      het eerste lid die nodig zijn voor de beoordeling of aan deze beperking wordt voldaan.

      4 Onze Minister kan, in overeenstemming met Onze Minister die het aangaat, bepalen dat de gegevens, bedoeld in dit
      artikel, periodiek of in gestandaardiseerde vorm worden verstrekt.

      5 Het bestuursorgaan verstrekt de gegevens, bedoeld in het tweede en derde lid, aan Onze Minister.


