        artikel: '6.3'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '6.5'
    text: |-
      1 Tegen een vreemdeling wordt geen inreisverbod uitgevaardigd, indien een redelijke termijn als bedoeld
      in [artikel 3.82][ref1] nog niet is verstreken na afloop van het rechtmatig verblijf, bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2], of als Nederlander.

      2 Tegen een vreemdeling wordt geen inreisverbod uitgevaardigd, indien deze:

      a. als slachtoffer of getuige in aanmerking komt voor bedenktijd voor de aangifte van mensenhandel of
      mensensmokkel;

      b. als slachtoffer- of getuige-aangever in aanmerking komt voor een verblijfsvergunning als bedoeld in
      [artikel 14 van de Wet][ref3];

      c. als slachtoffer van huiselijk geweld van de persoon bij wie eerder verblijf als bedoeld in
      [artikel 8, onder a, c dan wel e of l, van de Wet][ref4] was toegestaan of als slachtoffer van eergerelateerd
      geweld in aanmerking komt voor een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref5];

      d. als echtgenoot of minderjarig kind in het land van herkomst is achtergelaten door de persoon bij wie
      eerder rechtmatig verblijf als bedoeld in [artikel 8, onder a, c dan wel e, of l, van de Wet][ref6] was
      toegestaan, en op die grond in aanmerking komt voor de verlening van een verblijfsvergunning als bedoeld in
      [artikel 14 van de Wet][ref7];

      e. in aanmerking komt voor een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref8] op grond dat hij
      buiten zijn schuld niet uit Nederland kan vertrekken;

      f. minderjarig is; of

      g. in aanmerking komt voor een verblijfsvergunning op grond van Besluit 1/80 van de Associatieraad EEG-Turkije
      betreffende de ontwikkeling van de Associatie, of niet wordt uitgezet om reden dat diens uitzetting in strijd zou
      zijn met de op 12 september 1963 te Ankara gesloten Overeenkomst waarbij een associatie tot stand wordt gebracht
      tussen de Europese Economische Gemeenschap en Turkije (Trb. 1964, 217), het op 23 november 1970 te Brussel tot
      stand gekomen Aanvullend Protocol bij die overeenkomst (Trb. 1971, 70) of genoemd Besluit nr. 1/80.

      3 Het inreisverbod wordt opgeheven, indien zich een van de gevallen, bedoeld in het tweede lid, voordoet.

      4 Van het eerste tot en met derde lid kan worden afgeweken ingeval de vreemdeling een gevaar vormt voor de openbare
      orde, de openbare veiligheid of de nationale veiligheid.

      5 Bij regeling van Onze Minister kunnen andere gevallen worden aangewezen waarin het inreisverbod om humanitaire of
      andere redenen achterwege wordt gelaten dan wel wordt opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.82
