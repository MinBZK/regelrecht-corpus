  - number: '3.54'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met wedertoelating voorts worden verleend aan de minderjarige vreemdeling, in wiens opvang en
      wettelijke vertegenwoordiging in Nederland is voorzien en die:

      a. vanaf zijn vierde levensjaar tien jaren rechtmatig in Nederland heeft verbleven als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2], of als Nederlander, of

      b. vóór indiening van de aanvraag vijf jaren rechtmatig in Nederland heeft verbleven als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref3], of als Nederlander.

      2 Het eerste lid, onder b, is alleen van toepassing voorzover Nederland naar het oordeel van Onze Minister het
      meest aangewezen land is voor de vreemdeling.

      3 De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder c, van de Wet][ref4]. De
      [artikelen 3.77][ref5] en [3.78][ref6] zijn niet van toepassing. De [artikelen 3.86][ref7] en [3.87][ref8] zijn van
      overeenkomstige toepassing.


