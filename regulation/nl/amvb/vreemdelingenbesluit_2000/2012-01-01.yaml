  - number: 3.30b
    text: |-
      1 De Europese blauwe kaart wordt verleend aan een vreemdeling als bedoeld in
      [artikel 1i van het Besluit uitvoering Wet arbeid vreemdelingen][ref1], die:

      a. beschikt over een geldige arbeidsovereenkomst of een bindend aanbod van een hooggekwalificeerde baan in de
      zin van artikel 2, onder b, van Richtlijn 2009/50/EG voor de duur van ten minste een jaar met een werkgever
      in Nederland, waarmee een bruto inkomen wordt verworven dat ten minste gelijk is aan het loon, bedoeld in
      [artikel 1i van het Besluit uitvoering Wet arbeid vreemdelingen][ref2];

      b. in Nederland arbeid verricht of gaat verrichten voor een werkgever aan wie in de periode van
      maximaal vijf jaar direct voorafgaande aan de aanvraag geen sanctie is opgelegd wegens overtreding van
      [artikel 2 van de Wet arbeid vreemdelingen][ref3] of wegens het niet of onvoldoende afdragen van loonbelasting,
      premies voor de werknemersverzekeringen of premies voor de volksverzekeringen;

      c. voor zover hij een gereglementeerd beroep in de zin van
      [artikel 1 van de Algemene wet erkenning EG-beroepskwalificaties][ref4] wil uitoefenen, beschikt over een
      erkenning van de beroepskwalificaties in de zin van [artikel 5 van die wet][ref5], dan wel, voor zover hij
      geen gereglementeerd beroep wil uitoefenen, beschikt over voor dat beroep of de desbetreffende sector benodigde
      getuigschriften van hoger onderwijs in de zin van artikel 2, onder h, van richtlijn 2009/50/EG;

      d. in het bezit is van een geldig document voor grensoverschrijding;

      e. in het bezit is van een geldige machtiging tot voorlopig verblijf, afgegeven onder een beperking
      verband houdend met verblijf als houder van de Europese blauwe kaart, dan wel behoort tot een van de in
      [artikel 17 van de Wet][ref6] of [artikel 3.71, tweede lid][ref7], bedoelde categorieën, en

      f. geen gevaar voor de openbare orde als bedoeld in de [artikelen 3.77][ref8] en [3.78][ref9] of de nationale
      veiligheid vormt.

      2 Het eerste lid is niet van toepassing ten aanzien van de vreemdeling, die:

      a. een aanvraag tot het verlenen van verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de Wet][ref10] heeft ingediend waarop nog niet onherroepelijk is beslist, dan wel houder is van een
      zodanige verblijfsvergunning;

      b. een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Wet][ref11] heeft ingediend als onderzoeker in de zin van richtlijn 2005/71/EG, waarop nog niet
      onherroepelijk is beslist;

      c. gemeenschapsonderdaan of langdurig ingezetene is;

      d. in Nederland verblijft op grond van een verdrag dat de toegang en het tijdelijk verblijf van bepaalde
      categorieën natuurlijke personen in verband met handel en investeringen gemakkelijker maken;

      e. in Nederland verblijft als seizoensarbeider of als vreemdeling die onder Richtlijn 96/71/EG van het Europees
      Parlement en de Raad van 16 december 1996 betreffende de terbeschikkingstelling van werknemers met het oog op het
      verrichten van diensten (PbEU 1997, L 18) valt en in Nederland ter beschikking is gesteld.

      3 De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder a, van de Wet][ref12], indien de
      vreemdeling:

      a. houder is van een door de autoriteiten van een andere staat die partij is bij het Verdrag betreffende de werking
      van de Europese Unie afgegeven Europese blauwe kaart, en

      b. ten minste achttien maanden in de staat, bedoeld in onderdeel a, als houder van die Europese blauwe kaart heeft
      verbleven.

      4

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de toepassing van het eerste en tweede
      lid.


