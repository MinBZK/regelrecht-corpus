  - number: '3.3'
    text: |-
      1 De termijn gedurende welke het aan vreemdelingen krachtens [artikel 12 van de Wet][ref1] is toegestaan in
      Nederland te verblijven is:

      a. voor houders van een doorreisvisum en voor vreemdelingen aan wie uitsluitend voor doorreis een bijzonder
      doorlaatbewijs is afgegeven: de tijd welke voor de voortzetting van hun reis noodzakelijk is;

      b. voor houders van een doorreisvisum met bevoegdheid tot oponthoud of van een reisvisum: de duur waarvoor
      het visum is afgegeven of verlengd dan wel, voorzover het een visum voor meer reizen betreft, de in het visum
      aangegeven duur waarvoor ononderbroken verblijf is toegestaan;

      c. voor vreemdelingen die voor een verblijf van niet langer dan drie maanden naar Nederland zijn gekomen: drie
      maanden of, in geval van verlenging door Onze Minister van de termijn wegens bijzondere omstandigheden, zes
      maanden;

      d. voor houders van een visum voor verblijf van langere duur of een verblijfstitel als bedoeld in artikel 18,
      eerste lid, onderscheidenlijk artikel 21, eerste lid, van de Schengen Uitvoeringsovereenkomst: drie maanden of, in
      geval van verlenging door Onze Minister van de termijn wegens bijzondere omstandigheden, zes maanden;

      e. voor de houder van een EG-verblijfsvergunning voor langdurig ingezetenen die is afgegeven door een andere
      staat die partij is bij het Verdrag betreffende de werking van de Europese Unie, dan wel voor de echtgenoot of het
      minderjarig kind van die houder in geval het gezin reeds was gevormd in die staat: drie maanden;

      f. voor andere vreemdelingen: acht dagen.

      2 De in het eerste lid, onder b en c, bedoelde termijn verstrijkt in geen geval later dan op de achtste dag nadat
      zich omstandigheden hebben voorgedaan, waaruit kan worden afgeleid dat de vreemdeling het voornemen heeft langer
      dan drie maanden binnen een tijdvak van zes maanden in Nederland te verblijven.

      3 In afwijking van het tweede lid verstrijkt de termijn, bedoeld in het eerste lid, onderdeel c, in geval van
      verlenging wegens bijzondere omstandigheden, niet later dan op de achtste dag nadat zich feiten of omstandigheden
      hebben voorgedaan, waaruit kan worden afgeleid dat de vreemdeling het voornemen heeft langer dan zes maanden in
      Nederland te verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel12
    url: https://wetten.overheid.nl/BWBR0011825/2012-01-01#Artikel3.3
