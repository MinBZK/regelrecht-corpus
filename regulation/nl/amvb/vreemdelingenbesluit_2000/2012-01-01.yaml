  - number: '3.4'
    text: |-
      1 De in [artikel 14, tweede lid, van de Wet][ref1] bedoelde beperkingen houden verband met:

      a. gezinshereniging of gezinsvorming;

      b. verblijf ter adoptie of als pleegkind;

      c. het afwachten van onderzoek naar de geschiktheid van de aspirant-adoptiefouders, bedoeld in
      [artikel 11 van de Wet opneming buitenlandse kinderen ter adoptie][ref2];

      d. familiebezoek;

      e. het verrichten van arbeid als zelfstandige;

      f. het verrichten van arbeid in loondienst;

      g. het verrichten van arbeid als geestelijk voorganger of godsdienstleraar;

      h. het zoeken en verrichten van arbeid al dan niet in loondienst;

      i. het zoeken van arbeid in loondienst aan boord van een Nederlands zeeschip of op een mijnbouwinstallatie op het
      continentaal plat;

      j. het doorbrengen van verlof in Nederland;

      k. het afwachten van herstel en hervatting van de arbeid in loondienst aan boord van een Nederlands zeeschip of op
      een mijnbouwinstallatie op het continentaal plat;

      l. verblijf als stagiaire of practicant;

      m. verblijf als niet-geprivilegieerd militair of niet-geprivilegieerd burgerpersoneel;

      n. het volgen van studie;

      o. de voorbereiding op studie;

      p. verblijf als au pair;

      q. verblijf in het kader van uitwisseling;

      r. het ondergaan van medische behandeling;

      s. de vervolging van mensenhandel;

      t. het afwachten van een verzoek op grond van [artikel 17 van de Rijkswet op het Nederlanderschap][ref3];

      u. voortgezet verblijf;

      v. wedertoelating;

      w. verblijf als vreemdeling die buiten zijn schuld niet uit Nederland kan vertrekken;

      x. verblijf als alleenstaande minderjarige vreemdeling;

      y. verblijf als kennismigrant als bedoeld in [artikel 1d van het Besluit uitvoering Wet arbeid vreemdelingen][ref4];

      z. werkzaamheid in het kader van grensoverschrijdende dienstverlening, als bedoeld in
      [artikel 1e van het Besluit uitvoering Wet arbeid vreemdelingen][ref5];

      aa. verblijf als economisch niet-actieve langdurig ingezetene;

      bb. verblijf als onderzoeker in de zin van richtlijn 2005/71/EG;

      cc. verblijf als houder van de Europese blauwe kaart.

      2 De beperkingen, bedoeld in het eerste lid, kunnen nader worden omschreven bij de verlening van de
      verblijfsvergunning.

      3 Tenzij het doel waarvoor de vreemdeling in Nederland wil verblijven een zodanig verband houdt met de situatie
      in het land van herkomst dat voor de beoordeling daarvan naar het oordeel van Onze Minister de indiening van een
      aanvraag als bedoeld in [artikel 28 van de Wet][ref6] noodzakelijk is, kan Onze Minister de verblijfsvergunning
      voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref7], verlenen onder een andere beperking, dan genoemd in
      het eerste lid.

      4 Een beroep op de publieke middelen kan in ieder geval gevolgen hebben voor het verblijfsrecht, indien de
      verblijfsvergunning is verleend onder één van de beperkingen, bedoeld in het eerste lid, onder a tot en met r, en
      het derde lid. Bij ministeriële regeling kunnen regels worden gesteld over deze beperkingen. Indien een beroep op
      de algemene middelen gevolgen kan hebben voor het verblijfsrecht, stelt Onze Minister de vreemdeling daarvan vooraf
      schriftelijk in kennis.

      5 Het vierde lid is mede van toepassing indien de verblijfsvergunning is verleend onder één van de beperkingen,
      bedoeld in het eerste lid, onder y tot en met cc.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
