  - number: '3.5'
    text: |-
      1 Het verblijfsrecht op grond van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 14 van de Wet][ref1], is tijdelijk of niet-tijdelijk.

      2 Het verblijfsrecht is tijdelijk, indien de verblijfsvergunning is verleend onder een beperking, verband houdend
      met:

      a. gezinsvorming of gezinshereniging met, of verblijf ter adoptie of als pleegkind bij, een persoon met tijdelijk
      verblijfsrecht of een houder van de verblijfsvergunning bedoeld in [artikel 28 van de Wet][ref2];

      b. het afwachten van onderzoek naar de geschiktheid van de aspirant-adoptiefouders, bedoeld in
      [artikel 11 van de Wet opneming buitenlandse kinderen ter adoptie][ref3];

      c. familiebezoek;

      d. het verrichten van arbeid als geestelijk voorganger of godsdienstleraar, tenzij de houder verblijfsrecht
      ontleent aan het Associatiebesluit 1/80 van de Associatieraad EEG/Turkije;

      e. het zoeken en verrichten van arbeid al dan niet in loondienst, tenzij de houder verblijfsrecht ontleent aan het
      Associatiebesluit 1/80 van de Associatieraad EEG/Turkije;

      f. het zoeken van arbeid in loondienst aan boord van een Nederlands zeeschip of op een mijnbouwinstallatie op het
      continentaal plat, tenzij de houder verblijfsrecht ontleent aan het Associatiebesluit 1/80 van de Associatieraad
      EEG/Turkije;

      g. het afwachten van herstel en hervatting van de arbeid in loondienst aan boord van een Nederlands zeeschip
      of op een mijnbouwinstallatie op het continentaal plat, tenzij de houder verblijfsrecht ontleent aan het
      Associatiebesluit 1/80 van de Associatieraad EEG/Turkije;

      h. verblijf als stagiaire of als practicant;

      i. verblijf als niet-geprivilegieerd militair of niet-geprivilegieerd burgerpersoneel;

      j. het volgen van studie;

      k. de voorbereiding op studie;

      l. verblijf als au pair;

      m. verblijf in het kader van uitwisseling;

      n. het ondergaan van medische behandeling;

      o. de vervolging van mensenhandel;

      p. het afwachten van een verzoek op grond van [artikel 17 van de Rijkswet op het Nederlanderschap][ref4];

      q. verblijf als alleenstaande minderjarige vreemdeling;

      r. verblijf als vreemdeling die buiten zijn schuld niet uit Nederland kan vertrekken; of

      s. werkzaamheid in het kader van grensoverschrijdende dienstverlening, als bedoeld in
      [artikel 1e van het Besluit uitvoering Wet arbeid vreemdelingen][ref5];

      t. het doorbrengen van verlof in Nederland.

      3 Bij regeling van Onze Minister kunnen ter uitvoering van verplichtingen die voortvloeien uit verdragen of uit
      verbindende besluiten van volkenrechtelijke organisaties, gevallen worden aangewezen waarin het verblijfsrecht, in
      afwijking van het tweede lid, niet-tijdelijk van aard is.

      4 Indien de verblijfsvergunning is verleend onder een andere beperking dan genoemd in het tweede lid, is het
      verblijfsrecht niet-tijdelijk, tenzij bij de verlening van de verblijfsvergunning anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
