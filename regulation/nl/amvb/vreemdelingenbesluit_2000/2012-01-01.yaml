    text: |-
      1 De verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20 van de Wet][ref1], wordt niet met toepassing
      van [artikel 22, eerste lid, onder a, van de Wet][ref2] ingetrokken, indien de vreemdeling:

      a. niet het hoofdverblijf buiten Nederland heeft verplaatst;

      b. aantoont dat hij langer dan zes jaar voor studie verblijft in een andere staat die partij is bij het Verdrag
      betreffende de werking van de Europese Unie; of

      c. aantoont dat hij, in geval van verblijf gedurende een aaneengesloten periode van twaalf maanden of meer
      buiten het grondgebied van de staten die partij zijn bij het Verdrag betreffende de werking van de Europese
      Unie, gedurende die periode op het grondgebied heeft verbleven van de staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte van 2 mei 1992, dan wel de Zwitserse Bondsstaat, tenzij hij langer dan
      zes jaar afwezig is geweest van het Nederlands grondgebied;

      d. voormalig houder van een Europese blauwe kaart is, dan wel het gezinslid van een voormalig houder van een
      Europese blauwe kaart is, en niet langer dan een aaneengesloten periode van 24 maanden heeft verbleven buiten
      het grondgebied van de staten die partij zijn bij het Verdrag betreffende de werking van de Europese Unie, bij de
      Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992, dan wel van de Zwitserse Bondsstaat.

      2 Indien de verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20 van de Wet][ref3],
      op frauduleuze wijze is verkregen, wordt de verblijfsvergunning ingetrokken op de in
      [artikel 22, eerste lid, onder b, van de Wet][ref4] genoemde grond, tenzij sedert de verkrijging een periode van
      twaalf jaren is verstreken, in welk geval de verblijfsvergunning wordt gewijzigd, indien daarop de aantekening «EG-
      langdurig ingezetene» was gesteld.

      3 De verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20 van de Wet][ref5], kan slechts op grond van
      [artikel 22, eerste lid, onder c, van de Wet][ref6] worden ingetrokken, indien de totale duur van de straffen of
      maatregelen ten minste gelijk is aan de toepasselijke norm, bedoeld in [artikel 3.86, tweede en vijfde lid][ref7].
      Artikel 3.86 is van overeenkomstige toepassing.

      4 Onze Minister houdt bij de toepassing van het derde lid mede rekening met de ernst van de inbreuk of het
      soort inbreuk dat door de vreemdeling op de openbare orde is gepleegd, respectievelijk met het gevaar dat van de
      vreemdeling uitgaat.

      5 Bij de toepassing van het derde lid houdt Onze Minister tevens rekening met de leeftijd van de vreemdeling, de
      gevolgen voor de vreemdeling en de leden van zijn gezin, het bestaan van banden met Nederland dan wel het ontbreken
      van banden met het land van herkomst.

      6 Indien de intrekking van de verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20 van de Wet][ref8],
      overeenkomstig het derde lid niet leidt tot verwijdering, wordt de verblijfsvergunning gewijzigd, in geval daarop
      de aantekening «EG-langdurig ingezetene» was gesteld, door die aantekening te vervangen door de aantekening «II».

      7 Bij regeling van Onze Minister kan worden bepaald dat het eerste lid, aanhef en onder d, slechts van toepassing
      is, indien de vreemdeling het in dat onderdeel bedoelde grondgebied heeft verlaten om in het land van herkomst:

      a. arbeid in loondienst of als zelfstandige, dan wel vrijwilligerswerk te verrichten;

      b. een studie te volgen.


