  - number: '3.82'
    text: |-
      1 Indien de niet-tijdig ingediende aanvraag tot het wijzigen of het verlengen van de geldigheidsduur
      van de verblijfsvergunning, bedoeld in [artikel 14 van de Wet][ref1], naar het oordeel van Onze
      Minister is ontvangen binnen een redelijke termijn nadat het rechtmatig verblijf, bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2], of als Nederlander, is geëindigd, zijn
      de [artikelen 3.71][ref3], [3.77][ref4], [3.78][ref5] en [3.79][ref6] niet van toepassing en zijn de
      [artikelen 3.86][ref7] en [3.87][ref8] van overeenkomstige toepassing.

      2 Het eerste is niet van toepassing, indien de vreemdeling:

      a. zijn hoofdverblijf buiten Nederland heeft gevestigd;

      b. onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden, terwijl die gegevens tot afwijzing van
      de oorspronkelijke aanvraag tot het verlenen of verlengen zouden hebben geleid, of

      c. in Nederland wil verblijven als geestelijk voorganger of godsdienstleraar, tenzij de houder verblijfsrecht
      ontleent aan het Associatiebesluit 1/80 van de Associatieraad EEG/Turkije.


