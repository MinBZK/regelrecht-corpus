  - number: '3.51'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking,
      verband houdend met voortgezet verblijf worden verleend aan de vreemdeling die drie jaar in Nederland verblijft als
      houder van een verblijfsvergunning onder een beperking verband houdend met:

      a. gezinshereniging of gezinsvorming met een persoon met niet-tijdelijk verblijfsrecht;

      b. het ondergaan van medische behandeling, voorzover die medische behandeling naar het oordeel van Onze Minister
      gedurende ten minste nog één jaar in Nederland noodzakelijk zal zijn;

      c. verblijf als alleenstaande minderjarige vreemdeling, of

      d. verblijf als vreemdeling die buiten zijn schuld niet uit Nederland kan vertrekken.

      2 De verblijfsvergunning kan worden verleend, indien in de in het eerste lid bedoelde periode is voldaan aan de
      voorwaarden voor het verlengen van de geldigheidsduur van de oorspronkelijke verblijfsvergunning.

      3 De verblijfsvergunning kan eveneens worden verleend, indien de relatie tussen de vreemdeling aan wie de
      verblijfsvergunning onder een beperking verband houdend met gezinsvorming of gezinshereniging, of verblijf ter
      adoptie of als pleegkind is verleend en de persoon met het niet-tijdelijke verblijfsrecht door het overlijden van
      die persoon is verbroken.

      4 De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder c, van de Wet][ref2].
      [Artikel 3.80a][ref3] is van toepassing

      5 Voor de toepassing van het eerste lid, onder a, en het derde lid, wordt onder persoon met niet-
      tijdelijk verblijfsrecht niet verstaan de houder van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28 van de Wet][ref4].

      6 De verblijfsvergunning kan eveneens worden verleend, indien de vreemdeling:

      a. onmiddellijk voorafgaand aan de indiening van de aanvraag twee jaar rechtmatig verblijf in Nederland als bedoeld
      in [artikel 8, onder a, van de Wet][ref5] heeft gehad als gezinslid van een houder van een door Onze Minister
      afgegeven Europese blauwe kaart, en

      b. op het tijdstip waarop de aanvraag is ontvangen of de beschikking wordt gegeven, als gezinslid van de in
      onderdeel a bedoelde houder van de Europese blauwe kaart ten minste vijf jaar legaal en ononderbroken verblijf
      heeft gehad op het grondgebied van een staat die partij is bij het Verdrag betreffende de werking van de Europese
      Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3.80a
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel8
