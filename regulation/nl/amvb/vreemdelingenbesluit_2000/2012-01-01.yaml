  - number: '3.56'
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met verblijf als alleenstaande minderjarige vreemdeling worden verleend aan de alleenstaande
      minderjarige vreemdeling:

      a. wiens aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 28 van de Wet][ref2] is
      afgewezen, anders dan met toepassing van [artikel 30 van de Wet][ref3];

      b. die zich naar het oordeel van Onze Minister niet zelfstandig kan handhaven in het land van herkomst of een ander
      land waar hij redelijkerwijs naar toe kan gaan, en

      c. voor wie naar het oordeel van Onze Minister, naar plaatselijke maatstaven gemeten, adequate opvang ontbreekt in
      het land van herkomst of een ander land waar hij redelijkerwijs naar toe kan gaan.

      2 [Artikel 16, eerste lid, onder d en e, van de Wet][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel16
