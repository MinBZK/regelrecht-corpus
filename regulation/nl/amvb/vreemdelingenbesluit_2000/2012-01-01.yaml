  - number: '3.68'
    text: |-
      1 In afwijking van [artikel 3.57][ref1] wordt de verblijfsvergunning onder een beperking verband houdend met
      verblijf als onderzoeker in de zin van richtlijn 2005/71/EG verleend voor de duur van het onderzoek als omschreven
      in de gastovereenkomst met een maximum van vijf jaren.

      2 In afwijking van [artikel 3.57][ref2] wordt de geldigheidsduur van de verblijfsvergunning verlengd voor de duur
      van het onderzoek, bedoeld in het eerste lid, telkens met een maximum van vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.57
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3.57
