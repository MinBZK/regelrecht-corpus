articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Benelux-onderdanen: de onderdanen van de staten die partij zijn bij het op 3 februari 1958 te 's-Gravenhage tot
      stand gekomen Verdrag tot instelling van de Benelux Economische Unie (Trb. 1958, 18);

      b. Beneluxgebied: het gezamenlijke grondgebied in Europa van het Koninkrijk België, van het Groothertogdom
      Luxemburg en van het Koninkrijk der Nederlanden;

      c. cruiseschip: hetgeen daaronder in de Schengengrenscode wordt verstaan;

      d. luchtvaartuig: hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, onder b, van de Luchtvaartwet][ref1];

      e. minderjarigheid: hetgeen daaronder wordt verstaan in [artikel 233 van Boek 1 van het Burgerlijk Wetboek][ref2];

      f.

      g. Schengengebied: het grondgebied van de staten waarop de Schengengrenscode en de Schengen Uitvoeringsovereenkomst
      van toepassing zijn;

      h. Schengen Informatiesysteem: het in titel IV van de Schengen Uitvoeringsovereenkomst bedoelde gemeenschappelijke
      informatiesysteem;

      i. Schengen Uitvoeringsovereenkomst: de op 19 juni 1990 te Schengen tot stand gekomen Overeenkomst ter uitvoering
      van het tussen de regeringen van de staten van de Benelux Economische Unie, de bondsrepubliek Duitsland en de
      Franse republiek op 14 juni 1985 te Schengen gesloten akkoord betreffende de geleidelijke afschaffing van de
      controles aan de gemeenschappelijke grenzen (Trb. 1990, 145), alsmede de daarop gebaseerde Protocollen;

      j. schip: hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, onder b, van de Scheepvaartverkeerswet][ref3];

      k. staatloze: de persoon die voor de toepassing van het op 28 september 1954 te New York gesloten verdrag
      betreffende de status van staatlozen (Trb. 1955, 42 en 1957, 22) als staatloze geldt;

      l. vliegtuig: hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, onder c, van de Luchtvaartwet][ref4];

      m.

      n. de Wet: de [Vreemdelingenwet 2000][ref5];

      o. zeeschip: hetgeen daaronder wordt verstaan in
      [artikel 1, tweede lid, onder c, van de Scheepvaartverkeerswet][ref6];

      p. mijnbouwinstallatie: hetgeen daaronder wordt verstaan in [artikel 1, onderdeel o, van de Mijnbouwwet][ref7];

      q. continentaal plat: hetgeen daaronder wordt verstaan in [artikel 1, onderdeel c, van de Mijnbouwwet][ref8];

      r. gezinsvorming: gezinshereniging van de echtgenoot, geregistreerd partner of niet-geregistreerde partner, voor
      zover de gezinsband tot stand is gekomen op een tijdstip waarop de hoofdpersoon in Nederland hoofdverblijf had;

      s. richtlijn 2005/71/EG: richtlijn 2005/71/EG van de Raad van 12 oktober 2005 betreffende een specifieke procedure
      voor de toelating van onderdanen van derde landen met het oog op wetenschappelijk onderzoek (PbEU L 289);

      t. *tewerkstellingsvergunning:* de vergunning, bedoeld in
      [artikel 1, onder e, van de Wet arbeid vreemdelingen][ref9];

      u. *richtlijn 2009/50/EG:* Richtlijn 2009/50/EG van de Raad van 25 mei 2009 betreffende de voorwaarden voor toegang
      en verblijf van onderdanen van derde landen met het oog op een hooggekwalificeerde baan (PbEU L 155);

      v. *Europese blauwe kaart:* de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref10],
      afgegeven ter uitvoering van artikel 7 van richtlijn 2009/50/EG, dan wel een door een andere staat die partij is
      bij het Verdrag betreffende de werking van de Europese Unie afgegeven verblijfsvergunning ter uitvoering van dat
      artikel.


