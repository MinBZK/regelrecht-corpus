  - number: 3.59c
    text: |-
      1 De Europese blauwe kaart wordt verleend met een geldigheidsduur tot drie maanden na afloop van de
      arbeidsovereenkomst, bedoeld in [artikel 3.30b, eerste lid, onder a][ref1], maar niet langer dan vier jaar.

      2 De verblijfsvergunning op grond van [artikel 3.23b][ref2] wordt verleend voor de duur van het verblijfsrecht van
      de houder van de Europese blauwe kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.30b
