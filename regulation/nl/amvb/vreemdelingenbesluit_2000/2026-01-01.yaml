    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.82
  - number: 3.82.2.b
    text: |-
      onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden, terwijl die gegevens tot afwijzing van de
      oorspronkelijke aanvraag tot het verlenen of verlengen zouden hebben geleid, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.82
  - number: 3.82.2.c
    text: in Nederland wil verblijven voor het verrichten van seizoenarbeid of lerend werken.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.82
  - number: '3.83'
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning regulier voor bepaalde tijd wordt
      niet op grond van [artikel 18, eerste lid, onder b, van de Wet][ref1] afgewezen, indien de vreemdeling naar het
      oordeel van Onze Minister heeft aangetoond dat hij vanwege de regering van het land waarvan hij onderdaan is, niet
      of niet meer in het bezit van een geldig document voor grensoverschrijding kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.83
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.84.1
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning regulier voor bepaalde tijd
      wordt niet op grond van [artikel 18, eerste lid, onder c, van de Wet][ref1] afgewezen om reden dat de vreemdeling
      onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden die tot afwijzing van de oorspronkelijke
      aanvraag tot het verlenen of verlengen zouden hebben geleid, indien er sedert de verlening, verlenging of wijziging
      van de verblijfsvergunning een periode van twaalf jaren is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.84
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.84.2
    text: |-
      Het eerste lid is niet van toepassing, indien de houder van de Europese blauwe kaart die kaart heeft vervalst,
      veranderd of op frauduleuze wijze heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.84
  - number: 3.85.1
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning regulier voor bepaalde tijd wordt
      niet op grond van [artikel 18, eerste lid, onder d, van de Wet][ref1] afgewezen, indien de vreemdeling en degene
      bij wie hij als gezinslid verblijft gezamenlijk zelfstandig en duurzaam beschikken over voldoende middelen van
      bestaan als bedoeld in [artikel 3.74, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.85
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.85.2
    text: |-
      De aanvraag wordt evenmin op grond van [artikel 18, eerste lid, onder d, van de Wet][ref1] afgewezen,
      indien de persoon bij wie de vreemdeling als gezinslid verblijft de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], heeft bereikt of naar het oordeel van Onze Minister
      blijvend en volledig arbeidsongeschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.85
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 3.86.1
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning regulier voor bepaalde tijd kan
      worden afgewezen op grond van [artikel 18, eerste lid, onder e, van de Wet][ref1] wegens gevaar voor de openbare
      orde, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.86.1.a
    text: |-
      de vreemdeling met een verblijfsduur korter dan drie jaar wegens een misdrijf waartegen een gevangenisstraf
      van twee jaar of meer is bedreigd, bij onherroepelijk geworden rechterlijk vonnis een gevangenisstraf
      of jeugddetentie, een taakstraf of een maatregel als bedoeld in [artikel 37a][ref1], [38m][ref2] of
      [77h, vierde lid, onder a of b, van het Wetboek van Strafrecht][ref3] is opgelegd, bij onherroepelijke
      strafbeschikking een taakstraf is opgelegd, dan wel het buitenlandse equivalent van een dergelijke straf of
      maatregel is opgelegd, en de totale duur van de onvoorwaardelijk ten uitvoer te leggen gedeelten van die straffen
      en maatregelen ten minste gelijk is aan de in het tweede lid, onderscheidenlijk derde lid, bedoelde norm;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38m
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 77h
  - number: 3.86.1.b
    text: |-
      de vreemdeling wegens een misdrijf waartegen een gevangenisstraf van drie jaar of meer is
      bedreigd, bij onherroepelijk geworden rechterlijk vonnis een gevangenisstraf of jeugddetentie,
      een taakstraf of een maatregel als bedoeld in [artikel 37a][ref1], [38m][ref2] of
      [77h, vierde lid, onder a of b, van het Wetboek van Strafrecht][ref3] is opgelegd, bij onherroepelijke
      strafbeschikking een taakstraf is opgelegd, dan wel het buitenlandse equivalent van een dergelijke straf of
      maatregel is opgelegd, en de totale duur van de onvoorwaardelijk ten uitvoer te leggen gedeelten van die straffen
      en maatregelen ten minste gelijk is aan de in het tweede lid, onderscheidenlijk derde lid, bedoelde norm.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38m
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 77h
  - number: 3.86.2
    text: |-
      De in het eerste lid bedoelde norm bedraagt bij een gevangenisstraf wegens een misdrijf waartegen een
      gevangenisstraf van zes jaar of minder is bedreigd, een verblijfsduur van:






                    minder dan 3 jaar:


                    1 dag;




                    ten minste 3 jaar, maar minder dan 4 jaar:


                    5 maanden;




                    ten minste 4 jaar, maar minder dan 5 jaar:


                    7 maanden;




                    ten minste 5 jaar, maar minder dan 6 jaar:


                    15 maanden;




                    ten minste 6 jaar, maar minder dan 7 jaar:


                    18 maanden;




                    ten minste 7 jaar, maar minder dan 8 jaar:


                    22 maanden;




                    ten minste 8 jaar, maar minder dan 9 jaar:


                    27 maanden;




                    ten minste 9 jaar, maar minder dan 10 jaar:


                    33 maanden;




                    ten minste 10 jaar, maar minder dan 15 jaar:


                    40 maanden;




                    ten minste 15 jaar:


                    65 maanden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.3
    text: |-
      De in het eerste lid bedoelde norm bedraagt bij een gevangenisstraf wegens een misdrijf waartegen een
      gevangenisstraf van meer dan zes jaar is bedreigd, bij een verblijfsduur van:






                    minder dan 3 jaar:


                    1 dag;




                    ten minste 3 jaar, maar minder dan 4 jaar:


                    4 maanden en 2 weken;




                    ten minste 4 jaar, maar minder dan 5 jaar:


                    6 maanden;




                    ten minste 5 jaar, maar minder dan 6 jaar:


                    12 maanden;




                    ten minste 6 jaar, maar minder dan 7 jaar:


                    15 maanden;




                    ten minste 7 jaar, maar minder dan 8 jaar:


                    18 maanden;




                    ten minste 8 jaar, maar minder dan 9 jaar:


                    22 maanden en 2 weken;




                    ten minste 9 jaar, maar minder dan 10 jaar:


                    27 maanden;




                    ten minste 10 jaar, maar minder dan 15 jaar:


                    30 maanden;




                    ten minste 15 jaar:


                    48 maanden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.4
    text: |-
      De aanvraag kan voorts worden afgewezen op grond van [artikel 18, eerste lid, onder e, van de Wet][ref1],
      indien de vreemdeling wegens ten minste drie misdrijven bij onherroepelijk geworden rechterlijk vonnis een
      gevangenisstraf of jeugddetentie, een taakstraf of een maatregel als bedoeld in [artikel 37a][ref2], [38m][ref3]
      of [77h, vierde lid, onder a of b, van het Wetboek van Strafrecht][ref4] is opgelegd, bij onherroepelijke
      strafbeschikking een taakstraf is opgelegd, dan wel het buitenlandse equivalent van een dergelijke straf of
      maatregel is opgelegd, en de totale duur van de onvoorwaardelijk ten uitvoer te leggen gedeelten van die straffen
      en maatregelen ten minste gelijk is aan de in het vijfde lid bedoelde norm.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 37a
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 38m
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 77h
  - number: 3.86.5
    text: |-
      De in het vierde lid bedoelde norm bedraagt bij een verblijfsduur van:






                    minder dan 3 jaar:


                    1 dag;




                    ten minste 3 jaar, maar minder dan 4 jaar:


                    4 maanden;




                    ten minste 4 jaar, maar minder dan 5 jaar:


                    5 maanden;




                    ten minste 5 jaar, maar minder dan 6 jaar:


                    6 maanden;




                    ten minste 6 jaar, maar minder dan 7 jaar:


                    7 maanden;




                    ten minste 7 jaar, maar minder dan 8 jaar:


                    8 maanden;




                    ten minste 8 jaar, maar minder dan 9 jaar:


                    9 maanden;




                    ten minste 9 jaar, maar minder dan 10 jaar:


                    10 maanden;




                    ten minste 10 jaar, maar minder dan 15 jaar:


                    12 maanden;




                    ten minste 15 jaar:


                    14 maanden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.6
    text: |-
      Voor de toepassing van de voorgaande leden wordt onder verblijfsduur verstaan: de duur van het rechtmatige
      verblijf als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1] of als Nederlander, direct
      voorafgaande aan het moment waarop het misdrijf is gepleegd of aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.86.7
    text: 'Bij de berekening van de in het tweede en vijfde lid bedoelde normen wordt betrokken:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.7.a
    text: 'indien een taakstraf is opgelegd:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.7.a.1°
    text: |-
      de duur van de vrijheidsstraf die de rechter heeft vastgesteld voor het geval de veroordeelde de taakstraf niet
      naar behoren verricht;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.7.a.2°
    text: 'voor iedere twee uren bij strafbeschikking opgelegde taakstraf: een dag vrijheidsstraf;'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.7.b
    text: |-
      indien een maatregel als bedoeld in [artikel 77h, vierde lid, onder b, van het Wetboek van Strafrecht][ref1]
      is opgelegd: de duur van de vervangende jeugddetentie die de rechter heeft vastgesteld voor het geval dat de
      veroordeelde niet naar behoren aan de tenuitvoerlegging van de maatregel heeft meegewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77h
  - number: 3.86.8
    text: |-
      Bij de toepassing van de voorgaande leden, wordt mede betrokken de buiten Nederland gepleegde of bestrafte inbreuk
      op de openbare orde, voor zover die naar Nederlands recht een misdrijf oplevert waartegen een gevangenisstraf
      van twee, onderscheidenlijk drie of zes jaren of meer is bedreigd en waarbij de strafmaat vergelijkbaar is met de
      strafmaat die in Nederland zou zijn opgelegd wanneer het feit in Nederland zou zijn gepleegd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.9
    text: |-
      In afwijking van de voorgaande leden wordt de aanvraag niet afgewezen, indien de vreemdeling minderjarig is en één
      van zijn ouders met de Nederlandse nationaliteit in Nederland is gevestigd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.10
    text: |-
      In afwijking van de voorgaande leden wordt de aanvraag niet afgewezen bij een verblijfsduur van tien jaren, tenzij
      er sprake is van:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.10.a
    text: |-
      een misdrijf als bedoeld in [artikel 22b, eerste lid, van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel22b
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 22b
  - number: 3.86.10.b
    text: |-
      een misdrijf uit de [Opiumwet][ref1] waarop naar de wettelijke omschrijving een gevangenisstraf van zes jaar of
      meer is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0001941
  - number: 3.86.11
    text: |-
      In afwijking van de voorgaande leden kan de aanvraag eveneens op grond van
      [artikel 18, eerste lid, onder e, van de Wet][ref1] worden afgewezen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.86.11.a
    text: |-
      er ernstige redenen zijn om te veronderstellen dat de vreemdeling zich schuldig heeft gemaakt aan gedragingen als
      bedoeld in artikel 1F van het Vluchtelingenverdrag;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.11.b
    text: |-
      de vreemdeling de echtgenoot of de echtgenote, het minderjarige kind, de partner of het meerderjarige kind, bedoeld
      in [artikel 29, tweede lid, onder a of b, van de Wet][ref1], is van een in Nederland verblijvende vreemdeling ten
      aanzien van wie er ernstige redenen zijn om te veronderstellen dat deze zich schuldig heeft gemaakt aan gedragingen
      als bedoeld in artikel 1F van het Vluchtelingenverdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.86.12
    text: |-
      In geval de verblijfsvergunning is verleend onder een beperking verband houdende met verblijf als familie- of
      gezinslid houdt Onze Minister bij de toepassing van de voorgaande leden in ieder geval terdege rekening met de aard
      en de hechtheid van de gezinsband van de vreemdeling, alsmede het bestaan van familiebanden of culturele of sociale
      banden met het land van herkomst.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.13
    text: |-
      In geval de aanvraag is ingediend door een vreemdeling die houder is van een EU-verblijfsvergunning voor langdurig
      ingezetenen, houdt Onze Minister bij de toepassing van de voorgaande leden mede rekening met de ernst van de
      inbreuk of het soort van inbreuk dat door de langdurig ingezetene of diens gezinslid op de openbare orde of
      nationale veiligheid is gepleegd, respectievelijk met het gevaar dat van de langdurig ingezetene of dat gezinslid
      uitgaat.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.14
    text: |-
      Bij toepassing van het dertiende lid houdt Onze Minister rekening met de leeftijd van de vreemdeling, de gevolgen
      van verblijfsbeëindiging voor de vreemdeling en zijn gezinsleden en met de banden met Nederland en het land van
      herkomst.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.15
    text: |-
      In afwijking van de voorgaande leden wordt de aanvraag niet afgewezen, indien de vreemdeling verblijfsrecht
      ontleent aan Besluit 1/80 van de Associatieraad EEG-Turkije betreffende de ontwikkeling van de Associatie, tenzij
      diens persoonlijke gedrag een actuele, werkelijke en ernstige bedreiging voor een fundamenteel belang van de
      samenleving vormt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.16
    text: |-
      Onverminderd het vijftiende lid, wordt de aanvraag niet afgewezen, indien uitzetting van de vreemdeling in strijd
      zou zijn met de op 12 september 1963 te Ankara gesloten Overeenkomst waarbij een associatie tot stand wordt
      gebracht tussen de Europese Economische Gemeenschap en Turkije (Trb. 1964, 217), het op 23 november 1970 te Brussel
      tot stand gekomen Aanvullend Protocol bij die overeenkomst (Trb. 1971, 70) of Besluit 1/80 van de Associatieraad
      EEG-Turkije betreffende de ontwikkeling van de Associatie.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.17
    text: |-
      De aanvraag wordt niet afgewezen, indien uitzetting van de vreemdeling in strijd zou zijn met artikel 8 van het
      Verdrag tot bescherming van de rechten van de mens en de fundamentele vrijheden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.18
    text: |-
      De vreemdeling van twaalf jaar of ouder ondertekent een antecedentenverklaring, waarvan het model bij ministeriële
      regeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: 3.86.19
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de toepassing van het twaalfde tot en met het
      zestiende lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.86
  - number: '3.87'
    text: |-
      Buiten de gevallen, bedoeld in [artikel 3.86][ref1], kan de aanvraag tot het verlengen van een verblijfsvergunning
      regulier voor bepaalde tijd slechts op grond van [artikel 18, eerste lid, onder e, van de Wet][ref2] worden
      afgewezen wegens gevaar voor de openbare orde, indien zwaarwegende belangen naar het oordeel van Onze Minister
      daartoe nopen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.87
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.87a.1
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning regulier voor bepaalde
      tijd die is verleend onder een beperking verband houdend met studie, kan in ieder geval op grond van
      [artikel 18, eerste lid, onder f, van de Wet][ref1] worden afgewezen, indien de houder daarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.87a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.87a.1.a
    text: |-
      niet meer studeert aan een krachtens [artikel 2c van de Wet][ref1] als referent erkende onderwijsinstelling, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.87a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
  - number: 3.87a.1.b
    text: niet overeenkomstig bij ministeriële regeling vastgestelde normen voldoende studievoortgang boekt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.87a
  - number: 3.87a.2
    text: |-
      Voor de toepassing van [artikel 18, eerste lid, onder a, van de Wet][ref1] wordt geen verplaatsing van het
      hoofdverblijf buiten Nederland aangenomen als een onderzoeker of student tijdelijk verblijft in een andere lidstaat
      van de Europese Unie in het kader van mobiliteit in de zin van richtlijn (EU) 2016/801 en de gastovereenkomst dan
      wel de inschrijving als student geldig blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.87a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.87a.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de toepassing van het eerste lid, onder a, en het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.87a
  - number: 3.89.1
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning regulier voor bepaalde tijd die
      is verleend onder een beperking verband houdend met het verrichten van arbeid in loondienst, wordt niet op grond
      van [artikel 18, eerste lid, onder f, van de Wet][ref1] afgewezen op de grond dat de vreemdeling voor een periode
      van korter dan één jaar beschikt over arbeid in loondienst waarmee voldoende zelfstandige middelen van bestaan
      worden verworven. In dat geval wordt de geldigheidsduur verlengd met een periode gelijk aan de periode waarin de
      vreemdeling beschikt over de arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.89.2
    text: |-
      De in het eerste lid bedoelde aanvraag wordt evenmin afgewezen op de grond dat niet wordt voldaan aan de beperking
      of de vreemdeling niet meer zelfstandig en duurzaam beschikt over voldoende middelen van bestaan, indien de
      vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89
  - number: 3.89.2.a
    text: volledig arbeidsongeschikt is en een arbeidsongeschiktheidsuitkering ontvangt, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89
  - number: 3.89.2.b
    text: arbeid verricht ingevolge de Wet Sociale Werkvoorziening en aanspraak heeft op een arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89
  - number: 3.89a
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning regulier voor bepaalde tijd die is
      verleend onder een beperking verband houdend met uitwisseling, studie, het verrichten van arbeid als kennismigrant
      of onderzoek in de zin van richtlijn (EU) 2016/801, wordt, indien de erkenning van de referent is geschorst
      of ingetrokken, niet op grond van [artikel 18, eerste lid, onder f, van de Wet][ref1] afgewezen, dan nadat de
      vreemdeling die te goeder trouw is gedurende een termijn van drie maanden in de gelegenheid is geweest om alsnog
      aan de beperking te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.89b.1
    text: 'De aanvraag tot het verlengen van de geldigheidsduur van de Europese blauwe kaart kan worden afgewezen, indien:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89b
  - number: 3.89b.1.a
    text: |-
      de houder niet voldoet aan de voorwaarden voor verlening van die kaart, zoals opgenomen in [artikel 3.30b][ref1],
      met uitzondering van het eerste lid, onder d, e en h;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.89b.1.b
    text: de houder niet voldoet aan de beperking waaronder de vergunning is verleend; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89b
  - number: 3.89b.1.c
    text: |-
      geen melding is gedaan als bedoeld in [artikel 4.43][ref1], tenzij het nalaten hiervan de bevoegde autoriteiten
      niet heeft bereikt om redenen waarop hij geen invloed heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.89b.2
    text: |-
      In afwijking van het eerste lid en [artikel 3.4, derde lid][ref1], wordt de aanvraag tot
      het verlengen van de geldigheidsduur van de Europese blauwe kaart niet met toepassing van
      [artikel 18, eerste lid, onder d en f van de Wet][ref2] afgewezen op de grond dat de houder werkloos is, tenzij
      deze:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.89b.2.a
    text: |-
      langer dan drie achtereenvolgende maanden werkloos is en hij minder dan twee jaar houder is van een Europese blauwe
      kaart; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89b
  - number: 3.89b.2.b
    text: |-
      langer dan zes achtereenvolgende maanden werkloos is en hij ten minste twee jaar houder is van een Europese blauwe
      kaart.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89b
  - number: 3.89b.3
    text: |-
      In afwijking van het eerste lid, wordt de aanvraag tot het verlengen van de geldigheidsduur van de Europese blauwe
      kaart niet met toepassing van [artikel 18, eerste lid, onder d en f van de Wet][ref1] afgewezen indien de houder
      tijdelijk, en in ieder geval niet langer dan twaalf maanden, niet voldoet aan deze voorwaarden als gevolg van
      ziekte, handicap of ouderschapsverlof en geen uitkering krachtens de [Participatiewet][ref2] heeft aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0015703
  - number: 3.89b.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de toepassing van het eerste, tweede en derde
      lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89b
  - number: 3.89ba.1
    text: |-
      Indien Onze Minister voornemens is de Europese blauwe kaart in te trekken of de geldigheidsduur ervan niet te
      verlengen op grond van het niet nakomen door de werkgever van zijn wettelijke verplichtingen inzake sociale
      zekerheid, belasting, arbeidsrechten of -voorwaarden of op de grond dat de arbeid niet voldoet aan de voorwaarden
      die zijn vastgelegd uit hoofde van het toepasselijke recht, in collectieve overeenkomsten of door praktijken in
      de relevante beroepssectoren voor hooggekwalificeerde banen, wordt het schriftelijk voornemen daartoe zo spoedig
      mogelijk aan de vreemdeling toegezonden of uitgereikt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89ba
  - number: 3.89ba.2
    text: |-
      Na de in het eerste lid bedoelde kennisgeving wordt de vreemdeling in de gelegenheid gesteld om binnen een termijn
      van drie maanden een nieuwe baan te zoeken.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89ba
  - number: 3.89ba.3
    text: |-
      In afwijking van het tweede lid geldt een termijn van zes maanden wanneer de houder van de Europese blauwe kaart al
      ten minste twee jaar als houder van deze Europese blauwe kaart heeft gewerkt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89ba
  - number: 3.89c.1
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning regulier voor bepaalde
      tijd onder een beperking verband houdend met seizoenarbeid, lerend werken of arbeid in loondienst, arbeid
      als kennismigrant, verblijf als houder van de Europese blauwe kaart, onderzoek in de zin van richtlijn (EU)
      2016/801 wordt niet afgewezen op de grond dat de werkgever niet krachtens [artikel 2c van de Wet][ref1]
      als referent is erkend of ten behoeve van het verblijf van de vreemdeling geen verklaring als bedoeld in
      [artikel 2a, tweede lid, van de Wet][ref2] heeft afgelegd, indien de vreemdeling de Turkse nationaliteit heeft, in
      welk geval de werkgever niet als referent wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2a
  - number: 3.89c.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de gevallen waarin de aanvraag tot het
      verlengen van de geldigheidsduur van een verblijfsvergunning regulier voor bepaalde tijd ter uitvoering van
      verdragen of besluiten van volkenrechtelijke organisaties niet wordt afgewezen om de reden dat ten behoeve van het
      verblijf van de vreemdeling geen verklaring als bedoeld in [artikel 16, eerste lid, onder k, van de Wet][ref1], is
      overgelegd. Daarbij kunnen nadere regels worden gesteld omtrent de aanwijzing als referent.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.89d
    text: |-
      Een aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning regulier voor bepaalde tijd
      wordt niet op grond van [artikel 18, eerste lid, onder i, van de Wet][ref1] afgewezen indien uitzetting van de
      vreemdeling in strijd zou zijn met artikel 8 van het Verdrag tot bescherming van de rechten van de mens en de
      fundamentele vrijheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.89d
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
  - number: 3.90.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd die is verleend onder een beperking verband houdend met verblijf
      als familie- of gezinslid, wordt niet ingetrokken op de enkele grond dat de samenwoning tijdelijk is verbroken,
      indien de vreemdeling de persoon bij wie verblijf is toegestaan wegens gewelddaden heeft verlaten.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.90
  - number: 3.90.2
    text: Het eerste lid is niet van toepassing, indien er sedert de verbreking van de samenwoning een jaar is verstreken.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.90
  - number: 3.91.1
    text: |-
      De beschikking tot intrekking van de gecombineerde vergunning treedt in werking drie maanden nadat zij is
      bekendgemaakt, tenzij de gecombineerde vergunning is ingetrokken omdat de vreemdeling een gevaar vormt voor
      de openbare orde of nationale veiligheid. In dat laatste geval treedt de beschikking tot intrekking van de
      gecombineerde vergunning in werking met ingang van de dag nadat zij is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.91
  - number: 3.91.2
    text: |-
      Gelijktijdig met de beschikking tot intrekking bedoeld in het eerste lid, eerste zin, vervangt Onze Minister
      het oude aanvullend document door een nieuw aanvullend document waarin wordt vermeld dat drie maanden kan worden
      gezocht naar arbeid in loondienst.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.91
  - number: 3.91a
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd die is verleend onder een beperking verband houdend
      met uitwisseling, studie, het verrichten van arbeid als kennismigrant of onderzoek in de zin van richtlijn
      (EU) 2016/801, wordt, indien de erkenning van de referent is geschorst of ingetrokken, niet op grond van
      [artikel 19 van de Wet][ref1], in samenhang met [artikel 18, eerste lid, onder f, van de Wet][ref2], ingetrokken,
      dan nadat de vreemdeling die te goeder trouw is gedurende drie maanden in de gelegenheid is geweest om alsnog aan
      de beperking te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
