    text: |-
      te voldoen aan de inburgeringsplicht als bedoeld in [artikel 6, eerste lid, van de Wet inburgering 2021][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel6
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.96a
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '6'
  - number: 3.96a.3.b
    text: |-
      een diploma, certificaat of ander document als bedoeld in
      [artikel 4, eerste lid, onderdeel a, van de Wet inburgering 2021][ref1] te behalen;


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.96a
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '4'
  - number: 3.96a.3.c
    text: |-
      het examen, bedoeld in [artikel 7, eerste lid, onderdeel a, van de Wet inburgering][ref1] te behalen; of


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.96a
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
  - number: 3.96a.3.d
    text: |-
      een diploma, certificaat of ander document als bedoeld in
      [artikel 5, eerste lid, onderdeel c, van de Wet inburgering][ref1], te behalen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.96a
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '5'
  - number: 3.96a.4
    text: |-
      Onze Minister kan het eerste lid voorts buiten toepassing laten, voorzover toepassing daarvan naar zijn oordeel zal
      leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.96a
  - number: 3.96a.5
    text: |-
      Onze Minister kan het eerste lid voorts buiten toepassing laten, indien hij van oordeel is dat de vreemdeling
      aantoonbaar voldoende is ingeburgerd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.96a
  - number: 3.96a.6
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de toepassing van het tweede lid, onder e, het derde
      lid en het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.96a
  - number: '3.97'
    text: |-
      De verblijfsvergunning regulier voor onbepaalde tijd wordt niet ingetrokken op de in
      [artikel 22, tweede lid, onder b, van de Wet][ref1] genoemde grond dat de vreemdeling onjuiste gegevens heeft
      verstrekt dan wel gegevens heeft achtergehouden die tot afwijzing van de oorspronkelijke aanvraag tot het verlenen,
      verlengen of wijzigen zouden hebben geleid, indien sedert de verlening, de verlenging of de wijziging een periode
      van twaalf jaren is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel22
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.97
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '22'
  - number: 3.98.1
    text: |-
      De verblijfsvergunning regulier voor onbepaalde tijd kan op grond van
      [artikel 22, tweede lid, onder c, van de Wet][ref1] worden ingetrokken, indien de vreemdeling wegens een misdrijf
      waartegen een gevangenisstraf van drie jaren of meer is bedreigd bij onherroepelijk geworden rechterlijk vonnis een
      gevangenisstraf, een taakstraf of de maatregel, bedoeld in [artikel 37a van het Wetboek van Strafrecht][ref2], dan
      wel het buitenlands equivalent daarvan, is opgelegd, en de totale duur van de straffen of maatregelen ten minste
      gelijk is aan de norm, bedoeld in [artikel 3.86, tweede, derde dan wel vijfde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 37a
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.98.2
    text: |-
      De [artikelen 3.86][ref1] en [3.87][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.98a.1
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid stelt het basisexamen inburgering ter
      beoordeling van de kennis van de Nederlandse taal en van de Nederlandse maatschappij als bedoeld in
      [artikel 16, eerste lid, onder h, van de Wet][ref1], vast door middel van een geautomatiseerd systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.98a.2
    text: |-
      Het basisexamen inburgering omvat een onderzoek naar de Nederlandse lees-, luister- en spreekvaardigheid van de
      vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98a.3
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid stelt een examenprogramma vast voor de vereiste lees-, luister-
      en spreekvaardigheid. Dit examenprogramma strekt tot waarborg dat de vreemdeling die het basisexamen inburgering
      met goed gevolg heeft afgelegd, beschikt over de volgende vaardigheden in de Nederlandse taal op het niveau A1 van
      het Europees Raamwerk voor Moderne Vreemde Talen:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98a.3.a
    text: leesvaardigheid;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98a.3.b
    text: luistervaardigheid, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98a.3.c
    text: spreekvaardigheid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98a.4
    text: |-
      De normering van de onderdelen lees-, luister- en spreekvaardigheid van het basisexamen inburgering wordt
      gerelateerd aan een van de niveaus van het Europees Raamwerk voor Moderne Vreemde Talen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98a.5
    text: Het basisexamen inburgering omvat tevens een onderzoek naar de kennis van de Nederlandse samenleving.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98a.6
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid stelt een examenprogramma vast voor de vereiste kennis van de
      Nederlandse samenleving. Dit examenprogramma waarborgt dat de vreemdeling die het basisexamen inburgering met goed
      gevolg heeft afgelegd, beschikt over elementaire praktische kennis van:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98a.6.a
    text: Nederland, waaronder topografie, geschiedenis en staatsinrichting;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98a.6.b
    text: huisvesting, onderwijs, arbeid, gezondheidszorg en inburgering in Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98a.6.c
    text: zijn rechten en zijn verplichtingen na aankomst in Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98a.6.d
    text: rechten en verplichtingen van anderen in Nederland, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98a.6.e
    text: in Nederland gangbare omgangsregels.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98a.7
    text: |-
      Het basisexamen inburgering wordt afgelegd in de Nederlandse taal op een niveau dat niet hoger is dan het niveau,
      bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98a.8
    text: |-
      De examenprogramma’s, bedoeld in het derde en zesde lid, worden overeenkomstig door Onze Minister van Sociale
      Zaken en Werkgelegenheid te stellen regels en tegen een door Onze Minister van Sociale Zaken en Werkgelegenheid te
      stellen bedrag beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98a
  - number: 3.98b.1
    text: 'Tot het basisexamen inburgering wordt niet toegelaten de vreemdeling die:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98b
  - number: 3.98b.1.a
    text: |-
      niet overeenkomstig door Onze Minister van Sociale Zaken en Werkgelegenheid te stellen regels de aan het
      basisexamen verbonden kosten heeft voldaan dan wel via een ander heeft zorg gedragen voor het voldoen van die
      kosten, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98b
  - number: 3.98b.1.b
    text: geen medewerking heeft verleend aan het vastleggen van gegevens met het oog op zijn identificatie.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98b
  - number: 3.98b.2
    text: Bij ministeriële regeling worden de kosten bepaald, bedoeld in het eerste lid, onder a.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98b
  - number: 3.98b.3
    text: |-
      De medewerking, bedoeld in het eerste lid, onder b, bestaat uit het overleggen van een pasfoto, het digitaal laten
      afnemen van vingerafdrukken en het laten maken van een scan of kopie van het paspoort of, indien de vreemdeling
      door de autoriteiten van het land waarvan hij onderdaan is, niet in het bezit kan worden gesteld van een paspoort,
      een ander identiteitsbewijs.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98b
  - number: 3.98b.4
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid stelt een examenreglement vast. Het examenreglement bevat in elk
      geval bepalingen omtrent:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98b
  - number: 3.98b.4.a
    text: de gang van zaken tijdens het basisexamen inburgering;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98b
  - number: 3.98b.4.b
    text: de maatregelen om onregelmatigheden en ordeverstoring tijdens het basisexamen inburgering te voorkomen, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98b
  - number: 3.98b.4.c
    text: de maatregelen die in geval van onregelmatigheden of ordeverstoring kunnen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98b
  - number: 3.98c.1
    text: |-
      Het basisexamen inburgering wordt onder toezicht van een door het hoofd van de Nederlandse diplomatieke of
      consulaire vertegenwoordiging aan te wijzen ambtenaar, medewerker, autoriteit of instelling afgelegd op een door
      dat hoofd vast te stellen tijdstip en in een door dat hoofd aan te wijzen ruimte.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98c
  - number: 3.98c.2
    text: |-
      Het basisexamen inburgering wordt afgelegd door middel van een telefonische of digitale verbinding met een
      geautomatiseerd systeem, dat door een door Onze Minister van Sociale Zaken en Werkgelegenheid aan te wijzen
      instantie volgens door Onze Minister van Sociale Zaken en Werkgelegenheid te stellen regels wordt beheerd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98c
  - number: 3.98c.3
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid beoordeelt de resultaten van het basisexamen inburgering
      door middel van het geautomatiseerde systeem, bedoeld in het tweede lid, met uitzondering van het onderdeel
      spreekvaardigheid, dat wordt beoordeeld door beoordelaars.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98c
  - number: 3.98c.4
    text: |-
      Het resultaat van het basisexamen inburgering wordt in de gevallen waarin Onze Minister van Sociale Zaken en
      Werkgelegenheid niet door middel van het geautomatiseerde systeem, bedoeld in het tweede lid, tot een beoordeling
      daarvan heeft kunnen komen, alsmede in het in [artikel 3.98d, derde lid][ref1], bedoelde geval, beoordeeld door
      examinatoren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98c
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 3.98d.1
    text: De resultaten van het basisexamen inburgering worden niet heroverwogen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98d
  - number: 3.98d.2
    text: |-
      Onverminderd [artikel 3.98b][ref1], kan de vreemdeling die het basisexamen inburgering niet met goed gevolg heeft
      afgelegd, het examen te allen tijde opnieuw afleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 3.98d.3
    text: |-
      In afwijking van het eerste lid kan de betrokken examenkandidaat binnen zes weken na de bekendmaking van de
      beoordeling een herbeoordeling aanvragen van het onderdeel waarin luistervaardigheid en spreekvaardigheid is
      getoetst door door Onze Minister van Sociale Zaken en Werkgelegenheid aan te wijzen beoordelaars nadat de uitslag
      van dat onderdeel voor de vierde maal of vaker «niet geslaagd» heeft geluid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.98d
  - number: 3.99.1
    text: |-
      De aanvraag tot het verlenen, wijzigen of verlengen van een verblijfsvergunning regulier voor bepaalde tijd wordt
      ingediend door de vreemdeling, zijn wettelijk vertegenwoordiger of zijn erkende referent, indien de vreemdeling
      in Nederland verblijft of wil verblijven in het kader van uitwisseling of studie, dan wel voor het verrichten van
      arbeid als kennismigrant of onderzoek in de zin van richtlijn (EU) 2016/801.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.99
  - number: 3.99.2
    text: |-
      Ongeacht het doel waarvoor de vreemdeling in Nederland wil verblijven, wordt de aanvraag tot het verlenen, wijzigen
      of verlengen van een verblijfsvergunning regulier voor bepaalde tijd, zo nodig in afwijking van het eerste lid,
      ingediend door de vreemdeling of diens wettelijk vertegenwoordiger in persoon:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.99
  - number: 3.99.2.a
    text: |-
      indien de vreemdeling niet in het bezit is van een geldige machtiging tot voorlopig verblijf die overeenkomt
      met het doel waarvoor de vreemdeling in Nederland wil verblijven en evenmin behoort tot een van de in
      [artikel 17 van de Wet][ref1] of [artikel 3.71, tweede lid][ref2], bedoelde categorieën;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.99
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.99.2.b
    text: in de bij ministeriële regeling te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.99
  - number: 3.99.3
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de aanvraag van een vreemdeling als bedoeld in het eerste lid
      wordt ingediend door tussenkomst van de erkende referent.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.99
  - number: 3.99a
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de gevallen waarin de vreemdeling of diens wettelijk
      vertegenwoordiger in persoon dient te verschijnen teneinde te voldoen aan bepaalde voorwaarden voor verlening van
      een verblijfsvergunning, indien het een aanvraag betreft tot:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.99a
  - number: 3.99a.a
    text: |-
      het verlenen van een verblijfsvergunning op de grond dat de uitzetting van de vreemdeling in strijd is met artikel
      8 van het Verdrag tot bescherming van de rechten van de mens en de fundamentele vrijheden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.99a
  - number: 3.99a.b
    text: |-
      het verlenen van een verblijfsvergunning onder een beperking verband houdend met medische behandeling als bedoeld
      in [artikel 3.46][ref1], dan wel het wijzigen van een verblijfsvergunning regulier voor bepaalde tijd in een
      verblijfsvergunning met dat doel; of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.99a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.99a.c
    text: |-
      het verlenen van een verblijfsvergunning onder een beperking verband houdend met tijdelijke humanitaire gronden als
      bedoeld in [artikel 3.48, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.99a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.99b
    text: |-
      Indien een volledige aanvraag voor een verblijf als familie- of gezinslid bij een houder van een Europese blauwe
      kaart gelijktijdig wordt ingediend met de aanvraag voor een Europese blauwe kaart, worden de besluiten over de
      aanvragen gelijktijdig bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.99b
  - number: '3.100'
    text: |-
      Indien de vreemdeling, hangende de besluitvorming op een eerdere aanvraag, wijziging van het gevraagde
      verblijfsdoel wenst, dient hij een nieuwe aanvraag in.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.100
  - number: 3.101.1
    text: |-
      een aanvraag tot het verlenen, wijzigen of verlengen van een verblijfsvergunning regulier voor bepaalde tijd of een
      aanvraag tot het verlenen van een verblijfsvergunning regulier voor onbepaalde tijd of een EU-verblijfsvergunning
      voor langdurig ingezetenen, wordt ingediend op een door Onze Minister aan te wijzen plaats.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.101
  - number: 3.101.2
    text: |-
      In afwijking van het eerste lid wordt, indien de vreemdeling rechtens de vrijheid is ontnomen, de aanvraag
      ingediend op de plaats waar de vrijheidsontneming ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.101
  - number: 3.101a.1
    text: |-
      Indien de eerste aanvraag tot het verlenen van een verblijfsvergunning regulier voor bepaalde tijd is afgewezen,
      wordt iedere daarop volgende aanvraag tot het verlenen van een dergelijke verblijfsvergunning voor hetzelfde
      verblijfsdoel aangemerkt als een tweede of volgende aanvraag in de zin van de [rijen A75, A76, A77, A78, A79 en A80
      van de bijlage bij het Besluit vergoedingen rechtsbijstand 2000](onbekend).
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.101a
  - number: 3.101a.2
    text: |-
      Indien na afwijzing van een aanvraag tot het verlenen van een verblijfsvergunning regulier voor bepaalde tijd
      ambtshalve een verblijfsvergunning is verleend op een van de gronden, bedoeld in [artikel 3.6, eerste lid][ref1],
      dan wel na toetsing aan de gronden, bedoeld in [artikel 3.6, eerste lid][ref2], niet ambtshalve een
      verblijfsvergunning is verleend, wordt iedere daarop volgende aanvraag tot het verlenen van een verblijfsvergunning
      regulier voor bepaalde tijd op een van die gronden aangemerkt als een tweede of volgende aanvraag in de zin van de
      [rijen A75, A76, A77, A78, A79 en A80 van de bijlage bij het Besluit vergoedingen rechtsbijstand 2000](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.101a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.101a.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing, indien na intrekking van een verblijfsvergunning regulier voor
      bepaalde tijd onderscheidenlijk bij afwijzing van een aanvraag tot het verlengen van de geldigheidsduur ervan,
      ambtshalve een verblijfsvergunning is verleend op een van de gronden, bedoeld in [artikel 3.6, eerste lid][ref1],
      dan wel na toetsing aan de gronden, bedoeld in artikel 3.6, eerste lid, niet ambtshalve een verblijfsvergunning
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.101a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.101b.1
    text: |-
      Indien na afwijzing van de eerste aanvraag tot het verlenen van een verblijfsvergunning asiel voor bepaalde tijd
      ambtshalve een verblijfsvergunning is verleend op een van de gronden, bedoeld in [artikel 3.6a, eerste lid][ref1],
      dan wel na toetsing aan de gronden, bedoeld in artikel 3.6a, eerste lid, niet ambtshalve een verblijfsvergunning is
      verleend, wordt iedere daarop volgende aanvraag tot het verlenen van een verblijfsvergunning regulier voor bepaalde
      tijd op een van die gronden aangemerkt als een tweede of volgende aanvraag in de zin van de [rijen A75, A76, A77,
      A78, A79 en A80 van de bijlage bij het Besluit vergoedingen rechtsbijstand 2000](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.101b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.101b.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien na intrekking van een verblijfsvergunning asiel voor
      bepaalde tijd onderscheidenlijk bij afwijzing van een aanvraag tot het verlengen van de geldigheidsduur ervan,
      ambtshalve een verblijfsvergunning is verleend op een van de gronden, bedoeld in [artikel 3.6a, eerste lid][ref1],
      dan wel na toetsing aan de gronden, bedoeld in artikel 3.6a, eerste lid, niet ambtshalve een verblijfsvergunning
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.101b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.102.1
    text: |-
      Onverminderd [artikel 24a, eerste lid, onder a, van de Wet][ref1] legt de vreemdeling bij de in persoon ingediende
      aanvraag in ieder geval over een geldig document voor grensoverschrijding, en, voor zover redelijkerwijs mogelijk,
      de gegevens en bescheiden op basis waarvan kan worden vastgesteld dat wordt voldaan aan de voorwaarden voor de
      verlening, wijziging of verlenging van de verblijfsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel24a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 24a
  - number: 3.102.2
    text: |-
      In afwijking van het eerste lid, legt de vreemdeling die niet beschikt over een geldig document voor
      grensoverschrijding, voor zover redelijkerwijs mogelijk, gegevens en bescheiden over waarmee wordt aangetoond
      dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van een geldig
      document voor grensoverschrijding kan worden gesteld. In dat geval legt hij tevens aanvullende gegevens of
      bescheiden over omtrent zijn identiteit en nationaliteit.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102
  - number: 3.102.3
    text: |-
      Bij de niet in persoon ingediende aanvraag legt de vreemdeling afschriften over van de in het eerste en tweede lid
      genoemde gegevens en bescheiden en legt hij op verzoek van Onze Minister de originelen over.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102
  - number: 3.102.4
    text: |-
      Onverminderd [artikel 24a van de Wet][ref1] is het derde lid van overeenkomstige toepassing, indien de aanvraag is
      ingediend door de referent, met dien verstande dat voor «de vreemdeling» wordt gelezen: de referent.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel24a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 24a
  - number: 3.102.5
    text: |-
      Desgevraagd bevestigt de aanvrager binnen een door Onze Minister te stellen termijn de juistheid van de gegevens,
      bedoeld in [artikel 24a, eerste lid, onder a, van de Wet][ref1], dan wel geeft hij gemotiveerd en onder overlegging
      van de terzake relevante gegevens en bescheiden aan welke gegevens de juiste gegevens zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel24a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 24a
  - number: 3.102.6
    text: Onze Minister kan nadere regels stellen omtrent de in het eerste lid bedoelde gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102
  - number: 3.102a
    text: |-
      De medewerking van de vreemdeling, bedoeld in [artikel 24, eerste lid, onderdeel b, van de Wet][ref1], bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel24
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '24'
  - number: 3.102a.a
    text: het op vordering van Onze Minister beschikbaar stellen van een goedgelijkende pasfoto, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102a
  - number: 3.102a.b
    text: het zich laten fotograferen en het laten afnemen van vingerafdrukken.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102a
  - number: 3.102b.1
    text: |-
      De vreemdeling legt bij de aanvraag ten minste de voor de beslissing van Onze Minister relevante medische gegevens
      en overige bescheiden over, indien:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102b
  - number: 3.102b.1.a
    text: |-
      het een aanvraag betreft tot het verlenen van een verblijfsvergunning regulier voor bepaalde tijd onder een
      beperking verband houdend met medische behandeling als bedoeld in [artikel 3.46][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.102b.1.b
    text: |-
      het een aanvraag betreft tot het wijzigen van een verblijfsvergunning regulier voor bepaalde tijd in
      een verblijfsvergunning onder een beperking verband houdend met medische behandeling als bedoeld in
      [artikel 3.46][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.102b.1.c
    text: |-
      de vreemdeling een beroep doet op medische redenen om vrijgesteld te worden van het vereiste van een geldige
      machtiging tot voorlopig verblijf.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102b
  - number: 3.102b.2
    text: |-
      De vreemdeling legt bij de aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning
      regulier voor bepaalde tijd onder een beperking verband houdend met medische behandeling als bedoeld in
      [artikel 3.46][ref1], ten minste de voor de beslissing van Onze Minister relevante medische gegevens en overige
      bescheiden over.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.102b.3
    text: |-
      De vreemdeling legt bij de aanvraag tot het verlenen van een verblijfsvergunning regulier
      voor bepaalde tijd die verband houdt met niet-tijdelijke humanitaire gronden als bedoeld in
      [artikel 3.51, eerste lid, onderdeel a, ten tweede, dan wel onderdeel b][ref1], ten minste de voor de beslissing
      van Onze Minister relevante medische gegevens en overige bescheiden over.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.102b.4
    text: |-
      Indien de vreemdeling zich in verband met de intrekking van zijn verblijfsvergunning of in een bezwaarprocedure
      kan beroepen op medische gronden, legt hij, indien hij daartoe overgaat, ten minste de voor de beslissing van Onze
      Minister relevante medische gegevens en overige bescheiden over.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102b
  - number: 3.102b.5
    text: |-
      Dit artikel blijft buiten toepassing ten aanzien van de bij ministeriële regeling aan te wijzen categorieën van
      vreemdelingen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.102b
  - number: '3.103'
    text: |-
      De aanvraag wordt getoetst aan het recht dat gold op het tijdstip waarop de aanvraag is ontvangen, tenzij uit deWet
      anders voortvloeit of het recht dat geldt op het tijdstip waarop de beschikking wordt gegeven, voor de vreemdeling
      gunstiger is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103
  - number: 3.103a.1
    text: |-
      Indien Onze Minister een verblijfsvergunning regulier voor bepaalde tijd verleent aan of verlengt van een
      vreemdeling die houder is van een EU-verblijfsvergunning voor langdurig ingezetenen, afgegeven door een andere
      lidstaat van de Europese Unie, doet hij daarvan mededeling aan de autoriteiten van die staat.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103a
  - number: 3.103a.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien Onze Minister besluit de verblijfsvergunning van de in het
      eerste lid bedoelde houder in te trekken of niet te verlengen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103a
  - number: 3.103a.3
    text: |-
      Indien Onze Minister overweegt een vreemdeling die houder is als bedoeld in het eerste lid, uit te zetten naar een
      staat die geen lidstaat is van de Europese Unie, raadpleegt hij de autoriteiten van de staat, bedoeld in het eerste
      lid. Indien Onze Minister dienovereenkomstig besluit uit te zetten, verstrekt hij die autoriteiten alle nodige
      informatie met betrekking tot de uitzetting.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103a
  - number: 3.103a.4
    text: |-
      Indien Onze Minister beslist op een aanvraag tot het verlenen van een Europese blauwe kaart ten behoeve van een
      vreemdeling die door een andere lidstaat van de Europese Unie reeds in het bezit is gesteld van een Europese blauwe
      kaart, doet hij daarvan uiterlijk binnen 30 dagen mededeling aan de autoriteiten van die staat. Deze termijn kan
      in bijzondere gevallen verband houdende met de complexiteit van de aanvraag, voor ten hoogste 30 dagen worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103a
  - number: 3.103a.5
    text: |-
      Indien Onze Minister een verblijfsvergunning regulier voor bepaalde tijd onder de beperking «overplaatsing binnen
      een onderneming» verleent aan een vreemdeling in het kader van langetermijnmobiliteit in de zin van artikel 22 van
      [richtlijn 2014/66](32014L0066)/EU, doet hij daarvan mededeling bij de bevoegde instanties van de lidstaat die als
      eerste een verblijfsvergunning heeft afgegeven voor de binnen een onderneming overgeplaatste persoon.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103a
  - number: 3.103a.6
    text: |-
      Indien Onze Minister een verblijfsvergunning regulier voor bepaalde tijd onder de beperking onderzoek in de
      zin van richtlijn (EU) 2016/801 verleent in het kader van langetermijnmobiliteit in de zin van artikel 29 van
      richtlijn (EU) 2016/801, doet hij daarvan mededeling bij de bevoegde instanties van de lidstaat die als eerste een
      verblijfsvergunning heeft afgegeven voor de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103a
  - number: 3.103aa.1
    text: |-
      Indien Onze Minister besluit tot intrekking van een verblijfsvergunning regulier voor bepaalde tijd of afwijzing
      van een aanvraag om verlenging van de geldigheidsduur daarvan van een houder van een EU-verblijfsvergunning voor
      langdurig ingezetenen, afgegeven door een andere lidstaat van de Europese Unie, met de aantekening dat die staat
      de vreemdeling internationale bescherming heeft verleend, verzoekt Onze Minister die staat te bevestigen of de
      vreemdeling aldaar nog steeds internationale bescherming geniet. In het bevestigend geval zet Onze Minister de
      vreemdeling uit naar die staat, onverminderd het toepasselijke Unierecht en het beginsel van de eenheid van het
      gezin.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103aa
  - number: 3.103aa.2
    text: |-
      In afwijking van het eerste lid en onverminderd de voor Nederland geldende internationale verplichtingen, kan Onze
      Minister de langdurig ingezetene uitzetten naar een andere staat dan de lidstaat die de internationale bescherming
      heeft verleend, indien is voldaan aan [artikel 3.105c, tweede lid, onder a of b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103aa
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 3.103aa.3
    text: |-
      Indien de verblijfsvergunning regulier voor bepaalde tijd van een vreemdeling die houder is van een door een
      andere lidstaat van de Europese Unie afgegeven EU-verblijfsvergunning voor langdurig ingezetenen die de aantekening
      bevat dat die staat verantwoordelijk is voor de internationale bescherming van de vreemdeling, is ingetrokken of
      de aanvraag tot verlenging van de geldigheidsduur ervan is afgewezen, op grond dat de vreemdeling een bedreiging
      voor de openbare orde of de openbare veiligheid vormt, kan de vreemdeling, onverminderd de terugnameverplichting
      van de andere lidstaat en onverminderd de voor Nederland geldende internationale verplichtingen slechts van het
      grondgebied van de Europese Unie worden verwijderd, indien:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103aa
  - number: 3.103aa.3.a
    text: de internationale bescherming inmiddels is ingetrokken, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103aa
  - number: 3.103aa.3.b
    text: |-
      is voldaan aan [artikel 3.105c, tweede lid, onder a of b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103aa
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 3.103aa.4
    text: |-
      Indien Onze Minister besluit tot intrekking van een verblijfsvergunning regulier voor bepaalde tijd onder de
      beperking «overplaatsing binnen een onderneming» en de vreemdeling in een tweede lidstaat verblijfsrecht geniet in
      het kader van mobiliteit in de zin van artikel 21 of 22 van [richtlijn 2014/66](32014L0066)/EU, doet Onze Minister
      van die intrekking onmiddellijk mededeling bij de bevoegde instanties van de lidstaat van het tweede verblijf.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103aa
  - number: 3.103aa.5
    text: |-
      Indien Onze Minister besluit tot intrekking van een verblijfsvergunning regulier voor bepaalde tijd onder de
      beperking onderzoek in de zin van richtlijn (EU) 2016/801 of studie, doet Onze Minister in voorkomende gevallen
      van die intrekking onmiddellijk mededeling bij de bevoegde instanties van de lidstaat waar de vreemdeling
      verblijfsrecht geniet in het kader van mobiliteit in de zin van richtlijn (EU) 2016/801.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103aa
  - number: 3.103ab.1
    text: |-
      Indien Onze Minister besluit tot intrekking van een verblijfsvergunning regulier voor bepaalde tijd van een houder
      van een Europese blauwe kaart met de aantekening dat de vreemdeling internationale bescherming geniet door een
      andere lidstaat van de Europese Unie of een aanvraag om verlenging van de geldigheidsduur daarvan afwijst, verzoekt
      Onze Minister die staat te bevestigen of de vreemdeling aldaar nog steeds internationale bescherming geniet. In het
      bevestigend geval zet Onze Minister de vreemdeling uit naar die staat, onverminderd het toepasselijke Unierecht en
      het beginsel van de eenheid van het gezin.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103ab
  - number: 3.103ab.2
    text: |-
      In afwijking van het eerste lid en onverminderd de voor Nederland geldende internationale verplichtingen, kan
      Onze Minister de houder van de Europese blauwe kaart uitzetten naar een andere staat dan de lidstaat die de
      internationale bescherming heeft verleend, indien is voldaan aan de voorwaarden van artikel 21, tweede lid, van
      de Kwalificatierichtlijn.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103ab
  - number: 3.103b.1
    text: |-
      Indien Onze Minister een inreisverbod uitvaardigt, registreert Onze Minister dit inreisverbod in het Schengen
      Informatiesysteem.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103b
  - number: 3.103b.2
    text: |-
      Indien Onze Minister overweegt een vreemdeling die houder is van een verblijfstitel of andere toestemming tot
      verblijf, afgegeven door een andere staat als bedoeld in [artikel 1.3][ref1], uit te zetten naar de staat waarvan
      de vreemdeling de nationaliteit bezit of bij het ontbreken van een nationaliteit naar de staat van zijn vroegere
      verblijfplaats, wint Onze Minister de nodige informatie in bij de autoriteiten van die andere staat. Indien Onze
      Minister besluit de vreemdeling uit te zetten, verstrekt hij de autoriteiten van die andere staat alle nodige
      informatie met betrekking tot de uitzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel1
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: 3.103b.3
    text: |-
      Onze Minister vormt het contactpunt ter uitvoering van de Richtlijn 2008/115/EG van het Europees Parlement en
      de Raad van 16 december 2008 over gemeenschappelijke normen en procedures in de lidstaten voor de terugkeer van
      onderdanen van derde landen die illegaal op hun grondgebied verblijven en is verantwoordelijk voor het inwinnen en
      verstrekken van de informatie, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.103b
  - number: 3.104.1
    text: |-
      De beschikking, waarbij de aanvraag tot het verlenen, het wijzigen of het verlengen van de geldigheidsduur van
      een verblijfsvergunning als bedoeld in [artikel 8, onder a of b, van de Wet][ref1], geheel of gedeeltelijk wordt
      ingewilligd, of waarbij de verblijfsvergunning ambtshalve wordt verleend of gewijzigd, wordt bekendgemaakt door
      uitreiking van het document, bedoeld in [artikel 9, eerste lid, van de Wet][ref2], waaruit het rechtmatig verblijf
      op grond van artikel 8, onder a onderscheidenlijk onder b, van de Wet blijkt. De referent die de aanvraag heeft
      ingediend, wordt onverwijld in kennis gesteld van de bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 3.104.2
    text: |-
      In afwijking van het eerste lid, kan de beschikking bekend worden gemaakt door toezending van het in het eerste lid
      bedoelde document:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.104
  - number: 3.104.2.a
    text: indien uitreiking om technische redenen, verband houdend met het aanmaken van het document, niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.104
  - number: 3.104.2.b
    text: in andere bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.104
  - number: 3.104.3
    text: |-
      Indien de vreemdeling, niet zijnde gemeenschapsonderdaan, in aanmerking komt voor meer dan één verblijfsdocument
      wordt één document uitgereikt of toegezonden en worden de overige beschikkingen bekendgemaakt door het stellen van
      een aantekening op dat document.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.104
  - number: 3.104.4
    text: |-
      De beschikking ten aanzien van een zich in het buitenland bevindende vreemdeling, waarbij de aanvraag tot het
      verlenen, het wijzigen of het verlengen van de geldigheidsduur van een verblijfsvergunning geheel of gedeeltelijk
      wordt ingewilligd, of waarbij de verblijfsvergunning ambtshalve wordt verleend of gewijzigd, wordt bekendgemaakt na
      zijn aankomst in Nederland. Het eerste, tweede en derde lid zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.104
  - number: 3.104.5
    text: |-
      De beschikking, die niet of niet mede strekt tot het verlenen, wijzigen of verlengen van de geldigheidsduur van
      een verblijfsvergunning als bedoeld in [artikel 8, onder a of b, van de Wet][ref1], wordt bekend gemaakt door
      uitreiking of door toezending naar het laatst bekende adres. De referent die de aanvraag heeft ingediend, wordt
      onverwijld in kennis gesteld van de bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3.105'
    text: De verblijfsvergunning asiel voor bepaalde tijd wordt verleend of verlengd voor vijf jaar.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105
  - number: 3.105a.1
    text: |-
      De verblijfsvergunning asiel voor bepaalde tijd die met toepassing van artikel 28, derde lid, van de Wet ambtshalve
      wordt verleend, wordt verleend met ingang van de dag nadat de machtiging tot voorlopig verblijf aan de vreemdeling
      in persoon is afgegeven.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105a
  - number: 3.105a.2
    text: |-
      In afwijking van het eerste lid, kan de verblijfsvergunning worden verleend met ingang van de dag die bij de
      afgifte van de machtiging tot voorlopig verblijf is opgegeven als de dag waarop de vreemdeling Nederland zal
      inreizen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105a
  - number: 3.105b
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de beoordeling of sprake is van
      omstandigheden als bedoeld in [artikel 31, eerste lid, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel31
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '31'
  - number: 3.105ba.1
    text: |-
      Bij ministeriële regeling kan een lijst worden opgesteld van veilige landen van herkomst in de zin van de artikelen
      36 en 37 van de Procedurerichtlijn.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105ba
  - number: 3.105ba.2
    text: |-
      De beoordeling of een land een veilig land van herkomst is dient te stoelen op een reeks informatiebronnen,
      waaronder in het bijzonder informatie uit andere lidstaten, het Europees Ondersteuningsbureau voor asielzaken
      (EASO), de UNHCR, de Raad van Europa en andere relevante internationale organisaties.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105ba
  - number: 3.105ba.3
    text: |-
      Onze Minister onderzoekt de situatie in derde landen die zijn aangemerkt als veilige landen van herkomst als
      bedoeld in het eerste lid regelmatig opnieuw.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105ba
  - number: 3.105c
    text: |-
      Aan de vreemdeling die aannemelijk heeft gemaakt dat hij verdragsvluchteling als bedoeld in
      [artikel 29, eerste lid, onder a, van de Wet][ref1] is, kan verlening van een verblijfsvergunning asiel voor
      bepaalde tijd op grond van die toelatingsgrond slechts worden geweigerd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.105c.a
    text: er goede redenen bestaan om de vreemdeling te beschouwen als een gevaar voor de nationale veiligheid; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105c
  - number: 3.105c.b
    text: |-
      de vreemdeling bij onherroepelijk geworden rechterlijk vonnis veroordeeld is voor een bijzonder ernstig misdrijf en
      een gevaar vormt voor de gemeenschap.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105c
  - number: 3.105d.1
    text: |-
      De verblijfsvergunning asiel voor bepaalde tijd die is verleend op grond van
      [artikel 29, eerste lid, onder a, van die wet][ref1], wordt ingetrokken dan wel de aanvraag tot het
      verlengen van de geldigheidsduur ervan wordt afgewezen indien sprake is van de situatie, bedoeld in
      [artikel 32, eerste lid, onder a dan wel c, van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel32
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105d
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '32'
  - number: 3.105d.2
    text: |-
      De verblijfsvergunning asiel voor bepaalde tijd die is verleend op grond van
      [artikel 29, eerste lid, onder a, van die wet][ref1], kan slechts op grond van
      [artikel 32, eerste lid, onder b, van de Wet][ref2] worden ingetrokken dan wel de aanvraag tot het verlengen van de
      geldigheidsduur ervan worden afgewezen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel32
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105d
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '32'
  - number: 3.105d.2.a
    text: er goede redenen bestaan om de vreemdeling te beschouwen als een gevaar voor de nationale veiligheid; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105d
  - number: 3.105d.2.b
    text: |-
      de vreemdeling bij onherroepelijk geworden rechterlijk vonnis veroordeeld is voor een bijzonder ernstig misdrijf en
      een gevaar vormt voor de gemeenschap.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105d
  - number: 3.105d.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de beoordeling of sprake is van de
      situatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105d
  - number: 3.105e
    text: |-
      Aan de vreemdeling die aannemelijk heeft gemaakt dat zijn aanvraag is gegrond op omstandigheden die de
      rechtsgrond voor verlening, bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref1], vormen, wordt een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28 van die wet][ref2] verleend, tenzij er ernstige
      redenen zijn om aan te nemen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105e
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.105e.a
    text: |-
      de vreemdeling een misdrijf tegen de vrede, een oorlogsmisdrijf of een misdrijf tegen de menselijkheid heeft
      gepleegd, zoals gedefinieerd in de internationale instrumenten waarmee wordt beoogd regelingen te treffen ten
      aanzien van dergelijke misdrijven;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105e
  - number: 3.105e.b
    text: de vreemdeling een ernstig misdrijf heeft gepleegd;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105e
  - number: 3.105e.c
    text: |-
      de vreemdeling zich schuldig heeft gemaakt aan daden die in strijd zijn met de doelstellingen en beginselen van de
      Verenigde Naties als vervat in de preambule en de artikelen 1 en 2 van het Handvest van de Verenigde Naties;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105e
  - number: 3.105e.d
    text: de vreemdeling een gevaar vormt voor de gemeenschap of de nationale veiligheid; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105e
  - number: 3.105e.e
    text: |-
      de vreemdeling heeft aangezet tot of anderszins heeft deelgenomen aan de onder a tot en met c vermelde misdrijven
      of daden,
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105e
  - number: 3.105f.1
    text: |-
      De verblijfsvergunning asiel voor bepaalde tijd die is verleend op grond van
      [artikel 29, eerste lid, onder b, van die wet][ref1] wordt ingetrokken dan wel de aanvraag tot het
      verlengen van de geldigheidsduur ervan wordt afgewezen, indien sprake is van de situatie, bedoeld in
      [artikel 32, eerste lid, onder a dan wel c, van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel32
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105f
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '32'
  - number: 3.105f.2
    text: |-
      De verblijfsvergunning asiel voor bepaalde tijd die is verleend op grond van
      [artikel 29, eerste lid, onder b, van die wet][ref1] wordt slechts ingetrokken dan wel de
      aanvraag tot het verlengen van de geldigheidsduur ervan wordt slechts afgewezen op grond van
      [artikel 32, eerste lid, onder b, van de Wet][ref2], indien er ernstige redenen zijn om aan te nemen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel32
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105f
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '32'
  - number: 3.105f.2.a
    text: |-
      de vreemdeling een misdrijf tegen de vrede, een oorlogsmisdrijf of een misdrijf tegen de menselijkheid heeft
      gepleegd, zoals gedefinieerd in de internationale instrumenten waarmee wordt beoogd regelingen te treffen ten
      aanzien van dergelijke misdrijven;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105f
  - number: 3.105f.2.b
    text: de vreemdeling een ernstig misdrijf heeft gepleegd;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105f
  - number: 3.105f.2.c
    text: |-
      de vreemdeling zich schuldig heeft gemaakt aan daden die in strijd zijn met de doelstellingen en beginselen van de
      Verenigde Naties als vervat in de preambule en de artikelen 1 en 2 van het Handvest van de Verenigde Naties;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105f
  - number: 3.105f.2.d
    text: de vreemdeling een gevaar vormt voor de gemeenschap of voor de nationale veiligheid; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105f
  - number: 3.105f.2.e
    text: |-
      de vreemdeling heeft aangezet tot of anderszins heeft deelgenomen aan de onder a tot en met c genoemde misdrijven
      of daden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105f
  - number: 3.105f.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de beoordeling of sprake is van de
      situatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.105f
  - number: 3.106.1
    text: |-
      De verblijfsvergunning asiel voor bepaalde tijd die op grond van [artikel 29, tweede lid, van de Wet][ref1] is
      verleend aan een gezinslid van een vreemdeling als bedoeld in artikel 29, eerste lid, van de Wet, wordt niet
      ingetrokken op grond van [artikel 32, eerste lid, onder e, van de Wet][ref2], indien het huwelijks- of gezinsleven
      met de hoofdpersoon is verbroken door het overlijden van de hoofdpersoon dan wel omdat het gezinslid slachtoffer is
      geworden of dreigt te worden van eergerelateerd geweld of huiselijk geweld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel32
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '32'
  - number: 3.106.2
    text: |-
      De verblijfsvergunning asiel voor bepaalde tijd die op grond van [artikel 29, tweede lid, van de Wet][ref1] is
      verleend aan een op het tijdstip van verlening minderjarig gezinslid van een vreemdeling als bedoeld in artikel 29,
      eerste lid, van de Wet, wordt niet ingetrokken op grond van [artikel 32, eerste lid, onder e, van de Wet][ref2],
      indien het desbetreffende gezinslid langer dan een jaar houder is geweest van de verblijfsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel32
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '32'
  - number: 3.106.3
    text: |-
      De verblijfsvergunning asiel voor bepaalde tijd die is verleend op grond
      van [artikel 29, eerste lid, onder e of f, van de Wet][ref1], zoals
      dat artikel luidde op de dag voorafgaand aan de inwerkingtreding van
      __REF001___________________________________________________________________________________________________________
      __________________________________________________________ (Stb. 2013, 478), wordt niet ingetrokken op grond van
      [artikel 32, eerste lid, onder e, van de Wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0034268#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel32
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0034268
        artikel: I
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '32'
  - number: 3.106.4
    text: |-
      De aanvraag voor verlenging van de geldigheidsduur van een verblijfsvergunning voor bepaalde tijd als bedoeld
      in het tweede lid wordt niet afgewezen op grond van [artikel 32, eerste lid, onder e, van de Wet][ref1],
      indien de oorspronkelijke geldigheidsduur van de vergunning eindigt binnen twee jaar na de inwerkingtreding van
      __REF001___________________________________________________________________________________________________________
      __________________________________________________________ (Stb. 2013, 478).


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0034268#ArtikelI
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0034268
        artikel: I
  - number: 3.106a.1
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning asiel voor bepaalde tijd wordt slechts niet-ontvankelijk
      verklaard op grond van [artikel 30a, eerste lid, onder a, b of c, van de Wet][ref1] indien, naar het oordeel van
      Onze Minister, alle relevante feiten en omstandigheden in aanmerking nemend, de vreemdeling in het betrokken derde
      land overeenkomstig de volgende beginselen zal worden behandeld:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30a
  - number: 3.106a.1.a
    text: |-
      het leven en de vrijheid worden niet bedreigd om redenen van ras, religie, nationaliteit, lidmaatschap van een
      bepaalde sociale groep of politieke overtuiging, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106a
  - number: 3.106a.1.b
    text: |-
      er bestaat geen risico op ernstige schade als bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.106a.1.c
    text: het beginsel van non-refoulement overeenkomstig het Vluchtelingenverdrag wordt nageleefd, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106a
  - number: 3.106a.1.d
    text: |-
      het verbod op verwijdering in strijd met het recht op vrijwaring tegen foltering en andere wrede, onmenselijke of
      vernederende behandeling, zoals neergelegd in het internationaal recht, wordt nageleefd, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106a
  - number: 3.106a.1.e
    text: |-
      de mogelijkheid bestaat om om de vluchtelingenstatus te verzoeken en, indien hij als vluchteling wordt erkend,
      bescherming te ontvangen overeenkomstig het Vluchtelingenverdrag.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106a
  - number: 3.106a.2
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning asiel voor bepaalde tijd wordt slechts niet-ontvankelijk
      verklaard op grond van [artikel 30a, eerste lid, onder a, b of c, van de Wet][ref1] indien de vreemdeling een
      zodanige band heeft met het betrokken derde land dat het voor hem redelijk zou zijn naar dat land te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30a
  - number: 3.106a.3
    text: |-
      Bij de beoordeling of sprake is van een band als bedoeld in het tweede lid, worden alle relevante feiten en
      omstandigheden betrokken, waaronder begrepen de aard, duur en omstandigheden van het eerder verblijf.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106a
  - number: 3.106a.4
    text: Bij ministeriële regeling worden nadere regels gesteld omtrent de toepassing van het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106a
  - number: 3.106b.1
    text: 'Een derde land kan voor een vreemdeling alleen als een veilig land van herkomst worden aangemerkt wanneer hij:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106b
  - number: 3.106b.1.a
    text: |-
      ofwel de nationaliteit van dat land heeft, ofwel staatloos is en voorheen in dat land zijn gewone verblijfplaats
      had; en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106b
  - number: 3.106b.1.b
    text: |-
      niet heeft onderbouwd dat het land in zijn specifieke omstandigheden niet als een veilig land van herkomst kan
      worden beschouwd ten aanzien van de vraag of hij voor internationale bescherming in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106b
  - number: 3.106b.2
    text: Bij ministeriële regeling worden nadere regels gesteld omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.106b
  - number: 3.107.1
    text: |-
      Onder een persoon als bedoeld in artikel 1F van het Vluchtelingenverdrag wordt mede verstaan een persoon die heeft
      aangezet tot of anderszins heeft deelgenomen aan de in dat artikel genoemde misdrijven of daden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107
  - number: 3.107.2
    text: |-
      Indien artikel 1F van het Vluchtelingenverdrag aan het verlenen van een verblijfsvergunning aan de vreemdeling op
      grond van [artikel 29, eerste lid, onder a, van de Wet][ref1] in de weg staat, wordt aan die vreemdeling evenmin
      een verblijfsvergunning verleend op één van de andere gronden bedoeld in [artikel 29 van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.107.3
    text: |-
      Aan de echtgenoot of echtgenote, het minderjarig kind, de partner of het meerderjarig kind, bedoeld in
      [artikel 29, tweede lid, onder a of b, van de Wet][ref1], van de vreemdeling, bedoeld in het eerste lid, wordt
      geen verblijfsvergunning asiel voor bepaalde tijd verleend, tenzij dit gezinslid aannemelijk heeft gemaakt dat zijn
      aanvraag is gegrond op omstandigheden die zelfstandig een rechtsgrond voor verlening van een verblijfsvergunning op
      grond van [artikel 29, onder a of b, van de Wet][ref2] vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.107a.1
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 8, aanhef, onderdeel d, van de Wet][ref1] wordt afgewezen, indien de vreemdeling niet beschikt
      over een diploma of certificaat als bedoeld in [artikel 6, tweede lid, van de Wet inburgering 2021][ref2]
      of een diploma, certificaat of ander document als bedoeld in
      [artikel 4, eerste lid, onderdeel b, van de Wet inburgering 2021][ref3] dan wel indien hij het inburgeringsexamen,
      bedoeld in [artikel 7, eerste lid, onderdeel a, van de Wet inburgering][ref4] of een diploma, certificaat of ander
      document als bedoeld in [artikel 5, eerste lid, onderdeel c, van die wet][ref5] niet heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0044770
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0044770
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0020611
        artikel: '5'
  - number: 3.107a.2
    text: 'Het eerste lid is niet van toepassing, indien de vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
  - number: 3.107a.2.a
    text: |-
      minderjarig is of de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 3.107a.2.b
    text: |-
      ten minste acht jaren tijdens de leerplichtige leeftijd in Nederland heeft verbleven overeenkomstig
      het bepaalde bij en krachtens [artikel 2.6 van het Besluit inburgering 2021][ref1] of
      [artikel 2.6 van het Besluit inburgering][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.107a.2.c
    text: |-
      beschikt over een document als bedoeld in [artikel 4, eerste lid, onderdeel b, van de Wet inburgering 2021][ref1]
      of [artikel 2.3, eerste lid, onder b tot en met k, en tweede lid, van het Besluit inburgering][ref2], dan wel
      voldoet aan het criterium, genoemd in [artikel 2.5 van dat besluit][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.107a.2.d
    text: |-
      beschikt over een document als bedoeld in
      [artikel 2.3, eerste lid, onder i tot en met l, van het Besluit inburgering][ref1]
      zoals dat luidde voor het tijdstip van inwerkingtreding van
      __REF001___________________________________________________________________________________________________________
      _______________________________________________________________________________________________________ (Stb. 2012,
      432), dan wel voldoet aan een van de criteria, genoemd in [artikel 2.5, onder a en c, van dat besluit][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032031#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032031
        artikel: I
      - id: ref3
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.107a.2.e
    text: |-
      op grond van [artikel 5, eerste of tweede lid, van de Wet inburgering 2021][ref1] of
      [artikel 6, eerste of tweede lid, van de Wet inburgering][ref2] dan wel artikel 6, eerste lid, of
      [artikel 31, tweede lid, van de Wet inburgering][ref3] zoals die luidde voor de inwerkingtreding van de
      __REF003___________________________________________________________________________________________________________
      _________________________________________________________________________ (Stb. 2012, 430) van de
      inburgeringsplicht is ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0032031
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '31'
      - id: ref4
        bwb_id: BWBR0032031
  - number: 3.107a.3
    text: |-
      Onze Minister kan het eerste lid voorts buiten toepassing laten, indien de vreemdeling naar
      zijn oordeel blijkens een door deze vreemdeling overgelegde deskundigenverklaring als bedoeld in
      [artikel 2.7, eerste lid, van het Besluit inburgering 2021][ref1] of een overgelegd advies als bedoeld in
      [artikel 2.8, eerste lid, van het Besluit inburgering][ref2] door een psychische of lichamelijke belemmering dan
      wel een verstandelijke beperking of handicap blijvend niet in staat is:


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.107a.3.a
    text: |-
      te voldoen aan de inburgeringsplicht als bedoeld in [artikel 6, eerste lid, van de Wet inburgering 2021][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel6
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '6'
  - number: 3.107a.3.b
    text: |-
      een diploma, certificaat of ander document als bedoeld in
      [artikel 4, eerste lid, onderdeel a, van de Wet inburgering 2021][ref1] te behalen;


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '4'
  - number: 3.107a.3.c
    text: |-
      het examen, bedoeld in [artikel 7, eerste lid, onderdeel a, van de Wet inburgering][ref1] te behalen; of


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
  - number: 3.107a.3.d
    text: |-
      een diploma, certificaat of ander document als bedoeld in
      [artikel 5, eerste lid, onderdeel c, van de Wet inburgering][ref1], te behalen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '5'
  - number: 3.107a.4
    text: |-
      Onze Minister kan het eerste lid voorts buiten toepassing laten, voorzover toepassing daarvan naar zijn oordeel zal
      leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
  - number: 3.107a.5
    text: |-
      Onze Minister kan het eerste lid voorts buiten toepassing laten, indien hij van oordeel is dat de vreemdeling
      aantoonbaar voldoende is ingeburgerd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
  - number: 3.107a.6
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de toepassing van het tweede lid, onder e, het derde
      lid en het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107a
  - number: 3.107b.1
    text: |-
      Wanneer een vreemdeling een verzoek om internationale bescherming als bedoeld in artikel 2, onder b, van de
      Procedurerichtlijn doet bij Onze Minister of bij een ambtenaar belast met de grensbewaking of met het toezicht op
      vreemdelingen, vindt de registratie plaats binnen drie werkdagen nadat het verzoek is gedaan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107b
  - number: 3.107b.2
    text: |-
      Wanneer het verzoek wordt gedaan bij een andere autoriteit, dient de registratie plaats te vinden binnen zes
      werkdagen nadat het verzoek is gedaan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.107b
  - number: 3.108.1
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 8, onder c en d, van de Wet][ref1], wordt door de vreemdeling of zijn wettelijk vertegenwoordiger in
      persoon ingediend op een door Onze Minister te bepalen plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.108.2
    text: |-
      In afwijking van het eerste lid wordt, indien de vreemdeling rechtens de vrijheid is ontnomen, de aanvraag
      ingediend op de plaats waar de vrijheidsontneming ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108
  - number: 3.108a.1
    text: |-
      Op de aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning asiel voor bepaalde tijd wordt
      binnen zes maanden na ontvangst van de aanvraag een beschikking gegeven.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108a
  - number: 3.108a.2
    text: |-
      De termijn voor het geven van de beschikking, bedoeld in het eerste lid, kan ten hoogste voor zes maanden worden
      verlengd indien naar het oordeel van Onze Minister voor de beoordeling van de aanvraag advies van of onderzoek door
      derden of het openbaar ministerie nodig is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108a
  - number: 3.108a.3
    text: |-
      De [artikelen 43][ref1] en [43a van de Wet][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel43a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 43a
  - number: 3.108b.1
    text: |-
      Voorafgaand aan of tijdens het onderzoek naar de aanvraag tot het verlenen van een verblijfsvergunning asiel voor
      bepaalde tijd wordt beoordeeld of de vreemdeling bijzondere procedurele waarborgen behoeft als bedoeld in artikel
      24 van de Procedurerichtlijn.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108b
  - number: 3.108b.2
    text: |-
      Indien de vreemdeling bijzondere procedurele waarborgen behoeft, wordt gedurende het onderzoek passende steun
      geboden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108b
  - number: 3.108c.1
    text: |-
      De aanvraag tot het verlenen van de verblijfsvergunning asiel voor bepaalde tijd wordt door de vreemdeling
      onverwijld ingediend nadat hij op een door Onze Minister te bepalen wijze te kennen heeft gegeven die aanvraag in
      te willen dienen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108c
  - number: 3.108c.2
    text: |-
      De vreemdeling wordt in een taal die hij begrijpt of waarvan redelijkerwijze kan worden aangenomen dat hij deze
      begrijpt, ingelicht over:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108c
  - number: 3.108c.2.a
    text: de te volgen procedure;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108c
  - number: 3.108c.2.b
    text: zijn rechten en verplichtingen tijdens de procedure;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108c
  - number: 3.108c.2.c
    text: de gevolgen die kunnen ontstaan indien hij zijn verplichtingen niet nakomt of niet met Onze Minister samenwerkt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108c
  - number: 3.108c.2.d
    text: de geldende termijnen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108c
  - number: 3.108c.2.e
    text: |-
      de middelen waarover hij beschikt om te voldoen aan zijn verplichting tot het naar voren brengen van de in
      [artikel 31, tweede tot en met vierde lid, van de Wet][ref1] bedoelde elementen, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel31
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '31'
  - number: 3.108c.2.f
    text: de gevolgen van een intrekking van zijn aanvraag.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108c
  - number: 3.108c.3
    text: |-
      Aan de vreemdeling wordt tijdig mededeling gedaan van het hem toekomende recht zich tijdens de in deze paragraaf
      bedoelde gehoren en de procedure te doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108c
  - number: 3.108d.1
    text: |-
      Nadat de vreemdeling in overeenstemming met het gestelde in [artikel 3.108][ref1] te kennen heeft gegeven dat hij
      de aanvraag bedoeld in [artikel 3.108c, eerste lid][ref2], wil indienen, neemt de aanmeldfase een aanvang.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.108d.2
    text: |-
      Van de vreemdeling worden door Onze Minister een gezichtsopname en vingerafdrukken afgenomen en verwerkt. De
      vreemdeling verleent hieraan zijn medewerking.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108d
  - number: 3.108d.3
    text: |-
      Tijdens de aanmeldfase kan onderzoek plaatsvinden naar de identiteit, vingerafdrukken, nationaliteit en reisroute
      van de vreemdeling en naar de bij de vreemdeling aangetroffen of door hem overgelegde documenten en bescheiden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108d
  - number: 3.108d.4
    text: |-
      Tijdens de aanmeldfase wordt de vreemdeling gevraagd naar een korte opgave van zijn asielmotieven. Het doel hiervan
      is een efficiënte behandeling van de aanvraag mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108d
  - number: 3.108d.5
    text: |-
      Bij de beoordeling van de inwilligbaarheid van de aanvraag zullen de door de vreemdeling tijdens de aanmeldfase
      afgelegde verklaringen omtrent zijn asielmotieven niet worden betrokken, tenzij deze betrekking hebben op daden als
      bedoeld in artikel 1F van het Vluchtelingenverdrag, andere zware strafbare feiten of relevant zijn in het kader van
      de bescherming van de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108d
  - number: 3.108d.6
    text: |-
      De vreemdeling wordt tijdens de aanmeldfase door Onze Minister aan een aanmeldgehoor onderworpen. Gedurende het
      aanmeldgehoor kunnen onder meer vragen worden gesteld omtrent de identiteit, nationaliteit, etniciteit, religie,
      herkomst, reisroute, documenten, eventueel verblijf in lidstaten van de Europese Unie of derde landen, en de
      personalia en verblijfplaats van familieleden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108d
  - number: 3.108d.7
    text: |-
      Indien de aanvraag tot het verlenen van de verblijfsvergunning asiel voor bepaalde tijd wordt behandeld in de
      grensprocedure, bedoeld in [artikel 3.109b][ref1], of indien de vreemdeling rechtens zijn vrijheid is of wordt
      ontnomen op grond van [artikel 59b van de Wet][ref2] of op grond van een niet-vreemdelingrechtelijke titel, is
      dit artikel niet van toepassing. Wel zijn het vierde en het vijfde lid van overeenkomstige toepassing en wordt
      de vreemdeling voorafgaand aan het gehoor, bedoeld in [artikel 3.113, eerste lid][ref3], onderworpen aan een
      aanmeldgehoor als bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 59b
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.108d.8
    text: |-
      Na afronding van het aanmeldgehoor eindigt de aanmeldfase. Een afschrift van het verslag van het aanmeldgehoor
      wordt aan de vreemdeling ter kennis gebracht. De vreemdeling wordt in de gelegenheid gesteld om opmerkingen te
      maken of opheldering te verschaffen over verkeerd vertaalde passages of misvattingen in het verslag van het gehoor.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.108d
  - number: 3.109.1
    text: |-
      Met ingang van de dag volgend op het einde van de aanmeldfase, bedoeld in [artikel 3.108d][ref1], wordt de
      vreemdeling een rust- en voorbereidingstermijn gegeven van ten minste zes dagen. Het onderzoek, bedoeld in
      [artikel 3.110][ref2], vangt na de rust- en voorbereidingstermijn aan.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.109.2
    text: |-
      Van de vreemdeling kunnen door Onze Minister een gezichtsopname en vingerafdrukken worden afgenomen en verwerkt. De
      vreemdeling verleent hieraan zijn medewerking.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109
  - number: 3.109.3
    text: |-
      Gedurende de rust- en voorbereidingstermijn kan onderzoek plaatsvinden naar onder meer de identiteit,
      vingerafdrukken, nationaliteit en reisroute van de vreemdeling en naar de bij de vreemdeling aangetroffen of door
      hem overgelegde documenten en bescheiden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109
  - number: 3.109.4
    text: |-
      Gedurende de rust- en voorbereidingstermijn wordt de vreemdeling in de gelegenheid gesteld om te worden voorgelicht
      over het vervolg van de asielprocedure en om zich op het vervolg van de asielprocedure voor te bereiden. De
      vreemdeling wordt tevens in staat gesteld zich op het gehoor, bedoeld in [artikel 3.113, eerste lid][ref1], voor
      te bereiden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.109.5
    text: |-
      De vreemdeling wordt een medisch onderzoek aangeboden. Voor dit onderzoek is de schriftelijke toestemming van de
      vreemdeling vereist.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109
  - number: 3.109.6
    text: 'In afwijking van het eerste lid wordt geen rust- en voorbereidingstermijn gegeven indien:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109
  - number: 3.109.6.a
    text: de vreemdeling een gevaar vormt voor de openbare orde of nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109
  - number: 3.109.6.b
    text: de vreemdeling overlast veroorzaakt in een opvangvoorziening of in de omgeving daarvan;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109
  - number: 3.109.6.c
    text: |-
      de vreemdeling rechtens zijn vrijheid is ontnomen op grond van [artikel 59b van de Wet][ref1] dan wel op grond van
      een niet-vreemdelingrechtelijke titel;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 59b
  - number: 3.109.6.d
    text: |-
      het vermoeden bestaat dat de aanvraag mede kan worden afgewezen omdat de vreemdeling niet naar waarheid gegevens
      heeft verstrekt over zijn identiteit, nationaliteit, herkomst of etniciteit.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109
  - number: 3.109.7
    text: |-
      Indien geen rust- en voorbereidingstermijn wordt gegeven, wordt gewaarborgd dat de vreemdeling op een passend
      moment voorafgaand aan de aanvang van het onderzoek in de gelegenheid wordt gesteld om te worden voorgelicht
      over het vervolg van de asielprocedure en om zich op het vervolg van de asielprocedure en het gehoor, bedoeld in
      [artikel 3.113, eerste lid][ref1], voor te bereiden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.109a.1
    text: |-
      De vreemdeling kan gebruik maken van de diensten van een tolk tijdens de in deze paragraaf bedoelde gehoren en op
      andere momenten waarop dat noodzakelijk is om zijn zaak voor te leggen, indien een goede communicatie zonder die
      diensten niet kan worden gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109a
  - number: 3.109a.2
    text: |-
      De vreemdeling kan tijdens de procedure, indien gewenst, contact opnemen met de UNHCR of met een andere organisatie
      die juridisch advies of andere ondersteuning biedt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109a
  - number: 3.109a.3
    text: |-
      De vreemdeling en degene die hem vertegenwoordigt hebben toegang tot de informatie in het dossier op grond waarvan
      een beslissing is of zal worden genomen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109a
  - number: 3.109a.4
    text: |-
      Het derde lid is niet van toepassing wanneer de openbaarmaking van informatie of bronnen de nationale veiligheid,
      de veiligheid van de organisaties of personen die de informatie hebben verstrekt dan wel de veiligheid van de
      persoon of personen op wie de informatie betrekking heeft, in gevaar zou brengen, of wanneer het belang van het
      onderzoek in verband met de behandeling van aanvragen tot het verlenen van een verblijfsvergunning asiel voor
      bepaalde tijd door de bevoegde autoriteiten van de lidstaten of de internationale betrekkingen van de lidstaten
      zouden worden geschaad.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109a
  - number: 3.109a.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de gevallen waarin minderjarigen kunnen worden
      gehoord tijdens de in deze paragraaf bedoelde gehoren.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109a
  - number: 3.109b.1
    text: |-
      Indien een vreemdeling die niet voldoet aan de voorwaarden voor toegang tot Nederland, aan de grens te kennen
      geeft een aanvraag tot het verlenen van een verblijfsvergunning asiel voor bepaalde tijd te willen indienen, vindt
      behandeling van de aanvraag in een grensprocedure plaats zolang redelijkerwijs kan worden aangenomen dat hierop kan
      worden besloten met toepassing van [artikel 30][ref1], [30a][ref2] of [30b van de Wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel30b
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 30a
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 30b
  - number: 3.109b.2
    text: |-
      Indien de aanvraag tot het verlenen van de verblijfsvergunning asiel voor bepaalde tijd wordt behandeld in een
      grensprocedure, kan Onze Minister, in afwijking van [artikel 3.109, eerste lid][ref1], het onderzoek na een kortere
      rust- en voorbereidingstermijn dan zes dagen aanvangen, mits de vreemdeling te kennen heeft gegeven hier prijs op
      te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.109b.3
    text: |-
      Indien naar het oordeel van Onze Minister geen sprake is van een aanvraag waarop vermoedelijk zal worden besloten
      tot toepassing van [artikel 30][ref1], [30a][ref2] of [30b van de Wet][ref3], wordt de behandeling van de aanvraag
      voortgezet onder opheffing van de maatregel, bedoeld in [artikel 6, derde lid, van de Wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel30b
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel6
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 30a
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 30b
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '6'
  - number: 3.109b.4
    text: Indien er sprake is van een situatie als bedoeld in het derde lid, wordt het onderzoek naar de aanvraag opgeschort.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109b
  - number: 3.109b.5
    text: |-
      Indien het onderzoek naar de aanvraag is opgeschort als bedoeld in het vierde lid, wordt ten minste een dag voor
      hervatting van het onderzoek daarvan mededeling gedaan aan de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109b
  - number: 3.109b.6
    text: Het onderzoek wordt hervat op het punt waarop het is afgebroken.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109b
  - number: 3.109b.7
    text: Aanvragen van alleenstaande minderjarige vreemdelingen worden niet behandeld in de grensprocedure.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109b
  - number: 3.109c.1
    text: |-
      Indien de aanvraag vermoedelijk niet in behandeling zal worden genomen op grond van [artikel 30 van de Wet][ref1],
      zijn de [artikelen, 3.108d][ref2], [3.109][ref3] en [3.110 tot en met 3.118][ref4] niet, of indien de in artikel
      3.108d bedoelde aanmeldfase reeds is aangevangen, niet langer van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.109c.2
    text: |-
      Van de vreemdeling kunnen door Onze Minister een gezichtsopname en vingerafdrukken worden afgenomen en verwerkt. De
      vreemdeling verleent hieraan zijn medewerking.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109c
  - number: 3.109c.3
    text: |-
      Na de indiening van de aanvraag, bedoeld in [artikel 3.108c, eerste lid][ref1], kan onderzoek plaatsvinden naar de
      identiteit, vingerafdrukken, nationaliteit en reisroute van de vreemdeling en naar de bij hem aangetroffen of door
      hem overgelegde documenten en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109c
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.109c.4
    text: |-
      De vreemdeling wordt zo spoedig mogelijk door Onze Minister gehoord over de mogelijkheid van toepassing van
      [artikel 30 van de Wet][ref1]. Tevens wordt de vreemdeling gehoord over zijn eventuele bezwaren tegen overdracht
      naar de verantwoordelijke lidstaat, als bedoeld in artikel 30, tweede lid, van de Wet. Tijdens het gehoor kunnen
      onder meer vragen worden gesteld omtrent de identiteit, nationaliteit, etniciteit, religie, herkomst, reisroute,
      documenten, eventueel verblijf in derde landen, en de personalia en verblijfplaats van familieleden. Voor zover
      het aanmeldgehoor, bedoeld in [artikel 3.108d, zesde lid][ref2], al een aanvang heeft genomen, wordt dit gehoor
      voortgezet en aangemerkt als een gehoor als hier bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.109c.5
    text: |-
      Een afschrift van het in het vierde lid bedoelde gehoor wordt zo spoedig mogelijk ter kennis van de vreemdeling
      gebracht.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109c
  - number: 3.109c.6
    text: |-
      Het schriftelijk voornemen om de aanvraag niet in behandeling te nemen wordt meegedeeld door uitreiking of
      toezending daarvan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109c
  - number: 3.109c.7
    text: |-
      Indien naar het oordeel van Onze Minister geen sprake meer is van een aanvraag waarop vermoedelijk zal worden
      besloten met toepassing van [artikel 30 van de Wet][ref1] wordt voor de verdere behandeling van de aanvraag
      alsnog de in [artikel 3.109ca][ref2] of de in de [artikelen 3.109][ref3] en [3.110 tot en met 3.116][ref4]
      beschreven procedure gevolgd. Indien Onze Minister dit noodzakelijk acht, kan een aanmeldgehoor, als bedoeld in
      [artikel 3.108d, zesde lid][ref5], worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref5
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.109c.8
    text: |-
      De vreemdeling wordt in de gelegenheid gesteld om opmerkingen te maken of opheldering te verschaffen over verkeerd
      vertaalde passages of misvattingen in het verslag van het gehoor, bedoeld in het vijfde lid, en nadere gegevens te
      verstrekken alsmede schriftelijk zijn zienswijze op het in het zesde lid bedoelde voornemen naar voren te brengen
      uiterlijk binnen twee weken. Indien de vreemdeling rechtens zijn vrijheid is ontnomen geldt hiervoor een termijn
      van een week.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109c
  - number: 3.109c.9
    text: |-
      De termijn, bedoeld in het achtste lid, vangt aan met ingang van de dag na die waarop het voornemen is uitgereikt
      of toegezonden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109c
  - number: 3.109c.10
    text: |-
      De schriftelijke zienswijze is tijdig bij Onze Minister ingediend, indien deze voor het einde van de termijn is
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109c
  - number: 3.109c.11
    text: |-
      Onze Minister houdt rekening met een na afloop van de termijn ontvangen schriftelijke zienswijze, indien de
      beschikking nog niet bekend is gemaakt en de afdoening van de zaak daardoor niet ontoelaatbaar wordt vertraagd.
      Het ontbreken van de schriftelijke zienswijze, na het verstrijken van de termijn waarbinnen de vreemdeling zijn
      zienswijze schriftelijk naar voren kan brengen, staat aan het geven van de beschikking niet in de weg.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109c
  - number: 3.109c.12
    text: De beschikking wordt bekendgemaakt door uitreiking of toezending ervan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109c
  - number: 3.109ca.1
    text: |-
      De [artikelen 3.108d][ref1], [3.109][ref2] en [3.110 tot en met 3.116][ref3] zijn niet, of indien de in artikel
      3.108d bedoelde aanmeldfase reeds is aangevangen, niet langer van toepassing, indien de aanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
