  - number: 8.15.1
    text: |-
      Het rechtmatig verblijf van de vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die niet
      de nationaliteit bezit van een staat als bedoeld in het eerste lid van dat artikel, eindigt niet door afwezigheid
      uit Nederland:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.15.1.a
    text: van ten hoogste zes maanden per jaar;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
  - number: 8.15.1.b
    text: |-
      om belangrijke redenen, zoals zwangerschap en bevalling, ernstige ziekte, studie of beroepsopleiding, gedurende een
      eenmalige periode van ten hoogste twaalf maanden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
  - number: 8.15.1.c
    text: voor de vervulling van militaire verplichtingen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
  - number: 8.15.1.d
    text: wegens uitzending voor het verrichten van werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
  - number: 8.15.2
    text: |-
      Onverminderd het vijfde lid eindigt het rechtmatig verblijf evenmin door het overlijden van de vreemdeling, bedoeld
      in [artikel 8.7, eerste lid][ref1], bij wie hij in Nederland verbleef:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.15.2.a
    text: indien hij ten minste een jaar voor het overlijden van die vreemdeling in Nederland verbleef;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
  - number: 8.15.2.b
    text: |-
      voor voltooiing van de studie, indien hij in Nederland verbleef als het kind van die vreemdeling en voor studie is
      ingeschreven bij een onderwijsinstelling, dan wel indien hij de verzorgende ouder is van een zodanig kind.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
  - number: 8.15.3
    text: |-
      Het tweede lid, aanhef en onder b, is van overeenkomstige toepassing bij het vertrek van de vreemdeling, bedoeld in
      [artikel 8.7, eerste lid][ref1], bij wie de vreemdeling in Nederland verbleef.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.15.4
    text: |-
      Onverminderd het vijfde lid eindigt het rechtmatig verblijf evenmin door de ontbinding of nietigverklaring van het
      huwelijk of de beëindiging van het geregistreerde partnerschap:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
  - number: 8.15.4.a
    text: |-
      indien het huwelijk voor het begin van de gerechtelijke procedure tot scheiding of nietigverklaring,
      onderscheidenlijk het partnerschap voor beëindiging daarvan, ten minste drie jaar heeft geduurd, waarvan de
      vreemdeling ten minste één jaar in Nederland heeft verbleven;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
  - number: 8.15.4.b
    text: |-
      indien het gezag over de kinderen bij overeenkomst tussen de voormalige echtgenoten of partners, dan wel bij
      rechterlijke beslissing aan de vreemdeling is toegewezen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
  - number: 8.15.4.c
    text: |-
      voor de duur waarvoor de omgang is voorgeschreven, indien de vreemdeling op grond van een overeenkomst of
      gerechtelijke beslissing het omgangsrecht met betrekking tot een minderjarig kind heeft en de omgang ingevolge een
      rechterlijke beslissing in Nederland moet plaatsvinden, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
  - number: 8.15.4.d
    text: |-
      indien bijzonder schrijnende situaties zulks rechtvaardigen, bijvoorbeeld wanneer een familielid tijdens het
      huwelijk of het geregistreerd partnerschap het slachtoffer is geweest van huiselijk geweld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
  - number: 8.15.5
    text: |-
      In afwijking van het tweede lid, onder a, en het vierde lid, blijft het rechtmatig verblijf van de vreemdeling,
      bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die niet de nationaliteit van een staat bezit
      als bedoeld in het eerste lid van dat artikel, onderworpen aan de voorwaarde dat hij voor zichzelf en zijn
      familieleden over voldoende middelen van bestaan beschikt om te voorkomen dat zij ten laste komen van het sociale
      bijstandsstelsel, tenzij hij het duurzaam verblijfsrecht, bedoeld in [artikel 8.17][ref2] heeft verkregen, of is
      aangetoond dat hij:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.15.5.a
    text: werknemer of zelfstandige is;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
  - number: 8.15.5.b
    text: |-
      voor zichzelf en zijn familieleden beschikt over voldoende middelen van bestaan om te voorkomen dat zij tijdens
      hun verblijf in Nederland ten laste komen van de algemene middelen, en beschikt over een verzekering die de
      ziektekosten in Nederland volledig dekt; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
  - number: 8.15.5.c
    text: |-
      gezinslid is van het reeds in Nederland gevormde gezin van een persoon die voldoet aan de voorwaarden, bedoeld
      onder a of b.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
  - number: 8.15.6
    text: |-
      Voor de toepassing van het vijfde lid, onder b, beschikt de vreemdeling met een inkomen ter hoogte van het
      normbedrag dat in [artikel 3.74][ref1] voor de desbetreffende categorie is vastgesteld, in ieder geval over
      voldoende middelen van bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 8.16.1
    text: |-
      Onverminderd de [artikelen 8.22][ref1] en [8.23][ref2] eindigt het rechtmatig verblijf niet zolang de vreemdeling
      aan de in de [artikelen 8.12 tot en met 8.15][ref3] genoemde voorwaarden voldoet. In specifieke gevallen van
      redelijke twijfel kan Onze Minister onderzoeken of aan de voorwaarden wordt voldaan. Het onderzoek geschiedt
      niet stelselmatig. Een beroep op de algemene middelen leidt niet zonder meer tot beëindiging van het rechtmatig
      verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.16
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.16.2
    text: |-
      Onverminderd de [artikelen 8.22][ref1] en [8.23][ref2], eindigt het rechtmatig verblijf niet zolang de vreemdeling,
      bedoeld in [artikel 8.7, eerste lid][ref3]:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.16
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.16.2.a
    text: werknemer of zelfstandige is; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.16
  - number: 8.16.2.b
    text: |-
      naar Nederland is gekomen om werk te zoeken en hij kan bewijzen dat hij nog steeds werk zoekt en een reële kans op
      werk heeft.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.16
  - number: 8.17.1
    text: 'Duurzaam verblijfsrecht in Nederland heeft:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.1.a
    text: |-
      de vreemdeling, bedoeld in [artikel 8.7, eerste lid][ref1], die gedurende vijf jaar ononderbroken rechtmatig
      verblijf in Nederland heeft gehad;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.17.1.b
    text: |-
      de vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die gedurende vijf jaar ononderbroken
      rechtmatig verblijf heeft gehad bij een vreemdeling als bedoeld onder a, waarbij mede wordt betrokken de periode
      waarin hij voldeed aan de voorwaarden van [artikel 8.15, vijfde lid, onder a, b of c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.17.2
    text: |-
      Voor de berekening van het ononderbroken verblijf, bedoeld in het eerste lid, vormt geen onderbreking een
      afwezigheid uit Nederland:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.2.a
    text: van ten hoogste zes maanden per jaar;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.2.b
    text: |-
      om belangrijke redenen, zoals zwangerschap en bevalling, ernstige ziekte, studie of beroepsopleiding, gedurende een
      eenmalige periode van ten hoogste twaalf achtereenvolgende maanden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.2.c
    text: voor de vervulling van militaire verplichtingen; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.2.d
    text: |-
      wegens uitzending voor het verrichten van werkzaamheden, gedurende een eenmalige periode van ten hoogste twaalf
      achtereenvolgende maanden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.3
    text: |-
      Bij de berekening van het vijf jaar ononderbroken rechtmatig verblijf, bedoeld in het eerste lid, blijft
      buiten beschouwing de periode die is doorgebracht gedurende de tenuitvoerlegging van een gevangenisstraf,
      terbeschikkingstelling, jeugddetentie of plaatsing in een inrichting voor stelselmatige daders.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.4
    text: 'De periode van vijf jaar, bedoeld in eerste lid, geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.4.a
    text: |-
      de werknemer of zelfstandige die langer dan drie jaar ononderbroken in Nederland heeft gewoond,
      die gedurende de laatste twaalf maanden in Nederland werkzaamheden heeft verricht en die op
      het tijdstip waarop hij zijn werkzaamheid staakt, de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 8.17.4.b
    text: |-
      de werknemer die langer dan drie jaar ononderbroken in Nederland heeft gewoond, die gedurende de laatste twaalf
      maanden in Nederland werkzaamheden heeft verricht en die zijn werkzaamheden staakt ten gevolge van vervroegde
      uittreding;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.4.c
    text: |-
      de werknemer of zelfstandige die zijn werkzaamheden na meer dan twee jaar ononderbroken verblijf in Nederland
      staakt als gevolg van blijvende arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.4.d
    text: |-
      de werknemer of zelfstandige die in Nederland zijn werkzaamheden staakt wegens blijvende arbeidsongeschiktheid als
      gevolg van een arbeidsongeval of een beroepsziekte waardoor recht is ontstaan op een uitkering die geheel of ten
      dele ten laste komt van een Nederlandse instelling;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.4.e
    text: |-
      de werknemer of zelfstandige die, na drie jaar ononderbroken in Nederland werkzaam te zijn geweest en in Nederland
      te hebben verbleven, werkzaam is in een andere lidstaat, zijn woning in Nederland aanhoudt en daar ten minste
      eenmaal per week naar terugkeert.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.5
    text: 'Bij de toepassing van het vierde lid worden als arbeidsperioden mede in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.5.a
    text: |-
      het naar behoren door het Uitvoeringsinstituut werknemersverzekeringen vastgestelde tijdvak van onvrijwillige
      werkloosheid waarin de vreemdeling wegens een niet-toerekenbare reden niet heeft gewerkt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.5.b
    text: de periode van afwezigheid of arbeidsonderbreking wegens ziekte of ongeval.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.6
    text: |-
      Bij de toepassing van het vierde lid, onder a tot en met d, worden de tijdvakken van werkzaamheid in de lidstaat
      waarin de betrokkene werkzaam is, aangemerkt als in Nederland vervulde tijdvakken van werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.7
    text: |-
      De in het vierde lid, onder a en b, gestelde voorwaarden inzake de duur van het verblijf en van de werkzaamheid, en
      de in het vierde lid, onder c en d, gestelde voorwaarde inzake de duur van het verblijf, zijn niet van toepassing
      indien de echtgenoot of de geregistreerde partner van de werknemer of zelfstandige Nederlander is of de Nederlandse
      nationaliteit heeft verloren als gevolg van het huwelijk met die werknemer of zelfstandige.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.8
    text: |-
      De bij hem in Nederland verblijvende familieleden van de werknemer of zelfstandige hebben duurzaam verblijfsrecht,
      indien de werknemer of zelfstandige een nationaliteit als bedoeld in [artikel 8.7, eerste lid][ref1], bezit en:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.17.8.a
    text: op grond van het vierde tot en met zevende lid duurzaam verblijfsrecht in Nederland heeft verkregen; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.8.b
    text: |-
      tijdens zijn werkzame leven is overleden, voordat hij op grond van het vierde tot en met zevende lid duurzaam
      verblijfsrecht in Nederland verkreeg, en:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.8.b.1°
    text: hij op het tijdstip van zijn overlijden gedurende twee jaar ononderbroken in Nederland heeft verbleven;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.8.b.2°
    text: zijn overlijden het gevolg was van een arbeidsongeval of beroepsziekte; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.17.8.b.3°
    text: zijn echtgenoot de Nederlandse nationaliteit als gevolg van hun huwelijk heeft verloren.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.17
  - number: 8.18.1
    text: |-
      Duurzaam verblijfsrecht kan slechts worden verloren door een afwezigheid van meer dan twee achtereenvolgende jaren
      uit Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.18
  - number: 8.18.2
    text: |-
      Duurzaam verblijfsrecht kan door Onze Minister uitsluitend worden beëindigd om ernstige redenen van openbare orde
      of openbare veiligheid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.18
  - number: '8.19'
    text: |-
      Onze Minister verstrekt de vreemdeling, bedoeld in [artikel 8.7 eerste lid][ref1], met duurzaam verblijfsrecht
      op aanvraag en na verificatie van de verblijfsduur een verblijfsdocument, waarvan het model wordt vastgesteld bij
      ministeriële regeling. Het verblijfsdocument wordt zo spoedig mogelijk verstrekt. [Artikel 25 van de Wet][ref2] is
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel25
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.19
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '25'
  - number: 8.20.1
    text: |-
      Onze Minister verstrekt de vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], met
      duurzaam verblijfsrecht en die niet de nationaliteit bezit van een staat als bedoeld in het eerste lid van
      dat artikel, op aanvraag een verblijfsdocument, waarvan het model wordt vastgesteld bij ministeriële regeling.
      [Artikel 25, tweede en derde lid, van de Wet][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel25
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.20
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '25'
  - number: 8.20.2
    text: |-
      De aanvraag, bedoeld in het eerste lid, wordt ingediend voor het verstrijken van de geldigheidsduur van het
      verblijfsdocument, bedoeld in [artikel 8.13, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.20
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: '8.21'
    text: |-
      Beëindiging van het rechtmatig verblijf van de vreemdeling vormt een onderbreking vanaf het tijdstip waarop de
      vreemdeling Nederland heeft verlaten.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.21
  - number: 8.22.1
    text: |-
      Onze Minister kan het rechtmatig verblijf ontzeggen of beëindigen, om redenen van openbare orde of openbare
      veiligheid, indien het persoonlijke gedrag van de vreemdeling een actuele, werkelijke en ernstige bedreiging
      voor een fundamenteel belang van de samenleving vormt. Alvorens hierover een besluit te nemen, houdt Onze
      Minister in het bijzonder rekening met de duur van het verblijf van de betrokkene in Nederland, diens leeftijd,
      gezondheidstoestand, gezins- en economische situatie en sociale en culturele integratie in Nederland en met de mate
      waarin hij bindingen heeft met zijn land van herkomst.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.22
  - number: 8.22.2
    text: |-
      Onze Minister kan uiterlijk drie maanden na de datum van binnenkomst van de betrokkene in Nederland dan wel bij
      de afgifte van de verklaring van inschrijving of van het verblijfsdocument aan de lidstaat van oorsprong of andere
      lidstaten verzoeken om inlichtingen omtrent de gerechtelijke antecedenten.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.22
  - number: 8.22.3
    text: |-
      Tenzij dwingende redenen van openbare veiligheid daartoe nopen, wordt het rechtmatig verblijf niet beëindigd,
      indien de vreemdeling bedoeld in [artikel 8.7, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.22
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.22.3.a
    text: in de voorafgaande tien jaar in Nederland heeft gewoond; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.22
  - number: 8.22.3.b
    text: minderjarig is, tenzij verwijdering noodzakelijk is in het belang van het kind.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.22
  - number: 8.22.4
    text: |-
      De aanvraag tot opheffing van de ongewenstverklaring kan slechts worden gedaan nadat sinds de verwijdering om
      redenen van openbare orde of openbare veiligheid een redelijke termijn is verstreken of indien die verwijdering
      tenminste drie jaren voorafgaand aan de aanvraag heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.22
  - number: 8.22.5
    text: Binnen zes maanden wordt een beschikking gegeven op de in het vierde lid bedoelde aanvraag.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.22
  - number: 8.22.6
    text: |-
      Indien de verwijdering niet binnen twee jaren na de ontzegging of beëindiging, bedoeld in het eerste lid, heeft
      plaatsgevonden, onderzoekt Onze Minister of de bedreiging, bedoeld in het eerste lid, nog werkelijk en actueel is,
      waarbij Onze Minister sinds die ontzegging of beëindiging eventueel opgetreden wijzigingen in materiële zin in de
      omstandigheden beoordeelt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.22
  - number: 8.22.7
    text: |-
      Bij de berekening van de tien jaar, bedoeld in het derde lid, onder a, blijft buiten beschouwing de periode die
      is doorgebracht gedurende de tenuitvoerlegging van een gevangenisstraf, terbeschikkingstelling, jeugddetentie of
      plaatsing in een inrichting voor stelselmatige daders.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.22
  - number: 8.23.1
    text: |-
      Onze Minister kan het rechtmatig verblijf op grond van de volksgezondheid ontzeggen of beëindigen in het geval van
      potentieel epidemische ziekten als gedefinieerd in de relevante instrumenten van de Wereldgezondheidsorganisatie
      dan wel in geval van andere infectieziekten of besmettelijke parasitaire ziekten, ten aanzien waarvan in Nederland
      beschermende regelingen ten aanzien van Nederlanders worden getroffen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.23
  - number: 8.23.2
    text: |-
      Rechtmatig verblijf wordt niet op grond van de volksgezondheid beëindigd, indien de ziekte langer dan drie maanden
      na inreis van de vreemdeling is opgetreden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.23
  - number: 8.23.3
    text: |-
      Onze Minister kan de vreemdeling binnen drie maanden na inreis onderwerpen aan een kosteloos medisch onderzoek
      indien ernstige aanwijzingen daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.23
  - number: 8.24.1
    text: |-
      De uitzetting van de vreemdeling, ten aanzien van wie het rechtmatig verblijf om redenen van openbare
      orde, openbare veiligheid of volksgezondheid is ontzegd of beëindigd, blijft, indien de vreemdeling de
      voorzieningenrechter heeft verzocht een voorlopige voorziening te treffen, achterwege tot op dat verzoek is
      beslist, tenzij het besluit:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.24
  - number: 8.24.1.a
    text: |-
      met toepassing van [artikel 4:6 van de Algemene wet bestuursrecht][ref1] is genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 8.24.1.b
    text: reeds door de rechtbank of de voorzieningenrechter is beoordeeld; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.24
  - number: 8.24.1.c
    text: gebaseerd is op dwingende redenen van openbare veiligheid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.24
  - number: 8.24.2
    text: |-
      De toegang van de vreemdeling die voor de behandeling van een bezwaarschrift, beroepschrift, dan wel een verzoek om
      een voorlopige voorziening, gericht tegen beëindiging van het rechtmatig verblijf, geen gemachtigde heeft gesteld,
      wordt niet geweigerd, tenzij:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.24
  - number: 8.24.2.a
    text: zijn aanwezigheid de openbare orde of de openbare veiligheid ernstig zal verstoren; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.24
  - number: 8.24.2.b
    text: het bezwaar of beroep is gericht tegen de weigering van toegang.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.24
  - number: '8.25'
    text: |-
      Onze Minister kan het rechtmatig verblijf ontzeggen, dan wel beëindigen, in geval van rechtsmisbruik of indien de
      vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens zouden
      hebben geleid tot weigering van toegang of verblijf. [Artikel 3.29][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.25
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: '8.26'
    text: 'Onze Minister kan regels stellen over de rechten die vreemdelingen ontlenen aan de volgende verdragen:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.a
    text: het Europees Vestigingsverdrag (Trb. 1957, 20);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.b
    text: het Vluchtelingenverdrag (Trb. 1954, 88);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.c
    text: het Verdrag betreffende de status van staatlozen (Trb. 1955, 42);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.d
    text: |-
      de op 12 september 1963 te Ankara gesloten Overeenkomst waarbij een associatie tot stand wordt gebracht tussen
      de Europese Economische Gemeenschap en Turkije (Trb. 1964, 217), het op 23 november 1970 te Brussel tot stand
      gekomen Aanvullend Protocol bij die overeenkomst (Trb. 1971, 70), Besluit 1/80 van de Associatieraad EEG-Turkije
      betreffende de ontwikkeling van de Associatie;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.e
    text: het Nederlands-Duits Vestigingsverdrag (Stb. 1906, 279);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.f
    text: het Nederlands-Zwitsers Tractaat (Stb. 1878, nr. 137);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.g
    text: het Nederlands-Amerikaans Vriendschapsverdrag (Trb. 1956, 40);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.h
    text: |-
      de Overeenkomst tussen het Koninkrijk der Nederlanden en de Republiek Suriname inzake het verblijf en de vestiging
      van wederzijde onderdanen (1975) (Trb. 1975, 133);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.i
    text: |-
      de Overeenkomst tussen het Koninkrijk der Nederlanden en de Republiek Suriname inzake de binnenkomst en het
      verblijf van wederzijdse onderdanen met bijlage en protocol inzake verkregen rechten (1981) (Trb. 1981, 35);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.j
    text: de Associatieverdragen EG met Roemenië (PbEG 1994, L 357) en Bulgarije (PbEG 1994, L 358);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.k
    text: |-
      de Overeenkomst tussen de Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat,
      anderzijds, over het vrije verkeer van personen (Trb. 2000, 16 en 86);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.l
    text: |-
      de Economische Partnerschapsovereenkomst tussen de CARIFORUM-staten, enerzijds, en de Europese Gemeenschap en haar
      lidstaten, anderzijds (Trb. 2009, 18);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.m
    text: |-
      de Handelsovereenkomst tussen de Europese Unie en haar lidstaten, enerzijds, en Colombia en Peru, anderzijds
      (Trb. 2012, 178);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.n
    text: |-
      het Associatieakkoord tussen de Europese Unie en de Europese Gemeenschap voor Atoomenergie en haar lidstaten,
      enerzijds, en Georgië, anderzijds (Trb. 2014, 210);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.o
    text: |-
      de Associatieovereenkomst tussen de Europese Unie en de Europese Gemeenschap voor Atoomenergie en haar lidstaten,
      enerzijds, en Oekraïne, anderzijds (Trb. 2014, 160);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: 8.26.p
    text: |-
      de Associatieovereenkomst tussen de Europese Unie en de Europese Gemeenschap voor Atoomenergie en hun lidstaten,
      enerzijds, en de Republiek Moldavië, anderzijds (Trb. 2014, 207).
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.26
  - number: '8.27'
    text: |-
      De bevoegdheid om vingerafdrukken af te nemen en te verwerken als bedoeld in
      [artikel 106a, eerste en tweede lid, van de Wet][ref1], geldt niet ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel106a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.27
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 106a
  - number: 8.27.a
    text: vreemdelingen die nog niet de leeftijd van zes jaar hebben bereikt, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.27
  - number: 8.27.b
    text: vreemdelingen bij wie het afnemen van alle vingerafdrukken blijvend fysiek onmogelijk is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.27
  - number: '8.28'
    text: |-
      Voor het vaststellen van de identiteit of de verificatie van de identiteit, op grond van
      [artikel 106a, eerste en tweede lid, van de Wet][ref1], worden digitaal platte vingerafdrukken afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel106a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.28
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 106a
  - number: 8.29.1
    text: |-
      De vingerafdrukken die zijn afgenomen voor het vaststellen van de identiteit worden opgeslagen in een daartoe door
      Onze Minister aangewezen bestand in de vreemdelingenadministratie.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.29
  - number: 8.29.2
    text: |-
      Het wijzigen en vernietigen van de vingerafdrukken in de vreemdelingenadministratie vindt plaats vanuit het
      bestand, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.29
  - number: 8.29.3
    text: |-
      Bij het verifiëren van de authenticiteit van het document, bedoeld in [artikel 9 van de Wet][ref1], of de
      verificatie van de identiteit van de vreemdeling worden de vingerafdrukken slechts opgeslagen en verwerkt voor de
      duur van de verificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 8.29.4
    text: |-
      Van de vingerafdrukken kunnen in andere bestanden in de vreemdelingenadministratie dan het bestand, bedoeld in het
      eerste lid, slechts kopieën worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.29
  - number: 8.30.1
    text: |-
      Indien naar het oordeel van de ambtenaar die de vingerafdrukken afneemt, het fysiek dan wel als gevolg van een
      tijdelijke verhindering onmogelijk is om van de vreemdeling te verlangen dat bij hem vingerafdrukken worden
      afgenomen, worden in ieder geval de vingerafdrukken afgenomen en opgeslagen van de vingers waarbij dit volgens de
      ambtenaar wel mogelijk is. Van de vingers waarvan geen vingerafdrukken zijn afgenomen, wordt met opgave van reden
      een aantekening gemaakt in de vreemdelingenadministratie.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.30
  - number: 8.30.2
    text: |-
      De vreemdeling van wie de vingers niet blijvend fysiek beschadigd zijn, wordt uitgenodigd om op een bij
      ministeriële regeling bepaald moment opnieuw zijn vingerafdrukken af te laten nemen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.30
  - number: 8.31.1
    text: |-
      Een gezichtsopname als bedoeld in [artikel 106a, eerste lid, van de Wet][ref1] wordt in ieder geval opnieuw gemaakt
      en opgeslagen en tien vingerafdrukken worden in ieder geval opnieuw afgenomen en opgeslagen van vreemdelingen die
      de leeftijd van twaalf jaar en van vreemdelingen die de leeftijd van achttien jaar hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel106a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 106a
  - number: 8.31.2
    text: |-
      Een gezichtsopname kan opnieuw worden gemaakt en opgeslagen en vingerafdrukken kunnen opnieuw worden afgenomen en
      opgeslagen in het geval een gezichtsopname onvoldoende gelijkenis toont of een gezichtsopname of vingerafdrukken
      van onvoldoende kwaliteit zijn.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.31
  - number: 8.32.1
    text: |-
      Bij ministeriële regeling kunnen, onverminderd het bepaalde in Verordening (EG) nr. 1030/2002 van de Raad van
      de Europese Unie van 13 juni 2002 betreffende de invoering van een uniform model voor verblijfstitels voor
      onderdanen van derde landen, documenten als bedoeld in [artikel 9 van de Wet][ref1] worden aangewezen, waarop de
      vingerafdrukken van de linker- en rechterwijsvinger worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.32
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 8.32.2
    text: |-
      Indien de kwaliteit van de afdrukken van de wijsvingers ontoereikend is voor opname op het document, worden
      vingerafdrukken van de middelvingers, ringvingers of duimen opgenomen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.32
  - number: 8.32.3
    text: |-
      Indien van slechts één vinger een afdruk van voldoende kwaliteit kan worden afgenomen, wordt uitsluitend de afdruk
      van die vinger opgenomen in het document.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.32
  - number: '8.33'
    text: |-
      In het geval dat bij de identiteitsvaststelling, het verifiëren van de authenticiteit van het document of de
      verificatie van de identiteit onduidelijkheid bestaat over de juistheid van vingerafdrukken wordt, indien dat
      noodzakelijk is voor de identiteitsvaststelling, het verifiëren van de authenticiteit van het document of de
      verificatie van de identiteit, een onderzoek door een dactyloscopisch deskundige uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.33
  - number: 8.34.1
    text: |-
      De ambtenaren die het beheer voeren over de vreemdelingenadministratie, hebben rechtstreekse toegang tot de
      gezichtsopnames en vingerafdrukken in de vreemdelingenadministratie, voor zover zij die toegang nodig hebben voor
      een goede vervulling van hun taak en Onze Minister hen daartoe heeft gemachtigd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.34
  - number: 8.34.2
    text: |-
      Van de beschikbaarstelling van gezichtsopnames en vingerafdrukken aan derden wordt een aantekening gemaakt van de
      datum waarop en de organisatie waaraan de gegevens zijn verstrekt. Deze aantekening wordt bewaard voor de duur van
      vijf jaar.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.34
  - number: 8.34.3
    text: |-
      De ambtenaren die met de uitvoering van de Wet zijn belast, kunnen de gezichtsopnames en vingerafdrukken
      rechtstreeks langs geautomatiseerde weg raadplegen, voor zover zij die gegevens nodig hebben voor een goede
      vervulling van hun taak en Onze Minister hen daartoe heeft gemachtigd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.34
  - number: '8.35'
    text: 'De in de vreemdelingenadministratie opgenomen gezichtsopnames en vingerafdrukken worden niet langer bewaard dan:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.35
  - number: 8.35.a
    text: vijf jaar nadat de aanvraag tot het verlenen van een machtiging tot voorlopig verblijf is afgewezen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.35
  - number: 8.35.b
    text: |-
      in geval van rechtmatig verblijf: vijf jaar nadat de betrokken vreemdeling, wiens rechtmatig verblijf is geëindigd,
      Nederland aantoonbaar heeft verlaten; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.35
  - number: 8.35.c
    text: |-
      indien tegen de vreemdeling een inreisverbod is uitgevaardigd of de vreemdeling ongewenst is verklaard: vijf jaar
      na afloop van de geldigheidsduur van het inreisverbod onderscheidenlijk de ongewenstverklaring.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.35
  - number: '8.36'
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.36
  - number: 8.36.a
    text: |-
      het bewaken van de juistheid en volledigheid van de gezichtsopnames en vingerafdrukken in de
      vreemdelingenadministratie en op de documenten, bedoeld in [artikel 9 van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.36
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 8.36.b
    text: de beveiliging van de gezichtsopnames en vingerafdrukken tegen verlies of onrechtmatige verwerking;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.36
  - number: 8.36.c
    text: |-
      de wijze waarop de gezichtsopnames en vingerafdrukken, op grond van [artikel 107, vijfde lid, van de Wet][ref1]
      beschikbaar worden gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.36
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 8.36.d
    text: |-
      de vernietiging van de gezichtsopnames en vingerafdrukken na afloop van de bewaartermijn, bedoeld in
      [artikel 8.35][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.36
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '3'
  - number: 8.36.e
    text: |-
      de verwijdering en vernietiging van de gezichtsopname en vingerafdrukken op verzoek van de vreemdeling, op
      grond dat deze de hoedanigheid heeft verkregen van gemeenschapsonderdaan anders dan door verkrijging van het
      Nederlanderschap.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.36
  - number: '9.1'
    text: |-
      [Artikel 3.107a, tweede lid, onderdeel c][ref1], zoals dat luidde op 31 december 2014, blijft van overeenkomstige
      toepassing op aanvragen als bedoeld in artikel 3.107a, eerste lid, die zijn gediend voor 1 januari 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 1a
        afdeling: '5'
  - number: 9.9.1
    text: |-
      Bij de toepassing van de [artikelen 3.86, eerste lid, onder c][ref1],[3.95][ref2] en [3.98][ref3] blijft buiten
      beschouwing de periode van de terbeschikkingstelling, die op het tijdstip van inwerkingtreding van de Wet reeds
      was beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '3'
  - number: 9.9.2
    text: |-
      Het eerste lid is niet van toepassing, indien de vreemdeling na beëindiging van de maatregel wederom een misdrijf
      heeft gepleegd, waartegen een gevangenisstraf van drie jaren of meer is bedreigd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel9.9
  - number: '9.12'
    text: |-
      Indien het bij koninklijke boodschap van 16 september 1999 ingediende voorstel van wet tot algehele herziening van
      de Vreemdelingenwet (Vreemdelingenwet 2000) (Kamerstukken I 1999–2000, nr. 26 732, nr. 263) nadat het tot wet is
      verheven, in werking treedt, treedt dit besluit op hetzelfde tijdstip in werking.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel9.12
  - number: '9.13'
    text: 'Dit besluit wordt aangehaald als: Vreemdelingenbesluit 2000.'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel9.13
