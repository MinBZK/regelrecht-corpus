      regulier voor bepaalde tijd ter uitvoering van verdragen of besluiten van volkenrechtelijke organisaties niet
      wordt ingetrokken om de reden dat ten behoeve van het verblijf van de vreemdeling geen verklaring als bedoeld in
      [artikel 18, eerste lid, onder h, van de Wet][ref1], is overgelegd. Daarbij kunnen nadere regels worden gesteld
