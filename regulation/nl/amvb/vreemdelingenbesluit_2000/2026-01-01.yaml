        paragraaf: '1'
        afdeling: '2'
  - number: 3.6.3
    text: |-
      In afwijking van het tweede lid, is het eerste lid niet van toepassing indien al eerder, bij afwijzing van een
      aanvraag tot het verlenen van een verblijfsvergunning regulier voor bepaalde tijd of een verblijfsvergunning
      asiel voor bepaalde tijd, met toepassing van het eerste lid of [artikel 3.6a, eerste lid][ref1], een beslissing is
      genomen omtrent ambtshalve verlening van een verblijfsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.6.4
    text: De verblijfsvergunning wordt verleend op de in het eerste lid als eerste genoemde van toepassing zijnde grond.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6
  - number: 3.6.5
    text: |-
      Het eerste, tweede en vierde lid zijn van overeenkomstige toepassing, indien de verblijfsvergunning regulier voor
      bepaalde tijd wordt ingetrokken of de aanvraag tot het verlengen van de geldigheidsduur ervan wordt afgewezen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6
  - number: 3.6a.1
    text: |-
      Bij afwijzing van de eerste aanvraag tot het verlenen van een verblijfsvergunning asiel voor bepaalde tijd kan
      alsnog ambtshalve een verblijfsvergunning regulier voor bepaalde tijd worden verleend:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6a
  - number: 3.6a.1.a
    text: |-
      aan de vreemdeling wiens uitzetting in strijd zou zijn met artikel 8 van het Verdrag tot bescherming van de rechten
      van de mens en de fundamentele vrijheden; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6a
  - number: 3.6a.1.b
    text: |-
      onder een beperking verband houdend met tijdelijke humanitaire gronden aan de vreemdeling die slachtoffer-aangever,
      slachtoffer of getuige-aangever is van mensenhandel, bedoeld in [artikel 3.48, eerste lid, onder a, b of c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.6a.2
    text: |-
      Het eerste lid is niet van toepassing, indien de aanvraag niet in behandeling is genomen op grond van
      [artikel 30 van de Wet][ref1], niet-ontvankelijk is verklaard op grond van [artikel 30a van de Wet][ref2] of
      op grond van het bepaalde in het Protocol (nr. 24) inzake asiel voor onderdanen van lidstaten van de Europese
      Unie, bij het Verdrag betreffende de Europese Unie, dan wel buiten behandeling is gesteld op grond van
      [artikel 30c van de Wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel30c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 30a
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 30c
  - number: 3.6a.3
    text: |-
      Indien de vreemdeling de eerste aanvraag tot het verlenen van de verblijfsvergunning asiel voor bepaalde tijd niet
      binnen zes maanden na de eerste inreis in Nederland heeft ingediend, kan een verblijfsvergunning regulier voor
      bepaalde tijd uitsluitend op grond van het eerste lid, onder b, alsnog ambtshalve worden verleend.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6a
  - number: 3.6a.4
    text: De verblijfsvergunning wordt verleend op de in het eerste lid als eerste genoemde van toepassing zijnde grond.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6a
  - number: 3.6a.5
    text: |-
      Het eerste en het vierde lid zijn van overeenkomstige toepassing, indien de verblijfsvergunning asiel voor bepaalde
      tijd wordt ingetrokken of de aanvraag tot het verlengen van de geldigheidsduur ervan wordt afgewezen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6a
  - number: 3.6b
    text: |-
      Onverminderd de [artikelen 3.6][ref1] en [3.6a][ref2] kan de verblijfsvergunning regulier voor bepaalde tijd
      ambtshalve worden verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.6b.a
    text: |-
      onder een beperking verband houdend met medische behandeling, tijdelijke humanitaire gronden of niet-tijdelijke
      humanitaire gronden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6b
  - number: 3.6b.b
    text: |-
      aan de vreemdeling met rechtmatig verblijf als bedoeld in [artikel 8, onder i, van de Wet][ref1], die behoort
      tot een van de in [artikel 17 van de Wet][ref2] of in [artikel 3.71, tweede lid][ref3], bedoelde categorieën en
      met wiens verblijf in Nederland voor een periode van langer dan 90 dagen Onze Minister binnen 90 dagen direct
      voorafgaande aan de aanmelding op grond van [artikel 4.47][ref4] heeft ingestemd;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '3'
  - number: 3.6b.c
    text: |-
      aan de vreemdeling wiens uitzetting in strijd zou zijn met artikel 8 van het Verdrag tot bescherming van de rechten
      van de mens en de fundamentele vrijheden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6b
  - number: 3.6ba.1
    text: |-
      Tot het moment waarop de beslissing op een eerste in Nederland ingediende aanvraag tot het verlenen van een
      verblijfsvergunning asiel voor bepaalde tijd of een eerste in Nederland ingediende aanvraag tot het verlenen
      van een verblijfsvergunning regulier voor bepaalde tijd onherroepelijk is geworden, kan ambtshalve een
      verblijfsvergunning regulier voor bepaalde tijd worden verleend onder een andere beperking dan voorzien in
      [artikel 3.4, eerste lid][ref1], indien sprake is van een schrijnende situatie die gelegen is in een samenstel van
      bijzondere omstandigheden die de vreemdeling betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6ba
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.6ba.2
    text: |-
      Het eerste lid is niet van toepassing, indien ambtshalve een verblijfsvergunning regulier voor bepaalde tijd wordt
      verleend op grond van [artikel 3.6][ref1], [3.6a][ref2] of [3.6b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6ba
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.6c.1
    text: |-
      Bij ministeriële regeling kunnen andere gevallen dan bedoeld in de [artikel 3.6 tot en met 3.6ba][ref1] worden
      aangewezen waarin de verblijfsvergunning regulier voor bepaalde tijd ambtshalve kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6c
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.6c.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de ambtshalve verlenging en wijziging van de
      verblijfsvergunning regulier voor bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6c
  - number: 3.7.1
    text: |-
      Aan de verblijfsvergunning regulier voor bepaalde tijd kan als voorschrift tot het stellen van zekerheid worden
      verbonden:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.7
  - number: 3.7.1.a
    text: |-
      het deponeren van een waarborgsom ter dekking van de kosten, verbonden aan de reis van de vreemdeling naar een
      plaats buiten Nederland waar zijn toegang is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.7
  - number: 3.7.1.b
    text: het stellen van een bankgarantie;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.7
  - number: 3.7.1.c
    text: het beschikken over een verzekering die de ziektekosten in Nederland volledig dekt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.7
  - number: 3.7.2
    text: In plaats van een waarborgsom kan een passagebiljet worden gedeponeerd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.7
  - number: 3.7.3
    text: In plaats van zekerheid kan zakelijke zekerheid worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.7
  - number: 3.7.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de zekerheidstelling.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      De waarborgsom, bedoeld in [artikel 3.7, eerste lid, onder a][ref1], wordt gedeponeerd bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.9.1
    text: |-
      De waarborgsom, bedoeld in [artikel 3.7, eerste lid, onder a][ref1], wordt in ieder geval door Onze Minister aan de
      rechthebbende teruggegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.9.1.a
    text: |-
      zodra de verblijfsvergunning regulier voor bepaalde tijd of het desbetreffende voorschrift, is ingetrokken, dan wel
      de geldigheidsduur van de verblijfsvergunning is verstreken;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.9
  - number: 3.9.1.b
    text: |-
      zodra aan de vreemdeling een verblijfsvergunning als bedoeld in [artikel 8, onder b, van de Wet][ref1], is
      verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.9.1.c
    text: zodra de vreemdeling Nederlander wordt of krachtens enige wet als Nederlander moet worden behandeld;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.9
  - number: 3.9.1.d
    text: bij overlijden van de vreemdeling, dan wel
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.9
  - number: 3.9.1.e
    text: uiterlijk vijf jaar nadat de waarborgsom is gestort.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.9
  - number: 3.9.2
    text: |-
      Indien een waarborgsom wordt teruggegeven wegens het intrekken of het verstrijken van de geldigheidsduur van
      de verblijfsvergunning, bedoeld in het eerste lid, onder a, vindt de teruggave plaats met aftrek van de door de
      overheid gemaakte of te maken kosten, verbonden aan de reis van de vreemdeling naar een plaats buiten Nederland
      waar zijn toegang is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.9
  - number: 3.10.1
    text: |-
      Onze Minister berekent rente over waarborgsommen, gedeponeerd krachtens [artikel 3.7, eerste lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.10.2
    text: |-
      De rente wordt berekend vanaf het kalenderjaar volgend op het jaar waarin de waarborgsom is gestort. Over het
      kalenderjaar waarin de waarborgsom is gedeponeerd, wordt geen rente vergoed. Bij de berekening van de termijn
      waarover rente wordt vergoed, wordt het kalenderjaar waarin de waarborgsom wordt terugbetaald als vol jaar
      meegeteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.10
  - number: '3.11'
    text: |-
      De waarborgsom wordt teruggegeven en de rente wordt uitbetaald zo spoedig mogelijk nadat één van de in
      [artikel 3.9, eerste lid][ref1], genoemde gronden zich voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.12.1
    text: |-
      Verplichtingen, voortvloeiende uit het stellen van zakelijke zekerheid overeenkomstig
      [artikel 3.7, derde lid][ref1], hebben uitsluitend betrekking op kosten, veroorzaakt binnen vijf jaren, nadat de
      verblijfsvergunning regulier voor bepaalde tijd is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.12.2
    text: 'Onze Minister kan bepalen dat de in het eerste lid genoemde termijn korter is dan vijf jaren, indien:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.12
  - number: 3.12.2.a
    text: op andere wijze voldoende zekerheid is gesteld;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.12
  - number: 3.12.2.b
    text: de vreemdeling Nederland definitief heeft verlaten;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.12
  - number: 3.12.2.c
    text: |-
      aan de vreemdeling een verblijfsvergunning onder een andere beperking of een verblijfsvergunning voor onbepaalde
      tijd is verleend; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.12
  - number: 3.12.2.d
    text: de vreemdeling de Nederlandse nationaliteit heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.12
  - number: 3.13.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd wordt onder een beperking verband houdend met verblijf als
      familie- of gezinslid, verleend aan het in [artikel 3.14][ref1] genoemde gezinslid van de in [artikel 3.15][ref2]
      bedoelde hoofdpersoon, indien wordt voldaan aan alle in de [artikelen 3.16 tot en met 3.22a][ref3] genoemde
      voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.13.2
    text: In de overige gevallen kan de in het eerste lid bedoelde verblijfsvergunning worden verleend.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.13
  - number: '3.14'
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend aan:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.14.a
    text: |-
      de vreemdeling van 21 jaar of ouder die met de hoofdpersoon een naar Nederlands internationaal privaatrecht geldig
      huwelijk of een naar Nederlands internationaal privaatrecht geldig geregistreerd partnerschap is aangegaan;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.14
  - number: 3.14.b
    text: |-
      de vreemdeling van 21 jaar of ouder, die met de hoofdpersoon een naar behoren geattesteerde duurzame en exclusieve
      relatie onderhoudt, waarin de partners:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.14
  - number: 3.14.b.1°
    text: |-
      niet tot elkaar in een zodanig nauwe relatie staan dat die naar Nederlands recht een huwelijksbeletsel zou vormen,
      en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.14
  - number: 3.14.b.2°
    text: |-
      ongehuwd zijn en geen in Nederland geregistreerd partnerschap zijn aangegaan, tenzij het huwelijk door wettelijke
      beletselen waarop geen invloed kan worden uitgeoefend, niet is ontbonden; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.14
  - number: 3.14.c
    text: |-
      het minderjarige biologische of juridische kind van de hoofdpersoon, dat naar het oordeel van Onze Minister
      feitelijk behoort en reeds in het land van herkomst feitelijk behoorde tot het gezin van die hoofdpersoon en dat
      onder het rechtmatige gezag van die hoofdpersoon staat.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.14
  - number: 3.15.1
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend aan het in [artikel 3.14][ref2]
      bedoelde gezinslid van:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.15.1.a
    text: een Nederlander van 21 jaar of ouder, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.15
  - number: 3.15.1.b
    text: |-
      een vreemdeling van 21 jaar of ouder met rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], dat niet-tijdelijk is in de zin van
      [artikel 3.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.15.2
    text: |-
      Indien de vreemdeling als gezinslid in Nederland wil verblijven bij een hoofdpersoon die houder is van de
      verblijfsvergunning regulier voor bepaalde tijd onder een beperking verband houdend met het doorbrengen van verlof
      in Nederland en die hoofdpersoon werkzaam is aan boord van een zeeschip dat op grond van voor Nederland geldende
      rechtsregels gerechtigd is de vlag van het Koninkrijk te voeren of op een mijnbouwinstallatie op het continentaal
      plat, wordt de verblijfsvergunning eerst verleend, nadat deze hoofdpersoon een arbeidsverleden aan boord van een
      zeeschip dat op grond van voor Nederland geldende rechtsregels gerechtigd is de vlag van het Koninkrijk te voeren
      of op een mijnbouwinstallatie op het continentaal plat heeft van ten minste zeven jaar.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.15
  - number: 3.15.3
    text: |-
      Indien de hoofdpersoon bij wie de vreemdeling als gezinslid in Nederland wil verblijven, houder is van de
      verblijfsvergunning regulier voor bepaalde tijd wordt de verblijfsvergunning aan het gezinslid niet verleend, dan
      nadat de hoofdpersoon ten minste een jaar rechtmatig in Nederland heeft verbleven, tenzij:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.15
  - number: 3.15.3.a
    text: |-
      de hoofdpersoon in Nederland verblijft voor een tijdelijk doel als bedoeld in
      [artikel 2.1 van het Besluit inburgering][ref1] of [artikel 2.2 van het Besluit inburgering 2021][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045555
        artikel: '2'
  - number: 3.15.3.b
    text: |-
      de hoofdpersoon onder het toepassingsbereik valt van artikel 13 van Associatiebesluit nr. 1/80 van de
      Associatieraad EEG-Turkije betreffende de ontwikkeling van de Associatie, het Nederlands-Amerikaans
      Vriendschapsverdrag (Trb. 1956, 40) of het Verdrag van handel en scheepvaart tussen Nederland en Japan (Stb. 1913,
      389);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.15
  - number: 3.15.3.c
    text: |-
      niet-toelating als gezinslid in strijd zou zijn met de belangen van minderjarige kinderen, bedoeld in artikel 5,
      vijfde lid, van richtlijn 2003/86/EG van de Raad van 22 september 2003 inzake het recht op gezinshereniging (PbEG
      2003, L 251).
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.15
  - number: '3.16'
    text: |-
      Zolang de vreemdeling of de hoofdpersoon met meer dan één andere persoon tegelijkertijd door een huwelijk of een
      partnerschap is verbonden, wordt de verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], slechts
      verleend aan één echtgenoot, geregistreerde partner of partner tegelijkertijd, alsmede aan de uit die vreemdeling
      geboren minderjarige kinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: '3.17'
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend, indien de vreemdeling en de
      hoofdpersoon samenwonen en een gemeenschappelijke huishouding voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: '3.18'
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend, indien de vreemdeling
      beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel waarvoor
      de verblijfsvergunning is aangevraagd of behoort tot één van de in [artikel 17 van de Wet][ref2] of in
      [artikel 3.71, tweede lid][ref3], bedoelde categorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '3.19'
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend, indien de vreemdeling beschikt
      over een geldig document voor grensoverschrijding, dan wel naar het oordeel van Onze Minister heeft aangetoond
      dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van een geldig
      document voor grensoverschrijding kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: '3.20'
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend, indien de vreemdeling geen
      gevaar vormt voor de openbare orde of nationale veiligheid. De [artikelen 3.77][ref2] en [3.78][ref3] zijn van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '3.21'
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend, indien de vreemdeling
      bereid is een onderzoek naar of behandeling voor tuberculose te ondergaan en daaraan mee te werken, dan wel de
      nationaliteit bezit van een van de bij ministeriële regeling vast te stellen landen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.22.1
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend, indien de
      hoofdpersoon duurzaam en zelfstandig beschikt over voldoende middelen van bestaan als bedoeld in
      [artikel 3.74, eerste lid, onder a][ref2].


