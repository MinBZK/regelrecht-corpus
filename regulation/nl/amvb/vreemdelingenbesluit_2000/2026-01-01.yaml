        artikel: '17'
  - number: 3.5.3
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van verplichtingen die voortvloeien uit verdragen of uit
      verbindende besluiten van volkenrechtelijke organisaties, gevallen worden aangewezen waarin het verblijfsrecht, in
      afwijking van het tweede lid, niet-tijdelijk van aard is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.5
  - number: 3.5.4
    text: |-
      Indien de verblijfsvergunning is verleend onder een andere beperking dan genoemd in het tweede lid, is het
      verblijfsrecht niet-tijdelijk, tenzij bij de verlening van de verblijfsvergunning anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.5
  - number: 3.6.1
    text: |-
      Bij afwijzing van een aanvraag tot het verlenen van een verblijfsvergunning regulier voor bepaalde tijd kan alsnog
      ambtshalve een dergelijke verblijfsvergunning worden verleend:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6
  - number: 3.6.1.a
    text: |-
      aan de vreemdeling wiens uitzetting in strijd zou zijn met artikel 8 van het Verdrag tot bescherming van de rechten
      van de mens en de fundamentele vrijheden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6
  - number: 3.6.1.b
    text: |-
      onder een beperking verband houdend met tijdelijke humanitaire gronden aan de vreemdeling die slachtoffer-aangever,
      slachtoffer of getuige-aangever is van mensenhandel, bedoeld in [artikel 3.48, eerste lid, onder a, b of c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6
