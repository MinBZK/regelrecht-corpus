      [artikel 18, eerste lid, onder i, van de wet][ref2] ingetrokken, indien uitzetting van de vreemdeling in strijd zou
      zijn met artikel 8 van het Verdrag tot bescherming van de rechten van de mens en de fundamentele vrijheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.91e
    references:
