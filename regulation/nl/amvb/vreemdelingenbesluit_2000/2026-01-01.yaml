  - number: 3.22.2
    text: |-
      In afwijking van het eerste lid wordt de verblijfsvergunning eveneens verleend, indien de hoofdpersoon de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft
      bereikt of naar het oordeel van Onze Minister blijvend en volledig arbeidsongeschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 3.22a.1
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend, indien de
      hoofdpersoon ten behoeve van het verblijf van de vreemdeling een verklaring heeft afgelegd als bedoeld in
      [artikel 2a, tweede lid, van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.22a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2a
  - number: 3.22a.2
    text: 'In afwijking van het eerste lid, wordt de verblijfsvergunning eveneens verleend, indien:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.22a
  - number: 3.22a.2.a
    text: |-
      wordt voldaan aan de voorwaarden gesteld in hoofdstuk IV en artikel 16 van Richtlijn nr. 2003/86/EG van de Raad van
      22 september 2003 inzake het recht op gezinshereniging, in welk geval Onze Minister de hoofdpersoon als referent
      aanwijst;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.22a
  - number: 3.22a.2.b
    text: |-
      de hoofdpersoon bij wie de vreemdeling als gezinslid wil verblijven een Turkse werknemer is als bedoeld in
      artikelen 6 en 13 van Besluit 1/80 van de Associatieraad EEG-Turkije betreffende de ontwikkeling van de Associatie,
      in welk geval deze hoofdpersoon niet als referent wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.22a
  - number: 3.23.1
    text: |-
      De verblijfsvergunning, bedoeld in [artikel 3.13, eerste lid][ref1], wordt verleend aan de in Nederland geboren
      vreemdeling, die het hoofdverblijf niet buiten Nederland heeft verplaatst en die naar het oordeel van Onze Minister
      feitelijk is blijven behoren tot het in Nederland gevestigde gezin van de ouder, die rechtmatig verblijf heeft
      als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2], en die sedert de geboorte van de
      vreemdeling het hoofdverblijf niet buiten Nederland heeft verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.23.2
    text: |-
      Indien de aanvraag is ontvangen voordat de vreemdeling de leeftijd van zes maanden heeft bereikt, wordt de
      verblijfsvergunning eveneens verleend aan de buiten Nederland geboren vreemdeling, die naar het oordeel van Onze
      Minister feitelijk is blijven behoren tot het gezin van beide ouders, die sedert de geboorte van de vreemdeling
      rechtmatig verblijf als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], hebben en het
      hoofdverblijf niet buiten Nederland hebben verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.23.3
    text: |-
      Indien de vader van de in het tweede lid bedoelde vreemdeling onbekend is, wordt de verblijfsvergunning
      verleend, indien de moeder sedert de geboorte van de vreemdeling rechtmatig verblijf op grond van
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1] heeft en het hoofdverblijf niet buiten Nederland
      heeft verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.23.4
    text: 'De verblijfsvergunning wordt verleend, indien:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23
  - number: 3.23.4.a
    text: |-
      de vreemdeling beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel
      waarvoor de vreemdeling in Nederland wil verblijven, of behoort tot één van de in [artikel 17 van de Wet][ref1] of
      in [artikel 3.71, tweede lid][ref2], bedoelde categorieën;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.23.4.b
    text: |-
      de vreemdeling beschikt over een geldig document voor grensoverschrijding, of naar het oordeel van Onze Minister
      heeft aangetoond dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit
      van een geldig document voor grensoverschrijding kan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23
  - number: 3.23.4.c
    text: |-
      de vreemdeling bereid is een onderzoek naar of behandeling voor tuberculose te ondergaan en daaraan mee te werken,
      of de nationaliteit bezit van een van de bij ministeriële regeling vast te stellen landen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23
  - number: 3.23.4.d
    text: |-
      de vreemdeling geen gevaar vormt voor de openbare orde als bedoeld in de [artikelen 3.77][ref1] en [3.78][ref2] of
      voor de nationale veiligheid;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23
    references:
