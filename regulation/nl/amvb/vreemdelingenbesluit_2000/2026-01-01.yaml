  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Justitie van 18 augustus 2000, nr. 5077321/00/6;

    Gelet op de artikelen 2, vierde lid, onder b, vijfde en zesde lid, 3, eerste lid, onder d, en tweede lid, 4, derde
    lid, 8, onder f en g, 10, eerste lid, 11, eerste en derde lid, 12, eerste en tweede lid, 14, tweede en derde lid,
    15, 16, tweede lid, 17, eerste lid, onder g, 18, tweede lid, 21, zesde lid, 22, tweede lid, 24, eerste lid, 28,
    tweede lid, 29, tweede lid, 31, derde lid, 32, tweede lid, 35, tweede lid, 37, 39, derde lid, 46, tweede lid , 48,
    vierde lid, 50, eerste en zesde lid, 51, derde lid, 52, eerste lid, 54, eerste lid, 56, eerste lid, 60, 66, 68,
    derde lid, 69, tweede lid, 71, tweede lid, 82, tweede lid, onder a, 97, 102, 103, 107, vierde lid, 109, eerste lid,
    111 en 112, van de Vreemdelingenwet 2000;

    De Raad van State gehoord (advies van 26 oktober 2000, nr. W03.00.0379/I);

    Gezien het nader rapport van de Staatssecretaris van Justitie van 21 november 2000, nr. 5059940/00/DVB;

    Hebben goedgevonden en verstaan;
  url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - Beneluxgebied: het gezamenlijke
      grondgebied in Europa van het Koninkrijk België, van het Groothertogdom Luxemburg en van het Koninkrijk der
      Nederlanden;
        - Benelux-onderdanen: de onderdanen van de staten die partij zijn bij het op 3 februari 1958 te 's-Gravenhage tot
      stand gekomen Verdrag tot instelling van de Benelux Economische Unie (Trb. 1958, 18);
        - Besluit inburgering: het [Besluit inburgering][ref1], zoals dat besluit luidde onmiddellijk voorafgaand aan het
      tijdstip waarop het [Besluit inburgering 2021][ref2] in werking treedt;
        - continentaal plat: hetgeen daaronder wordt verstaan in [artikel 1, onderdeel c, van de Mijnbouwwet][ref3];
        - cruiseschip: hetgeen daaronder in de Schengengrenscode wordt verstaan;
        - de Wet: de [Vreemdelingenwet 2000][ref4];
        - Europese blauwe kaart: de verblijfsvergunning regulier voor bepaalde tijd, afgegeven ter uitvoering van artikel
      9 van [Richtlijn (EU) 2021/1883](32021L1883), dan wel een door een andere staat die partij is bij het Verdrag
      betreffende de werking van de Europese Unie afgegeven verblijfsvergunning ter uitvoering van dat artikel;
        - EU-verblijfsvergunning voor langdurig ingezetenen: de EU-verblijfsvergunning voor langdurig ingezetenen, bedoeld
      in [artikel 45a van de Wet][ref5];
        - gezinsvorming: gezinshereniging van de echtgenoot, geregistreerde partner of niet-geregistreerde partner, voor
      zover de gezinsband tot stand is gekomen op een tijdstip waarop de hoofdpersoon in Nederland hoofdverblijf had;
        - luchtvaartuig: hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, onder b, van de Luchtvaartwet][ref6];
        - mijnbouwinstallatie: hetgeen daaronder wordt verstaan in [artikel 1, onderdeel o, van de Mijnbouwwet][ref7];
        - richtlijn langdurig ingezetenen: [richtlijn nr. 2003/109/EG](32003L0109) van de Raad van de Europese Unie van
      25 november 2003 betreffende de status van langdurig ingezeten onderdanen van derde landen, zoals gewijzigd door
      [richtlijn 2011/51](32011L0051)/EU van het Europees Parlement en de Raad teneinde haar werkingssfeer uit te breiden
      tot personen die internationale bescherming genieten;
        - [richtlijn 2014/66](32014L0066)/EU: [richtlijn 2014/66](32014L0066)/EU van het Europees Parlement en de Raad van
      15 mei 2014 betreffende de voorwaarden voor toegang en verblijf van onderdanen van derde landen in het kader van
      een overplaatsing binnen een onderneming;
        - *richtlijn (EU) 2016/801:* richtlijn (EU) 2016/801 van het Europees Parlement en de Raad van 11 mei 2016
      betreffende de voorwaarden voor toegang en verblijf van derdelanders met het oog op onderzoek, studie, stages,
      vrijwilligerswerk, scholierenuitwisseling, educatieve projecten of au-pairactiviteiten;
        - *Richtlijn (EU) 2021/1883:* [richtlijn (EU) 2021/1883](32021L1883) van het Europees Parlement en de Raad van
      20 oktober 2021 betreffende de voorwaarden voor toegang en verblijf van onderdanen van derde landen met het oog op
      een hooggekwalificeerde baan, en tot intrekking van [Richtlijn 2009/50/EG](32009L0050) van de Raad;
        - Schengeninformatiesysteem: het in artikel 1, eerste lid, van de Verordening (EG) nr. 1987/2006 van het
      Europees parlement en de Raad van 20 december 2006 betreffende de instelling, de werking en het gebruik van het
      Schengensysteem van de tweede generatie (SIS II) bedoelde informatiesysteem;
        - Schengen Uitvoeringsovereenkomst: de op 19 juni 1990 te Schengen tot stand gekomen Overeenkomst ter uitvoering
      van het tussen de regeringen van de staten van de Benelux Economische Unie, de bondsrepubliek Duitsland en de
      Franse republiek op 14 juni 1985 te Schengen gesloten akkoord betreffende de geleidelijke afschaffing van de
      controles aan de gemeenschappelijke grenzen (Trb. 1990, 145), alsmede de daarop gebaseerde Protocollen;
        - Schengengebied: het grondgebied van de staten waarop de Schengengrenscode en de Schengen Uitvoeringsovereenkomst
      van toepassing zijn;
        - schip: hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, onder b, van de Scheepvaartverkeerswet][ref8];
        - staatloze: de persoon die voor de toepassing van het op 28 september 1954 te New York gesloten verdrag
      betreffende de status van staatlozen (Trb. 1955, 42 en 1957, 22) als staatloze geldt;
        - tewerkstellingsvergunning: de vergunning, bedoeld in [artikel 1, onder e, van de Wet arbeid vreemdelingen][ref9];
        - verblijfsvergunning asiel voor bepaalde tijd: de verblijfsvergunning, bedoeld in [artikel 28 van de Wet][ref10];
        - verblijfsvergunning asiel voor onbepaalde tijd: de verblijfsvergunning, bedoeld in
      [artikel 33 van de Wet][ref11];
        - verblijfsvergunning regulier voor bepaalde tijd: de verblijfsvergunning, bedoeld in
      [artikel 14 van de Wet][ref12];
        - verblijfsvergunning regulier voor onbepaalde tijd: de verblijfsvergunning, bedoeld in
      [artikel 20 van de Wet][ref13];
        - vliegtuig: hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, onder c, van de Luchtvaartwet][ref14];
        - vreemdelingenadministratie: de vreemdelingenadministratie, bedoeld in [artikel 107 van de Wet][ref15];
        - Wet inburgering: de [Wet inburgering][ref16], zoals die wet luidde onmiddellijk voorafgaand aan het tijdstip
      waarop de [Wet inburgering 2021][ref17] in werking treedt;
        - zeeschip: hetgeen daaronder wordt verstaan in
      [artikel 1, tweede lid, onder c, van de Scheepvaartverkeerswet][ref18].


