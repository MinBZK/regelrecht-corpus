  - number: '3.96'
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning regulier voor onbepaalde tijd wordt niet afgewezen op de
      in [artikel 21, eerste lid, onder b, van de Wet][ref1] genoemde grond dat de vreemdeling onjuiste gegevens heeft
      verstrekt dan wel gegevens heeft achtergehouden die tot afwijzing van de oorspronkelijke aanvraag tot het verlenen,
      verlengen of wijzigen van een verblijfsvergunning als bedoeld in [artikel 14][ref2] zouden hebben geleid, indien
      sedert de verlening, verlenging of wijziging een periode van twaalf jaren is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.96
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.96a.1
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning regulier voor onbepaalde tijd wordt
      afgewezen, indien de vreemdeling niet beschikt over een diploma of certificaat als bedoeld in
      [artikel 6, tweede lid, van de Wet inburgering 2021][ref1] of een diploma, certificaat of ander document als
      bedoeld in [artikel 4, eerste lid, onderdeel b, van de Wet inburgering 2021][ref2] dan wel indien hij het
      inburgeringsexamen, bedoeld in [artikel 7, eerste lid, onderdeel a, van de Wet inburgering][ref3] of een diploma,
      certificaat of ander document als bedoeld in [artikel 5, eerste lid, onderdeel c, van die wet][ref4] niet heeft
      behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.96a
    references:
