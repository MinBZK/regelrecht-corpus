  - number: 1.4.1
    text: |-
      Onze Minister kan van zijn bevoegdheden mandaat verlenen aan de burgemeester, de korpschef en de bevelhebber van de
      Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.4
  - number: 1.4.2
    text: |-
      De burgemeester, de korpschef en de bevelhebber van de Koninklijke marechaussee kunnen ondermandaat verlenen aan de
      onder hen ressorterende ambtenaren voorzover dat in overeenstemming is met de taak en functie van de desbetreffende
      ambtenaar.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.4
  - number: '1.6'
    text: |-
      De commissie kan haar werkwijze nader vaststellen in een reglement van orde als bedoeld in
      [artikel 21 van de Kaderwet adviescolleges][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel21
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '21'
  - number: 1.7.1
    text: De commissie adviseert schriftelijk en met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.7
  - number: 1.7.2
    text: |-
      De adviezen vermelden de namen van de personen die ter vergadering aanwezig zijn geweest. Zij vermelden tevens met
      welke stemmenverhouding zij zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.7
  - number: 1.7.3
    text: Het advies wordt door de voorzitter en de secretaris ondertekend.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.7
  - number: '1.8'
    text: |-
      Ten behoeve van het verblijf van een vreemdeling die in Nederland verblijft of wil verblijven als familie- of
      gezinslid, kan als referent optreden de hoofdpersoon bij wie de vreemdeling als familie- of gezinslid verblijft of
      wil verblijven.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.8
  - number: 1.9.1
    text: |-
      Ten behoeve van het verblijf van een vreemdeling die in Nederland verblijft of wil verblijven voor het verrichten
      van arbeid als kennismigrant, kan als referent optreden de krachtens [artikel 2c van de Wet][ref1] als referent
      erkende werkgever, met wie de vreemdeling een arbeidsovereenkomst of gastovereenkomst heeft gesloten of die
      de vreemdeling heeft aangesteld en die, voor zover op grond van de [Handelsregisterwet 2007][ref2] vereist, is
      ingeschreven in het handelsregister, bedoeld in [artikel 2 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0021777
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0021777
      - id: ref3
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 1.9.2
    text: |-
      Ten behoeve van het verblijf van een vreemdeling, die in Nederland verblijft of wil verblijven als houder van de
      Europese blauwe kaart, kan als referent optreden de werkgever, met wie de vreemdeling een arbeidsovereenkomst of
      gastovereenkomst heeft gesloten of die de vreemdeling heeft aangesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.9
  - number: 1.9.3
    text: |-
      Ten behoeve van het verblijf van een vreemdeling die in Nederland verblijft of wil verblijven voor een
      overplaatsing binnen een onderneming, kan als referent optreden de gastentiteit in de zin van artikel 3, onder d,
      van [richtlijn 2014/66](32014L0066)/EU.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.9
  - number: '1.10'
    text: |-
      Ten behoeve van het verblijf van een vreemdeling die in Nederland verblijft of wil verblijven voor het
      verrichten van seizoenarbeid of arbeid in loondienst, kan als referentoptreden de werkgever, die, voor zover
      op grond van de [Handelsregisterwet 2007][ref1] vereist, is ingeschreven in het handelsregister, bedoeld in
      [artikel 2 van die wet][ref2], en die:


      [ref1]: https://wetten.overheid.nl/BWBR0021777
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0021777
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 1.10.a
    text: |-
      met de vreemdeling een arbeidsovereenkomst heeft gesloten of die de vreemdeling heeft aangesteld, dan wel, indien
      geen sprake is van een arbeidsovereenkomst of aanstelling,
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.10
  - number: 1.10.b
    text: |-
      ten behoeve van die arbeid in het bezit is gesteld van een tewerkstellingsvergunning of een
      tewerkstellingsvergunning heeft aangevraagd, dan wel, indien geen tewerkstellingsvergunning is vereist,
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.10
  - number: 1.10.c
    text: de vreemdeling feitelijk tewerkstelt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.10
  - number: '1.11'
    text: |-
      Ten behoeve van het verblijf van een vreemdeling die in Nederland verblijft of wil verblijven voor het
      verrichten van onderzoek in de zin van richtlijn (EU) 2016/801, kan als referent optreden de krachtens
      [artikel 2c van de Wet][ref1] als referent erkende onderzoeksinstelling, waarmee de vreemdeling een
      gastovereenkomst als bedoeld in artikel 10 van richtlijn (EU) 2016/801 heeft gesloten, die, voor zover op
      grond van de [Handelsregisterwet 2007][ref2] vereist, is ingeschreven in het handelsregister, bedoeld in
      [artikel 2 van die wet][ref3], en die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0021777
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0021777
      - id: ref3
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 1.11.a
    text: |-
      een publieke onderzoeksinstelling is als bedoeld in
      [artikel 2.1, eerste lid, onder b, van het Besluit uitvoering Wet arbeid vreemdelingen 2022][ref1] en die
      functieprofielen zoals opgenomen in het universitaire systeem van functieordenen onder de functiefamilie «onderzoek
      en onderwijs» hanteert voor onderzoekers in loondienst;


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
  - number: 1.11.b
    text: |-
      een publieke onderzoeksinstelling is, die is opgenomen in de bijlage behorende bij de Wet op het hoger onderwijs en
      wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.11
  - number: 1.11.c
    text: |-
      een particuliere onderzoeksinstelling is, die is opgenomen in het National Academic Research and Collaborations
      Information System;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.11
  - number: 1.11.d
    text: |-
      een particuliere onderzoeksinstelling is, waaraan met betrekking tot
      het lopende of het vorige kalenderjaar een S&O-verklaring als bedoeld in
      [artikel 1, eerste lid, van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref1]
      is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
  - number: '1.12'
    text: |-
      Ten behoeve van het verblijf van een vreemdeling die in Nederland verblijft of wil verblijven voor lerend werken,
      kan als referent optreden de werkgever, die, voor zover op grond van de [Handelsregisterwet 2007][ref1] vereist,
      is ingeschreven in het handelsregister, bedoeld in [artikel 2 van die wet][ref2], en met wie de vreemdeling een
      leer-werkovereenkomst heeft gesloten of een stageovereenkomst met de elementen, genoemd in artikel 13, eerste lid,
      onderdeel a, onder i tot en met v, van richtlijn (EU) 2016/801.


      [ref1]: https://wetten.overheid.nl/BWBR0021777
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0021777
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '2'
  - number: '1.13'
    text: |-
      Ten behoeve van het verblijf van een vreemdeling die in Nederland verblijft of wil verblijven voor studie, kan als
      referent optreden de krachtens [artikel 2c van de Wet][ref1] als referent erkende onderwijsinstelling, waaraan de
      vreemdeling onderwijs volgt of wil volgen, die, voor zover op grond van de [Handelsregisterwet 2007][ref2] vereist,
      is ingeschreven in het handelsregister, bedoeld in [artikel 2 van die wet][ref3], en die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0021777
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0021777
      - id: ref3
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 1.13.a
    text: |-
      geaccrediteerd hoger onderwijs aanbiedt, zoals geregistreerd in de Registratie instellingen en opleidingen, bedoeld
      in [artikel 6.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
  - number: 1.13.b
    text: |-
      voortgezet onderwijs aanbiedt als bedoeld in [artikel 1.4 van de Wet voortgezet onderwijs 2020][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel1
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '1'
  - number: 1.13.c
    text: |-
      beroepsonderwijs aanbiedt als bedoeld in [artikel 1.2.1 van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 1.13.d
    text: |-
      opleidingen verzorgt in het kader van het ontwikkelingssamenwerkingsbeleid van het Ministerie van Buitenlandse
      Zaken, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.13
  - number: 1.13.e
    text: |-
      opleidingsactiviteiten faciliteert in het kader van de [Wet op het specifiek cultuurbeleid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005904
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0005904
  - number: '1.14'
    text: |-
      Ten behoeve van het verblijf van een vreemdeling die in Nederland verblijft of wil verblijven in het kader
      van uitwisseling, kan als referent optreden de krachtens [artikel 2c van de Wet][ref1] als referent erkende
      uitwisselingsorganisatie, die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
  - number: 1.14.a
    text: een culturele doelstelling nastreeft;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.14
  - number: 1.14.b
    text: |-
      ten behoeve van die vreemdeling een door Onze Minister goedgekeurd uitwisselingsprogramma als bedoeld in
      [artikel 3.43, eerste lid, onder a][ref1], uitvoert, en


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 1.14.c
    text: |-
      voor zover op grond van de [Handelsregisterwet 2007][ref1] vereist, is ingeschreven in het handelsregister, bedoeld
      in [artikel 2 van die wet][ref2], of als au-pairbureau, voor zover vereist, is ingeschreven in een handelsregister
      van een andere lidstaat van de Europese Unie of Europese Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0021777
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0021777
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '2'
  - number: '1.15'
    text: |-
      Onverminderd de [artikelen 1.8 tot en met 1.14][ref1] kan een religieuze of levensbeschouwelijke organisatie
      slechts als referent optreden, indien zij, voor zover dit op grond van de [Handelsregisterwet 2007][ref2] is
      vereist, is ingeschreven in het handelsregister, bedoeld in [artikel 2 van die wet][ref3], en haar solvabiliteit,
      continuïteit en betrouwbaarheid voldoende is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021777
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.15
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0021777
      - id: ref3
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 1.16.1
    text: |-
      De referent van een vreemdeling die in Nederland verblijft in het kader van uitwisseling, draagt zorg voor de
      juiste uitvoering van het uitwisselingsprogramma, bedoeld in [artikel 3.43, eerste lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.16
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 1.16.2
    text: |-
      De referent van een vreemdeling die in Nederland verblijft of wil verblijven in het kader van uitwisseling, voor
      arbeid als kennismigrant, voor arbeid als houder van een Europese blauwe kaart of voor studie, draagt zorg voor een
      zorgvuldige selectie en werving van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.16
  - number: 1.16.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de voorgaande leden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.16
  - number: '1.17'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent deze paragraaf. Daarbij kan in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.17
  - number: 1.17.a
    text: |-
      worden voorzien in nadere concretisering van de zorgplichten, bedoeld in [artikel 1.16][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel1
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 1.17.b
    text: worden bepaald in welke gevallen de referent rechtspersoonlijkheid moet hebben, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.17
  - number: 1.17.c
    text: worden voorzien in nadere regels omtrent de beëindiging van het referentschap.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.17
  - number: 1.18.1
    text: |-
      Bij de beoordeling van de aanvraag om erkenning als referent worden met betrekking tot de continuïteit
      en solvabiliteit van de aanvrager in ieder geval gegevens betrokken uit het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref1], dan wel uit het handelsregister van een andere lidstaat van de
      Europese Unie of Europese Economische Ruimte in geval van een au-pairbureau uit een dergelijke staat.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 1.18.2
    text: |-
      De aanvraag om erkenning als referent kan in ieder geval worden afgewezen, indien de aanvrager failliet is
      verklaard of aan hem surséance van betaling is verleend.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.18
  - number: 1.18.3
    text: |-
      De aanvraag om erkenning als referent, verband houdend met uitwisseling als au pair, wordt niet
      afgewezen op de grond dat de aanvrager niet is ingeschreven in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref1], indien de aanvrager is ingeschreven, voor zover vereist, in een
      handelsregister van een andere lidstaat van de Europese Unie of Europese Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
