        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.115.2.a
    text: |-
      in geval van overschrijding van de termijnen, bedoeld in de [artikelen 3.113, eerste en derde lid][ref1], en
      [3.114, eerste en zesde lid][ref2], tenzij de overschrijding aan Onze Minister kan worden toegerekend;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.115.2.b
    text: |-
      in geval van overschrijding van de termijnen, bedoeld in de [artikelen 3.113, vierde lid][ref1], of
      [3.114, tweede lid][ref2], en de vreemdeling een met redenen omkleed verzoek om verlenging heeft ingediend, tenzij
      de overschrijding aan de vreemdeling kan worden toegerekend;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
