  - number: 3.6.2
    text: 'Het eerste lid is uitsluitend van toepassing indien de aanvraag betrekking had op een verblijfsvergunning:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6
  - number: 3.6.2.a
    text: |-
      op grond dat de uitzetting van de vreemdeling in strijd is met artikel 8 van het Verdrag tot bescherming van de
      rechten van de mens en de fundamentele vrijheden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6
  - number: 3.6.2.b
    text: |-
      onder een beperking verband houdend met medische behandeling als bedoeld in [artikel 3.46][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
