  - number: 3.51.9.b
    text: |-
      hij drie jaar in Nederland verblijft als houder van een verblijfsvergunning onder een beperking verband houdend
      met verblijf als familie- of gezinslid van een persoon met een niet-tijdelijk verblijfsrecht, en is voldaan aan de
      voorwaarden voor het verlengen van de geldigheidsduur van de oorspronkelijke verblijfsvergunning.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.57.1
    text: |-
      De verblijfsvergunning, die met toepassing van [artikel 14, tweede lid, van de Wet][ref1] ambtshalve wordt
      verleend, wordt verleend met ingang van de dag na de dag waarop de machtiging tot voorlopig verblijf aan de
      vreemdeling in persoon is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.57
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.57.2
    text: |-
      In afwijking van het eerste lid, kan de verblijfsvergunning worden verleend met ingang van de dag die bij de
      afgifte van de machtiging tot voorlopig verblijf is opgegeven als de dag waarop de vreemdeling Nederland zal
      inreizen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.57
  - number: 3.58.1
    text: |-
      Een verblijfsvergunning regulier voor bepaalde tijd voor een verblijfsdoel als bedoeld in kolom I kan in eerste
      instantie worden verleend voor de geldigheidsduur, bedoeld in kolom II, en kan worden verlengd, voor zover dat is
      bepaald in kolom III.







                    *I. Verblijfsdoel*


                    *II. Geldigheidsduur*


                    *III. Verlengbaar*






                    a. «Verblijf als familie- of gezinslid»



                    Voor de duur van het verblijfsrecht of de geprivilegieerde status van de hoofdpersoon, maar niet
      langer dan vijf jaar


                    Telkens met ten hoogste vijf jaar




                    b. «Verblijf als economisch niet-actieve langdurig ingezetene»


                    Ten hoogste vijf jaar


                    Telkens met ten hoogste vijf jaar




                    c. «Arbeid als zelfstandige»


                    Ten hoogste twee jaar of voor ten hoogste één jaar indien de verblijfsvergunning is verleend op grond
      van [artikel 3.30, zesde lid][ref1]


                    Telkens met ten hoogste vijf jaar, maar niet verlengbaar na één jaar indien de verlenging wordt
      gebaseerd op artikel 3.30, zesde lid




                    d. «Arbeid als kennismigrant»


                    De duur van de arbeidsovereenkomst, aanstelling, gastovereenkomst of werkzaamheden, maar niet langer
      dan vijf jaar


                    Telkens met ten hoogste vijf jaar




                    e. «Verblijf als houder van de Europese blauwe kaart»


                    De duur van de arbeidsovereenkomst, bedoeld in [artikel 3.30b, eerste lid, onder a][ref2], aangevuld
      met drie maanden, maar tezamen niet langer dan vijf jaar


                    Telkens met ten hoogste vijf jaar




                    f. «Seizoenarbeid»


                    Ten hoogste 24 weken


                    Niet verlengbaar na 24 weken




                    g. «Overplaatsing binnen een onderneming»


                    Ten hoogste drie jaar in geval van een leidinggevende of specialist en ten hoogste een jaar in geval
      van een trainee-werknemer, met aftrek van eerder verblijf in andere lidstaten in geval van mobiliteit


                    Niet verlengbaar na drie jaar in geval van een leidinggevende of specialist en niet verlengbaar
      na één jaar in geval van een trainee-werknemer, met aftrek van eerder verblijf in andere lidstaten in geval van
      mobiliteit




                    h. «Arbeid in loondienst»


                    Ten hoogste:
                    – drie jaar, of
                    – vijf jaar, indien de vreemdeling gedurende een ononderbroken tijdvak van vijf jaar heeft
      beschikt over een voor het verrichten van arbeid geldige verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref3] en nadien zijn hoofdverblijf niet buiten Nederland heeft gevestigd


                    Telkens verlengbaar voor ten hoogste:
                    – drie jaar, of
                    – vijf jaar, indien de vreemdeling vrij is op de arbeidsmarkt of een verdrag daartoe verplicht




                    i. «Grensoverschrijdende dienstverlening»


                    De duur van de werkzaamheden als vermeld in de krachtens
      [artikel 2a, tweede lid, van de Wet arbeid vreemdelingen][ref4] in samenhang met
      [artikel 11 van het Besluit arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref5] door de
      dienstverrichter verstrekte verklaring, met een maximum van twee jaar


                    Niet verlengbaar na twee jaar




                    j. «Onderzoek in de zin van richtlijn (EU) 2016/801»


                    De duur van de arbeidsovereenkomst, aanstelling, gastovereenkomst of werkzaamheden, maar niet langer
      dan vijf jaar


                    Telkens met ten hoogste vijf jaar




                    k. «Lerend werken»


                    Ten hoogste één jaar


                    Niet verlengbaar na één jaar




                    l. «Arbeid als niet-geprivilegieerd militair of niet-geprivilegieerd burgerpersoneel»


                    De duur van de arbeidsovereenkomst, aanstelling, gastovereenkomst of werkzaamheden, maar niet langer
      dan vijf jaar


                    Telkens met ten hoogste vijf jaar




                    m. «Studie»


                    De duur van de studie met inbegrip van de voorbereiding daarop en de afronding daarvan, maar niet
      langer dan vijf jaar


                    Telkens met ten hoogste vijf jaar




                    n. «Het zoeken naar en verrichten van arbeid al dan niet in loondienst»


                    Ten hoogste één jaar, en, indien het de vergunning, bedoeld in [artikel 3.31b][ref6], betreft, zoveel
      langer als de vreemdeling wegens het ontbreken van een verblijfsvergunning geen toegang tot de arbeidsmarkt had


                    Niet verlengbaar na één jaar




                    o. «Uitwisseling, al dan niet in het kader van een verdrag»


                    Ten hoogste één jaar


                    Niet verlengbaar na één jaar




                    p. «Medische behandeling»


                    Ten hoogste één jaar of voor vijf jaar, indien de medische behandeling naar het oordeel van Onze
      Minister blijvend aan Nederland gebonden is


                    Telkens met ten hoogste één jaar




                    q. «Tijdelijke humanitaire gronden»


                    Ten hoogste één jaar


                    Telkens met ten hoogste één jaar




                    r. «Het afwachten van een verzoek op grond van
      [artikel 17 van de Rijkswet op het Nederlanderschap][ref7]»


                    Ten hoogste één jaar


                    Telkens met ten hoogste één jaar




                    s. «Niet-tijdelijke humanitaire gronden»


                    Ten hoogste vijf jaar


                    Telkens met ten hoogste vijf jaar


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0007149#Artikel2a
      [ref5]: https://wetten.overheid.nl/BWBR0038821#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0003738#Artikel17
