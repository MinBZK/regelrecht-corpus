        artikel: '18'
  - number: 3.92.1
    text: 'De verblijfsvergunning regulier voor onbepaalde tijd kan worden verleend aan de meerderjarige vreemdeling die:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.92
  - number: 3.92.1.a
    text: |-
      voor het negentiende levensjaar tien jaren rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1] heeft gehad en wiens aanvraag is ontvangen voor het
      negenentwintigste levensjaar, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.92.1.b
    text: |-
      voor het negentiende levensjaar vijf jaren rechtmatig in Nederland heeft verbleven als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], en voor wie Nederland naar het oordeel van Onze
      Minister het meest aangewezen land is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.92.2
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 21, eerste lid, onder a, e of f, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
  - number: 3.93.1
    text: |-
      De verblijfsvergunning regulier voor onbepaalde tijd kan worden verleend aan de meerderjarige vreemdeling die tien
      aaneengesloten jaren in Nederland heeft verbleven:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.93
  - number: 3.93.1.a
    text: op grond van een bijzondere geprivilegieerde status, die anders dan door eigen toedoen is verloren;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.93
  - number: 3.93.1.b
    text: 'op grond van een bijzondere geprivilegieerde status als:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.93
  - number: 3.93.1.b.1°
    text: |-
      geaccrediteerd lid van het administratief, technisch of bedienend personeel dan wel als particulier bediende, in
      dienst van een buitenlandse diplomatieke of consulaire post;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.93
  - number: 3.93.1.b.2°
    text: geaccrediteerd lid van het hoogste kader, het hoofd inbegrepen, van een internationale organisatie;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.93
  - number: 3.93.1.b.3°
    text: geaccrediteerd lid van het administratief, technisch of bedienend personeel van een internationale organisatie, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.93
  - number: 3.93.1.c
    text: als afhankelijk gezinslid van de vreemdeling, bedoeld onder a of b.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.93
  - number: 3.93.2
    text: |-
      In afwijking van [artikel 3.94, tweede lid][ref1], zijn de middelen van bestaan van de vreemdeling als bedoeld in
      het eerste lid duurzaam, indien zij nog gedurende ten minste één jaar beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.93
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.93.3
    text: |-
      Bij de berekening van de in het eerste lid bedoelde periode van tien achtereenvolgende jaren van
      verblijf worden ten aanzien van de vreemdeling als bedoeld in het eerste lid, onderdeel b, onder 2° en
      3°, alsmede zijn afhankelijke gezinslid, bedoeld in onderdeel c, mede in aanmerking genomen perioden
      waarin die vreemdeling respectievelijk dat afhankelijke gezinslid rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met e, of l, van de Wet][ref1] heeft gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.93
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.93.4
    text: |-
      De aanvraag wordt niet afgewezen op grond dat de vreemdeling niet gedurende vijf jaren
      ononderbroken en direct voorafgaande aan de aanvraag rechtmatig verblijf heeft gehad als bedoeld in
      [artikel 21, eerste lid, aanhef, van de Wet][ref1], indien de internationale organisatie, bedoeld in het eerste
      lid, onderdeel b, onder 2° dan wel 3°, is ingesteld voor bepaalde tijd, minder dan tien jaren, en de vreemdeling
      als lid van die organisatie dan wel als zijn afhankelijke gezinslid, bedoeld in het eerste lid, onderdeel c,
      gedurende vijf aaneengesloten jaren in Nederland heeft verbleven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.93
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
  - number: 3.94.1
    text: |-
      Voor de toepassing van [artikel 21, eerste lid, onder a, van de Wet][ref1] zijn de [artikelen 3.73][ref2],
      [3.74, eerste lid, aanhef en onder a][ref3], en [3.75][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.94
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.94.2
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning regulier voor onbepaalde tijd wordt niet afgewezen op
      grond van [artikel 21, eerste lid, onder a, van de Wet][ref1], indien de aanvraag is ingediend door een vreemdeling
      die duurzaam beschikt over een uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2] op
      basis van arbeidsongeschiktheid van ten minste vijfenvijftig procent en op basis van een volledige werkweek, of een
      vergelijkbare arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.94
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0002524
  - number: 3.95.1
    text: |-
      Behoudens overeenkomstige toepassing van [artikel 3.87][ref1] kan de aanvraag tot het verlenen van een
      verblijfsvergunning regulier voor onbepaalde tijd op grond van [artikel 21, eerste lid, onder c, van de Wet][ref2]
      slechts worden afgewezen, indien de vreemdeling wegens een misdrijf waartegen een gevangenisstraf van drie
      jaren of meer is bedreigd bij onherroepelijk geworden rechterlijk vonnis een gevangenisstraf, een taakstraf of
      de maatregel, bedoeld in [artikel 37a van het Wetboek van Strafrecht][ref3], dan wel het buitenlands equivalent
      daarvan, is opgelegd, en de duur van de straffen of maatregelen ten minste gelijk is aan de normen, bedoeld in
      [artikel 3.86, tweede, derde en vijfde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.95
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
