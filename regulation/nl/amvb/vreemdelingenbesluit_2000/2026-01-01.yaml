      wel door intrekking van het besluit waarbij het Nederlanderschap is verleend op de grond dat hij heeft nagelaten
      na de totstandkoming van zijn naturalisatie al het mogelijke te doen om zijn oorspronkelijke nationaliteit te
      verliezen, en die voorafgaand aan de naturalisatie ten minste vijf jaren rechtmatig verblijf in Nederland als
      bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1] heeft gehad;


