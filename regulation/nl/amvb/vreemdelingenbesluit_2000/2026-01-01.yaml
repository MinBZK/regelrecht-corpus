      opgelegde boetes terzake van een op grond van de [artikelen 67d][ref1],
      [67e][ref2] en [67f van de Algemene wet inzake rijksbelastingen][ref3],
      [artikel 55a van de Vreemdelingenwet 2000][ref4], [artikel 18 van de Wet arbeid vreemdelingen][ref5] en
      [artikel 18b van de Wet minimumloon en minimumvakantiebijslag][ref6] beboetbaar feit;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67d
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67e
