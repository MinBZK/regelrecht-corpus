    text: |-
      Onverminderd [artikel 3.91a][ref1] kan de verblijfsvergunning regulier voor bepaalde tijd die is verleend onder een
      beperking verband houdend met studie, in ieder geval op grond van [artikel 19 van de Wet][ref2], in samenhang met
