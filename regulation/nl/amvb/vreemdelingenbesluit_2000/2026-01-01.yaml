  - number: 1.2.a
    text: |-
      *reisvisum:* het visum, bedoeld in artikel 2, punt 2, onder a, van de Verordening nr. 810/2009/EG van het Europees
      Parlement en de Raad van 13 juli 2009 tot vaststelling van een gemeenschappelijke Visumcode (Visumcode);
