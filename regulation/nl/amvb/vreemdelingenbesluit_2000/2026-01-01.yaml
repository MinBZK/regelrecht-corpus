  - number: 3.124.1
    text: |-
      De aanvraag tot het verlenen van een EU-verblijfsvergunning voor langdurig ingezetenen wordt niet op grond van
      [artikel 45b, tweede lid, onder a, van de Wet][ref1] afgewezen om reden dat het rechtmatig verblijf, bedoeld in
      [artikel 8 onder a tot en met e of l, van de Wet][ref2] niet vijf jaren aaneensluitend is geweest, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45b
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.124
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45b
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.124.1.a
    text: 'de aanvraag is ingediend door een meerderjarige vreemdeling die:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.124
  - number: 3.124.1.a.1°
    text: |-
      voor het negentiende levensjaar tien jaren rechtmatig verblijf als bedoeld in
      [artikel 8, onder a toe en met e of l, van de Wet][ref1], heeft gehad en wiens aanvraag is ontvangen voor het
      negenentwintigste levensjaar, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.124
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.124.1.a.2°
    text: |-
      voor het negentiende levensjaar vijf jaren rechtmatig in Nederland heeft verbleven als bedoeld in
      [artikel 8, onder a tot en met e of l, van de Wet][ref1], en voor wie Nederland naar het oordeel van Onze Minister
      het meest aangewezen land is;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.124
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.124.1.b
    text: de vreemdeling niet het hoofdverblijf buiten Nederland heeft verplaatst.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.124
  - number: 3.124.2
    text: |-
      De aanvraag wordt niet op grond van [artikel 45b, tweede lid, onder a of b, van de Wet][ref1] afgewezen, indien
      de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45b
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.124
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45b
  - number: 3.124.2.a
    text: |-
      buiten Nederland heeft verbleven in verband met beroepsmatige detachering in een andere lidstaat van de Europese
      Unie;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.124
  - number: 3.124.2.b
    text: |-
      als langdurig ingezetene houder is geweest van een EU-verblijfsvergunning voor langdurig ingezetenen en die
      vergunning heeft verloren wegens:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.124
  - number: 3.124.2.b.1°
    text: |-
      verblijf voor studie of beroepsopleiding in een andere lidstaat van de Europese Unie, zonder in die staat de status
      van EU-langdurig ingezetene te hebben verworven, indien de aanvraag wordt gedaan binnen zes maanden na beëindiging
      van die studie of opleiding, dan wel de verblijfstitel in die staat,
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.124
  - number: 3.124.2.b.2°
    text: |-
      verblijf buiten het grondgebied van de Europese Unie gedurende een aaneengesloten periode van tenminste twaalf
      maanden, indien de aanvraag wordt gedaan binnen twaalf maanden na het onherroepelijk worden van het verlies, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.124
  - number: 3.124.2.b.3°
    text: |-
      verwerving van de status van langdurig ingezetene in een andere lidstaat van de Europese Unie, indien de aanvraag
      wordt gedaan binnen twaalf maanden na het onherroepelijk worden van het verlies;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.124
  - number: 3.124.2.c
    text: |-
      vijf jaar legaal en ononderbroken op het grondgebied van de Europese Unie verblijft als houder van een Europese
      blauwe kaart, een nationale verblijfsvergunning voor een hooggekwalificeerde baan, een vergunning als onderzoeker
      of, waar passend, een toelating als student overeenkomstig artikel 4, tweede lid, tweede alinea, van richtlijn
      langdurig ingezetenen of als persoon die internationale bescherming geniet op het grondgebied van de lidstaten
      onmiddellijk voorafgaand aan de indiening van de aanvraag ten minste twaalf achtereenvolgende maanden als houder
      van een Europese blauwe kaart in een andere lidstaat van de Europese Unie en ten minste twee achtereenvolgende
      jaren direct voorafgaande aan de aanvraag als houder van een door Onze Minister afgegeven Europese blauwe kaart
      in Nederland heeft verbleven, waarbij perioden van afwezigheid van het grondgebied van Nederland geen onderbreking
      vormen van de termijn van vijf jaar, indien zij minder dan twaalf achtereenvolgende maanden beslaan en niet langer
      dan achttien maanden hebben geduurd;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.124
  - number: 3.124.2.d
    text: |-
      als houder van een Europese blauwe kaart in de periode van vijf jaar niet langer dan twaalf achtereenvolgende
      maanden en in totaal niet langer dan achttien maanden buiten Nederland heeft verbleven.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.124
  - number: 3.124.3
    text: |-
      In de gevallen, bedoeld in het eerste lid, wordt bij de berekening van het tijdvak van vijf jaar buiten beschouwing
      gelaten het gedeelte van het verblijf buiten Nederland, dat tien maanden in totaal of bij aaneengesloten verblijf
      buiten Nederland zes maanden te boven gaat.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.124
  - number: 3.125.1
    text: |-
      Voor de toepassing van [artikel 45b, tweede lid, onder c, van de Wet][ref1], zijn de [artikelen 3.73][ref2],
      [3.74, eerste lid, aanhef en onder a][ref3], en [3.75][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45b
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.125
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45b
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.125.2
    text: |-
      Behoudens overeenkomstige toepassing van [artikel 3.87][ref1], kan de aanvraag slechts op grond van
      [artikel 45b, tweede lid, onder d, van de Wet][ref2] worden afgewezen, indien de totale duur van de straffen of
      maatregelen ten minste gelijk is aan de normen, bedoeld in [artikel 3.86, tweede, derde dan wel vijfde lid][ref3].
      Artikel 3.86 is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45b
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.125
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 45b
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.125.3
    text: |-
      Bij de toepassing van het tweede lid houdt Onze Minister mede rekening met de ernst van de inbreuk of het soort
      van inbreuk dat door de vreemdeling op de openbare orde is gepleegd, respectievelijk met het gevaar dat van de
      vreemdeling uitgaat en het bestaan van banden met Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.125
  - number: '3.126'
    text: |-
      Op de aanvraag tot het verlenen van een EU-verblijfsvergunning voor langdurig ingezetenen is [artikel 3.96a][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.126
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.127.1
    text: |-
      De EU-verblijfsvergunning voor langdurig ingezetenen wordt niet met toepassing van
      [artikel 45d, eerste lid, onder a, van de Wet][ref1] ingetrokken, indien de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45d
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.127
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45d
  - number: 3.127.1.a
    text: niet het hoofdverblijf buiten Nederland heeft verplaatst;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.127
  - number: 3.127.1.b
    text: aantoont dat hij langer dan zes jaar voor studie verblijft in een andere lidstaat van de Europese Unie; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.127
  - number: 3.127.1.c
    text: |-
      aantoont dat hij, in geval van verblijf gedurende een aaneengesloten periode van twaalf maanden of meer buiten het
      grondgebied van de Europese Unie, gedurende die periode in het Schengengebied heeft verbleven, tenzij hij langer
      dan zes jaar afwezig is geweest van het Nederlands grondgebied;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.127
  - number: 3.127.1.d
    text: |-
      voormalig houder van een Europese blauwe kaart is, dan wel het gezinslid van een voormalig houder van een
      Europese blauwe kaart is, en niet langer dan een aaneengesloten periode van 24 maanden heeft verbleven buiten het
      Schengengebied.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.127
  - number: 3.127.2
    text: |-
      Indien de EU-verblijfsvergunning voor langdurig ingezetenen op frauduleuze wijze is verkregen, wordt de vergunning
      ingetrokken op de in [artikel 45d, derde lid, onder b, van de Wet][ref1] genoemde grond. Indien sedert de
      verkrijging een periode van twaalf jaren is verstreken kan, onder intrekking van de EU-verblijfsvergunning voor
      langdurig ingezetenen, ingeval:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45d
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.127
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45d
  - number: 3.127.2.a
    text: |-
      op het document, bedoeld in [artikel 9, eerste lid, van de Wet][ref1], van de vreemdeling aan
      wie een EU-verblijfsvergunning voor langdurig ingezetenen is verleend, geen aantekening krachtens
      [artikel 45c, eerste lid, van de Wet][ref2] is geplaatst, ambtshalve een verblijfsvergunning regulier voor
      onbepaalde tijd worden verleend, en,


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.127
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 45c
  - number: 3.127.2.b
    text: |-
      op het document, bedoeld onder a, van de vreemdeling aan wie de EU-verblijfsvergunning voor langdurig ingezetenen
      is verleend wel een aantekening krachtens [artikel 45c, eerste lid, van de Wet][ref1] is geplaatst, ambtshalve een
      verblijfsvergunning asiel voor onbepaalde tijd worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.127
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45c
  - number: 3.127.3
    text: |-
      De EU-verblijfsvergunning voor langdurig ingezetenen kan met toepassing van
      [artikel 45d, eerste lid, onder b, van de Wet][ref1] worden ingetrokken op grond dat de vreemdeling een actuele
      en ernstige bedreiging vormt voor de openbare orde, indien de totale duur van de straffen of maatregelen ten
      minste gelijk is aan de toepasselijke norm, bedoeld in [artikel 3.86, tweede, derde dan wel vijfde lid][ref2]. De
      artikelen 3.86 en [3.87][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45d
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.127
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45d
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.127.4
    text: |-
      Indien de intrekking van de EU-verblijfsvergunning voor langdurig ingezetenen overeenkomstig het derde
      lid, niet leidt tot uitzetting, kan ambtshalve een verblijfsvergunning regulier voor onbepaalde tijd worden
      verleend ingeval op het document, bedoeld in [artikel 9, eerste lid, van de Wet][ref1], van de vreemdeling
      aan wie de EU-verblijfsvergunning voor langdurig ingezetenen is verleend, geen aantekening krachtens
      [artikel 45c, eerste lid, van de Wet][ref2] is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.127
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 45c
  - number: 3.127.5
    text: |-
      Indien de intrekking van de EU-verblijfsvergunning voor langdurig ingezetenen overeenkomstig het derde
      lid, niet leidt tot uitzetting, kan ambtshalve een verblijfsvergunning asiel voor onbepaalde tijd worden
      verleend ingeval op het document, bedoeld in [artikel 9, eerste lid, van de Wet][ref1], van de vreemdeling
      aan wie de EU-verblijfsvergunning voor langdurig ingezetenen is verleend, wel een aantekening krachtens
      [artikel 45c, eerste lid, van de Wet][ref2] is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.127
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 45c
  - number: 3.128.1
    text: |-
      Ingeval bij de toepassing van [artikel 45d, eerste lid, onder b, van de Wet][ref1] een andere lidstaat van de
      Europese Unie heeft bevestigd dat de vreemdeling nog steeds in die staat internationale bescherming geniet, zet
      Onze Minister de vreemdeling uit naar die staat.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45d
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.128
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45d
  - number: 3.128.2
    text: |-
      In afwijking van het eerste lid en met inachtneming van de voor Nederland geldende internationale verplichtingen
      kan Onze Minister de vreemdeling, bedoeld in het eerste lid, uitzetten naar een andere staat dan de staat die de
      internationale bescherming heeft verleend, indien is voldaan aan [artikel 3.105c, tweede lid, onder a of b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.128
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 3.128.3
    text: |-
      Bij de verwijdering in de gevallen, bedoeld in het tweede lid en
      [artikel 3.103aa, derde lid, onder a dan wel b][ref1], wordt het beginsel geëerbiedigd van non-refoulement, met
      inachtneming van de voor Nederland geldende internationale verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.128
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
  - number: 3.129.1
    text: |-
      Voordat Onze Minister een aantekening krachtens [artikel 45c, tweede lid, van de Wet][ref1] plaatst, vraagt
      Onze Minister aan de eerste lidstaat van verblijf van de langdurig ingezetene of de vreemdeling nog steeds
      internationale bescherming geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.129
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45c
  - number: 3.129.2
    text: |-
      Onze Minister beantwoordt binnen één maand de vraag van een andere lidstaat van de Europese Unie of
      een houder van een door Onze Minister verschaft document als bedoeld in [artikel 9 van de Wet][ref1]
      waaruit de EU-verblijfsvergunning voor langdurig ingezetenen blijkt met de aantekening krachtens
      [artikel 45c, eerste lid, van de Wet][ref2] nog steeds internationale bescherming geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.129
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 45c
  - number: 3.129.3
    text: |-
      Ingeval Onze Minister een verzoek om wijziging ontvangt van een andere lidstaat van de Europese Unie
      met betrekking tot een door Onze Minister afgegeven document als bedoeld in [artikel 9 van de Wet][ref1]
      waaruit de EU-verblijfsvergunning voor langdurig ingezetenen blijkt en daarop geen aantekening krachtens
      [artikel 45c, eerste lid, van de Wet][ref2] is geplaatst, teneinde daarop een aantekening krachtens artikel 45c,
      tweede lid, van de Wet te plaatsen, wordt binnen drie maanden een nieuw document als bedoeld in artikel 9, eerste
      lid, van de Wet afgegeven, voorzien van die aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.129
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 45c
  - number: 3.129.4
    text: |-
      Ingeval Onze Minister een verzoek ontvangt van een andere lidstaat van de Europese Unie met betrekking tot een
      door Onze Minister verschaft document waaruit een EU-verblijfsvergunning voor langdurig ingezetenen blijkt waarop
      een aantekening krachtens [artikel 45c, eerste lid, van de Wet][ref1] is geplaatst, teneinde deze aantekening te
      wijzigen, wordt binnen drie maanden een nieuw document verschaft, voorzien van een dienovereenkomstig gewijzigde
      aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.129
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45c
  - number: 3.129.5
    text: |-
      Ingeval Onze Minister, nadat hij een document als bedoeld in [artikel 9 van de Wet][ref1] heeft
      verschaft waaruit de EU-verblijfsvergunning voor langdurig ingezetenen blijkt met daarop een krachtens
      [artikel 45c, tweede lid, van de Wet][ref2] geplaatste of gewijzigde aantekening, de verantwoordelijkheid voor de
      internationale bescherming van de houder ervan heeft overgenomen, verschaft hij die houder binnen drie maanden een
      nieuw document als bedoeld in artikel 9 van de Wet, waaruit de EU-verblijfsvergunning voor langdurig ingezetenen
      blijkt en waarop een aantekening krachtens artikel 45c, eerste lid, van de Wet is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.129
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 45c
  - number: 3.130.1
    text: |-
      Bij de bekendmaking van de beschikking, waarbij wordt beslist op de aanvraag om verlening van de EU-
      verblijfsvergunning voor langdurig ingezetenen, wordt de aanvrager meegedeeld welke rechten en plichten hij heeft
      krachtens de richtlijn langdurig ingezetenen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.130
  - number: 3.130.2
    text: |-
      Indien Onze Minister een EU-verblijfsvergunning voor langdurig ingezetenen verleent aan een vreemdeling die houder
      is van een EU-verblijfsvergunning voor langdurig ingezetenen, afgegeven door een andere lidstaat van de Europese
      Unie, doet hij daarvan mededeling aan de autoriteiten van die staat.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.130
  - number: 3.130.3
    text: |-
      Onze Minister vormt het contactpunt dat door een andere lidstaat van de Europese Unie kan worden geraadpleegd,
      ter uitvoering van de richtlijn langdurig ingezetenen en de richtlijn 2009/50/EG, en is verantwoordelijk
      voor het door Nederland ontvangen en toezenden van de informatie, bedoeld in de [artikelen 3.103a][ref1],
      [3.103aa, eerste lid][ref2], [3.123][ref3] en [3.129][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.130
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '6'
  - number: 4.1.1
    text: |-
      Grensbewaking als bedoeld in [artikel 46 van de Wet][ref1] wordt uitgeoefend met het oog op het Nederland in- en
      uitreizen van personen via een buitengrens.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel46
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '46'
  - number: 4.1.2
    text: |-
      Onder uitreizen wordt begrepen het zich aan boord begeven of bevinden van een schip of luchtvaartuig, dat voor de
      uitreis uit Nederland bestemd is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.1
  - number: 4.2.1
    text: In het belang van de grensbewaking worden aan de buitengrenzen grensdoorlaatposten ingesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Bij ministeriële regeling worden de plaatsen aangewezen waar grensdoorlaatposten, al dan niet tijdelijk, zijn
      gevestigd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.2
  - number: 4.2.3
    text: Bij ministeriële regeling worden de tijden vastgesteld gedurende welke de grensdoorlaatposten zijn opengesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      Het overschrijden van de buitengrens is enkel toegestaan via de op grond van [artikel 4.2, tweede lid][ref1],
      aangewezen grensdoorlaatposten gedurende de op grond van artikel 4.2, derde lid, vastgestelde openingstijden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: 4.3.2
    text: |-
      Deze verplichting geldt niet indien [artikel 4.4][ref1] van toepassing is of om internationale bescherming wordt
      verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 4.5.1
    text: 'De vreemdeling die Nederland inreist, is verplicht desgevorderd aan een ambtenaar, belast met de grensbewaking:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.5
  - number: 4.5.1.a
    text: |-
      het in zijn bezit zijnde document voor grensoverschrijding, de benodigde machtiging tot voorlopig verblijf dan wel
      het benodigde reisvisum of doorreisvisum te tonen en te overhandigen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.5
  - number: 4.5.1.b
    text: inlichtingen te verstrekken over het doel en de duur van zijn voorgenomen verblijf in Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.5
  - number: 4.5.1.c
    text: aan te tonen over welke middelen hij met het oog op de toegang tot Nederland beschikt of kan beschikken.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.5
  - number: 4.5.2
    text: |-
      Het eerste lid, onder a, is van overeenkomstige toepassing op de vreemdeling die Nederland uitreist via een
      buitengrens.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.5
  - number: 4.5.3
    text: |-
      Het eerste lid, onder b en c, is niet van toepassing op de vreemdeling die rechtmatig verblijf
      heeft als bedoeld in [artikel 8, onder e, dan wel l, van de Wet][ref1], het familielid, bedoeld in
      [artikel 8.7, tweede en derde lid][ref2], en de vreemdeling, bedoeld in [artikel 8.7, vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: '4.6'
    text: |-
      Een ieder die zich op of nabij een plaats bevindt waar een grensdoorlaatpost is gevestigd, houdt zich aan de aldaar
      door de ambtenaren, belast met de grensbewaking, in het kader van de uitoefening van hun taak gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      De Nederlander die Nederland in- of uitreist, toont en overhandigt, desgevorderd, aan een ambtenaar, belast met
      de grensbewaking, het in zijn bezit zijnde reis- of identiteitspapier of maakt zo nodig op andere wijze zijn
      Nederlanderschap aannemelijk.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.7
  - number: '4.8'
    text: |-
      De bestuurder van een voertuig geeft eigener beweging aan een ambtenaar, belast met de grensbewaking, kennis van
      de aanwezigheid in zijn voertuig van vreemdelingen ten aanzien van wie hij weet of redelijkerwijs kan vermoeden dat
      zij niet voldoen aan de bij de Schengengrenscode of de bij of krachtens de [Wet][ref1] vastgestelde verplichtingen
      waaraan personen bij grensoverschrijding zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: '4.9'
    text: |-
      De gezagvoerder van een schip verleent, desgevorderd, de medewerking aan een ambtenaar, belast met de
      grensbewaking, welke nodig is om deze ambtenaar in staat te stellen de door hem op grond van de Schengengrenscode
      uit te oefenen grenscontrole uit te voeren. Deze medewerking bestaat uit:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.9
  - number: 4.9.a
    text: |-
      het op een daartoe gegeven teken zodanig vaart verminderen en het zodanig op of bijdraaien van zijn schip, dat een
      dienstvaartuig behoorlijk langszij kan komen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.9
  - number: 4.9.b
    text: het toelaten van ambtenaren, belast met de grensbewaking, aan boord van zijn schip;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.9
  - number: 4.9.c
    text: het op vordering van een ambtenaar, belast met de grensbewaking, tot stilstand brengen of aanleggen van zijn schip.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.9
  - number: '4.10'
    text: |-
      [Artikel 4.8][ref1] is van overeenkomstige toepassing op gezagvoerders van andere schepen dan zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 4.11.1
    text: |-
      De informatie, bedoeld in Bijlage VI, onderdelen 3.1.2, 3.1.4, 3.1.5 en 3.2.1 van de Schengengrenscode, wordt
      langs elektronische weg op een nader bij ministeriële regeling te bepalen wijze verstrekt aan het hoofd van de
      grensdoorlaatpost.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.11
  - number: 4.11.2
    text: |-
      [Paragraaf 4 van het Besluit politiegegevens][ref1] is, met uitzondering van de [artikelen 4:1][ref2],
      [4:2, eerste lid, aanhef en onder y][ref3], en [4:6, aanhef en onder a en b, van dat Besluit][ref4], niet van
      toepassing op persoonsgegevens die zijn verstrekt met toepassing van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Paragraaf4
      [ref2]: https://wetten.overheid.nl/BWBR0023086#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0023086#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0023086#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0023086
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0023086
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0023086
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0023086
        artikel: '4'
  - number: '4.12'
    text: |-
      De gezagvoerder krijgt op een bij ministeriële regeling te bepalen wijze van het hoofd van de grensdoorlaatpost een
      ontvangstbevestiging als bedoeld in Bijlage VI, onderdeel 3.1.3, van de Schengengrenscode van de informatie die hij
      verstrekt heeft.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.12
  - number: '4.13'
    text: |-
      De tijdige kennisgeving van afvaart, bedoeld in punt 3.1.5. van bijlage VI van de Schengengrenscode, wordt
      gedaan op het moment dat de afvaart van het schip aanstaande is en de buitengrens van het Schengengebied daarbij
      daadwerkelijk zal worden overschreden. Bij ministeriële regeling worden regels gesteld omtrent de maximumtermijn
      tussen de kennisgeving van de afvaart en het moment dat de buitengrens van het Schengengebied zal worden
      overschreden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.13
  - number: '4.14'
    text: |-
      De [artikelen 4.11 tot en met 4.13][ref1], gelden niet voor gezagvoerders van zeeschepen die, zonder ligplaats in
      een Nederlandse haven te nemen, door de Nederlandse territoriale zee varen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: 4.15.1
    text: |-
      De gezagvoerder van een vliegtuig verstrekt in tweevoud aan een ambtenaar, belast met de grensbewaking, de in
      bijlage VI, onder 2.3.1, van de Schengengrenscode bedoelde algemene verklaring en de in bijlage VII, onder 2.1, van
      de Schengengrenscode bedoelde gegevens over de bemanning.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.15
  - number: 4.15.2
    text: Bij ministeriële regeling wordt het model van de bemannings- en passagierslijst aangewezen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.15
  - number: '4.16'
    text: |-
      De vordering aan de gezagvoerder van een luchtvaartuig, bedoeld in [artikel 51, derde lid, van de Wet][ref1], wordt
      gedaan door tussenkomst van de luchtverkeersleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel51
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '51'
  - number: 4.17.1
    text: 'De korpschef verstrekt periodiek ten minste de volgende gegevens aan Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17
  - number: 4.17.1.a
    text: gegevens over de uitzetting van vreemdelingen, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17
  - number: 4.17.1.b
    text: gegevens over de uitvoering van het toezicht op vreemdelingen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17
  - number: 4.17.2
    text: |-
      De bevelhebber van de Koninklijke marechaussee en, voorzover van toepassing, de korpschef verstrekken periodiek ten
      minste de volgende inlichtingen aan Onze Minister:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17
  - number: 4.17.2.a
    text: gegevens over de toegangsweigering;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17
  - number: 4.17.2.b
    text: gegevens over de controle op de zorgplicht van vervoerders;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17
  - number: 4.17.2.c
    text: gegevens over de uitzetting van vreemdelingen, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17
  - number: 4.17.2.d
    text: gegevens over de uitvoering van het toezicht op vreemdelingen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17
  - number: 4.17a.1
    text: |-
      De bevoegdheid, bedoeld in [artikel 50, eerste lid, van de Wet][ref1], om ter bestrijding van illegaal verblijf
      na grensoverschrijding personen staande te houden ter vaststelling van hun identiteit, nationaliteit en
      verblijfsrechtelijke positie, wordt uitsluitend uitgeoefend in het kader van toezicht op vreemdelingen:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '50'
  - number: 4.17a.1.a
    text: op luchthavens bij de aankomst van vluchten vanuit het Schengengebied;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17a
  - number: 4.17a.1.b
    text: |-
      in treinen gedurende ten hoogste dertig minuten na het passeren van de gemeenschappelijke landgrens met België
      of Duitsland of, als binnen deze periode het tweede station na het passeren van de grens nog niet is bereikt, tot
      uiterlijk het tweede station na het passeren van de grens;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17a
  - number: 4.17a.1.c
    text: |-
      op wegen en vaarwegen in een gebied tot twintig kilometer vanaf de gemeenschappelijke landgrens met België of
      Duitsland.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17a
  - number: 4.17a.2
    text: |-
      Het toezicht, bedoeld in het eerste lid, wordt uitgevoerd op basis van informatie of ervaringsgegevens over
      illegaal verblijf na grensoverschrijding. Het toezicht kan daarnaast in beperkte mate worden uitgevoerd met het oog
      op het verkrijgen van informatie over dergelijk illegaal verblijf.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17a
  - number: 4.17a.3
    text: |-
      Het toezicht, bedoeld in het eerste lid, onderdeel a, wordt ten hoogste zeven keer per week uitgevoerd ten aanzien
      van vluchten op eenzelfde vliegroute, met een maximum van eenderde van het totale aantal geplande vluchten per
      maand op die vliegroute. In het kader van dit toezicht wordt slechts een deel van de passagiers op een vlucht
      staande gehouden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17a
  - number: 4.17a.4
    text: |-
      Het toezicht, bedoeld in het eerste lid, onderdeel b, wordt per dag in ten hoogste drie treinen per traject en ten
      hoogste twintig treinen in totaal uitgevoerd, met dien verstande dat het toezicht slechts mag worden uitgeoefend in
      een deel van de trein, en per trein in ten hoogste vier treincoupés.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17a
  - number: 4.17a.5
    text: |-
      Het toezicht, bedoeld in het eerste lid, onderdeel c, wordt op eenzelfde weg of vaarweg ten hoogste negentig uur
      per maand en ten hoogste zes uur per dag uitgevoerd. In het kader van dit toezicht wordt slechts een deel van de
      passerende vervoermiddelen stilgehouden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17a
  - number: 4.17b.1
    text: |-
      Indien er concrete aanwijzingen zijn dat er sprake is van een aanzienlijke toename van illegaal
      verblijf na grensoverschrijding, dan wel indien er concrete aanwijzingen zijn dat op korte termijn een
      dergelijke toename kan worden verwacht, kan bij besluit van Onze Minister tijdelijk worden afgeweken van
      [artikel 4.17a, derde, vierde en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.17b.2
    text: |-
      De geldigheidsduur van het in het eerste lid bedoelde besluit verstrijkt in ieder geval zes maanden nadat het is
      genomen. Onze Minister trekt het besluit onverwijld in indien het niet langer noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17b
  - number: 4.17b.3
    text: |-
      Indien een besluit als bedoeld in het eerste lid is genomen, wordt het toezicht, bedoeld in
      [artikel 4.17a, eerste lid, onderdeel a][ref1], op eenzelfde vliegroute, ten hoogste op de helft van het aantal
      vluchten per dag uitgevoerd. In het kader van dit toezicht wordt slechts een deel van de passagiers op een vlucht
      staande gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.17b.4
    text: |-
      Indien een besluit als bedoeld in het eerste lid is genomen, wordt het toezicht, bedoeld in
      [artikel 4.17a, eerste lid, onderdeel b][ref1], per dag in ten hoogste zes treinen per traject en ten hoogste
      veertig treinen in totaal uitgevoerd, met dien verstande dat het toezicht slechts mag worden uitgeoefend in een
      deel van de trein, en per trein in ten hoogste vier treincoupés.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.17b.5
    text: |-
      Indien een besluit als bedoeld in het eerste lid is genomen, wordt het toezicht, bedoeld in
      [artikel 4.17a, eerste lid, onderdeel c][ref1], op eenzelfde weg of vaarweg ten hoogste 180 uur per maand en
      ten hoogste 12 uur per dag uitgevoerd. In het kader van dit toezicht wordt slechts een deel van de passerende
      vervoermiddelen stilgehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.17b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.18.1
    text: |-
      Aan de vreemdeling die met toepassing van [artikel 50, tweede of derde lid][ref1], of
      [artikel 50a, eerste lid, van de Wet][ref2] is overgebracht naar een plaats, bestemd voor verhoor, wordt tijdig
      mededeling gedaan van de hem toekomende bevoegdheid zich bij het verhoor te doen bijstaan door een raadsman.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel50a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 50a
  - number: 4.18.2
    text: |-
      De in het eerste lid bedoelde vreemdeling wordt niet verder beperkt in de uitoefening van grondrechten, dan
      wordt gevorderd door het doel van de maatregel en de handhaving van de orde en de veiligheid op de plaats van
      tenuitvoerlegging.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.18
  - number: 4.19.1
    text: |-
      Een beslissing van de bevelhebber van de Koninklijke marechaussee of de korpschef, genomen krachtens
      [artikel 50, vierde lid, van de Wet][ref1], wordt ten uitvoer gelegd in een cel van de Koninklijke marechaussee
      respectievelijk op een politiebureau. De Regeling politiecellencomplex is van overeenkomstige toepassing op de
      tenuitvoerlegging van de beslissing in een cel van de Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '50'
  - number: 4.19.2
    text: |-
      De [artikelen 5.3][ref1] en [5.5][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '4.20'
    text: |-
      Indien de bevelhebber van de Koninklijke marechaussee of de korpschef zijn bevoegdheid, bedoeld in
      [artikel 50, vierde lid, van de Wet][ref1], mandateert, doet hij dat niet dan aan een ambtenaar, belast met het
      toezicht op vreemdelingen, die tevens hulpofficier van justitie is, of de ambtenaar van politie met ter zake
      voldoende kennis en kunde die daartoe is aangewezen door de korpschef.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '50'
  - number: 4.21.1
    text: |-
      Als documenten in de zin van [artikel 50, eerste lid, laatste volzin, van de Wet][ref1], worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '50'
  - number: 4.21.1.a
    text: |-
      voor vreemdelingen die rechtmatig verblijven als bedoeld in [artikel 8, onder a tot en met d, van de Wet][ref1]:
      een vanwege de bevoegde autoriteiten verstrekt document waaruit zulks blijkt en waarvan het model is vastgesteld
      bij ministeriële regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.21.1.b
    text: |-
      voor vreemdelingen die rechtmatig verblijven als bedoeld in [artikel 8 onder e, van de Wet][ref1]: een geldig
      nationaal paspoort of geldige identiteitskaart, indien zij de nationaliteit van een staat bezitten als bedoeld in
      [artikel 8.7, eerste lid][ref2], of, indien zij een zodanige nationaliteit niet bezitten:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 4.21.1.b.1°
    text: |-
      een geldig nationaal paspoort met een voor inreis benodigd visum, indien na inreis nog geen 90 dagen zijn
      verstreken;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.21
  - number: 4.21.1.b.2°
    text: |-
      een geldig nationaal paspoort met een stempel van de inreis, indien voor inreis geen visum benodigd is en na inreis
      nog geen 90 dagen zijn verstreken;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.21
  - number: 4.21.1.b.3°
    text: |-
      een geldig nationaal paspoort met een door de bevoegde autoriteiten afgegeven verklaring als bedoeld in
      [artikel 8.13, vierde lid][ref1], indien na afgifte van de verklaring nog geen zes maanden zijn verstreken; of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 4.21.1.b.4°
    text: |-
      een door de bevoegde autoriteiten afgegeven verblijfsdocument als bedoeld in [artikel 8.13, vijfde lid][ref1], dan
      wel [artikel 8.20, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 4.21.1.c
    text: |-
      voor vreemdelingen die een aanvraag tot het verlenen van de verblijfsvergunning asiel voor bepaalde tijd hebben
      ingediend, dan wel verblijf heeft op grond van [artikel 8, onderdeel m, van de Wet][ref1]: een vanwege de bevoegde
      autoriteiten verstrekt document waaruit zulks blijkt en waarvan het model wordt vastgesteld bij ministeriële
      regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.21.1.d
    text: |-
      voor vreemdelingen, anders dan bedoeld onder c, die rechtmatig verblijf in de zin van
      [artikel 8, onder f, g, h, j of k, van de Wet][ref1] hebben en die niet beschikken over een ingevolge
      [de Wet][ref2] vereist geldig document voor grensoverschrijding: een vanwege de bevoegde autoriteiten verstrekt
      document, waarvan het model wordt vastgesteld bij ministeriële regeling, dat kan worden voorzien van een inlegvel
      als bedoeld in [artikel 4.29, derde lid][ref3], waarop de verblijfsrechtelijke positie is aangetekend;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.21.1.e
    text: |-
      voor andere vreemdelingen: een ingevolge de Wet voor het hebben van toegang tot Nederland vereist geldig document
      voor grensoverschrijding dan wel een document voor grensoverschrijding waarin het benodigde visum is aangetekend of
      waarin een aantekening omtrent de verblijfsrechtelijke positie is geplaatst.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.21
  - number: 4.21.2
    text: |-
      Geen document, anders dan bedoeld in het eerste lid, onder a of b, wordt verstrekt aan kinderen beneden de leeftijd
      van twaalf jaar, tenzij zij er naar het oordeel van Onze Minister een redelijk belang bij hebben in het bezit van
      zulk een document te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.21
  - number: 4.21.3
    text: |-
      Op het ingevolge het eerste lid, onder a tot en met d, afgegeven document wordt aangetekend of het de vreemdeling
      toegestaan is arbeid te verrichten en of voor deze arbeid ingevolge de [Wet arbeid vreemdelingen][ref1] een
      tewerkstellingsvergunning of gecombineerde vergunning is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 4.21.4
    text: |-
      Indien aan het verblijf in Nederland van de in het eerste lid, onder a en b, bedoelde vreemdelingen een beperking
      als bedoeld in [artikel 3.4, derde lid][ref1], is verbonden, wordt op het document de aantekening «beroep op de
      algemene middelen kan gevolgen hebben voor verblijfsrecht» gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 4.22.1
    text: |-
      De documenten, bedoeld in [artikel 4.21, eerste lid, onder a tot en met d][ref1], worden door Onze Minister
      vervangen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.22.1.a
    text: |-
      de vreemdeling aan wie het document werd afgegeven, overeenkomstig [artikel 4.44][ref1] aangifte heeft gedaan van
      vermissing, verlies of het voor identificatie ondeugdelijk worden van dat document, en


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '3'
  - number: 4.22.1.b
    text: |-
      Onze Minister heeft vastgesteld dat er gegronde redenen zijn om te veronderstellen dat de aangifte naar waarheid
      is gedaan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.22
  - number: 4.22.2
    text: |-
      Onverminderd het eerste lid worden de documenten, bedoeld in [artikel 4.21, eerste lid, onder a][ref1], telkens
      vijf jaren na de afgifte ervan, vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.23.1
    text: |-
      De ambtenaren belast met de grensbewaking of de ambtenaren belast met het toezicht op vreemdelingen, nemen op
      grond van [artikel 52, eerste lid, van de Wet][ref1] het reis- of identiteitspapier van een persoon tijdelijk in
      bewaring:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel52
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '52'
  - number: 4.23.1.a
    text: |-
      voorzover zulks nodig is voor het verkrijgen van de gegevens, bedoeld in [artikel 4.45][ref1], of voor het stellen
      van een aantekening als bedoeld in [artikel 4.24 tot en met artikel 4.35a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.23.1.b
    text: |-
      indien de persoon ter vaststelling van zijn identiteit is staande gehouden en niet aanstonds blijkt dat
      het hem is toegestaan in Nederland te verblijven, terwijl de gelegenheid ontbreekt hem, met toepassing van
      [artikel 50, tweede of derde lid, van de Wet][ref1] naar een plaats, bestemd voor verhoor, over te brengen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '50'
  - number: 4.23.1.c
    text: gedurende de tijd dat de persoon rechtens zijn vrijheid is ontnomen, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.23
  - number: 4.23.1.d
    text: |-
      voorzover zulks nodig is met het oog op de uitzetting of de overgave aan de buitenlandse grensautoriteiten als
      bedoeld in [artikel 52, tweede lid, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel52
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '52'
  - number: 4.23.2
    text: |-
      Onze Minister kan het reis- of identiteitspapier van een persoon tijdelijk in bewaring nemen, voor zover zulks
      nodig is voor het verkrijgen van de gegevens, bedoeld in [artikel 4.45][ref1], voor onderzoek naar de echtheid van
      het reis- of identiteitspapier of voor de uitzetting van de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '3'
  - number: 4.23.3
    text: |-
      In het geval, bedoeld in het eerste lid, onder b, wordt het reis- of identiteitspapier aan de persoon teruggegeven,
      indien hij aan de korpschef of de bevelhebber van de Koninklijke marechaussee de gegevens heeft verstrekt die deze
      in het belang van de toepassing van de [Wet][ref1] vraagt, tenzij er uit anderen hoofde gronden aanwezig zijn om
      het document in bewaring te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 4.24.1
    text: |-
      Naast het plaatsen van de in artikel 11 en bijlage IV van de Schengengrenscode bedoelde inreis- en uitreisstempel,
      kunnen ambtenaren belast met de grensbewaking, op grond van [artikel 52, eerste lid, van de Wet][ref1], in het
      reis- of identiteitspapier van de vreemdeling aantekeningen stellen omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel52
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '52'
  - number: 4.24.1.a
    text: inreis in Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.24
  - number: 4.24.1.b
    text: het doel en de duur van het voorgenomen verblijf in Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.24
  - number: 4.24.1.c
    text: de middelen waarover de vreemdeling met het oog op de toegang tot Nederland beschikt of kan beschikken;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.24
  - number: 4.24.1.d
    text: aanmelding bij de korpschef;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.24
  - number: 4.24.1.e
    text: |-
      de toepassing van [artikel 2.4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 4.24.1.f
    text: het weigeren van toegang tot Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.24
  - number: 4.24.1.g
    text: vertrek of uitzetting uit Nederland, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.24
  - number: 4.24.1.h
    text: uitreis uit Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.24
  - number: 4.24.2
    text: |-
      Elke doorhaling of vervallenverklaring van een in een reis- of identiteitspapier van een vreemdeling gestelde
      aantekening, wordt door de ambtenaar die de doorhaling of vervallenverklaring verricht, gedateerd en van diens
      paraaf voorzien.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.24
  - number: 4.25.1
    text: |-
      De ambtenaren belast met de grensbewaking, stellen in het reis- of identiteitspapier van de vreemdeling die toegang
      tot Nederland heeft en die Nederland langs een grensdoorlaatpost in- of uitreist een aantekening als bedoeld in
      [artikel 4.24, eerste lid, onder a en h][ref1], waaruit blijkt langs welke grensdoorlaatpost en op welke datum de
      in- of uitreis heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.25.2
    text: |-
      Bij de aantekening, welke ingevolge het eerste lid wordt gesteld in het reis- of identiteitspapier van een
      vreemdeling die Nederland inreist, wordt vermeld het aantal in gezelschap van de houder van dat document reizende
      vreemdelingen dat daarin is opgenomen of staat bijgeschreven. Bij inreis in Nederland van een vreemdeling, reizende
      in groepsverband op een collectief paspoort of op een collectieve lijst, worden de namen van de in het document
      opgenomen vreemdelingen die zich niet bij het gezelschap bevinden of aan wie de toegang tot Nederland wordt
      geweigerd, door de ambtenaar, belast met de grensbewaking, doorgehaald.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.25
  - number: '4.26'
    text: |-
      De ambtenaren belast met de grensbewaking, stellen in het reis- of identiteitspapier van een vreemdeling een
      aantekening als bedoeld in [artikel 4.24, eerste lid, onder d][ref1], inhoudende dat de vreemdeling zich binnen
      drie dagen bij de korpschef, onder vermelding van de plaats, moet melden, indien daartoe naar het oordeel van de
      ambtenaar belast met de grensbewaking in het belang van het toezicht op vreemdelingen gegronde reden bestaat. Deze
      aantekening kan ook geplaatst worden in een bijzonder doorlaatbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.26
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.27.1
    text: |-
      De ambtenaren belast met de grensbewaking, stellen in het reis- of identiteitspapier van een vreemdeling een
      aantekening als bedoeld in [artikel 4.24, eerste lid, onder f][ref1], indien zij vermoeden dat de vreemdeling
      andermaal zal trachten Nederland in te reizen zonder te voldoen aan de vereisten voor toegang, bedoeld in artikel 6
      van de Schengengrenscode of [artikel 3 van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.27
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '3'
  - number: 4.27.2
    text: |-
      Uit de aantekening, bedoeld in het eerste lid, blijkt dat de toegang is geweigerd, met vermelding van de datum en
      zo nodig de grond waarop deze weigering berust.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.27
  - number: 4.28.1
    text: |-
      De ambtenaren belast met de grensbewaking, stellen in het reis- of identiteitspapier van een vreemdeling een
      aantekening als bedoeld in [artikel 4.24, eerste lid, onder g][ref1], indien zij vermoeden dat de vreemdeling zal
      trachten zich andermaal naar Nederland te begeven zonder te voldoen aan de vereisten voor toegang tot Nederland.
      Een zodanige aantekening wordt niet gesteld indien het vertrek, de uitzetting of de doorreis van de vreemdeling
      door of diens toegang tot een derde land daardoor wordt bemoeilijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.28
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.28.2
    text: |-
      Uit de aantekening, bedoeld in het eerste lid, blijkt het vertrek of de uitzetting van de vreemdeling, met
      vermelding van de datum en zo nodig de reden van het vertrek of de uitzetting.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.28
  - number: 4.29.1
    text: |-
      De ambtenaren belast met het toezicht op vreemdelingen, stellen in het reis- en identiteitspapier van een
      vreemdeling aantekeningen omtrent:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
  - number: 4.29.1.a
    text: aanmelding of vervoeging bij de korpschef;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
  - number: 4.29.1.b
    text: de woon- of verblijfplaats binnen Nederland en vertrek naar het buitenland;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
  - number: 4.29.1.c
    text: |-
      het opleggen van een individuele verplichting tot periodieke aanmelding overeenkomstig
      [artikel 54, derde lid, van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
  - number: 4.29.1.d
    text: |-
      het beperken van de vrijheid van beweging overeenkomstig [artikel 56 van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel56
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '56'
  - number: 4.29.1.e
    text: vertrek of uitzetting uit Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
  - number: 4.29.1.f
    text: ongewenstverklaring;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
  - number: 4.29.1.g
    text: de datum en plaats van inreis in Nederland, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
  - number: 4.29.1.j
    text: het inreisverbod.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
  - number: 4.29.2
    text: |-
      Elke doorhaling of vervallenverklaring van een in het reis- of identiteitspapier van een vreemdeling gestelde
      aantekening wordt door de ambtenaar die de doorhaling of vervallenverklaring verricht, gedateerd en van diens
      paraaf voorzien.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
  - number: 4.29.3
    text: |-
      In afwijking van het eerste lid kan een aantekening op een aan de vreemdeling te verstrekken afzonderlijk inlegblad
      worden gesteld, indien:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
  - number: 4.29.3.a
    text: het reis- of identiteitspapier van de vreemdeling zich niet voor het stellen van een zodanige aantekening leent;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
  - number: 4.29.3.b
    text: de vreemdeling houder is van een buitenlands vreemdelingen- of vluchtelingenpaspoort;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
  - number: 4.29.3.c
    text: de vreemdeling geen geldig document voor grensoverschrijding heeft, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
  - number: 4.29.3.d
    text: |-
      de vreemdeling houder is van een document als bedoeld in [artikel 4.21, eerste lid, onder a, b, c of d][ref1], en
      niet in het bezit is van een geldig document voor grensoverschrijding.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.29
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.30.1
    text: |-
      De aantekeningen, bedoeld in [artikel 4.29, eerste lid, onder a][ref1], hebben betrekking op de aanmelding
      ingevolge de [artikelen 4.47 tot en met 4.51][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '3'
  - number: 4.30.2
    text: Uit de aantekening blijkt de datum van aanmelding.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.30
  - number: 4.30.3
    text: |-
      Uit de aantekening blijkt of het de vreemdeling is toegestaan arbeid te verrichten en of voor deze arbeid ingevolge
      de [Wet arbeid vreemdelingen][ref1] een tewerkstellingsvergunning of gecombineerde vergunning vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 4.30.4
    text: |-
      Indien het betreft een vreemdeling die naar Nederland is gekomen om als zeeman werk te zoeken aan boord van een
      zeeschip kan de aantekening worden aangevuld met een zinsnede waaruit zulks blijkt en wordt een uiterlijke datum
      van verblijf opgenomen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.30
  - number: 4.31.1
    text: |-
      De aantekening, bedoeld in [artikel 4.29, eerste lid, onder e][ref1], wordt gesteld indien op grond van
      [artikel 3.1][ref2] uitzetting van de vreemdeling achterwege blijft. De datum waarop de aanvraag is ontvangen wordt
      eveneens aangetekend. Indien de aanvraag wordt afgewezen, wordt «vervallen» aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.31
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 4.31.2
    text: |-
      Uit de aantekening blijkt of het de vreemdeling is toegestaan arbeid te verrichten en of voor deze arbeid ingevolge
      de [Wet arbeid vreemdelingen][ref1] een tewerkstellingsvergunning of gecombineerde vergunning vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.31
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 4.32.1
    text: |-
      Uit de aantekening, bedoeld in [artikel 4.29, eerste lid, onder b][ref1], blijkt op welke datum de vreemdeling is
      veranderd van woon- of verblijfplaats binnen Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.32
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.32.2
    text: De aantekening, bedoeld in het eerste lid, wordt door de korpschef gesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.32
  - number: 4.33.1
    text: |-
      Uit de aantekening, bedoeld in [artikel 4.29, eerste lid, onder c][ref1], blijkt de verplichte periode van
      aanmelding overeenkomstig [artikel 54, derde lid, van de Wet][ref2] alsmede eventuele verdere bijzonderheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.33
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '54'
  - number: 4.33.2
    text: |-
      Nadat de vreemdeling voor de eerste maal heeft voldaan aan de verplichting tot periodieke aanmelding
      ingevolge [artikel 4.51][ref1], kunnen de daarop volgende aanmeldingen worden aangetekend door in het reis- of
      identiteitspapier de datum van de aanmelding te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.33
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
        afdeling: '3'
  - number: 4.33.3
    text: |-
      Uit de aantekening, bedoeld in het eerste en tweede lid, blijkt of het de vreemdeling is toegestaan arbeid te
      verrichten en of voor deze arbeid ingevolge de [Wet arbeid vreemdelingen][ref1] een tewerkstellingsvergunning of
      gecombineerde vergunning vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.33
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 4.34.1
    text: |-
      De aantekeningen, bedoeld in [artikel 4.29, eerste lid, onder e][ref1], betreffen:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.34
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.34.1.a
    text: |-
      een aantekening waaruit de uiterlijke datum van vertrek blijkt, indien aan de vreemdeling overeenkomstig
      [artikel 62 van de Wet][ref1] een termijn is gegund waarbinnen hij Nederland uit eigen beweging dient te verlaten;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.34
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
  - number: 4.34.1.b
    text: |-
      een aantekening waaruit blijkt tot welke datum uitzetting van de vreemdeling achterwege blijft ingevolge
      [artikel 64 van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.34
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '64'
  - number: 4.34.1.c
    text: |-
      een aantekening waaruit de datum van indienen van een bezwaarschrift blijkt, indien de uitzetting achterwege blijft
      hangende een beslissing op een door de vreemdeling ingediend bezwaar, eventueel met doorhaling van de aantekening,
      bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.34
  - number: 4.34.1.d
    text: |-
      een aantekening omtrent uitzetting, indien naar het oordeel van de korpschef of de bevelhebber van de Koninklijke
      marechaussee gegronde reden bestaat om te vermoeden dat de vreemdeling zal trachten naar Nederland terug te keren
      zonder te voldoen aan de vereisten voor toegang tot Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.34
  - number: 4.34.2
    text: Bij een aantekening als bedoeld in het eerste lid, onder b, wordt tevens gesteld dat arbeid niet is toegestaan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.34
  - number: 4.34.3
    text: |-
      De aantekening, bedoeld in het eerste lid, onder d, wordt niet gesteld, indien het vertrek, de uitzetting of de
      doorreis van de vreemdeling door, of diens toelating tot een derde land daardoor wordt bemoeilijkt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.34
  - number: 4.35.1
    text: |-
      De aantekening, bedoeld in [artikel 4.29, eerste lid, onder f][ref1], wordt geplaatst, indien de korpschef of
      de bevelhebber van de Koninklijke marechaussee vermoedt dat de vreemdeling zal trachten naar Nederland terug te
      keren zonder te voldoen aan de vereisten voor toegang tot Nederland. De aantekening wordt niet gesteld indien het
      vertrek, de uitzetting of de doorreis van de vreemdeling door, of diens toelating tot een derde land daardoor wordt
      bemoeilijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.35
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 4.35.2
    text: Uit de aantekening blijkt de datum waarop de vreemdeling ongewenst is verklaard.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.35
  - number: 4.35a.1
    text: |-
      De aantekening, bedoeld in [artikel 4.29, eerste lid, onder j][ref1], wordt geplaatst, indien de korpschef of
      de bevelhebber van de Koninklijke marechaussee vermoedt dat de vreemdeling zal trachten naar Nederland terug te
      keren zonder te voldoen aan de vereisten voor toegang tot Nederland. De aantekening wordt niet gesteld indien het
      vertrek, de uitzetting of de doorreis van de vreemdeling door, of diens toegang tot een derde land, niet zijnde een
      andere staat als bedoeld in [artikel 1.3][ref2], daardoor wordt bemoeilijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel1
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.35a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: 4.35a.2
    text: Uit de aantekening blijken de duur van het inreisverbod en de datum waarop het is uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.35a
  - number: '4.36'
    text: Bij ministeriële regeling kunnen modellen van de aantekeningen, bedoeld in deze afdeling, worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.36
  - number: 4.37.1
    text: |-
      De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder a tot en met h, van de Wet][ref1], is
      verplicht om in geval van:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.37
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.37.1.a
    text: |-
      verandering van adres binnen de gemeente waar de vreemdeling woont of verblijft, hiervan binnen vijf dagen kennis
      te geven aan Onze Minister;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.37
  - number: 4.37.1.b
    text: |-
      verandering van woon- of verblijfplaats binnen Nederland, onder opgave van het nieuwe adres, hiervan binnen vijf
      dagen na aankomst in de nieuwe woon- of verblijfplaats in persoon kennis te geven aan Onze Minister;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.37
  - number: 4.37.1.c
    text: |-
      vertrek naar het buitenland, zo mogelijk onder opgave van het nieuwe adres, hiervan vóór het vertrek kennis te
      geven aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.37
  - number: 4.37.2
    text: |-
      De in het eerste lid bedoelde kennisgeving blijft achterwege indien de vreemdeling als ingezetene met een adres in
      de nieuwe woonplaats is ingeschreven in de basisregistratie personen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.37
  - number: 4.37.3
    text: |-
      De vreemdeling die niet rechtmatig verblijft als bedoeld in [artikel 8, onder a tot en met h, van de Wet][ref1],
      geeft kennis van verandering van woon- of verblijfplaats binnen Nederland als bedoeld in het eerste lid, onder b,
      indien Onze Minister dat vordert.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.37
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.37.4
    text: |-
      De in het eerste en derde lid omschreven verplichtingen rusten ten aanzien van kinderen beneden de leeftijd van
      twaalf jaar op de wettelijke vertegenwoordiger. Voor kinderen van twaalf jaar en ouder kan aan deze verplichtingen
      ook worden voldaan door de wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.37
  - number: 4.37.5
    text: |-
      De in het eerste en derde lid omschreven verplichtingen rusten niet op de onderdaan van een staat die partij is bij
      het Verdrag betreffende de werking van de Europese Unie, de Overeenkomst betreffende de Europese Economische Ruimte
      of de onderdaan van Zwitserland met verblijfsrecht van maximaal drie maanden als bedoeld in [artikel 8.11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.37
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 4.37.6
    text: |-
      Van vertrek naar het buitenland wordt geen kennis gegeven door de vreemdeling die rechtmatig verblijft als bedoeld
      in [artikel 8, onder a tot en met e, van de Wet][ref1], indien de vreemdeling zijn hoofdverblijf niet naar het
      buitenland verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.37
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.38.1
    text: |-
      De vreemdeling verstrekt op vordering van Onze Minister de gegevens, die nodig zijn voor van de toepassing van het
      bepaalde bij of krachtens de [Wet][ref1] en waarover hij redelijkerwijs kan beschikken, binnen de in de vordering
      aangegeven tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.38
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 4.38.2
    text: |-
      Indien daartoe in het belang van het toezicht op vreemdelingen gegronde reden bestaat kan de in het voorgaande lid
      bedoelde vordering inhouden dat de vreemdeling de gegevens in persoon verstrekt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.38
  - number: 4.38.3
    text: |-
      In het belang van de vreemdelingenregistratie kan een vordering als bedoeld in het eerste lid bij algemene
      bekendmaking worden gedaan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.38
  - number: 4.38.4
    text: |-
      Indien de vreemdeling jonger is dan twaalf jaar, dan kan de vordering, bedoeld in het eerste tot en met derde lid,
      worden gericht tot de wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.38
  - number: '4.39'
    text: |-
      De vreemdeling die geen rechtmatig verblijf heeft, doet onmiddellijk van zijn aanwezigheid in persoon mededeling
      aan de korpschef.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.39
  - number: '4.40'
    text: |-
      Personen die nachtverblijf verschaffen aan een vreemdeling, van wie zij weten of redelijkerwijs kunnen vermoeden
      dat deze vreemdeling niet rechtmatig in Nederland verblijft als bedoeld in [artikel 8 van de Wet][ref1], doen
      daarvan onmiddellijk mededeling aan de korpschef.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.40
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '4.41'
    text: |-
      Werkgevers, van wie bij Onze Minister bekend is dat zij een vreemdeling in dienst hebben gehad die niet rechtmatig
      verbleef of aan wie het niet was toegestaan arbeid te verrichten, verstrekken aan Onze Minister, op diens
      vordering, onmiddellijk de gegevens omtrent de vreemdeling die bij hen tewerkgesteld wordt, in dienst is of in
      dienst is geweest. Onze Minister kan een termijn stellen waarbinnen de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.41
  - number: 4.42.1
    text: |-
      De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder i, van de Wet][ref1] en die arbeid gaat
      zoeken of arbeid gaat verrichten, deelt dit onmiddellijk mee aan de korpschef.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.42
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.42.2
    text: 'Het eerste lid is niet van toepassing op de vreemdeling die:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.42
  - number: 4.42.2.a
    text: |-
      houder is van een geldige machtiging tot voorlopig verblijf afgegeven voor een verblijfsdoel waarbij het verrichten
      van arbeid is toegestaan;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.42
  - number: 4.42.2.b
    text: |-
      kan aantonen dat hij naar Nederland is gekomen voor het verrichten van arbeid gedurende ten hoogste 90 dagen, te
      rekenen vanaf het tijdstip van zijn binnenkomst;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.42
  - number: 4.42.2.c
    text: naar Nederland is gekomen om aan te monsteren of als zeeman werk te zoeken aan boord van een zeeschip, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.42
  - number: 4.42.2.d
    text: |-
      naar Nederland is gekomen voor een verblijf op grond van [artikel 3.3, vierde of vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.42
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 4.42.3
    text: |-
      Het tweede lid is niet van toepassing indien de arbeid geheel of gedeeltelijk bestaat uit het verrichten
      van seksuele handelingen met derden of het verlenen van seksuele diensten aan derden, tenzij de vreemdeling
      gemeenschapsonderdaan is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.42
  - number: '4.43'
    text: |-
      De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder a, van de Wet][ref1] en die niet langer
      voldoet aan de beperking waaronder de verblijfsvergunning is verleend, deelt dit binnen vier weken mee aan Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.43
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '4.44'
    text: |-
      De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1]
      en wiens document, bedoeld in [artikel 9 van de Wet][ref2], waaruit het rechtmatig verblijf blijkt, vermist wordt,
      verloren is gegaan of ondeugdelijk is geworden voor identificatie, doet daarvan onmiddellijk in persoon aangifte
      bij de korpschef. De korpschef stelt Onze Minister hiervan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 4.44a.1
    text: |-
      De referent die weet of redelijkerwijs kan vermoeden dat de vreemdeling, wiens referent hij is, niet langer voldoet
      aan de beperking waaronder de verblijfsvergunning is verleend, doet hiervan binnen vier weken mededeling aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.44a
  - number: 4.44a.2
    text: |-
      De referent doet binnen vier weken mededeling aan Onze Minister van de beëindiging van diens aan het referentschap
      ten grondslag liggende relatie tot de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.44a
  - number: 4.44a.3
    text: 'Bij ministeriële regeling worden regels gesteld omtrent de door de referent te verstrekken gegevens betreffende:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.44a
  - number: 4.44a.3.a
    text: de vreemdeling wiens referent hij is of is geweest;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.44a
  - number: 4.44a.3.b
    text: de nakoming van zijn verplichtingen als referent, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.44a
  - number: 4.44a.3.c
    text: zijn positie als referent,
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.44a
  - number: 4.44a.4
    text: |-
      In het belang van het toezicht op vreemdelingen of het toezicht op referenten kan Onze Minister of de ambtenaar
      belast met het toezicht op vreemdelingen of met het toezicht op referenten bepalen dat de referent de gegevens in
      persoon verstrekt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.44a
  - number: 4.44b.1
    text: |-
      De houder van een verblijfsvergunning regulier voor bepaalde tijd ten behoeve van wiens verblijf geen referent
      optreedt, verstrekt Onze Minister gegevens die van belang zijn voor de toepassing van de wet.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.44b
  - number: 4.44b.2
    text: |-
      In het belang van het toezicht op vreemdelingen kan Onze Minister of de ambtenaar belast met het toezicht op
      vreemdelingen bepalen dat de vreemdeling de gegevens in persoon verstrekt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.44b
  - number: 4.44b.3
    text: Bij ministeriële regeling worden nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.44b
  - number: '4.45'
    text: |-
      De medewerking van de vreemdeling, bedoeld in [artikel 54, eerste lid, onderdeel c, van de Wet][ref1], bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
  - number: 4.45.a
    text: |-
      het op vordering van Onze Minister, een ambtenaar belast met de grensbewaking of een ambtenaar belast met het
      toezicht op vreemdelingen, beschikbaar stellen van een goedgelijkende pasfoto, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.45
  - number: 4.45.b
    text: het zich laten fotograferen en het laten afnemen van vingerafdrukken.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.45
  - number: 4.46.1
    text: |-
      De vreemdeling die naar Nederland is gekomen voor een verblijf van langer dan 90 dagen, werkt op grond van
      [artikel 54, eerste lid, onderdeel d, van de Wet][ref1] mee aan een onderzoek naar tuberculose.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
  - number: 4.46.2
    text: |-
      Het eerste lid is niet van toepassing op de vreemdeling die de nationaliteit bezit van een van de bij ministeriële
      regeling vast te stellen landen, langdurig ingezetene is dan wel als gezinslid van een langdurig ingezetene in een
      andere lidstaat van de Europese Unie is toegelaten.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.46
  - number: 4.47.1
    text: |-
      De vreemdeling die rechtmatig verblijft als bedoeld in [artikel 8, onder i, van de Wet][ref1] en die naar Nederland
      is gekomen voor een verblijf van langer dan 90 dagen, meldt zich binnen drie dagen na binnenkomst in Nederland in
      persoon aan bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.47
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.47.2
    text: |-
      Voor de berekening van de in het eerste lid bedoelde termijn van 90 dagen wordt eerder verblijf in Nederland binnen
      een tijdvak van 180 dagen, onmiddellijk voorafgaande aan de binnenkomst, mede in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.47
  - number: 4.47.3
    text: Indien de vreemdeling jonger is dan twaalf jaar, doet degene bij wie de vreemdeling woont of verblijft de melding.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.47
  - number: 4.47.4
    text: |-
      In afwijking van het eerste lid kan de aanmelding door een onderzoeker of student die naar Nederland is gekomen
      voor een verblijf van ten hoogste 180 binnen 360 dagen onderscheidenlijk ten hoogste 360 dagen op grond van
      [artikel 3.3, vierde of vijfde lid][ref1], namens de vreemdeling geschieden door de erkende referent waar hij het
      deel van zijn onderzoek of studie gaat verrichten. In dat geval kan de aanmelding in afwijking van het eerste lid
      geschieden zodra de erkende referent het voornemen tot een dergelijk verblijf kent.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.47
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 4.47.5
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het al dan niet in persoon verstrekken
      van gegevens of bescheiden bij de aanmelding.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.47
  - number: 4.47.6
    text: Bij ministeriële regeling kunnen gevallen worden aangewezen waarin de aanmelding schriftelijk kan geschieden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.47
  - number: 4.49.1
    text: |-
      De vreemdeling die houder is van een visum of een document voor grensoverschrijding waarin door de daartoe bevoegde
      autoriteit een aantekening is gesteld omtrent aanmelding bij een vreemdelingendienst in Nederland, meldt zich
      binnen drie dagen na binnenkomst in Nederland in persoon aan bij de korpschef.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.49
  - number: 4.49.2
    text: |-
      Het eerste lid is niet van toepassing op onderdanen van een staat die partij is bij het Verdrag betreffende de
      werking van de Europese Unie of de Overeenkomst betreffende de Europese Economische Ruimte en op onderdanen van
      Zwitserland.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.49
  - number: 4.50.1
    text: |-
      De vreemdeling die naar Nederland is gekomen om als zeeman werk te zoeken aan boord van een zeeschip, meldt zich
      binnen drie dagen na binnenkomst in Nederland in persoon aan bij de korpschef.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.50
  - number: 4.50.2
    text: |-
      Het eerste lid is niet van toepassing op onderdanen van een staat die partij is bij het Verdrag betreffende de
      werking van de Europese Unie of de Overeenkomst betreffende de Europese Economische Ruimte en op onderdanen van
      Zwitserland.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.50
  - number: 4.51.1
    text: |-
      Tot periodieke aanmelding als bedoeld in [artikel 54, eerste lid, onder f, van de Wet][ref1], bij de korpschef is
      verplicht de vreemdeling die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.51
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
  - number: 4.51.1.a
    text: geen rechtmatig verblijf heeft en in afwachting is van de feitelijke mogelijkheid tot vertrek of uitzetting, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.51
  - number: 4.51.1.b
    text: |-
      rechtmatig verblijft als bedoeld in [artikel 8, onder f, g, h of m van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.51
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.51.2
    text: |-
      De vreemdeling, bedoeld in het eerste lid, meldt zich wekelijks, tenzij Onze Minister een andere termijn stelt, dan
      wel ontheffing verleent.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.51
  - number: 4.51.3
    text: Het eerste lid is niet van toepassing, indien de vreemdeling rechtens zijn vrijheid is ontnomen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.51
  - number: 4.51.4
    text: |-
      Het eerste lid is niet van toepassing op onderdanen van een staat die partij is bij het Verdrag betreffende de
      werking van de Europese Unie of de Overeenkomst betreffende de Europese Economische Ruimte en op onderdanen van
      Zwitserland.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.51
  - number: 4.52.1
    text: |-
      De vreemdeling levert het document, bedoeld in [artikel 9 van de Wet][ref1], overeenkomstig door Onze Minister
      gestelde regels in bij Onze Minister of de korpschef:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 4.52.1.a
    text: |-
      zodra hij niet meer rechtmatig verblijft, doch uiterlijk op het moment waarop de vertrektermijn, bedoeld in
      [artikel 62 van de Wet][ref1], verstrijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
  - number: 4.52.1.b
    text: vóór zijn vertrek naar het buitenland, indien hij zijn hoofdverblijf buiten Nederland verplaatst;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52
  - number: 4.52.1.c
    text: indien aan de vreemdeling een nieuw verblijfsdocument is verleend;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52
  - number: 4.52.1.d
    text: indien aan de vreemdeling het Nederlanderschap wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52
  - number: 4.52.2
    text: |-
      De persoon die het Nederlanderschap heeft verkregen levert het document, bedoeld in [artikel 9 van de Wet][ref1],
      overeenkomstig door Onze Minister gestelde regels in bij Onze Minister of de korpschef.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 4.52a.1
    text: |-
      De ambtenaar belast met de grensbewaking of het toezicht op vreemdelingen kan van de vreemdeling die Nederland
      ingevolge [artikel 62, eerste of derde lid, van de Wet][ref1] uit eigen beweging binnen vier weken dan wel een
      maand moet verlaten zekerheid verlangen, teneinde het risico te beperken dat de vreemdeling zich zal onttrekken aan
      het toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
  - number: 4.52a.2
    text: 'De zekerheid, bedoeld in het eerste lid, kan ook worden verlangd in geval van uitstel van vertrek of uitzetting:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52a
  - number: 4.52a.2.a
    text: op grond dat het vertrek of de uitzetting in strijd zou zijn met het beginsel van non-refoulement;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52a
  - number: 4.52a.2.b
    text: |-
      zolang de vreemdeling rechtmatig verblijf heeft als bedoeld in [artikel 8, onder h of j, van de Wet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.52a.2.c
    text: |-
      wegens technische redenen, zoals het ontbreken van vervoermiddelen of het mislukken van het vertrek of de
      uitzetting wegens onvoldoende identificatie.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52a
  - number: 4.52a.3
    text: 'De zekerheid, bedoeld in het eerste lid, kan bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52a
  - number: 4.52a.3.a
    text: de overlegging van een reis- of identiteitsdocument;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52a
  - number: 4.52a.3.b
    text: de overlegging van een passagebiljet;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52a
  - number: 4.52a.3.c
    text: het deponeren van een waarborgsom;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52a
  - number: 4.52a.3.d
    text: een verklaring van een solvabele derde die zich voor de kosten garant stelt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52a
  - number: 4.52a.3.e
    text: de overlegging van bewijs van het beschikken over een verzekering die de ziektekosten in Nederland volledig dekt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52a
  - number: 4.52a.4
    text: Het model van de garantverklaring wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52a
  - number: 4.52b.1
    text: |-
      De waarborgsom, bedoeld in [artikel 4.52a, derde lid, onder c][ref1], wordt door Onze Minister in ieder geval aan
      de rechthebbende teruggegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
        afdeling: '3'
  - number: 4.52b.1.a
    text: |-
      zodra de vreemdeling, bedoeld in [artikel 4.52a, eerste lid][ref1], binnen de voor hem geldende vertrektermijn uit
      eigen beweging Nederland heeft verlaten zonder zich tussentijds aan het toezicht te hebben onttrokken; dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
        afdeling: '3'
  - number: 4.52b.1.b
    text: |-
      zodra de vreemdeling na uitstel van het vertrek of de uitzetting, bedoeld in [artikel 4.52a, tweede lid][ref1],
      Nederland heeft verlaten of is uitgezet zonder zich tussentijds aan het toezicht te hebben onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
        afdeling: '3'
  - number: 4.52b.2
    text: |-
      Onze Minister berekent rente over de waarborgsommen, gedeponeerd krachtens
      [artikel 4.52a, derde lid, onder c][ref1]. [Artikel 3.9, tweede lid][ref2], en [artikel 3.10, tweede lid][ref3]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 4.52b.3
    text: |-
      De waarborgsom wordt teruggegeven en de rente wordt uitbetaald zo spoedig mogelijk nadat één van de in het eerste
      lid genoemde gronden zich voordoet.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.52b
  - number: 4.53.1
    text: |-
      De referent voert overeenkomstig bij ministeriële regeling gestelde regels een administratie met gegevens met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.53
  - number: 4.53.1.a
    text: de vreemdeling wiens referent hij is of was;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.53
  - number: 4.53.1.b
    text: de nakoming van zijn verplichtingen als referent, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.53
  - number: 4.53.1.c
    text: zijn positie als referent.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.53
  - number: 4.53.2
    text: 'In de administratie, bedoeld in het eerste lid, worden in ieder geval opgenomen:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.53
  - number: 4.53.2.a
    text: |-
      een kopie van het geldig document voor grensoverschrijding van de vreemdeling, tenzij Onze Minister overeenkomstig
      [artikel 3.72][ref1] heeft geoordeeld dat die vreemdeling niet in het bezit kan worden gesteld van een dergelijk
      document;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.53
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 4.53.2.b
    text: |-
      gegevens waaruit blijkt dat de referent tijdig en volledig heeft voldaan aan zijn verplichtingen op
      grond van de [artikelen 2a, derde lid, onder b][ref1], [24a, eerste lid, onder b en tweede lid][ref2], en
      [54, tweede lid, onder a, van de Wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel24a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.53
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 24a
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '54'
  - number: 4.53.2.c
    text: de bij ministeriële regeling genoemde gegevens.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.53
  - number: 4.53.3
    text: |-
      Voor zover zulks noodzakelijk is voor de naleving van diens informatieplicht en administratieplicht, en de
      persoonlijke levenssfeer van de betrokkene daardoor niet onevenredig wordt geschaad, verlangt de referent van
      de vreemdeling opgave van gegevens die van belang zijn voor de toepassing van het bepaalde bij of krachtens de
      [Wet][ref1] en verstrekt de vreemdeling die gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.53
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 4.53.4
    text: |-
      De referent verstrekt Onze Minister of de ambtenaar belast met het toezicht op referenten overeenkomstig door Onze
      Minister te stellen regels gegevens uit de administratie. Gedurende vijf jaar na beëindiging van het referentschap
      bewaart de gewezen referent de administratie en verstrekt hij op verzoek van de ambtenaar belast met het toezicht
      op referenten daaruit de gegevens en bescheiden, welke van belang zijn voor het toezicht op referenten.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel4.53
  - number: 5.1.1
    text: |-
      De maatregel van beperking van vrijheid van beweging, bedoeld in [artikel 56, eerste lid, van de Wet][ref1] kan
      bestaan uit:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel56
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '56'
  - number: 5.1.1.a
    text: een verplichting zich bij verblijf in Nederland in een bepaald gedeelte van Nederland te bevinden, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1
  - number: 5.1.1.b
    text: |-
      een verplichting zich te houden aan een verbod om zich in een bepaald gedeelte of bepaalde gedeelten van Nederland
      te bevinden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1
  - number: 5.1.2
    text: |-
      De maatregel, bedoeld in het eerste lid, wordt niet opgelegd aan de vreemdeling die rechtmatig verblijf heeft op
      grond van [artikel 8, onderdeel a, van de Wet][ref1] en houder is van een EU-verblijfsvergunning voor langdurig
      ingezetenen die is afgegeven door een andere staat die partij is bij het Verdrag betreffende de werking van de
      Europese Unie anders dan om redenen van veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 5.1.3
    text: |-
      De maatregel wordt evenmin opgelegd aan een houder van een door Onze Minister afgegeven Europese blauwe kaart
      anders dan om redenen van veiligheid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1
  - number: 5.1a.1
    text: |-
      Een vreemdeling als bedoeld in [artikel 59, eerste lid, van de Wet][ref1] kan in bewaring worden gesteld op grond
      dat het belang van de openbare orde of nationale veiligheid zulks vordert, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
  - number: 5.1a.1.a
    text: een risico bestaat dat de vreemdeling zich aan het toezicht zal onttrekken, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1a
  - number: 5.1a.1.b
    text: de vreemdeling de voorbereiding van het vertrek of de uitzettingsprocedure ontwijkt of belemmert.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1a
  - number: 5.1a.2
    text: |-
      Een vreemdeling als bedoeld in [artikel 59b, eerste lid, van de Wet][ref1] kan in bewaring worden gesteld omdat het
      belang van de openbare orde zulks vordert, indien een van de gronden als bedoeld in artikel 59b, eerste lid van de
      Wet zich voordoet. [Artikel 5.1c][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 59b
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.1a.3
    text: |-
      Een vrijheidsontnemende maatregel op grond van [artikel 6, derde lid, van de Wet][ref1] wordt opgelegd in het kader
      van het grensbewakingsbelang. Deze wordt niet opgelegd of voortgezet indien sprake is van bijzondere individuele
      omstandigheden die vrijheidsontneming onevenredig bezwarend maken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
  - number: 5.1a.4
    text: |-
      Het eerste lid is van overeenkomstige toepassing in geval van oplegging van de vrijheidsontnemende maatregel op
      grond van [artikel 6, zesde lid, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
  - number: 5.1a.5
    text: |-
      Met het oog op de overdracht aan een verantwoordelijke lidstaat met inachtneming van artikel 28 van de
      Dublinverordening, kan een vreemdeling een vrijheidsontnemende maatregel worden opgelegd of kan hij in bewaring
      worden gesteld, indien:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1a
  - number: 5.1a.5.a
    text: een concreet aanknopingspunt bestaat voor een overdracht als bedoeld in de Dublinverordening; en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1a
  - number: 5.1a.5.b
    text: een significant risico bestaat dat de vreemdeling zich aan het toezicht zal onttrekken.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1a
  - number: 5.1b.1
    text: |-
      Aan de voorwaarden voor inbewaringstelling, bedoeld in [artikel 5.1a, eerste lid][ref1], of voor het opleggen van
      een vrijheidsontnemende maatregel, bedoeld in artikel 5.1a, vierde lid, is slechts voldaan indien ten minste twee
      van de gronden, bedoeld in het derde en vierde lid zich voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.1b.2
    text: |-
      Aan de voorwaarden voor inbewaringstelling of voor het opleggen van een vrijheidsontnemende maatregel, bedoeld in
      [artikel 5.1a, vijfde lid][ref1], wordt slechts voldaan indien ten minste twee van de gronden, bedoeld in het derde
      en vierde lid zich voordoen, waarvan ten minste één van de gronden, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.1b.3
    text: |-
      Er is sprake van een zware grond voor inbewaringstelling of voor het opleggen van een vrijheidsontnemende maatregel
      indien de vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.3.a
    text: Nederland niet op de voorgeschreven wijze is binnengekomen, dan wel een poging daartoe heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.3.b
    text: |-
      zich in strijd met de Vreemdelingenwetgeving gedurende enige tijd aan het toezicht op vreemdelingen heeft
      onttrokken;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.3.c
    text: |-
      eerder een visum, besluit, kennisgeving of aanzegging heeft ontvangen waaruit de plicht Nederland te verlaten
      blijkt en hij daaraan niet uit eigen beweging binnen de daarin besloten of gestelde termijn gevolg heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.3.d
    text: niet dan wel niet voldoende meewerkt aan het vaststellen van zijn identiteit en nationaliteit;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.3.e
    text: |-
      in verband met zijn aanvraag om toelating onjuiste of tegenstrijdige gegevens heeft verstrekt met betrekking tot
      zijn identiteit, nationaliteit of de reis naar Nederland of een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.3.f
    text: zich zonder noodzaak heeft ontdaan van zijn reis- of identiteitsdocumenten;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.3.g
    text: in het Nederlandse rechtsverkeer gebruik heeft gemaakt van valse of vervalste documenten;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.3.h
    text: |-
      tot ongewenst vreemdeling is verklaard als bedoeld in [artikel 67 van de Wet][ref1] of tegen hem een inreisverbod
      is uitgevaardigd met toepassing van [artikel 66a, zevende lid, van de Wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel66a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 66a
  - number: 5.1b.3.i
    text: heeft te kennen gegeven dat hij geen gevolg zal geven aan zijn verplichting tot terugkeer;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.3.j
    text: |-
      aan de grens te kennen heeft gegeven een aanvraag tot het verlenen van een verblijfsvergunning asiel voor bepaalde
      tijd te willen indienen, en zijn aanvraag met toepassing van de grensprocedure niet in behandeling is genomen,
      niet-ontvankelijk is verklaard of is afgewezen als kennelijk ongegrond;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.3.k
    text: |-
      een overdrachtsbesluit heeft ontvangen en geen medewerking verleent aan de overdracht aan de lidstaat die
      verantwoordelijk is voor de behandeling van zijn asielverzoek;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.3.l
    text: |-
      een overdrachtsbesluit heeft ontvangen, hem op zijn initiatief een termijn is gesteld om uit eigen beweging te
      vertrekken naar de lidstaat die verantwoordelijk is voor de behandeling van zijn asielverzoek, en hij niet uit
      eigen beweging binnen deze termijn is vertrokken, dan wel
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.3.m
    text: |-
      een overdrachtsbesluit heeft ontvangen en onmiddellijke overdracht of overdracht op zeer korte termijn noodzakelijk
      is ten behoeve van het realiseren van de overdracht binnen zes maanden na het akkoord van de lidstaat die
      verantwoordelijk is voor de behandeling van zijn asielverzoek.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.4
    text: |-
      Er is sprake van een lichte grond voor inbewaringstelling of voor het opleggen van een vrijheidsontnemende
      maatregel indien de vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.4.a
    text: |-
      zich niet aan een of meer andere voor hem geldende verplichtingen van [hoofdstuk 4][ref1] heeft gehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        hoofdstuk: '4'
  - number: 5.1b.4.b
    text: |-
      meerdere aanvragen tot het verlenen van een verblijfsvergunning heeft ingediend die niet tot verlening van een
      verblijfsvergunning hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.4.c
    text: geen vaste woon- of verblijfplaats heeft;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.4.d
    text: niet beschikt over voldoende middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.4.e
    text: verdachte is van enig misdrijf dan wel daarvoor is veroordeeld; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
  - number: 5.1b.4.f
    text: |-
      arbeid heeft verricht in strijd met de [Wet arbeid vreemdelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1b
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 5.1c.1
    text: |-
      De grond voor bewaring, bedoeld in [artikel 59b, eerste lid, onderdeel a, van de Wet][ref1], is aanwezig, indien de
      identiteit of de nationaliteit van de vreemdeling met onvoldoende zekerheid bekend is en zich ten minste twee van
      de gronden, bedoeld in [artikel 5.1b, derde en vierde lid][ref2], voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 59b
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.1c.2
    text: |-
      De grond voor bewaring, bedoeld in [artikel 59b, eerste lid, onderdeel b, van de Wet][ref1], is aanwezig,
      indien door middel van bewaring de gegevens die noodzakelijk zijn voor beoordeling van een aanvraag tot het
      verkrijgen van een verblijfsvergunning kunnen worden verkregen, en zich ten minste twee van de gronden, bedoeld in
      [artikel 5.1b, derde en vierde lid][ref2], voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 59b
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.1c.3
    text: |-
      Bij de beoordeling of sprake is van een aanvraag die louter is ingediend teneinde
      de uitvoering van het terugkeerbesluit uit te stellen of te verijdelen als bedoeld
      [artikel 59b, eerste lid, onderdeel c, ten derde, van de Wet][ref1] worden alle omstandigheden van het geval
      betrokken, waaronder met name:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 59b
  - number: 5.1c.3.a
    text: |-
      of de vreemdeling eerder een aanvraag tot het verlenen van een verblijfsvergunning asiel voor bepaalde tijd heeft
      gedaan;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1c
  - number: 5.1c.3.b
    text: |-
      de termijn waarbinnen de vreemdeling zijn aanvraag tot het verlenen van een verblijfsvergunning asiel voor bepaalde
      tijd kenbaar heeft gemaakt in het licht van zijn verklaringen hieromtrent;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1c
  - number: 5.1c.3.c
    text: de omstandigheden waaronder de vreemdeling is aangetroffen dan wel zijn aanvraag kenbaar heeft gemaakt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1c
  - number: 5.1c.3.d
    text: of de vreemdeling in het Schengeninformatiesysteem ter zake van een inreisverbod gesignaleerd staat;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1c
  - number: 5.1c.3.e
    text: |-
      de gestelde nationaliteit in het licht van de toepassing van [artikel 30b, eerste lid, onder b van de Wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30b
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30b
  - number: 5.1c.3.f
    text: de onderbouwing van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1c
  - number: 5.1c.4
    text: |-
      De grond voor bewaring, bedoeld in [artikel 59b, eerste lid, onderdeel d, van de Wet][ref1], is in ieder geval
      aanwezig, indien er is sprake van een aanvraagprocedure waarin vermoedelijk artikel 1F van het Vluchtelingenverdrag
      kan worden tegengeworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.1c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 59b
  - number: 5.2.1
    text: |-
      Voordat de vreemdeling op grond van [artikel 59][ref1], [59a][ref2] of [59b van de Wet][ref3] in bewaring wordt
      gesteld, wordt hij gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel59a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 59a
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 59b
  - number: 5.2.2
    text: |-
      Het eerste lid is niet van toepassing indien het voorafgaande gehoor van de vreemdeling niet kan worden afgewacht.
      In dat geval wordt de vreemdeling zo spoedig mogelijk na de tenuitvoerlegging van de bewaring gehoord.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.2
  - number: 5.2.3
    text: Van het gehoor wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.2
  - number: 5.2.4
    text: |-
      Aan de vreemdeling wordt tijdig mededeling gedaan van de hem toekomende bevoegdheid zich bij het gehoor te doen
      bijstaan door zijn raadsman.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.2
  - number: 5.3.1
    text: |-
      De maatregel waarbij de bewaring op grond van [artikel 59][ref1], [59a][ref2] of [59b van de Wet][ref3] wordt
      opgelegd wordt gedagtekend en ondertekend; de maatregel wordt met redenen omkleed. Aan de vreemdeling op wie de
      maatregel betrekking heeft, wordt onmiddellijk een afschrift daarvan uitgereikt. De vreemdeling wordt daarbij
      schriftelijk, in een taal die hij verstaat of waarvan redelijkerwijs kan worden aangenomen dat hij deze verstaat,
      op de hoogte gebracht van de redenen van bewaring en van de in het nationale recht vastgestelde procedures om het
      bevel tot bewaring aan te vechten, alsook van de mogelijkheid om gratis rechtsbijstand en vertegenwoordiging aan
      te vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel59a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 59a
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 59b
  - number: 5.3.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing in geval van oplegging van de vrijheidsontnemende maatregel op
      grond van [artikel 6, derde of zesde lid, van de Wet][ref1] en in situaties waarin de bewaring van de vreemdeling
      op een andere wettelijke grondslag wordt voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
  - number: 5.4.1
    text: |-
      De bewaring op grond van [artikel 59][ref1], [59a][ref2] of [59b van de Wet][ref3] wordt ten uitvoer gelegd op
      een politiebureau, een cel van de Koninklijke marechaussee, in een huis van bewaring of een ruimte of plaats als
      bedoeld in [artikel 6, tweede lid][ref4], of [artikel 58, eerste lid van de Wet][ref5]. Bij de tenuitvoerlegging
      van de bewaring wordt de vreemdeling niet verder beperkt in de uitoefening van grondrechten dan wordt gevorderd
      door het doel van deze maatregel en de handhaving van de orde en de veiligheid op de plaats van tenuitvoerlegging.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel59a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel58
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 59a
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 59b
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0011823
        artikel: '58'
  - number: 5.4.2
    text: |-
      Indien de tenuitvoerlegging van de bewaring een aanvang neemt op een politiebureau of in een cel van de Koninklijke
      marechaussee, wordt zodra dit redelijkerwijs mogelijk is de tenuitvoerlegging voortgezet in een huis van bewaring
      of een ruimte of plaats als bedoeld in [artikel 6, tweede lid][ref1] of [artikel 58, eerste lid, van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel58
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '58'
  - number: 5.4.3
    text: De bewaring wordt opgeheven zodra er geen grond meer aanwezig is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.4
  - number: 5.5.1
    text: |-
      Gedurende de tenuitvoerlegging van een vrijheidsontnemende maatregel ingevolge de [artikelen 6, tweede lid][ref1],
      [58, eerste lid][ref2], of [59][ref3], [59a][ref4] of [59b, van de Wet][ref5], kan de vreemdeling voor korte duur
      naar elders worden gebracht, wanneer dit redelijkerwijs nodig is voor de toepassing van de [Wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel59a
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
      [ref6]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '58'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '59'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: 59a
      - id: ref5
        bwb_id: BWBR0011823
        artikel: 59b
      - id: ref6
        bwb_id: BWBR0011823
  - number: 5.5.2
    text: |-
      Van de tenuitvoerlegging van een vrijheidsontnemende maatregel als bedoeld in het eerste lid, wordt op verzoek van
      de vreemdeling zo spoedig mogelijk kennis gegeven aan diens naaste verwanten of aan een in Nederland gevestigde
      diplomatieke of consulaire vertegenwoordiging van de staat waarvan hij onderdaan is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.5
  - number: 5.5.3
    text: |-
      In geval de vrijheidsontnemende maatregel een minderjarige betreft wordt daarvan, zo daartoe de gelegenheid
      bestaat, ambtshalve zo spoedig mogelijk kennis gegeven aan degenen die de ouderlijke macht of de voogdij over die
      minderjarige uitoefenen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.5
  - number: '5.6'
    text: |-
      Overeenkomstig door Onze Minister te geven algemene en bijzondere aanwijzingen stelt de korpschef of
      de bevelhebber van de Koninklijke marechaussee Onze Minister tijdig vóór het verstrijken van de in
      [artikel 94, eerste lid, van de wet][ref1] genoemde termijn in kennis van de bewaring dan wel het voortduren
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel94
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '94'
  - number: 5.7.1
    text: |-
      De aanwijzing bedoeld in de [artikelen 57, eerste lid][ref1], en [58, eerste lid, van de Wet][ref2] wordt zoveel
      mogelijk gegeven bij de beschikking waarbij de aanvraag tot het verlenen van de verblijfsvergunning asiel voor
      bepaalde tijd is afgewezen. De aanwijzing wordt met redenen omkleed.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel58
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '58'
  - number: 5.7.2
    text: |-
      [Artikel 5.3][ref1] is van overeenkomstige toepassing indien de aanwijzing, bedoeld in het eerste lid, gegeven
      wordt bij afzonderlijke beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.8.1
    text: |-
      Niet-begeleide minderjarigen als bedoeld in artikel 11, derde lid, van de Opvangrichtlijn worden alleen in
      uitzonderlijke omstandigheden in bewaring gehouden. Alles wordt in het werk gesteld om de bewaring zo spoedig
      mogelijk op te heffen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.8
  - number: 5.8.2
    text: |-
      Niet-begeleide minderjarigen als bedoeld in het eerste lid, worden niet ondergebracht in een inrichting als bedoeld
      in [artikel 1 van de Beginselenwet justitiële jeugdinrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: 5.8.3
    text: |-
      Niet-begeleide minderjarigen als bedoeld in artikel 17 van de Terugkeerrichtlijn worden slechts in laatste
      instantie en voor een zo kort mogelijke periode in bewaring gesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.8
  - number: 5.8.4
    text: |-
      Niet-begeleide minderjarigen verblijven in aan hen toegewezen ruimten waar zij afgescheiden gehuisvest zijn van
      volwassenen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.8
  - number: 5.8.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel5.8
  - number: '6.1'
    text: |-
      Een risico als bedoeld in [artikel 62, tweede lid, onder a, van de Wet][ref1] kan worden aangenomen indien
      tenminste twee van de gronden als bedoeld in [artikel 5.1b, derde en vierde lid][ref2], op de vreemdeling van
      toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 6.1a.1
    text: |-
      Onze Minister is bevoegd om, bij de uitoefening van zijn bevoegdheid tot uitzetting als bedoeld in
      [artikel 63, tweede lid, van de Wet][ref1] alle daartoe benodigde handelingen te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel63
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '63'
  - number: 6.1a.2
    text: |-
      Bij toepassing van het eerste lid worden de grondrechten, de waardigheid en fysieke integriteit van de vreemdeling
      geëerbiedigd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.1a
  - number: 6.1a.3
    text: |-
      In geval van uitzetting door de lucht houdt Onze Minister rekening met de gemeenschappelijke richtsnoeren voor
      veiligheidsvoorzieningen voor gezamenlijke verwijdering door de lucht, bedoeld in artikel 7 van de beschikking van
      de Raad van de Europese Unie van 29 april 2004, nr. 2004/573/EG.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.1a
  - number: 6.1b.1
    text: |-
      Ingeval de vreemdeling ingevolge [artikel 62, tweede lid, van de Wet][ref1] onmiddellijk moet vertrekken of niet is
      vertrokken binnen de voor hem geldende vertrektermijn, kan de uitzetting worden uitgesteld. Bij het uitstel wordt
      in ieder geval rekening gehouden met de fysieke of mentale gesteldheid van de vreemdeling en technische redenen,
      zoals het ontbreken van vervoermiddelen of het mislukken van de uitzetting wegens onvoldoende identificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.1b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
  - number: 6.1b.2
    text: |-
      Ingeval de uitzetting wordt uitgesteld op grond van het eerste lid, is [artikel 4.52a][ref1] van overeenkomstige
      toepassing, onverminderd het overigens krachtens de [artikelen 54][ref2] en [56 van de Wet][ref3] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel56
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.1b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '54'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '56'
  - number: 6.1c
    text: |-
      De vreemdeling legt bij een verzoek om toepassing van [artikel 64 van de Wet][ref1] ten minste de voor de
      beslissing van Onze Minister relevante medische gegevens en overige bescheiden over.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.1c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '64'
  - number: 6.1d.1
    text: |-
      Bij afwijzing van een aanvraag tot het verlenen van de verblijfsvergunning regulier voor bepaalde tijd wordt
      ambtshalve beoordeeld of er reden is voor toepassing van [artikel 64 van de Wet][ref1], tenzij op grond van
      [artikel 3.6, eerste lid][ref2], of [3.6ba, eerste lid][ref3], alsnog ambtshalve een verblijfsvergunning is
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.1d
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 6.1d.2
    text: |-
      Het eerste lid is uitsluitend van toepassing indien de aanvraag betrekking had op een verblijfsvergunning als
      bedoeld in [artikel 3.6, tweede lid][ref1], en het de eerste zodanige aanvraag betrof.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.1d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 6.1d.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien de verblijfsvergunning regulier voor bepaalde tijd wordt
      ingetrokken of de aanvraag tot het verlengen van de geldigheidsduur ervan wordt afgewezen, met dien verstande
      dat in dat geval de ambtshalve beoordeling uitsluitend plaatsvindt indien de vreemdeling de voor die beoordeling
      relevante medische gegevens en overige bescheiden heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.1d
  - number: 6.1e.1
    text: |-
      Bij afwijzing van de eerste aanvraag tot het verlenen van de verblijfsvergunning asiel voor bepaalde tijd wordt
      ambtshalve beoordeeld of er reden is voor toepassing van [artikel 64 van de Wet][ref1], tenzij op grond van
      [artikel 3.6a, eerste lid][ref2], of [3.6ba, eerste lid][ref3], alsnog ambtshalve een verblijfsvergunning is
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.1e
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 6.1e.2
    text: |-
      Het eerste lid is niet van toepassing, indien de aanvraag niet in behandeling is genomen op grond van
      [artikel 30 van de Wet][ref1], niet-ontvankelijk is verklaard op grond van [artikel 30a van de Wet][ref2] of
      op grond van het bepaalde in het Protocol (nr. 24) inzake asiel voor onderdanen van lidstaten van de Europese
      Unie, bij het Verdrag betreffende de Europese Unie, dan wel is afgewezen als kennelijk ongegrond op grond
      van [artikel 30b, eerste lid onder g, j of k van de Wet][ref3] of buiten behandeling is gesteld op grond van
      [artikel 30c van de Wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel30b
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel30c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.1e
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 30a
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 30b
      - id: ref4
        bwb_id: BWBR0011823
        artikel: 30c
  - number: 6.1e.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien de verblijfsvergunning asiel voor bepaalde tijd wordt
      ingetrokken of de aanvraag tot het verlengen van de geldigheidsduur ervan wordt afgewezen, met dien verstande
      dat in dat geval de ambtshalve beoordeling uitsluitend plaatsvindt indien de vreemdeling de voor die beoordeling
      relevante medische gegevens en overige bescheiden heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.1e
  - number: 6.1f
    text: |-
      [Artikel 6.1a][ref1] is van overeenkomstige toepassing op de overdracht, bedoeld in [artikel 63a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel63
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.1f
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '63'
  - number: '6.2'
    text: |-
      Onze Minister is bevoegd de kosten van uitzetting, bedoeld in de [artikelen 65, tweede lid][ref1], en
      [66 van de Wet][ref2] te verhalen op de referent of gewezen referent, de vreemdeling zelf en, indien
      hij minderjarig is, op degenen die het wettelijk gezag over hem uitoefenen of uitoefenden of op een
      vervoersonderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel66
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '66'
  - number: 6.3.1
    text: |-
      De kosten van uitzetting van een vreemdeling welke ingevolge [artikel 65, tweede lid, van de Wet][ref1] op een
      vervoersonderneming kunnen worden verhaald, zijn verschuldigd aan het openbaar lichaam te welks laste die kosten
      zijn gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel65
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '65'
  - number: 6.3.2
    text: 'De in het voorgaande lid bedoelde kosten van uitzetting omvatten in ieder geval de kosten verbonden aan:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.3
  - number: 6.3.2.a
    text: |-
      het vervoer van de uit te zetten vreemdeling per eerste gelegenheid, doch op de wijze die, gelet op de
      omstandigheden, de goedkoopste is, naar een plaats buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.3
  - number: 6.3.2.b
    text: |-
      de begeleiding van de vreemdeling naar een plaats van vertrek uit Nederland alsmede zijn begeleiding naar een
      plaats buiten Nederland, voorzover deze noodzakelijk is, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.3
  - number: 6.3.2.c
    text: |-
      het verblijf van de vreemdeling in Nederland in de periode nadat de vervoersonderneming van een ambtenaar belast
      met de grensbewaking de aanwijzing heeft gekregen de vreemdeling terug te vervoeren naar een plaats buiten
      Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.3
  - number: 6.4.1
    text: |-
      De noodzakelijke kosten van uitzetting die ten laste komen van de Staat of van andere openbare lichamen kunnen door
      de Staat, of door het andere openbare lichaam te welks laste zij zijn gekomen, worden verhaald op de referent of
      gewezen referent of vreemdeling en, indien hij minderjarig is, op degenen die het wettig gezag over hem uitoefenen
      of uitoefenden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.4
  - number: 6.4.2
    text: |-
      De in het eerste lid bedoelde kosten van uitzetting omvatten de kosten, genoemd in
      [artikel 6.3, tweede lid, onder a en b][ref1], met dien verstande dat de kosten, genoemd in artikel 6.3, tweede
      lid, onder b, niet worden verhaald op de referent of de gewezen referent. Bij ministeriële regeling worden regels
      gesteld omtrent de op de vreemdeling, diens wettelijk vertegenwoordiger en diens referent of diens gewezen referent
      te verhalen kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel6
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: 6.4.3
    text: |-
      In afwijking van het eerste lid, worden kosten van uitzetting niet verhaald op de referent of de gewezen referent,
      indien:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.4
  - number: 6.4.3.a
    text: |-
      die kosten ingevolge [artikel 65, tweede lid, van de Wet][ref1] op een vervoersonderneming kunnen worden verhaald;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel65
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '65'
  - number: 6.4.3.b
    text: die kosten zijn gemaakt een jaar of langer nadat het referentschap is geëindigd;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.4
  - number: 6.4.3.c
    text: ten behoeve van het verblijf van de vreemdeling in Nederland een ander als referent optreedt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.4
  - number: 6.4.3.d
    text: de verblijfsvergunning van de vreemdeling is gewijzigd;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.4
  - number: 6.4.3.e
    text: |-
      de vreemdeling in het bezit is gesteld van een verblijfsvergunning als bedoeld in [artikel 8, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6.4.3.f
    text: de vreemdeling Nederlander wordt of krachtens enige wet als Nederlander moet worden behandeld;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.4
  - number: 6.4.3.g
    text: de vreemdeling is overleden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.4
  - number: 6.4.4
    text: |-
      In afwijking van het derde lid, onder b, worden de kosten van uitzetting niet verhaald op de referent of
      de gewezen referent van een vreemdeling, met wie die referent of gewezen referent een gastovereenkomst als
      bedoeld in artikel 10 van richtlijn (EU) 2016/801 of een leer-werkovereenkomst of stageovereenkomst als bedoeld
      in [artikel 1.12][ref1] heeft gesloten, voor zover die kosten zijn gemaakt zes maanden of langer, nadat die
      overeenkomst is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel1
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 6.4.5
    text: |-
      De noodzakelijke kosten van uitzetting worden niet verhaald op de vreemdeling of, indien deze minderjarig is, op
      degenen die het wettig gezag over hem uitoefenen of uitoefenden, indien die kosten kunnen worden verhaald op diens
      referent of gewezen referent.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.4
  - number: 6.5.1
    text: |-
      Tegen een vreemdeling wordt geen inreisverbod uitgevaardigd, indien een redelijke termijn als bedoeld
      in [artikel 3.82][ref1] nog niet is verstreken na afloop van het rechtmatig verblijf, bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2], of als Nederlander.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6.5.2
    text: 'Tegen een vreemdeling wordt geen inreisverbod uitgevaardigd, indien deze:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5
  - number: 6.5.2.a
    text: als slachtoffer of getuige in aanmerking komt voor bedenktijd voor de aangifte van mensenhandel of mensensmokkel;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5
  - number: 6.5.2.b
    text: als slachtoffer- of getuige-aangever in aanmerking komt voor een verblijfsvergunning regulier voor bepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5
  - number: 6.5.2.c
    text: |-
      als slachtoffer van huiselijk geweld van de persoon bij wie eerder verblijf als bedoeld in
      [artikel 8, onder a, c dan wel e of l, van de Wet][ref1] was toegestaan of als slachtoffer van eergerelateerd
      geweld in aanmerking komt voor een verblijfsvergunning regulier voor bepaalde tijd;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6.5.2.d
    text: |-
      als echtgenoot, partner of minderjarig kind in het land van herkomst is achtergelaten door de persoon bij wie
      eerder rechtmatig verblijf als bedoeld in [artikel 8, onder a, c dan wel e, of l, van de Wet][ref1] was toegestaan,
      en op die grond in aanmerking komt voor de verlening van een verblijfsvergunning regulier voor bepaalde tijd;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6.5.2.e
    text: |-
      in aanmerking komt voor een verblijfsvergunning regulier voor bepaalde tijd op grond dat hij buiten zijn schuld
      niet uit Nederland kan vertrekken;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5
  - number: 6.5.2.f
    text: minderjarig is; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5
  - number: 6.5.2.g
    text: |-
      in aanmerking komt voor een verblijfsvergunning op grond van Besluit 1/80 van de Associatieraad EEG-Turkije
      betreffende de ontwikkeling van de Associatie, of niet wordt uitgezet om reden dat diens uitzetting in strijd zou
      zijn met de op 12 september 1963 te Ankara gesloten Overeenkomst waarbij een associatie tot stand wordt gebracht
      tussen de Europese Economische Gemeenschap en Turkije (Trb. 1964, 217), het op 23 november 1970 te Brussel tot
      stand gekomen Aanvullend Protocol bij die overeenkomst (Trb. 1971, 70) of genoemd Besluit nr. 1/80.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5
  - number: 6.5.3
    text: Het inreisverbod wordt opgeheven, indien zich een van de gevallen, bedoeld in het tweede lid, voordoet.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5
  - number: 6.5.4
    text: |-
      Van het eerste tot en met derde lid kan worden afgeweken ingeval de vreemdeling een gevaar vormt voor de openbare
      orde, de openbare veiligheid of de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5
  - number: 6.5.5
    text: |-
      Bij ministeriële regeling kunnen andere gevallen worden aangewezen waarin het inreisverbod om humanitaire of andere
      redenen achterwege wordt gelaten dan wel wordt opgeheven.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5
  - number: 6.5a.1
    text: De duur van het inreisverbod bedraagt ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5a
  - number: 6.5a.2
    text: |-
      In afwijking van het eerste lid, bedraagt de duur van het inreisverbod ten hoogste één jaar, indien het betreft de
      vreemdeling die de vrije termijn, bedoeld in [artikel 3.3][ref1], heeft overschreden met meer dan drie dagen maar
      niet meer dan 90 dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 6.5a.3
    text: |-
      In afwijking van het eerste en tweede lid, bedraagt de duur van het inreisverbod ten hoogste drie jaren, indien het
      betreft een vreemdeling die is veroordeeld tot een vrijheidsstraf van minder dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5a
  - number: 6.5a.4
    text: |-
      In afwijking van het eerste tot en met derde lid, bedraagt de duur van het inreisverbod ten hoogste vijf jaren,
      indien het betreft een vreemdeling die:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5a
  - number: 6.5a.4.a
    text: is veroordeeld tot een vrijheidsstraf van zes maanden of langer;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5a
  - number: 6.5a.4.b
    text: |-
      gebruik heeft gemaakt van valse of vervalste reis- of identiteitspapieren dan wel opzettelijk reis- of
      identiteitspapieren heeft overgelegd die niet op hem betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5a
  - number: 6.5a.4.c
    text: reeds het onderwerp is geweest van meer dan één terugkeerbesluit, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5a
  - number: 6.5a.4.d
    text: zich op het grondgebied van Nederland heeft begeven terwijl een inreisverbod van kracht was.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5a
  - number: 6.5a.5
    text: |-
      In afwijking van het eerste tot en met vierde lid, bedraagt de duur van het inreisverbod ten hoogste tien
      jaren, indien het betreft een vreemdeling die een ernstige bedreiging vormt voor de openbare orde of de openbare
      veiligheid. Deze ernstige bedreiging kan blijken uit onder meer:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5a
  - number: 6.5a.5.a
    text: een veroordeling naar aanleiding van een geweldsdelict of opiumdelict;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5a
  - number: 6.5a.5.b
    text: |-
      een veroordeling tot een vrijheidsstraf wegens een misdrijf waartegen een gevangenisstraf van meer dan zes jaren
      is bedreigd;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5a
  - number: 6.5a.5.c
    text: de omstandigheid dat hem artikel 1F van het Vluchtelingenverdrag wordt tegengeworpen, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5a
  - number: 6.5a.5.d
    text: |-
      de oplegging van een maatregel als bedoeld in [artikel 37a van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
  - number: 6.5a.6
    text: |-
      In afwijking van het eerste tot en met vijfde lid, bedraagt de duur van het inreisverbod ten hoogste twintig jaren,
      indien de vreemdeling naar het oordeel van Onze Minister een ernstige bedreiging vormt voor de nationale veiligheid
      of indien naar zijn oordeel zwaarwegende belangen nopen tot een duur van meer dan tien jaren.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5a
  - number: 6.5b.1
    text: |-
      Onze Minister kan op aanvraag het inreisverbod dat is uitgevaardigd met toepassing van
      [artikel 66a, tweede lid, van de Wet][ref1], opheffen indien de vreemdeling aantoont Nederland geheel in
      overeenstemming met de op hem rustende verplichting, bedoeld in [artikel 61, eerste lid, van de Wet][ref2], te
      hebben verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel66a
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel61
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 66a
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '61'
  - number: 6.5b.2
    text: |-
      In andere gevallen dan bedoeld in het eerste lid, kan Onze Minister op aanvraag het inreisverbod opheffen, indien
      de vreemdeling aantoont dat hij sinds zijn vertrek uit Nederland na het inreisverbod een ononderbroken periode van
      ten minste de helft van de duur van het inreisverbod buiten Nederland heeft verbleven en hij zich in die periode
      niet schuldig heeft gemaakt aan misdrijven en dat hij niet aan strafvervolging onderworpen is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5b
  - number: 6.5b.3
    text: |-
      De gegevens, bedoeld in [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref1], die de vreemdeling bij
      de aanvraag, bedoeld in het tweede lid, verstrekt, zijn in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 6.5b.3.a
    text: |-
      een schriftelijke verklaring dat hij voldoet aan de in het tweede lid bedoelde voorwaarden voor opheffing van het
      inreisverbod;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5b
  - number: 6.5b.3.b
    text: een kopie van de documenten voor grensoverschrijding die de vreemdeling sinds zijn inreisverbod heeft gehouden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5b
  - number: 6.5b.3.c
    text: |-
      een overzicht van de plaatsen waar de vreemdeling sinds zijn inreisverbod heeft verbleven, voorzien van
      bewijsstukken;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5b
  - number: 6.5b.3.d
    text: |-
      een schriftelijke verklaring, afgegeven door de daartoe bevoegde autoriteiten van de staat of staten waar de
      vreemdeling sinds zijn inreisverbod heeft verbleven, dat de vreemdeling zich tijdens dat verblijf niet schuldig
      heeft gemaakt aan misdrijven en niet aan strafvervolging onderworpen is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5b
  - number: 6.5b.4
    text: |-
      Het derde lid, onderdeel d, is niet van toepassing op de vreemdeling ten aanzien wie van de duur van het
      inreisverbod is bepaald met toepassing van [artikel 6.5a, eerste of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel6
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '3'
  - number: 6.5c
    text: |-
      In zeer uitzonderlijke en dringende gevallen kan Onze Minister het inreisverbod tijdelijk opheffen. Aan de
      tijdelijke opheffing worden voorwaarden gesteld omtrent de plaats van binnenkomst en de duur van het verblijf in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.5c
  - number: 6.6.1
    text: |-
      De aanvraag om opheffing van de ongewenstverklaring, bedoeld in [artikel 68, eerste lid, van de Wet][ref1], wordt
      ingewilligd, indien de vreemdeling niet aan strafvervolging terzake van enig misdrijf is onderworpen, en deze
      vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel68
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '68'
  - number: 6.6.1.a
    text: |-
      indien hij ongewenst is verklaard wegens een geweldsdelict, een opiumdelict of een misdrijf waartegen een
      gevangenisstraf van meer dan zes jaren is bedreigd, na de ongewenstverklaring ten minste tien achtereenvolgende
      jaren buiten Nederland heeft verbleven;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.6
  - number: 6.6.1.b
    text: |-
      indien hij ongewenst is verklaard wegens andere misdrijven dan bedoeld in onderdeel a, na de ongewenstverklaring
      tenminste vijf achtereenvolgende jaren buiten Nederland heeft verbleven;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.6
  - number: 6.6.1.c
    text: |-
      indien hij ongewenst is verklaard op grond van [artikel 67, eerste lid, onder a, van de Wet][ref1], na de
      ongewenstverklaring tenminste één jaar buiten Nederland heeft verbleven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel67
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '67'
  - number: 6.6.2
    text: |-
      In afwijking van het eerste lid, aanhef en onder b, wordt de aanvraag ingewilligd nadat de daar bedoelde
      vreemdeling tenminste tien achtereenvolgende jaren buiten Nederland heeft verbleven, indien zwaarwegende belangen
      zich naar het oordeel van Onze Minister verzetten tegen opheffing van de ongewenstverklaring na vijf jaren.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.6
  - number: 6.6.3
    text: 'De in het eerste lid genoemde termijnen vangen opnieuw aan, indien de vreemdeling tijdens de ongewenstverklaring:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.6
  - number: 6.6.3.a
    text: |-
      een als misdrijf strafbaar gestelde inbreuk op de openbare orde heeft gepleegd die tot ongewenstverklaring zou
      kunnen leiden, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.6
  - number: 6.6.3.b
    text: |-
      zonder voorafgaande tijdelijke opheffing of in strijd met de aan die tijdelijke opheffing verbonden voorwaarden in
      Nederland heeft verbleven.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.6
  - number: 6.6.4
    text: |-
      De gegevens, bedoeld in [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref1], die de vreemdeling
      verstrekt zijn in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 6.6.4.a
    text: |-
      een schriftelijke verklaring van de vreemdeling dat hij sinds zijn vertrek uit Nederland na de ongewenstverklaring
      tien, onderscheidenlijk vijf achtereenvolgende jaren of één jaar buiten Nederland heeft verbleven en dat hij zich
      in die periode niet schuldig heeft gemaakt aan misdrijven en dat hij niet aan strafvervolging onderworpen is;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.6
  - number: 6.6.4.b
    text: |-
      een kopie van de documenten voor grensoverschrijding die de vreemdeling sinds zijn ongewenstverklaring heeft
      gehouden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.6
  - number: 6.6.4.c
    text: |-
      een overzicht van de plaatsen waar de vreemdeling sinds zijn ongewenstverklaring heeft verbleven, voorzien van
      bewijsstukken, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.6
  - number: 6.6.4.d
    text: |-
      een schriftelijke verklaring, afgegeven door de terzake bevoegde autoriteiten van het land of de landen waar de
      vreemdeling sinds zijn ongewenstverklaring heeft verbleven, dat de vreemdeling zich tijdens dat verblijf niet
      schuldig heeft gemaakt aan misdrijven en niet aan strafvervolging onderworpen is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.6
  - number: '6.7'
    text: |-
      In zeer uitzonderlijke en dringende gevallen kan Onze Minister de ongewenstverklaring tijdelijk opheffen. Aan de
      tijdelijke opheffing worden voorwaarden gesteld omtrent de plaats van binnenkomst en de duur van het verblijf in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel6.7
  - number: 7.2.1
    text: |-
      De uitzetting van de vreemdeling blijft, in afwijking van [artikel 73, tweede lid, van de Wet][ref1] achterwege,
      indien het betreft een vreemdeling, die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel73
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '73'
  - number: 7.2.1.a
    text: onderdaan is van een land dat partij is bij het Europees Vestigingsverdrag;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel7.2
  - number: 7.2.1.b
    text: |-
      onmiddellijk voorafgaande aan het tijdstip waarop het rechtmatig verblijf, bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1] is geëindigd, gedurende twee aaneengesloten jaren
      dit rechtmatig verblijf heeft gehad;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 7.2.1.c
    text: zijn hoofdverblijf niet buiten Nederland heeft gevestigd, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel7.2
  - number: 7.2.1.d
    text: |-
      tijdig bezwaar heeft gemaakt dan wel administratief beroep heeft ingesteld tegen een beschikking waarbij het
      rechtmatig verblijf is beëindigd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel7.2
  - number: 7.2.2
    text: |-
      Het eerste lid blijft buiten toepassing, indien de uitzetting van de vreemdeling wegens dwingende redenen van
      nationale veiligheid gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel7.2
  - number: 7.3.1
    text: |-
      Indien een verzoek om een voorlopige voorziening is gedaan teneinde uitzetting of overdracht te voorkomen
      voordat is beslist op een beroep gericht tegen een besluit dat is genomen naar aanleiding van een aanvraag om een
      verblijfsvergunning asiel voor bepaalde tijd is het de vreemdeling toegestaan de uitspraak op dit verzoek hier te
      lande af te wachten.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel7.3
  - number: 7.3.2
    text: |-
      Van het eerste lid kan worden afgeweken indien uitzetting niet achterwege wordt gelaten op de in
      [artikel 3.1, tweede lid, onder a en e][ref1] bedoelde gronden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 7.4.1
    text: |-
      Aan een alleenstaande minderjarige vreemdeling wiens beroep geen reële kans van slagen heeft wordt alleen kosteloze
      rechtsbijstand onthouden, indien de vertegenwoordiger van de minderjarige overeenkomstig het nationale recht over
      juridische kwalificaties beschikt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel7.4
  - number: 7.4.2
    text: |-
      Indien een rechterlijke instantie oordeelt over het recht van een alleenstaande minderjarige vreemdeling om in
      afwachting van de beslissing op beroep in Nederland te blijven, dient de alleenstaande minderjarige vreemdeling
      tenminste over tolkdiensten en rechtsbijstand te beschikken en minstens een week de tijd te hebben om het daartoe
      strekkende verzoek op te stellen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel7.4
  - number: 8.1.1
    text: |-
      Onze Minister verstrekt op de wijze als beschreven in dit artikel de gegevens betreffende de
      verblijfsrechtelijke positie van een vreemdeling die een bestuursorgaan of een orgaan als bedoeld in
      [artikel 107, tiende lid, van de Wet][ref1] nodig hebben voor de toekenning van verstrekkingen, voorzieningen,
      uitkeringen, ontheffingen of vergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 8.1.2
    text: |-
      De algemene gegevens betreffende de verblijfsrechtelijke positie van vreemdelingen worden door Onze
      Minister verstrekt aan het college van burgemeester en wethouders, met het oog op de verstrekking daarvan
      ingevolge de [Wet basisregistratie personen][ref1] aan een orgaan als bedoeld in het eerste lid. De
      algemene gegevens zijn de gegevens in verband met het verblijfsrecht van de vreemdeling, bedoeld in
      [bijlage 1 bij het Besluit basisregistratie personen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715
      [ref2]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0033715
      - id: ref2
        bwb_id: BWBR0034306
  - number: 8.1.3
    text: |-
      Een bestuursorgaan of een orgaan als bedoeld in [artikel 107, tiende lid, van de Wet][ref1] vraagt Onze
      Minister onmiddellijk nadere gegevens over de verblijfsrechtelijke positie van een vreemdeling, indien bij het
      bestuursorgaan of een orgaan als bedoeld in [artikel 107, tiende lid, van de Wet][ref2], na raadpleging van
      de algemene gegevens in verband met het verblijfsrecht van een vreemdeling uit de basisregistratie personen
      onduidelijkheid bestaat omtrent de verblijfsrechtelijke positie van die vreemdeling, omdat:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 8.1.3.a
    text: |-
      de vreemdeling niet voorkomt in de basisregistratie personen, maar wel beschikt over het bescheid, bedoeld in
      [artikel 9, tweede lid, van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 8.1.3.b
    text: |-
      de verblijfsrechtelijke gegevens in de basisregistratie personen afwijken van de gegevens omtrent het verblijf van
      die vreemdeling op het bescheid, bedoeld in [artikel 9, tweede lid, van de Wet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 8.1.3.c
    text: |-
      de verblijfsrechtelijke gegevens in de basisregistratie personen en het bescheid, bedoeld in
      [artikel 9, tweede lid, van de Wet][ref1] afwijken van andere bescheiden, waarover het bestuursorgaan beschikt,
      waardoor gerede twijfel over de juistheid van de gegevens over de verblijfsrechtelijke positie van de vreemdeling
      is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
  - number: 8.1.4
    text: |-
      Onze Minister verstrekt het bestuursorgaan of een orgaan als bedoeld in
      [artikel 107, tiende lid, van de Wet][ref1], in de gevallen, bedoeld in het derde lid, desgevraagd onmiddellijk de
      nadere gegevens over de verblijfsrechtelijke positie van de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 8.1.5
    text: |-
      Indien een bestuursorgaan of een orgaan als bedoeld in [artikel 107, tiende lid, van de Wet][ref1], in een
      individueel geval aanwijzingen heeft dat op korte termijn een wijziging in de verblijfsrechtelijke positie van een
      vreemdeling optreedt of recent een wijziging in de verblijfsrechtelijke positie is opgetreden en het bestuursorgaan
      heeft met redenen omkleed aannemelijk gemaakt dat vanwege het spoedeisende karakter bij het toekennen van een
      verstrekking, voorziening, uitkering, ontheffing of vergunning niet gewacht kan worden op de aanpassing van
      de algemene gegevens in de basisregistratie personen, verstrekt Onze Minister desgevraagd onmiddellijk nadere
      gegevens over een desbetreffende wijziging in de verblijfsrechtelijke positie van de vreemdeling. Het verzoek wordt
      schriftelijk gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 8.2.1
    text: |-
      Een bestuursorgaan of een orgaan als bedoeld in [artikel 107, tiende lid, van de Wet][ref1] verstrekt Onze Minister
      desgevraagd de gegevens omtrent de toekenning of de beëindiging van verstrekkingen, voorzieningen, uitkeringen,
      ontheffingen of vergunningen aan een vreemdeling, die nodig zijn voor:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 8.2.1.a
    text: |-
      de verlening, de verlenging van de geldigheidsduur van, de wijziging van het verblijfsdoel van of intrekking van
      een verblijfsvergunning als bedoeld in de [artikel 8, onder a tot en met d, van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 8.2.1.b
    text: |-
      de beoordeling of aan de voorwaarden en beperkingen waaronder die verblijfsvergunning is verleend, wordt voldaan,
      of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2
  - number: 8.2.1.c
    text: |-
      de beoordeling of een vreemdeling als gemeenschapsonderdaan rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onder e, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 8.2.2
    text: |-
      Indien uit de verblijfsrechtelijke gegevens in de basisregistratie personen, dan wel uit een aantekening op het
      bescheid, bedoeld in [artikel 9, tweede lid, van de Wet][ref1] blijkt dat het verblijfsrecht is toegekend onder
      de beperking dat een beroep op de algemene middelen gevolgen kan hebben voor het verblijfsrecht, verstrekt een
      bestuursorgaan, niet zijnde een orgaan als bedoeld in [artikel 107, tiende lid, van de Wet][ref2], uit eigen
      beweging zo spoedig mogelijk de gegevens, bedoeld in het eerste lid, die nodig zijn voor de beoordeling of aan deze
      beperking wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 8.2.3
    text: |-
      Indien uit de verblijfsrechtelijke gegevens in de basisregistratie personen, dan wel uit een aantekening op het
      bescheid, bedoeld in [artikel 9, tweede lid, van de Wet][ref1] blijkt dat het verblijfsrecht is toegekend onder
      de beperking dat arbeid niet is toegestaan, dan wel arbeid uitsluitend is toegestaan bij een bepaalde werkgever,
      dan wel arbeid slechts is toegestaan met een gecombineerde vergunning of een tewerkstellingsvergunning, verstrekt
      een bestuursorgaan, niet zijnde een orgaan als bedoeld in [artikel 107, tiende lid, van de Wet][ref2], belast met
      de verstrekking van ontheffingen of vergunningen als bedoeld in de [artikelen 8.3][ref3] en [8.4][ref4], uit eigen
      beweging zo spoedig mogelijk de gegevens, bedoeld in het eerste lid die nodig zijn voor de beoordeling of aan deze
      beperking wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '1'
  - number: 8.2.4
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister die het aangaat, bepalen dat de gegevens, bedoeld in dit
      artikel, periodiek of in gestandaardiseerde vorm worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2
  - number: 8.2a.1
    text: 'Gegevens en inlichtingen ten behoeve van de vreemdelingenadministratie kunnen in ieder geval worden verstrekt door:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.1.a
    text: |-
      de colleges van burgemeester en wethouders, voor zover deze zijn belast met de uitvoering van de
      [Wet basisregistratie personen][ref1], de [Participatiewet][ref2] en aanverwante inkomensvoorzieningswetten, de
      [Wet inburgering][ref3] en de [Wet inburgering 2021][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0033715
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0020611
      [ref4]: https://wetten.overheid.nl/BWBR0044770
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
    references:
      - id: ref1
        bwb_id: BWBR0033715
      - id: ref2
        bwb_id: BWBR0015703
      - id: ref3
        bwb_id: BWBR0020611
      - id: ref4
        bwb_id: BWBR0044770
  - number: 8.2a.1.b
    text: de Sociale Verzekeringsbank;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.1.c
    text: het Uitvoeringsinstituut Werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.1.d
    text: de Rijksbelastingdienst;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.1.e
    text: |-
      de Minister van Binnenlandse Zaken en Koninkrijksrelaties, voor zover deze is belast met de uitvoering van de
      [Wet basisregistratie personen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033715
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
    references:
      - id: ref1
        bwb_id: BWBR0033715
  - number: 8.2a.1.f
    text: de Dienst Uitvoering Onderwijs van het Ministerie van Onderwijs, Cultuur en Wetenschap;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.1.g
    text: |-
      de Gemeentelijke gezondheidsdienst, bedoeld in [artikel 17 van de Wet publieke gezondheid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel17
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '17'
  - number: 8.2a.1.h
    text: de Nederlandse Arbeidsinspectie;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.1.i
    text: de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.1.j
    text: de FIOD-ECD.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.2
    text: |-
      Gegevens en inlichtingen worden in ieder geval verstrekt ten behoeve van de vreemdelingenadministratie, indien zij
      noodzakelijk zijn voor:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.2.a
    text: |-
      de voorbereiding van beschikkingen omtrent de machtiging tot voorlopig verblijf, de verblijfsvergunning en de
      ongewenstverklaring;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.2.b
    text: de erkenning als referent, en de schorsing en intrekking van die erkenning;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.2.c
    text: |-
      het toezicht op naleving van wettelijke voorschriften met betrekking tot de grensbewaking, het toezicht op
      vreemdelingen en het toezicht op referenten;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.3
    text: 'Bij ministeriële regeling worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.3.a
    text: de gevallen waarin en de wijze waarop in ieder geval gegevens en inlichtingen worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.3.b
    text: de doorlevering van gegevens en inlichtingen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.3.c
    text: de verwijdering en vernietiging van de in de vreemdelingenadministratie opgenomen gegevens;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.2a.3.d
    text: de gevallen waarin de verstrekking van gegevens en inlichtingen anders dan kosteloos geschiedt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.2a
  - number: 8.3.1
    text: |-
      De vreemdeling die geen rechtmatig verblijf heeft op grond van [artikel 8 van de Wet][ref1] kan geen aanspraak
      maken op een beschikking als bedoeld in:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 8.3.1.a
    text: |-
      de [artikelen 30b][ref1] en [30h van de Wet op de kansspelen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30h
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30b
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30h
  - number: 8.3.1.b
    text: |-
      [artikel 3 van de Alcoholwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
  - number: 8.3.1.c
    text: |-
      de [artikelen 2, eerste lid][ref1], en
      [7 van de Wet particuliere beveiligingsorganisaties en recherchebureaus][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008973#Artikel7
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008973
        artikel: '7'
  - number: 8.3.1.d
    text: |-
      [artikel 76 van de Wet personenvervoer 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel76
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '76'
  - number: 8.3.2
    text: |-
      De vreemdeling, bedoeld in het eerste lid, kan geen aanspraak maken op de toekenning van vergunningen
      en ontheffingen door bestuursorganen van gemeenten, provincies, waterschappen en met toepassing van de
      [Wet gemeenschappelijke regelingen][ref1] ingestelde openbare lichamen of gemeenschappelijke regelingen, voorzover
      die vergunningen of ontheffingen betrekking hebben op standplaatsen, markten, venten, collecteren, evenementen of
      beroepsmatige dan wel bedrijfsmatige activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '8.4'
    text: |-
      De vreemdeling die rechtmatig in Nederland verblijf heeft op de gronden, genoemd in
      [artikel 8, onder f tot en met j, van de Wet][ref1], kan geen aanspraak maken op een beschikking als bedoeld in
      [artikel 8.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '1'
  - number: 8.5.1
    text: |-
      Aan een vreemdeling die onderdaan is van België of Luxemburg en die het vereiste document voor grensoverschrijding
      bezit, kan, in afwijking van [hoofdstuk 2][ref1], de toegang tot Nederland slechts worden geweigerd, indien hij een
      actuele bedreiging voor de openbare orde of de nationale veiligheid vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0011825
        hoofdstuk: '1'
  - number: 8.5.2
    text: |-
      De ambtenaren belast met de grensbewaking of de ambtenaren belast met het toezicht op vreemdelingen, weigeren niet
      dan ingevolge een bijzondere aanwijzing van Onze Minister de toegang tot Nederland aan een vreemdeling als bedoeld
      in het eerste lid. De weigering geschiedt schriftelijk.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.5
  - number: 8.6.1
    text: |-
      De aanvraag tot het verlenen van de verblijfsvergunning regulier voor bepaalde tijd die is ingediend door een
      vreemdeling die onderdaan is van België of Luxemburg die geen gemeenschapsonderdaan is, kan slechts worden
      afgewezen, indien de vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.6
  - number: 8.6.1.a
    text: een actuele bedreiging voor de openbare orde of de nationale veiligheid vormt; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.6
  - number: 8.6.1.b
    text: niet over voldoende middelen van bestaan beschikt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.6
  - number: 8.6.2
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning regulier voor bepaalde tijd die
      is ingediend door de in het eerste lid bedoelde vreemdeling, wordt niet afgewezen, en de verblijfsvergunning wordt
      niet ingetrokken, op grond van de omstandigheid dat de vreemdeling niet meer over voldoende middelen van bestaan
      beschikt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.6
  - number: 8.6.3
    text: |-
      In afwijking van [artikel 21, eerste en zesde lid, van de Wet][ref1], wordt de aanvraag tot het verlenen van een
      verblijfsvergunning regulier voor onbepaalde tijd die is ingediend door een vreemdeling als bedoeld in het eerste
      lid die nog niet gedurende een tijdvak van vijf jaren rechtmatig verblijf heeft gehad, slechts afgewezen, indien
      hij:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
  - number: 8.6.3.a
    text: een actuele bedreiging voor de openbare orde of de nationale veiligheid vormt; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.6
  - number: 8.6.3.b
    text: niet zelfstandig en duurzaam beschikt over voldoende middelen van bestaan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.6
  - number: 8.6.4
    text: |-
      In afwijking van [artikel 21 van de Wet][ref1], kan de verblijfsvergunning regulier voor onbepaalde tijd die is
      verleend aan de vreemdeling, bedoeld in het eerste lid, slechts worden ingetrokken op de in het derde lid, onder a,
      bedoelde grond.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
  - number: 8.7.1
    text: |-
      Deze paragraaf is van toepassing op vreemdelingen die de nationaliteit bezitten van een staat die partij is bij
      het Verdrag betreffende de werking van de Europese Unie of bij de Overeenkomst betreffende de Europese Economische
      Ruimte, dan wel van Zwitserland, en die zich naar Nederland begeven of in Nederland verblijven.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.7
  - number: 8.7.2
    text: |-
      Deze paragraaf is eveneens van toepassing op de familieleden die een vreemdeling als bedoeld in het eerste lid naar
      Nederland begeleiden of zich bij hem in Nederland voegen, voor zover het betreft:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.7
  - number: 8.7.2.a
    text: de echtgenoot;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.7
  - number: 8.7.2.b
    text: |-
      de partner, waarmee de vreemdeling een naar Nederlands internationaal privaatrecht geldig geregistreerd
      partnerschap is aangegaan;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.7
  - number: 8.7.2.c
    text: |-
      de rechtstreekse bloedverwant in neergaande lijn, van een vreemdeling als bedoeld in het eerste lid, of van diens
      echtgenoot of geregistreerd partner, voor zover die bloedverwant jonger is dan 21 jaar of ten laste is van die
      echtgenoot of geregistreerd partner; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.7
  - number: 8.7.2.d
    text: |-
      de rechtstreekse bloedverwant in opgaande lijn die ten laste is van de vreemdeling of van het gezinslid, bedoeld
      onder a of b.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.7
  - number: 8.7.3
    text: |-
      Deze paragraaf is voorts van toepassing op andere familieleden dan bedoeld in het tweede lid, die een vreemdeling
      als bedoeld in het eerste lid naar Nederland begeleiden of zich bij hem in Nederland voegen, in geval zij:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.7
  - number: 8.7.3.a
    text: in het land van herkomst ten laste zijn van of inwonen bij die vreemdeling; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.7
  - number: 8.7.3.b
    text: vanwege ernstige gezondheidsredenen een persoonlijke verzorging door die vreemdeling strikt behoeven.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.7
  - number: 8.7.4
    text: |-
      Deze paragraaf is eveneens van toepassing op de ongehuwde partner die een vreemdeling als bedoeld in het eerste lid
      naar Nederland begeleidt of zich bij hem in Nederland voegt en die een deugdelijk bewezen duurzame relatie met die
      vreemdeling heeft, en op de rechtstreekse bloedverwant in de neergaande lijn van een zodanige partner, voor zover
      die bloedverwant jonger is dan 18 jaar en die partner vergezelt of zich bij die partner in Nederland voegt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.7
  - number: 8.8.1
    text: |-
      Aan een vreemdeling als bedoeld in [artikel 8.7][ref1], die in het bezit is van een geldig document voor
      grensoverschrijding, kan de toegang tot Nederland slechts worden geweigerd om redenen van openbare orde of openbare
      veiligheid, dan wel volksgezondheid:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.8.1.a
    text: |-
      indien de vreemdeling op grond van zijn persoonlijke gedrag een actuele, werkelijke en ernstige bedreiging voor een
      fundamenteel belang van de samenleving vormt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.8
  - number: 8.8.1.b
    text: |-
      in het geval van potentieel epidemische ziekten zoals gedefinieerd in de relevante instrumenten van de
      Wereldgezondheidsorganisatie dan wel andere infectieziekten of besmettelijke parasitaire ziekten, ten aanzien
      waarvan in Nederland beschermende regelingen ten aanzien van Nederlanders worden getroffen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.8
  - number: 8.8.1.c
    text: |-
      indien hij om redenen van de openbare orde of openbare veiligheid uit Nederland is verwijderd en sinds de
      verwijdering nog geen redelijke termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.8
  - number: 8.8.2
    text: |-
      De ambtenaren, belast met de grensbewaking of met het toezicht op vreemdelingen, weigeren niet dan ingevolge een
      bijzondere aanwijzing van Onze Minister de toegang tot Nederland aan een vreemdeling als bedoeld in het eerste lid.
      De weigering geschiedt schriftelijk.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.8
  - number: 8.8.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op de onderdaan van België of Luxemburg die geen
      gemeenschapsonderdaan is. Op deze vreemdeling is [artikel 8.5][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
        afdeling: '2'
  - number: 8.8.4
    text: |-
      Een vreemdeling die niet beschikt over het vereiste document voor grensoverschrijding, wordt niet uitgezet dan
      nadat hem gedurende een redelijke termijn de gelegenheid is gegeven dat document te verkrijgen of op andere wijze
      te laten vaststellen of bewijzen dat hij het recht op vrij verkeer en verblijf geniet.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.8
  - number: 8.9.1
    text: |-
      Aan een vreemdeling als bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die niet de nationaliteit
      bezit van een staat als bedoeld in het eerste lid van dat artikel, en die beschikt over een geldige verblijfskaart,
      afgegeven door de bevoegde autoriteiten van een staat als bedoeld in artikel 8.7, eerste lid, waaruit het
      verblijfsrecht als familielid blijkt, wordt de toegang niet geweigerd wegens het ontbreken van een geldig visum. In
      het paspoort wordt geen aantekening gesteld omtrent inreis in Nederland of uitreis uit Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.9.2
    text: |-
      Aan een vreemdeling als bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die niet de nationaliteit
      bezit van een staat als bedoeld in het eerste lid van dat artikel, en die evenmin beschikt over een geldige
      verblijfskaart, worden alle faciliteiten verleend om de nodige visa te verkrijgen. Deze visa worden kosteloos zo
      spoedig mogelijk afgegeven via een versnelde procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: '8.10'
    text: |-
      De toegang van een persoon die in het bezit is van een door de Nederlandse autoriteiten afgegeven Nederlands
      paspoort of Nederlandse identiteitskaart, en die om redenen van openbare orde, openbare veiligheid of
      volksgezondheid uit een andere lidstaat is verwijderd, wordt de toegang, ook indien het document is vervallen
      of de Nederlandse nationaliteit van de houder wordt betwist, niet geweigerd, indien deze persoon naar Nederland
      terugkeert uit een staat waar hem verblijf was toegestaan ingevolge het Verdrag betreffende de werking van de
      Europese Unie, bij de Overeenkomst betreffende de Europese Economische Ruimte of ingevolge de Overeenkomst van
      21 juni 1999 van de Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat, anderzijds, over
      het vrije verkeer van personen (Trb. 2000, 16 en 86).
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.10
  - number: 8.11.1
    text: |-
      De vreemdeling, bedoeld in [artikel 8.7, eerste lid][ref1], heeft rechtmatig verblijf gedurende een periode van
      drie maanden na inreis, indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.11
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.11.1.a
    text: beschikt over een geldige identiteitskaart of een geldig paspoort; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.11
  - number: 8.11.1.b
    text: het bewijs van zijn identiteit en nationaliteit ondubbelzinnig met andere middelen levert.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.11
  - number: 8.11.2
    text: |-
      De vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die niet de nationaliteit bezit
      van een staat als bedoeld in het [eerste lid van dat artikel][ref2] en beschikt over een geldig paspoort, heeft
      rechtmatig verblijf gedurende een periode van drie maanden na inreis.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.11
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.12.1
    text: |-
      De vreemdeling, bedoeld in [artikel 8.7, eerste lid][ref1], heeft langer dan drie maanden na inreis rechtmatig
      verblijf in Nederland, indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.12.1.a
    text: |-
      in Nederland werknemer of zelfstandige is dan wel Nederland is ingereisd om werk te zoeken en kan bewijzen dat hij
      werk zoekt en een reële kans op werk heeft;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
  - number: 8.12.1.b
    text: |-
      voor zichzelf en zijn familieleden beschikt over voldoende middelen van bestaan en over een verzekering die de
      ziektekosten in Nederland volledig dekt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
  - number: 8.12.1.c
    text: |-
      is ingeschreven voor een opleiding die is opgenomen in de Registratie instellingen en opleidingen,
      bedoeld in [artikel 6.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] en
      [artikel 6.4.1 van de Wet educatie en beroepsonderwijs][ref2], om als hoofdbezigheid een studie of beroepsopleiding
      te volgen, beschikt over een verzekering die de ziektekosten in Nederland volledig dekt, en hij met een verklaring
      of een gelijkwaardig middel naar zijn keuze de zekerheid verschaft dat hij beschikt over voldoende middelen van
      bestaan voor zichzelf en zijn familieleden;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
  - number: 8.12.1.d
    text: |-
      een familielid als bedoeld in [artikel 8.7, tweede lid][ref1], is van een vreemdeling als bedoeld onder a of b;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.12.1.e
    text: de echtgenoot, de geregistreerde partner of een kind is dat ten laste is van een vreemdeling als bedoeld onder c;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
  - number: 8.12.1.f
    text: |-
      familielid is als bedoeld in [artikel 8.7, derde lid][ref1], en hij in het land van herkomst ten laste is van of
      inwoont bij een vreemdeling als bedoeld in het eerste lid, onder a, b of c;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.12.1.g
    text: |-
      familielid is als bedoeld in [artikel 8.7, derde lid][ref1], en hij vanwege ernstige gezondheidsredenen een
      persoonlijke verzorging door een vreemdeling als bedoeld in het eerste lid, onder a, b of c, strikt behoeft; of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.12.1.h
    text: |-
      partner is als bedoeld in [artikel 8.7, vierde lid][ref1], en hij een deugdelijk bewezen duurzame relatie heeft met
      een vreemdeling als bedoeld in het eerste lid, onder a, b of c, dan wel rechtstreekse bloedverwant in de neergaande
      lijn, jonger dan 18 jaar, is van een zodanige partner.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.12.2
    text: |-
      Het rechtmatig verblijf van de vreemdeling, bedoeld in het eerste lid, onder a, eindigt niet om de enkele reden dat
      die vreemdeling niet langer werknemer of zelfstandige is:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
  - number: 8.12.2.a
    text: in geval van tijdelijke arbeidsongeschiktheid als gevolg van ziekte of ongeval;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
  - number: 8.12.2.b
    text: |-
      indien hij na werkzaamheden als werknemer of zelfstandige van ten minste een jaar onvrijwillig werkloos is en als
      werkzoekende bij het Uitvoeringsinstituut werknemersverzekeringen is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
  - number: 8.12.2.c
    text: |-
      gedurende een periode van ten minste zes maanden, nadat hij onvrijwillige werkloos is geworden door de afloop van
      een arbeidsovereenkomst korter dan een jaar, dan wel nadat hij gedurende de eerste twaalf maanden onvrijwillig
      werkloos geworden is, indien hij als werkzoekende bij het Uitvoeringsinstituut werknemersverzekeringen is
      ingeschreven;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
  - number: 8.12.2.d
    text: |-
      indien hij een beroepsopleiding gaat volgen, die, behoudens ingeval van onvrijwillige werkloosheid, verband houdt
      met de voorafgaande beroepsactiviteit.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
  - number: 8.12.3
    text: |-
      Voor de toepassing van het eerste lid, onder b, beschikt de vreemdeling met een inkomen ter hoogte van het
      normbedrag dat in [artikel 3.74][ref1] voor de desbetreffende categorie is vastgesteld, in ieder geval over
      voldoende middelen van bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 8.12.4
    text: |-
      De vreemdeling, bedoeld in het eerste lid, kan zich aanmelden bij Onze Minister ter inschrijving in de
      vreemdelingenadministratie, ingeval hij langer dan drie maanden in Nederland heeft verbleven dan wel beoogt langer
      dan drie maanden in Nederland te verblijven.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
  - number: 8.12.5
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de gegevens en bescheiden die de vreemdeling bij de
      in het vorige lid bedoelde melding moet verstrekken of overleggen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
  - number: 8.12.6
    text: |-
      Onze Minister verstrekt na de in het vierde lid bedoelde inschrijving onmiddellijk een verklaring van inschrijving,
      waarin naam en adres van de ingeschreven vreemdeling en de datum van inschrijving worden vermeld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
  - number: 8.12.7
    text: |-
      De in het vierde en vijfde lid omschreven verplichtingen rusten ten aanzien van kinderen beneden de leeftijd van
      twaalf jaar op de wettelijk vertegenwoordiger. Voor kinderen van twaalf jaar en ouder kan aan deze verplichtingen
      ook worden voldaan door de wettelijk vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.12
  - number: 8.13.1
    text: |-
      De vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die niet de nationaliteit bezit
      van een staat als bedoeld in het [eerste lid van dat artikel][ref2], heeft langer dan drie maanden na inreis
      rechtmatig verblijf in Nederland, voor zover hij in Nederland verblijft bij een vreemdeling als bedoeld in
      [artikel 8.12, eerste lid, onder a, b of c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.13.2
    text: |-
      De vreemdeling, bedoeld in het eerste lid, meldt zich uiterlijk binnen een maand na afloop van de in
      [artikel 8.11, tweede lid][ref1], bedoelde periode aan bij Onze Minister, in geval hij beoogt langer dan drie
      maanden in Nederland te verblijven, en dient daarbij een aanvraag in tot afgifte van een verblijfsdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.13.3
    text: 'Bij de indiening van de aanvraag legt de vreemdeling over:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
  - number: 8.13.3.a
    text: een geldig paspoort;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
  - number: 8.13.3.b
    text: |-
      de verklaring van inschrijving van de vreemdeling, bedoeld in [artikel 8.7, eerste lid][ref1], bij wie hij in
      Nederland verblijft;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.13.3.c
    text: |-
      een document waaruit de familierechtelijke relatie of duurzame relatie blijkt met de vreemdeling, bedoeld onder
      b; en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
  - number: 8.13.3.d
    text: |-
      voor zover hij in Nederland verblijft als familielid als bedoeld in [artikel 8.7, tweede lid, onder c of d][ref1]:
      bewijs dat hij een dergelijk familielid is;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.13.3.e
    text: |-
      voor zover hij in Nederland verblijft als familielid als bedoeld in [artikel 8.7, derde lid][ref1]: een door de
      bevoegde instantie van het land van herkomst afgegeven verklaring dat hij ten laste komt van of inwoont bij de
      vreemdeling, bedoeld onder b, onderscheidenlijk bewijs van ernstige gezondheidsredenen die de persoonlijke zorg
      door die vreemdeling noodzakelijk maken;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.13.3.f
    text: |-
      voor zover hij in Nederland verblijft als partner als bedoeld in [artikel 8.7, vierde lid][ref1]: een bij
      ministeriële regeling vast te stellen relatieverklaring;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.13.3.g
    text: |-
      voor zover hij in Nederland verblijft als rechtstreekse bloedverwant in de neergaande lijn, jonger dan 18 jaar, van
      een partner als bedoeld onder f: bewijs dat is voldaan aan de [artikelen 3.13 tot en met 3.22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 8.13.4
    text: Onze Minister verstrekt onmiddellijk na de ontvangst van de aanvraag een verklaring dat de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
  - number: 8.13.5
    text: |-
      Onze Minister verstrekt de verblijfsgerechtigde vreemdeling binnen zes maanden na de ontvangst van
      de aanvraag een verblijfsdocument waarvan het model wordt vastgesteld bij ministeriële regeling.
      [Artikel 25, tweede en derde lid, van de Wet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel25
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '25'
  - number: 8.13.6
    text: 'Het verblijfsdocument wordt afgegeven met een geldigheidsduur:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
  - number: 8.13.6.a
    text: |-
      die gelijk is aan de duur van het voorgenomen verblijf van de vreemdeling, bedoeld in
      [artikel 8.7, eerste lid][ref1], bij wie de vreemdeling in Nederland verblijft, indien die duur korter is dan vijf
      jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 8.13.6.b
    text: van vijf jaar in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
  - number: 8.13.7
    text: |-
      De in het tweede en derde lid omschreven verplichtingen rusten ten aanzien van kinderen beneden de leeftijd van
      twaalf jaar op de wettelijk vertegenwoordiger. Voor kinderen van twaalf jaar en ouder kan aan deze verplichtingen
      ook worden voldaan door de wettelijk vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.13
  - number: '8.14'
    text: |-
      Het rechtmatig verblijf van de vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid][ref1], die de
      nationaliteit bezit van een staat als bedoeld in het [eerste lid van dat artikel][ref2], eindigt niet door het
      overlijden of het vertrek van de vreemdeling, bedoeld in [artikel 8.7, eerste lid][ref3], bij wie hij in Nederland
      verbleef. Het eindigt evenmin door de ontbinding of nietigverklaring van het huwelijk of de beëindiging van het
      geregistreerde partnerschap.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel8.14
