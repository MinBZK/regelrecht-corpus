  - number: 3.115.2
    text: |-
      Onze Minister kan de in [artikel 3.110, eerste lid][ref1], genoemde termijn na de start van het onderzoek
      verlengen:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
    references:
