  - number: '1.3'
    text: |-
      Ter uitvoering van een verdrag of een EU-verordening, -richtlijn of -besluit, op grond waarvan de grenscontrole
      plaatsvindt aan de buitengrenzen van het Schengengebied, wordt in [hoofdstuk 4, afdeling 1][ref1], alsmede in
      de [artikelen 4.24][ref2] en [4.25][ref3], [artikel 4.29, eerste lid, onder g][ref4], [artikel 4.35a][ref5],
      [artikel 4.52a, eerste lid][ref6], [artikel 4.52b, eerste lid][ref7], [artikel 6.5a, vierde lid, onder d][ref8],
      en [artikel 6.5b, eerste en tweede lid][ref9], onder «Nederland» mede verstaan: de tot het Schengengebied behorende
      grondgebieden van andere staten.


