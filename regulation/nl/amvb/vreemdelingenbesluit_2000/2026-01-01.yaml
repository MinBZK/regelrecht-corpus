  - number: 1.19.1.c
    text: |-
      op grond van [artikel 28 van de Wet op de loonbelasting 1964][ref1] opgelegde verplichtingen tot het doen van een
      eerstedagsmelding.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
  - number: 1.19.2
    text: |-
      Bij de beoordeling van de betrouwbaarheid van de aanvrager wordt tevens betrokken dat hij onjuiste gegevens heeft
      verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot afwijzing van een eerdere aanvraag tot het
      verlenen, verlengen of wijzigen van een visum of een verblijfsvergunning hebben geleid of zouden hebben geleid van
      een vreemdeling voor wie als referent werd opgetreden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.19
  - number: '1.20'
    text: |-
      Als referent van een vreemdeling die in Nederland verblijft of wil verblijven voor studie aan het hoger onderwijs,
      kan slechts worden erkend de instelling voor hoger onderwijs, die aangesloten is bij de Gedragscode internationale
      student hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.20
  - number: '1.21'
    text: |-
      De referent van een vreemdeling die in Nederland verblijft of wil verblijven als familie- of gezinslid, wordt niet
      als zodanig erkend.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.21
  - number: '1.22'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de erkenning als referent, de schorsing en de
      intrekking van die erkenning en de indiening en behandeling van de aanvraag. Daarbij worden in ieder geval nadere
      regels gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.22
  - number: 1.22.a
    text: de continuïteit en solvabiliteit van de aanvrager, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.22
  - number: 1.22.b
    text: |-
      de strafrechtelijke en bestuursrechtelijke antecedenten, die bij de beoordeling van de betrouwbaarheid van de
      aanvrager worden betrokken.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.22
  - number: 1.23.1
    text: |-
      Bij een besluit betreffende de machtiging tot voorlopig verblijf is het belang van de internationale betrekkingen
      in ieder geval betrokken, indien de aanvraag tot het verlenen van de machtiging tot voorlopig verblijf is ingediend
      door of ten behoeve van een vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.23
  - number: 1.23.1.a
    text: |-
      op wie krachtens verdrag of bindend besluit van een volkenrechtelijke organisatie rechtstreeks of indirect sancties
      van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.23
  - number: 1.23.1.b
    text: |-
      die in het Schengen Informatiesysteem gesignaleerd staat ter fine van weigering van de toegang in geval met de
      signalerende lidstaat geen overeenstemming kon worden bereikt over de opheffing van de signalering;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.23
  - number: 1.23.1.c
    text: ter deelname aan in Nederland te voeren vredesbesprekingen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.23
  - number: 1.23.1.d
    text: die behoort tot de hoge bestuursfunctionarissen van een vreemde mogendheid;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.23
  - number: 1.23.1.e
    text: met het oog op het functioneren van een in Nederland zetelende internationale instantie.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.23
  - number: 1.23.2
    text: |-
      In het eerste lid, onder b, wordt verstaan onder lidstaat: staat waartoe de werkingssfeer van een door Onze
      Minister verleend visum zich krachtens een voor Nederland verbindend verdrag, EU-verordening, -richtlijn of
      -besluit uitstrekt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.23
  - number: 1.24.1
    text: |-
      De aanvraag tot het verlenen of wijzigen van een machtiging tot voorlopig verblijf of een terugkeervisum wordt
      gedaan door het indienen van een formulier, waarvan het model door Onze Minister wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.24
  - number: 1.24.2
    text: |-
      De aanvraag tot het verlenen of wijzigen van een terugkeervisum wordt ingediend op een door Onze Minister aan te
      wijzen plaats.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.24
  - number: '1.25'
    text: |-
      Indien de vreemdeling, hangende de besluitvorming op een eerdere aanvraag tot het verlenen van een machtiging tot
      voorlopig verblijf, wijziging van het gevraagde verblijfsdoel wenst, dient hij een nieuwe aanvraag in.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.25
  - number: 1.26.1
    text: |-
      De vreemdeling legt bij de in persoon ingediende aanvraag, bedoeld in [artikel 1.24, eerste lid][ref1], in ieder
      geval over een geldig document voor grensoverschrijding, alsmede, voor zover redelijkerwijs mogelijk, de gegevens
      en bescheiden op basis waarvan kan worden vastgesteld dat wordt voldaan aan de voorwaarden voor verlening of
      wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel1
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.26
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '2'
  - number: 1.26.2
    text: |-
      Bij de niet in persoon door de referent ingediende aanvraag legt hij afschriften over van de in het eerste lid
      bedoelde gegevens en bescheiden en legt hij, of in voorkomend geval de vreemdeling, op verzoek van Onze Minister de
      originelen over.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.26
  - number: 1.26.3
    text: |-
      In afwijking van het eerste lid legt de vreemdeling die niet beschikt over een geldig document voor
      grensoverschrijding, voor zover redelijkerwijs mogelijk, gegevens en bescheiden over waarmee wordt aangetoond
      dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van een geldig
      document voor grensoverschrijding kan worden gesteld. In dat geval legt hij tevens aanvullende gegevens of
      bescheiden over omtrent zijn identiteit en nationaliteit.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.26
  - number: '1.27'
    text: |-
      De aanvraag, bedoeld in [artikel 1.24, eerste lid][ref1], wordt getoetst aan het recht dat gold op het tijdstip
      waarop de aanvraag is ontvangen, tenzij uit de Wet anders voortvloeit of het recht dat geldt op het tijdstip waarop
      de beschikking wordt gegeven, voor de vreemdeling gunstiger is.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel1
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.27
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '2'
  - number: '1.28'
    text: |-
      Een terugkeervisum wordt niet geweigerd op de in [artikel 2x, eerste lid, onder a, van de Wet][ref1] bedoelde grond
      aan:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2x
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.28
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2x
  - number: 1.28.a
    text: |-
      de vreemdeling die naar het oordeel van Onze Minister heeft aangetoond dat hij voor zakelijke doeleinden moet
      reizen of wegens dwingende of dringende familieomstandigheden Nederland tijdelijk moet verlaten;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.28
  - number: 1.28.b
    text: |-
      de hier te lande geboren vreemdeling, bedoeld in [artikel 3.23, eerste lid][ref1], ten behoeve van wie een aanvraag
      is gedaan tot het verlenen van een verblijfsvergunning regulier voor bepaalde tijd ingeval beide ouders rechtmatig
      verblijf hebben als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2] of als Nederlander;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.28
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 1.28.c
    text: |-
      de vreemdeling die een positieve beslissing op zijn aanvraag tot het verlenen, het verlengen van de geldigheidsduur
      of het wijzigen van een verblijfsvergunning heeft ontvangen, maar nog in afwachting is van afgifte van het
      bijbehorende verblijfsdocument;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.28
  - number: 1.28.d
    text: |-
      de vreemdeling die in afwachting is van de beslissing op een aanvraag tot het wijzigen of het verlengen van
      de geldigheidsduur van de verblijfsvergunning regulier voor bepaalde tijd indien de aanvraag tijdig of naar
      het oordeel van Onze Minister binnen een redelijke termijn als bedoeld in [artikel 3.82, eerste lid][ref1], is
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.28
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 1.29.1
    text: |-
      De vreemdeling of referent die, hangende de besluitvorming op de aanvraag, bedoeld in
      [artikel 1.24, eerste lid][ref1], verandert van adres, woon- of verblijfplaats, meldt de verandering onmiddellijk
      bij de instantie waar de aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel1
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.29
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '2'
  - number: 1.29.2
    text: |-
      De in het eerste lid omschreven verplichting rust ten aanzien van kinderen beneden de leeftijd van twaalf jaren
      op de wettelijk vertegenwoordiger. Voor kinderen van twaalf jaren en ouder kan aan deze verplichtingen ook worden
      voldaan door de wettelijk vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.29
  - number: 1.30.1
    text: |-
      De vreemdeling die na binnenkomst in Nederland niet langer voldoet aan de beperking waaronder de machtiging tot
      voorlopig verblijf is verleend of een voorschrift dat aan de machtiging is verbonden, deelt dit binnen vier weken
      mee aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.30
  - number: 1.30.2
    text: |-
      De vreemdeling wiens geldig document voor grensoverschrijding of machtiging tot voorlopig verblijf na binnenkomst
      in Nederland vermist wordt, verloren is gegaan of ondeugdelijk is geworden voor identificatie, doet daarvan
      onmiddellijk in persoon aangifte bij de korpschef. De korpschef stelt Onze Minister hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.30
  - number: 1.30.3
    text: |-
      [Artikel 1.29, tweede lid][ref1], is van overeenkomstige toepassing op de in het eerste en tweede lid omschreven
      verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel1
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.30
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '3'
  - number: '1.31'
    text: |-
      De medewerking, bedoeld in [artikel 54, eerste lid, onder c, van de Wet][ref1] bestaat voor de toepassing van dit
      hoofdstuk uit:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
  - number: 1.31.a
    text: het op vordering van Onze Minister beschikbaar stellen van een goedgelijkende pasfoto;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.31
  - number: 1.31.b
    text: het zich laten fotograferen en het laten afnemen van vingerafdrukken.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.31
  - number: '1.32'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de wijze van indiening en de behandeling
      van een aanvraag tot verlening of wijziging van een machtiging tot voorlopig verblijf dan wel een terugkeervisum,
      daaronder begrepen de wijze waarop beschikkingen, kennisgevingen, mededelingen of berichten ingevolge dit hoofdstuk
      aan de vreemdeling of de referent bekend worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.32
  - number: '1.33'
    text: De nationale Etias-eenheid is ondergebracht bij de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel1.33
  - number: 2.1.1
    text: |-
      De toegang wordt geweigerd op grond van [artikel 3, eerste lid, van de Wet][ref1], indien de vreemdeling het doel
      van het voorgenomen verblijf of de verblijfsomstandigheden onvoldoende aannemelijk heeft gemaakt, dan wel ter
      staving daarvan onvoldoende documenten heeft overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
  - number: 2.1.2
    text: |-
      Het eerste lid is niet van toepassing op de vreemdeling die rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onder e, dan wel l, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2.1a.1
    text: |-
      De toegang wordt niet geweigerd, indien de vreemdeling naar Nederland terugkeert als gezinslid van een
      langdurig ingezetene, aan wie een EU-verblijfsvergunning voor langdurig ingezetenen is verleend en die na
      verblijfsbeëindiging door een andere staat die partij is bij het Verdrag betreffende de werking van de Europese
      Unie uit die staat naar Nederland terugkeert.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.1a
  - number: 2.1a.2
    text: |-
      De toegang wordt evenmin geweigerd, indien de vreemdeling uit een andere staat die partij is bij het Verdrag
      betreffende de werking van de Europese Unie naar Nederland terugkeert als:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.1a
  - number: 2.1a.2.a
    text: |-
      houder of voormalig houder van een door Onze Minister afgegeven Europese blauwe kaart of verblijfsvergunning
      regulier voor bepaalde tijd onder de beperking «overplaatsing binnen een onderneming», of onder de beperking
      «onderzoek in de zin van richtlijn (EU) 2016/801;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.1a
  - number: 2.1a.2.b
    text: |-
      gezinslid van een vreemdeling als bedoeld in onderdeel a, voor zover dat gezinslid houder is of is geweest van een
      door Onze Minister afgegeven verblijfsvergunning regulier voor bepaalde tijd onder een beperking verband houdend
      met verblijf als familie- of gezinslid van die vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.1a
  - number: 2.1a.2.c
    text: houder of voormalig houder van de verblijfsvergunning regulier voor bepaalde tijd onder de beperking «studie».
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.1a
  - number: 2.1b.1
    text: |-
      De toegang wordt niet geweigerd indien de vreemdeling van een andere staat als bedoeld in [artikel 1.3][ref1]
      het bevel heeft gekregen onmiddellijk naar Nederland terug te keren, en hij op dat moment rechtmatig verblijf als
      bedoeld in [artikel 8 van de Wet][ref2] had.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.1b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2.1b.2
    text: |-
      De toegang wordt evenmin geweigerd indien Nederland op grond van een op 13 januari 2009 geldende bilaterale of
      multilaterale overeenkomst of regeling een vreemdeling van een andere staat als bedoeld in [artikel 1.3][ref1]
      moet terugnemen en die vreemdeling in die andere staat verblijft zonder verblijfstitel of andere
      toestemming tot verblijf. In dat geval geeft Onze Minister aan die vreemdeling de kennisgeving, bedoeld in
      [artikel 62a, eerste lid, van de Wet][ref2], tenzij de vreemdeling rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onder a tot en met e, of l, van de Wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel62a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.1b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 62a
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2.2.1
    text: |-
      De vervoerder, bedoeld in [artikel 4, eerste lid, van de Wet][ref1] neemt afschrift van het op de vreemdeling
      betrekking hebbende document voor grensoverschrijding, indien hij de vreemdeling rechtstreeks dan wel na transfer
      of transit naar Nederland vervoert vanaf een luchthaven die is aangewezen bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '4'
  - number: 2.2.2
    text: |-
      De vervoerder neemt afschrift door het maken van een duidelijke en goed leesbare afbeelding van de pagina's met
      de relevante gegevens van het document voor grensoverschrijding van de vreemdeling die hij vervoert. De vervoerder
      overhandigt het afschrift desgevraagd aan een ambtenaar belast met de grensbewaking, indien bij inreis in Nederland
      geen geldig document voor grensoverschrijding door de vreemdeling kan worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2.3
    text: 'Onder de relevante gegevens wordt in ieder geval verstaan:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2.3.a
    text: naam en voornaam of voornamen van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2.3.b
    text: geboortedatum van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2.3.c
    text: geboorteplaats van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2.3.d
    text: nationaliteit van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2.3.e
    text: |-
      plaats en datum van afgifte van het document voor grensoverschrijding van de vreemdeling, alsmede het nummer
      daarvan;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2.3.f
    text: geldigheidsduur van het document voor grensoverschrijding van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2.3.g
    text: |-
      plaats en datum van afgifte van het in het document voor grensoverschrijding van de vreemdeling aangebrachte visum
      voor Nederland of het Schengengebied dan wel het verblijfsdocument, alsmede de nummers daarvan;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2.3.h
    text: |-
      geldigheidsduur van de in het document voor grensoverschrijding aangebrachte visa of verblijfsdocumenten,
      ook indien een visumverklaring is afgegeven, dan wel gebruik wordt gemaakt van niet in het document voor
      grensoverschrijding aangebrachte verblijfsdocumenten;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2.3.i
    text: |-
      plaats en datum van afgifte van de in het document voor grensoverschrijding aangebrachte visa of
      verblijfsdocumenten voor derde landen, welke noodzakelijk zijn voor de reis naar Nederland, dan wel voor het
      uiteindelijke land van bestemming, ook indien die visa dan wel verblijfsdocumenten niet in het document voor
      grensoverschrijding zijn aangebracht, maar afzonderlijk aan de vreemdeling zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2.3.j
    text: |-
      het meest recente uitreisstempel voorzover dit is aangebracht door de grensbewakingautoriteiten van het land waarin
      de luchthaven van vertrek gelegen is, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2.3.k
    text: de in het document voor grensoverschrijding aangebrachte foto.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2.4
    text: |-
      De afbeelding van de in het document voor grensoverschrijding aangebrachte foto, bedoeld in het derde lid, onder k,
      dient van zodanige kwaliteit te zijn, dat deze goed tot de houder van het geldige document voor grensoverschrijding
      herleidbaar is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2.5
    text: |-
      De ambtenaar belast met de grensbewaking maakt de afbeelding definitief onbruikbaar, zodra de
      grensbewakingsbelangen dit toestaan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2
  - number: 2.2a.1
    text: |-
      De vervoerder, bedoeld in [artikel 4, eerste lid, van de Wet][ref1], die passagiers vervoert door de lucht,
      verzamelt op vordering van een ambtenaar belast met de grensbewaking de in het derde lid, onderdelen a en b, en
      onderdeel c, onder 1° en 2°, bedoelde passagiersgegevens, en verstrekt deze aan het eind van de instapcontroles aan
      een ambtenaar belast met de grensbewaking, tezamen met de in het derde lid, onderdeel c, onder 3° en 4°, bedoelde
      passagiersgegevens, voor zover die gegevens aanwezig zijn in het vertrekcontrolesysteem van de vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '4'
  - number: 2.2a.2
    text: |-
      Het eerste lid is niet van toepassing op de vervoerder door wiens tussenkomst de vreemdeling vanuit een lidstaat
      van de Europese Unie of een land dat betrokken is bij de uitvoering, de toepassing en de ontwikkeling van het
      Schengenacquis, aan een buitengrens of binnen het grondgebied van Nederland wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3
    text: |-
      De in [artikel 4, derde lid, van de Wet][ref1], bedoelde passagiersgegevens omvatten:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '4'
  - number: 2.2a.3.a
    text: 'de volgende gegevens uit het document voor grensoverschrijding van de passagiers:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.a.1°
    text: het nummer en de aard van het reisdocument;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.a.2°
    text: de nationaliteit;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.a.3°
    text: de volledige naam;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.a.4°
    text: de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.a.5°
    text: het geslacht;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.a.6°
    text: de staat van afgifte van het reisdocument;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.a.7°
    text: de vervaldatum van het reisdocument;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.b
    text: 'de volgende gegevens over het desbetreffende vervoermiddel:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.b.1°
    text: het vluchtnummer;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.b.2°
    text: het tijdstip van vertrek en van aankomst van het vervoermiddel;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.b.3°
    text: het totale aantal met dat vervoermiddel vervoerde passagiers.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.c
    text: 'de volgende gegevens over het desbetreffende vervoer van de passagier:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.c.1°
    text: de grensdoorlaatpost van binnenkomst;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.c.2°
    text: het eerste instappunt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.c.3°
    text: de overige reisroutegegevens;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.3.c.4°
    text: de Passenger Name Record-bestandslocatie.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.4
    text: |-
      Bij ministeriële regeling kunnen gevallen worden aangewezen waarin vervoerders verplicht zijn de in het derde lid
      bedoelde passagiersgegevens te verzamelen en te verstrekken zonder vordering daartoe. Daarbij kunnen nadere regels
      worden gesteld met betrekking tot de vorm waarin de in het derde lid genoemde gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.5
    text: De vervoerder vernietigt de krachtens het eerste lid verzamelde gegevens binnen 24 uur na aankomst in Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.6
    text: 'De vervoerder verstrekt de passagier informatie betreffende:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.6.a
    text: zijn identiteit;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.6.b
    text: de doeleinden waarvoor de gegevens worden verzameld;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.6.c
    text: de gegevens die worden verzameld;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.6.d
    text: de ontvangers van de gegevens, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.6.e
    text: |-
      het bestaan van het recht om kennis te nemen van zijn gegevens en het recht om om correctie van onjuiste gegevens
      te verzoeken.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2a.7
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze waarop de gegevens door de vervoerder worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2a
  - number: 2.2b
    text: |-
      De ambtenaar belast met de grensbewaking vernietigt de op grond van [artikel 2.2a][ref1] verkregen
      passagiersgegevens binnen 24 uur na binnenkomst van de passagiers in Nederland, tenzij deze later nodig zijn voor
      de uitoefening van diens taken.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.2b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 2.3.1
    text: |-
      Onverminderd de overige terzake bij de [Wet][ref1] gestelde vereisten, wordt toegang tot Nederland niet geweigerd
      op grond van [artikel 3, eerste lid, onder a, van de Wet][ref2], indien de vreemdeling in het bezit is van:


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '3'
  - number: 2.3.1.a
    text: |-
      een geldig document voor grensoverschrijding dat is voorzien van een geldige machtiging tot voorlopig verblijf,
      indien hij zich naar Nederland begeeft voor een verblijf aldaar van langer dan 90 dagen, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.3
  - number: 2.3.1.b
    text: een door Onze Minister afgegeven verklaring die aan hem recht geeft op terugkeer naar Nederland.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Een afzonderlijke geldige machtiging tot voorlopig verblijf wordt gelijkgesteld met een geldig document voor
      grensoverschrijding, indien de vreemdeling tevens in het bezit is van het in deze machtiging vermelde document.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.3
  - number: 2.3.3
    text: |-
      In afwijking van het eerste lid wordt toegang niet geweigerd indien de vreemdeling zich naar Nederland begeeft voor
      een verblijf van langer dan 90 dagen en hij in het bezit is van een geldig document voor grensoverschrijding waarin
      de benodigde machtiging tot voorlopig verblijf ontbreekt, mits de vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.3
  - number: 2.3.3.a
    text: de nationaliteit bezit van één van bij ministeriële regeling aan te wijzen staten, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.3
  - number: 2.3.3.b
    text: behoort tot een bij ministeriële regeling aan te wijzen categorie.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Bij ministeriële regeling kan, ter uitvoering van een verdrag, dan wel een besluit van een volkenrechtelijke
      organisatie, van het eerste lid worden afgeweken ten gunste van vreemdelingen ten aanzien van het bezit van een
      document voor grensoverschrijding.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Aan de vreemdeling, die als passagier van een vliegtuig een vliegveld aandoet en in wiens geldig document voor
      grensoverschrijding het voor binnenkomst in het Beneluxgebied vereiste reisvisum of doorreisvisum met oponthoud
      ontbreekt, kan toegang tot het Beneluxgebied worden verleend.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.4
  - number: 2.4.2
    text: 'Toegang wordt slechts verleend, indien:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.4
  - number: 2.4.2.a
    text: de onderbreking plaats vindt wegens van de wil van de vreemdeling onafhankelijke omstandigheden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.4
  - number: 2.4.2.b
    text: hij van één van de in het derde lid van dit artikel bedoelde vliegvelden zal vertrekken;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.4
  - number: 2.4.2.c
    text: |-
      hij in het bezit is van een geldig document voor grensoverschrijding en reisbiljetten op grond waarvan zijn
      doorreis naar en zijn toegang tot het land van bestemming vaststaat, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.4
  - number: 2.4.2.d
    text: |-
      hij voldoet aan [artikel 12, eerste lid, onder b en d, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel12
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '12'
  - number: 2.4.3
    text: |-
      De toegang wordt slechts verleend, indien de vreemdeling een bij ministeriële regeling aangewezen vliegveld in
      Nederland aandoet, dan wel een daartoe aangewezen vliegveld in België of Luxemburg.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.4
  - number: 2.4.4
    text: De toegang wordt verleend voor de duur waarop de doorreis per eerstvolgende gelegenheid kan worden voortgezet.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.4
  - number: 2.4.5
    text: |-
      Indien toegang wordt verleend, stelt de ambtenaar belast met de grensbewaking ter plaatse in het geldig document
      voor grensoverschrijding van de vreemdeling een aantekening, dan wel verstrekt hij aan de vreemdeling een
      afzonderlijke verklaring, waaruit het verlenen van toegang blijkt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.4
  - number: 2.4.6
    text: Het model van de aantekening en verklaring, bedoeld in het vijfde lid, wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.4
  - number: 2.9.1
    text: |-
      Toegang tot Nederland wordt in ieder geval geweigerd op grond van het feit dat de vreemdeling een gevaar oplevert
      voor de openbare orde of de nationale veiligheid, bedoeld in [artikel 3, eerste lid, onder b, van de Wet][ref1],
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
  - number: 2.9.1.a
    text: |-
      er ten aanzien van de vreemdeling concrete aanwijzingen zijn dat deze een inbreuk op de openbare orde of nationale
      veiligheid heeft gepleegd of zal plegen, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.9
  - number: 2.9.1.b
    text: |-
      de vreemdeling in het opsporingsregister of het Schengen Informatiesysteem ter fine van weigering staat
      gesignaleerd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.9
  - number: 2.9.2
    text: |-
      Het eerste lid blijft buiten toepassing, indien Onze Minister op grond van humanitaire overwegingen, om redenen van
      nationaal belang of wegens internationale verplichtingen een afwijking noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.9
  - number: 2.9.3
    text: |-
      Het eerste lid is niet van toepassing op de vreemdeling die rechtmatig verblijf heeft als
      bedoeld in [artikel 8, onder e, dan wel l, van de Wet][ref1], en het familielid, bedoeld in
      [artikel 8.7, tweede en derde lid][ref2], en de vreemdeling, bedoeld in [artikel 8.7, vierde lid][ref3]. Op deze
      vreemdelingen is [artikel 8.8][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.10.1
    text: |-
      Bij de vaststelling of de vreemdeling beschikt over de in [artikel 3, eerste lid, onderdeel c, van de Wet][ref1]
      bedoelde middelen om te voorzien zowel in de kosten van verblijf in Nederland als in die van zijn reis naar een
      plaats buiten Nederland waar zijn toegang is gewaarborgd, kunnen middelen waarover de vreemdeling reeds beschikt en
      middelen waarover de vreemdeling kan beschikken uit wettelijk toegestane arbeid worden betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
  - number: 2.10.2
    text: Onder middelen worden in ieder geval verstaan geldelijke middelen alsmede vervoersbewijzen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.10
  - number: 2.10.3
    text: |-
      Het eerste lid is niet van toepassing op de vreemdeling die rechtmatig verblijf heeft als
      bedoeld in [artikel 8, onder e, dan wel l, van de Wet][ref1], het familielid, bedoeld in
      [artikel 8.7, tweede en derde lid][ref2], en de vreemdeling, bedoeld in [artikel 8.7, vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.11.1
    text: |-
      De toegang wordt geweigerd op grond van [artikel 3, eerste lid, onder c en d, van de Wet][ref1], indien de
      vreemdeling niet voldoet aan de door de ambtenaar belast met grensbewaking gestelde voorwaarde om zekerheid te
      stellen voor de kosten van verblijf in Nederland en voor de kosten van zijn reis naar een plaats buiten Nederland
      waar zijn toegang gewaarborgd is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
  - number: 2.11.2
    text: 'De zekerheid, bedoeld in het eerste lid, kan bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.11
  - number: 2.11.2.a
    text: het deponeren van een retour-passagebiljet;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.11
  - number: 2.11.2.b
    text: het deponeren van een garantiesom,
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.11
  - number: 2.11.2.c
    text: het stellen van een bankgarantie, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.11
  - number: 2.11.2.d
    text: een garantstelling door een derde die daartoe solvabel is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.11
  - number: 2.11.3
    text: |-
      Het eerste lid is niet van toepassing op de vreemdeling die rechtmatig verblijf heeft als
      bedoeld in [artikel 8, onder e, dan wel l, van de Wet][ref1], het familielid, bedoeld in
      [artikel 8.7, tweede en derde lid][ref2], en de vreemdeling, bedoeld in [artikel 8.7, vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.11.4
    text: |-
      De in het eerste lid bedoeld voorwaarde om zekerheid te stellen voor de kosten van verblijf in Nederland en voor de
      kosten van zijn reis naar een plaats buiten Nederland waar zijn toegang is gewaarborgd, kan, op grond van artikel
      6, vierde lid, van de Schengengrenscode, ook worden gesteld ten aanzien van een onderdaan van een derde land die
      toegang vraagt voor een verblijf voor ten hoogste 90 dagen binnen een periode van 180 dagen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.11
  - number: 2.11.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de zekerheidstelling.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel2.11
  - number: 3.1.1
    text: |-
      Het indienen van een aanvraag tot het verlenen van een verblijfsvergunning anders dan bedoeld in het tweede lid
      alsmede het indienen van een aanvraag tot het wijzigen of verlengen van een verblijfsvergunning regulier voor
      bepaalde tijd of een verblijfsvergunning asiel voor bepaalde tijd heeft tot gevolg dat de uitzetting achterwege
      blijft, tenzij:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
  - number: 3.1.1.a
    text: de aanvraag naar het voorlopig oordeel van Onze Minister een herhaalde aanvraag betreft; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
  - number: 3.1.1.b
    text: |-
      de aanvraag naar het voorlopig oordeel van Onze Minister kan worden afgewezen op de grond dat de vreemdeling een
      gevaar vormt voor de openbare orde of nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Het indienen van een aanvraag tot het verlenen van een verblijfsvergunning asiel voor bepaalde tijd heeft tot
      gevolg dat de uitzetting achterwege blijft, tenzij:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
  - number: 3.1.2.a
    text: |-
      de vreemdeling een opvolgende aanvraag heeft ingediend nadat een eerdere opvolgende aanvraag definitief is
      afgewezen met toepassing van [artikel 4:6 van de Algemene wet bestuursrecht][ref1], definitief niet-ontvankelijk is
      verklaard met toepassing van [artikel 30a, eerste lid, onderdeel d, van de Wet][ref2] of definitief als kennelijk
      ongegrond of als ongegrond is afgewezen met toepassing van [artikel 30b][ref3] of [31 van de Wet][ref4], en geen
      nieuwe elementen of bevindingen aan de orde zijn gekomen die relevant kunnen zijn voor de beoordeling van de
      aanvraag;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel30b
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel31
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 30a
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 30b
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '31'
  - number: 3.1.2.b
    text: |-
      een eerdere aanvraag niet in behandeling is genomen op grond van [artikel 30 van de Wet][ref1] en geen nieuwe
      elementen of bevindingen aan de orde zijn gekomen die relevant kunnen zijn voor de beoordeling van de aanvraag;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
  - number: 3.1.2.c
    text: |-
      de vreemdeling die de aanvraag heeft ingediend, wordt overgeleverd of uitgeleverd hetzij aan een andere lidstaat
      uit hoofde van verplichtingen overeenkomstig een Europees aanhoudingsbevel of anderszins, hetzij aan internationale
      strafhoven of tribunalen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
  - number: 3.1.2.d
    text: de vreemdeling die de aanvraag heeft ingediend, wordt overgeleverd of uitgeleverd aan een derde land; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
  - number: 3.1.2.e
    text: |-
      de vreemdeling een eerste opvolgende aanvraag heeft ingediend louter teneinde de uitvoering van het
      terugkeerbesluit te vertragen of te verhinderen en de aanvraag niet-ontvankelijk kan worden verklaard op grond van
      [artikel 30a, eerste lid, onderdeel d, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30a
  - number: 3.1.3
    text: |-
      De uitzonderingen, bedoeld in het tweede lid zijn niet van toepassing, indien uitzetting zou leiden tot een
      schending van het Vluchtelingenverdrag, Unierechtelijke verplichtingen, het Verdrag tot bescherming van de rechten
      van de mens en de fundamentele vrijheden of het Verdrag tegen foltering en andere wrede onmenselijke of onterende
      behandeling of bestraffing.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
  - number: 3.1.4
    text: |-
      Bij de beoordeling of sprake is van een aanvraag die louter is ingediend teneinde de uitvoering van het
      terugkeerbesluit te vertragen of te verhinderen als bedoeld in het tweede lid, onderdeel e, worden alle
      omstandigheden van het geval betrokken, waaronder met name:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
  - number: 3.1.4.a
    text: |-
      de termijn waarbinnen de vreemdeling zijn aanvraag om een verblijfsvergunning asiel voor bepaalde tijd kenbaar
      heeft gemaakt in het licht van zijn verklaringen hieromtrent;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
  - number: 3.1.4.b
    text: de omstandigheden waaronder de vreemdeling is aangetroffen dan wel zijn aanvraag kenbaar heeft gemaakt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
  - number: 3.1.4.c
    text: of de vreemdeling in het Schengeninformatiesysteem ter zake van een inreisverbod gesignaleerd staat;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
  - number: 3.1.4.d
    text: |-
      de gestelde nationaliteit in het licht van de toepassing van [artikel 30b, eerste lid, onder b van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30b
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30b
  - number: 3.1.4.e
    text: de onderbouwing van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
  - number: 3.1.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de wijze waarop wordt beoordeeld of sprake is
      van een situatie als bedoeld in het tweede lid en de wijze waarop een beslissing hieromtrent bekend wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1
  - number: 3.1a.1
    text: |-
      Het indienen van een aanvraag tot het verlenen van een verblijfsvergunning asiel voor bepaalde tijd heeft tot
      gevolg dat de uitzetting achterwege blijft zo lang een besluit als bedoeld in artikel 5, derde lid, van de
      richtlijn tijdelijke bescherming van kracht is, indien de vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.1.a
    text: |-
      behoort tot de specifieke groep vreemdelingen zoals omschreven in een besluit van de Raad van de Europese Unie als
      bedoeld in artikel 5, derde lid, van de richtlijn tijdelijke bescherming;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.1.b
    text: |-
      de echtgenoot is van de vreemdeling, bedoeld onder a, of de ongehuwde partner met wie die vreemdeling een duurzame
      relatie onderhoudt, en ten tijde van de gebeurtenissen die hebben geleid tot het in de aanhef bedoelde besluit met
      die vreemdeling samenwoonde;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.1.c
    text: het minderjarige, ongehuwde, al dan niet geadopteerde kind is van de vreemdeling, bedoeld onder a of b;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.1.d
    text: |-
      een ander naast familielid is van de vreemdeling, bedoeld onder a, die ten tijde van de gebeurtenissen die hebben
      geleid tot het in de aanhef bedoelde besluit volledig of grotendeels afhankelijk was van die vreemdeling en met het
      gezin samenwoonde, en wiens achterlating een schrijnende situatie zou vormen; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.1.e
    text: |-
      behoort tot de bij ministeriële regeling aan te wijzen groep vreemdelingen uit hetzelfde land of dezelfde regio als
      de vreemdeling, bedoeld onder a, die om dezelfde reden ontheemd zijn en die niet reeds bescherming genieten in een
      ander land dat partij is bij het Verdrag betreffende de werking van de Europese Unie of de Overeenkomst betreffende
      de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.2
    text: 'In afwijking van het eerste lid kan Onze Minister bepalen dat uitzetting niet achterwege blijft, indien:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.2.a
    text: |-
      de aanvraag met toepassing van [artikel 30 van de Wet][ref1] niet in behandeling is genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
  - number: 3.1a.2.b
    text: |-
      de vreemdeling reeds tijdelijke bescherming geniet in een ander land dat partij is bij het Verdrag betreffende de
      werking van de Europese Unie of de Overeenkomst betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.2.c
    text: |-
      de vreemdeling met toepassing van de richtlijn tijdelijke bescherming wordt overgebracht naar een ander land dat
      partij is bij het Verdrag betreffende de werking van de Europese Unie of de Overeenkomst betreffende de Europese
      Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.2.d
    text: de vreemdeling naar het land of regio van herkomst is teruggekeerd;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.2.e
    text: 'ernstige redenen aanwezig zijn om aan te nemen dat de vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.2.e.1°
    text: |-
      een misdrijf tegen de vrede, een oorlogsmisdrijf, of een misdrijf tegen de menselijkheid heeft begaan als
      omschreven in de internationale instrumenten die bepalingen inzake dergelijke misdrijven bevatten;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.2.e.2°
    text: buiten Nederland een ernstig niet-politiek misdrijf heeft begaan alvorens hij tijdelijke bescherming verkreeg;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.2.e.3°
    text: zich schuldig heeft gemaakt aan daden die in strijd zijn met de doeleinden en beginselen van de Verenigde Naties;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.2.f
    text: |-
      de vreemdeling ingevolge een onherroepelijk geworden veroordeling wegens een bijzonder ernstig misdrijf een gevaar
      vormt voor de Nederlandse samenleving; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.2.g
    text: er redelijke gronden aanwezig zijn om de vreemdeling als gevaar voor de nationale veiligheid te beschouwen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.3
    text: |-
      Bij de toepassing van het tweede lid, onderdeel e, onder 2°, wordt de ernst van de verwachte vervolging afgewogen
      tegen de aard van het misdrijf waarvan de vreemdeling wordt verdacht, en kunnen bijzonder wrede handelingen,
      ook indien deze met een vermeend politiek oogmerk zijn verricht, worden aangemerkt als ernstige, niet-politieke
      misdrijven. Dit geldt voor alle deelnemers aan het misdrijf, met inbegrip van hen die het misdrijf hebben
      uitgelokt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1a.4
    text: |-
      Een besluit op grond van het tweede lid, onder e tot en met g, wordt met inachtneming van het
      evenredigheidsbeginsel gebaseerd op het persoonlijke gedrag van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1a
  - number: 3.1b.1
    text: |-
      Het indienen van een aanvraag tot het verlenen van een Europese blauwe kaart heeft tot gevolg dat uitzetting
      achterwege blijft, indien de vreemdeling direct voorafgaande aan de indiening van de aanvraag houder was van een
      door de autoriteiten van een andere staat die partij is bij het Verdrag betreffende de werking van de Europese Unie
      afgegeven Europese blauwe kaart.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1b
  - number: 3.1b.2
    text: |-
      Het indienen van een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 3.13, eerste lid][ref1], heeft tot gevolg dat uitzetting achterwege blijft, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.1b.2.a
    text: |-
      de vreemdeling de echtgenoot, de geregistreerde partner dan wel de ongehuwde partner van een houder van een
      Europese blauwe kaart is, dan wel het minderjarige kind van die echtgenoot, partner of houder van de Europese
      blauwe kaart;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1b
  - number: 3.1b.2.b
    text: |-
      de houder van de Europese blauwe kaart, bedoeld in onderdeel a, direct voorafgaande aan de indiening van de
      aanvraag houder was van een door de autoriteiten van een andere staat die partij is bij het Verdrag betreffende de
      werking van de Europese Unie afgegeven Europese blauwe kaart, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1b
  - number: 3.1b.2.c
    text: geen sprake is van gezinsvorming.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.1b
  - number: '3.2'
    text: |-
      Voor de toepassing van [artikel 12, eerste lid, onder b en d, van de Wet][ref1] zijn de [artikelen 2.9][ref2],
      [2.10][ref3] en [2.11][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 3.3.1
    text: |-
      De termijn gedurende welke het aan vreemdelingen krachtens [artikel 12 van de Wet][ref1] is toegestaan in Nederland
      te verblijven is:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel12
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '12'
  - number: 3.3.1.a
    text: |-
      voor houders van een doorreisvisum en voor vreemdelingen aan wie uitsluitend voor doorreis een bijzonder
      doorlaatbewijs is afgegeven: de tijd welke voor de voortzetting van hun reis noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
  - number: 3.3.1.b
    text: |-
      voor houders van een doorreisvisum met bevoegdheid tot oponthoud of van een reisvisum: de duur waarvoor het visum
      is afgegeven of verlengd dan wel, voorzover het een visum voor meer reizen betreft, de in het visum aangegeven duur
      waarvoor ononderbroken verblijf is toegestaan;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
  - number: 3.3.1.c
    text: |-
      voor vreemdelingen die voor een verblijf van niet langer dan 90 dagen naar Nederland zijn gekomen: 90 dagen of, in
      geval van verlenging door Onze Minister van de termijn wegens bijzondere omstandigheden, 180 dagen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
  - number: 3.3.1.d
    text: |-
      voor houders van een visum voor verblijf van langere duur of een verblijfstitel als bedoeld in artikel 18, eerste
      lid, onderscheidenlijk artikel 21, eerste lid, van de Schengen Uitvoeringsovereenkomst: 90 dagen of, in geval van
      verlenging door Onze Minister van de termijn wegens bijzondere omstandigheden, 180 dagen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
  - number: 3.3.1.e
    text: |-
      voor houders van een geldige machtiging tot voorlopig verblijf: de tijd tot de vreemdeling rechtmatig verblijf
      in de zin van [artikel 8, onder a, van de Wet][ref1] verkrijgt, maar niet langer dan de geldigheidsduur van de
      machtiging;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.3.1.f
    text: |-
      voor de houder van een EU-verblijfsvergunning voor langdurig ingezetenen die is afgegeven door een andere staat
      die partij is bij het Verdrag betreffende de werking van de Europese Unie, dan wel voor de echtgenoot of het
      minderjarig kind van die houder in geval het gezin reeds was gevormd in die staat: 90 dagen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
  - number: 3.3.1.g
    text: |-
      voor de houder van een geldige Europese blauwe kaart die is afgegeven door een andere lidstaat van de Europese
      Unie en die gedurende ten minste twaalf maanden als houder van die kaart in die lidstaat heeft verbleven of na een
      dergelijk verblijf gedurende ten minste zes maanden als houder van een Europese blauwe kaart in een andere lidstaat
      heeft verbleven, dan wel voor de echtgenoot of het minderjarig kind van die houder in geval het gezin reeds was
      gevormd in die lidstaat: 30 dagen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
  - number: 3.3.1.h
    text: 'voor andere vreemdelingen: acht dagen.'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
  - number: 3.3.2
    text: |-
      De in het eerste lid, onder b en c, bedoelde termijn verstrijkt in geen geval later dan op de achtste dag nadat
      zich omstandigheden hebben voorgedaan, waaruit kan worden afgeleid dat de vreemdeling het voornemen heeft langer
      dan 90 dagen binnen een tijdvak van 180 dagen in Nederland te verblijven.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
  - number: 3.3.3
    text: |-
      In afwijking van het tweede lid verstrijkt de termijn, bedoeld in het eerste lid, onderdeel c, in geval van
      verlenging wegens bijzondere omstandigheden, niet later dan op de achtste dag nadat zich feiten of omstandigheden
      hebben voorgedaan, waaruit kan worden afgeleid dat de vreemdeling het voornemen heeft langer dan 180 dagen in
      Nederland te verblijven.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
  - number: 3.3.4
    text: |-
      De termijn, bedoeld in het eerste lid, onderdeel d, bedraagt ten hoogste 180 dagen binnen een periode van 360 dagen
      voor de categorie van:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
  - number: 3.3.4.a
    text: |-
      onderzoekers die houder zijn van een door een andere lidstaat van de Europese Unie afgegeven verblijfsvergunning
      voor onderzoekers in de zin van richtlijn (EU) 2016/801 die een deel van het onderzoek in Nederland uitvoeren aan
      een krachtens [artikel 2c van de Wet][ref1] als referent erkende onderzoeksinstelling;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
  - number: 3.3.4.b
    text: |-
      de hen vergezellende familieleden die houder zijn van een door die andere lidstaat afgegeven verblijfsvergunning
      voor verblijf als partner of minderjarig kind bij die onderzoeker.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
  - number: 3.3.5
    text: |-
      De termijn, bedoeld in het eerste lid, onderdeel d, bedraagt ten hoogste 360 dagen voor de categorie van studenten
      die houder zijn van een door een andere lidstaat van de Europese Unie afgegeven verblijfsvergunning voor studenten
      die onder een uniaal of multilateraal programma met mobiliteitsmaatregelen of onder een overeenkomst tussen twee
      of meer instellingen voor hoger onderwijs vallen, die een deel van de studie in Nederland volgen aan een krachtens
      [artikel 2c van de Wet][ref1] als referent erkende onderwijsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
  - number: 3.3.6
    text: |-
      De in het vierde en vijfde lid bedoelde termijn verstrijkt onmiddellijk indien Onze Minister bewijs of ernstige en
      objectieve redenen heeft om vast te stellen dat het verblijf van de vreemdeling andere doelen dient of zou dienen
      dan die bedoeld in het vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.3
  - number: 3.4.1
    text: |-
      De in [artikel 14, derde lid, van de Wet][ref1] bedoelde beperkingen houden verband met:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.4.1.a
    text: verblijf als familie- of gezinslid;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.1.b
    text: verblijf als economisch niet-actieve langdurig ingezetene;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.1.c
    text: arbeid als zelfstandige;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.1.d
    text: arbeid als kennismigrant;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.1.e
    text: verblijf als houder van de Europese blauwe kaart;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.1.f
    text: seizoenarbeid;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.1.g
    text: overplaatsing binnen een onderneming;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.1.h
    text: arbeid in loondienst;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.1.i
    text: grensoverschrijdende dienstverlening;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.1.j
    text: onderzoek in de zin van richtlijn (EU) 2016/801;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.1.k
