      in [artikel 2a, tweede lid, van de Wet][ref1] heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2a
  - number: 3.23c.2
    text: |-
      De verblijfsvergunning bedoeld in het eerste lid wordt verleend, indien de langdurig ingezetene met de aantekening
      «voormalig houder van een Europese blauwe kaart»:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23c
  - number: 3.23c.2.a
    text: zijn verblijfsrecht uitoefent als bedoeld in artikel 14 Richtlijn langdurig ingezetenen; en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23c
  - number: 3.23c.2.b
    text: |-
      duurzaam en zelfstandig beschikt over voldoende middelen van bestaan als bedoeld in de [artikelen 3.73][ref1] en
      [3.74, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23c
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.23c.3
    text: 'In afwijking van het eerste lid, aanhef en onder d, wordt de verblijfsvergunning eveneens verleend, indien:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23c
  - number: 3.23c.3.a
    text: |-
      wordt voldaan aan de voorwaarden gesteld in [Richtlijn (EU) 2021/1883](32021L1883), in welk geval Onze Minister de
      hoofdpersoon als referent aanwijst; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23c
  - number: 3.23c.3.b
    text: |-
      de hoofdpersoon bij wie de vreemdeling als gezinslid wil verblijven een Turkse werknemer is als bedoeld in
      artikelen 6 en 13 van Besluit 1/80 van de Associatieraad EEG-Turkije betreffende de ontwikkeling van de Associatie,
      in welk geval deze hoofdpersoon niet als referent wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23c
  - number: 3.24a.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd wordt onder een beperking verband houdend met verblijf als
      familie- of gezinslid verleend aan de bloedverwant van de eerste graad in rechtstreekse opgaande lijn van de
      alleenstaande minderjarige houder van een verblijfsvergunning asiel voor bepaalde tijd die niet daadwerkelijk onder
      de hoede staat van een krachtens wettelijk voorschrift of gewoonterecht voor hem verantwoordelijke volwassene,
      indien die bloedverwant:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.24a
  - number: 3.24a.1.a
    text: |-
      beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel waarvoor
      de verblijfsvergunning is aangevraagd, of behoort tot één van de in [artikel 17 van de Wet][ref1] of in
      [artikel 3.71, tweede lid][ref2], bedoelde categorieën;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.24a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.24a.1.b
    text: |-
      beschikt over een geldig document voor grensoverschrijding, of naar het oordeel van Onze Minister heeft aangetoond
      dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit van een geldig
      document voor grensoverschrijding kan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.24a
  - number: 3.24a.1.c
    text: |-
      bereid is een onderzoek naar of behandeling voor tuberculose te ondergaan en daaraan mee te werken of de
      nationaliteit bezit van een van de bij ministeriële regeling vast te stellen landen, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.24a
  - number: 3.24a.1.d
    text: |-
      geen gevaar vormt voor de openbare orde als bedoeld in de [artikelen 3.77][ref1] en [3.78][ref2] of de nationale
      veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.24a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.24a.2
    text: |-
      De vergunning wordt eerst verleend, nadat de alleenstaande minderjarige heeft aangetoond duurzaam en zelfstandig te
      beschikken over voldoende middelen van bestaan als bedoeld in [artikel 3.74, eerste lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.24a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.26.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder een beperking verband houdend met
      verblijf als familie- of gezinslid worden verleend aan de minderjarige vreemdeling, die ter adoptie
      wil verblijven in het gezin van een of meer Nederlanders of vreemdelingen met rechtmatig verblijf als
      bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], indien aan de vereisten van de
      [Wet opneming buitenlandse kinderen ter adoptie][ref2] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004447
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004447
  - number: 3.26.2
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder b of c, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.27.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder een beperking verband houdend met verblijf als
      familie- of gezinslid worden verleend aan de minderjarige vreemdeling die door de aspirant-adoptiefouders in een
      periode waarin zij hun gewone verblijfplaats in het buitenland hadden, is opgenomen en door hen aldaar is verzorgd
      en opgevoed, tezamen met de aspirant-adoptiefouders Nederland is ingereisd, indien:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.27
  - number: 3.27.1.a
    text: |-
      de aspirant-adoptiefouders Nederlanders zijn of vreemdelingen met rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.27.1.b
    text: |-
      de ouders van de vreemdeling, of indien deze zijn overleden of een onbekende verblijfplaats hebben de autoriteiten
      van het land van verblijf voor de komst naar Nederland, hebben ingestemd met het vertrek van de vreemdeling naar
      het land van verblijf vóór de komst van het gezin naar Nederland en met de opneming van de vreemdeling ter adoptie.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.27
  - number: 3.27.2
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder b of c, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.27.3
    text: |-
      Dit artikel is niet van toepassing indien de vreemdeling op het tijdstip van de inreis sinds meer dan een jaar
      bij de aspirant-adoptiefouders verblijft en door hen is verzorgd en opgevoed of indien het kind is geadopteerd
      in overeenstemming met het op 29 mei 1993 te 's-Gravenhage tot stand gekomen verdrag inzake de bescherming van
      kinderen en de samenwerking op het gebied van de interlandelijke adoptie (Trb. 1993, 197), welke overeenstemming
      blijkt uit een schriftelijke verklaring van de centrale autoriteit van de staat waar de adoptie heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.27
  - number: 3.28.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder een beperking verband houdend met verblijf als
      familie- of gezinslid worden verleend aan de minderjarige vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.28
  - number: 3.28.1.a
    text: |-
      die als pleegkind in Nederland wil verblijven in het gezin van één of meer Nederlanders of vreemdelingen met
      rechtmatig verblijf, als bedoeld in [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.28.1.b
    text: die naar het oordeel van Onze Minister in het land van herkomst geen aanvaardbare toekomst heeft.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.28
  - number: 3.28.2
    text: De aspirant-pleegouders dienen in staat te zijn de vreemdeling een goede opvoeding en verzorging te geven.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.28
  - number: 3.28.3
    text: Bij de aanvraag wordt een medische verklaring overgelegd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.28
  - number: 3.28.4
    text: |-
      De aanvraag wordt niet op grond van [artikel 16, eerste lid, onder c, van de Wet][ref1] afgewezen,
      indien de persoon bij wie de vreemdeling wil verblijven de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], heeft bereikt of naar het oordeel van Onze Minister
      blijvend en volledig arbeidsongeschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 3.29.1
    text: |-
      Onze Minister kan ter uitvoering van [richtlijn 2003/86/EG](32003L0086) van de Raad van 22 september 2003 inzake
      het recht op gezinshereniging nader onderzoek doen wanneer er in individuele gevallen gegronde vermoedens bestaan
      van fraude of dat het huwelijk, het geregistreerd partnerschap, het partnerschap of de adoptie uitsluitend tot
      stand is gebracht om toegang tot en verblijf in Nederland te verkrijgen. Het nader onderzoek geschiedt niet
      stelselmatig.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.2
    text: 'Gegronde vermoedens, als bedoeld in het eerste lid, kunnen worden gebaseerd op:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.2.a
    text: |-
      valse of misleidende informatie die door de hoofdpersoon of de vreemdeling is verstrekt, valse of vervalste
      documenten die zij hebben gebruikt, andere vormen van fraude die zij hebben gepleegd of onwettige middelen die zij
      hebben gebruikt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.2.b
    text: |-
      informatie die relevant is voor de beoordeling of sprake is van een huwelijk, geregistreerd partnerschap,
      partnerschap dat of adoptie die uitsluitend tot stand is gebracht om toegang tot en verblijf in Nederland te
      verkrijgen, over:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.2.b.1
    text: |-
      de duur, het moment van de totstandkoming en de beëindiging alsmede de aard van de relatie tussen de hoofdpersoon
      en de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.2.b.2
    text: |-
      de woonsituatie, de gemeenschappelijkheid van het huishouden en bijbehorende aanzienlijke en langlopende juridische
      en financiële verplichtingen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.2.b.3
    text: |-
      aanwijzingen dat er geen of onvoldoende persoonlijke relatie bestaat of heeft bestaan tussen de hoofdpersoon en
      de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.2.b.4
    text: |-
      bewijs dat er een ongebruikelijk hoog geldbedrag is betaald of een gift is gedaan voor het sluiten van het
      huwelijk, het geregistreerd partnerschap, partnerschap of de adoptie;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.2.b.5
    text: |-
      bewijs van een of meer eerdere schijnhuwelijken, geregistreerd schijnpartnerschappen, schijnpartnerschappen of
      schijnadopties of ander misbruik of fraude met het oog op het verkrijgen van een verblijfsrecht;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.2.b.6
    text: |-
      het moment van de totstandkoming of de beëindiging van het huwelijk, het geregistreerd partnerschap, het
      partnerschap of de adoptie ten opzichte van het moment van verlening van de verblijfsvergunning aan de vreemdeling;
      of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.2.b.7
    text: |-
      ervaringsgegevens die zijn gebaseerd op representatief dossieronderzoek, mits deze op objectieve wijze worden
      toegepast.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.3
    text: 'Het nader onderzoek bestaat uit het:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.3.a
    text: ter beantwoording aan de hoofdpersoon en vreemdeling toezenden van schriftelijke vragen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.3.b
    text: |-
      verlangen van bewijs van de hoofdpersoon en vreemdeling van de echtheid van het huwelijk, het geregistreerd
      partnerschap, het partnerschap of de adoptie;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.3.c
    text: gelijktijdig dan wel opvolgend zonder tussentijds contactmoment horen van de hoofdpersoon en de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.3.d
    text: |-
      horen van andere meerderjarige personen die in relatie staan met de hoofdpersoon of de vreemdeling, voor zover dat
      noodzakelijk is voor het nader onderzoek; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.3.e
    text: |-
      verzoeken van inlichtingen aan andere bestuursorganen met toepassing van
      [artikel 107, zevende lid, van de wet][ref1], voor zover dat noodzakelijk is voor het nader onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 3.29.4
    text: |-
      Onze Minister stelt de hoofdpersoon en de vreemdeling in kennis van het nader onderzoek. De kennisgeving vermeldt
      welke gegronde vermoedens daar de aanleiding toe zijn.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.5
    text: |-
      De hoofdpersoon en vreemdeling zijn verplicht om medewerking te verlenen aan het nader onderzoek en verstrekken
      daartoe relevante informatie die zij tot hun beschikking hebben.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.6
    text: |-
      Onze Minister stelt een verslag op van de bevindingen van het nader onderzoek. Het verslag wordt aan de
      hoofdpersoon en de vreemdeling overgelegd, waarbij zij in de gelegenheid worden gesteld daar binnen een redelijke
      termijn op te reageren voordat de beschikking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29.7
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29
  - number: 3.29a
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd wordt verleend onder een beperking verband houdend met verblijf
      als economisch niet-actieve langdurig ingezetene aan de langdurig ingezetene, die:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29a
  - number: 3.29a.a
    text: beschikt over een geldig document voor grensoverschrijding;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29a
  - number: 3.29a.b
    text: |-
      duurzaam en zelfstandig beschikt over voldoende middelen van bestaan als bedoeld in
      [artikel 3.74, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.29a.c
    text: |-
      geen gevaar vormt voor de openbare orde als bedoeld in de [artikelen 3.77][ref1] en [3.78][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.29a.d
    text: geen gevaar vormt voor de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.29a
  - number: 3.30.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder een beperking, verband houdende met het verrichten van
      arbeid als zelfstandige worden verleend aan de vreemdeling die:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30
  - number: 3.30.1.a
    text: |-
      arbeid als zelfstandige verricht of gaat verrichten, waarmee naar het oordeel van Onze Minister een wezenlijk
      Nederlands belang is gediend;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30
  - number: 3.30.1.b
    text: uit die werkzaamheden duurzaam en zelfstandig voldoende middelen van bestaan verwerft, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30
  - number: 3.30.1.c
    text: |-
      voldoet aan de bevoegdheidsvereisten voor de uitoefening van die arbeid en aan de vereisten voor het uitoefenen van
      het desbetreffende bedrijf.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30
  - number: 3.30.2
    text: |-
      De beoordeling van het wezenlijk Nederlands belang, bedoeld in het eerste lid, onderdeel a, van de
      ondernemingsactiviteiten geschiedt aan de hand van het bij ministeriële regeling in overeenstemming met Onze
      Minister van Economische Zaken vastgestelde puntenstelsel of op een andere bij die ministeriële regeling te
      bepalen geschikte wijze. In die regeling kunnen ondernemingsactiviteiten worden aangewezen waarmee geen wezenlijk
      Nederlands belang is gediend.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30
  - number: 3.30.3
    text: |-
      De aanvraag wordt niet afgewezen wegens het ontbreken van een wezenlijk Nederlands belang, indien de vreemdeling op
      het moment waarop de aanvraag is ontvangen een ononderbroken arbeidsverleden heeft van ten minste zeven jaar:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30
  - number: 3.30.3.a
    text: |-
      aan boord van een zeeschip dat op grond van voor Nederland geldende rechtsregels gerechtigd is de vlag van het
      Koninkrijk te voeren;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30
  - number: 3.30.3.b
    text: op het Nederlandse deel van het continentaal plat;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30
  - number: 3.30.3.c
    text: in de internationale binnenscheepvaart aan boord van Nederlandse schepen of daarmee gelijkgestelde inrichtingen, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30
  - number: 3.30.3.d
    text: |-
      in het internationale wegtransport in dienst van een Nederlandse werkgever, voorzover dat transport vanuit of naar
      Nederland plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30
  - number: 3.30.4
    text: |-
      Voor de toepassing van het derde lid worden niet als onderbrekingen aangemerkt tussentijdse perioden van
      onvrijwillige werkloosheid, voorzover die in Nederland zijn doorgebracht en elk zes maanden of korter duurden, en
      die perioden in totaal niet langer dan twaalf maanden bedragen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30
  - number: 3.30.5
    text: De verblijfsvergunning kan aan een langdurig ingezetene worden verleend in afwijking van het eerste lid, onder a.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30
  - number: 3.30.6
    text: |-
      In afwijking van het eerste en tweede lid kan de verblijfsvergunning worden verleend aan de vreemdeling die een
      innovatieve onderneming opricht waarmee hij arbeid als zelfstandige verricht of gaat verrichten, die duurzaam
      beschikt over voldoende middelen van bestaan en die aannemelijk maakt dat hij binnen één jaar na verlening van de
      vergunning zal voldoen aan de voorwaarden, bedoeld in het eerste en tweede lid. Bij ministeriële regeling worden
      nadere voorwaarden gesteld aan de toepassing van de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30
  - number: 3.30.7
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder k, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.30a.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan worden verleend onder een
      beperking verband houdend met arbeid als kennismigrant aan een vreemdeling als bedoeld in
      [artikel 2.1 van het Besluit uitvoering Wet arbeid vreemdelingen 2022][ref1], die arbeid ten behoeve van een
      krachtens [artikel 2c van de Wet][ref2] als referent erkende werkgever verricht of wil verrichten tenzij het
      overeengekomen loon naar het oordeel van Onze Minister van Sociale Zaken en Werkgelegenheid niet marktconform is.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30a
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2c
  - number: 3.30a.2
    text: |-
      De aanvraag wordt niet afgewezen op de grond dat de werkgever niet krachtens [artikel 2c van de Wet][ref1]
      als referent is erkend of ten behoeve van het verblijf van de vreemdeling geen verklaring als bedoeld in
      [artikel 2a, tweede lid, van de Wet][ref2] heeft afgelegd, indien de vreemdeling de Turkse nationaliteit heeft. In
      dat geval wordt de werkgever niet als referent aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2a
  - number: 3.30a.3
    text: |-
      De aanvraag wordt afgewezen indien de vreemdeling in aanmerking komt voor de verblijfsvergunning regulier
      voor bepaalde tijd onder de beperking «overplaatsing binnen een onderneming», in welk geval laatstgenoemde
      verblijfsvergunning ambtshalve wordt verleend, onverminderd [artikel 24a, derde lid, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel24a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 24a
  - number: 3.30a.4
    text: |-
      De aanvraag wordt afgewezen indien de vreemdeling onder de reikwijdte van [richtlijn 2014/66](32014L0066)/
      EU valt en niet in aanmerking komt voor de verblijfsvergunning regulier voor bepaalde tijd onder de beperking
      «overplaatsing binnen een onderneming», tenzij de vreemdeling de Turkse nationaliteit heeft.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30a
  - number: 3.30b.1
    text: |-
      De Europese blauwe kaart wordt verleend aan een vreemdeling als bedoeld in
      [artikel 2.2 van het Besluit uitvoering Wet arbeid vreemdelingen 2022][ref1], die:


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
  - number: 3.30b.1.a
    text: |-
      beschikt over een geldige arbeidsovereenkomst of een bindend aanbod van een hooggekwalificeerde baan in de zin
      van artikel 2, onder 2, van [Richtlijn (EU) 2021/1883](32021L1883) voor de duur van ten minste zes maanden met een
      werkgever in Nederland, waarmee een bruto inkomen wordt verworven dat ten minste gelijk is aan het loon, bedoeld in
      [artikel 2.2 van het Besluit uitvoering Wet arbeid vreemdelingen 2022][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
  - number: 3.30b.1.b
    text: |-
      in Nederland arbeid verricht of gaat verrichten voor een werkgever aan wie in de periode van maximaal
      vijf jaar direct voorafgaande aan de aanvraag geen sanctie is opgelegd wegens overtreding van de
      [Wet arbeid vreemdelingen][ref1], de [Wet allocatie arbeid door intermediairs][ref2], de [Arbeidstijdenwet][ref3],
      de [Arbeidsomstandighedenwet][ref4] of de [Wet minimumloon en minimumvakantiebijslag][ref5] of wegens het
      niet of onvoldoende afdragen van loonbelasting, premies voor de werknemersverzekeringen of premies voor de
      volksverzekeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0007149
      [ref2]: https://wetten.overheid.nl/BWBR0009616
      [ref3]: https://wetten.overheid.nl/BWBR0007671
      [ref4]: https://wetten.overheid.nl/BWBR0010346
      [ref5]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
    references:
      - id: ref1
        bwb_id: BWBR0007149
      - id: ref2
        bwb_id: BWBR0009616
      - id: ref3
        bwb_id: BWBR0007671
      - id: ref4
        bwb_id: BWBR0010346
      - id: ref5
        bwb_id: BWBR0002638
  - number: 3.30b.1.c
    text: |-
      in Nederland arbeid gaat verrichten die voldoet aan de voorwaarden die zijn vastgelegd uit hoofde van het
      toepasselijke recht, in collectieve overeenkomsten of door praktijken in de relevante beroepssectoren voor
      hooggekwalificeerde banen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.1.d
    text: |-
      in Nederland arbeid verricht of gaat verrichten voor een onderneming welke niet is opgericht of opereert met als
      voornaamste doel de toegang van onderdanen van derde landen te faciliteren;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.1.e
    text: |-
      in Nederland arbeid verricht of gaat verrichten voor een onderneming welke niet uit hoofde van het insolventierecht
      ontbonden is of wordt, of die geen economische activiteit uitoefent;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.1.f
    text: |-
      voor zover hij een gereguleerd beroep in de zin van
      [artikel 1 van de Algemene wet erkenning EG-beroepskwalificaties][ref1] wil uitoefenen, beschikt over een erkenning
      van de beroepskwalificaties in de zin van [artikel 5 van die wet][ref2], dan wel, voor zover hij geen gereguleerd
      beroep wil uitoefenen, beschikt over voor dat beroep of de desbetreffende sector benodigde getuigschriften van
      hoger onderwijs in de zin van artikel 2, onder 8, van [Richtlijn (EU) 2021/1883](32021L1883) of relevante hogere
      beroepsvaardigheden;


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 3.30b.1.g
    text: in het bezit is van een geldig document voor grensoverschrijding;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.1.h
    text: |-
      in het bezit is van een geldige machtiging tot voorlopig verblijf, afgegeven onder een beperking
      verband houdend met verblijf als houder van de Europese blauwe kaart, dan wel behoort tot een van de in
      [artikel 17 van de Wet][ref1] of [artikel 3.71, tweede lid][ref2], bedoelde categorieën, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.30b.1.i
    text: |-
      geen gevaar voor de openbare orde als bedoeld in de [artikelen 3.77][ref1] en [3.78][ref2] of de nationale
      veiligheid vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.30b.2
    text: 'Het eerste lid is niet van toepassing ten aanzien van de vreemdeling, die:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.2.a
    text: |-
      een aanvraag tot het verlenen van verblijfsvergunning asiel voor bepaalde tijd heeft ingediend waarop nog niet
      onherroepelijk is beslist;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.2.b
    text: |-
      een aanvraag tot het verlenen van een verblijfsvergunning regulier voor bepaalde tijd onder een beperking verband
      houdend met onderzoek in de zin van richtlijn (EU) 2016/801 heeft ingediend, waarop nog niet onherroepelijk is
      beslist;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.2.c
    text: gemeenschapsonderdaan of langdurig ingezetene is;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.2.d
    text: |-
      in Nederland verblijft op grond van een verdrag dat de toegang en het tijdelijk verblijf van bepaalde categorieën
      natuurlijke personen in verband met handel en investeringen gemakkelijker maken, met uitzondering van onderdanen
      van derde landen die toegang hebben gekregen tot het grondgebied van een lidstaat in het kader van een
      overplaatsing binnen een onderneming op grond van [Richtlijn 2014/66/EU](32014L0066);
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.2.e
    text: |-
      in Nederland verblijft als vreemdeling die onder Richtlijn 96/71/EG van het Europees Parlement en de Raad van
      16 december 1996 betreffende de terbeschikkingstelling van werknemers met het oog op het verrichten van diensten
      valt en in Nederland ter beschikking is gesteld; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.2.f
    text: tijdelijk niet wordt uitgezet op grond van feitelijke of juridische gronden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.3
    text: 'Voor de toepassing van het eerste lid, onderdeel f wordt onder hogere beroepsvaardigheden verstaan:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.3.a
    text: |-
      voor de in bijlage I van [Richtlijn (EU) 2021/1883](32021L1883) genoemde beroepen: de kennis, vaardigheden
      en competenties die worden gestaafd door beroepservaring die minimaal vergelijkbaar is met het niveau van
      getuigschriften van hoger onderwijs, die relevant zijn voor het beroep of de sector zoals gespecificeerd in de
      arbeidsovereenkomst of het bindende baanaanbod, en die verworven zijn tijdens de in bijlage I voor elk relevant
      beroep bepaalde periode;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.3.b
    text: |-
      voor de overige beroepen: de kennis, vaardigheden en competenties die worden gestaafd door ten minste vijf jaar
      beroepservaring die vergelijkbaar is met het niveau van de benodigde getuigschriften van hoger onderwijs en
      die relevant zijn voor het beroep of de sector zoals gespecificeerd in de arbeidsovereenkomst of het bindende
      baanaanbod.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.4
    text: |-
      Aan een vreemdeling die houder is van een geldige Europese blauwe kaart die is afgegeven door een andere lidstaat
      van de Europese Unie en gedurende ten minste twaalf maanden als houder van die kaart in die lidstaat heeft
      verbleven of na een dergelijk verblijf gedurende ten minste zes maanden als houder van een Europese blauwe kaart in
      een andere lidstaat heeft verbleven, wordt de Europese blauwe kaart verleend indien die voldoet aan de voorwaarden
      als genoemd in het eerste lid, sub a, f en g.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.5
    text: |-
      Voor zover een vreemdeling houder is van een door Nederland afgegeven vergunning als bedoeld in artikel 14, onder
      de beperking «arbeid als kennismigrant», is het eerste lid, onder f, niet van toepassing voor zover deze documenten
      reeds geverifieerd werden in het kader van de aanvraag in de nationale procedure.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.6
    text: |-
      Het eerste lid is niet van toepassing voor zover de overgelegde documenten op frauduleuze wijze zijn verkregen,
      zijn vervalst of op ongeoorloofde wijze zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.7
    text: |-
      De aanvraag wordt niet afgewezen op de grond dat de werkgever niet krachtens [artikel 2c van de Wet][ref1]
      als referent is erkend of ten behoeve van het verblijf van de vreemdeling geen verklaring als bedoeld in
      [artikel 2a, tweede lid, van de Wet][ref2] heeft afgelegd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2a
  - number: 3.30b.7.a
    text: |-
      wordt voldaan aan de voorwaarden voor de afgifte van de Europese blauwe kaart, zoals gesteld in [Richtlijn (EU)
      2021/1883](32021L1883), in welk geval Onze Minister de werkgever als referent aanwijst;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.7.b
    text: de vreemdeling de Turkse nationaliteit heeft, in welk geval de werkgever niet als referent wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30b.8
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de toepassing van het eerste tot en met
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30b
  - number: 3.30c.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder een beperking verband houdend met seizoenarbeid worden
      verleend aan een seizoenarbeider als bedoeld in artikel 3, onder b, van [Richtlijn 2014/36](32014L0036)/EU van het
      Europees Parlement en Raad van 26 februari 2014 betreffende de voorwaarden voor toegang en verblijf van onderdanen
      van derde landen met het oog op tewerkstelling als seizoenarbeider indien geen afwijzingsgrond van toepassing is
      uit [artikel 16 van de Wet][ref1] en de [artikelen 8][ref2] en [9 van de Wet arbeid vreemdelingen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007149
        artikel: '9'
  - number: 3.30c.2
    text: |-
      De verblijfsvergunning wordt afgewezen, indien de vreemdeling een risico op illegale immigratie vormt, dan wel niet
      voornemens is het grondgebied van de lidstaten van de Europese Unie uiterlijk op de datum van verstrijken van de
      verblijfsvergunning te verlaten.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30c
  - number: 3.30d.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd wordt onder de beperking «overplaatsing binnen een onderneming»
      verleend aan een vreemdeling, niet zijnde een burger van de Unie, ten behoeve van een tijdelijke overplaatsing voor
      beroepsactiviteiten of opleiding, naar een gastentiteit in Nederland die behoort tot een buiten het grondgebied van
      de Europese Unie gevestigde onderneming, indien is voldaan aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.a
    text: |-
      de vreemdeling voldoet aan de definitie van leidinggevende, specialist of trainee-werknemer in de zin van
      artikel 3, onder e, f of g, van [richtlijn 2014/66](32014L0066)/EU;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.b
    text: |-
      de gastentiteit, bedoeld in artikel 3, onder d, van [richtlijn 2014/66](32014L0066)/EU, en de in een derde land
      gevestigde onderneming behoren tot dezelfde onderneming of tot dezelfde groep van ondernemingen, bedoeld in
      artikel 3, onder l, van die richtlijn;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.c
    text: |-
      de vreemdeling is onmiddellijk voorafgaand aan de overplaatsing in dienst bij dezelfde onderneming of groep of
      ondernemingen voor een ononderbroken periode van drie maanden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.d
    text: |-
      de vreemdeling beschikt over een geldige arbeidsovereenkomst met de buiten de Europese Unie gevestigde onderneming,
      met daarin onderstaande gegevens, en, indien deze die gegevens niet bevat, een opdrachtbrief van de werkgever,
      met daarin:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.d.1°
    text: nadere bijzonderheden over de duur van de overplaatsing en de vestigingsplaats van de gastentiteit;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.d.2°
    text: |-
      gegevens die aantonen dat de vreemdeling in de gastentiteit in Nederland een functie zal bekleden als
      leidinggevende, specialist of trainee-werknemer;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.d.3°
    text: de bezoldiging en de overige arbeidsvoorwaarden tijdens de overplaatsing;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.d.4°
    text: |-
      gegevens die aantonen dat de vreemdeling na het einde van de overplaatsing kan worden overgeplaatst naar een
      entiteit die tot dezelfde onderneming of groep van ondernemingen behoort en in een derde land is gevestigd;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.e
    text: |-
      de vreemdeling bezit de beroepskwalificaties en ervaring die zijn vereist in de gastentiteit waarnaar hij wordt
      overgeplaatst als leidinggevende of specialist, of, in het geval van een trainee-werknemer, het masterdiploma;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.f
    text: |-
      voor zover hij een gereglementeerd beroep in de zin van
      [artikel 1 van de Algemene wet erkenning EU-beroepskwalificaties][ref1] wil uitoefenen, beschikt over een erkenning
      van de beroepskwalificaties in de zin van [artikel 5 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 3.30d.1.g
    text: |-
      van de te vervullen arbeidsplaats liggen de arbeidsvoorwaarden, arbeidsverhoudingen of arbeidsomstandigheden ten
      minste op het niveau dat wettelijk is vereist en in de desbetreffende bedrijfstak gebruikelijk is;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.h
    text: |-
      indien de vreemdeling een trainee-werknemer is, legt hij een trainee-overeenkomst over die verband houdt met de
      voorbereiding voor zijn toekomstige functie binnen de onderneming of groep van ondernemingen, met een beschrijving
      van het traineeprogramma waaruit blijkt dat het doel van het verblijf is de trainee-werknemer op te leiden voor
      loopbaanontwikkeling of een opleiding in bedrijfstechnieken en -methoden, de duur ervan en de wijze waarop tijdens
      de overplaatsing toezicht zal worden uitgeoefend op de trainee-werknemer;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.i
    text: |-
      de gastentiteit is niet opgericht met als belangrijkste doel de binnenkomst van binnen een onderneming
      overgeplaatste personen te vergemakkelijken;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.j
    text: |-
      Nederland is de lidstaat waar over het geheel genomen het langst durende verblijf tijdens de overplaatsing zal
      plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.k
    text: de vreemdeling heeft op het tijdstip van de aanvraag zijn hoofdverblijf buiten de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.1.l
    text: |-
      geen afwijzingsgrond uit [artikel 16, eerste lid, onder a tot en met g, van de Wet][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.30d.2
    text: 'De aanvraag kan worden afgewezen indien:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.2.a
    text: |-
      aan de werkgever of de gastentiteit in de periode van maximaal vijf jaar direct voorafgaande aan de aanvraag
      een sanctie is opgelegd wegens overtreding van [artikel 2 van de Wet arbeid vreemdelingen][ref1] of wegens
      het niet of onvoldoende afdragen van loonbelasting, premies voor de werknemersverzekeringen of premies voor de
      volksverzekeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 3.30d.2.b
    text: geen economische activiteit plaatsvindt bij de werkgever of gastentiteit;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.2.c
    text: |-
      de vreemdeling in de periode van zes maanden direct voorafgaande aan de aanvraag in Nederland heeft verbleven
      voor een eerdere overplaatsing binnen een onderneming in de zin van richtlijn 2014/66/EU die de maximumduur heeft
      bereikt van:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.2.c.1
    text: drie jaar in geval van een leidinggevende of specialist; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.2.c.2
    text: |-
      een jaar in geval van een trainee-werknemer, met aftrek van eerder verblijf in andere lidstaten in geval van
      mobiliteit.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.30d.3
    text: |-
      Het eerste lid, aanhef en onderdelen a, b, d, f, g, i en l, en tweede lid zijn van overeenkomstige toepassing
      op een houder van een door een andere lidstaat van de Europese Unie afgegeven verblijfsvergunning met de
      vermelding «ICT» die in Nederland wil verblijven voor een overplaatsing binnen een onderneming in het kader van
      langetermijnmobiliteit in de zin van artikel 22 van richtlijn 2014/66/EU, met dien verstande dat de aanvraag niet
      wordt afgewezen op [artikel 16, eerste lid, onder a, van de Wet][ref1]. De aanvraag wordt slechts ingewilligd
      indien de vreemdeling zijn hoofdverblijf in een andere lidstaat van de Europese Unie heeft. De aanvraag wordt
      afgewezen indien Nederland de lidstaat is waar over het geheel genomen het langst durende verblijf tijdens
      de overplaatsing zal plaatsvinden. De aanvraag wordt voorts afgewezen indien de gastentiteit gelijktijdig een
      kennisgeving voor kortetermijnmobiliteit heeft ingediend voor de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.30d.4
    text: |-
      Onze Minister besluit niet over de verlening, verlenging of intrekking van de verblijfsvergunning dan nadat hij
      advies heeft gevraagd aan het Uitvoeringsinstituut werknemersverzekeringen omtrent de voorwaarden, bedoeld in het
      eerste lid, onderdelen a tot en met i, en de afwijzingsgronden, bedoeld in het tweede lid. Onze Minister is niet
      verplicht om advies te vragen indien de referent erkend is of indien de verblijfsvergunning wordt geweigerd of
      ingetrokken op grond van het eerste lid, onder j, k of l.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.30d
  - number: 3.31.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder de beperking «arbeid in loondienst» worden verleend
      indien geen afwijzingsgrond van toepassing is uit [artikel 16 van de Wet][ref1] en de [artikelen 8][ref2] en
      [9 van de Wet arbeid vreemdelingen][ref3], tenzij het seizoenarbeid betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007149
        artikel: '9'
  - number: 3.31.2
    text: |-
      In aanvulling op het eerste lid, wordt de verblijfsvergunning slechts verleend aan de vreemdeling die arbeid
      voor een religieuze of levensbeschouwelijke organisatie verricht of wil verrichten, indien de referent, voor
      zover vereist op grond van de [Handelsregisterwet 2007][ref1], is ingeschreven in het handelsregister, bedoeld in
      [artikel 2 van die wet][ref2], en haar solvabiliteit, continuïteit en betrouwbaarheid naar het oordeel van Onze
      Minister voldoende is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0021777
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0021777
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 3.31.3
    text: |-
      De aanvraag van een langdurig ingezetene wordt niet afgewezen op grond van
      [artikel 16, eerste lid, onder e of k, van de Wet][ref1]. Onze Minister wijst de hoofdpersoon als referent aan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.31.4
    text: 'De verblijfsvergunning kan voorts worden verleend, aan de vreemdeling die:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.31
  - number: 3.31.4.a
    text: |-
      een arbeidsverleden aan boord van een zeeschip dat op grond van voor Nederland geldende rechtsregels gerechtigd is
      de vlag van het Koninkrijk te voeren of op een mijnbouwinstallatie op het continentaal plat heeft van ten minste
      zeven jaar;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.31
  - number: 3.31.4.b
    text: |-
      gedurende ten minste nog een jaar beschikt over een arbeidsplaats aan boord van een schip dat op grond
      van voor Nederland geldende rechtsregels gerechtigd is de vlag van het Koninkrijk te voeren of op een
      mijnbouwinstallatie op het continentaal plat, waarmee hij duurzaam voldoende middelen van bestaan als bedoeld in
      [artikel 3.74, eerste lid, onder a][ref1], verwerft.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.31.5
    text: In andere gevallen dan bedoeld in het eerste en vierde lid, kan de verblijfsvergunning worden verleend.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.31
  - number: 3.31.6
    text: |-
      De verblijfsvergunning kan voorts worden verleend aan een vreemdeling indien is voldaan aan het gestelde bij en
      krachtens [artikel 2.7 van het Besluit uitvoering Wet arbeid vreemdelingen 2022][ref1], tenzij een afwijzingsgrond
      uit [artikel 16 van de Wet][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.31a.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder een beperking, verband houdend
      met werkzaamheid in het kader van grensoverschrijdende dienstverlening als bedoeld in
      [artikel 4.6 van het Besluit uitvoering Wet arbeid vreemdelingen 2022][ref1], worden verleend indien
      de in [artikel 8 van de Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref2]
      bedoelde melding is gedaan, onder verstrekking van de in dat artikel en de in
      [artikel 11, derde lid, van het Besluit arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref3]
      voorgeschreven gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0038054#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0038821#Artikel11
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.31a
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0038054
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0038821
        artikel: '11'
  - number: 3.31a.2
    text: |-
      De aanvraag, bedoeld in het eerste lid, wordt niet afgewezen op de gronden, bedoeld in
      [artikel 16, eerste lid, onder c, e en k, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.31a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.31b
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder een beperking verband houdend met het zoeken naar en
      verrichten van arbeid al dan niet in loondienst in Nederland worden verleend aan de vreemdeling op wie artikel 13
      van Associatiebesluit nr. 1/80 van de Associatieraad EEG-Turkije betreffende de ontwikkeling van de Associatie van
      toepassing is, indien:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.31b
  - number: 3.31b.a
    text: |-
      diens huwelijk of geregistreerd partnerschap met een hoofdpersoon met niet-tijdelijk verblijfsrecht na drie jaar is
      ontwricht of ontbonden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.31b
  - number: 3.31b.b
    text: de vreemdeling op grond van dat huwelijk of geregistreerd partnerschap was toegelaten, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.31b
  - number: 3.31b.c
    text: |-
      de vreemdeling één jaar direct voorafgaande aan ontwrichting van het huwelijk of geregistreerd partnerschap
      rechtmatig verblijf had als bedoeld in [artikel 8, onder a, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.31b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3.32'
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd wordt niet verleend onder een beperking verband houdend met het
      verrichten van arbeid als zelfstandige of in loondienst, waaronder begrepen verblijf als houder van de Europese
      blauwe kaart, indien die arbeid geheel of gedeeltelijk bestaat uit het verrichten van seksuele handelingen met
      derden of het verlenen van seksuele diensten aan derden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.32
  - number: 3.33.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd wordt onder een beperking verband houdend met onderzoek in de
      zin van richtlijn (EU) 2016/801 verleend aan de onderzoeker in de zin van artikel 3, onder 2, van die richtlijn,
      die op grond van een gastovereenkomst als bedoeld in artikel 10 van die richtlijn met de bij ministeriële
      regeling genoemde gegevens, onderzoek in de zin van die richtlijn verricht of gaat verrichten aan een krachtens
      [artikel 2c van de Wet][ref1] als referent erkende onderzoeksinstelling in de zin van die richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
  - number: 3.33.2
    text: 'De in het eerste lid bedoelde verblijfsvergunning wordt verleend, indien:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.33
  - number: 3.33.2.a
    text: |-
      de vreemdeling beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel
      waarvoor de vreemdeling in Nederland wil verblijven, of behoort tot één van de in [artikel 17 van de Wet][ref1] of
      in [artikel 3.71, tweede lid][ref2], bedoelde categorieën;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.33.2.b
    text: |-
      de vreemdeling beschikt over een geldig document voor grensoverschrijding, of naar het oordeel van Onze Minister
      heeft aangetoond dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in het bezit
      van een geldig document voor grensoverschrijding kan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.33
  - number: 3.33.2.c
    text: |-
      de vreemdeling bereid is een onderzoek naar of behandeling voor tuberculose te ondergaan en daaraan mee te werken
      of de nationaliteit bezit van een van de bij ministeriële regeling vast te stellen landen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.33
  - number: 3.33.2.d
    text: |-
      de vreemdeling geen gevaar vormt voor de openbare orde als bedoeld in de [artikelen 3.77][ref1] en [3.78][ref2] of
      de nationale veiligheid;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.33.2.e
    text: |-
      de onderzoeksinstelling krachtens [artikel 2c van de Wet][ref1] als referent is erkend en ten behoeve van het
      verblijf van de vreemdeling een verklaring als bedoeld in [artikel 2a, tweede lid, van de Wet][ref2] heeft
      afgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2a
  - number: 3.33.2.f
    text: |-
      van de te vervullen arbeidsplaats de arbeidsvoorwaarden, arbeidsverhoudingen of arbeidsomstandigheden ten minste
      liggen op het niveau dat wettelijk is vereist en in de desbetreffende bedrijfstak gebruikelijk is;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.33
  - number: 3.33.2.g
    text: |-
      de vreemdeling duurzaam en zelfstandig beschikt over voldoende middelen van bestaan als bedoeld in
      [artikel 3.74, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.33.2.h
    text: |-
      Onze Minister geen bewijs of ernstige en objectieve redenen heeft om vast te stellen dat het verblijf van de
      vreemdeling andere doelen dient of zou dienen dan onderzoek in de zin van richtlijn (EU) 2016/801.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.33
  - number: 3.33.3
    text: |-
      De aanvraag wordt niet afgewezen op de grond dat de onderzoeksinstelling niet krachtens
      [artikel 2c van de Wet][ref1] als referent is erkend of ten behoeve van het verblijf van de vreemdeling geen
      verklaring als bedoeld in [artikel 2a, tweede lid, van de Wet][ref2] heeft afgelegd, indien de vreemdeling de
      Turkse nationaliteit heeft. In dat geval wordt de onderzoeksinstelling niet als referent aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2a
  - number: 3.33.4
    text: |-
      De aanvraag wordt afgewezen indien gelijktijdig de aanmelding, bedoeld in [artikel 4.47][ref1], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '3'
  - number: '3.39'
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder een beperking verband houdend met lerend werken worden
      verleend aan de vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.39
  - number: 3.39.a
    text: |-
      die in Nederland relevante werkervaring verwerft of wil verwerven in het kader van diens arbeid of studie buiten
      Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.39
  - number: 3.39.b
    text: |-
      bij wie geen afwijzingsgrond van toepassing is uit [artikel 16 van de Wet][ref1] en [artikel 8][ref2] en
      [9 van de Wet arbeid vreemdelingen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel9
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.39
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007149
        artikel: '9'
  - number: 3.39.c
    text: |-
      bij wie Onze Minister geen bewijs of ernstige en objectieve redenen heeft om vast te stellen dat het verblijf
      andere doelen dient of zou dienen dan lerend werken, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.39
  - number: 3.39.d
    text: die voldoet aan bij ministeriële regeling gestelde nadere voorwaarden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.39
  - number: 3.40.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan worden verleend onder een beperking verband houdend met
      verblijf als niet-geprivilegieerd militair of niet-geprivilegieerd burgerpersoneel aan:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.40
  - number: 3.40.1.a
    text: |-
      de militair die in Nederland woonachtig is en die niet behoort tot een in Nederland gelegerde of op doortocht
      zijnde krijgsmacht en evenmin verbonden is aan een hier te lande gevestigd internationaal militair hoofdkwartier en
      niet geprivilegieerd is;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.40
  - number: 3.40.1.b
    text: |-
      de vreemdeling die behoort tot het burgerpersoneel, die in Nederland woont en die in dienst is van een krijgsmacht
      of van een internationaal militair hoofdkwartier.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.40
  - number: 3.40.2
    text: |-
      De aanvraag wordt niet afgewezen op de grond, bedoeld in [artikel 16, eerste lid, onderdeel k, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.41.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder een beperking verband houdend met studie
      worden verleend aan de vreemdeling, die aan een krachtens [artikel 2c van de Wet][ref1] als referent erkende
      onderwijsinstelling is of zal worden ingeschreven en aan die instelling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.41
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
  - number: 3.41.1.a
    text: |-
      voltijdshoger of wetenschappelijk onderwijs volgt of gaat volgen dat is geaccrediteerd of beoordeeld in de vorm van
      de toets nieuwe opleiding, dan wel zich op dat onderwijs voorbereidt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.41
  - number: 3.41.1.b
    text: |-
      voltijds voortgezet onderwijs of beroepsonderwijs volgt of gaat volgen, waarvoor Nederland naar het oordeel
      van Onze Minister het meest aangewezen land is en waarmee de vreemdeling naar het oordeel van Onze Minister een
      positieve bijdrage kan leveren aan de ontwikkeling van het land van herkomst, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.41
  - number: 3.41.1.c
    text: |-
      een bij regeling van Onze Minister na overleg met Onze Minister die het aangaat aangewezen opleiding of studie
      volgt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.41
  - number: 3.41.2
    text: |-
      De verblijfsvergunning wordt slechts verleend indien Onze Minister geen bewijs of ernstige en objectieve redenen
      heeft om vast te stellen dat het verblijf van de vreemdeling andere doelen dient of zou dienen dan studie in de zin
      van richtlijn (EU) 2016/801.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.41
  - number: 3.41.3
    text: |-
      De aanvraag wordt niet afgewezen op de grond dat het geen voltijds onderwijs betreft, indien de vreemdeling een
      langdurig ingezetene is en hoger onderwijs of beroepsonderwijs volgt of wil volgen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.41
  - number: 3.42.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan worden verleend onder een beperking verband houdend met
      het zoeken naar en verrichten van arbeid al dan niet in loondienst aan een vreemdeling die in de drie jaar direct
      voorafgaand aan de aanvraag:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.42
  - number: 3.42.1.a
    text: |-
      aan een Nederlandse instelling voor hoger onderwijs met goed gevolg een geaccrediteerde bachelor- of
      masteropleiding heeft afgerond;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.42
  - number: 3.42.1.b
    text: |-
      wetenschappelijk onderzoek heeft verricht op basis van een verblijfsvergunning regulier voor bepaalde tijd onder de
      beperking onderzoek in de zin van richtlijn (EU) 2016/801 of onder de beperking arbeid als kennismigrant;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.42
  - number: 3.42.1.c
    text: in Nederland een postdoctorale opleiding van ten minste twaalf maanden heeft afgerond;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.42
  - number: 3.42.1.d
    text: |-
      een opleiding heeft afgerond in het kader van de [Wet op het specifiek cultuurbeleid][ref1] of een opleiding die
      wordt verzorgd in het kader van het ontwikkelingssamenwerkingsbeleid van het Ministerie van Buitenlandse Zaken of
      een Erasmus Mundus Masters Course heeft afgerond;


      [ref1]: https://wetten.overheid.nl/BWBR0005904
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0005904
  - number: 3.42.1.e
    text: |-
      aan een bij ministeriële regeling aangewezen buitenlandse onderwijsinstelling een masteropleiding of een
      postdoctorale opleiding van ten minste twaalf maanden heeft afgerond of is gepromoveerd en:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.42
  - number: 3.42.1.e.1°
    text: een minimale score heeft behaald van 6.0 bij het International English Language Testing System,
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.42
  - number: 3.42.1.e.2°
    text: |-
      een vergelijkbare minimale score heeft behaald in een Engelse taaltest zoals opgenomen in de Gedragscode
      internationale student hoger onderwijs,
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.42
  - number: 3.42.1.e.3°
    text: |-
      beschikt over een diploma, certificaat of ander document als bedoeld in
      [artikel 4, eerste lid, onderdeel b, van de Wet inburgering 2021][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel4
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '4'
  - number: 3.42.1.e.4°
    text: |-
      beschikt over een diploma, certificaat of document als bedoeld in
      [artikel 2.3, eerste lid, van het Besluit inburgering][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.42.1.e.5°
    text: zijn masteropleiding of postdoctorale opleiding heeft genoten in het Engels of het Nederlands;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.42
  - number: 3.42.1.f
    text: een bij ministeriële regeling aangewezen hoger onderwijsopleiding heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.42
  - number: 3.42.2
    text: |-
      De verblijfsvergunning wordt niet opnieuw verleend indien de vreemdeling op grond van het afronden van diezelfde
      opleiding of het verrichten van datzelfde onderzoek eerder houder is geweest van een verblijfsvergunning onder een
      beperking verband houdend met het zoeken naar en verrichten van arbeid al dan niet in loondienst.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.42
  - number: 3.42.3
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder k, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.43.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder een beperking verband houdend met uitwisseling worden
      verleend aan de vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.43
  - number: 3.43.1.a
    text: |-
      die tijdelijk in Nederland verblijft of wil verblijven in het kader van een door Onze Minister na overleg
      met Onze Minister van Sociale Zaken en Werkgelegenheid goedgekeurd uitwisselingsprogramma van een krachtens
      [artikel 2c van de Wet][ref1] als referent erkende uitwisselingsorganisatie;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.43
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
  - number: 3.43.1.b
    text: die voldoet aan de bij ministeriële regeling te stellen leeftijdseisen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.43
  - number: 3.43.1.c
    text: die niet eerder houder is geweest van een verblijfsvergunning onder een beperking verband houdend met uitwisseling;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.43
  - number: 3.43.1.d
    text: wiens tijdige vertrek uit Nederland naar het oordeel van Onze Minister redelijkerwijs is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.43
  - number: 3.43.2
    text: |-
      De aanvraag wordt niet afgewezen op de grond, bedoeld in het eerste lid, onder a, indien er sprake is van
      werkzaamheden in het kader van een Working Holiday Scheme of een Working Holiday Programme, dat in een memorandum
      van overeenstemming is goedgekeurd door Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.43
  - number: 3.43.3
    text: 'Bij ministeriële regeling kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.43
  - number: 3.43.3.a
    text: de uitwisselingsprogramma’s, bedoeld in het eerste lid, onder a;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.43
  - number: 3.43.3.b
    text: de verlening van de verblijfsvergunning ter uitvoering van internationale verplichtingen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.43
  - number: 3.43.4
    text: |-
      De aanvraag wordt niet afgewezen op de gronden, bedoeld in het eerste lid, onder c en d, indien de vreemdeling
      Europees Vrijwilligerswerk gaat verrichten op grond van de overeenkomst als bedoeld in artikel 14, eerste lid,
      onder a, van richtlijn (EU) 2016/801. De verblijfsvergunning wordt slechts verleend indien Onze Minister geen
      bewijs of ernstige en objectieve redenen heeft om vast te stellen dat het verblijf van de vreemdeling andere doelen
      dient of zou dienen dan Europees Vrijwilligerswerk.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.43
  - number: 3.46.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder een beperking verband houdend met het ondergaan van
      medische behandeling worden verleend, indien Nederland naar het oordeel van Onze Minister het meest aangewezen land
      is voor het ondergaan van een noodzakelijke medische behandeling en de financiering van die medische behandeling
      naar het oordeel van Onze Minister deugdelijk is geregeld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.46
  - number: 3.46.2
    text: |-
      De verblijfsvergunning, bedoeld in het eerste lid, kan voorts worden verleend aan de vreemdeling van Surinaamse
      nationaliteit, die op medische indicatie en in het bezit van een daartoe afgegeven visum naar Nederland is gekomen,
      indien voortzetting van de medische behandeling in Nederland zes maanden na zijn inreis medisch noodzakelijk is en
      de financiering daarvan naar het oordeel van Onze Minister deugdelijk is geregeld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.46
  - number: 3.46.3
    text: |-
      De vreemdeling ondertekent een medische verklaring, ertoe strekkende dat hij toestemming verleent voor medisch
      onderzoek, voor zover dat onderzoek noodzakelijk is voor de toepassing van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.46
  - number: 3.46.4
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder k, van de Wet][ref1]. De aanvraag
      wordt evenmin afgewezen op grond van artikel 16, eerste lid, onder c, en evenmin op het feit dat de financiering
      van de medische behandeling niet deugdelijk is geregeld, indien de vreemdeling ten minste een jaar direct
      voorafgaande aan de aanvraag rechtmatig verblijf als bedoeld in [artikel 8, onder j, van de Wet][ref2] heeft gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.46
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.48.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder een beperking verband houdend met tijdelijke
      humanitaire gronden worden verleend aan de vreemdeling die:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.48
  - number: 3.48.1.a
    text: |-
      slachtoffer-aangever is van mensenhandel, voor zover er sprake is van een strafrechtelijk opsporingsonderzoek
      of vervolgingsonderzoek naar of berechting in feitelijke aanleg van de verdachte van het strafbare feit waarvan
      aangifte is gedaan;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.48
  - number: 3.48.1.b
    text: |-
      slachtoffer is van mensenhandel, voor zover er sprake is van een strafrechtelijk opsporingsonderzoek of
      vervolgingsonderzoek naar of berechting in feitelijke aanleg van de verdachte van het strafbare feit, bedoeld in
      [artikel 273f van het Wetboek van Strafrecht][ref1], en het slachtoffer hieraan op andere wijze dan door het doen
      van aangifte medewerking verleent;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel273f
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.48
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 273f
  - number: 3.48.1.c
    text: |-
      getuige-aangever is van mensenhandel, voor zover er sprake is van een strafrechtelijk opsporingsonderzoek of
      vervolgingsonderzoek naar of berechting in feitelijke aanleg van de verdachte van het strafbare feit waarvan
      aangifte is gedaan en het verblijf in Nederland van de getuige-aangever naar het oordeel van Onze Minister in het
      belang van de opsporing of vervolging van de verdachte noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.48
  - number: 3.48.1.d
    text: |-
      zonder verblijfstitel slachtoffer is geworden van mensenhandel en hiervan om zwaarwegende redenen geen aangifte kan
      of wil doen of anderszins geen medewerking kan of wil verlenen aan de strafrechtelijke opsporing en vervolging van
      de mensenhandelaar;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.48
  - number: 3.48.1.e
    text: zonder verblijfstitel slachtoffer is geworden of dreigt te worden van eergerelateerd geweld;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.48
  - number: 3.48.1.f
    text: zonder verblijfstitel slachtoffer is geworden of dreigt te worden van huiselijk geweld; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.48
  - number: 3.48.1.g
    text: |-
      zonder verblijfstitel slachtoffer is geworden van arbeidsgerelateerde uitbuiting, dan wel als minderjarige
      zonder verblijfstitel is tewerkgesteld, voor zover er sprake is van een strafrechtelijk opsporingsonderzoek
      of vervolgingsonderzoek naar of berechting in feitelijke aanleg van de voormalig werkgever en de
      vreemdeling hieraan medewerking verleent, of, indien dat opsporings- of vervolgingsonderzoek reeds
      is afgerond, voor zover sprake is van een loonvorderingsprocedure bij de kantonrechter als bedoeld in
      [artikel 23, vijfde lid, van de Wet arbeid vreemdelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel23
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.48
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '23'
  - number: 3.48.2
    text: 'De verblijfsvergunning kan voorts worden verleend aan:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.48
  - number: 3.48.2.a
    text: vreemdelingen die buiten hun schuld niet uit Nederland kunnen vertrekken, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.48
  - number: 3.48.2.b
    text: |-
      aan bij ministeriële regeling aangewezen categorieën vreemdelingen, anders dan bedoeld in het eerste lid en het
      tweede lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.48
  - number: 3.48.3
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder c of k, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.48
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.48.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.48
  - number: 3.49.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan worden verleend onder een beperking
      verband houdend methet afwachten van een beslissing op een verzoek als bedoeld in
      [artikel 17 van de Rijkswet op het Nederlanderschap][ref1] aan de in Nederland verblijvende vreemdeling die bij de
      rechtbank Den Haag een verzoek heeft ingediend tot vaststelling van zijn Nederlanderschap, indien dat verzoek naar
      het oordeel van Onze Minister niet klaarblijkelijk van elke grond is ontbloot.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel17
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.49
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '17'
  - number: 3.49.2
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder b, c en k, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.49
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.50.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd wordt onder een beperking verband houdend met niet-tijdelijke
      humanitaire gronden verleend aan de vreemdeling die:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.50
  - number: 3.50.1.a
    text: |-
      als minderjarige houder is geweest van een verblijfsvergunning onder een beperking verband houdend met verblijf
      als familie- of gezinslid van een Nederlander of een vreemdeling met niet-tijdelijk verblijfsrecht in de zin van
      [artikel 3.5][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.50
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.50.1.b
    text: |-
      langer dan een jaar houder is geweest van de in onderdeel a bedoelde verblijfsvergunning, dan wel in Nederland is
      geboren uit ouders met niet-tijdelijk verblijfsrecht in de zin van [artikel 3.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.50
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.50.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder persoon met niet-tijdelijk verblijfsrecht niet verstaan de houder
      van de verblijfsvergunning asiel voor bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.50
  - number: 3.50.3
    text: 'De verblijfsvergunning wordt verleend, tenzij:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.50
  - number: 3.50.3.a
    text: |-
      de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden die tot afwijzing van de
      oorspronkelijke aanvraag tot het verlenen zouden hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.50
  - number: 3.50.3.b
    text: de vreemdeling een gevaar voor de nationale veiligheid vormt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.50
  - number: 3.50.3.c
    text: |-
      de aanvraag met toepassing van de [artikelen 3.86][ref1] of [3.87][ref2] kan worden afgewezen, of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.50
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.50.3.d
    text: de vreemdeling het hoofdverblijf buiten Nederland heeft verplaatst.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.50
  - number: 3.50.4
    text: |-
      Indien een van de ouders in Nederland is gevestigd en de Nederlandse nationaliteit heeft, wordt de
      verblijfsvergunning aan de minderjarige vreemdeling verleend, tenzij de vreemdeling onjuiste gegevens heeft
      verstrekt dan wel gegevens heeft achtergehouden die tot afwijzing van de oorspronkelijke aanvraag tot het verlenen
      zouden hebben geleid, of de vreemdeling het hoofdverblijf buiten Nederland heeft verplaatst.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.50
  - number: 3.51.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder een beperking, verband houdend met niet-tijdelijke
      humanitaire gronden worden verleend aan de vreemdeling, die:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.1.a
    text: |-
      vijf jaar in Nederland verblijft als houder van een verblijfsvergunning onder de beperking, genoemd onder 1°, of
      drie jaar in Nederland verblijft onder een beperking, genoemd onder 2° of 3°:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.1.a.1°
    text: verblijf als familie- of gezinslid van een persoon met een niet-tijdelijk verblijfsrecht;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.1.a.2°
    text: |-
      medische behandeling, voor zover die medische behandeling naar het oordeel van Onze Minister gedurende ten minste
      nog één jaar in Nederland noodzakelijk zal zijn;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.1.a.3°
    text: tijdelijke humanitaire gronden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.1.b
    text: |-
      nadat zijn uitzetting op grond van [artikel 64 van de Wet][ref1] gedurende een jaar achterwege is gebleven, twee
      jaar in Nederland verblijft als houder van een verblijfsvergunning onder een beperking verband houdend metmedische
      behandeling, voor zover die medische behandeling naar het oordeel van Onze Minister gedurende ten minste nog één
      jaar in Nederland noodzakelijk zal zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '64'
  - number: 3.51.1.c
    text: |-
      houder is geweest van een verblijfsvergunning onder een beperking verband houdend met verblijf als familie- of
      gezinslid van een persoon met een niet-tijdelijk verblijfsrecht, indien de relatie tussen de vreemdeling en die
      persoon door het overlijden van die persoon is verbroken;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.1.d
    text: een in Nederland geboren en getogen oud-Nederlander is;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.1.e
    text: |-
      een meerderjarige, buiten Nederland geboren oud-Nederlander is, voor zover deze in een ander land woont dan dat
      waarvan hij onderdaan is en naar het oordeel van Onze Minister bijzondere banden heeft met Nederland;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.1.f
    text: 'minderjarig is, voor zover in diens opvang en wettelijke vertegenwoordiging in Nederland is voorzien en die:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.1.f.1°
    text: |-
      tien jaren rechtmatig in Nederland heeft verbleven als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], of als Nederlander, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.51.1.f.2°
    text: |-
      vóór indiening van de aanvraag vijf jaren rechtmatig in Nederland heeft verbleven als bedoeld in
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1], of als Nederlander, voor zover Nederland naar het
      oordeel van Onze Minister het meest aangewezen land is voor de vreemdeling;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.51.1.g
    text: |-
      in aanmerking komt voor de terugkeeroptie op grond van [artikel 8 van de Remigratiewet][ref1], mits hij niet eerder
      gebruik heeft gemaakt van de terugkeeroptie, zijn aanvraag tot wedertoelating is ontvangen binnen één jaar na de
      remigratie uit Nederland en hij direct voorafgaande aan de remigratie:


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '8'
  - number: 3.51.1.g.1°
    text: |-
      als remigrant uit Nederland was geremigreerd op grond van de [Remigratiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010424
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0010424
  - number: 3.51.1.g.2°
    text: |-
      als meeremigerende partner van de remigrant gedurende drie achtereenvolgende jaren rechtmatig verblijf had als
      bedoeld in [artikel 8 van de Wet][ref1] of als Nederlander;


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '8'
  - number: 3.51.1.g.3°
    text: |-
      als meeremigrerend minderjarig kind van de remigrant rechtmatig verblijf had als bedoeld in
      [artikel 8 van de Wet][ref1] of als Nederlander, ongeacht de duur daarvan, en tegelijkertijd met die remigrant om
      wedertoelating verzoekt, of


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '8'
  - number: 3.51.1.g.4°
    text: |-
      als meeremigrerend minderjarig kind van de remigrant rechtmatig verblijf had als bedoeld in
      [artikel 8 van de Wet][ref1] of als Nederlander, ongeacht de duur daarvan, en zelfstandig om wedertoelating
      verzoekt indien hij binnen een jaar na remigratie meerderjarig is geworden;


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '8'
  - number: 3.51.1.h
    text: |-
      ten minste één jaar in het bezit is geweest van een verblijfsvergunning als slachtoffer van mensenhandel die
      hiervan om zwaarwegende redenen geen aangifte kan of wil doen of anderszins geen medewerking kan of wil verlenen
      aan de strafrechtelijke opsporing en vervolging van de mensenhandelaar;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.1.i
    text: |-
      ten minste één jaar in het bezit is geweest van een verblijfsvergunning als slachtoffer van eergerelateerd geweld
      of dreigend eergerelateerd geweld als bedoeld in [artikel 3.48, eerste lid, onder e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.51.1.j
    text: |-
      ten minste één jaar in het bezit is geweest van een verblijfsvergunning als slachtoffer van huiselijk geweld of
      dreigend huiselijk geweld als bedoeld in [artikel 3.48, eerste lid, onder f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.51.2
    text: |-
      In afwijking van het eerste lid, aanhef en onder a, ten eerste, kan de verblijfsvergunning eveneens worden
      verleend, indien de vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.2.a
    text: |-
      onmiddellijk voorafgaand aan de indiening van de aanvraag twee jaar rechtmatig verblijf in Nederland als bedoeld
      in [artikel 8, onder a, van de Wet][ref1] heeft gehad als gezinslid van een houder van een door Onze Minister
      afgegeven Europese blauwe kaart, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.51.2.b
    text: |-
      op het tijdstip waarop de aanvraag is ontvangen of de beschikking wordt gegeven, als gezinslid van de in onderdeel
      a bedoelde houder van de Europese blauwe kaart ten minste vijf jaar legaal en ononderbroken verblijf heeft gehad op
      het grondgebied van een staat die partij is bij het Verdrag betreffende de werking van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.3
    text: |-
      In afwijking van het eerste lid, aanhef en onder a, ten eerste, kan de verblijfsvergunning eveneens worden
      verleend, indien de vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.3.a
    text: |-
      onmiddellijk voorafgaand aan de indiening van de aanvraag twee jaar rechtmatig verblijf in Nederland als bedoeld
      in [artikel 8, onder a, van de Wet][ref1] heeft gehad als gezinslid van een langdurig ingezetene met de aantekening
      «voormalig houder van een Europese blauwe kaart», en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.51.3.b
    text: |-
      op het tijdstip waarop de aanvraag is ontvangen of de beschikking wordt gegeven, als gezinslid van de in onderdeel
      a bedoelde houder van de Europese blauwe kaart ten minste vijf jaar legaal en ononderbroken verblijf heeft gehad op
      het grondgebied van een staat die partij is bij het Verdrag betreffende de werking van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.4
    text: |-
      De verblijfsvergunning kan voorts worden verleend aan bij ministeriële regeling aangewezen categorieën
      vreemdelingen, anders dan bedoeld in het eerste en tweede lid. In de ministeriële regeling kunnen hierover nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.5
    text: |-
      De aanvraag wordt niet afgewezen op grond van [artikel 16, eerste lid, onder c en k, van de Wet][ref1]. De aanvraag
      wordt evenmin afgewezen op grond van artikel 16, eerste lid, onder b, van de Wet, indien de aanvraag is ingediend
      door de in het eerste lid, onder d, bedoelde vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.51.6
    text: |-
      [Artikel 3.80a][ref1] is van toepassing op de in het eerste lid, onderdeel a, ten eerste, en tweede lid bedoelde
      vreemdelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.51.7
    text: |-
      Voor zover sprake is van verlening van de verblijfsvergunning, zijn de [artikelen 3.77][ref1] en [3.78][ref2] niet
      van toepassing en zijn de [artikelen 3.86][ref3] en [3.87][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.51.8
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, ten eerste, en onderdeel c, wordt onder persoon met een niet-
      tijdelijk verblijfsrecht niet verstaan de houder van de verblijfsvergunning asiel voor bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.9
    text: |-
      De vergunning onder de beperking, verband houdend met niet-tijdelijke humanitaire gronden, kan voorts worden
      verleend aan de vreemdeling op wie artikel 13 van Associatiebesluit nr. 1/80 van de Associatieraad EEG-Turkije
      betreffende de ontwikkeling van de Associatie van toepassing is, indien:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
  - number: 3.51.9.a
    text: |-
      aan hem de in [artikel 3.31b][ref1] bedoelde vergunning is verleend en hij uiterlijk op het moment waarop de
      geldigheidsduur van die vergunning verstrijkt, beschikt over een arbeidsplaats voor nog een jaar waarmee hij
      zelfstandig en duurzaam voldoende middelen van bestaan als bedoeld in de [artikelen 3.73 tot en met 3.75][ref2]
      verwerft, of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
