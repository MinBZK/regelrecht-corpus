    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de toepassing van het eerste lid, onder a, en het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.91b
  - number: 3.91c.1
    text: |-
      De Europese blauwe kaart kan worden ingetrokken op de in [artikel 3.89b, eerste lid][ref1], genoemde gronden. Het
      tweede tot en met vierde lid van dat artikel zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.91c
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.91c.2
    text: |-
      In afwijking van het eerste lid, wordt de Europese blauwe kaart niet ingetrokken indien de houder bij een andere
      staat die Partij is bij het Verdrag betreffende de werking van de Europese Unie een aanvraag heeft gedaan voor
      een Europese blauwe kaart en nog geen besluit op deze aanvraag is genomen, met uitzondering van de situatie dat
      intrekking plaatsvindt op grond van het overleggen van documenten die op frauduleuze wijze zijn verkregen, zijn
      vervalst of op ongeoorloofde wijze zijn gewijzigd of vanwege redenen die verband houden met de openbare orde, de
      openbare veiligheid of de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.91c
  - number: 3.91d.1
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd die is verleend onder een beperking verband houdend met
      seizoenarbeid, lerend werken of arbeid in loondienst, arbeid als kennismigrant, verblijf als houder van de
      Europese blauwe kaart, onderzoek in de zin van richtlijn (EU) 2016/801 wordt niet ingetrokken op de grond dat de
      werkgever niet krachtens [artikel 2c van de Wet][ref1] als referent is erkend of ten behoeve van het verblijf van
      de vreemdeling geen verklaring als bedoeld in [artikel 2a, tweede lid, van de Wet][ref2] heeft afgelegd, indien de
      vreemdeling de Turkse nationaliteit heeft, in welk geval de werkgever niet als referent wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.91d
