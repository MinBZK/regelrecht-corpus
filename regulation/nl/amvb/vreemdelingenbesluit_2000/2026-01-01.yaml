      - id: ref2
        bwb_id: BWBR0011825
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 3.115.2.f
    text: |-
      indien Onze Minister een medisch onderzoek heeft aangeboden als bedoeld in [artikel 3.109e][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.115.2.g
    text: |-
      indien de vreemdeling niet is verschenen bij een gehoor, dan wel is verdwenen of vertrokken zonder toestemming van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
  - number: 3.115.3
    text: |-
      In de gevallen, bedoeld in het eerste lid, wordt de in [artikel 3.110, eerste lid][ref1], genoemde termijn verlengd
      met drie dagen: een extra dag voor het nader gehoor, een extra dag voor de correcties en aanvullingen gedurende
      welke dag Onze Minister reeds een aanvang kan maken met het voornemen, en een extra dag voor het opstellen van
      de zienswijze. In de gevallen bedoeld in het tweede lid wordt de in artikel 3.110, eerste lid, genoemde termijn
      verlengd met ten hoogste twaalf, veertien, of twintig dagen. Indien verlenging op grond van zowel het eerste, als
      het tweede lid plaatsvindt, zijn voor het onderzoek in een Aanmeldcentrum ten hoogste eenentwintig, drieëntwintig
      of negenentwintig dagen beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.115.4
    text: |-
      De vreemdeling wordt van de verlenging schriftelijk in kennis gesteld. Bij de kennisgeving wordt de reden van de
      verlenging aangegeven alsmede op welk moment de verlengde termijn eindigt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
  - number: 3.115.5
    text: |-
      Indien Onze Minister de in [artikel 3.110, eerste lid][ref1], genoemde termijn heeft verlengd wordt het
      schriftelijk voornemen aan de vreemdeling uitgereikt of toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.115.6
    text: |-
      De vreemdeling brengt zijn zienswijze uiterlijk op de eerste dag, of bij toepassing van het eerste lid op de
      tweede dag, na de uitreiking of toezending van het voornemen naar voren, tenzij een met redenen omkleed verzoek om
      verlenging van deze termijn wordt ingewilligd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
  - number: 3.115.7
    text: |-
      [Artikel 3.114, derde tot en met vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.115.8
    text: |-
      Indien er sprake is van een situatie als bedoeld in het eerste lid, maakt Onze Minister de beschikking uiterlijk op
      de negende dag bekend door uitreiking of toezending ervan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
  - number: 3.115.9
    text: |-
      Indien er sprake is van een situatie als bedoeld in het tweede lid, onderdeel a tot en met e, maakt Onze Minister
      de beschikking uiterlijk op de achttiende dag bekend door uitreiking of toezending ervan. Indien er sprake is
      van een situatie als bedoeld in het tweede lid, onderdeel f, maakt Onze Minister de beschikking uiterlijk op de
      twintigste dag bekend door uitreiking of toezending ervan. Indien er sprake is van een situatie als bedoeld in
      het tweede lid, onderdeel g, maakt Onze Minister de beschikking uiterlijk op de zesentwintigste dag bekend door
      uitreiking of toezending ervan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
  - number: 3.115.10
    text: |-
      Indien er sprake is van een situatie als bedoeld in het eerste en tweede lid, maakt Onze Minister de beschikking
      uiterlijk op de eenentwintigste, drieëntwintigste of negenentwintigste dag bekend door uitreiking of toezending
      ervan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
  - number: 3.115.11
    text: |-
      Bij ministeriële regeling kunnen nadere regels gesteld worden omtrent de toepassing van het eerste
      en tweede lid alsmede de wijze waarop het onderzoek naar de aanvraag wordt vervolgd indien de in
      [artikel 3.110, eerste lid][ref1], genoemde termijn wordt verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.116.1
    text: 'Het schriftelijke voornemen om:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.116
  - number: 3.116.1.a
    text: |-
      de aanvraag tot het verlenen van de verblijfsvergunning asiel voor bepaalde tijd af te wijzen indien de termijnen,
      bedoeld in de [artikelen 3.113, eerste en derde lid][ref1], of [3.114, eerste en zesde lid][ref2], dan wel de op
      grond van [artikel 3.115, eerste of derde lid][ref3], verlengde termijn, zijn overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.116
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.116.1.b
    text: |-
      de aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning asiel voor bepaalde tijd af te
      wijzen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.116
  - number: 3.116.1.c
    text: |-
      de aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 8, onder d, van de Wet][ref1], af
      te wijzen, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.116
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.116.1.d
    text: |-
      een verblijfsvergunning als bedoeld in [artikel 8, onder c en d, van de Wet][ref1], in te trekken,


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.116
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.116.2
    text: |-
      De termijn waarbinnen de vreemdeling zijn zienswijze schriftelijk naar voren brengt bedraagt, tenzij een met
      redenen omkleed verzoek om verlenging van deze termijn wordt ingewilligd:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.116
  - number: 3.116.2.a
    text: 'in het geval, bedoeld in het eerste lid, onder a: vier weken, en'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.116
  - number: 3.116.2.b
    text: 'in de gevallen, bedoeld in het eerste lid, onder b, c en d: zes weken.'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.116
  - number: 3.116.3
    text: |-
      De termijn, bedoeld in het tweede lid, vangt aan met ingang van de dag na die waarop het voornemen is uitgereikt
      of toegezonden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.116
  - number: 3.116.4
    text: |-
      De schriftelijke zienswijze is tijdig bij Onze Minister ingediend, indien deze voor het einde van de termijn is
      ontvangen. Bij verzending per post is de zienswijze tijdig ingediend, indien deze voor het einde van de termijn ter
      post is bezorgd, mits deze niet later dan een week na afloop van de termijn is ontvangen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.116
  - number: 3.116.5
    text: De ontvangst van de schriftelijke zienswijze wordt door Onze Minister bevestigd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.116
  - number: 3.116.6
    text: |-
      Onze Minister houdt rekening met een na afloop van de termijn ontvangen schriftelijke zienswijze, indien de
      beschikking nog niet bekend is gemaakt. Met een na afloop van de termijn ontvangen aanvulling op een eerder
      ingediende schriftelijke zienswijze wordt rekening gehouden, indien de beschikking nog niet bekend is gemaakt en de
      afdoening van de zaak daardoor niet ontoelaatbaar wordt vertraagd. Het ontbreken van de schriftelijke zienswijze,
      na het verstrijken van de termijn waarbinnen de vreemdeling zijn zienswijze schriftelijk naar voren kan brengen,
      staat aan het geven van de beschikking niet in de weg.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.116
  - number: 3.117.1
    text: |-
      De termijnen, genoemd in de [artikelen 3.113, eerste, derde en vierde lid][ref1], en [3.114][ref2], zijn niet
      van toepassing op de aanvraag tot het verlenen van de verblijfsvergunning asiel voor bepaalde tijd van de
      vreemdeling aan wie rechtens zijn vrijheid is ontnomen op grond van [artikel 59b van de Wet][ref3] terwijl de
      vrijheidsontneming voortduurt, tenzij de aanvraag wordt behandeld in een Aanmeldcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.117
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 59b
  - number: 3.117.2
    text: |-
      De vreemdeling wordt door Onze Minister zo spoedig mogelijk aan een nader gehoor onderworpen, waarbij wordt voldaan
      aan het in [artikel 3.113, derde tot en met vijfde lid][ref1], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.117
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.117.3
    text: |-
      Het verslag van het nader gehoor vermeldt de termijn waarbinnen de vreemdeling in de gelegenheid wordt gesteld te
      voldoen aan het in [artikel 3.113, vierde lid][ref1], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.117
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.117.4
    text: |-
      Indien Onze Minister voornemens is de aanvraag af te wijzen, wordt het schriftelijk voornemen daartoe zo spoedig
      mogelijk uitgereikt of toegezonden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.117
  - number: 3.117.5
    text: De vreemdeling brengt zijn zienswijze binnen twee weken schriftelijk naar voren.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.117
  - number: 3.117.6
    text: |-
      De termijn, bedoeld in het vijfde lid, vangt aan met ingang van de dag na die waarop het voornemen is uitgereikt
      of toegezonden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.117
  - number: 3.117.7
    text: |-
      De schriftelijke zienswijze is tijdig bij Onze Minister ingediend, indien deze voor het einde van de termijn is
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.117
  - number: 3.117.8
    text: |-
      [Artikel 3.116, vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.117
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.117.9
    text: |-
      Indien de vreemdeling rechtens zijn vrijheid is ontnomen op grond van [artikel 59a][ref1], is
      [artikel 3.109c][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59a
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.117
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 59a
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.117.10
    text: |-
      Indien de vreemdeling rechtens zijn vrijheid is ontnomen, is [artikel 3.109ca][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.117
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.118.1
    text: 'Indien Onze Minister voornemens is om:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118
  - number: 3.118.1.a
    text: |-
      de aanvraag tot het verlenen van de verblijfsvergunning asiel voor bepaalde tijd af te wijzen na ommekomst van de
      in [artikel 3.110, eerste of tweede lid][ref1], genoemde termijn;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.118.1.b
    text: |-
      de aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning asiel voor bepaalde tijd af te
      wijzen, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118
  - number: 3.118.1.c
    text: |-
      de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 8, onder d, van de Wet][ref1], af
      te wijzen, terwijl de vreemdeling rechtens zijn vrijheid is ontnomen op grond van [artikel 6][ref2], [6a][ref3],
      [59a][ref4] of [59b van de Wet][ref5] en de vrijheidsontneming voortduurt, wordt het schriftelijk voornemen daartoe
      uitgereikt of toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel59a
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
