      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.115.2.c
    text: |-
      indien naar het oordeel van Onze Minister nader onderzoek naar de identiteit of nationaliteit van de vreemdeling
      noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
  - number: 3.115.2.d
    text: indien de vreemdeling zijn eerder tijdens het onderzoek afgelegde verklaringen essentieel wijzigt of aanvult;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
  - number: 3.115.2.e
    text: |-
      indien naar het oordeel van Onze Minister nader onderzoek noodzakelijk is naar omstandigheden die verband houden
      met de gronden, bedoeld in de [artikelen 3.6a, eerste lid][ref1], en [6.1e][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel6
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
