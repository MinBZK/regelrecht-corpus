        artikel: '21'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 37a
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.95.2
    text: |-
      [Artikel 3.86][ref1] is van overeenkomstige toepassing, met uitzondering van het dertiende en veertiende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.95
    references:
