        afdeling: '5'
  - number: 3.109ca.1.a
    text: |-
      vermoedelijk niet-ontvankelijk zal worden verklaard met toepassing van
      [artikel 30a, eerste lid, onder a of e, van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30a
  - number: 3.109ca.1.b
    text: |-
      vermoedelijk niet-ontvankelijk zal worden verklaard met toepassing van
      [artikel 30a, eerste lid, onder b, van de Wet][ref1], voor zover bedoelde bescherming is verleend door een staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, niet zijnde een lidstaat van de
      Europese Unie, of door Zwitserland;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30a
  - number: 3.109ca.1.c
    text: |-
      vermoedelijk kennelijk ongegrond zal worden verklaard met toepassing van
      [artikel 30b, eerste lid, onder b, van de Wet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30b
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30b
  - number: 3.109ca.1.d
    text: |-
      vermoedelijk niet-ontvankelijk zal worden verklaard gelet op het bepaalde in het Protocol (nr. 24) inzake asiel
      voor onderdanen van lidstaten van de Europese Unie, bij het Verdrag betreffende de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
  - number: 3.109ca.2
    text: |-
      Van de vreemdeling kunnen door Onze Minister een gezichtsopname en vingerafdrukken worden afgenomen en verwerkt. De
      vreemdeling verleent hieraan zijn medewerking.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
  - number: 3.109ca.3
    text: |-
      Na de indiening van de aanvraag, bedoeld in [artikel 3.108c, eerste lid][ref1], kan onderzoek plaatsvinden naar de
      identiteit, vingerafdrukken, nationaliteit en reisroute van de vreemdeling en naar de bij hem aangetroffen of door
      hem overgelegde documenten en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.109ca.4
    text: |-
      De vreemdeling wordt zo spoedig mogelijk door Onze Minister aan een gehoor onderworpen. Daarbij kunnen onder meer
      vragen worden gesteld omtrent de identiteit, nationaliteit, etniciteit, religie, herkomst, reisroute, documenten,
      eventueel verblijf in derde landen, en de personalia en verblijfplaats van familieleden. Indien Onze Minister
      voornemens is de aanvraag niet-ontvankelijk of kennelijk ongegrond te verklaren op de in het eerste lid bedoelde
      gronden, wordt de vreemdeling tijdens het gehoor in de gelegenheid gesteld zijn standpunt uiteen te zetten over de
      toepassing van deze gronden op zijn specifieke omstandigheden of aan te geven waarom zijn land van herkomst in zijn
      specifieke geval niet veilig is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
  - number: 3.109ca.5
    text: |-
      Een afschrift van het schriftelijk verslag van het in het vierde lid bedoelde gehoor wordt zo spoedig mogelijk ter
      kennis van de vreemdeling gebracht.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
  - number: 3.109ca.6
    text: |-
      Indien Onze Minister voornemens is de aanvraag niet-ontvankelijk of kennelijk ongegrond te verklaren op de in
      het eerste lid bedoelde gronden, wordt het schriftelijk voornemen daartoe zo spoedig mogelijk aan de vreemdeling
      toegezonden of uitgereikt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
  - number: 3.109ca.7
    text: |-
      Indien na het in het vierde lid bedoelde gehoor niet voldoende duidelijk is dat kan worden besloten tot niet-
      ontvankelijkverklaring of tot kennelijk ongegrondverklaring op de in het eerste lid bedoelde gronden, wordt voor
      de verdere behandeling van de aanvraag alsnog de in de [artikelen 3.109][ref1] en [3.110 tot en met 3.116][ref2]
      beschreven procedure gevolgd. Indien Onze Minister dit noodzakelijk acht, kan een aanmeldgehoor, als bedoeld in
      [artikel 3.108d, zesde lid][ref3], worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.109ca.8
    text: |-
      De vreemdeling wordt in de gelegenheid gesteld om opmerkingen te maken of opheldering te verschaffen over verkeerd
      vertaalde passages of misvattingen in het verslag van het in het vierde en vijfde lid bedoelde gehoor en nadere
      gegevens te verstrekken en zijn zienswijze op het in het vijfde lid bedoelde voornemen schriftelijk naar voren te
      brengen uiterlijk binnen een dag na de dag waarop het voornemen is uitgereikt of toegezonden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
  - number: 3.109ca.9
    text: |-
      De schriftelijke zienswijze is tijdig bij Onze Minister ingediend, indien deze voor het einde van de termijn is
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
  - number: 3.109ca.10
    text: |-
      Onze Minister houdt rekening met een na afloop van de termijn ontvangen schriftelijke zienswijze, indien de
      beschikking nog niet bekend is gemaakt en de afdoening van de zaak daardoor niet ontoelaatbaar wordt vertraagd.
      Het ontbreken van de schriftelijke zienswijze, na het verstrijken van de termijn waarbinnen de vreemdeling zijn
      zienswijze schriftelijk naar voren kan brengen, staat aan het geven van de beschikking niet in de weg.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
  - number: 3.109ca.11
    text: |-
      De beschikking wordt uiterlijk op de achtste dag na het in het vierde lid bedoelde gehoor genomen en wordt
      bekendgemaakt door uitreiking of toezending ervan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109ca
  - number: 3.109d.1
    text: |-
      De alleenstaande minderjarige vreemdeling wordt onmiddellijk in kennis gesteld van de aanwijzing van een persoon
      die hem bijstaat en vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109d
  - number: 3.109d.2
    text: |-
      Onze Minister kan in het kader van de behandeling van de aanvraag van een alleenstaande minderjarige vreemdeling
      tot het verlenen van een verblijfsvergunning asiel voor bepaalde tijd besluiten om door middel van een medisch
      onderzoek zijn gestelde minderjarigheid vast te stellen, wanneer Onze Minister, nadat er een algemene verklaring
      is afgelegd of andere relevante aanwijzingen zijn, twijfels heeft over diens leeftijd. Voor dit onderzoek is de
      schriftelijke toestemming van de vreemdeling vereist. Als het onderzoek deze twijfels niet wegneemt, wordt ervan
      uitgegaan dat de aanvrager minderjarig is.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109d
  - number: 3.109d.3
    text: |-
      Indien een alleenstaande minderjarige vreemdeling weigert het in het tweede lid bedoelde medisch onderzoek te
      ondergaan, wordt de beslissing tot afwijzing van de aanvraag niet enkel op die weigering gebaseerd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109d
  - number: 3.109d.4
    text: |-
      Indien de aanvraag wordt ingediend door een alleenstaande minderjarige vreemdeling, wordt zijn wettelijk
      vertegenwoordiger, juridische adviseur of andere raadsman in de gelegenheid gesteld om bij het nader gehoor
      aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109d
  - number: 3.109d.5
    text: |-
      De wettelijk vertegenwoordiger, juridische adviseur of andere raadsman is bij het gehoor aanwezig en wordt in de
      gelegenheid gesteld aan het einde van het nader gehoor vragen te stellen of opmerkingen te maken.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109d
  - number: 3.109d.6
    text: |-
      De aanvraag van een alleenstaande minderjarige vreemdeling kan uitsluitend met toepassing van
      [artikel 30a, eerste lid, aanhef en onder c, van de Wet][ref1] niet-ontvankelijk worden verklaard indien dit in het
      belang van de minderjarige is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109d
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30a
  - number: 3.109e.1
    text: |-
      Indien Onze Minister het voor de beoordeling van de aanvraag tot het verlenen van een verblijfsvergunning asiel
      voor bepaalde tijd relevant acht, biedt hij ook een medisch onderzoek aan naar aanwijzingen van vroegere vervolging
      of ernstige schade. Dit onderzoek wordt verricht door gekwalificeerde medische beroepsbeoefenaars. De vreemdeling
      wordt ervan in kennis gesteld dat hij op eigen initiatief en kosten een dergelijk onderzoek kan regelen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109e
  - number: 3.109e.2
    text: Het medisch onderzoek wordt niet uitgevoerd dan met toestemming van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109e
  - number: 3.109e.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van het medisch
      onderzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109e
  - number: 3.109e.4
    text: |-
      Indien de vreemdeling op eigen initiatief een medisch onderzoek naar aanwijzingen van vroegere vervolging of
      ernstige schade heeft laten verrichten, betrekt Onze Minister de resultaten ervan bij de beoordeling van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109e
  - number: 3.109e.5
    text: |-
      De resultaten van de in het eerste en vierde lid bedoelde medische onderzoeken worden door Onze Minister beoordeeld
      samen met de andere elementen van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109e
  - number: 3.109e.6
    text: |-
      Indien de vreemdeling een medisch onderzoek weigert of belemmert, dan wel geen inzage in het medisch onderzoek
      verleent aan Onze Minister, kan Onze Minister niettemin op de aanvraag beslissen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.109e
  - number: 3.110.1
    text: |-
      Voor het onderzoek naar de aanvraag tot het verlenen van de verblijfsvergunning asiel voor bepaalde tijd zijn in
      een Aanmeldcentrum zes dagen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.110
  - number: 3.110.2
    text: |-
      Onze Minister kan de in het eerste lid genoemde termijn verlengen onder de in [artikel 3.115][ref1] beschreven
      voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.110
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.110.3
    text: |-
      Voor de termijnen, genoemd in het eerste en tweede lid, met uitzondering van het Aanmeldcentrum Schiphol, tellen de
      dagen gedurende het weekeinde en de dagen die bij of krachtens de [Algemene termijnenwet][ref1] zijn aangemerkt als
      algemeen erkende feestdagen niet mee.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.110
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: 3.110.4
    text: |-
      Bij ministeriële regeling kunnen, in afwijking van het derde lid, weekeinden of dagen die bij of krachtens de
      [Algemene termijnenwet][ref1] zijn aangemerkt als algemeen erkende feestdagen, worden aangewezen als dagen die wel
      meetellen voor de termijnen, genoemd in het eerste en tweede lid. Die aanwijzing kan worden beperkt tot bepaalde
      dagen van het weekeinde, tot bepaalde weekeinden, tot bepaalde dagen die bij of krachtens de Algemene termijnenwet
      zijn aangemerkt als algemeen erkende feestdagen, of tot bepaalde aanmeldcentra.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.110
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: 3.110.5
    text: |-
      Onze Minister bepaalt met inachtneming van [artikel 3.109, eerste lid][ref1], wanneer het onderzoek als bedoeld in
      het eerste lid aanvangt en deelt de dag van aanvang mede aan de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.110
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.113.1
    text: |-
      Op de eerste dag wordt de vreemdeling door Onze Minister aan een nader gehoor onderworpen. Bij het afnemen van
      het nader gehoor wordt de vreemdeling in de gelegenheid gesteld om zo volledig mogelijk de tot staving van zijn
      aanvraag noodzakelijke elementen aan te voeren. Dit houdt onder meer in dat de vreemdeling in de gelegenheid wordt
      gesteld om uitleg te geven over eventueel ontbrekende elementen of over inconsistenties of tegenstrijdigheden in
      zijn verklaringen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.113
  - number: 3.113.2
    text: |-
      Indien Onze Minister voornemens is de aanvraag niet-ontvankelijk te verklaren op grond van
      [artikel 30a van de Wet][ref1], wordt de vreemdeling tijdens het nader gehoor in de gelegenheid gesteld zijn
      standpunt uiteen te zetten over de toepassing van de in artikel 30a, eerste lid, van de Wet bedoelde gronden op
      zijn specifieke omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.113
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30a
  - number: 3.113.3
    text: |-
      Van het nader gehoor wordt een schriftelijk verslag gemaakt. Een afschrift van het verslag van nader gehoor wordt
      op de eerste dag aan de vreemdeling ter kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.113
  - number: 3.113.4
    text: |-
      De vreemdeling wordt in de gelegenheid gesteld om uiterlijk op de tweede dag opmerkingen te maken of opheldering te
      verschaffen over verkeerd vertaalde passages of misvattingen in het verslag van het nader gehoor en nadere gegevens
      te verstrekken. De vreemdeling wordt daartoe volledig geïnformeerd over de inhoud van het verslag, zo nodig met
      bijstand van een tolk. De vreemdeling wordt verzocht uiterlijk op de tweede dag schriftelijk te bevestigen dat de
      inhoud van het verslag een correcte afspiegeling is van het nader gehoor. Het verslag van nader gehoor vermeldt
      deze termijn.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.113
  - number: 3.113.5
    text: |-
      Indien de vreemdeling weigert te bevestigen dat de inhoud van het verslag een correcte afspiegeling van het nader
      gehoor vormt, worden de redenen voor deze weigering in zijn dossier opgenomen. Die weigering belet Onze Minister
      niet om een beslissing op de aanvraag te nemen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.113
  - number: 3.113.6
    text: 'In afwijking van het tweede lid blijft een nader gehoor in een Aanmeldcentrum achterwege:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.113
  - number: 3.113.6.a
    text: indien de vreemdeling om medische redenen niet aan een nader gehoor kan worden onderworpen, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.113
  - number: 3.113.6.b
    text: ten aanzien van een alleenstaande minderjarige vreemdeling beneden de leeftijd van twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.113
  - number: 3.113.7
    text: |-
      Indien een nader gehoor in een Aanmeldcentrum achterwege is gebleven wordt de vreemdeling door Onze Minister zo
      spoedig mogelijk aan een nader gehoor onderworpen. Van het nader gehoor wordt een schriftelijk verslag gemaakt.
      Een afschrift van het verslag van nader gehoor wordt zo spoedig mogelijk aan de vreemdeling ter kennis gebracht.
      Het verslag van nader gehoor vermeldt de termijn waarbinnen de vreemdeling uit eigen beweging of desgevraagd nadere
      gegevens kan verstrekken. Deze termijn bedraagt ten minste twee dagen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.113
  - number: 3.113.8
    text: Bij ministeriële regeling worden voorschriften gesteld omtrent het afnemen van het nader gehoor.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.113
  - number: 3.114.1
    text: |-
      Indien Onze Minister voornemens is de aanvraag tot het verlenen van de verblijfsvergunning asiel voor bepaalde tijd
      af te wijzen binnen zes dagen, wordt het schriftelijk voornemen daartoe aan de vreemdeling toegezonden op de derde
      dag of aan de vreemdeling uitgereikt op de vierde dag.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.114
  - number: 3.114.2
    text: |-
      De vreemdeling brengt zijn zienswijze op het in het eerste lid bedoelde voornemen schriftelijk naar voren uiterlijk
      op de vierde dag.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.114
  - number: 3.114.3
    text: |-
      De schriftelijke zienswijze is tijdig bij Onze Minister ingediend, indien deze voor het einde van de termijn is
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.114
  - number: 3.114.4
    text: |-
      Het tijdstip van uitreiken van het voornemen en de ontvangst van de schriftelijke zienswijze worden door Onze
      Minister vastgelegd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.114
  - number: 3.114.5
    text: |-
      Onze Minister houdt rekening met een na afloop van de termijn ontvangen schriftelijke zienswijze, indien de
      beschikking nog niet bekend is gemaakt. Met een na afloop van de termijn ontvangen aanvulling op een eerder
      ingediende schriftelijke zienswijze wordt rekening gehouden, indien de beschikking nog niet bekend is gemaakt en de
      afdoening van de zaak daardoor niet ontoelaatbaar wordt vertraagd. Het ontbreken van de schriftelijke zienswijze,
      na het verstrijken van de termijn waarbinnen de vreemdeling zijn zienswijze schriftelijk naar voren kan brengen,
      staat aan het geven van de beschikking niet in de weg.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.114
  - number: 3.114.6
    text: Onze Minister maakt de beschikking uiterlijk op de zesde dag bekend door uitreiking of toezending ervan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.114
  - number: 3.115.1
    text: |-
      Onze Minister kan de in [artikel 3.110, eerste lid][ref1], genoemde termijn voorafgaand aan de start van het
      onderzoek verlengen, indien als gevolg van het onderzoek in de aanmeldfase of de rust- en voorbereidingstermijn, of
      als gevolg van het medisch onderzoek, bedoeld in [artikel 3.109, vijfde lid][ref2], is gebleken dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.115.1.a
    text: er indicaties zijn dat het onderzoek naar de afgelegde verklaringen voorzienbaar meer tijd zal vergen; of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
  - number: 3.115.1.b
    text: |-
      de vreemdeling bijzondere procedurele waarborgen behoeft als bedoeld in [artikel 3.108b][ref1], dan wel meer
      tijd nodig is voor het zorgvuldig doorlopen van de procedure omdat uit het medisch onderzoek, bedoeld in
      [artikel 3.109, vijfde lid][ref2], is gebleken dat een extra dag nodig is voor het nader gehoor, bedoeld in
      [artikel 3.113, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.115
