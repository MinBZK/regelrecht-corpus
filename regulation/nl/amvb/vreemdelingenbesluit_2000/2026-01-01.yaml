  - number: 3.58.2
    text: |-
      In afwijking van het eerste lid, onder q, kan de verblijfsvergunning onder een beperking verband houdend met
      tijdelijke humanitaire gronden worden verleend voor de duur van vijf jaar aan de alleenstaande minderjarige
      vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.58
  - number: 3.58.2.a
    text: die jonger was dan vijftien jaar ten tijde van de eerste verblijfsaanvraag in Nederland, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.58
  - number: 3.58.2.b
    text: |-
      voor wie naar het oordeel van Onze Minister, naar plaatselijke maatstaven gemeten, adequate opvang ontbreekt in het
      land van herkomst of een ander land waar hij redelijkerwijs naar toe kan gaan, dan wel deze adequate opvang buiten
      zijn schuld niet gerealiseerd kan worden binnen drie jaar na de eerste verblijfsaanvraag.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.58
  - number: 3.58.3
    text: |-
      In afwijking van het eerste lid, onder o en p, kan de verblijfsvergunning onder een beperking verband houdend met
      medische behandeling onderscheidenlijk tijdelijke humanitaire gronden worden verleend of verlengd voor een langere
      geldigheidsduur dan één jaar indien tussen de aanvraag en de beschikking ten minste één jaar verstreken is. In
      dat geval bedraagt de geldigheidsduur van de verblijfsvergunning de periode tussen de aanvraag en de beschikking,
      aangevuld met één jaar.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.58
  - number: 3.71.1
    text: |-
      De aanvraag tot het verlenen van de verblijfsvergunning regulier voor bepaalde tijd wordt afgewezen, indien de
      vreemdeling niet beschikt over een geldige machtiging tot voorlopig verblijf.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
  - number: 3.71.2
    text: |-
      Van het vereiste van een geldige machtiging tot verblijf is, op grond van
      [artikel 17, eerste lid, onder g, van de Wet][ref1], vrijgesteld de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel17
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '17'
  - number: 3.71.2.a
    text: |-
      die houder is van een door een andere staat die het Schengenacquis volledig toepast afgegeven geldige
      verblijfstitel die het buitenlands equivalent is van een verblijfsvergunning als bedoeld in [artikel 14][ref1]
      of [20 van de Wet][ref2], de aanvraag via een erkende referent indient en in aanmerking komt voor een
      verblijfsvergunning regulier voor bepaalde tijd dan wel die als de echtgenoot, geregistreerde dan wel ongehuwde
      partner of het minderjarig kind van die echtgenoot, partner of houder voor verblijf bij die houder in die andere
      staat in het bezit is gesteld van een zodanige verblijfstitel, de aanvraag via een erkende referent indient voor
      verblijf als familie- of gezinslid bij die houder en in aanmerking komt voor een verblijfsvergunning regulier voor
      bepaalde tijd;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.71.2.b
    text: |-
      van twaalf jaar of jonger, die in Nederland is geboren en naar het oordeel van Onze Minister feitelijk is blijven
      behoren tot het gezin van een ouder die
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
  - number: 3.71.2.b.1°
    text: |-
      sedert het moment van geboorte van de vreemdeling rechtmatig verblijf in Nederland heeft op grond van
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref1] of als Nederlander, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.71.2.b.2°
    text: |-
      op het moment van de geboorte van de vreemdeling rechtmatig verblijf in Nederland had op grond van
      [artikel 8, onder f tot en met k, van de Wet][ref1] en die sedertdien aansluitend rechtmatig verblijf op grond van
      [artikel 8, onder a tot en met e, dan wel l, van de Wet][ref2] heeft, voor zover geen van beiden het hoofdverblijf
      buiten Nederland heeft verplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.71.2.c
    text: |-
      die in Nederland verblijft op grond van een geprivilegieerde status als gezinslid van een in Nederland
      geaccrediteerd personeelslid van een buitenlandse diplomatieke of consulaire post die zelf in aanmerking komt voor
      de verblijfsvergunning regulier voor onbepaalde tijd of die op grond van een bijzondere geprivilegieerde status als
      geaccrediteerd lid van een internationale organisatie, of als diens gezinslid in Nederland hebben verbleven;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
  - number: 3.71.2.d
    text: |-
      die ten minste zeven jaren werkzaam is of is geweest op een zeeschip dat op grond van voor Nederland geldende
      rechtsregels gerechtigd is de vlag van het Koninkrijk te voeren of een mijnbouwinstallatie op het continentaal
      plat;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
  - number: 3.71.2.e
    text: |-
      die in aanmerking komt voor een verblijfsvergunning op grond van Besluit 1/80 van de Associatieraad EEG-Turkije
      betreffende de ontwikkeling van de Associatie of van wie uitzetting in strijd zou zijn met de op 12 september 1963
      te Ankara gesloten Overeenkomst waarbij een associatie tot stand wordt gebracht tussen de Europese Economische
      Gemeenschap en Turkije (Trb. 1964, 217), het op 23 november 1970 te Brussel tot stand gekomen Aanvullend Protocol
      bij die overeenkomst (Trb. 1971, 70) of dat Besluit nr. 1/80;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
  - number: 3.71.2.f
    text: |-
      die in aanmerking komt voor de verblijfsvergunning regulier voor bepaalde tijd onder een beperking verband houdend
      met grensoverschrijdende dienstverlening;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
  - number: 3.71.2.g
    text: |-
      die in Nederland verblijft, bij de rechtbank Den Haag een verzoek heeft ingediend tot vaststelling van zijn
      Nederlanderschap dat naar het oordeel van Onze Minister niet klaarblijkelijk van elke grond ontbloot is;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
  - number: 3.71.2.h
    text: |-
      die tijdelijke bescherming heeft en in aanmerking komt voor de verblijfsvergunning regulier voor bepaalde tijd
      onder een beperking verband houdend met seizoenarbeid, arbeid in loondienst, arbeid als kennismigrant of arbeid
      als zelfstandige;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
  - number: 3.71.2.i
    text: |-
      die houder is van een verblijfsvergunning voor onderzoekers in de zin van richtlijn (EU) 2016/801 afgegeven door
      een andere staat die Partij is bij het Verdrag betreffende de werking van de Europese Unie, dan wel de echtgenoot,
      partner of het minderjarig kind is van die houder, tenzij sprake is van gezinsvorming;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
  - number: 3.71.2.j
    text: |-
      die verblijf beoogt voor medische behandeling en die ten minste een jaar direct voorafgaande aan de aanvraag
      rechtmatig verblijf als bedoeld in [artikel 8, onder j, van de Wet][ref1] heeft gehad;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.71.2.k
    text: |-
      die minderjarig is, schoolgaand is en drie jaar ononderbroken hoofdverblijf in Nederland heeft en een aanvraag
      heeft ingediend tot het verlenen van een verblijfsvergunning regulier voor bepaalde tijd onder een beperking
      verband houdend met gezinshereniging bij een Nederlander of een hoofdpersoon met rechtmatig verblijf, als bedoeld
      in [artikel 8, onder a tot en met e dan wel l, van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.71.2.l
    text: |-
      van wie uitzetting in strijd met artikel 8 van het Verdrag tot bescherming van de rechten van de mens en de
      fundamentele vrijheden zou zijn;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
  - number: 3.71.2.m
    text: |-
      die de biologische of juridische ouder is die het gezag heeft over en is ingereisd met een minderjarige vreemdeling
      die houder is van een verblijfsvergunning regulier voor bepaalde tijd die is verleend met toepassing van
      [artikel 3.46][ref1] dan wel die de onder het gezag van die ouder staande minderjarige broer of zuster van die
      houder is en met die ouder en houder is ingereisd;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.71.2.n
    text: |-
      die de echtgenoot, geregistreerde partner of partner is, dan wel het biologische of juridische kind dat onder het
      rechtmatig gezag staat, van een meerderjarige vreemdeling die houder is van een verblijfsvergunning regulier voor
      bepaalde tijd die is verleend met toepassing van [artikel 3.46][ref1], met die houder is ingereisd en bij die
      houder verblijft;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.71.2.o
    text: |-
      die minderjarig is, Nederland is ingereisd als houder van een geldig Nederlands nationaal paspoort en na de
      vaststelling dat het paspoort ten onrechte is verstrekt, alsnog een aanvraag indient voor een verblijfsvergunning
      regulier verband houdend met verblijf ter adoptie, tenzij onjuiste gegevens zijn verstrekt die hebben geleid tot de
      afgifte van dat paspoort;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
  - number: 3.71.2.p
    text: |-
      die een minderjarig kind is van een houder van een verblijfsvergunning als bedoeld in
      [artikel 3.48, eerste lid, onder a, b dan wel c][ref1], en onder het gezag staat van en verblijft bij die houder;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.71.2.q
    text: |-
      die in aanmerking komt voor een verblijfsvergunning als bedoeld in
      [artikel 3.48, eerste lid, aanhef en onder d, e, f, of g][ref1], dan wel het minderjarige kind van die vreemdeling
      dat onder het gezag staat van en verblijft bij die vreemdeling;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.71.2.r
    text: |-
      die houder is van een door de autoriteiten van een andere staat die Partij is bij het Verdrag betreffende de
      werking van de Europese Unie afgegeven Europese blauwe kaart en gedurende ten minste twaalf maanden als houder
      van die kaart in die staat heeft verbleven, dan wel na een dergelijk verblijf gedurende ten minste zes maanden als
      houder van een Europese blauwe kaart in een andere lidstaat heeft verbleven, dan wel het gezinslid van die houder,
      tenzij sprake is van gezinsvorming;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
  - number: 3.71.2.s
    text: |-
      die houder is van een door een andere lidstaat van de Europese Unie afgegeven verblijfsvergunning met de
      vermelding «ICT» die in Nederland wil verblijven voor een overplaatsing binnen een onderneming in het kader van
      langetermijnmobiliteit in de zin van artikel 22 van [richtlijn 2014/66](32014L0066)/EU, dan wel de echtgenoot,
      partner of het minderjarig kind is die zelf houder is van een door een andere lidstaat van de Europese Unie
      afgegeven verblijfsvergunning in het kader van gezinshereniging van die houder, tenzij sprake is van gezinsvorming.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
  - number: 3.71.3
    text: |-
      Onze Minister kan het eerste lid buiten toepassing laten, voorzover toepassing daarvan naar zijn oordeel zal leiden
      tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71
  - number: 3.71a.1
    text: |-
      Een vreemdeling beschikt over kennis op basisniveau van de Nederlandse taal en van de Nederlandse maatschappij als
      bedoeld in [artikel 16, eerste lid, onder h, van de Wet][ref1], indien hij binnen één jaar direct voorafgaand aan
      de aanvraag om de machtiging tot voorlopig verblijf het basisexamen inburgering, bedoeld in [artikel 3.98a][ref2],
      met goed gevolg heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 3.71a.2
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning regulier voor bepaalde tijd wordt niet afgewezen op grond
      van [artikel 16, eerste lid, onder h, van de Wet][ref1], indien de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.71a.2.a
    text: |-
      in Nederland wil verblijven als gezinslid van een houder van een verblijfsvergunning asiel voor bepaalde
      of onbepaalde tijd of een EU-verblijfsvergunning voor langdurig ingezetenen indien op het aan de
      vreemdeling verschafte document, bedoeld in [artikel 9 van de Wet][ref1], de aantekening, bedoeld in
      [artikel 45c, eerste lid, van de Wet][ref2] is geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 45c
  - number: 3.71a.2.b
    text: |-
      ingevolge de wetgeving van een lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte heeft voldaan aan een inburgeringsvereiste om de status van langdurig
      ingezetene in de zin van richtlijn langdurig ingezetenen te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71a
  - number: 3.71a.2.c
    text: |-
      gelet op bijzondere individuele omstandigheden naar het oordeel van Onze Minister van Sociale Zaken en
      Werkgelegenheid bij handhaving van de verplichting om het basisexamen inburgering met goed gevolg af te leggen,
      onmogelijk of uiterst moeilijk zijn recht op gezinshereniging kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71a
  - number: 3.71a.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de toepassing van het tweede lid, onderdelen
      a en b, en bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de toepassing van het tweede lid,
      onderdeel c.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.71a
  - number: '3.72'
    text: |-
      Een aanvraag tot het verlenen van de verblijfsvergunning regulier voor bepaalde tijd wordt niet op grond van
      [artikel 16, eerste lid, onder b, van de Wet][ref1] afgewezen, indien de vreemdeling naar het oordeel van Onze
      Minister heeft aangetoond dat hij vanwege de regering van het land waarvan hij onderdaan is, niet of niet meer in
      het bezit van een geldig document voor grensoverschrijding kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.73.1
    text: |-
      De in [artikel 16, eerste lid, onder c, van de Wet][ref1] bedoelde middelen van bestaan zijn in ieder geval
      zelfstandig, indien verworven uit:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.73
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.73.1.a
    text: wettelijk toegestane arbeid in loondienst, voorzover de vereiste premies en belastingen zijn afgedragen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.73
  - number: 3.73.1.b
    text: wettelijk toegestane arbeid als zelfstandige, voorzover de vereiste premies en belastingen zijn afgedragen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.73
  - number: 3.73.1.c
    text: inkomensvervangende uitkeringen krachtens een sociale verzekeringswet waarvoor premies zijn afgedragen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.73
  - number: 3.73.1.d
    text: |-
      eigen vermogen, voorzover de bron van de inkomsten niet wordt aangetast en de vereiste belastingen zijn afgedragen,
      of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.73
  - number: 3.73.1.e
    text: |-
      in geval van verblijf voor onderzoek in de zin van richtlijn (EU) 2016/801, studie, lerend werken of uitwisseling
      in het kader van Europees vrijwilligerswerk: financiële ondersteuning van de referent, een subsidie, een beurs of
      een toelage.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.73
  - number: 3.73.2
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.73
  - number: 3.74.1
    text: |-
      De in [artikel 16, eerste lid, onder c, van de Wet][ref1] bedoelde middelen van bestaan zijn in ieder geval
      voldoende, indien de som van het loon, bedoeld in [artikel 16 van de Wet financiering sociale verzekeringen][ref2],
      uit arbeid in loondienst, het bruto inkomen uit een inkomensvervangende uitkering krachtens een
      socialeverzekeringswet waarvoor premies zijn afgedragen, de bruto-winst uit arbeid als zelfstandige en het inkomen
      uit eigen vermogen ten minste gelijk is aan:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.74
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '16'
  - number: 3.74.1.a
    text: |-
      het minimumloon, bedoeld in de [artikelen 8, eerste lid, onder b][ref1], en
      [14, van de Wet minimumloon en minimumvakantiebijslag][ref2], met inbegrip van de vakantiebijslag, bedoeld in
      [artikel 15 van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.74
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 3.74.1.b
    text: 'in bij ministeriële regeling aangewezen gevallen: 150 procent van het minimumloon, bedoeld in onderdeel a.'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.74
  - number: 3.74.2
    text: |-
      De in [artikel 16, eerste lid, onder c, van de Wet][ref1] bedoelde middelen van bestaan zijn eveneens
      voldoende, indien het netto-inkomen ten minste gelijk is aan het normbedrag voor ho-studenten, bedoeld in de
      [Wet studiefinanciering 2000][ref2], indien de vreemdeling in Nederland verblijft of wil verblijven voor studie.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.74
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0011453
  - number: 3.74.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de voorgaande leden. Daarbij kunnen gevallen
      worden vastgesteld waarin de in [artikel 16, eerste lid, onder c, van de Wet][ref1] bedoelde middelen van bestaan
      voldoende zijn, indien het inkomen ten minste gelijk is aan een combinatie van de in het eerste en tweede lid
      genoemde normbedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.74
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.74.4
    text: De normbedragen, bedoeld in de voorgaande leden, worden door Onze Minister bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.74
  - number: 3.75.1
    text: |-
      De in [artikel 16, eerste lid, onder c, van de Wet][ref1] bedoelde middelen van bestaan zijn in ieder geval
      duurzaam, indien zij nog één jaar beschikbaar zijn op het tijdstip waarop de aanvraag is ontvangen of de
      beschikking wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.75
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.75.2
    text: |-
      Middelen van bestaan verkregen uit eigen vermogen zijn duurzaam, indien zij gedurende een aaneengesloten periode
      van een jaar beschikbaar zijn geweest en nog beschikbaar zijn op het tijdstip waarop de aanvraag is ontvangen of de
      beschikking wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.75
  - number: 3.75.3
    text: |-
      In afwijking van het eerste lid, zijn middelen van bestaan verkregen uit arbeid in loondienst eveneens duurzaam,
      indien op het tijdstip waarop de aanvraag is ontvangen of de beschikking wordt gegeven gedurende een aaneengesloten
      periode van drie jaren jaarlijks voldoende middelen van bestaan uit arbeid in loondienst zijn verworven en
      de middelen van bestaan nog beschikbaar zijn. Indien tijdens de periode van drie jaren gedurende een periode
      van in totaal niet langer dan zesentwintig weken een werkloosheidsuitkering is ontvangen, wordt die uitkering
      gelijkgesteld met inkomen uit arbeid in loondienst.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.75
  - number: 3.75.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de duurzaamheid van middelen van
      bestaan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.75
  - number: 3.77.1
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning regulier voor bepaalde tijd kan op grond van
      [artikel 16, eerste lid, onder d, van de Wet][ref1] worden afgewezen wegens gevaar voor de openbare orde, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.77.1.a
    text: |-
      er ernstige redenen zijn om te veronderstellen dat de vreemdeling zich schuldig heeft gemaakt aan gedragingen als
      bedoeld in artikel 1F van het Vluchtelingenverdrag;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
  - number: 3.77.1.b
    text: |-
      de vreemdeling de echtgenoot of echtgenote, het minderjarige kind, de partner of het meerderjarige kind, bedoeld
      in [artikel 29, tweede lid, onder a en b, van de Wet][ref1], is van een in Nederland verblijvende vreemdeling ten
      aanzien van wie er ernstige redenen zijn om te veronderstellen dat deze zich schuldig heeft gemaakt aan gedragingen
      als bedoeld in artikel 1F van het Vluchtelingenverdrag, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.77.1.c
    text: |-
      de vreemdeling terzake van een misdrijf is veroordeeld tot een onvoorwaardelijke gevangenisstraf of
      onvoorwaardelijke jeugddetentie, tot een onvoorwaardelijke maatregel als bedoeld in [artikel 37a][ref1],
      [38m][ref2] of [77h, vierde lid, onder a of b, van het Wetboek van Strafrecht][ref3], tot een taakstraf of tot een
      onvoorwaardelijke geldboete, dan wel indien hij terzake van misdrijf een transactieaanbod heeft aanvaard of jegens
      hem een strafbeschikking is uitgevaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38m
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 77h
  - number: 3.77.2
    text: |-
      Bij de toepassing van het eerste lid, onder c, wordt mede betrokken de buiten Nederland gepleegde inbreuk op de
      openbare orde, voorzover die naar Nederlands recht een misdrijf oplevert.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
  - number: 3.77.3
    text: Bij de toepassing van het eerste en tweede lid komt aan gratieverlening geen betekenis toe.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
  - number: 3.77.4
    text: |-
      In geval de aanvraag verband houdt met verblijf als familie- of gezinslid houdt Onze Minister bij de toepassing
      van het eerste lid, onder c, ten minste rekening met de aard en de hechtheid van de gezinsband van de vreemdeling
      en de duur van zijn verblijf, alsmede het bestaan van familiebanden of culturele of sociale banden met het land
      van herkomst.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
  - number: 3.77.5
    text: |-
      In geval de aanvraag is ingediend door een vreemdeling die houder is van een EU-verblijfsvergunning voor langdurig
      ingezetenen die is afgegeven door een andere staat die partij is bij het Verdrag betreffende de werking van de
      Europese Unie, houdt Onze Minister bij de toepassing van het eerste lid, onder c, mede rekening met de ernst van
      de inbreuk of het soort van inbreuk dat door de langdurig ingezetene of diens gezinslid op de openbare orde is
      gepleegd, respectievelijk met het gevaar dat van de langdurig ingezetene of dat gezinslid uitgaat.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
  - number: 3.77.6
    text: |-
      Bij de toepassing van het vijfde lid houdt Onze Minister tevens rekening met de leeftijd van de vreemdeling, de
      gevolgen voor de vreemdeling en de leden van zijn gezin, het bestaan van banden met Nederland dan wel het ontbreken
      van banden met het land van herkomst.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
  - number: 3.77.7
    text: |-
      De aanvraag, bedoeld in het eerste lid, kan worden afgewezen op de in
      [artikel 16, eerste lid, onder i, van de Wet][ref1] genoemde grond, tenzij de vreemdeling sinds de laatste
      uitzetting of het laatste gecontroleerde vertrek een ononderbroken periode van ten minste vijf jaren buiten
      Nederland heeft verbleven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.77.8
    text: |-
      De aanvraag, bedoeld in het eerste lid, kan worden afgewezen op de in
      [artikel 16, eerste lid, onder j, van de Wet][ref1] genoemde grond, tenzij de vreemdeling sinds de laatste
      uitzetting of het laatste gecontroleerde vertrek een ononderbroken periode van ten minste vijf jaren buiten
      Nederland heeft verbleven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.77.9
    text: |-
      De aanvraag, bedoeld in het eerste lid, kan eveneens worden afgewezen op grond van
      [artikel 16, eerste lid, onder j, van de Wet][ref1], tenzij het daar bedoelde verblijf uitsluitend tijdens de
      minderjarigheid van de vreemdeling heeft plaatsgevonden of het betreft de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.77.9.a
    text: |-
      die als echtgenoot, partner of minderjarig kind in het land van herkomst is achtergelaten door de persoon bij wie
      eerder verblijf was toegestaan;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
  - number: 3.77.9.b
    text: die huiselijk geweld heeft ondervonden van de persoon bij wie eerder verblijf was toegestaan;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
  - number: 3.77.9.c
    text: die eergerelateerd geweld heeft ondervonden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
  - number: 3.77.9.d
    text: |-
      die buiten zijn schuld niet kan terugkeren naar zijn land van herkomst omdat de autoriteiten van dat land daaraan
      niet meewerken,
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
  - number: 3.77.9.e
    text: |-
      jegens wie Onze Minister [artikel 3.71, derde lid][ref1], toepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.77.10
    text: |-
      De aanvraag, bedoeld in het eerste lid, kan worden afgewezen op grond van
      [artikel 16, eerste lid, onder i of j, van de Wet][ref1], tenzij het betreft een vreemdeling die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.77.10.a
    text: |-
      in aanmerking komt voor een verblijfsvergunning op grond van Besluit 1/80 van de Associatieraad EEG-Turkije
      betreffende de ontwikkeling van de Associatie, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
  - number: 3.77.10.b
    text: |-
      niet wordt uitgezet om reden dat diens uitzetting in strijd zou zijn met de op 12 september 1963 te Ankara gesloten
      Overeenkomst waarbij een associatie tot stand wordt gebracht tussen de Europese Economische Gemeenschap en Turkije
      (Trb. 1964, 217), het op 23 november 1970 te Brussel tot stand gekomen Aanvullend Protocol bij die overeenkomst
      (Trb. 1971, 70) of dat Besluit nr. 1/80.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
  - number: 3.77.11
    text: |-
      De vreemdeling van twaalf jaar of ouder ondertekent een antecedentenverklaring. Het model van de verklaring wordt
      bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.77
  - number: '3.78'
    text: |-
      Buiten de gevallen, bedoeld in [artikel 3.77][ref1], kan de aanvraag tot het verlenen van een verblijfsvergunning
      regulier voor bepaalde tijd slechts op grond van [artikel 16, eerste lid, onder d, van de Wet][ref2] worden
      afgewezen wegens gevaar voor de openbare orde, indien zwaarwegende belangen naar het oordeel van Onze Minister
      daartoe nopen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.78
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.79.1
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning regulier voor bepaalde tijd kan slechts op grond van
      [artikel 16, eerste lid, onder e, van de Wet][ref1] worden afgewezen, indien de vreemdeling niet bereid is een
      onderzoek naar of behandeling voor tuberculose te ondergaan of daaraan niet meewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.79
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.79.2
    text: |-
      De aanvraag kan niet op grond van [artikel 16, eerste lid, onder e, van de Wet][ref1] worden afgewezen, indien
      de vreemdeling de nationaliteit bezit van een van de bij ministeriële regeling vast te stellen landen, langdurig
      ingezetene is dan wel als gezinslid van een langdurig ingezetene in een andere staat die partij is bij het Verdrag
      betreffende de werking van de Europese Unie is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.79
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.79a.1
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning regulier voor bepaalde tijd onder een beperking verband
      houdend met seizoenarbeid, lerend werken, arbeid in loondienst, arbeid als kennismigrant, verblijf als houder van
      de Europese blauwe kaart of onderzoek in de zin van richtlijn (EU) 2016/801 wordt niet afgewezen op de grond dat de
      werkgever niet krachtens [artikel 2c van de Wet][ref1] als referent is erkend of ten behoeve van het verblijf van
      de vreemdeling geen verklaring als bedoeld in [artikel 2a, tweede lid, van de Wet][ref2] heeft afgelegd, indien de
      vreemdeling de Turkse nationaliteit heeft, in welk geval de werkgever niet als referent wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.79a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2a
  - number: 3.79a.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de gevallen waarin de aanvraag tot het
      verlenen van een verblijfsvergunning regulier voor bepaalde tijd ter uitvoering van verdragen of besluiten van
      volkenrechtelijke organisaties niet wordt afgewezen om de reden dat ten behoeve van het verblijf van de vreemdeling
      geen verklaring als bedoeld in [artikel 16, eerste lid, onder k, van de Wet][ref1], is overgelegd. Daarbij kunnen
      nadere regels worden gesteld omtrent de aanwijzing als referent.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.79a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.80.1
    text: |-
      De aanvraag tot het wijzigen of het verlengen van de geldigheidsduur van de verblijfsvergunning regulier
      voor bepaalde tijd is tijdig ingediend, indien deze is ontvangen uiterlijk op de dag voor de dag waarop de
      geldigheidsduur verstrijkt, dan wel, indien deze later is ontvangen, indien de termijnoverschrijding de vreemdeling
      niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.80
  - number: 3.80.2
    text: |-
      De niet-tijdig ingediende aanvraag tot het wijzigen of tot het verlengen van de geldigheidsduur van de
      verblijfsvergunning regulier voor bepaalde tijd wordt gelijkgesteld met een aanvraag tot het verlenen van de
      verblijfsvergunning.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.80
  - number: 3.80a.1
    text: |-
      Een aanvraag tot het wijzigen van een verblijfsvergunning regulier voor bepaalde tijd in
      een verblijfsvergunning onder een beperking verband houdend met niet-tijdelijke humanitaire
      gronden wordt afgewezen, indien de aanvraag is ingediend door een vreemdeling als bedoeld in
      [artikel 3.51, eerste lid, aanhef en onderdeel a, subonderdeel 1°, en tweede lid][ref1], die niet beschikt
      over een diploma of certificaat als bedoeld in [artikel 6, tweede lid, van de Wet inburgering 2021][ref2]
      dan wel een diploma, certificaat of ander document als bedoeld in
      [artikel 4, eerste lid, onderdeel b, van de Wet inburgering 2021][ref3] of indien hij het inburgeringsexamen,
      bedoeld in [artikel 7, eerste lid, onderdeel a, van de Wet inburgering][ref4] of een diploma, certificaat of ander
      document als bedoeld in [artikel 5, eerste lid, onderdeel c, van die wet][ref5] niet heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.80a
