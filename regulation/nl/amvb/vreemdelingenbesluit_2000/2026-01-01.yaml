    text: |-
      onder een beperking verband houdend met tijdelijke humanitaire gronden als bedoeld in
      [artikel 3.48, tweede lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.6
    references:
