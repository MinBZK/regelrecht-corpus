    text: |-
      Onze Minister kan het eerste lid voorts buiten toepassing laten, voorzover toepassing daarvan naar zijn oordeel zal
      leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.80a
  - number: 3.80a.5
    text: |-
      Onze Minister kan het eerste lid voorts buiten toepassing laten, indien hij van oordeel is dat de vreemdeling
      aantoonbaar voldoende is ingeburgerd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.80a
  - number: 3.80a.6
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de afwijzing van de aanvraag om wijziging van de
      verblijfsvergunning in andere gevallen dan bedoeld in het eerste lid, en omtrent de toepassing van het tweede lid,
      onder e, het derde lid en het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.80a
  - number: '3.81'
    text: |-
      Onverminderd [artikel 3.80a][ref1], wordt een aanvraag tot het wijzigen van de verblijfsvergunning regulier
      voor bepaalde tijd beoordeeld als een aanvraag tot het verlenen van een verblijfsvergunning, met dien verstande
      dat de [artikelen 3.71][ref2], [3.77][ref3], [3.78][ref4] en [3.79][ref5] niet van toepassing zijn en de
      [artikelen 3.86][ref6] en [3.87][ref7] van overeenkomstige toepassing zijn, indien de aanvraag tijdig is ingediend.


