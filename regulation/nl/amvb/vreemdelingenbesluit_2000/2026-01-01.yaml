        artikel: 59b
  - number: 3.118.2
    text: |-
      De [artikelen 3.117, vijfde tot en met zevende lid][ref1], en [3.116, vijfde en zesde lid][ref2], zijn van
      toepassing. Indien de aanvraag wordt behandeld in een grensprocedure en sprake is van een situatie als bedoeld in
      het eerste lid, onder a, bedraagt de in artikel 3.117, vijfde lid, bedoelde termijn een week.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.118b.1
    text: |-
      Indien de vreemdeling reeds eerder een aanvraag tot het verlenen van een verblijfsvergunning asiel voor bepaalde
      tijd heeft ingediend welke is afgewezen dan wel niet in behandeling is genomen, vangt het onderzoek naar een
      volgende aanvraag aan nadat de vreemdeling schriftelijk, op een door Onze Minister te bepalen wijze, te kennen
      heeft gegeven welke redenen aan die volgende aanvraag ten grondslag liggen. Onze Minister bepaalt met inachtneming
      van de vorige volzin wanneer de in het tweede tot en met achtste lid beschreven procedure aanvangt en deelt de dag
      van aanvang mede aan de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.2
    text: |-
      In het geval, bedoeld in het eerste lid, zijn de [artikelen 3.108d][ref1], [3.109][ref2],
      [3.113, eerste tot en met het achtste lid][ref3], en [3.114, eerste, tweede en zesde lid][ref4], niet van
      toepassing. In plaats daarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.118b.2.a
    text: wordt de vreemdeling op de eerste dag door Onze Minister aan een nader gehoor onderworpen;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.2.b
    text: wordt het afschrift van het verslag van het nader gehoor op de eerste dag aan de vreemdeling ter kennis gebracht;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.2.c
    text: |-
      wordt, indien Onze Minister voornemens is de aanvraag af te wijzen binnen drie dagen, het schriftelijk voornemen
      daartoe op de eerste dag aan de vreemdeling toegezonden of uitgereikt;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.2.d
    text: |-
      brengt de vreemdeling zijn zienswijze op het voornemen uiterlijk op de tweede dag naar voren, waarbij hij tevens
      nadere gegevens kan verstrekken;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.2.e
    text: maakt Onze Minister de beschikking uiterlijk op de derde dag bekend door uitreiking of toezending ervan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.3
    text: |-
      Behoudens in de in artikel 40, zesde lid, van de Procedurerichtlijn bedoelde gevallen, wordt het tweede lid, onder
      a en b, buiten toepassing gelaten indien Onze Minister de kennis omtrent de relevante feiten en de af te wegen
      belangen die nodig is voor het kunnen nemen van de beschikking, kan vergaren zonder nader gehoor.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.4
    text: |-
      In die gevallen waarin met toepassing van het derde lid is afgezien van een nader gehoor, kan Onze Minister naar
      aanleiding van nieuwe elementen of bevindingen of een andere beoordeling van reeds bekende elementen of bevindingen
      bepalen dat het onderzoek naar de aanvraag opnieuw aanvangt met inachtneming van het tweede lid. Onze Minister
      bepaalt in dat geval wanneer de procedure opnieuw aanvangt en deelt de dag van aanvang mede aan de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.5
    text: |-
      Het tweede lid, onder c tot en met e, is niet van toepassing, indien zulks schriftelijk door Onze Minister aan
      de vreemdeling wordt meegedeeld. Bij de mededeling wordt aangegeven of het onderzoek naar de aanvraag al dan
      niet wordt voortgezet in een Aanmeldcentrum, dan wel de in [artikel 3.109c][ref1] beschreven procedure zal worden
      gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.118b.6
    text: 'Bij voortzetting van het onderzoek in een Aanmeldcentrum:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.6.a
    text: |-
      zijn, in afwijking van [artikel 3.110, eerste lid][ref1], voor het onderzoek zes dagen beschikbaar;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.118b.6.b
    text: kan de vreemdeling uit eigen beweging of desgevraagd nadere gegevens verstrekken uiterlijk op de tweede dag;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.6.c
    text: |-
      wordt het schriftelijk voornemen tot afwijzing van de aanvraag toegezonden op de derde dag of uitgereikt op de
      vierde dag;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.6.d
    text: brengt de vreemdeling zijn zienswijze op het voornemen uiterlijk op de vierde dag naar voren;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.6.e
    text: maakt Onze Minister zijn beschikking uiterlijk op de zesde dag bekend door uitreiking of toezending ervan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.7
    text: |-
      Onze Minister kan de in het zesde lid, onder a, bedoelde termijn verlengen. In dat geval zijn, in afwijking van
      [artikel 3.110, tweede lid][ref1], voor het onderzoek in een Aanmeldcentrum ten hoogste twaalf, veertien of twintig
      dagen beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.118b.8
    text: 'Indien Onze Minister de in het zesde lid, onder a, bedoelde termijn heeft verlengd:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.8.a
    text: |-
      brengt de vreemdeling, in afwijking van het zesde lid, onder d, zijn zienswijze uiterlijk op de dag na de
      toezending van het voornemen of op de dag van de uitreiking ervan naar voren, tenzij een met redenen omkleed
      verzoek om verlenging van deze termijn wordt ingewilligd;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.8.b
    text: |-
      maakt Onze Minister, in afwijking van het zesde lid, onder e, zijn beschikking uiterlijk op de twaalfde dag bekend
      door uitreiking of toezending ervan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.9
    text: |-
      Het eerste tot en met achtste lid is van overeenkomstige toepassing, indien reeds eerder een aan de vreemdeling
      verleende verblijfsvergunning asiel voor bepaalde tijd is ingetrokken of reeds eerder een aanvraag tot het
      verlengen van de geldigheidsduur van een dergelijke verblijfsvergunning is afgewezen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: 3.118b.10
    text: |-
      Dit artikel blijft buiten toepassing ten aanzien van de bij ministeriële regeling aan te wijzen categorieën
      vreemdelingen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.118b
  - number: '3.119'
    text: 'Wanneer na het uitreiken of toezenden van het voornemen feiten of omstandigheden:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.119
  - number: 3.119.a
    text: bekend worden, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.119
  - number: 3.119.b
    text: |-
      reeds bekend waren maar naar aanleiding van de zienswijze van de vreemdeling anders worden beoordeeld of gewogen,
      die voor de te nemen beslissing van aanmerkelijk belang kunnen zijn en Onze Minister voornemens blijft de aanvraag
      af te wijzen, wordt dit aan de vreemdeling meegedeeld en wordt hij in de gelegenheid gesteld zijn zienswijze
      daarover naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.119
  - number: '3.121'
    text: 'Bij ministeriele regeling worden voorschriften gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.121
  - number: 3.121.a
    text: het verstrekken van inlichtingen aan de vreemdeling over de te volgen procedure,
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.121
  - number: 3.121.b
    text: het stellen van aantekeningen in het dossier van de vreemdeling ingeval van intrekking van diens aanvraag, en
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.121
  - number: 3.121.c
    text: |-
      de toepassing van [artikel 30c van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30c
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.121
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30c
  - number: 3.121a.1
    text: |-
      Indien de aanvraag wordt afgewezen, voor wat betreft de vluchtelingenstatus of de subsidiaire beschermingsstatus,
      wordt dit feitelijk en juridisch gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.121a
  - number: 3.121a.2
    text: |-
      Indien de aanvraag mede is gedaan namens personen die ten laste van de aanvrager komen en de aanvraag op dezelfde
      gronden gebaseerd is, kan één beslissing worden genomen die geldt voor alle personen, tenzij dat handelen zou
      leiden tot de bekendmaking van specifieke omstandigheden van een aanvrager die zijn belangen zou kunnen schaden,
      met name in gevallen van vervolging op grond van gender, seksuele geaardheid, genderidentiteit of leeftijd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.121a
  - number: 3.121a.3
    text: |-
      Indien een vreemdeling niet wordt bijgestaan of vertegenwoordigd door een juridisch adviseur of een andere
      raadsman, wordt hij in een taal die hij begrijpt of waarvan redelijkerwijze kan worden aangenomen dat hij die
      begrijpt, in kennis gesteld van de beslissing. Daarbij wordt ook informatie verstrekt over de wijze waarop een
      negatieve beslissing kan worden aangevochten.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.121a
  - number: 3.122.1
    text: |-
      Aan de vreemdeling aan wie op grond van [artikel 29, eerste lid, onder a of b, van de Wet][ref1] een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28 van die wet][ref2] is verleend, wordt zo spoedig
      mogelijk na verlening van die verblijfsvergunning in een voor hem begrijpelijke taal informatie verschaft over de
      rechten en plichten die verbonden zijn aan de verblijfsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.122
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.122.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de wijze waarop de informatie,
      bedoeld in het eerste lid, wordt verschaft.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.122
  - number: '3.123'
    text: |-
      Ingeval Onze Minister een verblijfsvergunning asiel voor bepaalde tijd verleent aan een vreemdeling die houder
      is van een EU-verblijfsvergunning voor langdurig ingezetenen, afgegeven door een andere lidstaat van de Europese
      Unie, wordt verzocht aan die lidstaat om een aantekening inzake internationale bescherming op te nemen dan wel te
      wijzigen inhoudend dat Nederland internationale bescherming heeft verleend en de datum waarop.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123
  - number: 3.123a.1
    text: |-
      Indien sprake is of is geweest van een zodanige toename van het aantal asielaanvragen dat daardoor bij de
      behandeling van asielaanvragen een aanzienlijke vertraging is opgetreden of naar verwachting zal optreden en een
      substantieel deel van de asielaanvragen wordt ingediend door vreemdelingen die een bepaalde nationaliteit bezitten
      of behoren tot een bepaalde groep en op basis van het beschikbare bewijs voorzienbaar is dat deze voor inwilliging
      in aanmerking komen, kan Onze Minister besluiten dat voor de behandeling van aanvragen van deze vreemdelingen de in
      deze paragraaf beschreven procedure wordt gevolgd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123a
  - number: 3.123a.2
    text: |-
      Het in het eerste lid bedoelde besluit wordt genomen in overeenstemming met het gevoelen van de ministerraad en
      voor een in het besluit vast te stellen periode van ten hoogste één jaar.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123a
  - number: 3.123a.3
    text: |-
      De geldigheidsduur van het in het eerste lid bedoelde besluit kan, in overeenstemming met het gevoelen van de
      ministerraad, steeds met ten hoogste zes maanden worden verlengd voor zover nog steeds wordt voldaan aan de in het
      eerste lid bedoelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123a
  - number: 3.123a.4
    text: |-
      Onze Minister kan, in overeenstemming met het gevoelen van de ministerraad, het in het eerste lid bedoelde besluit
      op ieder moment intrekken, ook na verlenging van de geldigheidsduur ervan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123a
  - number: 3.123a.5
    text: |-
      Voor zover dit voor een goede invoering en beëindiging van de in deze paragraaf opgenomen procedures
      noodzakelijk is, kunnen bij ministeriële regeling nadere regels worden gesteld omtrent de onderwerpen, bedoeld
      in [artikel 37, eerste lid, onderdelen a en b, van de Wet][ref1], waarbij zo nodig kan worden afgeweken van het
      bepaalde bij of krachtens dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel37
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '37'
  - number: 3.123b.1
    text: |-
      Bij de behandeling van een aanvraag van een vreemdeling als bedoeld in [artikel 3.123a, eerste lid][ref1], zijn
      de[ artikelen 3.109][ref2] en [3.110 tot en met 3.116][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.123b.2
    text: |-
      Na het indienen van de aanvraag door een vreemdeling als bedoeld in [artikel 3.123a, eerste lid][ref1], kan
      onderzoek plaatsvinden naar de identiteit, vingerafdrukken en nationaliteit van de vreemdeling, naar de bij hem
      aangetroffen of door hem overgelegde documenten en bescheiden, dan wel naar de mogelijkheid van toepassing van
      [artikel 30][ref2] of [30a, eerste lid, onderdeel a, b, c of e van de Wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 30a
  - number: 3.123b.3
    text: |-
      Van de vreemdeling worden door Onze Minister een gezichtsopname gemaakt en vingerafdrukken afgenomen en opgeslagen.
      De vreemdeling verleent hieraan zijn medewerking.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123b
  - number: 3.123b.4
    text: |-
      De vreemdeling wordt zo spoedig mogelijk door Onze Minister aan een gehoor onderworpen. Daarbij worden vragen
      gesteld omtrent zijn personalia, zijn geboorteplaats en geboortedatum, zijn nationaliteit en etnische afkomst,
      de datum van zijn vertrek uit het land van herkomst, de datum van zijn aankomst in Nederland, eventueel verblijf
      in derde landen, het bezit van een paspoort en identiteitsdocumenten en de personalia en verblijfplaats van
      familieleden. Tevens wordt de vreemdeling in de gelegenheid gesteld zijn asielmotieven uiteen te zetten.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123b
  - number: 3.123b.5
    text: |-
      Het afschrift van het in het vierde lid bedoelde gehoor wordt zo spoedig mogelijk ter kennis van de vreemdeling
      gebracht.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123b
  - number: 3.123b.6
    text: |-
      Indien het in het vierde lid bedoelde gehoor voldoende grond biedt om de aanvraag in te willigen, wordt de
      beschikking zo spoedig mogelijk bekendgemaakt door uitreiking of toezending ervan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123b
  - number: 3.123b.7
    text: |-
      Indien na het in het vierde lid bedoelde gehoor nog niet kan worden besloten tot inwilliging van de aanvraag, wordt
      voor de verdere behandeling van de aanvraag alsnog de in [paragraaf 2 van deze Afdeling][ref1] beschreven procedure
      gevolgd. Bij deze behandeling worden de door de vreemdeling bij het in het vierde lid bedoelde gehoor afgelegde
      verklaringen over zijn asielmotieven die geen betrekking hebben op daden als bedoeld in artikel 1F van het
      Vluchtelingenverdrag en andere zware strafbare feiten niet betrokken, tenzij de vreemdeling, na overleg met degene
      die hem in de rust- en voorbereidingstermijn bijstaat, aangeeft dat hij wenst dat dit wel gebeurt of de bescherming
      van de nationale veiligheid of de openbare orde dat vereisen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.123b.8
    text: |-
      Het zevende lid is niet van toepassing in de gevallen, bedoeld in [artikel 3.123c, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
  - number: 3.123b.9
    text: |-
      Indien op het moment dat een besluit als bedoeld in het eerste lid van [artikel 3.123a][ref1] van kracht wordt, een
      aanvraag kan worden aangemerkt als een aanvraag van een vreemdeling als bedoeld in die bepaling en het onderzoek
      naar de aanvraag nog niet is gestart, wordt de in dit artikel beschreven procedure gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
  - number: 3.123b.10
    text: |-
      Indien de vreemdeling op het moment dat een besluit als bedoeld in het eerste lid van [artikel 3.123a][ref1] wordt
      ingetrokken, of de geldigheidsduur ervan verstrijkt, reeds is onderworpen aan een gehoor als bedoeld in het vierde
      lid van dit artikel wordt de behandeling van de aanvraag voortgezet met toepassing van de in dit artikel beschreven
      procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
  - number: 3.123c.1
    text: |-
      De bepalingen in deze subparagraaf zijn uitsluitend van toepassing in die gevallen waarin na het in
      [artikel 3.123b, vierde lid][ref1], bedoelde gehoor blijkt dat nader onderzoek naar de identiteit, nationaliteit of
      het behoren tot een bepaalde groep noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123c
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
  - number: 3.123c.2
    text: |-
      Indien deze subparagraaf van toepassing is wordt het gehoor, bedoeld in [artikel 3.123b, vierde lid][ref1],
      aangemerkt als een aanmeldgehoor en zijn voor de verdere behandeling van de aanvraag, in afwijking van de
      [artikelen 3.109][ref2] en [3.110 tot en met 3.116][ref3], de in deze subparagraaf opgenomen bepalingen van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123c
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.123d.1
    text: |-
      De vreemdeling wordt een rust- en voorbereidingstermijn gegeven van ten minste zes dagen. Het onderzoek, bedoeld in
      [artikel 3.123e][ref1], vangt na de rust- en voorbereidingstermijn aan.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
  - number: 3.123d.2
    text: |-
      Gedurende de rust- en voorbereidingstermijn wordt de vreemdeling in de gelegenheid gesteld om te worden voorgelicht
      over de asielprocedure en om zich op de asielprocedure voor te bereiden en zich daartoe te laten bijstaan. De
      vreemdeling wordt in de gelegenheid gesteld om opmerkingen te maken of opheldering te verschaffen over verkeerd
      vertaalde passages of misvattingen in het verslag van het aanmeldgehoor en hem wordt tijdig mededeling gedaan van
      de mogelijkheid zich bij een gehoor als bedoeld in [artikel 3.123f][ref1], te doen bijstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
  - number: 3.123d.3
    text: |-
      De vreemdeling wordt een medisch onderzoek aangeboden. Voor dit onderzoek is de schriftelijke toestemming van de
      vreemdeling vereist.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123d
  - number: 3.123d.4
    text: |-
      [Artikel 3.109, zesde en zevende lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.123e.1
    text: |-
      Voor het onderzoek naar de aanvraag tot het verlenen van de verblijfsvergunning asiel voor bepaalde tijd, zijn in
      een Aanmeldcentrum zes dagen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123e
  - number: 3.123e.2
    text: |-
      Onze Minister kan de in het eerste lid genoemde termijn verlengen. In dat geval zijn voor het onderzoek in een
      Aanmeldcentrum ten hoogste veertien, zestien of tweeëntwintig dagen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123e
  - number: 3.123e.3
    text: |-
      [Artikel 3.110, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123e
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.123e.4
    text: |-
      Onze Minister bepaalt met inachtneming van [artikel 3.123d, eerste lid][ref1], wanneer het onderzoek als bedoeld in
      het eerste lid aanvangt en deelt de dag van aanvang mede aan de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123e
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
  - number: 3.123f.1
    text: |-
      Op de eerste dag wordt de vreemdeling door Onze Minister aan een nader gehoor onderworpen. Bij het afnemen van
      het nader gehoor wordt de vreemdeling in de gelegenheid gesteld om zo volledig mogelijk de tot staving van zijn
      aanvraag noodzakelijke elementen aan te voeren. Dit houdt onder meer in dat de vreemdeling in de gelegenheid wordt
      gesteld om uitleg te geven over eventueel ontbrekende elementen of over inconsistenties of tegenstrijdigheden in
      zijn verklaringen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123f
  - number: 3.123f.2
    text: |-
      Indien Onze Minister voornemens is de aanvraag niet-ontvankelijk te verklaren op grond van
      [artikel 30a van de Wet][ref1], wordt de vreemdeling tijdens het nader gehoor in de gelegenheid gesteld zijn
      standpunt uiteen te zetten over de toepassing van de in artikel 30a, eerste lid, van de Wet bedoelde gronden op
      zijn specifieke omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123f
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30a
  - number: 3.123f.3
    text: |-
      Van het nader gehoor wordt een schriftelijk verslag gemaakt. Een afschrift van het verslag van nader gehoor wordt
      op de eerste dag aan de vreemdeling ter kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123f
  - number: 3.123f.4
    text: |-
      De vreemdeling wordt in de gelegenheid gesteld om uiterlijk op de tweede dag opmerkingen te maken of opheldering te
      verschaffen over verkeerd vertaalde passages of misvattingen in het verslag van het nader gehoor en nadere gegevens
      te verstrekken. De vreemdeling wordt daartoe volledig geïnformeerd over de inhoud van het verslag, zo nodig met
      bijstand van een tolk. De vreemdeling wordt verzocht uiterlijk op de tweede dag schriftelijk te bevestigen dat de
      inhoud van het verslag een correcte afspiegeling is van het nader gehoor. Het verslag van nader gehoor vermeldt
      deze termijn.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123f
  - number: 3.123f.5
    text: |-
      [Artikel 3.113, vijfde tot en met achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123f
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.123g.1
    text: |-
      Indien Onze Minister voornemens is de aanvraag tot het verlenen van de verblijfsvergunning asiel voor bepaalde tijd
      af te wijzen binnen zes dagen, wordt het schriftelijk voornemen daartoe aan de vreemdeling toegezonden op de derde
      dag of aan de vreemdeling uitgereikt op de vierde dag.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123g
  - number: 3.123g.2
    text: |-
      De vreemdeling brengt zijn zienswijze op het in het eerste lid bedoelde voornemen schriftelijk naar voren uiterlijk
      op de vierde dag.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123g
  - number: 3.123g.3
    text: |-
      De schriftelijke zienswijze is tijdig bij Onze Minister ingediend, indien deze voor het einde van de termijn is
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123g
  - number: 3.123g.4
    text: |-
      Het tijdstip van uitreiken van het voornemen en de ontvangst van de schriftelijke zienswijze worden door Onze
      Minister vastgelegd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123g
  - number: 3.123g.5
    text: |-
      Onze Minister houdt rekening met een na afloop van de termijn ontvangen schriftelijke zienswijze, indien de
      beschikking nog niet bekend is gemaakt. Met een na afloop van de termijn ontvangen aanvulling op een eerder
      ingediende schriftelijke zienswijze wordt rekening gehouden, indien de beschikking nog niet bekend is gemaakt en de
      afdoening van de zaak daardoor niet ontoelaatbaar wordt vertraagd. Het ontbreken van de schriftelijke zienswijze,
      na het verstrijken van de termijn waarbinnen de vreemdeling zijn zienswijze schriftelijk naar voren kan brengen,
      staat aan het geven van de beschikking niet in de weg.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123g
  - number: 3.123g.6
    text: Onze Minister maakt de beschikking uiterlijk op de zesde dag bekend door uitreiking of toezending ervan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123g
  - number: 3.123h.1
    text: |-
      Onze Minister kan de in [artikel 3.123e, eerste lid][ref1], genoemde termijn verlengen:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123h
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
  - number: 3.123h.1.a
    text: |-
      in geval van overschrijding van de termijnen, bedoeld in de [artikelen 3.123f, eerste en derde lid][ref1], en
      [3.123g, eerste en zesde lid][ref2], tenzij de overschrijding aan Onze Minister kan worden toegerekend;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123h
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
  - number: 3.123h.1.b
    text: |-
      in geval van overschrijding van de termijnen, bedoeld in de [artikelen 3.123f, vierde lid][ref1], of
      [3.123g, tweede lid][ref2], en de vreemdeling een met redenen omkleed verzoek om verlenging heeft ingediend, tenzij
      de overschrijding aan de vreemdeling kan worden toegerekend;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123h
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
  - number: 3.123h.1.c
    text: |-
      indien naar het oordeel van Onze Minister nader onderzoek naar de identiteit of nationaliteit van de vreemdeling
      noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123h
  - number: 3.123h.1.d
    text: indien de vreemdeling zijn eerder tijdens het onderzoek afgelegde verklaringen essentieel wijzigt of aanvult;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123h
  - number: 3.123h.1.e
    text: |-
      indien naar het oordeel van Onze Minister nader onderzoek noodzakelijk is naar omstandigheden die verband houden
      met de gronden, bedoeld in de artikelen 3.6a, eerste lid, en 6.1e;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123h
  - number: 3.123h.1.f
    text: |-
      indien Onze Minister een medisch onderzoek heeft aangeboden als bedoeld in [artikel 3.109e][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123h
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 3.123h.1.g
    text: |-
      indien de vreemdeling niet is verschenen bij een gehoor, dan wel is verdwenen of vertrokken zonder toestemming van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123h
  - number: 3.123h.2
    text: |-
      De vreemdeling wordt van de verlenging schriftelijk in kennis gesteld. Bij de kennisgeving wordt de reden van de
      verlenging aangegeven alsmede op welk moment de verlengde termijn eindigt.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123h
  - number: 3.123h.3
    text: |-
      Indien Onze Minister de in [artikel 3.123e, eerste lid][ref1], genoemde termijn heeft verlengd en voornemens is de
      aanvraag tot het verlenen van de verblijfsvergunning asiel voor bepaalde tijd af te wijzen binnen veertien, zestien
      of tweeëntwintig dagen, wordt het schriftelijk voornemen daartoe aan de vreemdeling uitgereikt of toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123h
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
  - number: 3.123h.4
    text: |-
      De vreemdeling brengt zijn zienswijze uiterlijk op de dag na de uitreiking of toezending van het voornemen naar
      voren, tenzij een met redenen omkleed verzoek om verlenging van deze termijn wordt ingewilligd.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123h
  - number: 3.123h.5
    text: |-
      [Artikel 3.123g, derde tot en met vijfde lid][ref1], zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123h
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
  - number: 3.123h.6
    text: |-
      Indien er sprake is van een situatie als bedoeld in het eerste lid, onderdeel a tot en met e maakt Onze Minister de
      beschikking uiterlijk op de veertiende dag bekend door uitreiking of toezending ervan. Indien er sprake is van een
      situatie als bedoeld in het eerste lid, onderdeel f, maakt Onze Minister de beschikking uiterlijk op de zestiende
      dag bekend door uitreiking of toezending ervan. Indien er sprake is van een situatie als bedoeld in het eerste
      lid, onderdeel g, maakt Onze Minister de beschikking uiterlijk op de tweeëntwintigste dag bekend door uitreiking of
      toezending ervan.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123h
  - number: 3.123h.7
    text: |-
      Bij ministeriële regeling kunnen nadere regels gesteld worden omtrent de toepassing van het eerste lid alsmede
      de wijze waarop het onderzoek naar de aanvraag wordt vervolgd indien de in [artikel 3.123e, eerste lid][ref1],
      genoemde termijn wordt verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123h
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '5'
  - number: 3.123i
    text: |-
      Indien de termijnen, bedoeld in de [artikelen 3.123f, eerste en derde lid][ref1], of
      [3.123g, eerste en zesde lid][ref2], dan wel de op grond van [artikel 3.123h, eerste lid][ref3], verlengde
      termijn, zijn overschreden, bedraagt de termijn waarbinnen de vreemdeling zijn zienswijze schriftelijk naar
      voren brengt vier weken, tenzij een met redenen omkleed verzoek om verlenging van deze termijn wordt ingewilligd.
      [Artikel 3.116, derde tot zesde lid][ref4], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.123i
