  - number: 3.23a.1
    text: |-
      Wanneer Onze Minister een verblijfsvergunning heeft verleend aan een langdurig ingezetene uit een andere lidstaat
      van de Europese Unie en diens gezin reeds was gevormd in die lidstaat, wordt de verblijfsvergunning voor bepaalde
      tijd, bedoeld in [artikel 3.13, eerste lid][ref1], verleend aan de echtgenoot, de geregistreerde partner dan wel
      de ongehuwde partner van de langdurig ingezetene en het minderjarige kind van die echtgenoot partner of langdurig
      ingezetene, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.23a.1.a
    text: |-
      dat kind, die echtgenoot of partner in een andere staat die partij is bij het Verdrag betreffende de werking van de
      Europese Unie is toegelaten als gezinslid van de langdurig ingezetene;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23a
  - number: 3.23a.1.b
    text: dat kind, die echtgenoot of partner beschikt over een geldig document voor grensoverschrijding;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23a
  - number: 3.23a.1.c
    text: |-
      dat kind, die echtgenoot of partner, al dan niet tezamen met de langdurig ingezetene, duurzaam en zelfstandig
      beschikt over voldoende middelen van bestaan als bedoeld in [artikel 3.74, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.23a
    references:
