    text: medische behandeling;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.1.q
    text: tijdelijke humanitaire gronden;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.1.r
    text: |-
      het afwachten van een verzoek op grond van [artikel 17 van de Rijkswet op het Nederlanderschap][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel17
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '17'
  - number: 3.4.1.s
    text: niet-tijdelijke humanitaire gronden.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.2
    text: |-
      De beperkingen, bedoeld in het eerste lid, kunnen nader worden omschreven bij de verlening van de
      verblijfsvergunning.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.3
    text: |-
      Een beroep op de algemene middelen kan in ieder geval gevolgen hebben voor het verblijfsrecht, indien de
      verblijfsvergunning is verleend onder één van de beperkingen, bedoeld in het eerste lid, met uitzondering van de
      onderdelen q, r en s. Bij ministeriële regeling kunnen regels worden gesteld over deze beperkingen. Indien een
      beroep op de algemene middelen gevolgen kan hebben voor het verblijfsrecht, stelt Onze Minister de vreemdeling
      daarvan vooraf schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.4.4
    text: |-
      De verblijfsvergunning regulier voor bepaalde tijd kan onder een andere beperking dan genoemd in het eerste lid
      worden verleend aan bij ministeriële regeling aangewezen categorieën vreemdelingen. Aanwijzing vindt slechts
      plaats voor zover internationale verplichtingen daartoe nopen dan wel met de aanwezigheid van de desbetreffende
      vreemdelingen een wezenlijk Nederlands belang is gediend. In de ministeriële regeling kunnen hierover nadere regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.4
  - number: 3.5.1
    text: Het verblijfsrecht op grond van de verblijfsvergunning regulier voor bepaalde tijd is tijdelijk of niet-tijdelijk.
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.5
  - number: 3.5.2
    text: |-
      Tijdelijk is het verblijfsrecht op grond van de verblijfsvergunning, verleend onder een beperking verband houdend
      met:
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.5
  - number: 3.5.2.a
    text: 'verblijf als familie- of gezinslid, indien de hoofdpersoon:'
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.5
  - number: 3.5.2.a.1°
    text: tijdelijk verblijfsrecht heeft, of
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.5
  - number: 3.5.2.a.2°
    text: houder van een verblijfsvergunning asiel voor bepaalde tijd is;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.5
  - number: 3.5.2.b
    text: seizoenarbeid;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.5
  - number: 3.5.2.c
    text: overplaatsing binnen een onderneming;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.5
  - number: 3.5.2.d
    text: grensoverschrijdende dienstverlening;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.5
  - number: 3.5.2.e
    text: lerend werken;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.5
  - number: 3.5.2.f
    text: studie;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.5
  - number: 3.5.2.g
    text: het zoeken naar en verrichten van arbeid al dan niet in loondienst;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.5
  - number: 3.5.2.h
    text: uitwisseling, al dan niet in het kader van een verdrag;
    url: https://wetten.overheid.nl/BWBR0011825/2026-01-01#Artikel3.5
  - number: 3.5.2.i
