    text: |-
      Voor de toepassing van [artikel 19][ref1] in samenhang met [artikel 18, eerste lid, onder a, van de Wet][ref2]
      wordt geen verplaatsing van het hoofdverblijf buiten Nederland aangenomen als een onderzoeker of student tijdelijk
