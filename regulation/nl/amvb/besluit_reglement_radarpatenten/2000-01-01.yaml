preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 27 augustus 1999, nr. DGG/J-99005385, Directoraat-
    Generaal Goederenvervoer, Stafafdeling Wetgeving en Juridische Zaken;

    Gelet op de op 17 oktober 1868 te Mannheim tot stand gekomen Herziene Rijnvaartakte (Trb. 1955, 161, en 1964,
    83), de resoluties van de Centrale Commissie voor de Rijnvaart van 26 november 1998 (protocol 1998-II-28) en
    20 mei 1999 (protocol 1999-II-18 en19), artikel 4, eerste lid, onder a, en derde lid, en artikel 14a van de
    Scheepvaartverkeerswet;

    De Raad van State gehoord (advies van 5 november 1999, nr. W09.99.0465/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 25 november 1999, nr. DGG/J-99/008798,
    Directoraat-Generaal Goederenvervoer, Stafafdeling Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010916/2000-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Van toepassing in Nederland is het reglement betreffende het verlenen van radarpatenten, met de daarbij behorende
      bijlagen, dat is opgenomen in de bijlage bij dit besluit en dat wordt aangehaald als: Reglement radarpatenten.

      2 Artikel 1.02, eerste lid, van het Reglement radarpatenten is uitsluitend van toepassing op de Rijn in Nederland,
      met inbegrip van de Waal en de Lek.
    url: https://wetten.overheid.nl/BWBR0010916/2000-01-01#Artikel1
  - number: '2'
    text: Bij ministeriële regeling worden de bevoegde autoriteiten, bedoeld in het Reglement radarpatenten, aangewezen.
    url: https://wetten.overheid.nl/BWBR0010916/2000-01-01#Artikel2
  - number: '3'
    text: |-
      Bij ministeriële regeling kunnen richtlijnen worden vastgesteld voor de bevoegde autoriteiten, overeenkomstig de
      door de Centrale Commissie voor de Rijnvaart aangenomen resoluties, waarbij, zo nodig in afwijking van artikel 1.03
      van het Reglement radarpatenten, voor wat betreft het toepassingsbereik van deze richtlijnen onderscheid kan worden
      gemaakt tussen de Rijn, met inbegrip van de Waal en de Lek, en de overige scheepvaartwegen.
    url: https://wetten.overheid.nl/BWBR0010916/2000-01-01#Artikel3
  - number: '4'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld ter nadere uitvoering van de procedure voor het examen,
      bedoeld in hoofdstuk 3 van het Reglement radarpatenten.
    url: https://wetten.overheid.nl/BWBR0010916/2000-01-01#Artikel4
  - number: '5'
    text: |-
      Bij ministeriële regeling kunnen andere radardiploma's als gelijkwaardig aan het radarpatent, bedoeld in
      het Reglement radarpatenten, worden erkend, waarbij de erkenning beperkt kan worden tot nader te bepalen
      scheepvaartwegen.
    url: https://wetten.overheid.nl/BWBR0010916/2000-01-01#Artikel5
  - number: '7'
    text: |-
      Het besluit van 29 december 1965, houdende het van kracht zijn voor de Rijn in Nederland van het Reglement
      betreffende het verlenen van diploma's voor het voeren van een vaartuig met behulp van radar op de Rijn (Stb. 660),
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010916/2000-01-01#Artikel7
  - number: '8'
    text: Dit besluit treedt in werking met ingang van 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0010916/2000-01-01#Artikel8
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit Reglement radarpatenten.'
    url: https://wetten.overheid.nl/BWBR0010916/2000-01-01#Artikel9
