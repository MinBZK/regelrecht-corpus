  - number: '26.1'
    text: |-
      Binnen een jaar na de inwerkingtreding van dit besluit zendt degene die een inrichting drijft, als bedoeld in
      [artikel 4][ref1], een kennisgeving aan het bevoegd gezag. Deze kennisgeving bevat de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel4
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '4'
        paragraaf: '2'
  - number: 26.1.a
    text: het adres van de inrichting;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: 26.1.b
    text: de naam of de handelsnaam van degene die de inrichting drijft en zijn adres;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: 26.1.c
    text: |-
      de naam en de functie van de met de feitelijke leiding van de inrichting belaste persoon, indien deze een ander is
      dan degene die de inrichting drijft;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: 26.1.d
    text: de aard van de in de inrichting aanwezige gevaarlijke stoffen;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: 26.1.e
    text: |-
      per stof genoemd in [bijlage I, deel 1][ref1], en per categorie stoffen en preparaten genoemd in
      [bijlage I, deel 2][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0010475
      [ref2]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010475
      - id: ref2
        bwb_id: BWBR0010475
  - number: 26.1.e.1°
    text: |-
      de maximale hoeveelheid waarvoor vergunning is verleend dan wel, indien de vergunning hierin niet voorziet, de
      hoeveelheid behorend bij de vergunde maximale capaciteit van de inrichting;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: 26.1.e.2°
    text: de hoeveelheid die bij een normale bedrijfsvoering in de inrichting aanwezig is;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: 26.1.e.3°
    text: de fysische vorm van de betrokken gevaarlijke stof of stoffen;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: 26.1.f
    text: |-
      met het oog op de vaststelling van domino-effecten: voor gevaarlijke stoffen behorend tot de categorie ontplofbaar,
      ontvlambaar, licht ontvlambaar of zeer licht ontvlambaar, bedoeld in [bijlage I, deel 2][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: 26.1.f.1°
    text: een aanduiding van het grootste insluitsysteem;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: 26.1.f.2°
    text: de maximale hoeveelheid van de betrokken gevaarlijke stof die daarin aanwezig kan zijn;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: 26.1.f.3°
    text: een aanduiding van de betrokken gevaarlijke stof alsmede een aanduiding van de categorie waartoe die stof behoort;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: 26.1.f.4°
    text: de plaats van het insluitsysteem in de inrichting;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: 26.1.f.5°
    text: de druk en de temperatuur van de betrokken stoffen en preparaten in het insluitsysteem;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: 26.1.g
    text: de activiteiten die in de inrichting worden uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: 26.1.h
    text: |-
      de met de onmiddellijke omgeving van de inrichting samenhangende omstandigheden die een zwaar ongeval kunnen
      veroorzaken of de gevolgen daarvan ernstiger kunnen maken.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: '26.2'
    text: |-
      Indien de in het eerste lid bedoelde gegevens op grond van een ander wettelijk voorschrift schriftelijk aan
      het bevoegd gezag zijn verstrekt op een tijdstip, niet eerder dan 5 jaar voorafgaande aan het in het eerste lid
      genoemde tijdstip, en ten aanzien van de onderwerpen waarop die gegevens betrekking hebben geen wijzigingen zijn
      opgetreden, kan worden volstaan met een schriftelijke mededeling aan het bevoegd gezag, waarin naar die gegevens
      wordt verwezen.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: '26.3'
    text: |-
      Op een kennisgeving als bedoeld in het eerste lid of een mededeling als bedoeld in het tweede lid, is
      [artikel 6, tweede lid][ref1], van overeenkomstige toepassing. Indien overeenkomstig het tweede lid wordt verwezen
      naar eerder verstrekte gegevens, draagt het bevoegd gezag tevens zorg voor de verzending van die gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel6
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '6'
        paragraaf: '2'
  - number: '26.4'
    text: |-
      De in het eerste lid, onder f, bedoelde gegevens behoeven niet te worden verstrekt indien ten genoegen van het
      bevoegd gezag wordt aangetoond dat voor een verhoging van de risico's, bedoeld in [artikel 7, eerste lid][ref1],
      niet behoeft te worden gevreesd.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel7
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '7'
        paragraaf: '2'
  - number: '26.5'
    text: Onze Ministers kunnen nadere regels stellen met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel26
  - number: '27.1'
    text: |-
      Degene die op het tijdstip waarop dit besluit in werking treedt, een inrichting drijft, als bedoeld in
      [artikel 4][ref1], stelt binnen een jaar na dat tijdstip voor de eerste keer het document, bedoeld in
      [artikel 5, tweede lid][ref2], op.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel5
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '5'
        paragraaf: '2'
  - number: '27.2'
    text: Het eerste lid is eveneens van toepassing indien het document wordt opgenomen in het veiligheidsrapport.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel27
  - number: '27.3'
    text: |-
      Degene die op het tijdstip waarop dit besluit in werking treedt, een inrichting drijft, als bedoeld in
      [artikel 8][ref1], stelt binnen drie maanden na dat tijdstip voor de eerste keer de stoffenlijst, bedoeld in
      [artikel 21][ref2], op.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel21
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '21'
        paragraaf: '3'
  - number: '28.1'
    text: |-
      Degene die op het tijdstip, waarop dit besluit in werking treedt, een inrichting drijft als bedoeld in
      [artikel 8][ref1], waarop paragraaf 3 van het Besluit risico's zware ongevallen dan wel artikel 5 van de
      Arbeidsomstandighedenwet op de dag voorafgaande aan de inwerkingtreding van dit besluit niet van toepassing was,
      zendt uiterlijk 3 februari 2002 een veiligheidsrapport aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel8
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '8'
        paragraaf: '3'
  - number: '28.2'
    text: |-
      Degene die op het tijdstip, waarop dit besluit in werking treedt, een inrichting drijft, als bedoeld in
      [artikel 8][ref1], waarop paragraaf 3 van het Besluit risico's zware ongevallen dan wel artikel 5 van de
      Arbeidsomstandighedenwet op de dag voorafgaande aan de inwerkingtreding van dit besluit van toepassing was, zendt
      uiterlijk 3 februari 2001 een veiligheidsrapport aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel8
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '8'
        paragraaf: '3'
  - number: '28.3'
    text: |-
      Indien op degene die een inrichting drijft het tweede lid van toepassing is en deze op enig tijdstip in de periode
      van vijf jaar direct voorafgaande aan de dag van de indiening van het veiligheidsrapport heeft zorggedragen voor:
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel28
  - number: 28.3.a
    text: |-
      opstelling of wijziging van een arbeidsveiligheidsrapport als bedoeld in artikel 5 van de Arbeidsomstandighedenwet,
      zoals dat op de dag voorafgaand aan de inwerkingtreding van dit besluit luidde, en voor verzending ervan aan de
      daartoe aangewezen ambtenaar, bedoeld in [artikel 24, eerste lid, van de Arbeidsomstandighedenwet 1998, ][ref1]of


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 28.3.b
    text: |-
      de indiening van een rapport inzake de externe veiligheid als bedoeld in artikel 4 van het in het tweede lid
      genoemde besluit,
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel28
  - number: '28.4'
    text: |-
      Indien bij de verzending van het veiligheidsrapport aan het bevoegd gezag met toepassing van het derde lid is
      verwezen naar een arbeidsveiligheidsrapport als bedoeld in artikel 5 van de Arbeidsomstandighedenwet of naar
      een rapport inzake de externe veiligheid als bedoeld in artikel 4 van het in het tweede lid genoemde besluit,
      worden de in die rapporten vervatte gegevens waarnaar is verwezen ter voldoening aan de verplichting, bedoeld
      in [artikel 14, eerste lid][ref1], geëvalueerd en wordt een bijgewerkt veiligheidsrapport aan het bevoegd gezag
      gezonden binnen vijf jaar nadat de gegevens waarnaar verwijzing heeft plaatsgevonden werden verzonden aan de
      daartoe aangewezen ambtenaar, bedoeld in [artikel 24, eerste lid, van de Arbeidsomstandighedenwet 1998][ref2]
      onderscheidenlijk binnen vijf jaar nadat die gegevens werden verzonden aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '14'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
  - number: '29'
    text: |-
      Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid worden regels gesteld met betrekking tot de
      gegevens die diegene die een inrichting drijft na een zwaar ongeval verstrekt aan de aangewezen ambtenaar, bedoeld
      in [artikel 24 van de Arbeidsomstandighedenwet 1998][ref1] en met betrekking tot het toezicht door die ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: '31'
    text: Het Besluit risico's zware ongevallen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel31
  - number: '35'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel35
  - number: '36'
    text: 'Dit besluit wordt aangehaald als: Besluit risico''s zware ongevallen 1999.'
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel36
