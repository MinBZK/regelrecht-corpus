preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 23 juli 1998, nr.
    MJZ 98.0655984, Centrale Directie Juridische Zaken, Afdeling Wetgeving, mede namens Onze Minister van Binnenlandse
    Zaken en de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Gelet op de artikelen 8.5, 8.22, derde lid, 8.44, 19.3, eerste lid, en 21.8 van de Wet milieubeheer, 5, eerste
    lid, en 5a, eerste lid, van de Arbeidsomstandighedenwet, 13 van de Brandweerwet 1985 en 2c, 25a en 25b van de Wet
    rampen en zware ongevallen, alsmede Richtlijn nr. 96/82/EG van de Raad van de Europese Unie van 9 december 1996
    betreffende de beheersing van de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken (PbEG
    L 10);

    De Raad van State gehoord (advies van 28 augustus 1998, nr. W08.98.0384);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 19 mei
    1999, nr. MJZ99167397, Centrale Directie Juridische Zaken, Afdeling Wetgeving, mede namens de Staatssecretaris
    van Binnenlandse Zaken en Koninkrijksrelaties en de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F.
    Hoogervorst;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel1
  - number: 1.a
    text: |-
      inrichting: inrichting die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] aangewezen
      categorie behoort;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.b
    text: |-
      gevaarlijke stoffen: stoffen, mengsels of preparaten, genoemd in [bijlage I, deel 1][ref1], of behorend tot
      een categorie, genoemd in [bijlage I, deel 2][ref2], en aanwezig als grondstof, product, bijproduct, residu of
      tussenprodukt, met inbegrip van stoffen, mengsels of preparaten waarvan redelijkerwijs kan worden verwacht dat zij
      door het onbeheersbaar worden van een industrieel chemisch proces ontstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0010475
      [ref2]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010475
      - id: ref2
        bwb_id: BWBR0010475
  - number: 1.c
    text: |-
      opslag in verband met vervoer van gevaarlijke stoffen: opslag van verpakte gevaarlijke stoffen gedurende korte tijd
      en in afwachting van aansluitend vervoer naar een vooraf bekende ontvanger, met inbegrip van het laden en lossen
      van die stoffen en de overbrenging daarvan naar of van een andere tak van vervoer, voor zover daadwerkelijk in
      aansluitend vervoer is voorzien en de betrokken gevaarlijke stoffen in hun oorspronkelijke verpakking blijven;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel1
  - number: 1.d
    text: |-
      werkgever: werkgever, bedoeld in [artikel 1, eerste en tweede lid, van de Arbeidsomstandighedenwet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '1'
  - number: 1.e
    text: |-
      werknemer: werknemer, bedoeld in [artikel 1, eerste en tweede lid, van de Arbeidsomstandighedenwet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '1'
  - number: 1.f
    text: |-
      zwaar ongeval: gebeurtenis als gevolg van onbeheersbare ontwikkelingen tijdens de bedrijfsuitoefening in een
      inrichting, waardoor hetzij onmiddellijk, hetzij na verloop van tijd ernstig gevaar voor de gezondheid van de
      mens binnen of buiten de inrichting of voor het milieu ontstaat en waarbij een of meer gevaarlijke stoffen zijn
      betrokken;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel1
  - number: 1.g
    text: |-
      Onze Ministers: Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van Binnenlandse Zaken
      en Koninkrijksrelaties en van Sociale Zaken en Werkgelegenheid;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel1
  - number: 1.h
    text: |-
      bevoegd gezag: bestuursorgaan dat bevoegd is een vergunning krachtens [artikel 8.1 van de Wet milieubeheer][ref1]
      te verlenen voor een inrichting waarop dit besluit van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.i
    text: |-
      inspecteur: inspecteur bedoeld in [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.j
    text: |-
      veiligheidsrapport: rapport als bedoeld in [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel10
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '10'
        paragraaf: '3'
  - number: 1.k
    text: 'bijlage: bij dit besluit behorende bijlage;'
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel1
  - number: 1.l
    text: |-
      installatie: technische eenheid binnen een inrichting waar gevaarlijke stoffen worden vervaardigd, gebruikt,
      gebezigd, verwerkt of opgeslagen; daartoe wordt mede gerekend alle uitrusting, constructies, leidingen, machines,
      gereedschappen, eigen spoorwegemplacementen, laad- en loskades, aanlegsteigers voor de installatie, pieren, depots
      of soortgelijke, al dan niet drijvende constructies, die nodig zijn voor de werking van de installatie;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel1
  - number: 1.m
    text: |-
      het ADR: de op 30 september 1957 te Genève totstandgekomen Europese Overeenkomst betreffende het internationale
      vervoer van gevaarlijke goederen over de weg (Trb. 1959, 171).
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel1
  - number: '2'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel2
  - number: 2.a
    text: inrichtingen in gebruik bij de krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel2
  - number: 2.b
    text: |-
      inrichtingen voor zover daarvoor een vergunning is vereist of algemene voorschriften gelden krachtens de
      [Kernenergiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002402
  - number: 2.c
    text: |-
      inrichtingen die krachtens [artikel 1, onderdeel n, van de Mijnbouwwet][ref1] aangewezen zijn als mijnbouwwerken,
      met uitzondering van inrichtingen waar chemische of thermische verwerkingsactiviteiten en de daarmee
      verbandhoudende opslag van gevaarlijke stoffen plaatsvinden;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 2.d
    text: |-
      inrichtingen voor het op of in de bodem brengen van afvalstoffen om ze daar te laten, met uitzondering van
      inrichtingen die in werking zijn voor het zich ontdoen van residuen, waaronder residuvijvers of -bekkens, die
      gevaarlijke stoffen bevatten, in het bijzonder indien zij worden gebruikt in verband met chemische of thermische
      verwerking van mineralen;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel2
  - number: 2.e
    text: |-
      inrichtingen die geheel of nagenoeg geheel zijn bestemd voor de opslag in verband met vervoer van gevaarlijke
      stoffen, al dan niet in combinatie met andere stoffen en producten;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel2
  - number: 2.f
    text: spoorwegemplacementen, voor zover zij geen onderdeel zijn van een inrichting waarop dit besluit van toepassing is;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel2
  - number: 2.g
    text: |-
      inrichtingen die krachtens [artikel 1, onderdeel n, van de Mijnbouwwet][ref1] aangewezen zijn als mijnbouwwerken
      ten behoeve van het opsporen en winnen van delfstoffen als bedoeld in [artikel 1, onderdeel a, van die wet][ref2],
      voorzover het opsporen en winnen van die delfstoffen plaatsvindt op het continentaal plat, bedoeld in
      [artikel 1, onderdeel c, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '1'
  - number: '3.1'
    text: |-
      Indien de werkgever een ander is dan degene die de inrichting drijft, is het bij en krachtens dit besluit bepaalde
      van overeenkomstige toepassing op de werkgever voor zover het betreft de bescherming van de veiligheid en de
      gezondheid van de in het bedrijf, de inrichting of een onderdeel daarvan werkzame werknemers.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel3
  - number: '3.2'
    text: |-
      De werkgever en degene die de inrichting drijft, geven onverminderd hun eigen verantwoordelijkheid gezamenlijk
      en in overleg uitvoering aan het bij en krachtens dit besluit bepaalde met betrekking tot de bescherming van de
      veiligheid en de gezondheid van de in het eerste lid bedoelde werknemers.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel3
  - number: '4.1'
    text: |-
      De in deze paragraaf gegeven voorschriften gelden ten aanzien van inrichtingen waarin gevaarlijke stoffen krachtens
      vergunning aanwezig mogen zijn of ten gevolge van het onbeheersbaar worden van een industrieel chemisch proces
      kunnen worden gevormd:
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel4
  - number: 4.1.a
    text: |-
      in een hoeveelheid, gelijk aan of groter dan de in [bijlage I, deel 1, tweede kolom][ref1], dan wel
      [bijlage I, deel 2, tweede kolom][ref2], bij de desbetreffende stof of categorie vermelde hoeveelheid;


      [ref1]: https://wetten.overheid.nl/BWBR0010475
      [ref2]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010475
      - id: ref2
        bwb_id: BWBR0010475
  - number: 4.1.b
    text: |-
      in kleinere dan de onder a bedoelde hoeveelheden, waarvan de som na toepassing van de formule die in
      [bijlage I, deel 3][ref1], is weergegeven, gelijk is aan of groter is dan de daar genoemde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: '4.2'
    text: |-
      Indien een gevaarlijke stof of groep van gevaarlijke stoffen genoemd in [bijlage I, deel 1][ref1], tevens behoort
      tot een categorie genoemd in [bijlage I, deel 2][ref2], geldt voor de toepassing van het eerste lid de in deel 1
      bij die stof of groep van stoffen vermelde drempelwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
      [ref2]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010475
      - id: ref2
        bwb_id: BWBR0010475
  - number: '5.1'
    text: |-
      Degene die een inrichting drijft, treft alle maatregelen die nodig zijn om zware ongevallen te voorkomen en de
      gevolgen daarvan voor mens en milieu te beperken.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel5
  - number: '5.2'
    text: |-
      Degene die een inrichting drijft, heeft in de inrichting een document voorhanden waarin het door hem gevoerde
      beleid ter voorkoming van zware ongevallen, rekening houdend met de aanwezigheid en de omvang van de risico's, is
      vastgelegd. Dit document bevat de algemene doelstellingen en beginselen van het beleid inzake de beheersing van de
      risico's van zware ongevallen. Degene die een inrichting drijft, als bedoeld in [artikel 8][ref1], mag het document
      opnemen in het veiligheidsrapport.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel8
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '8'
        paragraaf: '3'
  - number: '5.3'
    text: |-
      Ten einde het in het tweede lid bedoelde beleid te bepalen en uit te voeren, voert degene die een inrichting
      drijft, een veiligheidsbeheerssysteem in. In het veiligheidsbeheerssysteem komen de elementen, genoemd in
      [bijlage II][ref1] aan de orde.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: '5.4'
    text: |-
      Indien in de inrichting of een onderdeel daarvan of in de werking van de inrichting of van dat onderdeel een
      verandering wordt aangebracht die voor de risico's van een zwaar ongeval belangrijke gevolgen kan hebben,
      draagt degene die de inrichting drijft, er voor zorg dat het beleid ter voorkoming van zware ongevallen en het
      veiligheidsbeheerssysteem opnieuw worden beoordeeld en indien nodig worden herzien en dat het document, bedoeld
      in het tweede lid, dienovereenkomstig wordt gewijzigd. Een zodanige beoordeling onderscheidenlijk herziening vindt
      tevens plaats indien een verandering in het veiligheidsinzicht daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel5
  - number: '5.5'
    text: Onze Ministers kunnen nadere regels stellen met betrekking tot het tweede tot en met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel5
  - number: '6.1'
    text: 'Degene die de inrichting drijft, stelt het bevoegd gezag onverwijld schriftelijk in kennis van:'
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel6
  - number: 6.1.a
    text: |-
      iedere significante wijziging van de inrichting die betrekking heeft op een of meer
      onderwerpen waaromtrent in of bij de aanvraag gegevens zijn verstrekt als bedoeld in
      [artikel 5.15a, eerste lid, onder a tot en met f, van het Inrichtingen- en vergunningenbesluit milieubeheer][ref1],
      of waaromtrent in de kennisgeving, bedoeld in [artikel 26, eerste lid][ref2], gegevens zijn verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0005829#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel26
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005829
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '26'
        paragraaf: '4'
  - number: 6.1.b
    text: iedere significante wijziging van de processen waarbij een gevaarlijke stof wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel6
  - number: 6.1.c
    text: elke significante wijziging van de inrichting die het risico van zware ongevallen ernstig zou kunnen beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel6
  - number: 6.1.d
    text: de sluiting van een installatie.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel6
  - number: '6.2'
    text: |-
      Het bevoegd gezag zendt zo spoedig mogelijk, doch uiterlijk binnen twee weken na ontvangst, een exemplaar van de
      kennisgeving, bedoeld in het eerste lid, aan:
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel6
  - number: 6.2.a
    text: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel6
  - number: 6.2.b
    text: de inspecteur;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel6
  - number: 6.2.c
    text: |-
      de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen ambtenaar, bedoeld in
      [artikel 24 van de Arbeidsomstandighedenwet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 6.2.d
    text: |-
      gedeputeerde staten van de provincie waarin de inrichting geheel of gedeeltelijk is gelegen, tenzij gedeputeerde
      staten het bevoegd gezag zijn;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel6
  - number: 6.2.e
    text: |-
      burgemeester en wethouders van de gemeente waarin de inrichting geheel of gedeeltelijk is gelegen, tenzij
      burgemeester en wethouders het bevoegd gezag zijn, en de burgemeester van die gemeente en
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel6
  - number: 6.2.f
    text: het bestuur van de regionale brandweer binnen wier gebied de inrichting geheel of gedeeltelijk is gelegen.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel6
  - number: '6.3'
    text: |-
      Indien de gegevens, bedoeld in het eerste lid, reeds op grond van een ander wettelijk voorschrift aan het bevoegd
      gezag zijn verstrekt, kan in de kennisgeving worden volstaan met een verwijzing naar die gegevens.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel6
  - number: '7.1'
    text: |-
      Het bevoegd gezag wijst op grond van de gegevens, bedoeld in de [artikelen 6, eerste lid][ref1],
      [10, eerste lid][ref2], [26, eerste lid, van dit besluit][ref3] en
      [5.15a, eerste lid, van het Inrichtingen- en vergunningenbesluit milieubeheer][ref4], inrichtingen of groepen
      inrichtingen aan ten aanzien waarvan de risico's van een zwaar ongeval of de gevolgen daarvan ten gevolge van de
      ligging van die inrichtingen ten opzichte van elkaar en de aanwezigheid van gevaarlijke stoffen in die inrichtingen
      groter kunnen zijn dan op grond van de in die afzonderlijke inrichtingen aanwezige hoeveelheden kan worden
      verwacht. De aanwijzing geschiedt in overeenstemming met:


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0005829#Artikel5
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '10'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0010475
        artikel: '26'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0005829
        artikel: '5'
  - number: 7.1.a
    text: |-
      de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen ambtenaar, bedoeld in
      [artikel 24 van de Arbeidsomstandighedenwet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 7.1.b
    text: |-
      burgemeester en wethouders van de gemeente of gemeenten waarin de inrichtingen geheel of gedeeltelijk zijn gelegen,
      en
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel7
  - number: 7.1.c
    text: |-
      het bestuur van de regionale brandweer of de besturen van de regionale brandweren in wier gebied de inrichtingen
      geheel of gedeeltelijk zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel7
  - number: '7.2'
    text: |-
      Van een aanwijzing als bedoeld in het eerste lid stelt het bevoegd gezag diegenen die de betrokken inrichtingen
      drijven, in kennis.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel7
  - number: '7.3'
    text: |-
      Degene die een inrichting drijft, als bedoeld in het eerste lid, wisselt met diegenen die de andere op
      grond van het eerste lid aangewezen inrichtingen drijven de gegevens uit die noodzakelijk zijn voor de
      beoordeling van het in dat lid bedoelde risico. Hij houdt in zijn beleid ter voorkoming van zware ongevallen,
      bedoeld in [artikel 5, tweede lid][ref1], en, voor zover van toepassing, in het intern noodplan, bedoeld in
      [artikel 22][ref2], en in het veiligheidsrapport rekening met de aard en de omvang van de risico's van een zwaar
      ongeval bij de naburige inrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel22
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '22'
        paragraaf: '3'
  - number: '7.4'
    text: |-
      Het bevoegd gezag doet een aanwijzing als bedoeld in het eerste lid voor de eerste maal uiterlijk vier jaar na de
      inwerkingtreding van dit besluit en vervolgens tenminste om de vijf jaar.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel7
  - number: '7.5'
    text: Onze Ministers kunnen nadere regels stellen met betrekking tot het eerste en het derde lid.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel7
  - number: '8.1'
    text: |-
      De in deze paragraaf gegeven voorschriften gelden ten aanzien van inrichtingen waarin gevaarlijke stoffen krachtens
      vergunning aanwezig mogen zijn of ten gevolge van het onbeheersbaar worden van een industrieel chemisch proces
      kunnen worden gevormd:
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel8
  - number: 8.1.a
    text: |-
      in een hoeveelheid, gelijk aan of groter dan de in [bijlage I, deel 1, derde kolom][ref1], dan wel
      [bijlage I, deel 2, derde kolom][ref2], bij de desbetreffende stof of categorie vermelde hoeveelheid;


      [ref1]: https://wetten.overheid.nl/BWBR0010475
      [ref2]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010475
      - id: ref2
        bwb_id: BWBR0010475
  - number: 8.1.b
    text: |-
      in kleinere dan de onder a bedoelde hoeveelheden, waarvan de som na toepassing van de formule die in
      [bijlage I, deel 3][ref1], is weergegeven, gelijk is aan of groter is dan de daar genoemde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: '8.2'
    text: |-
      Indien een gevaarlijke stof of groep van gevaarlijke stoffen genoemd in [bijlage I, deel 1][ref1], tevens behoort
      tot een categorie genoemd in [bijlage I, deel 2][ref2], geldt voor de toepassing van het eerste lid de in deel 1
      bij die stof of groep van stoffen vermelde drempelwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
      [ref2]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010475
      - id: ref2
        bwb_id: BWBR0010475
  - number: '9'
    text: |-
      Degene die een inrichting drijft, zorgt er voor dat in de inrichting een veiligheidsrapport aanwezig is dat de
      actuele stand van zaken met betrekking tot de veiligheid van de betrokken inrichting weergeeft.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel9
  - number: '10.1'
    text: |-
      Een veiligheidsrapport bevat de gegevens en beschrijvingen, bedoeld in [bijlage III][ref1], op zodanige wijze dat
      wordt aangetoond dat:


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: 10.1.a
    text: een beleid ter voorkoming van zware ongevallen en een veiligheidsbeheerssysteem is ingevoerd;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel10
  - number: 10.1.b
    text: |-
      de gevaren van zware ongevallen geïdentificeerd zijn en de nodige maatregelen zijn getroffen om die te voorkomen en
      de gevolgen van dergelijke ongevallen voor mens en milieu te beperken;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel10
  - number: 10.1.c
    text: |-
      het ontwerp, de constructie, de exploitatie en het onderhoud van alle met de werking van de inrichting
      samenhangende installaties, opslagplaatsen, apparatuur en infrastructuur die samenhangen met de gevaren van een
      zwaar ongeval binnen de inrichting voldoende veilig en betrouwbaar zijn;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel10
  - number: 10.1.d
    text: |-
      een intern noodplan, als bedoeld in [artikel 22][ref1], is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel22
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '22'
        paragraaf: '3'
  - number: '10.2'
    text: |-
      Onze Ministers kunnen nadere regels stellen met betrekking tot de in het eerste lid bedoelde gegevens en
      beschrijvingen.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel10
  - number: '10.3'
    text: |-
      Bij door Onze Ministers te stellen regels kan aan het bevoegd gezag onder daarbij te stellen voorwaarden de
      bevoegdheid worden verleend te besluiten dat het veiligheidsrapport geen betrekking behoeft te hebben op een
      in de inrichting of een onderdeel daarvan aanwezige stof, ten aanzien waarvan degene die de inrichting drijft
      ten genoegen van het bevoegd gezag aantoont dat die stof onder zodanige omstandigheden in de inrichting of het
      betrokken onderdeel aanwezig is, dat deze geen gevaar voor een zwaar ongeval kan opleveren.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel10
  - number: '10.4'
    text: 'Het bevoegd gezag neemt zijn beslissing in overeenstemming met:'
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel10
  - number: 10.4.a
    text: |-
      de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen ambtenaar, bedoeld in
      [artikel 24 van de Arbeidsomstandighedenwet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 10.4.b
    text: |-
      burgemeester en wethouders van de gemeente waarin de inrichting geheel of gedeeltelijk is gelegen, tenzij
      burgemeester en wethouders het bevoegd gezag zijn, en de burgemeester van die gemeente;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel10
  - number: 10.4.c
    text: het bestuur van de regionale brandweer binnen wier gebied de inrichting geheel of gedeeltelijk is gelegen.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel10
  - number: '10.5'
    text: |-
      Het bevoegd gezag zendt een exemplaar van een besluit, als bedoeld in het vierde lid, aan Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel10
  - number: '12'
    text: |-
      De [artikelen 15][ref1], [16][ref2] en [18][ref3] zijn niet van toepassing op de onderdelen van een
      veiligheidsrapport die bij een aanvraag om een vergunning als bedoeld in de [artikelen 5.15][ref4], [5.17][ref5]
      of [5.18 van het Inrichtingen- en vergunningenbesluit milieubeheer][ref6] worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0005829#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005829#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005829#Artikel5
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '15'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '16'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0010475
        artikel: '18'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005829
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005829
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005829
        artikel: '5'
  - number: '13.1'
    text: |-
      Indien een aanvraag als bedoeld in [artikel 12][ref1] wordt ingediend, bevat het veiligheidsrapport
      mede de gegevens, bedoeld in [bijlage III, onder 1, onder e, 3°, en onder r][ref2].
      [Artikel 5.15, derde en vierde lid, van het Inrichtingen- en vergunningenbesluit milieubeheer][ref3] is van
      overeenkomstige toepassing op de gegevens, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0010475
      [ref3]: https://wetten.overheid.nl/BWBR0005829#Artikel5
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '12'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010475
      - id: ref3
        bwb_id: BWBR0005829
        artikel: '5'
  - number: '13.2'
    text: |-
      Degene die een inrichting gaat drijven, zendt voordat de inrichting of een onderdeel daarvan in
      werking wordt gebracht, ter completering van de onderdelen van het veiligheidsrapport bedoeld in
      [artikel 5.15 van het Inrichtingen- en vergunningenbesluit milieubeheer][ref1] en van de gegevens, bedoeld in
      het eerste lid, aan het bevoegd gezag de gegevens die een veiligheidsrapport dient te bevatten en die nog niet
      krachtens dat artikel en krachtens het eerste lid zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005829#Artikel5
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005829
        artikel: '5'
  - number: '13.3'
    text: |-
      Degene die een inrichting drijft zendt telkens voordat een verandering van de inrichting of van de werking
      daarvan of een verandering van de installatie of van de werking daarvan wordt aangebracht die voor de
      risico's van een zwaar ongeval belangrijke gevolgen kan hebben aan het bevoegd gezag die onderdelen van het
      veiligheidsrapport die nodig zijn voor de beoordeling van de risico's die samenhangen met die verandering.
      Daartoe zendt hij, voor zover van toepassing, ter completering van de onderdelen van het veiligheidsrapport
      bedoeld in [artikel 5.17 van het Inrichtingen- en vergunningenbesluit milieubeheer][ref1] en van de gegevens,
      bedoeld in het eerste lid, dan wel ter completering van de gegevens die bij de melding overeenkomstig
      [artikel 8.19 van de Wet milieubeheer][ref2] zijn verstrekt, aan het bevoegd gezag de gegevens die een
      veiligheidsrapport dient te bevatten en die nog niet krachtens die artikelen en krachtens het eerste lid zijn
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005829#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005829
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '13.4'
    text: |-
      De [artikelen 16 tot en met 18][ref1] zijn van overeenkomstige toepassing op de gegevens, bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel16
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '16'
        paragraaf: '3'
  - number: '13.5'
    text: |-
      De [artikelen 15 tot en met 18][ref1] zijn van overeenkomstige toepassing op de aanvullende gegevens, bedoeld in
      het tweede lid en het derde lid, tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel15
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '15'
        paragraaf: '3'
  - number: '14.1'
    text: |-
      Degene die een inrichting drijft, evalueert het veiligheidsrapport tenminste eenmaal per vijf jaar en zendt daarna
      onverwijld een bijgewerkt veiligheidsrapport aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel14
  - number: '14.2'
    text: |-
      In afwijking van het eerste lid zendt degene die een inrichting drijft op enig ander tijdstip op eigen initiatief
      dan wel op verzoek van het bevoegd gezag een veiligheidsrapport aan het bevoegd gezag, indien nieuwe feiten, nieuwe
      kennis over veiligheid of ontwikkelingen in de kennis inzake de evaluatie van gevaren daartoe aanleiding geven. Het
      bevoegd gezag doet dit verzoek na overleg met de in [artikel 6, tweede lid, onder b en c][ref1] bedoelde ambtenaren
      en de onder d tot en met f genoemde bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel6
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '6'
        paragraaf: '2'
  - number: '14.3'
    text: |-
      Voor die onderdelen van het veiligheidsrapport die ten opzichte van het vorige veiligheidsrapport niet zijn
      gewijzigd, kan worden volstaan met een verwijzing naar het veiligheidsrapport waarin die onderdelen volledig zijn
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel14
  - number: '14.4'
    text: |-
      Onze Ministers kunnen nadere regels stellen met betrekking tot de gegevens die in een geval als bedoeld in het
      derde lid in ieder geval moeten worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel14
  - number: '15.1'
    text: Het bevoegd gezag tekent na ontvangst van een veiligheidsrapport daarop onverwijld de datum van ontvangst aan.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel15
  - number: '15.2'
    text: Het zendt degene die het rapport heeft ingediend onverwijld een bewijs van ontvangst, waarin die datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel15
  - number: '15.3'
    text: |-
      Het bevoegd gezag zendt uiterlijk binnen twee weken het veiligheidsrapport of de gewijzigde gedeelten daarvan, of,
      indien toepassing is gegeven aan [artikel 16, vierde lid][ref1], de aanvullingen op het rapport, en elk verzoek
      krachtens [artikel 14, tweede lid][ref2], aan:


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel14
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '16'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '14'
        paragraaf: '3'
  - number: 15.3.a
    text: |-
      de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen ambtenaar, bedoeld in
      [artikel 24 van de Arbeidsomstandighedenwet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 15.3.b
    text: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel15
  - number: 15.3.c
    text: de inspecteur;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel15
  - number: 15.3.d
    text: |-
      burgemeester en wethouders van de gemeente waarin de inrichting geheel of gedeeltelijk is gelegen, tenzij
      burgemeester en wethouders het bevoegd gezag zijn, en de burgemeester van die gemeente;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel15
  - number: 15.3.e
    text: het bestuur van de regionale brandweer binnen wier gebied de inrichting geheel of gedeeltelijk is gelegen.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel15
  - number: '15.4'
    text: |-
      Het bevoegd gezag stelt het bestuursorgaan dat tot het verlenen van de vergunning krachtens de
      [Wet verontreiniging oppervlaktewateren][ref1] bevoegd is, in de gelegenheid advies uit te brengen over die
      onderdelen van het veiligheidsrapport, die betrekking hebben op de risico's voor het oppervlaktewater.


      [ref1]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002682
  - number: '16.1'
    text: |-
      De in [artikel 15, derde lid][ref1], genoemde bestuursorganen en de daartoe door Onze Minister van Sociale Zaken
      en Werkgelegenheid aangewezen ambtenaar, bedoeld in [artikel 24 van de Arbeidsomstandighedenwet 1998][ref2],
      beoordelen het veiligheidsrapport en stellen door tussenkomst van het bevoegd gezag degene die de inrichting
      drijft, binnen zes maanden na de ontvangst van het veiligheidsrapport schriftelijk in kennis van hun oordeel over
      de aanvaardbaarheid van de in het rapport weergegeven risico's.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '15'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
  - number: '16.2'
    text: |-
      De in het eerste lid bedoelde termijn kan eenmaal met ten hoogste drie maanden worden verlengd. Van deze verlenging
      wordt door tussenkomst van het bevoegd gezag mededeling gedaan aan degene die de inrichting drijft.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel16
  - number: '16.3'
    text: |-
      De in het eerste lid bedoelde beoordeling vindt plaats nadat onderzocht is of het veiligheidsrapport
      voldoet aan [artikel 10, eerste lid][ref1], aan [bijlage III][ref2] en aan het gestelde krachtens
      [artikel 10, tweede lid][ref3], en na een op dat rapport gebaseerde inspectie ter plaatse.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0010475
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Artikel10
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010475
      - id: ref3
        bwb_id: BWBR0010475
        artikel: '10'
        paragraaf: '3'
  - number: '16.4'
    text: |-
      Indien een van de in het eerste lid bedoelde bestuursorganen of de daar bedoelde ambtenaar van oordeel is dat
      het veiligheidsrapport onvoldoende is om de aanvaardbaarheid te beoordelen verzoekt dat bestuursorgaan of die
      ambtenaar, door tussenkomst van het bevoegd gezag, binnen acht weken na de ontvangst van het veiligheidsrapport om
      aanvullende inlichtingen te verstrekken binnen een bij het verzoek te stellen termijn van ten hoogste zes weken.
      De in het eerste lid bedoelde termijn van zes maanden wordt opgeschort met ingang van de dag dat het in de eerste
      volzin bedoelde verzoek is gedaan tot de dag waarop de aanvullende inlichtingen zijn verstrekt of de daarvoor
      gestelde termijn ongebruikt is verstreken. Het bevoegd gezag stelt de in het eerste lid bedoelde bestuursorganen en
      de daar bedoelde ambtenaar van het verzoek in kennis.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel16
  - number: '17'
    text: |-
      De stukken bedoeld in de [artikelen 13][ref1], [14][ref2] en [16, vierde lid][ref3], worden in zevenvoud ingediend.
      Op verzoek van het bevoegd gezag worden meer exemplaren daarvan verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Artikel16
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '13'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '14'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0010475
        artikel: '16'
        paragraaf: '3'
  - number: '18.1'
    text: |-
      Uiterlijk twee weken nadat het bevoegd gezag de bevindingen, bedoeld in [artikel 16, eerste lid][ref1], heeft
      bekendgemaakt, doet het bevoegd gezag van deze bevindingen en van het veiligheidsrapport gelijktijdig mededeling
      door:


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel16
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '16'
        paragraaf: '3'
  - number: 18.1.a
    text: terinzagelegging;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel18
  - number: 18.1.b
    text: kennisgeving in een of meer dag-, nieuws- of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel18
  - number: '18.2'
    text: |-
      De mededeling strekt mede ter voldoening aan de verplichting die ingevolge
      [artikel 10c, eerste lid, van de Wet rampen en zware ongevallen][ref1] rust op het
      college van burgemeester en wethouders en ter voldoening aan de verplichting die ingevolge
      [artikel 7 van de Arbeidsomstandighedenwet 1998][ref2] rust op de door Onze Minister van Sociale Zaken en
      Werkgelegenheid aangewezen ambtenaar, bedoeld in [artikel 24 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel10c
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: 10c
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '24'
  - number: '18.3'
    text: |-
      Gedurende vier weken vanaf de dag waarop het veiligheidsrapport ter inzage is gelegd, kunnen de stukken worden
      ingezien op een tijd en plaats die bij de mededeling, bedoeld in het eerste lid, is vermeld.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel18
  - number: '18.4'
    text: |-
      Gelijktijdig met de mededeling, bedoeld in het eerste lid, zendt het bevoegd gezag een exemplaar van het
      veiligheidsrapport aan:
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel18
  - number: 18.4.a
    text: |-
      burgemeester en wethouders van de gemeente waarin de inrichting geheel of gedeeltelijk is gelegen, tenzij
      burgemeester en wethouders het bevoegd gezag zijn, en de burgemeester van die gemeente;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel18
  - number: 18.4.b
    text: |-
      burgemeester en wethouders van de gemeenten waarvan het grondgebied is gelegen binnen de lijn van 10-8 individueel
      risico, bedoeld in [bijlage III, onder 2, onder c][ref1], en de burgemeester van die gemeenten;


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: 18.4.c
    text: de commissaris van de Koningin in de provincie waarin een gemeente als bedoeld onder a of b is gelegen;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel18
  - number: 18.4.d
    text: het bestuur van de regionale brandweer binnen wier gebied een gemeente als bedoeld onder a of b is gelegen;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel18
  - number: 18.4.e
    text: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel18
  - number: 18.4.f
    text: |-
      het bestuursorgaan dat bevoegd is tot verlening van de vergunning krachtens de
      [Wet verontreiniging oppervlaktewateren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002682
  - number: '18.5'
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt, indien de lijn van 10-8 individueel
      risico, bedoeld in [bijlage III, onder 2, onder c][ref1], zich uitstrekt over het grondgebied van een andere staat
      een exemplaar aan die staat. In dat geval zendt hij tevens een exemplaar aan Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: '18.6'
    text: |-
      In een geval als bedoeld in het vijfde lid, eerste volzin, zendt Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer, indien krachtens [artikel 19.3 van de Wet milieubeheer][ref1] een tweede tekst is
      overgelegd, een exemplaar van deze tekst aan de betrokken staat.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
  - number: '19'
    text: |-
      Als gegevens als bedoeld in [artikel 19.3, eerste lid, laatste volzin, van de Wet milieubeheer][ref1] worden
      persoonlijke gegevens aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
  - number: '20'
    text: |-
      Met betrekking tot een inrichting waarop dit besluit van toepassing is beziet het bevoegd gezag telkens
      of de beperkingen waaronder de vergunning krachtens [artikel 8.1 van de Wet milieubeheer][ref1] is
      verleend, en de voorschriften die daaraan zijn verbonden, aanpassing behoeven op grond van de in het
      veiligheidsrapport genoemde maatregelen en op grond van de gegevens met betrekking tot de risico's, bedoeld in
      [bijlage III, onder 2, onder b en c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0010475
  - number: '21.1'
    text: |-
      Degene die een inrichting drijft, houdt een bijgewerkte lijst van in de inrichting aanwezige gevaarlijke
      stoffen bij en zorgt er voor dat deze lijst door een ieder kan worden geraadpleegd. Indien krachtens
      [artikel 19.3 van de Wet milieubeheer][ref1] een tweede tekst van het veiligheidsrapport is overgelegd waar uit de
      beschrijving van de stoffen ingevolge [Bijlage III, eerste lid, onderdeel j][ref2], stoffen zijn weggelaten, blijft
      vermelding van die stoffen op de lijst, bedoeld in de eerste zin, achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0010475
  - number: '21.2'
    text: Onze Ministers kunnen nadere regels stellen met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel21
  - number: '22.1'
    text: |-
      Degene die een inrichting drijft, stelt een intern noodplan op voor bij een zwaar ongeval binnen de inrichting ten
      uitvoer te leggen maatregelen, gericht op het beperken en beheersen van zware ongevallen en de gevolgen ervan voor
      de werknemers. Het interne noodplan bevat tenminste de gegevens en beschrijvingen, bedoeld in [bijlage IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: '22.2'
    text: |-
      Degene die een inrichting drijft draagt er zorg voor dat het interne noodplan tenminste eens per drie jaar wordt
      geëvalueerd, beproefd en zonodig gewijzigd. Bij de evaluatie wordt rekening gehouden met veranderingen die zich
      in de inrichting hebben voorgedaan, en met nieuwe kennis en inzichten omtrent de bij een zwaar ongeval te nemen
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel22
  - number: '22.3'
    text: |-
      Het interne noodplan en de wijziging daarvan worden, bij het ontbreken van een ondernemingsraad of
      personeelsvertegenwoordiging, opgesteld met raadpleging van de belanghebbende werknemers. Over het interne noodplan
      en de wijziging daarvan worden tevens de werknemers geraadpleegd van andere werkgevers die op basis van een
      langlopende overeenkomst tot aanneming van werk mede in de inrichting werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel22
  - number: '22.4'
    text: 'Het interne noodplan wordt vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel22
  - number: 22.4.a
    text: 'voor inrichtingen die na de inwerkingtreding van dit besluit worden opgericht: voor de inbedrijfstelling er van;'
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel22
  - number: 22.4.b
    text: |-
      voor inrichtingen die voor de inwerkingtreding van dit besluit niet verplicht waren tot opstelling van een rapport
      inzake de externe veiligheid op grond van de [Wet milieubeheer][ref1] of een arbeidsveiligheidsrapport op grond van
      de [Arbeidsomstandighedenwet 1998][ref2]: binnen drie jaar na de inwerkingtreding van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0010346
  - number: 22.4.c
    text: 'voor andere inrichtingen: binnen twee jaar na de inwerkingtreding van dit besluit.'
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel22
  - number: '23'
    text: |-
      Een inrichting of een onderdeel daarvan mag niet in werking worden gebracht of gehouden, indien degene die de
      inrichting drijft duidelijk onvoldoende maatregelen heeft getroffen ter voorkoming van zware ongevallen of ter
      beperking van de gevolgen daarvan, voor zover het betreft de bescherming van de veiligheid en de gezondheid van de
      in het bedrijf, de inrichting onderscheidenlijk het betrokken onderdeel daarvan werkzame werknemers.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel23
  - number: '24.1'
    text: |-
      Het bevoegd gezag stelt op grond van de gegevens, bedoeld in de [artikelen 6, eerste lid][ref1],
      [10, eerste lid][ref2], en [26, eerste lid][ref3], in overeenstemming met de daartoe door Onze Minister van Sociale
      Zaken en Werkgelegenheid aangewezen ambtenaar, bedoeld in artikel 24 van de Arbeidsomstandighedenwet 1998, en
      burgemeester en wethouders van de gemeente waarin de inrichting geheel of in hoofdzaak is gelegen, een zodanig
      inspectieprogramma vast dat daarmee een planmatig en systematisch onderzoek van de in de inrichting gebruikte
      systemen van technische, organisatorische en bedrijfskundige aard kan worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Artikel26
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '10'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0010475
        artikel: '26'
        paragraaf: '4'
  - number: '24.2'
    text: |-
      Bij een inspectie die in het kader van het inspectieprogramma wordt uitgevoerd, wordt in ieder geval gecontroleerd
      of hetgeen in de inrichting wordt aangetroffen in overeenstemming is met de verplichtingen die voortvloeien uit de
      [artikelen 5][ref1], [6][ref2], [10][ref3] en [26][ref4], teneinde na te gaan of:


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0010475#Artikel26
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0010475
        artikel: '10'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0010475
        artikel: '26'
        paragraaf: '4'
  - number: 24.2.a
    text: |-
      degene die de inrichting drijft kan aantonen dat hij passende maatregelen heeft getroffen om zware ongevallen te
      voorkomen;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel24
  - number: 24.2.b
    text: |-
      degene die de inrichting drijft kan aantonen dat hij in passende middelen heeft voorzien om de gevolgen van zware
      ongevallen op en buiten het bedrijfsterrein te beperken;
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel24
  - number: 24.2.c
    text: de verstrekte gegevens en informatie de situatie in de inrichting trouw weergeven.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel24
  - number: '24.3'
    text: |-
      Na iedere inspectie als bedoeld in het tweede lid stelt het bestuursorgaan dat, of de aangewezen ambtenaar die de
      inspectie heeft uitgevoerd een rapport op dan wel, indien de inspectie door meer dan één bestuursorgaan, al dan
      niet tezamen met de aangewezen ambtenaar, is uitgevoerd, stellen deze een gezamenlijk rapport op. Een exemplaar van
      het rapport wordt gezonden aan degene die de inrichting drijft. Indien het rapport daartoe aanleiding geeft, wordt
      dit binnen een redelijke termijn na de inspectie met degene die de inrichting drijft, besproken.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel24
  - number: '24.4'
    text: |-
      Binnen een jaar na de inwerkingtreding van dit besluit stelt het bevoegd gezag voor de eerste maal een
      inspectieprogramma vast als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel24
  - number: '24.5'
    text: |-
      Een inspectie als bedoeld in het tweede lid wordt met betrekking tot een inrichting waarop paragraaf 3 van
      toepassing is, tenminste eenmaal per jaar uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel24
  - number: '24.6'
    text: |-
      Het vijfde lid is niet van toepassing indien het bevoegd gezag het in het eerste lid bedoelde inspectieprogramma
      heeft vastgesteld op grond van een systematische evaluatie van de gevaren van zware ongevallen.
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel24
  - number: '25.1'
    text: |-
      De handeling of het nalaten in strijd met het ter uitvoering van
      [artikel 10a, eerste lid, van de Wet rampen en zware ongevallen][ref1] in de [artikelen 13, eerste lid][ref2],
      [14][ref3], [16, vierde lid][ref4], en de nadere regels, bedoeld in [artikel 14, vierde lid][ref5], bepaalde, is
      een strafbaar feit als bedoeld in [artikel 1a, onder 1°, van de Wet op de economische delicten][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0010475#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0010475#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '13'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0010475
        artikel: '14'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0010475
        artikel: '16'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0010475
        artikel: '14'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0002063
        artikel: 1a
  - number: '25.2'
    text: |-
      De handeling of het nalaten in strijd met het ter uitvoering van
      [artikel 6, eerste lid, tweede volzin, Arbeidsomstandighedenwet 1998][ref1] in de [artikelen 3, tweede lid][ref2],
      [5, eerste tot en met vierde lid][ref3], [6, eerste lid][ref4], [7, derde lid][ref5], [9][ref6],
      [13, tweede en derde lid][ref7], [14, eerste en tweede lid][ref8], [16, vierde lid][ref9], [17][ref10],
      [21, eerste lid][ref11], [22, eerste tot en met derde lid][ref12], [23][ref13], [26, eerste lid][ref14],
      [27, eerste en derde lid][ref15], [28, eerste, tweede en vierde lid][ref16], en [29][ref17] bepaalde is een
      strafbaar feit als bedoeld in [artikel 1, onder 3° van de Wet op de economische delicten][ref18].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0010475#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0010475#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0010475#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0010475#Artikel13
      [ref8]: https://wetten.overheid.nl/BWBR0010475#Artikel14
      [ref9]: https://wetten.overheid.nl/BWBR0010475#Artikel16
      [ref10]: https://wetten.overheid.nl/BWBR0010475#Artikel17
      [ref11]: https://wetten.overheid.nl/BWBR0010475#Artikel21
      [ref12]: https://wetten.overheid.nl/BWBR0010475#Artikel22
      [ref13]: https://wetten.overheid.nl/BWBR0010475#Artikel23
      [ref14]: https://wetten.overheid.nl/BWBR0010475#Artikel26
      [ref15]: https://wetten.overheid.nl/BWBR0010475#Artikel27
      [ref16]: https://wetten.overheid.nl/BWBR0010475#Artikel28
      [ref17]: https://wetten.overheid.nl/BWBR0010475#Artikel29
      [ref18]: https://wetten.overheid.nl/BWBR0002063#Artikel1
    url: https://wetten.overheid.nl/BWBR0010475/2005-10-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '6'
