  - number: '26'
    text: |-
      1 Binnen een jaar na de inwerkingtreding van dit besluit zendt degene die een inrichting drijft, als bedoeld in
      [artikel 4][ref1], een kennisgeving aan het bevoegd gezag. Deze kennisgeving bevat de volgende gegevens:

      a. het adres van de inrichting;

      b. de naam of de handelsnaam van degene die de inrichting drijft en zijn adres;

      c. de naam en de functie van de met de feitelijke leiding van de inrichting belaste persoon, indien deze een ander
      is dan degene die de inrichting drijft;

      d. de aard van de in de inrichting aanwezige gevaarlijke stoffen;

      e. per stof genoemd in [bijlage I, deel 1][ref2], en per categorie stoffen en preparaten genoemd in
      [bijlage I, deel 2][ref3]:

      1°. de maximale hoeveelheid waarvoor vergunning is verleend dan wel, indien de vergunning hierin niet voorziet, de
      hoeveelheid behorend bij de vergunde maximale capaciteit van de inrichting;

      2°. de hoeveelheid die bij een normale bedrijfsvoering in de inrichting aanwezig is;

      3°. de fysische vorm van de betrokken gevaarlijke stof of stoffen;

      f. met het oog op de vaststelling van domino-effecten: voor gevaarlijke stoffen behorend tot de categorie
      ontplofbaar, ontvlambaar, licht ontvlambaar of zeer licht ontvlambaar, bedoeld in [bijlage I, deel 2][ref4]:

      1°. een aanduiding van het grootste insluitsysteem;

      2°. de maximale hoeveelheid van de betrokken gevaarlijke stof die daarin aanwezig kan zijn;

      3°. een aanduiding van de betrokken gevaarlijke stof alsmede een aanduiding van de categorie waartoe die stof
      behoort;

      4°. de plaats van het insluitsysteem in de inrichting;

      5°. de druk en de temperatuur van de betrokken stoffen en preparaten in het insluitsysteem;

      g. de activiteiten die in de inrichting worden uitgeoefend;

      h. de met de onmiddellijke omgeving van de inrichting samenhangende omstandigheden die een zwaar ongeval kunnen
      veroorzaken of de gevolgen daarvan ernstiger kunnen maken.

      2 Indien de in het eerste lid bedoelde gegevens op grond van een ander wettelijk voorschrift schriftelijk aan
      het bevoegd gezag zijn verstrekt op een tijdstip, niet eerder dan 5 jaar voorafgaande aan het in het eerste lid
      genoemde tijdstip, en ten aanzien van de onderwerpen waarop die gegevens betrekking hebben geen wijzigingen zijn
      opgetreden, kan worden volstaan met een schriftelijke mededeling aan het bevoegd gezag, waarin naar die gegevens
      wordt verwezen.

      3 Op een kennisgeving als bedoeld in het eerste lid of een mededeling als bedoeld in het tweede lid, is
      [artikel 6, tweede lid][ref5], van overeenkomstige toepassing. Indien overeenkomstig het tweede lid wordt verwezen
      naar eerder verstrekte gegevens, draagt het bevoegd gezag tevens zorg voor de verzending van die gegevens.

      4 De in het eerste lid, onder f, bedoelde gegevens behoeven niet te worden verstrekt indien ten genoegen van het
      bevoegd gezag wordt aangetoond dat voor een verhoging van de risico's, bedoeld in [artikel 7, eerste lid][ref6],
      niet behoeft te worden gevreesd.

      5 Onze Ministers kunnen nadere regels stellen met betrekking tot het eerste lid.


