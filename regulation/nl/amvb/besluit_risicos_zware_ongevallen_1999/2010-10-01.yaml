      1 Degene die op het tijdstip, waarop dit besluit in werking treedt, een inrichting drijft als bedoeld in
      [artikel 8][ref1], waarop paragraaf 3 van het Besluit risico's zware ongevallen dan wel artikel 5 van de
      Arbeidsomstandighedenwet op de dag voorafgaande aan de inwerkingtreding van dit besluit niet van toepassing was,
      zendt uiterlijk 3 februari 2002 een veiligheidsrapport aan het bevoegd gezag.

      2 Degene die op het tijdstip, waarop dit besluit in werking treedt, een inrichting drijft, als bedoeld in
      [artikel 8][ref2], waarop paragraaf 3 van het Besluit risico's zware ongevallen dan wel artikel 5 van de
      Arbeidsomstandighedenwet op de dag voorafgaande aan de inwerkingtreding van dit besluit van toepassing was, zendt
      uiterlijk 3 februari 2001 een veiligheidsrapport aan het bevoegd gezag.

      3 Indien op degene die een inrichting drijft het tweede lid van toepassing is en deze op enig tijdstip in de
      periode van vijf jaar direct voorafgaande aan de dag van de indiening van het veiligheidsrapport heeft zorggedragen
      voor:

      a. opstelling of wijziging van een arbeidsveiligheidsrapport als bedoeld in artikel 5 van de
      Arbeidsomstandighedenwet, zoals dat op de dag voorafgaand aan de inwerkingtreding van dit besluit luidde, en voor
      verzending ervan aan de daartoe aangewezen toezichthouder, of

      b. de indiening van een rapport inzake de externe veiligheid als bedoeld in artikel 4 van het in het tweede lid
      genoemde besluit,

      is [artikel 14, derde en vierde lid][ref3], van overeenkomstige toepassing voor zover de in het
      arbeidsveiligheidsrapport onderscheidenlijk de in het rapport inzake de externe veiligheid opgenomen gegevens
      en beschrijvingen voldoen aan hetgeen bij en krachtens dit besluit is bepaald omtrent de inhoud van het
      veiligheidsrapport.

      4 Indien bij de verzending van het veiligheidsrapport aan het bevoegd gezag met toepassing van het derde lid
      is verwezen naar een arbeidsveiligheidsrapport als bedoeld in artikel 5 van de Arbeidsomstandighedenwet of naar
      een rapport inzake de externe veiligheid als bedoeld in artikel 4 van het in het tweede lid genoemde besluit,
      worden de in die rapporten vervatte gegevens waarnaar is verwezen ter voldoening aan de verplichting, bedoeld
      in [artikel 14, eerste lid][ref4], geëvalueerd en wordt een bijgewerkt veiligheidsrapport aan het bevoegd gezag
      gezonden binnen vijf jaar nadat de gegevens waarnaar verwijzing heeft plaatsgevonden werden verzonden aan de
      daartoe aangewezen toezichthouder onderscheidenlijk binnen vijf jaar nadat die gegevens werden verzonden aan het
      bevoegd gezag.


