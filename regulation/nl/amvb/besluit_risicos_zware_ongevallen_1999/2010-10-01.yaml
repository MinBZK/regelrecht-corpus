        artikel: '6'
        paragraaf: '2'
  - number: '15'
    text: |-
      1 Het bevoegd gezag tekent na ontvangst van een veiligheidsrapport daarop onverwijld de datum van ontvangst aan.

      2 Het zendt degene die het rapport heeft ingediend onverwijld een bewijs van ontvangst, waarin die datum is
      vermeld.

      3 Het bevoegd gezag zendt uiterlijk binnen twee weken het veiligheidsrapport of de gewijzigde gedeelten daarvan,
      of, indien toepassing is gegeven aan [artikel 16, vierde lid][ref1], de aanvullingen op het rapport, en elk verzoek
      krachtens [artikel 14, tweede lid][ref2], aan:

      a. de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder;

      b. burgemeester en wethouders van de gemeente waarin de inrichting geheel of gedeeltelijk is gelegen, tenzij
      burgemeester en wethouders het bevoegd gezag zijn, en

      c. het bestuur van de veiligheidsregio waarin de inrichting geheel of gedeeltelijk is gelegen.

      4 Het bevoegd gezag stelt het bestuursorgaan dat tot het verlenen van de vergunning krachtens de [Waterwet][ref3]
      bevoegd is, in de gelegenheid advies uit te brengen over die onderdelen van het veiligheidsrapport, die betrekking
      hebben op de risico's voor een oppervlaktewaterlichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0025458
