  - number: '9'
    text: |-
      Degene die een inrichting drijft, zorgt er voor dat in de inrichting een veiligheidsrapport aanwezig is dat de
      actuele stand van zaken met betrekking tot de veiligheid van de betrokken inrichting weergeeft.
    url: https://wetten.overheid.nl/BWBR0010475/2010-10-01#Artikel9
  - number: '10'
    text: |-
      1 Een veiligheidsrapport bevat de gegevens en beschrijvingen, bedoeld in [bijlage III][ref1], op zodanige wijze dat
      wordt aangetoond dat:

      a. een beleid ter voorkoming van zware ongevallen en een veiligheidsbeheerssysteem is ingevoerd;

      b. de gevaren van zware ongevallen geïdentificeerd zijn en de nodige maatregelen zijn getroffen om die te voorkomen
      en de gevolgen van dergelijke ongevallen voor mens en milieu te beperken;

      c. het ontwerp, de constructie, de exploitatie en het onderhoud van alle met de werking van de inrichting
      samenhangende installaties, opslagplaatsen, apparatuur en infrastructuur die samenhangen met de gevaren van een
      zwaar ongeval binnen de inrichting voldoende veilig en betrouwbaar zijn;

      d. een intern noodplan, als bedoeld in [artikel 22][ref2], is gemaakt.

      2 Onze Ministers kunnen nadere regels stellen met betrekking tot de in het eerste lid bedoelde gegevens en
      beschrijvingen.

      3 Bij door Onze Ministers te stellen regels kan aan het bevoegd gezag onder daarbij te stellen voorwaarden de
      bevoegdheid worden verleend te besluiten dat het veiligheidsrapport geen betrekking behoeft te hebben op een
      in de inrichting of een onderdeel daarvan aanwezige stof, ten aanzien waarvan degene die de inrichting drijft
      ten genoegen van het bevoegd gezag aantoont dat die stof onder zodanige omstandigheden in de inrichting of het
      betrokken onderdeel aanwezig is, dat deze geen gevaar voor een zwaar ongeval kan opleveren.

      4 Het bevoegd gezag neemt zijn beslissing in overeenstemming met:

      a. de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder;

      b. het bestuur van de veiligheidsregio waarin de inrichting geheel of gedeeltelijk is gelegen.

      5 Het bevoegd gezag zendt een exemplaar van een besluit, als bedoeld in het vierde lid, aan Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel22
