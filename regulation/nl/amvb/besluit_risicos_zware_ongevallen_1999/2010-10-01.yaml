articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. inrichting: inrichting die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] aangewezen
      categorie behoort;

      b. gevaarlijke stoffen: stoffen, mengsels of preparaten, genoemd in [bijlage I, deel 1][ref2], of behorend tot
      een categorie, genoemd in [bijlage I, deel 2][ref3], en aanwezig als grondstof, product, bijproduct, residu of
      tussenprodukt, met inbegrip van stoffen, mengsels of preparaten waarvan redelijkerwijs kan worden verwacht dat zij
      door het onbeheersbaar worden van een industrieel chemisch proces ontstaan;

      c. opslag in verband met vervoer van gevaarlijke stoffen: opslag van verpakte gevaarlijke stoffen gedurende korte
      tijd en in afwachting van aansluitend vervoer naar een vooraf bekende ontvanger, met inbegrip van het laden en
      lossen van die stoffen en de overbrenging daarvan naar of van een andere tak van vervoer, voor zover daadwerkelijk
      in aansluitend vervoer is voorzien en de betrokken gevaarlijke stoffen in hun oorspronkelijke verpakking blijven;

      d. werkgever: werkgever, bedoeld in [artikel 1, eerste en tweede lid, van de Arbeidsomstandighedenwet][ref4];

      e. werknemer: werknemer, bedoeld in [artikel 1, eerste en tweede lid, van de Arbeidsomstandighedenwet][ref5];

      f. zwaar ongeval: gebeurtenis als gevolg van onbeheersbare ontwikkelingen tijdens de bedrijfsuitoefening in een
      inrichting, waardoor hetzij onmiddellijk, hetzij na verloop van tijd ernstig gevaar voor de gezondheid van de
      mens binnen of buiten de inrichting of voor het milieu ontstaat en waarbij een of meer gevaarlijke stoffen zijn
      betrokken;

      g. Onze Ministers: Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van Binnenlandse
      Zaken en Koninkrijksrelaties en van Sociale Zaken en Werkgelegenheid;

      h. bevoegd gezag: bestuursorgaan dat bevoegd is een omgevingsvergunning te verlenen voor een inrichting waarop dit
      besluit van toepassing is;

      i. inspecteur: inspecteur bedoeld in [artikel 1.1, eerste lid, van de Wet milieubeheer][ref6];

      j. veiligheidsrapport: rapport als bedoeld in [artikel 10][ref7];

      k. bijlage: bij dit besluit behorende bijlage;

      l. installatie: technische eenheid binnen een inrichting waar gevaarlijke stoffen worden vervaardigd, gebruikt,
      gebezigd, verwerkt of opgeslagen; daartoe wordt mede gerekend alle uitrusting, constructies, leidingen, machines,
      gereedschappen, eigen spoorwegemplacementen, laad- en loskades, aanlegsteigers voor de installatie, pieren, depots
      of soortgelijke, al dan niet drijvende constructies, die nodig zijn voor de werking van de installatie;

      m. het ADR: de op 30 september 1957 te Genève totstandgekomen Europese Overeenkomst betreffende het internationale
      vervoer van gevaarlijke goederen over de weg (Trb. 1959, 171);

      n. plaatsgebonden risico: risico op een plaats buiten een inrichting, uitgedrukt als de kans per jaar dat een
      persoon die onafgebroken en onbeschermd op die plaats zou verblijven, overlijdt als rechtstreeks gevolg van een
      ongewoon voorval binnen die inrichting waarbij een of meer gevaarlijke stoffen betrokken zijn;

      o. toezichthouder: de toezichthouder, bedoeld in
      [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref8].


