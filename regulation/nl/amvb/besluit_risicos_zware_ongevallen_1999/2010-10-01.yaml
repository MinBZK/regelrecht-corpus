  - number: '5'
    text: |-
      1 Degene die een inrichting drijft, treft alle maatregelen die nodig zijn om zware ongevallen te voorkomen en de
      gevolgen daarvan voor mens en milieu te beperken.

      2 Degene die een inrichting drijft, heeft in de inrichting een document voorhanden waarin het door hem gevoerde
      beleid ter voorkoming van zware ongevallen, rekening houdend met de aanwezigheid en de omvang van de risico's, is
      vastgelegd. Dit document bevat de algemene doelstellingen en beginselen van het beleid inzake de beheersing van de
      risico's van zware ongevallen. Degene die een inrichting drijft, als bedoeld in [artikel 8][ref1], mag het document
      opnemen in het veiligheidsrapport.

      3 Ten einde het in het tweede lid bedoelde beleid te bepalen en uit te voeren, voert degene die een inrichting
      drijft, een veiligheidsbeheerssysteem in. In het veiligheidsbeheerssysteem komen de elementen, genoemd in
      [bijlage II][ref2] aan de orde.

      4 Indien in de inrichting of een onderdeel daarvan of in de werking van de inrichting of van dat onderdeel
      een verandering wordt aangebracht die voor de risico's van een zwaar ongeval belangrijke gevolgen kan hebben,
      draagt degene die de inrichting drijft, er voor zorg dat het beleid ter voorkoming van zware ongevallen en het
      veiligheidsbeheerssysteem opnieuw worden beoordeeld en indien nodig worden herzien en dat het document, bedoeld
      in het tweede lid, dienovereenkomstig wordt gewijzigd. Een zodanige beoordeling onderscheidenlijk herziening vindt
      tevens plaats indien een verandering in het veiligheidsinzicht daartoe aanleiding geeft.

      5 Onze Ministers kunnen nadere regels stellen met betrekking tot het tweede tot en met het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2010-10-01#Artikel5
