  - number: '13'
    text: |-
      1 Indien een aanvraag als bedoeld in [artikel 12][ref1] wordt ingediend, bevat het veiligheidsrapport
      mede de gegevens, bedoeld in [bijlage III, onder 1, onder e, 3°, en onder r][ref2].
      [Artikel 6.15, eerste en derde lid, van het Besluit omgevingsrecht][ref3] is van overeenkomstige toepassing op de
      gegevens, bedoeld in de eerste volzin.

      2 Degene die een inrichting gaat drijven, zendt voordat de inrichting of een onderdeel daarvan in
      werking wordt gebracht, ter completering van de onderdelen van het veiligheidsrapport bedoeld in
      [artikel 4.13, eerste lid, van de Regeling omgevingsrecht][ref4] en van de gegevens, bedoeld in het eerste lid, aan
      het bevoegd gezag de gegevens die een veiligheidsrapport dient te bevatten en die nog niet krachtens dat artikel en
      krachtens het eerste lid zijn verstrekt.

      3 Degene die een inrichting drijft zendt telkens voordat een verandering van de inrichting of van de werking
      daarvan of een verandering van de installatie of van de werking daarvan wordt aangebracht die voor de
      risico's van een zwaar ongeval belangrijke gevolgen kan hebben aan het bevoegd gezag die onderdelen van het
      veiligheidsrapport die nodig zijn voor de beoordeling van de risico's die samenhangen met die verandering. Daartoe
      zendt hij, voor zover van toepassing, ter completering van de onderdelen van het veiligheidsrapport bedoeld in
      [artikel 4.17 van de Regeling omgevingsrecht][ref5] en van de gegevens, bedoeld in het eerste lid, aan het bevoegd
      gezag de gegevens die een veiligheidsrapport dient te bevatten en die nog niet krachtens die artikelen en krachtens
      het eerste lid zijn verstrekt.

      4 De [artikelen 16 tot en met 18][ref6] zijn van overeenkomstige toepassing op de gegevens, bedoeld in het eerste
      lid.

      5 De [artikelen 15 tot en met 18][ref7] zijn van overeenkomstige toepassing op de aanvullende gegevens, bedoeld in
      het tweede lid en het derde lid, tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0010475
