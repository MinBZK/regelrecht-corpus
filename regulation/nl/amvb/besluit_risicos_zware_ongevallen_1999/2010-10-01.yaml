      1 Indien de werkgever een ander is dan degene die de inrichting drijft, is het bij en krachtens dit besluit
      bepaalde van overeenkomstige toepassing op de werkgever voor zover het betreft de bescherming van de veiligheid en
      de gezondheid van de in het bedrijf, de inrichting of een onderdeel daarvan werkzame werknemers.

      2 De werkgever en degene die de inrichting drijft, geven onverminderd hun eigen verantwoordelijkheid gezamenlijk
      en in overleg uitvoering aan het bij en krachtens dit besluit bepaalde met betrekking tot de bescherming van de
      veiligheid en de gezondheid van de in het eerste lid bedoelde werknemers.
    url: https://wetten.overheid.nl/BWBR0010475/2010-10-01#Artikel3
  - number: '4'
    text: |-
      1 De in deze paragraaf gegeven voorschriften gelden ten aanzien van inrichtingen waarin gevaarlijke stoffen
      krachtens vergunning aanwezig mogen zijn of ten gevolge van het onbeheersbaar worden van een industrieel chemisch
      proces kunnen worden gevormd:

      a. in een hoeveelheid, gelijk aan of groter dan de in [bijlage I, deel 1, tweede kolom][ref1], dan wel
      [bijlage I, deel 2, tweede kolom][ref2], bij de desbetreffende stof of categorie vermelde hoeveelheid;

      b. in kleinere dan de onder a bedoelde hoeveelheden, waarvan de som na toepassing van de formule die in
      [bijlage I, deel 3][ref3], is weergegeven, gelijk is aan of groter is dan de daar genoemde waarde.

      2 Indien een gevaarlijke stof of groep van gevaarlijke stoffen genoemd in [bijlage I, deel 1][ref4], tevens behoort
      tot een categorie genoemd in [bijlage I, deel 2][ref5], geldt voor de toepassing van het eerste lid de in deel 1
      bij die stof of groep van stoffen vermelde drempelwaarde.


