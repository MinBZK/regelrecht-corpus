  - number: '7'
    text: |-
      1 Het bevoegd gezag wijst op grond van de gegevens, bedoeld in de [artikelen 6, eerste lid][ref1],
      [10, eerste lid][ref2], [26, eerste lid][ref3], van dit besluit en
      [artikel 4.13, derde lid, van de Regeling omgevingsrecht][ref4], inrichtingen of groepen inrichtingen aan ten
      aanzien waarvan de risico's van een zwaar ongeval of de gevolgen daarvan ten gevolge van de ligging van die
      inrichtingen ten opzichte van elkaar en de aanwezigheid van gevaarlijke stoffen in die inrichtingen groter kunnen
      zijn dan op grond van de in die afzonderlijke inrichtingen aanwezige hoeveelheden kan worden verwacht.

      2 Van een aanwijzing als bedoeld in het eerste lid stelt het bevoegd gezag diegenen die de betrokken inrichtingen
      drijven, in kennis. Het bevoegd gezag zendt een afschrift van die aanwijzing aan:

      a. de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder;

      b. burgemeester en wethouders van de gemeente of gemeenten waarin de inrichtingen geheel of gedeeltelijk zijn
      gelegen, en

      c. het bestuur van de veiligheidsregio of de besturen van de veiligheidsregio’s waarin de inrichtingen geheel of
      gedeeltelijk zijn gelegen.

      3 Degene die een inrichting drijft, als bedoeld in het eerste lid, wisselt met diegenen die de andere op
      grond van het eerste lid aangewezen inrichtingen drijven de gegevens uit die noodzakelijk zijn voor de
      beoordeling van het in dat lid bedoelde risico. Hij houdt in zijn beleid ter voorkoming van zware ongevallen,
      bedoeld in [artikel 5, tweede lid][ref5], en, voor zover van toepassing, in het intern noodplan, bedoeld in
      [artikel 22][ref6], en in het veiligheidsrapport rekening met de aard en de omvang van de risico's van een zwaar
      ongeval bij de naburige inrichtingen.

      4 Het bevoegd gezag doet een aanwijzing als bedoeld in het eerste lid voor de eerste maal uiterlijk vier jaar na de
      inwerkingtreding van dit besluit en vervolgens tenminste om de vijf jaar.

      5 Onze Ministers kunnen nadere regels stellen met betrekking tot het eerste en het derde lid.


