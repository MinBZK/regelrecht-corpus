        artikel: '19.3'
  - number: '20'
    text: |-
      1 Met betrekking tot een inrichting waarop dit besluit van toepassing is beziet het bevoegd gezag telkens of
      de beperkingen waaronder de vergunning is verleend, en de voorschriften die daaraan zijn verbonden, aanpassing
      behoeven op grond van de in het veiligheidsrapport genoemde maatregelen en op grond van de gegevens met betrekking
      tot de risico's, bedoeld in [bijlage III, onder 2, onder b en c][ref1].

      2 Indien het bestuur van de veiligheidsregio waarin de inrichting is gelegen met het oog op de toepassing van
      het eerste lid een advies heeft uitgebracht, betrekt het bevoegd gezag dat advies bij de actualisering van de
      vergunning, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2010-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: '21'
    text: |-
      1 Degene die een inrichting drijft, houdt een bijgewerkte lijst van in de inrichting aanwezige gevaarlijke
      stoffen bij en zorgt er voor dat deze lijst door een ieder kan worden geraadpleegd. Indien krachtens
      [artikel 19.3 van de Wet milieubeheer][ref1] een tweede tekst van het veiligheidsrapport is overgelegd waar uit de
      beschrijving van de stoffen ingevolge [Bijlage III, eerste lid, onderdeel j][ref2], stoffen zijn weggelaten, blijft
      vermelding van die stoffen op de lijst, bedoeld in de eerste zin, achterwege.

      2 Onze Ministers kunnen nadere regels stellen met betrekking tot het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19.3
      [ref2]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010475/2010-10-01#Artikel21
