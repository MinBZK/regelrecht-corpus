  - number: '11'
    text: |-
      1 De werkgever zorgt ervoor dat de werknemers, de deskundigen, genoemd in
      [artikel 13 van de Arbeidsomstandighedenwet][ref1], en de deskundigen of arbodiensten, genoemd
      in de [artikelen 14][ref2] en [14a van de Arbeidsomstandighedenwet][ref3], desgewenst kennis
      kunnen nemen van het veiligheidsrapport en de wijziging daarvan, voorzover het betreft de
      [onderdelen a, c, d, e, onder 1°, f, h tot en met l, n, p en q van bijlage III, onder 1][ref4], voorzover die
      onderdelen verband houden met de bescherming van de veiligheid en de gezondheid van de in het bedrijf of de
      inrichting of een deel daarvan werkzame werknemers.

      2 De werkgever voert over de onderdelen van het veiligheidsrapport, genoemd in het eerste lid, en de wijziging
      daarvan, voorafgaand aan de toezending aan het bevoegd gezag, bij het ontbreken van een ondernemingsraad of
      personeelsvertegenwoordiging, overleg met de belanghebbende werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel13
