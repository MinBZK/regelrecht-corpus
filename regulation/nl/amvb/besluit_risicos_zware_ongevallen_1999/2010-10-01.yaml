    text: |-
      Dit besluit is niet van toepassing op:

      a. inrichtingen in gebruik bij de krijgsmacht;

      b. inrichtingen die krachtens [artikel 1, onderdeel n, van de Mijnbouwwet][ref1] aangewezen zijn als
      mijnbouwwerken, met uitzondering van inrichtingen waar chemische of thermische verwerkingsactiviteiten en de
      daarmee verbandhoudende opslag van gevaarlijke stoffen plaatsvinden;

      c. inrichtingen voor het op of in de bodem brengen van afvalstoffen om ze daar te laten, met uitzondering van
      inrichtingen die in werking zijn voor het zich ontdoen van residuen, waaronder residuvijvers of -bekkens, die
      gevaarlijke stoffen bevatten, in het bijzonder indien zij worden gebruikt in verband met chemische of thermische
      verwerking van mineralen;

      d. inrichtingen die geheel of nagenoeg geheel zijn bestemd voor de opslag in verband met vervoer van gevaarlijke
      stoffen, al dan niet in combinatie met andere stoffen en producten;

      e. spoorwegemplacementen, voor zover zij geen onderdeel zijn van een inrichting waarop dit besluit van toepassing
      is;

      f. inrichtingen die krachtens [artikel 1, onderdeel n, van de Mijnbouwwet][ref2] aangewezen zijn als mijnbouwwerken
      ten behoeve van het opsporen en winnen van delfstoffen als bedoeld in [artikel 1, onderdeel a, van die wet][ref3],
      voorzover het opsporen en winnen van die delfstoffen plaatsvindt op het continentaal plat, bedoeld in
      [artikel 1, onderdeel c, van die wet][ref4].


