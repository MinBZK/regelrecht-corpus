  - number: '16'
    text: |-
      1 De in [artikel 15, derde lid][ref1], genoemde bestuursorganen en de daartoe door Onze Minister van Sociale Zaken
      en Werkgelegenheid aangewezen toezichthouder, beoordelen het veiligheidsrapport en stellen door tussenkomst van
      het bevoegd gezag degene die de inrichting drijft, binnen zes maanden na de ontvangst van het veiligheidsrapport
      schriftelijk in kennis van hun conclusies naar aanleiding van het veiligheidsrapport.

      2 De in het eerste lid bedoelde termijn kan eenmaal met ten hoogste drie maanden worden verlengd. Van deze
      verlenging wordt door tussenkomst van het bevoegd gezag mededeling gedaan aan degene die de inrichting drijft.

      3 De in het eerste lid bedoelde beoordeling vindt plaats nadat onderzocht is of het veiligheidsrapport
      voldoet aan [artikel 10, eerste lid][ref2], aan [bijlage III][ref3] en aan het gestelde krachtens
      [artikel 10, tweede lid][ref4].

      4 Indien een van de in het eerste lid bedoelde bestuursorganen of de daar bedoelde toezichthouder van oordeel
      is dat het veiligheidsrapport onvolledig is, verzoekt dat bestuursorgaan of die toezichthouder, door tussenkomst
      van het bevoegd gezag, binnen acht weken na de ontvangst van het veiligheidsrapport om aanvullende inlichtingen
      te verstrekken binnen een bij het verzoek te stellen termijn van ten hoogste zes weken. De in het eerste lid
      bedoelde termijn van zes maanden wordt opgeschort met ingang van de dag dat het in de eerste volzin bedoelde
      verzoek is gedaan tot de dag waarop de aanvullende inlichtingen zijn verstrekt of de daarvoor gestelde termijn
      ongebruikt is verstreken. Het bevoegd gezag stelt de in het eerste lid bedoelde bestuursorganen en de daar bedoelde
      toezichthouder van het verzoek in kennis.

      5 Degene aan wie een verzoek als bedoeld in het vierde lid is gedaan, is verplicht daaraan binnen de bij dat
      verzoek gestelde termijn te voldoen.

      6 Bij de conclusies, bedoeld in het eerste lid, en het verzoek, bedoeld in het vierde lid, bewaakt en bevordert het
      bevoegd gezag vanuit zijn coördinerende rol de eenduidigheid, onderlinge samenhang en tijdigheid van die conclusies
      of dat verzoek en neemt daartoe de noodzakelijke initiatieven.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0010475
      [ref4]: https://wetten.overheid.nl/BWBR0010475#Artikel10
