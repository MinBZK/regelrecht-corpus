  - number: '14'
    text: |-
      1 Degene die een inrichting drijft, evalueert het veiligheidsrapport tenminste eenmaal per vijf jaar en zendt
      daarna onverwijld een bijgewerkt veiligheidsrapport aan het bevoegd gezag.

      2 In afwijking van het eerste lid zendt degene die een inrichting drijft op enig ander tijdstip op eigen initiatief
      dan wel op verzoek van het bevoegd gezag een veiligheidsrapport aan het bevoegd gezag, indien nieuwe feiten, nieuwe
      kennis over veiligheid of ontwikkelingen in de kennis inzake de evaluatie van gevaren daartoe aanleiding geven. Het
      bevoegd gezag doet dit verzoek na overleg met de in [artikel 6, tweede lid, onder b en c][ref1] bedoelde ambtenaren
      en de onder d tot en met f genoemde bestuursorganen.

      3 Voor die onderdelen van het veiligheidsrapport die ten opzichte van het vorige veiligheidsrapport niet zijn
      gewijzigd, kan worden volstaan met een verwijzing naar het veiligheidsrapport waarin die onderdelen volledig zijn
      opgenomen.

      4 Onze Ministers kunnen nadere regels stellen met betrekking tot de gegevens die in een geval als bedoeld in het
      derde lid in ieder geval moeten worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel6
    url: https://wetten.overheid.nl/BWBR0010475/2010-10-01#Artikel14
