  - number: '6'
    text: |-
      1 Degene die de inrichting drijft, stelt het bevoegd gezag onverwijld schriftelijk in kennis van:

      a. iedere significante wijziging van de inrichting die betrekking heeft op een of meer
      onderwerpen waaromtrent in of bij de aanvraag gegevens zijn verstrekt als bedoeld in
      [artikel 4.13, derde lid, onder a tot en met d, van de Regeling omgevingsrecht][ref1], of waaromtrent in de
      kennisgeving, bedoeld in [artikel 26, eerste lid][ref2], gegevens zijn verstrekt;

      b. iedere significante wijziging van de processen waarbij een gevaarlijke stof wordt gebruikt;

      c. elke significante wijziging van de inrichting die het risico van zware ongevallen ernstig zou kunnen
      beïnvloeden;

      d. de sluiting van een installatie.

      2 Het bevoegd gezag zendt zo spoedig mogelijk, doch uiterlijk binnen twee weken na ontvangst, een exemplaar van de
      kennisgeving, bedoeld in het eerste lid, aan:

      a. Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      b. de inspecteur;

      c. de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder;

      d. gedeputeerde staten van de provincie waarin de inrichting geheel of gedeeltelijk is gelegen, tenzij gedeputeerde
      staten het bevoegd gezag zijn;

      e. burgemeester en wethouders van de gemeente waarin de inrichting geheel of gedeeltelijk is gelegen, tenzij
      burgemeester en wethouders het bevoegd gezag zijn, en

      f. het bestuur van de veiligheidsregio waarin de inrichting geheel of gedeeltelijk is gelegen.

      3 Indien de gegevens, bedoeld in het eerste lid, reeds op grond van een ander wettelijk voorschrift aan het bevoegd
      gezag zijn verstrekt, kan in de kennisgeving worden volstaan met een verwijzing naar die gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4.13
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel26
