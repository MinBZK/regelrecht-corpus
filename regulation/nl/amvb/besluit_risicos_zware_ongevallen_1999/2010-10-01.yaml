        artikel: '19.3'
      - id: ref2
        bwb_id: BWBR0010475
  - number: '22'
    text: |-
      1 Degene die een inrichting drijft, stelt een intern noodplan op voor bij een zwaar ongeval binnen de inrichting
      ten uitvoer te leggen maatregelen, gericht op het beperken en beheersen van zware ongevallen en de gevolgen
      ervan voor de werknemers. Het intern noodplan bevat tenminste de gegevens en beschrijvingen, bedoeld in
      [bijlage IV][ref1].

      2 Degene die een inrichting drijft draagt er zorg voor dat het intern noodplan tenminste eens per drie jaar wordt
      geëvalueerd, beproefd en zonodig gewijzigd. Bij de evaluatie wordt rekening gehouden met veranderingen die zich
      in de inrichting hebben voorgedaan, en met nieuwe kennis en inzichten omtrent de bij een zwaar ongeval te nemen
      maatregelen.

      3 Het intern noodplan en de wijziging daarvan worden, bij het ontbreken van een ondernemingsraad of
      personeelsvertegenwoordiging, opgesteld met raadpleging van de belanghebbende werknemers. Over het intern noodplan
      en de wijziging daarvan worden tevens de werknemers geraadpleegd van andere werkgevers die op basis van een
      langlopende overeenkomst tot aanneming van werk mede in de inrichting werkzaam zijn.

      4 De werkgever zorgt ervoor dat de werknemers, de bedrijfshulpverleners, bedoeld in
      [artikel 15, eerste lid, van de wet][ref2], en de externe hulpverleningsorganisaties,
      bedoeld in [artikel 3, eerste lid, onderdeel e, van de wet][ref3], de deskundigen, genoemd in
      [artikel 13 van de Arbeidsomstandighedenwet][ref4], de deskundigen of arbodiensten, genoemd in de
      [artikelen 14][ref5] en [14a van de Arbeidsomstandighedenwet][ref6], en de werknemers van andere werkgevers, die
      mede in de inrichting werkzaam zijn, desgewenst kennis kunnen nemen van het intern noodplan.

      5 Het intern noodplan wordt vastgesteld:

      a. voor inrichtingen die na de inwerkingtreding van dit besluit worden opgericht: voor de inbedrijfstelling er van;

      b. voor inrichtingen die voor de inwerkingtreding van dit besluit niet verplicht waren tot opstelling van een
      rapport inzake de externe veiligheid op grond van de [Wet milieubeheer][ref7] of een arbeidsveiligheidsrapport op
      grond van de [Arbeidsomstandighedenwet][ref8]: binnen drie jaar na de inwerkingtreding van dit besluit;

      c. voor andere inrichtingen: binnen twee jaar na de inwerkingtreding van dit besluit.


