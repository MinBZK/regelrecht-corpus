  - number: '18'
    text: |-
      1 Uiterlijk twee weken nadat het bevoegd gezag de conclusies, bedoeld in [artikel 16, eerste lid][ref1], heeft
      bekendgemaakt, doet het bevoegd gezag van deze conclusies en van het veiligheidsrapport gelijktijdig mededeling
      door:

      a. terinzagelegging;

      b. kennisgeving in een of meer dag-, nieuws- of huis-aan-huisbladen.

      2 De mededeling strekt mede ter voldoening aan de verplichting die ingevolge
      [artikel 49, eerste lid, van de Wet veiligheidsregio’s][ref2] rust op het bestuur van de veiligheidsregio en ter
      voldoening aan de verplichting die ingevolge [artikel 7 van de Arbeidsomstandighedenwet][ref3] rust op de daartoe
      door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder.

      3 Gedurende vier weken vanaf de dag waarop het veiligheidsrapport ter inzage is gelegd, kunnen de stukken worden
      ingezien op een tijd en plaats die bij de mededeling, bedoeld in het eerste lid, is vermeld.

      4 Gelijktijdig met de mededeling, bedoeld in het eerste lid, zendt het bevoegd gezag een exemplaar van het
      veiligheidsrapport aan:

      a. burgemeester en wethouders van de gemeente waarin de inrichting geheel of gedeeltelijk is gelegen, tenzij
      burgemeester en wethouders het bevoegd gezag zijn;

      b. burgemeester en wethouders van de gemeenten waarvan het grondgebied is gelegen binnen de lijn van 10-8 van het
      plaatsgebonden risico, bedoeld in [bijlage III, onder 2, onder c][ref4];

      c. het bestuur van de veiligheidsregio waarin een gemeente als bedoeld onder a of b is gelegen;

      d. het Rijksinstituut voor Volksgezondheid en Milieu, en

      e. het bestuursorgaan dat bevoegd is tot verlening van de vergunning krachtens de [Waterwet][ref5].

      5 Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt, indien de lijn van 10-8 van het
      plaatsgebonden risico, bedoeld in [bijlage III, onder 2, onder c][ref6], zich uitstrekt over het grondgebied van
      een andere staat een exemplaar aan die staat. In dat geval zendt hij tevens een exemplaar aan Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.

      6 In een geval als bedoeld in het vijfde lid, eerste volzin, zendt Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer, indien krachtens [artikel 19.3 van de Wet milieubeheer][ref7] een tweede tekst is
      overgelegd, een exemplaar van deze tekst aan de betrokken staat.


