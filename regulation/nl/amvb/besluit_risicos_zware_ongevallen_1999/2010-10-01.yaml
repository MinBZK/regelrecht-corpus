    text: |-
      1 Een inrichting of een onderdeel daarvan mag niet in werking worden gebracht of gehouden, indien degene die de
      inrichting drijft duidelijk onvoldoende maatregelen heeft getroffen ter voorkoming van zware ongevallen of ter
      beperking van de gevolgen daarvan, voor zover het betreft de bescherming van de veiligheid en de gezondheid van de
      in het bedrijf, de inrichting onderscheidenlijk het betrokken onderdeel daarvan werkzame werknemers.

      2 Ter zake van de naleving van het eerste lid kan een last onder bestuursdwang worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0010475/2010-10-01#Artikel23
  - number: '24'
    text: |-
      1 Het bevoegd gezag stelt op grond van de gegevens, bedoeld in de [artikelen 6, eerste lid][ref1],
      [10, eerste lid][ref2], en [26, eerste lid][ref3], in overeenstemming met de daartoe door Onze Minister van Sociale
      Zaken en Werkgelegenheid aangewezen toezichthouder, en het bestuur van de veiligheidsregio waarin de inrichting
      geheel of in hoofdzaak is gelegen, een zodanig inspectieprogramma vast dat daarmee een planmatig en systematisch
      onderzoek van de in de inrichting gebruikte systemen van technische, organisatorische en bedrijfskundige aard kan
      worden uitgevoerd.

      2 Bij een inspectie wordt in ieder geval gecontroleerd of hetgeen in de inrichting wordt aangetroffen in
      overeenstemming is met de verplichtingen die voortvloeien uit de [artikelen 5][ref4], [6][ref5], [10][ref6] en
      [26][ref7], teneinde na te gaan of:

      a. degene die de inrichting drijft kan aantonen dat hij passende maatregelen heeft getroffen om zware ongevallen
      te voorkomen;

      b. degene die de inrichting drijft kan aantonen dat hij in passende middelen heeft voorzien om de gevolgen van
      zware ongevallen op en buiten het bedrijfsterrein te beperken;

      c. de verstrekte gegevens en informatie de situatie in de inrichting trouw weergeven.

      3 Na iedere inspectie als bedoeld in het tweede lid stelt het bestuursorgaan dat, of de aangewezen toezichthouder
      die de inspectie heeft uitgevoerd een rapport op dan wel, indien de inspectie door meer dan één bestuursorgaan,
      al dan niet tezamen met de aangewezen toezichthouder, is uitgevoerd, stellen deze een gezamenlijk rapport op. Een
      exemplaar van het rapport wordt gezonden aan degene die de inrichting drijft. Indien het rapport daartoe aanleiding
      geeft, wordt dit binnen een redelijke termijn na de inspectie met degene die de inrichting drijft, besproken.

      4 Binnen een jaar na de inwerkingtreding van dit besluit stelt het bevoegd gezag voor de eerste maal een
      inspectieprogramma vast als bedoeld in het eerste lid.

      5 Een inspectie als bedoeld in het tweede lid wordt met betrekking tot een inrichting waarop paragraaf 3 van
      toepassing is, tenminste eenmaal per jaar uitgevoerd.

      6 Het vijfde lid is niet van toepassing indien het bevoegd gezag het in het eerste lid bedoelde inspectieprogramma
      heeft vastgesteld op grond van een systematische evaluatie van de gevaren van zware ongevallen.

      7 Bij het opstellen van het gezamenlijk rapport, bedoeld in het derde lid, bewaakt en bevordert het bevoegd gezag
      vanuit zijn coördinerende rol de eenduidigheid en onderlinge samenhang van het gezamenlijk rapport en tijdige
      toezending van dat rapport aan degene die de inrichting drijft en neemt daartoe de noodzakelijke initiatieven.


