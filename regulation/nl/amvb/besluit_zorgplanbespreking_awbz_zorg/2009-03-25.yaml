preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 19 november 2008, kenmerk DWJZ/
    SWW-2894148;

    Gelet op artikel 6, eerste lid, van de Kwaliteitswet zorginstellingen;

    De Raad van State gehoord (advies van 26 januari 2009, nummer W13.08.0497/I);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 23 februari 2009,
    kenmerk DWJZ/SWW2912835;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Dit besluit is van toepassing op instellingen die zorg verlenen als omschreven bij of krachtens de
      [Algemene Wet Bijzondere Ziektekosten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '1.2'
    text: |-
      In dit besluit wordt verstaan onder cliënt: een persoon aan wie een zorgaanbieder voor een
      periode die langer zal duren dan drie maanden zorg verleent als omschreven bij of krachtens de
      [Algemene Wet Bijzondere Ziektekosten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '2.1'
    text: |-
      De zorgaanbieder organiseert zo spoedig mogelijk na de aanvang van de zorgverlening een bespreking met de cliënt
      waarin in ieder geval de volgende onderwerpen aan bod komen:
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel2
  - number: 2.1.a
    text: |-
      welke doelen worden met betrekking tot de zorgverlening voor een bepaalde periode gesteld, gebaseerd op de wensen,
      mogelijkheden en beperkingen van de cliënt;
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel2
  - number: 2.1.b
    text: op welke concrete wijze zullen de zorgaanbieder en de cliënt de gestelde doelen trachten te bereiken;
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel2
  - number: 2.1.c
    text: |-
      wie is voor de verschillende onderdelen van de zorgverlening verantwoordelijk, op welke wijze vindt afstemming
      tussen meerdere zorgverleners plaats, en wie kan de cliënt op die afstemming aanspreken;
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel2
  - number: 2.1.d
    text: |-
      met welke frequentie en onder welke omstandigheden gaat de zorgaanbieder de zorgverlening in samenspraak met de
      cliënt evalueren en actualiseren.
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel2
  - number: '2.2'
    text: |-
      De zorgaanbieder legt, na de in het eerste lid bedoelde bespreking met de cliënt, uiterlijk binnen zes weken na
      aanvang van de zorgverlening het resultaat van de bespreking met de cliënt op de onderscheiden onderwerpen vast in
      een zorgplan.
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel2
  - number: '2.3'
    text: |-
      Indien de cliënt dan wel, indien [artikel 3][ref1] van toepassing is, de in [dat artikel][ref2] bedoelde persoon
      of personen niet tot bespreking van de in het eerste lid bedoelde onderwerpen, de evaluatie of het actualiseren van
      het zorgplan bereid zijn, houdt de zorgaanbieder bij de vastlegging, evaluatie of actualisering van het zorgplan
      zoveel mogelijk rekening met de veronderstelde wensen en de bekende mogelijkheden en beperkingen van de cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0025521#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025521#Artikel3
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025521
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0025521
        artikel: '3'
  - number: '3.1'
    text: |-
      Indien de cliënt de leeftijd van twaalf jaar nog niet heeft bereikt, vindt de in [artikel 2, eerste lid][ref1],
      bedoelde bespreking plaats met degene die het gezag over hem uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0025521#Artikel2
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025521
        artikel: '2'
  - number: '3.2'
    text: |-
      Indien het een cliënt betreft die de leeftijd van twaalf jaar heeft bereikt, maar nog geen zestien jaar is, vindt
      de bespreking plaats met zowel de cliënt als degene die het gezag over hem uitoefent, tenzij de cliënt niet in
      staat kan worden geacht tot een redelijke waardering van zijn belangen ter zake.
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel3
  - number: '3.3'
    text: |-
      Indien het een cliënt betreft die de leeftijd van twaalf jaar heeft bereikt, maar nog geen achttien is en niet in
      staat kan worden geacht tot een redelijke waardering van zijn belangen ter zake, vindt de bespreking uitsluitend
      plaats met degene die het gezag over hem uitoefent.
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel3
  - number: '3.4'
    text: |-
      Indien een meerderjarige cliënt niet in staat kan worden geacht tot een redelijke waardering van zijn belangen
      ter zake, vindt de in [artikel 2, eerste lid][ref1], bedoelde bespreking plaats met de curator of mentor van de
      cliënt of, indien deze ontbreekt, met de persoon die door de cliënt schriftelijk is gemachtigd in zijn plaats op te
      treden. Indien zodanige persoon eveneens ontbreekt of niet optreedt, vindt de samenspraak plaats met de echtgenoot,
      de geregistreerde partner of andere levensgezel van de cliënt, dan wel, indien ook zodanige persoon ontbreekt of
      niet optreedt, met een ouder, kind, broer of zus van de cliënt, tenzij deze persoon dat niet wenst.


      [ref1]: https://wetten.overheid.nl/BWBR0025521#Artikel2
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025521
        artikel: '2'
  - number: '3.5'
    text: |-
      De zorgaanbieder is niet verplicht tot het organiseren van een bespreking met de in dit artikel bedoelde
      vertegenwoordigers of andere in het vierde lid bedoelde personen, indien een dergelijke bespreking niet verenigbaar
      is met de verplichting tot het bieden van verantwoorde zorg.
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel3
  - number: '4'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport zendt binnen drie jaar na de inwerkingtreding van dit besluit
      aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van dit besluit in de praktijk.
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel4
  - number: '5'
    text: |-
      In afwijking van [artikel 2][ref1] stelt de zorgaanbieder voor cliënten die op het tijdstip van inwerkingtreding
      van dit besluit zorg ontvangen, binnen zes maanden na dat tijdstip een zorgplan als bedoeld in dat artikel vast.


      [ref1]: https://wetten.overheid.nl/BWBR0025521#Artikel2
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025521
        artikel: '2'
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit zorgplanbespreking AWBZ-zorg.'
    url: https://wetten.overheid.nl/BWBR0025521/2009-03-25#Artikel7
