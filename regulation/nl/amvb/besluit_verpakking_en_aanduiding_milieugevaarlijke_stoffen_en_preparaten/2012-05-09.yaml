---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_verpakking_en_aanduiding_milieugevaarlijke_stoffen_en_preparaten
regulatory_layer: AMVB
publication_date: '2023-04-18'
valid_from: '2012-05-09'
bwb_id: BWBR0004220
url: https://wetten.overheid.nl/BWBR0004220/2012-05-09
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 2 april 1987, DGVGZ/VVP/P-
    80823, gedaan mede namens Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Sociale
    Zaken en Werkgelegenheid;

    Gelet op de artikelen 34, derde lid, 36, tweede lid, 37, 39, tweede, derde en vierde lid, en 60, derde lid, van de
    Wet milieugevaarlijke stoffen (Stb. 1985, 639);

    De Raad van State gehoord (advies van 17 juni 1987, no. W13.87.0179);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 8 september 1987,
    DGVGZ/VVP/P-81749, uitgebracht mede namens Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
    en de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 1.b
    text: |-
      stoffenrichtlijn: [richtlijn nr. 67/548/EEG](31967L0548) van de Raad van de Europese Gemeenschappen van 27
      juni 1967 betreffende de aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake de indeling, de
      verpakking en het kenmerken van gevaarlijke stoffen (PbEG L 196);
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel1
  - number: 1.c
    text: |-
      Onze Ministers: Onze Ministers van Volksgezondheid, Welzijn en Sport, van Infrastructuur en Milieu en van Sociale
      Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel1
  - number: 1a.1
    text: |-
      Op een verpakking als bedoeld in [artikel 9.2.3.3, eerste lid, van de wet][ref1] moeten duidelijk en onuitwisbaar
      vermeld zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 1a.1.a
    text: |-
      de chemische namen van de stoffen waaruit het preparaat bestaat of de naam van het genetisch gemodificeerd
      organisme;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel1a
  - number: 1a.1.b
    text: |-
      de naam en het adres van de in de Europese Economische Ruimte gevestigde persoon die het preparaat of het genetisch
      gemodificeerd organisme vervaardigt, in de Europese Economische Ruimte aan een ander ter beschikking stelt of
      invoert;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel1a
  - number: 1a.1.c
    text: |-
      de benaming van het gevaar of de gevaren van het preparaat, als bedoeld in
      [artikel 9.2.3.1, tweede lid, van de wet][ref1], met het bijbehorende symbool, onderscheidenlijk de bijbehorende
      symbolen, voor zover daarin krachtens het derde lid is voorzien;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 1a.1.d
    text: |-
      een verwijzing naar de bijzondere, aan het gebruik van het preparaat verbonden gevaren, voor zover daarin krachtens
      het derde lid is voorzien;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel1a
  - number: 1a.1.e
    text: |-
      veiligheidsaanbevelingen ter vermijding van de belangrijkste, aan het gebruik van het preparaat verbonden gevaren,
      voor zover daarin krachtens het derde lid is voorzien.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel1a
  - number: 1a.2
    text: |-
      Onze Ministers stellen tezamen nadere regels met betrekking tot de in het eerste lid bedoelde aanduidingen. Zij
      kunnen daarbij tevens bepalen dat door hen aan te geven verdere aanduidingen op een verpakking moeten zijn vermeld,
      of dat door hen aan te geven aanduidingen slechts in door hen aan te geven gevallen behoeven te zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel1a
  - number: 1a.3
    text: |-
      Aan het bepaalde bij of krachtens het eerste lid, onder a, c, d en e, en het tweede lid wordt geacht te zijn
      voldaan, indien een preparaat, opgenomen op een door Onze Ministers tezamen vastgestelde lijst van preparaten als
      bedoeld in [artikel 9.2.3.1][ref1], is aangeduid op de wijze die in die lijst met betrekking tot dat preparaat
      is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '2.1'
    text: |-
      De criteria volgens welke een stof moet worden ingedeeld in een categorie als bedoeld in
      [artikel 9.2.3.1, tweede lid, van de wet][ref1], zijn voor de onderscheidene categorieën als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 2.1.a
    text: |-
      ontplofbaar: stoffen en preparaten in vaste, vloeibare, pasta- of gelatine-achtige toestand, die ook zonder de
      inwerking van zuurstof in de lucht exotherm kunnen reageren, hierbij snel gassen ontwikkelen en onder bepaalde
      voorwaarden ontploffen, snel explosief verbranden of door verhitting bij gedeeltelijke afsluiting ontploffen;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.b
    text: |-
      oxyderend: stoffen en preparaten die bij aanraking met andere stoffen, met name ontvlambare stoffen, sterk exotherm
      reageren;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.c
    text: |-
      zeer licht ontvlambaar: stoffen en preparaten in vloeibare toestand met een uiterst laag vlampunt en een laag
      kookpunt, alsmede gasvormige stoffen en preparaten die bij normale temperatuur en druk aan de lucht blootgesteld,
      kunnen ontbranden;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.d
    text: 'licht ontvlambaar: stoffen en preparaten die:'
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.d.1°
    text: |-
      bij normale temperatuur aan de lucht blootgesteld, zonder toevoer van energie in temperatuur kunnen stijgen en
      tenslotte kunnen ontbranden;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.d.2°
    text: |-
      in vaste toestand, door kortstondige inwerking van een ontstekingsbron, gemakkelijk kunnen ontbranden en na
      verwijdering van de ontstekingsbron blijven branden of gloeien;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.d.3°
    text: in vloeibare toestand, een zeer laag vlampunt hebben, of
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.d.4°
    text: |-
      bij aanraking met water of vochtige lucht, zeer licht ontvlambare gassen in een gevaarlijke hoeveelheid
      ontwikkelen;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.e
    text: 'ontvlambaar: vloeibare stoffen en preparaten met een laag vlampunt;'
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.f
    text: |-
      zeer vergiftig: stoffen en preparaten waarvan reeds een zeer geringe hoeveelheid bij inademing of opneming via de
      mond of via de huid acute of chronische aandoeningen of de dood kan veroorzaken;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.g
    text: |-
      vergiftig: stoffen en preparaten waarvan reeds een geringe hoeveelheid bij inademing of opneming via de mond of via
      de huid acute of chronische aandoeningen of de dood kan veroorzaken;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.h
    text: |-
      schadelijk: stoffen en preparaten die bij inademing of opneming via de mond of via de huid acute of chronische
      aandoeningen of de dood kunnen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.i
    text: |-
      bijtend: stoffen en preparaten die bij aanraking met levende weefsels daarop een vernietigende werking kunnen
      uitoefenen;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.j
    text: |-
      irriterend: niet-bijtende stoffen en preparaten die bij directe, langdurige of herhaalde aanraking met de huid of
      de slijmvliezen een ontsteking kunnen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.k
    text: |-
      sensibiliserend: stoffen en preparaten die bij inademing of bij opneming via de huid aanleiding kunnen geven tot
      een zodanige reactie van hypersensibilisatie dat latere blootstelling aan de stof of het preparaat karakteristieke
      nadelige effecten veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.l
    text: |-
      kankerverwekkend: stoffen en preparaten die bij inademing of bij opneming via de mond of via de huid kanker kunnen
      veroorzaken of de frequentie van kanker doen toenemen;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.m
    text: |-
      mutageen: stoffen en preparaten die bij inademing of bij opneming via de mond of via de huid erfelijke genetische
      afwijkingen kunnen veroorzaken of de frequentie van deze afwijkingen doen toenemen;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.n
    text: |-
      voor de voortplanting vergiftige: stoffen en preparaten die bij inademing of bij opneming via de mond of via
      de huid niet-erfelijke afwijkingen bij het nageslacht alsmede of uitsluitend aantasting van de mannelijke of
      vrouwelijke voortplantingsfuncties of -vermogens kunnen veroorzaken, dan wel de frequentie van deze afwijkingen of
      aantasting doen toenemen;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: 2.1.o
    text: |-
      milieugevaarlijk: stoffen en preparaten die, wanneer zij in het milieu terechtkomen, onmiddellijk of na verloop van
      tijd gevaar voor een of meer milieucompartimenten opleveren of kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
  - number: '2.2'
    text: |-
      Voor de indeling van een stof in een categorie als bedoeld in [artikel 9.2.3.1, tweede lid, van de wet][ref1], zijn
      tevens van toepassing de criteria die zijn vastgelegd in bijlage VI bij de stoffenrichtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '2.3'
    text: |-
      Het bepaalde in het eerste lid, onder a tot en met e, is niet van toepassing op aërosolen als bedoeld in het
      [Warenwetbesluit drukverpakkingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007965
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007965
  - number: '3.1'
    text: |-
      Ter bepaling of een stof behoort tot een categorie als bedoeld in [artikel 9.2.3.1, tweede lid, van de wet][ref1],
      wordt gebruik gemaakt van de bestaande relevante en toegankelijke gegevens over de eigenschappen van de stof.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '3.2'
    text: |-
      Onderzoek dat wordt uitgevoerd teneinde vast te stellen of een stof behoort tot een categorie als bedoeld in
      [artikel 9.2.3.1, tweede lid, van de wet][ref1], dient te worden uitgevoerd met toepassing van methoden, vastgelegd
      in bijlage X bij de EG-verordening registratie, evaluatie en autorisatie van chemische stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '5.1'
    text: |-
      De in [artikel 1a, eerste lid][ref1], voorgeschreven aanduidingen moeten gesteld zijn in de Nederlandse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0004220#Artikel1a
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004220
        artikel: 1a
  - number: '5.2'
    text: |-
      Onze Ministers kunnen bepalen dat in door hen aan te geven gevallen, waarin naar hun oordeel in het verband met
      de bestemming van de stoffen het in het eerste lid voorgeschreven gebruik van de Nederlandse taal voor de in
      [artikel 1a, eerste lid][ref1], voorgeschreven aanduidingen niet zinvol is, deze aanduidingen in een andere taal
      dan de Nederlandse mogen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004220#Artikel1a
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004220
        artikel: 1a
  - number: '6.1'
    text: |-
      De [artikelen 9.2.3.1 tot en met 9.2.3.4 van de wet][ref1], en de [artikelen 2, eerste en derde lid][ref2],
      [3, tweede lid][ref3], en [5][ref4], zijn van overeenkomstige toepassing op preparaten, met uitzondering van
      cosmetica als bedoeld in het [Warenwetbesluit kosmetische produkten][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004220#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004220#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0004220#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0007603
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0004220
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004220
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0004220
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0007603
  - number: '6.2'
    text: |-
      Onze Ministers kunnen regels stellen met betrekking tot de verpakking, het etiket daaronder begrepen, en aanduiding
      van preparaten.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6
  - number: 6a.1
    text: |-
      De indeling van een preparaat in een categorie als bedoeld in
      [artikel 9.2.3.1, tweede lid, onder a tot en met e, van de wet][ref1], dient te geschieden op grond van onderzoek
      naar de in die onderdelen bedoelde gevaarlijke eigenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 6a.2
    text: |-
      In afwijking van het eerste lid kan de indeling van een preparaat in een categorie als bedoeld in dat lid
      achterwege blijven, indien:
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6a
  - number: 6a.2.a
    text: |-
      geen enkel bestanddeel van dat preparaat de in [artikel 9.2.3.1, tweede lid, onder a tot en met e van de wet][ref1],
      bedoelde eigenschappen heeft en het volgens de gegevens waarover de fabrikant beschikt weinig waarschijnlijk is dat
      bij het preparaat een dergelijk gevaar aanwezig is, of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 6a.2.b
    text: |-
      in het geval van wijziging van de samenstelling van een preparaat met bekende samenstelling, er wetenschappelijke
      aanwijzingen zijn dat een nieuwe beoordeling van de gevaren niet tot een wijziging van de indeling zal leiden.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6a
  - number: 6a.3
    text: |-
      Bij regeling van Onze Ministers worden nadere regels gesteld ter zake van het onderzoek en de in het eerste lid
      genoemde indeling van een preparaat.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6a
  - number: 6b.1
    text: |-
      Voor de indeling van een preparaat in een categorie als bedoeld in
      [artikel 9.2.3.1, tweede lid, onder f tot en met n, van de wet][ref1], is van toepassing de door Onze Ministers
      vast te stellen methode met bijbehorende criteria, die gebaseerd is op de eigenschappen van de stoffen waaruit het
      preparaat is samengesteld en de concentraties waarin die stoffen in het preparaat voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 6b.2
    text: |-
      In afwijking van het eerste lid wordt een preparaat overeenkomstig de criteria van
      bijlage VI bij de stoffenrichtlijn, ingedeeld in één of meer van de categorieën bedoeld in
      [artikel 9.2.3.1, tweede lid, onder f tot en met j, van de wet][ref1], indien met betrekking tot die indeling
      toxicologische gegevens beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 6b.3
    text: |-
      Bij regeling van Onze Ministers worden regels gesteld over de wijze waarop de toxicologische gegevens bedoeld in
      het tweede lid worden bepaald.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6b
  - number: 6b.4
    text: |-
      In de in het derde lid bedoelde regels kunnen tevens bijzondere omstandigheden worden aangewezen die van invloed
      zijn op de indeling van het preparaat.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6b
  - number: 6b.5
    text: |-
      Onze Ministers bepalen in welke gevallen een wijziging in de samenstelling van een preparaat dat is ingedeeld in
      een categorie als bedoeld in [artikel 9.2.3.1, tweede lid, onder f tot en met n, van de wet][ref1], leidt tot een
      nieuwe beoordeling van die indeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 6c.1
    text: |-
      Op de indeling van een preparaat in de categorie milieugevaarlijk als bedoeld in
      [artikel 9.2.3.1, tweede lid, onder o, van de wet][ref1], is van toepassing de bij regeling van Onze Ministers vast
      te stellen methode met bijbehorende criteria.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 6c.2
    text: |-
      Bij regeling van Onze Ministers wordt voor preparaten waarvan de samenstelling bekend is, met uitzondering van
      de onder [richtlijn nr. 91/414/EEG](31991L0414) van de Raad van de Europese Gemeenschappen van 15 juli 1991
      betreffende het op de markt brengen van gewasbeschermingsmiddelen (PbEG L 230) vallende preparaten die zijn
      ingedeeld volgens andere internationaal erkende methoden die in overeenstemming zijn met de bepalingen van de
      bijlagen II en III bij [richtlijn nr. 91/414/EEG](31991L0414) van de Raad van de Europese Gemeenschappen van 15
      juli 1991 betreffende het op de markt brengen van gewasbeschermingsmiddelen (PbEG L 230), vastgesteld in welke
      gevallen een nieuwe beoordeling van de gevaren voor het milieu plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6c
  - number: 6d.1
    text: 'Degene die verantwoordelijk is voor het in de handel brengen van een stof of een preparaat houdt ter beschikking:'
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6d
  - number: 6d.1.a
    text: de gegevens die zijn gebruikt voor de indeling en het kenmerken van het preparaat;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6d
  - number: 6d.1.b
    text: |-
      alle nuttige informatie betreffende de wijze van verpakking van die verpakkingen die preparaten bevatten welke
      aan het grote publiek te koop aangeboden of verkocht worden met inbegrip van het certificaat dat na proeven
      overeenkomstig bijlage IX, deel A, bij de stoffenrichtlijn wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6d
  - number: 6d.2
    text: |-
      Bij regeling van Onze Ministers worden instanties aangewezen ten behoeve waarvan de in het eerste lid genoemde
      gegevens ter beschikking worden gehouden.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6d
  - number: 6d.3
    text: |-
      Bij regeling van Onze Ministers kunnen nadere regels worden gesteld betreffende het vragen van inlichtingen over de
      samenstelling van het preparaat en alle andere nuttige informatie aan de persoon die verantwoordelijk is voor het
      in de handel brengen van het preparaat.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6d
  - number: 6e
    text: |-
      Elke vorm van reclame voor een preparaat waarbij een particulier een koopcontract kan sluiten zonder eerst de
      verpakking, het etiket daarbij inbegrepen, van het preparaat te hebben gezien, vermeldt de daarop aangeduide soort
      of soorten gevaren als bedoeld in [artikel 9.2.3.1, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6e
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 6f
    text: |-
      Bij regeling van Onze Ministers kunnen preparaten worden aangewezen waarop de [artikelen 1a][ref1] en
      [9.2.3.1 tot en met 9.2.3.4 van de wet][ref2] geheel of voor een daarbij te bepalen gedeelte niet van toepassing
      zijn indien deze preparaten in de vorm waarin ze in de handel zijn gebracht geen gevarenopleveren uit fysisch-
      chemische eigenschappen, noch gevaren opleveren voor gezondheid of voor het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0004220#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel6f
    references:
      - id: ref1
        bwb_id: BWBR0004220
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '7'
    text: |-
      De [artikelen 9.2.3.1][ref1], [9.2.3.2][ref2], [9.2.3.3][ref3] en [9.2.3.4, eerste lid, van de wet][ref4] zijn niet
      van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 7.a
    text: springstoffen die in de handel worden gebracht met het oog op hun explosieve of pyrotechnische eigenschappen;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel7
  - number: 7.b
    text: |-
      stoffen, alsmede preparaten als bedoeld in [artikel 6, eerste lid][ref1], in douanevervoer, die onder toezicht
      staan van de douane en niet worden bewerkt of verwerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0004220#Artikel6
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004220
        artikel: '6'
  - number: 7.c
    text: |-
      stoffen, alsmede preparaten als bedoeld in [artikel 6, eerste lid][ref1], in de vorm van afvalstoffen waarop
      richtlijn nr. 2006/12/EG van het Europees Parlement en de Raad van 5 april 2006 betreffende afvalstoffen (PbEU L
      114) of [richtlijn nr. 78/319/EEG](31978L0319) van de Raad van 20 maart 1978 betreffende toxische en gevaarlijke
      afvalstoffen (PbEG L 319) van toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0004220#Artikel6
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004220
        artikel: '6'
  - number: 7.d
    text: |-
      preparaten die radioactieve stoffen als omschreven in [richtlijn nr. 80/836](31980L0836)/Euratom van de Raad van
      15 juli 1980 houdende wijziging van de richtlijnen tot vaststelling van de basisnormen voor de bescherming van de
      gezondheid der bevolking en der werknemers tegen de aan ioniserende straling verbonden gevaren, bevatten;
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel7
  - number: 7.e
    text: |-
      medische hulpmiddelen die invasief zijn of in direct contact komen met het lichaam, voorzover er communautaire
      voorschriften voor de indeling en kenmerking van gevaarlijke stoffen en preparaten voorhanden zijn die eenzelfde
      niveau van informatie en bescherming verzekeren als [richtlijn nr. 1999/45/EG](31999L0045) van het Europees
      Parlement en de Raad van de Europese Unie van 31 mei 1999 betreffende de onderlinge aanpassing van de wettelijke en
      bestuursrechtelijke bepalingen van de lidstaten inzake de indeling, de verpakking en het kenmerken van gevaarlijke
      preparaten (PbEG L 200);
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel7
  - number: 7.f
    text: |-
      geneesmiddelen als bedoeld in de [Geneesmiddelenwet][ref1] en de [Diergeneesmiddelenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021505
      [ref2]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0021505
      - id: ref2
        bwb_id: BWBR0003818
  - number: '8'
    text: |-
      Dit besluit berust op de [artikelen 9.2.3.1, derde en vierde lid][ref1], [9.2.3.2][ref2], [9.2.3.3][ref3] en
      [9.2.3.5 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '9.1'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel9
  - number: '9.2'
    text: |-
      Een wijziging van bijlage VI bij de stoffenrichtlijn treedt voor de toepassing van
      [artikel 3, eerste lid, onderscheidenlijk tweede lid][ref1], onderscheidenlijk [artikel 2, tweede lid][ref2], in
      werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004220#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004220#Artikel2
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004220
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004220
        artikel: '2'
  - number: '9.3'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport in overeenstemming met de Minister van Sociale Zaken en
      Werkgelegenheid kan bij ministeriële regeling onderdelen van een in werking getreden wijziging als bedoeld in het
      tweede lid, voor door hem aan te wijzen categorieën stoffen tot een door hem te bepalen tijdstip buiten toepassing
      laten.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel9
  - number: '9.4'
    text: |-
      Indien de bijlage van de stoffenrichtlijn, bedoeld in het tweede lid, wordt gewijzigd, zal Onze Minister van
      Volksgezondheid, Welzijn en Sport dit bekend maken in de Nederlandse Staatscourant. Hij maakt daarbij tevens bekend
      wanneer de wijziging in werking treedt.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel9
  - number: '9.5'
    text: Het besluit kan worden aangehaald als Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten.
    url: https://wetten.overheid.nl/BWBR0004220/2012-05-09#Artikel9
