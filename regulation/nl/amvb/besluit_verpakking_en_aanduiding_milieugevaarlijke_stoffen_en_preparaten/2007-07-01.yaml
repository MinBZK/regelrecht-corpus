  - number: '5'
    text: |-
      Onze Ministers kunnen bepalen dat in door hen aan te geven gevallen, waarin naar hun oordeel in het verband met de
      bestemming van de stoffen het in artikel 36, tweede lid, van de wet voorgeschreven gebruik van de Nederlandse taal
      voor de in artikel 36, eerste lid, van de wet voorgeschreven aanduidingen niet zinvol is, deze aanduidingen in een
      andere taal dan de Nederlandse taal mogen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004220/2007-07-01#Artikel5
  - number: '6'
    text: |-
      1 De [artikelen 34 tot en met 38 van de wet][ref1], en de [artikelen 2, eerste en derde lid][ref2],
      [3, tweede lid][ref3], en [5][ref4], zijn van overeenkomstige toepassing op preparaten, met uitzondering van
      cosmetica als bedoeld in het [Warenwetbesluit kosmetische produkten][ref5].

      2 Onze Ministers kunnen regels stellen met betrekking tot de verpakking, het etiket daaronder begrepen, en
      aanduiding van preparaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004220#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004220#Artikel3
