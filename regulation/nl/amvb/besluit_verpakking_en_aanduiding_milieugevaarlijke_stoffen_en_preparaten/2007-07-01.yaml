  - number: '4'
    text: |-
      Indien van een stof als bedoeld in [artikel 2][ref1], eerste of tweede lid, [artikel 9][ref2], tweede lid, onder
      *a*, of [artikel 12, eerste, tweede of derde lid, van het Kennisgevingsbesluit Wet milieugevaarlijke stoffen][ref3]
      of van een stof die in de Europese Gemeenschappen door een fabrikant zal worden of wordt vervaardigd of door een
      importeur zal worden of wordt ingevoerd in een hoeveelheid van minder dan 1000 kg per jaar met het oogmerk daarmede
      in laboratoria onderzoek te verrichten of, nog niet volledig kan worden bepaald in hoeverre zij behoort tot een of
      meer categorieën als bedoeld in artikel 34, tweede lid, van de wet, moet op de verpakking van die stof, benevens de
      aanduidingen op grond van reeds uitgevoerde onderzoeken, duidelijk en onuitwisbaar zijn vermeld: "Pas op - nog niet
      volledig onderzochte stof".


      [ref1]: https://wetten.overheid.nl/BWBR0004050#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0004050#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004050#Artikel12
    url: https://wetten.overheid.nl/BWBR0004220/2007-07-01#Artikel4
