  - number: '8'
    text: Het Besluit Aflevering Gevaarlijke Stoffen (*Stb.* 1979, 764) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004220/2007-07-01#Artikel8
  - number: '9'
    text: |-
      1 Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.

      2 Een wijziging van bijlage I, V of VI bij de stoffenrichtlijn treedt voor de toepassing van
      [artikel 3, eerste lid, onderscheidenlijk tweede lid][ref1], onderscheidenlijk [artikel 2, tweede lid][ref2], in
      werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.

      3 Onze Minister van Volksgezondheid, Welzijn en Sport in overeenstemming met de Minister van Sociale Zaken en
      Werkgelegenheid kan bij ministeriële regeling onderdelen van een in werking getreden wijziging als bedoeld in het
      tweede lid, voor door hem aan te wijzen categorieën stoffen tot een door hem te bepalen tijdstip buiten toepassing
      laten.

      4 Indien één van de bijlagen van de stoffenrichtlijn, bedoeld in het tweede lid, wordt gewijzigd, zal Onze Minister
      van Volksgezondheid, Welzijn en Sport dit bekend maken in de Nederlandse Staatscourant. Hij maakt daarbij tevens
      bekend wanneer de wijziging in werking treedt.

      5 Het besluit kan worden aangehaald als Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004220#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004220#Artikel2
