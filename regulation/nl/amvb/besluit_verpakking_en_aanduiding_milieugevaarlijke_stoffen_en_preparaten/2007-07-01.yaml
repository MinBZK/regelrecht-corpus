  - number: 6a
    text: |-
      1 De indeling van een preparaat in een categorie als bedoeld in
      [artikel 34, tweede lid, onder a tot en met e, van de wet][ref1], dient te geschieden op grond van onderzoek naar
      de in die onderdelen bedoelde gevaarlijke eigenschappen.

      2 In afwijking van het eerste lid kan de indeling van een preparaat in een categorie als bedoeld in dat lid
      achterwege blijven, indien:

      a. geen enkel bestanddeel van dat preparaat de in [artikel 34, tweede lid, onder a tot en met e van de wet][ref2],
      bedoelde eigenschappen heeft en het volgens de gegevens waarover de fabrikant beschikt weinig waarschijnlijk is dat
      bij het preparaat een dergelijk gevaar aanwezig is, of

      b. in het geval van wijziging van de samenstelling van een preparaat met bekende samenstelling, er
      wetenschappelijke aanwijzingen zijn dat een nieuwe beoordeling van de gevaren niet tot een wijziging van de
      indeling zal leiden.

      3 Bij regeling van Onze Ministers worden nadere regels gesteld ter zake van het onderzoek en de in het eerste lid
      genoemde indeling van een preparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0004220/2007-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '34'
  - number: 6b
    text: |-
      1 Voor de indeling van een preparaat in een categorie als bedoeld in
      [artikel 34, tweede lid, onder f tot en met n, van de wet][ref1], is van toepassing de door Onze Ministers vast
      te stellen methode met bijbehorende criteria, die gebaseerd is op de eigenschappen van de stoffen waaruit het
      preparaat is samengesteld en de concentraties waarin die stoffen in het preparaat voorkomen.

      2 In afwijking van het eerste lid wordt een preparaat overeenkomstig de criteria van
      bijlage VI bij de stoffenrichtlijn, ingedeeld in één of meer van de categorieën bedoeld in
      [artikel 34, tweede lid, onder f tot en met j, van de wet][ref2], indien met betrekking tot die indeling
      toxicologische gegevens beschikbaar zijn.

      3 Bij regeling van Onze Ministers worden regels gesteld over de wijze waarop de toxicologische gegevens bedoeld in
      het tweede lid worden bepaald.

      4 In de in het derde lid bedoelde regels kunnen tevens bijzondere omstandigheden worden aangewezen die van invloed
      zijn op de indeling van het preparaat.

      5 Onze Ministers bepalen in welke gevallen een wijziging in de samenstelling van een preparaat dat is ingedeeld in
      een categorie als bedoeld in [artikel 34, tweede lid, onder f tot en met n, van de wet][ref3], leidt tot een nieuwe
      beoordeling van die indeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0004220/2007-07-01#Artikel6b
