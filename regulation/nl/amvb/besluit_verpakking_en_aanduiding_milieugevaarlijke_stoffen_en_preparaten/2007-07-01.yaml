preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 2 april 1987, DGVGZ/VVP/P-
    80823, gedaan mede namens Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Sociale
    Zaken en Werkgelegenheid;

    Gelet op de artikelen 34, derde lid, 36, tweede lid, 37, 39, tweede, derde en vierde lid, en 60, derde lid, van de
    Wet milieugevaarlijke stoffen (Stb. 1985, 639);

    De Raad van State gehoord (advies van 17 juni 1987, no. W13.87.0179);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 8 september 1987,
    DGVGZ/VVP/P-81749, uitgebracht mede namens Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
    en de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004220/2007-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de wet: de [Wet milieugevaarlijke stoffen][ref1];

      b. stoffenrichtlijn: [richtlijn nr. 67/548/EEG](31967L0548) van de Raad van de Europese Gemeenschappen van 27
      juni 1967 betreffende de aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake de indeling, de
      verpakking en het kenmerken van gevaarlijke stoffen (PbEG L 196);

      c. Onze Ministers: Onze Ministers van Volksgezondheid, Welzijn en Sport, van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer en van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003892
    url: https://wetten.overheid.nl/BWBR0004220/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003892
  - number: '2'
    text: |-
      1 De criteria volgens welke een stof moet worden ingedeeld in een categorie als bedoeld in
      [artikel 34, tweede lid, van de wet][ref1], zijn voor de onderscheidene categorieën als volgt:

      a. ontplofbaar: stoffen en preparaten in vaste, vloeibare, pasta- of gelatine-achtige toestand, die ook zonder
      de inwerking van zuurstof in de lucht exotherm kunnen reageren, hierbij snel gassen ontwikkelen en onder bepaalde
      voorwaarden ontploffen, snel explosief verbranden of door verhitting bij gedeeltelijke afsluiting ontploffen;

      b. oxyderend: stoffen en preparaten die bij aanraking met andere stoffen, met name ontvlambare stoffen, sterk
      exotherm reageren;

      c. zeer licht ontvlambaar: stoffen en preparaten in vloeibare toestand met een uiterst laag vlampunt en een laag
      kookpunt, alsmede gasvormige stoffen en preparaten die bij normale temperatuur en druk aan de lucht blootgesteld,
      kunnen ontbranden;

      d. licht ontvlambaar: stoffen en preparaten die:

      1°. bij normale temperatuur aan de lucht blootgesteld, zonder toevoer van energie in temperatuur kunnen stijgen en
      tenslotte kunnen ontbranden;

      2°. in vaste toestand, door kortstondige inwerking van een ontstekingsbron, gemakkelijk kunnen ontbranden en na
      verwijdering van de ontstekingsbron blijven branden of gloeien;

      3°. in vloeibare toestand, een zeer laag vlampunt hebben, of

      4°. bij aanraking met water of vochtige lucht, zeer licht ontvlambare gassen in een gevaarlijke hoeveelheid
      ontwikkelen;

      e. ontvlambaar: vloeibare stoffen en preparaten met een laag vlampunt;

      f. zeer vergiftig: stoffen en preparaten waarvan reeds een zeer geringe hoeveelheid bij inademing of opneming via
      de mond of via de huid acute of chronische aandoeningen of de dood kan veroorzaken;

      g. vergiftig: stoffen en preparaten waarvan reeds een geringe hoeveelheid bij inademing of opneming via de mond of
      via de huid acute of chronische aandoeningen of de dood kan veroorzaken;

      h. schadelijk: stoffen en preparaten die bij inademing of opneming via de mond of via de huid acute of chronische
      aandoeningen of de dood kunnen veroorzaken;

      i. bijtend: stoffen en preparaten die bij aanraking met levende weefsels daarop een vernietigende werking kunnen
      uitoefenen;

      j. irriterend: niet-bijtende stoffen en preparaten die bij directe, langdurige of herhaalde aanraking met de huid
      of de slijmvliezen een ontsteking kunnen veroorzaken;

      k. sensibiliserend: stoffen en preparaten die bij inademing of bij opneming via de huid aanleiding kunnen geven tot
      een zodanige reactie van hypersensibilisatie dat latere blootstelling aan de stof of het preparaat karakteristieke
      nadelige effecten veroorzaakt;

      l. kankerverwekkend: stoffen en preparaten die bij inademing of bij opneming via de mond of via de huid kanker
      kunnen veroorzaken of de frequentie van kanker doen toenemen;

      m. mutageen: stoffen en preparaten die bij inademing of bij opneming via de mond of via de huid erfelijke
      genetische afwijkingen kunnen veroorzaken of de frequentie van deze afwijkingen doen toenemen;

      n. voor de voortplanting vergiftige: stoffen en preparaten die bij inademing of bij opneming via de mond of via
      de huid niet-erfelijke afwijkingen bij het nageslacht alsmede of uitsluitend aantasting van de mannelijke of
      vrouwelijke voortplantingsfuncties of -vermogens kunnen veroorzaken, dan wel de frequentie van deze afwijkingen of
      aantasting doen toenemen;

      o. milieugevaarlijk: stoffen en preparaten die, wanneer zij in het milieu terechtkomen, onmiddellijk of na verloop
      van tijd gevaar voor een of meer milieucompartimenten opleveren of kunnen opleveren.

      2 Voor de indeling van een stof in een categorie als bedoeld in [artikel 34, tweede lid, van de wet][ref2], zijn
      tevens van toepassing de criteria die zijn vastgelegd in bijlage VI bij de stoffenrichtlijn.

      3 Het bepaalde in het eerste lid, onder a tot en met e, is niet van toepassing op aërosolen als bedoeld in het
      [Warenwetbesluit drukverpakkingen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0007965
