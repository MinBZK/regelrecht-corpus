  - number: 6c
    text: |-
      1 Op de indeling van een preparaat in de categorie milieugevaarlijk als bedoeld in
      [artikel 34, tweede lid, onder o, van de wet][ref1], is van toepassing de bij regeling van Onze Ministers vast te
      stellen methode met bijbehorende criteria.

      2 Bij regeling van Onze Ministers wordt voor preparaten waarvan de samenstelling bekend is, met uitzondering
      van de onder [richtlijn nr. 91/414/EEG](31991L0414) van de Raad van de Europese Gemeenschappen van 15 juli 1991
      betreffende het op de markt brengen van gewasbeschermingsmiddelen (PbEG L 230) vallende preparaten die zijn
      ingedeeld volgens andere internationaal erkende methoden die in overeenstemming zijn met de bepalingen van de
      bijlagen II en III bij [richtlijn nr. 91/414/EEG](31991L0414) van de Raad van de Europese Gemeenschappen van 15
      juli 1991 betreffende het op de markt brengen van gewasbeschermingsmiddelen (PbEG L 230), vastgesteld in welke
      gevallen een nieuwe beoordeling van de gevaren voor het milieu plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0004220/2007-07-01#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
  - number: 6d
    text: |-
      1 Degene die verantwoordelijk is voor het in de handel brengen van een stof of een preparaat houdt ter beschikking:

      a. de gegevens die zijn gebruikt voor de indeling en het kenmerken van het preparaat;

      b. alle nuttige informatie betreffende de wijze van verpakking van die verpakkingen die preparaten bevatten
      welke aan het grote publiek te koop aangeboden of verkocht worden met inbegrip van het certificaat dat na proeven
      overeenkomstig bijlage IX, deel A, bij [richtlijn nr. 1999/45/EG](31999L0045) van het Europees Parlement en de Raad
      van de Europese Unie van 31 mei 1999 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke
      bepalingen van de lidstaten inzake de indeling, de verpakking en het kenmerken van gevaarlijke preparaten (PbEG L
      200), wordt verstrekt.

      2 Bij regeling van Onze Ministers worden instanties aangewezen ten behoeve waarvan de in het eerste lid genoemde
      gegevens ter beschikking worden gehouden.

      3 Bij regeling van Onze Ministers kunnen nadere regels worden gesteld betreffende het vragen van inlichtingen over
      de samenstelling van het preparaat en alle andere nuttige informatie aan de persoon die verantwoordelijk is voor
      het in de handel brengen van het preparaat.
    url: https://wetten.overheid.nl/BWBR0004220/2007-07-01#Artikel6d
  - number: 6e
    text: |-
      Elke vorm van reclame voor een preparaat waarbij een particulier een koopcontract kan sluiten zonder eerst de
      verpakking, het etiket daarbij inbegrepen, van het preparaat te hebben gezien, vermeldt de daarop aangeduide soort
      of soorten gevaren als bedoeld in [artikel 34, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0004220/2007-07-01#Artikel6e
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
  - number: 6f
    text: |-
      Bij regeling van Onze Ministers kunnen preparaten worden aangewezen waarop de
      [artikelen 34 tot en met 38 van de wet][ref1] geheel of voor een daarbij te bepalen gedeelte niet van toepassing
      zijn indien deze preparaten in de vorm waarin ze in de handel zijn gebracht geen gevarenopleveren uit fysisch-
      chemische eigenschappen, noch gevaren opleveren voor gezondheid of voor het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0004220/2007-07-01#Artikel6f
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
  - number: '7'
    text: |-
      1 De [artikelen 34 tot en met 37][ref1] en [artikel 38, eerste lid, van de wet][ref2] zijn niet van toepassing op:

      a. springstoffen die in de handel worden gebracht met het oog op hun explosieve of pyrotechnische eigenschappen;

      b. stoffen, alsmede preparaten als bedoeld in [artikel 6, eerste lid][ref3], in douanevervoer, die onder toezicht
      staan van de douane en niet worden bewerkt of verwerkt;

      c. stoffen, alsmede preparaten als bedoeld in [artikel 6, eerste lid][ref4], in de vorm van afvalstoffen waarop
      richtlijn nr. 2006/12/EG van het Europees Parlement en de Raad van 5 april 2006 betreffende afvalstoffen (PbEU L
      114) of [richtlijn nr. 78/319/EEG](31978L0319) van de Raad van 20 maart 1978 betreffende toxische en gevaarlijke
      afvalstoffen (PbEG L 319) van toepassing zijn;

      d. preparaten die radioactieve stoffen als omschreven in [richtlijn nr. 80/836](31980L0836)/Euratom van de Raad van
      15 juli 1980 houdende wijziging van de richtlijnen tot vaststelling van de basisnormen voor de bescherming van de
      gezondheid der bevolking en der werknemers tegen de aan ioniserende straling verbonden gevaren, bevatten;

      e. medische hulpmiddelen die invasief zijn of in direct contact komen met het lichaam, voorzover er communautaire
      voorschriften voor de indeling en kenmerking van gevaarlijke stoffen en preparaten voorhanden zijn die eenzelfde
      niveau van informatie en bescherming verzekeren als [richtlijn nr. 1999/45/EG](31999L0045) van het Europees
      Parlement en de Raad van de Europese Unie van 31 mei 1999 betreffende de onderlinge aanpassing van de wettelijke en
      bestuursrechtelijke bepalingen van de lidstaten inzake de indeling, de verpakking en het kenmerken van gevaarlijke
      preparaten (PbEG L 200);

      f. geneesmiddelen als bedoeld in de [Geneesmiddelenwet][ref5] en de [Diergeneesmiddelenwet][ref6].

      2 De [artikelen 34 tot en met 37][ref7] en [artikel 38, eerste lid, van de wet][ref8] zijn tot 30 april 1997
      evenmin van toepassing op butaan, propaan en vloeibaar gemaakt petroleumgas, met uitzondering van aërosolen als
      bedoeld in het [Warenwetbesluit drukverpakkingen][ref9].


