  - number: '3'
    text: |-
      1 Voor zover van een stof een kennisgeving als bedoeld in [artikel 4, derde lid, van de wet][ref1] is gedaan,
      dient ter bepaling of de stof behoort tot een categorie als bedoeld in [artikel 34, tweede lid, van de wet][ref2],
      gebruik te worden gemaakt van de bij de kennisgeving overgelegde gegevens. Voor stoffen die voorkomen op de
      Europese inventaris van bestaande commerciële stoffen (European Inventory of Existing Commercial Substances
      (EINECS))(*PbEG* 90/C 146A), doch niet zijn opgenomen in bijlage I bij de stoffenrichtlijn, dient hierbij gebruik
      te worden gemaakt van de bestaande relevante en toegankelijke gegevens over de eigenschappen van de stof.

      2 Onderzoek dat wordt uitgevoerd teneinde vast te stellen of een stof als bedoeld in de tweede volzin van het
      eerste lid behoort tot een categorie als bedoeld in [artikel 34, tweede lid, van de wet][ref3], dient te worden
      uitgevoerd met toepassing van methoden, vastgelegd in bijlage V bij de stoffenrichtlijn.

      3 Dit artikel is niet van toepassing op stoffen die zijn opgenomen op de in
      [artikel 36, vierde lid, van de wet][ref4] bedoelde lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
