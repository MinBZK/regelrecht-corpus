  - number: '4'
    text: |-
      1 De exploitant van een dierentuin beschikt over een door Onze Minister verstrekte vergunning.

      2 De vergunning, bedoeld in het eerste lid, wordt overeenkomstig de procedure in het derde tot en met het zesde lid
      verleend indien is voldaan aan de [artikelen 7 tot en met 13][ref1].

      3 De exploitant van een dierentuin vraagt een vergunning aan bij Onze Minister met gebruikmaking van een daartoe
      bestemd formulier dat op verzoek ter beschikking wordt gesteld.

      4 Alvorens een vergunning wordt verleend, aanzienlijk gewijzigd of geweigerd, wordt een dierentuin door Onze
      Minister geïnspecteerd.

      5 Aan een vergunning als bedoeld in het eerste lid kunnen voorschriften worden verbonden. De vergunning kan onder
      beperkingen worden verleend. Tot de voorschriften kan behoren de verplichting specifieke voorzieningen aan te
      brengen om de dierentuin of bepaalde gedeelten van de dierentuin in overeenstemming te brengen met de bepalingen
      van dit besluit.

      6 Aan een vergunning worden voorschriften en beperkingen verbonden, die strekken tot nadere uitwerking van de
      in het besluit gestelde eisen. De aan de vergunning verbonden voorschriften en de beperkingen waaronder deze is
      verleend, kunnen worden gewijzigd, aangevuld of ingetrokken.

      7 Onze Minister beslist binnen 13 weken na de ontvangst van een aanvraag als bedoeld in het derde lid.

      8 Onze Minister houdt een register bij van de vergunningen.

      9 Een voor een dierentuin verleende vergunning geldt tevens voor veranderingen van een dierentuin die niet
      overeenkomstig het vierde lid zijn geïnspecteerd voorafgaand aan de vergunningverlening, onder voorwaarde dat:

      a. deze veranderingen geen wijziging van de vergunning eisen, maar voldoen aan de eisen van dit besluit en de aan
      de vergunning verbonden beperkingen en voorschriften;

      b. het voornemen tot het uitvoeren van de verandering door de vergunninghouder schriftelijk aan Onze Minister is
      gemeld;

      c. Onze Minister aan de vergunninghouder schriftelijk heeft verklaard dat de voorgenomen verandering voldoet aan
      onderdeel a.

      10 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref2] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref3] niet van toepassing op de aanvraag voor een vergunning
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
