        artikel: '7'
        paragraaf: '3'
  - number: '9'
    text: |-
      1 De verzorging is afgestemd op de behoeften van het dier.

      2 De conditie en de gezondheid van het dier worden dagelijks gecontroleerd.

      3 Een dier wordt verzorgd door een voldoende aantal personen, dat beschikt over de nodige kennis, vaardigheden
      en vakbekwaamheid.

      4 Een dier dat ziek of gewond is, wordt op passende wijze verzorgd. Indien de zorg geen verbetering in de toestand
      van het dier brengt, wordt zo spoedig mogelijk een dierenarts geraadpleegd.

      5 Een ziek of gewond dier wordt zo nodig afgezonderd in een passend onderkomen.

      6 De dierentuin beschikt over een quarantainevoorziening en een behandelruimte.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel9
  - number: '10'
    text: |-
      1 Een dier heeft toegang tot een toereikende hoeveelheid schoon water of kan op een andere wijze aan zijn behoefte
      aan water voldoen.

      2 Een dier krijgt een toereikende hoeveelheid gezond en voor de soort en de leeftijd geschikt voeder, zodat het in
      goede gezondheid blijft en aan zijn voedingsbehoeften wordt voldaan.

      3 Het toedienen van het voeder is afgestemd op de fysiologische behoeften van de diersoort en stimuleert de
      natuurlijke wijze van voedselvergaren.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel10
  - number: '11'
    text: |-
      1 De verblijven worden zo vaak als nodig grondig gereinigd en ontsmet.

      2 Zwemwater, stro of ander bodembedekkend materiaal wordt naar behoefte van de diersoort vervangen.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel11
  - number: '12'
    text: |-
      1 De dierentuin beschikt over een beleidsprotocol met daarin opgenomen een eenduidig beleid met betrekking tot de
      in het tweede tot en met het zesde lid genoemde onderwerpen en handelt dienovereenkomstig.

      2 De dierentuin bevordert de instandhouding van de diersoorten door het uitvoeren van ten minste een van de
      volgende activiteiten:

      a. de deelname aan onderzoek dat gunstige gevolgen heeft voor het behoud van de diersoorten, de opleiding van het
      personeel in voor het onderzoek relevante vaardigheden en de uitwisseling van de verkregen informatie met andere
      dierentuinen;

      b. zoveel mogelijk deelnemen aan bestaande programma's met betrekking tot het fokken van dieren in gevangenschap,
      het herstel van de populatie of het herintroduceren van soorten in hun natuurlijke omgeving.

      3 Bij de transactie van dieren verzekert de dierentuin zich ervan dat de ontvangende partij de dieren houdt,
      huisvest en verzorgt op een wijze die vergelijkbaar is met de eisen uit dit besluit.

      4 De dierentuin beschikt over een noodplan met betrekking tot de ontsnapping van dieren.

      5 De dierentuin beschikt over een protocol met betrekking tot de voedingsaspecten, bedoeld in [artikel 10][ref1]
      en de preventieve en curatieve diergeneeskundige verzorging van de dieren, dat is opgesteld onder begeleiding van
      een dierenarts.

      6 De dierentuin beschikt over een informatief en educatief programma met betrekking tot de tentoongestelde
      diersoorten. Bij het verstrekken van informatie worden de dieren zoveel mogelijk in hun biologische en ecologische
      context geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel10
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel12
    references:
