        artikel: '12'
        paragraaf: '4'
  - number: '6'
    text: |-
      1 Het houden van dieren in een dierentuin geschiedt overeenkomstig [artikel 7][ref1].

      2 Het huisvesten van dieren in een dierentuin geschiedt overeenkomstig [artikel 8][ref2].

      3 Het verzorgen van dieren in een dierentuin geschiedt overeenkomstig de [artikelen 9][ref3], [10][ref4] en
      [11][ref5].

      4 Het tonen van dieren aan het publiek geschiedt slechts indien wordt voldaan aan de eisen gesteld in de
      [artikelen 12][ref6] en [13][ref7].


