  - number: '5'
    text: |-
      De vergunningaanvraag bevat in ieder geval de volgende gegevens:

      a. het aantal en de soorten te houden wilde dieren;

      b. het aantal dagen per jaar dat de diersoorten worden tentoongesteld aan publiek;

      c. informatie over het aantal personeelsleden en de kwalificatie;

      d. een plattegrond met een weergave van de afmeting en inrichting van de dierenverblijven en de daarin verblijvende
      diersoorten;

      e. een afschrift van het beleidsprotocol als bedoeld in [artikel 12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel12
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel5
