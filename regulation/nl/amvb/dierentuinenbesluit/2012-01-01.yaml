---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: dierentuinenbesluit
regulatory_layer: AMVB
publication_date: '2014-06-19'
valid_from: '2012-01-01'
bwb_id: BWBR0013625
url: https://wetten.overheid.nl/BWBR0013625/2012-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 11 december 2001, no.
    TRCJZ/2001/17 402, Directie Juridische Zaken;

    Gelet op richtlijn nr. 1999/22/EG van de Raad van de Europese Unie van 29 maart 1999 betreffende het houden
    van wilde dieren in dierentuinen (PbEG L 94) en gelet op de artikelen 35, 38, 45, 65 en 111 van de Gezondheids-
    en welzijnswet voor dieren en artikel 3, eerste lid en derde tot en met achtste lid, van de Wet op de
    dierenbescherming;

    De Raad van State gehoord (advies van 29 maart 2002, nr. W11.01 0674/V);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij, van 15 april 2002, no.
    TRCJZ/2002/4751, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel1
  - number: 1.a
    text: |-
      dierentuin: een permanente inrichting waar levende dieren van wilde diersoorten worden gehouden om gedurende
      ten minste zeven dagen per jaar te worden tentoongesteld aan het publiek, met uitzondering van inrichtingen
      waar maximaal 10 diersoorten worden gehouden, niet zijnde diersoorten die op grond van de [artikelen 4][ref1] en
      [5 van de Flora- en faunawet][ref2] zijn aangewezen, circussen en dierenwinkels;


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel5
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '5'
  - number: 1.b
    text: |-
      wilde diersoorten: alle van nature in het wild levende diersoorten met uitzondering van diersoorten die voorkomen
      in de bijlage bij het [Besluit aanwijzing voor productie te houden dieren](onbekend) en honden en katten;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel1
  - number: 1.c
    text: |-
      wet: [Gezondheids- en welzijnswet voor dieren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: 1.d
    text: |-
      diergroep: dieren levend in een groep, die gelet op hun omvang en kenmerken afzonderlijk niet te individualiseren
      zijn;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel1
  - number: 1.e
    text: 'dierenverblijf: ruimte waar dieren worden gehouden.'
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel1
  - number: '2'
    text: |-
      Voor de toepassing van dit besluit worden als soorten en categorieën van dieren als bedoeld in de
      [artikelen 35, eerste lid][ref1], [38, eerste lid][ref2], en [45, eerste lid, van de wet][ref3] en
      [artikel 3, eerste en vierde lid, van de Wet op de dierenbescherming][ref4] aangewezen wilde dieren uitsluitend
      voorzover zij in dierentuinen worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0002351#Artikel3
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '45'
      - id: ref4
        bwb_id: BWBR0002351
        artikel: '3'
  - number: '3'
    text: |-
      Het is verboden een dierentuin te exploiteren op een wijze die niet overeenstemt met de [artikelen 4][ref1] en
      [7 tot en met 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013625#Artikel7
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013625
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013625
        artikel: '7'
        paragraaf: '3'
  - number: '4.1'
    text: De exploitant van een dierentuin beschikt over een door Onze Minister verstrekte vergunning.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel4
  - number: '4.2'
    text: |-
      De vergunning, bedoeld in het eerste lid, wordt overeenkomstig de procedure in het derde tot en met het zesde lid
      verleend indien is voldaan aan de [artikelen 7 tot en met 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel7
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013625
        artikel: '7'
        paragraaf: '3'
  - number: '4.3'
    text: |-
      De exploitant van een dierentuin vraagt een vergunning aan bij Onze Minister met gebruikmaking van een daartoe
      bestemd formulier dat op verzoek ter beschikking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel4
  - number: '4.4'
    text: |-
      Alvorens een vergunning wordt verleend, aanzienlijk gewijzigd of geweigerd, wordt een dierentuin door Onze Minister
      geïnspecteerd.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel4
  - number: '4.5'
    text: |-
      Aan een vergunning als bedoeld in het eerste lid kunnen voorschriften worden verbonden. De vergunning kan onder
      beperkingen worden verleend. Tot de voorschriften kan behoren de verplichting specifieke voorzieningen aan te
      brengen om de dierentuin of bepaalde gedeelten van de dierentuin in overeenstemming te brengen met de bepalingen
      van dit besluit.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel4
  - number: '4.6'
    text: |-
      Aan een vergunning worden voorschriften en beperkingen verbonden, die strekken tot nadere uitwerking van de in het
      besluit gestelde eisen. De aan de vergunning verbonden voorschriften en de beperkingen waaronder deze is verleend,
      kunnen worden gewijzigd, aangevuld of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel4
  - number: '4.7'
    text: Onze Minister beslist binnen 13 weken na de ontvangst van een aanvraag als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel4
  - number: '4.8'
    text: Onze Minister houdt een register bij van de vergunningen.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel4
  - number: '4.9'
    text: |-
      Een voor een dierentuin verleende vergunning geldt tevens voor veranderingen van een dierentuin die niet
      overeenkomstig het vierde lid zijn geïnspecteerd voorafgaand aan de vergunningverlening, onder voorwaarde dat:
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel4
  - number: 4.9.a
    text: |-
      deze veranderingen geen wijziging van de vergunning eisen, maar voldoen aan de eisen van dit besluit en de aan de
      vergunning verbonden beperkingen en voorschriften;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel4
  - number: 4.9.b
    text: |-
      het voornemen tot het uitvoeren van de verandering door de vergunninghouder schriftelijk aan Onze Minister is
      gemeld;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel4
  - number: 4.9.c
    text: |-
      Onze Minister aan de vergunninghouder schriftelijk heeft verklaard dat de voorgenomen verandering voldoet aan
      onderdeel a.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel4
  - number: '4.10'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag voor een vergunning
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '5'
    text: 'De vergunningaanvraag bevat in ieder geval de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel5
  - number: 5.a
    text: het aantal en de soorten te houden wilde dieren;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel5
  - number: 5.b
    text: het aantal dagen per jaar dat de diersoorten worden tentoongesteld aan publiek;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel5
  - number: 5.c
    text: informatie over het aantal personeelsleden en de kwalificatie;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel5
  - number: 5.d
    text: |-
      een plattegrond met een weergave van de afmeting en inrichting van de dierenverblijven en de daarin verblijvende
      diersoorten;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel5
  - number: 5.e
    text: |-
      een afschrift van het beleidsprotocol als bedoeld in [artikel 12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel12
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013625
        artikel: '12'
        paragraaf: '4'
  - number: '6.1'
    text: |-
      Het houden van dieren in een dierentuin geschiedt overeenkomstig [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel7
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013625
        artikel: '7'
        paragraaf: '3'
  - number: '6.2'
    text: |-
      Het huisvesten van dieren in een dierentuin geschiedt overeenkomstig [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel8
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013625
        artikel: '8'
        paragraaf: '3'
  - number: '6.3'
    text: |-
      Het verzorgen van dieren in een dierentuin geschiedt overeenkomstig de [artikelen 9][ref1], [10][ref2] en
      [11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013625#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0013625#Artikel11
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013625
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013625
        artikel: '10'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013625
        artikel: '11'
        paragraaf: '3'
  - number: '6.4'
    text: |-
      Het tonen van dieren aan het publiek geschiedt slechts indien wordt voldaan aan de eisen gesteld in de
      [artikelen 12][ref1] en [13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013625#Artikel13
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013625
        artikel: '12'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0013625
        artikel: '13'
        paragraaf: '4'
  - number: '7'
    text: 'De dierentuin houdt de dieren op zodanige wijze dat:'
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel7
  - number: 7.a
    text: het soorteigen gedrag van de diersoorten wordt gerespecteerd en zoveel mogelijk in stand gehouden;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel7
  - number: 7.b
    text: |-
      de bewegingsvrijheid van de diersoorten niet op zodanige wijze wordt beperkt dat het dier daardoor onnodig lijden
      of letsel wordt toegebracht;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel7
  - number: 7.c
    text: |-
      de sociale levenswijze van de dieren in het wild zo veel mogelijk tot uitdrukking komt, rekening houdend met de
      mogelijkheden van het individuele dier;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel7
  - number: 7.d
    text: |-
      de dieren voldoende ruimte hebben en de bezetting van de verblijven de materiële capaciteit van de dierentuin niet
      overschrijdt;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel7
  - number: 7.e
    text: rekening wordt gehouden met de behoeften van het individuele dier.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel7
  - number: '8.1'
    text: 'Bij de inrichting van de dierenverblijven wordt rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel8
  - number: 8.1.a
    text: |-
      het soorteigen bewegingsgedrag, door het verblijf te voorzien van zoveel mogelijk elementen lijkend op de
      natuurlijke leefomgeving;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel8
  - number: 8.1.b
    text: |-
      het klimaat waarin de diersoort van nature leeft en het soorteigen bioritme, door het verblijf te voorzien van
      adequate beschutting en bescherming tegen voor de desbetreffende diersoort extreme weersomstandigheden en een
      adequate klimaatbeheersing en verlichting;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel8
  - number: 8.1.c
    text: |-
      het soorteigen sociale gedrag, door het verblijf bij solitaire huisvesting te voorzien van een voor de diersoort
      geschikte rusten schuilplaats en bij groepshuisvesting te voorzien van een rust- en schuilplaats die een dier de
      mogelijkheid biedt zich af te zonderen van de andere dieren;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel8
  - number: 8.1.d
    text: |-
      het soorteigen paringsgedrag, door de dieren op adequate wijze van elkaar te scheiden of in het verblijf waarin de
      dieren gedurende de paringstijd worden gehouden voorzieningen aan te brengen waardoor het soorteigen paringsgedrag
      mogelijk wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel8
  - number: 8.1.e
    text: |-
      het soorteigen uitscheidingsgedrag, door het verblijf indien nodig te voorzien van een voor de diersoort geschikte
      mestplaats.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel8
  - number: '8.2'
    text: |-
      De dierenverblijven zijn voorzien van een adequate afscheiding die het uitbreken van de dieren voorkomt en een
      veilige barrière tussen de dieren en het publiek vormt.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel8
  - number: '8.3'
    text: Het materiaal dat wordt gebruikt voor de dierenverblijven is niet schadelijk voor het dier.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel8
  - number: '8.4'
    text: |-
      Van de voorschriften, bedoeld in het eerste lid onderdelen a, b en c en [artikel 7, onderdeel d][ref1],
      kan tijdelijk worden afgeweken indien er opvang wordt geboden aan een dier of diergroep waarvoor voldoende
      deskundigheid aanwezig is, maar waardoor de capaciteit van de dierentuin wordt overschreden en de opvang niet
      elders op betere wijze kan plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel7
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013625
        artikel: '7'
        paragraaf: '3'
  - number: '9.1'
    text: De verzorging is afgestemd op de behoeften van het dier.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel9
  - number: '9.2'
    text: De conditie en de gezondheid van het dier worden dagelijks gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel9
  - number: '9.3'
    text: |-
      Een dier wordt verzorgd door een voldoende aantal personen, dat beschikt over de nodige kennis, vaardigheden en
      vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel9
  - number: '9.4'
    text: |-
      Een dier dat ziek of gewond is, wordt op passende wijze verzorgd. Indien de zorg geen verbetering in de toestand
      van het dier brengt, wordt zo spoedig mogelijk een dierenarts geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel9
  - number: '9.5'
    text: Een ziek of gewond dier wordt zo nodig afgezonderd in een passend onderkomen.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel9
  - number: '9.6'
    text: De dierentuin beschikt over een quarantainevoorziening en een behandelruimte.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel9
  - number: '10.1'
    text: |-
      Een dier heeft toegang tot een toereikende hoeveelheid schoon water of kan op een andere wijze aan zijn behoefte
      aan water voldoen.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel10
  - number: '10.2'
    text: |-
      Een dier krijgt een toereikende hoeveelheid gezond en voor de soort en de leeftijd geschikt voeder, zodat het in
      goede gezondheid blijft en aan zijn voedingsbehoeften wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel10
  - number: '10.3'
    text: |-
      Het toedienen van het voeder is afgestemd op de fysiologische behoeften van de diersoort en stimuleert de
      natuurlijke wijze van voedselvergaren.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel10
  - number: '11.1'
    text: De verblijven worden zo vaak als nodig grondig gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel11
  - number: '11.2'
    text: Zwemwater, stro of ander bodembedekkend materiaal wordt naar behoefte van de diersoort vervangen.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel11
  - number: '12.1'
    text: |-
      De dierentuin beschikt over een beleidsprotocol met daarin opgenomen een eenduidig beleid met betrekking tot de in
      het tweede tot en met het zesde lid genoemde onderwerpen en handelt dienovereenkomstig.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel12
  - number: '12.2'
    text: |-
      De dierentuin bevordert de instandhouding van de diersoorten door het uitvoeren van ten minste een van de volgende
      activiteiten:
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel12
  - number: 12.2.a
    text: |-
      de deelname aan onderzoek dat gunstige gevolgen heeft voor het behoud van de diersoorten, de opleiding van het
      personeel in voor het onderzoek relevante vaardigheden en de uitwisseling van de verkregen informatie met andere
      dierentuinen;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel12
  - number: 12.2.b
    text: |-
      zoveel mogelijk deelnemen aan bestaande programma's met betrekking tot het fokken van dieren in gevangenschap, het
      herstel van de populatie of het herintroduceren van soorten in hun natuurlijke omgeving.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel12
  - number: '12.3'
    text: |-
      Bij de transactie van dieren verzekert de dierentuin zich ervan dat de ontvangende partij de dieren houdt, huisvest
      en verzorgt op een wijze die vergelijkbaar is met de eisen uit dit besluit.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel12
  - number: '12.4'
    text: De dierentuin beschikt over een noodplan met betrekking tot de ontsnapping van dieren.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel12
  - number: '12.5'
    text: |-
      De dierentuin beschikt over een protocol met betrekking tot de voedingsaspecten, bedoeld in [artikel 10][ref1]
      en de preventieve en curatieve diergeneeskundige verzorging van de dieren, dat is opgesteld onder begeleiding van
      een dierenarts.


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel10
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013625
        artikel: '10'
        paragraaf: '3'
  - number: '12.6'
    text: |-
      De dierentuin beschikt over een informatief en educatief programma met betrekking tot de tentoongestelde
      diersoorten. Bij het verstrekken van informatie worden de dieren zoveel mogelijk in hun biologische en ecologische
      context geplaatst.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel12
  - number: '13.1'
    text: |-
      De vergunninghouder voert een inzichtelijke registratie van elk dier of diergroep, waaruit de mutaties van de
      diersoorten en de ziektegeschiedenis blijken.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel13
  - number: '13.2'
    text: 'De registratie bevat in ieder geval de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel13
  - number: 13.2.a
    text: de wetenschappelijke soortnaam en het aantal;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel13
  - number: 13.2.b
    text: het geslacht, indien mogelijk en relevant;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel13
  - number: 13.2.c
    text: datum van verkrijging of geboortedatum;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel13
  - number: 13.2.d
    text: |-
      bij overdracht of verkrijging: de bestemming en de herkomst van de dieren en – indien van toepassing – de nummers
      van de in- en uitvoerdocumenten en certificaten;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel13
  - number: 13.2.e
    text: |-
      identificatie van het dier of de diergroep door het ringnummer, het tatoeagenummer, het microchipnummer of, indien
      een registratienummer ontbreekt, een omschrijving aan de hand van bijzondere uiterlijke kenmerken;
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel13
  - number: 13.2.f
    text: 'bij vertrek van een dier of diergroep: de datum en reden van vertrek en de naam en het adres van de eindbestemming;'
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel13
  - number: 13.2.g
    text: 'bij bezoek van de dierenarts: de datum van dit bezoek, alsmede de gezondheidstoestand van het dier;'
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel13
  - number: 13.2.h
    text: 'in geval van sterfte: de datum en de oorzaak.'
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel13
  - number: '13.3'
    text: Het register wordt ten minste een maal per maand bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel13
  - number: '13.4'
    text: |-
      Bij vertrek gaat het dier of de diergroep vergezeld van een afschrift van alle op basis van het eerste lid
      bijgehouden relevante registers en documenten.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel13
  - number: '13.5'
    text: |-
      De gegevens, bedoeld in het eerste lid worden gedurende vijf jaar na de dood of het vertrek van het dier of de
      diergroep bewaard en worden op verzoek aan de bevoegde autoriteiten overgelegd.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel13
  - number: '14.1'
    text: |-
      Indien een dierentuin niet voldoet aan de in dit besluit gestelde voorschriften of aan de vergunningsvoorwaarden
      wordt deze op last van Onze Minister geheel of gedeeltelijk gesloten voor het publiek.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister kan tevens de vergunninghouder verplichten tot het aanpassen, verwijderen of aanbrengen van
      specifieke voorzieningen onder vermelding van een bepaalde termijn, die ten hoogste twee jaar bedraagt, waarbinnen
      zulks dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel14
  - number: '14.3'
    text: |-
      Indien een dierentuin niet binnen de gestelde termijn voldoet aan de verplichtingen, bedoeld in het tweede
      lid, wordt de vergunning op last van Onze Minister ingetrokken of gewijzigd en wordt de dierentuin geheel of
      gedeeltelijk gesloten.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel14
  - number: '15'
    text: |-
      [Artikel 3][ref1] is tot 9 april 2003 niet van toepassing op een dierentuin waarvan de exploitant kan aantonen dat
      deze voor de datum van inwerkingtreding van dit besluit in gebruik is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel3
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013625
        artikel: '3'
        paragraaf: '2'
  - number: '16'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Laatstbedoeld besluit wordt niet
      genomen voordat 30 dagen zijn verstreken nadat het onderhavige besluit is overgelegd aan beide kamers der Staten-
      Generaal, en evenmin indien binnen die termijn door of namens een der kamers of door ten minste een vijfde van het
      grondwettelijke aantal leden van een der kamers de wens te kennen wordt gegeven dat de inwerkingtreding van dit
      besluit bij wet wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Dierentuinenbesluit'
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel17
