        artikel: '10'
        paragraaf: '3'
  - number: '13'
    text: |-
      1 De vergunninghouder voert een inzichtelijke registratie van elk dier of diergroep, waaruit de mutaties van de
      diersoorten en de ziektegeschiedenis blijken.

      2 De registratie bevat in ieder geval de volgende gegevens:

      a. de wetenschappelijke soortnaam en het aantal;

      b. het geslacht, indien mogelijk en relevant;

      c. datum van verkrijging of geboortedatum;

      d. bij overdracht of verkrijging: de bestemming en de herkomst van de dieren en – indien van toepassing – de
      nummers van de in- en uitvoerdocumenten en certificaten;

      e. identificatie van het dier of de diergroep door het ringnummer, het tatoeagenummer, het microchipnummer of,
      indien een registratienummer ontbreekt, een omschrijving aan de hand van bijzondere uiterlijke kenmerken;

      f. bij vertrek van een dier of diergroep: de datum en reden van vertrek en de naam en het adres van de
      eindbestemming;

      g. bij bezoek van de dierenarts: de datum van dit bezoek, alsmede de gezondheidstoestand van het dier;

      h. in geval van sterfte: de datum en de oorzaak.

      3 Het register wordt ten minste een maal per maand bijgewerkt.

      4 Bij vertrek gaat het dier of de diergroep vergezeld van een afschrift van alle op basis van het eerste lid
      bijgehouden relevante registers en documenten.

      5 De gegevens, bedoeld in het eerste lid worden gedurende vijf jaar na de dood of het vertrek van het dier of de
      diergroep bewaard en worden op verzoek aan de bevoegde autoriteiten overgelegd.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel13
  - number: '14'
    text: |-
      1 Indien een dierentuin niet voldoet aan de in dit besluit gestelde voorschriften of aan de vergunningsvoorwaarden
      wordt deze op last van Onze Minister geheel of gedeeltelijk gesloten voor het publiek.

      2 Onze Minister kan tevens de vergunninghouder verplichten tot het aanpassen, verwijderen of aanbrengen van
      specifieke voorzieningen onder vermelding van een bepaalde termijn, die ten hoogste twee jaar bedraagt, waarbinnen
      zulks dient te geschieden.

      3 Indien een dierentuin niet binnen de gestelde termijn voldoet aan de verplichtingen, bedoeld in het tweede
      lid, wordt de vergunning op last van Onze Minister ingetrokken of gewijzigd en wordt de dierentuin geheel of
      gedeeltelijk gesloten.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel14
  - number: '15'
    text: |-
      [Artikel 3][ref1] is tot 9 april 2003 niet van toepassing op een dierentuin waarvan de exploitant kan aantonen dat
      deze voor de datum van inwerkingtreding van dit besluit in gebruik is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel3
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013625
        artikel: '3'
        paragraaf: '2'
  - number: '16'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Laatstbedoeld besluit wordt niet
      genomen voordat 30 dagen zijn verstreken nadat het onderhavige besluit is overgelegd aan beide kamers der Staten-
      Generaal, en evenmin indien binnen die termijn door of namens een der kamers of door ten minste een vijfde van het
      grondwettelijke aantal leden van een der kamers de wens te kennen wordt gegeven dat de inwerkingtreding van dit
      besluit bij wet wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Dierentuinenbesluit'
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel17
