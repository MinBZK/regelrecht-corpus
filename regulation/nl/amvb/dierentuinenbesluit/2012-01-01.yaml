  - number: '7'
    text: |-
      De dierentuin houdt de dieren op zodanige wijze dat:

      a. het soorteigen gedrag van de diersoorten wordt gerespecteerd en zoveel mogelijk in stand gehouden;

      b. de bewegingsvrijheid van de diersoorten niet op zodanige wijze wordt beperkt dat het dier daardoor onnodig
      lijden of letsel wordt toegebracht;

      c. de sociale levenswijze van de dieren in het wild zo veel mogelijk tot uitdrukking komt, rekening houdend met de
      mogelijkheden van het individuele dier;

      d. de dieren voldoende ruimte hebben en de bezetting van de verblijven de materiële capaciteit van de dierentuin
      niet overschrijdt;

      e. rekening wordt gehouden met de behoeften van het individuele dier.
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel7
  - number: '8'
    text: |-
      1 Bij de inrichting van de dierenverblijven wordt rekening gehouden met:

      a. het soorteigen bewegingsgedrag, door het verblijf te voorzien van zoveel mogelijk elementen lijkend op de
      natuurlijke leefomgeving;

      b. het klimaat waarin de diersoort van nature leeft en het soorteigen bioritme, door het verblijf te voorzien
      van adequate beschutting en bescherming tegen voor de desbetreffende diersoort extreme weersomstandigheden en een
      adequate klimaatbeheersing en verlichting;

      c. het soorteigen sociale gedrag, door het verblijf bij solitaire huisvesting te voorzien van een voor de diersoort
      geschikte rusten schuilplaats en bij groepshuisvesting te voorzien van een rust- en schuilplaats die een dier de
      mogelijkheid biedt zich af te zonderen van de andere dieren;

      d. het soorteigen paringsgedrag, door de dieren op adequate wijze van elkaar te scheiden of in het verblijf
      waarin de dieren gedurende de paringstijd worden gehouden voorzieningen aan te brengen waardoor het soorteigen
      paringsgedrag mogelijk wordt gemaakt;

      e. het soorteigen uitscheidingsgedrag, door het verblijf indien nodig te voorzien van een voor de diersoort
      geschikte mestplaats.

      2 De dierenverblijven zijn voorzien van een adequate afscheiding die het uitbreken van de dieren voorkomt en een
      veilige barrière tussen de dieren en het publiek vormt.

      3 Het materiaal dat wordt gebruikt voor de dierenverblijven is niet schadelijk voor het dier.

      4 Van de voorschriften, bedoeld in het eerste lid onderdelen a, b en c en [artikel 7, onderdeel d][ref1],
      kan tijdelijk worden afgeweken indien er opvang wordt geboden aan een dier of diergroep waarvoor voldoende
      deskundigheid aanwezig is, maar waardoor de capaciteit van de dierentuin wordt overschreden en de opvang niet
      elders op betere wijze kan plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0013625#Artikel7
    url: https://wetten.overheid.nl/BWBR0013625/2012-01-01#Artikel8
    references:
