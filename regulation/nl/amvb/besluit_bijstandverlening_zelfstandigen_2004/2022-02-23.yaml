    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 3 september 2003, Directie
    Bijstand en Gemeentelijk Activeringsbeleid, nr. B&GA/WWB/03/70143;

    Gelet op artikel 7 van de Invoeringswet Wet werk en bijstand;

    De Raad van State gehoord (advies van 18 september 2003, nr. W12.03.0369/IV);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 9 oktober 2003, Directie
    Werk en Bijstand, nr. W&B/WWB/03/76459;

    Hebben goedgevonden en verstaan:
