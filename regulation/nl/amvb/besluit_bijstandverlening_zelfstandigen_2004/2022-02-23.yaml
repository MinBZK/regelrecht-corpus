        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '21'
    text: |-
      1 De op grond van de [artikelen 15][ref1] en [20][ref2] verschuldigde rente wordt ambtshalve kwijtgescholden en
      reeds betaalde rente terugbetaald, indien het netto inkomen in een of beide boekjaren volgend op het boekjaar van
      de aanvraag, lager is dan de jaarnorm, tenzij in een boekjaar aan de zelfstandige ook algemene bijstand, bedoeld in
      [artikel 10][ref3], is verleend. Het bedrag is ten hoogste de voor dat boekjaar geldende renteverplichting op grond
      van artikel 15, doch niet meer dan het verschil tussen de jaarnorm en het netto inkomen in het boekjaar.

      2 Indien de bijstand is verleend in de vorm van borgtocht op grond van de [artikelen 16][ref4] en [20][ref5], is
      het eerste lid van overeenkomstige toepassing op de door de bank verstrekte lening. Het aldus berekende bedrag
      wordt verstrekt als een bedrag om niet. Aan deze bijstand wordt de voorwaarde verbonden dat deze wordt aangewend
      ter aflossing of tot rentebetaling op de door de bank verstrekte lening.

      3 Het bedrag van de op grond van het eerste lid kwijtgescholden of terugbetaalde rente, of het op grond van het
      tweede lid berekende bedrag om niet, kan tezamen met de over hetzelfde boekjaar verleende bijstand ingevolge
      [hoofdstuk II, paragraaf 4][ref6], niet meer bedragen dan de jaarnorm.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel20
