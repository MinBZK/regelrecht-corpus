  - number: '57'
    text: |-
      In afwijking van [artikel 34 van de wet][ref1] wordt vermogen niet in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel57
