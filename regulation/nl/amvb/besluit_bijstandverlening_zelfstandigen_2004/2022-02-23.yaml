        paragraaf: '1'
  - number: '32'
    text: |-
      Indien bijstand wordt verleend aan een zelfstandige die zijn bedrijf of zelfstandig beroep uitoefent in een
      samenwerkingsverband of in de vorm van een rechtspersoon, gelden de bedragen van de vermogensgrenzen, bedoeld in
      [artikel 3][ref1], voor ieder van de vennoten of leden afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel3
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '33'
    text: |-
      Ten aanzien van de zelfstandige die het bedrijf of zelfstandig beroep uitoefent in de vorm van een besloten
      vennootschap of een coöperatieve vereniging met wettelijke aansprakelijkheid, wordt onder netto inkomen als bedoeld
      in [artikel 1, onderdeel e][ref1], mede verstaan de naar evenredigheid van het aantal zelfstandigen in een boekjaar
      omgerekende winst van deze rechtspersoon verminderd met de hierover verschuldigde vennootschapsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel1
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: '1'
        hoofdstuk: I
  - number: '34'
    text: |-
      De bijstand die met toepassing van [artikel 37][ref1] wordt verleend heeft voorlopig de vorm van een renteloze
      geldlening. Het bepaalde bij en krachtens [artikel 11, tweede lid][ref2], is op deze geldlening van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel11
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: '37'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0015711
        artikel: '11'
        hoofdstuk: II
        paragraaf: '4'
  - number: '35'
    text: |-
      1 De aanvraag wordt ingediend bij het college.

      2 Indien het een aanvraag betreft om als zelfstandige bijstand te ontvangen stelt het college binnen dertien weken
      na ontvangst van de aanvraag vast of recht op bijstand bestaat.

      3 Het college kan de termijn bedoeld in het tweede lid verlengen met ten hoogste dertien weken, indien het college
      niet in staat is tijdig een besluit te nemen. Van de verlenging doet het college mededeling aan de zelfstandige,
      onder vermelding van het tijdstip waarop de termijn voor het nemen van een besluit zal verstrijken.
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel35
  - number: '36'
    text: |-
      Indien de ondernemer in de binnenvaart geen woonplaats heeft als bedoeld in
      [artikel 40, eerste lid, van de wet][ref1], bestaat het recht op bijstand jegens het college van de gemeente waar
      de ondernemer in de binnenvaart op het moment van zijn aanvraag zijn feitelijke ligplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel40
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '40'
  - number: '37'
    text: |-
      1 Bij zeer dringende redenen van tijdelijke aard kan aan de zelfstandige, die als ingezetene in de basisregistratie
      personen is ingeschreven en die zich uit hoofde van zijn bedrijf of beroep tijdelijk in het buitenland bevindt,
      door Onze Minister bijstand worden verleend volgens door hem te stellen regels.

      2 [Hoofdstuk 6, paragraaf 6.5, van de wet][ref1], en [hoofdstuk VI][ref2] zijn van toepassing op terugvordering en
      verhaal van kosten van bijstand die door Onze Minister is verleend, met dien verstande dat het Rijk in plaats van
      de gemeente treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Paragraaf6.5
      [ref2]: https://wetten.overheid.nl/BWBR0015711#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0015703
        paragraaf: '6.5'
      - id: ref2
        bwb_id: BWBR0015711
        hoofdstuk: VI
  - number: '38'
    text: |-
      1 Het college legt bij de bijstandsverlening verplichtingen op die het college nodig acht voor een doelmatige
      bedrijfs- of beroepsuitoefening.

      2 De zelfstandige aan wie bijstand wordt verleend is verplicht naar behoren een administratie te voeren. De
      zelfstandige legt deze binnen 6 maanden na afloop van het boekjaar op de volgende wijze over aan het college:

      a. uit eigener beweging over ieder boekjaar waarover uitkering is verleend als bedoeld in
      [hoofdstuk II, § 4][ref1], of aanspraak kan worden gemaakt op bijstand als bedoeld in [artikel 21][ref2]; of

      b. op verzoek van het college.

      3 Ten aanzien van de zelfstandige die zijn bedrijf of zelfstandig beroep gedurende ten minste een half jaar niet of
      nagenoeg niet uitoefent, zijn de [artikelen 9][ref3] en [10 van de wet][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel10
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015711
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015711
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '10'
  - number: '39'
    text: |-
      1 Het college legt in de beschikking waarin de bijstand wordt toegekend in elk geval vast:

      a. indien de bijstand wordt verstrekt in de vorm van een rentedragende geldlening op grond van de
      [artikelen 20][ref1] of [24][ref2]:

      1°. de bestemming van de geldlening;

      2°. de verplichtingen tot betaling van rente en aflossing alsmede de betalingstermijnen;

      3°. dat het bedrag van de lening, behoudens in de gevallen waarin [artikel 21, eerste lid][ref3], van toepassing
      is en met inachtneming van [artikel 41][ref4], terstond opeisbaar is bij het niet nakomen van de verplichtingen tot
      betaling van rente en aflossing;

      b. indien de bijstand wordt verstrekt in de vorm van borgtocht op grond van [artikel 16][ref5], dat aan de
      verplichtingen opgenomen in de leningsovereenkomst met de bank dient te worden voldaan.

      2 In de beschikking tot toekenning van de bijstand wordt voorts opgenomen dat het bedrag van de lening terstond
      opeisbaar is:

      a. indien zij niet overeenkomstig de bestemming is besteed;

      b. op het moment dat de zelfstandige het bedrijf of zelfstandig beroep overdraagt of beëindigt;

      c. ingeval van surséance van betaling of faillissement van de zelfstandige, van één van de vennoten of leden
      waarmee het bedrijf of zelfstandig beroep in een samenwerkingsverband wordt uitgeoefend, of van de rechtspersoon.

      3 Het college kan aan het verlenen van bijstand in de vorm van een geldlening verplichtingen verbinden
      die zijn gericht op meerdere zekerheid voor de nakoming van de aan deze bijstand verbonden rente- en
      aflossingsverplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel20
