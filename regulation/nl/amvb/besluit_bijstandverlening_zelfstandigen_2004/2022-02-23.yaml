  - number: 43c
    text: |-
      1 Bij verkoop van de woning dan wel bij vererving van de woning na het overlijden van de zelfstandige of, indien
      het een echtpaar betreft, na het overlijden van de langstlevende echtgenoot, wordt het nog niet afgeloste deel van
      de geldlening, alsmede de op grond van [artikel 43b, vierde lid][ref1], bijgeschreven rente, terstond afgelost.

      2 Indien bij de verkoop van de woning op basis van de waarde in het economisch verkeer bij vrije oplevering
      het voor de afrekening beschikbare bedrag lager is dan het resterende bedrag van de geldlening en van de
      rentevordering, wordt het verschil kwijtgescholden.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel43b
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: 43b
        hoofdstuk: V
        paragraaf: '2'
  - number: 43d
    text: |-
      Aan de zelfstandige of langstlevende echtgenoot, bedoeld in [artikel 43c, eerste lid][ref1], wordt, telkens na
      afloop van een kalenderjaar, een opgave verstrekt van de stand van de geldlening en van de rentevorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel43c
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel43d
