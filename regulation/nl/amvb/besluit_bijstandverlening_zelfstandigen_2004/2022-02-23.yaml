        artikel: '34'
  - number: '58'
    text: Algemene bijstand wordt verleend in de vorm van een bedrag om niet.
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel58
  - number: '60'
    text: |-
      1 De bedragen, genoemd in de [artikelen 3][ref1], [20][ref2], [22][ref3], [24][ref4], [25][ref5] en [26][ref6],
      worden met ingang van 1 januari van elk kalenderjaar gewijzigd met het percentage waarmee het prijsindexcijfer van
      de gezinsconsumptie over de maand oktober daaraan voorafgaand afwijkt van het prijsindexcijfer waarop de laatste
      vaststelling van de bedragen is gebaseerd. De gewijzigde bedragen worden door of namens Onze Minister medegedeeld
      in de Staatscourant.

      2 Onze Minister herziet het rentepercentage, genoemd in [artikel 15][ref7], voor zover de rente die banken in
      rekening brengen bij het verstrekken van leningen aan bedrijven, daartoe aanleiding geeft.

      3 Onze Minister stelt het in [artikel 6, tweede lid][ref8], genoemde percentage zodanig vast dat dit
      gelijk is aan het gemiddeld bedrag dat voor personen die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref9], nog niet hebben bereikt over de algemene bijstand
      verschuldigd is aan loonbelasting en premies volksverzekeringen, uitgedrukt als een percentage van de algemene
      bijstand verhoogd met deze loonbelasting en premies.


