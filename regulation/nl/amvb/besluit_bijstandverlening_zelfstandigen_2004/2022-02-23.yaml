  - number: '56'
    text: |-
      1 Voor de toepassing van [artikel 44, eerste lid, derde zinsdeel, van de wet][ref1] wordt de aanvraag die
      is ingediend in de periode, bedoeld in [artikel 54][ref2], geacht te zijn ingediend op de eerste dag van de
      kalendermaand voorafgaand aan de kalendermaand waarin de aanvraag is ingediend, met dien verstande dat:

      a. de aanvraag niet wordt geacht te zijn gedaan voor 1 december 2021; en

      b. indien voor de kalendermaand december 2021 reeds algemene bijstand is verleend op grond van
      [hoofdstuk VIIa][ref3], zoals dat luidde op 31 december 2021, de aanvraag niet wordt geacht te zijn gedaan voor
      1 januari 2022.

      2 De aanvrager verklaart schriftelijk en geeft de volgende informatie:

      a. dat hij voor de kalendermaanden waarover algemene bijstand wordt aangevraagd, verwacht een in aanmerking te
      nemen inkomen te hebben dat lager is dan de bijstandsnorm;

      b. voor de kalendermaanden waarover algemene bijstand wordt aangevraagd een opgave van het inkomen dat hij heeft
      verworven of verwacht te gaan verwerven.

      3 De gehuwde zelfstandige betrekt bij de verklaring, bedoeld in het tweede lid, het inkomen van beide echtgenoten.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel54
