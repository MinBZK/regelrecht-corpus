  - number: '49'
    text: |-
      1 Onze Minister verstrekt jaarlijks ten laste van ’s Rijks kas aan het college een bedrag van 100% van de lasten
      van de bijstand ter voorziening in de behoefte aan bedrijfskapitaal, met dien verstande dat Onze Minister in
      de daaropvolgende vijf jaar in totaal 75% van dit verstrekte bedrag terugvordert van het college, in jaarlijkse
      stappen van achtereenvolgens 20%, 20%, 15%, 10% en 10%.

      2 Onze Minister vordert jaarlijks 75% van de baten van vóór 1 januari 2020 door het college verstrekte bijstand ter
      voorziening in de behoefte aan bedrijfskapitaal terug van het college.
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel49
  - number: '50'
    text: |-
      1 Onze Minister stelt de lasten van bijstand ter voorziening in de behoefte aan bedrijfskapitaal, bedoeld in
      [artikel 49, eerste lid][ref1], en de baten van vóór 1 januari 2020 verstrekt bedrijfskapitaal, bedoeld in artikel
      49, tweede lid, vast binnen een jaar na ontvangst door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      van de verantwoordingsinformatie, bedoeld in [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref2].

      2 De lasten van de bijstand ter voorziening in de behoefte aan bedrijfskapitaal worden bij de vaststelling,
      bedoeld in het eerste lid, buiten aanmerking gelaten indien deze lasten blijkens het verslag van bevindingen,
      bedoeld in [artikel 213, vierde lid, van de Gemeentewet][ref3], dat deel uit maakt van de informatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref4], als fout of onzeker worden aangemerkt.

      3 Indien de verantwoordingsinformatie, bedoeld in het eerste lid, niet binnen achttien maanden na het kalenderjaar
      waarop het betrekking heeft is ontvangen door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties worden
      de lasten en baten van bijstand ter voorziening in de behoefte aan bedrijfskapitaal ambtshalve door Onze Minister
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel49
