  - number: 60aa
    text: |-
      Indien in de periode van 1 oktober 2021 tot en met 31 december 2021 op grond van [hoofdstuk VIIa][ref1], zoals
      dat luidde tot en met 31 december (Stb. 2021, 438), algemene bijstand is toegekend en met ingang van het tijdstip
      waarop dit hoofdstuk vervalt, op of na dat tijdstip algemene bijstand op grond van dit besluit is benodigd, wordt
      hiertoe een nieuwe aanvraag om algemene bijstand ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#HoofdstukVIIa
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel60aa
