  - number: '22'
    text: |-
      Bijstand in de behoefte aan bedrijfskapitaal kan aan een zelfstandige als bedoeld in
      [artikel 2, eerste lid, onderdeel a][ref1], worden verleend in de vorm van een bedrag om niet tot ten hoogste
      € 10.607,00, indien het inkomen van de zelfstandige duurzaam lager is dan de som van de bijstandsnorm, bedoeld
      in [hoofdstuk 3, paragraaf 3.2][ref2] en [3.3, van de wet][ref3], en de verleende bijzondere bijstand en diens
      vermogen de grens genoemd in [artikel 3, eerste lid][ref4], niet te boven gaat. Deze bijstand gaat niet samen met
      bijstand als bedoeld in [artikel 20][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.2
