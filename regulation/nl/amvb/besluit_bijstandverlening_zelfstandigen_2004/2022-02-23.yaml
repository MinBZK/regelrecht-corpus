  - number: 60ab
    text: |-
      Indien in de periode van 1 januari 2022 tot en met 31 maart 2022 op grond van [hoofdstuk VIIa][ref1], zoals
      ingevoegd bij Besluit van 18 februari 2022 tot wijziging van het Besluit bijstandverlening zelfstandigen 2004
      in verband met het verlengen van de tijdelijke regels voor bijstandverlening aan zelfstandigen als gevolg van de
      verhoogde instroom door de crisis in verband met COVID-19 tot en met maart 2022 (Stb. 2022, 82), algemene bijstand
      is toegekend en op of na 1 april 2022 algemene bijstand op grond van dit besluit is benodigd:

      a. wordt hiertoe een nieuwe aanvraag om algemene bijstand ingediend; en

      b. wordt, indien nadien in hetzelfde boekjaar algemene bijstand op grond van dit besluit wordt verleend,
      de algemene bijstand die op grond van dit [hoofdstuk VIIa][ref2] is verleend bij de toepassing van de
      [artikelen 11][ref3] en [12][ref4] tot het inkomen gerekend.


