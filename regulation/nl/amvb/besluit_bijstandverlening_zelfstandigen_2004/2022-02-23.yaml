articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Participatiewet][ref1];

      b. zelfstandige: de belanghebbende van 18 jaar tot aan de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2] die voor de voorziening in het bestaan is aangewezen
      op arbeid in eigen bedrijf of zelfstandig beroep hier te lande en die:

      1°. voldoet aan de wettelijke vereisten voor de uitoefening daarvan;

      2°. voldoet aan het urencriterium, bedoeld in [artikel 3.6 van de Wet inkomstenbelasting 2001][ref3], en

      3°. alleen of samen met degenen met wie hij het bedrijf of zelfstandig beroep uitoefent de volledige zeggenschap in
      dat bedrijf of zelfstandig beroep heeft en de financiële risico's daarvan draagt;

      c. levensvatbaar bedrijf of zelfstandig beroep: het bedrijf of zelfstandig beroep waaruit de zelfstandige naar
      verwachting na bijstandsverlening een inkomen zal verwerven dat, samen met het overige inkomen, toereikend is voor
      de voortzetting van het bedrijf of zelfstandig beroep en voor de voorziening in het bestaan;

      d. boekjaar: de periode van 12 maanden waarover de administratie van de zelfstandige wordt gevoerd;

      e. netto inkomen: het over het boekjaar verworven inkomen, bedoeld in
      [hoofdstuk 3, paragraaf 3.4 van de wet][ref4], met toepassing van [artikel 6, tweede lid][ref5];

      f. bruto inkomen: het over het boekjaar verworven inkomen, bedoeld in
      [hoofdstuk 3, paragraaf 3.4 van de wet][ref6], zonder toepassing van [artikel 31, derde lid, van de wet][ref7] en
      [artikel 6, tweede lid][ref8];

      g. jaarnorm: de tot een bedrag per boekjaar omgerekende som van de bijstandsnorm, bedoeld in
      [hoofdstuk 3, paragraaf 3.2][ref9] en [3.3 van de wet][ref10], verhoogd met de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref11] en de verleende bijzondere bijstand;

      h. totaal vermogen: het vermogen, bedoeld in [artikel 34, eerste lid, onderdeel a, van de wet][ref12], zonder
      aftrek van de aanwezige schulden en zonder de in [artikel 34, tweede lid, onderdelen a en e, van de wet][ref13],
      bedoelde bezittingen in aanmerking te nemen;

      i. eigen vermogen: het verschil tussen het totaal vermogen en de aanwezige schulden;

      j. bank: bank als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref14];

      k. ondernemer in de binnenvaart: de zelfstandige die arbeid verricht door:

      1°. het vervoeren of opslaan van goederen met behulp van een schip dat bestemd is of gebruikt wordt voor het
      vervoer van goederen op de Nederlandse binnenwateren, stromen en riviermonden, alsmede op de Dollard, de Waddenzee
      en het IJsselmeer;

      2°. het slepen of duwen van de in onder 1 bedoelde schepen met een boot die blijkens zijn bouw daarvoor is bestemd
      en niet tevens is ingericht voor het vervoer van goederen.


