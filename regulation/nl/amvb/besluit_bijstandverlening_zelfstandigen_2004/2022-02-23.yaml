  - number: '20'
    text: |-
      Aan een zelfstandige als bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], kan ter voorziening in de behoefte
      aan bedrijfskapitaal bijstand in de vorm van een rentedragende geldlening of borgtocht worden verleend tot een
      bedrag van ten hoogste € 212.147,00. Dit bedrag geldt per bedrijf of zelfstandig beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel2
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel20
