    text: |-
      De bijstand die wordt verleend in de vorm van een bedrag om niet met toepassing van [artikel 12][ref1] wordt
      verhoogd met een forfaitair bedrag dat overeenkomt met de loonbelasting en de premies volksverzekeringen waarvoor
      de gemeente die de bijstand verleent krachtens de [Wet op de loonbelasting 1964][ref2] inhoudingspichtige is.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002471
