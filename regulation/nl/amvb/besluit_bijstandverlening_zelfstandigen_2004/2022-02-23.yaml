  - number: '14'
    text: |-
      1 Bijstand aan een zelfstandige ter voorziening in de behoefte aan bedrijfskapitaal wordt naar de regels van dit
      besluit verleend in de vorm van een rentedragende lening, een renteloze lening, borgtocht of een bedrag om niet.

      2 Een voorschot als bedoeld in [artikel 52, van de wet][ref1], kan geen betrekking hebben op bijstand ter
      voorziening in de behoefte aan bedrijfskapitaal.

      3 Bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt niet verleend aan personen als bedoeld in
      [artikel 34a, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2] met een naar het oordeel van het
      UWV structurele functionele beperking die arbeid als zelfstandige verrichten of gaan verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel34a
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel14
    references:
