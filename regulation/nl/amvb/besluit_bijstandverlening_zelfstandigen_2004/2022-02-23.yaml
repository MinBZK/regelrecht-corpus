  - number: '52'
    text: |-
      1 Onze Minister vergoedt ten laste van ‘s Rijks kas aan het college:

      a. 100% van de kosten van algemene bijstand en bijstand ter voorziening in de behoefte aan bedrijfskapitaal;

      b. de kosten van aan derden opgedragen onderzoek inzake verlening van algemene bijstand en bijstand ter voorziening
      in de behoefte aan bedrijfskapitaal, voor zover deze kosten een bij ministeriële regeling te bepalen maximumbedrag
      per onderzoek niet overschrijden.

      2 Onder onderzoek als bedoeld in het eerste lid, onderdeel b, wordt verstaan, een bedrijfseconomisch of
      bedrijfstechnisch onderzoek, waaronder begrepen taxatie van vermogensbestanddelen, afgerond met een schriftelijke
      rapportage, voor zover dit onderzoek noodzakelijk is voor de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel52
  - number: '53'
    text: |-
      1 Onze Minister stelt de vergoeding, bedoeld in [artikel 52][ref1], vast binnen een jaar na ontvangst door
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van de verantwoordingsinformatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref2].

      2 De kosten van algemene bijstand, de kosten van de bijstand ter voorziening in de behoefte aan
      bedrijfskapitaal, de uitvoeringskosten en de kosten voor onderzoek worden bij de vaststelling, bedoeld in
      het eerste lid, buiten aanmerking gelaten indien deze kosten blijkens het verslag van bevindingen, bedoeld
      in [artikel 213, vierde lid, van de Gemeentewet][ref3], dat deel uit maakt van de informatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref4], als fout of onzeker worden aangemerkt.

      3 Indien de verantwoordingsinformatie, bedoeld in het eerste lid, niet binnen achttien maanden na het kalenderjaar
      waarop het betrekking heeft is ontvangen door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wordt de
      vergoeding ambtshalve door Onze Minister vastgesteld.


