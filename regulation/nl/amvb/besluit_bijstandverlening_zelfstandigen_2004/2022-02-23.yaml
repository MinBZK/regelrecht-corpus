  - number: '26'
    text: |-
      Bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt aan de zelfstandige, bedoeld in
      [artikel 2, eerste lid, onderdeel c][ref1], slechts verleend tot ten hoogste € 10.607,00. Deze bijstand wordt
      verstrekt in de vorm van een bedrag om niet of, voor zover het eigen vermogen meer bedraagt dan het bedrag, genoemd
      in [artikel 3, tweede lid][ref2], in de vorm van een renteloze lening. [Artikel 13][ref3] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0015711#Artikel13
