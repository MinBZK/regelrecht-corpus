  - number: '51'
    text: |-
      Deze paragraaf is in afwijking van de [artikelen 48 tot en met 50][ref1] van toepassing op de vergoeding
      van de kosten van bijstandsverlening aan ondernemers in de binnenvaart waarvan de bijstand, op grond van
      [artikel 36][ref2] zoals dat luidde op 31 december 2019, wordt verstrekt door het college van de gemeenten
      Groningen, Zwolle, Nijmegen, Nieuwegein, Amsterdam, Rotterdam, Terneuzen, Geertruidenberg of Maasgouw.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel36
