        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '12'
    text: |-
      1 Het college neemt een nadere beslissing met betrekking tot de verleende bijstand, bedoeld in
      [artikel 11, eerste lid][ref1], nadat het college het netto inkomen uit bedrijf of zelfstandig beroep definitief
      heeft vastgesteld.

      2 Indien de verleende bijstand, vermeerderd met het in het desbetreffende boekjaar behaalde netto inkomen:

      a. minder is dan de jaarnorm, wordt ambtshalve voor het verschil bijstand verleend, met dien verstande dat de in
      totaal te verlenen bijstand niet meer bedraagt dan de jaarnorm berekend naar evenredigheid over de periode waarin
      over het desbetreffende boekjaar bijstand is verleend, waarbij de als geldlening verstrekte bijstand wordt omgezet
      in een bedrag om niet;

      b. gelijk is aan de jaarnorm, wordt de als geldlening verstrekte bijstand omgezet in een bedrag om niet;

      c. meer is dan de jaarnorm, kan de bijstand ter grootte van het verschil worden teruggevorderd en wordt de rest van
      de als geldlening verstrekte bijstand omgezet in een bedrag om niet.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel11
    url: https://wetten.overheid.nl/BWBR0015711/2022-02-23#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: '11'
        hoofdstuk: II
        paragraaf: '4'
  - number: '13'
    text: |-
      In afwijking van [artikel 12][ref1] wordt, voor zover het eigen vermogen de van toepassing zijnde vermogensgrens,
      genoemd in [artikel 3][ref2] overschrijdt, de renteloze geldlening gehandhaafd na afloop van het tijdvak waarin
      bijstand is verleend. Met ingang van het jaar volgend op het laatste jaar van de bijstandsverlening wordt hierop
      een jaarlijkse aflossing van ten minste 10 procent voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel3
