        artikel: '40'
        hoofdstuk: V
        paragraaf: '2'
  - number: '17'
    text: |-
      Het college kan bijstand verlenen aan de zelfstandige ter gedeeltelijke of volledige betaling van een
      bedrijfsschuld, mits de bijstand wordt verleend op grond van [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel2
