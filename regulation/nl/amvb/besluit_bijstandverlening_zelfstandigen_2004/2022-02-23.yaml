      Dit hoofdstuk is met betrekking tot het verlenen van algemene bijstand van toepassing op de rechthebbende, bedoeld
      in [artikel 2][ref1], voor zover:

      a. het verlenen van algemene bijstand op grond van dit besluit aanvangt in de periode van 1 januari 2022 tot en met
      31 maart 2022, of sprake is van een nieuwe aanvraag als bedoeld in [artikel 60aa][ref2]; en

      b. de algemene bijstand ziet op de kalendermaanden december 2021, en januari, februari of maart 2022.


