    text: |-
      1 Algemene bijstand kan worden verleend aan:

      a. de zelfstandige die gedurende een redelijke termijn als zodanig werkzaam is geweest en wiens bedrijf of
      zelfstandig beroep levensvatbaar is;

      b. de persoon of de echtgenoot van de persoon die uit hoofde van werkloosheid een uitkering ontvangt en die een
      bedrijf of zelfstandig beroep begint dat levensvatbaar is;

      c. de zelfstandige van 55 jaar en ouder wiens bedrijf of zelfstandig beroep niet levensvatbaar is en die het
      bedrijf of zelfstandig beroep gedurende een aaneengesloten periode van 10 jaar onmiddellijk voorafgaand aan de
      aanvraag heeft uitgeoefend en hieruit een inkomen geniet dat duurzaam ontoereikend is om in de noodzakelijke kosten
      van het bestaan te voorzien;

      d. de zelfstandige wiens bedrijf of zelfstandig beroep niet levensvatbaar is en die zich verplicht de activiteiten
      in het bedrijf of zelfstandig beroep zo spoedig mogelijk, doch uiterlijk binnen 12 maanden, te beëindigen;

      e. de zelfstandige die om gezondheidsredenen niet of slechts beperkt in staat is tot
      het uitoefenen van zijn bedrijf of zelfstandig beroep en die een uitkering ingevolge de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] heeft aangevraagd.

      2 Bijstand ter voorziening in de behoefte aan bedrijfskapitaal kan slechts worden verleend aan de zelfstandige,
      bedoeld in de onderdelen a, b en c van het eerste lid.

      3 Bijstandsverlening aan een persoon die algemene bijstand ontvangt, die voornemens is een bedrijf of zelfstandig
      beroep te beginnen en zich in verband hiermee niet beschikbaar stelt voor arbeid in dienstbetrekking kan gedurende
      een voorbereidingsperiode van ten hoogste 12 maanden worden voortgezet. In een zodanig geval:

      a. zijn de [artikelen 9][ref2], met uitzondering van het eerste lid, onderdeel c, en [10 van de wet][ref3] niet
      van toepassing;

      b. is de belanghebbende verplicht mee te werken aan begeleiding door een door het college aangewezen derde.


      [ref1]: https://wetten.overheid.nl/BWBR0008656
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel10
