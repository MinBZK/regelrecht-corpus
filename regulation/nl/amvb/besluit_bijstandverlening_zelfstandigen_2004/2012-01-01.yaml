  - number: '55'
    text: |-
      1 De volgens opgave van het college ten laste gebleven kosten worden bij de vaststelling, bedoeld in
      [artikel 54, eerste lid][ref1], buiten aanmerking gelaten indien:

      a. het bijstand betreft die is verleend in strijd met de bij of krachtens de wet of dit besluit gestelde regels, of
      die niet of niet volledig overeenkomstig [hoofdstuk VI][ref2] is of wordt teruggevorderd;

      b. niet is voldaan aan [artikel 18, tweede lid, van de wet][ref3], voor een bedrag gelijk aan het bedrag waarmee de
      kosten zouden zijn verlaagd indien het college op een juiste wijze toepassing zou hebben gegeven aan dit artikel.

      2 Indien als gevolg van het niet hebben voldaan door het college aan de bij of krachtens de [artikelen 17][ref4],
      [43][ref5], [44][ref6] en [53a, eerste lid, van de wet][ref7] of [artikel 35][ref8] gestelde regels, niet kan
      worden vastgesteld of en voor welk bedrag de ten laste van de gemeenten gebleven kosten buiten aanmerking moeten
      worden gelaten, wordt volgens door Onze Minister te stellen regels hiervoor een bedrag vastgesteld.

      3 Het eerste en tweede lid zijn niet van toepassing voorzover naar het oordeel van Onze Minister:

      a. de tekortkomingen van bijzondere aard of geringe betekenis zijn;

      b. het college zich voldoende heeft ingespannen om de tekortkomingen op te heffen.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0015711#HoofdstukVI
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0015703#Artikel43
      [ref6]: https://wetten.overheid.nl/BWBR0015703#Artikel44
      [ref7]: https://wetten.overheid.nl/BWBR0015703#Artikel53a
      [ref8]: https://wetten.overheid.nl/BWBR0015711#Artikel35
