  - number: '56'
    text: |-
      1 Onze Minister vergoedt ten laste van 's Rijks kas:

      a. aan gemeenten, bedoeld in [artikel 36][ref1], een bij ministeriële regeling te bepalen bedrag per besluit op
      een aanvraag van ondernemers in de binnenvaart om verlening van algemene bijstand en bijstand ter voorziening in de
      behoefte aan bedrijfskapitaal;

      b. 90% van de kosten van aan derden opgedragen onderzoek inzake verlening van algemene bijstand en bijstand ter
      voorziening in de behoefte aan bedrijfskapitaal aan zelfstandigen als bedoeld in [artikel 2][ref2], voor zover de
      kosten een bij ministeriële regeling te bepalen bedrag niet overschrijden.

      2 In afwijking van het eerste lid, onderdeel b, is de vergoeding 100%, indien het onderzoek of de begeleiding
      betrekking heeft op ondernemers in de binnenvaart.

      3 Onder onderzoek, bedoeld in het eerste en tweede lid, wordt verstaan, een bedrijfseconomisch of bedrijfstechnisch
      onderzoek, waaronder begrepen de taxatie van vermogensbestanddelen, afgerond met een schriftelijke rapportage,
      voorzover dit onderzoek noodzakelijk is voor de uitvoering van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel2
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel56
