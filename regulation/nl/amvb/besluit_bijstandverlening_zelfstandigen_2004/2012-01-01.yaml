  - number: '24'
    text: |-
      Aan een zelfstandige als bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], kan ter voorziening in de behoefte
      aan bedrijfskapitaal uitsluitend bijstand in de vorm van een rentedragende geldlening of borgtocht worden verleend
      tot een bedrag van ten hoogste  € 29 889,00 . Dit bedrag geldt per bedrijf of zelfstandig beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel2
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel24
