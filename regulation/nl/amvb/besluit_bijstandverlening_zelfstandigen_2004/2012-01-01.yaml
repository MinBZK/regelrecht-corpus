  - number: '5'
    text: De algemene bijstand wordt per boekjaar vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel5
  - number: '6'
    text: |-
      1 In afwijking van [artikel 32, eerste lid, onderdeel b, van de wet][ref1] wordt bij de bijstandsverlening aan een
      zelfstandige rekening gehouden met het inkomen over een boekjaar. Een teruggave van inkomstenbelasting en premies
      volksverzekeringen wordt bij een zelfstandige niet als inkomen aangemerkt.

      2 Bij de bijstandsverlening aan een zelfstandige worden de verschuldigde inkomstenbelasting en premies
      volksverzekeringen over inkomen waarover geen loonbelasting is geheven gesteld op 20 procent  van dat inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel32
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '32'
  - number: '7'
    text: |-
      Niet als vermogen wordt in aanmerking genomen het voor de uitoefening van het bedrijf of zelfstandig beroep
      noodzakelijke vermogen, waaronder mede begrepen het vermogen gebonden in de door de zelfstandige of zijn gezin in
      eigendom bewoonde woning met bijbehorend erf.
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel7
  - number: '8'
    text: |-
      1 De voor de uitoefening van het bedrijf of zelfstandig beroep noodzakelijke bezittingen en de aanwezige schulden
      van de zelfstandige worden gewaardeerd op basis van de waarde in het economisch verkeer.

      2 In afwijking van het eerste lid worden de volgende vermogensbestanddelen als volgt gewaardeerd:

      a. onderhanden werken, halffabrikaten, eindproducten en te velde staande gewassen worden gewaardeerd op basis van
      de gemaakte kosten, arbeidskosten daaronder begrepen;

      b. handelsvoorraden en grondstoffen worden gewaardeerd op basis van de aanschaffingswaarde, voor zover nodig
      gecorrigeerd met een aftrek wegens incourantheid;

      c. immateriële activa, zoals goodwill en melkquotum worden gewaardeerd op basis van de aankoopprijs, waarbij
      rekening wordt gehouden met de afschrijving;

      d. levensverzekeringen, die zijn aangegaan voor de financiering van onroerende zaken, worden opgenomen tegen de
      contante waarde;

      e. aandelen in coöperaties en inkoopverenigingen alsmede andere vormen van ledenkapitaal worden gewaardeerd op
      basis van de fiscale boekwaarde;

      f. land en tuinbouwgrond wordt gewaardeerd op de waarde in verpachte staat.

      3 In afwijking van het tweede lid, onderdeel a, kunnen de meerjarige te velde staande gewassen of de plantopstanden
      in een bepaalde bedrijfstak worden gewaardeerd op de waarde in het economisch verkeer op het moment dat er in deze
      bedrijfstak sprake is van een crisissituatie; van een crisissituatie is sprake in het geval dat er in meer dan twee
      opeenvolgende jaren lage opbrengstprijzen zijn verkregen al dan niet in combinatie met lage fysieke opbrengsten als
      gevolg van slechte weersomstandigheden.

      4 Onder schulden wordt mede verstaan:

      a. uit de jaarrekening blijkende schulden wegens niet uitbetaald loon aan kinderen;

      b. reserveringen in verband met belastingclaims, die voortvloeien uit de vaststelling van de waarde van de
      bezittingen, bedoeld in het eerste en tweede lid.

      5 Het college laat, indien daartoe aanleiding bestaat, de onroerende zaken taxeren door een taxateur.

      6 Het college laat de waarde van de bezittingen opnieuw vaststellen indien gewijzigde omstandigheden daartoe
      aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel8
  - number: '9'
    text: |-
      Bij de verlening van bijstand aan een zelfstandige die het bedrijf of zelfstandig beroep tezamen met een of meer
      anderen uitoefent, wordt onder vermogen mede verstaan het vermogen van die anderen.
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel9
  - number: '10'
    text: |-
      Algemene bijstand kan naar de regels van dit besluit worden verleend in de vorm van een renteloze geldlening, die
      al dan niet geheel of gedeeltelijk kan worden omgezet in een bedrag om niet of in de vorm van een bedrag om niet.
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel10
  - number: '11'
    text: |-
      1 Algemene bijstand heeft voorlopig de vorm van een renteloze geldlening die in maandelijkse termijnen wordt
      uitbetaald.

      2 Zodra het inkomen bekend is over het boekjaar waarin de in het eerste lid bedoelde bijstand is verleend, wordt
      de hoogte van deze bijstand definitief vastgesteld en vindt, voor zover het vermogen van de zelfstandige de van
      toepassing zijnde grens van [artikel 3][ref1] niet te boven gaat, tot die hoogte omzetting plaats in een bedrag
      om niet.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel3
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '12'
    text: |-
      1 Het college neemt een nadere beslissing met betrekking tot de verleende bijstand, bedoeld in
      [artikel 11, eerste lid][ref1], nadat het college het netto inkomen uit bedrijf of zelfstandig beroep definitief
      heeft vastgesteld.

      2 Indien de verleende bijstand, vermeerderd met het in het desbetreffende boekjaar behaalde netto inkomen:

      a. minder is dan de jaarnorm, wordt ambtshalve voor het verschil bijstand verleend, met dien verstande dat de in
      totaal te verlenen bijstand niet meer bedraagt dan de jaarnorm berekend naar evenredigheid over de periode waarin
      over het desbetreffende boekjaar bijstand is verleend, waarbij de als geldlening verstrekte bijstand wordt omgezet
      in een bedrag om niet;

      b. gelijk is aan de jaarnorm, wordt de als geldlening verstrekte bijstand omgezet in een bedrag om niet;

      c. meer is dan de jaarnorm, wordt de bijstand ter grootte van het verschil teruggevorderd en wordt de rest van de
      als geldlening verstrekte bijstand omgezet in een bedrag om niet.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel11
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: '11'
        hoofdstuk: II
        paragraaf: '4'
  - number: '13'
    text: |-
      In afwijking van [artikel 12][ref1] wordt, voor zover het eigen vermogen de van toepassing zijnde vermogensgrens,
      genoemd in [artikel 3][ref2] overschrijdt, de renteloze geldlening gehandhaafd na afloop van het tijdvak waarin
      bijstand is verleend. Met ingang van het jaar volgend op het laatste jaar van de bijstandsverlening wordt hierop
      een jaarlijkse aflossing van ten minste 10 procent voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel3
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel13
