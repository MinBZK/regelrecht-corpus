    text: |-
      Aan een zelfstandige als bedoeld in [artikel 2, eerste lid, onderdeel e][ref1], wordt algemene bijstand verleend
      tot het tijdstip waarop een beslissing ingevolge de Wet arbeidsongeschiktheidsverzekering zelfstandigen is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel2
