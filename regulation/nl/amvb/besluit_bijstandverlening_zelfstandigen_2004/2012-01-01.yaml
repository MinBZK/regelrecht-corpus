  - number: '38'
    text: |-
      1 Het college legt bij de bijstandsverlening verplichtingen op die het college nodig acht voor een doelmatige
      bedrijfs- of beroepsuitoefening.

      2 De zelfstandige aan wie bijstand wordt verleend is verplicht naar behoren een administratie te voeren. De
      zelfstandige legt deze binnen 6 maanden na afloop van het boekjaar op de volgende wijze over aan het college:

      a. uit eigener beweging over ieder boekjaar waarover uitkering is verleend als bedoeld in
      [hoofdstuk II, § 4][ref1], of aanspraak kan worden gemaakt op bijstand als bedoeld in [artikel 21][ref2]; of

      b. op verzoek van het college.

      3 Ten aanzien van de zelfstandige die zijn bedrijf of zelfstandig beroep gedurende ten minste een half jaar niet of
      nagenoeg niet uitoefent, zijn de [artikelen 9][ref3] en [10 van de wet][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel10
