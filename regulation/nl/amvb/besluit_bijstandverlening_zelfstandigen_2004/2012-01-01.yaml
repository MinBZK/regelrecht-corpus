        paragraaf: '3.3'
  - number: 43b
    text: |-
      1 Indien door toepassing van [artikel 43a, derde of vierde lid][ref1], na afloop van de aflossingsperiode van
      tien jaar de geldlening nog niet is afgelost, is vanaf dat moment maandelijks rente verschuldigd over het nog niet
      afgeloste deel van de geldlening.

      2 De rente, bedoeld in het eerste lid, is de wettelijke rente, verminderd met drie procent.

      3 Indien de zelfstandige naar het oordeel van het college de rente geheel of gedeeltelijk kan betalen, doch niet
      kan aflossen, wordt een betaling eerst tot ten hoogste het bedrag van de verschuldigde maandrente aangemerkt als
      aflossing en wordt de rente die daardoor niet wordt betaald bijgeschreven bij het nog niet afgeloste deel van de
      geldlening.

      4 Indien de zelfstandige naar het oordeel van het college geen rente kan betalen wordt de verschuldigde rente
      bijgeschreven bij het nog niet afgeloste deel van de geldlening.

      5 Over een bijgeschreven rentevordering is geen rente verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel43a
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: 43a
        hoofdstuk: V
        paragraaf: '2'
  - number: 43c
    text: |-
      1 Bij verkoop van de woning dan wel bij vererving van de woning na het overlijden van de zelfstandige of, indien
      het een echtpaar betreft, na het overlijden van de langstlevende echtgenoot, wordt het nog niet afgeloste deel van
      de geldlening, alsmede de op grond van [artikel 43b, vierde lid][ref1], bijgeschreven rente, terstond afgelost.

      2 Indien bij de verkoop van de woning op basis van de waarde in het economisch verkeer bij vrije oplevering
      het voor de afrekening beschikbare bedrag lager is dan het resterende bedrag van de geldlening en van de
      rentevordering, wordt het verschil kwijtgescholden.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel43b
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel43c
    references:
