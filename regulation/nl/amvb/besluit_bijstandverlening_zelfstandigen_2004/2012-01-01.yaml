  - number: '20'
    text: |-
      1 Aan een zelfstandige als bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], kan ter voorziening in de
      behoefte aan bedrijfskapitaal bijstand in de vorm van een rentedragende geldlening of borgtocht worden verleend tot
      een bedrag van ten hoogste  € 162 344,00 . Dit bedrag geldt per bedrijf of zelfstandig beroep.

      2 Indien aan een zelfstandige, als bedoeld in [artikel 2, eerste lid, onderdeel a][ref2], bijstand wordt verleend
      zowel ter voorziening in de behoefte aan bedrijfskapitaal als ter voorziening in de algemeen noodzakelijke kosten
      van het bestaan wordt de bijstand verleend met toepassing van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel2
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel20
