        artikel: '56'
        hoofdstuk: VII
  - number: '58'
    text: |-
      1 Onze Minister stelt de vergoeding, bedoeld in [artikel 56][ref1], vast binnen een jaar na ontvangst door
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van de verantwoordingsinformatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref2].

      2 Indien de verantwoordingsinformatie, bedoeld in het eerste lid, niet binnen achttien maanden na het kalenderjaar
      waarop het betrekking heeft is ontvangen door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wordt de
      vergoeding ambtshalve door Onze Minister vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel58
