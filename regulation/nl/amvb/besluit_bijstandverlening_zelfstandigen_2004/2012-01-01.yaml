  - number: '25'
    text: |-
      Aan een zelfstandige als bedoeld in [artikel 2, eerste lid, onderdeel c][ref1], wordt algemene bijstand verleend
      voor de duur dat hij uit het bedrijf of zelfstandig beroep naar verwachting een bruto inkomen zal behalen dat
      gemiddeld minstens  € 6 447,00  per boekjaar bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel2
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel25
