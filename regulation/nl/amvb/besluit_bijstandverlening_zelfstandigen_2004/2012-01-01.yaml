        paragraaf: '2'
  - number: '44'
    text: |-
      1 In afwijking van [artikel 58 van de wet][ref1], worden kosten van bijstand door de gemeente teruggevorderd in de
      gevallen en naar de regels aangegeven in [artikel 12, tweede lid, onderdeel c][ref2], en de [hoofdstukken V][ref3]
      en [VI][ref4].

      2 Indien daarvoor dringende redenen aanwezig zijn kan het college besluiten geheel of gedeeltelijk van
      terugvordering af te zien.

      3 [Artikel 60 van de wet][ref5] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel12
