  - number: '49'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van voorschotten op de
      vergoeding, bedoeld in [artikel 48][ref1].

      2 Indien de uitvoering van dit besluit ernstige tekortkomingen vertoont, kan Onze Minister besluiten de
      voorschotten lager vast te stellen dan uit de op grond van het eerste lid gestelde regels voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel48
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: '48'
        hoofdstuk: VII
  - number: '50'
    text: |-
      1 Voor de ten laste van de gemeente gebleven kosten, bedoeld in [artikel 48][ref1], die op grond van het eerste
      lid van dat artikel niet voor vergoeding in aanmerking komen, verstrekt Onze Minister jaarlijks ten laste van 's
      Rijks kas aan de gemeente een uitkering, met dien verstande dat geen uitkering wordt verstrekt voor op grond van
      [artikel 52 van de wet][ref2] verleende algemene bijstand. De uitkering wordt ten minste drie maanden voorafgaande
      aan het kalenderjaar waarop zij betrekking heeft door Onze Minister vastgesteld.

      2 Het bedrag van de uitkering wordt volgens bij ministeriële regeling te stellen regels berekend aan de hand
      van het voor ieder jaar bij wet vast te stellen totale bedrag dat beschikbaar is voor de uitkeringen, bedoeld in
      het eerste lid. Bij deze ministeriële regeling kunnen regels worden gesteld omtrent het verzamelen van gegevens
      noodzakelijk voor de berekening van het bedrag van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel52
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: '48'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '52'
  - number: '51'
    text: |-
      1 Het totale bedrag, bedoeld in [artikel 50, tweede lid][ref1], kan in het jaar waarop het bedrag betrekking
      heeft en in het daaropvolgende jaar bij wet worden verhoogd indien de ontwikkeling van de uitkeringslasten daartoe
      aanleiding geeft.

      2 Indien het totale bedrag wordt herzien, wordt het bedrag waarmee de uitkering, bedoeld in
      [artikel 50, eerste lid][ref2], wordt verhoogd binnen een periode van vier weken na de herziening door Onze
      Minister vastgesteld.

      3 Indien toepassing is gegeven aan het tweede lid, wordt voor de toepassing van [artikel 52][ref3] onder het bedrag
      van de uitkering verstaan: het bedrag van de uitkering inclusief de verhoging, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0015711#Artikel52
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel51
    references:
