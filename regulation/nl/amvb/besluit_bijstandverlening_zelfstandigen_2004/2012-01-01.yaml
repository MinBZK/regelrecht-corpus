  - number: '40'
    text: |-
      Indien de zelfstandige ook na een tweede aanmaning niet aan zijn rente- en aflossingsverplichtingen voldoet, wordt
      het geleende bedrag teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel40
  - number: '41'
    text: |-
      1 De zelfstandige die geheel of gedeeltelijk niet in staat is aan de rente- en aflossingsverplichtingen te voldoen,
      kan een met redenen omkleed verzoek om uitstel of verlaging van betaling bij het college indienen.

      2 Uitstel van aflossing en betaling van rente wordt ten hoogste voor een periode van een jaar verleend. Het college
      kan zonodig deze periode tweemaal met ten hoogste een jaar verlengen. Over de gehele looptijd van de lening kan
      maximaal gedurende een aaneengesloten of onderbroken periode van drie jaar uitstel worden verleend.

      3 Het uitstel heeft bij voorrang betrekking op de aflossing. De vordering wegens uitstel van betaling van rente is
      niet rentedragend.

      4 Indien blijkt dat de zelfstandige duurzaam niet aan de verplichtingen kan voldoen of, indien de periode van
      drie jaar bedoeld in het tweede lid is verstreken, zijn de lening en de eventuele achterstallige rente terstond
      opeisbaar en worden deze teruggevorderd.

      5 Indien blijkt dat de financiële omstandigheden van de zelfstandige zodanig zijn dat deze geacht kan worden aan
      de verplichtingen te kunnen voldoen, worden de vanaf de vervaldatum achterstallige rente- en aflossingsbedragen
      terstond teruggevorderd. Indien hierbij sprake is van een toerekenbare tekortkoming in de nakoming, is over de
      achterstallige rente- en aflossingsbedragen de wettelijke rente verschuldigd.
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel41
  - number: '42'
    text: |-
      Indien op grond van dit besluit een lening is verstrekt werkt het college mee aan een schuldregeling of aan een
      akkoord voor zover dit noodzakelijk is voor de voortzetting van het bedrijf of zelfstandig beroep, of dit bij de
      beëindiging van het bedrijf of zelfstandig beroep tot stand kan komen. Deze medewerking wordt slechts verleend
      indien:

      a. het gedeelte van de lening dat door gestelde zekerheden wordt gedekt, buiten het akkoord blijft, en

      b. alle concurrente schuldeisers evenredige medewerking verlenen.
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel42
  - number: '43'
    text: |-
      1 Bij beëindiging van het bedrijf of zelfstandig beroep wordt de lening, behoudens in het geval [artikel 42][ref1]
      toepassing vindt, volledig terugbetaald. Gestelde zekerheden worden volledig uitgewonnen. In afwijking daarvan
      blijft, op verzoek van de betrokkene en voor zover mogelijk, een lening onder hypothecair verband, verbonden aan de
      eigen woning met bijbehorend erf, gehandhaafd of wordt deze tot de onbelaste waarde van deze woning gevestigd.

      2 Indien na beëindiging van het bedrijf of zelfstandig beroep een deel van de lening resteert en deze niet met
      toepassing van het vorige lid onder hypothecair verband is verleend, wordt het resterende deel van de lening vanaf
      de beëindiging renteloos. Gedurende de periode van vijf jaar na beëindiging van het bedrijf of zelfstandig beroep
      dient 50 procent van het netto inkomen boven de bijstandsnorm, bedoeld in [hoofdstuk 3, paragrafen 3.2][ref2] en
      [3.3, van de wet][ref3], besteed te worden voor aflossing van deze lening.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.2
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.3
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: '42'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015703
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0015703
        paragraaf: '3.3'
  - number: 43a
    text: |-
      1 Bij beëindiging van het bedrijf of zelfstandig beroep vangt de aflossing van de geldlening onder verband van
      hypotheek of verpanding aan op het moment van beëindiging van de bijstandsverlening.

      2 De aflossing van de geldlening onder verband van hypotheek of verpanding vindt maandelijks plaats gedurende ten
      hoogste tien jaar.

      3 Het college stelt het maandbedrag van de aflossing vast aan de hand van het inkomen, bedoeld in
      [paragraaf 3.4 van de Wet werk en bijstand][ref1], en de noodzakelijke, voor rekening van de zelfstandige en zijn
      gezin komende, bijzondere bestaanskosten. Indien de omstandigheden daartoe aanleiding geven, wijzigt het college
      het maandbedrag van de aflossing.

      4 Bij een inkomen van de zelfstandige en zijn gezin als bedoeld in het derde lid dat niet uitgaat boven de van
      toepassing zijnde bijstandsnorm, bedoeld in de [paragrafen 3.2][ref2] en [3.3 van de Wet werk en bijstand][ref3],
      wordt geen aflossing gevergd.

      5 Indien de zelfstandige en zijn gezin tijdens de aflossingsperiode van tien jaar schuldig nalatig zijn in het
      voldoen van de vastgestelde aflossing, is het nog niet afgeloste deel van de geldlening terstond opeisbaar en is
      daarover tevens de wettelijke rente verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.4
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.2
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.3
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel43a
    references:
      - id: ref1
