  - number: '29'
    text: |-
      1 Bijstand in de met de voorbereiding samenhangende kosten, bedoeld in [artikel 2, derde lid][ref1], kan worden
      verleend aan een persoon als bedoeld in artikel 2, derde lid.

      2 Deze bijstand heeft voorlopig de vorm van een renteloze geldlening.

      3 Indien de belanghebbende in aansluiting op de voorbereidingsperiode:

      a. geen bedrijf of beroep als zelfstandige begint, dan wordt de geldlening omgezet in een bedrag om niet, tenzij de
      belanghebbende niet voldoet aan de verplichtingen, bedoeld in [artikel 17 van de wet][ref2], of een tekortschietend
      besef van verantwoordelijkheid betoont voor de voorziening in het bestaan;

      b. een bedrijf of beroep als zelfstandige begint, dan wordt de geldlening omgezet in een rentedragende geldlening.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel17
