    text: |-
      Aan een zelfstandige als bedoeld in [artikel 2, eerste lid, onderdeel d][ref1], wordt algemene bijstand verleend
      gedurende ten hoogste 12 maanden. Verlenging van deze termijn met ten hoogste 12 maanden is op verzoek van de
      zelfstandige mogelijk voor zover de beëindiging naar het oordeel van het college een langere termijn noodzakelijk
      maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel2
