  - number: '59'
    text: |-
      De kosten, bedoeld in [artikel 56, eerste lid, onder b, en tweede lid][ref1], worden niet vergoed:

      a. indien het onderzoek is opgedragen aan een deskundige derde die onder verantwoordelijkheid van het college
      werkzaam is;

      b. voorzover zij hoger zijn dan de door Onze Minister vast te stellen maximaal voor vergoeding in aanmerking
      komende kosten voor onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel56
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel59
