  - number: '39'
    text: |-
      1 Het college legt in de beschikking waarin de bijstand wordt toegekend in elk geval vast:

      a. indien de bijstand wordt verstrekt in de vorm van een rentedragende geldlening op grond van de
      [artikelen 20][ref1] of [24][ref2]:

      1°. de bestemming van de geldlening;

      2°. de verplichtingen tot betaling van rente en aflossing alsmede de betalingstermijnen;

      3°. dat het bedrag van de lening, behoudens in de gevallen waarin [artikel 21, tweede lid][ref3], van toepassing
      is en met inachtneming van [artikel 41][ref4], terstond opeisbaar is bij het niet nakomen van de verplichtingen tot
      betaling van rente en aflossing;

      b. indien de bijstand wordt verstrekt in de vorm van borgtocht op grond van [artikel 16][ref5], dat aan de
      verplichtingen opgenomen in de leningsovereenkomst met de bank dient te worden voldaan.

      2 In de beschikking tot toekenning van de bijstand wordt voorts opgenomen dat het bedrag van de lening terstond
      opeisbaar is:

      a. indien zij niet overeenkomstig de bestemming is besteed;

      b. op het moment dat de zelfstandige het bedrijf of zelfstandig beroep overdraagt of beëindigt;

      c. ingeval van surséance van betaling of faillissement van de zelfstandige, van één van de vennoten of leden
      waarmee het bedrijf of zelfstandig beroep in een samenwerkingsverband wordt uitgeoefend, of van de rechtspersoon.

      3 Het college kan aan het verlenen van bijstand in de vorm van een geldlening verplichtingen verbinden
      die zijn gericht op meerdere zekerheid voor de nakoming van de aan deze bijstand verbonden rente- en
      aflossingsverplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0015711#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0015711#Artikel41
      [ref5]: https://wetten.overheid.nl/BWBR0015711#Artikel16
