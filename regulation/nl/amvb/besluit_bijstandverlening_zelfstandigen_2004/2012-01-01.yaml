        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '19'
    text: |-
      In afwijking van [artikel 11][ref1] wordt aan een zelfstandige als bedoeld in
      [artikel 2, eerste lid, onderdeel a][ref2], algemene bijstand verleend als een bedrag om niet indien:

      a. de uitkeringsduur ten hoogste zes maanden is;

      b. de inkomensvorming in het betreffende bedrijf of zelfstandig beroep regelmatig over het jaar verloopt en het
      inkomen duurzaam lager is dan de som van de bijstandsnorm, bedoeld in [hoofdstuk 3, paragraaf 3.2][ref3] en
      [3.3, van de wet][ref4], en de verleende bijzondere bijstand; en

      c. het vermogen van de zelfstandige, het bedrag, bedoeld in [artikel 3, eerste lid][ref5], niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.2
