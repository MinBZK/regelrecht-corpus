  - number: 60a
    text: |-
      [Hoofdstuk VII][ref1] blijft van toepassing op de vaststelling van de vergoeding, uitkering en kosten, bedoeld in
      de [artikelen 54][ref2] en [58][ref3], zoals dit hoofdstuk luidde voor inwerkingtreding van de Wet van 17 december
      2009, (Stb. 592) tot bundeling van uitkeringen inkomensvoorziening aan gemeenten, voor kosten die betrekking hebben
      op kalenderjaren gelegen voor die van inwerkingtreding van die wet.


