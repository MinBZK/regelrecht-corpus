  - number: '23'
    text: |-
      1 Aan de persoon, bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], wordt na de beëindiging van de uitkering
      uit hoofde van werkloosheid gedurende ten hoogste 36 maanden algemene bijstand verleend. Verlenging van deze
      termijn is mogelijk indien de zelfstandige om redenen van medische of sociale aard niet volledig beschikbaar is
      voor de uitoefening van het bedrijf of zelfstandig beroep.

      2 Toekenning van algemene bijstand als bedoeld in het eerste lid wordt beëindigd zodra het bedrijf of zelfstandig
      beroep niet meer levensvatbaar is.

      3 Het college onderzoekt of het bedrijf of zelfstandig beroep nog levensvatbaar is:

      a. 6 maanden na aanvang van de bijstandsverlening, bedoeld in het eerste lid, en daarna na een periode van
      respectievelijk 6 en 12 maanden;

      b. bij verlenging van de toekenning van algemene bijstand om redenen van medische of sociale aard als bedoeld in
      het eerste lid, tweede volzin, en vervolgens telkens na een periode van 12 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel2
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel23
