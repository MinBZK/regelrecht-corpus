  - number: '53'
    text: |-
      Onze Minister stelt regels inzake de betaling van:

      a. de uitkering, bedoeld in [artikel 50, eerste lid][ref1];

      b. het bedrag waarmee de uitkering op grond van [artikel 51][ref2] wordt verhoogd;

      c. de aanvullende uitkering, bedoeld in [artikel 52][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0015711#Artikel52
