  - number: '30'
    text: |-
      1 Bijstand ter voorziening in de behoefte aan bedrijfskapitaal aan de zelfstandige die het bedrijf of zelfstandig
      beroep uitoefent in de vorm van een maatschap, een vennootschap onder firma, een commanditaire vennootschap, een
      besloten vennootschap of een coöperatieve vereniging met wettelijke aansprakelijkheid, wordt slechts verleend
      indien hoofdelijke aansprakelijkheid voor de uit de bijstandsverlening voortvloeiende verplichtingen wordt aanvaard
      door:

      a. alle vennoten of leden waarmee het bedrijf of zelfstandig beroep wordt uitgeoefend;

      b. de besloten vennootschap en de coöperatieve vereniging met wettelijke aansprakelijkheid.

      2 De eis van aanvaarding van hoofdelijke aansprakelijkheid geldt niet voor de commanditaire vennoot wiens inbreng
      uitsluitend uit kapitaal bestaat.

      3 Bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt niet verleend aan de vennoot in een maatschap
      die daar alleen arbeid inbrengt. Deze vennoot behoeft geen hoofdelijke aansprakelijkheid te aanvaarden voor de aan
      de andere vennoten verleende bijstand ter voorziening in de behoefte aan bedrijfskapitaal.
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel30
  - number: '31'
    text: |-
      Op de bijstandsverlening, bedoeld in [artikel 30][ref1], is [artikel 21][ref2] op ieder van de vennoten of
      leden van overeenkomstige toepassing, mits de zelfstandige is aan te merken als een persoon als bedoeld in
      [artikel 2, eerste lid, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0015711#Artikel2
