  - number: '57'
    text: |-
      1 Onze Minister stelt regels met betrekking tot het verlenen van voorschotten op de vergoeding, bedoeld in
      [artikel 56][ref1].

      2 Indien de uitvoering van dit besluit door het college ernstige tekortkomingen vertoont, kan Onze Minister
      besluiten de voorschotten lager vast te stellen dan uit de op grond van het eerste lid gestelde regels voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel56
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel57
