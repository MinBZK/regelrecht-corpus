      De bijstand die wordt verleend in de vorm van een bedrag om niet met toepassing van de [artikelen 12][ref1],
      [21, eerste lid][ref2], [22][ref3] en [26][ref4] wordt verhoogd met een forfaitair bedrag dat
      overeenkomt met de loonbelasting en de premies volksverzekeringen en de vergoeding, bedoeld in
      [artikel 19, vierde lid, van de wet][ref5].


