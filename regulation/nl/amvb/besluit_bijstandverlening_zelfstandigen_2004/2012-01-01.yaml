  - number: '32'
    text: |-
      Indien bijstand wordt verleend aan een zelfstandige die zijn bedrijf of zelfstandig beroep uitoefent in een
      samenwerkingsverband of in de vorm van een rechtspersoon, gelden de bedragen van de vermogensgrenzen, bedoeld in
      [artikel 3][ref1], voor ieder van de vennoten of leden afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel3
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '33'
    text: |-
      Ten aanzien van de zelfstandige die het bedrijf of zelfstandig beroep uitoefent in de vorm van een besloten
      vennootschap of een coöperatieve vereniging met wettelijke aansprakelijkheid, wordt onder netto inkomen als bedoeld
      in [artikel 1, onderdeel e][ref1], mede verstaan de naar evenredigheid van het aantal zelfstandigen in een boekjaar
      omgerekende netto winst van deze rechtspersoon verminderd met de hierover verschuldigde vennootschapsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel1
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: '1'
        hoofdstuk: I
  - number: '34'
    text: |-
      De bijstand die met toepassing van [artikel 37][ref1] wordt verleend heeft voorlopig de vorm van een renteloze
      geldlening. Het bepaalde bij en krachtens [artikel 11, tweede lid][ref2], is op deze geldlening van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel11
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: '37'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0015711
        artikel: '11'
        hoofdstuk: II
        paragraaf: '4'
  - number: '35'
    text: |-
      1 De aanvraag wordt ingediend bij het college.

      2 Indien het een aanvraag betreft om als zelfstandige bijstand te ontvangen stelt het college binnen dertien weken
      na ontvangst van de aanvraag vast of recht op bijstand bestaat.

      3 Het college kan de termijn bedoeld in het tweede lid verlengen met ten hoogste dertien weken, indien het college
      niet in staat is tijdig een besluit te nemen. Van de verlenging doet het college mededeling aan de zelfstandige,
      onder vermelding van het tijdstip waarop de termijn voor het nemen van een besluit zal verstrijken.

      4 Het college besluit niet tot toekenning van bijstand dan nadat de juistheid en volledigheid van de door de
      zelfstandige verstrekte gegevens is onderzocht.

      5 Als buiten toedoen van de zelfstandige het onderzoek naar de juistheid en de volledigheid van de door hem
      verstrekte gegevens niet binnen de beslistermijn kan worden voltooid, besluit het college op de aanvraag op voet
      van de dan bekende gegevens.
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel35
  - number: '36'
    text: |-
      De bijstand aan een ondernemer in de binnenvaart wordt verleend, indien hij verblijft op het grondgebied van:

      a. de provincies Groningen, Friesland en Drenthe: door het college van de gemeente Groningen;

      b. de provincies Overijssel en Flevoland: door het college van de gemeente Zwolle;

      c. de provincie Gelderland en de gemeenten Bergen, Boxmeer, Cuijk, Gennep, Grave, Lith, Mook en Middelaar en Oss:
      door het college van de gemeente Nijmegen;

      d. de provincie Utrecht: door het college van de gemeente Nieuwegein;

      e. de provincie Noord-Holland: door het college van de gemeente Amsterdam;

      f. de provincie Zuid-Holland: door het college van de gemeente Rotterdam;

      g. de provincie Zeeland: door het college van de gemeente Terneuzen;

      h. de provincie Noord-Brabant, met uitzondering van de gemeenten Asten, Boxmeer, Cranendonck, Cuijk, Deurne, Grave,
      Helmond, Lith, Mierlo, Oss en Someren: door het college van de gemeente Geertruidenberg;

      i. de gemeenten Asten, Cranendonck, Deurne, Helmond, Mierlo en Someren en de provincie Limburg, met uitzondering
      van de gemeenten Bergen, Gennep en Mook en Middelaar: door het college van de gemeente Maasbracht.
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel36
  - number: '37'
    text: |-
      1 Bij zeer dringende redenen van tijdelijke aard kan aan de zelfstandige, die als ingezetene in de
      basisadministratie persoonsgegevens van een gemeente is ingeschreven en die zich uit hoofde van zijn bedrijf of
      beroep tijdelijk in het buitenland bevindt, door Onze Minister bijstand worden verleend volgens door hem te stellen
      regels.

      2 [Hoofdstuk 6, paragraaf 6.5, van de wet][ref1], en [hoofdstuk VI][ref2] zijn van toepassing op terugvordering en
      verhaal van kosten van bijstand die door Onze Minister is verleend, met dien verstande dat het Rijk in plaats van
      de gemeente treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Paragraaf6.5
      [ref2]: https://wetten.overheid.nl/BWBR0015711#HoofdstukVI
