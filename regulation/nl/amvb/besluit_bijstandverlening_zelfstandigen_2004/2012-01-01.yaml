        hoofdstuk: VII
  - number: '60'
    text: |-
      1 Onze Minister herziet, met ingang van 1 januari van elk kalenderjaar, met de procentuele stijging van het
      prijsindexcijfer voor de gezinsconsumptie de bedragen, genoemd in de[ artikelen 3][ref1], [20][ref2], [22][ref3],
      [24][ref4], [25][ref5] en [26][ref6].

      2 Onze Minister herziet het rentepercentage, genoemd in [artikel 15][ref7], voor zover de rente die banken in
      rekening brengen bij het verstrekken van leningen aan bedrijven, daartoe aanleiding geeft.

      3 Onze Minister stelt het in [artikel 6, tweede lid][ref8], genoemde percentage zodanig vast dat dit gelijk
      is aan het gemiddeld bedrag dat voor personen jonger dan 65 jaar over de algemene bijstand verschuldigd is aan
      loonbelasting en premies volksverzekeringen, uitgedrukt als een percentage van de algemene bijstand verhoogd met
      deze loonbelasting en premies.


