  - number: '15'
    text: |-
      Bijstand in de vorm van een rentedragende geldlening ter voorziening in de behoefte aan bedrijfskapitaal wordt
      verleend met inachtneming van het volgende:

      a. de rente van de geldlening bedraagt 5 procent  per jaar gedurende de gehele looptijd van de geldlening;

      b. de looptijd van de geldlening is ten hoogste tien jaar.
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel15
  - number: '16'
    text: |-
      Bijstand in de vorm van borgtocht ter voorziening in de behoefte aan bedrijfskapitaal wordt verleend met
      inachtneming van het volgende:

      a. de borgtocht heeft geen betrekking op de rente en kosten van die geldlening waarvoor borgtocht wordt aangegaan;

      b. de looptijd van de geldlening waarvoor borgtocht wordt aangegaan is ten hoogste tien jaar;

      c. de borgtocht kan alleen worden aangegaan met een bank;

      d. het bedrag dat de zelfstandige na uitwinning verschuldigd is, wordt aangemerkt als een lening, waarop de
      [artikelen 40 tot en met 43][ref1] van toepassing zijn;

      e. uitwinning door de bank kan slechts plaatsvinden na toestemming van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel40
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel16
