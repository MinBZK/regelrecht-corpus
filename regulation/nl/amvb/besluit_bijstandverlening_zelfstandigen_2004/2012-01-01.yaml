  - number: '46'
    text: |-
      Kosten van bijstand worden van de zelfstandige teruggevorderd voor zover:

      a. hij naderhand met betrekking tot de periode waarover bijstand is verleend over in aanmerking te nemen middelen
      als bedoeld in [hoofdstuk 3, paragraaf 3.4, van de wet][ref1], beschikt of kan beschikken;

      b. bijstand is verleend met een bepaalde bestemming en naderhand door hem vergoedingen of tegemoetkomingen worden
      ontvangen met het oog op die bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.4
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0015703
        paragraaf: '3.4'
  - number: '47'
    text: |-
      Onverminderd de [artikelen 40][ref1] en [41][ref2] worden kosten van bijstand verleend in de vorm van een
      geldlening van de zelfstandige teruggevorderd, indien hij hieruit voortvloeiende verplichtingen niet of niet
      behoorlijk nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel41
