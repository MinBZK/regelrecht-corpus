  - number: '54'
    text: |-
      1 Onze Minister stelt de ten laste van de gemeente gebleven kosten, bedoeld in de [artikelen 48][ref1]
      en [50][ref2], de vergoeding, bedoeld in [artikel 48][ref3], en de aanvullende uitkering,
      bedoeld in [artikel 52][ref4], vast binnen een jaar na ontvangst door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties van de verantwoordingsinformatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref5].

      2 Indien de verantwoordingsinformatie, bedoeld in het eerste lid, niet binnen achttien maanden na het kalenderjaar
      waarop het betrekking heeft is ontvangen door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties worden de
      ten laste van de gemeente gebleven kosten ambtshalve door Onze Minister vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0015711#Artikel48
