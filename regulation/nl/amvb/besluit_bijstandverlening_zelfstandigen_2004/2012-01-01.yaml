        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '18'
    text: |-
      Aan een zelfstandige als bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], wordt gedurende ten hoogste 12
      maanden algemene bijstand verleend. Verlenging van deze termijn met ten hoogste 24 maanden is mogelijk indien de
      oorzaak van de behoefte aan bijstand is gelegen in externe omstandigheden van tijdelijke aard.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel2
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel18
    references:
