      - id: ref3
        bwb_id: BWBR0015711
        artikel: '52'
        hoofdstuk: VII
  - number: '52'
    text: |-
      1 Indien bij de vaststelling van de ten laste van de gemeente gebleven kosten, bedoeld in artikel 54, blijkt, dat
      de ten laste van de gemeente gebleven kosten, bedoeld in [artikel 50, eerste lid][ref1], in een kalenderjaar meer
      bedragen dan 115% van het bedrag van de uitkering, bedoeld in [artikel 50][ref2], wordt door Onze Minister ten
      laste van 's Rijks kas aan de gemeente een aanvullende uitkering toegekend.

      2 De hoogte van de aanvullende uitkering is gelijk aan het verschil tussen het bedrag van de ten laste van de
      gemeente gebleven kosten, bedoeld in [artikel 50, eerste lid][ref3], en 115% van het bedrag van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0015711#Artikel50
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel52
