  - number: 48a
    text: |-
      Onze Minister verstrekt jaarlijks ten laste van ’s Rijks kas aan het college een uitkering als onderdeel van
      de uitkering, bedoeld in [artikel 69, eerste lid, van de wet][ref1], voor de kosten van algemene bijstand
      aan zelfstandigen, bedoeld in [artikel 2, eerste lid, onderdeel b][ref2], en de belanghebbende, bedoeld in
      [artikel 2, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
