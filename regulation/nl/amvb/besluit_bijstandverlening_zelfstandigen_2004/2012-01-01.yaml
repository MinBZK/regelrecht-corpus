      1 Bijstand in de vorm van een bedrag om niet als bedoeld in de [artikelen 12][ref1], [19][ref2], [21][ref3] en
      [22][ref4]:

      a. wordt niet verleend indien het eigen vermogen meer bedraagt dan  € 156 240,00 ;

      b. wordt, indien het eigen vermogen meer bedraagt dan  € 37 177,00 , doch minder dan € 156 240,00  slechts verleend
      indien dit eigen vermogen niet meer bedraagt dan 30 procent van het totaal vermogen.

      2 In afwijking van het eerste lid wordt aan de zelfstandige als bedoeld in
      [artikel 2, eerste lid, onderdeel c][ref5], bijstand in de vorm van een bedrag om niet als bedoeld in de
      [artikelen 12][ref6] en [26][ref7] niet verleend, indien het eigen vermogen meer bedraagt dan  € 109 368,00 .


