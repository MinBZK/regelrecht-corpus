        artikel: '60'
  - number: '45'
    text: |-
      1 Het college vordert de bijstand van de zelfstandige terug voor zover de bijstand ten onrechte of tot een te hoog
      bedrag is verleend als gevolg van:

      a. het niet nakomen van de verplichtingen, bedoeld in [artikel 17 van de wet][ref1];

      b. het niet nakomen van de verplichting, bedoeld in [artikel 38, eerste en tweede lid][ref2]; of

      c. een tekortschietend besef van verantwoordelijkheid voor de voorziening in het bestaan, in het geval het bijstand
      in de met de voorbereiding samenhangende kosten betreft.

      2 Hetgeen anderszins onverschuldigd is betaald wordt teruggevorderd voor zover de zelfstandige dit redelijkerwijs
      had kunnen begrijpen.

      3 Terugvordering als bedoeld in het tweede lid vindt niet plaats, indien de betreffende kosten zijn gemaakt meer
      dan twee jaar voor de datum van verzending van het besluit tot terugvordering.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0015711#Artikel38
    url: https://wetten.overheid.nl/BWBR0015711/2012-01-01#Artikel45
