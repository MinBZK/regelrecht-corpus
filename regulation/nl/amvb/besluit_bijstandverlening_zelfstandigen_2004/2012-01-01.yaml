        paragraaf: '2'
  - number: '48'
    text: |-
      1 Onze Minister vergoedt, ten laste van 's Rijks kas, 75% van de in een kalenderjaar ten laste van de gemeente
      gebleven kosten van:

      a. algemene bijstand aan zelfstandigen, bedoeld in [artikel 2, eerste lid, onderdelen a, c, d en e][ref1],
      waaronder begrepen de loonbelasting, premies volksverzekeringen en daarnaast de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref2], die daarover verschuldigd zijn, voorzover de algemene bijstand niet
      bij wijze van voorschot op grond van [artikel 52 van de wet][ref3] is verleend;

      b. bijstand ter voorziening in de behoefte aan bedrijfskapitaal.

      2 In afwijking van het eerste lid, is de vergoeding 100% indien de bijstand is verleend aan ondernemers in de
      binnenvaart.

      3 Onder ten laste van de gemeente gebleven kosten, bedoeld in het eerste lid, wordt verstaan, de lasten in een
      kalenderjaar verminderd met de baten in dat jaar in verband met de door de gemeente verleende bijstand, bedoeld in
      het eerste lid.

      4 Voor de vaststelling van de ten laste van de gemeente gebleven kosten in het kalenderjaar 2009 en daaraan
      voorafgaande kalenderjaren is artikel 48 zoals dat luidde op 31 december 2010 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel52
