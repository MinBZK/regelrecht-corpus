preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 15 augustus 2001, nr. DGTP/01/4060/VW,
    Directoraat-Generaal Telecommunicatie en Post;

    Gelezen het verzoek van het college van de Onafhankelijke Post en Telecommunicatieautoriteit van 10 juli 2001, met
    kenmerk OPTA/EGM/2000/200466;

    Gelet op richtlijn nr. 92/44/EEG van de Raad van de Europese Gemeenschappen van 5 juni 1992 betreffende de
    toepassing van Open Network Provision (ONP) op huurlijnen (PbEG L 165), richtlijn nr. 98/10/EG van het Europees
    Parlement en de Raad van de Europese Unie van 26 februari 1998 inzake de toepassing van Open Network Provision
    (ONP) op spraaktelefonie en inzake de universele telecommunicatiedienst in een door concurrentie gekenmerkt klimaat
    (PbEG L 101), richtlijn nr. 97/33/EG van het Europees Parlement en de Raad van de Europese Unie van 30 juni 1997
    inzake interconnectie op telecommunicatiegebied, wat betreft de waarborging van de universele dienst en van de
    interoperabiliteit door toepassing van de beginselen van Open Network Provision (ONP) (PbEG L 199), artikel 3.3,
    negende lid, artikel 7.1, hoofdstuk 10 en artikel 20.4 van de Telecommunicatiewet;

    De Raad van State gehoord (advies van 11 september 2001, No. W09.010439/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 1 november 2001, nr. DGTP/01/4881/
    VW, Directoraat-Generaal Telecommunicatie en Post;

