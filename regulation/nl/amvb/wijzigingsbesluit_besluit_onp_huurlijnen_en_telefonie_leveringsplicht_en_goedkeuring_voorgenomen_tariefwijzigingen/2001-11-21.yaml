articles:
  - number: IV
    text: |-
      Voorgenomen wijzigingen van tarieven van huurlijnen of voorgenomen wijzigingen van tarieven voor het gebruik van
      het vaste openbare telefoonnetwerk en van de vaste openbare telefoondienst, waarvan het college, op grond van de
      procedure van [artikel 17][ref1] onderscheidenlijk [artikel 36 van het Besluit ONP huurlijnen en telefonie][ref2],
      zoals die gold voor de inwerkingtreding van dit besluit, schriftelijk in kennis is gesteld voor de
      inwerkingtreding van dit besluit, worden behandeld volgens de procedure van [artikel 17][ref3] onderscheidenlijk
      [artikel 36 van het Besluit ONP huurlijnen en telefonie][ref4] zoals die gold voor de inwerkingtreding van dit
      besluit.


