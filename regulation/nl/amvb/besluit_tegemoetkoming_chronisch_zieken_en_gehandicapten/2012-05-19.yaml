    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip waarbij voor
      artikelen of onderdelen daarvan terugwerkende kracht mogelijk is tot en met 1 januari 2009 met
      dien verstande dat [artikel 5][ref1] eerst toepassing vindt in het jaar 2010 en dat de korting
      die wordt verleend op grond van [artikel 16d, vijfde lid, van het Bijdragebesluit zorg][ref2] en
      [artikel 4.1, vierde lid, van het Besluit maatschappelijke ondersteuning][ref3] zoals deze komen te luiden na
      inwerkingtreding van dit besluit voor het jaar 2009 in een keer wordt uitgekeerd in het tweede kwartaal van het
      jaar 2010.


