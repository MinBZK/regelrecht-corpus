articles:
  - number: '1'
    text: |-
      Voor de toepassing van de [artikelen 2 tot en met 5][ref1] en de daarop berustende bepalingen wordt verstaan onder:

      a. *de wet:* de [Wet tegemoetkoming chronisch zieken en gehandicapten][ref2];

      b. *chronische groep:* een voor de verzekerde vergoede ATC of DBC, of een combinatie van een vergoede ATC en DBC
      die gebruikt wordt bij de behandeling van een specifieke chronische aandoening;

      c. *ATC:* farmaceutische zorg die wordt geregistreerd met een ATC (Anatomical Therapeutic Chemical Classification)
      als bedoeld in [artikel 1, eerste lid, onderdeel j, van de Regeling zorgverzekering][ref3];

      d. *DBC:* diagnosebehandelingcombinatie als bedoeld in
      [artikel 1, eerste lid, onderdeel m, van de Regeling zorgverzekering][ref4];

      e. *indicatiebesluit:* een besluit als bedoeld in [artikel 1, onderdeel d, van het Zorgindicatiebesluit][ref5] dan
      wel een besluit als bedoeld in [artikel 9b, vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref6], genomen
      door een aldaar bedoelde stichting;

      f. *zorgverzekeraar:* een zorgverzekeraar als bedoeld in [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref7];

      g. *militair:* een militair ambtenaar in werkelijke dienst als bedoeld in
      [artikel 1, eerste lid, onderdeel a, juncto onderdeel b, van de Militaire ambtenarenwet 1931][ref8], dan wel een
      militair aan wie buitengewoon verlof met behoud van militaire inkomsten is verleend.


