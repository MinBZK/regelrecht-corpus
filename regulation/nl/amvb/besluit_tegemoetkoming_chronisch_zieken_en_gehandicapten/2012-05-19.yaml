  - number: '3'
    text: |-
      1 Zorgverzekeraars en de rechtspersoon, bedoeld in
      [artikel 90a, eerste lid, van het Algemeen militair ambtenarenreglement][ref1], verstrekken van rechthebbenden die
      vallen onder de categorieën, genoemd in [artikel 2, eerste lid, onderdelen a tot en met c en e tot en met g][ref2],
      aan het CAK:

      a. het burgerservicenummer of bij ontbreken daarvan het sociaal-fiscaalnummer,

      b. het rekeningnummer,

      c. de geboortedatum,

      d. indien de rechthebbende is overleden, de datum van het overlijden,

      e. de naam en het adres van de rechthebbende, en

      f. indien dat het geval is: dat een rechthebbende op grond van [artikel 2, tweede lid, onderdelen a en d][ref3],
      recht heeft op de daar bedoelde tegemoetkoming.

      2 Zorgverzekeraars verstrekken aan het CAK een overzicht van verzekerden als bedoeld in
      [artikel 1, onderdeel f, van de Zorgverzekeringswet][ref4] die verzekerd waren op 31 december van het jaar waarop
      de tegemoetkoming betrekking heeft.

      3 Indicatieorganen als bedoeld in [artikel 9a, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref5]
      en de rechtspersoon, bedoeld in [artikel 90a, eerste lid, van het Algemeen militair ambtenarenreglement][ref6],
      verstrekken aan het CAK van personen die vallen onder [artikel 2, eerste lid, onderdelen h of j][ref7], of artikel
      2, tweede lid, onderdeel b:

      a. het burgerservicenummer of bij het ontbreken daarvan het sociaal-fiscaalnummer,

      b. de naam en het adres van de rechthebbende,

      c. de geboortedatum, en

      d. indien dat het geval is: de mededeling dat de persoon valt in de categorieën, genoemd in
      [artikel 2, eerste lid, onderdeel j, of het tweede lid][ref8].

      4 Gemeenten verstrekken aan het CAK van personen die vallen onder [artikel 2, eerste lid, onderdeel d][ref9]:

      a. het burgerservicenummer of bij het ontbreken daarvan het sociaal fiscaal nummer,

      b. naam en adres van de rechthebbende, en

      c. de geboortedatum.

      5 Gemeenten verstrekken aan het CAK van personen die in de zin van [artikel 2, eerste lid, onderdeel i][ref10], of
      artikel 2, tweede lid, onderdeel c, een persoonsgebondenbudget voor huishoudelijke verzorging ontvangen:

      a. het burgerservicenummer of bij het ontbreken daarvan het sociaal-fiscaalnummer,

      b. de naam en het adres van de rechthebbende,

      c. de geboortedatum,

      d. de datum waarop en de duur waarvoor de indicatie is gegeven, en

      e. het gemiddelde aantal etmalen, dagdelen en uren waarvoor de indicatie is gegeven.

      6 Stichtingen als bedoeld in [artikel 9b, vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref11]
      verstrekken aan de indicatieorganen, bedoeld in het derde lid, van personen die zij voor zorg als bedoeld in de
      [Algemene Wet Bijzondere Ziektekosten][ref12] hebben geïndiceerd:

      a. het burgerservicenummer of bij het ontbreken daarvan het sociaal-fiscaalnummer,

      b. de naam en het adres van de rechthebbende,

      c. de geboortedatum,

      d. de soort en omvang van de geïndiceerde zorg, en

      e. de ingangs- en einddatum per geïndiceerde functie.

      7 Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank, bedoeld in
      [artikel 1, onderdelen c en d, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref13], verstrekken
      aan het CAK de rekeningnummers van rechthebbenden die vallen onder [artikel 2, eerste lid, onderdeel j][ref14], met
      uitzondering van die van militairen.


