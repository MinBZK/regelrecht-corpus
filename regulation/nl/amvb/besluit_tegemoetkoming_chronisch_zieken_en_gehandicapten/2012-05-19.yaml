  - number: '4'
    text: |-
      1 Recht op de tegemoetkoming, bedoeld in [artikel 10 van de wet][ref1], heeft:

      a. de persoon, bedoeld in [artikel 10, eerste lid, van de wet][ref2] die op 1 juli van het kalenderjaar recht heeft
      op:

      1°. een arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref3] bij een
      arbeidsongeschiktheid van 35% of meer,

      2° .een arbeidsongeschiktheidsuitkering op grond van
      [hoofdstuk 6 van de Wet werk en inkomen naar arbeidsvermogen][ref4],

      3°. een werkhervattingsuitkering gedeeltelijk arbeidsgeschikten op grond van
      [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref5], of

      4°. een uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6] bij een
      arbeidsongeschiktheid van 35% of meer;

      b. de persoon die op 1 juli van het kalenderjaar recht heeft op een arbeidsongeschiktheidsuitkering
      naar een mate van arbeidsongeschiktheid van 35% of meer of op arbeidsondersteuning op grond van de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref7].

      2 De persoon, bedoeld in het eerste lid, ontvangt per kalenderjaar een tegemoetkoming van € 342.

      3 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt de tegemoetkoming ambtshalve in het derde kwartaal van
      het kalenderjaar.


