    text: |-
      1 De bedragen, genoemd in de [artikelen 2][ref1] en [4][ref2], worden bij het begin van het
      kalenderjaar bij ministeriële regeling vervangen door andere bedragen. Deze bedragen worden
      berekend door de te vervangen bedragen te vermenigvuldigen met de tabelcorrectiefactor, bedoeld in
      [artikel 10.2 van de Wet inkomstenbelasting 2001][ref3], en de uitkomst vervolgens naar boven af te ronden op hele
      getallen.

      2 Het eerste lid is niet van toepassing met betrekking tot de in [artikel 2][ref4] genoemde tegemoetkomingsbedragen
      over de kalenderjaren 2012 tot en met 2014.

      3 Het tweede lid alsmede de aanduiding «1.» voor het eerste lid en dit lid vervallen met ingang van 1 januari 2015.


