  - number: '2'
    text: |-
      1 De tegemoetkoming, bedoeld in [artikel 2, eerste lid, van de wet][ref1], bedraagt € 306 indien de rechthebbende
      in het kalenderjaar waarop de tegemoetkoming betrekking heeft, jonger was dan 65 jaar of 65 jaar is geworden,
      onderscheidenlijk € 153 indien de rechthebbende in het gehele jaar 65 jaar of ouder was, de rechthebbende niet is
      overleden in het kalenderjaar waarop de tegemoetkoming betrekking heeft, en:

      a. in dat jaar één of meer ATC’s of in het jaar voorafgaande aan dat jaar één of meer DBC’s vergoed kreeg die
      behoren tot een bij ministeriële regeling aangewezen chronische groep die recht geeft op een lage tegemoetkoming;

      b. in dat jaar één of meer ATC’s of in het jaar voorafgaande aan dat jaar één of meer DBC’s vergoed kreeg die
      behoren tot twee of meer bij ministeriële regeling aangewezen chronische groepen die afzonderlijk geen recht geven
      op een tegemoetkoming;

      c. in dat jaar een ATC of in het jaar voorafgaande aan dat jaar een DBC vergoed kreeg die behoort of die tezamen
      behoren tot een bij ministeriële regeling aangewezen chronische groep die geen recht geeft op een tegemoetkoming en
      daarnaast voor rekening van zijn zorgverzekeraar een bij ministeriële regeling aangewezen hulpmiddel in een bij die
      regeling te bepalen periode heeft verkregen of heeft laten repareren;

      d. op 31 december van dat jaar heeft beschikt over een indicatie voor het gedurende dat jaar gebruiken van een
      rolstoel op grond van [artikel 4, eerste lid, onderdeel b, van de Wet maatschappelijke ondersteuning][ref2];

      e. in het jaar voorafgaande aan dat jaar van zijn zorgverzekeraar geneeskundige zorg gericht op revalidatie in een
      bij ministeriële regeling aangewezen instelling, vergoed heeft gekregen;

      f. in dat jaar:

      1°. van zijn zorgverzekeraar ten minste een bij ministeriële regeling te bepalen bedrag, gelijk aan
      het gemiddelde bedrag aan kosten voor 96 behandelingen fysiotherapie of oefentherapie als bedoeld in
      [artikel 2.6, tweede lid, van het Besluit zorgverzekering][ref3], vergoed heeft gekregen;

      2°. jonger was dan 18 jaar en in dat jaar en het daaraan voorafgaande jaar van zijn zorgverzekeraar ten minste
      een bij ministeriële regeling te bepalen bedrag, gelijk aan het gemiddelde bedrag van de kosten voor een bij die
      regeling te bepalen aantal behandelingen fysiotherapie of oefentherapie vergoed heeft gekregen, of

      3°. militair was en in dat jaar en het daaraan voorafgaande jaar van de rechtspersoon, bedoeld in
      [artikel 90a, eerste lid, van het Algemeen militair ambtenarenreglement][ref4], ten minste een bij ministeriële
      regeling te bepalen bedrag, gelijk aan het gemiddelde bedrag aan kosten voor een bij die regeling te bepalen aantal
      behandelingen fysiotherapie of oefentherapie, vergoed heeft gekregen;

      g. na 31 december 2011 van zijn zorgverzekeraar een bij ministeriële regeling aangewezen hulpmiddel bij een
      blijvende aandoening vergoed heeft gekregen;

      h. in dat jaar al dan niet aaneengesloten 26 weken of meer op grond van een indicatiebesluit was
      aangewezen op één tot tien uren per week zorg als bedoeld in [artikelen 4][ref5], [5][ref6] en
      [6 van het Besluit zorgaanspraken AWBZ][ref7], met dien verstande dat:

      1°. een indicatie voor een functie voor één dagdeel geldt als een indicatie voor 2,5 uren zorg per week;

      2°. het gemiddelde aantal uren waarvoor een functie is geïndiceerd, geldt als het aantal uren zorg per week voor
      die functie, en

      3°. in geval van een indicatie voor twee of meer functies het totaalaantal uren zorg per week wordt berekend door
      het aantal uren zorg per functie per week op te tellen;

      i. in dat jaar al dan niet aaneengesloten 26 weken of meer gedurende één
      tot tien uren per week in natura huishoudelijke verzorging als bedoeld in
      [artikel 1, eerste lid, onderdeel h, van de Wet maatschappelijke ondersteuning][ref8] heeft ontvangen of daartoe
      op grond van een indicatiebesluit was aangewezen en een persoonsgebonden budget heeft ontvangen, met dien verstande
      dat voor het vaststellen van de periode van 26 weken wordt aangesloten bij de indeling in weken als bedoeld in
      [artikel 4.1, derde lid, van het Besluit maatschappelijke ondersteuning][ref9], of

      j. in dat jaar al dan niet aaneengesloten 26 weken of meer op grond van een indicatiebesluit was
      aangewezen op één of meer etmalen per week zorg als bedoeld in de [artikelen 9, eerste lid][ref10], of
      [13, eerste en tweede lid, van het Besluit zorgaanspraken AWBZ][ref11].

      2 De tegemoetkoming, bedoeld in [artikel 2, eerste lid, van de wet][ref12] bedraagt € 510 indien de rechthebbende
      in het kalenderjaar waarop de tegemoetkoming betrekking heeft, jonger was dan 65 jaar of 65 jaar is geworden,
      onderscheidenlijk € 357 indien de rechthebbende in het gehele jaar 65 jaar of ouder was, de rechthebbende niet is
      overleden in het kalenderjaar waarop de tegemoetkoming betrekking heeft, en de rechthebbende in dat jaar:

      a. een of meer ATC’s of in het jaar voorafgaande aan dat jaar een of meer DBC’s vergoed kreeg die behoren tot:

      1°. één of meer bij ministeriële regeling aangewezen chronische groepen die recht geven op een hoge tegemoetkoming,
      of

      2°. twee of meer bij ministeriële regeling aangewezen chronische groepen die recht geven op een lage
      tegemoetkoming;

      b. al dan niet aaneengesloten 26 weken of meer op grond van een indicatiebesluit was aangewezen
      op tien of meer uren per week zorg als bedoeld in [artikelen 4][ref13], [5][ref14] en
      [6 van het Besluit zorgaanspraken AWBZ][ref15], met dien verstande dat:

      1°. een indicatie voor een functie voor één dagdeel geldt als een indicatie voor 2,5 uren zorg per week;

      2°. het gemiddelde aantal uren waarvoor een functie is geïndiceerd, geldt als het aantal uren zorg per week voor
      die functie, en

      3°. in geval van een indicatie voor twee of meer functies het totaalaantal uren zorg per week wordt berekend door
      het aantal uren zorg per functie per week op te tellen;

      c. al dan niet aaneengesloten 26 weken of meer gedurende tien of meer uren per week in natura huishoudelijke
      verzorging als bedoeld in [artikel 1, eerste lid, onderdeel h, van de Wet maatschappelijke ondersteuning][ref16]
      heeft ontvangen of daartoe op grond van een indicatiebesluit was aangewezen en een persoonsgebonden budget heeft
      ontvangen, met dien verstande dat voor het vaststellen van de periode van 26 weken wordt aangesloten bij de
      indeling in weken als bedoeld in [artikel 4.1, derde lid, van het Besluit maatschappelijke ondersteuning][ref17],
      of

      d. viel onder twee of meer van de categorieën, genoemd in het eerste lid, met uitzondering van een combinatie van:

      1°. de categorieën, genoemd in het eerste lid, onderdelen a en b;

      2°. de categorieën, genoemd in het eerste lid, onderdelen a en c;

      3°. de categorieën, genoemd in het eerste lid, onderdelen a, b en c;

      4°. de categorieën, genoemd in het eerste lid, onderdelen b en c;

      5°. de categorieën, genoemd in het eerste lid, onderdelen b en g;

      6°. de categorieën, genoemd in het eerste lid, onderdelen c en g;

      7°. de categorieën, genoemd in het eerste lid, onderdelen b, c en g;

      8°. de categorieën, genoemd in de onderdelen h en i.

      3 Voor de toepassing van het eerste lid, onderdelen h en j, en het tweede lid, onderdelen b
      en c, is voor militairen het aantal uren, dagdelen of etmalen waarvoor zorg als bedoeld in de
      [Algemene Wet Bijzondere Ziektekosten][ref18] is gebruikt, bepalend voor het toekennen van de tegemoetkoming,
      bedoeld in [artikel 2, eerste lid, van de wet][ref19].

      4 Het gemiddelde, bedoeld in het eerste lid, onderdeel h, en het tweede lid, onderdeel b, wordt bepaald door op een
      decimaal achter de komma naar boven af te ronden.

      5 Een rechthebbende op wie het tweede lid, onderdeel a, onder 2°, of onderdeel d, van toepassing is, heeft slechts
      recht op een tegemoetkoming als bedoeld in de aanhef van dat lid.

      6 Een rechthebbende op wie het eerste lid, onderdeel j, van toepassing is, heeft in afwijking van het tweede lid,
      slechts recht op een tegemoetkoming als bedoeld in de aanhef van het eerste lid.

      7 Het eerste lid, onderdelen h en j, het tweede lid, onderdelen b en d, en het zesde lid, zijn
      van overeenkomstige toepassing op de indicatiebesluiten afgegeven door de stichting bedoeld in
      [artikel 9b, vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref20] die met ingang van 1 januari 2010 zijn
      afgegeven dan wel op die datum geldig zijn.


