  - number: '2'
    text: |-
      1 De tegemoetkoming, bedoeld in [artikel 2, eerste lid, van de wet][ref1], bedraagt € 290 indien de rechthebbende
      in het kalenderjaar waarop de tegemoetkoming betrekking heeft, de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], nog niet heeft bereikt of pensioengerechtigd
      is geworden, onderscheidenlijk € 145 indien de rechthebbende in het gehele jaar pensioengerechtigde was, de
      rechthebbende niet is overleden in het kalenderjaar waarop de tegemoetkoming betrekking heeft, en:

      a. één of meer tot een bij ministeriële regeling aangewezen chronische groep, die recht geeft op een lage
      tegemoetkoming, behorende

      1° ATC’s anders dan als add-on duur of weesgeneesmiddel in dat jaar vergoed kreeg, of

      2° ATC’s als add-on duur of weesgeneesmiddel in het jaar voorafgaande aan dat jaar vergoed kreeg, of

      3° DBC’s in het jaar voorafgaande aan dat jaar vergoed kreeg;

      b. één of meer tot twee of meer bij ministeriële regeling aangewezen chronische groepen, die afzonderlijk geen
      recht geven op een tegemoetkoming, behorende

      1° ATC’s anders dan als add-on duur of weesgeneesmiddel in dat jaar vergoed kreeg, of

      2° ATC’s als add-on duur of weesgeneesmiddel in het jaar voorafgaande aan dat jaar vergoed kreeg, of

      3° DBC’s in het jaar voorafgaande aan dat jaar vergoed kreeg;

      c. voor rekening van zijn zorgverzekeraar een bij ministeriële regeling aangewezen hulpmiddel in een bij die
      regeling te bepalen periode heeft verkregen of heeft laten repareren en een tot een bij ministeriële regeling
      aangewezen chronische groep, die geen recht geeft op een tegemoetkoming, behorende

      1° ATC anders dan als add-on duur of weesgeneesmiddel in dat jaar vergoed kreeg, of

      2° ATC als add-on duur of weesgeneesmiddel in het jaar voorafgaande aan dat jaar vergoed kreeg, of

      3° DBC in het jaar voorafgaande aan dat jaar vergoed kreeg;

      d. op 31 december van dat jaar heeft beschikt over een indicatie voor het gedurende dat jaar gebruiken van een
      rolstoel op grond van [artikel 4, eerste lid, onderdeel b, van de Wet maatschappelijke ondersteuning][ref3];

      e. in het jaar voorafgaande aan dat jaar van zijn zorgverzekeraar geneeskundige zorg gericht op revalidatie in een
      bij ministeriële regeling aangewezen instelling, vergoed heeft gekregen;

      f. in dat jaar:

      1°. van zijn zorgverzekeraar ten minste een bij ministeriële regeling te bepalen bedrag, gelijk aan
      het gemiddelde bedrag aan kosten voor 96 behandelingen fysiotherapie of oefentherapie als bedoeld in
      [artikel 2.6, tweede lid, van het Besluit zorgverzekering][ref4], vergoed heeft gekregen;

      2°. jonger was dan 18 jaar en in dat jaar en het daaraan voorafgaande jaar van zijn zorgverzekeraar ten minste
      een bij ministeriële regeling te bepalen bedrag, gelijk aan het gemiddelde bedrag van de kosten voor een bij die
      regeling te bepalen aantal behandelingen fysiotherapie of oefentherapie vergoed heeft gekregen, of

      3°. militair was en in dat jaar en het daaraan voorafgaande jaar van de rechtspersoon, bedoeld in
      [artikel 90a, eerste lid, van het Algemeen militair ambtenarenreglement][ref5], ten minste een bij ministeriële
      regeling te bepalen bedrag, gelijk aan het gemiddelde bedrag aan kosten voor een bij die regeling te bepalen aantal
      behandelingen fysiotherapie of oefentherapie, vergoed heeft gekregen;

      g. in dat jaar of een daaraan voorafgaand kalenderjaar doch na 31 december 2011 van zijn zorgverzekeraar een bij
      ministeriële regeling aangewezen hulpmiddel bij een blijvende aandoening vergoed heeft gekregen;

      h. in dat jaar al dan niet aaneengesloten 26 weken of meer op grond van een indicatiebesluit was
      aangewezen op één tot tien uren per week zorg als bedoeld in [artikelen 4][ref6], [5][ref7] en
      [6 van het Besluit zorgaanspraken AWBZ][ref8], met dien verstande dat:

      1°. een indicatie voor een functie voor één dagdeel geldt als een indicatie voor 2,5 uren zorg per week;

      2°. het gemiddelde aantal uren waarvoor een functie is geïndiceerd, geldt als het aantal uren zorg per week voor
      die functie, en

      3°. in geval van een indicatie voor twee of meer functies het totaalaantal uren zorg per week wordt berekend door
      het aantal uren zorg per functie per week op te tellen;

      i. in dat jaar al dan niet aaneengesloten 26 weken of meer gedurende één
      tot tien uren per week in natura huishoudelijke verzorging als bedoeld in
      [artikel 1, eerste lid, onderdeel h, van de Wet maatschappelijke ondersteuning][ref9] heeft ontvangen of daartoe
      op grond van een indicatiebesluit was aangewezen en een persoonsgebonden budget heeft ontvangen, met dien verstande
      dat voor het vaststellen van de periode van 26 weken wordt aangesloten bij de indeling in weken als bedoeld in
      [artikel 4.1, derde lid, van het Besluit maatschappelijke ondersteuning][ref10], of

      j. in dat jaar al dan niet aaneengesloten 26 weken of meer op grond van een indicatiebesluit was aangewezen op
      één of meer etmalen per week zorg als bedoeld in de [artikelen 9, eerste lid][ref11], [9a, eerste lid][ref12], of
      [13, eerste en tweede lid, van het Besluit zorgaanspraken AWBZ][ref13].

      2 De tegemoetkoming, bedoeld in [artikel 2, eerste lid, van de wet][ref14] bedraagt € 484 indien de rechthebbende
      in het kalenderjaar waarop de tegemoetkoming betrekking heeft, de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref15], nog niet heeft bereikt of pensioengerechtigd
      is geworden, onderscheidenlijk € 339 indien de rechthebbende in het gehele jaar pensioengerechtigde was, de
      rechthebbende niet is overleden in het kalenderjaar waarop de tegemoetkoming betrekking heeft, en de rechthebbende
      in dat jaar:

      a. één of meer tot één of meer bij ministeriële regeling aangewezen chronische groepen die recht geven op een hoge
      tegemoetkoming of tot twee of meer bij ministeriële regeling aangewezen chronische groepen, die recht geven op een
      lage tegemoetkoming, behorende

      1° ATC’s anders dan als add-on duur of weesgeneesmiddel in dat jaar vergoed kreeg, of

      2° ATC’s als add-on duur of weesgeneesmiddel in het jaar voorafgaande aan dat jaar vergoed kreeg, of

      3° DBC’s in het jaar voorafgaande aan dat jaar vergoed kreeg;

      b. al dan niet aaneengesloten 26 weken of meer op grond van een indicatiebesluit was aangewezen
      op tien of meer uren per week zorg als bedoeld in [artikelen 4][ref16], [5][ref17] en
      [6 van het Besluit zorgaanspraken AWBZ][ref18], met dien verstande dat:

      1°. een indicatie voor een functie voor één dagdeel geldt als een indicatie voor 2,5 uren zorg per week;

      2°. het gemiddelde aantal uren waarvoor een functie is geïndiceerd, geldt als het aantal uren zorg per week voor
      die functie, en

      3°. in geval van een indicatie voor twee of meer functies het totaalaantal uren zorg per week wordt berekend door
      het aantal uren zorg per functie per week op te tellen;

      c. al dan niet aaneengesloten 26 weken of meer gedurende tien of meer uren per week in natura huishoudelijke
      verzorging als bedoeld in [artikel 1, eerste lid, onderdeel h, van de Wet maatschappelijke ondersteuning][ref19]
      heeft ontvangen of daartoe op grond van een indicatiebesluit was aangewezen en een persoonsgebonden budget heeft
      ontvangen, met dien verstande dat voor het vaststellen van de periode van 26 weken wordt aangesloten bij de
      indeling in weken als bedoeld in [artikel 4.1, derde lid, van het Besluit maatschappelijke ondersteuning][ref20],
      of

      d. viel onder twee of meer van de categorieën, genoemd in het eerste lid, met uitzondering van een combinatie van:

      1°. de categorieën, genoemd in het eerste lid, onderdelen a en b;

      2°. de categorieën, genoemd in het eerste lid, onderdelen a en c;

      3°. de categorieën, genoemd in het eerste lid, onderdelen a, b en c;

      4°. de categorieën, genoemd in het eerste lid, onderdelen b en c;

      5°. de categorieën, genoemd in het eerste lid, onderdelen b en g;

      6°. de categorieën, genoemd in het eerste lid, onderdelen c en g;

      7°. de categorieën, genoemd in het eerste lid, onderdelen b, c en g;

      8°. de categorieën, genoemd in de onderdelen h en i.

      3 Voor de toepassing van het eerste lid, onderdelen h en j, en het tweede lid, onderdelen b
      en c, is voor militairen het aantal uren, dagdelen of etmalen waarvoor zorg als bedoeld in de
      [Algemene Wet Bijzondere Ziektekosten][ref21] is gebruikt, bepalend voor het toekennen van de tegemoetkoming,
      bedoeld in [artikel 2, eerste lid, van de wet][ref22].

      4 Het gemiddelde, bedoeld in het eerste lid, onderdeel h, en het tweede lid, onderdeel b, wordt bepaald door op een
      decimaal achter de komma naar boven af te ronden.

      5 Een rechthebbende op wie het tweede lid, onderdeel a of onderdeel d, van toepassing is, heeft slechts recht op
      een tegemoetkoming als bedoeld in de aanhef van dat lid.

      6 Een rechthebbende op wie het eerste lid, onderdeel j, van toepassing is, heeft in afwijking van het tweede lid,
      slechts recht op een tegemoetkoming als bedoeld in de aanhef van het eerste lid.

      7 Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt gelijkgesteld:

      a. met een bij ministeriële regeling krachtens het eerste lid, onderdeel e, aangewezen instelling, een buiten
      Nederland gevestigde, door een daartoe bevoegde autoriteit in een andere lidstaat van de Europese Unie voor
      revalidatiezorg aangewezen instelling;

      b. met een DBC een daarmee naar aard en strekking overeenkomende combinatie van prestaties als bedoeld in
      [artikel 1, onderdeel j, van de Wet marktordening gezondheidszorg][ref23], verricht in een andere lidstaat van de
      Europese Unie, en

      c. met een lidstaat van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte.


