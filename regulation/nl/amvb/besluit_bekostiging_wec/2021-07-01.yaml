      1 [Hoofdstuk III][ref1] is behoudens het gestelde in het tweede lid niet van toepassing op instellingen.

      2 Het Rijk verstrekt elke maand van het uitkeringsjaar in verband met de materiële voorzieningen ten behoeve van
      de instandhouding aan het bevoegd gezag van een instelling, een twaalfde gedeelte van de vergoeding, bedoeld in
      [artikel 128, negende lid][ref2], van de wet, waarop het over dat jaar recht heeft.


