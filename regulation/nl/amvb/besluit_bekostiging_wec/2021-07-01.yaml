  - number: '4'
    text: |-
      Het bevoegd gezag geeft binnen twee weken na beslissing tot opheffing van de school of een nevenvestiging van
      een instelling kennis daarvan aan Onze Minister, gedeputeerde staten, de inspecteur en, indien het een bijzondere
      school of een nevenvestiging van een bijzondere instelling betreft, eveneens aan burgemeester en wethouders van de
      gemeente waarin de school onderscheidenlijk de nevenvestiging van de instelling is gelegen.
    url: https://wetten.overheid.nl/BWBR0004259/2021-07-01#Artikel4
  - number: '5'
    text: |-
      1 De directeur van een school draagt er zorg voor dat een overzichtelijke administratie van de gegevens van de
      leerlingen met inbegrip van het gemeenschappelijk rapport, bedoeld in [artikel 41, zesde lid, van de wet][ref1],
      en van hun ouders, alsmede van de inschrijving, de uitschrijving en het verzuim van de leerlingen op de school
      aanwezig is. In deze administratie wordt een onderverdeling gemaakt naar:

      a. leerlingen van de hoofdvestiging,

      b. leerlingen van elk van de nevenvestigingen, en

      c. leerlingen die zijn toegelaten op basis van de bekostiging, bedoeld in
      [artikel 117, zesde en zevende lid, van de wet][ref2].

      De directeur draagt er zorg voor dat de volledige administratie op de hoofdvestiging aanwezig is.

      2 Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de wijze waarop de leerlingenadministratie
      wordt ingericht.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0004259/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '117'
  - number: '6'
    text: |-
      1 De directeur van een school schrijft een leerling slechts in na een beslissing van het bevoegd gezag
      tot toelating van de leerling, of indien de leerling tijdelijk op de school wordt geplaatst op grond van
      [artikel 40, achtste lid, van de wet][ref1].

      2 De directeur schrijft de leerling in met ingang van de dag waarop de leerling de school voor het eerst bezoekt.

      3 In afwijking van het tweede lid, schrijft de directeur een leerling die de school voor het eerst bezoekt op de
      eerste schooldag van het schooljaar, in met ingang van 1 augustus van dat schooljaar, behoudens wanneer de leerling
      op 1 augustus de leeftijd van 4 jaar nog niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0004259/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
  - number: '7'
    text: |-
      1 De directeur van een school op wiens school de leerling staat ingeschreven, schrijft de leerling, indien deze de
      school verlaat, uit met ingang van de dag waarop de leerling de school voor het laatst heeft bezocht. De directeur
      schrijft de leerling die wordt uitgeschreven na de school op de laatste schooldag van het schooljaar te hebben
      bezocht, uit met ingang van 31 juli van dat schooljaar.

      2 Indien de directeur van een school op wiens school de leerling staat ingeschreven binnen 4 weken na de dag
      waarop de leerling de school voor het laatst heeft bezocht uit het register onderwijsdeelnemers, bedoeld in de
      [Wet register onderwijsdeelnemers][ref1], een melding ontvangt van de inschrijving van de leerling op een andere
      school of een school voor ander onderwijs, wijzigt de directeur de datum van uitschrijving, bedoeld in het eerste
      lid, alsnog in de datum van de dag voorafgaande aan de inschrijving op die andere school of die school voor ander
      onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0042012
    url: https://wetten.overheid.nl/BWBR0004259/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0042012
  - number: '8'
    text: |-
      1 Onverminderd het bepaalde in artikel [artikel 41, negende lid, van de wet][ref1], blijven de gegevens die
      in de leerlingenadministratie zijn opgenomen daarvan in ieder geval deel uitmaken gedurende 5 jaar nadat de
      desbetreffende leerling van de school is uitgeschreven.

      2 Het gemeenschappelijk rapport, bedoeld in [artikel 41, zesde lid, van de wet][ref2] alsmede de gegevens die van
      belang zijn voor de berekening van de bekostiging voor personeelskosten worden in elk geval binnen acht weken na
      het verstrijken van de termijn, bedoeld in het eerste lid, vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel41
