    text: |-
      1 Het samenwerkingsverband, bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1] en
      [artikel 1 van de Wet op het voortgezet onderwijs][ref2] is gehouden om, wanneer een bevoegd gezag
      of een personeelsorganisatie daarom verzoekt, met dat bevoegd gezag en de personeelsorganisaties een
      op overeenstemming gericht overleg te voeren over het personeel dat in het derde schooljaar waarin
      [artikel 70a van de Wet op het primair onderwijs][ref3] is vervallen, nog niet zal zijn herplaatst en dat niet als
      gevolg van natuurlijk verloop zal zijn uitgestroomd op of voor 1 augustus 2016.

      2 Een bevoegd gezag als bedoeld in het eerste lid is het bevoegd gezag van een school als bedoeld in de
      [Wet op de expertisecentra][ref4] of een centrale dienst, waar het personeel in het schooljaar 2014–2015 in dienst
      is.

      3 Het personeel, bedoeld in het eerste lid, is het personeel dat op 1 mei 2012 als ambulant begeleider in dienst
      was bij een school niet zijnde een instelling als bedoeld in de [wet][ref5], een regionaal expertisecentrum als
      bedoeld in de wet of een centrale dienst.

      4 Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van personeel, niet zijnde ambulant
      begeleiders, dat op 1 mei 2012 is dienst was bij een samenwerkingsverband, een centrale dienst of een regionaal
      expertisecentrum en dat in het eerste schooljaar waarin [artikel 70a van de Wet op het primair onderwijs][ref6] is
      vervallen, niet kan worden herplaatst.

      5 Dit artikel is van overeenkomstige toepassing op de rechtspersoon, bedoeld in [artikel 170 van de wet][ref7]
      voor zover het personeel, bedoeld in het derde of vierde lid, betreft dat in verband met de opheffing van regionale
      expertisecentra en de beëindiging van de ondersteuningswerkzaamheden bij de samenwerkingsverbanden zoals die
      bestonden voor 1 augustus 2013, een werkloosheidsuitkering ontvangt.


