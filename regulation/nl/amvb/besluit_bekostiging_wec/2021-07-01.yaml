  - number: 12a
    text: |-
      1 Onze Minister stelt jaarlijks voor 1 februari de bekostiging voor dat jaar voor de scholen vast, gebaseerd
      op de grondslag, bedoeld in [artikel 128, vierde lid, van de wet][ref1], met dien verstande dat Onze Minister
      voor het bepalen van het aantal leerlingen op 1 oktober van het jaar voorafgaande aan het bekostigingsjaar,
      de leerlingen in aanmerking neemt van wie het persoonsgebonden nummer tezamen met de basisgegevens, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet register onderwijsdeelnemers][ref2] uiterlijk op de daarop volgende
      1 december zijn opgenomen in het register onderwijsdeelnemers overeenkomstig [artikel 14 van die wet][ref3].

      2 Indien de verklaring van de accountant, bedoeld in [artikel 157, vierde lid, van de wet][ref4] aanleiding geeft
      tot wijziging van de bekostiging, bedoeld in het eerste lid, stelt Onze Minister voor 1 oktober de bekostiging voor
      dat jaar nader vast.

      3 Het Rijk verstrekt elke maand van het bekostigingsjaar in verband met de materiële voorzieningen ten behoeve van
      de instandhouding aan het bevoegd gezag een twaalfde gedeelte van de bekostiging, bedoeld in het eerste lid, waarop
      het over dat jaar recht heeft.


