    text: |-
      1 Het Rijk verstrekt elke maand van het uitkeringsjaar in verband met de materiële voorzieningen ten behoeve
      van de instandhouding aan het bevoegd gezag van een school een twaalfde gedeelte van de vergoeding, bedoeld in
      [artikel 128, eerste lid, van de wet][ref1], waarop het over dat jaar recht heeft.

      2 Indien blijkt dat voor het uitkeringsjaar [artikel 128, zesde lid, van de wet][ref2] van
      toepassing is, wordt het verschil tussen de vergoeding, bedoeld in het eerste lid, berekend
      op grond van [artikel 128, zesde lid, van de wet][ref3] en de vergoeding berekend op grond van
      [artikel 128, vierde lid, van de wet][ref4], verstrekt in de maanden mei tot en met december van het
      uitkeringsjaar.

      3 Indien [artikel 12a, derde lid][ref5], van toepassing is, vindt verrekening plaats van de vergoeding voor dat
      jaar met de vergoeding die wordt verstrekt in de maanden oktober tot en met december van het uitkeringsjaar.


