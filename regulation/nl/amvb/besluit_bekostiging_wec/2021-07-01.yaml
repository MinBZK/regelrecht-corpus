      1 Voor de aanvullende bekostiging voor de schoolleiding, bedoeld in [artikel 117, vierde lid, van de wet][ref1] van
      scholen, niet zijnde instellingen, wordt een bedrag toegekend.

      2 De aanvullende bekostiging voor de schoolleiding, bedoeld in [artikel 117, vierde lid, van de wet][ref2] bedraagt
      voor een school voor speciaal onderwijs, een school voor voortgezet speciaal onderwijs of een school voor speciaal
      en voortgezet speciaal onderwijs, niet zijnde een school voor meervoudig gehandicapte kinderen, met een aantal
      leerlingen op de teldatum dat niet hoger is dan 49 respectievelijk hoger is dan 49 een bij ministeriële regeling
      vast te stellen bedrag.

      3 De aanvullende bekostiging voor de schoolleiding, bedoeld in [artikel 117, vierde lid, van de wet][ref3] bedraagt
      voor een school voor speciaal en voortgezet speciaal onderwijs, niet zijnde een school voor meervoudig gehandicapte
      kinderen, met een aantal leerlingen op de teldatum dat niet hoger is dan 49 respectievelijk hoger is dan 49 een bij
      ministeriële regeling vast te stellen bedrag.

      4 De aanvullende bekostiging voor de schoolleiding, bedoeld in [artikel 117, vierde lid, van de wet][ref4]
      bedraagt voor een school voor speciaal onderwijs of een school voor voortgezet speciaal onderwijs voor meervoudig
      gehandicapte kinderen een bij ministeriële regeling vast te stellen bedrag.

      5 De aanvullende bekostiging voor de schoolleiding, bedoeld in [artikel 117, vierde lid, van de wet][ref5] bedraagt
      voor een school voor speciaal en voortgezet speciaal onderwijs voor meervoudig gehandicapte kinderen, met een
      aantal leerlingen op de teldatum dat niet hoger is dan 49 respectievelijk hoger is dan 49 een bij ministeriële
      regeling vast te stellen bedrag.


