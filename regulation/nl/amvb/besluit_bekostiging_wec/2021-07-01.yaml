    text: |-
      Onze Minister verstrekt volgens bij ministeriële regeling te stellen regels per boekjaar subsidie aan de
      rechtspersoon, bedoeld in [artikel 170b, eerste lid, van de wet][ref1], voor het geven van godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel170b
    url: https://wetten.overheid.nl/BWBR0004259/2021-07-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 170b
  - number: 42b
    text: |-
      1 Het subsidiebedrag dat wordt verstrekt aan de rechtspersoon, bedoeld in
      [artikel 170b, eerste lid, van de wet][ref1], bestaat uit een bedrag dat is bestemd voor personeelskosten voor
      de leraren die het godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs verzorgen, en een bedrag dat is
      bestemd voor overige kosten.

      2 Het bedrag dat is bestemd voor personeelskosten kan met maximaal twee procent per jaar stijgen ten opzichte van
      het meest recent vastgestelde subsidiebedrag dat is bestemd voor personeelskosten.

      3 Het tweede lid vervalt met ingang van 31 december 2025.

      4 Voor het berekenen van de hoogte van het subsidiebedrag wordt uitgegaan van ten hoogste veertig uren per
      schooljaar door leerlingen te ontvangen godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs.

      5 Bij het besluit tot verlening van de subsidie verleent Onze Minister voorschotten. Onze Minister stelt bij
      beschikking het betaalritme vast.

      6 Het bedrag dat ten hoogste wordt verstrekt aan de rechtspersoon, bedoeld in
      [artikel 170b, eerste lid, van de wet][ref2], is het bedrag dat op de begroting van het Ministerie van
      Onderwijs, Cultuur en Wetenschap beschikbaar is voor het geven van godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel170b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel170b
    url: https://wetten.overheid.nl/BWBR0004259/2021-07-01#Artikel42b
