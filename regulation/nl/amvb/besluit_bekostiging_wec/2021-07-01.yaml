        artikel: 170b
  - number: 42c
    text: |-
      Voor het bepalen van de hoogte van het subsidiebedrag kunnen bij ministeriële regeling regels worden gesteld over:

      a. de minimale omvang van de groepsgrootte per stroming binnen het godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs; en

      b. het maximale aantal schooljaren per school waarin godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs
      wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0004259/2021-07-01#Artikel42c
  - number: 42d
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1], kan de subsidie in ieder geval worden
      geweigerd indien:

      a. het godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs niet wordt gegeven door leraren als bedoeld in
      [artikel 54 van de wet][ref2], of

      b. het godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs wordt gegeven in strijd met
      [artikel 11, vierde lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel435
