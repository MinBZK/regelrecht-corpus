  - number: '10'
    text: |-
      1 Met het oog op de vaststelling van de bekostiging, bedoeld in de [artikelen 12a, eerste lid][ref1], en
      [29, eerste lid][ref2], doet Onze Minister aan het bevoegd gezag jaarlijks een overzicht toekomen van de hem ter
      beschikking staande gegevens over het aantal leerlingen op de teldatum dat bij de vaststelling van de bekostiging
      in aanmerking wordt genomen. Het overzicht wordt gelijktijdig met het besluit tot vaststelling van de bekostiging,
      bedoeld in artikel 12a, eerste lid, toegezonden.

      2 Het overzicht, bedoeld in het eerste lid, is onderverdeeld in leerlingen met een niet-Nederlandse culturele
      achtergrond en overige leerlingen.

      3 Indien de school een nevenvestiging heeft, is het overzicht, bedoeld in het eerste lid, tevens onderverdeeld in
      de leerlingen van de hoofdvestiging en de leerlingen van elk van de nevenvestigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel29
