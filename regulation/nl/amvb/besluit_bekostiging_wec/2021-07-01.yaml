preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen van 27 oktober 1987, nr. 9727/2363,
    centrale directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 19a en 59 van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs
    (Stb. 1987, 614) en de artikelen E 23 en E 24 van de Overgangswet ISOVSO ( Stb. 1987, 615);

    Gehoord de Onderwijsraad (advies van 15 oktober 1987, nr. 1/1431);

    De Raad van State gehoord (advies van 17 december 1987, nr. W05.87.0581);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen van 22 december 1987, nr.
    10080/2363, centrale directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004259/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;

      wet: [Wet op de expertisecentra][ref1];

      school: een school voor speciaal onderwijs, voor voortgezet speciaal onderwijs of voor speciaal en voortgezet
      speciaal onderwijs als bedoeld in [artikel 2, tweede lid, onder f, h, j, k, m of n, van de wet][ref2],
      dan wel een instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in
      [artikel 8, eerste lid, tweede of derde volzin, van de wet][ref3], tenzij het tegendeel blijkt;

      afdeling: afdeling als bedoeld in [artikel 8, tweede lid, van de wet][ref4];

      instelling: instelling als bedoeld in [artikel 8, eerste lid, tweede of derde volzin, van de wet][ref5], tenzij het
      tegendeel blijkt;

      nevenvestiging: een nevenvestiging als bedoeld in de [artikelen 76a][ref6] en
      [76b van de wet][ref7] dan wel een nevenvestiging van een instelling, genoemd in
      __REF002___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _ (*Stb.* 1995, 319);

      openbare school: door een of meer gemeenten, al dan niet te zamen met een of meer privaatrechtelijke rechtspersonen
      met volledige rechtsbevoegdheid, in stand gehouden school;

      bijzondere school: door een privaatrechtelijke rechtspersoon in stand gehouden school;

      bevoegd gezag van volgens de wet bekostigde scholen: voor wat betreft:

      a. een openbare school: het college van burgemeester en wethouders voor zover de raad niet anders bepaalt, en,
      indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen regelen, dan wel het krachtens een
      gemeenschappelijke regeling bevoegde orgaan;

      b. een bijzondere school: de rechtspersoon bedoeld in [artikel 57 van de wet][ref9];

      inspecteur: lid van de inspectie voor zover belast met taken op het gebied van het speciaal onderwijs en voortgezet
      speciaal onderwijs;

      ouders: ouders, voogden of verzorgers;

      teldatum: een van de data, bedoeld in [artikel 118 van de wet][ref10];

      commissie: de commissie, bedoeld in [artikel 41, tweede lid, van de wet][ref11];

      leerling: 'tenzij anders is bepaald een leerling:'

      a. die door een samenwerkingsverband als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref12] of
      [artikel 1 van de Wet op het voortgezet onderwijs][ref13] toelaatbaar is verklaard tot het speciaal onderwijs
      respectievelijk het voortgezet speciaal onderwijs,

      b. van een inrichting, accommodatie of residentiële instelling als bedoeld in [artikel 71c van de wet][ref14]
      waarmee het bevoegd gezag een overeenkomst als bedoeld in genoemd artikel van de wet heeft gesloten;

      leerling met een niet-Nederlandse culturele achtergrond: leerling:

      a. die behoort tot de Molukse bevolkingsgroep;

      b. van wie ten minste een van de ouders of voogden afkomstig is uit Griekenland, Italië, het voormalige
      Joegoslavië, Kaapverdië, Marokko, Portugal, Spanje, Tunesië of Turkije;

      c. van wie ten minste een van de ouders of voogden afkomstig is uit Suriname of een van de Caribische delen van
      het Koninkrijk;

      d. van wie ten minste een van de ouders of voogden als vreemdeling rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onder c of d, van de Vreemdelingenwet 2000][ref15];

      e. van wie ten minste een van de ouders of voogden afkomstig is uit een ander niet-Engelstalig land buiten Europa,
      echter met uitzondering van Indonesië.

      schooljaar: het tijdvak van 1 augustus tot en met 31 juli daaraanvolgend;

      lokaal voor motorische therapie: ruimte van 120 m2 of minder die is bedoeld voor onderwijs in lichamelijke oefening
      aan leerlingen van 6 jaar en ouder;

      schoolbad: een bad voor watergewenning of bewegingstherapie;

      accountant: een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref16];

      formatiebasisbedrag: het formatiebasisbedrag, bedoeld in [artikel 31, eerste lid, onderdeel a][ref17];

      formatieleeftijdsbedrag: het formatieleeftijdsbedrag, bedoeld in [artikel 31, eerste lid, onderdeel b][ref18];

      basisbedrag: het basisbedrag, bedoeld in [artikel 31, eerste lid, onderdeel c][ref19];

      leeftijdsbedrag: het leeftijdsbedrag, bedoeld in [artikel 31, eerste lid, onderdeel d][ref20].


