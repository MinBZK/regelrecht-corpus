      1 Onze Minister stelt jaarlijks uiterlijk op 15 april, de bekostigingsbedragen, bedoeld in
      [artikel 131, eerste en derde lid, van de wet][ref1] vast voor zover deze bedragen mede gebaseerd zijn op het
      aantal leerlingen op de teldatum, met dien verstande dat Onze Minister voor het bepalen van het aantal leerlingen
      op de teldatum, de leerlingen in aanmerking neemt van wie het persoonsgebonden nummer tezamen met de basisgegevens,
      bedoeld in [artikel 8, eerste lid, onderdeel b, van de Wet register onderwijsdeelnemers][ref2] uiterlijk op
      1 december van het jaar voorafgaande aan het bekostigingsjaar zijn opgenomen in het register onderwijsdeelnemers
      overeenkomstig [artikel 14 van die wet][ref3]. De bedragen hebben betrekking op een schooljaar.

      2 Onze Minister stelt de bekostigingsbedragen, bedoeld in [artikel 131, eerste lid, van de wet][ref4] voorzover het
      betreft de bekostiging, bedoeld in [artikel 38][ref5], vast binnen 8 weken na ontvangst van de gegevens ten behoeve
      van de berekening van deze bekostiging.

      3 Indien de verklaring van de accountant, bedoeld in [artikel 157, vierde lid, van de wet][ref6] aanleiding geeft
      tot wijziging van de bekostiging, bedoeld in het eerste of tweede lid, stelt Onze Minister voor 1 oktober de
      bekostiging voor dat jaar nader vast.

      4 De in het eerste en tweede lid bedoelde bekostigingsbedragen kunnen door Onze Minister worden gewijzigd wegens
      algemene salarismaatregelen of wegens andere al dan niet uit de rijksbegroting voortvloeiende maatregelen.


