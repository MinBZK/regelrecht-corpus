        artikel: '41'
  - number: '9'
    text: |-
      1 Voor de toepassing van het bepaalde in de wet worden, onverminderd het bepaalde in [artikel 7][ref1], de
      leerlingen op een school meegeteld die toelaatbaar zijn verklaard tot een van de onderwijssoorten die door de
      school worden verzorgd dan wel tot het cluster, bedoeld in [artikel 2, vierde lid onder d, van de wet][ref2],
      waartoe de school behoort en die op een teldatum op die school staan ingeschreven, tenzij zij vanaf het begin van
      het schooljaar tot de teldatum meer dan de helft van het aantal schooldagen zonder geldige reden hebben verzuimd.

      2 Voor de toepassing van het eerste lid wordt ten aanzien van de leerplichtige leerling als geldige reden
      aangemerkt een vrijstelling van geregeld schoolbezoek als bedoeld in de [Leerplichtwet 1969][ref3] (*Stb.* 1971,
      406). Ten aanzien van de niet-leerplichtige leerling worden als geldige reden aangemerkt dezelfde gronden als die
      welke leiden tot een vrijstelling als bedoeld in de vorige volzin.

      3 Indien een teldatum valt op een dag waarop geen onderwijs wordt gegeven, worden op de eerstvolgende schooldag de
      leerlingen geteld, die op de teldatum stonden ingeschreven.

      4 Een leerling kan slechts op 1 school voor de bekostiging meetellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
