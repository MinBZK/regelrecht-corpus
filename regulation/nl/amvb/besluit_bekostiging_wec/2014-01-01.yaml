    text: |-
      de totale personeelsbekostiging, bedoeld in [artikel 131 van de wet][ref1] verminderd met de bekostiging, bedoeld
      in [artikel 35][ref2], berekend op grond van het aantal leerlingen op de teldatum, respectievelijk indien het
      tweede lid van toepassing is, op 16 januari van het voorafgaande schooljaar, en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel35
