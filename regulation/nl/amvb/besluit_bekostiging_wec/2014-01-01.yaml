  - number: 38.2.b
    text: |-
      het aantal leerlingen op 16 januari van het voorafgaande schooljaar gelijk is aan of groter is dan de kleinste
      factor N, bedoeld in de tabel in [artikel 14][ref1], die op de school van toepassing is.


