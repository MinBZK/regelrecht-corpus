        hoofdstuk: III
  - number: '38.2'
    text: |-
      Indien in het voorafgaande schooljaar toepassing is gegeven aan [artikel 37][ref1], wordt in afwijking van het
      eerste lid aanvullende bekostiging voor personeelskosten toegekend indien het verschil tussen


