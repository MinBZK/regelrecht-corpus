  - number: '40'
    text: |-
      Indien een leerling, die toelaatbaar is verklaard tot een andere onderwijssoort dan de onderwijssoort die door de
      school wordt verzorgd, bij de school is ingeschreven met toepassing van [artikel 76a van de wet][ref1], wordt met
      betrekking tot die leerling voor de berekening van de bekostiging voor personeelskosten uitgegaan van het bedrag
      per leerling dat behoort bij de onderwijssoort waarvoor die leerling toelaatbaar is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel76a
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 76a
  - number: '41.1'
    text: |-
      Voor de aanvullende bekostiging voor personeelskosten ten behoeve van de bestrijding van onderwijsachterstanden
      voor scholen, niet zijnde instellingen, met een aantal leerlingen met een niet-Nederlandse culturele achtergrond
      op de teldatum boven het aantal van 4, wordt per leerling boven het aantal van 4 een basisbedrag toegekend, welk
      bedrag wordt verhoogd met een leeftijdsbedrag dat wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de
      leraren van de school op 1 oktober van het voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel41
  - number: '41.2'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het eerste lid, en het leeftijdsbedrag, bedoeld in het eerste
      lid, bedraagt de formatie per leerling 0,0385 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel41
  - number: '41.3'
    text: |-
      Voor het schooljaar waarin een nieuwe school wordt geopend, wordt het leeftijdsbedrag vermenigvuldigd met de
      geraamde landelijk gewogen gemiddelde leeftijd van de leraren in het speciaal onderwijs en het voortgezet speciaal
      onderwijs op 1 oktober van het voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel41
  - number: '42'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in
      [artikel 117, elfde lid, onderdeel a en b, van de wet][ref1], bedraagt de formatie per leerling tezamen 0,0546
      formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
  - number: '43.1'
    text: |-
      Onverminderd de bevoegdheid van de Inspectie van het onderwijs op grond van de [Wet op het onderwijstoezicht][ref1]
      kan Onze Minister een onderzoek instellen of doen instellen naar de jaarverslaggeving, naar de gegevens die
      noodzakelijk zijn voor de vaststelling van de bekostiging, naar de rechtmatigheid van de bestedingen en naar de
      doelmatigheid van het beheer van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: '43.2'
    text: |-
      Indien uit een op grond van het eerste lid ingesteld onderzoek blijkt dat de bekostiging voor een school onjuist
      is vastgesteld, kan Onze Minister correcties aanbrengen op de bekostiging. Onze Minister doet het bevoegd gezag
      schriftelijk mededeling van een besluit tot het aanbrengen van een correctie op de bekostiging.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel43
  - number: '43.3'
    text: |-
      Indien uit de jaarverslaggeving, bedoeld in [artikel 157, eerste lid, van de wet][ref1], uit de verklaring
      van de accountant, bedoeld in artikel 157, vierde lid, van de wet of uit een op grond van het eerste lid
      ingesteld onderzoek blijkt dat de bekostiging voor een school onrechtmatig is besteed of ondoelmatig is
      aangewend, kan Onze Minister bepalen dat het desbetreffende gedeelte van de bekostiging niet ten laste komt
      van het Rijk of dat de daarmee gemoeide bedragen in mindering worden gebracht op de bekostiging, onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '157'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '44'
    text: |-
      Een in [artikel 43, tweede lid][ref1], bedoelde correctie wordt, indien de correctie strekt tot verhoging van de
      bekostiging, binnen acht weken na de mededeling, bedoeld in artikel 43, tweede lid, door Onze Minister betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel43
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '43'
        hoofdstuk: VI
  - number: '45.1'
    text: |-
      Voor de toepassing van [artikel 150a van de wet][ref1] wordt onder exploitatieoverschot verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel150a
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 150a
  - number: 45.1.a
    text: |-
      het bedrag van de bekostiging, bedoeld in de [artikelen 120][ref1], [128][ref2] en [131 van de wet][ref3],
      verminderd met de lasten over dat jaar voor zover deze als rechtmatig kunnen worden aangemerkt,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '128'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '131'
  - number: 45.1.b
    text: de reserveringen voor zover afkomstig uit ’s Rijks kas, met inbegrip van de ontvangen rentebaten, en
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel45
  - number: 45.1.c
    text: |-
      voor zover het een niet door een gemeente in stand gehouden school betreft, de niet bestede gedeelten van de
      uitkeringen op grond van de voorschriften inzake de gemeentelijke overschrijding.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel45
  - number: '45.2'
    text: |-
      Het bevoegd gezag meldt het overeenkomstig het eerste lid berekende saldo, verdeeld naar de onderdelen a en b,
      respectievelijk c, van het eerste lid tezamen met het jaarverslag over het laatste jaar waarin de school nog geheel
      of gedeeltelijk voor bekostiging in aanmerking kwam. De opgave gaat vergezeld van een verklaring van een accountant
      omtrent de juistheid van de opgave.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel45
  - number: '45.3'
    text: |-
      Indien het exploitatieoverschot van een niet door een gemeente in stand gehouden school mede is opgebouwd uit
      uitkeringen als bedoeld in het eerste lid, onderdeel c, en geen onderscheid kan worden gemaakt met de baten
      respectievelijk de lasten als bedoeld in het eerste lid onderdelen a en b, geldt als maatstaf voor de verdeling
      van eerstbedoeld deel van het exploitatieoverschot tussen Rijk en de desbetreffende gemeente de verhouding tussen
      het ontvangen bedrag aan bekostiging van het Rijk en het ontvangen bedrag aan uitkeringen, bedoeld in het eerste
      lid, onderdeel c, van de gemeente in een periode van vijf jaren, voorafgaand aan het jaar van de beëindiging van de
      bekostiging. De verdeling behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel45
  - number: 56a.1
    text: |-
      De vergoeding voor een regionaal expertisecentrum bedraagt € 27 200 , vermeerderd met € 9 100  voor elke aan het
      regionaal expertisecentrum deelnemende school en vermeerderd met € 155  voor elke leerling die in de periode van
      12 maanden direct voorafgaand aan 1 oktober van het voorafgaande schooljaar een bevestigende beoordeling van de
      commissie, bedoeld in [artikel 28c, eerste lid, van de wet][ref1], heeft ontvangen, welk aantal leerlingen wordt
      verhoogd met 15%.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28c
  - number: 56a.2
    text: |-
      Het Rijk verstrekt elke maand van het schooljaar een twaalfde gedeelte van de vergoeding, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel56a
  - number: 56a.3
    text: |-
      De bedragen, bedoeld in het eerste lid, worden jaarlijks per 1 augustus, telkens te rekenen met het laatstelijk
      aangepaste bedrag, bij ministeriële regeling aangepast en wel voor 90% van het bedrag aan de ontwikkeling van de
      gemiddelde personeelslasten in het speciaal onderwijs en het voortgezet speciaal onderwijs in het voorafgaande
      kalenderjaar en voor 10% van het bedrag aan de prijsontwikkeling, overeenkomstig de prijsmutatie van de netto
      materiële consumptie, zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal optreden tussen
      het prijsniveau in het jaar voorafgaande aan het jaar waarin het bedrag wordt aangepast, en het jaar waarin het
      bedrag wordt aangepast.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel56a
  - number: 56b.1
    text: |-
      Het regionaal expertisecentrum brengt desgevraagd aan Onze Minister verslag uit over zijn werkzaamheden in het
      voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel56b
  - number: 56b.2
    text: |-
      Het regionaal expertisecentrum legt jaarlijks voor 1 juli over het voorafgaande kalenderjaar
      rekening en verantwoording af van het geldelijk beheer en in voorkomend geval van de besteding
      van formatierekeneenheden, waarbij tevens een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] wordt overgelegd, waaruit blijkt dat de
      vergoeding is besteed in overeenstemming met de bepalingen van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '57'
    text: |-
      Met besluiten als bedoeld in [artikel 23, tweede lid][ref1], worden Onze besluiten inzake de vergoeding, bedoeld in
      [artikel 23][ref2], die zijn genomen voor 1 januari 1989, gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel23
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel57
