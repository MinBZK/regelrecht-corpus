  - number: 58.2.c
    text: een verklaring van een accountant van de juistheid van de gegevens waarop de vergoedingsbedragen worden gebaseerd.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel58
  - number: 58a.1
    text: |-
      Indien Onze Minister van oordeel is dat een bevoegd gezag voor een of meer van zijn scholen als gevolg van
      factoren buiten de invloedssfeer van de school niet in staat is om de leerlinggegevens te leveren op de in
      [artikel 164a van de wet][ref1] bedoelde wijze, kan hij bepalen dat in de periode tot 1 augustus volgend
      op de datum van inwerkingtreding van dit artikel de levering van gegevens over het aantal leerlingen van
      de desbetreffende school of scholen ten behoeve van de vaststelling van de bekostiging, bedoeld in de
      [artikelen 12a, eerste en tweede lid][ref2], [29, eerste lid][ref3] en [37, eerste lid][ref4], plaatsvindt op de in
      het vierde tot en met zevende lid bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel164a
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0004259#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0004259#Artikel37
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 164a
      - id: ref2
        bwb_id: BWBR0004259
        artikel: 12a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004259
        artikel: '29'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0004259
        artikel: '37'
        hoofdstuk: V
  - number: 58a.2
    text: |-
      De verplichting van het bevoegd gezag tot levering van de gegevens over het aantal leerlingen op de in het vierde
      tot en met zevende lid bedoelde wijze vervalt zodra Onze Minister heeft bepaald dat het bevoegd gezag heeft
      aangetoond in staat te zijn de leerlinggegevens te leveren op de in [artikel 164a van de wet][ref1] bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel164a
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 164a
  - number: 58a.3
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het eerste en tweede lid van overeenkomstige toepassing zijn op
      de levering van gegevens over het aantal leerlingen in een of meer schooljaren vanaf 1 augustus volgend op de datum
      van inwerkingtreding van dit artikel.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel58a
  - number: 58a.4
    text: |-
      Indien het eerste lid van toepassing is, doet het bevoegd gezag ten behoeve van de bekostiging, bedoeld in de
      [artikelen 12a, eerste en tweede lid][ref1], [29, eerste lid][ref2], en [37, eerste lid][ref3], voor de vijftiende
      dag van elke maand aan Onze Minister een opgave van het aantal leerlingen van de school op de eerste dag van die
      maand toekomen overeenkomstig het vijfde tot en met zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0004259#Artikel37
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: 12a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004259
        artikel: '29'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0004259
        artikel: '37'
        hoofdstuk: V
  - number: 58a.5
    text: |-
      De opgave, bedoeld in het vierde lid, is onderverdeeld in leerlingen met een niet-Nederlandse culturele achtergrond
      en overige leerlingen.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel58a
  - number: 58a.6
    text: |-
      Indien de school een nevenvestiging heeft, is de opgave, bedoeld in het vierde lid, tevens onderverdeeld in de
      leerlingen van de hoofdvestiging en de leerlingen van elk van de nevenvestigingen.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel58a
  - number: 58a.7
    text: Bij ministeriële regeling wordt vastgesteld op welke wijze de opgave, bedoeld in het vierde lid, wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel58a
  - number: '59'
    text: Het Bekostigingsbesluit ISOVSO (*Stb.* 1985,728) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel59
  - number: '60'
    text: 'Dit besluit wordt aangehaald als: Besluit bekostiging WEC.'
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel60
