        artikel: '2'
  - number: 5.1.d
    text: |-
      leerlingen die zijn toegelaten op basis van de bekostiging, bedoeld in [artikel 117, vijfde lid, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel5
    references:
