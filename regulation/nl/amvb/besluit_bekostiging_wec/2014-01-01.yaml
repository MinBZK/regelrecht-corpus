  - number: '37.3'
    text: |-
      Aanspraak op de aanvullende bekostiging, bedoeld in het eerste en tweede lid, ontstaat met ingang van 1 augustus
      van het daaropvolgende schooljaar en wordt betaald in twaalf maandelijkse termijnen.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel37
  - number: '38.1'
    text: |-
      Aan het bevoegd gezag van een school, niet zijnde een instelling, wordt aanvullende bekostiging voor
      personeelskosten toegekend indien het verschil tussen
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel38
  - number: 38.1.a
    text: het aantal leerlingen op 1 oktober van het schooljaar, en
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel38
  - number: 38.1.b
    text: |-
      het aantal leerlingen op de teldatum, gelijk is aan of groter is dan de kleinste factor N, bedoeld in de tabel in
      [artikel 14][ref1] die op de school van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel14
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel38
