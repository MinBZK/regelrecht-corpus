  - number: '37.1'
    text: |-
      Aan het bevoegd gezag van een school, niet zijnde een instelling, wordt aanvullende bekostiging voor
      personeelskosten toegekend indien:
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel37
  - number: 37.1.a
    text: het verschil tussen
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel37
  - number: 37.1.a.1°
    text: het aantal leerlingen op 16 januari van het schooljaar, en
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel37
  - number: 37.1.a.2°
    text: |-
      het aantal leerlingen op 1 oktober van het schooljaar onderscheidenlijk het aantal leerlingen op de teldatum die
      op grond van [artikel 118, tweede lid, van de wet][ref1] van toepassing is, gelijk is aan of groter is dan de helft
      van de kleinste factor N, bedoeld in de tabel in [artikel 14][ref2] die op de school van toepassing is, en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel14
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel37
