        artikel: '117'
  - number: 5.1.e
    text: |-
      leerlingen die zijn toegelaten op basis van de bekostiging, bedoeld in [artikel 117, zevende lid, van de wet][ref1]
      en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
  - number: 5.1.f
    text: |-
      leerlingen, die toelaatbaar zijn verklaard tot een andere onderwijssoort dan de onderwijssoort die door de school
      wordt verzorgd en die op de school zijn ingeschreven met toepassing van [artikel 76a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel76a
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 76a
  - number: '5.2'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de wijze waarop de leerlingenadministratie
      wordt ingericht.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel5
  - number: '6.1'
    text: De directeur van een school schrijft een leerling slechts in na overlegging van
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel6
  - number: 6.1.a
    text: |-
      een bewijs van uitschrijving van de leerling van een andere school of een school voor ander onderwijs, welk bewijs
      op het moment van inschrijving niet ouder is dan 6 maanden,
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel6
  - number: 6.1.b
    text: |-
      een schriftelijke verklaring van de ouders of de leerling die meerderjarig en handelingsbekwaam is, dat de leerling
      binnen een periode van 6 maanden voorafgaand aan de inschrijving niet eerder op een andere school, een school voor
      ander onderwijs of een instelling als bedoeld in [artikel 1, onderdeel ][ref1] was ingeschreven, of


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
  - number: 6.1.c
    text: |-
      een schriftelijke verklaring van de ouders of de leerling die meerderjarig en handelingsbekwaam is, dat de leerling
      voorafgaand aan de inschrijving op een instelling als bedoeld in [artikel 1, onderdeel ][ref1] was ingeschreven en
      dat deze leerling daar is uitgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
  - number: '6.2'
    text: |-
      Het bewijs van uitschrijving dan wel de verklaring, bedoeld in het eerste lid, onderdeel *b* of *c*, wordt bewaard
      in de administratie van de school.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel6
  - number: '6.3'
    text: |-
      De directeur doet in het geval, bedoeld in het eerste lid, onderdeel a, dan wel in het geval, bedoeld in het
      eerste lid, onderdeel *b*, indien hem bekend is op welke andere school, school voor ander onderwijs of instelling
      als bedoeld in [artikel 1, onderdeel ][ref1] de leerling was ingeschreven buiten de in het eerste lid, onderdeel
      *b*, bedoelde periode, dan wel in het geval, bedoeld in het eerste lid, onderdeel *c*, indien hem bekend is op
      welke instelling als bedoeld in [artikel 1, onderdeel ][ref2] de leerling was ingeschreven, onder vermelding
      van de datum van inschrijving op zijn school, binnen 1 week schriftelijk mededeling van de inschrijving aan de
      directeur, rector of centrale directie van de school, de school voor ander onderwijs of de instelling, bedoeld in
      [artikel 1, onderdeel ][ref3] waarop de leerling voordien was ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '1'
  - number: '6.4'
    text: De directeur schrijft de leerling in met ingang van de dag waarop de leerling de school voor het eerst bezoekt.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel6
  - number: '6.5'
    text: |-
      In afwijking van het vierde lid, schrijft de directeur een leerling die de school voor het eerst bezoekt op de
      eerste schooldag van het schooljaar, in met ingang van 1 augustus van dat schooljaar, behoudens wanneer de leerling
      op 1 augustus de leeftijd van 4 jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel6
  - number: '7.1'
    text: |-
      De directeur van een school op wiens school de leerling staat ingeschreven, schrijft de leerling, indien deze de
      school verlaat, uit met ingang van de dag waarop de leerling de school voor het laatst heeft bezocht en verstrekt
      de leerling een bewijs van uitschrijving. De directeur schrijft de leerling die wordt uitgeschreven na de school op
      de laatste schooldag van het schooljaar te hebben bezocht, uit met ingang van 31 juli van dat schooljaar.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel7
  - number: '7.2'
    text: |-
      Indien de directeur van een school op wiens school de leerling staat ingeschreven binnen 4 weken na de dag
      waarop de leerling de school voor het laatst heeft bezocht een mededeling ontvangt van de directeur, rector of
      centrale directie van een school of een school voor ander onderwijs, van de inschrijving van de leerling op diens
      school, wijzigt de directeur de datum van uitschrijving, bedoeld in het eerste lid, alsnog in de datum van de dag
      voorafgaande aan de inschrijving op de andere school of de school voor ander onderwijs.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel7
  - number: '8.1'
    text: |-
      Onverminderd het bepaalde in artikel [artikel 41, negende lid, van de wet][ref1], blijven de gegevens die
      in de leerlingenadministratie zijn opgenomen daarvan in ieder geval deel uitmaken gedurende 5 jaar nadat de
      desbetreffende leerling van de school is uitgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '41'
  - number: '8.2'
    text: |-
      Het gemeenschappelijk rapport, bedoeld in [artikel 41, zesde lid, van de wet][ref1] alsmede de gegevens die van
      belang zijn voor de berekening van de bekostiging voor personeelskosten worden in elk geval binnen acht weken na
      het verstrijken van de termijn, bedoeld in het eerste lid, vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '41'
  - number: '9.1'
    text: |-
      Voor de toepassing van het bepaalde in de wet worden, onverminderd het bepaalde in [artikel 7][ref1], de leerlingen
      op een school meegeteld die toelaatbaar zijn verklaard tot een van de onderwijssoorten die door de school worden
      verzorgd dan wel tot het cluster, bedoeld in [artikel 2, vierde lid onder d, van de wet][ref2], waartoe de school
      behoort en die op een teldatum op die school staan ingeschreven, tenzij zij vanaf het begin van het schooljaar tot
      de teldatum meer dan de helft van het aantal schooldagen zonder geldige reden hebben verzuimd.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '7'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '9.2'
    text: |-
      Voor de toepassing van het eerste lid wordt ten aanzien van de leerplichtige leerling als geldige reden aangemerkt
      een vrijstelling van geregeld schoolbezoek als bedoeld in de [Leerplichtwet 1969][ref1] (*Stb.* 1971, 406). Ten
      aanzien van de niet-leerplichtige leerling worden als geldige reden aangemerkt dezelfde gronden als die welke
      leiden tot een vrijstelling als bedoeld in de vorige volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: '9.3'
    text: |-
      Indien een teldatum valt op een dag waarop geen onderwijs wordt gegeven, worden op de eerstvolgende schooldag de
      leerlingen geteld, die op de teldatum stonden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel9
  - number: '9.4'
    text: Een leerling kan slechts op 1 school voor de bekostiging meetellen.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel9
  - number: '10.1'
    text: |-
      Met het oog op de vaststelling van de bekostiging, bedoeld in de [artikelen 12a, eerste lid][ref1], en
      [29, eerste lid][ref2], doet Onze Minister aan het bevoegd gezag jaarlijks een overzicht toekomen van de hem ter
      beschikking staande gegevens over het aantal leerlingen op de teldatum dat bij de vaststelling van de bekostiging
      in aanmerking wordt genomen. Het overzicht wordt gelijktijdig met het besluit tot vaststelling van de bekostiging,
      bedoeld in artikel 12a, eerste lid, toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel29
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: 12a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004259
        artikel: '29'
        hoofdstuk: V
  - number: '10.2'
    text: |-
      Het overzicht, bedoeld in het eerste lid, is onderverdeeld in leerlingen met een niet-Nederlandse culturele
      achtergrond en overige leerlingen.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel10
  - number: '10.3'
    text: |-
      Indien de school een nevenvestiging heeft, is het overzicht, bedoeld in het eerste lid, tevens onderverdeeld in de
      leerlingen van de hoofdvestiging en de leerlingen van elk van de nevenvestigingen.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel10
  - number: 10a.1
    text: |-
      Voor 15 oktober zendt het regionaal expertisecentrum aan Onze Minister, een opgave van het aantal leerlingen dat in
      de periode van 12 maanden direct voorafgaand aan 1 oktober een bevestigende beoordeling van de commissie, bedoeld
      in [artikel 28c, eerste lid, van de wet][ref1], heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28c
  - number: 10a.2
    text: Bij ministeriële regeling wordt vastgesteld op welke wijze de opgave, bedoeld in het eerste lid, wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel10a
  - number: 10b.1
    text: |-
      Het bevoegd gezag van een school doet jaarlijks voor 1 december aan Onze Minister mededeling van de gewogen
      gemiddelde leeftijd van de leraren van die school op 1 oktober daaraan voorafgaand.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel10b
  - number: 10b.2
    text: Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel10b
  - number: 10c
    text: |-
      Het bevoegd gezag verstrekt gelijktijdig met de verklaring, bedoeld in [artikel 157, vierde lid, van de wet][ref1]
      een verklaring omtrent de juistheid en tijdige aanmelding van de gegevens waarop bekostigingsbedragen zijn of
      worden gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel157
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '157'
  - number: '12.1'
    text: |-
      [Hoofdstuk III][ref1] is behoudens het gestelde in het tweede lid niet van toepassing op instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004259
        hoofdstuk: III
  - number: '12.2'
    text: |-
      Het Rijk verstrekt elke maand van het uitkeringsjaar in verband met de materiële voorzieningen ten behoeve van
      de instandhouding aan het bevoegd gezag van een instelling, een twaalfde gedeelte van de vergoeding, bedoeld in
      [artikel 128, negende lid][ref1], van de wet, waarop het over dat jaar recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
  - number: 12a.1
    text: |-
      Onze Minister stelt jaarlijks voor 1 februari de bekostiging voor dat jaar voor de scholen vast, gebaseerd op de
      grondslag, bedoeld in [artikel 128, vierde lid, van de wet][ref1], met dien verstande dat Onze Minister voor het
      bepalen van het aantal leerlingen op 1 oktober van het jaar voorafgaande aan het bekostigingsjaar, de leerlingen in
      aanmerking neemt van wie het persoonsgebonden nummer tezamen met de in [artikel 164a, tweede lid, van de wet][ref2]
      bedoelde gegevens uiterlijk op de daarop volgende 1 december zijn opgenomen in het basisregister onderwijs
      overeenkomstig [artikel 164b van de wet][ref3], dan wel de leerlingen van wie opgave is gedaan aan Onze Minister
      overeenkomstig [artikel 58a, vierde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel164a
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel164b
      [ref4]: https://wetten.overheid.nl/BWBR0004259#Artikel58a
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 164a
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 164b
      - id: ref4
        bwb_id: BWBR0004259
        artikel: 58a
        hoofdstuk: X
  - number: 12a.2
    text: |-
      Indien [artikel 128, zesde lid, van de wet][ref1] van toepassing is en indien van de leerlingen die op 16
      januari van het bekostigingsjaar op de school staan ingeschreven het persoonsgebonden nummer tezamen met de in
      [artikel 164, tweede lid, van de wet][ref2] bedoelde gegevens uiterlijk op 16 februari van dat jaar zijn opgenomen
      in het basisregister onderwijs overeenkomstig [artikel 164b van de wet][ref3], dan wel van deze leerlingen opgave
      is gedaan aan Onze Minister overeenkomstig [artikel 58a, vierde lid][ref4], stelt Onze Minister voor 1 mei de
      bekostiging, bedoeld in het eerste lid, voor dat jaar nader vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel164
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel164b
      [ref4]: https://wetten.overheid.nl/BWBR0004259#Artikel58a
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '164'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 164b
      - id: ref4
        bwb_id: BWBR0004259
        artikel: 58a
        hoofdstuk: X
  - number: 12a.3
    text: |-
      Indien de verklaring van de accountant, bedoeld in [artikel 157, vierde lid, van de wet][ref1] aanleiding geeft
      tot wijziging van de bekostiging, bedoeld in het eerste of tweede lid, stelt Onze Minister voor 1 oktober de
      bekostiging voor dat jaar nader vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel157
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '157'
  - number: 12a.4
    text: |-
      Het Rijk verstrekt elke maand van het bekostigingsjaar in verband met de materiële voorzieningen ten behoeve van
      de instandhouding aan het bevoegd gezag een twaalfde gedeelte van de bekostiging, bedoeld in het eerste lid, waarop
      het over dat jaar recht heeft.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel12a
  - number: '13.1'
    text: |-
      Het Rijk verstrekt elke maand van het uitkeringsjaar in verband met de materiële voorzieningen ten behoeve
      van de instandhouding aan het bevoegd gezag van een school een twaalfde gedeelte van de vergoeding, bedoeld in
      [artikel 128, eerste lid, van de wet][ref1], waarop het over dat jaar recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
  - number: '13.2'
    text: |-
      Indien blijkt dat voor het uitkeringsjaar [artikel 128, zesde lid, van de wet][ref1] van
      toepassing is, wordt het verschil tussen de vergoeding, bedoeld in het eerste lid, berekend
      op grond van [artikel 128, zesde lid, van de wet][ref2] en de vergoeding berekend op grond van
      [artikel 128, vierde lid, van de wet][ref3], verstrekt in de maanden mei tot en met december van het
      uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '128'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '128'
  - number: '13.3'
    text: |-
      Indien [artikel 12a, derde lid][ref1], van toepassing is, vindt verrekening plaats van de vergoeding voor dat jaar
      met de vergoeding die wordt verstrekt in de maanden oktober tot en met december van het uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel12a
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: 12a
        hoofdstuk: III
  - number: '14.1'
    text: |-
      Het normatief bepaalde aantal te huisvesten groepen leerlingen, bedoeld in
      [artikel 128, vierde lid, onder a, en vijfde lid, onder a][ref1], van de wet, wordt voor het jaar waarvoor de
      vergoeding voor de materiële voorzieningen ten behoeve van de instandhouding strekt, berekend door het aantal
      leerlingen van de desbetreffende school en van een of meer daaraan verbonden afdelingen, op 1 oktober van het
      voorafgaande jaar, dan wel indien [artikel 128, zesde lid][ref2], van de wet van toepassing is, het aantal
      leerlingen van de desbetreffende school en afdelingen op 16 januari van dat jaar, te delen door de voor het
      desbetreffende onderwijs geldende factor N van de onderstaande tabel.








                    Factor N voor het speciaal onderwijs


                    Factor N voor het voortgezet speciaal onderwijs




                    Aan:








                    a. dove kinderen


                    6


                    6




                    b. slechthorende kinderen


                    12


                    7




                    c. kinderen met ernstige spraakmoeilijkheden die niet tevens behoren tot de onder a of b bedoelde
      kinderen


                    12


                    7




                    f. lichamelijk gehandicapte kinderen


                    12


                    7




                    h. 1°. langdurig zieke kinderen met een lichamelijke handicap


                    13


                    7




                    2°. langdurig zieke kinderen anders dan met een lichamelijke handicap


                    12


                    7




                    i.






                    j. zeer moeilijk lerende kinderen


                    12


                    7




                    k. zeer moeilijk opvoedbare kinderen


                    12


                    7




                    l.






                    m. kinderen in scholen verbonden aan pedologische instituten


                    12


                    7




                    n. meervoudig gehandicapte kinderen


                    7


                    7


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '128'
  - number: '14.2'
    text: |-
      Het normatief bepaalde aantal te huisvesten groepen leerlingen, bedoeld in het eerste lid, wordt voor het speciaal
      onderwijs en het voortgezet speciaal onderwijs, onderscheidenlijk het onderwijs aan een afdeling, afzonderlijk
      berekend en de uitkomst van de afzonderlijke berekeningen wordt naar boven afgerond op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel14
  - number: '14.3'
    text: |-
      Voor scholen, waaraan bekostiging als bedoeld in [artikel 117, zevende lid, van de wet][ref1] is toegekend, wordt
      het aantal leerlingen op basis waarvan die bekostiging is toegekend, voor de toepassing van dit artikel aangemerkt
      als leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
  - number: '15'
    text: |-
      Het aantal groepen leerlingen bedoeld in [artikel 130, derde lid, tweede volzin][ref1], van de wet, wordt berekend
      overeenkomstig [artikel 14][ref2], waarbij de factor N voor het speciaal onderwijs 12 en voor het voortgezet
      speciaal onderwijs 7 is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel14
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '130'
      - id: ref2
        bwb_id: BWBR0004259
        artikel: '14'
        hoofdstuk: III
  - number: '17'
    text: |-
      De uitgaven voor de materiële voorzieningen ten behoeve van de instandhouding voor schoolgebouwen hebben betrekking
      op de programma’s van eisen, bedoeld in [artikel 112, eerste lid][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
  - number: '18'
    text: |-
      De vergoeding voor de materiële voorzieningen ten behoeve van de instandhouding wordt bepaald volgens de
      programma’s van eisen, bedoeld in [artikel 111, derde lid onderdeel ][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
  - number: '19.1'
    text: |-
      De aanspraak op vergoeding voor de uitgaven voor de materiële voorzieningen ten behoeve van de instandhouding van
      een schoolbad ontstaat met ingang van de maand voorafgaand aan de melding aan Onze Minister van de ingebruikneming
      daarvan en eindigt met ingang van de maand volgend op de maand waarin het schoolbad buiten gebruik wordt gesteld.
      Binnen acht weken na de buitengebruikstelling wordt daarvan melding gemaakt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel19
  - number: '19.2'
    text: |-
      Voor de vergoeding, bedoeld in het eerste lid, van een schoolbad waarvan het gebruik niet is beëindigd ingevolge
      [artikel 108 van de wet][ref1], zijn de [artikelen 12a][ref2] en [13][ref3], van overeenkomstige toepassing met
      dien verstande dat waar het betreft [artikel 12a, eerste lid][ref4], Onze Minister binnen acht weken na de melding
      van ingebruikneming, bedoeld in het eerste lid, de vergoeding voor dat jaar vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0004259#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004259#Artikel12a
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '108'
      - id: ref2
        bwb_id: BWBR0004259
        artikel: 12a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004259
        artikel: '13'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0004259
        artikel: 12a
        hoofdstuk: III
  - number: '19.3'
    text: |-
      De uitgaven voor de materiële voorzieningen ten behoeve van de instandhouding van een schoolbad hebben
      betrekking op de programma’s van eisen, bedoeld in [artikel 112, tweede lid, van de wet][ref1] en
      de vergoeding, bedoeld in het eerste lid, wordt bepaald door de programma’s van eisen, bedoeld in
      [artikel 111, derde lid onder b, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '111'
  - number: '20'
    text: |-
      Schattingen welke ingevolge dit hoofdstuk dienen plaats te vinden, geschieden door een commissie van 3 deskundigen
      van wie er een wordt benoemd door de Onderwijsraad, een door burgemeester en wethouders en een door het bevoegd
      gezag. De commissie beslist bij meerderheid van stemmen. Indien geen meerderheid wordt verkregen, wordt de
      waarde bepaald op het gemiddelde van de 3 schattingsopgaven. Afschrift van de beslissing wordt gezonden aan het
      gemeentebestuur en het bevoegd gezag. De kosten van de schattingen komen ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel20
  - number: '21'
    text: |-
      De vergoedingen, bedoeld in de titels II en III, zijn niet langer verschuldigd wanneer de gemeente de eigendom
      van het terrein en gebouw verkrijgt of wanneer het terrein en gebouw niet meer voor het speciaal onderwijs of het
      voortgezet speciaal onderwijs, bedoeld in [artikel 2][ref1] van de wet, wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '22.1'
    text: |-
      Voor de terreinen en gebouwen die eigendom zijn van het bevoegd gezag van een bijzondere school en op 1 januari
      1921 in gebruik of in aanbouw waren, betaalt de gemeente jaarlijks aan het desbetreffende bevoegd gezag een
      vergoeding, berekend over de waarde van de terreinen, gebouwen en het meubilair zoals deze ingevolge de Lager-
      onderwijswet 1920 is geschat. In afwijking van het bepaalde in de vorige volzin wordt voor gebouwen die niet
      uitsluitend zijn bestemd voor speciaal onderwijs, voortgezet speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs als bedoeld in [artikel 2][ref1] van de wet, de vergoeding berekend over 80 procent van het voor het
      desbetreffende gebouw ingevolge de Lager-onderwijswet 1920 geschatte bedrag. De vergoeding wordt op gelijke wijze
      uitbetaald aan een bevoegd gezag dat na 1 januari 1921 de eigendom van terreinen en gebouwen van een bijzondere
      school die op 1 januari 1921 in gebruik of in aanbouw waren, heeft verkregen of verkrijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '22.2'
    text: |-
      Voor de toepassing van dit artikel worden onder gebouwen in aanbouw verstaan de gebouwen van een bijzondere school
      waarvan de ontwerpen voor 1 januari 1921 overeenkomstig artikel 1 van het koninklijk besluit van 25 juni 1912
      (*Stb.* 193) bij het rijksschooltoezicht werden ingediend en die voor 1 juli 1923 zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel22
  - number: '23.1'
    text: |-
      De vergoeding, bedoeld in [artikel 22][ref1], bedraagt 5 procent van de geschatte waarde, onderscheidenlijk het
      in de tweede volzin van het eerste lid van dat artikel bedoelde bedrag waarover de vergoeding dient te worden
      berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel22
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '22'
        hoofdstuk: IV
  - number: '23.2'
    text: |-
      Het college van burgemeester en wethouders kan, op verzoek van het bevoegd gezag van de bijzondere school, bepalen
      dat in verband met de op het bevoegd gezag rustende geldelijke verplichtingen, gedurende een door hem vast te
      stellen termijn de vergoeding naar een hoger percentage zal worden berekend.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel23
  - number: '24.1'
    text: |-
      Indien voor de bouw van nieuwe lokalen gebruik wordt gemaakt van een gebouw of terrein als bedoeld in
      [artikel 22][ref1], of indien overeenkomstig [artikel 108 van de wet][ref2] is vastgesteld dat een gedeelte van een
      zodanig gebouw of terrein ten gevolge van het in gebruik nemen van nieuwe of andere lokalen blijvend niet meer voor
      de school wordt gebruikt, wordt de geschatte waarde, bedoeld in dat artikel, verminderd met de geschatte waarde
      van de niet meer gebruikte lokalen, en wordt over het verschil de vergoeding opnieuw berekend. De nieuw berekende
      vergoeding gaat in op het tijdstip waarop de lokalen buiten gebruik zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel108
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '22'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '108'
  - number: '24.2'
    text: |-
      Indien het meubilair in gebouwen als bedoeld in [artikel 22][ref1] wordt vervangen, wordt de geschatte waarde,
      bedoeld in dat artikel, verminderd met het bedrag waarop de waarde van het oude meubilair was bepaald, en wordt
      over het verschil de vergoeding opnieuw berekend. De nieuw berekende vergoeding gaat in op het tijdstip van
      ingebruikneming van het nieuwe meubilair.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel22
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '22'
        hoofdstuk: IV
  - number: '26.1'
    text: |-
      Wanneer de gebouwen en terreinen, bedoeld in [artikel 22][ref1], anders dan ingevolge [artikel 58][ref2] van
      de wet worden vervreemd, of zodra voor die gebouwen en terreinen overeenkomstig [artikel 108 van de wet][ref3]
      is vastgesteld dat zij blijvend niet meer voor het onderwijs aan de school worden gebruikt, betaalt het bevoegd
      gezag van een bijzondere school aan de gemeente terug het bedrag dat de gemeente aan uitbreiding, verbouwing of
      vernieuwing van het gebouw en terrein op grond van de bepalingen van de Lager-onderwijswet 1920 of de Overgangswet
      ISOVSO zoals luidend op 31 december 1996 heeft uitgegeven, verminderd, behoudens voor zover het betreft door
      de gemeente bekostigde grond, met 2 procent voor wat betreft de uitbreiding en met 5 procent voor wat betreft
      de verbouwing of de vernieuwing, voor elk vol jaar dat is verstreken vanaf het tijdstip waarop de uitgaven zijn
      gedaan. De terugbetaling kan in termijnen plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel108
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '22'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '58'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '108'
  - number: '26.2'
    text: |-
      Het bevoegd gezag van een bijzondere school betaalt aan de gemeente terug het bedrag dat de gemeente aan
      uitbreiding, algehele aanpassing, partiële aanpassing, ingrijpend onderhoud of energiebesparende maatregelen op
      grond van de bepalingen van de [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1]
      zoals die luidde op 31 december 1996 heeft uitgegeven, verminderd, behoudens voor zover het betreft door de
      gemeente bekostigde grond, met de ten behoeve van een voorziening als de onderhavige voor de desbetreffende school
      door het Rijk aan de gemeente verstrekte vergoedingen. De terugbetaling kan in termijnen plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '26.3'
    text: |-
      Het bevoegd gezag van een bijzondere school betaalt aan de gemeente terug het bedrag dat de gemeente heeft
      uitgegeven aan de voorzieningen, bedoeld in [artikel 90, eerste lid, onderdelen a 2°, b en c, van de wet][ref1],
      verminderd met de uit de gemeentebegroting blijkende afschrijving op het moment van de in het eerste lid bedoelde
      vaststelling van de buitengebruikstelling, behoudens voor zover het betreft door de gemeente bekostigde grond,
      voor elk vol jaar dat is verstreken sedert het tijdstip waarop de uitgaven plaats hadden. De terugbetaling kan in
      termijnen plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel90
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '90'
  - number: '26.4'
    text: |-
      Binnen vier weken na de vervreemding of nadat de buitengebruikstelling overeenkomstig
      [artikel 108 van de wet][ref1] is vastgesteld, draagt het bevoegd gezag van een bijzondere school de roerende
      zaken, behoudens die welke het bevoegd gezag uit eigen middelen heeft aangeschaft, aan de gemeente in eigendom
      over.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel108
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '108'
  - number: '26.5'
    text: |-
      Indien het bevoegd gezag in de onmogelijkheid verkeert het gebouw en terrein tegen een zodanige prijs te verkopen
      of op andere wijze daaruit zodanige inkomsten te verwerven, dat uit de opbrengst het verschuldigde bedrag kan
      worden terugbetaald, kan het bevoegd gezag aan zijn verplichtingen voldoen door overdracht van het gebouw en
      terrein aan de gemeente, dan wel door betaling aan de gemeente van een door gedeputeerde staten vast te stellen
      vergoeding.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel26
  - number: '27.1'
    text: |-
      Voor de gebouwen en terreinen waarvoor voor 1 januari 1989 vergoeding werd genoten op grond van artikel 184
      van het Besluit buitengewoon onderwijs 1967, betaalt de gemeente jaarlijks aan het bevoegd gezag een vergoeding
      gelijk aan het bedrag dat voor huur van de gebouwen en terreinen, met inbegrip van de inrichting, het meubilair
      en het onderwijsleerpakket, redelijk is te achten, verminderd met de kosten van instandhouding van het gebouw. De
      vergoeding bedraagt niet meer dan het bedrag dat een redelijke vergoeding oplevert voor een overeenkomstige school,
      bestemd voor hetzelfde aantal leerlingen, die in normale omstandigheden verkeert. De vergoeding wordt in overleg
      tussen burgemeester en wethouders en het bevoegd gezag vastgesteld. Indien voor gebouw en terrein, met inbegrip van
      de inrichting, het meubilair en het onderwijsleerpakket, een vergoeding uit de openbare kassen is of wordt genoten,
      wordt de vergoeding dienovereenkomstig verminderd.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel27
  - number: '27.2'
    text: |-
      Aan het bevoegd gezag van een school, niet zijnde een instelling, waarvoor de in het eerste lid bedoelde vergoeding
      wordt betaald, verstrekt het Rijk jaarlijks een bedrag ter bestrijding van de kosten van de school waarvoor de in
      het eerste lid bedoelde vergoeding niet is bestemd. De [titels I tot en met III van hoofdstuk III][ref1] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004259
        hoofdstuk: III
  - number: '28.1'
    text: |-
      Indien het bevoegd gezag, bedoeld in [artikel 27][ref1], eigenaar is van het gebouw en terrein, en het gebouw en
      terrein niet meer voor het speciaal onderwijs, het voortgezet speciaal onderwijs of het speciaal en voortgezet
      speciaal onderwijs als bedoeld in [artikel 2][ref2] van de wet worden gebruikt, dan wel het gebouw en terrein na 1
      september 1987 zijn of worden vervreemd, betaalt het bevoegd gezag voor elk jaar dat de gemeente met betrekking tot
      het gebouw en terrein een vergoeding heeft verstrekt, doch voor ten hoogste 40 jaren, aan de gemeente 1/40 deel van
      de waarde van het gebouw en terrein in het economisch verkeer, met dien verstande dat het college van burgemeester
      en wethouders kan besluiten in verband met eigen investeringen van het bevoegd gezag een lagere waarde vast te
      stellen. Indien toepassing is gegeven aan [artikel VI, vierde lid, van de wet van 2 april 1998, Stb. 228][ref3],
      wordt de gemeente geacht gedurende 40 jaren een vergoeding met betrekking tot het gebouw en terrein te hebben
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009525#ArtikelVI
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '27'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0009525
        artikel: VI
  - number: '28.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan het bevoegd gezag de eigendom van het gebouw overdragen aan
      de gemeente.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel28
  - number: '29.1'
    text: |-
      Onze Minister stelt jaarlijks uiterlijk op 15 april, de bekostigingsbedragen, bedoeld in
      [artikel 131, eerste en derde lid, van de wet][ref1] vast voor zover deze bedragen mede gebaseerd zijn op
      het aantal leerlingen op de teldatum, met dien verstande dat Onze Minister voor het bepalen van het aantal
      leerlingen op de teldatum, de leerlingen in aanmerking neemt van wie het persoonsgebonden nummer tezamen
      met de in [artikel 164a, tweede lid, van de wet][ref2] bedoelde gegevens uiterlijk op 1 december van het
      jaar voorafgaande aan het bekostigingsjaar zijn opgenomen in het basisregister onderwijs overeenkomstig
      [artikel 164b van de wet][ref3], dan wel de leerlingen van wie opgave is gedaan aan Onze Minister overeenkomstig
      [artikel 58a, vierde lid][ref4]. De bedragen hebben betrekking op een schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel164a
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel164b
      [ref4]: https://wetten.overheid.nl/BWBR0004259#Artikel58a
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 164a
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 164b
      - id: ref4
        bwb_id: BWBR0004259
        artikel: 58a
        hoofdstuk: X
  - number: '29.2'
    text: |-
      Onze Minister stelt de bekostigingsbedragen, bedoeld in [artikel 131, eerste lid, van de wet][ref1] voorzover het
      betreft de bekostiging, bedoeld in [artikel 38][ref2], vast binnen 8 weken na ontvangst van de gegevens ten behoeve
      van de berekening van deze bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel38
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
      - id: ref2
        bwb_id: BWBR0004259
        artikel: '38'
        hoofdstuk: V
  - number: '29.3'
    text: |-
      Indien de verklaring van de accountant, bedoeld in [artikel 157, vierde lid, van de wet][ref1] aanleiding geeft
      tot wijziging van de bekostiging, bedoeld in het eerste of tweede lid, stelt Onze Minister voor 1 oktober de
      bekostiging voor dat jaar nader vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel157
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '157'
  - number: '29.4'
    text: |-
      De in het eerste en tweede lid bedoelde bekostigingsbedragen kunnen door Onze Minister worden gewijzigd wegens
      algemene salarismaatregelen of wegens andere al dan niet uit de rijksbegroting voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel29
  - number: '30.1'
    text: |-
      De betaling van de bekostigingsbedragen voor personeelskosten, bedoeld in [artikel 124][ref1] en
      [artikel 131, eerste lid, van de wet][ref2] vindt maandelijks plaats op een bij ministeriële regeling vast te
      stellen betaalritme dat voor de verschillende onderdelen van de bekostiging verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '124'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '131'
  - number: '30.2'
    text: |-
      De betaling van de bekostiging voor personeelskosten bedoeld in [artikel 131, tweede lid, van de wet][ref1] vindt,
      tenzij bij beschikking anders wordt bepaald, plaats in een aantal gelijke maandelijkse termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
  - number: '31'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel31
  - number: 31.a
    text: |-
      formatiebasisbedrag: een bij ministeriële regeling vast te stellen bedrag, dat niet afhankelijk is van de leeftijd
      van personeel van de school;
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel31
  - number: 31.b
    text: |-
      formatieleeftijdsbedrag: een bij ministeriële regeling vast te stellen bedrag, dat vervolgens afhankelijk wordt
      gesteld van de leeftijd van personeel van de school;
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel31
  - number: 31.c
    text: |-
      basisbedrag: een bij ministeriële regeling vast te stellen bedrag, dat wordt bepaald door de in het desbetreffende
      artikel genoemde formatie te vermenigvuldigen met het formatiebasisbedrag;
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel31
  - number: 31.d
    text: |-
      leeftijdsbedrag: een bij ministeriële regeling vast te stellen bedrag, dat wordt bepaald door de in het
      desbetreffende artikel genoemde formatie te vermenigvuldigen met het formatieleeftijdsbedrag.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel31
  - number: '32.1'
    text: |-
      Aan elke school, niet zijnde een instelling, wordt voor de bekostiging van de personeelskosten een vast bedrag
      per school verstrekt. Het vaste bedrag per school bestaat uit een basisbedrag, welk bedrag wordt verhoogd met een
      leeftijdsbedrag dat wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de school op 1
      oktober van het voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel32
  - number: '32.2'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het eerste lid, en het leeftijdsbedrag, bedoeld in het eerste
      lid, bedraagt de formatie 1,1734 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel32
  - number: '32.3'
    text: |-
      Voor het schooljaar waarin een nieuwe school wordt geopend, wordt het leeftijdsbedrag vermenigvuldigd met de
      geraamde landelijk gewogen gemiddelde leeftijd op 1 oktober van het voorafgaande schooljaar van de leraren in het
      speciaal onderwijs en het voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel32
