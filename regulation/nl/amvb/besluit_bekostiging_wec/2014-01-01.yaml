        artikel: '23'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004259
        artikel: '23'
        hoofdstuk: IV
  - number: '58.1'
    text: |-
      Voor zover het betreft de gegevens ten behoeve van de afrekeningen van de vergoedingen voor de personele kosten
      over de jaren voor 1987 wordt [artikel 42][ref1] vervangen door de [artikelen 42][ref2] en 42a, luidende als
      volgt: 1. Het bevoegd gezag van een school, bedoeld in [artikel 33, onderdeel a][ref3], verstrekt jaarlijks
      voor een bij ministeriële regeling te bepalen tijdstip ten behoeve van de vaststelling van de vergoeding,
      bedoeld in [artikel 101 van de wet][ref4], zoals luidend op 31 juli 1992, over het voorafgaande jaar aan Onze
      Minister de gegevens betreffende het personeel. 2. Bij ministeriële regeling wordt voor het verstrekken van de
      gegevens, bedoeld in het eerste lid, een formulier vastgesteld. 1. Het bevoegd gezag van een school, bedoeld in
      [artikel 33 onderdeel b][ref5], verstrekt jaarlijks voor 1 maart ten behoeve van de vaststelling van de vergoeding,
      bedoeld in [artikel 101 van de wet][ref6], zoals luidend op 31 juli 1992, over het voorafgaande jaar aan Onze
      Minister de gegevens betreffende het personeel. 2. Bij ministeriële regeling wordt voor het verstrekken van de
      gegevens, bedoeld in het eerste lid, een formulier vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0004259#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel101
      [ref5]: https://wetten.overheid.nl/BWBR0004259#Artikel33
      [ref6]: https://wetten.overheid.nl/BWBR0003549#Artikel101
