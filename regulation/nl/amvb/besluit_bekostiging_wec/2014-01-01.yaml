    text: |-
      Tot 1 januari 1989 wordt [artikel 42, eerste lid onderdeel c][ref1], vervangen door:


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel42
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel58
