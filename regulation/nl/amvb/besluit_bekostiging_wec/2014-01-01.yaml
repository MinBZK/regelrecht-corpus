        artikel: '124'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '131'
  - number: 3b.1
    text: |-
      Aan het bevoegd gezag van een nieuw geopende school wordt, in afwachting van de vaststelling van de bekostiging
      voor personeelskosten en de bekostiging voor de uitgaven voor de materiële voorzieningen ten behoeve van de
      instandhouding op basis van de gegevens op de teldatum, een voorschot op de bedoelde bekostiging verstrekt indien
      het bevoegd gezag uiterlijk op 1 juli voorafgaande aan het schooljaar waarin de bekostiging van een nieuw geopende
      school begint, het vermoedelijk aantal leerlingen op 1 oktober volgend op de datum van ingang van de bekostiging
      aan Onze Minister meldt.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3b
  - number: 3b.2
    text: 'Het voorschot, bedoeld in het eerste lid, bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3b
  - number: 3b.2.a
    text: |-
      de bekostiging, bedoeld in [artikel 131, eerste lid, van de wet][ref1] berekend overeenkomstig dit besluit, met
      dien verstande dat wordt gerekend met het aantal leerlingen, bedoeld in het eerste lid; en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
  - number: 3b.2.b
    text: |-
      de bekostiging, bedoeld in [artikel 128 van de wet][ref1] berekend overeenkomstig dit besluit, met dien verstande
      dat wordt gerekend met het aantal leerlingen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
  - number: 3b.3
    text: |-
      Op de betaling van het voorschot zijn [artikel 13][ref1] en [artikel 30][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel30
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004259
        artikel: '30'
        hoofdstuk: V
  - number: 3b.4
    text: |-
      Onze Minister is bevoegd tot verrekening van verstrekte voorschotten met de betalingen die voortvloeien uit de
      vaststelling van de onderscheiden onderdelen van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3b
  - number: 3b.5
    text: |-
      Indien Onze Minister een voorschot verleent in gevallen waarin de bekostiging wegens niet aan het bevoegd gezag van
      een school toe te rekenen omstandigheden niet tijdig kan worden vastgesteld, zijn het derde en het vierde lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3b
  - number: '4'
    text: |-
      Het bevoegd gezag geeft binnen twee weken na beslissing tot opheffing van de school of een nevenvestiging van
      een instelling kennis daarvan aan Onze Minister, gedeputeerde staten, de inspecteur en, indien het een bijzondere
      school of een nevenvestiging van een bijzondere instelling betreft, eveneens aan burgemeester en wethouders van de
      gemeente waarin de school onderscheidenlijk de nevenvestiging van de instelling is gelegen.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel4
  - number: '5.1'
    text: |-
      De directeur van een school draagt er zorg voor dat een overzichtelijke administratie van de gegevens van de
      leerlingen met inbegrip van het gemeenschappelijk rapport, bedoeld in [artikel 41, zesde lid, van de wet][ref1],
      en van hun ouders, alsmede van de inschrijving, de uitschrijving en het verzuim van de leerlingen op de school
      aanwezig is. In deze administratie wordt een onderverdeling gemaakt naar:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '41'
  - number: 5.1.a
    text: leerlingen van de hoofdvestiging,
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel5
  - number: 5.1.b
    text: leerlingen van elk van de nevenvestigingen,
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel5
  - number: 5.1.c
    text: |-
      leerlingen die toelaatbaar zijn verklaard tot een van de onderwijssoorten die door de school worden verzorgd dan
      wel tot het cluster, bedoeld in [artikel 2, vierde lid onder d, van de wet][ref1], waartoe de school behoort,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel5
    references:
