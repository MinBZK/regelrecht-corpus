      - id: ref2
        bwb_id: BWBR0004259
        artikel: '14'
        hoofdstuk: III
  - number: 37.1.b
    text: |-
      het persoonsgebonden nummer tezamen met de in [artikel 164a, tweede lid, van de wet][ref1] bedoelde gegevens van
      de leerlingen die op 16 januari van het schooljaar op de school staan ingeschreven, uiterlijk 16 februari van het
      schooljaar zijn opgenomen in het basisregister onderwijs overeenkomstig [artikel 178b van de wet][ref2], dan wel
      van deze leerlingen opgave is gedaan aan Onze Minister overeenkomstig [artikel 58a, vierde lid][ref3].


