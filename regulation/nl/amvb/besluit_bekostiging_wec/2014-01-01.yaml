      schooljaar.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel38
  - number: '38.4'
    text: |-
      Aanspraak op de aanvullende bekostiging ingevolge de voorafgaande leden ontstaat met ingang van 1 januari van het
      schooljaar en wordt betaald in 7 maandelijkse termijnen.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel38
  - number: 38a.1
    text: |-
      Voor de bekostiging van preventieve ambulante begeleiding, bedoeld in
      [artikel 8a, derde lid, onderdeel a, van de wet][ref1] wordt aan het bevoegd gezag van een school, niet zijnde
      een instelling, een basisbedrag toegekend per leerling. Dit basisbedrag wordt verhoogd met een leeftijdsbedrag
      dat wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de school op 1 oktober van het
      voorafgaande schooljaar.


