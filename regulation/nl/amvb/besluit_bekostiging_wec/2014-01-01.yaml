  - number: '2'
    text: |-
      Het bevoegd gezag van een school die in een plan van nieuwe scholen als bedoeld in artikel 84, negende lid, en
      [artikel 86, eerste lid][ref1], van de wet is opgenomen, zendt Onze Minister uiterlijk 3 maanden voor de datum
      van ingang van de bekostiging de benodigde administratieve gegevens en bescheiden voor de vaststelling van de
      vergoedingsbedragen, waaronder ten minste wordt begrepen het vermoedelijk aantal leerlingen op 1 oktober volgend op
      de datum van ingang van de bekostiging. Bij ministeriële regeling worden voorschriften gegeven omtrent de gegevens
      en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel86
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '86'
  - number: '3.1'
    text: |-
      Ten einde overeenkomstig de bepalingen van dit besluit enige bekostiging van het Rijk te verkrijgen, moet het
      bevoegd gezag van een bijzondere school zijn aangesloten bij een organisatie van bevoegde gezagsorganen die
      rechtspersoon met volledige rechtsbevoegdheid is en als zodanig door Onze Minister is erkend en zich te zijnen
      genoegen heeft borg gesteld voor terugbetaling van teveel ontvangen bedragen.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3
  - number: '3.2'
    text: |-
      De erkenning, bedoeld in het eerste lid, geschiedt op een daartoe door het bestuur der organisatie tot Onze
      Minister gericht verzoek waarbij moet worden overgelegd een opgave van elk bevoegd gezag waarvoor zekerheid wordt
      gesteld, vermeldende ten aanzien van elke school, de gemeente en nadere plaatsaanduiding in de gemeente waar de
      school is gevestigd, alsmede naam van de rechtspersoon onder wiens bestuur de school staat. Wijzigingen die daarin
      worden aangebracht, deelt het bestuur der organisatie binnen twee weken mede aan Onze Minister. Deze wijzigingen
      ontheffen de organisaties niet van de voor het lopende jaar aangegane borgstelling ten behoeve van een aangesloten
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3
  - number: 3a.1
    text: |-
      De aanspraak op de verstrekking van bekostiging voor personeelskosten, bedoeld in de [artikelen 124][ref1] en
      [131, eerste lid, van de wet][ref2] ontstaat met ingang van 1 augustus van het schooljaar waarin de bekostiging van
      een nieuw geopende school begint.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '124'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '131'
  - number: 3a.2
    text: |-
      De aanspraak op de bekostiging voor de uitgaven voor de materiële voorzieningen ten behoeve van de instandhouding,
      bedoeld in [artikel 128 van de wet][ref1] ontstaat met ingang van 1 augustus van het schooljaar waarin de
      bekostiging van een nieuw geopende school begint.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
  - number: 3a.3
    text: |-
      In afwijking van het eerste lid, ontstaat de aanspraak op bekostiging voor de uitgaven voor 1 lid van het personeel
      op 1 juni voorafgaand aan het schooljaar waarin de bekostiging van een nieuw geopende school begint.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3a
  - number: 3a.4
    text: De in het derde lid bedoelde bekostiging bestaat uit de som van
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3a
  - number: 3a.4.a
    text: |-
      het basisbedrag, welk bedrag wordt verhoogd met een leeftijdsbedrag dat wordt vermenigvuldigd met de geraamde
      landelijk gewogen gemiddelde leeftijd van de leraren in het speciaal onderwijs en het voortgezet speciaal onderwijs
      op 1 oktober voorafgaand aan de eerste kalenderdag van het schooljaar waarin de bekostiging van de nieuw geopende
      school begint; en
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3a
  - number: 3a.4.b
    text: |-
      2/12 van de aanvullende bekostiging voor de schoolleiding, bedoeld in [artikel 35][ref1], gebaseerd op de daar
      bedoelde factor 1.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel35
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '35'
        hoofdstuk: V
  - number: 3a.5
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het vierde lid, en het leeftijdsbedrag, bedoeld in het vierde
      lid, bedraagt de formatie 2/12 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3a
  - number: 3a.6
    text: |-
      Indien een school op 1 oktober van het schooljaar waarin de bekostiging van een nieuw geopende school begint geen
      leerlingen heeft, ontstaat in afwijking van het tweede lid, aanspraak op bekostiging voor de personeelskosten,
      bedoeld in [artikel 131, eerste lid, van de wet][ref1] met ingang van de eerste dag van de maand waarin de school
      een leerling heeft. Indien de eerste volzin van toepassing is, wordt de bekostiging voor het lopende schooljaar en
      het schooljaar daaropvolgend gebaseerd op het aantal leerlingen dat de school heeft op de eerste dag van de tweede
      maand volgend op de dag waarop de school de eerste leerling heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
  - number: 3a.7
    text: |-
      Indien een school op 1 oktober van het schooljaar waarin de bekostiging van een nieuw geopende school begint geen
      leerlingen heeft, ontstaat in afwijking van het zesde lid, aanspraak op bekostiging voor de personeelskosten,
      bedoeld in de [artikelen 124][ref1] en [131, eerste lid, van de wet][ref2] met ingang van de eerste dag van de
      maand waarin de school een leerling heeft. Indien de eerste volzin van toepassing is, wordt de bekostiging voor het
      lopende schooljaar en het daaropvolgende schooljaar gebaseerd op het aantal leerlingen dat de school heeft op de
      eerste dag van de tweede maand volgend op de dag waarop de school de eerste leerling heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0004259/2014-01-01#Artikel3a
    references:
      - id: ref1
