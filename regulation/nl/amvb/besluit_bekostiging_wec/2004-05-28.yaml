  - number: 1.a
    text: |-
      een openbare school: het college van burgemeester en wethouders voor zover de raad niet anders bepaalt, en,
      indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen regelen, dan wel het krachtens een
      gemeenschappelijke regeling bevoegde orgaan;
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel1
  - number: 1.b
    text: |-
      een bijzondere school: de rechtspersoon bedoeld in [artikel 57 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel57
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '57'
  - number: '2'
    text: |-
      Het bevoegd gezag van een school die in een plan van nieuwe scholen als bedoeld in artikel 84, negende lid, en
      [artikel 86, eerste lid][ref1], van de wet is opgenomen, zendt Onze Minister uiterlijk 3 maanden voor de datum
      van ingang van de bekostiging de benodigde administratieve gegevens en bescheiden voor de vaststelling van de
      vergoedingsbedragen, waaronder ten minste wordt begrepen het vermoedelijk aantal leerlingen op 1 oktober volgend op
      de datum van ingang van de bekostiging. Bij ministeriële regeling worden voorschriften gegeven omtrent de gegevens
      en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel86
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '86'
  - number: '3.1'
    text: |-
      Ten einde overeenkomstig de bepalingen van dit besluit enige bekostiging van het Rijk te verkrijgen, moet het
      bevoegd gezag van een bijzondere school zijn aangesloten bij een organisatie van bevoegde gezagsorganen die
      rechtspersoon met volledige rechtsbevoegdheid is en als zodanig door Onze Minister is erkend en zich te zijnen
      genoegen heeft borg gesteld voor terugbetaling van teveel ontvangen bedragen.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel3
  - number: '3.2'
    text: |-
      De erkenning, bedoeld in het eerste lid, geschiedt op een daartoe door het bestuur der organisatie tot Onze
      Minister gericht verzoek waarbij moet worden overgelegd een opgave van elk bevoegd gezag waarvoor zekerheid wordt
      gesteld, vermeldende ten aanzien van elke school, de gemeente en nadere plaatsaanduiding in de gemeente waar de
      school is gevestigd, alsmede naam van de rechtspersoon onder wiens bestuur de school staat. Wijzigingen die daarin
      worden aangebracht, deelt het bestuur der organisatie binnen twee weken mede aan Onze Minister. Deze wijzigingen
      ontheffen de organisaties niet van de voor het lopende jaar aangegane borgstelling ten behoeve van een aangesloten
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel3
  - number: '4'
    text: |-
      Het bevoegd gezag geeft binnen twee weken na beslissing tot opheffing van de school of een nevenvestiging van
      een instelling kennis daarvan aan Onze Minister, gedeputeerde staten, de inspecteur en, indien het een bijzondere
      school of een nevenvestiging van een bijzondere instelling betreft, eveneens aan burgemeester en wethouders van de
      gemeente waarin de school onderscheidenlijk de nevenvestiging van de instelling is gelegen.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel4
  - number: '5.1'
    text: |-
      De directeur van een school draagt er zorg voor dat een overzichtelijke administratie van de gegevens van de
      leerlingen met inbegrip van het gemeenschappelijk rapport, bedoeld in [artikel 41, zesde lid, van de wet][ref1],
      en van hun ouders, alsmede van de inschrijving, de uitschrijving en het verzuim van de leerlingen op de school
      aanwezig is. In deze administratie wordt een onderverdeling gemaakt naar: - leerlingen van de hoofdvestiging,
        - leerlingen van elk van de nevenvestigingen,
        - leerlingen die toelaatbaar zijn verklaard tot een van de onderwijssoorten die door de school worden verzorgd dan
      wel tot het cluster, bedoeld in [artikel 2, vierde lid onder d, van de wet][ref2], waartoe de school behoort,
        - leerlingen die zijn toegelaten op basis van de formatie, bedoeld in [artikel 117, zesde lid, van de wet][ref3],
        - leerlingen die zijn toegelaten op basis van de formatie, bedoeld in [artikel 117, achtste lid, van de wet][ref4]
      en
        - leerlingen, die toelaatbaar zijn verklaard tot een andere onderwijssoort binnen het cluster, bedoeld in
      [artikel 2, vierde lid, van de wet][ref5], dan de onderwijssoort die door de school wordt verzorgd en die op de
      school zijn ingeschreven met toepassing van [artikel 76a van de wet][ref6]. De directeur draagt er zorg voor dat de
      volledige administratie op de hoofdvestiging aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel117
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel117
      [ref5]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0003549#Artikel76a
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel5
    references:
