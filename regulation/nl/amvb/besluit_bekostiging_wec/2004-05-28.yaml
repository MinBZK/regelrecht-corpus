        artikel: 76a
  - number: '5.2'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de wijze waarop de leerlingenadministratie
      wordt ingericht.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel5
  - number: '6.1'
    text: |-
      Onverminderd het bepaalde bij of krachtens de [Les- en cursusgeldwet][ref1] schrijft de directeur van een school
      een leerling slechts in na overlegging van


      [ref1]: https://wetten.overheid.nl/BWBR0004188
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004188
  - number: 6.1.a
    text: |-
      een bewijs van uitschrijving van de leerling van een andere school of een school voor ander onderwijs, welk bewijs
      op het moment van inschrijving niet ouder is dan 6 maanden,
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel6
  - number: 6.1.b
    text: |-
      een schriftelijke verklaring van de ouders of de leerling die meerderjarig en handelingsbekwaam is, dat de leerling
      binnen een periode van 6 maanden voorafgaand aan de inschrijving niet eerder op een andere school, een school voor
      ander onderwijs of een instelling als bedoeld in [artikel 1, onderdeel ][ref1] was ingeschreven, of


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
  - number: 6.1.c
    text: |-
      een schriftelijke verklaring van de ouders of de leerling die meerderjarig en handelingsbekwaam is, dat de leerling
      voorafgaand aan de inschrijving op een instelling als bedoeld in [artikel 1, onderdeel ][ref1] was ingeschreven en
      dat deze leerling daar is uitgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
  - number: '6.2'
    text: |-
      Het bewijs van uitschrijving dan wel de verklaring, bedoeld in het eerste lid, onderdeel *b* of *c*, wordt bewaard
      in de administratie van de school.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel6
  - number: '6.3'
    text: |-
      De directeur doet in het geval, bedoeld in het eerste lid, onderdeel a, dan wel in het geval, bedoeld in het
      eerste lid, onderdeel *b*, indien hem bekend is op welke andere school, school voor ander onderwijs of instelling
      als bedoeld in [artikel 1, onderdeel ][ref1] de leerling was ingeschreven buiten de in het eerste lid, onderdeel
      *b*, bedoelde periode, dan wel in het geval, bedoeld in het eerste lid, onderdeel *c*, indien hem bekend is op
      welke instelling als bedoeld in [artikel 1, onderdeel ][ref2] de leerling was ingeschreven, onder vermelding
      van de datum van inschrijving op zijn school, binnen 1 week schriftelijk mededeling van de inschrijving aan de
      directeur, rector of centrale directie van de school, de school voor ander onderwijs of de instelling, bedoeld in
      [artikel 1, onderdeel ][ref3] waarop de leerling voordien was ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '1'
  - number: '7.1'
    text: |-
      De directeur van een school op wiens school de leerling staat ingeschreven, schrijft de leerling, indien deze de
      school verlaat, uit met ingang van de dag volgende op de dag waarop de leerling de school voor het laatst heeft
      bezocht en verstrekt de leerling een bewijs van uitschrijving.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel7
  - number: '7.2'
    text: |-
      Indien de directeur van een school op wiens school de leerling staat ingeschreven binnen 4 weken na de dag
      waarop de leerling de school voor het laatst heeft bezocht een mededeling ontvangt van de directeur, rector of
      centrale directie van een school of een school voor ander onderwijs, van de inschrijving van de leerling op diens
      school, wijzigt de directeur de datum van uitschrijving, bedoeld in het eerste lid, alsnog in de datum van de dag
      voorafgaande aan de inschrijving op de andere school of de school voor ander onderwijs.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel7
  - number: '8.1'
    text: |-
      Onverminderd het bepaalde in artikel [artikel 41, negende lid, van de wet][ref1], blijven de gegevens die
      in de leerlingenadministratie zijn opgenomen daarvan in ieder geval deel uitmaken gedurende 5 jaar nadat de
      desbetreffende leerling van de school is uitgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '41'
  - number: '8.2'
    text: |-
      Het gemeenschappelijk rapport, bedoeld in [artikel 41, zesde lid, van de wet][ref1], wordt in elk geval binnen acht
      weken na het verstrijken van de termijn, bedoeld in het eerste lid, vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '41'
  - number: '9.1'
    text: |-
      Voor de toepassing van het bepaalde in de wet worden, onverminderd het bepaalde in [artikel 7][ref1],
      en [artikel 10, vijfde lid][ref2], de leerlingen op een school meegeteld die toelaatbaar zijn verklaard
      tot een van de onderwijssoorten die door de school worden verzorgd dan wel tot het cluster, bedoeld in
      [artikel 2, vierde lid onder d, van de wet][ref3], waartoe de school behoort en die op een teldatum op die school
      staan ingeschreven, tenzij zij vanaf het begin van het schooljaar tot de teldatum meer dan de helft van het aantal
      schooldagen zonder geldige reden hebben verzuimd.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '7'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004259
        artikel: '10'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '9.2'
    text: |-
      Voor de toepassing van het eerste lid wordt ten aanzien van de leerplichtige leerling als geldige reden aangemerkt
      een vrijstelling van geregeld schoolbezoek als bedoeld in de [Leerplichtwet 1969][ref1] (*Stb.* 1971, 406). Ten
      aanzien van de niet-leerplichtige leerling worden als geldige reden aangemerkt dezelfde gronden als die welke
      leiden tot een vrijstelling als bedoeld in de vorige volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: '9.3'
    text: |-
      Indien een teldatum valt op een dag waarop geen onderwijs wordt gegeven, worden op de eerstvolgende schooldag de
      leerlingen geteld, die op de teldatum stonden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel9
  - number: '9.4'
    text: Een leerling kan slechts op 1 school voor de bekostiging meetellen.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel9
  - number: '10.1'
    text: |-
      Binnen 2 weken na een teldatum zendt het bevoegd gezag van een school aan Onze Minister, de inspecteur,
      gedeputeerde staten en, indien het een bijzondere school betreft, eveneens aan burgemeester en wethouders, een
      opgave van het aantal leerlingen overeenkomstig het bepaalde in [artikel 9][ref1]. De opgave, bedoeld in de eerste
      volzin dient onderverdeeld te zijn in leerlingen, bedoeld in de begripsomschrijving van leerlingen met een niet-
      Nederlandse culturele achtergrond in [artikel 1 van het Formatiebesluit WEC][ref2] en overige leerlingen. Indien de
      school een nevenvestiging heeft, wordt de opgave tevens onderverdeeld in de leerlingen van de hoofdvestiging en de
      leerlingen van elk van de nevenvestigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005442#Artikel1
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '9'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005442
        artikel: '1'
  - number: '10.2'
    text: |-
      Indien op 16 januari de formatie opnieuw wordt berekend op grond van [artikel 9 van het Formatiebesluit WEC][ref1],
      doet het bevoegd gezag binnen 2 weken nadat de formatie opnieuw is berekend mededeling van het aantal leerlingen
      waarop de opnieuw berekende formatie is gebaseerd, aan Onze Minister, de inspecteur, en indien het een bijzondere
      school betreft, eveneens aan burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel9
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005442
        artikel: '9'
  - number: '10.3'
    text: |-
      Indien de datum, genoemd in het tweede lid, valt op een dag waarop geen onderwijs wordt gegeven, worden op de
      eerstvolgende schooldag de leerlingen geteld die op die datum stonden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel10
  - number: '10.4'
    text: Bij ministeriële regeling wordt vastgesteld op welke wijze de opgave, bedoeld in het eerste lid, wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel10
  - number: '10.5'
    text: |-
      Indien als gevolg van de wijzigingen op grond van [artikel 7][ref1] een wijziging optreedt in de in het eerste
      lid bedoelde opgave, doet het bevoegd gezag van de school waarvan de leerling is respectievelijk leerlingen zijn
      uitgeschreven, binnen 6 weken na de teldatum daarvan mededeling aan Onze Minister, de inspecteur, gedeputeerde
      staten en, indien het een bijzondere school betreft, eveneens aan burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel7
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '7'
        hoofdstuk: I
  - number: 10a.1
    text: |-
      Voor 15 oktober zendt het regionaal expertisecentrum aan Onze Minister, een opgave van het aantal leerlingen dat
      in de periode van 12 maanden direct voorafgaand aan 1 oktober een bevestigende beoordeling als bedoeld in [artikel
      28c, eerste lid, van de wet](onbekend), heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel10a
  - number: 10a.2
    text: Bij ministeriële regeling wordt vastgesteld op welke wijze de opgave, bedoeld in het eerste lid, wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel10a
  - number: '11.1'
    text: |-
      Het bevoegd gezag van een bijzondere school, niet zijnde een instelling, draagt zorg voor een overzichtelijke en
      deugdelijke administratie van de financiële gegevens van elk van de onder zijn beheer staande scholen.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11
  - number: '11.2'
    text: |-
      De administratie van elke bijzondere school, niet zijnde een instelling, omvat alle ontvangsten, gesplitst
      naar de ontvangsten ingevolge de[ artikelen 113][ref1], [127][ref2], [128][ref3], [129][ref4], [131][ref5],
      [133 tot en met 142][ref6] en [159, derde lid][ref7], van de wet en de overige ontvangsten, en alle uitgaven
      onderscheiden naar:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel127
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel128
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel129
      [ref5]: https://wetten.overheid.nl/BWBR0003549#Artikel131
      [ref6]: https://wetten.overheid.nl/BWBR0003549#Artikel133
      [ref7]: https://wetten.overheid.nl/BWBR0003549#Artikel159
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '113'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '127'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '128'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '129'
      - id: ref5
        bwb_id: BWBR0003549
        artikel: '131'
      - id: ref6
        bwb_id: BWBR0003549
        artikel: '133'
      - id: ref7
        bwb_id: BWBR0003549
        artikel: '159'
  - number: 11.2.a
    text: personele uitgaven;
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11
  - number: 11.2.b
    text: |-
      de uitgaven voor materiële voorzieningen ten behoeve van de instandhouding onderverdeeld in de onderdelen van de
      programma’s van eisen genoemd in [artikel 112, eerste lid][ref1], van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
  - number: 11.2.c
    text: uitgaven ten behoeve van voorzieningen in de huisvesting;
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11
  - number: 11.2.d
    text: uitgaven ten behoeve van onderwijs in allochtone levende talen.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11
  - number: '11.3'
    text: 'De administratie van elke bijzondere school, niet zijnde een instelling, omvat een overzicht van:'
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11
  - number: 11.3.a
    text: vorderingen,
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11
  - number: 11.3.b
    text: schulden,
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11
  - number: 11.3.c
    text: reserveringen.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11
  - number: '11.4'
    text: |-
      Aan het einde van ieder kalenderjaar wordt voor elke bijzondere school, niet zijnde een instelling, een overzicht
      van de in de school aanwezige inventaris opgemaakt en in de administratie opgenomen waaruit in ieder geval blijkt
      in welk jaar de aanschaffing heeft plaatsgevonden en welke inventaris voor eigen rekening is aangeschaft.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11
  - number: '11.5'
    text: |-
      Aan het einde van ieder kalenderjaar wordt voor elke bijzondere school, niet zijnde een instelling, een overzicht
      opgesteld en in de administratie van de school opgenomen van alle uitgaven en ontvangsten die op het desbetreffende
      kalenderjaar betrekking hebben volgens de in het tweede lid aangegeven verdeling. In dit overzicht dient in
      elk geval aangegeven te worden tot welk bedrag uitgaven ten laste van onderscheidenlijk de rijksvergoeding,
      gemeentelijke vergoedingen of eigen middelen zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11
  - number: '11.6'
    text: |-
      Het bevoegd gezag van een bijzondere instelling draagt zorg voor een zodanige administratie van de financiële
      gegevens van elk van de onder zijn beheer staande instellingen, dat daarmee een financiële jaarverslaggeving als
      bedoeld in [artikel 69 van de wet][ref1] kan worden opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel69
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '69'
  - number: 11a.1
    text: |-
      Het regionaal expertisecentrum draagt zorg voor een overzichtelijke en deugdelijke administratie van de financiële
      gegevens.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11a
  - number: 11a.2
    text: |-
      De administratie omvat alle ontvangsten, gesplitst naar de ontvangsten ingevolge [ artikel 71a](onbekend),
      [131, eerste lid onder b](onbekend), en [133, van de wet](onbekend) en de overige ontvangsten, en alle uitgaven
      onderscheiden naar personele uitgaven, uitgaven voor materiële voorzieningen en uitgaven ten behoeve van
      voorzieningen in de huisvesting.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11a
  - number: 11a.3
    text: |-
      De administratie omvat een overzicht van: - vorderingen,
        - schulden en
        - reserveringen.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11a
  - number: 11a.4
    text: |-
      Aan het einde van ieder kalenderjaar wordt voor het regionaal expertisecentrum een overzicht opgesteld en in de
      administratie opgenomen van alle uitgaven en ontvangsten die op het desbetreffende kalenderjaar betrekking hebben
      volgens de in het tweede lid aangegeven verdeling. In dit overzicht dient in elk geval te worden aangegeven tot
      welk bedrag uitgaven ten laste van onderscheidenlijk de rijksvergoeding of eigen middelen zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel11a
  - number: '12.1'
    text: |-
      [Hoofdstuk III][ref1] is behoudens het gestelde in het tweede lid niet van toepassing op instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004259
        hoofdstuk: III
  - number: '12.2'
    text: |-
      Het Rijk verstrekt elke maand van het uitkeringsjaar in verband met de materiële voorzieningen ten behoeve van
      de instandhouding aan het bevoegd gezag van een instelling, een twaalfde gedeelte van de vergoeding, bedoeld in
      [artikel 128, negende lid][ref1], van de wet, waarop het over dat jaar recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
  - number: '13.1'
    text: |-
      Het Rijk verstrekt elke maand van het uitkeringsjaar in verband met de materiële voorzieningen ten behoeve
      van de instandhouding aan het bevoegd gezag van een school een twaalfde gedeelte van de vergoeding, bedoeld in
      [artikel 128, eerste lid][ref1], van de wet, waarop het over dat jaar recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
  - number: '13.2'
    text: |-
      Indien blijkt dat voor het uitkeringsjaar [artikel 128, zesde lid][ref1], van de wet van toepassing is, wordt het
      verschil tussen de vergoeding, bedoeld in het eerste lid, berekend op grond van [artikel 128, zesde lid][ref2], van
      de wet en de vergoeding berekend op grond van [artikel 128, vierde lid][ref3], van de wet, verstrekt in de maanden
      mei tot en met december van het uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '128'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '128'
  - number: '13.3'
    text: |-
      Indien [artikel 16, zesde lid][ref1], van toepassing is, vindt verrekening plaats van de vergoeding voor dat jaar
      met de vergoeding die wordt verstrekt in de maanden oktober tot en met december van het uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel16
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '16'
        hoofdstuk: III
  - number: '14.1'
    text: |-
      Het normatief bepaalde aantal te huisvesten groepen leerlingen, bedoeld in
      [artikel 128, vierde lid, onder a, en vijfde lid, onder a][ref1], van de wet, wordt voor het jaar waarvoor de
      vergoeding voor de materiële voorzieningen ten behoeve van de instandhouding strekt, berekend door het aantal
      leerlingen van de desbetreffende school en van een of meer daaraan verbonden afdelingen, op 1 oktober van het
      voorafgaande jaar, dan wel indien [artikel 128, zesde lid][ref2], van de wet van toepassing is, het aantal
      leerlingen van de desbetreffende school en afdelingen op 16 januari van dat jaar, te delen door de voor het
      desbetreffende onderwijs geldende factor N van de onderstaande tabel.








                    Factor N voor het speciaal onderwijs


                    Factor N voor het voortgezet speciaal onderwijs




                    Aan:








                    a. dove kinderen


                    6


                    6




                    b. slechthorende kinderen


                    12


                    7




                    c. kinderen met ernstige spraakmoeilijkheden die niet tevens behoren tot de onder a of b bedoelde
      kinderen


                    12


                    7




                    f. lichamelijk gehandicapte kinderen


                    12


                    7




                    h. 1°. langdurig zieke kinderen met een lichamelijke handicap


                    13


                    7




                    2°. langdurig zieke kinderen anders dan met een lichamelijke handicap


                    12


                    7




                    i.






                    j. zeer moeilijk lerende kinderen


                    12


                    12




                    k. zeer moeilijk opvoedbare kinderen


                    12


                    7




                    l.






                    m. kinderen in scholen verbonden aan pedologische instituten


                    12


                    7




                    n. meervoudig gehandicapte kinderen


                    7


                    7


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '128'
  - number: '14.2'
    text: |-
      Het normatief bepaalde aantal te huisvesten groepen leerlingen, bedoeld in het eerste lid, wordt voor het speciaal
      onderwijs en het voortgezet speciaal onderwijs, onderscheidenlijk het onderwijs aan een afdeling, afzonderlijk
      berekend en de uitkomst van de afzonderlijke berekeningen wordt naar boven afgerond op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel14
  - number: '14.3'
    text: |-
      Voor scholen, waaraan formatie als bedoeld in [artikel 117, achtste lid, van de wet][ref1] is toegekend, wordt
      het aantal leerlingen op basis waarvan die formatie is toegekend, voor de toepassing van dit artikel aangemerkt
      als leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
  - number: '15'
    text: |-
      Het aantal groepen leerlingen bedoeld in [artikel 130, derde lid, tweede volzin][ref1], van de wet, wordt berekend
      overeenkomstig [artikel 14][ref2], waarbij de factor N voor het speciaal onderwijs 12 en voor het voortgezet
      speciaal onderwijs 7 is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel14
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '130'
      - id: ref2
        bwb_id: BWBR0004259
        artikel: '14'
        hoofdstuk: III
  - number: '16.1'
    text: |-
      Het bevoegd gezag dient jaarlijks voor 1 juli bij Onze Minister ten behoeve van de vergoeding voor dat jaar voor
      de materiële voorzieningen ten behoeve van de instandhouding, bedoeld in [artikel 128, eerste lid][ref1], van de
      wet, in:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
  - number: 16.1.a.1°
    text: een verklaring van het bevoegd gezag omtrent de juistheid van de gegevens waarop de vergoeding is vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel16
  - number: 16.1.a.2°
    text: |-
      indien de gegevens waarop de vergoeding voor dat jaar is vastgesteld naar het oordeel van het bevoegd gezag onjuist
      zijn, de door het bevoegd gezag gecorrigeerde gegevens,
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel16
  - number: 16.1.b
    text: een verklaring van een accountant omtrent de juistheid van de gegevens, bedoeld in onderdeel *a* onder 1° en 2°.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel16
  - number: '16.2'
    text: |-
      Het bevoegd gezag dient jaarlijks voor 1 juli een verklaring van een accountant omtrent de rechtmatigheid van de
      uitgaven van het voorafgaande jaar, in.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel16
  - number: '16.3'
    text: |-
      Onze Minister stelt jaarlijks voor 1 januari een leidraad vast ten behoeve van de controle door de accountant,
      bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel16
  - number: '16.4'
    text: |-
      Onze Minister stelt jaarlijks voor 1 februari de vergoeding voor dat jaar vast, gebaseerd op de grondslag, bedoeld
      in [artikel 128, vierde lid][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
  - number: '16.5'
    text: |-
      Indien [artikel 128, zesde lid][ref1], van de wet van toepassing is, stelt Onze Minister jaarlijks voor 1 mei de
      vergoeding, bedoeld in het eerste lid, voor dat jaar nader vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
  - number: '16.6'
    text: |-
      Indien de verklaring van de accountant, bedoeld in het eerste lid onderdeel *b*, aanleiding geeft tot wijziging
      van de vergoeding, bedoeld in het eerste lid, stelt Onze Minister voor 1 oktober de vergoeding voor dat jaar nader
      vast.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel16
  - number: '17'
    text: |-
      De uitgaven voor de materiële voorzieningen ten behoeve van de instandhouding voor schoolgebouwen hebben betrekking
      op de programma’s van eisen, bedoeld in [artikel 112, eerste lid][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
  - number: '18'
    text: |-
      De vergoeding voor de materiële voorzieningen ten behoeve van de instandhouding wordt bepaald volgens de
      programma’s van eisen, bedoeld in [artikel 111, derde lid onderdeel ][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
  - number: '19.1'
    text: |-
      De aanspraak op vergoeding voor de uitgaven voor de materiële voorzieningen ten behoeve van de instandhouding van
      een schoolbad ontstaat met ingang van de maand voorafgaand aan de melding aan Onze Minister van de ingebruikneming
      daarvan en eindigt met ingang van de maand volgend op de maand waarin het schoolbad buiten gebruik wordt gesteld.
      Binnen acht weken na de buitengebruikstelling wordt daarvan melding gemaakt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel19
  - number: '19.2'
    text: |-
      Voor de vergoeding, bedoeld in het eerste lid, van een schoolbad waarvan het gebruik niet
      is beëindigd ingevolge [artikel 108][ref1] van de wet, zijn de[ artikelen 13][ref2] en
      [16, eerste tot en met vierde lid en zesde lid][ref3], van overeenkomstige toepassing met dien verstande dat waar
      het betreft [artikel 16, vierde lid][ref4], Onze Minister binnen acht weken na de melding van ingebruikneming,
      bedoeld in het eerste lid, de vergoeding voor dat jaar vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0004259#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0004259#Artikel16
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '108'
      - id: ref2
        bwb_id: BWBR0004259
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004259
        artikel: '16'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0004259
        artikel: '16'
        hoofdstuk: III
  - number: '19.3'
    text: |-
      De uitgaven voor de materiële voorzieningen ten behoeve van de instandhouding van een schoolbad hebben betrekking
      op de programma’s van eisen, bedoeld in [artikel 112, tweede lid][ref1], van de wet en de vergoeding, bedoeld in
      het eerste lid, wordt bepaald door de programma’s van eisen, bedoeld in [artikel 111, derde lid onder b][ref2], van
      de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '111'
  - number: '20'
    text: |-
      Schattingen welke ingevolge dit hoofdstuk dienen plaats te vinden, geschieden door een commissie van 3 deskundigen
      van wie er een wordt benoemd door de Onderwijsraad, een door burgemeester en wethouders en een door het bevoegd
      gezag. De commissie beslist bij meerderheid van stemmen. Indien geen meerderheid wordt verkregen, wordt de
      waarde bepaald op het gemiddelde van de 3 schattingsopgaven. Afschrift van de beslissing wordt gezonden aan het
      gemeentebestuur en het bevoegd gezag. De kosten van de schattingen komen ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel20
  - number: '21'
    text: |-
      De vergoedingen, bedoeld in de titels II en III, zijn niet langer verschuldigd wanneer de gemeente de eigendom
      van het terrein en gebouw verkrijgt of wanneer het terrein en gebouw niet meer voor het speciaal onderwijs of het
      voortgezet speciaal onderwijs, bedoeld in [artikel 2][ref1] van de wet, wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '22.1'
    text: |-
      Voor de terreinen en gebouwen die eigendom zijn van het bevoegd gezag van een bijzondere school en op 1 januari
      1921 in gebruik of in aanbouw waren, betaalt de gemeente jaarlijks aan het desbetreffende bevoegd gezag een
      vergoeding, berekend over de waarde van de terreinen, gebouwen en het meubilair zoals deze ingevolge de Lager-
      onderwijswet 1920 is geschat. In afwijking van het bepaalde in de vorige volzin wordt voor gebouwen die niet
      uitsluitend zijn bestemd voor speciaal onderwijs, voortgezet speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs als bedoeld in [artikel 2][ref1] van de wet, de vergoeding berekend over 80 procent van het voor het
      desbetreffende gebouw ingevolge de Lager-onderwijswet 1920 geschatte bedrag. De vergoeding wordt op gelijke wijze
      uitbetaald aan een bevoegd gezag dat na 1 januari 1921 de eigendom van terreinen en gebouwen van een bijzondere
      school die op 1 januari 1921 in gebruik of in aanbouw waren, heeft verkregen of verkrijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '22.2'
    text: |-
      Voor de toepassing van dit artikel worden onder gebouwen in aanbouw verstaan de gebouwen van een bijzondere school
      waarvan de ontwerpen voor 1 januari 1921 overeenkomstig artikel 1 van het koninklijk besluit van 25 juni 1912
      (*Stb.* 193) bij het rijksschooltoezicht werden ingediend en die voor 1 juli 1923 zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel22
  - number: '23.1'
    text: |-
      De vergoeding, bedoeld in [artikel 22][ref1], bedraagt 5 procent van de geschatte waarde, onderscheidenlijk het
      in de tweede volzin van het eerste lid van dat artikel bedoelde bedrag waarover de vergoeding dient te worden
      berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel22
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '22'
        hoofdstuk: IV
  - number: '23.2'
    text: |-
      Het gemeentebestuur kan, op verzoek van het bevoegd gezag van de bijzondere school, bepalen dat in verband met
      de op het bevoegd gezag rustende geldelijke verplichtingen, gedurende een door hem vast te stellen termijn de
      vergoeding naar een hoger percentage zal worden berekend.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel23
  - number: '24.1'
    text: |-
      Indien voor de bouw van nieuwe lokalen gebruik wordt gemaakt van een gebouw of terrein als bedoeld in
      [artikel 22][ref1], of indien overeenkomstig [artikel 108 van de wet][ref2] is vastgesteld dat een gedeelte van een
      zodanig gebouw of terrein ten gevolge van het in gebruik nemen van nieuwe of andere lokalen blijvend niet meer voor
      de school wordt gebruikt, wordt de geschatte waarde, bedoeld in dat artikel, verminderd met de geschatte waarde
      van de niet meer gebruikte lokalen, en wordt over het verschil de vergoeding opnieuw berekend. De nieuw berekende
      vergoeding gaat in op het tijdstip waarop de lokalen buiten gebruik zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel108
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '22'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '108'
  - number: '24.2'
    text: |-
      Indien het meubilair in gebouwen als bedoeld in [artikel 22][ref1] wordt vervangen, wordt de geschatte waarde,
      bedoeld in dat artikel, verminderd met het bedrag waarop de waarde van het oude meubilair was bepaald, en wordt
      over het verschil de vergoeding opnieuw berekend. De nieuw berekende vergoeding gaat in op het tijdstip van
      ingebruikneming van het nieuwe meubilair.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel22
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '22'
        hoofdstuk: IV
  - number: '26.1'
    text: |-
      Wanneer de gebouwen en terreinen, bedoeld in [artikel 22][ref1], anders dan ingevolge [artikel 58][ref2] van
      de wet worden vervreemd, of zodra voor die gebouwen en terreinen overeenkomstig [artikel 108 van de wet][ref3]
      is vastgesteld dat zij blijvend niet meer voor het onderwijs aan de school worden gebruikt, betaalt het bevoegd
      gezag van een bijzondere school aan de gemeente terug het bedrag dat de gemeente aan uitbreiding, verbouwing of
      vernieuwing van het gebouw en terrein op grond van de bepalingen van de Lager-onderwijswet 1920 of de Overgangswet
      ISOVSO zoals luidend op 31 december 1996 heeft uitgegeven, verminderd, behoudens voor zover het betreft door
      de gemeente bekostigde grond, met 2 procent voor wat betreft de uitbreiding en met 5 procent voor wat betreft
      de verbouwing of de vernieuwing, voor elk vol jaar dat is verstreken vanaf het tijdstip waarop de uitgaven zijn
      gedaan. De terugbetaling kan in termijnen plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel108
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '22'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '58'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '108'
  - number: '26.2'
    text: |-
      Het bevoegd gezag van een bijzondere school betaalt aan de gemeente terug het bedrag dat de gemeente aan
      uitbreiding, algehele aanpassing, partiële aanpassing, ingrijpend onderhoud of energiebesparende maatregelen op
      grond van de bepalingen van de [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1]
      zoals die luidde op 31 december 1996 heeft uitgegeven, verminderd, behoudens voor zover het betreft door de
      gemeente bekostigde grond, met de ten behoeve van een voorziening als de onderhavige voor de desbetreffende school
      door het Rijk aan de gemeente verstrekte vergoedingen. De terugbetaling kan in termijnen plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '26.3'
    text: |-
      Het bevoegd gezag van een bijzondere school betaalt aan de gemeente terug het bedrag dat de gemeente heeft
      uitgegeven aan de voorzieningen, bedoeld in [artikel 90, eerste lid, onderdelen a 2°, b en c, van de wet][ref1],
      verminderd met de uit de gemeentebegroting blijkende afschrijving op het moment van de in het eerste lid bedoelde
      vaststelling van de buitengebruikstelling, behoudens voor zover het betreft door de gemeente bekostigde grond,
      voor elk vol jaar dat is verstreken sedert het tijdstip waarop de uitgaven plaats hadden. De terugbetaling kan in
      termijnen plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel90
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '90'
  - number: '26.4'
    text: |-
      Binnen vier weken na de vervreemding of nadat de buitengebruikstelling overeenkomstig
      [artikel 108 van de wet][ref1] is vastgesteld, draagt het bevoegd gezag van een bijzondere school de roerende
      zaken, behoudens die welke het bevoegd gezag uit eigen middelen heeft aangeschaft, aan de gemeente in eigendom
      over.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel108
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '108'
  - number: '26.5'
    text: |-
      Indien het bevoegd gezag in de onmogelijkheid verkeert het gebouw en terrein tegen een zodanige prijs te verkopen
      of op andere wijze daaruit zodanige inkomsten te verwerven, dat uit de opbrengst het verschuldigde bedrag kan
      worden terugbetaald, kan het bevoegd gezag aan zijn verplichtingen voldoen door overdracht van het gebouw en
      terrein aan de gemeente, dan wel door betaling aan de gemeente van een door gedeputeerde staten vast te stellen
      vergoeding.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel26
  - number: '27.1'
    text: |-
      Voor de gebouwen en terreinen waarvoor voor 1 januari 1989 vergoeding werd genoten op grond van artikel 184
      van het Besluit buitengewoon onderwijs 1967, betaalt de gemeente jaarlijks aan het bevoegd gezag een vergoeding
      gelijk aan het bedrag dat voor huur van de gebouwen en terreinen, met inbegrip van de inrichting, het meubilair
      en het onderwijsleerpakket, redelijk is te achten, verminderd met de kosten van instandhouding van het gebouw. De
      vergoeding bedraagt niet meer dan het bedrag dat een redelijke vergoeding oplevert voor een overeenkomstige school,
      bestemd voor hetzelfde aantal leerlingen, die in normale omstandigheden verkeert. De vergoeding wordt in overleg
      tussen burgemeester en wethouders en het bevoegd gezag vastgesteld. Indien voor gebouw en terrein, met inbegrip van
      de inrichting, het meubilair en het onderwijsleerpakket, een vergoeding uit de openbare kassen is of wordt genoten,
      wordt de vergoeding dienovereenkomstig verminderd.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel27
  - number: '27.2'
    text: |-
      Aan het bevoegd gezag van een school, niet zijnde een instelling, waarvoor de in het eerste lid bedoelde vergoeding
      wordt betaald, verstrekt het Rijk jaarlijks een bedrag ter bestrijding van de kosten van de school waarvoor de in
      het eerste lid bedoelde vergoeding niet is bestemd. De [titels I tot en met III van hoofdstuk III][ref1] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004259
        hoofdstuk: III
  - number: '28.1'
    text: |-
      Indien het bevoegd gezag, bedoeld in [artikel 27][ref1], eigenaar is van het gebouw en terrein, en het gebouw en
      terrein niet meer voor het speciaal onderwijs, het voortgezet speciaal onderwijs of het speciaal en voortgezet
      speciaal onderwijs als bedoeld in [artikel 2][ref2] van de wet worden gebruikt, dan wel het gebouw en terrein na 1
      september 1987 zijn of worden vervreemd, betaalt het bevoegd gezag voor elk jaar dat de gemeente met betrekking tot
      het gebouw en terrein een vergoeding heeft verstrekt, doch voor ten hoogste 40 jaren, aan de gemeente 1/40 deel van
      de waarde van het gebouw en terrein in het economisch verkeer, met dien verstande dat de gemeenteraad kan besluiten
      in verband met eigen investeringen van het bevoegd gezag een lagere waarde vast te stellen. Indien toepassing
      is gegeven aan [artikel VI, vierde lid, van de wet van 2 april 1998, Stb. 228][ref3], wordt de gemeente geacht
      gedurende 40 jaren een vergoeding met betrekking tot het gebouw en terrein te hebben verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009525#ArtikelVI
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '27'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0009525
        artikel: VI
  - number: '28.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan het bevoegd gezag de eigendom van het gebouw overdragen aan
      de gemeente.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel28
  - number: '30.1'
    text: 'De aanspraak op vergoeding voor de uitgaven voor het personeel, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel30
  - number: 30.1.a
    text: de uitgaven voor het personeel dat is aangesteld ten laste van het formatiebudget,
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel30
  - number: 30.1.b
    text: de geldswaarde van niet verbruikte formatierekeneenheden, en
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel30
  - number: 30.1.c
    text: |-
      de vergoedingen voor de kosten van vervanging van personeel en voor de kosten van werkloosheidsuitkeringen of
      herplaatsingswachtgelden, bedoeld in [artikel 131, eerste lid][ref1], van de wet, met uitzondering van de uitgaven
      voor het personeel, bedoeld in [artikel 49, tweede lid][ref2], ontstaat met ingang van de eerste kalenderdag van
      het schooljaar waarin de bekostiging van een nieuw geopende school begint.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel49
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
      - id: ref2
        bwb_id: BWBR0004259
        artikel: '49'
        hoofdstuk: VII
  - number: '30.2'
    text: |-
      Indien het bevoegd gezag voor de opening van een nieuwe school, niet zijnde een instelling, op grond van
      [artikel 10 van het Formatiebesluit WEC][ref1] aan die school een directeur heeft benoemd of aan die school de
      overige leden van de commissie, een administratief medewerker of een psychologisch assistent heeft verbonden en
      Onze Minister op grond van dat artikel niet anders heeft besloten, ontstaat, in afwijking van het eerste lid, de
      aanspraak op vergoeding voor de uitgaven voor die functionarissen ten hoogste acht weken voor de eerste kalenderdag
      van het schooljaar waarin de bekostiging begint van de nieuw geopende school. Indien het bevoegd gezag voor de
      opening van een nieuwe instelling werkzaamheden verricht ten behoeve van de start van de instelling ontstaat de
      aanspraak op de vergoeding, bedoeld in [artikel 26b van het Formatiebesluit WEC][ref2], acht weken voor de eerste
      kalenderdag van het schooljaar waarin de bekostiging begint van de nieuw geopende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005442#Artikel26b
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005442
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005442
        artikel: 26b
  - number: '30.3'
    text: |-
      De in het tweede lid, eerste volzin, bedoelde aanspraak op vergoeding voor de uitgaven van de daarin genoemde
      functionarissen, met uitzondering van de directeur, wordt gebaseerd op het aantal leerlingen dat op de eerste
      teldatum is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel30
  - number: '31.1'
    text: |-
      Onze Minister verstrekt jaarlijks in de maand maart aan het bevoegd gezag van een school ten behoeve van de
      berekening van een voorschot op de vergoeding, bedoeld in [artikel 131, eerste lid][ref1], van de wet, een
      overzicht van de voor die school beschikbare formatierekeneenheden met ingang van het schooljaar volgend op de
      maand waarin het overzicht is verstrekt. Het overzicht is gebaseerd op het door het bevoegd gezag van die school
      opgegeven aantal leerlingen op de teldatum.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
  - number: '31.2'
    text: |-
      Onze Minister verstrekt jaarlijks voor 1 juli aan het bevoegd gezag van een school een overzicht van beschikbare
      formatierekeneenheden, waarin de beslissingen van het bevoegd gezag met betrekking tot overdracht van
      formatierekeneenheden en verzilvering van niet-verbruikte formatierekeneenheden, voor zover die voor 15 mei daaraan
      voorafgaand aan Onze Minister zijn gemeld, zijn verwerkt.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel31
  - number: '32'
    text: |-
      Het Rijk verstrekt elke maand van het uitkeringsjaar in verband met de uitgaven voor het personeel aan het bevoegd
      gezag van een school een voorschot op de vergoeding, bedoeld in [artikel 131, eerste lid][ref1], van de wet,
      waarvan de hoogte afhankelijk is van de te verwachten vergoeding voor die maand.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
  - number: '33'
    text: |-
      Voor de wijze van uitkering van de voorschotten op de vergoeding voor de uitgaven voor het personeel, bedoeld in
      [artikel 131, eerste lid][ref1], van de wet, wordt onderscheid gemaakt in:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
  - number: 33.a
    text: |-
      een bevoegd gezag van een school dat deelneemt aan een bij ministeriële regeling toegestaan systeem van
      automatisering van de salarisadministratie inzake het speciaal onderwijs en het voortgezet speciaal onderwijs als
      bedoeld in [artikel 2][ref1] van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 33.b
    text: een bevoegd gezag van een school dat niet deelneemt aan een systeem als bedoeld in onderdeel *a*.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel33
  - number: '34.1'
    text: |-
      Het bevoegd gezag van een school als bedoeld in [artikel 33 onderdeel ][ref1], verstrekt bij benoeming
      van een personeelslid ten behoeve van de vaststelling van het voorschot op de vergoeding, bedoeld in
      [artikel 131, eerste lid onderdeel ][ref2], van de wet, de gegevens die nodig zijn voor het bepalen van het
      voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '33'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '131'
  - number: '34.2'
    text: |-
      Ingeval in de gegevens, bedoeld in het eerste lid, wijziging optreden, doet een bevoegd gezag binnen vier weken
      mededeling daarvan aan het systeem waaraan het deelneemt.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel34
  - number: '35.1'
    text: |-
      Het bevoegd gezag van een school als bedoeld in [artikel 33 onderdeel b][ref1], verstrekt jaarlijks voor een bij
      ministeriële regeling te bepalen tijdstip, ten behoeve van de vaststelling van het voorschot op de vergoeding,
      bedoeld in [artikel 131, eerste lid][ref2], van de wet, aan Onze Minister de gegevens betreffende het personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '33'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '131'
  - number: '35.2'
    text: |-
      Ingeval in de gegevens, bedoeld in het eerste lid, wijzigingen optreden, doet het bevoegd gezag binnen vier weken
      mededeling daarvan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel35
  - number: '36.1'
    text: |-
      Indien de voor de bekostiging benodigde gegevens niet tijdig aan Onze Minister zijn verstrekt, kan Onze Minister
      bepalen dat de verstrekking van het voorschot op de vergoeding, bedoeld in [artikel 131, eerste lid][ref1], van de
      wet geheel of gedeeltelijk wordt opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
  - number: '36.2'
    text: |-
      De verstrekking van het voorschot wordt zo spoedig mogelijk hervat, doch in ieder geval niet later dan in de tweede
      maand volgende op de maand, waarin de benodigde gegevens door het bevoegd gezag zijn verstrekt. Tevens wordt het
      gedeelte van het voorschot dat als gevolg van de toepassing van het eerste lid niet is verstrekt, ter beschikking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel36
  - number: '37'
    text: |-
      Bij ministeriële regeling worden nadere voorschriften gegeven omtrent de wijze waarop het voorschot, bedoeld in
      [artikel 32][ref1], wordt aangevraagd, vastgesteld en verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel32
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '32'
        hoofdstuk: V
  - number: '38'
    text: |-
      De vergoeding, bedoeld in [artikel 131, eerste lid][ref1], van de wet, wordt aan de hand van de totale omvang van
      de formatie, bedoeld in [artikel 93][ref2] van de wet, voor de school afzonderlijk vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel93a
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 93a
  - number: '40.1'
    text: |-
      Indien het bedrag aan voorschotten als bedoeld in [artikel 32][ref1] in een uitkeringsjaar hoger is dan de
      vergoeding, stort het bevoegd gezag onverwijld het verschil terug in ’s Rijks kas, tenzij Onze Minister bepaalt dat
      verrekening plaatsvindt met nog uit te keren vergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel32
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '32'
        hoofdstuk: V
  - number: '40.2'
    text: |-
      Indien het bedrag van de vergoedingen hoger is dan de dienaangaande verstrekte voorschotten, vergoedt het Rijk aan
      het bevoegd gezag onverwijld het verschil.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel40
  - number: '40.3'
    text: |-
      Onze Minister kan voorafgaand aan het vaststellen van een vergoeding een vergoeding voorlopig vaststellen en op de
      voet van het eerste en het tweede lid tot voorlopige verrekening overgaan.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel40
  - number: '41'
    text: |-
      Ten aanzien van de wijze van uitkering van de vergoeding, bedoeld in [artikel 131, eerste lid][ref1], van de wet,
      is [artikel 33][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel33
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
      - id: ref2
        bwb_id: BWBR0004259
        artikel: '33'
        hoofdstuk: V
  - number: '42.1'
    text: |-
      Het bevoegd gezag verstrekt jaarlijks voor 1 juli aan Onze Minister ten behoeve van de afrekening van de vergoeding
      voor uitgaven voor het personeel, bedoeld in [artikel 131, eerste lid][ref1], van de wet:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
  - number: 42.1.a
    text: |-
      over het voorafgaande jaar de gegevens betreffende het personeel dat is aangesteld ten laste van het
      formatiebudget;
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel42
  - number: 42.1.b
    text: |-
      een verklaring van het bevoegd gezag omtrent de juistheid alsmede de tijdige aanmelding van de gegevens waarop de
      voorschotbedragen en de vergoedingsbedragen zijn of worden gebaseerd;
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel42
  - number: 42.1.c
    text: een verklaring van een accountant van de juistheid van de gegevens, bedoeld in onderdeel *b*;
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel42
  - number: 42.1.d
    text: het in het derde lid bedoelde overzicht vergezeld van een opgave van eventuele mutaties in de gegevens.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel42
  - number: '42.2'
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 januari ten behoeve van de afrekening, bedoeld in dit artikel,
      vastgesteld:
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel42
  - number: 42.2.a
    text: de leidraad ten behoeve van de controle door de accountant;
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel42
  - number: 42.2.b
    text: de formulieren betreffende de verklaringen bedoeld in het eerste lid onderdelen *b* en *c*;
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel42
  - number: 42.2.c
    text: het formulier voor de verstrekking van de gegevens bedoeld in het eerste lid onderdeel *a*.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel42
  - number: '42.3'
    text: |-
      Ten behoeve van de afrekening van de vergoeding verstrekt Onze Minister jaarlijks voor 1 februari overzichten per
      school betreffende formatierekeneenheden en verstrekte voorschotten.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel42
  - number: '42.4'
    text: |-
      Onze Minister besluit binnen twee jaren na 1 juli van het jaar waarin de gegevens bedoeld in het eerste lid zijn
      ingediend, op de afrekening van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel42
  - number: '43.1'
    text: |-
      Indien het verzoek, bedoeld in [artikel 117, vierde lid][ref1], van de wet, van het bevoegd gezag is ingewilligd,
      verstrekt dit bevoegd gezag een raming van de te verwachten uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
  - number: '43.2'
    text: |-
      Indien het bevoegd gezag verzoekt om een voorschot, zijn de[ artikelen 32 tot en met 40][ref1] van overeenkomstige
      toepassing. Voor de vaststelling van de vergoeding zijn de[ artikelen 38 tot en met 42][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel38
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '32'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004259
        artikel: '38'
        hoofdstuk: V
  - number: '43.3'
    text: |-
      In afwijking van het bepaalde in het tweede lid kan Onze Minister bepalen, dat wordt afgeweken van een maandelijkse
      bevoorschotting.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel43
  - number: '44.1'
    text: |-
      De aanspraak op de vergoeding voor de uitgaven voor nascholing van het personeel, bedoeld in [artikel 125][ref1]
      van de wet, ontstaat met ingang van de eerste kalenderdag van het schooljaar waarin de bekostiging van een nieuw
      geopende school begint.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel125
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '125'
  - number: '44.2'
    text: |-
      Indien de situatie, bedoeld in [artikel 10 van het Formatiebesluit WEC][ref1], zich voordoet, ontstaat in afwijking
      van het eerste lid de aanspraak op de vergoeding voor de uitgaven voor nascholing ten hoogste acht weken voor de
      eerste kalenderdag van het schooljaar waarin de bekostiging begint van een nieuw geopende school.


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel10
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005442
        artikel: '10'
  - number: '45.1'
    text: |-
      Het Rijk verstrekt in de maanden januari en augustus van het uitkeringsjaar in verband met de kosten voor
      nascholing van het personeel aan het bevoegd gezag van een school onderscheidenlijk 7/12 gedeelte en 5/12 gedeelte
      van de vergoeding, bedoeld in [artikel 125][ref1] van de wet, waarop het bevoegd gezag over dat jaar recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel125
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '125'
  - number: '45.2'
    text: |-
      Indien het eerste lid voor het eerst toepassing vindt op een school als bedoeld in [artikel 44][ref1] omvat het
      bedrag, bedoeld in het eerste lid, tevens de vergoeding voor het tijdvak vanaf de datum waarop de aanspraak op de
      vergoeding is ontstaan, tot de eerste dag van de maand waarin de verstrekking plaats vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel44
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '44'
        hoofdstuk: VI
  - number: '46'
    text: |-
      De vergoeding, bedoeld in [artikel 125][ref1] van de wet, wordt voor de school afzonderlijk vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel125
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '125'
  - number: '47.1'
    text: |-
      Het bevoegd gezag verstrekt Onze Minister jaarlijks voor 1 juli in verband met de terugstorting van niet bestede
      gelden voor nascholing, bedoeld in [artikel 126][ref1] van de wet:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel126
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '126'
  - number: 47.1.a
    text: een opgave van de in de laatste drie jaren ontvangen vergoedingen voor nascholing,
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel47
  - number: 47.1.b
    text: een opgave van het bedrag dat het fonds, bedoeld in artikel 126 van de wet, omvat,
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel47
  - number: 47.1.c
    text: |-
      indien het bedrag, bedoeld onder onderdeel *b*, groter is dan het bedrag, bedoeld onder onderdeel *a*, een opgave
      van het verschil,
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel47
  - number: 47.1.d
    text: |-
      een verklaring van het bevoegd gezag omtrent de juistheid van de opgaven, bedoeld onder de onderdelen *a*, *b* en
      *c*, en
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel47
  - number: 47.1.e
    text: een verklaring van een accountant omtrent de juistheid van de opgaven, bedoeld onder de onderdelen *a*, *b* en *c*.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel47
  - number: '47.2'
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 januari in verband met de terugstorting van niet bestede gelden
      voor nascholing, bedoeld in [artikel 126][ref1] van de wet, vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel126
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '126'
  - number: 47.2.a
    text: de leidraad ten behoeve van de controle door de accountant,
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel47
  - number: 47.2.b
    text: de formulieren voor de verstrekking van de gegevens, bedoeld in het eerste lid onderdelen *a*, *b* en *c*, en
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel47
  - number: 47.2.c
    text: de formulieren betreffende de verklaringen, bedoeld in het eerste lid onderdelen *d* en *e*.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel47
  - number: '48'
    text: |-
      [Hoofdstuk VII][ref1] is niet van toepassing op instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004259
        hoofdstuk: VII
  - number: '49.1'
    text: |-
      De aanspraak op vergoeding voor de uitgaven voor de ambulante begeleiding, bedoeld in
      [artikel 11 van het Formatiebesluit WEC][ref1], ontstaat met ingang van de eerste dag van het schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel11
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005442
        artikel: '11'
  - number: '49.2'
    text: |-
      De aanspraak op de vergoeding voor uitgaven voor ambulante begeleiding, voorzover deze niet onder het eerste lid
      vallen, ontstaat met ingang van de eerste dag van de maand waarin de begeleiding aanvangt.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel49
  - number: '50'
    text: |-
      Het bevoegd gezag van een school die de ambulante begeleiding verzorgt, zendt binnen twee weken na de teldatum aan
      Onze Minister, de inspecteur en, indien het een bijzondere school betreft, eveneens aan burgemeester en wethouders,
      een overzicht van het aantal leerlingen dat op die teldatum werd begeleid.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel50
  - number: '51'
    text: |-
      Op verzoek van het bevoegd gezag van een school verstrekt Onze Minister een voorschot voor de salarisuitgaven voor
      ambulante begeleiding. De [artikelen 32 tot en met 37][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel32
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '32'
        hoofdstuk: V
  - number: '52'
    text: |-
      Voor de vaststelling van de vergoeding voor de salarisuitgaven voor de ambulante begeleiding is [artikel 38][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel38
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '38'
        hoofdstuk: V
  - number: '53'
    text: |-
      Ten aanzien van de verrekening met de vergoeding is [artikel 40][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel40
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: '40'
        hoofdstuk: V
  - number: '54.1'
    text: |-
      Het bevoegd gezag verstrekt jaarlijks voor 1 juli aan Onze Minister ten behoeve van de vaststelling van de
      vergoeding voor de salarisuitgaven voor de ambulante begeleiding:
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel54
  - number: 54.1.a
    text: over het voorafgaande jaar de gegevens betreffende het personeel;
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel54
  - number: 54.1.b
    text: |-
      een verklaring van het bevoegd gezag omtrent de juistheid alsmede de tijdige aanmelding van de gegevens waarop de
      voorschotbedragen en de vergoedingsbedragen zijn of worden gebaseerd;
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel54
  - number: 54.1.c
    text: een verklaring van een accountant van de juistheid van de gegevens, bedoeld in onderdeel *b*;
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel54
  - number: 54.1.d
    text: het in het derde lid bedoelde overzicht vergezeld van een opgave van eventuele mutaties in de gegevens.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel54
  - number: '54.2'
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 januari ten behoeve van de vaststelling van de vergoeding,
      bedoeld in dit artikel, vastgesteld:
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel54
  - number: 54.2.a
    text: de leidraad ten behoeve van de controle door de accountant;
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel54
  - number: 54.2.b
    text: de formulieren betreffende de verklaringen bedoeld in het eerste lid onderdelen *b* en *c*;
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel54
  - number: 54.2.c
    text: het formulier voor de verstrekking van de gegevens bedoeld in het eerste lid onderdeel *a*.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel54
  - number: '54.3'
    text: |-
      Ten behoeve van de afrekening van de vergoeding verstrekt Onze Minister jaarlijks voor 1 februari overzichten per
      school betreffende formatierekeneenheden en verstrekte voorschotten.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel54
  - number: '55.1'
    text: |-
      Het bevoegd gezag van een instelling stelt jaarlijks, voorafgaand aan het desbetreffende begrotingsjaar, voor de
      instelling een begroting vast. Het begrotingsjaar valt samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel55
  - number: '55.2'
    text: |-
      De begroting behelst een raming van de inkomsten en uitgaven alsmede van de baten en lasten van de instelling en
      dient in evenwicht te zijn. De in de begroting voorziene inkomsten uit de rijksvergoeding sluiten aan op de voor
      het desbetreffende begrotingsjaar door Onze Minister geraamde, onderscheidenlijk vastgestelde en in voorkomende
      gevallen nader bepaalde rijksvergoeding. Uit de begroting blijkt in elk geval de mate waarin de rijksvergoeding aan
      onderwijsdoeleinden zal worden besteed, alsmede de voorgenomen toevoegingen en onttrekkingen aan de reserves.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel55
  - number: '55.3'
    text: |-
      Het bevoegd gezag draagt zorg voor wijziging van de begroting indien de vastgestelde rijksvergoeding afwijkt van de
      in de begroting opgenomen geraamde rijksvergoeding, of sprake is van een nader bepaalde rijksvergoeding.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel55
  - number: '55.4'
    text: Het bevoegd gezag verstrekt aan Onze Minister de begroting indien deze daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel55
  - number: '56.1'
    text: |-
      Het bevoegd gezag van een instelling dient jaarlijks voor 1 november bij Onze Minister een financiële
      jaarverslaggeving over het voorafgaande jaar in die is opgesteld overeenkomstig het model en de daarbij
      behorende voorschriften voor de invulling zoals opgenomen in [bijlage I][ref1] van dit besluit. In de financiële
      jaarverslaggeving wordt verantwoording afgelegd van het financiële beheer van de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004259
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004259
  - number: '56.2'
    text: |-
      Van de financiële jaarverslaggeving maakt een jaarrekening deel uit. De jaarrekening gaat vergezeld van een
      verklaring omtrent de getrouwheid, afgegeven door een door het bevoegd gezag aangewezen accountant. Bij de
      aanwijzing van de accountant wordt verzekerd dat aan Onze Minister op diens verzoek inzicht wordt geboden in de
      controlerapporten van de accountant.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel56
  - number: 56a.1
    text: |-
      De vergoeding voor een regionaal expertisecentrum bedraagt € 27 200, vermeerderd met € 9 100 voor elke aan het
      regionaal expertisecentrum deelnemende school en vermeerderd met € 155 voor elke leerling die in de periode van 12
      maanden direct voorafgaand aan 1 oktober van het voorafgaande schooljaar een bevestigende beoordeling als bedoeld
      in [artikel 28c, eerste lid, van de wet](onbekend), heeft ontvangen, welk aantal leerlingen wordt verhoogd met 15%.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel56a
  - number: 56a.2
    text: |-
      Het Rijk verstrekt elke maand van het schooljaar een twaalfde gedeelte van de vergoeding, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel56a
  - number: 56a.3
    text: |-
      De bedragen, bedoeld in het eerste lid, worden jaarlijks per 1 augustus, telkens te rekenen met het laatstelijk
      aangepaste bedrag, bij ministeriële regeling aangepast en wel voor 90% van het bedrag aan de ontwikkeling van de
      gemiddelde personeelslasten in het speciaal onderwijs en het voortgezet speciaal onderwijs in het voorafgaande
      kalenderjaar en voor 10% van het bedrag aan de prijsontwikkeling, overeenkomstig de prijsmutatie van de netto
      materiële consumptie, zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal optreden tussen
      het prijsniveau in het jaar voorafgaande aan het jaar waarin het bedrag wordt aangepast, en het jaar waarin het
      bedrag wordt aangepast.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel56a
  - number: 56b.1
    text: |-
      Het regionaal expertisecentrum brengt desgevraagd aan Onze Minister verslag uit over zijn werkzaamheden in het
      voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel56b
  - number: 56b.2
    text: |-
      Het regionaal expertisecentrum legt jaarlijks voor 1 mei over het voorafgaande kalenderjaar rekening en
      verantwoording af van het geldelijk beheer en in voorkomend geval van de besteding van formatierekeneenheden,
      waarbij tevens een verklaring van een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het
      Burgerlijk Wetboek](onbekend) wordt overgelegd, waaruit blijkt dat de vergoeding is besteed in overeenstemming met
      de bepalingen van de wet.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel56b
  - number: '57'
    text: |-
      Met besluiten als bedoeld in [artikel 23, tweede lid][ref1], worden Onze besluiten inzake de vergoeding, bedoeld in
      [artikel 23][ref2], die zijn genomen voor 1 januari 1989, gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004259#Artikel23
