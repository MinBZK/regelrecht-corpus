  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen van 27 oktober 1987, nr. 9727/2363,
    centrale directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 19a en 59 van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs
    (Stb. 1987, 614) en de artikelen E 23 en E 24 van de Overgangswet ISOVSO ( Stb. 1987, 615);

    Gehoord de Onderwijsraad (advies van 15 oktober 1987, nr. 1/1431);

    De Raad van State gehoord (advies van 17 december 1987, nr. W05.87.0581);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen van 22 december 1987, nr.
    10080/2363, centrale directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: Onze Minister: Onze Minister van Onderwijs, Cultuur en
      Wetenschappen; wet: [Wet op de expertisecentra][ref1]; school: een school voor speciaal onderwijs,
      voor voortgezet speciaal onderwijs of voor speciaal en voortgezet speciaal onderwijs als bedoeld in
      [artikel 2, tweede lid, onder a, b, c, f, h, j, k, m of n, van de wet][ref2], dan wel een instelling voor
      speciaal en voortgezet speciaal onderwijs als bedoeld in [artikel 8, eerste lid, tweede volzin, van de wet][ref3],
      tenzij het tegendeel blijkt; afdeling: afdeling als bedoeld in [artikel 8, tweede lid, van de wet][ref4];
      instelling: instelling als bedoeld in [artikel 8, eerste lid, tweede volzin, van de wet][ref5],
      tenzij het tegendeel blijkt; regionaal expertisecentrum: een regionaal expertisecentrum als
      bedoeld in [artikel 28b van de wet][ref6]; nevenvestiging: een nevenvestiging als bedoeld in de
      [artikelen 76a][ref7] en [76b van de wet][ref8] dan wel een nevenvestiging van een instelling, genoemd in
      __REF008___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _ (*Stb.* 1995, 319); openbare school: door een of meer gemeenten, al dan niet te zamen met een of meer
      privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid, in stand gehouden school; bijzondere school:
      door een privaatrechtelijke rechtspersoon in stand gehouden school; bevoegd gezag van volgens de wet bekostigde
      scholen: 'voor wat betreft:'


