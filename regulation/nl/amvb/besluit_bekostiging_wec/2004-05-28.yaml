  - number: '59'
    text: Het Bekostigingsbesluit ISOVSO (*Stb.* 1985,728) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004259/2004-05-28#Artikel59
  - number: '60.1'
    text: |-
      Dit besluit treedt in werking op 1 januari 1988, met dien verstande dat titel II van hoofdstuk II,
      [hoofdstuk IV][ref1] met uitzondering van [artikel 28][ref2], en [artikel 57][ref3] in werking treden op 1 januari
      1989. Indien het *Staatsblad* waarin dit besluit wordt geplaatst, wordt uitgegeven na 30 december 1987, treedt
      het in werking op de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het wordt geplaatst, en werkt
      het terug tot en met 1 januari 1988, met dien verstande dat titel II van hoofdstuk II, [hoofdstuk IV][ref4] met
      uitzondering van [artikel 28][ref5], en [artikel 57][ref6] in werking treden op 1 januari 1989.


