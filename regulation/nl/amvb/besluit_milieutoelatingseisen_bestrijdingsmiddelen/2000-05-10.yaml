---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_milieutoelatingseisen_bestrijdingsmiddelen
regulatory_layer: AMVB
publication_date: '2005-08-23'
valid_from: '2000-05-10'
bwb_id: BWBR0007214
url: https://wetten.overheid.nl/BWBR0007214/2000-05-10
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 31 mei 1994, nr.
    MJZ 31594013, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan in overeenstemming met Onze Ministers
    van Landbouw, Natuurbeheer en Visserij en van Volksgezondheid, Welzijn en Sport en de Staatssecretaris van Sociale
    Zaken en Werkgelegenheid;

    Gelet op artikel 3a, eerste lid, en tweede lid, onder d, van de Bestrijdingsmiddelenwet 1962;

    Gezien het advies van de Bestrijdingsmiddelencommissie;

    De Raad van State gehoord (advies van 25 oktober 1994, nr. W08.94 0348);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    19 januari 1995, nr. MJZ 19195027, Centrale Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht in
    overeenstemming met Onze Ministers van Landbouw, Natuurbeheer en Visserij en van Volksgezondheid, Welzijn en Sport
    en de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel1
  - number: 1.a
    text: |-
      gebruiksvoorschriften: krachtens [artikel 5, tweede of vijfde lid][ref1], of
      [artikel 9, tweede lid, van de Bestrijdingsmiddelenwet 1962][ref2] gegeven voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel9
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '9'
  - number: 1.b
    text: |-
      LC50: concentratie van een stof in milligram per liter, waarbij 50% van de in beschouwing genomen testorganismen
      sterft;
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel1
  - number: 1.c
    text: 'NOEC: de hoogste concentratie van een stof in een toxiciteitstoets waarbij geen effect wordt waargenomen;'
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel1
  - number: 1.d
    text: |-
      EC50: concentratie van een stof in milligram per liter, waarbij 50% van de in beschouwing genomen proefdieren een
      effect vertoont;
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel1
  - number: 1.e
    text: 'DT50: tijd die nodig is voor de omzetting van 50% van een hoeveelheid van een stof;'
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel1
  - number: 1.f
    text: |-
      omzetting: verandering in de chemische struktuur van een werkzame stof als gevolg van biologische, microbiologische
      of chemische reacties;
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel1
  - number: 1.g
    text: 'omzettingsprodukt: stof die als gevolg van omzetting uit een of meer werkzame stoffen ontstaat;'
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel1
  - number: 1.h
    text: |-
      grondgebonden residu: residu in de bodem, afkomstig van toegepaste gewasbeschermingsmiddelen die niet kunnen worden
      geëxtraheerd met methoden die de chemische aard van het residu niet significant veranderen;
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel1
  - number: 1.i
    text: |-
      MTR: maximaal toelaatbaar risiconiveau waarbij het voortbestaan van 95% van de soorten binnen een ecosysteem
      volledig wordt gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel1
  - number: 1.j
    text: |-
      grondwater: water beneden het grondoppervlak, beperkt tot water beneden de grondwaterspiegel, niet zijnde een
      schijnspiegel;
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel1
  - number: 1.k
    text: |-
      Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer in overeenstemming met Onze
      Ministers van Landbouw, Natuurbeheer en Visserij en van Volksgezondheid, Welzijn en Sport en de Staatssecretaris
      van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel1
  - number: '2'
    text: 'Dit besluit is van toepassing op de toelating van gewasbeschermingsmiddelen met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel2
  - number: 2.a
    text: |-
      gewasbeschermingsmiddelen die werkzame stoffen bevatten die bij de in [artikel 3, tweede lid, onderdeel ][ref1]
      bedoelde communautaire maatregel zijn aangewezen of die werkzame stoffen bevatten die op 25 juli 1993 nog niet
      eerder werden afgeleverd;


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
  - number: 2.b
    text: |-
      gewasbeschermingsmiddelen als bedoeld in [artikel 1, vijfde lid, van de Bestrijdingsmiddelenwet 1962][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel1
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '1'
  - number: 2.c
    text: gewasbeschermingsmiddelen die uitsluitend bestaan uit micro-organismen of virussen, en
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel2
  - number: 2.d
    text: |-
      op het tijdstip van inwerkingtreding van het besluit toegelaten gewasbeschermingsmiddelen die dichloorpropeen, cis-
      dichloorpropeen of metam-natrium bevatten en waarop het [Besluit regulering grondontsmettingsmiddelen][ref1] van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005949
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005949
  - number: '3.1'
    text: |-
      Onverminderd het tweede lid, wordt een gewasbeschermingsmiddel slechts toegelaten indien het middel voldoet aan de
      bij of krachtens de [artikelen 5 tot en met 7a][ref1] gestelde regels, waarbij voor de toepassing van die regels
      wordt uitgegaan van het gebruik van het middel overeenkomstig de gebruiksvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0007214#Artikel5
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007214
        artikel: '5'
        paragraaf: '2'
  - number: '3.2'
    text: 'Indien:'
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel3
  - number: 3.2.a
    text: |-
      het gebruik van een gewasbeschermingsmiddel dringend vereist is en voor het gebruik uit landbouwkundig of
      volksgezondheidsoogpunt geen geschikt alternatief bestaat in de vorm van een ander gewasbeschermingsmiddel dan
      wel een mechanische of biologische methode, die hetzelfde doeleinde en een vergelijkbare deugdelijkheid heeft en
      waarvan met redelijke zekerheid kan worden aangenomen dat deze aanmerkelijk minder risico's heeft voor de kwaliteit
      van het milieu, of
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel3
  - number: 3.2.b
    text: |-
      het niet toelaten van het gewasbeschermingsmiddel leidt tot aanzienlijke verslechtering van de
      arbeidsomstandigheden, wordt het gewasbeschermingsmiddel toegelaten indien wordt voldaan aan de normen, bedoeld
      in [artikel 8][ref1], waarbij voor de toepassing van die normen wordt uitgegaan van het gebruik van het middel
      overeenkomstig de gebruiksvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0007214#Artikel8
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007214
        artikel: '8'
        paragraaf: '5'
  - number: '3.3'
    text: Bij regeling van Onze Minister kunnen voor de toepassing van het tweede lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel3
  - number: '4.1'
    text: |-
      Aan de [artikelen 5][ref1], [6][ref2] en [7][ref3] behoeft niet te zijn voldaan voor zover het betreft stoffen,
      die kunnen worden aangemerkt als stoffen met een geringe schadelijkheid voor de kwaliteit van bodem, daaronder
      begrepen grondwater, water of lucht.


      [ref1]: https://wetten.overheid.nl/BWBR0007214#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007214#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007214#Artikel7
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007214
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007214
        artikel: '6'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0007214
        artikel: '7'
        paragraaf: '4'
  - number: '4.2'
    text: |-
      Aan de [artikelen 5][ref1], [6][ref2] en [7][ref3] behoeft niet te zijn voldaan voor zover het betreft een
      omzettingsprodukt van een gewasbeschermingsmiddel, dat niet ontstaat in een hoeveelheid die op enig tijdstip 10% of
      meer bedraagt van de gebruikte hoeveelheid van het middel, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0007214#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007214#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007214#Artikel7
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007214
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007214
        artikel: '6'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0007214
        artikel: '7'
        paragraaf: '4'
  - number: 4.2.a
    text: |-
      dat omzettingsprodukt kan uitspoelen in een concentratie, gelijk aan of groter dan 0,1 microgram per liter in de
      bovenste meter van het grondwater, voor zover het betreft [artikel 6][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0007214#Artikel6
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007214
        artikel: '6'
        paragraaf: '3'
  - number: 4.2.b
    text: |-
      de werkzame stof en zijn omzettingsprodukten ontstaan in een concentratie welke onaanvaardbare directe of indirecte
      effecten heeft voor waterorganismen en organismen die afhankelijk zijn van waterecosystemen, voor zover het betreft
      [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007214#Artikel7
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007214
        artikel: '7'
        paragraaf: '4'
  - number: '4.3'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de wijze waarop wordt bepaald of aan
      het eerste en tweede lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel4
  - number: '5.1'
    text: Het gewasbeschermingsmiddel en elk van zijn omzettingsprodukten hebben een DT50 van minder dan 90 dagen.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel5
  - number: '5.2'
    text: |-
      Het gewasbeschermingsmiddel en elk van zijn omzettingsprodukten vormen, bij laboratoriumproeven, geen grondgebonden
      residuen in hoeveelheden groter dan 70% van de begindosis na 100 dagen, en hebben geen mineralisatiesnelheid lager
      dan 5% binnen 100 dagen.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel5
  - number: '5.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing, indien de aanvrager onderscheidenlijk houder van de toelating
      aantoont:
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel5
  - number: 5.3.a
    text: |-
      dat de toepassing van het middel en zijn omzettingsprodukten niet leidt tot een onaanvaardbare accumulatie in de
      bodem dan wel op de lange termijn geen gevolgen heeft voor de diversiteit en rijkdom van andere soorten dan de
      doelsoorten, en
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel5
  - number: 5.3.b
    text: |-
      dat de som van de concentraties waarin het middel en zijn omzettingsprodukten ontstaan, niet zodanig is dat het MTR
      voor bodemorganismen en organismen die afhankelijk zijn van deze bodemorganismen wordt overschreden twee jaar na
      het tijdstip waarop het middel voor het laatst is gebruikt, in de bovenste 20 cm van de bodem op de plaats waar het
      middel is gebruikt.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel5
  - number: '5.4'
    text: |-
      Bij regeling van Onze Minister worden voor de toepassing van dit artikel nadere regels gesteld met betrekking tot
      de wijze waarop:
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel5
  - number: 5.4.a
    text: de DT50 wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel5
  - number: 5.4.b
    text: het percentage van het grondgebonden residu alsmede de mineralisatiesnelheid worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel5
  - number: 5.4.c
    text: de concentraties van een middel onderscheidenlijk zijn omzettingsprodukten worden berekend;
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel5
  - number: 5.4.d
    text: het MTR voor bodemorganismen en daarvan afhankelijke organismen wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel5
  - number: 5.4.e
    text: |-
      de overeenkomstig de krachtens onderdeel *c* gestelde regels berekende concentratie wordt getoetst aan het
      overeenkomstig de krachtens onderdeel *d* gestelde regels berekende MTR;
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel5
  - number: 5.4.f
    text: |-
      wordt bepaald of voldaan is aan de eis dat de toepassing van het middel en zijn omzettingsprodukten niet leidt tot
      een onaanvaardbare accumulatie in de bodem;
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel5
  - number: 5.4.g
    text: |-
      wordt bepaald of voldaan is aan de eis dat de toepassing van het middel en zijn omzettingsprodukten op de lange
      termijn geen gevolgen heeft voor de diversiteit en rijkdom van andere soorten dan de doelsoorten.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel5
  - number: '6.1'
    text: 'Het gewasbeschermingsmiddel en elk van zijn omzettingsprodukten hebben na uitspoeling:'
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel6
  - number: 6.1.a
    text: |-
      een berekende concentratie in de bovenste meter van het grondwater van minder dan 0,1 microgram per liter dan wel
      van minder dan de kleinste concentratie bedoeld in deel C, punt 2.5.1.2, onder *a*. 1., van [richtlijn nr. 94/43/
      EG](31994L0043) van de Raad van de Europese Unie van 27 juli 1994 tot vaststelling van bijlage VI bij [richtlijn
      nr. 91/414/EEG](31991L0414) betreffende het op de markt brengen van gewasbeschermingsmiddelen (*PbEG* L 227), of
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel6
  - number: 6.1.b
    text: |-
      een gemeten concentratie in het grondwater van minder dan 0,1 microgram per liter dan wel van minder dan de
      kleinste concentratie bedoeld in deel C, punt 2.5.1.2, onder *a*. 1., van de in onderdeel *a* genoemde [richtlijn
      nr. 94/43/EG](31994L0043).
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel6
  - number: '6.2'
    text: |-
      Indien in de gebruiksvoorschriften wordt voorgeschreven dat het gewasbeschermingsmiddel dient te worden gebruikt
      te zamen met andere gewasbeschermingsmiddelen, hebben deze gewasbeschermingsmiddelen en hun omzettingsprodukten te
      zamen na uitspoeling:
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel6
  - number: 6.2.a
    text: een berekende concentratie van minder dan 0,5 microgram per liter in de bovenste meter van het grondwater, of
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel6
  - number: 6.2.b
    text: een gemeten concentratie van minder dan 0,5 microgram per liter in het grondwater.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel6
  - number: '6.3'
    text: |-
      Aan het eerste en tweede lid behoeft niet te zijn voldaan, indien de aanvrager onderscheidenlijk houder van de
      toelating aantoont dat bij een transporttijd van 4 jaar in de verzadigde fase van het grondwater op een diepte van
      10 meter onder het maaiveld aan het eerste en tweede lid wordt voldaan als gevolg van:
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel6
  - number: 6.3.a
    text: hydrolyse van het gewasbeschermingsmiddel en zijn omzettingsprodukten, of
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel6
  - number: 6.3.b
    text: |-
      een ander dan het onder *a* bedoelde afbraakproces, dat plaatsvindt in de verzadigde fase beneden de
      grondwaterspiegel.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel6
  - number: '6.4'
    text: |-
      Bij regeling van Onze Minister worden voor de toepassing van dit artikel nadere regels gesteld met betrekking tot
      de wijze waarop:
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel6
  - number: 6.4.a
    text: de concentratie van een stof in het grondwater wordt berekend of gemeten, en
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel6
  - number: 6.4.b
    text: wordt bepaald of aan het derde lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel6
  - number: '7.1'
    text: |-
      Een werkzame stof van een gewasbeschermingsmiddel en elk van zijn omzettingsprodukten hebben in het
      oppervlaktewater een concentratie van minder dan:
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel7
  - number: 7.1.a.1
    text: 0,01 van de LC50 voor acute toxiciteit voor vis en 0,01 van de acute EC50 voor Daphnia, en
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel7
  - number: 7.1.a.2
    text: 0,1 van de NOEC voor lange termijn toxiciteit voor vis en Daphnia;
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel7
  - number: 7.1.b
    text: 0,1 van de NOEC voor algen.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel7
  - number: '7.2'
    text: |-
      Een werkzame stof van een gewasbeschermingsmiddel en elk van zijn omzettingsprodukten hebben een maximale
      bioconcentratiefactor van minder dan:
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel7
  - number: 7.2.a
    text: 1000 voor werkzame stoffen, die gemakkelijk biologisch afbreekbaar zijn, of
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel7
  - number: 7.2.b
    text: 100 voor werkzame stoffen, die niet gemakkelijk biologisch afbreekbaar zijn.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel7
  - number: '7.3'
    text: |-
      Aan het eerste en tweede lid behoeft niet te zijn voldaan, indien de aanvrager onderscheidenlijk houder van de
      toelating aantoont dat er geen onaanvaardbare directe of indirecte effecten zijn voor waterorganismen en organismen
      die afhankelijk zijn van waterecosystemen.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel7
  - number: '7.4'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de wijze waarop wordt bepaald of aan
      het eerste, tweede en derde lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel7
  - number: 7a
    text: |-
      Het gewasbeschermingsmiddel en elk van zijn omzettingsproducten voldoen aan de criteria genoemd in deel
      C, punt 2.5.1.3 en, onverminderd artikel 4, aan punt 2.5.2 van [richtlijn nr. 97/57/EG](31997L0057) van de
      Raad van de Europese Unie van 22 september 1997 tot vaststelling van bijlage VI bij [richtlijn 91/414/EEG]
      (31991L0414) betreffende het op de markt brengen van gewasbeschermingsmiddelen (PbEG L 227), zoals verwerkt in het
      [Besluit uniforme beginselen gewasbeschermingsmiddelen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007323
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0007323
  - number: '8'
    text: |-
      Het gewasbeschermingsmiddel voldoet ten minste aan de bij regeling van Onze Minister vastgestelde normen met
      betrekking tot de in de [artikelen 5 tot en met 7a][ref1] genoemde milieucriteria.


      [ref1]: https://wetten.overheid.nl/BWBR0007214#Artikel5
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007214
        artikel: '5'
        paragraaf: '2'
  - number: '9'
    text: |-
      Op volledige aanvragen om toelating van een gewasbeschermingsmiddel, die zijn ingediend voor de datum
      van publikatie van dit besluit in het *Staatsblad*, zijn de bepalingen inzake de toelatingseisen voor
      gewasbeschermingsmiddelen van toepassing zoals die golden onmiddellijk voorafgaande aan het tijdstip van
      inwerkingtreding van dit besluit.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel9
  - number: '11'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop artikel I, onderdelen D, voor zover het betreft artikel
      3, eerste lid, en tweede lid, aanhef en onderdeel *b*, E en J, aanhef en onderdeel 1, van de Wet van 15 december
      1994 tot wijziging van de Bestrijdingsmiddelenwet 1962 (implementatie richtlijn gewasbeschermingsmiddelen) (*Stb.*
      1995, nr. 4) in werking treedt.
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel11
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Besluit milieutoelatingseisen bestrijdingsmiddelen.'
    url: https://wetten.overheid.nl/BWBR0007214/2000-05-10#Artikel12
