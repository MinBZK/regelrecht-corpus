  - number: '13'
    text: |-
      1 [Artikel 8, derde lid][ref1], is niet van toepassing op een betonroostervloer waarvan de gebruiker kan aantonen
      dat hij voor 1 januari 1994 in gebruik is genomen.

      2 [Artikel 3, eerste lid][ref2], voor zover dat lid betrekking heeft op vleeskalveren, alsmede de
      [artikelen 4][ref3] en [7][ref4] zijn tot 31 december 2003 niet van toepassing indien het een stal betreft
      waarvan de gebruiker kan aantonen dat de stal voor 1 januari 1994 in gebruik is genomen en de stal of het in het
      desbetreffende artikel of artikellid bedoelde onderdeel daarvan, nadien niet is ver- of herbouwd.

      3 [Artikel 3, eerste lid][ref5], voor zover dat lid betrekking heeft op vleeskalveren, alsmede de
      [artikelen 4][ref6] en [7][ref7] zijn tot 31 december 2006 niet van toepassing indien de gebruiker kan aantonen
      dat de stal of het in het desbetreffende artikel of artikellid bedoelde onderdeel daarvan, in gebruik is genomen
      voor 1 januari 1998, sindsdien niet is ver- of herbouwd en vanaf laatstgenoemde datum voldoet aan de in het vierde
      lid bedoelde eisen.

      4 Een stal als bedoeld in het derde lid voldoet aan de volgende eisen:

      a. indien de kalveren in eenlingboxen worden gehouden, hebben de eenlingboxen elk een breedte van ten minste 0,8
      maal de schofthoogte of 81 cm hart op hart der wanden gemeten en een lengte van tenminste 130 cm voor kalveren tot
      en met de leeftijd van acht weken;

      b. indien de kalveren anders dan in eenlingboxen worden gehouden, heeft elk kalf de beschikking over ten minste 1,5
      m2 vloeroppervlakte, en

      c. de wanden van een eenlingbox zijn zodanig opengewerkt dat naast elkaar gehouden kalveren elkaar kunnen zien
      zonder dat zij hun kop door de openingen kunnen steken.


