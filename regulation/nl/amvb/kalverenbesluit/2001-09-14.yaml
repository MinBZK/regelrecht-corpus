    text: |-
      Het besluit van 8 september 1961, houdende regelen, ter uitvoering van
      [artikel 1 van de Wet op de dierenbescherming][ref1] inzake het houden van mestkalveren (*Stb.* 296) wordt
      ingetrokken.


