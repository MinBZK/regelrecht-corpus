preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 8 december 1993, No. J.
    9319377, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Gelet op richtlijn nr. 91/629/EEG van de Raad van de Europese Gemeenschappen van 19 november 1991 tot vaststelling
    van minimumnormen ter bescherming van kalveren (PbEG 1991, L 340) en gelet op artikel 35, 38, 45 en 111 van de
    Gezondheids- en welzijnswet voor dieren;

    Gezien de adviezen van de Raad voor dierenaangelegenheden, het Landbouwschap, de Nederlandse Vereniging tot
    Bescherming van Dieren, het Produktschap voor Vee en Vlees, het Produktschap voor Veevoeder en het Overlegplatform
    vleeskalverensector;

    De Raad van State gehoord (advies van 24 mei 1994, No. W11.93.0828);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 30 juni 1994, No. J.
    949687, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006805/2001-09-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. kalf: rund behorend tot de soort Bos primigenius taurus, van ten hoogste zes maanden met uitzondering van
      zodanige dieren in een dierproef als bedoeld in de [Wet op de dierproeven][ref1];

      b. vleeskalf: kalf dat kennelijk wordt opgefokt tot een rund bestemd om met het oog op de vleesproduktie te worden
      geslacht op een leeftijd van ten hoogste acht maanden;

      c. vleesstierkalf: kalf van het mannelijk geslacht dat wordt opgefokt tot een rund kennelijk bestemd om met het oog
      op de vleesproduktie te worden geslacht op een leeftijd van ten minste acht maanden;

      d. eenlingbox: ruimte met ten minste drie wanden bestemd voor het huisvesten van één kalf;

      e. stal: ruimte bestemd voor het houden al dan niet in eenlingboxen, van één of meer kalveren;

      f. [richtlijn 91/629/EEG](31991L0629): [richtlijn nr. 91/629/EEG](31991L0629) van de Raad van de Europese
      Gemeenschappen van 19 november 1991 tot vaststelling van minimumnormen ter bescherming van kalveren (*PbEG* L 340);

      g. bijlage: bijlage bij [richtlijn 91/629/EEG](31991L0629);

      h. derde land: land, niet zijnde een lid-staat van de Europese Unie of een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0003081
    url: https://wetten.overheid.nl/BWBR0006805/2001-09-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003081
  - number: '2'
    text: |-
      1 Het houden van kalveren geschiedt overeenkomstig punt 8, eerste zin, van de bijlage.

      2 Het huisvesten van kalveren geschiedt overeenkomstig artikel 3, de artikelen 4 tot en met 10 en artikel 13,
      vierde lid, van dit beesluit alsmede de punten 1 tot en met 3, 4, tweede alinea, eerste zin, 5, 6, derde zin, 7, 8,
      laatste zin, 10, 12, laatste zin, en punt 14 voor zover betreffend het ontwerpen, bouwen en plaatsen van voeder- en
      drinkinstallaties, van de bijlage.

      3 De verzorging van kalveren geschiedt overeenkomstig de punten 4, eerste alinea en tweede alinea, laatste zin, 6,
      eerste en tweede zin, 8, tweede zin, 9, 11, 12, eerste zin, 13, 14, voor zover betreffend het onderhoud van voeder-
      en drinkinstallaties, en punt 15, van de bijlage.
    url: https://wetten.overheid.nl/BWBR0006805/2001-09-14#Artikel2
  - number: '3'
    text: |-
      1 Kalveren worden niet in eenlingboxen gehuisvest indien de kalveren ouder zijn dan 8 weken.

      2 Het eerste lid is niet van toepassing indien een dierenarts heeft verklaard dat het kalf in verband met zijn
      gezondheid of gedrag moet worden geïsoleerd om te worden behandeld.
    url: https://wetten.overheid.nl/BWBR0006805/2001-09-14#Artikel3
  - number: '4'
    text: |-
      1 Indien kalveren in eenlingboxen worden gehouden, hebben de eenlingboxen elk een breedte van ten minste de
      schofthoogte van het kalf, gemeten terwijl het kalf rechtop staat, en een lengte van ten minste 1,1 maal de
      lichaamslengte van het kalf, gemeten van de neuspunt tot aan de achterkant van de zitbeenknobbel (tuber ischii).

      2 Indien de kalveren anders dan in eenlingboxen worden gehouden, heeft een kalf met een levend gewicht van:

      a. minder dan 150 kg, de beschikking over ten minste 1,5 m2 vloeroppervlakte;

      b. 150 kg of meer, maar minder dan 220 kg, de beschikking over ten minste 1,7 m2 vloeroppervlakte;

      c. 220 kg of meer, de beschikking over ten minste 1,8 m2 vloeroppervlakte.
    url: https://wetten.overheid.nl/BWBR0006805/2001-09-14#Artikel4
  - number: '5'
    text: |-
      Onverminderd punt 7 van de bijlage is, indien de kalveren zijn gehuisvest in een stal met ligboxen, het aantal
      ligboxen ten minste gelijk aan het aantal kalveren.
    url: https://wetten.overheid.nl/BWBR0006805/2001-09-14#Artikel5
  - number: '6'
    text: |-
      Onverminderd punt 12 van de bijlage beschikken kalveren in stallen voorzien van een systeem van voorraadvoedering
      over ten minste één eetplaats per drie kalveren en in stallen zonder een systeem van voorraadvoedering over ten
      minste 0,40 m voerhekbreedte per kalf.
    url: https://wetten.overheid.nl/BWBR0006805/2001-09-14#Artikel6
  - number: '7'
    text: |-
      Met uitzondering van een eenlingbox die voor het isoleren van zieke dieren wordt gebruikt, zijn de wanden van een
      eenlingbox zodanig opengewerkt dat naast elkaar gehouden kalveren elkaar kunnen zien en aanraken.
    url: https://wetten.overheid.nl/BWBR0006805/2001-09-14#Artikel7
  - number: '8'
    text: |-
      1 Onverminderd punt 10 van de bijlage moeten andere kalveren dan vleesstierkalveren alsmede vleesstierkalveren tot
      een leeftijd van twee maanden kunnen liggen op een vloer die is ingestrooid of is voorzien van een kunststof mat,
      houten lattenrooster of rubber toplaag.

      2 De oppervlakte van de in het eerste lid bedoelde vloer bedraagt in stallen waarin de kalveren niet zijn
      aangebonden of niet in eenlingboxen zijn gehuisvest, voor kalveren tot een leeftijd van drie maanden ten minste
      0,50 m² beschikbare ruimte per kalf en voor kalveren ouder dan drie maanden ten minste 0,70 m² beschikbare ruimte
      per kalf.

      3 Onverminderd punt 10 van de bijlage voldoen betonroostervloeren aan de Nederlandse normen, bedoeld in NEN-normen
      nr. 3873 betreffende roostervloeren van gewapend beton voor stalgebouwen, zoals uitgegeven door het Nederlands
      Normalisatie-Instituut in februari 1989.
    url: https://wetten.overheid.nl/BWBR0006805/2001-09-14#Artikel8
  - number: '9'
    text: |-
      Van passend dag- of kunstlicht als bedoeld in punt 5 van de bijlage is sprake indien de oppervlakte aan
      lichtdoorlatend materiaal in wand of dak van een stal bestemd voor vleeskalveren ten minste 2% bedraagt van de
      vloeroppervlakte van de stal en van een stal bestemd voor andere kalveren dan vleeskalveren ten minste 5% bedraagt
      van die oppervlakte, waarbij het materiaal zodanig is aangebracht dat het licht in de stal gelijkmatig is gespreid.
    url: https://wetten.overheid.nl/BWBR0006805/2001-09-14#Artikel9
  - number: '10'
    text: |-
      De ruimte bestemd voor de afzondering van zieke of gewonde kalveren, bedoeld in punt 6, laatste zin, van de
      bijlage, biedt plaats aan ten minste 1% van het aantal gehouden kalveren en indien dit minder is dan één, aan ten
      minste één kalf.
    url: https://wetten.overheid.nl/BWBR0006805/2001-09-14#Artikel10
  - number: '11'
    text: |-
      Onverminderd het overigens ten aanzien van de invoer bepaalde is de invoer vanuit een derde land van kalveren die
      via Nederland voor het eerst naar de gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is,
      worden gebracht, slechts toegestaan indien de kalveren vergezeld gaan van een geldig, door de bevoegde autoriteit
      van dat derde land afgegegeven, volledig ingevuld en gedagtekend certificaat als bedoeld in artikel 8 van
      [richtlijn 91/629/EEG](31991L0629).
    url: https://wetten.overheid.nl/BWBR0006805/2001-09-14#Artikel11
  - number: '12'
    text: |-
      1 Een wijziging van de in [artikel 2][ref1] bedoelde bijlage dan wel van artikel 8 van [richtlijn 91/629/EEG]
      (31991L0629), treedt voor de toepassing van [artikel 2][ref2] onderscheidenlijk [artikel 11][ref3] van dit besluit
      in werking met ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven.

      2 Onze Minister van Landbouw, Natuurbeheer en Visserij doet mededeling in de *Staatscourant* van een wijziging als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006805#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006805#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006805#Artikel11
