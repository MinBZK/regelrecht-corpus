  - number: '7'
    text: |-
      1 Indien het voorlopig ademonderzoek indiceert dat het alcoholgehalte in de adem van de verdachte hoger is
      dan op grond van [artikel 8, tweede lid, onder a, of derde lid, onder a, van de Wegenverkeerswet 1994][ref1],
      [artikel 27, tweede lid, onder a, van de Scheepvaartverkeerswet][ref2],
      [artikel 4, tweede lid, onder a, van de Spoorwegwet][ref3],
      [artikel 41, tweede lid, onder a, van de Wet lokaal spoor][ref4] of
      [artikel 2.12, derde lid, onder a, van de Wet luchtvaart][ref5] is toegestaan, vermeldt de opsporingsambtenaar het
      resultaat van het onderzoek in het proces-verbaal.

      2 De opsporingsambtenaar deelt het resultaat van het voorlopig ademonderzoek direct mede aan degene bij wie het
      onderzoek is verricht.


