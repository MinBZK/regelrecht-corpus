      Een onderzoek dat ter vaststelling van een overtreding op grond van
      [artikel 8, eerste, tweede of derde lid, van de Wegenverkeerswet 1994][ref1],
      [artikel 27, eerste of tweede lid, van de Scheepvaartverkeerswet][ref2],
      [artikel 4, eerste of tweede lid, van de Spoorwegwet][ref3],
      [artikel 41, eerste of tweede lid, van de Wet lokaal spoor][ref4] of
      [artikel 2.12, eerste of derde lid, van de Wet luchtvaart][ref5] voor de inwerkingtreding van dit besluit is of
      wordt uitgevoerd, wordt overeenkomstig de regels die daarop voor de inwerkingtreding van dit besluit van toepassing
      waren, afgehandeld.


