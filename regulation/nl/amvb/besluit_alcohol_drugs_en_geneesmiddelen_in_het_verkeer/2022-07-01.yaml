  - number: '17'
    text: |-
      De opsporingsambtenaar stelt de verdachte binnen een week na ontvangst van het verslag, bedoeld in
      [artikel 16, tweede lid][ref1], schriftelijk in kennis van het resultaat van het bloedonderzoek en van het recht op
      tegenonderzoek en vermeldt daarbij het sporenidentificatienummer, bedoeld in artikel 16, vierde lid, onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0038936#Artikel16
