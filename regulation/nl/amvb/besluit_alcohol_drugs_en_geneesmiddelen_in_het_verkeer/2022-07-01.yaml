  - number: '11'
    text: |-
      1 Indien het ademonderzoek het vermoeden bevestigt dat het alcoholgehalte in de adem van de verdachte hoger is
      dan op grond van [artikel 8, tweede lid, onder a, of derde lid, onder a, van de Wegenverkeerswet 1994][ref1],
      [artikel 27, tweede lid, onder a, van de Scheepvaartverkeerswet][ref2],
      [artikel 4, tweede lid, onder a, van de Spoorwegwet][ref3],
      [artikel 41, tweede lid, onder a, van de Wet lokaal spoor][ref4] of
      [artikel 2.12, derde lid, onder a, van de Wet luchtvaart][ref5] is toegestaan, vermeldt de opsporingsambtenaar het
      resultaat van het onderzoek in het proces-verbaal.

      2 De opsporingsambtenaar deelt het resultaat van het ademonderzoek direct aan de verdachte mede en
      wijst hem, indien het ademonderzoek het vermoeden bevestigt dat het alcoholgehalte in zijn adem hoger is
      dan op grond van [artikel 8, eerste, tweede, derde of vijfde lid, van de Wegenverkeerswet 1994][ref6],
      [artikel 27, eerste of tweede lid, van de Scheepvaartverkeerswet][ref7],
      [artikel 4, eerste of tweede lid, van de Spoorwegwet][ref8],
      [artikel 41, eerste of tweede lid, van de Wet lokaal spoor][ref9] of
      [artikel 2.12, eerste of derde lid, van de Wet luchtvaart][ref10] is toegestaan, erop dat hij het recht op
      tegenonderzoek heeft.

      3 Het tegenonderzoek geschiedt door middel van een bloedonderzoek. De [artikelen 12 tot en met 16][ref11] en
      [19, derde tot en met vijfde lid][ref12], zijn van overeenkomstige toepassing, met dien verstande dat:

      a. de verdachte direct nadat hij op het recht op tegenonderzoek is gewezen aan de opsporingsambtenaar kenbaar dient
      te maken dat hij van dat recht gebruikmaakt, en het bloed van de verdachte direct daarna wordt afgenomen, en

      b. de bloedafname voor rekening van de verdachte geschiedt en niet wordt gedaan dan nadat daarvoor een bij
      ministeriële regeling vastgesteld bedrag is betaald.


