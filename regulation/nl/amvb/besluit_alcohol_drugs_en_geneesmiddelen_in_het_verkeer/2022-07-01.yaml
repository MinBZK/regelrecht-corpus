preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Veiligheid en Justitie van 25 februari 2015, directie Wetgeving en
    Juridische Zaken, nr. 619344;


    Gelet op artikel 8, vijfde lid, en artikel 163, tiende lid, van de Wegenverkeerswet 1994, artikel 28a, elfde lid,
    van de Scheepvaartverkeerswet, artikel 89, tiende lid, van de Spoorwegwet, artikel 48, tiende lid, van de Wet
    lokaal spoor en artikel 11.6, tiende lid, van de Wet luchtvaart;


    De Afdeling advisering van de Raad van State gehoord (advies van 3 april 2015, nr. W03.15.0052/II);


    Gezien het nader rapport van Onze Minister van Veiligheid en Justitie van 7 december 2016, directie Wetgeving en
    Juridische Zaken, nr. 2022958;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0038936/2022-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop rustende bepalingen wordt verstaan onder:

      a. *opsporingsambtenaar:* een opsporingsambtenaar als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1] en een buitengewoon opsporingsambtenaar
      als bedoeld in [artikel 159, eerste lid, onder a, van de Wegenverkeerswet 1994][ref2],
      [artikel 86, eerste en tweede lid, van de Spoorwegwet][ref3],
      [artikel 45, eerste en tweede lid, van de Wet lokaal spoor][ref4] en
      [artikel 11.3, eerste lid, van de Wet luchtvaart][ref5];

      b. *bloedonderzoek:* een onderzoek als bedoeld in
      [artikel 8, tweede lid, onder b, derde lid, onder b, of vijfde lid, van de Wegenverkeerswet 1994][ref6],
      [artikel 27, tweede lid, onder b, van de Scheepvaartverkeerswet][ref7],
      [artikel 4, tweede lid, onder b, van de Spoorwegwet][ref8],
      [artikel 41, tweede lid, onder b, van de Wet lokaal spoor][ref9] of
      [artikel 2.12, derde lid, onder b, van de Wet luchtvaart][ref10] dat betrekking heeft op het gebruik van alcohol of
      een of meer van de in [artikel 2][ref11] aangewezen stoffen;

      c. *aanvullend bloedonderzoek:* een onderzoek dat betrekking heeft op het gebruik van andere stoffen dan de in
      onderdeel b bedoelde stoffen.


