  - number: '14'
    text: |-
      1 De opsporingsambtenaar formuleert de opdracht voor de onderzoeker die het bloedonderzoek verricht.

      2 De onderzoeker is verbonden aan een laboratorium. Als laboratorium komt alleen in aanmerking:

      a. een laboratorium dat door de Raad voor Accreditatie is geaccrediteerd aan de hand van de algemene criteria
      voor het functioneren van beproevingslaboratoria, genoemd in de NEN-EN ISO/IEC 17025 of van criteria die daarmee
      vergelijkbaar zijn, en deskundig is op het terrein van de bio-analyse, dan wel

      b. een laboratorium dat in het buitenland is gevestigd en door een met de Raad voor Accreditatie vergelijkbare
      instantie is geaccrediteerd aan de hand van criteria die vergelijkbaar zijn met de criteria, genoemd in de NEN-EN
      ISO/IEC 17025, en deskundig is op het terrein van de bio-analyse.

      3 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om accreditatie,
      bedoeld in het tweede lid, onder a.

      4 Indien de accreditatie van een laboratorium, bedoeld in het tweede lid, is ingetrokken of geschorst of na haar
      vervaldatum niet is verlengd, kan in dat laboratorium geen bloedonderzoek meer worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0038936/2022-07-01#Artikel14
