    text: |-
      1 Een onderzoek van speeksel als bedoeld in [artikel 160, vijfde lid, onder c, van de Wegenverkeerswet 1994][ref1]
      geschiedt door met een voor het onderzoek bestemde speekseltester die bij ministeriële regeling is aangewezen, in
      de mondholte van degene bij wie het onderzoek wordt verricht, speeksel af te nemen en het resultaat daarvan af te
      lezen of door een bij de speekseltester behorend apparaat uit te lezen.

      2 Het onderzoek van speeksel wordt verricht door een opsporingsambtenaar.

      3 Indien het onderzoek van speeksel niet heeft geleid tot een geldig resultaat, kan de opsporingsambtenaar het
      onderzoek met toepassing van het eerste lid eenmaal opnieuw verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel160
