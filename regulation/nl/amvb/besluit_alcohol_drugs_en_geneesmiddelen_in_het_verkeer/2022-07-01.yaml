  - number: '15'
    text: |-
      Het laboratorium waaraan de onderzoeker, bedoeld in [artikel 14, eerste lid][ref1], is verbonden, legt na ontvangst
      van de buisjes of het buisje met bloed de volgende gegevens in een bestand vast:

      a. de datum van ontvangst van de buisjes of het buisje,

      b. de sporenidentificatienummers, bedoeld in [artikel 13, eerste lid, onder a en c][ref2],

      c. de naam, het geslacht, de geboortedatum en het burgerservicenummer van de verdachte wiens het bloed het betreft,
      en

      d. de naam van de opdrachtgever van het bloedonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0038936#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0038936#Artikel13
