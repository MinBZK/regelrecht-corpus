  - number: '19'
    text: |-
      1 In geval van een tegenonderzoek stelt het laboratorium waaraan de onderzoeker is verbonden die het bloedonderzoek
      of het aanvullend bloedonderzoek heeft verricht, het voor dat onderzoek bestemde buisje met bloed ter beschikking
      aan het laboratorium waaraan de onderzoeker is verbonden die het tegenonderzoek verricht.

      2 De [artikelen 13, eerste lid, onder d][ref1], [14, tweede tot en met vierde lid][ref2], [15][ref3], [16][ref4] en
      [18][ref5] zijn van overeenkomstige toepassing.

      3 Tegenonderzoek geschiedt op initiatief van en voor rekening van de verdachte en wordt niet verricht dan
      nadat de verdachte het laboratorium waaraan de onderzoeker is verbonden die het tegenonderzoek verricht, het
      daarvoor verschuldigde bedrag heeft betaald. In dat bedrag zijn de verzendkosten van het voor het tegenonderzoek
      bestemde buisje met bloed door het laboratorium waaraan de onderzoeker is verbonden die het bloedonderzoek of
      het aanvullend bloedonderzoek heeft verricht, inbegrepen. De hoogte van die verzendkosten worden bij ministeriële
      regeling vastgesteld. Het bedrag voor de verzendkosten verrekent het laboratorium, bedoeld in de eerste volzin,
      met het laboratorium, bedoeld in de tweede volzin. De verdachte is verplicht in zijn aanvraag tot het verrichten
      van een tegenonderzoek zijn naam, geslacht, geboortedatum en burgerservicenummer te vermelden, alsmede het
      sporenidentificatienummer dat op de kennisgeving, bedoeld in [artikel 17][ref6], is vermeld.

      4 Indien de verdachte de kosten van het tegenonderzoek niet binnen vier weken na de datum van dagtekening van de
      kennisgeving, bedoeld in [artikel 17][ref7], heeft betaald, vervalt het recht op dat onderzoek.

      5 De verdachte ontvangt het bedrag, bedoeld in het derde lid, uit ’s Rijks kas terug
      indien het resultaat van het tegenonderzoek het vermoeden niet bevestigt dat hij
      [artikel 8, eerste, tweede, derde of vijfde lid, van de Wegenverkeerswet 1994][ref8],
      [artikel 27, eerste of tweede lid, van de Scheepvaartverkeerswet][ref9],
      [artikel 4, eerste of tweede lid, van de Spoorwegwet][ref10],
      [artikel 41, eerste of tweede lid, van de Wet lokaal spoor][ref11] of
      [artikel 2.12, eerste of derde lid, van de Wet luchtvaart][ref12] heeft overtreden.


