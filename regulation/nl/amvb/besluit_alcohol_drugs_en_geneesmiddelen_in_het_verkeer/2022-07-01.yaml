  - number: '18'
    text: |-
      1 In geval van een aanvullend bloedonderzoek stelt het laboratorium waaraan de onderzoeker is verbonden die het
      bloedonderzoek heeft verricht, het voor dat onderzoek bestemde buisje met bloed ter beschikking aan de onderzoeker.

      2 Op het aanvullend bloedonderzoek zijn de [artikelen 12 tot en met 17][ref1] van overeenkomstige toepassing, met
      dien verstande dat

      a. de termijn waarbinnen het aanvullend bloedonderzoek dient te zijn verricht, acht weken bedraagt na ontvangst van
      het buisje met bloed, onverminderd het bepaalde in [artikel 16, eerste lid, tweede volzin][ref2];

      b. de hulpofficier van justitie belast is met de in [artikel 14, eerste lid][ref3], genoemde taak, en

      c. de opsporingsambtenaar belast is met de in [artikel 17][ref4] genoemde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0038936#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0038936#Artikel16
