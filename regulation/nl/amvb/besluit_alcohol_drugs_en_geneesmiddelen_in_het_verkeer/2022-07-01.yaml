        artikel: '8'
  - number: '3'
    text: |-
      1 De grenswaarden voor de in [artikel 2][ref1] aangewezen stoffen zijn, indien zij enkelvoudig zijn gebruikt en
      gemeten in geval van:

      a. amfetamine, methamfetamine, MDMA, MDEA en MDA: 50 microgram amfetamine, methamfetamine, MDMA, MDEA of MDA per
      liter bloed of 50 microgram per liter bloed voor de som van deze stoffen indien een van deze stoffen met een of
      meer van deze stoffen is gebruikt en gemeten;

      b. cannabis: 3,0 microgram tetrahydrocannabinol per liter bloed;

      c. cocaïne: 50 microgram cocaïne per liter bloed;

      d. heroïne en morfine: 20 microgram morfine per liter bloed;

      e. GHB, gamma butyrolacton of 1,4-butaandiol: 10 milligram GHB per liter bloed.

      2 Indien een van de in [artikel 2][ref2] aangewezen stoffen is gebruikt en gemeten in combinatie
      met een of meer andere van deze stoffen, alcohol of met een andere stof als bedoeld in
      [artikel 8, eerste lid, van de Wegenverkeerswet 1994][ref3], is de grenswaarde voor iedere in het eerste lid
      genoemde stof en alcohol in geval van:

      a. amfetamine, methamfetamine, MDMA, MDEA of MDA: 25 microgram amfetamine, methamfetamine, MDMA, MDEA of MDA per
      liter bloed;

      b. cannabis: 1,0 microgram tetrahydrocannabinol per liter bloed;

      c. cocaïne, heroïne en morfine: 10 microgram cocaïne of morfine per liter bloed;

      d. GHB, gamma butyrolacton of 1,4-butaandiol: 5,0 milligram GHB per liter bloed;

      e. alcohol: 0,2 milligram ethanol per milliliter bloed of 88 microgram ethanol per liter uitgeademde lucht.


      [ref1]: https://wetten.overheid.nl/BWBR0038936#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0038936#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel8
