  - number: '20'
    text: |-
      1 Het laboratorium waaraan de onderzoeker is verbonden dat het bloedonderzoek, aanvullend bloedonderzoek of
      tegenonderzoek heeft verricht, vernietigt het bloed dat na dat onderzoek resteert, een half jaar na de datum van
      dagtekening van het verslag, bedoeld in [artikel 16, tweede lid][ref1]. Is het recht op tegenonderzoek vervallen,
      dan vernietigt het laboratorium dat het tegenonderzoek zou verrichten het bloed een half jaar na de ontvangst.

      2 Indien het resultaat van het bloedonderzoek, het aanvullend bloedonderzoek of het tegenonderzoek het vermoeden
      niet bevestigt dat de verdachte [artikel 8, eerste, tweede, derde of vijfde lid, van de Wegenverkeerswet 1994][ref2],
      [artikel 27, eerste of tweede lid, van de Scheepvaartverkeerswet][ref3],
      [artikel 4, eerste of tweede lid, van de Spoorwegwet][ref4],
      [artikel 41, eerste of tweede lid, van de Wet lokaal spoor][ref5] of
      [artikel 2.12, eerste of derde lid, van de Wet luchtvaart][ref6] heeft overtreden, vernietigt het laboratorium,
      bedoeld in het eerste lid, het afschrift van het verslag, bedoeld in [artikel 16, tweede lid][ref7], en de daarbij
      behorende gegevens, bedoeld in [artikel 15][ref8], een half jaar na de datum van dagtekening van dat verslag.

      3 Indien het resultaat van het bloedonderzoek, het aanvullend bloedonderzoek of het tegenonderzoek het vermoeden
      bevestigt dat de verdachte een van de in het tweede lid genoemde artikelleden heeft overtreden, vernietigt het
      laboratorium, bedoeld in het eerste lid, het afschrift van het verslag, bedoeld in [artikel 16, tweede lid][ref9],
      en de daarbij behorende gegevens, bedoeld in [artikel 15][ref10], vijf jaar na de datum van dagtekening van dat
      verslag.

      4 Het laboratorium, bedoeld in het eerste lid, houdt aantekening van iedere vernietiging op grond van het eerste
      tot en met derde lid.


