  - number: '4'
    text: |-
      1 Een onderzoek van de psychomotorische functies en de oog- en spraakfuncties als bedoeld in
      [artikel 160, vijfde lid, onder a, van de Wegenverkeerswet 1994][ref1] is gericht op het vaststellen van de bij
      ministeriële regeling aangewezen uiterlijke kenmerken.

      2 Het onderzoek van de psychomotorische functies en de oog- en spraakfuncties wordt verricht door een
      opsporingsambtenaar.

      3 Indien het onderzoek van de psychomotorische functies en de oog- en spraakfuncties niet heeft geleid tot een
      geldig resultaat, kan de opsporingsambtenaar het onderzoek met toepassing van het eerste lid eenmaal opnieuw
      verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel160
    url: https://wetten.overheid.nl/BWBR0038936/2022-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '160'
  - number: '5'
    text: >-
      1 Indien het onderzoek van de psychomotorische functies en de oog- en spraakfuncties indiceert dat een of meer
      drugs of geneesmiddelen of alcohol is gebruikt, vermeldt de opsporingsambtenaar het resultaat van het onderzoek in
      het proces-verbaal.


      2 De opsporingsambtenaar deelt het resultaat van het onderzoek direct mede aan degene bij wie het onderzoek is
      verricht.
    url: https://wetten.overheid.nl/BWBR0038936/2022-07-01#Artikel5
  - number: '6'
    text: |-
      1 Een voorlopig ademonderzoek als bedoeld in [artikel 160, vijfde lid, onder b, van de Wegenverkeerswet 1994][ref1],
      [artikel 28, eerste lid, van de Scheepvaartverkeerswet][ref2], [artikel 4, vierde lid, van de Spoorwegwet][ref3],
      [artikel 41, vierde lid, van de Wet lokaal spoor][ref4] en [artikel 11.4, tweede lid, van de Wet luchtvaart][ref5]
      geschiedt door degene bij wie het onderzoek wordt verricht, in een voor het onderzoek bestemde ademtester die bij
      ministeriële regeling is aangewezen, ademlucht te laten blazen en het resultaat daarvan af te lezen.

      2 Het voorlopig ademonderzoek wordt verricht door een opsporingsambtenaar.

      3 Indien het voorlopig ademonderzoek niet heeft geleid tot een geldig resultaat, kan de opsporingsambtenaar het
      onderzoek met toepassing van het eerste lid eenmaal opnieuw verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel160
