  - number: '21'
    text: |-
      Indien een ander laboratorium dan het laboratorium van het Nederlands Forensisch Instituut voornemens is zijn
      werkzaamheden op het terrein van het bloedonderzoek of het aanvullend bloedonderzoek te beëindigen, zorgt dat
      laboratorium ervoor dat het bloed, de afschriften van de verslagen, bedoeld in [artikel 16, tweede lid][ref1],
      die bij dat laboratorium worden bewaard, en de daarbij behorende gegevens, bedoeld in [artikel 15][ref2], voor
      de beëindiging van die werkzaamheden aan dat instituut worden overgedragen, tenzij het laboratorium fuseert met
      een ander laboratorium als bedoeld in [artikel 14, tweede lid][ref3]. In het laatste geval worden het bloed, de
      afschriften van de verslagen en de daarbij behorende gegevens in dat andere laboratorium bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0038936#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0038936#Artikel15
