    url: https://wetten.overheid.nl/BWBR0038936/2022-07-01#Artikel9
  - number: '10'
    text: |-
      1 Een ademonderzoek als bedoeld in
      [artikel 8, tweede lid, onder a, of derde lid, onder a, van de Wegenverkeerswet 1994][ref1],
      [artikel 27, tweede lid, onder a, van de Scheepvaartverkeerswet][ref2],
      [artikel 4, tweede lid, onder a, van de Spoorwegwet][ref3],
      [artikel 41, tweede lid, onder a, van de Wet lokaal spoor][ref4] of
      [artikel 2.12, derde lid, onder a, van de Wet luchtvaart][ref5] geschiedt door de verdachte, zo nodig viermaal,
      ademlucht in een voor het onderzoek bestemd ademanalyseapparaat dat bij ministeriële regeling is aangewezen,
      te laten blazen en het resultaat daarvan af te lezen. Het blazen kan worden beëindigd, zodra het onderzoek twee
      meetresultaten heeft opgeleverd.

      2 Het ademonderzoek wordt niet eerder verricht dan twintig minuten nadat de verdachte is gevorderd zijn medewerking
      te verlenen aan het voorlopig ademonderzoek of, indien die vordering niet is gedaan, binnen twintig minuten na het
      eerste contact tussen de opsporingsambtenaar en de verdachte dat aanleiding was om de verdachte te bevelen zijn
      medewerking te verlenen aan het ademonderzoek.

      3 Het ademonderzoek wordt verricht door een opsporingsambtenaar.

      4 Het alcoholgehalte van de twee meetresultaten, bedoeld in het eerste lid, wordt op een bij ministeriële regeling
      voorgeschreven wijze vastgesteld.

      5 Indien het ademonderzoek niet heeft geleid tot een geldig resultaat, kan de opsporingsambtenaar het onderzoek met
      toepassing van het eerste, tweede en vierde lid eenmaal opnieuw verrichten.


