  - number: '16'
    text: |-
      1 De onderzoeker, bedoeld in [artikel 14, eerste lid][ref1], verricht het bloedonderzoek binnen
      vier weken na ontvangst van de buisjes of het buisje met bloed. Indien toepassing is gegeven aan
      [artikel 164, eerste lid, van de Wegenverkeerswet 1994][ref2], verricht de onderzoeker het bloedonderzoek binnen
      een week na ontvangst van de buisjes of het buisje met bloed voor zover het bloedonderzoek betrekking heeft op het
      gebruik van alcohol. De methode die hij voor het bloedonderzoek hanteert, voldoet aan de bij ministeriële regeling
      vastgestelde eisen.

      2 De onderzoeker stelt een in de Nederlandse taal gesteld schriftelijk verslag van het resultaat van het
      bloedonderzoek op en ondertekent dat verslag.

      3 In afwijking van het tweede lid mag het verslag in de Engelse taal zijn gesteld, indien de onderzoeker die het
      verslag opstelt, verbonden is aan een laboratorium als bedoeld in [artikel 14, tweede lid, onder b][ref3].

      4 Het verslag bevat in ieder geval:

      a. de naam, het geslacht, de geboortedatum en het burgerservicenummer van de verdachte met behulp van wiens bloed
      het onderzoek is verricht,

      b. het sporenidentificatienummer van het buisje met bloed met behulp waarvan het bloedonderzoek is verricht,

      c. de methode met behulp waarvan het bloedonderzoek is verricht, en

      d. het resultaat van het bloedonderzoek.

      5 De onderzoeker stuurt het verslag binnen de op grond van het eerste lid geldende termijn aan de opdrachtgever van
      het bloedonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0038936#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel164
      [ref3]: https://wetten.overheid.nl/BWBR0038936#Artikel14
