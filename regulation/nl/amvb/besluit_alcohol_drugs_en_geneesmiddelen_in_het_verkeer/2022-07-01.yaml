  - number: '2'
    text: |-
      Als stoffen als bedoeld in [artikel 8, vijfde lid, van de Wegenverkeerswet 1994][ref1] worden aangewezen:
      amfetamine, methamfetamine, cocaïne, MDMA, MDEA, MDA, cannabis, heroïne, morfine, GHB, gamma butyrolacton en 1,4-
      butaandiol.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0038936/2022-07-01#Artikel2
    references:
