  - number: '13'
    text: |-
      1 Bij de bloedafname, bedoeld in [artikel 12, eerste lid][ref1], is een opsporingsambtenaar aanwezig, die:

      a. van de bloedafname een proces-verbaal opmaakt dat hij voorziet van een sporenidentificatienummer en de naam,
      het geslacht, de geboortedatum en -plaats en het geboorteland en het burgerservicenummer van de verdachte van
      wie het bloed is afgenomen, of, indien deze gegevens van de verdachte onbekend zijn, andere gegevens waarmee zijn
      identiteit kan worden vastgesteld,

      b. een eventueel door de arts of verpleegkundige afgelegde schriftelijke verklaring over de door hem gedane
      waarnemingen ten aanzien van de verdachte als bijlage bij het proces-verbaal, bedoeld onder a, voegt,

      c. ervoor zorgt dat ieder buisje met bloed voorzien is van een sporenidentificatienummer, en

      d. ervoor zorgt dat de buisjes of het buisje met bloed binnen vier weken in een bij ministeriële regeling
      voorgeschreven verpakking die hij van een of meer fraudebestendige sluitzegels of een fraudebestendige afsluiting
      heeft voorzien, worden of wordt bezorgd bij het laboratorium, bedoeld in [artikel 14, tweede lid][ref2].

      2 De opsporingsambtenaar wijst de verdachte bij de bloedafname erop dat hij het recht op tegenonderzoek
      heeft, indien het verslag van het bloedonderzoek, bedoeld in [artikel 16, tweede lid][ref3], het
      vermoeden bevestigt dat hij [artikel 8, tweede, derde of vijfde lid, van de Wegenverkeerswet 1994][ref4],
      [artikel 27, tweede lid, van de Scheepvaartverkeerswet][ref5], [artikel 4, tweede lid, van de Spoorwegwet][ref6],
      [artikel 41, tweede lid, van de Wet lokaal][ref7] spoor of [artikel 2.12, derde lid, van de Wet luchtvaart][ref8]
      heeft overtreden, tenzij de bloedafname in het kader van een tegenonderzoek geschiedt.

      3 Bij ministeriële regeling worden regels gesteld over de omstandigheden waaronder de buisjes of het buisje met
      bloed worden bewaard en vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0038936#Artikel12
