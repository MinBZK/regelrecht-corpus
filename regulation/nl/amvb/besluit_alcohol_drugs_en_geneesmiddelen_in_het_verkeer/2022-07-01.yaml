  - number: '12'
    text: |-
      1 Ten behoeve van het bloedonderzoek neemt een arts of verpleegkundige door middel van een venapunctie twee buisjes
      bloed van de verdachte af of, indien een venapunctie vanuit medisch oogpunt niet verantwoord is, door middel
      van een infuus. In afwijking van de eerste volzin mag de arts of verpleegkundige ook een buisje bloed van de
      verdachte afnemen indien het vanuit medisch oogpunt niet verantwoord is, twee buisjes bloed van hem af te nemen. De
      hoeveelheid bloed dat ieder buisje dient te bevatten, wordt bij ministeriële regeling vastgesteld.

      2 De bloedafname geschiedt met de hulpmiddelen die bij ministeriële regeling zijn voorgeschreven.

      3 De bloedafname geschiedt uiterlijk binnen anderhalf uur nadat de verdachte is gevorderd zijn medewerking te
      verlenen aan een voorlopig onderzoek als bedoeld in [artikel 4][ref1] of [8][ref2] of, indien die vordering
      niet is gedaan, binnen anderhalf uur na het eerste contact tussen de opsporingsambtenaar en de verdachte dat
      aanleiding was om de verdachte te vragen zijn medewerking te verlenen aan het bloedonderzoek. Van die termijn kan
      alleen vanwege bijzondere omstandigheden worden afgeweken. De vorige volzinnen zijn niet van toepassing indien het
      bloedonderzoek is gericht op de vaststelling van het gebruik van alcohol.

      4 De arts of verpleegkundige ontvangt voor de bloedafname een vergoeding van de organisatie waarbij de
      opsporingsambtenaar werkzaam is en die voor de bloedafname zorgdraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0038936#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0038936#Artikel8
