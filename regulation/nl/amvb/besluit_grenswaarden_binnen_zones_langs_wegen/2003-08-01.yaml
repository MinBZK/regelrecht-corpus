  - number: 8.4.b
    text: |-
      60 dB(A) voor gebouwen, behorende tot de in [artikel 4, tweede lid, onder ][ref1], bedoelde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
  - number: '9.1'
    text: |-
      Gedeputeerde Staten kunnen alleen toepassing geven aan [artikel 5][ref1] of [8][ref2] in de gevallen waarin
      toepassing van maatregelen, gericht op het terugbrengen van de geluidsbelasting, vanwege een weg, van de uitwendige
      scheidingsconstructie van het betrokken gebouw, tot 50 dB(A) onvoldoende doeltreffend zal zijn, dan wel overwegende
      bezwaren ontmoet van stedebouwkundige, verkeerskundige, landschappelijke of financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel8
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '5'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '8'
        hoofdstuk: III
  - number: '9.2'
    text: |-
      Gedeputeerde Staten kunnen alleen toepassing geven aan [artikel 7, tweede lid][ref1], in de gevallen waarin
      toepassing van maatregelen, gericht op het terugbrengen van de geluidsbelasting, vanwege een weg, aan de grens
      van het betrokken geluidsgevoelig terrein, tot 55 dB(A) indien het geluidsgevoelige terreinen als bedoeld
      in [artikel 7, derde lid, onder ][ref2], betreft en tot 50dB(A) indien het een woonwagenstandplaats betreft,
      onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van stedebouwkundige, verkeerskundige,
      landschappelijke of financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel7
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '7'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '7'
        hoofdstuk: III
  - number: '10.1'
    text: |-
      Indien door toepassing van [artikel 85][ref1] of [artikel 100b van de wet][ref2] voor de uitwendige
      scheidingsconstructie van één of meer in aanbouw zijnde of aanwezige gebouwen binnen een zone van de weg een
      hogere geluidsbelasting dan 50 dB(A) als toelaatbaar is aangemerkt, treft de gemeenteraad met betrekking tot de
      geluidwering van die uitwendige scheidingsconstructie maatregelen om te bevorderen dat de geluidsbelasting, vanwege
      die weg,


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel100b
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 100b
  - number: 10.1.a
    text: binnen de verblijfsruimten, genoemd in het tweede lid, onder *a*, 30 dB(A), en
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel10
  - number: 10.1.b
    text: binnen de verblijfsruimten, genoemd in het tweede lid, onder *b*, 35 dB(A),
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel10
  - number: '10.2'
    text: 'De verblijfsruimten, bedoeld in het eerste lid zijn:'
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel10
  - number: 10.2.a
    text: |-
        - leslokalen van basisscholen;
        - theorielokalen van scholen voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref1];
        - theorielokalen van instellingen voor hoger beroepsonderwijs;
        - onderzoeks- en behandelingsruimten van ziekenhuizen en verpleeghuizen, bedoeld in
      [artikel 4, tweede lid, onder d][ref2];
        - onderzoeks-, behandelings-, recreatie- en conversatieruimten, alsmede woon- en slaapruimten van gebouwen, bedoeld
      in [artikel 4, tweede lid, onder e][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003459#Artikel4
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
  - number: 10.2.b
    text: |-
        - theorievaklokalen van scholen voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref1];
        - theorievaklokalen van instellingen voor hoger beroepsonderwijs;
        - ruimten voor patiëntenhuisvesting, alsmede recreatie- en conversatieruimten van ziekenhuizen en verpleeghuizen,
      als bedoeld in [artikel 4, tweede lid, onder d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel4
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
  - number: '12'
    text: |-
      Een verzoek als bedoeld in de [artikelen 83, eerste lid][ref1], [85][ref2] en [100][ref3] kan worden gedaan door:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '83'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '85'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 100a
  - number: 12.a
    text: |-
      burgemeester en wethouders van de gemeente waarin de woningen of de andere geluidsgevoelige bestemmingen bedoeld in
      de [artikelen 4][ref1] en [7][ref2], gesitueerd zijn of worden waarvoor de hogere waarde verzocht wordt;


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel7
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '7'
        hoofdstuk: III
  - number: 12.b
    text: |-
      burgemeester en wethouders van de gemeente waarin de weg gesitueerd is of wordt met betrekking waartoe de hogere
      waarde verzocht wordt;
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel12
  - number: 12.c
    text: |-
      de wegaanlegger of de wegbeheerder, indien het verzoek gedaan wordt in het kader van de toepassing van de
      [artikelen 79][ref1] en [99 van de wet][ref2], of - indien het betreft de aanleg of reconstructie van een rijksweg
        - in het kader van de toepassing van [artikel 76, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel76
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '79'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '99'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '76'
  - number: '13.1'
    text: |-
      De verzoeker maakt zijn voornemen tot het indienen van een verzoek in ieder geval zoveel mogelijk gelijktijdig
      bekend door middel van:
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel13
  - number: 13.1.a
    text: |-
      kennisgeving in één of meer in de in [artikel 12, onder ][ref1], bedoelde gemeente verspreiding vindende dag-,
      nieuws- of huis-aan-huisbladen en voorts op de in die gemeente gebruikelijke wijze;


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel12
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '12'
        hoofdstuk: IV
  - number: 13.1.b
    text: |-
      terinzagelegging van het ontwerp van het verzoek met de daarbij behorende stukken op het gemeentehuis van de in
      [artikel 12, onder ][ref1], bedoelde gemeente;


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel12
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '12'
        hoofdstuk: IV
  - number: 13.1.c
    text: |-
      niet op naam gestelde kennisgeving aan de gebruikers van de woningen of de woonwagenstandplaatsen, het bevoegd
      gezag van scholen en de directies van de in [artikel 4][ref1] bedoelde andere gebouwen waarvoor een hogere waarde
      wordt verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
  - number: '13.2'
    text: |-
      De verzoeker stelt een ieder in de gelegenheid gedurende vier weken vanaf de dag waarop het ontwerp van het verzoek
      ter inzage is gelegd, het ontwerp met de daarbij behorende stukken in te zien en opmerkingen ten aanzien van het
      ontwerp schriftelijk te maken.
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel13
  - number: '13.3'
    text: |-
      Indien het voornemen tot het indienen van een verzoek verband houdt met een toepassing van
      [artikel 76, tweede lid, onder ][ref1] of van [artikel 19 van de Wet op de Ruimtelijke Ordening][ref2], kan in
      afwijking van het tweede lid het ontwerp van het verzoek gedurende twee weken ter inzage worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '76'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '19'
  - number: '13.4'
    text: |-
      Burgemeester en wethouders van de gemeente, bedoeld in [artikel 12, onder ][ref1], kunnen indien zij hiertoe
      uitgenodigd zijn door een verzoeker als bedoeld in [artikel 12, onder ][ref2] , in plaats van deze toepassing geven
      aan het eerste lid of het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel12
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '12'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '12'
        hoofdstuk: IV
  - number: '14.1'
    text: Het verzoek en het ontwerp van een verzoek bevatten ten minste
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14
  - number: 14.1.a
    text: de verzochte hogere waarden;
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14
  - number: 14.1.b
    text: de redenen die aan het verzoek ten grondslag liggen;
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14
  - number: 14.1.c
    text: |-
      de resultaten van het akoestisch onderzoek als bedoeld in de [artikelen 77][ref1], [80][ref2] en
      [99 van de wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel99
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '77'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '80'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '99'
  - number: 14.1.d
    text: |-
      een beschrijving van de mogelijkheden om de geluidsbelasting van de woningen of, voor zover van toepassing, andere
      geluidsgevoelige bestemmingen bedoeld in de [artikelen 4][ref1] en [7][ref2], tot een lagere waarde te verminderen
      dan de onder *a* bedoelde, alsmede een schatting van de hieraan verbonden extra kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel7
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '7'
        hoofdstuk: III
  - number: 14.1.e
    text: |-
      een verklaring dat maatregelen als bedoeld in [artikel 111, tweede of derde lid, van de wet][ref1], zullen worden
      getroffen, indien de geluidsbelasting binnen de woning bij gesloten ramen meer bedraagt dan 35 dB(A);


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel111
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '111'
  - number: 14.1.f
    text: |-
      een beschrijving met een schetstekening of een verklaring omtrent de wijze waarop aan
      [artikel 3, eerste lid][ref1], voldaan zal worden, dan wel, indien aan dat artikel niet voldaan kan worden, de
      redenen daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel3
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '3'
        hoofdstuk: II
  - number: 14.1.g
    text: |-
      voor zover het verzoek hiertoe aanleiding geeft, een beschrijving, schetstekening en uitvoeringsplan van de
      geluidafschermende voorziening tussen weg en woningen of andere geluidsgevoelige bestemmingen bedoeld in de
      [artikelen 4][ref1] en [7][ref2], indien deze voorziening vereist is om de in het verzoek begrepen waarden te
      waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel7
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '7'
        hoofdstuk: III
  - number: '14.2'
    text: |-
      Het verzoek gaat vergezeld van een of meer kaarten met bijbehorende verklaring. Met betrekking tot deze kaart of
      kaarten is [artikel 16 van het Besluit op de ruimtelijke ordening 1985][ref1] (*Stb.* 627) van overeenkomstige
      toepassing, met dien verstande dat in plaats van "plan" telkens gelezen wordt: "verzoek". De kaart of kaarten
      geven bovendien de ligging weer van geluidszones langs wegen en spoorwegen, rond industrieterreinen en rond
      luchtvaartterreinen als bedoeld in [artikel 25, tweede lid, van de Luchtvaartwet][ref2] (*Stb.* 1958, 47), alsmede
      de in die zones voorkomende gebieden, aangewezen overeenkomstig [artikel 1.2, tweede lid, onder ][ref3], voor
      zover de woningen, gebouwen of terreinen waarop het verzoek betrekking heeft, binnen zodanige zones zijn of worden
      gesitueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003889#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003889
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '1'
  - number: '14.3'
    text: |-
      Gedeputeerde staten kunnen van de verzoeker nadere toelichting, tekeningen en kaarten verlangen, indien zij deze
      noodzakelijk achten voor de beoordeling van het verzoek.
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14
  - number: '14.4'
    text: |-
      Indien het verzoek wordt gedaan in samenhang met de voorbereiding van een bestemmingsplan dat met toepassing van
      [artikel 11 van de Wet op de Ruimtelijke Ordening][ref1] (*Stb.* 1985, 626) moet worden uitgewerkt of kan worden
      gewijzigd, kunnen gedeputeerde staten het verzoek in behandeling nemen, indien niet is voldaan aan het eerste lid,
      onder *f*, of het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel11
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '11'
  - number: 14a.1
    text: |-
      Indien burgemeester en wethouders voornemens zijn een voorzoek in te dienen als bedoeld in [artikel 82][ref1]
      handelen zij overeenkomstig [artikel 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel82a
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel13
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 82a
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '13'
        hoofdstuk: IV
  - number: 14a.2
    text: |-
      Het verzoek, bedoeld in [artikel 82][ref1], en het ontwerp van zo’n verzoek bevatten ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel82a
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 82a
  - number: 14a.2.a
    text: |-
      de verzochte hogere waarden en een aanduiding van het stedelijk gebied of gedeelte daarvan, waarop het verzoek
      betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14a
  - number: 14a.2.b
    text: de redenen die aan het verzoek ten grondslag liggen;
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14a
  - number: 14a.2.c
    text: |-
      een beschrijving van de mogelijkheden om de geluidsbelasting van de woningen of, voor zover van toepassing, andere
      geluidsgevoelige bestemmingen bedoeld in de [artikelen 4][ref1] en [7][ref2], tot een lagere waarde te verminderen
      dan de onder *a* bedoelde, alsmede een schatting van de hieraan verbonden extra kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel7
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '7'
        hoofdstuk: III
  - number: 14a.2.d
    text: |-
      een verklaring dat maatregelen als bedoeld in [artikel 111, tweede of derde lid, van de wet][ref1], zullen worden
      getroffen, indien de geluidsbelasting binnen de woning bij gesloten ramen meer bedraagt dat 35 dB(A);


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel111
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '111'
  - number: 14a.2.e
    text: |-
      voor zover het verzoek hiertoe aanleiding geeft, een beschrijving, schetstekening en uitvoeringsplan van de
      geluidafschermende voorziening tussen weg en woningen of andere geluidsgevoelige bestemmingen bedoeld in de
      [artikelen 4][ref1] en [7][ref2], indien deze voorziening vereist is om de in het verzoek begrepen waarden te
      waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel7
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '7'
        hoofdstuk: III
  - number: 14a.3
    text: |-
      Het verzoek, bedoeld in [artikel 82][ref1], gaat vergezeld van een of meer kaarten met bijbehorende verklaring en
      een geluidsniveaukaart. De kaart of de kaarten geven een aanduiding van het stedelijk gebied waarop het verzoek
      betrekking heeft. [Artikel 14, tweede lid, derde volzin][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel82a
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel14
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 82a
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '14'
        hoofdstuk: IV
  - number: 14a.4
    text: |-
      Gedeputeerde staten kunnen van burgemeester en wethouders nadere toelichting, tekeningen en kaarten verlangen,
      indien zij deze noodzakelijk achten voor de beoordeling van het verzoek.
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel14a
  - number: '15'
    text: |-
      De verzoeker zendt gelijktijdig met het indienen van zijn verzoek een afschrift van het verzoek en de hierbij
      behorende stukken naar:
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel15
  - number: 15.a
    text: de inspecteur;
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel15
  - number: 15.b
    text: de inspecteur van de Volkshuisvesting;
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel15
  - number: 15.c
    text: |-
      de verzoekgerechtigden als bedoeld in [artikel 12][ref1], die het verzoek niet hebben gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel12
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '12'
        hoofdstuk: IV
  - number: '16'
    text: |-
      Gedeputeerde staten tekenen de datum van ontvangst van een verzoek aan op het geschrift waarbij het verzoek is
      ingediend, en zenden de verzoeker een bewijs van ontvangst, waarin die datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16
  - number: 16a.1
    text: |-
      De verzoeker, bedoeld in [artikel 12, onder ][ref1], houdt binnen de in [artikel 13, tweede lid][ref2], bedoelde
      termijn een openbare zitting, waarbij een ieder de gelegenheid wordt gegeven opmerkingen te maken ten aanzien van
      het ontwerp van het verzoek, bedoeld in [artikel 13][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0003459#Artikel13
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '12'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '13'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0003459
        artikel: '13'
        hoofdstuk: IV
  - number: 16a.2
    text: |-
      De verzoeker stelt een rapport op van de wijze waarop de bevolking bij de totstandkoming van het verzoek, bedoeld
      in [artikel 12][ref1], is betrokken, waarin in ieder geval begrepen zijn een verslag van de openbare zitting en
      afschriften van de schriftelijk gemaakte opmerkingen over het ontwerp van het verzoek. De verzoeker zendt dit
      rapport onmiddellijk toe aan degenen die op de openbare zitting opmerkingen ten aanzien van het ontwerp van het
      verzoek hebben gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel12
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '12'
        hoofdstuk: IV
  - number: 16a.3
    text: |-
      Een verzoek als bedoeld in [artikel 12][ref1] gaat vergezeld van het in het tweede lid bedoelde rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel12
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '12'
        hoofdstuk: IV
  - number: 16a.4
    text: |-
      Indien burgemeester en wethouders voornemens zijn een verzoek in te dienen als bedoeld in [artikel 82][ref1]
      handelen zij overeenkomstig het eerste en tweede lid. Het verzoek gaat vergezeld van het in het tweede lid bedoelde
      rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel82a
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 82a
  - number: 16a.5
    text: |-
      Dit artikel blijft van toepassing zolang de betrokken gemeente, met inachtneming van [artikel 151][ref1] juncto
      [artikel 297 van de Gemeentewet][ref2] geen inspraakverordening heeft vastgesteld en in werking heeft laten treden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel151
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel297
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '151'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '297'
  - number: 16b.1
    text: |-
      Met betrekking tot krachtens [artikel 2 van de Wet D’gemeenten en D’provincies][ref1] (*Stb.* 1991, 449)
      aangewezen D’gemeenten is voor de in [artikel 3, eerste lid, van die wet][ref2] genoemde periode dit besluit van
      toepassing, zoals dit in dit artikel wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005182#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005182#Artikel3
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0005182
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005182
        artikel: '3'
  - number: 16b.2
    text: |-
      In [artikel 1][ref1] wordt "geven gedeputeerde staten" vervangen door: geeft de gemeenteraad of, in voorkomend
      geval, het college van burgemeester en wethouders. Voorts wordt in dat artikel "hun oordeel" vervangen door: zijn
      oordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel1a
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: 1a
        hoofdstuk: I
  - number: 16b.3
    text: |-
      In de [artikelen 2, eerste, derde en vierde lid][ref1], [3][ref2], [8, derde lid][ref3], [9][ref4] en
      [14, derde lid][ref5], wordt "Gedeputeerde staten kunnen" telkens vervangen door: De gemeenteraad of, in voorkomend
      geval, het college van burgemeester en wethouders kan.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003459#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003459#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0003459#Artikel14
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003459
        artikel: '8'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0003459
        artikel: '9'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0003459
        artikel: '14'
        hoofdstuk: IV
  - number: 16b.4
    text: |-
      In [artikel 13, derde lid][ref1], wordt "Burgemeester en wethouders van de gemeente, bedoeld
      in [artikel 12, onder ][ref2]," vervangen door: Burgemeester en wethouders van een krachtens
      [artikel 2 van de Wet D’gemeenten en D’provincies][ref3] aangewezen D’gemeente, aan wie een verzoek
      als bedoeld in de [artikelen 83, eerste lid][ref4], [85][ref5] en [100][ref6], is gedaan,. Voorts wordt
      "[artikel 12, onder ][ref7]," vervangen door: [artikel 12][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005182#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref5]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref6]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
      [ref7]: https://wetten.overheid.nl/BWBR0003459#Artikel12
      [ref8]: https://wetten.overheid.nl/BWBR0003459#Artikel12
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '13'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '12'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0005182
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '83'
      - id: ref5
        bwb_id: BWBR0003227
        artikel: '85'
      - id: ref6
        bwb_id: BWBR0003227
        artikel: 100a
      - id: ref7
        bwb_id: BWBR0003459
        artikel: '12'
        hoofdstuk: IV
      - id: ref8
        bwb_id: BWBR0003459
        artikel: '12'
        hoofdstuk: IV
  - number: 16b.5
    text: |-
      In [artikel 14, derde lid][ref1], wordt "indien zij deze noodzakelijk achten" vervangen door: indien dit naar zijn
      oordeel noodzakelijk wordt geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel14
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '14'
        hoofdstuk: IV
  - number: 16b.6
    text: |-
      In [artikel 14, vierde lid][ref1], wordt "kunnen gedeputeerde staten" vervangen door: kan de gemeenteraad, of, in
      voorkomend geval, het college van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel14
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '14'
        hoofdstuk: IV
  - number: 16b.7
    text: |-
      In [artikel 16][ref1] wordt "Gedeputeerde staten tekenen" vervangen door: De gemeenteraad of, in voorkomend geval,
      het college van burgemeester tekent. Voorts wordt "zenden" vervangen door: zendt.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel16
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '16'
        hoofdstuk: IV
  - number: 16c.1
    text: |-
      De raad van een krachtens [artikel 2 van de Wet D’gemeenten en D’provincies][ref1] aangewezen D’gemeente
      of, in voorkomend geval, het college van burgemeester en wethouders kan ambtshalve toepassing geven aan
      [artikel 83, eerste lid][ref2], [85][ref3] en [100][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005182#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0005182
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '83'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '85'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: 100a
  - number: 16c.2
    text: |-
      In geval van ambtshalve toepassing als bedoeld in het eerste lid, zijn de
      [artikelen 13, eerste en tweede lid][ref1], [14, eerste en tweede lid][ref2], [15][ref3] en [artikel 16][ref4], van
      overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003459#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0003459#Artikel16a
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '13'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '14'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0003459
        artikel: '15'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0003459
        artikel: 16a
        hoofdstuk: V
  - number: 16c.2.a
    text: |-
      de gemeenteraad telkens in de plaats treedt van de verzoeker, tenzij burgemeester en wethouders de betreffende
      bevoegdheid van de raad hebben gekregen;
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16c
  - number: 16c.2.b
    text: |-
      het voornemen toepassing te geven aan [artikel 83, eerste lid][ref1], [85][ref2] of [100][ref3] wordt bekend
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '83'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '85'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 100a
  - number: '17.1'
    text: Dit besluit kan worden aangehaald als "Besluit grenswaarden binnen zones langs wegen".
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel17
  - number: '17.2'
    text: Dit besluit treedt in werking met ingang van 1 januari 1982.
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel17
