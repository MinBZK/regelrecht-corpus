preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid en Milieuhygiëne van 2 juli 1981, DGMH/G, nr. 52962, gedaan
    in overeenstemming met Onze Ministers van Volkshuisvesting en Ruimtelijke Ordening en van Verkeer en Waterstaat en
    na overleg met Onze Ministers van Onderwijs en Wetenschappen en van Cultuur, Recreatie en Maatschappelijk Werk;

    Gelet op de artikelen 82, tweede lid, 83, eerste lid, 84, tweede lid, 85 en 86, eerste, tweede en vijfde lid, van
    de Wet geluidhinder (Stb. 1979, 99);

    Gezien het advies van de Centrale Raad voor de Milieuhygiëne (advies van 12 juni 1981);

    De Raad van State gehoord (advies van 2 november 1981, nr. 811028/25);

    Gezien het nader rapport van Onze Minister van Volksgezondheid en Milieuhygiëne van 16 november 1981, nr. 55460,
    uitgebracht in overeenstemming met Onze Ministers van Volkshuisvesting en Ruimtelijke Ordening en van Verkeer
    en Waterstaat en na overleg met Onze Ministers van Onderwijs en Wetenschappen en van Cultuur, Recreatie en
    Maatschappelijk Werk;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet geluidhinder][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: 1.b.1°
    text: |-
      uitwendige scheidingsconstructie en verblijfsruimte: hetgeen onder die begrippen wordt verstaan in het
      [Bouwbesluit 2003][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0012727
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012727
  - number: 1.b.2°
    text: |-
      gezondheidszorggebouw: hetgeen onder gezondheidszorgfunctie wordt verstaan in het [Bouwbesluit 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012727
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012727
  - number: 1.c
    text: |-
      zone: een zone langs een weg, als bedoeld in [artikel 74 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel74
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '74'
  - number: 1.d
    text: |-
      woonwagenstandplaats: een standplaats als bedoeld in [artikel 1, eerste lid, onderdeel h, van de Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 1a
    text: |-
      Indien [artikel 157 van de wet][ref1] van toepassing is geven gedeputeerde staten slechts toepassing aan de
      [artikelen 2][ref2], [5][ref3], [7][ref4] en [8][ref5], voor zover de gecumuleerde geluidsbelastingen na
      de correctie op grond van [artikel 157, derde lid, van de wet][ref6] niet leiden tot een naar hun oordeel
      onaanvaardbare geluidsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003459#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003459#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0003459#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0003227#Artikel157
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '157'
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '2'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003459
        artikel: '5'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0003459
        artikel: '7'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0003459
        artikel: '8'
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0003227
        artikel: '157'
  - number: '2.1'
    text: |-
      Gedeputeerde staten kunnen toepassing geven aan [artikel 83 van de wet][ref1] in die gevallen waarin de toepassing
      van maatregelen, gericht op het terugbrengen van de te verwachten geluidsbelasting, vanwege de weg, van de
      uitwendige scheidingsconstructie van de betrokken woningen tot 50 dB(A) onvoldoende doeltreffend zal zijn, dan wel
      overwegende bezwaren ontmoet van stedebouwkundige, verkeerskundige, landschappelijke of financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '83'
  - number: '2.2'
    text: 'Het eerste lid vindt slechts toepassing indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.2.a
    text: nog niet geprojecteerde woningen buiten de bebouwde kom, die
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.2.a.1e
    text: verspreid gesitueerd worden, of
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.2.a.2e
    text: ter plaatse noodzakelijk zijn om redenen van grond- of bedrijfsgebondenheid, of
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.2.a.3e
    text: door de gekozen situering een open plaats tussen aanwezige bebouwing opvullen, of
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.2.a.4e
    text: ter plaatse gesitueerd worden als vervanging van bestaande bebouwing;
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.2.b
    text: nog niet geprojecteerde woningen binnen de bebouwde kom, die
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.2.b.1e
    text: in een dorps- of stadsvernieuwingsplan worden opgenomen, of
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.2.b.2e
    text: |-
      door de gekozen situering of bouwvorm een doelmatige akoestisch afschermende functie gaan vervullen voor andere
      woningen - in aantal ten minste de helft van het aantal woningen waaraan de afschermende functie wordt toegekend -,
      of voor andere gebouwen of geluidsgevoelige objecten, bedoeld in de artikelen 4 en 7, eerste lid, van dit besluit,
      of
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.2.b.3e
    text: ter plaatse noodzakelijk zijn om redenen van grond- of bedrijfsgebondenheid, of
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.2.b.4e
    text: door de gekozen situering een open plaats tussen aanwezige bebouwing opvullen, of
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.2.b.5e
    text: ter plaatse gesitueerd worden als vervanging van bestaande bebouwing;
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.2.c
    text: geprojecteerde, in aanbouw zijnde of aanwezige woningen en een nog niet geprojecteerde weg, voor zover die weg
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.2.c.1e
    text: een noodzakelijke verkeers- en vervoersfunctie zal vervullen, of
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.2.c.2e
    text: |-
      een zodanige verkeersverzamelfunctie zal vervullen, dat de aanleg van die weg zal leiden tot aanmerkelijk lagere
      geluidsbelastingen van woningen binnen de zone van een andere weg.
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: '2.3'
    text: |-
      Gedeputeerde staten kunnen toepassing geven aan [artikel 83, eerste lid juncto vijfde lid, van de wet][ref1] in die
      gevallen waarin de toepassing van maatregelen, gericht op het terugbrengen van de te verwachten geluidsbelasting,
      vanwege de weg, van de uitwendige scheidingsconstructie van de betrokken woningen tot 50 dB(A) onvoldoende
      doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van stedebouwkundige, verkeerskundige, landschappelijke
      of financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '83'
  - number: '2.4'
    text: |-
      Gedeputeerde staten kunnen toepassing geven aan [artikel 100][ref1], in die gevallen waarin de toepassing van
      maatregelen, gericht op het terugbrengen van de te verwachten geluidsbelasting vanwege de weg, van de uitwendige
      scheidingsconstructie van de betrokken woningen tot de voordien geldende ten hoogste toelaatbare geluidsbelasting,
      onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van stedebouwkundige, verkeerskundige,
      landschappelijke of financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 100a
  - number: '2.5'
    text: Het vierde lid vindt slechts toepassing indien het verzoek betrekking heeft op een te reconstureren weg, die
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.5.1e
    text: een noodzakelijke verkeers- en vervoersfunctie zal vervullen, of
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: 2.5.2e
    text: |-
      een zodanige verkeersverzamelfunctie zal vervullen, dat de reconstructie van die weg zal leiden tot aanmerkelijk
      lagere geluidsbelastingen van woningen binnen de zone van een andere weg.
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel2
  - number: '3.1'
    text: |-
      Gedeputeerde staten kunnen bij de toepassing van [artikel 2][ref1] ten aanzien van nog niet geprojecteerde woningen
      alleen een hogere waarde dan 55 dB(A) als de ten hoogste toelaatbare geluidsbelasting vaststellen, indien naar hun
      oordeel voldoende verzekerd wordt, dat de verblijfsruimten, alsmede de tot de woning behorende buitenruimten niet
      aan de uitwendige scheidingsconstructie worden gesitueerd waar de hoogste geluidsbelasting optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel2
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '2'
        hoofdstuk: II
  - number: '3.2'
    text: |-
      Het eerste lid is niet van toepassing, indien naar het oordeel van gedeputeerde staten overwegingen van stedebouw
      of volkshuisvesting zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel3
  - number: '3.3'
    text: |-
      Gedeputeerde staten kunnen bij de toepassing van [artikel 2][ref1] per woning verschillende waarden vaststellen
      voor verschillende woonlagen.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel2
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '2'
        hoofdstuk: II
  - number: '4.1'
    text: |-
      Behoudens het bepaalde in de [artikelen 5][ref1], [7][ref2] en [8][ref3] is de ten hoogste toelaatbare
      geluidsbelasting, vanwege een weg, van de uitwendige scheidingsconstructie van de in het tweede lid, onder *a* tot
      en met *e*, genoemde categorieën van gebouwen binnen de zone van die weg 50 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003459#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003459#Artikel8
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '5'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003459
        artikel: '7'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003459
        artikel: '8'
        hoofdstuk: III
  - number: '4.2'
    text: 'De in het eerste lid bedoelde gebouwen zijn:'
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel4
  - number: 4.2.a
    text: basisscholen;
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel4
  - number: 4.2.b
    text: |-
      scholen voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 4.2.c
    text: instellingen voor hoger beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel4
  - number: 4.2.d
    text: algemene, categorale en academische ziekenhuizen, alsmede verpleeghuizen;
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel4
  - number: 4.2.e
    text: andere gezondheidszorggebouwen dan bedoeld onder *d*.
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel4
  - number: '4.3'
    text: |-
      Een gymnastieklokaal maakt voor de toepassing van dit besluit geen deel uit van de in het tweede lid, onder *a*,
      *b* en *c*, genoemde scholen.
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel4
  - number: '5.1'
    text: |-
      Voor gebouwen, behorend tot de in [artikel 4, tweede lid, onder ][ref1], bedoelde categorieën, kan met toepassing
      van [artikel 85 van de wet][ref2] voor de ten hoogste toelaatbare geluidsbelasting, vanwege een weg, een
      hogere waarde dan de in [artikel 4, eerste lid][ref3], genoemde worden vastgesteld, met dien verstande dat
      [artikel 83, eerste, tweede en derde lid, van de wet][ref4] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0003459#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel83
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '85'
      - id: ref3
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '83'
  - number: '5.2'
    text: |-
      Voor gebouwen, behorend tot de in [artikel 4, tweede lid, onder ][ref1], bedoelde categorie, kan met toepassing van
      [artikel 85 van de wet][ref2] voor de ten hoogste toelaatbare geluidsbelasting, vanwege een weg, een hogere waarde
      dan de in [artikel 4, eerste lid][ref3], genoemd worden vastgesteld, met dien verstande dat deze waarde 55 dB(A)
      niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0003459#Artikel4
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '85'
      - id: ref3
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
  - number: '7.1'
    text: |-
      Behoudens het in het tweede lid bepaalde is de ten hoogste toelaatbare geluidsbelasting, vanwege een weg, aan de
      grens van binnen de zone van die weg gelegen geluidsgevoelige terreinen als bedoeld in het derde lid, onder *a*, 55
      dB(A) en aan de grens van binnen die zone gelegen woonwagenstandplaatsen, 50 dB(A).
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel7
  - number: '7.2'
    text: |-
      Bij de toepassing van [artikel 85 van de wet][ref1] kan voor de ten hoogste toelaatbare geluidsbelasting, vanwege
      een weg, aan de grens van geluidsgevoelige terreinen als bedoeld in het derde lid, een hogere waarde, dan de in
      dat lid genoemde worden vastgesteld, met dien verstande dat deze waarde indien het geluidsgevoelige terreinen als
      bedoeld in het derde lid, onder *a*, betreft 60 dB(A) en indien het een woonwagenstandplaats betreft, 55 dB(A) niet
      te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel85
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '85'
  - number: '7.3'
    text: 'De in het eerste en tweede lid bedoelde geluidsgevoelige terreinen zijn:'
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel7
  - number: 7.3.a
    text: |-
      terreinen die behoren bij gebouwen als bedoeld in [artikel 4, tweede lid, onder ][ref1], voor zover deze bestemd
      zijn of gebruikt worden voor de in die gebouwen gegeven zorg, of


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
  - number: 7.3.b
    text: woonwagenstandplaatsen.
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel7
  - number: '8.1'
    text: |-
      Behoudens het tweede, derde en vierde lid geldt als de ten hoogste toelaatbare geluidsbelasting, vanwege
      een te reconstrueren weg, van de uitwendige scheidingsconstructie van gebouwen, behorende tot de in
      [artikel 4, tweede lid, onder ][ref1], bedoelde categorieën, binnen een zone, de voor de reconstructie ter plaatse
      heersende geluidsbelasting, met dien verstande dat een geluidsbelasting waarvan de waarde 50 dB(A) niet te boven
      gaat, in elk geval als toelaatbaar aangemerkt blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
  - number: '8.2'
    text: |-
      Ingeval eerder op grond van de wet een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting,
      vanwege de te reconstrueren weg, van de uitwendige scheidingsconstructie van gebouwen, behorende tot de in
      [artikel 4, tweede lid, onder ][ref1], bedoelde categorieën, is vastgesteld dan 50 dB(A), geldt de laagste van de
      volgende twee waarden als de ten hoogste toelaatbare


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
  - number: 8.2.a
    text: de heersende waarde;
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel8
  - number: 8.2.b
    text: de eerder vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel8
  - number: '8.3'
    text: |-
      Gedeputeerde staten kunnen voor de ten hoogste toelaatbare geluidsbelasting van de uitwendige scheidingsconstructie
      van gebouwen, behorende tot de in [artikel 4, tweede lid, onder ][ref1], bedoelde categorieën, een hogere waarde
      dan de ingevolge het eerste en tweede lid geldende vaststellen, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
  - number: 8.3.a
    text: de verhoging 5dB(A) niet te boven mag gaan, en
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel8
  - number: 8.3.b
    text: |-
      ingeval voor het betrokken gebouw eerder toepassing is gegeven aan dit besluit of, indien geen toepassing is
      gegeven aan dit besluit en de heersende waarde 55 dB(A) niet te boven gaat, de waarde niet hoger mag worden gesteld
      dan:
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel8
  - number: 8.3.b.1°
    text: |-
      60 dB(A) voor gebouwen, behorende tot de in [artikel 4, tweede lid, onder ][ref1], bedoelde categorieën, bij een
      reconstructie van een weg in buitenstedelijk gebied,


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
  - number: 8.3.b.2°
    text: |-
      65 dB(A) voor gebouwen, behorende tot de in [artikel 4, tweede lid, onder ][ref1], bedoelde categorieën, bij een
      reconstructie van een weg in stedelijk gebied, en


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
  - number: 8.3.b.3°
    text: |-
      55 dB(A) voor gebouwen, behorende tot de in [artikel 4, tweede lid, onder ][ref1], bedoelde categorie, bij een
      reconstructie van een weg in buitenstedelijk of stedelijk gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
        hoofdstuk: III
  - number: '8.4'
    text: 'De op grond van het derde lid, onder *a*, te stellen hogere waarde mag niet hoger worden gesteld dan:'
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel8
  - number: 8.4.a
    text: |-
      70 dB(A) voor gebouwen, behorende tot de in [artikel 4, tweede lid, onder ][ref1], bedoelde categorieën, en


      [ref1]: https://wetten.overheid.nl/BWBR0003459#Artikel4
    url: https://wetten.overheid.nl/BWBR0003459/2003-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003459
        artikel: '4'
