  - number: '14'
    text: |-
      1 De verwijdering van dierlijke bijproducten, bedoeld in artikel 24 van [verordening nr. 1774/2002](32002R1774),
      geschiedt niet zonder toestemming van Onze Minister en geschiedt, voor zover van toepassing, met inachtneming van
      de artikelen 6, 7 en 9 van [verordening nr. 811/2003](32003R0811).

      2 De in het eerste lid bedoelde toestemming is niet vereist voor het begraven van kadavers van gezelschapsdieren,
      mits de kadavers rechtstreeks als afval worden verwijderd door begraving op een terrein dat ter beschikking staat
      van de eigenaar of houder van desbetreffende dode dieren, dan wel op een plaats die ingevolge een besluit van het
      college van burgemeester en wethouders daarvoor is toegelaten.
    url: https://wetten.overheid.nl/BWBR0018514/2005-09-07#Artikel14
  - number: '15'
    text: Het is verboden in strijd te handelen met artikel 25 van [verordening nr. 1774/2002](32002R1774).
    url: https://wetten.overheid.nl/BWBR0018514/2005-09-07#Artikel15
  - number: '16'
    text: |-
      Het is verboden in strijd te handelen met bijlage XI, hoofdstuk A, punt 5, bij [verordening nr. 999/2001]
      (32001R0999).
    url: https://wetten.overheid.nl/BWBR0018514/2005-09-07#Artikel16
  - number: '17'
    text: |-
      1 Het is verboden zonder erkenning:

      a. als bedoeld in artikel 10, eerste lid, van [verordening nr. 1774/2002](32002R1774), een intermediair categorie
      1-bedrijf, een intermediair categorie 2-bedrijf of een intermediair categorie 3-bedrijf in werking te hebben, uit
      te breiden of te wijzigen;

      b. als bedoeld in artikel 11, eerste lid, van [verordening nr. 1774/2002](32002R1774), een opslagbedrijf in werking
      te hebben, uit te breiden of te wijzigen;

      c. als bedoeld in artikel 12, eerste lid, van [verordening nr. 1774/2002](32002R1774), een verbrandingsinstallatie
      als bedoeld in artikel 12, tweede of derde lid, van [verordening nr. 1774/2002](32002R1774) in werking te hebben,
      uit te breiden of te wijzigen;

      d. als bedoeld in artikel 13, eerste lid, van [verordening nr. 1774/2002](32002R1774), een categorie 1-
      verwerkingsbedrijf of een categorie 2-verwerkingsbedrijf in werking te hebben, uit te breiden of te wijzigen;

      e. als bedoeld in artikel 14, eerste lid, van [verordening nr. 1774/2002](32002R1774), een categorie 2-oleochemisch
      bedrijf of een categorie 3-oleochemisch bedrijf in werking te hebben, uit te breiden of te wijzigen;

      f. als bedoeld in artikel 15, eerste lid, van [verordening nr. 1774/2002](32002R1774), een biogasinstallatie of een
      composteerinstallatie in werking te hebben, uit te breiden of te wijzigen;

      g. als bedoeld in artikel 17, eerste lid, van [verordening nr. 1774/2002](32002R1774), een categorie 3-
      verwerkingsbedrijf in werking te hebben, uit te breiden of te wijzigen;

      h. als bedoeld in artikel 18, eerste lid, van [verordening nr. 1774/2002](32002R1774), een bedrijf voor de
      productie van voeder voor gezelschapsdieren in werking te hebben, uit te breiden of te wijzigen;

      i. als bedoeld in artikel 18, eerste lid, van [verordening nr. 1774/2002](32002R1774), een technisch bedrijf in
      werking te hebben, uit te breiden of te wijzigen.

      2 De in het eerste lid, aanhef en onderdeel i, bedoelde erkenning wordt verleend voor behandeling of productie van
      technische producten.

      3 De in het eerste lid bedoelde erkenning wordt aangevraagd bij de door Onze Minister aangewezen dienst.
    url: https://wetten.overheid.nl/BWBR0018514/2005-09-07#Artikel17
  - number: '18'
    text: |-
      Het is, voor zover van toepassing, verboden een overeenkomstig [artikel 17][ref1]:

      a. erkend intermediair categorie 1-bedrijf of intermediair categorie 2-bedrijf in werking te hebben in strijd met
      de eisen van bijlage III, hoofdstuk I en hoofdstuk II, onderdeel B, van [verordening nr. 1774/2002](32002R1774);

      b. erkend intermediair categorie 3-bedrijf in werking te hebben in strijd met de eisen van bijlage III, hoofdstuk I
      en hoofdstuk II, onderdeel A, van [verordening nr. 1774/2002](32002R1774);

      c. erkend opslagbedrijf in werking te hebben in strijd met de eisen van bijlage III, hoofdstuk III, van
      [verordening nr. 1774/2002](32002R1774);

      d. erkende verbrandingsinstallatie of een erkende meeverbrandingsinstallatie waarop [richtlijn nr. 2000/76/EG]
      (32000L0076) niet van toepassing is in werking te hebben in strijd met artikel 12, derde lid, onderdelen a en b, en
      met de eisen van bijlage IV van [verordening nr. 1774/2002](32002R1774);

      e. erkend categorie 1-verwerkingsbedrijf of categorie 2-verwerkingsbedrijf in werking te hebben in strijd met de
      eisen van bijlage V, hoofdstukken I en II, en bijlage VI, hoofdstuk I van [verordening nr. 1774/2002](32002R1774);

      f. erkend categorie 2-oleochemisch bedrijf of categorie 3-oleochemisch bedrijf in werking te hebben in strijd met
      artikel 14, tweede lid, onderdelen c en d, van [verordening nr. 1774/2002](32002R1774) en met de eisen van bijlage
      VI, hoofdstuk III, van [verordening nr. 1774/2002](32002R1774);

      g. erkende biogasinstallatie of composteerinstallatie in werking te hebben in strijd met artikel 15, tweede lid,
      onderdelen d en e, en met de eisen van bijlage VI, hoofdstuk II, van [verordening nr. 1774/2002](32002R1774);

      h. erkend categorie 3-verwerkingsbedrijf in werking te hebben in strijd met de eisen van bijlage V, hoofdstukken I
      en II, bijlage VII en, indien het een verzamelcentrum is, bijlage IX, van [verordening nr. 1774/2002](32002R1774),
      of, voor zover van toepassing, in strijd met de artikelen 3 en 4 van [verordening nr. 811/2003](32003R0811);

      i. erkend bedrijf voor de vervaardiging van voeder voor gezelschapsdieren in werking te hebben in strijd met
      [artikel 18, tweede lid][ref2], en met de eisen van bijlage VIII, van [verordening nr. 1774/2002](32002R1774);

      j. erkend technisch bedrijf in werking te hebben in strijd met [artikel 18, tweede lid][ref3], en met de eisen van
      bijlage VIII, van [verordening nr. 1774/2002](32002R1774).


      [ref1]: https://wetten.overheid.nl/BWBR0018514#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0018514#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0018514#Artikel18
