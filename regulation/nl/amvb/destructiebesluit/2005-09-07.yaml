  - number: '11'
    text: Het is verboden in strijd te handelen met artikel 9, eerste lid, van [verordening nr. 1774/2002](32002R1774).
    url: https://wetten.overheid.nl/BWBR0018514/2005-09-07#Artikel11
  - number: '12'
    text: |-
      1 Het is verboden in strijd te handelen met artikel 22, eerste lid, van [verordening nr. 1774/2002](32002R1774).

      2 Het verbod, bedoeld in het eerste lid, geldt niet voor het voederen van vismeel aan vissen.

      3 Het is de eigenaar of de houder van ander vee dan pelsdieren verboden keukenafval en etensresten of
      voedermiddelen die keukenafval en etensresten bevatten of daarvan afkomstig zijn, voorhanden te hebben.

      4 Het verbod, bedoeld in het derde lid, geldt niet voor het voorhanden hebben van keukenafval en etensresten
      die zijn ontstaan in de eigen huishouding van de eigenaar of houder van ander vee dan pelsdieren, indien deze
      uitsluitend verpakt voorhanden worden gehouden in afwachting van afvoer, op zodanige wijze dat zij onbereikbaar
      zijn voor het vee.

      5 Het is verboden keukenafval en etensresten of voedermiddelen die keukenafval en etensresten bevatten of daarvan
      afkomstig zijn te vervoeren naar plaatsen waar ander vee dan pelsdieren wordt gehouden of af te leveren aan
      eigenaren of houders van ander vee dan pelsdieren.

      6 Het is verboden dieren, die behoren tot de orde Artiodactyla, onderordes Ruminantia, Suina en Tylopoda, ongeacht
      het gebruiksdoel of de leefomgeving van deze dieren te voederen met keukenafval en etensresten of voedermiddelen
      die keukenafval en etensresten bevatten of daarvan afkomstig te zijn.
    url: https://wetten.overheid.nl/BWBR0018514/2005-09-07#Artikel12
  - number: '13'
    text: |-
      1 Het is verboden de in artikel 23, eerste lid, van [verordening nr. 1774/2002](32002R1774) genoemde activiteiten
      te verrichten, tenzij daarvoor toestemming is verleend door Onze Minister.

      2 Het is verboden de in artikel 23, tweede lid, van [verordening nr. 1774/2002](32002R1774) genoemde activiteiten
      te verrichten, tenzij daarvoor toestemming is verleend door Onze Minister.

      3 De in het eerste en tweede lid bedoelde toestemming, alsmede de toestemming, bedoeld in de
      [artikelen 4, tweede lid][ref1], [5, tweede lid][ref2], [9, derde lid][ref3], en [14, eerste lid][ref4], wordt
      aangevraagd bij de door Onze Minister aangewezen dienst.


