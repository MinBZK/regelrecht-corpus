  - number: '19'
    text: |-
      Ter uitvoering van [verordening nr. 1774/2002](32002R1774) wordt afgeweken van:

      a. de [artikelen 3][ref1], [4, tweede en derde lid][ref2], [4a][ref3], [4b][ref4], [4c][ref5], [4d][ref6],
      [5][ref7], [5a][ref8], [6][ref9], [8][ref10], [9][ref11], [11][ref12], [13, tweede, derde en vierde lid][ref13],
      en [15 van de wet][ref14];

      b. [artikel 12, eerste lid, van de wet][ref15], voor zover het de aan de eigenaar of houder van hoog- of
      gespecificeerd hoog-risico-materiaal opgelegde verplichting betreft het materiaal overeenkomstig door Onze Minister
      te stellen regelen te administreren;

      c. [artikel 12, tweede lid, van de wet][ref16], voor zover het de aan de ondernemer opgelegde verplichting betreft
      hoog- of gespecificeerd hoog-risico-materiaal overeenkomstig de bij of krachtens [de wet][ref17] gegeven regelen
      te vervoeren;

      d. [artikel 12, derde lid, van de wet][ref18], voor zover het de aan de eigenaar of houder van laag-risico-
      materiaal opgelegde verplichting betreft zorg te dragen dat het materiaal overeenkomstig Onze Minister te stellen
      regelen wordt verpakt en geëtiketteerd;

      e. [artikel 17, eerste lid, onderdeel b, van de wet][ref19], voor zover het de bevoegdheid betreft bij plaatselijke
      verordening regelen te stellen ter zake van het vervoer van hoog-risico-materiaal.


