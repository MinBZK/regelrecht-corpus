  - number: '37'
    text: |-
      1 [Artikel 17][ref1] is niet van toepassing op:

      a. een biogasinstallatie of composteerinstallatie waarin uitsluitend mest of categorie 3-materiaal als grondstof
      wordt verwerkt;

      b. een oleochemisch bedrijf dat zowel van categorie 2-materiaal als van categorie 3-materiaal verkregen vet
      verwerkt;

      c. een technisch bedrijf voor vervaardiging van verwerkte mest,

      mits de installatie of het bedrijf door Onze Minister overeenkomstig
      [artikel 18, eerste lid, van de uitvoeringsregeling][ref2] is erkend en de installatie of het bedrijf sinds
      1 november 2002 overeenkomstig de in het tweede lid genoemde voorwaarden in gebruik is.

      2 Indien:

      a. het een biogasinstallatie betreft, is voldaan aan bijlage VI, hoofdstuk II, onder B, van [verordening nr.
      1774/2002](32002R1774), is de installatie uitgerust overeenkomstig artikel 1, tweede lid, van [verordening nr.
      810/2003](32003R0810) en is voldaan aan artikel 1, derde lid, van die verordening;

      b. het een composteerinstallatie betreft, is voldaan aan bijlage VI, hoofdstuk II, onder B, van [verordening nr.
      1774/2002](32002R1774), is de installatie uitgerust overeenkomstig artikel 1, tweede lid, van [verordening nr.
      809/2003](32003R0809) en is voldaan aan artikel 1, derde lid, van die verordening;

      c. het een oleochemisch bedrijf betreft, wordt in het bedrijf een methode toegepast voor monitoring en controle
      op kritische controlepunten op basis van het gebruikte procédé en wordt overeenkomstig artikel 1, tweede lid, van
      beschikking nr. 2003/326 gehandeld;

      d. het een technisch bedrijf betreft, is het bedrijf sinds 1 november 2002 tot de inwerkingtreding van de
      [uitvoeringsregeling][ref3] op grond van [artikel 11.6 van de Regeling keuring en handel dierlijke producten][ref4]
      geregistreerd en is voldaan aan bijlage VIII, hoofdstuk III, punt 5, van [verordening nr. 1774/2002](32002R1774)
      met dien verstande dat onderdeel b van punt 5 niet van toepassing is.

      3 De in het eerste lid bedoelde erkenning vervalt indien de installatie of het bedrijf wordt uitgebreid of de
      werkzaamheden worden gewijzigd.

      4 Het eerste lid is van toepassing tot:

      a. 1 januari 2006, voor zover het een biogas- of composteerinstallatie of een technisch bedrijf betreft;

      b. 1 november 2005, voor zover het een oleochemisch bedrijf betreft.

      5 Met de erkenning, bedoeld in het eerste lid, wordt gelijkgesteld, indien het een technisch
      bedrijf betreft, een vóór de inwerkingtreding van de [uitvoeringsregeling][ref5] op grond van
      [artikel 11.6 van de Regeling keuring en handel dierlijke producten][ref6] verrichte registratie voor desbetreffend
      technisch product, mits de registratie op het tijdstip van inwerkingtreding van de [uitvoeringsregeling][ref7] niet
      is doorgehaald.

      6 Het is verboden een overeenkomstig [artikel 18, eerste lid, van de uitvoeringsregeling][ref8] erkende
      biogasinstallatie, composteerinstallatie, oleochemisch of technisch bedrijf in werking te hebben in strijd met het
      tweede lid.


