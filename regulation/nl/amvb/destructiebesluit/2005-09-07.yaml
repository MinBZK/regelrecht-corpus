preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit 21 maart 2005, nr. TRCJZ/2005/868,
    directie Juridische Zaken, gedaan in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport;

    Gelet op verordening (EG) nr. 999/2001/EG van het Europees Parlement en de Raad van de Europese Unie van 22 mei
    2001 (PbEG L 147) houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde
    overdraagbare spongiforme encefalopathieën, verordening (EG) nr. 1774/2002/EG van het Europees Parlement en de
    Raad van de Europese Unie van 3 oktober 2002 (PbEG L 273) tot vaststelling van gezondheidsvoorschriften inzake
    niet voor menselijke consumptie bestemde dierlijke bijproducten, verordening (EG) nr. 809/2003 van de Commissie
    van de Europese Gemeenschappen van 12 mei 2003 (PbEU L 117) inzake overgangsmaatregelen krachtens verordening (EG)
    nr. 1774/2002 van het Europees Parlement en de Raad van de Europese Unie wat betreft de verwerkingsnormen voor
    categorie 3-materiaal en mest, gebruikt in composteerinstallaties, verordening (EG) nr. 810/2003 van de Commissie
    van de Europese Gemeenschappen van 12 mei 2003 (PbEU L 117) inzake overgangsmaatregelen krachtens verordening (EG)
    nr. 1774/2002 van het Europees Parlement en de Raad van de Europese Unie wat betreft de verwerkingsnormen voor
    categorie 3-materiaal en mest, gebruikt in biogasinstallaties, verordening (EG) nr. 811/2003 van de Commissie van
    de Europese Gemeenschappen van 12 mei 2003 (PbEU L 117) ter uitvoering van verordening (EG) nr. 1774/2002 van het
    Europees Parlement en de Raad wat betreft het verbod op hergebruik binnen dezelfde soort voor vis, de begraving
    en verbranding van dierlijke bijproducten en bepaalde overgangsmaatregelen, verordening (EG) nr. 812/2003 van
    de Commissie van de Europese Gemeenschappen van 12 mei 2003 (PbEU L 117) inzake overgangsmaatregelen krachtens
    verordening (EG) nr. 1774/2002 van het Europees Parlement en de Raad wat betreft de invoer en doorvoer van
    bepaalde producten uit derde landen, verordening (EG) nr. 668/2004 van de Commissie van de Europese Gemeenschappen
    van 10 maart 2004 (PbEU L 112) tot wijziging van een aantal bijlagen bij verordening (EG) nr. 1774/2002 van het
    Europees Parlement en de Raad wat betreft de invoer van dierlijke bijproducten uit derde landen, verordening
    (EG) nr. 12/2005 van de Commissie van de Europese Gemeenschappen van 6 januari 2005 (PbEU L5) tot wijziging van
    de verordeningen (EG) nr. 809/2003 en (EG) nr. 810/2003 wat betreft de verlenging van de geldigheidsduur van
    de overgangsmaatregelen voor composteer- en biogasinstallaties krachtens verordening (EG) nr. 1774/2002 van het
    Europees Parlement en de Raad, beschikking nr. 2003/326 van de Commissie van de Europese Gemeenschappen van 12 mei
    2003 inzake overgangsmaatregelen krachtens verordening (EG) nr. 1774/2002 van het Europees Parlement en de Raad
    wat betreft de scheiding van categorie 2- en categorie 3-oleochemische bedrijven (PbEU L 117), beschikking nr.
    2003/329 van de Commissie van de Europese Gemeenschappen van 12 mei 2003 inzake overgangsmaatregelen krachtens
    verordening (EG) nr. 1774/2002 van het Europees Parlement en de Raad wat betreft de warmtebehandeling van mest
    (PbEU L 117), beschikking nr. 2004/407 van de Commissie van de Europese Gemeenschappen van 26 april 2004 inzake
    overgangsbepalingen op het gebied van hygiëne en certificatie krachtens verordening (EG) nr. 1774/2002 van het
    Europees Parlement en de Raad wat betreft de invoer van fotografische gelatine uit bepaalde derde landen (PbEU
    L 208), beschikking nr. 2005/14 van de Commissie van de Europese Gemeenschappen van 6 januari 2005 tot wijziging
    van beschikking 2003/329/EG wat betreft de verlenging van de geldigheidsduur van de overgangsmaatregelen voor de
    warmtebehandeling van mest krachtens verordening (EG) nr. 1774/2002 van het Europees Parlement en de Raad (PbEU
    L7), en de artikelen 2, 10, 12, 14 en 23 van de Destructiewet;

    De Raad van State gehoord (advies van 11 mei 2005, nr. W11.05.0096/V);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 23 juni 2005, no.
    TRCJZ/2005/1832, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
