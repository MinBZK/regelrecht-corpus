    text: |-
      1 In dit besluit wordt verstaan onder:

      a. [verordening nr. 1774/2002](32002R1774): [verordening nr. 1774/2002/EG](32002R1774) van het Europees Parlement
      en de Raad van de Europese Unie van 3 oktober 2002 tot vaststelling van gezondheidsvoorschriften inzake niet voor
      menselijke consumptie bestemde dierlijke bijproducten (PbEG L 273);

      b. [verordening nr. 809/2003](32003R0809): [verordening (EG) nr. 809/2003](32003R0809) van de Commissie van de
      Europese Gemeenschappen van 12 mei 2003 inzake overgangsmaatregelen krachtens [Verordening (EG) nr. 1774/2002]
      (32002R1774) van het Europees Parlement en de Raad van de Europese Unie wat betreft de verwerkingsnormen voor
      categorie 3-materiaal en mest, gebruikt in composteerinstallaties (PbEU L 117);

      c. [verordening nr. 810/2003](32003R0810): [verordening (EG) nr. 810/2003](32003R0810) van de Commissie van de
      Europese Gemeenschappen van 12 mei 2003 inzake overgangsmaatregelen krachtens [Verordening (EG) nr. 1774/2002]
      (32002R1774) van het Europees Parlement en de Raad van de Europese Unie wat betreft de verwerkingsnormen voor
      categorie 3-materiaal en mest gebruikt in biogasinstallaties (PbEU L 117);

      d. [verordening nr. 811/2003](32003R0811): [verordening (EG) nr. 811/2003](32003R0811) van de Commissie van de
      Europese Gemeenschappen van 12 mei 2003 ter uitvoering van [verordening (EG) nr. 1774/2002](32002R1774) van het
      Europees Parlement en de Raad wat betreft het verbod op hergebruik binnen dezelfde soort voor vis, de begraving en
      verbranding van dierlijke bijproducten en bepaalde overgangsmaatregelen (PbEU L 117);

      e. [verordening nr. 999/2001](32001R0999): [verordening (EG) nr. 999/2001/EG](32001R0999) van het Europees
      Parlement en de Raad van de Europese Unie van 22 mei 2001, houdende vaststelling van voorschriften inzake
      preventie, bestrijding en uitroeiing van bepaalde overdraagbare spongiforme encefalopathieën (PbEG L 147);

      f. [richtlijn nr. 2000/76/EG](32000L0076): [richtlijn nr. 2000/76/EG](32000L0076) van het Europees Parlement en de
      Raad van de Europese Unie van 4 december 2000 betreffende de verbranding van afval (PbEG L 332);

      g. beschikking nr. 2003/326: beschikking nr. 2003/326/EG van de Commissie van de Europese Gemeenschappen van 12 mei
      2003 inzake overgangsmaatregelen krachtens [Verordening (EG) nr. 1774/2002](32002R1774) van het Europees Parlement
      en de Raad van de Europese Unie wat betreft de scheiding van categorie 2- en categorie 3-oleochemische bedrijven
      (PbEU L 117);

      h. beschikking nr. 2004/407: beschikking nr. 2004/407 van de Commissie van de Europese Gemeenschappen van 26 april
      2004 inzake overgangsbepalingen op het gebied van hygiëne en certificatie krachtens [Verordening nr. 1774/2002]
      (32002R1774) van het Europees Parlement en de Raad wat betreft de invoer van fotografische gelatine uit bepaalde
      derde landen (PbEU L 208);

      i. Onze Minister: Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

