      In afwijking van [artikel 1 van de wet][ref1] wordt, ter uitvoering van [verordening nr. 1774/2002](32002R1774),
      voor de toepassing van [artikel 10 van die wet][ref2] verstaan onder:

      a. ondernemer: natuurlijke of rechtspersoon, aan wie of aan welke door Onze Minister een erkenning als bedoeld in
      artikel 13, eerste lid, van [verordening nr. 1774/2002](32002R1774) is verleend;

      b. verwerking: het onschadelijk maken van categorie 1- of categorie 2-materiaal door het overeenkomstig artikel 4,
      tweede lid, onderdeel b, en artikel 5, tweede lid, onderdelen b en c, van [verordening nr. 1774/2002](32002R1774)
      te verwerken of te verwijderen, door of onder verantwoordelijkheid van een op grond van artikel 13 van [verordening
      nr. 1774/2002](32002R1774) erkend verwerkingsbedrijf;

      c. hoog- of gespecificeerd hoog-risico-materiaal: categorie 1- of categorie 2-materiaal;

      d. verwerkingsbedrijf: op grond van artikel 13 van [verordening nr. 1774/2002](32002R1774) erkend
      verwerkingsbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel10
