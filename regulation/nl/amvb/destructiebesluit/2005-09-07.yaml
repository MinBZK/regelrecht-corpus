      - id: ref2
        bwb_id: BWBR0002244
        artikel: '10'
  - number: '33'
    text: |-
      1 De schadeloosstelling, bedoeld in [artikel 10, vijfde lid, van de wet][ref1], wordt vastgesteld op het door Onze
      Minister te bepalen gedeelte van de werkelijke lasten die het gevolg zijn van de overdracht, verminderd met het
      door hem te bepalen gedeelte van de uit de overdracht voortvloeiende kosten.

      2 Het te betalen bedrag, bedoeld in [artikel 10, vijfde lid, van de wet][ref2], wordt door Onze Minister
      vastgesteld op het door hem te bepalen bedrag van de werkelijke baten die het gevolg zijn van de overdracht,
      verminderd met de uit de overdracht voortvloeiende lasten.

      3 De betaling van de schadeloosstelling of van het bedrag geschiedt binnen zes maanden nadat de werkzaamheden zijn
      overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel10
    url: https://wetten.overheid.nl/BWBR0018514/2005-09-07#Artikel33
