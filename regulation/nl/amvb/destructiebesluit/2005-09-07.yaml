        artikel: 2.8b
  - number: '10'
    text: |-
      1 Het verbod, bedoeld in [artikel 9, vijfde lid][ref1], geldt niet ten aanzien van de invoer van de in artikel 1
      van beschikking nr. 2004/407 genoemde fotografische gelatine vanuit de in bijlage I bij deze beschikking genoemde
      derde landen, mits:

      a. de fotografische gelatine vergezeld gaat van het in bijlage III, van beschikking nr. 2004/407 bedoelde
      gezondheidscertificaat;

      b. de fotografische gelatine afkomstig is van de in bijlage I, van beschikking nr. 2004/407 genoemde bedrijven
      van oorsprong;

      c. de fotografische gelatine via de in bijlage I, van beschikking nr. 2004/407 genoemde grensinspectieposten wordt
      ingevoerd;

      d. de fotografische gelatine bestemd is voor de in bijlage I, van beschikking nr. 2004/407 genoemde en door Onze
      Minister erkende fotografische fabrieken.

      2 In afwijking van het eerste lid, onderdeel c, kan in door Onze Minister te bepalen bijzondere gevallen de
      fotografische gelatine via een andere grensinspectiepost worden ingevoerd.

      3 Het is uitsluitend toegestaan fotografische gelatine te gebruiken voor de vervaardiging van fotografische
      producten, in fotografische fabrieken als bedoeld in het eerste lid, onderdeel d.

      4 De exploitant van een fotografische fabriek als bedoeld in het eerste lid, onderdeel d, voldoet aan artikel 3,
      eerste lid, van beschikking nr. 2004/407.

      5 Een fotografische fabriek als bedoeld in het eerste lid, onderdeel d, wordt door Onze Minister erkend indien deze
      een administratie bijhoudt als bedoeld in artikel 3, tweede lid, van beschikking nr. 2004/407 en deze gedurende
      twee jaar bewaart.

      6 De erkenning, bedoeld in het vijfde lid, wordt door Onze Minister ingetrokken, indien naar het oordeel van Onze
      Minister blijkt dat een fotografische fabriek als bedoeld in het eerste lid, onderdeel d, niet voldoet aan het
      vierde en het vijfde lid.

      7 Fotografische gelatine wordt in voertuigen, waarin niet tegelijkertijd voor levensmiddelen of diervoeders
      bestemde producten worden vervoerd, met inbegrip van gelatine bestemd voor andere doeleinden dan gebruik in de
      fotografische industrie, rechtstreeks van de grensinspectieposten, bedoeld in het eerste lid, onderdeel c, vervoerd
      naar de fotografische fabrieken, bedoeld in het eerste lid, onderdeel d.

      8 Tijdens het vervoer, bedoeld in het zevende lid, gaat de fotografische gelatine vergezeld van het in bijlage III,
      van beschikking nr. 2004/407 bedoelde gezondheidscertificaat.


