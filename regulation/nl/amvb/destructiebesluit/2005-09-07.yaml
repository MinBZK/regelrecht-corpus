  - number: '36'
    text: |-
      1 De toestemming, bedoeld in [artikel 4, tweede lid, van de uitvoeringsregeling][ref1] geldt als de toestemming,
      bedoeld in [artikel 4, tweede lid][ref2], van dit besluit.

      2 De toestemming, bedoeld in [artikel 5, tweede lid, van de uitvoeringsregeling][ref3] geldt als de toestemming,
      bedoeld in [artikel 5, tweede lid][ref4], van dit besluit.

      3 De toestemming, bedoeld in [artikel 8, derde lid, van de uitvoeringsregeling][ref5] geldt als de toestemming,
      bedoeld in [artikel 9, derde lid][ref6], van dit besluit.

      4 Een erkenning als bedoeld in [artikel 8a, vijfde lid, van de uitvoeringsregeling][ref7] geldt als een erkenning
      als bedoeld in [artikel 10, vijfde lid][ref8], van dit besluit.

      5 De toestemming, bedoeld in [artikel 11, eerste en tweede lid, van de uitvoeringsregeling][ref9] geldt als de
      toestemming, bedoeld in [artikel 13, eerste en tweede lid][ref10], van dit besluit.

      6 De toestemming, bedoeld in [artikel 12, eerste lid, van de uitvoeringsregeling][ref11] geldt als de toestemming,
      bedoeld in [artikel 14, eerste lid][ref12], van dit besluit.

      7 Erkenningen als bedoeld in [artikel 16, eerste lid, van de uitvoeringsregeling][ref13] worden geacht te zijn
      verleend conform [artikel 17, eerste lid][ref14], van dit besluit.


