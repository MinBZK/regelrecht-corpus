  - number: '29'
    text: |-
      In afwijking van [artikel 1 van de wet][ref1] wordt, ter uitvoering van [verordening nr. 1774/2002](32002R1774),
      voor de toepassing van [artikel 21 van die wet][ref2] verstaan onder:

      a. ondernemer: natuurlijke of rechtspersoon, aan wie of aan welke door Onze Minister een erkenning als bedoeld in
      artikel 13, eerste lid, van [verordening nr. 1774/2002](32002R1774) is verleend;

      b. gespecificeerd hoog-risico-materiaal als bedoeld in artikel 2, zevende, achtste of negende lid: categorie
      1-materiaal of categorie 2-materiaal als bedoeld in artikel 5, eerste lid, onderdelen b tot en met f, van
      [verordening nr. 1774/2002](32002R1774).


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel21
    url: https://wetten.overheid.nl/BWBR0018514/2005-09-07#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002244
        artikel: '21'
  - number: '30'
    text: |-
      1 Categorie 1- of categorie 2-materiaal wordt door de natuurlijke of rechtspersoon, aan wie of aan welke door
      Onze Minister een erkenning als bedoeld in artikel 13, eerste lid, van [verordening nr. 1774/2002](32002R1774)
      is verleend, opgehaald uiterlijk op de eerste werkdag volgend op die waarop het door de eigenaar of houder
      daarvan, overeenkomstig [artikel 12 van de wet][ref1], is aangemeld, tenzij het categorie 1- of categorie 2-
      materiaal betreft dat overeenkomstig door Onze Minister gestelde regels op gezette tijden door deze natuurlijke of
      rechtspersoon wordt opgehaald.

      2 Het eerste lid is niet van toepassing op dode gezelschapsdieren.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel12
    url: https://wetten.overheid.nl/BWBR0018514/2005-09-07#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '12'
  - number: '31'
    text: |-
      1 De natuurlijke of rechtspersoon die een categorie 1-, 2-, of 3-verwerkingsbedrijf in stand houdt, richt een
      register in waarin de identificatiecode wordt aangetekend die is voorgeschreven voor runderen bij of krachtens het
      [Besluit identificatie en registratie van dieren][ref1].

      2 De natuurlijke of rechtspersoon, bedoeld in het eerste lid, is verplicht binnen drie werkdagen de
      identificatiecode, bedoeld in het eerste lid, te melden aan Onze Minister.

      3 De aantekeningen in het register worden ten minste twee jaren bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0018514/2005-09-07#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: '32'
    text: |-
      1 De schadeloosstelling, bedoeld in [artikel 10, derde lid, onder a, van de wet][ref1], wordt vastgesteld op het
      door Onze Minister te bepalen bedrag van het werkelijke nadeel dat de natuurlijke of rechtspersoon, aan wie of
      aan welke door Onze Minister een erkenning als bedoeld in artikel 13, eerste lid, van [verordening nr. 1774/2002]
      (32002R1774) is verleend als gevolg van de wijziging van het gebied dan wel van de te verwerken categorieën
      categorie 1- of categorie 2-materiaal lijdt.

      2 Het te betalen bedrag, bedoeld in [artikel 10, derde lid, onder b, van de wet][ref2] wordt vastgesteld op het
      door Onze Minister te bepalen bedrag van het werkelijke voordeel dat de natuurlijke of rechtspersoon, aan wie of
      aan welke door Onze Minister een erkenning als bedoeld in artikel 13, eerste lid, van [verordening nr. 1774/2002]
      (32002R1774) is verleend als gevolg van de wijziging van het gebied dan wel van de te verwerken categorieën
      categorie 1- of categorie 2-materiaal heeft.

      3 De betaling van de schadeloosstelling of van het bedrag geschiedt binnen zes maanden na de gebiedswijziging dan
      wel na de wijziging van de te verwerken categorieën categorie 1- of categorie 2-materiaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel10
    url: https://wetten.overheid.nl/BWBR0018514/2005-09-07#Artikel32
    references:
