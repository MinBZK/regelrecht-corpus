  - number: '24'
    text: |-
      In afwijking van [artikel 1 van de wet][ref1] wordt, ter uitvoering van [verordening nr. 1774/2002](32002R1774),
      voor de toepassing van [artikel 12 van die wet][ref2] verstaan onder:

      a. hoog- of gespecificeerd-hoog-risico-materiaal: categorie 1-materiaal en categorie 2-materiaal, met uitzondering
      van:

      1°. keukenafval en etensresten als bedoeld in artikel 4, eerste lid, punt e, van [verordening nr. 1774/2002]
      (32002R1774);

      2°. kadavers van gezelschapsdieren, mits de kadavers rechtstreeks als afval worden verwijderd door begraving op
      een terrein dat ter beschikking staat van de eigenaar of houder van desbetreffende dode dieren, dan wel op een
      plaats die ingevolge een besluit van het college van burgemeester en wethouders voor dat doel is toegelaten of
      overeenkomstig artikel 4, tweede lid, onderdeel a, van [verordening nr. 1774/2002](32002R1774) worden verbrand in
      een op grond van artikel 12, tweede of derde lid, van die verordening erkende verbrandingsinstallatie;

      3°. kadavers van paarden, mits de kadavers overeenkomstig artikel 5, tweede lid, onderdeel a, van [verordening
      nr. 1774/2002](32002R1774) worden verwerkt in een op grond van artikel 12, tweede lid, van die verordening erkende
      verbrandingsinstallatie;

      4°. mest en de van het maagdarmkanaal gescheiden inhoud van het maagdarmkanaal;

      5°. kadavers van pelsdieren, mits het kadavers betreft die overeenkomstig artikel 5, derde lid, van [verordening
      nr. 1774/2002](32002R1774), worden onthuid in een op grond van artikel 10, eerste lid, van die verordening erkend
      intermediair categorie 2-bedrijf;

      6°. dierlijke bijproducten als bedoeld in artikel 23, eerste en tweede lid, van [verordening nr. 1774/2002]
      (32002R1774), mits ten aanzien van deze dierlijke bijproducten toestemming is verleend voor de in voornoemde
      artikelleden genoemde activiteiten overeenkomstig [artikel 13, eerste en tweede lid][ref3], van dit besluit.

      b. laag-risico-materiaal: categorie 3-materiaal;

      c. ondernemer: natuurlijke persoon of rechtspersoon, aan wie of aan welke door Onze Minister een erkenning als
      bedoeld in artikel 13, eerste lid, van [verordening nr. 1774/2002](32002R1774) is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0018514#Artikel13
