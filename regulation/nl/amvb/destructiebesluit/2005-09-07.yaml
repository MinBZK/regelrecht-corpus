    url: https://wetten.overheid.nl/BWBR0018514/2005-09-07#Artikel7
  - number: '8'
    text: |-
      1 Het is verboden in strijd te handelen met:

      a. artikel 7, eerste lid, van [verordening nr. 1774/2002](32002R1774);

      b. artikel 7, tweede lid, van [verordening nr. 1774/2002](32002R1774);

      c. artikel 7, vijfde lid, van [verordening nr. 1774/2002](32002R1774).

      2 Het verbod, bedoeld in het eerste lid, geldt niet ter zake van het verzamelen en vervoeren van onverwerkte mest:

      a. die rechtstreeks wordt vervoerd tussen twee punten op dezelfde boerderij, voor zover deze zich in Nederland
      bevinden;

      b. die via een intermediaire onderneming als bedoeld in het
      [Besluit administratieve verplichtingen Meststoffenwet][ref1] wordt vervoerd tussen boerderijen en gebruikers, voor
      zover deze zich in Nederland bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0009000
    url: https://wetten.overheid.nl/BWBR0018514/2005-09-07#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009000
  - number: '9'
    text: |-
      1 Het is verboden dierlijke bijproducten en verwerkte producten in strijd met artikel 8, eerste tot en met derde
      lid, van [verordening nr. 1774/2002](32002R1774):

      a. naar andere lidstaten te zenden;

      b. uit lidstaten in Nederland te brengen.

      2 Voorafgaand aan de zending, bedoeld in het eerste lid, onderdeel a:

      a. bevestigt de afzender aan de door Onze Minister aangewezen dienst dat de in artikel 8, tweede lid, eerste zin,
      van [verordening nr. 1774/2002](32002R1774) bedoelde toestemming door de lidstaat van bestemming is verleend, en

      b. zendt de afzender aan de door Onze Minister aangewezen dienst een kopie van het handelsdocument.

      3 De in het artikel 8, tweede lid, eerste zin, van [verordening nr. 1774/2002](32002R1774) bedoelde toestemming,
      voor zover het betreft het brengen in Nederland van dierlijke bijproducten en verwerkte producten, wordt door Onze
      Minister verleend, met dien verstande dat deze toestemming niet is vereist voor het brengen in Nederland van:

      a. verwerkte dierlijke eiwitten;

      b. verwerkte mest en overige verwerkte producten die afgeleid zijn van categorie 2-materiaal die verwerkingsmethode
      1 hebben ondergaan.

      4 Het eerste en derde lid zijn niet van toepassing op onverwerkte mest, mits is voldaan aan, voor zover van
      toepassing, [artikel 2.2a][ref1] of [artikel 2.8b van de Regeling keuring en handel dierlijke producten][ref2].

      5 Het is verboden categorie 1- of categorie 2-materiaal alsmede daarvan afgeleide producten, niet zijnde in bijlage
      VII of VIII van [verordening nr. 1774/2002](32002R1774) genoemde producten, uit Nederland naar een derde land uit
      te voeren, via Nederland vanuit een derde land in de Gemeenschap in te voeren of via Nederland door te voeren.

      6 Het is verboden categorie 3-materiaal via Nederland vanuit een derde land in de Gemeenschap in te voeren, tenzij
      voldaan is aan bijlage XI, hoofdstuk A, punt 15, van [verordening nr. 999/2001](32001R0999).


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.2a
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2.8b
