    Op de voordracht van Onze Minister van Economische Zaken van 17 juni 2014, nr. WJZ / 14094877;

    Gelet op de artikelen 91c, 91h, eerste lid, 91i, eerste lid, 92, eerste lid, en 92a, eerste lid, van de
    Gezondheids- en welzijnswet voor dieren;

    De Afdeling advisering van de Raad van State gehoord (advies van 25 juli 2014, nr. W15.14.0198/IV en W15.14.0197/
    IV);

