  - number: '14.3'
    text: |-
      De heffing, bedoeld in het eerste lid, wordt geheven naar het aantal vaccinbroedeieren dat in een kalenderjaar door
      de persoon, bedoeld in het tweede lid, in een broedmachine wordt ingelegd.
    url: https://wetten.overheid.nl/BWBR0035682/2018-01-01#Artikel14
  - number: '15'
    text: |-
      De hoogte van de heffing, bedoeld in [14, eerste lid][ref1], ter zake van het produceren van vaccinbroedeieren,
      bedraagt per vaccinbroedei:


      [ref1]: https://wetten.overheid.nl/BWBR0035682#Artikel14
    url: https://wetten.overheid.nl/BWBR0035682/2018-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0035682
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 15.a
    text: € 0,000083 voor algemene bestrijdingskosten,
    url: https://wetten.overheid.nl/BWBR0035682/2018-01-01#Artikel15
  - number: 15.b
    text: € 0,000073 voor de bestrijding van zoönotische salmonella.
    url: https://wetten.overheid.nl/BWBR0035682/2018-01-01#Artikel15
  - number: '16'
    text: |-
      De heffing, bedoeld in [artikel 91a, eerste lid, van de Gezondheids- en welzijnswet voor dieren][ref1], is niet
      verschuldigd over de categorieën varkens, opgenomen in de [bijlage bij die wet](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91a
    url: https://wetten.overheid.nl/BWBR0035682/2018-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: 91a
  - number: 16a
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten einde te borgen dat betalingen die worden
      verricht uit het Diergezondheidsfonds in overeenstemming zijn met de artikelen 107 en 108 van het Verdrag
      betreffende de werking van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0035682/2018-01-01#Artikel16a
  - number: '17.1'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035682/2018-01-01#Artikel17
  - number: '17.2'
    text: De diergezondheidsheffing wordt ingevoerd met ingang van 1 januari 2015.
    url: https://wetten.overheid.nl/BWBR0035682/2018-01-01#Artikel17
  - number: '18'
    text: 'Dit besluit wordt aangehaald als: Besluit heffing bestrijding dierziekten.'
    url: https://wetten.overheid.nl/BWBR0035682/2018-01-01#Artikel18
