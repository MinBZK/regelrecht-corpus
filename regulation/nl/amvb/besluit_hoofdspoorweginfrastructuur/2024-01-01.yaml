$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_hoofdspoorweginfrastructuur
regulatory_layer: AMVB
publication_date: '2020-10-28'
valid_from: '2024-01-01'
bwb_id: BWBR0017626
url: https://wetten.overheid.nl/BWBR0017626/2024-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 19 december 2003, nr. HDJZ/S&W/2003-1876,
    Hoofddirectie Juridische Zaken;

    Gelet op de artikelen 6, 8 tot en met 12, 23, en 87 van de Spoorwegwet;

    De Raad van State gehoord (advies van 2 maart 2004, nr. W09.03.0543/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 29 november 2004, nr. HDJZ/S&W/2004-2894,
    Hoofddirectie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - gebruik van een hoofdspoorweg: met een
      spoorvoertuig rijden over of stilstaan op een hoofdspoorweg;
        - wet: [Spoorwegwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015007
  - number: '2.1'
    text: Bij ministeriële regeling worden eisen gesteld waaraan hoofdspoorweginfrastructuur moet voldoen.
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel2
  - number: '2.2'
    text: |-
      Deze eisen hebben onder meer betrekking op aspecten als bedoeld in [artikel 6 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel6
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '6'
  - number: '3.1'
    text: |-
      Onze Minister kan ontheffing verlenen van de eisen, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017626#Artikel2
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017626
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      De beheerder legt bij zijn aanvraag voor een ontheffing de bescheiden over en verstrekt de inlichtingen die Onze
      Minister noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel3
  - number: '3.3'
    text: 'Onze Minister vermeldt in de beschikking tot ontheffingverlening in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel3
  - number: 3.3.a
    text: de eisen waarvan ontheffing is verleend;
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel3
  - number: 3.3.b
    text: de beperkingen waaronder de ontheffing is verleend en de voorschriften die aan de ontheffing zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel3
  - number: 3.3.c
    text: de datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel3
  - number: 3.3.d
    text: de geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel3
  - number: '25.1'
    text: 'Onze Minister bepaalt:'
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel25
  - number: 25.1.a
    text: voor welke beweegbare bruggen door hem vaste openingstijden worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel25
  - number: 25.1.b
    text: |-
      welke beweegbare bruggen op verzoek van de schipper worden geopend volgens een door hem goed te keuren regeling van
      de beheerder;
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel25
  - number: 25.1.c
    text: welke beweegbare bruggen als regel geopend zijn, en alleen gesloten zijn als er een trein moet passeren;
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel25
  - number: 25.1.d
    text: |-
      bij welke beweegbare bruggen door hem voor te schrijven communicatiemiddelen ten behoeve van de scheepvaart
      aanwezig moeten zijn;
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel25
  - number: 25.1.e
    text: |-
      ten aanzien van welke bruggen de beheerder door hem goed te keuren voorwaarden voor de doorvaart vaststelt, voor
      zover dit in verband met de uit de afmetingen van schepen voortvloeiende gevaren en beperkingen en met het oog
      daarop te nemen maatregelen nodig is.
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel25
  - number: '25.2'
    text: |-
      Onze Minister hoort, alvorens hij zijn bevoegdheden ingevolge het eerste lid uitoefent, de beheerder, de
      vaarwegbeheerder en vertegenwoordigers uit de scheepvaart.
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel25
  - number: '25.3'
    text: |-
      Onze Minister kan bepalen hoe lang voordat een trein een brug, als bedoeld in het eerste lid, onderdeel c, moet
      passeren, met het sluiten van de brug kan of moet worden aangevangen.
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel25
  - number: '25.4'
    text: |-
      Indien in een vaarweg ter plaatse van een beweegbare brug de scheepvaart is gestremd, kan in afwijking van hetgeen
      in of krachtens de vorige leden is bepaald, de brug gesloten blijven.
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel25
  - number: '26.1'
    text: |-
      De beheerder draagt er zorg voor, dat bij de bruggen tekens worden getoond overeenkomstig het bepaalde in de
      [artikelen 6.25][ref1] en [6.26, vierde lid, van het Binnenvaartpolitiereglement][ref2], met dien verstande dat het
      teken, bedoeld in [artikel 6.26, vierde lid, onderdeel f, van het Binnenvaartpolitiereglement][ref3], alleen wordt
      gebruikt indien Onze Minister zulks bepaalt of goedkeurt.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003628#Artikel6
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0003628
        artikel: '6'
  - number: '26.2'
    text: |-
      In het geval van gestoorde lichttekens toont de beheerder een bord als bedoeld in
      [artikel 6.26, vijfde lid, van het Binnenvaartpolitiereglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel6
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '6'
  - number: '26.3'
    text: |-
      [Artikel 6.26 van het Binnenvaartpolitiereglement][ref1] is van overeenkomstige toepassing, voor zover in dit
      besluit daar niet van wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel6
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '6'
  - number: '27.1'
    text: |-
      Vergunningen die ingevolge [artikel 15 van het Reglement dienst hoofd- en lokaalspoorwegen][ref1] (Stb. 1977,
      152) en ontheffingen die ingevolge [artikel 39 van de Spoorwegwet (Stb. 1875, 67)][ref2] zijn verleend van de
      [artikelen 36, eerste lid][ref3], [37][ref4] en [38 van de Spoorwegwet (Stb. 1875, 67)][ref5] en gelden op het
      tijdstip van inwerkingtreding van dit besluit, worden vanaf de dag waarop dit besluit in werking treedt, aangemerkt
      als verleend op grond van [artikel 19 van de wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0001848#Artikel37
      [ref5]: https://wetten.overheid.nl/BWBR0001848#Artikel38
      [ref6]: https://wetten.overheid.nl/BWBR0015007#Artikel19
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '39'
      - id: ref3
        bwb_id: BWBR0001848
        artikel: '36'
      - id: ref4
        bwb_id: BWBR0001848
        artikel: '37'
      - id: ref5
        bwb_id: BWBR0001848
        artikel: '38'
      - id: ref6
        bwb_id: BWBR0015007
        artikel: '19'
  - number: '27.2'
    text: |-
      Ontheffingen die ingevolge [artikel 39 van de Spoorwegwet (Stb. 1875, 67)][ref1] zijn verleend van
      [artikel 36, tweede lid, van de Spoorwegwet (Stb. 1875, 67)][ref2] en gelden op het tijdstip van inwerkingtreding
      van dit besluit, worden vanaf de dag waarop dit besluit in werking treedt, aangemerkt als verleend op grond van
      [artikel 21 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel21
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '21'
  - number: '30'
    text: 'Dit besluit wordt aangehaald als: Besluit hoofdspoorweginfrastructuur.'
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel30
  - number: '31'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017626/2024-01-01#Artikel31
