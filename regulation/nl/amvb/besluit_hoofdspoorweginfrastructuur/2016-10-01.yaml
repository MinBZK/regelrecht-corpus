articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - gebruik van een hoofdspoorweg: met een spoorvoertuig rijden over of stilstaan op een hoofdspoorweg;
        - wet: [Spoorwegwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007
    url: https://wetten.overheid.nl/BWBR0017626/2016-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015007
  - number: '2'
    text: |-
      1 Bij ministeriële regeling worden eisen gesteld waaraan hoofdspoorweginfrastructuur moet voldoen.

      2 Deze eisen hebben onder meer betrekking op aspecten als bedoeld in [artikel 6 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel6
    url: https://wetten.overheid.nl/BWBR0017626/2016-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '6'
  - number: '3'
    text: |-
      1 Onze Minister kan ontheffing verlenen van de eisen, bedoeld in [artikel 2][ref1].

      2 De beheerder legt bij zijn aanvraag voor een ontheffing de bescheiden over en verstrekt de inlichtingen die Onze
      Minister noodzakelijk acht.

      3 Onze Minister vermeldt in de beschikking tot ontheffingverlening in ieder geval:

      a. de eisen waarvan ontheffing is verleend;

      b. de beperkingen waaronder de ontheffing is verleend en de voorschriften die aan de ontheffing zijn verbonden;

      c. de datum van afgifte;

      d. de geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0017626#Artikel2
    url: https://wetten.overheid.nl/BWBR0017626/2016-10-01#Artikel3
