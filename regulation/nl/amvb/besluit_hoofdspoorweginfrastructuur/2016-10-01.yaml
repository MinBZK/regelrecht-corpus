      1 Vergunningen die ingevolge [artikel 15 van het Reglement dienst hoofd- en lokaalspoorwegen][ref1] (Stb. 1977,
      152) en ontheffingen die ingevolge [artikel 39 van de Spoorwegwet (Stb. 1875, 67)][ref2] zijn verleend van de
