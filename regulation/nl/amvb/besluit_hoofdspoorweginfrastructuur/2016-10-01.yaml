  - number: '25'
    text: |-
      1 Onze Minister bepaalt:

      a. voor welke beweegbare bruggen door hem vaste openingstijden worden vastgesteld;

      b. welke beweegbare bruggen op verzoek van de schipper worden geopend volgens een door hem goed te keuren regeling
      van de beheerder;

      c. welke beweegbare bruggen als regel geopend zijn, en alleen gesloten zijn als er een trein moet passeren;

      d. bij welke beweegbare bruggen door hem voor te schrijven communicatiemiddelen ten behoeve van de scheepvaart
      aanwezig moeten zijn;

      e. ten aanzien van welke bruggen de beheerder door hem goed te keuren voorwaarden voor de doorvaart vaststelt,
      voor zover dit in verband met de uit de afmetingen van schepen voortvloeiende gevaren en beperkingen en met het oog
      daarop te nemen maatregelen nodig is.

      2 Onze Minister hoort, alvorens hij zijn bevoegdheden ingevolge het eerste lid uitoefent, de beheerder, de
      vaarwegbeheerder en vertegenwoordigers uit de scheepvaart.

      3 Onze Minister kan bepalen hoe lang voordat een trein een brug, als bedoeld in het eerste lid, onderdeel c, moet
      passeren, met het sluiten van de brug kan of moet worden aangevangen.

      4 Indien in een vaarweg ter plaatse van een beweegbare brug de scheepvaart is gestremd, kan in afwijking van
      hetgeen in of krachtens de vorige leden is bepaald, de brug gesloten blijven.
    url: https://wetten.overheid.nl/BWBR0017626/2016-10-01#Artikel25
  - number: '26'
    text: |-
      1 De beheerder draagt er zorg voor, dat bij de bruggen tekens worden getoond overeenkomstig het bepaalde in de
      [artikelen 6.25][ref1] en [6.26, vierde en vijfde lid, van het Binnenvaartpolitiereglement][ref2], met dien verstande
      dat het teken, bedoeld in [artikel 6.26, vierde lid, onderdeel f, van het Binnenvaartpolitiereglement][ref3],
      alleen wordt gebruikt indien Onze Minister zulks bepaalt of goedkeurt.

      2 In het geval van gestoorde lichttekens toont de beheerder een bord als bedoeld in
      [artikel 6.26, zesde lid, van het Binnenvaartpolitiereglement][ref4].

      3 [Artikel 6.26 van het Binnenvaartpolitiereglement][ref5] is van overeenkomstige toepassing, voor zover in dit
      besluit daar niet van wordt afgeweken.


