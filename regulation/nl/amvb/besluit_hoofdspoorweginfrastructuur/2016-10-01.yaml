        artikel: '2'
        paragraaf: '2'
  - number: '21'
    text: |-
      1 De begrenzing van de hoofdspoorweg en de daarnaast gelegen gronden wordt aan weerszijden gevormd door een lijn
      liggend op een afstand van:

      a. elf meter bij een hoofdspoorweg op maaiveldniveau, gemeten vanaf het hart van het buitenste spoor, zijnde een
      denkbeeldige lijn in de lengterichting van het spoor midden tussen beide spoorstaven;

      b. zes meter bij een hoofdspoorweg in ingraving, gemeten uit de bovenzijde van de ingraving;

      c. zes meter bij een hoofdspoorweg in ophoging, gemeten uit de teen van het talud;

      d. dertig meter bij een hoofdspoorweg in een tunnel, gemeten vanaf de buitenste wand van de tunnel;

      e. dertig meter bij een hoofdspoorweg op een brug of op een viaduct, gemeten vanaf de buitenste rand van de
      constructie;

      f. veertien meter bij een hoofdspoorweg gemeten vanaf het hart van het buitenste spoor, indien het betreft het
      hebben of opslaan van licht ontvlambare stoffen, bedoeld in [artikel 19, eerste lid, onderdeel d, van de wet][ref1].

      2 Indien bij een hoofdspoorweg in ingraving of in ophoging de afstand tussen het hart van het buitenste spoor en
      de bovenkant van de ingraving of teen van het talud minder bedraagt dan vijf meter, wordt de begrenzing vastgesteld
      overeenkomstig het eerste lid, onderdeel a.

      3 Bij besluit van Onze Minister kan, gehoord de beheerder, met het oog op de bescherming van de fysieke integriteit
      van de hoofdspoorwegen en in het belang van een veilig en ongestoord gebruik daarvan, een begrenzing worden
      vastgesteld die afwijkt van het eerste of tweede lid.

      4 In afwijking van het eerste lid, onderdeel a, wordt de begrenzing van een deel van de hoofdspoorwegen die
      uitsluitend bestemd zijn voor het verrichten van goederenvervoer ten behoeve van de lokale ontsluiting van
      haven- en industriegebieden, gevormd door een lijn liggend op een afstand van drie meter op maaiveldniveau,
      gemeten vanaf het hart van het buitenste spoor. Wanneer op grond van [artikel 2, eerste lid][ref2], of
      [124, eerste lid, van de wet][ref3] een spoorweg wordt aangewezen als hoofdspoorweg, wordt daarbij bepaald of de
      hoofdspoorweg onder het bereik van dit lid valt.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel124
