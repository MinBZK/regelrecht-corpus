preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op voordracht van Onze Minister-President, Minister van Algemene Zaken, van 11 maart 1988, nr. 88M002396; na
    overleg met Onze Minister van Welzijn, Volksgezondheid en Cultuur;


    Gelet op artikel 173 van de Mediawet (Stb. 1987, 249);


    De Raad van State gehoord (advies van 19 mei 1988, nr. W01.88.0146);


    Gezien het nader rapport van Onze Minister-President, Minister van Algemene Zaken, van 21 juni 1988, nr. 88M002787;
    uitgebracht na overleg met Onze Minister van Welzijn, Volksgezondheid en Cultuur;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004354/1988-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      In dit besluit wordt verstaan onder:


      a. studio's: de studio's met toebehoren die in eigendom zijn bij de binnenlandse omroepinstellingen en het
      Nederlands Omroepproduktie Bedrijf N.V.;


      b. andere hulpmiddelen: het geheel aan technische voorzieningen die zijn opgericht ten behoeve van omroep in
      buitengewone omstandigheden, alsmede de normale omroepvoorzieningen voorzover deze niet gerekend kunnen worden tot
      de onder *a* bedoelde studio's;


      c. autoriteiten: Onze Ministers, commissarissen van de Koning en burgemeesters.
    url: https://wetten.overheid.nl/BWBR0004354/1988-07-28#Artikel1
  - number: '2'
    text: >-
      1 Bij dreigend gevaar voor de openbare veiligheid of de volksgezondheid of in andere buitengewone
      omstandigheden staan Onze Minister-President, Minister van Algemene Zaken, zendtijd en het gebruik van studio's,
      draadomroepinrichtingen en andere hulpmiddelen ter beschikking teneinde hem of door hem aan te wijzen autoriteiten,
      in staat te stellen door middel van deze voorzieningen voor het publiek bestemde dringende mededelingen te doen die
      noodzakelijk zijn in het algemeen belang.


      2 In de in het eerste lid bedoelde omstandigheden kan Onze Minister-President, Minister van Algemene Zaken,
      opdracht geven de uitzending van een programma in zendtijd voor binnenlandse omroep onmiddellijk te onderbreken
      indien zulks dringend gewenst is.


      3 Indien de uitzending van een programma in zendtijd voor binnenlandse omroep wordt onderbroken kan het
      Commissariaat voor de Media compenserende zendtijd toewijzen aan de door de onderbreking getroffen instelling, die
      zendtijd is toegewezen voor binnenlandse omroep.
    url: https://wetten.overheid.nl/BWBR0004354/1988-07-28#Artikel2
  - number: '3'
    text: >-
      1 De onderbreking van een uitzending van een programma in zendtijd voor landelijke en regionale omroep en de
      uitzending van de betreffende mededelingen wordt zonodig bewerkstelligd door het Staatsbedrijf der Posterijen,
      Telegrafie en Telefonie, nadat daartoe opdracht is ontvangen van Onze Minister-President, Minister van Algemene
      Zaken, of vanwege deze door de Hoofddirecteur van de Rijksvoorlichtingsdienst.


      2 De onderbreking van een uitzending van een programma in zendtijd voor lokale omroep en de uitzending van de
      betreffende mededelingen wordt bewerkstelligd door de houder van een machtiging voor de aanleg, instandhouding en
      exploitatie van de omroepzender danwel door de beheerder van de draadomroepinrichting door middel van welke het
      programma wordt uitgezonden, in opdracht van Onze Minister-President, Minister van Algemene Zaken, of namens deze
      door de burgemeester van de betreffende gemeente.
    url: https://wetten.overheid.nl/BWBR0004354/1988-07-28#Artikel3
  - number: '4'
    text: |-
      1 Ten einde het doen van mededelingen als bedoeld in dit besluit mogelijk te maken:

      a. verlenen instellingen, bij wie studio's en andere hulpmiddelen in eigendom zijn en het bij hen werkzame
      personeel, zonodig, hun medewerking bij het gebruik van deze voorzieningen; en

      b. treffen deze instellingen en de in [artikel 3][ref1] bedoelde instellingen en personen de voor de desbetreffende
      werkzaamheden noodzakelijke organisatorische en personele maatregelen en wel op zodanige wijze dat de nodige
      voorzieningen ook buiten de normale uren van de uitzending van programma's kunnen functioneren.

      2 De in het eerste lid genoemde organisaties en personen zijn gehouden de aanwijzingen, die verband houden met de
      uitvoering van het bepaalde in [artikel 2][ref2], van of vanwege Onze Minister-President, Minister van Algemene
      Zaken, danwel van de door hem aangewezen autoriteiten, op te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0004354#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004354#Artikel2
    url: https://wetten.overheid.nl/BWBR0004354/1988-07-28#Artikel4
