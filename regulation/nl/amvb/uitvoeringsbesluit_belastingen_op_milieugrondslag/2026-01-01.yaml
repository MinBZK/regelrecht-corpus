  - number: '17'
    text: |-
      1 De vrijstellingen, bedoeld in [artikel 44, eerste, tweede en derde lid, van de wet][ref1], worden verleend,
      indien:

      a. degene die de kolen gebruikt, verklaart dat de aan hem te leveren kolen worden gebruikt op de wijze, bedoeld in
      [artikel 44, eerste, tweede of derde lid, van de wet][ref2];

      b. de verklaring geschiedt met gebruikmaking van een door de vergunninghouder van de inrichting opgesteld bescheid
      in geval van uitslag of met gebruikmaking van een door degene die de levering verricht opgesteld bescheid in geval
      van invoer;

      c. degene die de kolen gebruikt, de verklaring heeft ondertekend, en

      d. de verklaring op overzichtelijke wijze wordt bewaard bij de administratie van de vergunninghouder van de
      inrichting in geval van uitslag en bij de administratie van degene die de aangifte tot plaatsing onder de
      douaneregeling brengen in het vrije verkeer doet, in geval van invoer.

      2 De vrijstelling, bedoeld in [artikel 44, tweede lid, van de wet][ref3], wordt niet verleend indien de kolen
      worden gebruikt in een installatie voor het opwekken van elektriciteit met een elektrisch vermogen van minder dan
      60 kW.

      3 Degene die de kolen gebruikt, richt zijn administratie zodanig in dat daarin op
      overzichtelijke wijze de gegevens zijn opgenomen omtrent alle voor de vrijstellingen, bedoeld in
      [artikel 44, eerste, tweede of derde lid, van de wet][ref4], van belang zijnde bedrijfshandelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0007168#Artikel44
      [ref4]: https://wetten.overheid.nl/BWBR0007168#Artikel44
