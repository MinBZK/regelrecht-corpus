  - number: '16'
    text: |-
      1 In de vervoersopdracht, bedoeld in [artikel 14][ref1], worden vermeld:

      a. de naam en het adres van degene die de vervoersopdracht opmaakt dan wel van degene in wiens opdracht zij wordt
      opgemaakt;

      b. de naam en het adres van degene die de kolen overbrengt;

      c. de naam en het adres van de vergunninghouder van de inrichting waarnaar de kolen worden overgebracht en het
      adres van die inrichting;

      d. de hoeveelheid kolen, en

      e. de datum waarop de overbrenging van de kolen aanvangt.

      2 De vervoersopdracht is gedagtekend en ondertekend.

      3 Indien een persoon als bedoeld in het eerste lid vergunninghouder is van een inrichting, wordt tevens het nummer
      van zijn vergunning vermeld.

      4 De vergunninghouder van de inrichting die de vervoersopdracht heeft opgemaakt of heeft doen opmaken, bewaart
      afschriften van de vervoersopdrachten op overzichtelijke wijze bij zijn administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0007178#Artikel14
    url: https://wetten.overheid.nl/BWBR0007178/2026-01-01#Artikel16
