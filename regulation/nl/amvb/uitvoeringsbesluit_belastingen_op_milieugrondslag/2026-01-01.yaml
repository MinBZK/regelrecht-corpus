      Voor de toepassing van [artikel 22, tweede lid, van de wet][ref1] wordt de toepassing van stoffen, preparaten
      of voorwerpen binnen een inrichting waar afvalstoffen worden verbrand, geacht hetzij verband te houden
      met de bedrijfsvoering van de inrichting, hetzij deel uit te maken van het bedrijfsproces dat leidt tot
      de nuttige toepassing of verwijdering van afvalstoffen, indien de stoffen, preparaten of voorwerpen in
      de inrichting dienen voor de activiteiten, dan wel bestaan uit de materialen of voorwerpen, bedoeld in
      [artikel 4, onderdelen a, f, g, h, i, of k][ref2].


