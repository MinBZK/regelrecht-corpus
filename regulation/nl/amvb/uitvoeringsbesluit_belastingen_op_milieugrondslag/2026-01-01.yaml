      levert, dat de elektriciteit uitsluitend wordt aangewend in een walstroominstallatie als bedoeld in
      artikel [47, eerste lid, onderdeel w, van de wet][ref2] die geheel of nagenoeg geheel bestemd is voor schepen niet
