      1 Het tarief voor zakelijk verbruik, genoemd in [artikel 59, eerste lid, onderdeel c, van de wet][ref1],
      is van toepassing indien de verbruiker een verklaring heeft overgelegd aan degene die de elektriciteit
      aan hem levert dat het verbruik van die elektriciteit zakelijk verbruik betreft als bedoeld in
      [artikel 47, eerste lid, onderdeel t, van de wet][ref2].

      2 De verbruiker dient:

      a. zijn administratie zodanig in te richten dat daarin op overzichtelijke wijze de gegevens zijn opgenomen omtrent
      alle voor de toepassing van het tarief voor zakelijk verbruik van belang zijnde bedrijfshandelingen;

      b. ter vaststelling van de hoeveelheid elektriciteit waarop het tarief, bedoeld in het eerste lid, ziet deze
      hoeveelheid te meten met behulp van meters indien de elektriciteit mede betrokken wordt voor niet-zakelijk verbruik
      als bedoeld in [artikel 47, eerste lid, onderdeel u, van de wet][ref3].

      3 Wijzigingen in de situatie die van invloed zijn op de toepassing van het tarief, bedoeld in het eerste lid,
      worden onmiddellijk gemeld aan degene die de elektriciteit levert.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel47
