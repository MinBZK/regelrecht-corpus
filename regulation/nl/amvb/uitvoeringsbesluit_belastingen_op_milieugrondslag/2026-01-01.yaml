  - number: '28'
    text: |-
      1 Teruggaaf van belasting als bedoeld in [artikel 70a, eerste lid, van de wet][ref1] wordt op verzoek verleend aan
      degene aan wie de belasting in rekening is gebracht.

      2 Het tijdvak waarover de teruggaaf wordt verleend, is het kalenderkwartaal. De inspecteur kan op verzoek een ander
      tijdvak aanwijzen.

      3 Het verzoek om teruggaaf van belasting wordt gedaan binnen dertien weken na het eind van het in het tweede lid
      bedoelde tijdvak waarin het aardgas is geleverd.

      4 Teruggaaf wordt voorts alleen verleend indien:

      a. uit de aankoopfactuur blijkt wanneer en hoeveel aardgas is geleverd;

      b. degene die het verzoek om teruggaaf doet, bij het verzoek schriftelijk verklaart welk gedeelte van dit aardgas
      is gebruikt als brandstof voor vaartuigen op communautaire wateren, niet zijnde particuliere pleziervaartuigen; en

      c. de verklaring, bedoeld in onderdeel b, desgevraagd kan worden gestaafd met schriftelijke verklaringen van de
      exploitanten van de vaartuigen waarin het aardgas als brandstof is gebruikt.

      5 De teruggaaf wordt voorts alleen verleend indien de aankoopfactuur en de van belang zijnde gegevens en
      verklaringen over de bestemming van het aardgas waarop de teruggaaf betrekking heeft, worden overgelegd en
      indien de administratie van degene die om teruggaaf verzoekt, voldoet aan bij ministeriële regeling te stellen
      voorwaarden.

      6 De teruggaaf, bedoeld in het eerste lid, wordt alleen verleend als het bedrag aan belasting expliciet op de
      factuur in rekening is gebracht en slechts voor zover die factuur is betaald.

      7 Indien een hoger bedrag aan belasting is gefactureerd dan door degene die de levering heeft verricht verschuldigd
      is, wordt voor het bepalen van de hoogte van de teruggaaf, bedoeld in het eerste lid, het bedrag aan verschuldigde
      belasting gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel70a
