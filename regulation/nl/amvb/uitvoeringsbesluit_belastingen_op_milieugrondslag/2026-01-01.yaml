      1 De uitzondering in [artikel 59, derde lid, van de wet][ref1] voor installaties voor stadsverwarming waarbij
      grotendeels gebruik wordt gemaakt van de warmtebronnen, bedoeld in dat lid, is mede van toepassing indien tijdelijk
      niet aan die voorwaarde kan worden voldaan in verband met de vervanging van een warmtebron als bedoeld in dat lid.

      2 Het eerste lid is van toepassing indien de inspecteur op verzoek van de verbruiker, bedoeld in
      [artikel 59, derde lid, van de wet][ref2], of de leverancier van het aardgas bij voor bezwaar vatbare beschikking
      een ontheffing heeft verleend van de voorwaarde die dat lid aan de uitzondering verbindt. De ontheffing wordt
      verleend voor een periode van ten hoogste drie jaar.

      3 De ontheffing wordt slechts verleend indien bij het verzoek om ontheffing stukken zijn overgelegd waaruit blijkt:

      a. waarom tijdelijk niet kan worden voldaan aan de voorwaarde die [artikel 59, derde lid, van de wet][ref3] aan de
      uitzondering verbindt;

      b. wat de reden is van de vervanging van de warmtebron, bedoeld in [artikel 59, derde lid, van de wet][ref4], en
      wanneer de periode waarin die vervanging plaatsvindt aanvangt en eindigt; en

      c. welke maatregelen worden genomen die redelijkerwijs kunnen worden verwacht om weer te voldoen aan de voorwaarde
      die [artikel 59, derde lid, van de wet][ref5] aan de uitzondering verbindt.


