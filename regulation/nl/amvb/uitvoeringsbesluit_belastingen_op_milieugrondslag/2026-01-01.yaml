      1 Een aanvraag als bedoeld in [artikel 25a, eerste lid, eerste zin, van de wet][ref1] wordt langs elektronische weg
      ingediend bij Onze Minister van Infrastructuur en Waterstaat, met gebruikmaking van de hiertoe beschikbaar gestelde
      voorziening. Daarbij worden de bij die voorziening voorgeschreven aanwijzingen opgevolgd.

      2 Bij regeling van Onze Ministers kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel25a
    url: https://wetten.overheid.nl/BWBR0007178/2026-01-01#Artikel6
