  - number: 5a
    text: |-
      1 Het verzoek om een vergunning voor een fiscaal vertegenwoordiger, bedoeld in
      [artikel 24a, derde lid, van de wet][ref1], bevat de volgende gegevens:

      a. naam en adres van de verzoeker;

      b. het beoogde tijdstip van aanvang van het fiscaal-vertegenwoordigerschap;

      c. naam en adres van de degene die de afvalstoffen overbrengt uit Nederland en die niet in Nederland is gevestigd
      en aldaar geen vaste inrichting heeft (in dit artikel: buitenlandse kennisgever).

      2 Een vergunning voor een fiscaal vertegenwoordiger wordt slechts verleend indien de verzoeker:

      a. in Nederland woont of is gevestigd;

      b. in de afgelopen vijf jaren niet wegens overtreding van de wettelijke bepalingen inzake rijksbelastingen dan wel
      douane onherroepelijk is veroordeeld;

      c. een administratie voert die voldoet aan bij ministeriële regeling te stellen voorwaarden;

      d. naar het oordeel van de inspecteur voldoende solvabel is.

      3 De verlening van een vergunning voor een fiscaal vertegenwoordiger is tevens gebonden aan de voorwaarde dat de
      verzoeker optreedt voor alle overbrengingen als bedoeld in [artikel 23, eerste lid, onderdeel c, van de wet][ref2].
      De inspecteur kan op verzoek hiervan afwijken.

      4 De inspecteur kan de vergunning intrekken of wijzigen:

      a. op verzoek van de fiscaal vertegenwoordiger met schriftelijke instemming van de buitenlandse kennisgever;

      b. op verzoek van de buitenlandse kennisgever;

      c. indien de fiscaal vertegenwoordiger niet meer voldoet aan de aan de vergunning gebonden voorwaarden.

      De buitenlandse kennisgever wordt van de intrekking van de vergunning in kennis gesteld, alsmede van de gronden
      waarop deze berust.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel23
