  - number: '22'
    text: |-
      1 De vrijstellingen, bedoeld in [artikel 64, eerste of tweede lid, van de wet][ref1], worden verleend indien
      degene die aardgas of elektriciteit gebruikt, een verklaring heeft overgelegd aan degene die dat aardgas of die
      elektriciteit aan hem heeft geleverd, dat hij dat aardgas of die elektriciteit gebruikt op een in artikel 64,
      eerste of tweede lid, van de wet bedoelde wijze. Deze verklaring kan eenmalig worden afgegeven.

      2 Geen vrijstelling wordt verleend indien de in [artikel 64, eerste of tweede lid, van de wet][ref2] bedoelde
      installatie een totaal opgesteld elektrisch vermogen heeft van minder dan 60 kW.

      3 De vrijstellingen, bedoeld in [artikel 64, vierde lid, van de wet][ref3], worden verleend indien de verbruiker
      een verklaring heeft overgelegd aan degene die de elektriciteit of het aardgas heeft geleverd, dat hij die
      elektriciteit of dat aardgas gebruikt op de wijze, bedoeld in artikel 64, vierde lid, van de wet.

      4 De vrijstelling, bedoeld in [artikel 64, vijfde lid, van de wet][ref4], wordt verleend indien de verbruiker een
      verklaring heeft overgelegd aan degene die dat aardgas heeft geleverd, dat hij dat aardgas gebruikt op de wijze,
      bedoeld in artikel 64, vijfde lid, van de wet.

      5 De vrijstelling, bedoeld in [artikel 64, zesde lid, van de wet][ref5], wordt verleend indien degene die het
      aardgas gebruikt een verklaring heeft overgelegd aan degene die dat aardgas aan hem heeft geleverd, dat hij dat
      aardgas gebruikt op de in artikel 64, zesde lid, van de wet bedoelde wijze.

      6 Degene die aardgas of elektriciteit gebruikt op een wijze waarvoor een vrijstelling als bedoeld in
      [artikel 64, eerste, tweede, vierde, vijfde of zesde lid, van de wet][ref6] wordt verleend dient:

      a. zijn administratie zodanig in te richten dat daarin op overzichtelijke wijze de gegevens zijn opgenomen omtrent
      alle voor de desbetreffende vrijstelling van belang zijnde bedrijfshandelingen;

      b. ter vaststelling van de hoeveelheid product waarop de vrijstelling ziet, deze hoeveelheid te meten met behulp
      van meters indien het desbetreffende product mede betrokken wordt voor andere doeleinden.

      7 Wijzigingen in de situatie die van invloed zijn op de toepassing van een vrijstelling als bedoeld in
      [artikel 64, eerste, tweede, vierde, vijfde of zesde lid, van de wet][ref7] worden onmiddellijk gemeld aan degene
      die het aardgas of de elektriciteit levert.


