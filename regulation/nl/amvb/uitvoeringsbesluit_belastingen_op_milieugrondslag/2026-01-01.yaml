      1 Onder een vliegtuig als bedoeld in [artikel 72, onderdeel c, van de wet][ref1] worden niet verstaan
      lesvliegtuigen en vliegtuigen gebruikt voor de werkzaamheden van hulpdiensten.

      2 Onder lesvliegtuigen wordt verstaan:

      a. vliegtuigen die een vlucht maken uitsluitend in het kader van een opleidingscursus als bedoeld in onderdeel
      1.8 van bijlage IV bij [Verordening (EU) 2018/1139](32018R1139) van het Europees Parlement en de Raad van 4 juli
      2018 inzake gemeenschappelijke regels op het gebied van burgerluchtvaart en tot oprichting van een Agentschap van
      de Europese Unie voor de veiligheid van de luchtvaart, en tot wijziging van de [Verordeningen (EG) nr. 2111/2005]
      (32005R2111), [(EG) nr. 1008/2008](32008R1008), [(EU) nr. 996/2010](32010R0996), [(EU) nr. 376/2014](32014R0376) en
      de [Richtlijnen 2014/30/EU](32014L0030) en [2014/53/EU](32014L0053) van het Europees Parlement en de Raad, en tot
      intrekking van de [Verordeningen (EG) nr. 552/2004](32004R0552) en [(EG) nr. 216/2008](32008R0216) van het Europees
      Parlement en de Raad en [Verordening (EEG) nr. 3922/91](31991R3922) van de Raad (PbEU 2018, L 212), gegeven door
      een vlieginstructeur als bedoeld in onderdeel 1.9 van die bijlage;

      b. vliegtuigen die een vlucht maken uitsluitend ten behoeve van het aantonen, onderhouden of handhaven van de
      bekwaamheid in praktische vaardigheden, bedoeld in onderdeel 1.5 van bijlage IV bij [Verordening (EU) 2018/1139]
      (32018R1139).

      3 Onder vliegtuigen gebruikt voor de werkzaamheden van hulpdiensten wordt verstaan: vliegtuigen die worden gebruikt
      voor het uitvoeren van werkzaamheden door hulpdiensten en hiertoe een speciale uitrusting hebben die permanent aan
      het vliegtuig is bevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel72
