      1 Het verzoek om teruggaaf, bedoeld in [artikel 69, eerste tot en met derde lid, van de wet][ref1], wordt uiterlijk
      gedaan binnen dertien weken na afloop van de verbruiksperiode.

      2 De in het eerste lid bedoelde teruggaaf wordt alleen verleend indien de eindfactuur wordt overgelegd.

      3 De teruggaaf, bedoeld in het eerste lid, wordt alleen verleend als het bedrag aan belasting expliciet op de
      factuur in rekening is gebracht en slechts voor zover die factuur is betaald.

      4 Indien een hoger bedrag aan belasting is gefactureerd dan door degene die de levering heeft verricht verschuldigd
      is, wordt voor het bepalen van de hoogte van de teruggaaf, bedoeld in het eerste lid, het bedrag aan verschuldigde
      belasting gebruikt.


