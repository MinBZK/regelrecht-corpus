  - number: 11b
    text: |-
      1 De vrijstelling, bedoeld in [artikel 29a van de wet][ref1], wordt verleend indien uit de administratie van
      de belastingplichtige blijkt welk gedeelte van de hoeveelheid afvalstoffen die in het tijdvak van aangifte ter
      verwijdering aan de inrichting is afgegeven, bestaat uit zuiveringsslib dat is bestemd om binnen de inrichting te
      worden verbrand.

      2 De verbranding van het zuiveringsslib, bedoeld in het eerste lid, moet plaatsvinden binnen drie jaar na de
      afgifte van dat zuiveringsslib aan de inrichting. De datum van verbranding wordt vastgelegd in de administratie,
      bedoeld in het eerste lid.

      3 Bij regeling van Onze Minister kunnen ten behoeve van de uitvoering van dit artikel nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel29a
    url: https://wetten.overheid.nl/BWBR0007178/2026-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 29a
  - number: 11c
    text: |-
      1 De vrijstelling, bedoeld in artikel 29b, eerste lid, van de wet, wordt slechts verleend ter zake van de
      afgifte ter verwijdering aan een inrichting van afzonderlijk en onvermengd asbest en asbesthoudende producten die
      uitsluitend of nagenoeg uitsluitend toegepast zijn geweest als dakbedekking en zijn vrijgekomen bij de sanering van
      een asbesthoudend dak, wanneer:

      a. de sanering van dat dak door een gecertifieerd asbestverwijderingsbedrijf is verricht;

      b. de sanering van dat dak is gemeld in het landelijk asbestvolgsysteem;

      c. de sanering van dat dak uiterlijk op 31 december 2024 is afgerond; en

      d. de afgifte ter verwijdering uiterlijk op 31 maart 2025 heeft plaatsgevonden.

      2 De vrijstelling wordt uitsluitend toegepast wanneer degene die het asbest en de asbesthoudende producten afgeeft,
      of doet afgeven, voorafgaand aan de afgifte ter verwijdering een verklaring aan de houder van de inrichting
      verstrekt waaruit blijkt dat wordt voldaan aan de voorwaarden en beperkingen, bedoeld in het eerste lid.

      3 De houder van de inrichting richt zijn administratie zodanig in dat daaruit blijkt welk gedeelte van de
      hoeveelheid afvalstoffen die in het tijdvak van aangifte ter verwijdering aan de inrichting is afgegeven, bestaat
      uit asbest en asbesthoudende producten als bedoeld in artikel 29b, eerste lid, van de wet waarvoor wordt voldaan
      aan de in het eerste en tweede lid vermelde nadere voorwaarden en beperkingen.

      4 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de inhoud van de verklaring,
      bedoeld in het tweede lid, en het tijdstip waarop die verklaring uiterlijk verstrekt moet zijn. Voorts kunnen bij
      regeling van Onze Minister nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007178/2026-01-01#Artikel11c
  - number: '12'
    text: |-
      1 Het vervoer van kolen, bedoeld in [artikel 33, derde lid, onderdeel a, b of c, van de wet][ref1], naar een
      inrichting, een andere lidstaat via Nederland of een derde land, alsmede het brengen van kolen, bedoeld in
      [artikel 34, eerste lid, onderdeel a, b of c, van de wet][ref2], vanuit een inrichting naar een andere inrichting,
      een ondernemer in een andere lidstaat, een publiekrechtelijk lichaam, anders dan als ondernemer, in een andere
      lidstaat of een derde land, wordt aangetoond met een bescheid.

      2 In het bescheid, bedoeld in het eerste lid, worden vermeld:

      a. de naam en het adres van degene van wie de kolen afkomstig zijn;

      b. de naam en het adres van degene naar wie de kolen worden vervoerd dan wel overgebracht;

      c. de naam en het adres van degene die de kolen vervoert dan wel overbrengt;

      d. de hoeveelheid kolen, en

      e. de datum waarop het vervoer dan wel de overbrenging van de kolen is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel34
