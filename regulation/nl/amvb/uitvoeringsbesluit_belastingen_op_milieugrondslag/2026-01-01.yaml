  - number: '11'
    text: |-
      1 Voor zover sprake is van een verwerking of bewerking van afvalstoffen die gepaard gaat met gewichtsverlies,
      wordt de vermindering, bedoeld in [artikel 27, eerste lid, van de wet][ref1], zodanig toegepast dat ter zake
      van de stoffen, preparaten of voorwerpen bij het verlaten van de inrichting wordt uitgegaan van de belasting die
      verschuldigd werd bij de afgifte ter verwijdering van de afvalstoffen waaruit zij zijn ontstaan.

      2 Het verhoudingsgetal, bedoeld in [artikel 27, derde lid, van de wet][ref2], wordt uitsluitend toegepast door
      degene die beschikt over een door de inspecteur afgegeven vergunning. In deze vergunning kan de inspecteur nadere
      voorwaarden stellen met betrekking tot de administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel27
