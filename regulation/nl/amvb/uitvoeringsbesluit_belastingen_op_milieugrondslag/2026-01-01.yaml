      1 De uitzondering in [artikel 59, derde lid, van de wet][ref1] voor installaties voor stadsverwarming waarbij
      grotendeels gebruik wordt gemaakt van de warmtebronnen, bedoeld in dat lid, is mede van toepassing gedurende
      de eerste periode van maximaal twee jaar na de ingebruikneming van een installatie voor stadsverwarming die is
      ontworpen om grotendeels gebruik te maken van de warmtebronnen, bedoeld in dat lid.

      2 De periode, bedoeld in het eerste lid, vangt aan op het moment waarop de levering van warmte door middel van de
      installatie een aanvang neemt.

      3 Het eerste lid is slechts van toepassing als de houder van de installatie aan degene die het aardgas aan hem
      levert een verklaring heeft overgelegd:

      a. dat sprake is van een installatie voor stadsverwarming;

      b. dat de stadsverwarming is ontworpen om grotendeels gebruik te maken van restwarmte, aardwarmte of van warmte
      opgewekt met vaste, vloeibare of gasvormige biomassa, aquathermie, een lucht-water-warmtepomp of een elektrische
      boiler;

      c. wanneer de periode, bedoeld in het eerste lid, aanvangt en eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel59
