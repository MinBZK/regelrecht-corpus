  - number: 11a
    text: |-
      Als een installatie als bedoeld in [artikel 28, eerste lid, onderdeel c, van de wet][ref1], wordt mede aangemerkt
      een installatie waarin blijkens boeken en bescheiden uitsluitend zuivere biomassa of naar haar aard zuivere
      biomassa wordt verbrand.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel28
