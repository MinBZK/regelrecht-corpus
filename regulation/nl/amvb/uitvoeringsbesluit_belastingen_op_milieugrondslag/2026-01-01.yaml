  - number: '24'
    text: |-
      1 Het verzoek om teruggaaf, bedoeld in [artikel 67, eerste lid, van de wet][ref1], wordt uiterlijk gedaan binnen
      dertien weken na afloop van de verbruiksperiode.

      2 Ter vaststelling van de hoeveelheid verbruikte warmte meet de gebruiker van de onroerende zaak deze hoeveelheid
      met behulp van een warmtehoeveelheidsmeter.

      3 Bij het verzoek om de in het eerste lid bedoelde teruggaaf wordt de afrekening overgelegd die door de exploitant
      van de installatie voor blokverwarming of in diens opdracht is opgemaakt.

      4 De teruggaaf, bedoeld in het eerste lid, wordt alleen verleend als het bedrag aan belasting expliciet op de
      factuur in rekening is gebracht en slechts voor zover die factuur is betaald.

      5 Indien een hoger bedrag aan belasting is gefactureerd dan door degene die de levering heeft verricht verschuldigd
      is, wordt voor het bepalen van de hoogte van de teruggaaf, bedoeld in het eerste lid, het bedrag aan verschuldigde
      belasting gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel67
    url: https://wetten.overheid.nl/BWBR0007178/2026-01-01#Artikel24
