        artikel: '67'
  - number: '25'
    text: |-
      1 Het verzoek om teruggaaf, bedoeld in [artikel 68, eerste lid, van de wet][ref1], kan worden gedaan na afloop
      van elke kalendermaand waarin recht op teruggaaf is ontstaan, dan wel, wanneer de leveranciers verschillende
      verbruiksperioden hanteren, na afloop van de kalendermaand waarin de laatste van die verbruiksperioden afloopt, en
      wordt uiterlijk gedaan binnen dertien weken na afloop van de verbruiksperiode, onderscheidenlijk na afloop van de
      laatste verbruiksperiode.

      2 Het verzoek om teruggaaf, bedoeld in [artikel 68, tweede lid, van de wet][ref2], kan worden gedaan na afloop van
      elke kalendermaand waarin recht op teruggaaf is ontstaan, en wordt uiterlijk gedaan binnen dertien weken na afloop
      van de verbruiksperiode.

      3 De teruggaaf, bedoeld in het eerste en tweede lid, wordt alleen verleend indien de aankoopfacturen worden
      overgelegd en indien de administratie van degene die om teruggaaf verzoekt voldoet aan bij ministeriële regeling te
      stellen voorwaarden.

      4 De teruggaaf, bedoeld in het eerste en tweede lid, wordt alleen verleend als het bedrag aan belasting expliciet
      op de factuur in rekening is gebracht en slechts voor zover die factuur is betaald.

      5 Indien een hoger bedrag aan belasting is gefactureerd dan door degene die de levering heeft verricht verschuldigd
      is, wordt voor het bepalen van de hoogte van de teruggaaf, bedoeld in het eerste en tweede lid, het bedrag aan
      verschuldigde belasting gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel68
