  - number: 22a
    text: |-
      1 Voor de toepassing van de vrijstellingen, bedoeld in
      [artikel 64, eerste lid, onderdelen a en b, en tweede lid, van de wet][ref1], wordt ingeval
      aardgas wordt gebruikt in een inrichting bestaande uit twee of meer installaties als bedoeld in
      [artikel 47, eerste lid, onderdeel g, van de wet][ref2] de totale hoeveelheid op een distributienet ingevoede
      elektriciteit aan de installaties toegedeeld naar verhouding van de hoeveelheid per installatie opgewekte
      elektriciteit.

      2 Indien de inspecteur hierom wordt verzocht en indien aannemelijk wordt gemaakt dat de werkelijke verhouding
      niet overeenkomt met de verhouding, bedoeld in het eerste lid, kan de totale hoeveelheid op het distributienet
      ingevoede elektriciteit, bedoeld in het eerste lid, worden toegedeeld aan de installaties in overeenstemming met
      een verhouding die de werkelijkheid benadert.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel47
