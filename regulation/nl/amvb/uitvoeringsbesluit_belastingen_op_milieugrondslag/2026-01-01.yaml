  - number: '4'
    text: |-
      Voor de toepassing van [artikel 22, tweede lid, van de we][ref1]t wordt de toepassing van stoffen, preparaten
      of voorwerpen binnen een inrichting waar afvalstoffen worden gestort, geacht hetzij verband te houden met de
      bedrijfsvoering van de inrichting, hetzij deel uit te maken van het bedrijfsproces dat leidt tot de nuttige
      toepassing of verwijdering van afvalstoffen, indien de stoffen, preparaten of voorwerpen in de inrichting dienen
      voor, dan wel bestaan uit:

      a. materiaal voor het realiseren en onderhouden van een afrastering;

      b. materiaal voor het realiseren van de onderafdichtingsconstructie, de geohydrologische
      maatregelen en het controlesysteem zoals verlangd in het [Stortbesluit bodembescherming][ref2], de
      [Regeling stortplaatsen voor baggerspecie op land][ref3], dan wel de Richtlijnen voor baggerspeciestortplaatsen in
      het beleidsstandpunt «Verwijdering baggerspecie» (Kamerstukken II 1993/94, 23 450, nr. 1);

      c. materiaal voor het realiseren van de bovenafdichtingsconstructie zoals verlangd in het besluit, de regeling, of
      de richtlijnen, genoemd in onderdeel b;

      d. (riool)buizen voor de opvang en afvoer van percolaat en neerslag en materiaal voor installaties voor de
      behandeling van percolaat en neerslag;

      e. verzamelleidingen voor de opvang en afvoer van stortgas in de egalisatie- of steunlaag en materiaal voor
      installaties voor de behandeling van stortgas;

      f. het realiseren en in werking houden van nutsvoorzieningen;

      g. het realiseren en in werking houden van installaties voor het be- of verwerken van afvalstoffen;

      h. het operationeel houden van kantoren, van de controle- en registratieposten, van een laboratorium, van
      werkplaatsen, van het aanwezige rollende materieel en van de wasplaats;

      i. materiaal voor het realiseren en in stand houden van bouwwerken;

      j. materiaal voor het realiseren en in stand houden van een terreinverharding buiten het deel van de stortplaats,
      al dan niet in compartimenten onderverdeeld, waar tussen een onderafdichtings- en een bovenafdichtingsconstructie,
      als verlangd in het besluit, de regeling, dan wel de richtlijnen, genoemd in onderdeel b, afvalstoffen worden
      gestort (stortlichaam);

      k. ongediertebestrijding;

      l. een bouwstof als bedoeld in [artikel 1 van het Besluit bodemkwaliteit][ref4], die voorzien is
      van een erkende kwaliteitsverklaring, partijkeuring of fabrikant-eigenverklaring als bedoeld in
      [artikel 25b, eerste tot en met derde lid van dat besluit][ref5], waaruit blijkt dat zij voldoen aan de
      kwaliteitseisen, bedoeld in [artikel 25d, eerste lid, van dat besluit][ref6], en die worden toegepast in een
      voorziening die is aangebracht op grond van een voor de milieubelastende activiteit verleende omgevingsvergunning,
      bedoeld in [hoofdstuk 3 van het Besluit activiteiten leefomgeving][ref7];

      m. grond als bedoeld in [artikel 1 van het Besluit bodemkwaliteit][ref8], die voorzien is van
      een erkende kwaliteitsverklaring, partijkeuring of fabrikant-eigenverklaring als bedoeld in
      [artikel 25b, eerste tot en met derde lid van dat besluit][ref9], waaruit blijkt dat zij is ingedeeld in de
      kwaliteitsklasse landbouw/natuur, wonen of industrie, bedoeld in [artikel 25d, tweede lid, van dat besluit][ref10],
      die wordt toegepast in een voorziening die is aangebracht op grond van een voor de milieubelastende activiteit
      verleende omgevingsvergunning, bedoeld in [hoofdstuk 3 van het Besluit activiteiten leefomgeving][ref11];


