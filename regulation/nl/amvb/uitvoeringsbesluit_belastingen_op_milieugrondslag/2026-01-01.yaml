      1 Het verzoek om teruggaaf, bedoeld in [artikel 20, eerste lid, van de wet][ref1] kan worden gedaan na afloop van
      elke kalendermaand waarin recht op teruggaaf is ontstaan, en dient uiterlijk te worden gedaan binnen dertien weken
      na afloop van de verbruiksperiode van twaalf maanden.

      2 Teruggaaf wordt alleen verleend indien de eindfacturen worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel20
