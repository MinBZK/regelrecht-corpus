    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Financiën van 3 december 1992, nr. WM92-19, Directoraat-Generaal
    voor Fiscale Zaken, Afdeling Wetgeving Milieubelastingen, gedaan mede namens de Minister van Volkshuisvesting,
    Ruimtelijke Ordening en Milieubeheer;

    Gelet op de artikelen 6, derde lid, 10a, zesde lid, 13, zevende lid, 18a, derde lid, 28, achtste lid, 30, tweede
    lid, en 38, eerste lid, van de Wet belastingen op milieugrondslag;

    De Raad van State gehoord (advies van 18 december 1992, nr. W06.92.0614);

    Gezien het nader rapport van de Staatssecretaris van Financiën van 21 december 1994, nr. WM94-71M, Directoraat-
    Generaal voor Fiscale Zaken, Afdeling Wetgeving Milieubelastingen, uitgebracht mede namens de Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
