  - number: '8'
    text: |-
      1 Onze Minister van Infrastructuur en Waterstaat vermeldt in de beschikking, bedoeld
      in [artikel 25, derde lid, van de wet][ref1], de gegevens die de kennisgever ingevolge
      [artikel 7, eerste lid, onderdelen a tot en met h][ref2], bij zijn aanvraag heeft verstrekt.

      2 Onze Minister van Infrastructuur en Waterstaat kan de gegevens die de kennisgever bij zijn aanvraag heeft
      verstrekt vergelijken met gegevens die ter zake ingevolge de EVOA zijn verstrekt.

      3 In gevallen als bedoeld in [artikel 7, tweede lid][ref3], vermeldt Onze Minister van Infrastructuur en Waterstaat
      tevens in de beschikking de gegevens die de kennisgever heeft vermeld in zijn aanvraag ingevolge artikel 7, tweede
      lid.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0007178#Artikel7
