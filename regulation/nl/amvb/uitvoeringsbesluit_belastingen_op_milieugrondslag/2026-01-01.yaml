    text: |-
      De in [artikel 33, tweede lid][ref1], en [artikel 34, eerste lid, van de wet][ref2] bedoelde personen of
      publiekrechtelijke lichamen richten hun administratie zodanig in dat daarin op overzichtelijke wijze alle voor de
      heffing van kolen van belang zijnde gegevens zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel34
