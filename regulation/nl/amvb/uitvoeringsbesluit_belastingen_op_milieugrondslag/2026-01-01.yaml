  - number: 29a
    text: |-
      1 De vermindering op de verschuldigde belasting, bedoeld in [artikel 92, eerste lid, van de wet][ref1], bedraagt,
      in geval komt vast te staan dat een door de belastingplichtige ter zake van het leveren van goederen of het
      verrichten van diensten te ontvangen bedrag gedeeltelijk niet is en niet zal worden ontvangen, het gedeelte van het
      ter zake niet ontvangen bedrag dat naar evenredigheid correspondeert met de ter zake op aangifte voldane belasting.

      2 De opnieuw verschuldigde belasting, bedoeld in [artikel 92, derde lid, van de wet][ref2], bedraagt, in geval
      door de belastingplichtige alsnog geheel of gedeeltelijk een bedrag wordt ontvangen ter zake van het leveren van
      goederen of het verrichten van diensten ten aanzien waarvan een aanspraak op de vermindering van belasting is
      ontstaan, het gedeelte van het ter zake ontvangen bedrag dat naar evenredigheid correspondeert met de ter zake
      toegepaste vermindering.


