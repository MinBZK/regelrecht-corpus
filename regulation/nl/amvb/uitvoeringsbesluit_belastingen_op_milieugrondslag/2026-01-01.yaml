  - number: '27'
    text: |-
      1 Het tijdvak waarover een teruggaaf van belasting als bedoeld in
      [artikel 70, eerste tot en met vierde lid, van de wet][ref1] wordt verleend is:

      a. het kalenderjaar ingeval het aardgas of de elektriciteit in dat kalenderjaar is gebruikt op een wijze als
      bedoeld in [artikel 64, eerste of tweede lid, van de wet][ref2];

      b. het kalenderkwartaal ingeval het aardgas of de elektriciteit in dat kalenderkwartaal is gebruikt op een wijze
      als bedoeld in [artikel 64, vierde, vijfde of zesde lid, van de wet][ref3].

      2 De inspecteur kan op verzoek een tijdvak aanwijzen dat afwijkt van het tijdvak, bedoeld in het eerste lid,
      onderdelen a of b, met dien verstande dat het aan te wijzen tijdvak twaalf, onderscheidenlijk drie dan wel twaalf,
      aaneengesloten maanden bedraagt.

      3 Het verzoek om teruggaaf van belasting wordt gedaan binnen dertien weken na het einde van het in het eerste of
      tweede lid bedoelde tijdvak.

      4 Teruggaaf van belasting wordt alleen verleend indien de aankoopfacturen en de van belang zijnde gegevens en
      verklaringen over de bestemming van het aardgas of de elektriciteit waarop de teruggaaf betrekking heeft, worden
      overgelegd en indien de administratie van degene die om teruggaaf verzoekt voldoet aan bij ministeriële regeling te
      stellen voorwaarden.

      5 [Artikel 22, tweede lid][ref4], is van overeenkomstige toepassing op de teruggaaf, bedoeld in
      [artikel 70, eerste tot en met vierde lid, van de wet][ref5] ingeval het aardgas of de elektriciteit is gebruikt op
      een in [artikel 64, eerste of tweede lid, van de wet][ref6] bedoelde wijze.

      6 [Artikel 22, zesde lid][ref7], is van overeenkomstige toepassing op de teruggaaf van belasting, bedoeld in
      [artikel 70, eerste tot en met vierde lid, van de wet][ref8].

      7 De teruggaaf, bedoeld in [artikel 70, eerste tot en met vierde lid, van de wet][ref9], wordt voorts alleen
      verleend als het bedrag aan belasting expliciet op de factuur in rekening is gebracht en slechts voor zover die
      factuur is betaald.

      8 Voor het berekenen van de teruggaaf, bedoeld in [artikel 70, eerste tot en met vierde lid, van de wet][ref10],
      wordt het verbruik in de verbruiksperiode, bedoeld in [artikel 47, eerste lid, onderdeel d, van de wet][ref11],
      in aanmerking genomen.

      9 Indien een hoger bedrag aan belasting is gefactureerd dan door degene die de levering heeft
      verricht verschuldigd is, wordt voor het bepalen van de hoogte van de teruggaaf, bedoeld in
      [artikel 70, eerste tot en met vierde lid, van de wet][ref12], het bedrag aan verschuldigde belasting gebruikt.


