  - number: '15'
    text: |-
      Het brengen, bedoeld in [artikel 35, tweede lid, onderdeel a, van de wet][ref1], van kolen vanuit een derde
      land naar een plaats voor tijdelijke opslag, het in Nederland plaatsen onder een EU-douaneregeling van vanuit
      een derde land binnengebrachte kolen, bedoeld in [artikel 35, tweede lid, onderdeel b, van de wet][ref2],
      alsmede het onder ambtelijk toezicht vernietigen van kolen die onder een EU-douaneregeling
      zijn geplaatst, bedoeld in [artikel 35, tweede lid, onderdeel e, van de wet][ref3], geschiedt
      met inachtneming van de formaliteiten die op grond van de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref4], moeten worden vervuld.


