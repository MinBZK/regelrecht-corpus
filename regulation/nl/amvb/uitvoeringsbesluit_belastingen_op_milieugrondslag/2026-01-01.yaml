  - number: '14'
    text: |-
      1 Het brengen, bedoeld in [artikel 35, tweede lid, onderdelen a en d, van de wet][ref1], van kolen vanuit een
      derde land of vanuit een plaats voor tijdelijke opslag naar een inrichting, alsmede het brengen, bedoeld in
      [artikel 35, tweede lid, onderdeel c, van de wet][ref2], van kolen die zijn geplaatst onder een EU-douaneregeling
      naar een inrichting, wordt bij het aangeven voor het vrije verkeer van de kolen op grond van de wettelijke
      bepalingen, bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref3], aangetoond met een
      vervoersopdracht. De vervoersopdracht wordt opgemaakt door de vergunninghouder van de inrichting waarnaar de kolen
      worden overgebracht, dan wel in diens opdracht.

      2 Op de in het eerste lid bedoelde vervoersopdracht wordt een verklaring gesteld van de vergunninghouder van de
      inrichting waarnaar de kolen zullen worden overgebracht dat de kolen worden overgebracht naar zijn inrichting en in
      de administratie van zijn inrichting worden opgenomen.

      3 De in het eerste lid bedoelde kolen moeten hun bestemming hebben bereikt binnen één maand
      na het tijdstip waarop de vereiste aangifte op grond van de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref4], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel35
