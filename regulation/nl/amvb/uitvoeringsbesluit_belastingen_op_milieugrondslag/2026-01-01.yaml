        bwb_id: BWBR0007168
        artikel: 25a
  - number: '7'
    text: |-
      1 De kennisgever vermeldt in de aanvraag, bedoeld in [artikel 25a, eerste lid, van de wet][ref1]:

      a. naam en adres van de kennisgever;

      b. het RSIN van de kennisgever, dan wel, indien de kennisgever niet beschikt over een RSIN, het KvK-nummer van
      de kennisgever, dan wel, indien de kennisgever evenmin beschikt over een KvK-nummer, het VIHB-nummer van de
      kennisgever;

      c. het kennisgevingsnummer waarop de aanvraag betrekking heeft;

      d. de periode waarop de toestemming tot overbrenging betrekking heeft;

      e. het maximale gewicht van de afvalstoffen waarop de toestemming tot overbrenging betrekking heeft;

      f. het tijdstip van aanvang van de eerste fysieke overbrenging en het tijdstip van aanvang van de laatste fysieke
      overbrenging met toepassing van de toestemming tot overbrenging;

      g. het tijdstip waarop de verklaring, bedoeld in artikel 16, onderdeel e, van de EVOA, is ontvangen, dan wel
      ontvangen had moeten zijn, voor alle afvalstoffen die met toepassing van de toestemming tot overbrenging zijn
      overgebracht uit Nederland;

      h. het gewicht van de afvalstoffen die met toepassing van de toestemming tot overbrenging zijn overgebracht,
      alsmede het aantal transporten waarmee de afvalstoffen zijn overgebracht.

      2 Indien een lager belastingbedrag in aanmerking wordt genomen als bedoeld in
      [artikel 25, tweede lid, van de wet][ref2], specificeert de kennisgever in de aanvraag op welke wijze de
      afvalstoffen, bedoeld in het eerste lid, onderdeel h, al dan niet na opslag, sortering of bewerking, zijn of zullen
      worden verwerkt. De kennisgever vermeldt daartoe:

      a. het gewicht van baggerspecie die is of zal worden gestort of verbrand;

      b. het gewicht van zuiveringsslib dat is of zal worden verbrand in een installatie buiten Nederland, verminderd met
      het gewicht van het aan dat zuiveringsslib toe te rekenen verbrandingsresidu;

      c. het gewicht van afvalstoffen, niet zijnde baggerspecie, zuiveringsslib of gemengde afvalstoffen, die zijn of
      zullen worden verbrand in een installatie buiten Nederland waarin niet of nauwelijks gemengde afvalstoffen worden
      verbrand, verminderd met het gewicht van het aan die afvalstoffen toe te rekenen verbrandingsresidu;

      d. het gewicht van afvalstoffen waarvan het gewicht niet is vermeld ingevolge onderdelen a, b of c, voor zover deze
      afvalstoffen zijn of zullen worden verbrand in een installatie buiten Nederland waarin geen gemengde afvalstoffen
      mogen worden verbrand, verminderd met het gewicht van het aan die afvalstoffen toe te rekenen verbrandingsresidu;

      e. het gewicht van afvalstoffen waarvan het gewicht niet is vermeld ingevolge onderdelen a tot en met d, voor zover
      deze afvalstoffen zijn of zullen worden verbrand in een installatie buiten Nederland, verminderd met het gewicht
      van het aan die afvalstoffen toe te rekenen verbrandingsresidu;

      f. het gewicht van verbrandingsresidu als bedoeld in onderdelen b, c, d of e, voor zover dat residu nuttig is of
      zal worden toegepast;

      g. het gewicht van afvalstoffen waarvan het gewicht niet is vermeld ingevolge onderdelen a tot en met f, daaronder
      begrepen verbrandingsresidu als bedoeld in de onderdelen b, c, d of e, voor zover deze afvalstoffen buiten
      Nederland zijn of zullen worden gestort;

      h. het gewicht van afvalstoffen waarvan het gewicht niet is vermeld ingevolge onderdelen a tot en met g, daaronder
      begrepen verbrandingsresidu als bedoeld in de onderdelen b, c, d of e, voor zover deze afvalstoffen in Nederland
      zijn of zullen worden gestort of verbrand;

      i. het gewicht van de afvalstoffen, bedoeld in het eerste lid, onderdeel h, waarvan het gewicht niet is vermeld
      ingevolge onderdelen a tot en met h.

      Bij het gewicht, vermeld ingevolge de onderdelen a tot en met i, specificeert de kennisgever de aard en
      verwerkingswijze van de afvalstoffen. Indien bij een of meer van genoemde onderdelen sprake is van meer dan één
      verwerkingswijze, specificeert de kennisgever deze gegevens per verwerkingswijze. Bij de aanvraag verklaart de
      kennisgever te beschikken over een schriftelijke verklaring van de ontvanger, bedoeld in artikel 2, veertiende lid,
      EVOA, aan de hand waarvan de hoeveelheden, bedoeld in onderdelen a tot en met i, kunnen worden vastgesteld, onder
      vermelding van de plaats waar en de datum wanneer de laatstgenoemde verklaring is opgesteld.

      3 De schriftelijke verklaring, bedoeld in het tweede lid, laatste zin, wordt ondertekend door de ontvanger en
      bevat:

      a. naam en adres van de ontvanger;

      b. het kennisgevingsnummer waarop de verklaring betrekking heeft;

      c. het gewicht van de afvalstoffen die met toepassing van de toestemming tot overbrenging zijn overgebracht,
      alsmede het aantal transporten waarmee de afvalstoffen zijn overgebracht;

      d. de gewichten, bedoeld in het tweede lid, onderdelen a tot en met i;

      e. in geval de afvalstoffen geheel of gedeeltelijk zijn of zullen worden verwerkt bij verschillende bedrijven: een
      uitsplitsing van de gewichten, bedoeld in onderdeel d, over alle bedrijven waar een deel van de afvalstoffen is of
      zal worden verwerkt; indien meerdere opeenvolgende verwerkingswijzen op de afvalstoffen worden toegepast, geeft de
      uitsplitsing een schematische weergave van de verschillende stromen afvalstoffen en verwerkingswijzen;

      f. de verklaring dat de gegevens juist en volledig zijn en zonder voorbehoud worden verstrekt.

      4 De kennisgever doet de melding, bedoeld in [artikel 25a, eerste lid, tweede zin, van de wet][ref3] op de daartoe
      bij de voorziening, bedoeld in [artikel 6, eerste lid][ref4], voorgeschreven wijze.

      5 De kennisgever is gehouden op zodanige wijze een administratie te voeren en de daartoe behorende boeken,
      bescheiden en andere gegevensdragers op zodanige wijze te bewaren, dat hieruit te allen tijde de gegevens blijken
      die van belang zijn voor een juiste vaststelling van de hoeveelheden, bedoeld in het tweede lid, onderdelen a tot
      en met d, daaronder begrepen de verklaring, bedoeld in het tweede lid, tweede volzin, en de hem ter beschikking
      staande gegevens die aan die verklaring ten grondslag liggen. De kennisgever is verplicht deze gegevens gedurende
      zeven jaar te bewaren.

      6 Bij regeling van Onze Ministers kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0007168#Artikel25a
