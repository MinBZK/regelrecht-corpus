      bedoeld in het eerste lid, op enig moment niet meer juist is. De schriftelijke intrekking wordt door hem
      ondertekend, waarbij het moment, bedoeld in de vorige zin, wordt vermeld.

      3 [Artikel 21c][ref4] is van overeenkomstige toepassing.


