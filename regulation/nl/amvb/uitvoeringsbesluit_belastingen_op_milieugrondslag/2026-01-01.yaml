  - number: '9'
    text: |-
      1 In afwijking van [artikel 8, eerste en derde lid][ref1], vermeldt Onze Minister van Infrastructuur en Waterstaat
      in de beschikking, bedoeld in [artikel 25, derde lid, van de wet][ref2], uitsluitend de gegevens bedoeld in
      [artikel 7, eerste lid, onderdelen a tot en met h][ref3], die ter zake ingevolge de EVOA zijn ontvangen, indien en
      voor zover:

      a. voor de afgifte van de beschikking blijkt dat de gegevens die de kennisgever ingevolge [artikel 7][ref4] bij
      zijn aanvraag heeft verstrekt onjuist of onvolledig zijn; dan wel

      b. Onze Minister de beschikking afgeeft op grond van [artikel 25a, vierde lid, van de wet][ref5].

      Ingeval evenwel de ingevolge de EVOA gemelde gegevens onjuist of onvolledig zijn, en de juiste en volledige
      gegevens redelijkerwijs evenmin tijdig op andere wijze kunnen worden vastgesteld, vermeldt Onze Minister van
      Infrastructuur en Waterstaat in afwijking van de eerste zin in de beschikking uitsluitend de gegevens, bedoeld in
      [artikel 7, eerste lid, onderdelen a tot en met g][ref6].

      2 Indien Onze Minister van Infrastructuur en Waterstaat de beschikking afgeeft ingevolge
      [artikel 25a, vierde lid, onderdeel b, van de wet][ref7], nadat de kennisgever een melding heeft gedaan als bedoeld
      in artikel 25a, eerste lid, tweede zin, van de wet, vermeldt Onze Minister in de beschikking de gegevens, genoemd
      in [artikel 7, eerste lid][ref8], en, indien van toepassing, artikel 7, tweede lid, zoals door de kennisgever
      gecorrigeerd bij de melding.

      3 Bij toepassing van het eerste lid stelt Onze Minister van Infrastructuur en Waterstaat, voordat hij
      de beschikking afgeeft, de kennisgever in de gelegenheid een aanvraag in te dienen binnen een daarvoor
      door hem te stellen termijn waarin hij alsnog de gegevens, genoemd in [artikel 7][ref9], verstrekt. De
      [artikelen 6 tot en met 9, eerste en tweede lid][ref10], zijn van overeenkomstige toepassing ten aanzien van een
      dergelijke aanvraag.


