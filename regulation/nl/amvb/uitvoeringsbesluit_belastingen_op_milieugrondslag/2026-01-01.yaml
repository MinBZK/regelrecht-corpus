articles:
  - number: '1'
    text: |-
      1 Dit besluit geeft uitvoering aan de [artikelen 20, derde lid][ref1], [22, tweede lid][ref2],
      [25a, zesde lid][ref3], [27, vijfde lid][ref4], [29a][ref5], [29b, tweede lid][ref6],
      [33, derde en vierde lid][ref7], [34, derde lid][ref8], [35, tweede lid][ref9], [44, vierde lid][ref10],
      [45, derde lid][ref11], [47, eerste lid, onderdeel w][ref12], [50, zevende lid][ref13],
      [51, eerste lid][ref14], [54, vijfde lid][ref15], [59, zesde lid][ref16], [59a, vierde lid][ref17],
      [artikel 60, tweede en zesde lid, onderdeel a][ref18], [artikel 60a, vijfde lid][ref19],
      [artikel 60b, derde en vijfde lid, onderdeel a][ref20], [63, zesde lid][ref21],
      [64, zesde lid][ref22], [67, derde lid][ref23], [68, derde lid][ref24], [69, zevende lid][ref25],
      [70, vierde lid][ref26], [70a, eerste lid][ref27], [72, onderdeel c][ref28], [92, vijfde lid][ref29], en
      [93, eerste lid, van de Wet belastingen op milieugrondslag][ref30].

      2 Voor de toepassing van dit besluit wordt verstaan onder:

      a. *de wet:* de [Wet belastingen op milieugrondslag][ref31];

      b. *kennisgevingsnummer:* het nummer dat door Onze Minister van Infrastructuur en Waterstaat ingevolge bijlage IC,
      onder 3, van de EVOA wordt toegekend aan het in bijlage IA van de EVOA verplicht gestelde kennisgevingsdocument;

      c. *gemengde afvalstoffen:* huishoudelijke afvalstoffen, gemengde bedrijfsafvalstoffen of gemengd sorteerresidu;

      d. *RSIN:* rechtspersonen en samenwerkingsverbanden informatienummer dat door de Kamer van Koophandel wordt
      verstrekt bij inschrijving van rechtspersonen en samenwerkingsverbanden in het handelsregister;

      e. *KvK-nummer:* het unieke nummer, bedoeld in [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref32];

      f. *VIHB-nummer:* het registratienummer welke door de Stichting Nationale en Internationale
      Wegvervoer Organisatie is toegekend aan een bedrijf dat wordt vermeld op de lijst, bedoeld in de
      [artikelen 10.45, eerste lid, onderdeel a][ref33], en [10.55, eerste lid, van de Wet milieubeheer][ref34];

      g. *gecertificeerd asbestverwijderingsbedrijf:* bedrijf dat in het bezit is van een certificaat asbestverwijdering
      als bedoeld in [artikel 4.54d, eerste lid, van het Arbeidsomstandighedenbesluit][ref35];

      h. *landelijk asbestvolgsysteem:* elektronische voorziening waarin informatie over het proces van
      asbestinventarisatie, asbestverwijdering, eindbeoordeling asbestverwijdering, opslag en transport en stort van
      asbest en asbesthoudende producten wordt ingevoerd en opgeslagen via https://www.asbestvolgsysteem.nl.


