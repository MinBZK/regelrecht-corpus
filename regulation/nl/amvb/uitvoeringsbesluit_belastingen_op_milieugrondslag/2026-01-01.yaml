    text: |-
      1 Het tijdvak waarover een teruggaaf van belasting als bedoeld in
      [artikel 45, eerste of tweede lid, van de wet][ref1], wordt verleend is het kalenderkwartaal. De inspecteur kan op
      verzoek een ander tijdvak aanwijzen.

      2 Het verzoek om teruggaaf wordt gedaan binnen dertien weken:

      a. na het einde van het in het eerste lid bedoelde tijdvak waarin de kolen zijn gebruikt op een wijze, bedoeld in
      [artikel 44, eerste, tweede of derde lid, van de wet][ref2];

      b. nadat de kolen de in [artikel 45, tweede lid, van de wet][ref3] bedoelde bestemming hebben gevolgd.

      3 Bij het verzoek om teruggaaf worden de aankoopfactuur en de van belang zijnde gegevens over de bestemming van de
      kolen waarop de teruggaaf betrekking heeft overgelegd.

      4 [Artikel 17, tweede lid][ref4], is van overeenkomstige toepassing op de teruggaaf, bedoeld in
      [artikel 45, eerste lid, van de wet][ref5], met betrekking tot kolen die worden gebruikt op een wijze als bedoeld
      in [artikel 44, tweede lid, van de wet][ref6].

      5 De administratie van degene die om teruggaaf verzoekt, voldoet aan bij ministeriële regeling te stellen
      voorwaarden.


