---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_etikettering_energiegebruik_personenautos
regulatory_layer: AMVB
publication_date: '2014-03-19'
valid_from: '2014-03-20'
bwb_id: BWBR0011761
url: https://wetten.overheid.nl/BWBR0011761/2014-03-20
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 4 juli 2000, nr. WJZ00042055, gedaan mede namens Onze
    Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en in overeenstemming met Onze Minister van
    Verkeer en Waterstaat;

    Gelet op richtlijn nr. 1999/94/EG van het Europees Parlement en de Raad van de Europese Unie van 13 december 1999
    betreffende de beschikbaarheid van consumenteninformatie over het brandstofverbruik en de CO2-uitstoot bij het op
    de markt brengen van nieuwe personenauto's (PbEG 2000, L 12), op artikel 6 van de Wet energiebesparing toestellen
    en op artikel 4b, tweede lid, van de Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 24 augustus 2000, nr. W10.00.0271/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 26 oktober 2000, nr. WJZ 00066707, uitgebracht
    mede namens Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en in overeenstemming met Onze
    Minister van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.a
    text: |-
      richtlijn 2007/46/EG: richtlijn 2007/46/EG van het Europees Parlement en de Raad van de Europese Unie van 5
      september 2007 tot vaststelling van een kader voor de goedkeuring van motorvoertuigen en aanhangwagens daarvan en
      van systemen, onderdelen en technische eenheden die voor dergelijke voertuigen zijn bestemd (Pb EU L 263);
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.b
    text: |-
      verordening (EG) 692/2008: Verordening (EG) nr. 692/2008 van de Commissie van 18 juli 2008 tot uitvoering en
      wijziging van Verordening (EG) 715/2007 van het Europees Parlement en de Raad van 20 juni 2007, betreffende de
      typegoedkeuring van motorvoertuigen met betrekking tot emissies van lichte personen- en bedrijfsvoertuigen (Euro 5
      en Euro 6) en de toegang tot reparatie- en onderhoudsinformatie (PbEG 2008, L 199);
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.c
    text: |-
      [richtlijn 2002/24/EG](32002L0024): [richtlijn nr. 2002/24/EG](32002L0024) van het Europees Parlement en de
      Raad van de Europese Unie van 18 maart 2002 (PbEG L 124) betreffende de goedkeuring van twee- of driewielige
      motorvoertuigen en de intrekking van [richtlijn nr. 92/61/EEG](31992L0061) van de Raad;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.d
    text: |-
      [richtlijn 1999/94/EG](31999L0094): [richtlijn nr. 1999/94/EG](31999L0094) van het Europees Parlement en de
      Raad van de Europese Unie van 13 december 1999 betreffende de beschikbaarheid van consumenteninformatie over het
      brandstofverbruik en de CO-uitstoot bij het op de markt brengen van nieuwe personenauto's (PbEG 2000, L 12);
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.e
    text: |-
      personenauto: een motorvoertuig van categorie M1, zoals gedefinieerd in bijlage II bij richtlijn 2007/46/EG, met
      uitzondering van voertuigen die onder richtlijn 2002/24/EG vallen en voertuigen voor speciale doelen als omschreven
      in artikel 9, eerste lid, onder b, van richtlijn 2007/46/EG;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.f
    text: |-
      nieuwe personenauto: een personenauto die nog niet eerder is verkocht aan een persoon voor een ander doel dan
      verkoop of levering aan een derde;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.g
    text: 'leverancier: degene die nieuwe personenauto''s in Nederland in de handel brengt;'
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.h
    text: |-
      verkooppunt: een plaats waar nieuwe personenauto's zijn uitgestald of aan potentiële klanten ten verkoop of
      ter leasing worden aangeboden, waaronder begrepen beurzen waar nieuwe personenauto's aan het publiek worden
      gepresenteerd;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.i
    text: |-
      handelaar: degene die nieuwe personenauto's op een verkooppunt ten verkoop of ter leasing aanbiedt of aan het
      publiek presenteert;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.j
    text: 'certificaat van overeenstemming: het document, bedoeld in artikel 18, eerste lid, van richtlijn 2007/46/EG;'
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.k
    text: |-
      merk: het handelsmerk van de constructeur dat op het certificaat van overeenstemming en in de
      typegoedkeuringsdocumentatie is vermeld;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.l
    text: |-
      type, variant en uitvoering: de door de constructeur opgegeven versies van een bepaald voertuigmerk,
      zoals omschreven in bijlage IIB bij richtlijn 2007/46/EG, die individueel worden onderscheiden door
      typegoedkeuringsnummers, variantcodes en uitvoeringscodes;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.m
    text: |-
      model: de handelsbenaming van het merk, het type en, indien voorhanden en dienstig, de variant en uitvoering van
      een personenauto;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.n
    text: |-
      officieel brandstofverbruik: het door de typegoedkeuringsinstantie aangenomen brandstofverbruik overeenkomstig
      verordening (EG) 692/2008 en vermeld in bijlage VIII van richtlijn 2007/46/EG, die is gehecht aan het EG-
      typegoedkeuringscertificaat of in het certificaat van overeenstemming, met dien verstande dat, wanneer verscheidene
      varianten of uitvoeringen onder één model zijn gegroepeerd, de op te geven waarde van het brandstofverbruik van dat
      model gebaseerd is op de variant of uitvoering met het hoogste officiële brandstofverbruik binnen die groep;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.o
    text: |-
      officiële specifieke CO-uitstoot: de uitstoot gemeten overeenkomstig verordening (EG) 692/2008 en vermeld in
      bijlage VIII van richtlijn 2007/46/EG, die is gehecht aan het EG-typegoedkeuringscertificaat of in het certificaat
      van overeenstemming, met dien verstande dat, wanneer verscheidene varianten of uitvoeringen onder één model
      zijn gegroepeerd, de op te geven CO-waarde van dat model is gebaseerd op de variant of uitvoering met de hoogste
      officiële CO-uitstoot binnen die groep;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.p
    text: |-
      reclamemateriaal: al het drukwerk dat wordt gebruikt bij de afzet van, het adverteren voor en het bevorderen van de
      verkoop van voertuigen aan het publiek, waartoe in ieder geval behoren technische handboeken, brochures en reclame
      in kranten en tijdschriften, in de vakpers en op affiches;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.q
    text: |-
      RDW: de Dienst Wegverkeer, genoemd in [artikel 4a van de Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4a
  - number: 1.r
    text: |-
      brandstofverbruiksgids: een gids met informatie ten behoeve van de consument omtrent het energiegebruik van alle op
      de Nederlandse markt verkrijgbare nieuwe modellen personenauto's;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.s
    text: |-
      relatieve energiezuinigheid: de mate waarin een personenauto meer of minder CO uitstoot dan de referentiewaarde
      voor de desbetreffende auto;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.t
    text: |-
      referentiewaarde: de waarde van de CO-uitstoot als uitkomst van formules die zijn opgenomen de regeling, bedoeld
      in [artikel 6a][ref1], respectievelijk voor personenauto's met benzine als brandstof, en personenauto's met diesel
      als brandstof;


      [ref1]: https://wetten.overheid.nl/BWBR0011761#Artikel6a
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011761
        artikel: 6a
  - number: 1.u
    text: |-
      regressieformules: de formules met behulp waarvan de relatieve energiezuinigheid van personenauto's kan worden
      berekend;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.v
    text: |-
      informatie omtrent het energiegebruik: informatie omtrent het officiële brandstofverbruik, de officiële specifieke
      CO-uitstoot, de relatieve energiezuinigheid of andere gegevens met betrekking tot het energiegebruik van nieuwe
      personenauto's;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.w
    text: |-
      energie-etiket: een etiket met informatie ten behoeve van de consument omtrent het energiegebruik van de auto
      waarop het is aangebracht;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.x
    text: |-
      [richtlijn 92/21/EEG](31992L0021): [richtlijn nr. 92/21/EEG](31992L0021) van de Raad van de Europese Gemeenschappen
      van 31 maart 1992 betreffende massa's en afmetingen van motorvoertuigen van categorie M1 (PbEEG 1992, L 129);
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: 1.y
    text: |-
      energie-efficiëntieklasse: de klassegewijze indeling van nieuwe modellen personenauto’s op basis van de berekende
      waarden voor de relatieve energiezuinigheid ten opzichte van een referentiewaarde.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel1
  - number: '2.1'
    text: |-
      De leverancier draagt ervoor zorg dat de handelaren, aan wie hij nieuwe personenauto's levert, beschikken over de
      voor het desbetreffende kalenderjaar geldende energie-etiketten voor deze personenauto's, die voldoen aan de eisen
      van [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011761
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011761
  - number: '2.2'
    text: |-
      De leverancier draagt ervoor zorg dat de handelaren, aan wie hij nieuwe personenauto's levert, met het oog op de
      naleving van [artikel 6, eerste lid, onder b][ref1], beschikken over voldoende voor het desbetreffende kalenderjaar
      geldende brandstofverbruiksgidsen.


      [ref1]: https://wetten.overheid.nl/BWBR0011761#Artikel6
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011761
        artikel: '6'
  - number: '2.3'
    text: |-
      De leverancier draagt ervoor zorg dat de handelaren, aan wie hij nieuwe personenauto's levert, beschikken over een
      poster of een display met informatie omtrent het energiegebruik van alle nieuwe personenauto's van de leverancier
      die door de handelaar zijn uitgestald of te koop of ter leasing worden aangeboden, welke voldoet aan de eisen van
      [bijlage 2][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011761
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011761
  - number: '2.4'
    text: |-
      De leverancier stelt de energie-etiketten en posters of displays tegen ten hoogste de kostprijs ter beschikking. De
      leverancier stelt de brandstofverbruiksgidsen kosteloos ter beschikking.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel2
  - number: '3.1'
    text: De RDW stelt jaarlijks vóór 1 december de brandstofverbruiksgids samen voor het eerstvolgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel3
  - number: '3.2'
    text: De brandstofverbruiksgids voldoet aan de eisen van bijlage II bij [richtlijn 1999/94/EG](31999L0094).
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel3
  - number: '3.3'
    text: De RDW stelt de brandstofverbruiksgids kosteloos beschikbaar aan de leveranciers.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel3
  - number: '3.4'
    text: |-
      Onze Minister van Infrastructuur en Milieu wijst een of meer instanties aan waar een consument op verzoek kosteloos
      een brandstofverbruiksgids kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel3
  - number: '4.1'
    text: |-
      Reclamemateriaal inzake nieuwe personenauto's bevat informatie omtrent het energiegebruik van de modellen
      personenauto's waarop deze reclame betrekking heeft. Deze informatie voldoet aan de eisen van [bijlage 3][ref1] bij
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011761
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011761
  - number: '4.2'
    text: |-
      De leverancier draagt ervoor zorg dat de handelaren op verzoek beschikken over de informatie, bedoeld in het eerste
      lid, die betrekking heeft op de modellen personenauto's van de leverancier die door de handelaar zijn uitgestald of
      te koop of ter leasing worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel4
  - number: '4.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op reclamemateriaal dat alleen betrekking heeft op een merk en
      niet op bepaalde modellen in het bijzonder.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel4
  - number: '4.4'
    text: |-
      Het is verboden op reclamemateriaal merktekens, symbolen of opschriften betreffende het energiegebruik aan
      te brengen, die niet in overeenstemming zijn met dit besluit, indien dit bij potentiële gebruikers van nieuwe
      personenauto's verwarring kan wekken.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel4
  - number: '5.1'
    text: |-
      De leverancier draagt zorg voor de juistheid van de informatie, bedoeld in de
      [artikelen 2, eerste en derde lid][ref1], en [4, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011761#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011761#Artikel4
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011761
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011761
        artikel: '4'
  - number: '5.2'
    text: |-
      Onverminderd het eerste lid, draagt degene die opdracht geeft tot het vervaardigen van reclamemateriaal zorg voor
      de juistheid van de informatie, bedoeld in [artikel 4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011761#Artikel4
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011761
        artikel: '4'
  - number: '6.1'
    text: |-
      Het is een handelaar verboden om een nieuwe personenauto op een verkooppunt ten verkoop of ter leasing tentoon te
      stellen of aan het publiek te presenteren zonder dat:
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel6
  - number: 6.1.a
    text: |-
      duidelijk zichtbaar op of in de onmiddellijke nabijheid van de auto een voor de desbetreffende auto van toepassing
      zijnd energie-etiket als bedoeld in [artikel 2, eerste lid][ref1], is aangebracht,


      [ref1]: https://wetten.overheid.nl/BWBR0011761#Artikel2
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011761
        artikel: '2'
  - number: 6.1.b
    text: de consument op het verkooppunt op verzoek een gratis brandstofverbruiksgids kan verkrijgen en
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel6
  - number: 6.1.c
    text: |-
      op het verkooppunt duidelijk zichtbaar voor elk merk van daar te koop of ter leasing aangeboden of gepresenteerde
      nieuwe personenauto's een poster of display met informatie omtrent het energiegebruik als bedoeld in
      [artikel 2, derde lid][ref1], aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0011761#Artikel2
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011761
        artikel: '2'
  - number: '6.2'
    text: |-
      Het is een handelaar verboden een nieuwe personenauto ten verkoop of ter leasing tentoon te stellen of aan het
      publiek te presenteren, terwijl op de etiketten en posters of displays of in de brandstofverbruiksgids merktekens,
      symbolen of opschriften zijn aangebracht betreffende het energiegebruik, die niet in overeenstemming zijn met dit
      besluit, indien dit bij potentiële gebruikers van nieuwe personenauto's verwarring kan wekken.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel6
  - number: '6.3'
    text: |-
      Een energie-etiket als bedoeld in het eerste lid, onder a, kan in de periode van 1 november tot en met 31 december
      in plaats van een voor het desbetreffende kalenderjaar geldend etiket ook een etiket zijn dat betrekking heeft op
      het eerstvolgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel6
  - number: 6a
    text: 'Bij regeling van Onze Minister van Infrastructuur en Milieu worden regels vastgesteld voor:'
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel6a
  - number: 6a.a
    text: de bepaling van de energie-efficiëntieklasse en
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel6a
  - number: 6a.b
    text: de vaststelling van de constanten en waarden ten behoeve van de berekening van de relatieve zuinigheid.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel6a
  - number: '7.1'
    text: 'De leverancier verstrekt jaarlijks vóór 1 oktober aan de RDW de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel7
  - number: 7.1.a
    text: |-
      de benaming van de modellen nieuwe personenauto's waarvan hij weet of verwacht dat hij die in het eerstvolgende
      kalenderjaar in Nederland in de handel zal brengen;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel7
  - number: 7.1.b
    text: de groepering van varianten of uitvoeringen van een merk tot modellen nieuwe personenauto's.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel7
  - number: '7.2'
    text: |-
      De leverancier verstrekt in de periode tussen de mededelingen, bedoeld in het eerste lid, gegevens aan de RDW
      inzake:
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel7
  - number: 7.2.a
    text: |-
      de benaming van modellen nieuwe personenauto's waarvan hij weet of verwacht dat hij die in Nederland in de handel
      zal brengen, voor zover deze gegevens niet reeds op grond van het eerste lid aan de RDW zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel7
  - number: 7.2.b
    text: |-
      de groepering van varianten of uitvoeringen van een merk tot modellen nieuwe personenauto's, bedoeld in onderdeel
      a.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel7
  - number: '7.3'
    text: |-
      De leverancier kan in de periode, bedoeld in het tweede lid, varianten of uitvoeringen van een merk toevoegen aan
      een reeds eerder op grond van het eerste lid of het tweede lid, onder a, gemeld model, mits:
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel7
  - number: 7.3.a
    text: hij deze gegevens binnen een maand na toevoeging aan de RDW verstrekt en
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel7
  - number: 7.3.b
    text: |-
      de groepering van dat model door toevoeging van die variant of uitvoering aan het model niet zodanig wijzigt,
      dat het model een hoger officieel brandstofverbruik of een hogere officiële specifieke CO-uitstoot krijgt, of
      dat het model een zodanig andere relatieve energiezuinigheid, berekend overeenkomstig de regeling, bedoeld in
      [artikel 6a][ref1], krijgt dat het model tot een andere energie-efficiëntieklasse gaat behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0011761#Artikel6a
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011761
        artikel: 6a
  - number: '7.4'
    text: |-
      De benamingen van modellen nieuwe personenauto's als bedoeld in het eerste en tweede lid zijn zodanig dat daaruit
      de verschillen tussen de diverse modellen kunnen worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel7
  - number: '7.5'
    text: Onder één model worden geen varianten of uitvoeringen gegroepeerd die een verschillende soort brandstof gebruiken.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel7
  - number: '8.1'
    text: |-
      De RDW stelt vanaf 1 januari 2011 iedere twee jaar vóór 1 maart de constanten vast voor de bij regeling van Onze
      Minister van Infrastructuur en Milieu vast te stellen regressieformules, alsmede de daarbij behorende waarden
      van de gemiddelde CO-uitstoot voor personenauto’s met benzine als brandstof en voor personenauto’s met diesel
      als brandstof. Deze waarden en constanten gelden voor de twee kalenderjaren die aanvang vinden na de datum van
      vaststelling.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel8
  - number: '8.2'
    text: |-
      De constanten en waarden worden vanaf 1 januari 2011 elke twee jaar vóór 1 maart door de RDW bekend gemaakt in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel8
  - number: '9.1'
    text: |-
      Een wijziging van de richtlijnen of van een daarbij behorende bijlage waarnaar in dit besluit wordt
      verwezen, treedt voor de toepassing van dit besluit in werking met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister van Infrastructuur en Milieu doet mededeling van een wijziging van [richtlijn 1999/94/EG](31999L0094)
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011761/2014-03-20#Artikel9
  - number: '11'
    text: |-
      Dit besluit treedt in werking met ingang van 18 januari 2001, met uitzondering van de [artikelen 1][ref1],
      [3][ref2], [7][ref3], [8][ref4], [9, eerste lid][ref5], en [10][ref6] en [bijlage 4][ref7], [onder II][ref8],
      die in werking treden met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het besluit wordt
      geplaatst.


