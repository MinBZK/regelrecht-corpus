    text: >-
      Het Besluit subsidies programmatische bedrijfsgerichte technologiestimulering, het Besluit subsidies
      informatietechnologie, het Besluit subsidies toeleveren en uitbesteden en de Subsidieregeling bedrijfsgericht
      technologisch onderzoek door collectiviteiten 1994 worden ingetrokken, met dien verstande dat zij van toepassing
      blijven op subsidies die voor de inwerkingtreding van dit besluit zijn verleend of vastgesteld.
