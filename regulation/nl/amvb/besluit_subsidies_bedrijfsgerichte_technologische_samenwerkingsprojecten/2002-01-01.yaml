  - number: '20'
    text: >-
      Onze Minister geeft op de aanvraag een beschikking binnen acht weken na ontvangst van de aanvraag. Indien de
      beschikking niet binnen acht weken kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt
      hij daarbij een redelijke termijn waarop de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#Artikel20
  - number: '21'
    text: >-
      Onze Minister kan in ieder geval afwijzend beschikken op een aanvraag, indien een subsidie-ontvanger niet heeft
      voldaan aan ingevolge de subsidieverlening voor hem geldende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#Artikel21
  - number: '22'
    text: >-
      Onze Minister geeft de beschikking tot vaststelling van het bedrag van de subsidie binnen dertien weken na
      ontvangst van de aanvraag daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken. Indien
      de beschikking niet binnen dertien weken kan worden gegeven, stelt Onze Minister de betrokkene daarvan in kennis en
      noemt hij daarbij een redelijke termijn waarop de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#Artikel22
  - number: '23'
    text: |-
      Tot het tijdstip waarop de [Kaderwet EZ-subsidies][ref1] in werking treedt gelden de volgende bepalingen:

      a. artikel 1, eerste lid, onder *e*, van dit besluit is niet van toepassing;

      b. de artikelen 4:25, tweede en derde lid, 4:30, 4:31, 4:35, eerste lid en tweede lid, aanhef en onder *a*, 4:36,
      4:37, 4:40, 4:44, derde en vierde lid, 4:45, 4:46, eerste lid, tweede lid, aanhef en onder *a* en *d*, en derde
      lid, en 4:47 van de [Algemene wet bestuursrecht][ref2] zijn van toepassing;

      c. [artikel 7 van de Kaderwet EZ-subsidies][ref3] is van toepassing;

      d. [artikel 8 van de Kaderwet EZ-subsidies][ref4] en [afdeling 5.2 van de Algemene wet bestuursrecht][ref5] zijn
      van toepassing.


