preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Economische Zaken van 13 augustus 1996, nr. 96046195 WJA/JZ;


    Gelet op artikel 2 van de Kaderwet verstrekking financiële middelen EZ;


    De Raad van State gehoord (advies van 17 oktober 1996, nr. W10.96.0362);


    Gezien het nader rapport van Onze voornoemde minister van 4 december 1996, nr. 96075683 WJA/JZ;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:


      a. samenwerkingsproject: een voor Nederland nieuwe, planmatige activiteit, bestaande uit fundamenteel onderzoek,
      industrieel onderzoek of pre-concurrentiële ontwikkeling;


      b. fundamenteel onderzoek: het uitbreiden van de algemene wetenschappelijke en technische kennis, zonder
      industriële of commerciële doelstellingen;


      c. industrieel onderzoek: het opdoen van nieuwe kennis met het doel deze te gebruiken bij de ontwikkeling
      van nieuwe producten, processen of diensten of om bestaande producten, processen of diensten aanmerkelijk te
      verbeteren;


      d. pre-concurrentiële ontwikkeling: het omzetten van de resultaten van industrieel onderzoek in plannen, schema’s
      of ontwerpen voor nieuwe, gewijzigde of verbeterde producten, processen of diensten;


      e. ondernemer: een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht
      is ingesteld, die een onderneming in stand houdt, niet zijnde een onderneming die bij regeling van Onze Minister
      is uitgesloten;


      f. samenwerkingsverband: een geen rechtspersoonlijkheid bezittend verband, bestaande uit ten minste twee, niet in
      een groep verbonden natuurlijke personen of rechtspersonen, onder wie ten minste één ondernemer;


      g. groep: een economische eenheid, waarin organisatorisch zijn verbonden:


      1°. een natuurlijke persoon of privaatrechtelijke rechtspersoon, die direct of indirect:


      – meer dan de helft van het geplaatste kapitaal verschaft aan,


      – volledig aansprakelijk vennoot is van of


      – overwegende zeggenschap heeft over


      een of meer rechtspersonen of vennootschappen, en


      2°. laatstbedoelde rechtspersonen of vennootschappen;


      h. kennisinstituut: een universiteit of een geheel of gedeeltelijk door de rijksoverheid gefinancierde
      onderzoeksinstelling.


      2 Onze Minister kan bij ministeriële regeling activiteiten aanwijzen die niet tot een samenwerkingsproject worden
      gerekend.
    url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#Artikel1
  - number: '2'
    text: >-
      1 Onze Minister verstrekt op aanvraag een subsidie aan:


      a. de deelnemers in een samenwerkingsverband die voor gezamenlijke rekening en risico een samenwerkingsproject
      uitvoeren of


      b. een ondernemer die voor eigen rekening en risico een samenwerkingsproject uitvoert:


      1°. waarvan een deel van de activiteiten wordt uitbesteed aan andere natuurlijke personen of rechtspersonen, die
      niet met hem in een groep, commanditaire vennootschap, vennootschap onder firma of maatschap zijn verbonden, of


      2°. in samenhang met activiteiten die worden uitgevoerd door een of meer natuurlijke personen of rechtspersonen die
      niet in Nederland gevestigd zijn en die niet met hem in een groep, commanditaire vennootschap, vennootschap onder
      firma of maatschap zijn verbonden.


      2 Indien de aanvragers deelnemers in een samenwerkingsverband zijn wordt de subsidie verstrekt aan de deelnemers
      gezamenlijk en betaald aan de deelnemer die als indiener van de aanvraag om subsidie in de zin van dit besluit
      is opgetreden.


      3 Geen subsidie wordt verstrekt, indien voor het samenwerkingsproject reeds door Onze Minister subsidie is
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#Artikel2
  - number: '3'
    text: >-
      1 De subsidie bedraagt 25 procent van de projectkosten, indien het samenwerkingsproject uitsluitend bestaat uit
      preconcurrentiële ontwikkeling, of bestaat uit zowel preconcurrentiële ontwikkeling als fundamenteel of industrieel
      onderzoek, maar niet meer dan een bij regeling van Onze Minister per categorie samenwerkingsprojecten vast te
      stellen bedrag.


      2 De subsidie bedraagt 50 procent van de projectkosten, indien het samenwerkingsproject uitsluitend bestaat
      uit fundamenteel of industrieel onderzoek, maar niet meer dan een bij regeling van Onze Minister per categorie
      samenwerkingsprojecten vast te stellen bedrag.


      3 De in het eerste en tweede lid genoemde percentages worden verhoogd met 10 procent, indien subsidie verstrekt
      wordt aan deelnemers in een samenwerkingsverband:


      a. voor zover de projectkosten worden gemaakt en betaald door een deelnemer die:


      1°. een ondernemer is die een kleine of middelgrote onderneming in stand houdt in de zin van [verordening (EG) nr.
      70/2001](32001R0070) van de Commissie van de Europese Gemeenschappen van 12 januari 2001 betreffende de toepassing
      van de artikelen 87 en 88 van het EG-Verdrag op staatssteun voor kleine en middelgrote ondernemingen (PbEG L 70);


      2°. een kennisinstituut is, of


      b. indien ten minste één deelnemer in een andere lidstaat van de Europese Unie dan Nederland is gevestigd en niet
      behoort tot een groep van een in Nederland gevestigde deelnemer.


      4 Indien ter zake van de projectkosten of een deel daarvan reeds door een ander bestuursorgaan of de Commissie van
      de Europese Gemeenschappen subsidie is verstrekt, wordt slechts een zodanig bedrag aan subsidie verstrekt, dat het
      totale bedrag aan subsidie niet meer bedraagt dan het ingevolge het eerste, tweede of derde lid geldende percentage
      van de projectkosten.
    url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#Artikel3
  - number: '4'
    text: |-
      Als projectkosten worden uitsluitend in aanmerking genomen:

      a. de volgende rechtstreeks aan de uitvoering van het samenwerkingsproject toe te rekenen, na de indiening van de
      aanvraag door de subsidie-ontvanger gemaakte en betaalde kosten:

      1°. loonkosten, met dien verstande dat wordt uitgegaan van een uurloon, berekend op basis van het jaarloon bij een
      volledige dienstbetrekking volgens de kolom «loon voor de loonbelasting» van de loonstaat van het betrokken directe
      personeel, verhoogd met de wettelijke dan wel de op grond van een individuele of collectieve arbeidsovereenkomst
      verschuldigde opslagen voor sociale lasten, en van 1750 productieve uren per jaar;

      2°. kosten van aangeschafte machines en apparatuur, met dien verstande dat wordt uitgegaan van de aan het
      samenwerkingsproject toe te rekenen afschrijvingskosten, berekend op basis van de historische aanschafprijzen en
      de door de belastingdienst geaccepteerde afschrijvingstermijnen, met uitzondering van mogelijkheden tot vervroegde
      afschrijving, of lease-termijnen, met uitzondering van financieringskosten, en gebaseerd op de bedrijfseconomische
      levensduur;

      3°. kosten van verbruikte materialen en hulpmiddelen, gebaseerd op historische aanschafprijzen;

      4°. andere aan derden verschuldigde kosten, met uitzondering van binnenlandse reis- en verblijfkosten;

      b. een opslag voor algemene kosten, groot 50 procent van [de onder a][ref1], [onder 1°][ref2], bedoelde kosten.

      2 Voor kennisinstituten wordt, in afwijking van het eerste lid, onder a, onder 1°, uitgegaan van 1400 productieve
      uren per jaar.

      3 Kosten van machines en apparatuur die niet uitsluitend voor het samenwerkingsproject zijn aangeschaft, worden
      slechts als projectkosten op de voet van het eerste lid, onder a, onder 2°, in aanmerking genomen, indien een
      door middel van een sluitende tijdschrijving vastgestelde urenverantwoording per machine respectievelijk van de
      apparatuur aanwezig is.

      4 Indien geen loonkosten als bedoeld in het eerste lid, onder a, onder 1°, worden gemaakt, maar niettemin arbeid
      ten behoeve van het samenwerkingsproject wordt verricht, wordt voor de berekening van de projectkosten uitgegaan
      van een bij regeling van Onze Minister vast te stellen uurtarief.

      5 Voor de toepassing van het eerste lid worden winstopslagen bij transacties binnen een groep alleen in aanmerking
      genomen voor zover het gebruikelijk is die winstopslagen ook bij soortgelijke transacties buiten de groep in
      rekening te brengen.

      6 De kosten worden in aanmerking genomen met inbegrip van omzetbelasting, indien de subsidie-ontvanger die de
      kosten heeft gemaakt omzetbelasting niet in aftrek kan brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0008404#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008404#Artikel4
