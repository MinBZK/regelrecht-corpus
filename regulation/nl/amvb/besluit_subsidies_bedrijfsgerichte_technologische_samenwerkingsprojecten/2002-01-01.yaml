    text: |-
      1 Een aanvraag wordt ingediend gelijktijdig met het uitbrengen van een verslag als bedoeld in
      [artikel 15, eerste lid][ref1].

      2 De aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat door Onze
      Minister wordt vastgesteld. Onze Minister kan bij ministeriële regeling hiervan vrijstelling verlenen.


