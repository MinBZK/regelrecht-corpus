  - number: '5'
    text: >-
      1 Er is een Adviescommissie technologische samenwerkingsprojecten, die tot taak heeft Onze Minister op zijn verzoek
      te adviseren omtrent aanvragen om een subsidie op grond van dit besluit.


      2 De adviezen van de commissie gaan vergezeld van een deugdelijke motivering.


      3 De commissie bestaat uit een voorzitter en ten minste acht en ten hoogste vijfendertig andere leden. De leden
      zijn deskundig op het terrein waarop de commissie een taak heeft en zijn geen ambtenaren, werkzaam bij het
      Ministerie van Economische Zaken.


      4 De voorzitter en de leden worden door Onze Minister voor een termijn van ten hoogste drie jaar benoemd. Ze zijn
      te allen tijde opnieuw benoembaar.


      5 Onze Minister kan deelcommissies instellen en leden van de commissie benoemen in deelcommissies.


      6 De commissie stelt haar eigen werkwijze schriftelijk vast.


      7 Een lid van de commissie neemt niet deel aan de voorbereiding en vaststelling van een advies, indien hij een
      persoonlijk belang heeft bij de beschikking op een aanvraag.


      8 Onze Minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van de commissie bij te wonen.


      9 In het secretariaat van de commissie wordt door Onze Minister voorzien.


      10 Het beheer van de bescheiden betreffende de werkzaamheden van de commissie geschiedt op overeenkomstige wijze
      als bij het Ministerie van Economische Zaken. De bescheiden worden na beëindiging van de werkzaamheden van de
      commissie opgeborgen in het archief van dat ministerie.


      11 De commissie verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde
      inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.


      12 De commissie stelt jaarlijks voor 1 april een verslag op van haar werkzaamheden in het afgelopen kalenderjaar.
      Op verzoek van Onze Minister, maar ten minste elk vierde jaar, stelt de commissie tevens een evaluatieverslag op,
      waarin zij aandacht besteedt aan de doelmatigheid en doeltreffendheid van haar taakvervulling. Het jaarverslag en
      het evaluatieverslag worden aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#Artikel5
  - number: '6'
    text: >-
      1 Onze Minister stelt bij ministeriële regeling perioden vast, na afloop waarvan de aanvragen die in die periode
      zijn ontvangen en voldoen aan de wettelijke voorschriften, worden behandeld.


      2 Onze Minister stelt voorts bij ministeriële regeling een subsidieplafond vast voor het verlenen van subsidies
      op in een periode ontvangen aanvragen. Daarbij kan hij afzonderlijke subsidieplafonds vaststellen voor bepaalde
      categorieën aanvragers en voor bepaalde categorieën projecten.
    url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#Artikel6
  - number: '7'
    text: >-
      1 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat
      door Onze Minister wordt vastgesteld. Onze Minister kan bij ministeriële regeling hiervan vrijstelling verlenen.


      2 De aanvraag gaat vergezeld van een projectplan voor het samenwerkingsproject en van een overeenkomst, waarin de
      samenwerking tussen de deelnemers in het samenwerkingsverband dan wel de uitbesteding van activiteiten is geregeld
      alsmede van andere bescheiden, overeenkomstig hetgeen in het formulier is vermeld.


      3 Indien de aanvraag een project betreft dat wordt uitgevoerd door een samenwerkingsverband, dient een in het
      samenwerkingsverband deelnemende ondernemer de aanvraag mede namens de andere deelnemers in.
    url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#Artikel7
  - number: '8'
    text: |-
      Onze Minister geeft op een aanvraag een beschikking binnen vier maanden na afloop van de in [artikel 6][ref1]
      bedoelde periode. Indien de beschikking niet binnen vier maanden kan worden gegeven, stelt Onze Minister de
      aanvrager daarvan in kennis en noemt hij daarbij een redelijke termijn waarop de beschikking wel tegemoet kan
      worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0008404#Artikel6
    url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008404
        artikel: '6'
        paragraaf: '2'
  - number: 8a
    text: |-
      1 Indien de aanvraag een project betreft dat wordt uitgevoerd door een samenwerkingsverband, waarop niet
      met toepassing van de [artikelen 9][ref1] of [11][ref2] afwijzend wordt beslist, vermeldt de beschikking tot
      subsidieverlening een raming van de projectkosten per deelnemer in het samenwerkingsverband.

      2 Elke deelnemer in het samenwerkingsverband is tot ten hoogste het naar rato van de voor hem geraamde
      projectkosten berekende bedrag aansprakelijk voor terugbetaling van de subsidie, voor zover de subsidie-ontvangers
      daartoe verplicht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008404#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008404#Artikel11
    url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#Artikel8a
