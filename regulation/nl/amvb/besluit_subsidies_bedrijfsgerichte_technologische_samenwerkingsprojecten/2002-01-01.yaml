        artikel: '9'
        paragraaf: '2'
  - number: '11'
    text: >-
      1 Onze Minister beslist afwijzend op een aanvraag indien de Adviescommissie technologische samenwerkingsprojecten
      een negatief advies heeft uitgebracht.


      2 Onze Minister verdeelt het beschikbare bedrag in de volgorde van rangschikking van de aanvragen door de
      commissie.


      3 Onze Minister kan afwijken van het eerste en tweede lid, indien een advies van de commissie in strijd is met dit
      besluit dan wel niet op zorgvuldige wijze tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#Artikel11
  - number: '12'
    text: |-
      1 Aan de subsidieverlening zijn voor alle subsidie-ontvangers de in [de artikelen 13 tot en met 16][ref1] opgenomen
      verplichtingen verbonden, met dien verstande dat de in [artikel 15][ref2] opgenomen verplichtingen slechts gelden
      voor de subsidie-ontvanger die als indiener van de aanvraag om subsidie in de zin van dit besluit is opgetreden.

      2 De in de [artikelen 13][ref3], [14][ref4] en [15][ref5] opgenomen verplichtingen gelden tot de dag waarop de
      subsidie wordt vastgesteld. De in artikel 16 opgenomen verplichtingen gelden totdat vijf jaren na die dag zijn
      verstreken.


