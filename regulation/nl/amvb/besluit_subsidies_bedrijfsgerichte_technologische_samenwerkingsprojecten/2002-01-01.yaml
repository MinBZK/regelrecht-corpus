        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008404
        artikel: '11'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 Onze Minister beslist in ieder geval afwijzend op een aanvraag:

      a. indien de aanvraag niet voldoet aan dit besluit en de daarop berustende bepalingen;

      b. indien hij de projectkosten raamt op minder dan een bij regeling van Onze Minister vastgesteld bedrag;

      c. indien subsidieverlening in strijd zou zijn met bij regeling van Onze Minister vastgestelde regels omtrent een
      evenwichtige spreiding over grotere en kleinere ondernemingen van de deelnemers in een samenwerkingsverband dan wel
      betrokkenen bij een samenwerkingsproject als bedoeld in [artikel 2, eerste lid, onder ][ref1];

      d. indien hij het onaannemelijk acht, dat het project binnen vier jaren kan worden uitgevoerd;

      e. indien gegronde vrees bestaat dat de betrokkenen het project niet kunnen financieren;

      f. voorzover subsidieverlening in strijd zou zijn met bij regeling van Onze Minister vastgestelde regels omtrent de
      mate waarin aan aanvragers meerdere malen subsidie kan worden verleend op grond van dit besluit.

      2 Onze Minister kan, indien vooralsnog onvoldoende vertrouwen bestaat in de technische haalbaarheid van een
      samenwerkingsproject, de aanvraag gedeeltelijk afwijzen, met dien verstande dat subsidie wordt verleend ter
      zake van de projectkosten verbonden aan de uitvoering van een eerste fase van het project, gedurende een in de
      beschikking tot subsidieverlening te vermelden periode.


      [ref1]: https://wetten.overheid.nl/BWBR0008404#Artikel2
    url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008404
        artikel: '2'
        paragraaf: '1'
  - number: '10'
    text: |-
      1 Onze Minister wint omtrent de aanvragen waarop niet met toepassing van [artikel 9, eerste lid][ref1], afwijzend
      wordt beslist het advies in van de Adviescommissie technologische samenwerkingsprojecten.

      2 De commissie geeft aan Onze minister in ieder geval een negatief advies:

      a. indien onvoldoende vertrouwen bestaat in de technische en economische haalbaarheid van het project;

      b. indien onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben om het project naar behoren uit
      te voeren;

      c. indien van het project onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn.

      3 De commissie rangschikt per groep van aanvragen waarvoor een subsidieplafond geldt de aanvragen waaromtrent zij
      positief adviseert zodanig, dat een project hoger gerangschikt wordt naar mate het meer bijdraagt aan bij regeling
      van Onze Minister vast te stellen doelstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008404#Artikel9
    url: https://wetten.overheid.nl/BWBR0008404/2002-01-01#Artikel10
    references:
      - id: ref1
