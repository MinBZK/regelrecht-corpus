    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel1
  - number: 1.1.gg
    text: |-
      praktisch opleidingsdeel: de periode of perioden waarin de aspirant de politietaak bij een regionaal politiekorps
      of bij het Korps landelijke politiediensten uitvoert in het kader van de initiële opleiding.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit wordt onder echtgenote of echtgenoot mede verstaan de geregistreerde partner
      alsmede de levenspartner met wie de niet-gehuwde ambtenaar samenwoont – en met het oogmerk duurzaam samen te leven
      – een gemeenschappelijke huishouding voert op basis van een notarieel verleden samenlevingscontract bevattende
      de wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding. Onder
      weduwe of weduwnaar wordt mede begrepen de achtergebleven geregistreerde partner alsmede de achtergebleven
      partner. Tot gezinslid wordt in voorkomend geval mede gerekend de geregistreerde partner alsmede de levenspartner.
      Tegelijkertijd kan slechts een persoon als echtgenoot of echtgenote dan wel weduwe of weduwnaar worden aangemerkt.
      Het bevoegd gezag kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt
      dat een samenlevingscontract als bedoeld in de eerste volzin is gesloten.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel1
  - number: '2.1'
    text: De aanstelling geschiedt in tijdelijke of in vaste dienst.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel2
  - number: '2.2'
    text: Een aanstelling in tijdelijke dienst geschiedt voor bepaalde of voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel2
  - number: 2a.1
    text: |-
      Indien betrokkene direct voorafgaand aan de aanstelling nog geen ambtenaar in de zin van dit besluit was, kan op
      zijn aanvraag en na consultatie van de ondernemingsraad in zeer bijzondere gevallen een aanstelling in tijdelijke
      dienst voor bepaalde tijd plaatsvinden waarbij dit besluit gedeeltelijk, of andere algemene maatregelen van
      bestuur als bedoeld in [artikel 50, eerste lid, van de Politiewet 1993][ref1], die specifiek betrekking hebben op
      ambtenaren in de zin van dit besluit, geheel of gedeeltelijk, buiten toepassing kunnen worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel50
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '50'
  - number: 2a.2
    text: |-
      Onverminderd het eerste lid, bedraagt de aanspraak op vakantie ten minste 144 uur per kalenderjaar bij een
      volledige betrekking en naar evenredigheid bij een andere betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel2a
  - number: 2a.3
    text: |-
      De aanstelling in tijdelijke dienst, bedoeld in het eerste lid, geschiedt voor een periode van ten hoogste drie
      jaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel2a
  - number: 2a.4
    text: Onze Minister kan nadere regels stellen omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel2a
  - number: 2b.1
    text: |-
      Indien betrokkene direct voorafgaand aan de aanstelling nog geen ambtenaar in de zin van dit besluit was
      en hij krachtens de [artikelen 25][ref1], [42, eerste lid][ref2], en [52 van de Politiewet 1993][ref3] bij
      koninklijk besluit wordt benoemd, kan op zijn aanvraag aanstelling plaatsvinden in tijdelijke dienst voor
      bepaalde tijd waarbij dit besluit gedeeltelijk, of andere algemene maatregelen van bestuur als bedoeld in
      [artikel 50, eerste lid, van de Politiewet 1993][ref4], die specifiek betrekking hebben op ambtenaren in de
      zin van dit besluit, geheel of gedeeltelijk, buiten toepassing kunnen worden verklaard. Na benoeming wordt aan
      de ondernemingsraad gemotiveerd aangegeven dat bij het werven zowel de interne als de externe arbeidsmarkt in
      ogenschouw is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel52
      [ref4]: https://wetten.overheid.nl/BWBR0006299#Artikel50
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0006299
        artikel: '52'
      - id: ref4
        bwb_id: BWBR0006299
        artikel: '50'
  - number: 2b.2
    text: |-
      Onverminderd het eerste lid, bedraagt de aanspraak op vakantie ten minste 144 uur per kalenderjaar bij een
      volledige betrekking en naar evenredigheid bij een andere betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel2b
  - number: 2b.3
    text: |-
      De aanstelling in tijdelijke dienst, bedoeld in het eerste lid, geschiedt voor een periode van ten hoogste zeven
      jaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel2b
  - number: 2b.4
    text: Onze Minister kan nadere regels stellen omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel2b
  - number: '3.1'
    text: |-
      De aanstelling van de aspirant geschiedt in tijdelijke dienst voor de duur van de initiële opleiding met een
      maximum van twee jaar. In bijzondere gevallen kan de maximale duur van de aanstelling in tijdelijke dienst op
      aanvraag van de aspirant of ambtshalve worden verlengd met een periode van maximaal één jaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel3
  - number: '3.2'
    text: |-
      Indien de aspirant voldoet aan de gestelde kwalificatie-eisen, wordt hij aansluitend aan de aanstelling in
      tijdelijke dienst, bedoeld in het eerste lid, aangesteld in tijdelijke dienst voor een proeftijd van één jaar,
      op aanvraag van de aspirant in bijzondere gevallen te verlengen of zonodig ambtshalve te verlengen met de tijd
      gedurende welke de ambtenaar de proeftijd niet in werkelijke dienst heeft doorgebracht.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel3
  - number: '3.3'
    text: |-
      Na afloop van de proeftijd, bedoeld in het tweede lid, vindt aanstelling in vaste dienst plaats, tenzij tegen een
      aanstelling in vaste dienst bedenkingen bestaan.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel3
  - number: '3.4'
    text: |-
      In afwijking van het derde lid kan een aanstelling van een ambtenaar, aangesteld voor de uitvoering van de
      politietaak, die de initiële opleiding alsmede de daarop volgende proeftijd heeft voltooid, in tijdelijke dienst
      plaatsvinden:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel3
  - number: 3.4.a
    text: ter vervanging van een wegens ziekte of uit anderen hoofde afwezige ambtenaar,
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel3
  - number: 3.4.b
    text: ter uitvoering van werkzaamheden van kennelijk tijdelijk karakter, of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel3
  - number: 3.4.c
    text: |-
      indien toepassing wordt gegeven aan [artikel 4a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 4a
        hoofdstuk: II
  - number: '3.5'
    text: |-
      Zodra de omstandigheid die leidde tot een aanstelling in tijdelijke dienst als bedoeld in het vierde lid,
      onderdelen a en b, zich niet meer voordoet, wordt de desbetreffende ambtenaar zo mogelijk in vaste dienst
      aangesteld.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel3
  - number: '3.6'
    text: |-
      In het geval, bedoeld in het vierde lid, onderdeel b, wordt in ieder geval aangenomen dat de omstandigheid die
      leidde tot aanstelling in tijdelijke dienst zich niet meer voordoet, wanneer de ambtenaar sinds twee jaar zonder
      onderbreking van langer dan één maand in politiedienst, waarvan laatstelijk gedurende ten minste één jaar in zijn
      huidige betrekking, in dienst is. Dit geldt echter niet in die gevallen waarin vaststaat dat zijn werkzaamheden in
      de door hem vervulde betrekking binnen het jaar zullen worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel3
  - number: '3.7'
    text: |-
      Bij ministeriële regeling worden criteria gegeven op grond waarvan de in het zesde lid genoemde periode van twee
      jaar kan worden verlengd tot vijf jaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel3
  - number: 3a
    text: |-
      Na het voltooien van de initiële opleiding wordt de aspirant aangesteld als ambtenaar voor de uitvoering van de
      politietaak.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel3a
  - number: '4.1'
    text: |-
      Een aanstelling van een ambtenaar, aangesteld voor de uitvoering van technische, administratieve en andere taken
      ten dienste van de politie kan in tijdelijke dienst plaatsvinden
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel4
  - number: 4.1.a
    text: |-
      voor een proeftijd van één jaar, zonodig in bijzondere gevallen op aanvraag van de ambtenaar met één jaar te
      verlengen en zonodig ambtshalve te verlengen met de tijd, gedurende welke de ambtenaar de proeftijd niet in
      werkelijke dienst heeft doorgebracht;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel4
  - number: 4.1.b
    text: ter vervanging van een wegens ziekte of uit anderen hoofde afwezige ambtenaar;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel4
  - number: 4.1.c
    text: ter uitvoering van werkzaamheden van kennelijk tijdelijk karakter;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel4
  - number: 4.1.d
    text: |-
      indien het een ambtenaar betreft die in dienst wordt genomen als leerling ter opleiding tot een functie binnen de
      politie-organisatie dan wel in verband met zijn verdere praktische opleiding of vorming,
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel4
  - number: 4.1.e
    text: indien een wijziging in de taak van het betrokken dienstvak is voorgenomen, of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel4
  - number: 4.1.f
    text: |-
      indien toepassing wordt gegeven aan [artikel 4a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 4a
        hoofdstuk: II
  - number: '4.2'
    text: |-
      Zodra de omstandigheid die leidde tot een aanstelling in tijdelijke dienst als bedoeld in het eerste lid,
      onderdelen a tot en met e, zich niet meer voordoet, wordt de desbetreffende ambtenaar zo mogelijk in vaste dienst
      aangesteld.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel4
  - number: '4.3'
    text: |-
      In de gevallen, bedoeld in het eerste lid, onderdelen c en e, wordt in ieder geval aangenomen dat de omstandigheid
      die leidde tot een aanstelling in tijdelijke dienst zich niet meer voordoet, wanneer de ambtenaar sinds twee
      jaar zonder onderbreking van langer dan één maand in politiedienst, waarvan laatstelijk gedurende ten minste één
      jaar in zijn huidige betrekking, in dienst is. Dit geldt echter niet in die gevallen waarin vaststaat dat zijn
      werkzaamheden in de door hem vervulde betrekking binnen het jaar zullen worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel4
  - number: '4.4'
    text: |-
      Bij ministeriële regeling worden criteria gegeven op grond waarvan de in het derde lid genoemde periode van twee
      jaar kan worden verlengd tot vijf jaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel4
  - number: '5'
    text: De bijzondere ambtenaar van politie wordt in vaste dienst aangesteld.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel5
  - number: '7.1'
    text: |-
      Voor de aanstelling als aspirant, ambtenaar, aangesteld voor de uitvoering van de politietaak, en bijzondere
      ambtenaar van politie komt uitsluitend in aanmerking degene die:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel7
  - number: 7.1.a
    text: Nederlander is;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel7
  - number: 7.1.b
    text: de door Onze Minister vast te stellen minimum leeftijd heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel7
  - number: 7.1.c
    text: |-
      voldoet aan bij regeling van Onze Minister te stellen eisen met betrekking tot het
      opleidingsniveau, de psychologische keuring en een geneeskundige keuring als bedoeld in
      [artikel 1, onder a, van de Wet op de medische keuringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel1
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '1'
  - number: 7.1.d
    text: voldoet aan overige bij regeling van Onze Minister te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel7
  - number: '7.2'
    text: |-
      Teneinde vast te stellen of de persoon, bedoeld in de aanhef van het eerste lid, in voldoende mate geschikt en
      bekwaam is voor de vervulling van de functie, kan het bevoegd gezag de gegevens die door de betrokkene desgevraagd
      zijn verstrekt, verifiëren en zo nodig aanvullen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel7
  - number: '7.3'
    text: |-
      Onze Minister van Justitie kan ten aanzien van de aanstelling als bijzondere ambtenaar van politie nadere regels
      vaststellen over het aantal dienstjaren dat deze ambtenaar werkzaam moet zijn geweest als ambtenaar, aangesteld
      voor de uitvoering van de politietaak.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel7
  - number: '7.4'
    text: |-
      De betrokkene, die op grond van het eerste lid, onderdeel c, is onderworpen aan een geneeskundige keuring, wordt
      bij aanstelling in een andere functie opnieuw aan een geneeskundige keuring onderworpen, indien betrokkene voor het
      vervullen van die functie aan andere medische eisen dient te voldoen dan voor de tot dusverre vervulde functie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel7
  - number: '8.1'
    text: |-
      Voor de aanstelling als ambtenaar, aangesteld voor de uitvoering van technische, administratieve en andere taken
      ten dienste van de politie komt in aanmerking degene die:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8
  - number: 8.1.a
    text: voldoet aan door het bevoegd gezag te stellen eisen met betrekking tot het opleidingsniveau;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8
  - number: 8.1.b
    text: |-
      voldoet aan door het bevoegd gezag te stellen eisen met betrekking tot een psychologische keuring, indien daaraan
      naar het oordeel van het bevoegd gezag behoefte bestaat;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8
  - number: 8.1.c
    text: |-
      voldoet aan door het bevoegd gezag te stellen eisen met betrekking tot een geneeskundige keuring als bedoeld in
      [artikel 1, onder a, van de Wet op de medische keuringen][ref1], indien aan de vervulling van de functie bijzondere
      eisen op het punt van de medische geschiktheid moeten worden gesteld. Het bevoegd gezag stelt vast voor welke
      functies een onderzoek naar de medische geschiktheid noodzakelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel1
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '1'
  - number: 8.1.d
    text: |-
      voldoet aan overige door het bevoegd gezag te stellen eisen die specifiek gerelateerd zijn aan de functie binnen
      het politiekorps dan wel binnen het LSOP of een voorziening tot samenwerking.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8
  - number: '8.2'
    text: |-
      Teneinde vast te stellen of de persoon, bedoeld in de aanhef van het eerste lid, in voldoende mate geschikt en
      bekwaam is voor de vervulling van de functie, kan het bevoegd gezag de gegevens die door de betrokkene desgevraagd
      zijn verstrekt, verifiëren en zonodig aanvullen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8
  - number: '8.3'
    text: |-
      De betrokkene die op grond van het eerste lid, onderdeel c, is onderworpen aan een geneeskundige keuring, wordt
      bij aanstelling in een andere functie opnieuw aan een geneeskundige keuring onderworpen, indien betrokkene voor het
      vervullen van die functie aan andere medische eisen dient te voldoen dan voor de tot dusverre vervulde functie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8
  - number: 8a.1
    text: |-
      Aanstelling als ambtenaar is slechts mogelijk, indien op grond van een ten aanzien van de betrokkene ingesteld
      onderzoek naar de betrouwbaarheid en geschiktheid geen bezwaar blijkt te bestaan tegen diens aanstelling.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8a
  - number: 8a.2
    text: |-
      Ten behoeve van het onderzoek, bedoeld in het eerste lid, vraagt het bevoegde gezag om verstrekking van justitiële
      gegevens als bedoeld in [artikel 23 van het Besluit justitiële gegevens][ref1] en om verstrekking van gegevens als
      bedoeld in [artikel 14 van het Besluit politieregisters][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004996#Artikel14
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0004996
        artikel: '14'
  - number: 8a.3
    text: 'Het tweede lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8a
  - number: 8a.3.a
    text: |-
      het een aanstelling betreft in een functie waarin technische, administratieve en andere taken ten dienste van
      de politie worden uitgevoerd, in een functie bij het LSOP of een voorziening tot samenwerking als bedoeld in
      [artikel 8, eerste lid][ref1], of als vakantiewerker en het bevoegde gezag heeft bepaald dat voor de functie
      slechts een verklaring omtrent het gedrag als bedoeld in [artikel 28 van de Wet justitiële gegevens][ref2] is
      vereist, of


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 8a.3.b
    text: |-
      het een functie betreft als bedoeld in [artikel 1, eerste lid, onder a, van de Wet veiligheidsonderzoeken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '1'
  - number: 8a.4
    text: |-
      Een onderzoek naar de betrouwbaarheid en geschiktheid wordt ingesteld nadat het bevoegde gezag de betrokkene
      overigens bekwaam en geschikt acht.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8a
  - number: 8b.1
    text: |-
      Indien naar het oordeel van het bevoegd gezag de aard van de functie of van de werkzaamheden hiertoe
      aanleiding geeft, kan ten aanzien van de ambtenaar in de volgende gevallen opnieuw een onderzoek als bedoeld in
      [artikel 8a, eerste lid][ref1], worden uitgevoerd:


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel8a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 8a
        hoofdstuk: II
  - number: 8b.1.a
    text: bij wijziging van werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8b
  - number: 8b.1.b
    text: bij aanstelling in een andere functie;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8b
  - number: 8b.1.c
    text: bij de vervulling van een functie gedurende ten minste vijf dienstjaren, of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8b
  - number: 8b.1.d
    text: |-
      bij een redelijk vermoeden van ernstig plichtsverzuim dat de integriteit of de verantwoordelijkheid van de
      betrokkene raakt.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8b
  - number: 8b.2
    text: |-
      Het eerste lid is niet van toepassing indien het een functie als bedoeld in
      [artikel 1, eerste lid, onder a, van de Wet veiligheidsonderzoeken][ref1], of een functie waarvan het bevoegd gezag
      heeft bepaald dat slechts een verklaring omtrent het gedrag is vereist, betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '1'
  - number: 8c
    text: |-
      Onze Minister stelt nadere regels vast ter uitvoering van het in de [artikelen 8a][ref1] en [8b][ref2] bedoelde
      onderzoek naar de betrouwbaarheid en geschiktheid voor zover ten behoeve van dat onderzoek wordt gevraagd
      om verstrekking van justitiële gegevens als bedoeld in artikel 23 van het Besluit justitiële gegevens en om
      verstrekking van gegevens als bedoeld in [artikel 14 van het Besluit politieregisters][ref3]. Deze nadere
      regels bevatten in ieder geval waarborgen omtrent een voldoende bescherming van de persoonlijke levenssfeer van
      betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel8b
      [ref3]: https://wetten.overheid.nl/BWBR0004996#Artikel14
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 8a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 8b
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004996
        artikel: '14'
  - number: '9.1'
    text: |-
      Voor de aanvaarding van zijn ambt legt de aspirant, de ambtenaar, aangesteld voor de uitvoering van de politietaak
      en de bijzondere ambtenaar van politie de volgende eed dan wel verklaring en belofte van zuivering af: «Ik zweer
      (verklaar), dat ik middellijk of onmiddellijk, in welke vorm dan ook, tot het verkrijgen van mijn aanstelling aan
      niemand iets heb gegeven of beloofd. Ik zweer (beloof), dat ik, om iets in mijn betrekking te doen of te laten, van
      niemand, middellijk of onmiddellijk, enige beloften of geschenken zal aannemen. Zo waarlijk helpe mij God almachtig
      (Dat verklaar en beloof ik)!». Daarna wordt door de aspirant, de politieambtenaar en de bijzondere ambtenaar van
      politie de volgende eed of belofte afgelegd: «Ik zweer (beloof) trouw aan de Koning, aan de Grondwet en aan de
      wetten van ons land. Ik zweer (beloof) dat ik de krachtens de wet uitgevaardigde voorschriften en verordeningen
      zal nakomen en handhaven, dat ik de aan mij verstrekte opdrachten plichtsgetrouw en nauwgezet zal volbrengen
      en de zaken, waarvan ik door mijn ambt kennis draag en die mij als geheim zijn toevertrouwd, of waarvan ik het
      vertrouwelijke karakter moet begrijpen, niet zal openbaren aan anderen dan aan hen, aan wie ik volgens de wet
      of ambtshalve tot mededeling verplicht ben. Ik zweer (beloof) dat ik mij zal gedragen zoals een goed ambtenaar
      betaamt, dat ik zorgvuldig, onkreukbaar en betrouwbaar zal zijn en dat ik niets zal doen dat het aanzien van het
      ambt zal schaden. Zo waarlijk helpe mij God almachtig (Dat beloof ik)!»
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel9
  - number: '9.2'
    text: |-
      Voor de aanvaarding van zijn ambt, legt de ambtenaar, aangesteld voor de uitvoering van technische, administratieve
      en andere taken ten dienste van de politie de volgende eed dan wel verklaring en belofte van zuivering af: «Ik
      zweer (verklaar) dat ik middellijk of onmiddellijk, in welke vorm dan ook, tot het verkrijgen van mijn aanstelling
      aan niemand iets heb gegeven of beloofd. Ik zweer (beloof), dat ik, om iets in mijn betrekking te doen of te laten,
      van niemand, middellijk of onmiddellijk, enige beloften of geschenken zal aannemen. Zo waarlijk helpe mij God
      almachtig (Dat verklaar en beloof ik)!» Daarna wordt door de ambtenaar de volgende eed of belofte afgelegd: «Ik
      zweer (beloof) trouw aan de Koning, aan de Grondwet en aan de wetten van ons land. Ik zweer (beloof) dat ik de aan
      mij verstrekte opdrachten plichtsgetrouw en nauwgezet zal volbrengen en de zaken, waarvan ik door mijn ambt kennis
      draag en die mij als geheim zijn toevertrouwd of waarvan ik het vertrouwelijke karakter moet begrijpen, niet zal
      openbaren aan anderen dan aan hen, aan wie ik volgens de wet of ambtshalve tot mededeling verplicht ben. Ik zweer
      (beloof) dat ik mij zal gedragen zoals een goed ambtenaar betaamt, dat ik zorgvuldig, onkreukbaar en betrouwbaar
      zal zijn en dat ik niets zal doen dat het aanzien van het ambt zal schaden. Zo waarlijk helpe mij God almachtig
      (Dat beloof ik)!».
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel9
  - number: '9.3'
    text: |-
      De korpschef van een regionaal korps of van het Korps landelijke politiediensten, legt de eden dan wel verklaringen
      en beloften af ten overstaan van de commissaris van de Koning respectievelijk van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel9
  - number: '9.4'
    text: |-
      De ambtenaren, bedoeld in [artikel 10, eerste lid, onderdeel a, van de Wet op het LSOP en het politieonderwijs][ref1],
      leggen de eden dan wel de verklaringen en beloften af ten overstaan van de voorzitter van de raad van toezicht van
      het LSOP.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel10
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '10'
  - number: '9.5'
    text: |-
      De bijzondere ambtenaren van politie leggen de eden dan wel verklaringen en beloften af ten overstaan van Onze
      Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel9
  - number: '9.6'
    text: |-
      De overige ambtenaren, aangesteld voor de uitvoering van de politietaak en de overige ambtenaren, aangesteld voor
      de uitvoering van technische, administratieve en andere taken ten dienste van de politie, leggen de eden dan wel
      verklaringen en beloften af ten overstaan van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel9
  - number: '10.1'
    text: |-
      Aan de ambtenaar wordt, zo mogelijk voor de aanvaarding van zijn ambt, maar in ieder geval binnen een maand na
      aanvang van zijn werkzaamheden, een akte van aanstelling door of vanwege het bevoegd gezag uitgereikt waarin in elk
      geval worden vermeld:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: 10.1.a
    text: de naam, de voornamen en de geboortedatum van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: 10.1.b
    text: |-
      of de aanstelling geschiedt in vaste of in tijdelijke dienst al dan niet met een proeftijd en de duur van de
      eventuele proeftijd, waarbij, indien de aanstelling geschiedt in tijdelijke dienst, bovendien in de akte wordt
      vermeld of de aanstelling geschiedt voor bepaalde tijd en, zo ja, voor hoe lang - of voor onbepaalde tijd en de
      toepasselijke grond voor aanstelling in tijdelijke dienst.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: 10.1.c
    text: de functie waarin de ambtenaar wordt aangesteld;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: 10.1.d
    text: de plaats of de plaatsen van tewerkstelling en het werkgebied;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: 10.1.e
    text: de datum van ingang van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: 10.1.f
    text: voor zover van toepassing, de rang waarin hij wordt aangesteld;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: 10.1.g
    text: |-
      de salarisschaal en de voor de bepaling van die schaal in acht genomen regels, alsmede het salarisnummer en het
      salaris die de ambtenaar zijn toegekend of, indien het een aspirant betreft, het salaris;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: 10.1.h
    text: de arbeidstijd die zijn betrekking omvat en
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: 10.1.i
    text: het gegeven dat de eden dan wel de verklaringen en beloften zijn afgelegd, en de datum waarop dit is gebeurd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: 10.1.j
    text: de aanspraak op vakantie of de wijze van berekening van de aanspraak;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: 10.1.k
    text: de duur van de ontslag- respectievelijk opzegtermijnen of de wijze waarop die termijnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: '10.2'
    text: |-
      Indien aan de ambtenaar meerdere plaatsen als plaats van tewerkstelling zijn aangewezen, wordt in de akte van
      aanstelling tevens een hoofdplaats van tewerkstelling vermeld.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: '10.3'
    text: |-
      Indien de ambtenaar is aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste
      van de politie en een door het bevoegd gezag aangewezen functie vervult waaraan volgens door Onze Minister gestelde
      criteria het deelnemerschap in het specifiek deel van het AFUP-opbouwreglement is verbonden, wordt dit in de akte
      van aanstelling vermeld.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: '10.4'
    text: |-
      Voor zover deze gegevens niet reeds in de akte van aanstelling zijn vermeld, deelt het bevoegd gezag de ambtenaar
      zo spoedig mogelijk schriftelijk andere hem mogelijk toegekende voordelen mee, onder verwijzing naar de regeling
      waarop de toekenning berust en de eventuele voorwaarden die aan de toekenning verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: '10.5'
    text: |-
      Indien de aanstelling afloopt voor het einde van de termijn van een maand vanaf het begin van het dienstverband,
      moeten de gegevens, bedoeld in het eerste lid, uiterlijk bij het aflopen van de aanstelling worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: '10.6'
    text: |-
      Wijziging van de gegevens, bedoeld in het eerste lid, wordt de ambtenaar binnen een maand schriftelijk medegedeeld,
      behoudens de wijziging van een algemeen verbindend voorschrift waarnaar is verwezen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel10
  - number: '11.1'
    text: |-
      De ambtenaar wordt bij zijn aanstelling schriftelijk door het bevoegd gezag op de hoogte gesteld van de hoofdlijnen
      van zijn rechtspositie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel11
  - number: '11.2'
    text: |-
      Regelingen waarin zijn rechtspositie is neergelegd, worden op een voor de ambtenaar gemakkelijk toegankelijke
      plaats ter inzage gelegd. Hij kan kosteloos hiervan afschriften maken.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel11
  - number: '11.3'
    text: |-
      De schriftelijk vastgestelde en voor hem geldende regelingen en instructies, die hij bij de vervulling van zijn
      dienst heeft na te leven, worden eveneens op een voor de ambtenaar gemakkelijk toegankelijke plaats ter inzage
      gelegd. Hij kan kosteloos hiervan afschriften maken.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel11
  - number: '11.4'
    text: Over wijzigingen in regelingen betreffende zijn rechtspositie wordt de ambtenaar schriftelijk op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel11
  - number: '12.1'
    text: Het bevoegd gezag stelt de arbeids- en rusttijden vast.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: '12.2'
    text: |-
      Het bevoegd gezag kan in een regeling als bedoeld in [artikel 1:4, eerste lid, van de Arbeidstijdenwet][ref1]
      afspraken maken inzake rusttijd en pauze, de arbeidstijd, arbeid op zondag en arbeid in nachtdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel1
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '1'
  - number: '12.3'
    text: De arbeidstijd bedraagt gemiddeld 36 uur per week.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: '12.4'
    text: |-
      Voor de ambtenaar met een volledige betrekking bedraagt het aantal te werken uren per jaar: het aantal
      kalenderdagen per jaar, verminderd met:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: 12.4.a
    text: het aantal zaterdagen en zondagen, en
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: 12.4.b
    text: |-
      Nieuwjaarsdag, Tweede Paasdag, Hemelvaartsdag, Tweede Pinksterdag, de beide kerstdagen, de dag waarop de verjaardag
      van de Koning wordt gevierd, en 5 mei, dan wel een andere door het bevoegd gezag aangewezen kerkelijke, nationale,
      regionale of plaatselijk erkende feest- of gedenkdag, voor zover deze dagen niet vallen op een zaterdag of een
      zondag, vermenigvuldigd met 7,2.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: '12.5'
    text: Het in het vierde lid berekende product wordt verhoogd met 1%.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: '12.6'
    text: |-
      Voor de ambtenaar met een andere betrekking dan een volledige betrekking bedraagt het aantal te werken uren per
      jaar een evenredig deel van het aantal te werken uren volgens de systematiek van de in het vierde en vijfde lid
      opgenomen berekeningswijze.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: '12.7'
    text: Het aantal te werken uren, bedoeld in het vijfde en zesde lid, wordt rekenkundig op hele uren afgerond.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: '12.8'
    text: |-
      Het bevoegd gezag stelt aan het begin van elk kalenderjaar en halverwege het lopende jaar voor de bij hem werkzame
      ambtenaren een indicatief dienstrooster op waarin voor iedere ambtenaar wordt aangegeven op welke dagen hij zal
      werken en op welke dagen hij vrij zal zijn. Het halfjaarlijkse rooster omvat telkens een periode van 26 weken. De
      ambtenaar kan aan dit indicatieve rooster geen rechten ontlenen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: '12.9'
    text: |-
      Het bevoegd gezag deelt een voor de bij hem werkzame ambtenaren vastgesteld rooster uiterlijk een week voor de
      aanvang van de periode waarop het betrekking heeft, aan de ambtenaar mee.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: '12.10'
    text: |-
      Uiterlijk op de vierde dag, voorafgaande aan die waarop dienst moet worden gedaan, wordt een dagrooster vastgesteld
      en aan de ambtenaar kenbaar gemaakt, waarin is aangegeven welke de tijdstippen zijn van aanvang en einde van de
      dienst. Van de vastgestelde tijdstippen kan uitsluitend worden afgeweken:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: 12.10.a
    text: met instemming van de betrokken ambtenaar of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: 12.10.b
    text: |-
      indien op grond van [artikel 2:5 van de Arbeidstijdenwet][ref1] die wet niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel2
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '2'
  - number: '12.11'
    text: |-
      De dienst voorafgaand aan een vrije dag dient uiterlijk om 23.00 uur te eindigen en na een vrije dag kan de dienst
      niet eerder beginnen dan om 07.00 uur.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: '12.12'
    text: |-
      De ambtenaar heeft in een kalenderjaar recht op tenminste 26 vrije zondagen waarvan 22 aansluitend aan een vrije
      dag, dan wel op tenminste 22 periodes van twee aaneengesloten vrije dagen waarbij de aaneengesloten periode een
      zaterdag of een zondag omvat.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: '12.13'
    text: Onze Minister kan ter uitvoering van dit artikel nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12
  - number: 12a.1
    text: |-
      Op aanvraag van de ambtenaar kent het bevoegd gezag een werktijdenmodaliteit toe, tenzij een zwaarwegend
      dienstbelang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12a
  - number: 12a.2
    text: |-
      Een werktijdenmodaliteit is een patroon van arbeidstijden dat leidt tot een herkenbaar patroon van vrije tijd,
      uitgedrukt in uren of in dagen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12a
  - number: 12a.3
    text: |-
      Indien het bevoegd gezag voornemens is de aanvraag niet of niet volledig in te willigen, vraagt het bevoegd gezag
      binnen vier weken advies van een door Onze Minister in te stellen commissie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12a
  - number: 12a.4
    text: |-
      De commissie wordt paritair samengesteld en brengt binnen zes weken na ontvangst van de adviesaanvraag een
      schriftelijk advies uit aan het bevoegd gezag en aan de betrokken ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel12a
  - number: '13.1'
    text: |-
      Voor de ambtenaar geldt een arbeidstijd van gemiddeld 38 uur per week, tenzij de ambtenaar eenmalig kiest voor de
      volledige betrekking van gemiddeld 36 uur per week.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13
  - number: '13.2'
    text: |-
      De aspirant maakt zijn keuze bij zijn aanstelling op grond van [artikel 3a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel3a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 3a
        hoofdstuk: II
  - number: '13.3'
    text: |-
      Onverminderd het eerste lid is bij een aanvraag tot uitbreiding van de betrekkingsomvang
      [artikel 2, negende lid, van de Wet aanpassing arbeidsduur][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011173#Artikel2
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011173
        artikel: '2'
  - number: 13a.1
    text: Tenzij het dienstbelang zich daartegen verzet, wordt op aanvraag van de ambtenaar
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13a
  - number: 13a.1.a
    text: van 55 jaar en ouder de gemiddelde arbeidstijd per week met 11,1% verminderd;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13a
  - number: 13a.1.b
    text: van 58 jaar en ouder de gemiddelde arbeidstijd per week met 33,3% verminderd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13a
  - number: 13a.2
    text: |-
      Tenzij het dienstbelang zich daartegen verzet, wordt op aanvraag van de ambtenaar de gemiddelde arbeidstijd per
      week voor een lager percentage verminderd dan genoemd in het eerste lid, met dien verstande dat het aantal uren
      waarmee de arbeidstijd wordt verminderd ten minste 2 uren per week bedraagt.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13a
  - number: 13a.3
    text: De ingevolge het eerste en tweede lid verminderde arbeidstijd wordt rekenkundig afgerond.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13a
  - number: 13a.4
    text: De uren waarmee de gemiddelde arbeidstijd per week wordt verminderd, worden aangemerkt als verlof.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13a
  - number: 13a.5
    text: |-
      Over de uren waarmee de gemiddelde arbeidstijd per week wordt verminderd, wordt 50% ingehouden van het door de
      ambtenaar over die uren genoten salaris. De inhouding op het salaris bedraagt 25% indien de ambtenaar, bedoeld in
      het eerste lid, onderdeel b, op 15 maart 1999 ten minste de 49-jarige leeftijd heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13a
  - number: 13a.6
    text: |-
      Bij regeling van Onze Minister worden omtrent de verrekening van extra inkomsten uit arbeid of bedrijf met het
      salaris van de in het eerste en tweede lid bedoelde ambtenaar regels vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13a
  - number: 13b.1
    text: |-
      Op aanvraag van de in de eerste volzin van [artikel 88, eerste lid][ref1], bedoelde ambtenaar die op 15 maart 1999
      ten minste de 49-jarige leeftijd heeft bereikt, verleent het bevoegd gezag non-activiteit, tenzij hier ernstige
      bezwaren voor de bedrijfsvoering uit voortvloeien. Uit fiscale overwegingen maakt het bevoegd gezag bij het
      verlenen van de non-activiteit onderscheid tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '88'
        hoofdstuk: X
  - number: 13b.1.a
    text: |-
      non-activiteit met een op grond van [artikel 38c van de Wet op de loonbelasting 1964][ref1] onbelast non-
      activiteitsinkomen, indien de non-activiteit ingaat vóór 1 januari 2006;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38c
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 38c
  - number: 13b.1.b
    text: |-
      non-activiteit met een op grond van [artikel 32aa van de Wet op de loonbelasting 1964][ref1] belast non-
      activiteitsinkomen, indien de non-activiteit ingaat op of na 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32aa
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32aa
  - number: 13b.2
    text: |-
      De periode van non-activiteit bedraagt ten hoogste 21 maanden op basis van het volgende overzicht:






                    leeftijd:


                    periode:




                    55 jaar


                    1 maand




                    56 jaar


                    2 maanden




                    57 jaar


                    4 maanden




                    58 jaar


                    6 maanden




                    59 jaar


                    8 maanden
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13b
  - number: 13b.3
    text: |-
      De non-activiteit wordt verleend in een aaneengesloten periode direct voorafgaande aan het ontslag op grond van
      [artikel 88, eerste lid][ref1], dan wel direct voorafgaande aan het ontslag voor het bereiken van de 60-jarige
      leeftijd, op grond van [artikel 87a, tweede lid][ref2], en eindigt op de datum dat het ontslag ingaat, dan wel op
      de dag van overlijden.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel87a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '88'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 87a
        hoofdstuk: X
  - number: 13b.4
    text: |-
      De ambtenaar aan wie non-activiteit is verleend, kan tot de datum waarop de non-activiteit zou ingaan hiervan
      geheel of gedeeltelijk afzien, tenzij hier ernstige bezwaren voor de bedrijfsvoering uit voortvloeien. De ambtenaar
      kan geen vergoeding worden toegekend voor de niet genoten periode van non-activiteit.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13b
  - number: 13b.5
    text: |-
      Indien de ambtenaar voorafgaand aan de periode van non-activiteit ongeschikt wordt tot het verrichten van zijn
      arbeid wegens beroepsziekte dan wel ziekte als gevolg van een dienstongeval, dan wordt de periode van non-
      activiteit opgeschort tot de datum waarop de ambtenaar weer in staat is arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13b
  - number: 13b.6
    text: |-
      Onverminderd het negende lid, kan de periode van non-activiteit direct worden voorafgegaan door een aaneengesloten
      periode waarin vakantie of verlof wordt genoten.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13b
  - number: 13b.7
    text: |-
      Tijdens de periode van non-activiteit kan de ambtenaar geen aanvraag doen tot vermindering van de arbeidstijd
      conform [artikel 13a][ref1], dan wel komt de ingevolge [artikel 13a][ref2] verminderde arbeidstijd te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel13a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 13a
        hoofdstuk: III
  - number: 13b.8
    text: Het zevende lid is van overeenkomstige toepassing gedurende de vakantie of het verlof, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13b
  - number: 13b.9
    text: |-
      Tijdens de periode van non-activiteit is [artikel 19, vierde lid][ref1], niet van toepassing. De aanspraak op
      vakantie die wordt opgebouwd gedurende de periode van non-activiteit, wordt genoten in een aaneengesloten periode
      direct voorafgaand aan de periode van non-activiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel19
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '19'
        hoofdstuk: IV
  - number: 13b.10
    text: |-
      Het bevoegd gezag kan de in [artikel 26, eerste lid][ref1], bedoelde vergoeding toekennen op het moment dat de
      periode van non-activiteit ingaat dan wel op het moment dat het verlof of de vakantie, bedoeld in het zesde lid,
      ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel26
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '26'
        hoofdstuk: IV
  - number: 13b.11
    text: |-
      Het tiende lid is van overeenkomstige toepassing ten aanzien van het moment van toekennen van de gratificatie,
      bedoeld in [artikel 75, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel75
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '75'
        hoofdstuk: VIII
  - number: 13c.1
    text: |-
      De aanvraag, bedoeld in [artikel 13b, eerste lid][ref1], dient uiterlijk een dag voor het bereiken van de 56-jarige
      leeftijd te worden ingediend bij het bevoegd gezag. In geval van ziekte kan het bevoegd gezag toestaan dat de
      aanvraag wordt ingediend na het in de eerste volzin bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13b
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13b
        hoofdstuk: III.a
  - number: 13c.2
    text: |-
      De ambtenaar die in aanmerking komt voor een periode van non-activiteit, bedoeld in
      [artikel 13b, eerste lid][ref1], maakt gedurende het 56-ste levensjaar afspraken met het bevoegd gezag. De
      afspraken worden schriftelijk vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13b
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13b
        hoofdstuk: III.a
  - number: 13c.3
    text: |-
      De afspraken, bedoeld in het tweede lid, bevatten in ieder geval de wensen van het bevoegd gezag en de ambtenaar
      ten aanzien van de datum waarop de periode van non-activiteit zal ingaan, dan wel een afspraak over het tijdstip
      waarop definitief moet worden vastgelegd vanaf welke datum de periode van non-activiteit zal ingaan.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13c
  - number: 13c.4
    text: |-
      Indien het bevoegd gezag voornemens is de aanvraag niet of niet volledig in te willigen, vraagt het bevoegd gezag
      binnen vier weken advies van een door Onze Minister in te stellen commissie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13c
  - number: 13c.5
    text: |-
      De commissie, bedoeld in het vierde lid, wordt paritair samengesteld en brengt binnen zes weken na ontvangst van de
      adviesaanvraag een schriftelijk advies uit aan het bevoegd gezag en aan de betrokken ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel13c
  - number: '14.1'
    text: |-
      Het LSOP roostert voor de aspirant gedurende de initiële opleiding 165,6 vakantie-uren per kalenderjaar in. Per
      kalenderjaar worden ten minste twee kalenderweken aaneengesloten ingeroosterd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel14
  - number: '14.2'
    text: |-
      Indien het bevoegd gezag ingeroosterde vakantie-uren intrekt en deze uren niet op een ander tijdstip in dat
      kalenderjaar kunnen worden genoten, wordt de aspirant voor ieder uur vakantie dat hij niet heeft genoten een
      vergoeding toegekend ten bedrage van het salaris per uur. Ten hoogste 21,6 niet genoten vakantie-uren kunnen
      worden vergoed of vervallen bij een volledige betrekking, dan wel, indien de aspirant een andere betrekking dan
      een volledige betrekking heeft, een evenredig deel hiervan. Door andere omstandigheden niet genoten vakantie-uren
      vervallen aan het einde van het desbetreffende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel14
  - number: '14.3'
    text: |-
      Na afloop van het laatste opleidingsjaar zullen de niet ingeroosterde vakantie-uren die nog resteren in dat
      kalenderjaar bij voortzetting van de aanstelling in het desbetreffende kalenderjaar kunnen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel14
  - number: '14.4'
    text: De aspirant die in deeltijd is aangesteld, heeft recht op een evenredig aantal vakantie-uren.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel14
  - number: '15.1'
    text: |-
      Aan de ambtenaar wordt, al dan niet op zijn aanvraag, in elk kalenderjaar vakantie met behoud van bezoldiging
      verleend met inachtneming van de regels, gesteld in dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel15
  - number: '15.2'
    text: Deze vakantie wordt verleend door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel15
  - number: '17.1'
    text: De aanspraak op vakantie bedraagt 165,6 uren per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel17
  - number: '17.2'
    text: |-
      Indien de ambtenaar in een kalenderjaar geen arbeidsverzuim heeft gehad wegens ziekte, met uitzondering van
      arbeidsverzuim in verband met een dienstongeval of zwangerschap, wordt in het daaropvolgende kalenderjaar, de in
      het eerste lid bedoelde aanspraak vermeerderd met 7,2 uur.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel17
  - number: '17.3'
    text: |-
      Indien de ambtenaar zich in een kalenderjaar wegens ziekte, anders dan door een dienstongeval of zwangerschap meer
      dan vijf maal ziek meldt, wordt de in het eerste lid bedoelde aanspraak verminderd met 7,2 uur, tenzij het bevoegd
      gezag bijzondere omstandigheden aanwezig acht.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel17
  - number: '18.1'
    text: |-
      De volgens [artikel 17][ref1] vastgestelde aanspraak op vakantie wordt, afhankelijk van de leeftijd die de
      ambtenaar in het desbetreffende kalenderjaar bereikt, verhoogd overeenkomstig de hierna volgende tabel:






                    leeftijd


                    verhoging






                    18 jaar en jonger


                    21,6 uren




                    19 jaar


                    14,4 uren




                    20 jaar


                    7,2 uren




                    van 45 tot en met 49 jaar


                    7,2 uren




                    van 50 tot en met 54 jaar


                    14,4 uren




                    van 55 tot en met 59 jaar


                    21,6 uren




                    60 jaar en ouder


                    28,8 uren


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel17
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '17'
        hoofdstuk: IV
  - number: '18.2'
    text: |-
      De ambtenaar wiens arbeidstijd met toepassing van [artikel 13a][ref1] is verminderd, heeft aanspraak op een
      verhoging als bedoeld in het eerste lid, naar de mate waarin zijn arbeidstijd met een lager percentage is
      verminderd dan het bij zijn leeftijd behorende percentage, genoemd in [artikel 13a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel13a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 13a
        hoofdstuk: III
  - number: '18.3'
    text: De ingevolge het tweede lid tot stand gekomen verhoging wordt rekenkundig afgerond op tienden van uren.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel18
  - number: '19.1'
    text: |-
      Voor de ambtenaar met een andere betrekking dan een volledige betrekking wordt de ingevolge de [artikelen 17][ref1]
      en [18][ref2] geldende aanspraak op vakantie vastgesteld op een evenredig deel van de aanspraak bij een volledige
      betrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel18
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '17'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '18'
        hoofdstuk: IV
  - number: '19.2'
    text: |-
      Indien de diensttijd van de ambtenaar in de loop van een kalenderjaar wordt gewijzigd, wordt de aanspraak op
      vakantie over het resterend gedeelte van het jaar opnieuw vastgesteld, rekening houdend met de nieuwe diensttijd.
      De tot aan de datum van ingang van de wijziging van de diensttijd verworven aanspraak op vakantie blijft
      ongewijzigd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
  - number: '19.3'
    text: |-
      Bij beëindiging of aanvang van het dienstverband in de loop van een kalenderjaar, wordt de aanspraak op vakantie
      als bedoeld in de [artikelen 17, eerste lid][ref1], en [18][ref2] vastgesteld naar evenredigheid van de dienst, die
      de ambtenaar in dat jaar verricht heeft of zal verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel18
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '17'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '18'
        hoofdstuk: IV
  - number: '19.4'
    text: |-
      Over kalendermaanden gedurende welke de ambtenaar in het geheel geen dienst verricht, met uitzondering van de
      eerste kalendermaand, heeft hij geen aanspraak op vakantie. Over kalendermaanden gedurende welke de ambtenaar
      gedeeltelijk dienst verricht, heeft hij slechts aanspraak op vakantie naar evenredigheid van het gedeelte van het
      aantal uren waarop hij feitelijk dienst verricht.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
  - number: '19.5'
    text: 'Het vierde lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
  - number: 19.5.a
    text: 'geheel of gedeeltelijk geen dienst wordt verricht wegens:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
  - number: 19.5.a.1°
    text: teveel gewerkte uren;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
  - number: 19.5.a.2°
    text: verleende vakantie;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
  - number: 19.5.a.3°
    text: |-
      niet aan schuld of nalatigheid van de ambtenaar te wijten ziekte, gedurende de periode van de eerste 26 weken
      waarin geen dienst wordt verricht, dan wel 52 weken in geval van ziekte als gevolg van een dienstongeval of
      beroepsziekte, waarbij een hervatting van de dienstverrichting gedurende dertig kalenderdagen of minder geen nieuwe
      periode van 26 respectievelijk 52 weken inluidt;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
  - number: 19.5.a.4°
    text: |-
      ouderschapsverlof als bedoeld in [artikel 41][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel41
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '2'
  - number: 19.5.a.5°
    text: |-
      zwangerschaps- en bevallingsverlof als bedoeld in [artikel 55][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '2'
  - number: 19.5.a.6°
    text: verblijf in militaire dienst wegens herhalingsoefeningen;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
  - number: 19.5.a.7°
    text: |-
      verlof van korte duur verleend op basis van [de artikelen 31][ref1], [33][ref2], [35][ref3], [36][ref4]
      of [37][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0006516#Artikel36
      [ref5]: https://wetten.overheid.nl/BWBR0006516#Artikel37
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '31'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '33'
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '35'
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006516
        artikel: '36'
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0006516
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '2'
  - number: 19.5.a.8°
    text: |-
      adoptieverlof als bedoeld in [artikel 41a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel41a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 41a
        hoofdstuk: VI
        paragraaf: '2'
  - number: 19.5.a.9°
    text: |-
      partieel uittreden als bedoeld in [artikel 13a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13a
        hoofdstuk: III
  - number: 19.5.a.10°
    text: |-
      minder werken als bedoeld in [artikel 28b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel28b
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 28b
        hoofdstuk: IV.A
  - number: 19.5.b
    text: het bevoegd gezag daartoe aanleiding aanwezig acht.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel19
  - number: '20'
    text: 'De ambtenaar heeft geen aanspraak op vakantie voor de tijd gedurende welke hij:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel20
  - number: 20.a
    text: |-
      zonder deugdelijke grond weigert mee te werken aan door het bevoegd gezag of een door het bevoegd gezag aangewezen
      deskundige gegeven redelijke voorschriften of getroffen maatregelen die erop zijn gericht om hem in staat te
      stellen passende arbeid te verrichten; of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel20
  - number: 20.b
    text: |-
      zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren en bijstellen van een plan van aanpak
      als bedoeld in [artikel 71a, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: '22.1'
    text: |-
      Over de tijdstippen waarop de vakantie zal ingaan, alsmede over de tijdvakken waarin deze eventueel zal worden
      gesplitst, beslist het bevoegd gezag in goed overleg met de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel22
  - number: '22.2'
    text: |-
      De ambtenaar met een volledige betrekking dient in elk kalenderjaar ten minste 108 uur vakantie op te nemen waarvan
      ten minste 72 uur over een aaneengesloten periode. Voor een ambtenaar met een andere betrekking dan een volledige
      betrekking wordt het aantal in de eerste volzin genoemde uren vastgesteld op een evenredig deel van het aantal uren
      bij een volledige betrekking.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel22
  - number: '23.1'
    text: |-
      Indien de ambtenaar in een kalenderjaar de aanspraak op vakantie niet geheel heeft genoten, wordt de niet genoten
      vakantie naar het volgende kalenderjaar overgeboekt tot een maximum van de aanspraak van de ambtenaar over een vol
      kalenderjaar berekend volgens de [artikelen 17 tot en met 19][ref1], verminderd met het minimaal op te nemen aantal
      uren vakantie, genoemd in [artikel 22, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel22
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '17'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '22'
        hoofdstuk: IV
  - number: '23.2'
    text: |-
      In individuele gevallen kan het bevoegd gezag toestaan dat in een bepaald jaar wordt afgeweken van de
      overeenkomstig het eerste lid maximaal naar een volgend kalenderjaar over te boeken vakantie-aanspraken.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel23
  - number: '23.3'
    text: |-
      Indien het bevoegd gezag ingeroosterde vakantie-uren intrekt dan wel de ambtenaar de overeenkomstig
      [artikel 22, tweede lid][ref1], minimaal op te nemen vakantie niet of niet geheel kan verlenen vanwege ernstige
      bezwaren voor de bedrijfsvoering, is het eerste lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel22
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '22'
        hoofdstuk: IV
  - number: '24.1'
    text: |-
      Indien de ambtenaar in een kalenderjaar meer vakantie heeft genoten dan hem ingevolge dit hoofdstuk toekomt, wordt
      dit meerdere verrekend met de hem over een of meer volgende kalenderjaren toekomende vakantie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel24
  - number: '24.2'
    text: |-
      Het eerste lid geldt met dien verstande dat uit dien hoofde in een kalenderjaar de vakantie niet met meer dan
      een derde gedeelte van hetgeen de ambtenaar ingevolge [de artikelen 17 tot en met 19][ref1] toekomt, mag worden
      verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel17
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '17'
        hoofdstuk: IV
  - number: '25.1'
    text: |-
      Verleende vakantie kan worden ingetrokken, wanneer dringende redenen van dienstbelang dat noodzakelijk maken. In
      dat geval komt een dag, waarop de ambtenaar dientengevolge slechts gedeeltelijk vakantie heeft genoten, niet in
      aanmerking bij het berekenen van het aantal genoten vakantie-uren.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel25
  - number: '25.2'
    text: Indien de ambtenaar ten gevolge van de intrekking van de vakantie geldelijke schade lijdt, wordt deze hem vergoed.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel25
  - number: '26.1'
    text: |-
      Indien de ambtenaar op de datum van zijn ontslag nog aanspraak heeft op vakantie, wordt hem voor ieder uur vakantie
      dat hij niet heeft opgenomen een vergoeding toegekend ten bedrage van het salaris per uur dat de ambtenaar direct
      voorafgaand aan zijn ontslag genoot.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel26
  - number: '26.2'
    text: |-
      Indien op de dag van zijn ontslag blijkt dat de ambtenaar teveel vakantie heeft genoten, is hij voor ieder uur
      teveel genoten vakantie een bedrag schuldig ten bedrage van het salaris per uur.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel26
  - number: '28'
    text: Het bevoegd gezag kan nadere regels ter uitvoering van dit hoofdstuk vaststellen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28
  - number: 28a.1
    text: |-
      De ambtenaar kan bij het bevoegd gezag een aanvraag indienen om gedurende het eerstvolgende kalenderjaar meer uren
      te werken dan het aantal uren dat op grond van [artikel 12, vijfde en zesde lid][ref1], voor hem is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel12
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '12'
        hoofdstuk: III
  - number: 28a.2
    text: |-
      Voor de ambtenaar met een volledige betrekking bedraagt het aantal uren dat meer gewerkt kan worden ten hoogste 200
      uren per kalenderjaar. Voor een ambtenaar met een andere betrekking dan een volledige betrekking wordt dit maximum
      vastgesteld op een evenredig deel van het maximaal aantal uren bij een volledige betrekking. Voor de ambtenaar mag
      het aantal te werken uren op jaarbasis gemiddeld per week niet meer dan 40 uur bedragen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28a
  - number: 28a.3
    text: |-
      De aanvraag, bedoeld in het eerste lid, wordt door het bevoegd gezag toegewezen tenzij hiertegen ernstige bezwaren
      bestaan. [Artikel 2, negende lid, van de Wet aanpassing arbeidsduur][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011173#Artikel2
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0011173
        artikel: '2'
  - number: 28a.4
    text: Per meer te werken uur ontvangt de ambtenaar maandelijks een vergoeding ter grootte van zijn salaris per uur.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28a
  - number: 28b.1
    text: |-
      De ambtenaar kan bij het bevoegd gezag een aanvraag indienen om gedurende het eerstvolgende kalenderjaar
      minder uren te werken dan het aantal uren dat op grond van [artikel 12, vijfde en zesde lid][ref1], voor hem is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel12
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '12'
        hoofdstuk: III
  - number: 28b.2
    text: |-
      Voor de ambtenaar met een volledige betrekking bedraagt het aantal uren dat minder kan worden gewerkt ten hoogste
      80 uren per kalenderjaar. Voor een ambtenaar met een andere betrekking dan een volledige betrekking wordt dit
      maximum vastgesteld op een evenredig deel van het maximaal aantal uren bij een volledige betrekking.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28b
  - number: 28b.3
    text: |-
      De aanvraag, bedoeld in het eerste lid, wordt door het bevoegd gezag toegewezen tenzij hiertegen ernstige bezwaren
      bestaan. [Artikel 2, achtste lid, van de Wet aanpassing arbeidsduur][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011173#Artikel2
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0011173
        artikel: '2'
  - number: 28b.4
    text: |-
      Per minder te werken uur wordt maandelijks een inhouding op het salaris van de ambtenaar toegepast ter grootte van
      zijn salaris per uur.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28b
  - number: 28c.1
    text: |-
      [Artikel 28a][ref1] is niet van toepassing op de ambtenaar:


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel28a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 28a
        hoofdstuk: IV.A
  - number: 28c.1.a
    text: |-
      van wie de gemiddelde wekelijkse werktijd met toepassing van [artikel 13a][ref1] is verminderd;


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13a
        hoofdstuk: III
  - number: 28c.1.b
    text: |-
      die op grond van [artikel 13b][ref1] non-activiteit geniet dan wel direct voorafgaande aan de non-activiteit verlof
      geniet;


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13b
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13b
        hoofdstuk: III.a
  - number: 28c.1.c
    text: |-
      die betaald ouderschapsverlof geniet als bedoeld in [artikel 41][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel41
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '2'
  - number: 28c.1.d
    text: |-
      die buitengewoon verlof van lange duur geniet als bedoeld in de [artikelen 42][ref1], [43][ref2], [46][ref3] en
      [47][ref4], of


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0006516#Artikel47
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '42'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '43'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '46'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0006516
        artikel: '47'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 28c.1.e
    text: |-
      die gedeeltelijk ontslag is verleend als bedoeld in [artikel 87a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel87a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 87a
        hoofdstuk: X
  - number: 28c.2
    text: |-
      [Artikel 28b][ref1] is niet van toepassing op de ambtenaar:


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel28b
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 28b
        hoofdstuk: IV.A
  - number: 28c.2.a
    text: |-
      die op grond van [artikel 13b][ref1] non-activiteit geniet dan wel direct voorafgaande aan de non-activiteit verlof
      geniet, of


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13b
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13b
        hoofdstuk: III.a
  - number: 28c.2.b
    text: |-
      die buitengewoon verlof van lange duur geniet als bedoeld in de [artikelen 42][ref1], [43][ref2], [46][ref3] en
      [47][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0006516#Artikel47
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '42'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '43'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '46'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0006516
        artikel: '47'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 28d.1
    text: |-
      Het bevoegd gezag stelt jaarlijks vast voor welke datum een aanvraag als bedoeld in de [artikelen 28a][ref1] en
      [28b][ref2], moet worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel28a
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel28b
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28d
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 28a
        hoofdstuk: IV.A
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 28b
        hoofdstuk: IV.A
  - number: 28d.2
    text: |-
      Het bevoegd gezag beslist op alle aanvragen die zijn ingediend voor de datum, bedoeld in het eerste lid, binnen
      drie maanden na die datum, doch uiterlijk een maand voor het kalenderjaar waarop de aanvraag ziet.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28d
  - number: 28e.1
    text: |-
      Het bevoegd gezag stelt, met inachtneming van de geldende fiscale bepalingen, een regeling vast met de volgende
      belastingvrije bestemmingsmogelijkheden:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
  - number: 28e.1.a
    text: |-
      een fiets voor het woon-werkverkeer, met aan een fiets samenhangende zaken dienstbaar aan het woon-werkverkeer en
      een fietsverzekering;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
  - number: 28e.1.b
    text: vakliteratuur;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
  - number: 28e.1.c
    text: |-
      cursussen, congressen, seminars, symposia, excursies, studiereizen en dergelijke ter behoorlijke vervulling van
      de dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
  - number: 28e.1.d
    text: een opleiding of studie met het oog op het verwerven van een inkomen uit werk en woning;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
  - number: 28e.1.e
    text: openbaar vervoerbewijzen die mede voor het werk worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
  - number: 28e.1.f
    text: vakbondscontributies.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
  - number: 28e.2
    text: |-
      Op aanvraag van de ambtenaar kan ten behoeve van één of meer van de in het eerste lid genoemde belastingvrije
      bestemmingsmogelijkheden geheel of gedeeltelijk door de ambtenaar worden afgezien van:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
  - number: 28e.2.a
    text: |-
      zijn salaris, vastgesteld aan de hand van één van de bijlagen van het [Besluit bezoldiging politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 28e.2.b
    text: zijn vakantie-uitkering;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
  - number: 28e.2.c
    text: zijn vakantie-uren;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
  - number: 28e.2.d
    text: |-
      zijn uitkering als bedoeld in [artikel 25a][ref1] en [25b van het Besluit bezoldiging politie][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel25b
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 25a
      - id: ref2
        bwb_id: BWBR0006517
        artikel: 25b
  - number: 28e.2.e
    text: |-
      zijn vergoeding, bedoeld in [artikel 28a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel28a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 28a
        hoofdstuk: IV.A
  - number: 28e.3
    text: |-
      Voor de vakantie-uren, bedoeld in het eerste lid, onderdeel c, geldt dat van de in een kalenderjaar toegekende
      vakantie-uren op basis van de [artikelen 17][ref1], [18][ref2] en [19][ref3] maximaal van het verschil tussen deze
      toegekende vakantie-uren en 144 vakantie-uren bij een volledige betrekking kan worden afgezien, dan wel, indien de
      ambtenaar een andere betrekking heeft, een evenredig deel hiervan.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel19
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '17'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '18'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '19'
        hoofdstuk: IV
  - number: 28e.4
    text: |-
      Indien de ambtenaar afziet van de in het tweede lid genoemde aanspraken, wordt de waarde van die aanspraken
      vastgesteld op de waarde op de dag waarop de ambtenaar aan de fiscale regeling gaat deelnemen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28e
  - number: 28f
    text: Onze Minister kan nadere regels stellen ter uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel28f
  - number: '29'
    text: |-
      Onverminderd [hoofdstuk VII][ref1] van dit besluit en hoofdstuk 9 van het Besluit bezoldiging politie geniet
      verlof:


      [ref1]: https://wetten.overheid.nl/BWBR0006516#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006516
        hoofdstuk: VII
  - number: 29.a
    text: de ambtenaar die als militair in werkelijke dienst is;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel29
  - number: 29.b
    text: |-
      de ambtenaar die zich bevindt in één der omstandigheden, bedoeld in [artikel 37][ref1] van het Besluit bezoldiging
      politie of


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel37
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '2'
  - number: 29.c
    text: de ambtenaar die uit hoofde van ziekte of ongeval verhinderd is dienst te verrichten.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel29
  - number: '32.1'
    text: |-
      Aan de ambtenaar wordt in de gevallen en onder de voorwaarden, genoemd in de volgende artikelen van dit hoofdstuk,
      buitengewoon verlof verleend.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel32
  - number: '32.2'
    text: Buitengewoon verlof wordt verleend door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel32
  - number: '33'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt, voor zover dit niet in vrije tijd kan geschieden
      en omzetting van de dienst niet mogelijk is, buitengewoon verlof verleend:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel33
  - number: 33.a
    text: voor de uitoefening van het kiesrecht of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel33
  - number: 33.b
    text: voor het voldoen aan een wettelijke verplichting.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel33
  - number: '34.1'
    text: |-
      Indien de ambtenaar een vaste vergoeding ontvangt uit de functie waarvoor hem het in artikel 125*c*, tweede lid,
      van de Ambtenarenwet bedoelde verlof wordt verleend, wordt op zijn bezoldiging een inhouding toegepast over de tijd
      dat hij verlof geniet. Deze inhouding gaat hetgeen hij geacht kan worden te ontvangen als vaste vergoeding voor de
      met verlof overeenkomende tijd in de bedoelde functie niet te boven.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel34
  - number: '34.2'
    text: Onze Minister kan nadere regels ter uitvoering van het eerste lid vaststellen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel34
  - number: '35.1'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt jaarlijks ten hoogste 120 uren buitengewoon
      verlof met behoud van volle bezoldiging verleend voor het bijwonen van vergaderingen van statutaire organen
      van verenigingen van ambtenaren, van centrale organisaties waarbij deze verenigingen zijn aangesloten, of van
      internationale ambtenarenorganisaties, mits de ambtenaar hieraan deelneemt:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel35
  - number: 35.1.a
    text: |-
      voor zover het betreft vergaderingen van verenigingen van ambtenaren als bestuurslid van die vereniging dan wel als
      afgevaardigde of bestuurslid van een onderdeel daarvan;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel35
  - number: 35.1.b
    text: |-
      voor zover het betreft vergaderingen van centrale organisaties waarbij verenigingen van ambtenaren zijn
      aangesloten, als bestuurslid van die centrale organisatie dan wel als afgevaardigde of bestuurslid van een bij die
      organisatie aangesloten vereniging van ambtenaren;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel35
  - number: 35.1.c
    text: |-
      voor zover het betreft vergaderingen van een internationale ambtenarenorganisatie, als bestuurslid van deze
      organisatie dan wel als afgevaardigde of bestuurslid van een bij die organisatie aangesloten vereniging van
      ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel35
  - number: '35.2'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt tot ten hoogste 208 uren per jaar buitengewoon
      verlof met behoud van volle bezoldiging verleend aan de ambtenaar die door een bond, vereniging of centrale als
      bedoeld in [artikel 2, tweede lid][ref1], [12, tweede en zesde lid][ref2], dan wel door een bond, vereniging
      of centrale waarmee ingevolge [artikel 22][ref3], [22a][ref4] of [22b][ref5] overleg wordt gepleegd, van het
      [Besluit overleg en medezeggenschap politie 1994][ref6] is aangewezen om bestuurlijke of vertegenwoordigende
      activiteiten te ontplooien binnen zijn bond, vereniging of centrale dan wel binnen de organisatie van de werkgever,
      die ertoe strekken de doelstellingen van zijn bond, vereniging of centrale te ondersteunen.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006518#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0006518#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0006518#Artikel22a
      [ref5]: https://wetten.overheid.nl/BWBR0006518#Artikel22b
      [ref6]: https://wetten.overheid.nl/BWBR0006518
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006518
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0006518
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0006518
        artikel: 22a
      - id: ref5
        bwb_id: BWBR0006518
        artikel: 22b
      - id: ref6
        bwb_id: BWBR0006518
  - number: '35.3'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt aan de ambtenaar buitengewoon verlof met behoud
      van volle bezoldiging verleend voor het deelnemen aan een cursus op uitnodiging van een organisatie van ambtenaren
      als bedoeld in het tweede lid, met dien verstande dat dit verlof ten hoogste 48 uren per twee jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel35
  - number: '35.4'
    text: |-
      Het aantal uren dat op grond van het eerste, tweede en derde lid, alsmede op grond van
      [artikel 18, eerste en tweede lid, van de Wet op de ondernemingsraden][ref1] aan een ambtenaar mag worden verleend,
      bedraagt tezamen ten hoogste 240 uren per jaar, met dien verstande dat ten hoogste 320 uren worden verleend aan
      leden van hoofdbesturen van de in het tweede lid bedoelde organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel18
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '18'
  - number: '35.5'
    text: |-
      Het verlof, bedoeld in het eerste tot en met het vierde lid, wordt slechts verleend aan ambtenaren die lid zijn van
      de in het tweede lid bedoelde organisaties.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel35
  - number: '35.6'
    text: |-
      Tenzij zwaarwegende belangen van de dienst zich daartegen verzetten, wordt buitengewoon verlof met behoud
      van volle bezoldiging verleend voor het bijwonen van vergaderingen van de commissies, bedoeld in de
      [artikelen 2, eerste lid][ref1], [12, eerste lid][ref2], [21, eerste lid][ref3], [22, eerste lid][ref4],
      [22a, eerste lid][ref5] en [22b, eerste lid][ref6], alsmede voor vergaderingen van de werkgroepen, bedoeld
      in [artikel 18 van het Besluit overleg en medezeggenschap politie 1994][ref7]. Dit geldt eveneens voor één
      voorvergadering per in de eerste volzin bedoelde vergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006518#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0006518#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0006518#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0006518#Artikel22a
      [ref6]: https://wetten.overheid.nl/BWBR0006518#Artikel22b
      [ref7]: https://wetten.overheid.nl/BWBR0006518#Artikel18
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006518
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0006518
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0006518
        artikel: '22'
      - id: ref5
        bwb_id: BWBR0006518
        artikel: 22a
      - id: ref6
        bwb_id: BWBR0006518
        artikel: 22b
      - id: ref7
        bwb_id: BWBR0006518
        artikel: '18'
  - number: '35.7'
    text: |-
      Voor de ambtenaar met een andere betrekking dan een volledige betrekking wordt de ingevolge dit artikel geldende
      aanspraak op verlof vastgesteld op een evenredig deel van de aanspraak bij een volledige betrekking.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel35
  - number: '35.8'
    text: |-
      Dit artikel is van toepassing voor zover [artikel 35a][ref1] geen toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel35a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 35a
        hoofdstuk: VI
        paragraaf: '2'
  - number: 35a
    text: |-
      Het bevoegd gezag kan, in overeenstemming met een of meer hoofdbesturen van de verenigingen
      van ambtenaren die zijn toegelaten tot het overleg met de commissie, bedoeld in
      [artikel 12, eerste lid][ref1], [21, eerste lid][ref2], [22, eerste lid][ref3], [22a, eerste lid][ref4], en
      [22b, eerste lid, van het Besluit overleg en medezeggenschap politie 1994][ref5], regels stellen inzake het
      toekennen van buitengewoon verlof voor vakbondsfaciliteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006518#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0006518#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0006518#Artikel22a
      [ref5]: https://wetten.overheid.nl/BWBR0006518#Artikel22b
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0006518
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0006518
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0006518
        artikel: 22a
      - id: ref5
        bwb_id: BWBR0006518
        artikel: 22b
  - number: '36'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt buitengewoon verlof met behoud van volle
      bezoldiging verleend:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel36
  - number: 36.a
    text: 'voor het zoeken van een woning, indien het dienstbelang verhuizing vordert: ten hoogste twee dienstdagen;'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel36
  - number: 36.b
    text: |-
      voor verhuizing uit hoofde van dienstbelang: ten hoogste twee dienstdagen, zonodig, indien de ambtenaar een eigen
      huishouding heeft, te verlengen tot drie dienstdagen en in zeer bijzondere gevallen tot vier dienstdagen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel36
  - number: '37.1'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt aan de ambtenaar buitengewoon verlof met behoud
      van volle bezoldiging verleend:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel37
  - number: 37.1.a
    text: 'bij zijn huwelijk: 3 dienstdagen;'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel37
  - number: 37.1.b
    text: 'tot het bijwonen van een huwelijk van bloed- of aanverwanten in de eerste en tweede graad: 1 dienstdag;'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel37
  - number: 37.1.c
    text: bij overlijden van
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel37
  - number: 37.1.c.1
    text: |-
      zijn echtgenote, ouders, stiefouders, pleegouders, schoonouders, kinderen, stiefkinderen, pleegkinderen of
      aangehuwde kinderen: vier dienstdagen;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel37
  - number: 37.1.c.2
    text: 'bloed- of aanverwanten in de tweede graad: twee dienstdagen;'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel37
  - number: 37.1.d
    text: 'bij bevalling van zijn echtgenote: ten hoogste vijf dienstdagen;'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel37
  - number: 37.1.e
    text: 'bij zijn 25- of 40-jarig ambtsjubileum: één dienstdag.'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel37
  - number: '37.2'
    text: |-
      Voor de toepassing van dit artikel wordt onder huwelijk mede verstaan het aangaan van een geregistreerd
      partnerschap alsmede het sluiten van een samenlevings-contract als bedoeld in [artikel 1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
        hoofdstuk: I
  - number: '37.3'
    text: |-
      Buitengewoon verlof dat aan de ambtenaar op grond van het eerste lid wordt verleend in verband met aanverwantschap
      die door zijn huwelijk is ontstaan met bloedverwanten van zijn echtgenote wordt op dezelfde wijze verleend aan de
      ambtenaar met betrekking tot dezelfde bloedverwanten van zijn geregistreerde partner alsmede aan de ambtenaar, die
      ongehuwd samenwoont als bedoeld in [artikel 1, tweede lid][ref1], met betrekking tot dezelfde bloedverwanten van
      zijn levenspartner.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
        hoofdstuk: I
  - number: '38'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt aan de ambtenaar buitengewoon verlof met behoud
      van bezoldiging verleend:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel38
  - number: 38.a
    text: |-
      voor het afleggen van een examen voor het behalen van een diploma dat voor de uitoefening van zijn functie van
      belang kan worden geacht of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel38
  - number: 38.b
    text: voor het zitting nemen in examencommissies op politiegebied voor ten hoogste tien dienstdagen per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel38
  - number: '39.1'
    text: |-
      Buitengewoon verlof van korte duur, al dan niet met behoud van bezoldiging, kan bovendien worden verleend, indien
      het bevoegd gezag van oordeel is dat daartoe aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel39
  - number: '39.2'
    text: Onze Minister kan nadere regels stellen in welke gevallen het eerste lid kan worden toegepast.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel39
  - number: '40'
    text: |-
      Het bevoegd gezag kan nadere procedurele regels stellen omtrent het aanvragen en verlenen van buitengewoon verlof
      van korte duur.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40
  - number: 40a.1
    text: |-
      De ambtenaar heeft aanspraak op buitengewoon verlof met behoud van zijn volledige bezoldiging voor de opvang bij
      calamiteiten in zijn persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40a
  - number: 40a.2
    text: 'Onder calamiteit wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40a
  - number: 40a.2.a
    text: |-
      ziekte of andere onverwachte gebeurtenissen waardoor een noodsituatie ontstaat in de verzorging van een of meer van
      de in het vierde lid bedoelde personen;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40a
  - number: 40a.2.b
    text: |-
      een onverwachte gebeurtenis waardoor het noodzakelijk is dat de ambtenaar zelf onverwijld maatregelen moet treffen
      ter voorkoming of beperking van schade of onheil.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40a
  - number: 40a.3
    text: |-
      Het verlof is bedoeld voor de eerste opvang en het treffen van noodzakelijke voorzieningen en bedraagt ten hoogste
      1 dienstdag per calamiteit voor ten hoogste 3 calamiteiten per jaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40a
  - number: 40a.4
    text: |-
      De personen voor wie verzorging kan worden verleend als bedoeld in het tweede lid, onderdeel a, zijn: de echtgenote
      of echtgenoot, ouders, stiefouders, pleegouders, schoonouders, kinderen, stiefkinderen, pleegkinderen of aangehuwde
      kinderen van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40a
  - number: 40a.5
    text: De ambtenaar informeert het bevoegd gezag vooraf over het opnemen van het verlof onder vermelding van de reden.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40a
  - number: 40a.6
    text: |-
      Het bevoegd gezag kan verlangen dat de ambtenaar achteraf aannemelijk maakt dat daadwerkelijk sprake was van een
      calamiteit. Indien de ambtenaar daar redelijkerwijs niet in slaagt, kunnen de opgenomen uren in mindering worden
      gebracht op het vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40a
  - number: 40a.7
    text: |-
      Voor de toepassing van dit artikel is [artikel 37, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel37
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '2'
  - number: 40b.1
    text: |-
      Tenzij een zwaarwegend dienstbelang zich daartegen verzet wordt aan de ambtenaar verlof met behoud van volledige
      bezoldiging verleend voor de noodzakelijke verzorging in verband met ziekte van:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
  - number: 40b.1.a
    text: de echtgenote of echtgenoot;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
  - number: 40b.1.b
    text: een inwonend kind tot wie de ambtenaar als ouder in een familierechtelijke betrekking staat;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
  - number: 40b.1.c
    text: een inwonend kind van de echtgenote of echtgenoot;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
  - number: 40b.1.d
    text: |-
      een pleegkind dat blijkens verklaringen uit de gemeentelijke basisadministratie op hetzelfde adres woont als
      de ambtenaar en door hem duurzaam wordt verzorgd en opgevoed op basis van een pleegcontract als bedoeld in
      [artikel 22, eerste lid, van de Wet op de jeugdzorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel22
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '22'
  - number: 40b.2
    text: |-
      Tenzij een zwaarwegend dienstbelang zich daartegen verzet wordt aan de ambtenaar verlof met behoud van volledige
      bezoldiging verleend voor de noodzakelijke verzorging in verband met ernstige ziekte van:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
  - number: 40b.2.a
    text: ouders;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
  - number: 40b.2.b
    text: stiefouders;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
  - number: 40b.2.c
    text: pleegouders;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
  - number: 40b.2.d
    text: schoonouders;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
  - number: 40b.2.e
    text: een niet-inwonend kind tot wie de ambtenaar in een familierechtelijke betrekking staat;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
  - number: 40b.2.f
    text: een niet-inwonend kind van de echtgenote of echtgenoot.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
  - number: 40b.3
    text: |-
      Het verlof, bedoeld in het eerste en tweede lid, bedraagt per kalenderjaar ten hoogste tweemaal de arbeidsduur
      per week.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
  - number: 40b.4
    text: |-
      De ambtenaar meldt vooraf onder opgave van de reden aan het bevoegd gezag dat hij het verlof, bedoeld in het eerste
      en tweede lid, opneemt. Indien deze melding voorafgaand aan het verlof niet mogelijk is, geschiedt dit zo spoedig
      mogelijk. Bij de melding geeft de ambtenaar ook de omvang, de wijze van opnemen en de vermoedelijke duur van het
      verlof aan.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
  - number: 40b.5
    text: |-
      Het bevoegd gezag kan achteraf van de ambtenaar verlangen dat hij aannemelijk maakt dat hij zijn arbeid niet heeft
      verricht in verband met de noodzakelijke verzorging, bedoeld in het eerste en tweede lid. Indien de ambtenaar daar
      redelijkerwijs niet in slaagt, kunnen de opgenomen uren in mindering worden gebracht op het vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
  - number: 40b.6
    text: |-
      Voor de toepassing van dit artikel is [artikel 37, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel37
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '41.1'
    text: |-
      De ambtenaar die als ouder in een familierechtelijke betrekking staat tot een kind, heeft aanspraak op
      ouderschapsverlof. Indien de ambtenaar met ingang van hetzelfde tijdstip tot meer dan één kind in een
      familierechtelijke betrekking komt te staan, bestaat er ten aanzien van ieder van die kinderen aanspraak op
      ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41
  - number: '41.2'
    text: |-
      De ambtenaar die blijkens verklaringen uit de gemeentelijke basisadministratie op hetzelfde adres woont als
      een kind en duurzaam de verzorging en de opvoeding van dat kind als eigen kind op zich heeft genomen, heeft
      aanspraak op ouderschapsverlof. Indien het op hetzelfde tijdstip meer dan één kind betreft, bestaat aanspraak op
      ouderschapsverlof als betrof het één kind. Indien de ambtenaar met het oog op adoptie met ingang van hetzelfde
      tijdstip de verzorging en opvoeding van meer dan één kind op zich heeft genomen, bestaat er ten aanzien van ieder
      van die kinderen aanspraak op ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41
  - number: '41.3'
    text: Geen aanspraak op ouderschapsverlof bestaat na de datum waarop het kind de leeftijd van acht jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41
  - number: '41.4'
    text: Het verlof wordt uitsluitend verleend aan de ambtenaar wiens dienstbetrekking ten minste een jaar heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41
  - number: '41.5'
    text: |-
      Het aantal uren verlof waarop de ambtenaar ten hoogste recht heeft, bedraagt dertien maal de arbeidsduur per week
      uitgaande van zijn arbeidsduur op het tijdstip waarop het verlof aanvangt. Indien de arbeidsduur van de ambtenaar
      gedurende het verlof wijzigt, wordt de aanspraak op het verlof opnieuw vastgesteld, rekening houdend met de
      mate waarin de arbeidsduur is gewijzigd en de mate waarin de periode gedurende welke het verlof wordt genoten is
      verstreken.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41
  - number: '41.6'
    text: |-
      Het verlof wordt opgenomen gedurende een aaneengesloten periode van ten hoogste zes maanden en gelijkmatig over
      deze periode verdeeld. De ambtenaar kan het bevoegd gezag verzoeken in afwijking van de eerste volzin het verlof
      op een andere wijze aaneengesloten te genieten of het verlof op te delen in ten hoogste drie niet aaneengesloten
      perioden, waarbij iedere periode ten minste één maand bedraagt. Het bevoegd gezag stemt in met het verzoek tenzij
      gewichtige redenen van dienstbelang zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41
  - number: '41.7'
    text: Over de uren waarop de ambtenaar verlof is verleend, behoudt hij 75% van zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41
  - number: '41.8'
    text: |-
      De ambtenaar is verplicht tot terugbetaling van de bezoldiging over de genoten verlofuren wanneer hem tijdens
      de verlofperiode of binnen een jaar na afloop van het verlof ontslag wordt verleend op aanvraag dan wel niet op
      aanvraag op grond van aan de ambtenaar te wijten feiten of omstandigheden. Ontslag op aanvraag gevolgd door een
      overgang binnen vier weken binnen de politiedienst wordt niet als ontslag beschouwd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41
  - number: '41.9'
    text: |-
      Het bevoegd gezag is verplicht in te stemmen met een aanvraag van de ambtenaar het verlof niet op te nemen of niet
      voort te zetten op grond van onvoorziene omstandigheden, tenzij gewichtige redenen van dienstbelang zich hiertegen
      verzetten. Het bevoegd gezag behoeft aan de aanvraag niet met ingang van een vroeger tijdstip gevolg te geven dan
      vier weken na de aanvraag. In het geval het verlof met toepassing van de eerste volzin, na het tijdstip van ingang
      daarvan niet wordt voortgezet, vervalt de aanspraak op het overige deel van dat verlof.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41
  - number: '41.10'
    text: |-
      Het bevoegd gezag kan, na overleg met de ambtenaar, de spreiding van de verlofuren over de week op grond van
      gewichtige redenen van dienstbelang wijzigen tot vier weken voor het tijdstip van ingang van het verlof.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41
  - number: '41.11'
    text: Het bevoegd gezag kan nadere regels stellen over de wijze waarop ouderschapsverlof wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41
  - number: 41a.1
    text: |-
      De ambtenaar heeft in verband met de adoptie van een kind recht op verlof voor ten hoogste vier aaneengesloten
      weken. Het recht bestaat gedurende een tijdvak van achttien weken, gerekend vanaf twee weken vóór de eerste dag
      dat de feitelijke opneming ter adoptie een aanvang heeft genomen of zal nemen, zoals die dag is aangeduid in een
      door de werknemer aan de werkgever overgelegd document waaruit blijkt dat een kind ter adoptie is of zal worden
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41a
  - number: 41a.2
    text: |-
      De ambtenaar die recht heeft op adoptieverlof, maakt aanspraak op doorbetaling van de bezoldiging gedurende een
      periode van ten hoogste drie weken.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41a
  - number: 41a.3
    text: |-
      Indien als gevolg van een adoptieverzoek tegelijkertijd twee of meer kinderen feitelijk ter adoptie worden
      opgenomen, bestaat de aanspraak op verlof slechts ten aanzien van één van die kinderen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41a
  - number: 41a.4
    text: |-
      De ambtenaar meldt aan het bevoegd gezag het verlof in verband met adoptie uiterlijk drie weken voor de dag van
      ingang van het verlof onder opgave van de omvang van het verlof. Bij de melding worden documenten gevoegd waaruit
      blijkt dat een kind ter adoptie is of zal worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41a
  - number: 41a.5
    text: |-
      Indien de ambtenaar aan wie verlof is verleend, gedurende dat verlof of gedurende een bepaalde periode van dat
      verlof tevens recht heeft op een financiële tegemoetkoming op basis van de [Wet arbeid en zorg][ref1], wordt
      gedurende de periode waarin sprake is van samenloop een inhouding op de bezoldiging, bedoeld in het tweede lid,
      toegepast die overeenkomt met het bedrag van deze financiële tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 41a.6
    text: |-
      Indien aan de gestelde voorwaarden voor het toekennen van een financiële tegemoetkoming als bedoeld in het vijfde
      lid is voldaan maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen aanvraag heeft ingediend,
      kan het bevoegde gezag het vijfde lid op overeenkomstige wijze toepassen, mits de ambtenaar schriftelijk is gewezen
      op de mogelijkheid van het indienen van een aanvraag. In dat geval wordt rekening gehouden met de financiële
      tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een aanvraag zou hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel41a
  - number: '42'
    text: De ambtenaar die als militair in werkelijke dienst is, is met buitengewoon verlof van lange duur.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel42
  - number: '43.1'
    text: |-
      Aan de ambtenaar kan op zijn aanvraag buitengewoon verlof worden verleend, al dan niet met behoud van bezoldiging
      en al dan niet onder bepaalde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel43
  - number: '43.2'
    text: |-
      Het verlof, bedoeld in het eerste lid, gaat niet in dan na aanvaarding van dat verlof met de daaraan verbonden
      voorwaarden door de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel43
  - number: '44'
    text: |-
      Indien het verlof, bedoeld in [artikel 43][ref1], uitsluitend strekt tot het persoonlijk belang van de ambtenaar,
      kan hem dit slechts worden verleend zonder behoud van bezoldiging en voor ten hoogste zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel43
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '43'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '45'
    text: |-
      Indien het verlof, bedoeld in [artikel 43][ref1], ten doel heeft de ambtenaar in de gelegenheid te stellen een
      andere functie te vervullen en met verlofverlening naar het oordeel van het bevoegd gezag niet uitsluitend het
      persoonlijk belang van de ambtenaar, maar ook het algemeen belang wordt gediend, kan het verlof in beginsel voor
      ten hoogste een jaar, zonder behoud van bezoldiging, worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel43
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '43'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '46.1'
    text: |-
      Aan de ambtenaar, benoemd tot bezoldigd bestuurder van een vereniging van ambtenaren, van een centrale of van een
      internationale organisatie van zodanige verenigingen, kan uit dien hoofde voor ten hoogste twee jaren buitengewoon
      verlof, zonder behoud van bezoldiging, worden verleend.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel46
  - number: '46.2'
    text: |-
      [Artikel 35, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel35
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '35'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '47.1'
    text: |-
      Indien het verlof, bedoeld in [artikel 43][ref1], ten doel heeft de ambtenaar in de gelegenheid te stellen
      anders dan in vaste dienst hetzij een functie in dienst van een volkenrechtelijke organisatie te vervullen hetzij
      ten behoeve van de Nederlandse Antillen of Aruba dan wel als deskundige tijdelijk ten behoeve van een vreemde
      mogendheid werkzaam te zijn en met verlofverlening naar het oordeel van Onze Minister het algemeen belang in
      overwegende mate wordt gediend, kan het verlof voor een door het bevoegd gezag te bepalen periode, al dan niet met
      behoud van bezoldiging, worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel43
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '43'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '47.2'
    text: |-
      In afwijking van het eerste lid kan aan de ambtenaar, die wenst te worden uitgezonden om in de burgerlijke
      landsdienst van de Nederlandse Antillen of Aruba tijdelijk een betrekking te vervullen, buitengewoon verlof worden
      verleend op basis van het West-Indisch Detacheeringsbesluit 1930.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel47
  - number: 47a
    text: Onze Minister stelt regels ten aanzien van levensloopverlof.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel47a
  - number: '48.1'
    text: |-
      De ambtenaar die na afloop van een hem verleend buitengewoon verlof van lange duur en zonder dat dit is verlengd,
      zijn dienst niet hervat, wordt gelijk behandeld als de ambtenaar die een aanvraag tot ontslag heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel48
  - number: '48.2'
    text: |-
      Het eerste lid is niet van toepassing, indien de ambtenaar binnen een redelijke termijn ten genoege van het bevoegd
      gezag aannemelijk maakt dat hij geldige redenen had zijn dienst niet te hervatten in welk geval het verlof wordt
      verlengd tot het tijdstip waarop de bedoelde geldige redenen hebben opgehouden te bestaan.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel48
  - number: '49'
    text: |-
      De ambtenaar is in geval van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte verplicht dit zo
      spoedig mogelijk, doch in elk geval niet later dan op de tweede dag van die ongeschiktheid, te melden.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel49
  - number: 49a.1
    text: |-
      Het bevoegd gezag verricht zijn taak met betrekking tot begeleiding van verzuim en de arbeidsgezondheidskundige
      begeleiding op grond van de [Arbeidsomstandighedenwet][ref1] en de bepalingen in dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: 49a.2
    text: |-
      Onze Minister kan regels vaststellen met betrekking tot de wijze waarop invulling wordt gegeven aan de begeleiding
      van verzuim, de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen procedures.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel49a
  - number: 49b.1
    text: |-
      Het bevoegd gezag is verplicht tijdig de maatregelen te treffen en voorschriften te geven die redelijkerwijs nodig
      zijn om de ambtenaar die wegens ziekte ongeschikt is zijn arbeid te verrichten in staat te stellen de eigen of
      andere passende arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel49b
  - number: 49b.2
    text: |-
      Uit hoofde van de verplichting, bedoeld in het eerste lid, stelt het bevoegd
      gezag in overeenstemming met de ambtenaar een plan van aanpak op als bedoeld in
      [artikel 71a, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1]. Het plan van aanpak wordt met
      medewerking van de ambtenaar regelmatig geëvalueerd en zo nodig bijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 49b.3
    text: |-
      Indien vaststaat dat de ambtenaar wegens ziekte ongeschikt is zijn arbeid te verrichten en binnen het gezagsbereik
      van het bevoegd gezag geen andere passende arbeid voorhanden is, bevordert dat gezag de inschakeling van de
      ambtenaar in voor hem passende arbeid in een of meer functies bij een andere werkgever.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel49b
  - number: 49b.4
    text: |-
      De ambtenaar mag de eigen of andere passende arbeid eerst verrichten nadat de deskundige persoon of de arbodienst
      een op de desbetreffende ambtenaar betrekking hebbend medisch advies heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel49b
  - number: 49c
    text: 'De ambtenaar die ongeschikt is tot het verrichten van zijn arbeid wegens ziekte, is verplicht:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel49c
  - number: 49c.a
    text: |-
      gevolg te geven aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige gegeven redelijke
      voorschriften en mee te werken aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige
      getroffen maatregelen als bedoeld in artikel 49b, eerste lid;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel49c
  - number: 49c.b
    text: |-
      zijn medewerking te verlenen aan het opstellen, evalueren en bijstellen van het plan van aanpak, bedoeld in artikel
      49b, tweede lid;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel49c
  - number: 49c.c
    text: passende arbeid te verrichten waartoe het bevoegd gezag hem in de gelegenheid stelt.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel49c
  - number: '50.1'
    text: 'De ambtenaar kan worden verplicht om een arbeidsgezondheidskundig onderzoek te ondergaan:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel50
  - number: 50.1.a
    text: indien het bevoegd gezag gegronde redenen heeft om te twijfelen aan de goede gezondheidstoestand van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel50
  - number: 50.1.b
    text: indien de ambtenaar niet meer volledig geschikt is gebleken voor het verrichten van zijn arbeid;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel50
  - number: 50.1.c
    text: |-
      ter beantwoording van de vraag of de ambtenaar tijdens het tijdvak waarin hij wegens ziekte ongeschikt is om zijn
      arbeid te verrichten, in het belang van zijn genezing arbeid mag verrichten en om vast te stellen welke arbeid
      wenselijk wordt geacht;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel50
  - number: 50.1.d
    text: |-
      voor zover dit noodzakelijk is ter voorbereiding van een beslissing naar aanleiding van de aanvraag om een
      hernieuwd onderzoek als bedoeld in [artikel 51][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel51
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '51'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 50.1.e
    text: |-
      indien de ambtenaar in contact staat of kort geleden heeft gestaan met een persoon die een ziekte heeft waarvoor
      ingevolge de Wet bestrijding infectieziekten en opsporing ziekteoorzaken, een aangifteplicht geldt;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel50
  - number: 50.1.f
    text: |-
      om te beoordelen of de ambtenaar die de functie heeft van vlieger bij het Korps landelijke politiediensten
      lichamelijk en psychisch in staat is de functie van vlieger te blijven uitoefenen, nadat hij de voor zijn functie
      vastgestelde leeftijdsgrens heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel50
  - number: 50.1.g
    text: |-
      als, gelet op [artikel 88c][ref1], de deskundige persoon of de arbodienst van oordeel is dat dit noodzakelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88c
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 88c
        hoofdstuk: X
  - number: 50.1.h
    text: |-
      om te beoordelen of sprake is van een situatie als bedoeld in [artikel 94, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel94
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '94'
        hoofdstuk: X
  - number: 50.1.i
    text: |-
      om te beoordelen of de ambtenaar die wegens ziekte volledig ongeschikt is geweest zijn arbeid te verrichten, zijn
      arbeid mag hervatten;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel50
  - number: 50.1.j
    text: voor zover dit voortvloeit uit enige wettelijke verplichting;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel50
  - number: 50.1.k
    text: |-
      indien hij in verband met de uitoefening van zijn werkzaamheden aan bijzonder gevaar voor zijn gezondheid
      blootstaat, of hij is benoemd in een functie waarvoor bij aanstelling een geneeskundige keuring is vereist als
      bedoeld in [artikel 7, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel7
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '7'
        hoofdstuk: II
  - number: '50.2'
    text: |-
      Het bevoegd gezag stelt de ambtenaar buiten dienst indien na een arbeidsgezondheidskundig onderzoek als bedoeld
      in [artikel 18 van de Arbeidsomstandighedenwet][ref1] dan wel een arbeidsgezondheidskundig onderzoek als bedoeld
      in het eerste lid, wanneer blijkt dat sprake is van een zodanige lichamelijke of geestelijke toestand dat de
      belangen van de ambtenaar, van de dienst of van bij het verrichten van de arbeid betrokken derden zich er tegen
      verzetten dat de ambtenaar zijn arbeid blijft verrichten. De ambtenaar wordt niet buiten dienst gesteld, indien
      hem andere passende arbeid kan worden opgedragen. Indien de ambtenaar buiten dienst wordt gesteld, wordt hij
      aangemerkt als ambtenaar die wegens ziekte ongeschikt is tot het verrichten van zijn arbeid, in welk geval
      [hoofdstuk 10 van het Besluit bezoldiging politie][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0006517
        hoofdstuk: '10'
  - number: '51.1'
    text: |-
      Het advies dat door de deskundige persoon of de arbodienst wordt uitgebracht naar aanleiding van een
      arbeidsgezondheidskundig onderzoek als bedoeld in [artikel 18 van de Arbeidsomstandighedenwet][ref1] en
      [artikel 50][ref2] van dit besluit, wordt zo spoedig mogelijk aan de ambtenaar en het bevoegd gezag bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel50
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '50'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '51.2'
    text: |-
      De ambtenaar kan de deskundige persoon of de arbodienst binnen drie dagen na ontvangst van het medisch advies,
      schriftelijk een hernieuwd onderzoek vragen indien hij bedenkingen heeft tegen het medisch advies. Gedurende de
      behandeling van zijn bedenkingen, behoeft de ambtenaar aan het medisch advies geen gevolg te geven. De deskundige
      persoon of de arbodienst stelt het bevoegd gezag in kennis van een ingediend verzoek om een hernieuwd onderzoek.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel51
  - number: '51.3'
    text: |-
      Zo spoedig mogelijk na ontvangst van het verzoek om een hernieuwd onderzoek, doch uiterlijk binnen vier weken,
      vindt het hernieuwd onderzoek door een commissie van drie artsen plaats.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel51
  - number: '51.4'
    text: |-
      Op verzoek van de ambtenaar wordt zijn behandelend arts in de gelegenheid gesteld mondeling of schriftelijk zijn
      mening aan de commissie van drie artsen kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel51
  - number: '51.5'
    text: |-
      De kosten van het hernieuwde onderzoek komen voor rekening van het bevoegd gezag. Eventuele reis- en verblijfkosten
      van de ambtenaar worden hem vergoed volgens de geldende regels ter zake van dienstreizen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel51
  - number: '52.1'
    text: |-
      De leden van de commissie bedoeld in [artikel 51, derde en vierde lid][ref1], worden per verzoek om een hernieuwd
      onderzoek aangewezen door het bevoegd gezag. De arts die het medisch advies heeft uitgebracht waarvan herziening
      wordt gevraagd, heeft in de commissie geen zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel51
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '51'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '52.2'
    text: 'De commissie deelt haar oordeel schriftelijk mee aan:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel52
  - number: 52.2.a
    text: de ambtenaar,
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel52
  - number: 52.2.b
    text: het bevoegd gezag, en
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel52
  - number: 52.2.c
    text: |-
      de behandelend arts, bedoeld in [artikel 51, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel51
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '51'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '53'
    text: |-
      In bijzondere gevallen kan aan de ambtenaar een tegemoetkoming worden verleend in noodzakelijk gemaakte kosten
      die verband houden met ziekte die de ambtenaar voor zichzelf en zijn medebelanghebbenden heeft gemaakt, indien
      hierin niet ingevolge een andere regeling wordt voorzien en deze kosten redelijkerwijze niet te zijnen laste kunnen
      blijven. Het bevoegd gezag kan over de uitvoering van dit artikel regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel53
  - number: '54.1'
    text: |-
      In geval van dienstongeval of beroepsziekte worden aan de desbetreffende ambtenaar vergoed de noodzakelijk gemaakte
      kosten van geneeskundige behandeling of verzorging.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel54
  - number: '54.2'
    text: Onze Minister kan bij ministeriële regeling nadere voorschriften vaststellen met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel54
  - number: 54a.1
    text: |-
      In geval van invaliditeit die voortvloeit uit een dienstongeval of een beroepsziekte, wordt aan de desbetreffende
      ambtenaar smartengeld vergoed tot een netto maximum bedrag van € 136 100,-.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel54a
  - number: 54a.2
    text: |-
      In geval de ambtenaar is komen te overlijden ten gevolge van een dienstongeval, wordt aan de weduwe of weduwnaar
      van wie de overleden ambtenaar niet duurzaam gescheiden leefde een netto bedrag van € 68 100,- uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel54a
  - number: 54a.3
    text: |-
      [Artikel 46, derde en vierde lid, van het Besluit bezoldiging politie][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel46
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '46'
  - number: 54a.4
    text: Onze Minister stelt nadere regels vast omtrent de toekenning van de uitkering, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel54a
  - number: '55.1'
    text: De vrouwelijke ambtenaar heeft in verband met haar bevalling aanspraak op zwangerschaps- en bevallingsverlof.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55
  - number: '55.2'
    text: |-
      De vrouwelijke ambtenaar heeft recht op zwangerschapsverlof vanaf de dag waarop de bevalling blijkens een
      verklaring van een arts of van een verloskundige waarin de vermoedelijke datum van de bevalling wordt aangegeven,
      binnen zes weken is te verwachten. Het verlof begint in ieder geval vier weken vóór deze datum. Het verlof wordt
      verlengd met het aantal dagen dat de werkelijke datum van bevalling later ligt dan de vermoedelijke datum van
      bevalling.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55
  - number: '55.3'
    text: |-
      De vrouwelijke ambtenaar heeft recht op bevallingsverlof van tien aaneengesloten weken vanaf de dag volgend op
      die van de bevalling. Het bevallingsverlof wordt verlengd met het aantal dagen dat het zwangerschapsverlof tot en
      met de vermoedelijke datum van bevalling minder dan zes weken heeft bedragen of tot ten hoogste zes weken met het
      aantal dagen dat de werkelijke datum van bevalling eerder ligt dan de vermoedelijke datum van bevalling.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55
  - number: '55.4'
    text: Gedurende het zwangerschaps- en bevallingsverlof behoudt de vrouwelijke ambtenaar haar aanspraak op bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55
  - number: '55.5'
    text: |-
      Indien de vrouwelijke ambtenaar aan wie verlof is verleend gedurende dat verlof tevens recht heeft op een
      financiële tegemoetkoming op basis van de [Wet arbeid en zorg][ref1], wordt gedurende de periode waarin sprake is
      van samenloop een inhouding op de doorbetaling van de bezoldiging als bedoeld in het vierde lid toegepast welke
      overeenkomt met het bedrag van de financiële tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: '55.6'
    text: |-
      Indien de vrouwelijke ambtenaar aan wie verlof is verleend gedurende dat verlof tevens recht heeft op een
      financiële tegemoetkoming op basis van de [Wet arbeid en zorg][ref1], maar geen financiële tegemoetkoming is
      toegekend omdat de vrouwelijke ambtenaar geen aanvraag heeft ingediend, kan het bevoegde gezag het vijfde lid op
      overeenkomstige wijze toepassen, mits zij schriftelijk is gewezen op de mogelijkheid van indienen van de aanvraag.
      In dat geval wordt rekening gehouden met de financiële tegemoetkoming die aan de vrouwelijke ambtenaar zou zijn
      toegekend indien zij wel een aanvraag zou hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 55a.1
    text: |-
      De ambtenaar is verplicht aan het bevoegd gezag, op een door dit gezag te bepalen wijze, opgave te doen van de
      nevenwerkzaamheden die hij verricht of voornemens is te gaan verrichten, die de belangen van de dienst voor zover
      deze in verband staan met zijn functievervulling, kunnen raken.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55a
  - number: 55a.2
    text: Het bevoegd gezag voert een registratie op grond van de ingevolge het eerste lid gedane opgaven.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55a
  - number: 55a.3
    text: |-
      De door de ambtenaren die deel uitmaken van de leiding van een regionaal politiekorps of het Klpd, van het College
      van Bestuur van het LSOP, of van de directie ITO gemelde nevenwerkzaamheden worden openbaar gemaakt met vermelding
      van eventueel door het desbetreffende bevoegd gezag aan het verrichten van nevenwerkzaamheden gestelde beperkingen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55a
  - number: 55a.4
    text: |-
      Het is de ambtenaar verboden nevenwerkzaamheden te verrichten waardoor de goede vervulling van zijn functie of het
      goed functioneren van de dienst, voor zover dit in verband staat met zijn functievervulling, niet in redelijkheid
      zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55a
  - number: 55a.5
    text: Het bevoegd gezag kan nadere regels stellen omtrent het verbod, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55a
  - number: 55b.1
    text: |-
      Het bevoegd gezag wijst de ambtenaren aan die werkzaamheden verrichten waaraan in het bijzonder het risico van
      financiële belangenverstrengeling of het risico van oneigenlijk gebruik van koersgevoelige informatie is verbonden.
      De aangewezen ambtenaar meldt de financiële belangen, alsmede het bezit van en transacties met effecten die de
      belangen van de dienst voor zover deze in verband staan met zijn functievervulling kunnen raken, aan een daartoe
      aangewezen functionaris.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55b
  - number: 55b.2
    text: Het bevoegd gezag voert een registratie van de op grond van het eerste lid gedane meldingen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55b
  - number: 55b.3
    text: |-
      De ambtenaar verstrekt nadere informatie of bescheiden met betrekking tot de financiële belangen of het bezit
      van of de transactie met effecten, indien daarvoor naar het oordeel van het bevoegd gezag of de door dit gezag
      aangewezen functionaris, bedoeld in het eerste lid, aanleiding bestaat op grond van de melding of na de melding
      gebleken feiten of omstandigheden.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55b
  - number: 55b.4
    text: |-
      Het is de ambtenaar verboden financiële belangen te hebben, effecten te bezitten of effectentransacties te
      verrichten waardoor de goede vervulling van zijn functie of het goed functioneren van de openbare dienst, voor
      zover dit in verband staat met zijn functievervulling, niet in redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55b
  - number: 55b.5
    text: Het bevoegd gezag kan nadere regels stellen omtrent het verbod, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55b
  - number: 55c
    text: |-
      Het is de ambtenaar verboden in zijn ambt geld, geschenken, diensten of kortingen te bedingen of, anders dan met
      goedvinden van het bevoegd gezag, aan te nemen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55c
  - number: 55d
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55d
  - number: 55d.a
    text: |-
      vermoeden van een misstand: een op redelijke gronden gebaseerd vermoeden van het zich voordoen in de organisatie
      waar de ambtenaar werkzaam is van een grove schending van wettelijke voorschriften of beleidsregels, een groot
      gevaar voor de gezondheid, de veiligheid of het milieu, dan wel een zeer onbehoorlijke wijze van functioneren, die
      het goed functioneren van de openbare dienst in gevaar kan brengen;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55d
  - number: 55d.b
    text: |-
      ambtenaar belast met de dagelijkse leiding over de organisatie: de korpschef, de directeur ITO, de voorzitter van
      het college van bestuur van het LSOP dan wel de directeur Rijksrecherche.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55d
  - number: 55e.1
    text: |-
      Onverminderd verplichtingen tot aangifte van strafbare feiten meldt de ambtenaar het vermoeden
      van een misstand aan zijn leidinggevende. Indien de ambtenaar melding aan zijn leidinggevende
      niet wenselijk acht, meldt hij het vermoeden aan de naast hogere leidinggevende of aan een daartoe
      door het bevoegd gezag aangewezen vertrouwenspersoon. Een ambtenaar van politie als bedoeld in
      [artikel 3, eerste lid, onder a en c, en tweede lid, van de Politiewet 1993][ref1] wordt niet aangewezen als
      vertrouwenspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel3
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55e
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '3'
  - number: 55e.2
    text: |-
      Indien zwaarwegende redenen in de weg staan aan de toepassing van de in het eerste lid bedoelde procedure, meldt de
      ambtenaar het vermoeden van een misstand schriftelijk rechtstreeks aan de Commissie integriteit overheid.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55e
  - number: 55f.1
    text: |-
      De leidinggevende of de vertrouwenspersoon, bedoeld in [artikel 55e, eerste lid][ref1], draagt er zorg voor dat de
      ambtenaar die is belast met de dagelijkse leiding over de organisatie, onverwijld via de gebruikelijke procedure
      schriftelijk op de hoogte wordt gesteld van het gemelde vermoeden van een misstand en van de datum waarop de
      melding is ontvangen. Indien de melding is gedaan bij de vertrouwenspersoon, vergewist deze zich ervan dat de
      ambtenaar heeft ingestemd met melding aan de ambtenaar die is belast met de dagelijkse leiding over de organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55e
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55f
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55e
        hoofdstuk: VII.a
        paragraaf: '2'
  - number: 55f.2
    text: De ambtenaar die is belast met de dagelijkse leiding over de organisatie
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55f
  - number: 55f.2.a
    text: |-
      bewerkstelligt dat onverwijld een onderzoek wordt gestart naar aanleiding van de melding van een vermoeden van
      een misstand;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55f
  - number: 55f.2.b
    text: |-
      bericht schriftelijk aan de betrokkene die een vermoeden van een misstand heeft gemeld het moment van die melding
      en de inhoud van die melding;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55f
  - number: 55f.2.c
    text: |-
      stelt het bevoegd gezag schriftelijk op de hoogte van de melding van een vermoeden van een misstand en de inhoud
      van die melding en
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55f
  - number: 55f.2.d
    text: |-
      informeert de persoon of personen op wie het gemelde vermoeden van een misstand betrekking heeft, dat een melding
      is gedaan, tenzij dit het onderzoeksbelang kan schaden.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55f
  - number: 55f.3
    text: |-
      Binnen acht weken na de melding wordt de ambtenaar die een vermoeden van een misstand heeft gemeld door de
      ambtenaar die is belast met de dagelijkse leiding over de organisatie, schriftelijk op de hoogte gebracht van het
      inhoudelijke standpunt van het bevoegd gezag omtrent het gemelde vermoeden.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55f
  - number: 55f.4
    text: |-
      Indien het standpunt niet binnen acht weken kan worden gegeven, stelt de ambtenaar die is belast met de dagelijkse
      leiding over de organisatie, de ambtenaar hiervan in kennis en vermeldt hij daarbij de termijn waarbinnen een
      standpunt tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55f
  - number: 55f.5
    text: |-
      Nadat het bevoegd gezag het standpunt omtrent het gemelde vermoeden heeft bepaald, stelt het de persoon of personen
      op wie het vermoeden van een misstand betrekking had schriftelijk op de hoogte van het standpunt alsmede van de
      melding, indien bedoelde persoon of personen daarover ingevolge het tweede lid, onderdeel d, niet eerder was of
      waren geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55f
  - number: 55g.1
    text: 'De ambtenaar kan het vermoeden van een misstand melden bij de Commissie integriteit overheid, indien:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55g
  - number: 55g.1.a
    text: |-
      hij het niet eens is met het standpunt van het bevoegd gezag, bedoeld in [artikel 55f, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55f
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55g
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55f
        hoofdstuk: VII.a
        paragraaf: '2'
  - number: 55g.1.b
    text: |-
      hij niet binnen de in [artikel 55f, derde lid][ref1], gestelde termijn een standpunt of een bericht als bedoeld in
      [artikel 55f, vierde lid][ref2], heeft ontvangen, of


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55f
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel55f
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55g
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55f
        hoofdstuk: VII.a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 55f
        hoofdstuk: VII.a
        paragraaf: '2'
  - number: 55g.1.c
    text: |-
      de termijn, bedoeld in [artikel 55f, vierde lid][ref1], onredelijk lang is.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55f
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55g
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55f
        hoofdstuk: VII.a
        paragraaf: '2'
  - number: 55g.2
    text: |-
      De ambtenaar meldt het vermoeden van een misstand bij de Commissie integriteit overheid, indien de situatie,
      bedoeld in [artikel 55e, tweede lid][ref1], zich voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55e
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55g
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55e
        hoofdstuk: VII.a
        paragraaf: '2'
  - number: 55g.3
    text: |-
      Binnen vier weken nadat de Commissie integriteit overheid advies heeft uitgebracht, deelt het bevoegd gezag
      de ambtenaar die het vermoeden van een misstand heeft gemeld schriftelijk gemotiveerd mee of het advies wordt
      opgevolgd. Een afschrift van deze mededeling wordt gezonden aan de Commissie integriteit overheid.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55g
  - number: 55g.4
    text: |-
      Het bevoegd gezag informeert de persoon of personen op wie het vermoeden van een misstand betrekking had over het
      advies, bedoeld in het derde lid, en het gevolg dat daaraan wordt gegeven, alsmede over de melding, indien bedoelde
      persoon of personen daarover niet eerder was of waren geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55g
  - number: 55h
    text: |-
      De in [artikel 55e, eerste lid][ref1], bedoelde vertrouwenspersoon wordt op geen enkele wijze benadeeld als gevolg
      van het uitoefenen van zijn taken krachtens deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55e
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55h
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55e
        hoofdstuk: VII.a
        paragraaf: '2'
  - number: 55i.1
    text: Bij een reorganisatie zijn de bepalingen van dit hoofdstuk van toepassing.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55i
  - number: 55i.2
    text: |-
      Onder reorganisatie als bedoeld in het eerste lid wordt verstaan: een wijziging van de organisatiestructuur, de
      omvang of de taakinhoud die belangrijke gevolgen hebben voor de werkgelegenheid in kwantitatieve en kwalitatieve
      zin van een regionaal politiekorps, het Korps landelijke politiediensten, het LSOP, ITO, een voorziening tot
      samenwerking of een onderdeel daarvan alsmede van het organisatieonderdeel waarin bijzondere ambtenaren van politie
      werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55i
  - number: 55i.3
    text: |-
      De bepalingen van dit hoofdstuk zijn van overeenkomstige toepassing op de overgang van een ambtenaar naar een
      private onderneming of zelfstandig bestuursorgaan in verband met de privatisering of verzelfstandiging van
      het dienstonderdeel van het regionaal politiekorps, het Korps landelijke politiediensten, het LSOP, ITO of een
      voorziening tot samenwerking waarbij de ambtenaar werkzaam is, tenzij bij algemene maatregel van bestuur anders
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55i
  - number: 55j.1
    text: |-
      Door of namens Onze Minister wordt de Commissie voor georganiseerd overleg in politie-ambtenarenzaken, bedoeld in
      het [Besluit overleg en medezeggenschap politie 1994][ref1], tijdig geïnformeerd over een voorgenomen besluit tot
      een reorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0006518
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55j
    references:
      - id: ref1
        bwb_id: BWBR0006518
  - number: 55j.2
    text: |-
      Door of namens het bevoegd gezag wordt de betrokken ondernemingsraad tijdig geïnformeerd over een voorgenomen
      besluit tot een reorganisatie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55j
  - number: 55k
    text: |-
      De ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd en de ambtenaar aangesteld in vaste dienst,
      van wie de functie in verband met een reorganisatie is opgeheven, wordt aangewezen als te herplaatsen ambtenaar,
      hierna te noemen: herplaatsingkandidaat.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55k
  - number: 55l.1
    text: |-
      De ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd en de ambtenaar aangesteld in vaste
      dienst, die in verband met een reorganisatie boventallig zijn, dan wel de aspirant worden aangewezen als
      herplaatsingkandidaat. Van boventalligheid is sprake indien de binnen de te reorganiseren organisatie of een
      onderdeel daarvan, meer ambtenaren een vergelijkbare of uitwisselbare functie vervullen en het totale aantal van
      die functies zodanig wordt verminderd dat onvoldoende van die functies voor de betrokken ambtenaren resteren.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55l
  - number: 55l.2
    text: |-
      De ambtenaar die het geringste aantal jaren in overheidsdienst heeft doorgebracht wordt als eerste als
      herplaatsingkandidaat aangewezen. Voor de berekening van het aantal in overheidsdienst doorgebrachte jaren wordt
      mede in aanmerking genomen de tijd gewijd aan de verzorging van tot het huishouden van de ambtenaar behorende 0–4
      jarige eigen, stief- of pleegkinderen, tot een maximum van in totaal zes jaren.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55l
  - number: 55l.3
    text: |-
      Het bevoegd gezag kan van de volgorde in het tweede lid afwijken, nadat hij hiervoor de instemming heeft verkregen
      van de reorganisatiecommissie. Het bevoegd gezag dient een gemotiveerd verzoek in bij de reorganisatiecommissie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55l
  - number: 55l.4
    text: |-
      De reorganisatiecommissie wordt paritair samengesteld en bestaat uit drie leden. De reorganisatiecommissie brengt
      binnen zes weken na ontvangst van het verzoek een schriftelijk oordeel uit aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55l
  - number: 55m
    text: De ambtenaar wordt over zijn aanwijzing als herplaatsingkandidaat schriftelijk geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55m
  - number: 55n.1
    text: |-
      Onverminderd [artikel 91][ref1] is het bevoegd gezag verplicht om de herplaatsingkandidaat binnen een periode van
      twaalf maanden, te rekenen vanaf het moment dat de aanwijzing als herplaatsingkandidaat bekend is gemaakt of het
      moment waarover de herplaatsingkandidaat schriftelijk is geïnformeerd, ten minste twee maal een passende functie
      aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel91
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55n
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '91'
        hoofdstuk: X
  - number: 55n.2
    text: |-
      Het bevoegd gezag kan de termijn, bedoeld in het eerste lid, verlengen of opschorten, indien de omstandigheden naar
      zijn oordeel daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55n
  - number: 55n.3
    text: |-
      Indien het bevoegd gezag na twaalf maanden kan aantonen dat in het geheel geen passende functie kan worden
      aangeboden, wordt de termijn van twaalf maanden niet verlengd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55n
  - number: 55n.4
    text: |-
      De ambtenaar wordt gelijktijdig met zijn aanwijzing als herplaatsingkandidaat schriftelijk geïnformeerd over de
      aanvang en het einde van de periode bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55n
  - number: 55n.5
    text: Het bevoegd gezag informeert de herplaatsingkandidaat schriftelijk over het verlengen of opschorten van de periode.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55n
  - number: 55n.6
    text: |-
      Onverminderd het bepaalde in dit artikel is het bevoegd gezag, voor de duur van het dienstverband van de
      herplaatsingkandidaat, gehouden de herplaatsingkandidaat een passende functie aan te bieden.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55n
  - number: 55o.1
    text: |-
      Een passende functie is elke functie die voor de krachten en bekwaamheden van de herplaatsingkandidaat is berekend,
      tenzij aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan worden gevergd. Een
      passende functie is mogelijk zowel binnen het bereik van het bevoegd gezag als bij een andere werkgever.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55o
  - number: 55o.2
    text: |-
      Tevens is een passende functie elke functie waarvoor naar het oordeel van het bevoegd gezag de
      herplaatsingkandidaat binnen een termijn van twee jaar om-, her- of bijgeschoold kan worden.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55o
  - number: 55o.3
    text: 'Niet als passende functie wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55o
  - number: 55o.3.a
    text: |-
      indien de voor functie geldende salarisschaal meer dan twee schalen lager is dan de salarisschaal die geldt voor
      de herplaatsingkandidaat;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55o
  - number: 55o.3.b
    text: |-
      indien de voor functie geldende salarisschaal meer dan één schaal lager is dan de salarisschaal die geldt voor de
      herplaatsingkandidaat, ingedeeld in salarisschaal 4 of 5 van [bijlage I van het Besluit bezoldiging politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55o
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 55o.3.c
    text: |-
      indien de voor functie geldende salarisschaal lager is dan de salarisschaal van de herplaatsingkandidaat, ingedeeld
      in salarisschaal 3 of lager van [bijlage I van het Besluit bezoldiging politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55o
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 55o.3.d
    text: |-
      indien de reistijd van en naar de werkplek van de functie meer dan drie uur per dag bedraagt, tenzij de
      gebruikelijke reistijd voor de herplaatsingkandidaat van en naar de plaats van tewerkstelling al meer dan drie uur
      per dag bedraagt.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55o
  - number: 55o.4
    text: |-
      Voor de toepassing van het derde lid, onderdelen a, b en c, dient voor een passende functie bij een andere
      werkgever het maximaal te genieten salaris te worden vergeleken met het maximumsalaris van een salarisschaal van
      [bijlage I van het Besluit bezoldiging politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55o
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 55p
    text: |-
      Het bevoegd gezag kan de naar zijn oordeel meest geschikte herplaatsingkandidaat, voor wie de functie als passend
      wordt aangemerkt, herplaatsen in die functie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55p
  - number: 55q.1
    text: |-
      Onverminderd [artikel 55n][ref1] is de herplaatsingkandidaat verplicht, voor zover dat redelijkerwijs van hem kan
      worden gevergd, om zelf een passende functie te zoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55n
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55q
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55n
        hoofdstuk: VII.b
  - number: 55q.2
    text: Behoudens het eerste aanbod is de herplaatsingkandidaat verplicht een passende functie te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55q
  - number: 55r.1
    text: |-
      De herplaatsingkandidaat die slechts in een voor hem passende functie kan worden herplaatst na om- her- of
      bijscholing kan hiertoe worden verplicht, voor zover dat redelijkerwijs van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55r
  - number: 55r.2
    text: |-
      Aan de ambtenaar die op grond van het eerste lid is verplicht om scholing te volgen, wordt een volledige vergoeding
      van de noodzakelijk te maken scholingskosten toegekend.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55r
  - number: 55r.3
    text: |-
      Aan de ambtenaar die op grond van het eerste lid is verplicht om scholing te volgen, wordt studieverlof met behoud
      van bezoldiging verleend, tenzij een zwaarwegend dienstbelang zich hier tegen verzet.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55r
  - number: 55s
    text: |-
      Het mobiliteitscentrum Nederlandse politie stelt in overleg met het bevoegd gezag van de herplaatsingkandidaat een
      inventarisatie op van zijn competenties en mogelijkheden voor een passende functie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55s
  - number: 55t.1
    text: |-
      De herplaatsingkandidaat die een passende functie aanvaardt bij een andere werkgever wordt een loonsuppletie
      toegekend indien het genoten loon van die functie lager is dan het loon in de oorspronkelijke functie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55t
  - number: 55t.2
    text: |-
      De loonsuppletie wordt toegekend gedurende vijf jaar. Afhankelijk van het aantal dienstjaren van de ambtenaar wordt
      de termijn van vijf jaar verlengd overeenkomstig de hierna volgende tabel:






                    dienstjaren:


                    verlenging:






                    25 of meer dienstjaren


                    één jaar




                    30 of meer dienstjaren


                    twee jaren




                    35 of meer dienstjaren


                    drie jaren




                    40 of meer dienstjaren


                    vier jaren
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55t
  - number: 55t.3
    text: |-
      Na afloop van een kalenderjaar vraagt de herplaatsingkandidaat, die herplaatst is bij een andere werkgever, de
      loonsuppletie aan. De aanvraag is vergezeld van een door de werkgever verstrekte jaaropgave van het loon.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55t
  - number: 55t.4
    text: |-
      De suppletie is ten hoogste gelijk aan het verschil tussen het in de oorspronkelijke functie genoten jaarloon en
      het jaarloon van de nieuwe functie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55t
  - number: 55t.5
    text: |-
      De loonsuppletie wordt eenmaal per jaar vastgesteld en uitgekeerd. Het bevoegd gezag kan maandelijks een voorschot
      van de suppletie verstrekken.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55t
  - number: 55u
    text: Onze minister stelt nadere regels vast ter uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel55u
  - number: '56.1'
    text: |-
      De verstrekking van uniformkleding aan de aspirant, de ambtenaar, aangesteld voor de uitvoering van de politietaak
      en de ambtenaar, aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van
      de politie, die door het bevoegd gezag is aangewezen, alsmede het onderhoud daarvan geschieden door de zorg van
      het bevoegd gezag. De verstrekking van uniformkleding geschiedt kosteloos. Onze Minister stelt ter zake van de
      verstrekking van uniformkleding nadere regels vast.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel56
  - number: '56.2'
    text: |-
      De verstrekking van dienstkleding aan de aspirant, de ambtenaar aangesteld voor de uitvoering van de politietaak,
      de bijzondere ambtenaar van politie en de ambtenaar, aangesteld voor de uitvoering van technische, administratieve
      en andere taken ten dienste van de politie, die door het bevoegd gezag is aangewezen, alsmede het onderhoud daarvan
      geschieden door de zorg van het bevoegd gezag. De verstrekking van dienstkleding geschiedt kosteloos. Bij regeling
      van Onze Minister worden ter zake van de verstrekking van dienstkleding nadere regels vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel56
  - number: '56.3'
    text: |-
      De ambtenaar, bedoeld in het eerste lid, is verplicht het uniform en de onderscheidingstekenen te dragen, voor
      zover dit voor hem voorgeschreven is.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel56
  - number: '56.4'
    text: |-
      Het buiten dienst gekleed gaan in uniform is geoorloofd, behalve tijdens het vervullen van een nevenbetrekking of
      bij het verrichten van werkzaamheden ten behoeve van derden, in welke vorm dan ook. Van dit verbod kan alleen ten
      aanzien van uit de openbare kas bezoldigde ambten door Onze Minister ontheffing worden verleend.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel56
  - number: '57.1'
    text: |-
      Het is de ambtenaar, bedoeld in [artikel 56, eerste lid][ref1], verboden in dienst uniformkledingstukken te dragen,
      tenzij deze van dienstwege zijn verstrekt of voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel56
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '56'
        hoofdstuk: VIII
  - number: '57.2'
    text: |-
      Het is de ambtenaar, bedoeld in [artikel 56, eerste lid][ref1], verboden bij gekleed gaan in uniform insignes of
      andere onderscheidingstekens te dragen, tenzij deze van regeringswege zijn verstrekt of voorgeschreven of tot het
      dragen daarvan door het bevoegd gezag vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel56
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '56'
        hoofdstuk: VIII
  - number: '58.1'
    text: |-
      Aan de ambtenaar, aangesteld voor de uitvoering van de politietaak of voor de uitvoering van technische,
      administratieve en andere taken ten dienste van de politie en de bijzondere ambtenaar van politie kunnen
      studiefaciliteiten worden verleend.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel58
  - number: '58.2'
    text: |-
      Het bevoegd gezag kent studiefaciliteiten toe voor functiegerichte opleidingen tenzij zwaarwegende redenen van
      dienstbelang zich hiertegen verzetten.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel58
  - number: '58.3'
    text: |-
      Het bevoegd gezag kan studiefaciliteiten toekennen voor opleidingen die niet functiegericht zijn of voor
      opleidingen die zijn gericht op een functie buiten de politieorganisatie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel58
  - number: '58.4'
    text: Het bevoegd gezag stelt nadere regels met betrekking tot het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel58
  - number: '59'
    text: |-
      De aspirant, de ambtenaar, aangesteld voor de uitvoering van de politietaak en de ambtenaar, aangesteld voor de
      uitvoering van technische, administratieve en andere taken ten dienste van de politie, die opsporingsbevoegdheid
      bezit, of de bijzondere ambtenaar van politie kunnen zich niet beroepen op de omstandigheid niet in dienst te zijn,
      in die gevallen, waarin hun optreden redelijkerwijze is vereist.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel59
  - number: '60'
    text: |-
      Indien de ambtenaar verhinderd is zijn dienst te verrichten, is hij verplicht daarvan, onder opgave van redenen, zo
      spoedig mogelijk mededeling te doen op de door het bevoegd gezag aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel60
  - number: '61.1'
    text: |-
      De ambtenaar kan worden verplicht te gaan of te blijven wonen in of nabij de gemeente waarbinnen de plaats van
      tewerkstelling is gelegen, indien dit naar het oordeel van het bevoegd gezag noodzakelijk is in verband met de
      goede vervulling van zijn functie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel61
  - number: '61.2'
    text: |-
      De ambtenaar aan wie de verplichting is opgelegd in of nabij de in het eerste lid bedoelde gemeente te gaan wonen,
      is gehouden zo spoedig mogelijk, maar uiterlijk twee jaar nadat die verplichting is opgelegd, daaraan gevolg te
      geven.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel61
  - number: '62.1'
    text: |-
      Het bevoegd gezag kan in het belang van de dienst, in overeenstemming met de ambtenaar, met ingang van een door het
      ter zake bevoegd gezag te bepalen tijdstip, een ambtenaar detacheren:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel62
  - number: 62.1.a
    text: |-
      bij het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties, mits de detachering op aanvraag van of in
      overeenstemming met Onze Minister plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel62
  - number: 62.1.b
    text: |-
      bij het Ministerie van Justitie, mits de detachering, indien het een ambtenaar, werkzaam bij een regionaal
      politiekorps of bij het Korps landelijke politiediensten betreft, op aanvraag van of in overeenstemming met Onze
      Minister van Justitie plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel62
  - number: 62.1.c
    text: |-
      bij een regionaal politiekorps of bij het Korps landelijke politiediensten, mits de detachering op aanvraag van of
      in overeenstemming met de desbetreffende korpsbeheerder respectievelijk Onze Minister plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel62
  - number: 62.1.d
    text: |-
      bij het LSOP, mits de detachering op aanvraag van of in overeenstemming met de bestuursraad van het instituut
      plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel62
  - number: 62.1.e
    text: |-
      bij een voorziening tot samenwerking, mits de detachering op aanvraag van of in overeenstemming met de voorzitter
      van het algemeen bestuur van de desbetreffende voorziening tot samenwerking plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel62
  - number: 62.1.f
    text: bij een door Onze Minister aan te wijzen organisatie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel62
  - number: '62.2'
    text: |-
      Indien de ambtenaar, bedoeld in het eerste lid, bij koninklijk besluit is aangesteld, is voor de detachering de
      instemming van Onze Minister vereist.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel62
  - number: '63.1'
    text: |-
      De ambtenaar die in een deelbetrekking is aangesteld en die op aanwijzing of met goedkeuring van het bevoegd
      gezag een opleiding volgt, is verplicht aan die opleiding deel te nemen als ware hij in een volledige betrekking
      aangesteld.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel63
  - number: '63.2'
    text: |-
      Voor zolang het eerste lid meebrengt dat de arbeidstijd die de betrekking van de
      ambtenaar omvat, wordt overschreden, wordt hem een vergoeding toegekend met toepassing van
      [artikel 27 van het Besluit bezoldiging politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel27
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '27'
  - number: '63.3'
    text: |-
      De in het eerste lid gestelde verplichting geldt niet ten aanzien van die opleidingen, waarvoor een programma is
      vastgesteld dat uitdrukkelijk voorziet in de mogelijkheid van deelname door ambtenaren, die een deelbetrekking
      vervullen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel63
  - number: '64'
    text: |-
      Indien het belang van de dienst dit in bijzondere gevallen vordert, is de ambtenaar verplicht zijn functie op een
      andere dan de hem aangewezen plaats van tewerkstelling of binnen een ander dan het hem aangewezen werkgebied uit te
      oefenen of, al dan niet op een andere dan de hem aangewezen plaats van tewerkstelling of binnen een ander dan het
      hem aangewezen werkgebied, een andere functie dan die waarin hij is aangesteld, mits dit redelijk is in verband met
      zijn persoonlijkheid, omstandigheden en vooruitzichten.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel64
  - number: '65'
    text: |-
      Op aanvraag van de ambtenaar kan hem een andere functie worden opgedragen, al dan niet op een andere dan de hem
      aangewezen plaats van tewerkstelling of binnen een ander dan het hem aangewezen werkgebied, of kan hem op aanvraag
      worden opgedragen zijn functie op een andere dan de aangewezen plaats van tewerkstelling dan wel een ander dan het
      aangewezen werkgebied uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel65
  - number: '67.1'
    text: |-
      Van de ambtenaar en de gewezen ambtenaar die geheel of gedeeltelijk op kosten van de regio, het Rijk, het LSOP of
      een voorziening tot samenwerking een opleiding hebben verkregen, kunnen deze kosten geheel of gedeeltelijk worden
      teruggevorderd indien:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel67
  - number: 67.1.a
    text: |-
      de opleiding niet met goed gevolg is afgerond door toedoen van de ambtenaar of in het geval het niet met goed
      gevolg afronden aan eigen schuld van de ambtenaar is te wijten;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel67
  - number: 67.1.b
    text: |-
      de opleiding voortijdig wordt beëindigd door toedoen van de ambtenaar of in het geval de beëindiging aan eigen
      schuld van de ambtenaar is te wijten;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel67
  - number: 67.1.c
    text: |-
      de ambtenaar binnen een periode van drie jaar na afronding van de opleiding de politie verlaat tenzij de ambtenaar
      het vertrek niet is toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel67
  - number: '67.2'
    text: |-
      In beginsel geldt de verplichting uit het eerste lid niet bij een ontslag op grond van [artikel 91][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel91
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '91'
        hoofdstuk: X
  - number: '67.3'
    text: |-
      Tot terugvordering van de kosten, bedoeld in het eerste lid, kan slechts worden overgegaan indien de ambtenaar
      schriftelijk heeft verklaard bekend te zijn met de mogelijkheid van terugvordering en de kosten die voor de
      terugvordering in aanmerking kunnen komen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel67
  - number: '67.4'
    text: |-
      De terugvordering, bedoeld in het eerste lid onder c, geschiedt binnen drie maanden na de datum waarop de ambtenaar
      de politie heeft verlaten. Bij de berekening van de terug te betalen kosten wordt rekening gehouden met het reeds
      verstreken deel van de periode van drie jaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel67
  - number: '67.5'
    text: Het bevoegd gezag stelt over de uitvoering van het eerste lid nadere regels vast.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel67
  - number: '68.1'
    text: |-
      Het bevoegd gezag kan de ambtenaar verplichten de door de dienst geleden schade, voor zover deze aan de ambtenaar
      is te wijten, geheel of gedeeltelijk te vergoeden. Ten aanzien van gevallen waarin de schade minder bedraagt dan €
      226,89 kan de korpschef dan wel, indien het een aspirant betreft, de directeur van een instelling, de in de eerste
      volzin bedoelde bevoegdheid uitoefenen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel68
  - number: '68.2'
    text: |-
      Het bedrag van de schadevergoeding wordt niet vastgesteld dan nadat de ambtenaar in de gelegenheid is gesteld zich
      schriftelijk of mondeling te verantwoorden.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel68
  - number: '69.1'
    text: |-
      Aan de ambtenaar wordt de schade aan zijn goederen vergoed die hij buiten zijn schuld lijdt ten gevolge van de
      uitoefening van zijn dienst, voor zover die schade niet bestaat uit de normale slijtage van die goederen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel69
  - number: '69.2'
    text: |-
      De ambtenaar heeft geen aanspraak, bedoeld in het eerste lid, indien hij ter zake van die schade rechten tegenover
      derden kan doen gelden. Indien de ambtenaar zijn rechten tegenover derden aan de regio, het Rijk, het LSOP dan wel
      aan een voorziening tot samenwerking cedeert, wordt hij in het genot gesteld van het in geld uitgedrukte bedrag van
      de schade.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel69
  - number: '69.3'
    text: |-
      Aan de ambtenaar wordt de immateriële schade die hij ten gevolge van de uitoefening van zijn dienst lijdt in geld
      vergoed, voor zover hij terzake van deze schade op basis van een onherroepelijke rechterlijke uitspraak tegenover
      derden rechten op betaling van een geldsom kan doen gelden en mits hij deze rechten binnen zes maanden na de
      definitieve rechterlijke uitspraak cedeert aan de regio, de Staat der Nederlanden dan wel aan het LSOP.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel69
  - number: '69.4'
    text: |-
      Indien de regio, het Rijk, het LSOP dan wel een voorziening tot samenwerking ter zake van de door voornoemde
      cessies verkregen rechten een civiele vordering instelt, worden de kosten die hieruit voor de regio, het Rijk, het
      LSOP dan wel een voorziening tot samenwerking voortvloeien, niet op de ambtenaar verhaald.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel69
  - number: 69a.1
    text: |-
      Indien de ambtenaar wegens de uitvoering van de politietaak aansprakelijk wordt gesteld naar burgerlijk recht
      of als verdachte wordt aangemerkt naar strafrecht, kent het bevoegd gezag hem een tegemoetkoming in de kosten
      van rechtskundige hulp toe, tenzij hij naar het oordeel van het bevoegd gezag opzettelijk onrechtmatig dan wel
      opzettelijk wederrechtelijk of bewust roekeloos heeft gehandeld, of grof nalatig is geweest.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel69a
  - number: 69a.2
    text: |-
      Indien de ambtenaar schadevergoeding vordert op grond van onrechtmatige daad, jegens hem gepleegd tijdens de
      uitoefening van de politietaak, kent het bevoegd gezag hem een tegemoetkoming in de kosten van rechtskundige
      hulp toe, tenzij het bevoegd gezag van oordeel is dat de vordering kennelijk onvoldoende grond heeft of kennelijk
      onredelijk is.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel69a
  - number: 69a.3
    text: |-
      Het eerste en het tweede lid zijn van overeenkomstige toepassing indien de rechtskundige hulp aan de
      ambtenaar is verleend, op grond van zijn lidmaatschap, door een centrale of een vereniging als bedoeld in
      [artikel 2, tweede lid, van het Besluit overleg en medezeggenschap politie 1994][ref1], met dien verstande dat
      de tegemoetkoming in de kosten van rechtskundige hulp rechtstreeks wordt betaald aan voornoemde centrale of
      vereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel2
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '2'
  - number: 69a.4
    text: |-
      Het bevoegd gezag kan verdere tegemoetkoming in de kosten van rechtskundige hulp staken of de tegemoetkoming in de
      kosten van de rechtskundige hulp terugvorderen, indien
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel69a
  - number: 69a.4.a
    text: |-
      de aan een derde toegebrachte schade blijkens rechterlijk vonnis het gevolg is van opzettelijk onrechtmatig dan wel
      opzettelijk wederrechtelijk of bewust roekeloos handelen van de ambtenaar, of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel69a
  - number: 69a.4.b
    text: indien de ambtenaar strafrechtelijk wordt veroordeeld.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel69a
  - number: 69a.5
    text: |-
      In bijzondere gevallen, gelet op de aard van de zaak of de omstandigheden van de ambtenaar, kan het bevoegd
      gezag, overwegend dat de handeling geen gevolg is van de taakuitoefening van de ambtenaar, besluiten tot een
      tegemoetkoming in de kosten van rechtskundige hulp.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel69a
  - number: 69a.6
    text: Het bevoegd gezag stelt een regeling vast met betrekking tot tegemoetkoming in de kosten van rechtskundige hulp.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel69a
  - number: '70.1'
    text: |-
      De ambtenaar die in contact staat of kort geleden heeft gestaan met een persoon die een ziekte heeft waarvoor
      krachtens de [Infectieziektenwet][ref1] een nominatieve aangifteplicht geldt, mag zijn dienst niet verrichten en
      heeft geen toegang tot dienstgebouwen, -lokalen en -terreinen dan met toestemming van het bevoegd gezag, dat deze
      toestemming slechts kan verlenen na een positief medisch advies als bedoeld in [hoofdstuk VII][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009684
      [ref2]: https://wetten.overheid.nl/BWBR0006516#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0009684
      - id: ref2
        bwb_id: BWBR0006516
        hoofdstuk: VII
  - number: '70.2'
    text: |-
      De ambtenaar die verkeert in de situatie, bedoeld in het eerste lid, is verplicht daarvan ten spoedigste kennis te
      geven aan de deskundige persoon of de arbodienst. Hij is gehouden zich te gedragen naar de vanwege de deskundige
      persoon of de arbodienst gegeven aanwijzingen, waaronder die met betrekking tot het ondergaan van een geneeskundig
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel70
  - number: '70.3'
    text: |-
      Gedurende de periode dat de ambtenaar ingevolge dit artikel zijn dienst niet verricht, geniet hij volle
      bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel70
  - number: '71.1'
    text: |-
      Met inachtneming van de door het bevoegd gezag ter zake vastgestelde regels wordt met de ambtenaar ten minste
      een maal per jaar een gesprek gehouden over de vervulling van zijn functie in de afgelopen en komende periode en
      de voortgang van een persoonlijk ontwikkelingsplan als bedoeld in [artikel 72][ref1]. In het gesprek wordt ook
      aandacht besteed aan integriteitsaspecten in relatie tot het functioneren van de ambtenaar en het functioneren van
      het dienstonderdeel waar hij werkzaam is. De hoofdzaken van dit gesprek worden in overeenstemming met de ambtenaar
      in een door de ambtenaar medeondertekend document vastgelegd. De ambtenaar ontvangt een afschrift van dit document.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel72
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '72'
        hoofdstuk: VIII
  - number: '71.2'
    text: |-
      Met inachtneming van de door het bevoegd gezag ter zake vastgestelde regels wordt de ambtenaar die een aanvraag
      daartoe indient dan wel ten aanzien van wie dit door het bevoegd gezag nodig wordt geacht, beoordeeld over de wijze
      waarop hij zijn functie vervult en zijn gedragingen tijdens de uitoefening van die functie. Aan de aanvraag van de
      ambtenaar om overeenkomstig dit lid te worden beoordeeld, wordt niet eerder voldaan dan na het verstrijken van één
      jaar sedert de vastlegging van de voorafgaande over hem uitgebrachte beoordeling.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel71
  - number: '71.3'
    text: |-
      Met inachtneming van de door het bevoegd gezag ter zake vastgestelde regels worden toekomstverwachtingen
      opgemaakt over de ambtenaar die in beschouwing wordt genomen voor een naar verwachting binnen afzienbare tijd
      vrijkomende hogere functie in het korps dan wel binnen het LSOP of een voorziening tot samenwerking. Ook kunnen
      toekomstverwachtingen worden opgemaakt voor een ambtenaar die in de nabije toekomst een verplaatsing naar een
      andere niet hogere functie in het korps dan wel binnen het LSOP of een voorziening tot samenwerking aanvraagt of
      ten aanzien van wie een dergelijke verplaatsing wenselijk wordt geacht, mits de mogelijkheid tot een dergelijke
      verplaatsing reëel aanwezig is en de korpschef, de directie van het LSOP dan wel de voorzitter van het algemeen
      bestuur van een voorziening tot samenwerking instemt met de wens van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel71
  - number: '71.4'
    text: |-
      Onder toekomstverwachting wordt in dit verband verstaan: een systematische bezinning op de behoeften en potentiële
      capaciteiten van de ambtenaar, bekeken in het kader van de mogelijkheden binnen het desbetreffende korps, het LSOP
      dan wel een voorziening tot samenwerking, welke bezinning uitmondt in concrete afspraken alsmede het daarop tijdig
      actie ondernemen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel71
  - number: '71.5'
    text: |-
      De ambtenaar wordt van de inhoud van de over hem opgemaakte beoordeling, bedoeld in het tweede lid, of de over hem
      opgemaakte toekomstverwachting, bedoeld in het derde en vierde lid, in kennis gesteld nadat deze door het bevoegd
      gezag is bekrachtigd. Hij ontvangt een afschrift van het document dat de over hem opgemaakte beoordeling of de
      toekomstverwachting bevat. Hij ondertekent dit document voor kennisgeving van de inhoud en voor ontvangst ervan.
      Hij kan zijn bezwaren tegen de over hem opgemaakte beoordeling of toekomstverwachting overeenkomstig de door het
      bevoegd gezag vastgestelde regels aan het bevoegd gezag kenbaar maken en om herziening verzoeken.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel71
  - number: '71.6'
    text: Onze Minister kan ter uitvoering van dit artikel nadere regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel71
  - number: '72'
    text: |-
      Met inachtneming van de door Onze Minister ter zake vastgestelde gespreksleidraad wordt met de ambtenaar ten
      minste eenmaal per drie jaar een gesprek gehouden over een persoonlijk ontwikkelingsplan. Op aanvraag van de
      ambtenaar dan wel in overleg met de ambtenaar kan het bevoegd gezag bepalen dat een gesprek over een persoonlijk
      ontwikkelingsplan plaatsvindt met een grotere frequentie dan eenmaal per drie jaar, doch met een maximum van
      eenmaal per jaar. De hoofdzaken van dit gesprek worden in overeenstemming met de ambtenaar in een door de ambtenaar
      medeondertekend document vastgelegd. De ambtenaar ontvangt een afschrift van dit document.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel72
  - number: 72a
    text: |-
      Een diploma verbonden aan het voltooien van een initiële opleiding, die de ambtenaar is begonnen vóór 1 januari
      2002, wordt voor wat betreft de benoembaarheid van de ambtenaar in een functie, bij nader door Onze Minister te
      stellen regels, gelijkgesteld aan een diploma verbonden aan een voltooide initiële opleiding van na 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel72a
  - number: '73.1'
    text: |-
      Aan de ambtenaar kan door het bevoegd gezag de toegang tot de dienstlokalen, dienstgebouwen, dienstterreinen, dan
      wel het verblijf aldaar, worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel73
  - number: '73.2'
    text: |-
      Hij is verplicht zich te gedragen naar de maatregelen van orde die ten aanzien van het verblijf op voornoemde
      plaatsen zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel73
  - number: '74.1'
    text: De ambtenaar kan wegens buitengewone toewijding of bijzonder loffelijke dienstverrichtingen worden beloond.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel74
  - number: '74.2'
    text: 'De beloningen zijn:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel74
  - number: 74.2.a
    text: tevredenheidsbetuiging;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel74
  - number: 74.2.b
    text: extra verlof;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel74
  - number: 74.2.c
    text: gratificatie;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel74
  - number: 74.2.d
    text: verhoging van het salaris tot het naasthogere bedrag in de salarisschaal of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel74
  - number: 74.2.e
    text: indeling in een hogere salarisschaal.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel74
  - number: '75.1'
    text: |-
      Het bevoegd gezag verstrekt aan de ambtenaar bij zijn twaalfeneenhalf-, 25-, 40-, of 50-jarig ambtsjubileum een
      huldeblijk, bestaande uit een gratificatie of geschenk, dan wel uit een combinatie van beide.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel75
  - number: '75.2'
    text: |-
      De aan het huldeblijk verbonden uitgaven bedragen bij de in het eerste lid genoemde ambtsjubilea respectievelijk
      niet meer dan vijfentwintig, vijftig, honderd en honderd procent van de som van de bezoldiging en de
      vakantieuitkering van de ambtenaar. Voor de gedeeltelijk arbeidsongeschikte ambtenaar worden de in de eerste volzin
      vermelde percentages genomen van de bezoldiging en de vakantie-uitkering die de ambtenaar zou hebben genoten indien
      er geen sprake zou zijn geweest van gedeeltelijke arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel75
  - number: '75.3'
    text: |-
      Het bevoegd gezag kent aan de ambtenaar die een diensttijd bij de politie heeft van tien jaar of meer en aan wie
      ontslag is verleend op grond van:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel75
  - number: 75.3.a
    text: |-
      [artikel 91][ref1],

      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel91
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '91'
        hoofdstuk: X
  - number: 75.3.b
    text: |-
      [artikel 94, eerste lid, onderdeel e][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel94
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '94'
        hoofdstuk: X
  - number: 75.3.c
    text: |-
      [artikel 94, eerste lid, onderdeel f][ref1], voor zover dit ontslag is verleend in verband met het vanuit ziekte
      verrichten van passende arbeid bij een andere werkgever dan een overheidswerkgever, een gratificatie toe, tenzij
      bij voortduring van het dienstverband niet binnen een termijn van vijf jaar aanspraak op een gratificatie bij
      ambtsjubileum zou bestaan. De gratificatie bedraagt een in verhouding tot de doorgebrachte diensttijd evenredig
      gedeelte van de eerstvolgende gratificatie bij ambtsjubileum waarop hij bij het voortduren van het dienstverband
      aanspraak zou maken.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel94
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '94'
        hoofdstuk: X
  - number: '75.4'
    text: |-
      Het bevoegd gezag kent aan de ambtenaar die de zestigjarige leeftijd heeft bereikt en aan wie ontslag is verleend
      op grond van [artikel 88][ref1] een gratificatie toe op voet van het tweede lid, indien hij bij het voortduren van
      het dienstverband tot het bereiken van de 65-jarige leeftijd aanspraak zou maken op een gratificatie bij 40- of 50-
      jarig ambtsjubileum.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '88'
        hoofdstuk: X
  - number: '75.5'
    text: |-
      Onze Minister stelt regels over de diensttijd die voor de vaststelling van de in het eerste lid genoemde
      ambtsjubilea in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel75
  - number: '76.1'
    text: |-
      De ambtenaar die de hem opgelegde verplichtingen niet nakomt of zich overigens aan plichtsverzuim schuldig maakt,
      kan disciplinair worden gestraft.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel76
  - number: '76.2'
    text: |-
      Plichtsverzuim omvat zowel het overtreden van een voorschrift als het doen of nalaten van iets dat een goed
      ambtenaar in gelijke omstandigheden behoort na te laten of te doen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel76
  - number: '77.1'
    text: 'De straffen die kunnen worden opgelegd, zijn:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
  - number: 77.1.a
    text: schriftelijke berisping;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
  - number: 77.1.b
    text: |-
      buitengewone dienst op andere dagen dan op zondag en de voor de ambtenaar geldende kerkelijke feestdagen en vrije
      dagen zonder beloning of tegen een lagere dan de normale beloning en wel voor ten hoogste zes uren met een maximum
      van drie uren per dag;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
  - number: 77.1.c
    text: |-
      vermindering van het recht op een jaarlijkse vakantie met ten hoogste een vierde gedeelte van het aantal uren,
      bedoeld in [artikel 17][ref1], waarop in het desbetreffende kalenderjaar aanspraak bestaat;


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel17
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '17'
        hoofdstuk: IV
  - number: 77.1.d
    text: geldboete van ten hoogste € 22;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
  - number: 77.1.e
    text: gedeeltelijke inhouding van salaris tot een bedrag van ten hoogste het salaris over een halve maand;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
  - number: 77.1.f
    text: vermindering van het salarisnummer met ten hoogste twee jaren, voor de tijd van niet langer dan twee jaren;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
  - number: 77.1.g
    text: |-
      het niet meetellen van een verdere diensttijd van ten hoogste vier jaren voor de vaststelling van het
      salarisnummer;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
  - number: 77.1.h
    text: schorsing voor een bepaalde tijd met gehele of gedeeltelijke inhouding van de bezoldiging of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
  - number: 77.1.i
    text: plaatsing in een salarisschaal waarvoor een lager maximumsalaris geldt;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
  - number: 77.1.j
    text: ontslag.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
  - number: '77.2'
    text: |-
      Aan aspiranten kan tevens worden opgelegd de straf van verwijdering voor ten hoogste veertien dagen van de
      instelling waar de aspirant zijn opleiding geniet, met dien verstande dat deze straf niet wordt opgelegd op de
      dagen waarop de opleidingsresultaten van de aspiranten volgens de ter zake vastgestelde regels worden getoetst
      of beoordeeld.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
  - number: '77.3'
    text: |-
      Onverminderd het vierde lid, worden de straffen, bedoeld in het eerste lid, opgelegd door het bevoegd gezag, met
      dien verstande dat van de bevoegdheid tot het opleggen van de straffen, bedoeld in het eerste lid, onderdelen a
      tot en met g, mandaat kan worden verleend aan de korpschef, het college van bestuur van het LSOP dan wel aan de
      voorzitter van het algemeen bestuur van de voorziening tot samenwerking.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
  - number: '77.4'
    text: |-
      Indien het een ambtenaar betreft die bij koninklijk besluit is benoemd, worden de straffen, bedoeld in het eerste
      lid, onderdelen b tot en met f, opgelegd door het bevoegd gezag en worden de straffen, bedoeld in het eerste lid,
      onderdelen h tot en met j, opgelegd bij koninklijk besluit. Indien het een ambtenaar betreft, werkzaam bij een
      regionaal politiekorps, bij het Korps landelijke politiediensten of bij een voorziening tot samenwerking, die bij
      koninklijk besluit is benoemd, worden de straffen, bedoeld in het eerste lid, onderdelen a en g, opgelegd door Onze
      Minister. Indien het een bijzondere ambtenaar van politie betreft, die bij koninklijk besluit is benoemd, worden
      de straffen, bedoeld in het eerste lid, onderdelen a en g, opgelegd door Onze Minister van Justitie. Indien het een
      ambtenaar betreft, werkzaam bij het LSOP, die bij koninklijk besluit is benoemd, worden de straffen, bedoeld in het
      eerste lid, onderdelen a en g, opgelegd door Onze Minister van Justitie en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
  - number: '77.5'
    text: |-
      Indien een straf als bedoeld in het eerste lid, onderdeel g, is opgelegd, kan het bevoegd gezag de positie van de
      ambtenaar met ingang van een bepaald tijdstip geheel of ten dele in overeenstemming brengen met de positie zoals
      deze zonder strafoplegging zou zijn geweest, indien het verdere gedrag van de ambtenaar naar het oordeel van het
      bevoegd gezag daartoe aanleiding heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel77
  - number: '78.1'
    text: |-
      Bij het opleggen van een straf kan worden bepaald dat deze niet ten uitvoer zal worden gelegd, indien de
      ambtenaar zich gedurende de bij het opleggen van de straf te bepalen termijn niet schuldig maakt aan soortgelijk
      plichtsverzuim als waarvoor de bestraffing plaatsvindt, noch aan enig ander ernstig plichtsverzuim en zich houdt
      aan bij het opleggen van de straf eventueel te stellen bijzondere voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel78
  - number: '78.2'
    text: |-
      Indien met toepassing van het eerste lid de straf van ontslag wordt opgelegd, kan tegelijk met deze straf één van
      de in [artikel 77, eerste lid, onderdelen ][ref1] genoemde straffen worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel77
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '77'
        hoofdstuk: IX
  - number: '79.1'
    text: |-
      Indien de ambtenaar gebruik maakt van de mogelijkheid zich te verantwoorden in het geval dat het bevoegd gezag
      voornemens is hem een straf op te leggen, geschiedt de verantwoording ten overstaan van het gezag dat tot
      strafoplegging bevoegd is. Indien de bevoegdheid tot strafoplegging bij Ons berust, geschiedt de verantwoording bij
      Onze Minister en Onze Minister van Justitie. Het gezag ten overstaan waarvan de verantwoording plaats zal hebben,
      bepaalt of deze verantwoording mondeling of schriftelijk zal plaatsvinden. Bij schriftelijke verantwoording wordt
      de ambtenaar op zijn verzoek de gelegenheid gegeven tot nadere mondelinge toelichting.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel79
  - number: '79.2'
    text: |-
      Van de mondelinge verantwoording wordt direct een verslag opgemaakt, dat na voorlezing wordt getekend door degene
      tegenover wie de verantwoording heeft plaatsgevonden en door de ambtenaar. Indien de ambtenaar het verslag weigert
      te ondertekenen, wordt dit in het verslag, zo mogelijk met opgave van de redenen, vermeld. De ambtenaar ontvangt
      een afschrift van het verslag.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel79
  - number: '79.3'
    text: |-
      Indien de ambtenaar dit verlangt, worden hem of zijn raadsman afschriften verstrekt van de ambtelijke rapporten of
      andere geschriften die op de hem ten laste gelegde feiten betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel79
  - number: '80.1'
    text: |-
      De ambtenaar kan niet worden gestraft wegens overtreding van [artikel 125][ref1],
      dan nadat daarover advies is ingewonnen van de commissie bedoeld in
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ______________________________________________________________________________________________________ .


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125a
      [ref2]: https://wetten.overheid.nl/BWBR0005689#Artikel2
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125a
      - id: ref2
        bwb_id: BWBR0005689
        artikel: '2'
  - number: '80.2'
    text: |-
      Het bevoegd gezag geeft bij zijn besluit tot strafoplegging te kennen of dit in overeenstemming is met het
      ingewonnen advies.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel80
  - number: '81'
    text: |-
      De ambtenaar dient van de ontvangst van een besluit inzake strafoplegging te doen blijken door onmiddellijke
      terugzending van een door hem ondertekend en gedateerd ontvangstbewijs.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel81
  - number: '82'
    text: |-
      De straf, behalve die van schriftelijke berisping, wordt niet ten uitvoer gelegd zolang zij niet onherroepelijk is
      geworden, tenzij bij het opleggen van de straf is bevolen dat deze onmiddellijk ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel82
  - number: '83'
    text: |-
      De ambtenaar is van rechtswege in zijn ambt geschorst wanneer hem rechtmatig zijn vrijheid is
      ontnomen, tenzij de vrijheidsontneming het gevolg is van een maatregel, anders dan op grond van de
      [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], genomen in het belang van de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005700
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005700
  - number: '84.1'
    text: |-
      Onverminderd [artikel 77, eerste lid, onderdeel h ][ref1], kan de ambtenaar in zijn ambt worden geschorst:


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel77
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '77'
        hoofdstuk: IX
  - number: 84.1.a
    text: indien een strafrechtelijke vervolging ter zake van een misdrijf tegen hem is ingesteld;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel84
  - number: 84.1.b
    text: |-
      wanneer hem door het bevoegd gezag dan wel door Ons, indien het een ambtenaar betreft die bij koninklijk besluit is
      benoemd, het voornemen tot bestraffing met onvoorwaardelijk ontslag is meegedeeld dan wel wanneer hem die straf is
      opgelegd of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel84
  - number: 84.1.c
    text: |-
      wanneer naar het oordeel van het bevoegd gezag dan wel naar Ons oordeel indien het betreft een ambtenaar die bij
      koninklijk besluit is benoemd, het belang van de dienst dit vereist.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel84
  - number: '84.2'
    text: |-
      Tenzij bij wet is bepaald dat schorsing bij koninklijk besluit geschiedt, geschiedt schorsing door het bevoegd
      gezag. In afwachting van de schorsing kan de ambtenaar buiten functie worden gesteld door het bevoegd gezag,
      met dien verstande dat ten aanzien van de bij koninklijk besluit benoemde ambtenaren die werkzaam zijn bij een
      regionaal politiekorps of bij een voorziening tot samenwerking machtiging van Onze Minister is vereist en ten
      aanzien van de bij koninklijk besluit benoemde ambtenaren die werkzaam zijn bij het LSOP machtiging van Onze
      Minister van Justitie en Onze Minister is vereist.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel84
  - number: '84.3'
    text: |-
      De duur van de schorsing bedraagt maximaal zes maanden. In uitzonderlijke gevallen kan deze termijn nog eenmaal met
      drie maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel84
  - number: '85.1'
    text: |-
      Tijdens de schorsing kan de bezoldiging voor een derde gedeelte worden ingehouden; na verloop van
      zes weken kan een verdere inhouding, ook van het volle bedrag van de bezoldiging, plaatsvinden.
      Geen inhouding vindt plaats ingeval van een schorsing in het belang van de dienst als bedoeld in
      [artikel 84, eerste lid, onderdeel c][ref1], van opneming in een psychiatrisch ziekenhuis, bedoeld in
      [artikel 1 van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref2], dan wel van politiebewaring of
      inverzekeringstelling als bedoeld in [artikel 57 van het Wetboek van Strafvordering][ref3], mits niet gevolgd door
      inbewaringstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel57
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '84'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0005700
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '57'
  - number: '85.2'
    text: |-
      De ingehouden bezoldiging kan alsnog geheel of gedeeltelijk aan de ambtenaar worden uitbetaald, indien de
      schorsing niet wordt gevolgd door een onvoorwaardelijk ontslag bij wijze van straf of ontslag op grond van
      [artikel 94, eerste lid, onderdeel d][ref1]. Op de aldus uit te keren bezoldiging worden in mindering gebracht de
      inkomsten die de ambtenaar sedert de schorsing heeft genoten uit arbeid die hij als gevolg van de schorsing heeft
      kunnen verrichten, tenzij dit naar het oordeel van het bevoegd gezag onredelijk of onbillijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel94
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '94'
        hoofdstuk: X
  - number: '85.3'
    text: Het niet ingehouden gedeelte van de bezoldiging van de geschorste ambtenaar kan aan anderen worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel85
  - number: '85.4'
    text: |-
      Voor de toepassing van dit artikel wordt onder bezoldiging verstaan de bezoldiging in de zin van
      [artikel 1, onderdeel s, van het Besluit bezoldiging politie][ref1] dan wel ingeval van schorsing tijdens ziekte
      van de ambtenaar, hetgeen daaronder voor de toepassing van [hoofdstuk 10 van het Besluit bezoldiging politie][ref2]
      wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006517
        hoofdstuk: '10'
  - number: '86.1'
    text: |-
      Tenzij bij wet is bepaald dat ontslag wordt gegeven bij koninklijk besluit, wordt ontslag gegeven door het bevoegd
      gezag.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel86
  - number: '86.2'
    text: |-
      Aan de ambtenaar, bedoeld in [artikel 89][ref1], [artikel 90][ref2], [artikel 91, eerste lid][ref3],
      [artikel 92][ref4] of [artikel 94, eerste lid, onderdeel e, f of g][ref5], wordt
      schriftelijk medegedeeld dat toekenning van een bovenwettelijke uitkering als bedoeld in het
      [Besluit bovenwettelijke werkloosheidsuitkering politie][ref6], pas plaatsvindt, nadat door hem een aanvraag
      daartoe is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel91
      [ref4]: https://wetten.overheid.nl/BWBR0006516#Artikel92
      [ref5]: https://wetten.overheid.nl/BWBR0006516#Artikel94
      [ref6]: https://wetten.overheid.nl/BWBR0012022
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '89'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '90'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '91'
        hoofdstuk: X
      - id: ref4
        bwb_id: BWBR0006516
        artikel: '92'
        hoofdstuk: X
      - id: ref5
        bwb_id: BWBR0006516
        artikel: '94'
        hoofdstuk: X
      - id: ref6
        bwb_id: BWBR0012022
  - number: '87.1'
    text: De ambtenaar wordt op zijn aanvraag ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87
  - number: '87.2'
    text: |-
      Behoudens het geval, bedoeld in [artikel 48, eerste lid][ref1], wordt dit ontslag verleend met ingang van een dag
      die niet vroeger dan een maand of later dan drie maanden ligt na de dag waarop de aanvraag om ontslag is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel48
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '48'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '87.3'
    text: |-
      Van het eerste lid kan worden afgeweken indien een strafrechtelijke vervolging ter zake van een misdrijf tegen de
      ambtenaar is ingesteld of indien wordt overwogen de straf van ontslag op te leggen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87
  - number: '87.4'
    text: 'Van het tweede lid kan worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87
  - number: 87.4.a
    text: |-
      indien wordt overwogen de ambtenaar een straf als bedoeld in [artikel 77][ref1] op te leggen;


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel77
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '77'
        hoofdstuk: IX
  - number: 87.4.b
    text: |-
      indien het belang van de dienst dit vereist, met dien verstande dat de termijn van drie maanden, bedoeld in het
      tweede lid, tot ten hoogste zes maanden kan worden verlengd en dat bij de verlenging in redelijkheid met het belang
      van de ambtenaar rekening wordt gehouden, of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87
  - number: 87.4.c
    text: op aanvraag van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87
  - number: '87.5'
    text: |-
      Indien een ontslag op aanvraag wordt verleend aan een aspirant, gaat dit ontslag, in afwijking van het tweede lid,
      onmiddellijk in.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87
  - number: '87.6'
    text: Het ontslag op aanvraag van de ambtenaar wordt eervol verleend.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87
  - number: 87a.1
    text: |-
      Onder de Centrale vut-overeenkomst overheids- en onderwijspersoneel, genoemd in dit artikel, wordt verstaan de
      overeenkomst, die is aangegaan op grond van [artikel 2 van de Wet kaderregeling vut overheidspersoneel][ref1].
      Onder het Pensioenreglement van de Stichting Pensioenfonds ABP, genoemd in dit artikel, wordt verstaan
      het reglement van die stichting dat is vastgesteld met inachtneming van de overeenkomst, bedoeld in
      [artikel 4, eerste lid, van de Wet privatisering ABP][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel4
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '4'
  - number: 87a.2
    text: |-
      Aan de ambtenaar die ontslag vraagt met het oog op een uitkering op grond van de Regeling flexibel pensioen en
      uittreden, bedoeld in artikel 3 van de Centrale vut-overeenkomst overheids- en onderwijspersoneel en artikel 1.5
      van het Pensioenreglement van de Stichting Pensioenfonds ABP, wordt ontslag verleend indien:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87a
  - number: 87a.2.a
    text: |-
      het bestuur van de Stichting fonds vrijwillig vervroegd uittreden overheidspersoneel alsmede het bestuur van de
      Stichting Pensioenfonds ABP op grond van een desbetreffende aanvraag hebben vastgesteld dat na dat te verlenen
      ontslag recht bestaat op een uitkering op grond van de Regeling flexibel pensioen en uittreden en
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87a
  - number: 87a.2.b
    text: |-
      in het jaar voorafgaande aan de beoogde ontslagdatum geen gespaard verlof als bedoeld in de Regeling verlofsparen
      politie is genoten.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87a
  - number: 87a.3
    text: |-
      Het ontslag, bedoeld in het tweede lid, gaat niet eerder in dan met ingang van de dag waarop het recht ontstaat op
      een uitkering als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87a
  - number: 87a.4
    text: |-
      Op aanvraag van de ambtenaar kan het ontslag, bedoeld in het tweede lid, ook voor een gedeelte van zijn arbeidstijd
      worden verleend, tenzij het belang van de dienst zich hiertegen verzet. Het gedeelte van dit ontslag bedraagt
      ten minste 10% van de omvang van de betrekking. Ontslag voor een gedeelte uit een betrekking waaruit reeds eerder
      gedeeltelijk ontslag met het oog op de in het tweede lid bedoelde uitkering heeft plaatsgevonden, bedraagt ten
      minste 10% van de oorspronkelijke arbeidstijd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87a
  - number: 87a.5
    text: |-
      [ Artikel 87, tweede tot en met vierde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel87
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '87'
        hoofdstuk: X
  - number: '88.1'
    text: |-
      Aan de ambtenaar die op 1 januari 2001 50 jaar of ouder was en die op 12 maart 1999 en op 31 december 2000 was
      aangesteld voor
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88
  - number: 88.1.a
    text: |-
      de uitvoering van technische administratieve en andere taken ten dienste van de politie in een door het bevoegd
      gezag aangewezen functie waaraan bij door Onze Minister gestelde regels tot 1 januari 2001 een leeftijdsgrens was
      verbonden, of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88
  - number: 88.1.b
    text: |-
      de uitvoering van de politietaak, wordt met ingang van de eerste dag van de maand volgend op die waarin hij de
      leeftijd van 60 jaar bereikt, eervol ontslag verleend. Indien de in de eerste volzin bedoelde ambtenaar de functie
      heeft van vlieger bij het Korps landelijke politiediensten, wordt aan hem met ingang van de eerste dag van de maand
      volgend op die waarin hij de 55-jarige leeftijd bereikt, eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88
  - number: '88.2'
    text: |-
      Het in het eerste lid bedoelde ontslag op zestigjarige leeftijd kan op verzoek van de ambtenaar worden uitgesteld,
      mits met toepassing van [artikel 88c][ref1] dan wel met toepassing van [artikel 50, eerste lid, onderdeel g][ref2],
      is vastgesteld dat hiertegen geen bezwaar bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88c
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel50
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 88c
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '50'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '88.3'
    text: Na het in het tweede lid bedoelde uitstel vindt op aanvraag van de ambtenaar eervol ontslag plaats.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88
  - number: '88.4'
    text: |-
      Het ontslag, bedoeld in het derde lid, wordt verleend met ingang van de eerste dag van een maand. Dit ontslag
      wordt niet eerder verleend dan een maand en niet later dan drie maanden na de dag waarop de aanvraag om ontslag
      is ontvangen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88
  - number: '88.5'
    text: |-
      Indien de ambtenaar na het in het tweede lid bedoelde uitstel blijkens de uitslag van een arbeidsgezondheidskundig
      onderzoek lichamelijk en psychisch niet meer in staat kan worden geacht zijn functie te blijven vervullen, vindt
      eervol ontslag plaats.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88
  - number: '88.6'
    text: Het ontslag, bedoeld in het vijfde lid, wordt verleend met ingang van de eerste dag van een maand.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88
  - number: '88.7'
    text: |-
      Indien de ambtenaar na het in het tweede lid bedoelde uitstel ongeschikt wordt tot het verrichten van zijn
      arbeid wegens ziekte, vindt met ingang van de eerste dag van een maand eervol ontslag plaats indien sprake is van
      ongeschiktheid wegens ziekte gedurende een ononderbroken periode van 52 weken. Voor het bepalen van de periode
      van 52 weken worden perioden van ongeschiktheid tot werken wegens ziekte samengeteld, indien de perioden van
      ongeschiktheid elkaar met een onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88
  - number: '88.8'
    text: |-
      De ambtenaar aan wie op grond van het eerste, derde, vijfde of zevende lid, ontslag is verleend, heeft recht op een
      uitkering overeenkomstig door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88
  - number: '88.9'
    text: |-
      Het ontslag op grond van het eerste, derde, vijfde of zevende lid, is een ontslag als bedoeld in
      [artikel 87a, tweede lid][ref1], indien ten aanzien van dat ontslag wordt voldaan aan de in dat artikel genoemde
      voorwaarden. Uit fiscale overwegingen maakt het bevoegd gezag bij het verlenen van het ontslag onderscheid tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel87a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 87a
        hoofdstuk: X
  - number: 88.9.a
    text: |-
      ontslag met een onbelaste uitkering op grond van [artikel 38c van de Wet op de loonbelasting 1964][ref1], indien de
      ambtenaar voor 1 januari 2005 de leeftijd van 55 jaar heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38c
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 38c
  - number: 88.9.b
    text: |-
      ontslag met een op grond van [artikel 32aa van de Wet op de loonbelasting 1964][ref1] belaste uitkering, indien de
      ambtenaar niet voor 1 januari 2005 de leeftijd van 55 jaar heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32aa
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32aa
  - number: 88a.1
    text: |-
      Aan de ambtenaar die op grond van artikel B3, eerste en tweede lid, van het AFUP-opbouwreglement deelnemer is aan
      de AFUP en de functie heeft van vlieger bij het Korps landelijke politiediensten en direct voorafgaande aan ontslag
      op grond van dit artikel een diensttijd van ten minste tien jaren als zodanig heeft, wordt met ingang van de eerste
      dag van de maand volgend op die waarin hij de 55-jarige leeftijd bereikt, eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88a
  - number: 88a.2
    text: |-
      Het bevoegd gezag kan van het verlenen van het ontslag, bedoeld in het eerste lid alsmede het ontslag bedoeld
      in [artikel 88, eerste lid][ref1], aan de ambtenaar die de functie heeft van vlieger bij het Korps landelijke
      politiediensten, voor de duur van telkens ten hoogste één jaar afzien, indien de ambtenaar zulks heeft aangevraagd
      of daarmee instemt en hij blijkens de uitslag van een door de deskundige persoon of de arbodienst ingesteld
      arbeidsgezondheidskundig onderzoek, als bedoeld in [artikel 50, eerste lid, onderdeel f][ref2], lichamelijk en
      psychisch in staat kan worden geacht de functie van vlieger te blijven vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel50
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '88'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '50'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 88a.3
    text: |-
      Indien niet meer wordt voldaan aan een of beide van de voorwaarden genoemd in het tweede lid, vindt eervol ontslag
      plaats.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88a
  - number: 88a.4
    text: |-
      Het ontslag, bedoeld in het derde lid, wordt verleend met ingang van de eerste dag van een maand. Indien dit
      ontslag plaats vindt op aanvraag van de ambtenaar wordt dit ontslag niet eerder verleend dan een maand en niet
      later dan drie maanden na de dag waarop de aanvraag om ontslag is ontvangen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88a
  - number: 88a.5
    text: |-
      De ambtenaar aan wie op grond van het eerste of derde lid ontslag is verleend, heeft recht op een uitkering
      overeenkomstig door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88a
  - number: 88a.6
    text: |-
      Het ontslag op grond van het eerste of derde lid, is een ontslag als bedoeld in [artikel 87a, tweede lid][ref1],
      indien ten aanzien van dat ontslag wordt voldaan aan de in dat artikel genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel87a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 87a
        hoofdstuk: X
  - number: 88b.1
    text: |-
      Aan de ambtenaar die op 1 januari 2001 jonger was dan 50 jaar en die op 12 maart 1999 en op 31 december 2000 was
      aangesteld voor
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88b
  - number: 88b.1.a
    text: |-
      de uitvoering van technische administratieve en andere taken ten dienste van de politie in een door het bevoegd
      gezag aangewezen functie waaraan bij door Onze Minister gestelde regels tot 1 januari 2001 een leeftijdsgrens was
      verbonden, of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88b
  - number: 88b.1.b
    text: |-
      de uitvoering van de politietaak, en die ontslag vraagt met het oog op een uitkering op grond van het AFUP-
      opbouwreglement, wordt eervol ontslag verleend indien het bestuur van de Stichting fonds vrijwillig vervroegd
      uittreden overheidspersoneel alsmede het bestuur van de Stichting Pensioenfonds ABP op grond van een desbetreffende
      aanvraag hebben vastgesteld dat na dat te verlenen ontslag recht bestaat op een uitkering op grond van het AFUP-
      opbouwreglement. Het ontslag gaat niet eerder in dan met ingang van de dag waarop het recht op de ingevolge de
      eerste volzin bedoelde uitkering ontstaat.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88b
  - number: 88b.2
    text: |-
      De ambtenaar aan wie op grond van het eerste lid ontslag is verleend, heeft recht op een aanvulling op de uitkering
      op grond van het AFUP-opbouwreglement overeenkomstig door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88b
  - number: 88c.1
    text: |-
      Indien de ambtenaar bedoeld in de [eerste volzin van artikel 88, eerste lid][ref1], te kennen heeft gegeven dat hij
      na het bereiken van de leeftijd van zestig jaar zijn functie wil blijven uitoefenen, is hij indien hij is ingedeeld
      in een salarisschaal lager dan salarisschaal 10, verplicht om uiterlijk één jaar voor het bereiken van de leeftijd
      van zestig jaar een vragenlijst met betrekking tot zijn gezondheidstoestand in te vullen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '88'
        hoofdstuk: X
  - number: 88c.2
    text: |-
      Aan de hand van de beantwoorde vragenlijst bepaalt het bevoegd gezag, daartoe geadviseerd door de deskundige
      persoon of de arbodienst, of het noodzakelijk is dat de ambtenaar een arbeidsgezondheidskundig onderzoek moet
      ondergaan teneinde vast te stellen of de ambtenaar lichamelijk en psychisch in staat is zijn functie te blijven
      uitoefenen, nadat hij de leeftijd van zestig jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88c
  - number: 88c.3
    text: |-
      Onze Minister stelt regels met betrekking tot de inhoud van de in het eerste lid genoemde vragenlijst en de
      procedures omtrent de vragenlijst.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel88c
  - number: '89.1'
    text: |-
      Aan de aspirant die aan het einde van de aanstelling in tijdelijke dienst, bedoeld in
      [artikel 3, eerste lid][ref1], niet voldoet aan de gestelde kwalificatie-eisen, wordt eervol ontslag verleend met
      ingang van de dag, volgend op die waarop de aanstelling in tijdelijke dienst is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel3
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '3'
        hoofdstuk: II
  - number: '89.2'
    text: |-
      Aan de aspirant en de ambtenaar, aangesteld voor de uitvoering van de politietaak, die tegen het einde van de
      proeftijd, bedoeld in [artikel 3, tweede lid][ref1], niet voldoet aan de eisen van bekwaamheid of geschiktheid,
      wordt eervol ontslag verleend met ingang van de dag, volgend op die waarop de proeftijd is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel3
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '3'
        hoofdstuk: II
  - number: '89.3'
    text: |-
      Aan de ambtenaar, aangesteld voor de uitvoering van technische, administratieve of andere taken ten dienste van
      politie, die tegen het einde van de proeftijd, bedoeld in [artikel 4, eerste lid, onderdeel a][ref1], niet voldoet
      aan de eisen van bekwaamheid of geschiktheid, wordt eervol ontslag verleend met ingang van de dag, volgend op die
      waarop de proeftijd is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel4
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '4'
        hoofdstuk: II
  - number: '89.4'
    text: |-
      Aan de aspirant die gedurende de initiële opleiding en aan de ambtenaar aangesteld voor de uitvoering van de
      politietaak dan wel de ambtenaar aangesteld voor de uitvoering van technische, administratieve of andere taken ten
      dienste van de politie, die gedurende de proeftijd niet de geschiktheid blijkt te bezitten die voor de dienst wordt
      vereist, kan eervol ontslag worden verleend, mits een opzeggingstermijn in acht wordt genomen van:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel89
  - number: 89.4.a
    text: |-
      drie maanden, indien de ambtenaar ten tijde van de opzegging direct daaraan voorafgaand ten minste twaalf maanden
      ononderbroken in dienst is geweest;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel89
  - number: 89.4.b
    text: |-
      twee maanden, indien de ambtenaar ten tijde van de opzegging direct daaraan voorafgaand ten minste zes maanden maar
      korter dan twaalf maanden ononderbroken in dienst is geweest of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel89
  - number: 89.4.c
    text: |-
      één maand, indien de ambtenaar ten tijde van de opzegging direct daaraan voorafgaand korter dan zes maanden
      ononderbroken in dienst is geweest.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel89
  - number: '89.5'
    text: |-
      Het ontslag kan, al dan niet op aanvraag van de ambtenaar, ingaan vóór de afloop van de opzeggingstermijn. Indien
      dit niet op aanvraag van de ambtenaar geschiedt, wordt hem over de tijd die aan de opzeggingstermijn ontbreekt, een
      bedrag uitbetaald gelijk aan de laatstgenoten bezoldiging, vermeerderd met de vakantieuitkering, berekend op voet
      van hoofdstuk 6 van het Besluit bezoldiging politie.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel89
  - number: '89.6'
    text: |-
      Aan de aspirant die is aangesteld op grond van [artikel 3, tweede of derde lid][ref1], en die aan het einde van de
      initiële opleiding niet aan de gestelde kwalificatie-eisen voldoet, wordt eervol ontslag verleend met ingang van de
      dag, volgend op die waarop de initiële opleiding is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel3
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '3'
        hoofdstuk: II
  - number: '90.1'
    text: |-
      Aan de ambtenaar, aangesteld voor de uitvoering van de politietaak, die blijkens zijn akte van aanstelling is
      benoemd voor bepaalde tijd, als bedoeld in [artikel 3, vierde lid][ref1], en aan de ambtenaar, aangesteld voor de
      uitvoering van technische, administratieve en andere taken ten dienste van de politie, die blijkens zijn akte van
      aanstelling is benoemd voor bepaalde tijd, als bedoeld in [artikel 4, eerste lid, onderdelen b, c, d en e][ref2],
      is, tenzij het tegendeel blijkt, van rechtswege eervol ontslag verleend zodra die tijd is verstreken. Bij
      voortduring van het dienstverband na het verstrijken van de bepaalde tijd is de ambtenaar van rechtswege aangesteld
      voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel4
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '4'
        hoofdstuk: II
  - number: '90.2'
    text: |-
      Het eerste lid, eerste volzin, is van overeenkomstige toepassing ten aanzien van de ambtenaar die blijkens zijn
      akte van aanstelling is benoemd voor bepaalde tijd overeenkomstig [artikel 3, vierde lid, onderdeel c][ref1], of
      [artikel 4, eerste lid, onderdeel f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel4
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '4'
        hoofdstuk: II
  - number: '90.3'
    text: |-
      De ambtenaar, aangesteld voor de uitvoering van de politietaak of voor de uitvoering van technische,
      administratieve en andere taken ten dienste van de politie, die is aangesteld voor onbepaalde tijd, kan ontslag
      worden verleend mits een opzegtermijn in acht wordt genomen van:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel90
  - number: 90.3.a
    text: |-
      drie maanden, indien de ambtenaar ten tijde van de opzegging direct daaraan voorafgaand ten minste twaalf maanden
      ononderbroken in dienst is geweest;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel90
  - number: 90.3.b
    text: |-
      twee maanden, indien de ambtenaar ten tijde van de opzegging direct daaraan voorafgaand ten minste zes maanden doch
      korter dan twaalf maanden ononderbroken in dienst is geweest of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel90
  - number: 90.3.c
    text: |-
      één maand, indien de ambtenaar ten tijde van de opzegging direct daaraan voorafgaand korter dan zes maanden
      ononderbroken in dienst is geweest.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel90
  - number: '90.4'
    text: |-
      Opzegging als bedoeld in het derde lid, kan niet geschieden gedurende de zwangerschap van de vrouwelijke ambtenaar
      noch gedurende het verlof bedoeld in [artikel 55][ref1] noch, indien zij de dienst heeft hervat, gedurende een
      periode van zes weken volgend op dat verlof. Ter staving van de zwangerschap kan het bevoegd gezag een verklaring
      van een arts of van een verloskundige verlangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '90.5'
    text: |-
      Opzegging als bedoeld in het derde lid, kan niet geschieden wegens de omstandigheid dat de ambtenaar in of buiten
      rechte een beroep heeft gedaan op het beginsel van gelijke behandeling van mannen en vrouwen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel90
  - number: '90.6'
    text: |-
      Opzegging als bedoeld in het derde lid, kan niet geschieden wegens de omstandigheid dat de ambtenaar geplaatst
      is op een kandidatenlijst als bedoeld in [artikel 9 van de Wet op de ondernemingsraden][ref1], noch vanwege het
      lidmaatschap of het korter dan twee jaar geleden beëindigde lidmaatschap van de ambtenaar van de ondernemingsraad
      of van een commissie van die raad.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel9
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '9'
  - number: '90.7'
    text: |-
      Opzegging als bedoeld in het derde lid, kan niet geschieden wegens de omstandigheid dat de ambtenaar door een
      Centrale als bedoeld in [artikel 1, onder i, van het Besluit overleg en medezeggenschap politie 1994][ref1] of door
      een daarbij aangesloten bond of vereniging is aangewezen om bestuurlijke of vertegenwoordigende activiteiten te
      ontplooien binnen zijn Centrale of een daarbij aangesloten bond of vereniging, dan wel binnen de organisatie van de
      werkgever, die er toe strekken de doelstellingen van zijn centrale van overheidspersoneel en de daarbij aangesloten
      bonden of verenigingen te ondersteunen.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel1
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '1'
  - number: '90.8'
    text: |-
      Opzegging als bedoeld in het derde lid kan niet geschieden wegens de omstandigheid dat de ambtenaar zijn recht op
      ouderschapsverlof geldend maakt.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel90
  - number: '90.9'
    text: |-
      Aan de ambtenaar in tijdelijke dienst, bedoeld in het eerste lid, kan ontslag worden verleend met ingang van
      de dag, gelegen binnen de bepaalde tijd. In dat geval zijn het derde tot en met achtste lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel90
  - number: '90.10'
    text: |-
      Onverminderd [artikel 4a, derde en zevende lid][ref1], kan aan de ambtenaar in tijdelijke dienst, bedoeld
      in het tweede lid, ontslag worden verleend met ingang van de dag, gelegen binnen de bepaalde tijd, mits hij
      aansluitend hernieuwd in vaste dienst wordt aangesteld door het bevoegde gezag binnen wiens gezagsbereik hij was
      aangesteld direct voorafgaand aan de aanstelling in tijdelijke dienst. Het derde tot en met achtste lid zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 4a
        hoofdstuk: II
  - number: '90.11'
    text: |-
      Het ontslag kan, al dan niet op aanvraag van de ambtenaar, ingaan vóór de afloop van de opzeggingstermijn. Indien
      dit niet op aanvraag van de ambtenaar geschiedt, wordt hem over de tijd die aan de opzeggingstermijn ontbreekt, een
      bedrag betaald gelijk aan de laatst genoten bezoldiging, vermeerderd met de vakantie-uitkering, berekend op de voet
      van het [Besluit bezoldiging politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: '91.1'
    text: |-
      De ambtenaar kan in het kader van een reorganisatie eervol ontslag worden verleend indien het niet mogelijk is
      gebleken een passende functie aan te bieden.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel91
  - number: '91.2'
    text: |-
      De ontslagverlening op grond van het eerste lid kan betrekking hebben op een gedeelte van de tijd waarvoor de
      ambtenaar is aangesteld.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel91
  - number: '91.3'
    text: Bij herplaatsing in een passende functie bij een andere werkgever wordt de ambtenaar eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel91
  - number: '91.4'
    text: |-
      De ambtenaar die heeft geweigerd te voldoen aan een hem op grond van [hoofdstuk VII.B][ref1] opgelegde
      verplichting, kan in verband daarmee ontslag worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#HoofdstukVII.b
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0006516
        hoofdstuk: VII.b
  - number: '91.5'
    text: |-
      De ontslagverlening op grond van het eerste lid vindt niet eerder plaats dan vijf jaar nadat de ambtenaar
      is aangewezen als herplaatsingkandidaat, als bedoeld in [hoofdstuk VII.B][ref1]. Afhankelijk van het aantal
      dienstjaren van de ambtenaar wordt de termijn van vijf jaar verlengd overeenkomstig de hierna volgende tabel:






                    dienstjaren:


                    verlenging:






                    25 of meer dienstjaren


                    één jaar




                    30 of meer dienstjaren


                    twee jaren




                    35 of meer dienstjaren


                    drie jaren




                    40 of meer dienstjaren


                    vier jaren


      [ref1]: https://wetten.overheid.nl/BWBR0006516#HoofdstukVII.b
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0006516
        hoofdstuk: VII.b
  - number: '91.6'
    text: Bij een ontslag op grond van het vierde lid wordt een opzeggingstermijn van één maand in acht genomen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel91
  - number: '92.1'
    text: |-
      Aan de ambtenaar die een benoeming als minister of staatssecretaris aanvaardt, wordt met ingang van de dag van het
      aanvaarden van deze betrekking, eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel92
  - number: '92.2'
    text: |-
      Aan de ambtenaar die in verband met de aanvaarding van een functie in een publiekrechtelijk college waarin hij is
      aangesteld of verkozen, tijdelijk is ontheven van de waarneming van zijn ambt, wordt, indien hij ophoudt zodanige
      functie te bekleden en hij naar het oordeel van het bevoegd gezag niet in actieve dienst kan worden hersteld,
      eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel92
  - number: '92.3'
    text: |-
      Tenzij [artikel 48, eerste lid][ref1], van toepassing is, wordt eervol ontslag eveneens verleend aan
      de ambtenaar die na afloop van het verlof, verleend met toepassing van [artikel 45][ref2] dan wel van
      [artikel 47, eerste lid][ref3], naar het oordeel van het bevoegd gezag niet in actieve dienst kan worden hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel47
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '48'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '45'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '47'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '93'
    text: |-
      Indien een ontslag als bedoeld in [artikel 125e, tweede lid, van de Ambtenarenwet][ref1] door het bevoegd gezag of
      bij koninklijk besluit wordt verleend, is de medewerking vereist van Onze Minister en Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125e
  - number: '94.1'
    text: |-
      Anders dan op aanvraag van de ambtenaar, bij wijze van straf of ingevolge
      [artikel 7 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1], [artikel 88][ref2],
      [89][ref3], [90][ref4], [91][ref5], [92][ref6], of [93][ref7] kan de ambtenaar worden ontslagen op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel89
      [ref4]: https://wetten.overheid.nl/BWBR0006516#Artikel90
      [ref5]: https://wetten.overheid.nl/BWBR0006516#Artikel91
      [ref6]: https://wetten.overheid.nl/BWBR0006516#Artikel92
      [ref7]: https://wetten.overheid.nl/BWBR0006516#Artikel93
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '88'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '89'
        hoofdstuk: X
      - id: ref4
        bwb_id: BWBR0006516
        artikel: '90'
        hoofdstuk: X
      - id: ref5
        bwb_id: BWBR0006516
        artikel: '91'
        hoofdstuk: X
      - id: ref6
        bwb_id: BWBR0006516
        artikel: '92'
        hoofdstuk: X
      - id: ref7
        bwb_id: BWBR0006516
        artikel: '93'
        hoofdstuk: X
  - number: 94.1.a
    text: |-
      het verlies van een vereiste voor de aanstelling, gesteld bij een regeling aan de benoeming voorafgegaan, tenzij
      het vereiste alleen voor de aanvang van het ambt geldt;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: 94.1.b
    text: onherroepelijk geworden rechterlijke uitspraak waarbij de ambtenaar onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: 94.1.c
    text: het ondergaan van lijfsdwang wegens schulden krachtens onherroepelijk geworden rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: 94.1.d
    text: onherroepelijk geworden veroordeling tot een vrijheidsstraf wegens misdrijf;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: 94.1.e
    text: ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: 94.1.f
    text: |-
      het vanuit ziekte verrichten van passende arbeid bij een andere werkgever op grond van [artikel 49b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel49b
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 49b
        hoofdstuk: VII
        paragraaf: '1'
  - number: 94.1.g
    text: onbekwaamheid of ongeschiktheid voor het door hem beklede ambt, anders dan op grond van ziels- of lichaamsgebreken;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: 94.1.h
    text: |-
      het bereiken van de leeftijd waarop op grond van de [Algemene Ouderdomswet][ref1] recht op ouderdomspensioen
      ontstaat;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 94.1.i
    text: |-
      het bij of in verband met indiensttreding of keuring verstrekken van onjuiste of onvolledige inlichtingen, zonder
      welke handelwijze niet tot indienstneming of goedkeuring zou zijn overgegaan, tenzij de ambtenaar aannemelijk maakt
      dat hij te goeder trouw heeft gehandeld, of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: 94.1.j
    text: |-
      het zonder deugdelijke grond weigeren gevolg te geven of medewerking te verlenen aan de verplichtingen, bedoeld
      in [artikel 49c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel49c
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 49c
        hoofdstuk: VII
        paragraaf: '1'
  - number: '94.2'
    text: |-
      Een ontslag op grond van het eerste lid, onderdelen a, e, f, g en h wordt steeds eervol verleend. Het ontslag kan
      niet eerder ingaan dan de dag, volgende op die waarop de reden van het ontslag voor het eerst aanwezig was, met
      dien verstande dat een ontslag op grond van het eerste lid, onderdeel g, eerst kan ingaan vier weken nadat het
      ontslagbesluit aan de ambtenaar is bekendgemaakt, tenzij sprake is van dringende redenen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: '94.3'
    text: 'Een ontslag als bedoeld in het eerste lid, onderdeel e, kan slechts plaatsvinden indien:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: 94.3.a
    text: |-
      er sprake is van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een ononderbroken
      periode van twee jaar,
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: 94.3.b
    text: |-
      herstel van zijn ziekte niet binnen een periode van zes maanden na de in onderdeel a genoemde termijn van twee jaar
      te verwachten is, en
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: 94.3.c
    text: |-
      na een zorgvuldig onderzoek is gebleken dat binnen het gezagsbereik van het bevoegd gezag of bij een andere
      werkgever geen passende arbeid voorhanden is.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: '94.4'
    text: |-
      Een ontslag als bedoeld in het eerste lid, onderdeel f, kan, behoudens wederzijds goedvinden, slechts plaatsvinden
      indien:
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: 94.4.a
    text: |-
      er sprake is van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een ononderbroken
      periode van twee jaar,
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: 94.4.b
    text: |-
      herstel van zijn ziekte niet binnen een periode van zes maanden na de in onderdeel a genoemde termijn van twee jaar
      te verwachten is, en
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: 94.4.c
    text: de betrokkene in dienst treedt van de andere werkgever.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: '94.5'
    text: |-
      Voor de berekening van het tijdvak van twee jaar, bedoeld in het derde lid, onderdeel a, en het vierde lid,
      onderdeel a, worden perioden van ongeschiktheid tot het verrichten van haar arbeid wegens ziekte tengevolge van
      zwangerschap voorafgaand aan het zwangerschapsverlof en perioden van ongeschiktheid tijdens het zwangerschaps- of
      bevallingsverlof, bedoeld in [artikel 55][ref1], niet in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '94.6'
    text: |-
      Perioden van ongeschiktheid tot het verrichten van zijn arbeid, anders dan bedoeld in het vijfde lid, worden
      samengeteld indien zij elkaar met een onderbreking van minder dan vier weken opvolgen, of indien zij direct
      voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 55][ref1], tenzij de ongeschiktheid redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde
      oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '94.7'
    text: |-
      Om te beoordelen of er sprake is van een situatie als bedoeld in het derde lid, onderdelen a en b, en het vierde
      lid, onderdelen a en b, vraagt het bevoegd gezag het oordeel van een daartoe door de uitvoeringsinstelling, die de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] uitvoert ten aanzien van de ambtenaar, aangewezen arts.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '94.8'
    text: |-
      De in het zevende lid bedoelde arts betrekt bij zijn beoordeling een door het bevoegd gezag aangewezen arts en,
      indien de ambtenaar dit wenst, een door de ambtenaar aangewezen arts.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: '94.9'
    text: |-
      Het bevoegd gezag stelt de ambtenaar er schriftelijk van in kennis dat de procedure, bedoeld in het zevende lid,
      wordt ingesteld. Daarbij wijst het bevoegd gezag de ambtenaar op de mogelijkheid om een arts van zijn keuze te
      laten deelnemen aan de procedure.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: '94.10'
    text: |-
      De kennisgeving, bedoeld in het negende lid, geschiedt niet eerder dan nadat de ambtenaar gedurende een
      onafgebroken periode van 18 maanden ongeschikt is geweest tot het verrichten van zijn arbeid wegens ziekte. Het
      vijfde lid is hierbij van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: '94.11'
    text: |-
      De in het zevende lid bedoelde arts stelt naar aanleiding van zijn bevindingen een rapport op. Hij zendt dit
      rapport aan het bevoegd gezag. Tevens zendt hij een afschrift van dit rapport aan de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: '94.12'
    text: |-
      Indien herplaatsing als bedoeld in het derde lid, onder c, plaatsvindt in een betrekking voor minder uren dan het
      aantal waarvoor de ambtenaar was aangesteld, heeft het ontslag uitsluitend betrekking op het meerdere aantal uren.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: '94.13'
    text: |-
      Indien sprake is van een situatie als bedoeld in het eerste lid, onderdeel f, en de ambtenaar bij de andere
      werkgever voor minder uren arbeid verricht dan het aantal waarvoor hij was aangesteld, heeft het ontslag
      uitsluitend betrekking op het aantal uren dat hij passend werk verricht bij de andere werkgever.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: '94.14'
    text: |-
      Alvorens op grond van het eerste lid, onderdeel j, ontslag te verlenen, vraagt het bevoegd gezag advies aan het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel94
  - number: '95.1'
    text: |-
      Een ambtenaar kan ook op andere gronden, dan die welke in [artikel 94][ref1] zijn geregeld of waarnaar in dat
      artikel wordt verwezen, worden ontslagen. Voor een ontslagverlening als bedoeld in de eerste volzin, van een
      ambtenaar werkzaam bij een regionaal politiekorps, bij het Korps landelijke politiediensten, bij het LSOP of bij
      een voorziening tot samenwerking is de medewerking vereist van Onze Minister, indien bij wet is bepaald dat ontslag
      bij koninklijk besluit wordt verleend. Voor een ontslagverlening, bedoeld in de eerste volzin, van een bijzondere
      ambtenaar van politie is de medewerking vereist van Onze Minister van Justitie, indien bij wet is bepaald dat
      ontslag bij koninklijk besluit wordt verleend. Het ontslag wordt eervol verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel94
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '94'
        hoofdstuk: X
  - number: '95.2'
    text: |-
      In geval van ontslag ingevolge het eerste lid wordt een regeling getroffen waarbij de ambtenaar een uitkering wordt
      toegekend die met het oog op de omstandigheden redelijk is te achten. Deze uitkering zal in geen geval minder mogen
      zijn dan die welke de ambtenaar op grond van [artikel 97][ref1] zou toekomen in geval van ontslag als daar bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel97
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '97'
        hoofdstuk: X
  - number: '95.3'
    text: 'De regeling, bedoeld in het tweede lid, wordt getroffen:'
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel95
  - number: 95.3.a
    text: |-
      bij koninklijk besluit, op voordracht van Onze Minister in overeenstemming met Onze Minister van Justitie, indien
      het een korpschef van een regionaal politiekorps, dan wel een lid van de leiding van een regionaal politiekorps,
      dat in het bijzonder verantwoordelijk is voor de recherchefunctie, betreft, alsmede indien het de korpschef, dan
      wel een lid van de leiding van het Korps landelijke politiediensten betreft;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel95
  - number: 95.3.b
    text: |-
      bij koninklijk besluit, op voordracht van Onze Minister, indien het een andere ambtenaar dan die bedoeld in
      onderdeel a betreft, werkzaam bij een regionaal politiekorps, bij het Korps landelijke politiediensten of bij een
      voorziening tot samenwerking, die bij koninklijk besluit is benoemd;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel95
  - number: 95.3.c
    text: |-
      bij koninklijk besluit, op voordracht van Onze Minister van Justitie in overeenstemming met Onze Minister, indien
      het een bijzonder ambtenaar van politie betreft, die bij koninklijk besluit is benoemd;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel95
  - number: 95.3.d
    text: |-
      door Onze Minister, indien het een ambtenaar betreft, werkzaam bij een regionaal politiekorps, bij het Korps
      landelijke politiediensten of bij een voorziening tot samenwerking die niet bij koninklijk besluit is benoemd en
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel95
  - number: 95.3.e
    text: |-
      door Onze Minister van Justitie, indien het een bijzonder ambtenaar van politie betreft, die niet bij koninklijk
      besluit is benoemd.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel95
  - number: 95.3.f
    text: |-
      bij koninklijk besluit, op voordracht van Onze Minister van Justitie en van Onze Minister, indien het een ambtenaar
      betreft, werkzaam bij het LSOP die bij koninklijk besluit is benoemd;
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel95
  - number: 95.3.g
    text: |-
      het college van bestuur van het LSOP, indien het een ambtenaar betreft, bedoeld in
      [artikel 10, eerste lid, onderdeel b, van de Wet op het LSOP en het politieonderwijs][ref1], die niet bij
      koninklijk besluit is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel10
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '10'
  - number: '97'
    text: |-
      Aan de ambtenaar die als gevolg van een ontslag op grond van
      [de artikelen 89, eerste tot en met vierde lid en zesde lid][ref1], [90, met uitzondering van het tweede lid][ref2],
      [91, eerste lid][ref3], [92][ref4], of [artikel 94, eerste lid, onderdeel e, f of g][ref5], van dit besluit,
      werkloos is geworden in de zin van de [Werkloosheidswet][ref6], kan een bovenwettelijke aanvulling op zijn
      WW-uitkering worden toegekend krachtens het [Besluit bovenwettelijke werkloosheidsuitkering politie][ref7].
      Bij samenloop van het [Besluit bovenwettelijke werkloosheidsuitkering politie][ref8] met het
      [Besluit suppletie gedeeltelijk arbeidsongeschikten sector politie][ref9], wordt laatstgenoemd besluit uitgevoerd.
      Het recht op grond van het [Besluit bovenwettelijke werkloosheidsuitkering politie][ref10] leidt in dat geval niet
      tot uitkering en de berekening van de periode daarvan wordt niet gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel91
