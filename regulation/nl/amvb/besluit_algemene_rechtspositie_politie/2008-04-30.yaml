      - id: ref4
        bwb_id: BWBR0006299
        artikel: '47'
      - id: ref5
        bwb_id: BWBR0006299
        artikel: 47a
  - number: 99e.2
    text: |-
      De [artikelen 67][ref1] en [91][ref2], zoals deze luidden op 31 december 2005, zijn tot en met 31 december 2006
      van toepassing op een reorganisatie, anders dan een reorganisatie aangaande bovenregionale samenwerkingen, een
      voorziening tot samenwerking als bedoeld in de [artikelen 47][ref3] en [47a van de Politiewet 1993][ref4] (Stb.
      2005, 242) of veranderingen in de landelijke organisatie van de politie, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel91
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0006299#Artikel47a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99e
