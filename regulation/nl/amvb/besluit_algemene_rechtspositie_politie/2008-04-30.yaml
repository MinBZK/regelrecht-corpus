        bwb_id: BWBR0006516
        artikel: '64'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '65'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0006516
        artikel: 65a
        hoofdstuk: VIII
  - number: 99e.1
    text: |-
      De [artikelen 55i tot en met 55v][ref1], [artikel 67, tweede lid][ref2], en [artikel 91][ref3] zijn tot
      en met 31 december 2006 niet van toepassing op een reorganisatie, anders dan een reorganisatie aangaande
      bovenregionale samenwerkingen, een voorziening tot samenwerking als bedoeld in de [artikelen 47][ref4] en
      [47a van de Politiewet 1993][ref5] (Stb. 2005, 242) of veranderingen in de landelijke organisatie van de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55i
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel91
      [ref4]: https://wetten.overheid.nl/BWBR0006299#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0006299#Artikel47a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99e
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55i
        hoofdstuk: VII.b
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '67'
        hoofdstuk: VIII
