  - number: 99f.1
    text: |-
      De betrekkingsomvang van de ambtenaar die op 30 juni 2011 is aangesteld met een betrekkingsomvang van gemiddeld
      38 uur per week, wordt met ingang van 1 juli 2011 gewijzigd in een volledige betrekking, tenzij de ambtenaar kiest
      voor een betrekkingsomvang van gemiddeld 38 uur per week.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99f
  - number: 99f.2
    text: |-
      De betrekkingsomvang van de ambtenaar aangesteld in een volledige betrekking op 30 juni 2011, wijzigt niet
      met ingang van 1 juli 2011, tenzij de ambtenaar ervoor kiest zijn volledige betrekking uit te breiden naar een
      betrekkingsomvang van gemiddeld 38 uur per week.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99f
  - number: 99f.3
    text: |-
      De keuze kan vanaf 1 mei 2011 worden gemaakt doch dient uiterlijk op 30 juni 2011 aan het bevoegd gezag kenbaar
      te worden gemaakt. Indien de ambtenaar binnen deze termijn geen keuze kenbaar maakt, wordt zijn betrekkingsomvang
      bepaald op een volledige betrekking.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99f
  - number: 99g.1
    text: |-
      De betrekkingsomvang van de ambtenaar die op 30 juni 2011 in een deeltijdbetrekking is aangesteld, wijzigt niet,
      tenzij de ambtenaar ervoor kiest zijn deeltijdbetrekking uit te breiden naar evenredigheid van de uitbreiding van
      36 uur naar 38 uur per week.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99g
  - number: 99g.2
    text: |-
      De keuze kan vanaf 1 mei 2011 worden gemaakt doch dient uiterlijk op 30 juni 2011 aan het bevoegd gezag kenbaar te
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99g
  - number: 99h
    text: |-
      Met ingang van 1 juli 2021 wordt de betrekkingsomvang van de ambtenaar van gemiddeld 38 uur per week gewijzigd in
      een betrekkingsomvang van gemiddeld 36 uur per week.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99h
  - number: '100.1'
    text: |-
