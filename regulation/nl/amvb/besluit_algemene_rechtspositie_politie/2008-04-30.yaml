  - number: 1.1.x.1
    text: |-
      Indien het betreft een ambtenaar die werkzaam is bij een regionaal politiekorps: de desbetreffende regio, het
      door het bevoegde gezag aangewezen gedeelte van een regio waarin de plaats van tewerkstelling van die ambtenaar
      is gelegen, een plaats van tewerkstelling waarover dit bevoegde gezag het medebeheer uitoefent indien deze plaats
      van tewerkstelling is gelegen buiten de regio, dan wel de regio's van de desbetreffende samenwerkende regionale
      politiekorpsen tezamen indien de ambtenaar werkzaam is ten behoeve van een bovenregionaal rechercheteam als bedoeld
      in de Regeling nationale en bovenregionale recherche.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel1
  - number: 1.1.x.2
    text: |-
      indien het betreft een ambtenaar die werkzaam is bij het Korps landelijke politiediensten, of een bijzondere
      ambtenaar van politie: Nederland dan wel het door het bevoegd gezag aangewezen gedeelte van Nederland waarin de
      plaats van tewerkstelling is gelegen of
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel1
