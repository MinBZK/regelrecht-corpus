  - number: '102'
    text: |-
      Het Ambtenarenreglement voor de rijkspolitie 1975, het Ambtenarenreglement voor de gemeentepolitie 1958, het
      Besluit benoemingseisen politieambtenaren 1958, het Besluit bevorderingseisen hoger politiepersoneel 1958, het
      Besluit bekwaamheidseisen bevordering politie 1964, en de Rechtspositieregeling opleiding ter verkrijging van het
      diploma van inspecteur van gemeentepolitie of officier der rijkspolitie worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel102
  - number: '103'
    text: Dit besluit treedt in werking met ingang van 1 april 1994.
