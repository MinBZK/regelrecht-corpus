  - number: '99.1'
    text: |-
      Een ambtenaar die op grond van afdeling 1, hoofdstuk 2, artikel 1, van de Invoeringswet [Politiewet 1993][ref1]
      naar een politieregio dan wel het Korps landelijke politiediensten is overgegaan en die op de dag voorafgaande aan
      de datum van inwerkingtreding van de [Politiewet 1993][ref2] aanspraken had op grond van het Ambtenarenreglement
      voor de rijkspolitie 1975, het Ambtenarenreglement voor de gemeentepolitie 1958, de Rechtstoestandsregeling
      opleiding ter verkrijging van het diploma van inspecteur van gemeentepolitie of van officier der rijkspolitie, of
      artikel VII van het Besluit van 24 juni 1992, houdende wijziging van het Ambtenarenreglement voor de rijkspolitie
      1975, het Ambtenarenreglement voor de gemeentepolitie 1958, het Bezoldigingsreglement politie 1958, het Besluit
      geneeskundige verzorging politie 1984 en het Besluit overleg en medezeggenschap politie in verband met het tot
      stand brengen van een eenvormige rechtspositie voor alle politieambtenaren, behoudt deze aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
      [ref2]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0006299
      - id: ref2
        bwb_id: BWBR0006299
  - number: '99.2'
    text: |-
      Een ambtenaar, werkzaam bij het LSOP, die op de dag voorafgaande aan de datum van inwerkingtreding van de
      [LSOP-wet][ref1] aanspraken op grond van het Ambtenarenreglement LSOP had, behoudt deze aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0006942
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0006942
  - number: 99a
    text: |-
      Ten aanzien van degene die voor 1 april 1994 op grond van artikel 7 van de Rechtspositieregeling opleiding ter
      verkrijging van het diploma van inspecteur van gemeentepolitie of van officier der rijkspolitie benoemd was door
      Onze Minister als ambtenaar in tijdelijke dienst, is met ingang van 1 april 1994 Onze Minister het bevoegd gezag
      gedurende de tijd dat deze ambtenaar zijn opleiding volgt.
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99a
  - number: 99b
    text: |-
      Met ingang van 1 juli 2007 vervallen de [artikelen 4a][ref1] en [65a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel65a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 4a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 65a
        hoofdstuk: VIII
  - number: 99c.1
    text: |-
      Voor degene die op 30 juni 2007 met toepassing van [artikel 4a][ref1] is aangesteld in tijdelijke dienst, blijven
      de artikelen 1, 3, 4, 4a en 90, zoals luidend op 30 juni 2007, van toepassing tot het tijdstip dat hij hernieuwd
      in vaste dienst wordt aangesteld. Indien voor hem tijdens die aanstelling in tijdelijke dienst gedurende vier jaar
      of korter een hogere salarisschaal heeft gegolden dan de salarisschaal die voor hem gold gedurende de onmiddellijk
      daaraan voorafgaande aanstelling in vaste dienst, blijft artikel 4a, zoals luidend op 30 juni 2007, van toepassing
      tot het moment waarop de in dat artikel bedoelde inspanningsverplichting vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 4a
        hoofdstuk: II
  - number: 99c.2
    text: |-
      Voor degene die met toepassing van [artikel 4a][ref1] hernieuwd in vaste dienst is aangesteld en ten opzichte
      van wie het bevoegde gezag op grond van dat artikel op 30 juni 2007 een inspanningsverplichting heeft, blijft dat
      artikel, zoals luidend op 30 juni 2007, van toepassing voor de resterende duur van die inspanningsverplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 4a
        hoofdstuk: II
  - number: 99c.3
    text: |-
      Een in de periode tussen 3 september 1999 en 1 juli 2007 gegeven toepassing aan de [artikelen 64][ref1], [65][ref2]
      en [65a][ref3] behoudt haar geldigheid na 30 juni 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel65a
    url: https://wetten.overheid.nl/BWBR0006516/2008-04-30#Artikel99c
    references:
