  - number: '7'
    text: Na beëindiging van de werkzaamheden draagt het College het archief over aan het Ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0019653/2008-01-01#Artikel7
  - number: '8'
    text: |-
      1 Het [besluit van Onze Minister van 19 oktober 2005][ref1], nr. FM 2005-02519 M tot tijdelijke instelling van het
      Adviescollege Deskundigheid Financiële Dienstverlening (Stcrt. 2005, 206) wordt ingetrokken.

      2 Na inwerkingtreding van dit besluit berust het besluit van Onze Minister van 25 november 2005, nr. FM 2005-02778
