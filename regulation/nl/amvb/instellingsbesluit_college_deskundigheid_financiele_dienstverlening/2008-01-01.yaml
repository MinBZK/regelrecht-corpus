  - number: '2'
    text: Er is een College Deskundigheid Financiële Dienstverlening.
    url: https://wetten.overheid.nl/BWBR0019653/2008-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het College adviseert of ondersteunt Onze Minister desgevraagd of uit eigen beweging met betrekking tot:

      a. de vaststelling van de toetstermen, bedoeld in [artikel 8, eerste lid, van het besluit][ref1];

      b. de vaststelling van de wijze waarop wordt voldaan aan de eindtermen, bedoeld in bijlage 6 van het besluit, zoals
      voorgeschreven in [artikel 171, eerste en tweede lid, van het besluit][ref2];

      c. de vaststelling van de toetstermen met betrekking tot permanente educatie, bedoeld in
      [artikel 8, tweede lid, van het besluit][ref3], alsmede de wijze waarop daaraan kan worden voldaan;

      d. de toewijzing of afwijzing van een aanvraag om erkenning, bedoeld in
      [artikel 20, eerste lid, van het besluit][ref4];

      e. het verbinden van voorschriften aan een erkenning, bedoeld in [artikel 20, derde lid, van het besluit][ref5];

      f. de intrekking van een erkenning, bedoeld in [artikel 20, vierde lid, van het besluit][ref6]; en

      g. het toezicht op de naleving van de van toepassing zijnde voorschriften door erkende exameninstituten.

      2 Op verzoek van Onze Minister of de Autoriteit Financiële Markten, bedoeld in [artikel 1:1 van de wet][ref7]
      adviseert het College over in dat verzoek nader te specificeren onderwerpen met betrekking tot de in het eerste en
      tweede lid genoemde onderwerpen.


