articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de wet: de [Wet op het financieel toezicht][ref1];

      b. het besluit: het [Besluit Gedragstoezicht financiële ondernemingen Wft][ref2];

      c. Onze Minister: Onze Minister van Financiën;

      d. College: het College Deskundigheid Financiële Dienstverlening, bedoeld in [artikel 2][ref3].


