  - number: '4'
    text: |-
      1 Het College bestaat uit een voorzitter en vier leden.

      2 Het College kan zich bij de uitvoering van zijn taken laten ondersteunen op een door het College te bepalen
      wijze.

      3 Onze Minister benoemt, na voordracht van het College, de voorzitter en de leden van het College.
    url: https://wetten.overheid.nl/BWBR0019653/2008-01-01#Artikel4
  - number: '5'
    text: De leden van het College worden benoemd voor een termijn van drie jaar en zijn éénmaal herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0019653/2008-01-01#Artikel5
  - number: '6'
    text: |-
      1 De voorzitter en de overige leden van het College wordt een vaste beloning als bedoeld in
      [artikel 3, eerste lid, van het Vacatiegeldenbesluit][ref1] toegekend. Deze beloning bedraagt € 1050 per maand voor
      de voorzitter van het College en € 600 per maand voor de overige leden.

      2 Indien de taakbelasting van andere personen die werkzaamheden voor het College verrichten daartoe aanleiding
      geeft, kan ook aan deze personen een vaste beloning als bedoeld in het eerste lid worden toegekend.

      3 De minister kan de beloning, bedoeld in het eerste lid, jaarlijks opnieuw vaststellen.

      4 De voorzitter, de overige leden van het College en andere personen die werkzaamheden voor het College verrichten,
      hebben overeenkomstig het [Reisbesluit binnenland][ref2] recht op vergoeding wegens reis- en verblijfkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0004317#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005889
    url: https://wetten.overheid.nl/BWBR0019653/2008-01-01#Artikel6
