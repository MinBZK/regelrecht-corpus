  - number: '2'
    text: Er is een College Deskundigheid Financiële Dienstverlening.
    url: https://wetten.overheid.nl/BWBR0019653/2014-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het College adviseert of ondersteunt Onze Minister desgevraagd of uit eigen beweging met betrekking tot:

      a. de vaststelling van de toetstermen als bedoeld in [artikel 8, eerste lid, van het besluit][ref1];

      b. de vaststelling van de wijze waarop wordt voldaan aan de eindtermen, bedoeld in [bijlage 6 van het besluit][ref2],
      zoals voorgeschreven in [artikel 171, eerste en tweede lid, van het besluit][ref3];

      c. de vaststelling van de toetstermen met betrekking tot permanente educatie als bedoeld in
      [artikel 8, tweede lid, van het besluit][ref4], alsmede de wijze waarop daaraan kan worden voldaan;

      d. de toewijzing of afwijzing van een aanvraag om erkenning als bedoeld in [artikel 9, eerste lid][ref5] of
      [artikel 11b, eerste lid, van het besluit][ref6];

      e. het verbinden van voorschriften aan een erkenning als exameninstituut als bedoeld in
      [artikel 9, derde lid, van het besluit][ref7];

      f. het verbinden van voorschriften of voorwaarden aan een erkenning als exameninstituut als bedoeld in
      [artikel 11b, derde lid, van het besluit][ref8];

      g. het intrekken van een erkenning als bedoeld in [artikel 9, vierde lid][ref9] of
      [artikel 11b, vierde lid, van het besluit][ref10];

      h. het toezicht op de naleving van de van toepassing zijnde voorschriften door erkende exameninstituten of erkende
      instituten voor permanente educatie;

      i. de aanwijzing van geldige diploma’s als bedoeld in [artikel 171, vierde lid, van het besluit][ref11];

      j. het verlenen van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref12], aan houders van een diploma
      voor financiële dienstverlening van een andere lidstaat waarmee de vakbekwaamheid als bedoeld in
      [artikel 6, van het besluit][ref13], kan worden aangetoond.

      2 Op verzoek van Onze Minister of de Autoriteit Financiële Markten adviseert het College over in dat verzoek nader
      te specificeren onderwerpen met betrekking tot de in het eerste lid genoemde onderwerpen.


