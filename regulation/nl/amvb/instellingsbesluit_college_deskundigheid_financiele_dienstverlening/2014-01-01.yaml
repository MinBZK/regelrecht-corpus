  - number: '4'
    text: |-
      1 Het College bestaat uit een voorzitter en vier leden.

      2 Het College kan zich bij de uitvoering van zijn taken laten ondersteunen op een door het College te bepalen
      wijze.

      3 Onze Minister benoemt, na voordracht van het College, de voorzitter en de leden van het College.
    url: https://wetten.overheid.nl/BWBR0019653/2014-01-01#Artikel4
  - number: '5'
    text: De leden van het College worden benoemd voor een termijn van ten hoogste vijf jaar en zijn terstond herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0019653/2014-01-01#Artikel5
  - number: '7'
    text: Na beëindiging van de werkzaamheden draagt het College het archief over aan het Ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0019653/2014-01-01#Artikel7
  - number: '8'
    text: |-
      1 Het [besluit van Onze Minister van 19 oktober 2005][ref1], nr. FM 2005-02519 M tot tijdelijke instelling van het
      Adviescollege Deskundigheid Financiële Dienstverlening (Stcrt. 2005, 206) wordt ingetrokken.

      2 Na inwerkingtreding van dit besluit berust het besluit van Onze Minister van 25 november 2005, nr. FM 2005-02778
      M, tot benoeming van de leden van het Adviescollege Deskundigheid Financiële Dienstverlening (Stcrt. 2005, 232) op
      [artikel 4, derde lid][ref2], van dit besluit.


