---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_uitzonderingen_registratieregime_diergeneesmiddelen
regulatory_layer: AMVB
publication_date: '2006-01-12'
valid_from: '2004-10-18'
bwb_id: BWBR0003929
url: https://wetten.overheid.nl/BWBR0003929/2004-10-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw en Visserij van 2 juli 1985, nr. J 3933, Directie Juridische
    en Bedrijfsorganisatorische Zaken, gedaan in overeenstemming met de Staatssecretaris van Welzijn, Volksgezondheid
    en Cultuur;

    Gelet op de artikelen 20 en 49 van de Diergeneesmiddelenwet (Stb. 1985, 410);

    Gehoord de Dibevo, de Vereniging van Fabrikanten en Groothandelaren in Veterinaire Produkten (Fagrovet), de
    Vereniging van Fabrikanten en Importeurs van Diergeneesmiddelen in Nederland (Fidin), de Koninklijke Nederlandse
    Maatschappij voor Diergeneeskunde, de Vereniging van Fabrikanten en Importeurs van Toevoegingsmiddelen (Nefato) en
    de Nederlandse Associatie van Homeopatische Farmaceutische Ondernemingen (Nehoma);

    De Raad van State gehoord (advies nr. W11.85.0365/18.5.38 van 13 september 1985);

    Gezien het nader rapport van de Staatssecretaris van Landbouw en Visserij van 13 maart, No. J. 7435, Directie
    Juridische en Bedrijfsorganisatorische Zaken, uitgebracht in overeenstemming met de Staatssecretaris van Welzijn,
    Volksgezondheid en Cultuur;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens dit besluit wordt verstaan onder:






                  wet


                  : [Diergeneesmiddelenwet][ref1] (St. 1985, 410);




                  homeopathisch diergeneesmiddelen


                  : a. een diergeneesmiddel dat is vermeld op de Lijst van homeopathische diergeneesmiddelen 1993, of





                  b. een diergeneesmiddel dat, overeenkomstig een homeopathisch fabricageprocedé, zoals beschreven in de
      Europese Farmacopee dan wel in een andere op 22 september 1992 door de lid-staten van de Europese Gemeenschappen
      officieel gebruikte farmacopee, is verkregen uit produkten, substanties of mengsels die homeopathische grondstoffen
      worden genoemd.




                  kooivogels


                  : vogels die worden gehouden in kooien of volières, voor zover zij noch zelve, noch hun eieren, voor
      consumptie zijn bestemd;




                  knaagdieren



                  : dieren behorende tot de orde der knaagdieren, alsmede konijnen;




                  auto-vaccins :


                  :entstoffen welke zijn bereid met behulp van uit één of meer dieren geïsoleerde smetstoffen met het oog
      op de incidentele toepassing bij datzelfde dier of diezelfde dieren of dieren die daarmee tezamen worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
  - number: '2.1'
    text: |-
      Onze Minister houdt een lijst van homeopathische diergeneesmiddelen bij, genaamd: Lijst van homeopathische
      diergeneesmiddelen 1993.
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel2
  - number: '2.2'
    text: 'Onze Minister stelt regelen omtrent:'
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel2
  - number: 2.2.a
    text: de inrichting van die lijst;
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel2
  - number: 2.2.b
    text: de wijze waarop kennis kan worden genomen van de in die lijst opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel2
  - number: '3.1'
    text: |-
      Een diergeneesmiddel wordt opgenomen in de Lijst van homeopathische diergeneesmiddelen 1993, indien het een
      diergeneesmiddel betreft dat reeds was opgenomen in de lijst van homeopathische diergeneesmiddelen, bedoeld in
      [artikel 2][ref1] van dit besluit zoals dit luidde op 31 oktober 1993, dan wel indien hiertoe vóór 1 januari 1994
      door degene die verantwoordelijk is voor het in Nederland in de handel brengen van dat diergeneesmiddel een verzoek
      is ingediend en uit de door de verzoeker te verstrekken gegevens blijkt, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003929#Artikel2
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003929
        artikel: '2'
  - number: 3.1.a
    text: het middel onder meer door zijn bereiding en de aanbevolen toepassingswijze past in de veterinaire homeopathie;
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel3
  - number: 3.1.b
    text: het middel bij de aanbevolen toepassingswijze niet schadelijk is voor de gezondheid van mens of dier.
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister stelt regelen omtrent de wijze waarop het in het eerste lid bedoelde verzoek moet worden gedaan en
      omtrent de gegevens die daarbij moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel3
  - number: '3.3'
    text: 'De opname in de lijst wordt doorgehaald:'
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel3
  - number: 3.3.a
    text: |-
      indien degene die verantwoordelijk is voor het in Nederland in de handel brengen van het diergeneesmiddel daarom
      verzoekt;
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel3
  - number: 3.3.b
    text: indien blijkt dat niet of niet meer wordt voldaan aan de in het eerste lid, onder *a* of *b* gestelde vereisten.
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel3
  - number: 3.4.a
    text: |-
      Alvorens de opname in de lijst wordt doorgehaald omdat naar het oordeel van Onze Minister niet meer wordt voldaan
      aan de in het eerste lid, onder *a* en *b*, gestelde vereisten, wordt degene op wiens verzoek het diergeneesmiddel
      is opgenomen in de lijst, in de gelegenheid gesteld zijn mening daaromtrent kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel3
  - number: 3.4.b
    text: |-
      Het besluit houdende doorhaling van de opname wordt bij aangetekende brief aan degene wiens diergeneesmiddel in
      de lijst was opgenomen toegezonden. Het besluit vermeldt de datum met ingang waarvan de doorhaling van kracht
      wordt. Deze datum wordt niet vroeger gesteld dan zes maanden na de datum van de beslissing tenzij bijzondere
      omstandigheden onmiddellijke doorhaling noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel3
  - number: '4.1'
    text: |-
      De artikelen 2 tot en met 4, 6 tot en met 13 en 19 van de wet zijn niet van toepassing op homeopathische
      diergeneesmiddelen die zijn opgenomen in de Lijst van homeopathische diergeneesmiddelen 1993.
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel4
  - number: '4.2'
    text: |-
      De artikelen 2 tot en met 4, 6 tot en met 13 en 19 van de wet zijn niet van toepassing op diergeneesmiddelen
      waarvoor tussen 1 mei 1986 en 1 mei 1987 een verzoek tot opname in de lijst van homeopathische diergeneesmiddelen,
      bedoeld in de [artikelen 2][ref1] en [3][ref2] van dit besluit zoals dit in die periode luidde is gedaan, indien
      op dit verzoek nog niet onherroepelijk is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003929#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003929#Artikel3
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003929
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003929
        artikel: '3'
  - number: '4.3'
    text: |-
      De artikelen 2 tot en met 4, 6 tot en met 13 en 19 van de wet zijn niet van toepassing op homeopathische
      diergeneesmiddelen waarvoor overeenkomstig [artikel 3][ref1] van dit besluit een verzoek tot opname in de Lijst van
      homeopathische diergeneesmiddelen 1993 is gedaan, totdat op dit verzoek in eerste aanleg is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003929#Artikel3
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003929
        artikel: '3'
  - number: '5.1'
    text: |-
      De [artikelen 2 tot en met 4][ref1], [6 tot en met 13][ref2] en [19 van de wet][ref3] zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel19
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003818
        artikel: '19'
  - number: 5.1.a
    text: diergeneesmiddelen op basis van radio-actieve isotopen;
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel5
  - number: 5.1.b
    text: |-
      diergeneesmiddelen die kennelijk uitsluitend bestemd zijn voor aquarium- en terrariumdieren, kooivogels, post-
      en sierduiven en niet bedrijfsmatig gehouden klein knaagdieren, voorzover deze middelen, behoudens het bepaalde
      krachtens het tweede lid, geen diergeneesmiddelen bevatten waarop [Hoofdstuk IV van de wet][ref1] van toepassing is
      of substanties die aangewezen zijn krachtens [artikel 5 van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel5
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003818
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '5'
  - number: 5.1.c
    text: |-
      halffabrikaten voor de bereiding van gemedicineerd voeder voor zover deze op bestelling van de bereider van
      gemedicineerd voeder voor wie zij zijn bestemd worden bereid en rechtstreeks aan hem worden afgeleverd, mits daarin
      geen andere dan geregistreerde diergeneesmiddelen of diergeneesmiddelen die ingevolge het bepaalde krachtens de wet
      niet behoeven te worden geregistreerd, zijn verwerkt;
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel5
  - number: 5.1.d
    text: auto-vaccins;
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel5
  - number: 5.1.e
    text: |-
      diergeneesmiddelen die uitsluitend één of meer van de in de bijlage bij dit besluit genoemde substanties als
      werkzaam bestanddeel bevatten;
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel5
  - number: 5.1.f
    text: |-
      diergeneesmiddelen die bestemd zijn en uitsluitend worden gebruikt voor toepassing op niet levend materiaal
      van dierlijke herkomst welk materiaal verkregen wordt zonder dat daarvoor levende weefsels behoeven te worden
      verbroken.
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister kan diergeneesmiddelen waarop [Hoofdstuk IV van de wet][ref1] van toepassing is aanwijzen die, in
      afwijking van het bepaalde in het eerste lid, onder *b*, in de daar bedoelde diergeneesmiddelen mogen voorkomen tot
      een bij die aanwijzing aangegeven hoeveelheid en met inachtneming van daarbij gestelde regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003818
        hoofdstuk: IV
  - number: '7.1'
    text: Dit besluit treedt in werking met ingang van het tijdstip waarop artikel 2 van de wet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel7
  - number: '7.2'
    text: Dit besluit kan worden aangehaald als het "Besluit uitzonderingen registratieregime diergeneesmiddelen".
    url: https://wetten.overheid.nl/BWBR0003929/2004-10-18#Artikel7
