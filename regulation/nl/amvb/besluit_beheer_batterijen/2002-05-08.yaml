preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 4 juli 1994, nr.
    MJZ04794019, Centrale Directie Juridische Zaken, afdeling Wetgeving;


    Gelet op de artikelen 3, 4 en 5 van richtlijn nr. 91/157/EEG van de Raad van de Europese Gemeenschappen van 18
    maart 1991 betreffende batterijen en accu's die gevaarlijke stoffen bevatten (PbEG L 78) en de artikelen 10.4,
    eerste lid, tweede lid, onder a en e, en zesde lid, 10.6 en 10.8, onder a, van de Wet milieubeheer;


    De Raad van State gehoord (advies van 21 november 1994, no. W08.94.0426);


    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 25
    januari 1995, no. MJZ 25195050, Centrale Directie Juridische Zaken, afdeling Wetgeving;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007227/2002-05-08#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:


      a. batterij: een bron van door rechtstreekse omzetting van chemische energie verkregen elektrische energie,
      bestaande uit een eenmalige of gesloten oplaadbare batterij;


      b. accu: een bron van door rechtstreekse omzetting van chemische energie verkregen elektrische energie, bestaande
      uit een open oplaadbare batterij;


      c. consumentenapparaat: een apparaat bestemd voor gebruik in particuliere huishoudens waarin zich een of meer
      batterijen bevinden;


      d. vervaardigen: vervaardigen met het oogmerk om in Nederland of de Europese Gemeenschap op de markt te brengen;


      e. voorhanden hebben in handelsvoorraden: voorhanden hebben in handelsvoorraden met het oogmerk om in Nederland of
      de Europese Gemeenschap op de markt te brengen;


      f. richtlijn: [richtlijn nr. 91/157/EEG](31991L0157) van de Raad van de Europese Gemeenschappen van 18 maart 1991
      (*PbEG* L 78), betreffende batterijen en accu's die gevaarlijke stoffen bevatten.
    url: https://wetten.overheid.nl/BWBR0007227/2002-05-08#Artikel1
  - number: '2'
    text: >-
      1 Het is verboden batterijen en accu's die meer dan 0,0005 gewichtsprocent kwik bevatten, alsmede apparaten waarin
      dergelijke batterijen of accu's zijn geïntegreerd, te vervaardigen, in te voeren, aan een ander ter beschikking te
      stellen of voorhanden te hebben in handelsvoorraden.


      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing ten aanzien van knoopcellen en uit knoopcellen
      samengestelde batterijen die niet meer dan 2 gewichtsprocent kwik bevatten.
    url: https://wetten.overheid.nl/BWBR0007227/2002-05-08#Artikel2
  - number: '3'
    text: |-
      1 Een ieder die als producent of importeur batterijen of accu's in Nederland op de markt brengt, die kwik, cadmium
      of lood bevatten in een hoeveelheid die de in de bij dit besluit behorende [bijlage I][ref1] aangegeven waarde
      overschrijdt, voorziet deze batterijen of accu's van een aanduiding die door Onze Minister wordt aangegeven ter
      uitvoering van de door de Commissie van de Europese Gemeenschappen op grond van artikel 4, derde lid, van de
      richtlijn gestelde nadere regels.

      2 De verplichting, bedoeld in het eerste lid, geldt eveneens voor de producent of importeur van batterijen of
      accu's als bedoeld in dat lid, die zich bevinden in consumentenapparaten of apparaten die zijn aangewezen in de bij
      dit besluit behorende [bijlage II][ref2].

      3 Onze Minister geeft bij ministeriële regeling uitvoering aan de door de Commissie van de Europese Gemeenschappen
      op grond van artikel 4, derde lid, van de richtlijn gestelde nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0007227
      [ref2]: https://wetten.overheid.nl/BWBR0007227
    url: https://wetten.overheid.nl/BWBR0007227/2002-05-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007227
      - id: ref2
        bwb_id: BWBR0007227
  - number: '4'
    text: |-
      1 Het is verboden consumentenapparaten te vervaardigen, in te voeren, aan een ander ter beschikking te stellen of
      voorhanden te hebben in handelsvoorraden:

      a. indien de batterijen die zich in het apparaat bevinden niet zodanig zijn ingebouwd dat ze gemakkelijk door de
      gebruiker uit het apparaat kunnen worden verwijderd, en

      b. indien in de gebruiksaanwijzing bij het betrokken apparaat niet is aangegeven op welke wijze de gebruiker de
      batterijen uit het apparaat dient te verwijderen.

      2 Het is verboden apparaten die zijn aangewezen in de bij dit besluit behorende bijlage II en waarin zich een
      of meer batterijen bevinden als bedoeld in [artikel 3, eerste lid][ref1], te vervaardigen, in te voeren, aan een
      ander ter beschikking te stellen of voorhanden te hebben in handelsvoorraden, indien ze niet zijn voorzien van
      een gebruiksaanwijzing waarin de gebruiker wordt ingelicht over de voor het milieu gevaarlijke stoffen die de
      batterijen bevatten, en over de wijze waarop de batterijen zonder gevaar uit het apparaat kunnen worden verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0007227#Artikel3
    url: https://wetten.overheid.nl/BWBR0007227/2002-05-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007227
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: >-
      1 Degene die als producent of importeur in Nederland batterijen op de markt brengt met een gewicht van duizend
      gram of minder, draagt er zorg voor dat batterijen van het merk dat door hem op de markt is of wordt gebracht, na
      gebruik worden ingenomen en verwerkt met het oog op hergebruik.


      2 De verplichting, bedoeld in het eerste lid, geldt niet voor de producent of importeur van apparaten die zijn
      aangewezen in de bij dit besluit behorende bijlage II en waarin batterijen vast zijn ingebouwd, die gedurende de
      gebruiksfase van het apparaat niet behoeven te worden vervangen.
    url: https://wetten.overheid.nl/BWBR0007227/2002-05-08#Artikel5
  - number: '6'
    text: |-
      1 De producent of importeur doet binnen twee maanden nadat de in [artikel 5][ref1] bedoelde verplichting voor hem
      is gaan gelden, aan Onze Minister mededeling over de wijze waarop hij uitvoering zal geven aan de in dat artikel
      bedoelde verplichting. Bij de mededeling worden in ieder geval aangegeven:

      a. de maatregelen die gericht zijn op het op de markt brengen van batterijen die geen kwik, cadmium of lood
      bevatten;

      b. de maatregelen die ertoe strekken met ingang van 1 januari 1996 een innamepercentage van ten minste 80 en met
      ingang van 1 januari 1998 een innamepercentage van ten minste 90 te verwezenlijken;

      c. de wijze waarop wordt zorggedragen voor het innemen, bewaren, bewerken en verwerken van de ingenomen batterijen
      met het oog op hergebruik, daaronder begrepen de wijze waarop batterijen in verband met de verwerking worden
      gescheiden;

      d. de wijze van financiering van de afvalbeheersstructuur;

      e. de maatregelen die zijn of worden getroffen in geval van een tijdelijke stagnatie bij de inname of verder
      afvalbeheer;

      f. de maatregelen die zijn of worden getroffen om inname en verder afvalbeheer zeker te stellen, ingeval de
      producent of importeur ophoudt met het in Nederland op de markt brengen van batterijen;

      g. het meet- en monitoringsysteem.

      2 Tot de maatregelen, bedoeld in het eerste lid, onder *b*, behoren in ieder geval:

      a. door de producent of importeur te nemen maatregelen tot het treffen van innamevoorzieningen binnen gemeenten;

      b. door de producent of importeur te nemen maatregelen inzake voorlichting om de consument te stimuleren tot het
      gescheiden inleveren van batterijen bij de in gemeenten bestaande innamevoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0007227#Artikel5
    url: https://wetten.overheid.nl/BWBR0007227/2002-05-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007227
        artikel: '5'
        paragraaf: '3'
  - number: '7'
    text: |-
      1 De mededeling, bedoeld in [artikel 6][ref1], behoeft de goedkeuring van Onze Minister.

      2 Onze Minister neemt binnen acht weken na ontvangst van de mededeling een beslissing over de goedkeuring van deze
      mededeling. Hij kan binnen deze termijn aangeven dat zijn beslissing wordt verdaagd met een daarbij aangegeven
      termijn van ten hoogste acht weken.

      3 Onze Minister kan aan een goedkeuring van de mededeling voorschriften of beperkingen verbinden. Hij kan tevens
      bepalen dat de goedkeuring slechts geldt voor een daarbij vast te stellen termijn.

      4 De producent of importeur voert de in [artikel 5][ref2] bedoelde verplichting uit overeenkomstig de door Onze
      Minister goedgekeurde mededeling.

      5 Zolang geen goedkeuring is verleend, draagt de producent of importeur er zorg voor dat de batterijen worden
      ingenomen en bewaard.

      6 Hij zendt jaarlijks vóór 1 juli aan Onze Minister een verslag over de wijze waarop in het voorafgaande
      kalenderjaar uitvoering is gegeven aan de in [artikel 5][ref3] bedoelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0007227#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007227#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0007227#Artikel5
    url: https://wetten.overheid.nl/BWBR0007227/2002-05-08#Artikel7
