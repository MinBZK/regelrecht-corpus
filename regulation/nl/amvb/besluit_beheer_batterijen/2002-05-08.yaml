  - number: '10'
    text: |-
      1 Het koninklijk besluit van 15 september 1992 tot vaststelling van regels inzake batterijen en accu's die kwik,
      cadmium of lood bevatten (*Stb.* 486) wordt ingetrokken.

      2 Na de inwerkingtreding van dit besluit berust de regeling van de Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer van 15 november 1993, nr. DGM/A 12N93043, tot vaststelling van nadere
      regels inzake de aanduiding van batterijen en accu's die kwik, cadmium of lood bevatten (*Stcrt.* 223), op
      [artikel 3, eerste en derde lid][ref1], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0007227#Artikel3
