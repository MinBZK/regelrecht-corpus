        artikel: '5'
        paragraaf: '3'
  - number: '9'
    text: |-
      1 Onze Minister kan bij ministeriële regeling regels stellen inzake de wijze waarop het innamepercentage, bedoeld
      in [artikel 6, eerste lid, onder ][ref1], wordt gemeten en berekend.

      2 Onze Minister kan, indien de ontwikkelingen op het gebied van de technische mogelijkheden van afvalbeheer daartoe
      aanleiding geven, bij ministeriële regeling bepalen dat vóór een door hem aangegeven tijdstip door de producenten
      en importeurs opnieuw een mededeling dient te worden gedaan.

      3 In geval van toepassing van het tweede lid, vervalt de goedkeuring van een eerder gedane mededeling op het in
      dat lid bedoelde tijdstip dan wel, indien vóór dat tijdstip een nieuwe mededeling is gedaan, op het tijdstip waarop
      door Onze Minister een beslissing inzake de mededeling, bedoeld in dat lid, is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007227#Artikel6
    url: https://wetten.overheid.nl/BWBR0007227/2002-05-08#Artikel9
