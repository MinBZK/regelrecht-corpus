      - id: ref3
        bwb_id: BWBR0007227
        artikel: '5'
        paragraaf: '3'
  - number: '8'
    text: |-
      1 Producenten en importeurs kunnen gezamenlijk een mededeling doen als bedoeld in [artikel 6][ref1].

      2 In afwijking van [artikel 6][ref2] kan een producent of importeur, indien een mededeling als bedoeld in het
      eerste lid is goedgekeurd, volstaan met de mededeling dat hij uitvoering geeft aan de in [artikel 5][ref3] bedoelde
      verplichting overeenkomstig die goedgekeurde mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007227#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007227#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007227#Artikel5
    url: https://wetten.overheid.nl/BWBR0007227/2002-05-08#Artikel8
