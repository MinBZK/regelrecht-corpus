articles:
  - number: '1'
    text: |-
      1 De kerndoelen voor de vakken, genoemd in artikel 11*a*, tweede lid, eerste volzin, van de Wet op het voortgezet
      onderwijs, worden vastgesteld als aangegeven in de bij dit besluit behorende bijlage.

      2 De school hanteert de kerndoelen als aan het eind van de basisvorming ten minste te bereiken doelstellingen.
      Kerndoelen geven een beschrijving van kwaliteiten van leerlingen op het gebied van kennis, inzicht en vaardigheden.
    url: https://wetten.overheid.nl/BWBR0008963/1998-08-01#Artikel1
  - number: '2'
    text: |-
      De in artikel 11*a*, vierde lid, van de Wet op het voortgezet onderwijs bedoelde adviesurentabel voor de vakken,
      genoemd in artikel 11*a*, tweede lid, eerste volzin, van die wet die als grondslag dient voor de vaststelling van
      de kerndoelen, luidt als volgt:








                  Vakken basisvorming


                  Aantal lesuren periode basisvorming





                  (1 lesuur is 50 minuten)






                  Nederlandse taal


                  400




                  Engelse taal


                  280




                  Duitse taal of Franse taal


                  240




                  Geschiedenis en staatsinrichting


                  200




                  Aardrijkskunde


                  140




                  Economie


                  80




                  Wiskunde


                  400




                  Natuur- en scheikunde


                  200




                  Biologie


                  120




                  Verzorging


                  100




                  Informatiekunde


                  20




                  Techniek


                  180




                  Lichamelijke opvoeding


                  360




                  Beeldende vorming


                  280




                  Muziek




                  Drama




                  Dans
    url: https://wetten.overheid.nl/BWBR0008963/1998-08-01#Artikel2
  - number: '3'
    text: |-
      De in het Besluit kerndoelen en adviesurentabel basisvorming 1993–1998 opgenomen adviesurentabel alsmede de in de
      bijlage bij dat besluit opgenomen kerndoelen, zoals deze luiden op 31 juli 1998, kunnen door het bevoegd gezag van
      een school voor voortgezet onderwijs uiterlijk tot 1 augustus 2001 worden gehanteerd voor leerlingen die op 31 juli
      1998 de periode van de basisvorming nog niet hebben afgesloten.
    url: https://wetten.overheid.nl/BWBR0008963/1998-08-01#Artikel3
  - number: '4'
    text: |-
      1 Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.

      2 Het besluit, bedoeld in het eerste lid, wordt aan de beide Kamers der Staten-Generaal overgelegd. Het koninklijk
      besluit, bedoeld in het eerste lid, wordt niet genomen dan nadat vier weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een van beide Kamers der Staten-Generaal de wens wordt te kennen gegeven
      dat het in dit besluit geregelde onderwerp bij de wet wordt geregeld.

      3 Het Besluit kerndoelen en adviesurentabel basisvorming 1998–2003 vervalt met ingang van 1 augustus 2003.
    url: https://wetten.overheid.nl/BWBR0008963/1998-08-01#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Besluit kerndoelen en adviesurentabel basisvorming 1998–2003.'
    url: https://wetten.overheid.nl/BWBR0008963/1998-08-01#Artikel5
