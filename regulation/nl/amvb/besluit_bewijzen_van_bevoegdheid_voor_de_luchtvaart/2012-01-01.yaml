  - number: '26'
    text: |-
      1 Het examen, bedoeld in [artikel 25][ref1], wordt afgenomen door een door Onze Minister in te stellen
      examencommissie.

      2 Onze Minister benoemt, telkens voor een periode van ten hoogste twee jaar, de volgende leden van de
      examencommissie:

      a. de voorzitter,

      b. de plaatsvervangend voorzitter,

      c. de secretaris,

      d. minimaal twee beheerders van de examenvragendatabank.

      3 De benoeming van de in het tweede lid, onderdelen b, c en d, bedoelde leden vindt plaats op voordracht van de
      voorzitter van de examencommissie, in overleg met de in de [artikelen 5.13, eerste lid, onderdeel a][ref2], en
      [5.14, onderdeel a, van de wet][ref3] bedoelde instanties voor luchtverkeersdienstverlening.

      4 Bij ontstentenis van de voorzitter en de plaatsvervangend voorzitter worden hun werkzaamheden verricht door de
      secretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5.13
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5.14
