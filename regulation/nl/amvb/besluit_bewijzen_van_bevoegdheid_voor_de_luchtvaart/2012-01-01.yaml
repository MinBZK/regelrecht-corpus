  - number: '12'
    text: |-
      Onze Minister kan nadere regels geven met betrekking tot het afgeven van bewijzen van gelijkstelling. Deze regels
      omvatten in ieder geval bepalingen betreffende eisen inzake kennis, bedrevenheid, ervaring, leeftijd en medische
      geschiktheid.
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel12
  - number: '13'
    text: |-
      1 Onze Minister geeft nadere regels met betrekking tot de erkenning, registratie of kwalificatie van een
      opleidingsinstelling. Deze regels omvatten in ieder geval bepalingen betreffende:

      a. voor de registratie:

      1. de bij de aanvraag in te dienen gegevens,

      2. eisen inzake de opleiding,

      3. de afgifte, geldigheidsduur, intrekking en wijziging;

      b. voor de erkenning en de kwalificatie:

      1. de bij de aanvraag in te dienen gegevens,

      2. eisen inzake de organisatie en eisen inzake de opleiding,

      3. de afgifte, geldigheidsduur, verlenging, intrekking en wijziging.

      2 Onze Minister stelt de tarieven vast, volgens welke de kosten, bedoeld in
      [artikel 2.9, vierde lid, van de wet][ref1] worden vergoed.

      3 Onze Minister geeft nadere regels met betrekking tot de kwalificatie van STD's. Deze regels omvatten in ieder
      geval bepalingen betreffende:

      a. de bij de aanvraag in te dienen gegevens;

      b. het onderscheid in eisen naar niveau;

      c. de afgifte, geldigheidsduur, verlenging, schorsing, intrekking en wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2.9'
  - number: '14'
    text: |-
      1 Als bewijs, dat wordt voldaan aan de eisen met betrekking tot de nodige kennis en bedrevenheid voor een bewijs
      van bevoegdheid als bedoeld in [artikel 2][ref1] of een bevoegdverklaring als bedoeld in [artikel 3][ref2]
      of [5][ref3], wordt met goed gevolg een examen afgelegd.

      2 Het examen kan bestaan uit een theorie- en een praktijkgedeelte.

      3 Voor de bewijzen van bevoegdheid, bedoeld in [artikel 2, eerste lid, onderdelen f en g][ref4], en voor de daarbij
      behorende bevoegdverklaringen kan aan de eisen als bedoeld in het eerste lid tevens worden voldaan door het met
      goed gevolg afronden van een opleiding aan een door Onze Minister daartoe erkende opleidingsinstelling dan wel aan
      een door de bevoegde autoriteit van een JAA-land daartoe erkende opleidingsinstelling.

      4 Onze Minister kan nadere regels geven met betrekking tot het examen.

      5 Het derde lid is van overeenkomstige toepassing op het verkrijgen van de algemene bevoegdverklaring, bedoeld in
      [artikel 3, tweede lid, onderdeel l][ref5].


