      3 Een voor de categorie vrije ballonnen afgegeven CPL geeft de bevoegdheid tegen vergoeding op te treden als
      bestuurder van een vrije ballon die luchtwaardig is bevonden, onder de volgende beperkingen:

      a. alleen tijdens VFR-vluchten, en

      b. vaart bij nacht is slechts toegestaan, indien de houder ten minste twee opstijgingen bij nacht met een
      gemiddelde duur van twee uur elk onder toezicht van een bevoegde houder die reeds de nodige ervaring in nachtvaren
      bezit, heeft uitgevoerd.

      4 De bewijzen van bevoegdheid als bedoeld in het eerste lid, onderdelen f en g, worden afgegeven wanneer ten minste
      één bijzondere bevoegdverklaring daarop wordt weergegeven.

      5 De bevoegdheden die voortvloeien uit een bewijs van bevoegdheid zijn steeds beperkt tot die typen of klassen
      luchtvaartuigen of tot die werkzaamheden waarvoor een bijzondere bevoegdverklaring is afgegeven.

      6 De bewijzen van bevoegdheid als bedoeld in het eerste lid worden afgegeven voor onbepaalde duur.


