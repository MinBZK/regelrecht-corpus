  - number: '28'
    text: |-
      1 Bij regeling van Onze Minister worden regels vastgesteld voor het examen, bedoeld in [artikel 25][ref1].

      2 De regels, bedoeld in het eerste lid, betreffen in ieder geval:

      a. de taken en verantwoordelijkheden van de examencommissie;

      b. de taken en verantwoordelijkheden van verleners van luchtvaartnavigatiediensten en exploitanten van luchthavens
      en hun personeel met betrekking tot examens;

      c. de wijze van het afnemen van examens;

      d. vrijstelling en ontheffing van examens;

      e. exameneisen;

      f. toelatingseisen.

      3 Onze Minister hoort de voorzitter van de examencommissie omtrent de vaststelling van regels, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel25
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel28
