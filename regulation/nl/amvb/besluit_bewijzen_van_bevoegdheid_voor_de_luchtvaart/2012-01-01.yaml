  - number: '3'
    text: |-
      1 Aan houders van een RPL kan, onder de krachtens [artikel 2.2 van de wet][ref1] genoemde bijzondere
      bevoegdverklaringen, al dan niet onder beperkingen naar soort vlucht of ervaring, één of meer van de volgende
      algemene bevoegdverklaringen worden afgegeven:

      a. RT, dat de bevoegdheid geeft om radiocontact met de luchtverkeersdienst, als bedoeld in
      [artikel 1 van het Luchtverkeersreglement][ref2], of met bestuurders van andere luchtvaartuigen te onderhouden;

      b. RFI, dat de bevoegdheid geeft om vliegonderricht te geven voor de afgifte van een:

      1. RPL, of

      2. bijzondere bevoegdverklaring in een RPL;

      2 Aan houders van een PPL, CPL, MPL of ATPL kan, onder de krachtens [artikel 2.2 van de wet][ref3] genoemde
      bijzondere bevoegdverklaringen, al dan niet onder beperkingen naar soort vlucht of ervaring, een of meer van de
      volgende algemene bevoegdverklaringen worden afgegeven:

      a. RT, dat de bevoegdheid geeft om radiocontact met de luchtverkeersdienst, als bedoeld in
      [artikel 1 van het Luchtverkeersreglement][ref4], of met bestuurders van andere luchtvaartuigen, te onderhouden;

      b. IR als bedoeld in JAR-FCL 1 en 2, subdelen E, met de bevoegdheden en onder de voorwaarden, bedoeld in JAR-FCL
      1.180 en JAR-FCL 2.180;

      c. CSR, dat de bevoegdheid geeft om een luchtvaartuig te bedienen waarmee stoffen ter bescherming of bevordering
      van het milieu of de land-, tuin-, of bosbouw vanuit de lucht worden verspreid;

      d. FI, dat de bevoegdheid geeft om, onder de beperkingen, bedoeld in JAR-FCL 1.310, onderdeel a, en JAR-FCL 2.310,
      onderdeel a, vliegonderricht te geven als bedoeld in JAR-FCL 1.330 en JAR-FCL 2.320(C);

      e. TRI, dat de bevoegdheid geeft om, onder de beperkingen, bedoeld in JAR-FCL 1.310, onderdeel a, en JAR-FCL 2.310,
      onderdeel a, vliegonderricht te geven als bedoeld in JAR-FCL 1.360 en JAR-FCL 2.330(A);

      f. CRI, dat de bevoegdheid geeft om, onder de beperkingen, bedoeld in JAR-FCL 1.310, onderdeel a, vliegonderricht
      te geven als bedoeld in JAR-FCL 1.375;

      g. IRI, dat de bevoegdheid geeft om, onder de beperkingen, bedoeld in JAR-FCL 1.310, onderdeel a, en JAR-FCL 2.310,
      onderdeel a, vliegonderricht te geven als bedoeld in JAR-FCL 1.390 en JAR-FCL 2.340(A);

      h. MCCI, dat de bevoegdheid geeft om, onder de beperkingen, bedoeld in JAR-FCL 1.310, onderdeel a, vliegonderricht
      te geven als bedoeld in JAR-FCL 1.416;

      i. SFI, dat de bevoegdheid geeft om, onder de beperkingen, bedoeld in JAR-FCL 1.310, onderdeel a, en JAR-FCL 2.310,
      onderdeel a, vliegonderricht te geven als bedoeld in JAR-FCL 1.405 en JAR-FCL 2.350(A);

      j. STI, dat de bevoegdheid geeft om, onder de beperkingen, bedoeld in JAR-FCL 1.310, onderdeel a, en JAR-FCL 2.310,
      onderdeel a, vliegonderricht te geven, als bedoeld in JAR-FCL 1.419, onderdeel a, en JAR-FCL 2.360(A);

      k. night qualification, dat de bevoegdheid geeft om de bevoegdheden van het bewijs van bevoegdheid waarvoor de
      bevoegdverklaring wordt afgegeven 's nachts uit te voeren, en dat uitsluitend wordt afgegeven aan de houder van een
      PPL of CPL;

      l. LPE als bedoeld in JAR-FCL 1 en 2 met de bevoegdheden en voorwaarden, bedoeld in JAR-FCL 1.010 en JAR-FCL 2.010
      en Bijlage 1 bij het verdrag.

      3 De bevoegdheden die voortvloeien uit een RT zijn steeds beperkt tot het overeenkomende bewijs van bevoegdheid van
      de houder.

      4 De bevoegdheden die voortvloeien uit een algemene bevoegdverklaring, met uitzondering van de RT, zijn steeds
      beperkt tot die categorie luchtvaartuigen waarvoor de bevoegdverklaring is afgegeven.

      5 Onverminderd het tweede lid, onderdelen a en j, kan aan houders van een CPL(FB) de algemene bevoegdverklaring
      FI(FB) worden afgegeven dat de bevoegdheid geeft onderricht te geven in het besturen van vrije ballonnen voor:

      a. de afgifte van een CPL(FB);

      b. VFR-nachtvliegen;

      c. de afgifte van een FI(FB).


