        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '20'
    text: |-
      1 Met inachtneming van [artikel 19][ref1] wordt een bewijs van bevoegdheid voor luchtverkeersleider, leerling-
      luchtverkeersleider en vluchtinformatieverstrekker op aanvraag verleend aan een ieder die:

      a. in het bezit is van een geldige medische verklaring,

      b. voldoet aan bij ministeriële regeling te stellen eisen inzake kennis, bedrevenheid en ervaring, en

      c. overeenkomstig Bijlage 1 bij het op 7 december 1944 te Chicago gesloten Verdrag inzake de Internationale
      Burgerluchtvaart (Trb. 1973, 109) voldoet aan de vereisten inzake het vermogen tot beheersing van de Engelse taal
      op de niveaus 4, 5 of 6.

      2 Het eerste lid, onderdeel b, is van overeenkomstige toepassing op het verlenen van bewijzen van bevoegdheid
      voor luchthaveninformatieverstrekker en op het verlenen van bevoegdverklaringen en aantekeningen als bedoeld in
      [artikel 18][ref2].

      3 Onze Minister stelt de tarieven vast, volgens welke de kosten, bedoeld in
      [artikel 2.3, zesde lid, onderdeel h, van de wet][ref3], worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2.3
