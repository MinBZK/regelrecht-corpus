  - number: '8'
    text: |-
      1 Met inachtneming van de [artikelen 2][ref1], [3][ref2] en [6][ref3] wordt het bewijs van bevoegdheid of de
      bevoegdverklaring op aanvraag afgegeven aan een ieder die:

      a. voldoet aan de bij ministeriële regeling vast te stellen vereisten inzake kennis, bedrevenheid, ervaring en
      opleiding, en,

      b. met uitzondering van de bewijzen van bevoegdheid, bedoeld in [artikel 2, eerste lid, onderdelen f en g][ref4]„ en
      de daarbij behorende bevoegdverklaringen, in het bezit is van een geldige medische verklaring, en,

      c. voldoet aan de in JAR-FCL 1.010 , JAR-FCL 2.010 of de in Bijlage 1 bij het verdrag gestelde vereisten inzake het
      vermogen tot beheersing van de Engelse taal op de niveaus 4, 5 of 6, indien het de aanvraag betreft van een bewijs
      van bevoegdheid als bedoeld in [artikel 3, tweede lid][ref5], waaraan de algemene bevoegdverklaring, bedoeld in
      [artikel 3, tweede lid, onderdeel a][ref6], wordt verbonden.

      2 De aanvraag tot afgifte van een bewijs van bevoegdheid of bevoegdverklaring wordt gedaan op een daartoe door Onze
      Minister verstrekt aanvraagformulier.

      3 Onze Minister stelt de tarieven vast, volgens welke de kosten, bedoeld in
      [artikel 2.3, zesde lid, onderdeel h, van de wet][ref7], worden vergoed.


