        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 24c
    text: |-
      1 Onze Minister geeft regels met betrekking tot de certificering van opleidingsinstellingen voor het verlenen van
      luchtverkeersdiensten. Deze regels omvatten in ieder geval bepalingen betreffende:

      a. de aanvraag, afgifte, intrekking en wijziging van de certificering;

      b. de bij de aanvraag in te dienen gegevens;

      c. de geldigheidsduur van de certificering;

      d. de technische en operationele bekwaamheden van de opleidingsinstelling;

      e. het vermogen van de opleidingsinstelling opleidingen te organiseren.

      2 Onze Minister stelt de tarieven vast, volgens welke de kosten, bedoeld in
      [artikel 2.9, vierde lid, van de wet][ref1] worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel24c
