  - number: '19'
    text: |-
      1 De minimumleeftijd voor de afgifte van een bewijs van bevoegdheid als bedoeld in [artikel 17][ref1] bedraagt
      voor:

      a. luchtverkeersleider: 21 jaar;

      b. leerling-luchtverkeersleider: 18 jaar;

      c. vluchtinformatieverstrekker: 18 jaar;

      d. luchthaveninformatieverstrekker: 18 jaar.

      2 Onze Minister kan in gerechtvaardigde gevallen ambtshalve de leeftijd voor de afgifte van een bewijs van
      bevoegdheid voor luchtverkeersleider verlagen tot minimaal 19 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel17
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel19
