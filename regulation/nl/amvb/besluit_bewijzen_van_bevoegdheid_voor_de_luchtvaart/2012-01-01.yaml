  - number: '4'
    text: |-
      1 De in [artikel 3, eerste en tweede lid, onderdeel a][ref1], genoemde bevoegdverklaring wordt voor onbepaalde
      duur afgegeven.

      2 De in [artikel 3, eerste lid, onderdeel b, en tweede lid, onderdeel c][ref2], genoemde bevoegdverklaringen worden
      voor de duur van ten hoogste twee jaar afgegeven.

      3 De in [artikel 3, tweede lid, onderdelen d tot en met j, en vijfde lid][ref3], genoemde bevoegdverklaringen
      worden voor de duur van ten hoogste drie jaar afgegeven.

      4 De geldigheidsduur, bedoeld in het tweede en derde lid, wordt, indien de bevoegdverklaring niet is afgegeven per
      de eerste dag van de maand van afgifte, berekend vanaf de eerste dag van de maand, volgend op de maand van afgifte.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel3
