  - number: '22'
    text: |-
      1 De vereisten inzake ervaring voor het verkrijgen van een bewijs van bevoegdheid voor vluchtinformatieverstrekker
      zijn niet van toepassing op personen die maximaal 24 maanden voor de datum van aanvraag in het bezit waren van een
      geldig bewijs van bevoegdheid voor luchtverkeersleider.

      2 De vereisten inzake ervaring voor het verkrijgen van een bewijs van bevoegdheid voor
      luchthaveninformatieverstrekker zijn niet van toepassing op personen die maximaal 24 maanden voor de
      datum van de aanvraag in het bezit waren van een geldig bewijs van bevoegdheid voor luchtverkeersleider of
      vluchtinformatieverstrekker.
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel22
  - number: '24'
    text: |-
      1 Onze Minister kan een bewijs van bevoegdheid vernieuwen, indien het is verloren of indien het onleesbaar,
      beschadigd of anderszins onbruikbaar is geworden.

      2 Indien een bewijs van bevoegdheid wegens verlies is vernieuwd en het verloren bewijs wordt teruggevonden, zendt
      de houder het teruggevonden bewijs zo spoedig mogelijk aan Onze Minister.

      3 Indien een bewijs van bevoegdheid anders dan wegens verlies is vernieuwd, kan Onze Minister de houder opdragen
      het oorspronkelijke bewijs binnen een week na de datum van verzending van het nieuwe bewijs aan Onze Minister te
      zenden.
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel24
  - number: 24a
    text: |-
      1 Voor het verzorgen van opleidingen tot luchtverkeersleider vluchtinformatieverstrekker of
      luchthaveninformatieverstrekker is een door Onze Minister goed te keuren opleidingenplan noodzakelijk.

      2 Bij regeling van Onze Minister worden nadere regels gesteld voor de goedkeuring van het in het eerste lid
      bedoelde opleidingenplan, die in ieder geval betrekking hebben op:

      a. eisen inzake de inhoud van de opleiding;

      b. de in het opleidingplan op te nemen gegevens;

      c. de geldigheidsduur en wijze van de goedkeuring;

      d. de onderdelen waaruit een opleidingenplan kan bestaan.
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel24a
  - number: 24b
    text: |-
      Onze Minister geeft regels met betrekking tot de kwalificatie van STD’s voor luchtverkeersleider.
      [Artikel 13, derde lid, tweede volzin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel13
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel24b
    references:
