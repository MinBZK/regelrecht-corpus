  - number: '10'
    text: |-
      1 Het document waarop het bewijs van bevoegdheid en de bevoegdverklaring zijn weergegeven wordt afgegeven voor een
      periode van ten hoogste vijf jaar.

      2 Onze Minister vernieuwt een document als bedoeld in het eerste lid na afgifte of wederafgifte van een
      bevoegdverklaring en wanneer de ruimte, bestemd om verlengingen van bevoegdverklaringen aan te tekenen, geheel is
      ingevuld, en stelt nadere regels met betrekking tot de eisen voor wederafgifte van een bevoegdverklaring.

      3 Onze Minister kan een document als bedoeld in het eerste lid vernieuwen, indien het is verloren, indien het
      onleesbaar, beschadigd of anderszins onbruikbaar is geworden, om enige administratieve reden of, naar zijn
      goeddunken, wanneer een bevoegdverklaring wordt verlengd.

      4 Indien een document wegens verlies is vernieuwd en het verloren document wordt teruggevonden, zendt de houder het
      teruggevonden document zo spoedig mogelijk aan Onze Minister.

      5 Indien een document anders dan wegens verlies is vernieuwd, kan Onze Minister de houder opdragen het
      oorspronkelijke document binnen een week na de datum van verzending van het nieuwe document aan Onze Minister te
      zenden.
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel10
  - number: '11'
    text: |-
      1 [Artikel 2.1, eerste en tweede lid, van de wet][ref1] is niet van toepassing op:

      a. het bedienen van een modelvliegtuig, waarvan de totale massa ten hoogste 25 kg bedraagt;

      b. het bedienen van een ballon, die op zeeniveau in de internationale standaard-atmosfeer in geheel gevulde
      toestand een diameter van ten hoogste 2.00 m of een inhoud van ten hoogste 4.00 kubieke m heeft, alsmede aan elkaar
      gekoppelde ballonnen waarvan de gezamenlijke diameter en inhoud deze waarden niet te boven gaan;

      c. het bedienen van een toestel, zwaarder dan lucht, en niet voorzien van een voortstuwingsinrichting, dat door
      middel van een ankerkabel of lijn is verbonden met het aardoppervlak (kabelvlieger);

      d. bedienen van een luchtschip, dat op zeeniveau in de internationale standaard atmosfeer in geheel gevulde
      toestand een grootste afmeting heeft van 5.00 m of een inhoud van ten hoogste 4.00 kubieke m;

      e. het bedienen van een toestel, zwaarder dan lucht in de vorm van een scherm met harnas, dat met een
      lijn of lijnen is bevestigd aan een voertuig of vaartuig, waardoor het in de lucht kan worden gehouden
      (valschermzweeftoestel);

      f. het bedienen van een zeilvliegtuig, onder door Onze Minister bij ministeriële regeling te stellen voorschriften
      en beperkingen;

      g. het bedienen van een schermvliegtuig onder door Onze Minister bij ministeriële regeling te stellen voorwaarden;

      h. het bedienen van een ballon, die tijdens het in de lucht houden permanent is bevestigd aan het aardoppervlak
      (kabelballon);

      i. het bedienen van een scherm dat dient om de daalsnelheid van een persoon zodanig te beperken dat deze veilig het
      aardoppervlak kan bereiken (valscherm);

      j. het bedienen van een luchtvaartuig onder toezicht van een instructeur, die houder is van een voor de
      bediening van dat luchtvaartuig en die vlucht afgegeven bewijs van bevoegdheid, waarop weergegeven de nodige
      bevoegdverklaringen op een zodanige wijze dat de instructeur onmiddellijk kan ingrijpen;

      k. het uitvoeren van een solovlucht onder toezicht van een instructeur, die houder is van een voor de bediening van
      dat luchtvaartuig en die vlucht afgegeven bewijs van bevoegdheid, waarop weergegeven de nodige bevoegdverklaringen,
      door een bestuurder, die geen houder is van een bewijs van bevoegdheid, indien de bestuurder:

      1. beschikt over voldoende kennis voor de uit te voeren solovlucht;

      2. beschikt over een geldige medische verklaring klasse 1 of 2; en

      3. beschikt over een schriftelijke soloverklaring van de instructeur;

      l. het bedienen van een zweefvliegtuig;

      m. het bedienen van een vrije ballon, niet tegen vergoeding, die luchtwaardig is bevonden voor maximaal vier
      inzittenden, tijdens vluchten zonder baat onder de in [artikel 2, eerste lid, onder a, ten 1° en 2°][ref2]
      bedoelde beperkingen;

      n. het uitoefenen van de bevoegdheden die behoren bij de bevoegdverklaringen SFI, MCCI, STI of een specifieke
      autorisatie, genoemd in JAR-FCL 1.300, indien:

      1°. betrokkene heeft voldaan aan de door Onze Minister vast te stellen afgifte-eisen voor de respectieve
      bevoegdverklaringen, en

      2°. aan betrokkene door Onze Minister een autorisatiedocument is afgegeven, waarop de bepalingen die bij of
      krachtens de wet gelden met betrekking tot de bevoegdverklaringen SFI, MCCI, STI of een specifieke autorisatie,
      genoemd in JAR-FCL 1.300, van kracht zijn.

      2 Het eerste lid, onderdelen b tot en met m, is van toepassing indien de bestuurder:

      a. de leeftijd van 16 jaar heeft bereikt, met dien verstande, dat de bestuurder van een zweeftoestel die een
      solovlucht uitvoert binnen zichtafstand van de luchthaven tot een maximum van 5 kilometer rondom de luchthaven, de
      leeftijd van 14 jaar heeft bereikt,

      b. kan aantonen te beschikken over voldoende bekwaamheid om op een veilige manier deel te nemen aan het
      luchtverkeer, en

      c. kan aantonen dat een verzekering is gesloten tegen de burgerrechtelijke aansprakelijkheid jegens derden als
      gevolg van het gebruik van het luchtvaartuig.

      3 De [artikelen 2.1, eerste lid][ref3], voor zover dit betrekking heeft op het bedienen van een grondstation
      of mobiel station in de luchtvaartmobiele band, waarvoor een vergunning is vereist als bedoeld in
      [artikel 3.3 van de Telecommunicatiewet][ref4], en [artikel 2.2, tweede lid, van de wet][ref5] zijn niet van
      toepassing op degene die een luchtvaartuig als bedoeld in het eerste lid bedient of een solovlucht als bedoeld
      in onderdeel k van dat lid uitvoert, en houder is van een door Onze Minister afgegeven certificaat waaruit
      blijkt, dat die houder bevoegd is tot het bedienen van een grondstation of mobiel station als bedoeld in
      [artikel 2.1, eerste lid, van de wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2.1
