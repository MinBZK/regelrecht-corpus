  - number: '15'
    text: |-
      1 Onze Minister stelt het resultaat van het theorie-en praktijkexamen vast.

      2 Onze Minister stelt nadere regels met betrekking tot de autorisatie van examinatoren. Deze regels omvatten in
      ieder geval bepalingen betreffende:

      a. de bij de aanvraag tot autorisatie in te dienen gegevens;

      b. de afgifte, geldigheidsduur, verlenging en intrekking van de autorisatie;

      c. de eisen inzake kennis, bedrevenheid en ervaring;

      d. het onderscheid in bevoegdheden naar soort autorisatie.

      3 De examens ter verkrijging van de bewijzen van bevoegdheid, bedoeld in
      [artikel 2, eerste lid, onderdelen f en g][ref1], en van de daarbij behorende bevoegdverklaringen worden afgelegd
      voor een door Onze Minister daartoe in te stellen examencommissie of aan te wijzen erkende opleidingsinstelling.
      Bij ministeriële regeling geeft Onze Minister nadere regels, die in ieder geval regels bevatten met betrekking tot:

      a. de samenstelling en werkwijze van de commissie;

      b. de bekwaamheidseisen waaraan de commissieleden moeten voldoen;

      c. de richtlijnen met betrekking tot het afnemen van examens.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '16'
    text: |-
      1 Onze Minister stelt een examenreglement vast.

      2 In dit reglement kunnen bepalingen opgenomen worden omtrent:

      a. de wijze van examinering;

      b. de duur van examens en de wijze waarop examens worden uitgevoerd;

      c. de vaststelling van de examenopgaven voor het schriftelijke gedeelte;

      d. de groepen van vakken waarin examens kunnen worden afgelegd;

      e. het gebruik van STD's ten behoeve van examens;

      f. de aanmelding voor examens;

      g. de toelating tot examens;

      h. geheimhouding;

      i. het toezicht op theorie- en praktijkexamens;

      j. de uitsluiting van een examinandus van examens;

      k. de ordemaatregelen tijdens examens;

      l. de beoordeling van examens;

      m. de vaststelling van het resultaat van examens;

      n. de kennisgeving van de uitslag;

      o. de mogelijkheid van herexamens;

      p. het afnemen van praktijkexamens;

      q. de termijn waarbinnen examens moeten zijn afgelegd;

      r. de uitsluiting van examens;

      s. frequentie van het examen.
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel16
  - number: '17'
    text: |-
      Onze Minister kan bewijzen van bevoegdheid afgeven voor:

      a. luchtverkeersleider;

      b. leerling-luchtverkeersleider;

      c. vluchtinformatieverstrekker;

      d. luchthaveninformatieverstrekker.
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel17
  - number: '18'
    text: |-
      1 Onze Minister kan op de bewijzen van bevoegdheid voor luchtverkeersleider, leerling-luchtverkeersleider,
      vluchtinformatieverstrekker en luchthaveninformatieverstrekker een of meer van de onderstaande bevoegdverklaringen
      weergeven op de wijze zoals aangegeven in de [bijlage II][ref1] bij dit besluit:

      a. ADV: bevoegdheid tot het verlenen van luchtverkeersleidingsdiensten ten behoeve van het luchthavenverkeer op of
      in de nabijheid van een luchthaven die niet over gepubliceerde procedures voor nadering of vertrek op instrumenten
      beschikt (Aerodrome Control Visual);

      b. ADI: bevoegdheid tot het verlenen van luchtverkeersleidingsdiensten ten behoeve van het luchthavenverkeer op
      of in de nabijheid van een luchthaven die over gepubliceerde procedures voor nadering of vertrek op instrumenten
      beschikt (Aerodrome Control Instrument);

      c. APP: bevoegdheid tot het verlenen van luchtverkeersleidingsdiensten ten behoeve van aankomende, vertrekkende of
      doorvliegende vliegtuigen zonder hulp van surveillanceapparatuur (Approach Control Procedural);

      d. APS: bevoegdheid tot het verlenen van luchtverkeersleidingsdiensten ten behoeve van aankomende, vertrekkende of
      doorvliegende vliegtuigen met behulp van surveillanceapparatuur (Approach Control Surveillance);

      e. ACP: bevoegdheid tot het verlenen van luchtverkeersleidingsdiensten zonder surveillanceapparatuur (Area Control
      Procedural);

      f. ACS: bevoegdheid tot het verlenen van luchtverkeersleidingsdiensten met behulp van surveillanceapparatuur (Area
      Control Surveillance);

      g. ADR: bevoegdheid van:

      1°. vluchtinformatieverstrekkers tot het verstrekken van advies en inlichtingen aan luchthavenverkeer en
      luchtverkeer op en nabij een luchthaven dan wel het verstrekken van alarmering;

      2°. luchtvaartterreininformatieverstrekkers tot het verstrekken van luchthaveninformatie aan luchthavenverkeer op
      een luchthaven (Aerodrome);

      h. AER: bevoegdheid tot het verstrekken van advies en inlichtingen aan luchtverkeer dan wel tot verstrekken van
      alarmering (Area).

      2 Onze Minister kan op de bewijzen van bevoegdheid voor luchtverkeersleider, leerling-luchtverkeersleider,
      vluchtinformatieverstrekker en luchthaveninformatieverstrekker een of meer van onderstaande aantekeningen weergeven
      op de wijze zoals aangegeven in de [bijlage II][ref2] bij dit besluit:

      a. aantekening bij de bevoegdverklaring: op het bewijs van bevoegdheid aangebrachte en hiervan deel uitmakende
      machtiging waarin de specifieke aan de bevoegdverklaring verbonden voorwaarden, rechten of beperkingen zijn
      weergegeven (rating endorsement);

      b. aantekening bij het bewijs van bevoegdheid: op het bewijs van bevoegdheid aangebracht en hiervan deel uitmakende
      machtiging waarin de specifieke aan het bewijs van bevoegdheid verbonden voorwaarden, rechten of beperkingen zijn
      weergegeven (licence endorsement);

      c. aantekening betreffende de eenheid: op het bewijs van bevoegdheid aangebracht en hiervan deel uitmakende
      machtiging waarin de ICAO-locatie-indicator wordt weergegeven alsook de sectoren of werkplekken waarvoor de houder
      van het bewijs van bevoegdheid bevoegd is (unit endorsement);

      d. aantekening betreffende de taalvaardigheid: op het bewijs van bevoegdheid aangebracht en hiervan deel uitmakende
      machtiging waarin de taalvaardigheid van de houder wordt aangegeven (language endorsement);

      3 Een bevoegdverklaring als bedoeld in het eerste lid is slechts geldig indien aan deze bevoegdverklaring de
      relevante aantekening betreffende de luchtverkeersleidingseenheid en de overige noodzakelijke aantekeningen zoals
      weergegeven in de [bijlage II][ref3] bij dit besluit zijn verbonden.

      4 Een aantekening als bedoeld in het tweede lid is slechts geldig in samenhang met het bewijs van bevoegdheid of de
      bevoegdverklaring waarvan zij deel uitmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010629
      [ref2]: https://wetten.overheid.nl/BWBR0010629
      [ref3]: https://wetten.overheid.nl/BWBR0010629
