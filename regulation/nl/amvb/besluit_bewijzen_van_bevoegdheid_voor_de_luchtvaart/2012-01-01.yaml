  - number: '21'
    text: |-
      1 Een bewijs van bevoegdheid voor luchtverkeersleider, vluchtinformatieverstrekker of
      luchthaveninformatieverstrekker, een bevoegdverklaring of een aantekening bij de bevoegdverklaring als bedoeld in
      [artikel 18][ref1] wordt voor onbepaalde tijd afgegeven.

      2 Het bewijs van bevoegdheid voor leerling-luchtverkeersleider wordt afgegeven voor een termijn van 24 maanden.
      In uitzonderlijk gevallen kan Onze Minister het bewijs van bevoegdheid nogmaals voor maximaal 24 maanden
      verlengen mits de houder aantoont over voldoende kennis, bedrevenheid en ervaring te beschikken. Het bewijs van
      bevoegdheid voor leerling-luchtverkeersleider vervalt zodra aan de houder daarvan een bewijs van bevoegdheid voor
      luchtverkeersleider met ten minste één bevoegdverklaring en de relevante aantekening is afgegeven.

      3 De aantekening betreffende de eenheid wordt voor een termijn van 12 maanden weergegeven.

      4 De aantekening bij het bewijs van bevoegdheid wordt voor een termijn van 36 maanden weergegeven.

      5 De termijnen, bedoeld in het derde en vierde lid, worden met eenzelfde termijn verlengd indien de houder voldoet
      aan bij ministeriële regeling te stellen regels inzake kennis, bedrevenheid en ervaring.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel18
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel21
