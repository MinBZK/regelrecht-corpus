  - number: 1b
    text: |-
      Van overeenkomstige toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, zijn:

      a. Verordening (EG) nr. 216/2008 van het Europees Parlement en de Raad van 20 februari 2008 tot vaststelling van
      gemeenschappelijke regels op het gebied van burgerluchtvaart en tot oprichting van een Europees Agentschap voor
      de veiligheid van de luchtvaart, houdende intrekking van Richtlijn 91/670/EEG, Verordening (EG) nr. 1592/2002 en
      Richtlijn 2004/36/EG (PbEU L 79), en

      b. Verordening (EG) nr. 2042/2003 van de Commissie van de Europese Gemeenschappen van 20 november 2003 betreffende
      de permanente luchtwaardigheid van luchtvaartuigen en luchtvaartproducten, -onderdelen en -uitrustingsstukken,
      en betreffende de goedkeuring van bij voornoemde taken betrokken organisaties en personen (PbEU L 315), met dien
      verstande dat bij ministeriële regeling nadere regels kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0010629/2012-01-01#Artikel1b
  - number: '2'
    text: |-
      1 Onze Minister kan de volgende bewijzen van bevoegdheid afgeven:

      a. RPL, dat de bevoegdheid geeft, niet tegen vergoeding, op te treden als bestuurder van een luchtvaartuig, dat
      gecertificeerd is of luchtwaardig is bevonden voor maximaal 4 inzittenden, tijdens vluchten zonder baat, onder de
      volgende beperkingen:

      1°. alleen tijdens VFR-vluchten;

      2°. alleen tijdens de daglichtperiode als bedoeld in [artikel 1 van het Luchtverkeersreglement][ref1], en

      3°. niet met passagiers, tenzij de houder ten minste tien uur ervaring heeft als gezagvoerder van een luchtvaartuig
      van dezelfde categorie of met dezelfde bijzondere bevoegdverklaring en de houder in de voorafgaande negentig dagen
      ten minste drie starts en drie landingen heeft uitgevoerd als gezagvoerder van een luchtvaartuig van dezelfde
      categorie en met dezelfde bijzondere bevoegdverklaring;

      b. PPL als bedoeld in JAR-FCL 1 en 2, subdeel C, met de bevoegdheden en onder de voorwaarden genoemd in JAR-FCL
      1.110 en JAR-FCL 2.110;

      c. CPL als bedoeld in JAR-FCL 1 en 2, subdeel D, met de bevoegdheden en onder de voorwaarden, bedoeld in JAR-FCL
      1.150 en JAR-FCL 2.150;

      d. ATPL als bedoeld in JAR-FCL 1 en 2, subdeel G, met de bevoegdheden en onder de voorwaarden, bedoeld in JAR-FCL
      1.275 en JAR-FCL 2.275;

      e. CFEL, dat de bevoegdheid geeft op te treden als boordwerktuigkundige van een luchtvaartuig;

      f. AML, dat, voorzien van één of meer bijzondere bevoegdverklaringen de bevoegdheid geeft tot het onderhouden
      van luchtvaartuigen en het toezicht daarop, alsmede het vrijgeven voor gebruik van die luchtvaartuigen na dat
      onderhoud;

      g. Part-66-AML, dat voorzien van een of meer bijzondere bevoegdverklaringen:

      1°. de bevoegdheid geeft tot het onderhouden van luchtvaartuigen en het toezicht daarop, alsmede het vrijgeven voor
      gebruik van die luchtvaartuigen na dat onderhoud, binnen de grenzen gesteld in Part-M; en

      2°. in combinatie met een daartoe strekkende bevoegdverklaring van de houder van een MOA of een MOA-F de
      bevoegdheid geeft tot het afgeven van certificaten van vrijgave voor gebruik van luchtvaartuigen namens de houder
      van die erkenning na onderhoud aan die luchtvaartuigen;

      h. MPL als bedoeld in JAR-FCL 1, subdeel K, met de bevoegdheden en onder de voorwaarden, bedoeld in JAR-FCL 1.510,
      1.520, 1.525 en de bijlage behorende bij JAR-FCL 1.520 en 1.525.

