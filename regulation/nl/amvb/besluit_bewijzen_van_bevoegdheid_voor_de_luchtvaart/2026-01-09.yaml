      VLOS, dat de bevoegdheid geeft op te treden als bestuurder van een RPA waarvan de totale massa niet meer dan 150 kg
      bedraagt, tijdens operaties binnen zichtafstand van de bestuurder onder de volgende beperkingen:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel3
  - number: 3.4.a.1°
    text: alleen tijdens VFR-vluchten;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel3
  - number: 3.4.a.2°
