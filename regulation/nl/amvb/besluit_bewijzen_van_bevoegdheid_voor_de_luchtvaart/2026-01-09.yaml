  - number: 1b
    text: 'Van overeenkomstige toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, zijn:'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel1b
  - number: 1b.a
    text: de basisverordening, voor zover het Hoofdstuk III, Deel II en Afdeling VI betreft,
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel1b
  - number: 1b.b
    text: '[verordening (EU) nr. 1321/2014](32014R1321),'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel1b
  - number: 1b.c
    text: |-
      verordening (EU) nr. 2015/340, met uitzondering van Bijlage III, Deel ATCO.OR als de opleidingsorganisatie
      gecertificeerd is door de bevoegde autoriteit van Curaçao of Sint Maarten, en
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel1b
  - number: 1b.d
    text: verordening (EU) nr. 1178/2011,
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel1b
  - number: 1c
    text: |-
      De aanvraag voor de afgifte van een bewijs van bevoegdheid of gerelateerde certificaten als bedoeld in hetgeen
      bij of krachtens de basisverordening is bepaald wordt ingediend bij Onze Minister, tenzij bij of krachtens de
      basisverordening of de wet een andere instantie is aangewezen.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel1c
  - number: '2.1'
    text: 'Onze Minister kan de volgende bewijzen van bevoegdheid afgeven:'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel2
  - number: 2.1.a
    text: |-
      RPL, dat de bevoegdheid geeft, niet tegen vergoeding, op te treden als bestuurder van een luchtvaartuig, dat
      gecertificeerd is of luchtwaardig is bevonden voor maximaal 4 inzittenden, tijdens vluchten zonder baat, onder de
      volgende beperkingen:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel2
  - number: 2.1.a.1°
    text: alleen tijdens VFR-vluchten;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel2
  - number: 2.1.a.2°
    text: |-
      alleen tijdens de daglichtperiode als bedoeld in [artikel 1 van het Besluit luchtverkeer 2014][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0035899#Artikel1
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035899
        artikel: '1'
  - number: 2.1.a.3°
    text: |-
      niet met passagiers, tenzij de houder ten minste tien uur ervaring heeft als gezagvoerder van een luchtvaartuig van
      dezelfde categorie of met dezelfde bijzondere bevoegdverklaring en de houder in de voorafgaande negentig dagen ten
      minste drie starts en drie landingen heeft uitgevoerd als gezagvoerder van een luchtvaartuig van dezelfde categorie
      en met dezelfde bijzondere bevoegdverklaring;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel2
  - number: 2.1.b
    text: |-
      RPA-L, dat de bevoegdheid geeft op te treden als bestuurder van een RPA waarvan de totale massa niet meer dan
      150 kg bedraagt en dat gecertificeerd is of luchtwaardig is bevonden.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel2
  - number: '2.2'
    text: 'Een bewijs van bevoegdheid kan worden afgegeven voor de volgende categorieën luchtvaartuigen:'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel2
  - number: 2.2.a
    text: 'RPL: vliegtuigen (A), helikopters (H), luchtschepen (AS), gyrokopters (GC) en andere categorieën (OA);'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel2
  - number: 2.2.b
    text: 'RPA-L: vliegtuigen (A) en helikopters (H) en andere categorieën (OA).'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel2
  - number: '2.3'
    text: |-
      Een RPA-L wordt slechts afgegeven, indien ten minste één algemene bevoegdverklaring voor het type operatie,
      één bijzondere bevoegdverklaring voor werkzaamheden en één bijzondere bevoegdverklaring voor klasse daarop is
      weergegeven.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel2
  - number: '2.4'
    text: |-
      De bevoegdheden die voortvloeien uit een bewijs van bevoegdheid zijn steeds beperkt tot die typen of klassen
      luchtvaartuigen of tot die werkzaamheden waarvoor een bijzondere bevoegdverklaring is afgegeven
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel2
  - number: '2.5'
    text: Een bewijs van bevoegdheid wordt afgegeven voor onbepaalde duur.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel2
  - number: '3.1'
    text: |-
      Aan houders van een RPL kan, onder de krachtens [artikel 2.2 van de wet][ref1] genoemde bijzondere
      bevoegdverklaringen, al dan niet onder beperkingen naar soort vlucht of ervaring, één of meer van de volgende
      algemene bevoegdverklaringen worden afgegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
  - number: 3.1.a
    text: |-
      RT, dat de bevoegdheid geeft om radiocontact met de luchtverkeersdienst, of met bestuurders van andere
      luchtvaartuigen te onderhouden;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel3
  - number: 3.1.b
    text: 'RFI, dat de bevoegdheid geeft om vliegonderricht te geven voor de afgifte van een:'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel3
  - number: 3.1.b.1
    text: RPL, of
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel3
  - number: 3.1.b.2
    text: bijzondere bevoegdverklaring in een RPL;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel3
  - number: 3.1.c
    text: LPE met de bevoegdheden en voorwaarden, bedoeld in verordening (EU) nr. 1178/2011.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel3
  - number: '3.2'
    text: |-
      De bevoegdheden die voortvloeien uit een RT zijn steeds beperkt tot het overeenkomende bewijs van bevoegdheid van
      de houder.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel3
  - number: '3.3'
    text: |-
      De bevoegdheden die voortvloeien uit een algemene bevoegdverklaring, met uitzondering van de RT, zijn steeds
      beperkt tot die categorie luchtvaartuigen waarvoor de bevoegdverklaring is afgegeven.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel3
  - number: '3.4'
    text: |-
      Aan houders van een RPA-L kan, onder de krachtens [artikel 2.2 van de wet][ref1] genoemde bijzondere
      bevoegdverklaringen, al dan niet onder beperkingen naar soort vlucht of ervaring, één of meer van de volgende
      algemene bevoegdverklaringen worden afgegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
