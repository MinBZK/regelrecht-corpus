articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *ASO:* bewijs van bevoegdheid voor het
      bedienen van een luchtvaartstation (Aeronautical Station Operator);
        - *ATCO:* het bewijs van bevoegdheid voor luchtverkeersleider als bedoeld in [verordening (EU) 2015/340]
      (32015R0340) , of het bewijs van bevoegdheid voor luchtverkeersleider afgegeven door Onze Minister van Defensie
      overeenkomstig de eisen als bedoeld in [artikel 10.2, eerste lid, van de wet][ref1];
        - *basisopleiding:* theorie- en praktijkopleiding die basiskennis en praktische vaardigheden in verband met
      elementaire operationele procedures bijbrengt;
        - *bevoegdverklaring:* op een bewijs van bevoegdheid aangebrachte of daarmee samenhangende en van de vergunning
      deel uitmakende machtiging waarin specifieke aan de vergunning verbonden voorwaarden, rechten of beperkingen zijn
      aangegeven
        - *EVLOS:* bevoegdverklaring om een RPA te bedienen binnen een vergrote zichtafstand (extended visual line of
      sight);
        - *FISO:* bewijs van bevoegdheid voor het verstrekken van vluchtinformatie en alarmering (Flight Information
      Service Officer);
        - *LPE:* aantekening betreffende de taalvaardigheid (Language Proficiency Endorsement);
        - *luchtschip:* luchtvaartuig, lichter dan lucht, dat is voorzien van een voortstuwingsinrichting en een
      besturingsinrichting;
        - *luchthaveninformatie:* 1°. informatie overeenkomend met de betekenis van de in verordening (EU) nr. 923/2012
      opgenomen grondtekens die op de luchthaven zijn uitgelegd, 2°. informatie van windrichting of sterkte, verkregen
      uit ter beschikking staande middelen, zoals windmeter en windzak, 3°. informatie omtrent omstandigheden die het
      gebruik van de luchthaven kunnen beperken, 4°. informatie over luchtverkeersactiviteiten op en in de nabijheid
      van de luchthaven, 5°. informatie over de te volgen taxiprocedures, 6°. informatie over de te gebruiken
      parkeerplaatsen, of 7°. meteorologische inlichtingen verkregen overeenkomstig de Regeling luchtvaartmeteorologische
      inlichtingen 2006;
        - *luchthaveninformatieverstrekker:* persoon die op grond van dit besluit bevoegd is luchthaveninformatie te
      verstrekken;
        - *modelluchtvaartuig:* luchtvaartuig, niet in staat een mens te dragen, en uitsluitend gebruikt voor
      luchtvaartvertoning, recreatie of sport;
        - *OFS:* communicatie ten behoeve van het uitwisselen van berichten tussen het grondstation van een offshore
      productieplatform en luchtvaartuigen op en nabij dit platform (Offshore);
        - *Onze Minister:* Onze Minister van Infrastructuur en Waterstaat;
        - *OPC:* Communicatie ten behoeve van het uitwisselen van berichten tussen het grondstation van de
      luchtvaartmaatschappij en haar luchtvaartuigen, of tussen grondstation en luchtvaartuigen waarvoor het station de
      uitvoerende organisatie is (Operational Control Communication);
        - *paramotortrike:* luchtvaartuig zonder starre hoofdstructuur, dat wordt gestart en geland door gebruik te
      maken van een wielconstructie en over een hulpmotor beschikt, met niet meer dan twee zitplaatsen en een maximum
      startmassa van niet meer dan: a. 300 kg voor een eenzitter; b. 450 kg voor een tweezitter;
        - *RFI:* bevoegdverklaring recreatief vlieginstructeur (Recreational Flight Instructor);
        - *RPA:* op afstand bestuurd luchtvaartuig (remotely piloted aircraft), onbemand, niet zijnde een
      modelluchtvaartuig;
        - *RPA-L:* bewijs van bevoegdheid voor bestuurder van een RPA (remote pilot license);
        - *RPAS:* RPA, het daarbij horend grondstation, het vereiste besturingssysteem en andere in het type ontwerp
      gespecificeerde componenten;
        - *RPA waarnemer:* door de luchtvaartexploitant aangewezen geoefend en bekwaam persoon die door visuele waarneming
      van het RPA de bestuurder bij staat in de veilige uitvoering van de vlucht;
        - *RPL:* bewijs van bevoegdheid voor recreatief vlieger (Recreational Pilot Licence);
        - *RT:* bevoegdverklaring radiotelefonie (Radio Telephony);
        - *schermvliegtuig:* zweeftoestel zonder starre hoofdstructuur, dat kan worden gedragen en slechts gestart en
      geland kan worden door gebruik te maken van de benen van de bestuurder;
        - *SUR:* bevoegdverklaring tot het verstrekken van advies en inlichtingen met behulp van surveillance apparatuur
      (Surveillance);
        - *TMG:* motorzweefvliegtuig met een integraal gemonteerde niet intrekbare motor en een niet intrekbare propeller,
      dat in staat is om op eigen kracht op te stijgen en te klimmen (Touring Motor Glider);
        - *uitvoeringsverordening (EU) nr. 2019/947:* uitvoeringsverordening (EU) nr. 2019/947 van de Commissie van 24 mei
      2019 inzake de regels en procedures voor de exploitatie van onbemande luchtvaartuigen (PbEU 2019, L 152);
        - *verdrag:* Verdrag inzake de internationale burgerluchtvaart (Trb.  1973, 109);
        - *verordening (EU) nr. 1178/2011:* verordening (EU) nr. 1178/2011 van de Commissie van 3 november 2011
      tot vaststelling van technische eisen en administratieve procedures met betrekking tot de bemanning van
      burgerluchtvaartuigen, overeenkomstig Verordening (EG) nr. 216/2008 van het Europees Parlement en de Raad (PB
      L 311);
        - *verordening (EU) nr. 1321/2014:* [Verordening (EU) nr. 1321/2014](32014R1321) van de Commissie van 26 november
      2014 betreffende de permanente luchtwaardigheid van luchtvaartuigen en luchtvaartproducten, -onderdelen en
      -uitrustingsstukken, en betreffende de goedkeuring van bij voornoemde taken betrokken organisaties en personen
      (PbEU 2014, L 362);
        - *verordening (EU) nr. 2015/340:* verordening (EU) 2015/340 van de Commissie van 20 februari 2015 tot
      vaststelling van technische eisen en administratieve procedures met betrekking tot vergunningen en certificaten
      van luchtverkeersleiders overeenkomstig Verordening (EG) nr. 216/2008 van het Europees Parlement en de Raad, tot
      wijziging van Uitvoeringsverordening (EU) nr. 923/2012 van de Commissie en tot intrekking van Verordening (EU)
      nr. 805/2011 van de Commissie (PB L 63);
        - *verordening (EU) nr. 923/2012:* uitvoeringsverordening (EU) 923/2012 van de Commissie van 26 september
      2012 tot vaststelling van gemeenschappelijke luchtverkeersregels en operationele bepalingen betreffende
      luchtvaartnavigatiediensten en -procedures en tot wijziging van Uitvoeringsverordening (EU) nr. 1035/2011 en
      Verordeningen (EG) nr. 1265/2007, (EG) nr. 1794/2006, (EG) nr. 730/2006, (EG) nr. 1033/2006 en (EU) nr. 255/2010
      (PB L 281);
        - *vliegtuig:* gemotoriseerd luchtvaartuig met vaste vleugels, zwaarder dan lucht, dat hoofdzakelijk in de lucht
      gehouden kan worden door aërodynamische reactiekrachten op zijn vleugels;
        - *VLOS:* bevoegdverklaring om een RPAS te bedienen binnen zichtafstand (visual line of sight);
        - *vluchtinformatieverstrekker:* persoon, die op grond van een FISO bevoegd is tot het geven van advies,
      inlichtingen en alarmering aan luchtverkeer of grondverkeer;
        - *wet:* [Wet luchtvaart][ref2];
        - *zeilvliegtuig:* zweeftoestel met starre hoofdstructuur, dat kan worden gedragen en slechts gestart en geland kan
      worden door gebruik te maken van de benen van de bestuurder;
        - *zweeftoestel:* luchtvaartuig niet zijnde een TMG, zwaarder dan lucht, dat hoofdzakelijk in de lucht kan worden
      gehouden door aerodynamische reactiekrachten en waarvan de vrije vlucht niet afhankelijk is van een motor;
        - *zweefvliegtuig:* zweeftoestel met vaste vleugel.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005555
