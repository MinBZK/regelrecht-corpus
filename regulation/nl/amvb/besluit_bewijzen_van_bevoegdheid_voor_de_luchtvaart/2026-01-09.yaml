  - number: '3.5'
    text: |-
      De beperking, bedoeld in het vierde lid, onderdeel a, sub 2, en onderdeel b, sub 2, geldt niet indien op het RPA-L
      de algemene bevoegdverklaring nachtvliegen (RPA) is weergegeven en deze bevoegdheid, gelet op de daaraan verbonden
      beperkingen, mag worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel3
  - number: '4.1'
    text: De RT, de VLOS en de EVLOS wordt afgegeven voor onbepaalde duur.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel4
  - number: '4.2'
    text: De RFI en de FI(RPA) worden afgegeven voor de duur van ten hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel4
  - number: '4.3'
    text: |-
      De geldigheidsduur wordt, indien de bevoegdverklaring niet is afgegeven op de laatste dag van de maand van afgifte,
      berekend vanaf de eerste dag van de maand, volgend op de maand van afgifte.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister stelt bijzondere bevoegdverklaringen naar type, klasse of werkzaamheden vast en de duur waarvoor zij
      worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel5
  - number: '5.2'
    text: Onze Minister kan beperkingen vaststellen waaronder bijzondere bevoegdverklaringen worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel5
  - number: '6.1'
    text: 'De leeftijd, welke moet zijn bereikt om voor een bewijs van bevoegdheid in aanmerking te komen, bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel6
  - number: 6.1.a
    text: 'RPL: 16 jaar;'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel6
  - number: 6.1.b
    text: 'RPA-L: 18 jaar.'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel6
  - number: '6.2'
    text: |-
      De leeftijd, welke moet zijn bereikt om voor een instructeursbevoegdverklaring in aanmerking te komen, bedraagt
      18 jaar.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel6
  - number: '8.1'
    text: |-
      Met inachtneming van de [artikelen 2][ref1], [3][ref2] en [6][ref3] wordt het bewijs van bevoegdheid of de
      bevoegdverklaring op aanvraag afgegeven aan een ieder die:


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010629#Artikel6
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010629
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0010629
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 8.1.a
    text: |-
      voldoet aan de bij ministeriële regeling vast te stellen vereisten inzake kennis, bedrevenheid, ervaring en
      opleiding, en,
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel8
  - number: 8.1.b
    text: in het bezit is van een geldige medische verklaring klasse II.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid, onderdeel b, volstaat, in plaats van een geldige medische verklaring klasse II,
      een geldige medische verklaring voor het LAPL voor het verkrijgen van:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel8
  - number: 8.2.a
    text: |-
      het bewijs van bevoegdheid, bedoeld in [artikel 2, eerste lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 8.2.b
    text: |-
      het bewijs van bevoegdheid RPL voor het besturen van Micro Light Aeroplanes, Micro Light Helicopters, lichte
      gyrokopters, historische gemotoriseerde vliegtuigen of amateur vliegtuigbouwproducten tot een gewicht van 2000
      kilogram.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel8
  - number: '8.3'
    text: |-
      De aanvraag tot afgifte van een bewijs van bevoegdheid of bevoegdverklaring wordt gedaan op een daartoe door Onze
      Minister verstrekt aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel8
  - number: '8.4'
    text: |-
      Onze Minister stelt de tarieven vast, volgens welke de kosten, bedoeld in
      [artikel 2.3, zesde lid, onderdeel h, van de wet][ref1], worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
  - number: '9'
    text: |-
      De bevoegdverklaringen, genoemd in [artikel 3][ref1] en [5][ref2], worden verlengd indien de houder van het bewijs
      van bevoegdheid op bij ministeriële regeling te bepalen wijze heeft aangetoond, dat hij zijn kennis, bedrevenheid
      en ervaring heeft behouden.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel5
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010629
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '10.1'
    text: |-
      Het document waarop het bewijs van bevoegdheid en de bevoegdverklaring zijn weergegeven wordt afgegeven voor een
      periode van ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel10
  - number: '10.2'
    text: |-
      Onze Minister vernieuwt een document als bedoeld in het eerste lid na afgifte of wederafgifte van een
      bevoegdverklaring en wanneer de ruimte, bestemd om verlengingen van bevoegdverklaringen aan te tekenen, geheel is
      ingevuld, en stelt nadere regels met betrekking tot de eisen voor wederafgifte van een bevoegdverklaring.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel10
  - number: '10.3'
    text: |-
      Onze Minister kan een document als bedoeld in het eerste lid vernieuwen, indien het is verloren, indien het
      onleesbaar, beschadigd of anderszins onbruikbaar is geworden, om enige administratieve reden of, naar zijn
      goeddunken, wanneer een bevoegdverklaring wordt verlengd.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel10
  - number: '10.4'
    text: |-
      Indien een document wegens verlies is vernieuwd en het verloren document wordt teruggevonden, zendt de houder het
      teruggevonden document zo spoedig mogelijk aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel10
  - number: '10.5'
    text: |-
      Indien een document anders dan wegens verlies is vernieuwd, kan Onze Minister de houder opdragen het
      oorspronkelijke document binnen een week na de datum van verzending van het nieuwe document aan Onze Minister te
      zenden.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel10
  - number: '11.1'
    text: |-
      [Artikel 2.1, eerste en tweede lid, van de wet][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
  - number: 11.1.a
    text: het bedienen van een modelvliegtuig, waarvan de totale massa ten hoogste 25 kg bedraagt;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.b
    text: |-
      het bedienen van een ballon, die op zeeniveau in de internationale standaard-atmosfeer in geheel gevulde toestand
      een diameter van ten hoogste 2.00 m of een inhoud van ten hoogste 4.00 kubieke m heeft, alsmede aan elkaar
      gekoppelde ballonnen waarvan de gezamenlijke diameter en inhoud deze waarden niet te boven gaan;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.c
    text: |-
      het bedienen van een toestel, zwaarder dan lucht, en niet voorzien van een voortstuwingsinrichting, dat door middel
      van een ankerkabel of lijn is verbonden met het aardoppervlak (kabelvlieger);
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.d
    text: |-
      bedienen van een luchtschip, dat op zeeniveau in de internationale standaard atmosfeer in geheel gevulde toestand
      een grootste afmeting heeft van 5.00 m of een inhoud van ten hoogste 4.00 kubieke m;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.e
    text: |-
      het bedienen van een toestel, zwaarder dan lucht in de vorm van een scherm met harnas, dat met een lijn of lijnen
      is bevestigd aan een voertuig of vaartuig, waardoor het in de lucht kan worden gehouden (valschermzweeftoestel);
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.f
    text: het bedienen van een zeilvliegtuig;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.g
    text: het bedienen van een schermvliegtuig;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.h
    text: |-
      het bedienen van een ballon, die tijdens het in de lucht houden permanent is bevestigd aan het aardoppervlak
      (kabelballon);
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.i
    text: |-
      het bedienen van een scherm dat dient om de daalsnelheid van een persoon zodanig te beperken dat deze veilig het
      aardoppervlak kan bereiken (valscherm);
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.j
    text: |-
      het bedienen van een luchtvaartuig onder toezicht van een instructeur, die houder is van een voor de bediening van
      dat luchtvaartuig en die vlucht afgegeven bewijs van bevoegdheid, waarop weergegeven de nodige bevoegdverklaringen
      op een zodanige wijze dat de instructeur onmiddellijk kan ingrijpen;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.k
    text: |-
      het uitvoeren van een solovlucht onder toezicht van een instructeur, die houder is van een voor de bediening van
      dat luchtvaartuig en die vlucht afgegeven bewijs van bevoegdheid, waarop weergegeven de nodige bevoegdverklaringen,
      door een bestuurder, die geen houder is van een bewijs van bevoegdheid, indien de bestuurder:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.k.1
    text: beschikt over voldoende kennis voor de uit te voeren solovlucht;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.k.2
    text: beschikt over een geldige medische verklaring klasse 1 of 2; en
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.k.3
    text: beschikt over een schriftelijke soloverklaring van de instructeur;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.l
    text: het bedienen van een zweefvliegtuig;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.m
    text: |-
      het bedienen van een vrije ballon, niet tegen vergoeding, met één of twee plaatsen die is ontworpen voor een
      maximumvolume van ten hoogste 1.200 kubieke m;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.1.n
    text: het bedienen van een paramotortrike.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: '11.2'
    text: 'Het eerste lid, onderdelen b tot en met n, is van toepassing indien de bestuurder:'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.2.a
    text: |-
      de leeftijd van 16 jaar heeft bereikt, met dien verstande, dat de bestuurder van een zweeftoestel die een
      solovlucht uitvoert binnen zichtafstand van de luchthaven tot een maximum van 5 kilometer rondom de luchthaven, de
      leeftijd van 14 jaar heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.2.b
    text: |-
      kan aantonen te beschikken over voldoende bekwaamheid om op een veilige manier deel te nemen aan het luchtverkeer,
      en
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: 11.2.c
    text: |-
      kan aantonen dat een verzekering is gesloten tegen de burgerrechtelijke aansprakelijkheid jegens derden als gevolg
      van het gebruik van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: '11.3'
    text: Onze Minister kan nadere regels geven met betrekking tot het eerste lid, onderdelen f, g en n.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
  - number: '11.4'
    text: |-
      De [artikelen 2.1, eerste lid][ref1], voor zover dit betrekking heeft op het bedienen van een grondstation
      of mobiel station in de luchtvaartmobiele band, waarvoor een vergunning is vereist als bedoeld in
      [artikel 3.13 van de Telecommunicatiewet][ref2], en [artikel 2.2, tweede lid, van de wet][ref3] zijn niet van
      toepassing op degene die een luchtvaartuig als bedoeld in het eerste lid bedient of een solovlucht als bedoeld
      in onderdeel k van dat lid uitvoert, en houder is van een door Onze Minister afgegeven certificaat waaruit
      blijkt, dat die houder bevoegd is tot het bedienen van een grondstation of mobiel station als bedoeld in
      [artikel 2.1, eerste lid, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '2'
  - number: '12'
    text: |-
      Onze Minister kan nadere regels geven met betrekking tot het afgeven van bewijzen van gelijkstelling. Deze regels
      omvatten in ieder geval bepalingen betreffende eisen inzake kennis, bedrevenheid, ervaring, leeftijd en medische
      geschiktheid.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister geeft nadere regels met betrekking tot de erkenning en registratie van een opleidingsinstelling. Deze
      regels omvatten in ieder geval bepalingen betreffende:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: 13.1.a
    text: de bij de aanvraag in te dienen gegevens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: 13.1.b
    text: eisen inzake de opleiding;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: 13.1.c
    text: de afgifte, geldigheidsduur, intrekking en wijziging.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: '13.2'
    text: |-
      Onze Minister stelt de tarieven vast, volgens welke de kosten, bedoeld in
      [artikel 2.9, vierde lid, van de wet][ref1] worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
  - number: '13.3'
    text: |-
      Onze Minister geeft nadere regels met betrekking tot de kwalificatie van STD's. Deze regels omvatten in ieder geval
      bepalingen betreffende:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: 13.3.a
    text: de bij de aanvraag in te dienen gegevens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: 13.3.b
    text: het onderscheid in eisen naar niveau;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: 13.3.c
    text: de afgifte, geldigheidsduur, verlenging, schorsing, intrekking en wijziging.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: '13.4'
    text: |-
      Onze Minister kan entiteiten aanwijzen, als bedoeld in de volgende onderdelen van de Bijlage bij de
      uitvoeringsverordening (EU) nr. 2019/947:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: 13.4.a
    text: Deel A, UAS.OPEN.020 UAS-vluchtuitvoeringen in subcategorie A1, sub 4, onder b;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: 13.4.b
    text: Deel A, UAS.OPEN.030 UAS-vluchtuitvoeringen in subcategorie A2, sub 2;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: 13.4.c
    text: Deel B, UAS.SPEC.050 verantwoordelijkheden van de UAS-exploitant, sub 1, onder d. iii;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: 13.4.d
    text: Aanhangsel 1, hoofdstuk I, UAS.STS-01.020 UAS-vluchtuitvoeringen in STS-01, sub 1, onder e. i;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: 13.4.e
    text: Aanhangsel 1, hoofdstuk II, UAS.STS-02.020 UAS-vluchtuitvoeringen in STS-02, sub 9, onder b.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: '13.5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de aanwijzing van entiteiten als
      bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel13
  - number: '14.1'
    text: |-
      Als bewijs, dat wordt voldaan aan de eisen met betrekking tot de nodige kennis en bedrevenheid voor een bewijs
      van bevoegdheid als bedoeld in [artikel 2][ref1] of een bevoegdverklaring als bedoeld in [artikel 3][ref2]
      of [5][ref3], wordt met goed gevolg een examen afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010629#Artikel5
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010629
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0010629
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '14.2'
    text: Het examen kan bestaan uit een theorie- en een praktijkgedeelte.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel14
  - number: '14.3'
    text: |-
      In afwijking van het eerste lid, wordt voor de RPA-L en voor de daarbij behorende bevoegdverklaringen aan de eisen,
      bedoeld in het eerste lid voldaan door het met goed gevolg afronden van een opleiding aan een door Onze Minister
      daartoe erkende opleidingsinstelling dan wel aan een door de bevoegde autoriteit van een door Onze Minister bij
      regeling aangewezen staat daartoe erkende opleidingsinstelling.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel14
  - number: '14.4'
    text: Onze Minister kan nadere regels geven met betrekking tot het examen.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel14
  - number: '14.5'
    text: |-
      Voor het verkrijgen van de algemene bevoegdverklaring LPE kan aan de eisen als bedoeld in het eerste lid tevens
      worden voldaan door het met goed gevolg afronden van een opleiding aan een door Onze Minister daartoe erkende
      opleidingsinstelling dan wel aan een door de bevoegde autoriteit van een door Onze Minister bij regeling aangewezen
      staat daartoe erkende opleidingsinstelling.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel14
  - number: '15.1'
    text: Onze Minister stelt het resultaat van het theorie- en praktijkexamen vast.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel15
  - number: '15.2'
    text: |-
      Onze Minister stelt nadere regels met betrekking tot de autorisatie en benoeming van examinatoren. Deze regels
      omvatten in ieder geval bepalingen betreffende:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel15
  - number: 15.2.a
    text: de bij de aanvraag in te dienen gegevens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel15
  - number: 15.2.b
    text: de afgifte, geldigheidsduur, verlenging en intrekking;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel15
  - number: 15.2.c
    text: de eisen inzake kennis, bedrevenheid en ervaring;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel15
  - number: 15.2.d
    text: het onderscheid in bevoegdheden naar soort autorisatie;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel15
  - number: 15.2.e
    text: de bezoldiging van benoemde examinatoren.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel15
  - number: '15.3'
    text: |-
      In afwijking van het eerste lid stelt het Centraal Bureau Rijvaardigheidsbewijzen het resultaat van het
      schriftelijke theorie-examen vast.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel15
  - number: '16.1'
    text: Onze Minister stelt een examenreglement vast.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: '16.2'
    text: 'In dit reglement kunnen bepalingen opgenomen worden omtrent:'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.a
    text: de wijze van examinering;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.b
    text: de duur van examens en de wijze waarop examens worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.c
    text: de vaststelling van de examenopgaven voor het schriftelijke gedeelte;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.d
    text: de groepen van vakken waarin examens kunnen worden afgelegd;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.e
    text: het gebruik van STD's ten behoeve van examens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.f
    text: de aanmelding voor examens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.g
    text: de toelating tot examens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.h
    text: geheimhouding;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.i
    text: het toezicht op theorie- en praktijkexamens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.j
    text: de uitsluiting van een examinandus van examens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.k
    text: de ordemaatregelen tijdens examens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.l
    text: de beoordeling van examens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.m
    text: de vaststelling van het resultaat van examens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.n
    text: de kennisgeving van de uitslag;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.o
    text: de mogelijkheid van herexamens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.p
    text: het afnemen van praktijkexamens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.q
    text: de termijn waarbinnen examens moeten zijn afgelegd;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.r
    text: de uitsluiting van examens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: 16.2.s
    text: frequentie van het examen.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel16
  - number: '17'
    text: Onze Minister kan de bewijzen van bevoegdheid ASO onderscheidenlijk FISO afgeven.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel17
  - number: '18.1'
    text: |-
      Aan een houder van een ASO worden, nadat deze de desbetreffende opleiding met goed resultaat heeft gevolgd, één of
      meer van de volgende bevoegdverklaringen afgegeven:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: 18.1.a
    text: '*ADR* (Aerodrome), die de bevoegdheid geeft tot het verstrekken van luchthaveninformatie aan luchthavenverkeer;'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: 18.1.b
    text: |-
      *TOW* (Towing), die de bevoegdheid geeft tot het verstrekken van dienstberichten aan sleepvoertuigen niet zijnde
      luchtvaartuigen op het landingsterrein van een gecontroleerde luchthaven onder verantwoordelijkheid van een
      luchtverkeersleider;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: 18.1.c
    text: |-
      *GCO* (Ground Communications Officer), die de bevoegdheid geeft tot het voeren van communicatie met luchtvaartuigen
      en voertuigen op een gecontroleerde luchthaven;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: 18.1.d
    text: |-
      *DIS* (Display), die de bevoegdheid geeft tot het verstrekken van luchtvaartvertoningsinformatie aan luchtverkeer
      dat deelneemt aan een luchtvaartvertoning overeenkomstig de bij regeling van Onze Minister gestelde regels;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: 18.1.e
    text: |-
      *OFS* (Offshore), die de bevoegdheid geeft tot het verstrekken van informatie aan luchtverkeer op en nabij een
      offshore productieplatform.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: '18.2'
    text: 'Op de bevoegdverklaring GCO is ten minste één van de volgende aantekeningen aangebracht:'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: 18.2.a
    text: |-
      CLD (Clearance Delivery), die de bevoegdheid geeft tot het geven van route- en startupklaringen alsmede voor de
      vluchtuitvoering relevante informatie aan luchtvaartuigen op platforms;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: 18.2.b
    text: |-
      GMS (Ground Movement Service), die de bevoegdheid geeft tot het verstrekken van dienstberichten aan of begeleiden
      van voertuigen, sleepverkeer, luchthavendiensten, hulpdiensten en andere betrokkenen op het landingsterrein, onder
      verantwoordelijkheid van de luchtverkeersleider.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: '18.3'
    text: |-
      De in het tweede lid genoemde aantekening wordt afgegeven indien hiervoor de desbetreffende opleiding met goed
      resultaat is afgerond.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: '18.4'
    text: |-
      Aan een houder van een ASO worden, nadat deze de desbetreffende opleiding met goed resultaat heeft gevolgd, één of
      meer van de volgende aantekeningen, die van overeenkomstige toepassing zijn als de gelijkluidende aantekeningen in
      artikel 4 van verordening (EU) nr. 2015/340, bij het bewijs van bevoegdheid afgegeven:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: 18.4.a
    text: |-
      *Assessor,* waarmee wordt aangegeven dat de houder bevoegd is om praktische vaardigheden van (leerling-)bedieners
      van een luchtvaartstation te beoordelen;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: 18.4.b
    text: |-
      *OJTI* (On the Job Training Instructor endorsement), waarmee wordt aangegeven dat de houder bevoegd is om opleiding
      op de werkplek en opleiding met synthetische opleidingstoestellen te geven;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: 18.4.c
    text: |-
      *STDI* (Synthetic Training Device Instructor endorsement), waarmee wordt aangegeven dat de houder bevoegd is om
      opleiding met synthetische opleidingstoestellen te geven;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: 18.4.d
    text: |-
      *aantekening betreffende de eenheid* (unit endorsement), de op het bewijs van bevoegdheid aangebrachte en daarvan
      deel uitmakende machtiging die de ICAO-locatie-indicator of de naam van de luchthaven weergeeft;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: 18.4.e
    text: |-
      *aantekening betreffende de taalvaardigheid* (language proficiency endorsement), de op het bewijs van bevoegdheid
      aangebrachte en daarvan deel uitmakende machtiging die de taalvaardigheid van de houder aangeeft.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: '18.5'
    text: |-
      Een bevoegdverklaring als bedoeld in het eerste lid is slechts geldig indien daaraan de in het vierde lid,
      onderdeel d, bedoelde aantekening betreffende de eenheid, is verbonden.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: '18.6'
    text: |-
      Een aantekening als bedoeld in het vierde lid, onderdelen a tot en met c, is slechts geldig in combinatie met het
      bewijs van bevoegdheid en de bevoegdverklaring waarvan zij deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: '18.7'
    text: |-
      Een aantekening als bedoeld in het vierde lid, onderdeel e, kan worden afgegeven indien de houder van een ASO
      reeds beschikt over een geldige aantekening betreffende de taalvaardigheid op een ATCO of FISO met geldige
      eenheidsaantekening.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18
  - number: 18a.1
    text: |-
      Aan een houder van een FISO worden, nadat deze de desbetreffende opleiding met goed resultaat heeft gevolgd, één of
      meer van de volgende bevoegdverklaringen afgegeven:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18a
  - number: 18a.1.a
    text: |-
      *ADR* (Aerodrome), die de bevoegdheid geeft tot het verstrekken van advies en inlichtingen aan luchthavenverkeer en
      luchtverkeer binnen een hiervoor aangewezen deel van het luchtruim dan wel het verstrekken van alarmering;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18a
  - number: 18a.1.b
    text: |-
      *AER* (Area), die de bevoegdheid geeft tot het verstrekken van advies en inlichtingen aan luchtverkeer dan wel tot
      het verstrekken van alarmeringen.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18a
  - number: 18a.2
    text: |-
      Aan de houder van een bevoegdverklaring AER wordt, nadat deze de desbetreffende opleiding met goed resultaat heeft
      gevolgd, de aantekening (rating endorsement) SUR afgegeven, die de bevoegdheid geeft tot het verstrekken van advies
      en inlichtingen met behulp van surveillance apparatuur.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18a
  - number: 18a.3
    text: |-
      Aan de houder van een FISO worden, nadat deze de desbetreffende opleiding met goed resultaat heeft gevolgd, één of
      meer van de volgende aantekeningen, die van overeenkomstige toepassing zijn als de gelijkluidende aantekeningen in
      artikel 4 van verordening (EU) nr. 2015/340, bij het bewijs van bevoegdheid afgegeven:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18a
  - number: 18a.3.a
    text: |-
      *Assessor,* die aangeeft dat de houder bevoegd is om praktische vaardigheden van leerling-
      vluchtinformatieverstrekkers of vluchtinformatieverstrekkers te beoordelen;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18a
  - number: 18a.3.b
    text: |-
      *OJTI* (On the Job Training Instructor endorsement), die aangeeft dat de houder bevoegd is om opleiding op de
      werkplek en opleiding met synthetische opleidingstoestellen te geven;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18a
  - number: 18a.3.c
    text: |-
      *STDI* (Synthetic Training Device Instructor endorsement), die aangeeft dat de houder bevoegd is om opleiding met
      synthetische opleidingstoestellen te geven;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18a
  - number: 18a.3.d
    text: |-
      *aantekening betreffende de eenheid* (unit endorsement), de op het bewijs van bevoegdheid aangebrachte en daarvan
      deel uitmakende machtiging die de ICAO-locatie-indicator weergeeft;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18a
  - number: 18a.3.e
    text: |-
      *aantekening betreffende de taalvaardigheid* (language proficiency endorsement), de op het bewijs van bevoegdheid
      aangebrachte en daarvan deel uitmakende machtiging die de taalvaardigheid van de houder aangeeft.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18a
  - number: 18a.4
    text: |-
      Een bevoegdverklaring als bedoeld in het eerste lid en de aantekening bij de bevoegdverklaring bedoeld in het
      tweede lid zijn slechts geldig indien daaraan de in het derde lid, onderdeel d, bedoelde aantekening betreffende de
      eenheid is verbonden.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18a
  - number: 18a.5
    text: |-
      Een aantekening als bedoeld in het derde lid onderdeel a, b en c, is slechts geldig in combinatie met het bewijs
      van bevoegdheid en de bevoegdverklaring waarvan zij deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18a
  - number: 18a.6
    text: |-
      Een aantekening als bedoeld in het derde lid, onderdeel e, kan worden afgegeven indien de houder van een FISO reeds
      beschikt over een geldige aantekening betreffende de taalvaardigheid op een ATCO met geldige eenheidsaantekening.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel18a
  - number: '19'
    text: |-
      De minimumleeftijd voor de afgifte van een bewijs van bevoegdheid als bedoeld in [artikel 17][ref1] bedraagt 18
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel17
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '20.1'
    text: |-
      Met inachtneming van [artikel 19][ref1] wordt een FISO en ASO op aanvraag verleend aan een ieder die:


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel19
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 20.1.a
    text: voldoet aan bij ministeriële regeling te stellen eisen inzake kennis, bedrevenheid en ervaring, en
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel20
  - number: 20.1.b
    text: |-
      overeenkomstig Bijlage 1 bij het op 7 december 1944 te Chicago gesloten Verdrag inzake de Internationale
      Burgerluchtvaart (Trb. 1973, 109) voldoet aan de vereisten inzake het vermogen tot beheersing van de Engelse taal
      op de niveaus 4, 5 of 6.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel20
  - number: '20.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op het verlenen van bevoegdverklaringen en aantekeningen als
      bedoeld in de [artikelen 18][ref1] en [18a][ref2], met uitzondering van de bevoegdverklaring TOW waarop onderdeel b
      van het eerste lid niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel18a
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010629
        artikel: 18a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '20.3'
    text: |-
      In aanvulling op het eerste lid is voor het verlenen van een FISO vereist dat de aanvrager in het bezit is van een
      geldige medische verklaring, klasse 3, als bedoeld in bijlage IV van [verordening (EU) nr. 2015/340](32015R0340).
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel20
  - number: '20.4'
    text: |-
      Onze Minister stelt de tarieven vast, volgens welke de kosten, bedoeld in
      [artikel 2.3, zesde lid, onderdeel h, van de wet][ref1], worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
  - number: '21.1'
    text: |-
      Een FISO of een ASO en de bevoegdverklaring of aantekening bij de bevoegdverklaring wordt voor onbepaalde tijd
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel21
  - number: '21.2'
    text: |-
      Een aantekening bij het bewijs van bevoegdheid als bedoeld in
      [artikel 18, vierde lid, onderdelen a, b, c of d][ref1], respectievelijk
      [artikel 18a, derde lid, onderdelen a, b, c of d][ref2], wordt voor een termijn van 3 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel18a
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010629
        artikel: 18a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '21.3'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld voor de afgifte, vernieuwing en verlenging van de in
      het tweede, vijfde en zesde lid bedoelde aantekeningen.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel21
  - number: '21.4'
    text: |-
      De termijnen, bedoeld in het tweede lid, worden met eenzelfde termijn verlengd indien de houder voldoet aan bij
      ministeriële regeling te stellen regels inzake kennis, bedrevenheid en ervaring.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel21
  - number: '21.5'
    text: |-
      Een aantekening bij het bewijs van bevoegdheid als bedoeld in [artikel 18, tweede lid, onderdeel d][ref1], wordt
      verstrekt voor een termijn van:


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel18
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 21.5.a
    text: 3 jaar, indien de aantekening taalvaardigheidsniveau 4 betreft;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel21
  - number: 21.5.b
    text: 6 jaar, indien de aantekening taalvaardigheidsniveau 5 betreft; of
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel21
  - number: 21.5.c
    text: onbeperkte duur, indien de aantekening taalvaardigheidsniveau 6 betreft.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel21
  - number: '21.6'
    text: |-
      Een aantekening bij het bewijs van bevoegdheid als bedoeld in [artikel 18a, derde lid, onderdeel e][ref1], wordt
      verstrekt voor een termijn van:


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel18a
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: 18a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 21.6.a
    text: 3 jaar, indien de aantekening taalvaardigheidsniveau 4 betreft;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel21
  - number: 21.6.b
    text: 6 jaar, indien de aantekening taalvaardigheidsniveau 5 betreft; of
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel21
  - number: 21.6.c
    text: 9 jaar, indien de aantekening taalvaardigheidsniveau 6 betreft.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel21
  - number: '22.1'
    text: |-
      De vereisten inzake kennis, bedrevenheid en ervaring behorende bij de basisopleiding en de opleiding voor de
      bevoegdverklaring ADR voor het verkrijgen van een FISO zijn niet van toepassing op personen die 24 maanden voor de
      datum van aanvraag in het bezit waren van:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22
  - number: 22.1.a
    text: een geldig ATCO met de bevoegdverklaring ADC overeenkomstig [verordening (EU) nr. 2015/340](32015R0340); of
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22
  - number: 22.1.b
    text: |-
      een geldig ATCO met de bevoegdverklaring ADI en ADV afgegeven door Onze Minister van Defensie overeenkomstig
      [artikel 10.2, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
  - number: '22.2'
    text: |-
      De vereisten inzake kennis, bedrevenheid en ervaring behorende bij de basisopleiding en de opleiding voor de
      bevoegdverklaring AER met de aantekening SUR voor het verkrijgen van een FISO zijn niet van toepassing op personen
      die 24 maanden voor de datum van aanvraag in het bezit waren van:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22
  - number: 22.2.a
    text: een geldig ATCO met de bevoegdverklaring APS of ACS overeenkomstig [verordening (EU) nr. 2015/340](32015R0340); of
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22
  - number: 22.2.b
    text: |-
      een geldig ATCO met bevoegdverklaring APS of ACS of FISO met bevoegdverklaring AER met de aantekening RAD afgegeven
      door Onze Minister van Defensie overeenkomstig [artikel 10.2, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
  - number: 22a.1
    text: |-
      De vereisten inzake kennis, bedrevenheid en ervaring behorende bij de basisopleiding en de opleiding voor de
      bevoegdverklaring ADR voor het verkrijgen van een ASO zijn niet van toepassing op personen die 24 maanden voor de
      datum van aanvraag in het bezit waren van:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22a
  - number: 22a.1.a
    text: |-
      een geldig ATCO met de bevoegdverklaring ADC overeenkomstig [verordening (EU) nr. 2015/340](32015R0340) of een
      geldig FISO met bevoegdverklaring ADR; of
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22a
  - number: 22a.1.b
    text: |-
      een geldig ATCO met bevoegdverklaring ADI en ADV afgegeven door Onze Minister van Defensie overeenkomstig
      [artikel 10.2, eerste lid, van de wet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
  - number: 22a.1.c
    text: |-
      een geldig FISO of ASO afgegeven door Onze Minister van Defensie overeenkomstig
      [artikel 10.2, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
  - number: 22a.2
    text: |-
      De vereisten inzake kennis, bedrevenheid en ervaring behorende bij de basisopleiding en de opleiding voor de
      bevoegdverklaring GCO met de aantekening CLD en GMS voor het verkrijgen van een ASO zijn niet van toepassing op
      personen die 24 maanden voor de datum van aanvraag in het bezit waren van:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22a
  - number: 22a.2.a
    text: |-
      een geldig ATCO met de bevoegdverklaring ADC overeenkomstig [verordening (EU) nr. 2015/340](32015R0340) of een
      geldig FISO met bevoegdverklaring ADR; of
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22a
  - number: 22a.2.b
    text: |-
      een geldig ATCO met bevoegdverklaring ADI, ADV en ADG afgegeven door Onze Minister van Defensie overeenkomstig
      [artikel 10.2, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
  - number: 22d.1
    text: |-
      Onze Minister kan de aanvrager van een ASO, een FISO, of van bevoegdverklaringen of aantekeningen daarop toestaan
      dat de bevoegdheden door de aanvrager worden uitgeoefend gedurende een periode van maximaal acht weken na
      succesvolle afronding van de toepasselijke examen(s) en beoordeling(en), in afwachting van de afgifte van het ASO,
      het FISO, de bevoegdverklaring of de aantekening.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22d
  - number: 22d.2
    text: |-
      Voor het verkrijgen van de in het eerste lid bedoelde toestemming stuurt de aanvrager een afschrift van het
      hiervoor door Onze Minister beschikbaar gestelde en door de aanvrager volledig ingevulde en ondertekende formulier
      met de aanvraag mee.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22d
  - number: 22d.3
    text: |-
      Het eerste lid is niet van toepassing op tijdelijke machtigingen als bedoeld in [artikel 24a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel24a
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel22d
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: 24a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '23'
    text: |-
      De [artikelen 2.1, eerste lid][ref1], voor zover dit betrekking heeft op het bedienen van een grondstation
      of mobiel station in de luchtvaartmobiele band, waarvoor een vergunning is vereist als bedoeld in
      [artikel 3.13 van de Telecommunicatiewet][ref2], en [artikel 2.2, tweede lid, van de wet][ref3] zijn niet van
      toepassing op houders van een ASO voor het voeren van OPC.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '2'
  - number: '24.1'
    text: |-
      Onze Minister kan een bewijs van bevoegdheid vernieuwen, indien het is verloren of indien het onleesbaar,
      beschadigd of anderszins onbruikbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel24
  - number: '24.2'
    text: |-
      Indien een bewijs van bevoegdheid wegens verlies is vernieuwd en het verloren bewijs wordt teruggevonden, zendt de
      houder het teruggevonden bewijs zo spoedig mogelijk aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel24
  - number: '24.3'
    text: |-
      Indien een bewijs van bevoegdheid anders dan wegens verlies is vernieuwd, kan Onze Minister de houder opdragen
      het oorspronkelijke bewijs binnen een week na de datum van verzending van het nieuwe bewijs aan Onze Minister te
      zenden.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel24
  - number: 24a.1
    text: |-
      Voor het verzorgen van ASO- en FISO-opleidingen is een door Onze Minister goed te keuren opleidingenplan
      noodzakelijk.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel24a
  - number: 24a.2
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld voor de goedkeuring van het in het eerste lid bedoelde
      opleidingenplan, die in ieder geval betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel24a
  - number: 24a.2.a
    text: eisen inzake de inhoud van de opleiding;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel24a
  - number: 24a.2.b
    text: de in het opleidingenplan op te nemen gegevens;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel24a
  - number: 24a.2.c
    text: de geldigheidsduur en wijze van de goedkeuring;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel24a
  - number: 24a.2.d
    text: de onderdelen waaruit een opleidingenplan kan bestaan;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel24a
  - number: 24a.2.e
    text: de kennis- en vaardigheidsbeoordeling.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel24a
  - number: 24a.3
    text: |-
      Bij regeling van Onze Minister worden regels gesteld voor de afgifte van een tijdelijke machtiging als instructeur
      voor opleidingen op de werkplek of als assessor.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel24a
  - number: 24c.1
    text: |-
      Met betrekking tot de certificering van FISO-opleidingen zijn de voorschriften bedoeld in verordening (EU)
      nr. 2015/340, Bijlage III, Deel ATCO.OR, subdelen A tot en met D, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel24c
  - number: 24c.2
    text: |-
      [Artikel 2.2, eerste lid, onderdeel c, onder 1°, van de wet][ref1] is niet van toepassing op de afgifte
      van een ASO als bedoeld in [artikel 17][ref2] indien de afgifte geschiedt na een positieve kennis- en
      vaardigheidsbeoordeling van de aanvrager op basis van een opleidingenplan dat voldoet aan de krachtens
      [artikel 24a, tweede lid][ref3], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0010629#Artikel24a
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0010629
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0010629
        artikel: 24a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 24d
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de goedkeuring van beoordelingsprocedures
      waarmee de taalvaardigheid kan worden aangetoond alsmede met betrekking tot de eisen aan organisaties die de
      taalvaardigheid beoordelen.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel24d
  - number: '30.1'
    text: |-
      Ten behoeve van een door Onze Minister, al dan niet onder beperkingen, af te geven medische verklaring wordt
      degene, die zulk een verklaring heeft aangevraagd, gekeurd door een geneeskundige of door een geneeskundige
      instantie.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel30
  - number: '30.2'
    text: 'Onze Minister kan in ieder geval regels geven met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel30
  - number: 30.2.a
    text: de aanvraag van de keuring;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel30
  - number: 30.2.b
    text: de oproep voor en de aanmelding bij de keuring;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel30
  - number: 30.2.c
    text: de ten behoeve van de afgifte van een medische verklaring te verrichten keuring;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel30
  - number: 30.2.d
    text: de anamnese;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel30
  - number: 30.2.e
    text: de kennisgeving van de uitslag;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel30
  - number: 30.2.f
    text: de eisen van medische geschiktheid en de beperkingen waaronder de medische verklaring kan worden afgegeven;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel30
  - number: 30.2.g
    text: de eisen waaraan een geneeskundige of een geneeskundige instantie ten behoeve van hun autorisatie moeten voldoen;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel30
  - number: 30.2.h
    text: de verplichtingen van de houder van de medische verklaring of van een geneeskundige of een geneeskundige instantie;
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel30
  - number: 30.2.i
    text: de erkenning van in het buitenland verrichte keuringen.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel30
  - number: '30.3'
    text: |-
      Onze Minister stelt de tarieven vast, volgens welke de kosten, als bedoeld in
      [artikel 2.3, zesde lid, onderdeel h][ref1] en [artikel 2.4, derde lid, onderdeel g, van de wet][ref2] worden
      vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2'
  - number: '31.1'
    text: |-
      De geldigheidsduur van een medische verklaring als bedoeld in [artikel 8][ref1] wordt bepaald overeenkomstig
      verordening (EU) nr. 1178/2011.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel8
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '31.2'
    text: |-
      De geldigheidsduur van de medische verklaring klasse 3, bedoeld in bijlage IV van verordening (EU) nr. 2015/340,
      voor houders van een FISO bedraagt ten hoogste 24 maanden voor houders tot 40 jaar en 12 maanden voor houders van
      40 jaar en ouder.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel31
  - number: '31.3'
    text: Onze Minister stelt nadere regels voor de verlenging van een medische verklaring.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel31
  - number: '32.1'
    text: |-
      Ten behoeve van de beslissing op bezwaar tegen een beschikking met betrekking tot de medische verklaring of
      certificaat kan Onze Minister een Adviescommissie instellen.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel32
  - number: '32.2'
    text: Bij elke volgende keuring wordt rekening gehouden met het advies van de Adviescommissie.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel32
  - number: '33.1'
    text: |-
      De Adviescommissie bestaat uit ten minste vijf leden, waaronder een voorzitter, die door Onze Minister worden
      benoemd voor een periode van 3 jaar en ontslagen.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel33
  - number: '33.2'
    text: |-
      Van de leden van de Adviescommissie wordt ten minste één lid benoemd uit de kring van deskundigen met betrekking
      tot medische certificaten klasse 1, ten minste één lid uit de kring van deskundigen met betrekking tot medische
      certificaten klasse 2 en ten minste één lid uit de kring van deskundigen met betrekking tot medische verklaringen
      klasse 3.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel33
  - number: '34.1'
    text: Onze Minister doet een ontvangen bezwaarschrift binnen een week aan de Adviescommissie toekomen.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel34
  - number: '34.2'
    text: Onze Minister kan regels stellen met betrekking tot door de Adviescommissie in acht te nemen procedures.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel34
  - number: '35'
    text: |-
      Zolang in een vacature in de Adviescommissie niet is voorzien, vormen de overblijvende leden de Adviescommissie met
      de bevoegdheden van de volledige Adviescommissie.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel35
  - number: '36.1'
    text: |-
      Indien een bewijs van bevoegdheid of een bevoegdverklaring is geschorst op één van de in
      [artikel 2.5, eerste lid, onderdeel a of b van de wet][ref1] genoemde gronden, kan Onze Minister bepalen dat de
      houder zich opnieuw aan een door Onze Minister te bepalen examen onderwerpt. Het examen kan beperkt blijven tot één
      of enkele onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
  - number: '36.2'
    text: |-
      Indien een bewijs van bevoegdheid of een bevoegdverklaring is geschorst op grond van artikel 2.5, eerste lid,
      onderdeel c, wordt de schorsing opgeheven bij opnieuw gebleken medische geschiktheid.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel36
  - number: 36a
    text: |-
      De hoogte en de wijze van betaling van de vergoeding voor de kosten voor handelingen in het kader van de uitvoering
      van internationale overeenkomsten gesloten door de Europese Unie en internationale overeenkomsten gesloten door
      Nederland met derde landen, voor zover dit besluit hier niet reeds in voorziet, wordt bij ministeriële regeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel36a
  - number: 36b
    text: |-
      Onze Minister stelt de tarieven vast, volgens welke de kosten, bedoeld in
      [artikel 2.9, vierde lid, van de wet][ref1] worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
  - number: '37'
    text: |-
      In afwijking van [artikel 17][ref1] kan een luchtvaartstation tot 1 januari 2019 eveneens worden bediend,
      onderscheidenlijk vluchtinformatie eveneens worden verstrekt, door de houder van een geldig bewijs van
      bevoegdheid voor luchthaveninformatieverstrekker onderscheidenlijk een geldig bewijs van bevoegdheid voor
      vluchtinformatieverstrekker dat is afgegeven vóór 1 januari 2018.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel17
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '42'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen, onderdelen daarvan, bewijzen van bevoegdheid, algemene of bijzondere bevoegdverklaringen
      verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010629/2026-01-09#Artikel42
