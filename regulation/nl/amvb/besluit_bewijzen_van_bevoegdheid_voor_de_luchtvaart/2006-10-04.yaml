    text: |-
      1 Onze Minister kan de volgende bewijzen van bevoegdheid afgeven:

      a. RPL, dat de bevoegdheid geeft, niet tegen vergoeding, op te treden als bestuurder van een luchtvaartuig, dat
      gecertificeerd is of luchtwaardig is bevonden voor maximaal 4 inzittenden, tijdens vluchten zonder baat, onder de
      volgende beperkingen:

      1°. alleen tijdens VFR-vluchten;

      2°. alleen tijdens de daglichtperiode als bedoeld in [artikel 1, onderdeel d, van het Luchtverkeersreglement][ref1],
      en

      3°. niet met passagiers, tenzij de houder ten minste tien uur ervaring heeft als gezagvoerder van een luchtvaartuig
      van dezelfde categorie of met dezelfde bijzondere bevoegdverklaring en de houder in de voorafgaande negentig dagen
      ten minste drie starts en drie landingen heeft uitgevoerd als gezagvoerder van een luchtvaartuig van dezelfde
      categorie en met dezelfde bijzondere bevoegdverklaring;

      b. PPL, dat, onder de beperkingen als bedoeld in JAR-FCL 1.110, onderdeel b en 1.115, de bevoegdheid geeft:

      1. van het RPL;

      2. niet tegen vergoeding, op te treden als eerste of tweede bestuurder van een luchtvaartuig tijdens vluchten
      zonder baat;

      c. CPL, dat, onder de beperkingen als bedoeld in JAR-FCL 1.150, onderdeel b, de bevoegdheid geeft:

      1. van het PPL;

      2. op te treden als eerste of tweede bestuurder tijdens vluchten tegen vergoeding, niet zijnde verkeersvluchten, of
      tijdens vluchten voor eigen vervoer;

      3. op te treden als eerste of tweede bestuurder tijdens verkeersvluchten op single pilot luchtvaartuigen;

      4. op te treden als tweede bestuurder tijdens verkeersvluchten op multi-pilot luchtvaartuigen;

      d. ATPL, dat, onder de beperkingen als bedoeld in JAR-FCL 1.275, onderdeel b, de bevoegdheid geeft:

      1. van het CPL;

      2. van de bevoegdverklaring IR;

      3. op te treden als eerste bestuurder tijdens verkeersvluchten op multi-pilot luchtvaartuigen.

      e. CFEL, dat de bevoegdheid geeft op te treden als boordwerktuigkundige van een luchtvaartuig;

      f. AML, dat, voorzien van één of meer bijzondere bevoegdverklaringen de bevoegdheid geeft tot het onderhouden
      van luchtvaartuigen en het toezicht daarop, alsmede het vrijgeven voor gebruik van die luchtvaartuigen na dat
      onderhoud;

      g. JAR-66-AML, dat, voorzien van één of meer bijzondere bevoegdverklaringen en in combinatie met een daartoe
      strekkende autorisatie van de houder van een JAR-145-erkenning, de bevoegdheid geeft tot het afgeven van
      certificaten van vrijgave voor gebruik van luchtvaartuigen namens de houder van die JAR-145-erkenning na onderhoud
      aan die luchtvaartuigen.

