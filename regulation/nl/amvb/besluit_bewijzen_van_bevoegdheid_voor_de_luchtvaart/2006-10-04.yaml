  - number: '25'
    text: |-
      1 Als bewijs dat is voldaan aan de eisen met betrekking tot de nodige kennis, bedrevenheid en ervaring, bedoeld in
      [artikel 20, eerste lid, onderdeel b][ref1], geldt een met goed gevolg afgelegd examen.

      2 Het examen bestaat uit:

      a. een theoretisch onderzoek naar kennis;

      b. een praktisch onderzoek naar kennis, bedrevenheid en ervaring.

      3


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel20
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel25
