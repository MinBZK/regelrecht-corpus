    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat, in overeenstemming met Onze Minister van Defensie van
    5 maart 1999, nr. DGRLD/JBZ/L 99 210113, Directoraat-Generaal Rijksluchtvaartdienst;

    Gelet op de artikelen 1.2, tweede lid, 2.2, derde lid, 2.3, tweede, vijfde en zesde lid, 2.4, tweede, derde en
    vierde lid, 2.7, vierde lid, 2.9, eerste lid, 3.30, 5.11, en 5.16, tweede lid, van de Wet luchtvaart;

    De Raad van State gehoord (advies van 21 mei 1999, nr. W09.99.0097/V);

