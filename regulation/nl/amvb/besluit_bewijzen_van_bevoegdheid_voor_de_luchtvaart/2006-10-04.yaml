articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      AFIS: onderdeel van luchtverkeersdienstverlening dat voorziet in het geven van inlichtingen die tot doel hebben een
      veilig en geregeld verloop van het luchtvaartterreinverkeer op daartoe door Onze Minister bij ministeriële regeling
      aangewezen luchtvaartterreinen (Aerodrome Flight Information Service);

      AML: bewijs van bevoegdheid voor onderhoudstechnicus (Aircraft Maintenance Licence);

      ATPL: bewijs van bevoegdheid voor verkeersvlieger (Airline Transport Pilot Licence);

      CFEL: bewijs van bevoegdheid voor boordwerktuigkundige (Cockpit Flight Engineer Licence);

      CRI: klassebevoegdverklaring instructeur (Class Rating Instructor);

      CPL: bewijs van bevoegdheid voor beroepsvlieger (Commercial Pilot Licence);

      CSR: bevoegdverklaring voor landbouwvliegen (Crop Spraying Rating);

      FI: bevoegdverklaring vlieginstructeur (Flight Instructor);

      grondverkeer: alle verkeer op een landingsterrein met uitzondering van startend en landend verkeer;

      helikopter: gemotoriseerd luchtvaartuig met rotorbladen, zwaarder dan lucht, dat hoofdzakelijk in de lucht gehouden
      kan worden door aërodynamische reactiekrachten op zijn rotorbladen;

      IFR-vlucht: vlucht als bedoeld in [artikel 1, onderdeel i, van het Luchtverkeersreglement][ref1];

      IR: bevoegdverklaring instrumentvliegen (Instrument Rating);

      IRI: instructeur instrumentvliegen (Instrument Rating Instructor);

      JAA: Joint Aviation Authorities;

      JAA-land: land waarvan de burgerluchtvaartautoriteit de JAA-overeenkomst van 11 september 1990 heeft getekend;

      JAR: Joint Aviation Requirements;

      JAR-FCL 1: regeling inzake bewijzen van bevoegdheid voor bestuurders van vliegtuigen, opgesteld door de JAA;

      JAR-FCL 2: regeling inzake bewijzen van bevoegdheid voor bestuurders van helikopters, opgesteld door de JAA;

      JAR-FCL 3: regeling inzake medische eisen voor bemanningen van luchtvaartuigen, opgesteld door de JAA;

      JAR-FCL 4: regeling inzake bewijzen van bevoegdheid voor boordwerktuigkundigen van vliegtuigen, opgesteld door
      de JAA;

      JAR-66: JAR betreffende onderhoudspersoneel, dat namens een JAR-145-erkend bedrijf tot het afgeven van certificaten
      van vrijgave voor gebruik is gerechtigd, opgesteld door de JAA;

      JAR-66-AML: bewijs van bevoegdheid krachtens JAR-66;

      JAR-145: JAR betreffende erkende onderhoudsbedrijven, opgesteld door de JAA;

      leerling-luchtverkeersleider: persoon, bevoegd tot het geven van luchtverkeersdienstverlening onder toezicht van
      een bevoegde praktijkinstructeur;

      luchtschip: luchtvaartuig, lichter dan lucht, dat is voorzien van een voortstuwingsinrichting en een
      besturingsinrichting;

      luchtvaartgrondstation: een radiozend- en ontvangstation op een vaste plaats op de grond dat werkt in de
      luchtvaartmobiele of luchtvaartnavigatiefrequentiebanden;

      luchtvaartterreininformatie:

      1. informatie overeenkomend met de betekenis van de in de Regeling seinen opgenomen grondtekens die op het
      luchtvaartterrein zijn uitgelegd,

      2. informatie van windrichting of sterkte, verkregen uit ter beschikking staande middelen, zoals windmeter en
      windzak,

      3. informatie omtrent omstandigheden die het gebruik van het luchtvaartterrein kunnen beperken,

      4. informatie over luchtverkeersactiviteiten op en in de nabijheid van het luchtvaartterrein,

      5. informatie over de te volgen taxiprocedures, of

      6. informatie over de te gebruiken parkeerplaatsen;

      luchtvaartterreininformatieverstrekker: persoon die op grond van dit besluit bevoegd is luchtvaartterreininformatie
      te verstrekken;

      luchtverkeersleider: persoon, bevoegd tot het geven van luchtverkeersdienstverlening als bedoeld in
      [artikel 1.1, eerste lid, van de wet][ref2];

      ME: meermotorig (Multi Engine);

      MCC: vluchtuitvoering door een meerhoofdige bemanning die samenwerkt als team en geleid wordt door de eerste
      bestuurder (Multi-Crew Co-operation);

      MCCI: Multi-Crew Co-operation Instructor;

      MLA: land-, amfibie- of watervliegtuig met niet meer dan twee zitplaatsen, een overtreksnelheid die niet hoger is
      dan 35.1 knopen gekalibreerde luchtsnelheid, en een maximum startmassa van niet meer dan:

      300 kg voor een landvliegtuig, eenzitter;

      450 kg voor een landvliegtuig, tweezitter;

      330 kg voor een amfibie- of watervliegtuig, eenzitter, of

      495 kg voor een amfibie- of watervliegtuig, tweezitter, mits een micro light die als watervliegtuig en als
      landvliegtuig gebruikt kan worden binnen beide daarvoor geldende massalimieten valt (Micro Light Aeroplane)

      mobiel luchtvaartstation: een radiozend- en ontvangstation op de grond, niet op een vaste plaats, dat werkt in de
      luchtvaartmobiele of luchtvaartnavigatiefrequentiebanden;

      multi-pilot: gecertificeerd voor ten minste twee bestuurders;

      night qualification: bevoegdverklaring VFR-nachtvliegen;

      Onze Minister: Onze Minister van Verkeer en Waterstaat;

      PPL: bewijs van bevoegdheid voor privévlieger (Private Pilot Licence);

      RFI: bevoegdverklaring recreatief vlieginstructeur (Recreational Flight Instructor);

      RPL: bewijs van bevoegdheid voor recreatief vlieger (Recreational Pilot Licence);

      RT: bevoegdverklaring radiotelefonie;

      [R.T.L.: Regeling Toezicht Luchtvaart][ref3];

      schermvliegtuig: zweeftoestel zonder starre hoofdstructuur, dat kan worden gedragen en slechts gestart en geland
      kan worden door gebruik te maken van de benen van de bestuurder;

      SE: eenmotorig (Single-Engine);

      SFI: instructeur STD (Synthetic Flight Instructor);

      single-pilot: gecertificeerd voor één bestuurder;

      STI: instructeur vluchtnabootser (Synthetic Training Instructor);

      TMG: motorzweefvliegtuig met een integraal gemonteerde niet intrekbare motor en een niet intrekbare propeller, dat
      in staat is om op eigen kracht op te stijgen en te klimmen (Touring Motor Glider);

      TRI: typebevoegdverklaring instructeur (Type Rating Instructor);

      verdrag: Verdrag inzake de internationale burgerluchtvaart (Trb. 1973. 109);

      VFR-vlucht: vlucht als bedoeld in [artikel 1, onderdeel ae van het Luchtverkeersreglement][ref4];

      vliegtuig: gemotoriseerd luchtvaartuig met vaste vleugels, zwaarder dan lucht, dat hoofdzakelijk in de lucht
      gehouden kan worden door aërodynamische reactiekrachten op zijn vleugels;

      vluchtinformatieverstrekker: persoon, bevoegd tot het geven van advies, inlichtingen en alarmering aan luchtverkeer
      of grondverkeer;

      vrije ballon: luchtvaartuig, lichter dan lucht, niet voorzien van een voortstuwingsinstallatie en ingericht en
      bestemd om ten minste één persoon te vervoeren;

      wet: [Wet luchtvaart][ref5];

      zeilvliegtuig: zweeftoestel met starre hoofdstructuur, dat kan worden gedragen en slechts gestart en geland kan
      worden door gebruik te maken van de benen van de bestuurder;

      zweeftoestel: luchtvaartuig niet zijnde een TMG, zwaarder dan lucht, dat hoofdzakelijk in de lucht kan worden
      gehouden door aerodynamische reactiekrachten en waarvan de vrije vlucht niet afhankelijk is van een motor;

      zweefvliegtuig: zweeftoestel met vaste vleugel.

      2 Een wijziging van JAR-FCL 1 tot en met 4 gaat voor de toepassing van dit besluit en de krachtens dit besluit
      vastgestelde regelingen gelden met ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn
      gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt
      vastgesteld.


