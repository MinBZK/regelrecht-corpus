        paragraaf: '3'
  - number: '29'
    text: |-
      De examencommissie brengt zo spoedig mogelijk na afloop van het examen schriftelijk rapport uit aan Onze Minister.
      In dit rapport worden de uitkomsten, bijzonderheden en opmerkingen met betrekking tot het examen vermeld.
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel29
  - number: '30'
    text: |-
      1 Ten behoeve van een door Onze Minister, al dan niet onder beperkingen, af te geven medische verklaring wordt
      degene, die zulk een verklaring heeft aangevraagd, gekeurd door een geneeskundige of door een geneeskundige
      instantie.

      2 Onze Minister kan in ieder geval regels geven met betrekking tot:

      a. de aanvraag van de keuring;

      b. de oproep voor en de aanmelding bij de keuring;

      c. de ten behoeve van de afgifte van een medische verklaring te verrichten keuring;

      d. de anamnese;

      e. de kennisgeving van de uitslag;

      f. de eisen van medische geschiktheid en de beperkingen waaronder de medische verklaring kan worden afgegeven;

      g. de eisen waaraan een geneeskundige of een geneeskundige instantie ten behoeve van hun autorisatie moeten
      voldoen;

      h. de verplichtingen van de houder van de medische verklaring of van een geneeskundige of een geneeskundige
      instantie;

      i. de erkenning van in het buitenland verrichte keuringen.

      3 Onze Minister stelt de tarieven vast, volgens welke de kosten, als bedoeld in
      [artikel 2.3, zesde lid, onderdeel h][ref1] en [artikel 2.4, derde lid, onderdeel g, van de wet][ref2] worden
      vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2.3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2.4'
  - number: '31'
    text: |-
      1 De geldigheidsduur van de medische verklaringen, die niet zijn genoemd in het tweede lid, zijn opgenomen in JAR-
      FCL 3.105.

      2 De geldigheidsduur van de medische verklaring voor luchtverkeersleiders, luchtverkeersleiders in opleiding,
      AFISO's en luchtvaartterreininformatieverstrekkers bedraagt in maanden ten hoogste:










                    a.







                    klasse 2


                    jonger dan 30 jaar


                    30 tot 50 jaar


                    50 jaar of ouder






                    luchtvaartterreininformatieverstrekker


                    60*


                    24


                    12






      * met dien verstande dat een medische verklaring afgegeven voor het dertigste levensjaar van de houder slechts
      geldt tot zijn twee en dertigste jaar.









                    b.






                    klasse 3


                    jonger dan 40 jaar


                    40 jaar of ouder






                    a. luchtverkeersleider


                    24


                    12




                    b. luchtverkeersleider in opleiding


                    24


                    12




                    c. AFISO


                    24


                    12






      3 Houders van een bewijs van bevoegdheid voor informatieverstrekker kunnen eveneens gebruik maken van een geldige
      medische verklaring klasse 3.

      4 Onze Minister stelt nadere regels voor de verlenging van een medische verklaring.
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel31
  - number: '32'
    text: |-
      1 Ten behoeve van de beslissing op bezwaar tegen een beschikking met betrekking tot een medische verklaring kan
      Onze Minister advies inwinnen bij een door Onze Minister ingestelde Adviescommissie.

      2 Bij elke volgende keuring wordt rekening gehouden met het advies van de Adviescommissie.
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel32
  - number: '33'
    text: |-
      1 De Adviescommissie bestaat uit ten minste vijf leden, waaronder een voorzitter, die door Onze Minister worden
      benoemd voor een periode van 3 jaar en ontslagen.

      2 Van de leden van de Adviescommissie wordt ten minste één lid benoemd uit de kring van deskundigen met betrekking
      tot medische verklaringen klasse 1, ten minste één lid uit de kring van deskundigen met betrekking tot medische
      verklaringen klasse 2 en ten minste één lid uit de kring van deskundigen met betrekking tot medische verklaringen
      klasse 3.
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel33
  - number: '34'
    text: |-
      1 Onze Minister doet een ontvangen bezwaarschrift binnen een week aan de Adviescommissie toekomen.

      2 Onze Minister kan regels stellen met betrekking tot door de Adviescommissie in acht te nemen procedures.
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel34
  - number: '35'
    text: |-
      Zolang in een vacature in de Adviescommissie niet is voorzien, vormen de overblijvende leden de Adviescommissie met
      de bevoegdheden van de volledige Adviescommissie.
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel35
  - number: '36'
    text: |-
      1 Indien een bewijs van bevoegdheid of een bevoegdverklaring is geschorst op één van de in
      [artikel 2.5, eerste lid, onderdeel a of b van de wet][ref1] genoemde gronden, kan Onze Minister bepalen dat de
      houder zich opnieuw aan een door Onze Minister te bepalen examen onderwerpt. Het examen kan beperkt blijven tot één
      of enkele onderdelen.

      2 Indien een bewijs van bevoegdheid of een bevoegdverklaring is geschorst op grond van artikel 2.5, eerste lid,
      onderdeel c, wordt de schorsing opgeheven bij opnieuw gebleken medische geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2.5'
  - number: '38'
    text: |-
      1 Met uitzondering van diegene die in aanmerking komt voor een bewijs van bevoegdheid als bedoeld in
      [artikel 41, eerste lid][ref1], wordt aan de houder van een geldig bewijs van bevoegdheid of bevoegdverklaring,
      zonder dat behoeft te worden voldaan aan de bij of krachtens [artikel 8, eerste lid][ref2], van dit besluit
      gestelde eisen, een nieuw bewijs van bevoegdheid of bevoegdverklaring afgegeven voor de nog lopende periode van
      onderscheidenlijk het bewijs van bevoegdheid of de bevoegdverklaring, met dien verstande dat:

      a. aan een houder van een vliegbewijs B1, als bedoeld in
      [artikel 12, eerste lid, onderdeel a, sub 6, van de R.T.L.][ref3] een ATPL wordt afgegeven in een overeenkomende
      categorie luchtvaartuigen;

      b. aan een houder van een vliegbewijs B2 als bedoeld in
      [artikel 12, eerste lid, onderdeel a, onder 5, van de R.T.L.][ref4], een CPL wordt afgegeven in de categorie
      vliegtuigen met de aantekening, dat de houder bevoegd is tot het optreden als eerste bestuurder tijdens
      verkeersvluchten op multi-pilot vliegtuigen met een maximum startmassa van niet meer dan 20 000 kg., indien hij in
      het bezit is van een bijzondere bevoegdverklaring voor een multi-pilot vliegtuigtype;

      c. aan een houder van een vliegbewijs B2, als bedoeld in
      [artikel 12, eerste lid, onderdeel a, sub 5 van de R.T.L.][ref5] een CPL wordt afgegeven in de categorie
      vliegtuigen, indien hij niet in het bezit is van een bijzondere bevoegdverklaring voor een multi-pilot
      vliegtuigtype;

      d. aan een houder van een vliegbewijs B3 als bedoeld in
      [artikel 12, eerste lid, onderdeel a, onderdeel 4, van de R.T.L.][ref6], een CPL wordt afgegeven in de categorie
      vliegtuigen met de aantekening, dat de houder bevoegd is tot het optreden als eerste bestuurder tijdens
      verkeersvluchten op multi-pilot vliegtuigen met een maximum startmassa van niet meer dan 5 700 kg., indien hij in
      het bezit is van een bijzondere bevoegdverklaring voor een multi-pilot vliegtuigtype met een maximum startmassa van
      niet meer dan 5 700 kg;

      e. aan een houder van een vliegbewijs B3, als bedoeld in
      [artikel 12, eerste lid, onderdeel a, sub 4, van de R.T.L.][ref7] een CPL wordt afgegeven in een overeenkomende
      categorie luchtvaartuigen;

      f. aan een houder van een vliegbewijs A, als bedoeld in
      [artikel 12, eerste lid, onderdeel a, sub 3, van de R.T.L.][ref8] een PPL wordt afgegeven in een overeenkomende
      categorie luchtvaartuigen;

      g. aan een houder van een bijzondere bevoegdverklaring VK1A onderscheidenlijk VK2A een bijzondere bevoegdverklaring
      SE piston (land) onderscheidenlijk ME piston (land) wordt afgegeven, en indien genoemde houder aantoont in een
      voorafgaande periode van 12 maanden ten minste 10 uur vliegervaring te hebben opgedaan op een vliegtuigtype met een
      MTOW van maximaal 2000 kg, uitgerust met een turbinemotor, een bijzondere bevoegdverklaring voor dat betreffende
      vliegtuigtype wordt afgegeven;

      h. aan een houder van een bevoegdverklaring blindvliegen, als bedoeld in
      [artikel 16, onderdeel a, sub 2, van de R.T.L.][ref9] of een vliegbewijs B1, als bedoeld in
      [artikel 12, eerste lid, onderdeel a, sub 6, van de R.T.L.][ref10] in de categorie luchtvaartuigen, afhankelijk van
      hun vliegtuigbevoegdverklaring een IR-SE of IR-ME, dan wel beide wordt afgegeven in een overeenkomende categorie
      luchtvaartuigen;

      i. aan een houder van een beperkt vliegbewijs A, als bedoeld in
      [artikel 12, eerste lid, onderdeel a, sub 2, van de R.T.L.][ref11], een RPL wordt afgegeven in een overeenkomende
      categorie luchtvaartuigen met een overeenkomende bijzondere bevoegdverklaring;

      j. aan een houder van een oefenbewijs, als bedoeld in
      [artikel 12, eerste lid, onderdeel a, sub 1, van de R.T.L.][ref12], in een van de in
      [artikel 2, tweede lid][ref13], genoemde categorieën luchtvaartuigen vrijstelling wordt verleend als bedoeld in
      [artikel 11, onderdeel h][ref14] van dit besluit.

      2 Aan andere dan de in het eerste lid genoemde houders van een geldig bewijs van bevoegdheid wordt, zonder dat
      behoeft te worden voldaan aan de bij of krachtens [artikel 8, eerste lid ][ref15] van dit besluit genoemde eisen,
      een nieuw bewijs van bevoegdheid verstrekt, dat gelijkwaardig is aan hun huidige bewijs van bevoegdheid;

      3 Aan andere dan de in het eerste lid genoemde houders van een geldige algemene bevoegdverklaring wordt, zonder dat
      behoeft te worden voldaan aan de bij of krachtens [artikel 8, eerste lid][ref16], van dit besluit, genoemde eisen,
      een nieuwe bevoegdverklaring op het document weergegeven dat gelijkwaardig is aan hun huidige bevoegdverklaring;

      4 Aan degene die vliegonderricht geeft of heeft gegeven, als bedoeld in
      [artikel 3, tweede lid, onderdeel g, h of j][ref17], wordt op verzoek een TRI onderscheidenlijk CRI
      onderscheidenlijk SFI afgegeven, indien hij aantoont voor de inwerkingtreding van dit besluit ten minste 5 uur het
      bedoelde vliegonderricht te hebben gegeven in de voorafgaande periode van 12 maanden.

      5 Aan andere dan de in het eerste lid genoemde houders van een geldige bijzondere bevoegdverklaring wordt, zonder
      dat behoeft te worden voldaan aan de bij of krachtens [artikel 8, eerste lid][ref18], van dit besluit genoemde
      eisen, een bijzondere bevoegdverklaring als bedoeld in [bijlage I][ref19] bij dit besluit weergegeven op het
      document.

      6 Aan degenen die op het moment van inwerkingtreding van dit besluit aan kunnen tonen bevoegd te zijn om
      praktijkexamens af te nemen en te beoordelen wordt, zonder dat behoeft te worden voldaan aan de bij of krachtens
      [artikel 8, eerste lid][ref20], van dit besluit genoemde eisen een autorisatiedocument verstrekt met inbegrip van
      bevoegdheden gelijkwaardig aan de bevoegdheden die zij op dat moment hebben.

      7 Aan een houder van een geldige ontheffing voor het besturen van een ultra licht vliegtuig, die op grond van
      [artikel 8a, derde lid, van de Luchtvaartwet][ref21] is verstrekt, wordt op verzoek en op afgifte van de ontheffing
      een RPL afgegeven in de categorie vliegtuigen, met de bijzondere bevoegdverklaring MLA.

      8 Aan een houder van een geldige ontheffing voor het geven van vliegonderricht op een ultra licht vliegtuig, die op
      grond van [artikel 8a, derde lid van de Luchtvaartwet][ref22] is verstrekt, wordt op verzoek en op afgifte van de
      ontheffing een RFI afgegeven in de categorie vliegtuigen, met de bijzondere bevoegdverklaring MLA.

      9 Aan een houder van een geldige ontheffing voor het besturen van een gyrocopter, die op grond van
      [artikel 8a, derde lid, van de Luchtvaartwet][ref23] is verstrekt, wordt op verzoek en op afgifte van de
      ontheffing een RPL afgegeven in de categorie helicopters, met de bijzondere bevoegdverklaring gyroplane voor het
      overeenkomende type gyroplane.

      10 Aan een houder van een ontheffing, die op grond van de Regeling havendienstradio is verleend, wordt met ingang
      van 1 oktober 1999 een bewijs van bevoegdheid verstrekt als bedoeld in [artikel 17, onderdeel d][ref24].

      11 Bewijzen van bevoegdheid die op het tijdstip van inwerkingtreding van dit besluit op grond van artikel 2 van het
      Besluit kwalificaties luchtverkeersdienstverlening zijn afgegeven, worden aangemerkt als zijnde afgegeven op grond
      van dit besluit, met dien verstande dat zij hun geldigheid blijven behouden voor de in het bewijs genoemde termijn.

      12 Bewijzen van bevoegdheid, bevoegdverklaringen, autorisaties en ontheffingen, die op grond van dit artikel zijn
      verstrekt danwel afgegeven kunnen, voor zover zij betrekking hebben op danwel samenhangen met het ATPL, CPL of PPL
      tot uiterlijk acht jaar na inwerkingtreding van het desbetreffende lid of onderdeel van dit artikel worden verlengd
      zonder dat behoeft te worden voldaan aan de bij of krachtens [artikel 41][ref25] van dit besluit gestelde eisen, na
      welk tijdstip zij komen te vervallen.


