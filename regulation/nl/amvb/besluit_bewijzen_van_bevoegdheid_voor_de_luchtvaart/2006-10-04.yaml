  - number: '8'
    text: |-
      1 Met inachtneming van [artikel 6][ref1] wordt het bewijs van bevoegdheid of de bevoegdverklaring op aanvraag
      afgegeven aan een ieder die:

      a. voldoet aan de bij ministeriële regeling vast te stellen vereisten inzake kennis, bedrevenheid, ervaring en
      opleiding, en,

      b. met uitzondering van de bewijzen van bevoegdheid, bedoeld in [artikel 2, eerste lid, onderdelen f en g][ref2]„ en
      de daarbij behorende bevoegdverklaringen, in het bezit is van een geldige medische verklaring.

      2 De aanvraag tot afgifte van een bewijs van bevoegdheid of bevoegdverklaring wordt gedaan op een daartoe door Onze
      Minister verstrekt aanvraagformulier.

      3 Onze Minister stelt de tarieven vast, volgens welke de kosten, bedoeld in
      [artikel 2.3, zesde lid, onderdeel h, van de wet][ref3], worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2.3
