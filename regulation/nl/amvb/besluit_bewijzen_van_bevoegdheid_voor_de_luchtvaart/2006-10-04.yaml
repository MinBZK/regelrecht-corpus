  - number: '5'
    text: |-
      1 Onze Minister stelt bijzondere bevoegdverklaringen naar type, klasse of werkzaamheden vast en de duur waarvoor
      zij worden afgegeven.

      2 Onze Minister kan beperkingen vaststellen waaronder bijzondere bevoegdverklaringen worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel5
  - number: '6'
    text: |-
      1 De leeftijd, welke moet zijn bereikt om voor een bewijs van bevoegdheid in aanmerking te komen, bedraagt voor:

      a. RPL: 16 jaar;

      b. PPL: 17 jaar;

      c. CPL: 18 jaar;

      d. ATPL: 21 jaar;

      e. CFEL: 18 jaar;

      f. AML: 18 jaar;

      g. JAR-66-AML: 18 jaar.

      2 De leeftijd, welke moet zijn bereikt om voor een instructeursbevoegdverklaring in aanmerking te komen, bedraagt
      18 jaar.
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel6
  - number: '7'
    text: |-
      1 Met uitzondering van het tweede lid is de houder van een bewijs van bevoegdheid, als bedoeld in
      [artikel 2, eerste lid, onderdeel c en d][ref1], die de leeftijd van 60 jaar heeft bereikt, niet bevoegd op te
      treden als bestuurder van een luchtvaartuig tijdens verkeersvluchten.

      2 De houder van een bewijs van bevoegdheid, als bedoeld in [artikel 2, eerste lid, onderdeel c en d][ref2], die
      zich bevindt in de leeftijdscategorie tussen 60 en 65 jaar, is uitsluitend bevoegd op te treden als bestuurder
      van een luchtvaartuig tijdens verkeersvluchten, indien de bemanning van het luchtvaartuig bestaat uit meerdere
      houders van deze bewijzen van bevoegdheid en de eerstgenoemde houder de enige is in de hiervoor-genoemde
      leeftijdscategorie.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel7
