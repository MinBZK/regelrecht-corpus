  - number: '39'
    text: |-
      1 Aan diegenen die op het moment van inwerkingtreding van dit besluit in het bezit zijn van een geldig vliegbewijs
      B1, B2, B3 of boordwerktuigkundige als bedoeld in [artikel 12, eerste lid, van de R.T.L.][ref1] wordt een
      gelijkwaardige medische verklaring klasse I afgegeven voor de nog lopende periode van het bewijs van bevoegdheid.

      2 Aan houders van andere vliegbewijzen dan in het eerste lid genoemde wordt een gelijkwaardige medische verklaring
      klasse II afgegeven voor de nog lopende periode van het bewijs van bevoegdheid.

      3 Aan houders van een medische verklaring weergegeven op een bewijs van bevoegdheid als bedoeld in
      [artikel 17, onderdeel a of b][ref2], wordt een gelijkwaardige medische verklaring klasse III afgegeven voor de nog
      lopende periode van eerstgenoemde medische verklaring.

      4 Na overleg van een geldig medisch keuringsrapport kan Onze Minister een gelijkwaardige medische verklaring van de
      bijbehorende klasse afgegeven voor de nog lopende periode van de medische verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002309#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel17
