  - number: '3'
    text: |-
      1 Aan houders van een RPL kan, onder de krachtens [artikel 2.2 van de wet][ref1] genoemde bijzondere
      bevoegdverklaringen, al dan niet onder beperkingen naar soort vlucht of ervaring, één of meer van de volgende
      algemene bevoegdverklaringen worden afgegeven:

      a. RT, dat de bevoegdheid geeft om radiocontact met de luchtverkeersdienst, als bedoeld in
      [artikel 1, onderdeel q , van het Luchtverkeersreglement][ref2], of met bestuurders van andere luchtvaartuigen
      te onderhouden;

      b. RFI, dat de bevoegdheid geeft om vliegonderricht te geven voor de afgifte van een:

      1. RPL, of

      2. bijzondere bevoegdverklaring in een RPL;

      2 Aan houders van een PPL, CPL of ATPL kan, onder de krachtens [artikel 2.2 van de wet][ref3] genoemde bijzondere
      bevoegdverklaringen, al dan niet onder beperkingen naar soort vlucht of ervaring, een of meer van de volgende
      algemene bevoegdverklaringen worden afgegeven:

      a. RT, dat de bevoegdheid geeft om radiocontact met de luchtverkeersdienst, als bedoeld in
      [artikel 1, onderdeel q, van het Luchtverkeersreglement][ref4], of met bestuurders van andere luchtvaartuigen,
      te onderhouden;

      b. IR-SE, dat de bevoegdheid geeft om op te treden als bestuurder gedurende IFR-vluchten op SE-luchtvaartuigen;

      c. IR-ME, dat de bevoegdheid geeft om op te treden als bestuurder gedurende IFR-vluchten op ME-luchtvaartuigen;

      d. CSR, dat de bevoegdheid geeft om een luchtvaartuig te bedienen waarmee stoffen ter bescherming of bevordering
      van het milieu of de land-, tuin-, of bosbouw vanuit de lucht worden verspreid;

      e. FI, dat de bevoegdheid geeft van RFI en om, onder de beperkingen als bedoeld in JAR-FCL 1.310, onderdeel a, en
      JAR-FCL 1.330, vliegonderricht te geven voor:

      1. de afgifte van een PPL en bijzondere bevoegdverklaringen voor SE-luchtvaartuigen,

      2. de afgifte van een CPL,

      3. VFR-nachtvliegen,

      4. de afgifte van een IR,

      5. de afgifte van bijzondere bevoegdverklaringen voor single-pilot ME-luchtvaartuigen,

      6. de afgifte van een FI;

      f. TRI, dat de bevoegdheid geeft om, onder de beperkingen als bedoeld in JAR-FCL 1.310, onderdeel a, JAR-FCL 1.360
      en JAR-FCL 1.365, aan houders van een bewijs van bevoegdheid vliegonderricht te geven voor de afgifte van een
      bijzondere bevoegdverklaring voor een multi-pilot luchtvaartuig, inclusief onderricht benodigd voor MCC;

      g. CRI, dat de bevoegdheid geeft om, onder de beperkingen als bedoeld in JAR-FCL 1.310, onderdeel a, en JAR-FCL
      1.380, aan houders van een bewijs van bevoegdheid vliegonderricht te geven voor de afgifte van een bijzondere
      bevoegdverklaring voor een single-pilot luchtvaartuig;

      h. IRI, dat de bevoegdheid geeft om, onder de beperkingen als bedoeld in JAR-FCL 1.310, onderdeel a, JAR-FCL 1.390
      en JAR-FCL 1.395, aan houders van een bewijs van bevoegdheid vliegonderricht te geven voor de afgifte van een IR;

      i. MCCI, dat de bevoegdheid geeft om onderricht te geven voor het praktijkgedeelte van MCC-opleidingen, wanneer dit
      niet wordt gecombineerd met onderricht voor een typebevoegdverklaring voor een luchtvaartuig.

      j. SFI, dat de bevoegdheid geeft om, onder de beperkingen als bedoeld in JAR-FCL 1.310, onderdeela, en JAR-FCL
      1.410, vliegonderricht te geven op een STD voor de afgifte van een bijzonderebevoegdverklaring voor een multi-
      pilot luchtvaartuig;

      k. STI, dat de bevoegdheid geeft om, onder de beperkingen, bedoeld in JAR-FCL 1.310, onderdeel a, en JAR-
      FCL 1.210, vliegonderricht te geven op een STD voor de afgifte van bewijs van bevoegdheid, IR, en klasse- en
      typebevoegdverklaring voor een single-pilot luchtvoertuig;

      l. night qualification, dat de bevoegdheid geeft om de bevoegdheden van het bewijs van bevoegdheid waarvoor de
      bevoegdverklaring wordt afgegeven 's nachts uit te voeren Deze bevoegdverklaring wordt uitsluitend afgegeven aan de
      houder van een PPL of CPL.

      3 Indien een algemene bevoegdverklaring als bedoeld in het tweede lid, onderdelen a tot en met f en h en k,
      wordt aangevraagd of afgegeven voor de categorie helikopters, zijn de overeenkomstige artikelen uit JAR-FCL 2 van
      toepassing, met dien verstande dat bij IR geen onderscheid wordt gemaakt in SE en ME.

      4 De bevoegdheden die voortvloeien uit een RT zijn steeds beperkt tot het overeenkomende bewijs van bevoegdheid van
      de houder.

      5 De bevoegdheden die voortvloeien uit een algemene bevoegdverklaring, met uitzondering van de RT, zijn steeds
      beperkt tot die categorie luchtvaartuigen waarvoor de bevoegdverklaring is afgegeven.

      6 Onverminderd het tweede lid, onderdelen a en k, kan aan houders van een CPL(FB) de algemene bevoegdverklaring
      FI(FB) worden afgegeven dat de bevoegdheid geeft onderricht te geven in het besturen van vrije ballonnen voor:

      a. de afgifte van een CPL(FB);

      b. VFR-nachtvliegen;

      c. de afgifte van een FI(FB).


