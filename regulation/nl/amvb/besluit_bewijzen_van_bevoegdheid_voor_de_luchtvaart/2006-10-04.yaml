        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '20'
    text: |-
      1 Met inachtneming van [artikel 19][ref1] worden een bewijs van bevoegdheid en een bevoegdverklaring voor
      luchtverkeersleider, leerling-luchtverkeersleider en vluchtinformatieverstrekker op aanvraag verleend aan een ieder
      die:

      a. in het bezit is van een geldige medische verklaring,

      b. voldoet aan bij ministeriële regeling te stellen eisen inzake kennis, bedrevenheid en ervaring, en

      c.

      2 Het eerste lid, onderdeel b, is van overeenkomstige toepassing op het verlenen van bewijzen van bevoegdheid en
      bevoegdverklaringen voor luchtvaartterreininformatieverstrekker.

      3 Onze Minister stelt de tarieven vast, volgens welke de kosten, bedoeld in
      [artikel 2.3, zesde lid, onderdeel h, van de wet][ref2], worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel20
