  - number: '15'
    text: |-
      1 Onze Minister stelt het resultaat van het theorie-en praktijkexamen vast.

      2 Onze Minister stelt nadere regels met betrekking tot de autorisatie van examinatoren. Deze regels omvatten in
      ieder geval bepalingen betreffende:

      a. de bij de aanvraag tot autorisatie in te dienen gegevens;

      b. de afgifte, geldigheidsduur, verlenging en intrekking van de autorisatie;

      c. de eisen inzake kennis, bedrevenheid en ervaring;

      d. het onderscheid in bevoegdheden naar soort autorisatie.

      3 De examens ter verkrijging van de bewijzen van bevoegdheid, bedoeld in
      [artikel 2, eerste lid, onderdelen f en g][ref1], en van de daarbij behorende bevoegdverklaringen worden afgelegd
      voor een door Onze Minister daartoe in te stellen examencommissie of aan te wijzen erkende opleidingsinstelling.
      Bij ministeriële regeling geeft Onze Minister nadere regels, die in ieder geval regels bevatten met betrekking tot:

      a. de samenstelling en werkwijze van de commissie;

      b. de bekwaamheidseisen waaraan de commissieleden moeten voldoen;

      c. de richtlijnen met betrekking tot het afnemen van examens.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel2
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '16'
    text: |-
      1 Onze Minister stelt een examenreglement vast.

      2 In dit reglement kunnen bepalingen opgenomen worden omtrent:

      a. de wijze van examinering;

      b. de duur van examens en de wijze waarop examens worden uitgevoerd;

      c. de vaststelling van de examenopgaven voor het schriftelijke gedeelte;

      d. de groepen van vakken waarin examens kunnen worden afgelegd;

      e. het gebruik van STD's ten behoeve van examens;

      f. de aanmelding voor examens;

      g. de toelating tot examens;

      h. geheimhouding;

      i. het toezicht op theorie- en praktijkexamens;

      j. de uitsluiting van een examinandus van examens;

      k. de ordemaatregelen tijdens examens;

      l. de beoordeling van examens;

      m. de vaststelling van het resultaat van examens;

      n. de kennisgeving van de uitslag;

      o. de mogelijkheid van herexamens;

      p. het afnemen van praktijkexamens;

      q. de termijn waarbinnen examens moeten zijn afgelegd;

      r. de uitsluiting van examens;

      s. frequentie van het examen.
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel16
  - number: '17'
    text: |-
      Onze Minister kan bewijzen van bevoegdheid afgeven voor:

      a. luchtverkeersleider;

      b. leerling-luchtverkeersleider;

      c. vluchtinformatieverstrekker;

      d. luchtvaartterreininformatieverstrekker.
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel17
  - number: '18'
    text: |-
      1 Onze Minister geeft op de bewijzen van bevoegdheid voor luchtverkeersleider, voor leerling-luchtverkeersleider,
      voor vluchtinformatieverstrekker en voor luchtvaartterreininformatieverstrekker een of meer algemene
      bevoegdverklaringen en de daarbij behorende bevoegdheden weer zoals aangegeven in de [bijlage II][ref1] bij dit
      besluit.

      2 Onze Minister kan aan de algemene bevoegdverklaringen, bedoeld in het eerste lid, beperkingen verbinden zoals
      aangegeven in [bijlage II][ref2] bij dit besluit.

      3 Onze Minister kan op de bewijzen van bevoegdheid voor luchtverkeersleider, vluchtinformatieverstrekker en
      luchtvaartterreininformatieverstrekker tevens één of meer bijzondere bevoegdverklaringen weergeven zoals aangegeven
      in [bijlage II][ref3] bij dit besluit.

      4 De bijzondere bevoegdverklaringen, bedoeld in het derde lid, en de daarbij behorende bevoegdheden zijn slechts
      geldig in samenhang met de bij de desbetreffende bewijzen van bevoegdheid behorende algemene bevoegdverklaringen,
      bevoegdheden en beperkingen.

      5 Op de bewijzen van bevoegdheid, bedoeld in [artikel 17][ref4], wordt de bevoegdverklaring RT weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0010629
      [ref2]: https://wetten.overheid.nl/BWBR0010629
      [ref3]: https://wetten.overheid.nl/BWBR0010629
      [ref4]: https://wetten.overheid.nl/BWBR0010629#Artikel17
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0010629
      - id: ref2
        bwb_id: BWBR0010629
      - id: ref3
        bwb_id: BWBR0010629
      - id: ref4
        bwb_id: BWBR0010629
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '19'
    text: |-
      De minimumleeftijd voor de afgifte van een bewijs van bevoegdheid als bedoeld in [artikel 17][ref1] bedraagt voor:

      a. luchtverkeersleider: 19 jaar;

      b. leerling-luchtverkeersleider: 18 jaar;

      c. vluchtinformatieverstrekker: 18 jaar;

      d. luchtvaartterreininformatieverstrekker: 18 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel17
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel19
    references:
