  - number: '41'
    text: |-
      1 Aan degene die op grond van artikel 38 in aanmerking komt voor een ATPL of CPL in de categorie vliegtuigen
      wordt op verzoek voor de duur van dat bewijs een gelijkwaardig bewijs van bevoegdheid afgegeven op een document
      als bedoeld in Appendix 1 behorend bij JAR-FCL 1 075, indien hij aantoonbaar voldoet aan de eisen als bedoeld in
      Appendix 1 behorend bij JAR-FCL 1 005 en RT heeft behaald en geldig gehouden.

      2 Aan degene die op grond van artikel 38 in aanmerking komt voor een PPL in de categorie vliegtuigen wordt op
      verzoek voor de duur van dat bewijs een gelijkwaardig bewijs van bevoegdheid afgegeven op een document, als bedoeld
      in Appendix 1 behorend bij JAR-FCL 1 075, indien hij aantoonbaar:

      a. met goed gevolg de bekwaamheidsproef voor de desbetreffende bijzondere bevoegdverklaring heeft afgelegd;

      b. aan Onze Minister verklaard heeft de relevante bepalingen van JAR-FCL te kennen;

      c. ten minste 70 uur totale vliegervaring heeft in de desbetreffende bijzondere bevoegdverklaring;

      d. RT heeft behaald en geldig gehouden.

      3 Aan degene die op grond van artikel 38 in aanmerking komt voor een ATPL, CPL of PPL in de categorie helicopters
      wordt op verzoek voor de duur van dat bewijs een gelijkwaardig bewijs van bevoegdheid afgegeven op een document als
      bedoeld in Appendix 1 behorend bij JAR-FCL 2 075, indien hij aantoonbaar voldoet aan de eisen, bedoeld in Appendix
      1 behorend bij JAR-FCL 2 005 en in het bezit is van een geldig RT.

      4 Aan degene die op grond van artikel 38 in aanmerking komt voor een CFEL in de categorie vliegtuigen wordt op
      verzoek, voor de duur van dat bewijs, een gelijkwaardig bewijs van bevoegdheid afgegeven op een document als
      bedoeld in Appendix 1 behorend bij JAR-FCL 4 075, indien hij aantoonbaar voldoet aan de eisen, bedoeld in Appendix
      1 behorend bij JAR-FCL 4 005 en in het bezit is van een geldig RT.

      5 Het eerste tot en met vierde lid is van overeenkomstige toepassing op een algemene bevoegdverklaring, voor zover
      het verzoek tot afgifte van die bevoegdverklaring tezamen met het verzoek als bedoeld in het eerste tot en met het
      vierde lid wordt ingediend.

      6 Aan degene die op grond van artikel 38, eerste lid, onderdeel m, eerste lid, subonderdeel 3°, in aanmerking komt
      voor een RPL met een algemene bevoegdverklaring RFI in de categorie vliegtuigen, klasse touring-motorglider, en een
      PPL voor de categorie vliegtuigen met de bijzondere bevoegdverklaring TMG, wordt de bevoegdverklaring FI afgegeven
      in een overeenkomende categorie, indien hij aantoonbaar:

      a. voldoet aan de eisen voorafgaand aan de FI-cursus als bedoeld in JAR-FCL 1 335;

      b. met goed gevolg de FI-cursus als bedoeld in JAR-FCL 1 340 heeft gevolgd;

      c. theoretische kennis op CPL-niveau heeft;

      d. met goed gevolg een praktisch examen als bedoeld in JAR-FCL 1 345 met Appendix 1 bij JAR-FCL 1 330 en
      1 345 heeft afgelegd, met dien verstande dat tot 1 juli 2002 in plaats van de gevraagde 150 uur ervaring als
      gezagvoerder met een PPL voor de categorie vliegtuigen deze uren ook als houder van een zweefvliegbewijs met de
      bevoegdverklaring motorzweefvliegen worden geaccepteerd.
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel41
  - number: '42'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen, onderdelen daarvan, bewijzen van bevoegdheid, algemene of bijzondere bevoegdverklaringen
      verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel42
  - number: '43'
    text: 'Dit besluit wordt aangehaald als: Besluit bewijzen van bevoegdheid voor de luchtvaart.'
    url: https://wetten.overheid.nl/BWBR0010629/2006-10-04#Artikel43
