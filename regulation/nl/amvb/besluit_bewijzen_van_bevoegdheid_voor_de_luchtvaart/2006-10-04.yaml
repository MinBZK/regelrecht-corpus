  - number: '21'
    text: |-
      1 De bewijzen van bevoegdheid, bevoegdverklaringen en de daarbij behorende bevoegdheden, bedoeld in de
      [artikelen 17][ref1] en [18][ref2], worden voor de volgende termijnen afgegeven:

      a. bewijzen van bevoegdheid: voor onbepaalde tijd;

      b. algemene bevoegdverklaringen: voor een termijn van 12 maanden;

      c. bijzondere bevoegdverklaringen: voor een termijn van 36 maanden.

      2 De termijnen, bedoeld in het eerste lid, onderdelen b en c, worden met eenzelfde termijn verlengd indien de
      houder overeenkomstig de op grond van [artikel 5.16, tweede lid, van de wet][ref3] door Onze Minister goed te
      keuren regels heeft aangetoond dat hij de daartoe vereiste kennis, bedrevenheid en ervaring heeft behouden.

      3 Het bewijs van bevoegdheid voor leerling-luchtverkeersleider vervalt zodra aan de houder daarvan een bewijs van
      bevoegdheid voor luchtverkeersleider met ten minste één algemene bevoegdverklaring is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5.16
