  - number: '14'
    text: |-
      1 Als bewijs, dat wordt voldaan aan de eisen met betrekking tot de nodige kennis en bedrevenheid voor een bewijs
      van bevoegdheid als bedoeld in [artikel 2][ref1] of een bevoegdverklaring als bedoeld in [artikel 3][ref2]
      of [5][ref3], wordt met goed gevolg een examen afgelegd.

      2 Het examen kan bestaan uit een theorie- en een praktijkgedeelte.

      3 In afwijking van het eerste lid, wordt voor de RPA-L en voor de daarbij behorende bevoegdverklaringen aan de
      eisen, bedoeld in het eerste lid voldaan door het met goed gevolg afronden van een opleiding aan een door Onze
      Minister daartoe erkende opleidingsinstelling dan wel aan een door de bevoegde autoriteit van een door Onze
      Minister bij regeling aangewezen staat daartoe erkende opleidingsinstelling.

      4 Onze Minister kan nadere regels geven met betrekking tot het examen.

      5 Voor het verkrijgen van de algemene bevoegdverklaring LPE kan aan de eisen als bedoeld in het eerste lid tevens
      worden voldaan door het met goed gevolg afronden van een opleiding aan een door Onze Minister daartoe erkende
      opleidingsinstelling dan wel aan een door de bevoegde autoriteit van een door Onze Minister bij regeling aangewezen
      staat daartoe erkende opleidingsinstelling.


