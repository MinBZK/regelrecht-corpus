  - number: '15'
    text: |-
      1 Onze Minister stelt het resultaat van het theorie- en praktijkexamen vast.

      2 Onze Minister stelt nadere regels met betrekking tot de autorisatie en benoeming van examinatoren. Deze regels
      omvatten in ieder geval bepalingen betreffende:

      a. de bij de aanvraag in te dienen gegevens;

      b. de afgifte, geldigheidsduur, verlenging en intrekking;

      c. de eisen inzake kennis, bedrevenheid en ervaring;

      d. het onderscheid in bevoegdheden naar soort autorisatie;

      e. de bezoldiging van benoemde examinatoren.

      3 In afwijking van het eerste lid stelt het Centraal Bureau Rijvaardigheidsbewijzen het resultaat van het
      schriftelijke theorie-examen vast.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel15
  - number: '16'
    text: |-
      1 Onze Minister stelt een examenreglement vast.

      2 In dit reglement kunnen bepalingen opgenomen worden omtrent:

      a. de wijze van examinering;

      b. de duur van examens en de wijze waarop examens worden uitgevoerd;

      c. de vaststelling van de examenopgaven voor het schriftelijke gedeelte;

      d. de groepen van vakken waarin examens kunnen worden afgelegd;

      e. het gebruik van STD's ten behoeve van examens;

      f. de aanmelding voor examens;

      g. de toelating tot examens;

      h. geheimhouding;

      i. het toezicht op theorie- en praktijkexamens;

      j. de uitsluiting van een examinandus van examens;

      k. de ordemaatregelen tijdens examens;

      l. de beoordeling van examens;

      m. de vaststelling van het resultaat van examens;

      n. de kennisgeving van de uitslag;

      o. de mogelijkheid van herexamens;

      p. het afnemen van praktijkexamens;

      q. de termijn waarbinnen examens moeten zijn afgelegd;

      r. de uitsluiting van examens;

      s. frequentie van het examen.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel16
  - number: '17'
    text: Onze Minister kan de bewijzen van bevoegdheid ASO onderscheidenlijk FISO afgeven.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel17
  - number: '18'
    text: |-
      1 Aan een houder van een ASO worden, nadat deze de desbetreffende opleiding met goed resultaat heeft gevolgd, één
      of meer van de volgende bevoegdverklaringen afgegeven:

      a. *ADR* (Aerodrome), die de bevoegdheid geeft tot het verstrekken van luchthaveninformatie aan luchthavenverkeer;

      b. *TOW* (Towing), die de bevoegdheid geeft tot het verstrekken van dienstberichten aan sleepvoertuigen niet
      zijnde luchtvaartuigen op het landingsterrein van een gecontroleerde luchthaven onder verantwoordelijkheid van
      een luchtverkeersleider;

      c. *CLD* (Clearance Delivery), die de bevoegdheid geeft tot het doorgeven van een klaring en informatie in opdracht
      en onder verantwoordelijkheid van een luchtverkeersleider;

      d. *DIS* (Display), die de bevoegdheid geeft tot het verstrekken van informatie aan luchtverkeer dat deelneemt aan
      een luchtvaartvertoning overeenkomstig de bij regeling van Onze Minister gestelde regels;

      e. *OFS* (Offshore), die de bevoegdheid geeft tot het verstrekken van informatie aan luchtverkeer op en nabij een
      offshore productieplatform.

      2 Aan een houder van een ASO worden, nadat deze de desbetreffende opleiding met goed resultaat heeft gevolgd, één
      of meer van de volgende aantekeningen, die van overeenkomstige toepassing zijn als de gelijkluidende aantekeningen
      in artikel 4 van verordening (EU) nr. 2015/340, bij het bewijs van bevoegdheid afgegeven:

      a. *Assessor,* waarmee wordt aangegeven dat de houder bevoegd is om praktische vaardigheden van
      (leerling-)bedieners van een luchtvaartstation te beoordelen;

      b. *OJTI* (On the Job Training Instructor endorsement), waarmee wordt aangegeven dat de houder bevoegd is om
      opleiding op de werkplek en opleiding met synthetische opleidingstoestellen te geven;

      c. *aantekening betreffende de eenheid* (unit endorsement), de op het bewijs van bevoegdheid aangebrachte en
      daarvan deel uitmakende machtiging die de ICAO-locatie-indicator of de naam van de luchthaven weergeeft;

      d. *aantekening betreffende de taalvaardigheid* (language proficiency endorsement), de op het bewijs van
      bevoegdheid aangebrachte en daarvan deel uitmakende machtiging die de taalvaardigheid van de houder aangeeft.

      3 Een bevoegdverklaring als bedoeld in het eerste lid is slechts geldig indien daaraan de in het tweede lid,
      onderdeel c, bedoelde aantekening betreffende de eenheid, is verbonden.

      4 Een aantekening als bedoeld in het tweede lid, onderdelen a en b, is slechts geldig in combinatie met het bewijs
      van bevoegdheid en de bevoegdverklaring waarvan zij deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel18
  - number: 18a
    text: |-
      1 Aan een houder van een FISO worden, nadat deze de desbetreffende opleiding met goed resultaat heeft gevolgd, één
      of meer van de volgende bevoegdverklaringen afgegeven:

      a. *ADR* (Aerodrome), die de bevoegdheid geeft tot het verstrekken van advies en inlichtingen aan luchthavenverkeer
      en luchtverkeer binnen een hiervoor aangewezen deel van het luchtruim dan wel het verstrekken van alarmering;

      b. *AER* (Area), die de bevoegdheid geeft tot het verstrekken van advies en inlichtingen aan luchtverkeer dan wel
      tot het verstrekken van alarmeringen.

      2 Aan de houder van een bevoegdverklaring AER wordt, nadat deze de desbetreffende opleiding met goed resultaat
      heeft gevolgd, de aantekening (rating endorsement) RAD afgegeven, die de bevoegdheid geeft tot het verstrekken van
      advies en inlichtingen met behulp van surveillance apparatuur.

      3 Aan de houder van een FISO worden, nadat deze de desbetreffende opleiding met goed resultaat heeft gevolgd, één
      of meer van de volgende aantekeningen, die van overeenkomstige toepassing zijn als de gelijkluidende aantekeningen
      in artikel 4 van verordening (EU) nr. 2015/340, bij het bewijs van bevoegdheid afgegeven:

      a. *Assessor,* die aangeeft dat de houder bevoegd is om praktische vaardigheden van leerling-
      vluchtinformatieverstrekkers of vluchtinformatieverstrekkers te beoordelen;

      b. *OJTI* (On the Job Training Instructor endorsement), die aangeeft dat de houder bevoegd is om opleiding op de
      werkplek en opleiding met synthetische opleidingstoestellen te geven;

      c. *STDI* (Synthetic Training Device Instructor endorsement), die aangeeft dat de houder bevoegd is om opleiding
      met synthetische opleidingstoestellen te geven;

      d. *aantekening betreffende de eenheid* (unit endorsement), de op het bewijs van bevoegdheid aangebrachte en
      daarvan deel uitmakende machtiging die de ICAO-locatie-indicator weergeeft;

      e. *aantekening betreffende de taalvaardigheid* (language proficiency endorsement), de op het bewijs van
      bevoegdheid aangebrachte en daarvan deel uitmakende machtiging die de taalvaardigheid van de houder aangeeft.

      4 Een bevoegdverklaring als bedoeld in het eerste lid en de aantekening bij de bevoegdverklaring bedoeld in het
      tweede lid zijn slechts geldig indien daaraan de in het derde lid, onderdeel d, bedoelde aantekening betreffende de
      eenheid is verbonden.

      5 Een aantekening als bedoeld in het derde lid onderdeel a, b en c, is slechts geldig in combinatie met het bewijs
      van bevoegdheid en de bevoegdverklaring waarvan zij deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel18a
  - number: '19'
    text: |-
      De minimumleeftijd voor de afgifte van een bewijs van bevoegdheid als bedoeld in [artikel 17][ref1] bedraagt 18
      jaar.


