  - number: '4'
    text: |-
      1 De RT, de VLOS en de EVLOS wordt afgegeven voor onbepaalde duur.

      2 De RFI en de FI(RPA) worden afgegeven voor de duur van ten hoogste drie jaren.

      3 De geldigheidsduur wordt, indien de bevoegdverklaring niet is afgegeven op de laatste dag van de maand van
      afgifte, berekend vanaf de eerste dag van de maand, volgend op de maand van afgifte.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister stelt bijzondere bevoegdverklaringen naar type, klasse of werkzaamheden vast en de duur waarvoor
      zij worden afgegeven.

      2 Onze Minister kan beperkingen vaststellen waaronder bijzondere bevoegdverklaringen worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel5
  - number: '6'
    text: |-
      1 De leeftijd, welke moet zijn bereikt om voor een bewijs van bevoegdheid in aanmerking te komen, bedraagt voor:

      a. RPL: 16 jaar;

      b. RPA-L: 18 jaar.

      2 De leeftijd, welke moet zijn bereikt om voor een instructeursbevoegdverklaring in aanmerking te komen, bedraagt
      18 jaar.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel6
  - number: '8'
    text: |-
      1 Met inachtneming van de [artikelen 2][ref1], [3][ref2] en [6][ref3] wordt het bewijs van bevoegdheid of de
      bevoegdverklaring op aanvraag afgegeven aan een ieder die:

      a. voldoet aan de bij ministeriële regeling vast te stellen vereisten inzake kennis, bedrevenheid, ervaring en
      opleiding, en,

      b. in het bezit is van een geldige medische verklaring klasse II.

      2 In afwijking van het eerste lid, onderdeel b, volstaat, in plaats van een geldige medische verklaring klasse II,
      een geldige medische verklaring voor het LAPL voor het verkrijgen van:

      a. het bewijs van bevoegdheid, bedoeld in [artikel 2, eerste lid, onderdeel b][ref4];

      b. het bewijs van bevoegdheid RPL voor het besturen van Micro Light Aeroplanes, Micro Light Helicopters, lichte
      gyrokopters, historische gemotoriseerde vliegtuigen of amateur vliegtuigbouwproducten tot een gewicht van 2000
      kilogram.

      3 De aanvraag tot afgifte van een bewijs van bevoegdheid of bevoegdverklaring wordt gedaan op een daartoe door Onze
      Minister verstrekt aanvraagformulier.

      4 Onze Minister stelt de tarieven vast, volgens welke de kosten, bedoeld in
      [artikel 2.3, zesde lid, onderdeel h, van de wet][ref5], worden vergoed.


