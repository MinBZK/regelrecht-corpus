  - number: '21'
    text: |-
      1 Een FISO of een ASO en de bevoegdverklaring of aantekening bij de bevoegdverklaring wordt voor onbepaalde tijd
      afgegeven.

      2 Een aantekening bij het bewijs van bevoegdheid als bedoeld in
      [artikel 18, tweede lid, onderdelen a, b of c][ref1], respectievelijk
      [artikel 18a, derde lid, onderdelen a, b, c of d][ref2], wordt voor een termijn van 3 jaar verstrekt.

      3 Bij regeling van Onze Minister worden nadere regels gesteld voor de afgifte van de in het tweede lid bedoelde
      aantekeningen.

      4 De termijnen, bedoeld in het tweede lid, worden met eenzelfde termijn verlengd indien de houder voldoet aan bij
      ministeriële regeling te stellen regels inzake kennis, bedrevenheid en ervaring.

      5 Een aantekening bij het bewijs van bevoegdheid als bedoeld in [artikel 18, tweede lid, onderdeel d][ref3], wordt
      verstrekt voor een termijn van:

      a. 3 jaar, indien de aantekening taalvaardigheidsniveau 4 betreft;

      b. 6 jaar, indien de aantekening taalvaardigheidsniveau 5 betreft; of

      c. onbeperkte duur, indien de aantekening taalvaardigheidsniveau 6 betreft.

      6 Een aantekening bij het bewijs van bevoegdheid als bedoeld in [artikel 18a, derde lid, onderdeel e][ref4], wordt
      verstrekt voor een termijn van:

      a. 3 jaar, indien de aantekening taalvaardigheidsniveau 4 betreft;

      b. 6 jaar, indien de aantekening taalvaardigheidsniveau 5 betreft; of

      c. 9 jaar, indien de aantekening taalvaardigheidsniveau 6 betreft.

      7 Met betrekking tot de afgifte, vernieuwing en verlenging van de in het vijfde en zesde lid bedoelde aantekeningen
      is verordening (EU) nr. 2015/340, bijlage I, artikel ATCO.B.035, onderdelen b tot en met e, van overeenkomstige
      toepassing.


