  - number: '22'
    text: |-
      De vereisten inzake kennis, bedrevenheid en ervaring voor het verkrijgen van een FISO zijn niet van toepassing op
      personen die maximaal 24 maanden voor de datum van aanvraag in het bezit waren van:

      a. een geldig bewijs van bevoegdheid voor luchtverkeersleider;

      b. een geldig bewijs van bevoegdheid voor luchtverkeersleider of FISO afgegeven door Onze Minister van Defensie
      overeenkomstig [artikel 10.2, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.2
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10.2'
  - number: 22a
    text: |-
      De vereisten inzake kennis, bedrevenheid en ervaring voor het verkrijgen van een ASO zijn niet van toepassing op
      personen die maximaal 24 maanden voor de datum van de aanvraag in het bezit waren van:

      a. een geldig FISO met bevoegdverklaring ADR of een geldig bewijs van bevoegdheid voor luchtverkeersleider met de
      bevoegdverklaring ADI of ADV overeenkomstig verordening (EU) nr. 2015/340;

      b. een geldig bewijs van bevoegdheid voor luchtverkeersleider, FISO of ASO afgegeven door Onze Minister van
      Defensie overeenkomstig [artikel 10.2, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.2
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10.2'
  - number: 22b
    text: |-
      De vereisten inzake kennis, bedrevenheid en ervaring voor het verkrijgen van een FISO of een ASO met één of
      meer bevoegdverklaringen en aantekeningen, met uitzondering van de aantekeningen assessor en OJTI, zijn niet van
      toepassing op houders van gelijksoortige bewijzen van bevoegdheid, bevoegdverklaringen en aantekeningen, afgegeven
      krachtens dit besluit vóór 1 januari 2018, die hun geldigheid uitsluitend hebben verloren door het verstrijken
      van de geldigheidsduur, indien zij beschikken over bij regeling van Onze Minister voor te schrijven eisen voor het
      handhaven van vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel22b
  - number: 22c
    text: |-
      De vereisten inzake kennis, bedrevenheid en ervaring voor het verkrijgen van een ASO met één of meer
      bevoegdverklaringen en aantekeningen zijn niet van toepassing op degenen die vóór 1 januari 2018 de opleiding
      luchthaveninformatieverstrekker met goed gevolg hebben voltooid, zonder houder te zijn van het desbetreffende
      bewijs van bevoegdheid, indien zij beschikken over bij regeling van Onze Minister voor te schrijven vergelijkbare
      vereisten inzake kennis, bedrevenheid en ervaring.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel22c
  - number: 22d
    text: |-
      1 Onze Minister kan de aanvrager van een ASO, een FISO , of van bevoegdverklaringen of aantekeningen daarop, die
      de desbetreffende examens en beoordelingen met succes heeft afgelegd, toestaan om gedurende ten hoogste acht weken
      voorafgaand aan de afgifte daarvan de aan dat document verbonden rechten uit te oefenen.

      2 Bij regeling van Onze Minister worden regels gesteld met betrekking tot de wijze waarop de in het eerste lid
      bedoelde toestemming wordt verleend.

      3 Het eerste lid is niet van toepassing op tijdelijke machtigingen als bedoeld in [artikel 24a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel24a
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel22d
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: 24a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '23'
    text: |-
      De [artikelen 2.1, eerste lid][ref1], voor zover dit betrekking heeft op het bedienen van een grondstation
      of mobiel station in de luchtvaartmobiele band, waarvoor een vergunning is vereist als bedoeld in
      [artikel 3.13 van de Telecommunicatiewet][ref2], en [artikel 2.2, tweede lid, van de wet][ref3] zijn niet van
      toepassing op houders van een ASO voor het voeren van OPC.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3.13
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2.1'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3.13'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '2.2'
  - number: '24'
    text: |-
      1 Onze Minister kan een bewijs van bevoegdheid vernieuwen, indien het is verloren of indien het onleesbaar,
      beschadigd of anderszins onbruikbaar is geworden.

      2 Indien een bewijs van bevoegdheid wegens verlies is vernieuwd en het verloren bewijs wordt teruggevonden, zendt
      de houder het teruggevonden bewijs zo spoedig mogelijk aan Onze Minister.

      3 Indien een bewijs van bevoegdheid anders dan wegens verlies is vernieuwd, kan Onze Minister de houder opdragen
      het oorspronkelijke bewijs binnen een week na de datum van verzending van het nieuwe bewijs aan Onze Minister te
      zenden.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel24
  - number: 24a
    text: |-
      1 Voor het verzorgen van ASO- en FISO-opleidingen is een door Onze Minister goed te keuren opleidingenplan
      noodzakelijk.

      2 Bij regeling van Onze Minister worden nadere regels gesteld voor de goedkeuring van het in het eerste lid
      bedoelde opleidingenplan, die in ieder geval betrekking hebben op:

      a. eisen inzake de inhoud van de opleiding;

      b. de in het opleidingenplan op te nemen gegevens;

      c. de geldigheidsduur en wijze van de goedkeuring;

      d. de onderdelen waaruit een opleidingenplan kan bestaan;

      e. de kennis- en vaardigheidsbeoordeling.

      3 Bij regeling van Onze Minister worden regels gesteld voor de afgifte van een tijdelijke machtiging als
      instructeur voor opleidingen op de werkplek of als assessor.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel24a
  - number: 24b
    text: |-
      Onze Minister geeft regels met betrekking tot de kwalificatie van STD’s.
      [Artikel 13, derde lid, tweede volzin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel13
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 24c
    text: |-
      1 Met betrekking tot de certificering van FISO-opleidingen zijn de voorschriften bedoeld in verordening (EU)
      nr. 2015/340, Bijlage III, Deel ATCO.OR, subdelen A tot en met D, van overeenkomstige toepassing.

      2 [Artikel 2.2, eerste lid, onderdeel c, onder 1°, van de wet][ref1] is niet van toepassing op de afgifte
      van een ASO als bedoeld in [artikel 17][ref2] indien de afgifte geschiedt na een positieve kennis- en
      vaardigheidsbeoordeling van de aanvrager op basis van een opleidingenplan dat voldoet aan de krachtens
      [artikel 24a, tweede lid][ref3], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0010629#Artikel24a
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2.2'
      - id: ref2
        bwb_id: BWBR0010629
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0010629
        artikel: 24a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 24d
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de goedkeuring van beoordelingsprocedures
      waarmee de taalvaardigheid kan worden aangetoond alsmede met betrekking tot de eisen aan organisaties die de
      taalvaardigheid beoordelen.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel24d
  - number: '30'
    text: |-
      1 Ten behoeve van een door Onze Minister, al dan niet onder beperkingen, af te geven medische verklaring wordt
      degene, die zulk een verklaring heeft aangevraagd, gekeurd door een geneeskundige of door een geneeskundige
      instantie.

      2 Onze Minister kan in ieder geval regels geven met betrekking tot:

      a. de aanvraag van de keuring;

      b. de oproep voor en de aanmelding bij de keuring;

      c. de ten behoeve van de afgifte van een medische verklaring te verrichten keuring;

      d. de anamnese;

      e. de kennisgeving van de uitslag;

      f. de eisen van medische geschiktheid en de beperkingen waaronder de medische verklaring kan worden afgegeven;

      g. de eisen waaraan een geneeskundige of een geneeskundige instantie ten behoeve van hun autorisatie moeten
      voldoen;

      h. de verplichtingen van de houder van de medische verklaring of van een geneeskundige of een geneeskundige
      instantie;

      i. de erkenning van in het buitenland verrichte keuringen.

      3 Onze Minister stelt de tarieven vast, volgens welke de kosten, als bedoeld in
      [artikel 2.3, zesde lid, onderdeel h][ref1] en [artikel 2.4, derde lid, onderdeel g, van de wet][ref2] worden
      vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2.3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2.4'
  - number: '31'
    text: |-
      1 De geldigheidsduur van een medische verklaring als bedoeld in [artikel 8][ref1] wordt bepaald overeenkomstig
      verordening (EU) nr. 1178/2011.

      2 De geldigheidsduur van de medische verklaring klasse 3, bedoeld in bijlage IV van verordening (EU) nr. 2015/340,
      voor houders van een FISO bedraagt ten hoogste 24 maanden voor houders tot 40 jaar en 12 maanden voor houders van
      40 jaar en ouder.

      3 Onze Minister stelt nadere regels voor de verlenging van een medische verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel8
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '32'
    text: |-
      1 Ten behoeve van de beslissing op bezwaar tegen een beschikking met betrekking tot de medische verklaring of
      certificaat kan Onze Minister een Adviescommissie instellen.

      2 Bij elke volgende keuring wordt rekening gehouden met het advies van de Adviescommissie.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel32
  - number: '33'
    text: |-
      1 De Adviescommissie bestaat uit ten minste vijf leden, waaronder een voorzitter, die door Onze Minister worden
      benoemd voor een periode van 3 jaar en ontslagen.

      2 Van de leden van de Adviescommissie wordt ten minste één lid benoemd uit de kring van deskundigen met betrekking
      tot medische certificaten klasse 1, ten minste één lid uit de kring van deskundigen met betrekking tot medische
      certificaten klasse 2 en ten minste één lid uit de kring van deskundigen met betrekking tot medische verklaringen
      klasse 3.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel33
  - number: '34'
    text: |-
      1 Onze Minister doet een ontvangen bezwaarschrift binnen een week aan de Adviescommissie toekomen.

      2 Onze Minister kan regels stellen met betrekking tot door de Adviescommissie in acht te nemen procedures.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel34
  - number: '35'
    text: |-
      Zolang in een vacature in de Adviescommissie niet is voorzien, vormen de overblijvende leden de Adviescommissie met
      de bevoegdheden van de volledige Adviescommissie.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel35
  - number: '36'
    text: |-
      1 Indien een bewijs van bevoegdheid of een bevoegdverklaring is geschorst op één van de in
      [artikel 2.5, eerste lid, onderdeel a of b van de wet][ref1] genoemde gronden, kan Onze Minister bepalen dat de
      houder zich opnieuw aan een door Onze Minister te bepalen examen onderwerpt. Het examen kan beperkt blijven tot één
      of enkele onderdelen.

      2 Indien een bewijs van bevoegdheid of een bevoegdverklaring is geschorst op grond van artikel 2.5, eerste lid,
      onderdeel c, wordt de schorsing opgeheven bij opnieuw gebleken medische geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2.5'
  - number: 36a
    text: |-
      De hoogte en de wijze van betaling van de vergoeding voor de kosten voor handelingen in het kader van de uitvoering
      van internationale overeenkomsten gesloten door de Europese Unie en internationale overeenkomsten gesloten door
      Nederland met derde landen, voor zover dit besluit hier niet reeds in voorziet, wordt bij ministeriële regeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel36a
  - number: 36b
    text: |-
      Onze Minister stelt de tarieven vast, volgens welke de kosten, bedoeld in
      [artikel 2.9, vierde lid, van de wet][ref1] worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2.9'
  - number: '37'
    text: |-
      In afwijking van [artikel 17][ref1] kan een luchtvaartstation tot 1 januari 2019 eveneens worden bediend,
      onderscheidenlijk vluchtinformatie eveneens worden verstrekt, door de houder van een geldig bewijs van
      bevoegdheid voor luchthaveninformatieverstrekker onderscheidenlijk een geldig bewijs van bevoegdheid voor
      vluchtinformatieverstrekker dat is afgegeven vóór 1 januari 2018.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel17
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '42'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen, onderdelen daarvan, bewijzen van bevoegdheid, algemene of bijzondere bevoegdverklaringen
      verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel42
  - number: '43'
    text: 'Dit besluit wordt aangehaald als: Besluit bewijzen van bevoegdheid voor de luchtvaart.'
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel43
