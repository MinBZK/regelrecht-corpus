  - number: 1b
    text: |-
      Van overeenkomstige toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, zijn:

      a. de basisverordening, voor zover het Hoofdstuk III, Deel II en Afdeling V betreft,

      b. [verordening (EU) nr. 1321/2014](32014R1321),

      c. verordening (EU) nr. 2015/340, en

      d. verordening (EU) nr. 1178/2011,

      met dien verstande dat bij ministeriële regeling nadere regels kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel1b
  - number: 1c
    text: |-
      De aanvraag voor de afgifte van een bewijs van bevoegdheid of gerelateerde certificaten als bedoeld in hetgeen
      bij of krachtens de basisverordening is bepaald wordt ingediend bij Onze Minister, tenzij bij of krachtens de
      basisverordening of de wet een andere instantie is aangewezen.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel1c
  - number: '2'
    text: |-
      1 Onze Minister kan de volgende bewijzen van bevoegdheid afgeven:

      a. RPL, dat de bevoegdheid geeft, niet tegen vergoeding, op te treden als bestuurder van een luchtvaartuig, dat
      gecertificeerd is of luchtwaardig is bevonden voor maximaal 4 inzittenden, tijdens vluchten zonder baat, onder de
      volgende beperkingen:

      1°. alleen tijdens VFR-vluchten;

      2°. alleen tijdens de daglichtperiode als bedoeld in [artikel 1 van het Besluit luchtverkeer 2014][ref1], en

      3°. niet met passagiers, tenzij de houder ten minste tien uur ervaring heeft als gezagvoerder van een luchtvaartuig
      van dezelfde categorie of met dezelfde bijzondere bevoegdverklaring en de houder in de voorafgaande negentig dagen
      ten minste drie starts en drie landingen heeft uitgevoerd als gezagvoerder van een luchtvaartuig van dezelfde
      categorie en met dezelfde bijzondere bevoegdverklaring;

      b. RPA-L, dat de bevoegdheid geeft op te treden als bestuurder van een RPA waarvan de totale massa niet meer dan
      150 kg bedraagt en dat gecertificeerd is of luchtwaardig is bevonden.

      2 Een bewijs van bevoegdheid kan worden afgegeven voor de volgende categorieën luchtvaartuigen:

      a. RPL: vliegtuigen (A), helikopters (H), luchtschepen (AS), gyrokopters (GC) en andere categorieën (OA);

      b. RPA-L: vliegtuigen (A) en helikopters (H) en andere categorieën (OA).

      3 Een RPA-L wordt slechts afgegeven, indien ten minste één algemene bevoegdverklaring voor het type operatie,
      één bijzondere bevoegdverklaring voor werkzaamheden en één bijzondere bevoegdverklaring voor klasse daarop is
      weergegeven.

      4 De bevoegdheden die voortvloeien uit een bewijs van bevoegdheid zijn steeds beperkt tot die typen of klassen
      luchtvaartuigen of tot die werkzaamheden waarvoor een bijzondere bevoegdverklaring is afgegeven

      5 Een bewijs van bevoegdheid wordt afgegeven voor onbepaalde duur.


      [ref1]: https://wetten.overheid.nl/BWBR0035899#Artikel1
