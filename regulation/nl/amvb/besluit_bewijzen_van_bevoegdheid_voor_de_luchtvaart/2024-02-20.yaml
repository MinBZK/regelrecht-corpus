  - number: '3'
    text: |-
      1 Aan houders van een RPL kan, onder de krachtens [artikel 2.2 van de wet][ref1] genoemde bijzondere
      bevoegdverklaringen, al dan niet onder beperkingen naar soort vlucht of ervaring, één of meer van de volgende
      algemene bevoegdverklaringen worden afgegeven:

      a. RT, dat de bevoegdheid geeft om radiocontact met de luchtverkeersdienst, of met bestuurders van andere
      luchtvaartuigen te onderhouden;

      b. RFI, dat de bevoegdheid geeft om vliegonderricht te geven voor de afgifte van een:

      1. RPL, of

      2. bijzondere bevoegdverklaring in een RPL;

      c. LPE met de bevoegdheden en voorwaarden, bedoeld in verordening (EU) nr. 1178/2011.

      2 De bevoegdheden die voortvloeien uit een RT zijn steeds beperkt tot het overeenkomende bewijs van bevoegdheid van
      de houder.

      3 De bevoegdheden die voortvloeien uit een algemene bevoegdverklaring, met uitzondering van de RT, zijn steeds
      beperkt tot die categorie luchtvaartuigen waarvoor de bevoegdverklaring is afgegeven.

      4 Aan houders van een RPA-L kan, onder de krachtens [artikel 2.2 van de wet][ref2] genoemde bijzondere
      bevoegdverklaringen, al dan niet onder beperkingen naar soort vlucht of ervaring, één of meer van de volgende
      algemene bevoegdverklaringen worden afgegeven:

      a. VLOS, dat de bevoegdheid geeft op te treden als bestuurder van een RPA waarvan de totale massa niet meer dan
      150 kg bedraagt, tijdens operaties binnen zichtafstand van de bestuurder onder de volgende beperkingen:

      1°. alleen tijdens VFR-vluchten;

      2°. alleen tijdens de daglichtperiode, bedoeld in [artikel 1 van het Besluit luchtverkeer 2014][ref3].

      b. EVLOS, dat de bevoegdheid geeft op te treden als bestuurder van een RPA waarvan de totale massa niet meer dan
      150 kg bedraagt, tijdens operaties binnen zichtafstand van de bestuurder of een RPA waarnemer, onder de volgende
      beperkingen:

      1°. alleen tijdens VFR-vluchten;

      2°. alleen tijdens de daglichtperiode, bedoeld in [artikel 1 van het Besluit luchtverkeer 2014][ref4].

      c. RT, dat de bevoegdheid geeft om radiocontact met de luchtverkeersdienst of met bestuurders van andere
      luchtvaartuigen te onderhouden;

      d. nachtvliegen (RPA), dat de bevoegdheid geeft om VFR-vluchten met een RPA buiten de daglichtperiode uit te
      voeren, onder de volgende beperkingen:

      1°. alleen met een toestel dat luchtwaardig is bevonden voor de uitvoering van vluchten buiten de daglichtperiode;

      2°. alleen voor vluchten waarvan de uitvoering niet is verboden bij of krachtens het
      [Besluit luchtverkeer 2014][ref5] dan wel andere regelgeving.

      e. FI (RPA), dat de bevoegdheid geeft om vliegonderricht te geven voor de afgifte van:

      1°. een RPA-L;

      2°. een algemene of bijzondere bevoegdverklaring in een RPA-L.

      f. LPE, met de bevoegdheden en voorwaarden bedoeld in verordening (EU) nr. 1178/2011.

      5 De beperking, bedoeld in het vierde lid, onderdeel a, sub 2, en onderdeel b, sub 2, geldt niet indien op het
      RPA-L de algemene bevoegdverklaring nachtvliegen (RPA) is weergegeven en deze bevoegdheid, gelet op de daaraan
      verbonden beperkingen, mag worden uitgeoefend.


