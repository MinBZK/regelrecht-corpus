  - number: '12'
    text: |-
      Onze Minister kan nadere regels geven met betrekking tot het afgeven van bewijzen van gelijkstelling. Deze regels
      omvatten in ieder geval bepalingen betreffende eisen inzake kennis, bedrevenheid, ervaring, leeftijd en medische
      geschiktheid.
    url: https://wetten.overheid.nl/BWBR0010629/2024-02-20#Artikel12
  - number: '13'
    text: |-
      1 Onze Minister geeft nadere regels met betrekking tot de erkenning en registratie van een opleidingsinstelling.
      Deze regels omvatten in ieder geval bepalingen betreffende:

      a. de bij de aanvraag in te dienen gegevens;

      b. eisen inzake de opleiding;

      c. de afgifte, geldigheidsduur, intrekking en wijziging.

      2 Onze Minister stelt de tarieven vast, volgens welke de kosten, bedoeld in
      [artikel 2.9, vierde lid, van de wet][ref1] worden vergoed.

      3 Onze Minister geeft nadere regels met betrekking tot de kwalificatie van STD's. Deze regels omvatten in ieder
      geval bepalingen betreffende:

      a. de bij de aanvraag in te dienen gegevens;

      b. het onderscheid in eisen naar niveau;

      c. de afgifte, geldigheidsduur, verlenging, schorsing, intrekking en wijziging.

      4 Onze Minister kan entiteiten aanwijzen, als bedoeld in de volgende onderdelen van de Bijlage bij de
      uitvoeringsverordening (EU) nr. 2019/947:

      a. Deel A, UAS.OPEN.020 UAS-vluchtuitvoeringen in subcategorie A1, sub 4, onder b;

      b. Deel A, UAS.OPEN.030 UAS-vluchtuitvoeringen in subcategorie A2, sub 2;

      c. Deel B, UAS.SPEC.050 verantwoordelijkheden van de UAS-exploitant, sub 1, onder d. iii;

      d. Aanhangsel 1, hoofdstuk I, UAS.STS-01.020 UAS-vluchtuitvoeringen in STS-01, sub 1, onder e. i;

      e. Aanhangsel 1, hoofdstuk II, UAS.STS-02.020 UAS-vluchtuitvoeringen in STS-02, sub 9, onder b.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de aanwijzing van entiteiten als
      bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.9
