  - number: '20'
    text: |-
      1 Met inachtneming van [artikel 19][ref1] wordt een FISO op aanvraag verleend aan een ieder die:

      a. in het bezit is van een geldige medische verklaring, klasse 3, als bedoeld in bijlage IV van verordening (EU)
      nr. 2015/340,

      b. voldoet aan bij ministeriële regeling te stellen eisen inzake kennis, bedrevenheid en ervaring, en

      c. overeenkomstig Bijlage 1 bij het op 7 december 1944 te Chicago gesloten Verdrag inzake de Internationale
      Burgerluchtvaart (Trb. 1973, 109) voldoet aan de vereisten inzake het vermogen tot beheersing van de Engelse taal
      op de niveaus 4, 5 of 6.

      2 Het eerste lid, onderdelen b en c, zijn van overeenkomstige toepassing op het verlenen van een ASO alsmede op
      het verlenen van bevoegdverklaringen en aantekeningen als bedoeld in de [artikelen 18][ref2] en [18a][ref3], met
      uitzondering van de bevoegdverklaring TOW waarop onderdeel c van het eerste lid niet van toepassing is.

      3 Onze Minister stelt de tarieven vast, volgens welke de kosten, bedoeld in
      [artikel 2.3, zesde lid, onderdeel h, van de wet][ref4], worden vergoed.


