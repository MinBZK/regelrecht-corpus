  - number: '2.1'
    text: |-
      Ter voorkoming van de verspreiding van smetstof door dieren die niet worden gehouden, zijn de
      [artikelen 15, vierde lid][ref1], [17][ref2], [19][ref3], [21][ref4], [22, eerste lid][ref5],
      [24, eerste lid][ref6] en [116 van de wet][ref7] van overeenkomstige toepassing op niet gehouden dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
