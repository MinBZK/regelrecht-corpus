  - number: '2.2'
    text: |-
      De verplichting uit [artikel 19, eerste lid, van de wet][ref1] geldt in het kader van dit besluit voor iemand
      die weet of redelijkerwijs kan vermoeden dat een niet gehouden dier verschijnselen vertoont van een besmettelijke
      dierziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel19
    url: https://wetten.overheid.nl/BWBR0006815/2008-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '19'
  - number: '2.3'
    text: |-
      Iemand die weet of redelijkerwijs kan vermoeden dat een niet gehouden dier verschijnselen vertoont van een
      besmettelijke dierziekte is verplicht aan een dierenarts of aan een in [artikel 114, tweede lid, van de wet][ref1]
      bedoelde ambtenaar naar waarheid alle inlichtingen te verstrekken en alle medewerking te verlenen, welke dezen
      redelijkerwijs voor de vervulling van hun taak nodig hebben en al datgene te doen wat in zijn vermogen ligt om de
      aard van de ziekte zo spoedig mogelijk te doen vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0006815/2008-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: '3'
    text: |-
      Ter voorkoming van de verspreiding van smetstof door dieren die niet worden gehouden kunnen door Onze Minister
      nadere regelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006815/2008-08-01#Artikel3
  - number: '4'
    text: 'Dit besluit wordt aangehaald als: Besluit niet gehouden dieren.'
    url: https://wetten.overheid.nl/BWBR0006815/2008-08-01#Artikel4
  - number: '5'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006815/2008-08-01#Artikel5
