  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 17 maart 1994, no. J. 944716,
    Directie Juridische en Bedrijfsorganisatorische Zaken;

    Gelet op Richtlijn nr. 80/217/EEG van de Raad van de Europese Gemeenschappen van 22 januari 1980 tot vaststelling
    van gemeenschappelijke maatregelen ter bestrijding van klassieke varkenspest (PbEG L 47); Richtlijn nr. 85/511/EEG
    van de Raad van de Europese Gemeenschappen van 18 november 1985 tot vaststelling van gemeenschappelijke maatregelen
    ter bestrijding van mond- en klauwzeer (PbEG L 315); Richtlijn nr. 92/35/EEG van de Raad van de Europese
    Gemeenschappen van 29 april 1992 tot vaststelling van controlevoorschriften en van maatregelen ter bestrijding
    van paardepest (PbEG L 157); Richtlijn nr. 92/119/EEG van de Raad van de Europese Gemeenschappen van 17 december
    1992 tot vaststelling van algemene communautaire maatregelen voor de bestrijding van bepaalde dierziekten en van
    specifieke maatregelen ten aanzien van vesiculaire varkensziekte (PbEG 1993, L 62) en Richtlijn nr. 93/53 EEG van
    de Raad van de Europese Gemeenschappen van 24 juni 1993 tot vaststelling van minimale communautaire maatregelen
    voor de bestrijding van bepaalde visziekten (PbEG L 175);

    Gelet op de artikelen 102 en 111 van de Gezondheids- en welzijnswet voor dieren;

    Gezien het advies van de Raad voor dierenaangelegenheden (d.d. 21 december 1993), het Produktschap voor Pluimvee en
    Eieren (d.d. 20 december 1993), het Produktschap voor Vis en Visprodukten (d.d. 5 januari 1994), het Bedrijfschap
    voor de Pluimveehandel en -industrie (d.d. 20 december 1993) en de Jachtraad (d.d. 2 februari 1994);

    De Raad van State gehoord (advies van 20 mei 1994, No. W11.94.0164);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 1 juli 1994, no. J.
    9410303, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006815/2008-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder wet: [Gezondheids- en welzijnswet voor dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662
