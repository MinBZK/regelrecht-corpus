---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: luchthavenindelingbesluit_schiphol
regulatory_layer: AMVB
publication_date: '2025-06-27'
valid_from: '2025-07-01'
bwb_id: BWBR0014329
url: https://wetten.overheid.nl/BWBR0014329/2025-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 12 juli 2002, kenmerk HDJZ/LUV/2002-1856, gedaan
    mede namens Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op artikel 8.4 van de Wet luchtvaart;

    De Raad van State gehoord (advies van 12 september 2002, kenmerk W09.02.0303/V en W09.02.0305/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 21 november 2002, kenmerk HDJZ/
    LUV/2002-2735, uitgebracht mede namens de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en
    Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#ArtikelAanhef
articles:
  - number: 1.1.1.1
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel1.1.1
  - number: 1.1.1.1.a
    text: |-
      *wet:* [Wet luchtvaart][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: 1.1.1.1.b
    text: |-
      *geluidgevoelig gebouw:* geluidgevoelig gebouw als bedoeld in
      [bijlage I bij het Besluit kwaliteit leefomgeving][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041313
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0041313
  - number: 1.1.1.1.c
    text: |-
      *zeer kwetsbaar gebouw:* gebouw als bedoeld in [bijlage VI, onder E, bij het Besluit kwaliteit leefomgeving][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041313
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0041313
  - number: 1.1.1.1.d
    text: |-
      *kwetsbaar gebouw of kwetsbare locatie:* gebouw of locatie als bedoeld in
      [bijlage VI, onder C en D, bij het Besluit kwaliteit leefomgeving][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041313
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0041313
  - number: 1.1.1.1.e
    text: |-
      *beperkt kwetsbaar gebouw of beperkt kwetsbare locatie:* gebouw of locatie als bedoeld in
      [bijlage VI, onder A en B, bij het Besluit kwaliteit leefomgeving][ref1] en gebouwen of locaties met een hoge
      infrastructurele waarde, zoals een telefoon- of een elektriciteitscentrale, voor zover die gebouwen of locaties
      wegens de gevolgen van een vliegtuigongeval bescherming verdienen tegen de gevolgen van dat ongeval;


      [ref1]: https://wetten.overheid.nl/BWBR0041313
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0041313
  - number: 1.1.1.1.f
    text: |-
      *bestaand stedelijk gebied:* stedelijk gebied als bedoeld in
      [bijlage I bij het Besluit kwaliteit leefomgeving][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041313
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0041313
  - number: 1.1.1.1.g
    text: '*laserinstallatie:* laserinstallatie met een lichtintensiteit hoger dan 5 μW/cm2;'
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel1.1.1
  - number: 1.1.1.1.h
    text: |-
      *omgevingsvergunning voor een aanlegactiviteit:* omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder b, van de Wet algemene bepalingen omgevingsrecht][ref1] dan wel
      omgevingsvergunning als bedoeld in [artikel 5.1, eerste lid, aanhef en onder a, van de Omgevingswet][ref2] voor een
      omgevingsplanactiviteit bestaande uit het uitvoeren van een werk, geen bouwwerk zijnde, of van werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 1.1.1.1.i
    text: |-
      *omgevingsvergunning voor het bouwen:* omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref1] dan wel
      omgevingsvergunning als bedoeld in [artikel 5.1, eerste lid, aanhef en onder a, van de Omgevingswet][ref2] voor een
      omgevingsplanactiviteit bestaande uit een bouwactiviteit.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 1.1.1.2
    text: 'In dit besluit wordt onder «gebouw» of «woning» tevens verstaan: woonboot of woonwagen.'
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel1.1.1
  - number: 1.2.1.1
    text: |-
      Het luchthavengebied is het gebied dat als zodanig is aangewezen op de kaart in [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 1.2.1.2
    text: |-
      Het beperkingengebied is het gebied dat als zodanig is aangewezen op de kaart in [bijlage 2][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.1.1
    text: |-
      De locatie die bestemd is voor het banenstelsel van de luchthaven is als zodanig aangewezen op de kaart in
      [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1
    text: |-
      Op de locaties die op de kaart in [bijlage 3][ref1] bij dit besluit met nummer 1 zijn aangewezen, zijn met het
      oog op externe veiligheid geen zeer kwetsbare, kwetsbare of beperkt kwetsbare gebouwen of kwetsbare of beperkt
      kwetsbare locaties toegestaan, behoudens bestaand gebruik van gebouwen niet zijnde woningen.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1a
    text: |-
      Op de locaties die op de kaart in [bijlage 3][ref1] bij dit besluit met nummer 2 zijn aangewezen, zijn met het oog
      op geluidbelasting geen geluidgevoelige gebouwen toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1a
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1b.1
    text: |-
      Op de locaties die op de kaart in [bijlage 3][ref1] bij dit besluit met nummer 3 zijn aangewezen, zijn met het
      oog op externe veiligheid geen zeer kwetsbare, kwetsbare of beperkt kwetsbare gebouwen of kwetsbare of beperkt
      kwetsbare locaties toegestaan, behoudens bestaand gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1b
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1b.2
    text: |-
      In afwijking van het eerste lid zijn nieuwe beperkt kwetsbare gebouwen of locaties met een kantoor- of
      industriefunctie toegestaan, mits het aantal werknemers dat er verblijft niet meer dan 22 per hectare bedraagt.
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1b
  - number: 2.2.1b.3
    text: |-
      In afwijking van het eerste lid is eveneens herstructurering van een gebied met gebouwen of locaties met een
      kantoor- of industriefunctie toegestaan, indien dit niet leidt tot een toename van het aantal werknemers per
      hectare binnen dit gebied.
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1b
  - number: 2.2.1c
    text: |-
      Op de locaties die op de kaart in [bijlage 3][ref1] bij dit besluit met nummer 4 zijn aangewezen, zijn met het oog
      op geluidbelasting geen geluidgevoelige gebouwen toegestaan, behoudens:


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1c
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1c.a
    text: bestaand gebruik van een geluidgevoelig gebouw;
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1c
  - number: 2.2.1c.b
    text: |-
      toevoeging binnen bestaand stedelijk gebied van niet meer dan 25 woningen per bouwplan of binnen lintbebouwing van
      niet meer dan 3 woningen per bouwplan;
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1c
  - number: 2.2.1c.c
    text: |-
      een geluidgevoelig gebouw ter vervanging van een bestaand geluidgevoelig gebouw, mits van gelijke aard en gelijke
      schaal en onder de voorwaarde dat het te vervangen gebouw wordt verwijderd of op de locatie van het te vervangen
      gebouw geen geluidgevoelig gebouw wordt toegelaten;
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1c
  - number: 2.2.1c.d
    text: |-
      herstructurering van een bestaand stedelijk gebied, indien dit niet leidt tot een toename met meer dan 25 woningen
      en indien dit niet leidt tot een toename van de capaciteit van andere geluidgevoelige gebouwen binnen dit gebied;
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1c
  - number: 2.2.1c.e
    text: nieuwbouw van een bedrijfswoning, voor zover de noodzaak daarvan is aangetoond.
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1c
  - number: 2.2.1d.1
    text: |-
      Op de locaties die op de kaart in [bijlage 3][ref1] bij dit besluit met nummer 5 zijn aangewezen, zijn buiten
      bestaand stedelijk gebied geen nieuwe woningbouwlocaties toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1d
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1d.2
    text: |-
      Voor de locaties die op de kaart in [bijlage 3][ref1] bij dit besluit met nummer 5 zijn aangewezen, motiveren
      gemeenten in de toelichting op het omgevingsplan of in de onderbouwing van de omgevingsvergunning de wijze waarop
      rekening is gehouden met de mogelijke gevolgen van een vliegtuigongeval met meerdere slachtoffers op de grond als
      gevolg van ruimtelijke ontwikkelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1d
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1e.1
    text: |-
      Van bestaand gebruik als bedoeld in de [artikelen 2.2.1][ref1], [2.2.1b][ref2] en [2.2.1c][ref3] is sprake
      indien op 1 januari 2018 op de desbetreffende locatie een gebouw of object rechtmatig aanwezig is of een
      omgevingsvergunning is verleend voor het bouwen van een gebouw of object op de desbetreffende locatie, mits binnen
      zes maanden na die datum een begin met de werkzaamheden is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0014329#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014329#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0014329#Artikel2
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1e
    references:
      - id: ref1
        bwb_id: BWBR0014329
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0014329
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0014329
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.1e.2
    text: |-
      Van bestaand gebruik als bedoeld in de [artikelen 2.2.1b][ref1] en [2.2.1c][ref2] is eveneens sprake bij herbouw
      van een gebouw of object dat op grond van het op de in het eerste lid bedoelde datum geldende omgevingsplan
      rechtmatig aanwezig is of is geweest maximaal 10 jaar voorafgaand aan de datum waarop een omgevingsvergunning is
      aangevraagd voor de herbouw van een gebouw of object op dezelfde locatie, met gelijke schaal en aard.


      [ref1]: https://wetten.overheid.nl/BWBR0014329#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014329#Artikel2
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1e
    references:
      - id: ref1
        bwb_id: BWBR0014329
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0014329
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.1e.3
    text: |-
      Onder bestaand stedelijk gebied als bedoeld in [artikel 2.2.1d][ref1] wordt eveneens begrepen de aan bestaand
      stedelijke gebied toegevoegde woningbouwmogelijkheden binnen de voormalige bebouwingscontour van de streekplannen
      Zuid-Holland-West van 19 februari 2003 en Zuid-Holland-Oost van 12 november 2003, waarvan de locatie geometrisch
      is begrensd en aangewezen op «Kaart 13 20 Ke-contour Schiphol» bij de Verordening Ruimte 2016 van de provincie
      Zuid-Holland, en de in het streekplan Noord-Holland Zuid van 17 februari 2003 opgenomen verstedelijkingslocatie
      Hoofddorp Zuidrand.


      [ref1]: https://wetten.overheid.nl/BWBR0014329#Artikel2
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1e
    references:
      - id: ref1
        bwb_id: BWBR0014329
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.1e.4
    text: |-
      Ten aanzien van degene die op 20 februari 2003 rechtmatig gebruiker is van een woning op de locaties die op de
      kaarten in [bijlage 3][ref1] van dit besluit met de nummers 1 en 2 zijn aangewezen, kan beëindiging van dit gebruik
      niet worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1e
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1e.5
    text: |-
      In afwijking van de [artikelen 2.2.1 tot en met 2.2.1d][ref1], zijn daarin bedoelde gebouwen of objecten
      eveneens toegestaan voor zover dit in overeenstemming is met een verklaring van geen bezwaar als bedoeld in
      [artikel 8.9 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014329#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.1e
    references:
      - id: ref1
        bwb_id: BWBR0014329
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
  - number: 2.2.2.1
    text: |-
      Op de locaties die zijn aangewezen op de kaart in [bijlage 4][ref1] bij dit besluit zijn geen objecten toegestaan
      die hoger zijn dan de in die bijlage aangegeven maximale waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.2.2
    text: |-
      Op de locaties die zijn aangewezen op de kaart in [bijlage 4][ref1] bij dit besluit zijn geen bomen of struiken
      toegestaan die hoger zijn dan de in die bijlage aangegeven maximale waarden indien de Inspectie Leefomgeving en
      Transport op schriftelijk verzoek van de exploitant van de luchthaven Schiphol of Luchtverkeersleiding Nederland
      beoordeelt dat deze een belemmering vormen voor de veiligheid van het luchtverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.2.3
    text: 'In afwijking van het eerste lid is een object hoger dan de desbetreffende maximale waarde toegestaan indien:'
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2
  - number: 2.2.2.3.a
    text: |-
      het object opgericht of geplaatst is overeenkomstig een omgevingsvergunning voor het bouwen of een
      omgevingsvergunning voor een aanlegactiviteit, of voor het object een dergelijke omgevingsvergunning is verleend
      en de omgevingsvergunning is verleend voor 1 januari 2015, mits binnen twee jaar na die datum een begin met de
      werkzaamheden is gemaakt, of
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2
  - number: 2.2.2.3.b
    text: |-
      het betreft herbouw, verbouw of vervangende nieuwbouw van objecten als bedoeld onder a, mits de hoogte en het
      totale volume van het oorspronkelijke object niet worden overschreden.
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2
  - number: 2.2.2.4
    text: |-
      In afwijking van het eerste lid is een object dat hoger is dan de desbetreffende maximale waarde eveneens
      toegestaan voor zover dit in overeenstemming is met een verklaring van geen bezwaar als bedoeld in
      [artikel 8.9 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
  - number: 2.2.2.5
    text: |-
      In afwijking van het eerste lid is een object dat hoger is dan de desbetreffende maximale waarde eveneens
      toegestaan indien dit onderdeel is van een plan genoemd in de bij dit besluit gevoegde [bijlage 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.2.6
    text: |-
      Op de in het eerste lid bedoelde locaties is het verboden zonder of in afwijking van een omgevingsvergunning
      werken, geen bouwwerken zijnde, of werkzaamheden uit te voeren, voor zover deze werken of werkzaamheden reiken tot
      een hoogte boven de in dat lid bedoelde maximale waarden.
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2
  - number: 2.2.2a.1
    text: |-
      Op de locaties die zijn aangewezen op de kaart in [bijlage 4a][ref1] bij dit besluit zijn objecten die hoger zijn
      dan de in die bijlage aangegeven maximale waarde toegestaan mits uit een advies van de Inspectie Leefomgeving en
      Transport blijkt dat het object geen belemmering vormt voor het functioneren van radarapparatuur met het oog op
      veilig luchtverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2a
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.2a.2
    text: |-
      Op de locaties die zijn aangewezen op de kaart in [bijlage 4a][ref1] bij dit besluit zijn geen bomen of struiken
      toegestaan die hoger zijn dan de in die bijlage aangegeven maximale waarden indien de Inspectie Leefomgeving en
      Transport op schriftelijk verzoek van de exploitant van de luchthaven Schiphol of Luchtverkeersleiding Nederland
      beoordeelt dat deze een belemmering vormen voor het functioneren van radarapparatuur met het oog op veilig
      luchtverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2a
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.2a.3
    text: 'In afwijking van het eerste lid is een object dat hoger is dan de desbetreffende maximale waarde toegestaan indien:'
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2a
  - number: 2.2.2a.3.a
    text: |-
      het object opgericht of geplaatst is overeenkomstig een omgevingsvergunning voor het bouwen of een
      omgevingsvergunning voor een aanlegactiviteit, of voor het object een dergelijke omgevingsvergunning is verleend
      en de omgevingsvergunning is verleend voor 1 januari 2015, mits binnen twee jaar na die datum een begin met de
      werkzaamheden is gemaakt, of
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2a
  - number: 2.2.2a.3.b
    text: |-
      het betreft herbouw, verbouw of vervangende nieuwbouw van objecten als bedoeld onder a, mits de hoogte en het
      totale volume van het oorspronkelijke object niet wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2a
  - number: 2.2.2a.4
    text: |-
      In afwijking van het eerste lid is een object dat hoger is dan de desbetreffende maximale waarde eveneens
      toegestaan indien dit onderdeel is van een plan genoemd in:
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2a
  - number: 2.2.2a.4.a
    text: |-
      de bij dit besluit gevoegde [bijlage 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2a
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.2a.4.b
    text: |-
      de bij dit besluit gevoegde [bijlage 8a][ref1], onder de in die bijlage genoemde voorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2a
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.2a.5
    text: |-
      Op de in het eerste lid bedoelde locaties is het verboden zonder of in afwijking van een omgevingsvergunning
      werken, geen bouwwerken zijnde, of werkzaamheden uit te voeren, voor zover deze werken of werkzaamheden reiken tot
      een hoogte boven de in dat lid bedoelde maximale waarden.
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.2a
  - number: 2.2.3.1
    text: |-
      Op de locaties die zijn aangewezen op de kaart in [bijlage 5][ref1] bij dit besluit is het verrichten of toelaten
      van een activiteit binnen de volgende categorieën niet toegestaan:


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.3.1.a
    text: industrie in de voedingssector met extramurale opslag of overslag;
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.3
  - number: 2.2.3.1.b
    text: viskwekerijen met extramurale bassins;
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.3
  - number: 2.2.3.1.c
    text: opslag of verwerking van afvalstoffen met extramurale opslag of verwerking;
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.3
  - number: 2.2.3.1.d
    text: natuurreservaten en vogelreservaten;
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.3
  - number: 2.2.3.1.e
    text: moerasgebieden en oppervlaktewateren groter dan 3 hectare.
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.3
  - number: 2.2.3.2
    text: |-
      In afwijking van het eerste lid is het verrichten of toelaten van een activiteit toegestaan voor zover deze
      activiteit werd toegelaten op 20 februari 2003.
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.3
  - number: 2.2.3.3
    text: |-
      In afwijking van het eerste lid is het verrichten of toelaten van een activiteit eveneens toegestaan voor zover
      deze in overeenstemming is met een verklaring van geen bezwaar als bedoeld in [artikel 8.9 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
  - number: 2.2.4.1
    text: |-
      Op de locaties die zijn aangewezen op de kaart in [bijlage 6][ref1] bij dit besluit is geen vaste laserinstallatie
      toegestaan en geen windturbine die met de tiphoogte steekt door een vlak met een maatgevende toetshoogte zoals
      opgenomen in de in [bijlage 4][ref2] opgenomen kaart, met een ashoogte van meer dan 35 meter, of in geval van
      plaatsing op een gebouw, met een tiphoogte van meer dan 5 meter dan wel meer dan 35 meter voor gebouw en tiphoogte
      tezamen.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
      [ref2]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0014329
      - id: ref2
        bwb_id: BWBR0014329
  - number: 2.2.4.2
    text: |-
      Op de locaties die zijn aangewezen op de kaart in [bijlage 6][ref1] bij dit besluit, is een windturbine toegestaan
      die met de tiphoogte steekt door het vlak met de toetshoogte voor radar zoals opgenomen in de in [bijlage 4a][ref2]
      opgenomen kaart mits uit een advies van de Inspectie Leefomgeving en Transport blijkt dat de windturbine geen
      belemmering vormt voor het functioneren van radarapparatuur met het oog op veilig luchtverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
      [ref2]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0014329
      - id: ref2
        bwb_id: BWBR0014329
  - number: 2.2.4.3
    text: |-
      In afwijking van het eerste lid en tweede lid is een vaste laserinstallatie of een windturbine, bedoeld in die
      leden, toegestaan voor zover:
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.4
  - number: 2.2.4.3.a
    text: |-
      deze rechtmatig aanwezig is op 1 januari 2015 of daarvoor voor 1 januari 2015 een omgevingsvergunning voor het
      bouwen is verleend, mits binnen twee jaar na die datum een begin met de werkzaamheden is gemaakt, of
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.4
  - number: 2.2.4.3.b
    text: |-
      het betreft vervanging door een nieuwe windturbine met gelijkblijvende of lagere hoogtes en met gelijkblijvende of
      verminderde verstoring van het radarbeeld.
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.4
  - number: 2.2.4.4
    text: |-
      In afwijking van het eerste lid is een vaste laserinstallatie of een windturbine, bedoeld in dat lid,
      toegestaan voor zover dit in overeenstemming is met een verklaring van geen bezwaar als bedoeld in
      [artikel 8.9 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
  - number: 3.1.1
    text: Een omgevingsplan wordt in overeenstemming gebracht met dit besluit bij eerstvolgende wijziging van dat plan.
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Het recht zoals dat gold onmiddellijk voor 1 januari 2018 blijft van toepassing ten aanzien van een verklaring van
      geen bezwaar als bedoeld in [artikel 8.9 van de wet][ref1] waarvoor de aanvraag is ingediend voor dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
  - number: 3.1.3
    text: |-
      Onze Minister van Infrastructuur en Milieu voert voor 11 november 2018 een evaluatie uit van de doeltreffendheid en
      doelmatigheid van [artikel 2.2.2a][ref1] in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0014329#Artikel2
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '3.2'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel3.2
  - number: '3.3'
    text: 'Dit besluit wordt aangehaald als: Luchthavenindelingbesluit Schiphol.'
    url: https://wetten.overheid.nl/BWBR0014329/2025-07-01#Artikel3.3
