preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 12 juli 2002, kenmerk HDJZ/LUV/2002-1856, gedaan
    mede namens Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op artikel 8.4 van de Wet luchtvaart;

    De Raad van State gehoord (advies van 12 september 2002, kenmerk W09.02.0303/V en W09.02.0305/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 21 november 2002, kenmerk HDJZ/
    LUV/2002-2735, uitgebracht mede namens de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en
    Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#ArtikelAanhef
articles:
  - number: 1.1.1.1
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel1.1.1
  - number: 1.1.1.1.a
    text: |-
      de wet: de[ Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: 1.1.1.1.b
    text: |-
      gebouwen met een gezondheidszorgfunctie: hetgeen daaronder wordt verstaan in
      [artikel 1.1 van het Bouwbesluit 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 1.1.1.1.c
    text: |-
      gebouwen met een onderwijsfunctie: hetgeen daaronder wordt verstaan in [artikel 1.1 van het Bouwbesluit 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 1.1.1.1.d
    text: |-
      gebouwen met een kantoorfunctie: hetgeen daaronder wordt verstaan in [artikel 1.1 van het Bouwbesluit 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 1.1.1.2
    text: 'In dit besluit wordt onder «gebouw» of «woning» tevens verstaan: woonboot.'
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel1.1.1
  - number: 1.2.1.1
    text: |-
      Het luchthavengebied is het gebied dat als zodanig is aangewezen op de kaart in [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 1.2.1.2
    text: |-
      Het beperkingengebied is het gebied dat als zodanig is aangewezen op de kaart in [bijlage 2][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.1.1
    text: |-
      De gronden die bestemd zijn voor het banenstelsel van de luchthaven zijn als zodanig aangewezen op de kaart in
      [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1.1
    text: |-
      Op de gronden die op de kaarten in [bijlage 3A][ref1] bij dit besluit met nummer 1 zijn aangewezen, zijn geen
      gebouwen toegestaan, behoudens bestaand gebruik van gebouwen met een kantoorfunctie of van bedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1.2
    text: |-
      Op de gronden die op de kaarten in [bijlage 3A][ref1] bij dit besluit met nummer 2 zijn aangewezen, zijn geen
      gebouwen toegestaan, behoudens bestaand gebruik van gebouwen met een kantoorfunctie of van bedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1.3
    text: |-
      Op de gronden die op de kaarten in [bijlage 3B][ref1] bij dit besluit met nummer 3 zijn aangewezen, zijn geen
      gebouwen toegestaan, behoudens bestaand gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1.4
    text: |-
      Op de gronden die op de kaarten in [bijlage 3B][ref1] bij dit besluit met nummer 4 zijn aangewezen, zijn geen
      woningen, woonwagens, gebouwen met een onderwijsfunctie of gebouwen met een gezondheidszorgfunctie toegestaan,
      behoudens bestaand gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1.5
    text: |-
      Van bestaand gebruik als bedoeld in het eerste tot en met vierde lid, is sprake indien op de datum van
      inwerkingtreding van dit besluit op de desbetreffende plaats een gebouw rechtmatig aanwezig is en overeenkomstig
      de bestemming wordt gebruikt, of voor de datum van inwerkingtreding van dit besluit een bouwvergunning is verleend
      voor dit gebouw op de desbetreffende plaats, mits binnen zes maanden na die datum een begin met de werkzaamheden
      is gemaakt.
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.1
  - number: 2.2.1.6
    text: |-
      Ten aanzien van degene die op de datum van inwerkingtreding van dit besluit rechtmatig gebruiker is van een woning
      of een woonwagen op de gronden die op de kaarten in [bijlage 3A][ref1] van dit besluit met de nummers 1 en 2 zijn
      aangewezen, kan indien sprake is van bestaand gebruik als bedoeld in het vijfde lid, beëindiging van dit gebruik
      niet worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1.7
    text: |-
      In afwijking van het eerste tot en met vierde lid, zijn daarin bedoelde gebouwen eveneens toegestaan voor zover dit
      in overeenstemming is met een verklaring van geen bezwaar als bedoeld in [artikel 8.9 van de wet](onbekend).
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.1
  - number: 2.2.2.1
    text: |-
      Op de gronden die zijn aangewezen op de kaarten in [bijlage 4][ref1] bij dit besluit zijn geen objecten toegestaan
      die hoger zijn dan de in die bijlage aangegeven maximale waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.2.2
    text: 'In afwijking van het eerste lid is een object dat hoger is dan de desbetreffende maximale waarde toegestaan indien:'
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.2
  - number: 2.2.2.2.a
    text: |-
      het object opgericht of geplaatst is overeenkomstig een bouwvergunning of een aanlegvergunning of voor het object
      een dergelijke vergunning is verleend en
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.2
  - number: 2.2.2.2.b
    text: de vergunning is verleend voor de datum van inwerkingtreding van dit besluit.
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.2
  - number: 2.2.2.3
    text: |-
      In afwijking van het eerste lid is een object dat hoger is dan de desbetreffende maximale waarde eveneens
      toegestaan voor zover dit in overeenstemming is met een verklaring van geen bezwaar als bedoeld in
      [artikel 8.9 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
  - number: 2.2.2.4
    text: |-
      Op de in het eerste lid bedoelde gronden is het verboden zonder of in afwijking van een omgevingsvergunning werken,
      geen bouwwerken zijnde, of werkzaamheden uit te voeren, voor zover deze werken of werkzaamheden reiken tot een
      hoogte boven de in dat lid bedoelde maximale waarden.
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.2
  - number: 2.2.3.1
    text: |-
      Op de gronden die zijn aangewezen op de kaart in [bijlage 5][ref1] bij dit besluit is een grondgebruik of een
      bestemming binnen de volgende categorieën niet toegestaan:


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.3.1.a
    text: industrie in de voedingssector met extramurale opslag of overslag;
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.3
  - number: 2.2.3.1.b
    text: viskwekerijen met extramurale bassins;
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.3
  - number: 2.2.3.1.c
    text: opslag of verwerking van afvalstoffen met extramurale opslag of verwerking;
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.3
  - number: 2.2.3.1.d
    text: natuurreservaten en vogelreservaten;
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.3
  - number: 2.2.3.1.e
    text: moerasgebieden en oppervlaktewateren groter dan 3 hectare.
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.3
  - number: 2.2.3.2
    text: |-
      In afwijking van het eerste lid is dit grondgebruik of deze bestemming toegestaan voor zover dit gebruik of deze
      bestemming rechtmatig is op de datum van inwerkingtreding van dit besluit.
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.3
  - number: 2.2.3.3
    text: |-
      In afwijking van het eerste lid is dit grondgebruik of deze bestemming eveneens toegestaan voor zover dit in
      overeenstemming is met een verklaring van geen bezwaar als bedoeld in [artikel 8.9 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
  - number: 3.1.1
    text: |-
      Uiterlijk drie jaren na de inwerkingtreding van dit besluit wordt door Onze Minister van Verkeer en Waterstaat een
      milieueffectrapport opgesteld.
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel3.1
  - number: 3.1.2
    text: |-
      Het rapport is gericht op een vergelijking van het beschermingsniveau, zoals dat wordt geboden door dit
      besluit, met het beschermingsniveau zoals dat voor de inwerkingtreding van [artikel VI van de wet van 27 juni
      2002 houdende wijziging van de Wet luchtvaart inzake de inrichting en het gebruik van de luchthaven Schiphol
      (Stb. 374)](onbekend) ten aanzien van het vijfbanenstelsel is beschreven in de PKB Schiphol en Omgeving.
      [Artikel IX van die wet][ref1] wordt hierbij in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013815#ArtikelIX
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0013815
        artikel: IX
  - number: 3.1.3
    text: |-
      Voor zover uit het rapport blijkt dat bij de vaststelling van dit besluit het bepaalde in de
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________________ niet in acht is genomen, bevordert Onze Minister
      van Verkeer en Waterstaat in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer dat zulks alsnog geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0013815#ArtikelX
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0013815
        artikel: X
  - number: '3.2'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel3.2
  - number: '3.3'
    text: 'Dit besluit wordt aangehaald als: Luchthavenindelingbesluit Schiphol.'
    url: https://wetten.overheid.nl/BWBR0014329/2012-09-22#Artikel3.3
