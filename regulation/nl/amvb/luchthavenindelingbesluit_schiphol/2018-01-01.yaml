  - number: 2.2.2a
    text: |-
      1 Op de gronden die zijn aangewezen op de kaart in [bijlage 4A][ref1] bij dit besluit zijn objecten die hoger zijn
      dan de in die bijlage aangegeven maximale waarde toegestaan mits uit een advies van de Inspectie Leefomgeving en
      Transport blijkt dat het object geen belemmering vormt voor het functioneren van radarapparatuur met het oog op
      veilig luchtverkeer.

      2 Op de gronden die zijn aangewezen op de kaart in [bijlage 4A][ref2] bij dit besluit zijn geen bomen of struiken
      toegestaan die hoger zijn dan de in die bijlage aangegeven maximale waarden indien de Inspectie Leefomgeving en
      Transport op schriftelijk verzoek van de exploitant van de luchthaven Schiphol of Luchtverkeersleiding Nederland
      beoordeelt dat deze een belemmering vormen voor het functioneren van radarapparatuur met het oog op veilig
      luchtverkeer.

      3 In afwijking van het eerste lid is een object dat hoger is dan de desbetreffende maximale waarde toegestaan
      indien:

      a. het object opgericht of geplaatst is overeenkomstig een bouwvergunning of een aanlegvergunning dan wel een
      omgevingsvergunning, of voor het object een dergelijke vergunning is verleend en de vergunning is verleend voor 1
      januari 2015, mits binnen twee jaar na die datum een begin met de werkzaamheden is gemaakt, of

      b. het betreft herbouw, verbouw of vervangende nieuwbouw van objecten als bedoeld onder a, mits de hoogte en het
      totale volume van het oorspronkelijke object niet wordt overschreden.

      4 In afwijking van het eerste lid is een object dat hoger is dan de desbetreffende maximale waarde eveneens
      toegestaan indien dit onderdeel is van een plan genoemd in:

      a. de bij dit besluit gevoegde [bijlage 8][ref3];

      b. de bij dit besluit gevoegde [bijlage 8a][ref4], onder de in die bijlage genoemde voorwaarde.

      5 Op de in het eerste lid bedoelde gronden is het verboden zonder of in afwijking van een omgevingsvergunning
      werken, geen bouwwerken zijnde, of werkzaamheden uit te voeren, voor zover deze werken of werkzaamheden reiken tot
      een hoogte boven de in dat lid bedoelde maximale waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
