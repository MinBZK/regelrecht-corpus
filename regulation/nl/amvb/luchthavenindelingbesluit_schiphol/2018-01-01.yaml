  - number: 2.2.1e
    text: |-
      1 Van bestaand gebruik als bedoeld in de [artikelen 2.2.1][ref1], [2.2.1b][ref2] en [2.2.1c][ref3] is sprake
      indien op 1 januari 2018 op de desbetreffende plaats een gebouw of object rechtmatig aanwezig is of een
      omgevingsvergunning is verleend voor het bouwen van een gebouw of object op de desbetreffende plaats, mits binnen
      zes maanden na die datum een begin met de werkzaamheden is gemaakt.

      2 Van bestaand gebruik als bedoeld in de [artikelen 2.2.1b][ref4] en [2.2.1c][ref5] is eveneens sprake bij herbouw
      van een gebouw of object dat op grond van het op de in het eerste lid bedoelde datum geldende bestemmingsplan
      rechtmatig aanwezig is of is geweest maximaal 10 jaar voorafgaand aan de datum waarop een omgevingsvergunning is
      aangevraagd voor de herbouw van een gebouw of object op dezelfde plaats, met gelijke schaal en aard.

      3 Onder bestaand stedelijk gebied als bedoeld in [artikel 2.2.1d][ref6] wordt eveneens begrepen de aan bestaand
      stedelijke gebied toegevoegde woningbouwmogelijkheden binnen de voormalige bebouwingscontour van de streekplannen
      Zuid-Holland-West van 19 februari 2003 en Zuid-Holland-Oost van 12 november 2003, waarvan de plaats geometrisch
      is bepaald en verbeeld op «Kaart 13 20 Ke-contour Schiphol» bij de Verordening Ruimte 2016 van de provincie
      Zuid-Holland, en de in het streekplan Noord-Holland Zuid van 17 februari 2003 opgenomen verstedelijkingslocatie
      Hoofddorp Zuidrand.

      4 Ten aanzien van degene die op 20 februari 2003 rechtmatig gebruiker is van een woning op de gronden die op de
      kaarten in [bijlage 3][ref7] van dit besluit met de nummers 1 en 2 zijn aangewezen, kan beëindiging van dit gebruik
      niet worden gevergd.

      5 In afwijking van de [artikelen 2.2.1 tot en met 2.2.1d][ref8], zijn daarin bedoelde gebouwen of objecten
      eveneens toegestaan voor zover dit in overeenstemming is met een verklaring van geen bezwaar als bedoeld in
      [artikel 8.9, derde lid, van de wet][ref9].


