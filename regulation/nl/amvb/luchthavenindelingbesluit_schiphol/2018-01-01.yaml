  - number: '3.1'
    text: |-
      1 Een bestemmingsplan wordt in overeenstemming gebracht met dit besluit bij eerstvolgende wijziging van dat plan.

      2 Het recht zoals dat gold onmiddellijk voor 1 januari 2018 blijft van toepassing ten aanzien van een verklaring
      van geen bezwaar als bedoeld in [artikel 8.9, derde lid, van de wet][ref1] waarvoor de aanvraag is ingediend voor
      dat tijdstip.

      3 Onze Minister van Infrastructuur en Milieu voert voor 11 november 2018 een evaluatie uit van de doeltreffendheid
      en doelmatigheid van [artikel 2.2.2a][ref2] in de praktijk.


