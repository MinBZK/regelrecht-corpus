  - number: 2.1.1
    text: |-
      De gronden die bestemd zijn voor het banenstelsel van de luchthaven zijn als zodanig aangewezen op de kaart in
      [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2018-01-01#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1
    text: |-
      Op de gronden die op de kaart in [bijlage 3][ref1] bij dit besluit met nummer 1 zijn aangewezen, zijn met het
      oog op externe veiligheid geen kwetsbare of beperkt kwetsbare objecten toegestaan, behoudens bestaand gebruik van
      objecten niet zijnde woningen.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2018-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1a
    text: |-
      Op de gronden die op de kaart in [bijlage 3][ref1] bij dit besluit met nummer 2 zijn aangewezen, zijn met het oog
      op geluidbelasting geen geluidgevoelige gebouwen toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2018-01-01#Artikel2.2.1a
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1b
    text: |-
      1 Op de gronden die op de kaart in [bijlage 3][ref1] bij dit besluit met nummer 3 zijn aangewezen, zijn met het oog
      op externe veiligheid geen kwetsbare of beperkt kwetsbare objecten toegestaan, behoudens bestaand gebruik.

      2 In afwijking van het eerste lid zijn nieuwe beperkt kwetsbare objecten met een kantoor- of bedrijfsfunctie
      toegestaan, mits het aantal werknemers dat er verblijft niet meer dan 22 per hectare bedraagt.

      3 In afwijking van het eerste lid is eveneens herstructurering van een gebied met objecten met een kantoor- of
      bedrijfsfunctie toegestaan, indien dit niet leidt tot een toename van het aantal werknemers per hectare binnen
      dit gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2018-01-01#Artikel2.2.1b
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1c
    text: |-
      Op de gronden die op de kaart in [bijlage 3][ref1] bij dit besluit met nummer 4 zijn aangewezen, zijn met het oog
      op geluidbelasting geen geluidgevoelige gebouwen toegestaan, behoudens:

      a. bestaand gebruik van een geluidgevoelig gebouw;

      b. toevoeging binnen bestaand stedelijk gebied van niet meer dan 25 woningen per bouwplan of binnen lintbebouwing
      van niet meer dan 3 woningen per bouwplan;

      c. een geluidgevoelig gebouw ter vervanging van een bestaand geluidgevoelig gebouw, mits van gelijke aard en
      gelijke schaal en onder de voorwaarde dat het te vervangen gebouw wordt verwijderd of dat de functie en bestemming
      van het te vervangen gebouw wordt omgezet naar niet-geluidgevoelig;

      d. herstructurering van een bestaand stedelijk gebied, indien dit niet leidt tot een toename met meer dan 25
      woningen en indien dit niet leidt tot een toename van de capaciteit van andere geluidgevoelige gebouwen binnen
      dit gebied;

      e. nieuwbouw van een bedrijfswoning, voor zover de noodzaak daarvan is aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2018-01-01#Artikel2.2.1c
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1d
    text: |-
      1 Op de gronden die op de kaart in [bijlage 3][ref1] bij dit besluit met nummer 5 zijn aangewezen, zijn buiten
      bestaand stedelijk gebied geen nieuwe woningbouwlocaties toegestaan.

      2 Voor de gronden die op de kaart in [bijlage 3][ref2] bij dit besluit met nummer 5 zijn aangewezen, motiveren
      gemeenten in de toelichting op het bestemmingsplan of in de onderbouwing van de omgevingsvergunning de wijze waarop
      rekening is gehouden met de mogelijke gevolgen van een vliegtuigongeval met meerdere slachtoffers op de grond als
      gevolg van ruimtelijke ontwikkelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
      [ref2]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2018-01-01#Artikel2.2.1d
