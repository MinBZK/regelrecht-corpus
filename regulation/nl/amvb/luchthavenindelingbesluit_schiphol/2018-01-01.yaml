articles:
  - number: 1.1.1
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. *de wet:* de [Wet luchtvaart][ref1];

      b. *geluidgevoelig gebouw:* woning of ander geluidgevoelig gebouw als bedoeld in
      [artikel 1.2, eerste lid, van het Besluit geluidhinder][ref2];

      c. *kwetsbaar object:* object als bedoeld in
      [artikel 1, eerste lid, onderdeel l, van het Besluit externe veiligheid inrichtingen][ref3];

      d. *beperkt kwetsbaar object:* object als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van het Besluit externe veiligheid inrichtingen][ref4], waarbij voor de
      toepassing van dit besluit de tekst van artikel 1, eerste lid, onderdeel b, onder i, van het Besluit externe
      veiligheid inrichtingen wordt gelezen als: objecten met een hoge infrastructurele waarde, zoals een telefoon- of
      elektriciteitscentrale, voor zover die objecten wegens de gevolgen van een vliegtuigongeval bescherming verdienen
      tegen de gevolgen van dat ongeval;

      e. *bestaand stedelijk gebied:* gebied als bedoeld in
      [artikel 1.1.1, eerste lid onderdeel h, van het Besluit ruimtelijke ordening][ref5];

      f. *laserinstallatie:* laserinstallatie met een lichtintensiteit hoger dan 5 μW/cm2.

      2 In dit besluit wordt onder «gebouw» of «woning» tevens verstaan: woonboot of woonwagen.


