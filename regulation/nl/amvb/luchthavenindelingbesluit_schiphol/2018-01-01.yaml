        artikel: '8.9'
  - number: 2.2.4
    text: |-
      1 Op de gronden die zijn aangewezen op de kaart in [bijlage 6][ref1] bij dit besluit is geen vaste laserinstallatie
      toegestaan en geen windturbine die met de tiphoogte steekt door een vlak met een maatgevende toetshoogte zoals
      opgenomen in de in [bijlage 4][ref2] opgenomen kaart, met een ashoogte van meer dan 35 meter, of in geval van
      plaatsing op een gebouw, met een tiphoogte van meer dan 5 meter dan wel meer dan 35 meter voor gebouw en tiphoogte
      tezamen.

      2 Op de gronden die zijn aangewezen op de kaart in [bijlage 6][ref3] bij dit besluit, is een windturbine toegestaan
      die met de tiphoogte steekt door het vlak met de toetshoogte voor radar zoals opgenomen in de in [bijlage 4A][ref4]
      opgenomen kaart mits uit een advies van de Inspectie Leefomgeving en Transport blijkt dat de windturbine geen
      belemmering vormt voor het functioneren van radarapparatuur met het oog op veilig luchtverkeer.

      3 In afwijking van het eerste lid en tweede lid is een vaste laserinstallatie of een windturbine, bedoeld in die
      leden, toegestaan voor zover:

      a. deze rechtmatig aanwezig is op 1 januari 2015 of daarvoor voor 1 januari 2015 een bouwvergunning of een
      omgevingsvergunning is verleend, mits binnen twee jaar na die datum een begin met de werkzaamheden is gemaakt, of

      b. het betreft vervanging door een nieuwe windturbine met gelijkblijvende of lagere hoogtes en met gelijkblijvende
      of verminderde verstoring van het radarbeeld.

      4 In afwijking van het eerste lid is een vaste laserinstallatie of een windturbine, bedoeld in dat
      lid, toegestaan voor zover dit in overeenstemming is met een verklaring van geen bezwaar als bedoeld in
      [artikel 8.9 van de wet][ref5].


