        artikel: '8.9'
  - number: 2.2.3
    text: |-
      1 Op de gronden die zijn aangewezen op de kaart in [bijlage 5][ref1] bij dit besluit is een grondgebruik of een
      bestemming binnen de volgende categorieën niet toegestaan:

      a. industrie in de voedingssector met extramurale opslag of overslag;

      b. viskwekerijen met extramurale bassins;

      c. opslag of verwerking van afvalstoffen met extramurale opslag of verwerking;

      d. natuurreservaten en vogelreservaten;

      e. moerasgebieden en oppervlaktewateren groter dan 3 hectare.

      2 In afwijking van het eerste lid is dit grondgebruik of deze bestemming toegestaan voor zover dit gebruik of deze
      bestemming rechtmatig is op de datum van inwerkingtreding van dit besluit.

      3 In afwijking van het eerste lid is dit grondgebruik of deze bestemming eveneens toegestaan voor zover dit in
      overeenstemming is met een verklaring van geen bezwaar als bedoeld in [artikel 8.9 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014329
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.9
