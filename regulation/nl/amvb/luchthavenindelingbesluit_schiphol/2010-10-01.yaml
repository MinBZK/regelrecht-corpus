  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 12 juli 2002, kenmerk HDJZ/LUV/2002-1856, gedaan
    mede namens Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op artikel 8.4 van de Wet luchtvaart;

    De Raad van State gehoord (advies van 12 september 2002, kenmerk W09.02.0303/V en W09.02.0305/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 21 november 2002, kenmerk HDJZ/
    LUV/2002-2735, uitgebracht mede namens de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en
    Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014329/2010-10-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. de wet: de[ Wet luchtvaart][ref1];

      b. gebouwen met een gezondheidszorgfunctie: hetgeen daaronder wordt verstaan in [artikel 1 van het Bouwbesluit]
      (onbekend);

      c. gebouwen met een onderwijsfunctie: hetgeen daaronder wordt verstaan in [artikel 1 van het Bouwbesluit]
      (onbekend);

      d. gebouwen met een kantoorfunctie: hetgeen daaronder wordt verstaan in [artikel 1 van het Bouwbesluit](onbekend).

      2 In dit besluit wordt onder «gebouw» of «woning» tevens verstaan: woonboot.


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0014329/2010-10-01#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: 1.2.1
    text: |-
      1 Het luchthavengebied is het gebied dat als zodanig is aangewezen op de kaart in [bijlage 1][ref1] bij dit
      besluit.

      2 Het beperkingengebied is het gebied dat als zodanig is aangewezen op de kaart in [bijlage 2][ref2] bij dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
      [ref2]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2010-10-01#Artikel1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
      - id: ref2
        bwb_id: BWBR0014329
  - number: 2.1.1
    text: |-
      De gronden die bestemd zijn voor het banenstelsel van de luchthaven zijn als zodanig aangewezen op de kaart in
      [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0014329/2010-10-01#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 2.2.1
    text: |-
      1 Op de gronden die op de kaarten in [bijlage 3A][ref1] bij dit besluit met nummer 1 zijn aangewezen, zijn geen
      gebouwen toegestaan, behoudens bestaand gebruik van gebouwen met een kantoorfunctie of van bedrijven.

      2 Op de gronden die op de kaarten in [bijlage 3A][ref2] bij dit besluit met nummer 2 zijn aangewezen, zijn geen
      gebouwen toegestaan, behoudens bestaand gebruik van gebouwen met een kantoorfunctie of van bedrijven.

      3 Op de gronden die op de kaarten in [bijlage 3B][ref3] bij dit besluit met nummer 3 zijn aangewezen, zijn geen
      gebouwen toegestaan, behoudens bestaand gebruik.

      4 Op de gronden die op de kaarten in [bijlage 3B][ref4] bij dit besluit met nummer 4 zijn aangewezen, zijn geen
      woningen, woonwagens, gebouwen met een onderwijsfunctie of gebouwen met een gezondheidszorgfunctie toegestaan,
      behoudens bestaand gebruik.

      5 Van bestaand gebruik als bedoeld in het eerste tot en met vierde lid, is sprake indien op de datum van
      inwerkingtreding van dit besluit op de desbetreffende plaats een gebouw rechtmatig aanwezig is en overeenkomstig
      de bestemming wordt gebruikt, of voor de datum van inwerkingtreding van dit besluit een bouwvergunning is verleend
      voor dit gebouw op de desbetreffende plaats, mits binnen zes maanden na die datum een begin met de werkzaamheden
      is gemaakt.

      6 Ten aanzien van degene die op de datum van inwerkingtreding van dit besluit rechtmatig gebruiker is van een
      woning of een woonwagen op de gronden die op de kaarten in [bijlage 3A][ref5] van dit besluit met de nummers 1 en
      2 zijn aangewezen, kan indien sprake is van bestaand gebruik als bedoeld in het vijfde lid, beëindiging van dit
      gebruik niet worden gevergd.

      7 In afwijking van het eerste tot en met vierde lid, zijn daarin bedoelde gebouwen eveneens toegestaan voor zover
      dit in overeenstemming is met een verklaring van geen bezwaar als bedoeld in [artikel 8.9 van de wet](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0014329
