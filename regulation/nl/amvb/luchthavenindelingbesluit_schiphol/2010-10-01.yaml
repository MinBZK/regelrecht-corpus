  - number: 2.2.2
    text: |-
      1 Op de gronden die zijn aangewezen op de kaarten in [bijlage 4][ref1] bij dit besluit zijn geen objecten
      toegestaan die hoger zijn dan de in die bijlage aangegeven maximale waarden.

      2 In afwijking van het eerste lid is een object dat hoger is dan de desbetreffende maximale waarde toegestaan
      indien:

      a. het object opgericht of geplaatst is overeenkomstig een bouwvergunning of een aanlegvergunning of voor het
      object een dergelijke vergunning is verleend en

      b. de vergunning is verleend voor de datum van inwerkingtreding van dit besluit.

      3 In afwijking van het eerste lid is een object dat hoger is dan de desbetreffende maximale waarde
      eveneens toegestaan voor zover dit in overeenstemming is met een verklaring van geen bezwaar als bedoeld in
      [artikel 8.9 van de wet][ref2].

      4 Op de in het eerste lid bedoelde gronden is het verboden zonder of in afwijking van een omgevingsvergunning
      werken, geen bouwwerken zijnde, of werkzaamheden uit te voeren, voor zover deze werken of werkzaamheden reiken tot
      een hoogte boven de in dat lid bedoelde maximale waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.9
    url: https://wetten.overheid.nl/BWBR0014329/2010-10-01#Artikel2.2.2
    references:
