  - number: '8'
    text: |-
      Onze Minister geeft een beschikking op een aanvraag binnen dertien weken na afloop van de in [artikel 6][ref1]
      bedoelde periode.


      [ref1]: https://wetten.overheid.nl/BWBR0017332#Artikel6
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel8
