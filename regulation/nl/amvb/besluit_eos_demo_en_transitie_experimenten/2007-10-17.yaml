  - number: '14'
    text: |-
      1 De subsidie-ontvanger voert het project uit overeenkomstig het projectplan waarop de subsidieverlening betrekking
      heeft en voltooit het uiterlijk op het bij de subsidieverlening bepaalde tijdstip, behoudens voorafgaande
      schriftelijke ontheffing van Onze Minister voor het vertragen, essentieel wijzigen of stopzetten van het project.

      2 De subsidie-ontvanger voert het project in Nederland uit, behoudens voorafgaande schriftelijke ontheffing van
      Onze Minister voor gedeeltelijke uitvoering buiten Nederland.

      3 Aan een ontheffing als bedoeld in het eerste of tweede lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel14
  - number: '15'
    text: |-
      1 De subsidie-ontvanger voert een administratie die zodanig is ingericht, dat daaruit te allen tijde op
      eenvoudige en duidelijke wijze alle projectkosten kunnen worden afgelezen, gespecificeerd overeenkomstig de in
      [artikel 4][ref1] onderscheiden kostensoorten.

      2 De subsidie-ontvanger doet onverwijld mededeling aan Onze Minister van de indiening bij de rechtbank van een
      verzoek tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening
      van surséance van betaling aan hem of tot faillietverklaring van hem.


      [ref1]: https://wetten.overheid.nl/BWBR0017332#Artikel4
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017332
        artikel: '4'
        paragraaf: '1'
  - number: '16'
    text: |-
      De subsidie-ontvanger brengt steeds, behoudens voorafgaande schriftelijke ontheffing van Onze Minister, na afloop
      van een periode van zes maanden aan Onze Minister schriftelijk verslag uit omtrent de uitvoering van het project,
      met inbegrip van een vergelijking van die uitvoering met het projectplan en de bij de subsidieverlening vermelde
      raming van de projectkosten.
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel16
  - number: '17'
    text: |-
      1 De subsidie-ontvanger brengt desgevraagd aan Onze Minister verslag uit omtrent de toepassing van de resultaten
      van het project en draagt zorg voor de openbaarmaking en verspreiding van de resultaten van het project.

      2 De subsidie-ontvanger zal, behoudens voorafgaande schriftelijke ontheffing van Onze Minister, niet:

      a. indien hij een rechtspersoon is, de rechtspersoon ontbinden of geheel of gedeeltelijk vervreemden noch zijn
      statutaire zetel verplaatsen buiten Nederland;

      b. indien hij deelneemt in een commanditaire vennootschap, een vennootschap onder firma of maatschap, meewerken aan
      de ontbinding ervan of aan het uittreden van een of meer deelnemers ervan.

      3 Aan een ontheffing als bedoeld in het tweede lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel17
  - number: '18'
    text: |-
      Onze Minister kan bij de subsidieverlening verplichtingen opleggen met betrekking tot:

      a. het geven van bekendheid aan het project en de resultaten ervan;

      b. het verlenen van medewerking aan onder zijn zorg openbaar te maken en te verspreiden resultaten van het project;

      c. het verlenen van medewerking aan een door hem over de toepassing en de effecten van dit besluit ingesteld
      evaluatie-onderzoek, voor zover hij aan die medewerking redelijkerwijs behoefte heeft;

      d. de tenaamstelling, verwerving, instandhouding, exploitatie en vervreemding van rechten van intellectuele
      eigendom en de instandhouding van andere voor de uitvoering van het project van belang zijnde en door de uitvoering
      van het project opgedane kennis.
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel18
  - number: '19'
    text: |-
      1 Op een subsidie ter zake waarvan een beschikking tot subsidieverlening geldt kunnen op aanvraag van de subsidie-
      ontvanger door Onze Minister voorschotten worden verstrekt.

      2 Een voorschot wordt berekend naar rato van de gemaakte en betaalde projectkosten, voor zover deze nog niet eerder
      bij de verstrekking van een voorschot in aanmerking zijn genomen. In totaal zal het bedrag aan voorschotten niet
      groter zijn dan 80 procent van het bij de subsidieverlening vermelde maximale subsidiebedrag.

      3 In afwijking van het eerste en tweede lid wordt aan een ondernemer het eerste voorschot ambtshalve verstrekt
      bij de subsidieverlening: dit voorschot bedraagt 25 procent van het bij de subsidieverlening vermelde maximale
      subsidiebedrag en wordt betaald binnen twee weken nadat de ondernemer Onze Minister schriftelijk heeft medegedeeld
      dat met de uitvoering van het project is begonnen onder vermelding van de daartoe behorende activiteiten met
      het desbetreffende tijdstip van aanvang. Indien de ondernemer deelnemer is in een samenwerkingsverband vindt
      overeenkomstige toepassing plaats van de eerste volzin op de andere leden van het samenwerkingsverband.

      4 Bij de toepassing van het tweede lid wordt de opslag, bedoeld in [artikel 4, tweede lid, onderdeel b][ref1],
      geacht gemaakt en betaald te zijn voor zover de kosten waarover hij wordt berekend zijn gemaakt en betaald.

      5 Een voorschot, niet zijnde een eerste voorschot als bedoeld in het derde lid, wordt slechts verstrekt, indien het
      bedrag aan voorschot meer is dan een bij regeling van Onze Minister te bepalen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0017332#Artikel4
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017332
        artikel: '4'
        paragraaf: '1'
  - number: '20'
    text: |-
      1 Een aanvraag om een voorschot, niet zijnde een eerste voorschot als bedoeld in [artikel 19, derde lid][ref1],
      wordt ingediend gelijktijdig met het uitbrengen van een verslag als bedoeld in [artikel 16][ref2].

      2 De aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat door Onze
      Minister wordt vastgesteld.

      3 Indien de aanvraag een project betreft dat wordt uitgevoerd door een samenwerkingsverband, dient de deelnemer in
      het samenwerkingsverband die als indiener van de aanvraag om subsidie in de zin van dit besluit is opgetreden, de
      aanvraag mede namens de andere deelnemers in.


      [ref1]: https://wetten.overheid.nl/BWBR0017332#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0017332#Artikel16
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017332
        artikel: '19'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017332
        artikel: '16'
        paragraaf: '3'
  - number: '21'
    text: |-
      Onze Minister kan in ieder geval afwijzend beschikken op een aanvraag om een voorschot, indien een subsidie-
      ontvanger niet heeft voldaan aan ingevolge de subsidieverlening voor hem geldende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel21
  - number: '22'
    text: |-
      1 De subsidie-ontvanger dient zijn aanvraag om subsidievaststelling binnen zes maanden na het tijdstip waarop het
      project ingevolge [artikel 14, eerste lid][ref1], moet zijn voltooid bij Onze Minister in.

      2 De aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat door Onze
      Minister wordt vastgesteld.

      3 De aanvraag gaat, overeenkomstig hetgeen in het formulier is vermeld, vergezeld van:

      a. een eindverslag omtrent de uitvoering en de resultaten van het project,

      b. indien het bedrag waarop de subsidie ten hoogste kan worden vastgesteld € 50 000 of meer bedraagt, een
      accountantsverklaring die is opgesteld op de in het formulier aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0017332#Artikel14
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017332
        artikel: '14'
        paragraaf: '3'
  - number: '23'
    text: |-
      Onze Minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag
      daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel23
  - number: '24'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel24
  - number: '25'
    text: 'Dit besluit wordt aangehaald als: Besluit EOS: demo en transitie-experimenten.'
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel25
