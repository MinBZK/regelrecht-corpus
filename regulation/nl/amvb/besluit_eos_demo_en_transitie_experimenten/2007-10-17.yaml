articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. ondernemer: een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht
      is ingesteld, die een onderneming in stand houdt;

      b. ondernemer in de landbouwsector: een ondernemer die activiteiten verricht op het gebied van de productie,
      verwerking en afzet van landbouwproducten als bedoeld in bijlage 1 bij het Verdrag tot oprichting van de Europese
      Gemeenschap, met uitzondering van ondernemers in de visserij- en aquacultuursector en in de bosbouwsector;

      c. groep: een economische eenheid, waarin organisatorisch zijn verbonden:

      1°. een natuurlijke persoon of privaatrechtelijke rechtspersoon, die direct of indirect:

        - meer dan de helft van het geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van of
        - overwegende zeggenschap heeft over

      een of meer rechtspersonen of vennootschappen, en

      2°. laatstbedoelde rechtspersonen of vennootschappen;

      d. samenwerkingsverband: een geen rechtspersoonlijkheid bezittend verband, bestaande uit ten minste twee, niet in
      een groep verbonden natuurlijke personen of rechtspersonen;

      e. project:

      1°. een voor Nederland nieuw, planmatig geheel van activiteiten, geheel of nagenoeg geheel bestemd voor het
      vergroten van inzicht in de geschiktheid voor toepassing in de praktijk van duurzame energiehuishouding, dat een
      technisch of economisch risico inhoudt en dat bestaat uit:

        - energiebesparende maatregelen;
        - maatregelen waarbij CO-emissies worden afgevangen en permanent in de ondergrond opgeslagen, of
        - maatregelen die het gebruik van hernieuwbare energiebronnen bevorderen met behulp van: • voor Nederland nieuwe
      apparaten, systemen of technieken, of • een voor Nederland nieuwe toepassing van apparaten, systemen of technieken;

      2°. een energietransitie-experiment, gericht op de bescherming van het milieu, dat in Nederland wordt uitgevoerd
      door een samenwerkingsverband waaraan tenminste één ondernemer en één niet ondernemer deelnemen, met als doel
      het beproeven van een energiesysteem, of een of meer delen daarvan, dat op een transitiepad ligt en waarbij het
      gaat om het bij tenminste een van de leden van het samenwerkingsverband treffen van technische of beheersmatige
      voorzieningen met behulp van apparaten, systemen of technieken die reeds eerder zijn gedemonstreerd, maar die in
      Nederland nog niet gebruikelijk zijn;

      f. duurzame energiehuishouding: een energiehuishouding die economisch efficiënt is, het milieu minder zwaar belast
      of voorziet in beschikbaarheid van energie in voldoende mate en van voldoende kwaliteit;

      g. energiesysteem: een samenhangend geheel van winning, transport, opslag, bewerking of gebruik van energiedragers;

      h. transitiepad: een beschrijving van de transitie van een bestaand, niet duurzaam energiesysteem, of een deel
      daarvan, naar een ander, duurzaam energiesysteem.

      2 Bij regeling van Onze Minister kunnen activiteiten worden aangewezen die niet tot een project worden gerekend.

      3 Bij regeling van Onze Minister kunnen ondernemers worden uitgesloten van dit besluit.

      4 Bij regeling van Onze Minister worden de erkende transitiepaden aangegeven.
