  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 3 februari 2004, nr. WJZ 4005810 en 30 juni 2004, nr.
    WJZ 4033497;

    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    De Raad van State gehoord (adviezen van 18 maart 2004, nr. W10.04.0055/II en 5 augustus 2004, nr. W10.04.0311/II);

