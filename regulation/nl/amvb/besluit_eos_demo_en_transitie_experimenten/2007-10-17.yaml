  - number: '12'
    text: |-
      1 Onze Minister beslist afwijzend op een aanvraag, indien de Adviescommissie energiedemonstratieprojecten en
      energietransitie-experimenten een negatief advies heeft uitgebracht.

      2 Onze Minister verdeelt het beschikbare bedrag in de volgorde van rangschikking van de aanvragen door de
      commissie.

      3 Onze Minister kan afwijken van het eerste en tweede lid, indien een advies van de commissie in strijd is met dit
      besluit of de daarop berustende bepalingen dan wel niet op zorgvuldige wijze tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel12
  - number: '13'
    text: |-
      1 Aan de subsidieverlening zijn, voor zover daarbij niet anders is bepaald, voor alle subsidie-ontvangers
      de in de [artikelen 14 tot en met 17][ref1] opgenomen verplichtingen verbonden, met dien verstande dat de in
      [artikel 16][ref2] opgenomen verplichtingen slechts gelden voor de subsidie-ontvanger die als indiener van de
      aanvraag om subsidie in de zin van dit besluit is opgetreden.

      2 De in de [artikelen 14 tot en met 16][ref3] opgenomen verplichtingen gelden tot de dag waarop de subsidie wordt
      vastgesteld. De in [artikel 17][ref4] opgenomen verplichtingen gelden totdat vijf jaren na die dag zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0017332#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0017332#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0017332#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0017332#Artikel17
