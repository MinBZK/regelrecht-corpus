  - number: '3'
    text: |-
      1 Onverminderd het vierde lid bedraagt de subsidie 40 procent van de projectkosten, maar niet meer dan een bij
      regeling van Onze Minister vast te stellen bedrag. Daarbij kan de hoogte van het subsidiepercentage, genoemd
      in de eerste volzin, per periode als bedoeld in [artikel 6][ref1] op een lager percentage worden vastgesteld en
      verschillend zijn voor de vast te stellen energiethema’s.

      2 Het in het eerste lid genoemde percentage wordt met 10 procentpunten verhoogd, indien de aanvrager een
      ondernemer is die een kleine of middelgrote onderneming in stand houdt in de zin van [verordening (EG) nr. 70/2001]
      (32001R0070) van de Commissie van de Europese Gemeenschappen van 12 januari 2001 betreffende de toepassing van de
      artikelen 87 en 88 van het EG-Verdrag op staatssteun voor kleine en middelgrote ondernemingen (PbEG L 10), naar de
      tekst zoals deze bij die verordening is vastgesteld en voor zover de projectkosten worden gemaakt en betaald door
      de ondernemer.

      3 Indien ter zake van de projectkosten of een deel daarvan reeds door een ander bestuursorgaan of door de Commissie
      van de Europese Gemeenschappen subsidie is verstrekt, wordt slechts een zodanig bedrag aan subsidie verstrekt, dat
      het totale bedrag aan subsidies niet meer bedraagt dan het desbetreffende bedrag dat bij regeling van Onze Minister
      is genoemd, noch, uitgedrukt in een percentage van de projectkosten, meer bedraagt dan het percentage dat is
      genoemd in het eerste en tweede lid.

      4 Het te verlenen subsidiebedrag, tot stand gekomen met toepassing van het eerste tot en met het derde lid, is niet
      meer dan de maximaal toegestane investeringssteun, berekend op de voet van de Communautaire kaderregeling inzake
      staatssteun ten behoeve van het milieu (PbEG 2001 C 37).

      5 Indien de subsidie-ontvanger een ondernemer in de landbouwsector is, werkzaam in een bij regeling van Onze
      Minister aangewezen specifieke sector, bedraagt de subsidie, in afwijking van het eerste tot en met het vierde
      lid, ten hoogste het in die regeling genoemde percentage dat niet hoger is dan 60% en het in die regeling genoemde
      bedrag.

      6 Indien de subsidie-ontvanger een ondernemer in de landbouwsector is en een kleine of middelgrote onderneming
      in stand houdt als bedoeld in het tweede lid, is de verhoging, bedoeld in het tweede lid, niet van toepassing
      voorzover de projectkosten betrekking hebben op investeringen waardoor de productiecapaciteit zal toenemen.


      [ref1]: https://wetten.overheid.nl/BWBR0017332#Artikel6
