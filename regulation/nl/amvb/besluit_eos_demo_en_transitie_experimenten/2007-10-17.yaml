  - number: '9'
    text: |-
      1 Indien op de aanvraag niet afwijzend wordt beslist, en deze een project betreft dat wordt uitgevoerd door een
      samenwerkingsverband, vermeldt de beschikking tot subsidieverlening een raming van de projectkosten per deelnemer
      in het samenwerkingsverband.

      2 Elke deelnemer in het samenwerkingsverband is tot ten hoogste het naar rato van de voor hem geraamde
      projectkosten berekende bedrag aansprakelijk voor terugbetaling van de subsidie, voor zover de subsidie-ontvangers
      daartoe verplicht zijn.
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel9
  - number: '10'
    text: |-
      Onze Minister beslist in ieder geval afwijzend op een aanvraag:

      a. indien de aanvraag niet voldoet aan dit besluit en de daarop berustende bepalingen;

      b. indien hij het onaannemelijk acht dat het project binnen drie jaren kan worden voltooid;

      c. indien gegronde vrees bestaat dat de betrokkenen het project niet kunnen financieren;

      d. indien het project gericht is op:

      1°. de aanpassing aan van toepassing zijnde communautaire normen;

      2°. de aanpassing aan vastgestelde, maar nog niet van toepassing zijnde communautaire normen;

      3°. de aanpassing aan nationale normen die gelijk zijn aan of minder zware eisen stellen dan communautaire normen,
      of

      4°. de aanpassing aan nationale normen bij afwezigheid van communautaire normen, indien de aanpassing heeft
      plaatsgevonden na de op de in de nationale norm vastgestelde uiterste datum.
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel10
  - number: '11'
    text: |-
      1 Onze Minister wint omtrent de aanvragen waarop niet met toepassing van [artikel 10][ref1] afwijzend is beslist
      het advies in van de Adviescommissie energiedemonstratieprojecten en energietransitie-experimenten.

      2 De commissie geeft aan Onze Minister in ieder geval een negatief advies:

      a. indien onvoldoende vertrouwen bestaat in de haalbaarheid van het project;

      b. indien onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben om het project naar behoren uit
      te voeren;

      c. indien het project onvoldoende bijdraagt aan de doelstellingen van het besluit en de daarop berustende
      bepalingen;

      d. indien van de sociaal-wetenschappelijke en economische effecten van het project onvoldoende blijk wordt gegeven.

      3 In het geval van een project als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 2][ref2], geeft de
      commissie aan Onze Minister tevens een negatief advies:

      a. indien het project niet ligt op een door Onze Minister erkend transitiepad;

      b. indien onvoldoende aannemelijk wordt gemaakt dat het project wordt uitgevoerd door een samenwerkingsverband
      waarin een ondernemer de leiding heeft en waarin voorts actief wordt samengewerkt, meerdere disciplines
      vertegenwoordigd zijn en alle deelnemers naar vermogen investeren;

      c. indien onvoldoende aannemelijk wordt gemaakt maakt dat de deelnemers in het samenwerkingsverband hun bedoelingen
      met de uitvoering van het project expliciet hebben gemaakt en met elkaar hebben gedeeld.

      4 De commissie rangschikt:

      a. in het geval van een project als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 1][ref3], per groep
      van aanvragen waarvoor een subsidieplafond geldt de aanvragen waaromtrent zij positief adviseert zodanig, dat
      een project hoger gerangschikt wordt naar mate het meer bijdraagt aan een duurzame energiehuishouding en het meer
      innovatief van aard is;

      b. in het geval van een project als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 2][ref4], per
      transitiepad de aanvragen waaromtrent zij positief adviseert zodanig, dat een project hoger gerangschikt wordt naar
      mate het meer bijdraagt aan een duurzame energiehuishouding.

      5 Voor de rangschikking kunnen bij regeling van Onze Minister wegingsfactoren voor de doelstellingen, bedoeld in
      het vierde lid, worden vastgesteld.

      6 Voor duurzame energiehuishouding en innovatie alsmede voor duurzame energiehuishouding als bedoeld in het vierde
      lid, onderdeel a, respectievelijk onderdeel b, kunnen bij regeling van Onze Minister criteria worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017332#Artikel10
