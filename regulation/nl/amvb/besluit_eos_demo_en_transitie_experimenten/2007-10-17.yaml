  - number: '4'
    text: |-
      1 Als projectkosten worden uitsluitend in aanmerking genomen de rechtstreeks aan de uitvoering van het
      project toe te rekenen, na de indiening van de aanvraag door de subsidie-ontvanger gemaakte en betaalde extra
      investeringskosten die noodzakelijk zijn voor de verwezenlijking van de energiebesparing, de afvang en permanente
      opslag van CO-emissies of ingebruikneming van de hernieuwbare energiebron. Punt 37 van de Communautaire
      kaderregeling inzake staatssteun ten behoeve van het milieu (PbEG 2001 C 37) wordt hierbij in acht genomen.

      2 Extra investeringskosten als bedoeld in het eerste lid hebben in elk geval betrekking op:

      a. kosten van verwerving of op andere titel dan verwerving in gebruik verkregen bedrijfsterreinen;

      b. kosten van verwerving, huurkoop of lease van bedrijfsgebouwen en daartoe te rekenen centrale voorzieningen;

      c. kosten van aangeschafte machines en apparatuur;

      d. kosten van verbruikte materialen en hulpmiddelen;

      e. kosten van onderhoud en inspectie, administratie en beheer, ontmanteling, onvoorziene reparaties, verplichte
      milieumonitoring en verzekeringen;

      f. kosten van geleidelijk opstarten en in gebruik nemen van het project en daartoe te rekenen productiekosten;

      g. kosten van tenaamstelling, verwerving en instandhouding van rechten van intellectuele eigendom;

      h. aan derden verschuldigde kosten.

      3 In afwijking van het eerste en tweede lid worden als projectkosten gemaakt door een ondernemer in de
      landbouwsector in aanmerking genomen:

      a. de kosten van nieuwe machines en nieuw materieel, met inbegrip van computerprogrammatuur,

      b. de kosten van bouw, verwerving of verbetering van onroerende zaken,

      c. de algemene kosten, zoals kosten van architecten en ingenieurs, en voor het verkrijgen van octrooien en
      licenties, tot een maximum van 12 procent van de onder a en b bedoelde kosten, en

      d. de aankoop van grond.

      4 De kosten worden in aanmerking genomen met inbegrip van omzetbelasting, indien de subsidie-ontvanger de die de
      kosten heeft gemaakt de omzetbelasting niet in aftrek kan brengen.

      5 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent:

      a. de kostensoorten, bedoeld in het eerste lid, en

      b. de verrekening van voordelen als bedoeld in punt 37 van de in het eerste lid genoemde kaderregeling.
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel4
  - number: '5'
    text: |-
      1 Er is een Adviescommissie energiedemonstratieprojecten en energietransitie-experimenten, die tot taak heeft Onze
      Minister op zijn verzoek te adviseren omtrent aanvragen om subsidie op grond van dit besluit.

      2 De adviezen van de commissie gaan vergezeld van een deugdelijke motivering.

      3 De commissie bestaat uit een voorzitter en ten minste 4 en ten hoogste 35 andere leden. De leden zijn deskundig
      op het terrein waarop de commissie een taak heeft en zijn geen ambtenaren, werkzaam bij het Ministerie van
      Economische Zaken.

      4 De voorzitter en de leden worden door Onze Minister voor een termijn van ten hoogste vier jaar benoemd. Ze zijn
      te allen tijde opnieuw benoembaar.

      5 Onze Minister kan deelcommissies instellen en leden van de commissie benoemen in deelcommissies.

      6 Onze Minister kan op verzoek van de commissie met het oog op de uitoefening van haar taak deskundigen opdracht
      verlenen onderzoek te verrichten naar een door haar aangewezen project.

      7 De commissie stelt haar werkwijze schriftelijk vast.

      8 Een lid van de commissie en een deskundige als bedoeld in het zesde lid nemen niet deel aan de voorbereiding en
      vaststelling van een advies, indien zij een persoonlijk belang hebben bij de beschikking op een aanvraag.

      9 Onze Minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van de commissie bij te wonen.

      10 In het secretariaat van de commissie wordt door Onze Minister voorzien.

      11 Het beheer van de bescheiden betreffende de werkzaamheden van de commissie geschiedt op overeenkomstige wijze
      als bij het Ministerie van Economische Zaken. De bescheiden worden na beëindiging van de werkzaamheden van de
      commissie bewaard in het archief van dat ministerie.

      12 De commissie verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde
      inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.

      13 De commissie stelt jaarlijks voor 1 april een verslag op van haar werkzaamheden in het afgelopen kalenderjaar.
      Op verzoek van Onze Minister, maar ten minste elk vierde jaar, stelt de commissie tevens een evaluatieverslag op,
      waarin zij aandacht besteedt aan de doelmatigheid en doeltreffendheid van haar taakvervulling. Het jaarverslag en
      het evaluatieverslag worden aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister stelt bij ministeriële regeling perioden vast na afloop waarvan de aanvragen om een subsidie voor
      een project, die in die periode zijn ontvangen en voldoen aan de wettelijke voorschriften, worden behandeld.

      2 Onze Minister stelt voorts bij ministeriële regeling een subsidieplafond vast voor het verlenen van in het
      eerste lid bedoelde subsidies op in die periode ontvangen aanvragen. Daarbij kan hij afzonderlijke subsidieplafonds
      vaststellen voor bepaalde categorieën aanvragers en voor bepaalde categorieën projecten.
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel6
  - number: '7'
    text: |-
      1 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat
      door Onze Minister wordt vastgesteld.

      2 De aanvraag gaat vergezeld van een projectplan en een begroting voor het project alsmede van andere bescheiden,
      overeenkomstig hetgeen in het formulier is vermeld.

      3 Indien de aanvraag een project betreft dat wordt uitgevoerd door een samenwerkingsverband, dient een der
      deelnemers in het samenwerkingsverband de aanvraag mede namens de andere deelnemers in en gaat de aanvraag
      vergezeld van de overeenkomst waarin de samenwerking tussen de deelnemers in het samenwerkingsverband is geregeld,
      overeenkomstig hetgeen in het formulier is vermeld.

      4 Indien de aanvraag een project als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 2][ref1], betreft, dient
      een van de deelnemers in het samenwerkingsverband, zijnde een deelnemer die in Nederland is gevestigd, de aanvraag
      mede namens de andere deelnemers in. De aanvraag gaat vergezeld van de overeenkomst waarin de samenwerking tussen
      de deelnemers in het samenwerkingsverband is geregeld, overeenkomstig hetgeen in het formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0017332#Artikel1
    url: https://wetten.overheid.nl/BWBR0017332/2007-10-17#Artikel7
