  - number: '2'
    text: |-
      1 Onze Minister verstrekt op aanvraag een subsidie aan:

      a. in het geval van een project als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 1][ref1]:

      1°. degene die in Nederland is gevestigd en voor eigen rekening en risico een project uitvoert dat past in een
      energiethema, of

      2°. de in Nederland gevestigde deelnemers in een samenwerkingsverband die voor gezamenlijke rekening en risico een
      project uitvoeren dat past in een energiethema;

      b. in het geval van een project als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 2][ref2], de deelnemers
      in een samenwerkingsverband die voor gezamenlijke rekening en risico een project uitvoeren dat past binnen het
      streven naar een duurzame energiehuishouding.

      2 Als energiethema worden aangewezen de door Onze Minister vastgestelde thema’s met betrekking tot de volgende
      gebieden of combinaties daarvan:

      a. biomassa;

      b. nieuw gas/schoon fossiel en efficiënt gebruik van gas;

      c. efficiëntieverbetering in de industriële sector;

      d. gebouwde omgeving;

      e. opwekking en netten.

      3 Als thema binnen het streven naar een duurzame energiehuishouding worden aangewezen de door Onze Minister
      vastgestelde thema’s met betrekking tot de in het tweede lid, onderdelen a tot en met c, genoemde gebieden of
      combinaties daarvan.

      4 Indien de aanvragers deelnemers in een samenwerkingsverband zijn, wordt de subsidie verstrekt aan de deelnemers
      gezamenlijk en betaald aan de deelnemer die als indiener van de aanvraag om subsidie in de zin van dit besluit is
      opgetreden. Indien een of meerdere van de deelnemers in een samenwerkingsverband ondernemers in de landbouwsector
      zijn, geschiedt verstrekking en betaling van de subsidie op een bij ministeriële regeling vast te stellen wijze.

      5 Geen subsidie wordt verstrekt:

      a. indien voor het project reeds door Onze Minister subsidie is verstrekt;

      b. aan de rijksoverheid;

      c. voor zover door verlening van de subsidie in het kalenderjaar waarin de beschikking wordt gegeven aan de
      aanvrager dan wel aan de tot dezelfde groep als de aanvrager behorende ondernemers meer dan een bij regeling van
      Onze Minister vast te stellen bedrag aan subsidie op grond van dit besluit zou worden verstrekt.

      6 Aan een ondernemer in de landbouwsector wordt slechts subsidie verstrekt indien deze:

      a. aan de hand van een beoordeling van de vooruitzichten kan aantonen dat het landbouwbedrijf economisch
      levensvatbaar is;

      b. voldoet aan de normen gesteld bij of krachtens de [Wet milieubeheer][ref3], de
      [Wet verontreiniging oppervlaktewater][ref4], de [Meststoffenwet][ref5], de [Wet bodembescherming][ref6],
      de [Wet gewasbeschermingsmiddelen en biociden][ref7], de [Gezondheids- en welzijnswet voor dieren][ref8], de
      [Diergeneesmiddelenwet][ref9] en de [Plantenziektewet][ref10], en

      c. over voldoende vakbekwaamheid en deskundigheid beschikt, hetgeen blijkt uit:

      1°. het bezit van een getuigschrift van een erkende landbouwkundige opleiding of van een opleiding van een hiermee
      gelijkwaardig niveau, of

      2°. de omstandigheid dat de ondernemer ten minste drie jaren op een landbouwonderneming werkzaam is geweest.

      7 Aan een ondernemer in de landbouwsector wordt geen subsidie verstrekt indien de investeringen zijn gericht op
      een productieverhoging waarvoor op de markt geen normale afzetmogelijkheden bestaan. Evenmin zal een subsidie
      worden verstrekt indien de productie door de investeringen verder stijgt dan op grond van productiebeperkingen of
      beperkingen t.a.v. communautaire steunverlening is toegestaan.

      8 Indien de voordelen van de subsidie geheel of gedeeltelijk ten goede komen aan ondernemers in de landbouwsector
      die niet zelf de aanvrager van de subsidie zijn, geschiedt verstrekking en betaling van de subsidie op een bij
      ministeriële regeling vast te stellen wijze.


