preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Infrastructuur en Milieu van 8 juli 2014, nr. IenM/BSK-2014/135720,
    Hoofddirectie Bestuurlijke en Juridische Zaken;

    Gelet op de artikelen 4, eerste en tweede lid, en 5 van de Kaderwet subsidies I en M;

    De Afdeling advisering van de Raad van State gehoord (advies van 4 september 2014, no.W14.14.0233IV);

    Gezien het nader rapport van Onze Minister van Infrastructuur en Milieu van 9 februari 2015, nr. IenM/BSK-
    2015/22855, Hoofddirectie Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *aanvrager:* natuurlijk persoon of
      rechtspersoon die een subsidie aanvraagt op grond van een ministeriële regeling als bedoeld in [artikel 2][ref1];
        - *algemene groepsvrijstellingsverordening:* Verordening (EU) nr. 651/2014 van de Commissie van 17 juni 2014
      waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108 van het Verdrag met de interne markt
      verenigbaar worden verklaard («de algemene groepsvrijstelling») (PbEU 26.6.2014, L187/1), dan wel later daarvoor in
      de plaats tredende Europese regelgeving;
        - *de-minimis verordening:* Verordening (EU) nr. 1407/2013 van de Commissie van 18 december 2013 betreffende
      de toepassing van de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie op de-
      minimissteun (PbEU L352/1), dan wel later daarvoor in de plaats tredende Europese regelgeving; Verordening (EU)
      nr. 717/2014 van de Commissie van 27 juni 2014 inzake de toepassing van de artikelen 107 en 108 van het Verdrag
      betreffende de werking van de Europese Unie op de de-minimissteun in de visserij -en aquacultuursector (PbEU
      28.6.2014, L190), Verordening (EU) nr. 702/2014 van de Commissie van de Europese Gemeenschappen van 25 juni 2014
      waarbij bepaalde categorieën steun in de landbouw- en de bosbouwsector en in plattelandsgebieden op grond van de
      artikelen 2017 en 108 van het Verdrag betreffende de werking van de Europese Unie met de interne markt verenigbaar
      worden verklaard, (PbEU 1.7.2014, L193) dan wel later daarvoor in de plaats tredende Europese regelgeving;
        - *Europees steunkader:* een mededeling, richtsnoer, kaderregeling, besluit of vrijstellingsverordening op het
      gebied van staatssteun die de Europese Commissie, gelet op de artikelen 106, derde lid, 107 en 108 van het Verdrag
      betreffende de werking van de Europese Unie (VWEU) heeft vastgesteld;
        - *ondernemer:* een natuurlijk persoon of een rechtspersoon die een onderneming in stand houdt;
        - *onderneming:* iedere eenheid, ongeacht haar rechtsvorm of wijze van financiering, die een economische activiteit
      uitoefent;
        - *penvoerder:* de door een samenwerkingsverband aangewezen natuurlijk persoon of rechtspersoon die als gemachtigde
      van het samenwerkingsverband optreedt;
        - *samenwerkingsverband:* een geen rechtspersoonlijkheid bezittend verband, bestaande uit ten minste twee
      deelnemers, dat is opgericht ten behoeve van uitvoering van activiteiten;
        - *wet:* [Kaderwet subsidies I en M][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032789
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0032789
  - number: '2.1'
    text: |-
      Onze Minister kan op aanvraag voor activiteiten op gebieden genoemd in [artikel 3, eerste lid, van de wet][ref1],
      subsidie verstrekken volgens de regels van dit besluit en overeenkomstig de bij ministeriële regeling bepaalde
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0032789#Artikel3
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0032789
        artikel: '3'
  - number: '2.2'
    text: |-
      De [hoofdstukken 3 tot en met 11][ref1] van dit besluit zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0036381
        hoofdstuk: '3'
  - number: 2.2.a
    text: |-
      per boekjaar verstrekte subsidies als bedoeld in [artikel 4:58 van de Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.2.b
    text: |-
      subsidies die worden verstrekt op basis van of in nauwe samenhang met een bindend besluit van de Raad van de
      Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen
      betreffende ondersteuning van activiteiten op de gebieden genoemd in [artikel 3, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032789#Artikel3
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0032789
        artikel: '3'
  - number: 2.2.c
    text: |-
      subsidies die worden verstrekt met het oog op cofinanciering van een door de Raad van de Europese Unie of de
      Commissie van de Europese Gemeenschappen goedgekeurd programma; en,
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel2
  - number: 2.2.d
    text: |-
      subsidies die zijn verstrekt op basis van subsidieregelingen als bedoeld in [artikel 17 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032789#Artikel17
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0032789
        artikel: '17'
  - number: '2.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat artikelen van dit besluit van overeenkomstige toepassing zijn op
      verstrekkingen uitsluitend aan rechtspersonen die krachtens publiek recht zijn ingesteld.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel2
  - number: '3'
    text: |-
      Een subsidie wordt verstrekt aan een natuurlijk persoon of rechtspersoon die voor eigen rekening en risico
      activiteiten uitvoert die ten goede komen aan de Nederlandse economie.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel3
  - number: '4.1'
    text: 'Bij ministeriële regeling kunnen in ieder geval nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel4
  - number: 4.1.a
    text: het doel van de subsidie;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel4
  - number: 4.1.b
    text: de activiteiten waarvoor subsidie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel4
  - number: 4.1.c
    text: de aanvragers;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel4
  - number: 4.1.d
    text: een samenwerkingsverband en de penvoerder daarvan;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel4
  - number: 4.1.e
    text: de vorm van subsidie;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel4
  - number: 4.1.f
    text: de in aanmerking komende subsidiabele kosten;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel4
  - number: 4.1.g
    text: de voorwaarden waaronder de subsidie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel4
  - number: 4.1.h
    text: verplichtingen van de subsidie-ontvanger in verband met de subsidie;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel4
  - number: 4.1.i
    text: |-
      onderwerpen die, in afwijking van of in aanvulling op de regels van dit besluit nadere regeling behoeven op basis
      van een Europees steunkader;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel4
  - number: 4.1.k
    text: de wijze van berekening van de subsidie of de hoogte van de subsidie.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel4
  - number: '4.2'
    text: Bij ministeriele regeling kan een maximum subsidiebedrag per aanvrager worden bepaald.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel4
  - number: '5.1'
    text: |-
      Indien reeds door een bestuursorgaan of de Commissie van de Europese Unie subsidie is verstrekt voor de
      subsidiabele kosten of een deel daarvan, wordt het bedrag dat door deze bestuursorganen is verstrekt in mindering
      gebracht op de subsidie waarvoor de aanvrager krachtens dit besluit of ministeriële regeling in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel5
  - number: '5.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat bepaalde subsidieregelingen of bijdragen van de Commissie van de
      Europese Unie bij de toepassing van het eerste lid buiten beschouwing blijven.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel5
  - number: '5.3'
    text: |-
      Indien bij ministeriële regeling is bepaald dat toepassing is gegeven aan een de-minimis verordening of de algemene
      groepsvrijstellingsverordening, wordt het bedrag van de subsidie verlaagd voor zover dit nodig is op basis van de
      desbetreffende verordening.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel5
  - number: '6.1'
    text: |-
      Voor subsidie komen in aanmerking de gemaakte kosten die direct verbonden zijn met de uitvoering van activiteiten
      en die op grond van een ministeriële regeling voor subsidie in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel6
  - number: '6.2'
    text: 'De vóór indiening van de aanvraag door de aanvrager gemaakte kosten komen niet voor subsidie in aanmerking, tenzij:'
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel6
  - number: 6.2.a
    text: |-
      het een subsidie lager dan € 25.000,– betreft waarbij met toepassing van [artikel 15, tweede lid][ref1], direct een
      beschikking tot subsidievaststelling wordt gegeven; of


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel15
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '15'
        hoofdstuk: '7'
  - number: 6.2.b
    text: bij ministeriele regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel6
  - number: '6.3'
    text: |-
      Bij subsidie aan een aanvrager waar een Europees steunkader op van toepassing is, komen alleen die kosten voor
      subsidie in aanmerking die voldoen aan de eisen van het desbetreffende steunkader.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel6
  - number: '6.4'
    text: |-
      Verschuldigde btw komt uitsluitend voor subsidie in aanmerking ingeval de aanvrager de btw niet kan verrekenen met
      de door hem af te dragen omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel6
  - number: '6.5'
    text: |-
      De kosten die voor subsidie in aanmerking komen worden door de aanvrager berekend op basis van een voor Onze
      Minister controleerbare methode, die is gebaseerd op bedrijfeconomische grondslagen en normen die in het
      maatschappelijk verkeer als aanvaardbaar worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel6
  - number: '6.6'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de kosten die voor subsidie in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel6
  - number: '7.1'
    text: |-
      Indien in het kader van de berekening van de hoogte van de te verstrekken subsidie uurtarieven worden
      gehanteerd, worden deze door de aanvrager berekend aan de hand van één of meer in het tweede lid genoemde
      standaardberekeningswijzen.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel7
  - number: '7.2'
    text: 'Als standaardberekeningswijzen voor de berekening van uurtarieven worden gehanteerd:'
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel7
  - number: 7.2.a
    text: berekening op basis van integrale kostensystematiek;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel7
  - number: 7.2.b
    text: |-
      berekening op basis van kosten per kostendrager vermeerderd met een forfaitair vastgestelde opslag voor indirecte
      kosten, of
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel7
  - number: 7.2.c
    text: een forfaitair vastgesteld uurtarief.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel7
  - number: '7.3'
    text: |-
      Bij ministeriële regeling wordt bepaald welke van de in het tweede lid genoemde standaardberekeningswijzen van
      toepassing zijn en kunnen nadere regels worden gesteld over de toepassing van de standaardberekeningswijzen,
      genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel7
  - number: '8.1'
    text: |-
      Een subsidieplafond kan bij ministeriële regeling worden vastgesteld voor het totale voor subsidieverstrekking
      beschikbare subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel8
  - number: '8.2'
    text: |-
      Bij de vaststelling van een subsidieplafond als bedoeld in het eerste lid wordt gekozen voor verdeling van het
      beschikbare subsidiebedrag:
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel8
  - number: 8.2.a
    text: op volgorde van binnenkomst van de aanvragen;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel8
  - number: 8.2.b
    text: op volgorde van rangschikking van de aanvragen; of
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel8
  - number: 8.2.c
    text: evenredig over de ingediende aanvragen.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel8
  - number: '8.3'
    text: |-
      Indien is gekozen voor verdeling op volgorde van binnenkomst, verdeelt Onze Minister het beschikbare bedrag in de
      volgorde van ontvangst van de aanvragen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel8
  - number: 8.3.a
    text: |-
      indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de
      verdeling als datum van ontvangst geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 8.3.b
    text: |-
      indien Onze Minister op de dag dat het subsidieplafond wordt bereikt meer dan één aanvraag ontvangt, hij de
      onderlinge rangschikking van die aanvragen vaststelt door middel van loting;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel8
  - number: 8.3.c
    text: |-
      bij ministeriële regeling kan worden bepaald op welke wijze wordt omgegaan met meerdere aanvragen van één aanvrager
      of aanvragers binnen één groep;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel8
  - number: 8.3.d
    text: |-
      bij ministeriële regeling kan worden bepaald dat de aanvragen in ieder geval moeten voldoen aan in de ministeriële
      regeling opgenomen criteria;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel8
  - number: 8.3.e
    text: |-
      Onze Minister het bereiken van het subsidieplafond in de Staatscourant bekend maakt indien dit geschiedt voordat de
      in de ministeriële regeling opgenomen termijn voor het indienen van aanvragen is gesloten.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel8
  - number: '9'
    text: |-
      Indien bij de vaststelling van een subsidieplafond is gekozen de subsidie te verdelen op volgorde van
      rangschikking, worden bij ministeriële regeling rangschikkingcriteria vastgesteld en, indien meerdere
      rangschikkingcriteria worden vastgesteld, de onderlinge weging daarvan. Indien Onze Minister zich bij de
      rangschikking van aanvragen laat adviseren door een persoon of meerdere personen die of een college dat niet onder
      zijn verantwoordelijkheid werkzaam is, wordt bij ministeriële regeling bepaald door wie en op welke wijze het
      advies wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel9
  - number: '10.1'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van een daartoe door Onze Minister beschikbaar gesteld
      middel.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel10
  - number: '10.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de aanvraag om subsidie en over de periode waarbinnen
      de aanvraag wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel10
  - number: '10.3'
    text: De aanvraag gaat vergezeld van de in het middel aangegeven bescheiden.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel10
  - number: '10.4'
    text: |-
      De aanvraag bevat, tenzij bij ministeriële regeling anders is bepaald, in ieder geval de volgende gegevens en
      bescheiden:
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel10
  - number: 10.4.a
    text: een overzicht van de activiteiten waarvoor subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel10
  - number: 10.4.b
    text: |-
      een toelichting op de wijze waarop en de mate waarin de activiteiten waarvoor subsidie wordt gevraagd een bijdrage
      leveren aan de doelstellingen van de desbetreffende ministeriële regeling;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel10
  - number: 10.4.c
    text: |-
      een gespecificeerde begroting, die een goed inzicht geeft in de kosten van de activiteiten waarvoor subsidie wordt
      aangevraagd;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel10
  - number: 10.4.d
    text: een tijdplanning van de activiteit;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel10
  - number: 10.4.e
    text: |-
      indien voorschotten worden gewenst, een weergave van de liquiditeitsbehoefte gedurende het tijdvak waarvoor
      subsidie wordt gevraagd, zo mogelijk per tijdvak van drie maanden;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel10
  - number: 10.4.f
    text: |-
      het bankrekeningnummer waarop het subsidiebedrag dient te worden gestort, inclusief een bewijs dat de bankrekening
      op naam van de aanvrager staat;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel10
  - number: 10.4.g
    text: indien van toepassing, het inschrijfnummer van de aanvrager bij de Kamer van Koophandel.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel10
  - number: '10.5'
    text: |-
      Bij de aanvraag tot subsidieverlening voor een subsidie van € 25 000,– of meer kan een gespecificeerde begroting
      worden overlegd, waaruit ten minste blijkt hoe hoog de totale kosten van de te subsidiëren activiteit zijn.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel10
  - number: '11'
    text: |-
      Onze Minister beslist afwijzend op een aanvraag om subsidie indien de aanvraag niet voldoet aan de bij of krachtens
      dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel11
  - number: '12'
    text: 'Onze Minister beslist voorts afwijzend op een aanvraag om subsidie indien:'
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel12
  - number: 12.a
    text: |-
      door de toepassing van een de-minimisverordening, een bedrag aan de-minimis steun zou worden verstrekt dat hoger is
      dan geoorloofd op grond van deze verordening;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel12
  - number: 12.b
    text: onvoldoende vertrouwen bestaat dat de betrokkene de activiteiten kunnen financieren;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel12
  - number: 12.c
    text: |-
      het onaannemelijk wordt geacht dat de activiteiten binnen een bij ministeriële regeling gestelde termijn kunnen
      worden voltooid;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel12
  - number: 12.d
    text: het aannemelijk is dat de activiteiten ook zonder subsidie worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel12
  - number: 12.e
    text: onvoldoende vertrouwen bestaat in de technische haalbaarheid van de activiteiten;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel12
  - number: 12.f
    text: onvoldoende vertrouwen bestaat in de economische haalbaarheid van de activiteiten;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel12
  - number: 12.g
    text: de activiteiten onvoldoende bijdragen aan de doelstellingen van de subsidie;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel12
  - number: 12.h
    text: |-
      onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben om de activiteiten naar behoren uit te
      voeren;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel12
  - number: 12.i
    text: de kosten die in aanmerking komen voor subsidie niet aannemelijk of redelijk zijn;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel12
  - number: 12.j
    text: |-
      het een aanvrager betreft, tegen wie een bevel tot terugvordering uitstaat als bedoeld in artikel 1, zesde lid,
      onderdeel a, van de algemene groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel12
  - number: 12.k
    text: |-
      er naar het oordeel van Onze Minister onaanvaardbaar risico bestaat dat de uitvoering van een voorgenomen
      activiteit een onevenredige inbreuk zal maken op de economische, ecologische of sociale dimensie van duurzaamheid.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel12
  - number: '13'
    text: |-
      Bij ministeriële regeling kunnen andere afwijzingsgronden dan de afwijzingsgronden, bedoeld in [artikel 11][ref1]
      en [12][ref2], worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0036381#Artikel12
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '11'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0036381
        artikel: '12'
        hoofdstuk: '6'
  - number: '14.1'
    text: |-
      Een beschikking tot subsidieverstrekking wordt gegeven binnen dertien weken na ontvangst van de aanvraag of, indien
      sprake is van een subsidieplafond en de verdeling plaatsvindt in volgorde van rangschikking van of evenredige
      verdeling, binnen dertien weken na afloop van de periode waarbinnen de aanvragen kunnen worden ingediend.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel14
  - number: '14.2'
    text: 'In afwijking van het eerste lid geldt een termijn van tweeëntwintig weken in geval van:'
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel14
  - number: 14.2.a
    text: |-
      cofinanciering van een door de Raad van de Europese Unie, het Europees Parlement en de Raad van de Europese Unie
      gezamenlijk of de Europese Commissie goedgekeurd programma;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel14
  - number: 14.2.b
    text: het inwinnen van advies; of
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel14
  - number: 14.2.c
    text: het instellen van een nader onderzoek.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel14
  - number: '14.3'
    text: |-
      In afwijking van het eerste lid geldt een termijn van veertig weken, indien het oordeel van een internationale
      beoordelingscommissie wordt gevraagd of een andere vorm van internationale beoordeling plaats vindt.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel14
  - number: '14.4'
    text: |-
      Indien een beschikking niet binnen de termijn, genoemd in het eerste tot en met het derde lid kan worden gegeven,
      kan deze termijn eenmaal met de diezelfde termijn worden verlengd.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel14
  - number: '15.1'
    text: |-
      Een subsidie lager dan € 25.000,– wordt verstrekt in de vorm van een vast bedrag dat bij ministeriële regeling
      wordt vastgelegd of dat wordt bepaald op basis van gegevens die worden ingediend bij de aanvraag.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel15
  - number: '15.2'
    text: 'Indien een subsidie lager dan € 25.000,– wordt verstrekt, wordt:'
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel15
  - number: 15.2.a
    text: direct een beschikking tot subsidievaststelling gegeven, of
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel15
  - number: 15.2.b
    text: |-
      een beschikking tot subsidieverlening gegeven, met vermelding van de datum waarop de activiteiten uiterlijk moeten
      zijn verricht en van de datum waarop de subsidie uiterlijk ambtshalve wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel15
  - number: '15.3'
    text: |-
      Een subsidie van € 25.000,– tot € 125.000,– wordt verstrekt in de vorm van een vast bedrag, of een maximum bedrag
      voor een nog te verrichten prestatie-eenheid, dat in een ministeriële regeling wordt vastgelegd of dat wordt
      bepaald op basis van gegevens die worden ingediend bij de aanvraag.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel15
  - number: '15.4'
    text: |-
      Een subsidie van € 125.000,– of meer wordt verstrekt in de vorm van een maximumbedrag voor een nog te verrichten
      prestatie-eenheid, dat in de ministeriële regeling wordt vastgelegd of dat wordt bepaald op basis van gegevens die
      worden ingediend bij de aanvraag.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel15
  - number: '15.5'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de voorwaarden waaronder een subsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel15
  - number: '16'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de regels inzake een subsidie lager dan € 25.000,– van toepassing
      zijn op een subsidie van € 25.000,– of meer of dat de regels inzake een subsidie van € 25.000,– tot € 125.000,– van
      toepassing zijn op subsidies van € 125.000,– of meer.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel16
  - number: '17.1'
    text: 'De subsidie-ontvanger is verplicht:'
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel17
  - number: 17.1.a
    text: |-
      de activiteiten uit te voeren overeenkomstig de omschrijving van die activiteiten in de beschikking tot
      subsidieverlening of tot subsidievaststelling;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel17
  - number: 17.1.b
    text: te voldoen aan de verplichtingen die door Onze Minister aan de subsidie zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel17
  - number: 17.1.c
    text: |-
      op een van tevoren, in de beschikking of in een ministeriële regeling aangegeven wijze, aan te tonen dat de
      activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan aan de aan de subsidie verbonden
      verplichtingen;.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel17
  - number: 17.1.d
    text: |-
      onverwijld schriftelijk mededeling te doen aan Onze Minister van de indiening bij de rechtbank van een verzoek tot
      op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening van surseance
      van betaling aan hem of tot faillietverklaring van hem;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel17
  - number: 17.1.e
    text: |-
      op verzoek van Onze Minister alle gevraagde medewerking te verlenen aan een door Onze Minister ter zake van de
      toepassing en de effecten van dit besluit of op grond van een ministeriële regeling ingesteld evaluatieonderzoek,
      die Onze Minister redelijkerwijs nodig heeft voor de uitvoering van dat evaluatieonderzoek;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel17
  - number: 17.1.f
    text: |-
      medewerking te verlenen aan openbaarmaking van de gegevens en de resultaten van de activiteit, tenzij
      openbaarmaking daarvan redelijkerwijs niet kan worden gevergd;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel17
  - number: 17.1.g
    text: |-
      op verzoek van Onze Minister nadere informatie aan te leveren ten behoeve van verantwoording aan de Europese
      Commissie, op basis van de artikelen 106, tweede en derde lid, 107 en 108 van het Verdrag betreffende de Werking
      van de Europese Unie dan wel een van de Europese steunkaders.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister kan voor het vertragen, essentieel wijzigen of het stopzetten van activiteiten op voorafgaand verzoek
      van de subsidie-ontvanger ontheffing verlenen van de verplichting, bedoeld in het eerste lid, onderdeel a. Aan de
      ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel17
  - number: '18'
    text: 'De subsidie-ontvanger doet onverwijld mededeling aan Onze Minister zodra aannemelijk is dat:'
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel18
  - number: 18.a
    text: de activiteiten waarvoor de subsidie is verleend niet, niet tijdig of niet geheel zullen worden verricht; of,
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel18
  - number: 18.b
    text: niet, niet tijdig of niet geheel aan de aan de subsidie verbonden verplichtingen zal worden voldaan.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel18
  - number: '19.1'
    text: |-
      De subsidie-ontvanger voert een zodanige administratie dat daaruit op eenvoudige en duidelijke wijze is af te
      leiden:
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel19
  - number: 19.1.a
    text: de aard, inhoud en voortgang van de verrichte activiteiten;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel19
  - number: 19.1.b
    text: het aantal eenheden dat per kostendrager is besteed aan activiteiten die voor subsidie in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel19
  - number: 19.1.c
    text: het aantal uren dat per persoon is besteed aan activiteiten die voor subsidie in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel19
  - number: 19.1.d
    text: |-
      indien een tarief als bedoeld in [artikel 7][ref1] wordt gehanteerd, de berekening en samenstelling van het tarief;


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel7
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '7'
        hoofdstuk: '3'
  - number: 19.1.e
    text: de specifiek ten behoeve van de activiteiten gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel19
  - number: '19.2'
    text: |-
      De administratie wordt tot vijf jaar na de datum van de beschikking tot subsidievaststelling bewaard of, indien er
      sprake is van staatssteun, gedurende een andere bij ministeriële regeling of bij beschikking aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel19
  - number: '19.3'
    text: |-
      Indien de subsidie minder bedraagt dan € 125.000,– zijn het eerste en tweede lid niet van toepassing. In dat geval
      beschikt de subsidie-ontvanger tot vijf jaar na de datum van de beschikking tot subsidievaststelling over die
      gegevens die nodig zijn om desgevraagd aan te tonen dat de subsidiabele activiteiten zijn verricht.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel19
  - number: '20.1'
    text: |-
      Indien de periode van uitvoering van de activiteiten die voor subsidie in aanmerking komen meer dan twaalf maanden
      in beslag neemt, wordt bij de beschikking tot subsidieverlening de verplichting opgelegd tot indiening van één of
      meer rapportages, maar ten hoogste één rapportage per jaar
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel20
  - number: '20.2'
    text: Indien de subsidie minder bedraagt dan € 25.000,– is het eerste lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel20
  - number: '21'
    text: Onze Minister kan bij de beschikking tot subsidieverstrekking nadere verplichtingen opleggen.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel21
  - number: '22.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een of meer van de in dit hoofdstuk opgenomen verplichtingen niet
      van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel22
  - number: '22.2'
    text: |-
      Bij ministeriële regeling kunnen andere verplichtingen dan de in dit hoofdstuk opgenomen verplichtingen worden
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister verstrekt ambtshalve, gelijktijdig met de beschikking tot subsidieverlening, voorschotten voor een
      subsidie die nog niet is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel23
  - number: '23.2'
    text: |-
      Indien na de aanvraag tot subsidie de beschikking tot subsidievaststelling wordt gegeven vindt de betaling van het
      subsidiebedrag in één keer plaats.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel23
  - number: '23.3'
    text: |-
      Het voorschot wordt uitgekeerd in termijnen waarvan de hoogte en de tijdstippen bij ministeriële regeling of in de
      verleningbeschikking worden bepaald.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel23
  - number: '23.4'
    text: |-
      De voorschotverlening wordt opgeschort zolang de rapportage, bedoeld in [artikel 20][ref1], in strijd met dat
      artikel niet is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel20
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '20'
        hoofdstuk: '8'
  - number: '23.5'
    text: Bij ministeriële regeling kan het percentage van het voorschot worden bepaald.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel23
  - number: '23.6'
    text: |-
      Indien de subsidie lager is dan € 25.000,– wordt bij de beschikking tot subsidieverstrekking 100% voorschot
      verleend.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel23
  - number: '24.1'
    text: |-
      Een aanvraag tot een beschikking tot subsidievaststelling vindt plaats binnen dertien weken na het
      verricht zijn van de activiteiten waarvoor de subsidie is verstrekt. Bij ministeriële regeling of bij
      de beschikking tot subsidieverstrekking kan een andere termijn worden bepaald. Als er sprake is van een
      subsidie waarbij verantwoord wordt volgens het principe van Single Information Single Audit als bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1] vindt vaststelling plaats op basis van die verantwoording.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '24.2'
    text: |-
      In afwijking van het eerste lid kan bij ministeriele regeling worden bepaald dat de subsidie ambtshalve wordt
      vastgesteld. De beschikking tot subsidieverstrekking vermeldt de datum waarop:
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel24
  - number: 24.2.a
    text: de activiteiten uiterlijk zijn verricht;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel24
  - number: 24.2.b
    text: de subsidie uiterlijk ambtshalve wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel24
  - number: '24.3'
    text: |-
      De aanvraag, bedoeld in het eerste lid, wordt ingediend met gebruikmaking van een daartoe door Onze Minister
      beschikbaar gesteld middel, tenzij bij ministeriële regeling anders is bepaald. De aanvraag gaat vergezeld van de
      in het middel aangegeven bescheiden, waaronder in elk geval een verslag omtrent het verloop, de uitvoering en de
      resultaten van de activiteit, waaruit blijkt dat de subsidie-ontvanger aan de verplichtingen heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel24
  - number: '24.4'
    text: 'De subsidie-ontvanger voegt bij de aanvraag tot subsidievaststelling voor een subsidie van € 125.000,– of meer:'
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel24
  - number: 24.4.a
    text: een financiële verantwoording;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel24
  - number: 24.4.b
    text: |-
      indien de gemaakte kosten 10 % of meer afwijken van de onderbouwde begrotingspost van de aanvraag: een toelichting
      daarop; en
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel24
  - number: 24.4.c
    text: een controleverklaring.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel24
  - number: '24.5'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat, in afwijking van het vierde lid, onderdeel c, de aanvraag niet
      vergezeld hoeft te gaan van een controleverklaring.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel24
  - number: '25.1'
    text: |-
      Onze Minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag
      daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel25
  - number: '25.2'
    text: |-
      Indien een beschikking tot subsidievaststelling niet binnen de in het eerste lid genoemde termijn kan worden
      gegeven, kan deze termijn eenmaal met dertien weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel25
  - number: '26.1'
    text: |-
      Indien bij ministeriële regeling is bepaald dat aanvragers van subsidie mogen samenwerken in een
      samenwerkingsverband:
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel26
  - number: 26.1.a
    text: |-
      dienen de penvoerder namens hen de aanvraag in, met daarbij gevoegd een overeenkomst betreffende hun samenwerking
      en een verklaring van de deelnemers van het samenwerkingsverband waarin een penvoerder is aangewezen:
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel26
  - number: 26.1.b
    text: |-
      kan bij ministeriële regeling of in de beschikking tot subsidieverstrekking als voorwaarde worden gesteld dat
      binnen een bepaalde termijn een overeenkomst wordt verstrekt waarin de samenwerking tussen de deelnemers in het
      samenwerkingsverband is geregeld;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel26
  - number: 26.1.c
    text: verzendt Onze Minister de beschikkingen tot subsidieverstrekking aan de penvoerder;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel26
  - number: 26.1.d
    text: verstrekt Onze Minister de voorschotten via de penvoerder aan de subsidie-ontvangers;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel26
  - number: 26.1.e
    text: |-
      dienen zij de rapportages als bedoeld in [artikel 20][ref1] in via de penvoerder, en


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel20
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '20'
        hoofdstuk: '8'
  - number: 26.1.f
    text: |-
      betaalt Onze Minister het subsidiebedrag via de penvoerder aan de subsidie-ontvangers. Deze betaling geldt als
      betaling aan de subsidie-ontvangers;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel26
  - number: 26.1.g
    text: dient de penvoerder namens hen de aanvraag tot subsidievaststelling in..
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel26
  - number: '26.2'
    text: |-
      De penvoerder van een samenwerkingsverband doet onverwijld mededeling aan Onze Minister nadat een verzoek tot
      verlening van surseance van betaling of faillietverklaring van hem, dan wel een aangifte of vordering daartoe bij
      de rechtbank is ingediend.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel26
  - number: '27.1'
    text: |-
      Onze Minister houdt ter voorkoming van misbruik en oneigenlijk gebruik van subsidie een registratie bij waarin
      wordt vastgelegd:
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel27
  - number: 27.1.a
    text: |-
      het opleggen van een boete aan een subsidieontvanger op grond van de
      [Wet bestuurlijke boete meldingsplichten door ministers verstrekte subsidies][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032155
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0032155
  - number: 27.1.b
    text: |-
      het lager vaststellen van de subsidie op grond van
      [artikel 4:46, tweede lid, van de Algemene wet bestuursrecht][ref1], het intrekken of ten nadele van de subsidie-
      ontvanger wijzigen van de subsidieverlening op grond van [artikel 4:48 van de Algemene wet bestuursrecht][ref2]
      en het intrekken of ten nadele van de subsidie-ontvanger wijzigen van de subsidievaststelling op grond van
      [artikel 4:49 van de Algemene wet bestuursrecht][ref3], indien de subsidie-ontvanger een verwijt kan worden gemaakt
      van de lagere vaststelling, intrekking of wijziging als hiervoor bedoeld;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 27.1.c
    text: |-
      de aard van de gedragingen die tot maatregelen als bedoeld in onderdelen a en b hebben geleid en, in geval van
      maatregelen als bedoeld in onderdeel b, het subsidiebedrag dat daarmee is gemoeid;
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel27
  - number: 27.1.d
    text: |-
      de naam- en adresgegevens van de subsidie-ontvanger jegens wie de maatregelen als bedoeld in de onderdelen a en
      b getroffen.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel27
  - number: '27.2'
    text: |-
      De registratie kan worden geraadpleegd door daartoe door Onze Minister aangewezen ambtenaren die zich bezighouden
      met het verstrekken van subsidies op het terrein van het Ministerie van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel27
  - number: '27.3'
    text: |-
      De registratie van gegevens vindt plaats voor de duur van drie jaar na de datum van registratie, waarna de
      betreffende gegevens uit de registratie worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel27
  - number: '27.4'
    text: |-
      Indien blijkt dat een aanvrager in de in het eerste lid bedoelde registratie is opgenomen kan Onze Minister aan
      de geregistreerde gegevens gevolgtrekkingen verbinden bij de beoordeling van de aanvraag, de in het kader van de
      subsidieverstrekking op te leggen verplichtingen en de controle op de naleving van die verplichtingen.
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel27
  - number: '29'
    text: |-
      Het [Besluit milieusubsidies][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010065
    url: https://wetten.overheid.nl/BWBR0036381/2015-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010065
  - number: '30'
    text: |-
      In afwijking van de [artikelen 2 tot en met 26][ref1] gelden voor subsidies verstrekt op basis
      van algemene maatregelen van bestuur en ministeriële regelingen die voor 1 juli 2015 zijn
      vastgesteld op basis van de [Wet Milieubeheer][ref2], de [Wet ruimtelijke ordening][ref3] of de
      [Kaderwet subsidies Verkeer en Waterstaat][ref4], en vallend onder het toepassingsgebied van de [wet][ref5], de in
      dat besluit of in die regeling opgenomen bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0020449
