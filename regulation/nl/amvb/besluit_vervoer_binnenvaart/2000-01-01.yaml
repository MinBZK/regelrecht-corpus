  - number: '8'
    text: |-
      Op een aanvraag tot het geven van een beschikking als bedoeld in
      [artikel 7, eerste lid, onderdelen a tot en met j, en n tot en met q][ref1], met uitzondering van de aanvraag tot
      kennisneming van de geregistreerde gegevens, beslist Onze Minister binnen vier weken. De aanvraag tot kennisneming
      van de geregistreerde gegevens heeft een beslistermijn van twee weken. Indien de aanvraag een beschikking als
      bedoeld in [artikel 7, eerste lid, onderdeel l of m][ref2], betreft, geldt een beslistermijn van acht weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005503#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005503#Artikel7
