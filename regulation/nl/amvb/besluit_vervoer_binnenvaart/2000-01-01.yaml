    text: |-
      Als bewijs dat is voldaan aan de eis van vakbekwaamheid, bedoeld in [artikel 11, tweede lid][ref1], van de wet is
      overlegging vereist van:

      a. een door Onze Minister aangewezen vakdiploma;

      b. een door Onze Minister aangewezen bewijsstuk respectievelijk verklaring als bedoeld in
      [artikel 11, vierde lid][ref2], van de wet; of

      c. een door Onze Minister aangewezen geëigend document als bedoeld in [artikel 20, eerste lid, onderdeel ][ref3],
      van de wet.


