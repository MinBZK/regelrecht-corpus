  - number: '7'
    text: |-
      1 Aanvragen tot het geven van de volgende beschikkingen worden ingediend bij Onze Minister:

      a. afgifte van een Rijnvaartverklaring als bedoeld in [artikel 5, eerste lid][ref1], van de wet;

      b. afgifte van een bewijs van toelating als bedoeld in [artikel 6, eerste lid][ref2], van de wet;

      c. afgifte van een gewaarmerkt afschrift van een Rijnvaartverklaring als bedoeld in artikel 56, tweede lid,
      onderdeel , van de wet;

      d. afgifte van een gewaarmerkt afschrift van een bewijs van toelating als bedoeld in artikel 56, tweede lid,
      onderdeel , van de wet;

      e. verlening, wijziging of intrekking van een vergunning als bedoeld in [artikel 11, eerste lid][ref3], van de wet;

      f. verlening, wijziging of intrekking van een vergunning voor voortzetting van het beroepsvervoer van goederen als
      bedoeld in [artikel 17, eerste lid][ref4], onderscheidenlijk [artikel 18, eerste lid][ref5], van de wet;

      g. afgifte van een gewaarmerkt afschrift van een vergunning als bedoeld in artikel 56, tweede lid, onderdeel , van
      de wet;

      h. verlening van een ontheffing van de eis van vakbekwaamheid, bedoeld in [artikel 11, tweede lid][ref6], van de
      wet;

      i. afgifte of wijziging van een vergunningbewijs als bedoeld in [artikel 22][ref7] van de wet;

      j. afgifte van een gewaarmerkt afschrift van een vergunningbewijs als bedoeld in artikel 56, tweede lid,
      onderdeel , van de wet;

      k.

      l. verlening of doorhaling van een inschrijving eigen vervoer als bedoeld in artikel 41, eerste lid, van de wet;

      m. voortzetting of doorhaling van een inschrijving eigen vervoer als bedoeld in artikel 45, eerste lid, van de wet;

      n. afgifte van een gewaarmerkt afschrift van een inschrijving eigen vervoer als bedoeld in artikel 56, tweede lid,
      onderdeel , van de wet;

      o. afgifte of wijziging van een inschrijvingsbewijs als bedoeld in artikel 46, eerste lid, van de wet;

      p. afgifte van een gewaarmerkt afschrift van een inschrijvingsbewijs als bedoeld in artikel 56, tweede lid,
      onderdeel , van de wet;

      q. kennisneming en verbetering van de geregistreerde gegevens, bedoeld in artikel 54, onderdeel , van de wet.

      2 De aanvragen, bedoeld in het eerste lid, onderdelen *a* tot en met *p* alsmede [onderdeel ][ref8], voor zover
      sprake is van aanvragen tot verbetering van de geregistreerde gegevens, worden aangemerkt als aanvragen om
      registratie respectievelijk wijziging van die registratie als bedoeld in artikel 54, onderdeel , van de wet.


