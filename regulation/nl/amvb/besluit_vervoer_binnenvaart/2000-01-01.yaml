  - number: '14'
    text: |-
      1 Een Rijnvaartverklaring als bedoeld in [artikel 5, eerste lid][ref1], van de wet wordt afgegeven, indien wordt
      voldaan aan de eisen gesteld in [artikel 3][ref2] tot en met 5 van de bijlage bij [Verordening (EEG) nr. 2919/85]
      (31985R2919).

      2 Onze Minister kan in het geval dat een Rijnvaartverklaring als bedoeld in [artikel 5, eerste lid][ref3], van
      de wet, wordt aangevraagd in verband met het verrichten van vervoer in andere gevallen dan vervoer tussen twee
      punten gelegen aan de wateren, bedoeld in artikel 4, eerste lid, van de Herziene Rijnvaartakte, uitzonderingen
      toestaan wat betreft de eis van meerderheid, bedoeld in [artikel 3, eerste lid, onderdeel ][ref4]*cc*, alsmede
      artikel 3, tweede lid, van de bijlage bij [Verordening (EEG) nr. 2919/85](31985R2919), op voorwaarde dat het doel
      van Aanvullend Protocol nr. 2 bij de Herziene Rijnvaartakte niet in gevaar wordt gebracht en hij tevens de door de
      Centrale Commissie voor de Rijnvaart vastgestelde algemene voorwaarden, bedoeld in artikel 3, vierde lid, van de
      bijlage bij [Verordening (EEG) nr. 2919/85](31985R2919), overeenkomstig toepast.

      3 Onze Minister kan regels geven omtrent de toepassing van het verbod, bedoeld in [artikel 9, eerste lid][ref5],
      van de wet, op transitvervoer.


