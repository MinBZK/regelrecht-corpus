    text: |-
      1 Onze Minister kan op aanvraag ontheffing verlenen van de eis van vakbekwaamheid, bedoeld in
      [artikel 11, tweede lid][ref1], van de wet aan een persoon die aantoonbaar beschikt over een praktijkervaring van
      ten minste drie jaar in het dagelijks beheer van de betrokken onderneming, indien sprake is van een bijzonder geval
      als bedoeld in [artikel 4, tweede lid][ref2], van [Richtlijn 87/540/EEG](31987L0540).

      2 Indien een ontheffing als bedoeld in het eerste lid wordt verleend, wordt de ontheffing vermeld in de vergunning.


