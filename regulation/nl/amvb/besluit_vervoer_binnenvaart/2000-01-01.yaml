  - number: '27'
    text: >-
      Onze Minister geeft regels omtrent de bescherming van de geregistreerde gegevens, bedoeld in artikel 54,
      onderdeel , van de wet.
    url: https://wetten.overheid.nl/BWBR0005503/2000-01-01#Artikel27
  - number: '28'
    text: >-
      Onze Minister geeft regels omtrent de verstrekking van gegevens betreffende het vervoer als bedoeld in artikel 57
      van de wet.
    url: https://wetten.overheid.nl/BWBR0005503/2000-01-01#Artikel28
  - number: '30'
    text: >-
      Een inschrijving eigen vervoer ten aanzien van een binnenschip, dat de ingeschrevene niet in eigendom heeft, wordt
      op diens aanvraag telkenmale voor een jaar verleend, indien:


      a. de huurovereenkomst ter zake van het betrokken binnenschip vóór 1 april 1982 is gesloten en op het tijdstip
      waarop de inschrijving wordt verleend van kracht is; en


      b. het brandmerk, het laadvermogen en de eigenaar danwel eigenaren van het betrokken binnenschip dezelfde zijn
      gebleven.
    url: https://wetten.overheid.nl/BWBR0005503/2000-01-01#Artikel30
  - number: '33'
    text: 'Dit besluit kan worden aangehaald als: Besluit vervoer binnenvaart.'
    url: https://wetten.overheid.nl/BWBR0005503/2000-01-01#Artikel33
