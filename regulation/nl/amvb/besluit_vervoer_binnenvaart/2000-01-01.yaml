        artikel: '1'
  - number: '2'
    text: |-
      De wet is niet van toepassing op:

      a. binnenschepen met een laadvermogen van minder dan twintig metrieke ton dan wel met een waterverplaatsing van
      minder dan tien m3;

      b. binnenschepen met een permanente ligplaats;

      c. binnenschepen met een nagenoeg permanente ligplaats, voor zover deze binnenschepen voor speciale doeleinden
      worden gebruikt;

      d. bunkerstations, drijvende werktuiglijke inrichtingen en in aanbouw zijnde binnenschepen;

      e. binnenschepen die worden gebruikt voor het vervoer van personen, voor zover niet sprake is van beroepsvervoer;

      f. binnenschepen die worden gebruikt door of ten behoeve van de openbare dienst, voor zover niet sprake is van
      beroepsvervoer van goederen;

      g. overzetveren als bedoeld in de [Verenwet][ref1] (*Stb.* 1921, 838);

      en

      h. vissersschepen en bunschepen, voor zover deze binnenschepen worden gebruikt voor het vervoer van vis als bedoeld
      in de [Visserijwet 1963][ref2] (*Stb.* 312).


      [ref1]: https://wetten.overheid.nl/BWBR0001905
      [ref2]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0005503/2000-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001905
      - id: ref2
        bwb_id: BWBR0002416
  - number: '3'
    text: >-
      Onze Minister kan ter uitvoering van verdragen de wet geheel of gedeeltelijk niet van toepassing verklaren op
      bepaalde vormen van vervoer met binnenschepen, soorten binnenschepen, vervoer op bepaalde binnenwateren of vervoer
      onder bepaalde omstandigheden.
    url: https://wetten.overheid.nl/BWBR0005503/2000-01-01#Artikel3
  - number: '4'
    text: >-
      De wet is niet van toepassing op schepen, welke zowel voor de vaart op zee als op de binnenwateren kunnen worden
      gebruikt, voor zover deze schepen vervoer tussen twee punten verrichten waarbij gedeeltelijk over zee wordt
      gevaren.
    url: https://wetten.overheid.nl/BWBR0005503/2000-01-01#Artikel4
  - number: '5'
    text: |-
      Het bepaalde in [hoofdstuk 2][ref1], tweede, vierde en zesde afdeling, van de wet is niet van toepassing op:

      a. vervoer met binnenschepen waarvan het laadvermogen niet meer dan tweehonderd metrieke ton bedraagt en:

      1°. het dek zodanig is aangebracht dat uitsluitend of nagenoeg uitsluitend bovendeks lading kan worden vervoerd,
      voor zover:

      - het begin- en eindpunt van het vervoer zijn gelegen binnen dezelfde gemeente; of
      - het begin- en eindpunt van het vervoer zijn gelegen binnen eenzelfde havengebied;

      2°. welke zijn voorzien van bodemkleppen in het laadruim of zijn ingericht als splijtbakken, voor zover deze
      binnenschepen worden gebruikt voor het vervoer van zand, grint, klei en soortgelijke goederen naar een stortplaats
      op de binnenwateren, alsmede voor het vervoer van uitrustingsstukken van baggermateriaal;

      3°. welke zijn voorzien van luchtkasten en een beuninhoud hebben, die zich ten opzichte van het laadvermogen
      minimaal als 1:1,6 en maximaal als 1:1,7 verhoudt, voor zover deze binnenschepen worden gebruikt voor het vervoer
      naar en van een werkobject, waarbij degene die het vervoer verricht dezelfde dient te zijn als degene die het
      werkobject uitvoert;

      4°. welke zijn ingericht voor bergingswerkzaamheden, voor zover deze binnenschepen worden gebruikt voor
      bergingswerk;

      5°. welke zijn ingericht voor het zuigen van schelpen, voor zover deze binnenschepen worden gebezigd voor het
      vervoer van de door deze schepen zelf opgezogen schelpen;

      6°. welke worden gebruikt door baggerbedrijven bij de uitvoering van waterbouwkundige werken, voor zover deze
      binnenschepen ter plaatse daarvan worden gebruikt;

      7°. welke worden gebruikt voor het vervoer van drinkwater; of

      8°. welke worden gebruikt voor het vervoer van koopwaren, waarmee op de binnenwateren ten behoeve van schepen of
      hun opvarenden handel wordt gedreven, mits uit een desbetreffend uittreksel uit het Handelsregister van de Kamer
      van Koophandel blijkt dat vorengenoemde handel door de in het Handelsregister vermelde persoon of onderneming wordt
      verricht en deze een vergunning voor het uitoefenen van de algemene ambulante handel of een ventvergunning heeft;

      b. vervoer van:

      1°. bagage van reizigers met binnenschepen die worden gebruikt voor het beroepsvervoer van personen;

      2°. goederen, behorende tot de uitrusting of inrichting van het binnenschip, waarmede zij worden vervoerd;

      3°. aan de vervoerder toebehorende goederen mits het totale gewicht van die goederen 25 000 kg niet te boven gaat
      en de goederen voor eigen gebruik bestemd zijn;

      c. vervoer met andere binnenschepen, dan bedoeld in [de onderdelen ][ref2] en [][ref3], waarvan het laadvermogen
      niet meer dan vijftig metrieke ton bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005503#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005503#Artikel5
