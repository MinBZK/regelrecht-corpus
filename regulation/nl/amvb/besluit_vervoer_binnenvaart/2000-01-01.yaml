    text: |-
      [Hoofdstuk 2, tweede afdeling, paragraaf 2](onbekend), en [zesde afdeling, van de wet][ref1] is niet van toepassing
      op sleep- en duwboten.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Afdeling6
