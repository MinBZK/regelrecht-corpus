  - number: '25'
    text: |-
      1 Een inschrijving eigen vervoer als bedoeld in artikel 41, eerste lid, van de wet wordt door Onze Minister
      verleend indien:

      a. er een rechtstreeks verband bestaat tussen het verrichten van eigen vervoer en de overige bedrijfs- of
      ondernemingsactiviteiten, waarbij wordt voldaan aan de navolgende voorwaarden:

      1°. het eigen vervoer vormt een onlosmakelijk onderdeel van het productieproces van degene op wiens naam de
      goederen worden vervoerd of van de bedrijfs- of ondernemingsactiviteiten, die voor eigen rekening en risico met
      betrekking tot de desbetreffende goederen worden uitgeoefend door degene op wiens naam de goederen worden vervoerd;
      en

      2°. het eigen vervoer vormt in het geheel van de bedrijfs- of ondernemingsactiviteiten geen hoofdactiviteit, maar
      een werkzaamheid van ondersteunende aard ten behoeve van de hoofdactiviteit in die zin dat het voortbestaan van de
      onderneming in redelijkheid niet afhankelijk is van de eigen vervoeractiviteiten per binnenschip;

      b. degene die het eigen vervoer verricht, gedurende een periode, die langer is dan de periode waarbinnen het
      vervoer plaatsheeft, de voortdurende en uitsluitende beschikking heeft over de te vervoeren goederen;

      c. het bij het eigen vervoer te gebruiken binnenschip of binnenschepen eigendom is danwel zijn van de aanvrager
      of gedurende een termijn van tenminste een jaar op basis van een huurovereenkomst of overeenkomst tot huurkoop
      uitsluitend ter beschikking staat van de aanvrager; en

      d. het bij het eigen vervoer te gebruiken binnenschip of binnenschepen wordt bemand danwel worden bemand door de
      aanvrager of door personeel in loondienst van de aanvrager.

      2 De huurovereenkomst, bedoeld in het eerste lid, onderdeel *c*, wordt gesloten na tussenkomst van of namens Onze
      Minister alsmede te voldoen met inachtneming van de navolgende voorwaarden:

      1°. de aanvraag tot het huren van een binnenschip wordt ingediend bij Onze Minister;

      2°. de in de aanvraag gestelde eisen en voorwaarden zijn van redelijke aard;

      3°. de aanvraag wordt gedurende twee weken ter inzage gelegd ten kantore van de Rijksverkeersinspectie;

      4°. door of namens Onze Minister wordt een binnenschip met een vergunningbewijs dat door een vergunninghouder is
      aangemeld en dat aan de eisen en voorwaarden, bedoeld [onder 2°][ref1], voldoet, toegewezen aan de aanvrager;
      indien meerdere binnenschepen zijn aangemeld, heeft de toewijzing plaats door loting;

      5°. in de huurovereenkomst van het binnenschip wordt rekening gehouden met de kostprijselementen welke voor het
      betrokken vervoer van toepassing zijn.

      3 Indien sprake is van een huurovereenkomst als bedoeld in het eerste lid, onderdeel *c*, wordt een inschrijving
      eigen vervoer als bedoeld in artikel 41, eerste lid, van de wet door Onze Minister verleend voor een periode, die
      gelijk is aan de duur van die huurovereenkomst met inachtneming van het bepaalde in het eerste lid, onderdeel *c*.


