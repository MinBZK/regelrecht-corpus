articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Wet vervoer binnenvaart][ref1];

      b. Lid-Staat: staat, lid van de Europese Gemeenschappen;

      c. [Richtlijn 87/540/EEG](31987L0540): [Richtlijn 87/540](31987L0540) van de Raad van de Europese Gemeenschappen
      van 9 november 1987 betreffende de toegang tot het beroep van ondernemer van nationaal en internationaal
      goederenvervoer over de binnenwateren en inzake de onderlinge erkenning van dit beroep betreffende diploma's,
      certificaten en andere titels (*PbEG* L 322/20);

      d. [Verordening (EEG) nr. 2919/85](31985R2919): [Verordening (EEG) nr. 2919/85](31985R2919) van de Raad van de
      Europese Gemeenschappen van 17 oktober 1985, houdende vaststelling van de voorwaarden waaraan moet worden voldaan
      om in aanmerking te komen voor het regime dat door de Herziene Rijnvaartakte wordt gereserveerd voor de vaartuigen
      die tot de Rijnvaart behoren (*PbEG* L 280/4);

      e. binnenwateren: de wateren, die in Nederland zijn gelegen binnen een langs de kust gaande lijn, bedoeld in
      [artikel 1, eerste lid, onderdeel ][ref2] (*Stb.* 1981, 678), en vastgesteld bij koninklijk besluit van 2 juni 1982
      (*Stb.* 1982, 363).


      [ref1]: https://wetten.overheid.nl/BWBR0005319
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel1
    url: https://wetten.overheid.nl/BWBR0005503/2000-01-01#Artikel1
    references:
      - id: ref1
