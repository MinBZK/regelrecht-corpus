preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 28 oktober 1991, nr. WJZ/V125647, Directoraat-
    Generaal voor het Vervoer;


    Gelet op de artikelen 1, onderdeel c, 2, derde lid, 5, eerste lid, 7, 8, 9, tweede lid, 11, eerste en vierde lid,
    19, 20, tweede en vierde lid, 24, 25, 26, 27, eerste lid, 33, 39, 41, tweede lid, 42, eerste lid, 47, 54 en 57 van
    de Wet vervoer binnenvaart (Stb. 1991, 711);


    Gezien het advies van de Adviescommissie Goederenvervoer, bedoeld in artikel 6 van de Wet Goederenvervoer
    Binnenscheepvaart (Stb. 1951, 472);


    De Raad van State gehoord (advies van 17 maart 1992, no. W09.91.0594);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 29 april 1992, WJZ/V222249, Directoraat-
    Generaal voor het Vervoer, Stafafdeling Wetgeving en Juridische Zaken;


    Hebben goedgevonden en verstaan:
