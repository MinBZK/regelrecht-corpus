  - number: '26'
    text: |-
      1 In het geval de vervoers- en overige ondernemingsactiviteiten, bedoeld in
      [artikel 25, eerste lid, onderdeel ][ref1], zijn ondergebracht in verschillende, juridisch gescheiden eenheden of
      ondernemingen wordt, onverminderd het bepaalde in [artikel 25][ref2], een inschrijving eigen vervoer als bedoeld
      in artikel 41, eerste lid, van de wet door Onze Minister verleend indien de betrokken ondernemingen in financieel,
      organisatorisch en economisch opzicht zodanig zijn verweven dat zij als onderdelen van dezelfde organisatie
      beschouwd kunnen worden.

      2 De aanvrager moet de verwevenheid, bedoeld in het eerste lid, aantonen:

      a. door overlegging van een verklaring dat de betrokken ondernemingen als één ondernemer worden aangemerkt in de
      zin van [artikel 7, vierde lid, van de Wet op de Omzetbelasting 1968][ref3] (*Stb.* 329);

      b. door overlegging van een beschikking op basis van [artikel 15 van de Wet op de Vennootschapsbelasting 1969][ref4]
      (*Stb.* 469) waarbij de betrokken ondernemingen tezamen als één fiscale eenheid worden aangemerkt;

      c. danwel op andere wijze.

      3 In het geval dat het eerste lid van toepassing is, staat danwel staan, in afwijking van het bepaalde in artikel
      61, eerste lid, onderdeel , het bij het eigen vervoer te gebruiken binnenschip of binnenschepen uitsluitend
      ter beschikking van de gescheiden juridische eenheden of ondernemingen, welke in financieel, organisatorisch en
      economisch opzicht zodanig zijn verweven dat zij als onderdelen van dezelfde organisatie beschouwd kunnen worden.


