      Onder een overeenkomstig bewijsstuk als bedoeld in [artikel 26][ref1] van de wet, wordt verstaan een door de
      bevoegde autoriteit van een andere Lid-Staat, van een van de overige Staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte of van Zwitserland afgegeven en door Onze Minister aangewezen:

      a. document dat vergelijkbaar is met de vergunning, bedoeld in [artikel 11, eerste lid][ref2], van de wet;

      b. document dat vergelijkbaar is met het vergunningbewijs, bedoeld in [artikel 22][ref3] van de wet; of

      c. attest als bedoeld in [artikel 3][ref4] van [Richtlijn 87/540/EEG](31987L0540).


