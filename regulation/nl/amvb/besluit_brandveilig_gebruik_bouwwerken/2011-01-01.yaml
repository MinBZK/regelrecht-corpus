  - number: 1.3.9
    text: |-
      Op een overige gebruiksfunctie met een gebruiksoppervlakte van ten hoogste 50 m2 die niet voor het publiek
      toegankelijk is en op een lichte industriefunctie is [artikel 2.3.7][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel1.3
    references:
      - id: ref1
