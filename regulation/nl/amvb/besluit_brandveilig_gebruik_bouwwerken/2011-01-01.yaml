articles:
  - number: 1.1.1
    text: |-
      Voor de toepassing van de bij of krachtens dit besluit gegeven voorschriften wordt verstaan onder: - *ADR-klasse:*
      classificatie als bedoeld in de op 30 september 1957 te Genève tot stand gekomen Europese overeenkomst betreffende
      het internationale vervoer van gevaarlijke goederen over de weg (Trb. 1959, 171);
        - *brandcompartiment:* brandcompartiment als bedoeld in het [Bouwbesluit 2003][ref1];
        - *brandgevaarlijke stof:* vaste, vloeibare of gasvormige stof die brandbaar of brandbevorderend is of bij brand
      gevaar oplevert;
        - *brandweerlift:* brandweerlift als bedoeld in het [Bouwbesluit 2003][ref2];
        - *brutovloeroppervlakte:* brutovloeroppervlakte als bedoeld in NEN 2580;
        - *gebruiksfunctie:* gebruiksfunctie als bedoeld in het [Bouwbesluit 2003][ref3];
        - *gebruiksmelding:* melding als bedoeld in [artikel 2.12.1, eerste lid][ref4];
        - *gebruiksoppervlakte:* gebruiksoppervlakte als bedoeld in NEN 2580;
        - *meetniveau:* meetniveauals bedoeld in het [Bouwbesluit 2003][ref5];
        - *milieugevaarlijke stoffen:* gevaarlijke stoffen als bedoeld in het
      [Besluit algemene regels voor inrichtingen milieubeheer][ref6];
        - *NEN:* door de Stichting Nederlands Normalisatie-instituut uitgegeven norm;
        - *nevenfunctie:* nevenfunctie als bedoeld in het [Bouwbesluit 2003][ref7];
        - *nooddeur:* nooddeur als bedoeld in het [Bouwbesluit 2003][ref8];
        - *subbrandcompartiment:* subbrandcompartiment als bedoeld in het [Bouwbesluit 2003][ref9];
        - *verblijfsruimte:* verblijfsruimte als bedoeld in het [Bouwbesluit 2003][ref10];
        - *verkeersroute:* verkeersroute als bedoeld in het [Bouwbesluit 2003][ref11];
        - *verpakkingsgroep:* verpakkingsgroep als bedoeld in de op 30 september 1957 te Genève tot stand gekomen Europese
      overeenkomst betreffende het internationale vervoer van gevaarlijke goederen over de weg (Trb. 1959, 171);
        - *vluchtroute:* voor het vluchten bij brand bestemde route die uitsluitend voert over vloeren, trappen en
      hellingbanen en eindigt op een veilige plaats, zonder dat gebruik behoeft te worden gemaakt van een lift;
        - *wet:* [Woningwet][ref12];
        - *wooneenheid:* gedeelte van een woonfunctie voor een individueel huishouden bij kamergewijze verhuur;
        - *woonfunctie voor kamergewijze verhuur:* woonfunctie voor het bedrijfsmatig verschaffen van woonverblijf aan meer
      dan een huishouden en aan meer dan vier personen.


