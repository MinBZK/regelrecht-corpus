  - number: 1.3.8
    text: |-
      Op een niet in een logiesgebouw gelegen logiesfunctie en een nevenfunctie daarvan zijn de [artikelen 2.1.3][ref1],
      [2.1.4][ref2], [2.2.1, vierde lid][ref3], [2.3.1][ref4], [2.3.2][ref5], [2.3.5, eerste lid][ref6], [2.3.7][ref7],
      [2.3.10][ref8], [2.3.11][ref9], [2.4.2][ref10], [2.4.3][ref11] en [2.8.1][ref12] en [paragraaf 2.12][ref13] niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
