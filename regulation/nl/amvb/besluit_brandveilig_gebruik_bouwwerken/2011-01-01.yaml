  - number: 1.1.3
    text: |-
      Voor de toepassing van de bij of krachtens dit besluit gegeven voorschriften wordt onder bouwwerk mede verstaan
      delen van een bouwwerk die zijn ontworpen of aangepast om afzonderlijk te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel1.1
  - number: 1.2.1
    text: |-
      Bij of krachtens dit besluit wordt een gedeelte van een bouwwerk, een ruimte of een voorziening, die ten dienste
      staat van meer dan een gebruiksfunctie, aangeduid als gemeenschappelijk. Een zodanig gedeelte, zodanige ruimte
      of zodanige voorziening maakt met uitzondering van een gedeelte van een nevenfunctie, voor de toepassing van dit
      besluit deel uit van ieder van de betrokken gebruiksfuncties.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel1.2
  - number: 1.2.2
    text: |-
      Bij of krachtens dit besluit wordt een niet-gemeenschappelijk gedeelte van een woonfunctie, een ruimte of een
      voorziening, die ten dienste staat van meer dan een wooneenheid, aangeduid als gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel1.2
  - number: 1.3.1
    text: |-
      De bij of krachtens dit besluit gegeven voorschriften zijn van toepassing op elk gebruik van een bouwwerk, tenzij
      bij het desbetreffende voorschrift anders is aangegeven.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel1.3
  - number: 1.3.2
    text: |-
      Op een gemeenschappelijke ruimte van een in een woongebouw gelegen woonfunctie voor zorg en een nevenfunctie
      daarvan zijn de [artikelen 2.2.1, vierde lid][ref1], [2.3.7][ref2] en [2.8.1][ref3] niet van toepassing.


