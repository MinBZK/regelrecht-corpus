        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 1.3.10
    text: |-
      Op een bouwwerk geen gebouw zijnde, niet zijnde een tunnel met een tunnellengte van meer dan 250 m, is
      [artikel 2.3.7][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 1.4.1
    text: |-
      Aan een in [paragraaf 2.1 tot en met 2.9][ref1] gesteld voorschrift behoeft niet te worden voldaan indien het
      gebruik van een bouwwerk anders dan door toepassing van het desbetreffende voorschrift ten minste dezelfde mate van
      brandveiligheid biedt als is beoogd met het betrokken voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0024379
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 1.4.2
    text: |-
      De eigenaar van een bouwwerk dan wel degene die uit anderen hoofde daartoe het meest aangewezen is, maakt
      desgevraagd voldoende aannemelijk dat een in het eerste lid bedoelde gelijkwaardige oplossing in stand wordt
      gehouden.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel1.4
  - number: 1.5.1
    text: |-
      Onze Minister kan ten behoeve van experimenten tijdelijk van de in dit besluit gegeven voorschriften afwijken of
      afwijking daarvan toestaan.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel1.5
  - number: 1.5.2
    text: |-
      Onze Minister maakt geen gebruik van de in het eerste lid bedoelde bevoegdheid dan nadat het bevoegd gezag in de
      gelegenheid is gesteld zijn zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel1.5
  - number: 1.5.3
    text: De tijdsduur van een afwijking als bedoeld in het eerste lid bedraagt ten hoogste 24 maanden.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel1.5
  - number: 1.5.4
    text: |-
      Onze Minister zendt drie maanden voor het verstrijken van de in het derde lid bedoelde termijn een verslag over de
      doeltreffendheid en de effecten van het experiment in de praktijk aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel1.5
  - number: 1.5.5
    text: Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de uitvoering van een experiment.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel1.5
  - number: 2.1.1.1
    text: |-
      Een voorziening voor elektriciteit als bedoeld in [afdeling 2.7 van het Bouwbesluit 2003][ref1] wordt niet gebruikt
      op een wijze die gevaar oplevert voor het ontstaan van brand.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Afdeling2.7
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0012727
        afdeling: '2.7'
  - number: 2.1.1.2
    text: |-
      In een ruimte waarin een of meer verbrandingstoestellen met een totale nominale belasting van meer dan 130
      kW aanwezig zijn of een gemeenschappelijk stook- of warmwatertoestel aanwezig is zijn geen brandbare goederen
      opgeslagen of opgesteld.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.1
  - number: 2.1.1.3
    text: |-
      Een opening ten behoeve van de toevoer van verbrandingslucht of de afvoer van rook is niet afgesloten tijdens het
      gebruik van een daarop aangewezen verbrandingstoestel.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.1
  - number: 2.1.1.4
    text: |-
      Een verbrandings- of verwarmingsinstallatie wordt niet gebruikt indien de installatie, de opstelling of het gebruik
      daarvan gevaar oplevert voor het ontstaan van brand. Bij een verbrandingsinstallatie is dat gevaar niet aanwezig
      indien de installatie, de opstelling en het gebruik daarvan voldoen aan de brandveiligheidsvoorschriften van NEN
      3028: 2004.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.1
  - number: 2.1.1.5
    text: 'Een voorziening voor de afvoer van rook wordt uitsluitend gebruikt indien die voorziening:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.1
  - number: 2.1.1.5.a
    text: doeltreffend is gereinigd;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.1
  - number: 2.1.1.5.b
    text: na brand voldoende is gereinigd en hersteld;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.1
  - number: 2.1.1.5.c
    text: bij gebruik geen gevaar voor de veiligheid van personen oplevert.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.1
  - number: 2.1.2.1
    text: 'Het is verboden te roken of open vuur te hebben:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.2
  - number: 2.1.2.1.a
    text: in een ruimte die is bestemd voor de opslag van een brandgevaarlijke stof;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.2
  - number: 2.1.2.1.b
    text: bij het verrichten van een handeling die het uitstromen van een brandgevaarlijke stof kan veroorzaken;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.2
  - number: 2.1.2.1.c
    text: bij het vullen van een brandstofreservoir met een brandgevaarlijke stof.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.2
  - number: 2.1.2.2
    text: |-
      Het verbod, bedoeld in het eerste lid, wordt duidelijk zichtbaar aangegeven door het aanbrengen van een
      gestandaardiseerd symbool overeenkomstig NEN 3011: 2004.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.2
  - number: 2.1.3.1
    text: 'Aankleding in een besloten ruimte mag geen brandgevaar opleveren. Dit gevaar is niet aanwezig indien:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.3
  - number: 2.1.3.1.a
    text: de aankleding een navlamduur heeft van ten hoogste 15 seconden en een nagloeiduur van ten hoogste 60 seconden;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.3
  - number: 2.1.3.1.b
    text: de aankleding onbrandbaar is, of
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.3
  - number: 2.1.3.1.c
    text: de aankleding een ondergeschikte bijdrage aan het brandgevaar levert.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.3
  - number: 2.1.3.2
    text: |-
      De verticale vrije ruimte tussen de vloer van een besloten ruimte voor het verblijven of het vluchten van meer dan
      50 personen en niet op de vloer aangebrachte aankleding is ten minste 2,5 m, tenzij:
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.3
  - number: 2.1.3.2.a
    text: de aankleding onbrandbaar is;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.3
  - number: 2.1.3.2.b
    text: de aankleding een ondergeschikte bijdrage aan het brandgevaar levert, of
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.3
  - number: 2.1.3.2.c
    text: de aankleding zich bevindt boven een gedeelte van een vloer waar zich geen personen behoren te bevinden.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.3
  - number: 2.1.3.3
    text: |-
      De aankleding in een besloten ruimte mag bij brand geen druppelvorming geven boven een gedeelte van een vloer
      bestemd voor gebruik door personen.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.3
  - number: 2.1.3.4
    text: |-
      Bij apparatuur en installaties die warmte ontwikkelen mag, ter voorkoming van brand, de temperatuur van een
      gedeelte dat in aanraking kan komen met de aankleding van een besloten ruimte, niet hoger worden dan 90 °C. Dit
      geldt niet voor zover de aankleding onbrandbaar is.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.3
  - number: 2.1.3.5
    text: In een besloten ruimte zijn geen met brandbaar gas gevulde ballonnen aanwezig.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.3
  - number: 2.1.4.1
    text: |-
      In een voor publiek toegankelijke ruimte opgestelde stands, kramen, schappen, podia en andere inrichtingselementen
      zijn brandveilig.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.4
  - number: 2.1.4.2
    text: |-
      Aan het in het eerste lid gestelde is voldaan indien een naar de lucht toegekeerd onderdeel van het
      inrichtingselement:
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.4
  - number: 2.1.4.2.a
    text: 'onbrandbaar is, bepaald volgens NEN 6064: 1991, inclusief wijzigingsblad A2: 2001;'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.4
  - number: 2.1.4.2.b
    text: |-
      een dikte heeft van ten minste 3,5 mm, en voldoet aan klasse 4 als bedoeld in NEN 6065: 1991, inclusief
      wijzigingsblad A1: 1997, of
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.4
  - number: 2.1.4.2.c
    text: |-
      een dikte heeft van minder dan 3,5 mm en over de volle oppervlakte is verlijmd met een onderdeel als bedoeld onder
      b.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.4
  - number: 2.1.5
    text: |-
      Een zelfsluitend constructieonderdeel als bedoeld in de [artikelen 2.107][ref1], [2.114][ref2], [2.119][ref3] en
      [2.124 van het Bouwbesluit 2003][ref4] mag niet in geopende stand zijn vastgezet, tenzij het constructieonderdeel
      bij brand automatisch wordt losgelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012727#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012727#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0012727#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0012727
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012727
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0012727
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0012727
        artikel: '2'
  - number: 2.1.6
    text: |-
      Na het aanbrengen of wijzigen van een kabel-, leiding- of andere doorvoer in of door een scheidingsconstructie
      waarvoor op grond van de [afdelingen 2.13][ref1], [2.14][ref2], [2.19][ref3], [2.22][ref4] en
      [2.23 van het Bouwbesluit 2003][ref5] een eis met betrekking tot de weerstand tegen branddoorslag en brandoverslag
      geldt, wordt de weerstand tegen branddoorslag en brandoverslag van de scheidingsconstructie op adequate wijze
      gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Afdeling2.13
      [ref2]: https://wetten.overheid.nl/BWBR0012727#Afdeling2.14
      [ref3]: https://wetten.overheid.nl/BWBR0012727#Afdeling2.19
      [ref4]: https://wetten.overheid.nl/BWBR0012727#Afdeling2.22
      [ref5]: https://wetten.overheid.nl/BWBR0012727#Afdeling2.23
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.6
    references:
      - id: ref1
        bwb_id: BWBR0012727
        afdeling: '2.13'
      - id: ref2
        bwb_id: BWBR0012727
        afdeling: '2.14'
      - id: ref3
        bwb_id: BWBR0012727
        afdeling: '2.19'
      - id: ref4
        bwb_id: BWBR0012727
        afdeling: '2.22'
      - id: ref5
        bwb_id: BWBR0012727
        afdeling: '2.23'
  - number: 2.1.7
    text: |-
      Onderdelen van de bouwconstructie als bedoeld in het [Bouwbesluit 2003][ref1] die uitsluitend met een aanvullende
      behandeling kunnen voldoen aan de in het [Bouwbesluit 2003][ref2] gestelde eisen met betrekking tot brandveiligheid
      zijn voorzien van een geldig door het bevoegd gezag aanvaard document waaruit blijkt dat deze aanvullende
      behandeling adequaat is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0012727
      [ref2]: https://wetten.overheid.nl/BWBR0012727
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.7
    references:
      - id: ref1
        bwb_id: BWBR0012727
      - id: ref2
        bwb_id: BWBR0012727
  - number: 2.1.8.1
    text: In, op of nabij een bouwwerk is geen in tabel 2.1.8 aangewezen brandgevaarlijke stof aanwezig.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.8.2
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.8.2.a
    text: |-
      de in tabel 2.1.8 aangegeven toegestane hoeveelheid per stof niet wordt overschreden, met dien verstande dat de
      totale toegestane hoeveelheid stoffen 100 kilogram of liter is;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.8.2.b
    text: 'de stof deugdelijk is verpakt, waarbij:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.8.2.b.1
    text: de verpakking tegen normale behandeling bestand is,
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.8.2.b.2
    text: de verpakking is voorzien van een adequate gevaarsaanduiding, en
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.8.2.b.3
    text: geen inhoud onvoorzien uit de verpakking kan ontsnappen, en
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.8.2.c
    text: de stof wordt gebruikt met inachtneming van de op de verpakking aangegeven gevaarsaanduidingen.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.8.3
    text: 'Het eerste lid is voorts niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.8.3.a
    text: brandstof in het reservoir van een verbrandingsmotor;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.8.3.b
    text: brandstof in een verlichtings-, een verwarmings- of een ander warmteontwikkelend toestel;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.8.3.c
    text: voor consumptie bestemde alcoholhoudende dranken;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.8.3.d
    text: gasflessen tot een totale waterinhoud van 115 liter;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.8.3.e
    text: |-
      dieselolie, gasolie of lichte stookolie met een vlampunt tussen de 61°C en 100 °C tot een totale hoeveelheid van
      1.000 liter, en
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.8.3.f
    text: |-
      brandgevaarlijke stoffen voor zover de aanwezigheid daarvan bij of krachtens de [Wet milieubeheer][ref1] of de
      [Wet algemene bepalingen omgevingsrecht][ref2] is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0024779
  - number: 2.1.8.4
    text: |-
      Bij het berekenen van een toegestane hoeveelheid als bedoeld in het tweede lid, onderdeel a, wordt een aangebroken
      verpakking als een volle meegerekend.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.8
  - number: 2.1.9.1
    text: |-
      Bedrijfsmatige opslag van brandbare niet-milieugevaarlijke stoffen is zodanig dat bij brand geen onveilige situatie
      kan ontstaan voor een op een aangrenzend perceel gelegen of op dat perceel volgens het bestemmingsplan nog te
      realiseren gebouw dat op grond van het [Bouwbesluit 2003][ref1] een brandcompartiment of een gedeelte van een
      brandcompartiment is, of voor een speeltuin, kampeerterrein of opslag van brandgevaarlijke stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012727
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.9
    references:
      - id: ref1
        bwb_id: BWBR0012727
  - number: 2.1.9.2
    text: 'Aan het in het eerste lid gestelde is bij opslag van hout, anders dan in een gebouw, voldaan indien:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.9
  - number: 2.1.9.2.a
    text: |-
      de opslag bij brand gedurende een periode van ten minste 60 minuten, gerekend vanaf het ontstaan van de brand, geen
      grotere stralingsbelasting veroorzaakt dan 15 kW/m2;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.9
  - number: 2.1.9.2.b
    text: |-
      de bereikbaarheid van de opslag vanaf twee tegenover elkaar liggende zijden is gewaarborgd, waarbij in een derde
      zijde ook een toegangsmogelijkheid aanwezig is indien die zijde langer is dan 40 m, en
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.9
  - number: 2.1.9.2.c
    text: |-
      bij de opslag een bluswatervoorziening met gedurende ten minste vier uren een toevoercapaciteit van ten minste 90
      m3 per uur aanwezig is.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.9
  - number: 2.1.9.3
    text: 'De in het tweede lid bedoelde stralingsbelasting wordt gemeten op:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.9
  - number: 2.1.9.3.a
    text: |-
      de perceelsgrens, indien het aangrenzend perceel een kampeerterrein, een speeltuin of een opslag van
      brandgevaarlijke stoffen is, en
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.9
  - number: 2.1.9.3.b
    text: enig punt van de uitwendige scheidingsconstructie van een op het aangrenzend perceel gelegen gebouw.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.1.9
  - number: 2.2.1.1
    text: |-
      Een gebruiksfunctie heeft een brandmeldinstallatie met een omvang van de bewaking en een doormelding zoals
      aangegeven in [bijlage I][ref1] bij dit besluit, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024379
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0024379
  - number: 2.2.1.1.a
    text: |-
      de gebruiksoppervlakte van de gebruiksfunctie groter is dan de in [bijlage I][ref1] bij dit besluit aangegeven
      grenswaarde;


      [ref1]: https://wetten.overheid.nl/BWBR0024379
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0024379
  - number: 2.2.1.1.b
    text: |-
      de hoogste vloer van een verblijfsruimte van de gebruiksfunctie gemeten boven het meetniveau hoger is dan de in
      [bijlage I][ref1] bij dit besluit aangegeven grenswaarde;


      [ref1]: https://wetten.overheid.nl/BWBR0024379
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0024379
  - number: 2.2.1.1.c
    text: |-
      het aantal bouwlagen van de gebruiksfunctie groter is dan de in [bijlage I][ref1] bij dit besluit aangegeven
      grenswaarde of


      [ref1]: https://wetten.overheid.nl/BWBR0024379
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0024379
  - number: 2.2.1.1.d
    text: |-
      [bijlage I][ref1] dit aanwijst zonder dat sprake is van een grenswaarde als hierboven bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0024379
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0024379
  - number: 2.2.1.2
    text: |-
      Een doormelding als bedoeld in het eerste lid vindt rechtstreeks plaats naar de regionale alarmcentrale van de
      brandweer.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
  - number: 2.2.1.3
    text: |-
      Bij een woonfunctie voor zorg met zorg op afroep in een woongebouw of in een groepszorgwoning, vindt rechtstreekse
      melding naar een zorgcentrale plaats. Bij 24-uurszorg in een woongebouw of in een groepszorgwoning, vindt deze
      melding naar een zusterpost plaats.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
  - number: 2.2.1.4
    text: |-
      Een besloten ruimte waarop een verblijfsruimte is aangewezen van waaruit slechts in een richting kan worden
      gevlucht heeft een brandmeldinstallatie met ruimtebewaking als bedoeld in NEN 2535: 1996, inclusief wijzigingsblad
      A1: '2002, indien:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
  - number: 2.2.1.4.a
    text: |-
      de loopafstand tussen de toegang van de verblijfsruimte en het punt van waaruit in meer dan een richting kan worden
      gevlucht meer dan 10 m is of
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
  - number: 2.2.1.4.b
    text: |-
      de totale vloeroppervlakte van de besloten ruimte van waaruit in slechts een richting kan worden gevlucht meer dan
      200 m2 is.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
  - number: 2.2.1.5
    text: |-
      Het eerste lid is niet van toepassing op een woonfunctie voor kamergewijze verhuur indien elke wooneenheid in een
      afzonderlijk subbrandcompartiment ligt met een volgens NEN 6068: 2004, inclusief wijzigingsblad A2: 2005, bepaalde
      weerstand tegen branddoorslag en brandoverslag van het subbrandcompartiment naar een besloten ruimte in het
      brandcompartiment die niet lager is dan 30 minuten.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
  - number: 2.2.1.6
    text: |-
      Een installatie als bedoeld in het eerste lid voldoet aan NEN 2535: 1996, inclusief wijzigingsblad A1: 2002, en aan
      een door het bevoegd gezag goedgekeurd programma van eisen als bedoeld in deze norm.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
  - number: 2.2.1.7
    text: |-
      Een installatie als bedoeld in het eerste lid functioneert overeenkomstig de op de installatie van toepassing
      zijnde voorschriften.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
  - number: 2.2.1.8
    text: |-
      Het beheer, de controle en het onderhoud van een installatie als bedoeld in het eerste en derde lid voldoet aan NEN
      2654-1: 2002.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
  - number: 2.2.1.9
    text: |-
      Een installatie als bedoeld in het eerste lid heeft, indien de installatie is voorzien van doormelding, een geldig
      certificaat als bedoeld in de Regeling brandmeldinstallaties 2002 van het Centraal College van Deskundigen van het
      Centrum voor Criminaliteitspreventie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.1
  - number: 2.2.2.1
    text: |-
      Indien in een woonfunctie voor kamergewijze verhuur de vloer van een verblijfsruimte hoger ligt dan 2.1 m boven het
      meetniveau en vanaf de toegang van de wooneenheid waar die verblijfsruimte toe behoort geen tweede vluchtroute is
      en het aansluitende terrein niet op een andere adequate wijze kan worden bereikt zonder gebruik te maken van een
      sleutel, hebben alle verblijfsruimten in de woonfunctie doorgekoppelde rookmelders als bedoeld in NEN 2555: 2006.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.2
  - number: 2.2.2.2
    text: |-
      Een rookmelder als bedoeld in het eerste lid en een volgens
      [artikel 2.146, zevende lid, van het Bouwbesluit 2003][ref1] aangebrachte rookmelder functioneren overeenkomstig
      dat voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0012727
        artikel: '2'
  - number: 2.3.1.1
    text: 'De inrichting van een ruimte is zodanig dat:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.1
  - number: 2.3.1.1.a
    text: voor elke persoon zonder zitplaats ten minste 0,25 m2 vloeroppervlakte beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.1
  - number: 2.3.1.1.b
    text: |-
      voor elke persoon met zitplaats ten minste 0,3 m2 vloeroppervlakte beschikbaar is, indien geen inventaris kan
      verschuiven of omvallen als gevolg van gedrang;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.1
  - number: 2.3.1.1.c
    text: |-
      voor elke persoon met zitplaats ten minste 0,5 m2 vloeroppervlakte beschikbaar is, indien inventaris kan
      verschuiven of omvallen als gevolg van gedrang.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.1
  - number: 2.3.1.2
    text: |-
      In een ruimte met meer dan 100 zitplaatsen zijn de zitplaatsen gekoppeld of aan de vloer bevestigd, zodanig dat
      deze niet kunnen verschuiven of omvallen als gevolg van gedrang, voor zover die zitplaatsen in meer dan 4 rijen van
      meer dan 4 stoelen zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.1
  - number: 2.3.1.3
    text: |-
      Bij in rijen opgestelde zitplaatsen is tussen de rijen een vrije ruimte aanwezig met een breedte van ten minste 0,4
      m, gemeten tussen de loodlijnen op de elkaar dichtst naderende gedeelten van de rijen.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.1
  - number: 2.3.1.4
    text: |-
      Indien in een rij als bedoeld in het derde lid tussen de zitplaatsen een tafel is geplaatst, bevindt deze zich niet
      in de vrije ruimte, bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.1
  - number: 2.3.1.5
    text: Een rij zitplaatsen die slechts aan een einde op een gangpad of uitgang uitkomt, heeft niet meer dan 8 zitplaatsen.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.1
  - number: 2.3.1.6
    text: 'Een rij zitplaatsen die aan beide einden op een gangpad of uitgang uitkomt, heeft ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.1
  - number: 2.3.1.6.a
    text: |-
      16 zitplaatsen indien de vrije ruimte, bedoeld in het derde lid, niet groter is dan 0,45 m en de breedte van de
      vrije doorgang van het gangpad of van de uitgang ten minste 0,6 m is;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.1
  - number: 2.3.1.6.b
    text: |-
      32 zitplaatsen indien de vrije ruimte, bedoeld in het derde lid, groter is dan 0,45 m en de breedte van de vrije
      doorgang van het gangpad of van de uitgang ten minste 0,6 m is;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.1
  - number: 2.3.1.6.c
    text: |-
      50 zitplaatsen indien de vrije ruimte, bedoeld in het derde lid, groter is dan 0,45 m en de breedte van de vrije
      doorgang van het gangpad of van de uitgang ten minste 1,1 m is.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.1
  - number: 2.3.2.1
    text: |-
      Gangpaden tussen stands, kramen, schappen, podia en andere inrichtingselementen in een voor publiek toegankelijke
      ruimte zijn ten minste 1,1 m breed.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.2
  - number: 2.3.2.2
    text: |-
      Voor een uitgang in een ruimte als bedoeld in het eerste lid is een vrije vloeroppervlakte met een lengte en een
      breedte van ten minste de breedte van deze uitgang.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.2
  - number: 2.3.3
    text: |-
      Een zelfsluitend constructieonderdeel als bedoeld in de [artikelen 2.138][ref1], [2.144][ref2], [2.168][ref3] en
      [2.177 van het Bouwbesluit 2003][ref4] mag niet in geopende stand zijn vastgezet, tenzij het constructieonderdeel
      bij rook als gevolg van brand automatisch wordt losgelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012727#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012727#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0012727#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.3
    references:
      - id: ref1
        bwb_id: BWBR0012727
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012727
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0012727
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0012727
        artikel: '2'
  - number: 2.3.4
    text: |-
      Na het aanbrengen of wijzigen van een kabel-, leiding- of andere doorvoer in of door een scheidingsconstructie
      waarvoor op grond van de [afdelingen 2.16][ref1], [2.22][ref2] en [2.23 van het Bouwbesluit 2003][ref3] een eis
      omtrent de rookdoorgang geldt, wordt de weerstand tegen rookdoorgang van de scheidingsconstructie op adequate wijze
      gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Afdeling2.16
      [ref2]: https://wetten.overheid.nl/BWBR0012727#Afdeling2.22
      [ref3]: https://wetten.overheid.nl/BWBR0012727#Afdeling2.23
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0012727
        afdeling: '2.16'
      - id: ref2
        bwb_id: BWBR0012727
        afdeling: '2.22'
      - id: ref3
        bwb_id: BWBR0012727
        afdeling: '2.23'
  - number: 2.3.5.1
    text: |-
      Bij aanwezigheid van personen in een bouwwerk is een deur in een vluchtroute uitsluitend gesloten indien die deur
      tijdens het vluchten, zonder gebruik te moeten maken van een sleutel, onmiddellijk over de ten minste vereiste
      breedte kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.5
  - number: 2.3.5.2
    text: |-
      Een deur van een ruimte voor meer dan 100 personen en een deur waarop bij het vluchten meer dan 100 personen zijn
      aangewezen kunnen in de vluchtrichting worden geopend door:
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.5
  - number: 2.3.5.2.a
    text: een lichte druk tegen de deur, of
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.5
  - number: 2.3.5.2.b
    text: |-
      een lichte druk tegen een op circa 1 m boven de vloer over de volle breedte van de deur aangebrachte panieksluiting
      die voldoet aan NEN-EN 1125: 1997, inclusief wijzigingsblad A1: 2001 en correctieblad C1: 2002.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.5
  - number: 2.3.5.3
    text: |-
      In afwijking van het eerste en tweede lid is bij een celfunctie of een nevenfunctie van een celfunctie een deur in
      een vluchtroute uitsluitend gesloten indien die deur voor het vluchten bij brand voldoende snel over de ten minste
      vereiste breedte kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.5
  - number: 2.3.5.4
    text: |-
      Een automatisch werkende deur en een voorziening voor toegangs- of uitgangscontrole in een vluchtroute mogen het
      vluchten niet belemmeren.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.5
  - number: 2.3.5.5
    text: |-
      Een deur die toegang geeft tot een overdruktrappenhuis als bedoeld in NEN 6092: 1995 is voorzien van een aanduiding
      waaruit blijkt dat hard duwen noodzakelijk kan zijn.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.5
  - number: 2.3.5.6
    text: |-
      Aan de tegen de vluchtrichting in gekeerde zijde van een nooddeur of nooduitgang in een uitwendige
      scheidingsconstructie is het opschrift «nooddeur vrijhouden» of «nooduitgang» aangebracht. Dit opschrift voldoet
      aan de eisen voor aanvullende tekens in NEN 3011: 2004.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.5
  - number: 2.3.5.7
    text: |-
      Een deur in een vluchtroute vanaf de toegang van een wooneenheid naar de toegang van de woonfunctie voor
      kamergewijze verhuur kan in de vluchtrichting worden geopend:
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.5
  - number: 2.3.5.7.a
    text: door een lichte druk tegen de deur, of
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.5
  - number: 2.3.5.7.b
    text: |-
      met behulp van een ontsluitingsmechanisme dat voldoet aan NEN-EN 179: 1997, inclusief wijzigingsblad A1: 2001 en
      correctieblad C1: 2002, of aan NEN-EN 1125: 1997, inclusief wijzigingsblad A1: 2001 en correctieblad C1: 2002.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.5
  - number: 2.3.6.1
    text: |-
      Een gebruiksfunctie met een brandmeldinstallatie als bedoeld in [artikel 2.2.1, eerste lid][ref1], heeft een
      ontruimingsalarminstallatie die voldoet aan NEN 2575: 2004 en aan een door het bevoegd gezag goedgekeurd programma
      van eisen als bedoeld in deze norm.


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.6
    references:
      - id: ref1
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.3.6.2
    text: |-
      Bij een woonfunctie voor kamergewijze verhuur is de in het eerste lid bedoelde ontruimingsalarminstallatie een
      luidalarminstallatie die in elke verblijfsruimte voldoende hoorbaar is. Deze installatie heeft ten minste een
      signaalgever in een gezamenlijke keuken en een per bouwlaag in een ruimte waardoor een gezamenlijke vluchtroute
      voert.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.6
  - number: 2.3.6.3
    text: |-
      Een gebruiksfunctie met een brandmeldinstallatie met ruimtebewaking als bedoeld in
      [artikel 2.2.1, vierde lid][ref1], heeft een ontruimingsalarminstallatie met automatisch ontruimingssignaal die
      voldoet aan NEN 2575: 2004 en aan een door het bevoegd gezag goedgekeurd programma van eisen als bedoeld in deze
      norm.


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.6
    references:
      - id: ref1
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.3.6.4
    text: |-
      Het beheer, de controle en het onderhoud van een ontruimingsalarminstallatie als bedoeld in het eerste tot en met
      derde lid voldoet aan NEN 2654-2: 2004.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.6
  - number: 2.3.6.5
    text: |-
      Een gebruiksfunctie met een brandmeldinstallatie als bedoeld in [artikel 2.2.1][ref1] heeft een ontruimingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.6
    references:
      - id: ref1
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.3.7.1
    text: |-
      Een ruimte waardoor een verkeersroute voert en een ruimte voor meer dan 50 personen hebben een
      vluchtrouteaanduiding die voldoet aan NEN 6088: 2002 en aan de zichtbaarheidseisen, bedoeld in de artikelen 5.2 tot
      en met 5.6 van NEN-EN 1838: 1999.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.7
  - number: 2.3.7.2
    text: Een vluchtrouteaanduiding als bedoeld in het eerste lid is aangebracht op een duidelijk waarneembare plaats.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.7
  - number: 2.3.7.3
    text: |-
      Een vluchtrouteaanduiding als bedoeld in het eerste lid voldoet binnen 15 seconden na het uitvallen van de
      voorziening voor elektriciteit gedurende een periode van ten minste 60 minuten aan de zichtbaarheidseisen, bedoeld
      in de artikelen 5.2 tot en met 5.6 van NEN-EN 1838: 1999.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.7
  - number: 2.3.7.4
    text: |-
      Op een vluchtrouteaanduiding als bedoeld in het eerste lid, op een vluchtroute vanuit een ruimte met
      een verlichtingsinstallatie die niet is aangesloten op een voorziening voor noodstroom als bedoeld in de
      [artikelen 2.59][ref1] en [2.66 van het Bouwbesluit 2003][ref2], zijn bij het uitvallen van de voorziening voor
      elektriciteit de in het eerste lid bedoelde zichtbaarheidseisen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012727#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.7
    references:
      - id: ref1
        bwb_id: BWBR0012727
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012727
        artikel: '2'
  - number: 2.3.7.5
    text: |-
      De controle en het onderhoud van een vluchtrouteaanduiding vindt ten minste eenmaal per jaar op adequate wijze
      plaats.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.7
  - number: 2.3.8.1
    text: |-
      Een noodverlichtingsinstallatie als bedoeld in de [artikelen 2.59][ref1] en [2.66 van het Bouwbesluit 2003][ref2]
      functioneert overeenkomstig de in die artikelen genoemde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012727#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.8
    references:
      - id: ref1
        bwb_id: BWBR0012727
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012727
        artikel: '2'
  - number: 2.3.8.2
    text: |-
      De controle en het onderhoud van de in het eerste lid bedoelde noodverlichtingsinstallatie vindt ten minste eenmaal
      per jaar op adequate wijze plaats.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.8
  - number: 2.3.9
    text: |-
      Een bij of krachtens de [wet][ref1] voorgeschreven rook- en warmteafvoerinstallatie of ander rookbeheersingssysteem
      is voorzien van een geldig door het bevoegd gezag aanvaard document waaruit blijkt dat deze voorziening adequaat
      functioneert, wordt onderhouden en gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.9
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 2.3.10
    text: |-
      In een ruimte bestemd om te worden verduisterd tijdens het gebruik door meer dan 50 personen, zijn zodanige
      voorzieningen getroffen dat tijdens de verduistering een redelijke oriëntatie mogelijk is.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.10
  - number: 2.3.11
    text: 'Ter voorkoming van letsel bij loslaten is:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.11
  - number: 2.3.11.a
    text: |-
      tegen of onder het plafond aangebracht glas veiligheidsglas of voorzien van een ingegoten kruiswapening met een
      maximale maaswijdte van 0,016 m;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.11
  - number: 2.3.11.b
    text: |-
      textiel, folie of papier in horizontale toepassing onderspannen met metaaldraad op een onderlinge afstand van ten
      hoogste 0,35 m, of metaaldraad in twee richtingen met een maximale maaswijdte van 0,7 m.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.3.11
  - number: 2.4.1.1
    text: |-
      Een bij of krachtens de [wet][ref1] voorgeschreven brandslanghaspel is aangesloten en wordt in stand gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 2.4.1.2
    text: |-
      De controle en het onderhoud van een brandslanghaspel als bedoeld in het eerste lid vindt ten minste eenmaal per
      jaar op adequate wijze plaats.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.4.1
  - number: 2.4.1.3
    text: |-
      Het onderhoud van een bij een brandslanghaspel als bedoeld in het eerste lid behorende pompinstallatie vindt ten
      minste eenmaal per jaar op adequate wijze plaats.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.4.1
  - number: 2.4.1.4
    text: |-
      De controle van een bij een brandslanghaspel als bedoeld in het eerste lid behorende pompinstallatie vindt ten
      minste eenmaal per maand op adequate wijze plaats.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.4.1
  - number: 2.4.2.1
    text: |-
      Voor zover daarin niet reeds voldoende door de aanwezigheid van brandslanghaspels is voorzien, is een gebouw
      voorzien van voldoende draagbare of verrijdbare blustoestellen om een beginnende brand zo snel mogelijk door in het
      gebouw aanwezige personen te laten bestrijden.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.4.2
  - number: 2.4.2.2
    text: |-
      Bij een woonfunctie voor kamergewijze verhuur is aan het eerste lid voldaan met een toestel in een gezamenlijke
      keuken en ten minste een per bouwlaag, in een ruimte waardoor een gezamenlijke vluchtroute voert.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.4.2
  - number: 2.4.2.3
    text: |-
      Ten minste eenmaal per twee jaar wordt overeenkomstig NEN 2559: 2001, inclusief wijzigingsblad A2: 2004,
      op adequate wijze het nodige onderhoud aan een bij of krachtens wettelijk voorschrift aanwezig draagbaar of
      verrijdbaar blustoestel verricht, en de goede werking van dat blustoestel gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.4.2
  - number: 2.4.3
    text: |-
      Een bij of krachtens de [wet][ref1] voorgeschreven blusmiddel is duidelijk zichtbaar opgehangen of gemarkeerd met
      een pictogram als bedoeld in NEN 3011: 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.4.3
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 2.5.1
    text: |-
      Een bij of krachtens de [wet][ref1] voorgeschreven automatische brandblusinstallatie is voorzien van een geldig
      door het bevoegd gezag aanvaard document waaruit blijkt dat deze voorziening adequaat functioneert, wordt
      onderhouden en gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.5.1
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 2.6.1.1
    text: |-
      Een bij of krachtens de [wet][ref1] of de [Wet ruimtelijke ordening][ref2] voorgeschreven verbindingsweg tussen
      de toegang van een bouwwerk en het openbaar wegennet is over de voorgeschreven hoogte en breedte vrijgehouden voor
      brandweervoertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
      [ref2]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.6.1
    references:
      - id: ref1
        bwb_id: BWBR0005181
      - id: ref2
        bwb_id: BWBR0020449
  - number: 2.6.1.2
    text: |-
      Een bij of krachtens de [wet][ref1] of de [Wet ruimtelijke ordening][ref2] voorgeschreven opstelplaats voor
      brandweervoertuigen is over de voorgeschreven hoogte en breedte vrijgehouden voor brandweervoertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
      [ref2]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.6.1
    references:
      - id: ref1
        bwb_id: BWBR0005181
      - id: ref2
        bwb_id: BWBR0020449
  - number: 2.6.1.3
    text: |-
      Hekwerken die een verbindingsweg als bedoeld in het eerste lid of een opstelplaats als bedoeld in het tweede lid
      afsluiten, kunnen snel en gemakkelijk worden geopend.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.6.1
  - number: 2.6.2.1
    text: |-
      Een bouwwerk met een brandmeldinstallatie met doormelding als bedoeld in [artikel 2.2.1, eerste lid][ref1], heeft
      een brandweeringang. Indien het bouwwerk meerdere toegangen heeft, worden in overleg met de brandweer een of meer
      van die toegangen als brandweeringang aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.6.2
    references:
      - id: ref1
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.6.2.2
    text: 'Een brandweeringang als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.6.2
  - number: 2.6.2.2.a
    text: wordt automatisch ontsloten bij een brandmelding, of
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.6.2
  - number: 2.6.2.2.b
    text: wordt ontsloten met een systeem dat in overleg met de brandweer is bepaald.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.6.2
  - number: 2.6.3
    text: De controle en het onderhoud van een brandweerlift vindt ten minste eenmaal per jaar op adequate wijze plaats.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.6.3
  - number: 2.7.1.1
    text: |-
      De controle en het onderhoud van een bij of krachtens de [wet][ref1] voorgeschreven blusleiding vindt ten minste
      eenmaal per jaar op adequate wijze plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.7.1
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 2.7.1.2
    text: |-
      Het onderhoud van een bij een blusleiding als bedoeld in het eerste lid behorende pompinstallatie vindt ten minste
      eenmaal per jaar op adequate wijze plaats.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.7.1
  - number: 2.7.1.3
    text: |-
      De controle van een bij een blusleiding als bedoeld in het eerste lid behorende pompinstallatie vindt ten minste
      eenmaal per maand op adequate wijze plaats.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.7.1
  - number: 2.7.1.4
    text: |-
      In aanvulling op het eerste, tweede en derde lid worden een blusleiding en een pompinstallatie bij oplevering en
      daarna eenmaal in de vijf jaar getest volgens NEN 1594: 2006.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.7.1
  - number: 2.7.2.1
    text: |-
      Een bij of krachtens de [wet][ref1] of de [Wet ruimtelijke ordening][ref2] voorgeschreven brandkraan of
      bluswaterwinplaats is onbeperkt toegankelijk voor bluswerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
      [ref2]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.7.2
    references:
      - id: ref1
        bwb_id: BWBR0005181
      - id: ref2
        bwb_id: BWBR0020449
  - number: 2.7.2.2
    text: Een brandkraan en een bluswaterwinplaats als bedoeld in het eerste lid worden op adequate wijze onderhouden.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.7.2
  - number: 2.8.1
    text: |-
      Een voor grote aantallen bezoekers toegankelijk bouwwerk waarbij dit noodzakelijk is voor het goed functioneren
      van hulpverleningsdiensten bij calamiteiten en een wegtunnel met een tunnellengte van meer dan 250 m hebben een
      adequate installatie voor mobiele radiocommunicatie tussen hulpverleningsdiensten binnen en buiten dat bouwwerk.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.8.1
  - number: 2.9.1
    text: |-
      Onverminderd het bij of krachtens dit besluit bepaalde is het verboden in, op, aan of nabij een bouwwerk voorwerpen
      of stoffen te plaatsen, te werpen of te hebben, handelingen te verrichten of na te laten, werktuigen, middelen of
      voorzieningen te gebruiken of niet te gebruiken of anderszins belemmeringen op te werpen of hinder te veroorzaken
      waardoor:
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.9.1
  - number: 2.9.1.a
    text: brandgevaar wordt veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.9.1
  - number: 2.9.1.b
    text: melding van, alarmering bij of bestrijding van brand wordt belemmerd;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.9.1
  - number: 2.9.1.c
    text: het gebruik van vluchtmogelijkheden bij brand wordt belemmerd, of
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.9.1
  - number: 2.9.1.d
    text: het redden van personen of dieren bij brand wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.9.1
  - number: 2.10.1.1
    text: |-
      In een bouwwerk waarop voorschriften uit dit hoofdstuk van toepassing zijn, is een logboek aanwezig.
      Dit logboek ligt evenals een afschrift van de vergunning voor brandveilig gebruik, bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder d, van de Wet algemene bepalingen omgevingsrecht][ref1], en een afschrift
      van de gebruiksmelding ter inzage van degenen die belast zijn met het toezicht op de naleving van de voorschriften
      van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.10.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.10.1.2
    text: |-
      Een logboek als bedoeld in het eerste lid bevat een volledig en chronologisch overzicht van buitengebruikstellingen
      en van op grond van dit besluit uitgevoerde onderhouds- en controleactiviteiten en storings- en alarmmeldingen van
      installaties als bedoeld in dit besluit alsmede van andere werkzaamheden aan deze installaties.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.10.1
  - number: 2.10.1.3
    text: 'Een logboek als bedoeld in het eerste lid bevat voorts:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.10.1
  - number: 2.10.1.3.a
    text: |-
      het document, bedoeld in de [artikelen 2.1.7][ref1], [2.2.1, negende lid][ref2], [2.3.9][ref3] en [2.5.1][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024379#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024379#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.10.1
    references:
      - id: ref1
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref4
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.10.1.3.b
    text: |-
      het ontruimingsplan, bedoeld in [artikel 2.3.6, vijfde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.10.1
    references:
      - id: ref1
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.10.1.3.c
    text: het verslag van ontruimingsoefeningen.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.10.1
  - number: 2.12.1.1
    text: 'Het is verboden om zonder of in afwijking van een gebruiksmelding:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.1
  - number: 2.12.1.1.a
    text: |-
      een gelijkwaardige oplossing als bedoeld in [artikel 1.4, eerste lid][ref1], toe te passen;


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel1
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.1
    references:
      - id: ref1
        bwb_id: BWBR0024379
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.12.1.1.b
    text: een bouwwerk in gebruik te nemen of te gebruiken indien daarin meer dan 50 personen tegelijk aanwezig zullen zijn;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.1
  - number: 2.12.1.1.c
    text: een woonfunctie in gebruik te nemen of te gebruiken voor kamergewijze verhuur.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.1
  - number: 2.12.1.2
    text: |-
      Het eerste lid is niet van toepassing op het in gebruik nemen of gebruiken van
      een bouwwerk waarvoor een vergunning voor brandveilig gebruik als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder d, van de Wet algemene bepalingen omgevingsrecht][ref1] is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.12.1.3
    text: 'Het eerste lid, onderdeel b, is niet van toepassing op het in gebruik nemen of gebruiken van:'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.1
  - number: 2.12.1.3.a
    text: een één- of meergezinswoning;
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.1
  - number: 2.12.1.3.b
    text: |-
      een tunnel die uitsluitend dan wel mede bestemd is voor motorrijtuigen als bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Wegenverkeerswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 2.12.1.4
    text: |-
      Het eerste lid is van overeenkomstige toepassing bij het veranderen van een bouwwerk of van het gebruik daarvan
      indien eerder een gebruiksmelding is gedaan en door het veranderen een afwijking ontstaat van de bij die melding
      verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.1
  - number: 2.12.2.1
    text: |-
      Een gebruiksmelding wordt ten minste vier weken voor de aanvang van het gebruik schriftelijk ingediend bij het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.2
  - number: 2.12.2.2
    text: |-
      Indien een activiteit ten aanzien waarvan een gebruiksmelding is vereist, verband houdt
      met een activiteit die behoort tot een categorie waarvoor ingevolge [artikel 2.1][ref1] of
      [2.2, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref2] een vergunning is vereist, kan de
      gebruiksmelding, onverminderd het bepaalde in het eerste lid, tegelijkertijd met de indiening van de aanvraag om
      die vergunning worden gedaan. In dat geval wordt de gebruiksmelding op dezelfde wijze als die aanvraag ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.12.2a.1
    text: |-
      Een gebruiksmelding langs elektronische weg wordt gedaan met gebruikmaking van het elektronische formulier
      dat op de datum van indiening van de gebruiksmelding beschikbaar is via de landelijke voorziening,
      bedoeld in [artikel 7.6 van de Wet algemene bepalingen omgevingsrecht][ref1]. Op die gebruiksmelding is
      [artikel 4.3, eerste en tweede lid, van het Besluit omgevingsrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel4
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.2a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '4'
  - number: 2.12.2a.2
    text: |-
      Een gebruiksmelding anders dan langs elektronische weg wordt gedaan met gebruikmaking van het formulier, bedoeld
      in [artikel 4.2, eerste lid, van het Besluit omgevingsrecht][ref1]. Indien de gebruiksmelding tegelijkertijd met de
      indiening van een aanvraag om vergunning krachtens de [Wet algemene bepalingen omgevingsrecht][ref2] wordt gedaan,
      wordt van de gebruiksmelding en de daarbij te verstrekken gegevens en bescheiden hetzelfde aantal exemplaren
      ingediend als op grond van artikel 4.2, tweede en derde lid, van het Besluit omgevingsrecht van de aanvraag
      om vergunning en de daarbij te verstrekken gegevens en bescheiden wordt ingediend. Indien de gebruiksmelding
      afzonderlijk wordt gedaan, worden deze en de daarbij te verstrekken gegevens en bescheiden in drievoud ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.2a
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0024779
  - number: 2.12.2a.3
    text: |-
      Bij de gebruiksmelding, bedoeld in [artikel 2.12.1, eerste lid, onderdeel a][ref1], verstrekt de melder voor zover
      dit naar het oordeel van het bevoegd gezag nodig is gegevens en bescheiden waarmee de gelijkwaardigheid voldoende
      aannemelijk wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.2a
    references:
      - id: ref1
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.12'
  - number: 2.12.2a.4
    text: |-
      Bij de gebruiksmelding, bedoeld in [artikel 2.12.1, eerste lid, onderdelen b en c][ref1], verstrekt
      de melder voor zover dit naar het oordeel van het bevoegd gezag nodig is om aannemelijk te maken
      dat het gebruik voldoet aan de bij of krachtens de wet geldende eisen een situatieschets en een
      plattegrondtekening. De eisen die krachtens [artikel 4.4, eerste lid, van het Besluit omgevingsrecht][ref2]
      worden gesteld aan de bij een aanvraag om vergunning voor brandveilig gebruik als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder d, van de Wet algemene bepalingen omgevingsrecht][ref3] te verstrekken
      situatieschets en plattegrondtekening zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.2a
    references:
      - id: ref1
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.12'
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.12.2a.5
    text: |-
      Bij een gebruiksmelding voor tijdelijk of seizoensgebonden gebruik van een bouwwerk wordt door de melder aangegeven
      voor welke periode of voor welke tijdvakken in een kalenderjaar het gebruik is beoogd.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.2a
  - number: 2.12.2a.6
    text: |-
      Een gebruiksmelding kan betrekking hebben op meerdere bouwwerken op hetzelfde terrein of op met elkaar
      samenhangende terreinen.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.2a
  - number: 2.12.3
    text: |-
      De melder krijgt door of namens het bevoegd gezag een bewijs van ontvangst toegezonden of uitgereikt, waarin de
      datum van ontvangst is vermeld.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.3
  - number: 2.12.4.1
    text: |-
      Het bevoegd gezag kan na een melding van een gebruik als bedoeld in
      [artikel 2.12.1, eerste lid, onderdeel b][ref1], besluiten nadere voorwaarden op te leggen indien deze noodzakelijk
      zijn voor het voorkomen, beperken en bestrijden van brand, brandgevaar en ongevallen bij brand.


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.4
    references:
      - id: ref1
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.12'
  - number: 2.12.4.2
    text: Het is verboden in strijd te handelen met de nadere voorwaarden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.4
  - number: 2.12.5.1
    text: |-
      Het bevoegd gezag kan de nadere voorwaarden, bedoeld in [artikel 2.12.4, eerste lid][ref1], wijzigen:


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.5
    references:
      - id: ref1
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.12'
  - number: 2.12.5.1.a
    text: |-
      indien een verandering van inzichten of van omstandigheden gelegen buiten het bouwwerk die bij de beoordeling van
      de melding een rol hebben gespeeld dit noodzakelijk maakt, en
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.5
  - number: 2.12.5.1.b
    text: op verzoek van de melder.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.5
  - number: 2.12.5.2
    text: |-
      Het bevoegd gezag gaat niet over tot wijziging van de nadere voorwaarden, bedoeld in
      [artikel 2.12.4, eerste lid][ref1], dan nadat het de melder in de gelegenheid heeft gesteld zijn zienswijze naar
      voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel2.12.5
    references:
      - id: ref1
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.12'
  - number: 3.1.1
    text: |-
      Een vergunning voor het brandveilig gebruik van bouwwerken op grond van de verordening, bedoeld in
      [artikel 8 van de wet][ref1], verleend voor het tijdstip waarop dit besluit in werking treedt, blijft van
      toepassing voor zover een gebruiksvergunning op grond van dit besluit is vereist. [Artikel 2.11.6][ref2] is op een
      dergelijke vergunning van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.11'
  - number: 3.1.2
    text: |-
      Een vergunning voor het brandveilig gebruik van bouwwerken op grond van de verordening, bedoeld in
      [artikel 8 van de wet][ref1], verleend voor het tijdstip waarop dit besluit in werking treedt, wordt voor
      zover deze betrekking heeft op een situatie waarvoor op grond van dit besluit een melding als bedoeld in
      [artikel 2.12.1][ref2] is vereist, beschouwd als een melding als bedoeld in laatstgenoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.12'
  - number: 3.1.3
    text: |-
      Een aanvraag om vergunning voor het brandveilig gebruik van bouwwerken op grond van de verordening, bedoeld
      in [artikel 8 van de wet][ref1], ingediend voor het tijdstip waarop dit besluit in werking treedt, wordt
      voor zover deze betrekking heeft op een situatie waarvoor op grond van dit besluit een melding als bedoeld in
      [artikel 2.12.1][ref2] is vereist, beschouwd als een melding als bedoeld in [laatstgenoemd artikel][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0024379#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024379#Artikel2
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.12'
      - id: ref3
        bwb_id: BWBR0024379
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.12'
  - number: 3.1.4
    text: |-
      Met betrekking tot een aanvraag om vergunning voor het brandveilig gebruik van bouwwerken op grond van de
      verordening, bedoeld in [artikel 8 van de wet][ref1], ingediend voor het tijdstip waarop dit besluit in werking
      treedt alsmede met betrekking tot enig bezwaar of beroep ingesteld tegen een beslissing omtrent een dergelijke
      aanvraag, blijven voor zover deze aanvraag betrekking heeft op een situatie waarvoor op grond van dit besluit een
      gebruiksvergunning is vereist de voorschriften van toepassing die golden op het tijdstip waarop de aanvraag werd
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
  - number: '3.2'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel3.2
  - number: '3.3'
    text: 'Dit besluit wordt aangehaald als: Besluit brandveilig gebruik bouwwerken.'
    url: https://wetten.overheid.nl/BWBR0024379/2011-01-01#Artikel3.3
