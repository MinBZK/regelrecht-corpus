  - number: 1.1.2
    text: |-
      Voor de toepassing van de bij of krachtens dit besluit gegeven voorschriften wordt voorts verstaan onder: -
      *woonfunctie:* woonfunctie als bedoeld in het [Bouwbesluit 2003][ref1].
        - *bijeenkomstfunctie:* bijeenkomstfunctie als bedoeld in het [Bouwbesluit 2003][ref2];
        - *celfunctie:* celfunctie als bedoeld in het [Bouwbesluit 2003][ref3];
        - *gezondheidszorgfunctie:* gezondheidszorgfunctie als bedoeld in het [Bouwbesluit 2003][ref4];
        - *industriefunctie:* industriefunctie als bedoeld in het [Bouwbesluit 2003][ref5];
        - *kantoorfunctie:* kantoorfunctie als bedoeld in het [Bouwbesluit 2003][ref6];
        - *lichte industriefunctie:* lichte industriefunctie als bedoeld in het [Bouwbesluit 2003][ref7];
        - *logiesfunctie:* logiesfunctie als bedoeld in het [Bouwbesluit 2003][ref8];
        - *onderwijsfunctie:* onderwijsfunctie als bedoeld in het [Bouwbesluit 2003][ref9];
        - *sportfunctie:* sportfunctie als bedoeld in het [Bouwbesluit 2003][ref10];
        - *winkelfunctie:* winkelfunctie als bedoeld in het [Bouwbesluit 2003][ref11];
        - *overige gebruiksfunctie:* overige gebruiksfunctie als bedoeld in het [Bouwbesluit 2003][ref12].


