    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Defensie van 12 januari 1999, nr. P/98008731;

    Gelet op artikel 125, eerste lid, van de Ambtenarenwet en artikel 12 van de Militaire Ambtenarenwet;

    De Raad van State gehoord (advies van 4 maart 1999, no. WO7.99.0019/II);

    Gezien het nader rapport van de Staatssecretaris van Defensie van 2 juni 1999, nr. P/99002950;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - Onze Minister: De Minister van defensie;
        - betrokkene: 1e. de ambtenaar die op basis van het [Burgerlijk ambtenarenreglement defensie][ref1] in
      vaste of in tijdelijke dienst werkzaam is geweest en is ontslagen op grond van genoemd reglement, met
      uitzondering van een ontslag op eigen aanvraag, een disciplinair strafontslag, een ontslag wegens flexibel
      pensioen en uittreden, dan wel een functioneel leeftijdsontslag; 2e. de militair die op basis van het
      [Algemeen militair ambtenarenreglement][ref2] in militaire dienst werkzaam is geweest en is ontslagen op grond van
      genoemd reglement, met uitzondering van een ontslag op eigen aanvraag, een leeftijdsontslag, dan wel een ontslag
      ingevolge [artikel 39, tweede lid, onderdelen i, k, l, m of n, van genoemd reglement][ref3]; 3e. de militair die
      behoort tot het reservepersoneel en als zodanig gedurende een aaneengesloten periode van tenminste vier maanden
      feitelijk onder de wapenen is geweest;
        - de [WW][ref4]: de [Werkloosheidswet][ref5];
        - dagloon: het dagloon, bedoeld in de [artikelen 44 tot en met 46 van de WW][ref6] zonder toepassing van het
      bedrag, bedoeld in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref7] met betrekking tot
      een loontijdvak van een dag;
        - WW-uitkering: de uitkering bij werkloosheid, bedoeld in [Hoofdstuk II van de WW][ref8];
        - bovenwettelijke uitkering: de aansluitende en de aanvullende uitkering, bedoeld in
      [hoofdstuk 2 van dit besluit][ref9];
        - diensttijd: de tijd welke betrokkene in dienst dan wel aangesteld is geweest bij het Ministerie van Defensie en
      in voorkomend geval vermeerderd met de tijd welke betrokkene voordien in dienst is geweest bij de rijksoverheid dan
      wel bij een sector van de rijksoverheid. De tijd die een militair na 1 januari 1990 is uitgezonden in het kader van
      vredes- of humanitaire operaties wordt dubbel geteld, met een maximum van twee jaar;
        - arbeidsongeschiktheidsuitkering: een ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref10] of de
      [Wet werk en inkomen naar arbeidsvermogen][ref11] toegekende uitkering;
        - arbeidsverleden: arbeidsverleden als bedoeld in de [Werkloosheidswet][ref12];
        - arbeidsongeschiktheidsuitkering: een ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref13] of de
      [Wet werk en inkomen naar arbeidsvermogen][ref14] toegekende uitkering;
        - herplaatsingskandidaat: degene die is aangewezen als interne of externe herplaatser als
      bedoeld in artikel van het [105 Burgerlijk ambtenarenreglement defensie][ref15] dan wel
      [artikel 53b van het Algemeen militair ambtenarenreglement][ref16];
        - knelpuntcategorie: een als zodanig gedefinieerde categorie personeel waarbinnen naar verwachting een zodanige
      mate van potentiële overtolligheid zal ontstaan dat stimuleren van de vrijwillige uitstroom gewenst is om
      overtolligheid zoveel mogelijk te voorkomen;
        - overtolligheidsontslag: ontslag verleend in verband met overtolligheid als bedoeld in
      [artikel 39, eerste lid, onder d, van het Algemeen militair ambtenarenreglement][ref17], dan wel
      [artikel 116, eerste lid, van het Burgerlijk ambtenarenreglement defensie][ref18];
        - passende betrekking: passende arbeid als bedoeld in de [Werkloosheidswet][ref19] en daarop gebaseerde regelingen;
        - pensioengerechtigde leeftijd: de leeftijd, die voor de ambtenaar of de militair geldt op grond van
      [artikel 7a van de Algemene ouderdomswet][ref20];
        - remplaçant: de betrokkene die na goedkeuring van het bevoegd gezag vrijwillig in de plaats treedt van een interne
      herplaatsingskandidaat of van een defensiemedewerker die binnen afzienbare tijd herplaatsingskandidaat wordt;
        - Sociaal Beleidskader: het Sociaal Beleidskader zoals dat luidt op 1 januari 2012.


