  - number: '18.4'
    text: |-
      Indien de uitkering krachtens de [WW][ref1] lager is dan de uitkering ingevolge het
      [Werkloosheidsbesluit beroepsmilitairen bepaalde tijd][ref2] waarop betrokkene recht
      had op de dag voorafgaande aan de datum, bedoeld in het eerste lid, of op de dag
      waarop zijn uitkering is geëindigd als gevolg van een omstandigheid als bedoeld in
      [artikel 30, eerste lid, onder c, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref3],
      heeft betrokkene recht op een garantie-uitkering krachtens dit besluit. De garantie-uitkering bedraagt het
      verschil tussen de uitkering ingevolge het [Werkloosheidsbesluit beroepsmilitairen bepaalde tijd][ref4]
      waarop de betrokkene recht zou hebben gehad als dat besluit op grond van het eerste lid niet zou
      zijn ingetrokken en de uitkering krachtens de [WW][ref5]. Indien de uitkering op grond van het
      [Werkloosheidsbesluit beroepsmilitairen bepaalde tijd][ref6] of de [WW][ref7] op grond van enige wettelijke
      bepaling geheel of gedeeltelijk is geweigerd, dan wel niet of niet geheel is betaald, wordt deze uitkering
      voor de vaststelling van de garantie-uitkering geacht onverminderd te zijn genoten. Op de garantie-uitkering is
      [artikel 7][ref8] van overeenkomstige toepassing.


