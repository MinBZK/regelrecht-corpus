  - number: 18b
    text: |-
      In afwijking van [artikel 1][ref1] wordt verstaan onder pensioengerechtigde leeftijd: de leeftijd van 65 jaar, voor
      de militair aan wie voor 1 januari 2017 ontslag is verleend, of die een aanvraag heeft ingediend als bedoeld in
      [artikel 39a, eerste tot en met vierde lid, van het Algemeen militair ambtenarenreglement][ref2], alsmede voor de
      ambtenaar aan wie voor 1 januari 2018 ontslag is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0010510#Artikel1
