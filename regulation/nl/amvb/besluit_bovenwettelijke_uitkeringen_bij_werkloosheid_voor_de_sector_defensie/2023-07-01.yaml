  - number: '18.5'
    text: |-
      Het Wachtgeldbesluit burgerlijke ambtenaren defensie, het Uitkeringsbesluit burgerlijke ambtenaren defensie, het
      Wachtgeld- en uitkeringsbesluit burgerlijke ambtenaren defensie bij privatisering en de Militaire wachtgeldregeling
      1961 worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel18
  - number: '18.6'
    text: |-
      De in het vijfde lid genoemde besluiten blijven van kracht ten aanzien van degenen van wie de ontslagdatum is
      gelegen voor 1 juli 1996 en ten aanzien van degenen die zijn of worden ontslagen in het kader van het Sociaal
      Beleidskader Defensie, zoals dat luidde op 31 december 2011 en wegens diezelfde onvrijwillige werkloosheid geen
      aanspraak maken op een uitkering krachtens de WW.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel18
  - number: '18.7'
    text: |-
      bij de toepassing van het zesde lid wordt in geval van van een deeltijddienstverhouding voor de berekening van het
      wachtgeld de laatstgenoten bezoldiging vermenigvuldigd met een breuk, waarvan:
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel18
  - number: 18.7.a
    text: |-
      de teller wordt gevormd door het geheel van voor de pensioengrondslag in beschouwing te nemen inkomsten en baten,
      voor zover deze feitelijk zijn genoten, en
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel18
  - number: 18.7.b
    text: de noemer gelijk is aan de laatstgenoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel18
  - number: 18a
    text: |-
      Onze Minister kan van de [artikelen 2 tot en met 7][ref1] en [9 tot en met 16][ref2] afwijken voor zover toepassing
      gelet op het belang van dat deze regelgeving beoogd te beschermen zal leiden tot een onbillijkheid van overwegende
      aard.


      [ref1]: https://wetten.overheid.nl/BWBR0010510#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010510#Artikel9
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel18a
