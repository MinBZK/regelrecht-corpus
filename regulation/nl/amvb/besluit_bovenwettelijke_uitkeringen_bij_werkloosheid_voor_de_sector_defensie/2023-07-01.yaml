  - number: '2.1'
    text: |-
      Betrokkene die recht heeft op een WW-uitkering en die op de dag voor het intreden van zijn werkloosheid een
      aangesloten dienstijd heeft van tenminste 6 jaar en 40 jaar of ouder is, heeft na het einde van de uitkeringsduur
      van de WW-uitkering recht op een aansluitende uitkering. De duur van de aansluitende uitkering is het verschil in
      uitkeringsduur tussen de [WW][ref1] en de uitkeringsduur van de [WW][ref2] zoals deze gold voor 1 oktober 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
  - number: '2.2'
    text: |-
      In afwijking van het eerste lid is, voor de betrokkene met een arbeidsverleden van ten minste 22 jaar, die onder
      toepassing van het Sociaal Beleidskader wordt ontslagen, de duur van de aansluitende uitkering tweemaal de duur van
      het recht op een WW-uitkering zoals dat luidt op 1 januari 2012.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel2
  - number: 2.3.a
    text: |-
      Betrokkene die recht heeft op een WW-uitkering en die op de dag voor het intreden van zijn werkloosheid
      een aaneengesloten diensttijd heeft van tenminste 10 jaar en 50 jaar of ouder is, heeft na het einde van de
      uitkeringsduur van de WW-uitkering recht op een aansluitende uitkering tot de dag waarop hij de pensioengerechtigde
      leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel2
  - number: 2.3.b
    text: |-
      In afwijking van onderdeel a hoeft de diensttijd van de betrokkene die onder toepassing van het Sociaal
      Beleidskader wordt ontslagen, niet aaneengesloten te zijn vervuld.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel2
  - number: '2.4'
    text: |-
      Onze Minister kan voor de berekening van de diensttijd, bedoeld in het eerste en derde lid, de tijd meetellen, die
      betrokkene bij een andere sector van de overheid heeft doorgebracht, indien die betrokkene in het kader van een
      reorganisatie bij die andere sector van de overheid bij het Ministerie van Defensie te werk is gesteld.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel2
  - number: '2.5'
    text: |-
      Het recht op een aansluitende uitkering eindigt na ommekomst van de duur daarvan, maar uiterlijk de dag waarop
      betrokkene de pensioengerechtigde leeftijd heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel2
  - number: '2.6'
    text: |-
      Er bestaat geen recht op aansluitende uitkering als betrokkene zijn recht heeft afgekocht als bedoeld in
      [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010510#Artikel15
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010510
        artikel: '15'
        hoofdstuk: '5'
  - number: '3.1'
    text: |-
      Betrokkene, die recht heeft op een WW-uitkering, dan wel een aansluitende uitkering ingevolge [artikel 2][ref1],
      heeft recht op een aanvullende uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0010510#Artikel2
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010510
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      Er bestaat geen recht op aanvullende uitkering als betrokkene zijn recht heeft afgekocht als bedoeld in
      [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010510#Artikel15
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010510
        artikel: '15'
        hoofdstuk: '5'
  - number: '4.1'
    text: |-
      De WW-uitkering wordt gedurende de eerste zes maanden aangevuld tot 80%, gedurende de daarop volgende zes maanden
      tot 75% en gedurende de resterende periode tot 70% van het voor betrokkene geldende dagloon.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel4
  - number: '4.2'
    text: |-
      Gedurende de duur van de aansluitende uitkering, bedoeld in [artikel 2][ref1], bedraagt de uitkering 70% van het
      voor betrokkene geldende dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0010510#Artikel2
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010510
        artikel: '2'
        hoofdstuk: '2'
  - number: '5.1'
    text: |-
      Indien betrokkene gedurende de periode dat hij recht heeft op een loongerelateerde WW-uitkering of op een
      aansluitende uitkering, wegens ziekte verhinderd wordt arbeid te verrichten en daarom een uitkering krachtens de
      [Ziektewet][ref1] ontvangt, wordt de uitkering krachtens de [Ziektewet][ref2] aangevuld tot de percentages van het
      dagloon bedoeld in [artikel 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0010510#Artikel4
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0010510
        artikel: '4'
        hoofdstuk: '2'
  - number: '5.2'
    text: |-
      De uitkering krachtens de [Ziektewet][ref1] wordt aangevuld tot het percentage van het voor betrokkene geldende
      dagloon, bedoeld in [artikel 4][ref2], dat van toepassing zou zijn indien betrokkene niet ziek zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0010510#Artikel4
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0010510
        artikel: '4'
        hoofdstuk: '2'
  - number: '5.3'
    text: |-
      In afwijking van het tweede lid wordt indien de vrouwelijke betrokkene gedurende de periode dat zij recht heeft
      op een loongerelateerde WW-uitkering of op een aansluitende uitkering recht krijgt op een uitkering krachtens
      [artikel 29a van de Ziektewet][ref1], die uitkering aangevuld tot 100% van het voor betrokkene geldende dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29a
  - number: 5a.1
    text: |-
      De uitkering krachtens de [Wet arbeid en zorg][ref1] die betrokkene heeft in verband met adoptieverlof wordt
      gedurende ten hoogste vier aaneengesloten weken vanaf twee weken vóór de eerste dag dat de feitelijke opneming ter
      adoptie een aanvang heeft genomen of zal nemen, aangevuld tot 100% van het voor betrokkene geldende dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 5a.2
    text: |-
      Voor de toepassing van dit artikel wordt de uitkering krachtens de [Wet arbeid en zorg][ref1] steeds aangemerkt als
      onverminderd door betrokkene te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: '6.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van betrokkene wordt de uitkering bedoeld in [artikel 35][ref1], dan wel
      [36 van de Ziektewet][ref2] aangevuld tot 100% van het voor betrokkene geldende dagloon over een tijdvak van
      3 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel36
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '36'
  - number: '6.2'
    text: |-
      Indien betrokkene overlijdt tijdens de duur van de uitkering op grond van dit besluit en er geen recht bestaat
      op een overlijdensuitkering op grond van [artikel 35][ref1] en [36 van de Ziektewet][ref2], uitsluitend omdat
      betrokkene niet meer verzekerd is op grond van de [Ziektewet][ref3], wordt een overlijdensuitkering betaald onder
      overeenkomstige toepassing van [artikel 35][ref4] en [36 van de Ziektewet][ref5]. Deze uitkering wordt aangevuld
      overeenkomstig het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel36
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref5
        bwb_id: BWBR0001888
        artikel: '36'
  - number: '7.1'
    text: |-
      Tijdens de duur van de aanvullende en aansluitende uitkeringen zijn de regels betreffende het recht op een WW-
      uitkering welke bij of krachtens de [WW][ref1] zijn vastgesteld van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '7.2'
    text: |-
      Tijdens de duur van de aanvullende uitkering bij ziekte zijn de regels betreffende het recht op een Ziektewet-
      uitkering welke bij of krachtens de [Ziektewet][ref1] zijn vastgesteld van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '7.3'
    text: In afwijking van het bepaalde in het eerste en tweede lid kan Onze Minister nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel7
  - number: '8'
    text: Onze Minister beslist over de toekenning van de bovenwettelijke uitkering op aanvraag van betrokkene.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel8
  - number: '9.1'
    text: |-
      Betrokkene, die aansluitend aan zijn ontslag een passende nieuwe betrekking aanvaardt, ontvangt op zijn aanvraag
      een loonaanvulling, indien het dagloon in de nieuwe betrekking minder bedraagt dan het dagloon dat voor hem zou
      gelden als hij werkloos zou zijn geworden.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel9
  - number: '9.2'
    text: |-
      Betrokkene, wiens recht op uitkering geheel of gedeeltelijk wordt beëindigd wegens het aanvaarden van een passende
      nieuwe betrekking ontvangt op zijn aanvraag een loonaanvulling, indien het dagloon in de nieuwe betrekking minder
      bedraagt dan het voor hem geldende dagloon.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel9
  - number: 9.3.a
    text: |-
      De hoogte van de loonaanvulling is gelijk aan het verschil tussen enerzijds het dagloon in de nieuwe betrekking en
      anderzijds het voor hem geldende dagloon.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel9
  - number: 9.3.b
    text: |-
      Voor zover betrokkene gelijktijdig nog recht heeft op een WW-uitkering en of bovenwettelijke uitkering, is de
      hoogte van de loonaanvulling gelijk aan het verschil tussen enerzijds het dagloon in de nieuwe betrekking en de WW-
      uitkering en of bovenwettelijke uitkering tezamen en anderzijds het voor hem geldende dagloon.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel9
  - number: '9.4'
    text: |-
      De loonaanvulling wordt proportioneel toegekend, indien de omvang van de nieuwe betrekking minder bedraagt dan de
      betrekking waaruit de betrokkene is ontslagen. Indien de omvang van de nieuwe betrekking groter is dan de omvang
      van de betrekking waaruit de betrokkene is ontslagen, bedraagt de hoogte van de loonaanvulling het feitelijk
      verschil in dagloon tussen het voor hem geldende dagloon en het dagloon uit de nieuwe betrekking.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel9
  - number: 9.5.a
    text: |-
      De duur van de loonaanvulling is gelijk aan de duur waarop recht op een WW, dan wel aansluitende uitkering bestaat
      of zou hebben bestaan indien betrokkene werkloos zou zijn gebleven of zou zijn geworden;
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel9
  - number: 9.5.b
    text: |-
      In afwijking van onderdeel a. duurt de loonaanvulling voor de betrokkene, die onder toepassing van het Sociaal
      Beleidskader ontslagen wordt, tot de dag waarop hij de pensioengerechtigde leeftijd heeft bereikt, indien hij
      direct voorafgaand aan zijn ontslag een diensttijd heeft van tenminste 10 jaar en de som van diensttijd plus
      leeftijd van betrokkene tenminste 65 jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel9
  - number: '9.6'
    text: |-
      Indien betrokkene wegens ziekte, zwangerschap of bevalling, of wegens een omstandigheid die in redelijkheid voor
      rekening van de werkgever behoort te komen, verhinderd is zijn arbeid te verrichten, of zijn arbeid niet verricht
      wegens verlof, blijft het recht op loonaanvulling bestaan voor zolang hij recht heeft op loon, maar ten hoogste
      gedurende de periode bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel9
  - number: '9.7'
    text: |-
      De loonaanvulling eindigt met ingang van de dag, waarop betrokkene opnieuw werkloos wordt of niet meer voldoet aan
      de voorwaarde, bedoeld in het eerste dan wel tweede lid, of de duur van de uitkering is verstreken.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel9
  - number: '9.8'
    text: |-
      Indien betrokkene na beëindiging van de betrekking als bedoeld in het eerste en tweede lid, een volgende passende
      betrekking aanvaardt, herleeft het recht op loonaanvulling voor de resterende duur daarvan.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel9
  - number: '9.9'
    text: 'Dit artikel is mede van toepassing op degene aan wie op aanvraag ontslag wordt verleend op voorwaarde dat:'
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel9
  - number: 9.9.a
    text: |-
      hij ten tijde van dat ontslag onder toepassing van het Sociaal Beleidskader tot een knelpuntcategorie behoort of
      herplaatsingskandidaat is;
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel9
  - number: 9.9.b
    text: '[artikel 53g van het Algemeen militair ambtenarenreglement](onbekend) van toepassing is.'
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel9
  - number: '10.1'
    text: |-
      Het recht op de bovenwettelijke uitkering herleeft op aanvraag van betrokkene indien hij na aanvaarding van arbeid
      wederom werkloos is geworden en recht heeft op een uitkering krachtens de [WW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '10.2'
    text: |-
      De duur en de hoogte van de bovenwettelijke uitkering zijn gelijk aan de duur en hoogte van de bovenwettelijk
      uitkering waarop betrokkene nog recht gehad zou hebben indien hij onafgebroken werkloos zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel10
  - number: '10.3'
    text: |-
      Betrokkene, die nadat hij aansluitend aan zijn ontslag een nieuwe betrekking heeft aanvaard, werkloos wordt en
      dientengevolge recht heeft op een uitkering krachtens de [WW][ref1], heeft op aanvraag recht op een bovenwettelijke
      uitkering krachtens dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '10.4'
    text: |-
      De duur en hoogte van de bovenwettelijke uitkering zijn gelijk aan de duur en hoogte van de bovenwettelijke
      uitkering waarop betrokkene nog recht zou hebben indien hij vanaf het tijdstip waarop het ontslag is ingegaan
      onafgebroken werkloos zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel10
  - number: '11.1'
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel11
  - number: 11.1.a
    text: |-
      betrokkene: de betrokkene aan wie een privatiseringsontslag is verleend en die onmiddellijk aansluitend aan dat
      ontslag in dienst is getreden van de privaatrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel11
  - number: 11.1.b
    text: |-
      privatiseringsoperatie: een operatie die ten doel heeft werkzaamheden van het Ministerie van Defensie uit te
      besteden of over te dragen aan een bestaande of voor dat doel opgerichte privaatrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel11
  - number: 11.1.c
    text: |-
      privaatrechtelijke organisatie: de privaatrechtelijke organisatie die de werkzaamheden uitvoert die in het kader
      van een privatiseringsoperatie door het Ministerie van Defensie zijn uitbesteed of overgedragen;
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel11
  - number: 11.1.d
    text: 'privatiseringsontslag: het ontslag uit een overheidsbetrekking in het kader van een privatiseringsoperatie;'
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel11
  - number: 11.1.e
    text: 'ontslag als werknemer: het ontslag uit de betrekking bij de privaatrechtelijke organisatie.'
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel11
  - number: '11.2'
    text: |-
      Indien binnen twee jaar na het privatiseringsontslag blijkt dat de betrekking die betrokkene bij de
      privaatrechtelijke organisatie vervult niet passend is en hij in verband daarmee al dan niet op eigen verzoek is
      ontslagen, heeft hij recht op de bovenwettelijke uitkering uit hoofde van zijn ontslag als werknemer met ingang van
      de dag op welke hij aanspraak krijgt op een uitkering krachtens de [WW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '11.3'
    text: |-
      Indien betrokkene binnen twee jaar na het privatiseringsontslag als werknemer is ontslagen ten gevolge van
      opheffing van zijn betrekking bij de privaatrechtelijke organisatie of overtolligheid van personeel door
      verandering of inkrimping van die organisatie heeft hij recht op de bovenwettelijke uitkering uit hoofde van zijn
      ontslag als werknemer met ingang van de dag op welke hij aanspraak krijgt op een uitkering krachtens de [WW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '11.4'
    text: |-
      Betrokkene die als werknemer is ontslagen en op wie het tweede of derde lid niet van toepassing is, heeft uit
      hoofde van zijn ontslag als werknemer recht op de bovenwettelijke uitkering met ingang van de dag op welke hij
      aanspraak krijgt op een uitkering krachtens de [WW][ref1], met dien verstande dat de duur en de hoogte van de
      bovenwettelijke uitkering ingaat op de dag van het privatiseringsontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '12.1'
    text: |-
      Betrokkene die ter zake van eenzelfde ontslag recht heeft op een suppletie als bedoeld in de Suppletieregeling
      gedeeltelijk arbeidsongeschikten sector defensie heeft gedurende de termijn dat hij recht heeft op die suppletie
      geen recht op een bovenwettelijke uitkering krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel12
  - number: '12.2'
    text: |-
      Betrokkene als bedoeld in het eerste lid, heeft met ingang van de eerste dag volgende op die waarop de duur van
      de suppletie is geëindigd, recht op een bovenwettelijke uitkering krachtens dit besluit, indien de duur van de
      uitkering, waarop betrokkene krachtens dit besluit recht zou hebben gehad indien hij geen recht op suppletie zou
      hebben gehad, langer is dan de duur van de suppletie.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel12
  - number: '12.3'
    text: |-
      Op de hoogte van de uitkering is [artikel 4][ref1] van toepassing in die zin dat gerekend wordt vanaf het tijdstip
      waarop het ontslag is ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010510#Artikel4
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010510
        artikel: '4'
        hoofdstuk: '2'
  - number: '12.4'
    text: |-
      Het recht op een uitkering krachtens dit besluit eindigt met ingang van de dag waarop betrokkene recht verkrijgt op
      een arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van 80% of meer.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel12
  - number: '13'
    text: |-
      Indien betrokkene aansluitend aan het ontslag recht heeft op een arbeidsongeschiktheidsuitkering berekend
      naar een arbeidsongeschiktheid van 80% of meer, en nadien als gevolg van een vaststelling van de mate van
      arbeidsongeschiktheid op minder dan 80% recht krijgt op een bovenwettelijke uitkering op grond van dit besluit,
      worden duur en hoogte van de bovenwettelijke uitkering vastgesteld alsof de bovenwettelijke uitkering zou zijn
      ingegaan op de ingangsdatum van het ontslag.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel13
  - number: '14'
    text: |-
      Aan betrokkene, die elders arbeid of bedrijf ter hand gaat nemen, kan ter zake van de kosten, die
      voor hem aan een daartoe nodige verhuizing zijn verbonden, op zijn aanvraag door Onze Minister een
      tegemoetkoming worden toegekend tot ten hoogste het bedrag van een vergoeding volgens de normen van het
      [Verplaatsingskostenbesluit defensie][ref1], onder verrekening van een tegemoetkoming in verhuiskosten uit andere
      hoofde.


      [ref1]: https://wetten.overheid.nl/BWBR0032312
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0032312
  - number: 14a.1
    text: |-
      Aan de gewezen militair die met toepassing van het Sociaal Beleidskader overtolligheidsontslag is verleend en die
      in verband met dat ontslag recht heeft op een aanvullende of aansluitende uitkering, wordt een tegemoetkoming in de
      inkomensafhankelijke bijdrage [Zorgverzekeringswet][ref1] toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 14a.2
    text: |-
      De tegemoetkoming bedraagt het verschil in inkomensafhankelijke bijdrage aan de [Zorgverzekeringswet][ref1]
      voor degene die recht heeft op een aanvullende of aansluitende uitkering en de inkomensafhankelijke
      bijdrage aan de Zorgverzekeringswet voor degene die recht heeft op een uitkering ingevolge de
      [Uitkeringswet gewezen militairen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0002540
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0002540
  - number: 14a.3
    text: |-
      De tegemoetkoming wordt eenmaal per kalenderjaar in januari verstrekt, zolang de aanvullende of aansluitende
      uitkering duurt.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel14a
  - number: '15.1'
    text: |-
      Betrokkene kan Onze Minister verzoeken om afkoop van het recht op de aanvullende of aansluitende uitkeringen waarop
      hij recht zou hebben gehad indien hij aansluitend aan het einde van zijn ontslag voortdurend werkloos zou zijn
      gebleven.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel15
  - number: '15.2'
    text: |-
      Een aanvraag als bedoeld in het eerste lid kan ook worden ingediend gedurende de aanvullende of aansluitende
      uitkering ten aanzien van het resterende deel daarvan.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel15
  - number: '15.3'
    text: De afkoopsom bedraagt 30 % van de (resterende) nominale waarde aan bovenwettelijke uitkeringen.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel15
  - number: '15.4'
    text: |-
      Met de afkoop van bovenwettelijke uitkering doet betrokkene afstand van alle overige rechten in verband met zijn
      ontslag waarop hij tot de pensioengerechtigde leeftijd jegens Onze Minister aanspraak zou kunnen maken.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel15
  - number: '16'
    text: |-
      Indien het niveau van de uitkering van de WW een algemene neerwaartse wijziging ondergaat, wordt deze neerwaartse
      wijziging, behoudens indien in het sector overleg Defensie sociale partners anders overeenkomen binnen 6 maanden na
      de datum van uitgifte van het Staatsblad waarin de maatregel is gepubliceerd, op overeenkomstige wijze ten aanzien
      van de bovenwettelijke uitkeringen doorgevoerd vanaf de in het Staatsblad vermelde datum van inwerkingtreding van
      bedoelde maatregel, doch niet eerder dan 6 maanden na de datum van uitgifte van het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel16
  - number: '17'
    text: |-
      Onze Minister kan ter uitvoering van de [artikelen 2, vijfde lid][ref1], [9][ref2], [10][ref3], [14][ref4] en
      [15][ref5] nadere regels van administratieve aard stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0010510#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010510#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0010510#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0010510#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0010510#Artikel15
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0010510
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0010510
        artikel: '9'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0010510
        artikel: '10'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0010510
        artikel: '14'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0010510
        artikel: '15'
        hoofdstuk: '5'
  - number: 17a.1
    text: 'De militair die:'
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17a
  - number: 17a.1.a
    text: |-
      een functie vervult in fase 2 of 3, als bedoeld in
      [artikel 1, eerste lid, onderdeel m respectievelijk n, van het Algemeen militair ambtenarenreglement][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel1
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '1'
  - number: 17a.1.b
    text: ontslag op aanvraag wordt verleend; en
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17a
  - number: 17a.1.c
    text: aansluitend aan zijn ontslag een nieuwe betrekking aanvaardt; en
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17a
  - number: 17a.1.d
    text: |-
      uit de nieuwe betrekking inkomsten heeft die ten minste 80% bedragen van de berekeningsgrondslag voor de pensioenen
      bedoeld in [artikel 23a van het Inkomstenbesluit militairen][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel23a
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 23a
  - number: 17a.1.e
    text: voldoet aan bij ministeriële regeling te stellen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17a
  - number: 17a.2
    text: |-
      De loonaanvulling bedraagt 50% van het verschil tussen het inkomen uit de nieuwe betrekking en de
      berekeningsgrondslag voor de pensioenen bedoeld in [artikel 23a van het Inkomstenbesluit militairen][ref1] en heeft
      een duur van ten hoogste drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel23a
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 23a
  - number: 17b.1
    text: |-
      Degene aan wie ontslag op aanvraag wordt verleend en die ten tijde van dat ontslag een aaneengesloten diensttijd
      heeft van ten minste 24 jaar, kan op zijn verzoek in aanmerking komen voor een gegarandeerd maandelijks inkomen
      indien:
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17b
  - number: 17b.1.a
    text: |-
      hij onder toepassing van het Sociaal Beleidskader behoort tot een knelpuntcategorie, remplaçant of externe
      herplaatsingskandidaat is;
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17b
  - number: 17b.1.b
    text: '[artikel 53g van het Algemeen militair ambtenarenreglement](onbekend) van toepassing is.'
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17b
  - number: 17b.2
    text: Het gegarandeerd maandelijks inkomen bedraagt bij een diensttijd van
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17b
  - number: 17b.2.a
    text: '24 tot 28 jaar: 30 %'
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17b
  - number: 17b.2.b
    text: '28 tot 32 jaar: 35 %'
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17b
  - number: 17b.2.c
    text: '32 dienstjaren en meer: 37,5 %'
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17b
  - number: 17b.3
    text: |-
      In afwijking van de diensttijd als bedoeld in [artikel 1][ref1], blijft de tijd welke de persoon in dienst is
      geweest bij de rijksoverheid, dan wel een sector van de rijksoverheid, buiten beschouwing bij het vaststellen van
      de diensttijd voor het gegarandeerd maandelijks inkomen. Diensttijd wordt ook als «aaneengesloten» beschouwd indien
      deze eenmaal gedurende maximaal een jaar is onderbroken.


      [ref1]: https://wetten.overheid.nl/BWBR0010510#Artikel1
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0010510
        artikel: '1'
        hoofdstuk: '1'
  - number: 17b.4
    text: |-
      Op het gegarandeerd maandelijks inkomen worden inkomsten in verband met arbeid of uitoefening
      van een bedrijf in mindering gebracht indien en voor zover daarmee de vigerende norm volgens de
      [Wet Openbaarmaking uit de Publieke middelen gefinancierde Topinkomens][ref1] wordt overschreden. De persoon,
      bedoeld in het eerste lid, is verplicht Onze Minister van de inkomsten terstond mededeling te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0019562
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0019562
  - number: 17b.5
    text: |-
      Het gegarandeerd maandelijks inkomen eindigt zodra de persoon, bedoeld in het eerste lid, de voor hem geldende
      pensioengerechtigde leeftijd heeft bereikt, of zodra hij wederom werkzaamheden gaat verrichten bij of voor Onze
      Minister anders dan als zelfstandig ondernemer op individuele basis.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17b
  - number: 17b.6
    text: |-
      Met de toekenning van het gegarandeerd maandelijks inkomen doet de persoon, bedoeld in het eerste lid, afstand
      van alle overige rechten waarop hij tot de pensioengerechtigde leeftijd in verband met zijn ontslag jegens Onze
      Minister aanspraak zou kunnen maken.
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel17b
  - number: '18.1'
    text: |-
      Het [Werkloosheidsbesluit beroepsmilitairen bepaalde tijd][ref1] en het
      [Werkloosheidsbesluit defensiepersoneel][ref2] zijn ingetrokken met ingang van 1 januari 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0007212
      [ref2]: https://wetten.overheid.nl/BWBR0008113
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007212
      - id: ref2
        bwb_id: BWBR0008113
  - number: '18.2'
    text: |-
      Betrokkene die op 31 december 2002 recht heeft op een uitkering ingevolge een in
      het eerste lid genoemd besluit of die verkeert in een omstandigheid als bedoeld in
      [artikel 30, eerste lid, onder c, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1], heeft,
      indien het recht op die uitkering na vorenbedoelde dag zou voortduren of herleven, recht op een uitkering krachtens
      dit besluit. Voor de duur en de hoogte van de uitkering krachtens dit besluit wordt uitgegaan van het tijdstip
      van het ontstaan van de in de eerste volzin bedoelde voorafgaande uitkering en van de normen van het besluit dat
      daaraan ten grondslag heeft gelegen. Voor de ingevolge dit artikellid toe te kennen uitkering wordt betrokkene
      aangemerkt als rechthebbende op een WW-uitkering die daarop niet in mindering strekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009267#Artikel30
    url: https://wetten.overheid.nl/BWBR0010510/2023-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009267
        artikel: '30'
  - number: '18.3'
    text: |-
      Indien de uitkering krachtens de [WW][ref1] en de uitkering krachtens dit besluit waar betrokkene bedoeld in het
      tweede lid recht op heeft, lager is dan de uitkering ingevolge het [Werkloosheidsbesluit defensiepersoneel][ref2]
      waarop betrokkene recht had op de dag voorafgaande aan de datum, bedoeld in het eerste lid, of
      op de dag waarop zijn uitkering is geëindigd als gevolg van een omstandigheid als bedoeld in
      [artikel 30, eerste lid, onder c, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref3],
      heeft betrokkene recht op een garantie-uitkering krachtens dit besluit. De garantie-uitkering bedraagt het
      verschil tussen de uitkering ingevolge het [Werkloosheidsbesluit defensiepersoneel][ref4] waarop de betrokkene
      recht zou hebben gehad als dat besluit op grond van het eerste lid niet zou zijn ingetrokken en de uitkering
      krachtens de [WW][ref5] aangevuld met de uitkering krachtens dit besluit. Indien de uitkering op grond van
      het [Werkloosheidsbesluit defensiepersoneel][ref6], de [WW][ref7] of dit besluit op grond van enige wettelijke
      bepaling geheel of gedeeltelijk is geweigerd, dan wel niet of niet geheel is betaald, wordt deze uitkering
      voor de vastelling van de garantie-uitkering geacht onverminderd te zijn genoten. Op de garantie-uitkering is
      [artikel 7][ref8] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008113
