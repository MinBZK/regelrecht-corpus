$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_staten_natura_uitvaartverzekeringsbedrijf
regulatory_layer: AMVB
publication_date: '2006-12-07'
valid_from: '2002-01-01'
bwb_id: BWBR0007652
url: https://wetten.overheid.nl/BWBR0007652/2002-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 18 juli 1995, no. BGW 95-1663M, Generale Thesaurie, Directie
    Binnenlands Geldwezen, Afdeling Verzekeringswezen;

    Gelet op de artikelen 33, vijfde lid, 39, tweede lid, 46 en 92, eerste lid, van de Wet toezicht natura-
    uitvaartverzekeringsbedrijf;

    Gezien de adviezen van de Verzekeringskamer en van het Verbond van Verzekeraars;

    De Raad van State gehoord (advies van 12 september 1995, no. W06.95.0406);

    Gezien het nader rapport van Onze Minister van Financiën van 8 november 1995, no. BGW95-2103U;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De modellen van de staten, bedoeld in
      [artikel 33, vijfde lid, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1], en de modellen van de bij
      de staten behorende omslagen worden vastgesteld zoals zij zijn opgenomen in [bijlage A][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0007652
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0007652
  - number: '1.2'
    text: |-
      De Pensioen- & Verzekeringskamer kan met betrekking tot het invullen van de staten aanwijzingen geven en deze
      aanwijzingen wijzigen of aanvullen.
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel1
  - number: '1.3'
    text: |-
      De modellen van de staten en van de omslagen worden, evenals de aanwijzingen van de Pensioen- & Verzekeringskamer,
      vanwege de Pensioen- & Verzekeringskamer tegen door haar vast te stellen prijzen beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel1
  - number: '1.4'
    text: |-
      Als staten en omslagen kunnen ook andere formulieren worden gebruikt, mits deze naar indeling en inhoud geen - en
      wat betreft hun formaat geen wezenlijke - afwijking vertonen van de vastgestelde modellen, met dien verstande dat
      de tekst op de voorzijde van deze modellen niet behoeft te worden overgenomen indien de voorgeschreven aanduiding
      van de verzekeraar wordt opgenomen in het hoofd van de staat en de voorgeschreven ondertekening en waarmerking
      plaatsvinden aan het einde van de staat.
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel1
  - number: '1.5'
    text: |-
      De Pensioen- & Verzekeringskamer kan toestaan dat als staten en omslagen ook andere informatiedragers worden
      gebruikt, mits deze naar indeling en inhoud geen afwijking vertonen van de vastgestelde modellen. Zij kan
      daarbij, in afwijking van [artikel 2, eerste en tweede lid][ref1], nadere regels stellen ter zake van de wijze van
      indiening, ondertekening en waarmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0007652#Artikel2
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007652
        artikel: '2'
  - number: '2.1'
    text: |-
      De staten worden met de verklaring omtrent de getrouwheid bedoeld in
      [artikel 33a, eerste lid, eerste volzin, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1], in de bij
      de staten behorende omslag bij de Pensioen- & Verzekeringskamer ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel33a
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 33a
  - number: '2.2'
    text: |-
      Bij de staten wordt een verklaring van het bestuur gevoegd, waarin dit zich verantwoordelijk stelt voor de in
      de staten en, indien van toepassing, de in de andere informatiedrager opgenomen gegevens. In deze verklaring
      wordt tevens opgenomen het saldo van de resultatenrekening en het eigen vermogen zoals dat uit de balans blijkt.
      De ondertekening geschiedt door ten minste twee bestuurders. In geval van een verzekeraar met zetel buiten
      Nederland geschiedt de ondertekening door de vertegenwoordiger, bedoeld in artikel 1, onderdeel *i*, van de
      [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007477
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007477
  - number: '2.3'
    text: |-
      Staten die niet van toepassing zijn voor de verzekeraar behoeven niet te worden ingediend. Bij verschil van mening
      hierover beslist de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel2
  - number: '2.4'
    text: |-
      De Pensioen- & Verzekeringskamer kan aan een verzekeraar ontheffing verlenen van de invulling en indiening van
      op hem van toepassing zijnde staten of van de invulling en indiening van bepaalde gedeelten daarvan. Aan een
      ontheffing kunnen voorwaarden worden verbonden en zij kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel2
  - number: '3'
    text: Bijvoeging van posten of rubrieken in de staten is niet geoorloofd, tenzij dit in de modellen is voorzien.
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel3
  - number: '4'
    text: |-
      De staten van een verzekeraar met zetel buiten Nederland mogen uitsluitend de gegevens bevatten die betrekking
      hebben op het natura-uitvaartverzekeringsbedrijf uitgeoefend vanuit de bijkantoren in Nederland.
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel4
  - number: '5'
    text: |-
      Vergezeld van de verklaring omtrent de getrouwheid, bedoeld in
      [artikel 33a, eerste lid, eerste volzin, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1], worden
      openbaar gemaakt de staten 100, 101, 110, 111, 200, 201, 210, 211, 212, 220, 222, 370, 400 en 500.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel33a
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 33a
  - number: 5a.1
    text: |-
      Het bedrag van de boete, bedoeld in
      [artikel 93d, vijfde lid, eerste volzin, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1] wordt
      bepaald op de wijze, voorzien in [bijlage B][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel93d
      [ref2]: https://wetten.overheid.nl/BWBR0007652
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 93d
      - id: ref2
        bwb_id: BWBR0007652
  - number: 5a.2
    text: |-
      De Pensioen- & Verzekeringskamer kan het bedrag van de boete lager stellen dan in [bijlage B][ref1] is bepaald,
      indien het bedrag van de boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.


      [ref1]: https://wetten.overheid.nl/BWBR0007652
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0007652
  - number: '6'
    text: |-
      De ingevolge dit besluit in te dienen staten worden voor de eerste maal ingediend over het in 1996 geëindigde
      boekjaar.
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel6
  - number: '7'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop de
      [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007477
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007477
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit staten natura-uitvaartverzekeringsbedrijf.'
    url: https://wetten.overheid.nl/BWBR0007652/2002-01-01#Artikel8
