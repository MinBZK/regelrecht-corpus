  - number: '1.2'
    text: 'Dit besluit verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel1
  - number: 1.2.a
    text: |-
      wet: [Wet op de omzetbelasting 1968][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 1.2.b
    text: 'belasting: omzetbelasting.'
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel1
  - number: '2.1'
    text: |-
      Met kortingen wegens contante betaling wordt voor de bepaling van de vergoeding terstond rekening gehouden, mits op
      de factuur - ingeval deze wordt uitgereikt - de korting in mindering wordt gebracht op het in rekening te brengen
      bedrag.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel2
  - number: '2.2'
    text: |-
      In gevallen waarin het eerste lid toepassing heeft gevonden en de korting wegens contante betaling uiteindelijk
      geheel of ten dele niet wordt genoten, wordt de belasting alsnog verschuldigd over het bedrag van de niet genoten
      korting. De [artikelen 13][ref1], [17g][ref2] en [34c tot en met 35 van de wet][ref3] zijn van overeenkomstige
      toepassing, met dien verstande dat het tijdstip waarop het niet-genieten van de korting komt vast te staan, geacht
      wordt te zijn het tijdstip waarop de levering, de intracommunautaire verwerving of de dienst is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel17g
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel35
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 17g
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '35'
  - number: '3'
    text: |-
      [Artikel 29, eerste tot en met het vijfde, zevende en achtste lid][ref1], en
      [artikel 29a, eerste lid, van de wet][ref2] zijn niet van toepassing op bedragen welke niet zijn ontvangen
      onderscheidenlijk betaald ten gevolge van een korting voor contante betaling, indien niet ter zake van die korting
      een aanvullende factuur is uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel29a
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 29a
  - number: '4.1'
    text: 'Tot de vergoeding behoren niet:'
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel4
  - number: 4.1.b
    text: |-
      de assurantiekosten welke de ondernemer die de prestatie verricht, aan een andere ondernemer moet voldoen, mits zij
      afzonderlijk in rekening worden gebracht;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel4
  - number: 4.1.c
    text: |-
      de voor degene aan wie de dienst wordt bewezen, aan rechten bij invoer als bedoeld in
      [artikel 7:3 van de Algemene douanewet][ref1] en andere belastingen en heffingen gedane uitschotten, alsmede
      andere bij ministeriële regeling aan te wijzen met doorlopende posten gelijk te stellen bedragen betreffende niet
      belastbare of vrijgestelde prestaties.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel7
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '7'
  - number: '4.2'
    text: |-
      Voorts behoort bij levering van gebruikte personenauto’s, gebruikte motorrijwielen en gebruikte
      bestelauto’s anders dan met toepassing van [artikel 28b][ref1] of [28d van de wet][ref2],
      niet tot de vergoeding, het bij de personenauto, het motorrijwiel of de bestelauto nog
      behorende bedrag aan belasting bedoeld in en berekend overeenkomstig het bij of krachtens
      [artikel 10, derde en zesde lid, van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref3]
      bepaalde. In afwijking hiervan behoort bij levering van gebruikte motorrijtuigen waarvoor op de voet van de in de
      vorige volzin genoemde [wet][ref4] een vrijstelling of een teruggaaf is verleend, niet tot de vergoeding het bedrag
      dat ingevolge [die wet][ref5] bij het afstoten van het motorrijtuig moet worden voldaan door de ondernemer die
      het motorrijtuig levert, met dien verstande dat de eerste volzin van overeenkomstige toepassing is voor zover de
      belasting voor het motorrijtuig al op een eerder tijdstip is voldaan omdat niet langer aan de voorwaarden van de
      vrijstelling, onderscheidenlijk de teruggaaf, werd voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005806
      [ref5]: https://wetten.overheid.nl/BWBR0005806
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28d
      - id: ref3
        bwb_id: BWBR0005806
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0005806
      - id: ref5
        bwb_id: BWBR0005806
  - number: '4.3'
    text: |-
      Het tweede lid is alleen van toepassing indien de ondernemer op de factuur het bedrag vermeldt dat hij als
      belasting als bedoeld in de [Wet op de belasting van personenauto's en motorrijwielen 1992][ref1] op de vergoeding
      in mindering heeft gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005806
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005806
  - number: '5.1'
    text: |-
      Bij vestiging, overdracht, afstand en opzegging van de rechten van erfpacht, opstal, erfdienstbaarheid of
      beklemming behoort de waarde van de canon, de retributie of de huur tot de vergoeding, met dien verstande dat
      de vergoeding hierdoor niet hoger kan zijn dan de waarde in het economische verkeer van de zaak waarop het
      recht betrekking heeft. De waarde in het economische verkeer bedraagt ten minste de kostprijs, met inbegrip
      van de omzetbelasting, van de onroerende zaak waarop het recht betrekking heeft, zoals die zou ontstaan bij de
      voortbrenging door een onafhankelijke derde op het tijdstip van de handeling.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel5
  - number: '5.2'
    text: |-
      Bij levering van onroerende zaken, bezwaard met een recht van erfpacht, opstal, erfdienstbaarheid of beklemming,
      wordt de vergoeding verminderd met de waarde van de canon, de retributie of de huur.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel5
  - number: '5.3'
    text: |-
      Bij wijziging van een recht van erfpacht, opstal, erfdienstbaarheid of beklemming behoort het verschil in waarde
      tussen de canon, de retributie of de huur vóór en na de wijziging tot de vergoeding, met dien verstande dat bij
      vermindering van de waarde van de canon, de retributie of de huur, voor zover daar geen vermindering van de rechten
      van de zakelijk gerechtigde tegenover staat, het verschil in waarde op de vergoeding in mindering wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel5
  - number: '5.4'
    text: |-
      Bij levering onder voorbehoud van grondrente of van met grondrente bezwaarde eigendom behoort de waarde van de
      uitkering tot de vergoeding, met dien verstande dat de vergoeding hierdoor niet hoger kan zijn dan de waarde in het
      economische verkeer van de zaak waarop het recht betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel5
  - number: '5.5'
    text: |-
      De waarde van een canon, een retributie, een huur of een uitkering wordt bepaald met inachtneming van de bij dit
      besluit behorende [bijlage A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002633
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002633
  - number: '5.6'
    text: |-
      Het tweede tot en met het vijfde lid is niet van toepassing voor zover de vestiging, overdracht, wijziging, afstand
      en opzegging van rechten waaraan onroerende zaken zijn onderworpen niet op grond van [artikel 3, tweede lid][ref1],
      van de wet, met toepassing van de voorgaande leden, als levering van goederen wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
  - number: 5a
    text: |-
      Bij de berekening van de belasting over de vergoeding en over de douanewaarde overeenkomstig
      de [artikelen 8, eerste lid][ref1], en [17c, eerste lid][ref2], respectievelijk
      [artikel 19, eerste lid, van de wet][ref3], wordt het bedrag van de verschuldigde belasting rekenkundig afgerond
      op centen. Deze rekenkundige afronding op centen wordt zodanig toegepast dat bij bedragen waarbij de derde decimaal
      het cijfer 5 of een hoger cijfer bereikt omhoog wordt afgerond, en dat in geval de derde decimaal dit cijfer niet
      bereikt omlaag wordt afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel17c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel19
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 17c
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '19'
  - number: '6'
    text: |-
      Voor de toepassing van de in [artikel 11][ref1] van de wet vervatte vrijstellingen is de ondernemer gehouden een
      boekhouding te voeren waarin de voor die toepassing nodige gegevens op duidelijke en overzichtelijke wijze zijn
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: '7.1'
    text: |-
      Als leveringen en diensten van sociale of culturele aard als bedoeld in
      [artikel 11, eerste lid, onderdeel f , van de wet][ref1], worden aangewezen de leveringen en diensten, genoemd in
      de bij dit besluit behorende [bijlage B][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002633
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002633
  - number: '7.2'
    text: |-
      Voor zover niet vallend onder de bij dit besluit behorende [bijlage B][ref1] worden voorts als leveringen en
      diensten als bedoeld in [artikel 11, eerste lid, onderdeel f, van de wet][ref2] aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0002633
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002633
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 7.2.a
    text: |-
      leveringen en diensten die nauw samenhangen met maatschappelijk werk, met de sociale zekerheid en met de
      bescherming van kinderen en jongeren; en
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7
  - number: 7.2.b
    text: |-
      diensten van culturele aard andere dan die genoemd in de bij de wet behorende tabel I, onderdeel b, alsmede nauw
      daarmee samenhangende leveringen;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7
  - number: '7.3'
    text: |-
      De inspecteur trekt de erkenning, bedoeld in het tweede lid, bij voor bezwaar vatbare beschikking in en vervangt
      deze al dan niet door een nieuwe erkenning bij:
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7
  - number: 7.3.a
    text: wijzigingen in de aard en samenstelling van de leveringen en diensten van de instelling;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7
  - number: 7.3.b
    text: het beogen van winst door de instelling;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7
  - number: 7.3.c
    text: het optreden van een verstoring van concurrentieverhoudingen ten opzichte van ondernemers die winst beogen.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7
  - number: '7.4'
    text: |-
      Als leveringen en diensten van sociale of culturele aard als bedoeld in
      [artikel 11, eerste lid, onderdeel f, van de wet][ref1], worden niet aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 7.4.a
    text: |-
      de leveringen van goederen welke door de in het tweede lid bedoelde instellingen in het kader van arbeidstherapie
      zijn voortgebracht en de diensten welke door die instellingen in dat kader worden verricht;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7
  - number: 7.4.b
    text: |-
      diensten als bedoeld in [artikel 11, eerste lid, onderdeel g, onder 2° en 3°, van de wet][ref1] die worden
      verleend aan anderen dan de daarin bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: '7.5'
    text: |-
      Onder het niet beogen van winst, bedoeld in het tweede en derde lid, wordt verstaan dat niet systematisch het maken
      van winst mag worden beoogd en, zo er wel winst wordt gemaakt, deze niet mag worden uitgekeerd, maar die winst moet
      worden aangewend voor de instandhouding of verbetering van de leveringen en diensten die worden verleend.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7
  - number: '7.6'
    text: |-
      Bij wijzigingen in de aard en samenstelling van de leveringen en diensten van een instelling stelt de instelling de
      inspecteur daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7
  - number: 7a.1
    text: |-
      Als diensten als bedoeld in [artikel 11, eerste lid, onderdeel g, onder 3°, van de wet][ref1] worden aangewezen de
      diensten die verleend worden op grond van de [Wet maatschappelijke ondersteuning 2015][ref2], mits deze diensten:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0035362
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0035362
  - number: 7a.1.a
    text: |-
      worden verricht door de gemeente zelf of ter uitvoering van een overeenkomst die door de gemeente daartoe is
      gesloten;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
  - number: 7a.1.b
    text: |-
      worden verleend aan personen die op grond van de [artikelen 1.2.1.][ref1] en
      [2.2.3. van de Wet maatschappelijke ondersteuning 2015][ref2] ondersteund worden, en


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 7a.1.c
    text: 'bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
  - number: 7a.1.c.1°
    text: het schoonhouden van de woonruimte;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
  - number: 7a.1.c.2°
    text: het schoonhouden van kleding en huishoudlinnen behorende tot het huishouden van de cliënt;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
  - number: 7a.1.c.3°
    text: het ondersteunen bij of het overnemen van activiteiten op het gebied van de verzorging van de cliënt;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
  - number: 7a.1.c.4°
    text: ondersteunende activiteiten gericht op de bevordering van participatie en zelfredzaamheid.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
  - number: 7a.2
    text: |-
      Het vereiste, genoemd in het eerste lid, onderdeel a, geldt niet ten aanzien van diensten
      verricht voor de cliënt aan wie een persoonsgebonden budget is verstrekt als bedoeld in
      [artikel 2.3.6, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 7a.3
    text: 'Tot de diensten, bedoeld in het eerste lid, behoren in ieder geval niet:'
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
  - number: 7a.3.a
    text: het doen van aanpassingen aan, op of in de woonruimte;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
  - number: 7a.3.b
    text: het verrichten van onderhoud of herstelwerkzaamheden aan, op of in de woonruimte;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
  - number: 7a.3.c
    text: hovenierswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
  - number: 7a.3.d
    text: vervoersdiensten.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
  - number: 7a.4
    text: |-
      Als dienst als bedoeld in [artikel 11, eerste lid, onderdeel g, onder 3°, van de wet][ref1] wordt eveneens
      aangewezen het ter beschikking stellen van personeel aan een andere ondernemer in het kader van diensten die
      verleend worden op grond van de Wet maatschappelijke ondersteuning 2015, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 7a.4.a
    text: |-
      de uitlener voor zijn primaire activiteiten de vrijstelling, bedoeld in
      [artikel 11, eerste lid, onderdeel g, onder 3°, van de wet][ref1], toepast;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 7a.4.b
    text: |-
      de inlener het personeelslid inzet voor diensten als bedoeld in
      [artikel 11, eerste lid, onderdeel g, onder 3°, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 7a.4.c
    text: de terbeschikkingstelling van het personeel onontbeerlijk is voor het verrichten van deze vrijgestelde diensten; en
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
  - number: 7a.4.d
    text: |-
      de terbeschikkingstelling van het personeel er in hoofdzaak niet toe strekt extra opbrengsten te verkrijgen
      door de uitlener in rechtstreekse mededinging met commerciële ondernemers die aan de heffing van belasting zijn
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel7a
  - number: '8.1'
    text: |-
      Als onderwijs als bedoeld in [artikel 11, eerste lid, onderdeel o, 2°, van de wet][ref1], wordt aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 8.1.a
    text: 'beroepsopleidingen verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel8
  - number: 8.1.a.1°
    text: instellingen die opgenomen zijn in het Instellingenregister Beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel8
  - number: 8.1.a.2°
    text: |-
      natuurlijke personen die opgenomen zijn in het Docentenregister Beroepsonderwijs voor zover het betreft het
      verzorgen van beroepsopleidingen die niet worden uitgevoerd als instelling als bedoeld onder 1o, of
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel8
  - number: 8.1.a.3°
    text: |-
      de uit de openbare kassen bekostigde instellingen, genoemd in de bijlage van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] of bedoeld bij de
      [Wet educatie en beroepsonderwijs][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0007625
  - number: 8.1.b
    text: |-
      algemeen vormend onderwijs, ontleend aan het uit de openbare kassen bekostigde onderwijs dat is vrijgesteld op
      grond van [artikel 11, eerste lid, onderdeel o, 1°, van de wet][ref1], met uitzondering van het onderwijs dat een
      vrijetijds-karakter heeft dan wel dient om vaardigheden in de persoonlijke levenssfeer te verwerven;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 8.1.c
    text: onderwijs in muziek, dans, drama en beeldende vorming, aan personen jonger dan 21 jaar;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel8
  - number: 8.1.d
    text: |-
      bijlessen en tentamen- of examentrainingen die worden verstrekt in het kader van het onderwijs als bedoeld in
      [artikel 11, eerste lid, onderdeel o, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: '8.2'
    text: |-
      Onder onderwijs wordt mede begrepen het afnemen van examens ter toelating tot of ter afsluiting van onderwijs als
      bedoeld in [artikel 11, eerste lid, onderdeel o, van de wet][ref1], ook indien dat geschiedt door een ander dan de
      ondernemer die voor het desbetreffende examen heeft opgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: '9.1'
    text: |-
      Als diensten als bedoeld in [artikel 11, eerste lid, onderdeel u, van de wet][ref1], worden aangewezen de diensten,
      verleend aan hun leden door zelfstandige groeperingen van:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 9.1.b
    text: |-
      instellingen welke zijn toegelaten om op de voet van de [Woningwet][ref1] werkzaam te zijn in het belang van de
      volkshuisvesting, voor zover de diensten rechtstreeks nodig zijn voor het beheer of het onderhoud van woningwet-
      of premiewoningen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 9.1.d
    text: |-
      verplegings- en verzorgingsinstellingen waarvan de prestaties zijn vrijgesteld op grond van
      [artikel 11, eerste lid, onderdeel c, van de wet][ref1], voor zover de diensten rechtstreeks nodig zijn voor het
      verrichten van die prestaties, met uitzondering van de diensten, bestaande in de wasverzorging en het verzorgen van
      de loon- en salarisadministratie, de financiële administratie en de grootboekadministratie;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 9.1.e
    text: |-
      kruisverenigingen waarvan de prestaties zijn vrijgesteld op grond van
      [artikel 11, eerste lid, onderdeel f, van de wet][ref1], voor zover de diensten rechtstreeks nodig zijn voor het
      verrichten van die prestaties;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 9.1.f
    text: |-
      andere dan hiervoor genoemde personen of lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref1],
      die prestaties verrichten welke zijn vrijgesteld of waarvoor zij geen ondernemer zijn, voor zover de diensten
      rechtstreeks nodig zijn voor het verrichten van die prestaties, met uitzondering van de diensten, bestaande in het
      verzorgen van de loon- en salarisadministratie, de financiële administratie en de grootboekadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '9.2'
    text: |-
      Het eerste lid is alleen van toepassing, indien de daar bedoelde zelfstandige groeperingen ter zake van de aan hun
      leden verrichte diensten slechts terugbetaling vorderen van het aandeel van die leden in de gezamenlijke uitgaven.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel9
  - number: '12.1'
    text: |-
      De aanspraak op toepassing van het tarief van nihil voor leveringen, intracommunautaire verwervingen en invoer
      van goederen en voor diensten, genoemd in de bij de [wet behorende tabel II][ref1], geldt slechts, indien de
      toepasselijkheid van dat tarief uit boeken en bescheiden blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '12.2'
    text: 'Onverminderd het bepaalde in het eerste lid, is het tarief van nihil slechts van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12
  - number: 12.2.a.1°
    text: |-
      voor wat betreft de levering, de intracommunautaire verwerving en de invoer van luchtvaartuigen, alsmede
      de diensten welke ten aanzien van luchtvaartuigen worden verricht, indien de ondernemer kan overleggen een
      schriftelijke verklaring van de afnemer van de luchtvaartuigen, onderscheidenlijk degene aan wie de diensten
      ten aanzien van luchtvaartuigen worden verleend, dat het luchtvaartuigen betreft als bedoeld in de bij de
      [wet behorende tabel II, onderdeel a, post 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 12.2.a.2°
    text: |-
      voor wat betreft de leveringen van goederen als bedoeld in de bij de [wet][ref1] behorende tabel II, onderdeel a,
      post 6, indien de ondernemer: - beschikt over het btw-identificatienummer van degene die de goederen afneemt en
      dit btw-identificatienummer is toegekend door een andere lidstaat dan die waar de verzending of het vervoer van de
      goederen aanvangt;
        - voldoet aan de verplichting om een lijst in te dienen, bedoeld in [artikel 37a van de wet][ref2]; en
        - op die lijst opgave doet van de gegevens, bedoeld in [artikel 37a, tweede lid, van de wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002629
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 37a
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 37a
  - number: 12.2.b.1°
    text: |-
      voor wat betreft de leveringen van accijnsgoederen als bedoeld in de bij de
      [wet behorende tabel II, onderdeel a, post 7, onder a][ref1], indien de ondernemer kan overleggen een schriftelijke
      verklaring van de ondernemer die de accijnsgoederen afneemt dat deze de goederen geleverd krijgt en in opslag
      neemt in een accijnsgoederenplaats als bedoeld in de [Wet op de accijns][ref2] die voor die soort accijnsgoederen
      als zodanig is aangewezen, en dat deze de goederen niet aan dat regime zal onttrekken, anders dan in het kader van
      een levering ter zake waarvan gehele aftrek van belasting op de voet van [artikel 15 van de wet][ref3] door die
      ondernemer mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0005251
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002629
      - id: ref2
        bwb_id: BWBR0005251
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '15'
  - number: 12.2.b.2°
    text: |-
      voor wat betreft de leveringen van minerale oliën als bedoeld in de bij de
      [wet behorende tabel II, onderdeel a, post 7, onder b][ref1], indien de ondernemer een schriftelijke verklaring kan
      overleggen van de afnemer van de minerale oliën dat deze de minerale oliën niet aan de accijnsschorsingsregeling
      zal onttrekken, anders dan in het kader van een levering ter zake waarvan gehele aftrek van belasting op de voet
      van [artikel 15 van de wet][ref2] door die ondernemer mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002629
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '15'
  - number: 12.2.c
    text: |-
      voor wat betreft de leveringen van goederen als bedoeld in de bij de
      [wet behorende tabel II, onderdeel a, post 8, onder a][ref1], indien de ondernemer kan overleggen een schriftelijke
      verklaring van de ondernemer die de goederen afneemt dat deze die goederen opneemt in zijn niet-plaatsgebonden
      entrepot als bedoeld in die post, onder vermelding van het nummer van zijn entrepotvergunning, en dat deze de
      goederen niet aan dat regime zal onttrekken, anders dan in het kader van een levering ter zake waarvan gehele
      aftrek van belasting op de voet van [artikel 15 van de wet][ref2] door die ondernemer mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002629
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '15'
  - number: 12.2.d
    text: |-
      voor wat betreft de achtereenvolgende leveringen die plaatsvinden ingeval door meer dan één persoon overeenkomsten
      worden gesloten met de verplichting tot levering van eenzelfde goed dat vervolgens door de eerste persoon
      rechtstreeks aan de laatste afnemer buiten de Unie of in een douane-entrepot wordt afgeleverd, indien een door
      iedere afnemer - behalve de buitenlandse - aan zijn leverancier uit te reiken schriftelijke opdracht tot uitvoer
      uit de Unie of tot plaatsing onder de regeling douane-entrepot op basis van artikel 237, tweede lid, van het
      Douanewetboek van de Unie kan worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12
  - number: 12.2.e
    text: |-
      voor wat betreft de levering van een motorrijtuig waarvoor ter zake van de in
      [artikel 36 van de Wegenverkeerswet 1994][ref1] bedoelde opgaaf van een kenteken een bewijs is afgegeven en welk
      motorrijtuig door een ondernemer wordt vervoerd naar een andere lidstaat of wordt uitgevoerd uit de Unie, indien
      de ondernemer een afschrift van het ter zake door de Dienst Wegverkeer afgegeven kentekenbewijs deel II, dat hem is
      uitgereikt op de voet van [artikel 17, tweede lid, van het Kentekenreglement][ref2], kan overleggen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel17
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '17'
  - number: 12.2.f
    text: |-
      voor wat betreft de levering door een ondernemer als bedoeld in [artikel 7, zesde lid, van de wet][ref1], van een
      nieuw vervoermiddel dat wordt vervoerd naar een andere lidstaat, indien de ondernemer aan de inspecteur de naam en
      het adres meldt van degene aan wie de levering is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: '12.3'
    text: |-
      In geval een ondernemer die een verklaring als bedoeld in het tweede lid, onderdeel b of c, heeft
      afgegeven, aan de desbetreffende goederen een andere bestemming geeft, wordt de belasting ter zake
      van de aan hem verrichte levering van die goederen alsnog verschuldigd naar het tarief als bedoeld in
      [artikel 9, eerste lid, dan wel tweede lid, onderdeel a, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel9
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '9'
  - number: '12.4'
    text: |-
      In geval het derde lid toepassing vindt met betrekking tot accijnsgoederen als bedoeld in de bij de
      [wet behorende tabel II, onderdeel a, post 7][ref1], wordt de maatstaf van heffing verhoogd met het bedrag van de
      accijns dat voor die goederen ingevolge de [Wet op de accijns][ref2] bij uitslag verschuldigd zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002629
      - id: ref2
        bwb_id: BWBR0005251
  - number: '12.5'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven met betrekking tot de wijze waarop de
      aanspraak op toepassing van het tarief van nihil wordt aangetoond.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12
  - number: 12a.1
    text: |-
      Met betrekking tot de leveringen van minerale oliën als bedoeld in de bij de wet behorende tabel II, onderdeel *a*,
      post 7, onder *a*, die zich bevinden in een accijnsgoederenplaats is [artikel 12, tweede lid, onderdeel ][ref1],
      niet van toepassing indien ter zake van die accijnsgoederenplaats de bijzondere bepaling van tabel II, onderdeel
      *a*, post 7, van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel12
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: '12'
        hoofdstuk: III
  - number: 12a.2
    text: |-
      Met betrekking tot de leveringen bedoeld in het eerste lid is [artikel 12, tweede lid][ref1], slotzin, niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel12
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: '12'
        hoofdstuk: III
  - number: '13'
    text: |-
      Bij ministeriële regeling kunnen aan de teruggaaf op de voet van [artikel 24, eerste lid, van de wet][ref1]
      voorwaarden worden verbonden welke betrekking kunnen hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel24
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '24'
  - number: 13.a
    text: het overleggen van bescheiden bij de aangifte ter verkrijging van de teruggaaf;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel13
  - number: 13.b
    text: |-
      de wijze waarop wordt aangetoond, dat de goederen waarvan de belasting wordt teruggevraagd, de Unie hebben verlaten
      of zijn geplaatst onder de regeling douane-entrepot op basis van artikel 237, tweede lid, van het Douanewetboek van
      de Unie.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel13
  - number: '15.1'
    text: |-
      Zodra de belastingplichtige constateert dat hij een aangifte over een tijdvak in de afgelopen vijf kalenderjaren
      onjuist of onvolledig heeft gedaan waardoor te veel of te weinig belasting is betaald, is hij gehouden alsnog bij
      wijze van suppletie de juiste en volledige inlichtingen, gegevens of aanwijzingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel15
  - number: '15.2'
    text: |-
      De suppletie moet gedaan worden voordat de belastingplichtige weet of redelijkerwijs moet vermoeden dat de
      inspecteur met de desbetreffende onjuistheid of onvolledigheid bekend is of zal worden, maar niet later dan acht
      weken nadat de belastingplichtige de onjuistheid of onvolledigheid heeft geconstateerd.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel15
  - number: '15.3'
    text: De suppletie, bedoeld in het eerste lid, geschiedt op de door de inspecteur aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel15
  - number: 15a.1
    text: |-
      Het niet of niet tijdig doen van de suppletie, bedoeld in [artikel 15, eerste lid][ref1], en het niet doen van de
      suppletie op de op grond van artikel 15, derde lid, aangegeven wijze worden aangemerkt als een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel15
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: '15'
        hoofdstuk: IV
  - number: 15a.2
    text: |-
      De bevoegdheid tot het opleggen van een vergrijpboete voor een overtreding als bedoeld in het eerste lid vervalt
      door verloop van vijf jaren na afloop van het kalenderjaar waarin de belastingschuld is ontstaan of de teruggaaf
      is verleend.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel15a
  - number: '16'
    text: |-
      De ondernemer die krachtens [artikel 26][ref1] van de wet de belasting kan voldoen naar ontvangsten, kan, indien
      hij leveringen verricht zowel van 9%-goederen als van 21%-goederen, die hij niet zelf heeft vervaardigd, de ter
      zake verschuldigde belasting berekenen op een van de hierna omschreven wijzen. I. a. De ondernemer splitst zijn
      inkopen van voor wederverkoop bestemde goederen in 9%-goederen en 21%-goederen; b. hij bepaalt voor alle in
      onderdeel a bedoelde goederen de winkelwaarde, waaronder in deze afdeling wordt verstaan de prijs waarvoor de
      goederen door hem worden verkocht; c. hij berekent de totale winkelwaarde van de in het lopende boekjaar tot en met
      het aan de orde zijnde belastingtijdvak ingekochte goederen naar de in onderdeel a bedoelde splitsing; d. de totale
      ontvangsten in het belastingtijdvak wegens levering van goederen verdeelt hij in ontvangsten voor 9%-goederen
      en ontvangsten voor 21%-goederen naar evenredigheid van de in onderdeel c bedoelde totale winkelwaarden; e. over
      het aldus berekende deel van de ontvangsten dat betrekking heeft op de 9%-goederen, bedraagt de belasting 9/109
      en over het deel dat betrekking heeft op de 21%-goederen, 21/121 gedeelte; f. de som van beide belastingbedragen
      vormt het bedrag dat geacht wordt in het belastingtijdvak aan belasting te zijn verschuldigd; op die som worden
      vervolgens de overige bepalingen van de wet toegepast (aftrek van voorbelasting, enz.); g. na afloop van het
      boekjaar wordt de belasting herrekend als volgt: 1°. de ondernemer bepaalt de winkelwaarde van de ten verkoop
      in voorraad zijnde goederen, gesplitst in 9%-goederen en 21%-goederen; 2°. de onder 1° bedoelde winkelwaarde van
      de 9%-goederen wordt afgetrokken van de winkelwaarde van de in het boekjaar ingekochte 9%-goederen en de aldaar
      bedoelde winkelwaarde van de 21%-goederen wordt afgetrokken van de winkelwaarde van de in het boekjaar ingekochte
      21%-goederen; 3°. de totale ontvangsten in het boekjaar wegens levering van goederen verdeelt de ondernemer over de
      9%- en de 21%-goederen naar evenredigheid van de uit 2° voortvloeiende saldi aan winkelwaarden voor die goederen;
      4°. van het aldus berekende deel van de ontvangsten dat betrekking heeft op de 9%-goederen, wordt 9/109 en over het
      deel dat betrekking heeft op de 21%-goederen, wordt 21/121 gedeelte genomen; 5°. de som van de uitkomsten van de
      berekeningen onder 4° vormt het bedrag dat geacht wordt in het boekjaar aan belasting te zijn verschuldigd; op die
      som worden vervolgens de overige bepalingen van de wet toegepast (aftrek van voorbelasting, enz.); 6°. indien deze
      herrekening leidt tot een hoger bedrag dan over het boekjaar aan belasting is afgedragen, moet het verschil worden
      voldaan op de aangifte over het eerste belastingtijdvak van het volgende boekjaar; leidt de herrekening tot een
      lager bedrag dan over het boekjaar aan belasting is afgedragen, dan wordt het verschil aan de ondernemer op verzoek
      teruggegeven; 7°. op die aangifte voldoet de ondernemer tevens de belasting ter zake van het beschikken over
      goederen in de zin van [artikel 3, derde lid, onderdeel a, van de wet][ref2] (eigen gebruik) in het boekjaar, voor
      zover de vergoeding voor deze goederen niet in de onder 3° bedoelde ontvangsten zijn begrepen; h. de in onderdeel
      g - 1° bedoelde in voorraad zijnde goederen worden beschouwd als goederen die in het eerste belastingtijdvak
      van het volgende boekjaar zijn ingekocht. II. a. De ondernemer houdt afzonderlijk aantekening van zijn inkopen
      van voor wederverkoop bestemde 21%-goederen; b. hij bepaalt voor die goederen de winkelwaarde; c. hij berekent
      de totale winkelwaarde van de in het belastingtijdvak ingekochte 21%-goederen en het verschil tussen de totale
      ontvangsten in dat belastingtijdvak wegens leveringen van goederen en die totale winkelwaarde; d. de belasting
      bedraagt 21/121 gedeelte van de in onderdeel c bedoelde totale winkelwaarde, benevens 9/109 gedeelte van het in
      onderdeel c bedoelde verschil indien de totale ontvangsten de totale winkelwaarde overtreffen; e. de som van beide
      belastingbedragen vormt het bedrag dat geacht wordt in het belastingtijdvak aan belasting te zijn verschuldigd; op
      die som worden vervolgens de overige bepalingen van de wet toegepast (aftrek van voorbelasting, enz.); f. overtreft
      de in onderdeel c bedoelde totale winkelwaarde de aldaar bedoelde totale ontvangsten, dan wordt het verschil
      in mindering gebracht op de totale ontvangsten van het volgende belastingtijdvak; g. ter zake van het eigen
      gebruik vindt, voor zover de belasting wordt voldaan naar de ontvangsten, het bepaalde in I-g-7° overeenkomstige
      toepassing, en kan de ondernemer, voor zover de belasting wordt voldaan naar de winkelwaarde, op de in die bepaling
      bedoelde aangifte in mindering brengen de belasting over het verschil tussen de winkelwaarde en de vergoeding
      voor de goederen voor eigen gebruik, terwijl de in die aangifte te begrijpen ontvangsten met laatstbedoelde
      winkelwaarde worden verhoogd; h. deze regeling is van overeenkomstige toepassing voor 9%-goederen. III. a. De
      ondernemer splitst zijn inkopen van voor wederverkoop bestemde goederen in 9%-goederen en 21%-goederen; b. hij
      bepaalt voor alle in onderdeel a bedoelde goederen de winkelwaarde; c. hij berekent de totale winkelwaarde van de
      in een belastingtijdvak ingekochte goederen naar de in onderdeel a bedoelde splitsing; d. over de aldus berekende
      totale winkelwaarde die betrekking heeft op de 9%-goederen, bedraagt de belasting 9/109 gedeelte en over de aldus
      berekende totale winkelwaarde die betrekking heeft op de 21%-goederen, bedraagt de belasting 21/121 gedeelte; e.
      de som van beide belastingbedragen vormt het bedrag dat geacht wordt in het belastingtijdvak aan belasting te zijn
      verschuldigd; op die som worden vervolgens de overige bepalingen van de wet toegepast (aftrek van voorbelasting,
      enz.); f. na afloop van het boekjaar kan de ondernemer op zijn aangifte over het eerste belastingtijdvak van het
      volgende boekjaar in mindering brengen de belasting over het verschil tussen de winkelwaarde en de vergoeding voor
      de goederen voor eigen gebruik. Algemene aantekeningen 1. Dit artikel is slechts van toepassing, indien en voor
      zover de ondernemer niet op grond van zijn bedrijfsadministratie kan vaststellen welk gedeelte van de ontvangsten
      betrekking heeft op leveringen van 9%-goederen en welk gedeelte op leveringen van 21%-goederen. 2. Dit artikel
      heeft niet betrekking op goederen die worden geleverd ingevolge een overeenkomst van huurkoop of een andere
      overeenkomst van koop en verkoop op afbetaling.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel3
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '3'
  - number: 16a
    text: |-
      Bij een tariefwijziging met ingang van een boekjaar wordt met betrekking tot het daaraan voorafgaande boekjaar
      het in artikel 16 voor methode I in onderdeel *g* bepaalde toegepast met inachtneming van de vóór die wijziging
      geldende tarieven.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel16a
  - number: 16b.1
    text: |-
      Bij een tariefwijziging in de loop van een boekjaar handelt de ondernemer, in afwijking in zoverre van het in
      [artikel 16][ref1] voor methode I in de onderdelen *a* tot en met *h* bepaalde, als is aangegeven in het tweede tot
      en met het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel16
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: '16'
        hoofdstuk: V
        afdeling: A
  - number: 16b.2
    text: |-
      Met betrekking tot een in het boekjaar gelegen belastingtijdvak na het tijdstip van tariefwijziging kan de
      ondernemer voor de toepassing van het voor methode I in de onderdelen *c* en *d* bepaalde:
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel16b
  - number: 16b.2.1°
    text: |-
      de winkelwaarde van de goederen die zijn ingekocht in het lopende boekjaar tot en met het aan de orde zijnde
      belastingtijdvak, berekenen met inachtneming van de op het moment van inkoop geldende tarieven; en
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel16b
  - number: 16b.2.2°
    text: de totale ontvangsten verdelen naar evenredigheid van de aldus bepaalde totale winkelwaarden.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel16b
  - number: 16b.3
    text: |-
      Voor de herrekening van de belasting na afloop van het boekjaar past de ondernemer het voor methode I in onderdeel
      *g*, aanhef en onder 1° tot en met 4°, bepaalde afzonderlijk toe zowel op het gedeelte van het boekjaar vóór de
      tariefwijziging als op het gedeelte daarna met inachtneming van de tarieven die gelden voor het desbetreffende
      gedeelte van het boekjaar.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel16b
  - number: 16b.4
    text: |-
      Bij de in het derde lid bedoelde herrekening kan de ondernemer met betrekking tot het gedeelte van het boekjaar
      vóór de tariefwijziging voor de toepassing van het voor methode I in onderdeel *g*, onder 1°, bepaalde de
      winkelwaarde van de op het tijdstip van tariefwijziging ten verkoop in voorraad zijnde goederen stellen op het
      verschil tussen de totale winkelwaarde van de in dat gedeelte van het boekjaar ingekochte goederen, bepaald met
      inachtneming van en gesplitst naar de vóór die tariefwijziging geldende tarieven, en de naar evenredigheid van deze
      winkelwaarden gesplitste ontvangsten in dat gedeelte van het boekjaar.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel16b
  - number: 16b.5
    text: |-
      Bij de in het derde lid bedoelde herrekening worden met betrekking tot het gedeelte van het boekjaar na de
      tariefwijziging voor de toepassing van het voor methode I in onderdeel *h* bepaalde in samenhang met het bepaalde
      in onderdeel *g*, onder 1°, de op het tijdstip van de tariefwijziging ten verkoop in voorraad zijnde goederen
      beschouwd als goederen die zijn ingekocht in het na dat tijdstip gelegen gedeelte van het boekjaar en wordt de
      winkelwaarde van die goederen bepaald met inachtneming van de na de tariefwijziging geldende tarieven.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel16b
  - number: 16c.1
    text: |-
      Bij een wijziging van de hoogte van het in artikel 16 bij methode II in onderdeel *a* vermelde tarief met ingang
      van een boekjaar of in de loop daarvan wordt, in afwijking in zoverre van het voor die methode in onderdeel *f*
      bepaalde, het op de totale ontvangsten van het volgende belastingtijdvak in mindering te brengen verschil bepaald
      met inachtneming van de tariefwijziging.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel16c
  - number: 16c.2
    text: |-
      In geval van tariefverlaging wordt op de verschuldigde belasting in het in het eerste lid bedoelde belastingtijdvak
      in mindering gebracht een bedrag gelijk aan het bedrag waarmee het voor methode II in onderdeel *f* bedoelde
      verschil berekend zonder de tariefwijziging uitgaat boven dat verschil bepaald met inachtneming van de
      tariefwijziging.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel16c
  - number: 16c.3
    text: |-
      In geval van tariefverhoging wordt in het in het eerste lid bedoelde belastingtijdvak aan belasting verschuldigd
      een bedrag gelijk aan het bedrag waarmee het voor methode II in onderdeel *f* bedoelde verschil bepaald met
      inachtneming van de tariefwijziging uitgaat boven dat verschil berekend zonder de tariefwijziging.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel16c
  - number: 16d
    text: |-
      Bij een wijziging van de hoogte van het in [artikel 16][ref1] bij methode II in onderdeel *h* vermelde tarief
      met ingang van een boekjaar of in de loop daarvan is het bepaalde in [artikel 16c][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002633#Artikel16c
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: '16'
        hoofdstuk: V
        afdeling: A
      - id: ref2
        bwb_id: BWBR0002633
        artikel: 16c
        hoofdstuk: V
        afdeling: A
  - number: '17.1'
    text: |-
      Ingeval de ondernemer goederen levert welke hijzelf heeft vervaardigd, is daarop artikel 16 van overeenkomstige
      toepassing, met inachtneming van het volgende:
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel17
  - number: 17.1.a
    text: |-
      in de plaats van de inkopen van de goederen worden gesteld de inkopen van de grondstoffen welke voor de
      vervaardiging zijn bestemd, gesplitst naar grondstoffen voor 9%-goederen en grondstoffen voor 21%-goederen;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel17
  - number: 17.1.b
    text: |-
      de winkelwaarden van de zelf vervaardigde goederen worden gesteld op de som van de inkoopprijzen van de
      grondstoffen, vermeerderd met een zodanig percentage van die som, dat de prijs waarvoor de zelf vervaardigde
      goederen worden verkocht, zo dicht mogelijk wordt benaderd;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel17
  - number: 17.1.c
    text: |-
      de in onderdeel b bedoelde winkelwaarden worden gevoegd bij de winkelwaarden van de voor wederverkoop ingekochte
      9%-goederen onderscheidenlijk 21%-goederen;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel17
  - number: 17.1.d
    text: |-
      onder de voorraad zelf vervaardigde goederen wordt begrepen de voorraad grondstoffen en wel voor de inkoopprijs
      vermeerderd met het in onderdeel b bedoelde percentage.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel17
  - number: '17.2'
    text: |-
      Bij ministeriële regeling kan het in het eerste lid, onderdeel b, bedoelde percentage voor de verschillende
      goederen of groepen van goederen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel17
  - number: '17.3'
    text: |-
      Voor de ondernemer bij wie toepassing van het bij ministeriële regeling vastgestelde percentage leidt tot een
      winkelwaarde welke in betekenende mate afwijkt van de prijs waarvoor de goederen worden verkocht, kan de inspecteur
      een ander percentage vaststellen.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel17
  - number: '17.4'
    text: |-
      Voor de ondernemer te wiens aanzien bij ministeriële regeling geen percentage is vastgesteld, geschiedt zulks door
      de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel17
  - number: '17.5'
    text: |-
      De vaststelling door de inspecteur van het percentage geschiedt bij voor bezwaar vatbare beschikking. Het
      percentage geldt met ingang van het tijdvak, volgende op dat waarin een afschrift van de beschikking aan de
      ondernemer is verzonden.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel17
  - number: 17a
    text: |-
      Het bepaalde in de [artikelen 16a][ref1], [16b][ref2], [16c][ref3] en [16d][ref4] is van overeenkomstige toepassing
      ten aanzien van een ondernemer als bedoeld in [artikel 17, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0002633#Artikel16b
      [ref3]: https://wetten.overheid.nl/BWBR0002633#Artikel16c
      [ref4]: https://wetten.overheid.nl/BWBR0002633#Artikel16d
      [ref5]: https://wetten.overheid.nl/BWBR0002633#Artikel17
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: 16a
        hoofdstuk: V
        afdeling: A
      - id: ref2
        bwb_id: BWBR0002633
        artikel: 16b
        hoofdstuk: V
        afdeling: A
      - id: ref3
        bwb_id: BWBR0002633
        artikel: 16c
        hoofdstuk: V
        afdeling: A
      - id: ref4
        bwb_id: BWBR0002633
        artikel: 16d
        hoofdstuk: V
        afdeling: A
      - id: ref5
        bwb_id: BWBR0002633
        artikel: '17'
        hoofdstuk: V
        afdeling: A
  - number: '18.1'
    text: |-
      Grondstoffen en voor verkoop bestemde goederen, die aanwezig zijn bij de aanvang van het eerste belastingtijdvak
      waarover een in deze afdeling opgenomen regeling wordt toegepast, worden beschouwd als in dat tijdvak te
      zijn ingekocht. Voor zelf vervaardigde goederen treden hierbij in de plaats de grondstoffen waaruit zij zijn
      vervaardigd.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het eerste lid vindt bij de in [artikel 16][ref1] omschreven methode II geen toepassing ten aanzien van 9%-goederen
      en voor de vervaardiging daarvan bestemde grondstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel16
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: '16'
        hoofdstuk: V
        afdeling: A
  - number: '18.3'
    text: |-
      Indien blijkt, dat de voorraad aan goederen als bedoeld in het tweede lid, op enig tijdstip groter is dan bij de
      aanvang van het eerste belastingtijdvak waarover de in [artikel 16][ref1] omschreven methode II is toegepast, kan
      de inspecteur bij voor bezwaar vatbare beschikking bepalen, dat de inkopen van die goederen in een door hem aan te
      wijzen belastingtijdvak met het verschil in de voorraad worden verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel16
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: '16'
        hoofdstuk: V
        afdeling: A
  - number: '19'
    text: |-
      Een in deze afdeling opgenomen regeling mag slechts worden toegepast met ingang van het boekjaar, volgende op
      dat waarin de ondernemer van zijn voornemen daartoe schriftelijk mededeling aan de inspecteur heeft gedaan. Zij
      vindt dan toepassing tot het boekjaar, volgende op dat waarin de ondernemer aan de inspecteur schriftelijk heeft
      medegedeeld, dat hij haar niet langer wenst toe te passen.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel19
  - number: '20.1'
    text: |-
      In gevallen waarin bij de levering van goederen of het verrichten van diensten gratis zegels worden verstrekt die
      kunnen worden ingewisseld tegen geld wordt, in afwijking in zoverre van [artikel 29, eerste lid][ref1], van de wet,
      de belasting berekend overeenkomstig de hierna volgende regels:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel29
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '29'
  - number: 20.1.a
    text: op de totale vergoeding of ontvangsten wordt niets in aftrek gebracht voor de verstrekte zegels;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel20
  - number: 20.1.b
    text: 'op de door een ondernemer in een tijdvak verschuldigde belasting brengt deze in mindering:'
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel20
  - number: 20.1.b.1°
    text: |-
      ingeval de geldswaarde van de zegels pas te zijnen laste komt bij inwisseling van de zegels: de belasting over het
      bedrag van de in dat tijdvak bij hem ingewisselde zegels;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel20
  - number: 20.1.b.2°
    text: |-
      ingeval de geldswaarde van de zegels reeds te zijnen laste komt vóór de verstrekking van de zegels: de belasting
      over het bedrag van de in dat tijdvak door hem verstrekte zegels.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel20
  - number: '20.2'
    text: Onder zegels worden begrepen andere voorwerpen welke een soortgelijke functie vervullen.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel20
  - number: '21.1'
    text: |-
      In gevallen waarin de ondernemer aan zijn afnemers bij de levering van goederen of diensten – al dan niet tegen
      betaling – waardebonnen verstrekt die afzonderlijk of tezamen met andere waardebonnen bij hem of bij een andere
      ondernemer alleen met bijbetaling kunnen worden ingewisseld tegen goederen of diensten, wordt de belasting berekend
      met inachtneming van de volgende regels:
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel21
  - number: 21.1.a
    text: |-
      voor de vergoeding of ontvangsten voor de goederen of diensten waarbij de waardebonnen zijn verstrekt, blijft de
      verstrekking van de waardebonnen buiten beschouwing;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel21
  - number: 21.1.b
    text: |-
      ter zake van de levering van goederen of diensten tegen inwisseling van de waardebonnen bestaat de vergoeding uit
      hetgeen is bijbetaald voor deze goederen of diensten, de belasting niet daaronder begrepen, vermeerderd met hetgeen
      is betaald voor de waardebonnen, de belasting niet daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel21
  - number: '21.2'
    text: |-
      Ter zake van waardebonnen die de ondernemer aan zijn afnemers bij de levering van goederen of diensten – al dan
      niet tegen betaling – verstrekt die afzonderlijk of tezamen met andere waardebonnen bij hem of bij een andere
      ondernemer, hetzij alleen met verplichte bijbetaling kunnen worden ingewisseld tegen goederen of diensten, hetzij
      zonder bijbetaling kunnen worden ingewisseld tegen bepaalde andere goederen of diensten, is het eerste lid van
      overeenkomstige toepassing voor zover deze waardebonnen met verplichte bijbetaling worden ingewisseld tegen
      goederen of diensten.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel21
  - number: 24a.1
    text: |-
      Van niet in het vrije verkeer zijnde goederen waarmee in Nederland een vervoermiddel wordt bevoorraad,
      moet degene voor wie de goederen zijn bestemd, niet zijnde een ondernemer of lichaam in de zin van de
      [Algemene wet inzake rijksbelastingen][ref1], aangifte doen. Op de aangifte en de goederen zijn de wettelijke
      bepalingen, bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref2], van toepassing als
      ware sprake van een aangifte voor het vrije verkeer en van voor de douaneregeling vrij verkeer aangegeven goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 24a.2
    text: |-
      De in het eerste lid bedoelde goederen worden slechts vrijgegeven als bedoeld in artikel 194, eerste lid, van
      het Douanewetboek van de Unie indien wordt aangetoond dat de in het eerste lid van dit artikel bedoelde aangifte
      is gedaan.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24a
  - number: 24b.1
    text: 'Dit artikel verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
  - number: 24b.1.a
    text: |-
      werknemer, dienstbetrekking en inhoudingsplichtige: hetgeen daaronder wordt verstaan voor de toepassing van de
      [Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 24b.1.b
    text: |-
      aannemer: degene, die zich jegens een ander, de opdrachtgever, verbindt om buiten dienstbetrekking tegen een te
      betalen prijs een werk van stoffelijke aard uit te voeren dat betrekking heeft op onroerende zaken of schepen als
      bedoeld in Bijlage I, deel II, hoofdstuk 89, van Verordening (EEG) nr. 2658/87 van de Raad van 23 juli 1987 met
      betrekking tot de tarief- en statistieknomenclatuur en het gemeenschappelijk douanetarief (PbEG 1987, L 256),
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
  - number: 24b.1.c
    text: |-
      onderaannemer: degene, die zich jegens een aannemer verbindt om buiten dienstbetrekking tegen een te betalen prijs
      het in onderdeel *b* bedoelde werk geheel of gedeeltelijk uit te voeren.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
  - number: 24b.2
    text: |-
      Voor de toepassing van dit artikel wordt de onderaannemer ten opzichte van zijn onderaannemer als aannemer
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
  - number: 24b.3
    text: |-
      Voor de toepassing van dit artikel wordt met een aannemer gelijkgesteld degene, die zonder daartoe van een
      opdrachtgever opdracht te hebben gekregen buiten dienstbetrekking in de normale uitoefening van zijn bedrijf een in
      het eerste lid, onderdeel *b*, bedoeld werk uitvoert.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
  - number: 24b.4
    text: |-
      Voor de toepassing van dit artikel wordt ten opzichte van de aannemer als onderaannemer beschouwd de verkoper
      van een toekomstige zaak, indien en voor zover de koop en verkoop voortvloeit uit of verband houdt met het in het
      eerste lid, onderdeel *b*, bedoelde werk.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
  - number: 24b.5
    text: |-
      Als gevallen als zijn bedoeld in [artikel 12, vijfde lid, van de wet][ref1] worden aangewezen de gevallen waarin:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
  - number: 24b.5.a
    text: een onderaannemer een in het eerste lid, onderdeel *b*, bedoeld werk geheel of gedeeltelijk uitvoert;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
  - number: 24b.5.b
    text: |-
      een werknemer met instandhouding van de dienstbetrekking tot zijn inhoudingsplichtige ter beschikking is gesteld
      van een derde om werkzaam te zijn bij de uitvoering van een in het eerste lid, onderdeel *b*, bedoeld werk.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
  - number: 24b.6
    text: 'Indien het vijfde lid van toepassing is, dient op de uit te reiken factuur te worden vermeld: btw verlegd.'
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
  - number: 24b.7
    text: 'De voorgaande leden zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
  - number: 24b.7.1°
    text: |-
      indien een werk dat betrekking heeft op onroerende zaken of schepen als bedoeld in het eerste lid, onderdeel *b*,
      tot de uitvoering waarvan een onderaannemer zich jegens een aannemer heeft verbonden, geheel of grotendeels wordt
      verricht op de plaats, waar de onderneming van de onderaannemer is gevestigd, of
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
  - number: 24b.7.2°
    text: |-
      indien de uitvoering van een werk waartoe een onderaannemer zich jegens de aannemer heeft verbonden ondergeschikt
      is aan een tussen hen gesloten overeenkomst van koop en verkoop van een bestaande zaak.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
  - number: 24b.8
    text: Bij ministeriële regeling kunnen nadere regels worden gegeven inzake de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24b
  - number: 24ba.1
    text: |-
      Als gevallen als bedoeld in [artikel 12, vijfde lid, van de wet][ref1], worden mede aangewezen de gevallen waarin:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
  - number: 24ba.1.a
    text: |-
      een onroerende zaak of een recht waaraan deze is onderworpen, wordt geleverd met toepassing van
      [artikel 11, eerste lid, onderdeel a, 2°, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 24ba.1.b
    text: goud of een halffabrikaat met een zuiverheid van ten minste 325/1000 wordt geleverd aan een ondernemer;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
  - number: 24ba.1.c
    text: |-
      beleggingsgoud wordt geleverd met toepassing van het in [artikel 28l van de wet][ref1] opgenomen keuzerecht;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28l
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28l
  - number: 24ba.1.d
    text: |-
      een in zekerheid gegeven roerende of onroerende zaak dan wel een recht waaraan een onroerende zaak is onderworpen,
      wordt geleverd aan een ondernemer tot executie van die zekerheid;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
  - number: 24ba.1.e
    text: |-
      een onroerende zaak of een recht waaraan deze is onderworpen, wordt geleverd aan een ondernemer op grond van een
      executoriale titel door de executieschuldenaar;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
  - number: 24ba.1.f
    text: |-
      een overdracht aan een ondernemer plaatsvindt van broeikasgasemissierechten, als omschreven in artikel 3 van
      [Richtlijn 2003/87/EG](32003L0087) van het Europees Parlement en de Raad van 13 oktober 2003 tot vaststelling van
      en regeling voor de handel in broeikasgasemissierechten binnen de Gemeenschap en tot wijziging van Richtlijn 96/61/
      EG van de Raad (PbEU 2003, L 275), die overdraagbaar zijn overeenkomstig artikel 12 van die richtlijn alsmede
      de overdracht aan een ondernemer van andere eenheden die door exploitanten kunnen worden gebruikt om aan de
      betreffende richtlijn te voldoen;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
  - number: 24ba.1.g
    text: |-
      een van de volgende goederensoorten wordt geleverd aan een ondernemer voor een totaalbedrag van € 10 000 of meer
      per levering per soort goed, de omzetbelasting niet daaronder begrepen:
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
  - number: 24ba.1.g.1°
    text: |-
      mobiele telefoons, zoals toestellen die zijn vervaardigd of aangepast voor gebruik in een netwerk waarvoor een
      vergunning is afgegeven en die op gespecificeerde frequenties werken, ongeacht of zij nog een ander gebruik hebben;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
  - number: 24ba.1.g.2°
    text: |-
      geïntegreerde schakelingen, zoals microprocessoren en centrale verwerkingseenheden, voordat deze in een eindproduct
      zijn ingebouwd;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
  - number: 24ba.1.g.3°
    text: |-
      spelcomputers, zoals computers waarvan de objectieve kenmerken en voornaamste functies van dien aard zijn dat
      zij bedoeld zijn voor het spelen van videogames of andere computerspellen, ongeacht of zij nog een ander gebruik
      hebben;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
  - number: 24ba.1.g.4°
    text: tablet pc’s;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
  - number: 24ba.1.g.5°
    text: laptops;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
  - number: 24ba.1.h
    text: |-
      een telecommunicatiedienst wordt verricht als bedoeld in [artikel 2a, eerste lid, onderdeel r, van de wet][ref1],
      voor zover de dienst plaatsvindt in Nederland tussen ondernemers die deze diensten verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 2a
  - number: 24ba.1.i
    text: levering van gas- en elektriciteitscertificaten aan een ondernemer.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
  - number: 24ba.2
    text: |-
      [Artikel 24b, zesde en achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel24b
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24ba
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: 24b
        hoofdstuk: V
        afdeling: E
  - number: 24bb.1
    text: |-
      Als gevallen als bedoeld in [artikel 12, vijfde lid, van de wet][ref1], worden tevens aangewezen de gevallen waarin
      sprake is van de levering aan een ondernemer van oude materialen, oude materialen ongeschikt voor hergebruik in
      dezelfde staat, industrieel en niet-industrieel afval, afval voor hergebruik, gedeeltelijk verwerkt afval, schroot,
      en van bepaalde goederen en diensten, voorzover het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24bb
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
  - number: 24bb.1.a
    text: |-
      de levering van resten en afval van ferro- en non-ferroproducten en oude materialen, halffabrikaten daaronder
      begrepen, die het resultaat zijn van het verwerken, vervaardigen of smelten van ferro- en non-ferrometalen of
      legeringen daarvan;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24bb
  - number: 24bb.1.b
    text: de levering van ferro- en non-ferrohalffabrikaten en daarmee samenhangende verwerkingsdiensten;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24bb
  - number: 24bb.1.c
    text: |-
      de levering van residuen en andere materialen voor hergebruik bestaande uit ferro- en non-ferrometalen, legeringen
      daarvan, slakken, assen, bladders en industriële residuen die metalen of legeringen daarvan bevatten, alsmede de
      diensten bestaande in het scheiden, snijden, fragmenteren en samenpersen van deze producten;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24bb
  - number: 24bb.1.d
    text: |-
      de levering van en verwerkingsdiensten met betrekking tot afval van ferro- en non-ferroproducten alsmede snippers,
      schroot, resten en afval, en oud materiaal en materiaal voor hergebruik bestaande uit glasscherven en glas, papier
      en karton, lompen, beenderen, leder, kunstleder, perkament, huiden en vellen, pezen en zenen, bindgaren, touw en
      kabel, rubber en kunststof;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24bb
  - number: 24bb.1.e
    text: |-
      de levering van de in dit lid genoemde materialen na bewerking in de vorm van reinigen, polijsten, scheiden,
      snijden, fragmenteren, samenpersen of gieten tot ingots;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24bb
  - number: 24bb.1.f
    text: de levering van resten en afval dat ontstaat bij de bewerking van grondstoffen.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24bb
  - number: 24bb.2
    text: |-
      [Artikel 24b, zesde en achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel24b
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24bb
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: 24b
        hoofdstuk: V
        afdeling: E
  - number: 24bb.3
    text: |-
      Dit artikel is niet van toepassing bij levering van de in het eerste lid genoemde goederen door een wederverkoper
      met toepassing van [artikel 28b van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24bb
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
  - number: 24c.1
    text: 'Het verzoek om een vergunning voor een fiscaal vertegenwoordiger dient de volgende gegevens te bevatten:'
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.1.a
    text: naam, adres en woonplaats van de verzoeker;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.1.b
    text: het beoogde tijdstip van aanvang van het fiscaal vertegenwoordigerschap;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.1.c
    text: de vermoedelijke aard en omvang van de belastbare handelingen per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.2
    text: |-
      Het verzoek om een algemene vergunning voor een fiscaal vertegenwoordiger dient voorts de volgende gegevens te
      bevatten:
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.2.a
    text: |-
      naam, adres en woonplaats van de ondernemer die niet in Nederland woont of is gevestigd en aldaar geen vaste
      inrichting heeft (in dit hoofdstuk: buitenlandse ondernemer) alsmede, indien de ondernemer is gevestigd in een
      lidstaat het btw-identificatienummer dat is toegekend door die lidstaat;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.2.b
    text: de aard van het bedrijf van de buitenlandse ondernemer.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.3
    text: |-
      Tenzij de inspecteur anders bepaalt wordt een vergunning voor een fiscaal vertegenwoordiger slechts verleend indien
      de verzoeker:
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.3.a
    text: in Nederland woont of is gevestigd;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.3.b
    text: |-
      in de afgelopen vijf jaren niet wegens overtreding van de wettelijke bepalingen inzake rijksbelastingen dan wel
      douane onherroepelijk is veroordeeld;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.3.c
    text: een administratie voert die voldoet aan bij ministeriële regeling te stellen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.3.d
    text: |-
      onder de in het zevende lid genoemde voorwaarden zekerheid stelt tot het beloop van een door de inspecteur
      vastgesteld bedrag;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.3.e
    text: |-
      op verzoek aan de inspecteur de inlichtingen verstrekt die noodzakelijk zijn om het beloop van de zekerheid vast
      te stellen.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.4
    text: |-
      De verlening van een algemene vergunning voor een fiscaal vertegenwoordiger is tevens gebonden aan de volgende
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.4.a
    text: |-
      de verzoeker treedt op namens de buitenlandse ondernemer voor alle leveringen en diensten waarvoor belasting
      is verschuldigd en de intracommunautaire verwervingen en invoer behoudens in de gevallen dat een fiscaal
      vertegenwoordiger met een beperkte vergunning is aangesteld;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.4.b
    text: |-
      de verzoeker is per kalenderjaar mede aansprakelijk voor de verschuldigde belasting en de daarmee samenhangende
      verschuldigde renten en bestuurlijke boeten tot een maximum van de gestelde zekerheid.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.5
    text: |-
      De verlening van een beperkte vergunning voor een fiscaal vertegenwoordiger is tevens gebonden aan de volgende
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.5.a
    text: |-
      de verzoeker kan namens de buitenlandse ondernemer waarvoor hij als fiscaal vertegenwoordiger met een beperkte
      vergunning is aangesteld, optreden voor:
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.5.a.1°
    text: de invoer van goederen;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.5.a.2°
    text: |-
      de op de invoer volgende levering van goederen andere dan bedoeld in
      [artikel 5a, eerste lid, onderdeel a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
  - number: 24c.5.a.3°
    text: |-
      de levering van goederen met toepassing van het tarief van nihil op de voet van tabel II, onderdeel *a*, post 7 of
      8, van de [wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 24c.5.a.4°
    text: de intracommunautaire verwerving van goederen die voorafgaat aan een levering als bedoeld onder 3°;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.5.a.5°
    text: |-
      de levering van goederen met toepassing van het tarief van nihil op de voet van tabel II, onderdeel *a*, post 2 of
      6, van de [wet][ref1] die volgt op een levering als bedoeld [onder 3°][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0002633#Artikel24c
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002629
      - id: ref2
        bwb_id: BWBR0002633
        artikel: 24c
        hoofdstuk: V
        afdeling: F
  - number: 24c.5.a.6°
    text: |-
      de levering bedoeld in de bij de [wet][ref1] behorende tabel II, onderdeel *a*, post 7, Bijzondere bepaling, dan
      wel post 8, Bijzondere bepaling, voor de buitenlandse ondernemer indien de levering aan hem is verricht, alsmede
      voor de door die ondernemer te verrichten volgende levering.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 24c.5.b
    text: |-
      de verzoeker is mede aansprakelijk voor de belasting die is verschuldigd ter zake van de in onderdeel *a* genoemde
      belastbare handelingen en de daarmee samenhangende verschuldigde renten en bestuurlijke boeten.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.6
    text: |-
      De aansprakelijkstelling op grond van het vierde en het vijfde lid vindt plaats met toepassing van
      [hoofdstuk VI, afdeling 2, van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0004770
        afdeling: '2'
  - number: 24c.7
    text: |-
      Het bedrag van de zekerheid wordt door de inspecteur zodanig vastgesteld dat de te verhalen bedragen voldoende
      verzekerd kunnen worden geacht. De ontvanger beslist of de door de verzoeker aangeboden vorm van zekerheid wordt
      aanvaard. Het bedrag van de zekerheid kan door de inspecteur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.8
    text: 'De inspecteur kan de vergunning intrekken of wijzigen:'
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.8.a
    text: op verzoek van de fiscaal vertegenwoordiger met schriftelijke instemming van de buitenlandse ondernemer;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.8.b
    text: op verzoek van de buitenlandse ondernemer;
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24c.8.c
    text: indien de fiscaal vertegenwoordiger niet meer voldoet aan de aan de vergunning gebonden voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24c
  - number: 24d.1
    text: |-
      De buitenlandse ondernemer die in Nederland belasting verschuldigd is ingevolge
      [artikel 5a, eerste lid, onderdeel a, van de wet][ref1], stelt een fiscaal vertegenwoordiger met een algemene
      vergunning aan wanneer het hoofdkantoor of de vestiging van de ondernemer is gelegen in een derde-land waarmee geen
      rechtsinstrument inzake wederzijdse bijstand bestaat als bedoeld in artikel 204, lid 1, tweede alinea, van de BTW-
      richtlijn 2006. De verplichting bedoeld in de eerste volzin geldt niet wanneer een ondernemer gebruik maakt van de
      Unieregeling, bedoeld in [hoofdstuk V, afdeling 7, paragraaf 3, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0002629
        paragraaf: '3'
  - number: 24d.2
    text: |-
      De buitenlandse ondernemer is gehouden een fiscaal vertegenwoordiger aan te stellen voor de levering die aan hem
      wordt verricht en waarvoor van hem de belasting wordt geheven ingevolge de bij de [wet][ref1] behorende tabel II,
      onderdeel a, post 7, Bijzondere bepaling, dan wel post 8, Bijzondere bepaling. De eerste volzin is eveneens van
      toepassing op de door de buitenlandse ondernemer verrichte levering die volgt op de aldaar bedoelde levering.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel24d
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '25'
    text: |-
      De Dienst Wegverkeer, genoemd in artikel 4a van de Wegenverkeerswet 1994, wordt aangewezen als nationale
      autoriteit als bedoeld in artikel 5 ter, vierde lid, van [Uitvoeringsverordening (EU) nr. 79/2012](32012R0079)
      van de Commissie van 31 januari 2012 tot vaststelling van nadere uitvoeringsvoorschriften voor enkele bepalingen
      van [Verordening (EU) nr. 904/2010](32010R0904) van de Raad betreffende de administratieve samenwerking en de
      bestrijding van fraude op het gebied van de belasting over de toegevoegde waarde (PbEU 2012, L 29) voor het
      verwerken van inkomende en uitgaande verzoeken om voertuigregistratiegegevens voor btw-doeleinden.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel25
  - number: '26.1'
    text: Dit besluit treedt in werking met ingang van 1 januari 1969.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel26
  - number: '26.2'
    text: Dit besluit kan worden aangehaald als Uitvoeringsbesluit omzetbelasting 1968.
    url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#Artikel26
