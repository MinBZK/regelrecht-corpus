    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Financiën van 19 juli 1968, nr. D68/4876, directie Wetgeving Douane
    en Verbruiksbelastingen;

    Gelet op de artikel 8, zesde lid, 9, tweede lid, letter b, 10, 11, eerste lid, aanhef en letters f, o, 2°, en u,
    12, derde lid, 20, tweede lid, letter b, 29, derde lid, 39, 41b, eerste lid, 50, achtste en elfde lid, alsmede 50a,
    vierde lid, van de Wet op de omzetbelasting 1968 (Stb. 329);

    De Raad van State gehoord (advies van 31 juli 1968, nr. 45);

    Gezien het nader rapport van de Staatssecretaris van Financiën van 7 augustus 1968, nr. D68/4944, directie
    Wetgeving Douane en Verbruiksbelastingen;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002633/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Dit besluit geeft uitvoering aan de [artikelen 8, vijfde lid][ref1], [9, tweede lid, onderdeel b][ref2],
      [11, eerste lid, aanhef en onderdelen f, g, onder 3°, o, onder 2°, en u, en negende lid][ref3],
      [12, vijfde lid][ref4], [17c, tweede lid][ref5], [17d][ref6],
      [20, tweede lid, onderdeel b][ref7], [29, negende lid][ref8], [29a, tweede lid][ref9],
      [33g, tweede, vierde en zesde lid][ref10], en [39 van de Wet op de omzetbelasting 1968][ref11] en aan
      [artikel 10a van de Algemene wet inzake rijksbelastingen][ref12].


