  - number: 3.1.g
    text: |-
      indien de eigenaar of onder diens verantwoordelijkheid werkzame personen het bepaalde bij of krachtens de
      [Destructiewet][ref1] niet naleven: 35% per gebeurtenis;


      [ref1]: https://wetten.overheid.nl/BWBR0002244
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002244
  - number: 3.1.h
    text: |-
      indien de eigenaar of onder diens verantwoordelijkheid werkzame personen door een bedrijfslichaam vastgestelde
      regels niet naleven die betrekking hebben op de preventieve gezondheidszorg bij het houden van dieren van de soort
      waarop de maatregel is toegepast: 35% per gebeurtenis;
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
  - number: 3.1.i
    text: |-
      indien de eigenaar of onder diens verantwoordelijkheid werkzame personen het bepaalde bij of krachtens de
      [artikelen 4][ref1] of [96 van de wet][ref2] niet naleven, voorzover de bepaling betrekking heeft op de diersoort
      waarop de maatregel is toegepast: 15% bij één, twee, drie of vier gebeurtenissen of 35% bij vijf of meer
      gebeurtenissen;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel96
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '96'
  - number: 3.1.j
    text: |-
      in afwijking van onderdeel f, indien de eigenaar of onder diens verantwoordelijkheid werkzame personen het bepaalde
      in de Regeling inzake hygiënevoorschriften besmettelijke dierziekten 2000 niet naleven, 15% bij één, twee, drie of
      vier gebeurtenissen of 35% bij vijf of meer gebeurtenissen.
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
  - number: '3.2'
    text: De verlaging wordt niet toegepast op de tegemoetkoming voorzover deze betrekking heeft op producten en voorwerpen.
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
  - number: '3.3'
    text: |-
      Indien een tegemoetkoming die betrekking heeft op verschillende diersoorten wordt verlaagd op grond van het eerste
      lid, onderdelen f, g, h, i, onderscheidenlijk j, waarbij het verzuim geen betrekking heeft op alle diersoorten
      waarop de tegemoetkoming betrekking heeft, wordt de verlaging slechts toegepast op het deel van de tegemoetkoming
      voor de diersoort of diersoorten waarop het verzuim betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
  - number: '3.4'
    text: |-
      Indien een tegemoetkoming meer dan één keer wordt verlaagd wegens een van de gronden, bedoeld in het eerste lid,
      worden de verlagingen bij elkaar opgeteld tot een maximum van 100% van de tegemoetkoming per diersoort.
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
  - number: '3.5'
    text: 'Een verlaging van de tegemoetkoming vindt niet plaats, indien:'
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
  - number: 3.5.a
    text: |-
      de verlaging zou moeten worden opgelegd wegens een verzuim dat zich heeft voorgedaan langer dan zeventien
      weken voor de bekendmaking van het besluit tot het nemen van de maatregel op grond waarvan het recht op een
      tegemoetkoming bestaat, en
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
  - number: 3.5.b
    text: |-
      in een aaneengesloten periode van zeventien weken nadat het verzuim zich heeft voorgedaan in Nederland geen dieren
      zijn gedood of raten zijn vernietigd ter uitvoering van een maatregel ter bestrijding van dezelfde dierziekte als
      waarop de maatregel, bedoeld in onderdeel a, betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
  - number: '4.2'
    text: |-
      Dit besluit is slechts van toepassing op een besluit tot vaststelling van een tegemoetkoming wegens een maatregel
      die is getroffen na de inwerkingtreding van dit besluit.
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel4
  - number: '4.3'
    text: |-
      Op een besluit tot vaststelling van een tegemoetkoming wegens een maatregel, die is getroffen voor de
      inwerkingtreding van dit besluit, blijven de artikelen, genoemd in het eerste lid, van toepassing.
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel4
  - number: '5'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit verlaging tegemoetkoming aangewezen dierziekten.'
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel6
