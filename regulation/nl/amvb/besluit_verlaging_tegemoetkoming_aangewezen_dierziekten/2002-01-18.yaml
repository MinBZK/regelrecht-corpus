    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Minister van Landbouw, Natuurbeheer en Visserij van 29 mei 2000, No. TRCJZ/2000/7243,
    Directie Juridische Zaken;


    Gelet op artikel 86, tweede lid, van de Gezondheids- en welzijnswet voor dieren;


    De Raad van State gehoord (advies van 21 juli 2000, no. W11.00.0223/V);


    Gezien het nader rapport van de Minister van Landbouw, Natuurbeheer en Visserij van 4 oktober 2000, No.
    TRCJZ/2000/10817, Directie Juridische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: [Gezondheids- en welzijnswet voor dieren][ref1];

      b. aangewezen dierziekte: krachtens [artikel 15, eerste lid, van de wet][ref2] aangewezen besmettelijke dierziekte;

      c. maatregel: maatregel als bedoeld in [artikel 22 van de wet][ref3];

      d. tegemoetkoming: tegemoetkoming als bedoeld in [artikel 86, eerste lid, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005662
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel22
