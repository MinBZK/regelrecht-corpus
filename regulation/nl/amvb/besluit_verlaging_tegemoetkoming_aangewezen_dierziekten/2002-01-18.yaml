  - number: '2'
    text: |-
      Het in [artikel 86, tweede lid, onderdeel b, van de wet][ref1] bedoelde gedeelte van de waarde van de dieren in
      gezonde toestand bedraagt 50%.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel86
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel2
