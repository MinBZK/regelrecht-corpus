preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Minister van Landbouw, Natuurbeheer en Visserij van 29 mei 2000, No. TRCJZ/2000/7243,
    Directie Juridische Zaken;

    Gelet op artikel 86, tweede lid, van de Gezondheids- en welzijnswet voor dieren;

    De Raad van State gehoord (advies van 21 juli 2000, no. W11.00.0223/V);

    Gezien het nader rapport van de Minister van Landbouw, Natuurbeheer en Visserij van 4 oktober 2000, No.
    TRCJZ/2000/10817, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel1
  - number: 1.a
    text: |-
      wet: [Gezondheids- en welzijnswet voor dieren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: 1.b
    text: |-
      aangewezen dierziekte: krachtens [artikel 15, eerste lid, van de wet][ref1] aangewezen besmettelijke dierziekte;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '15'
  - number: 1.c
    text: |-
      maatregel: maatregel als bedoeld in [artikel 22 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
  - number: 1.d
    text: |-
      tegemoetkoming: tegemoetkoming als bedoeld in [artikel 86, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel86
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '86'
  - number: '2'
    text: |-
      Het in [artikel 86, tweede lid, onderdeel b, van de wet][ref1] bedoelde gedeelte van de waarde van de dieren in
      gezonde toestand bedraagt 50%.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel86
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '86'
  - number: '3.1'
    text: |-
      De in [artikel 86, tweede lid, van de wet][ref1] bedoelde percentages tot verlaging van de tegemoetkoming bedragen:


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel86
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '86'
  - number: 3.1.a
    text: |-
      indien de eigenaar of onder diens verantwoordelijkheid werkzame personen de [artikelen 19][ref1], [25][ref2],
      [29][ref3], [101][ref4] of [104 van de wet][ref5] niet naleven: 100%;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0005662#Artikel101
      [ref5]: https://wetten.overheid.nl/BWBR0005662#Artikel104
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0005662
        artikel: '101'
      - id: ref5
        bwb_id: BWBR0005662
        artikel: '104'
  - number: 3.1.b
    text: |-
      indien de eigenaar of onder diens verantwoordelijkheid werkzame personen handelingen verrichten, waarmee het effect
      van een maatregel ongedaan wordt gemaakt: 100%;
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
  - number: 3.1.c
    text: |-
      indien de eigenaar of onder diens verantwoordelijkheid werkzame personen op de eerste vordering van een ambtenaar
      als bedoeld in [artikel 114, eerste of tweede lid, van de wet][ref1] niet kan aantonen van welke bedrijven de op
      het bedrijf aanwezige dieren afkomstig zijn, en niet kan aantonen dat de op het bedrijf aanwezige dieren langer dan
      zeventien weken voorafgaand aan de vordering ononderbroken op het bedrijf aanwezig zijn: 100%;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: 3.1.d
    text: |-
      indien de eigenaar niet aantoont dat hij heeft voldaan aan een op grond van een wettelijk voorschrift voor diens
      dieren geldende plicht tot vaccinatie tegen de aangewezen dierziekte waarmee de dieren zijn aangetast of waarvan de
      dieren worden verdacht: 100%;
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
  - number: 3.1.e
    text: |-
      indien de eigenaar of onder diens verantwoordelijkheid werkzame personen een verplichting
      als bedoeld in [artikel 5:20 van de Algemene wet bestuursrecht][ref1] of als bedoeld in
      [artikel 115, eerste lid, van de wet][ref2] niet nakomen: 100%;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel115
    url: https://wetten.overheid.nl/BWBR0011707/2002-01-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '115'
  - number: 3.1.f
    text: |-
      indien de eigenaar of onder diens verantwoordelijkheid werkzame personen het bepaalde bij of krachtens
      de [artikelen 10a][ref1], [35][ref2], [36][ref3] of [38, eerste of derde lid, van de Veewet][ref4] of de
      [artikelen 3][ref5], [6][ref6], [8][ref7], [9][ref8], [10][ref9], [11][ref10], [17][ref11], [18][ref12],
      [20,][ref13][26, eerste lid][ref14], [30][ref15] of [97 van de wet][ref16] niet naleven, voorzover de bepaling
      betrekking heeft op de dierziekte in verband waarmee de maatregel is toegepast of op de diersoort waarop de
      maatregel is toegepast: 35% per gebeurtenis;


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0001900#Artikel36
