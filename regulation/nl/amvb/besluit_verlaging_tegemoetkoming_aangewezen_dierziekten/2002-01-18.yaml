        artikel: '86'
  - number: '3'
    text: |-
      1 De in [artikel 86, tweede lid, van de wet][ref1] bedoelde percentages tot verlaging van de tegemoetkoming
      bedragen:

      a. indien de eigenaar of onder diens verantwoordelijkheid werkzame personen de [artikelen 19][ref2], [25][ref3],
      [29][ref4], [101][ref5] of [104 van de wet][ref6] niet naleven: 100%;

      b. indien de eigenaar of onder diens verantwoordelijkheid werkzame personen handelingen verrichten, waarmee het
      effect van een maatregel ongedaan wordt gemaakt: 100%;

      c. indien de eigenaar of onder diens verantwoordelijkheid werkzame personen op de eerste vordering van een
      ambtenaar als bedoeld in [artikel 114, eerste of tweede lid, van de wet][ref7] niet kan aantonen van welke
      bedrijven de op het bedrijf aanwezige dieren afkomstig zijn, en niet kan aantonen dat de op het bedrijf aanwezige
      dieren langer dan zeventien weken voorafgaand aan de vordering ononderbroken op het bedrijf aanwezig zijn: 100%;

      d. indien de eigenaar niet aantoont dat hij heeft voldaan aan een op grond van een wettelijk voorschrift voor diens
      dieren geldende plicht tot vaccinatie tegen de aangewezen dierziekte waarmee de dieren zijn aangetast of waarvan de
      dieren worden verdacht: 100%;

      e. indien de eigenaar of onder diens verantwoordelijkheid werkzame personen een verplichting
      als bedoeld in [artikel 5:20 van de Algemene wet bestuursrecht][ref8] of als bedoeld in
      [artikel 115, eerste lid, van de wet][ref9] niet nakomen: 100%;

      f. indien de eigenaar of onder diens verantwoordelijkheid werkzame personen het bepaalde bij of krachtens
      de [artikelen 10a][ref10], [35][ref11], [36][ref12] of [38, eerste of derde lid, van de Veewet][ref13] of de
      [artikelen 3][ref14], [6][ref15], [8][ref16], [9][ref17], [10][ref18], [11][ref19], [17][ref20], [18][ref21],
      [20,][ref22][26, eerste lid][ref23], [30][ref24] of [97 van de wet][ref25] niet naleven, voorzover de bepaling
      betrekking heeft op de dierziekte in verband waarmee de maatregel is toegepast of op de diersoort waarop de
      maatregel is toegepast: 35% per gebeurtenis;

      g. indien de eigenaar of onder diens verantwoordelijkheid werkzame personen het bepaalde bij of krachtens de
      [Destructiewet][ref26] niet naleven: 35% per gebeurtenis;

      h. indien de eigenaar of onder diens verantwoordelijkheid werkzame personen door een bedrijfslichaam vastgestelde
      regels niet naleven die betrekking hebben op de preventieve gezondheidszorg bij het houden van dieren van de soort
      waarop de maatregel is toegepast: 35% per gebeurtenis;

      i. indien de eigenaar of onder diens verantwoordelijkheid werkzame personen het bepaalde bij of krachtens
      de [artikelen 4][ref27] of [96 van de wet][ref28] niet naleven, voorzover de bepaling betrekking heeft op de
      diersoort waarop de maatregel is toegepast: 15% bij één, twee, drie of vier gebeurtenissen of 35% bij vijf of meer
      gebeurtenissen;

      j. in afwijking van onderdeel f, indien de eigenaar of onder diens verantwoordelijkheid werkzame personen het
      bepaalde in de Regeling inzake hygiënevoorschriften besmettelijke dierziekten 2000 niet naleven, 15% bij één, twee,
      drie of vier gebeurtenissen of 35% bij vijf of meer gebeurtenissen.

      2 De verlaging wordt niet toegepast op de tegemoetkoming voorzover deze betrekking heeft op producten en
      voorwerpen.

      3 Indien een tegemoetkoming die betrekking heeft op verschillende diersoorten wordt verlaagd op grond van
      het eerste lid, onderdelen f, g, h, i, onderscheidenlijk j, waarbij het verzuim geen betrekking heeft op alle
      diersoorten waarop de tegemoetkoming betrekking heeft, wordt de verlaging slechts toegepast op het deel van de
      tegemoetkoming voor de diersoort of diersoorten waarop het verzuim betrekking heeft.

      4 Indien een tegemoetkoming meer dan één keer wordt verlaagd wegens een van de gronden, bedoeld in het eerste lid,
      worden de verlagingen bij elkaar opgeteld tot een maximum van 100% van de tegemoetkoming per diersoort.

      5 Een verlaging van de tegemoetkoming vindt niet plaats, indien:

      a. de verlaging zou moeten worden opgelegd wegens een verzuim dat zich heeft voorgedaan langer dan zeventien
      weken voor de bekendmaking van het besluit tot het nemen van de maatregel op grond waarvan het recht op een
      tegemoetkoming bestaat, en

      b. in een aaneengesloten periode van zeventien weken nadat het verzuim zich heeft voorgedaan in Nederland
      geen dieren zijn gedood of raten zijn vernietigd ter uitvoering van een maatregel ter bestrijding van dezelfde
      dierziekte als waarop de maatregel, bedoeld in onderdeel a, betrekking heeft.


