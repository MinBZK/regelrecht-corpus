  - number: '25'
    text: |-
      Het budgethoudende bestuursorgaan geeft ten aanzien van het bouwen van of het treffen van ingrijpende voorzieningen
      aan woningen geen toepassing aan [artikel 22][ref1], indien:

      a. die woningen niet geschikt of bestemd zijn om voortdurend door dezelfde persoon of personen te worden bewoond of

      b. die woningen bestemd zijn voor of in gebruik zijn als ambts- of dienstwoning.


      [ref1]: https://wetten.overheid.nl/BWBR0006950#Artikel22
