      1 Onze Minister kan van dit besluit afwijken of afwijking daarvan toestaan ten behoeve van experimenten die naar
      zijn oordeel in het belang van de volkshuisvesting zijn.

      2 Onze Minister kan bepalen dat een afwijking als bedoeld in het eerste lid van kracht blijft in gevallen dat het
      experiment is afgesloten, hij dat experiment als zodanig geslaagd beschouwt dat dit naar zijn oordeel tot wijziging
      van dit besluit zou moeten leiden, en die wijziging nog niet van kracht is geworden en in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0006950/2002-03-21#Artikel35
  - number: '36'
    text: |-
      Op de uitbetaling van op voet van het Besluit woninggebonden subsidies verleende geldelijke steun blijft dat
      besluit van toepassing, met dien verstande dat:

      a. voor de toepassing van bijlage III, punt 3, [onderdelen a][ref1], [c][ref2] en [e][ref3], van dat besluit,
      als luidende op 31 december 1994, het percentage, bedoeld in genoemd [onderdeel a][ref4], gelijk staat aan het
      percentage dat, met gebruikmaking van de in dat onderdeel opgenomen berekeningswijze daarvan, blijkt uit het
      verslag dat ingevolge dat besluit is of wordt uitgebracht over het jaar waarvoor het budget voor de sociale-
      bouwsector in de zin van dat besluit, waarop die bijlage wordt toegepast, is toegekend;

      b. in afwijking van bijlage VI, punt 6, [onderdeel b][ref5], van dat besluit, als luidende op 31 december
      1994, elk inkomen dat op het tijdstip van toepassing van [artikel 37, eerste lid][ref6], van dat besluit,
      als luidende op die datum, in aanmerking wordt genomen voor het bepalen van de som, bedoeld in de aanhef
      van punt 5 van die bijlage, als luidende op die datum, gelijk is aan het verzamelinkomen, bedoeld in
      [artikel 2.18 van de Wet inkomstenbelasting 2001][ref7], bij de vermindering van welk inkomen in punt 6,
      onderdeel b, onder 1e, van die bijlage, als luidende op die datum, voor «huurwaarde, bedoeld in artikel
      42a, eerste lid, van de Wet op de inkomstenbelasting 1964, met dien verstande dat bij de toepassing van
      laatstgenoemd artikel voor de bepaling van de waarde in het economische verkeer het bedrag van de kosten
      van het verkrijgen in eigendom van de woning wordt aangehouden» wordt gelezen« eigenwoningwaarde, bedoeld in
      [artikel 3.112, tweede lid, van de Wet inkomstenbelasting 2001][ref8], als berekend volgens die wet», en

      c. in de laatste twee volzinnen van de in [onderdeel b][ref9] genoemde bijlage voor «zuiver loon» wordt gelezen:
      belastbaar loon.


