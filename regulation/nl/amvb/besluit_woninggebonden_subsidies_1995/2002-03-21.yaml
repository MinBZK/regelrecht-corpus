  - number: '37'
    text: |-
      1 Het budgethoudende bestuursorgaan voegt aan het laatstelijk op voet van dit besluit toegekende budget ter
      uitvoering van het programma toe elk bedrag dat beschikbaar komt als gevolg van:

      a. een intrekking van een besluit, genomen krachtens artikel 24, eerste of derde lid, 28, 32, eerste lid, 38, 42,
      eerste lid, 45, eerste of tweede lid, 48, eerste of tweede lid, of 49 van het Besluit woninggebonden subsidies, die
      plaatsvindt voor de melding van de voltooiing van de woning, standplaats of woonwagen, of van de voorziening aan
      de woning of standplaats, en de vaststelling van het bedrag aan geldelijke steun die voor die woning, standplaats,
      woonwagen of voorziening aan die woning of standplaats is verleend, of

      b. een verlaging van de hoofdsom krachtens artikel 37, vierde lid, van het Besluit woninggebonden subsidies, die
      volgt op het voor de eerste maal toepassing geven aan artikel 37, eerste lid, van dat besluit, zonder dat aan die
      toepassing een verzoek als bedoeld in artikel 37, tweede lid, van dat besluit is voorafgegaan.

      2 Toevoegingen als bedoeld in het eerste lid geschieden door het budgethoudende bestuursorgaan dat toepassing geeft
      aan [artikel 22][ref1].

      3 Op de besteding van de in het eerste lid bedoelde bedragen is dit besluit van overeenkomstige toepassing.


