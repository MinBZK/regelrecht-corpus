  - number: '27'
    text: |-
      1 Bij toepassing van [artikel 22][ref1] ten aanzien van het treffen van ingrijpende voorzieningen aan een woning
      gelden de verplichtingen dat:

      a. de kosten van de voorzieningen meer bedragen dan € 22 689,01 en

      b. de warmteweerstand van de gevel en het dak na het treffen van de voorzieningen gelijk is aan of hoger is dan
      1,3 m2kW.

      2 Ingeval de toepassing, bedoeld in het eerste lid, betrekking heeft op een aantal administratief in een plan
      voor het treffen van ingrijpende voorzieningen samengevoegde woningen, en aan die woningen voorzieningen worden
      getroffen die in financieel opzicht met elkaar vergelijkbaar zijn, wordt aan het eerste lid, onderdeel *a*,
      voldaan, indien de gemiddelde kosten van de voorzieningen aan de in dat plan opgenomen woningen meer bedragen dan
      € 22 689,01.

      3 Het budgethoudende bestuursorgaan kan slechts afwijken van het eerste lid, aanhef en onderdeel *b*, indien:

      a. de gevel niet geschikt is voor het daaraan aanbrengen van spouwmuurisolatie;

      b. het dak niet geschikt is voor het aanbrengen van isolatie tussen de dakbedekking en het dakbeschot of

      c. de betrokken woning een beschermd monument is in de zin van [artikel 3 van de Monumentenwet 1988][ref2] of
      als beschermd monument is aangewezen in een provinciale of gemeentelijke verordening, door het treffen van de
      voorzieningen onder naleving van dat onderdeel dat monument zou worden gewijzigd en om die reden daarvoor geen
      vergunning als bedoeld in [artikel 11 van die wet][ref3] zou worden verleend.

      4 Indien het treffen van de voorzieningen leidt tot bouwkundige splitsing van een woning of samenvoeging van
      woningen, wordt voor de toepassing van het eerste lid, onderdeel *a*, het aantal in het plan opgenomen woningen
      gesteld op het geprojecteerde aantal woningen na die splitsing of samenvoeging.


