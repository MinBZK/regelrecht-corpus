  - number: '21'
    text: |-
      1 Onze Minister betaalt een budget dat is toegekend op voet van dit besluit, zoals het luidde op 31 december 1999
      uit in twee jaarbedragen, die elk gelijk zijn aan de helft van dat budget.

      2 De jaarbedragen worden uitbetaald in het tweede en derde kalenderjaar na het kalenderjaar waarvoor het programma
      gold ter uitvoering waarvan het betrokken budget is toegekend.

      3 Onze Minister houdt bij de toepassing van het eerste en tweede lid op een door hem te bepalen wijze rekening
      met de bedragen die als gevolg van een onherroepelijk geworden besluit tot gehele of gedeeltelijke intrekking als
      bedoeld in [artikel 29, zesde lid][ref1], [30][ref2] of [31][ref3] kunnen worden teruggevorderd.

      4 Onze Minister kan van het eerste en tweede lid afwijken, indien de mate van beschikbaarheid van kasmiddelen daar
      naar zijn oordeel aanleiding toe geeft. Indien hij besluit bij die afwijking een betaling uit te stellen, deelt hij
      het voornemen daartoe onverwijld aan de betrokken budgethoudende bestuursorganen mee. Hij geeft daarbij aan op welk
      tijdstip hij voornemens is de met het uitstel gemoeide bedragen alsnog te betalen. Het uitstel gaat niet eerder in
      dan acht weken nadat de in de tweede volzin bedoelde mededeling is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006950#Artikel29
