articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. programma: programma als bedoeld in [artikel 64, tweede lid, onderdeel ][ref1], zoals dat onderdeel luidde op 31
      december 1999;

      b. sociale verhuurder: toegelaten instelling als bedoeld in [artikel 70 van de Woningwet][ref2], of afzonderlijk
      organisatie-onderdeel van de gemeente dat is belast met de exploitatie van van gemeentewege gebouwde of verworven
      woongelegenheden;.

      c. voorziening: bouwkundige maatregel aan een woning, die strekt tot verbetering van de indeling of het woongerief,
      waaronder begrepen de daartoe noodzakelijke opheffing van technische gebreken, of die strekt tot bouwkundige
      splitsing van een woning of samenvoeging van woningen;

      d. regionaal openbaar lichaam: regionaal openbaar lichaam als bedoeld in de [Kaderwet bestuur in verandering][ref3];

      e. budgethoudende bestuursorgaan: bestuursorgaan dat ten laste van op voet van dit besluit toegekende budgetten
      subsidie kan verstrekken, en dat is:

      1°. het algemeen bestuur van een regionaal openbaar lichaam;

      2°. het algemeen bestuur van een ander openbaar lichaam als bedoeld in
      [artikel 8 van de Wet gemeenschappelijke regelingen][ref4], waarin gemeenten samenwerken die gezamenlijk volgens de
      bevolkingscijfers van het Centraal Bureau voor de Statistiek op 1 januari 1991 ten minste 30 000 inwoners hadden,
      voor zover provinciale staten onder toepassing van [artikel 81, vierde lid, van de Woningwet][ref5], zoals dat
      artikellid luidde op 31 december 1999, taken of bevoegdheden hebben gedelegeerd aan gemeenten en die gemeenten
      die taken en bevoegdheden in dat openbaar lichaam hebben ingebracht, welk openbaar lichaam hierna wordt genoemd
      "budgetbeherend samenwerkingsverband";

      3°. de raad van een gemeente die geen deel uitmaakt van een regionaal openbaar lichaam of budgetbeherend
      samenwerkingsverband en op 1 januari 1990 ten minste 30 000 inwoners had volgens de bevolkingscijfers van het
      Centraal Bureau voor de Statistiek, welke gemeente hierna wordt genoemd "budgetbeherende gemeente" of

      4°. de staten van een provincie, voor zover zij niet tot delegatie als bedoeld [onder 2°][ref6] zijn overgegaan,
      of het de verstrekking van financiële middelen betreft aan gemeenten, niet zijnde gemeenten als bedoeld
      [onder 3°][ref7], die uit een budgetbeherend samenwerkingsverband zijn getreden, welke provincie hierna in zoverre
      wordt genoemd "budgetbeherende provincie";

      f. ontvanger: betrokken regionaal openbaar lichaam, budgetbeherend samenwerkingsverband, budgetbeherende gemeente
      of budgetbeherende provincie.

      g.

      h. ingrijpende voorzieningen aan woningen:

      1°. bouwkundige splitsingen van verhuurde of te verhuren woningen en

      2°. andere te treffen ingrijpende voorzieningen aan verhuurde of te verhuren woningen waarvan de bouw voor 1
      januari 1946 is voltooid.

      2 In dit besluit en de daarop berustende bepalingen wordt onder eigendom mede verstaan: recht van opstal, recht van
      erfpacht, appartementsrecht of lidmaatschap van een coöperatie, indien op grond van dat lidmaatschap het recht op
      het uitsluitende gebruik bestaat van een aan die coöperatie in bloot eigendom toebehorende woning.

      3 Dit besluit is, behoudens voor zover krachtens [artikel 33][ref8] anders is bepaald, niet van toepassing op
      verzorgingshuizen als bedoeld in [artikel 1, eerste lid, onderdeel b, van de Overgangswet verzorgingshuizen][ref9].


