      1 De raad van elke gemeente die met ingang van 1 januari 1995, of met ingang van enig later tijdstip, deel uitmaakt
      van een regionaal openbaar lichaam of budgetbeherend samenwerkingsverband, en voordien budgetbeherende gemeente
      was, draagt het bedrag dat op dat tijdstip resteert van de aan die gemeente toegekende budgetten over aan dat
      openbaar lichaam of samenwerkingsverband. De raad van de betrokken gemeente voert dat bedrag, onder de betrokken
      posten "Restant budget", op in het verslag, bedoeld in [artikel 28, eerste lid][ref1].

      2 Het algemeen bestuur van het betrokken regionaal openbaar lichaam of budgetbeherende samenwerkingsverband voert
      het in het eerste lid bedoelde bedrag, onder de post "Restant budgetten vorige jaren", op in het betrokken verslag,
      bedoeld in [artikel 28, eerste lid][ref2], van dit besluit.


