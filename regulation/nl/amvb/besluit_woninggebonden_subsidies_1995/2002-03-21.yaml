  - number: '26'
    text: |-
      1 Het budgethoudende bestuursorgaan geeft ten aanzien van het bouwen van een standplaats geen toepassing
      aan [artikel 22][ref1], indien door het bouwen van die standplaats in de onmiddellijke nabijheid van andere
      standplaatsen het aantal bijeengelegen standplaatsen meer dan 15 zou komen te bedragen.

      2 Het budgethoudende bestuursorgaan kan afwijken van het eerste lid. Het afwijken van het eerste lid behoeft de
      toestemming van gedeputeerde staten. De[ artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref2]
      zijn van overeenkomstige toepassing. Gedeputeerde staten stellen een door de provincie ingestelde commissie op het
      gebied van de volkshuisvesting, waarvan een inspecteur deel uitmaakt, in de gelegenheid haar zienswijze omtrent de
      voorgenomen afwijking aan hen kenbaar te maken.

      3 Gedeputeerde staten kunnen slechts toestemming verlenen aan het budgethoudende bestuursorgaan om van het eerste
      lid af te wijken, indien:

      a. de bouw van de standplaats samen met de bouw van andere standplaatsen in de onmiddellijke nabijheid
      daarvan strekt tot vervanging van standplaatsen die zijn gelegen op een regionaal centrum als bedoeld
      in de [bijlage](onbekend), behorende bij de [artikelen 2, derde lid][ref3], [5][ref4], [26][ref5] en
      [82 van de Huisvestingswet][ref6], en het budgethoudende bestuursorgaan een termijn heeft gesteld waarbinnen dat
      centrum moet zijn opgeheven of verkleind, en

      b. het budgethoudende bestuursorgaan ten genoegen van gedeputeerde staten aannemelijk heeft gemaakt dat er, gelet
      op de ter plaatse geldende voorschriften inzake de ruimtelijke ordening, geen andere mogelijkheden zijn voor het
      bouwen van standplaatsen, of naar het oordeel van gedeputeerde staten het belang van de huisvesting van de bewoners
      van het betrokken centrum, bedoeld in onderdeel *a* , dan wel de maatschappelijke samenhang binnen die groep
      bewoners, die afwijking noodzakelijk maakt.

      4 Gedeputeerde staten delen een toestemming als bedoeld in het tweede lid mee aan Onze Minister.


