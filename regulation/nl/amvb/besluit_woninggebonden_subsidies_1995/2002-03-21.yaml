    text: |-
      Onze Minister kan aan provinciale staten een aanwijzing geven met het oog op de delegatie, bedoeld in
      [artikel 1, eerste lid, onderdeel e, onder 2°][ref1]. Alvorens hij een aanwijzing geeft, voert hij overleg met de
      betrokken provincie. Hij stelt in de aanwijzing een termijn waarbinnen daaraan gevolg moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006950#Artikel1
