  - number: '24'
    text: |-
      1 Het budgethoudende bestuursorgaan brengt een verordening in het belang van de volkshuisvesting tot stand, die in
      elk geval omvat:

      a. de doeleinden waarvoor dat bestuursorgaan subsidie kan verstrekken;

      b. degenen aan wie dat bestuursorgaan subsidie kan verstrekken;

      c. regels inzake de wijze van aanvragen van door dat bestuursorgaan te verstrekken subsidie;

      d. de bij de aanvraag over te leggen gegevens en bescheiden;

      e. de termijnen voor de beslissing omtrent de aanvraag;

      f. de gronden om subsidie niet te verstrekken, genoemd in de[artikelen 25][ref1] en [26][ref2];

      g. de overige gronden om subsidie niet te verstrekken;

      h. de verplichting die geldt ingevolge [artikel 27][ref3];

      i. de overige verplichtingen die gelden bij het verstrekken van subsidie;

      j. regels inzake de totstandkoming van het bedrag van de subsidie;

      k. de wijze waarop het budgethoudende bestuursorgaan de kosten vaststelt van het bouwen van woningen, standplaatsen
      en woonwagens en van het treffen van ingrijpende voorzieningen aan woningen, die voor subsidie in aanmerking komen;

      l. de termijnen voor de indiening van de gegevens en bescheiden in verband met de financiële en administratieve
      afwikkeling van de activiteiten waarvoor subsidie is verstrekt;

      m. de termijnen voor de beslissing omtrent de subsidievaststelling en

      n. de wijze en het tijdstip of de tijdstippen van uitbetalen van de subsidie.

      2 Uit de verordening, bedoeld in het eerste lid, blijkt dat de bepalingen die ingevolge [de onderdelen a][ref4]
      en [f][ref5] tot en met [k][ref6] van dat lid daarin worden opgenomen, van overeenkomstige toepassing zijn op
      besluiten als bedoeld in [artikel 22, tweede lid][ref7].

      3 Het budgethoudende bestuursorgaan neemt in de verordening, bedoeld in het eerste lid, voorts bepalingen op
      waaruit blijkt op welke wijze het uitvoering geeft aan [artikel 23][ref8]. Dat bestuursorgaan geeft daarbij in
      elk geval het verband aan tussen de criteria, genoemd in [artikel 23, onderdelen a tot en met e][ref9], en de
      bepalingen die ingevolge het eerste lid, onderdelen *a*, *b* en *f* tot en met *j* in die verordening worden
      opgenomen.

      4 Het hoogste bedrag voor de koopsom van een woning, of voor de koopsom van bouwrijpe grond vermeerderd met de
      aanneemsom van een woning, voor het verkrijgen in eigendom van welke woning het budgethoudende bestuursorgaan aan
      degene die een zodanige woning als eigenaar zal bewonen, subsidie kan verstrekken waarvan de hoogte afhankelijk is
      van het inkomen van die eigenaar, is € 91.800 . Dat bedrag kan bij ministeriële regeling worden gewijzigd, indien
      daartoe aanleiding bestaat wegens wijziging van de prijzen in verband met het bouwen van woningen.

      5 Indien het budgethoudende bestuursorgaan in de verordening, bedoeld in het eerste lid, bepaalt dat subsidie als
      bedoeld in de eerste volzin van het vierde lid kan worden verstrekt, maakt het in die volzin genoemde bedrag deel
      uit van de regels die het inzake de verstrekking van zodanige subsidie stelt.


