        hoofdstuk: I
  - number: '19'
    text: |-
      Ten aanzien van de toegekende budgetten gelden uitsluitend de voorwaarden dat:

      a. het budgethoudende bestuursorgaan Onze Minister op zijn eerste verzoek van alle door hem verlangde bescheiden
      inzage verleent en alle door hem verlangde inlichtingen verstrekt welke naar zijn redelijk oordeel noodzakelijk
      zijn voor een juist toezicht op de naleving van de gestelde voorwaarden;

      b. het budgethoudende bestuursorgaan elk bedrag dat beschikbaar komt als gevolg van een intrekking vóór 1 januari
      2005 van een beschikking tot subsidieverlening of subsidievaststelling ten laste van een budget, aan dat budget
      toevoegt;

      c. het budgethoudende bestuursorgaan [afdeling 2][ref1] van dit hoofdstuk naleeft, en

      d. het budgethoudende bestuursorgaan op zodanige wijze ten laste van de toegekende budgetten subsidie verstrekt
      voor het bouwen van woningen, standplaatsen of woonwagens, of voor het treffen van ingrijpende voorzieningen aan
      woningen, dan wel het algemeen bestuur van een regionaal openbaar lichaam of budgetbeherend samenwerkingsverband
      of de raad van een budgetbeherende gemeente op zodanige wijze ten laste van die budgetten besluit tot een van die
      activiteiten, dat op 1 januari 2005 daarvoor geen budget meer beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0006950#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006950/2002-03-21#Artikel19
