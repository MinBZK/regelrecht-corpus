  - number: '31'
    text: |-
      1 Onze Minister kan een besluit tot toekenning van een budget voorts geheel of gedeeltelijk intrekken, indien:

      a. de gegevens op grond waarvan dat budget is toegekend zodanig onjuist blijken te zijn dat, waren de juiste
      gegevens bekend geweest, een andere beslissing zou zijn genomen;

      b. de omstandigheden sedert het tijdstip waarop dat budget is toegekend zodanig zijn gewijzigd, dat:

      1°. het budgethoudende bestuursorgaan redelijkerwijs niet of niet tijdig in staat is ten laste van dat budget of
      een belangrijk deel daarvan op zodanige wijze subsidie te verstrekken voor het bouwen van woningen, standplaatsen
      of woonwagens of het treffen van ingrijpende voorzieningen aan woningen, dat wordt voldaan aan de voorwaarden,
      gesteld bij of krachtens dit besluit, of

      2°. het algemeen bestuur van een regionaal openbaar lichaam of budgetbeherend samenwerkingsverband of de raad
      van een budgetbeherende gemeente redelijkerwijs niet of niet tijdig in staat is ten laste van dat budget of een
      belangrijk deel daarvan op zodanige wijze te besluiten tot een van de activiteiten, genoemd onder 1°, dat wordt
      voldaan aan de voorwaarden, gesteld bij of krachtens dit besluit, of

      c. niet binnen de krachtens [artikel 2, derde volzin][ref1], gestelde termijn gevolg is gegeven aan een aanwijzing
      als bedoeld in de[ eerste volzin van dat artikel][ref2].

      2 [Artikel 30, tweede lid][ref3], is van overeenkomstige toepassing.


