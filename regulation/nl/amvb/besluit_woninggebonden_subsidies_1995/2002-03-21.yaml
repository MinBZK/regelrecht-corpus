    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 31 maart
    1994, nr. MJZ31394008, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op de artikelen 67, 70, 78, 81, 82, 84 en 88 van de Woningwet en artikel 18 van de Financiële-Verhoudingswet
    1984;

