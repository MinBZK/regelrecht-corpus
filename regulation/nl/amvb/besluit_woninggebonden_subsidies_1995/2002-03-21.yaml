  - number: '34'
    text: |-
      1 De vrijdom van legesheffing, van de kosten van legalisatie en van griffiekosten ten aanzien van stukken
      als bedoeld in [artikel 88 van de Woningwet][ref1], is van toepassing op door sociale verhuurders te verhuren
      woningen waarvan de geraamde kosten van het verkrijgen in eigendom niet hoger zijn dan € 91.800, woonwagens
      en standplaatsen, ten aanzien waarvan toepassing wordt gegeven aan [artikel 22][ref2], alsmede op woningen,
      beheerd door een sociale verhuurder, waaraan voorzieningen worden getroffen waarvan de kosten meer bedragen dan
      € 22 689,01. Het in de eerste volzin eerstgenoemde bedrag kan bij ministeriële regeling worden gewijzigd, indien
      daartoe aanleiding bestaat wegens wijziging van de prijzen in verband met het bouwen van woningen.

      2 Het eerste lid is niet van toepassing op een heffing die strekt tot gehele of gedeeltelijke vergoeding
      van financiële risico's, verband houdende met de besteding van budgetten op voet van dit besluit of met
      subsidieverstrekking op voet van [artikel 75][ref3] of [80 van de Woningwet][ref4].

      3 Een heffing als bedoeld in het tweede lid is niet toegestaan, indien deze ertoe leidt dat een toegelaten
      instelling als bedoeld in [artikel 70 van de Woningwet][ref5] geen vrije keuze kan maken uit de haar aangeboden
      leningen of garanties.


