  - number: '30'
    text: |-
      1 Onze Minister kan, uiterlijk zes maanden na de ontvangst van de volledige in [artikel 28][ref1] bedoelde
      bescheiden, een besluit tot toekenning van een budget geheel of gedeeltelijk intrekken, voor zover naar zijn
      oordeel:

      a. niet is voldaan aan de bij of krachtens dit besluit gestelde voorwaarden, met uitzondering van de voorwaarde,
      genoemd in [artikel 23][ref2];

      b. het verslag, bedoeld in [artikel 28, eerste lid][ref3], met uitzondering van de uiteenzettingen, bedoeld in
      [artikel 28, tweede lid][ref4], daartoe aanleiding geeft, of

      c. de verklaring, bedoeld in [artikel 28, derde lid][ref5], voor zover deze betrekking heeft op de getrouwheid
      van dat verslag en de naleving van de bij of krachtens dit besluit gestelde voorwaarden, met uitzondering van de
      voorwaarde, genoemd in [artikel 23][ref6], daartoe aanleiding geeft.

      2 Indien Onze Minister uitvoering geeft aan het eerste lid, stelt hij de hoogte van het in te trekken bedrag vast
      en geeft hij daarbij aan op welk besluit de intrekking betrekking heeft.


