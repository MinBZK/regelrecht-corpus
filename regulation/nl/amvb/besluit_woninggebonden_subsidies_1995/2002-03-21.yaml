  - number: '22'
    text: |-
      1 Het budgethoudende bestuursorgaan kan ten laste van de toegekende budgetten subsidie verstrekken voor uitsluitend
      het bouwen van woningen, standplaatsen of woonwagens of het treffen van ingrijpende voorzieningen aan woningen.

      2 Het algemeen bestuur van een regionaal openbaar lichaam of budgetbeherend samenwerkingsverband en de raad van een
      budgetbeherende gemeente kunnen voorts ten laste van de toegekende budgetten besluiten tot uitsluitend een of meer
      van de in het eerste lid genoemde activiteiten.
    url: https://wetten.overheid.nl/BWBR0006950/2002-03-21#Artikel22
  - number: '23'
    text: |-
      Het budgethoudende bestuursorgaan geeft toepassing aan [artikel 22][ref1] op een zodanige wijze, dat:

      a. daardoor zo veel mogelijk wordt voldaan aan de behoefte aan woningen op het grondgebied van de ontvanger;

      b. daardoor de bouwtechnische kwaliteit van de huurwoningen binnen dat grondgebied op een zo hoog mogelijk peil
      wordt gebracht en gehouden;

      c. daarbij rekening wordt gehouden met de financiële draagkracht van de binnen dat grondgebied werkzame sociale
      verhuurders;

      d. daarmee zo veel mogelijk wordt voldaan aan bij ministeriële regeling gestelde regels inzake de naar financiële
      draagkracht van de bewoners evenwichtige verdeling van de huurwoningen en

      e. daarmee wordt bevorderd dat de woningvoorraad in elke wijk en buurt binnen dat grondgebied naar prijsklasse zo
      gedifferentieerd mogelijk van samenstelling is.


      [ref1]: https://wetten.overheid.nl/BWBR0006950#Artikel22
    url: https://wetten.overheid.nl/BWBR0006950/2002-03-21#Artikel23
