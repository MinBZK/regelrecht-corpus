  - number: '29'
    text: |-
      1 Onze Minister bevestigt binnen vier weken de ontvangst van de in [artikel 28][ref1] bedoelde bescheiden. Hij
      zendt een afschrift van die bescheiden aan de betrokken gedeputeerde staten.

      2 Indien een of meer van de in [artikel 28][ref2] bedoelde bescheiden niet of naar het oordeel van Onze Minister
      onvolledig zijn verstrekt, doet hij daarvan mededeling aan het budgethoudende bestuursorgaan binnen acht weken
      na het verstrijken van de in [artikel 28, eerste lid, onderdeel a of b][ref3], bedoelde dag onderscheidenlijk na
      ontvangst van die bescheiden.

      3 Onze Minister stelt bij de in het tweede lid bedoelde mededeling een termijn van ten hoogste acht weken
      waarbinnen de ontbrekende bescheiden alsnog moeten worden verstrekt.

      4 Indien het budgethoudende bestuursorgaan de ontbrekende bescheiden niet binnen de krachtens het derde lid
      gestelde termijn verstrekt, kan Onze Minister de in [artikel 21][ref4] bedoelde uitbetaling opschorten.

      5 De opschorting wordt opgeheven op het tijdstip waarop naar het oordeel van Onze Minister blijkt dat de
      ontbrekende bescheiden alsnog zijn verstrekt. Het door de opschorting niet uitbetaalde bedrag wordt terstond na de
      opheffing van de opschorting uitbetaald, of zo spoedig als daarvoor kasmiddelen beschikbaar zijn, doch uiterlijk
      zes maanden na die opheffing.

      6 Indien het budgethoudende bestuursorgaan een jaar na de in [artikel 28, eerste lid, onderdeel a of b][ref5],
      bedoelde dag de ontbrekende bescheiden niet heeft verstrekt, kan Onze Minister het besluit tot toekenning van het
      betrokken budget geheel of gedeeltelijk intrekken. Indien hij daartoe overgaat, stelt hij de hoogte van het in te
      trekken bedrag vast.


