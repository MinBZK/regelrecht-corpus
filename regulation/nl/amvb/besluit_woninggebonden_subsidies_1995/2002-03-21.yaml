  - number: '28'
    text: |-
      1 Het budgethoudende bestuursorgaan doet aan Onze Minister toekomen, op een formulier volgens het model in
      [bijlage I][ref1] bij dit besluit met bijbehorende toelichting:

      a. voor 15 september 2001: een verslag met betrekking tot de toepassing van [artikel 22][ref2] in het jaar 2000, en

      b. voor 15 september 2005: een verslag met betrekking tot de toepassing van [artikel 22][ref3] in de jaren 2001 tot
      en met 2004.

      2 Het budgethoudende bestuursorgaan neemt in het verslag, bedoeld in het eerste lid, op:

      a. een uiteenzetting waarin het aangeeft op welke wijze de ontvanger bij de besteding van de toegekende budgetten
      toepassing heeft gegeven aan de criteria, genoemd in [artikel 23, onderdelen a tot en met e][ref4], en waarin het
      aannemelijk maakt dat de ontvanger daarmee [artikel 23][ref5] heeft nageleefd, en

      b. een uiteenzetting over het beleid dat het heeft gevoerd ten aanzien van het tegengaan van misbruik en
      oneigenlijk gebruik van ingevolge dit besluit verstrekte subsidie.

      3 Het verslag, bedoeld in het eerste lid, gaat vergezeld van een verklaring omtrent de getrouwheid van dat
      verslag en omtrent de naleving van de voorwaarden, welke verklaring is afgegeven door een accountant als bedoeld
      in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref6]. De verklaring wordt opgesteld met
      inachtneming van [bijlage II][ref7] bij dit besluit en gaat vergezeld van het rapport van bevindingen, bedoeld in
      punt 3 van het onderdeel, getiteld «Richtlijnen», van die bijlage.


