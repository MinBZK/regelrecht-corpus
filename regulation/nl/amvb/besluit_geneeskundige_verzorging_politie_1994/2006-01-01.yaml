  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 7 februari 1994, directoraat-generaal voor Openbare
    Orde en Veiligheid, directie Politie, hoofdafdeling Personeel, Onderwijs en Informatievoorziening, afdeling
    Arbeidsvoorwaardenbeleid, nummer EA94/U153;

    Gelet op artikel 50, eerste lid, van de Politiewet 1993;

    De Raad van State gehoord (advies van 22 maart 1994, nummer W04.94.0077);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 7 april 1994, directoraat-generaal voor
    Openbare Orde en Veiligheid, directie Politie, hoofdafdeling Personeel, Onderwijs en Informatievoorziening,
    afdeling Arbeidsvoorwaardenbeleid, nummer EA94/1067;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
  - number: 1.1.b
    text: 'de Dienst: de Dienst geneeskundige verzorging politie, bedoeld in artikel 10;'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
  - number: 1.1.c
    text: 'de commissie: de commissie, bedoeld in artikel 11, eerste lid;'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
  - number: 1.1.d
    text: |-
      Stichting Pensioenfonds ABP: de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6 van de Wet Privatisering ABP][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel6
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '6'
  - number: 1.1.e
    text: 'pensioenreglement: het pensioenreglement Stichting Pensioenfonds ABP;'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
  - number: 1.1.f
    text: 'AFUP-opbouwreglement: de regeling bedoeld in artikel 2.4b, tweede lid, van het pensioenreglement;'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
  - number: 1.1.g
    text: |-
      WAO-uitkering: uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 1.1.h
    text: |-
      suppletie-uitkering: de uitkering, bedoeld in
      [artikel 6 van het Besluit suppletieregeling gedeeltelijk arbeidsongeschikten sector politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008099#Artikel6
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008099
        artikel: '6'
  - number: 1.1.i
    text: 'bezoldiging:'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
  - number: 1.1.i.1
    text: |-
      voor de deelnemers, bedoeld in artikel 2, eerste lid, onder *a*: de bezoldiging in de zin van
      het [Besluit bezoldiging politie][ref1], vermeerderd met de bedragen van de vakantie-uitkering
      bedoeld in [artikel 23 van het Besluit bezoldiging politie][ref2], en de uitkering op grond van
      [artikel 25b van het Besluit bezoldiging politie][ref3] per kalendermaand, respectievelijk de ZW-uitkering,
      vermeerderd met de aanvulling, bedoeld in [artikel 39a, tweede lid, van het Besluit bezoldiging politie][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0006517
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel25b
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel39a
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006517
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: 25b
      - id: ref4
        bwb_id: BWBR0006517
        artikel: 39a
  - number: 1.1.i.2
    text: |-
      voor de deelnemers, bedoeld in artikel 2, eerste lid, onder *b*: een aan de hand van voor deze deelnemers geldende
      rechtspositieregelingen, op overeenkomstige wijze als aangegeven onder 1e, bepaald bedrag;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
  - number: 1.1.j
    text: |-
      pensioen: elke periodieke uitkering die is toegekend krachtens het pensioenreglement, met uitzondering van
      hoofdstuk 16 van dat reglement, dan wel de uitkering krachtens het AFUP-opbouwreglement die een deelnemer, zijn
      weduwe of haar weduwnaar geniet uit of in verband met de betrekking waaraan het deelnemerschap wordt ontleend;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
  - number: 1.1.k
    text: |-
      te zijnen laste blijvende ziektekosten: de som van de eigen bijdragen voor ziektekosten,
      indien en voor zover die onderdeel vormen van het verzekeringspakket als bedoeld in
      [artikel 2, tweede lid, van de Wet op de toegang tot ziektekostenverzekeringen][ref1], een en ander na aftrek
      van een door het Rijk of door derden toegekende of toe te kennen tegemoetkoming in ziektekosten, voor zover de
      deelnemer deze kosten noodzakelijkerwijs heeft gemaakt voor zichzelf of voor zijn gezinsleden in de zin van dit
      besluit, en voor zover deze te zijnen laste blijven;


      [ref1]: https://wetten.overheid.nl/BWBR0003934#Artikel2
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003934
        artikel: '2'
  - number: 1.1.l
    text: |-
      wachtgeld: elke periodieke uitkering, door het bevoegd gezag toegekend uit hoofde van onvrijwillige
      werkloosheid, alsmede de uitkering wegens functioneel leeftijdsonslag, de uitkering zoals bedoeld in
      [artikel 88, achtste lid][ref1] en [artikel 88a, vijfde lid, van het Besluit algemene rechtspositie politie][ref2],
      de uitkering op grond van de [Wet kaderregeling vut overheidspersoneel][ref3], de ZW-uitkering, de WW-uitkering, de
      WAO-uitkering en de suppletie-uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel88a
      [ref3]: https://wetten.overheid.nl/BWBR0007792
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '88'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 88a
      - id: ref3
        bwb_id: BWBR0007792
  - number: 1.1.m
    text: 'ZW-uitkering: uitkering krachtens de Ziektewet;'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
  - number: 1.1.n
    text: 'WW-uitkering: uitkering krachtens de Werkloosheidswet.'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit wordt onder echtgenote of echtgenoot mede verstaan de geregistreerde partner
      alsmede de levenspartner met wie de niet-gehuwde ambtenaar samenwoont en – met het oogmerk duurzaam samen te leven
      – een gemeenschappelijke huishouding voert op basis van een notarieel verleden samenlevingscontract bevattende
      de wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding. Onder
      weduwe of weduwnaar wordt mede begrepen de achtergebleven geregistreerde partner alsmede de achtergebleven
      partner. Tot gezinslid wordt in voorkomend geval mede gerekend de geregistreerde partner alsmede de levenspartner.
      Tegelijkertijd kan slechts één persoon als echtgenoot of echtgenote dan wel weduwe of weduwnaar worden aangemerkt.
      De commissie kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt dat een
      samenlevingscontract als bedoeld in de eerste volzin is gesloten.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel1
  - number: '2.1'
    text: 'Onverminderd artikel 6 is deelnemer:'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel2
  - number: 2.1.a
    text: |-
      degene wiens rechtspositie is geregeld op grond van [artikel 50, eerste lid][ref1],
      of [artikel 53d, zesde lid, van de Politiewet 1993][ref2] dan wel op grond van
      [artikel 10, vijfde lid, eerste en tweede volzin, van de Wet op het LSOP en het Politieonderwijs][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel53d
      [ref3]: https://wetten.overheid.nl/BWBR0014623#Artikel10
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0006299
        artikel: 53d
      - id: ref3
        bwb_id: BWBR0014623
        artikel: '10'
  - number: 2.1.b
    text: |-
      degene die hier te lande in bezoldigde burgerlijke dienst werkzaam is bij de Dienst geneeskundige verzorging
      politie;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel2
  - number: 2.1.c
    text: |-
      degene die de dienstbetrekking gedeeltelijk als actief dienende voortzet en voor het resterende deel een uitkering
      in de zin van de [Wet kaderregeling vut overheidspersoneel][ref1] ontvangt, dan wel een uitkering op grond van het
      AFUP-opbouwreglement;


      [ref1]: https://wetten.overheid.nl/BWBR0007792
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007792
  - number: 2.1.d
    text: |-
      degene die in het genot is van pensioen of wachtgeld, hem toegekend op de dag van ontslag en die op de dag,
      onmiddellijk voorafgaande aan zijn ontslag, actief dienende deelnemer was, tenzij hij binnen vier weken na de datum
      van ingang van het ontslag schriftelijk aan de Dienst meedeelt dat hij geen deelnemer wenst te blijven;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel2
  - number: 2.1.e
    text: |-
      de weduwe of weduwnaar van de deelnemer die als gevolg van het overlijden van die deelnemer recht heeft op
      onmiddellijk ingaand weduwen- of weduwnaarspensioen, tenzij deze binnen drie maanden na de datum van het overlijden
      van de echtgenoot of echtgenote schriftelijk aan de Dienst meedeelt dat het deelnemerschap niet wordt gewenst;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel2
  - number: 2.1.f
    text: |-
      degene die een WAO-uitkering ontvangt en ter benutting van zijn restverdiencapaciteit zijn dienstbetrekking,
      bedoeld onder a, gedeeltelijk voortzet of herplaatst is in een dienstbetrekking, bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel2
  - number: 2.1.g
    text: |-
      degene die gedeeltelijk een betrekking als actief dienende vervult en voor het resterende deel een uitkering in de
      zin van het pensioenreglement, een WAO-uitkering of een suppletie-uitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel2
  - number: '2.2'
    text: |-
      De in het eerste lid, onder *a* en *b*, genoemde deelnemers worden aangemerkt als actief dienende deelnemers en
      die, genoemd onder *c* tot en met *e*, als gepensioneerde deelnemers.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister is bevoegd, te bepalen dat andere ambtenaren of arbeidscontractanten dan die, bedoeld in het eerste
      lid onder *a* en *b*, als actief dienende deelnemers worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel2
  - number: '2.4'
    text: |-
      De schriftelijke mededeling van de gepensioneerde deelnemer, dat het deelnemerschap niet langer gewenst wordt,
      is onherroepelijk.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel2
  - number: '3.1'
    text: 'Onverminderd de artikelen 5, tweede lid, en 6 is gezinslid in de zin van dit besluit:'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel3
  - number: 3.1.a
    text: de echtgenoot of echtgenote van de deelnemer;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel3
  - number: 3.1.b
    text: |-
      het eigen kind, het aangehuwde kind en het pleegkind van de deelnemer, indien en zolang voor dat kind recht op
      kinderbijslag bestaat bij de deelnemer of zijn tot zijn huishouden behorende echtgenoot;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel3
  - number: 3.1.c
    text: |-
      het eigen kind, het aangehuwde kind en het pleegkind van de deelnemer, waarvoor bij hem of zijn tot zijn huishouden
      behorende echtgenoot recht op kinderbijslag zal ontstaan met ingang van de eerste dag van het kalenderkwartaal,
      volgend op dat waarin het kind geboren is, de studie aanvangt dan wel in het huishouden is opgenomen;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel3
  - number: 3.1.d
    text: |-
      het kind van de deelnemer, waarvoor aanspraak op kinderbijslag zou kunnen worden gemaakt, ware het niet dat dit
      kind:
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel3
  - number: 3.1.d.1°
    text: in het genot is van wezenpensioen en/of studiebeurs, studietoelage en renteloos voorschot voor studiedoeleinden;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel3
  - number: 3.1.d.2°
    text: |-
      ten laste van de in de [Algemene Wet Bijzondere Ziektekosten][ref1] geregelde verzekering in een inrichting
      verblijft;


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 3.1.e
    text: |-
      de bloed- of aanverwant tot in de tweede graad van de deelnemer, indien deze bij de deelnemer inwoont en, naar het
      oordeel van de commissie, het huishouden van de deelnemer bestuurt en door de deelnemer geheel of grotendeels wordt
      onderhouden.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het gezinslidmaatschap van de in het eerste lid, onder *c* en *d* 1°, bedoelde studerende kinderen
      blijft gehandhaafd voor studerende kinderen van 18 tot en met 26 jaar, die aanspraak hebben op een
      basisbeurs op grond van de [Wet studiefinanciering 2000][ref1] of een tegemoetkoming op grond van
      de[Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
  - number: '3.3'
    text: |-
      Het gezinslid, bedoeld in het eerste lid, onder *e*, wordt op aanvraag van de deelnemer als gezinslid ingeschreven.
      Dit gezinslidmaatschap kan niet eerder aanvangen dan op de dag waarop de in de eerste volzin bedoelde aanvraag door
      de commissie is ontvangen.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel3
  - number: '4.1'
    text: 'Het deelnemerschap eindigt:'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel4
  - number: 4.1.a
    text: met ingang van de dag volgend op die van het overlijden van de deelnemer;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel4
  - number: 4.1.b
    text: |-
      met ingang van de dag waarop men niet meer aan alle voor het deelnemerschap gestelde vereisten voldoet, doch
      onverminderd artikel 6, eerste lid;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel4
  - number: 4.1.c
    text: |-
      met ingang van de eerste dag van de maand volgend op die waarin de gepensioneerde deelnemer bij aangetekend
      schrijven te kennen heeft gegeven dat hij niet langer prijs stelt op het deelnemerschap;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel4
  - number: 4.1.d
    text: |-
      met ingang van de dag waarop de deelnemer zonder behoud van bezoldiging op non-actief is gesteld dan wel anders
      dan op grond van de Regeling verlofsparen politie met onbezoldigd verlof gaat voor een periode van meer dan twaalf
      maanden;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel4
  - number: 4.1.e
    text: |-
      met ingang van een door de commissie te bepalen dag, indien de gepensioneerde deelnemer een door hem verschuldigde
      betaling niet heeft voldaan binnen twee maanden, nadat hij door de commissie bij aangetekende brief op zijn
      verplichtingen is gewezen;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel4
  - number: 4.1.f
    text: |-
      met ingang van de dag waarop de deelnemer, anders dan voor herhalingsoefeningen, in werkelijke militaire dienst is,
      tenzij door dit feit ook een of meer gezinsleden in de zin van dit besluit niet langer als zodanig zouden worden
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel4
  - number: '4.2'
    text: 'De hoedanigheid van gezinslid vervalt:'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel4
  - number: 4.2.a
    text: |-
      met ingang van de dag waarop het gezinslid niet meer aan de vereisten voor die hoedanigheid als omschreven in
      artikel 3 voldoet;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel4
  - number: 4.2.b
    text: |-
      met ingang van de dag waarop op het gezinslid een van de bepalingen van artikel 5, tweede lid, van toepassing is
      geworden;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel4
  - number: 4.2.c
    text: |-
      met ingang van de eerste dag van de tweede maand volgend op die, waarin de deelnemer aan wiens deelnemerschap de
      hoedanigheid van gezinslid wordt ontleend, is overleden, tenzij artikel 2, eerste lid, onder e, van toepassing is.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel4
  - number: '5.1'
    text: 'Geen deelnemer is:'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.1.a
    text: degene die geen bezoldiging in de zin van artikel 1 van dit besluit geniet;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.1.b
    text: |-
      degene, bedoeld in artikel 2, eerste lid, onder a en b, aan wie op grond van een ministeriële regeling met
      betrekking tot gewetensbezwaren vrijstelling is verleend.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.1.c
    text: |-
      degene, bedoeld in artikel 2, eerste lid onder a, die vakantiewerker is in de zin van het
      [Besluit algemene rechtspositie politie][ref1], en het lichaam, belast met de uitbetaling van zijn bezoldiging,
      schriftelijk meedeelt dat hij geen deelnemer wenst te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006516
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006516
  - number: '5.2'
    text: 'Geen gezinslid is:'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.2.a
    text: de echtgenoot of echtgenote van wie de deelnemer is gescheiden van tafel en bed;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.2.b
    text: |-
      de echtgenoot of echtgenote van de deelnemer, bedoeld in artikel 2, eerste lid, onder *f*, alsmede de kinderen uit
      dat huwelijk;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.2.c
    text: 'de echtgenoot of echtgenote die een betrekking vervult, uit hoofde waarvan aanspraak gemaakt kan worden op:'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.2.c.1°
    text: gehele of gedeeltelijke geneeskundige verzorging
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.2.c.2°
    text: gehele of gedeeltelijke vergoeding van de kosten van geneeskundige verzorging of
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.2.c.3°
    text: gehele of gedeeltelijke vergoeding van de premie voor een ziektekostenverzekering;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.2.d
    text: |-
      de echtgenoot of echtgenote van wie het inkomen meer bedraagt dan dat van de deelnemer, alsmede de kinderen uit
      dit huwelijk;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.2.e
    text: |-
      het eigen kind, het aangehuwde kind en het pleegkind van de deelnemer, dat een betrekking vervult uit hoofde
      waarvan aanspraak gemaakt kan worden op:
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.2.e.1°
    text: gehele of gedeeltelijke geneeskundige verzorging of
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.2.e.2°
    text: gehele of gedeeltelijke vergoeding van de kosten van geneeskundige verzorging of
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.2.e.3°
    text: gehele of gedeeltelijke vergoeding van de premie voor een ziektekostenverzekering;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: 5.2.f
    text: |-
      het eigen kind, het aangehuwde kind en het pleegkind dat gezinslid, mede-verzekerde of medebetrokkene is in de
      onder *c* bedoelde aanspraken.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister kan, gehoord de commissie, besluiten dat wanneer op grond van dit besluit het deelnemerschap dan
      wel de hoedanigheid van gezinslid zou moeten worden beëindigd, de betrokkene onder nader door hem te bepalen
      voorwaarden als deelnemer of gezinslid in de zin van dit besluit zal worden gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het deelnemerschap van degene, bedoeld in artikel 2, eerste lid, onder *a* en *b*, kan op aanvraag worden
      opgeschort voor de periode gedurende welke een door betrokkene gesloten verzekering tegen de kosten van
      geneeskundige verzorging niet kan worden beëindigd, mits die periode langer is dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel6
  - number: '6.3'
    text: |-
      De aanvraag, bedoeld in het tweede lid, wordt binnen twee weken na de dag waarop het deelnemerschap is aangevangen,
      ingediend bij het tot aanstelling bevoegde gezag. Het bevoegd gezag brengt het besluit ter kennis van de
      administrateur van de Dienst en aan het lichaam belast met de uitbetaling van de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het Rijk kent volgens de bepalingen van dit besluit en volgens nader door Onze Minister te stellen regels, aan
      of ten behoeve van de deelnemer vergoedingen van of tegemoetkomingen in door hem voor zich en zijn gezinsleden
      gemaakte ziektekosten toe.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: '7.2'
    text: 'De in het eerste lid bedoelde nader te stellen regels zullen in ieder geval betreffen de kosten van:'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.2.a
    text: geneeskundige hulp verleend door huisartsen en specialisten;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.2.b
    text: tandheelkundige hulp;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.2.c
    text: verloskundige hulp en kraamzorg;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.2.d
    text: verpleging en behandeling in ziekenhuizen, waaronder psychiatrische ziekenhuizen en sanatoria mede worden begrepen;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.2.e
    text: verzorging en behandeling in inrichtingen voor psychiatrische dag- of nachtbehandeling;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.2.f
    text: verzorging en behandeling in inrichtingen voor revalidatiedagbehandeling;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.2.g
    text: farmaceutische hulp;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.2.h
    text: bijzondere medische verrichtingen;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.2.i
    text: orgaantransplantatie;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.2.j
    text: medische kunst- en hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.2.k
    text: ziekenvervoer.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien het deelnemerschap eindigt, wordt de toekenning van de vergoedingen of tegemoetkomingen ten behoeve van
      betrokkene voortgezet met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.3.a
    text: |-
      voor wat betreft de vergoedingen of tegemoetkomingen voor verpleging en behandeling in ziekenhuizen de voortzetting
      slechts plaats heeft ten behoeve van degene, die op de datum van beëindiging van het deelnemerschap in een
      ziekenhuis wordt verpleegd dan wel aan wie reeds een machtiging voor verpleging en behandeling in een ziekenhuis
      was verleend, mits de opneming in het ziekenhuis geschiedt binnen drie maanden na de datum waarop de machtiging is
      afgegeven door de Dienst;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.3.b
    text: |-
      voor wat betreft de vergoedingen of tegemoetkomingen voor verzorging en behandeling in een inrichting voor
      psychiatrische dag- of nachtbehandeling of een inrichting voor revalidatiedagbehandeling, de voortzetting plaats
      heeft gedurende ten hoogste zes maanden na beëindiging van het deelnemerschap;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.3.c
    text: |-
      voor wat betreft de overige vergoedingen of tegemoetkomingen de voorzetting plaats heeft gedurende ten hoogste drie
      maanden na beëindiging van het deelnemerschap.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: '7.4'
    text: |-
      Indien het deelnemerschap eindigt komen de kosten, verband houdend met orgaantransplantatie, insgelijks voor
      voortgezette vergoeding in aanmerking, mits tenminste op de ontvanger van het te transplanteren weefsel het derde
      lid, onder *a*, van toepassing is.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: '7.5'
    text: 'Het derde en vierde lid zijn niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.5.a
    text: |-
      de deelnemer zich aansluitend elders tegen ziektekosten op overeenkomstige wijze als bij of krachtens dit besluit
      kan verzekeren;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7.5.b
    text: de gepensioneerde deelnemer het deelnemerschap heeft opgezegd.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: '7.6'
    text: |-
      Indien de hoedanigheid van gezinslid vervalt, zijn op dit gewezen gezinslid het derde lid tot en met het vijfde lid
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: '7.7'
    text: |-
      De Dienst kan vergoeding vorderen van schade die is geleden doordat een persoon ten onrechte als gezinslid als
      bedoeld in [artikel 3][ref1] is ingeschreven als gevolg van het feit dat de deelnemer onjuiste en onvolledige
      informatie heeft verstrekt of heeft verzuimd overeenkomstig de daartoe gestelde regels melding te maken van het
      einde van de omstandigheid op grond waarvan de persoon als gezinslid is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006605#Artikel3
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006605
        artikel: '3'
  - number: '7.8'
    text: |-
      De schadevergoeding, bedoeld in het zevende lid, wordt gesteld op € 94,97 per maand of indien sprake is van
      een kind € 47,49 per maand, berekend over de periode van onrechtmatige inschrijving. Deze bedragen kunnen bij
      ministeriële regeling worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: '7.9'
    text: |-
      Indien sprake is van een onrechtmatige inschrijving als bedoeld in het zevende lid en tevens aanspraak is
      gemaakt op een vergoeding of verstrekking, kan de Dienst de in het zevende lid bedoelde schade vaststellen op het
      werkelijke bedrag daarvan, indien de werkelijke schade hoger is dan het bedrag waarop de schade bij toepassing van
      het achtste lid zou zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7
  - number: 7a.1
    text: |-
      De deelnemer kan een tegemoetkoming verkrijgen in de te zijnen laste blijvende ziektekosten die hij gedurende
      een aaneengesloten tijdvak van twaalf maanden heeft gemaakt. Voor de vraag of die kosten betrekking hebben op het
      tijdvak is bepalend of de datum van de behandeling of verstrekking in dat tijdvak is gelegen.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7a
  - number: 7a.2
    text: |-
      De tegemoetkoming, bedoeld in het eerste lid, wordt aan de deelnemer verleend voor zover de te zijnen laste
      blijvende ziektekosten hoger zijn dan het door Onze Minister vastgestelde percentage van de inkomsten van de
      deelnemer en zijn medeverzekerde gezinsleden. Indien een tijdvak gelegen is in twee kalenderjaren, wordt het
      proportionele gemiddelde van dat percentage berekend naar rato van de aantallen maanden in de onderscheiden jaren.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7a
  - number: 7a.3
    text: Onze Minister stelt regels vast ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel7a
  - number: '8'
    text: |-
      De vergoedingen of tegemoetkomingen, bedoeld in [artikel 7][ref1], worden niet toegekend:


      [ref1]: https://wetten.overheid.nl/BWBR0006605#Artikel7
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006605
        artikel: '7'
  - number: 8.a
    text: |-
      voor de zorg, bedoeld in het [Besluit zorgaanspraken AWBZ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014149
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014149
  - number: 8.b
    text: |-
      indien met betrekking tot de kosten, voortvloeiende uit ziekte of ongeval overeenkomstige aanspraken tegenover
      derden bestaan, tenzij de [Verhaalswet ongevallen ambtenaren][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002500
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002500
  - number: '9.1'
    text: |-
      Tot dekking van de kosten van geneeskundige verzorging is het lichaam, belast met de uitbetaling van de bezoldiging
      dan wel belast met de uitbetaling van het bedrag dat maandelijks wordt verstrekt in het kader van de Regeling
      verlofsparen politie, voor de actief dienende deelnemer een maandelijkse bijdrage aan de Dienst verschuldigd. Het
      lichaam verhaalt op de deelnemer een, op voorstel van de commissie, door Onze Minister vast te stellen percentage
      van de bijdrage.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: '9.2'
    text: |-
      Aan de Dienst komt een maandelijkse bijdrage toe, gelijk aan de in het eerste lid bedoelde bijdrage, voor de
      gepensioneerde deelnemer. Het in het eerste lid bedoelde percentage van de bijdrage is aan de Dienst verschuldigd
      door de gepensioneerde deelnemer. Onze Minister voorziet in de betaling aan de Dienst van het resterende deel van
      de bijdrage, voor zover daarin niet wordt voorzien bij of krachtens enige andere regeling.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: '9.3'
    text: |-
      De bijdrage, bedoeld in het eerste en tweede lid, bedraagt een voor elk kalenderjaar op voorstel van de commissie
      door Onze Minister vast te stellen percentage van de heffingsgrondslag. Bij het vaststellen van het percentage
      wordt tevens het bedrag vastgesteld, dat als maximum zal gelden, waarboven van de heffingsgrondslag geen bijdrage
      zal worden berekend. Indien Onze Minister, gezien het advies van de commissie, van oordeel is, dat het vastgestelde
      percentage, bedoeld in de eerste volzin, of het percentage, bedoeld in het eerste lid, in de loop van het
      kalenderjaar wijziging behoeft, stelt hij voor het resterende deel van dat jaar een nieuw percentage vast.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: '9.4'
    text: 'Onder heffingsgrondslag, bedoeld in het derde lid, wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: 9.4.a
    text: |-
      voor de actief dienende deelnemer: de bezoldiging uit zijn betrekkingen of, indien hij gespaard verlof geniet
      als bedoeld in de Regeling verlofsparen politie, het bedrag dat hem maandelijks op grond van die regeling
      wordt verstrekt, met dien verstande dat dit bedrag ten minste 80% van de naar een volledige betrekking herleide
      bezoldiging bedraagt en in geval van meerdere betrekkingen dit bedrag ten minste 80% van de volledige bezoldiging
      van de hoofdbetrekking bedraagt;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: 9.4.b
    text: |-
      voor de deelnemer, bedoeld in artikel 2, eerste lid, onderdeel c, f en g: de som van de bezoldiging, het wachtgeld
      of het pensioen, met dien verstande dat dit totale bedrag ten minste 80% van de naar een volledige betrekking
      herleide bezoldiging bedraagt;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: 9.4.c
    text: |-
      voor de deelnemer, bedoeld in artikel 2, eerste lid, onder *d*, die pensioen ontvangt: het pensioen, doch tenminste
      70% van het bedrag, dat tot grondslag strekt voor de berekening van het pensioen;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: 9.4.d
    text: |-
      voor de deelnemer, bedoeld in artikel 2, eerste lid, onder *d*, aan wie een wachtgeld is toegekend: het wachtgeld,
      doch tenminste 70% van het bedrag waarnaar het wachtgeld is berekend;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: 9.4.e
    text: |-
      voor de deelnemer, bedoeld in artikel 2, eerste lid, onderdeel e, die een weduwenpensioen, een weduwnaarspensioen
      of een tijdelijk pensioen geniet: het pensioen, doch tenminste 50% van het bedrag dat tot grondslag strekt voor de
      berekening van het pensioen, waarvan haar of zijn pensioen is afgeleid, vermeerderd met 10% van dat bedrag voor elk
      van haar of zijn voor wezenpensioen in aanmerking komende kinderen tot een maximum van twee kinderen.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: '9.5'
    text: |-
      In afwijking van het vierde lid bedraagt de heffingsgrondslag, bedoeld in het derde lid, voor de deelnemer die
      op grond van [artikel 13b van het Besluit algemene rechtspositie politie][ref1] non-activiteit geniet, het non-
      activiteitsinkomen zoals bedoeld in [artikel 29a, onderdeel c, van het Besluit bezoldiging politie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13b
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel29a
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13b
      - id: ref2
        bwb_id: BWBR0006517
        artikel: 29a
  - number: '9.6'
    text: |-
      In afwijking van het vierde lid bedraagt de heffingsgrondslag, bedoeld in het derde lid, voor de deelnemer met een
      deelbetrekking die op grond van [artikel 13b van het Besluit algemene rechtspositie politie][ref1] politie non-
      activiteit geniet:


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13b
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13b
  - number: 9.6.a
    text: |-
      indien de deelbetrekking minder dan 80% van een volledige betrekking omvat: 80% van het non-activiteitsinkomen van
      een volledige betrekking;
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: 9.6.b
    text: 'indien de deelbetrekking 80% of meer van een volledige betrekking omvat: het non-activiteitsinkomen.'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: '9.7'
    text: |-
      Bij de vaststelling van de bedragen die tot grondslag strekken voor de berekening van het pensioen en
      het wachtgeld, wordt rekening gehouden met de aanpassing van de pensioenen en wachtgelden aan de algemene
      bezoldigingswijzigingen.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: '9.8'
    text: |-
      Indien de actief dienende deelnemer geen bezoldiging meer geniet, wordt het op grond van het derde lid vastgestelde
      percentage van de laatstgenoten bezoldiging door het lichaam betaald, met inachtneming van het in de voorlaatste
      volzin van het derde lid bedoelde bedrag. Het gedeelte van de bijdrage dat moet worden verhaald, wordt door het
      lichaam, bedoeld in het eerste lid, van de deelnemer ingevorderd.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: '9.9'
    text: |-
      Omtrent de wijze waarop de bijdrage moet worden afgedragen en het verhaal moet plaatsvinden, kan Onze Minister
      nadere regels geven.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: '9.10'
    text: |-
      Onverminderd het eerste, tweede, derde en achtste lid, is de deelnemer voor zich en ieder van zijn gezinsleden aan
      de Dienst een nominale bijdrage verschuldigd die door Onze Minister wordt vastgesteld. Bij dit besluit kan Onze
      Minister, op advies van de commissie, tevens de wijze waarop en de termijnen waarin de nominale bijdrage door de
      deelnemer dient te worden afgedragen, vaststellen. De totale opbrengst van de nominale bijdrage wordt aangewend ter
      verlaging van het te verhalen percentage van de bijdrage, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: '9.11'
    text: |-
      De nominale bijdrage, bedoeld in het tiende lid, is voor niet meer dan twee gezinsleden, bedoeld in artikel 3,
      eerste lid, onder b tot en met e, verschuldigd.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: '9.12'
    text: |-
      De bijdrage, bedoeld in het eerste en het tweede lid, is verschuldigd met ingang van de datum waarop men deelnemer
      wordt. De nominale bijdrage, bedoeld in het tiende lid, is de deelnemer voor zich en zijn gezinsleden verschuldigd
      met ingang van een peildatum. Op advies van de commissie worden door Onze Minister regels gesteld met betrekking
      tot de peildatum. Ter bepaling van de datum waarop men gezinslid is geworden, dient de deelnemer op verzoek van de
      Dienst een verklaring van voorafgaande verzekering van het desbetreffende gezinslid te overleggen.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
  - number: '9.13'
    text: |-
      Een in deeltijd werkzame deelnemer die verplicht verzekerd is in de zin van de [Ziekenfondswet][ref1] wordt
      desgevraagd, na het overleggen van betaalbewijzen, eenmaal per kalenderkwartaal een vergoeding gegeven in het
      werknemersdeel van de procentuele premie, bedoeld in [artikel 15 van de Ziekenfondswet][ref2], en van het nominale
      deel van de ziekenfondspremie, bedoeld in [artikel 17 van de Ziekenfondswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002460
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
