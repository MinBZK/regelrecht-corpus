  - number: '9.14'
    text: |-
      Aan de deelnemer die als zelfstandige verplicht is verzekerd ingevolge de [Ziekenfondswet][ref1], wordt op zijn
      verzoek na het overleggen van betaalbewijzen eenmaal per kalenderjaar de door hem uit hoofde van die verplichte
      verzekering verschuldigde premie vergoed tot ten hoogste het bedrag dat hij ingevolge dit besluit aan premie is
      verschuldigd. Over de periode gelegen vóór 1 januari van het jaar voorafgaand aan het jaar waarin het verzoek wordt
      ingediend, vindt geen vergoeding plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: '10.1'
    text: |-
      Er is een Dienst geneeskundige verzorging politie, welke Dienst Onze Minister, volgens door hem te stellen regels,
      bijstaat bij de uitvoering van dit besluit en van de krachtens dit besluit gegeven regels.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel10
  - number: '10.2'
    text: De Dienst ressorteert comptabel onder Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel10
  - number: '11.1'
    text: Aan het hoofd van de Dienst staat een commissie, die belast is met de algemene leiding en het beheer van de Dienst.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel11
  - number: '11.2'
    text: |-
      De commissie bestaat uit ten minste zes leden die worden benoemd, geschorst en ontslagen bij beschikking van Onze
      Minister. Onze Minister wijst uit de leden de voorzitter en de secretaris aan. De commissie wijst uit de overige
      leden een plaatsvervangend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel11
  - number: '11.3'
    text: |-
      Elk van de tot de Commissie voor georganiseerd overleg in politie-ambtenarenzaken toegelaten politievakorganisaties
      is bevoegd een voordracht te doen voor de benoeming van één lid van de commissie.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel11
  - number: '11.4'
    text: |-
      De dagelijkse leiding van de Dienst berust bij een administrateur, die kan worden bijgestaan door ambtenaren. De
      administrateur en de ambtenaren worden, de commissie gehoord, bij beschikking van Onze Minister benoemd, geschorst
      en ontslagen.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel11
  - number: '11.5'
    text: Onze Minister geeft in een instructie nadere regels betreffende de werkzaamheden van de commissie.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel11
  - number: '12'
    text: |-
      De commissie en de administrateur, bedoeld in artikel 11, kunnen worden bijgestaan door een medisch adviseur, een
      tandheelkundig adviseur en een farmaceutisch adviseur. Deze adviseurs worden, de commissie gehoord, bij beschikking
      van Onze Minister benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel12
  - number: '13.1'
    text: |-
      Als deelnemer wordt met ingang van het tijdstip van inwerkingtreding van dit besluit aangemerkt degene die op de
      dag voorafgaande aan die waarop dit besluit in werking is getreden, deelnemer was op grond van artikel 16, eerste
      lid, van het Besluit geneeskundige verzorging politie 1984.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel13
  - number: '13.2'
    text: |-
      Uitgesloten van het deelnemerschap is degene die op de dag voorafgaande aan die waarop dit besluit in werking
      is getreden, op grond van artikel 16, tweede lid, van het Besluit geneeskundige verzorging politie 1984, geen
      deelnemer was.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel13
  - number: 13a.1
    text: |-
      Degene die in de periode van 1 januari 1992 tot en met 31 maart 1994 als gezinslid had kunnen worden aangemerkt,
      indien artikel 3, eerste lid, aanhef en onderdeel *f*, in genoemde periode reeds zou hebben gegolden, heeft over
      genoemde periode aanspraak op de vergoedingen, bedoeld in artikel 7, zevende lid.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel13a
  - number: 13a.2
    text: |-
      Degene op wie in de periode van 1 januari 1992 tot en met 31 maart 1994, artikel 9, elfde lid, van toepassing zou
      zijn geweest indien dit lid in genoemde periode reeds zou hebben gegolden, heeft over genoemde periode, na het
      overleggen van betaalbewijzen, aanspraak op de vergoeding, bedoeld in artikel 9, elfde lid.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel13a
  - number: 13a.3
    text: |-
      Besluiten ter uitvoering van het Besluit geneeskundige verzorging politie 1984 die in de periode van 1 juli
      1989 tot en met 31 maart 1994 zijn genomen waarbij artikel 2, eerste lid, aanhef en onderdeel *c*, artikel 5,
      eerste lid, aanhef en onderdeel *b*, artikel 9, derde lid en vierde lid, aanhef en onderdeel *b*, van dit besluit
      zijn toegepast als zouden deze bepalingen in genoemde periode reeds hebben gegolden, worden gelijkgesteld met
      rechtsgeldig genomen besluiten op grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel13a
  - number: '14.1'
    text: |-
      Alle benoemingen door Onze Minister gedaan op grond van het Besluit geneeskundige verzorging politie 1984 worden
      geacht te zijn geschied op grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel14
  - number: '14.2'
    text: |-
      Na de inwerkingtreding van dit besluit berusten de regelingen gegeven op grond van het Besluit geneeskundige
      verzorging politie 1984 op dit besluit.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel14
  - number: '15'
    text: Het Besluit geneeskundige verzorging politie 1984 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel15
  - number: '16'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 april 1994.
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Besluit geneeskundige verzorging politie 1994.'
    url: https://wetten.overheid.nl/BWBR0006605/2006-01-01#Artikel17
