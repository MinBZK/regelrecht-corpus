articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. de Dienst: de Dienst geneeskundige verzorging politie, bedoeld in [artikel 10][ref1];

      c. de commissie: de commissie, bedoeld in [artikel 11, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006605#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006605#Artikel11
    url: https://wetten.overheid.nl/BWBR0006605/2006-12-22#Artikel1
