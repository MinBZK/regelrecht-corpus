        artikel: '11'
  - number: 7a
    text: |-
      1 De deelnemer kan een tegemoetkoming verkrijgen in de te zijnen laste blijvende ziektekosten die hij gedurende
      een aaneengesloten tijdvak van twaalf maanden heeft gemaakt. Voor de vraag of die kosten betrekking hebben op het
      tijdvak is bepalend of de datum van de behandeling of verstrekking in dat tijdvak is gelegen.

      2 De tegemoetkoming, bedoeld in het eerste lid, wordt aan de deelnemer verleend voor zover de te zijnen laste
      blijvende ziektekosten hoger zijn dan het door Onze Minister vastgestelde percentage van de inkomsten van de
      deelnemer en zijn medeverzekerde gezinsleden. Indien een tijdvak gelegen is in twee kalenderjaren, wordt het
      proportionele gemiddelde van dat percentage berekend naar rato van de aantallen maanden in de onderscheiden jaren.

      3 Onze Minister stelt regels vast ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006605/2006-12-22#Artikel7a
  - number: '10'
    text: |-
      1 Er is een Dienst geneeskundige verzorging politie, welke Dienst Onze Minister, volgens door hem te stellen
      regels, bijstaat bij de uitvoering van dit besluit en van de krachtens dit besluit gegeven regels.

      2 De Dienst ressorteert comptabel onder Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006605/2006-12-22#Artikel10
  - number: '11'
    text: |-
      1 Aan het hoofd van de Dienst staat een commissie, die belast is met de algemene leiding en het beheer van de
      Dienst.

      2 De commissie bestaat uit ten minste zes leden die worden benoemd, geschorst en ontslagen bij beschikking van Onze
      Minister. Onze Minister wijst uit de leden de voorzitter en de secretaris aan. De commissie wijst uit de overige
      leden een plaatsvervangend voorzitter aan.

      3 Elk van de tot de Commissie voor georganiseerd overleg in politie-ambtenarenzaken toegelaten
      politievakorganisaties is bevoegd een voordracht te doen voor de benoeming van één lid van de commissie.

      4 De dagelijkse leiding van de Dienst berust bij een administrateur, die kan worden bijgestaan door ambtenaren.

      De administrateur en de ambtenaren worden, de commissie gehoord, bij beschikking van Onze Minister benoemd,
      geschorst en ontslagen.

      5 Onze Minister geeft in een instructie nadere regels betreffende de werkzaamheden van de commissie.
    url: https://wetten.overheid.nl/BWBR0006605/2006-12-22#Artikel11
  - number: '12'
    text: |-
      De commissie en de administrateur, bedoeld in artikel 11, kunnen worden bijgestaan door een medisch adviseur, een
      tandheelkundig adviseur en een farmaceutisch adviseur. Deze adviseurs worden, de commissie gehoord, bij beschikking
      van Onze Minister benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0006605/2006-12-22#Artikel12
  - number: '13'
    text: |-
      Dit besluit en de krachtens dit besluit gestelde regels, zoals die luidden op 31 december 2005, blijven van
      toepassing op de aanspraken gebaseerd op dit besluit en krachtens dit besluit gestelde regels en die zijn ontstaan
      voor 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0006605/2006-12-22#Artikel13
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Besluit geneeskundige verzorging politie 1994.'
    url: https://wetten.overheid.nl/BWBR0006605/2006-12-22#Artikel17
