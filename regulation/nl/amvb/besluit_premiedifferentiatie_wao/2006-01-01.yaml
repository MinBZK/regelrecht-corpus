  - number: '8'
    text: |-
      1 Voor een grote werkgever die, zonder dat er sprake is van een overgang van een onderneming als bedoeld
      in [artikel 5][ref1], eerst in het premiejaar, of in het eerste of tweede kalenderjaar onmiddellijk
      voorafgaande aan het premiejaar, de hoedanigheid van werkgever heeft verkregen, is het percentage van de in
      [artikel 78, eerste lid, van de Wet][ref2], bedoelde gedifferentieerde premie gelijk aan het percentage, bedoeld in
      [artikel 78, tweede lid, onderdeel a, van de Wet][ref3].

      2 Het eerste lid is niet van toepassing op de werkgever die in het tijdvak, bedoeld in
      [artikel 4, tweede lid][ref4], reeds werkgever was.

      3 [Artikel 7][ref5] is niet van toepassing op een werkgever als bedoeld in het eerste lid.


