  - number: '6'
    text: |-
      1 Indien blijkt dat een in [artikel 4, tweede lid][ref1], bedoelde arbeidsongeschiktheidsuitkering geheel of ten
      dele ten onrechte is toegekend, wordt bij de berekening van het individuele werkgeversrisico-percentage in het
      kalenderjaar waarin het besluit tot toekenning van de arbeidsongeschiktheidsuitkering wordt ingetrokken of herzien,
      het in [artikel 4, tweede lid][ref2], bedoelde totaalbedrag verminderd met een bedrag dat gelijk is aan het bedrag
      van de te veel betaalde arbeidsongeschiktheidsuitkering.

      2 Indien de in [artikel 107a, tweede lid, van Boek 6 van het Burgerlijk Wetboek][ref3] bedoelde schadevergoeding is
      ontvangen, wordt, op verzoek van de werkgever, bij de berekening van het individuele werkgeversrisicopercentage met
      ingang van het kalenderjaar waarin de schadevergoeding is ontvangen, gedurende een tijdvak van vier jaren, het in
      [artikel 4, tweede lid][ref4], bedoelde totaalbedrag verminderd met een compensatiebedrag.

      3 Het in het tweede lid bedoelde compensatiebedrag wordt vastgesteld door het bedrag van de
      arbeidsongeschiktheidsuitkering aan de betrokken werknemer jaarlijks gedurende vier jaar te vermenigvuldigen met
      een getal dat is verkregen door het bedrag van de in het tweede lid bedoelde schadevergoeding te delen door het loon
      over het tijdvak van 104 weken, bedoeld in [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref5].
      Het getal bedoeld in de eerste zin bedraagt niet meer dan 1.

      4 In afwijking van het derde lid wordt in de gevallen waarin ziekengeld wordt uitgekeerd aan de verzekerde,
      bedoeld in [artikel 29 van de Ziektewet][ref6], het in het tweede lid bedoelde compensatiebedrag vastgesteld
      door het bedrag van de arbeidsongeschiktheidsuitkering aan de betrokken werknemer te vermenigvuldigen
      met een getal dat is verkregen door het bedrag van het ontvangen verhaal dat is verkregen op grond
      van [artikel 52a van de Ziektewet][ref7] te delen door het aan betrokken werknemer op grond van de
      [Ziektewet][ref8]uitgekeerde ziekengeld.

      5 De uitkomst van de in het derde en vierde lid bedoelde berekening wordt naar beneden afgerond op twee cijfers
      achter de komma.


