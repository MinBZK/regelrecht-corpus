  - number: '11'
    text: |-
      1 Bij de vaststelling van het individuele werkgeversrisicopercentage, bedoeld in
      [artikel 4, tweede lid][ref1], van werkgevers van overheidswerknemers als bedoeld in
      __REF001___________________________________________________________________________________________________________
      ____________, wordt het premieplichtig loon voor wat betreft de jaren 1993 tot en met 1995 bepaald aan de hand van
      het gecorrigeerd ambtelijk inkomen over die jaren. Onder het ambtelijk inkomen, bedoeld in de eerste zin, wordt
      verstaan, het ambtelijk inkomen, bedoeld in artikel C1 van de Algemene burgerlijke pensioenwet, zoals dit artikel
      luidde voor 1 januari 1996.

      2 Het in het eerste lid bedoelde gecorrigeerd ambtelijk inkomen is het ambtelijk inkomen, verhoogd met ambtelijke
      toelagen of toeslagen, die op grond van [artikel 6, eerste lid, van de Coördinatiewet Sociale Verzekering][ref3]
      niet zijn uitgezonderd, verminderd met het werknemersdeel van de pensioenpremie en zo nodig verminderd tot het
      maximumbedrag, bedoeld in [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref4].

      3 Bij de vaststelling van het individuele werkgeversrisicopercentage, bedoeld in
      [artikel 4, tweede lid][ref5], van werkgevers van overheidswerknemers als bedoeld in
      [artikel 1, onderdeel 1, onder ten 2° van de Wet overheidspersoneel onder de werknemersverzekeringen][ref6], wordt
      het premieplichtig loon voor wat betreft de jaren 1993 en 1994 bepaald aan de hand van de verhouding tussen de
      pensioengrondslag en het premieplichtig loon over 1995. Onder de pensioengrondslag, bedoeld in de eerste zin, wordt
      verstaan, de pensioengrondslag, bedoeld in artikel C1 van de Algemene Militaire Pensioenwet.

      4 Voor de toepassing van het derde lid, wordt als premieplichtig loon in de jaren 1993 en 1994 aangemerkt,
      110% van de pensioengrondslag in die jaren, zo nodig verminderd tot het maximumbedrag, bedoeld in
      [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref7].

      5 Bij de vaststelling van het individuele werkgeversrisicopercentage, bedoeld in
      [artikel 4, tweede lid][ref8], van werkgevers van overheidswerknemers als bedoeld in
      [artikel 1, onderdeel 1, onder ten 2° van de Wet overheidspersoneel onder de werknemersverzekeringen][ref9],
      worden voor de jaren 1996 en 1997 de arbeidsongeschiktheidsuitkeringen, bedoeld in [artikel 4, tweede lid][ref10],
      bepaald als 85% van de aan de beroepsmilitair toegekende pensioenen terzake van arbeidsongeschiktheid als bedoeld
      in artikel E6 van de Algemene militaire pensioenwet, met inachtneming van de eventuele verhoging en bijzondere
      verhoging op grond van artikel E7, E8 of E9 van laatstgenoemde wet.


