---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_premiedifferentiatie_wao
regulatory_layer: AMVB
publication_date: '2010-12-29'
valid_from: '2006-01-01'
bwb_id: BWBR0008844
url: https://wetten.overheid.nl/BWBR0008844/2006-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 29 november 1996, Directie
    Sociale Verzekeringen, Nr. SV/WV/96/4867a;

    Gelet op artikel 78, zesde lid, van de Wet op de arbeidsongeschiktheidsverzekering;

    De Raad van State gehoord (advies van 11 februari 1997, nr. W12.96.0569);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 10 juli 1997, Directie
    Sociale Verzekeringen, Nr. SV/WV/97/2689;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel1
  - number: 1.1.a
    text: |-
      Wet: de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 1.1.b
    text: |-
      Arbeidsongeschiktheidskas: de Arbeidsongeschiktheidskas, bedoeld in [artikel 73 van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel73
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '73'
  - number: 1.1.c
    text: |-
      premieplichtig loon: het loon waarover op grond van [artikel 78, eerste lid, van de Wet][ref1], met toepassing van
      [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref2], premie wordt geheven;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '78'
      - id: ref2
        bwb_id: BWBR0002126
        artikel: '9'
  - number: 1.1.d
    text: |-
      premiejaar: het kalenderjaar waarin de in [artikel 78, eerste lid, van de Wet][ref1], bedoelde gedifferentieerde
      premie wordt geheven;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '78'
  - number: 1.1.e
    text: |-
      kleine werkgever: een werkgever te wiens laste, in het tweede kalenderjaar dat aan het premiejaar vooraf is gegaan,
      een premieplichtig loon is gekomen dat gelijk is aan of minder bedraagt dan 25 maal het gemiddelde premieplichtige
      loon per werknemer in dat kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel1
  - number: 1.1.f
    text: |-
      grote werkgever: een werkgever te wiens laste, in het tweede kalenderjaar dat aan het premiejaar vooraf is gegaan,
      een premieplichtig loon is gekomen dat meer bedraagt dan 25 maal het gemiddelde premieplichtige loon per werknemer
      in dat kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel1
  - number: 1.1.g
    text: |-
      Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 1.1.h
    text: |-
      minimumpremie: de gedifferentieerde premie, bedoeld in [artikel 9][ref1], die een werkgever ten minste verschuldigd
      is;


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel9
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '9'
  - number: 1.1.i
    text: |-
      maximumpremie: de gedifferentieerde premie, bedoeld in [artikel 9][ref1], die een werkgever ten hoogste
      verschuldigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel9
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '9'
  - number: 1.1.j
    text: |-
      sector: een sector als bedoeld in [artikel 97k van de Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97k
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97k
  - number: '1.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag van een werkgever vaststellen, dat hij voor
      het premiejaar wordt ingedeeld in afwijking van het eerste lid, onderdeel *e*, of het eerste lid, onderdeel*f*,
      indien uit door die werkgever bij de aanvraag verstrekte gegevens blijkt, dat als vaststaand mag worden
      aangenomen, dat het in het premiejaar ten laste van die werkgever komende premieplichtige loon tenminste 25% zal
      afwijken van 25 maal het gemiddelde premieplichtige loon per werknemer in het tweede kalenderjaar dat aan het
      premiejaar vooraf is gegaan en de omvang van het verwachte premieplichtige loon leidt tot een andere indeling.
      Een aanvraag als bedoeld in de eerste zin wordt ingediend uiterlijk 6 weken nadat de werkgever schriftelijk
      in kennis is gesteld van de door hem in het premiejaar verschuldigde gedifferentieerde premie, bedoeld in
      [artikel 78, eerste lid, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '78'
  - number: '1.3'
    text: |-
      Het gemiddelde premieplichtige loon, bedoeld in het eerste lid, onderdelen *e* en *f*, wordt vastgesteld door het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel1
  - number: '1.4'
    text: |-
      Bij de vaststelling van het ten laste van een werkgever komende premieplichtige loon, bedoeld in het eerste lid,
      onderdelen *e* en *f*, worden de via de werkgever betaalde arbeidsongeschiktheidsuitkeringen buiten aanmerking
      gelaten.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel1
  - number: '2.1'
    text: |-
      Het rekenpercentage, bedoeld in artikel 78, tweede lid, onder *a*, van de Wet, is gelijk aan het gemiddelde
      percentage, bedoeld in artikel 78, tweede lid, onder *b*, van de Wet vermeerderd of verminderd met:
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel2
  - number: 2.1.a
    text: |-
      een percentage ter compensatie van het naar verwachting over het premiejaar optredende verschil tussen de
      premieinkomsten die worden verkregen indien de in artikel 78, eerste lid, van de Wet, bedoelde premie wordt
      gebaseerd op het gemiddelde percentage bedoeld in artikel 78, tweede lid, onder *b*, van de Wet, en het
      totaalbedrag van de naar verwachting in het premiejaar ten laste van de Arbeidsongeschiktheidskas komende
      arbeidsongeschiktheidsuitkeringen, bedoeld in artikel 76*f* van de Wet, alsmede de op grond van enige wet over
      deze uitkeringen door het Uitvoeringsinstituut werknemersverzekeringen verschuldigde premies die niet op deze
      uitkeringen in mindering kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel2
  - number: 2.1.b
    text: |-
      een percentage, voorzover dit nodig of mogelijk is, rekening houdend met de verplichting, bedoeld in artikel 73 van
      de Wet, betreffende het vormen en in stand houden van een voldoende reserve in de Arbeidsongeschiktheidskas.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het in het eerste lid, onderdeel *a* en onderdeel *b*, bedoelde percentage wordt naar beneden afgerond op twee
      cijfers achter de komma.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het gemiddelde percentage, bedoeld in artikel 78, tweede lid, onder *b*, van de Wet, wordt vastgesteld door het
      totaalbedrag van hetgeen in het premiejaar naar verwachting ten laste komt van de Arbeidsongeschiktheidskas,
      bedoeld in artikel 76*f* van de Wet, verminderd met hetgeen naar verwachting op grond van onderdeel *b*
      tot en met *g* van artikel 76*e* van de Wet in het premiejaar naar verwachting ten gunste komt van de
      Arbeidsongeschiktheidskas, te vermenigvuldigen met honderd en de uitkomst van deze berekening te delen door het
      totaalbedrag van de over het premiejaar verwachte premieplichtige loonsom en de naar verwachting in dat jaar te
      betalen uitkeringen als bedoeld in artikel 78, zevende lid, van de Wet. Onder uitkeringen als bedoeld in de eerste
      zin, worden niet verstaan de arbeidsongeschiktheidsuitkeringen op grond van de Wet, waarvan het risico van de
      betaling wordt gedragen door een werkgever als bedoeld in artikel 75 van de Wet.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel3
  - number: '3.2'
    text: De uitkomst van de in het eerste lid bedoelde deling wordt naar beneden afgerond op twee cijfers achter de komma.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel3
  - number: '4.1'
    text: |-
      De in [artikel 78, derde lid, van de Wet][ref1], bedoelde opslag of korting is voor een grote werkgever gelijk aan
      het individuele werkgeversrisicopercentage, verminderd met het gemiddelde werkgeversrisicopercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '78'
  - number: '4.2'
    text: |-
      Het individuele werkgeversrisicopercentage, bedoeld in het eerste lid, wordt verkregen door het totaalbedrag
      van de ten laste van de Arbeidsongeschiktheidskas komende arbeidsongeschiktheidsuitkeringen, bedoeld in
      [artikel 76][ref1], die in het tweede kalenderjaar vóór het premiejaar zijn betaald aan werknemers die bij het
      intreden van de arbeidsongeschiktheid als bedoeld in het vijfde lid, in dienstbetrekking stonden tot een werkgever,
      te vermenigvuldigen met honderd en de uitkomst van deze berekening te delen door het ten laste van die werkgever
      komende gemiddelde premieplichtige loon per jaar, berekend over het tijdvak van vijf kalenderjaren, eindigend één
      jaar voor aanvang van het premiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '76'
  - number: '4.3'
    text: |-
      Het gemiddelde werkgeversrisicopercentage, bedoeld in het eerste lid, wordt verkregen door het totaalbedrag van de
      ten laste van de Arbeidsongeschiktheidskas komende aan werkgevers toe te rekenen arbeidsongeschiktheidsuitkeringen,
      bedoeld in [artikel 76][ref1], die in het tweede kalenderjaar vóór het premiejaar zijn betaald, te vermenigvuldigen
      met honderd en de uitkomst van deze berekening te delen door het totale gemiddelde premieplichtige loon per jaar,
      berekend over het tijdvak van vijf kalenderjaren, eindigend één jaar voor aanvang van het premiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '76'
  - number: '4.4'
    text: |-
      Bij de berekening van het gemiddelde premieplichtige loon, bedoeld in het tweede en derde lid, worden de via de
      werkgever betaalde arbeidsongeschiktheidsuitkeringen buiten aanmerking gelaten.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4
  - number: '4.5'
    text: |-
      De in het tweede en derde lid bedoelde arbeidsongeschiktheidsuitkeringen, betreffen de
      arbeidsongeschiktheidsuitkeringen die zijn toegekend:
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4
  - number: 4.5.a
    text: |-
      aan de werknemers die op de eerste dag van de ongeschiktheid tot het verrichten van hun arbeid als bedoeld in
      [artikel 19 van de Ziektewet][ref1] tot de werkgever in dienstbetrekking stonden en terzake van die ongeschiktheid
      de wachttijd, bedoeld in [artikel 19 van de Wet][ref2] hebben doorgemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '19'
  - number: 4.5.b
    text: |-
      met toepassing van [artikel 43][ref1] nadat de arbeidsongeschiktheidsuitkering toegekend aan de werknemer, bedoeld
      in onderdeel *a*, is ingetrokken op grond van [artikel 43, eerste lid, van de Wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '43'
  - number: 4.5.c
    text: |-
      met toepassing van [artikel 43][ref1] aan de werknemer, bedoeld in onderdeel *a*, die aan het einde van de
      wachttijd ongeschikt was tot het verrichten van zijn arbeid wegens ziekte of gebreken, maar geen recht had op
      toekenning van arbeidsongeschiktheidsuitkering omdat hij niet arbeidsongeschikt was.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
  - number: '4.6'
    text: |-
      Indien de werknemer bij het intreden van de arbeidsongeschiktheid, bedoeld in het vijfde lid, onderdeel
      *a*, bij meer dan één werkgever in dienstbetrekking stond, wordt voor de toepassing van het tweede lid, de
      arbeidsongeschiktheidsuitkering naar rato van de loonsom toegerekend aan de werkgevers waarbij de werknemer in
      dienstbetrekking staat of heeft gestaan. De arbeidsongeschiktheidsuitkering wordt niet toegerekend aan de werkgever
      waarbij de werknemer met behoud van hetzelfde loon arbeid is blijven verrichten.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4
  - number: '4.7'
    text: |-
      Voor de toepassing van het tweede en derde lid worden de door het Uitvoeringsinstituut werknemersverzekeringen
      toegekende arbeidsongeschiktheidsuitkeringen en de vakantieuitkeringen die in de in de aanhef van
      [artikel 76][ref1] bedoelde periode geheel of ten dele niet aan de werknemer zijn uitbetaald wegens het genieten
      van loon als bedoeld in [artikel 44, derde lid, van de Wet][ref2], geacht aan de werknemer te zijn uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '76'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '44'
  - number: '4.8'
    text: |-
      De uitkomst van de in het tweede en derde lid bedoelde deling wordt naar beneden afgerond op twee cijfers achter
      de komma.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4
  - number: 4a.1
    text: |-
      De in [artikel 78, derde lid, van de Wet][ref1], bedoelde opslag of korting is voor alle kleine werkgevers in
      een sector gelijk aan het sectorpercentage, bedoeld in het tweede lid, verminderd met het gemiddelde percentage,
      bedoeld in artikel 3, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '78'
  - number: 4a.2
    text: |-
      Het sectorpercentage is de uitkomst van de volgende berekening:





                    (A – B) x 100




                    —————–




                    C




           waarbij: 'A staat voor: het totaalbedrag van de arbeidsongeschiktheidsuitkeringen die in het premiejaar'
      naar verwachting ten laste komen van de Arbeidsongeschiktheidskas, voorzover die kunnen worden toegerekend aan
      de gezamenlijke kleine werkgevers in de sector, en een evenredig deel van hetgeen overigens in het premiejaar
      naar verwachting ten laste komt van de Arbeidsongeschiktheidskas; B staat voor: een evenredig deel van hetgeen,
      met uitzondering van de gedifferentieerde premie, naar verwachting op grond van artikel 76e van de Wet in het
      premiejaar ten gunste komt van de Arbeidsongeschiktheidskas; C staat voor: het totaalbedrag van de over het
      premiejaar verwachte premieplichtige loonsom ten laste van de gezamenlijke kleine werkgevers in de sector die geen
      eigenrisiscodrager zijn.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4a
  - number: 4a.3
    text: De uitkomst van de in het tweede lid bedoelde deling wordt naar beneden afgerond op twee cijfers achter de komma.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4a
  - number: 4a.4
    text: |-
      Indien het totaalbedrag van de over het premiejaar verwachte premieplichtige loonsom ten laste van de
      gezamenlijke kleine werkgevers in een sector, die geen eigenrisicodrager zijn, gelijk is aan of minder
      bedraagt dan 25 maal het gemiddelde premieplichtig loon per werknemer in het premiejaar, wordt de in
      [artikel 78, derde lid, van de Wet][ref1] bedoelde opslag of korting voor die kleine werkgevers bepaald op nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '78'
  - number: '5.1'
    text: |-
      In geval van overgang van een onderneming in de zin van [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1],
      alsmede in geval van een dergelijke overgang bij faillissement, worden bij de toepassing van [artikel 4][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
      [ref2]: https://wetten.overheid.nl/BWBR0008844#Artikel4
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
      - id: ref2
        bwb_id: BWBR0008844
        artikel: '4'
  - number: 5.1.a
    text: |-
      de arbeidsongeschiktheidsuitkeringen, bedoeld in [artikel 4, vijfde lid][ref1], die zijn of worden toegekend aan de
      werknemer die op de eerste dag van de ongeschiktheid tot het verrichten van zijn arbeid in dienstbetrekking stond
      tot de werkgever die de onderneming heeft overgedragen, toegerekend aan de werkgever die de onderneming verkrijgt;
      en


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel4
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '4'
  - number: 5.1.b
    text: |-
      wordt het ten laste van de werkgever die de onderneming heeft overgedragen gekomen premieplichtig loon in enig
      kalenderjaar telkens opgeteld bij het premieplichtig loon in dat kalenderjaar van de werkgever die de onderneming
      verkrijgt, voordat het gemiddelde premieplichtig loon van laatstgenoemde werkgever wordt berekend.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel5
  - number: '5.2'
    text: |-
      Indien slechts een deel van de onderneming overgaat, vindt het eerste lid toepassing naar rato van het deel van
      de loonsom dat het overgegane deel van de onderneming deel uitmaakte van de gehele onderneming in het kalenderjaar
      voorafgaande aan dat van overgang.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel5
  - number: '5.3'
    text: |-
      Tenzij de overgang, bedoeld in het eerste lid, plaatsvindt op 1 januari van het kalenderjaar vindt voor de
      werkgever die reeds de hoedanigheid van werkgever had voor het moment van overgang van de onderneming de
      toerekening, bedoeld in het eerste lid, onderdeel a, en de optelling, bedoeld in het eerste lid, onderdeel b,
      eerst plaats met ingang van het kalenderjaar volgend op het kalenderjaar waarin de onderneming of een deel van de
      onderneming is overgedragen.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel5
  - number: '6.1'
    text: |-
      Indien blijkt dat een in [artikel 4, tweede lid][ref1], bedoelde arbeidsongeschiktheidsuitkering geheel of ten
      dele ten onrechte is toegekend, wordt bij de berekening van het individuele werkgeversrisico-percentage in het
      kalenderjaar waarin het besluit tot toekenning van de arbeidsongeschiktheidsuitkering wordt ingetrokken of herzien,
      het in [artikel 4, tweede lid][ref2], bedoelde totaalbedrag verminderd met een bedrag dat gelijk is aan het bedrag
      van de te veel betaalde arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008844#Artikel4
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008844
        artikel: '4'
  - number: '6.2'
    text: |-
      Indien de in [artikel 107a, tweede lid, van Boek 6 van het Burgerlijk Wetboek][ref1] bedoelde schadevergoeding is
      ontvangen, wordt, op verzoek van de werkgever, bij de berekening van het individuele werkgeversrisicopercentage met
      ingang van het kalenderjaar waarin de schadevergoeding is ontvangen, gedurende een tijdvak van vier jaren, het in
      [artikel 4, tweede lid][ref2], bedoelde totaalbedrag verminderd met een compensatiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel107a
      [ref2]: https://wetten.overheid.nl/BWBR0008844#Artikel4
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 107a
      - id: ref2
        bwb_id: BWBR0008844
        artikel: '4'
  - number: '6.3'
    text: |-
      Het in het tweede lid bedoelde compensatiebedrag wordt vastgesteld door het bedrag van de
      arbeidsongeschiktheidsuitkering aan de betrokken werknemer jaarlijks gedurende vier jaar te vermenigvuldigen met
      een getal dat is verkregen door het bedrag van de in het tweede lid bedoelde schadevergoeding te delen door het loon
      over het tijdvak van 104 weken, bedoeld in [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1].
      Het getal bedoeld in de eerste zin bedraagt niet meer dan 1.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
  - number: '6.4'
    text: |-
      In afwijking van het derde lid wordt in de gevallen waarin ziekengeld wordt uitgekeerd aan de verzekerde,
      bedoeld in [artikel 29 van de Ziektewet][ref1], het in het tweede lid bedoelde compensatiebedrag vastgesteld
      door het bedrag van de arbeidsongeschiktheidsuitkering aan de betrokken werknemer te vermenigvuldigen
      met een getal dat is verkregen door het bedrag van het ontvangen verhaal dat is verkregen op grond
      van [artikel 52a van de Ziektewet][ref2] te delen door het aan betrokken werknemer op grond van de
      [Ziektewet][ref3]uitgekeerde ziekengeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel52a
      [ref3]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 52a
      - id: ref3
        bwb_id: BWBR0001888
  - number: '6.5'
    text: |-
      De uitkomst van de in het derde en vierde lid bedoelde berekening wordt naar beneden afgerond op twee cijfers
      achter de komma.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel6
  - number: '7.1'
    text: |-
      Indien een grote werkgever, zonder dat er sprake is van een overgang van een onderneming als bedoeld in
      [artikel 5][ref1], in één of meer van de kalenderjaren van het in [artikel 4, tweede lid][ref2], bedoelde tijdvak,
      niet de hoedanigheid van werkgever had, wordt bij de berekening van het individuele werkgeversrisicopercentage,
      bedoeld in [artikel 4, tweede lid][ref3], het ten laste van die grote werkgever komende gemiddelde premieplichtige
      loon per jaar berekend over het aantal kalenderjaren in het in [artikel 4, tweede lid][ref4], bedoelde tijdvak,
      waarin de grote werkgever de hoedanigheid van werkgever had, waarna het verkregen percentage wordt vermenigvuldigd
      met een breuk, waarvan de teller wordt gevormd door het gemiddelde werkgeversrisicopercentage, bedoeld in
      [artikel 4, derde lid][ref5], en de noemer door het gemiddelde werkgeversrisicopercentage, berekend over het aantal
      kalenderjaren in het in [artikel 4, derde lid][ref6], bedoelde tijdvak, waarin de grote werkgever de hoedanigheid
      van werkgever had.


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008844#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008844#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0008844#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0008844#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0008844#Artikel4
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008844
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0008844
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0008844
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0008844
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0008844
        artikel: '4'
  - number: '7.2'
    text: |-
      De uitkomst van de in het eerste lid, bedoelde berekening wordt naar beneden afgerond op twee cijfers achter de
      komma.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel7
  - number: '8.1'
    text: |-
      Voor een grote werkgever die, zonder dat er sprake is van een overgang van een onderneming als bedoeld
      in [artikel 5][ref1], eerst in het premiejaar, of in het eerste of tweede kalenderjaar onmiddellijk
      voorafgaande aan het premiejaar, de hoedanigheid van werkgever heeft verkregen, is het percentage van de in
      [artikel 78, eerste lid, van de Wet][ref2], bedoelde gedifferentieerde premie gelijk aan het percentage, bedoeld in
      [artikel 78, tweede lid, onderdeel a, van de Wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '78'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '78'
  - number: '8.2'
    text: |-
      Het eerste lid is niet van toepassing op de werkgever die in het tijdvak, bedoeld in [artikel 4, tweede lid][ref1],
      reeds werkgever was.


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel4
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '4'
  - number: '8.3'
    text: |-
      [Artikel 7][ref1] is niet van toepassing op een werkgever als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel7
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '7'
  - number: '9.1'
    text: |-
      De gedifferentieerde premie, bedoeld in [artikel 78, eerste lid, van de Wet][ref1] bedraagt ten minste nihil, en
      ten hoogste vier maal het gemiddelde percentage, bedoeld in [artikel 78, tweede lid onder b, van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '78'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '78'
  - number: '9.2'
    text: |-
      In afwijking van het eerste lid wordt voor een grote werkgever een premiepercentage vastgesteld lager dan nihil
      indien toepassing van [artikel 6][ref1] daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel6
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '6'
  - number: '9.3'
    text: Het in het tweede lid bedoelde percentage wordt naar beneden afgerond op twee cijfers achter de komma.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel9
  - number: '10.1'
    text: |-
      Voor de toepassing van [artikel 4, tweede en derde lid][ref1], wordt een arbeidsongeschiktheidsuitkering
      die is ingegaan op of na 1 januari 1993 gelijkgesteld met een arbeidsongeschiktheidsuitkering als bedoeld in
      [artikel 76f van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel76f
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 76f
  - number: '10.2'
    text: |-
      Het gemiddelde premieplichtige loon en het totale gemiddelde premieplichtige loon, bedoeld in
      [artikel 4, tweede en derde lid][ref1], worden voor het premiejaar 1998 berekend over het tijdvak van vier
      kalenderjaren, eindigend één jaar voor aanvang van het premiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel4
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '4'
  - number: '10.3'
    text: |-
      Voor de premiejaren 1998, 1999, 2000, 2001, 2002 en 2003 wordt bij de berekening van het gemiddelde premieplichtige
      loon, bedoeld in [artikel 4, tweede en derde lid][ref1], het vierde lid van [artikel 4][ref2] buiten toepassing
      gelaten en worden de op grond van [artikel 4][ref3] berekende opslagen en kortingen vermenigvuldigd met een
      breuk, waarvan de teller wordt gevormd door het gemiddelde werkgeversrisicopercentage over de periode van
      respectievelijk één, twee, drie, vier en vijf jaar, te rekenen vanaf het jaar 1996 en de noemer door het gemiddelde
      werkgeversrisicopercentage, bedoeld in [artikel 4, derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008844#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008844#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0008844#Artikel4
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008844
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0008844
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0008844
        artikel: '4'
  - number: '10.4'
    text: |-
      De uitkomst van de in het derde lid bedoelde berekening wordt naar beneden afgerond op twee cijfers achter de
      komma.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel10
  - number: '10.5'
    text: |-
      Onder arbeidsongeschiktheidsuitkering als bedoeld in [artikel 4, zesde lid][ref1], wordt uitsluitend verstaan, de
      arbeidsongeschiktheidsuitkering die is ingegaan op of na de dag van inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel4
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '4'
  - number: '10.6'
    text: |-
      De [artikelen 4a][ref1] en [4b][ref2] zoals deze luiden op 31 december 2002 zijn niet van toepassing op
      arbeidsongeschiktheidsuitkeringen die zijn ingegaan vóór 1 januari 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0008844#Artikel4b
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0008844
        artikel: 4b
  - number: '10.7'
    text: |-
      Een besluit tot intrekking of herziening van een besluit tot toekenning van een arbeidsongeschiktheidsuitkering,
      wordt voor de toepassing van [artikel 6][ref1] slechts in aanmerking genomen indien het besluit op of na de dag van
      inwerkingtreding van dit besluit is getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel6
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '6'
  - number: '10.8'
    text: |-
      [Artikel 6, tweede, derde en vierde lid][ref1], is uitsluitend van toepassing in die gevallen waarin de
      arbeidsongeschiktheidsuitkering van de verzekerde ingaat op of na 1 januari 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel6
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '6'
  - number: '10.9'
    text: |-
      Bij de toepassing van [artikel 6, tweede en derde lid][ref1], wordt, indien ten aanzien van de
      arbeidsongeschiktheidsuitkering van de betrokken werknemer [artikel 76f van de Wet][ref2] van toepassing is,
      zoals dit artikel luidde op 31 december 2003, voor «vier jaren» respectievelijk «vier jaar» gelezen «vijf jaren»
      respectievelijk «vijf jaar».


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel76f
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 76f
  - number: '10.10'
    text: |-
      Bij de toepassing van [artikel 6, derde lid][ref1], wordt, indien ten aanzien van de
      arbeidsongeschiktheidsuitkering van de betrokken werknemer [artikel 76f van de Wet][ref2] van toepassing is, zoals
      dit artikel luidde op 31 december 2003, voor «het tijdvak van 104 weken» gelezen: het tijdvak van 52 weken.


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel76f
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 76f
  - number: '10.11'
    text: |-
      Voor het premiejaar 2006 worden de op grond van [artikel 4][ref1] berekende opslagen en kortingen vermenigvuldigd
      met een breuk, waarvan de teller wordt gevormd door het rekenpercentage, bedoeld in [artikel 2][ref2], en de noemer
      door het gemiddelde werkgeversrisicopercentage, bedoeld in [artikel 4, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008844#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008844#Artikel4
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008844
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0008844
        artikel: '4'
  - number: '11.1'
    text: |-
      Bij de vaststelling van het individuele werkgeversrisicopercentage, bedoeld in
      [artikel 4, tweede lid][ref1], van werkgevers van overheidswerknemers als bedoeld in
      __REF001___________________________________________________________________________________________________________
      ____________, wordt het premieplichtig loon voor wat betreft de jaren 1993 tot en met 1995 bepaald aan de hand van
      het gecorrigeerd ambtelijk inkomen over die jaren. Onder het ambtelijk inkomen, bedoeld in de eerste zin, wordt
      verstaan, het ambtelijk inkomen, bedoeld in artikel C1 van de Algemene burgerlijke pensioenwet, zoals dit artikel
      luidde voor 1 januari 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009267
        artikel: '1'
  - number: '11.2'
    text: |-
      Het in het eerste lid bedoelde gecorrigeerd ambtelijk inkomen is het ambtelijk inkomen, verhoogd met ambtelijke
      toelagen of toeslagen, die op grond van [artikel 6, eerste lid, van de Coördinatiewet Sociale Verzekering][ref1]
      niet zijn uitgezonderd, verminderd met het werknemersdeel van de pensioenpremie en zo nodig verminderd tot het
      maximumbedrag, bedoeld in [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002126
        artikel: '9'
  - number: '11.3'
    text: |-
      Bij de vaststelling van het individuele werkgeversrisicopercentage, bedoeld in
      [artikel 4, tweede lid][ref1], van werkgevers van overheidswerknemers als bedoeld in
      [artikel 1, onderdeel 1, onder ten 2° van de Wet overheidspersoneel onder de werknemersverzekeringen][ref2], wordt
      het premieplichtig loon voor wat betreft de jaren 1993 en 1994 bepaald aan de hand van de verhouding tussen de
      pensioengrondslag en het premieplichtig loon over 1995. Onder de pensioengrondslag, bedoeld in de eerste zin, wordt
      verstaan, de pensioengrondslag, bedoeld in artikel C1 van de Algemene Militaire Pensioenwet.


      [ref1]: https://wetten.overheid.nl/BWBR0008844#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008844
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009267
        artikel: '1'
  - number: '11.4'
    text: |-
      Voor de toepassing van het derde lid, wordt als premieplichtig loon in de jaren 1993 en 1994 aangemerkt,
      110% van de pensioengrondslag in die jaren, zo nodig verminderd tot het maximumbedrag, bedoeld in
      [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '9'
  - number: '11.5'
    text: |-
      Bij de vaststelling van het individuele werkgeversrisicopercentage, bedoeld in
      [artikel 4, tweede lid][ref1], van werkgevers van overheidswerknemers als bedoeld in
      [artikel 1, onderdeel 1, onder ten 2° van de Wet overheidspersoneel onder de werknemersverzekeringen][ref2],
      worden voor de jaren 1996 en 1997 de arbeidsongeschiktheidsuitkeringen, bedoeld in [artikel 4, tweede lid][ref3],
      bepaald als 85% van de aan de beroepsmilitair toegekende pensioenen terzake van arbeidsongeschiktheid als bedoeld
      in artikel E6 van de Algemene militaire pensioenwet, met inachtneming van de eventuele verhoging en bijzondere
      verhoging op grond van artikel E7, E8 of E9 van laatstgenoemde wet.


