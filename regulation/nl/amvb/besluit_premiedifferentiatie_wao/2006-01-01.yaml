  - number: '5'
    text: |-
      1 In geval van overgang van een onderneming in de zin van [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1],
      alsmede in geval van een dergelijke overgang bij faillissement, worden bij de toepassing van [artikel 4][ref2]:

      a. de arbeidsongeschiktheidsuitkeringen, bedoeld in [artikel 4, vijfde lid][ref3], die zijn of worden toegekend
      aan de werknemer die op de eerste dag van de ongeschiktheid tot het verrichten van zijn arbeid in dienstbetrekking
      stond tot de werkgever die de onderneming heeft overgedragen, toegerekend aan de werkgever die de onderneming
      verkrijgt; en

      b. wordt het ten laste van de werkgever die de onderneming heeft overgedragen gekomen premieplichtig loon in enig
      kalenderjaar telkens opgeteld bij het premieplichtig loon in dat kalenderjaar van de werkgever die de onderneming
      verkrijgt, voordat het gemiddelde premieplichtig loon van laatstgenoemde werkgever wordt berekend.

      2 Indien slechts een deel van de onderneming overgaat, vindt het eerste lid toepassing naar rato van het deel van
      de loonsom dat het overgegane deel van de onderneming deel uitmaakte van de gehele onderneming in het kalenderjaar
      voorafgaande aan dat van overgang.

      3 Tenzij de overgang, bedoeld in het eerste lid, plaatsvindt op 1 januari van het kalenderjaar vindt voor
      de werkgever die reeds de hoedanigheid van werkgever had voor het moment van overgang van de onderneming de
      toerekening, bedoeld in het eerste lid, onderdeel a, en de optelling, bedoeld in het eerste lid, onderdeel b,
      eerst plaats met ingang van het kalenderjaar volgend op het kalenderjaar waarin de onderneming of een deel van de
      onderneming is overgedragen.


