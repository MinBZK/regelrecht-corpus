  - number: '10'
    text: |-
      1 Voor de toepassing van [artikel 4, tweede en derde lid][ref1], wordt een arbeidsongeschiktheidsuitkering
      die is ingegaan op of na 1 januari 1993 gelijkgesteld met een arbeidsongeschiktheidsuitkering als bedoeld in
      [artikel 76f van de Wet][ref2].

      2 Het gemiddelde premieplichtige loon en het totale gemiddelde premieplichtige loon, bedoeld in
      [artikel 4, tweede en derde lid][ref3], worden voor het premiejaar 1998 berekend over het tijdvak van vier
      kalenderjaren, eindigend één jaar voor aanvang van het premiejaar.

      3 Voor de premiejaren 1998, 1999, 2000, 2001, 2002 en 2003 wordt bij de berekening van het gemiddelde
      premieplichtige loon, bedoeld in [artikel 4, tweede en derde lid][ref4], het vierde lid van [artikel 4][ref5]
      buiten toepassing gelaten en worden de op grond van [artikel 4][ref6] berekende opslagen en kortingen
      vermenigvuldigd met een breuk, waarvan de teller wordt gevormd door het gemiddelde werkgeversrisicopercentage over
      de periode van respectievelijk één, twee, drie, vier en vijf jaar, te rekenen vanaf het jaar 1996 en de noemer door
      het gemiddelde werkgeversrisicopercentage, bedoeld in [artikel 4, derde lid][ref7].

      4 De uitkomst van de in het derde lid bedoelde berekening wordt naar beneden afgerond op twee cijfers achter de
      komma.

      5 Onder arbeidsongeschiktheidsuitkering als bedoeld in [artikel 4, zesde lid][ref8], wordt uitsluitend verstaan, de
      arbeidsongeschiktheidsuitkering die is ingegaan op of na de dag van inwerkingtreding van dit besluit.

      6 De [artikelen 4a][ref9] en [4b][ref10] zoals deze luiden op 31 december 2002 zijn niet van toepassing op
      arbeidsongeschiktheidsuitkeringen die zijn ingegaan vóór 1 januari 1998.

      7 Een besluit tot intrekking of herziening van een besluit tot toekenning van een arbeidsongeschiktheidsuitkering,
      wordt voor de toepassing van [artikel 6][ref11] slechts in aanmerking genomen indien het besluit op of na de dag
      van inwerkingtreding van dit besluit is getroffen.

      8 [Artikel 6, tweede, derde en vierde lid][ref12], is uitsluitend van toepassing in die gevallen waarin de
      arbeidsongeschiktheidsuitkering van de verzekerde ingaat op of na 1 januari 2002.

      9 Bij de toepassing van [artikel 6, tweede en derde lid][ref13], wordt, indien ten aanzien van de
      arbeidsongeschiktheidsuitkering van de betrokken werknemer [artikel 76f van de Wet][ref14] van toepassing is,
      zoals dit artikel luidde op 31 december 2003, voor «vier jaren» respectievelijk «vier jaar» gelezen «vijf jaren»
      respectievelijk «vijf jaar».

      10 Bij de toepassing van [artikel 6, derde lid][ref15], wordt, indien ten aanzien van de
      arbeidsongeschiktheidsuitkering van de betrokken werknemer [artikel 76f van de Wet][ref16] van toepassing is, zoals
      dit artikel luidde op 31 december 2003, voor «het tijdvak van 104 weken» gelezen: het tijdvak van 52 weken.

      11 Voor het premiejaar 2006 worden de op grond van [artikel 4][ref17] berekende opslagen en kortingen
      vermenigvuldigd met een breuk, waarvan de teller wordt gevormd door het rekenpercentage, bedoeld
      in [artikel 2][ref18], en de noemer door het gemiddelde werkgeversrisicopercentage, bedoeld in
      [artikel 4, derde lid][ref19].


