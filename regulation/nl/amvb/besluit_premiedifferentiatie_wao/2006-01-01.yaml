  - number: '2'
    text: |-
      1 Het rekenpercentage, bedoeld in artikel 78, tweede lid, onder *a*, van de Wet, is gelijk aan het gemiddelde
      percentage, bedoeld in artikel 78, tweede lid, onder *b*, van de Wet vermeerderd of verminderd met:

      a. een percentage ter compensatie van het naar verwachting over het premiejaar optredende verschil tussen
      de premieinkomsten die worden verkregen indien de in artikel 78, eerste lid, van de Wet, bedoelde premie
      wordt gebaseerd op het gemiddelde percentage bedoeld in artikel 78, tweede lid, onder *b*, van de Wet, en
      het totaalbedrag van de naar verwachting in het premiejaar ten laste van de Arbeidsongeschiktheidskas komende
      arbeidsongeschiktheidsuitkeringen, bedoeld in artikel 76*f* van de Wet, alsmede de op grond van enige wet over
      deze uitkeringen door het Uitvoeringsinstituut werknemersverzekeringen verschuldigde premies die niet op deze
      uitkeringen in mindering kunnen worden gebracht;

      b. een percentage, voorzover dit nodig of mogelijk is, rekening houdend met de verplichting, bedoeld in artikel 73
      van de Wet, betreffende het vormen en in stand houden van een voldoende reserve in de Arbeidsongeschiktheidskas.

      2 Het in het eerste lid, onderdeel *a* en onderdeel *b*, bedoelde percentage wordt naar beneden afgerond op twee
      cijfers achter de komma.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het gemiddelde percentage, bedoeld in artikel 78, tweede lid, onder *b*, van de Wet, wordt vastgesteld door
      het totaalbedrag van hetgeen in het premiejaar naar verwachting ten laste komt van de Arbeidsongeschiktheidskas,
      bedoeld in artikel 76*f* van de Wet, verminderd met hetgeen naar verwachting op grond van onderdeel *b*
      tot en met *g* van artikel 76*e* van de Wet in het premiejaar naar verwachting ten gunste komt van de
      Arbeidsongeschiktheidskas, te vermenigvuldigen met honderd en de uitkomst van deze berekening te delen door het
      totaalbedrag van de over het premiejaar verwachte premieplichtige loonsom en de naar verwachting in dat jaar te
      betalen uitkeringen als bedoeld in artikel 78, zevende lid, van de Wet. Onder uitkeringen als bedoeld in de eerste
      zin, worden niet verstaan de arbeidsongeschiktheidsuitkeringen op grond van de Wet, waarvan het risico van de
      betaling wordt gedragen door een werkgever als bedoeld in artikel 75 van de Wet.

      2 De uitkomst van de in het eerste lid bedoelde deling wordt naar beneden afgerond op twee cijfers achter de komma.
    url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#Artikel3
  - number: '4'
    text: |-
      1 De in [artikel 78, derde lid, van de Wet][ref1], bedoelde opslag of korting is voor een grote werkgever gelijk
      aan het individuele werkgeversrisicopercentage, verminderd met het gemiddelde werkgeversrisicopercentage.

      2 Het individuele werkgeversrisicopercentage, bedoeld in het eerste lid, wordt verkregen door het totaalbedrag
      van de ten laste van de Arbeidsongeschiktheidskas komende arbeidsongeschiktheidsuitkeringen, bedoeld in
      [artikel 76][ref2], die in het tweede kalenderjaar vóór het premiejaar zijn betaald aan werknemers die bij het
      intreden van de arbeidsongeschiktheid als bedoeld in het vijfde lid, in dienstbetrekking stonden tot een werkgever,
      te vermenigvuldigen met honderd en de uitkomst van deze berekening te delen door het ten laste van die werkgever
      komende gemiddelde premieplichtige loon per jaar, berekend over het tijdvak van vijf kalenderjaren, eindigend één
      jaar voor aanvang van het premiejaar.

      3 Het gemiddelde werkgeversrisicopercentage, bedoeld in het eerste lid, wordt verkregen door het
      totaalbedrag van de ten laste van de Arbeidsongeschiktheidskas komende aan werkgevers toe te rekenen
      arbeidsongeschiktheidsuitkeringen, bedoeld in [artikel 76][ref3], die in het tweede kalenderjaar vóór het
      premiejaar zijn betaald, te vermenigvuldigen met honderd en de uitkomst van deze berekening te delen door het
      totale gemiddelde premieplichtige loon per jaar, berekend over het tijdvak van vijf kalenderjaren, eindigend één
      jaar voor aanvang van het premiejaar.

      4 Bij de berekening van het gemiddelde premieplichtige loon, bedoeld in het tweede en derde lid, worden de via de
      werkgever betaalde arbeidsongeschiktheidsuitkeringen buiten aanmerking gelaten.

      5 De in het tweede en derde lid bedoelde arbeidsongeschiktheidsuitkeringen, betreffen de
      arbeidsongeschiktheidsuitkeringen die zijn toegekend:

      a. aan de werknemers die op de eerste dag van de ongeschiktheid tot het verrichten van hun arbeid als bedoeld in
      [artikel 19 van de Ziektewet][ref4] tot de werkgever in dienstbetrekking stonden en terzake van die ongeschiktheid
      de wachttijd, bedoeld in [artikel 19 van de Wet][ref5] hebben doorgemaakt;

      b. met toepassing van [artikel 43][ref6] nadat de arbeidsongeschiktheidsuitkering toegekend aan de werknemer,
      bedoeld in onderdeel *a*, is ingetrokken op grond van [artikel 43, eerste lid, van de Wet][ref7];

      c. met toepassing van [artikel 43][ref8] aan de werknemer, bedoeld in onderdeel *a*, die aan het einde van de
      wachttijd ongeschikt was tot het verrichten van zijn arbeid wegens ziekte of gebreken, maar geen recht had op
      toekenning van arbeidsongeschiktheidsuitkering omdat hij niet arbeidsongeschikt was.

      6 Indien de werknemer bij het intreden van de arbeidsongeschiktheid, bedoeld in het vijfde lid, onderdeel
      *a*, bij meer dan één werkgever in dienstbetrekking stond, wordt voor de toepassing van het tweede lid, de
      arbeidsongeschiktheidsuitkering naar rato van de loonsom toegerekend aan de werkgevers waarbij de werknemer in
      dienstbetrekking staat of heeft gestaan. De arbeidsongeschiktheidsuitkering wordt niet toegerekend aan de werkgever
      waarbij de werknemer met behoud van hetzelfde loon arbeid is blijven verrichten.

      7 Voor de toepassing van het tweede en derde lid worden de door het Uitvoeringsinstituut werknemersverzekeringen
      toegekende arbeidsongeschiktheidsuitkeringen en de vakantieuitkeringen die in de in de aanhef van
      [artikel 76][ref9] bedoelde periode geheel of ten dele niet aan de werknemer zijn uitbetaald wegens het genieten
      van loon als bedoeld in [artikel 44, derde lid, van de Wet][ref10], geacht aan de werknemer te zijn uitbetaald.

      8 De uitkomst van de in het tweede en derde lid bedoelde deling wordt naar beneden afgerond op twee cijfers achter
      de komma.


