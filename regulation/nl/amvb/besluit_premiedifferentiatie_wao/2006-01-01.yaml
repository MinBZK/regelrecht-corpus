  - number: 4a
    text: |-
      1 De in [artikel 78, derde lid, van de Wet][ref1], bedoelde opslag of korting is voor alle kleine werkgevers in
      een sector gelijk aan het sectorpercentage, bedoeld in het tweede lid, verminderd met het gemiddelde percentage,
      bedoeld in artikel 3, eerste lid.

      2 Het sectorpercentage is de uitkomst van de volgende berekening:







                    (A – B) x 100




                    —————–




                    C






      waarbij:

      A staat voor: het totaalbedrag van de arbeidsongeschiktheidsuitkeringen die in het premiejaar naar verwachting ten
      laste komen van de Arbeidsongeschiktheidskas, voorzover die kunnen worden toegerekend aan de gezamenlijke kleine
      werkgevers in de sector, en een evenredig deel van hetgeen overigens in het premiejaar naar verwachting ten laste
      komt van de Arbeidsongeschiktheidskas;

      B staat voor: een evenredig deel van hetgeen, met uitzondering van de gedifferentieerde premie, naar verwachting op
      grond van artikel 76e van de Wet in het premiejaar ten gunste komt van de Arbeidsongeschiktheidskas;

      C staat voor: het totaalbedrag van de over het premiejaar verwachte premieplichtige loonsom ten laste van de
      gezamenlijke kleine werkgevers in de sector die geen eigenrisiscodrager zijn.

      3 De uitkomst van de in het tweede lid bedoelde deling wordt naar beneden afgerond op twee cijfers achter de komma.

      4 Indien het totaalbedrag van de over het premiejaar verwachte premieplichtige loonsom ten laste van de
      gezamenlijke kleine werkgevers in een sector, die geen eigenrisicodrager zijn, gelijk is aan of minder
      bedraagt dan 25 maal het gemiddelde premieplichtig loon per werknemer in het premiejaar, wordt de in
      [artikel 78, derde lid, van de Wet][ref2] bedoelde opslag of korting voor die kleine werkgevers bepaald op nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel78
