  - number: '9'
    text: |-
      1 De gedifferentieerde premie, bedoeld in [artikel 78, eerste lid, van de Wet][ref1] bedraagt ten minste nihil, en
      ten hoogste vier maal het gemiddelde percentage, bedoeld in [artikel 78, tweede lid onder b, van de Wet][ref2].

      2 In afwijking van het eerste lid wordt voor een grote werkgever een premiepercentage vastgesteld lager dan nihil
      indien toepassing van [artikel 6][ref3] daartoe aanleiding geeft.

      3 Het in het tweede lid bedoelde percentage wordt naar beneden afgerond op twee cijfers achter de komma.


