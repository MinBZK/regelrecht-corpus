  - number: '7'
    text: |-
      1 Indien een grote werkgever, zonder dat er sprake is van een overgang van een onderneming als bedoeld in
      [artikel 5][ref1], in één of meer van de kalenderjaren van het in [artikel 4, tweede lid][ref2], bedoelde tijdvak,
      niet de hoedanigheid van werkgever had, wordt bij de berekening van het individuele werkgeversrisicopercentage,
      bedoeld in [artikel 4, tweede lid][ref3], het ten laste van die grote werkgever komende gemiddelde premieplichtige
      loon per jaar berekend over het aantal kalenderjaren in het in [artikel 4, tweede lid][ref4], bedoelde tijdvak,
      waarin de grote werkgever de hoedanigheid van werkgever had, waarna het verkregen percentage wordt vermenigvuldigd
      met een breuk, waarvan de teller wordt gevormd door het gemiddelde werkgeversrisicopercentage, bedoeld in
      [artikel 4, derde lid][ref5], en de noemer door het gemiddelde werkgeversrisicopercentage, berekend over het aantal
      kalenderjaren in het in [artikel 4, derde lid][ref6], bedoelde tijdvak, waarin de grote werkgever de hoedanigheid
      van werkgever had.

      2 De uitkomst van de in het eerste lid, bedoelde berekening wordt naar beneden afgerond op twee cijfers achter
      de komma.


