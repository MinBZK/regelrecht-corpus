preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 29 november 1996, Directie
    Sociale Verzekeringen, Nr. SV/WV/96/4867a;

    Gelet op artikel 78, zesde lid, van de Wet op de arbeidsongeschiktheidsverzekering;

    De Raad van State gehoord (advies van 11 februari 1997, nr. W12.96.0569);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 10 juli 1997, Directie
    Sociale Verzekeringen, Nr. SV/WV/97/2689;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008844/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. Wet: de [Wet op de arbeidsongeschiktheidsverzekering][ref1];

      b. Arbeidsongeschiktheidskas: de Arbeidsongeschiktheidskas, bedoeld in [artikel 73 van de Wet][ref2];

      c. premieplichtig loon: het loon waarover op grond van [artikel 78, eerste lid, van de Wet][ref3], met toepassing
      van [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref4], premie wordt geheven;

      d. premiejaar: het kalenderjaar waarin de in [artikel 78, eerste lid, van de Wet][ref5], bedoelde gedifferentieerde
      premie wordt geheven;

      e. kleine werkgever: een werkgever te wiens laste, in het tweede kalenderjaar dat aan het premiejaar vooraf
      is gegaan, een premieplichtig loon is gekomen dat gelijk is aan of minder bedraagt dan 25 maal het gemiddelde
      premieplichtige loon per werknemer in dat kalenderjaar;

      f. grote werkgever: een werkgever te wiens laste, in het tweede kalenderjaar dat aan het premiejaar vooraf is
      gegaan, een premieplichtig loon is gekomen dat meer bedraagt dan 25 maal het gemiddelde premieplichtige loon per
      werknemer in dat kalenderjaar;

      g. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6];

      h. minimumpremie: de gedifferentieerde premie, bedoeld in [artikel 9][ref7], die een werkgever ten minste
      verschuldigd is;

      i. maximumpremie: de gedifferentieerde premie, bedoeld in [artikel 9][ref8], die een werkgever ten hoogste
      verschuldigd is;

      j. sector: een sector als bedoeld in [artikel 97k van de Werkloosheidswet][ref9].

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag van een werkgever vaststellen, dat hij voor
      het premiejaar wordt ingedeeld in afwijking van het eerste lid, onderdeel *e*, of het eerste lid, onderdeel*f*,
      indien uit door die werkgever bij de aanvraag verstrekte gegevens blijkt, dat als vaststaand mag worden
      aangenomen, dat het in het premiejaar ten laste van die werkgever komende premieplichtige loon tenminste 25% zal
      afwijken van 25 maal het gemiddelde premieplichtige loon per werknemer in het tweede kalenderjaar dat aan het
      premiejaar vooraf is gegaan en de omvang van het verwachte premieplichtige loon leidt tot een andere indeling.
      Een aanvraag als bedoeld in de eerste zin wordt ingediend uiterlijk 6 weken nadat de werkgever schriftelijk
      in kennis is gesteld van de door hem in het premiejaar verschuldigde gedifferentieerde premie, bedoeld in
      [artikel 78, eerste lid, van de Wet][ref10].

      3 Het gemiddelde premieplichtige loon, bedoeld in het eerste lid, onderdelen *e* en *f*, wordt vastgesteld door het
      Uitvoeringsinstituut werknemersverzekeringen.

      4 Bij de vaststelling van het ten laste van een werkgever komende premieplichtige loon, bedoeld in het eerste lid,
      onderdelen *e* en *f*, worden de via de werkgever betaalde arbeidsongeschiktheidsuitkeringen buiten aanmerking
      gelaten.


