preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw en Visserij van 20 mei 1988, nr. J. 4180, Directie Juridische en
    Bedrijfsorganisatorische Zaken;

    Gelet op artikel 3, derde lid, van de Diergeneesmiddelenwet (Stb. 1985, 410);

    De Raad van State gehoord (advies van 27 juli 1988, nr. W.11.88.0267);

    Gezien het nader rapport van Onze Minister van Landbouw en Visserij van 13 september 1988, nr. J. 88/8775, Directie
    Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004405/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van dit besluit wordt verstaan onder: wet: [Diergeneesmiddelenwet][ref1] (*Stb.* 1985, 410);
      Bureau: het Bureau Registratie Diergeneesmiddelen, Postbus 289, 6700 AG Wageningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0004405/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
  - number: '2.1'
    text: |-
      De in [artikel 3, derde lid, van de wet][ref1] bedoelde vergoeding bedraagt voor de duur van de registratie €
      453,78 en is jaarlijks verschuldigd met ingang van de dertiende kalendermaand nadat de aanvraag tot registratie
      door het Bureau is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel3
    url: https://wetten.overheid.nl/BWBR0004405/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '3'
  - number: '2.2'
    text: |-
      De betaling van het in het eerste lid bedoelde bedrag dient binnen één maand na dagtekening van het verzoek om
      betaling door het Bureau op de daarbij aangegeven wijze te worden voldaan.
    url: https://wetten.overheid.nl/BWBR0004405/2002-01-01#Artikel2
  - number: '3.1'
    text: 'Dit besluit kan worden aangehaald als: Besluit jaarlijkse registratievergoeding.'
    url: https://wetten.overheid.nl/BWBR0004405/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      Dit besluit treedt in werking op de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0004405/2002-01-01#Artikel3
