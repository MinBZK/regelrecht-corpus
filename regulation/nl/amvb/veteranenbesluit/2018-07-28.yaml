  - number: '20.1'
    text: |-
      Onze minister kent op aanvraag een inkomensvoorziening toe aan de belanghebbende die ziek dan wel arbeidsongeschikt
      is en waarbij sprake is van een door Onze minister vastgesteld vermoeden van verband met de dienst.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel20
  - number: '20.2'
    text: De inkomensvoorziening bedraagt 80% van de berekeningsgrondslag en wordt in maandelijkse termijnen uitbetaald.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel20
  - number: '20.3'
    text: |-
      De inkomensvoorziening wordt verminderd met inkomsten uit beroep dan wel bedrijf dan wel een uitkering op grond van
      de sociale zekerheidswetgeving.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel20
  - number: '20.4'
    text: |-
      In afwijking van het derde lid worden inkomsten verkregen tijdens de duur van de inkomensvoorziening tengevolge van
      een stage dan wel proefplaatsing niet in mindering gebracht op de inkomensvoorziening.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel20
  - number: '20.5'
    text: De duur van de inkomensvoorziening bedraagt twee jaar, gerekend vanaf de datum van toekenning.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel20
  - number: '20.6'
    text: |-
      De inkomensvoorziening wordt beëindigd indien is komen vast te staan dat geen sprake is van een ziekte dan wel
      arbeidsongeschiktheid die is veroorzaakt door de uitoefening van de militaire dienst als gevolg van de inzet als
      bedoeld in [artikel 1, onder d, van de Veteranenwet][ref1] of wanneer het re-integratietraject is afgerond. De tot
      op de datum van deze vaststelling genoten inkomensvoorziening wordt niet teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0031401#Artikel1
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031401
        artikel: '1'
  - number: '20.7'
    text: |-
      De inkomensvoorziening wordt beëindigd wanneer door of namens Onze minister is vastgesteld dat de medische
      eindtoestand van belanghebbende is bereikt.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel20
  - number: '20.8'
    text: |-
      In afwijking van het vijfde lid en het zevende lid wordt de duur van de inkomensvoorziening met ten hoogste
      12 maanden verlengd als het re-integratietraject nog niet is afgerond.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel20
  - number: '20.9'
    text: |-
      In afwijking van het vijfde lid wordt de inkomensvoorziening verlengd als er nog geen sprake is van een medische
      eindtoestand.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel20
  - number: '20.10'
    text: |-
      Onze minister is bevoegd om in bijzondere gevallen, waarin de toepassing van dit artikel tot een naar zijn oordeel
      onredelijke uitkomst leidt, de duur van de inkomensvoorziening te verlengen.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel20
  - number: '21'
    text: |-
      Indien een uitkering op grond van de sociale zekerheidswetgeving wordt verlaagd, geweigerd of in duur beperkt als
      gevolg van verwijtbaar handelen van de belanghebbende wordt voor de toepassing van [artikel 20, derde lid][ref1],
      de uitkering geacht steeds onverminderd te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0035237#Artikel20
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0035237
        artikel: '20'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '22.1'
    text: |-
      De belanghebbende die een aanvraag voor een inkomensvoorziening heeft ingediend of een inkomensvoorziening geniet
      verstrekt op verzoek of uit eigen beweging zo spoedig mogelijk aan onze minister alle informatie, waaronder mede
      begrepen informatie in het kader van behandeling en re-integratie, waarvan het hem in de gegeven omstandigheden
      redelijkerwijs duidelijk moet zijn dat die van invloed kan zijn op het recht op inkomensvoorziening dan wel op de
      hoogte of de betaling van de inkomensvoorziening.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel22
  - number: '22.2'
    text: |-
      De belanghebbende die een aanvraag voor een inkomensvoorziening heeft ingediend of een inkomensvoorziening geniet
      is verplicht:
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel22
  - number: 22.2.a
    text: |-
      te voldoen aan elke oproep om aanwezig te zijn op een door onze minister te bepalen plaats voor de beantwoording
      van vragen als bedoeld in onderdeel b, het meewerken aan een onderzoek als bedoeld in onderdeel c of het naleven
      van de controlevoorschriften bedoeld in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel22
  - number: 22.2.b
    text: vragen te beantwoorden die door onze minister in verband met het recht op een inkomensvoorziening worden gesteld;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel22
  - number: 22.2.c
    text: mee te werken aan een geneeskundig onderzoek door of vanwege onze minister;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel22
  - number: 22.2.d
    text: |-
      tot naleving van de door onze minister vastgestelde controlevoorschriften die noodzakelijk zijn voor een juiste
      uitvoering van de inkomensvoorziening;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel22
  - number: 22.2.e
    text: |-
      op verzoek onverwijld inzage te geven in een op hem betrekking hebbend document als bedoeld in
      [artikel 1, eerste lid, onder 1 tot en met 3 van de Wet op de identificatieplicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 22.2.f
    text: een naar algemeen medische maatstaven adequate behandeling te ondergaan voor zijn ziekte of arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel22
  - number: 22.2.g
    text: mee te werken aan door onze minister gegeven re-integratie voorschriften;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel22
  - number: 22.2.h
    text: |-
      mee te werken aan door onze minister gegeven voorschriften of getroffen maatregelen die erop gericht zijn om de
      belanghebbende in staat te stellen passende arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel22
  - number: '22.3'
    text: |-
      Bij het toerekenbaar niet naleven van één van de in het vorige lid genoemde verplichtingen wordt de
      inkomensvoorziening niet toegekend dan wel geheel of ten dele beëindigd.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel22
  - number: '22.4'
    text: |-
      De inkomensvoorziening herleeft indien wederom aan de in het eerste lid genoemde verplichtingen wordt voldaan,
      indien en voor zover de uitkeringsduur, genoemd in [artikel 20, vijfde lid][ref1], niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0035237#Artikel20
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0035237
        artikel: '20'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '23.1'
    text: 'De belanghebbende heeft gedurende de duur van de inkomensvoorziening recht op:'
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel23
  - number: 23.1.a
    text: |-
      begeleiding als bedoeld in [artikel 13][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035237#Artikel13
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0035237
        artikel: '13'
        hoofdstuk: '4'
  - number: 23.1.b
    text: voorzieningen die strekken tot behoud, herstel of bevordering van de mogelijkheid tot het verrichten van arbeid;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel23
  - number: 23.1.c
    text: voorzieningen die strekken tot verbetering van de leefomstandigheden en geneeskundige verstrekkingen,
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel23
  - number: '23.2'
    text: |-
      In aanvulling op het eerste lid kan de belanghebbende in aanmerking worden gebracht voor aanvullende dan wel andere
      ondersteuning ter verkrijging van arbeid in een dienstbetrekking, dan wel arbeid als zelfstandige.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel23
  - number: '24.1'
    text: |-
      In geval van overlijden van de belanghebbende die in het genot is van een inkomensvoorziening wordt een uitkering
      verstrekt:
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel24
  - number: 24.1.a
    text: aan de echtgenoot, of aan de partner waarmee de overleden belanghebbende samenleefde;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel24
  - number: 24.1.b
    text: |-
      bij ontstentenis van een onder a bedoelde persoon: aan het kind waarvoor, of de kinderen voor wie aanspraak op
      kinderbijslag bestaat;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel24
  - number: 24.1.c
    text: |-
      bij ontstentenis van onder a of b bedoelde personen aan ouders, broers, zusters of kinderen van de belanghebbende
      indien hij in de noodzakelijke kosten van het levensonderhoud grotendeels bijdroeg.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel24
  - number: '24.2'
    text: |-
      Indien het eerste lid geen toepassing kan vinden kan onze minister de uitkering geheel of gedeeltelijk doen
      aanwenden ter bestrijding van de kosten van de laatste ziekte en de begrafenis of crematie van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel24
  - number: '24.3'
    text: |-
      De uitkering is gelijk aan het bedrag van de aan de belanghebbende toekende inkomensvoorziening over een periode
      van drie maanden.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel24
  - number: '25.1'
    text: |-
      De belanghebbende die bij het beëindigen van de inkomensvoorziening geheel of gedeeltelijk is gere-integreerd in
      een dienstbetrekking dan wel in arbeid als zelfstandige ontvangt eenmalig een stimuleringspremie gelijk aan het
      bedrag van de aan de belanghebbende toegekende inkomensvoorziening over een periode van drie maanden.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel25
  - number: '25.2'
    text: |-
      Van gehele of gedeeltelijke re-integratie in een dienstbetrekking dan wel in arbeid als zelfstandige is sprake
      indien de belanghebbende een aanstelling of arbeidsovereenkomst heeft voor de duur van ten minste zes maanden dan
      wel als zelfstandige gedurende tenminste zes maanden opdrachten heeft.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel25
  - number: '25.3'
    text: |-
      In afwijking van het eerste en tweede lid heeft de belanghebbende, die een aanstelling of arbeidsovereenkomst heeft
      van ten minste drie maanden dan wel als zelfstandige gedurende tenminste drie maanden opdrachten heeft, aanspraak
      op 50% van de stimuleringspremie.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel25
  - number: '26'
    text: Bij regeling van onze minister worden nadere regels gesteld ter uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel26
  - number: '27.1'
    text: |-
      Onze minister houdt een veteranenregistratiesysteem bij waarin persoonsgegevens betreffende veteranen worden
      verwerkt.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel27
  - number: '27.2'
    text: |-
      In het veteranenregistratiesysteem worden persoonsgegevens verwerkt in het kader van het veteranenbeleid van het
      ministerie van Defensie ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel27
  - number: 27.2.a
    text: het onderhouden van contacten met veteranen in het kader van veteranenzorg;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel27
  - number: 27.2.b
    text: |-
      het verstrekken van informatie aan veteranen over specifiek voor veteranen bedoelde binnen het veteranenbeleid
      passende activiteiten, faciliteiten en voorzieningen;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel27
  - number: 27.2.c
    text: |-
      het verstrekken van gegevens over veteranen aan personen en instanties ten behoeve van de specifiek voor veteranen
      bedoelde binnen het veteranenbeleid passende activiteiten, faciliteiten en voorzieningen die door deze personen en
      instanties worden geleverd of georganiseerd;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel27
  - number: 27.2.d
    text: wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel27
  - number: '27.3'
    text: |-
      Het verwerken van gegevens ten behoeve van in het tweede lid genoemde doeleinden blijft achterwege indien
      betrokkene aangeeft daartegen bezwaar te hebben, met uitzondering van het informeren van de veteraan over achteraf
      gebleken gezondheidsrisico’s tijdens een uitzending.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel27
  - number: '27.4'
    text: |-
      Aan het verwerken van gegevens ten behoeve van de in het tweede lid, onder c en d genoemde doeleinden kunnen nadere
      voorwaarden worden verbonden ten einde te verzekeren dat de verwerking uitsluitend geschiedt ten behoeve van deze
      specifieke doeleinden en plaatsvindt binnen de kaders van het veteranenbeleid van het ministerie van Defensie.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel27
  - number: '28'
    text: 'In het veteranenregistratiesysteem worden slechts de volgende gegevens betreffende veteranen opgenomen:'
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel28
  - number: 28.a
    text: |-
      achternaam, voorletters, voorvoegsels, geslacht, titulatuur, adres, postcode en woonplaats, geboortedatum,
      geboorteplaats en geboorteland en overlijdensdatum;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel28
  - number: 28.b
    text: |-
      (beschikbare) registratie en administratienummers, zoals het militaire registratienummer, marinenummer, werknemer
      ID, en bij wet toegekende identificatienummers uitsluitend ten behoeve van actualisering van naam, adres de
      noodzakelijke maatschappelijke ondersteuning en woonplaatsgegevens via de Basisregistratie personen;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel28
  - number: 28.c
    text: |-
      uitzendgegevens, zoals gegevens betreffende de missie of operatie, periode van uitzending, rang, functiecode en
      waar mogelijk locatie tijdens uitzending;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel28
  - number: 28.d
    text: |-
      administratieve gegevens, zoals een indicatie betreffende de uitvoering van het bepaalde in
      [artikel 27, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035237#Artikel27
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0035237
        artikel: '27'
        hoofdstuk: '6'
  - number: '29.1'
    text: |-
      Onze Minister houdt aantekening van verstrekking van gegevens overeenkomstig het bepaalde in
      [artikel 27, tweede lid, onder c en d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035237#Artikel27
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0035237
        artikel: '27'
        hoofdstuk: '6'
  - number: '29.2'
    text: |-
      Aan het verwerken van gegevens kunnen nadere voorwaarden worden verbonden ter naleving van de Algemene verordening
      gegevensbescherming en dit besluit.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel29
  - number: '30.1'
    text: 'In het veteranenregistratiesysteem opgenomen persoonsgegevens worden slechts verstrekt:'
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel30
  - number: 30.1.a
    text: |-
      aan personen en instanties die belast zijn met of leiding geven aan de in [artikel 27, tweede lid][ref1], bedoelde
      activiteiten of die daarbij noodzakelijk zijn betrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0035237#Artikel27
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0035237
        artikel: '27'
        hoofdstuk: '6'
  - number: 30.1.b
    text: ingevolge een wettelijke verplichting.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel30
  - number: '30.2'
    text: |-
      In afwijking van het eerste lid kan verstrekking van gegevens, bedoeld in [artikel 27, tweede lid, onder d][ref1],
      geschieden aan andere personen en instanties in geval van dringende en gewichtige redenen en indien de persoonlijke
      levenssfeer van de betrokkene niet onevenredig wordt geschaad. Verstrekking vindt slechts plaats na toestemming van
      de Hoofddirecteur Personeel van het ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0035237#Artikel27
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0035237
        artikel: '27'
        hoofdstuk: '6'
  - number: '31'
    text: |-
      De [Regeling veteranenregistratie Defensie][ref1] nr.: C/2006019485 d.d. 13 juni 2006 wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0019956
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0019956
  - number: '33'
    text: |-
      Onze Minister kan termijnen, bedragen en percentages, genoemd in dit besluit buiten toepassing laten of daarvan
      afwijken indien toepassing gelet op het belang van een goede zorgverlening aan de veteraan of zijn relaties zal
      leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel33
  - number: '34'
    text: |-
      De [Veteranenwet][ref1] treedt in werking op 28 juni 2014.


      [ref1]: https://wetten.overheid.nl/BWBR0031401
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0031401
  - number: '35'
    text: Dit besluit treedt in werking op 28 juni 2014.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel35
  - number: '36'
    text: 'Dit besluit wordt aangehaald als: Veteranenbesluit'
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel36
