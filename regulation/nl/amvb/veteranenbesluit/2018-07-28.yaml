---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: veteranenbesluit
regulatory_layer: AMVB
publication_date: '2018-07-27'
valid_from: '2018-07-28'
bwb_id: BWBR0035237
url: https://wetten.overheid.nl/BWBR0035237/2018-07-28
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van onze Minister van Defensie, van 12 maart 2014 gedaan mede namens onze Ministers van Sociale
    Zaken en Werkgelegenheid, van Volksgezondheid, Welzijn en Sport en van Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op de artikelen 2 tot en met 5 en 7 tot en met 10 van de Veteranenwet en de artikelen 12 en 12h van de
    Militaire ambtenarenwet 1931;

    De Afdeling advisering van de Raad van State gehoord (advies van 7 mei 2014, No.W07.14.0070/II);

    Gezien het nader rapport van onze Minister van Defensie, van 5 juni 2014, nr. BS/2014007292, uitgebracht
    mede namens onze Ministers van Sociale Zaken en Werkgelegenheid, van Volksgezondheid, Welzijn en Sport en van
    Binnenlandse Zaken en Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onze minister stelt een Inspecteur der Veteranen aan die tot taak heeft Onze Minister te adviseren over
      veteranenaangelegenheden en te bemiddelen in individuele aangelegenheden ten behoeve van veteranen.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel1
  - number: '1.2'
    text: |-
      Onze minister bevordert initiatieven op het gebied van erkenning van en waardering voor veteranen door
      het instellen van een veteranenloket voor informatie en aanvragen betreffende erkenning en waardering. Het
      veteranenloket heeft tevens tot taak het ondersteunen en begeleiden van veteranen en hun relaties als bedoeld in
      [artikel 10][ref1] en door het faciliteren, subsidiëren of door het beschikbaar stellen van personeel, materieel of
      infrastructuur aan of voor:


      [ref1]: https://wetten.overheid.nl/BWBR0035237#Artikel10
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035237
        artikel: '10'
        hoofdstuk: '4'
  - number: 1.2.a
    text: de Stichting het Veteraneninstituut;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel1
  - number: 1.2.b
    text: de Stichting Nederlandse Veteranendag;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel1
  - number: 1.2.c
    text: de Stichting het Veteranenplatform;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel1
  - number: 1.2.d
    text: een verzorgingshuisfunctie voor veteranen.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel1
  - number: '2.1'
    text: |-
      Aan de veteraan wordt zo spoedig mogelijk na terugkeer van de missie het draaginsigne veteranen en de veteranenpas
      uitgereikt om zich als veteraan te onderscheiden;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel2
  - number: '2.2'
    text: Over toekenning van eventuele andere onderscheidingstekens worden bij ministeriële regeling regels gesteld.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel2
  - number: '3'
    text: |-
      Het deelnemen van veteranen en hun relaties aan bijeenkomsten en reünies van militaire eenheden wordt volgens bij
      ministeriële regeling te stellen regels bevorderd door:
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel3
  - number: 3.a
    text: het door operationele commando’s doen organiseren van veteranendagen;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel3
  - number: 3.b
    text: het beschikbaar stellen van reüniefaciliteiten voor verenigingen van veteranen;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel3
  - number: 3.c
    text: het op militaire locaties beschikbaar stellen van sportaccommodaties, vergaderruimtes, restaurants en messes.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel3
  - number: '4.1'
    text: |-
      Alvorens een militair wordt aangewezen voor deelnemen aan een uitzending stelt de commandant van de organieke
      eenheid van de militair vast of de militair uitzendgeschikt is.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel4
  - number: '4.2'
    text: |-
      De commandant raadpleegt hiertoe het sociaal medisch team, waarbij hij over de medische, psychische en sociale
      geschiktheid van de militair wordt geadviseerd. Het advies van de verantwoordelijk militair arts over de
      uitzendgeschiktheid is bindend.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel4
  - number: '4.3'
    text: |-
      De commandant draagt er zorg voor, dat aan militairen die tijdelijk verminderd inzetbaar zijn zorg wordt geboden
      ter verbetering van gezondheid en inzetbaarheid,
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel4
  - number: '4.4'
    text: |-
      De commandant bewaakt dat militairen bestemd voor uitzending uit tandheelkundig oogpunt geschikt zijn en de
      vereiste vaccinaties hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel4
  - number: '5.1'
    text: |-
      De Commandant der Strijdkrachten draagt er zorg voor dat militairen die zijn aangewezen voor uitzending deelnemen
      aan een opwerkprogramma, dat ten minste bestaat uit een opleiding gericht op de specifieke kenmerken van de missie
      en het uitzendgebied en een training gericht op de algemene kenmerken van een uitzending.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel5
  - number: '5.2'
    text: |-
      De Commandant der Strijdkrachten draagt er zorg voor dat militairen tijdig worden opgeleid in het herkennen van en
      omgaan met gevechtsstress en worden geïnformeerd over hygiëne en preventieve gezondheidszorg in het operatiegebied.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel5
  - number: '5.3'
    text: 'De opleiding en training bieden de militair ten minste inzicht in de zorgaspecten van de uitzending waaronder:'
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel5
  - number: 5.3.a
    text: de locaties, taken en bevoegdheden van zorgverleners in het uitzendgebied;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel5
  - number: 5.3.b
    text: |-
      de bevoegdheden en verantwoordelijkheden op het gebied van zorg van de commandanten in het uitzendgebied en hetgeen
      de militair in het uitzendgebied daaromtrent mag verwachten.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel5
  - number: '5.4'
    text: |-
      De Commandant der Strijdkrachten bevordert de deelname van de militair aan een door de Dienst Geestelijke
      Verzorging georganiseerde uitzendconferentie, gericht op het ondersteunen en geestelijk weerbaar maken van de
      militair.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel5
  - number: '5.5'
    text: |-
      De Commandant der Strijdkrachten organiseert vóór het vertrek van de militair voor de militair en zijn relaties een
      thuisfrontinformatiedag en bevordert dat zij daaraan deelnemen.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel5
  - number: '5.6'
    text: |-
      Indien operationele noodzaak het op korte termijn vertrekken van een militair naar een uitzendgebied noodzakelijk
      maakt en daardoor onvoldoende gelegenheid bestaat om de in dit artikel bedoelde opleiding en voorbereiding te
      volgen, draagt de Commandant der Strijdkrachten er zorg voor dat de militair en diens relaties zich op een andere
      manier zo goed mogelijk kunnen voorbereiden en dat hen de noodzakelijke informatie en kennis wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel5
  - number: '6'
    text: |-
      Tijdens de voorbereiding, bedoeld in [artikel 5][ref1], worden de militair en diens relaties door de Commandant
      der Strijdkrachten geïnformeerd over de gezondheidsrisico’s van de inzet en over het veteranenloket bedoeld in
      [artikel 10][ref2] en de zorg die in dit verband voor de militair en voor diens relaties beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0035237#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035237#Artikel10
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035237
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0035237
        artikel: '10'
        hoofdstuk: '4'
  - number: '7.1'
    text: |-
      Tijdens inzet zijn medische zorg en sociaal-medische begeleiding beschikbaar voor het verlenen van zorg aan de
      militair.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel7
  - number: '7.2'
    text: Door de commandant van de uitgezonden eenheid wordt daarnaast een zorg- en hulpverleningsteam samengesteld.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel7
  - number: '7.3'
    text: |-
      Het zorg- en hulpverleningsteam is afhankelijk van de aard van de missie en de omvang van de eenheid en de
      inschatting van de risico’s voor de uitgezonden eenheid ter plaatse aanwezig of binnen 24 uur ter plaatse.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel7
  - number: '7.4'
    text: |-
      Het zorg- en hulpverleningsteam adviseert de commandant inzake inzetbaarheid van personeel, repatriëring en
      ernstige incidenten.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel7
  - number: '8.1'
    text: |-
      Gedurende de uitzending van de militair worden diens relaties door de zorg van de Commandant der Strijdkrachten
      geïnformeerd en begeleid door middel van het organiseren van bijeenkomsten waar contact kan worden gelegd met
      relaties van andere militairen en waarbij voorlichting wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel8
  - number: '8.2'
    text: |-
      De Commandant der Strijdkrachten draagt er zorg voor dat in geval van calamiteiten de relaties van de militair
      gerichte informatievoorziening en ondersteuning ontvangen.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel8
  - number: '8.3'
    text: |-
      Indien noodzakelijk kunnen de relaties van de militair via het veteranenloket, bedoeld in [artikel 10][ref1]
      contact opnemen met een bedrijfsmaatschappelijk werker. Voor acute of ernstige situaties is via dit veteranenloket
      een hulpverleningslijn doorlopend bereikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035237#Artikel10
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035237
        artikel: '10'
        hoofdstuk: '4'
  - number: '8.4'
    text: In geval van ernstige incidenten in het uitzendgebied wordt de relaties van de militair zorg geboden waarbij
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel8
  - number: 8.4.a
    text: |-
      in geval van ernstige verwonding of overlijden van de militair de relaties van de militair door de commandant
      van de organieke eenheid van de militair of diens vertegenwoordiger en door een bedrijfsmaatschappelijk werker of
      geestelijk verzorger op het huisadres worden bezocht en verdere ondersteuning geschiedt in overleg met de relaties
      van de militair;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel8
  - number: 8.4.b
    text: |-
      bij andere dan onder a. bedoelde incidenten in het uitzendgebied door bedrijfsmaatschappelijk werkers aan
      de relaties van de militair informatie wordt verstrekt over de toedracht en waar gewenst tevens persoonlijke
      ondersteuning en begeleiding worden geboden.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel8
  - number: '8.5'
    text: |-
      In geval van problemen of incidenten in de thuissituatie van de militair wordt de militair in het uitzendgebied
      geïnformeerd. Daarnaast worden de relaties van de militair door bedrijfsmaatschappelijk werkers zo nodig
      ondersteund in praktische zaken waaronder het leggen van contacten met relevante instanties.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel8
  - number: '8.6'
    text: |-
      Door de zorg van de Commandant der Strijdkrachten worden ondersteunende activiteiten ontplooid zoals een
      thuisfrontcomité, een telefooncirkel en een informatiemap voor het thuisfront. Het thuisfrontcomité wordt voor een
      door de Commandant der Strijdkrachten te bepalen termijn na de inzet in stand gehouden.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel8
  - number: '9.1'
    text: |-
      Gedurende de eerste 18 maanden na terugkeer van de veteraan worden de veteraan en zijn relaties door de zorg van de
      Commandant der Strijdkrachten proactief begeleid.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel9
  - number: '9.2'
    text: 'Proactieve begeleiding van de veteraan geschiedt ten minste door middel van een adaptatieprocedure die bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel9
  - number: 9.2.a
    text: |-
      gesprekken, gericht op het bespreken van de missie, de persoonlijke ervaringen en de mentale gesteldheid van de
      veteraan;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel9
  - number: 9.2.b
    text: het verstrekken van informatie over de beschikbare zorg na terugkeer;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel9
  - number: 9.2.c
    text: |-
      een nazorgvragenlijst, die na terugkeer aan de veteraan wordt toegezonden en tot doel heeft te signaleren of er
      mogelijk sprake is van klachten of aandoeningen bij de veteraan;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel9
  - number: 9.2.d
    text: |-
      terugkeerdagen, die gericht zijn op het ontmoeten van oud-collega's en waar met de aanwezige hulpverleners kan
      worden gesproken.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel9
  - number: '9.3'
    text: 'Proactieve begeleiding van de relaties van de militair geschiedt door ten minste:'
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel9
  - number: 9.3.a
    text: |-
      een nazorgvragenlijst relaties, die na terugkeer van de militair ten behoeve van diens relatie wordt gezonden en
      gericht is op het vroegtijdig signaleren van mogelijke klachten, aandoeningen of problemen bij de veteraan en diens
      relaties;
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel9
  - number: 9.3.b
    text: |-
      terugkeerdagen, die na terugkeer van de militair worden gehouden en waarop relaties van de veteranen, relaties van
      andere veteranen kunnen ontmoeten.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel9
  - number: '9.4'
    text: |-
      Indien daartoe aanleiding bestaat wordt aan de veteraan of zijn relaties een hulpaanbod gedaan of geschiedt
      doorverwijzing voor zorg.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel9
  - number: '9.5'
    text: |-
      Na afloop van de eerste 18 maanden bevordert de Commandant der Strijdkrachten dat de veteraan en zijn relaties
      deelnemen aan terugkomdagen, die veelal in de vorm van een reünie worden georganiseerd.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel9
  - number: '10.1'
    text: |-
      Het veteranenloket bedoeld in [artikel 1][ref1] fungeert als zorgloket voor de veteraan en zijn relaties teneinde
      hen te ondersteunen en begeleiden.


      [ref1]: https://wetten.overheid.nl/BWBR0035237#Artikel1
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0035237
        artikel: '1'
        hoofdstuk: '1'
  - number: '10.2'
    text: |-
      Het veteranenloket kan door de veteraan en zijn relaties worden benaderd voor alle vragen die verband houden met
      de veteranenstatus.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel10
  - number: '10.3'
    text: |-
      De veteraan en zijn relaties krijgen bij een zorgvraag een zorgcoördinator toegewezen om hen te informeren over het
      verkrijgen van zorg en hen ter zake te ondersteunen en te begeleiden.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel10
  - number: '10.4'
    text: |-
      Bij ministeriële regeling worden kwaliteitseisen en voorwaarden gesteld waaraan het veteranenloket, de
      zorgcoördinator en het zorgplan moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel10
  - number: '11.1'
    text: |-
      Er is een Landelijk Zorgsysteem voor Veteranen waarbij instellingen zijn aangesloten op het gebied van de
      geestelijke gezondheidszorg, waaronder wordt verstaan: psychische en psychosociale zorg voor veteranen.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel11
  - number: '11.2'
    text: Het Landelijk Zorgsysteem voor Veteranen bevordert de samenwerking tussen de aangesloten instellingen.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel11
  - number: '11.3'
    text: |-
      Het Landerlijk Zorgsysteem voor veteranen draagt bij aan wetenschappelijk onderzoek op het gebied van psychische en
      psychosociale zorg voor veteranen.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel11
  - number: '11.4'
    text: |-
      Het Landelijk Zorgsysteem voor Veteranen draagt zorg voor de afstemming van een adequaat behandelaanbod op het
      gebied van psychische en psychosociale zorg aan de veteraan en zijn relaties.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel11
  - number: '11.5'
    text: Onze minister kan nadere regels stellen omtrent de uitvoering van dit artikel
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel11
  - number: '12.1'
    text: |-
      Het veteranenloket ondersteunt de veteraan en zijn relaties op verzoek bij de aanvraag van
      een uitkering op grond van de sociale zekerheidswetgeving, een voorziening op grond van de
      [Wet maatschappelijke ondersteuning 2015][ref1], de [militaire ambtenarenwet 1931][ref2] of enige aanspraak op
      grond van de [Kaderwet militaire pensioenen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035362
      [ref2]: https://wetten.overheid.nl/BWBR0001952
      [ref3]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0035362
      - id: ref2
        bwb_id: BWBR0001952
      - id: ref3
        bwb_id: BWBR0011955
  - number: '12.2'
    text: |-
      De voor de uitkerings- dan wel pensioentoekenning noodzakelijke geneeskundige onderzoeken worden zoveel mogelijk
      gelijktijdig uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel12
  - number: '12.3'
    text: |-
      De arbeidsongeschiktheidsuitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1],
      de [Wet op de arbeidsongeschiktheidsverzekering][ref2], de
      [Wet arbeidsongeschiktheidsvoorziening voor militairen][ref3] en het militair invaliditeitspensioen worden door
      zorg van Onze minister gecombineerd betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002822
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0002822
  - number: '13.1'
    text: |-
      De veteraan die niet meer in militaire dienst is en die ten gevolge van een aandoening waarvoor een vermoeden
      van verband met de dienst als bedoeld in [artikel 19][ref1] is aangenomen, geen werk meer heeft dan wel zijn werk
      dreigt te verliezen, heeft recht op begeleiding bij het vinden van werk overeenkomstig het re-integratiebeleid dat
      geldt binnen het ministerie van Defensie, indien en voor zover hij daarvoor geen beroep kan doen op een werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0035237#Artikel19
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0035237
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '13.2'
    text: |-
      De veteraan krijgt ondersteuning door tussenkomst van het veteranenloket bij het effectueren van de in het eerste
      lid bedoelde re-integratieaanspraak.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel13
  - number: '13.3'
    text: |-
      Het recht op begeleiding, bedoeld in het eerste lid strekt zich niet uit tot het vinden van werk binnen het
      gezagsbereik van het ministerie van Defensie.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel13
  - number: '13.4'
    text: Dit artikel is van overeenkomstige toepassing op de relaties van de veteraan.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel13
  - number: '14'
    text: |-
      De veteraan en zijn relaties krijgen ondersteuning door tussenkomst van het veteranenloket bij de revalidatie
      van de veteraan, door het bieden van bemiddeling bij het verkrijgen van de medische zorg binnen, of buiten het
      militair revalidatiecentrum en door het bieden van de psychosociale begeleiding, zorg en opvang die zij daarbij
      nodig hebben.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel14
  - number: '15'
    text: |-
      De veteraan en zijn relaties krijgen de noodzakelijke maatschappelijke ondersteuning door tussenkomst van het
      veteranenloket.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel15
  - number: '16.1'
    text: |-
      Onze minister bevordert het onderzoek, bedoeld in [artikel 10 van de Veteranenwet][ref1] onder meer door het ter
      beschikking stellen van fondsen voor het wetenschappelijk onderzoek, bedoeld in [artikel 11, derde lid][ref2] van
      dit besluit en door het verlenen van subsidie aan de Stichting het Veteraneninstituut.


      [ref1]: https://wetten.overheid.nl/BWBR0031401#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0035237#Artikel11
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0031401
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0035237
        artikel: '11'
        hoofdstuk: '4'
  - number: '16.2'
    text: |-
      Onze minister rapporteert jaarlijks aan de Staten-Generaal over de uitkomsten van wetenschappelijk onderzoek als
      bedoeld in [artikel 10 van de Veteranenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031401#Artikel10
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0031401
        artikel: '10'
  - number: '17.1'
    text: |-
      De Raad van toezicht en advisering ten behoeve van het civiel-militaire zorgsysteem voor de hulpverlening
      aan veteranen en het wetenschappelijk onderzoek naar aandoeningen gerelateerd aan uitzendingen adviseert Onze
      minister van Defensie ten aanzien van wetenschappelijk onderzoek op het gebied van aandoeningen gerelateerd aan
      uitzendingen.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel17
  - number: '17.2'
    text: |-
      De Raad van toezicht en advisering houdt toezicht op het civiel-militaire zorgsysteem voor de hulpverlening aan
      veteranen, bevordert samenwerking tussen alle in het zorgsysteem betrokken partijen en velden en adviseert de
      minister terzake.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel17
  - number: '17.3'
    text: Onze minister kan nadere regels stellen omtrent de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel17
  - number: '18'
    text: |-
      Hoofdstuk 4 is van overeenkomstige toepassing op militaire dienstslachtoffers voor zover die niet als veteraan
      kunnen worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0035237/2018-07-28#Artikel18
  - number: '19'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: -
      *arbeidsongeschiktheid:* arbeidsongeschiktheid als bedoeld in [artikel 4][ref1]
      dan wel [artikel 5 van de Wet werk en inkomen naar arbeidsvermogen][ref2], dan wel
      [artikel 18, eerste lid van de Wet op de arbeidsongeschiktheidsverzekering][ref3];
        - *belanghebbende:* een gewezen militair als bedoeld in [artikel 1, onder c, van de Veteranenwet][ref4] die de
      leeftijd als bedoeld in [artikel 7 van de Algemene ouderdomswet][ref5] nog niet heeft bereikt;
        - *berekeningsgrondslag van de inkomensvoorziening:* het bedrag van de inkomsten die
      de veteraan in het jaar voorafgaande aan zijn aanmelding bij het loket als bedoeld in
      [artikel 11][ref6] van dit Besluit, gebruikelijk zou hebben kunnen genieten indien hij
      niet ziek dan wel arbeidsongeschikt zou zijn, en dat niet minder bedraagt dan het in
      __REF006___________________________________________________________________________________________________________
      _______ genoemde bedrag verhoogd met 8% vakantietoeslag;
        - *medische eindtoestand:* de medische eindtoestand als bedoeld in de regeling van onze minister vastgesteld op
      basis van [artikel 2, zesde lid van de Kaderwet Militaire Pensioenen][ref8];
        - *sociale zekerheidswetgeving:* de [Werkloosheidswet][ref9], de [Ziektewet][ref10], de
      [Wet werk en inkomen naar arbeidsvermogen][ref11], de [Wet op de arbeidsongeschiktheidsverzekering][ref12],
      de [Zorgverzekeringswet][ref13], de [Algemene wet bijzondere ziektekosten][ref14], de
      [Wet maatschappelijke ondersteuning 2015][ref15], dan wel een (inkomens-)voorziening die naar aard en strekking
      overeenkomt met de hiervoor genoemde wetten;
        - *vermoeden van verband met de dienst:* een redelijk en objectiveerbaar vermoeden dat de ziekte dan wel
      arbeidsongeschiktheid is veroorzaakt door de uitoefening van de militaire dienst als gevolg van de inzet als
      bedoeld in [artikel 1, onder d, van de Veteranenwet][ref16];
        - *ziekte:* ziekte als bedoeld in [artikel 19, eerste lid van de Ziektewet][ref17].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0031401#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0002221#Artikel7
