articles:
  - number: '336'
    text: |-
      1 De bezitter van een getuigschrift van met goed gevolg voor de inwerkingtreding van het koninklijk besluit van 27
      september 1982 (*Stb.* 558) afgelegd examen in de bedrijfskunde, uitgaande van de Stichting Nijenrode, Instituut
      voor Bedrijfskunde, gevestigd te Breukelen, is vrijgesteld van het afleggen van het propedeutisch examen van de
      studierichting der economie.

      2 De bezitter van een getuigschrift van een met goed gevolg afgelegd examen aan het Internationaal Instituut
      voor Sociale Studiën, gevestigd te 's-Gravenhage, kan tot een bij koninklijk besluit te bepalen tijdstip, op een
      daartoe strekkend verzoek worden vrijgesteld van het afleggen van een of meer der in hoofdstuk I van het Academisch
      Statuut, zoals vastgesteld bij dit besluit, bedoelde examens of gedeelten daarvan.

      3 De in het tweede lid bedoelde vrijstelling wordt verleend door het college van bestuur, overeenkomstig het advies
      van de desbetreffende examencommissie.
    url: https://wetten.overheid.nl/BWBR0004353/1995-12-31#Artikel336
