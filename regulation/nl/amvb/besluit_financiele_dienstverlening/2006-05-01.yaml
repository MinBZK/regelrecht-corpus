---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_financiele_dienstverlening
regulatory_layer: AMVB
publication_date: '2006-12-07'
valid_from: '2006-05-01'
bwb_id: BWBR0019283
url: https://wetten.overheid.nl/BWBR0019283/2006-05-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 22 juni 2005 (FM 2005-01516 M);

    Gelet op de richtlijnen nr. 2002/92/EG van het Europees Parlement en de Raad van de Europese Unie van 9 december
    2002 betreffende verzekeringsbemiddeling (PbEG L9) en nr. 2002/65/EG van het Europees Parlement en de Raad van
    de Europese Unie van 23 september 2002 betreffende de verkoop op afstand van financiële diensten aan consumenten
    en tot wijziging van de Richtlijnen 90/619/EEG, 97/7/EG en 98/27/EG van de Raad (PbEG L271) en de artikelen 1,
    onderdeel m, onder 8°, 1, onderdeel r, onder 2°, 23, tweede lid, 26, tweede lid, 28, tweede lid, 31, tweede lid,
    derde lid, onder b, en vierde lid, 35, 37, derde lid, 38, eerste lid, 50, 53, tweede lid, 74, vijfde lid, en 100
    van de Wet financiële dienstverlening en artikel 12, eerste lid, van de Wet toezicht belegginginstellingen;

    De Raad van State gehoord (advies van 19 augustus 2005, no. W06.05.0266/IV);

    Gezien het nader rapport van Onze Minister van Financiën van 13 december 2005, FM 2005-02085 M;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.a
    text: |-
      *accountant*: accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] die
      niet in dienstbetrekking staat tot de financiële dienstverlener of de groep waartoe de financiële dienstverlener
      behoort;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1.b
    text: |-
      *beleggingsobjectprospectus*: document waarin de in [artikel 35, derde lid][ref1], genoemde onderwerpen met
      betrekking tot een beleggingsobject zijn weergegeven op de bij of krachtens dat artikel voorgeschreven wijze;


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel35
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '35'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 1.c
    text: '*betalingstermijn*: tijdvak dat ligt tussen:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.c.1°
    text: |-
      het tijdstip waarop een aanbieder ter uitvoering van een overeenkomst inzake krediet een geldsom ter beschikking
      stelt of aanvangt met het verschaffen van het genot van een zaak of effect of met het verlenen van een dienst als
      bedoeld in [artikel 4][ref1] en het tijdstip waarop de consument gehouden is de eerste betaling ter zake daarvan te
      hebben gedaan, of


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel4
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '4'
        hoofdstuk: '1'
  - number: 1.c.2°
    text: |-
      twee opeenvolgende tijdstippen waarop een consument gehouden is ter zake van een overeenkomst inzake krediet een
      betaling te hebben gedaan;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.d
    text: '*complex product*:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.d.1°
    text: |-
      financieel product als bedoeld in [artikel 1, onderdeel m, onder 9°, van de wet][ref1] dat ten minste een
      gecombineerd financieel product omvat dat afhankelijk is van de ontwikkelingen op financiële markten of andere
      markten;


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel1
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '1'
  - number: 1.d.2°
    text: |-
      recht van deelneming in een beleggingsinstellingals bedoeld in
      [artikel 1, onderdeel c, van de Wet toezicht beleggingsinstellingen][ref1], dat op verzoek van de
      houder daarvan ten laste van de activa van die instelling direct of indirect door die instelling wordt
      ingekocht of terugbetaald, niet zijnde een recht van deelneming in een beleggingstelling als bedoeld in
      [artikel 17a, van de Wet toezicht beleggingsinstellingen][ref2], of dat niet op verzoek van de houder ten laste van
      de activa direct of indirect worden ingekocht of terugbetaald en, in het laatstgenoemde geval, geen effect is als
      bedoeld in [artikel 1a, onderdeel d, van het Besluit toezicht effectenverkeer 1995][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel1a
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: 17a
      - id: ref3
        bwb_id: BWBR0007708
        artikel: 1a
  - number: 1.d.3°
    text: |-
      levensverzekering, anders dan de verzekering waarbij de verplichting van de aanbieder tot het doen van een
      uitkering of een reeks van uitkeringen alleen dan ontstaat, indien het overlijden van degene op wiens leven de
      verzekering betrekking heeft plaatsvindt voor de in de polis genoemde datum;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.d.4°
    text: |-
      combinatie van een hypothecair krediet met een levensverzekering als bedoeld onder 3°, of met een spaarrekening als
      bedoeld in [artikel 1, onderdeel m, onder 5°, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel1
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '1'
  - number: 1.d.5°
    text: beleggingsobject; of
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.d.6°
    text: |-
      een combinatie van een of meer onder 1° tot en met 5° bedoelde producten met een of meer van de in
      [artikel 1, onderdeel m, van de wet][ref1] bedoelde producten;


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel1
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '1'
  - number: 1.e
    text: '*consumptief krediet*: krediet, niet zijnde hypothecair krediet;'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.f
    text: '*doorlopend krediet*: een overeenkomst inzake:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.f.1°
    text: |-
      geldkrediet waarbij de consument op verschillende tijdstippen geldsommen kan opnemen, voorzover het uitstaande
      saldo de kredietlimiet niet overschrijdt; of
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.f.2°
    text: |-
      goederenkrediet waarbij de aanbieder, of een derde gehouden is aan een consument op verschillende tijdstippen
      het genot van een roerende zaak of een effect te verschaffen of een dienst te verlenen als bedoeld in
      [artikel 4][ref1], voorzover het uitstaande saldo de kredietlimiet niet overschrijdt;


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel4
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '4'
        hoofdstuk: '1'
  - number: 1.g
    text: |-
      *eindtermen*: normen waarin is vastgelegd over welke kennis of vaardigheden een persoon dient te beschikken om een
      bepaalde financiële dienst met betrekking tot een bepaald financieel product te mogen verlenen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.h
    text: |-
      *financiële bijsluiter*: document waarin de in [artikel 39, eerste of tweede lid][ref1], genoemde onderwerpen met
      betrekking tot een complex product zijn weergegeven op de bij of krachtens dat artikel voorgeschreven wijze;


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel39
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '39'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 1.i
    text: '*gelieerde partij*:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.i.1°
    text: rechtspersoon of natuurlijke persoon die met een aanbieder van beleggingsobjecten in een groep is verbonden;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.i.2°
    text: |-
      rechtspersoon of natuurlijke persoon die direct of indirect stemrecht kan uitoefenen of anderszins bepaalde rechten
      kan uitoefenen in een aanbieder van beleggingsobjecten waardoor invloed van betekenis kan worden uitgeoefend op
      diens zakelijk of financieel beleid;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.i.3°
    text: |-
      natuurlijke persoon die een familierechtelijke betrekking of een persoonlijke relatie heeft met een bestuurder van
      een aanbieder van beleggingsobjecten of met een natuurlijke persoon als bedoeld onder 1° en 2°, op grond van welke
      betrekking of relatie hij het handelen van de bestuurder of de natuurlijke persoon met betrekking tot aanbieder van
      beleggingsobjecten kan beïnvloeden; of
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.i.4°
    text: |-
      een rechtspersoon waarin een bestuurder van een aanbieder van beleggingsobjecten of een natuurlijke persoon als
      bedoeld onder 3° direct of indirect stemrecht kan uitoefenen of anderszins bepaalde rechten kan uitoefenen waardoor
      sprake is van invloed van betekenis op het zakelijk of financieel beleid van die rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.j
    text: |-
      *hypothecair krediet*: overeenkomst inzake krediet, bij het aangaan waarvan een recht van hypotheek wordt
      gevestigd, strekkende tot verhaal bij voorrang van de vordering tot voldoening van de door de consument
      verschuldigde betaling, dan wel een overeenkomst inzake krediet met betrekking waartoe reeds een zodanig recht
      is gevestigd en waarbij het krediet wordt verleend tegen een voor hypothecaire financieringen van de aanbieder
      gebruikelijk effectief kredietvergoedingspercentage;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.k
    text: '*kosten*: bedragen die een financiële dienstverlener in rekening brengt of ten laste laat komen van een consument;'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.l
    text: '*kredietlimiet*: maximum bedrag aan:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.l.1°
    text: |-
      door de consument bij de aanbieder van krediet op te nemen geldsommen, ter uitvoering van een overeenkomst inzake
      doorlopend krediet als bedoeld in onderdeel f, aanhef en onder 1°, of
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.l.2°
    text: |-
      door de aanbieder van krediet aan de consument te verschaffen genot van een zaak of een effect, of te verlenen
      dienst als bedoeld in [artikel 4][ref1], ter uitvoering van een overeenkomst inzake doorlopend krediet als bedoeld
      in onderdeel f, aanhef en onder 2°;


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel4
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '4'
        hoofdstuk: '1'
  - number: 1.m
    text: '*kredietsom*:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.m.1°
    text: |-
      geldsom die de consument in het kader van een overeenkomst inzake geldkrediet ter beschikking wordt gesteld, met
      dien verstande, dat indien het doorlopend krediet betreft de kredietlimiet als die geldsom wordt aangemerkt, of
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.m.2°
    text: |-
      verschil tussen het totaal van de contante waarde van de roerende zaken, effecten of diensten als bedoeld in
      [artikel 4][ref1], waarvan de consument het genot wordt verschaft, onderscheidenlijk welke aan de consument worden
      verleend, in het kader van een overeenkomst inzake goederenkrediet, en de door deze in dat kader gedane contante
      betalingen, met dien verstande, dat indien het doorlopend krediet betreft de kredietlimiet als dat verschil wordt
      aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel4
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '4'
        hoofdstuk: '1'
  - number: 1.n
    text: '*kredietvergoeding*: kosten ter zake van een overeenkomst inzake krediet;'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.o
    text: |-
      *maandlast*: bedrag dat een consument verschuldigd is aan betalingen ter zake van krediet, berekend voor één
      kalendermaand;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.p
    text: |-
      *natura-uitvaartverzekering*: verzekering in verband met de verzorging van de uitvaart van de mens die uitsluitend
      strekt tot het verrichten van andere dan geldelijke prestaties;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.q
    text: |-
      *kredietprospectus*: document waarin de in [artikel 36, derde en vijfde of zesde lid][ref1], genoemde onderwerpen
      met betrekking tot een krediet zijn weergegeven op de bij of krachtens dat artikel voorgeschreven wijze;


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel36
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '36'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 1.r
    text: |-
      *provisie*: beloning of vergoeding, in welke vorm dan ook, voor het bemiddelen of adviseren ter zake van een
      financieel product;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.s
    text: '*risico-indicator:* weergave van het risiconiveau van een complex product;'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.t
    text: |-
      *schadeverzekering*: verzekering, bedoeld in
      [artikel 1, eerste lid, onder a, van de Wet toezicht verzekeringsbedrijf 1993][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel1
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '1'
  - number: 1.u
    text: |-
      *serie van beleggingsobjecten*: verzameling van beleggingsobjecten waarvoor op grond van [artikel 35][ref1]
      hetzelfde beleggingsobjectprospectus dient te worden opgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel35
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '35'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 1.v
    text: |-
      *termijnbedrag*: het bedrag van de betaling die een consument aan het einde van een betalingstermijn moet hebben
      gedaan;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.w
    text: |-
      *theoretische looptijd*: de geschatte lengte van de periode gedurende welke een consument ter zake van een
      doorlopend krediet gehouden is betalingen te doen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.x
    text: |-
      *toetstermen*: normen waarin is vastgelegd waarop een persoon wordt getoetst om te kunnen vaststellen of deze
      voldoet aan de eindtermen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.y
    text: |-
      *totale prijs van het krediet*: maandlast vermenigvuldigd met de looptijd van de overeenkomst in kalendermaanden,
      of, indien het doorlopend krediet betreft, de maandlast vermenigvuldigd met de theoretische looptijd van de
      overeenkomst uitgedrukt in kalendermaanden;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.z
    text: '*uitstaand saldo*:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.z.1°
    text: |-
      indien het geldkrediet betreft: het op enig tijdstip bestaande totaal van de tot en met dat tijdstip door de
      consument opgenomen geldsommen, vermeerderd met de tot en met dat tijdstip aan de consument in rekening gebrachte
      kredietvergoeding en verminderd met de tot en met dat tijdstip door de consument gedane betalingen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
  - number: 1.z.2°
    text: |-
      indien het goederenkrediet betreft: het op enig tijdstip bestaande totaal van de contante waarde van de roerende
      zaken, effecten of diensten als bedoeld in [artikel 4][ref1], waarvan tot en met dat tijdstip aan de consument
      het genot is verschaft, of welke tot en met dat tijdstip aan de consument zijn verleend, vermeerderd met het
      totaalbedrag van de tot en met dat tijdstip aan de consument in rekening gebrachte kredietvergoeding en verminderd
      met de tot en met dat tijdstip door de consument gedane betalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel4
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '4'
        hoofdstuk: '1'
  - number: 1.aa
    text: |-
      *de wet*: de [Wet financiële dienstverlening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018329
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018329
  - number: '2'
    text: |-
      Dit besluit is, met uitzondering van de [artikelen 26][ref1] en[ 27, vierde lid][ref2], en van
      [paragraaf 4 van hoofdstuk 7][ref3], niet van toepassing op financiële diensten die worden verleend door beheerders
      of beleggingsinstellingen als bedoeld in [artikel 12, eerste lid][ref4], of door beleggingsinstellingen als bedoeld
      in [artikel 17c, eerste lid, van de Wet toezicht beleggingsinstellingen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0019283#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0004809#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0004809#Artikel17c
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '26'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '27'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019283
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0004809
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0004809
        artikel: 17c
  - number: '3'
    text: |-
      Als financieel product in de zin van [artikel 1, onderdeel m, onder 8°, van de wet][ref1], wordt aangewezen een
      recht op het al dan niet volledige rendement in geld of op een gedeelte van de opbrengst van een zaak, niet zijnde
      een financieel product als bedoeld in [artikel 1, onderdeel m, onder 1° tot en met 7° of 9° van de wet][ref2],
      welke tegen betaling wordt verkregen, bij welke verkrijging aan de consument een rendement in geld in het
      vooruitzicht wordt gesteld en waarbij het beheer van de zaak hoofdzakelijk door de financiële dienstverlener wordt
      uitgevoerd of door een derde in opdracht van de financiële dienstverlener of de consument. Het in dit besluit met
      betrekking tot beleggingsobjecten bepaalde is van overeenkomstige toepassing op financiële producten als bedoeld in
      dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel1
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '1'
  - number: '4'
    text: |-
      Als dienst in de zin van [artikel 1, onderdeel r, onder 2°, van de wet][ref1], wordt aangewezen iedere dienst die
      niet wordt verleend op grond van een overeenkomst die strekt tot het geregeld verlenen van diensten, waarbij de
      consument gehouden is om gedurende de periode van dienstverlening in betalingstermijnen te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel1
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '1'
  - number: '5.1'
    text: |-
      Het register, bedoeld in [artikel 23 van de wet][ref1], bevat ten aanzien van vergunninghouders,
      verbonden bemiddelaars, financiële dienstverleners als bedoeld in [artikel 13, eerste lid][ref2], en
      [22, eerste lid, van de wet][ref3], en ontheffinghouders de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0018329#Artikel22
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0018329
        artikel: '22'
  - number: 5.1.a
    text: de naam en het adres van de financiële dienstverlener;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel5
  - number: 5.1.b
    text: de rechtsvorm van de financiële dienstverlener;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel5
  - number: 5.1.c
    text: |-
      indien de financiële dienstverlener een rechtspersoon is: de statutaire zetel, de statutaire naam en de handelsnaam
      of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel5
  - number: 5.1.d
    text: |-
      indien de financiële dienstverlener is ingeschreven in het handelsregister: het nummer van inschrijving bij de
      Kamer van Koophandel en Fabrieken;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel5
  - number: 5.1.e
    text: |-
      indien toepassing is gegeven aan [artikel 16 van de wet][ref1]: ten aanzien van iedere bij de rechtspersoon
      aangesloten instelling waarvoor de vergunning mede geldt de gegevens, bedoeld onder a tot en met d;


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel16
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '16'
  - number: 5.1.f
    text: |-
      de datum waarop en het nummer waaronder de vergunning of ontheffing is verleend, dan wel de datum waarop de
      verbonden bemiddelaar als zodanig is aangemeld bij de toezichthouder, dan wel de datum met ingang waarvan
      het de financiële dienstverlener als bedoeld in [artikel 13, eerste lid, van de wet][ref1] is toegestaan
      in Nederland de in dat artikel bedoelde werkzaamheden te verrichten, dan wel de datum met ingang waarvan
      [artikel 22, eerste lid, van de wet][ref2] van toepassing is op de financiële dienstverlener;


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel22
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '22'
  - number: 5.1.g
    text: |-
      de financiële producten ten aanzien waarvan de financiële dienstverlener ingevolge de wet bepaalde financiële
      diensten mag verlenen, alsmede de aard van desbetreffende financiële diensten;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel5
  - number: 5.1.h
    text: de aan de vergunning of de ontheffing gestelde voorschriften en beperkingen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel5
  - number: '5.2'
    text: 'Het register bevat voorts de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel5
  - number: 5.2.a
    text: |-
      indien het een bemiddelaar in verzekeringen betreft: de lidstaten waarin de bemiddelaar bevoegd is
      bemiddelingswerkzaamheden te verrichten en de namen van de natuurlijke personen die het beleid van de bemiddelaar
      bepalen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel5
  - number: 5.2.b
    text: |-
      indien het een gevolmachtigde agent of een ondergevolmachtigde agent betreft: de naam van de verzekeraar voor wie
      zijn volmacht geldt en de namen van de natuurlijke personen die het beleid van de gevolmachtigde agent bepalen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel5
  - number: 5.2.c
    text: |-
      indien het een verbonden bemiddelaar betreft: de gegevens, bedoeld in het eerste lid, onder a tot en met d, met
      betrekking tot de aanbieders die verantwoordelijk zijn voor de verbonden bemiddelaar en hem als zodanig bij de
      toezichthouder hebben aangemeld.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel5
  - number: '5.3'
    text: |-
      Indien zich een wijziging voordoet in de gegevens, bedoeld in het eerste of tweede lid, stelt de financiële
      dienstverlener de toezichthouder daarvan onverwijld schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel5
  - number: '6.1'
    text: |-
      Een financiële dienstverlener draagt er voor zorg dat de betrouwbaarheid van de werknemers en andere personen die
      zich onder zijn verantwoordelijkheid rechtstreeks bezighouden met financiële dienstverlening, buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel6
  - number: '6.2'
    text: |-
      Een persoon als bedoeld in het eerste lid is betrouwbaar, indien hij een verklaring omtrent het gedrag kan
      overleggen als bedoeld in de Wet justitiële gegevens en hij voorheen niet failliet is verklaard, tenzij
      rehabilitatie als bedoeld in [artikel 212 van de Faillissementswet][ref1] heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '212'
  - number: '7'
    text: |-
      Een financiële dienstverlener die voornemens is een persoon te benoemen in een functie waardoor deze persoon het
      beleid van de financiële dienstverlener bepaalt of medebepaalt, gaat daartoe niet over dan nadat de toezichthouder
      diens betrouwbaarheid heeft beoordeeld en heeft meegedeeld dat deze buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel7
  - number: '8'
    text: |-
      De betrouwbaarheid van een persoon die het beleid van de financiële dienstverlener bepaalt of medebepaalt
      staat buiten twijfel wanneer dat eenmaal door de toezichthouder is vastgesteld voor de toepassing van
      de wet, de [Wet toezicht effectenverkeer 1995][ref1] of de [Wet toezicht beleggingsinstellingen][ref2]
      of door De Nederlandsche Bank N.V. voor de toepassing van de [Wet toezicht kredietwezen 1992][ref3], de
      [Wet toezicht verzekeringsbedrijf 1993][ref4] of de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref5],
      zolang niet een wijziging in de relevante feiten of omstandigheden een redelijke aanleiding geeft tot een nieuwe
      beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007657
      [ref2]: https://wetten.overheid.nl/BWBR0004809
      [ref3]: https://wetten.overheid.nl/BWBR0005792
      [ref4]: https://wetten.overheid.nl/BWBR0006509
      [ref5]: https://wetten.overheid.nl/BWBR0007477
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007657
      - id: ref2
        bwb_id: BWBR0004809
      - id: ref3
        bwb_id: BWBR0005792
      - id: ref4
        bwb_id: BWBR0006509
      - id: ref5
        bwb_id: BWBR0007477
  - number: '9'
    text: |-
      Indien een financiële dienstverlener in het kader van zijn normale bedrijfsvoering constateert dat zich een
      wijziging heeft voorgedaan in de voor de beoordeling van de betrouwbaarheid relevante gegevens met betrekking tot
      een persoon die het beleid van de financiële dienstverlener bepaalt of medebepaalt, stelt hij de toezichthouder
      daarvan onverwijld schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel9
  - number: '10'
    text: |-
      De in [artikel 28, derde lid, onder a, van de wet][ref1] bedoelde maatregelen betreffen in ieder geval de
      behandeling en de administratieve vastlegging van incidenten die een ernstig gevaar vormen voor een integere
      bedrijfsvoering, voorzover het gedragingen betreft van personen die:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel28
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '28'
  - number: 10.a
    text: het dagelijks beleid bepalen dan wel medebepalen van de financiële dienstverlener;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel10
  - number: 10.b
    text: een leidinggevende functie bekleden anders dan de personen bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel10
  - number: 10.c
    text: |-
      zich onder de verantwoordelijkheid van de financiële dienstverlener rechtstreeks bezighouden met financiële
      dienstverlening; of
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel10
  - number: 10.d
    text: |-
      een functie bekleden waaraan een wezenlijk risico is verbonden voor de integere bedrijfsvoering van de financiële
      dienstverlener.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel10
  - number: '11'
    text: |-
      De administratieve vastlegging van incidenten als bedoeld in [artikel 10][ref1] omvat ten minste de feiten en
      omstandigheden van het incident, informatie over de functie van degene of degenen die het incident heeft of hebben
      bewerkstelligd en de maatregelen die naar aanleiding van het incident zijn genomen. De financiële dienstverlener
      bewaart de aldus vastgelegde gegevens gedurende ten minste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel10
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '10'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '12.1'
    text: |-
      Een financiële dienstverlener informeert de toezichthouder omtrent een incident als bedoeld in [artikel 10][ref1]
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel10
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '10'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 12.1.a
    text: aangifte van het incident bij justitiële autoriteiten is of zal worden gedaan;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel12
  - number: 12.1.b
    text: |-
      het voortbestaan van de financiële dienstverlener door het incident zou kunnen worden bedreigd of wordt bedreigd;
      of
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel12
  - number: 12.1.c
    text: |-
      de ernst, de omvang of de overige omstandigheden van het incident in aanmerking genomen, de toezichthouder in
      verband met haar toezichthoudende taak redelijkerwijs behoort te worden geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel12
  - number: '12.2'
    text: 'De in het eerste lid bedoelde informatie betreft ten minste:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel12
  - number: 12.2.a
    text: de feiten en omstandigheden van het incident; en
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel12
  - number: 12.2.b
    text: informatie over de functie van degene of degenen die het incident heeft of hebben bewerkstelligd.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel12
  - number: '13'
    text: |-
      Een financiële dienstverlener is niet met natuurlijke personen of rechtspersonen verbonden in een formele of
      feitelijke zeggenschapsstructuur:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel13
  - number: 13.a
    text: |-
      indien deze zeggenschapsstructuur in zodanige mate ondoorzichtig is dat deze een belemmering vormt of kan vormen
      voor het adequaat uitoefenen van toezicht op de financiële dienstverlener;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel13
  - number: 13.b
    text: |-
      indien het recht van een staat die geen lidstaat is dat op de personen, bedoeld in de aanhef, van toepassing is een
      belemmering vormt of kan vormen voor het adequaat uitoefenen van toezicht op de financiële dienstverlener.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel13
  - number: '15'
    text: |-
      Een aanbieder van krediet bewaart de informatie die hij ingevolge [artikel 51, eerste lid, van de wet][ref1]
      en de[ artikelen 59 ][ref2]en [60][ref3] heeft ingewonnen, alsmede de door hem aangeboden overeenkomst inzake
      krediet, indien die overeenkomst tot stand is gekomen, ten minste tot vijf jaren na de dag waarop die overeenkomst
      is afgewikkeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0019283#Artikel60
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '59'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019283
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: '2'
  - number: '16.1'
    text: |-
      De personen, bedoeld in [artikel 27, tweede lid, van de wet][ref1], worden als deskundig beschouwd indien
      zij voldoen aan de in [bijlage 1][ref2] opgenomen eindtermen alsmede, voorzover betrokkenen zich rechtstreeks
      bezighouden met financiële dienstverlening ten aanzien van de hierna genoemde financiële producten, aan de
      eindtermen opgenomen in de volgende bijlagen:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0019283
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0019283
  - number: 16.1.a
    text: |-
      hypothecair krediet, al dan niet gecombineerd met opstal-, inboedel-, arbeidsongeschiktheids- of
      overlijdensrisicoverzekeringen, waarbij de verplichting van de aanbieder tot het doen van een uitkering of
      een reeks van uitkeringen alleen dan ontstaat, indien het overlijden van degene op wiens leven de verzekering
      betrekking heeft plaatsvindt voor de in de polis genoemde datum: [bijlagen 2][ref1] en [6][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019283
      [ref2]: https://wetten.overheid.nl/BWBR0019283
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019283
      - id: ref2
        bwb_id: BWBR0019283
  - number: 16.1.b
    text: |-
      consumptief krediet, al dan niet gecombineerd met arbeidsongeschiktheidsverzekeringen: [bijlage 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019283
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019283
  - number: 16.1.c
    text: |-
      schadeverzekeringen: [bijlage 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019283
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019283
  - number: 16.1.d
    text: |-
      levensverzekeringen, al dan niet gecombineerd met arbeidsongeschiktheidsverzekeringen: [bijlagen 5][ref1] en
      [6][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019283
      [ref2]: https://wetten.overheid.nl/BWBR0019283
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019283
      - id: ref2
        bwb_id: BWBR0019283
  - number: 16.1.e
    text: |-
      beleggen a: [bijlage 6][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0019283
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019283
  - number: 16.1.f
    text: |-
      beleggen b: [bijlage 7][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0019283
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019283
  - number: '16.2'
    text: |-
      De personen, bedoeld in [artikel 27, tweede lid, van de wet][ref1], die optreden als gevolmachtigde agent of
      als ondergevolmachtigde agent, worden als deskundig beschouwd indien zij voldoen aan de in [bijlagen 1][ref2] en
      [8][ref3] opgenomen eindtermen.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0019283
      [ref3]: https://wetten.overheid.nl/BWBR0019283
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0019283
      - id: ref3
        bwb_id: BWBR0019283
  - number: '17.1'
    text: |-
      Een financiële dienstverlener voldoet aan het in [artikel 27, tweede lid, eerste volzin, van de wet][ref1]
      bepaalde, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel27
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '27'
  - number: 17.1.a
    text: |-
      zijn werknemers en andere personen die zich onder zijn verantwoordelijkheid rechtstreeks bezighouden met financiële
      dienstverlening, niet zijnde feitelijke leidinggevenden, allen beschikken over een geldig diploma voor de in
      hun geval relevante eindtermen, bedoeld in [artikel 16][ref1], afgegeven door een door Onze Minister erkend
      exameninstituut; of


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel16
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '16'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 17.1.b
    text: |-
      hij zijn bedrijfsvoering zodanig heeft ingericht dat deze een deskundige financiële dienstverlening aan consumenten
      anderszins voldoende waarborgt.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel17
  - number: '17.2'
    text: |-
      Een financiële dienstverlener voldoet aan het in [artikel 27, tweede lid, tweede volzin, van de wet][ref1]
      bepaalde, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel27
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '27'
  - number: 17.2.a
    text: |-
      de in die volzin bedoelde feitelijk leidinggevenden beschikken over een geldig diploma voor de in hun geval
      relevante eindtermen, bedoeld in [artikel 16][ref1], afgegeven door een door Onze Minister erkend exameninstituut;
      of


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel16
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '16'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 17.2.b
    text: |-
      hij een financiële dienstverlener is met een gemiddeld aantal werknemers van meer dan 50 en hij zijn
      bedrijfsvoering zodanig heeft ingericht dat deze een deskundige financiële dienstverlening aan consumenten
      voldoende waarborgt.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel17
  - number: '17.3'
    text: |-
      Onverminderd het eerste en tweede lid, voldoet een verbonden bemiddelaar ook aan het bepaalde in
      [artikel 27, tweede lid, van de wet][ref1], indien zijn bedrijfsvoering zodanig is ingericht dat de aanbieder voor
      wie hij als verbonden bemiddelaar optreedt een deskundige financiële dienstverlening aan consumenten voldoende
      waarborgt.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel27
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '27'
  - number: '17.4'
    text: |-
      Onverminderd het eerste en tweede lid, voldoet een aangesloten instelling als bedoeld in
      [artikel 16 van de wet][ref1] ook aan het bepaalde in [artikel 27, tweede lid, van de wet][ref2], indien hij zijn
      bedrijfsvoering zodanig heeft ingericht dat de rechtspersoon bij wie hij is aangesloten een deskundige financiële
      dienstverlening aan consumenten voldoende waarborgt.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel27
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '27'
  - number: '18.1'
    text: 'Een diploma is geldig zolang de houder ervan:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel18
  - number: 18.1.a
    text: |-
      binnen achttien maanden na de in [artikel 19, vierde lid][ref1], bedoelde openbaarmaking op de door Onze Minister
      vastgestelde wijze voldoet aan de in zijn geval relevante toetstermen voor permanente educatie, bedoeld in
      [artikel 19, tweede lid][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel19
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 18.1.b
    text: |-
      binnen achttien maanden na de in [artikel 19, vierde lid][ref1], bedoelde openbaarmaking van toetstermen voor
      permanente educatie, met goed gevolg een examen heeft afgelegd van een door Onze Minister erkend exameninstituut
      dat voldoet aan de in zijn geval relevante toetstermen die tegelijkertijd met eerder genoemde toetstermen voor
      permanente educatie openbaar zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel19
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '18.2'
    text: |-
      Indien een houder van een diploma niet tijdig voldoet aan de in zijn geval relevante toetstermen voor permanente
      educatie, is het diploma ongeldig tot het moment dat hij alsnog voldoet aan de in zijn geval relevante toetstermen
      voor permanente educatie, bedoeld in [artikel 19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel19
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '19.1'
    text: |-
      Bij ministeriële regeling worden toetstermen vastgesteld voor de examens die leiden tot afgifte van een diploma als
      bedoeld in [artikel 21, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel21
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '21'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '19.2'
    text: |-
      Indien ontwikkelingen op de financiële markten of daarop betrekking hebbende regelgeving daartoe aanleiding geven
      worden bij ministeriële regeling toetstermen vastgesteld met betrekking tot permanente educatie, alsmede de wijze
      waarop aan deze toetstermen kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel19
  - number: '19.3'
    text: |-
      Onze Minister stelt belanghebbenden in de gelegenheid te reageren op een voorgenomen ministeriële regeling als
      bedoeld in het eerste of tweede lid, alvorens tot vaststelling daarvan over te gaan.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel19
  - number: '19.4'
    text: |-
      Onze Minister draagt er zorg voor dat de openbaarmaking van de toetstermen voor examens voor een bepaald jaar en de
      toetstermen voor permanente educatie voor dat jaar gelijktijdig plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel19
  - number: '20.1'
    text: |-
      Onze Minister erkent een exameninstituut op aanvraag, indien de aanvrager heeft aangetoond te kunnen voldoen aan
      [artikel 21, tweede, derde, vijfde, zesde en zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel21
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '21'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '20.2'
    text: |-
      Onze Minister beslist op een aanvraag om erkenning binnen vier maanden nadat de aanvraag is ingediend. De
      beslissingstermijn kan ten hoogste tweemaal met twee maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel20
  - number: '20.3'
    text: Onze Minister kan aan een erkenning voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel20
  - number: '20.4'
    text: 'Onze Minister kan een erkenning intrekken:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel20
  - number: 20.4.a
    text: op verzoek van het erkende exameninstituut;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel20
  - number: 20.4.b
    text: |-
      indien de gegevens en bescheiden die zijn verstrekt ter verkrijging van de erkenning na de erkenning zodanig
      onjuist of onvolledig blijken, dat de erkenning zou zijn geweigerd, dan wel niet zonder het verbinden van
      voorschriften zou zijn verleend, indien bij de behandeling van de aanvraag de juiste gegevens volledig bekend waren
      geweest;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel20
  - number: 20.4.c
    text: |-
      indien het exameninstituut niet langer voldoet aan [artikel 21][ref1] of [22][ref2] of een voorschrift, verbonden
      aan de erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel22
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '21'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '20.5'
    text: |-
      Van een besluit tot erkenning of tot intrekking van een erkenning van een exameninstituut doet Onze Minister
      mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel20
  - number: '21.1'
    text: |-
      Een erkend exameninstituut geeft een diploma af aan een kandidaat die een door het erkende exameninstituut
      afgenomen examen met goed gevolg heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: '21.2'
    text: |-
      Een erkend exameninstituut dat tevens opleidingen aanbiedt, brengt een zodanige scheiding aan in de bedrijfsvoering
      tussen het ontwikkelen en verzorgen van opleidingen en het afnemen van examens dat belangenverstrengeling tussen
      deze activiteiten wordt voorkomen. Daartoe treft een erkend exameninstituut in ieder geval adequate maatregelen,
      gericht op:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.2.a
    text: |-
      het voeren van gescheiden administraties voor het ontwikkelen en verzorgen van opleidingen en voor het afnemen
      van examens;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.2.b
    text: |-
      het voorkomen van toegang tot examenmateriaal van werknemers die op enige wijze betrokken zijn bij de ontwikkeling
      of de verzorging van een opleiding, gericht op het desbetreffende examen.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: '21.3'
    text: |-
      Een erkend exameninstituut stelt de door hem aangeboden examens open voor een ieder, ongeacht of de betrokkene een
      opleiding aan het exameninstituut heeft gevolgd.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: '21.4'
    text: |-
      Een door een erkend exameninstituut af te nemen examen voldoet binnen zes maanden na de in
      [artikel 19, vierde lid][ref1], bedoelde openbaarmaking aan de door Onze Minister vastgestelde toetstermen, bedoeld
      in [artikel 19, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel19
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '21.5'
    text: |-
      Een erkend exameninstituut neemt ten aanzien van de wijze van examinering de maatregelen die redelijkerwijs nodig
      zijn om te bevorderen dat examens op een correcte en eerlijke wijze worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: '21.6'
    text: |-
      Een erkend exameninstituut draagt zorg voor een vakinhoudelijk juiste en objectieve beoordeling van afgenomen
      examens.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: '21.7'
    text: |-
      Een erkend exameninstituut beschikt over en handelt in overeenstemming met een examenreglement waarin ten minste de
      volgende onderwerpen adequaat zijn geregeld:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.a
    text: de wijze van aanmelding van de kandidaat;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.b
    text: het aantal malen dat per jaar gelegenheid wordt gegeven tot het afleggen van de afzonderlijke examens;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.c
    text: de wijze van kennisgeving van plaats, datum en tijdstip van aanvang der examens;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.d
    text: de legitimatie van de kandidaat;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.e
    text: de duur en wijze van examineren;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.f
    text: de maatregelen in geval onregelmatigheden worden geconstateerd;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.g
    text: de aanwijzing van de examinatoren bij de mondelinge examens;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.h
    text: de beoordeling van het examen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.i
    text: |-
      de termijn waarbinnen de examenuitslag wordt bekendgemaakt, alsmede de termijn waarbinnen het diploma wordt
      uitgereikt;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.j
    text: de aanwijzing van degene of degenen die de uitslag van het schriftelijk examen vaststelt dan wel vaststellen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.k
    text: de beoordelingsnormen en normen voor slagen en afwijzen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.l
    text: de wijze van verkrijgbaarstelling van de richtlijnantwoorden na afloop van een examen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.m
    text: de inzage in het afgelegde examen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.n
    text: de bewaartermijnen voor de afgelegde examens;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: 21.7.o
    text: de interne klachtenprocedure.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: '21.8'
    text: |-
      Een erkend exameninstituut verstrekt jaarlijks voor 1 juli aan Onze Minister een opgave van het aantal in het
      vorige kalenderjaar afgenomen en beoordeelde examens, alsmede een analyse van de resultaten van deze examens, de
      klachten die hierover zijn geuit en de beslissingen hierop van het exameninstituut.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
  - number: '21.9'
    text: |-
      Het tweede en derde lid zijn niet van toepassing op bekostigde instellingen voor hoger onderwijs als bedoeld in
      [artikel 1.8, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '22'
    text: |-
      Een erkend exameninstituut verstrekt aan Onze Minister op diens verzoek de gegevens die Onze Minister nodig heeft
      voor de uitoefening van zijn in dit hoofdstuk omschreven taken.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel22
  - number: '23.1'
    text: |-
      De beroepsaansprakelijkheidsverzekering, bedoeld in [artikel 29 van de wet][ref1], dekt de aansprakelijkheid van
      de bemiddelaar in verzekeringen of de herverzekeringsbemiddelaar wegens fouten, verzuimen of nalatigheden begaan in
      de uitoefening van diens beroep en voorgevallen op het grondgebied waarop de Overeenkomst betreffende de Europese
      Economische Ruimte van toepassing is, voor een bedrag van ten minste € 1.000.000,– per schadegeval, en in totaal
      ten minste € 1.500.000,– per jaar voor alle schadegevallen gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel29
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '29'
  - number: '23.2'
    text: |-
      De beroepsaansprakelijkheidsverzekering wordt gesloten bij een verzekeraar die in het bezit is van een
      in [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1] bedoelde vergunning voor
      de branche Algemene aansprakelijkheid of die heeft voldaan aan de ingevolge de [artikelen 37][ref2] en
      [38 van de Wet toezicht verzekeringsbedrijf 1993][ref3] vereiste procedure met betrekking tot een bijkantoor
      in Nederland dan wel, indien het de in die wet bedoelde dienstverrichting naar Nederland betreft, heeft
      voldaan aan het bepaalde in de [artikelen 111, eerste of tweede lid][ref4], [113, eerste of vierde lid][ref5],
      [116, eerste of derde lid][ref6], of [118, tweede of vijfde lid, van die wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0006509#Artikel111
      [ref5]: https://wetten.overheid.nl/BWBR0006509#Artikel113
      [ref6]: https://wetten.overheid.nl/BWBR0006509#Artikel116
      [ref7]: https://wetten.overheid.nl/BWBR0006509#Artikel118
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0006509
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0006509
        artikel: '111'
      - id: ref5
        bwb_id: BWBR0006509
        artikel: '113'
      - id: ref6
        bwb_id: BWBR0006509
        artikel: '116'
      - id: ref7
        bwb_id: BWBR0006509
        artikel: '118'
  - number: '24.1'
    text: |-
      Onder een vergelijkbare voorziening als bedoeld in [artikel 29 van de wet][ref1] wordt verstaan een
      onvoorwaardelijke garantstelling voor alle verplichtingen voortvloeiend uit aansprakelijkheid van de bemiddelaar in
      verzekeringen of de herverzekeringsbemiddelaar wegens fouten, verzuimen of nalatigheden, begaan in de uitoefening
      van diens beroep en voorgevallen op het grondgebied waarop de Overeenkomst betreffende de Europese Economische
      Ruimte van toepassing is, voor een bedrag van ten minste € 1.000.000,– per schadegeval, en in totaal ten minste
      € 1.500.000,– per jaar voor alle schadegevallen gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel29
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '29'
  - number: '24.2'
    text: |-
      De onvoorwaardelijke garantstelling wordt verstrekt door een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1], die ingevolge
      [artikel 52, tweede lid, onder a, b, c of d, van die wet][ref2] is ingeschreven in het in dat artikel bedoelde
      register of door een overeenkomstige onderneming of instelling die haar zetel heeft in een andere lidstaat, de
      Verenigde Staten van Amerika, Japan, Australië, Canada of Zwitserland en in de staat van haar zetel onder toezicht
      staat.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '52'
  - number: '25'
    text: |-
      De in [artikel 23, eerste lid][ref1], en [artikel 24, eerste lid][ref2], genoemde bedragen worden bij ministeriële
      regeling aangepast aan de veranderingen in het door Eurostat bekend gemaakte Europees indexcijfer van de
      consumentenprijzen, voor de eerste maal met ingang van 1 januari 2008 en vervolgens om de vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel24
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '23'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '24'
        hoofdstuk: '6'
  - number: '26.1'
    text: |-
      Een financiële dienstverlener verstrekt de krachtens de [artikelen 33][ref1] en [34 van de wet][ref2] en dit
      hoofdstuk, aan de consument te verstrekken informatie schriftelijk, tenzij hiervan in dit hoofdstuk wordt
      afgeweken. Een financiële dienstverlener kan de informatie via een andere duurzame drager verstrekken, indien hij
      zich ervan heeft vergewist dat de consument over de benodigde middelen beschikt om kennis te nemen van de aldus te
      verstrekken informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel34
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '34'
  - number: '26.2'
    text: |-
      Een financiële dienstverlener verstrekt de informatie, bedoeld in het eerste lid, alsmede de informatie, bedoeld in
      [artikel 43][ref1], in de Nederlandse taal. De informatie kan in een andere taal worden verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel43
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '43'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: 26.2.a
    text: indien de consument daarom verzoekt en de financiële dienstverlener hiermee heeft ingestemd;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel26
  - number: 26.2.b
    text: |-
      indien partijen een keuze hebben gemaakt voor de toepasselijkheid op de overeenkomst inzake een financieel product
      van het recht van een andere staat; of
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel26
  - number: 26.2.c
    text: |-
      op verzoek van een beheerder of beleggingsinstelling als bedoeld in [artikel 12, eerste lid][ref1], of
      [artikel 17c, eerste lid, van de Wet toezicht beleggingsinstellingen][ref2], indien het informatie, bedoeld in
      [artikel 39, tweede lid][ref3], betreft en de toezichthouder hiermee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel17c
      [ref3]: https://wetten.overheid.nl/BWBR0019283#Artikel39
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: 17c
      - id: ref3
        bwb_id: BWBR0019283
        artikel: '39'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: '27.1'
    text: |-
      Indien een financiële dienstverlener in een reclame-uiting, anders dan via de televisie of de radio, informatie
      verstrekt over een complex product, verstrekt hij daarbij tevens informatie over de belangrijkste financiële
      risico’s van dat product, die onder meer inzichtelijk worden gemaakt door een risico-indicator, en, indien het een
      beleggingsobject betreft, de belangrijkste overige risico’s die samenhangen met dat product.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel27
  - number: '27.2'
    text: |-
      Indien een financiële dienstverlener in een reclame-uiting via de televisie informatie verstrekt over een complex
      product, verstrekt hij daarbij tevens informatie over de belangrijkste financiële risico’s van dat product door het
      weergeven van een risico-indicator, en, indien het een beleggingsobject betreft, de belangrijkste overige risico’s
      die samenhangen met dat product.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel27
  - number: '27.3'
    text: |-
      Indien een financiële dienstverlener in een reclame-uiting via de radio informatie verstrekt over een complex
      product, verstrekt hij daarbij tevens informatie over de belangrijkste financiële risico’s van dat product, en,
      indien het een beleggingsobject betreft, de belangrijkste overige risico’s die samenhangen met dat product.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel27
  - number: '27.4'
    text: |-
      Indien een financiële dienstverlener voorafgaande aan de totstandkoming van een overeenkomst inzake een complex
      product informatie verstrekt over dat product, verwijst hij daarbij tevens naar de financiële bijsluiter.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel27
  - number: '27.5'
    text: |-
      Indien een financiële dienstverlener voorafgaande aan de totstandkoming van een overeenkomst inzake een complex
      product, anders dan in een reclame-uiting via de televisie of de radio, informatie verstrekt over een historisch
      of toekomstig rendement, verstrekt hij daarbij tevens informatie over de belangrijkste kosten en de belangrijkste
      financiële risico’s van dat product en, indien het een beleggingsobject betreft, over de belangrijkste overige
      risico’s die samenhangen met dat product.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel27
  - number: '27.6'
    text: |-
      Indien een financiële dienstverlener in een reclame-uiting via de televisie of de radio informatie verstrekt over
      een historisch of toekomstig rendement van een complex product, verstrekt hij daarbij of op enig ander moment
      voorafgaande aan de totstandkoming van een overeenkomst inzake dat product tevens informatie over de belangrijkste
      kosten van dat product.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel27
  - number: '27.7'
    text: |-
      Indien een financiële dienstverlener voorafgaande aan de totstandkoming van een overeenkomst inzake een complex
      product informatie verstrekt over een gegarandeerd rendement, verstrekt hij daarbij of, indien de informatie wordt
      verstrekt in een reclame-uiting, op enig ander moment voorafgaande aan de totstandkoming van de overeenkomst inzake
      dat product, tevens informatie over de belangrijkste voorwaarden van die garantie.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel27
  - number: '27.8'
    text: |-
      [Artikel 26, eerste lid, eerste volzin][ref1], is niet van toepassing op het verstrekken van informatie in een
      reclame-uiting als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel26
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '26'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '28.1'
    text: |-
      Indien een financiële dienstverlener in een reclame-uiting inzake krediet, anders dan via de televisie of de radio,
      informatie verstrekt over een effectief kredietvergoedingspercentage of een maandlast van een krediet, verstrekt
      hij daarbij, naast het effectief kredietvergoedingspercentage en de maandlast, tevens informatie over:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.1.a
    text: de voor de berekening van dat percentage en die maandlast gehanteerde kredietsom of kredietlimiet;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.1.b
    text: de voor de berekening van dat percentage en die maandlast gehanteerde looptijd of theoretische looptijd;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.1.c
    text: de voor de berekening van dat percentage en die maandlast gehanteerde totale prijs van het krediet;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.1.d
    text: het feit dat het een krediet, niet zijnde een doorlopend krediet of een doorlopend krediet betreft; en
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.1.e
    text: |-
      indien van toepassing, de om in aanmerking te komen voor het aangeboden krediet af te sluiten verzekeringen en ten
      behoeve van de aanbieder te vestigen zekerheidsrechten.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: '28.2'
    text: |-
      Indien een financiële dienstverlener in een reclame-uiting inzake krediet via de televisie of radio informatie
      verstrekt over een effectief kredietvergoedingspercentage, of een maandlast van een krediet en een kredietsom of
      kredietlimiet, verstrekt hij:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.2.a
    text: |-
      in die reclame-uiting tevens informatie over de voor de berekening van dat percentage of die maandlast gehanteerde
      totale prijs van het krediet en de voor de berekening van dat percentage of die maandlast gehanteerde kredietsom
      of kredietlimiet;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.2.b
    text: |-
      op enig ander moment voorafgaand aan de totstandkoming van een overeenkomst inzake krediet, naast het effectief
      kredietvergoedingspercentage, de maandlast, de voor de berekening van dat percentage en die maandlast gehanteerde
      kredietsom of kredietlimiet en de voor de berekening van dat percentage en die maandlast gehanteerde totale prijs
      van het krediet, informatie over:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.2.b.1°
    text: de voor de berekening van dat percentage en die maandlast gehanteerde looptijd of de theoretische looptijd;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.2.b.2°
    text: het feit dat het een krediet, niet zijnde een doorlopend krediet of een doorlopend krediet betreft; en
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.2.b.3°
    text: |-
      indien van toepassing, de om in aanmerking te komen voor het aangeboden krediet af te sluiten verzekeringen en ten
      behoeve van de aanbieder te vestigen zekerheidsrechten.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: '28.3'
    text: |-
      In een reclame-uiting inzake consumptief krediet wordt de in het eerste en tweede lid bedoelde maandlast niet lager
      weergegeven dan 2% van de betrokken kredietlimiet, bij een reclame-uiting inzake doorlopend krediet, dan wel niet
      lager dan 2% van de betrokken kredietsom, bij een reclame-uiting inzake niet-doorlopend krediet.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: '28.4'
    text: |-
      Een financiële dienstverlener geeft de in de aanhef en in de onderdelen a tot en met c van het eerste lid
      bedoelde informatie, de in onderdeel b, aanhef en onder 1°, van het tweede lid bedoelde informatie en, indien van
      toepassing, de informatie bedoeld in het zesde lid, gecombineerd weer in een tabel waarin geen andere informatie
      wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: '28.5'
    text: |-
      Indien een financiële dienstverlener in een reclame-uiting inzake krediet reclame maakt voor met
      krediet aan te schaffen goederen of diensten, verstrekt hij daarbij tevens informatie over het effectief
      kredietvergoedingspercentage.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: '28.6'
    text: |-
      Indien eenfinanciële dienstverlener in een reclame-uiting inzake krediet informatie verstrekt over een effectief
      kredietvergoedingspercentage of over een kredietvergoeding welke voor een beperkte duur geldt, dan wel in een
      reclame-uiting inzake krediet informatie verstrekt over een variabele kredietvergoeding welke voor een beperkte
      duur afwijkt van de variabele kredietvergoeding die op het moment van het doen van de reclame-uiting geldt voor
      overeenkomsten inzake krediet van gelijke soort, omvang en duur:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.6.a
    text: |-
      verstrekt hij daarbij tevens informatie over de periode gedurende welke het aangeboden effectief
      kredietvergoedingspercentage of de kredietvergoeding geldt;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.6.b
    text: |-
      verstrekt hij daarbij tevens informatie over de hoogte van het effectief kredietvergoedingspercentage
      of de kredietvergoeding na afloop van deze periode, waarbij indien de hoogte van het effectief
      kredietvergoedingspercentage of de kredietvergoeding variabel is, hij informatie verstrekt over de op het moment
      van het doen van de reclame-uiting geldende variabele kredietvergoeding voor overeenkomsten inzake krediet van
      gelijke soort, omvang en duur; en
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.6.c
    text: |-
      baseert hij de overige op grond van het eerste of het tweede lid te verstrekken informatie over de kenmerken van
      het krediet op het effectief kredietvergoedingspercentage of op de kredietvergoeding na afloop van deze periode.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: '28.7'
    text: |-
      Indien een financiële dienstverlener in een reclame-uiting inzake krediet informatie verstrekt over de hoogte van
      de kredietvergoeding, verstrekt hij daarbij tevens informatie over het effectief kredietvergoedingspercentage.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: '28.8'
    text: |-
      Indien een financiële dienstverlener in een reclame-uiting inzake krediet informatie verstrekt over de hoogte van
      een korting op een effectief kredietvergoedingspercentage of op een kredietvergoeding, verstrekt hij daarbij tevens
      informatie over het effectief kredietvergoedingspercentage, dan wel de kredietvergoeding waar de korting op van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: '28.9'
    text: |-
      Indien een financiële dienstverlener in een reclame-uiting inzake krediet informatie verstrekt over het effectief
      kredietvergoedingspercentage, duidt hij deze aan als «effectieve rente op jaarbasis».
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: '28.10'
    text: 'Een financiële dienstverlener:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.10.a
    text: |-
      neemt in een reclame-uiting inzake krediet geen vermeldingen op aangaande de termijn waarbinnen of het tijdstip
      waarop over een kredietaanvraag wordt beslist, de overeenkomst inzake krediet tot stand kan komen, of de consument
      over het krediet kan beschikken;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.10.b
    text: |-
      brengt in een reclame-uiting inzake krediet niet tot uiting dat lopende overeenkomsten inzake krediet bij de
      beoordeling van een kredietaanvraag geen of een ondergeschikte rol spelen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: 28.10.c
    text: |-
      geeft in een reclame-uiting inzake krediet geen kenmerken van het krediet weer waarin fiscale voordelen zijn
      verwerkt.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: '28.11'
    text: |-
      Indien een financiële dienstverlener in een reclame-uiting informatie verstrekt over een krediet, verstrekt hij
      daarbij tevens informatie over de verkrijgbaarheid van het prospectus, bedoeld in [artikel 36][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel36
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '36'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '28.12'
    text: |-
      Indien een financiële dienstverlener informatie verstrekt over de kenmerken van het krediet, bedoeld in het eerste
      lid en onderdeel b, aanhef en onder 1°, van het tweede lid, zijn het derde en vierde lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
  - number: '28.13'
    text: |-
      [Artikel 26, eerste lid, eerste volzin][ref1], is niet van toepassing op het verstrekken van informatie in een
      reclame-uiting als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel26
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '26'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '29'
    text: |-
      De toezichthouder kan regels stellen met betrekking tot de wijze van verstrekking van de informatie, bedoeld in
      de [artikelen 27][ref1] en [28][ref2], alsmede met betrekking tot de berekening van historische of toekomstige
      rendementen, kosten en risico’s als bedoeld in [artikel 27, eerste, tweede, derde, vijfde en zesde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0019283#Artikel27
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '27'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '28'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019283
        artikel: '27'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '30.1'
    text: |-
      Een financiële dienstverlener verstrekt een consument voorafgaande aan de totstandkoming van een overeenkomst
      inzake een financieel product ten minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel30
  - number: 30.1.a
    text: |-
      zijn naam en adres en, indien de financiële dienstverlener een rechtspersoon is, de statutaire naam en handelsnaam
      of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel30
  - number: 30.1.b
    text: de aard van zijn financiële dienstverlening;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel30
  - number: 30.1.c
    text: |-
      zijn interne klachtenprocedure, bedoeld in [artikel 37, eerste lid, onder a, van de wet][ref1] en de erkende
      geschilleninstantie waarbij hij is aangesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel37
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '37'
  - number: 30.1.d
    text: zijn registratie bij de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel30
  - number: '30.2'
    text: |-
      In afwijking van [artikel 26, eerste lid][ref1], mag de in het eerste lid en de in de [artikelen 33][ref2]
      en [34 van de wet][ref3] bedoelde informatie op verzoek van de consument mondeling worden verstrekt, indien
      het financiële product een verzekering is en onmiddellijke dekking noodzakelijk is. In dat geval verstrekt de
      financiële dienstverlener de informatie tevens onmiddellijk na de totstandkoming van de overeenkomst overeenkomstig
      [artikel 26, eerste lid][ref4], aan de consument.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0018329#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0019283#Artikel26
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '26'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0018329
        artikel: '34'
      - id: ref4
        bwb_id: BWBR0019283
        artikel: '26'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '31.1'
    text: |-
      Onverminderd [artikel 30][ref1] verstrekt een aanbieder van schadeverzekeringen een consument voorafgaande aan de
      totstandkoming van een overeenkomst inzake een schadeverzekering, voorzover van toepassing, ten minste de volgende
      informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel30
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '30'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 31.1.a
    text: zijn rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel31
  - number: 31.1.b
    text: het recht dat op de overeenkomst van toepassing is, of de door de aanbieder voorgestelde rechtskeuze;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel31
  - number: 31.1.c
    text: |-
      de naam en het adres van de schade-afhandelaar, bedoeld in
      [artikel 109, eerste lid, onderdeel e, van de Wet toezicht verzekeringsbedrijf 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel109
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '109'
  - number: '31.2'
    text: |-
      In afwijking van het eerste lid kan de in dat lid bedoelde informatie onmiddellijk na de totstandkoming van
      de overeenkomst worden verstrekt, of uiterlijk tegelijk met het afgeven van de polis, indien de consument het
      recht heeft zonder een boete verschuldigd te zijn en zonder opgave van redenen de overeenkomst binnen veertien
      kalenderdagen na de dag waarop hij de informatie heeft ontvangen te ontbinden en de consument is geïnformeerd over
      de wijze waarop hij gebruik kan maken van dat recht;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel31
  - number: '31.3'
    text: |-
      Indien een schadeverzekering wordt aangeboden door tussenkomst van een bemiddelaar, een gevolmachtigde agent of
      een ondergevolmachtigde agent, wordt de in het eerste lid bedoelde informatie door deze bemiddelaar, gevolmachtigde
      agent of ondergevolmachtigde agent verstrekt, tenzij de aanbieder en de bemiddelaar, gevolmachtigde agent of
      ondergevolmachtigde agent zijn overeengekomen dat de aanbieder zelf aan deze verplichting voldoet.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel31
  - number: '32.1'
    text: |-
      Onverminderd [artikel 30][ref1] verstrekt een aanbieder van levensverzekeringen een consument voorafgaande aan de
      totstandkoming van een overeenkomst inzake een levensverzekering, voorzover van toepassing, ten minste de volgende
      informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel30
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '30'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 32.1.a
    text: zijn rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.b
    text: |-
      het bedrag van de uitkering of uitkeringen waartoe hij zich verplicht of, voorzover dit bedrag niet op voorhand
      nauwkeurig kan worden bepaald, een nauwkeurige omschrijving van die uitkering of uitkeringen, alsmede van de
      factoren waarvan de hoogte van de uitkering of uitkeringen afhankelijk is;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.c
    text: |-
      een omschrijving van de keuzemogelijkheden die de consument of de gerechtigde op een uitkering heeft ingevolge
      de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.d
    text: |-
      een nauwkeurige omschrijving van de valuta waarin een premie of een uitkering is uitgedrukt, indien dit een andere
      valuta is dan de euro, of van de units, eenheden of van datgene waar een premie of een uitkering anderszins in
      is uitgedrukt, of, indien een uitkering strekt tot het verrichten van andere dan geldelijke prestaties, van die
      prestatie;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.e
    text: |-
      een nauwkeurige omschrijving van de omzettingsmethode indien bij een uitkering omzetting plaatsvindt in euro’s of
      een andere valuta;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.f
    text: |-
      de aard van de waarden, waaronder aandelen of andersoortige rechten van deelneming in een beleggingsinstelling als
      bedoeld in [artikel 1, onderdeel c, van de Wet toezicht beleggingsinstellingen][ref1], indien een uitkering daarin
      wordt uitgedrukt;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel1
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '1'
  - number: 32.1.g
    text: de wijze van berekening en toewijzing van de winstdeling, indien de overeenkomst een recht op winstdeling omvat;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.h
    text: de looptijd van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.i
    text: |-
      de premie verschuldigd voor de hoofddekking en, indien de overeenkomst voorziet in een of meer nevenuitkeringen,
      de premies die voor elk van de nevenuitkeringen zijn verschuldigd dan wel, indien de exacte premie niet kan worden
      gegeven, de wijze waarop deze premie wordt berekend;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.j
    text: een opgave of de premie eenmalig is verschuldigd dan wel periodiek;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.k
    text: de periode gedurende welke premie verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.l
    text: |-
      een opgave van de afkoop- of premievrije waarde indien de overeenkomst in een dergelijke waarde voorziet of een
      opgave van de wijze waarop deze waarde wordt berekend;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.m
    text: |-
      de wijze waarop de consument gebruik kan maken van zijn recht, bedoeld in
      [artikel 53 van de Wet toezicht verzekeringsbedrijf 1993][ref1], om de overeenkomst op te zeggen;


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel53
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '53'
  - number: 32.1.n
    text: de wijze waarop de overeenkomst kan worden beëindigd en de termijn die daarbij in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.o
    text: |-
      een globale indicatie van de fiscale behandeling van overeenkomsten van het desbetreffende type, waaronder begrepen
      de fiscale behandeling van premies, uitkeringen en de fiscale consequenties van afkoop;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.p
    text: het op de overeenkomst toe te passen recht, of de door de aanbieder voorgestelde rechtskeuze;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.q
    text: de invloed van kosten ten laste van de consument op het rendement en de uitkering verbonden aan de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.r
    text: de kosten die naast de brutopremie in rekening worden gebracht;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.s
    text: het aan de overeenkomst verbonden financiële risico en de mate waarin dit risico voor rekening is van de consument;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.1.t
    text: de overige algemene en bijzondere polisvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: '32.2'
    text: |-
      In afwijking van het eerste lid kan de in dat lid bedoelde informatie onmiddellijk na de totstandkoming van de
      overeenkomst worden verstrekt of uiterlijk tegelijk met het afgeven van de polis, indien de consument het recht
      heeft zonder een boete verschuldigd te zijn en zonder opgave van redenen de overeenkomst binnen 30kalenderdagen
      na de dag waarop hij de informatie heeft ontvangen, terugwerkend tot de datum van de totstandkoming van de
      overeenkomst, te ontbinden en de consument is geïnformeerd over de wijze waarop hij gebruik kan maken van dat
      recht.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: '32.3'
    text: |-
      Voorzover het financiële risico ingevolge een overeenkomst inzake een levensverzekering voor rekening van de
      consument is, kan de aanbieder van levensverzekeringen met de consument overeenkomen dat de eventueel na de
      totstandkoming van de overeenkomst opgetreden waardevermeerdering of -vermindering van de beleggingen voor rekening
      van de consument blijft indien deze ingevolge het tweede lid de overeenkomst, terugwerkend tot de datum van de
      totstandkoming van de overeenkomst, ontbindt.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: '32.4'
    text: |-
      Indien een levensverzekering wordt aangeboden door tussenkomst van een bemiddelaar, een gevolmachtigde agent of
      een ondergevolmachtigde agent, wordt de in het eerste lid bedoelde informatie door deze bemiddelaar, gevolmachtigde
      agent of ondergevolmachtigde agent verstrekt, tenzij de aanbieder en de bemiddelaar, gevolmachtigde agent of
      ondergevolmachtigde agent zijn overeengekomen dat de aanbieder zelf aan deze verplichting voldoet.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: '32.5'
    text: |-
      Indien een uitkering op grond van een overeenkomst inzake een levensverzekering
      wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling als bedoeld in
      [artikel 1, onderdeel c, van de Wet toezicht beleggingsinstellingen][ref1] stelt de aanbieder aan de consument
      op diens verzoek informatie ter hand over het beleggingsbeleid van de beleggingsinstelling, waarin aandacht wordt
      besteed aan de volgende aspecten:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel1
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '1'
  - number: 32.5.a
    text: de doelstelling van het beleggingsbeleid, alsmede de voor het beheer gehanteerde referentieportefeuille;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.5.b
    text: aan het beleggingsbeleid gestelde restricties;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: 32.5.c
    text: de beleggingstitels die zijn toegestaan alsmede de afgeleide instrumenten die kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel32
  - number: '33'
    text: |-
      Indien in geval van een overeenkomst inzake een schadeverzekering een risico is gelegen in een andere lidstaat
      dan Nederland, onderscheidenlijk indien in geval van een overeenkomst inzake een levensverzekering de consument in
      een andere lidstaat dan Nederland woonachtig of gevestigd is, wordt de aan de consument te verstrekken informatie
      gegeven volgens de in die andere lidstaat vastgestelde regels ter uitvoering van de artikelen 31 en 43 van
      [richtlijn nr. 92/49/EEG](31992L0049) van de Raad van de Europese Gemeenschappen van 18 juni 1992 tot coördinatie
      van de wettelijke en bestuursrechtelijke bepalingen betreffende het directe verzekeringsbedrijf, met uitzondering
      van de levensverzekeringsbranche, en houdende wijziging van de [richtlijnen 73/239/EEG](31973L0239) en [88/357/EEG]
      (31988L0357) (derde richtlijn schadeverzekering) (PbEG L 228) en van artikel 31 en bijlage II van [richtlijn nr.
      2002/83/EG](32002L0083) van het Europees Parlement en de Raad van de Europese Unie van 5 november 2002 betreffende
      levensverzekering (PbEG L 345).
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel33
  - number: '34.1'
    text: |-
      Onverminderd [artikel 30][ref1] verstrekt een aanbieder van natura-uitvaartverzekeringen voorafgaande aan de
      totstandkoming van een overeenkomst inzake een natura-uitvaartverzekering, voorzover van toepassing, ten minste
      de volgendeinformatie:


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel30
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '30'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 34.1.a
    text: zijn rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: 34.1.b
    text: een omschrijving van de prestatie waartoe de aanbieder zich verplicht;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: 34.1.c
    text: een omschrijving van de keuzemogelijkheden die de consument of de verzekerde ingevolge de overeenkomst heeft;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: 34.1.d
    text: een opgave of de premie eenmalig is verschuldigd dan wel periodiek;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: 34.1.e
    text: de periode gedurende welke premie verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: 34.1.f
    text: een opgave van de indexering die wordt toegepast op de verzekerde prestatie of op de premie;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: 34.1.g
    text: de overige mogelijkheden die de aanbieder heeft om de verzekerde prestatie of de premie aan te passen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: 34.1.h
    text: |-
      een opgave of indicatie van de afkoop- of premievrije waarde of een opgave van de wijze waarop deze waarden worden
      berekend;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: 34.1.i
    text: |-
      de wijze waarop de consument gebruik kan maken van zijn recht, bedoeld in
      [artikel 26 van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1], om de overeenkomst op te zeggen;


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel26
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '26'
  - number: 34.1.j
    text: de wijze waarop de overeenkomst kan worden beëindigd en de termijn die daarbij in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: 34.1.k
    text: het op de overeenkomst toe te passen recht, of de door de aanbieder voorgestelde rechtskeuze;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: 34.1.l
    text: |-
      een opgave van de uitvaartonderneming die de uitvaart zal verzorgen, dan wel van de wijze waarop wordt bepaald
      welke uitvaartonderneming de uitvaart zal verzorgen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: 34.1.m
    text: de overige algemene en bijzondere polisvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: '34.2'
    text: |-
      Indien de termijn van beëindiging, bedoeld in het eerste lid, onder j, langer is dan een jaar, maakt de aanbieder
      dit op een opvallende wijze expliciet kenbaar aan de consument, bij gebreke waarvan een opzegtermijn van een jaar
      geldt ongeacht het in de overeenkomst bepaalde.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: '34.3'
    text: |-
      In afwijking van het eerste lid kan de in dat lid bedoelde informatie onmiddellijk na de totstandkoming van de
      overeenkomst worden verstrekt, of uiterlijk tegelijk met het afgeven van de polis, indien de consument het recht
      heeft zonder een boete verschuldigd te zijn en zonder opgave van redenen de overeenkomst binnen 30 kalenderdagen
      na de dag waarop hij de informatie heeft ontvangen, terugwerkend tot de datum van de totstandkoming van de
      overeenkomst, te ontbinden en de consument is geïnformeerd over de wijze waarop hij gebruik kan maken van dat
      recht.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: '34.4'
    text: |-
      Indien een natura-uitvaartverzekering wordt aangeboden door tussenkomst van een bemiddelaar, een gevolmachtigde
      agent of een ondergevolmachtigde agent, wordt de in het eerste lid bedoelde informatie door deze bemiddelaar,
      gevolmachtigde agent of ondergevolmachtigde agent verstrekt, tenzij de aanbieder en de bemiddelaar, gevolmachtigde
      agent of ondergevolmachtigde agent zijn overeengekomen dat de aanbieder zelf aan deze verplichting voldoet.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: '34.5'
    text: |-
      Het eerste tot en met het vierde lid zijn van overeenkomstige toepassing op verzekeraars, bedoeld
      in [artikel 14, eerste lid, onder e, van de wet][ref1], die overeenkomsten aangaan die strekken
      tot fondsvorming ter voldoening van de verzorging van de uitvaart van de mens als bedoeld in
      [artikel 5 van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel5
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '5'
  - number: '34.6'
    text: |-
      De in het vijfde lid bedoelde verzekeraars verstrekken een consument voorafgaande aan de totstandkoming van een
      overeenkomst die strekt tot fondsvorming ter voldoening van de verzorging van de uitvaart van de mens informatie
      over de wijze waarop de ingelegde gelden worden belegd.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: '34.7'
    text: |-
      Indien de in het vijfde lid bedoelde verzekeraars, in afwijking van het eerste lid, de in dat lid bedoelde
      informatie onmiddellijk na de totstandkoming van een overeenkomst die strekt tot fondsvorming ter voldoening
      van de verzorging van de uitvaart van de mens, of uiterlijk tegelijk met het afgeven van de polis, verstrekken
      in overeenstemming met het derde lid, komen deze verzekeraars met de consument overeen dat de eventueel na de
      totstandkoming van de overeenkomst opgetreden waardevermeerdering of -vermindering van de beleggingen voor rekening
      van de consument blijft, indien deze ingevolge het derde lid de overeenkomst, terugwerkend tot de datum van de
      totstandkoming van de overeenkomst, ontbindt.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel34
  - number: '35.1'
    text: |-
      Onverminderd [artikel 30][ref1] houdt een aanbieder van een beleggingsobject een beleggingsobjectprospectus
      beschikbaar op zijn website en verstrekt hij onverwijld een beleggingsobjectprospectus op verzoek van
      een consument. Indien de aanbieder niet beschikt over een website verstrekt hij eveneens onverminderd
      [artikel 30][ref2], een beleggingsobjectprospectus aan een consument voorafgaande aan de totstandkoming van een
      overeenkomst inzake een beleggingsobject. Aan de verstrekking van een beleggingsobjectprospectus zijn voor de
      consument geen kosten verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel30
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '30'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '30'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '35.2'
    text: |-
      Indien een beleggingsobject wordt aangeboden door tussenkomst van een bemiddelaar, wordt het
      beleggingsobjectprospectus door deze bemiddelaar verstrekt, tenzij de aanbieder en de bemiddelaar zijn
      overeengekomen dat de aanbieder zelf aan deze verplichting voldoet. Het eerste lid is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: '35.3'
    text: 'In het beleggingsobjectprospectus wordt, voorzover van toepassing, de volgende informatie behandeld:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.a
    text: |-
      de naam, rechtsvorm, datum van oprichting, statutaire zetel en de plaats van vestiging van het hoofdkantoor van
      de aanbieder;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.b
    text: een beschrijving van de groep waartoe de financiële dienstverlener behoort en de daaraan gelieerde partijen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.c
    text: |-
      de algemene en bijzondere voorwaarden, alsmede de wijze waarop deze voorwaarden kunnen worden gewijzigd en de
      bekendmaking van een wijziging aan de consument;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.d
    text: |-
      een beschrijving van de belangrijkste kenmerken van de serie van beleggingsobjecten waarvan het beleggingsobject
      deel uitmaakt, waaronder in ieder geval de aard, de bestaansduur en de aan de serie van beleggingsobjecten
      verbonden financiële en overige risico’s, die onder meer inzichtelijk worden gemaakt door een risico-indicator,
      alsmede de effecten van die risico’s op het rendement van de consument;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.e
    text: |-
      een beschrijving van de activiteiten van de aanbieder met betrekking tot de serie van beleggingsobjecten waarvan
      het beleggingsobject deel uitmaakt, voorzover mogelijk te onderscheiden in:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.e.1°
    text: operationele activiteiten, alsmede waar deze plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.e.2°
    text: |-
      financieringsactiviteiten, voorzover mogelijk te onderscheiden in het als kredietnemer aangaan van overeenkomsten
      inzake krediet en het als crediteur uitzetten van gelden;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.e.3°
    text: |-
      uitbestedingsactiviteiten en het beleid inzake het uitbesteden van activiteiten aan derden, waaronder ten minste
      een beschrijving van de werkzaamheden die zijn uitbesteed, de naam en de statutaire zetel van de derde waaraan
      werkzaamheden zijn uitbesteed, alsmede de vermelding, indien van toepassing, dat de derde een gelieerde partij is;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.f
    text: |-
      een beschrijving van de wijze waarop wordt bepaald of de opbrengsten van de aanbieder aan de consument worden
      uitgekeerd;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.g
    text: |-
      een beschrijving van de door de aanbieder te verstrekken garanties die aan de consument in het vooruitzicht worden
      gesteld;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.h
    text: 'een beschrijving van de transacties die worden verricht met gelieerde partijen, waaronder:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.h.1°
    text: |-
      de vermelding of een transactie onder marktconforme voorwaarden plaatsvindt, dan wel, indien dat niet het geval is,
      wat de reden daarvoor is; en
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.h.2°
    text: |-
      indien een transactie plaatsvindt buiten een gereglementeerde of een andere geregelde, of een regelmatig
      functionerende open markt, de vermelding of aan de transactie een onafhankelijke waardebepaling ten grondslag ligt
      of dat de waarde kan worden bepaald door een of meer bij de transactie betrokken partijen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.i
    text: |-
      de kosten op jaarbasis per serie van beleggingsobjecten waarvan het beleggingsobject deel uitmaakt, en de relevante
      aannames die daaraan ten grondslag liggen; en
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.j
    text: 'de gegevens op jaarbasis per serie van beleggingsobjecten waarvan het beleggingsobject deel uitmaakt, betreffende:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.j.1°
    text: de bruto waarde;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.j.2°
    text: de financieringen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.j.3°
    text: de prestatievergoedingen; en
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: 35.3.j.4°
    text: de rentebaten,
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: '35.4'
    text: Het beleggingsobjectprospectus bevat geen informatie over andere onderwerpen dan bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: '35.5'
    text: |-
      De toezichthouder kan regels stellen met betrekking tot de wijze van verstrekking van de informatie, bedoeld in het
      derde lid, alsmede met betrekking tot de berekening van de kosten, risico’s en opbrengsten, bedoeld in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel35
  - number: '36.1'
    text: |-
      Onverminderd [artikel 30][ref1] houdt een aanbieder van krediet, niet zijnde hypothecair krediet, een prospectus
      beschikbaar op zijn website en verstrekt hij onverwijld een prospectus op verzoek van een consument, of, indien
      de aanbieder van krediet, niet zijnde hypothecair krediet, niet beschikt over een website, verstrekt hij een
      prospectus aan een consument voorafgaande aan de totstandkoming van een overeenkomst inzake een krediet. Aan de
      verstrekking van een prospectus zijn voor de consument geen kosten verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel30
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '30'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '36.2'
    text: |-
      Indien een krediet, niet zijnde een hypothecair krediet, wordt aangeboden door tussenkomst van een bemiddelaar,
      wordt een prospectus door deze bemiddelaar verstrekt, tenzij de aanbieder en de bemiddelaar zijn overeengekomen dat
      de aanbieder zelf aan deze verplichting voldoet. Het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: '36.3'
    text: 'In het prospectus wordt de volgende informatie behandeld:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.3.a
    text: een beschrijving van de bij een kredietaanvraag te volgen procedure;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.3.b
    text: |-
      een globale beschrijving van de criteria die ten grondslag liggen aan de beoordeling van de kredietwaardigheid van
      de consument, waarin ten minste twee representatieve voorbeelden van toepassing van die criteria zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.3.c
    text: |-
      tenzij het prospectus betrekking heeft op een overeenkomst inzake krediet als bedoeld in [artikel 60][ref1], tweede
      lid, de vermelding van:


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel60
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: '2'
  - number: 36.3.c.1°
    text: |-
      het feit dat de aanbieder van krediet aan een stelsel van kredietregistratie als bedoeld in
      [artikel 53 van de wet][ref1], deelneemt,


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel53
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '53'
  - number: 36.3.c.2°
    text: de naam en de plaats van vestiging van de instelling die dat stelsel in stand houdt,
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.3.c.3°
    text: |-
      het doel en de werkwijze van dat stelsel, waaruit in ieder geval blijkt in welke gevallen gegevens betreffende de
      kredietwaardigheid van de consument door de aanbieder van krediet kunnen worden opgevraagd, en dat gegevens met
      betrekking tot een verleend krediet door de aanbieder van krediet worden verstrekt aan en worden geregistreerd door
      de instelling die dat stelsel in stand houdt;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.3.d
    text: |-
      zodanige aanduidingen of omschrijvingen van het aangeboden krediet, dat daaruit blijkt of het een doorlopend
      krediet, dan wel een ander krediet, betreft;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.3.e
    text: |-
      een beschrijving van de algemene voorwaarden, waaronder de betrokken aanbieder van krediet bereid is overeenkomsten
      inzake krediet aan te gaan, waaronder in ieder geval, indien van toepassing, de voorwaarden inzake:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.3.e.1°
    text: ten behoeve van de aanbieder van krediet te vestigen zekerheidsrechten,
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.3.e.2°
    text: vervroegde opeisbaarheid van het door de consument verschuldigde, en
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.3.e.3°
    text: de bevoegdheid van de consument tot volledige of gedeeltelijke vervroegde aflossing;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.3.f
    text: |-
      indien de consument zich bij de totstandkoming van een overeenkomst inzake krediet verplicht tot het aangaan van
      een andere overeenkomst:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.3.f.1°
    text: een beschrijving van het daartoe strekkende beding, en
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.3.f.2°
    text: |-
      de vermelding dat de consument het recht heeft te bepalen met welke wederpartij die andere overeenkomst zal worden
      aangegaan, tenzij [artikel 33, onderdeel b, onder 1°, van de Wet op het consumentenkrediet][ref1] niet op het
      krediet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel33
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '33'
  - number: 36.3.g
    text: |-
      de vermelding dat de consument eerst na ingebrekestelling een vergoeding verschuldigd
      wordt, indien hij nalatig blijft in zijn verplichting tot betaling, tenzij
      [artikel 34, onderdeel b, van de Wet op het consumentenkrediet][ref1] niet op het krediet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel34
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '34'
  - number: 36.3.h
    text: |-
      een toelichting met betrekking tot de op grond van [artikel 28, zevende lid][ref1], te bezigen aanduiding in de
      volgende bewoordingen: «De effectieve rente op jaarbasis is een prijsaanduiding voor het krediet. Hierin komen alle
      kosten van het krediet tot uitdrukking.».


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel28
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '28'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '36.4'
    text: |-
      Het derde lid, onderdeel f, aanhef en onder 2°, is niet van toepassing op een beding als bedoeld in
      [artikel 33, onderdeel b, onder 2°, van de Wet op het consumentenkrediet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel33
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '33'
  - number: '36.5'
    text: 'Een aanbieder van doorlopend krediet behandelt in het prospectus tevens de volgende onderwerpen:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.5.a
    text: |-
      ten minste en uitsluitend vier representatieve kredietlimieten met daarbij de overige kenmerken van het krediet,
      bedoeld in [artikel 28, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel28
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '28'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 36.5.b
    text: de uitgangspunten bij de berekening van de theoretische looptijd;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.5.c
    text: |-
      indien van toepassing, de hoogte van de vergoeding die verschuldigd wordt, indien de consument, na
      ingebrekestelling, nalatig blijft in zijn verplichting tot betaling;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.5.d
    text: indien van toepassing, de hoogte van de vergoeding die verschuldigd wordt, indien de consument vervroegd aflost.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: '36.6'
    text: |-
      Een aanbieder van krediet, niet zijnde doorlopend krediet, behandelt in het prospectus tevens de volgende
      onderwerpen:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.6.a
    text: |-
      ten minste en uitsluitend vier representatieve kredietsommen met daarbij de overige kenmerken van het krediet,
      bedoeld in [artikel 28, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel28
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '28'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 36.6.b
    text: |-
      ten minste één voorbeeld van een berekening waaruit blijkt op welke wijze met behulp van de kredietsom, de
      maandlast en de looptijd het bedrag kan worden bepaald van het totaal aan kredietvergoeding dat de consument
      verschuldigd is bij een regelmatige afwikkeling van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.6.c
    text: |-
      indien van toepassing, de hoogte van de vergoeding die verschuldigd wordt, indien de consument, na
      ingebrekestelling, nalatig blijft in zijn verplichting tot betaling;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.6.d
    text: |-
      indien van toepassing, de hoogte van de vergoeding die verschuldigd wordt, indien de consument vervroegd aflost,
      alsmede ten minste één voorbeeld van een berekening waaruit blijkt op welke wijze het bedrag van deze vergoeding
      wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: '36.7'
    text: Het prospectus bevat geen informatie over andere onderwerpen dan bedoeld in het derde, vijfde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: '36.8'
    text: |-
      De toezichthouder kan regels stellen met betrekking tot de wijze van verstrekking van de informatie, bedoeld in het
      derde, vijfde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: '36.9'
    text: |-
      Het eerste tot en het met achtste lid zijn niet van toepassing op aanbieders van of bemiddelaars in krediet voor
      zover de overeenkomst inzake een krediet dient ter financiering van effecten en het krediet bestaat uit de belening
      van:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: 36.9.a
    text: |-
      effecten die zijn toegelaten tot de handel op een op grond van
      [artikel 22, eerste lid, van de Wet toezicht effectenverkeer 1995][ref1] erkende effectenbeurs of een
      gereglementeerde markt als bedoeld in artikel 1, onder 13, van [richtlijn nr. 93/22/EEG](31993L0022) van de
      Raad van de Europese Gemeenschappen van 10 mei 1993 betreffende het verrichten van diensten op het gebied van
      beleggingen in effecten (PbEG L 141), waarvan de houder in een andere lidstaat is gevestigd; of


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel22
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '22'
  - number: 36.9.b
    text: |-
      niet tot de handel op een in onderdeel a bedoelde effectenbeurs toegelaten effecten, voorzover de waarde daarvan
      door middel van een openbare prijsaanduiding voor een ieder kenbaar is.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel36
  - number: '37'
    text: |-
      De theoretische looptijd wordt berekend op de in [bijlage 9][ref1] bij dit besluit aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0019283
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0019283
  - number: '38.1'
    text: |-
      Onverminderd [artikel 30][ref1] houdt een aanbieder van een complex product een financiële bijsluiter
      beschikbaar op zijn website en verstrekt hij de financiële bijsluiter onverwijld op verzoek van een
      consument. Indien het complexe product een recht van deelneming in een beleggingsinstelling als bedoeld in
      [artikel 12, derde lid, van de Wet toezicht beleggingsinstellingen][ref2] betreft, verstrekt de aanbieder,
      in afwijking van de eerste volzin, een financiële bijsluiter aan een consument voorafgaande aan de
      totstandkoming van een overeenkomst inzake een recht van deelneming in een beleggingsinstelling als bedoeld in
      [artikel 12, derde lid, van de Wet toezicht beleggingsinstellingen][ref3]. Aan de verstrekking van een financiële
      bijsluiter zijn voor de consument geen kosten verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '30'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '12'
  - number: '38.2'
    text: |-
      Indien een complex product wordt aangeboden door tussenkomst van een bemiddelaar, een gevolmachtigde agent of
      een ondergevolmachtigde agent, wordt een financiële bijsluiter door deze bemiddelaar, gevolmachtigde agent of
      ondergevolmachtigde agent onverwijld en kosteloos verstrekt, tenzij de aanbieder en de bemiddelaar, gevolmachtigde
      agent of ondergevolmachtigde agent zijn overeengekomen dat de aanbieder zelf aan deze verplichting voldoet. Het
      eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel38
  - number: '38.3'
    text: |-
      Het eerste lid is niet van toepassing indien het een complex product betreft, niet zijnde een
      recht van deelneming in een beleggingsinstellingals bedoeld in [artikel 12, eerste lid][ref1], of
      [artikel 17c, eerste lid, van de Wet toezicht beleggingsinstellingen][ref2], ten aanzien waarvan uitsluitend
      financiële diensten worden verleend aan:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel17c
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: 17c
  - number: 38.3.a
    text: |-
      consumenten die woonachtig zijn buiten Nederland en in de aan die consumenten verstrekte informatie over het
      complexe product wordt vermeld dat het aanbod niet is of zal zijn gericht tot consumenten die woonachtig zijn in
      Nederland;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel38
  - number: 38.3.b
    text: natuurlijke personen of rechtspersonen die handelen in de uitoefening van hun bedrijf of beroep.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel38
  - number: '38.4'
    text: |-
      Bij ministeriële regeling kan een ander financieel product dan bedoeld in [artikel 1, onderdeel d][ref1], worden
      aangewezen als een complex product, indien dit ten behoeve van de vergelijkbaarheid van complexe producten met
      dit financiële product in verband met het adequaat functioneren van de financiële markten of de positie van de
      consument op die markten wenselijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel1
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '1'
        hoofdstuk: '1'
  - number: '38.5'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een financiële dienstverlener die een complex product
      samenstelt als bedoeld in [artikel 1, onderdeel d, onder 1°, 4° of 6°][ref1], en dat product algemeen in de
      markt verkrijgbaar stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel1
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '1'
        hoofdstuk: '1'
  - number: '39.1'
    text: 'In een financiële bijsluiter worden de volgende onderwerpen behandeld:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.1.a
    text: het doel van de financiële bijsluiter;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.1.b
    text: de aard en het doel van het complexe product;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.1.c
    text: |-
      de financiële risico’s van het complexe product die onder meer inzichtelijk worden gemaakt door een risico-
      indicator en, indien het een beleggingsobject betreft, de overige risico’s die samenhangen met dat product;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.1.d
    text: de verplichtingen voor de consument;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.1.e
    text: |-
      het al dan niet bestaan van een contractueel recht om de overeenkomst inzake het complexe product tussentijds op te
      zeggen, de daaraan verbonden kosten en de overige gevolgen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.1.f
    text: de gevolgen bij overlijden van de consument;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.1.g
    text: voorbeeldrendementen en de kosten van het complexe product;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.1.h
    text: |-
      in het belang van een goede informatieverstrekking aan consumenten bij ministeriële regeling aan te wijzen andere
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: '39.2'
    text: |-
      In afwijking van het eerste lid worden in een financiële bijsluiter die betrekking heeft op een
      recht van deelneming in een beleggingsinstellingals bedoeld in [artikel 12, eerste lid][ref1], of
      [artikel 17c, eerste lid, van de Wet toezicht beleggingsinstellingen][ref2], niet zijnde een recht van deelneming
      dat voldoet aan [artikel 3, eerste lid, van de Wet toezicht effectenverkeer][ref3], de volgende onderwerpen
      behandeld:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel17c
      [ref3]: https://wetten.overheid.nl/BWBR0007657#Artikel3
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: 17c
      - id: ref3
        bwb_id: BWBR0007657
        artikel: '3'
  - number: 39.2.a
    text: |-
      de vermelding dat het een financiële bijsluiter betreft, welke beleggingsinstelling het betreft en een korte
      omschrijving van de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.2.b
    text: het doel van de financiële bijsluiter en de registratie van de beleggingsinstelling bij de toezichthouder;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.2.c
    text: de aard en het doel van de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.2.d
    text: |-
      de financiële risico’s van het recht van deelneming in een beleggingsinstelling die onder meer inzichtelijk worden
      gemaakt door een risico-indicator;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.2.e
    text: de verplichtingen voor de consument;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.2.f
    text: de kosten en, indien beschikbaar, het historisch rendement van het recht van deelneming;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.2.g
    text: |-
      het al dan niet bestaan van een contractueel recht om de overeenkomst inzake het complexe product tussentijds op te
      zeggen, de daaraan verbonden kosten en de overige gevolgen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.2.h
    text: fiscale aspecten van de rechten van deelneming in een beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: 39.2.i
    text: |-
      in het belang van een goede informatieverstrekking aan consumenten bij ministeriële regeling aan te wijzen andere
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: '39.3'
    text: Een financiële bijsluiter bevat geen informatie over andere onderwerpen dan bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: '39.4'
    text: |-
      De toezichthouder stelt regels met betrekking tot de wijze waarop de informatie, bedoeld in het eerste en tweede
      lid, in de financiële bijsluiter dient te worden verstrekt, alsmede met betrekking tot de berekening van de
      rendementen, kosten en risico’s als bedoeld in het eerste lid, onder c en g, en het tweede lid, onder d en f.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
  - number: '39.5'
    text: |-
      Indien het een financiële bijsluiter betreft die betrekking heeft op rechten van deelneming in een
      beleggingsinstellingals bedoeld in [artikel 12, derde lid, van de Wet toezicht beleggingsinstellingen][ref1],
      stelt de toezichthouder regels voorzover deze strekken tot het uitvoeren van [richtlijn nr. 85/611/EEG]
      (31985L0611) van de Raad van de Europese Gemeenschappen van 20 december 1985 tot coördinatie van de wettelijke en
      bestuursrechtelijke bepalingen betreffende bepaalde instellingen voor collectieve belegging in effecten (icbe’s)
      met het oog op reglementering van beheermaatschappijen en vereenvoudigde prospectussen (PbEG L 41/20).


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '12'
  - number: '40'
    text: |-
      Deze paragraaf is niet van toepassing op het verstrekken van informatie inzake overeenkomsten op afstand ten
      aanzien waarvan uitsluitend financiële diensten worden verleend aan natuurlijke personen of rechtspersonen die
      handelen in de uitoefening van hun bedrijf of beroep.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel40
  - number: '41.1'
    text: |-
      In afwijking van [artikel 30][ref1] en onverminderd de [artikelen 31 tot en met 39][ref2], verstrekt een financiële
      dienstverlener een consument voorafgaande aan de totstandkoming van een overeenkomst op afstand, voorzover van
      toepassing, ten minste de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel31
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '30'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '31'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 41.1.a
    text: |-
      zijn naam en adres en, indien de financiële dienstverlener een rechtspersoon is, de statutaire naam en handelsnaam
      of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.b
    text: de aard van zijn financiële dienstverlening;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.c
    text: |-
      zijn interne klachtenprocedure, bedoeld in [artikel 37, eerste lid, onder a, van de wet][ref1] en de erkende
      geschilleninstantie waarbij hij is aangesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel37
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '37'
  - number: 41.1.d
    text: zijn registratie bij de toezichthouder;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.e
    text: |-
      de naam van de Kamer van Koophandel en Fabrieken in het handelsregister waarvan hij is ingeschreven en het nummer
      van de inschrijving;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.f
    text: de belangrijkste kenmerken van het financiële product;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.g
    text: de financiële en overige risico’s die met het financiële product samenhangen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.h
    text: |-
      de totale kosten, of, wanneer de exacte kosten niet kunnen worden aangegeven, de grondslag voor de berekening van
      de kosten, zodat de consument de kosten kan verifiëren;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.i
    text: |-
      de omstandigheid dat de consument andere bedragen verschuldigd kan zijn die niet via de financiële dienstverlener
      worden betaald of door hem worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.j
    text: de extra kosten voor het gebruik van een techniek voor communicatie op afstand;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.k
    text: de wijze van betaling door de consument en de wijze van uitvoering van de overeenkomst op afstand;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.l
    text: beperkingen in de geldigheidsduur van de verstrekte informatie;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.m
    text: de minimale looptijd van de overeenkomst op afstand;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.n
    text: |-
      het contractuele recht op tussentijdse beëindiging van de overeenkomst op afstand en de eventuele boete verbonden
      aan de uitoefening van dat recht;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.o
    text: |-
      het feit dat het in [artikel 40, eerste en tweede lid, van de wet][ref1] bedoelde recht, wel of niet van toepassing
      is, de duur van en de voorwaarden voor de uitoefening van dat recht, met inbegrip van informatie over het bedrag
      dat de consument gehouden kan zijn te betalen, de gevolgen van niet-uitoefening van dat recht en de praktische
      instructies voor de uitoefening van dat recht;


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel40
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '40'
  - number: 41.1.p
    text: |-
      het bestaan van op de overeenkomst op afstand toepasselijke garantiefondsen of andere compensatieregelingen die
      niet vallen onder [richtlijn nr. 1994/19/EG](31994L0019) van het Europees Parlement en de Raad van de Europese Unie
      van 30 mei 1994 inzake de depositogarantiestelsels (PbEG L 135) en [richtlijn nr. 1997/9/EG](31997L0009) van het
      Europees Parlement en de Raad van de Europese Unie van 3 maart 1997 inzake de beleggerscompensatiestelsels (PbEG
      L 084);
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.q
    text: |-
      de taal of de talen waarin de algemene en bijzondere voorwaarden van de overeenkomst op afstand en de in dit
      artikel bedoelde informatie worden verstrekt, alsmede de taal of talen waarin de financiële dienstverlener toezegt
      te zullen communiceren gedurende de looptijd van de overeenkomst op afstand;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.r
    text: |-
      het op de totstandbrenging van betrekkingen met de consument voorafgaand aan de totstandkoming van de overeenkomst
      op afstand toe te passen recht, het op die overeenkomst toe te passen recht en de bevoegde rechter;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: 41.1.s
    text: de overige algemene en bijzondere voorwaarden van de overeenkomst op afstand.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
  - number: '41.2'
    text: |-
      Een financiële dienstverlener die financiële diensten verleent ten aanzien van levensverzekeringen voldoet
      aan het eerste lid, onderdelen f, g, h, m, n en s, door het verstrekken van de informatie, bedoeld in
      [artikel 32, eerste lid, onderdelen h, i, l, m, n, o, r, s en t][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel32
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '32'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '41.3'
    text: |-
      Een financiële dienstverlener die financiële diensten verleent ten aanzien van natura-uitvaartverzekeringen
      voldoet aan het eerste lid, onderdeel n, door het verstrekken van de informatie, bedoeld in
      [artikel 34, eerste lid, onderdelen h, i, en j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel34
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '34'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '42.1'
    text: |-
      Indien een overeenkomst op afstand op verzoek van de consument tot stand is gekomen met gebruikmaking van een
      techniek voor communicatie op afstand waarmee de in [artikel 41][ref1] bedoelde informatie niet schriftelijk of via
      een andere duurzame drager als bedoeld in [artikel 26, eerste lid][ref2], voorafgaand aan de totstandkoming van de
      overeenkomst kan worden verstrekt, is het een financiële dienstverlener toegestaan de informatie onmiddellijk na de
      totstandkoming van de overeenkomst op afstand aan de consument te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel26
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '26'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '42.2'
    text: |-
      In afwijking van [artikel 41, eerste lid, aanhef][ref1], verstrekt een financiële dienstverlener een consument de
      in dat artikel bedoelde informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel41
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: 42.2.a
    text: |-
      indien het een overeenkomst op afstand inzake een schadeverzekering betreft, uiterlijk tegelijk met het afgeven van
      de polis;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel42
  - number: 42.2.b
    text: |-
      indien het een overeenkomst op afstand inzake een levensverzekering, een natura-uitvaartverzekering of een
      overeenkomst op afstand die strekt tot fondsvorming ter voldoening van de verzorging van de uitvaart van de
      mens als bedoeld in [artikel 5 van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1] betreft, uiterlijk
      tegelijk met het afgeven van de polis. Indien het een overeenkomst op afstand inzake een levensverzekering of een
      overeenkomst op afstand die strekt tot fondsvorming ter voldoening van de verzorging van de uitvaart van de mens
      betreft waarvan de waarde afhankelijk is van de ontwikkeling op financiële markten of andere markten, heeft de
      consument in dat geval het recht zonder een boete verschuldigd te zijn en zonder opgave van redenen de overeenkomst
      binnen 30 kalenderdagen na de dag waarop hij de informatie heeft ontvangen, terugwerkend tot de datum van het tot
      stand komen van de overeenkomst, te ontbinden en wordt de consument door de financiële dienstverlener geïnformeerd
      over de wijze waarop hij gebruik kan maken van dat recht.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel5
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '5'
  - number: '42.3'
    text: |-
      Voorzover het financiële risico ingevolge een overeenkomst op afstand inzake een levensverzekering voor rekening
      van de consument is, kan de financiële dienstverlener met de consument overeenkomen dat de eventueel na de
      totstandkoming van de overeenkomst opgetreden waardevermeerdering of -vermindering van de beleggingen voor
      rekening van de consument blijft indien deze de overeenkomst terugwerkend tot de datum van de totstandkoming van de
      overeenkomst ontbindt.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel42
  - number: '42.4'
    text: |-
      Verzekeraars als bedoeld in [artikel 34, vijfde lid][ref1], die overeenkomsten op afstand aangaan die strekken tot
      fondsvorming ter voldoening van de verzorging van de uitvaart van de mens en die overeenkomstig het tweede lid,
      onderdeel b, de in dat lid bedoelde informatie uiterlijk tegelijk met het afgeven van de polis verstrekken, komen
      met de consument overeen dat de eventueel na de totstandkoming van de overeenkomst opgetreden waardevermeerdering
      of -vermindering van de beleggingen voor rekening van de consument blijft, indien deze ingevolge het tweede lid,
      onderdeel b, de overeenkomst, terugwerkend tot de datum van de totstandkoming van de overeenkomst, ontbindt.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel34
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '34'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '43.1'
    text: |-
      Aan een consument worden bij het gebruik van de telefoon voor het doen van ongevraagde oproepen ter bevordering
      van de totstandkoming van een overeenkomst op afstand, aan het begin van elk gesprek duidelijk de identiteit
      van de financiële dienstverlener, alsmede het commerciële oogmerk van de oproep meegedeeld. In afwijking
      van [artikel 41][ref1], kan de financiële dienstverlener in dergelijke oproepen, indien de consument daarmee
      uitdrukkelijk instemt, volstaan met het informeren van de consument over:


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel41
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: 43.1.a
    text: |-
      de identiteit van de persoon die in contact staat met de consument en de relatie van deze persoon met de financiële
      dienstverlener;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel43
  - number: 43.1.b
    text: de belangrijkste kenmerken van het financiële product;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel43
  - number: 43.1.c
    text: |-
      de totale kosten, of, wanneer de exacte kosten niet kunnen worden aangegeven, de grondslag voor de berekening van
      de kosten, zodat de consument de kosten kan verifiëren;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel43
  - number: 43.1.d
    text: |-
      de omstandigheid dat de consument andere bedragen verschuldigd kan zijn die niet via de financiële dienstverlener
      worden betaald of door hem worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel43
  - number: 43.1.e
    text: |-
      de toepasselijkheid van het in [artikel 40, eerste en tweede lid, van de wet][ref1] bedoelde recht, de duur van
      en de voorwaarden voor de uitoefening van dat recht, met inbegrip van informatie over het bedrag dat de consument
      gehouden kan zijn te betalen, de gevolgen van niet-uitoefening van dat recht;


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel40
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '40'
  - number: 43.1.f
    text: |-
      de omstandigheid dat op verzoek van de consument andere informatie beschikbaar is, waarbij de aard van die
      informatie aan de consument wordt medegedeeld.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel43
  - number: '43.2'
    text: |-
      Indien een overeenkomst op afstand tot stand komt via spraaktelefonie, verstrekt een financiële
      dienstverlener de in [artikel 41, eerste lid][ref1], bedoelde informatie onmiddellijk na de
      totstandkoming van de overeenkomst op afstand aan de consument. Voorzover het een overeenkomst
      inzake een schadeverzekering, een natura-uitvaartverzekering of een levensverzekering betreft, is
      __REF001___________________________________________________________________________________________________________
      _____ van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel42
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '42'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: '43.3'
    text: |-
      [Artikel 26, eerste lid, eerste volzin][ref1], is niet van toepassing op het verstrekken van informatie als bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel26
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '26'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '44.1'
    text: |-
      Het gebruik van automatische oproepsystemen zonder menselijke tussenkomst, faxen of elektronische berichten
      voor het overbrengen van ongevraagde informatie aan een consument, ter bevordering van de totstandkoming van een
      overeenkomst op afstand, is uitsluitend toegestaan indien de consument daarvoor voorafgaand toestemming heeft
      verleend, onverminderd het derde lid. Er zijn geen kosten verbonden aan het verlenen van deze toestemming.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel44
  - number: '44.2'
    text: |-
      Het gebruik van andere dan de in het eerste lid genoemde technieken voor communicatie op afstand voor het
      overbrengen van ongevraagde informatie of het doen van ongevraagde mededelingen aan een consument, ter bevordering
      van de totstandkoming van een overeenkomst op afstand, is toegestaan, tenzij de desbetreffende consument te kennen
      heeft gegeven dat hij informatie of mededelingen waarbij van deze technieken gebruik wordt gemaakt, niet wenst te
      ontvangen. Er zijn geen kosten verbonden aan voorzieningen waarmee wordt voorkomen dat een consument ongevraagde
      informatie wordt overgebracht.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel44
  - number: '44.3'
    text: |-
      Een financiële dienstverlener die elektronische contactgegevens voor elektronische berichten heeft verkregen
      in het kader van de verkoop van een financieel product mag deze gegevens gebruiken voor het overbrengen van
      informatie ter bevordering van de totstandkoming van een overeenkomst op afstand met betrekking tot eigen
      gelijksoortige financiële producten, indien bij de verkrijging van de contactgegevens aan de consument
      duidelijk en uitdrukkelijk de gelegenheid is geboden om kosteloos en op gemakkelijke wijze verzet aan
      te tekenen tegen het gebruik van die elektronische contactgegevens, en, indien de consument hiervan geen
      gebruik heeft gemaakt, hem bij elke tot stand gebrachte communicatie de mogelijkheid wordt geboden om onder
      dezelfde voorwaarden verzet aan te tekenen tegen het verdere gebruik van zijn elektronische contactgegevens.
      [Artikel 41, tweede lid, van de Wet bescherming persoonsgegevens][ref1] is van overeenkomstige toepassing. Er zijn
      geen kosten verbonden aan het aantekenen van verzet tegen het gebruik van elektronische contactgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel41
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '41'
  - number: '44.4'
    text: |-
      Bij het gebruik van elektronische berichten ter bevordering van de totstandkoming van een overeenkomst op afstand
      dienen te allen tijde de volgende gegevens te worden vermeld:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel44
  - number: 44.4.a
    text: de werkelijke identiteit van degene namens wie de communicatie wordt overgebracht, en
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel44
  - number: 44.4.b
    text: |-
      een geldig postadres of nummer waaraan de ontvanger een verzoek tot beëindiging van dergelijke communicatie kan
      richten.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel44
  - number: '45.1'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een levensverzekering verstrekt de aanbieder de consument,
      voorzover van toepassing, ten minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel45
  - number: 45.1.a
    text: iedere wijziging van zijn handelsnaam of handelsnamen, statutaire naam, rechtsvorm of adres;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel45
  - number: 45.1.b
    text: iedere wijziging van de algemene of bijzondere polisvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel45
  - number: 45.1.c
    text: |-
      voorzover zulks niet blijkt uit een wijziging van de algemene of bijzondere polisvoorwaarden: iedere
      wijziging van de overeenkomst ten aanzien van de in de [artikelen 30, eerste lid, onderdeel c][ref1], en
      [32, eerste lid, onderdelen b tot en met l en n tot en met s][ref2], bedoelde onderwerpen of van de op die
      onderdelen van toepassing zijnde regelgeving;


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel32
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '30'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '32'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 45.1.d
    text: de jaarlijkse winstdeling;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel45
  - number: 45.1.e
    text: |-
      de actuele afkoop- of premievrije waarde, bedoeld in de [artikelen 32, eerste lid, onderdeel l][ref1], indien de
      consument daarom verzoekt; en


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel32
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '32'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 45.1.f
    text: |-
      indien een uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling als bedoeld
      in [artikel 1, onderdeel c, van de Wet toezicht beleggingsinstellingen][ref1], het gevoerde beheer van de
      beleggingsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel1
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '1'
  - number: '45.2'
    text: |-
      [Artikel 33][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel33
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '33'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '46.1'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een natura-uitvaartverzekering verstrekt de aanbieder de
      consument, voorzover van toepassing, ten minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel46
  - number: 46.1.a
    text: iedere wijziging van zijn handelsnaam of handelsnamen, statutaire naam, rechtsvorm of adres;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel46
  - number: 46.1.b
    text: iedere wijziging van de algemene of bijzondere polisvoorwaarden; en
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel46
  - number: 46.1.c
    text: |-
      voorzover zulks niet blijkt uit een wijziging van de algemene of bijzondere polisvoorwaarden: iedere
      wijziging van de overeenkomst ten aanzien van de in de [artikelen 30, eerste lid, onderdeel c][ref1], en
      [34, eerste lid, onderdelen b tot en met h, j en l][ref2] bedoelde onderwerpen of van de op die onderdelen van
      toepassing zijnde regelgeving;


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel34
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '30'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '34'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '46.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op verzekeraars als bedoeld in
      [artikel 14, eerste lid, onder e, van de wet][ref1] die overeenkomsten aangaan die strekken
      tot fondsvorming ter voldoening van de verzorging van de uitvaart van de mens als bedoeld in
      [artikel 5 van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel5
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '5'
  - number: '47'
    text: |-
      Gedurende de looptijd van een overeenkomst op afstand verstrekt een financiële dienstverlener aan de consument op
      diens verzoek de algemene en bijzondere voorwaarden van de overeenkomst. Voorts kan de consument het gebruik van
      een ander middel van communicatie op afstand verlangen, tenzij dat niet met de tot stand gekomen overeenkomst op
      afstand te verenigen is.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel47
  - number: '48.1'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een beleggingsobject verstrekt de aanbieder de consument ten
      minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel48
  - number: 48.1.a
    text: |-
      een door een accountant gecontroleerde jaarrekening, waarvan de toelichting ten minste een opsplitsing bevat
      van de totale verkoopkosten, de productiekosten, de beheerkosten en de administratieve kosten van de aanbieder,
      een opsplitsing van deze kosten per serie van beleggingsobjecten waartoe het beleggingsobject behoort,
      alsmede het totaal van de door consumenten ingelegde gelden in de serie van beleggingsobjecten. De opstelling
      van de jaarrekening geschiedt door een aanbieder met een zetel in Nederland zoveel mogelijk overeenkomstig
      [boek 2 van het Burgerlijk Wetboek][ref1]. De opstelling van de jaarrekening van een aanbieder met een zetel in
      andere lidstaat geschiedt overeenkomstig de voorschriften van de vierde [richtlijn nr. 78/660/EEG](31978L0660)
      van de Raad van de Europese Gemeenschappen van 25 juli 1978 op de grondslag van artikel 54, lid 3 sub g van het
      Verdrag betreffende de jaarrekening van bepaalde vennootschapsvormen (PbEG L 222) en van de zevende [richtlijn nr.
      83/349/EEG](31983L0349) van de Raad van de Europese Gemeenschappen van 13 juni 1983 op de grondslag van artikel 54,
      lid 3 sub g van het Verdrag betreffende de geconsolideerde jaarrekening (Pb EG L 193).Voor de overige aanbieders
      geschiedt de opstelling op gelijkwaardige wijze. In de jaarrekening wordt meegedeeld overeenkomstig welke
      voorschriften de opstelling geschiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 48.1.b
    text: |-
      een door een onafhankelijke deskundige opgestelde waardering van de serie van beleggingsobjecten waartoe het
      beleggingsobject behoort, welke waardering ten minste een maal per jaar dient te worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel48
  - number: 48.1.c
    text: |-
      in het belang van een goede informatieverstrekking aan consumenten bij ministeriële regeling aan te wijzen andere
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel48
  - number: '48.2'
    text: |-
      De aanbieder houdt de informatie, bedoeld in het eerste lid, onderdelen a en b, gedurende ten minste drie jaar
      beschikbaar op zijn eigen website.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel48
  - number: '48.3'
    text: |-
      De toezichthouder kan regels stellen met betrekking tot de wijze van verstrekking van de informatie, bedoeld in het
      eerste lid, alsmede met betrekking tot de berekening van de kosten, bedoeld in het eerste lid, onder a.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel48
  - number: '49.1'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake krediet met een variabele kredietvergoeding informeert de
      aanbieder de consument over elke wijziging van de kredietvergoeding, waarbij hij de consument tevens informeert
      over het gewijzigde effectieve kredietvergoedingspercentage op jaarbasis.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel49
  - number: '49.2'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake krediet verstrekt de aanbieder de consument op diens verzoek
      een gespecificeerd overzicht van het uitstaand saldo. Hij kan daarbij een vergoeding in rekening brengen van ten
      hoogste het bedrag van de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel49
  - number: '49.3'
    text: |-
      Binnen korte tijd na de afwikkeling van een overeenkomst inzake krediet verstrekt de aanbieder van krediet aan de
      consument op diens verzoek kosteloos een gespecificeerde afrekening.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel49
  - number: '50'
    text: |-
      Een financiële dienstverlener stelt aan alle personen die binnen zijn onderneming betrokken zijn bij de afhandeling
      van klachten van consumenten over door hem verleende financiële diensten, een beschrijving beschikbaar van de te
      volgen procedure voor de afhandeling van die klachten.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel50
  - number: '51'
    text: |-
      Met het oog op een adequate behandeling van klachten van consumenten over door een financiële dienstverlener
      verleende financiële diensten beschikt de financiële dienstverlener over een behoorlijke administratie van die
      klachten, waarin ten minste worden vastgelegd:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel51
  - number: 51.a
    text: de naam en het adres van de consument die een klacht heeft ingediend;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel51
  - number: 51.b
    text: de van de consument ontvangen klacht, met de daarbij behorende dagtekening van ontvangst;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel51
  - number: 51.c
    text: een omschrijving van de klacht;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel51
  - number: 51.d
    text: een beschrijving van de wijze waarop de financiële dienstverlener de klacht heeft behandeld.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel51
  - number: '52'
    text: |-
      Een financiële dienstverlener bewaart de gegevens, bedoeld in [artikel 51][ref1], gedurende een periode van ten
      minste één jaar nadat de klacht door de financiële dienstverlener is afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel51
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '51'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '53.1'
    text: |-
      Onze Minister erkent een geschilleninstantie op aanvraag, indien de aanvrager heeft aangetoond te kunnen voldoen
      aan de [artikelen 54 tot en met 58][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel54
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '54'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '53.2'
    text: |-
      Onze Minister beslist op een aanvraag om erkenning binnen vier maanden nadat de aanvraag is ingediend. De
      beslissingstermijn kan ten hoogste tweemaal met twee maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel53
  - number: '53.3'
    text: Onze Minister kan aan een erkenning voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel53
  - number: '53.4'
    text: |-
      Een erkende geschilleninstantie verstrekt aan Onze Minister binnen een half jaar na afloop van elk kalenderjaar een
      opgave van:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel53
  - number: 53.4.a
    text: de in het afgelopen kalenderjaar bij de geschilleninstantie aangesloten financiële dienstverleners;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel53
  - number: 53.4.b
    text: |-
      een opgave van het aantal in het afgelopen kalenderjaar ingediende en behandelde geschillen, alsmede een algemene
      weergave van de aard van de geschillen en de uitkomst van de geschilbeslechting;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel53
  - number: '53.5'
    text: 'Onze Minister kan een erkenning intrekken:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel53
  - number: 53.5.a
    text: op verzoek van de geschilleninstantie;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel53
  - number: 53.5.b
    text: |-
      indien de gegevens en bescheiden die zijn verstrekt ter verkrijging van de erkenning zodanig onjuist of onvolledig
      blijken, dat de erkenning zou zijn geweigerd, dan wel niet zonder het verbinden van voorschriften zou zijn
      verleend, indien bij de behandeling van de aanvraag de juiste gegevens volledig bekend waren geweest.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel53
  - number: 53.5.c
    text: |-
      indien de geschilleninstantie niet langer voldoet aan het derde of vierde lid, [artikel 54][ref1], [55][ref2],
      [56][ref3], [57][ref4] of [58][ref5] of een voorschrift, verbonden aan de erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0019283#Artikel56
      [ref4]: https://wetten.overheid.nl/BWBR0019283#Artikel57
      [ref5]: https://wetten.overheid.nl/BWBR0019283#Artikel58
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '54'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '55'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0019283
        artikel: '56'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0019283
        artikel: '57'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0019283
        artikel: '58'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '53.6'
    text: |-
      Van een beslissing tot erkenning of tot intrekking van een erkenning van een geschilleninstantie wordt door Onze
      Minister mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel53
  - number: '54.1'
    text: |-
      Een erkende geschilleninstantie draagt zorg voor de onafhankelijkheid en deskundigheid van het orgaan dat binnen de
      organisatie van de geschilleninstantie verantwoordelijk is voor de behandeling van het geschil.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel54
  - number: '54.2'
    text: 'De onafhankelijkheid van het orgaan wordt voldoende gewaarborgd indien de leden:'
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel54
  - number: 54.2.a
    text: |-
      gedurende een jaar voorafgaande aan de aanvaarding van hun functie, niet gewerkt hebben voor of enige functie
      bekleed hebben bij een beroepsorganisatie voor financiële dienstverleners, of voor, onderscheidenlijk bij een
      financiële dienstverlener, ten aanzien van wiens financiële producten en financiële diensten geschillen ter
      behandeling aan de geschilleninstantie kunnen worden voorgelegd; en
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel54
  - number: 54.2.b
    text: |-
      vanaf de aanvaarding van hun functie, niet werkzaam zijn voor of enige functie bekleden bij een beroepsorganisatie
      voor financiële dienstverleners, of voor, onderscheidenlijk bij een financiële dienstverlener, ten aanzien van
      wiens financiële producten en financiële diensten geschillen ter behandeling aan de geschilleninstantie kunnen
      worden voorgelegd.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel54
  - number: '54.3'
    text: |-
      Ter waarborging van de deskundigheid van het orgaan bezit in ieder geval de voorzitter van het orgaan de
      hoedanigheid van meester in de rechten.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel54
  - number: '54.4'
    text: |-
      De bij de benoeming van een lid van het orgaan, bedoeld in het eerste lid, te volgen procedure is schriftelijk
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel54
  - number: '55.1'
    text: |-
      Een erkende geschilleninstantie beschikt over en handelt in overeenstemming met een reglement voor de behandeling
      van geschillen dat ten minste omvat:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.a
    text: |-
      een duidelijke omschrijving van de geschillen die ter behandeling aan de geschilleninstantie kunnen worden
      voorgelegd;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.b
    text: |-
      regels met betrekking tot het aanhangig maken van een geschil en een duidelijke omschrijving van de partijen die
      een geschil aanhangig kunnen maken;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.c
    text: |-
      regels met betrekking tot de mogelijkheid van wraking van een lid van het orgaan, bedoeld in
      [artikel 54, eerste lid][ref1], door partijen, op grond van feiten of omstandigheden die een onpartijdig of
      onafhankelijk oordeel van dat lid zouden bemoeilijken;


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel54
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '54'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 55.1.d
    text: regels met betrekking tot de behandeling van een geschil door de geschilleninstantie;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.e
    text: |-
      regels met betrekking tot het op voet van gelijkheid bieden van gelegenheid aan partijen om mondeling en
      schriftelijk, desgewenst met bijstand van derden, hun mening aan de geschilleninstantie kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.f
    text: regels met betrekking tot de voorwaarden waaronder een deskundige kan worden verzocht een advies uit te brengen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.g
    text: |-
      regels met betrekking tot de voorwaarden waaronder getuigen en deskundigen kunnen worden gehoord, dan wel
      inlichtingen van hen kunnen worden ingewonnen;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.h
    text: |-
      regels met betrekking tot de mogelijkheid voor partijen om van alle door hen naar voren gebrachte feiten en
      stellingen, alsmede van verklaringen van getuigen en deskundigen, over en weer kennis te nemen en daarop te
      reageren;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.i
    text: |-
      regels met betrekking tot de voorwaarden waaronder een geschil door middel van een verkorte schriftelijke procedure
      of een voorlopig oordeel kan worden afgedaan;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.j
    text: regels met betrekking tot het soort regels waarop de geschilleninstantie haar beslissingen baseert;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.k
    text: regels met betrekking tot de mogelijkheid dat de beslechting van een geschil resulteert in een niet-bindend advies;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.l
    text: |-
      de bepaling dat de beslechting van een geschil slechts resulteert in een bindend advies indien betrokken partijen
      daarmee uitdrukkelijk vooraf hebben ingestemd;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.m
    text: |-
      regels met betrekking tot de vaststelling van de hoogte van het bedrag, dat, zo dit verschuldigd is, bij het
      aanhangig maken van het geschil dient te worden voldaan;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.n
    text: |-
      regels met betrekking tot de mogelijkheid om partijen in de kosten van de behandeling van een geschil te
      veroordelen en vaststelling van een hierbij geldend maximumbedrag;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.o
    text: |-
      regels met betrekking tot de vorm, inhoud en bekendmaking van de uitkomst van het advies, bedoeld in de onderdelen
      k en l, waarbij in ieder geval is bepaald dat deze uitkomst, met redenen omkleed, ondertekend en schriftelijk aan
      partijen wordt medegedeeld;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: 55.1.p
    text: |-
      indien beroep tegen een uitspraak mogelijk is, de regels met betrekking tot het mededelen van de mogelijkheid van
      beroep, de wijze en termijn van het instellen, alsmede de behandeling van dit beroep.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: '55.2'
    text: |-
      Een erkende geschilleninstantie houdt het reglement, bedoeld in het eerste lid, beschikbaar en verstrekt het
      kosteloos op verzoek aan iedere belanghebbende.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel55
  - number: '56'
    text: |-
      Een erkende geschilleninstantie draagt er zorg voor dat de kosten voor het aanhangig maken van het geschil zodanig
      beperkt blijven dat de toegang tot de geschilleninstantie niet onredelijk wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel56
  - number: '57'
    text: |-
      Een erkende geschilleninstantie draagt er zorg voor dat de behandeling van een geschil binnen een redelijke termijn
      wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel57
  - number: '58'
    text: |-
      Een erkende geschilleninstantie stelt aan een financiële dienstverlener die zich bij haar wil aansluiten niet als
      voorwaarde voor aansluiting dat de financiële dienstverlener andere regels naleeft dan die welke betrekking hebben
      op het aanhangig maken van een geschil bij de geschilleninstantie of de verdere behandeling van een geschil door
      de geschilleninstantie.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel58
  - number: '59.1'
    text: |-
      Een aanbieder van krediet gaat met een consument geen overeenkomst inzake krediet aan waarvan de kredietsom of de
      kredietlimiet meer dan € 1000,– bedraagt, indien hij niet beschikt over voldoende schriftelijke of op een andere
      duurzame drager vastgelegde informatie aangaande de financiële positie van de consument om, ter voorkoming van
      overkreditering, te kunnen beoordelen of het aangaan van de overeenkomst verantwoord is.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel59
  - number: '59.2'
    text: |-
      Het eerste lid is niet van toepassing op aanbieders van krediet waarvan de kredietsom, dan wel de kredietlimiet,
      gedurende de looptijd van de overeenkomst inzake het krediet niet hoger is dan 70% van de waarde van de betrokken
      effecten en de overeenkomst inzake het krediet dient ter financiering van effecten, voor zover het krediet bestaat
      uit de belening van:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel59
  - number: 59.2.a
    text: |-
      effecten die zijn toegelaten tot de handel op een op grond van
      [artikel 22, eerste lid, van de Wet toezicht effectenverkeer 1995][ref1] erkende effectenbeurs of een
      gereglementeerde markt als bedoeld in artikel 1, onder 13, van [richtlijn nr. 93/22/EEG](31993L0022) van de
      Raad van de Europese Gemeenschappen van 10 mei 1993 betreffende het verrichten van diensten op het gebied van
      beleggingen in effecten (PbEG L 141), waarvan de houder in een andere lidstaat is gevestigd; of


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel22
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '22'
  - number: 59.2.b
    text: |-
      niet tot de handel op een in onderdeel a bedoelde effectenbeurs toegelaten effecten, voorzover de waarde daarvan
      door middel van een openbare prijsaanduiding voor een ieder kenbaar is.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel59
  - number: '60.1'
    text: |-
      Alvorens met een consument een overeenkomst inzake krediet aan te gaan waarvan de kredietsom, dan wel
      kredietlimiet, meer dan € 250,– bedraagt, raadpleegt een aanbieder van krediet de bij het stelsel van
      kredietregistratie waaraan hij deelneemt geregistreerde gegevens over reeds aan de consument verleende kredieten.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel60
  - number: '60.2'
    text: |-
      Het eerste lid is niet van toepassing op aanbieders van krediet als bedoeld in [artikel 59, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel59
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '59'
        hoofdstuk: '8'
        paragraaf: '2'
  - number: '61.1'
    text: |-
      Ter voorkoming van overkreditering legt een aanbieder van krediet de criteria vast die hij ten grondslag legt aan
      de beoordeling van een kredietaanvraag van een consument en past hij deze criteria toe bij de boordeling van een
      kredietaanvraag.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel61
  - number: '61.2'
    text: |-
      Het eerste lid is niet van toepassing op aanbieders van krediet als bedoeld in [artikel 59, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel59
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '59'
        hoofdstuk: '8'
        paragraaf: '2'
  - number: '62'
    text: |-
      De [artikelen 63 tot en met 67][ref1] zijn uitsluitend van toepassing op financiële dienstverlening inzake
      consumptief krediet.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel63
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '63'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '63'
    text: Een bemiddelaar heeft slechts aanspraak op provisie ter zake van tot stand gekomen overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel63
  - number: '64.1'
    text: |-
      Een bemiddelaar heeft alleen per maand gedurende de looptijd van een overeenkomst inzake krediet welke door zijn
      bemiddeling tot stand is gekomen, aanspraak op provisie, ten bedrage van een percentage van het uitstaand saldo ter
      zake van die overeenkomst, zoals dat saldo luidt op de laatste dag van de desbetreffende maand.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel64
  - number: '64.2'
    text: |-
      De aanbieder en bemiddelaar kunnen het ter zake van de bemiddeling overeengekomen provisiepercentage wijzigen, met
      dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel64
  - number: 64.2.a
    text: |-
      een overeengekomen percentage telkens gedurende een aaneengesloten tijdvak van ten minste een maand dient te
      gelden;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel64
  - number: 64.2.b
    text: |-
      ten aanzien van reeds tot stand gekomen overeenkomsten inzake krediet, niet zijnde doorlopend krediet, het
      percentage blijft gelden dat gold op het tijdstip waarop de overeenkomst inzake krediet werd afgesloten;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel64
  - number: 64.2.c
    text: |-
      ten aanzien van reeds tot stand gekomen overeenkomsten inzake doorlopend krediet het percentage telkens eerst na 24
      maanden kan worden gewijzigd uitsluitend in het percentage dat tussen de aanbieder en de bemiddelaar voor nieuw af
      te sluiten overeenkomsten inzake krediet geldt op het tijdstip waarop de wijziging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel64
  - number: '65'
    text: |-
      Een bemiddelaar heeft over de periode waarin een consument ten minste twee maanden achterstallig is in de betaling
      van een vervallen termijnbedrag, geen aanspraak op provisie ter zake van de desbetreffende overeenkomst.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel65
  - number: '66.1'
    text: |-
      Met ingang van het tijdstip waarop een aanbieder het door een consument verschuldigde vervroegd opeist in een
      geval als bedoeld in [artikel 33, onder c, van de Wet op het consumentenkrediet][ref1], heeft de bemiddelaar geen
      aanspraak meer op provisie ter zake van de desbetreffende overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel33
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '33'
  - number: '66.2'
    text: |-
      Met ingang van het tijdstip waarop de overeenkomst inzake krediet van rechtswege wordt ontbonden op grond van
      [artikel 41, derde lid, van de Wet op het consumentenkrediet][ref1], heeft de bemiddelaar geen aanspraak meer op
      provisie ter zake van de desbetreffende overeenkomst, met dien verstande dat indien de ontbinding ongedaan wordt
      gemaakt op grond van [artikel 42, tweede lid, van de Wet op het consumentenkrediet][ref2], hij weer aanspraak heeft
      opprovisie over de periode gerekend vanaf het tijdstip waarop de ontbinding ongedaan is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel42
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '42'
  - number: '67.1'
    text: |-
      Een bemiddelaar krijgt geen provisie uitbetaald indien hij uit hoofde van dit besluit geen aanspraak heeft op
      provisie.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel67
  - number: '67.2'
    text: Provisie wordt uitsluitend betaald in giraal geld.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel67
  - number: '68.1'
    text: |-
      De aan een gevolmachtigde agent of ondergevolmachtigde agent te verlenen volmacht of ondervolmacht wordt opgemaakt
      overeenkomstig een bij ministeriële regeling vast te stellen model.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel68
  - number: '68.2'
    text: Een volmacht kan door de aanbieder worden beperkt.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel68
  - number: '68.3'
    text: |-
      Een ondervolmacht kan zowel door de aanbieder als door diens gevolmachtigde, zolang de volmacht van de
      gevolmachtigde van kracht is, worden beperkt. De ondergevolmachtigde geldt jegens de aanbieder niet als derde.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel68
  - number: '68.4'
    text: Beperkingen van de volmacht of ondervolmacht kunnen niet aan derden worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel68
  - number: '69.1'
    text: |-
      Een bemiddelaar of een gevolmachtigde agent gaat na of de aanbieder voor wie hij bemiddelt of optreedt
      als gevolmachtigde agent, als aanbieder van financiële producten waarop de bemiddelingsactiviteiten of de
      activiteiten van de gevolmachtigde agent betrekking hebben, is ingeschreven in het register, bedoeld in
      [artikel 23 van de wet][ref1], indien de bemiddelaar of de gevolmachtigde agent in het kader van zijn normale
      bedrijfsvoering signalen ontvangt die bij hem twijfel oproepen over deze inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel23
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '23'
  - number: '69.2'
    text: |-
      Het bepaalde in eerste lid met betrekking tot de verhouding tussen de bemiddelaar en de aanbieder is van
      overeenkomstige toepassing op:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel69
  - number: 69.2.a
    text: de verhouding tussen de bemiddelaar en de gevolmachtigde agent;
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel69
  - number: 69.2.b
    text: de verhouding tussen de bemiddelaar en de ondergevolmachtigde agent; en
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel69
  - number: 69.2.c
    text: de verhouding tussen de onderbemiddelaar en de bemiddelaar.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel69
  - number: '69.3'
    text: |-
      Het bepaalde in eerste lid met betrekking tot de verhouding tussen de gevolmachtigde agent en de aanbieder is van
      overeenkomstige toepassing op:
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel69
  - number: 69.3.a
    text: de verhouding tussen de ondergevolmachtigde agent en de gevolmachtigde agent; en
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel69
  - number: 69.3.b
    text: |-
      de verhouding tussen de ondergevolmachtigde agent en een andere ondergevolmachtigde agent van wie hij een
      ondervolmacht heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel69
  - number: '70'
    text: |-
      Het bedrag van de boete, bedoeld in [artikel 74, vijfde lid, van de wet][ref1], wordt bepaald op de wijze voorzien
      in [bijlage 10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0019283
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '76'
      - id: ref2
        bwb_id: BWBR0019283
  - number: '71'
    text: |-
      De [artikelen 62 tot en met 66][ref1] zijn niet van toepassing op overeenkomsten inzake krediet, niet zijnde
      doorlopend krediet, welke zijn afgesloten voor 1 januari 1992.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel62
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '62'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '72.1'
    text: |-
      Een diploma is voor de toepassing van [artikel 17, eerste lid, onderdeel a, of tweede lid, onderdeel a,][ref1]
      geldig, indien het een tussen 1 januari 2000 en 1 oktober 2007 behaald diploma betreft als genoemd in de eerste
      kolom van de bij dit artikel behorende [bijlage 11][ref2], dat is afgegeven door een in de tweede kolom genoemde
      instelling, voor de eindtermen, bedoeld in de derde kolom van de tabel, en, indien het een diploma betreft voor
      hypothecair krediet of een levensverzekering, de houder van het diploma vanaf 1 oktober 2007 tevens op de door Onze
      Minister vast te stellen wijze voldoet aan de eindtermen, opgenomen in [bijlage 6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0019283
      [ref3]: https://wetten.overheid.nl/BWBR0019283
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019283
      - id: ref3
        bwb_id: BWBR0019283
  - number: '72.2'
    text: |-
      Een diploma is voor de toepassing van [artikel 17, eerste lid, onderdeel a, of tweede lid, onderdeel a][ref1],
      geldig, indien het een voor 1 januari 2000 behaald diploma betreft als genoemd in de eerste kolom van de bij
      dit artikel behorende [bijlage 11][ref2], dat is afgegeven door een in de tweede kolom genoemde instelling, voor
      de eindtermen, bedoeld in de derde kolom van de tabel, en, indien de houder van het diploma in de periode van
      1 januari 2000 tot de datum van inwerkingtreding van dit besluit ten minste drie jaar relevante werkervaring heeft
      opgedaan, en, indien het een diploma betreft voor hypothecair krediet of een levensverzekering, de houder van
      het diploma vanaf 1 oktober 2007 tevens op de door Onze Minister vast te stellen wijzevoldoet aan de eindtermen,
      opgenomen in [bijlage 6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0019283
      [ref3]: https://wetten.overheid.nl/BWBR0019283
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019283
      - id: ref3
        bwb_id: BWBR0019283
  - number: '72.3'
    text: |-
      Onze Minister kan in aanvulling op het eerste en tweede lid een ander diploma aanwijzen als geldig diploma, bedoeld
      in [artikel 17, eerste lid, onderdeel a, of tweede lid, onderdeel a][ref1]. Indien een op grond van de vorige
      volzin aangewezen diploma is behaald voor 1 januari 2000 is het slechts geldig indien de houder van het diploma
      in de periode van 1 januari 2000 tot de datum van inwerkingtreding van dit besluit ten minste drie jaar relevante
      werkervaring heeft opgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019283#Artikel17
    url: https://wetten.overheid.nl/BWBR0019283/2006-05-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0019283
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '72.4'
    text: |-
      De instellingen genoemd in de tweede kolom van de bij dit artikel behorende [bijlage 11][ref1] beschikken
      van rechtswege over een erkenning als bedoeld in [artikel 20][ref2] voor het afgeven van diploma’s genoemd
      in de eerste kolom. Onverminderd het eerste en tweede lid, is een diploma als genoemd in de eerste kolom van
      [bijlage 11][ref3] dat wordt afgegeven na inwerkingtreding van dit artikel, slechts geldig voor de toepassing van
      [artikel 17, eerste lid, onderdeel a, of tweede lid, onderdeel a][ref4], indien de in de tweede kolom genoemde
      instelling op het moment van het afgeven van het diploma over een erkenning beschikt.


