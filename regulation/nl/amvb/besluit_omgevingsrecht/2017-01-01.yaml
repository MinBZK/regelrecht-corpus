        bwb_id: BWBR0027464
  - number: '2.6'
    text: |-
      In afwijking van [artikel 2.1, eerste lid, aanhef en onder g en h, van de wet][ref1] is geen omgevingsvergunning
      vereist voor het slopen van:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.6.a
    text: |-
      bouwwerken waarvoor ingevolge [artikel 2.3][ref1] geen vergunning voor het bouwen daarvan is vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel2.6
    references:
