      omgevingsvergunning vereist met betrekking tot veranderingen van de inrichting of van de werking daarvan voor
      zover die veranderingen betrekking hebben op een activiteit die geen deel uitmaakt van een IPPC-installatie en op
      die activiteit [hoofdstuk 3 van het Activiteitenbesluit milieubeheer][ref2] van toepassing is, tenzij het betreft
      veranderingen:


