    text: Onze Minister;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.15
  - number: 6.15.1.b
    text: |-
      de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder, bedoeld in
      [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.15
    references:
