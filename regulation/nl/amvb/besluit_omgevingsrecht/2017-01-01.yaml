        artikel: '3'
  - number: 5.21.1
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.2aa, onderdeel a][ref1],
      kan de omgevingsvergunning slechts worden verleend op de gronden die zijn aangegeven in de
      [artikelen 2.8][ref2] en [5.5, derde lid, van de Wet natuurbescherming][ref3], het bepaalde krachtens
      [artikel 2.9, zevende lid, van die wet][ref4] en de [artikelen 2.13](onbekend) en [2.14 van het Besluit
      natuurbescherming](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.21
    references:
