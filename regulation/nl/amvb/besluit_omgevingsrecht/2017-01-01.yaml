  - number: 6.15.2
    text: |-
      In gevallen als bedoeld in het eerste lid zendt het bevoegd gezag uiterlijk twee weken na de bekendmaking van de
      omgevingsvergunning een afschrift daarvan aan:
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.15
  - number: 6.15.2.a
    text: Onze Minister;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.15
  - number: 6.15.2.b
    text: |-
      de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder, bedoeld in
      [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '1'
  - number: 6.15.2.c
    text: de arbeidsinspectie;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.15
  - number: 6.15.2.d
    text: het college van burgemeester en wethouders van de gemeente waarin de inrichting geheel of gedeeltelijk is gelegen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.15
  - number: 6.15.2.e
    text: het bestuur van de veiligheidsregio.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.15
  - number: 6.15.3
    text: |-
      Het bevoegd gezag zendt, indien tijdens de behandeling van de aanvraag een aanvulling op het veiligheidsrapport,
      bedoeld in [artikel 1, eerste lid, Besluit risico’s zware ongevallen 2015][ref1], is ontvangen, deze aanvulling
      uiterlijk twee weken na ontvangst aan de in het eerste lid genoemde bestuursorganen en aan de daar bedoelde
      toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel1
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '1'
  - number: 6.15.4
    text: |-
      Het bevoegd gezag stelt het bestuursorgaan dat zorg draagt voor het beheer van een zuiveringstechnisch werk
      waarop, of van een oppervlaktewaterlichaam waarin als gevolg van een zwaar ongeval, al dan niet door middel van
      een voorziening voor de inzameling en het transport van afvalwater of een ander werk, kan worden geloosd, in de
      gelegenheid advies uit te brengen over die onderdelen van het veiligheidsrapport, die betrekking hebben op de
      risico’s voor dat zuiveringstechnisch werk of dat oppervlaktewaterlichaam.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.15
  - number: '6.16'
    text: |-
      Het bevoegd gezag zendt in een geval als bedoeld in [bijlage I][ref1], categorie 21, 28.4, onder g, of 29.1,
      onder k, met het oog op de voorbereiding van de bestrijding van rampen en zware ongevallen een exemplaar van de
      schriftelijke samenvatting van de risicoanalyse aan:


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.16
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 6.16.a
    text: de burgemeester van de gemeente waar de inrichting geheel of in hoofdzaak zal zijn of is gelegen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.16
  - number: 6.16.b
    text: de commissaris van de Koningin in de provincie waar een gemeente als bedoeld onder a is gelegen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.16
  - number: 6.16.c
    text: het bestuur van de veiligheidsregio waar een gemeente als bedoeld onder a is gelegen.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.16
  - number: 6.17.1
    text: |-
      Het bevoegd gezag zendt in een geval als bedoeld in [artikel 6.15][ref1] met het oog op de voorbereiding van de
      bestrijding van rampen en zware ongevallen de daarin bedoelde onderdelen van het veiligheidsrapport en, indien
      tijdens de behandeling van de aanvraag een aanvulling op het veiligheidsrapport is ontvangen, deze aanvulling aan:


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel6
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.17.1.a
    text: |-
      de burgemeester van de gemeente die kan worden getroffen door een zwaar ongeval bij een inrichting waarop het
      veiligheidsrapport betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.17
  - number: 6.17.1.b
    text: |-
      de commissaris van de Koningin in de provincie waar een gemeente is gelegen waarin de inrichting geheel of
      gedeeltelijk zal zijn of is gelegen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.17
  - number: 6.17.1.c
    text: de commissaris van de Koningin in de provincie waarin een gemeente als bedoeld onder a is gelegen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.17
  - number: 6.17.1.d
    text: het bestuur van de veiligheidsregio binnen wier gebied een gemeente als bedoeld onder a of c is gelegen.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.17
  - number: 6.17.2
    text: |-
      Het bevoegd gezag zendt een exemplaar van de stukken, bedoeld in het eerste lid, aan de aangrenzende staat, indien
      een zwaar ongeval bij de inrichting waarop het veiligheidsrapport betrekking heeft de aangrenzende staat kan
      treffen. In dat geval zendt hij tevens een exemplaar aan Onze Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.17
  - number: 6.17.3
    text: |-
      In afwijking van het tweede lid zendt het bevoegd gezag, indien krachtens
      [artikel 19.3 van de Wet milieubeheer][ref1] een tweede tekst is overgelegd, een exemplaar van deze tekst aan de
      betrokken staat.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
  - number: '6.18'
    text: |-
      Op de voorbereiding van een omgevingsvergunning die wordt verleend met toepassing
      van [artikel 2.12, eerste lid, onder a, onder 3°, van de wet][ref1] is
      [artikel 3.1.1 van het Besluit ruimtelijke ordening][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0023798
        artikel: '3'
  - number: '6.19'
    text: |-
      Als categorie van gevallen als bedoeld in [artikel 3.9, derde lid, tweede volzin, van de wet][ref1] wordt
      aangewezen de beslissing op een aanvraag om een omgevingsvergunning voor activiteiten als bedoeld in
      [artikel 2.2a, eerste lid, onder a tot en met i, tweede lid, onder a, b en h, vierde en vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.19
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '7.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder bestuursorgaan: bestuursorgaan als bedoeld in
      [artikel 5.3, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
  - number: 7.2.1
    text: |-
      Het bestuursorgaan stelt het handhavingsbeleid vast in een of meer documenten waarin gemotiveerd wordt
      aangegeven welke doelen het zichzelf stelt bij de handhaving en welke activiteiten het daartoe zal uitvoeren.
      Het bestuursorgaan beziet regelmatig, maar in elk geval naar aanleiding van de evaluatie, bedoeld in
      [artikel 7.7, tweede lid][ref1], of dit beleid moet worden aangepast en past het zonodig aan. Het bestuursorgaan
      draagt er zorg voor dat dit beleid en het handhavingsbeleid van de andere betrokken bestuursorganen en de organen
      die belast zijn met de strafrechtelijke handhaving onderling worden afgestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.2
    text: |-
      Het handhavingsbeleid is gebaseerd op een analyse van de problemen die zich naar het oordeel van het bestuursorgaan
      kunnen voordoen met betrekking tot de naleving van het bij of krachtens de betrokken wetten bepaalde in de gevallen
      waarin de zorg voor de handhaving daarvan aan hem is opgedragen.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.2
  - number: 7.2.3
    text: 'Het handhavingsbeleid geeft inzicht in:'
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.2
  - number: 7.2.3.a
    text: de prioriteitenstelling met betrekking tot de uitvoering van de krachtens het eerste lid voorgenomen activiteiten;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.2
  - number: 7.2.3.b
    text: |-
      de methodiek die het bestuursorgaan hanteert om te bepalen of de krachtens het eerste lid gestelde doelen worden
      bereikt.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.2
  - number: 7.2.4
    text: 'Het handhavingsbeleid geeft voorts inzicht in de strategie die het bestuursorgaan hanteert met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.2
  - number: 7.2.4.a
    text: |-
      de wijze waarop het toezicht op de naleving van het bij of krachtens de betrokken wetten bepaalde wordt uitgeoefend
      om de krachtens het eerste lid gestelde doelen te bereiken;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.2
  - number: 7.2.4.b
    text: |-
      de rapportage van de bevindingen van degenen die toezicht hebben uitgeoefend en het vervolg dat aan die bevindingen
      wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.2
  - number: 7.2.4.c
    text: |-
      de wijze waarop bestuurlijke sancties alsmede de termijnen die bij het geven en uitvoeren daarvan worden
      gehanteerd, en de strafrechtelijke handhaving onderling worden afgestemd, en waarbij tevens aandacht wordt besteed
      aan de aard van de geconstateerde overtredingen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.2
  - number: 7.2.4.d
    text: |-
      de wijze waarop het bestuursorgaan omgaat met overtredingen die zijn begaan door of in naam van dat bestuursorgaan
      of van andere organen behorende tot de overheid.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.2
  - number: 7.2.5
    text: |-
      Het handhavingsbeleid geeft tevens inzicht in de afspraken die het bestuursorgaan heeft gemaakt met de andere
      betrokken bestuursorganen en de organen die belast zijn met de strafrechtelijke handhaving, over de samenwerking
      bij en de afstemming van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.2
  - number: 7.2.6
    text: |-
      Burgemeester en wethouders maken het handhavingsbeleid bekend aan de gemeenteraad. Gedeputeerde staten maken het
      handhavingsbeleid bekend aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.2
  - number: 7.3.1
    text: |-
      Het bestuursorgaan werkt het handhavingsbeleid jaarlijks uit in een uitvoeringsprogramma waarin wordt
      aangegeven welke van de voorgenomen activiteiten het bestuursorgaan het komende jaar uitvoert. Daarbij houdt het
      bestuursorgaan rekening met de krachtens [artikel 7.2, eerste lid][ref1], gestelde doelen en de krachtens artikel
      7.2, derde lid, onder a, gestelde prioriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.2
    text: |-
      Het bestuursorgaan stemt het uitvoeringsprogramma af met de andere betrokken bestuursorganen en de organen die
      belast zijn met de strafrechtelijke handhaving.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.3
  - number: 7.3.3
    text: |-
      Burgemeester en wethouders maken het uitvoeringsprogramma bekend aan de gemeenteraad. Gedeputeerde staten maken het
      uitvoeringsprogramma bekend aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.3
  - number: 7.4.1
    text: |-
      Het bestuursorgaan richt zijn organisatie zodanig in dat een adequate en behoorlijke uitvoering van het
      handhavingsbeleid, bedoeld in [artikel 7.2][ref1], en het uitvoeringsprogramma, bedoeld in [artikel 7.3][ref2],
      gewaarborgd is. Daartoe draagt het bestuursorgaan er in ieder geval zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.4.1.a
    text: |-
      de personeelsformatie ten behoeve van de handhaving en de bij de onderscheiden functies behorende taken,
      bevoegdheden en verantwoordelijkheden worden vastgelegd;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.4
  - number: 7.4.1.b
    text: |-
      de personen die zijn belast met de voorbereiding van besluiten ten aanzien van aanvragen om een omgevingsvergunning
      voor zover deze betrekking hebben op activiteiten met betrekking tot een inrichting als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de wet][ref1] of met de voorbereiding van beslissingen als bedoeld
      in [artikel 8.40a, derde lid, van de Wet milieubeheer][ref2] of het stellen van voorschriften als bedoeld in
      [artikel 8.42, eerste lid, van de Wet milieubeheer][ref3] niet worden belast met:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 7.4.1.b.1°
    text: |-
      het toezicht op de naleving van het bij of krachtens de betrokken wetten bepaalde met betrekking tot een
      inrichting, en
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.4
  - number: 7.4.1.b.2°
    text: het voorbereiden of uitvoeren van bestuurlijke sancties met betrekking tot een inrichting;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.4
  - number: 7.4.1.c
    text: |-
      een krachtens [artikel 5.10 van de wet][ref1] aangewezen ambtenaar niet voortdurend feitelijk wordt belast met het
      uitoefenen van toezicht op de naleving van het bij of krachtens de betrokken wetten bepaalde met betrekking tot
      dezelfde inrichting;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
  - number: 7.4.1.d
    text: de organisatie van het bestuursorgaan ook buiten de gebruikelijke kantooruren bereikbaar en beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.4
  - number: 7.4.2
    text: 'Het bestuursorgaan draagt er tevens zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.4
  - number: 7.4.2.a
    text: |-
      een beschrijving van de werkprocessen, de procedures en de bijbehorende informatievoorziening inzake het toezicht
      op de naleving van het bij of krachtens de betrokken wetten bepaalde en het voorbereiden, geven en uitvoeren van
      bestuurlijke sancties wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.4
  - number: 7.4.2.b
    text: de uit te voeren werkzaamheden plaatsvinden overeenkomstig deze beschrijving.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.4
  - number: '7.5'
    text: 'Het bestuursorgaan draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.5
  - number: 7.5.a
    text: |-
      de voor het bereiken van de krachtens [artikel 7.2, eerste lid][ref1], gestelde doelen en de voor het uitvoeren van
      de in dat artikellid bedoelde activiteiten benodigde en beschikbare financiële en personele middelen inzichtelijk
      worden gemaakt en in de begroting worden gewaarborgd;


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.5.b
    text: |-
      de wijze van berekening van de benodigde financiële en personele middelen als bedoeld onder a, inzichtelijk wordt
      gemaakt;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.5
  - number: 7.5.c
    text: |-
      voor de uitvoering van het uitvoeringsprogramma, bedoeld in [artikel 7.3, eerste lid][ref1], voldoende
      benodigde financiële en personele middelen beschikbaar zijn en dat deze middelen zonodig worden aangevuld of het
      uitvoeringsprogramma zo nodig wordt aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.6.1
    text: 'Het bestuursorgaan bewaakt met behulp van een geautomatiseerd systeem de resultaten en de voortgang van:'
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.6
  - number: 7.6.1.a
    text: |-
      de uitvoering van het uitvoeringsprogramma, bedoeld in [artikel 7.3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.6.1.b
    text: |-
      het bereiken van de krachtens [artikel 7.2, eerste lid][ref1], gestelde doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.6.2
    text: In het systeem worden voorts in het kader van de handhaving verkregen gegevens geregistreerd.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.6
  - number: 7.7.1
    text: 'Het bestuursorgaan rapporteert periodiek over:'
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.7
  - number: 7.7.1.a
    text: |-
      het bereiken van de krachtens [artikel 7.2, eerste lid][ref1], gestelde doelen;


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.7.1.b
    text: |-
      de uitvoering van de voorgenomen activiteiten, bedoeld in [artikel 7.2, eerste lid][ref1], in verhouding tot de
      prioriteitenstelling, bedoeld in artikel 7.2, derde lid, onder a;


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.7.1.c
    text: |-
      de uitvoering van de afspraken, bedoeld in [artikel 7.2, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.7.2
    text: |-
      Het bestuursorgaan evalueert jaarlijks of de in het uitvoeringsprogramma, bedoeld in
      [artikel 7.3, eerste lid][ref1], opgenomen activiteiten zijn uitgevoerd en in hoeverre deze activiteiten hebben
      bijgedragen aan het bereiken van de krachtens [artikel 7.2, eerste lid][ref2], gestelde doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.7.3
    text: |-
      Burgemeester en wethouders maken de rapportage, bedoeld in het eerste lid, en het verslag van de evaluatie, bedoeld
      in het tweede lid, bekend aan de gemeenteraad. Gedeputeerde staten maken de rapportage, bedoeld in het eerste lid,
      en het verslag van de evaluatie, bedoeld in het tweede lid, bekend aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel7.7
