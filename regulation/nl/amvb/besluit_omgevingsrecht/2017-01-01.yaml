        paragraaf: '6.2'
  - number: 5.22.2
    text: |-
      Aan een omgevingsvergunning voor een activiteit als bedoeld in [artikel 2.2aa, onderdeel b][ref1], voor zover
      het betreft een handeling als bedoeld in [artikel 3.1 van de Wet natuurbescherming][ref2], worden voorschriften
      verbonden als bedoeld in [artikel 3.3, vijfde lid, van de Wet natuurbescherming][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
