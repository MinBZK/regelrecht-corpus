      vereist voor de categorieën gevallen in artikel 2 in samenhang met artikel 5 en artikel 8 van [bijlage II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027464
