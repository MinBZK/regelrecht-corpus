        artikel: '3'
  - number: 5.23.1
    text: |-
      Het bevoegd gezag wijzigt voorschriften van de omgevingsvergunning die betrekking hebben op een
      activiteit als bedoeld in [artikel 2.2aa, onderdeel a][ref1], op de grond die is aangegeven in
      [artikel 5.4, tweede lid, van de Wet natuurbescherming][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel5
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
