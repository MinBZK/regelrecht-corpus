        artikel: '3'
  - number: 5.21.4
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.2aa, onderdeel b][ref1], en
      het betreft een handeling als bedoeld in [artikel 3.10, eerste lid, van de Wet natuurbescherming][ref2] kan de
      omgevingsvergunning slechts worden verleend op de gronden die zijn aangegeven in [artikel 3.8, vijfde lid][ref3],
      of 3.10, tweede lid, van de Wet natuurbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.21
    references:
