        artikel: '5'
  - number: 5.13b.8
    text: |-
      Een omgevingsvergunning voor de categorieën activiteiten, bedoeld in [artikel 2.2a, vijfde lid][ref1], wordt
      geweigerd, indien de activiteit leidt tot een niet aanvaardbaar niveau van geurhinder.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13b
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.13b.9
    text: |-
      Een omgevingsvergunning voor de categorie activiteiten, bedoeld in [artikel 2.2a, zesde lid][ref1],
      wordt geweigerd indien het bodemenergiesysteem zodanige interferentie kan veroorzaken met een ander
      bodemenergiesysteem, met inbegrip van een open bodemenergiesysteem waarvoor een vergunning krachtens
      [artikel 6.4, eerste lid, onder b, van de Waterwet][ref2] is vereist, dat het doelmatig functioneren van een
      van de desbetreffende systemen kan worden geschaad dan wel anderszins sprake is van een ondoelmatig gebruik van
      bodemenergie.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13b
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 5.13b.10
    text: |-
      Een omgevingsvergunning voor de categorieën activiteiten, bedoeld in [artikel 2.2a, zevende lid][ref1], wordt
      geweigerd indien de activiteit leidt tot het ontstaan of het vergroten van een of meer veiligheidszones ten
      opzichte van de krachtens [artikel 2.6.5, tweede lid, van het Besluit algemene regels ruimtelijke ordening][ref2]
      aangewezen veiligheidszones waardoor een nieuwe inbreuk op een veiligheidszone ontstaat of het plaatsgebonden
      risico bij een bestaande inbreuk op een veiligheidszone groter wordt dan 10-5.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030378#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13b
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0030378
        artikel: '2'
  - number: 5.13b.11
    text: |-
      Een omgevingsvergunning voor de categorie activiteiten, bedoeld in [artikel 2.2a, achtste lid][ref1], wordt
      geweigerd, indien de activiteit leidt tot een onaanvaardbaar risico voor de leefomgeving, waarbij in ieder geval
      wordt betrokken:


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13b
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.13b.11.a
    text: de ligging van de risicocontour;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13b
  - number: 5.13b.11.b
    text: de invloed van risicovolle activiteiten in de omgeving op de installatie, en
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13b
  - number: 5.13b.11.c
    text: de kans op gevolgen van incidenten bij de installatie en de mogelijke gevolgen daarvan voor de leefomgeving.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13b
  - number: 5.14.1
    text: |-
      Bij ministeriële regeling kunnen voor daarbij aangewezen categorieën activiteiten of gevallen regels worden gesteld
      met betrekking tot het verbinden van voorschriften aan de omgevingsvergunning voor activiteiten met betrekking tot
      een inrichting als bedoeld in [artikel 2.1, eerste lid, onder e, van de wet][ref1], mits die regels uitsluitend
      strekken ter uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een
      volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 5.14.2
    text: |-
      Het ontwerp van een ministeriële regeling als bedoeld in het eerste lid wordt ten minste vier weken voordat de
      regeling wordt vastgesteld toegezonden aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.14
  - number: '5.15'
    text: |-
      Indien de omgevingsvergunning betrekking heeft op een activiteit als bedoeld in artikel 1.3a, eerste
      lid, van de Wet milieubeheer, zijn de bepalingen die ten aanzien van het verbinden van voorschriften
      aan een ontheffing voor die activiteit zijn opgenomen in de provinciale milieuverordening, bedoeld in
      [artikel 1.2, eerste lid, van die wet][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 5.16.1
    text: |-
      In een omgevingsvergunning voor het bouwen, bedoeld in [artikel 2.1, eerste lid, onder a, van de wet][ref1], van
      een tijdelijk bouwwerk als bedoeld in [artikel 1.1, eerste lid, van het Bouwbesluit 2012][ref2], wordt bepaald
      dat de vergunninghouder na het verstrijken van een bij de omgevingsvergunning aangegeven termijn van ten hoogste
      vijftien jaar verplicht is de voor de verlening van de omgevingsvergunning bestaande toestand hersteld te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 5.16.2
    text: |-
      Indien de in de omgevingsvergunning aangegeven termijn korter is dan vijftien jaar, kan die termijn worden verlengd
      tot ten hoogste vijftien jaar.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.16
  - number: '5.18'
    text: |-
      Als geval als bedoeld in [artikel 2.25, derde lid, van de wet][ref1] waarin de omgevingsvergunning slechts
      geldt voor degene aan wie zij is verleend, wordt aangewezen de omgevingsvergunning voor het bewonen van een
      recreatiewoning die met toepassing van [artikel 2.12, eerste lid, onder a, onder 2°, van de wet][ref2] in
      samenhang met artikel 4, onderdeel 10, van [bijlage II][ref3] is verleend. In een omgevingsvergunning als
      bedoeld in de eerste volzin wordt bepaald dat zij slechts geldt voor de termijn gedurende welke degene aan wie de
      vergunning is verleend de desbetreffende recreatiewoning onafgebroken bewoont.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0027464
  - number: '5.20'
    text: |-
      Voor zover de omgevingsvergunning wordt verleend met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de wet][ref1] zijn de [artikelen 3.1.2][ref2], [3.1.6][ref3] en
      [3.3.1, eerste lid, van het Besluit ruimtelijke ordening][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0023798#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0023798#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.20
    references:
