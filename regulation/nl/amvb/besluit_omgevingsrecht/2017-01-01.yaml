    text: |-
      In afwijking van [artikel 2.1, eerste lid, aanhef en onder f, van de wet][ref1] is geen omgevingsvergunning vereist
      voor de categorieën gevallen in artikel 3a van [bijlage II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
