        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 6.10a.5
    text: |-
      Ingeval de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.2aa, onderdeel a][ref1], wordt
      in voorkomend geval in de verklaring opgenomen hoeveel ontwikkelingsruimte overeenkomstig [artikel 2.7, eerste
      lid, aanhef en onderdeel d, van het Besluit natuurbescherming](onbekend) wordt toegedeeld aan het project,
      onderscheidenlijk de andere handeling.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.10a
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 6.10b
    text: |-
      Voor zover een omgevingsvergunning betrekking heeft op een activiteit als bedoeld
      in [artikel 2.2aa, onderdeel a][ref1], geeft een bestuursorgaan als bedoeld in
      [artikel 6.10a, eerste of tweede lid][ref2], toepassing aan [artikel 2.29, eerste lid, van de wet][ref3] in het
      geval, bedoeld in [artikel 5.4, tweede lid, van de Wet natuurbescherming][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel5
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.10b
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '5'
  - number: 6.11.1
    text: |-
      Indien een inrichting belangrijke nadelige gevolgen voor het milieu in een andere lidstaat van de Europese Unie
      kan veroorzaken, dan wel indien een andere lidstaat van de Europese Unie die belangrijke nadelige gevolgen voor
      het milieu van een inrichting kan ondervinden, daarom verzoekt, verstrekt het bevoegd gezag een afschrift van
      de aanvraag met de daarbij behorende gegevens en bescheiden aan die lidstaat op het tijdstip waarop daarvan in
      Nederland kennis wordt gegeven dan wel de aanvraag met de daarbij behorende gegevens en bescheiden in Nederland ter
      inzage wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.11
  - number: 6.11.2
    text: |-
      In gevallen als bedoeld in het derde lid verstrekt het bevoegd gezag een afschrift van de aanvraag met de daarbij
      behorende gegevens en bescheiden aan Onze Minister van Defensie op het tijdstip waarop:
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.11
  - number: 6.11.2.a
    text: kennis wordt gegeven van de aanvraag, of
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.11
  - number: 6.11.2.b
    text: de aanvraag met de daarbij behorende gegevens en bescheiden ter inzage wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.11
  - number: 6.11.3
    text: |-
      Het tweede lid is van toepassing op een aanvraag voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder c, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6.11.3.a
    text: |-
      die plaatsvindt in een in het bestemmingsplan of de beheersverordening opgenomen obstakelbeheergebied rondom een
      militaire luchthaven en betrekking heeft op een antenne-installatie als bedoeld in artikel 4, onderdeel 5, van
      [bijlage II][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 6.11.3.b
    text: 'die plaatsvindt in een A- of B-veiligheidszone rondom een munitieopslag en betrekking heeft op:'
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.11
  - number: 6.11.3.b.1°
    text: |-
      een bijbehorend bouwwerk of uitbreiding daarvan als bedoeld in artikel 4, onderdeel 1, van [bijlage II][ref1], voor
      zover het betreft huisvesting in verband met mantelzorg als bedoeld in artikel 1, eerste lid, van die bijlage;


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 6.11.3.b.2°
    text: |-
      het gebruiken van bouwwerken, eventueel in samenhang met bouwactiviteiten die de bebouwde oppervlakte of het
      bouwvolume niet vergroten, en van bij die bouwwerken aansluitend terrein, bedoeld in artikel 4, onderdeel 9, van
      [bijlage II][ref1], voor zover het betreft een buiten de bebouwde kom gelegen logiesfunctie voor werknemers;


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 6.11.3.b.3°
    text: |-
      ander gebruik van gronden of bouwwerken voor een termijn van ten hoogste tien jaar als bedoeld in artikel 4,
      onderdeel 11, van [bijlage II][ref1], voor zover dat gebruik strekt tot het mogelijk maken van het verblijf van
      personen.


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 6.12.1
    text: |-
      Met betrekking tot een aanvraag ten aanzien van activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder c, van de wet][ref1], waarbij toepassing wordt gegeven aan
      [artikel 2.12, eerste lid, onder a, onder 3°, of onder c, van de wet][ref2], zendt het bevoegd gezag het
      ontwerpbesluit met de daarop betrekking hebbende stukken die redelijkerwijs nodig zijn voor de beoordeling van het
      ontwerp, toe aan gedeputeerde staten en de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6.12.2
    text: |-
      Met betrekking tot een aanvraag ten aanzien van activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de wet][ref1], die op het grondgebied van twee of meer provincies
      plaatsvinden, in gevallen waarin gedeputeerde staten het bevoegd gezag zijn, zenden zij het ontwerpbesluit met
      de daarop betrekking hebbende stukken die redelijkerwijs nodig zijn voor een beoordeling van het ontwerp, toe aan
      gedeputeerde staten van de provincies waarin de betrokken inrichting gedeeltelijk zal zijn of is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6.12.3
    text: |-
      Met betrekking tot een aanvraag ten aanzien van activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de wet][ref1], in gevallen waarin Onze Minister van Economische Zaken
      het bevoegd gezag is, zendt deze het ontwerpbesluit met de daarop betrekking hebbende stukken die redelijkerwijs
      nodig zijn voor een beoordeling van het ontwerp, toe aan gedeputeerde staten van de provincie waarin de betrokken
      inrichting geheel of gedeeltelijk zal zijn of is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6.12.4
    text: |-
      Met betrekking tot een aanvraag ten aanzien van een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder f, van de wet][ref1], zendt het bevoegd gezag het ontwerpbesluit met de daarop
      betrekking hebbende stukken die redelijkerwijs nodig zijn voor een beoordeling van het ontwerp, toe aan Onze
      Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6.13.1
    text: |-
      Het bevoegd gezag zendt een afschrift van de beschikking op de aanvraag toe aan de personen of bestuursorganen,
      bedoeld in de [artikelen 6.1][ref1], [6.3][ref2], [6.4][ref3] en [6.12][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0027464#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0027464#Artikel6
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0027464
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0027464
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.13.2
    text: |-
      Met betrekking tot een aanvraag ten aanzien van een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a of b, van de wet][ref1], welke betrekking heeft op een beschermd stads- of
      dorpsgezicht als bedoeld in de [Monumentenwet 1988][ref2], zoals die wet luidde voor inwerkingtreding van de
      [Erfgoedwet][ref3], zendt het bevoegd gezag gelijktijdig met de toezending aan de aanvrager een afschrift van de
      beschikking toe aan Onze Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004471
      [ref3]: https://wetten.overheid.nl/BWBR0037521
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004471
      - id: ref3
        bwb_id: BWBR0037521
  - number: 6.13.3
    text: |-
      Met betrekking tot een aanvraag ten aanzien van een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder f of h, van de wet][ref1], zendt het bevoegd gezag gelijktijdig met de toezending
      aan de aanvrager een afschrift van de beschikking toe aan Onze Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6.13.4
    text: |-
      Met betrekking tot een aanvraag ten aanzien van een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de wet][ref1] met betrekking tot een inrichting als bedoeld in
      [bijlage I][ref2], onderdeel C, onder 3.6, onder a of b, zendt het bevoegd gezag langs elektronische weg
      gelijktijdig met de toezending aan de aanvrager een afschrift van de beschikking toe aan Onze Minister. Bij
      ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze waarop het afschrift wordt
      verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027464
  - number: 6.13.5
    text: |-
      Het eerste tot en met vierde lid is van overeenkomstige toepassing op ambtshalve gegeven beschikkingen tot
      wijziging van een omgevingsvergunning of voorschriften van een omgevingsvergunning of tot gehele of gedeeltelijke
      intrekking van een omgevingsvergunning, met dien verstande dat in het tweede tot en met vierde lid in plaats van
      «aanvrager» wordt gelezen «degenen tot wie de beschikking is gericht».
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.13
  - number: 6.14.1
    text: |-
      Een kennisgeving als bedoeld in de [artikel 3:12][ref1] en een mededeling als bedoeld in
      [artikel 3:44 van de Algemene wet bestuursrecht][ref2] worden in de Staatscourant geplaatst, voor zover het
      betreft een besluit tot verlening van een omgevingsvergunning waarbij sprake is van een geval als bedoeld
      in [artikel 2.12, eerste lid, aanhef en onder a, onder 3°, van de wet][ref3]. De mededeling, bedoeld in de
      eerste volzin, wordt tevens langs elektronische weg gedaan en aan eenieder beschikbaar gesteld op de landelijke
      voorziening, bedoeld in [artikel 1.2.1, tweede lid, van het Besluit ruimtelijke ordening][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0023798#Artikel1
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0023798
        artikel: '1'
  - number: 6.14.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de mededeling, bedoeld in het eerste
      lid, elektronisch wordt gedaan of beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.14
  - number: 6.15.1
    text: |-
      Voor zover een aanvraag betrekking heeft op activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de wet][ref1], binnen een hogedrempelinrichting als bedoeld in
      [artikel 1, eerste lid, Besluit risico’s zware ongevallen 2015][ref2], zendt het bevoegd gezag uiterlijk twee
      weken na ontvangst van de aanvraag, een afschrift daarvan en van de daarbij behorende gegevens en bescheiden, aan:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0036791#Artikel1
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
