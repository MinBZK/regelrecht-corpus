        bwb_id: BWBR0037552
        artikel: '5'
  - number: 5.23.2
    text: |-
      Het bevoegd gezag kan voorschriften van de omgevingsvergunning die betrekking hebben op een activiteit
      als bedoeld in [artikel 2.2aa, onderdeel a][ref1], wijzigen op de gronden die zijn aangegeven in
      [artikel 5.4, eerste lid, onderdelen c en d, van de Wet natuurbescherming][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel5
