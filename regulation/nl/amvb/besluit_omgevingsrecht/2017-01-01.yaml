  - number: '2.5'
    text: |-
      In afwijking van [artikel 2.1, eerste lid, aanhef en onder e, van de wet][ref1] is geen
      omgevingsvergunning vereist met betrekking tot mijnbouwwerken die behoren tot een in
      [artikel 4 van het Besluit algemene regels milieu mijnbouw][ref2] aangewezen categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
