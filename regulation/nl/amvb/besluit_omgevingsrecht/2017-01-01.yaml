  - number: 3.3.1
    text: |-
      Gedeputeerde staten van de provincie waar het betrokken project in hoofdzaak zal worden of wordt uitgevoerd, zijn
      bevoegd te beslissen op:
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel3.3
  - number: 3.3.1.a
    text: |-
      elke aanvraag die betrekking heeft op activiteiten met betrekking tot een inrichting waarop het
      [Besluit risico’s zware ongevallen 2015][ref1] van toepassing is of waartoe een installatie behoort voor een
      industriële activiteit als bedoeld in bijlage I, categorie 4, van richtlijn 2010/75/EU van het Europees Parlement
      en de Raad van 24 november 2010 inzake industriële emissies (PbEU L334),


      [ref1]: https://wetten.overheid.nl/BWBR0036791
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0036791
  - number: 3.3.1.b
    text: |-
      overige aanvragen die betrekking hebben op activiteiten met betrekking tot inrichtingen die behoren tot
      een categorie ten aanzien waarvan dat in [bijlage I][ref1], onderdeel C, is bepaald, voor zover het betreft
      activiteiten met betrekking tot een inrichting waartoe een IPPC-installatie behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 3.3.2
    text: 'Onze Minister is bevoegd te beslissen op een aanvraag die betrekking heeft op:'
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel3.3
  - number: 3.3.2.a
    text: |-
      activiteiten met betrekking tot een inrichting als bedoeld in categorie 29.3 van [bijlage I][ref1], onderdeel C;


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 3.3.2.b
    text: |-
      activiteiten als bedoeld in [artikel 2.1, eerste lid, onder e, van de wet][ref1], met betrekking tot een inrichting
      als bedoeld in categorie 29.1 van [bijlage I][ref2], onderdeel C;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027464
  - number: 3.3.2.c
    text: |-
      een categorie activiteiten als bedoeld in [artikel 2.2a, zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.3.3
    text: |-
      Onze Minister van Verkeer en Waterstaat is bevoegd, in overeenstemming met Onze Minister, te beslissen op een
      aanvraag die betrekking heeft op activiteiten met betrekking tot een inrichting die behoort tot een categorie die
      in [bijlage I][ref1], onderdeel C, is aangewezen en die geheel of in hoofdzaak zal zijn of is gelegen op of in
      de territoriale zee op een plaats die niet deel uitmaakt van een gemeente of provincie, tenzij het vierde lid van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 3.3.4
    text: 'Onze Minister van Economische Zaken is bevoegd te beslissen op een aanvraag die betrekking heeft op:'
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel3.3
  - number: 3.3.4.a
    text: een inrichting die in hoofdzaak een mijnbouwwerk is, en
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel3.3
  - number: 3.3.4.b
    text: mijnbouwwerken, niet zijnde inrichtingen.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      Gedeputeerde staten van de provincie waar het project in hoofdzaak zal worden of wordt uitgevoerd, zijn bevoegd
      te beslissen op een aanvraag die betrekking heeft op een activiteit in, op, onder of over een plaats waar de
      in [artikel 8.49 van de Wet milieubeheer][ref1] bedoelde zorg met betrekking tot een gesloten stortplaats wordt
      uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '3.5'
    text: |-
      Indien de bevoegdheid te beslissen op een aanvraag overgaat naar een ander bestuursorgaan, zendt het bestuursorgaan
      dat het bevoegd gezag wordt, hiervan een kennisgeving aan de aanvrager of de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel3.5
  - number: 4.1.1
    text: Een aanvraag kan langs elektronische weg worden ingediend op een bij ministeriële regeling voorgeschreven wijze.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.1
  - number: 4.2.1
    text: |-
      Indien een aanvraag niet langs elektronische weg wordt ingediend, wordt gebruik gemaakt van een door Onze Minister
      vastgesteld formulier. Het bevoegd gezag stelt op verzoek van de aanvrager het formulier aan hem ter beschikking.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Het bevoegd gezag bepaalt het aantal exemplaren dat van de aanvraag en de daarbij te overleggen gegevens en
      bescheiden wordt ingediend, met een maximum van vier.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.2
  - number: 4.2.3
    text: |-
      In gevallen waarin ingevolge [hoofdstuk 6][ref1] meer dan twee adviezen of verklaringen van geen bedenkingen
      zijn voorgeschreven, verstrekt de aanvrager op verzoek van het bevoegd gezag even zoveel extra exemplaren van de
      aanvraag en de daarbij te verstrekken gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0027464
        hoofdstuk: '6'
  - number: 4.3.1
    text: |-
      In afwijking van [artikel 2:15, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1], neemt het bevoegd
      gezag een aanvraag die langs elektronische weg wordt ingediend, in ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 4.3.2
    text: |-
      Indien een aanvraag langs elektronische weg wordt ingediend, worden de daarbij te verstrekken gegevens en
      bescheiden eveneens langs elektronische weg verstrekt. De aanvrager kan de gegevens en bescheiden op schriftelijke
      wijze verstrekken, voor zover het bevoegd gezag daarvoor toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.3
  - number: 4.3.3
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze waarop een aanvraag langs
      elektronische weg wordt ingediend alsmede met betrekking tot het beheer van de in de landelijke voorziening
      opgenomen gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.3
  - number: 4.3.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de inrichting, instandhouding, werking en
      beveiliging van de landelijke voorziening.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.3
  - number: 4.4.1
    text: |-
      Onverminderd [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref1] en voor zover dat naar het oordeel
      van het bevoegd gezag nodig is voor het nemen van de beslissing op de aanvraag, verstrekt de aanvrager bij de
      aanvraag de bij ministeriële regeling aangewezen gegevens en bescheiden ten aanzien van de activiteiten binnen het
      project waarop de aanvraag betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4.4.2
    text: |-
      De in het eerste lid bedoelde gegevens en bescheiden behoeven niet te worden verstrekt voor zover het bevoegd gezag
      reeds over die gegevens of bescheiden beschikt.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.4
  - number: 4.4.3
    text: De gegevens en bescheiden worden door de aanvrager gekenmerkt als behorende bij de aanvraag.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.4
  - number: 4.5.1
    text: |-
      Indien de aanvrager het bevoegd gezag heeft verzocht de omgevingsvergunning in twee fasen te verlenen, kan hij bij
      de aanvraag om een beschikking voor de eerste onderscheidenlijk tweede fase volstaan met het verstrekken van de
      gegevens en bescheiden die betrekking hebben op de activiteiten waarop de betrokken aanvraag ziet.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.5
  - number: 4.5.2
    text: |-
      Bij de aanvraag om een beschikking met betrekking tot de eerste fase vermeldt de aanvrager uit welke activiteiten
      het gehele project zal bestaan.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.5
  - number: 4.5.3
    text: |-
      Indien ten behoeve van een omgevingsvergunning een milieueffectrapport moet worden opgesteld als bedoeld in
      [hoofdstuk 7 van de Wet milieubeheer][ref1], wordt dit milieueffectrapport ingediend bij de aanvraag om een
      beschikking met betrekking tot de eerste fase.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '7'
  - number: '4.6'
    text: |-
      Indien de aanvraag betrekking heeft op een lagedrempelinrichting als bedoeld in
      [artikel 1, eerste lid, van het Besluit risico’s zware ongevallen 2015][ref1], kan Onze Minister in
      overeenstemming met Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Sociale Zaken en
      Werkgelegenheid nadere regels stellen met betrekking tot de gegevens en bescheiden die bij de aanvraag worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel1
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '1'
  - number: 4.7.1
    text: |-
      Aan de omgevingsvergunning voor een bij ministeriële regeling aangewezen activiteit kunnen, indien gegevens
      en bescheiden niet nodig waren met het oog op het nemen van de beslissing op de aanvraag, voorschriften worden
      verbonden met betrekking tot het alsnog verstrekken van die gegevens en bescheiden binnen een bij die regeling
      aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.7
  - number: 4.7.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.7
  - number: '4.8'
    text: |-
      Bij een melding als bedoeld in [artikel 2.25, tweede lid, van de wet][ref1], vermeldt de aanvrager
      onderscheidenlijk de vergunninghouder:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 4.8.a
    text: zijn naam en adres;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.8
  - number: 4.8.b
    text: de omgevingsvergunning of omgevingsvergunningen krachtens welke de activiteiten worden verricht;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.8
  - number: 4.8.c
    text: de naam, het adres en het telefoonnummer van degene voor wie de omgevingsvergunning zal gaan gelden;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.8
  - number: 4.8.d
    text: een contactpersoon van degene voor wie de omgevingsvergunning zal gaan gelden;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.8
  - number: 4.8.e
    text: het beoogde tijdstip dat de omgevingsvergunning zal gaan gelden voor de onder c bedoelde persoon.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.8
  - number: '4.9'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent het heffen van rechten als bedoeld in
      [artikel 2.9 van de wet][ref1], in gevallen waarin een Onzer ministers bevoegd gezag is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '4.10'
    text: |-
      Als categorieën gevallen als bedoeld in [artikel 2.9a, eerste lid, van de wet][ref1] worden aangewezen de
      activiteiten, bedoeld in [artikel 2.2a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '5.1'
    text: |-
      Voor zover de aanvraag betrekking heeft op het bouwen van een seizoensgebonden bouwwerk, wordt aan de
      omgevingsvergunning in ieder geval het voorschrift verbonden, inhoudende een verplichting het bouwwerk binnen
      daarbij aan te geven tijdvakken onderscheidenlijk op te richten, te gebruiken en te slopen.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.1
  - number: 5.2.1
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de wet][ref1], kunnen, indien dit bij het bestemmingsplan is bepaald, in
      het belang van de archeologische monumentenzorg in ieder geval voorschriften aan de omgevingsvergunning worden
      verbonden, inhoudende een verplichting:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 5.2.1.a
    text: tot het treffen van technische maatregelen waardoor monumenten in de bodem kunnen worden behouden,
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.2
  - number: 5.2.1.b
    text: |-
      tot het verrichten van een opgraving als bedoeld in [artikel 1.1 van de Erfgoedwet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel1
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '1'
  - number: 5.2.1.c
    text: |-
      de activiteit die tot bodemverstoring leidt, te laten begeleiden door een deskundige op het terrein van de
      archeologische monumentenzorg die voldoet aan bij die voorschriften te stellen kwalificaties.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.2
  - number: 5.2.2
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder b of c, van de wet][ref1], kunnen in het belang van de archeologische
      monumentenzorg in ieder geval voorschriften aan de omgevingsvergunning worden verbonden, inhoudende een
      verplichting:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 5.2.2.a
    text: tot het treffen van technische maatregelen waardoor monumenten in de bodem kunnen worden behouden,
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.2
  - number: 5.2.2.b
    text: |-
      tot het verrichten van een opgraving als bedoeld in [artikel 1.1 van de Erfgoedwet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel1
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '1'
  - number: 5.2.2.c
    text: |-
      de activiteit die tot bodemverstoring leidt, te laten begeleiden door een deskundige op het terrein van de
      archeologische monumentenzorg die voldoet aan bij die voorschriften te stellen kwalificaties.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.2
  - number: 5.2.3
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder h, van de wet][ref1], kunnen in het belang van de archeologische monumentenzorg
      voorschriften worden verbonden met betrekking tot de wijze van slopen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 5.3.1
    text: |-
      Deze subparagraaf heeft betrekking op een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 5.3.2
    text: |-
      In deze paragraaf wordt onder bevoegd gezag verstaan: bestuursorgaan dat bevoegd is tot het nemen van een besluit
      ten aanzien van een aanvraag om een omgevingsvergunning of ten aanzien van een al verleende omgevingsvergunning,
      dan wel, in gevallen waarin een vergunning krachtens [artikel 6.2 van de Waterwet][ref1] is aangevraagd,
      bestuursorgaan dat bevoegd is die vergunning te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 5.4.1
    text: |-
      Het bevoegd gezag houdt bij de bepaling van de voor een inrichting of met betrekking tot een lozing in aanmerking
      komende beste beschikbare technieken rekening met BBT-conclusies en bij ministeriële regeling aangewezen
      informatiedocumenten over beste beschikbare technieken.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4.2
    text: |-
      Indien op een activiteit of op een type productieproces binnen de inrichting, waarvoor een vergunning is
      aangevraagd, geen BBT-conclusies of informatiedocumenten als bedoeld in het eerste lid van toepassing zijn, of
      indien de van toepassing zijnde BBT-conclusies of informatiedocumenten niet alle mogelijke milieueffecten van de
      activiteit of het proces behandelen, stelt het bevoegd gezag de beste beschikbare technieken vast.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4.3
    text: 'Bij het vaststellen van de beste beschikbare technieken houdt het bevoegd gezag in ieder geval rekening met:'
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4.3.a
    text: de toepassing van technieken die weinig afvalstoffen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4.3.b
    text: |-
      de toepassing van stoffen die minder gevaarlijk zijn dan stoffen of mengsels als omschreven in artikel 3 van de EG-
      verordening indeling, etikettering en verpakking van stoffen en mengsels;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4.3.c
    text: |-
      de ontwikkeling, waar mogelijk, van technieken voor de terugwinning en het opnieuw gebruiken van de bij de
      processen in de inrichting uitgestoten en gebruikte stoffen en van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4.3.d
    text: vergelijkbare processen, apparaten of wijzen van bedrijfsvoering die met succes in de praktijk zijn beproefd;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4.3.e
    text: de vooruitgang van de techniek en de ontwikkeling van de wetenschappelijke kennis;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4.3.f
    text: de aard, de effecten en de omvang van de betrokken emissies;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4.3.g
    text: de data waarop de installaties in de inrichting in gebruik zijn of worden genomen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4.3.h
    text: de tijd die nodig is om een betere techniek toe te gaan passen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4.3.i
    text: het verbruik en de aard van de grondstoffen, met inbegrip van water, en de energie-efficiëntie;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4.3.j
    text: |-
      de noodzaak om het algemene effect van de emissies op en de risico’s voor het milieu te voorkomen of tot een
      minimum te beperken;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4.3.k
    text: de noodzaak ongevallen te voorkomen en de gevolgen daarvan voor het milieu te beperken.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4.4
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld omtrent de wijze waarop aan dit artikel uitvoering
      wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4
  - number: 5.4a.1
    text: |-
      Voor zover de aanvraag om een omgevingsvergunning betrekking heeft op een stookinstallatie met een nominaal
      elektrisch vermogen van 300 MW of meer, beoordeelt het bevoegd gezag of het afvangen en comprimeren van kooldioxide
      en het transporteren daarvan naar een geschikte opslaglocatie in technisch en economisch opzicht haalbaar is. Bij
      de beoordeling worden de belangen van de bescherming van het milieu en de volksgezondheid in acht genomen.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4a
  - number: 5.4a.2
    text: |-
      Indien het bevoegd gezag van oordeel is dat het afvangen, comprimeren en transporteren van kooldioxide haalbaar
      is, verbindt het aan de vergunning het voorschrift dat binnen de inrichting geschikte ruimte wordt vrijgemaakt of
      vrijgehouden om kooldioxide af te vangen, te comprimeren en te transporteren.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.4a
  - number: 5.5.1
    text: |-
      De voorschriften die aan een omgevingsvergunning worden verbonden, geven de doeleinden aan die de vergunninghouder
      in het belang van de bescherming van het milieu dient te verwezenlijken op een door hem te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
  - number: 5.5.2
    text: |-
      Bij de voorschriften worden emissiegrenswaarden gesteld voor de stoffen, genoemd in bijlage II bij de EU-richtlijn
      industriële emissies, en voor andere stoffen die in aanmerkelijke hoeveelheden uit de inrichting kunnen vrijkomen
      en die direct of door overdracht tussen milieucompartimenten nadelige gevolgen voor het milieu kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
  - number: 5.5.3
    text: |-
      Bij het vaststellen van de emissiegrenswaarden wordt uitgegaan van de emissies op het punt waar zij de bron,
      in voorkomend geval na reiniging, verlaten, tenzij dat redelijkerwijs niet mogelijk is. De emissiegrenswaarden
      worden vastgesteld zonder rekening te houden met een mogelijke voorafgaande verdunning. Bij het vaststellen van
      emissiegrenswaarden voor afvalwater dat in een voorziening voor de inzameling en het transport van afvalwater wordt
      gebracht, kan rekening worden gehouden met het effect van een zuiveringstechnisch werk waarop die voorziening is
      aangesloten, voor zover daarvan geen nadeliger gevolgen voor het milieu zijn te verwachten.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
  - number: 5.5.4
    text: |-
      Aan een omgevingsvergunning kunnen voorschriften worden verbonden, en voor zover die vergunning betrekking heeft op
      een IPPC-installatie worden daaraan in ieder geval voorschriften verbonden, inhoudende dat:
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
  - number: 5.5.4.a
    text: |-
      door monitoring of op een andere wijze wordt bepaald of aan de vergunningvoorschriften, bedoeld in het eerste en
      tweede lid, wordt voldaan, waarbij:
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
  - number: 5.5.4.a.1°
    text: |-
      de wijze van bepaling wordt aangegeven, die ten minste betrekking heeft op de methode en frequentie van de bepaling
      en de procedure voor de beoordeling van de bij die bepaling verkregen gegevens, en die tevens betrekking kan hebben
      op de organisatie van die bepalingen en beoordelingen en op de registratie van die gegevens en de resultaten van
      die beoordeling;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
  - number: 5.5.4.a.2°
    text: |-
      monitoringseisen worden gebaseerd op voor die IPPC-installatie relevante BBT-conclusies en bij ministeriële
      regeling aangewezen informatiedocumenten over beste beschikbare technieken;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
  - number: 5.5.4.b
    text: |-
      de bij die bepaling verkregen gegevens aan het bevoegd gezag regelmatig en ten minste jaarlijks moeten worden
      gemeld of ter inzage gegeven of anderszins ter beschikking moeten worden gesteld van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
  - number: 5.5.5
    text: |-
      In afwijking van het vierde lid, onder b, worden geen voorschriften aan de omgevingsvergunning verbonden met
      betrekking tot het ter beschikking stellen van gegevens als bedoeld in dat onderdeel, voor zover die gegevens
      krachtens [titel 12.3 van de Wet milieubeheer][ref1] moeten worden opgenomen in een PRTR-verslag dat ten behoeve
      van een bestuursorgaan moet worden opgesteld, of daardoor anderszins strijd ontstaat met het gestelde bij of
      krachtens die titel.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 5.5.6
    text: |-
      De ingevolge het tweede of derde lid vastgestelde emissiegrenswaarden waarborgen dat de emissies onder normale
      bedrijfsomstandigheden niet hoger zijn dan de met de beste beschikbare technieken geassocieerde emissieniveaus
      zoals vastgesteld in BBT-conclusies.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
  - number: 5.5.7
    text: |-
      In afwijking van het zesde lid kan het bevoegd gezag in specifieke gevallen minder strenge emissiegrenswaarden
      vaststellen, indien het halen van de met de beste beschikbare technieken geassocieerde emissieniveaus zoals
      vastgesteld in de BBT-conclusies zou leiden tot buitensporig hogere kosten in verhouding tot de milieuvoordelen,
      als gevolg van:
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
  - number: 5.5.7.a
    text: de geografische ligging van de betrokken inrichting,
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
  - number: 5.5.7.b
    text: de lokale milieuomstandigheden, of
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
  - number: 5.5.7.c
    text: de technische kenmerken van de betrokken installatie.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
  - number: 5.5.8
    text: |-
      Voor de toepassing van het zesde en zevende lid wordt onder met de beste beschikbare technieken geassocieerde
      emissieniveaus verstaan: bandbreedte van emissieniveaus verkregen in normale bedrijfsomstandigheden met
      gebruikmaking van een beste beschikbare techniek of een combinatie van beste beschikbare technieken als
      omschreven in de BBT-conclusies, uitgedrukt als een gemiddelde over een bepaalde periode, in specifieke
      referentieomstandigheden.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.5
  - number: 5.6.1
    text: |-
      Het bevoegd gezag verbindt op basis van de aanvraag aan de omgevingsvergunning voorschriften, inhoudende de
      verplichting tot het treffen van technische maatregelen of de naleving van gelijkwaardige parameters. Voor zover
      die voorschriften betrekking hebben op een IPPC-installatie, wordt daarbij niet het gebruik van bepaalde technieken
      of technologieën voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.6
  - number: 5.6.2
    text: |-
      Indien voorschriften als bedoeld in het eerste lid aan de omgevingsvergunning worden verbonden in plaats van
      voorschriften als bedoeld in [artikel 5.5, eerste en tweede lid][ref1], leiden de technische maatregelen of
      gelijkwaardige parameters tot een gelijkwaardige bescherming van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.6.3
    text: |-
      Voor zover aan een omgevingsvergunning voorschriften worden verbonden als bedoeld in het eerste lid, kunnen daaraan
      in ieder geval ook voorschriften worden verbonden, inhoudende dat:
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.6
  - number: 5.6.3.a
    text: |-
      over de uitvoering van technische maatregelen waartoe die voorschriften verplichten, verslag wordt gedaan aan het
      bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.6
  - number: 5.6.3.b
    text: |-
      daarbij aangegeven metingen, berekeningen of tellingen moeten worden verricht ter bepaling van de mate waarin de
      inrichting de nadelige gevolgen voor het milieu veroorzaakt, ter voorkoming of beperking waarvan die voorschriften
      zijn bedoeld.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.6
  - number: 5.6.4
    text: |-
      Voor zover aan een omgevingsvergunning voorschriften worden verbonden als bedoeld in het derde lid, is
      [artikel 5.5, vierde lid, aanhef en onder b][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.7.1
    text: |-
      Aan de omgevingsvergunning worden in ieder geval de in aanmerking komende voorschriften verbonden met betrekking
      tot:
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.1.a
    text: een doelmatig gebruik van energie en grondstoffen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.1.b
    text: |-
      de bescherming van bodem en grondwater, alsmede het regelmatig bijhouden en bewaken van maatregelen die worden
      genomen ter voorkoming van emissies in de bodem en het grondwater, gebaseerd op een systematische evaluatie van het
      risico op nadelige gevolgen voor het milieu;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.1.c
    text: |-
      het voorkomen van het ontstaan van afvalstoffen en afvalwater en, voor zover dat niet mogelijk is, het doelmatig
      beheer alsmede de monitoring van afvalstoffen en afvalwater;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.1.d
    text: |-
      het beperken van de nadelige gevolgen voor het milieu van het verkeer van personen of goederen van en naar de
      inrichting;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.1.e
    text: |-
      het voorkomen dan wel zo veel mogelijk beperken van door de inrichting veroorzaakte grootschalige of
      grensoverschrijdende verontreinigingen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.1.f
    text: |-
      het voorkomen dan wel zo veel mogelijk beperken van de nadelige gevolgen voor het milieu, die kunnen worden
      veroorzaakt door opstarten, lekken, storingen, korte stilleggingen, definitieve bedrijfsbeëindiging of andere
      bijzondere bedrijfsomstandigheden;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.1.g
    text: het voorkomen van ongevallen en het beperken van de gevolgen van ongevallen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.1.h
    text: |-
      het treffen van maatregelen om bij definitieve beëindiging van de inrichting of de IPPC-installatie de nadelige
      gevolgen die de inrichting onderscheidenlijk de IPPC-installatie heeft veroorzaakt voor het terrein waarop zij was
      gevestigd, ongedaan te maken of te beperken voor zover dat nodig is om dat terrein weer geschikt te maken voor een
      volgende functie;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.1.i
    text: |-
      voorwaarden voor het beoordelen van de naleving van de emissiegrenswaarden of een verwijzing naar de elders
      omschreven toepasselijke eisen.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.2
    text: |-
      Aan de omgevingsvergunning kunnen in het belang van de bescherming van het milieu andere voorschriften worden
      verbonden. Die voorschriften kunnen in ieder geval inhouden:
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.2.a
    text: |-
      dat daarbij aangegeven metingen, berekeningen of tellingen – andere dan bedoeld in de [artikelen 5.5][ref1] en
      [5.6][ref2] – moeten worden verricht ter bepaling van de mate waarin de inrichting nadelige gevolgen voor het
      milieu veroorzaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel5
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.7.2.b
    text: |-
      dat in een mate als bij het voorschrift aangegeven, onderzoek moet worden verricht naar mogelijkheden tot
      verdergaande bescherming van het milieu dan waarin de andere aan de omgevingsvergunning verbonden voorschriften
      voorzien;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.2.c
    text: |-
      dat de uitkomsten van daarbij aangegeven metingen, berekeningen, tellingen of onderzoeken moeten worden
      geregistreerd en bewaard dan wel moeten worden gemeld of ter beschikking gesteld van bij het voorschrift aangewezen
      bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.2.d
    text: |-
      dat moet worden voldaan aan daarbij aangegeven eisen ten aanzien van de vakbekwaamheid van in de inrichting
      werkzame personen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.2.e
    text: |-
      dat aan de in de inrichting werkzame personen schriftelijk instructies worden gegeven om handelen
      in strijd met de omgevingsvergunning, de daaraan verbonden voorschriften of bij of krachtens
      [artikel 8.40 van de Wet milieubeheer][ref1] gestelde regels tegen te gaan, en dat toezicht wordt gehouden op het
      naleven van die instructies;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 5.7.2.f
    text: |-
      dat met betrekking tot in het voorschrift geregelde, daarbij aangegeven onderwerpen moet worden voldaan aan nadere
      eisen die door een bij het voorschrift aangewezen bestuursorgaan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.2.g
    text: |-
      dat van daarbij aangegeven veranderingen van de inrichting of van de werking daarvan, binnen een in het voorschrift
      te bepalen termijn schriftelijk mededeling wordt gedaan aan het bevoegd gezag of een door hem aangewezen instantie;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.2.h
    text: |-
      dat met het oog op het kunnen voldoen aan de andere aan de omgevingsvergunning verbonden voorschriften voor de
      betrokken activiteiten omtrent de inrichting, daarbij aangegeven organisatorische en administratieve maatregelen
      moeten worden getroffen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.2.i
    text: |-
      dat met betrekking tot een bij het voorschrift aangegeven onderwerp waarover geen andere voorschriften aan de
      omgevingsvergunning zijn verbonden, voldoende zorg in acht moet worden genomen.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.3
    text: |-
      Indien vanuit een inrichting of mijnbouwwerk afvalwater of andere afvalstoffen in een voorziening voor de
      inzameling en het transport van afvalwater worden gebracht, kunnen aan de omgevingsvergunning in het belang van de
      bescherming van het milieu voorschriften worden verbonden omtrent:
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.3.a
    text: de doelmatige werking van het zuiveringstechnisch werk, of
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.3.b
    text: |-
      de krachtens [hoofdstuk 5 van de Wet milieubeheer][ref1] gestelde grenswaarden voor de kwaliteit van het
      oppervlaktewater.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '5'
  - number: 5.7.4
    text: |-
      In afwijking van het tweede lid, onder c, worden geen voorschriften aan de omgevingsvergunning verbonden met
      betrekking tot het melden of ter beschikking stellen van uitkomsten als bedoeld in dat onderdeel, indien die
      uitkomsten als gegevens krachtens [titel 12.3 van de Wet milieubeheer][ref1] moeten worden opgenomen in een PRTR-
      verslag dat ten behoeve van een bestuursorgaan moet worden opgesteld, of daardoor anderszins strijd ontstaat met
      het gestelde bij of krachtens die titel.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 5.7.5
    text: |-
      Bij een voorschrift inzake nadere eisen als bedoeld in het tweede lid, onder f, kan worden aangegeven hoe van die
      eisen door het aangewezen bestuursorgaan openbaar wordt kennisgegeven.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.7.6
    text: |-
      Indien maatregelen als bedoeld in het eerste lid, onderdeel h, zijn getroffen, stelt het bevoegd gezag voor het
      publiek relevante informatie over die maatregelen voor eenieder elektronisch beschikbaar.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.7
  - number: 5.8.1
    text: |-
      Indien een omgevingsvergunning betrekking heeft op een inrichting waarin afvalstoffen nuttig worden toegepast of
      worden verwijderd, bevat de omgevingsvergunning ten minste de verplichtingen:
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.8
  - number: 5.8.1.a
    text: 'tot het registreren van:'
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.8
  - number: 5.8.1.a.1°
    text: |-
      daarbij aangewezen afvalstoffen die in de inrichting nuttig worden toegepast of worden verwijderd: naar
      hoeveelheid, aard en oorsprong;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.8
  - number: 5.8.1.a.2°
    text: |-
      stoffen die bij de nuttige toepassing of verwijdering van die afvalstoffen worden gebruikt of verbruikt: naar aard
      en hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.8
  - number: 5.8.1.a.3°
    text: |-
      stoffen, preparaten en andere producten, hieronder mede begrepen afvalstoffen, die bij de nuttige toepassing of
      verwijdering ontstaan: naar aard en hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.8
  - number: 5.8.1.a.4°
    text: de wijze waarop de onder 3° bedoelde afvalstoffen nuttig worden toegepast of worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.8
  - number: 5.8.1.a.5°
    text: |-
      stoffen, preparaten en andere producten die de inrichting verlaten, voor zover deze bij de nuttige toepassing of
      verwijdering zijn ontstaan: naar aard en hoeveelheid, en
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.8
  - number: 5.8.1.b
    text: tot het bewaren van de geregistreerde gegevens gedurende ten minste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.8
  - number: 5.8.2
    text: Onze Minister kan regels stellen omtrent de wijze waarop de registratie plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.8
  - number: 5.9.1
    text: |-
      In een omgevingsvergunning kan worden bepaald dat daarbij aangewezen voorschriften niet gelden gedurende een
      termijn van ten hoogste negen maanden voor het testen of gebruiken van technieken in opkomst.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.9
  - number: 5.9.2
    text: |-
      Onder techniek in opkomst wordt verstaan: nieuwe techniek die, als zij commercieel zou worden ontwikkeld, hetzij
      een hoger algemeen beschermingsniveau voor het milieu, hetzij ten minste hetzelfde beschermingsniveau voor het
      milieu, en grotere kostenbesparingen kan opleveren dan de voor de desbetreffende activiteit bestaande beste
      beschikbare technieken.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.9
  - number: 5.10.1
    text: |-
      Binnen vier jaar na de publicatie in het Publicatieblad van de Europese Unie van, voor de hoofdactiviteit van de
      betreffende IPPC-installatie, relevante BBT-conclusies:
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.10
  - number: 5.10.1.a
    text: |-
      toetst het bevoegd gezag of de vergunningvoorschriften voldoen aan deze nieuwe BBT-conclusies, aan overige
      relevante BBT-conclusies en aan bij ministeriële regeling aangewezen informatiedocumenten over beste beschikbare
      technieken, die sinds het verlenen van de vergunning of de laatste toetsing zijn vastgesteld of herzien,
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.10
  - number: 5.10.1.b
    text: actualiseert het bevoegd gezag, indien noodzakelijk, de vergunningvoorschriften, en
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.10
  - number: 5.10.1.c
    text: |-
      controleert het bevoegd gezag dat de inrichting na actualisatie van de vergunningvoorschriften aan die
      voorschriften voldoet.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.10
  - number: 5.10.2
    text: |-
      Het bevoegd gezag geeft voorts in ieder geval toepassing aan het bepaalde in [artikel 2.30, eerste lid][ref1], en
      [artikel 2.31, eerste lid, aanhef en onder b, van de wet][ref2] indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 5.10.2.a
    text: |-
      de door de inrichting of onderdelen daarvan veroorzaakte verontreiniging van dien aard is dat de
      emissiegrenswaarden die zijn vastgesteld in de aan de vergunning verbonden voorschriften, gewijzigd moeten worden
      of daarin nieuwe emissiegrenswaarden vastgesteld moeten worden;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.10
  - number: 5.10.2.b
    text: |-
      geen BBT-conclusies van toepassing zijn, maar belangrijke veranderingen in de beste beschikbare technieken een
      aanmerkelijke beperking van de emissies mogelijk maken;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.10
  - number: 5.10.2.c
    text: |-
      de noodzaak om ongevallen te voorkomen en de gevolgen daarvan voor het milieu te beperken de toepassing van andere
      technieken vereist;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.10
  - number: 5.10.2.d
    text: |-
      aan een nieuwe of herziene grenswaarde als bedoeld in [artikel 2.14, eerste lid, onder c, sub 2°, van de wet][ref1]
      moet worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '5.11'
    text: |-
      Als categorie inrichtingen als bedoeld in [artikel 2.14, tweede lid, van de wet][ref1], worden aangewezen de
      inrichtingen waarop het [Besluit risico’s zware ongevallen 2015][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0036791
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0036791
  - number: 5.12.1
    text: |-
      Aan een omgevingsvergunning voor een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e, van de wet][ref1],
      worden, indien het een inrichting betreft waarop tevens de in [artikel 16.5 van de Wet milieubeheer][ref2] vervatte
      verboden betrekking hebben, geen voorschriften verbonden:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
  - number: 5.12.1.a
    text: |-
      inhoudende een emissiegrenswaarde voor de directe emissie van broeikasgassen, tenzij zulks noodzakelijk is om te
      verzekeren dat geen significante gevolgen voor het milieu in de onmiddellijke omgeving van de inrichting worden
      veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.12
  - number: 5.12.1.b
    text: ter bevordering van een zuinig gebruik van energie in de inrichting.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.12
  - number: 5.12.2
    text: |-
      Voor zover aan een omgevingsvergunning die betrekking heeft op een inrichting als bedoeld in het eerste lid
      voorschriften zijn verbonden als in dat lid bedoeld, vervallen die voorschriften.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.12
  - number: 5.12a.1
    text: |-
      Aan een omgevingsvergunning voor een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e, van de wet][ref1],
      worden, indien het een inrichting betreft als bedoeld in [artikel 15.51 van de Wet milieubeheer][ref2], geen
      voorschriften verbonden:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.12a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
  - number: 5.12a.1.a
    text: |-
      inhoudende een emissiegrenswaarde voor de directe emissie van CO, tenzij zulks noodzakelijk is om te verzekeren dat
      geen significante gevolgen voor het milieu in de onmiddellijke omgeving van de inrichting worden veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.12a
  - number: 5.12a.1.b
    text: ter bevordering van een zuinig gebruik van energie in de inrichting.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.12a
  - number: 5.12a.2
    text: |-
      Voor zover aan een omgevingsvergunning die betrekking heeft op een inrichting als bedoeld in het eerste lid
      voorschriften zijn verbonden als in dat lid bedoeld, vervallen die voorschriften.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.12a
  - number: '5.13'
    text: |-
      Aan een omgevingsvergunning voor een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e, van de wet][ref1],
      worden geen voorschriften verbonden, die het naar of uit de provincie brengen van afvalstoffen beperken of
      uitsluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 5.13a
    text: |-
      Aan een omgevingsvergunning voor een activiteit die is aangewezen in [artikel 2.2a][ref1] worden geen voorschriften
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13a
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.13b.1
    text: |-
      Een omgevingsvergunning voor de categorieën activiteiten, bedoeld in
      [artikel 2.2a, eerste lid, onder a tot en met i][ref1], wordt geweigerd indien het bevoegd gezag op grond van
      [artikel 7.17, eerste lid, van de Wet milieubeheer][ref2], heeft beslist dat een milieueffectrapport moet worden
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13b
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
  - number: 5.13b.2
    text: |-
      Een omgevingsvergunning voor de categorieën activiteiten, bedoeld in
      [artikel 2.2a, tweede lid, onderdelen a tot en met h][ref1], kan worden geweigerd in het belang van het doelmatig
      beheer van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13b
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.13b.3
    text: |-
      Een omgevingsvergunning voor de categorie activiteiten, bedoeld in [artikel 2.2a, derde lid][ref1],
      wordt geweigerd indien de activiteit niet voldoet aan de grenswaarden voor geluid, bedoeld in
      [artikel 2.14, eerste lid, onder c, onder 2° en 3°, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13b
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 5.13b.4
    text: |-
      Een omgevingsvergunning voor de categorieën activiteiten, bedoeld in
      [artikel 2.2a, eerste lid, onder b, en tweede lid, onder c tot en met f][ref1],
      kan worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2], met dien
      verstande dat voor de toepassing van artikel 3 van die wet, voor zover het de wet betreft, onder betrokkene
      mede wordt verstaan degene die op grond van feiten en omstandigheden redelijkerwijs met de aanvrager van de
      omgevingsvergunning gelijk kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13b
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 5.13b.5
    text: |-
      Voordat toepassing wordt gegeven aan het vierde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13b
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 5.13b.6
    text: |-
      Een omgevingsvergunning voor de categorieën activiteiten, bedoeld in [artikel 2.2a, vierde lid, onder a][ref1],
      wordt geweigerd, indien de activiteit leidt tot overschrijding van de grenswaardenvoor zwevende deeltjes (PM10),
      bedoeld in [bijlage 2, voorschrift 4.1, van de Wet milieubeheer][ref2], voor zover de verplichting tot het in acht
      nemen daarvan is vastgelegd bij of krachtens [artikel 5.16 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.13b
    references:
