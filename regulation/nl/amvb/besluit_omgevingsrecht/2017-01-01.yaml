        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 5.22.1
    text: |-
      Aan een omgevingsvergunning voor een activiteit als bedoeld in [artikel 2.2aa, onderdeel a][ref1],
      wordt, ingeval toepassing wordt gegeven aan [artikel 5.21, eerste lid][ref2] in samenhang met
      [artikel 2.8, vierde lid, van de Wet natuurbescherming][ref3], het voorschrift verbonden dat compenserende
      maatregelen als bedoeld in artikel 2.8, vierde lid, onder c, van die wet worden getroffen. Behoudens gevallen
      waarin [artikel 6.10a, tweede lid][ref4], van toepassing is, melden gedeputeerde staten de compenserende
      maatregelen aan Onze Minister van Economische Zaken, die de Europese Commissie van de maatregelen op de hoogte
      stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0027464#Artikel6
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.22
    references:
