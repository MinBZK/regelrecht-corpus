        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0003245
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '5'
  - number: 5.13b.7
    text: |-
      Een omgevingsvergunning voor de categorieën activiteiten, bedoeld in [artikel 2.2a, vierde lid, onder b][ref1],
      wordt geweigerd, indien de activiteit leidt tot overschrijding van de grenswaarden, bedoeld in
      [bijlage 2 van de Wet milieubeheer][ref2], voor zover de verplichting tot het in acht nemen daarvan is vastgelegd
      bij of krachtens [artikel 5.16 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel5
