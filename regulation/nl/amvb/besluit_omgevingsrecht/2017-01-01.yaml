    text: |-
      In afwijking van [artikel 2.1, eerste lid, aanhef en onder e, onder 2°, van de wet][ref1] is geen
      omgevingsvergunning vereist met betrekking tot veranderingen van de inrichting of van de werking daarvan die in
      overeenstemming zijn met de voor de inrichting verleende vergunning en de daaraan verbonden voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.4.2
    text: |-
