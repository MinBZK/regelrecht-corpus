  - number: 6.15.1.c
    text: de burgemeester van de gemeente waar de inrichting geheel of gedeeltelijk zal zijn of is gelegen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.15
  - number: 6.15.1.d
    text: het bestuur van de veiligheidsregio binnen wier gebied de inrichting geheel of gedeeltelijk zal zijn of is gelegen;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.15
  - number: 6.15.1.e
    text: |-
      voor zover de onderdelen van het veiligheidsrapport betrekking hebben op de risico’s voor een
      oppervlaktewaterlichaam: het bestuursorgaan dat bevoegd is tot het verlenen van de vergunning krachtens
      [artikel 6.2 van de Waterwet][ref1], behoudens in een geval als bedoeld in [artikel 3.16 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.15
