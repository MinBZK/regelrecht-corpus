  - number: 5.23.3
    text: |-
      Het bevoegd gezag kan voorschriften van de omgevingsvergunning die betrekking hebben op een activiteit
      als bedoeld in [artikel 2.2aa, onderdeel b][ref1], wijzigen op de gronden die zijn aangegeven in
      [artikel 5.4, eerste, onderdelen c en d, van de Wet natuurbescherming][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel5
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '5'
  - number: 5.24.1
    text: |-
      Het bevoegd gezag trekt een omgevingsvergunning voor zover die betrekking heeft op een activiteit als
      bedoeld in [artikel 2.2aa, onderdeel a][ref1], geheel of gedeeltelijk in op de grond die is aangegeven in
      [artikel 5.4, tweede lid, van de Wet natuurbescherming][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel5
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.24
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '5'
  - number: 5.24.2
    text: |-
      Het bevoegd gezag kan een omgevingsvergunning voor zover die betrekking heeft op een activiteit als bedoeld
      in [artikel 2.2aa, onderdeel a][ref1], geheel of gedeeltelijk intrekken op de gronden die zijn aangegeven in
      [artikel 5.4, eerste lid, onderdelen c en d, van de Wet natuurbescherming][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel5
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.24
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '5'
  - number: 5.24.3
    text: |-
      Het bevoegd gezag kan een omgevingsvergunning voor zover die betrekking heeft op een activiteit als bedoeld
      in [artikel 2.2aa, onderdeel b][ref1], geheel of gedeeltelijk intrekken op de gronden die zijn aangegeven in
      [artikel 5.4, eerste lid, onderdelen c en d, van de Wet natuurbescherming][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel5
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5.24
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '5'
  - number: 5a.1
    text: |-
      Als categorie als bedoeld in [artikel 3.10, eerste lid, onderdeel f, van de wet][ref1] worden aangewezen gevallen
      als bedoeld in [artikel 6.10a, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel6
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.1.1
    text: |-
      Met betrekking tot een aanvraag worden als adviseur aangewezen burgemeester en wethouders van de gemeente waar het
      project geheel of gedeeltelijk zal worden of wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.1
  - number: 6.1.2
    text: |-
      Met betrekking tot een aanvraag ten aanzien van een activiteit als bedoeld in
      [artikel 1.3a, eerste lid, van de Wet milieubeheer][ref1] worden als adviseur aangewezen gedeputeerde staten van
      de provincie waar het project geheel of gedeeltelijk zal worden of wordt uitgevoerd, alsmede de bestuursorganen
      en instanties die ingevolge de provinciale milieuverordening zijn aangewezen om advies uit te brengen omtrent een
      ontheffing voor die activiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 6.2.1
    text: |-
      Met betrekking tot een aanvraag ten aanzien van activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de wet][ref1] vragen burgemeester en wethouders, ingeval zij het
      inwinnen van advies noodzakelijk achten om te kunnen beoordelen of het uiterlijk of de plaatsing van het
      bouwwerk waarop de aanvraag betrekking heeft in strijd is met redelijke eisen van welstand als bedoeld
      in [artikel 2.10, eerste lid, onder d, van de wet][ref2], advies aan de welstandscommissie dan wel de
      stadsbouwmeester.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6.2.2
    text: |-
      In gevallen waarin burgemeester en wethouders niet het bevoegd gezag zijn, betrekken zij, indien zij toepassing
      hebben gegeven aan het eerste lid, het advies van de welstandscommissie dan wel de stadsbouwmeester bij het advies
      dat zij ingevolge [artikel 2.26, derde of vierde lid, van de wet][ref1] uitbrengen aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6.3.1
    text: |-
      Met betrekking tot een aanvraag ten aanzien van activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de wet][ref1], in gevallen waarin burgemeester en wethouders het bevoegd
      gezag zijn, worden als adviseur aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6.3.1.a
    text: |-
      het bestuur van de veiligheidsregio binnen wiens gebied de betrokken inrichting geheel of in hoofdzaak zal zijn of
      is gelegen, indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie die is genoemd in
      [bijlage I][ref1], onderdeel C, onder 3.1 of 17;


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 6.3.1.b
    text: |-
      gedeputeerde staten van de provincie, waarin de inrichting geheel of in hoofdzaak zal zijn of is gelegen, indien
      de inrichting of een onderdeel daarvan is gelegen in een gebied, waarvoor bij provinciale milieuverordening regels
      zijn gesteld ter bescherming van de kwaliteit van het grondwater met het oog op de waterwinning;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.3
  - number: 6.3.1.c
    text: |-
      gedeputeerde staten van de provincie waarin de betrokken inrichting geheel of in hoofdzaak zal
      zijn of is gelegen, indien de inrichting is gelegen op een industrieterrein waaromheen ingevolge
      [hoofdstuk V van de Wet geluidhinder][ref1] een zone is vastgesteld en waarvan is bepaald dat het van regionaal
      belang als bedoeld in [artikel 163, tweede lid, van de Wet geluidhinder][ref2] is.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel163
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '163'
  - number: 6.3.2
    text: |-
      Met betrekking tot het ontwerp van een beschikking op een aanvraag ten aanzien van activiteiten als bedoeld
      in [artikel 2.1, eerste lid, onder e, van de wet][ref1] wordt de inspecteur als adviseur aangewezen, indien
      de aanvraag betrekking heeft op een inrichting die behoort tot een van de in [bijlage III][ref2] aangewezen
      categorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027464
  - number: 6.3.3
    text: |-
      Met betrekking tot een aanvraag ten aanzien van activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de wet][ref1], in gevallen waarin gedeputeerde staten het bevoegd gezag
      zijn, wordt als adviseur aangewezen het bestuur van de veiligheidsregio binnen wiens gebied de betrokken inrichting
      geheel of in hoofdzaak zal zijn of is gelegen, indien de aanvraag betrekking heeft op een inrichting die behoort
      tot een categorie die is genoemd in [bijlage I][ref2], onderdeel C, onder 3.5.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027464
  - number: 6.3.4
    text: |-
      Met betrekking tot een aanvraag ten aanzien van activiteiten als bedoeld in [artikel 3.3, vierde lid][ref1], wordt
      als adviseur aangewezen de inspecteur-generaal der mijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '3'
        hoofdstuk: '3'
  - number: 6.4.1
    text: |-
      Met betrekking tot een aanvraag ten aanzien van een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder f, van de wet][ref1], worden als adviseurs aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6.4.1.a
    text: 'Onze Minister van Onderwijs, Cultuur en Wetenschap, indien de activiteit betrekking heeft op:'
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.4
  - number: 6.4.1.a.1°
    text: het slopen van een rijksmonument of een deel daarvan voor zover van ingrijpende aard,
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.4
  - number: 6.4.1.a.2°
    text: |-
      het ingrijpend wijzigen van een rijksmonument of een belangrijk deel daarvan, voor zover de gevolgen voor de waarde
      van het rijksmonument vergelijkbaar zijn met de gevolgen van het geval, bedoeld onder 1°,
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.4
  - number: 6.4.1.a.3°
    text: |-
      het reconstrueren van een rijksmonument of een belangrijk deel daarvan, waarbij de staat van het monument wordt
      teruggebracht naar een eerdere staat of een veronderstelde eerdere staat van dat monument, of
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.4
  - number: 6.4.1.a.4°
    text: het geven van een nieuwe bestemming aan een rijksmonument of een belangrijk deel daarvan;
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.4
  - number: 6.4.1.b
    text: |-
      gedeputeerde staten, indien het rijksmonument buiten de krachtens de [Wegenverkeerswet 1994][ref1] vastgestelde
      bebouwde kom ligt en het een activiteit betreft als bedoeld in onderdeel a, onder 1° tot en met 4°.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 6.4.2
    text: |-
      Indien de adviseurs, bedoeld in het eerste lid, advies uitbrengen, geschiedt dit schriftelijk binnen acht weken
      nadat het bevoegd gezag de gegevens, bedoeld in [artikel 3:7 van de Algemene wet bestuursrecht][ref1], ter
      beschikking heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 6.4.3
    text: |-
      Met betrekking tot een aanvraag ten aanzien van een activiteit als bedoeld in
      [artikel 2.2, eerste lid, onder b, van de wet][ref1], worden gedeputeerde staten als adviseur aangewezen, indien
      het een monument betreft dat krachtens een provinciale verordening is aangewezen dan wel een monument waarop,
      voordat het is aangewezen, een zodanige verordening van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6.5.1
    text: |-
      Voor zover een aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder c, van de wet][ref1], wordt de omgevingsvergunning, waarbij met toepassing
      van [artikel 2.12, eerste lid, onder a, onder 3°, van de wet][ref2] wordt afgeweken van het bestemmingsplan
      of de beheersverordening, niet verleend dan nadat de gemeenteraad van de gemeente waar het project geheel of
      in hoofdzaak zal worden of wordt uitgevoerd, heeft verklaard dat hij daartegen geen bedenkingen heeft, tenzij
      [artikel 3.2, aanhef en onder b][ref3], van dit besluit of [artikel 3.36 van de Wet ruimtelijke ordening][ref4] van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0027464#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0027464
        artikel: '3'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 6.5.2
    text: De verklaring kan slechts worden geweigerd in het belang van een goede ruimtelijke ordening.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.5
  - number: 6.5.3
    text: De gemeenteraad kan categorieën gevallen aanwijzen waarin een verklaring niet is vereist.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.5
  - number: 6.5.4
    text: |-
      In gevallen waarin [artikel 3.1, aanhef en onder b][ref1], van dit besluit of
      [artikel 3.34 van de Wet ruimtelijke ordening][ref2] van toepassing is, wordt in het eerste lid in plaats van
      «gemeenteraad van de gemeente» gelezen «provinciale staten van de provincie» en wordt in het derde lid in plaats
      van «De gemeenteraad kan» gelezen: De provinciale staten kunnen.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 6.6.1
    text: |-
      Voor zover een aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder c, van de wet][ref1], wordt de omgevingsvergunning, waarbij met toepassing
      van [artikel 2.12, eerste lid, onder c, van de wet][ref2] wordt afgeweken van regels gesteld krachtens
      [artikel 4.1, derde lid][ref3], of [4.3, derde lid, van de Wet ruimtelijke ordening][ref4], niet verleend dan nadat
      gedeputeerde staten hebben verklaard dat zij daartegen geen bedenkingen hebben, onderscheidenlijk Onze Minister
      of Onze Minister wie het aangaat in overeenstemming met Onze Minister, heeft verklaard dat hij daartegen geen
      bedenkingen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '4'
  - number: 6.6.2
    text: |-
      De verklaring kan slechts worden verleend indien de betrokken activiteiten niet in strijd komen met de regels
      inzake afwijking die zijn opgenomen in de betrokken provinciale verordening of algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.6
  - number: 6.8.1
    text: |-
      Voor zover een aanvraag als bedoeld in [artikel 3.3, vierde lid, onder a][ref1], waarvoor Onze Minister van
      Economische Zaken bevoegd is te beslissen, betrekking heeft op het ondergronds opslaan van afvalstoffen die van
      buiten het betrokken mijnbouwwerk afkomstig zijn, dan wel gevaarlijke stoffen, wordt de omgevingsvergunning niet
      verleend dan nadat gedeputeerde staten van de provincie waar het project geheel of in hoofdzaak zal worden of wordt
      uitgevoerd, hebben verklaard dat zij daartegen geen bedenkingen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '3'
        hoofdstuk: '3'
  - number: 6.8.2
    text: De verklaring kan slechts worden geweigerd in het belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.8
  - number: 6.9.1
    text: |-
      Voor zover een aanvraag betrekking heeft op een inrichting die tevens een mijnbouwwerk is en waarop
      [artikel 3.3, vierde lid, onder a][ref1], niet van toepassing is, wordt de omgevingsvergunning niet verleend dan
      nadat Onze Minister van Economische Zaken heeft verklaard dat hij daartegen, voor zover het de mijnbouwactiviteiten
      betreft, geen bedenkingen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '3'
        hoofdstuk: '3'
  - number: 6.9.2
    text: De verklaring kan slechts worden geweigerd in het belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.9
  - number: 6.9.3
    text: |-
      In gevallen als bedoeld in het eerste lid heeft Onze Minister van Economische Zaken mede tot taak zorg te dragen
      voor de bestuursrechtelijke handhaving, bedoeld in [artikel 5.2, eerste lid, onder a, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
  - number: '6.10'
    text: |-
      De [artikelen 6.8][ref1] en [6.9][ref2] zijn niet van toepassing in gevallen als bedoeld in
      [3.10, derde lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '3'
  - number: 6.10a.1
    text: |-
      Voor zover een aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.2aa, onderdeel a of b][ref1],
      wordt de omgevingsvergunning niet verleend dan nadat gedeputeerde staten als bedoeld in
      [artikel 1.3, eerste lid, van de Wet natuurbescherming][ref2] hebben verklaard dat zij daartegen geen bedenkingen
      hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.10a
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '1'
  - number: 6.10a.2
    text: |-
      Indien de activiteit betrekking heeft op een project of handeling behorend tot een in [artikel 1.3, eerste lid,
      van het Besluit natuurbescherming](onbekend) aangewezen categorie van projecten en handelingen, wordt in het eerste
      lid in plaats van «gedeputeerde staten als bedoeld in [artikel 1.3, eerste lid, van de Wet natuurbescherming][ref1]
      hebben verklaard dat zij daartegen geen bedenkingen hebben» gelezen «Onze Minister van Economische Zaken heeft
      verklaard dat hij daartegen geen bedenkingen heeft».


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.10a
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
  - number: 6.10a.3
    text: |-
      Het eerste lid, al dan niet in samenhang met het tweede lid, is niet van toepassing indien gedeputeerde staten als
      bedoeld in het eerste lid tevens het bevoegd gezag zijn, onderscheidenlijk indien Onze Minister van Economische
      Zaken tevens het bevoegd gezag is, om te beslissen op de desbetreffende aanvraag om een omgevingsvergunning.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.10a
  - number: 6.10a.4
    text: 'Een verklaring kan slechts worden gegeven:'
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.10a
  - number: 6.10a.4.a
    text: |-
      voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.aa, onderdeel a][ref1]: op de
      gronden, die zijn aangegeven in [artikel 2.8][ref2] en [artikel 5.5, derde lid, van de Wet natuurbescherming][ref3],
      het bepaalde krachtens [artikel 2.9, zevende lid, van die wet][ref4] en de [artikelen 2.13](onbekend) en [2.14 van
      het Besluit natuurbescherming](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.10a
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '2'
  - number: 6.10a.4.b
    text: |-
      voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.2aa, onderdeel b][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.10a
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 6.10a.4.b.1°
    text: |-
      voor zover het betreft een handeling als bedoeld in [artikel 3.1 van de Wet natuurbescherming][ref1]: op de
      gronden, aangegeven in [artikel 3.3, vierde lid, van de Wet natuurbescherming][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.10a
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 6.10a.4.b.2°
    text: |-
      voor zover het betreft een handeling als bedoeld in [artikel 3.5 van de Wet natuurbescherming][ref1]: op de
      gronden, aangegeven in [artikel 3.8, vijfde lid, van de Wet natuurbescherming][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.10a
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 6.10a.4.b.3°
    text: |-
      voor zover het betreft een handeling als bedoeld in [artikel 3.10, eerste lid, van de Wet natuurbescherming][ref1]:
      op de gronden, aangegeven in [artikel 3.8, vijfde lid][ref2], of
      [3.10, tweede lid, van de Wet natuurbescherming][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel6.10a
    references:
      - id: ref1
