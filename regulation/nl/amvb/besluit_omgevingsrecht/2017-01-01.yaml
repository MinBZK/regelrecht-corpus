articles:
  - number: 1.1.1
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *aanvraag:* aanvraag om een
      omgevingsvergunning;
        - *adviseur:* bij of krachtens [artikel 2.26 van de wet][ref1] aangewezen bestuursorgaan of andere instantie;
        - *BBT-conclusies:* document met de conclusies over beste beschikbare technieken, vastgesteld overeenkomstig
      artikel 13, vijfde lid en zevende lid, van de EU-richtlijn industriële emissies;
        - *bijlage:* bij dit besluit behorende [bijlage][ref2];
        - *de betrokken wetten:* de [wet][ref3], de in [artikel 5.1 van de wet][ref4] genoemde wetten voor zover in die
      wetten de [artikelen 5.3 tot en met 5.9 van de wet][ref5] van toepassing zijn verklaard, alsmede de EG-verordening
      overbrenging van afvalstoffen, de EG-verordening registratie, evaluatie en autorisatie van chemische stoffen en de
      EG-verordening PRTR;
        - *EU-richtlijn industriële emissies:* Richtlijn 2010/75/EU van het Europees Parlement en de Raad van 24 november
      2010 inzake industriële emissies (geïntegreerde preventie en bestrijding van verontreiniging) (herschikking) (PbEU
      L 334);
        - *gesloten bodemenergiesysteem:* installatie waarmee, zonder grondwater te onttrekken en na gebruik in de bodem
      terug te brengen, gebruik wordt gemaakt van de bodem voor de levering van warmte of koude ten behoeve van de
      verwarming of koeling van ruimten in bouwwerken, door middel van een gesloten circuit van leidingen, met inbegrip
      van een bijbehorende warmtepomp circulatiepomp en regeneratievoorziening, voor zover aanwezig;
        - *landelijke voorziening:* landelijke voorziening, bedoeld in [artikel 7.6, eerste lid, van de wet][ref6];
        - *open bodemenergiesysteem:* installatie waarmee van de bodem gebruik wordt gemaakt voor de levering van warmte
      of koude ten behoeve van de verwarming of koeling van ruimten in bouwwerken, door grondwater te onttrekken en na
      gebruik in de bodem terug te brengen, met inbegrip van bijbehorende bronpompen en warmtewisselaar en, voor zover
      aanwezig, warmtepomp en regeneratievoorziening;
        - *Seveso III-richtlijn:* Richtlijn 2012/18/EU van het Europees Parlement en de Raad van 4 juli 2012 betreffende
      de beheersing van de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken, houdende wijziging en
      vervolgens intrekking van Richtlijn 96/82/EG van de Raad (PbEU 2012, L 197);
        - *wet:* [Wet algemene bepalingen omgevingsrecht][ref7].


