        artikel: '5'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0027464
  - number: '2.9'
    text: |-
      Bij de vaststelling of het bouwen van een bijbehorend bouwwerk als bedoeld in artikel 1, eerste lid,
      van [bijlage II][ref1] in achtererfgebied als bedoeld in dat artikellid al dan niet in strijd is met het
      bestemmingsplan of de beheersverordening, worden reeds aanwezige bijbehorende bouwwerken in het bebouwingsgebied,
      bedoeld in dat artikellid, in mindering gebracht op het door het bestemmingsplan of de beheersverordening
      toegestane maximum van die bouwwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0027464
