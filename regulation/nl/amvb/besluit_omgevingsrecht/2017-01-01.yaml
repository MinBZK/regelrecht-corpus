    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel2.6
  - number: '2.7'
    text: |-
      Als categorieën gevallen als bedoeld in [artikel 2.12, eerste lid, onder a, onder 2°, van de wet][ref1] worden
      aangewezen de categorieën gevallen in artikel 4 van [bijlage II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027464
  - number: '2.8'
    text: |-
      Als categorieën gevallen als bedoeld in [artikel 5.16, tweede lid, onder g, van de Wet milieubeheer][ref1]
      waarbij bij het verlenen van een omgevingsvergunning met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2°, van de wet][ref2] een beoordeling van de gevolgen voor de
      luchtkwaliteit als bedoeld in artikel 5.16, eerste lid, van de Wet milieubeheer is vereist, worden aangewezen de
      categorieën gevallen, bedoeld in artikel 4, onderdelen 9 en 11, van [bijlage II][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel2.8
    references:
