  - number: 1.1.2
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt, behoudens voor zover daarin gesproken wordt van
      strafrechtelijke handhaving, onder «handhaving» verstaan bestuursrechtelijke handhaving van het bij of krachtens de
      betrokken wetten bepaalde.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel1.1
  - number: 1.1.3
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder onderscheidenlijk afvalstoffen, afvalwater,
      doelmatig beheer van afvalstoffen, EG-verordening overbrenging van afvalstoffen, EG-verordening PRTR, EG-
      verordening registratie, evaluatie en autorisatie van chemische stoffen, emissie, emissiegrenswaarde, hergebruik,
      inspecteur, kaderrichtlijn water, nuttige toepassing, preparaten, recycling, stoffen en verwijdering, hetgeen
      daaronder wordt verstaan in [artikel 1.1 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel1.1
