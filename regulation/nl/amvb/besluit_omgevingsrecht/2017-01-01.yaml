  - number: 2.2b.1
    text: |-
      Ter voorkoming van interferentie tussen gesloten of open bodemenergiesystemen onderling of anderszins ter
      bevordering van een doelmatig gebruik van bodemenergie, kan bij gemeentelijke verordening een interferentiegebied
      als bedoeld in [artikel 2.2a, zesde lid][ref1], worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel2.2b
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.2b.2
    text: |-
      In afwijking van het eerste lid kan een interferentiegebied bij provinciale verordening worden aangewezen indien
      zulks bijzonder aangewezen is uit een oogpunt van provinciaal beleid met betrekking tot doelmatig gebruik van
      bodemenergie.
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel2.2b
  - number: 2.3.1
    text: |-
      In afwijking van [artikel 2.1, eerste lid, aanhef en onder a, van de wet][ref1] is geen omgevingsvergunning vereist
      voor de categorieën gevallen in artikel 3 in samenhang met artikel 5 van [bijlage II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027464/2017-01-01#Artikel2.3
