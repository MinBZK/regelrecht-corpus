  - number: '2'
    text: |-
      1 Een saneringsprogramma kan uitsluitend een of meer maatregelen bevatten die strekken tot:

      a. vermindering van het geluid, veroorzaakt door het verkeer op de weg;

      b. vermindering van de geluidsoverdracht van de weg naar de betrokken woningen;

      c. aanbrengen van geluidwerende maatregelen aan de betrokken woningen of

      d. onttrekking aan de bestemming van één of meer van de betrokken woningen.

      2 Maatregelen als bedoeld in het eerste lid, onder b, onderscheidenlijk maatregelen als bedoeld in het eerste
      lid, onder c, onderscheidenlijk maatregelen als bedoeld in het eerste lid, onder d, komen eerst in aanmerking
      voor opneming in het saneringsprogramma, voor zover de toepassing van de in het eerste lid, onder a, genoemde
      maatregelen, onderscheidenlijk de in het eerste lid, onder a en b, dan wel onder a, b en c genoemde maatregelen
      onvoldoende doeltreffend zal zijn dan wel overwegende bezwaren ontmoet van stedenbouwkundige, verkeerskundige,
      landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0009370/2005-07-01#Artikel2
  - number: '3'
    text: |-
      Op de voorbereiding van een saneringsprogramma door burgemeester en wethouders is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009370/2005-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '4'
    text: |-
      1 Een saneringsprogramma bevat:

      a. de resultaten van het akoestisch onderzoek op grond van artikel 88, eerste lid, van de wet;

      b. een of meer kaarten met bijbehorende verklaring als bedoeld in het vijfde lid, een lijst met de adressen van de
      betrokken woningen alsmede de naam en de verkeersfunctie van de weg waarvan de geluidsbelasting wordt ondervonden;

      c. een beschrijving van de maatregelen als bedoeld in [artikel 2, eerste lid, aanhef en onder a en b][ref1], die
      naar het oordeel van burgemeester en wethouders in aanmerking komen, en van het effect van deze maatregelen op de
      geluidsbelasting, vanwege de weg, van de uitwendige scheidingsconstructie van de betrokken woningen;

      d. voor zover toepassing van de in [artikel 2, eerste lid, aanhef en onder a en b][ref2], bedoelde – in het
      saneringsprogramma opgenomen – maatregelen niet leidt tot beperking van de geluidsbelasting, vanwege de weg tot 55
      dB(A), een beschrijving van de bezwaren van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard
      tegen de toepassing van verdergaande maatregelen;

      e. zo nodig, een verklaring dat door middel van maatregelen als bedoeld in [artikel 2, eerste lid, onder c][ref3],
      zal worden voldaan aan artikel 111, derde lid, van de wet;

      f. voor zover van toepassing, een beschrijving van de maatregelen als bedoeld in
      [artikel 2, aanhef en onder d][ref4], alsmede een onderbouwing van deze keuze;

      g. voor zover van de in de [artikel 2, eerste lid][ref5], bedoelde alfabetische rangorde van maatregelen is
      afgeweken, een beschrijving van de redenen waarom is afgeweken;

      h. een beschrijving van de mogelijkheden om de uitvoering van de te treffen maatregelen te faseren, in welk geval
      bij een combinatie van maatregelen de volgorde wordt aangegeven;

      i. een beschrijving van de mogelijkheden om uit een oogpunt van doelmatigheid en kostenbeheersing de te treffen
      maatregelen al dan niet gezamenlijk uit te voeren met andere werken;

      j. een globale indicatie van de geluidsbelasting, vanwege de andere geluidsbronnen, voor zover de betrokken
      woningen tevens zijn gelegen in een of meer aanwezige of toekomstige geluidszones als bedoeld in de artikelen 41,
      53, 106 en 108 van de wet en [artikel 25a van de Luchtvaartwet][ref6];

      k. een indicatie van de kosten van de te treffen maatregelen;

      l. het tijdstip waarop met de uitvoering van de maatregelen kan worden begonnen, alsmede de verwachte duur van de
      uitvoering van de maatregelen.

      2 In afwijking van het eerste lid, bevat een saneringsprogramma, dat, ingevolge artikel 99a van de wet, voorafgaand
      aan een reconstructie van een weg wordt vastgesteld:

      a. de in het eerste lid, onder a, b, d, en j bedoelde informatie;

      b. een globale beschrijving van de maatregelen als bedoeld in [artikel 2, aanhef en onder a en b][ref7], die
      naar het oordeel van burgemeester en wethouders in aanmerking komen, en van het effect van die maatregelen op de
      geluidsbelasting, vanwege de weg, van de uitwendige scheidingsconstructie van de betrokken woningen;

      c. zo nodig, een verklaring dat door middel van maatregelen als bedoeld in [artikel 2, eerste lid, onder c][ref8],
      kan worden voldaan aan artikel 111, derde lid, van de wet;

      d. voor zover van toepassing, een globale beschrijving van de maatregelen als bedoeld in
      [artikel 2, aanhef en onder d][ref9], alsmede een onderbouwing van deze keuze;

      e. een globale beschrijving van de invloed van de verwachte uitvoering van de reconstructie op de aard en omvang
      van de voorgestelde maatregelen;

      f. het tijdstip waarop naar verwachting met de uitvoering van de reconstructie kan worden begonnen, alsmede de
      verwachte duur van de uitvoering;

      g. indien de maatregelen niet gelijktijdig met de uitvoering van de reconstructie zullen worden uitgevoerd,
      het tijdstip waarop met de uitvoering van de maatregelen zal worden begonnen, alsmede de verwachte duur van de
      uitvoering van de maatregelen.

      3 In afwijking van het eerste lid, bevat een saneringsprogramma, dat betrekking heeft op een of meer wijzigingen op
      of aan een aanwezige hoofdweg, als bedoeld in [artikel 2, tweede lid, onder a of b, van de Tracéwet][ref10]:

      a. de in het eerste lid, onder a en b, bedoelde informatie;

      b. een nauwkeurige beschrijving van:

        - de te realiseren ligging in het terrein,
        - het daarbij te realiseren aantal rijstroken,
        - de daarbij te realiseren bijkomende infrastructurele voorzieningen en
        - de daarbij te realiseren maatregelen van landschappelijke, landbouwkundige en ecologische aard;

      c. zo nodig, de in het eerste lid, onder e, bedoelde verklaring;

      d. de te verwachten geluidsbelasting, vanwege de betreffende hoofdweg, na de realisatie van de wijziging of de
      wijzigingen.

      4 In afwijking van het eerste en tweede lid, bevat een saneringsprogramma, dat, ingevolge
      artikel 99a van de wet, voorafgaand aan een reconstructie van een hoofdweg, als bedoeld in
      [artikel 2, tweede lid, onder a of b, van de Tracéwet][ref11], wordt vastgesteld:

      a. de in het derde lid, onder a, b, en d, bedoelde gegevens;

      b. de te verwachten geluidsbelasting, vanwege de betreffende hoofdweg, in het jaar voorafgaand aan de realisatie
      van de wijziging of de wijzigingen;

      c. zo nodig, de in het tweede lid, onder c, bedoelde verklaring.

      5 De kaart of de kaarten, bedoeld in het eerste lid, onder b, geven in elk geval aan:

      a. de zone langs de weg of wegen en de ligging van de betrokken woningen;

      b. bronmaatregelen of overdrachtsmaatregelen en

      c. voor zover hiervan sprake is, de ligging van de betrokken woningen binnen:

        - een geluidszone rond een industrieterrein,
        - een geluidszone rond een luchtvaartterrein,
        - een geluidszone langs een spoor-, tram-, of metroweg of
        - een andere geluidszone.

      6 [Artikel 16, eerste lid, onder a, b, c, d, f, g en h, van het Besluit op de ruimtelijke ordening 1985][ref12] is
      van overeenkomstige toepassing op de in het derde lid bedoelde kaart of kaarten.


