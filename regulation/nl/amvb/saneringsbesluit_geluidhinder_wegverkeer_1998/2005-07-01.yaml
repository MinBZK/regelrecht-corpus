  - number: '11'
    text: |-
      Met betrekking tot een programma van maatregelen als bedoeld in [artikel 8, tweede lid][ref1], onderscheidenlijk
      [artikel 9][ref2] zijn artikel 89, tweede lid, van de wet en de artikelen 2 tot en met 7 van overeenkomstige
      toepassing.


