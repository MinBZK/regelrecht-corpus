  - number: '8'
    text: |-
      1 Burgemeester en wethouders melden, na een ingesteld akoestisch onderzoek, aan Onze Minister de in de gemeente
      voorkomende gevallen waarin op 1 maart 1986 een weg aanwezig was, terwijl op dat tijdstip binnen de zone
      van die weg, bedoeld in artikel 74 van de wet, reeds andere geluidsgevoelige gebouwen dan woningen en andere
      geluidsgevoelige objecten aanwezig waren en de geluidsbelasting vanwege de weg op dat tijdstip:

      a. van de uitwendige scheidingsconstructie van categorie a- en b-gebouwen hoger was dan 55 dB(A);

      b. aan de grens van terreinen hoger was dan 60 dB(A).

      2 Burgemeester en wethouders stellen een programma op van maatregelen die naar hun oordeel in aanmerking komen
      om de geluidsbelasting, vanwege de weg, van de uitwendige scheidingsconstructie van de in het eerste lid bedoelde
      gebouwen, onderscheidenlijk aan de grens van de in het eerste lid bedoelde terreinen te beperken tot de in dat lid
      bedoelde waarden.
    url: https://wetten.overheid.nl/BWBR0009370/2005-07-01#Artikel8
  - number: '9'
    text: |-
      Indien het ingevolge het [tweede lid van artikel 8][ref1] door burgemeester en wethouders op te stellen
      programma van maatregelen onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren zal ontmoeten van
      stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard, stellen zij tevens een programma
      van maatregelen op, gericht op het beperken van de geluidsbelasting van de uitwendige scheidingsconstructie
      onderscheidenlijk aan de grens van terreinen tot een zo laag mogelijk waarde die geen van de genoemde bezwaren
      ontmoet en om zo nodig te voldoen aan het bepaalde in [artikel 10, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009370#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009370#Artikel10
    url: https://wetten.overheid.nl/BWBR0009370/2005-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009370
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0009370
        artikel: '10'
  - number: '10'
    text: |-
      1 Burgemeester en wethouders leggen een vastgesteld programma van maatregelen als bedoeld in
      [artikel 8, tweede lid][ref1], onderscheidenlijk [artikel 9][ref2], onverwijld door tussenkomst van gedeputeerde
      staten voor aan Onze Minister.

      2 Onze Minister stelt na ontvangst van een zodanig programma voor de gebouwen en terreinen waarop het
      betrekking heeft, de ten hoogste toelaatbare waarde van de geluidsbelasting, vanwege de weg, van de uitwendige
      scheidingsconstructie, onderscheidenlijk aan de grens van de terreinen vast.

      3 Onze Minister kan bij een besluit als bedoeld in het tweede lid voor de ten hoogste toelaatbare geluidsbelasting,
      vanwege de weg, van de uitwendige scheidingsconstructie van categorie a- en categorie b-gebouwen en aan de grens
      van terreinen hogere dan de in [artikel 5][ref3] genoemde waarden vaststellen in gevallen waarin de toepassing van
      maatregelen, gericht op het terugbrengen van de geluidsbelasting tot die waarden, onvoldoende doeltreffend zal zijn
      dan wel overwegende bezwaren zal ontmoeten van stedenbouwkundige, verkeerskundige, landschappelijke of financiële
      aard. Deze waarde mag niet te boven gaan:

      a. voor categorie a-gebouwen: 70 dB(A);

      b. voor categorie b-gebouwen: 60 dB(A);

      c. voor terreinen: 70 dB(A).

      4 Indien ingevolge toepassing van het tweede onderscheidenlijk derde lid voor de uitwendige scheidingsconstructie
      van een of meer categorie a- en categorie b-gebouwen een hogere geluidsbelasting dan 55 dB(A) als toelaatbaar
      is aangemerkt, treft de gemeenteraad met betrekking tot de geluidwering van die uitwendige scheidingsconstructie
      maatregelen om te bevorderen dat de geluidsbelasting, vanwege de weg, bij gesloten ramen in de categorie a-ruimten
      40 dB(A) bedraagt en in de categorie b-ruimten 45 dB(A) bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0009370#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009370#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009370#Artikel5
    url: https://wetten.overheid.nl/BWBR0009370/2005-07-01#Artikel10
