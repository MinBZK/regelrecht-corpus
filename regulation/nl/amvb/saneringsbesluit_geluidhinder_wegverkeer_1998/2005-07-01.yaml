articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: de [Wet geluidhinder][ref1];

      b. saneringsprogramma: een programma van maatregelen als bedoeld in [artikel 89, eerste lid, van de wet][ref2];

      c. uitwendige scheidingsconstructie: hetgeen onder dat begrip wordt verstaan in
      [artikel 1.1 van het Bouwbesluit 2003][ref3];

      d. geluidwerende maatregelen: geluidwerende maatregelen aan de uitwendige scheidingsconstructie;

      e. categorie a-gebouw: een gebouw behorende tot een der categorieën, bedoeld in
      [artikel 4, tweede lid, onder a tot en met d, van het Besluit grenswaarden binnen zones langs wegen][ref4], met
      dien verstande dat een gymnastieklokaal voor de toepassing van dit besluit geen deel uitmaakt van de in genoemd
      artikel bedoelde scholen;

      f. categorie b-gebouw: een gebouw behorende tot een der categorieën, bedoeld in
      [artikel 4, tweede lid, onder e, van het Besluit grenswaarden binnen zones langs wegen][ref5];

      g. categorie a-ruimte: een ruimte als bedoeld in
      [artikel 10, tweede lid, onder a, van het Besluit grenswaarden binnen zones langs wegen][ref6];

      h. categorie b-ruimte: een ruimte als bedoeld in
      [artikel 10, tweede lid, onder b, van het Besluit grenswaarden binnen zones langs wegen][ref7];

      i. terrein: een terrein behorende tot de categorie, bedoeld in
      [artikel 7, derde lid, onder a, van het Besluit grenswaarden binnen zones langs wegen][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0003227
