  - number: '12'
    text: |-
      Dit besluit is niet van toepassing op een saneringsprogramma of een programma van maatregelen als bedoeld in
      [artikel 8, tweede lid][ref1], onderscheidenlijk [artikel 9][ref2], dat vóór het tijdstip van inwerkingtreding van
      dit besluit aan Onze Minister is voorgelegd.


