  - number: '5'
    text: |-
      Indien een saneringsprogramma, gericht op het beperken van de geluidsbelasting van de uitwendige
      scheidingsconstructie tot 55 dB(A) onvoldoende doeltreffend zal zijn dan wel overwegende bezwaren ontmoet van
      stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard, stellen burgemeester en wethouders tevens
      een saneringsprogramma op, gericht op het beperken van de geluidsbelasting van de uitwendige scheidingsconstructie
      tot een zo laag mogelijk waarde, die geen van de genoemde bezwaren ontmoet en om zo nodig te voldoen aan het
      bepaalde in artikel 111, derde lid, van de wet.
    url: https://wetten.overheid.nl/BWBR0009370/2005-07-01#Artikel5
  - number: '6'
    text: Onze Minister stelt nadere regels vast met betrekking tot de vormgeving en inrichting van een saneringsprogramma.
    url: https://wetten.overheid.nl/BWBR0009370/2005-07-01#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister kan voor de ten hoogste toelaatbare geluidsbelasting, vanwege een weg, van aanwezige
      woningen gesitueerd binnen de zone, bedoeld in [artikel 74 van de wet][ref1], een hogere dan de in
      [artikel 90, tweede lid, van de wet][ref2] genoemde waarde vaststellen in gevallen waarin toepassing van
      maatregelen, gericht op het terugbrengen van de geluidsbelasting tot die waarde, onvoldoende doeltreffend zal zijn
      dan wel overwegende bezwaren ontmoet van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.

      2 Onze Minister kan voor de ten hoogste toelaatbare geluidsbelasting, vanwege een weg, van aanwezige
      woningen gesitueerd binnen de zone, bedoeld in [artikel 74 van de wet][ref3], een hogere dan de in
      [artikel 90, derde lid, van de wet][ref4] genoemde waarde vaststellen, in gevallen waarin:

      a. toepassing van maatregelen die strekken tot vermindering van het geluid, veroorzaakt door het verkeer op de weg
      niet mogelijk is,

      b. toepassing van maatregelen die strekken tot vermindering van de geluidsoverdracht van de weg naar de betrokken
      woningen niet mogelijk is of duurder zal zijn dan € 74 329,20 per woning,

      c. het onttrekken aan de bestemming van de betrokken woningen binnen het bedrag van €  74 329,20 per woning niet
      mogelijk is, en

      d. koppeling van het treffen van maatregelen aan andere activiteiten niet kan leiden tot het terugbrengen van de
      geluidsbelasting, vanwege de weg, tot de in [artikel 90, derde lid, van de wet][ref5] genoemde waarde binnen het
      bedrag van € 74 329,20 per woning.

      3 Indien gedeputeerde staten toepassing geven aan [artikel 157, eerste lid, van de wet][ref6] geeft Onze Minister
      slechts toepassing aan het eerste lid, voor zover de gecumuleerde geluidsbelastingen na correctie op grond van
      [artikel 157, derde lid, van de wet][ref7], niet leiden tot een naar zijn oordeel onaanvaardbare geluidsbelasting.


