  - number: '6.2'
    text: |-
      De draagkracht komt in de hoogte van de boete tot uiting door het boetebedrag, zoals bepaald op grond van
      [artikel 3][ref1], [4][ref2] en [5][ref3], te vermenigvuldigen met de op grond van [artikel 7][ref4]
      toepasselijke draagkrachtfactor.


      [ref1]: https://wetten.overheid.nl/BWBR0020418#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020418#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020418#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0020418#Artikel7
    url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020418
        artikel: '3'
      - id: ref2
