        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020418
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0020418
        artikel: '7'
  - number: '6.3'
    text: |-
      Indien de toezichthouder niet beschikt over de voor de bepaling van de draagkracht noodzakelijke gegevens, verzoekt
      hij degene aan wie de boete zal worden opgelegd deze gegevens binnen een door hem te stellen redelijke termijn
      te verstrekken.
    url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#Artikel6
  - number: '6.4'
    text: |-
      Indien de betrokkene de in het derde lid bedoelde gegevens niet binnen de in dat lid bedoelde termijn verstrekt, is
      bij de vaststelling van de hoogte van de boete de draagkrachtfactor vijf van toepassing.
    url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#Artikel6
  - number: '6.5'
    text: |-
      Indien een boete wordt opgelegd aan een persoon die behoort tot meerdere van de in het eerste artikel genoemde
      categorie dan is de categorie van toepassing die leidt tot de hoogste draagkrachtfactor.
    url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#Artikel6
  - number: '7'
    text: |-
      De in [artikel 6, tweede lid][ref1], bedoelde draagkrachtfactoren zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020418#Artikel6
    url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#Artikel7
    references:
