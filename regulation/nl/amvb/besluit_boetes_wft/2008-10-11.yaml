        bwb_id: BWBR0020418
        artikel: '6'
  - number: 7.a
    text: 'draagkrachtfactor één:'
    url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#Artikel7
  - number: 7.a.1°
    text: |-
      beleggingsondernemingen, beheerders, beleggingsinstellingen en bewaarders met een eigen vermogen van minder dan
      € 500.000;
