preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 12 juli 2006, nr. FM 2006-1702M;

    Gelet op artikel 1:81, eerste en tweede lid, van de Wet op het financieel toezicht;

    De Raad van State gehoord (advies van 18 augustus, nr. W06.06.0336/IV);

    Gezien het nader rapport van Onze Minister van Financiën van 9 oktober 2006, nr. FM 2006-02367M;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Onder eigen vermogen wordt in dit besluit verstaan:'
    url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#Artikel1
  - number: 1.1.a
    text: |-
      indien het betreft rechtspersonen die op grond van [artikel 360 van Boek 2 van het Burgerlijk Wetboek][ref1]
      verplicht zijn een jaarrekening op te stellen: het eigen vermogen zoals dat blijkt uit die jaarrekening;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel360
    url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '360'
  - number: 1.1.b
    text: |-
      indien het betreft andere administratieplichtigen, die op grond van
      [artikel 52 Algemene wet inzake rijksbelastingen][ref1] verplicht zijn een administratie te voeren en een
      jaarrekening opstellen: het eigen vermogen zoals dat uit deze jaarrekening blijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
  - number: 1.1.c
    text: |-
      indien het betreft administratieplichtigen die geen jaarrekening opstellen: het eigen vermogen zoals dat blijkt uit
      de administratie die op grond van [artikel 52 van de Algemene wet inzake rijksbelasting][ref1] wordt aangehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
  - number: '1.2'
    text: 'Onder balanstotaal wordt in dit besluit verstaan:'
    url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#Artikel1
  - number: 1.2.a
    text: |-
      indien het betreft rechtspersonen als bedoeld in het eerste lid onder a: het balanstotaal zoals dat blijkt uit
      die jaarrekening;
    url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#Artikel1
  - number: 1.2.b
    text: |-
      indien het betreft administratieplichtigen als bedoeld in het eerste lid onder b: het balanstotaal zoals dat uit
      deze jaarrekening blijkt;
    url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#Artikel1
  - number: '1.3'
    text: |-
      Indien het betreft een persoon die niet volgens de Nederlandse wet administratieplichtig is, stelt de toezichthouder
      op basis van andere documenten, met inachtneming van de in [artikel 362 Boek 2 van het Burgerlijk Wetboek][ref1]
      bedoelde normen, het eigen vermogen onderscheidenlijk het balanstotaal vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel362
    url: https://wetten.overheid.nl/BWBR0020418/2008-10-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '362'
  - number: '2'
    text: |-
      Voor de tariefnummers, behorend bij de in [artikel 3][ref1], [4][ref2] en [5][ref3] genoemde overtredingen, zijn
      de boetebedragen als volgt vastgesteld:






