preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 12 november 2004, nr. HDJZ/AWW/2004-2171,
    Hoofddirectie Juridische Zaken;

    Gelet op richtlijn nr. 2004/3/EG van het Europees Parlement en de Raad van de Europese Unie van 11 februari 2004
    (PbEU L 49) tot wijziging van de richtlijnen nr. 70/156//EEG en nr. 80/1268/EEG van de Raad wat betreft de meting
    van de emissie van kooldioxide en het brandstofverbruik van voertuigen van categorie N1 en de artikelen 21, 22,
    eerste lid, en 34, eerste lid, van de Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 15 december 2004, nr. W09.04.0551/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 16 december 2004, nr. HDJZ/AWW/2004-3096,
    Hoofddirectie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017821/2005-01-19#ArtikelAanhef
articles:
  - number: II
    text: |-
      Op verzoek van de fabrikant wordt met ingang van 19 februari 2005 voor bedrijfsauto’s met een verbrandingsmotor,
      niet zijnde bussen, met een toegestane maximum massa van niet meer dan 3500 kg en met een referentiemassa als
      bedoeld in [richtlijn 80/1268/EEG](31980L1268) van meer dan 1305 kg een typegoedkeuring verleend als bedoeld
      in artikel 5, eerste lid, van [richtlijn 2004/3/EG](32004L0003), indien wat betreft de wijze van meten van het
      brandstofverbruik aan [richtlijn 80/1268/EEG](31980L1268) wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0017821/2005-01-19#ArtikelII
  - number: III
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0017821/2005-01-19#ArtikelIII
