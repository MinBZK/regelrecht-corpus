  - number: '4'
    text: |-
      1 Het is verboden te handelen in strijd met het nationale bestrijdingsprogramma, bedoeld in artikel 5 van
      [verordening (EG) nr. 2160/2003](32003R2160), en de ingevolge artikel 8 van [verordening (EG) nr. 2160/2003]
      (32003R2160) vastgestelde voorschriften.

      2 Het is verboden te handelen in strijd met de artikelen 7, vijfde lid, 9, eerste lid, 10, vierde lid, en 12, van
      [verordening (EG) nr. 2160/2003](32003R2160).

      3 Het is verboden te handelen in strijd met op grond van artikel 8, eerste lid, van [verordening (EG) nr.
      2160/2003](32003R2160) vastgestelde specifieke bestrijdingsmethoden en voorschriften.
    url: https://wetten.overheid.nl/BWBR0007820/2004-10-13#Artikel4
  - number: '5'
    text: |-
      Zodra een gebouw of terrein door het plaatsen van een kenteken, ingevolge artikel 22, eerste lid, van de wet,
      besmet of van besmetting verdacht is verklaard met klassieke varkenspest, mond- en klauwzeer, aviaire influenza,
      ziekte van Newcastle, paardepest, de in bijlage A, lijsten I en II van [richtlijn nr. 91/67/EEG](31991L0067)
      genoemde visziekten of de in bijlage I van [richtlijn nr. 92/119/EEG](31992L0119) genoemde dierziekten, legt de
      houder van de zieke of verdachte dieren per voor de ziekte vatbare diersoort schriftelijk vast het aantal dieren,
      het aantal gestorven dieren en het aantal dieren dat verschijnselen van een besmettelijke dierziekte vertoont. De
      gegevens van de telling dienen, totdat het kenteken is verwijderd, na een mutatie in bovengenoemde aantallen zo
      spoedig mogelijk te worden bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0007820/2004-10-13#Artikel5
  - number: '6'
    text: |-
      Indien de houder van een dier vermoedt dat dat dier door aviaire influenza, ziekte van Newcastle, paardepest, de
      in Bijlage A, lijsten I en II, van [richtlijn nr. 91/67/EEG](31991L0067) genoemde visziekten of de in Bijlage I van
      [richtlijn nr. 92/119/EEG](31992L0119) genoemde dierziekten is aangetast,

      a. treft hij, totdat Onze Minister de nodig geachte maatregelen neemt, dienstige maatregelen als bedoeld in artikel
      22, eerste lid, onderdelen *a*, *b* , en *i* van de wet;

      b. draagt hij er zorg voor dat dat dier zijn verblijfplaats niet verlaat;

      c. legt hij per voor de ziekte vatbare diersoort schriftelijk vast het aantal dieren, het aantal gestorven dieren
      en het aantal dieren dat verschijnselen van een besmettelijke dierziekte vertoont en brengt hij mutaties zo spoedig
      mogelijk in deze telling aan;

      d. is het hem verboden de bij of krachtens artikel 25, eerste lid, van de wet aangewezen soorten of categorieën van
      dieren, produkten of voorwerpen te vervoeren van en naar het gebouw of terrein, en

      e. is het hem verboden het gebouw of terrein te verlaten, tenzij na toepassing van de door Onze Minister krachtens
      artikel 26 van de wet voorgeschreven maatregelen van ontsmetting.
    url: https://wetten.overheid.nl/BWBR0007820/2004-10-13#Artikel6
  - number: 6a
    text: |-
      1 Indien sprake is van plotselinge sterfte onder tweekleppigen op een tweekleppigenbedrijf, met uitzondering van
      een broedbedrijf of een kweekbedrijf waar kweeksystemen worden gebruikt, dient de houder binnen 15 dagen na de
      constatering hiervan, de aard en de ernst van de sterfte vast te stellen.

      2 Indien sprake is van abnormale sterfte onder tweekleppigen op een tweekleppigenbedrijf geeft de houder of de
      dierenarts hiervan terstond kennis aan de burgemeester van de gemeente waar de tweekleppigen zich bevinden.
    url: https://wetten.overheid.nl/BWBR0007820/2004-10-13#Artikel6a
  - number: 6b
    text: |-
      1 De houder van tweekleppigen, die gehouden worden om in de handel te worden gebracht, laat zijn
      tweekleppigenbedrijf registeren.

      2 De registratie vindt plaats in een register dat wordt bijgehouden door Onze Minister.

      3 De houder van tweekleppigen, die gehouden worden om in de handel te worden gebracht, houdt aantekening:

      a. van de levende tweekleppigen die aan het tweekleppigenbedrijf worden toegevoegd, met alle gegevens inzake
      levering, aantal of gewicht, groeistadium en herkomst en;

      b. van de levende tweekleppigen die van het tweekleppigenbedrijf worden afgevoerd om, met het oog op het in de
      handel brengen daarvan opnieuw in het water te worden gebracht, met gegevens inzake verzending, aantal of gewicht,
      groeistadium en bestemming, en

      c. van de abnormale sterfte onder tweekleppigen.

      4 De gegevens, genoemd in het derde lid, worden zo spoedig mogelijk na een mutatie bijgewerkt en worden 4 jaar
      bewaard.
    url: https://wetten.overheid.nl/BWBR0007820/2004-10-13#Artikel6b
  - number: '11'
    text: |-
      Het Besluit houdende nadere regelen inzake de bestrijding van de pseudo-vogelpest, het Besluit vogelpest, het
      Besluit houdende maatregelen in verband met vogelcholera, het Besluit infectieuze laryngo tracheïtis en het Besluit
      entstoffen voor dieren worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007820/2004-10-13#Artikel11
  - number: '12'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007820/2004-10-13#Artikel12
  - number: '13'
    text: |-
      Dit besluit wordt aangehaald als: Besluit bescherming tegen bepaalde zoönosen en bestrijding besmettelijke
      dierziekten.
    url: https://wetten.overheid.nl/BWBR0007820/2004-10-13#Artikel13
