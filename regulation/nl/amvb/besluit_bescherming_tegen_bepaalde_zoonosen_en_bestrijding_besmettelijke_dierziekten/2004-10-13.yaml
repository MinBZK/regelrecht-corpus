articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: [Gezondheids- en welzijnswet voor dieren][ref1];

      b. [verordening (EG) nr. 2160/2003](32003R2160): [verordening (EG) nr. 2160/2003](32003R2160) van het Europees
      Parlement en de Raad van de Europese Unie van 17 november 2003 (PbEU L 325) inzake de bestrijding van salmonella en
      andere specifieke door voedsel overgedragen zoönoseverwekkers;

      c. [richtlijn nr. 2003/99/EG](32003L0099): [richtlijn nr. 2003/99/EG](32003L0099) van het Europees Parlement en
      de Raad van de Europese Unie van 17 november 2003 inzake de bewaking van zoönosen en zoönoseverwekkers en houdende
      wijziging van Beschikking 90/424/EEG van de Raad en intrekking van [Richtlijn 92/117/EEG](31992L0117) van de Raad
      (PbEU L 325);

      d. [richtlijn nr. 77/99/EEG](31977L0099) : Richtlijn van de Raad van de Europese Gemeenschappen van 21 december
      1976 betreffende de gezondheidsvoorschriften voor de produktie en het in de handel brengen van vleesprodukten en
      bepaalde andere produkten van dierlijke oorsprong (*PbEG* 1992, L 57);

      e. [richtlijn nr. 91/67/EEG](31991L0067) : Richtlijn van de Raad van de Europese Gemeenschappen van 28
      januari 1991 inzake veterinairrechtelijke voorschriften voor het in de handel brengen van aquicultuurdieren en
      aquicultuurprodukten ( *PbEG* L 46);

      f. [richtlijn nr. 92/119/EEG](31992L0119): Richtlijn van de Raad van de Europese Gemeenschappen van 17 december
      1992 tot vaststelling van algemene communautaire maatregelen voor de bestrijding van bepaalde dierziekten en van
      specifieke maatregelen ten aanzien van de vesiculaire varkensziekte (*PbEG* 1993, L 62);

      g. in de handel brengen: het onder zich hebben of uitstallen met het oog op de uiteindelijke verkoop, het te koop
      stellen, het verkopen, het leveren, de overdracht of iedere andere vorm van in de handel brengen, met uitzondering
      van de verkoop in de detailhandel;

      h. tweekleppigenbedrijf: inrichting of ieder geografisch begrensd gebied waar tweekleppigen worden gekweekt of
      gehouden om in de handel te worden gebracht;

      i. abnormale sterfte:

      I. plotselinge sterfte van 15% of meer van de tweekleppigen op een tweekleppigenbedrijf, met uitzondering van
      een broedbedrijf of een kweekbedrijf waar kweeksystemen worden gebruikt, die zich tussen twee waarnemingen heeft
      ingezet en waarvan de aard en de ernst binnen 15 dagen na de tweede waarneming is bevestigd of

      II. het niet verkrijgen van larven op een broedbedrijf van tweekleppigen wanneer gedurende een bepaalde periode
      enkele malen na elkaar broed is uitgezaaid of

      III. een aanzienlijke sterfte van 15% of meer in een groot aantal kweeksystemen op een kweekbedrijf van
      tweekleppigen waar kweeksystemen worden gebruikt;

      j. ambtenaar: ambtenaar, bedoeld in [artikel 114, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005662
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel114
