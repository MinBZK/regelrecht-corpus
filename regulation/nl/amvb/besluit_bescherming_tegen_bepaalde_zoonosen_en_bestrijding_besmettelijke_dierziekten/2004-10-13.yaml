    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 10 mei 1994, no. J.
    947133, Directie Juridische en Bedrijfsorganisatorische Zaken, gedaan mede namens Onze Minister van Welzijn,
    Volksgezondheid en Cultuur;

    Gelet op artikel 4, eerste lid, eerste gedachtenstreepje en artikel 6bis, tweede lid, onderdeel a, van
    Richtlijn nr. 80/217/EEG van de Raad van de Europese Gemeenschappen van 22 januari 1980 tot vaststelling van
    gemeenschappelijke maatregelen ter bestrijding van klassieke varkenspest (PbEG L 47), artikel 4, eerste lid, eerste
    gedachtenstreepje, van Richtlijn nr. 85/511/EEG van de Raad van de Europese Gemeenschappen van 18 november 1985
    tot vaststelling van gemeenschappelijke maatregelen ter bestrijding van mond- en klauwzeer (PbEG L 315), artikel
    4, tweede lid, onderdeel b, subonderdeel i, en derde lid, van Richtlijn nr. 92/35/EEG van de Raad van de Europese
    Gemeenschappen van 29 april 1992 tot vaststelling van controlevoorschriften en van maatregelen ter bestrijding van
    paardepest (PbEG L 157), artikel 4, tweede lid, onderdeel a, en derde lid, van Richtlijn nr. 92/40/EEG van de Raad
    van de Europese Gemeenschappen van 19 mei 1992 tot vaststelling van communautaire maatregelen voor de bestrijding
    van aviaire influenza (PbEG L 167), artikel 4, tweede lid, onderdeel a, en derde lid, van Richtlijn nr. 92/66/EEG
    van de Raad van de Europese Gemeenschappen van 14 juli 1992 tot vaststelling van communautaire maatregelen voor de
    bestrijding van de ziekte van Newcastle (PbEG L 260); artikel 3, derde lid, artikel 4, eerste lid, onderdelen a en
    d, en Bijlage III, deel II van Richtlijn nr. 92/117/EEG van de Raad van de Europese Gemeenschappen van 17 december
    1992 inzake maatregelen voor de bescherming tegen bepaalde zoönoses en bepaalde zoönoseverwekkers bij dieren en
    in produkten van dierlijke oorsprong ten einde door voedsel overgedragen infecties en vergiftigingen te voorkomen
    (PbEG 1993, L 62), artikel 4, tweede lid, onderdeel a, en derde lid van Richtlijn nr. 92/119/EEG van de Raad van
    de Europese Gemeenschappen van 17 december 1992 tot vaststelling van algemene communautaire maatregelen voor de
    bestrijding van bepaalde dierziekten en van specifieke maatregelen ten aanzien van de vesiculaire varkensziekte
    (PbEG 1993, L 62), artikel 5, tweede lid, onderdeel a, en derde lid, van Richtlijn nr. 93/53/EEG van de Raad
    van de Europese Gemeenschappen van 24 juni 1993 tot vaststelling van minimale communautaire maatregelen voor de
    bestrijding van bepaalde visziekten (PbEG L 175);

    Gelet op de artikelen 15, vierde lid, 25, eerste lid, 86, tweede lid, 97, 108 en 111 van de Gezondheids- en
    welzijnswet voor dieren;

    Gezien het advies van de Raad voor dierenaangelegenheden (d.d. 23 februari 1994), het Landbouwschap (d.d. 25
    februari 1994), het Produktschap Vee en Vlees (d.d. 18 februari 1994), het Produktschap voor Pluimvee en Eieren
    (d.d. 3 maart 1994), het Produktschap voor Vis en Visprodukten (d.d. 3 maart 1994), Produktschap voor Veevoeder
    (d.d. 7 februari 1994), het Bedrijfschap voor de Pluimveehandel en -industrie (d.d. 3 maart 1994) en het
    Bedrijfschap voor de Handel in Vee (d.d. 11 maart 1994);

    De Raad van State gehoord (advies van 9 augustus 1994, No. W11.94.0299);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 12 december 1995, No. J.
    9515 407, Directie Juridische Zaken, uitgebracht mede namens Onze Staatssecretaris van Volksgezondheid, Welzijn
    en Sport;

    Hebben goedgevonden en verstaan:
