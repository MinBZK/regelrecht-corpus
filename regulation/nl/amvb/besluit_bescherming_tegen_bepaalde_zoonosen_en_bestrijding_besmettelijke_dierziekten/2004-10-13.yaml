  - number: '2'
    text: |-
      1 De exploitant van een levensmiddelenbedrijf, bedoeld in artikel 3, derde lid, van [verordening (EG) nr.
      178/2002](32002R0178) van het Europees Parlement en de Raad van de Europese Gemeenschappen van 28 januari
      2002 (PbEG L 31) tot vaststelling van de algemene beginselen en voorschriften van de levensmiddelenwetgeving,
      tot oprichting van een Europese Autoriteit voor voedselveiligheid en tot vaststelling van procedures voor
      voedselveiligheidsaangelegenheden, die onderzoek doet naar de aanwezigheid van zoönosen of zoönoseverwekkers, die
      overeenkomstig artikel 4, tweede lid, van [richtlijn nr. 2003/99/EG](32003L0099) worden bewaakt:

      a. houdt de resultaten van het onderzoek bij;

      b. bewaart de onderzoeksgegevens en de relevante isolaten gedurende een door Onze Minister te bepalen periode en

      c. stelt de onderzoeksresultaten of relevante isolaten desgevraagd ter beschikking aan Onze Minister.

      2 De exploitant of een beheerder van een overeenkomstig [richtlijn nr. 77/99/EEG](31977L0099) erkende inrichting:

      a. bewaart de gegevens, bedoeld in artikel 7, eerste lid, van [richtlijn nr. 77/99/EEG](31977L0099), gedurende een
      termijn van twee jaar;

      b. bewaart de gegevens, bedoeld in artikel 7, tweede lid, van [richtlijn nr. 77/99/EEG](31977L0099), gedurende zes
      maanden na de datum van minimale houdbaarheid van het product en

      c. stelt de gegevens desgevraagd ter beschikking aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007820/2004-10-13#Artikel2
  - number: 2a
    text: |-
      1 De bevoegde autoriteit, bedoeld in artikel 3, eerste lid, van [verordening (EG) nr. 2160/2003](32003R2160), is
      Onze Minister.

      2 De bevoegde autoriteit, bedoeld in artikel 3, tweede lid, van [richtlijn nr. 2003/99/EG](32003L0099), is Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0007820/2004-10-13#Artikel2a
  - number: '3'
    text: |-
      1 Onze Minister kan, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, regels stellen
      omtrent de monitoring, preventie en bestrijding van zoönosen en zoönoseverwekkers als bedoeld in bijlage I bij
      [verordening (EG) nr. 2160/2003](32003R2160) en bijlage I bij [richtlijn nr. 2003/99/EG](32003L0099), voorzover dit
      noodzakelijk is ter uitvoering van communautaire regelgeving.

      2 De in het eerste lid bedoelde regels hebben betrekking op:

      a. het doen van onderzoek naar, het bewaren van gegevens over, het verzamelen en ter beschikking stellen van
      onderzoeksresultaten met betrekking tot de aanwezigheid van zoönosen en zoönoseverwekkers, antimicrobiële
      resistentie bij zoönoseverwekkers en bij andere verwekkers, wanneer deze een gevaar opleveren voor de
      volksgezondheid;

      b. de preventie en bestrijding van zoönosen en zoönoseverwekkers op grond van het nationale bestrijdingsprogramma,
      bedoeld in artikel 5 van [verordening (EG) nr. 2160/2003](32003R2160), en de ingevolge artikel 8 van [verordening
      (EG) nr. 2160/2003](32003R2160) vastgestelde voorschriften;

      c. het stellen van voorwaarden aan het intracommunautaire handelsverkeer, bij of krachtens artikel 9, tweede en
      vierde lid, van [verordening (EG) nr. 2160/2003](32003R2160) en

      d. het stellen van voorwaarden aan het handelsverkeer met derde landen, bij of krachtens artikel 10, vijfde lid,
      van [verordening (EG) nr. 2160/2003](32003R2160).

      3 Onze Minister kan, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, laboratoria als
      bedoeld in artikel 12 van [verordening (EG) nr. 2160/2003](32003R2160) erkennen.

      4 Onze Minister wijst, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport een nationaal
      referentielaboratorium aan overeenkomstig artikel 11 van [verordening (EG) nr. 2160/2003](32003R2160) en artikel 10
      van [richtlijn nr. 2003/99/EG](32003L0099).
    url: https://wetten.overheid.nl/BWBR0007820/2004-10-13#Artikel3
  - number: 3a
    text: |-
      1 Onze Minister kan, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, medewerking
      vorderen van het bestuur van het Productschap Diervoeder, het Productschap Pluimvee en Eieren, het
      Productschap Vee en Vlees of het Productschap Zuivel voor het uitoefenen van de bevoegdheden, bedoeld in
      [artikel 3, tweede lid, onderdelen a en b][ref1].

      2 Onze Minister kan, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, bepalen dat
      tuchtrechtelijke maatregelen kunnen worden gesteld bij overtreding van de maatregelen die, op grond van het eerste
      lid, bij verordening door het bestuur van het Productschap Diervoeder, het Productschap Pluimvee en Eieren, het
      Productschap Vee en Vlees of het Productschap Zuivel zijn vastgesteld, voorzover het handelen in strijd met de
      regelen als overtreding strafbaar is gesteld.

      3 Onze Minister kan, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, bepalen dat het
      Productschap Diervoeder, het Productschap Pluimvee en Eieren, het Productschap Vee en Vlees of het Productschap
      Zuivel personen kan aanwijzen die worden belast met het toezicht op de naleving van de op grond van het eerste lid
      vastgestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0007820#Artikel3
    url: https://wetten.overheid.nl/BWBR0007820/2004-10-13#Artikel3a
