$id: besluit_bescherming_tegen_bepaalde_zoonosen_en_bestrijding_besmettelijke_dierziekten
regulatory_layer: AMVB
publication_date: '2014-12-24'
valid_from: '2008-08-01'
bwb_id: BWBR0007820
url: https://wetten.overheid.nl/BWBR0007820/2008-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 10 mei 1994, no. J.
    947133, Directie Juridische en Bedrijfsorganisatorische Zaken, gedaan mede namens Onze Minister van Welzijn,
    Volksgezondheid en Cultuur;

    Gelet op artikel 4, eerste lid, eerste gedachtenstreepje en artikel 6bis, tweede lid, onderdeel a, van
    Richtlijn nr. 80/217/EEG van de Raad van de Europese Gemeenschappen van 22 januari 1980 tot vaststelling van
    gemeenschappelijke maatregelen ter bestrijding van klassieke varkenspest (PbEG L 47), artikel 4, eerste lid, eerste
    gedachtenstreepje, van Richtlijn nr. 85/511/EEG van de Raad van de Europese Gemeenschappen van 18 november 1985
    tot vaststelling van gemeenschappelijke maatregelen ter bestrijding van mond- en klauwzeer (PbEG L 315), artikel
    4, tweede lid, onderdeel b, subonderdeel i, en derde lid, van Richtlijn nr. 92/35/EEG van de Raad van de Europese
    Gemeenschappen van 29 april 1992 tot vaststelling van controlevoorschriften en van maatregelen ter bestrijding van
    paardepest (PbEG L 157), artikel 4, tweede lid, onderdeel a, en derde lid, van Richtlijn nr. 92/40/EEG van de Raad
    van de Europese Gemeenschappen van 19 mei 1992 tot vaststelling van communautaire maatregelen voor de bestrijding
    van aviaire influenza (PbEG L 167), artikel 4, tweede lid, onderdeel a, en derde lid, van Richtlijn nr. 92/66/EEG
    van de Raad van de Europese Gemeenschappen van 14 juli 1992 tot vaststelling van communautaire maatregelen voor de
    bestrijding van de ziekte van Newcastle (PbEG L 260); artikel 3, derde lid, artikel 4, eerste lid, onderdelen a en
    d, en Bijlage III, deel II van Richtlijn nr. 92/117/EEG van de Raad van de Europese Gemeenschappen van 17 december
    1992 inzake maatregelen voor de bescherming tegen bepaalde zoönoses en bepaalde zoönoseverwekkers bij dieren en
    in produkten van dierlijke oorsprong ten einde door voedsel overgedragen infecties en vergiftigingen te voorkomen
    (PbEG 1993, L 62), artikel 4, tweede lid, onderdeel a, en derde lid van Richtlijn nr. 92/119/EEG van de Raad van
    de Europese Gemeenschappen van 17 december 1992 tot vaststelling van algemene communautaire maatregelen voor de
    bestrijding van bepaalde dierziekten en van specifieke maatregelen ten aanzien van de vesiculaire varkensziekte
    (PbEG 1993, L 62), artikel 5, tweede lid, onderdeel a, en derde lid, van Richtlijn nr. 93/53/EEG van de Raad
    van de Europese Gemeenschappen van 24 juni 1993 tot vaststelling van minimale communautaire maatregelen voor de
    bestrijding van bepaalde visziekten (PbEG L 175);

    Gelet op de artikelen 15, vierde lid, 25, eerste lid, 86, tweede lid, 97, 108 en 111 van de Gezondheids- en
    welzijnswet voor dieren;

    Gezien het advies van de Raad voor dierenaangelegenheden (d.d. 23 februari 1994), het Landbouwschap (d.d. 25
    februari 1994), het Produktschap Vee en Vlees (d.d. 18 februari 1994), het Produktschap voor Pluimvee en Eieren
    (d.d. 3 maart 1994), het Produktschap voor Vis en Visprodukten (d.d. 3 maart 1994), Produktschap voor Veevoeder
    (d.d. 7 februari 1994), het Bedrijfschap voor de Pluimveehandel en -industrie (d.d. 3 maart 1994) en het
    Bedrijfschap voor de Handel in Vee (d.d. 11 maart 1994);

    De Raad van State gehoord (advies van 9 augustus 1994, No. W11.94.0299);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 12 december 1995, No. J.
    9515 407, Directie Juridische Zaken, uitgebracht mede namens Onze Staatssecretaris van Volksgezondheid, Welzijn
    en Sport;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel1
  - number: 1.a
    text: |-
      *wet:* [Gezondheids- en welzijnswet voor dieren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: 1.b
    text: |-
      *verordening (EG) nr. 2160/2003:* verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad van
      de Europese Unie van 17 november 2003 inzake de bestrijding van salmonella en andere specifieke door voedsel
      overgedragen zoönoseverwekkers (PbEU L 325);
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel1
  - number: 1.c
    text: |-
      *richtlijn nr. 2003/99/EG:* richtlijn nr. 2003/99/EG van het Europees Parlement en de Raad van de Europese Unie van
      17 november 2003 inzake de bewaking van zoönosen en zoönoseverwekkers en houdende wijziging van Beschikking 90/424/
      EEG van de Raad en intrekking van richtlijn nr. 92/117/EEG van de Raad (PbEU L 325);
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel1
  - number: 1.d
    text: |-
      *richtlijn nr. 92/119/EEG:* richtlijn nr. 92/119/EEG van de Raad van de Europese Gemeenschappen van 17 december
      1992 tot vaststelling van algemene communautaire maatregelen voor de bestrijding van bepaalde dierziekten en van
      specifieke maatregelen ten aanzien van de vesiculaire varkensziekte (PbEG 1993, L 62).
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel1
  - number: '2'
    text: |-
      De exploitant van een levensmiddelenbedrijf, bedoeld in artikel 3, derde lid, van [verordening (EG) nr.
      178/2002](32002R0178) van het Europees Parlement en de Raad van de Europese Gemeenschappen van 28 januari
      2002 (PbEG L 31) tot vaststelling van de algemene beginselen en voorschriften van de levensmiddelenwetgeving,
      tot oprichting van een Europese Autoriteit voor voedselveiligheid en tot vaststelling van procedures voor
      voedselveiligheidsaangelegenheden, die onderzoek doet naar de aanwezigheid van zoönosen of zoönoseverwekkers, die
      overeenkomstig artikel 4, tweede lid, van [richtlijn nr. 2003/99/EG](32003L0099) worden bewaakt:
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel2
  - number: 2.a
    text: houdt de resultaten van het onderzoek bij;
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel2
  - number: 2.b
    text: bewaart de onderzoeksgegevens en de relevante isolaten gedurende een door Onze Minister te bepalen periode en
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel2
  - number: 2.c
    text: stelt de onderzoeksresultaten of relevante isolaten desgevraagd ter beschikking aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel2
  - number: 2a.1
    text: |-
      De bevoegde autoriteit, bedoeld in artikel 3, eerste lid, van [verordening (EG) nr. 2160/2003](32003R2160), is
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel2a
  - number: 2a.2
    text: |-
      De bevoegde autoriteit, bedoeld in artikel 3, tweede lid, van [richtlijn nr. 2003/99/EG](32003L0099), is Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel2a
  - number: '3.1'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, regels stellen
      omtrent de monitoring, preventie en bestrijding van zoönosen en zoönoseverwekkers als bedoeld in bijlage I bij
      [verordening (EG) nr. 2160/2003](32003R2160) en bijlage I bij [richtlijn nr. 2003/99/EG](32003L0099), voorzover dit
      noodzakelijk is ter uitvoering van communautaire regelgeving.
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel3
  - number: '3.2'
    text: 'De in het eerste lid bedoelde regels hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel3
  - number: 3.2.a
    text: |-
      het doen van onderzoek naar, het bewaren van gegevens over, het verzamelen en ter beschikking stellen van
      onderzoeksresultaten met betrekking tot de aanwezigheid van zoönosen en zoönoseverwekkers, antimicrobiële
      resistentie bij zoönoseverwekkers en bij andere verwekkers, wanneer deze een gevaar opleveren voor de
      volksgezondheid;
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel3
  - number: 3.2.b
    text: |-
      de preventie en bestrijding van zoönosen en zoönoseverwekkers op grond van het nationale bestrijdingsprogramma,
      bedoeld in artikel 5 van [verordening (EG) nr. 2160/2003](32003R2160), en de ingevolge artikel 8 van [verordening
      (EG) nr. 2160/2003](32003R2160) vastgestelde voorschriften;
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel3
  - number: 3.2.c
    text: |-
      het stellen van voorwaarden aan het intracommunautaire handelsverkeer, bij of krachtens artikel 9, tweede en vierde
      lid, van [verordening (EG) nr. 2160/2003](32003R2160) en
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel3
  - number: 3.2.d
    text: |-
      het stellen van voorwaarden aan het handelsverkeer met derde landen, bij of krachtens artikel 10, vijfde lid, van
      [verordening (EG) nr. 2160/2003](32003R2160).
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, laboratoria als
      bedoeld in artikel 12 van [verordening (EG) nr. 2160/2003](32003R2160) erkennen.
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel3
  - number: '3.4'
    text: |-
      Onze Minister wijst, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport een nationaal
      referentielaboratorium aan overeenkomstig artikel 11 van [verordening (EG) nr. 2160/2003](32003R2160) en artikel 10
      van [richtlijn nr. 2003/99/EG](32003L0099).
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel3
  - number: 3a.1
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, medewerking
      vorderen van het bestuur van het Productschap Diervoeder, het Productschap Pluimvee en Eieren, het
      Productschap Vee en Vlees of het Productschap Zuivel voor het uitoefenen van de bevoegdheden, bedoeld in
      [artikel 3, tweede lid, onderdelen a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007820#Artikel3
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0007820
        artikel: '3'
  - number: 3a.2
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, bepalen dat
      tuchtrechtelijke maatregelen kunnen worden gesteld bij overtreding van de maatregelen die, op grond van het eerste
      lid, bij verordening door het bestuur van het Productschap Diervoeder, het Productschap Pluimvee en Eieren, het
      Productschap Vee en Vlees of het Productschap Zuivel zijn vastgesteld, voorzover het handelen in strijd met de
      regelen als overtreding strafbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel3a
  - number: 3a.3
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, bepalen dat het
      Productschap Diervoeder, het Productschap Pluimvee en Eieren, het Productschap Vee en Vlees of het Productschap
      Zuivel personen kan aanwijzen die worden belast met het toezicht op de naleving van de op grond van het eerste lid
      vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel3a
  - number: '4.1'
    text: |-
      Het is verboden te handelen in strijd met het nationale bestrijdingsprogramma, bedoeld in artikel 5 van
      [verordening (EG) nr. 2160/2003](32003R2160), en de ingevolge artikel 8 van [verordening (EG) nr. 2160/2003]
      (32003R2160) vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel4
  - number: '4.2'
    text: |-
      Het is verboden te handelen in strijd met de artikelen 7, vijfde lid, 9, eerste lid, 10, vierde lid, en 12, van
      [verordening (EG) nr. 2160/2003](32003R2160).
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel4
  - number: '4.3'
    text: |-
      Het is verboden te handelen in strijd met op grond van artikel 8, eerste lid, van [verordening (EG) nr. 2160/2003]
      (32003R2160) vastgestelde specifieke bestrijdingsmethoden en voorschriften.
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel4
  - number: '5'
    text: |-
      Zodra een gebouw of terrein door het plaatsen van een kenteken, ingevolge
      [artikel 22, eerste lid, van de wet][ref1], besmet of van besmetting verdacht is verklaard met klassieke
      varkenspest, mond- en klauwzeer, aviaire influenza, ziekte van Newcastle, paardepest, of de in bijlage I van
      [richtlijn nr. 92/119/EEG](31992L0119) genoemde dierziekten, legt de houder van de zieke of verdachte dieren per
      voor de ziekte vatbare diersoort schriftelijk vast het aantal dieren, het aantal gestorven dieren en het aantal
      dieren dat verschijnselen van een besmettelijke dierziekte vertoont. De gegevens van de telling dienen, totdat het
      kenteken is verwijderd, na een mutatie in bovengenoemde aantallen zo spoedig mogelijk te worden bijgewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
  - number: '6'
    text: |-
      Indien de houder van een dier vermoedt dat dat dier door aviaire influenza, ziekte van Newcastle, paardepest, of de
      in Bijlage I van [richtlijn nr. 92/119/EEG](31992L0119) genoemde dierziekten is aangetast,
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel6
  - number: 6.a
    text: |-
      treft hij, totdat Onze Minister de nodig geachte maatregelen neemt, dienstige maatregelen als bedoeld in
      [artikel 22, eerste lid, onderdelen a, b, en i van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
  - number: 6.b
    text: draagt hij er zorg voor dat dat dier zijn verblijfplaats niet verlaat;
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel6
  - number: 6.c
    text: |-
      legt hij per voor de ziekte vatbare diersoort schriftelijk vast het aantal dieren, het aantal gestorven dieren en
      het aantal dieren dat verschijnselen van een besmettelijke dierziekte vertoont en brengt hij mutaties zo spoedig
      mogelijk in deze telling aan;
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel6
  - number: 6.d
    text: |-
      is het hem verboden de bij of krachtens [artikel 25, eerste lid, van de wet][ref1] aangewezen soorten of
      categorieën van dieren, produkten of voorwerpen te vervoeren van en naar het gebouw of terrein, en


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel25
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '25'
  - number: 6.e
    text: |-
      is het hem verboden het gebouw of terrein te verlaten, tenzij na toepassing van de door Onze Minister krachtens
      [artikel 26 van de wet][ref1] voorgeschreven maatregelen van ontsmetting.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel26
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '26'
  - number: '11'
    text: |-
      Het Besluit houdende nadere regelen inzake de bestrijding van de pseudo-vogelpest, het Besluit vogelpest, het
      Besluit houdende maatregelen in verband met vogelcholera, het Besluit infectieuze laryngo tracheïtis en het Besluit
      entstoffen voor dieren worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel11
  - number: '12'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel12
  - number: '13'
    text: |-
      Dit besluit wordt aangehaald als: Besluit bescherming tegen bepaalde zoönosen en bestrijding besmettelijke
      dierziekten.
    url: https://wetten.overheid.nl/BWBR0007820/2008-08-01#Artikel13
