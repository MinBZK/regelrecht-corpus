---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_burgerservicenummer
regulatory_layer: AMVB
publication_date: '2023-07-12'
valid_from: '2025-11-11'
bwb_id: BWBR0022829
url: https://wetten.overheid.nl/BWBR0022829/2025-11-11
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Bestuurlijke Vernieuwing en Koninkrijksrelaties van 17 oktober 2006, nr.
    2006-0000339264, CS/CZW;

    Gelet op de artikelen 3, tweede lid, 4, 6, 8, vijfde lid, 16, 18, derde lid, en 21, vierde lid, van de Wet algemene
    bepalingen burgerservicenummer en de artikelen 5, 6, eerste lid, 34, vierde lid, 35, achtste lid, 59, tweede lid,
    91, 99 en 114, vijfde lid, van de Wet gemeentelijke basisadministratie persoonsgegevens;

    De Raad van State gehoord (advies van 15 november 2006, nr. W04.06.0456/I);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 15 oktober 2007,
    nr. 2007-0000370830, STAF/CZW/WVOB;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet algemene bepalingen burgerservicenummer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022428
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022428
  - number: 1.b
    text: |-
      systeembeschrijving: de systeembeschrijving, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022829#Artikel2
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022829
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.c
    text: |-
      geautomatiseerde systeem van het college van burgemeester en wethouders: het geautomatiseerde systeem
      waarmee het college van burgemeester en wethouders uitvoering geeft aan het bepaalde in en krachtens
      [artikel 8, vierde en vijfde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel8
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '8'
  - number: 1.d
    text: |-
      geautomatiseerde systeem van de gebruiker: het geautomatiseerde systeem waarmee de gebruiker uitvoering geeft aan
      de regels, bedoeld in [artikel 16, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel16
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '16'
  - number: '2'
    text: Bij ministeriële regeling wordt een systeembeschrijving vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel2
  - number: '3'
    text: 'De systeembeschrijving bevat een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel3
  - number: 3.a
    text: de hoofdlijnen van de inrichting van de beheervoorziening;
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel3
  - number: 3.b
    text: |-
      de wijze waarop nummers worden aangemaakt en ter beschikking gesteld aan het college van burgemeester en
      wethouders, onderscheidenlijk Onze Minister, teneinde als burgerservicenummer te worden toegekend;
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel3
  - number: 3.c
    text: de wijze waarop gegevens in het nummerregister worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel3
  - number: 3.d
    text: |-
      de gevallen waarin en de wijze waarop gegevens in het nummerregister worden gewijzigd of uit het nummerregister
      worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel3
  - number: 3.e
    text: de uitwisseling van gegevens, die verband houdt met de bijhouding van het nummerregister;
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel3
  - number: 3.f
    text: |-
      de inrichting en de werking van de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onder c en d, van de wet][ref1], met inbegrip van de gegevens die worden uitgewisseld
      tussen de beheervoorziening en de registraties, bedoeld in artikel 3, eerste lid, onder d, van de wet, en de wijze
      waarop die gegevensuitwisselingen plaatsvinden;


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 3.g
    text: |-
      de wijze waarop de beheervoorziening het geautomatiseerde systeem van een gebruiker of een college van burgemeester
      en wethouders in staat stelt, aan te sluiten op de beheervoorziening, alsmede van de beveiliging van de aansluiting
      op de beheervoorziening;
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel3
  - number: 3.h
    text: |-
      de gevallen waarin en de wijze waarop aantekening wordt gehouden van het gebruik dat van de beheervoorziening wordt
      gemaakt;
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel3
  - number: 3.i
    text: de hoofdlijnen van het beheer van de beheervoorziening.
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel3
  - number: '4'
    text: |-
      Onze Minister draagt zorg dat de beheervoorziening functioneert op een wijze die overeenstemt met de
      systeembeschrijving.
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister draagt zorg voor de nodige maatregelen van technische en organisatorische aard ter beveiliging van
      de in het nummerregister opgenomen gegevens tegen verlies of aantasting van deze gegevens en tegen onbevoegde
      kennisneming, opneming, wijziging, verwijdering of verstrekking van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister draagt zorg voor de nodige maatregelen van technische en organisatorische aard ter beveiliging van
      de beheervoorziening tegen onbevoegd gebruik en belemmering van de goede werking van de voorzieningen, bedoeld in
      [artikel 3, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: '5.3'
    text: 'De maatregelen, bedoeld in het eerste en het tweede lid, hebben ten minste betrekking op:'
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel5
  - number: 5.3.a
    text: de personen die werkzaam zijn voor Onze Minister;
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel5
  - number: 5.3.b
    text: de toegang tot de beheervoorziening, met inbegrip van de verbindingen met de beheervoorziening;
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel5
  - number: 5.3.c
    text: de toegang tot gebouwen en ruimten waar de beheervoorziening of onderdelen daarvan aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel5
  - number: 5.3.d
    text: de apparatuur en de programmatuur van de beheervoorziening;
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel5
  - number: 5.3.e
    text: de gegevens en het beheer van de gegevens die in de beheervoorziening zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel5
  - number: 5.3.f
    text: het geval dat de geheimhouding van de in het nummerregister opgenomen gegevens is geschaad;
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel5
  - number: 5.3.g
    text: het voorkomen van calamiteiten en het afhandelen daarvan.
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel5
  - number: '6'
    text: |-
      Het nummerregister bevat met betrekking tot de nummers die daarin zijn opgenomen de administratieve gegevens die
      zijn vermeld in [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022829
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022829
  - number: '8'
    text: |-
      Een gebruiker die is aangesloten op de beheervoorziening draagt er zorg voor dat de verbinding van zijn
      geautomatiseerde systeem met de beheervoorziening en de uitwisseling van gegevens tussen zijn geautomatiseerde
      systeem en de beheervoorziening functioneren op een wijze die overeenstemt met hetgeen daarover in de
      systeembeschrijving is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel8
  - number: '9.1'
    text: |-
      De verantwoordelijke voor een registratie als bedoeld in [artikel 3, eerste lid, onder d, van de wet][ref1] draagt
      er zorg voor dat zijn geautomatiseerde systeem ten behoeve van de uitwisseling van gegevens tussen hem en Onze
      Minister functioneert op een wijze die overeenstemt met hetgeen daarover in de systeembeschrijving is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: '9.2'
    text: |-
      Een college van burgemeester en wethouders draagt er zorg voor dat zijn geautomatiseerde systeem ten behoeve van de
      uitwisseling van gegevens tussen het college en Onze Minister in verband met de toekenning van burgerservicenummers
      functioneert op een wijze die overeenstemt met hetgeen daarover in de systeembeschrijving is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel9
  - number: '10'
    text: |-
      Onze Minister deelt desgevraagd aan een college van burgemeester en wethouders in verband met de uitvoering van
      [artikel 8 van de wet][ref1] mede of een door het college opgegeven nummer een burgerservicenummer is.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel8
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '8'
  - number: '11.1'
    text: |-
      In verband met de uitvoering van [artikel 8 van de wet][ref1] verstrekt Onze Minister aan het bestuursorgaan dat
      het burgerservicenummer toekent op verzoek de gegevens die zijn vermeld in [bijlage 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022829
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0022829
  - number: '11.2'
    text: |-
      Uit de basisregistratie personen worden aan Onze Minister de gegevens verstrekt, die hij nodig heeft in verband met
      de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel11
  - number: '12.1'
    text: |-
      In verband met de uitvoering van [artikel 8 van de wet][ref1] verstrekt Onze Minister aan het
      bestuursorgaan dat het burgerservicenummer toekent op verzoek over een Nederlands document als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 4°, van de Wet op de identificatieplicht][ref2], met behulp waarvan een
      persoon zich identificeert:


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 12.1.a
    text: |-
      de mededeling of ten aanzien van het desbetreffende document is geregistreerd dat het niet in het verkeer behoort
      te zijn, dan wel
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel12
  - number: 12.1.b
    text: een ander gegeven waaruit de geldigheid of ongeldigheid van het document kan worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel12
  - number: '12.2'
    text: |-
      Uit het basisregister reisdocumenten, bedoeld in [artikel 4a van de Paspoortwet][ref1], het register betreffende
      de afgifte van rijbewijzen, bedoeld in [artikel 126 van de Wegenverkeerswet 1994][ref2], en door Onze Minister
      van Justitie en Veiligheid worden aan Onze Minister de gegevens verstrekt, die hij nodig heeft in verband met de
      uitvoering van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '126'
  - number: '13'
    text: |-
      Onze Minister deelt op verzoek van een gebruiker in verband met de uitvoering van [artikel 14 van de wet][ref1]
      mede of het door de gebruiker opgegeven nummer een burgerservicenummer is.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel14
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '14'
  - number: '14.1'
    text: |-
      Aan een gebruiker worden op verzoek in verband met de uitvoering van
      [artikel 15, eerste lid, aanhef en onder a en b, van de wet][ref1] de gegevens verstrekt, die zijn vermeld in
      [bijlage 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0022829
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0022829
  - number: '14.2'
    text: |-
      De gegevens, bedoeld in het eerste lid, worden verstrekt door Onze Minister, indien de gebruiker bij zijn verzoek
      gebruik maakt van de beheervoorziening.
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel14
  - number: '14.3'
    text: |-
      Uit de basisregistratie personen worden aan Onze Minister de gegevens verstrekt, die hij nodig heeft in verband met
      de uitvoering van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel14
  - number: '15.1'
    text: |-
      Aan een gebruiker wordt op verzoek in verband met de uitvoering van
      [artikel 15, eerste lid, aanhef en onder c, van de wet][ref1] medegedeeld:


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel15
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '15'
  - number: 15.1.a
    text: |-
      of ten aanzien van het desbetreffende document is geregistreerd dat het niet in het verkeer behoort te zijn, dan
      wel
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel15
  - number: 15.1.b
    text: een ander gegeven waaruit de geldigheid of ongeldigheid van het document kan worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel15
  - number: '15.2'
    text: |-
      De gegevens, bedoeld in het eerste lid, onder a en b, worden verstrekt door Onze Minister, indien de gebruiker bij
      zijn verzoek gebruik maakt van de beheervoorziening.
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel15
  - number: '15.3'
    text: |-
      Uit het basisregister reisdocumenten, bedoeld in [artikel 4a van de Paspoortwet][ref1], het register betreffende
      de afgifte van rijbewijzen, bedoeld in [artikel 126 van de Wegenverkeerswet 1994][ref2], en door Onze Minister
      van Justitie en Veiligheid worden aan Onze Minister de gegevens verstrekt, die hij nodig heeft in verband met de
      uitvoering van het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '126'
  - number: '16'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de wijze waarop de inlichtingen, bedoeld in
      [artikel 18, tweede lid, van de wet][ref1], worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel18
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '18'
  - number: '17'
    text: |-
      Het onderzoek, bedoeld in [artikel 21, eerste lid, van de wet][ref1], leidt tot een oordeel over:


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel21
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '21'
  - number: 17.a
    text: |-
      de volledigheid, begrijpelijkheid en juistheid van de beschrijving van de inrichting, werking en beveiliging van de
      beheervoorziening, gelet op de geldende regelgeving;
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel17
  - number: 17.b
    text: de mate waarin de beheervoorziening functioneert overeenkomstig de onder a bedoelde beschrijving.
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel17
  - number: '20'
    text: |-
      Het Besluit burgerservicenummer treedt in werking op een bij koninklijk besluit te bepalen tijdstip, met
      uitzondering van [artikel 19, aanhef en onder 1][ref1], dat in werking treedt met ingang van de dag na de datum van
      uitgifte van het Staatsblad, waarin het Besluit burgerservicenummer wordt geplaatst. Indien het Staatsblad waarin
      dit besluit wordt geplaatst, wordt uitgegeven na 1 november 2007, treedt [artikel 19, aanhef en onder 1][ref2], in
      werking met ingang van de dag na de datum van uitgifte van het Staatsblad, waarin het besluit wordt geplaatst en
      werkt het terug tot en met 2 november 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0022829#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0022829#Artikel19
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0022829
        artikel: '19'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0022829
        artikel: '19'
        hoofdstuk: '5'
  - number: '21'
    text: 'Dit besluit wordt aangehaald als: Besluit burgerservicenummer.'
    url: https://wetten.overheid.nl/BWBR0022829/2025-11-11#Artikel21
