        artikel: '126'
  - number: '16'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de wijze waarop de inlichtingen, bedoeld in
      [artikel 18, tweede lid, van de wet][ref1], worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel18
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '18'
  - number: '17'
    text: |-
      Het onderzoek, bedoeld in [artikel 21, eerste lid, van de wet][ref1], leidt tot een oordeel over:

      a. de volledigheid, begrijpelijkheid en juistheid van de beschrijving van de inrichting, werking en beveiliging van
      de beheervoorziening, gelet op de geldende regelgeving;

      b. de mate waarin de beheervoorziening functioneert overeenkomstig de onder a bedoelde beschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel21
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '21'
  - number: '20'
    text: |-
      Het Besluit burgerservicenummer treedt in werking op een bij koninklijk besluit te bepalen tijdstip, met
      uitzondering van [artikel 19, aanhef en onder 1][ref1], dat in werking treedt met ingang van de dag na de datum van
      uitgifte van het Staatsblad, waarin het Besluit burgerservicenummer wordt geplaatst. Indien het Staatsblad waarin
      dit besluit wordt geplaatst, wordt uitgegeven na 1 november 2007, treedt [artikel 19, aanhef en onder 1][ref2], in
      werking met ingang van de dag na de datum van uitgifte van het Staatsblad, waarin het besluit wordt geplaatst en
      werkt het terug tot en met 2 november 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0022829#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0022829#Artikel19
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel20
