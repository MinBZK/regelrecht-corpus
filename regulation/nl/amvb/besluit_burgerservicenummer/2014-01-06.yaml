  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Bestuurlijke Vernieuwing en Koninkrijksrelaties van 17 oktober 2006, nr.
    2006-0000339264, CS/CZW;

    Gelet op de artikelen 3, tweede lid, 4, 6, 8, vijfde lid, 16, 18, derde lid, en 21, vierde lid, van de Wet algemene
    bepalingen burgerservicenummer en de artikelen 5, 6, eerste lid, 34, vierde lid, 35, achtste lid, 59, tweede lid,
    91, 99 en 114, vijfde lid, van de Wet gemeentelijke basisadministratie persoonsgegevens;

    De Raad van State gehoord (advies van 15 november 2006, nr. W04.06.0456/I);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 15 oktober 2007,
    nr. 2007-0000370830, STAF/CZW/WVOB;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: de [Wet algemene bepalingen burgerservicenummer][ref1];

      b. systeembeschrijving: de systeembeschrijving, bedoeld in [artikel 2][ref2];

      c. geautomatiseerde systeem van het college van burgemeester en wethouders: het geautomatiseerde systeem
      waarmee het college van burgemeester en wethouders uitvoering geeft aan het bepaalde in en krachtens
      [artikel 8, vierde en vijfde lid, van de wet][ref3];

      d. geautomatiseerde systeem van de gebruiker: het geautomatiseerde systeem waarmee de gebruiker uitvoering geeft
      aan de regels, bedoeld in [artikel 16, eerste lid, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022428
      [ref2]: https://wetten.overheid.nl/BWBR0022829#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022428#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0022428#Artikel16
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel1
