  - number: '2'
    text: Bij ministeriële regeling wordt een systeembeschrijving vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel2
  - number: '3'
    text: |-
      De systeembeschrijving bevat een beschrijving van:

      a. de hoofdlijnen van de inrichting van de beheervoorziening;

      b. de wijze waarop nummers worden aangemaakt en ter beschikking gesteld aan het college van burgemeester en
      wethouders, onderscheidenlijk Onze Minister, teneinde als burgerservicenummer te worden toegekend;

      c. de wijze waarop gegevens in het nummerregister worden opgenomen;

      d. de gevallen waarin en de wijze waarop gegevens in het nummerregister worden gewijzigd of uit het nummerregister
      worden verwijderd;

      e. de uitwisseling van gegevens, die verband houdt met de bijhouding van het nummerregister;

      f. de inrichting en werking van de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onder c, d en e, van de wet][ref1], met inbegrip van de gegevens die worden uitgewisseld
      tussen de beheervoorziening en de registraties, bedoeld in [artikel 3, eerste lid, onder d, van de wet][ref2],
      onderscheidenlijk tussen de beheervoorziening en de rijksbelastingdienst, en de wijze waarop die
      gegevensuitwisselingen plaatsvinden;

      g. de wijze waarop de beheervoorziening het geautomatiseerde systeem van een gebruiker, een college van
      burgemeester en wethouders of de rijksbelastingdienst in staat stelt, aan te sluiten op de beheervoorziening,
      alsmede van de beveiliging van de aansluiting op de beheervoorziening;

      h. de gevallen waarin en de wijze waarop aantekening wordt gehouden van het gebruik dat van de beheervoorziening
      wordt gemaakt;

      i. de hoofdlijnen van het beheer van de beheervoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '3'
  - number: '4'
    text: |-
      Onze Minister draagt zorg dat de beheervoorziening functioneert op een wijze die overeenstemt met de
      systeembeschrijving.
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister draagt zorg voor de nodige maatregelen van technische en organisatorische aard ter beveiliging
      van de in het nummerregister opgenomen gegevens tegen verlies of aantasting van deze gegevens en tegen onbevoegde
      kennisneming, opneming, wijziging, verwijdering of verstrekking van deze gegevens.

      2 Onze Minister draagt zorg voor de nodige maatregelen van technische en organisatorische aard ter beveiliging van
      de beheervoorziening tegen onbevoegd gebruik en belemmering van de goede werking van de voorzieningen, bedoeld in
      [artikel 3, eerste lid, van de wet][ref1].

      3 De maatregelen, bedoeld in het eerste en het tweede lid, hebben ten minste betrekking op:

      a. de personen die werkzaam zijn voor Onze Minister;

      b. de toegang tot de beheervoorziening, met inbegrip van de verbindingen met de beheervoorziening;

      c. de toegang tot gebouwen en ruimten waar de beheervoorziening of onderdelen daarvan aanwezig zijn;

      d. de apparatuur en de programmatuur van de beheervoorziening;

      e. de gegevens en het beheer van de gegevens die in de beheervoorziening zijn opgenomen;

      f. het geval dat de geheimhouding van de in het nummerregister opgenomen gegevens is geschaad;

      g. het voorkomen van calamiteiten en het afhandelen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: '6'
    text: |-
      Het nummerregister bevat met betrekking tot de nummers die daarin zijn opgenomen op grond van de
      [artikelen 4, eerste lid, aanhef en onder a][ref1], en [22, tweede lid, van de wet][ref2], de administratieve
      gegevens die zijn vermeld in [bijlage 1][ref3] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0022829
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0022829
  - number: '7'
    text: |-
      De rijksbelastingdienst verstrekt aan Onze Minister de inlichtingen betreffende sociaal-fiscale nummers, die van
      belang zijn voor de bijhouding van het nummerregister.
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel7
  - number: '8'
    text: |-
      Een gebruiker die is aangesloten op de beheervoorziening draagt er zorg voor dat de verbinding van zijn
      geautomatiseerde systeem met de beheervoorziening en de uitwisseling van gegevens tussen zijn geautomatiseerde
      systeem en de beheervoorziening functioneren op een wijze die overeenstemt met hetgeen daarover in de
      systeembeschrijving is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel8
  - number: '9'
    text: |-
      1 De verantwoordelijke voor een registratie als bedoeld in [artikel 3, eerste lid, onder d, van de wet][ref1]
      draagt er zorg voor dat zijn geautomatiseerde systeem ten behoeve van de uitwisseling van gegevens tussen hem
      en Onze Minister functioneert op een wijze die overeenstemt met hetgeen daarover in de systeembeschrijving is
      vastgelegd.

      2 Een college van burgemeester en wethouders draagt er zorg voor dat zijn geautomatiseerde systeem ten
      behoeve van de uitwisseling van gegevens tussen het college en Onze Minister in verband met de toekenning van
      burgerservicenummers functioneert op een wijze die overeenstemt met hetgeen daarover in de systeembeschrijving
      is vastgelegd.

      3 De rijksbelastingdienst draagt er zorg voor dat zijn geautomatiseerde systeem ten behoeve van de uitwisseling van
      gegevens tussen deze dienst en Onze Minister in verband met de bijhouding van het nummerregister en de toekenning
      van burgerservicenummers functioneert op een wijze die overeenstemt met hetgeen daarover in de systeembeschrijving
      is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: '10'
    text: |-
      Onze Minister deelt desgevraagd aan een college van burgemeester en wethouders in verband met de uitvoering van
      [artikel 8 van de wet][ref1] mede of een door het college opgegeven nummer een burgerservicenummer, een sociaal-
      fiscaalnummer dan wel geen van beide is.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel8
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '8'
  - number: '11'
    text: |-
      1 In verband met de uitvoering van [artikel 8 van de wet][ref1] verstrekt Onze Minister aan het bestuursorgaan dat
      het burgerservicenummer toekent op verzoek de gegevens die zijn vermeld in [bijlage 2][ref2], onderdelen A en B.

      2 Uit de basisregistratie personen, onderscheidenlijk door de rijksbelastingdienst, worden aan Onze Minister de
      gegevens verstrekt, die hij nodig heeft in verband met de uitvoering van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022829
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0022829
  - number: '12'
    text: |-
      1 In verband met de uitvoering van [artikel 8 van de wet][ref1] verstrekt Onze Minister aan het
      bestuursorgaan dat het burgerservicenummer toekent op verzoek over een Nederlands document als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 4°, van de Wet op de identificatieplicht][ref2], met behulp waarvan een
      persoon zich identificeert:

      a. de mededeling of ten aanzien van het desbetreffende document is geregistreerd dat het niet in het verkeer
      behoort te zijn, dan wel

      b. een ander gegeven waaruit de geldigheid of ongeldigheid van het document kan worden afgeleid.

      2 Uit het basisregister reisdocumenten, bedoeld in [artikel 4a van de Paspoortwet][ref3], het register betreffende
      de afgifte van rijbewijzen, bedoeld in [artikel 126 van de Wegenverkeerswet 1994][ref4], en door Onze Minister van
      Justitie worden aan Onze Minister de gegevens verstrekt, die hij nodig heeft in verband met de uitvoering van het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel4a
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0005212
        artikel: 4a
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '126'
  - number: '13'
    text: |-
      Onze Minister deelt op verzoek van een gebruiker in verband met de uitvoering van [artikel 14 van de wet][ref1]
      mede of het door de gebruiker opgegeven nummer een burgerservicenummer is.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel14
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '14'
  - number: '14'
    text: |-
      1 Aan een gebruiker worden op verzoek in verband met de uitvoering van
      [artikel 15, eerste lid, aanhef en onder a en b, van de wet][ref1] de gegevens verstrekt, die zijn vermeld in
      [bijlage 3][ref2].

      2 De gegevens, bedoeld in het eerste lid, worden verstrekt door Onze Minister, indien de gebruiker bij zijn verzoek
      gebruik maakt van de beheervoorziening.

      3 Uit de basisregistratie personen worden aan Onze Minister de gegevens verstrekt, die hij nodig heeft in verband
      met de uitvoering van het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0022829
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0022829
  - number: '15'
    text: |-
      1 Aan een gebruiker wordt op verzoek in verband met de uitvoering van
      [artikel 15, eerste lid, aanhef en onder c, van de wet][ref1] medegedeeld:

      a. of ten aanzien van het desbetreffende document is geregistreerd dat het niet in het verkeer behoort te zijn,
      dan wel

      b. een ander gegeven waaruit de geldigheid of ongeldigheid van het document kan worden afgeleid.

      2 De gegevens, bedoeld in het eerste lid, onder a en b, worden verstrekt door Onze Minister, indien de gebruiker
      bij zijn verzoek gebruik maakt van de beheervoorziening.

      3 Uit het basisregister reisdocumenten, bedoeld in [artikel 4a van de Paspoortwet][ref2], het register betreffende
      de afgifte van rijbewijzen, bedoeld in [artikel 126 van de Wegenverkeerswet 1994][ref3], en door Onze Minister van
      Justitie worden aan Onze Minister de gegevens verstrekt, die hij nodig heeft in verband met de uitvoering van het
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0022829/2014-01-06#Artikel15
