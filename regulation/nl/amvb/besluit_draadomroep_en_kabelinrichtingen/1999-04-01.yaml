$id: besluit_draadomroep_en_kabelinrichtingen
regulatory_layer: AMVB
publication_date: '2013-03-21'
valid_from: '1999-04-01'
bwb_id: BWBR0004451
url: https://wetten.overheid.nl/BWBR0004451/1999-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 19 oktober 1988 nr. TP/10 268, Hoofddirectie
    Telecommunicatie en Post;

    Gelet op de artikelen 15, 21, 22, 23, 25, 41 en 48 van de Wet op de telecommunicatievoorzieningen (Stb. 1988, 520);

    De Raad van State gehoord (advies van 30 november 1988, no W09.88 0582);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 9 december 1988 nr. TP/10 393,
    Hoofddirectie Telecommunicatie en Post;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel1
  - number: 1.a
    text: 'de wet: de Wet op de telecommunicatievoorzieningen;'
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel1
  - number: 1.b
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel1
  - number: 1.d
    text: 'een kabelinrichting: een inrichting als bedoeld in artikel 23 van de wet;'
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel1
  - number: 1.e
    text: 'registratie: een registratie als bedoeld in de artikelen 22*a* en 23*a* van de wet;'
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel1
  - number: 1.f
    text: |-
      college: het college genoemd in [artikel 2, eerste lid][ref1], van de Wet Onafhankelijke post- en
      telecommunicatieautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel2
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '2'
  - number: '2'
    text: |-
      Een aanvraag tot verlening, wijziging of intrekking van een machtiging voor een draadomroepinrichting of voor een
      kabelinrichting dient te geschieden op een door het college te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel2
  - number: '3'
    text: |-
      De aanvraag tot verlening of wijziging van een machtiging voor een draadomroepinrichting bevat de volgende
      gegevens:
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel3
  - number: 3.a
    text: het aantal woningen of het gebied, waarop de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel3
  - number: 3.b
    text: |-
      gegevens waaruit blijkt dat de continuïteit van de exploitatie van de draadomroepinrichting voldoende wordt
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel3
  - number: '6'
    text: |-
      De aanvraag tot intrekking van een machtiging voor een draadomroepinrichting of voor een kabelinrichting bevat
      tenminste de redenen van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel6
  - number: '9.1'
    text: |-
      Indien verschillende aanvragen tot verlening of wijziging van een machtiging voor een
      draadomroepinrichting worden ingediend, zal van de aanvragen die tenminste voldoen aan
      [artikel 4:2, eerste lid, van de Algemene wet bestuursrecht][ref1] en [artikel 3, eerste lid, onder ][ref2],
      slechts de aanvraag die het eerste is ontvangen in behandeling worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004451#Artikel3
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004451
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.2'
    text: |-
      Indien de ingevolge het eerste lid in behandeling genomen aanvraag wordt geweigerd, wordt de aanvraag die
      eerstvolgend op die eerdere aanvraag was ontvangen in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel9
  - number: '13.1'
    text: |-
      Op een aanvraag bedoeld in [artikel 2][ref1] wordt door het college beslist binnen drie maanden na ontvangst van
      de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004451#Artikel2
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004451
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '13.2'
    text: |-
      Indien niet binnen de in het eerste lid bedoelde termijn beslist kan worden, stelt het college de aanvrager daarvan
      in kennis en geeft daarbij een termijn aan die niet langer zal zijn dan zes maanden, waarbinnen een beslissing zal
      worden genomen.
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel13
  - number: '13.3'
    text: |-
      Het verloop van de termijn bedoeld in het eerste lid wordt van rechtswege opgeschort met ingang
      van de dag waarop het college toepassing geeft aan [artikel 4:7][ref1], eerste lid, dan wel
      [artikel 4:8 van de Algemene wet bestuursrecht][ref2], tot de dag waarop de aanvrager, de machtiginghouder of de
      houder van de ontheffing zijn zienswijze naar voren heeft gebracht of waarop de krachtens [artikel 4:7][ref3],
      eerste lid, dan wel [artikel 4:8 van de Algemene wet bestuursrecht][ref4] gestelde termijn is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '15.1'
    text: |-
      De door Onze Minister ingevolge artikel 48, eerste lid, van de wet te geven aanwijzingen tot het voorkomen en
      opheffen van storingen en belemmeringen kunnen betreffen:
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel15
  - number: 15.1.a
    text: |-
      de verplichting voor de houder om de nodige voorzieningen te treffen aan de draadomroepinrichting of de
      kabelinrichting en
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel15
  - number: 15.1.b
    text: de verplichting om met onmiddellijke ingang het gebruik van de inrichting te staken.
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel15
  - number: '15.2'
    text: |-
      Aan de in het eerste lid onder *a* bedoelde verplichting dient door de houder van de draadomroepinrichting of de
      kabelinrichting te worden voldaan binnen dertig dagen nadat de aanwijzing is gegeven.
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel15
  - number: '16.1'
    text: |-
      Indien een krachtens [artikel 15, eerste lid][ref1], gegeven aanwijzing tot het treffen van voorzieningen aan
      een inrichting niet binnen dertig dagen is opgevolgd, kan een toezichthouder deze voorzieningen, na voorafgaande
      waarschuwing, treffen of doen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0004451#Artikel15
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004451
        artikel: '15'
        hoofdstuk: '4'
  - number: '16.2'
    text: |-
      De bij een krachtens [artikel 15, eerste lid][ref1], gegeven aanwijzing opgelegde verplichting om het gebruik
      van een draadomroepinrichting of een kabelinrichting te staken wordt opgeheven, nadat een toezichthouder heeft
      vastgesteld, dat de in die aanwijzing bevolen voorzieningen zijn getroffen dan wel dat geen storing of belemmering
      meer wordt veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004451#Artikel15
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004451
        artikel: '15'
        hoofdstuk: '4'
  - number: '17'
    text: |-
      Aan de houder van de draadomroepinrichting of kabelinrichting die storing of belemmering veroorzaakt, kan een
      vergoeding bedoeld in artikel 41, eerste lid, onder *e* , van de wet in rekening worden gebracht die binnen een
      termijn van dertig dagen na dagtekening dient te worden voldaan.
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel17
  - number: '18'
    text: |-
      Tot toepassing van de artikelen 21, zesde lid, onder *a*, 23, vijfde lid, onder *a*, en 48, vierde lid, van de
      wet wordt slechts overgegaan nadat de machtiginghouder aan een terzake gegeven schriftelijke waarschuwing geen
      gevolg heeft, gegeven. Voorzover het voor het gevolggeven aan de waarschuwing nodig is om aan de draadomroep- of
      de kabelinrichtingen voorzieningen te treffen, wordt in de waarschuwing daartoe een termijn gesteld van tenminste
      dertig dagen.
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel18
  - number: '19'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen datum.
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel19
  - number: '20'
    text: 'Dit besluit kan worden aangehaald als: Besluit draadomroep- en kabelinrichtingen.'
    url: https://wetten.overheid.nl/BWBR0004451/1999-04-01#Artikel20
