  - number: 1.a
    text: 300 kg voor een eenzitter;
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel1
  - number: 1.b
    text: 450 kg voor een tweezitter;
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel1
  - number: 1a
    text: |-
      Dit besluit berust tevens op [artikel 1.5 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
  - number: 1b
    text: |-
      De aanvraag voor de afgifte van een bewijs van luchtwaardigheid, erkenning of hieraan gerelateerde certificaten
      of verklaringen als bedoeld in hetgeen bij of krachtens de basisverordening is bepaald wordt ingediend bij Onze
      Minister, tenzij bij of krachtens de basisverordening of de wet hiertoe een andere instantie is aangewezen.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel1b
  - number: '2.1'
    text: |-
      Met uitzondering van het tweede, vierde en zesde lid, is dit besluit uitsluitend van toepassing op luchtvaartuigen,
      voortstuwingsinrichtingen, propellers, onderdelen en erkenningen bestemd voor de burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: '2.2'
    text: |-
      Dit besluit en [hoofdstuk 3 van de wet][ref1] zijn niet van toepassing op de volgende soorten luchtvaartuigen:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '3'
  - number: 2.2.a
    text: modelluchtvaartuigen, waarvan de totale massa ten hoogste 25 kilogram bedraagt,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.2.b
    text: |-
      ballonnen, die op zeeniveau in de internationale standaardatmosfeer in geheel gevulde toestand een diameter van ten
      hoogste 2.00 meter of een inhoud van ten hoogste 4.00 kubieke meter hebben, alsmede aan elkaar gekoppelde ballonnen
      waarvan de gezamenlijke diameter en inhoud deze waarden niet te boven gaan,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.2.c
    text: |-
      toestellen, zwaarder dan lucht en niet voorzien van een voortstuwingsinrichting, die door middel van een ankerkabel
      of lijn zijn verbonden met het aardoppervlak (kabelvlieger),
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.2.d
    text: |-
      luchtschepen, die op zeeniveau in de internationale standaardatmosfeer in geheel gevulde toestand een grootste
      afmeting hebben van maximaal 5.00 meter of een inhoud van ten hoogste 4.00 kubieke meter,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.2.e
    text: |-
      toestellen, zwaarder dan lucht in de vorm van een scherm met harnas, die met een lijn of lijnen zijn bevestigd aan
      een voertuig of vaartuig, waardoor ze in de lucht kunnen worden gehouden (valschermzweeftoestel),
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.2.f
    text: ballonnen, die tijdens het in de lucht houden permanent zijn bevestigd aan het aardoppervlak (kabelballon),
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.2.g
    text: |-
      valschermen, zijnde schermen die dienen om de daalsnelheid van personen zodanig te beperken dat deze veilig het
      aardoppervlak kunnen bereiken,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.2.h
    text: zeilvliegtuigen met een totale massa zonder piloot van minder dan 70 kg,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.2.i
    text: schermzweeftoestellen met een totale massa zonder piloot van minder dan 70 kg,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.2.j
    text: amateurbouwluchtvaartuigen ingeschreven in andere lidstaten van de European Civil Aviation Conference.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: '2.3'
    text: |-
      [Paragraaf 3.2.3 van de wet][ref1] omtrent bewijzen van bevoegdheid voor onderhoud is niet van toepassing op de
      volgende soorten luchtvaartuigen:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Paragraaf3.2.3
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        paragraaf: 3.2.3
  - number: 2.3.a
    text: amateurbouwluchtvaartuigen,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.3.b
    text: MLA's,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.3.c
    text: MLH’s,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.3.d
    text: gemotoriseerde schermvliegtuigen;
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.3.e
    text: lichte gyrokopter,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.3.f
    text: paramotortrikes.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: '2.4'
    text: |-
      Bij regeling van Onze Minister dan wel Onze Minister van Defensie kunnen voorschriften en beperkingen worden
      opgenomen ten aanzien van de in het tweede en derde lid genoemde luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: '2.5'
    text: |-
      [Artikel 3.5 van de wet][ref1] is niet van toepassing op luchtvaartuigen als bedoeld in
      [artikel 3.6 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '3'
  - number: '2.6'
    text: |-
      Het verbod, bedoeld in [artikel 3.8, eerste lid, onder b, van de wet][ref1], is niet van toepassing op militaire
      luchtvaartuigen die hetzij automatisch, hetzij op afstand worden bestuurd, en die worden gebruikt als doel voor
      schietoefeningen dan wel voor het slepen van een doel voor schietoefeningen mits wordt voldaan aan het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 2.6.a
    text: |-
      boven Nederland wordt met het luchtvaartuig uitsluitend gevlogen in een gebied waarin het burgerluchtverkeer is
      verboden of beperkt,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.6.b
    text: |-
      met het luchtvaartuig wordt uitsluitend gevlogen indien de door Onze Minister van Defensie vastgestelde instructies
      in acht worden genomen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.6.b.1°
    text: een veilige lancering,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.6.b.2°
    text: het voor en na elke vlucht uitvoeren van een functionele en een technische inspectie,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.6.b.3°
    text: het onderhoud van het luchtvaartuig,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.6.b.4°
    text: het per parachute op een veilige wijze en binnen het aangewezen landingsgebied doen landen van het luchtvaartuig,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.6.c
    text: |-
      het luchtvaartuig is uitgerust met een zodanige veiligheidsvoorziening dat bij verstoring van of bij het verloren
      gaan van het radiocontact tussen luchtvaartuig en bedieningsstation, de vlucht van het luchtvaartuig wordt
      afgebroken en de landing per parachute wordt ingezet,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.6.d
    text: |-
      het luchtvaartuig is uitgerust met een zodanige veiligheidsvoorziening dat bij het uitvallen van de besturing als
      gevolg van stroomstoring de landing per parachute wordt ingezet.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: '2.7'
    text: 'Van overeenkomstige toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, zijn:'
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.7.a
    text: de basisverordening, voor zover het Hoofdstuk III, Afdeling I en Deel II betreft,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.7.b
    text: verordening (EU) nr. 1321/2014, en
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: 2.7.c
    text: verordening (EU) nr. 748/2012,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel2
  - number: '3.1'
    text: 'In het Nederlandse register voor burgerluchtvaartuigen worden luchtvaartuigen ingeschreven:'
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel3
  - number: 3.1.a
    text: die zijn vervaardigd in de openbare lichamen Bonaire, Sint Eustatius en Saba, en die niet zijn uitgevoerd, of
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel3
  - number: 3.1.b
    text: |-
      die zijn vervaardigd in een lidstaat van de Europese Unie of in een van de Staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte, en die niet zijn uitgevoerd, of ten aanzien waarvan, bij
      het in het vrije verkeer brengen, de vereiste douaneformaliteiten zijn vervuld, en
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel3
  - number: 3.1.c
    text: |-
      ten aanzien waarvan het beheer met het oog op een blijvende luchtwaardigheid, door de aanvrager, dan wel door diens
      vertegenwoordiger vanuit een vestiging in Nederland wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel3
  - number: '3.2'
    text: 'De aanvrager, die krachtens geldige titel een luchtvaartuig onder zich heeft, is:'
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel3
  - number: 3.2.a
    text: |-
      een onderdaan van een lidstaat van de Europese Unie of van een van de Staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel3
  - number: 3.2.b
    text: |-
      een ingezetene van een lidstaat van de Europese Unie of van een van de Staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte, niet zijnde een onderdaan van een lidstaat van de Europese Unie of van
      een van de Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, of
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel3
  - number: 3.2.c
    text: |-
      een rechtspersoon die in overeenstemming met de wetgeving van een lidstaat van de Europese Unie of van een van de
      Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte is opgericht en waarvan de
      statutaire zetel of feitelijke zetel, zich bevindt in een lidstaat van de Europese Unie of van een van de Staten
      die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte dan wel in de openbare lichamen
      Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister van Financiën kan ontheffing verlenen van de in het eerste lid, onder b, bedoelde
      douaneformaliteiten. Aan de ontheffing kunnen voorschriften worden verbonden. Bij het niet naleven van een aan de
      ontheffing verbonden voorschrift kan Onze Minister van Financiën de ontheffing intrekken.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel3
  - number: '3.4'
    text: |-
      Indien de aanvrager geen woonplaats heeft in Nederland dan wel, indien het om een rechtspersoon gaat, de statutaire
      zetel, hoofdbestuur of hoofdvestiging niet in Nederland is gevestigd, dient het beheer, bedoeld in het eerste lid,
      onder c, te worden uitgevoerd door een vertegenwoordiger van de aanvrager met woonplaats in Nederland, dan wel,
      door een nevenvestiging van de rechtspersoon in Nederland.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel3
  - number: '3.5'
    text: |-
      Indien de aanvrager het in het eerste lid, onder c, bedoelde beheer heeft uitbesteed, rusten de verplichtingen
      terzake van de blijvende luchtwaardigheid op de in het vierde lid bedoelde vertegenwoordiger dan wel op de
      nevenvestiging als rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel3
  - number: '3.6'
    text: |-
      De aanvrager is gehouden aan de uitbesteding, bedoeld in het vijfde lid, het op schrift gestelde voorschrift te
      verbinden dat hij te allen tijde opdrachten kan verstrekken in verband met de naleving van de hem krachtens dit
      besluit terzake van de blijvende luchtwaardigheid opgedragen verplichtingen.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel3
  - number: '3.7'
    text: |-
      Indien de aanvrager, bedoeld in het tweede lid, niet tevens de eigenaar is van het luchtvaartuig, schrijft Onze
      Minister het luchtvaartuig in het register voor burgerluchtvaartuigen in, tenzij de eigenaar afkomstig is uit een
      land waarmee Nederland de diplomatieke banden heeft verbroken.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel3
  - number: '4'
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel4
  - number: 4.a
    text: |-
      de procedure van aanvraag tot afgifte, wijziging en doorhaling van een inschrijving in het register voor
      burgerluchtvaartuigen, alsmede de gegevens die bij deze procedure worden verstrekt,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel4
  - number: 4.b
    text: de vernieuwing van het inschrijvingsbewijs.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel4
  - number: '5'
    text: |-
      Onze Minister kan op aanvraag een aanvullend type-certificaat afgeven voor een luchtvaartuig dat volledig wordt
      ingezet voor niet-militaire staatsactiviteiten of diensten of een luchtvaartuig als bedoeld in de onderdelen a, b
      en d van Bijlage I bij de basisverordening.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel5
  - number: '6'
    text: 'Bij ministeriële regeling worden regels gesteld betreffende:'
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel6
  - number: 6.a
    text: de aanvraag, de aanvrager en de afgifte van een aanvullend type-certificaat en van de wijziging daarvan,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel6
  - number: 6.b
    text: de wijze waarop de aanvrager aantoont dat hij aan alle op hem van toepassing zijnde eisen voldoet, en
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel6
  - number: 6.c
    text: |-
      de overdracht alsmede de procedure van aanvraag om afgifte, wijziging, schorsing en intrekking van een aanvullend
      type-certificaat.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel6
  - number: '7.1'
    text: 'Onze Minister kan op aanvraag de volgende bewijzen van luchtwaardigheid afgeven:'
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel7
  - number: 7.1.a
    text: een ICAO-standaard-BvL,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel7
  - number: 7.1.b
    text: een speciaal-BvL of
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel7
  - number: 7.1.c
    text: een export-BvL.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel7
  - number: '7.2'
    text: Een bewijs als bedoeld in het eerste lid onder a is geldig voor het internationaal uitvoeren van vluchten.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel7
  - number: '7.3'
    text: |-
      Een bewijs als bedoeld in het eerste lid, onder b, is slechts geldig voor het uitvoeren van vluchten
      binnen het vluchtinformatiegebied Amsterdam dan wel de delen van het vluchtinformatiegebied Curaçao en het
      vluchtinformatiegebied San Juan die zich boven het territoir van de openbare lichamen Bonaire, Sint Eustatius
      en Saba bevinden dan wel die delen waarvoor Onze Minister de verantwoordelijkheid voor het verzorgen van
      luchtverkeersdiensten heeft aanvaard.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel7
  - number: '7.4'
    text: |-
      Een bewijs als bedoeld in het eerste lid, onder c, houdt, in combinatie met een bewijs van luchtwaardigheid als
      bedoeld in het eerste lid, onder a, of een bewijs van luchtwaardigheid als bedoeld in hetgeen bij of krachtens de
      basisverordening is bepaald, een toestemming in tot het uitvoeren van vluchten.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel7
  - number: '7.5'
    text: |-
      De voorschriften of beperkingen verbonden aan een bewijs van luchtwaardigheid als bedoeld in het eerste lid worden
      neergelegd op dat bewijs van luchtwaardigheid of in een bijlage bij dat bewijs van luchtwaardigheid.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister geeft op aanvraag van de houder van een luchtvaartuig dat volledig wordt ingezet voor niet-
      militaire staatsactiviteiten of diensten, dan wel een luchtvaartuig als bedoeld in onderdeel b van bijlage I bij de
      basisverordening, of zijn vertegenwoordiger, een ICAO-standaard-BvL af indien het luchtvaartuig naar zijn oordeel
      voldoet aan een ontwerp dat is goedgekeurd door middel van:
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel8
  - number: 8.1.a
    text: een door EASA uitgegeven type-certificaat,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel8
  - number: 8.1.b
    text: door Onze minister of de EASA uitgegeven aanvullende type-certificaten,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel8
  - number: 8.1.c
    text: door Onze minister of de EASA uitgegeven luchtwaardigheidsaanwijzingen, en
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel8
  - number: 8.1.d
    text: door Onze minister of de EASA goedgekeurde wijzigingen en reparaties,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister geeft op aanvraag van de houder van een luchtvaartuig als bedoeld in de onderdelen a en d van bijlage
      I bij de basisverordening, of zijn vertegenwoordiger, een ICAO-standaard-BvL af indien:
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel8
  - number: 8.2.a
    text: |-
      het luchtvaartuig naar zijn oordeel voldoet aan een ontwerp dat is goedgekeurd conform ICAO Annex 8 door middel van
      een civiel goedgekeurd type-ontwerp van de staat van ontwerp, mits met die staat een overeenkomst is afgesloten,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel8
  - number: 8.2.b
    text: |-
      de staat van ontwerp bevestigt verplichte instructies betreffende de blijvende luchtwaardigheidsaanwijzingen
      conform ICAO Annex 8 uit te geven, en
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel8
  - number: 8.2.c
    text: het luchtvaartuig veilig gebruikt kan worden.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel8
  - number: '8.3'
    text: Bij ministeriële regeling worden nadere regels gesteld omtrent het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel8
  - number: '9'
    text: |-
      Onze Minister geeft op aanvraag van de houder van een luchtvaartuig een speciaal-BvL af indien het luchtvaartuig
      in staat is om op veilige wijze vluchten uit te voeren en voldoet aan bij ministeriële regeling daartoe te stellen
      eisen.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel9
  - number: '10.1'
    text: 'Onze Minister geeft op aanvraag van de houder van een nieuw luchtvaartuig een export-BvL af:'
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: 10.1.a
    text: |-
      op grond van een internationale overeenkomst of een besluit van een volkenrechtelijke organisatie aangaande de
      wederzijdse erkenning van af te geven export-BvL’s, of
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: 10.1.b
    text: |-
      indien de staat van invoer met betrekking tot het desbetreffende luchtvaartuig heeft aangegeven in te stemmen met
      de erkenning van een daartoe af te geven export-BvL, en
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: 10.1.b.1°
    text: |-
      het luchtvaartuig voldoet aan een type-ontwerp dat acceptabel is voor de bevoegde autoriteit van de staat van
      invoer,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: 10.1.b.2°
    text: |-
      het luchtvaartuig voldoet aan de aanvullende eisen voor invoer die de bevoegde autoriteit van de staat van invoer
      stelt,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: 10.1.b.3°
    text: |-
      het luchtvaartuig is geproduceerd door een houder van een POA, dan wel door degene die een akkoordverklaring heeft
      verkregen,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: 10.1.b.4°
    text: de bij ministeriële regeling vereiste documentatie is overgelegd,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: 10.1.b.5°
    text: |-
      het luchtvaartuig is geïdentificeerd overeenkomstig Part 21, section A, subpart Q, van verordening (EU) nr.
      748/2012,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: 10.1.b.6°
    text: |-
      Het luchtvaartuig zich op een zodanige plaats bevindt, dat Onze Minister kan vaststellen dat aan de onder 1° tot en
      met 5°, gestelde eisen is voldaan.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: '10.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op gebruikte luchtvaartuigen, met uitzondering van onderdeel b,
      onder 3°, en met dien verstande dat de houder beschikt over een ICAO-standaard-BvL, een EASA-standaard-BvL of een
      EASA-beperkt-BvL, dan wel het luchtvaartuig in aanmerking komt voor een van deze bewijzen.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: '10.3'
    text: |-
      Aan de eisen in het eerste lid, onderdeel b, onder 1° tot en met 4° en het tweede lid, behoeft niet te worden
      voldaan, indien de bevoegde autoriteit van de staat van invoer daarmee instemt.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: '10.4'
    text: |-
      In het geval beschreven in het derde lid, worden afwijkingen van het product ten opzichte van het type-certificaat
      op het exportbewijs als uitzonderingen opgenomen.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: '10.5'
    text: 'De houder van een export-BvL is verplicht:'
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: 10.5.a
    text: |-
      aan de autoriteit van de staat van invoer alle informatie te verschaffen ten behoeve van het goed functioneren van
      het luchtvaartuig, alsmede de assemblagegegevens, indien een luchtvaartuig niet geassembleerd wordt ingevoerd,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: 10.5.b
    text: het niet geassembleerde luchtvaartuig goed te verpakken tijdens vervoer of opslag, en
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: 10.5.c
    text: |-
      tijdelijke installaties aan het luchtvaartuig ten behoeve van het vervoer na aankomst in de staat van invoer te
      verwijderen.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel10
  - number: '11.1'
    text: Een ICAO-standaard-BvL wordt afgegeven of verlengd voor een periode van ten hoogste 1 jaar.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel11
  - number: '11.2'
    text: Een speciaal-BvL wordt afgegeven of verlengd voor een periode van ten hoogste 1 jaar.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel11
  - number: '11.3'
    text: Een export-BvL wordt eenmalig afgegeven.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel11
  - number: '11.4'
    text: |-
      In afwijking van het eerste lid wordt voor een luchtvaartuig dat volledig wordt ingezet voor niet-militaire
      staatsactiviteiten of diensten een ICAO-standaard-BvL afgegeven of verlengd voor ten hoogste 3 jaar.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel11
  - number: '11.5'
    text: |-
      In afwijking van het tweede lid wordt voor een gemotoriseerd schermvliegtuig of paramotortrike met een leeggewicht,
      inclusief reddingsmiddelen, van ten hoogste 120 kg een speciaal-BvL afgegeven voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel11
  - number: '12.1'
    text: |-
      De houder van een luchtvaartuig voorzien van een ICAO-standaard-BvL laat dat luchtvaartuig onderhouden
      overeenkomstig verordening (EU) nr. 1321/2014, Part M, door de houder van een erkenning inzake onderhoud als
      bedoeld in [artikel 17, eerste lid][ref1] dan wel door de houder van een bewijs van bevoegdheid inzake onderhoud
      ingevolge [artikel 3.30 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '17'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '3'
  - number: '12.2'
    text: |-
      Onderhoud van luchtvaartuigen met een speciaal-BvL geschiedt overeenkomstig de bij ministeriële regeling te stellen
      eisen.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel12
  - number: '13'
    text: 'Bij ministeriële regeling worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel13
  - number: 13.a
    text: de aanvraag van een bewijs van luchtwaardigheid,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel13
  - number: 13.b
    text: de wijziging, overdracht, verlenging en vernieuwing van een bewijs van luchtwaardigheid,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel13
  - number: 13.c
    text: de procedure van aanvraag, afgifte, wijziging, schorsing en intrekking van een bewijs van luchtwaardigheid, en
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel13
  - number: 13.d
    text: de wijze waarop de houder van een luchtvaartuig kan aantonen dat het noodzakelijke onderhoud heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel13
  - number: '14.1'
    text: Onze Minister kan op aanvraag aan de houder van een luchtvaartuig een geluidscertificaat afgeven.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister vermeldt op een geluidscertificaat de gegevens die zijn vastgelegd ten behoeve van de afgifte van een
      type-certificaat en de eventueel van toepassing zijnde aanvullende type-certificaten.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel14
  - number: '14.3'
    text: |-
      Indien de in het tweede lid bedoelde gegevens niet beschikbaar zijn, kan Onze Minister op een geluidscertificaat
      vermelden:
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel14
  - number: 14.3.a
    text: de gegevens die zijn vastgelegd bij een goedgekeurd type-ontwerp,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel14
  - number: 14.3.b
    text: |-
      de gegevens van een door Onze Minister met betrekking tot het desbetreffende luchtvaartuig geaccepteerd
      meetrapport,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel14
  - number: 14.3.c
    text: de gegevens op basis van een door Onze Minister geaccepteerde conservatieve schatting van de geluidsproductie,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel14
  - number: 14.3.d
    text: de limietwaarden van de geluidsproductie.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel14
  - number: '15.1'
    text: |-
      Op aanvraag van de houder van een luchtvaartuig waarvoor geen geluidseisen gelden kan Onze Minister voor het
      geluid relevante gegevens op een geluidsverklaring vermelden. Hiertoe legt de aanvrager met betrekking tot dat
      luchtvaartuig geluidsniveaus vast aan de hand van een naar het oordeel van Onze Minister adequate en betrouwbare
      meetmethode. De aanvrager verstrekt de gegevens over de geluidsniveaus aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel15
  - number: '15.2'
    text: |-
      Onze Minister kan op aanvraag van de houder van een luchtvaartuig waarvoor geluidseisen gelden de voor het
      geluid relevante gegevens op een aanvullende geluidsverklaring vermelden. Hiertoe worden met betrekking tot dat
      luchtvaartuig geluidsniveaus vastgelegd en overgelegd aan de hand van een naar het oordeel van Onze Minister
      adequate en betrouwbare meetmethode.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel15
  - number: '16'
    text: 'Bij ministeriële regeling worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel16
  - number: 16.a
    text: |-
      de procedure van aanvraag van een (voorlopig) geluidscertificaat, een (voorlopige) geluidsverklaring of een
      (voorlopige) aanvullende geluidsverklaring,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel16
  - number: 16.b
    text: |-
      de procedure van wijziging, overdracht, schorsing, intrekking, verlenging en vernieuwing van een (voorlopig)
      geluidscertificaat, een (voorlopige) geluidsverklaring of een (voorlopige) aanvullende geluidsverklaring.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister kan een erkenning verlenen voor werkzaamheden die verband houden met de luchtwaardigheid en de
      geluidsproductie van producten of onderdelen, met uitzondering van werkzaamheden die reeds onder een van de
      erkenningen als bedoeld in verordening (EU) nr. 1321/2014 en verordening (EU) nr. 748/2012 vallen.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister kan in bijzondere gevallen waarin naar zijn oordeel een POA niet toepasselijk is, een
      akkoordverklaring afgeven.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister verleent op aanvraag een erkenning als bedoeld in [artikel 17, eerste lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel17
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '17'
        hoofdstuk: '6'
  - number: 18.1.a
    text: |-
      de aanvrager beschikt over een organisatie met inbegrip van een kwaliteitssysteem dat waarborgt dat de resultaten
      van de werkzaamheden aan de van toepassing zijnde eisen voldoen en niet tot een onveilige situatie kunnen leiden,
      en
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel18
  - number: 18.1.b
    text: de aanvrager een handboek heeft waarin de organisatie wordt omschreven.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel18
  - number: '18.2'
    text: Bij ministeriële regeling worden nadere regels gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel18
  - number: '18.3'
    text: |-
      Een erkenning als bedoeld in [artikel 17, eerste lid][ref1], geldt voor de in de erkenning genoemde werkzaamheden,
      producten dan wel categorieën onderdelen, waarvoor de houder de in [artikel 19, eerste lid][ref2], bedoelde
      bevoegdheden heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0023922#Artikel19
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '17'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0023922
        artikel: '19'
        hoofdstuk: '6'
  - number: '19.1'
    text: |-
      De houder van een erkenning als bedoeld in [artikel 17, eerste lid][ref1], is bevoegd tot:


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel17
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '17'
        hoofdstuk: '6'
  - number: 19.1.a
    text: de werkzaamheden die zijn opgenomen in de erkenning, en
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel19
  - number: 19.1.b
    text: de afgifte van een certificaat ten aanzien van de werkzaamheden als bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel19
  - number: '19.2'
    text: |-
      De houder van een erkenning als bedoeld in [artikel 17, eerste lid][ref1], is verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel17
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '17'
        hoofdstuk: '6'
  - number: 19.2.a
    text: |-
      het in [artikel 18, eerste lid, onder b][ref1], bedoelde handboek te gebruiken en actueel te houden,


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel18
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '18'
        hoofdstuk: '6'
  - number: 19.2.b
    text: |-
      voorafgaande aan de afgifte van een certificaat bedoeld in het eerste lid, onder b, vast te stellen dat de
      resultaten van de werkzaamheden voldoen aan de van toepassing zijnde eisen, de werkzaamheden naar behoren zijn
      uitgevoerd en de resultaten niet tot onveilige situaties kunnen leiden,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel19
  - number: 19.2.c
    text: |-
      gegevens die nodig zijn als bewijs dat aan alle vereisten is voldaan voor de afgifte van een erkenning als bedoeld
      in [artikel 17, eerste lid][ref1], te bewaren volgens bij ministeriële regeling te stellen regels en op een bij die
      regeling vastgestelde wijze aan Onze Minister ter beschikking te stellen,


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel17
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '17'
        hoofdstuk: '6'
  - number: 19.2.d
    text: |-
      in het geval van een ontwerperkenning de ontwerpen indien nodig aan te passen aan de van toepassing zijnde
      luchtwaardigheids- en milieueisen,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel19
  - number: 19.2.e
    text: |-
      in het geval van een ontwerperkenning alle proefprogramma's of proeven in het kader van toezicht tijdig aan Onze
      Minister ter beschikking te stellen,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel19
  - number: 19.2.f
    text: |-
      in het geval van een onderhoudserkenning een zodanige staat van een product of onderdeel, die het luchtvaartuig
      ernstig in gevaar kan brengen, te melden aan de houder van het type-certificaat, dan wel aan de houder van het
      goedgekeurde ontwerp, de houder van het luchtvaartuig en Onze Minister,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel19
  - number: 19.2.g
    text: |-
      te voldoen aan bij ministeriële regeling te stellen eisen ten aanzien van veranderingen die de houder van de
      erkenning betreffen.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel19
  - number: '20'
    text: 'Bij ministeriële regeling worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel20
  - number: 20.a
    text: de aanvraag, de wijziging en de verlenging van een erkenning of een akkoordverklaring,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel20
  - number: 20.b
    text: |-
      de procedure van aanvraag, verlenging, wijziging, schorsing of intrekking van een erkenning of een
      akkoordverklaring,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel20
  - number: 20.c
    text: de aanvraag van een bekrachtiging van een verklaring van conformiteit,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel20
  - number: 20.d
    text: de procedure van aanvraag van een bekrachtiging van een verklaring van conformiteit,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel20
  - number: 20.e
    text: de wijze waarop de aanvrager aantoont dat hij aan de gestelde eisen voldoet,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel20
  - number: 20.f
    text: |-
      het model en de uitvoering van een certificaat als bedoeld in [artikel 19, eerste lid, onder b][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel19
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '19'
        hoofdstuk: '6'
  - number: 20.g
    text: |-
      de melding aan Onze Minister als bedoeld in [artikel 19, tweede lid, onder f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel19
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '19'
        hoofdstuk: '6'
  - number: '21'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot startinrichtingen voor luchtvaartuigen
      zonder voortstuwingsinrichtingen.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel21
  - number: '22.1'
    text: 'Een vergoeding is verschuldigd voor:'
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel22
  - number: 22.1.a
    text: de afgifte en vernieuwing van een bewijs van inschrijving,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel22
  - number: 22.1.b
    text: de behandeling van de aanvraag om wijziging dan wel doorhaling van de inschrijving,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel22
  - number: 22.1.c
    text: |-
      de behandeling van de aanvraag om afgifte, wijziging of overdracht van een aanvullend type certificaat, een
      ontwerpgoedkeuring van een onderdeel of een bewijs van luchtwaardigheid, dan wel de vernieuwing of verlenging van
      een bewijs van luchtwaardigheid of de aanvraag voor een ontheffing,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel22
  - number: 22.1.d
    text: |-
      de behandeling van de aanvraag om afgifte, wijziging of vernieuwing van een geluidscertificaat, een
      geluidsverklaring of een aanvullende geluidsverklaring,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel22
  - number: 22.1.e
    text: de behandeling van de aanvraag om afgifte, verlenging, vernieuwing of wijziging van een erkenning,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel22
  - number: 22.1.f
    text: de behandeling van de aanvraag om goedkeuring of wijziging van een onderhoudsprogramma,
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel22
  - number: 22.1.g
    text: |-
      de kosten voor handelingen in het kader van de uitvoering van internationale overeenkomsten gesloten door de
      Europese Unie en internationale overeenkomsten gesloten door Nederland met derde landen, voor zover de wet of dit
      besluit hier niet reeds in voorziet.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel22
  - number: '22.2'
    text: Bij ministeriële regeling wordt de hoogte van de vergoedingen, bedoeld in het eerste lid, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel22
  - number: '22.3'
    text: Bij ministeriële regeling wordt de wijze van betaling van de verschuldigde vergoeding vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel22
  - number: '23.1'
    text: |-
      De beslissing op een aanvraag voor de toepassing van de handelingen in [artikel 22, eerste lid][ref1], met
      uitzondering van een aanvraag die betrekking heeft op een aanvullend type-certificaat en een ontwerpgoedkeuring,
      wordt slechts genomen nadat is gebleken dat de verschuldigde vergoeding is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel22
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '22'
        hoofdstuk: '7'
  - number: '23.2'
    text: |-
      De beslissing op een aanvraag voor de toepassing van de handelingen in [artikel 22, eerste lid, onder c][ref1],
      voor zover die betrekking heeft op aanvullende type-certificaten en een ontwerpgoedkeuring, wordt slechts genomen
      nadat is gebleken dat alle voorafgaande facturen ten aanzien van de gevraagde handeling, verstuurd tot 30 dagen
      voorafgaande aan de datum van de beslissing, zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel22
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '22'
        hoofdstuk: '7'
  - number: '23.3'
    text: |-
      Wanneer na de betaling van de verschuldigde vergoeding degene, die een aanvraag als bedoeld in het eerste lid,
      heeft ingediend, verzoekt die aanvraag als niet ingediend te beschouwen, kan hem op zijn verzoek een, nader door
      Onze Minister in elk geval afzonderlijk te bepalen, bedrag worden terugbetaald.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel23
  - number: '24'
    text: |-
      Onze Minister kan, met inachtneming van hoofdstuk II, deel 4 van gedelegeerde verordening (EU) nr. 2019/945, op
      aanvraag besluiten conformiteitsbeoordelingsinstanties aan te melden.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel24
  - number: '25'
