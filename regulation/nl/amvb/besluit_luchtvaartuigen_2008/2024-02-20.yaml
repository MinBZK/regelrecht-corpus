preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze minister van Verkeer en Waterstaat van 4 januari 2008, nr. CEND/HDJZ-2007/1644,
    Hoofddirectie Juridische Zaken, gedaan in overeenstemming met de staatssecretaris van Defensie;

    Gelet op

    – verordening (EG) nr. 1592/2002 van het Europees Parlement en de Raad van de Europese Gemeenschappen van 15 juli
    2002 tot vaststelling van gemeenschappelijke regels op het gebied van burgerluchtvaart en tot oprichting van een
    Europees Agentschap voor de veiligheid van de luchtvaart (PbEG L 240),

    – verordening (EG) nr. 1702/2003 van de Commissie van de Europese Gemeenschappen van 24 september 2003 tot
    vaststelling van uitvoeringsvoorschriften inzake de luchtwaardigheid en milieucertificering van luchtvaartuigen
    en aanverwante producten, onderdelen en uitrustingsstukken, alsmede voor de certificering van ontwerp- en
    productieorganisaties (PbEU L 243),

    – verordening (EG) nr. 2042/2003 van de Commissie van de Europese Gemeenschappen van 20 november 2003 betreffende
    de permanente luchtwaardigheid van luchtvaartuigen en luchtvaartproducten, -onderdelen en uitrustingsstukken, en
    betreffende de goedkeuring van bij voornoemde taken betrokken organisaties en personen (PbEU L 315) en

    – de artikelen 1.2, tweede en derde lid, 3.3, tweede lid, 3.7, 3.13, eerste en derde lid, 3.15, eerste lid, 3.19a,
    derde lid, 3.22, eerste lid, onder b, 3.23, 3.25, eerste tot en met derde lid, 3.26, eerste en derde lid, 3.29 en
    3.31 van de Wet luchtvaart;

    De Raad van State gehoord (advies van 31 januari 2008, nr. W09.08.00009/IV);

    Gezien het nader rapport van Onze minister van Verkeer en Waterstaat van 8 mei 2008, nr. CEND/HDJZ/2008-437,
    Hoofddirectie Juridische Zaken, uitgebracht in overeenstemming met de staatssecretaris van Defensie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en in de op dit besluit gebaseerde regelingen wordt verstaan onder: *aanvullende geluidsverklaring:*
      verklaring als bedoeld in [artikel 3.19c, tweede lid, van de wet][ref1]; *aanvullend type-certificaat:* type-
      certificaat van een aanpassing van het orginele ontwerp zoals vastgelegd in het orginele type-certificaat van het
      ongewijzigd product; *akkoordverklaring:* door Onze Minister afgegeven verklaring waarmee hij akkoord gaat met het
      aantonen van de conformiteit van individuele producten, onderdelen en uitrustingsstukken overeenkomstig verordening
      (EU) nr. 748/2012, Part 21, section A, subpart F; *ARC:* certificaat van beoordeling van de luchtwaardigheid
      dat periodiek wordt afgegeven door Onze minister of een daartoe erkende managementorganisatie voor permanente
      luchtwaardigheid, dat deel uitmaakt van een geldig BvL (EASA Form 15, Airworthiness Review Certificate); *blijvende
      luchtwaardigheid:* alle processen waarmee gewaarborgd wordt dat het luchtvaartuig gedurende de gehele operationele
      levensduur voldoet aan de geldende normen voor luchtwaardigheid en zich in een toestand van veilige exploitatie
      bevindt; *BvL:* Bewijs van Luchtwaardigheid; *certificaat*, als bedoeld in [artikel 19, eerste lid, onder b][ref2]:
      certificaat ten aanzien van werkzaamheden die zijn opgenomen in de erkenning en die verband houden met de
      luchtwaardigheid en geluidsproductie van producten of onderdelen; *EASA-beperkt-BvL:* bewijs van luchtwaardigheid
      voor een EASA-luchtvaartuig dat wel aan de eisen betreffende luchtwaardigheid volgens het ICAO-verdrag voldoet,
      maar niet aan de essentiële eisen inzake luchtwaardigheid zoals opgenomen in bijlage II en bijlage III bij de
      basisverordening; *EASA-standaard-BvL:* bewijs van luchtwaardigheid voor een EASA- luchtvaartuig dat zowel aan de
      eisen betreffende luchtwaardigheid volgens het ICAO-verdrag als aan de essentiële eisen inzake luchtwaardigheid
      zoals opgenomen in bijlage II en bijlage III bij de basisverordening voldoet; *export-BvL:* bewijs waarin de
      status van het luchtvaartuig betreffende de luchtwaardigheid wordt aangegeven, getoetst volgens de eisen van
      het importerende land; *gedelegeerde verordening (EU) nr. 2019/945:* gedelegeerde verordening (EU) nr. 2019/945
      van de Commissie van 12 maart 2019 inzake onbemande luchtvaartuigsystemen en uit derde landen afkomstige
      exploitanten van onbemande luchtvaartuigsystemen (PbEU 2019, L 152); *geluidscertificaat:* certificaat als
      bedoeld in [artikel 3.19a, eerste lid, van de wet][ref3]; *geluidsverklaring:* verklaring als bedoeld in
      [artikel 3.19c, eerste lid, van de wet][ref4]; *gemotoriseerd schermvliegtuig:* schermvliegtuig, zijnde een
      zweeftoestel zonder starre hoofdstructuur dat kan worden gedragen en slechts kan worden gestart en geland
      door gebruik te maken van de benen van de bestuurder, dat over een motor beschikt; *gyrokopter:* gemotoriseerd
      luchtvaartuig met rotorbladen, zwaarder dan lucht, dat hoofdzakelijk in de lucht kan worden gehouden door
      aerodynamische reactiekrachten op zijn rotorbladen, waarvan de rotorbladen niet door de motor worden aangedreven;
      *ICAO-staat:* staat die het ICAO-verdrag heeft bekrachtigd; *ICAO-standaard-BvL:* bewijs van luchtwaardigheid
      als bedoeld in het ICAO-verdrag; *ICAO Annex 8:* bijlage 8 bij het ICAO-verdrag, betreffende de luchtwaardigheid
      van luchtvaartuigen; *lichte gyrokopter:* gyrokopter met een maximum startmassa van niet meer dan 600 kg, een- of
      tweezitter; *MLA:* (Micro Light Aeroplane) land-, amfibie- of watervliegtuig met niet meer dan twee zitplaatsen,
      een overtreksnelheid die niet hoger is dan 45 knopen gecalibreerde luchtsnelheid en een maximum startmassa van
      niet meer dan: 600 kg voor een landvliegtuig, inclusief een eventueel op het frame gemonteerd Total Recovery
      Parachute System; 650 kg voor een amfibie- of watervliegtuig, inclusief een eventueel op het frame gemonteerd
      Total Recovery Parachute System, mits een micro light die als watervliegtuig en als landvliegtuig gebruikt kan
      worden binnen beide daarvoor geldende massalimieten valt; *MLH:* (Micro Light Helicopter) helikopter met niet
      meer dan twee zitplaatsen en een maximum startmassa van niet meer dan: 300 kg voor een landhelikopter, eenzitter;
      450 kg voor een landhelikopter, tweezitter; 330 kg voor een amfibie- of waterhelikopter, eenzitter; of 495 kg
      voor een amfibie- of waterhelikopter, tweezitter, waarbij geldt dat een helikopter die als waterhelikopter en als
      landhelikopter gebruikt kan worden binnen beide daarvoor geldende massalimieten valt; *MOA-F:* erkenning voor het
      onderhoud van vliegtuigen, helikopters en ballonnen of onderdelen daarvan, als bedoeld in [verordening (EU) nr.
      1321/2014](32003R2042), Part M, section A, subpart F (Maintenance Organisation Approval-F); *modelluchtvaartuig:*
      luchtvaartuig, niet in staat een mens te dragen, en uitsluitend gebruikt voor luchtvaartvertoning, recreatie of
      sport; *Nederland:* Europees deel van het Koninkrijk en de openbare lichamen Bonaire, Sint Eustatius en Saba;
      *onderdeel:* elk deel dat is geïnstalleerd in of bevestigd aan een luchtvaartuig en dat bestemd is voor gebruik
      van dat luchtvaartuig tijdens de vlucht; *Onze Minister:* Onze Minister van Infrastructuur en Waterstaat;
      *paramotortrike:* luchtvaartuig zonder starre hoofdstructuur, dat wordt gestart en geland door gebruik te maken van
      een wielconstructie en over een hulpmotor beschikt, met niet meer dan twee zitplaatsen en een maximum startmassa
      van niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023922#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel1
