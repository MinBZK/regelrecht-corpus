  - number: '27'
    text: Dit besluit treedt in werking met ingang van de dag na uitgifte van het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel27
  - number: '28'
    text: 'Dit besluit wordt aangehaald als: Besluit luchtvaartuigen 2008.'
    url: https://wetten.overheid.nl/BWBR0023922/2024-02-20#Artikel28
