preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze minister van Verkeer en Waterstaat van 4 januari 2008, nr. CEND/HDJZ-2007/1644,
    Hoofddirectie Juridische Zaken, gedaan in overeenstemming met de staatssecretaris van Defensie;

    Gelet op

    – verordening (EG) nr. 1592/2002 van het Europees Parlement en de Raad van de Europese Gemeenschappen van 15 juli
    2002 tot vaststelling van gemeenschappelijke regels op het gebied van burgerluchtvaart en tot oprichting van een
    Europees Agentschap voor de veiligheid van de luchtvaart (PbEG L 240),

    – verordening (EG) nr. 1702/2003 van de Commissie van de Europese Gemeenschappen van 24 september 2003 tot
    vaststelling van uitvoeringsvoorschriften inzake de luchtwaardigheid en milieucertificering van luchtvaartuigen
    en aanverwante producten, onderdelen en uitrustingsstukken, alsmede voor de certificering van ontwerp- en
    productieorganisaties (PbEU L 243),

    – verordening (EG) nr. 2042/2003 van de Commissie van de Europese Gemeenschappen van 20 november 2003 betreffende
    de permanente luchtwaardigheid van luchtvaartuigen en luchtvaartproducten, -onderdelen en uitrustingsstukken, en
    betreffende de goedkeuring van bij voornoemde taken betrokken organisaties en personen (PbEU L 315) en

    – de artikelen 1.2, tweede en derde lid, 3.3, tweede lid, 3.7, 3.13, eerste en derde lid, 3.15, eerste lid, 3.19a,
    derde lid, 3.22, eerste lid, onder b, 3.23, 3.25, eerste tot en met derde lid, 3.26, eerste en derde lid, 3.29 en
    3.31 van de Wet luchtvaart;

    De Raad van State gehoord (advies van 31 januari 2008, nr. W09.08.00009/IV);

    Gezien het nader rapport van Onze minister van Verkeer en Waterstaat van 8 mei 2008, nr. CEND/HDJZ/2008-437,
    Hoofddirectie Juridische Zaken, uitgebracht in overeenstemming met de staatssecretaris van Defensie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en in de op dit besluit gebaseerde regelingen wordt verstaan onder:

      *aanvullende geluidsverklaring:* verklaring als bedoeld in [artikel 3.19c, tweede lid, van de wet][ref1];

      *aanvullend type-certificaat:* type-certificaat van een aanpassing van het orginele ontwerp zoals vastgelegd in het
      orginele type-certificaat van het ongewijzigd product;

      *akkoordverklaring:* door Onze minister afgegeven verklaring waarmee hij akkoord gaat met het aantonen van de
      conformiteit van individuele producten, onderdelen en uitrustingsstukken overeenkomstig [verordening (EG) nr.
      1702/2003](32003R1702), Part 21, section A, subpart F;

      *ARC:* certificaat van beoordeling van de luchtwaardigheid dat periodiek wordt afgegeven door Onze minister of een
      daartoe erkende managementorganisatie voor permanente luchtwaardigheid, dat deel uitmaakt van een geldig BvL (EASA
      Form 15, Airworthiness Review Certificate);

      *blijvende luchtwaardigheid:* alle processen waarmee gewaarborgd wordt dat het luchtvaartuig gedurende de gehele
      operationele levensduur voldoet aan de geldende normen voor luchtwaardigheid en zich in een toestand van veilige
      exploitatie bevindt;

      *BvL:* Bewijs van Luchtwaardigheid;

      *CAMO:* ingevolge [verordening (EG) nr. 2042/2003](32003R2042) erkende management organisatie voor blijvende
      luchtwaardigheid (Continuing Airworthiness Management Organisation);

      *CAMO-erkenning:* erkenning voor het managen van de blijvende luchtwaardigheid van luchtvaartuigen en de onderdelen
      daarvan, als bedoeld in [verordening (EG) nr. 2042/2003](32003R2042), Part M, section A, subpart G;

      *certificaat*, als bedoeld in [artikel 19, eerste lid, onder b][ref2]: certificaat ten aanzien van werkzaamheden
      die zijn opgenomen in de erkenning en die verband houden met de luchtwaardigheid en geluidsproductie van producten
      of onderdelen;

      *EASA-beperkt-BvL:* bewijs van luchtwaardigheid voor een EASA-luchtvaartuig dat wel aan de eisen betreffende
      luchtwaardigheid volgens het ICAO-verdrag voldoet, maar niet aan de essentiële eisen inzake luchtwaardigheid zoals
      opgenomen in bijlage I bij verordening (EG) nr. 216/2008;

      *EASA-luchtvaartuig:* luchtvaartuig waarop verordening (EG) nr. 216/2008, [verordening (EG) nr. 1702/2003]
      (32003R1702) en [verordening (EG) nr. 2042/2003](32003R2042), van toepassing zijn;

      *EASA-standaard-BvL:* bewijs van luchtwaardigheid voor een EASA- luchtvaartuig dat zowel aan de eisen betreffende
      luchtwaardigheid volgens het ICAO-verdrag als aan de essentiële eisen inzake luchtwaardigheid zoals opgenomen in
      bijlage I bij verordening (EG) nr. 216/2008 voldoet;

      *export-BvL:* bewijs waarin de status van het luchtvaartuig betreffende de luchtwaardigheid wordt aangegeven,
      getoetst volgens de eisen van het importerende land;

      *geluidscertificaat:* certificaat als bedoeld in [artikel 3.19a, eerste lid, van de wet][ref3];

      *geluidsverklaring:* verklaring als bedoeld in [artikel 3.19c, eerste lid, van de wet][ref4];

      *gemotoriseerd schermvliegtuig:* schermvliegtuig als bedoeld in [artikel 1 van het Luchtverkeersreglement][ref5],
      niet zijnde een schermzweeftoestel als bedoeld in artikel 1 van het Luchtverkeersreglement;

      *gyroplane:* helikopter als bedoeld in [artikel 1 van het Luchtverkeersreglement][ref6] waarvan de rotorbladen niet
      door de motor worden aangedreven;

      *ICAO-staat:* staat die het ICAO-verdrag heeft bekrachtigd;

      *ICAO-standaard-BvL:* bewijs van luchtwaardigheid als bedoeld in het ICAO-verdrag;

      *ICAO Annex 8:* bijlage 8 bij het ICAO-verdrag, betreffende de luchtwaardigheid van luchtvaartuigen;

      *MLA:* (Micro Light Aeroplane) land-, amfibie- of watervliegtuig met niet meer dan twee zitplaatsen, een
      overtreksnelheid die niet hoger is dan 35.1 knopen gecalibreerde luchtsnelheid en een maximum startmassa van niet
      meer dan:

      300 kg voor een landvliegtuig, eenzitter;

      450 kg voor een landvliegtuig, tweezitter;

      315 kg voor een landvliegtuig, eenzitter, dat is uitgerust met een op het frame gemonteerd Total Recovery Parachute
      System;

      472,5 kg voor een landvliegtuig, tweezitter, dat is uitgerust met een op het frame gemonteerd Total Recovery
      Parachute System;

      330 kg voor een amfibie- of watervliegtuig, eenzitter, of

      495 kg voor een amfibie- of watervliegtuig, tweezitter, mits een micro light die als watervliegtuig en als
      landvliegtuig gebruikt kan worden binnen beide daarvoor geldende massalimieten valt;

      *MLH:* (Micro Light Helicopter) helikopter met niet meer dan twee zitplaatsen en een maximum startmassa van niet
      meer dan:

      300 kg voor een landhelikopter, eenzitter;

      450 kg voor een landhelikopter, tweezitter;

      330 kg voor een amfibie- of waterhelikopter, eenzitter;

      495 kg voor een amfibie- of waterhelikopter, tweezitter, waarbij geldt dat een helikopter die als waterhelikopter
      en als landhelikopter gebruikt kan worden binnen beide daarvoor geldende massalimieten valt; of

      560 kg voor een gyroplane, een- of tweezitter;

      *MOA:* erkenning voor het onderhoud van vliegtuigen, helikopters en luchtschepen of onderdelen daarvan, als bedoeld
      in [verordening (EG) nr. 2042/2003](32003R2042), Part 145 (Maintenance Organisation Approval);

      *MOA-F:* erkenning voor het onderhoud van vliegtuigen, helikopters en ballonnen of onderdelen daarvan, als bedoeld
      in [verordening (EG) nr. 2042/2003](32003R2042), Part M, section A, subpart F (Maintenance Organisation Approval-
      F);

      *MTOA:* erkenning voor het trainen en examineren van onderhoudspersoneel volgens de specificaties van Part 66, als
      bedoeld in [verordening (EG) nr. 2042/2003](32003R2042), Part 147 (Maintenance Training Organisation Approval);

      *Nederland:* Europees deel van het Koninkrijk en de openbare lichamen Bonaire, Sint Eustatius en Saba;

      *onderdeel:* elk deel dat is geïnstalleerd in of bevestigd aan een luchtvaartuig en dat bestemd is voor gebruik van
      dat luchtvaartuig tijdens de vlucht;

      *Onze minister:* Onze minister van Verkeer en Waterstaat;

      *Part 21:* deel betreffende certificatieprocedures voor EASA-luchtvaartuigen, aanverwante producten en onderdelen
      (bijlage bij [verordening (EG) nr. 1702/2003](32003R1702));

      *Part 66:* deel betreffende trainings- en exameneisen voor onderhoudspersoneel (bijlage III bij [verordening (EG)
      nr. 2042/2003](32003R2042));

      *Part 145:* deel betreffende erkende onderhoudsbedrijven (bijlage II bij [verordening (EG) nr. 2042/2003]
      (32003R2042));

      *Part 147:* deel betreffende erkende trainings- en examineringsinstanties (bijlage IV bij [verordening (EG) nr.
      2042/2003](32003R2042));

      *Part M:* deel betreffende de blijvende luchtwaardigheid van EASA-luchtvaartuigen (bijlage I bij [verordening (EG)
      nr. 2042/2003](32003R2042));

      *POA:* erkenning voor het vervaardigen van producten en onderdelen als bedoeld in Part 21, section A, subpart G
      (Production Organisation Approval);

      *product:* luchtvaartuig, een voortstuwingsinrichting of een propeller;

      *speciaal-BvL:* bewijs van luchtwaardigheid voor luchtvaartuigen die buiten het kader van verordening (EG) nr.
      216/2008 vallen en ook niet aan de eisen betreffende luchtwaardigheid volgens het ICAO-verdrag voldoen;

      *staat van ontwerp:* ICAO-lidstaat die rechtsmacht heeft over de organisatie die verantwoordelijk is voor het
      ontwerp van een luchtvaartuig, zoals gedefinieerd in ICAO Annex 8;

      *Total Recovery Parachute System:* reddingssysteem met valscherm voor het hele luchtvaartuig;

      *type-certificaat:* het geheel van documenten omvattende het type-ontwerp, de operationele beperkingen, het
      gegevensblad, de luchtwaardigheidsregelgeving en alle andere voorschriften en beperkingen zoals voorgeschreven in
      de van toepassing zijnde eisen;

      *type-ontwerp:* het geheel van documenten omvattende alle tekeningen en specificaties benodigd om de configuratie,
      de eigenschappen van het ontwerp vast te leggen, informatie over materialen, processen en productiemethodieken,
      luchtwaardigheidsbeperkingen ten behoeve van het onderhoud en alle gegevens die nodig zijn om de luchtwaardigheid
      en voor zover van toepassing de geluidsproductie vast te stellen van latere producten van het type;

      *verdrag:* het op 7 december 1944 te Chicago tot stand gekomen verdrag inzake de internationale burgerluchtvaart
      (Trb.1973,109) (ICAO-verdrag);

      *verklaring van conformiteit:* verklaring dat het luchtvaartuig of het onderdeel aan het goedgekeurde ontwerp
      voldoet (Statement of Conformity);

      verordening (EG) nr. 216/2008: verordening (EG) nr. 216/2008 van het Europees Parlement en de Raad van de Europese
      Unie van 20 februari 2008 tot vaststelling van gemeenschappelijke regels op het gebied van burgerluchtvaart en
      tot oprichting van een Europees Agentschap voor de veiligheid van de luchtvaart, houdende intrekking van Richtlijn
      91/670/EEG, Verordening (EG) nr. 1592/2002 en Richtlijn 2004/36/EG (PbEU L 79);

      *verordening (EG) nr. 1702/2003:* verordening van de Commissie van de Europese Gemeenschappen van 24 september 2003
      tot vaststelling van uitvoeringsvoorschriften inzake de luchtwaardigheid en milieucertificering van luchtvaartuigen
      en aanverwante producten, onderdelen en uitrustingsstukken, alsmede voor de certificering van ontwerp- en
      productieorganisaties (PbEU L 243);

      *verordening (EG) nr. 2042/2003:* verordening van de Commissie van de Europese Gemeenschappen van 20 november
      2003 betreffende de permanente luchtwaardigheid van luchtvaartuigen en luchtvaartproducten, -onderdelen en
      -uitrustingsstukken, en betreffende de goedkeuring van bij voornoemde taken betrokken organisaties en personen
      (PbEU L 315);

      *vliegvergunning:* bewijs van luchtwaardigheid waarmee toestemming wordt gegeven voor het maken van een of meerdere
      vluchten met een specifieke doelstelling binnen de bij de EASA aangesloten landen;

      *wet:* [Wet luchtvaart][ref7].


