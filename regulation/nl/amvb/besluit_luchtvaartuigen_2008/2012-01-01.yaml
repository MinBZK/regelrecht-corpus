  - number: '20'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent:

      a. de aanvraag, de wijziging en de verlenging van een erkenning of een akkoordverklaring,

      b. de procedure van aanvraag, verlenging, wijziging, schorsing of intrekking van een erkenning of een
      akkoordverklaring,

      c. de aanvraag van een bekrachtiging van een verklaring van conformiteit,

      d. de procedure van aanvraag van een bekrachtiging van een verklaring van conformiteit,

      e. de wijze waarop de aanvrager aantoont dat hij aan de gestelde eisen voldoet,

      f. het model en de uitvoering van een certificaat als bedoeld in [artikel 19, eerste lid, onder b][ref1], en

      g. de melding aan Onze minister als bedoeld in [artikel 19, tweede lid, onder f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0023922#Artikel19
