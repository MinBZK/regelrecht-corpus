  - number: '3'
    text: |-
      1 In het Nederlandse register voor burgerluchtvaartuigen worden luchtvaartuigen ingeschreven:

      a. die zijn vervaardigd in de openbare lichamen Bonaire, Sint Eustatius en Saba, en die niet zijn uitgevoerd, of

      b. die zijn vervaardigd in een lidstaat van de Europese Unie of in een van de Staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte, en die niet zijn uitgevoerd, of ten aanzien waarvan, bij
      het in het vrije verkeer brengen, de vereiste douaneformaliteiten zijn vervuld, en

      c. ten aanzien waarvan het beheer met het oog op een blijvende luchtwaardigheid, door de aanvrager, dan wel door
      diens vertegenwoordiger vanuit een vestiging in Nederland wordt gevoerd.

      2 De aanvrager, die krachtens geldige titel een luchtvaartuig onder zich heeft, is:

      a. een onderdaan van een lidstaat van de Europese Unie of van een van de Staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte,

      b. een ingezetene van een lidstaat van de Europese Unie of van een van de Staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte, niet zijnde een onderdaan van een lidstaat van de Europese
      Unie of van een van de Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, of

      c. een rechtspersoon die in overeenstemming met de wetgeving van een lidstaat van de Europese Unie of van een van
      de Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte is opgericht en waarvan
      de statutaire zetel of feitelijke zetel, zich bevindt in een lidstaat van de Europese Unie of van een van de Staten
      die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte dan wel in de openbare lichamen
      Bonaire, Sint Eustatius en Saba.

      3 Onze minister van Financiën kan ontheffing verlenen van de in het eerste lid, onder b, bedoelde
      douaneformaliteiten. Aan de ontheffing kunnen voorschriften worden verbonden. Bij het niet naleven van een aan de
      ontheffing verbonden voorschrift kan Onze minister van Financiën de ontheffing intrekken.

      4 Indien de aanvrager geen woonplaats heeft in Nederland dan wel, indien het om een rechtspersoon gaat, de
      statutaire zetel, hoofdbestuur of hoofdvestiging niet in Nederland is gevestigd, dient het beheer, bedoeld in het
      eerste lid, onder c, te worden uitgevoerd door een vertegenwoordiger van de aanvrager met woonplaats in Nederland,
      dan wel, door een nevenvestiging van de rechtspersoon in Nederland.

      5 Indien de aanvrager het in het eerste lid, onder c, bedoelde beheer heeft uitbesteed, rusten de verplichtingen
      terzake van de blijvende luchtwaardigheid op de in het vierde lid bedoelde vertegenwoordiger dan wel op de
      nevenvestiging als rechtspersoon.

      6 De aanvrager is gehouden aan de uitbesteding, bedoeld in het vijfde lid, het op schrift gestelde voorschrift te
      verbinden dat hij te allen tijde opdrachten kan verstrekken in verband met de naleving van de hem krachtens dit
      besluit terzake van de blijvende luchtwaardigheid opgedragen verplichtingen.

      7 Indien de aanvrager, bedoeld in het tweede lid, niet tevens de eigenaar is van het luchtvaartuig, schrijft Onze
      minister het luchtvaartuig in het register voor burgerluchtvaartuigen in, tenzij de eigenaar afkomstig is uit een
      land waarmee Nederland de diplomatieke banden heeft verbroken.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel3
  - number: '4'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot:

      a. de procedure van aanvraag tot afgifte, wijziging en doorhaling van een inschrijving in het register voor
      burgerluchtvaartuigen, alsmede de gegevens die bij deze procedure worden verstrekt,

      b. de vernieuwing van het inschrijvingsbewijs.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel4
  - number: '5'
    text: |-
      Onze minister kan op aanvraag een aanvullend type-certificaat afgeven voor een wijziging van een niet-militair
      staatsluchtvaartuig of een luchtvaartuig als bedoeld in onderdeel a, b en d van bijlage II bij verordening (EG)
      nr. 216/2008.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel5
  - number: '6'
    text: |-
      Bij ministeriële regeling worden regels gesteld betreffende:

      a. de aanvraag, de aanvrager en de afgifte van een aanvullend type-certificaat en van de wijziging daarvan,

      b. de wijze waarop de aanvrager aantoont dat hij aan alle op hem van toepassing zijnde eisen voldoet, en

      c. de overdracht alsmede de procedure van aanvraag om afgifte, wijziging, schorsing en intrekking van een
      aanvullend type-certificaat.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel6
  - number: '7'
    text: |-
      1 Onze minister kan op aanvraag de volgende bewijzen van luchtwaardigheid afgeven:

      a. een ICAO-standaard-BvL,

      b. een EASA-standaard-BvL,

      c. een EASA-beperkt-BvL,

      d. een speciaal-BvL,

      e. een export-BvL, of

      f. een vliegvergunning.

      2 Onze minister kan op aanvraag een ARC behorende bij de bewijzen, bedoeld in het eerste lid onder b en c afgeven.

      3 Een bewijs als bedoeld in het eerste lid, onder a, en de bewijzen, bedoeld in het eerste lid onder b en c,
      tezamen met een geldig ARC, zijn geldig voor het internationaal uitvoeren van vluchten.

      4 Een bewijs als bedoeld in het eerste lid, onder d, is slechts geldig voor het uitvoeren van vluchten
      binnen het vluchtinformatiegebied Amsterdam dan wel de delen van het vluchtinformatiegebied Curaçao en het
      vluchtinformatiegebied San Juan die zich boven het territoir van de openbare lichamen Bonaire, Sint Eustatius
      en Saba bevinden dan wel die delen waarvoor Onze Minister de verantwoordelijkheid voor het verzorgen van
      luchtverkeersdiensten heeft aanvaard.

      5 Een bewijs als bedoeld in het eerste lid, onder e, houdt, in combinatie met een bewijs als bedoeld in het eerste
      lid, onder a, b of c, een toestemming in tot het uitvoeren van vluchten.

      6 Een bewijs als bedoeld in het eerste lid, onder f, is slechts geldig voor vluchten binnen het luchtruim van de
      bij de EASA aangesloten landen.

      7 De voorschriften of beperkingen verbonden aan een bewijs van luchtwaardigheid als bedoeld in het eerste lid
      worden neergelegd op dat bewijs van luchtwaardigheid of in een bijlage bij dat bewijs van luchtwaardigheid.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel7
  - number: '8'
    text: |-
      1 Onze minister geeft op aanvraag van de houder van een niet-militair staatsluchtvaartuig, danwel een luchtvaartuig
      als bedoeld in onderdeel b van bijlage II bij verordening (EG) nr. 216/2008, of zijn vertegenwoordiger, een ICAO-
      standaard-BvL af indien het luchtvaartuig naar zijn oordeel voldoet aan een ontwerp dat is goedgekeurd door middel
      van:

      a. een door EASA uitgegeven type-certificaat,

      b. door Onze minister of de EASA uitgegeven aanvullende type-certificaten,

      c. door Onze minister of de EASA uitgegeven luchtwaardigheidsaanwijzingen, en

      d. door Onze minister of de EASA goedgekeurde wijzigingen en reparaties,

      en veilig gebruikt kan worden.

      2 Onze minister geeft op aanvraag van de houder van een luchtvaartuig als bedoeld in de onderdelen a en d van
      bijlage II bij verordening (EG) nr. 216/2008, of zijn vertegenwoordiger, een ICAO-standaard-BvL af indien:

      a. het luchtvaartuig naar zijn oordeel voldoet aan een ontwerp dat is goedgekeurd conform ICAO Annex 8 door middel
      van een civiel goedgekeurd type-ontwerp van de staat van ontwerp,

      b. de staat van ontwerp bevestigt verplichte instructies betreffende de blijvende luchtwaardigheidsaanwijzingen
      conform ICAO Annex 8 uit te geven, en

      c. het luchtvaartuig veilig gebruikt kan worden.

      3 Bij ministeriële regeling worden nadere regels gesteld omtrent het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel8
  - number: '9'
    text: |-
      Onze minister geeft op aanvraag van de houder van een luchtvaartuig een speciaal-BvL af indien het luchtvaartuig
      in staat is om op veilige wijze vluchten uit te voeren en voldoet aan bij ministeriële regeling daartoe te stellen
      eisen.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel9
  - number: '10'
    text: |-
      1 Onze Minister geeft op aanvraag van de houder van een nieuw luchtvaartuig een export-BvL af:

      a. op grond van een internationale overeenkomst of een besluit van een volkenrechtelijke organisatie aangaande de
      wederzijdse erkenning van af te geven export-BvL’s, of

      b. indien de staat van invoer met betrekking tot het desbetreffende luchtvaartuig heeft aangegeven in te stemmen
      met de erkenning van een daartoe af te geven export-BvL, en

      c. het luchtvaartuig voldoet aan een type-ontwerp dat acceptabel is voor de bevoegde autoriteit van de staat van
      invoer,

      d. het luchtvaartuig voldoet aan de aanvullende eisen voor invoer die de bevoegde autoriteit van de staat van
      invoer stelt,

      e. het luchtvaartuig is geproduceerd door een houder van een POA, dan wel door degene die een akkoordverklaring als
      bedoeld in Part 21, section A, subpart F, heeft verkregen,

      f. de bij ministeriële regeling vereiste documentatie is overgelegd,

      g. het luchtvaartuig is geïdentificeerd overeenkomstig Part 21, section A, subpart Q, en

      h. Het luchtvaartuig zich op een zodanige plaats bevindt, dat Onze Minister kan vaststellen dat aan de onder c tot
      en met g, gestelde eisen is voldaan.

      2 Het eerste lid is van overeenkomstige toepassing op gebruikte luchtvaartuigen, met uitzondering van onderdeel
      e, en met dien verstande dat de houder beschikt over een ICAO-standaard-BvL, een EASA-standaard-BvL of een EASA-
      beperkt-BvL, dan wel het luchtvaartuig in aanmerking komt voor een van deze bewijzen.

      3 Aan de eisen in het eerste lid, onder c tot en met f en het tweede lid, behoeft niet te worden voldaan, indien de
      bevoegde autoriteit van de staat van invoer daarmee instemt.

      4 In het geval beschreven in het derde lid, worden afwijkingen van het product ten opzichte van het type-
      certificaat op het exportbewijs als uitzonderingen opgenomen.

      5 De houder van een export-BvL is verplicht:

      a. aan de autoriteit van de staat van invoer alle informatie te verschaffen ten behoeve van het goed functioneren
      van het luchtvaartuig, alsmede de assemblagegegevens, indien een luchtvaartuig niet geassembleerd wordt ingevoerd,

      b. het niet geassembleerde luchtvaartuig goed te verpakken tijdens vervoer of opslag, en

      c. tijdelijke installaties aan het luchtvaartuig ten behoeve van het vervoer na aankomst in de staat van invoer
      te verwijderen.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel10
  - number: '11'
    text: |-
      1 Een ICAO-standaard-BvL wordt afgegeven of verlengd voor een periode van ten hoogste 1 jaar.

      2 Een speciaal-BvL wordt afgegeven of verlengd voor een periode van ten hoogste 1 jaar.

      3 Een export-BvL wordt eenmalig afgegeven.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel11
  - number: '12'
    text: |-
      1 De houder van een luchtvaartuig voorzien van een ICAO-standaard-BvL laat dat luchtvaartuig onderhouden
      overeenkomstig [verordening (EG) nr. 2042/2003](32003R2042), Part M, door de houder van een erkenning inzake
      onderhoud als bedoeld in [artikel 17, eerste lid, onder f][ref1] dan wel door de houder van een bewijs van
      bevoegdheid inzake onderhoud ingevolge [artikel 3.30 van de wet][ref2].

      2 De houder van een luchtvaartuig voorzien van een EASA-standaard-BvL, een EASA-beperkt-BvL of een vliegvergunning
      laat dat luchtvaartuig onderhouden conform [verordening (EG) nr. 2042/2003](32003R2042), Part M.

      3 Onderhoud van luchtvaartuigen met een speciaal-BvL geschiedt overeenkomstig de bij ministeriële regeling te
      stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3.30
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '17'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '3.30'
  - number: '13'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent:

      a. de aanvraag van een bewijs van luchtwaardigheid en een ARC,

      b. de wijziging, overdracht, verlenging en vernieuwing van een bewijs van luchtwaardigheid en een ARC,

      c. de procedure van aanvraag, afgifte, wijziging, schorsing en intrekking van een bewijs van luchtwaardigheid en
      een ARC, en

      d. de wijze waarop de houder van een luchtvaartuig kan aantonen dat het noodzakelijke onderhoud heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel13
  - number: '14'
    text: |-
      1 Onze minister kan op aanvraag aan de houder van een luchtvaartuig een geluidscertificaat afgeven.

      2 Onze minister vermeldt op een geluidscertificaat de gegevens die zijn vastgelegd ten behoeve van de afgifte van
      een type-certificaat en de eventueel van toepassing zijnde aanvullende type-certificaten.

      3 Indien de in het tweede lid bedoelde gegevens niet beschikbaar zijn, kan Onze minister op een geluidscertificaat
      vermelden:

      a. de gegevens die zijn vastgelegd bij een goedgekeurd type-ontwerp,

      b. de gegevens van een door Onze minister met betrekking tot het desbetreffende luchtvaartuig geaccepteerd
      meetrapport,

      c. de gegevens op basis van een door Onze minister geaccepteerde conservatieve schatting van de geluidsproductie,

      d. de limietwaarden van de geluidsproductie.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel14
  - number: '15'
    text: |-
      1 Op aanvraag van de houder van een luchtvaartuig waarvoor geen geluidseisen gelden kan Onze minister voor het
      geluid relevante gegevens op een geluidsverklaring vermelden. Hiertoe legt de aanvrager met betrekking tot dat
      luchtvaartuig geluidsniveaus vast aan de hand van een naar het oordeel van Onze minister adequate en betrouwbare
      meetmethode. De aanvrager verstrekt de gegevens over de geluidsniveaus aan Onze minister.

      2 Onze minister kan op aanvraag van de houder van een luchtvaartuig waarvoor geluidseisen gelden de voor het
      geluid relevante gegevens op een aanvullende geluidsverklaring vermelden. Hiertoe worden met betrekking tot dat
      luchtvaartuig geluidsniveaus vastgelegd en overgelegd aan de hand van een naar het oordeel van Onze minister
      adequate en betrouwbare meetmethode.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel15
  - number: '16'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent:

      a. de procedure van aanvraag van een (voorlopig) geluidscertificaat, een (voorlopige) geluidsverklaring of een
      (voorlopige) aanvullende geluidsverklaring,

      b. de procedure van wijziging, overdracht, schorsing, intrekking, verlenging en vernieuwing van een (voorlopig)
      geluidscertificaat, een (voorlopige) geluidsverklaring of een (voorlopige) aanvullende geluidsverklaring.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel16
  - number: '17'
    text: |-
      1 Onze minister kan de volgende erkenningen verlenen:

      a. een POA,

      b. een MOA,

      c. een MOA-F,

      d. een MTOA,

      e. een CAMO-erkenning, of

      f. een erkenning voor werkzaamheden die verband houden met de luchtwaardigheid en de geluidsproductie van producten
      of onderdelen, met uitzondering van werkzaamheden die reeds onder een van de erkenningen in de onderdelen a tot en
      met e vallen.

      2 Onze minister kan in bijzondere gevallen waarin naar zijn oordeel een POA niet toepasselijk is, een
      akkoordverklaring afgeven.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel17
  - number: '18'
    text: |-
      1 Onze minister verleent op aanvraag een erkenning als bedoeld in [artikel 17, eerste lid, onder f][ref1], indien:

      a. de aanvrager beschikt over een organisatie met inbegrip van een kwaliteitssysteem dat waarborgt dat de
      resultaten van de werkzaamheden aan de van toepassing zijnde eisen voldoen en niet tot een onveilige situatie
      kunnen leiden, en

      b. de aanvrager een handboek heeft waarin de organisatie wordt omschreven.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent het eerste lid.

      3 Een erkenning als bedoeld in [artikel 17, eerste lid, onder f][ref2], geldt voor de in de erkenning genoemde
      werkzaamheden, producten dan wel categorieën onderdelen, waarvoor de houder de in [artikel 19, eerste lid][ref3],
      bedoelde bevoegdheden heeft.

      4 Een erkenning als bedoeld in [artikel 17, eerste lid, onder f][ref4], wordt verleend voor ten hoogste 2 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0023922#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0023922#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0023922#Artikel17
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '17'
