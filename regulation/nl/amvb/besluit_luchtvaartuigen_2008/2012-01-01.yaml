      - id: ref4
        bwb_id: BWBR0023922
        artikel: '17'
        hoofdstuk: '6'
  - number: '19'
    text: |-
      1 De houder van een erkenning als bedoeld in [artikel 17, eerste lid, onder f][ref1], is bevoegd tot:

      a. de werkzaamheden die zijn opgenomen in de erkenning, en

      b. de afgifte van een certificaat ten aanzien van de werkzaamheden als bedoeld onder a.

      2 De houder van een erkenning als bedoeld in [artikel 17, eerste lid, onder f][ref2], is verplicht:

      a. het in [artikel 18, eerste lid, onder b][ref3], bedoelde handboek te gebruiken en actueel te houden,

      b. voorafgaande aan de afgifte van een certificaat bedoeld in het eerste lid, onder b, vast te stellen dat de
      resultaten van de werkzaamheden voldoen aan de van toepassing zijnde eisen, de werkzaamheden naar behoren zijn
      uitgevoerd en de resultaten niet tot onveilige situaties kunnen leiden,

      c. gegevens die nodig zijn als bewijs dat aan alle vereisten is voldaan voor de afgifte van een erkenning als
      bedoeld in [artikel 17, eerste lid, onder f][ref4], te bewaren volgens bij ministeriële regeling te stellen regels
      en op een bij die regeling vastgestelde wijze aan Onze minister ter beschikking te stellen,

      d. in het geval van een ontwerperkenning de ontwerpen indien nodig aan te passen aan de van toepassing zijnde
      luchtwaardigheids- en milieueisen,

      e. in het geval van een ontwerperkenning alle proefprogramma's of proeven in het kader van toezicht tijdig aan Onze
      minister ter beschikking te stellen,

      f. in het geval van een onderhoudserkenning een zodanige staat van een product of onderdeel, die het luchtvaartuig
      ernstig in gevaar kan brengen, te melden aan de houder van het type-certificaat, dan wel aan de houder van het
      goedgekeurde ontwerp, de houder van het luchtvaartuig en Onze minister,

      g. te voldoen aan bij ministeriële regeling te stellen eisen ten aanzien van veranderingen die de houder van de
      erkenning betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0023922#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0023922#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0023922#Artikel17
