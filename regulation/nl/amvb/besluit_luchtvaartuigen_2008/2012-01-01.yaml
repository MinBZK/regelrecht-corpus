  - number: '21'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot startinrichtingen voor luchtvaartuigen
      zonder voortstuwingsinrichtingen.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel21
  - number: '22'
    text: |-
      1 Een vergoeding is verschuldigd voor:

      a. de afgifte en vernieuwing van een bewijs van inschrijving,

      b. de behandeling van de aanvraag om wijziging dan wel doorhaling van de inschrijving,

      c. de behandeling van de aanvraag om afgifte, wijziging of overdracht van een aanvullend type-certificaat,
      een ontwerpgoedkeuring van een onderdeel, een bewijs van luchtwaardigheid of een ARC, dan wel de vernieuwing
      of verlenging van een bewijs van luchtwaardigheid of een ARC of de aanvraag voor een vliegvergunning en een
      ontheffing,

      d. de behandeling van de aanvraag om afgifte, wijziging of vernieuwing van een geluidscertificaat, een
      geluidsverklaring of een aanvullende geluidsverklaring,

      e. de behandeling van de aanvraag om afgifte, verlenging, vernieuwing of wijziging van een erkenning,

      f. de behandeling van de aanvraag om goedkeuring of wijziging van een onderhoudsprogramma.

      2 Bij ministeriële regeling wordt de hoogte van de vergoedingen, bedoeld in het eerste lid, vastgesteld.

      3 Bij ministeriële regeling wordt de wijze van betaling van de verschuldigde vergoeding vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel22
  - number: '23'
    text: |-
      1 De beslissing op een aanvraag voor de toepassing van de handelingen in [artikel 22, eerste lid][ref1], met
      uitzondering van een aanvraag die betrekking heeft op een aanvullend type-certicaat en een ontwerpgoedkeuring,
      wordt slechts genomen nadat is gebleken dat de verschuldigde vergoeding is betaald.

      2 De beslissing op een aanvraag voor de toepassing van de handelingen in [artikel 22, eerste lid, onder c][ref2],
      voor zover die betrekking heeft op aanvullende type-certificaten en een ontwerpgoedkeuring, wordt slechts genomen
      nadat is gebleken dat alle voorafgaande facturen ten aanzien van de gevraagde handeling, verstuurd tot 30 dagen
      voorafgaande aan de datum van de beslissing, zijn voldaan.

      3 Wanneer na de betaling van de verschuldigde vergoeding degene, die een aanvraag als bedoeld in het eerste lid,
      heeft ingediend, verzoekt die aanvraag als niet ingediend te beschouwen, kan hem op zijn verzoek een, nader door
      Onze minister in elk geval afzonderlijk te bepalen, bedrag worden terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0023922#Artikel22
    url: https://wetten.overheid.nl/BWBR0023922/2012-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '22'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0023922
        artikel: '22'
        hoofdstuk: '7'
  - number: '25'
    text: |-
      Na de inwerkingtreding van dit besluit berusten de hierna genoemde regelingen op de daarbij vermelde artikelen van
      dit besluit :

      a. de
      __REF000___________________________________________________________________________________________________________
      ___________ (Stcrt. 250) berust op [artikel 3, derde lid][ref2];

      b. de [Regeling inschrijving Nederlandse burgerluchtvaartuigen][ref3] berust op [artikel 4][ref4];

      c. de [Regeling type-certificatie luchtwaardigheid][ref5] berust op [artikel 6][ref6];

      d. de [Regeling standaard-BvL][ref7] berust op de [artikelen 8, derde lid][ref8], en
      [13, onderdeel a, b en c][ref9];

      e. de [Regeling amateurbouwluchtvaartuigen][ref10] en de [Regeling MLA’s][ref11] berusten op de
      [artikelen 2, vierde lid][ref12], en [13, onderdeel a, b en c][ref13];

      f. de [Regeling onderhoud luchtvaartuigen][ref14] berust op de [artikelen 12, tweede lid][ref15] en
      [13, onderdeel d][ref16];

      g. de [Regeling verlenging bewijzen van luchtwaardigheid][ref17] berust op [artikel 13, onderdeel b][ref18];

      h. de [Regeling geluidscertificaten en geluidsverklaringen luchtvaart][ref19] berust op [artikel 16][ref20];

      i. de [Regeling erkenningen luchtwaardigheid][ref21] berust op de
      [artikelen 19, tweede lid, onderdeel c en g][ref22], en [20][ref23];

      j. de [Regeling voorzieningen sleepvliegen][ref24], de
      __REF001___________________________________________________________________________________________________________
      ________________________________________ (Stcrt. 179) en de [Regeling onderhoud lieren 2001][ref26] berusten op
      [artikel 21][ref27];

      k. de Instructie doelvliegtuig berust op [artikel 2, zesde lid, onderdeel b][ref28].


