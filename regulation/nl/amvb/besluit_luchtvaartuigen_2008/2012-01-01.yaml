  - number: '2'
    text: |-
      1 Met uitzondering van het tweede, vierde en zesde lid, is dit besluit uitsluitend van toepassing op
      luchtvaartuigen, voortstuwingsinrichtingen, propellers, onderdelen en erkenningen bestemd voor de burgerluchtvaart.

      2 Dit besluit en [hoofdstuk 3 van de wet][ref1] zijn niet van toepassing op de volgende soorten luchtvaartuigen:

      a. modelvliegtuigen, waarvan de totale massa ten hoogste 25 kilogram bedraagt,

      b. ballonnen, die op zeeniveau in de internationale standaardatmosfeer in geheel gevulde toestand een diameter
      van ten hoogste 2.00 meter of een inhoud van ten hoogste 4.00 kubieke meter hebben, alsmede aan elkaar gekoppelde
      ballonnen waarvan de gezamenlijke diameter en inhoud deze waarden niet te boven gaan,

      c. toestellen, zwaarder dan lucht en niet voorzien van een voortstuwingsinrichting, die door middel van een
      ankerkabel of lijn zijn verbonden met het aardoppervlak (kabelvlieger),

      d. luchtschepen, die op zeeniveau in de internationale standaardatmosfeer in geheel gevulde toestand een grootste
      afmeting hebben van maximaal 5.00 meter of een inhoud van ten hoogste 4.00 kubieke meter,

      e. toestellen, zwaarder dan lucht in de vorm van een scherm met harnas, die met een lijn of lijnen zijn bevestigd
      aan een voertuig of vaartuig, waardoor ze in de lucht kunnen worden gehouden (valschermzweeftoestel),

      f. ballonnen, die tijdens het in de lucht houden permanent zijn bevestigd aan het aardoppervlak (kabelballon),

      g. valschermen, zijnde schermen die dienen om de daalsnelheid van personen zodanig te beperken dat deze veilig het
      aardoppervlak kunnen bereiken,

      h. zeilvliegtuigen met een totale massa zonder piloot van minder dan 70 kg,

      i. schermzweeftoestellen met een totale massa zonder piloot van minder dan 70 kg,

      j. amateurbouwluchtvaartuigen ingeschreven in andere lidstaten van de European Civil Aviation Conference.

      3 [Paragraaf 3.2.3 van de wet][ref2] omtrent bewijzen van bevoegdheid voor onderhoud is niet van toepassing op de
      volgende soorten luchtvaartuigen:

      a. amateurbouwluchtvaartuigen,

      b. MLA's,

      c. MLH’s,

      d. gemotoriseerde schermvliegtuigen.

      4 Bij regeling van Onze minister dan wel Onze minister van Defensie kunnen voorschriften en beperkingen worden
      opgenomen ten aanzien van de in het tweede en derde lid genoemde luchtvaartuigen.

      5 [Artikel 3.5 van de wet][ref3] is niet van toepassing op luchtvaartuigen als bedoeld in
      [artikel 3.6 van de wet][ref4].

      6 Het verbod, bedoeld in [artikel 3.8, eerste lid, onder b, van de wet][ref5], is niet van toepassing op militaire
      luchtvaartuigen die hetzij automatisch, hetzij op afstand worden bestuurd, en die worden gebruikt als doel voor
      schietoefeningen dan wel voor het slepen van een doel voor schietoefeningen mits wordt voldaan aan het volgende:

      a. boven Nederland wordt met het luchtvaartuig uitsluitend gevlogen in een gebied waarin het burgerluchtverkeer is
      verboden of beperkt,

      b. met het luchtvaartuig wordt uitsluitend gevlogen indien de door Onze minister van Defensie vastgestelde
      instructies in acht worden genomen met betrekking tot:

      1°. een veilige lancering,

      2°. het voor en na elke vlucht uitvoeren van een functionele en een technische inspectie,

      3°. het onderhoud van het luchtvaartuig,

      4°. het per parachute op een veilige wijze en binnen het aangewezen landingsgebied doen landen van het
      luchtvaartuig,

      c. het luchtvaartuig is uitgerust met een zodanige veiligheidsvoorziening dat bij verstoring van of bij het
      verloren gaan van het radiocontact tussen luchtvaartuig en bedieningsstation, de vlucht van het luchtvaartuig wordt
      afgebroken en de landing per parachute wordt ingezet,

      d. het luchtvaartuig is uitgerust met een zodanige veiligheidsvoorziening dat bij het uitvallen van de besturing
      als gevolg van stroomstoring de landing per parachute wordt ingezet.

      7 Van overeenkomstige toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, zijn:

      a. Verordening (EG) nr. 216/2008 van het Europees Parlement en de Raad van 20 februari 2008 tot vaststelling van
      gemeenschappelijke regels op het gebied van burgerluchtvaart en tot oprichting van een Europees Agentschap voor
      de veiligheid van de luchtvaart, houdende intrekking van Richtlijn 91/670/EEG, Verordening (EG) nr. 1592/2002 en
      Richtlijn 2004/36/EG (PbEU L 79);

      b. Verordening (EG) nr. 1702/2003 van de Commissie van de Europese Gemeenschappen van 24 september 2003 tot
      vaststelling van uitvoeringsvoorschriften inzake de luchtwaardigheid en milieucertificering van luchtvaartuigen
      en aanverwante producten, onderdelen en uitrustingsstukken, alsmede voor de certificering van ontwerp- en
      productieorganisaties (PbEU L 243), en

      c. Verordening (EG) nr. 2042/2003 van de Commissie van de Europese Gemeenschappen van 20 november 2003 betreffende
      de permanente luchtwaardigheid van luchtvaartuigen en luchtvaartproducten, -onderdelen en -uitrustingsstukken, en
      betreffende de goedkeuring van bij voornoemde taken betrokken organisaties en personen (PbEU L 315),

      met dien verstande dat bij ministeriële regeling nadere regels kunnen worden gesteld.


