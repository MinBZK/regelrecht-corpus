preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 25 mei 1983, Directie
    Verzetsdeelnemers en Vervolgden, nr. U 3947 II, de Staatssecretaris van Sociale Zaken en Werkgelegenheid, L. de
    Graaf en de Staatssecretaris van Defensie, W. K. Hoekzema;

    Overwegende dat het wenselijk is een regeling te treffen tot compensatie van de motorrijtuigenbelasting ten
    behoeve van degenen die op 31 maart 1983 vrijstelling van motorrijtuigenbelasting wegens invaliditeit genoten
    en per gelijke datum in het genot waren van een uitkering of pensioen krachtens de wetten of regelingen voor
    oorlogsgetroffenen;

    Gelet op artikel 89 van de Grondwet;

    De Raad van State gehoord (advies van 3 augustus 1983, nr. W 13.83 0325/18.3.30);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 7 juni 1984, Directie
    Verzetsdeelnemers en Vervolgden, nr. 4277;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003681/1995-11-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder Onze Ministers: Onze Minister van Volksgezondheid, Welzijn en Sport en Onze
      Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0003681/1995-11-24#Artikel1
  - number: '2'
    text: 'Aan degene die op 31 maart 1983:'
    url: https://wetten.overheid.nl/BWBR0003681/1995-11-24#Artikel2
  - number: 2.a
    text: |-
      op grond van zijn invaliditeit, ziekten of gebreken in het genot was van enige uitkering,
      onder welke benaming ook, ingevolge de [Wet buitengewoon pensioen 1940-1945][ref1],
      de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref2], de
      [Wet buitengewoon pensioen Indisch verzet][ref3], de [Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref4], de
      [Wet uitkeringen burger-oorlogsslachtoffers 1940-1945][ref5] of de Algemene Oorlogsongevallen Regeling, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0002032
      [ref2]: https://wetten.overheid.nl/BWBR0002035
      [ref3]: https://wetten.overheid.nl/BWBR0003968
      [ref4]: https://wetten.overheid.nl/BWBR0002844
      [ref5]: https://wetten.overheid.nl/BWBR0003664
    url: https://wetten.overheid.nl/BWBR0003681/1995-11-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002032
      - id: ref2
        bwb_id: BWBR0002035
      - id: ref3
        bwb_id: BWBR0003968
      - id: ref4
        bwb_id: BWBR0002844
      - id: ref5
        bwb_id: BWBR0003664
  - number: 2.b
    text: |-
      uit hoofde van ziekten of gebreken ontstaan of verergerd als gevolg van tijdens oorlogs- of daarmee vergelijkbare
      omstandigheden verrichte militaire dienst in het genot was van een pensioen krachtens de Algemene militaire
      pensioenwet (*Stb.* 1966, 445) of een vroegere militaire pensioenwet als bedoeld in artikel A 1, eerste lid, onder
      *j,* van de Algemene militaire pensioenwet,
    url: https://wetten.overheid.nl/BWBR0003681/1995-11-24#Artikel2
  - number: '3'
    text: |-
      Indien aan de houder van een motorvoertuig vrijstelling van motorrijtuigenbelasting wegens invaliditeit was
      verleend in verband met het vervoer van de in [artikel 2][ref1] bedoelde uitkeringsgerechtigde, vindt het bepaalde
      in [artikel 2][ref2] overeenkomstige toepassing, indien en voor zover de omstandigheden op grond waarvan de
      vrijstelling werd verleend, ongewijzigd blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003681#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003681#Artikel2
    url: https://wetten.overheid.nl/BWBR0003681/1995-11-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003681
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003681
        artikel: '2'
  - number: '4'
    text: |-
      Bij teruggaaf van motorrijtuigenbelasting als bedoeld in de [artikelen 18][ref1] en
      [20 van de Wet op de motorrijtuigenbelasting 1994][ref2] aan degene aan wie op grond van [artikel 2][ref3] of 3
      compensatie van de door hem verschuldigde motorrijtuigenbelasting is verleend, valt het terug te geven bedrag toe
      aan het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0003681#Artikel2
    url: https://wetten.overheid.nl/BWBR0003681/1995-11-24#Artikel4
    references:
      - id: ref1
