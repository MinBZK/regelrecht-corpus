        artikel: '18'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0003681
        artikel: '2'
  - number: '5'
    text: |-
      Onze Ministers zijn belast met de toepassing en uitvoering van dit besluit. Zij kunnen ter zake nadere regelen en
      voorwaarden stellen.
    url: https://wetten.overheid.nl/BWBR0003681/1995-11-24#Artikel5
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst en werkt terug tot 1 april 1983.
    url: https://wetten.overheid.nl/BWBR0003681/1995-11-24#Artikel6
