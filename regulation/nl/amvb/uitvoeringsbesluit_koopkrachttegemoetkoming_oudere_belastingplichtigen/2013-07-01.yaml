preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 9 november 2010, nr. IVV/
    OOG/2010/21091, gedaan in overeenstemming met de Staatssecretaris van Financiën en Onze Minister van Binnenlandse
    Zaken en Koninkrijksrelaties;

    Gelet op artikel 3 van de Wet mogelijkheid koopkrachttegemoetkoming oudere belastingplichtigen, artikel 7, eerste
    lid, van de Remigratiewet, artikel 34, eerste lid, van de Wet op de loonbelasting 1964 en artikel 17b, zesde lid,
    van de Algemene Ouderdomswet;

    De Afdeling advisering van de Raad van State gehoord (advies van 9 december 2010, nr. W12.10.0510/III);

    Gezien het nader rapport van de Onze Minister van Sociale Zaken en Werkgelegenheid van 18 mei 2011, nr. IVV/
    OOG/2011/8650, uitgebracht in overeenstemming met de Staatssecretaris van Financiën en Onze Minister van
    Binnenlandse Zaken en Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0030031/2013-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De tegemoetkoming, bedoeld in
      [artikel 3 van de Wet mogelijkheid koopkrachttegemoetkoming oudere belastingplichtigen][ref1], bedraagt € 25,16
      per kalendermaand.

      2 Dit bedrag wordt jaarlijks aangepast overeenkomstig de tabelcorrectiefactor, bedoeld in
      [artikel 10.2 van de Wet inkomstenbelasting 2001][ref2].

      3 Van het aangepaste bedrag en de dag waarop deze aanpassing plaatsvindt, wordt door Onze Minister mededeling
      gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10.2
    url: https://wetten.overheid.nl/BWBR0030031/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029984
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '10.2'
  - number: '2'
    text: |-
      1 Met betrekking tot de periode in het kalenderjaar nadat een persoon de leeftijd heeft bereikt waarop recht kan
      ontstaan op de ouderenkorting of in een ander land is gaan wonen wordt voor de vaststelling of ten minste 90%
      van zijn wereldinkomen, na toepassing van regelingen ter voorkoming van dubbele belasting, in Nederland aan de
      belastingheffing naar het inkomen zal zijn onderworpen het erop volgende kalenderjaar in aanmerking genomen.

      2 Met betrekking tot de periode in het kalenderjaar voordat een persoon in een ander land is gaan wonen wordt voor
      de vaststelling of ten minste 90% van zijn wereldinkomen, na toepassing van regelingen ter voorkoming van dubbele
      belasting, in Nederland aan de belastingheffing naar het inkomen zal zijn onderworpen het voorafgaande kalenderjaar
      in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0030031/2013-07-01#Artikel2
  - number: '6'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de
      [Wet mogelijkheid koopkrachttegemoetkoming oudere belastingplichtigen][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0029984
