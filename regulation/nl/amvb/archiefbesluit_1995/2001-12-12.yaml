---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: archiefbesluit_1995
regulatory_layer: AMVB
publication_date: '2022-12-01'
valid_from: '2001-12-12'
bwb_id: BWBR0007748
url: https://wetten.overheid.nl/BWBR0007748/2001-12-12
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, A. Nuis, van 6 september 1995,
    95022683/8010, directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 9, eerste lid, 12, tweede lid, 21, eerste en tweede lid, 23, vierde lid, 25, tweede lid,
    onderdeel b, en 41, tweede lid, van de Archiefwet 1995;

    Gezien het advies van de Raad voor het cultuurbeheer;

    De Raad van State gehoord (advies van 31 oktober 1995, nr. W05.95.0489);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, A. Nuis, van 12 december
    1995, 95031870/8010, directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Archiefwet 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: 1.b
    text: |-
      selectielijsten: selectielijsten als bedoeld in [artikel 5][ref1] van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel5
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '5'
  - number: '2.1'
    text: |-
      Bij het ontwerpen en vaststellen van selectielijsten, bij besluiten omtrent de vervanging van archiefbescheiden
      door reprodukties en bij besluiten omtrent de vervreemding van archiefbescheiden wordt rekening gehouden met:
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel2
  - number: 2.1.a
    text: de taak van het desbetreffende overheidsorgaan;
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel2
  - number: 2.1.b
    text: de verhouding van dit overheidsorgaan tot andere overheidsorganen;
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel2
  - number: 2.1.c
    text: de waarde van de archiefbescheiden als bestanddeel van het cultureel erfgoed; en
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel2
  - number: 2.1.d
    text: |-
      het belang van de in de archiefbescheiden voorkomende gegevens voor overheidsorganen, voor recht- of
      bewijszoekenden en voor historisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel2
  - number: '2.2'
    text: Selectielijsten worden vastgesteld voor de duur van ten hoogste twintig jaar.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel2
  - number: '3.1'
    text: 'De zorgdrager betrekt bij het ontwerpen van een selectielijst ten minste:'
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel3
  - number: 3.1.a
    text: |-
      één of meer personen die deskundig zijn ten aanzien van de organisatie en taken van het desbetreffende
      overheidsorgaan;
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel3
  - number: 3.1.b
    text: |-
      één of meer personen die deskundig zijn ten aanzien van het beheer van de nog niet naar een archiefbewaarplaats
      overgebrachte archiefbescheiden van het desbetreffende overheidsorgaan;
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel3
  - number: 3.1.c
    text: de algemene rijksarchivaris;
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel3
  - number: 3.1.d
    text: |-
      indien het archiefbescheiden van een provincie of archiefbescheiden als bedoeld in [artikel 40, eerste lid][ref1],
      van de wet betreft, tevens de provinciaal inspecteur;


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel40
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '40'
  - number: 3.1.e
    text: |-
      indien het archiefbescheiden van een gemeente of waterschap betreft, tevens de provinciaal inspecteur en, indien
      benoemd, de gemeentearchivaris onderscheidenlijk waterschapsarchivaris.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel3
  - number: '3.2'
    text: |-
      Indien twee of meer provincies gezamenlijk een selectielijst ontwerpen, kan in afwijking van het eerste lid,
      onderdeel *d*, volstaan worden met de betrokkenheid van een provinciaal inspecteur.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel3
  - number: '3.3'
    text: |-
      Indien twee of meer gemeenten of waterschappen gezamenlijk een selectielijst ontwerpen, kan in afwijking van
      het eerste lid, onderdeel *e*, volstaan worden met de betrokkenheid van een provinciaal inspecteur en een
      gemeentearchivaris, onderscheidenlijk waterschapsarchivaris.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel3
  - number: '4.1'
    text: |-
      Op een door de zorgdrager opgesteld ontwerp van een selectielijst is de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '4.2'
    text: Onze minister legt het ontwerp, alvorens de Raad voor cultuur te horen, voor een periode van acht weken ter inzage.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel4
  - number: '4.3'
    text: Een ieder kan zijn zienswijze over het ontwerp naar voren brengen bij Onze minister.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel4
  - number: '5'
    text: 'Een selectielijst bestaat ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel5
  - number: 5.a
    text: een titel waaruit blijkt op welk overheidsorgaan de selectielijst betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel5
  - number: 5.b
    text: een opsomming van de taken van dat overheidsorgaan;
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel5
  - number: 5.c
    text: |-
      een systematische opsomming van categorieën archiefbescheiden, waarin bij iedere categorie is aangegeven of de
      archiefbescheiden bewaard worden dan wel na welke termijn zij voor vernietiging in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel5
  - number: 5.d
    text: 'een toelichting die in ieder geval bevat:'
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel5
  - number: 5.d.1°
    text: |-
      een verantwoording van de wijze waarop toepassing is gegeven aan [artikel 2, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel2
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '2'
        hoofdstuk: II
  - number: 5.d.2°
    text: |-
      een verslag van de wijze waarop derden en met name de deskundigen, bedoeld in [artikel 3][ref1], bij het ontwerpen
      van de selectielijst betrokken zijn en van de inhoud van het met hen gevoerde overleg, en


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel3
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '3'
        hoofdstuk: II
  - number: 5.d.3°
    text: |-
      een verslag van de procedure, bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel4
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '4'
        hoofdstuk: II
  - number: 5.e
    text: |-
      een opsomming van de criteria aan de hand waarvan de zorgdrager archiefbescheiden die ingevolge de selectielijst
      voor vernietiging in aanmerking komen, van vernietiging kan uitzonderen.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel5
  - number: '6.1'
    text: |-
      De zorgdrager besluit tot vervanging van archiefbescheiden door reprodukties slechts indien de vervanging geschiedt
      met juiste en volledige weergave van de in de te vervangen archiefbescheiden voorkomende gegevens.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel6
  - number: '6.2'
    text: |-
      De zorgdrager maakt zowel bij een aanvraag om een machtiging als bedoeld in [artikel 7][ref1] van de wet, als bij
      de bekendmaking van een besluit als bedoeld in het eerste lid melding van de wijze waarop toepassing is gegeven aan
      [artikel 2, eerste lid, onderdelen ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007748#Artikel2
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007748
        artikel: '2'
        hoofdstuk: II
  - number: '7.1'
    text: |-
      De zorgdrager betrekt bij de voorbereiding van een besluit tot vervreemding van archiefbescheiden deskundigen als
      bedoeld in [artikel 3, eerste lid][ref1], indien die archiefbescheiden tengevolge van de vervreemding niet komen te
      berusten in een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel3
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '3'
        hoofdstuk: II
  - number: '7.2'
    text: |-
      De zorgdrager maakt zowel bij een aanvraag om een machtiging als bedoeld in [artikel 8, eerste of derde lid][ref1],
      van de wet, als bij de bekendmaking van een besluit als bedoeld in het eerste lid melding van de wijze waarop
      de deskundigen, bedoeld in het eerste lid, bij de voorbereiding betrokken zijn en van de inhoud van het met hen
      gevoerde overleg, alsmede van de wijze waarop toepassing is gegeven aan [artikel 2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007748#Artikel2
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007748
        artikel: '2'
        hoofdstuk: II
  - number: '8'
    text: |-
      De zorgdrager maakt van de vernietiging, vervanging of vervreemding een verklaring op, die ten minste een
      specificatie van de vernietigde, vervangen of vervreemde archiefbescheiden bevat, alsmede aangeeft op grond waarvan
      en op welke wijze de vernietiging, vervanging of vervreemding is geschied. Een exemplaar van deze verklaring wordt
      bewaard door het overheidsorgaan waaronder de archiefbescheiden zouden berusten, indien zij niet waren vernietigd,
      vervangen of vervreemd.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel8
  - number: '9.1'
    text: |-
      De zorgdrager brengt de archiefbescheiden, bedoeld in [artikel 12, eerste lid][ref1], van de wet in perioden over
      naar een archiefbewaarplaats, maar niet later dan tien jaar nadat die archiefbescheiden de leeftijd van twintig
      jaar hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
  - number: '9.2'
    text: |-
      De zorgdrager en de beheerder van de archiefbewaarplaats plegen tijdig overleg over de voorgenomen overbrenging
      van archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel9
  - number: '9.3'
    text: |-
      De zorgdrager en de beheerder van de archiefbewaarplaats maken van de overbrenging gezamenlijk een verklaring op
      die ten minste een specificatie van de archiefbescheiden bevat.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel9
  - number: '10'
    text: |-
      Indien de zorgdrager ingevolge [artikel 15, eerste lid][ref1], van de wet beperkingen aan de openbaarheid
      van archiefbescheiden stelt, wordt het daartoe strekkende besluit gevoegd bij de verklaring, bedoeld in
      [artikel 9, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007748#Artikel9
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0007748
        artikel: '9'
        hoofdstuk: III
  - number: '11.1'
    text: |-
      De zorgdrager treft zodanige voorzieningen ten aanzien van de door hem opgemaakte archiefbescheiden die
      ingevolge een voor hem geldende selectielijst voor bewaring in aanmerking komen, dat bij het raadplegen van die
      archiefbescheiden na ten minste honderd jaar geen noemenswaardige achteruitgang zal zijn te constateren.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel11
  - number: '11.2'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de duurzaamheid van de in het eerste lid bedoelde
      archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel11
  - number: '12'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het in geordende en toegankelijke staat brengen
      en bewaren van archiefbescheiden die ingevolge een selectielijst voor bewaring in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel12
  - number: '13.1'
    text: |-
      De zorgdrager is verplicht zijn archiefruimten en archiefbewaarplaatsen zodanig te situeren, te bouwen en in te
      richten alsmede bij verbouwing en verandering van inrichting zodanige maatregelen te treffen dat de zich daarin
      bevindende archiefbescheiden in geval van een calamiteit zo min mogelijk gevaar lopen.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel13
  - number: '13.2'
    text: |-
      De zorgdrager beveiligt zijn archiefruimten en archiefbewaarplaatsen op toereikende wijze tegen brand, inbraak
      en wateroverlast.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel13
  - number: '13.3'
    text: |-
      De zorgdrager is verplicht in zijn archiefruimten en archiefbewaarplaatsen het klimaat zodanig te beheersen en de
      lucht zodanig te zuiveren dat het natuurlijk verval en de aantasting door milieu-invloeden van archiefbescheiden
      worden beperkt.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel13
  - number: '13.4'
    text: |-
      Bij ministeriële regeling worden in overeenstemming met de Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer nadere regels gesteld omtrent de bouw, verbouwing, inrichting en verandering van inrichting van
      archiefruimten en archiefbewaarplaatsen, alsmede omtrent de ingebruikneming van gebouwen of gedeelten van gebouwen
      als archiefruimte of archiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel13
  - number: '14'
    text: |-
      De zorgdragers, genoemd in de [artikelen 23, eerste lid][ref1], en [41, eerste lid][ref2], van de wet stellen ten
      aanzien van hun archiefbescheiden beheersregels vast. Zij voorzien in voldoende ruimte voor hun archiefbescheiden
      en zij stellen voldoende, deskundig personeel aan.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel41
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '41'
  - number: '20'
    text: |-
      [Artikel 13, tweede en derde lid][ref1], blijft ten aanzien van bij de inwerkingtreding van dit besluit bestaande
      archiefruimten en archiefbewaarplaatsen vijf jaar buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel13
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '13'
        hoofdstuk: IV
  - number: '23'
    text: 'Dit besluit wordt aangehaald als: Archiefbesluit 1995.'
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel23
  - number: '24.1'
    text: |-
      De [Archiefwet 1995][ref1] treedt in werking met ingang van 1 januari 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '24.2'
    text: |-
      Dit besluit treedt op hetzelfde tijdstip in werking, met uitzondering van de [artikelen 11, tweede lid][ref1],
      [12][ref2] en [13, vierde lid][ref3], die in werking treden op een nader bij koninklijk besluit te bepalen
      tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007748#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007748#Artikel13
    url: https://wetten.overheid.nl/BWBR0007748/2001-12-12#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '11'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007748
        artikel: '12'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0007748
        artikel: '13'
        hoofdstuk: IV
