---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: archiefbesluit_1995
regulatory_layer: AMVB
publication_date: '2022-12-01'
valid_from: '2020-01-01'
bwb_id: BWBR0007748
url: https://wetten.overheid.nl/BWBR0007748/2020-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, A. Nuis, van 6 september 1995,
    95022683/8010, directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 9, eerste lid, 12, tweede lid, 21, eerste en tweede lid, 23, vierde lid, 25, tweede lid,
    onderdeel b, en 41, tweede lid, van de Archiefwet 1995;

    Gezien het advies van de Raad voor het cultuurbeheer;

    De Raad van State gehoord (advies van 31 oktober 1995, nr. W05.95.0489);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, A. Nuis, van 12 december
    1995, 95031870/8010, directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Archiefwet 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: 1.b
    text: |-
      selectielijsten: selectielijsten als bedoeld in [artikel 5][ref1] van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel5
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '5'
  - number: '2.1'
    text: |-
      Bij het ontwerpen en vaststellen van selectielijsten, bij besluiten omtrent de vervanging van archiefbescheiden
      door reprodukties en bij besluiten omtrent de vervreemding van archiefbescheiden wordt rekening gehouden met:
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel2
  - number: 2.1.a
    text: de taak van het desbetreffende overheidsorgaan;
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel2
  - number: 2.1.b
    text: de verhouding van dit overheidsorgaan tot andere overheidsorganen;
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel2
  - number: 2.1.c
    text: de waarde van de archiefbescheiden als bestanddeel van het cultureel erfgoed; en
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel2
  - number: 2.1.d
    text: |-
      het belang van de in de archiefbescheiden voorkomende gegevens voor overheidsorganen, voor recht- of
      bewijszoekenden en voor historisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel2
  - number: '2.2'
    text: Selectielijsten worden vastgesteld voor de duur van ten hoogste twintig jaar.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel2
  - number: '3.1'
    text: 'De zorgdrager betrekt bij het ontwerpen van een selectielijst ten minste:'
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel3
  - number: 3.1.a
    text: |-
      de persoon die hij binnen zijn organisatie uit hoofde van diens verantwoordelijkheid voor de informatiehuishouding
      daartoe heeft aangewezen;
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel3
  - number: 3.1.b
    text: |-
      indien deze is aangewezen de archivaris die de beheerder is van de archiefbewaarplaats die is bestemd of mede is
      bestemd voor de bewaring van de archiefbescheiden van de zorgdrager;
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel3
  - number: 3.1.c
    text: |-
      in afwijking van onderdeel b de algemene rijksarchivaris indien de in dat onderdeel bedoelde archiefbewaarplaats
      een rijksarchiefbewaarplaats is;
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel3
  - number: 3.1.d
    text: |-
      een deskundige op het terrein van de relatie tussen burger en overheid en de betekenis van overheidsinformatie voor
      deze relatie.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      Indien de gedeputeerde staten van twee of meer provincies, de colleges van burgemeester en wethouders van twee of
      meer gemeenten, of de besturen van twee of meer waterschappen gezamenlijk een selectielijst ontwerpen, kan volstaan
      worden met de betrokkenheid van een aangewezen persoon als bedoeld in het eerste lid, onderdeel a, en met de
      betrokkenheid van een provinciearchivaris, onderscheidenlijk gemeentearchivaris of waterschapsarchivaris.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel3
  - number: 3a.1
    text: |-
      De zorgdrager ten aanzien van de archiefbewaarplaats die is bestemd of mede is bestemd voor de bewaring van de
      archiefbescheiden van de zorgdrager, bedoeld in [artikel 3][ref1], benoemt de deskundige, bedoeld in artikel 3,
      eerste lid, onderdeel d, op voordracht van de personen, bedoeld in artikel 3, eerste lid, onderdelen a tot en met
      c.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel3
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '3'
        hoofdstuk: II
  - number: 3a.2
    text: |-
      De deskundige verricht anders dan uit hoofde van zijn benoeming geen werkzaamheden voor de zorgdrager, bedoeld
      in [artikel 3][ref1], noch verricht hij werkzaamheden voor de zorgdrager die hem heeft benoemd, noch heeft
      hij anderszins belangen of functies waardoor de onafhankelijkheid van zijn inbreng of het vertrouwen in die
      onafhankelijkheid in het geding kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel3
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '3'
        hoofdstuk: II
  - number: '4.1'
    text: |-
      Op de voorbereiding van een selectielijst is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.
      Onze minister geeft toepassing aan deze procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '4.2'
    text: Zienswijzen kunnen naar voren worden gebracht door een ieder.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel4
  - number: '5.1'
    text: 'Een selectielijst bestaat ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel5
  - number: 5.1.a
    text: een titel waaruit blijkt op welk overheidsorgaan de selectielijst betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel5
  - number: 5.1.b
    text: een opsomming van de taken van dat overheidsorgaan;
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel5
  - number: 5.1.c
    text: |-
      een systematische opsomming van categorieën archiefbescheiden, waarin bij iedere categorie is aangegeven of de
      archiefbescheiden bewaard worden dan wel na welke termijn zij voor vernietiging in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel5
  - number: 5.1.d
    text: 'een toelichting die in ieder geval bevat:'
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel5
  - number: 5.1.d.1°
    text: |-
      een verantwoording van de wijze waarop toepassing is gegeven aan [artikel 2, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel2
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '2'
        hoofdstuk: II
  - number: 5.1.d.2°
    text: |-
      een verslag van de wijze waarop derden en in elk geval de personen, bedoeld in [artikel 3, eerste lid][ref1], bij
      het ontwerpen van de selectielijst betrokken zijn en van de inhoud van het met hen gevoerde overleg, en


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel3
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '3'
        hoofdstuk: II
  - number: 5.1.d.3°
    text: |-
      een verslag van de procedure, bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel4
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '4'
        hoofdstuk: II
  - number: 5.1.e
    text: |-
      een opsomming van de criteria aan de hand waarvan de zorgdrager archiefbescheiden die ingevolge de selectielijst
      voor vernietiging in aanmerking komen, van vernietiging kan uitzonderen.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel5
  - number: '5.2'
    text: |-
      De systematische opsomming, bedoeld in het eerste lid, onderdeel c, is in overeenstemming met de voor het archief
      geldende ordeningsstructuur.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel5
  - number: '6.1'
    text: |-
      De zorgdrager besluit tot vervanging van archiefbescheiden door reprodukties slechts indien de vervanging geschiedt
      met juiste en volledige weergave van de in de te vervangen archiefbescheiden voorkomende gegevens.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel6
  - number: '6.2'
    text: |-
      De zorgdrager maakt bij de bekendmaking van een besluit als bedoeld in het eerste lid melding van de wijze waarop
      toepassing is gegeven aan [artikel 2, eerste lid, onderdelen c en d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel2
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '2'
        hoofdstuk: II
  - number: '6.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de vervanging, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      De zorgdrager betrekt bij de voorbereiding van een besluit tot vervreemding van archiefbescheiden personen als
      bedoeld in [artikel 3, eerste lid, onderdelen a tot en met c][ref1], indien die archiefbescheiden tengevolge van de
      vervreemding niet komen te berusten in een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel3
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '3'
        hoofdstuk: II
  - number: '7.2'
    text: |-
      De zorgdrager maakt zowel bij een aanvraag om een machtiging als bedoeld in
      [artikel 8, eerste of derde lid, van de wet][ref1], als bij de bekendmaking van een besluit als bedoeld in het
      eerste lid melding van de wijze waarop de personen, bedoeld in het eerste lid, bij de voorbereiding betrokken
      zijn en van de inhoud van het met hen gevoerde overleg, alsmede van de wijze waarop toepassing is gegeven aan
      [artikel 2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007748#Artikel2
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007748
        artikel: '2'
        hoofdstuk: II
  - number: '8'
    text: |-
      De zorgdrager maakt van de vernietiging, vervanging of vervreemding een verklaring op, die ten minste een
      specificatie van de vernietigde, vervangen of vervreemde archiefbescheiden bevat, alsmede aangeeft op grond waarvan
      en op welke wijze de vernietiging, vervanging of vervreemding is geschied. Een exemplaar van deze verklaring wordt
      bewaard door het overheidsorgaan waaronder de archiefbescheiden zouden berusten, indien zij niet waren vernietigd,
      vervangen of vervreemd.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel8
  - number: '9.1'
    text: |-
      De zorgdrager brengt de archiefbescheiden, bedoeld in [artikel 12, eerste lid][ref1], van de wet in perioden over
      naar een archiefbewaarplaats, maar niet later dan tien jaar nadat die archiefbescheiden de leeftijd van twintig
      jaar hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
  - number: '9.2'
    text: |-
      De zorgdrager en de beheerder van de archiefbewaarplaats plegen tijdig overleg over de voorgenomen overbrenging
      van archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel9
  - number: '9.3'
    text: |-
      De zorgdrager en de beheerder van de archiefbewaarplaats maken van de overbrenging gezamenlijk een verklaring op
      die ten minste een specificatie van de archiefbescheiden bevat.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel9
  - number: '10'
    text: |-
      Indien de zorgdrager ingevolge [artikel 15, eerste lid][ref1], van de wet beperkingen aan de openbaarheid
      van archiefbescheiden stelt, wordt het daartoe strekkende besluit gevoegd bij de verklaring, bedoeld in
      [artikel 9, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007748#Artikel9
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0007748
        artikel: '9'
        hoofdstuk: III
  - number: '11.1'
    text: |-
      De zorgdrager treft zodanige voorzieningen ten aanzien van de door hem opgemaakte archiefbescheiden die
      ingevolge een voor hem geldende selectielijst voor bewaring in aanmerking komen, dat bij het raadplegen van die
      archiefbescheiden na ten minste honderd jaar geen noemenswaardige achteruitgang zal zijn te constateren.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel11
  - number: '11.2'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de duurzaamheid van de in het eerste lid bedoelde
      archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel11
  - number: '12'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het in geordende en toegankelijke staat brengen
      en bewaren van archiefbescheiden die ingevolge een selectielijst voor bewaring in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel12
  - number: '13.1'
    text: |-
      De zorgdrager is verplicht zijn archiefruimten en archiefbewaarplaatsen zodanig te situeren, te bouwen en in te
      richten alsmede bij verbouwing en verandering van inrichting zodanige maatregelen te treffen dat de zich daarin
      bevindende archiefbescheiden in geval van een calamiteit zo min mogelijk gevaar lopen.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel13
  - number: '13.2'
    text: |-
      De zorgdrager beveiligt zijn archiefruimten en archiefbewaarplaatsen op toereikende wijze tegen brand, inbraak
      en wateroverlast.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel13
  - number: '13.3'
    text: |-
      De zorgdrager is verplicht in zijn archiefruimten en archiefbewaarplaatsen het klimaat zodanig te beheersen en de
      lucht zodanig te zuiveren dat het natuurlijk verval en de aantasting door milieu-invloeden van archiefbescheiden
      worden beperkt.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel13
  - number: '13.4'
    text: |-
      Bij ministeriële regeling worden in overeenstemming met de Minister voor Wonen, Wijken en Integratie nadere
      regels gesteld omtrent de bouw, verbouwing, inrichting en verandering van inrichting van archiefruimten en
      archiefbewaarplaatsen, alsmede omtrent de ingebruikneming van gebouwen of gedeelten van gebouwen als archiefruimte
      of archiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel13
  - number: '14'
    text: |-
      De zorgdragers, genoemd in de [artikelen 23, eerste lid][ref1], en [41, eerste lid][ref2], van de wet stellen ten
      aanzien van hun archiefbescheiden beheersregels vast. Zij voorzien in voldoende ruimte voor hun archiefbescheiden
      en zij stellen voldoende, deskundig personeel aan.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel41
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '41'
  - number: '15.1'
    text: 'Er zijn twee diploma’s in de archivistiek:'
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel15
  - number: 15.1.a
    text: |-
      het diploma archivistiek A, dat wordt verkregen door met goed gevolg het afsluitend examen af
      te leggen, dat is verbonden aan een opleiding in het wetenschappelijk onderwijs, bedoeld in
      [artikel 1.1, onderdeel c, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 15.1.b
    text: |-
      het diploma archivistiek B, dat wordt verkregen door met goed gevolg het afsluitend examen
      af te leggen, dat is verbonden aan een opleiding in het hoger beroepsonderwijs, bedoeld in
      [artikel 1.1, onderdeel d, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '15.2'
    text: |-
      Op aanvraag van een instelling voor wetenschappelijk onderwijs kan Onze minister een opleiding als bedoeld in
      het eerste lid, onder a, aanwijzen als een opleiding ter verkrijging van het diploma archivistiek A, indien de
      onderwijseenheden van die opleiding de archivistiek naar zijn oordeel in voldoende mate betreffen.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel15
  - number: '15.3'
    text: |-
      Op aanvraag van een instelling voor hoger beroepsonderwijs kan Onze minister een opleiding als bedoeld in het
      eerste lid, onder b, aanwijzen als een opleiding ter verkrijging van het diploma archivistiek B, indien de
      onderwijseenheden van die opleiding de archivistiek naar zijn oordeel in voldoende mate betreffen.
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel15
  - number: '20'
    text: |-
      [Artikel 13, tweede en derde lid][ref1], blijft ten aanzien van bij de inwerkingtreding van dit besluit bestaande
      archiefruimten en archiefbewaarplaatsen vijf jaar buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel13
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '13'
        hoofdstuk: IV
  - number: 20a
    text: |-
      Een besluit tot aanwijzing dat is genomen op grond van [artikel 2, tweede lid][ref1], of
      [artikel 3, tweede lid, van het Tijdelijk besluit opleidingen en diploma’s archivistiek][ref2], geldt als een
      besluit op grond van [artikel 15, tweede, onderscheidenlijk derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007749#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007749#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007748#Artikel15
    url: https://wetten.overheid.nl/BWBR0007748/2020-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0007749
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007749
        artikel: '3'
