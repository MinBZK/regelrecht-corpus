preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, A. Nuis, van 6 september 1995,
    95022683/8010, directie Wetgeving en Juridische Zaken;


    Gelet op de artikelen 9, eerste lid, 12, tweede lid, 21, eerste en tweede lid, 23, vierde lid, 25, tweede lid,
    onderdeel b, en 41, tweede lid, van de Archiefwet 1995;


    Gezien het advies van de Raad voor het cultuurbeheer;


    De Raad van State gehoord (advies van 31 oktober 1995, nr. W05.95.0489);


    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, A. Nuis, van 12 december
    1995, 95031870/8010, directie Wetgeving en Juridische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Archiefwet 1995][ref1];

      b. selectielijsten: selectielijsten als bedoeld in [artikel 5][ref2] van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel5
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007376
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '5'
  - number: '2'
    text: >-
      1 Bij het ontwerpen en vaststellen van selectielijsten, bij besluiten omtrent de vervanging van archiefbescheiden
      door reprodukties en bij besluiten omtrent de vervreemding van archiefbescheiden wordt rekening gehouden met:


      a. de taak van het desbetreffende overheidsorgaan;


      b. de verhouding van dit overheidsorgaan tot andere overheidsorganen;


      c. de waarde van de archiefbescheiden als bestanddeel van het cultureel erfgoed; en


      d. het belang van de in de archiefbescheiden voorkomende gegevens voor overheidsorganen, voor recht- of
      bewijszoekenden en voor historisch onderzoek.


      2 Selectielijsten worden vastgesteld voor de duur van ten hoogste twintig jaar.
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel2
  - number: '3'
    text: |-
      1 De zorgdrager betrekt bij het ontwerpen van een selectielijst ten minste:

      a. één of meer personen die deskundig zijn ten aanzien van de organisatie en taken van het desbetreffende
      overheidsorgaan;

      b. één of meer personen die deskundig zijn ten aanzien van het beheer van de nog niet naar een archiefbewaarplaats
      overgebrachte archiefbescheiden van het desbetreffende overheidsorgaan;

      c. de algemene rijksarchivaris;

      d. indien het archiefbescheiden van een provincie of archiefbescheiden als bedoeld in
      [artikel 40, eerste lid][ref1], van de wet betreft, tevens de provinciaal inspecteur;

      e. indien het archiefbescheiden van een gemeente of waterschap betreft, tevens de provinciaal inspecteur en, indien
      benoemd, de gemeentearchivaris onderscheidenlijk waterschapsarchivaris.

      2 Indien gedeputeerde staten van twee of meer provincies gezamenlijk een selectielijst ontwerpen, kan in afwijking
      van het eerste lid, onderdeel *d*, volstaan worden met de betrokkenheid van een provinciaal inspecteur.

      3 Indien de colleges van burgemeester en wethouders van twee of meer gemeenten of de besturen van twee of meer
      waterschappen gezamenlijk een selectielijst ontwerpen, kan in afwijking van het eerste lid, onderdeel *e*,
      volstaan worden met de betrokkenheid van een provinciaal inspecteur en een gemeentearchivaris, onderscheidenlijk
      waterschapsarchivaris.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel40
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '40'
  - number: '4'
    text: |-
      1 Op de voorbereiding van een selectielijst is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing. Onze minister geeft toepassing aan deze procedure.

      2 De termijn voor het uitbrengen van een advies door de Raad voor cultuur bedraagt acht weken.

      3 Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '5'
    text: |-
      Een selectielijst bestaat ten minste uit:

      a. een titel waaruit blijkt op welk overheidsorgaan de selectielijst betrekking heeft;

      b. een opsomming van de taken van dat overheidsorgaan;

      c. een systematische opsomming van categorieën archiefbescheiden, waarin bij iedere categorie is aangegeven of de
      archiefbescheiden bewaard worden dan wel na welke termijn zij voor vernietiging in aanmerking komen;

      d. een toelichting die in ieder geval bevat:

      1°. een verantwoording van de wijze waarop toepassing is gegeven aan [artikel 2, eerste lid][ref1],

      2°. een verslag van de wijze waarop derden en met name de deskundigen, bedoeld in [artikel 3][ref2], bij het
      ontwerpen van de selectielijst betrokken zijn en van de inhoud van het met hen gevoerde overleg, en

      3°. een verslag van de procedure, bedoeld in [artikel 4][ref3];

      e. een opsomming van de criteria aan de hand waarvan de zorgdrager archiefbescheiden die ingevolge de selectielijst
      voor vernietiging in aanmerking komen, van vernietiging kan uitzonderen.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007748#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007748#Artikel4
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007748
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0007748
        artikel: '4'
        hoofdstuk: II
  - number: '6'
    text: |-
      1 De zorgdrager besluit tot vervanging van archiefbescheiden door reprodukties slechts indien de vervanging
      geschiedt met juiste en volledige weergave van de in de te vervangen archiefbescheiden voorkomende gegevens.

      2 De zorgdrager maakt zowel bij een aanvraag om een machtiging als bedoeld in [artikel 7][ref1] van de wet, als bij
      de bekendmaking van een besluit als bedoeld in het eerste lid melding van de wijze waarop toepassing is gegeven aan
      [artikel 2, eerste lid, onderdelen ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007748#Artikel2
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007748
        artikel: '2'
        hoofdstuk: II
  - number: '7'
    text: |-
      1 De zorgdrager betrekt bij de voorbereiding van een besluit tot vervreemding van archiefbescheiden deskundigen als
      bedoeld in [artikel 3, eerste lid][ref1], indien die archiefbescheiden tengevolge van de vervreemding niet komen te
      berusten in een archiefbewaarplaats.

      2 De zorgdrager maakt zowel bij een aanvraag om een machtiging als bedoeld in
      [artikel 8, eerste of derde lid][ref2], van de wet, als bij de bekendmaking van een besluit als bedoeld in het
      eerste lid melding van de wijze waarop de deskundigen, bedoeld in het eerste lid, bij de voorbereiding betrokken
      zijn en van de inhoud van het met hen gevoerde overleg, alsmede van de wijze waarop toepassing is gegeven aan
      [artikel 2, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007748#Artikel2
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007748
        artikel: '2'
        hoofdstuk: II
  - number: '8'
    text: >-
      De zorgdrager maakt van de vernietiging, vervanging of vervreemding een verklaring op, die ten minste een
      specificatie van de vernietigde, vervangen of vervreemde archiefbescheiden bevat, alsmede aangeeft op grond waarvan
      en op welke wijze de vernietiging, vervanging of vervreemding is geschied. Een exemplaar van deze verklaring wordt
      bewaard door het overheidsorgaan waaronder de archiefbescheiden zouden berusten, indien zij niet waren vernietigd,
      vervangen of vervreemd.
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel8
  - number: '9'
    text: |-
      1 De zorgdrager brengt de archiefbescheiden, bedoeld in [artikel 12, eerste lid][ref1], van de wet in perioden over
      naar een archiefbewaarplaats, maar niet later dan tien jaar nadat die archiefbescheiden de leeftijd van twintig
      jaar hebben bereikt.

      2 De zorgdrager en de beheerder van de archiefbewaarplaats plegen tijdig overleg over de voorgenomen overbrenging
      van archiefbescheiden.

      3 De zorgdrager en de beheerder van de archiefbewaarplaats maken van de overbrenging gezamenlijk een verklaring op
      die ten minste een specificatie van de archiefbescheiden bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
  - number: '10'
    text: |-
      Indien de zorgdrager ingevolge [artikel 15, eerste lid][ref1], van de wet beperkingen aan de openbaarheid
      van archiefbescheiden stelt, wordt het daartoe strekkende besluit gevoegd bij de verklaring, bedoeld in
      [artikel 9, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007748#Artikel9
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0007748
        artikel: '9'
        hoofdstuk: III
  - number: '11'
    text: >-
      1 De zorgdrager treft zodanige voorzieningen ten aanzien van de door hem opgemaakte archiefbescheiden die
      ingevolge een voor hem geldende selectielijst voor bewaring in aanmerking komen, dat bij het raadplegen van die
      archiefbescheiden na ten minste honderd jaar geen noemenswaardige achteruitgang zal zijn te constateren.


      2 Bij ministeriële regeling worden nadere regels gesteld omtrent de duurzaamheid van de in het eerste lid bedoelde
      archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel11
  - number: '12'
    text: >-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het in geordende en toegankelijke staat brengen
      en bewaren van archiefbescheiden die ingevolge een selectielijst voor bewaring in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel12
  - number: '13'
    text: >-
      1 De zorgdrager is verplicht zijn archiefruimten en archiefbewaarplaatsen zodanig te situeren, te bouwen en in te
      richten alsmede bij verbouwing en verandering van inrichting zodanige maatregelen te treffen dat de zich daarin
      bevindende archiefbescheiden in geval van een calamiteit zo min mogelijk gevaar lopen.


      2 De zorgdrager beveiligt zijn archiefruimten en archiefbewaarplaatsen op toereikende wijze tegen brand, inbraak
      en wateroverlast.


      3 De zorgdrager is verplicht in zijn archiefruimten en archiefbewaarplaatsen het klimaat zodanig te beheersen en
      de lucht zodanig te zuiveren dat het natuurlijk verval en de aantasting door milieu-invloeden van archiefbescheiden
      worden beperkt.


      4 Bij ministeriële regeling worden in overeenstemming met de Minister voor Wonen, Wijken en Integratie nadere
      regels gesteld omtrent de bouw, verbouwing, inrichting en verandering van inrichting van archiefruimten en
      archiefbewaarplaatsen, alsmede omtrent de ingebruikneming van gebouwen of gedeelten van gebouwen als archiefruimte
      of archiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel13
  - number: '14'
    text: |-
      De zorgdragers, genoemd in de [artikelen 23, eerste lid][ref1], en [41, eerste lid][ref2], van de wet stellen ten
      aanzien van hun archiefbescheiden beheersregels vast. Zij voorzien in voldoende ruimte voor hun archiefbescheiden
      en zij stellen voldoende, deskundig personeel aan.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel41
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '41'
  - number: '15'
    text: |-
      1 Er zijn twee diploma’s in de archivistiek:

      a. het diploma archivistiek A, dat wordt verkregen door met goed gevolg het afsluitend examen
      af te leggen, dat is verbonden aan een opleiding in het wetenschappelijk onderwijs, bedoeld in
      [artikel 1.1, onderdeel c, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1]; en

      b. het diploma archivistiek B, dat wordt verkregen door met goed gevolg het afsluitend examen
      af te leggen, dat is verbonden aan een opleiding in het hoger beroepsonderwijs, bedoeld in
      [artikel 1.1, onderdeel d, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2].

      2 Op aanvraag van een instelling voor wetenschappelijk onderwijs kan Onze minister een opleiding als bedoeld in
      het eerste lid, onder a, aanwijzen als een opleiding ter verkrijging van het diploma archivistiek A, indien de
      onderwijseenheden van die opleiding de archivistiek naar zijn oordeel in voldoende mate betreffen.

      3 Op aanvraag van een instelling voor hoger beroepsonderwijs kan Onze minister een opleiding als bedoeld in
      het eerste lid, onder b, aanwijzen als een opleiding ter verkrijging van het diploma archivistiek B, indien de
      onderwijseenheden van die opleiding de archivistiek naar zijn oordeel in voldoende mate betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0007748/2008-08-20#Artikel15
    references:
      - id: ref1
