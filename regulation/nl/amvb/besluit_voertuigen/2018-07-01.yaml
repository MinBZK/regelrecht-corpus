  - number: 23j
    text: |-
      De in [artikel 70m van de wet][ref1] bedoelde categorieën motorrijtuigen zijn motorrijtuigen van de
      rijbewijscategorie B.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70m
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel23j
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70m
  - number: 23k
    text: |-
      Erkende bedrijven verstrekken aan de Dienst Wegverkeer de tellerstand van een motorrijtuig van de
      rijbewijscategorie B bij:

      a. opname in de bedrijfsvoorraad als bedoeld in [artikel 62 van de wet][ref1];

      b. beëindiging van de tenaamstelling als bedoeld in [artikel 66a van de wet][ref2];

      c. afgifte van een keuringsbewijs als bedoeld in [artikel 72 van de wet][ref3];

      d. het waarborgen dat een wijziging in de bouw of inrichting van een voertuig aan de eisen voldoet als bedoeld in
      [artikel 100, eerste lid, van de wet][ref4];

      e. het waarborgen dat een voertuig aan de eisen voldoet als bedoeld in [artikel 106a, eerste lid, van de wet][ref5];

      f. het inbouwen van een alcoholslot als bedoeld in [artikel 132f, eerste lid, van de wet][ref6];

      g. melding van het voorgoed buiten Nederland brengen van een voertuig als bedoeld in
      [artikel 46, tweede lid, onder b, Kentekenreglement][ref7];

      h. melding dat tot de bedrijfsvoorraad behorende voertuigen voorgoed buiten gebruik worden gesteld als bedoeld in
      [artikel 46, tweede lid, onder c, Kentekenreglement][ref8];

      i. het indienen van een aanvraag van een tenaamstelling als bedoeld in
      [artikel 46, tweede lid, onder d, Kentekenreglement][ref9];

      j. werkzaamheden aan de boordcomputer taxi krachtens het [Besluit personenvervoer 2000][ref10];

      k. onderhoud en reparaties, voor zover deze bedrijfsmatig worden verricht, waarvoor een bedrag van meer dan € 150
      verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
