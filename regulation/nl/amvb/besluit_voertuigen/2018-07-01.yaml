preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 4 december 2008, nr. CEND/HDJZ-2008/1657 sector
    AWW, Hoofddirectie Juridische Zaken;

    Gelet op de artikelen 34, eerste lid, 73, tweede lid, onderdelen a en b, 81, eerste lid, en 91, tweede lid, en 179,
    derde lid, van de Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 17 december 2008, nr. W09.08.0530/IV);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 12 februari 2009, nr. CEND/HJDZ-2009/51
    sector AWW, Hoofddirectie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *wet:* [Wegenverkeerswet 1994](onbekend).
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden om radarontvangstapparaten die geschikt zijn om de aanwezigheid aan te tonen van een apparaat dat
      tot doel heeft om een overschrijding van de maximumsnelheid vast te stellen, in te voeren, te koop aan te bieden,
      in voorraad te hebben of af te leveren.

      2 Het eerste lid geldt niet voor de apparaten die in Nederland worden ingevoerd en waarvan door middel van
      handelsbescheiden wordt aangetoond dat de apparaten aansluitend worden uitgevoerd naar een andere lidstaat van de
      Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel2
  - number: '3'
    text: |-
      Het is de bestuurder van een motorrijtuig verboden met dat motorrijtuig te rijden en de eigenaar of houder
      van een motorrijtuig verboden met dat motorrijtuig te laten rijden, indien in of aan het motorrijtuig een
      radarontvangstapparaat aanwezig is als bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel2
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025554
        artikel: '2'
        hoofdstuk: '2'
  - number: '4'
    text: |-
      1 [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor motorfietsen, bromfietsen alsmede driewielige
      motorrijtuigen waarvan de ledige massa niet meer bedraagt dan 400 kg.

      2 [Artikel 72, eerste lid, van de wet][ref2] geldt niet voor een motorrijtuig of een aanhangwagen, met uitzondering
      van taxi’s en bussen, waarvan de datum van eerste toelating is gelegen voor 1 januari 1960.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '5'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor een motorrijtuig of een aanhangwagen, waarvan de
      toegestane maximummassa meer bedraagt dan 3500 kg, zolang sinds de datum van eerste toelating van het voertuig nog
      geen jaar is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '6'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor een taxi, zolang sinds de datum van eerste toelating van
      het voertuig nog geen jaar is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '7'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor ambulances zolang sinds de datum van eerste toelating
      van het voertuig nog geen jaar is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '8'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor een ander motorrijtuig dan in de
      [artikelen 5 tot en met 7][ref2] bedoeld, ten aanzien van:

      a. motorrijtuigen met een verbrandingsmotor die wordt gevoed door al dan niet tot vloeistof verdicht gas of diesel
      zolang sinds de datum van eerste toelating van het motorrijtuig nog geen drie jaren zijn verstreken;

      b. motorrijtuigen, niet zijnde de motorrijtuigen als bedoeld in onderdeel a, zolang sinds de datum van eerste
      toelating van het motorrijtuig nog geen vier jaren zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0025554#Artikel5
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0025554
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '9'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor een motorrijtuig of een aanhangwagen op de dag waarop
      dat voertuig naar aanleiding van de aanvraag van een keuringsrapport aan een keuring wordt onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '10'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor:

      a. bij ministeriële regeling aangewezen motorrijtuigen en aanhangwagens:

      1°. waarvoor een bijzonder kenteken als bedoeld in het [Kentekenreglement][ref2] is opgegeven,

      2°. die een keuring als bedoeld in de [artikelen 22][ref3] of [26 van de wet][ref4] ondergaan en waarvoor een bij
      ministeriële regeling vastgesteld kenteken is opgegeven, of

      3°. Op de dag waarop zij overeenkomstig de bij ministeriële regeling vastgestelde voorschriften worden onderzocht
      in verband met de inschrijving en tenaamstelling;

      b. bij ministeriële regeling aangewezen categorieën van rijdende werktuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0006951
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel26
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0006951
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '26'
  - number: '11'
    text: |-
      1 Een motorrijtuig of een aanhangwagen mag gedurende twee maanden na het tijdstip waarop
      [artikel 72, eerste lid, van de wet][ref1] voor dat voertuig gelding verkrijgt, op de weg staan zonder dat voor dat
      voertuig een keuringsbewijs is afgegeven waarvan de geldigheidsduur niet is verstreken.

      2 Een motorrijtuig of een aanhangwagen mag gedurende twee maanden na het tijdstip waarop de geldigheidsduur van een
      voor dat motorrijtuig of die aanhangwagen afgegeven keuringsbewijs verstrijkt, op de weg staan zonder dat voor dat
      motorrijtuig of die aanhangwagen een keuringsbewijs is afgegeven waarvan de geldigheidsduur niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '12'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor motorrijtuigen en aanhangwagens die behoren
      tot de bedrijfsvoorraad van een natuurlijke persoon of rechtspersoon aan wie een erkenning als bedoeld in
      [artikel 62 van de wet][ref2] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
  - number: '14'
    text: |-
      1 Degene die een keuringsrapport aanvraagt bij de Dienst Wegverkeer, stelt het motorrijtuig of de aanhangwagen
      waarvoor de afgifte van het rapport wordt gevraagd, voor een keuring ter beschikking van een door de Dienst
      Wegverkeer met het verrichten van de keuring belaste functionaris, op een door deze bepaalde plaats en bepaald
      tijdstip.

      2 Degene die een keuringsrapport aanvraagt bij een ingevolge [artikel 84 van de wet][ref1] erkende natuurlijke
      persoon of rechtspersoon, stelt ter verkrijging daarvan het motorrijtuig of de aanhangwagen waarvoor de afgifte
      van het rapport wordt gevraagd, voor een keuring ter beschikking van een door die persoon met het verrichten van de
      keuring belaste functionaris op een door deze bepaalde plaats en bepaald tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel84
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '84'
  - number: '15'
    text: |-
      1 De geldigheidsduur van een keuringsbewijs vangt aan met ingang van de dag van afgifte.

      2 Indien een keuringsbewijs wordt afgegeven binnen twee maanden vóór het tijdstip waarop
      [artikel 72, eerste lid, van de wet][ref1] voor het betrokken voertuig gelding verkrijgt, vangt de geldigheidsduur
      van het keuringsbewijs aan met ingang van dat tijdstip, mits, voor zover [artikel 72, eerste lid, van de wet][ref2]
      vóór dat tijdstip op grond van een ingevolge een andere wet dan de [wet][ref3] afgegeven keuringsbewijs niet geldt,
      dat document voorafgaande aan de behandeling van de aanvraag wordt overgelegd.

      3 Indien een keuringsbewijs wordt afgegeven binnen twee maanden vóór het tijdstip waarop de geldigheidsduur van
      een eerder voor het betrokken voertuig afgegeven keuringsbewijs verstrijkt, vangt de geldigheidsduur van het
      keuringsbewijs aan met ingang van dat tijdstip, mits vorenbedoeld eerder afgegeven keuringsbewijs voorafgaande aan
      de behandeling van de aanvraag wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '72'
      - id: ref3
        bwb_id: BWBR0006622
  - number: '16'
    text: |-
      1 Een keuringsbewijs is geldig voor de duur van een jaar.

      2 In afwijking van het eerste lid is het keuringsbewijs geldig voor de duur van twee jaren indien het
      keuringsbewijs is afgegeven voor een ander motorrijtuig dan in de [artikelen 5 tot en met 7][ref1] bedoeld, en:

      a. dat is uitgerust met een verbrandingsmotor die niet wordt gevoed door al dan niet tot vloeistof verdicht gas
      of diesel,

      b. waarvan de datum van eerste toelating van het motorrijtuig ligt na 31 december 2004, en

      c. waarvan gerekend vanaf de datum van eerste toelating op het moment van afgifte van het keuringsbewijs een
      termijn van zeven jaren nog niet is verstreken.

      3 In afwijking van het eerste lid is voorts het keuringsbewijs waarvan de datum van afgifte 30 jaren of meer ligt
      na de datum van eerste toelating geldig voor de duur van twee jaren indien het desbetreffende keuringsbewijs is
      afgegeven voor een ander motorrijtuig dan in de [artikelen 5 tot en met 7][ref2] bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0025554#Artikel5
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0025554
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0025554
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '17'
    text: De afgifte van een keuringsbewijs geschiedt niet elektronisch.
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel17
  - number: '18'
    text: |-
      De termijn, bedoeld in [artikel 91, tweede lid, van de wet][ref1], waarbinnen tegen een beschikking tot afgifte van
      een keuringsbewijs bezwaar kan worden gemaakt, bedraagt een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel91
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '91'
  - number: '19'
    text: |-
      Het verzoek om herkeuring, bedoeld in [artikel 90, derde lid, van de wet][ref1], wordt ingediend door op het
      keuringsrapport dan wel het steekproefcontrolerapport aan te tekenen dat om herkeuring wordt verzocht en deze
      aantekening te ondertekenen alsmede hiervan kennis te geven aan degene die het keuringsrapport dan wel het
      steekproefcontrolerapport heeft afgegeven. Laatstgenoemde doet hiervan onverwijld mededeling aan de Dienst
      Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel90
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '90'
  - number: '20'
    text: De verzoeker heeft het recht bij de herkeuring aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel20
  - number: '21'
    text: |-
      De Dienst Wegverkeer doet, indien een beschikking tot weigering van de afgifte van een keuringsbewijs is afgegeven
      door een erkende natuurlijke persoon of rechtspersoon, aan deze afschrift toekomen van het na de herkeuring
      afgegeven keuringsrapport.
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel21
  - number: '22'
    text: |-
      1 De verzoeker legt voorafgaande aan het in [artikel 91 van de wet][ref1] bedoelde deskundigenonderzoek aan de
      deskundige die door de Dienst Wegverkeer is aangewezen om het onderzoek te verrichten, het keuringsbewijs dat is
      afgegeven voor het motorrijtuig of de aanhangwagen waarop het verzoek betrekking heeft over.

      2 De in het eerste lid bedoelde deskundige geeft de daar bedoelde bescheiden na afloop van het onderzoek aan de
      verzoeker terug, met dien verstande dat het keuringsbewijs niet wordt teruggegeven indien de geldigheid van het
      voor het voertuig afgegeven keuringsbewijs vervalt overeenkomstig [artikel 91, zesde lid, van de wet][ref2].

      3 De verzoeker heeft het recht bij het onderzoek aanwezig te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel91
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '91'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '91'
  - number: '23'
    text: |-
      De Dienst Wegverkeer doet, indien de keuring op grond waarvan het keuringsrapport werd afgegeven is verricht door
      een erkende natuurlijke persoon of rechtspersoon, aan deze afschrift toekomen van de uitslag van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel23
  - number: 23a
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder buitenlandse keuringsinstantie: een
      door de Dienst Wegverkeer aangewezen keuringsinstantie in een andere lidstaat van de Europese Unie, die in de
      desbetreffende lidstaat bevoegd is tot het afgeven van een keuringsbewijs.
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel23a
  - number: 23b
    text: |-
      Het experiment beoogt de lasten te reduceren voor de eigenaren van zich voor langere tijd in een andere lidstaat
      van de Europese Unie verblijvende motorrijtuigen en aanhangwagens met een Nederlands kenteken onder voorwaarde van
      gelijkblijvende verkeersveiligheid.
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel23b
  - number: 23c
    text: |-
      Onverminderd [artikel 78, eerste lid, van de wet][ref1] kunnen overeenkomstig de in dit besluit vastgestelde
      regels tevens keuringsbewijzen worden afgegeven ten behoeve van motorrijtuigen en aanhangwagens met een Nederlands
      kenteken door buitenlandse keuringsinstanties.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
  - number: 23d
    text: |-
      Onverminderd [artikel 75, eerste lid, van de wet][ref1] kan een afmelding worden gedaan en een keuringsbewijs
      worden afgegeven door een buitenlandse keuringsinstantie, op aanvraag en tegen betaling aan de Dienst Wegverkeer
      van het door deze dienst vastgesteld tarief, indien het motorrijtuig of de aanhangwagen na keuring blijkt te
      voldoen aan de eisen die gelden ingevolge de in de lidstaat waarin de buitenlandse keuringsinstantie zich bevindt
      geldende regelgeving inzake de algemene periodieke keuring.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
  - number: 23e
    text: |-
      In afwijking van [artikel 86 van de wet][ref1] vindt geen herkeuring door de Dienst Wegverkeer plaats van de op
      grond van [artikel 23c][ref2] door de buitenlandse keuringsinstanties gekeurde voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0025554#Artikel23c
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '86'
      - id: ref2
        bwb_id: BWBR0025554
        artikel: 23c
        hoofdstuk: 3a
        paragraaf: '2'
  - number: 23f
    text: |-
      In afwijking van [artikel 14, tweede lid][ref1], stelt degene die een keuringsrapport aanvraagt bij een op
      grond van [artikel 23a][ref2] aangewezen keuringsinstantie ter verkrijging daarvan het motorrijtuig of de
      aanhangwagen waarvoor de afgifte van het rapport wordt gevraagd, voor een keuring ter beschikking van een door
      die keuringsinstantie met het verrichten van de keuring belaste functionaris of functionarissen op een door deze
      bepaalde plaats en bepaald tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0025554#Artikel23a
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel23f
    references:
      - id: ref1
        bwb_id: BWBR0025554
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0025554
        artikel: 23a
        hoofdstuk: 3a
        paragraaf: '1'
  - number: 23g
    text: |-
      1 In afwijking van [artikel 90, eerste lid, van de wet][ref1] kan een belanghebbende geen bezwaar maken of
      administratief beroep instellen bij de Dienst Wegverkeer tegen de weigering tot het afgeven van een keuringsbewijs
      door een buitenlandse keuringsinstantie.

      2 In afwijking van [artikel 91, tweede lid, van de wet][ref2], kan geen bezwaar worden gemaakt of administratief
      beroep worden ingesteld tegen een beschikking tot afgifte van een keuringsbewijs door een buitenlandse
      keuringsinstantie.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel91
    url: https://wetten.overheid.nl/BWBR0025554/2018-07-01#Artikel23g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '90'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '91'
  - number: 23h
    text: |-
      1 De [artikelen 83 tot en met 89 van de wet][ref1] zijn niet van toepassing op buitenlandse keuringsinstanties.

      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de voorschriften waaraan een
      buitenlandse keuringsinstantie moet voldoen ten aanzien van de afgifte van keuringsbewijzen als bedoeld in
      [artikel 23c][ref2].


