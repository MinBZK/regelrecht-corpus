preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 4 december 2008, nr. CEND/HDJZ-2008/1657 sector
    AWW, Hoofddirectie Juridische Zaken;

    Gelet op de artikelen 34, eerste lid, 73, tweede lid, onderdelen a en b, 81, eerste lid, en 91, tweede lid, en 179,
    derde lid, van de Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 17 december 2008, nr. W09.08.0530/IV);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 12 februari 2009, nr. CEND/HJDZ-2009/51
    sector AWW, Hoofddirectie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *wet:* [Wegenverkeerswet 1994](onbekend).'
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden om radarontvangstapparaten die geschikt zijn om de aanwezigheid aan te tonen van een apparaat dat
      tot doel heeft om een overschrijding van de maximumsnelheid vast te stellen, in te voeren, te koop aan te bieden,
      in voorraad te hebben of af te leveren.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het eerste lid geldt niet voor de apparaten die in Nederland worden ingevoerd en waarvan door middel van
      handelsbescheiden wordt aangetoond dat de apparaten aansluitend worden uitgevoerd naar een andere lidstaat van de
      Europese Unie.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden om apparaten die geschikt zijn om de teller van een motorrijtuig stil te zetten of op andere wijze
      te manipuleren, te vervaardigen, in te voeren, in voorraad te hebben, te koop aan te bieden, af te leveren of te
      vervoeren.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het is de bestuurder van een motorrijtuig verboden met dat motorrijtuig te rijden en de eigenaar of houder
      van een motorrijtuig verboden met dat motorrijtuig te laten rijden, indien in of aan het motorrijtuig een
      radarontvangstapparaat aanwezig is als bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel2
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025554
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      Het is de bestuurder van een motorrijtuig verboden met dat motorrijtuig te rijden en de eigenaar of houder van een
      motorrijtuig verboden met dat motorrijtuig te laten rijden, indien in of aan het motorrijtuig een apparaat aanwezig
      is als bedoeld in [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel2
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025554
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.1'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: 4.1.a
    text: 'landbouw- en bosbouwtrekkers:'
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel4
  - number: 4.1.a.1°
    text: op wielen met een maximumconstructiesnelheid van 40 km/h of minder;
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel4
  - number: 4.1.a.2°
    text: op rupsbanden; of
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel4
  - number: 4.1.a.3°
    text: |-
      die worden gebruikt voor landbouw-, tuinbouw-, bosbouw-, veeteelt- of visserijdoeleinden hoofdzakelijk op het
      terrein waar zulke activiteit plaatsvindt, met inbegrip van landwegen, bospaden of akkers;
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel4
  - number: 4.1.b
    text: motorrijtuigen met beperkte snelheid;
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel4
  - number: 4.1.c
    text: mobiele machines;
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel4
  - number: 4.1.d
    text: motorfietsen;
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel4
  - number: 4.1.e
    text: bromfietsen;
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel4
  - number: 4.1.f
    text: driewielige motorrijtuigen met een ledige massa van niet meer dan 400 kg;
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel4
  - number: 4.1.g
    text: aanhangwagens met een toegestane maximummassa van niet meer dan 3.500 kg;
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel4
  - number: 4.1.h
    text: |-
      aanhangwagens die uitsluitend bestemd zijn om te worden voortbewogen door landbouw- of bosbouwtrekkers,
      motorrijtuigen met beperkte snelheid of mobiele machines; en
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel4
  - number: 4.1.i
    text: verwisselbare getrokken uitrustingsstukken.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel4
  - number: '4.2'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor een motorrijtuig of een aanhangwagen, met uitzondering
      van taxi’s, ov-auto’s en bussen, waarvan de datum van eerste toelating ten minste vijftig jaar geleden is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '5'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor een motorrijtuig, niet zijnde een landbouw- of
      bosbouwtrekker, of aanhangwagen met een toegestane maximummassa van meer dan 3.500 kg, zolang sinds de datum van
      eerste toelating van het voertuig nog geen jaar is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '6'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor een taxi of ov-auto, zolang sinds de datum van eerste
      toelating van het voertuig nog geen jaar is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '7'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor ambulances zolang sinds de datum van eerste toelating
      van het voertuig nog geen jaar is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '8'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor een ander motorrijtuig dan in de
      [artikelen 5 tot en met 7][ref2] bedoeld, ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0025554#Artikel5
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0025554
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 8.a
    text: |-
      motorrijtuigen met een verbrandingsmotor die wordt gevoed door al dan niet tot vloeistof verdicht gas of diesel
      zolang sinds de datum van eerste toelating van het motorrijtuig nog geen drie jaren zijn verstreken;
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel8
  - number: 8.b
    text: |-
      motorrijtuigen, niet zijnde de motorrijtuigen als bedoeld in onderdeel a, zolang sinds de datum van eerste
      toelating van het motorrijtuig nog geen vier jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel8
  - number: '9'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor een motorrijtuig of een aanhangwagen op de dag waarop
      dat voertuig naar aanleiding van de aanvraag van een keuringsrapport aan een keuring wordt onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '10'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: 10.a
    text: 'bij ministeriële regeling aangewezen motorrijtuigen en aanhangwagens:'
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel10
  - number: 10.a.1°
    text: |-
      waarvoor een bijzonder kenteken als bedoeld in het [Kentekenreglement][ref1] is opgegeven,


      [ref1]: https://wetten.overheid.nl/BWBR0006951
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006951
  - number: 10.a.2°
    text: |-
      die een keuring als bedoeld in de [artikelen 22][ref1] of [26 van de wet][ref2] ondergaan en waarvoor een bij
      ministeriële regeling vastgesteld kenteken is opgegeven, of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel26
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '26'
  - number: 10.a.3°
    text: |-
      Op de dag waarop zij overeenkomstig de bij ministeriële regeling vastgestelde voorschriften worden onderzocht in
      verband met de inschrijving en tenaamstelling;
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel10
  - number: 10.b
    text: bij ministeriële regeling aangewezen categorieën van rijdende werktuigen.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel10
  - number: '11.1'
    text: |-
      Een motorrijtuig of een aanhangwagen mag gedurende twee maanden na het tijdstip waarop
      [artikel 72, eerste lid, van de wet][ref1] voor dat voertuig gelding verkrijgt, op de weg staan zonder dat voor dat
      voertuig een keuringsbewijs is afgegeven waarvan de geldigheidsduur niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '11.2'
    text: |-
      Een motorrijtuig of een aanhangwagen mag gedurende twee maanden na het tijdstip waarop de geldigheidsduur van een
      voor dat motorrijtuig of die aanhangwagen afgegeven keuringsbewijs verstrijkt, op de weg staan zonder dat voor dat
      motorrijtuig of die aanhangwagen een keuringsbewijs is afgegeven waarvan de geldigheidsduur niet is verstreken.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel11
  - number: '12'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor motorrijtuigen en aanhangwagens die behoren
      tot de bedrijfsvoorraad van een natuurlijke persoon of rechtspersoon aan wie een erkenning als bedoeld in
      [artikel 62 van de wet][ref2] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
  - number: '14.1'
    text: |-
      Degene die een keuringsrapport aanvraagt bij de Dienst Wegverkeer, stelt het motorrijtuig of de aanhangwagen
      waarvoor de afgifte van het rapport wordt gevraagd, voor een keuring ter beschikking van een door de Dienst
      Wegverkeer met het verrichten van de keuring belaste functionaris, op een door deze bepaalde plaats en bepaald
      tijdstip.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel14
  - number: '14.2'
    text: |-
      Degene die een keuringsrapport aanvraagt bij een ingevolge [artikel 84 van de wet][ref1] erkende natuurlijke
      persoon of rechtspersoon, stelt ter verkrijging daarvan het motorrijtuig of de aanhangwagen waarvoor de afgifte
      van het rapport wordt gevraagd, voor een keuring ter beschikking van een door die persoon met het verrichten van de
      keuring belaste functionaris op een door deze bepaalde plaats en bepaald tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel84
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '84'
  - number: '15.1'
    text: De geldigheidsduur van een keuringsbewijs vangt aan met ingang van de dag van afgifte.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel15
  - number: '15.2'
    text: |-
      Indien een keuringsbewijs wordt afgegeven binnen twee maanden vóór het tijdstip waarop
      [artikel 72, eerste lid, van de wet][ref1] voor het betrokken voertuig gelding verkrijgt, vangt de geldigheidsduur
      van het keuringsbewijs aan met ingang van dat tijdstip, mits, voor zover [artikel 72, eerste lid, van de wet][ref2]
      vóór dat tijdstip op grond van een ingevolge een andere wet dan de [wet][ref3] afgegeven keuringsbewijs niet geldt,
      dat document voorafgaande aan de behandeling van de aanvraag wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '72'
      - id: ref3
        bwb_id: BWBR0006622
  - number: '15.3'
    text: |-
      Indien een keuringsbewijs wordt afgegeven binnen twee maanden vóór het tijdstip waarop de geldigheidsduur van
      een eerder voor het betrokken voertuig afgegeven keuringsbewijs verstrijkt, vangt de geldigheidsduur van het
      keuringsbewijs aan met ingang van dat tijdstip, mits vorenbedoeld eerder afgegeven keuringsbewijs voorafgaande aan
      de behandeling van de aanvraag wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel15
  - number: '16.1'
    text: Een keuringsbewijs is geldig voor de duur van een jaar.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel16
  - number: '16.2'
    text: |-
      In afwijking van het eerste lid is het keuringsbewijs geldig voor de duur van twee jaren indien het keuringsbewijs
      is afgegeven voor een ander motorrijtuig dan in de [artikelen 5 tot en met 7][ref1] bedoeld, en:


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel5
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0025554
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 16.2.a
    text: |-
      dat is uitgerust met een verbrandingsmotor die niet wordt gevoed door al dan niet tot vloeistof verdicht gas of
      diesel; en
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel16
  - number: 16.2.b
    text: |-
      sinds de datum van eerste toelating op het moment van afgifte van het keuringsbewijs een termijn van zeven jaren
      nog niet is verstreken.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel16
  - number: '16.3'
    text: |-
      In afwijking van het eerste lid is voorts het keuringsbewijs waarvan de datum van afgifte 30 jaren of meer ligt
      na de datum van eerste toelating geldig voor de duur van twee jaren indien het desbetreffende keuringsbewijs is
      afgegeven voor een ander motorrijtuig dan in de [artikelen 5 tot en met 7][ref1] bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel5
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0025554
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '16.4'
    text: |-
      In afwijking van het eerste tot en met derde lid is een keuringsbewijs afgegeven voor een landbouw- of
      bosbouwtrekker geldig voor de duur van twee jaren.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel16
  - number: '17'
    text: De afgifte van een keuringsbewijs geschiedt niet elektronisch.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel17
  - number: '18'
    text: |-
      De termijn, bedoeld in [artikel 91, tweede lid, van de wet][ref1], waarbinnen tegen een beschikking tot afgifte van
      een keuringsbewijs bezwaar kan worden gemaakt, bedraagt een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel91
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '91'
  - number: '19'
    text: |-
      Het verzoek om herkeuring, bedoeld in [artikel 90, derde lid, van de wet][ref1], wordt ingediend door op het
      keuringsrapport dan wel het steekproefcontrolerapport aan te tekenen dat om herkeuring wordt verzocht en deze
      aantekening te ondertekenen alsmede hiervan kennis te geven aan degene die het keuringsrapport dan wel het
      steekproefcontrolerapport heeft afgegeven. Laatstgenoemde doet hiervan onverwijld mededeling aan de Dienst
      Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel90
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '90'
  - number: '20'
    text: De verzoeker heeft het recht bij de herkeuring aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel20
  - number: '21'
    text: |-
      De Dienst Wegverkeer doet, indien een beschikking tot weigering van de afgifte van een keuringsbewijs is afgegeven
      door een erkende natuurlijke persoon of rechtspersoon, aan deze afschrift toekomen van het na de herkeuring
      afgegeven keuringsrapport.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel21
  - number: '22.1'
    text: |-
      De verzoeker legt voorafgaande aan het in [artikel 91 van de wet][ref1] bedoelde deskundigenonderzoek aan de
      deskundige die door de Dienst Wegverkeer is aangewezen om het onderzoek te verrichten, het keuringsbewijs dat is
      afgegeven voor het motorrijtuig of de aanhangwagen waarop het verzoek betrekking heeft over.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel91
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '91'
  - number: '22.2'
    text: |-
      De in het eerste lid bedoelde deskundige geeft de daar bedoelde bescheiden na afloop van het onderzoek aan de
      verzoeker terug, met dien verstande dat het keuringsbewijs niet wordt teruggegeven indien de geldigheid van het
      voor het voertuig afgegeven keuringsbewijs vervalt overeenkomstig [artikel 91, zesde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel91
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '91'
  - number: '22.3'
    text: De verzoeker heeft het recht bij het onderzoek aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel22
  - number: '23'
    text: |-
      De Dienst Wegverkeer doet, indien de keuring op grond waarvan het keuringsrapport werd afgegeven is verricht door
      een erkende natuurlijke persoon of rechtspersoon, aan deze afschrift toekomen van de uitslag van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel23
  - number: 23j
    text: |-
      De in [artikel 70m van de wet][ref1] bedoelde categorieën motorrijtuigen zijn motorrijtuigen van de
      rijbewijscategorieën A, A1, A2 en B, voor zover deze harder kunnen en mogen rijden dan 25 km/u.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70m
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel23j
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70m
  - number: 23k.1
    text: |-
      Erkende bedrijven verstrekken aan de Dienst Wegverkeer de tellerstand van een motorrijtuigen van de
      rijbewijscategorieën A, A1, A2 en B, voor zover deze harder kunnen en mogen rijden dan 25 km/u bij:
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel23k
  - number: 23k.1.a
    text: |-
      opname in de bedrijfsvoorraad als bedoeld in [artikel 62 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel23k
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
  - number: 23k.1.b
    text: |-
      beëindiging van de tenaamstelling als bedoeld in [artikel 66a van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel23k
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 66a
  - number: 23k.1.c
    text: |-
      afgifte van een keuringsbewijs als bedoeld in [artikel 72 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel23k
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: 23k.1.d
    text: |-
      het waarborgen dat een wijziging in de bouw of inrichting van een voertuig aan de eisen voldoet als bedoeld in
      [artikel 100, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel100
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel23k
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '100'
  - number: 23k.1.e
    text: |-
      het waarborgen dat een voertuig aan de eisen voldoet als bedoeld in [artikel 106a, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel106a
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel23k
