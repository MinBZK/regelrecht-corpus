    text: |-
      melding van het voorgoed buiten Nederland brengen van een voertuig als bedoeld in
      [artikel 46, tweede lid, onder b, Kentekenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel23k
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
  - number: 23k.1.h
    text: |-
      het indienen van een aanvraag van een tenaamstelling als bedoeld in
      [artikel 46, tweede lid, onder d, Kentekenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel23k
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
  - number: 23k.1.i
    text: |-
      werkzaamheden aan de boordcomputer taxi krachtens het [Besluit personenvervoer 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011982
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel23k
    references:
      - id: ref1
        bwb_id: BWBR0011982
  - number: 23k.1.j
    text: onderhoud, reparaties en vernieuwen of wisselen van banden, voor zover deze bedrijfsmatig worden verricht.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel23k
  - number: 23k.2
    text: Het eerste lid, onder i, is niet van toepassing op motorrijtuigen van de rijbewijscategorieën A, A1 en A2.
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel23k
  - number: '24'
    text: |-
      Overtreding van [artikel 3][ref1] is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel3
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0025554
        artikel: '3'
        hoofdstuk: '2'
  - number: '25'
    text: |-
      Bij veroordeling van de bestuurder van een motorrijtuig wegens overtreding van
      [artikel 5.1.1, eerste of tweede lid][ref1], of [artikel 5.1.2 van de Regeling voertuigen][ref2] kan hem de
      bevoegdheid tot het besturen van motorrijtuigen voor ten hoogste twee jaren worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel5
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '5'
  - number: '26'
    text: |-
      Na de inwerkingtreding van dit besluit berust de [Regeling transitokentekenbewijzen][ref1] mede op
      [artikel 10][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020708
      [ref2]: https://wetten.overheid.nl/BWBR0025554#Artikel10
    url: https://wetten.overheid.nl/BWBR0025554/2023-01-01#Artikel26
