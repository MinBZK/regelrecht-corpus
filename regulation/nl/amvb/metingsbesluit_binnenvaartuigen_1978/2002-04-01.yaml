$id: metingsbesluit_binnenvaartuigen_1978
regulatory_layer: AMVB
publication_date: '2008-05-15'
valid_from: '2002-04-01'
bwb_id: BWBR0003246
url: https://wetten.overheid.nl/BWBR0003246/2002-04-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 15 augustus 1978, Directoraat-Generaal van
    Scheepvaart, no. J/S 23196;

    Gelet op de op 15 februari 1966 te Genève ondertekende Overeenkomst nopens de meting van binnenvaartuigen met
    Bijlage en Protocol van Ondertekening, goedgekeurd door de Staten-Generaal op 14 september 1967 (Trb. 1967, no.
    43);

    Mede gelet op de Wet van 10 maart 1979, Stb. 171, inzake de berekening van de kosten voor de meting van
    binnenvaartuigen;

    De Raad van State gehoord (advies van 13 september 1978, no. 16);

    Gezien het nader rapport van de voornoemde Minister van 8 juni 1979. Directoraat-Generaal van Scheepvaart, no. J/
    S 22174;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van het in dit besluit bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel1
  - number: 1.b
    text: 'Scheepsmetingsdienst: de Scheepsmetingsdienst, ingesteld bij Koninklijk besluit van 11 december 1933 (*Stb.* 682);'
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel1
  - number: 1.c
    text: |-
      Overeenkomst: de op 15 februari 1966 te Genève ondertekende en op 14 september 1967 goedgekeurde Overeenkomst
      nopens de meting van binnenvaartuigen, met Bijlage en Protocol van Ondertekening (*Trb.* 1967, 43);
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel1
  - number: 1.d
    text: |-
      binnenvaartuigen: alle vaartuigen, welke tot de vaart op de binnenwateren worden gebruikt of bestemd zijn, zomede
      die, welke belanghebbenden als zodanig doen of hebben doen meten;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel1
  - number: 1.e
    text: 'belanghebbende: de eigenaar van het binnenvaartuig of degene die namens de eigenaar optreedt;'
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel1
  - number: 1.f
    text: |-
      verplaatsing: de in kubieke meters uitgedrukte waterverplaatsing van een binnenvaartuig tussen het vlak van
      inzinking van het ledige binnenvaartuig in zoet water en het vlak van de grootste toegelaten diepgang;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel1
  - number: 1.g
    text: |-
      maximum toelaatbare waterverplaatsing: de in kubieke meters uitgedrukte waterverplaatsing van een binnenvaartuig
      tot het vlak van de grootste toegelaten diepgang;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel1
  - number: 1.h
    text: |-
      vlak van inzinking van het ledige vaartuig: het vlak overeenkomende met het bepaalde in [artikel 4][ref1] van dit
      besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel4
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '4'
  - number: 1.i
    text: |-
      vlak van de grootste toegelaten diepgang: het vlak dat kan worden aangebracht door de onderzijden van de door
      de Scheepsmetingsdienst aangebrachte ijkmerken, in overeenstemming met het bepaalde in [artikel 5][ref1] van dit
      besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel5
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '5'
  - number: 1.j
    text: |-
      meetbrief: de meetbrief, afgegeven door de Scheepsmetingsdienst overeenkomstig de bepalingen van dit besluit, dan
      wel afgegeven door de administratie van een andere Staat, aangesloten bij de Overeenkomst;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel1
  - number: 1.k
    text: |-
      ligger: het register waarin de Scheepsmetingsdienst, onder een eigen volgnummer, elke meetbrief inschrijft die
      hij uitreikt, zomede de datum van de uitreiking, de naam of de kenspreuk van het vaartuig en de andere gegevens
      waardoor een binnenvaartuig kan worden geïdentificeerd.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel1
  - number: '2.1'
    text: |-
      De meting van binnenvaartuigen heeft ten doel de verplaatsing vast te stellen, evenals, indien nodig, een deel
      van de verplaatsing in samenhang met de inzinking. De meting van binnenvaartuigen, bestemd of ingericht voor het
      vervoer van goederen, heeft tevens ten doel het mogelijk te maken het gewicht van de lading volgens de inzinking
      te bepalen.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel2
  - number: '2.2'
    text: |-
      Voor binnenvaartuigen die niet zijn bestemd of ingericht voor het vervoer van goederen worden, behalve de
      verplaatsing, bovendien de maximum toelaatbare waterverplaatsing en de waterverplaatsing in ledige toestand
      bepaald.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel2
  - number: '3.1'
    text: De meting geschiedt overeenkomstig het bepaalde bij of krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel3
  - number: '3.2'
    text: |-
      Voor de meting van een binnenvaartuig worden de maten aan het vaartuig zelf gemeten. Het te meten deel van het
      binnenvaartuig is het deel dat begrepen is tussen het vlak van de grootste toegelaten diepgang en het vlak van
      inzinking van het ledige vaartuig.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel3
  - number: '3.3'
    text: |-
      Bij het meten van lengten en breedten worden de onderdelen van centimeters, wanneer deze vijf millimeter of meer
      bedragen, voor een centimeter gerekend en anders verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel3
  - number: '3.4'
    text: Bij het meten van hoogten worden de onderdelen van centimeters tot op een tiende centimeter in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel3
  - number: '3.5'
    text: |-
      Bij de berekening worden breuken van duizendste delen, wanneer deze vijf tienduizendste of meer bedragen, voor een
      duizendste gerekend en anders verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel3
  - number: '3.6'
    text: Bij de eindberekening van de verplaatsing worden onderdelen van een kubieke decimeter verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel3
  - number: '4.1'
    text: 'Het vlak van inzinking van het ledige vaartuig, is het vlak overeenkomende met het wateroppervlak indien:'
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel4
  - number: 4.1.a
    text: |-
      het vaartuig geen brandstof of verplaatsbare ballast aan boord heeft doch slechts de uitrusting, de proviand en
      de bemanning die normaal aan boord zijn als het vaartuig vaart; alsmede het water, dat niet door gebruikelijke
      middelen uit het ruim kan worden verwijderd; de drinkwatervoorraad mag echter 0,5% van de grootste verplaatsing van
      het vaartuig niet aanzienlijk overschrijden;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel4
  - number: 4.1.b
    text: |-
      de werktuigen, ketels, pijpleidingen en installaties, nodig voor de voortstuwing of voor de noodzakelijke
      hulpwerktuigen, zomede voor verwarming of koeling, het water, de olie of de andere vloeistoffen bevatten waarvan
      zij in gewone omstandigheden worden voorzien om dienst te kunnen doen;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel4
  - number: 4.1.c
    text: het vaartuig zich in zoet water bevindt, dat wil zeggen in water met een soortelijk gewicht gelijk aan 1.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel4
  - number: '4.2'
    text: |-
      Indien het vaartuig zich bij de meting niet in de toestand, omschreven in het eerste lid van dit artikel, bevindt,
      of niet in omstandigheden die leiden tot dezelfde inzinking en ongeveer dezelfde trimligging, moet het verschil
      in belasting en het verschil in soortelijk gewicht van het water in aanmerking worden genomen bij het maken van
      de berekeningen.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel4
  - number: '4.3'
    text: De gewichten aan boord die behoren bij de ledige inzinking moeten in de meetbrief worden vermeld.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel4
  - number: '5.1'
    text: |-
      Het vlak van de grootste toegelaten diepgang is het vlak, vastgesteld overeenkomstig de voor dat binnenvaartuig
      geldende regels van het [Binnenschepenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004196
  - number: '5.2'
    text: |-
      Voor binnenvaartuigen waarop de [Binnenschepenwet][ref1] niet van toepassing is, wordt het vlak van de grootste
      toegelaten diepgang vastgesteld overeenkomstig bijlage II bij het [Binnenschepenbesluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003443
      [ref2]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003443
      - id: ref2
        bwb_id: BWBR0004196
  - number: '5.3'
    text: |-
      Voor binnenvaartuigen die bestemd zijn voor het vervoer van goederen kan op verzoek van de belanghebbende het vlak
      van de grootste toegelaten diepgang ten hoogste tien procent van de gemiddelde laadhoogte lager worden gesteld dan
      in het eerste of tweede lid bepaald.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel5
  - number: '5.4'
    text: |-
      In bijzondere gevallen kan op verzoek van de belanghebbende het vlak van de grootste toegelaten diepgang meer
      dan tien procent van de gemiddelde laadhoogte lager worden gesteld, mits ten genoegen van het Hoofd van de
      Scheepsmetingsdienst wordt aangetoond dat de grootste diepgang waarop het schip zal kunnen varen geringer is dan de
      diepgang, bepaald volgens het derde lid.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel5
  - number: '5.5'
    text: |-
      Voor binnenvaartuigen die niet zijn bestemd noch ingericht voor het vervoer van goederen kan op verzoek van de
      belanghebbende het vlak van de grootste toegelaten diepgang lager worden gesteld dan in het eerste en tweede lid
      bepaald.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel5
  - number: '6'
    text: |-
      De meting, hermeting of controle-meting wordt uitgevoerd op aanvraag van de belanghebbende bij het Hoofd van de
      Scheepsmetingsdienst.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel6
  - number: '7.1'
    text: |-
      De ligplaats van het te meten binnenvaartuig of van het binnenvaartuig waarvan de meting gecontroleerd dient te
      worden, moet zijn ten genoegen van de ambtenaar van de Scheepsmetingsdienst in stil, bij voorkeur zoet water en
      zodanig, dat het vaartuig van alle zijden toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel7
  - number: '7.2'
    text: |-
      Degene die de meting heeft aangevraagd, is gehouden gedurende de meting alle voorschriften van de ambtenaar van
      de Scheepsmetingsdienst met betrekking tot de ligging van het vaartuig op het vlak van inzinking van het ledige
      vaartuig en de eventuele verplaatsing van losse voorwerpen op te volgen, de nodige hulp te verschaffen bij de
      meting en bij het aanbrengen van de ijkmerken of de ijkplaten en daartoe een deugdelijke roeiboot met ten minste
      twee man beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel7
  - number: '8.1'
    text: |-
      Zo spoedig mogelijk na de meting, doch uiterlijk de zevende werkdag daarna, verstrekt het Hoofd van de
      Scheepsmetingsdienst de meetbrief aan hem, die de meting heeft aangevraagd.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel8
  - number: '8.2'
    text: De meetbrief moet overeenstemmen met het van toepassing zijnde model als aangegeven in bijlage 1 van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel8
  - number: '8.3'
    text: |-
      Op de meetbrief worden de zones als bedoeld in bijlage I bij het [Binnenschepenbesluit][ref1], waarin het
      binnenvaartuig bestemd is te varen, vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004196
  - number: '9'
    text: |-
      Een meetbrief, afgegeven door een bureau van meting van een andere Staat aangesloten bij de Overeenkomst, wordt
      gelijkgesteld aan een meetbrief afgegeven door de Scheepsmetingsdienst overeenkomstig de bepalingen van dit
      besluit.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel9
  - number: '10'
    text: |-
      Binnenvaartuigen, bestemd voor het vervoer van goederen, kunnen bij meting of hermeting van ijkschalen worden
      voorzien, indien de belanghebbende een schriftelijk verzoek daartoe indient.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel10
  - number: '11'
    text: |-
      De geldigheidsduur van een meetbrief is ten hoogste vijftien jaar, te rekenen van de datum van afgifte. De
      geldigheidsduur van de meetbrief kan telkenmale worden verlengd:
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel11
  - number: 11.a
    text: |-
      indien het een binnenvaartuig betreft dat bestemd is voor het vervoer van goederen voor een periode van ten hoogste
      tien jaar;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel11
  - number: 11.b
    text: indien het een ander binnenvaartuig betreft voor een periode van ten hoogste vijftien jaar.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel11
  - number: '12.1'
    text: |-
      De geldigheidsduur van een meetbrief wordt op verzoek van de belanghebbende verlengd, indien bij een controlemeting
      blijkt dat de gegevens van de meetbrief nog juist zijn. Teneinde te kunnen vaststellen of de gegevens van de
      meetbrief nog juist zijn moeten de volgende afmetingen van het binnenvaartuig worden gecontroleerd:
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel12
  - number: 12.1.a
    text: de lengte en de breedte, alsmede de inzinking van het ledige vaartuig ter plaatse van elk ijkmerk;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel12
  - number: 12.1.b
    text: |-
      ingeval het vaartuig blijvende vervormingen heeft: enkele breedten aan de hand van de laatste staat van meting, om
      na te gaan of de vervormingen vóór of na de laatste meting zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel12
  - number: '12.2'
    text: |-
      Van de uitkomst van de controle en van de datum waarop de geldigheidsduur van de meetbrief is verlengd, houdt het
      Hoofd van de Scheepsmetingsdienst aantekening in de staat van meting en in de ligger.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel12
  - number: '12.3'
    text: |-
      Tenzij het betreffende bij de Overeenkomst aangesloten land zulks niet toestaat kan de geldigheidsduur van een
      door een van zijn bureaus van meting afgegeven meetbrief voor een vaartuig, bestemd voor het vervoer van goederen,
      worden verlengd, overeenkomstig het bepaalde in dit besluit.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel12
  - number: '12.4'
    text: |-
      Van de uitkomst van de controle van een in het buitenland gemeten binnenvaartuig alsmede van de datum waarop
      de geldigheidsduur van een dergelijke meetbrief is verlengd, moet kennis worden gegeven aan het Hoofd van de
      Scheepsmetingsdienst. Laatstgenoemde geeft daarna aan zijn ambtgenoot in het andere land hiervan kennis door middel
      van het formulier als aangegeven in bijlage 3 van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel12
  - number: '13'
    text: 'De meetbrief vervalt:'
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel13
  - number: 13.a
    text: |-
      door het verstrijken van de geldigheidsduur als vermeld in [artikel 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel11
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '11'
  - number: 13.b
    text: |-
      wanneer het binnenvaartuig een verbouwing ondergaat, die van invloed is op de ligging van het vlak van inzinking
      van het ledige vaartuig, op de verplaatsing dan wel op de in de meetbrief vermelde afmetingen;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel13
  - number: 13.c
    text: |-
      wanneer het binnenvaartuig, bestemd voor het vervoer van goederen, van bestemming verandert, zodat het gaat behoren
      tot een vaartuig, niet bestemd voor het vervoer van goederen, of omgekeerd;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel13
  - number: 13.d
    text: wanneer in de meetbrief één of meer wijzigingen zijn aangebracht door daartoe niet bevoegde personen;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel13
  - number: 13.e
    text: |-
      wanneer aan het binnenvaartuig andere veranderingen dan wel blijvende beschadigingen zijn aangebracht, waardoor de
      omschrijving in de meetbrief niet meer juist is;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel13
  - number: 13.f
    text: wanneer de meetbrief niet meer volledig aanwezig is.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel13
  - number: '14.1'
    text: |-
      Indien aan een ambtenaar van de Scheepsmetingsdienst blijkt, dat zich ten aanzien van een in Nederland
      geregistreerd binnenvaartuig één der gevallen, voorzien in [artikel 13, onder ][ref1] voordoet, is hij verplicht de
      meetbrief in te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel13
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '13'
  - number: '14.2'
    text: Het Hoofd van de Scheepsmetingsdienst houdt van de intrekking aantekening in de ligger.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel14
  - number: '14.3'
    text: |-
      Indien één der gevallen voorzien in [artikel 13, onder ][ref1] zich voordoet ten aanzien van een in het
      buitenland geregistreerd binnenvaartuig, dient zulks te worden gemeld aan het Hoofd van de Scheepsmetingsdienst.
      Laatstgenoemde dient zijn ambtgenoot van het betreffende land waar het vaartuig is geregistreerd, hiervan te
      verwittigen. In de meetbrief van het betreffende binnenvaartuig wordt een verklaring gehecht als vastgesteld door
      het Hoofd van de Scheepsmetingsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel13
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '13'
  - number: '15.1'
    text: |-
      Een binnenvaartuig is, wanneer het zich op de Nederlandse binnenvaarwegen bevindt, verplicht zich te onderwerpen
      aan een inspectie door ambtenaren van de Scheepsmetingsdienst.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel15
  - number: '15.2'
    text: 'De in het eerste lid bedoelde inspectie heeft als enig doel vast te stellen:'
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel15
  - number: 15.2.a
    text: dat het schip is voorzien van een geldige meetbrief;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel15
  - number: 15.2.b
    text: |-
      dat de voornaamste kenmerken van het binnenvaartuig in overeenstemming zijn met de gegevens vermeld op de
      meetbrief.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel15
  - number: '15.3'
    text: |-
      Indien uit de inspectie blijkt dat de voornaamste kenmerken van het binnenvaartuig afwijken van die vermeld op de
      meetbrief, dan dient te worden gehandeld overeenkomstig het bepaalde in [artikel 14][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel14
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '14'
  - number: '15.4'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      binnen te treden zonder toestemming van de bewoner. Zij beschikken niet over de bevoegdheid, genoemd in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '16.1'
    text: |-
      De belanghebbende, die met de uitkomst van de meting van zijn vaartuig geen genoegen neemt, kan binnen zes maanden
      na de afgifte van de meetbrief bij het Hoofd van de Scheepsmetingsdienst hermeting verzoeken. De hermeting is
      beslissend.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel16
  - number: '16.2'
    text: |-
      De hermeting en zonodig de vernieuwing van de ijkmerken of de ijkplaten geschieden kosteloos, indien het verschil
      met de eerste meting meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel16
  - number: 16.2.1
    text: procent voor de verplaatsingscijfers van maximaal 500 kubieke meter;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel16
  - number: 16.2.5
    text: kubieke meter voor de verplaatsingscijfers van meer dan 500 kubieke meter tot maximaal 2000 kubieke meter;
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel16
  - number: '16.3'
    text: |-
      Is het verschil met de eerste meting gelijk aan of minder dan de percentages of het aantal kubieke meters, vermeld
      in het tweede lid van dit artikel dan wordt de eerste meting als juist aangemerkt en moet de belanghebbende
      voor de hermeting de kosten betalen welke voor een normale meting in rekening worden gebracht, zomede de
      reis- en verblijfkosten van de ambtenaren van de Scheepsmetingsdienst overeenkomstig de daarvoor geldende
      vergoedingsregeling en de reiskosten van de werkman die genoemde ambtenaren vergezelt voor het verrichten van de
      met de hermeting samenhangende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel16
  - number: '17.1'
    text: |-
      De belanghebbende is gehouden bij hermeting de bij de vorige meting behorende meetbrief aan de ambtenaar van de
      Scheepsmetingsdienst, die de hermeting zal verrichten, af te geven.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel17
  - number: '17.2'
    text: Het Hoofd van de Scheepsmetingsdienst houdt van deze afgifte en van de hermeting aantekening in de ligger.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel17
  - number: '17.3'
    text: |-
      Indien het een meetbrief betreft, die in het buitenland is afgegeven, wordt de meetbrief toegezonden aan het Hoofd
      van de Scheepsmetingsdienst. Laatstgenoemde geeft daarna aan zijn ambtgenoot in het andere land hiervan kennis
      door middel van het formulier zoals vastgesteld in bijlage 4 van het besluit onder bijvoeging van de ingetrokken
      meetbrief.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel17
  - number: '18.1'
    text: |-
      In geval van wijziging van de naam of kenspreuk van een binnenvaartuig wordt op schriftelijke mededeling van
      de belanghebbende de nieuwe naam of de nieuwe kenspreuk op de meetbrief aangetekend door een ambtenaar van de
      Scheepsmetingsdienst.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel18
  - number: '18.2'
    text: Het Hoofd van de Scheepsmetingsdienst maakt van deze aantekening melding in de ligger.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel18
  - number: '18.3'
    text: |-
      Indien het een binnenvaartuig betreft dat in het buitenland is gemeten, geeft het Hoofd van de Scheepsmetingsdienst
      aan zijn ambtgenoot in het andere land van deze aantekening kennis door middel van het formulier zoals vastgesteld
      in bijlage 2 van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel18
  - number: '18.4'
    text: |-
      De in het eerste lid van dit artikel bedoelde aantekening en wordt gedagtekend, ondertekend en van het stempel van
      de Scheepsmetingsdienst voorzien.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel18
  - number: '19.1'
    text: |-
      Onverminderd het in [artikel 13, onder ][ref1] bepaalde, kunnen veranderingen ten aanzien van het vaartuig
      anders dan bedoeld in artikel 18, op de meetbrief worden aangetekend. De aantekening geschiedt op aanvraag van de
      belanghebbende door een ambtenaar van de Scheepsmetingsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel13
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '13'
  - number: '19.2'
    text: Het Hoofd van de Scheepsmetingsdienst maakt, indien nodig, van deze aantekening melding in de ligger.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel19
  - number: '19.3'
    text: |-
      Indien het een binnenvaartuig betreft dat in het buitenland is gemeten, is een schriftelijke machtiging van
      het land dat de meetbrief heeft afgegeven nodig voor het aanbrengen van een zodanige aantekening. Zonder deze
      schriftelijke machtiging is een aantekening in de meetbrief eveneens mogelijk, echter voorlopig, met een geldigheid
      van niet meer dan drie maanden. Een dergelijke aantekening dient in de daarvoor bestemde rubriek in de meetbrief te
      worden gewaarmerkt, waarbij tevens de duur van de voorlopige geldigheid dient te worden vermeld. Het Hoofd van de
      Scheepsmetingsdienst geeft aan zijn ambtgenoot in het andere land van de aantekening kennis.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel19
  - number: '19.4'
    text: |-
      Voor de in het eerste lid van dit artikel bedoelde aantekening worden kosten gerekend volgens het krachtens
      [artikel 12c, derde lid, van de Binnenschepenwet][ref1] vastgestelde tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel12c
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: 12c
  - number: '20'
    text: |-
      Wanneer een meetbrief geheel of gedeeltelijk verloren is geraakt of versleten is, kan de belanghebbende aan
      het Hoofd van de Scheepsmetingsdienst een afschrift verzoeken, dat hem tegen betaling van de kosten volgens het
      krachtens [artikel 12c, derde lid, van de Binnenschepenwet][ref1] vastgestelde tarief wordt verstrekt. De versleten
      meetbrief of het restant van een meetbrief wordt bij het verzoek overgelegd. Op verzoek van belanghebbende
      kunnen eveneens uittreksels van meetbrieven worden verstrekt tegen betaling van de kosten volgens het krachtens
      [artikel 12c, derde lid, van de Binnenschepenwet][ref2] vastgestelde tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel12c
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: 12c
      - id: ref2
        bwb_id: BWBR0003443
        artikel: 12c
  - number: '21.1'
    text: |-
      De ijkmerken of de ijkplaten moeten door of vanwege de belanghebbende worden onderhouden, zodat zij steeds
      duidelijk zichtbaar zijn.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel21
  - number: '21.2'
    text: |-
      Zijn één of meer ijkmerken of ijkplaten verloren geraakt, versleten of onzichtbaar geworden, dan
      worden deze, mits de meetbrief nog geldig is, op verzoek van belanghebbende door een ambtenaar van
      de Scheepsmetingsdienst door nieuwe vervangen tegen betaling van de kosten volgens het krachtens
      [artikel 12c, derde lid, van de Binnenschepenwet][ref1] vastgestelde tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel12c
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: 12c
  - number: '23.1'
    text: |-
      De autoriteiten of ambtenaren, aan wie het in Nederland verloren gaan, slopen of blijvend voor de vaart ongeschikt
      worden van een in Nederland gemeten binnenvaartuig mocht blijken, geven daarvan onverwijld kennis aan het Hoofd van
      de Scheepsmetingsdienst, voor zover mogelijk onder bijvoeging van de meetbrief en met vermelding van de bij of op
      de ijkmerken of de ijkplaten of elders op het schip voorkomende letters en nummers.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel23
  - number: '23.2'
    text: |-
      De belanghebbende is gehouden bij verloren gaan, slopen of blijvend ongeschikt worden voor de vaart van een gemeten
      binnenvaartuig de meetbrief in te leveren bij het Hoofd van de Scheepsmetingsdienst.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel23
  - number: '24.1'
    text: |-
      Door het Hoofd van de Scheepsmetingsdienst wordt een ligger aangelegd en bijgehouden tot inschrijving van de
      gemeten binnenvaartuigen.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel24
  - number: '24.2'
    text: |-
      De formulieren voor het opmaken van de meetbrief en voor de ligger, de voorschriften omtrent de invulling en de
      letters worden door het Hoofd van de Scheepsmetingsdienst vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel24
  - number: '25'
    text: Het Metingsbesluit Binnenvaartuigen 1954 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel25
  - number: '26'
    text: |-
      Dit besluit, hetwelk kan worden aangehaald onder de titel "Metingsbesluit Binnenvaartuigen 1978", treedt in werking
      op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel26
