        artikel: '5'
  - number: '2'
    text: >-
      1 De meting van binnenvaartuigen heeft ten doel de verplaatsing vast te stellen, evenals, indien nodig, een deel
      van de verplaatsing in samenhang met de inzinking. De meting van binnenvaartuigen, bestemd of ingericht voor het
      vervoer van goederen, heeft tevens ten doel het mogelijk te maken het gewicht van de lading volgens de inzinking
      te bepalen.


      2 Voor binnenvaartuigen die niet zijn bestemd of ingericht voor het vervoer van goederen worden, behalve de
      verplaatsing, bovendien de maximum toelaatbare waterverplaatsing en de waterverplaatsing in ledige toestand
      bepaald.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel2
  - number: '3'
    text: >-
      1 De meting geschiedt overeenkomstig het bepaalde bij of krachtens dit besluit.


      2 Voor de meting van een binnenvaartuig worden de maten aan het vaartuig zelf gemeten. Het te meten deel van het
      binnenvaartuig is het deel dat begrepen is tussen het vlak van de grootste toegelaten diepgang en het vlak van
      inzinking van het ledige vaartuig.


      3 Bij het meten van lengten en breedten worden de onderdelen van centimeters, wanneer deze vijf millimeter of meer
      bedragen, voor een centimeter gerekend en anders verwaarloosd.


      4 Bij het meten van hoogten worden de onderdelen van centimeters tot op een tiende centimeter in aanmerking
      genomen.


      5 Bij de berekening worden breuken van duizendste delen, wanneer deze vijf tienduizendste of meer bedragen, voor
      een duizendste gerekend en anders verwaarloosd.


      6 Bij de eindberekening van de verplaatsing worden onderdelen van een kubieke decimeter verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel3
  - number: '4'
    text: >-
      1 Het vlak van inzinking van het ledige vaartuig, is het vlak overeenkomende met het wateroppervlak indien:


      a. het vaartuig geen brandstof of verplaatsbare ballast aan boord heeft doch slechts de uitrusting, de proviand
      en de bemanning die normaal aan boord zijn als het vaartuig vaart; alsmede het water, dat niet door gebruikelijke
      middelen uit het ruim kan worden verwijderd; de drinkwatervoorraad mag echter 0,5% van de grootste verplaatsing van
      het vaartuig niet aanzienlijk overschrijden;


      b. de werktuigen, ketels, pijpleidingen en installaties, nodig voor de voortstuwing of voor de noodzakelijke
      hulpwerktuigen, zomede voor verwarming of koeling, het water, de olie of de andere vloeistoffen bevatten waarvan
      zij in gewone omstandigheden worden voorzien om dienst te kunnen doen;


      c. het vaartuig zich in zoet water bevindt, dat wil zeggen in water met een soortelijk gewicht gelijk aan 1.


      2 Indien het vaartuig zich bij de meting niet in de toestand, omschreven in het eerste lid van dit artikel,
      bevindt, of niet in omstandigheden die leiden tot dezelfde inzinking en ongeveer dezelfde trimligging, moet het
      verschil in belasting en het verschil in soortelijk gewicht van het water in aanmerking worden genomen bij het
      maken van de berekeningen.


      3 De gewichten aan boord die behoren bij de ledige inzinking moeten in de meetbrief worden vermeld.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel4
  - number: '5'
    text: |-
      1 Het vlak van de grootste toegelaten diepgang is het vlak, vastgesteld overeenkomstig de voor dat binnenvaartuig
      geldende regels van het [Binnenschepenbesluit][ref1].

      2 Voor binnenvaartuigen waarop de [Binnenschepenwet][ref2] niet van toepassing is, wordt het vlak van de grootste
      toegelaten diepgang vastgesteld overeenkomstig bijlage II bij het [Binnenschepenbesluit][ref3].

      3 Voor binnenvaartuigen die bestemd zijn voor het vervoer van goederen kan op verzoek van de belanghebbende het
      vlak van de grootste toegelaten diepgang ten hoogste tien procent van de gemiddelde laadhoogte lager worden gesteld
      dan in het eerste of tweede lid bepaald.

      4 In bijzondere gevallen kan op verzoek van de belanghebbende het vlak van de grootste toegelaten diepgang
      meer dan tien procent van de gemiddelde laadhoogte lager worden gesteld, mits ten genoegen van het Hoofd van de
      Scheepsmetingsdienst wordt aangetoond dat de grootste diepgang waarop het schip zal kunnen varen geringer is dan de
      diepgang, bepaald volgens het derde lid.

      5 Voor binnenvaartuigen die niet zijn bestemd noch ingericht voor het vervoer van goederen kan op verzoek van de
      belanghebbende het vlak van de grootste toegelaten diepgang lager worden gesteld dan in het eerste en tweede lid
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
      [ref2]: https://wetten.overheid.nl/BWBR0003443
      [ref3]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel5
