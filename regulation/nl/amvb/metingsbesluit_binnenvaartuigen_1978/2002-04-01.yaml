preamble:
  text: >-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 15 augustus 1978, Directoraat-Generaal van
    Scheepvaart, no. J/S 23196;


    Gelet op de op 15 februari 1966 te Genève ondertekende Overeenkomst nopens de meting van binnenvaartuigen met
    Bijlage en Protocol van Ondertekening, goedgekeurd door de Staten-Generaal op 14 september 1967 (Trb. 1967, no.
    43);


    Mede gelet op de Wet van 10 maart 1979, Stb. 171, inzake de berekening van de kosten voor de meting van
    binnenvaartuigen;


    De Raad van State gehoord (advies van 13 september 1978, no. 16);


    Gezien het nader rapport van de voornoemde Minister van 8 juni 1979. Directoraat-Generaal van Scheepvaart, no. J/
    S 22174;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het in dit besluit bepaalde wordt verstaan onder:

      a. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      b. Scheepsmetingsdienst: de Scheepsmetingsdienst, ingesteld bij Koninklijk besluit van 11 december 1933 (*Stb.*
      682);

      c. Overeenkomst: de op 15 februari 1966 te Genève ondertekende en op 14 september 1967 goedgekeurde Overeenkomst
      nopens de meting van binnenvaartuigen, met Bijlage en Protocol van Ondertekening (*Trb.* 1967, 43);

      d. binnenvaartuigen: alle vaartuigen, welke tot de vaart op de binnenwateren worden gebruikt of bestemd zijn,
      zomede die, welke belanghebbenden als zodanig doen of hebben doen meten;

      e. belanghebbende: de eigenaar van het binnenvaartuig of degene die namens de eigenaar optreedt;

      f. verplaatsing: de in kubieke meters uitgedrukte waterverplaatsing van een binnenvaartuig tussen het vlak van
      inzinking van het ledige binnenvaartuig in zoet water en het vlak van de grootste toegelaten diepgang;

      g. maximum toelaatbare waterverplaatsing: de in kubieke meters uitgedrukte waterverplaatsing van een binnenvaartuig
      tot het vlak van de grootste toegelaten diepgang;

      h. vlak van inzinking van het ledige vaartuig: het vlak overeenkomende met het bepaalde in [artikel 4][ref1] van
      dit besluit;

      i. vlak van de grootste toegelaten diepgang: het vlak dat kan worden aangebracht door de onderzijden van de door
      de Scheepsmetingsdienst aangebrachte ijkmerken, in overeenstemming met het bepaalde in [artikel 5][ref2] van dit
      besluit;

      j. meetbrief: de meetbrief, afgegeven door de Scheepsmetingsdienst overeenkomstig de bepalingen van dit besluit,
      dan wel afgegeven door de administratie van een andere Staat, aangesloten bij de Overeenkomst;

      k. ligger: het register waarin de Scheepsmetingsdienst, onder een eigen volgnummer, elke meetbrief inschrijft die
      hij uitreikt, zomede de datum van de uitreiking, de naam of de kenspreuk van het vaartuig en de andere gegevens
      waardoor een binnenvaartuig kan worden geïdentificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003246#Artikel5
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel1
    references:
