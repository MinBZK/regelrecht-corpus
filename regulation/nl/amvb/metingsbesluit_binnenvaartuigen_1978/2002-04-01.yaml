  - number: '6'
    text: >-
      De meting, hermeting of controle-meting wordt uitgevoerd op aanvraag van de belanghebbende bij het Hoofd van de
      Scheepsmetingsdienst.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel6
  - number: '7'
    text: >-
      1 De ligplaats van het te meten binnenvaartuig of van het binnenvaartuig waarvan de meting gecontroleerd dient te
      worden, moet zijn ten genoegen van de ambtenaar van de Scheepsmetingsdienst in stil, bij voorkeur zoet water en
      zodanig, dat het vaartuig van alle zijden toegankelijk is.


      2 Degene die de meting heeft aangevraagd, is gehouden gedurende de meting alle voorschriften van de ambtenaar van
      de Scheepsmetingsdienst met betrekking tot de ligging van het vaartuig op het vlak van inzinking van het ledige
      vaartuig en de eventuele verplaatsing van losse voorwerpen op te volgen, de nodige hulp te verschaffen bij de
      meting en bij het aanbrengen van de ijkmerken of de ijkplaten en daartoe een deugdelijke roeiboot met ten minste
      twee man beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel7
  - number: '8'
    text: |-
      1 Zo spoedig mogelijk na de meting, doch uiterlijk de zevende werkdag daarna, verstrekt het Hoofd van de
      Scheepsmetingsdienst de meetbrief aan hem, die de meting heeft aangevraagd.

      2 De meetbrief moet overeenstemmen met het van toepassing zijnde model als aangegeven in bijlage 1 van dit besluit.

      3 Op de meetbrief worden de zones als bedoeld in bijlage I bij het [Binnenschepenbesluit][ref1], waarin het
      binnenvaartuig bestemd is te varen, vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004196
  - number: '9'
    text: >-
      Een meetbrief, afgegeven door een bureau van meting van een andere Staat aangesloten bij de Overeenkomst, wordt
      gelijkgesteld aan een meetbrief afgegeven door de Scheepsmetingsdienst overeenkomstig de bepalingen van dit
      besluit.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel9
  - number: '10'
    text: >-
      Binnenvaartuigen, bestemd voor het vervoer van goederen, kunnen bij meting of hermeting van ijkschalen worden
      voorzien, indien de belanghebbende een schriftelijk verzoek daartoe indient.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel10
  - number: '11'
    text: >-
      De geldigheidsduur van een meetbrief is ten hoogste vijftien jaar, te rekenen van de datum van afgifte. De
      geldigheidsduur van de meetbrief kan telkenmale worden verlengd:


      a. indien het een binnenvaartuig betreft dat bestemd is voor het vervoer van goederen voor een periode van ten
      hoogste tien jaar;


      b. indien het een ander binnenvaartuig betreft voor een periode van ten hoogste vijftien jaar.


      De vervaldatum wordt op de meetbrief vermeld.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel11
  - number: '12'
    text: >-
      1 De geldigheidsduur van een meetbrief wordt op verzoek van de belanghebbende verlengd, indien bij een
      controlemeting blijkt dat de gegevens van de meetbrief nog juist zijn. Teneinde te kunnen vaststellen of de
      gegevens van de meetbrief nog juist zijn moeten de volgende afmetingen van het binnenvaartuig worden gecontroleerd:


      a. de lengte en de breedte, alsmede de inzinking van het ledige vaartuig ter plaatse van elk ijkmerk;


      b. ingeval het vaartuig blijvende vervormingen heeft: enkele breedten aan de hand van de laatste staat van meting,
      om na te gaan of de vervormingen vóór of na de laatste meting zijn ontstaan.


      2 Van de uitkomst van de controle en van de datum waarop de geldigheidsduur van de meetbrief is verlengd, houdt het
      Hoofd van de Scheepsmetingsdienst aantekening in de staat van meting en in de ligger.


      3 Tenzij het betreffende bij de Overeenkomst aangesloten land zulks niet toestaat kan de geldigheidsduur van een
      door een van zijn bureaus van meting afgegeven meetbrief voor een vaartuig, bestemd voor het vervoer van goederen,
      worden verlengd, overeenkomstig het bepaalde in dit besluit.


      4 Van de uitkomst van de controle van een in het buitenland gemeten binnenvaartuig alsmede van de datum waarop
      de geldigheidsduur van een dergelijke meetbrief is verlengd, moet kennis worden gegeven aan het Hoofd van de
      Scheepsmetingsdienst. Laatstgenoemde geeft daarna aan zijn ambtgenoot in het andere land hiervan kennis door middel
      van het formulier als aangegeven in bijlage 3 van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel12
  - number: '13'
    text: |-
      De meetbrief vervalt:

      a. door het verstrijken van de geldigheidsduur als vermeld in [artikel 11][ref1];

      b. wanneer het binnenvaartuig een verbouwing ondergaat, die van invloed is op de ligging van het vlak van inzinking
      van het ledige vaartuig, op de verplaatsing dan wel op de in de meetbrief vermelde afmetingen;

      c. wanneer het binnenvaartuig, bestemd voor het vervoer van goederen, van bestemming verandert, zodat het gaat
      behoren tot een vaartuig, niet bestemd voor het vervoer van goederen, of omgekeerd;

      d. wanneer in de meetbrief één of meer wijzigingen zijn aangebracht door daartoe niet bevoegde personen;

      e. wanneer aan het binnenvaartuig andere veranderingen dan wel blijvende beschadigingen zijn aangebracht, waardoor
      de omschrijving in de meetbrief niet meer juist is;

      f. wanneer de meetbrief niet meer volledig aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel11
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '11'
  - number: '14'
    text: |-
      1 Indien aan een ambtenaar van de Scheepsmetingsdienst blijkt, dat zich ten aanzien van een in Nederland
      geregistreerd binnenvaartuig één der gevallen, voorzien in [artikel 13, onder ][ref1] voordoet, is hij verplicht de
      meetbrief in te trekken.

      2 Het Hoofd van de Scheepsmetingsdienst houdt van de intrekking aantekening in de ligger.

      3 Indien één der gevallen voorzien in [artikel 13, onder ][ref2] zich voordoet ten aanzien van een in het
      buitenland geregistreerd binnenvaartuig, dient zulks te worden gemeld aan het Hoofd van de Scheepsmetingsdienst.
      Laatstgenoemde dient zijn ambtgenoot van het betreffende land waar het vaartuig is geregistreerd, hiervan te
      verwittigen. In de meetbrief van het betreffende binnenvaartuig wordt een verklaring gehecht als vastgesteld door
      het Hoofd van de Scheepsmetingsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003246#Artikel13
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0003246
        artikel: '13'
  - number: '15'
    text: |-
      1 Een binnenvaartuig is, wanneer het zich op de Nederlandse binnenvaarwegen bevindt, verplicht zich te onderwerpen
      aan een inspectie door ambtenaren van de Scheepsmetingsdienst.

      2 De in het eerste lid bedoelde inspectie heeft als enig doel vast te stellen:

      a. dat het schip is voorzien van een geldige meetbrief;

      b. dat de voornaamste kenmerken van het binnenvaartuig in overeenstemming zijn met de gegevens vermeld op de
      meetbrief.

      3 Indien uit de inspectie blijkt dat de voornaamste kenmerken van het binnenvaartuig afwijken van die vermeld op de
      meetbrief, dan dient te worden gehandeld overeenkomstig het bepaalde in [artikel 14][ref1] van dit besluit.

      4 De in het eerste lid bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een
      woning binnen te treden zonder toestemming van de bewoner. Zij beschikken niet over de bevoegdheid, genoemd in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel518
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:18
  - number: '16'
    text: >-
      1 De belanghebbende, die met de uitkomst van de meting van zijn vaartuig geen genoegen neemt, kan binnen zes
      maanden na de afgifte van de meetbrief bij het Hoofd van de Scheepsmetingsdienst hermeting verzoeken. De hermeting
      is beslissend.


      2 De hermeting en zonodig de vernieuwing van de ijkmerken of de ijkplaten geschieden kosteloos, indien het verschil
      met de eerste meting meer bedraagt dan:


      1 procent voor de verplaatsingscijfers van maximaal 500 kubieke meter;


      5 kubieke meter voor de verplaatsingscijfers van meer dan 500 kubieke meter tot maximaal 2000 kubieke meter;


      0,25 procent voor de verplaatsingscijfers van meer dan 2000 kubieke meter.


      Het verschil wordt bepaald over eenzelfde laadhoogte.


      Het Hoofd van de Scheepsmetingsdienst geeft in deze gevallen een nieuwe meetbrief af, waarin de
      onderscheidingstekenen en het volgnummer van inschrijving in de ligger van de eerste meetbrief worden overgenomen.


      3 Is het verschil met de eerste meting gelijk aan of minder dan de percentages of het aantal kubieke meters,
      vermeld in het tweede lid van dit artikel dan wordt de eerste meting als juist aangemerkt en moet de belanghebbende
      voor de hermeting de kosten betalen welke voor een normale meting in rekening worden gebracht, zomede de
      reis- en verblijfkosten van de ambtenaren van de Scheepsmetingsdienst overeenkomstig de daarvoor geldende
      vergoedingsregeling en de reiskosten van de werkman die genoemde ambtenaren vergezelt voor het verrichten van de
      met de hermeting samenhangende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel16
  - number: '17'
    text: >-
      1 De belanghebbende is gehouden bij hermeting de bij de vorige meting behorende meetbrief aan de ambtenaar van de
      Scheepsmetingsdienst, die de hermeting zal verrichten, af te geven.


      2 Het Hoofd van de Scheepsmetingsdienst houdt van deze afgifte en van de hermeting aantekening in de ligger.


      3 Indien het een meetbrief betreft, die in het buitenland is afgegeven, wordt de meetbrief toegezonden aan het
      Hoofd van de Scheepsmetingsdienst. Laatstgenoemde geeft daarna aan zijn ambtgenoot in het andere land hiervan
      kennis door middel van het formulier zoals vastgesteld in bijlage 4 van het besluit onder bijvoeging van de
      ingetrokken meetbrief.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel17
  - number: '18'
    text: >-
      1 In geval van wijziging van de naam of kenspreuk van een binnenvaartuig wordt op schriftelijke mededeling van
      de belanghebbende de nieuwe naam of de nieuwe kenspreuk op de meetbrief aangetekend door een ambtenaar van de
      Scheepsmetingsdienst.


      2 Het Hoofd van de Scheepsmetingsdienst maakt van deze aantekening melding in de ligger.


      3 Indien het een binnenvaartuig betreft dat in het buitenland is gemeten, geeft het Hoofd van de
      Scheepsmetingsdienst aan zijn ambtgenoot in het andere land van deze aantekening kennis door middel van het
      formulier zoals vastgesteld in bijlage 2 van dit besluit.


      4 De in het eerste lid van dit artikel bedoelde aantekening en wordt gedagtekend, ondertekend en van het stempel
      van de Scheepsmetingsdienst voorzien.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel18
  - number: '19'
    text: |-
      1 Onverminderd het in [artikel 13, onder ][ref1] bepaalde, kunnen veranderingen ten aanzien van het vaartuig
      anders dan bedoeld in artikel 18, op de meetbrief worden aangetekend. De aantekening geschiedt op aanvraag van de
      belanghebbende door een ambtenaar van de Scheepsmetingsdienst.

      2 Het Hoofd van de Scheepsmetingsdienst maakt, indien nodig, van deze aantekening melding in de ligger.

      3 Indien het een binnenvaartuig betreft dat in het buitenland is gemeten, is een schriftelijke machtiging van
      het land dat de meetbrief heeft afgegeven nodig voor het aanbrengen van een zodanige aantekening. Zonder deze
      schriftelijke machtiging is een aantekening in de meetbrief eveneens mogelijk, echter voorlopig, met een geldigheid
      van niet meer dan drie maanden. Een dergelijke aantekening dient in de daarvoor bestemde rubriek in de meetbrief te
      worden gewaarmerkt, waarbij tevens de duur van de voorlopige geldigheid dient te worden vermeld.

      Het Hoofd van de Scheepsmetingsdienst geeft aan zijn ambtgenoot in het andere land van de aantekening kennis.

      4 Voor de in het eerste lid van dit artikel bedoelde aantekening worden kosten gerekend volgens het krachtens
      [artikel 12c, derde lid, van de Binnenschepenwet][ref2] vastgestelde tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel12c
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel19
