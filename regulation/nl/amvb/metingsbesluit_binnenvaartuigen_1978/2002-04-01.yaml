        artikel: 12c
  - number: '20'
    text: |-
      Wanneer een meetbrief geheel of gedeeltelijk verloren is geraakt of versleten is, kan de belanghebbende aan
      het Hoofd van de Scheepsmetingsdienst een afschrift verzoeken, dat hem tegen betaling van de kosten volgens het
      krachtens [artikel 12c, derde lid, van de Binnenschepenwet][ref1] vastgestelde tarief wordt verstrekt. De versleten
      meetbrief of het restant van een meetbrief wordt bij het verzoek overgelegd.

      Op verzoek van belanghebbende kunnen eveneens uittreksels van meetbrieven worden verstrekt tegen betaling van de
      kosten volgens het krachtens [artikel 12c, derde lid, van de Binnenschepenwet][ref2] vastgestelde tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel12c
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: 12c
      - id: ref2
        bwb_id: BWBR0003443
        artikel: 12c
  - number: '21'
    text: |-
      1 De ijkmerken of de ijkplaten moeten door of vanwege de belanghebbende worden onderhouden, zodat zij steeds
      duidelijk zichtbaar zijn.

      2 Zijn één of meer ijkmerken of ijkplaten verloren geraakt, versleten of onzichtbaar geworden, dan
      worden deze, mits de meetbrief nog geldig is, op verzoek van belanghebbende door een ambtenaar van
      de Scheepsmetingsdienst door nieuwe vervangen tegen betaling van de kosten volgens het krachtens
      [artikel 12c, derde lid, van de Binnenschepenwet][ref1] vastgestelde tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel12c
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: 12c
  - number: '23'
    text: >-
      1 De autoriteiten of ambtenaren, aan wie het in Nederland verloren gaan, slopen of blijvend voor de vaart
      ongeschikt worden van een in Nederland gemeten binnenvaartuig mocht blijken, geven daarvan onverwijld kennis aan
      het Hoofd van de Scheepsmetingsdienst, voor zover mogelijk onder bijvoeging van de meetbrief en met vermelding van
      de bij of op de ijkmerken of de ijkplaten of elders op het schip voorkomende letters en nummers.


      2 De belanghebbende is gehouden bij verloren gaan, slopen of blijvend ongeschikt worden voor de vaart van een
      gemeten binnenvaartuig de meetbrief in te leveren bij het Hoofd van de Scheepsmetingsdienst.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel23
  - number: '24'
    text: >-
      1 Door het Hoofd van de Scheepsmetingsdienst wordt een ligger aangelegd en bijgehouden tot inschrijving van de
      gemeten binnenvaartuigen.


      2 De formulieren voor het opmaken van de meetbrief en voor de ligger, de voorschriften omtrent de invulling en de
      letters worden door het Hoofd van de Scheepsmetingsdienst vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel24
  - number: '25'
    text: Het Metingsbesluit Binnenvaartuigen 1954 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel25
  - number: '26'
    text: >-
      Dit besluit, hetwelk kan worden aangehaald onder de titel "Metingsbesluit Binnenvaartuigen 1978", treedt in werking
      op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003246/2002-04-01#Artikel26
