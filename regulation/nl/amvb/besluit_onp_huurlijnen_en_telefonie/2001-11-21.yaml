  - number: '46'
    text: >-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel46
  - number: '47'
    text: 'Dit besluit wordt aangehaald als: Besluit ONP huurlijnen en telefonie.'
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel47
