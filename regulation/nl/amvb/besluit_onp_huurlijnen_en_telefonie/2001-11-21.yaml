  - number: '21'
    text: >-
      1 Een aanbieder van huurlijnen brengt ieder jaar voor 1 april een statistisch onderbouwd verslag uit aan
      het college over de resultaten in het daaraan voorafgaande kalenderjaar met betrekking tot de bekendgemaakte
      leveringsvoorwaarden, in het bijzonder wat leveringstermijn en reparatietijd betreft, ten aanzien van huurlijnen.


      2 Het eerste verslag, bedoeld in het eerste lid, na inwerkingtreding van dit besluit, kan betrekking hebben op een
      door het college te bepalen gedeelte van het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel21
  - number: '22'
    text: >-
      Een aanbieder van een vast openbaar telefoonnetwerk zorgt ervoor dat randapparaten die voldoen aan het bepaalde bij
      of krachtens de wet, op het vaste openbare telefoonnetwerk kunnen worden aangesloten en kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel22
  - number: '23'
    text: |-
      De aanbieders van een vast openbaar telefoonnetwerk, van een vaste openbare telefoondienst en van
      een mobiele openbare telefoondienst zorgen ervoor dat gebruikers van dat netwerk en van die diensten
      toegang hebben tot de diensten van een telefonist en tot de abonnee-informatiedienst, bedoeld in
      [artikel 2, onderdeel d, van het Besluit universele dienstverlening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009996#Artikel2
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009996
        artikel: '2'
  - number: '24'
    text: |-
      1 Een aanbieder van een vast openbaar telefoonnetwerk, van een mobiel openbaar telefoonnetwerk, van een vaste
      openbare telefoondienst of van een mobiele openbare telefoondienst maakt op genoegzame wijze informatie bekend
      betreffende de voorwaarden voor de toegang tot en het gebruik van die telefoonnetwerken en telefoondiensten. Van
      die informatie maakt in ieder geval deel uit informatie over

      a. de tarieven;

      b. de algemene voorwaarden die die aanbieder hanteert;

      c. de minimale periode waarvoor een overeenkomst kan worden aangegaan, en

      d. de voorwaarden voor vernieuwing van overeenkomsten.

      2 [Artikel 11][ref1] is van overeenkomstige toepassing op het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009998#Artikel11
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009998
        artikel: '11'
        paragraaf: '2'
  - number: '25'
    text: >-
      1 Een aanbieder van een vaste openbare telefoondienst of van een mobiele openbare telefoondienst sluit een
      schriftelijke overeenkomst, tenzij de aard of de strekking van de overeenkomst zich daar niet toe leent, met een
      afnemer van die telefoondienst. In die schriftelijke overeenkomst dan wel in de algemene voorwaarden neemt de
      betreffende aanbieder informatie op met betrekking tot de volgende onderwerpen:


      a. de wachttijd bij eerste aansluiting op de vaste openbare telefoondienst of de mobiele openbare telefoondienst;


      b. soorten onderhoudsservice;


      c. de schadevergoedings- of terugbetalingsregeling voor contractanten bij niet levering van de telefoondienst zoals
      is overeengekomen;


      d. geschillenregeling;


      e. een nadere specificatie van de dienst, en


      f. de kwaliteitsniveaus van de geboden dienst.


      2 Teneinde de rechten van afnemers zoals bedoeld in het eerste lid te beschermen, kan het college van de aanbieder
      van een vaste openbare telefoondienst of van een mobiele openbare telefoondienst verlangen dat die aanbieder
      de voorwaarden, verbonden aan een overeenkomst, bedoeld in het eerste lid, en voorzover van toepassing de
      schadevergoedings- of terugbetalingsregelingen, bedoeld in het eerste lid, in overeenstemming brengt met het bij of
      krachtens de wet bepaalde ter uitvoering van [richtlijn 98/10/EG](31998L0010).
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel25
  - number: '26'
    text: |-
      1 Een aanbieder van een vast openbaar telefoonnetwerk verschaft het college informatie over de technische
      specificaties van de interface voor de netwerktoegang, als bedoeld in bijlage II, deel 1, van [richtlijn 98/10/
      EG](31998L0010).

      2 Een aanbieder van een vast openbaar telefoonnetwerk stelt het college van wijzigingen in de informatie, bedoeld
      in het eerste lid, ten minste twee maanden voor de datum waarop die wijzigingen ingaan, op de hoogte.

      3 Een aanbieder van een vast openbaar telefoonnetwerk maakt de informatie, bedoeld in het eerste lid, en de
      wijzigingen in de informatie, bedoeld in het tweede lid, op genoegzame wijze bekend.

      4 [Artikel 11][ref1] is van overeenkomstige toepassing op het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009998#Artikel11
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009998
        artikel: '11'
        paragraaf: '2'
  - number: '27'
    text: |-
      1 Een aanbieder van een vast openbaar telefoonnetwerk of van een vaste openbare telefoondienst, die krachtens
      [artikel 6.4, eerste lid, van de wet][ref1] door het college is aangewezen dan wel is aangewezen overeenkomstig
      [artikel 9.2 van de wet][ref2], maakt jaarlijks over het afgelopen kalenderjaar een overzicht van de kwaliteit van
      de door hem aangeboden dienst op basis van de in bijlage III van [richtlijn 98/10/EG](31998L0010) gespecificeerde
      parameters, definities en meetmethoden.

      [Artikel 21, tweede lid][ref3], is van overeenkomstige toepassing.

      2 Een aanbieder van een vast openbaar telefoonnetwerk of van een vaste openbare telefoondienst, niet zijnde een
      aanbieder als bedoeld in het eerste lid, welke meer dan 18 maanden dergelijke diensten levert, maakt eveneens
      jaarlijks over het afgelopen kalenderjaar een overzicht als bedoeld in het eerste lid.

      3 Een aanbieder, bedoeld in het eerste en tweede lid, stelt het overzicht, bedoeld in het eerste en tweede lid,
      op verzoek aan het college ter beschikking. Het college kan het overzicht geheel of gedeeltelijk bekendmaken in
      de Staatscourant.

      4 Het college kan, indien uit de overzichten, bedoeld in het eerste en tweede lid, blijkt dat de kwaliteit
      van de door een bepaalde aanbieder geleverde dienst naar het oordeel van het college, rekening houdend met de
      gerechtvaardigde belangen van de afnemers, onvoldoende is, bij besluit voor die aanbieder prestatiedoelstellingen
      vaststellen. In dat besluit wordt tevens bepaald wanneer de aanbieder aan de prestatiedoelstellingen voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6.4
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel9.2
      [ref3]: https://wetten.overheid.nl/BWBR0009998#Artikel21
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6.4'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '9.2'
      - id: ref3
        bwb_id: BWBR0009998
        artikel: '21'
        paragraaf: '2'
  - number: '28'
    text: >-
      Een aanbieder van een vast openbaar telefoonnetwerk of van een vaste openbare telefoondienst is slechts gerechtigd
      de door hem geleverde dienst te onderbreken, te beëindigen, aanzienlijk te wijzigen of te beperken met voorafgaande
      toestemming van het college.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel28
  - number: '29'
    text: |-
      1 In afwijking van [artikel 28][ref1] is een aanbieder van een vast openbaar telefoonnetwerk of van een vaste
      openbare telefoondienst gerechtigd de toegang tot en het gebruik van het vaste openbare telefoonnetwerk te
      onderbreken, te beëindigen, aanzienlijk te wijzigen of te beperken teneinde de veiligheid van het functioneren van
      het telefoonnetwerk gedurende een noodsituatie te waarborgen.

      Onder een noodsituatie wordt in dit verband verstaan: uitzonderlijke gevallen van overmacht, zoals extreme
      weersomstandigheden, aardbevingen, overstromingen, blikseminslag of brand.

      2 De aanbieder, bedoeld in het eerste lid, maakt van het recht, bedoeld in het eerste lid, op zodanige wijze
      gebruik dat de door hem genomen maatregel in verhouding is tot de omstandigheden en niet discriminerend is.

      3 In afwijking van [artikel 28][ref2] is een aanbieder van een vaste openbare telefoondienst gerechtigd maatregelen
      te nemen tegen een afnemer van die dienst vanwege wanbetaling, indien die maatregelen de goedkeuring hebben van het
      college en genoegzaam bekend zijn gemaakt. De maatregelen staan in verhouding tot de ernst van de wanbetaling en
      zijn niet discriminerend.


      [ref1]: https://wetten.overheid.nl/BWBR0009998#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0009998#Artikel28
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009998
        artikel: '28'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009998
        artikel: '28'
        paragraaf: '3'
  - number: '30'
    text: >-
      Een aanbieder van een vaste openbare telefoondienst levert de faciliteiten toonkiezen en, op verzoek, selectieve
      nummerblokkering, genoemd in bijlage I, deel 1, van [richtlijn 98/10/EG](31998L0010).
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel30
  - number: '31'
    text: |-
      1 Een aanbieder van een vaste openbare telefoondienst verstrekt, onverminderd het bepaalde bij of krachtens
      [hoofdstuk 11 van de wet][ref1], op verzoek aan een afnemer van die telefoondienst een gespecificeerde rekening. De
      aanbieder kan slechts een redelijke vergoeding vragen voor een gespecificeerde rekening indien deze rekening meer
      is gespecificeerd dan het bij ministeriële regeling bepaalde basisniveau van specificatie.

      2 Gesprekken die kosteloos worden gevoerd, worden niet op de gespecificeerde rekening vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '11'
  - number: '32'
    text: |-
      1 Een aanbieder van een vaste openbare telefoondienst, die krachtens [artikel 6.4, eerste lid, van de wet][ref1]
      door het college is aangewezen, stelt de in bijlage I, deel 2, van [richtlijn 98/10/EG](31998L0010) genoemde
      faciliteiten ter beschikking.

      2 Het college kan ontheffing verlenen van het bepaalde in het eerste lid, indien het technisch niet uitvoerbaar
      dan wel economisch niet haalbaar is de betreffende faciliteit beschikbaar te stellen. Het college kan voorschriften
      verbinden aan een ontheffing. Een ontheffing kan onder beperkingen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6.4
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6.4'
  - number: '33'
    text: >-
      Een aanbieder van een vaste openbare telefoondienst draagt ervoor zorg dat gedurende twee maanden nadat een
      afnemer van zijn vaste openbare telefoondienst op een andere aanbieder van een vaste openbare telefoondienst
      is overgestapt, een telefonische oproep naar het oude nummer van die afnemer naar zijn nieuwe nummer kan worden
      doorverbonden dan wel dat inlichtingen over het nieuwe nummer worden verstrekt. Indien een aanbieder een tarief
      hiervoor rekent, is dit tarief redelijk.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel33
  - number: '34'
    text: |-
      1 Een aanbieder van een vaste openbare telefoondienst, die krachtens [artikel 6.4, eerste lid, van de wet][ref1]
      door het college is aangewezen, neemt bij de vaststelling van tarieven het volgende in acht:

      a. de tarieven zijn op objectieve kwalitatieve en kwantitatieve criteria gebaseerd;

      b. de tarieven kunnen in rekening worden gebracht door middel van eenmalige vergoedingen, periodieke vergoedingen
      en gebruiksafhankelijke vergoedingen;

      c. de tarieven zijn doorzichtig;

      d. de tarieven zijn niet discriminerend en moeten gelijkheid van behandeling waarborgen;

      e. de in onderdeel a bedoelde tarieven worden op genoegzame wijze bekendgemaakt;

      f. de tarieven zijn onafhankelijk van de aard van de door de gebruiker gerealiseerde toepassing behalve wanneer en
      voorzover hij andere diensten of faciliteiten verlangt;

      g. de tarieven voor faciliteiten die verder gaan dan het beschikbaar stellen van een aansluiting op het vaste
      openbare telefoonnetwerk en op de vaste openbare telefoondienst worden voldoende gesplitst, zodat geen betaling
      wordt verlangd voor faciliteiten die voor de gevraagde dienst niet nodig zijn.

      2 [Artikel 11][ref2] is van overeenkomstige toepassing op het eerste lid, onderdeel e.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6.4
      [ref2]: https://wetten.overheid.nl/BWBR0009998#Artikel11
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6.4'
      - id: ref2
        bwb_id: BWBR0009998
        artikel: '11'
        paragraaf: '2'
  - number: '35'
    text: |-
      1 Een aanbieder van een vaste openbare telefoondienst, die krachtens [artikel 6.4, eerste lid, van de wet][ref1]
      door het college is aangewezen, stelt kostengeoriënteerde tarieven vast voor het gebruik van het vaste openbare
      telefoonnetwerk en de vaste openbare telefoondienst.

      2 Ter waarborging van het in het eerste lid bepaalde stelt de aanbieder, bedoeld in het eerste lid, een systeem
      op voor de toerekening van kosten en opbrengsten aan het vaste openbare telefoonnetwerk en de vaste openbare
      telefoondienst. Dit systeem moet voldoen aan de bepalingen van [richtlijn 98/10/EG](31998L0010). Het college kan
      voorschriften geven met betrekking tot dit systeem.

      3 Het systeem, bedoeld in het tweede lid, behoeft de goedkeuring van het college.

      4 De aanbieder, bedoeld in het eerste lid, legt vanaf een door het college te bepalen datum elk jaar in de maand
      mei, over het voorafgaande kalenderjaar het resultaat van de toepassing van het in het tweede lid bedoelde systeem,
      zijnde een overzicht van de kosten en opbrengsten die zijn bepaald met behulp van het systeem, voor aan het
      college.

      5 Ter toetsing of overeenkomstig het systeem, bedoeld in het tweede lid, de toerekening van kosten en opbrengsten
      heeft plaatsgevonden, gaat het door de aanbieder voorgelegde resultaat vergezeld van een verklaring van de externe
      registeraccountant van die aanbieder.

      6 De aanbieder, bedoeld in het eerste lid, maakt, op verzoek van het college, aan het college bij het voorgelegde
      resultaat tevens kenbaar wat naar zijn oordeel het gevolg moet zijn voor de tarieven voor het gebruik van het vaste
      openbare telefoonnetwerk en de vaste openbare telefoondienst.

      7 Indien het college, rekening houdend met de op dat moment voorzienbare ontwikkelingen in de bedrijfsvoering van
      de betreffende aanbieder van de vaste openbare telefoondienst alsmede met op dat moment voorzienbare ontwikkelingen
      in de markt, van oordeel is dat de tarieven niet voldoende kostengeoriënteerd zijn of zullen zijn en de aanbieder
      niet bereid is de tarieven dienovereenkomstig aan te passen, geeft het college de aanbieder een aanwijzing, welke
      de aanbieder gehouden is op te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6.4
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6.4'
  - number: '36'
    text: |-
      1 Op wijzigingen van tarieven van een vast openbaar telefoonnetwerk en van een vaste openbare
      telefoondienst welke niet het gevolg zijn van toepassing van [artikel 35, zesde of zevende lid][ref1], is
      [artikel 35, eerste lid][ref2], van overeenkomstige toepassing.

      2 De aanbieder van een vast openbaar telefoonnetwerk en van een vaste openbare telefoondienst bedoeld in
      [artikel 35, eerste lid][ref3], voert een voorgenomen tariefwijziging niet in dan nadat het college de voorgenomen
      tariefwijziging heeft goedgekeurd.

      3 Het college beoordeelt binnen drie weken na ontvangst van een verzoek tot goedkeuring van een voorgenomen
      tariefwijziging, of de voorgenomen tariefwijziging in overeenstemming is met [artikel 35, eerste lid][ref4]. Indien
      gegevens als bedoeld in het achtste lid ontbreken, wordt de aanbieder, bedoeld in het tweede lid, binnen drie dagen
      na ontvangst van het verzoek, hiervan door het college op de hoogte gesteld.

      4 Het college kan de termijn, bedoeld in het derde lid, eerste volzin eenmaal met drie weken verlengen. Het college
      doet hiervan schriftelijk mededeling aan de aanbieder, bedoeld in het tweede lid.

      5 Indien het college van oordeel is dat de voorgenomen tariefwijziging in overeenstemming is met
      [artikel 35, eerste lid][ref5], neemt het college een besluit tot goedkeuring van de voorgenomen tariefwijziging.

      6 Indien het college van oordeel is dat de voorgenomen tariefwijziging niet in overeenstemming is met
      [artikel 35, eerste lid][ref6], doet het college hiervan mededeling aan de aanbieder, bedoeld in het tweede lid.
      Binnen vier weken na deze mededeling, deelt het college aan de aanbieder, bedoeld in het tweede lid, schriftelijk
      mede op welke punten de voorgenomen tariefwijziging niet voldoet aan [artikel 35, eerste lid][ref7].

      7 Het college beoordeelt een verzoek tot goedkeuring volgend op een schriftelijke mededeling als bedoeld in het
      zesde lid, binnen twee weken na ontvangst van dit verzoek.

      8 Het college stelt vast welke gegevens de aanbieder van een vast openbaar telefoonnetwerk en van een vaste
      openbare telefoondienst, bedoeld in [artikel 35, eerste lid][ref8], in elk geval overlegt bij een verzoek tot
      goedkeuring van een voorgenomen tariefwijziging, en in welke vorm deze gegevens worden ingediend. Het college doet
      hiervan mededeling in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009998#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0009998#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0009998#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0009998#Artikel35
