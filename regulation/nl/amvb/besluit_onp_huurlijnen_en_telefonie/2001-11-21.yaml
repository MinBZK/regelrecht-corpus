  - number: '45'
    text: |-
      Een goedkeuring van het college als bedoeld in de paragrafen 5.2, onderdeel c, en 5.5, onderdeel c, van het
      Besluit algemene richtlijnen telecommunicatie geldt als een goedkeuring bedoeld in [artikel 16, derde lid][ref1],
      onderscheidenlijk [artikel 35, derde lid, van dit besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009998#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009998#Artikel35
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel45
