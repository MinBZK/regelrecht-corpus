  - number: '37'
    text: |-
      Het college publiceert elk jaar in de Staatscourant een verklaring omtrent de inachtneming door de aanbieders van
      de [artikelen 35][ref1] en [36][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009998#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0009998#Artikel36
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel37
    references:
