      - id: ref3
        bwb_id: BWBR0009998
        artikel: '18'
        paragraaf: '2'
  - number: '20'
    text: |-
      1 Het college kan ontheffing verlenen van de [artikelen 16][ref1], [17][ref2] en [18][ref3] aan aanbieders van
      huurlijnen in een bepaalde relevante markt indien het college van oordeel is dat er op die relevante markt sprake
      is van daadwerkelijke concurrentie.

      2 Aan een ontheffing als bedoeld in het eerste lid en aan een ontheffing als bedoeld in
      [artikel 7.3, eerste lid, onderdeel c, van de wet][ref4] kunnen voorschriften worden verbonden. Een ontheffing kan
      onder beperkingen worden verleend.


