      - id: ref4
        bwb_id: BWBR0009950
        artikel: '7.4'
  - number: '40'
    text: >-
      1 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot normen en specificaties waaraan de
      eigenschappen van vaste openbare telefoonnetwerken voldoen.


      2 Wanneer de vaste openbare telefoondienst via het ISDN-net op het S/T-referentiepunt wordt geleverd, draagt de
      aanbieder van het vaste openbare telefoonnetwerk ervoor zorg dat de ISDN-netwerkaansluitpunten voldoen aan de
      betreffende specificaties voor de fysieke interface, met name die voor de contactdoos, welke zijn opgenomen in de
      overeenkomstig artikel 5 van [richtlijn nr. 90/387/EEG](31990L0387) van de Raad van de Europese Gemeenschappen van
      28 juni 1990 betreffende de totstandkoming van de interne markt voor telecommunicatiediensten door middel van de
      tenuitvoerlegging van Open Network Provision (ONP) bekendgemaakte lijst van Europese normen.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel40
  - number: '41'
    text: |-
      1 De krachtens [artikel 6.4, eerste lid, van de wet][ref1] aangewezen aanbieders van vaste openbare
      telefoonnetwerken, van vaste openbare telefoondiensten, van mobiele openbare telefoonnetwerken, van mobiele
      openbare telefoondiensten en van huurlijnen voldoen onverminderd het bepaalde in [hoofdstuk 6 van de wet][ref2],
      aan alle redelijke verzoeken om toegang tot hun onderscheiden netwerken.

      2 Een aanbieder, bedoeld in het eerste lid, mag de gevraagde toegang slechts weigeren met voorafgaande toestemming
      van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6.4
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '6.4'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '6'
  - number: '42'
    text: |-
      Als categorieën van nummers als bedoeld in [artikel 7.5 van de wet][ref1] worden aangewezen:

      a. nummers van de vaste openbare telefoondienst;

      b. nummers van de mobiele openbare telefoondienst, en

      c. nummers van de persoonlijke nummerdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7.5
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7.5'
  - number: '43'
    text: |-
      Degene, die een nummer als bedoeld in [artikel 42, onderdeel a, b en c][ref1], in gebruik geeft, stelt op verzoek
      in een overeengekomen formaat, op billijke, kostengeoriënteerde en niet-discriminerende voorwaarden die nummers
      met bijbehorende informatie beschikbaar ten behoeve van de beschikbaarstelling van telefoongidsen en de abonnee-
      informatiedienst, bedoeld in [artikel 2, onderdelen c en d, van het Besluit universele dienstverlening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009998#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0009996#Artikel2
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009998
        artikel: '42'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009996
        artikel: '2'
  - number: '44'
    text: |-
      1 Aanbieders van vaste openbare telefoonnetwerken en van vaste openbare telefoondiensten, aangewezen krachtens
      [artikel 6.4, eerste lid, van de wet][ref1], dragen er zorg voor dat uiterlijk met ingang van 1 januari 2000
      voor hun afnemers de voorzieningen beschikbaar zijn die het die afnemers mogelijk maken dat reeds door toepassing
      van [artikel 6.1][ref2] of [6.9 van de wet][ref3] voor die afnemer beschikbare geschakelde diensten van andere
      aanbieders tevens beschikbaar zijn door middel van een door de afnemer bij de aangewezen aanbieder ingestelde
      voorkeuze. De voorkeuze moet door de afnemer op individuele gespreksbasis kunnen worden gewijzigd door middel van
      het kiezen van een daartoe bestemd nummer uit een door Onze Minister op grond van [artikel 4.1 van de wet][ref4]
      vastgesteld nummerplan.

      2 Het college kan ontheffing verlenen van de verplichting, bedoeld in het eerste lid, indien de naleving van
      de verplichting een buitensporige last vormt in de zin van artikel 20, tweede lid, van [richtlijn nr. 97/33/EG]
      (31997L0033) van het Europees Parlement en de Raad van de Europese Unie van 30 juni 1997 inzake interconnectie
      op telecommunicatiegebied, wat betreft de waarborging van de universele dienst en van de interoperabiliteit door
      toepassing van de beginselen van Open Network Provision (ONP) (PbEG L 199) zoals die is gewijzigd bij [richtlijn
      nr. 98/61/EG](31998L0061) van het Europees Parlement en de Raad van de Europese Unie tot wijziging van [Richtlijn
      97/33/EG](31997L0033) wat betreft nummerportabiliteit tussen exploitanten en carriervoorkeuze.

      3 Aan een ontheffing kunnen voorschriften worden verbonden. Een ontheffing kan onder beperkingen worden verleend.

      4 Een verzoek om bijzondere toegang als bedoeld in [artikel 6.9 van de wet][ref5] is in ieder geval redelijk
      voorzover het betrekking heeft op de verplichting, bedoeld in het eerste lid, tenzij voor die verplichting een
      ontheffing is verleend. In dat geval is een dergelijk verzoek om bijzondere toegang in ieder geval onredelijk
      voorzover het betrekking heeft op de verplichting waarvoor een ontheffing is verleend.

      5 Teneinde te voorkomen dat afnemers worden ontmoedigd in het gebruik van de in het eerste lid bedoelde
      voorzieningen kunnen bij ministeriële regeling regels worden gesteld met betrekking tot de maximale hoogte van
      het tarief dat door de aanbieders van vaste openbare telefoonnetwerken en van vaste openbare telefoondiensten,
      aangewezen krachtens [artikel 6.4, eerste lid, van de wet][ref6], aan een afnemer in rekening mag worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel6.4
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6.1
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel6.9
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel4.1
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel6.9
      [ref6]: https://wetten.overheid.nl/BWBR0009950#Artikel6.4
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel44
