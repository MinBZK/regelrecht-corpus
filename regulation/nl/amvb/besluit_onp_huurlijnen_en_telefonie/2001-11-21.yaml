  - number: '18'
    text: >-
      Een aanbieder van huurlijnen is slechts met toestemming van het college gerechtigd een huurlijn te leveren tegen
      andere tarieven en leveringsvoorwaarden dan de bekendgemaakte.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel18
  - number: '19'
    text: |-
      1 Indien een aanbieder van huurlijnen ten genoegen van het college aantoont dat hij in een bepaald geografisch
      gebied voor een specifiek huurlijnenaanbod niet over een aanmerkelijke macht op de markt beschikt, verleent het
      college die aanbieder voor dat bepaalde geografische gebied voor dat specifieke huurlijnenaanbod een ontheffing van
      de [artikelen 16][ref1], [17][ref2] en [18][ref3].

      2 Aan een ontheffing kunnen voorschriften worden verbonden. Een ontheffing kan onder beperkingen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009998#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009998#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0009998#Artikel18
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel19
