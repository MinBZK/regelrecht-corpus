        bwb_id: BWBR0009998
        artikel: '35'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009998
        artikel: '36'
        paragraaf: '3'
  - number: '38'
    text: |-
      1 Een aanbieder van een vast openbaar telefoonnetwerk en van een vaste openbare telefoondienst zoals bedoeld
      in [artikel 35, eerste lid][ref1], is slechts gerechtigd kortingsregelingen toe te passen, indien deze
      kortingsregelingen transparant en niet-discriminerend zijn. Deze kortingsregelingen behoeven de voorafgaande
      toestemming van het college. Aan een toestemming kunnen voorschriften worden verbonden. Een toestemming kan onder
      beperkingen worden verleend.

      2 Een aanbieder zoals bedoeld in het eerste lid maakt de kortingsregelingen, bedoeld in het eerste lid, op
      genoegzame wijze bekend. [Artikel 11][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009998#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0009998#Artikel11
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0009998
        artikel: '35'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009998
        artikel: '11'
        paragraaf: '2'
  - number: '39'
    text: |-
      1 Het college kan ontheffing verlenen van de [artikelen 35][ref1] en [36][ref2], alsmede van het in
      [artikel 38, eerste lid][ref3], bedoelde vereiste van voorafgaande toestemming, aan aanbieders van de vaste
      openbare telefoondienst voor een bepaalde relevante markt indien het college van oordeel is dat er op die relevante
      markt sprake is van daadwerkelijke concurrentie.

      2 Aan een ontheffing als bedoeld in het eerste lid en aan een ontheffing als bedoeld in
      [artikel 7.4, tweede lid, onderdeel a, van de wet][ref4] kunnen voorschriften worden verbonden. Een ontheffing kan
      onder beperkingen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009998#Artikel35
