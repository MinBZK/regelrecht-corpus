preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 4 juni 1998, nr. HDTP/98/1645/MD, Hoofddirectie
    Telecommunicatie en Post;


    Gelet op richtlijn nr. 92/44/EEG van de Raad van de Europese Gemeenschappen van 5 juni 1992 betreffende de
    toepassing van Open Network Provision (ONP) op huurlijnen (PbEG L 165), richtlijn nr. 98/10/EG van het Europees
    Parlement en de Raad van de Europese Unie van 26 februari 1998 inzake de toepassing van Open Network Provision
    (ONP) op spraaktelefonie en inzake de universele telecommunicatiedienst in een door concurrentie gekenmerkt
    klimaat (PbEG L 101), richtlijn nr. 97/33/EG van het Europees Parlement en de Raad van de Europese Unie van 30
    juni 1997 inzake interconnectie op telecommunicatiegebied, wat betreft de waarborging van de universele dienst en
    van de interoperabiliteit door toepassing van de beginselen van Open Network Provision (ONP) (PbEG L 199) en op de
    artikelen 6.9, vijfde lid, 7.1 en 7.5 van de Telecommunicatiewet;


    De Raad van State gehoord (advies van 13 augustus 1998, no. W09.98.0237);


    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 3 november 1998, nr. HDTP/98/3356/
    MD, Hoofddirectie Telecommunicatie en Post;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop rustende bepalingen wordt verstaan onder:

      a. wet: [Telecommunicatiewet][ref1];

      b. [richtlijn 92/44/EEG](31992L0044): [richtlijn nr. 92/44/EEG](31992L0044) van de Raad van de Europese
      Gemeenschappen van 5 juni 1992 betreffende de toepassing van Open Network Provision (ONP) op huurlijnen (PbEG L
      165), zoals deze laatstelijk is gewijzigd bij [richtlijn nr. 97/51/EG](31997L0051) van het Europees Parlement en de
      Raad van de Europese Unie tot wijziging van de [Richtlijnen 90/387/EEG](31990L0387) en [92/44/EG](31992L0044) met
      het oog op de aanpassing aan een door concurrentie gekenmerkte context in de telecommunicatie (PbEG L 295);

      c. aanbieder van huurlijnen: aanbieder van huurlijnen, die krachtens [artikel 7.2][ref2] door het college is
      aangewezen;

      d. contractant: degene die met een aanbieder van huurlijnen een overeenkomst heeft gesloten met betrekking tot het
      leveren van een huurlijn;

      e. [richtlijn 98/10/EG](31998L0010): [richtlijn nr. 98/10/EG](31998L0010) van het Europees Parlement en de Raad van
      de Europese Unie van 26 februari 1998 inzake de toepassing van Open Network Provision (ONP) op spraaktelefonie en
      inzake de universele telecommunicatiedienst in een door concurrentie gekenmerkt klimaat (PbEG L 101), naar de tekst
      zoals deze bij die richtlijn is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel7.2
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '7.2'
  - number: '2'
    text: >-
      Een aanbieder van huurlijnen levert huurlijnen die transparant zijn en die de contractant naar eigen inzicht
      ongestructureerd kan gebruiken, hetgeen onder meer wil zeggen zonder dat daarbij kanaaltoewijzingen worden verboden
      of voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel2
  - number: '3'
    text: >-
      Een aanbieder van huurlijnen is niet gerechtigd technische beperkingen op te leggen of te handhaven ten aanzien van
      de onderlinge koppeling van huurlijnen of de koppeling van huurlijnen aan een openbaar telecommunicatienetwerk.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel3
  - number: '4'
    text: >-
      1 Een aanbieder van huurlijnen is gerechtigd het leveren van een huurlijn te weigeren, te onderbreken, te beperken
      of te beëindigen teneinde het functioneren van het openbaar telecommunicatienetwerk gedurende een noodsituatie
      te waarborgen. Onder een noodsituatie wordt in dit verband verstaan: uitzonderlijke gevallen van overmacht, zoals
      extreme weersomstandigheden, aardbevingen, overstromingen, blikseminslag of brand.


      2 De aanbieder, bedoeld in het eerste lid, stelt het college, de contractanten en de aanvragers van huurlijnen
      onmiddellijk in kennis van het begin en het einde van een noodsituatie als bedoeld in het eerste lid alsmede van de
      aard en omvang van de beperking in de levering van huurlijnen.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel4
  - number: '5'
    text: >-
      Een aanbieder van huurlijnen is gerechtigd het leveren van een huurlijn te onderbreken, indien daarop een
      randapparaat is aangesloten dat niet voldoet aan de daaraan bij of krachtens de wet gestelde eisen. De aanbieder
      van de huurlijn stelt de contractant op de hoogte van de onderbreking onder vermelding van de redenen daarvan.
      Zodra de aansluiting van het in de eerste zin bedoelde randapparaat op de huurlijn is verbroken, hervat de
      aanbieder de levering van de huurlijn.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel5
  - number: '6'
    text: >-
      Een aanbieder van huurlijnen is niet gerechtigd het gebruik van huurlijnen te beperken op grond van


      a. het behoud van netwerkintegriteit,


      b. de interoperabiliteit van diensten,


      indien het op de huurlijn aangesloten randapparaat voldoet aan de daaraan bij of krachtens de wet gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel6
  - number: '7'
    text: |-
      1 Onverminderd het bepaalde in de [artikelen 4][ref1] en [5][ref2] is het een aanbieder van huurlijnen slechts
      toegestaan het leveren van een huurlijn te weigeren, te onderbreken, te beperken of te beëindigen wegens niet-
      inachtneming van de leverings- en gebruiksvoorwaarden met toestemming van het college.

      2 In afwijking van het eerste lid is een aanbieder van huurlijnen gerechtigd het leveren van een huurlijn te
      weigeren, te onderbreken, te beperken of te beëindigen indien door de contractant niet wordt voldaan aan door
      de aanbieder opgestelde algemene voorwaarden met betrekking tot levering van huurlijnen, mits de betreffende
      bepalingen zijn goedgekeurd door het college.


      [ref1]: https://wetten.overheid.nl/BWBR0009998#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009998#Artikel5
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009998
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009998
        artikel: '5'
        paragraaf: '2'
  - number: '8'
    text: >-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot normen en specificaties waaraan de
      eigenschappen van huurlijnen op het netwerkaansluitpunt voldoen.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel8
  - number: '9'
    text: >-
      Een aanbieder van huurlijnen is verplicht om


      a. aanbiedingen van huurlijnen gedurende een redelijke termijn te handhaven;


      b. alvorens aanbiedingen van huurlijnen te beëindigen hierover eerst overleg te voeren met contractanten.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel9
  - number: '10'
    text: >-
      Een aanbieder van huurlijnen is verplicht om


      a. informatie over alle aanbiedingen van huurlijnen met betrekking tot de technische karakteristieken, de tarieven,
      de leverings- en gebruiksvoorwaarden en de voorwaarden voor aansluiting van randapparatuur, overeenkomstig het
      schema van bijlage I van [richtlijn 92/44/EEG](31992L0044) op genoegzame wijze bekend te maken;


      b. wijzigingen in de informatie, bedoeld in onderdeel a, ten minste twee maanden voor de datum waarop die
      wijzigingen ingaan, op genoegzame wijze bekend te maken.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel10
  - number: '11'
    text: |-
      Een aanbieder van huurlijnen doet van de wijze van bekendmaking, bedoeld in [artikel 10][ref1], mededeling in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009998#Artikel10
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009998
        artikel: '10'
        paragraaf: '2'
  - number: '12'
    text: |-
      De leveringsvoorwaarden, bedoeld in [artikel 10][ref1], omvatten ten minste

      a. informatie betreffende de procedure voor het bestellen;

      b. de standaardleveringstermijn, waaronder wordt verstaan de termijn, gerekend vanaf de dag waarop een aanvraag
      voor een huurlijn is ingediend, waarbinnen 95% van alle huurlijnen van hetzelfde type ter beschikking van de
      contractanten is gesteld. Deze termijn wordt vastgesteld op basis van de werkelijke leveringstermijnen voor
      huurlijnen over een recente tijdspanne van redelijke duur. Daarbij worden de gevallen waarbij gebruikers om
      een late leveringstermijn hebben verzocht, niet meegeteld. Voor nieuwe typen huurlijnen wordt in plaats van de
      standaardleveringstermijn een streeftermijn voor de levering bekendgemaakt;

      c. de contractperiode, met inbegrip van de algemeen geldende contractperiode en de voor de contractant verplichte
      minimale contractperiode;

      d. de normale reparatietermijn, waaronder wordt verstaan de periode gerekend vanaf het moment dat een defect
      aan de aanbieder van een huurlijn is gemeld, tot het moment waarop 80% van die gemelde defecten van huurlijnen
      van hetzelfde type is hersteld en daarvan mededeling is gedaan aan de contractanten. Wanneer eenzelfde type
      huurlijn naar gelang van de kwaliteit is verdeeld in diverse klassen, worden de diverse, overeenkomende normale
      reparatietermijnen bekendgemaakt. Voor nieuwe typen huurlijnen wordt in plaats van de normale reparatietermijn een
      streeftermijn voor de reparatie bekendgemaakt;

      e. de diverse restitutieregelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009998#Artikel10
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009998
        artikel: '10'
        paragraaf: '2'
  - number: '13'
    text: |-
      1 Bij de aanwijzing van een aanbieder van huurlijnen krachtens [artikel 7.2 van de wet][ref1] bepaalt het college
      tegelijkertijd welke typen huurlijnen uit bijlage II van [richtlijn 92/44/EEG](31992L0044) door de aangewezen
      aanbieder worden geleverd, alsmede in welk gedeelte van Nederland die plicht tot levering geldt.

      2 De aanbieder van huurlijnen, bedoeld in het eerste lid, levert de huurlijnen, bedoeld in het eerste lid, binnen
      een redelijke termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7.2
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7.2'
  - number: '14'
    text: >-
      Een aanbieder van huurlijnen stelt huurlijnen onder dezelfde voorwaarden en tarieven ter beschikking aan zichzelf,
      zijn dochtermaatschappijen of onderdelen als aan derden.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel14
  - number: '15'
    text: |-
      1 Een aanbieder van huurlijnen neemt bij de vaststelling van tarieven van huurlijnen het volgende in acht:

      a. de tarieven zijn op objectieve kwalitatieve en kwantitatieve criteria gebaseerd;

      b. de tarieven kunnen in rekening worden gebracht door middel van eenmalige vergoedingen, periodieke vergoedingen
      en gebruiksafhankelijke vergoedingen;

      c. de tarieven zijn doorzichtig;

      d. de tarieven zijn niet discriminerend en moeten gelijkheid van behandeling waarborgen;

      e. de in onderdeel a bedoelde vergoedingen worden op genoegzame wijze bekendgemaakt.

      2 [Artikel 11][ref1] is van overeenkomstige toepassing op het eerste lid, onderdeel e.


      [ref1]: https://wetten.overheid.nl/BWBR0009998#Artikel11
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009998
        artikel: '11'
        paragraaf: '2'
  - number: '16'
    text: >-
      1 Een aanbieder van huurlijnen stelt voor huurlijnen kostengeoriënteerde tarieven vast.


      2 Ter waarborging van het in het eerste lid bepaalde stelt de aanbieder van huurlijnen een systeem op voor de
      toerekening van kosten en opbrengsten aan de diverse typen huurlijnen. Dit systeem moet voldoen aan de bepalingen
      van [richtlijn 92/44/EEG](31992L0044). Het college kan voorschriften geven met betrekking tot dit systeem.


      3 Het systeem, bedoeld in het tweede lid, behoeft de goedkeuring van het college.


      4 Een aanbieder van huurlijnen legt vanaf een door het college te bepalen datum elk jaar in de maand mei over het
      voorafgaande kalenderjaar het resultaat van de toepassing van het in het tweede lid bedoelde systeem, zijnde een
      overzicht van de kosten en opbrengsten die zijn bepaald met behulp van het systeem, voor aan het college.


      5 Ter toetsing of overeenkomstig het systeem, bedoeld in het tweede lid, de toerekening van kosten en opbrengsten
      heeft plaatsgevonden, gaat het door de aanbieder van huurlijnen voorgelegde resultaat vergezeld van een verklaring
      van de externe registeraccountant van die aanbieder van huurlijnen.


      6 De aanbieder van huurlijnen maakt, op verzoek van het college, aan het college bij het voorgelegde resultaat
      tevens kenbaar wat naar zijn oordeel het gevolg moet zijn voor de tarieven van huurlijnen.


      7 Indien het college, rekening houdend met de op dat moment voorzienbare ontwikkelingen in de bedrijfsvoering van
      de betreffende aanbieder van huurlijnen alsmede met op dat moment voorzienbare ontwikkelingen in de markt, van
      oordeel is dat de tarieven niet voldoende kostengeoriënteerd zijn of zullen zijn en de aanbieder van huurlijnen
      niet bereid is de tarieven dienovereenkomstig aan te passen, geeft het college de aanbieder een aanwijzing welke de
      aanbieder gehouden is op te volgen.
    url: https://wetten.overheid.nl/BWBR0009998/2001-11-21#Artikel16
  - number: '17'
    text: |-
      1 Op wijzigingen van tarieven van huurlijnen welke niet het gevolg zijn van toepassing van
      [artikel 16, zesde of zevende lid][ref1], is [artikel 16, eerste lid][ref2], van overeenkomstige toepassing.

      2 De aanbieder van huurlijnen, bedoeld in [artikel 16, eerste lid][ref3], voert de voorgenomen tariefwijziging niet
      in dan nadat het college de voorgenomen tariefwijziging heeft goedgekeurd.

      3 Het college beoordeelt, binnen drie weken na ontvangst van een verzoek tot goedkeuring van een voorgenomen
      tariefwijziging, of de voorgenomen tariefwijziging in overeenstemming is met [artikel 16, eerste lid][ref4]. Indien
      gegevens als bedoeld in het achtste lid ontbreken wordt de aanbieder van huurlijnen, bedoeld in het tweede lid,
      binnen drie dagen na ontvangst van het verzoek, hiervan door het college op de hoogte gesteld.

      4 Het college kan de termijn, bedoeld in het derde lid, eerste volzin, eenmaal met drie weken verlengen. Het
      college doet hiervan schriftelijk mededeling aan de aanbieder van huurlijnen, bedoeld in het tweede lid.

      5 Indien het college van oordeel is dat de voorgenomen tariefwijziging in overeenstemming is met
      [artikel 16, eerste lid][ref5], neemt het college een besluit tot goedkeuring van de voorgenomen tariefwijziging.

      6 Indien het college van oordeel is dat de voorgenomen tariefwijziging niet in overeenstemming is met
      [artikel 16, eerste lid][ref6], doet het college hiervan mededeling aan de aanbieder van huurlijnen, bedoeld
      in het tweede lid. Binnen vier weken na deze mededeling, deelt het college aan de aanbieder van huurlijnen,
      bedoeld in het tweede lid, schriftelijk mede op welke punten de voorgenomen tariefwijziging niet voldoet aan
      [artikel 16, eerste lid][ref7].

      7 Het college beoordeelt een verzoek tot goedkeuring volgend op een schriftelijke mededeling als bedoeld in het
      zesde lid, binnen twee weken na ontvangst van dit verzoek.

      8 Het college stelt vast welke gegevens de aanbieder van huurlijnen, bedoeld in [artikel 16, eerste lid][ref8],
      in elk geval overlegt bij een verzoek tot goedkeuring van een voorgenomen tariefwijziging, en in welke vorm deze
      gegevens worden ingediend. Het college doet hiervan mededeling in de Staatscourant.


