$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: coordinatiebesluit_inrichting_organisatie_en_formatie_rijksdienst
regulatory_layer: AMVB
publication_date: '2007-12-18'
valid_from: '1998-05-01'
bwb_id: BWBR0009500
url: https://wetten.overheid.nl/BWBR0009500/1998-05-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 16 maart 1998, nr. AF98/U249, directoraat-generaal
    Management en Personeelsbeleid, directie Personeelsmanagement Rijksdienst;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder Onze Minister: het hoofd van het betrokken ministerie.'
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel1
  - number: '2.1'
    text: Onze Ministers stellen de organisatie en formatie van hun ministerie bij beschikking vast.
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel2
  - number: '2.2'
    text: |-
      Voordat Onze Ministers de organisatie en formatie van hun ministeries vaststellen, vragen zij tijdig advies
      aan Onze Minister van Binnenlandse Zaken over de in [artikel 3, eerste lid, onderdelen a][ref1]. en b. genoemde
      aspecten.


      [ref1]: https://wetten.overheid.nl/BWBR0009500#Artikel3
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009500
        artikel: '3'
  - number: '3.1'
    text: |-
      Onze Minister van Binnenlandse Zaken is belast met de advisering aan Onze Ministers over de volgende aspecten van
      de inrichting van de organisatie en formatie van hun ministerie:
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel3
  - number: 3.1.a
    text: de hoofdlijn van de organisatiestructuur;
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel3
  - number: 3.1.b
    text: |-
      de waardering van de functies waarvoor salarisschaal 16 en hoger van bijlage B van het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] geldt en van de functies die rechtstreeks ressorteren
      onder de secretaris-generaal van een ministerie;


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 3.1.c
    text: |-
      de adequate toepassing van het bij hun ministerie gehanteerde functiewaarderingssysteem, waarvoor de
      waarderingsverhoudingen zoals vastgelegd in de normfuncties van het functiewaarderingssysteem van de rijksdienst,
      genaamd FUWASYS, als criterium gelden.
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel3
  - number: '3.2'
    text: |-
      Voordat hij een advies geeft als bedoeld in het eerste lid, wint Onze Minister van Binnenlandse Zaken terzake het
      advies in van de commissie bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009500#Artikel4
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009500
        artikel: '4'
  - number: '3.3'
    text: |-
      Onze Minister van Binnenlandse Zaken brengt binnen twee maanden nadat Onze Ministers daarom hebben verzocht, advies
      uit over de in [artikel 3, eerste lid][ref1] 1, onderdelen a. en b. genoemde aspecten, tenzij Onze Minister van
      Binnenlandse Zaken besluit dat de aard van het reorganisatieproces in een ministerie het noodzakelijk maakt om van
      deze termijn af te wijken.


      [ref1]: https://wetten.overheid.nl/BWBR0009500#Artikel3
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009500
        artikel: '3'
  - number: '4.1'
    text: 'Er is een commissie van advies, hierna te noemen: de Formatiecommissie.'
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel4
  - number: '4.2'
    text: |-
      De Formatiecommissie heeft tot taak Onze Minister van Binnenlandse Zaken te adviseren over de in
      [artikel 3, eerste lid][ref1], beschreven aspecten van de inrichting van de organisatie en formatie van de
      ministeries.


      [ref1]: https://wetten.overheid.nl/BWBR0009500#Artikel3
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009500
        artikel: '3'
  - number: '4.3'
    text: De Formatiecommissie bestaat uit ten hoogste acht leden.
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel4
  - number: '4.4'
    text: |-
      De voorzitter en de overige leden van de Formatiecommissie, waaronder een vertegenwoordiger van Onze Minister-
      President, Minister van Algemene Zaken, en van Onze Minister van Financiën, worden aangewezen door Onze Minister
      van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel4
  - number: '4.5'
    text: |-
      Onze Minister van Binnenlandse Zaken wijst de vertegenwoordiger van Onze Minister-President onderscheidenlijk
      van Onze Minister van Financiën aan in overeenstemming met Onze Minister-President, Minister van Algemene Zaken,
      onderscheidenlijk Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel4
  - number: '5.1'
    text: |-
      De Formatiecommissie wordt ondersteund door een secretariaat dat ressorteert onder de verantwoordelijkheid van Onze
      Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel5
  - number: '5.2'
    text: |-
      De secretaris van de Formatiecommissie, bij wie de leiding van het secretariaat berust, wordt aangewezen door Onze
      Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel5
  - number: '6.1'
    text: |-
      Voor de advisering aan Onze Minister van Binnenlandse Zaken over de adequate toepassing van de functiewaardering,
      genoemd in [artikel 3, eerste lid, onderdeel c][ref1], stelt het secretariaat van de Formatiecommissie jaarlijks
      een werkprogramma op dat wordt vastgesteld door de Formatiecommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0009500#Artikel3
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009500
        artikel: '3'
  - number: '6.2'
    text: 'Het werkprogramma bevat in elk geval de volgende elementen:'
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel6
  - number: 6.2.a
    text: |-
      een reeks inhoudelijke onderzoeken naar de feitelijke hantering van de functiewaardering binnen de rijksdienst op
      basis van een jaarlijks te nemen representatieve steekproef;
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel6
  - number: 6.2.b
    text: |-
      een toets van de feitelijk gehanteerde waarderingen voor functies van schaal 16 en hoger en van functies die
      rechtstreeks onder de secretaris-generaal ressorteren op basis van door de departementen te verstrekken formatie-
      overzichten;
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel6
  - number: 6.2.c
    text: horizontale onderzoeken naar de interdepartementale niveauverhoudingen van rijksdienstbreed voorkomende functies.
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel6
  - number: '7'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de maand na de datum van uitgifte van het Staatsblad
      waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Coördinatiebesluit inrichting organisatie en formatie rijksdienst.'
    url: https://wetten.overheid.nl/BWBR0009500/1998-05-01#Artikel8
