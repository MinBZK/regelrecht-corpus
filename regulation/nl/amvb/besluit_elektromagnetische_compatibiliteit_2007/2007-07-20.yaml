  - number: '17'
    text: |-
      1 Onze Minister kan een instantie aanwijzen voor het uitvoeren van de in [artikel 9][ref1] bedoelde taken, indien
      uit de aanvraag tot aanwijzing volgt dat de instantie blijkens accreditatie aantoonbaar voldoet aan de norm NEN-
      EN 45011.

      2 Onze Minister kan de aanwijzing beperken tot daarbij te omschrijven categorieën van apparaten of aspecten van de
      eisen, bedoeld in [artikel 4, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021041#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0021041#Artikel4
    url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#Artikel17
