  - number: '15'
    text: |-
      1 De goede technologische praktijken volgens welke een vaste installatie geïnstalleerd wordt, worden
      gedocumenteerd.

      2 De voor de conformiteit van de vaste installatie verantwoordelijke persoon houdt de desbetreffende documentatie,
      zolang de vaste installatie in bedrijf is, voor toezicht op de naleving ter beschikking van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#Artikel15
  - number: '16'
    text: |-
      1 Indien er aanwijzingen zijn dat de vaste installatie niet voldoet aan de eisen, bedoeld in [artikel 4][ref1], in
      het bijzonder indien sprake is van klachten over storing die door de vaste installatie zou worden veroorzaakt, kan
      Onze Minister eisen dat de persoon die verantwoordelijk is voor de conformiteit van de vaste installatie met de
      eisen bedoeld in [artikel 4][ref2], bewijs van overeenstemming van de vaste installatie levert.

      2 Indien het in het eerste lid bedoelde bewijs niet afdoende is, kan Onze Minister een beoordeling inleiden.

      3 Indien Onze Minister vaststelt dat de vaste installatie niet voldoet aan de eisen, bedoeld in [artikel 4][ref3],
      kan hij passende maatregelen opleggen om de vaste installatie in overeenstemming te brengen met die eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0021041#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021041#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0021041#Artikel4
