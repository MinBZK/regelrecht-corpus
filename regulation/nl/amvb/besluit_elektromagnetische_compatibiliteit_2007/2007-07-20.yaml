  - number: '11'
    text: |-
      1 Het is verboden tekens aan te brengen op het apparaat, de verpakking, of de gebruiksaanwijzing, die met de CE-
      markering kunnen worden verward.

      2 Andere dan de in het eerste lid bedoelde tekens mogen worden aanbracht op het apparaat, de verpakking, of de
      gebruiksaanwijzing, op voorwaarde dat dit niet ten koste gaat van de zichtbaarheid of de leesbaarheid van de CE-
      markering.
    url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#Artikel11
  - number: '12'
    text: |-
      1 Elk apparaat wordt geïdentificeerd met behulp van een type-, partij-, serienummer of andere informatie aan de
      hand waarvan het apparaat kan worden geïdentificeerd.

      2 Bij elk apparaat worden de naam en het adres van de fabrikant gevoegd en indien deze niet in de Europese Unie is
      gevestigd de naam en het adres van diens gevolmachtigde of van de persoon in de Europese Unie die verantwoordelijk
      is voor het in de handel brengen van het apparaat.

      3 Degene die een apparaat in de handel brengt, verstrekt informatie over specifieke voorzorgsmaatregelen die
      tijdens de assemblage, de installatie, het onderhoud of het gebruik van het apparaat moeten worden getroffen om
      ervoor te zorgen dat het apparaat bij ingebruikname voldoet aan de eisen, bedoeld in [artikel 4, eerste lid][ref1].

      4 Een apparaat waarvan de overeenstemming met de eisen, bedoeld in [artikel 4, eerste lid][ref2], in woongebieden
      niet gegarandeerd kan worden, gaat vergezeld van een duidelijke aanduiding van deze gebruiksbeperkingen, waar nodig
      ook op de verpakking.

      5 De informatie die nodig is om het apparaat overeenkomstig haar bestemming te kunnen gebruiken, wordt vermeld in
      de instructies die het apparaat vergezellen.


      [ref1]: https://wetten.overheid.nl/BWBR0021041#Artikel4
