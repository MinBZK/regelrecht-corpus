  - number: '8'
    text: |-
      1 Een apparaat wordt aan een op relevante verschijnselen gebaseerde elektromagnetische compatibiliteitsbeoordeling
      onderworpen. Bij deze beoordeling wordt rekening gehouden met alle normaal beoogde gebruikscondities.

      2 De juiste toepassing van alle relevante geharmoniseerde normen waarvan de referenties in het Publicatieblad van
      de Europese Unie zijn bekendgemaakt, wordt beschouwd als gelijkwaardig aan het uitvoeren van een elektromagnetische
      compatibiliteitsbeoordeling.

      3 Indien een apparaat verschillende configuraties kan aannemen, dan bevestigt de elektromagnetische
      compatibiliteitsbeoordeling dat het apparaat in alle mogelijke configuraties die door de fabrikant
      worden aangegeven als representatief voor het beoogde gebruik, voldoet aan de eisen, bedoeld in
      [artikel 4, eerste lid][ref1].

      4 Er wordt technische documentatie opgesteld die aantoont dat het apparaat voldoet aan de eisen, bedoeld in
      [artikel 4, eerste lid][ref2]. De technische documentatie wordt opgesteld volgens bijlage IV, punt 1, van
      [richtlijn nr. 2004/108/EG](32004L0108).

      5 Degene die een apparaat in de handel brengt, houdt de technische documentatie ter beschikking van Onze Minister
      gedurende ten minste tien jaar na de datum waarop het apparaat voor het laatst is vervaardigd.

      6 Er wordt een EG-verklaring van overeenstemming opgesteld, aan de hand waarvan de overeenstemming van een apparaat
      met de eisen, bedoeld in [artikel 4, eerste lid][ref3], wordt aangetoond. De EG-verklaring van overeenstemming
      wordt opgesteld volgens de bepalingen van bijlage IV, punt 2, van [richtlijn nr. 2004/108/EG](32004L0108).

      7 Degene die een apparaat in de handel brengt, houdt de EG-verklaring van overeenstemming ter beschikking van Onze
      Minister gedurende ten minste tien jaar na de datum waarop het apparaat voor het laatst is vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0021041#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021041#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0021041#Artikel4
