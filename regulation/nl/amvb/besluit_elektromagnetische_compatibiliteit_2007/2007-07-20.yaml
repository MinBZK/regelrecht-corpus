  - number: '20'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over speciale maatregelen betreffende de ingebruikneming of
      het gebruik van uitrusting die voldoet aan de bij of krachtens dit hoofdstuk gestelde voorschriften. Deze regels
      betreffen:

      a. maatregelen om een bestaand of te verwachten probleem in verband met elektromagnetische compatibiliteit op een
      bepaalde locatie te verhelpen;

      b. maatregelen die om veiligheidsredenen genomen worden om openbare elektronische communicatienetwerken of
      apparaten die naar hun aard bestemd zijn voor het zenden of ontvangen van radiocommunicatiesignalen te beschermen,
      indien deze worden gebruikt voor veiligheidsdoeleinden in duidelijk gedefinieerde spectrumsituaties.
    url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#Artikel20
  - number: '21'
    text: |-
      1 Het verbod om uitrusting te verhandelen, bedoeld in [artikel 10.1, eerste lid van de wet][ref1], geldt niet
      indien wordt voldaan aan de verplichtingen in de [artikelen 8, vijfde en zevende lid][ref2], [9, vierde lid][ref3],
      [10][ref4], [12][ref5], [14][ref6] en [15][ref7] van dit besluit, betreffende het beschikbaar hebben van
      documenten, het aanbrengen van markeringen en het verschaffen van informatie.

      2 Indien wordt geconstateerd dat in de handel gebrachte uitrusting niet voldoet aan
      [artikel 4, eerste en tweede lid][ref8], ondanks de aanwezigheid van de in [artikel 10, eerste lid][ref9], bedoelde
      markering en van de aanwezigheid van documenten, wordt hiervan schriftelijk mededeling gedaan aan de betrokkene.

      3 Onze Minister maakt de constatering, bedoeld in het tweede lid, zo spoedig mogelijk bekend in de Staatscourant.

      4 Met ingang van de dag na de datum van bekendmaking is het verboden om de betreffende uitrusting te verhandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10.1
