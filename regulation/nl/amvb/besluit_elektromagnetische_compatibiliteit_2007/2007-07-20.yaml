  - number: '14'
    text: |-
      1 In gevallen als bedoeld in [artikel 13][ref1] wordt de vaste installatie in de begeleidende documentatie
      beschreven, met vermelding van de eigenschappen ervan in verband met de elektromagnetische compatibiliteit en van
      de voorzorgsmaatregelen die moeten worden genomen om het apparaat in de vaste installatie in te bouwen, teneinde de
      overeenstemming van de desbetreffende installatie niet aan te tasten.

      2 Voorts wordt in de documentatie de informatie opgenomen, bedoeld in [artikel 12, eerste en tweede lid][ref2].


