  - number: '10'
    text: |-
      1 Een apparaat waarvan de overeenstemming met dit besluit is vastgesteld volgens de procedure van [artikel 8][ref1]
      of [9][ref2], is voorzien van de CE-markering die deze overeenstemming bevestigt.

      2 Degene die een apparaat in de handel brengt, brengt de CE-markering aan op het apparaat of op het
      gegevensplaatje. Wanneer echter de aard van het apparaat dat niet toelaat of niet rechtvaardigt, wordt de CE-
      markering aangebracht op de verpakking, voor zover deze bestaat, en op de begeleidende documenten.

      3 Indien het apparaat met betrekking tot andere aspecten onder andere richtlijnen valt die voorzien in het
      aanbrengen van de CE-markering, geeft deze markering aan dat het apparaat ook aan deze andere richtlijnen voldoet.

      4 Indien in een richtlijn als bedoeld in het derde lid gedurende een overgangsperiode de keuze van de toe te passen
      regeling aan de fabrikant wordt gelaten, geeft de CE-markering alleen aan dat aan de door de fabrikant toegepaste
      richtlijn wordt voldaan. In dat geval worden de in het Publicatieblad van de Europese Unie bekendgemaakte
      referenties van de toegepaste richtlijnen vermeld in de door de richtlijn vereiste documenten, handleidingen of
      gebruiksaanwijzingen die bij het apparaat zijn gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0021041#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0021041#Artikel9
