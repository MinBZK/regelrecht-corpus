  - number: '22'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de behandeling van klachten over elektromagnetische
      storing, ondervonden van het gebruik van uitrusting.
    url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#Artikel22
  - number: '23'
    text: |-
      Het is verboden handelsreclame te maken voor uitrusting die niet voldoet aan de eisen van dit besluit en waarvan
      het in de handel brengen of het verhandelen op grond van [artikel 10.1, eerste lid van de wet][ref1] is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10.1
    url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#Artikel23
