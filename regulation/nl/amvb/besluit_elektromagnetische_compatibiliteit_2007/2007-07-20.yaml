  - number: '2'
    text: |-
      Het bij of krachtens dit besluit bepaalde is niet van toepassing op uitrusting als bedoeld in artikel 1, tweede en
      derde lid, van richtlijn nr. 2004/108/EG.
    url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#Artikel2
  - number: '3'
    text: |-
      De verplichtingen die bij of krachtens dit besluit worden opgelegd aan degene die een apparaat in de handel brengt,
      zijn eveneens van toepassing op de in Nederland gevestigde vertegenwoordigers van deze persoon.
    url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#Artikel3
  - number: '4'
    text: |-
      1 Uitrusting voldoet aan de eisen, bedoeld in bijlage I onder 1, van [richtlijn nr. 2004/108/EG](32004L0108).

      2 Onverminderd het eerste lid, voldoet een vaste installatie aan de eisen, bedoeld in bijlage I onder 2, van
      [richtlijn nr. 2004/108/EG](32004L0108).

      3 Voor zover voor uitrusting een eis als bedoeld in het eerste of tweede lid op meer specifieke wijze is
      vastgesteld, is de eis, bedoeld in het eerste of tweede lid, niet van toepassing op die uitrusting.
    url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#Artikel4
  - number: '5'
    text: |-
      1 Het is verboden uitrusting die niet voldoet aan de eisen, bedoeld in [artikel 4][ref1], tentoon te stellen of te
      demonstreren, tenzij

      a. het tentoonstellen of demonstreren plaatsvindt tijdens handelsbeurzen, tentoonstellingen of soortgelijke
      evenementen, en

      b. deze uitrusting is voorzien van een zichtbaar teken dat aangeeft dat de uitrusting niet in de handel mag worden
      gebracht of mag worden verhandeld zolang deze uitrusting niet voldoet aan de eisen in dit besluit.

      2 Uitrusting als bedoeld in het eerste lid mag slechts worden gedemonstreerd indien passende maatregelen zijn
      genomen om elektromagnetische storing te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0021041#Artikel4
    url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0021041
        artikel: '4'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      1 Uitrusting wordt vermoed te voldoen aan één of meer van de in [artikel 4, eerste en tweede lid][ref1],
      bedoelde eisen, indien is voldaan aan de met betrekking tot [richtlijn nr. 2004/108/EG](32004L0108) vastgestelde
      geharmoniseerde normen of delen daarvan, die betrekking hebben op de desbetreffende eisen.

      2 Van een vermoeden van overeenstemming als bedoeld in het eerste lid is slechts sprake indien de referentienummers
      van de bij de conformiteitsbeoordelingsprocedure gehanteerde geharmoniseerde normen zijn gepubliceerd in het
      Publicatieblad van de Europese Unie en deze normen van kracht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0021041#Artikel4
    url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#Artikel6
    references:
