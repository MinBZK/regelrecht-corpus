      - id: ref2
        bwb_id: BWBR0021041
        artikel: '4'
        hoofdstuk: '2'
  - number: '18'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop een aanvraag tot aanwijzing als bedoeld
      in [artikel 17][ref1] wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0021041#Artikel17
    url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0021041
        artikel: '17'
        hoofdstuk: '5'
  - number: '19'
    text: |-
      1 Onze Minister kan de aanwijzing intrekken, indien:

      a. de aangemelde instantie dit verzoekt, of

      b. de aangemelde instantie niet langer voldoet aan de norm, bedoeld in [artikel 17, eerste lid][ref1].

      2 Indien een aangemelde instantie een verklaring als bedoeld in [artikel 9, derde lid][ref2], afgeeft en vervolgens
      vast komt te staan dat het betreffende apparaat niet voldoet aan de door de instantie beoordeelde eisen, kan Onze
      Minister passende maatregelen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0021041#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0021041#Artikel9
    url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#Artikel19
