  - number: '9'
    text: |-
      1 In aanvulling op de procedure, bedoeld in [artikel 8][ref1], kan degene die een apparaat in de handel brengt, een
      aangemelde instantie inschakelen.

      2 Indien in aanvulling op [artikel 8][ref2] een aangemelde instantie wordt ingeschakeld, wordt de technische
      documentatie voorgelegd aan de aangemelde instantie, met het verzoek om een beoordeling, waarbij tevens wordt
      aangegeven welke aspecten van de eisen, bedoeld in [artikel 4, eerste en tweede lid][ref3], beoordeeld moeten
      worden.

      3 De aangemelde instantie onderzoekt de technische documentatie en beoordeelt of die documentatie naar behoren
      aantoont dat aan de door haar te beoordelen eisen, bedoeld in [artikel 4, eerste en tweede lid][ref4], is voldaan.
      Indien wordt bevestigd dat het apparaat daarmee in overeenstemming is, geeft de aangemelde instantie een verklaring
      af die de overeenstemming van het apparaat bevestigt. De verklaring blijft beperkt tot de door haar beoordeelde
      aspecten van de eisen, bedoeld in [artikel 4, eerste en tweede lid][ref5].

      4 De verklaring van de aangemelde instantie wordt gevoegd bij de technische documentatie, bedoeld in
      [artikel 8, derde lid][ref6].


