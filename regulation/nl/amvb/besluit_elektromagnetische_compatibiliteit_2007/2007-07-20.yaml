preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Minister van Economische Zaken van 5 september 2006, nr. WJZ 6062957;

    Gelet op richtlijn nr. 2004/108/EG van het Europees Parlement en de Raad van de Europese Unie van 15 december 2004
    (PbEG L 390) betreffende de onderlinge aanpassing van de wetgevingen van de lidstaten inzake elektromagnetische
    compatibiliteit en tot intrekking van Richtlijn 89/336/EEG, alsmede op het Besluit van het Gemengd Comité van
    de EER nr. 3/2006, van 27 januari 2006 (PbEG L 92) tot wijziging van bijlage II (Technische voorschriften,
    normen, keuring en certificatie) bij de EER-Overeenkomst, artikel 3, tweede lid en de sectorbijlage betreffende
    elektromagnetische compatibiliteit van de Overeenkomst inzake wederzijdse erkenning tussen de Europese Gemeenschap
    en de Verenigde Staten van Amerika (PbEG 1999, L 31), artikel II, derde lid en de sectorbijlage betreffende
    elektromagnetische compatibiliteit van de Overeenkomst inzake wederzijdse erkenning tussen de Europese Gemeenschap
    en Canada (PbEG 1998, L 280), artikel 2, tweede lid, en de sectorbijlage betreffende elektromagnetische
    compatibiliteit van de Overeenkomst inzake wederzijdse erkenning van overeenstemmingsbeoordeling, certificaten
    en markeringen tussen de Europese Gemeenschap en Australië (PbEG 1998, L 229), artikel 2, tweede lid en de
    sectorbijlage betreffende elektromagnetische compatibiliteit van de Overeenkomst inzake wederzijdse erkenning
    van overeenstemmingsbeoordeling tussen de Europese Gemeenschap en Nieuw-Zeeland (PbEG 1998, L 229), artikel 1
    en bijlage 1, Hoofdstuk 9, betreffende elektromagnetische compatibiliteit van de Overeenkomst inzake wederzijdse
    erkenning van overeenstemmingsbeoordeling tussen de Europese Gemeenschap en Zwitserland (PbEG 2002, L 114), en op
    de artikelen 10.1, tweede lid, 10.2, eerste lid, 10.3, 10.4, 10.6 en artikel 10.7 van de Telecommunicatiewet;

    De Raad van State gehoord (advies van 16 oktober 2006, nr. W10.060377/II);

    Gezien het nader rapport van de Minister van Economische Zaken van 20 december 2006, nr. WJZ 6108521;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Telecommunicatiewet][ref1];

      b. [richtlijn nr. 2004/108/EG](32004L0108): [richtlijn nr. 2004/108/EG](32004L0108) van het Europees Parlement en
      de Raad van de Europese Unie van 15 december 2004 betreffende de onderlinge aanpassing van de wetgevingen van de
      lidstaten inzake elektromagnetische compatibiliteit en tot intrekking van [Richtlijn 89/336/EEG](31989L0336) (PbEG
      L 390);

      c. [richtlijn nr. 1999/5/EG](31999L0005): [richtlijn nr. 1999/5/EG](31999L0005) van het Europees Parlement en de
      Raad van de Europese Unie van 9 maart 1999 betreffende radioapparatuur en telecommunicatie-eindapparatuur en de
      wederzijdse erkenning van hun conformiteit (PbEG L 91);

      d. elektromagnetische storing: elk elektromagnetisch verschijnsel dat een verslechtering van de prestaties van
      uitrusting kan veroorzaken, waaronder een elektromagnetische ruis, een ongewenst signaal of een wijziging in het
      voortplantingsmilieu;

      e. ongevoeligheid: het vermogen van uitrusting om in aanwezigheid van een elektromagnetische storing te kunnen
      functioneren zoals beoogd zonder verslechtering van prestaties;

      f. elektromagnetische omgeving: het geheel van waarneembare elektromagnetische verschijnselen op een bepaalde
      locatie;

      g. elektromagnetische compatibiliteit: het vermogen van uitrusting om op bevredigende wijze in haar
      elektromagnetische omgeving te functioneren zonder zelf elektromagnetische storing te veroorzaken die ontoelaatbaar
      is voor andere uitrusting in die omgeving;

      h. lidstaat: staat die lid is van de Europese Unie;

      i. derde land: land dat partij is bij een bij ministeriële regeling genoemde overeenkomst;

      j. geharmoniseerde norm: technische specificatie die door een erkende Europese normalisatie-instelling,
      in opdracht van de Commissie van de Europese Gemeenschappen en in overeenstemming met de procedures van de
      notificatierichtlijn, is goedgekeurd;

      k. EG-verklaring van overeenstemming: document waarin degene die een apparaat in de handel brengt verklaart dat
      het apparaat voldoet aan de voorschriften van [richtlijn nr. 2004/108/EG](32004L0108) en dat is opgesteld volgens
      bijlage IV, punt 2, van [richtlijn nr. 2004/108/EG](32004L0108);

      l. CE-markering: markering als bedoeld in bijlage V, eerste en tweede alinea, van richtlijn nr. 2004/108/EG;

      m. aangemelde instantie: instantie die voor het uitvoeren van conformiteitsbeoordelingsprocedures als bedoeld in
      bijlage III van richtlijn nr. 2004/108/EG is aangewezen

      1°. door een lidstaat die de instantie op grond van artikel 12 van [richtlijn nr. 2004/108/EG](32004L0108) heeft
      aangemeld,

      2°. door een staat, niet zijnde een lidstaat, die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte die de instantie op grond van artikel 12 van [richtlijn nr. 2004/108/EG](32004L0108) heeft aangemeld, of

      3°. in het kader van een bij ministeriële regeling genoemde overeenkomst, door de aanwijzende autoriteit in een
      derde land.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0021041/2007-07-20#Artikel1
    references:
