        artikel: '4'
        hoofdstuk: '2'
  - number: '7'
    text: |-
      Degene die een apparaat in de handel brengt, voldoet aan de in [artikel 8][ref1] of [artikel 9][ref2] bedoelde
      verplichtingen inzake de conformiteitsbeoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0021041#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0021041#Artikel9
