  - number: '2'
    text: |-
      Het is verboden zuiveringsslib, compost of zwarte grond als zodanig te verhandelen indien niet is voldaan aan de
      voor het desbetreffende product bij of krachtens dit besluit gestelde samenstellingseisen en hetgeen overigens bij
      of krachtens de [artikelen 3 tot en met 10][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel3
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '3'
    text: >-
      Zuiveringsslib dient te zijn behandeld langs biologische, chemische of thermische weg, door langdurige opslag
      of volgens enig ander geschikt procédé, dat tot gevolg heeft dat het grootste deel van de in het zuiveringsslib
      aanwezige pathogene organismen afsterft.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel3
  - number: '4'
    text: >-
      1 De samenstelling van het zuiveringsslib dient dient de samenstelling van zuiveringsslib te voldoen aan de in de
      bij dit besluit behorende bijlage I gestelde eisen.


      2 Indien op enig tijdstip het stellen van aanvullende regels met betrekking tot de samenstelling van zuiveringsslib
      dringend noodzakelijk is en naar het oordeel van Onze Minister van Landbouw, Natuurbeheer en Visserij de
      totstandkoming van een daartoe strekkende algemene maatregel van bestuur niet kan worden afgewacht, kan hij in
      overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer een regeling terzake
      vaststellen.


      3 De in het tweede lid bedoelde regeling vervalt één jaar nadat zij in werking is getreden, of, indien binnen die
      termijn een algemene maatregel van bestuur ter vervanging van die regeling in werking is getreden, op het tijdstip
      waarop die algemene maatregel van bestuur in werking treedt. De termijn kan door Onze Minister van Landbouw,
      Natuurbeheer en Visserij in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer eenmaal bij een met redenen omkleed besluit, dat in de *Staatscourant* wordt bekendgemaakt, met ten
      hoogste één jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel4
  - number: '5'
    text: >-
      1 Onze Minister van Landbouw, Natuurbeheer en Visserij kan bepalen dat zuiveringsslib, afkomstig van een
      installatie waarin zuiveringsslib wordt geproduceerd dan wel van een installatie waarin zuiveringsslib wordt be- of
      verwerkt, gedurende een bepaalde periode niet meer mag worden verhandeld.


      2 Onze Minister van Landbouw, Natuurbeheer en Visserij maakt van de in het eerste lid bedoelde bevoegdheid slechts
      gebruik indien naar zijn oordeel bij herhaling is gebleken, op basis van de voorgeschreven bemonstering en analyse,
      dat het door de desbetreffende installatie geproduceerde, be- of verwerkte zuiveringsslib niet aan de in de bij dit
      besluit behorende bijlage I bedoelde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel5
  - number: '6'
    text: |-
      1 De samenstelling van compost, niet zijnde zeer schone compost, dient, te voldoen aan de in de bij dit besluit
      behorende [bijlage II][ref1] gestelde eisen.

      2 De samenstelling van compost die geheel of grotendeels bestaat uit zuiveringsslib dient te voldoen aan de
      samenstellingseisen, met uitzondering van het organische stofgehalte en de zuurbindende waarde, met betrekking
      tot zuiveringsslib.

      3 De [artikelen 4, tweede en derde lid][ref2], en [5][ref3] zijn van overeenkomstige toepassing met betrekking
      tot compost.


      [ref1]: https://wetten.overheid.nl/BWBR0009360
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009360#Artikel5
