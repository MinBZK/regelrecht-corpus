  - number: '13'
    text: |-
      1 Het is verboden in enig jaar zuiveringsslib of compost, een mengsel van deze stoffen dan wel een mengsel van deze
      stoffen met dierlijke meststoffen te gebruiken.

      2 Het in het eerste lid bedoelde verbod is niet van toepassing, indien de
      producent respectievelijk de gebruiker met behulp van de gegevens, bedoeld in
      [artikel 13 van het Besluit administratieve verplichtingen Meststoffenwet][ref1], dan wel met behulp van gegevens
      bedoeld in de bij of krachtens de [artikelen 8][ref2], [9, achtste lid][ref3] en [16][ref4] van het onderhavige
      besluit gestelde regels, dan wel met behulp van andere aanvullende schriftelijke gegevens, aannemelijk maakt dat:

      a. op de tot het bedrijf van de producent respectievelijk de gebruiker behorende oppervlakte grond geen grotere
      hoeveelheid zuiveringsslib of compost, een mengsel van deze stoffen dan wel een mengsel van deze stoffen met
      dierlijke meststoffen is gebruikt dan op grond van de [artikelen 18][ref5], [19][ref6] en [20][ref7], [23][ref8] en
      [25][ref9] is toegestaan, en

      b. met betrekking tot het gebruikte zuiveringsslib, de gebruikte compost of de gebruikte zwarte grond is voldaan
      aan de in het onderhavige besluit gestelde samenstellingseisen, en

      c. met betrekking tot het gebruikte zuiveringsslib of de gebruikte compost is voldaan aan de in de
      [artikelen 14][ref10], 15 en [17][ref11] bedoelde verplichtingen met betrekking tot bemonstering en analyse van
      de bodem.

      3 Bij het in het tweede lid bedoelde aannemelijk maken worden de gegevens, bedoeld in de bij of krachtens
      [artikel 13 van het Besluit administratieve verplichtingen Meststoffenwet][ref12] gestelde regels, dan wel in
      de bij of krachtens de [artikelen 8][ref13], [9, achtste lid][ref14], en [16][ref15] van het onderhavige besluit
      gestelde regels niet in aanmerking genomen indien deze regels niet of niet volledig door de betrokkenen zijn
      nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel13
