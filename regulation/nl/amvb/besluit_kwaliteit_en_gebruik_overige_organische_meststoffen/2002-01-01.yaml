  - number: '14'
    text: >-
      Onverminderd de overige bepalingen opgenomen in dit hoofdstuk, is het verboden op landbouwgrond zuiveringsslib te
      gebruiken, tenzij voorafgaand aan het gebruik en overeenkomstig het bepaalde krachtens dit besluit een bemonstering
      en analyse van de bodem waarop het zuiveringsslib zal worden gebruikt, hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel14
  - number: '16'
    text: >-
      1 Omtrent de in de artikelen 14 en 15 bedoelde bemonstering en analyse worden door Onze Minister van Landbouw,
      Natuurbeheer en Visserij in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer regels gesteld, die onder meer betrekking kunnen hebben op de methode van bemonstering en analyse, de
      frequentie waarmee de bemonstering en analyse moeten plaatsvinden, de erkenning en registratie van instanties die
      de bemonstering en analyse dienen uit te voeren, op de intrekking van zodanige erkenning en registratie, alsmede op
      het bewaren en overleggen van de analyseresultaten.


      2 Artikel 8, vierde en vijfde lid, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel16
  - number: '17'
    text: |-
      Het is verboden zuiveringsslib of compost te gebruiken indien uit de in de [artikelen 14][ref1] en 15 bedoelde
      bemonstering en analyse blijkt dat een of meer van de in de bodem aanwezige stoffen de krachtens de bij dit besluit
      behorende [bijlage IV][ref2] geldende toetsingswaarden overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009360
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009360
  - number: '18'
    text: >-
      Het is verboden vloeibaar zuiveringsslib te gebruiken in een grotere hoeveelheid dan:


      a. 2 ton droge stof per hectare per jaar op bouwland of op braakland;


      b. 1 ton droge stof per hectare per jaar op grasland.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel18
  - number: '19'
    text: >-
      1 Het is verboden steekvast zuiveringsslib te gebruiken in een grotere hoeveelheid dan:


      a. 4 ton droge stof per hectare per twee jaren op bouwland of op braakland;


      b. 2 ton droge stof per hectare per twee jaren op grasland.


      2 Gedurende de in het eerste lid bedoelde perioden dient voor het betreffende aantal hectaren het grondgebruik
      ongewijzigd te blijven.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel19
  - number: '20'
    text: >-
      1 Het is verboden compost te gebruiken in een grotere hoeveelheid dan:


      a. 6 ton droge stof per hectare per jaar dan wel 12 ton droge stof per hectare per twee jaren op bouwland of op
      braakland;


      b. 3 ton droge stof per hectare per jaar dan wel 6 ton droge stof per hectare per twee jaren op grasland.


      2 Indien de compost geheel of grotendeels bestaat uit zuiveringsslib zijn de artikelen 14 en 19 van overeenkomstige
      toepassing.


      3 De in het eerste lid gestelde verboden zijn niet van toepassing op het gebruik van zeer schone compost.


      4 Gedurende de in het eerste lid bedoelde perioden dient voor het betreffende aantal hectaren het grondgebruik
      ongewijzigd te blijven.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel20
  - number: '22'
    text: |-
      Het in [artikel 20][ref1] gestelde verbod is niet van toepassing op het gebruik van compost die door de gebruiker
      zelf is vervaardigd uit op zijn landbouwbedrijf of uit zijn particuliere huishouding vrijgekomen organische
      afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel20
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '23'
    text: >-
      1 Het is verboden op overige grond zuiveringsslib of een mengsel van zuiveringsslib met compost, zwarte grond of
      dierlijke meststoffen te gebruiken.


      2 Het is verboden op overige grond compost te gebruiken in een grotere hoeveelheid dan 6 ton droge stof per hectare
      per jaar, dan wel 12 ton droge stof per hectare per twee jaren.


      3 De in het tweede lid gestelde verboden zijn niet van toepassing op het gebruik van zeer schone compost.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel23
  - number: '24'
    text: |-
      1 In afwijking van artikel 23, tweede lid, is het toegestaan op overige grond compost te gebruiken bij wijze van
      eenmalige gift in een hoeveelheid van maximaal 200 ton droge stof per hectare, indien dit geschiedt ten behoeve
      van de aanleg of uitbreiding van een groenvoorziening, een recreatieterrein, een sportcomplex of een golfterrein,
      waarin bij een plan als bedoeld in de [artikelen 7][ref1] en [10 van de Wet op de Ruimtelijke Ordening][ref2],
      dan wel bij een besluit als bedoeld in artikel 19 van die wet is voorzien, en indien tenminste vier weken
      voorafgaande aan het gebruik een kennisgeving daarvan aan Onze Minister van Landbouw, Natuurbeheer en Visserij
      heeft plaatsgevonden.

      2 De in het eerste lid bedoelde kennisgeving dient te bevatten:

      a. naam en adres van de gebruiker;

      b. een nauwkeurige omschrijving van de aard van het project, als bedoeld in het eerste lid;

      c. een kadastrale aanduiding van de plaats waar het project wordt uitgevoerd alsmede een opgave van de oppervlakte
      van de locatie;

      d. het voorgenomen tijdstip van uitvoering van het project;

      e. naam en adres van de leverancier van het product;

      f. de gegevens, als bedoeld in artikel 8 van dit besluit, omtrent de hoedanigheid en samenstelling van het product.

      3 Met het in het eerste lid bedoelde gebruik mag eerst worden aangevangen, zodra een bevestiging van ontvangst van
      de kennisgeving door de gebruiker is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel10
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '10'
  - number: '25'
    text: |-
      1 Het is verboden op overige grond compost of een mengsel van deze stof met dierlijke meststoffen, dan wel
      verschillende van deze meststoffen tegelijkertijd of achtereenvolgens te gebruiken in een grotere hoeveelheid,
      gemeten in kilogrammen fosfaat (kg P205) per hectare, dan 20 kg fosfaat per jaar.

      2 Het eerste lid is niet van toepassing in geval van gebruik van compost als bedoeld in [artikel 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel24
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '26'
    text: |-
      De in de [artikelen 23][ref1] en [25][ref2] gestelde verboden zijn niet van toepassing op het gebruik van compost
      die door de gebruiker zelf is vervaardigd uit op zijn landbouwbedrijf of uit zijn particuliere huishouding
      vrijgekomen organische afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel25
