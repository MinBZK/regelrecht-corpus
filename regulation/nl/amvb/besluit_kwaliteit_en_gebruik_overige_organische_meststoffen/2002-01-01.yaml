preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij, gedaan mede namens Onze Minister
    van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 27 oktober 1997, Directie Juridische Zaken, nr.
    J.977882;


    Overwegende, dat het noodzakelijk is om zowel in het belang van de bevordering van de deugdelijkheid voor het doel
    waarvoor meststoffen zijn bestemd als in het belang van de bescherming van de bodem, alsmede ter uitvoering van de
    Richtlijn van de Raad van de Europese Gemeenschappen van 12 juni 1986, nr. 86/278/EEG, betreffende de bescherming
    van het milieu, in het bijzonder de bodem, bij het gebruik van zuiveringsslib in de landbouw (PbEG L 181/6), regels
    te stellen betreffende de kwaliteit en het gebruik van zuiveringsslib, compost en zwarte grond;


    Gelet op de artikelen 1, 3, eerste lid, 7, 61, eerste lid, en 64 van de Meststoffenwet voor zover het betreft de
    artikelen 1, eerste lid, 2 tot en met 11 en 38 van dit besluit, alsmede gelet op de artikelen 6, 7, 15, 65, 91 en
    92 van de Wet bodembescherming voor zover het betreft de artikelen 1 en 12 tot en met 38 van dit besluit;


    De Raad van State gehoord (advies van 26 november 1997, nr. W11.97.0704);


    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij, uitgebracht mede namens Onze
    Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 12 januari 1998, Directie Juridische Zaken,
    nr. J.9714329;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder grond, landbouwgrond,
      grasland, bouwland, braakland, fosfaat en hectare hetgeen daaronder wordt verstaan in
      [artikel 1, eerste lid, van de Meststoffenwet][ref1], en wordt verstaan onder:

      a. zuiveringsslib:

      1° slib dat geheel of in hoofdzaak afkomstig is van een installatie voor de zuivering van huishoudelijk, stedelijk,
      industrieel dan wel ander afvalwater van soortgelijke samenstelling als huishoudelijk, stedelijk en industrieel
      afvalwater;

      2° slib dat geheel of in hoofdzaak afkomstig is van septictanks en andere installaties voor de verzameling, afvoer
      en behandeling van afvalwater met uitzondering van vet- en zandvangers;

      b. vloeibaar zuiveringsslib: zuiveringsslib dat verpompbaar is;

      c. steekvast zuiveringsslib: zuiveringsslib dat niet verpompbaar is;

      d. compost: product, waaronder mede begrepen het in onderdeel e bedoelde product, dat geheel of grotendeels bestaat
      uit één of meer organische afvalstoffen die met behulp van micro-organismen zijn afgebroken en omgezet tot een
      zodanig stabiel eindproduct dat daarin alleen nog een langzame afbraak van humeuze verbindingen plaatsvindt, mits
      blijkens door de producent over te leggen gegevens dit product kennelijk niet geheel of grotendeels is geproduceerd
      uit dierlijke meststoffen;

      e. zeer schone compost: compost die voldoet aan de in de bij dit besluit behorende bijlage III gestelde eisen;

      f. zwarte grond: mengsel van bodembestanddelen en bewerkte organische afvalstoffen;

      g. gebruiken: op of in de bodem brengen;

      h. jaar: kalenderjaar;

      i. emissiearm aanwenden: gebruiken overeenkomstig de voorschriften die voor de desbetreffende situatie zijn
      opgenomen in de bij dit besluit behorende bijlage V;

      j. dierlijke meststoffen: meststoffen als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Meststoffenwet][ref2] die geheel of gedeeltelijk bestaan uit
      uitwerpselen van dieren, waaronder mede wordt begrepen de geheel of gedeeltelijk verteerde maag- en darminhoud
      van dieren;

      k. overige grond: andere grond dan landbouwgrond of natuurterrein;

      l. natuurterrein: grond met een houtopstand, alsmede heideveld, ven, hoogveenterrein, zandverstuiving, duinterrein,
      kwelder, schor, gors, slik, riet- en ruigtland, griend en laagveenmoeras, voor zover het geen landbouwgrond is;

      m. niet-beteelde grond: grond waarvan niet kan worden waargenomen dat deze gelijkmatig met een gewas bedekt is;

      n. veenkoloniaal bouwplan: bouwplan met de teelt van fabrieksaardappelen ten behoeve van de zetmeelindustrie in een
      teeltfrequentie van ten minste éénmaal per drie jaar, met dien verstande dat geen sprake is van een veenkoloniaal
      bouwplan in de periode dat op de desbetreffende grond bloembollen worden geteeld of gras wordt geteeld;

      o. hellingspercentage: het quotiënt van het hoogteverschil en de horizontale afstand, uitgedrukt in procenten,
      volgens de in bijlage VI bij dit besluit aangegeven meetmethode.

      2 Voor de toepassing van artikel 25 wordt onder dierlijke meststoffen verstaan hetgeen daaronder wordt verstaan in
      [artikel 1, eerste lid, onderdeel e, van de Meststoffenwet][ref3].

      3 Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt onder bouwland tevens verstaan grond
      waarop een houtopstand is aangelegd die valt onder de vrijstelling, bedoeld in de Beschikking vrijstelling
      meldings- en herplantplicht.

      4 Voor de toepassing van de artikelen 18 tot en met 20 en 23 is de situatie op 1 juli van het jaar waarin
      zuiveringsslib, compost of zwarte grond wordt gebruikt, bepalend voor de vraag of sprake is van bouwland, of
      grasland, met dien verstande dat indien op 1 juli van het desbetreffende jaar landbouwgrond niet wordt beteeld,
      deze grond wordt aangemerkt als bouwland, tenzij de grond het gehele jaar niet wordt beteeld, in welk geval de
      grond wordt aangemerkt als overige grond.

      5 Voor de toepassing van de artikelen 29, 30 en 34c wordt onder bouwland niet verstaan grond waarop tuinbouw in
      glasopstanden wordt uitgeoefend, of waarop een anderszins bedekte teelt plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
