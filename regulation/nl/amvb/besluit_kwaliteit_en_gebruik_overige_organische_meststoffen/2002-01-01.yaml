  - number: '11'
    text: >-
      1 Gedeputeerde staten dienen elk in de artikelen 9, zesde lid en 10 bedoeld register, afkomstig van producenten,
      be- en verwerkers van en handelaren in zuiveringsslib, compost of zwarte grond gedurende vijf jaren na afloop van
      het jaar waarop het desbetreffende register betrekking heeft te bewaren.


      2 Gedeputeerde staten maken aan de hand van de ontvangen registers jaarlijks een rapport omtrent de productie
      van zuiveringsslib, compost en zwarte grond en de afzet van deze producten, waarin de hoeveelheid en de kwaliteit
      van het geproduceerde en geleverde zuiveringsslib, de compost en de zwarte grond alsmede de samenstelling van de
      producten worden vermeld.


      3 Gedeputeerde staten doen het in het tweede lid bedoelde rapport voor 1 september van het jaar volgend op het
      in artikel 9, vijfde lid, bedoelde, toekomen aan Onze Ministers van Landbouw, Natuurbeheer en Visserij en van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel11
  - number: '12'
    text: |-
      1 Het is verboden zuiveringsslib, compost of zwarte grond te gebruiken, indien niet is voldaan aan de in de bij dit
      besluit behorende bijlagen met betrekking tot de desbetreffende producten gestelde samenstellingseisen en hetgeen
      overigens bij of krachtens de [artikelen 3 tot en met 10][ref1] is bepaald.

      2 De in de [artikelen 18 tot en met 20][ref2] en [23][ref3] gestelde verboden gelden onverminderd het in
      [artikel 25][ref4] gestelde verbod.

      3 Het in [artikel 25][ref5] gestelde verbod geldt onverminderd de in de [artikelen 18 tot en met 20][ref6] en
      [23][ref7] gestelde verboden.

      4 De in [artikel 25][ref8] bedoelde hoeveelheid fosfaat in compost wordt vastgesteld overeenkomstig de krachtens
      [artikel 8][ref9] daaromtrent gestelde regels.


