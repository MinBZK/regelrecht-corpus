  - number: '7'
    text: |-
      1 De samenstelling van zwarte grond dient te voldoen aan de in de bij dit besluit behorende [bijlage IV][ref1]
      gestelde eisen.

      2 [Artikel 4, tweede en derde lid][ref2], is van overeenkomstige toepassing met betrekking tot zwarte grond.


      [ref1]: https://wetten.overheid.nl/BWBR0009360
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel4
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009360
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '8'
    text: >-
      1 Ten aanzien van zuiveringsslib, compost en zwarte grond dient te worden voldaan aan door Onze Minister van
      Landbouw, Natuurbeheer en Visserij gestelde regels omtrent bemonstering en analyse, welke onder meer betrekking
      kunnen hebben op de methode van bemonstering en analyse, de frequentie waarmee deze moeten plaatsvinden, de stoffen
      waarop de analyse betrekking dient te hebben, de erkenning en registratie van de instanties die de bemonstering
      en analyse dienen uit te voeren, op de intrekking van zodanige erkenning en registratie, alsmede op het bewaren en
      overleggen van de analyseresultaten.


      2 Ten aanzien van zuiveringsslib, compost en zwarte grond dient te worden voldaan aan door Onze Minister van
      Landbouw, Natuurbeheer en Visserij gestelde regels omtrent certificering, welke onder meer betrekking kunnen hebben
      op de methode van certificering, de frequentie waarmee deze moet plaatsvinden, alsmede op het bewaren en overleggen
      van de certificaten.


      3 Zuiveringsslib, compost of zwarte grond dienen bij het verhandelen te allen tijde vergezeld te gaan van een
      afschrift van de in het eerste lid bedoelde analyseresultaten dan wel de in het tweede lid bedoelde certificaten.


      4 Het is een instantie als bedoeld in het eerste lid verboden bemonsteringen of analyses uit te voeren en
      analyseresultaten af te geven, indien zij niet beschikt over de in dat lid bedoelde erkenning en registratie.


      5 Het is een instantie als bedoeld in het eerste lid, verboden onjuiste analyseresultaten of anderszins onjuiste
      gegevens af te geven.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel8
  - number: 8a
    text: |-
      [Artikel 8][ref1] is niet van toepassing op zuiveringsslib, compost en zwarte grond die rechtmatig zijn
      geproduceerd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie danwel rechtmatig zijn
      geproduceerd in een staat die partij is bij de Overeenkomst inzake de Europese Economische Ruimte en die aan ten
      minste even strenge eisen voldoen en vergezeld gaan van een analyserapport dat voldoende informatie verschaft
      over de samenstelling van het product en is afgegeven door een in die lidstaat of staat erkend laboratorium dat
      gelijkwaardig is aan een in Nederland voor dit doel erkend laboratorium.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel8
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel8a
