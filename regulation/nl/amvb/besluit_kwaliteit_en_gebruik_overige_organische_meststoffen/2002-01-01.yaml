        hoofdstuk: '2'
        paragraaf: '5'
  - number: '9'
    text: >-
      1 Producenten en be- of verwerkers van zuiveringsslib, compost of zwarte grond, zijn verplicht een register bij te
      houden, waarin met betrekking tot deze producten ten minste de volgende gegevens zijn opgenomen:


      a. de hoeveelheid geproduceerd, be- of verwerkt zuiveringsslib, compost of zwarte grond en de hoeveelheid
      verhandeld product, uitgedrukt in tonnen;


      b. de samenstelling en de eigenschappen van het desbetreffende product voor zover het betreft de gehalten aan droge
      stof en fosfaat, en indien het zuiveringsslib betreft, tevens het gehalte aan stikstof en de pH-waarde, alsmede
      de ingevolge de bij dit besluit behorende bijlagen I tot en met IV voor de desbetreffende producten geldende
      parameters en die gegevens die voortvloeien uit de nadere regels welke Onze Minister van Landbouw, Natuurbeheer en
      Visserij krachtens dit besluit met betrekking tot de samenstelling heeft gesteld;


      c. de namen en adressen van de afnemers van het desbetreffende product, de aan hen geleverde hoeveelheden en de
      samenstelling van het geleverde product;


      d. gegevens omtrent de bemonstering van het desbetreffende product, als bedoeld in artikel 8;


      e. indien het zuiveringsslib betreft, een omschrijving van de in artikel 3 bedoelde behandelingsmethode voor
      zuiveringsslib.


      2 De in het eerste lid bedoelde gegevens dienen binnen vier weken nadat productie, be- of verwerking dan wel afzet
      heeft plaatsgevonden, in het register te worden opgenomen.


      3 Het register dient te worden bijgehouden overeenkomstig een door Onze Minister van Landbouw, Natuurbeheer en
      Visserij vastgesteld model.


      4 Omtrent de inhoud en het bijhouden van het register kunnen door Onze Minister van Landbouw, Natuurbeheer en
      Visserij nadere regels worden gesteld.


      5 De registers worden jaarlijks per 31 december afgesloten.


      6 Producenten en be- of verwerkers van zuiveringsslib, compost of zwarte grond zijn verplicht de afgesloten
      registers over een jaar voor 1 maart van het daaropvolgende jaar te doen toekomen aan gedeputeerde staten van de
      provincie waar de installatie voor productie, be- of verwerking is gevestigd.


      7 Producenten en be- of verwerkers van zuiveringsslib, compost of zwarte grond dienen alle in het eerste lid
      genoemde in de registers te vermelden gegevens gedurende vijf jaren na afloop van het jaar waarop deze betrekking
      hebben, te bewaren.


      8 Producenten en be- of verwerkers van zuiveringsslib, compost of zwarte grond zijn verplicht de in het eerste
      lid, onderdeel *b*, genoemde gegevens bij het verhandelen van deze producten aan de afnemers van deze producten te
      verstrekken door middel van de in artikel 8 bedoelde schriftelijke stukken.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel9
  - number: '10'
    text: |-
      1

      2 De in [artikel 9][ref1] genoemde verplichtingen zijn niet van toepassing op degene die compost produceert uit op
      zijn landbouwbedrijf dan wel uit zijn particuliere huishouding vrijgekomen organische afvalstoffen, voor zover de
      compost niet is bestemd om te worden verhandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel9
