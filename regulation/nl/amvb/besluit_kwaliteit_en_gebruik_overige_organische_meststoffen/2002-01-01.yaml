        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 26a
    text: >-
      Het is verboden op overige grond in de periode van 1 september tot en met 31 januari een mengsel van dierlijke
      meststoffen met compost of zwarte grond te gebruiken.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel26a
  - number: '27'
    text: >-
      Het is verboden op natuurterrein zuiveringsslib, compost of zwarte grond, een mengsel van deze stoffen of een
      mengsel van deze stoffen met dierlijke meststoffen te gebruiken.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel27
  - number: '28'
    text: >-
      Het is verboden zuiveringsslib, een mengsel van zuiveringsslib met compost of met zwarte grond of een mengsel van
      deze stoffen met dierlijke meststoffen te gebruiken indien de bodem geheel of gedeeltelijk is bevroren of geheel of
      gedeeltelijk is bedekt met sneeuw.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel28
  - number: 28a
    text: >-
      Het is verboden zuiveringsslib te gebruiken of een mengsel van zuiveringsslib met compost, met zwarte grond of met
      dierlijke meststoffen:


      a. op weideland: gedurende de periode van beweiding;


      b. op grond die wordt gebruikt voor de teelt van voedergewassen: minder dan drie weken voor de oogst;


      c. op grond die wordt gebruikt voor groente- of fruitaanplant, met uitzondering van fruitbomen: gedurende de
      groeiperiode van de groente onderscheidenlijk het fruit;


      d. op grond die is bestemd voor de teelt van groenten of vruchten, die gewoonlijk in rechtstreeks contact met de
      bodem staan en rauw worden geconsumeerd: minder dan 10 maanden voor de oogst alsmede tijdens de oogst.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel28a
  - number: 28b
    text: >-
      Het is verboden zuiveringsslib, compost, zwarte grond, een mengsel van deze stoffen of een mengsel van deze stoffen
      met dierlijke meststoffen te gebruiken indien de bovenste bodemlaag met water verzadigd is.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel28b
  - number: 28c
    text: >-
      1 Het is verboden in de periode van 1 september tot en met 31 januari zuiveringsslib, compost, zwarte grond, een
      mengsel van deze stoffen of een mengsel van deze stoffen met dierlijke meststoffen te gebruiken indien de bodem
      tegelijkertijd wordt bevloeid, beregend of geïnfiltreerd.


      2 Voor de toepassing van het eerste lid wordt onder infiltreren verstaan: aanvoeren van water op of onder het
      grondoppervlak door middel van een buizen- of slangenstelsel.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel28c
  - number: '29'
    text: |-
      1 Het is verboden in de periode van 1 september tot en met 31 januari zuiveringsslib, een mengsel van
      zuiveringsslib met compost of zwarte grond of een mengsel van deze stoffen met dierlijke meststoffen te gebruiken
      op bouwland, op braakland, op niet-beteelde grond of op grasland.

      2 Het in het eerste lid gestelde verbod geldt niet voor bouwland, braakland of niet-beteelde grond, gelegen buiten
      de gebieden die zijn aangegeven op de kaarten in [bijlage I bij het Besluit gebruik meststoffen][ref1].

      3 Het in het eerste lid gestelde verbod geldt niet in de periode van 1 tot en met 15 september voor grasland,
      gelegen buiten de gebieden die zijn aangegeven op de kaarten in [bijlage I bij het Besluit gebruik meststoffen]
      (onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0009066
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009066
  - number: '30'
    text: |-
      1 Het is verboden zuiveringsslib, een mengsel van zuiveringsslib met compost of zwarte grond of een mengsel van
      dierlijke meststoffen met zuivingsslib, compost of zwarte grond te gebruiken op grasland, bouwland, braakland of
      niet-beteelde grond, tenzij deze stoffen of mengsels van deze stoffen, emissiearm worden aangewend.

      2 Het in het eerste lid gestelde verbod is niet van toepassing op gronden, gelegen in de gebieden die zijn
      aangegeven op de kaarten in [bijlage I bij het Besluit gebruik meststoffen][ref1], waarop een veenkoloniaal
      bouwplan wordt uitgeoefend, alsmede op bouwland, braakland of niet-beteelde grond, gelegen op Texel.

      3 Het in het eerste lid gestelde verbod is niet van toepassing op het gebruik van steekvast zuiveringsslib op
      grasland, tenzij dit grasland een hellingspercentage heeft van 7 of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0009066
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009066
  - number: '34'
    text: >-
      Het is verboden zuiveringsslib, compost, een mengsel van zuiveringsslib, compost of zwarte grond of een mengsel van
      deze stoffen met dierlijke meststoffen te gebruiken, anders dan door een zo gelijkmatig mogelijke verspreiding over
      het perceel waarop deze stoffen of mengsels van deze stoffen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel34
  - number: 34a
    text: >-
      1 Het is verboden zuiveringsslib, compost, zwarte grond, een mengsel van deze stoffen of een mengsel van deze
      stoffen met dierlijke meststoffen te gebruiken op grond met een hellingspercentage van 7 of meer indien de
      desbetreffende grond is aangetast door geulenerosie.


      2 Voor de toepassing van het eerste lid wordt onder geulenerosie verstaan: de versnelde afvoer van bodemmateriaal
      door oppervlakkig afstromend water, waarbij geulen van meer dan 30 centimeter diepte zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel34a
  - number: 34b
    text: >-
      1 Het is verboden zuiveringsslib, compost, zwarte grond, een mengsel van deze stoffen of een mengsel van deze
      stoffen met dierlijke meststoffen te gebruiken op niet-beteelde grond met een hellingspercentage van 7 of meer.


      2 Het in het eerste lid gestelde verbod geldt niet voor niet-beteelde grond met een hellingspercentage van minder
      dan 18 indien deze grond uiterlijk acht dagen na het gebruik van de in het eerste lid genoemde stoffen of mengsels
      gelijkmatig is ingezaaid met een ander gewas dan maïs, aardappelen of bieten.


      3 De in het tweede lid genoemde uitzondering voor maïs, aardappelen of bieten geldt niet voor een perceel met een
      aaneengesloten lengte van ten hoogste 300 meter, dat aan beide einden over de volle breedte door een duidelijk
      waarneembare kavelgrens is afgebakend, dan wel over de volle breedte wordt begrensd door grond die gelijkmatig is
      bedekt met een ander gewas dan maïs, aardappelen of bieten over een aaneengesloten lengte van ten minste 100 meter.


      4 Voor de toepassing van het derde lid wordt verstaan onder:


      a. lengte van een perceel: zijde van een perceel die de grootste hoek vormt met de hoofdrichting van de
      hoogtelijnen;


      b. breedte van een perceel: zijde van een perceel, die de kleinste hoek vormt met de hoofdrichting van de
      hoogtelijnen.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel34b
  - number: 34c
    text: >-
      Het is verboden zuiveringsslib, compost, zwarte grond, een mengsel van deze stoffen of een mengsel van deze stoffen
      met dierlijke meststoffen te gebruiken op bouwland of braakland met een hellingspercentage van 18 of meer.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel34c
  - number: '36'
    text: |-
      1 Onze Minister van Landbouw, Natuurbeheer en Visserij kan in overeenstemming met Onze Minister, op aanvraag
      en gehoord de Technische commissie bodembescherming, ten behoeve van onderzoek ontheffing verlenen van de in de
      artikelen 29, 30, 34, 34b en 34c gestelde verboden, op basis van een ingediend onderzoeksplan.

      2 Een ontheffing kan slechts worden verleend indien naar het oordeel van Onze Ministers:

      - de ontheffing noodzakelijk is voor het te verrichten onderzoek,
      - het onderzoeksplan voldoende duidelijk en onderbouwd is,
      - het voldoende aannemelijk is dat het onderzoek daadwerkelijk zal leiden tot het in het onderzoeksplan
      geformuleerde onderzoeksresultaat,
      - het onderzoek voldoende innovatief is,
      - het onderzoek voldoende beperkt in duur en omvang is, en
      - het belang van de bescherming van de bodem zich niet verzet tegen de ontheffing.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel36
  - number: '37'
    text: |-
      1 Gedeputeerde staten kunnen voor de periode van 1 tot en met 15 september ten behoeve van experimenten met het
      gebruik van overige organische meststoffen op bouwland, braakland of niet-beteelde grond, gelegen in de gebieden
      die zijn aangegeven op de kaarten in [bijlage I bij het Besluit gebruik meststoffen][ref1], op aanvraag, ontheffing
      verlenen van het in artikel 29 gestelde verbod, op basis van een ingediend plan voor onderzoek.

      2 De ontheffing kan slechts worden verleend na kennisgeving door gedeputeerde staten aan Onze Minister van het
      in het eerste lid bedoelde verzoek en nadat Onze Minister ter zake de Technische commissie bodembescherming heeft
      gehoord.

      3 Artikel 36, tweede lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009066
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0009066
  - number: '38'
    text: >-
      Na de inwerkingtreding van dit besluit berusten de krachtens het Besluit van 20 november 1991 (Stb. 613), houdende
      regels met betrekking tot de kwaliteit en het op of in de bodem brengen van overige organische meststoffen,
      vastgestelde regels op dit besluit.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel38
  - number: '39'
    text: >-
      Het Besluit van 20 november 1991 (Stb. 613), houdende regels met betrekking tot de kwaliteit en het op of in de
      bodem brengen van overige organische meststoffen, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009360/2002-01-01#Artikel39
  - number: '40'
    text: |-
      1 Dit besluit treedt in werking met ingang van de achtentwintigste dag na de datum van uitgifte van het Staatsblad
      waarin het wordt geplaatst.

      2 In afwijking van het eerste lid treden de [artikelen 8, tweede lid, en derde lid][ref1], voor zover dit de
      certificering betreft, [10, eerste lid][ref2], 15, alsmede de [artikelen 13, tweede lid, onderdeel c][ref3],
      en [17][ref4], voor zover zij de bemonstering en analyse van de bodem bij het gebruik van compost betreffen,
      in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen
      daarvan verschillend kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel8
