---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_kwaliteit_en_gebruik_overige_organische_meststoffen
regulatory_layer: AMVB
publication_date: '1998-02-24'
valid_from: '2006-01-01'
bwb_id: BWBR0009360
url: https://wetten.overheid.nl/BWBR0009360/2006-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij, gedaan mede namens Onze Minister
    van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 27 oktober 1997, Directie Juridische Zaken, nr.
    J.977882;

    Overwegende, dat het noodzakelijk is om zowel in het belang van de bevordering van de deugdelijkheid voor het doel
    waarvoor meststoffen zijn bestemd als in het belang van de bescherming van de bodem, alsmede ter uitvoering van de
    Richtlijn van de Raad van de Europese Gemeenschappen van 12 juni 1986, nr. 86/278/EEG, betreffende de bescherming
    van het milieu, in het bijzonder de bodem, bij het gebruik van zuiveringsslib in de landbouw (PbEG L 181/6), regels
    te stellen betreffende de kwaliteit en het gebruik van zuiveringsslib, compost en zwarte grond;

    Gelet op de artikelen 1, 3, eerste lid, 7, 61, eerste lid, en 64 van de Meststoffenwet voor zover het betreft de
    artikelen 1, eerste lid, 2 tot en met 11 en 38 van dit besluit, alsmede gelet op de artikelen 6, 7, 15, 65, 91 en
    92 van de Wet bodembescherming voor zover het betreft de artikelen 1 en 12 tot en met 38 van dit besluit;

    De Raad van State gehoord (advies van 26 november 1997, nr. W11.97.0704);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij, uitgebracht mede namens Onze
    Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 12 januari 1998, Directie Juridische Zaken,
    nr. J.9714329;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder grond, landbouwgrond, grasland,
      bouwland, fosfaat, hectare, veengrond, zand- of lössgrond en kleigrond hetgeen daaronder wordt verstaan in
      [artikel 1, eerste lid, van de Meststoffenwet][ref1], en wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
  - number: 1.1.a
    text: 'zuiveringsslib:'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
  - number: 1.1.a.1
    text: |-
      slib dat geheel of in hoofdzaak afkomstig is van een installatie voor de zuivering van huishoudelijk, stedelijk,
      industrieel dan wel ander afvalwater van soortgelijke samenstelling als huishoudelijk, stedelijk en industrieel
      afvalwater;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
  - number: 1.1.a.2
    text: |-
      slib dat geheel of in hoofdzaak afkomstig is van septictanks en andere installaties voor de verzameling, afvoer en
      behandeling van afvalwater met uitzondering van vet- en zandvangers;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
  - number: 1.1.b
    text: 'vloeibaar zuiveringsslib: zuiveringsslib dat verpompbaar is;'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
  - number: 1.1.c
    text: 'steekvast zuiveringsslib: zuiveringsslib dat niet verpompbaar is;'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
  - number: 1.1.d
    text: |-
      compost: product, waaronder mede begrepen het in onderdeel e bedoelde product, dat geheel of grotendeels bestaat
      uit één of meer organische afvalstoffen die met behulp van micro-organismen zijn afgebroken en omgezet tot een
      zodanig stabiel eindproduct dat daarin alleen nog een langzame afbraak van humeuze verbindingen plaatsvindt, mits
      blijkens door de producent over te leggen gegevens dit product kennelijk niet geheel of grotendeels is geproduceerd
      uit dierlijke meststoffen;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
  - number: 1.1.e
    text: |-
      zeer schone compost: compost die voldoet aan de in de bij dit besluit behorende [bijlage III][ref1] gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0009360
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009360
  - number: 1.1.f
    text: 'zwarte grond: mengsel van bodembestanddelen en bewerkte organische afvalstoffen;'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
  - number: 1.1.g
    text: 'gebruiken: op of in de bodem brengen;'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
  - number: 1.1.h
    text: 'jaar: kalenderjaar;'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
  - number: 1.1.i
    text: |-
      emissiearm aanwenden: gebruiken overeenkomstig de voorschriften die voor de desbetreffende situatie zijn opgenomen
      in de bij dit besluit behorende [bijlage V][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009360
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009360
  - number: 1.1.j
    text: |-
      dierlijke meststoffen: meststoffen als bedoeld in [artikel 1, eerste lid, onderdeel d, van de Meststoffenwet][ref1]
      die geheel of gedeeltelijk bestaan uit uitwerpselen van dieren, waaronder mede wordt begrepen de geheel of
      gedeeltelijk verteerde maag- en darminhoud van dieren;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
  - number: 1.1.k
    text: 'overige grond: andere grond dan landbouwgrond of natuurterrein;'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
  - number: 1.1.l
    text: |-
      natuurterrein: grond met een houtopstand, alsmede heideveld, ven, hoogveenterrein, zandverstuiving, duinterrein,
      kwelder, schor, gors, slik, riet- en ruigtland, griend en laagveenmoeras, voor zover het geen landbouwgrond is;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
  - number: 1.1.m
    text: 'niet-beteelde grond: grond waarvan niet kan worden waargenomen dat deze gelijkmatig met een gewas bedekt is;'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
  - number: 1.1.n
    text: |-
      veenkoloniaal bouwplan: bouwplan met de teelt van fabrieksaardappelen ten behoeve van de zetmeelindustrie in een
      teeltfrequentie van ten minste éénmaal per drie jaar, met dien verstande dat geen sprake is van een veenkoloniaal
      bouwplan in de periode dat op de desbetreffende grond bloembollen worden geteeld of gras wordt geteeld;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
  - number: 1.1.o
    text: |-
      hellingspercentage: het quotiënt van het hoogteverschil en de horizontale afstand, uitgedrukt in procenten, volgens
      de in [bijlage VI][ref1] bij dit besluit aangegeven meetmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0009360
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009360
  - number: '1.2'
    text: |-
      Voor de toepassing van [artikel 25][ref1] wordt onder dierlijke meststoffen verstaan hetgeen daaronder wordt
      verstaan in [artikel 1, eerste lid, onderdeel e, van de Meststoffenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '1'
  - number: '1.3'
    text: |-
      Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt onder bouwland tevens verstaan grond waarop
      een houtopstand is aangelegd die valt onder de vrijstelling, bedoeld in de Beschikking vrijstelling meldings- en
      herplantplicht.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
  - number: '1.4'
    text: |-
      Voor de toepassing van de [artikelen 18 tot en met 20][ref1] en [23][ref2] is de situatie op 1 juli van het jaar
      waarin zuiveringsslib, compost of zwarte grond wordt gebruikt, bepalend voor de vraag of sprake is van bouwland,
      of grasland, met dien verstande dat indien op 1 juli van het desbetreffende jaar landbouwgrond niet wordt beteeld,
      deze grond wordt aangemerkt als bouwland, tenzij de grond het gehele jaar niet wordt beteeld, in welk geval de
      grond wordt aangemerkt als overige grond.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel23
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '1.5'
    text: |-
      Voor de toepassing van de [artikelen 29][ref1], [30][ref2] en [34c][ref3] wordt onder bouwland niet verstaan grond
      waarop tuinbouw in glasopstanden wordt uitgeoefend, of waarop een anderszins bedekte teelt plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0009360#Artikel34c
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009360
        artikel: 34c
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '2'
    text: |-
      Het is verboden zuiveringsslib, compost of zwarte grond als zodanig te verhandelen indien niet is voldaan aan de
      voor het desbetreffende product bij of krachtens dit besluit gestelde samenstellingseisen en hetgeen overigens bij
      of krachtens de [artikelen 3 tot en met 10][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel3
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '3'
    text: |-
      Zuiveringsslib dient te zijn behandeld langs biologische, chemische of thermische weg, door langdurige opslag
      of volgens enig ander geschikt procédé, dat tot gevolg heeft dat het grootste deel van de in het zuiveringsslib
      aanwezige pathogene organismen afsterft.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel3
  - number: '4.1'
    text: |-
      De samenstelling van het zuiveringsslib dient dient de samenstelling van zuiveringsslib te voldoen aan de in de bij
      dit besluit behorende [bijlage I][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009360
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009360
  - number: '4.2'
    text: |-
      Indien op enig tijdstip het stellen van aanvullende regels met betrekking tot de samenstelling van zuiveringsslib
      dringend noodzakelijk is en naar het oordeel van Onze Minister van Landbouw, Natuurbeheer en Visserij de
      totstandkoming van een daartoe strekkende algemene maatregel van bestuur niet kan worden afgewacht, kan hij in
      overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer een regeling terzake
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel4
  - number: '4.3'
    text: |-
      De in het tweede lid bedoelde regeling vervalt één jaar nadat zij in werking is getreden, of, indien binnen die
      termijn een algemene maatregel van bestuur ter vervanging van die regeling in werking is getreden, op het tijdstip
      waarop die algemene maatregel van bestuur in werking treedt. De termijn kan door Onze Minister van Landbouw, Natuur
      en Voedselkwaliteit in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      eenmaal bij een met redenen omkleed besluit, dat in de *Staatscourant* wordt bekendgemaakt, met ten hoogste één
      jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit kan bepalen dat zuiveringsslib, afkomstig van een
      installatie waarin zuiveringsslib wordt geproduceerd dan wel van een installatie waarin zuiveringsslib wordt be- of
      verwerkt, gedurende een bepaalde periode niet meer mag worden verhandeld.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit maakt van de in het eerste lid bedoelde bevoegdheid slechts
      gebruik indien naar zijn oordeel bij herhaling is gebleken, op basis van de voorgeschreven bemonstering en analyse,
      dat het door de desbetreffende installatie geproduceerde, be- of verwerkte zuiveringsslib niet aan de in de bij dit
      besluit behorende [bijlage I][ref1] bedoelde eisen voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0009360
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009360
  - number: '6.1'
    text: |-
      De samenstelling van compost, niet zijnde zeer schone compost, dient, te voldoen aan de in de bij dit besluit
      behorende [bijlage II][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009360
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009360
  - number: '6.2'
    text: |-
      De samenstelling van compost die geheel of grotendeels bestaat uit zuiveringsslib dient te voldoen aan de
      samenstellingseisen, met uitzondering van het organische stofgehalte en de zuurbindende waarde, met betrekking
      tot zuiveringsslib.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel6
  - number: '6.3'
    text: |-
      De [artikelen 4, tweede en derde lid][ref1], en [5][ref2] zijn van overeenkomstige toepassing met betrekking tot
      compost.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel5
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      De samenstelling van zwarte grond dient te voldoen aan de in de bij dit besluit behorende [bijlage IV][ref1]
      gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009360
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009360
  - number: '7.2'
    text: |-
      [Artikel 4, tweede en derde lid][ref1], is van overeenkomstige toepassing met betrekking tot zwarte grond.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel4
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Ten aanzien van zuiveringsslib, compost en zwarte grond dient te worden voldaan aan door Onze Minister van
      Landbouw, Natuur en Voedselkwaliteit gestelde regels omtrent bemonstering en analyse, welke onder meer betrekking
      kunnen hebben op de methode van bemonstering en analyse, de frequentie waarmee deze moeten plaatsvinden, de stoffen
      waarop de analyse betrekking dient te hebben, de erkenning en registratie van de instanties die de bemonstering
      en analyse dienen uit te voeren, op de intrekking van zodanige erkenning en registratie, alsmede op het bewaren en
      overleggen van de analyseresultaten.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel8
  - number: '8.2'
    text: |-
      Ten aanzien van zuiveringsslib, compost en zwarte grond dient te worden voldaan aan door Onze Minister van
      Landbouw, Natuurbeheer en Visserij gestelde regels omtrent certificering, welke onder meer betrekking kunnen hebben
      op de methode van certificering, de frequentie waarmee deze moet plaatsvinden, alsmede op het bewaren en overleggen
      van de certificaten.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel8
  - number: '8.3'
    text: |-
      Zuiveringsslib, compost of zwarte grond dienen bij het verhandelen te allen tijde vergezeld te gaan van een
      afschrift van de in het eerste lid bedoelde analyseresultaten dan wel de in het tweede lid bedoelde certificaten.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel8
  - number: '8.4'
    text: |-
      Het is een instantie als bedoeld in het eerste lid verboden bemonsteringen of analyses uit te voeren en
      analyseresultaten af te geven, indien zij niet beschikt over de in dat lid bedoelde erkenning en registratie.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel8
  - number: '8.5'
    text: |-
      Het is een instantie als bedoeld in het eerste lid, verboden onjuiste analyseresultaten of anderszins onjuiste
      gegevens af te geven.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel8
  - number: 8a
    text: |-
      [Artikel 8][ref1] is niet van toepassing op zuiveringsslib, compost en zwarte grond die rechtmatig zijn
      geproduceerd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie danwel rechtmatig zijn
      geproduceerd in een staat die partij is bij de Overeenkomst inzake de Europese Economische Ruimte en die aan ten
      minste even strenge eisen voldoen en vergezeld gaan van een analyserapport dat voldoende informatie verschaft
      over de samenstelling van het product en is afgegeven door een in die lidstaat of staat erkend laboratorium dat
      gelijkwaardig is aan een in Nederland voor dit doel erkend laboratorium.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel8
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '9.1'
    text: |-
      Producenten en be- of verwerkers van zuiveringsslib, compost of zwarte grond, zijn verplicht een register bij te
      houden, waarin met betrekking tot deze producten ten minste de volgende gegevens zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel9
  - number: 9.1.a
    text: |-
      de hoeveelheid geproduceerd, be- of verwerkt zuiveringsslib, compost of zwarte grond en de hoeveelheid verhandeld
      product, uitgedrukt in tonnen;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel9
  - number: 9.1.b
    text: |-
      de samenstelling en de eigenschappen van het desbetreffende product voor zover het betreft de gehalten aan droge
      stof en fosfaat, en indien het zuiveringsslib betreft, tevens het gehalte aan stikstof en de pH-waarde, alsmede de
      ingevolge de bij dit besluit behorende [bijlagen I tot en met IV][ref1] voor de desbetreffende producten geldende
      parameters en die gegevens die voortvloeien uit de nadere regels welke Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit krachtens dit besluit met betrekking tot de samenstelling heeft gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0009360
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009360
  - number: 9.1.c
    text: |-
      de namen en adressen van de afnemers van het desbetreffende product, de aan hen geleverde hoeveelheden en de
      samenstelling van het geleverde product;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel9
  - number: 9.1.d
    text: |-
      gegevens omtrent de bemonstering van het desbetreffende product, als bedoeld in [artikel 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel8
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 9.1.e
    text: |-
      indien het zuiveringsslib betreft, een omschrijving van de in [artikel 3][ref1] bedoelde behandelingsmethode voor
      zuiveringsslib.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel3
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      De in het eerste lid bedoelde gegevens dienen binnen vier weken nadat productie, be- of verwerking dan wel afzet
      heeft plaatsgevonden, in het register te worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel9
  - number: '9.3'
    text: |-
      Het register dient te worden bijgehouden overeenkomstig een door Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit vastgesteld model.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel9
  - number: '9.4'
    text: |-
      Omtrent de inhoud en het bijhouden van het register kunnen door Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel9
  - number: '9.5'
    text: De registers worden jaarlijks per 31 december afgesloten.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel9
  - number: '9.6'
    text: |-
      Producenten en be- of verwerkers van zuiveringsslib, compost of zwarte grond zijn verplicht de afgesloten registers
      over een jaar voor 1 maart van het daaropvolgende jaar te doen toekomen aan gedeputeerde staten van de provincie
      waar de installatie voor productie, be- of verwerking is gevestigd.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel9
  - number: '9.7'
    text: |-
      Producenten en be- of verwerkers van zuiveringsslib, compost of zwarte grond dienen alle in het eerste lid genoemde
      in de registers te vermelden gegevens gedurende vijf jaren na afloop van het jaar waarop deze betrekking hebben,
      te bewaren.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel9
  - number: '9.8'
    text: |-
      Producenten en be- of verwerkers van zuiveringsslib, compost of zwarte grond zijn verplicht de in het eerste lid,
      onderdeel *b*, genoemde gegevens bij het verhandelen van deze producten aan de afnemers van deze producten te
      verstrekken door middel van de in [artikel 8][ref1] bedoelde schriftelijke stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel8
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '10.2'
    text: |-
      De in [artikel 9][ref1] genoemde verplichtingen zijn niet van toepassing op degene die compost produceert uit op
      zijn landbouwbedrijf dan wel uit zijn particuliere huishouding vrijgekomen organische afvalstoffen, voor zover de
      compost niet is bestemd om te worden verhandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel9
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '11.1'
    text: |-
      Gedeputeerde staten dienen elk in de [artikelen 9, zesde lid][ref1] en [10][ref2] bedoeld register, afkomstig van
      producenten, be- en verwerkers van en handelaren in zuiveringsslib, compost of zwarte grond gedurende vijf jaren na
      afloop van het jaar waarop het desbetreffende register betrekking heeft te bewaren.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel10
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '11.2'
    text: |-
      Gedeputeerde staten maken aan de hand van de ontvangen registers jaarlijks een rapport omtrent de productie van
      zuiveringsslib, compost en zwarte grond en de afzet van deze producten, waarin de hoeveelheid en de kwaliteit
      van het geproduceerde en geleverde zuiveringsslib, de compost en de zwarte grond alsmede de samenstelling van de
      producten worden vermeld.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel11
  - number: '11.3'
    text: |-
      Gedeputeerde staten doen het in het tweede lid bedoelde rapport voor 1 september van het jaar volgend op het in
      [artikel 9, vijfde lid][ref1], bedoelde, toekomen aan Onze Ministers van Landbouw, Natuur en Voedselkwaliteit en
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel9
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '12.1'
    text: |-
      Het is verboden zuiveringsslib, compost of zwarte grond te gebruiken, indien niet is voldaan aan de in de bij dit
      besluit behorende bijlagen met betrekking tot de desbetreffende producten gestelde samenstellingseisen en hetgeen
      overigens bij of krachtens de [artikelen 3 tot en met 10][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel3
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      De in de [artikelen 18 tot en met 20][ref1] en [23][ref2] gestelde verboden gelden onverminderd het in
      [artikel 25][ref3] gestelde verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0009360#Artikel25
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009360
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '12.3'
    text: |-
      Het in [artikel 25][ref1] gestelde verbod geldt onverminderd de in de [artikelen 18 tot en met 20][ref2] en
      [23][ref3] gestelde verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0009360#Artikel23
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009360
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '12.4'
    text: |-
      De in [artikel 25][ref1] bedoelde hoeveelheid fosfaat in compost wordt vastgesteld overeenkomstig de krachtens
      [artikel 8][ref2] daaromtrent gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel8
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '13.1'
    text: |-
      Het is verboden in enig jaar zuiveringsslib of compost, een mengsel van deze stoffen dan wel een mengsel van deze
      stoffen met dierlijke meststoffen te gebruiken.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel13
  - number: '13.2'
    text: |-
      Het in het eerste lid bedoelde verbod is niet van toepassing, indien de producent respectievelijk de gebruiker met
      behulp van de gegevens, bedoeld in [artikel 13 van het Besluit administratieve verplichtingen Meststoffenwet][ref1],
      dan wel met behulp van gegevens bedoeld in de bij of krachtens de [artikelen 8][ref2], [9, achtste lid][ref3] en
      [16][ref4] van het onderhavige besluit gestelde regels, dan wel met behulp van andere aanvullende schriftelijke
      gegevens, aannemelijk maakt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009360#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0009360#Artikel16
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009360
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0009360
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 13.2.a
    text: |-
      op de tot het bedrijf van de producent respectievelijk de gebruiker behorende oppervlakte grond geen grotere
      hoeveelheid zuiveringsslib of compost, een mengsel van deze stoffen dan wel een mengsel van deze stoffen met
      dierlijke meststoffen is gebruikt dan op grond van de [artikelen 18][ref1], [19][ref2] en [20][ref3], [23][ref4] en
      [25][ref5] is toegestaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0009360#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0009360#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0009360#Artikel25
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009360
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009360
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0009360
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 13.2.b
    text: |-
      met betrekking tot het gebruikte zuiveringsslib, de gebruikte compost of de gebruikte zwarte grond is voldaan aan
      de in het onderhavige besluit gestelde samenstellingseisen, en
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel13
  - number: 13.2.c
    text: |-
      met betrekking tot het gebruikte zuiveringsslib of de gebruikte compost is voldaan aan de in de
      [artikelen 14][ref1], 15 en [17][ref2] bedoelde verplichtingen met betrekking tot bemonstering en analyse van de
      bodem.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel17
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '13.3'
    text: |-
      Bij het in het tweede lid bedoelde aannemelijk maken worden de gegevens, bedoeld in de bij of krachtens
      [artikel 13 van het Besluit administratieve verplichtingen Meststoffenwet][ref1] gestelde regels, dan wel in de
      bij of krachtens de [artikelen 8][ref2], [9, achtste lid][ref3], en [16][ref4] van het onderhavige besluit gestelde
      regels niet in aanmerking genomen indien deze regels niet of niet volledig door de betrokkenen zijn nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009360#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0009360#Artikel16
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009360
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0009360
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '14'
    text: |-
      Onverminderd de overige bepalingen opgenomen in dit hoofdstuk, is het verboden op landbouwgrond zuiveringsslib te
      gebruiken, tenzij voorafgaand aan het gebruik en overeenkomstig het bepaalde krachtens dit besluit een bemonstering
      en analyse van de bodem waarop het zuiveringsslib zal worden gebruikt, hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel14
  - number: '16.1'
    text: |-
      Omtrent de in de [artikelen 14][ref1] en 15 bedoelde bemonstering en analyse worden door Onze Minister van
      Landbouw, Natuur en Voedselkwaliteit in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer regels gesteld, die onder meer betrekking kunnen hebben op de methode van bemonstering
      en analyse, de frequentie waarmee de bemonstering en analyse moeten plaatsvinden, de erkenning en registratie
      van instanties die de bemonstering en analyse dienen uit te voeren, op de intrekking van zodanige erkenning en
      registratie, alsmede op het bewaren en overleggen van de analyseresultaten.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel14
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '16.2'
    text: |-
      [Artikel 8, vierde en vijfde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel8
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '17'
    text: |-
      Het is verboden zuiveringsslib of compost te gebruiken indien uit de in de [artikelen 14][ref1] en 15 bedoelde
      bemonstering en analyse blijkt dat een of meer van de in de bodem aanwezige stoffen de krachtens de bij dit besluit
      behorende [bijlage IV][ref2] geldende toetsingswaarden overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009360
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009360
  - number: '18'
    text: 'Het is verboden vloeibaar zuiveringsslib te gebruiken in een grotere hoeveelheid dan:'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel18
  - number: 18.a
    text: 2 ton droge stof per hectare per jaar op bouwland;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel18
  - number: 18.b
    text: 1 ton droge stof per hectare per jaar op grasland.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel18
  - number: '19.1'
    text: 'Het is verboden steekvast zuiveringsslib te gebruiken in een grotere hoeveelheid dan:'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel19
  - number: 19.1.a
    text: 4 ton droge stof per hectare per twee jaren op bouwland;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel19
  - number: 19.1.b
    text: 2 ton droge stof per hectare per twee jaren op grasland.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel19
  - number: '19.2'
    text: |-
      Gedurende de in het eerste lid bedoelde perioden dient voor het betreffende aantal hectaren het grondgebruik
      ongewijzigd te blijven.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel19
  - number: '20.1'
    text: 'Het is verboden compost te gebruiken in een grotere hoeveelheid dan:'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel20
  - number: 20.1.a
    text: 6 ton droge stof per hectare per jaar dan wel 12 ton droge stof per hectare per twee jaren op bouwland;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel20
  - number: 20.1.b
    text: 3 ton droge stof per hectare per jaar dan wel 6 ton droge stof per hectare per twee jaren op grasland.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel20
  - number: '20.2'
    text: |-
      Indien de compost geheel of grotendeels bestaat uit zuiveringsslib zijn de [artikelen 14][ref1] en [19][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel19
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '20.3'
    text: De in het eerste lid gestelde verboden zijn niet van toepassing op het gebruik van zeer schone compost.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel20
  - number: '20.4'
    text: |-
      Gedurende de in het eerste lid bedoelde perioden dient voor het betreffende aantal hectaren het grondgebruik
      ongewijzigd te blijven.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel20
  - number: '22'
    text: |-
      Het in [artikel 20][ref1] gestelde verbod is niet van toepassing op het gebruik van compost die door de gebruiker
      zelf is vervaardigd uit op zijn landbouwbedrijf of uit zijn particuliere huishouding vrijgekomen organische
      afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel20
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '23.1'
    text: |-
      Het is verboden op overige grond zuiveringsslib of een mengsel van zuiveringsslib met compost, zwarte grond of
      dierlijke meststoffen te gebruiken.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel23
  - number: '23.2'
    text: |-
      Het is verboden op overige grond compost te gebruiken in een grotere hoeveelheid dan 6 ton droge stof per hectare
      per jaar, dan wel 12 ton droge stof per hectare per twee jaren.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel23
  - number: '23.3'
    text: De in het tweede lid gestelde verboden zijn niet van toepassing op het gebruik van zeer schone compost.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel23
  - number: '24.1'
    text: |-
      In afwijking van [artikel 23, tweede lid][ref1], is het toegestaan op overige grond compost te gebruiken bij wijze
      van eenmalige gift in een hoeveelheid van maximaal 200 ton droge stof per hectare, indien dit geschiedt ten behoeve
      van de aanleg of uitbreiding van een groenvoorziening, een recreatieterrein, een sportcomplex of een golfterrein,
      waarin bij een plan als bedoeld in de [artikelen 7][ref2] en [10 van de Wet op de Ruimtelijke Ordening][ref3],
      dan wel bij een besluit als bedoeld in [artikel 19 van die wet][ref4] is voorzien, en indien tenminste vier weken
      voorafgaande aan het gebruik een kennisgeving daarvan aan Onze Minister van Landbouw, Natuur en Voedselkwaliteit
      heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002375
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0002375
        artikel: '19'
  - number: '24.2'
    text: 'De in het eerste lid bedoelde kennisgeving dient te bevatten:'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel24
  - number: 24.2.a
    text: naam en adres van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel24
  - number: 24.2.b
    text: een nauwkeurige omschrijving van de aard van het project, als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel24
  - number: 24.2.c
    text: |-
      een kadastrale aanduiding van de plaats waar het project wordt uitgevoerd alsmede een opgave van de oppervlakte van
      de locatie;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel24
  - number: 24.2.d
    text: het voorgenomen tijdstip van uitvoering van het project;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel24
  - number: 24.2.e
    text: naam en adres van de leverancier van het product;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel24
  - number: 24.2.f
    text: |-
      de gegevens, als bedoeld in [artikel 8][ref1] van dit besluit, omtrent de hoedanigheid en samenstelling van het
      product.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel8
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '24.3'
    text: |-
      Met het in het eerste lid bedoelde gebruik mag eerst worden aangevangen, zodra een bevestiging van ontvangst van de
      kennisgeving door de gebruiker is ontvangen.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel24
  - number: '25.1'
    text: |-
      Het is verboden op overige grond compost of een mengsel van deze stof met dierlijke meststoffen, dan wel
      verschillende van deze meststoffen tegelijkertijd of achtereenvolgens te gebruiken in een grotere hoeveelheid,
      gemeten in kilogrammen fosfaat (kg P205) per hectare, dan 20 kg fosfaat per jaar.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel25
  - number: '25.2'
    text: |-
      Het eerste lid is niet van toepassing in geval van gebruik van compost als bedoeld in [artikel 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel24
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '26'
    text: |-
      De in de [artikelen 23][ref1] en [25][ref2] gestelde verboden zijn niet van toepassing op het gebruik van compost
      die door de gebruiker zelf is vervaardigd uit op zijn landbouwbedrijf of uit zijn particuliere huishouding
      vrijgekomen organische afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel25
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 26a
    text: |-
      Het is verboden op overige grond in de periode van 1 september tot en met 31 januari een mengsel van dierlijke
      meststoffen met compost of zwarte grond te gebruiken.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel26a
  - number: '27'
    text: |-
      Het is verboden op natuurterrein zuiveringsslib, compost of zwarte grond, een mengsel van deze stoffen of een
      mengsel van deze stoffen met dierlijke meststoffen te gebruiken.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel27
  - number: '28'
    text: |-
      Het is verboden zuiveringsslib, een mengsel van zuiveringsslib met compost of met zwarte grond of een mengsel van
      deze stoffen met dierlijke meststoffen te gebruiken indien de bodem geheel of gedeeltelijk is bevroren of geheel of
      gedeeltelijk is bedekt met sneeuw.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel28
  - number: 28a
    text: |-
      Het is verboden zuiveringsslib te gebruiken of een mengsel van zuiveringsslib met compost, met zwarte grond of met
      dierlijke meststoffen:
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel28a
  - number: 28a.a
    text: 'op weideland: gedurende de periode van beweiding;'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel28a
  - number: 28a.b
    text: 'op grond die wordt gebruikt voor de teelt van voedergewassen: minder dan drie weken voor de oogst;'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel28a
  - number: 28a.c
    text: |-
      op grond die wordt gebruikt voor groente- of fruitaanplant, met uitzondering van fruitbomen: gedurende de
      groeiperiode van de groente onderscheidenlijk het fruit;
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel28a
  - number: 28a.d
    text: |-
      op grond die is bestemd voor de teelt van groenten of vruchten, die gewoonlijk in rechtstreeks contact met de bodem
      staan en rauw worden geconsumeerd: minder dan 10 maanden voor de oogst alsmede tijdens de oogst.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel28a
  - number: 28b
    text: |-
      Het is verboden zuiveringsslib, compost, zwarte grond, een mengsel van deze stoffen of een mengsel van deze stoffen
      met dierlijke meststoffen te gebruiken indien de bovenste bodemlaag met water verzadigd is.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel28b
  - number: 28c.1
    text: |-
      Het is verboden in de periode van 1 september tot en met 31 januari zuiveringsslib, compost, zwarte grond, een
      mengsel van deze stoffen of een mengsel van deze stoffen met dierlijke meststoffen te gebruiken indien de bodem
      tegelijkertijd wordt bevloeid, beregend of geïnfiltreerd.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel28c
  - number: 28c.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder infiltreren verstaan: aanvoeren van water op of onder het
      grondoppervlak door middel van een buizen- of slangenstelsel.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel28c
  - number: '29.1'
    text: |-
      Het is verboden in de periode van 1 september tot en met 31 januari zuiveringsslib, een mengsel van zuiveringsslib
      met compost of zwarte grond of een mengsel van deze stoffen met dierlijke meststoffen te gebruiken op bouwland, of
      op grasland.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel29
  - number: '29.2'
    text: Het in het eerste lid gestelde verbod geldt niet voor bouwland, gelegen op kleigrond of veengrond.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel29
  - number: '29.3'
    text: |-
      Het in het eerste lid gestelde verbod geldt niet in de periode van 1 tot en met 15 september voor grasland, gelegen
      op kleigrond of veengrond.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel29
  - number: '30.1'
    text: |-
      Het is verboden zuiveringsslib, een mengsel van zuiveringsslib met compost of zwarte grond of een mengsel van
      dierlijke meststoffen met zuivingsslib, compost of zwarte grond te gebruiken op grasland of bouwland, tenzij deze
      stoffen of mengsels van deze stoffen, emissiearm worden aangewend.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel30
  - number: '30.2'
    text: |-
      het in het eerste lid gestelde verbod is niet van toepassing op gronden gelegen op zand- of lössgrond, waarop een
      veenkoloniaal bouwplan wordt uitgeoefend, alsmede op bouwland gelegen op Texel.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel30
  - number: '30.3'
    text: |-
      Het in het eerste lid gestelde verbod is niet van toepassing op het gebruik van steekvast zuiveringsslib op
      grasland, tenzij dit grasland een hellingspercentage heeft van 7 of meer.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel30
  - number: '34'
    text: |-
      Het is verboden zuiveringsslib, compost, een mengsel van zuiveringsslib, compost of zwarte grond of een mengsel van
      deze stoffen met dierlijke meststoffen te gebruiken, anders dan door een zo gelijkmatig mogelijke verspreiding over
      het perceel waarop deze stoffen of mengsels van deze stoffen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel34
  - number: 34a.1
    text: |-
      Het is verboden zuiveringsslib, compost, zwarte grond, een mengsel van deze stoffen of een mengsel van deze stoffen
      met dierlijke meststoffen te gebruiken op grond met een hellingspercentage van 7 of meer indien de desbetreffende
      grond is aangetast door geulenerosie.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel34a
  - number: 34a.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder geulenerosie verstaan: de versnelde afvoer van bodemmateriaal
      door oppervlakkig afstromend water, waarbij geulen van meer dan 30 centimeter diepte zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel34a
  - number: 34b.1
    text: |-
      Het is verboden zuiveringsslib, compost, zwarte grond, een mengsel van deze stoffen of een mengsel van deze stoffen
      met dierlijke meststoffen te gebruiken op niet-beteelde grond met een hellingspercentage van 7 of meer.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel34b
  - number: 34b.2
    text: |-
      Het in het eerste lid gestelde verbod geldt niet voor niet-beteelde grond met een hellingspercentage van minder
      dan 18 indien deze grond uiterlijk acht dagen na het gebruik van de in het eerste lid genoemde stoffen of mengsels
      gelijkmatig is ingezaaid met een ander gewas dan maïs, aardappelen of bieten.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel34b
  - number: 34b.3
    text: |-
      De in het tweede lid genoemde uitzondering voor maïs, aardappelen of bieten geldt niet voor een perceel met een
      aaneengesloten lengte van ten hoogste 300 meter, dat aan beide einden over de volle breedte door een duidelijk
      waarneembare kavelgrens is afgebakend, dan wel over de volle breedte wordt begrensd door grond die gelijkmatig is
      bedekt met een ander gewas dan maïs, aardappelen of bieten over een aaneengesloten lengte van ten minste 100 meter.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel34b
  - number: 34b.4
    text: 'Voor de toepassing van het derde lid wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel34b
  - number: 34b.4.a
    text: 'lengte van een perceel: zijde van een perceel die de grootste hoek vormt met de hoofdrichting van de hoogtelijnen;'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel34b
  - number: 34b.4.b
    text: |-
      breedte van een perceel: zijde van een perceel, die de kleinste hoek vormt met de hoofdrichting van de
      hoogtelijnen.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel34b
  - number: 34c
    text: |-
      Het is verboden zuiveringsslib, compost, zwarte grond, een mengsel van deze stoffen of een mengsel van deze stoffen
      met dierlijke meststoffen te gebruiken op bouwland met een hellingspercentage van 18 of meer.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel34c
  - number: '36.1'
    text: |-
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit kan in overeenstemming met Onze Minister, op aanvraag
      en gehoord de Technische commissie bodembescherming, ten behoeve van onderzoek ontheffing verlenen van de in
      de [artikelen 29][ref1], [30][ref2], [34][ref3], [34b][ref4] en [34c][ref5] gestelde verboden, op basis van een
      ingediend onderzoeksplan.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0009360#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0009360#Artikel34b
      [ref5]: https://wetten.overheid.nl/BWBR0009360#Artikel34c
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009360
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0009360
        artikel: 34b
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref5
        bwb_id: BWBR0009360
        artikel: 34c
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '36.2'
    text: |-
      Een ontheffing kan slechts worden verleend indien naar het oordeel van Onze Ministers: - de ontheffing noodzakelijk
      is voor het te verrichten onderzoek,
        - het onderzoeksplan voldoende duidelijk en onderbouwd is,
        - het voldoende aannemelijk is dat het onderzoek daadwerkelijk zal leiden tot het in het onderzoeksplan
      geformuleerde onderzoeksresultaat,
        - het onderzoek voldoende innovatief is,
        - het onderzoek voldoende beperkt in duur en omvang is, en
        - het belang van de bescherming van de bodem zich niet verzet tegen de ontheffing.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel36
  - number: '37.1'
    text: |-
      Gedeputeerde staten kunnen voor de periode van 1 tot en met 15 september ten behoeve van experimenten met het
      gebruik van overige organische meststoffen op bouwland, gelegen op zand- of lössgrond, op aanvraag, ontheffing
      verlenen van het in [artikel 29][ref1] gestelde verbod, op basis van een ingediend plan voor onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel29
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '37.2'
    text: |-
      De ontheffing kan slechts worden verleend na kennisgeving door gedeputeerde staten aan Onze Minister van het in het
      eerste lid bedoelde verzoek en nadat Onze Minister ter zake de Technische commissie bodembescherming heeft gehoord.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel37
  - number: '37.3'
    text: |-
      [Artikel 36, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel36
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: '38'
    text: |-
      Na de inwerkingtreding van dit besluit berusten de krachtens het Besluit van 20 november 1991 (Stb. 613), houdende
      regels met betrekking tot de kwaliteit en het op of in de bodem brengen van overige organische meststoffen,
      vastgestelde regels op dit besluit.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel38
  - number: '39'
    text: |-
      Het Besluit van 20 november 1991 (Stb. 613), houdende regels met betrekking tot de kwaliteit en het op of in de
      bodem brengen van overige organische meststoffen, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel39
  - number: '40.1'
    text: |-
      Dit besluit treedt in werking met ingang van de achtentwintigste dag na de datum van uitgifte van het Staatsblad
      waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel40
  - number: '40.2'
    text: |-
      In afwijking van het eerste lid treden de [artikelen 8, tweede lid, en derde lid][ref1], voor zover dit de
      certificering betreft, [10, eerste lid][ref2], 15, alsmede de [artikelen 13, tweede lid, onderdeel c][ref3],
      en [17][ref4], voor zover zij de bemonstering en analyse van de bodem bij het gebruik van compost betreffen,
      in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen
      daarvan verschillend kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009360#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009360#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0009360#Artikel17
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009360
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0009360
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0009360
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '41'
    text: 'Dit besluit kan worden aangehaald als: Besluit kwaliteit en gebruik overige organische meststoffen.'
    url: https://wetten.overheid.nl/BWBR0009360/2006-01-01#Artikel41
