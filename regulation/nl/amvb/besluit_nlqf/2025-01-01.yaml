        artikel: '1'
      - id: ref5
        bwb_id: BWBR0050058
        artikel: '3'
  - number: '2.1'
    text: |-
      De NLQF-niveaus en de daarmee corresponderende EQF-niveaus worden als volgt vastgesteld:






                    NLQF-niveau


                    EQF-niveau






                    Instroomniveau


                    –




                    NLQF-niveau 1


                    EQF-niveau 1




                    NLQF-niveau 2


                    EQF-niveau 2




                    NLQF-niveau 3


                    EQF-niveau 3




                    NLQF-niveau 4


                    EQF-niveau 4




                    NLQF-niveau 4+


                    EQF-niveau 4




                    NLQF-niveau 5


                    EQF-niveau 5




                    NLQF-niveau 6


                    EQF-niveau 6




                    NLQF-niveau 7


                    EQF-niveau 7




                    NLQF-niveau 8


                    EQF-niveau 8
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel2
  - number: '2.2'
    text: |-
      De in het eerste lid genoemde niveaus gelden voor formele en non-formele opleidingen, met dien verstande dat NLQF-
      niveau 4+ uitsluitend van toepassing is op formele opleidingen.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel2
  - number: '2.3'
    text: |-
      Bij ministeriële regeling worden de NLQF-niveaus omschreven in termen van kennis, vaardigheden, zelfstandigheid
      en verantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel2
  - number: '3'
    text: |-
      De Stichting CINOP Publiek, statutair gevestigd te ’s-Hertogenbosch, wordt aangewezen als Nationaal coördinatiepunt
      NLQF.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel3
  - number: '4.1'
    text: |-
      Bij een aanvraag tot vaststelling van het NLQF-niveau van een non-formele opleiding wordt gebruik gemaakt van een
      door het Nationaal coördinatiepunt NLQF vastgesteld aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het Nationaal coördinatiepunt NLQF stelt jaarlijks ten minste vier data vast waarop een aanvraag kan worden
      ingediend. Een aanvraag die eerder wordt ingediend dan de door het Nationaal coördinatiepunt NLQF vastgestelde
      indieningsdatum wordt beschouwd als een aanvraag ingediend op die indieningsdatum.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel4
  - number: '4.3'
    text: Bij ministeriële regeling kan worden vastgesteld welke gegevens de aanvraag in ieder geval dient te omvatten.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel4
  - number: '5.1'
    text: |-
      De beoordeling van de aanvraag, bedoeld in [artikel 4][ref1], omvat een validiteitstoets en een inschalingstoets.


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Artikel4
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0050303
        artikel: '4'
        hoofdstuk: '2'
  - number: '5.2'
    text: 'In de validiteitstoets wordt de aanvraag beoordeeld op:'
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel5
  - number: 5.2.a
    text: het eigendomsrecht van de non-formele opleiding;
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel5
  - number: 5.2.b
    text: de rechtsvorm en continuïteit van de organisatie van de aanbieder;
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel5
  - number: 5.2.c
    text: de wijze waarop de kwaliteit van de non-formele opleiding door de aanbieder wordt gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel5
  - number: 5.2.d
    text: |-
      de wijze waarop door de aanbieder is voorzien in een onafhankelijke positionering van de examinering van de non-
      formele opleiding.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel5
  - number: '5.3'
    text: |-
      In de inschalingstoets wordt de arbeidsmarktrelevantie van de opleiding beoordeeld en wordt bepaald aan welk NLQF-
      niveau de beoogde leeruitkomsten van de opleiding voldoen in termen van kennis, vaardigheden, zelfstandigheid en
      verantwoordelijkheid, zoals vastgesteld op grond van [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Artikel2
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0050303
        artikel: '2'
        hoofdstuk: '1'
  - number: '5.4'
    text: Het Nationaal coördinatiepunt NLQF besluit binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel5
  - number: '6.1'
    text: |-
      Het besluit tot vaststelling van het NLQF-niveau van een non-formele opleiding vervalt zes jaar na het moment van
      vaststelling van dat besluit.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel6
  - number: '6.2'
    text: |-
      Aan het besluit kunnen voorwaarden en voorschriften worden verbonden. Het Nationaal coördinatiepunt NLQF kan
      het besluit intrekken indien niet aan die voorwaarden of voorschriften, of aan de voorschriften bedoeld in
      [artikel 9, derde lid][ref1], wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Artikel9
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0050303
        artikel: '9'
        hoofdstuk: '2'
  - number: '7.1'
    text: |-
      Nadat het Nationaal coördinatiepunt NLQF heeft besloten tot vaststelling van het NLQF-niveau van een non-formele
      opleiding, neemt het de volgende gegevens op in het NLQF-register:
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel7
  - number: 7.1.a
    text: het registratienummer;
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel7
  - number: 7.1.b
    text: de naam van de opleiding;
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel7
  - number: 7.1.c
    text: de aanbieder van de opleiding;
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel7
  - number: 7.1.d
    text: het NLQF- en EQF-niveau van de opleiding;
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel7
  - number: 7.1.e
    text: |-
      de datum waarop de opleiding is ingeschaald of naar aanleiding van een herbeoordeling als bedoeld in
      [artikel 8][ref1] opnieuw is ingeschaald;


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Artikel8
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0050303
        artikel: '8'
        hoofdstuk: '2'
  - number: 7.1.f
    text: de geldigheidsduur van de inschaling;
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel7
  - number: 7.1.g
    text: indien van toepassing, de reden van beëindiging van de inschaling.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel7
  - number: '7.2'
    text: Bij ministeriële regeling kunnen de gegevens, bedoeld in het eerste lid, nader worden gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel7
  - number: '8.1'
    text: |-
      Het Nationaal coördinatiepunt NLQF stelt de aanbieder van een in het NLQF-register opgenomen non-formele opleiding
      tijdig op de hoogte van het moment waarop de geldigheidsduur van de inschaling van die opleiding afloopt.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien de aanbieder de inschaling van die opleiding na afloop van de periode bedoeld in
      [artikel 6, eerste lid][ref1], wil laten voortduren, dient hij daartoe uiterlijk dertien weken voor afloop van die
      periode een aanvraag tot herbeoordeling in bij het Nationaal coördinatiepunt NLQF.


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Artikel6
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0050303
        artikel: '6'
        hoofdstuk: '2'
  - number: '8.3'
    text: |-
      Bij een aanvraag tot herbeoordeling wordt gebruik gemaakt van een door het Nationaal coördinatiepunt NLQF
      vastgesteld aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel8
  - number: '8.4'
    text: Het Nationaal coördinatiepunt NLQF besluit binnen dertien weken na ontvangst van de aanvraag tot herbeoordeling.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel8
  - number: '8.5'
    text: |-
      Indien op een aanvraag tot herbeoordeling die uiterlijk dertien weken voor afloop van de periode bedoeld in
      [artikel 6, eerste lid][ref1], is ingediend pas kan worden beslist na afloop van die periode, dan wordt de
      geldigheidsduur van de inschaling stilzwijgend verlengd tot het moment waarop een definitief besluit op de aanvraag
      tot herbeoordeling van die non-formele opleiding is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Artikel6
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0050303
        artikel: '6'
        hoofdstuk: '2'
  - number: '8.6'
    text: |-
      Als het Nationaal coördinatiepunt NLQF positief besluit op de aanvraag tot herbeoordeling, wordt de geldigheidsduur
      van de inschaling van de non-formele opleiding met zes jaar verlengd. [Artikel 6][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Artikel6
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0050303
        artikel: '6'
        hoofdstuk: '2'
  - number: '9.1'
    text: |-
      De aanbieder van een ingeschaalde non-formele opleiding meldt aan het Nationaal coördinatiepunt NLQF tussentijdse
      wijzigingen die er mogelijk toe zouden hebben geleid dat het Nationaal coördinatiepunt NLQF een ander besluit zou
      hebben genomen op de aanvraag, bedoeld in [artikel 4][ref1] of [8][ref2], indien deze wijzigingen op dat moment
      bekend zouden zijn geweest, of wijzigingen die van invloed zijn op de wijze waarop de opleiding in het NLQF-
      register staat geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0050303#Artikel8
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0050303
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0050303
        artikel: '8'
        hoofdstuk: '2'
  - number: '9.2'
    text: 'Onder wijzigingen als bedoeld in het eerste lid vallen in elk geval:'
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel9
  - number: 9.2.a
    text: een wijziging in de rechtspersoonlijkheid of naamgeving van de aanbieder;
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel9
  - number: 9.2.b
    text: een aanvraag van surseance van betaling door of faillissement van de aanbieder;
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel9
  - number: 9.2.c
    text: een overdracht van het eigendomsrecht op de opleiding aan een andere aanbieder;
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel9
  - number: 9.2.d
    text: een verandering in de organisatie van de examinering van de opleiding;
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel9
  - number: 9.2.e
    text: een samenvoeging of splitsing van de opleiding;
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel9
  - number: 9.2.f
    text: een wijziging in de naam van de opleiding; of
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel9
  - number: 9.2.g
    text: een significante wijziging in de leeruitkomsten van de opleiding.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel9
  - number: '9.3'
    text: |-
      Als de aanbieder van een non-formele opleiding het NLQF-niveau van die opleiding vermeldt op een waardedocument
      van de opleiding of in communicatie over de opleiding, houdt hij zich aan de voorschriften die het Nationaal
      coördinatiepunt NLQF hierover heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel9
  - number: '10'
    text: 'De inschaling van een non-formele opleiding in het NLQF-register wordt beëindigd:'
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel10
  - number: 10.a
    text: |-
      zodra het besluit tot vaststelling van het NLQF-niveau van die opleiding op grond van
      [artikel 6, eerste lid][ref1], vervalt, tenzij de geldigheidsduur van de inschaling is verlengd op grond van een
      besluit als bedoeld in [artikel 8, zesde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0050303#Artikel8
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0050303
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0050303
        artikel: '8'
        hoofdstuk: '2'
  - number: 10.b
    text: |-
      indien het Nationaal coördinatiepunt NLQF besluit om de inschaling in te trekken omdat niet of niet meer wordt
      voldaan aan de voorwaarden of voorschriften, bedoeld in [artikel 6, tweede lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Artikel6
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0050303
        artikel: '6'
        hoofdstuk: '2'
  - number: 10.c
    text: op verzoek van de aanbieder.
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel10
  - number: '11.1'
    text: |-
      Dit besluit is van overeenkomstige toepassing op een non-formele opleiding waarvan voorafgaand aan het moment van
      inwerkingtreding van de [Wet NLQF][ref1] het NLQF-niveau is vastgesteld door Stichting CINOP, Stichting CINOP –
      ecbo of Stichting CINOP Publiek.


      [ref1]: https://wetten.overheid.nl/BWBR0050058
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050058
  - number: '11.2'
    text: |-
      [Hoofdstuk 2][ref1] van dit besluit is van toepassing op een aanvraag tot vaststelling van het NLQF-niveau van een
      non-formele opleiding die bij Stichting CINOP – ecbo of Stichting CINOP Publiek is ingediend voorafgaand aan het
      moment van inwerkingtreding van de [Wet NLQF][ref2], maar waarop op dat moment nog geen besluit is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0050058
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050303
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0050058
  - number: '11.3'
    text: |-
      Dit artikel vervalt met ingang van 1 januari van het zevende jaar na de datum van inwerkingtreding van de
      [Wet NLQF][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050058
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050058
  - number: '13.1'
    text: |-
      Dit besluit treedt, met uitzondering van [artikel 12][ref1], in werking op het moment waarop de [Wet NLQF][ref2] in
      werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0050058
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0050303
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0050058
  - number: '13.2'
    text: |-
      [Artikel 12][ref1] van dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin dit besluit wordt geplaatst en werkt terug tot en met 1 januari 2024.


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Artikel12
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0050303
        artikel: '12'
        hoofdstuk: '3'
  - number: '14'
    text: 'Dit besluit wordt aangehaald als: Besluit NLQF.'
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel14
