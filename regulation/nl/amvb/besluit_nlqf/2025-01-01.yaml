preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Primair en Voortgezet Onderwijs, gedaan mede namens Onze Minister van
    Onderwijs, Cultuur en Wetenschap, van 22 mei 2024, nr. WJZ/45469344 (9297), directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 1.3, tweede lid, 1.4, eerste lid, 3.1, derde lid, en 7.2, derde lid, van de Wet NLQF en
    artikel 2.10a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek;

    De Afdeling advisering van de Raad van State gehoord (advies van 10 juli 2024, nr. W05.24.00114/I);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, uitgebracht mede namens Onze
    Minister van Onderwijs, Cultuur en Wetenschap, van 30 september 2024, nr. WJZ/47067599 (9297), directie Wetgeving
    en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *aanbieder:* natuurlijke persoon of
      rechtspersoon die: a. een non-formele opleiding verzorgt en een aanvraag tot vaststelling van het NLQF-niveau van
      die opleiding indient of heeft ingediend als bedoeld in [artikel 3.1 van de Wet NLQF][ref1]; of b. een non-formele
      opleiding verzorgt waarvoor een NLQF-niveau is vastgesteld;
        - *inschaling:* vaststelling van het NLQF-niveau van een non-formele opleiding door het Nationaal coördinatiepunt
      NLQF op een aanvraag als bedoeld in [artikel 4][ref2] of [artikel 8][ref3];
        - *NLQF-register:* openbaar register als bedoeld in de [artikelen 1.4, tweede lid, onderdeel b][ref4], en
      [3.1, tweede lid, van de Wet NLQF][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0050058#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050303#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0050303#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0050058#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0050058#Artikel3
    url: https://wetten.overheid.nl/BWBR0050303/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0050058
        artikel: '3'
