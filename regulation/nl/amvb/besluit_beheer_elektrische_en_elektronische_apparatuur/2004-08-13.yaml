preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 14 mei
    2004, nr. MJZ2004048257, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op richtlijn nr. 2002/95/EG van het Europees Parlement en de Raad van de Europese Unie van 27 januari 2003
    betreffende beperking van het gebruik van bepaalde gevaarlijke stoffen in elektrische en elektronische apparatuur
    (PbEU 2003, L 37), richtlijn nr. 2002/96/EG van het Europees Parlement en de Raad van de Europese Unie van 27
    januari 2003 betreffende afgedankte elektrische en elektronische apparatuur (PbEU 2003, L 37), zoals gewijzigd bij
    richtlijn nr. 2003/108/EG van 8 december 2003 (PbEU L 345), artikel 24, eerste lid, van de Wet milieugevaarlijke
    stoffen en de artikelen 1.1, derde lid, 8.2, tweede lid, 8.40 tot en met 8.42, 8.44, 8.45, 10.15 tot en met 10.17,
    10.22, tweede lid, en 10.61 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 17 juni 2004, No. W08.04.0192/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 2
    juli 2004, nr. MJZ2004066587, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0016990/2004-08-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. [richtlijn nr. 2002/95](32002L0095): [richtlijn nr. 2002/95/EG](32002L0095) van het Europees Parlement en
      de Raad van de Europese Unie van 27 januari 2003 betreffende beperking van het gebruik van bepaalde gevaarlijke
      stoffen in elektrische en elektronische apparatuur (PbEU 2003, L 37);

      b. [richtlijn nr. 2002/96](32002L0096): [richtlijn nr. 2002/96/EG](32002L0096) van het Europees Parlement en de
      Raad van de Europese Unie van 27 januari 2003 betreffende afgedankte elektrische en elektronische apparatuur (PbEU
      2003, L 37);

      c. [verordening nr. 2037/2000](32000R2037): [verordening (EG) nr. 2037/2000](32000R2037) van het Europees Parlement
      en de Raad van de Europese Unie van 29 juni 2000 betreffende de ozonlaag afbrekende stoffen (PbEG L 244);

      d. elektrische en elektronische apparatuur: apparaten die elektrische stromen of elektromagnetische velden nodig
      hebben om naar behoren te kunnen werken en apparaten voor het opwekken, overbrengen en meten van die stromen en
      velden, die:

      1°. onder een van de in bijlage IA bij [richtlijn nr. 2002/96](32002L0096) genoemde categorieën vallen, en

      2°. bedoeld zijn voor gebruik met een spanning van maximaal 1000 volt bij wisselstroom en 1500 volt bij
      gelijkstroom;

      e. producent: degene die, ongeacht de verkooptechniek:

      1°. onder zijn eigen merk elektrische en elektronische apparatuur vervaardigt en verkoopt,

      2°. onder zijn eigen merk elektrische en elektronische apparatuur wederverkoopt die door andere leveranciers is
      vervaardigd of ingevoerd en verkocht, met uitzondering van de wederverkoop van apparatuur wanneer het merk van
      degene, bedoeld onder 1°, op het apparaat zichtbaar is, of

      3°. in de uitoefening van zijn beroep of bedrijf elektrische en elektronische apparatuur invoert in,
      respectievelijk uitvoert uit Nederland,

      met uitzondering van degene die uitsluitend voorziet in financiering op grond van of in het kader van een
      financieringsovereenkomst;

      f. financieringsovereenkomst: een lening-, lease-, huur- of afbetalingsovereenkomst of een regeling met betrekking
      tot enige apparatuur, ongeacht of volgens die overeenkomst of regeling, dan wel volgens een bijkomende overeenkomst
      of regeling, eigendomsoverdracht van het apparaat zal of kan plaatsvinden;

      g. CFK: chloorfluorkoolstoffen als bedoeld in artikel 2 van [verordening nr. 2037/2000](32000R2037);

      h. HCFK: chloorfluorkoolwaterstoffen als bedoeld in artikel 2 van [verordening nr. 2037/2000](32000R2037).

      2 Onder de in bijlage IA bij [richtlijn nr. 2006/96](32006L0096) genoemde categorieën elektrische en elektronische
      apparatuur vallen in ieder geval de producten, bedoeld in bijlage IB bij die richtlijn.
    url: https://wetten.overheid.nl/BWBR0016990/2004-08-13#Artikel1
  - number: '3'
    text: |-
      Onverminderd de artikelen 4, zesde lid, en 5, vierde lid, van [verordening nr. 2037/2000](32000R2037) is het
      verboden om CFK- of HCFK-houdende koel- en vriesapparatuur voor handelsdoeleinden voorhanden te hebben die
      afkomstig is van particuliere huishoudens of van anderen dan particuliere huishoudens voorzover deze naar aard en
      hoeveelheid vergelijkbaar is met die van particuliere huishoudens.
    url: https://wetten.overheid.nl/BWBR0016990/2004-08-13#Artikel3
  - number: '4'
    text: |-
      1 De producent doet binnen dertien weken nadat de Regeling beheer elektrische en elektronische apparatuur op
      hem van toepassing is geworden, aan Onze Minister door middel van een daartoe door hem vast te stellen formulier
      mededeling over de wijze waarop uitvoering zal worden gegeven aan de in dat formulier genoemde artikelen van die
      regeling, voorzover die artikelen op hem van toepassing zijn.

      2 De mededeling behoeft de instemming van Onze Minister.

      3 De instemming, bedoeld in het tweede lid, geldt voor een daarbij vast te stellen tijdvak van ten hoogste vijf
      jaar.

      4 Onze Minister kan voorschriften of beperkingen verbinden aan de instemming met de mededeling.

      5 Onze Minister kan de voorschriften of beperkingen, bedoeld in het vierde lid, ambtshalve of op een daartoe
      strekkend verzoek wijzigen of intrekken.

      6 De producent doet uiterlijk dertien weken voor het verstrijken van het tijdvak waarvoor de instemming geldt
      opnieuw een mededeling als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0016990/2004-08-13#Artikel4
  - number: '5'
    text: |-
      Een wijziging van de bijlage bij [richtlijn nr. 2002/95](32002L0095) of van bijlage IA bij [richtlijn nr. 2002/96]
      (32002L0096) gaat voor de toepassing van dit besluit gelden met ingang van de dag waarop aan die wijziging
      uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een
      ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0016990/2004-08-13#Artikel5
  - number: '7'
    text: Het Besluit beheer wit- en bruingoed wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0016990/2004-08-13#Artikel7
