---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_bijzondere_vergaring_nummergegevens_telecommunicatie
regulatory_layer: AMVB
publication_date: '2017-06-21'
valid_from: '2017-07-01'
bwb_id: BWBR0013213
url: https://wetten.overheid.nl/BWBR0013213/2017-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 16 mei 2001, nr. DGTP/01/2472/RJD,
    Directoraat-Generaal Telecommunicatie en Post, mede namens Onze Minister van Justitie en Onze Minister van
    Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op de artikelen 3.10, vierde lid, onderdeel a, en 13.4, tweede lid, van de Telecommunicatiewet;

    De Raad van State gehoord (advies van 11 september 2001, nr. W09.01.0232/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 12 december 2001, nr. DGTP/01/5617/
    RJD, Directoraat-Generaal Telecommunicatie en Post, uitgebracht mede namens Onze Minister van Justitie en Onze
    Minister van Binnenlandse Zaken en Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Telecommunicatiewet;][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: 1.b
    text: 'aanbieder: de aanbieder van een openbaar telecommunicatienetwerk of een openbare telecommunicatiedienst;'
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel1
  - number: 1.c
    text: 'bevoegde autoriteit:'
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel1
  - number: 1.c.1°
    text: de officier van justitie, dan wel de door hem in een bepaald geval schriftelijk aangewezen opsporingsambtenaar,
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel1
  - number: 1.c.2°
    text: |-
      het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst, dan wel door hem schriftelijk aangewezen
      functionarissen optredend in het kader van de uitvoering van hun taak,
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel1
  - number: 1.c.3°
    text: |-
      het hoofd van de Militaire Inlichtingen- en Veiligheidsdienst, dan wel door hem schriftelijk aangewezen
      functionarissen optredend in het kader van de uitvoering van hun taak.
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel1
  - number: 1.d
    text: |-
      gebruiker: de natuurlijke of rechtspersoon die met de aanbieder een overeenkomst is aangegaan met betrekking
      tot het gebruik van een openbaar telecommunicatienetwerk of de levering van een openbare telecommunicatiedienst,
      alsmede de natuurlijke of rechtspersoon die daadwerkelijk gebruik maakt van een openbaar telecommunicatienetwerk of
      een openbare telecommunicatiedienst.
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel1
  - number: '2.1'
    text: |-
      De apparatuur waarmee op grond van [artikel 3.22, eerste lid, van de wet][ref1] een gebruik van frequentieruimte
      is toegestaan dat afwijkt van het bepaalde bij of krachtens [hoofdstuk 3 van de wet][ref2] voldoet aan de volgende
      eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009950
        hoofdstuk: '3'
  - number: 2.1.a
    text: |-
      de apparatuur is voorzien van een inrichting die de nummergegevens, bedoeld in
      [artikel 13.4, eerste lid, van de wet][ref1] zodanig selecteert dat het selectieproces niet meer dan een
      plaatselijke, zeer geringe verandering van de functionaliteiten van het desbetreffende netwerk veroorzaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
  - number: 2.1.b
    text: de apparatuur is voorzien van een inrichting waarmee het uitgezonden vermogen kan worden geregeld;
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel2
  - number: 2.1.c
    text: |-
      indien de apparatuur is voorzien van een inrichting die het, al dan niet in combinatie met het selectieproces,
      bedoeld onder a, mogelijk maakt om telecommunicatie af te luisteren of op te nemen, dient deze inrichting
      uitgeschakeld en vergrendeld te zijn;
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel2
  - number: 2.1.d
    text: de apparatuur is geregistreerd bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel2
  - number: '2.2'
    text: |-
      Door of namens de korpschef, Onze Minister van Defensie of Onze Minister van Financiën wordt een plaats aangewezen
      voor de opslag van de apparatuur, bedoeld in het eerste lid, en wordt ervoor zorg gedragen dat deze plaats
      beveiligd is en uitsluitend toegankelijk is voor of onder begeleiding van daartoe geautoriseerd personeel.
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel2
  - number: '3'
    text: |-
      Met de in [artikel 2][ref1] bedoelde apparatuur wordt gelijkgesteld apparatuur die rechtmatig is vervaardigd of
      in de handel is gebracht in een andere lidstaat van de Europese Unie dan wel rechtmatig is vervaardigd in een
      staat die partij is bij de overeenkomst inzake de Europese Economische Ruimte, en die aan tenminste gelijkwaardige
      technische eisen voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0013213#Artikel2
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013213
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Bevoegd tot het gebruik van de apparatuur, bedoeld in [artikel 2][ref1], is de door de korpschef, Onze Minister van
      Defensie of Onze Minister van Financiën aangewezen opsporingsambtenaar die voldoet aan de door Onze Minister van
      Veiligheid en Justitie vastgestelde eisen betreffende kennis van de juridische, operationele en technische aspecten
      van het gebruik van de apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0013213#Artikel2
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013213
        artikel: '2'
        paragraaf: '2'
  - number: '4.2'
    text: 'De opsporingsambtenaar maakt van het gebruik van de apparatuur proces-verbaal op. Het proces-verbaal vermeldt:'
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel4
  - number: 4.2.a
    text: |-
      of gebruik is gemaakt van apparatuur als bedoeld in [artikel 2, eerste lid, onder c][ref1], en of de inrichting die
      het mogelijk maakt om telecommunicatie af te luisteren of op te nemen is uitgeschakeld en vergrendeld,


      [ref1]: https://wetten.overheid.nl/BWBR0013213#Artikel2
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013213
        artikel: '2'
        paragraaf: '2'
  - number: 4.2.b
    text: de data en de tijdstippen waarop en de plaatsen waar de apparatuur is gebruikt, en
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel4
  - number: 4.2.c
    text: de gegevens die door het gebruik van de apparatuur zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel4
  - number: '4.3'
    text: |-
      De opsporingsambtenaar vermeldt de gegevens, bedoeld in het tweede lid, onder b, alsmede de tijdens het gebruik van
      de apparatuur gehanteerde instellingen en vermogens van de apparatuur in een daartoe aan te leggen registratie en
      doet mededeling van deze gegevens aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel4
  - number: '5.1'
    text: |-
      Op het verzoek van de bevoegde autoriteit in een geval als bedoeld in
      [artikel 13.4, tweede lid, jo artikel 13.4, eerste lid, van de wet][ref1], achterhaalt en verstrekt de aanbieder
      het aan de gebruiker verleende nummer.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
  - number: '5.2'
    text: |-
      Het verzoek is schriftelijk en vermeldt gegevens betreffende twee tijdstippen waarop en locaties waar de gebruiker
      kennelijk gebruik heeft gemaakt van telecommunicatie. Indien de bevoegde autoriteit, gelet op de feiten of
      omstandigheden meent dat volstaan kan worden met de vermelding van één tijdstip en één locatie, vermeldt het
      verzoek, onder aanduiding van de feiten of omstandigheden, de gegevens betreffende één tijdstip en één locatie.
      Deze gegevens omvatten:
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel5
  - number: 5.2.a
    text: 'het tijdstip: het jaar, de maand, de dag, het uur en een zo nauwkeurig mogelijke aanduiding van de minuut;'
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel5
  - number: 5.2.b
    text: |-
      de locatie: de gemeente, postcode, straat en het huisnummer, dan wel de coördinaten van de Nederlandse
      Topografische Dienst met twee maal zes cijfers.
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel5
  - number: '5.3'
    text: 'De feiten of omstandigheden, bedoeld in het tweede lid, betreffen:'
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel5
  - number: 5.3.a
    text: de locatie, wanneer het een locatie betreft waar weinig telecommunicatieverkeer plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel5
  - number: 5.3.b
    text: het tijdstip, wanneer het een tijdstip betreft waarop weinig telecommunicatieverkeer plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel5
  - number: 5.3.c
    text: een geval waarin het nummer waarmee de gebruiker van telecommunicatie contact zoekt, bekend is.
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel5
  - number: '6.1'
    text: |-
      De aanbieder achterhaalt het nummer, bedoeld in [artikel 5, eerste lid][ref1], door een bewerking toe te passen
      op de gegevens betreffende het gebruik van het door hem aangeboden openbare telecommunicatienetwerk of de door hem
      aangeboden openbare telecommunicatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0013213#Artikel5
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013213
        artikel: '5'
        paragraaf: '3'
  - number: '6.2'
    text: |-
      Nadat de aanbieder het verzoek als bedoeld in [artikel 5, eerste lid][ref1], heeft ontvangen, verstrekt hij het
      nummer onverwijld aan de bevoegde autoriteit. De verstrekking is schriftelijk en vermeldt het nummer, dan wel
      indien de bewerking meer dan één nummer heeft opgeleverd, de nummers. In geval van spoed vindt de verstrekking
      mondeling plaats, waarna deze schriftelijk wordt bevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0013213#Artikel5
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013213
        artikel: '5'
        paragraaf: '3'
  - number: '6.3'
    text: |-
      De aanbieder verstrekt, in afwijking van het tweede lid, het nummer zo spoedig mogelijk indien het verzoek niet ten
      minste de gegevens bevat, genoemd in [artikel 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013213#Artikel5
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013213
        artikel: '5'
        paragraaf: '3'
  - number: '7'
    text: |-
      Als gegevens, bedoeld in [artikel 13.4, tweede lid, tweede volzin, van de wet][ref1], worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
  - number: 7.a
    text: de tijdstippen waarop telecommunicatie heeft plaatsgevonden,
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel7
  - number: 7.b
    text: de met die tijdstippen en de desbetreffende telecommunicatie corresponderende nummers,
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel7
  - number: 7.c
    text: bij welk basisstation elk van de gegevens onder a en b zijn binnengekomen.
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit bijzondere vergaring nummergegevens telecommunicatie.'
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013213/2017-07-01#Artikel9
