---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: besluit_asbestwegen_milieubeheer
regulatory_layer: AMVB
publication_date: '2008-05-15'
valid_from: '2008-06-01'
bwb_id: BWBR0011619
url: https://wetten.overheid.nl/BWBR0011619/2008-06-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 29 mei 2000, nr.
    MJZ 2000059247, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op artikel 24 van de Wet milieugevaarlijke stoffen;

    De Raad van State gehoord (advies van 3 augustus 2000, nr. W08.0220/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 5
    september 2000, nr. MJZ2000106793, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel1
  - number: 1.1.a
    text: |-
      asbest: vezelachtige silicaten actinoliet (Cas-nummer 77536–66–4), amosiet (Cas-nummer 12172–73–5), anthofylliet
      (Cas-nummer 77536–67–5), crocidoliet (Cas-nummer 12001–28–4), tremoliet (Cas-nummer 77536–68–6) en chrysotiel (Cas-
      nummer 12001–29–5) en materiaal dat een of meer van deze silicaten bevat;
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel1
  - number: 1.1.b
    text: 'serpentijnasbest: chrysotiel en materiaal dat chrysotiel bevat;'
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel1
  - number: 1.1.c
    text: |-
      amfiboolasbest: vezelachtige silicaten actinoliet, amosiet, anthofylliet, crocidoliet en tremoliet en materiaal dat
      een of meer van deze silicaten bevat;
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel1
  - number: 1.1.d
    text: |-
      weg: weg, pad, erfverharding of gedeelte daarvan, alsmede andere grond die bestemd is om door rij- of ander verkeer
      te worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel1
  - number: 1.1.e
    text: 'voorhanden hebben: in eigendom hebben;'
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel1
  - number: 1.1.f
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel1
  - number: '1.2'
    text: Onder weg wordt tevens verstaan stroken van een halve meter aan beide zijden van en direct aansluitend op een weg.
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel1
  - number: '2.1'
    text: Het is verboden een weg die asbest bevat, voorhanden te hebben.
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel2
  - number: '2.2'
    text: |-
      Het eerste lid is niet van toepassing op een weg, waarvan de eigenaar heeft aangetoond dat de concentratie
      serpentijnasbest vermeerderd met tien maal de concentratie amfiboolasbest ten hoogste 100 milligram per kilogram
      is. De bepaling van de serpentijn- en amfiboolasbestconcentratie vindt plaats volgens NEN 5897; bij ministeriële
      regeling worden nadere voorschriften gegeven omtrent de toepassing van NEN 5897.
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel2
  - number: '2.3'
    text: |-
      Het eerste lid is voorts niet van toepassing op een weg, waarvan de eigenaar heeft aangetoond dat het asbest voor
      1 juli 1993 is aangebracht en waarvan het asbest is afgeschermd door een verharding die geen asbest bevat en die
      voldoet aan C.R.O.W.-publicatie 81, uitgave januari 1994. De verharding bestaat uit asfalt, klinkers of beton.
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel2
  - number: '2.4'
    text: |-
      Het eerste lid is eveneens niet van toepassing op een asbestbevattende weg die voldoet aan bij ministeriële
      regeling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel2
  - number: '3.1'
    text: |-
      [Artikel 2, eerste lid][ref1], is tot 1 juli 2001 niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0011619#Artikel2
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011619
        artikel: '2'
        paragraaf: '2'
  - number: 3.1.a
    text: |-
      een weg die is gelegen in de gemeente Harderwijk of binnen een straal van twaalf kilometer rond die gemeente, te
      rekenen vanaf de gemeentegrens;
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel3
  - number: 3.1.b
    text: |-
      een weg waarvoor, overeenkomstig de Saneringsregeling asbestwegen Twente, een aanvraag voor een saneringsmaatregel
      is ingediend vóór 1 oktober 1999.
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister kan in plaats van de datum van 1 juli 2001, genoemd in het eerste lid, ten aanzien van de in dat
      lid bedoelde wegen of een deel van die wegen een andere datum vaststellen indien het nemen van maatregelen aan die
      wegen niet vóór 1 juli 2001 kan zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister kan, zolang aan een asbestbevattende weg als bedoeld in de [artikelen 2, eerste lid][ref1], en
      [3][ref2], geen maatregelen zijn genomen die strekken tot het tegengaan van blootstelling van gebruikers van die
      weg aan asbest, de eigenaar of degene die uit anderen hoofde bevoegd is tot het nemen van die maatregelen, het
      nemen van tijdelijke maatregelen bij of aan die weg opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011619#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011619#Artikel3
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011619
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011619
        artikel: '3'
        paragraaf: '2'
  - number: '5.1'
    text: |-
      Degene die weet of had kunnen weten dat hij een asbestbevattende weg voorhanden heeft, meldt dit terstond aan Onze
      Minister, die de gemelde gegevens registreert ten behoeve van toekomstige werkzaamheden aan die weg.
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel5
  - number: '5.2'
    text: 'Bij de melding worden ten minste de volgende gegevens overgelegd:'
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel5
  - number: 5.2.a
    text: naam, adres en telefoonnummer van de eigenaar van de weg;
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel5
  - number: 5.2.b
    text: de kadastrale gegevens van de weg;
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel5
  - number: 5.2.c
    text: de plaats of plaatsen op de weg, waar het asbest zich bevindt, en
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel5
  - number: 5.2.d
    text: |-
      de maatregelen, bedoeld in [artikel 2, derde lid][ref1], die aan de weg zijn of worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011619#Artikel2
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011619
        artikel: '2'
        paragraaf: '2'
  - number: '5.3'
    text: |-
      Op verzoek van Onze Minister legt de eigenaar van de weg binnen de door Onze Minister te bepalen termijn nadere
      gegevens over.
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel5
  - number: '5.4'
    text: |-
      Het eerste lid is niet van toepassing op een weg als bedoeld in de [artikelen 2, tweede lid][ref1], en
      [3, eerste lid, onderdeel b][ref2]. Het eerste lid is voorts niet van toepassing op een weg waarvoor binnen de
      in de Saneringsregeling overige asbestwegen gestelde termijn overeenkomstig die regeling een aanvraag voor een
      saneringsmaatregel is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0011619#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011619#Artikel3
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011619
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011619
        artikel: '3'
        paragraaf: '2'
  - number: 5a
    text: |-
      Dit besluit berust op [artikel 9.2.2.1 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop vier weken zijn verstreken na de datum van uitgifte van
      het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit asbestwegen milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0011619/2008-06-01#Artikel7
