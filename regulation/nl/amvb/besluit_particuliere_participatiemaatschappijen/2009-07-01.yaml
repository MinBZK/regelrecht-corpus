---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: besluit_particuliere_participatiemaatschappijen
regulatory_layer: AMVB
publication_date: '2009-06-30'
valid_from: '2009-07-01'
bwb_id: BWBR0006526
url: https://wetten.overheid.nl/BWBR0006526/2009-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 24 november 1993, nr. WJA/JZ 93088661;

    Gelet op artikel 2 van de Kaderwet verstrekking financiële middelen EZ;

    De Raad van State gehoord (advies van 15 februari 1994, nr. W10.93 0777);

    Gezien het nader rapport van Onze voornoemde minister van 14 maart 1994, nr. WJA/JZ 94020460;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel1
  - number: 1.a
    text: 'bank: de Nederlandsche Bank N.V.;'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel1
  - number: 1.b
    text: |-
      accountant: een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1.c
    text: 'groep: een economische eenheid, waarin organisatorisch zijn verbonden,'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel1
  - number: 1.c.1°
    text: |-
      een natuurlijke persoon of privaatrechtelijke rechtspersoon, die direct of indirect: - meer dan de helft van het
      geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van of
        - overwegende zeggenschap heeft over een of meer rechtspersonen of vennootschappen, en
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel1
  - number: 1.c.2°
    text: laatstbedoelde rechtspersonen of vennootschappen.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel1
  - number: '2.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt onder een participatie verstaan:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: 2.1.a
    text: |-
      de aandelen in het kapitaal van een vennootschap die de particuliere participatiemaatschappij rechtstreeks van de
      vennootschap uit een en dezelfde emissie heeft verkregen:
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: 2.1.a.1°
    text: tegen volstorting van die aandelen in geld,
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: 2.1.a.2°
    text: |-
      door omzetting van een participatie, als bedoeld in onderdeel *b*, die is geregistreerd als bedoeld in
      [artikel 15][ref1], of een deel daarvan, of


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel15
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '15'
        hoofdstuk: '3'
  - number: 2.1.a.3°
    text: |-
      door omzetting van een met het oog op de verkrijging van die aandelen door de particuliere participatiemaatschappij
      aan de vennootschap, of aan de vennootschap in oprichting, in geld verstrekte lening met een effectieve looptijd
      van niet meer dan drie maanden of een deel van die lening;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: 2.1.b
    text: |-
      een in aandelen converteerbare achtergestelde lening ten laste van een vennootschap die de particuliere
      participatiemaatschappij heeft verkregen:
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: 2.1.b.1°
    text: door aan de vennootschap een lening te verstrekken in geld of
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: 2.1.b.2°
    text: |-
      door omzetting van een door de particuliere participatiemaatschappij aan de vennootschap, of de vennootschap in
      oprichting, in geld verstrekte lening met een effectieve looptijd van niet meer dan drie maanden of een deel van
      die lening.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: '2.2'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder een gemelde participatie verstaan een participatie in
      de zin van artikel 1, eerste lid, onder *g*, van de Garantieregeling particuliere participatiemaatschappijen 1981,
      ten aanzien waarvan de melding niet is doorgehaald, als bedoeld in artikel 13, vierde lid, van die regeling.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: '2.3'
    text: |-
      In het eerste lid van dit artikel en in de [hoofdstukken 3][ref1] en [4][ref2] wordt onder een vennootschap
      verstaan een vennootschap die voldoet aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0006526#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006526
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006526
        hoofdstuk: '4'
  - number: 2.3.a
    text: zij is een naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: 2.3.b
    text: zij is in Nederland gevestigd en hoofdzakelijk in Nederland werkzaam;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: 2.3.c
    text: |-
      zij heeft niet meer dan 100 werknemers in dienst en maakt niet deel uit van een groep waarbij in totaal meer dan
      200 werknemers in dienst zijn;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: 2.3.d
    text: 'haar activiteiten liggen niet geheel of hoofdzakelijk op het gebied van:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: 2.3.d.1°
    text: het bank- en verzekeringswezen;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: 2.3.d.2°
    text: het beleggingswezen;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: 2.3.d.3°
    text: het op enigerlei wijze financieren van een of meer ondernemers;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: 2.3.d.4°
    text: het verwerven, vervreemden, beheren of exploiteren van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: 2.3.d.5°
    text: |-
      het middellijk of onmiddellijk deelnemen in vennootschappen waarvan de activiteiten geheel of hoofdzakelijk liggen
      op de gebieden, genoemd onder 1° tot en met 4°.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: '2.4'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder een achtergestelde lening verstaan een niet door
      enige vorm van zekerheid gedekte geldlening, waarop de debiteur krachtens een daartoe strekkende bepaling in de
      akte van geldlening in geval van ontbinding, een akkoord na verlening van surséance van betaling of een akkoord
      in faillissement van de debiteur, rente en aflossing - voor zover de termijnen daarvan niet reeds verschenen waren
      voor het tijdstip van de ontbinding, de indiening van het verzoek om verlening van surséance van betaling of de
      indiening van de faillissementsaanvrage - eerst verplicht is te betalen nadat alle andere op dat moment bestaande
      schulden van de debiteur, met uitzondering van die welke voortvloeien uit leningen waaraan een bepaling van gelijke
      aard als voornoemde bepaling is verbonden, zijn voldaan, terwijl ingevolge de vorenbedoelde akte van geldlening de
      crediteur afstand heeft gedaan van alle rechten tot verrekening van de rente en aflossing.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel2
  - number: '3.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder de verkrijgingsprijs van een participatie verstaan
      het bedrag in geld, waarvoor de particuliere participatiemaatschappij de participatie heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel3
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid wordt onder de verkrijgingsprijs van een participatie die bestaat uit aandelen
      die zijn verkregen door omzetting van een converteerbare achtergestelde lening, of een deel daarvan, verstaan
      het bedrag van de uitstaande lening dat is omgezet in aandelen, vermeerderd onderscheidenlijk verminderd met het
      bedrag in geld dat wegens de omzetting bijbetaald is door onderscheidenlijk terugbetaald is aan de particuliere
      participatiemaatschappij.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel3
  - number: '4'
    text: |-
      Een naamloze vennootschap, besloten vennootschap met beperkte aansprakelijkheid, vennootschap onder firma of
      commanditaire vennootschap wordt op aanvraag door de bank als particuliere participatiemaatschappij erkend, indien
      zij voldoet aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel4
  - number: 4.a
    text: |-
      zij heeft blijkens de notariële akte waarbij haar statuten zijn vastgesteld of blijkens de in een notariële akte
      vastgelegde overeenkomst waarbij zij is aangegaan uitsluitend tot doel het verstrekken van risicodragend kapitaal
      aan het bedrijfsleven;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel4
  - number: 4.b
    text: zij is gevestigd in Nederland;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel4
  - number: 4.c
    text: |-
      haar gestorte aandelenkapitaal, respectievelijk het kapitaal dat de vennoten blijkens de bovenbedoelde akte
      verplicht zijn gezamenlijk in te brengen, bedraagt ten minste € 453 500;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel4
  - number: 4.d
    text: de aandelen waarin haar kapitaal is verdeeld zijn op naam gesteld;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel4
  - number: 4.e
    text: |-
      indien van een of meer van de aandelen waarin haar kapitaal is verdeeld met medewerking van de vennootschap
      certificaten zijn uitgegeven, is dit geschied door een van de vennootschap onafhankelijk administratiekantoor;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel4
  - number: 4.f
    text: 'zij heeft geen aandeelhouders respectievelijk vennoten, die:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel4
  - number: 4.f.1°
    text: een rechtspersoon zijn die krachtens publiekrecht is ingesteld, of
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel4
  - number: 4.f.2°
    text: |-
      een rechtspersoon zijn waarover rechtspersonen die krachtens publiekrecht zijn ingesteld uit hoofde van
      onmiddellijk of middellijk aandeelhouderschap, lidmaatschap, bestuurslidmaatschap of soortgelijke kwaliteit
      overwegende zeggenschap uitoefenen, tenzij de aandelen van de rechtspersoon of de certificaten daarvan zijn
      toegelaten tot de officiële notering aan de Amsterdamse effectenbeurs, of
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel4
  - number: 4.f.3°
    text: |-
      een rechtspersoon zijn waarvan de bestuurders uitsluitend door rechtspersonen die krachtens publiekrecht
      zijn ingesteld onmiddellijk of middellijk worden benoemd en waarvan het vermogen bij liquidatie uitsluitend
      ter beschikking komt van rechtspersonen die krachtens publiekrecht zijn ingesteld, tenzij de aandelen van
      de rechtspersoon of de certificaten daarvan zijn toegelaten tot de officiële notering aan de Amsterdamse
      effectenbeurs;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel4
  - number: 4.g
    text: |-
      indien zij slechts één beherend vennoot heeft, is deze vennoot een rechtspersoon, die voldoet aan het bepaalde
      onder *a* en *b*.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel4
  - number: '5.1'
    text: |-
      Een aanvraag om erkenning als particuliere participatiemaatschappij wordt ingediend, vergezeld van de volgende
      bescheiden:
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel5
  - number: 5.1.a
    text: 'indien het betreft een naamloze vennootschap of een besloten vennootschap met beperkte aansprakelijkheid:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel5
  - number: 5.1.a.1°
    text: de statuten van de vennootschap;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel5
  - number: 5.1.a.2°
    text: |-
      een opgave van de samenstelling van het bestuur en voor zover aanwezig van de raad van commissarissen van de
      vennootschap;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel5
  - number: 5.1.a.3°
    text: een opgave van de aandeelhouders van de vennootschap;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel5
  - number: 5.1.a.4°
    text: |-
      een opgave van het aantal aandelen in het kapitaal van de vennootschap dat ieder van de aandeelhouders houdt en van
      het op ieder aandeel gestorte bedrag;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel5
  - number: 5.1.a.5°
    text: |-
      een globale raming van de omvang en het aantal van de activiteiten voor de eerste drie jaar, vergezeld van een
      kostenbegroting;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel5
  - number: 5.1.b
    text: 'indien het betreft een vennootschap onder firma of een commanditaire vennootschap:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel5
  - number: 5.1.b.1°
    text: de overeenkomst waarbij de vennootschap is aangegaan;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel5
  - number: 5.1.b.2°
    text: een opgave van de vennoten en de niet-commanditaire vennoten;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel5
  - number: 5.1.b.3°
    text: een opgave van de verplichtingen tot inbreng van kapitaal door de vennoten;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel5
  - number: 5.1.b.4°
    text: |-
      een globale raming van de omvang en het aantal van de activiteiten voor de eerste drie jaar, vergezeld van een
      kostenbegroting.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel5
  - number: '5.2'
    text: Aanvragen worden niet ingediend per telefax.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel5
  - number: '6'
    text: |-
      Door de bank aangewezen personen kunnen, voor zover dat redelijkerwijs noodzakelijk is voor een goede uitvoering
      van dit besluit, de aanvrager verzoeken:
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel6
  - number: 6.a
    text: inzage te verlenen van zakelijke gegevens en bescheiden,
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel6
  - number: 6.b
    text: hen kopieën te laten maken van de onder *a* bedoelde gegevens en bescheiden en
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel6
  - number: 6.c
    text: medewerking te verlenen aan het verstrekken van gegevens door anderen.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel6
  - number: '7'
    text: De bank geeft op de aanvraag een beschikking binnen acht weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel7
  - number: '8.1'
    text: |-
      De bank beslist in ieder geval afwijzend op een aanvraag, indien op grond van de deskundigheid, de voornemens of de
      antecedenten van een of meer personen die het beleid van de aanvrager bepalen of medebepalen de vrees bestaat, dat
      het goed functioneren van de aanvrager als particuliere participatiemaatschappij onvoldoende gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel8
  - number: '8.2'
    text: 'De bank kan afwijzend beslissen op een aanvraag:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel8
  - number: 8.2.a
    text: |-
      indien niet is voldaan aan een verzoek als bedoeld in [artikel 6][ref1] of aan een verzoek als bedoeld in artikel 6
      van de Kaderwet verstrekking financiële middelen EZ;


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel6
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '6'
        hoofdstuk: '2'
  - number: 8.2.b
    text: |-
      indien de aanvrager in het kader van de aanvraag gegevens heeft verstrekt, waarvan hij wist of behoorde te weten
      dat deze onjuist of onvolledig waren en deze verstrekking tot een onjuiste beschikking op de aanvraag zou hebben
      geleid.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel8
  - number: '9'
    text: |-
      Een erkenning als particuliere participatiemaatschappij wordt bekend gemaakt in de *Staatscourant*, onder
      vermelding van de naam en de statutaire zetel van de particuliere participatiemaatschappij.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel9
  - number: '10'
    text: |-
      Aan een erkenning als particuliere participatiemaatschappij zijn de in de [artikelen 11][ref1], [12][ref2] en
      [13][ref3] opgenomen verplichtingen verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006526#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0006526#Artikel13
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '11'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006526
        artikel: '12'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0006526
        artikel: '13'
        hoofdstuk: '2'
  - number: '11.1'
    text: |-
      De betrokkene blijft voldoen aan de in [artikel 4][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel4
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '4'
        hoofdstuk: '2'
  - number: '11.2'
    text: 'De betrokkene voldoet voorts aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel11
  - number: 11.2.a
    text: |-
      het rentedragend vreemd vermogen zal niet tweemaal achtereen aan het einde van een boekjaar meer bedragen dan het
      hoogste van de twee volgende bedragen:
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel11
  - number: 11.2.a.1°
    text: |-
      het gestorte aandelenkapitaal, of, indien de betrokkene geen rechtspersoon is, het door vennoten verplicht in te
      brengen kapitaal;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel11
  - number: 11.2.a.2°
    text: |-
      de helft van de de totale verkrijgingsprijs van de participaties van betrokkene, die worden geregistreerd als
      bedoeld in [artikel 15][ref1] of die gemelde participaties van betrokkene zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel15
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '15'
        hoofdstuk: '3'
  - number: 11.2.b
    text: |-
      de som van de verkrijgingsprijzen van de uit aandelen bestaande participaties van betrokkene, die worden
      geregistreerd als bedoeld in [artikel 15][ref1] of die gemelde participaties van betrokkene vormen, zal aan het
      einde van het derde boekjaar na erkenning van de participatiemaatschappij niet minder dan 40 procent, aan het
      einde van het vierde boekjaar niet minder dan 50 procent en aan het einde van het vijfde boekjaar niet minder dan
      60 procent van de totale activa van de particuliere participatiemaatschappij bedragen, waarbij de vaste financiële
      activa tegen kostprijs zijn gewaardeerd. Met ingang van het zesde boekjaar zal dit percentage niet tweemaal
      achtereen aan het einde van het boekjaar minder dan 60 procent bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel15
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '15'
        hoofdstuk: '3'
  - number: '11.3'
    text: |-
      Indien als gevolg van een incidentele grote opbrengst uit de vervreemding van een participatie dan wel van een
      andere financiering niet voldaan kan worden aan het tweede lid, onder *b*, kan de bank een tijdelijke ontheffing
      verlenen. Een aanvraag om een ontheffing wordt ingediend uiterlijk zes weken voor het einde van het desbetreffende
      boekjaar. De bank geeft een beschikking voor het einde van dat boekjaar.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel11
  - number: '11.4'
    text: |-
      Voor de toepassing van het tweede lid, aanhef en onder *b*, wordt bij de bepaling van de boekjaren de periode
      waarin de betrokkene als particuliere participatiemaatschappij was erkend op basis van de Garantieregeling
      particuliere participatiemaatschappijen 1981 mede betrokken.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel11
  - number: '12.1'
    text: 'Binnen zes maanden na afsluiting van ieder boekjaar zendt de betrokkene aan de bank:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel12
  - number: 12.1.a
    text: |-
      de op dat boekjaar betrekking hebbende, door de algemene vergadering van aandeelhouders of de vennoten goedgekeurde
      of vastgestelde jaarrekening, die is opgemaakt met inachtneming van [titel 9 van Boek 2 Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 12.1.b
    text: het verslag en de verklaring van een accountant, die op de jaarrekening betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel12
  - number: '12.2'
    text: |-
      Met de in het eerste lid bedoelde bescheiden zendt de betrokkene door een accountant gecontroleerde en
      goedgekeurde, overeenkomstig het bij regeling van Onze Minister vastgestelde model opgestelde overzicht
      mee van alle aandelen in het kapitaal van enige rechtspersonen en van alle overige door de particuliere
      participatiemaatschappij aan natuurlijke of rechtspersonen verstrekte financieringen, die de particuliere
      participatiemaatschappij aan het einde van het laatstverlopen boekjaar had.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel12
  - number: '13.1'
    text: |-
      De betrokkene stelt de bank binnen acht weken nadat de desbetreffende gebeurtenis heeft plaatsgevonden,
      schriftelijk, onder medezending van alle relevante gegevens en bescheiden, op de hoogte van:
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
  - number: 13.1.a
    text: 'indien het een naamloze vennootschap of een besloten vennootschap met beperkte aansprakelijkheid betreft:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
  - number: 13.1.a.1°
    text: een wijziging van haar statuten,
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
  - number: 13.1.a.2°
    text: de overdracht van aandelen in haar kapitaal,
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
  - number: 13.1.a.3°
    text: de plaatsing van aandelen in haar kapitaal en
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
  - number: 13.1.a.4°
    text: een wijziging in de samenstelling van haar bestuur of haar raad van commissarissen;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
  - number: 13.1.b
    text: 'indien het een vennootschap onder firma of een commanditaire vennootschap betreft:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
  - number: 13.1.b.1°
    text: de wijziging of de beëindiging van de overeenkomst waarbij de vennootschap is aangegaan,
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
  - number: 13.1.b.2°
    text: een wijziging in de bevoegdheid van een vennoot om de vennootschap te vertegenwoordigen en
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
  - number: 13.1.b.3°
    text: een wijziging in de aansprakelijkheid van een vennoot voor de schulden van de vennootschap;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
  - number: 13.1.c
    text: |-
      enige omstandigheid ten gevolge waarvan zij niet meer voldoet aan [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel4
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '4'
        hoofdstuk: '2'
  - number: 13.1.d
    text: |-
      de gehele of gedeeltelijke vervreemding van een participatie die tot aan de vervreemding werd geregistreerd als
      bedoeld in [artikel 15][ref1] of een gemelde participatie was;


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel15
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '15'
        hoofdstuk: '3'
  - number: 13.1.e
    text: |-
      de faillietverklaring van, de verlening van voorlopige of definitieve surséance van betaling aan, en een besluit
      tot ontbinding van een vennootschap, waarin de betrokkene een of meer participaties heeft, die worden geregistreerd
      als bedoeld in [artikel 15][ref1] of die een gemelde participatie zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel15
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '15'
        hoofdstuk: '3'
  - number: '13.2'
    text: |-
      De betrokkene voldoet aan verzoeken van door de bank aangewezen personen om, voor zover dat redelijkerwijs
      noodzakelijk is voor een goede uitvoering van dit besluit:
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
  - number: 13.2.a
    text: inzage te verlenen van zakelijke gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
  - number: 13.2.b
    text: hen kopieën te laten maken van de onder *a* bedoelde gegevens en bescheiden en
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
  - number: 13.2.c
    text: medewerking te verlenen aan het verstrekken van gegevens door anderen.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel13
  - number: '14.1'
    text: 'De bank kan de erkenning als particuliere participatiemaatschappij intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel14
  - number: 14.1.a
    text: |-
      de betrokkene niet heeft voldaan aan de in de [artikelen 11][ref1], [12][ref2] en [13][ref3] opgenomen
      verplichtingen;


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006526#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0006526#Artikel13
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '11'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006526
        artikel: '12'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0006526
        artikel: '13'
        hoofdstuk: '2'
  - number: 14.1.b
    text: |-
      de bank op grond van de deskundigheid, de voornemens of de antecedenten van een of meer personen die het beleid van
      de betrokkene bepalen of medebepalen of op grond van het door de betrokkene gevoerde beleid dan wel op grond van de
      omstandigheden die geleid hebben tot een afwijzing van een aanvraag als bedoeld in [artikel 27][ref1] van oordeel
      is, dat het goed functioneren van de betrokkene als particuliere participatiemaatschappij niet meer voldoende
      gewaarborgd is;


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel27
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 14.1.c
    text: |-
      de beschikking, inhoudende de erkenning als particuliere participatiemaatschappij, ten gevolge van aan de
      betrokkene te wijten onjuistheid of onvolledigheid van verstrekte gegevens anders luidde dan het geval zou zijn
      geweest, indien de gegevens juist en volledig zouden zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel14
  - number: '14.2'
    text: |-
      Bij de beschikking tot intrekking kan de bank bepalen dat de aanspraken op subsidies als bedoeld in
      [artikel 20][ref1] betreffende die participaties, die de particuliere participatiemaatschappij heeft verkregen
      nadat de intrekkingsgrond is ontstaan, in een door hem te bepalen omvang, al dan niet met terugwerkende kracht,
      vervallen. Indien de intrekking gegrond is op het eerste lid, onder *c*, bepaalt de bank steeds dat alle in de
      eerste volzin bedoelde aanspraken vervallen met terugwerkende kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel20
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '14.3'
    text: |-
      De intrekking wordt, zodra zij onherroepelijk is geworden, bekend gemaakt in de *Staatscourant*, onder vermelding
      van de naam en de statutaire zetel van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel14
  - number: '15.1'
    text: |-
      Een erkende particuliere participatiemaatschappij kan op aanvraag registratie van een participatie verkrijgen van
      de bank.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel15
  - number: '15.2'
    text: |-
      Een aanvraag om registratie wordt binnen dertien weken na de verkrijging van de participatie ingediend door de
      erkende particuliere participatiemaatschappij die de participatie heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel15
  - number: '15.3'
    text: 'De aanvraag gaat vergezeld van een verklaring van de particuliere participatiemaatschappij, welke inhoudt:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel15
  - number: 15.3.a
    text: |-
      de naam en een omschrijving van de activiteiten van de vennootschap waarin de particuliere participatiemaatschappij
      de participatie heeft verkregen;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel15
  - number: 15.3.b
    text: |-
      dat deze vennootschap op het moment van de aanvraag voldoet aan de eisen, bedoeld in [artikel 2, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel2
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '2'
        hoofdstuk: '1'
  - number: 15.3.c
    text: |-
      de precieze aard van de participatie, de datum van verkrijging, de verkrijgingsprijs van de participatie en de
      voorwaarden waaronder deze is verkregen;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel15
  - number: 15.3.d
    text: dat de vennootschap blijvende rendementsperspectieven heeft.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel15
  - number: '15.4'
    text: 'De aanvraag gaat voorts vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel15
  - number: 15.4.a
    text: |-
      de laatste door de algemene vergadering van aandeelhouders van de vennootschap vastgestelde of goedgekeurde
      jaarrekening;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel15
  - number: 15.4.b
    text: |-
      een verklaring van een accountant, welke inhoudt dat hij de verklaringen, bedoeld in het derde lid, onder *a, b* en
      *c*, heeft gecontroleerd en juist heeft bevonden.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel15
  - number: 15.4.c
    text: |-
      het bewijs van betaling aan de bank van een registratiepremie ten bedrage van 1 procent van de verkrijgingsprijs
      van de participatie waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel15
  - number: '15.5'
    text: Aanvragen worden niet ingediend per telefax.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel15
  - number: '16'
    text: |-
      Onze Minister stelt bij ministeriële regeling met betrekking tot ieder kalenderjaar het bedrag vast, inhoudende
      het totaal van de verkrijgingsprijzen van participaties waarvoor in dat jaar op aanvraag een beschikking tot
      registratie kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel16
  - number: '17.1'
    text: 'De bank beslist afwijzend op een aanvraag om registratie, indien:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel17
  - number: 17.1.a
    text: |-
      de aanvrager geen erkende participatiemaatschappij was in de zin van dit besluit ten tijde van de indiening van
      de aanvraag;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel17
  - number: 17.1.b
    text: |-
      de aanvrager geen erkende participatiemaatschappij was in de zin van dit besluit of de Garantieregeling
      particuliere participatiemaatschappijen 1981 ten tijde van de verkrijging van de participatie.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel17
  - number: 17.1.c
    text: |-
      de aanvrager de registratiepremie, bedoeld in [artikel 15, vierde lid, onder c][ref1], niet of niet tijdig heeft
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel15
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '15'
        hoofdstuk: '3'
  - number: '17.2'
    text: 'De bank beslist afwijzend op een aanvraag om registratie, voor zover:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel17
  - number: 17.2.a
    text: |-
      door registratie het krachtens [artikel 16][ref1] vastgestelde bedrag zou worden overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel16
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '16'
        hoofdstuk: '3'
  - number: 17.2.b
    text: |-
      de participatie waarop de aanvraag betrekking heeft ten tijde van de verkrijging bestond uit een converteerbare
      achtergestelde lening en de aanvrager niet voorafgaand aan of tegelijk met de verkrijging van de betreffende
      participatie een of meer andere uit aandelen bestaande participaties in dezelfde vennootschap heeft verkregen, die
      ten tijde van de verkrijging van de eerst bedoelde participatie aan de volgende vereisten voldeden:
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel17
  - number: 17.2.b.1°
    text: zij vormen tezamen ten minste ééntwintigste deel van het geplaatste aandelenkapitaal van de vennootschap;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel17
  - number: 17.2.b.2°
    text: zij worden door de bank geregistreerd of zij zijn een of meer gemelde participaties;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel17
  - number: 17.2.c
    text: |-
      het totale bedrag van de verkrijgingsprijs van de participatie en van al de overige participaties, die eerder
      of tegelijk met de verkrijging zijn verkregen door enige particuliere participatiemaatschappij in dezelfde
      vennootschap en die op het tijdstip van registratie worden geregistreerd of een gemelde participatie zijn, meer dan
      € 1 140 000 bedraagt;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel17
  - number: 17.2.d
    text: |-
      het totale bedrag van de verkrijgingsprijs van de aandelen en andere financieringen die de aanvrager in de
      vennootschap houdt door de verkrijging van die participatie hoger is geworden dan 20 procent van:
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel17
  - number: 17.2.d.1°
    text: |-
      het gestorte kapitaal van de aanvrager, indien de participatie is verkregen voor het einde van het derde volle
      boekjaar, verlopen sedert de erkenning van de aanvrager als particuliere participatiemaatschappij, of
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel17
  - number: 17.2.d.2°
    text: |-
      het totale bedrag van de verkrijgingsprijs van alle aandelen en andere financieringen, met inbegrip van de
      desbetreffende participatie, van de aanvrager, indien de participatie verkregen is na het einde van het derde volle
      boekjaar, verlopen sedert de erkenning van de aanvrager als particuliere participatiemaatschappij.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel17
  - number: '17.3'
    text: |-
      Voor de toepassing van het tweede lid, aanhef en onder *d*, wordt voor de bepaling van de boekjaren de periode
      waarin de aanvrager een in de zin van de Garantieregeling particuliere participatiemaatschappijen 1981 erkende
      particuliere participatiemaatschappij was, mede betrokken.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel17
  - number: '18.1'
    text: |-
      De betrokkene voldoet jaarlijks voor het eind van de maand waarin de participatie is verkregen, en voor het eerst
      in het jaar volgend op dat waarin de aanvraag tot registratie is ingediend, aan de bank een registratiepremie ten
      bedrage van 1 procent van de verkrijgingsprijs van de participatie.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel18
  - number: '18.2'
    text: |-
      De betrokkene verricht de betaling op de door de bank te bepalen wijze en vergezeld van bescheiden waaruit blijkt
      op welke participatie de betaling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel18
  - number: '18.3'
    text: |-
      De bank kan de beschikking tot registratie intrekken, indien de betrokkene niet heeft voldaan aan de verplichtingen
      welke ingevolge het eerste lid voor hem gelden.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel18
  - number: '18.4'
    text: |-
      Voor de berekening van de in het eerste lid bedoelde premie worden de bedragen, die vóór het in het eerste lid
      bedoelde tijdstip zijn afgelost op participaties die bestaan uit leningen niet tot de verkrijgingsprijs gerekend.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel18
  - number: '19'
    text: |-
      Een beschikking tot registratie van een participatie vervalt, zodra en voorzover de betrokkene de participatie
      vervreemdt.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel19
  - number: '20.1'
    text: |-
      De bank verstrekt op aanvraag een subsidie aan een erkende particuliere participatiemaatschappij, indien deze op
      een voor 1 januari 1996 verkregen participatie een verlies lijdt bij:
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel20
  - number: 20.1.a
    text: gehele of gedeeltelijke vervreemding van die participatie;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel20
  - number: 20.1.b
    text: ontbinding van de vennootschap waarin de aanvrager die participatie heeft;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel20
  - number: 20.1.c
    text: |-
      indien het een participatie betreft die bestaat uit een converteerbare achtergestelde lening, een in kracht van
      gewijsde gegane homologatie van een akkoord na de faillietverklaring of na de verlening van surséance van betaling
      van de vennootschap waarin de verzoeker die participatie heeft.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel20
  - number: '20.2'
    text: |-
      Geen subsidie wordt verstrekt, indien ten tijde van de gebeurtenis als bedoeld in het eerste lid, onder *a, b* of
      *c*, de participatie niet wordt geregistreerd door de bank.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel20
  - number: '20.3'
    text: 'Geen subsidie wordt verstrekt, indien het verlies is geleden:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel20
  - number: 20.3.a
    text: |-
      bij gehele of gedeeltelijke vervreemding van de participatie aan een of meer personen, die op het tijdstip van de
      gebeurtenis als bedoeld in het eerste lid, onder *a, b* of *c*, of op enig tijdstip in de daaraan voorafgaande twee
      jaar aandeelhouder waren van of in dienst waren van de aanvrager of betrokken waren bij het beleid of beheer van
      die aanvrager;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel20
  - number: 20.3.b
    text: na inkoop van of terugbetaling door de vennootschap op aandelen die de aanvrager in de vennootschap houdt.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel20
  - number: '20.4'
    text: |-
      Geen subsidie wordt verstrekt, indien ten tijde van de gebeurtenis als bedoeld in het eerste lid, onder *a, b*
      of *c*, dan wel faillietverklaring van de vennootschap, minder dan een jaar is verlopen sedert de particuliere
      participatiemaatschappij de participatie heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel20
  - number: '20.5'
    text: In dit hoofdstuk wordt mede begrepen
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel20
  - number: 20.5.a
    text: |-
      onder een aandeelhouder: een vennoot en de natuurlijke persoon of rechtspersoon die uit hoofde van een onmiddellijk
      of middellijk aandeelhouderschap, lidmaatschap, bestuurslidmaatschap of soortgelijke kwaliteit overwegende
      zeggenschap over een aandeelhouder of een vennoot uitoefent, en
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel20
  - number: 20.5.b
    text: |-
      onder een bestuurder: een niet-commanditaire vennoot en de natuurlijke persoon of rechtspersoon die uit hoofde van
      een onmiddellijk of middellijk aandeelhouderschap, lidmaatschap, bestuurslidmaatschap of soortgelijke kwaliteit
      overwegende zeggenschap over een bestuurder of een niet-commanditaire vennoot uitoefent.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel20
  - number: '21'
    text: 'De bank beslist in ieder geval afwijzend op een aanvraag om subsidie indien:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel21
  - number: 21.a
    text: |-
      de aanvrager tezamen met zijn bestuurders en die aandeelhouders, die overwegende zeggenschap over hem uitoefenen,
      door of op enig tijdstip na de verkrijging van de participatie onmiddellijk of middellijk overwegende zeggenschap
      over tenminste de helft van het geplaatste kapitaal van de vennootschap waarin de participatie is verkregen heeft
      uitgeoefend of ten minste de helft van het geplaatste kapitaal van die vennootschap heeft gehouden;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel21
  - number: 21.b
    text: |-
      de aandeelhouders en de bestuurders van de aanvrager ten tijde van of op enige tijdstip na de verkrijging van
      de participatie onmiddellijk of middellijk, anders dan door middel van een of meer andere erkende particuliere
      participatiemaatschappijen, tezamen overwegende zeggenschap over ten minste 10 procent van het geplaatste kapitaal
      van de vennootschap waarin de participatie is verkregen hebben uitgeoefend of ten minste 10 procent van het
      geplaatste kapitaal van die vennootschap hebben gehouden;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel21
  - number: 21.c
    text: |-
      een bestuurder van de aanvrager of een aandeelhouder die ten minste 10 procent van het geplaatste aandelenkapitaal
      van de aanvrager houdt, of, indien de aanvrager geen rechtspersoon is, ingevolge de overeenkomst waarbij de
      vennootschap is aangegaan in de vennootschap ten minste 10 procent van het kapitaal moet inbrengen, ten tijde
      van of op enig tijdstip na de verkrijging van de participatie alleen of tezamen met anderen een bedrijf heeft
      uitgeoefend dat gelijk of verwant is aan het door de vennootschap waarin de participatie is verkregen uitgeoefende
      bedrijf en bij de uitoefening van dat bedrijf een vaste afnemersrelatie met de desbetreffende vennootschap heeft
      gehad;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel21
  - number: 21.d
    text: |-
      in de periode van twaalf maanden voorafgaand aan de verkrijging van de participatie aan de vennootschap ten
      behoeve van derden, niet zijnde aandeelhouders, middelen zijn onttrokken onder welke naam of in welke vorm dan
      ook, ten bedrage van meer dan 10 procent van het eigen vermogen van de vennootschap, daaronder de participatie niet
      begrepen, dan wel een verplichting tot zodanige onttrekking is aangegaan anders dan in verband met een redelijk te
      achten bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel21
  - number: 21.e
    text: |-
      in de periode van vier jaar na de verkrijging van de participatie aan de vennootschap ten behoeve van derden, niet
      zijnde aandeelhouders, middelen zijn onttrokken anders dan in verband met een redelijk te achten bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel21
  - number: 21.f
    text: |-
      indien in de periode van twaalf maanden voorafgaand aan de verkrijging van de participatie aan de vennootschap
      ten behoeve van een of meer aandeelhouders middelen zijn onttrokken, onder welke naam of in welke vorm dan ook
      en met inbegrip van de dividenduitkeringen, ten bedrage van meer dan 10 procent van het eigen vermogen van de
      vennootschap, daaronder de participatie niet begrepen, dan wel een verplichting tot zodanige onttrekking is
      aangegaan;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel21
  - number: 21.g
    text: |-
      indien in de periode van vier jaar na de verkrijging van de participatie aan de vennootschap ten behoeve van een of
      meer aandeelhouders middelen zijn onttrokken anders dan door middel van redelijk te achten dividenduitkeringen;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel21
  - number: 21.h
    text: |-
      indien de aanvrager of de aandeelhouders of de bestuurders van de aanvrager na de verkrijging van de participatie
      middellijk dan wel onmiddellijk middelen, onder welke naam of in welke vorm dan ook, aan de vennootschap heeft
      onttrokken anders dan in verband met een redelijk te achten bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel21
  - number: 21.i
    text: ter zake van het betrokken deel van de participatie reeds een subsidie is verstrekt.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel21
  - number: '22.1'
    text: |-
      De subsidiegrondslag van een participatie die bestaat uit aandelen wordt gevormd door de verkrijgingsprijs of,
      indien het verlies slechts op een deel van de participatie is geleden, het hiermee overeenkomende deel van de
      verkrijgingsprijs, verminderd met:
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel22
  - number: 22.1.a
    text: |-
      indien de participatie geheel of gedeeltelijk is vervreemd, de prijs waarvoor die vervreemding plaatsvond of,
      indien de betreffende vennootschap ontbonden is, de liquidatie-uitkering en
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel22
  - number: 22.1.b
    text: |-
      de door de bank vastgestelde waarde van de voordelen die de aanvrager en de personen, die op het tijdstip van
      de gebeurtenis als bedoeld in [artikel 20, eerste lid, onder a, b of c][ref1], of op enig tijdstip in de daaraan
      voorafgaande twee jaar, aandeelhouder waren van de aanvrager, in dienst waren van de aanvrager of betrokken waren
      bij het beleid of beheer van de aanvrager, door het verkrijgen of het houden van de participatie dan wel door een
      gebeurtenis als bedoeld in [artikel 20, eerste lid, onder a, b of c][ref2], hebben verkregen of zullen verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0006526#Artikel20
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006526
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '22.2'
    text: |-
      De subsidiegrondslag van een participatie die bestaat uit een converteerbare achtergestelde lening wordt gevormd
      door de verkrijgingsprijs of, indien het verlies slechts op een deel van de participatie is geleden, het hiermee
      overeenkomende deel van de verkrijgingsprijs, verminderd met:
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel22
  - number: 22.2.a
    text: |-
      indien de participatie geheel of gedeeltelijk is vervreemd, de prijs waarvoor die vervreemding plaatsvond of de
      op de participatie verrichte uitkering wegens een van de in [artikel 20, eerste lid, onder b of c][ref1] genoemde
      gebeurtenissen,


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel20
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 22.2.b
    text: |-
      het bedrag of, indien het verlies slechts op een deel van de participatie is geleden, het hiermee overeenkomende
      deel van het bedrag, dat op de participatie is afgelost in de periode tot aan de gebeurtenis, bedoeld in
      [artikel 20, eerste lid, onder a, b of c][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel20
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 22.2.c
    text: |-
      de door de bank vastgestelde waarde van de voordelen die de aanvrager en de personen, die op het tijdstip van
      de gebeurtenis als bedoeld in [artikel 20, eerste lid, onder a, b of c][ref1], of op enig tijdstip in de daaraan
      voorafgaande twee jaar aandeelhouder waren van de aanvrager, in dienst waren van de aanvrager, of betrokken waren
      bij het beleid of beheer van de aanvrager, door het verkrijgen of het houden van de participatie dan wel door een
      gebeurtenis als bedoeld in [artikel 20, eerste lid, onder a, b of c][ref2], hebben verkregen of zullen verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0006526#Artikel20
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006526
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '22.3'
    text: |-
      Indien de verkrijgingsprijs van een participatie die bestaat uit een converteerbare achtergestelde lening
      hoger is dan de nominale waarde van de hoofdsom, wordt bij de toepassing van het tweede lid in plaats van de
      verkrijgingsprijs de nominale waarde van de hoofdsom in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel22
  - number: '22.4'
    text: |-
      Indien de aanvrager in de desbetreffende vennootschap een aantal gelijksoortige geregistreerde participaties heeft
      en slechts op een deel daarvan verlies lijdt, wordt het verlies geacht te zijn geleden op die geregistreerde of
      gemelde participatie van de betreffende soort, welke de aanvrager het eerst heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel22
  - number: '22.5'
    text: |-
      Indien de aanvrager naast een of meer geregistreerde participaties tevens een of meer andere financieringen
      van dezelfde soort in de betreffende vennootschap houdt en slechts op een deel van die participaties en
      financieringen verlies lijdt, wordt het verlies, onverminderd het vierde lid, geacht te zijn geleden op dat deel
      van de geregistreerde participaties, dat overeenkomt met de verhouding tussen de totale verkrijgingsprijs van
      de geregistreerde participaties en het totale bedrag van de verkrijgingsprijs van alle geregistreerde en gemelde
      participaties en andere financieringen van dezelfde soort.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel22
  - number: '23.1'
    text: De subsidie bedraagt 50 procent van de subsidiegrondslag.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel23
  - number: '23.2'
    text: |-
      Dit percentage wordt verminderd met 10 procentpunten voor ieder vol jaar, verlopen na het einde van het achtste
      jaar na de datum waarop de aanvrager de participatie heeft verkregen, indien de participatie is verkregen in 1992
      en na het einde van het zevende, zesde of vijfde jaar, indien de participatie is verkregen in onderscheidenlijk
      1993, 1994 en 1995. Indien de participatie bestaat uit aandelen die zijn verkregen door omzetting van een
      converteerbare achtergestelde lening, wordt de datum waarop de betrokken achtergestelde lening is verkregen
      aangemerkt als de datum waarop de participatie is verkregen.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel23
  - number: '23.3'
    text: |-
      Indien de participatie uit aandelen bestaat, wordt het in het eerste lid genoemde percentage bovendien verminderd
      met het aantal procentpunten dat voortvloeit uit de formule , indien de uitkomst van deze formule positief is. In
      deze formule betekent: D: het totale dividend dat op deze participatie in geld is uitgekeerd in de periode tussen
      de verkrijging van de participatie door de aanvrager en de gebeurtenis als bedoeld in artikel 20, eerste lid, onder
      *a, b* of *c*; F: de verkrijgingsprijs van de participatie; Tm: het aantal volledige maanden, verlopen tussen de
      verkrijging van de participatie door de aanvrager en de gebeurtenis, bedoeld in artikel 20, eerste lid, onder *a,
      b* of *c*.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel23
  - number: '24.1'
    text: |-
      Een voorschot op een subsidie kan op aanvraag van de erkende participatiemaatschappij eerst worden verstrekt nadat
      de vennootschap waarin de participatie wordt gehouden, in staat van faillissement is gesteld.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel24
  - number: '24.2'
    text: Het voorschot is niet groter dan de redelijkerwijs te verwachten subsidie.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel24
  - number: '25'
    text: De bank geeft op de aanvraag een beschikking binnen acht weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel25
  - number: '26.1'
    text: |-
      De bank kan een beschikking, inhoudende de verlening van een voorschot, intrekken, indien niet binnen drie jaar na
      de datum van de beschikking een beschikking is gegeven, inhoudende de verstrekking van subsidie ter zake van het
      desbetreffende verlies.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel26
  - number: '26.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid, zijn ter beschikking gestelde financiële middelen terstond
      opeisbaar.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel26
  - number: '27.1'
    text: |-
      Een aanvraag om subsidie wordt binnen zes maanden na de gebeurtenis, bedoeld in
      [artikel 20, eerste lid, onder a, b of c][ref1], ingediend bij de bank, met gebruikmaking van een formulier,
      waarvan het model bij regeling van Onze Minister wordt vastgesteld. De aanvraag gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel20
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 27.1.a
    text: alle bewijsstukken betreffende de oorzaak en de omvang van het verlies;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel27
  - number: 27.1.b
    text: |-
      een verklaring van de aanvrager omtrent de waarde van de in
      [artikel 20, eerste lid, onder b en tweede lid, onder c][ref1], bedoelde voordelen;


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel20
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 27.1.c
    text: |-
      de namen van de personen die op het tijdstip van de gebeurtenis, bedoeld in
      [artikel 20 eerste lid, onder a, b of c][ref1], of op enig tijdstip in de daaraan voorafgaande twee jaar
      aandeelhouder waren van de aanvrager, in dienst waren van de aanvrager dan wel betrokken waren bij het beheer van
      de aanvrager;


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel20
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 27.1.d
    text: |-
      een verklaring van een accountant omtrent de juistheid en volledigheid van de in de aanvraag vermelde gegevens en
      bij de aanvraag meegezonden bewijsstukken;
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel27
  - number: 27.1.e
    text: |-
      de bescheiden, bedoeld in [artikel 12, eerste lid][ref1], betreffende de twee laatst verlopen boekjaren, tenzij de
      bank deze bescheiden reeds heeft ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel12
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '12'
        hoofdstuk: '2'
  - number: 27.1.f
    text: |-
      de door de algemene vergadering van aandeelhouders van de vennootschap of de vennoten vastgestelde of goedgekeurde
      jaarrekeningen betreffende de sedert de verkrijging van de participatie verlopen boekjaren.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel27
  - number: '27.2'
    text: Aanvragen worden niet ingediend per telefax.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel27
  - number: '28'
    text: De bank geeft op de aanvraag een beschikking binnen acht weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel28
  - number: '29'
    text: 'Op een aanvraag kan in ieder geval afwijzend worden beslist:'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel29
  - number: 29.a
    text: |-
      indien niet is voldaan aan een verzoek als bedoeld in [artikel 6][ref1], of aan een verzoek als bedoeld in artikel
      6 van de Kaderwet verstrekking financiële middelen EZ;


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel6
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '6'
        hoofdstuk: '2'
  - number: 29.b
    text: |-
      indien de aanvrager in het kader van de aanvraag gegevens heeft verstrekt waarvan hij wist of behoorde te weten dat
      deze onjuist of onvolledig waren, en de verstrekking van deze gegevens tot een onjuiste beschikking op de aanvraag
      zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel29
  - number: '30.1'
    text: |-
      Een beschikking, inhoudende de verstrekking van een subsidie kan worden ingetrokken of gewijzigd bij een
      beschikking als bedoeld in [artikel 14, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel14
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '14'
        hoofdstuk: '2'
  - number: '30.2'
    text: |-
      Indien toepassing is gegeven aan het eerste lid, zijn ter beschikking gestelde financiële middelen terstond
      opeisbaar voor zover zij het bedrag waarop de betrokkene alsdan recht heeft te boven gaan.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel30
  - number: '31.1'
    text: |-
      Aanvragen tot erkenning als particuliere participatiemaatschappij als bedoeld in Hoofdstuk 2 van de
      Garantieregeling particuliere participatiemaatschappijen 1981, die zijn ingediend voor de inwerkingtreding van dit
      besluit, en waarop nog niet is besloten, worden in aanmerking genomen als aanvragen, bedoeld in [artikel 4][ref1]
      van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel4
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '4'
        hoofdstuk: '2'
  - number: '31.2'
    text: |-
      Meldingen als bedoeld in artikel 13 van de Garantieregeling particuliere participatiemaatschappijen 1981 die de
      toezichthouder ten tijde van de inwerkingtreding van dit besluit nog niet schriftelijk heeft bevestigd, worden in
      aanmerking genomen als aanvragen om registratie als bedoeld in [artikel 15][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006526#Artikel15
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006526
        artikel: '15'
        hoofdstuk: '3'
  - number: '32'
    text: |-
      De particuliere participatiemaatschappij, die bij de inwerkingtreding van dit besluit op basis van de
      Garantieregeling particuliere participatiemaatschappijen 1981 als zodanig was erkend, wordt aangemerkt als een met
      inachtneming van dit besluit door de bank erkende particuliere participatiemaatschappij.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel32
  - number: '33'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel33
  - number: '34'
    text: 'Dit besluit wordt aangehaald als: Besluit particuliere participatiemaatschappijen.'
    url: https://wetten.overheid.nl/BWBR0006526/2009-07-01#Artikel34
