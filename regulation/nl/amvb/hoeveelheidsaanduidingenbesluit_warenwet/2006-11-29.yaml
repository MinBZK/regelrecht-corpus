  - number: '26'
    text: |-
      1 Indien een produkt zich gezamenlijk met een of meer andere produkten, waarvoor [de artikelen 20][ref1]-[25][ref2]
      al dan niet gelden, bevindt in een verpakking, die bestemd of geschikt is om met de inhoud aan een verbruiker te
      koop te worden aangeboden en te worden afgeleverd en waarin die produkten zijn aangebracht op zodanige wijze, dat
      de hoeveelheid van de in die gezamenlijke verpakking aanwezige produkten niet kan worden gewijzigd zonder dat die
      gezamenlijke verpakking is geopend of een aantoonbare wijziging in die verpakking is aangebracht, moeten voor elk
      van die produkten, waarvoor de [artikelen 20][ref3]-[25][ref4] gelden, de hoeveelheidsaanduidingen worden gebezigd
      die ingevolge het bepaalde in de [artikelen 20][ref5]-[23][ref6] voor het betrokken produkt, indien het deel zou
      uitmaken van een voorverpakking, moeten of mogen worden gebezigd.

      2 De in het eerste lid bedoelde hoeveelheidsaanduidingen moeten voorkomen op de buitenzijde van de in dat lid
      bedoelde verpakking of op een daarop of daaraan gehecht etiket dan wel, indien de verpakking ter plaatse helder
      doorzichtig is, tegen de binnenzijde daarvan.

      3 Ten aanzien van de in het eerste lid bedoelde hoeveelheidsaanduidingen zijn [artikel 13][ref7] en
      [artikel 25, tweede en vijfde lid][ref8], van overeenkomstige toepassing.

      4 De in het eerste lid bedoelde hoeveeheidsaanduidingen moeten zodanig zijn aangebracht, dat het voor de koper
      duidelijk is op welk produkt zij betrekking hebben.

      5 Ten aanzien van een produkt, dat zich bevindt in een verpakking als bedoeld in het eerste lid, geldt het tweede
      lid niet, indien:

      a. dat produkt zich op zichzelf bevindt in een verpakking, die is voorzien van de in het eerste lid bedoelde
      hoeveelheidsaanduidingen,

      b. de hoeveelheidsaanduidingen in overeenstemming zijn met het in [artikel 25, eerste tot en met vijfde lid][ref9],
      ten aanzien van een voorverpakking bepaalde, en

      c. de hoeveelheidsaanduidingen van buitenaf goed leesbaar en goed zichtbaar zijn.


