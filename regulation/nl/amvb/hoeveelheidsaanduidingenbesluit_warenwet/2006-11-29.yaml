  - number: '14'
    text: >-
      Voor een produkt mag op de verpakking daarvan een aanduiding in woord of beeld, die met het EEG-teken kan worden
      verward, in samenhang met de aanduiding van de hoeveelheid van dat produkt niet worden gebezigd.
    url: https://wetten.overheid.nl/BWBR0003310/2006-11-29#Artikel14
  - number: '15'
    text: >-
      Het EEG-teken in samenhang met een aanduiding van de hoeveelheid van een in serie voorverpakt produkt mag niet
      worden gebezigd op een serievoorverpakking, waarvan de daarvan deel uitmakende verpakking is geopend of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003310/2006-11-29#Artikel15
  - number: '16'
    text: |-
      Indien een e-voorverpakking of meer e-voorverpakkingen waarvan eenzelfde produkt deel uitmaakt en die ook als
      afzonderlijke verkoopeenheden aan verbruikers plegen te worden verkocht, zich al dan niet met andere produkten
      bevinden in een verpakking, die bestemd of geschikt is om met de inhoud aan een verbruiker te koop te worden
      aangeboden en te worden afgeleverd, mag in afwijking van [artikel 2][ref1] voor eerstbedoeld produkt het EEG-teken
      in samenhang met een aanduiding van de totale hoeveelheid van dat produkt worden gebezigd, voor zover

      a. die aanduiding aangeeft:

      1°. in een geval van één e-voorverpakking: de nominale hoeveelheid daarvan en het EEG-teken,

      2°. in een geval van meer e-voorverpakkingen: het aantal of de aantallen van de e-voorverpakkingen, die zijn
      voorzien van een aanduiding van eenzelfde, onderscheidenlijk een ten opzichte van elkaar verschillende, nominale
      hoeveelheid, telkens gevolgd zowel door de nominale hoeveelheid van een der tot het betrokken aantal behorende e-
      voorverpakkingen als door het EEG-teken,

      b. de nominale hoeveelheid of nominale hoeveelheden, bedoeld onder a, 1° en 2°, zijn
      uitgedrukt en weergegeven overeenkomstig het ten aanzien van e-voorverpakkingen in
      [artikel 9, derde, vierde, zesde en zevende lid, onder a][ref2], bepaalde,

      c. de in de aanduiding voorkomende cijfers, waarin de nominale hoeveelheid of hoeveelheden zijn uitgedrukt,
      beantwoorden aan het ten aanzien van e-voorverpakkingen in [artikel 9, vijfde en zevende lid, onder b][ref3],
      bepaalde,

      d. het EEG-teken ten minste een hoogte van 3 mm heeft,

      e. de aanduiding onuitwisbaar en goed leesbaar is en goed zichtbaar is aangebracht en

      f. de onder a, 1° of 2° bedoelde aanduiding zodanig op of aan de gezamenlijke verpakking is aangebracht, dat het
      voor de koper duidelijk is op welk produkt deze betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003310#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003310#Artikel9
    url: https://wetten.overheid.nl/BWBR0003310/2006-11-29#Artikel16
