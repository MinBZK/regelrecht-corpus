        bwb_id: BWBR0001969
        artikel: '14'
  - number: '18'
    text: |-
      [De artikelen 2][ref1]-[16][ref2] gelden niet ten aanzien van een serievoorverpakking, waarvan deel uitmaakt een in
      serie voorverpakt produkt, met betrekking waartoe op grond van enige andere wettelijke regeling dan de Warenwet is
      voorzien in regelen ter zake van het in samenhang met een hoeveelheidsaanduiding uitsluitend mogen bezigen van het
      EEG-teken.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003310#Artikel16
