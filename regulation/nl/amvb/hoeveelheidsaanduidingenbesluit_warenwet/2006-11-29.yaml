  - number: '8'
    text: |-
      1 De voorlopige of de definitieve erkenning van een bedrijfscontrolesysteem of de verklaring, bedoeld in
      [artikel 5, vijfde lid, onder b][ref1], kan door het hoofd van de bevoegde dienst, door wie die erkenning is
      verleend of die verklaring is afgegeven, worden ingetrokken, indien:

      a. de betrokken vervaardiger of importeur de medewerking, bedoeld in [artikel 6][ref2], niet verleent;

      b. bij een onderzoek van een partij e-voorverpakkingen door keuringsambtenaren blijkt, dat het toegepaste
      bedrijfscontrolesysteem of de waarborgen bedoeld in [artikel 5, vijfde lid, onder a][ref3], onvoldoende zekerheid
      bieden voor de naleving van [artikel 3, onder a of b][ref4];

      c. blijkt, dat de betrokkene e-voorverpakkingen in de handel heeft gebracht ten aanzien waarvan niet is voldaan aan
      [de artikelen 3, onder a, b of c][ref5] of [5, eerste of vierde lid][ref6].

      2 De intrekking van de voorlopige of definitieve erkenning of van de verklaring, bedoeld in
      [artikel 5, vijfde lid, onder b][ref7], vindt niet plaats dan nadat het hoofd van de bevoegde dienst van zijn
      voornemen daartoe bij aangetekende brief onder opgave van redenen heeft kennis gegeven aan de betrokkene en deze
      in de gelegenheid is gesteld binnen dertig dagen na dagtekening van die brief zijn bezwaren daartegen, gemotiveerd,
      schriftelijk bij eerstbedoeld hoofd in te dienen.

      3 Het hoofd van de bevoegde dienst geeft binnen dertig dagen na dagtekening van het bezwaarschrift, bedoeld in het
      tweede lid, daarop zijn beschikking.

      4 Het besluit tot intrekking van de voorlopige of definitieve erkenning van een bedrijfscontrolesysteem of van de
      verklaring bedoeld in [artikel 5, vijfde lid, onder b][ref8], wordt de betrokkene bij aangetekende brief en onder
      opgave van redenen medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel5
