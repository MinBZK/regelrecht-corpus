        paragraaf: '3'
  - number: '23'
    text: |-
      1 Indien een voorverpakt produkt deel uitmaakt van een voorverpakking in de vorm van een aantal verpakte eenheden,
      die ook als afzonderlijke verkoopeenheden aan verbruikers plegen te worden verkocht en die elk een zelfde
      hoeveelheid van dat produkt bevatten, moet:

      a. de aanduiding van de hoeveelheid van dat voorverpakte produkt aangeven het totale aantal van vorenbedoelde
      verpakte eenheden, gevolgd door de overeenkomstig [artikel 20][ref1] uitgedrukte en weergegeven hoeveelheid van het
      produkt, die één verpakte eenheid bevat;

      b. voor zover het betreft een voorverpakt produkt als bedoeld in [artikel 21, eerste lid][ref2], tevens een
      aanduiding van het uitlekgewicht van het vaste hoofdbestanddeel van het betrokken produkt in één verpakte eenheid
      worden gebezigd overeenkomstig het bepaalde in [artikel 21, eerste lid][ref3];

      c. voor zover het betreft een voorverpakt produkt, dat zich in elk van die verpakte eenheden bevindt in de vorm
      van verpakte eenheden als bedoeld in [artikel 22, eerste lid][ref4], tevens een aanduiding van het aantal verpakte
      eenheden van dat produkt, die één verpakte eenheid als in de aanhef bedoeld bevat, worden gebezigd.

      2 Het eerste lid, onder *c,* geldt niet ten aanzien van suikerwerk, waarvan de hoeveelheid in elke verpakte eenheid
      die afzonderlijk niet als een verkoopeenheid aan verbruikers pleegt te worden verkocht, ten hoogste 15 gram is.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel20
