  - number: 1a
    text: >-
      Onze Minister van Economische Zaken wijst een rechtspersoon aan die tot taak heeft metrologische onderzoeken te
      verrichten ten behoeve van de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003310/2006-11-29#Artikel1a
  - number: '2'
    text: |-
      1 Het EEG-teken in samenhang met een aanduiding van de hoeveelheid van een verpakt produkt mag uitsluitend worden
      gebezigd voor een serievoorverpakking, waarvan dat produkt deel uitmaakt en

      a. die bij toepassing van [artikel 4][ref1] wordt geacht aan [artikel 3, onder ][ref2], te voldoen.

      b. waarvan de fout in minus niet groter is dan ingevolge [artikel 3, onder ][ref3], is toegelaten,

      c. ten aanzien waarvan de in [artikel 5][ref4] bepaalde maatregelen zijn genomen en

      d. ten aanzien waarvan is voldaan aan de [artikelen 6][ref5] en [9][ref6]-[13][ref7].

      2 Een e-voorverpakking, waarvan het land van herkomst een andere Lid-Staat van de Europese Economische
      Gemeenschap dan wel een van de overige Staten die partij zijn bij de Overeenkomst betreffende de Europese
      Economische Ruimte is, wordt aangemerkt als een voorverpakking, die voldoet aan de [artikelen 3, onder ][ref8], en
      [artikel 9, tweede lid, onder ][ref9], en ten aanzien waarvan de maatregelen als bedoeld in [artikel 5][ref10] zijn
      genomen. Ten aanzien van een zodanige e-voorverpakking gelden de[ artikelen 4, eerste lid][ref11], en [6][ref12]
      niet.

      3 Het eerste lid, onder *a* en *c*, en het in het eerste lid, onder *d*, ten aanzien van de [artikelen 6][ref13]
      en [9, tweede lid, onder ][ref14], bepaalde gelden niet ten aanzien van een e-voorverpakking, die ten verkoop
      voorhanden wordt gehouden of wordt afgeleverd door degene, aan wie die voorverpakking, voorzien van het EEG-teken,
      is afgeleverd en die niet is de vervaardiger of de importeur daarvan of de gemachtigde van laatstgenoemde.


