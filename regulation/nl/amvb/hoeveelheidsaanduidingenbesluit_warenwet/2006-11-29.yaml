  - number: '32'
    text: |-
      De[ artikelen 20][ref1]-[31][ref2] zijn niet van toepassing ten aanzien van voorverpakte produkten:

      a. ten aanzien waarvan kan worden aangetoond dat zij voor 23 december 1982 in de desbetreffende verpakking zijn
      aangebracht, of

      b. die kennelijk voor uitvoer bestemd zijn, voor zover zij niet aanwezig zijn op markten, in winkels of in andere
      voor het publiek toegankelijke plaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003310#Artikel31
