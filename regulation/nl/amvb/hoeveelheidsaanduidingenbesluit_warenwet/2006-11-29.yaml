        artikel: '9'
        paragraaf: '2'
  - number: '13'
    text: |-
      De opschriften of tekens, bedoeld in de [artikelen 9][ref1], [11][ref2] en [12][ref3], moeten onuitwisbaar en goed
      leesbaar zijn en goed zichtbaar zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003310#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0003310#Artikel12
