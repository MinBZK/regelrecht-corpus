  - number: '5'
    text: |-
      1 Ten aanzien van e-voorverpakkingen, die in Nederland zijn vervaardigd of vanuit een derde land zijn ingevoerd
      moeten de nodige maatregelen, ertoe strekkende dat de werkelijke inhoud van die voorverpakkingen voldoet aan het
      bepaalde in [artikel 3][ref1], door de vervaardiger onderscheidenlijk de importeur daarvan zijn genomen.

      2 De in het eerste lid bedoelde maatregelen zijn:

      a. meting van de werkelijke inhoud van elke e-voorverpakking, tijdens het afvullen daarvan, door middel van
      een voor het doel geschikt, meetinstrument dat op grond van de [Metrologiewet][ref2] met goed gevolg een
      overeenstemmingsbeoordeling heeft ondergaan of

      b. toepassing van een bedrijfscontrole - door middel van feitelijk onderzoek van steekproeven en met gebruikmaking
      van een voor dat doel geschikt meetinstrument dat, voorzover daarvoor ingevolge de [Metrologiewet][ref3] een
      overeenstemmingsbeoordeling openstaat aan de bij die overeenstemmingsbeoordeling geldende eisen voldoet - volgens
      een systeem, dat voor de betrokken vervaardiger of importeur met betrekking tot het desbetreffende produkt en de
      desbetreffende e-voorverpakking voorlopig of definitief is erkend door het hoofd van de bevoegde dienst.

      3 De in het eerste lid bedoelde maatregelen moeten in Nederland zijn uitgevoerd.

      4 Ten aanzien van e-voorverpakkingen als in het eerste lid bedoeld dient de vervaardiger of de importeur daarvan
      in Nederland een administratie betreffende de toepassing van het voor hem voorlopig of definitief erkende
      bedrijfscontrolesysteem als bedoeld in het tweede lid, onder *b,* te voeren en de tot die administratie behorende
      bescheiden gedurende een jaar, te rekenen vanaf de datum van hun totstandkoming, te bewaren.

      5 Het tweede, het derde en het vierde lid gelden niet ten aanzien van in Nederland vanuit een derde land ingevoerde
      e-voorverpakkingen, met betrekking waartoe:

      a. de importeur daarvan aan het hoofd van de bevoegde dienst naar het oordeel van laatstgenoemde, gehoord de
      metrologische instantie, met bescheiden genoegzaam heeft aangetoond, dat hij beschikt over de nodige waarborgen,
      dat de werkelijke inhoud van vorenbedoelde e-voorverpakkingen voldoet aan het bepaalde in [artikel 3][ref4], en

      b. het hoofd van de bevoegde dienst daarvan een schriftelijke verklaring aan de betrokken importeur heeft
      afgegeven.

      6 De bescheiden, bedoeld in het vijfde lid, onder *a,* moeten zijn gericht aan: "Het hoofd van de bevoegde dienst"
      en moeten worden ingediend bij de metrologische instantie; uiterlijk veertien dagen na ontvangst van die bescheiden
      deelt de metrologische instantie schriftelijk aan de betrokkene mee, door het hoofd van welke bevoegde dienst een
      beslissing ter zake van de afgifte van de verklaring, bedoeld in het vijfde lid, onder *b,* zal worden genomen.

      7 De metrologische instantie is bevoegd het in het zevende lid bedoelde onderzoek te weigeren, dan wel te
      beëindigen, indien de betrokkene niet aan zijn financiële verplichtingen met betrekking tot dat onderzoek jegens de
      metrologische instantie voldoet.


