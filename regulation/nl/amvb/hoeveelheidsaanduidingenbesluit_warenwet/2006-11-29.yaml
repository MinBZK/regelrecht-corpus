  - number: '27'
    text: |-
      1 [De artikelen 20 tot en met 23][ref1] zijn niet van toepassing ten aanzien van:

      a. voorverpakte eet- en drinkwaren die naar hun aard aanzienlijk aan volume of gewicht verliezen en

      - hetzij per stuk worden verkocht,
      - hetzij in aanwezigheid van de koper worden gewogen;

      b. voorverpakte eet- en drinkwaren waarvan de netto-hoeveelheid in totaal

      - hetzij minder dan 25 gram bedraagt in het geval van suikerwerk;
      - hetzij minder dan 5 gram of 5 milliliter bedraagt in het geval van andere eet- of drinkwaren dan kruiden of
      specerijen; en

      c. melk of melkprodukten die zijn verpakt in EEG-tapmaatflessen.

      2 Indien voor een voorverpakt produkt als bedoeld in het eerste lid, onder *a* of *b,* op de voorverpakking
      waarvan dat produkt deel uitmaakt of op een op of aan de betrokken voorverpakking gehecht etiket een aanduiding
      van de hoeveelheid van dat produkt of een aanduiding, die de indruk kan wekken de hoeveelheid van dat produkt
      aan te geven, is gebezigd, gelden de[ artikelen 20][ref2], [21][ref3], [22][ref4] en [23][ref5] voor dat produkt
      onverkort.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel20
