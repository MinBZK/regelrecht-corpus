  - number: '7'
    text: |-
      1 Een bedrijfscontrolesysteem als in [artikel 5, tweede lid, onder b,][ref1] bedoeld wordt voor een vervaardiger
      of een importeur als in [artikel 5, eerste lid][ref2], bedoeld, indien hij daartoe een schriftelijke aanvraag,
      inhoudende alle op zijn systeem betrekking hebbende gegevens, in tweevoud heeft gedaan, met betrekking tot een
      bepaald produkt en een bepaalde serievoorverpakking:

      a. voorlopig erkend, indien op grond van een onderzoek van de tot de aanvraag behorende bescheiden naar het
      voorlopig oordeel van het hoofd van de bevoegde dienst redelijkerwijze kan worden aangenomen, dat bij toepassing
      van dat systeem ten aanzien van de desbetreffende serievoorverpakkingen kan worden voldaan aan [artikel 3][ref3];

      b. definitief erkend, indien voor de betrokkene een voorlopige erkenning als onder a bedoeld geldt en op grond van
      een door de keuringsambtenaren ingesteld onderzoek van de bescheiden, bedoeld onder a, en naar de toepassing van
      het voorlopig erkende bedrijfscontrolesysteem naar het oordeel van het hoofd van de bevoegde dienst, door wie het
      betrokken bedrijfscontrolesysteem voorlopig is erkend, redelijkerwijs kan worden aangenomen, dat bij toepassing
      van dat bedrijfscontrolesysteem ten aanzien van de desbetreffende e-voorverpakkingen kan worden voldaan aan
      [artikel 3][ref4].

      2 De aanvraag, bedoeld in het eerste lid, moet zijn gericht aan: "Het hoofd van de bevoegde dienst" en moet
      worden ingediend bij de metrologische instantie; uiterlijk veertien dagen na ontvangst van de aanvraag deelt
      de metrologische instantie schriftelijk aan de betrokkene mede, door het hoofd van welke bevoegde dienst een
      beslissing op de aanvraag zal worden genomen.

      3 Alvorens het hoofd van de bevoegde dienst over een voorlopige of definitieve erkenning van een
      bedrijfscontrolesysteem beslist, wordt de metrologische instantie gehoord.

      4 Het hoofd van de bevoegde dienst deelt zijn besluit tot verlening of tot weigering van een voorlopige of
      definitieve erkenning van een bedrijfscontrolesysteem schriftelijk mede aan de betrokkene.

      5 Met ingang van de dagtekening van een besluit tot verlening of tot weigering van een definitieve erkenning van
      een bedrijfscontrolesysteem met betrekking tot een bepaald produkt en een bepaalde e-voorverpakking vervalt de
      voorlopige erkenning van dat systeem met betrekking tot dat produkt en die e-voorverpakking voor de betrokkene
      van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003310#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003310#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003310#Artikel3
