preamble:
  text: >-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volksgezondheid en Milieuhygiëne van 22 oktober 1979, DG Vgz/VA, no. 147461,
    van Onze Minister van Landbouw en Visserij en van de Staatssecretaris van Economische Zaken, Th. M. Hazekamp;


    Overwegende, dat regelen moeten worden gesteld ter uitvoering van de richtlijn van de Raad van de Europese
    Gemeenschappen van 19 december 1974 betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake
    het voorverpakken naar volume van bepaalde vloeistoffen in voorverpakkingen met bepaalde inhoud, no. 75/106/
    EEG (Pb. E.G. 1975, L 42), zoals deze richtlijn laatstelijk is gewijzigd bij de richtlijn van die Raad van 23
    november 1979, no. 79/1005/EEG (Pb. E.G. L 308), en ter uitvoering van de richtlijn van die Raad van 20 januari
    1976 betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake het voorverpakken naar gewicht
    of volume van bepaalde produkten in voorverpakkingen, no. 76/211/EEG (Pb. E.G. L 46), zoals deze richtlijn
    is gewijzigd bij de richtlijn van de Commissie van de Europese Gemeenschappen van 28 september 1978 houdende
    aanpassing aan de vooruitgang van de techniek van de richtlijnen 75/106/EEG en 76/211/EEG van de Raad in de sector
    van de voorverpakkingen, no. 78/891/EEG (Pb. E.G. L 311);


    Gelet op de artikelen 14, 14a en 16a van de Warenwet (Stb. 1935, 793);


    Gezien het advies van de Adviescommissie Warenwet van 18 juli 1979, nr. 12955/415, en het advies van de Commissie,
    bedoeld in artikel 17, zevende lid, van de Warenwet, door de Sociaal-Economische Raad ingesteld op grond van
    artikel 43 van de Wet op de Bedrijfsorganisatie (Stb. 1950, K 22), van 10 juli 1979;


    De Raad van State gehoord (advies van 16 januari 1980, no. 19);


    Gezien het nader rapport van Onze voornoemde Ministers en van de voornoemde Staatssecretaris van 28 maart 1980, DG
    Vgz/VA, no. 65187;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003310/2006-11-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      *EEG-teken:* de kleine letter e, zoals weergegeven in bijlage I van dit besluit;

      *produkt:* een waar of enig ander voor de handel bestemd of in de handel gebracht artikel, dat een roerende
      lichamelijke zaak is;

      *vloeibaar produkt:*

      a. een produkt dat bij een temperatuur van 20°C en bij atmosferische druk vloeibaar of dikvloeibaar is,

      b. een produkt dat bij een temperatuur van 20°C en bij atmosferische druk bestaat uit een vloeibaar of dikvloeibaar
      bestanddeel en een of meer daarvan duidelijk te onderscheiden andere bestanddelen en waarbij het volume van het
      vloeibare bestanddeel ten minste de helft van het volume van het totale produkt is;

      *vast produkt:* een produkt dat niet een vloeibaar produkt is;

      *in serie voorverpakt produkt:* een produkt, dat zich bevindt in een verpakking, waarin het - alvorens in die
      verpakking in de handel te worden of te zijn gebracht - is aangebracht:

      a. in een hoeveelheid, die met het oog op de verkoop van dat produkt in constante uniforme hoeveelheden is
      afgestemd op een in volume of in massa uitgedrukte en vooraf gekozen waarde, en

      b. op zodanige wijze, dat de hoeveelheid van dat produkt niet kan worden gewijzigd zonder dat die verpakking is
      geopend of een aantoonbare wijziging in die verpakking is aangebracht;

      *serievoorverpakking:* de zelfstandigheid, bestaande uit een in serie voorverpakt produkt en zijn verpakking;

      *e-voorverpakking:* een serievoorverpakking, waarop het EEG-teken in samenhang met een aanduiding van de
      hoeveelheid van een produkt, dat van die serievoorverpakking deel uitmaakt, wordt gebezigd;

      *vervaardiger van serievoorverpakkingen:* degene, die in de uitoefening van een bedrijf door het afvullen of doen
      afvullen van verpakkingen serievoorverpakkingen vervaardigt en in de handel brengt of beoogt te brengen;

      *vuller van serievoorverpakkingen:* degene, die in de uitoefening van een bedrijf, in opdracht van een vervaardiger
      van serievoorverpakkingen, verpakkingen afvult met een bepaald produkt naar een vooraf gekozen waarde;

      *importeur van serievoorverpakkingen:* degene, die in de uitoefening van een bedrijf serievoorverpakkingen, nadat
      zij in Nederland zijn ingevoerd, in de handel brengt of beoogt te brengen;

      *EEG-gebied:* het gebied, waarop het Verdrag tot oprichting van de Europese Economische Gemeenschap van toepassing
      is;

      EER-gebied: de gebieden waarop het Verdrag tot oprichting van de Europese Economische Gemeenschap en het Verdrag
      tot oprichting van de Europese Gemeenschap voor Kolen en Staal van toepassing zijn, onder de in die verdragen
      neergelegde voorwaarden en voorts de grondgebieden van de Republiek Finland, met inachtneming van het tweede
      lid van artikel 126 van de Overeenkomst betreffende de Europese Economische Ruimte, de Republiek IJsland, het
      Koninkrijk Noorwegen, de Republiek Oostenrijk en het Koninkrijk Zweden;

      derde land: een land buiten het EEG-gebied en het EER-gebied;

      *nominale hoeveelheid van een serievoorverpakking:* de hoeveelheid van een in serie voorverpakt produkt, die een
      serievoorverpakking blijkens een met betrekking tot die voorverpakking gebezigde hoeveelheidsaanduiding wordt
      geacht te bevatten;

      *werkelijke inhoud van een serievoorverpakking:* de werkelijke hoeveelheid van een in serie voorverpakt produkt,
      aanwezig in een serievoorverpakking en - voor zover de nominale hoeveelheid van die serievoorverpakking in een
      meeteenheid van volume is uitgedrukt - bepaald bij de temperatuur waarbij het produkt ten verkoop voorhanden pleegt
      te worden gehouden, indien het betreft een in diepgevroren of bevroren toestand verkerend produkt, dan wel bepaald
      bij een temperatuur van 20°C, indien het betreft een in een andere toestand verkerend produkt;

      *fout in minus van een serievoorverpakking:* de hoeveelheid die de werkelijke inhoud van een serievoorverpakking
      kleiner is dan de nominale hoeveelheid van die voorverpakking;

      *EEG-tapmaatfles:* een tapmaatfles als bedoeld in artikel 1 van [richtlijn 75/107/EEG](31975L0107) van de Raad van
      de Europese Gemeenschappen van 19 december 1974 betreffende de onderlinge aanpassing van de wetgevingen der Lid-
      Staten inzake flessen gebruikt als tapmaat (PbEG L 42) die is voorzien van het EEG-teken, bedoeld in artikel 2 van
      die richtlijn;

      *voorverpakt produkt:* een produkt, dat zich bevindt in een verpakking, bestemd of geschikt om daarin dat produkt
      aan een eindverbruiker of aan instellingen af te leveren en waarin dat produkt - alvorens in die verpakking in
      de handel te worden of te zijn gebracht - is aangebracht op zodanige wijze dat de in die verpakking aanwezige
      hoeveelheid van dat produkt niet kan worden gewijzigd zonder dat die verpakking is geopend of een aantoonbare
      wijziging in die verpakking is aangebracht;

      *instellingen:* restaurants, ziekenhuizen, kantines en andere soortgelijke instellingen;

      *voorverpakking:* de zelfstandigheid, bestaande uit een voorverpakt produkt en zijn verpakking;

      *opgietvloeistof:* een al dan niet bevroren of diepgevroren vloeistof, voor zover deze slechts van ondergeschikt
      belang is ten opzichte van de essentiële bestanddelen van de betrokken waar en derhalve niet doorslaggevend is voor
      de aankoop;

      *keuringsambtenaren:* de ambtenaren, belast met de opsporing van overtredingen van de voorschriften, gesteld bij of
      krachtens de Warenwet (*Stb.* 1935, 793);

      *het hoofd van de bevoegde dienst:* de directeur van de regionale Rijkskeuringsdienst van Waren of van de Algemene
      Inspectiedienst;

      *metrologische instantie:* de krachtens [artikel 1a][ref1] aangewezen rechtspersoon;

      2 In dit besluit en de daarop berustende bepalingen wordt onder een serievoorverpakking niet verstaan
      de zelfstandigheid, bestaande uit een aantal verpakte eenheden van een produkt die ook als afzonderlijke
      verkoopeenheden aan verbruikers plegen te worden verkocht, en de verpakking waarin die verpakte eenheden zich
      gezamenlijk bevinden.

      3 Voor de toepassing van dit besluit en de daarop berustende bepalingen worden produkten, die van onderling
      verschillende samenstelling zijn en waarvoor hetzij overeenkomstig daarvoor geldende wettelijke bepalingen een
      zelfde benaming is gebezigd hetzij - bij ontstentenis van zodanige bepalingen - ingevolge het in Nederland algemeen
      geldende gebruik een zelfde benaming pleegt te worden gebezigd, aangemerkt als een zelfde produkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel1a
