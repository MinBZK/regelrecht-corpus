  - number: '29'
    text: |-
      Voor de beoordeling of een produkt dat deel uitmaakt van een voorverpakking of van een gezamenlijke verpakking als
      bedoeld in [artikel 26, eerste lid][ref1], en waarvan de hoeveelheid is uitgedrukt in een meeteenheid van volume,
      voldoet aan [de artikelen 20][ref2]-[28][ref3], geldt als hoeveelheid:

      a. indien het betreft een in diepgevroren of bevroren toestand verkerend produkt, de hoeveelheid, bepaald bij de
      temperatuur waarbij het produkt ten verkoop voorhanden pleegt te worden gehouden;

      b. indien het betreft een in een andere toestand dan [onder ][ref4] bedoeld verkerend produkt, de hoeveelheid
      bepaald bij een temperatuur van 20°C.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003310#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0003310#Artikel28
