  - number: '28'
    text: |-
      1 Voor een produkt dat deel uitmaakt van een voorverpakking of van een gezamenlijke verpakking als bedoeld in
      de aanhef van [artikel 26, eerste lid][ref1], mag niet worden gebezigd een aanduiding betreffende de hoeveelheid
      van dat produkt, de hoeveelheid of het uitlekgewicht van een vast hoofdbestanddeel van dat produkt of het aantal
      verpakte eenheden van dat produkt, die onjuist of misleidend is.

      2 Een in samenhang met het EEG-teken en in overeenstemming met de [artikelen 2][ref2] of [16][ref3] gebezigde
      aanduiding van de hoeveelheid van een voorverpakt produkt wordt geacht niet in strijd te zijn met het eerste lid
      van het onderhavige artikel of met de artikelen 20, 23, onder *a,* of 26, eerste lid.

      3 Indien voor een produkt, dat deel uitmaakt van een voorverpakking of van een gezamenlijke verpakking als bedoeld
      in [artikel 26, eerste lid][ref4], anders dan in samenhang met het EEG-teken een aanduiding is gebezigd, aangevende
      een hoeveelheid van dat produkt of een uitlekgewicht dan wel een aantal verpakte eenheden van dat produkt, kleiner
      dan respectievelijk de feitelijke hoeveelheid van dat produkt, het feitelijke uitlekgewicht of het feitelijke
      aantal verpakte eenheden, wordt die aanduiding geacht uit dien hoofde niet in strijd te zijn met het eerste lid of
      met de artikelen 20, 21, 22, 23 of 26, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003310#Artikel2
