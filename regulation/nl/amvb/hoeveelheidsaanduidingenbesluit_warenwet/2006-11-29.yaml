  - number: '30'
    text: |-
      1 De [artikelen 20][ref1]-[27][ref2] zijn niet van toepassing ten aanzien van een eet- of drinkwaar, die

      a. op de plaats van verkoop aan particulieren op verzoek van een koper in zijn verpakking is aangebracht; of

      b. in opdracht van een koper in zijn verpakking is aangebracht en bestemd is om door die koper in die verpakking in
      het kader van een maaltijdverstrekking te worden afgeleverd.

      2 [Artikel 25, tweede lid][ref3], is niet van toepassing ten aanzien van een van een voorverpakking deel uitmakend
      voorverpakt produkt, waarvan de verpakking een fantasieverpakking is.


