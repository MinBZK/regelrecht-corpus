  - number: '4'
    text: |-
      1 De e-voorverpakkingen als bedoeld in [artikel 3][ref1], behorende tot een overeenkomstig punt 2.1.1. van
      bijlage III van dit besluit gevormde partij, worden geacht aan [artikel 3, onder a en b][ref2], te voldoen,
      onderscheidenlijk niet te voldoen, indien bij een controle door keuringsambtenaren door middel van een feitelijk
      onderzoek van een uit die partij genomen steekproef met inachtneming van de in bedoelde bijlage vervatte regelen
      een resultaat wordt verkregen, overeenkomend met het in die bijlage aangegeven goedkeur- onderscheidenlijk
      afkeurcriterium.

      2 Een controle als bedoeld in het eerste lid wordt verricht bij de vervaardiger of de vuller van e-voorverpakkingen
      of de importeur van uit een derde land in Nederland ingevoerde e-voorverpakkingen of diens in Nederland gevestigde
      gemachtigde.

      3 Indien e-voorverpakkingen, behorende tot een partij, overeenkomstig het eerste lid worden geacht niet te
      voldoen aan [artikel 3, onder a en b][ref3], is het eerste lid niet langer van toepassing ten aanzien van een e-
      voorverpakking, die tot die partij heeft behoord doch met betrekking waartoe de vervaardiger of de importeur
      daarvan kan aantonen, dat alsnog is voldaan aan [artikel 3, onder a en b][ref4].

      4 Indien e-voorverpakkingen zich gezamenlijk bevinden in een verpakking, kan bij een controle ten behoeve van het
      feitelijk onderzoek van een steekproef als bedoeld in het eerste lid de verpakking, die de e-voorverpakkingen te
      zamen omgeeft, worden geopend.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel3
