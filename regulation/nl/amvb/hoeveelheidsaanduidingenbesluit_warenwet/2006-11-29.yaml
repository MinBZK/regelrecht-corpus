  - number: '9'
    text: |-
      1 De nominale hoeveelheid van een e-voorverpakking moet zijn vermeld op de buitenzijde daarvan; in afwijking
      daarvan mag de nominale hoeveelheid tegen de binnenzijde van de verpakking zijn aangebracht, indien die verpakking
      ter plaatse helder doorzichtig is.

      2 Een e-voorverpakking, waarvan een EEG-tapmaatfles deel uitmaakt, wordt aangemerkt als te voldoen aan het eerste
      lid, voor zover:

      a. die tapmaatfles overeenkomstig zijn bestemming is afgevuld en

      b. de aanduiding van het nominaal volume van die tapmaatfles daarop zichtbaar is, wanneer de betrokken e-
      voorverpakking op de daarvoor gebruikelijke wijze te koop wordt aangeboden.

      3 De nominale hoeveelheid moet zijn uitgedrukt in:

      a. liter, centiliter of milliliter, voor zover het betreft een vloeibaar produkt;

      b. kilogram of gram, voor zover het betreft een vast produkt.

      4 De nominale hoeveelheid moet zijn weergegeven in cijfers, gevolgd door de naam of het symbool van de betrokken
      meeteenheid.

      5 De cijfers, bedoeld in het vierde lid, moeten bij een nominale hoeveelheid als hieronder is vermeld ten minste de
      hoogte hebben als achter die nominale hoeveelheid is aangegeven:









                    Nominale hoeveelheid


                    hoogte cijfers ten minste




                    Groter dan:


                    tot en met:





                    -


                    50 g of 5 cl


                    2 mm




                    50 g of 5 cl


                    200 g of 20 cl


                    3 mm




                    200 g of 20 cl


                    1000 g of 100 cl


                    4 mm




                    1000 g of 100 cl


                    -


                    6 mm






      6 Het derde lid, onder a, geldt niet voor een in serie voorverpakt produkt als in dat onderdeel bedoeld, waarvan
      de nominale hoeveelheid in kilogram of gram is uitgedrukt, en het derde lid, onder b, geldt niet voor een in
      serie voorverpakt produkt als in dat onderdeel bedoeld, waarvan de nominale hoeveelheid in liter, centiliter of
      milliliter is uitgedrukt:

      a. voor zover het betreft een e-voorverpakking, die kennelijk is bestemd voor uitvoer naar een derde land,

      b. voor zover het betreft een e-voorverpakking die kennelijk voor uitvoer is bestemd naar een land, behorende tot
      het EEG-gebied en EER-gebied, mits het uitdrukken van de nominale hoeveelheid in een der vorenbedoelde meeteenheden
      niet in strijd is met de wettelijke voorschriften van dat land of met het aldaar algemeen geldende handelsgebruik,
      of

      c. voor zover het betreft een andere e-voorverpakking dan onder a of b bedoeld, mits het zodanig uitdrukken van
      de nominale hoeveelheid is voorgeschreven bij enig ander voor dat produkt geldend wettelijk voorschrift dan in de
      onderhavige paragraaf gegeven dan wel, bij het ontbreken van een wettelijk voorschrift, in overeenstemming is met
      het voor het betrokken produkt in Nederland geldend handelsgebruik.

      7 Indien de nominale hoeveelheid van een e-voorverpakking daarop tevens is uitgedrukt in een meeteenheid van het
      imperiale stelsel:

      a. moet het resultaat van de omrekening van de in Nederland wettelijk erkende meeteenheid in de betrokken
      meeteenheid van het imperiale stelsel zijn verkregen met behulp van een der volgende omrekeningscoëfficiënten: 1 g
      = 0,0353 ounce (avoirdupois), 1 kg = 2,205 pound, 1 ml = 0,0352 fluid ounce, 1 l = 1,760 pint of 0,220 gallon;

      b. mogen de afmetingen van letters en cijfers betreffende de aanduiding van de hoeveelheid, uitgedrukt in de
      betrokken meeteenheid van het imperiale stelsel, ten hoogste gelijk zijn aan die van de letters en cijfers
      betreffende de aanduiding van de hoeveelheid, uitgedrukt in de wettelijk erkende meeteenheid.
    url: https://wetten.overheid.nl/BWBR0003310/2006-11-29#Artikel9
  - number: '10'
    text: >-
      De nominale hoeveelheid van een e-voorverpakking moet gelijk zijn aan of groter zijn dan 5 gram of 5 milliliter en
      mag niet meer zijn dan 10 kilogram of 10 liter.
    url: https://wetten.overheid.nl/BWBR0003310/2006-11-29#Artikel10
  - number: '11'
    text: >-
      Op een e-voorverpakking moet zijn vermeld een merkteken of een opschrift ter identificatie van de in het EEG-gebied
      en EER-gebied gevestigde vervaardiger of vuller dan wel, in geval de e-voorverpakking buiten het EEG-gebied en EER-
      gebied is vervaardigd, van degene, die de betrokken e-voorverpakking in het EEG-gebied en EER-gebied in het vrije
      verkeer heeft gebracht en in dat gebied is gevestigd.
    url: https://wetten.overheid.nl/BWBR0003310/2006-11-29#Artikel11
  - number: '12'
    text: |-
      Het EEG-teken moet een hoogte hebben van ten minste 3 mm en moet op een e-voorverpakking zijn aangebracht
      op een der plaatsen, bedoeld in [artikel 9, eerste lid][ref1], en in hetzelfde gezichtsveld als de in
      [artikel 9, eerste en zevende lid][ref2], bedoelde aanduiding van de nominale hoeveelheid van die e-voorverpakking.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003310#Artikel9
    url: https://wetten.overheid.nl/BWBR0003310/2006-11-29#Artikel12
    references:
