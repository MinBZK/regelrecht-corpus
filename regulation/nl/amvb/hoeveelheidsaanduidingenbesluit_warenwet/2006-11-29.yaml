  - number: '3'
    text: |-
      De e-voorverpakkingen, die vervaardigd zijn door eenzelfde vervaardiger, eenzelfde nominale hoeveelheid hebben en
      waarvan eenzelfde produkt deel uitmaakt, moeten zodanig zijn, dat:

      a. de werkelijke inhoud van die e-voorverpakkingen gemiddeld niet kleiner is dan de nominale hoeveelheid daarvan,

      b. het aantal e-voorverpakkingen met een fout in minus die groter is dan de toegelaten fout, bepaald in
      [bijlage II][ref1] van dit besluit, zodanig is, dat bij statistische controle als in [artikel 4][ref2] bedoeld het
      toelaatbare aantal ondeugdelijke e-voorverpakkingen, behorende bij de toegepaste methode van onderzoek, niet wordt
      overschreden, en

      c. geen enkele van die e-voorverpakkingen een fout in minus heeft, die groter is dan tweemaal de toegelaten fout
      als onder b bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003310
      [ref2]: https://wetten.overheid.nl/BWBR0003310#Artikel4
