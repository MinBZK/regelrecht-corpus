  - number: '17'
    text: |-
      Indien voor een produkt bij een andere algemene maatregel van bestuur krachtens de [artikelen 14][ref1] of [14]
      (onbekend) regelen met betrekking tot de aanduiding van de hoeveelheid van dat produkt, uitgedrukt in een eenheid
      van volume of van massa, zijn gesteld, gelden die regelen, behoudens het daarbij bepaalde omtrent het uitdrukken
      van de hoeveelheid van dat produkt in liter, centiliter of milliliter dan wel kilogram of gram, niet ten aanzien
      van een e-voorverpakking waarvan dat produkt deel uitmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel14
    url: https://wetten.overheid.nl/BWBR0003310/2006-11-29#Artikel17
    references:
