  - number: '22'
    text: |-
      1 Voor een voorverpakt produkt, dat deel uitmaakt van een voorverpakking in de vorm van een aantal verpakte
      eenheden die afzonderlijk niet als een verkoopeenheid aan verbruikers plegen te worden verkocht, moet, voor zover
      in [artikel 23][ref1] niet anders is bepaald, tevens een aanduiding worden gebezigd, die het totale aantal van
      vorenbedoelde eenheden en de in de handel gebruikelijke benaming van die eenheden aangeeft.

      2 Het eerste lid geldt niet ten aanzien van suikerwerk, waarvan de hoeveelheid in elke verpakte eenheid ten hoogste
      15 gram is.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel23
    url: https://wetten.overheid.nl/BWBR0003310/2006-11-29#Artikel22
