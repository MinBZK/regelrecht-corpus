  - number: '24'
    text: |-
      In afwijking van [artikel 20, eerste lid][ref1], mag voor een voorverpakt produkt, waarvan de hoeveelheid ingevolge
      artikel 20, vierde lid, in een aantal stuks mag zijn uitgedrukt, een zodanige hoeveelheidsaanduiding achterwege
      worden gelaten, indien het aantal stuks van dat produkt zonder opening van de verpakking, die deel uitmaakt van de
      betrokken voorverpakking, van buitenaf duidelijk kan worden gezien en gemakkelijk kan worden geteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel20
    url: https://wetten.overheid.nl/BWBR0003310/2006-11-29#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003310
        artikel: '20'
        paragraaf: '3'
  - number: '25'
    text: |-
      1 De hoeveelheidsaanduidingen die ingevolge de [artikelen 20][ref1] tot en met [23][ref2] moeten of mogen worden
      gebezigd, moeten duidelijk zichtbaar en gemakkelijk leesbaar zijn aangebracht en mogen niet door vegen kunnen
      worden uitgewist. Zij moet voorkomen op de verpakking of op een daaraan gehecht etiket.

      2 De in het eerste lid bedoelde hoeveelheidsaanduidingen moeten zodanig zijn aangebracht, dat zij zich bevinden in
      hetzelfde gezichtsveld als de beide hierna genoemde aanduidingen:

      a. de benaming van het produkt;

      b. de datum van minimale houdbaarheid, onderscheidenlijk de uiterste consumptiedatum, met dien verstande dat mag
      worden volstaan met de woorden "ten minste houdbaar tot", of "ten minste houdbaar tot einde", onderscheidenlijk "te
      gebruiken tot", mits deze aanduiding wordt gevolgd door een verwijzing naar de plaats op of aan de verpakking waar
      de datum voorkomt;

      c. het alcoholgehalte.

      3 Het tweede lid geldt niet, indien de verpakking, die deel uitmaakt van de voorverpakking, bestaat uit een glazen
      fles, die is bestemd om opnieuw te worden gebruikt, in het glas waarvan een aanduiding van de hoeveelheid van
      het daarin voorverpakte produkt of de benaming van dat produkt is ingebrand of anderszins op duurzame wijze is
      ingebracht of aangebracht.

      4 Ten aanzien van de in het eerste lid bedoelde hoeveelheidsaanduidingen is [artikel 13][ref3] van overeenkomstige
      toepassing.

      5 De in het eerste lid bedoelde hoeveelheidsaanduidingen moeten begrijpelijk zijn geformuleerd en mogen niet van
      elkaar gescheiden zijn door andere aanduidingen in woord, beeld of cijfers; de woorden, voorkomende in de in het
      eerste lid bedoelde hoeveelheidsaanduidingen, met uitzondering van de benamingen van meeteenheden van het imperiale
      stelsel, moeten in de Nederlandse taal zijn gesteld.

      6 In afwijking van het eerste lid, en van de artikelen 20, eerste lid, en 23 mogen voor een voorverpakt produkt als
      bedoeld in [artikel 23][ref4] de in laatstgenoemd artikel bedoelde aanduidingen achterwege worden gelaten, indien:

      a. het totale aantal verpakte eenheden als bedoeld in de [aanhef van artikel 23][ref5] van buitenaf duidelijk kan
      worden gezien en gemakkelijk kan worden geteld,

      b. elk van die verpakte eenheden is voorzien van de voor het betrokken voorverpakte produkt ingevolge de
      [artikelen 20][ref6], [21][ref7] en [22][ref8] voorgeschreven aanduidingen en deze aanduidingen voldoen aan het
      eerste tot en met vijfde lid van het onderhavige artikel en

      c. de onder *b* bedoelde aanduidingen op de verpakking van ten minste één eenheid van buitenaf duidelijk kunnen
      worden gezien.

      7 In afwijking van het eerste lid, behoeft de hoeveelheidsaanduiding slechts op de handelsdocumenten voor te komen,
      die de desbetreffende voorverpakte eet- of drinkwaren vergezellen of die tegelijkertijd met of voor de aflevering
      worden verzonden, voor zover

      a. de desbetreffende waar, hoewel als zodanig bestemd voor de eindverbruiker niet zijnde een instelling, wordt
      verhandeld in een stadium voor de uiteindelijke aflevering;

      b. de desbetreffende waar is bestemd om aan instellingen te worden afgeleverd om daar te worden toebereid,
      verwerkt, in porties verdeeld, of om daar in het kader van een maaltijdverstrekking te worden afgeleverd;

      mits op de buitenste verpakking waarin de waar wordt verhandeld, deze aanduiding wordt gebezigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel20
