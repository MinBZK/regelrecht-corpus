  - number: 32a
    text: |-
      De volgende bepalingen van het onderhavige besluit komen te vervallen op een bij koninklijk besluit te bepalen
      tijdstip:

      a. [artikel 19][ref1], het zinsdeel "een eet- of drinkwaar, een kauwpreparaat, niet zijnde van tabak, of";

      b. [artikel 20, vierde lid][ref2];

      c. [artikel 22, tweede lid][ref3];

      d. [artikel 23, tweede lid][ref4];

      e. [artkel 30, eerste lid][ref5].


