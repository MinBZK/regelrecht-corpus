  - number: '6'
    text: |-
      Vervaardigers en importeurs van e-voorverpakkingen als bedoeld in [artikel 5, eerste lid][ref1], dienen aan de
      keuringsambtenaren alle medewerking, nodig ter controle of aan [de artikelen 3][ref2] en [5][ref3] is voldaan,
      te verlenen voor het onderzoek door die ambtenaren van partijen e-voorverpakkingen alvorens deze in de handel
      worden gebracht en voor het inzien en het afschrift nemen door die ambtenaren van de bescheiden, bedoeld in
      [artikel 5, vierde lid][ref4], of van de verklaring, bedoeld in [artikel 5, vijfde lid, onder b][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003310#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003310#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003310#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0003310#Artikel5
