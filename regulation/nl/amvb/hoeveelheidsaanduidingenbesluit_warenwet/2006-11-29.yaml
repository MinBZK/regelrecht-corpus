  - number: '21'
    text: |-
      1 Voor een voorverpakt produkt als bedoeld in [artikel 20, eerste lid][ref1], dat bestaat uit een vast bestanddeel
      en een opgietvloeistof, moet tevens een aanduiding worden gebezigd, die, voor zover in [artikel 23][ref2]
      niet anders is bepaald, het uitlekgewicht van dat bestanddeel aangeeft; die aanduiding moet inhouden het woord
      "uitlekgewicht", gevolgd door de waarde van dat gewicht, met dien verstande, dat het woord "uitlekgewicht" mag
      worden vervangen door de benaming van het vaste bestanddeel, indien voor het voorverpakte produkt een benaming is
      gebezigd, waarvan de benaming van dat bestanddeel en van de opgietvloeistof deel uitmaakt.

      2 Opgietvloeistof moet bestaan uit een of meer van de hierna genoemde vloeistoffen:

      - water, waterige oplossingen van zouten, voedingszuren, suikers, zoetstoffen, pekel of azijn;
      - het sap van de betrokken groente of van het betrokken fruit, voorzover het hoofdbestanddeel van de waar
      verduurzaamde groente of verduurzaamd fruit is.

      3 Ten aanzien van de aanduiding van het uitlekgewicht is het in
      [artikel 9, derde lid, onder b, vierde lid en zevende lid, onder a][ref3], met betrekking tot de aanduiding van de
      nominale hoeveelheid van een e-voorverpakking bepaalde van overeenkomstige toepassing.

      4 Het bestuur van het Produktschap voor Groenten en Fruit, van het Produktschap voor Pluimvee en Eieren, van het
      Produktschap voor Vee en Vlees, onderscheidenlijk van het Produktschap voor Vis en Visprodukten, kan nadere regels
      stellen ten aanzien van het bepalen van het uitlekgewicht voor die eetwaren waarvoor een uitlekgewicht moet worden
      gebezigd en welke ressorteren onder het desbetreffende produktschap.

      5 De op grond van de in het vierde lid bedoelde verordening vastgestelde nadere voorschriften behoeven de
      goedkeuring van Onze Minister van Volksgezondheid, Welzijn en Sport.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003310#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0003310#Artikel9
