  - number: '20'
    text: |-
      1 Voor een voorverpakt produkt, dat deel uitmaakt van een voorverpakking, moet een aanduiding, die de hoeveelheid
      van dat produkt aangeeft, worden gebezigd.

      2 Ten aanzien van de aanduiding van de hoeveelheid van een voorverpakt produkt als in het eerste lid bedoeld,
      dat niet deel uitmaakt van een e-voorverpakking, is, voor zover in [artikel 23][ref1] niet anders is bepaald, het
      in [artikel 9, derde, vierde en zevende lid, onder ][ref2] met betrekking tot de nominale hoeveelheid van een e-
      voorverpakking bepaalde van overeenkomstige toepassing.

      3 In afwijking van het tweede lid juncto [artikel 9, derde lid][ref3], mag de hoeveelheid van voorverpakte lijm
      worden uitgedrukt in kilogram of gram, indien die lijm een vloeibaar produkt is, of in liter, centiliter of
      milliliter, indien die lijm een vast produkt is, mits een zodanige hoeveelheidsaanduiding in overeenstemming is met
      het voor de betrokken lijm in Nederland geldende handelsgebruik.

      4 In afwijking van het tweede lid juncto [artikel 9, derde lid][ref4], mag de hoeveelheid van een voorverpakt
      produkt, behorende tot een der hierna genoemde categorieën, zijn uitgedrukt in een aantal stuks:

      a. beschuit;

      b. bakkerswaren, die in de regel per stuk of aantal stuks worden verkocht, voor zover zij door Onze Minister van
      Volksgezondheid, Welzijn en Sport zijn aangewezen;

      c. verse groente of verse vruchten, die ook onverpakt per stuk of aantal stuks plegen te worden verkocht;

      d. eende- of ganzeëieren;

      e. suikerwerk dat ook onverpakt per stuk of aantal stuks pleegt te worden verkocht.

      5 In afwijking van het tweede lid juncto [artikel 9, derde lid][ref5]:

      a. wordt de hoeveelheid van voorverpakt consumptie-ijs uitgedrukt in kilogram (kg) of gram (g) indien de waar een
      nettogewicht heeft van ten minste 75 gram;

      b. hoeft de hoeveelheid van voorverpakt consumptie-ijs niet vermeld te worden, indien de waar een nettogewicht
      heeft van minder dan 75 gram.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003310#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003310#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0003310#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0003310#Artikel9
