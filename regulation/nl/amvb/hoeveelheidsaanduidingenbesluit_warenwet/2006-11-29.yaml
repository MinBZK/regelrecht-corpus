  - number: '31'
    text: |-
      1 Indien ten aanzien van een produkt, dat deel uitmaakt van een voorverpakking of van een gezamenlijke
      verpakking als in [artikel 26, eerste lid][ref1], bedoeld, ingevolge een ander wettelijk voorschrift dan de
      [artikelen 9][ref2], [20-26][ref3] en [27, tweede lid][ref4], een aanduiding van de hoeveelheid van dat produkt,
      van het uitlekgewicht van een vast hoofdbestanddeel daarvan of van het aantal verpakte eenheden van dat produkt
      moet worden gebezigd, is met betrekking tot zodanig produkt het in de [artikelen 20-27][ref5] bepaalde, voor zover
      die aanduiding of aanduidingen betreft, niet van toepassing.

      2 Indien ten aanzien van een produkt als in het eerste lid bedoeld ingevolge een ander wettelijk voorschrift dan
      [artikel 28, eerste lid][ref6], een of meer der aanduidingen als in laatstgenoemde bepaling bedoeld niet mogen
      worden gebezigd, geldt met betrekking tot zodanig produkt het in [artikel 28, eerste lid][ref7], bepaalde, voor
      zover die aanduiding of aanduidingen betreft, niet.

      3 Indien ten aanzien van een produkt als in het eerste lid bedoeld in enig ander wettelijk voorschrift dan vervat
      in het onderhavige besluit een aanduiding van de hoeveelheid van dat produkt, van het uitlekgewicht van een vast
      hoofdbestanddeel daarvan of van het aantal verpakte eenheden wordt genoemd, die ingevolge dat voorschrift mag
      worden gebezigd, is met betrekking tot dat produkt ten aanzien waarvan bedoelde aanduiding of aanduidingen zijn
      gebezigd, het in de [artikelen 20, tweede lid][ref8] - juncto [artikel 9, derde lid -, derde en vierde lid][ref9],
      [21][ref10], [22][ref11], [23][ref12], [26, eerste lid][ref13], en [27, tweede lid][ref14], bepaalde voor zover de
      gebezigde aanduiding of aanduidingen betreffende, niet van toepassing.

      4 Indien ten aanzien van een produkt als in het eerste lid bedoeld in enig ander wettelijk voorschrift dan vervat
      in het onderhavige besluit een aanduiding van de hoeveelheid van dat produkt, van het uitlekgewicht van een vast
      hoofdbestanddeel daarvan of van het aantal verpakte eenheden van dat produkt, wordt genoemd, die ingevolge dat
      voorschrift niet behoeft te worden gebezigd, is met betrekking tot dat produkt, het in de [artikelen 20-26][ref15]
      en [27, tweede lid][ref16], bepaalde, voor zover die aanduiding of aanduidingen betreffende, niet van toepassing.

      5 Indien ten aanzien van een produkt als in het eerste bedoeld een vrijstelling of ontheffing is verleend van een
      ander wettelijk voorschrift dan vervat in het onderhavige besluit en betreffende de aanduiding van de hoeveelheid
      van dat produkt, van het uitlekgewicht van een vast hoofdbestanddeel daarvan of van het aantal verpakte eenheden
      van dat produkt, is het in de [artikelen 20-26][ref17] en [27, tweede lid][ref18], bepaalde, voor zover die
      aanduiding of aanduidingen betreffende, niet van toepassing.


