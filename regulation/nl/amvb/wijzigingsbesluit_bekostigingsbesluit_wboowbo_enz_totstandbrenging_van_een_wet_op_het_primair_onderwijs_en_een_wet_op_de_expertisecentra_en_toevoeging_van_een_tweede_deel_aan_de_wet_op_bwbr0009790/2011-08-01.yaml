  - number: XLIII
    text: |-
      1 De formatie van een speciale school voor basisonderwijs voor het schooljaar 1998–1999 wordt behoudens
      [artikel XLIV][ref1] berekend met toepassing van het [Formatiebesluit ISOVSO 1992][ref2], zoals dat besluit luidde
      op 31 juli 1998, met dien verstande dat de formatie ten minste wordt bepaald op de formatie die de school op 31
      juli 1998 van het Rijk ontving.

      2 Bij het berekenen van de formatie van de speciale school voor basisonderwijs voor het schooljaar 1998–1999 met
      toepassing van het [Formatiebesluit ISOVSO 1992][ref3], zoals dat besluit luidde op 31 juli 1998

      a. wordt bij een school die niet is ontstaan uit een scholengemeenschap en waaraan een of meer afdelingen zijn
      verbonden eerst de formatie bepaald voor het geheel en wordt vervolgens de formatie voor de afdeling of afdelingen,
      berekend met toepassing van [artikel XLII][ref4] met dien verstande dat bij de berekening van de formatie van de
      afdeling of afdelingen de groeiregeling per 1 januari 1999 buiten toepassing blijft, op eerstgenoemde formatie in
      mindering gebracht,

      b. wordt bij een school die is ontstaan uit een scholengemeenschap en waaraan een of meer afdelingen zijn verbonden
      eerst de formatie bepaald voor de afzonderlijke delen van de scholengemeenschap en wordt vervolgens de formatie
      voor de afdeling of afdelingen, berekend met toepassing van [artikel XLII][ref5] met dien verstande dat bij de
      berekening van de formatie van de afdeling of afdelingen de groeiregeling per 1 januari 1999 buiten toepassing
      blijft, in mindering gebracht op de formatie zoals berekend voor het deel waaraan de desbetreffende afdeling was
      verbonden,

      c. worden in plaats van de opslagen, bedoeld in [artikel 20a][ref6] en
      [20b van het Formatiebesluit ISOVSO 1992][ref7], de opslagen vanwege herbezetting in verband
      met arbeidsduurverkorting toegepast zoals die per 1 augustus 1998 zullen gelden op grond van het
      [Formatiebesluit WEC][ref8],

      d. blijven buiten beschouwing:

      1°. de formatierekeneenheden voor de schoolleiding, bedoeld in
      [artikel 16, derde tot en met vijfde lid, van het Formatiebesluit ISOVSO 1992][ref9],

      2°. de eventuele opslag vanwege herbezetting in verband met toepassing van de regeling bevordering
      arbeidsparticipatie ouderen als bedoeld in [artikel 20c van het Formatiebesluit ISOVSO 1992][ref10] met inbegrip
      van een eventueel quotum,

      3°. de eventuele formatie voor onderwijs in eigen taal en cultuur, bedoeld in
      [artikel 22 van het Formatiebesluit ISOVSO 1992][ref11],

      e. vindt na 1 augustus 1998 geen verhoging van de formatie plaats op grond van
      [artikel 8 van het Formatiebesluit ISOVSO 1992][ref12], en

      f. worden in plaats van de [artikelen 7][ref13], [22a][ref14] en [22b van het Formatiebesluit ISOVSO 1992][ref15]
      de [artikelen 7][ref16], [22a][ref17] en [22b van het Formatiebesluit WEC][ref18] toegepast.

      3 Bij het berekenen van de formatie die de speciale school voor basisonderwijs op 31 juli 1998 van het Rijk ontving

      a. wordt bij een school die niet is ontstaan uit een scholengemeenschap en waaraan een of meer afdelingen
      zijn verbonden de formatie eerst bepaald voor het geheel en wordt vervolgens de formatie voor de afdeling of
      afdelingen, berekend met toepassing van het [Formatiebesluit ISOVSO 1992][ref19] en overeenkomstige toepassing van
      [artikel XLII, tweede tot en met vijfde lid][ref20], op eerstgenoemde formatie in mindering gebracht,

      b. wordt bij een school die is ontstaan uit een scholengemeenschap en waaraan een of meer afdelingen zijn
      verbonden, eerst de formatie bepaald voor de afzonderlijke delen van de scholengemeenschap en wordt vervolgens de
      formatie voor

      de afdeling of afdelingen, berekend met toepassing van het [Formatiebesluit ISOVSO 1992][ref21] en overeenkomstige
      toepassing van [artikel XLII, tweede tot en met vijfde lid][ref22], in mindering gebracht op de formatie zoals
      berekend voor het deel waaraan de desbetreffende afdeling was verbonden, en

      c. wordt het tweede lid, onderdelen c en d, toegepast.

      4 De formatie die de speciale school voor basisonderwijs op 31 juli 1998 van het Rijk ontving, omvat behalve
      de formatie die de school ontving op grond van het [Formatiebesluit ISOVSO 1992][ref23] tevens de formatie
      die de school ontving op grond van de volgende, in Uitleg OCenW-regelingen 1996, nr. 31a, van 18 december 1996
      gepubliceerde beleidsregels:

      a. Formatiegarantie Weer Samen Naar School (WSNS) 1997–1998;

      b. Middelen so-expertise 1997–1998;

      c. Aanvullende formatie scholen voor (v)so op grond van bijzondere omstandigheden voor het schooljaar 1997–1998;

      d. Faciliteiten samenwerkingsverbanden WSNS 1997–1998.

      5 De formatie op grond van de in het vierde lid, onder a tot en met c, genoemde beleidsregels wordt verhoogd met
      een opslag van 2,10% voor herbezetting in verband met arbeidsduurverkorting. De geldelijke faciliteiten ad f 5000,-
      per school op grond van de onder d genoemde beleidsregel wordt omgezet in 12 formatierekeneenheden.

      6 Bij ministeriële regeling kunnen, zonodig in afwijking van dit artikel, nadere regels worden gesteld voor de
      berekening van de formatieve aanspraken ingevolge dit artikel.


