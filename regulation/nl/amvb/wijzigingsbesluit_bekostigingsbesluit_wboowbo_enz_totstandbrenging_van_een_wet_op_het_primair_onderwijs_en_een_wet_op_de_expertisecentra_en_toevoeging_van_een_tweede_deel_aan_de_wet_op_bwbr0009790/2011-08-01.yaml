  - number: XLVIII
    text: |-
      De tekst van het [Bekostigingsbesluit W.V.O.][ref1], het [Formatiebesluit W.V.O.][ref2], het
      [Formatiebesluit WPO][ref3], het [Formatiebesluit WEC][ref4] en het [Inrichtingsbesluit WVO][ref5] wordt
      in het Staatsblad geplaatst. Voor de plaatsing in het Staatsblad stelt Onze Minister van Onderwijs, Cultuur
      en Wetenschappen de nummering van de hoofdstukken, titels, afdelingen en artikelen van [deel II van het
      Bekostigingsbesluit W.V.O.](onbekend), het [Formatiebesluit W.V.O.][ref6] en het [Inrichtingsbesluit WVO][ref7]
      opnieuw vast en brengt hij de in die besluiten en de in dit besluit voorkomende aanhalingen en
      verwijzingen met de nieuwe nummering op grond van dit artikel en de [artikelen VII][ref8], [VIII][ref9] en
      [IX van de wet van 2 april 1998, Stb. 228][ref10], in overeenstemming.


