  - number: XLV
    text: |-
      1 De normatieve overgangsformatie, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _____________________________________________ (Stb. 228), wordt vastgesteld op basis van het verschil tussen

      a. de formatie op 31 juli 1998 zoals die voor de speciale school of scholen voor basisonderwijs in het
      samenwerkingsverband is berekend op grond van [artikel XLIII, derde, vierde en vijfde lid][ref2], vermeerderd met
      de in formatierekeneenheden uitgedrukte wsns-faciliteiten voor de basisscholen in het samenwerkingsverband in het
      schooljaar 1998–1999 ad 0,0656 formatierekeneenheid per leerling en

      b. de formatie waarop bij invoering van de nieuwe bekostigingssystematiek in het schooljaar 1998–1999 aanspraak
      zou zijn gemaakt, dan wel bij toepassing van [artikel XLV, derde lid, van eerstgenoemde wet][ref3] in het
      desbetreffende schooljaar aanspraak wordt gemaakt door de speciale school of scholen voor basisonderwijs
      in het samenwerkingsverband voor zover toe te rekenen aan het samenwerkingsverband, verminderd met de
      formatierekeneenheden voor de schoolleiding als bedoeld in [artikel XLIV][ref4] en een eventuele opslag voor
      herbezetting in verband met toepassing van de regeling bevordering arbeidsparticipatie ouderen en vermeerderd
      met de formatie als bedoeld in artikel 132 van de Wet op het primair onderwijs waarop bij invoering van de
      nieuwe bekostigingssystematiek in het schooljaar 1998–1999 aanspraak zou zijn gemaakt, dan wel bij toepassing van
      [artikel XLV, derde lid, van eerstgenoemde wet][ref5] in het desbetreffende schooljaar aanspraak wordt gemaakt door
      de basisscholen in het samenwerkingsverband.

      2 Indien de formatie op grond van het eerste lid, onderdeel a, groter is dan de formatie
      op grond van het eerste lid, onderdeel b, zijn op het verschil de percentages, vermeld in
      [artikel XLV, tweede lid, van de in het eerste lid genoemde wet][ref6] van toepassing.

      3 Bij ministeriële regeling kunnen, zonodig in afwijking van dit artikel, nadere regels worden gesteld voor de
      berekening van de formatieve aanspraken ingevolge dit artikel.


