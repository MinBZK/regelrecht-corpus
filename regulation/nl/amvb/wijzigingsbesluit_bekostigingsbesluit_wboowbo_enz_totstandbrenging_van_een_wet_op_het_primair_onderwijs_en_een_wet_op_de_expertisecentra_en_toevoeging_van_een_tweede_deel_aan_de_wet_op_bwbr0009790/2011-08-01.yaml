  - number: XLVI
    text: |-
      1 In het schooljaar 1998–1999 en volgende schooljaren wordt de formatie van een school voor speciaal of voor
      speciaal en voortgezet speciaal onderwijs aan zeer moeilijk opvoedbare kinderen waaraan een afdeling voor in hun
      ontwikkeling bedreigde kleuters is verbonden, met toepassing van het [Formatiebesluit WEC][ref1] vastgesteld, met
      dien verstande dat voor de leerlingen die zijn ingeschreven op de afdeling behoudens het tweede lid de minuten
      van toepassing zijn zoals die voor die leerlingen waren opgenomen in de tabellen van de [artikelen 14][ref2] en
      [18 van het Formatiebesluit ISOVSO 1992][ref3] zoals dat luidde op 31 juli 1998.

      2 Voor de toepassing van het eerste lid wordt in [artikel 18 van het Formatiebesluit ISOVSO 1992][ref4] in de regel
      voor in hun ontwikkeling bedreigde kleuters

      1°. in kolom a «5» vervangen door «10»,

      2°. in kolom h «1» vervangen door «3»,

      3°. in kolom i en j «6,5» vervangen door «9,75» en

      4°. in kolom k «1» vervangen door «3,25».


      [ref1]: https://wetten.overheid.nl/BWBR0005442
