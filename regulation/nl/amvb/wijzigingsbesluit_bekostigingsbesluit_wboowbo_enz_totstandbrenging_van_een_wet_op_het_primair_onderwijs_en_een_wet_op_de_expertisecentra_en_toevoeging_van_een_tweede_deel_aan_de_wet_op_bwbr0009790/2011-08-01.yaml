  - number: XLVII
    text: |-
      1 De [artikelen 20 tot en met 28 van het Bekostigingsbesluit WEC][ref1] zijn van overeenkomstige toepassing op de
      vergoeding voor en buitengebruikstelling van oude eigendoms- en huurscholen die in gebruik zijn bij een speciale
      school voor basisonderwijs of een daaraan verbonden afdeling.

      2 Het eerste lid vindt voor wat betreft de [artikelen 25][ref2], [26][ref3] en
      [28 van het Bekostigingsbesluit WEC][ref4] geen toepassing op een school zolang een niet voor eigendomsoverdracht
      vatbaar gedeelte van het gebouw in gebruik is bij een afdeling die aan die school verbonden is.

      3 Het eerste lid vindt voor wat betreft de [artikelen 25][ref5], [26][ref6] en
      [28 van het Bekostigingsbesluit WEC][ref7] geen toepassing op een afdeling zolang een niet voor eigendomsoverdracht
      vatbaar gedeelte van het gebouw in gebruik is bij de school waaraan die afdeling verbonden is.

      4 De [artikelen 25][ref8], [26][ref9] en [28 van het Bekostigingsbesluit WEC][ref10] vinden geen toepassing op
      een school voor speciaal onderwijs of voor speciaal en voortgezet speciaal onderwijs aan zeer moeilijk opvoedbare
      kinderen met een afdeling voor in hun ontwikkeling bedreigde kleuters zolang een niet voor eigendomsoverdracht
      vatbaar gedeelte van het gebouw in gebruik is bij die afdeling.

      5 De [artikelen 25][ref11], [26][ref12] en [28 van het Bekostigingsbesluit WEC][ref13] vinden geen toepassing op
      een afdeling voor in hun ontwikkeling bedreigde kleuters die is verbonden aan een school als bedoeld in het vierde
      lid, zolang een niet voor eigendomsoverdracht vatbaar gedeelte van het gebouw in gebruik is bij die school.


