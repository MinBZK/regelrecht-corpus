articles:
  - number: VII
    text: Het Besluit leerlingen met een niet-Nederlandse culturele achtergrond WBO wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009790/2011-08-01#ArtikelVII
  - number: XLII
    text: |-
      1 In het schooljaar 1998–1999 en volgende schooljaren is op een afdeling voor speciaal onderwijs aan zeer moeilijk
      lerende kinderen het [Formatiebesluit WEC][ref1] en op een afdeling voor voortgezet speciaal onderwijs aan kinderen
      met leer- en opvoedingsmoeilijkheden of moeilijk lerende kinderen van een speciale school voor basisonderwijs [deel
      II van het Formatiebesluit W.V.O.](onbekend) van toepassing. De formatie van een afdeling als bedoeld in de eerste
      volzin wordt met inachtneming van de volgende leden berekend.

      2 De formatie voor het onderwijzend personeel met uitzondering van de schoolleiding, voor het
      onderwijsondersteunend personeel en voor ambulante begeleiding wordt behoudens artikel XLIV, zesde lid, berekend op
      dezelfde wijze als bij een school.

      3 De formatie voor de schoolleiding wordt behoudens artikel XLIV en in afwijking van [artikel 7][ref2] juncto
      [artikel 16, tweede lid, van het Formatiebesluit WEC][ref3] onderscheidenlijk [artikel 17][ref4] juncto
      [artikel 25, tweede lid, van het Formatiebesluit W.V.O.][ref5] berekend door het aantal formatieplaatsen voor
      onderwijzend personeel met uitzondering van de schoolleiding, voor onderwijsondersteunend personeel en voor
      ambulante begeleiding te vermenigvuldigen met 100 minuten. Het aantal formatieplaatsen, bedoeld in de eerste
      volzin, wordt bepaald door de som van de minuten voor onderwijzend personeel met uitzondering van de schoolleiding,
      voor onderwijsondersteunend personeel, voor ambulante begeleiding en voor onderwijsachterstandenbestrijding,
      berekend op grond van de [artikelen 7][ref6], [11][ref7] en [13 van het Formatiebesluit WEC][ref8]
      onderscheidenlijk [17][ref9], [21][ref10] en [23 van het Formatiebesluit W.V.O.][ref11] en het vijfde lid te delen
      door 2400 en de uitkomst naar boven af te ronden op een geheel getal.

      4 In afwijking van [artikel 20 van het Formatiebesluit WEC][ref12] onderscheidenlijk
      [artikel 28 van het Formatiebesluit W.V.O.][ref13] wordt geen opslag in verband met formatieve fricties toegekend.

      5 De formatie voor onderwijsachterstandenbestrijding wordt in afwijking
      van [artikel 22b van het Formatiebesluit WEC][ref14] onderscheidenlijk
      [artikel 34 van het Formatiebesluit W.V.O.][ref15] berekend door het aantal leerlingen met een niet-Nederlandse
      culturele achtergrond van de afdeling te vermenigvuldigen met 84 minuten.


