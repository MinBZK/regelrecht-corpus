  - number: XLIV
    text: |-
      1 Het aantal formatierekeneenheden voor de schoolleiding van een speciale school voor basisonderwijs
      met één of meer afdelingen wordt in het schooljaar 1998–1999 bepaald met toepassing van
      [artikel 16, derde tot en met vijfde lid, van het Formatiebesluit ISOVSO 1992][ref1] zoals dit besluit luidde op 31
      juli 1998.

      2 Indien op grond van het eerste lid in het schooljaar 1998–1999 voor een speciale school voor basisonderwijs
      met een of meer afdelingen een of meer normatieve functies voor adjunct-directeur beschikbaar zijn, wordt van
      de formatierekeneenheden, bedoeld in het eerste lid, behoudens het vijfde lid in het schooljaar 1998–1999 en de
      volgende schooljaren aan de afdeling of afdelingen het aantal formatierekeneenheden beschikbaar gesteld dat behoort
      bij de maximum-schaal die beschikbaar is voor die functie onderscheidenlijk de maximum-schalen die beschikbaar zijn
      voor die functies. [Artikel XLIII, tweede lid onder b][ref2], is van overeenkomstige toepassing.

      3 Het aantal formatierekeneenheden, bedoeld in het tweede lid, wordt toegekend aan de afdeling onderscheidenlijk
      de afdelingen met de meeste leerlingen. Aan een afdeling kan ten hoogste het aantal formatierekeneenheden worden
      toegekend dat behoort bij de maximumschaal die beschikbaar is voor de functie van één adjunct-directeur.

      4 Indien in het schooljaar 1998–1999 geen normatieve functie van adjunct-directeur beschikbaar is, worden in dat
      schooljaar en volgende schooljaren aan de afdelingen geen formatierekeneenheden voor de schoolleiding toegekend.

      5 De formatierekeneenheden, bedoeld in het derde lid, worden beschikbaar gesteld zolang de afdeling aan de school
      verbonden is.

      6 De opslag voor herbezetting in verband met de regeling bevordering arbeidsparticipatie ouderen van een speciale
      school voor basisonderwijs met één of meer afdelingen wordt in het schooljaar 1998–1999 bepaald met toepassing
      van [artikel 20c van het Formatiebesluit ISOVSO 1992][ref3] zoals dit besluit luidde op 31 juli 1998, met dien
      verstande dat de opslag niet wordt verminderd met een quotum.


