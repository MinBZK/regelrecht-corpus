  - number: L
    text: |-
      1 [Artikel I, onderdeel X][ref1] (artikelen 34a en 34b) treedt in werking met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin dit besluit wordt geplaatst.

      2 De [artikelen II, voor wat betreft de onderdelen A tot en met T en V tot en met II][ref2], [VI][ref3],
      [VII][ref4], [IX][ref5], [XII][ref6] en [XIV tot en met XLVIII][ref7] treden in werking met ingang van 1 augustus
      1998. Indien het Staatsblad waarin dit besluit wordt geplaatst wordt uitgegeven na 31 juli 1998, treden deze
      artikelen in werking op de dag na de datum van uitgifte van het Staatsblad waarin het besluit wordt geplaatst en
      werken zij terug tot en met 1 augustus 1998.

      3 De [artikelen I, voor wat betreft de onderdelen A tot en met W, Y en Z][ref8],
      [II, voor wat betreft onderdeel U][ref9], [III][ref10], [IV][ref11], [V][ref12], [VIII][ref13], [X][ref14],
      [XI][ref15], [XIII ][ref16]en [IL][ref17] treden in werking op een bij koninklijk besluit te bepalen tijdstip. Dit
      besluit wordt niet genomen voordat vier weken zijn verstreken nadat het onderhavige besluit is voorgelegd aan de
      beide kamers der Staten-Generaal, en evenmin indien binnen die termijn door of namens een der kamers de wens te
      kennen wordt gegeven dat het in het onderhavige besluit geregelde onderwerp bij wet wordt geregeld.

      4 Indien het Staatsblad waarin het koninklijk besluit, bedoeld in het derde lid, eerste volzin, wordt geplaatst,
      wordt uitgegeven na 31 juli 1998, voorziet het koninklijk besluit in terugwerkende kracht tot en met 1 augustus
      1998.

      5 [Artikel XIX, onderdeel V][ref18], voor wat betreft
      [artikel I-Q204, eerste lid, onderdeel b, en onderdeel X][ref19], voor wat betreft
      [artikel I-Q206, onderdeel b][ref20], treedt in werking met ingang van 1 augustus 1999.


