  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, T. Netelenbos, van 17 maart 1998
    nr. 1998/12 527 (2536), directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Gelet op de artikelen 9, vijfde lid, 69, tweede en derde lid, 120, eerste en tweede lid, 121, eerste lid, 122,
    eerste en vierde lid, 123, tweede lid, 124, eerste en tweede lid, 125, eerste lid, 132, zevende lid, 173, eerste
    lid, 185 en 186, vijfde lid, van de Wet op het primair onderwijs, de artikelen 8, derde lid, 14, vijfde lid, 17,
    eerste lid, 25, 70, 117, eerste en tweede lid, 120, tweede lid, 159, eerste lid, en 171, derde, vierde, zesde en
    zevende lid, van de Wet op de expertisecentra en de artikelen 131, derde lid, 135, vijfde lid,137, eerste lid,
    142, 188, 233, eerste en tweede lid, 235, tweede lid, en 286, derde, vierde, zesde en zevende lid, van de Wet op
    het voortgezet onderwijs, artikel III, tweede lid, onder c, van de wet van 5 maart 1998, houdende wijziging van
    enkele onderwijswetten in verband met het onderwijs in allochtone levende talen en enkele technische aanpassingen
    (Stb. 148), de artikelen XXXIII, tweede lid, XXXVII, tweede lid, en XLV, zevende lid, van de wet van 2 april
    1998 tot wijziging van enkele onderwijswetten en technische wijziging van enkele andere wetten in verband met
    het totstandbrengen van onder meer een Wet op het primair onderwijs en een Wet op de expertisecentra (Stb.
    228), de artikelen 9, 10, 11, eerste lid, en 12 van de Tabakswet, de artikelen 2, derde lid, 3 en 6, tweede lid,
    van de Wet collectieve preventie volksgezondheid, de artikelen 7, eerste lid, en 17, onder b en c, van de Wet
    persoonsregistraties, de artikelen 47, eerste lid, 49, 50, eerste lid, 66, eerste lid, 68, eerste en tweede lid,
    82, tweede lid, 83, eerste lid, 84, tweede lid, 85, 86, eerste, tweede en vijfde lid, 105, 106, 108, 110, 125, 129,
    130 en 174 van de Wet geluidhinder, de artikelen 25 en 76, eerste lid onder a, van de Luchtvaartwet en de artikelen
    12, eerste lid, 15 en 21.8 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 24 april 1998, nr. W05.98 0097);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, T. Netelenbos, van 29
    mei 1998 nr. 1998/22 594 (2536), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van
    Landbouw, Natuurbeheer en Visserij;

