  - number: '2'
    text: |-
      Voor de hierna genoemde onderwijssoorten worden de volgende referentieniveaus Nederlandse taal, zoals opgenomen in
      [bijlage 1][ref1] van dit besluit, vastgesteld:

      a. het basisonderwijs, bedoeld in de [WPO][ref2]: de referentieniveaus 1F en 2F;

      b. het speciaal onderwijs, bedoeld in de [WEC][ref3]: de referentieniveaus 1F en 2F;

      c. het voorbereidend wetenschappelijk onderwijs, bedoeld in
      [artikel 2.1, eerste lid, onderdeel a, van de WVO 2020][ref4]: het referentieniveau 4F;

      d. het hoger algemeen voortgezet onderwijs, bedoeld in
      [artikel 2.1, eerste lid, onderdeel b, van de WVO 2020][ref5]: het referentieniveau 3F;

      e. het middelbaar algemeen voortgezet onderwijs, bedoeld in
      [artikel 2.1, eerste lid, onderdeel c, van de WVO 2020][ref6]: het referentieniveau 2F;

      f. het voorbereidend beroepsonderwijs, bedoeld in [artikel 2.1, eerste lid, onderdeel d, van de WVO 2020][ref7]:
      het referentieniveau 2F;

      g. het praktijkonderwijs, bedoeld in [artikel 2.1, eerste lid, onderdeel e, van de WVO 2020][ref8]: het
      referentieniveau 1F;

      h. de entreeopleiding, bedoeld in [artikel 7.2.2, onderdeel a, van de WEB][ref9]: het referentieniveau 2F, met
      uitzondering van het onderdeel Fictionele, narratieve en literaire teksten;

      h1. de assistentopleiding, bedoeld in [artikel 7.2.2, eerste lid, onderdeel a, van de WEB][ref10] zoals dat
      onderdeel luidde op 31 juli 2014: het referentieniveau 2F, met uitzondering van het onderdeel Fictionele,
      narratieve en literaire teksten;

      i. de basisberoepsopleiding, bedoeld in [artikel 7.2.2, onderdeel b, van de WEB][ref11]: het referentieniveau 2F,
      met uitzondering van het onderdeel Fictionele, narratieve en literaire teksten;

      j. de vakopleiding, bedoeld in [artikel 7.2.2, onderdeel c, van de WEB][ref12]: het referentieniveau 2F, met
      uitzondering van het onderdeel Fictionele, narratieve en literaire teksten;

      k. de middenkaderopleiding, bedoeld in [artikel 7.2.2, onderdeel d, van de WEB][ref13]: het referentieniveau 3F,
      met uitzondering van het onderdeel Fictionele, narratieve en literaire teksten;

      l. de specialistenopleiding, bedoeld in [artikel 7.2.2, onderdeel e, van de WEB][ref14]: het referentieniveau 3F,
      met uitzondering van het onderdeel Fictionele, narratieve en literaire teksten;

      m. de opleidingen Nederlandse taal en rekenen, bedoeld in [artikel 7.3.1, eerste lid, onder b, van de WEB][ref15]:
      de referentieniveaus 1F en 2F, en

      n. het arbeidsmarktgerichte uitstroomprofiel, bedoeld in [artikel 14, eerste lid, onderdeel b, van de WEC][ref16]:
      het referentieniveau 1F.


