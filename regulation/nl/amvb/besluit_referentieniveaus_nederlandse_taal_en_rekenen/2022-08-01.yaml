    text: |-
      In dit besluit wordt verstaan onder:

      - *WPO:* [Wet op het primair onderwijs][ref1];
      - *WEC:* [Wet op de expertisecentra][ref2];
      - *WVO 2020:* [Wet voortgezet onderwijs 2020][ref3];
      - *WEB:* [Wet educatie en beroepsonderwijs][ref4].


