preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, van 8 april 2010, nr. WJZ/199346
    (2702), directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Onderwijs, Cultuur en
    Wetenschap en Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op artikel 2, eerste lid, van de Wet referentieniveaus Nederlandse taal en rekenen;

    De Raad van State gehoord (advies van 28 april 2010, nr. W05.10.0122/I);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, van 14 juni 2010, nr.
    WJZ/211307 (2702), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Onderwijs,
    Cultuur en Wetenschap en Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0027879/2014-08-01#ArtikelAanhef
