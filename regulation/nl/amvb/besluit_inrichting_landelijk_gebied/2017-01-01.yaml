  - number: 1a
    text: |-
      Dit besluit berust op de [artikelen 63][ref1] en [88 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel88
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '63'
      - id: ref2
        bwb_id: BWBR0020748
        artikel: '88'
  - number: '2.1'
    text: |-
      Gedeputeerde staten bepalen de agrarische verkeerswaarde van gronden op basis van het prijsniveau van de
      landbouwgronden die in het blok in het jaar voorafgaand aan de terinzagelegging van het ruilplan, overeenkomstig
      [artikel 64, eerste lid, van de wet][ref1], zijn verkocht.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel64
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '64'
  - number: '2.2'
    text: |-
      In afwijking van het eerste lid bepalen gedeputeerde staten de agrarische verkeerswaarde van gronden op basis van
      de prijs waarvoor vergelijkbare gronden buiten het desbetreffende blok zijn verkocht in het jaar, bedoeld in het
      eerste lid, indien in dat jaar geen of onvoldoende verkopen van landbouwgronden in het desbetreffende blok hebben
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel2
  - number: '3'
    text: |-
      Gedeputeerde staten stellen in verband met de toepassing van [artikel 58, tweede lid, van de wet][ref1] vast
      tot welke grootte van de inbreng een eigenaar in plaats van toedeling van grond een algehele vergoeding in geld
      ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel58
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '58'
  - number: '4'
    text: 'Gedeputeerde staten stellen per blok of gedeelte van een blok uitgangspunten vast ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel4
  - number: 4.a
    text: de kavelconcentratie;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel4
  - number: 4.b
    text: de afstand van de veldkavels tot de bedrijfskavel;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel4
  - number: 4.c
    text: het maximum aantal kavels per bedrijfstype;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel4
  - number: 4.d
    text: de grootte van de kavels; of
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel4
  - number: 4.e
    text: de vorm van de kavels.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel4
  - number: '5'
    text: |-
      De begrenzing van een openbare voorziening wordt zodanig vastgesteld, dat de openbare voorziening doelmatig
      gebruikt en beheerd kan worden.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel5
  - number: '6'
    text: |-
      De grens van een perceel waarop zich een gebouw bevindt, kan bij toewijzing van een naastgelegen perceel slechts
      na overleg met de eigenaar en gebruiker worden aangepast, tenzij het gebouw niet in gebruik is of zich niet in de
      nabijheid van de perceelsgrens bevindt.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel6
  - number: '7'
    text: |-
      Gronden die ingevolge een vastgesteld bestemmingsplan, een ontwerpbestemmingsplan of een vastgesteld
      inrichtingsplan een bestemming hebben of krijgen die overeenkomt met de functie van landbouw, natuur, bos of
      landschap zijn uitruilbaar, voor zover [artikel 23 van de wet][ref1] niet anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel23
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '23'
  - number: '8.1'
    text: 'Uitruilbaar tegen een nihil inbreng zijn:'
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel8
  - number: 8.1.a
    text: een waterloop met een breedte van ten minste 5 meter;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel8
  - number: 8.1.b
    text: een plas met een oppervlakte van ten minste 25 m2;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel8
  - number: 8.1.c
    text: een lijnvormig landschapselement bestaande uit een houtopstand met een gemiddelde breedte van ten minste 5 meter.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel8
  - number: '8.2'
    text: 'Uitruilbaar als aangrenzende grond zijn:'
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel8
  - number: 8.2.a
    text: een waterloop met een gemiddelde breedte van minder dan 5 meter;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel8
  - number: 8.2.b
    text: een plas met een oppervlakte van minder dan 25 m2;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel8
  - number: 8.2.c
    text: een lijnvormig landschapselement bestaande uit een houtopstand met een gemiddelde breedte van minder dan 5 meter.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel8
  - number: '8.3'
    text: |-
      In afwijking van het eerste en tweede lid kunnen gedeputeerde staten voor het gehele blok voor waterlopen, plassen
      of lijnvormige landschapselementen een andere breedte of oppervlakte bepalen indien het belang van een doelmatige
      herverkaveling vanwege de specifieke kenmerken van het desbetreffende blok daartoe noodzaakt.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel8
  - number: '9'
    text: |-
      Een openbare weg als bedoeld in [artikel 4 van de Wegenwet][ref1] alsmede een weg die anderszins een openbaar
      karakter heeft is in zijn geheel uitruilbaar tegen een nihil inbreng.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel4
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '4'
  - number: '10'
    text: |-
      Gronden waarop zich een openbare weg als bedoeld in [artikel 4 van de Wegenwet][ref1] bevindt, die op grond van het
      inrichtingsplan het openbare karakter verliest, zijn uitruilbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel4
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '4'
  - number: '11'
    text: |-
      Wanneer de openbare functie van een waterloop volgens het inrichtingsplan vervalt, zijn de gronden waarop deze
      waterloop zich bevindt uitruilbaar.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel11
  - number: '12.1'
    text: |-
      Gronden die zijn gelegen in een gebied waar krachtens [artikel 2 van de Kaderwet LNV-subsidies][ref1] dan wel
      krachtens een provinciale verordening subsidie kan worden verstrekt voor natuurbeheer of agrarisch natuurbeheer,
      zijn uitruilbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009194#Artikel2
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009194
        artikel: '2'
  - number: '12.2'
    text: |-
      Indien geen subsidie als bedoeld in het eerste lid is verstrekt, worden de desbetreffende gronden geruild met
      inachtneming van de volgende rangorde:
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel12
  - number: 12.2.a
    text: |-
      ruil met landbouwgronden die door bureau beheer landbouwgronden zijn verworven ten behoeve van de veiligstelling,
      aanleg of ontwikkeling van bos of natuurterreinen of waarvoor een eigenaar of pachter bereid is om een aanvraag in
      te dienen voor subsidie als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel12
  - number: 12.2.b
    text: ruil met overige landbouwgronden.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel12
  - number: '12.3'
    text: |-
      Indien wel subsidie als bedoeld in het eerste lid is verstrekt, worden de desbetreffende gronden geruild met
      inachtneming van de volgende rangorde:
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel12
  - number: 12.3.a
    text: |-
      ruil met landbouwgronden, die door bureau beheer landbouwgronden zijn verworven ten behoeve van de veiligstelling,
      aanleg of ontwikkeling van bos of natuurterreinen;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel12
  - number: 12.3.b
    text: |-
      ruil met landbouwgronden, die door particuliere terreinbeherende natuurbeschermingsorganisaties zijn verworven ten
      behoeve van de veiligstelling, aanleg of ontwikkeling van bos of natuurterreinen;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel12
  - number: 12.3.c
    text: ruil met landbouwgronden waarvoor aan een eigenaar of pachter subsidie als bedoeld in het eerste lid is verstrekt.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel12
  - number: '12.4'
    text: |-
      In afwijking van het derde lid worden de desbetreffende gronden, ingeval daarvoor door een eigenaar een
      overeenkomst tot ontwikkeling of instandhouding van bos of natuur is aangegaan met een verplichting als bedoeld
      in [artikel 252 van boek 6 van het Burgerlijk Wetboek][ref1] ten behoeve van de Staat der Nederlanden of bureau
      beheer landbouwgronden, geruild met gronden ten aanzien waarvan eveneens een dergelijke overeenkomst is afgesloten
      of met gronden die in eigendom zijn van de Staat der Nederlanden, bureau beheer landbouwgronden of particuliere
      terreinbeherende natuurbeschermingsorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '252'
  - number: '13.1'
    text: |-
      Gronden die deel uitmaken van een onderzoeksgeval als bedoeld in [artikel 1 van de Wet bodembescherming][ref1] zijn
      niet uitruilbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel1
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '1'
  - number: '13.2'
    text: |-
      Gronden die deel uitmaken van een geval van verontreiniging als bedoeld in
      [artikel 1 van de Wet bodembescherming][ref1] zijn niet uitruilbaar, indien de LAC-signaalwaarden worden
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel1
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '1'
  - number: '13.3'
    text: |-
      Gronden die deel uitmaken van een geval van ernstige verontreiniging als bedoeld in
      [artikel 1 van de Wet bodembescherming][ref1] zijn niet uitruilbaar, tenzij het bevoegd gezag op grond van de
      [Wet bodembescherming][ref2] heeft vastgesteld dat


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003994
  - number: 13.3.a
    text: |-
      het geval van ernstige verontreiniging op grond van [artikel 38, eerste lid, van de Wet bodembescherming][ref1]
      voldoende is gesaneerd en geen LAC-signaalwaarden worden overschreden; of


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel38
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '38'
  - number: 13.3.b
    text: |-
      er met betrekking tot het geval van ernstige verontreiniging op grond van
      [artikel 38, derde lid, van de Wet bodembescherming][ref1] voldoende maatregelen zijn genomen en geen LAC-
      signaalwaarden worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel38
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '38'
  - number: '14'
    text: 'Niet uitruilbaar zijn:'
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel14
  - number: 14.a
    text: gronden met een uitzonderlijk slechte cultuurtoestand;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel14
  - number: 14.b
    text: gronden met een zeer ongelijke vlakligging;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel14
  - number: 14.c
    text: natuurterreinen, die niet als cultuurgrond in gebruik zijn;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel14
  - number: 14.d
    text: te diep ontgronde percelen;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel14
  - number: 14.e
    text: gronden waarop zich sport- of recreatieterreinen bevinden;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel14
  - number: 14.f
    text: gronden waarop zich spoorwegen bevinden;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel14
  - number: 14.g
    text: |-
      gronden met een houtopstand die groter is dan 10 are of gronden waarop een houtopstand
      die groter is dan 10 are heeft gestaan en waarvoor een herbeplantingsplicht als bedoeld in
      [artikel 4.3, eerste lid, van de Wet natuurbescherming][ref1] geldt, of


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '4'
  - number: 14.h
    text: boomgaarden en andere gronden met meerjarige gewassen.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel14
  - number: '15.1'
    text: De toedeling van kavels vindt zodanig plaats dat een doelmatig gebruik wordt bevorderd.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel15
  - number: '15.2'
    text: 'De toedeling van kavels geschiedt met inachtneming van de volgende rangorde:'
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel15
  - number: 15.2.a
    text: toedeling gericht op een zo groot mogelijke concentratie van kavels bij de bedrijfskavel;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel15
  - number: 15.2.b
    text: toedeling gericht op een zo groot mogelijke concentratie van kavels bij de huiskavel;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel15
  - number: 15.2.c
    text: toedeling gericht op een zo gering mogelijke afstand tussen de bedrijfsgebouwen en de kavels;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel15
  - number: 15.2.d
    text: toedeling gericht op een zo gering mogelijke afstand tussen het woonhuis en de kavels.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel15
  - number: '16'
    text: |-
      Samenvoeging van kavels die ten dienste staan van één gebruiker vindt niet plaats, indien die samenvoeging voor
      een betrokken eigenaar leidt tot een versnippering van zijn eigendom die in redelijkheid niet van hem gevergd kan
      worden.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel16
  - number: '17'
    text: |-
      De grens van een huis- of bedrijfskavel kan bij toedeling slechts na overeenstemming met de eigenaar en na overleg
      met de gebruikers worden aangepast, tenzij het gebouw op die kavel niet meer in gebruik is of zich niet in de
      nabijheid van de perceelsgrens bevindt.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel17
  - number: '18'
    text: |-
      Gedeputeerde staten vermelden in het plan van toedeling met welk percentage op grond van
      [artikel 56, eerste lid, van de wet][ref1] de totale oppervlakte van alle in het blok opgenomen gronden is
      verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel56
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '56'
  - number: '19'
    text: |-
      Indien een eigenaar met betrekking tot een onroerende zaak een recht krijgt toegedeeld van een andere hoedanigheid
      of gebruiksbestemming dan door hem is ingebracht, kunnen gedeputeerde staten de betrokken eigenaar compenseren
      door ten aanzien van de betrokken onroerende zaak een oppervlaktecorrectie toe te passen of door hem een geldsom
      te betalen.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel19
  - number: '20.1'
    text: |-
      Gedeputeerde staten handhaven in het plan van toedeling zakelijke rechten als bedoeld in
      [artikel 150, eerste lid, van de Overgangswet nieuw Burgerlijk Wetboek][ref1] indien het belang van de
      landinrichting of de reconstructie zich daar niet tegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel150
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '150'
  - number: '20.2'
    text: |-
      Gedeputeerde staten handhaven of vestigen in het plan van toedeling erfdienstbaarheden indien niet door
      herverkaveling of uitvoering van inrichtingswerken aan de behoefte waarin deze rechten voorzien kan worden tegemoet
      gekomen.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel20
  - number: '21'
    text: De ingebruikneming van de kavels vindt plaats met inachtneming van een doelmatige uitvoering van werken.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel21
  - number: '22'
    text: |-
      In het plan van toedeling kan in verband met de uitvoering van werken worden bepaald dat gronden na vaststelling
      van het ruilplan gefaseerd in gebruik worden genomen.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel22
  - number: '23'
    text: |-
      Het plan van toedeling kan nadere regels bevatten voor de ingebruikneming van kavels, die in tijdelijk gebruik
      worden gegeven bij een andere eigenaar dan de eigenaar aan wie de kavels zijn toegedeeld.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel23
  - number: '24'
    text: |-
      De lijst der geldelijke regelingen vermeldt alle aan de betrokken eigenaren toe te rekenen kosten en toe te kennen
      vergoedingen, waaronder kosten en vergoedingen die zijn overeengekomen met eigenaren van gronden, die buiten het
      blok zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel24
  - number: '25.1'
    text: |-
      De toestand van de grond en de overige onroerende zaken wordt bij de schatting, bedoeld in
      [artikel 68 van de wet][ref1], vastgelegd aan de hand van een of meer objectieve factoren en een of meer
      subjectieve factoren.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel68
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '68'
  - number: '25.2'
    text: 'De objectieve factoren, bedoeld in het eerste lid, betreffen:'
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel25
  - number: 25.2.a
    text: de ontsluiting van huiskavels, bedrijfskavel of veldkavels en
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel25
  - number: 25.2.b
    text: de waterhuishoudkundige toestand van kavels.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel25
  - number: '25.3'
    text: 'De subjectieve factoren, bedoeld in het eerste lid, betreffen:'
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel25
  - number: 25.3.a
    text: de kavelconcentratie;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel25
  - number: 25.3.b
    text: de afstand van de veldkavels tot de bedrijfskavel;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel25
  - number: 25.3.c
    text: het aantal kavels per bedrijf;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel25
  - number: 25.3.d
    text: de grootte van de kavels, en
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel25
  - number: 25.3.e
    text: de vorm van de kavels.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel25
  - number: '26.1'
    text: |-
      Bij de lijst der geldelijke regelingen kunnen verrekenposten worden opgenomen tussen hetzij de bij het plan van
      toedeling betrokken eigenaren onderling hetzij de gezamenlijkheid van eigenaren en de individuele eigenaar, die
      betrokken is bij het plan van toedeling.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel26
  - number: '26.2'
    text: 'De verrekenposten, bedoeld in het eerste lid, kunnen betreffen:'
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel26
  - number: 26.2.a
    text: |-
      de aanwezigheid van opstallen, opstanden en obstakels, waaronder bunkers, hoogspanningsmasten of kabels en
      leidingen;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel26
  - number: 26.2.b
    text: de waarde van gebouwen, werken, beplantingen en houtopstanden;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel26
  - number: 26.2.c
    text: |-
      de algehele vergoeding in geld voor inbreng van gronden ten behoeve van de korting, bedoeld in
      [artikel 56, eerste lid, onderdeel c of d, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel56
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '56'
  - number: 26.2.d
    text: de algehele vergoeding in geld voor de inbreng van kavels met een te kleine oppervlakte;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel26
  - number: 26.2.e
    text: |-
      de afkoop van renten als bedoeld in [artikel 60, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel60
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '60'
  - number: 26.2.f
    text: |-
      de regeling en de opheffing van beperkte rechten, huren en lasten als bedoeld in
      [artikel 60, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel60
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '60'
  - number: 26.2.g
    text: |-
      de vestiging van beperkte rechten als bedoeld in [artikel 60, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel60
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '60'
  - number: 26.2.h
    text: andere dan agrarische waarden;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel26
  - number: 26.2.i
    text: |-
      het verhaal van kosten in verband met een geval van verontreiniging als bedoeld in
      [artikel 1 van de Wet bodembescherming][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel1
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '1'
  - number: 26.2.j
    text: |-
      schadevergoeding wanneer bij de uitvoering van werken geen gronden ter vervanging in tijdelijk gebruik gegeven
      kunnen worden.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel26
  - number: '27.1'
    text: |-
      Bij de verrekenposten, die betrekking hebben op een ingeschreven recht alsmede de waardering van de objectieve
      en subjectieve factoren, wordt uitgegaan van de situatie op het in het [artikel 65, tweede lid, van de wet][ref1]
      laatstbedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel65
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '65'
  - number: '27.2'
    text: |-
      Bij de waardering van verrekenposten, die verband houden met de cultuurtoestand van de grond, wordt uitgegaan van
      de situatie op het tijdstip van de kavelovergang.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel27
  - number: '27.3'
    text: |-
      Bij de waardering van de overige verrekenposten wordt, voor zover de hoogte van de verrekenpost niet is
      overeengekomen, uitgegaan van de situatie bij de terinzagelegging van het ontwerpruilplan, bedoeld in
      [artikel 64, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel64
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '64'
  - number: '28'
    text: |-
      Gedeputeerde staten waarderen de objectieve en subjectieve factoren teneinde de bijdrage van een eigenaar in de
      kosten, bedoeld in [artikel 90, derde lid, van de wet][ref1] te berekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel90
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '90'
  - number: '29'
    text: Gedeputeerde staten waarderen de verrekenposten op basis van de waarde in het maatschappelijk verkeer.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel29
  - number: '30'
    text: |-
      Een verrekenpost, die het gevolg is van de overgang van een zaak of een recht naar een andere eigenaar, wordt voor
      de inbrengende eigenaar en de eigenaar, die de zaak of het recht krijgt toegedeeld op dezelfde waarde geschat,
      tenzij een andere waardering noodzakelijk is vanwege de bijzondere omstandigheden van het geval.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel30
  - number: '31.1'
    text: 'De lijst der geldelijke regelingen vermeldt per eigenaar de omslag van de kosten, bestaande uit de som van:'
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel31
  - number: 31.1.a
    text: het saldo van de verrekenposten;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel31
  - number: 31.1.b
    text: |-
      het totaal van de geldbedragen, die aan de desbetreffende eigenaar worden toegerekend op basis van de subjectieve
      en objectieve factoren, vermenigvuldigd met het quotiënt van het totaal van de aan de eigenaren toe te rekenen
      kosten en het totaal van alle aan de eigenaren op basis van de subjectieve en objectieve factoren toegerekende
      geldbedragen.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel31
  - number: '31.2'
    text: |-
      Indien de waardeverandering door objectieve en subjectieve factoren met een puntensysteem is bepaald, wordt voor de
      toepassing van het eerste lid, onderdeel b, de waarde van een punt omgerekend in een geldbedrag door het totaal van
      de aan de eigenaren toe te rekenen kosten te delen door het totaal van de aan de eigenaren toegerekende punten.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel31
  - number: 31a
    text: |-
      Een overeenkomst als bedoeld in [artikel 85, eerste lid, van de wet][ref1] heeft geen betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel85
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '85'
  - number: 31a.a
    text: kavels die deel uitmaken van de bebouwde kom;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel31a
  - number: 31a.b
    text: 'kavels die deel uitmaken van een ruimtelijk aaneengesloten of functioneel verbonden samenstel van kavels dat:'
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel31a
  - number: 31a.b.1°
    text: |-
      in gebruik is voor woningbouw, daaronder begrepen recreatiewoningen, of de huisvesting van bedrijven met een niet-
      agrarische bestemming;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel31a
  - number: 31a.b.2°
    text: |-
      voor een dergelijk gebruik is bestemd ingevolge plannen of besluiten op grond van de
      [Wet ruimtelijke ordening][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: 31a.b.3°
    text: daarvoor zal worden bestemd blijkens bekendgemaakte ontwerpen voor dergelijke plannen of besluiten;
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel31a
  - number: 31a.c
    text: |-
      kavels waar ontgronding plaatsvindt, tenzij daaraan overeenkomstig de voorwaarden die het bevoegd gezag heeft
      verbonden aan de vergunning tot ontgronding na de ontgronding de bestemming landbouw of ontwikkeling van natuur of
      kleinschalige recreatie wordt gegeven; of
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel31a
  - number: 31a.d
    text: de beperkte rechten met betrekking tot de kavels, bedoeld in de onderdelen a tot en met c.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel31a
  - number: '32'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel32
  - number: '33'
    text: 'Dit besluit wordt aangehaald als: Besluit inrichting landelijk gebied.'
    url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#Artikel33
