  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 17 november 2005, nr.
    TRCJZ/2005/3429, Directie Juridische Zaken;

    Gelet op artikel 74 van de Reconstructiewet concentratiegebieden;

    De Raad van State gehoord (advies van 9 februari 2006, no. W11.05.0527/V);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 25 april 2006, nr.
    TRCJZ/2006/998, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019827/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:







                  a.


                  wet:


                  [Wet inrichting landelijk gebied][ref1];




                  b.


                  landbouwgrond:


                  landbouwgrond als bedoeld in [artikel 1 van de Wet agrarisch grondverkeer][ref2];




                  c.


                  bureau beheer landbouwgronden:


                  bureau, bedoeld in [artikel 28 van de Wet agrarisch grondverkeer][ref3];




                  d.


                  huiskavel:


                  kavel met een woonhuis;




                  e.


                  bedrijfskavel:


                  kavel met een gebouw of een complex van gebouwen, dienende voor de uitoefening van een landbouwbedrijf;




                  f.


                  veldkavel:


                  kavel, die geen huis- of bedrijfskavel is;




                  g.


                  gebouw:


                  gebouw als bedoeld in [artikel 1, eerste lid, van de Woningwet][ref4];




                  h.


                  vlakligging:


                  mate van egaliteit van het maaiveld;




                  i.


                  natuurterrein:


                  natuurterrein als bedoeld in [artikel 1 van de Wet agrarisch grondverkeer][ref5];




                  j.


                  particuliere terreinbeherende natuurbeschermings-organisaties:


                  organisaties aangewezen bij koninklijk besluit als bedoeld in
      [artikel 388 van Boek 7 van het Burgerlijk Wetboek][ref6];




                  k.


                  LAC-signaalwaarde:


                  laagste gehalte van een stof in de bodem dat bij overschrijding aanleiding kan geven tot het optreden
      van nadelige effecten voor de opbrengst en kwaliteit van agrarische producten en de gezondheid van mens en dier;




                  l.


                  inrichtingsplan:


                  inrichtingsplan als bedoeld in [artikel 17, eerste lid, van de wet][ref7];




                  m.


                  reconstructie:


                  voorbereiding, vaststelling en uitvoering van een onderling samenhangend complex van maatregelen en
      voorzieningen ter verwezenlijk van de doelstellingen van de [Reconstructiewet concentratiegebieden][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0020748
      [ref2]: https://wetten.overheid.nl/BWBR0003386#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003386#Artikel28
