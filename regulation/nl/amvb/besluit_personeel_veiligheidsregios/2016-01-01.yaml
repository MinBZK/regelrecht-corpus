  - number: '3.1'
    text: |-
      Bij de functies, genoemd in [bijlage 1][ref1] en [artikel 2, vierde lid][ref2], behoort een functiegerichte
      opleiding die wordt afgesloten met een examen.


      [ref1]: https://wetten.overheid.nl/BWBR0027841
      [ref2]: https://wetten.overheid.nl/BWBR0027841#Artikel2
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0027841
      - id: ref2
        bwb_id: BWBR0027841
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      Voor de functies, genoemd in de [bijlagen 1][ref1] en [1A][ref2], gelden van laag naar hoog de volgende
      rangen: brandwacht, hoofdbrandwacht, brandmeester, hoofdbrandmeester, commandeur, adjunct-hoofdcommandeur en
      hoofdcommandeur.


      [ref1]: https://wetten.overheid.nl/BWBR0027841
      [ref2]: https://wetten.overheid.nl/BWBR0027841
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0027841
      - id: ref2
        bwb_id: BWBR0027841
  - number: '4.1'
    text: |-
      Een persoon is voorafgaand aan de uitoefening van een of meer functies, genoemd in [bijlage 1][ref1], in het
      bezit van het diploma van de bij de desbetreffende functie behorende opleiding of in het bezit van een erkenning
      van beroepskwalificaties als bedoeld in [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref2],
      afgegeven ten aanzien van de te vervullen functie.


      [ref1]: https://wetten.overheid.nl/BWBR0027841
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027841
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
  - number: '4.2'
    text: |-
      Onze Minister kan ontheffing verlenen voor het in het bezit zijn van het diploma van de bij de desbetreffende
      functie behorende opleiding, bedoeld in het eerste lid, met uitzondering van het diploma voor de functies
      brandweerduiker en duikploegleider.
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel4
  - number: '4.3'
    text: |-
      In afwijking van het eerste lid kan degene die een opleiding volgt tot een van de functies, genoemd in
      [bijlage 1][ref1], als aspirant de desbetreffende functie uitoefenen, met uitzondering van de functies
      brandweerduiker en duikploegleider.


      [ref1]: https://wetten.overheid.nl/BWBR0027841
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027841
  - number: '4.4'
    text: |-
      Voorafgaand aan de uitoefening van de functies waarvoor dit in [bijlage 1][ref1] is aangegeven, wordt een keuring
      als bedoeld in [artikel 1, onder a, van de Wet op de medische keuringen][ref2] verricht ter bescherming van de
      gezondheid en veiligheid van de keurling en van derden bij de uitoefening van de desbetreffende functie.


      [ref1]: https://wetten.overheid.nl/BWBR0027841
      [ref2]: https://wetten.overheid.nl/BWBR0008819#Artikel1
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027841
      - id: ref2
        bwb_id: BWBR0008819
        artikel: '1'
  - number: '4.5'
    text: Het vierde lid is van overeenkomstige toepassing op de aspirant, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het overleg, bedoeld in [artikel 18, vijfde lid, van de Wet veiligheidsregio’s][ref1], staat onder het
      voorzitterschap van Onze Minister. Onze Minister is bevoegd het voorzitterschap over te dragen aan een door hem aan
      te wijzen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel18
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '18'
  - number: '5.2'
    text: 'Tot het overleg worden vertegenwoordigers toegelaten van:'
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel5
  - number: 5.2.a
    text: |-
      iedere centrale van overheidspersoneel, genoemd in
      [artikel 105, tweede lid, onderdeel a tot en met d, van het Algemeen Rijksambtenarenreglement][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel105
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '105'
  - number: 5.2.b
    text: |-
      andere organisaties, die naar het oordeel van Onze Minister representatief zijn voor het personeel van de brandweer
      en tegen wier toelating het algemeen belang zich niet verzet.
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel5
  - number: '5.3'
    text: |-
      Van de aanwijzing van een vertegenwoordiger als bedoeld in het tweede lid wordt mededeling gedaan aan de voorzitter
      van het overleg.
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel5
  - number: '5.4'
    text: |-
      Schorsing onderscheidenlijk intrekking van de toelating tot de Sectorcommissie, bedoeld in
      [artikel 105, tweede lid, van het Algemeen Rijksambtenarenreglement][ref1], heeft van rechtswege ten gevolge
      schorsing onderscheidenlijk intrekking van de toelating tot het overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel105
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '105'
  - number: '5.5'
    text: |-
      Onze Minister kan een toelating van een organisatie tot het overleg krachtens het tweede lid, onderdeel b,
      intrekken, indien de organisatie naar het oordeel van Onze Minister niet meer representatief is dan wel het
      algemeen belang zich tegen verdere toelating verzet.
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel5
  - number: '6.1'
    text: |-
      Het College voor Arbeidszaken van de Vereniging van Nederlandse Gemeenten kan een vertegenwoordiger aanwijzen die
      als adviseur aan het overleg deelneemt.
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel6
  - number: '6.2'
    text: |-
      Deelnemers aan het overleg kunnen zich voor de behandeling van een bepaald onderwerp door een of meer deskundigen
      laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel6
  - number: '7.1'
    text: De voorzitter van het overleg wijst een secretaris aan.
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel7
  - number: '7.2'
    text: |-
      De secretaris staat, onder leiding van de voorzitter, ten dienste van de voorzitter en de vertegenwoordigers van de
      centrales van overheidspersoneel en andere organisaties als bedoeld in [artikel 5, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027841#Artikel5
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027841
        artikel: '5'
        hoofdstuk: '3'
  - number: '8.1'
    text: |-
      Ter voorbereiding op in het overleg te nemen besluiten of ter uitwerking van in het overleg genomen besluiten kan
      de voorzitter in overleg met deelnemers aan het overleg een werkgroep instellen, waarin ook personen van buiten het
      overleg zitting kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel8
  - number: '8.2'
    text: De voorzitter wijst de voorzitter van de werkgroep aan.
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel8
  - number: '8.3'
    text: De secretaris van het overleg is tevens secretaris van de werkgroep.
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister bevordert slechts de totstandkoming van een algemene maatregel van bestuur als bedoeld
      in [artikel 18, tweede lid, van de Wet veiligheidsregio’s][ref1], indien daarover overeenstemming
      bestaat tussen de voorzitter en de meerderheid van de centrales van overheidspersoneel, bedoeld in
      [artikel 5, tweede lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0027841#Artikel5
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0027841
        artikel: '5'
        hoofdstuk: '3'
  - number: '9.2'
    text: Iedere centrale van overheidspersoneel brengt één stem uit.
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de stemmen staken, beslist Onze Minister of hij de totstandkoming van de algemene maatregel van bestuur,
      bedoeld in het eerste lid, bevordert.
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel9
  - number: '9.4'
    text: |-
      De [artikelen 110d tot en met 110k van het Algemeen Rijksambtenarenreglement][ref1] zijn van overeenkomstige
      toepassing indien het overleg niet tot een uitkomst zal leiden die de instemming van de voorzitter dan wel de
      meerderheid van de centrales zal hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110d
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 110d
  - number: '10.1'
    text: |-
      Het diploma van de bij de desbetreffende functie behorende opleiding wordt gelijkgesteld met het diploma dat is
      behaald op basis van de examenreglementen overeenkomstig [bijlage 2][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0027841
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0027841
  - number: '10.2'
    text: |-
      Onder de examenreglementen, genoemd in het eerste lid, wordt verstaan: de examenreglementen, zoals deze luidden op
      de dag, voorafgaande aan de datum van inwerkingtreding van de [Wet veiligheidsregio’s][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027466
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0027466
  - number: '11'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Wet veiligheidsregio’s][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0027466
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0027466
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Besluit personeel veiligheidsregio’s.'
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel12
