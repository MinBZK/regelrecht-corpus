    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 16 februari 2010, nr. 2009-
    0000506161, CZW/WVOB;

    Gelet op de artikelen 18 en 31, vierde lid, van de Wet veiligheidsregio’s;

    De Raad van State gehoord (advies van 15 april 2010, nr. W04.10.0062/1);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 21 juni 2010,
    nr. 2010-0000398206;

    Hebben goedgevonden en verstaan:
