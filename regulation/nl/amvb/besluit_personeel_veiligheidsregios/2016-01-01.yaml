  - number: 1.a
    text: '*functie:* samenstel van te verrichten werkzaamheden;'
    url: https://wetten.overheid.nl/BWBR0027841/2016-01-01#Artikel1
  - number: 1.b
    text: |-
      *diploma:* diploma als bedoeld in [artikel 18, vierde lid, van de Wet veiligheidsregio’s][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel18
