  - number: '10'
    text: |-
      1 Het diploma van de bij de desbetreffende functie behorende opleiding wordt gelijkgesteld met het diploma dat is
      behaald op basis van de examenreglementen overeenkomstig [bijlage 2][ref1] bij dit besluit.

      2 Onder de examenreglementen, genoemd in het eerste lid, wordt verstaan: de examenreglementen, zoals deze luidden
      op de dag, voorafgaande aan de datum van inwerkingtreding van de [Wet veiligheidsregio’s][ref2].


