  - number: '5'
    text: |-
      1 Het overleg, bedoeld in [artikel 18, vijfde lid, van de Wet veiligheidsregio’s][ref1], staat onder het
      voorzitterschap van Onze Minister. Onze Minister is bevoegd het voorzitterschap over te dragen aan een door hem aan
      te wijzen ambtenaar.

      2 Tot het overleg worden vertegenwoordigers toegelaten van:

      a. iedere centrale van overheidspersoneel, genoemd in
      [artikel 105, tweede lid, onderdeel a tot en met d, van het Algemeen Rijksambtenarenreglement][ref2], en

      b. andere organisaties, die naar het oordeel van Onze Minister representatief zijn voor het personeel van de
      brandweer en tegen wier toelating het algemeen belang zich niet verzet.

      3 Van de aanwijzing van een vertegenwoordiger als bedoeld in het tweede lid wordt mededeling gedaan aan de
      voorzitter van het overleg.

      4 Schorsing onderscheidenlijk intrekking van de toelating tot de Sectorcommissie, bedoeld in
      [artikel 105, tweede lid, van het Algemeen Rijksambtenarenreglement][ref3], heeft van rechtswege ten gevolge
      schorsing onderscheidenlijk intrekking van de toelating tot het overleg.

      5 Onze Minister kan een toelating van een organisatie tot het overleg krachtens het tweede lid, onderdeel b,
      intrekken, indien de organisatie naar het oordeel van Onze Minister niet meer representatief is dan wel het
      algemeen belang zich tegen verdere toelating verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel105
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel105
