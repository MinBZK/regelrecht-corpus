  - number: '3'
    text: |-
      1 Bij de functies, genoemd in [bijlage 1][ref1] en [artikel 2, vierde lid][ref2], behoort een functiegerichte
      opleiding die wordt afgesloten met een examen.

      2 Voor de functies, genoemd in de [bijlagen 1][ref3] en [1A][ref4], gelden van laag naar hoog de volgende
      rangen: brandwacht, hoofdbrandwacht, brandmeester, hoofdbrandmeester, commandeur, adjunct-hoofdcommandeur en
      hoofdcommandeur.


      [ref1]: https://wetten.overheid.nl/BWBR0027841
      [ref2]: https://wetten.overheid.nl/BWBR0027841#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0027841
