  - number: '4'
    text: |-
      1 Een persoon is voorafgaand aan de uitoefening van een of meer functies, genoemd in [bijlage 1][ref1], in het
      bezit van het diploma van de bij de desbetreffende functie behorende opleiding.

      2 Onze Minister kan ontheffing verlenen voor het in het bezit zijn van het diploma van de bij de desbetreffende
      functie behorende opleiding, bedoeld in het eerste lid, met uitzondering van het diploma voor de functies
      brandweerduiker en duikploegleider.

      3 In afwijking van het eerste lid kan degene die een opleiding volgt tot een van de functies, genoemd in
      [bijlage 1][ref2], als aspirant de desbetreffende functie uitoefenen, met uitzondering van de functies
      brandweerduiker en duikploegleider.

      4 Voorafgaand aan de uitoefening van de functies waarvoor dit in [bijlage 1][ref3] is aangegeven, wordt een keuring
      als bedoeld in [artikel 1, onder a, van de Wet op de medische keuringen][ref4] verricht ter bescherming van de
      gezondheid en veiligheid van de keurling en van derden bij de uitoefening van de desbetreffende functie.

      5 Het vierde lid is van overeenkomstige toepassing op de aspirant, bedoeld in het derde lid.

      6 Met het diploma, bedoeld in het eerste lid, wordt gelijkgesteld een beroepskwalificatie, verkregen in een andere
      lidstaat van de Europese Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij
      een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, die een beroepsniveau waarborgt dat
      ten minste gelijkwaardig is aan het niveau dat met het diploma wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0027841
      [ref2]: https://wetten.overheid.nl/BWBR0027841
      [ref3]: https://wetten.overheid.nl/BWBR0027841
      [ref4]: https://wetten.overheid.nl/BWBR0008819#Artikel1
