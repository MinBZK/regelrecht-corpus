  - number: '6'
    text: |-
      1 Het College voor Arbeidszaken van de Vereniging van Nederlandse Gemeenten kan een vertegenwoordiger aanwijzen die
      als adviseur aan het overleg deelneemt.

      2 Deelnemers aan het overleg kunnen zich voor de behandeling van een bepaald onderwerp door een of meer deskundigen
      laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0027841/2017-12-01#Artikel6
  - number: '7'
    text: |-
      1 De voorzitter van het overleg wijst een secretaris aan.

      2 De secretaris staat, onder leiding van de voorzitter, ten dienste van de voorzitter en de
      vertegenwoordigers van de centrales van overheidspersoneel en andere organisaties als bedoeld in
      [artikel 5, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027841#Artikel5
    url: https://wetten.overheid.nl/BWBR0027841/2017-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027841
        artikel: '5'
        hoofdstuk: '3'
  - number: '8'
    text: |-
      1 Ter voorbereiding op in het overleg te nemen besluiten of ter uitwerking van in het overleg genomen besluiten kan
      de voorzitter in overleg met deelnemers aan het overleg een werkgroep instellen, waarin ook personen van buiten het
      overleg zitting kunnen hebben.

      2 De voorzitter wijst de voorzitter van de werkgroep aan.

      3 De secretaris van het overleg is tevens secretaris van de werkgroep.
    url: https://wetten.overheid.nl/BWBR0027841/2017-12-01#Artikel8
  - number: '9'
    text: |-
      1 Onze Minister bevordert slechts de totstandkoming van een algemene maatregel van bestuur als bedoeld
      in [artikel 18, tweede lid, van de Wet veiligheidsregio’s][ref1], indien daarover overeenstemming
      bestaat tussen de voorzitter en de meerderheid van de centrales van overheidspersoneel, bedoeld in
      [artikel 5, tweede lid, onder a][ref2].

      2 Iedere centrale van overheidspersoneel brengt één stem uit.

      3 Indien de stemmen staken, beslist Onze Minister of hij de totstandkoming van de algemene maatregel van bestuur,
      bedoeld in het eerste lid, bevordert.

      4 De [artikelen 110d tot en met 110k van het Algemeen Rijksambtenarenreglement][ref3] zijn van overeenkomstige
      toepassing indien het overleg niet tot een uitkomst zal leiden die de instemming van de voorzitter dan wel de
      meerderheid van de centrales zal hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel18
