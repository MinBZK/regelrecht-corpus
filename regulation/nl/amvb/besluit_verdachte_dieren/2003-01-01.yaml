preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij, van 25 april 1994, no. J. 946620,
    Directie Juridische en Bedrijfsorganisatorische Zaken;

    Gelet op Richtlijn nr. 85/511/EEG van de Raad van de Europese Gemeenschappen van 18 november 1985 tot vaststelling
    van gemeenschappelijke maatregelen ter bestrijding van mond- en klauwzeer (PbEG L 315), Richtlijn nr. 92/40/EEG
    van de Raad van de Europese Gemeenschappen van 19 mei 1992 tot vaststelling van communautaire maatregelen voor de
    bestrijding van aviaire influenza (PbEG L 167), Richtlijn nr. 92/66/EEG van de Raad van de Europese Gemeenschappen
    van 14 juli 1992 tot vaststelling van communautaire maatregelen voor de bestrijding van de ziekte van Newcastle
    (PbEG L 260) en Richtlijn nr. 92/119/EEG van de Raad van de Europese Gemeenschappen van 17 december 1992 tot
    vaststelling van algemene communautaire maatregelen voor de bestrijding van bepaalde dierziekten en van specifieke
    maatregelen ten aanzien van vesiculaire varkensziekte (PbEG 1993, L 62);

    Gelet op de artikelen 15, vierde lid, en 111 van de Gezondheids- en welzijnswet voor dieren;

    Gezien het advies van de Raad voor dierenaangelegenheden (d.d. 21 december 1993), het Landbouwschap (d.d. 23
    december 1993), het Produktschap Vee en Vlees (d.d. 16 december 1993), het Produktschap voor Pluimvee en Eieren
    (d.d. 20 december 1993), het Produktschap voor Vis en Visprodukten (d.d. 5 januari 1994), het Bedrijfschap voor
    de Pluimveehandel en -industrie (d.d. 20 december 1993), het Bedrijfschap voor de Handel in Vee (d.d. 24 december
    1993) en de Stichting voor Gezelschapsdieren (d.d. 23 december 1993);

    De Raad van State gehoord (advies van 21 juni 1994, No. W11.94.0257);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 11 juli 1994, no. J. 9411031,
    Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006829/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: [Gezondheids- en welzijnswet voor dieren][ref1];

      b. ambtenaar: ambtenaar, bedoeld in [artikel 114, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005662
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0006829/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '114'
  - number: '2'
    text: |-
      Onze Minister besluit dieren als verdacht aan te merken, indien:

      a. de ambtenaar bij de dieren verschijnselen meent te bespeuren van een besmettelijke dierziekte,

      b. de dieren zich met zieke of verdachte dieren in dezelfde verblijfplaats bevinden of binnen de in
      [artikel 3][ref1] genoemde termijn hebben bevonden dan wel binnen deze termijn daarmee in aanraking zijn geweest,
      of

      c. Onze Minister redenen heeft om aan te nemen dat de dieren in de gelegenheid zijn geweest om te worden besmet, en
      de diersoort voor de betreffende besmettelijke dierziekte vatbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0006829#Artikel3
    url: https://wetten.overheid.nl/BWBR0006829/2003-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006829
        artikel: '3'
  - number: '3'
    text: |-
      De in [artikel 2, onderdeel ][ref1], bedoelde termijn is bij:

      a. runderpest: 21 dagen;

      b. mond- en klauwzeer: 14 dagen;

      c. brucellose bij kleine herkauwers: 4 maanden;

      d. brucellose bij herten en kameelachtigen: 6 maanden;

      e. brucellose bij varkens: 4 maanden;

      f. brucellose bij runderen: 2 jaar;

      g. tuberculose veroorzaakt door M. bovis: 18 maanden;

      h. tuberculose veroorzaakt M. tuberculosis: 2 jaar;

      i.

      j. klassieke varkenspest: 14 dagen;

      k. Afrikaanse varkenspest: 14 dagen;

      l. rabies: 6 maanden;

      m. dourine: 20 weken;

      n. kwade droes: 3 maanden;

      o. virale paardeëncefalomyelitiden: 7 dagen;

      p. infectieuze anemie: 30 dagen;

      q. miltvuur: 14 dagen;

      r. Afrikaanse paardepest: 14 dagen;

      s. vesiculaire stomatitis: 21 dagen;

      t. bovine spongiforme encefalopathie: 5 jaar;

      u. besmettelijke bovine pleuropneumonie: 4 maanden;

      v. Teschener-ziekte: 40 dagen; (besmettelijke varkensverlamming)

      w. vesiculaire varkensziekte: 28 dagen;

      x. blue tongue: 40 dagen;

      y. pest van de kleine herkauwer: 21 dagen;

      z. Rift Valley koorts: 30 dagen;

      aa. schape- en geitepokken: 21 dagen;

      bb. nodulaire dermatose: 28 dagen;

      cc. enzoötische hemorragische ziekte bij herten: 40 dagen;

      dd. vogelpest (aviaire influenza): 7 dagen;

      ee. pseudo-vogelpest (Newcastle disease): 7 dagen;

      ff. Amerikaans vuilbroed: 1 jaar;

      gg. infectieuze zalmanemie: 21 dagen;

      hh. infectieuze hematopoïetische necrose: 14 dagen;

      ii. virale hemorragische septikemie: 14 dagen;

      jj. bonamiasis veroorzaakt door Bonamia ostreae: 3 maanden;

      kk. marteiliosis veroorzaakt door Marteilia refringens: 1 maand;

      ll. marteiliosis veroorzaakt door Marteilia sidneyi: 3 maanden;

      mm. haplosporidiosis veroorzaakt door Haplosporidium nelsoni of Haplosporidium costale: 3 maanden;

      nn. perkinosis veroorzaakt door Perkinsus marinus of Perkinsus olseni: 3 maanden;

      oo. mikrokytosis veroorzaakt door Mikrokytos mackini of Mikrokytos roughleyi: 3 maanden;

      pp. iridovirosis veroorzaakt door Oyster velar virus: 3 maanden.

      oo. andere besmettelijke dierziekten die ter uitvoering van door de Europese Gemeenschap vastgestelde
      verplichtingen bestreden moeten worden: de door Onze Minister vastgestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006829#Artikel2
    url: https://wetten.overheid.nl/BWBR0006829/2003-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006829
        artikel: '2'
  - number: '4'
    text: |-
      Onze Minister besluit tot de beëindiging van de verdenking, indien:

      a. de in [artikel 2, onderdeel a][ref1], bedoelde verschijnselen opgehouden hebben te bestaan, of

      b. Onze Minister de overtuiging heeft gekregen dat de dieren niet aan een besmettelijke dierziekte lijden.


      [ref1]: https://wetten.overheid.nl/BWBR0006829#Artikel2
    url: https://wetten.overheid.nl/BWBR0006829/2003-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006829
        artikel: '2'
  - number: '5'
    text: |-
      1 Dieren die op grond van [artikel 2, onderdelen ][ref1], als verdacht worden aangemerkt, blijven verdacht
      gedurende een periode van:

      a. 21 dagen bij runderpest;

      b. 21 dagen bij mond- en klauwzeer;

      c. 21 dagen bij brucellose bij kleine herkauwers, herten en kameelachtigen en varkens;

      d. 14 maanden bij brucellose bij runderen;

      e. 16 maanden bij tuberculose veroorzaakt door M. bovis;

      f. 3 maanden bij tuberculose veroorzaakt door M. tuberculosis;

      g.

      h. 35 dagen bij klassieke varkenspest;

      i. 21 dagen bij Afrikaanse varkenspest;

      j. 6 maanden bij rabies;

      k. 20 weken bij dourine;

      l. 2 maanden bij kwade droes;

      m. 21 dagen bij virale paardeëncefalomyelitiden;

      n. 30 dagen bij infectieuze anemie;

      o. 14 dagen bij miltvuur;

      p. 21 dagen bij Afrikaanse paardepest;

      q. 21 dagen bij vesiculaire stomatitis;

      r. 4 maanden bij bovine spongiforme encefalopathie;

      s. 14 dagen bij besmettelijke bovine pleuropneumonie;

      t. 40 dagen bij Teschener-ziekte; (besmettelijke varkensverlamming)

      u. 28 dagen bij vesiculaire varkensziekte;

      v. 40 dagen bij blue tongue;

      w. 21 dagen bij pest van de kleine herkauwer;

      x. 30 dagen bij Rift Valley koorts;

      y. 21 dagen bij schape- en geitepokken;

      z. 28 dagen bij nodulaire dermatose (lumpy skin disease);

      aa. 40 dagen bij enzoötische hemorragische ziekte bij herten;

      bb. 21 dagen bij vogelpest (aviaire influenza);

      cc. 21 dagen bij pseudo-vogelpest (Newcastle disease);

      dd. 1 maand bij Amerikaans vuilbroed;

      ee. 6 maanden bij infectieuze zalmanemie;

      ff. 6 maanden bij infectieuze hematopoïetische necrose;

      gg. 6 maanden bij virale hemorragische septikemie;

      hh. 3 maanden bij bonamiasis veroorzaakt door Bonamia ostreae;

      ii. 1 maand bij marteiliosis veroorzaakt door Marteilia refringens;

      jj. 3 maanden bij marteiliosis veroorzaakt door Marteilia sidneyi;

      kk. 3 maanden bij haplosporidiosis veroorzaakt door Haplosporidium nelsoni of Haplosporidium costale;

      ll. 3 maanden bij perkinosis veroorzaakt door Perkinsus marinus of Perkinsus olseni;

      mm. 3 maanden bij mikrokytosis veroorzaakt door Mikrokytos mackini of Mikrokytos roughleyi;

      nn. 3 maanden bij iridovirosis veroorzaakt door Oyster velar virus;

      mm. de door Onze Minister vastgestelde periode bij andere besmettelijke dierziekten die ter uitvoering van door de
      Europese Gemeenschap vastgestelde verplichtingen bestreden moeten worden.

      2 De in het eerste lid bedoelde periode vangt aan op de dag waarop de dieren naar het oordeel van Onze Minister
      voor het laatst in de gelegenheid zijn geweest om te worden besmet.

      3 In afwijking van het eerste lid kan Onze Minister bepalen dat de dieren die op grond van
      [artikel 2, onderdelen ][ref2], als verdacht worden aangemerkt, verdacht blijven gedurende een andere dan de aldaar
      genoemde periode.


      [ref1]: https://wetten.overheid.nl/BWBR0006829#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006829#Artikel2
    url: https://wetten.overheid.nl/BWBR0006829/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006829
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006829
        artikel: '2'
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit verdachte dieren.'
    url: https://wetten.overheid.nl/BWBR0006829/2003-01-01#Artikel6
  - number: '7'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006829/2003-01-01#Artikel7
