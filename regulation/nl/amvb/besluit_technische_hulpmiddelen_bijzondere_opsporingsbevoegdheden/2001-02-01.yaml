articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. gegevensdrager: een voorwerp waarop gedetecteerde signalen worden geregistreerd;

      b. technisch hulpmiddel: een configuratie van componenten die signalen detecteert, deze transporteert, hun
      registratie activeert en de signalen registreert;

      c. standaardconfiguratie: een door de keuringsdienst als zodanig aangewezen vaste combinatie van componenten die
      als geheel een technisch hulpmiddel vormt;

      d. observatie met een technisch hulpmiddel: het plaatsen of bedienen van een technisch hulpmiddel, ter
      uitvoering van een bevel tot observatie als bedoeld in [artikel 126g, eerste en derde lid][ref1], of
      [artikel 126o, eerste en derde lid, van het Wetboek van Strafvordering][ref2];

      e. opnemen van vertrouwelijke communicatie: het plaatsen of bedienen van een technisch hulpmiddel, ter uitvoering
      van een bevel tot het opnemen van vertrouwelijke communicatie met een technisch hulpmiddel als bedoeld in
      [artikel 126l, eerste lid][ref3], of [artikel 126s, eerste lid, van het Wetboek van Strafvordering][ref4];

      f. Onze Minister: Onze Minister van Justitie;

      g. keuringsdienst: een door Onze Minister aan te wijzen onderdeel van het Korps landelijke politiediensten,
      dan wel, indien het gaat om keuring van een technisch hulpmiddel voor observatie dat door het Korps landelijke
      politiediensten is ontwikkeld of een technisch hulpmiddel of standaardconfiguratie voor het opnemen van
      vertrouwelijke communicatie, een door Onze Minister aan te wijzen onafhankelijke organisatie die zich toelegt op
      het keuren van apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126g
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126o
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel126l
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel126s
