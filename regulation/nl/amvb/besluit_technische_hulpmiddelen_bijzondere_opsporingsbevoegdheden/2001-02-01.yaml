  - number: '7'
    text: |-
      1 Indien het bevel tot observatie met een technisch hulpmiddel is gegeven ter uitvoering van een internationaal
      rechtshulpverzoek tot grensoverschrijdende observatie en het technische hulpmiddel in het buitenland door de
      buitenlandse autoriteiten op of aan het vervoermiddel is aangebracht, kan de officier van justitie bepalen dat de
      vereisten, genoemd in [artikel 2][ref1], niet van toepassing zijn. Hij maakt hiervan melding in het bevel.

      2 Indien het bevel tot het opnemen van vertrouwelijke communicatie is gegeven ter uitvoering van een internationaal
      rechtshulpverzoek, dit bevel betrekking heeft op communicatie die plaatsvindt in een vervoermiddel, en het
      technische hulpmiddel in het buitenland door de buitenlandse autoriteiten op of in het vervoermiddel is
      aangebracht, kan de officier van justitie bepalen dat de vereisten, genoemd in [artikel 3][ref2], niet van
      toepassing zijn. Hij maakt hiervan melding in het bevel.


      [ref1]: https://wetten.overheid.nl/BWBR0010974#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010974#Artikel3
