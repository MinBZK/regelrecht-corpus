  - number: '6'
    text: |-
      1 Indien het technische hulpmiddel voor observatie niet is goedgekeurd en keuring, voorafgaand aan de inzet ervan,
      niet mogelijk is, kan de officier van justitie, ingeval het belang van het onderzoek de inzet van het technische
      hulpmiddel dringend vordert, bepalen dat ter uitvoering van het bevel tot observatie het technische hulpmiddel
      zonder voorafgaande technische goedkeuring wordt ingezet.

      2 Bij toepassing van het eerste lid wordt na afloop van de inzet het technische hulpmiddel door de keuringsdienst
      gekeurd.

      3 Indien het technische hulpmiddel voor observatie of het opnemen van vertrouwelijke communicatie
      niet is goedgekeurd en in gebruik is bij de Binnenlandse Veiligheidsdienst, bedoeld in
      [artikel 8, eerste lid, van de Wet op de inlichtingen- en veiligheidsdiensten][ref1], kan de officier van justitie,
      ingeval het belang van het onderzoek de inzet van het technische hulpmiddel dringend vordert, bepalen dat het
      technische hulpmiddel zonder voorafgaande technische goedkeuring als bedoeld in dit besluit wordt ingezet. Hij
      maakt hiervan melding in het bevel. De inzet van een technisch hulpmiddel als bedoeld in de eerste volzin kan
      uitsluitend plaatsvinden, indien:

      a. de Minister van Binnenlandse Zaken en Koninkrijksrelaties hiertoe toestemming heeft gegeven op basis van een
      daartoe strekkend schriftelijk verzoek van en ondertekend door Onze Minister, gedaan op verzoek van de officier van
      justitie, en

      b. het een technisch hulpmiddel betreft dat niet beschikbaar is bij de regionale politiekorpsen, het Korps
      landelijke politiediensten of bij opsporingsambtenaren als bedoeld in [artikel 141, onderdeel c][ref2], of
      [artikel 142 van het Wetboek van Strafvordering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0010974/2001-02-01#Artikel6
