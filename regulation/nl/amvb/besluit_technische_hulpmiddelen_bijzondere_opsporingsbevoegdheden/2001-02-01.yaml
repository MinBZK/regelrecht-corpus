  - number: '9'
    text: |-
      1 De technische hulpmiddelen voor het opnemen van vertrouwelijke communicatie worden opgeslagen op een centrale
      plaats bij een door de korpsbeheerder aangewezen onderdeel van het Korps landelijke politiediensten.

      2 [Artikel 8, tweede tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010974#Artikel8
    url: https://wetten.overheid.nl/BWBR0010974/2001-02-01#Artikel9
