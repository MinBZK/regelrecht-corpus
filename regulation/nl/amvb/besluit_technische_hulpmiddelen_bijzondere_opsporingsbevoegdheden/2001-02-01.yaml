  - number: '2'
    text: |-
      1 Voor observatie met een technisch hulpmiddel wordt gebruik gemaakt van een technisch hulpmiddel dat is
      goedgekeurd of dat behoort tot de categorie van goedgekeurde standaardconfiguraties.

      2 Een technisch hulpmiddel of een standaardconfiguratie voor observatie wordt slechts goedgekeurd indien het aan de
      volgende vereisten voldoet:

      a. de datum en tijd waarop de signalen worden gedetecteerd en geregistreerd, worden automatisch en doorlopend op de
      gegevensdrager vastgelegd;

      b. de gedetecteerde signalen worden voorzien van een uniek gegeven dat wordt meegezonden en door de
      registratieapparatuur wordt herkend, alvorens de signalen op de gegevensdrager worden geregistreerd;

      c. de transmissie van de gedetecteerde signalen vindt op zodanige wijze plaats dat de inhoud van de ontvangen
      signalen gelijk is aan de inhoud van de gedetecteerde signalen;

      d. de gedetecteerde signalen en de datum- en tijdregistratie worden op een zodanige wijze op de originele
      gegevensdrager geregistreerd dat, indien veranderingen in de geregistreerde signalen of de datum- en
      tijdregistratie worden aangebracht, dit achteraf is vast te stellen;

      e. voorzover mogelijk worden de componenten waaruit het technische hulpmiddel is opgebouwd, op een zodanige
      wijze beveiligd dat, indien technische veranderingen worden aangebracht, dit zo veel mogelijk achteraf is vast
      te stellen.

      3 Indien het technische hulpmiddel voor observatie mede bestaat uit een component die selecteert welke signalen
      worden geregistreerd, dient bij proces-verbaal te worden vastgelegd welk selectiecriterium is gehanteerd. De
      component, bedoeld in de eerste volzin, wordt niet handmatig bediend.
    url: https://wetten.overheid.nl/BWBR0010974/2001-02-01#Artikel2
  - number: '3'
    text: |-
      1 Voor het opnemen van vertrouwelijke communicatie wordt gebruik gemaakt van een technisch hulpmiddel dat is
      goedgekeurd of dat behoort tot de categorie van goedgekeurde standaardconfiguraties.

      2 Een technisch hulpmiddel of een standaardconfiguratie voor het opnemen van vertrouwelijke communicatie wordt
      slechts goedgekeurd indien het aan de volgende vereisten voldoet:

      a. de datum en tijd waarop de signalen worden gedetecteerd en geregistreerd, worden automatisch en doorlopend op de
      gegevensdrager vastgelegd;

      b. de gedetecteerde signalen worden voorzien van een uniek gegeven dat wordt meegezonden en door de
      registratieapparatuur wordt herkend, alvorens de signalen op de gegevensdrager worden geregistreerd;

      c. de transmissie van de gedetecteerde signalen vindt op zodanige wijze plaats dat de inhoud van de ontvangen
      signalen gelijk is aan de inhoud van de gedetecteerde signalen;

      d. de ontvangst en de registratie van de gedetecteerde signalen vindt op zodanige wijze plaats dat de inhoud van de
      gedetecteerde signalen uitsluitend is waar te nemen indien de gedetecteerde signalen zijn geregistreerd;

      e. de gedetecteerde signalen en de datum- en tijdregistratie worden op een zodanige wijze op de originele
      gegevensdrager geregistreerd dat, indien veranderingen in de geregistreerde signalen of de datum- en
      tijdregistratie worden aangebracht, dit achteraf is vast te stellen;

      f. voorzover mogelijk worden de componenten waaruit het technische hulpmiddel is opgebouwd op een zodanige wijze
      beveiligd dat, indien technische veranderingen worden aangebracht, dit zo veel mogelijk achteraf is vast te
      stellen.
    url: https://wetten.overheid.nl/BWBR0010974/2001-02-01#Artikel3
  - number: '4'
    text: |-
      1 Voorafgaand aan en na afloop van de inzet van een technisch hulpmiddel voor observatie controleert een daartoe
      door de korpsbeheerder onderscheidenlijk de werkgever aangewezen en terzake deskundige opsporingsambtenaar of het
      technische hulpmiddel voldoet aan de vereisten, genoemd in [artikel 2][ref1].

      2 Voorafgaand aan en na afloop van de inzet van een technisch hulpmiddel voor het opnemen van vertrouwelijke
      communicatie controleert een daartoe door de korpsbeheerder aangewezen en terzake deskundige opsporingsambtenaar
      van het Korps landelijke politiediensten of het technische hulpmiddel voldoet aan de vereisten, genoemd in
      [artikel 3][ref2].

      3 De opsporingsambtenaar, belast met de controle, maakt van zijn bevindingen proces-verbaal op, dat wordt gezonden
      aan de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0010974#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010974#Artikel3
    url: https://wetten.overheid.nl/BWBR0010974/2001-02-01#Artikel4
