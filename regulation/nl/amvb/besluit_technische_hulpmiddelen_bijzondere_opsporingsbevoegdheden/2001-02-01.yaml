  - number: '8'
    text: |-
      1 Technische hulpmiddelen voor observatie worden opgeslagen op een door de korpsbeheerder aangewezen centrale
      plaats bij het regionale politiekorps of het Korps landelijke politiediensten.

      2 De korpsbeheerder draagt er zorg voor dat de centrale plaats, bedoeld in het eerste lid, beveiligd is en
      uitsluitend toegankelijk voor of onder begeleiding van daartoe geautoriseerd personeel.

      3 Met de opslag van de technische hulpmiddelen is belast een daartoe door de korpsbeheerder aangewezen ambtenaar
      van politie.

      4 Indien een technisch hulpmiddel nodig is voor de uitvoering van een bevel tot observatie, verstrekt de ambtenaar
      van politie, bedoeld in het derde lid, op verzoek van de ambtenaar die met de uitvoering van het bevel is belast
      en onder overlegging door deze van een kopie van het bevel tot observatie, de voor de uitvoering van het bevel
      benodigde technische hulpmiddelen. Indien het bevel mondeling is gegeven, wordt binnen drie dagen alsnog een kopie
      van het schriftelijke bevel overgelegd.

      5 De middelen worden verstrekt voor de periode die nodig is voor de uitvoering van het bevel. Bij de verstrekking
      registreert de ambtenaar, bedoeld in het derde lid, ten minste welk technische hulpmiddel wordt verstrekt, het
      tijdstip en de verwachte duur van de verstrekking en, indien het bevel mondeling is gegeven, de naam van de
      officier van justitie die het bevel heeft gegeven.

      6 De ambtenaar, bedoeld in het derde lid, maakt, na de middelen weer te hebben ontvangen, hiervan aantekening in
      de registratie. Indien aan een van de componenten waaruit het technische hulpmiddel is opgebouwd een technische
      verandering is aangebracht, een component defecten vertoont of de oorspronkelijk aangebrachte beveiliging is
      verwijderd of veranderd, maakt hij hiervan proces-verbaal op. Het proces-verbaal wordt gezonden aan de officier
      van justitie.

      7 Technische hulpmiddelen voor observatie, in gebruik bij opsporingsambtenaren als bedoeld in
      [artikel 141, onderdeel c][ref1], of [artikel 142 van het Wetboek van Strafvordering][ref2], worden opgeslagen op
      een door de werkgever van die opsporingsambtenaar aangewezen centrale plaats. Het tweede tot en met zesde lid zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
