        artikel: '8'
  - number: '10'
    text: |-
      1 Indien de officier van justitie heeft bepaald dat ter uitvoering van een bevel tot observatie met een technisch
      hulpmiddel een besloten plaats, niet zijnde een woning, wordt betreden zonder toestemming van de rechthebbende,
      wordt de besloten plaats betreden en het technische hulpmiddel geplaatst door daartoe door de korpsbeheerder
      onderscheidenlijk de werkgever aangewezen en terzake deskundige opsporingsambtenaren.

      2 De opsporingsambtenaar, belast met het betreden van de besloten plaats, maakt van het betreden proces-verbaal op,
      dat wordt gezonden aan de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0010974/2001-02-01#Artikel10
  - number: '11'
    text: |-
      1 Indien de officier van justitie heeft bepaald dat ter uitvoering van een bevel tot het opnemen van vertrouwelijke
      communicatie een woning of andere besloten plaats wordt betreden zonder toestemming van de rechthebbende,
      wordt de woning of andere besloten plaats betreden en het technische hulpmiddel geplaatst door daartoe door
      de korpsbeheerder aangewezen ambtenaren van het Korps landelijke politiediensten, die voldoen aan de door Onze
      Minister vast te stellen eisen.

      2 De ambtenaar van politie, belast met het betreden van de woning of andere besloten plaats, maakt van het betreden
      proces-verbaal op, dat wordt gezonden aan de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0010974/2001-02-01#Artikel11
  - number: '12'
    text: |-
      1 Indien daardoor de waarneming van de geregistreerde signalen kan worden verbeterd, kunnen de signalen zo nodig
      technisch worden bewerkt.

      2 Voor de bewerking wordt gebruik gemaakt van een kopie van de originele gegevensdrager. De originele
      gegevensdrager wordt gewaarmerkt en opgeslagen in de staat waarin hij zich direct na de beëindiging van de
      registratie van de signalen bevond.

      3 Van de technische bewerking wordt iedere stap, zo mogelijk automatisch, vastgelegd, zodat na afloop van de
      bewerking een volledige reconstructie van de bewerking kan worden gegeven.

      4 Indien de technische bewerking betrekking heeft op signalen die zijn geregistreerd ter uitvoering van een bevel
      tot observatie met een technisch hulpmiddel, wordt de bewerking uitgevoerd door een daartoe door de korpsbeheerder
      onderscheidenlijk de werkgever aangewezen en terzake deskundige ambtenaar.

      5 Indien de technische bewerking betrekking heeft op signalen die zijn geregistreerd ter uitvoering van een
      bevel tot het opnemen van vertrouwelijke communicatie, wordt de bewerking uitgevoerd door een daartoe door de
      korpsbeheerder aangewezen ambtenaar van het Korps landelijke politiediensten, die voldoet aan de bij ministeriële
      regeling van Onze Minister te stellen eisen.

      6 Van de technische bewerking wordt een proces-verbaal opgemaakt, waarin het proces van bewerking in hoofdlijnen
      wordt beschreven.

      7 De officier van justitie kan bepalen dat een technische bewerking wordt uitgevoerd door een deskundige, niet
      zijnde een ambtenaar als bedoeld in het vierde of vijfde lid. Het tweede en derde lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0010974/2001-02-01#Artikel12
  - number: '13'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit kan een
      ander tijdstip worden vastgesteld waarop de [artikelen 2][ref1] en [4, eerste lid][ref2], in werking treden.


