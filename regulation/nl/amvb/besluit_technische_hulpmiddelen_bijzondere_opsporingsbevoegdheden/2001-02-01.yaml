  - number: '5'
    text: |-
      1 De keuringsdienst legt de wijze waarop hij vaststelt of een technisch hulpmiddel of een standaardconfiguratie
      voldoet aan de vereisten, genoemd in [artikel 2][ref1] onderscheidenlijk [artikel 3][ref2], vast in een
      keuringsprotocol, dat voorafgaande goedkeuring behoeft van Onze Minister.

      2 De keuringsdienst legt de uitslag van de keuring vast in een keuringsrapport. Op basis van het keuringsrapport
      kan Onze Minister een verklaring van goedkeuring afgeven.

      3 De keuringsdienst houdt een registratie bij van alle goedgekeurde standaardconfiguraties.

      4 Voor elk technisch hulpmiddel dat is goedgekeurd heeft de keuringsdienst een verklaring beschikbaar, inhoudende:

      a. dat het technische hulpmiddel voldoet aan de vereisten, genoemd in [artikel 2][ref3] onderscheidenlijk
      [artikel 3][ref4], en

      b. de duur van de periode gedurende welke het technische hulpmiddel naar redelijke verwachting zal voldoen aan
      deze vereisten.

      5 De verklaring van goedkeuring van het technische hulpmiddel of de standaardconfiguratie vervalt indien:

      a. aan een van de componenten waaruit het technische hulpmiddel of de standaardconfiguratie is opgebouwd
      veranderingen zijn aangebracht, tenzij het technische hulpmiddel of de standaardconfiguratie, ondanks de
      veranderingen, kennelijk nog steeds voldoet aan de vereisten, genoemd in [artikel 2][ref5] onderscheidenlijk
      [artikel 3][ref6], of

      b. de periode, bedoeld in het vierde lid, onderdeel b, is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0010974#Artikel2
