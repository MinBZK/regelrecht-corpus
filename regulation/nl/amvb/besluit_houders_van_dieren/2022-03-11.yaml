      - id: ref2
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 6.7.1
    text: |-
      Een aanmelding bij Onze Minister die is verricht op grond van
      [artikel 3, eerste lid van het Honden- en kattenbesluit 1999][ref1], zoals dat gold onmiddellijk voor het tijdstip
      van intrekking van dat besluit, geldt als een aanmelding als bedoeld in [artikel 3.8, eerste lid][ref2], voor
      activiteiten met honden of katten, voor zover die activiteiten bij die eerdere aanmelding zijn gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0010200#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.7
