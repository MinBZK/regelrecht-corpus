  - number: 1.4.2
    text: |-
      Het verbod, bedoeld in [artikel 2.2, eerste lid, van de wet][ref1], is uitsluitend van toepassing op zoogdieren.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
