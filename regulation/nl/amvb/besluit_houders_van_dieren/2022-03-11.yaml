articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *bedrijfsbehandelplan:* een overzicht
      dat specifiek is voor een bedrijf, waarin aandoeningen en ziektes zijn opgenomen die voorkomen of waarvan het
      aannemelijk is dat deze voor kunnen komen bij door een houder gehouden dieren en waarbij is weergegeven op welke
      wijze de aandoeningen en ziektes worden behandeld;
        - *bedrijfsgezondheidsplan:* een plan dat specifiek is voor een bedrijf, bestaande uit: 1°. een analyse van
      de diergezondheidssituatie van door een houder gehouden dieren en van de toepassing van diergeneesmiddelen
      bij door een houder gehouden dieren; 2°. een overzicht van te treffen maatregelen ter verbetering van de
      diergezondheidssituatie van door een houder gehouden dieren;
        - *big:* varken vanaf de geboorte tot aan het spenen;
        - *daarmee verband houdende activiteiten:* datgene dat daaronder wordt verstaan in artikel 2, onderdeel b, van
      verordening (EG) nr. 1099/2009;
        - *derde land:* land, niet zijnde een lidstaat van de Europese Unie of een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte;
        - *evenhoevigen:* runderen, varkens, schapen, geiten of hertachtigen;
        - *gezelschapsdier:* zoogdier, vogel, vis, reptiel of amfibie, kennelijk bestemd om te houden voor liefhebberij of
      gezelschap, met uitzondering van een dier dat behoort tot een in bijlage II bij dit besluit opgenomen diersoort of
      diercategorie, niet zijnde konijn, bruine rat, tamme muis, cavia, goudhamster en gerbil;
        - *pluimvee:* hoenderachtigen, eenden of ganzen;
        - *richtlijn nr. 2003/99/EG:* [richtlijn 2003/99/EG](32003L0099) van het Europees Parlement en de Raad van de
      Europese Unie van 17 november 2003 inzake de bewaking van zoönosen en zoönoseverwekkers en houdende wijziging van
      Beschikking 90/424/EEG van de Raad en intrekking van [Richtlijn 92/117/EEG](31992L0117) van de Raad (PbEU 2003,
      L 325);
        - *spermawininrichting:* inrichting voor levende producten waar sperma wordt gewonnen, geproduceerd, verwerkt of
      opgeslagen;
        - *varken:* varken dat kennelijk wordt gehouden voor de fokkerij of voor de mesterij;
        - *verordening (EG) nr. 178/2002:* verordening (EG) nr. 178/2002 van het Europees Parlement en de Raad van
      28 januari 2002 tot vaststelling van de algemene beginselen en voorschriften van de levensmiddelenwetgeving,
      tot oprichting van een Europese Autoriteit voor voedselveiligheid en tot vaststelling van procedures voor
      voedselveiligheidsaangelegenheden (PbEU 2002, L 31);
        - *verordening (EG) nr. 1099/2009:* verordening (EG) nr. 1099/2009 van de Raad van 24 september 2009 inzake de
      bescherming van dieren bij het doden (PbEU 2009, L 303);
        - *verordening (EU) nr. 576/2013:* verordening (EU) nr. 576/2013 van het Europees Parlement en de Raad van
      12 juni 2013 betreffende het niet-commerciële verkeer van gezelschapsdieren en tot intrekking van Verordening (EG)
      nr. 998/2003 (PbEU 2012, L 178);
        - *verordening (EU) nr. 2016/429:* verordening (EU) 2016/429 van het Europees Parlement en de Raad van 9 maart 2016
      betreffende overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen op het gebied van
      diergezondheid («diergezondheidswetgeving») (PbEU 2016, L84);
        - *verzamelcentrum:* inrichting voor het verzamelen van hoefdieren of pluimvee van waaruit dieren worden verplaatst
      of die dieren ontvangt;
        - *wet:* [Wet dieren][ref1];
        - *zeug:* varken van het vrouwelijk geslacht na de worp van haar eerste biggen, kennelijk bestemd voor de fokkerij.


      [ref1]: https://wetten.overheid.nl/BWBR0030250
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.1
