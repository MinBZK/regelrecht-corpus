  - number: 6.4.3
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing indien in de desbetreffende inrichting na het tijdstip waarop
      dit artikel in werking treedt, meer dan een jaar geen dieren zonder voorafgaande bedwelming volgens de islamitische
      of israëlitische ritus zijn geslacht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.4
  - number: 6.5.1
    text: |-
