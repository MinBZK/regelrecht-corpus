    text: |-
      andere gezelschapsdieren dan honden en katten gedurende een periode van vijf jaar vanaf het tijdstip van
      inwerkingtreding van dat artikel niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.5
  - number: 6.6.1
    text: |-
      [Artikel 3.11, eerste lid][ref1], is gedurende een periode van vijf jaar vanaf het tijdstip van inwerkingtreding
      van dit artikel niet van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.6
