      van dat artikel niet van toepassing op een inrichting, indien degene onder wiens verantwoordelijkheid de in
      [artikel 3.6][ref2] bedoelde activiteiten op die inrichting worden verricht:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.7
