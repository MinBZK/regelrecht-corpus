  - number: 6.9.1
    text: |-
      Het [Honden- en Kattenbesluit 1999][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010200
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0010200
  - number: 6.9.2
    text: |-
      In afwijking van het eerste lid blijven de artikelen van het [Honden- en kattenbesluit 1999][ref1] van
      toepassing, zoals dat gold onmiddellijk voor het tijdstip van intrekking van dat besluit, op inrichtingen van
      waaruit honden en katten worden betrokken door inrichtingen die dierproeven verrichten, met inachtneming van
      [artikel 27 van het Honden- en kattenbesluit 1999][ref2], tot het tijdstip waarop de wijziging van de Wet op de
      dierproeven ter implementatie van Richtlijn 2010/63 van het Europees Parlement en de Raad van 22 september 2010
      betreffende de bescherming van dieren die voor wetenschappelijke doeleinden worden gebruikt (PbEU L 276) in werking
      is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0010200
      [ref2]: https://wetten.overheid.nl/BWBR0010200#Artikel27
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.9
    references:
