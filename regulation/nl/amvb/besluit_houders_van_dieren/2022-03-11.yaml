  - number: 1.5.1
    text: Deze paragraaf is van toepassing op zoogdieren, reptielen, amfibieën, vogels en vissen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.5
  - number: 1.5.2
    text: |-
      [Artikel 1.6, vierde lid][ref1], is tevens van toepassing op insecten.


