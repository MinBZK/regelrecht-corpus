    text: |-
      Het erkende bewijs van vakbekwaamheid op basis van het [Honden- en kattenbesluit 1999][ref1], zoals dat gold
      onmiddellijk voor het tijdstip van intrekking van dat besluit, geldt als bewijs van vakbekwaamheid als bedoeld in
      [artikel 3.11][ref2], voor zover activiteiten worden verricht met honden en katten.


      [ref1]: https://wetten.overheid.nl/BWBR0010200
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.6
