  - number: 1.6.1
    text: |-
      De bewegingsvrijheid van een dier wordt niet op zodanige wijze beperkt dat het dier daardoor onnodig lijden of
      letsel wordt toegebracht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.6
  - number: 1.6.2
    text: Een dier wordt voldoende ruimte gelaten voor zijn fysiologische en ethologische behoeften.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.6
  - number: 1.6.3
    text: |-
      Een dier wordt, indien het niet in een gebouw wordt gehouden, bescherming geboden tegen slechte
      weersomstandigheden, gezondheidsrisico’s en zo nodig roofdieren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.6
  - number: 1.6.4
    text: |-
      De houder van een dier dat in een gebouw of kooi wordt gehouden, draagt er zorg voor dat het dier daaruit niet
      kan ontsnappen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.6
  - number: '1.7'
    text: 'Degene die een dier houdt, draagt er zorg voor dat een dier:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.7
  - number: 1.7.a
    text: wordt verzorgd door een persoon die beschikt over de voor die verzorging nodige kennis en vaardigheden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.7
  - number: 1.7.b
    text: slechts onder de hoede wordt gesteld van een persoon die kennelijk tot de verzorging in staat is;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.7
  - number: 1.7.c
    text: dat ziek of gewond lijkt onmiddellijk op passende wijze wordt verzorgd;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.7
  - number: 1.7.d
    text: een toereikende behuizing heeft onder voldoende hygiënische omstandigheden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.7
  - number: 1.7.e
    text: |-
      een voor dat dier toereikende hoeveelheid gezond en voor de soort en de leeftijd geschikt voer krijgt toegediend op
      een wijze die past bij het ontwikkelingsstadium van het dier;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.7
  - number: 1.7.f
    text: |-
      toegang heeft tot een toereikende hoeveelheid water van passende kwaliteit of op een andere wijze aan zijn behoefte
      aan water kan voldoen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.7
  - number: 1.7.g
    text: voldoende verse lucht of zuurstof krijgt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.7
  - number: 1.8.1
    text: |-
      Een ruimte waarin een dier wordt gehouden, wordt voldoende verlicht en verduisterd om aan de ethologische en
      fysiologische behoeften van het dier te voldoen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.8
  - number: 1.8.2
    text: |-
      Behuizingen, waaronder begrepen de vloer, waarin een dier verblijft en inrichtingen voor de beschutting voor
      een dier zijn op zodanige wijze ontworpen, gebouwd en onderhouden dat bij de dieren geen letsel of pijn wordt
      veroorzaakt en bevatten geen scherpe randen of uitsteeksels waaraan het dier zich kan verwonden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.8
  - number: 1.8.3
    text: |-
      In de ruimte waarin een dier wordt gehouden, worden geen materialen en, in voorkomend geval, bodemdekking gebruikt
      die ongeschikt of schadelijk zijn voor het dier.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.8
  - number: 1.8.4
    text: De materialen, bedoeld in het derde lid, kunnen eenvoudig worden gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.8
  - number: '1.9'
    text: |-
      Als diercategorieën als bedoeld in [artikel 2.10, eerste lid, van de wet][ref1] worden aangewezen ganzen, honden
      en katten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: '1.10'
    text: |-
      Als gevallen als bedoeld in [artikel 2.10, eerste lid, van de wet][ref1] worden aangewezen gevallen waarin:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 1.10.a
    text: een dier wordt gedood ter beëindiging of voorkoming van onmiddellijk gevaar voor mens of dier;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.10
  - number: 1.10.b
    text: een dierenarts heeft vastgesteld dat doden in het belang van het dier is;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.10
  - number: 1.10.c
    text: dat doden bij of krachtens enig wettelijk voorschrift of ingevolge een EU-verordening is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.10
  - number: 1.10.d
    text: een dier wordt gedood ter beëindiging van ondraaglijk lijden van het dier;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.10
  - number: 1.10.e
    text: een dier wordt gedood vanwege niet te corrigeren gevaarlijke gedragskenmerken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.10
  - number: '1.11'
    text: |-
      De [artikelen 1.12 tot en met 1.14][ref1] zijn van toepassing op zoogdieren, reptielen, amfibieën en vogels.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '1.12'
    text: |-
      Bij het doden van dieren en daarmee verband houdende activiteiten wordt de dieren elke vermijdbare vorm van pijn,
      spanning of lijden bespaard.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.12
  - number: 1.13.1
    text: |-
      Een dier wordt gedood door middel van een methode die waarborgt dat de dood onmiddellijk of na bedwelming, maar
      vóórdat de bewusteloosheid is geweken, intreedt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.13
  - number: 1.13.2
    text: 'In afwijking van het eerste lid behoeft een dier niet te worden bedwelmd indien een dier moet worden gedood:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.13
  - number: 1.13.2.a
    text: ter beëindiging of voorkoming van onmiddellijk gevaar voor mens of dier of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.13
  - number: 1.13.2.b
    text: ter beëindiging van ondraaglijk lijden van het dier.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.13
  - number: 1.13.3
    text: |-
      Bij ministeriële regeling kunnen voor de daarin te onderscheiden diersoorten of categorieën dieren nadere regels
      worden gesteld ten aanzien van de methode, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.13
  - number: 1.14.1
    text: |-
      Het doden van dieren en daarmee verband houdende activiteiten worden uitgevoerd door personen die aantoonbaar de
      nodige kennis en vaardigheden bezitten om de taken humaan en doeltreffend uit te voeren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.14
  - number: 1.14.2
    text: |-
      Bij ministeriële regeling kunnen voor de daarin te onderscheiden diersoorten of categorieën dieren nadere regels
      worden gesteld ten aanzien van de in het eerste lid bedoelde kennis en vaardigheden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.14
  - number: '1.15'
    text: |-
      In deze paragraaf wordt verstaan onder: - *voortplantingstechniek:* handeling of direct met elkaar samenhangende
      handelingen, bestemd om geslachtsproducten te winnen, bevruchting tot stand te brengen met behulp van gewonnen
      geslachtsproducten, of dracht tot stand te brengen op andere dan natuurlijke wijze, alsmede handelingen die
      bijdragen aan het tot stand brengen van dracht;
        - *geslachtsproducten:* sperma, eicellen en embryo's alsmede delen daarvan.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.15
  - number: '1.16'
    text: Deze paragraaf is van toepassing op zoogdieren, reptielen, vissen, amfibieën en vogels.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.16
  - number: 1.17.1
    text: |-
      Voortplantingstechnieken worden toegepast op zodanige wijze dat bij het dier niet onnodig pijn, letsel, stress of
      ander ongerief wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.17
  - number: 1.17.2
    text: Het is verboden sperma te winnen door middel van elektrische prikkeling.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.17
  - number: 1.17.3
    text: |-
      Het tweede lid geldt niet voor spermawinning ten behoeve van een door de European Association of Zoos and Aquaria
      gecoördineerd Europees fokprogramma, mits het dier onder algehele narcose is gebracht en de elektrische prikkeling
      geschiedt door of onder toezicht van een dierenarts.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.17
  - number: '1.18'
    text: |-
      Het is verboden bij het vissen in de wateren, bedoeld in
      [artikel 1, vierde lid, onderdelen c en d, van de Visserijwet 1963][ref1], levende vissen, amfibieën, reptielen,
      vogels of zoogdieren als aas te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '1.19'
    text: |-
      Als diercategorieën als bedoeld in [artikel 2.2, zevende lid, van de wet][ref1] worden aangewezen honden, katten,
      konijnen, papegaaiachtigen, apen behorende tot de soort van de Chimpansee, de Rhesus-aap, de Beermakaak, de Java-
      aap, de Marmoset, de Doeroecoeli of de Doodshoofdaap, varkens en nertsen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 1.20.1
    text: |-
      De leeftijd, bedoeld in [artikel 2.2, zevende lid, van de wet][ref1], is voor:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 1.20.1.a
    text: 'honden: 7 weken;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.1.b
    text: 'katten: 7 weken;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.1.c
    text: 'konijnen: 6 weken;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.1.d
    text: |-
      papegaaiachtigen: de voor de desbetreffende soort papegaaiachtigen in [bijlage I][ref1] bij dit besluit vermelde
      leeftijd;


      [ref1]: https://wetten.overheid.nl/BWBR0035217
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0035217
  - number: 1.20.1.e
    text: 'Chimpansees: 4,5 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.1.f
    text: 'Rhesus-apen: 1 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.1.g
    text: 'Beermakaken: 1 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.1.h
    text: 'Java-apen: 1 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.1.i
    text: 'Marmosets: 1 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.1.j
    text: 'Doeroecoeli’s: 1,5 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.1.k
    text: 'Doodshoofdapen: 9 maanden;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.1.l
    text: 'varkens: 28 dagen;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.1.m
    text: 'nertsen: 8 weken.'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.2
    text: |-
      In afwijking van het eerste lid, is de leeftijd, bedoeld in [artikel 2.2, zevende lid, van de wet][ref1] voor
      konijnen:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 1.20.2.a
    text: |-
      4 weken, indien de konijnen op het geboortebedrijf verblijven totdat zij ten minste de leeftijd, bedoeld in het
      eerste lid, hebben bereikt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.2.b
    text: |-
      5 weken, indien de konijnen na hun geboorte worden vervoerd vanaf het geboortebedrijf naar een ander bedrijf
      waar zij worden gehouden tot aan het moment waarop zij worden gedood met het oog op de productie van dierlijke
      producten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.3
    text: |-
      In afwijking van het eerste lid, is de leeftijd, bedoeld in [artikel 2.2, zevende lid, van de wet][ref1], voor
      varkens 21 dagen, indien de biggen naar gespecialiseerde voorzieningen worden gebracht die:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 1.20.3.a
    text: |-
      volledig worden leeggemaakt en grondig zijn gereinigd en ontsmet voordat een nieuwe groep biggen is binnengebracht,
      en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.3.b
    text: |-
      gescheiden zijn van de voorzieningen waar zeugen zijn gehouden om het overdragen van ziekten op de biggen zo veel
      mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.4
    text: |-
      Ingeval apen vallen onder het bepaalde in [artikel 1b, eerste lid, van de Wet op de dierproeven][ref1], is in
      afwijking van het eerste lid, de leeftijd, bedoeld in [artikel 2.2, zevende lid, van de wet][ref2], voor:


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 1b
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 1.20.4.a
    text: 'Chimpansees: 4 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.4.b
    text: 'Rhesus-apen: 2 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.4.c
    text: 'Beermakaken: 2 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.4.d
    text: 'Java-apen: 2 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.4.e
    text: 'Marmosets: 1 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.4.f
    text: 'Doeroecoeli’s: 1,5 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.4.g
    text: 'Doodshoofdapen: 9 maanden.'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.5
    text: |-
      Indien de apen, bedoeld in het vierde lid, onmiddellijk na het scheiden worden ondergebracht
      in groepen met soortgenoten, is, in afwijking van het vierde lid, de leeftijd, bedoeld in
      [artikel 2.2, zevende lid, van de wet][ref1], voor:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 1.20.5.a
    text: 'Chimpansees: 3 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.5.b
    text: 'Rhesus-apen: 1 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.5.c
    text: 'Beermakaken: 1 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.5.d
    text: 'Java-apen: 1 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.5.e
    text: 'Marmosets: 6 maanden;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.5.f
    text: 'Doeroecoeli’s: 1 jaar;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.5.g
    text: 'Doodshoofdapen: 7 maanden.'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
  - number: 1.20.6
    text: |-
      [Artikel 2.2, zevende lid, van de wet][ref1], is niet van toepassing indien de houder aannemelijk kan maken dat het
      scheiden van een dier van het ouderdier noodzakelijk is met het oog op de gezondheid en het welzijn van het dier of
      het ouderdier.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: '1.21'
    text: |-
      Als lichamelijke ingreep als bedoeld in [artikel 2.9, derde lid, van de wet][ref1] wordt aangewezen het door de
      houder van een dier bij dat dier toepassen van een diergeneesmiddel, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.21
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 1.21.a
    text: |-
      toepassing van het diergeneesmiddel niet met toepassing van [artikel 5.3, eerste lid, van het Besluit
      diergeneesmiddelen 2022](onbekend) is voorbehouden aan een dierenarts;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.21
  - number: 1.21.b
    text: |-
      de lichamelijke ingreep onderdeel is van de voor dat diergeneesmiddel in de bijsluiter voorgeschreven
      toedieningswijze en toedieningsweg;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.21
  - number: 1.21.c
    text: de toepassing subcutaan of intramusculair plaatsvindt; en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.21
  - number: 1.21.d
    text: de handeling niet krachtens een ander wettelijk voorschrift aan anderen is voorbehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.21
  - number: '1.22'
    text: |-
      Een houder van een dier heeft geen diergeneesmiddel of gemedicineerd diervoeder aanwezig in de ruimte, op het
      terrein waar dieren worden gehouden of in de nabijheid van de ruimte of het terrein waar dieren worden gehouden,
      indien toepassing van dit diergeneesmiddel of gemedicineerd diervoeder bij deze dieren:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.22
  - number: 1.22.a
    text: |-
      is voorbehouden aan een dierenarts of een andere persoon die is toegelaten tot het beroepsmatig verrichten van
      diergeneeskundige handelingen op grond van [artikel 5.3, eerste lid, van het Besluit diergeneesmiddelen 2022]
      (onbekend); of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.22
  - number: 1.22.b
    text: |-
      niet is toegestaan volgens de informatie die krachtens verordening (EU) nr. 2019/6 is aangebracht op de verpakking
      van het diergeneesmiddel of gemedicineerd diervoeder of bij deze verpakking is gevoegd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.22
  - number: '1.25'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de administratie van de ontvangst en toepassing van
      diergeneesmiddelen en gemedicineerde diervoeders door de houder van een dier en over het administreren van gegevens
      inzake het zich ontdoen van resten en lege verpakkingen van diergeneesmiddelen en gemedicineerde diervoeders.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.25
  - number: '1.26'
    text: |-
      Het is degene die een dier houdt verboden de diergeneesmiddelen, bedoeld in
      [artikel 5.7, eerste lid, van het Besluit diergeneeskundigen][ref1] toe te passen, indien uit de in dat lid
      bedoelde gevoeligheidsbepaling blijkt dat andere diergeneesmiddelen toepasbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.26
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '5'
  - number: 1.27.1
    text: |-
      Een houder van dieren die bij ministeriële regeling aan te wijzen diergeneesmiddelen ontvangt, doet in bij
      ministeriële regeling aan te wijzen gevallen melding in een register dat daartoe door Onze Minister is aangewezen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.27
  - number: 1.27.2
    text: |-
      De beheerder van een register verstrekt aan de houder van dieren, op basis van de melding, informatie over het
      gebruik van de betreffende diergeneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.27
  - number: 1.27.3
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.27
  - number: 1.27.3.a
    text: de gegevens die bij de melding worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.27
  - number: 1.27.3.b
    text: de termijn waarbinnen de melding wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.27
  - number: 1.27.3.c
    text: de aard van de informatie die wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.27
  - number: 1.27.4
    text: |-
      Tarieven voor een vergoeding die de beheerder van een register in rekening brengt voor het verwerken van een
      melding als bedoeld in het eerste lid, en het verstrekken van informatie als bedoeld in het tweede lid, behoeven de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.27
  - number: 1.27.5
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.27
  - number: 1.27.5.a
    text: |-
      de voorwaarden voor aanwijzing van registers en de gevallen waarin een aanwijzing kan worden ingetrokken, dan wel
      geschorst;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.27
  - number: 1.27.5.b
    text: |-
      goedkeuring van tarieven en de gevallen waarin een besluit tot goedkeuring kan worden ingetrokken, dan wel
      geschorst.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.27
  - number: 1.28.1
    text: |-
      Een houder van dieren draagt er in bij ministeriële regeling aan te wijzen gevallen zorg voor dat er overeenkomstig
      [artikel 5.9, eerste lid, van het Besluit diergeneeskundigen][ref1] een bedrijfsgezondheidsplan en een
      bedrijfsbehandelplan worden opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.28
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '5'
  - number: 1.28.2
    text: |-
      Een houder van dieren handelt overeenkomstig het bedrijfsgezondheidsplan en het bedrijfsbehandelplan dat in overleg
      met hem is opgesteld, tenzij een diergeneeskundige noodzaak vereist dat hiervan wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.28
  - number: 1.28.3
    text: |-
      [Artikel 5.9, derde lid, van het Besluit diergeneeskundigen][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.28
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '5'
  - number: 1.32.1
    text: Onze Minister is de bevoegde autoriteit, bedoeld in artikel 3, tweede lid, van [richtlijn 2003/99/EG](32003L0099).
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.32
  - number: 1.32.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de implementatie van [richtlijn 2003/99/EG](32003L0099)
      over de aanwezigheid van zoönosen en zoönoseverwekkers en antimicrobiële resistentie bij zoönoseverwekkers en
      andere verwekkers die een gevaar opleveren voor de volksgezondheid, met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.32
  - number: 1.32.2.a
    text: het doen van onderzoek;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.32
  - number: 1.32.2.b
    text: het bewaren van gegevens, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.32
  - number: 1.32.2.c
    text: het ter beschikking stellen van onderzoeksresultaten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.32
  - number: 1.32.3
    text: |-
      De regels, bedoeld in het tweede lid, worden vastgesteld in overeenstemming met Onze Minister van Volksgezondheid,
      Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.32
  - number: '1.33'
    text: |-
      Een exploitant van een levensmiddelenbedrijf als bedoeld in artikel 3, derde lid, van verordening (EG)
      nr. 178/2002, die onderzoek doet naar de aanwezigheid van zoönosen of zoönoseverwekkers die overeenkomstig artikel
      4, tweede lid, van [richtlijn 2003/99/EG](32003L0099) worden bewaakt:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.33
  - number: 1.33.a
    text: 'houdt de resultaten van dat onderzoek bij:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.33
  - number: 1.33.b
    text: bewaart de onderzoeksgegevens en de relevante isolaten gedurende twee jaar, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.33
  - number: 1.33.c
    text: stelt de onderzoeksresultaten of relevante isolaten op verzoek ter beschikking aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.33
  - number: 1.34.1
    text: |-
      Het is toegestaan om hoefdieren te verzamelen op een vervoermiddel als bedoeld in artikel 133, tweede lid, van
      verordening (EU) nr. 2016/429, indien is voldaan aan de voorwaarden, bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.34
  - number: 1.34.2
    text: |-
      Het eerste lid is niet van toepassing op varkens, met uitzondering van varkens die kennelijk bestemd zijn voor
      de slacht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.34
  - number: 1.35.1
    text: |-
      Bij het verzamelen, bedoeld in [artikel 1.34][ref1], is het toegestaan evenhoevigen ten hoogste een keer over te
      laden van een vervoermiddel op een bij dat vervoermiddel behorende achterwagen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.35
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '8'
  - number: 1.35.1.a
    text: bij het overladen alle aanwezige dieren worden verplaatst naar de achterwagen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.35
  - number: 1.35.1.b
    text: |-
      het overladen van dieren plaatsvindt op een inrichting als bedoeld in [artikel 2.10a][ref1] of [2.10c][ref2] of een
      andere inrichting die voldoet aan de krachtens artikel 2.10a gestelde regels; en


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.35
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 3a
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 3a
  - number: 1.35.1.c
    text: het lege vervoermiddel na het overladen wordt gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.35
  - number: 1.35.2
    text: |-
      In afwijking van het eerste lid, aanhef is het overladen voor runderen die kennelijk bestemd zijn voor de slacht
      ten hoogste twee keer toegestaan en is het hierbij, in afwijking van het eerste lid, onderdelen a en c, toegestaan
      mannelijke runderen die kennelijk bestemd zijn voor de slacht en die ouder zijn dan 12 maanden niet te verplaatsen
      van de voorwagen naar de achterwagen en enkel de kritische delen van het vervoermiddel te reinigen en ontsmetten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.35
  - number: '1.36'
    text: |-
      De exploitant van een verzamelcentrum meldt de aanvang en het einde van de periode waarin dieren op een
      verzamelcentrum worden gehouden uiterlijk om 8:00 uur op de werkdag voor aanvang van die periode bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.36
  - number: 1.37.1
    text: |-
      Indien een vervoermiddel waarmee evenhoevigen worden vervoerd op verschillende adressen wordt geladen,
      onderscheidenlijk gelost, wordt voldaan aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.37
  - number: 1.37.1.a
    text: het laden, onderscheidenlijk lossen van het vervoermiddel vindt telkens buiten de stal plaats; en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.37
  - number: 1.37.1.b
    text: |-
      na het laden, onderscheidenlijk lossen worden telkens de kritische delen van het vervoermiddel gereinigd en
      ontsmet.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.37
  - number: 1.37.2
    text: 'Bij ministeriële regeling kunnen per diercategorie regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.37
  - number: 1.37.2.a
    text: het aantal adressen waarop ten hoogste wordt geladen en gelost;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.37
  - number: 1.37.2.b
    text: de inrichting waar wordt geladen en gelost;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.37
  - number: 1.37.2.c
    text: de aard van het vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.37
  - number: '1.38'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de gegevens die een vervoeder bijhoudt, bedoeld in
      artikel 104 en de op artikel 106 van verordening (EU) nr. 2016/429 vastgestelde gedelegeerde verordening, met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.38
  - number: 1.38.a
    text: de termijn waarbinnen de vervoerder de gegevens bijhoudt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.38
  - number: 1.38.b
    text: de termijn waarbinnen de vervoerder de gegevens bewaart;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.38
  - number: 1.38.c
    text: de wijze waarop de gegevens worden bijgehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.38
  - number: 1.39.1
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het verblijf van evenhoevigen op een inrichting nadat
      die dieren of andere dieren op die inrichting zijn aangevoerd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.39
  - number: 1.39.2
    text: 'De regels, bedoeld in het eerste lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.39
  - number: 1.39.2.a
    text: de aard en indeling van deinrichting;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.39
  - number: 1.39.2.b
    text: de minimale verblijfsduur op een inrichting;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.39
  - number: 1.39.2.c
    text: de soorten of categorieën dieren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.39
  - number: '1.40'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de toepasselijkheid van artikel 97, eerste lid, onderdelen
      a, b, c, d en e, van verordening (EU) nr. 2016/429 en de krachtens het tweede lid, onderdelen a, c, d en e,
      van dat artikel vastgestelde gedelegeerde verordening op inrichtingen voor de verzameling van hoefdieren van
      waaruit slechts dieren worden verplaatst naar een inrichting in Nederland en die slechts dieren ontvangen van een
      inrichting in Nederland.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.40
  - number: 1.41.1
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de toepasselijkheid van de krachtens artikel 135 van
      verordening (EU) nr. 2016/429 vastgestelde gedelegeerde verordening op het verzamelen van uit Nederland afkomstige
      dieren die worden vervoerd naar een inrichting in Nederland.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.41
  - number: 1.41.2
    text: |-
      In aanvulling op de regels, bedoeld in het eerste lid, kunnen bij ministeriële regeling regels worden gesteld met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.41
  - number: 1.41.2.a
    text: het verzamelen van bepaalde diersoorten of diercategorieën;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.41
  - number: 1.41.2.b
    text: het aantal toegestane verzamelingen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.41
  - number: 1.41.2.c
    text: de herkomst, bestemming of eindbestemming van de dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.41
  - number: 1.41.2.d
    text: het melden van bepaalde houderijen bij Onze Minister;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.41
  - number: 1.41.2.e
    text: de registratie van verplaatsing van dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.41
  - number: 1.41.2.f
    text: de aanvang en het einde van de periode waarin dieren op een verzamelcentrum worden gehouden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.41
  - number: 1.41.2.g
    text: de reiniging en ontsmetting na een verzamelperiode.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.41
  - number: '1.42'
    text: |-
      Artikel 126, tweede lid, van verordening (EU) nr. 2016/429 is van overeenkomstige toepassing op het verplaatsen van
      evenhoevigen en pluimvee van een inrichting in Nederland naar een andere inrichting in Nederland.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.42
  - number: 1.43.1
    text: |-
      In aanvulling op de gegevens, bedoeld in artikel 104 van verordening (EU) nr. 2016/429, houdt een vervoerder die
      hoefdieren of pluimvee telkens uitsluitend binnen Nederland vervoert, over elk vervoermiddel de volgende gegevens
      bij:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.43
  - number: 1.43.1.a
    text: het kenteken- of registratienummer;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.43
  - number: 1.43.1.b
    text: de data en de tijdstippen waarop de dieren bij de inrichting van oorsprong worden ingeladen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.43
  - number: 1.43.1.c
    text: de naam, het adres en het unieke registratie- of erkenningsnummer van elke bezochte inrichting;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.43
  - number: 1.43.1.d
    text: de data en tijdstippen waarop de dieren bij de inrichting van bestemming worden uitgeladen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.43
  - number: 1.43.1.e
    text: de data en plaatsen van de reiniging, ontsmetting en desinfestatie van vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.43
  - number: 1.43.1.f
    text: de referentienummers van de documenten die de dieren vergezellen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.43
  - number: 1.43.2
    text: Een vervoerder bewaart de gegevens, bedoeld in het eerste lid, drie jaar.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.43
  - number: 1.44.1
    text: |-
      Het is verboden schapen of geiten te insemineren of zo te houden dat bevruchting kan plaatsvinden van schapen
      of geiten die op een inrichting waar een besmetting met Q-koorts is vastgesteld aanwezig zijn geweest tussen het
      tijdstip waarop die besmetting is vastgesteld en 1 juni 2010.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.44
  - number: 1.44.2
    text: Het eerste lid is niet van toepassing vrouwelijke dieren, geboren op of na 1 juli 2009.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.44
  - number: 1.45.1
    text: |-
      Een houder van schapen of geiten zorgt ervoor dat bezoekers niet met die dieren in contact kunnen komen ten tijde
      van de geboorte van hun lammeren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.45
  - number: 1.45.2
    text: |-
      De in het eerste lid bedoelde zorgplicht houdt in ieder geval in dat de houder zorgt dat bezoekers een stal waar
      lammeren worden geboren niet kunnen betreden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.45
  - number: 1.45.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing, indien het bezoek noodzakelijk is in het kader van de
      uitoefening van beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.45
  - number: 1.46.1
    text: 'Een houder van schapen of geiten laat de dieren tegen Q-koorts vaccineren in de volgende gevallen:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.46
  - number: 1.46.1.a
    text: |-
      de houder houdt meer dan 50 schapen of geiten op een inrichting ten behoeve van de bedrijfsmatige productie van
      melk of voor de opfok ten behoeve van die productie;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.46
  - number: 1.46.1.b
    text: |-
      de houder houdt schapen of geiten op een inrichting die is opengesteld voor het publiek met het oogmerk om direct
      contact tussen bezoekers en dieren te faciliteren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.46
  - number: 1.46.1.c
    text: de dieren worden vervoerd naar een inrichting als bedoeld in onderdeel a of b;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.46
  - number: 1.46.1.d
    text: de dieren worden vervoerd naar een tentoonstelling, keuring of ander evenement.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.46
  - number: 1.46.2
    text: |-
      De houder, bedoeld in het eerste lid, laat de dieren vaccineren ten minste drie weken en ten hoogste twaalf maanden
      voorafgaand aan:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.46
  - number: 1.46.2.a
    text: de openstelling voor het publiek van de inrichting, bedoeld in het eerste lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.46
  - number: 1.46.2.b
    text: |-
      het dekken door, onderscheidenlijk gedekt of geïnsemineerd worden van de dieren, indien de dieren worden gehouden
      op een inrichting als bedoeld in het eerste lid, onderdeel a of b;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.46
  - number: 1.46.2.c
    text: het vervoer van de dieren naar een inrichting als bedoeld in het eerste lid, onderdeel a of b; of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.46
  - number: 1.46.2.d
    text: het vervoer van de dieren naar een tentoonstelling, keuring of ander evenement.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.46
  - number: 1.46.3
    text: |-
      De houder, bedoeld in het eerste lid, onderdeel a of b, laat de dieren opnieuw vaccineren binnen twaalf maanden na
      de vaccinatie, bedoeld in het tweede lid, en vervolgens elke twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.46
  - number: 1.46.4
    text: 'Het eerste, tweede en derde lid zijn niet van toepassing op schapen of geiten die:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.46
  - number: 1.46.4.a
    text: |-
      in hun eerste levensjaar worden geslacht en die geen dieren dekken, onderscheidenlijk gedekt of geïnsemineerd
      worden; of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.46
  - number: 1.46.4.b
    text: jonger zijn dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.46
  - number: 1.47.1
    text: |-
      Een houder meldt Onze Minister binnen een week na elke vaccinatie tegen Q-koorts op welke datum een schaap of geit
      is gevaccineerd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.47
  - number: 1.47.2
    text: 'De houder administreert:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.47
  - number: 1.47.2.a
    text: de hoeveelheid gebruikt vaccin;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.47
  - number: 1.47.2.b
    text: het aantal gevaccineerde dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.47
  - number: 1.47.2.c
    text: de vaccinatiedatum;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.47
  - number: 1.47.3
    text: |-
      De gegevens, bedoeld in het tweede lid, worden voorzien van een handtekening van de houder en de dierenarts die de
      vaccinatie heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.47
  - number: 1.47.4
    text: De houder doet de melding, bedoeld in het eerste lid, via een door Onze Minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.47
  - number: 1.47.5
    text: De houder bewaart de gegevens, bedoeld in het tweede lid, twee jaar.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.47
  - number: '1.48'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de termijn waarbinnen de gegevens, bedoeld in de
      artikelen 84, tweede lid, 87, tweede lid, 90, tweede lid, 96, tweede lid, 172, tweede lid, of 180, tweede lid,
      verordening (EU) nr. 2016/429, worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.48
  - number: '1.49'
    text: |-
      De paragraaf en de daarop berustende bepalingen berusten mede op de [artikelen 34][ref1] en
      [37 van de Meststoffenwet][ref2], [artikel 12.29, aanhef en onder e en f, van de Wet milieubeheer][ref3] en
      [artikel 13 van de Landbouwwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.49
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0002252
        artikel: '13'
  - number: '1.50'
    text: |-
      De verantwoordelijkheid voor het identificatie- en registratiesysteem, bedoeld in artikel 108, eerste lid, van
      verordening (EU) nr. 2016/429, berust bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.50
  - number: '1.51'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de gegevens die een exploitant ten behoeve van het
      identificatie- en registratiesysteem, bedoeld in artikel 108 verordening (EU) nr. 2016/429, aan Onze Minister
      verstrekt, in aanvulling op de artikelen 112 tot en met 115 van verordening (EU) nr. 2016/429, met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.51
  - number: 1.51.a
    text: de door hem gehouden dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.51
  - number: 1.51.b
    text: de termijn waarbinnen en de voorwaarden waaronder de gegevens aan Onze Minister worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.51
  - number: 1.51.c
    text: het middel waarmee de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.51
  - number: 1.52.1
    text: |-
      Het identificatie- en registratiesysteem, bedoeld in artikel 108, verordening (EU) nr. 2016/429, bevat gegevens in
      verband met gehouden kippen, kalkoenen, parelhoenders en eenden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.52
  - number: 1.52.2
    text: |-
      Bij ministeriële regeling worden regels gesteld over de gegevens die een exploitant die verantwoordelijk is voor de
      in het eerste lid bedoelde dieren aan Onze Minister verstrekt met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.52
  - number: 1.52.2.a
    text: de verplaatsing van door hem gehouden dieren als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.52
  - number: 1.52.2.b
    text: de inrichting waarin de dieren, bedoeld in het eerste lid, worden gehouden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.52
  - number: 1.52.2.c
    text: de termijn waarbinnen en de voorwaarden waaronder de gegevens aan Onze Minister worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.52
  - number: 1.52.2.d
    text: het middel waarmee de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.52
  - number: '1.53'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het herstel of de intrekking van een kennisgeving,
      bedoeld in de [artikelen 1.51][ref1] en [1.52][ref2], en de voorwaarden waaronder een kennisgeving kan worden
      hersteld, ingetrokken of alsnog kan worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.53
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '11'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '11'
  - number: '1.54'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over gegevens die een exploitant bijhoudt, in aanvulling
      op artikel 102 en de op artikel 106 van verordening (EU) nr. 2016/429 gebaseerde gedelegeerde verordening met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.54
  - number: 1.54.a
    text: de door hem gehouden dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.54
  - number: 1.54.b
    text: de op de inrichting aanwezige identificatiemiddelen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.54
  - number: 1.54.c
    text: de termijn waarbinnen de exploitant de gegevens bijhoudt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.54
  - number: 1.54.d
    text: de termijn waarbinnen de exploitant de gegevens bewaart;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.54
  - number: 1.54.e
    text: de wijze waarop de gegevens worden bijgehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.54
  - number: '1.55'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de identificatiedocumenten, verplaatsingsdocumenten
      en andere documenten, bedoeld in artikel 110, eerste lid, van verordening (EU) nr. 2016/429, en de op de artikelen
      118, eerste lid, onder b, onder ii, tweede lid, onder b, c en d, en 119 van verordening (EU) nr. 2016/429
      gebaseerde uitvoerings- of gedelegeerde verordening met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.55
  - number: 1.55.a
    text: de aanvraag en afgifte van een identificatiedocument, een duplicaat of een vervangend identificatiedocument;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.55
  - number: 1.55.b
    text: de instantie die identificatiedocumenten voor paardachtigen uitgeeft;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.55
  - number: 1.55.c
    text: de termijn waarbinnen aanvraag van een identificatiedocument wordt ingediend;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.55
  - number: 1.55.d
    text: de geldigheid van een identificatie- of verplaatsingsdocument.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.55
  - number: 1.56.1
    text: |-
      Een aanvraag voor een goedkeuring van een identificatiemiddel voor runderen, schapen, geiten, varkens,
      paardachtigen, kameelachtigen of hertachtigen wordt gedaan met een daartoe door Onze Minister beschikbaar gesteld
      middel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.56
  - number: 1.56.2
    text: Het model van het identificatiemiddel waarvoor goedkeuring wordt gevraagd, vergezelt de aanvraag.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.56
  - number: 1.56.3
    text: |-
      Bij ministeriële regeling kunnen voor de daarin te onderscheiden diersoorten of diercategorieën regels worden
      gesteld over de gegevens die bij de aanvraag, bedoeld in het eerste lid, worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.56
  - number: 1.56.4
    text: |-
      Bij ministeriële regeling worden regels gesteld over de gevallen waarin een aanvraag als bedoeld in het eerste lid
      door Onze Minister wordt goedgekeurd of waarin een goedkeuring wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.56
  - number: 1.57.1
    text: |-
      Onze Minister of de leverancier van een goedgekeurd identificatiemiddel verstrekt een identificatiemiddel
      uitsluitend aan een exploitant die daartoe een bestelling heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.57
  - number: 1.57.2
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.57
  - number: 1.57.2.a
    text: het middel waarmee een bestelling kan worden geplaatst bij Onze Minister;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.57
  - number: 1.57.2.b
    text: de door de leverancier bij te houden administratie over bestelde en geleverde identificatiemiddelen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.57
  - number: 1.57.2.c
    text: de door de leverancier aan te leveren informatie aan Onze Minister;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.57
  - number: 1.57.2.d
    text: degene aan wie een leverancier identificatiemiddelen verstrekt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.57
  - number: 1.57.2.e
    text: de identificatiemiddelen die de leverancier verstrekt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.57
  - number: '1.58'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58
  - number: 1.58.a
    text: het aanbrengen en het gebruik van een identificatiemiddel;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58
  - number: 1.58.b
    text: de verwijdering, wijziging of vervanging van een identificatiemiddel;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58
  - number: 1.58.c
    text: de vernietiging van een elektronisch identificatiemiddel;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58
  - number: 1.58.d
    text: de termijn waarbinnen en de voorwaarden waaronder een identificatiemiddel wordt aangebracht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58
  - number: 1.58a
    text: |-
      In deze paragraaf wordt verstaan onder: - *verordening (EU) nr. 2019/2035:* [verordening (EU) 2019/2035]
      (32035R2019) van de Commissie van 28 juni 2019 tot aanvulling van [Verordening (EU) 2016/429](32329R2016) van het
      Europees Parlement en de Raad wat betreft regels voor inrichtingen waar landdieren worden gehouden en broederijen,
      alsmede voor de traceerbaarheid van bepaalde gehouden landdieren en broedeieren (PbEU 2019, L 314).
        - *identificatiecode:* code als bedoeld in artikel 2, onderdeel 18, van verordening (EU) nr. 2019/2035;
        - *injecteerbare transponder:* injecteerbare transponder als bedoeld in bijlage III, onderdeel e, van verordening
      (EU) nr. 2019/2035 die is voorzien van een identificatiecode die begint met de Nederlandse landcode.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58a
  - number: 1.58b.1
    text: |-
      Onze Minister verstrekt de identificatiecode die op een injecteerbare transponder wordt aangebracht aan een
      leverancier.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58b
  - number: 1.58b.2
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58b
  - number: 1.58b.2.a
    text: de technische specificaties van injecteerbare transponders;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58b
  - number: 1.58b.2.b
    text: de gegevens die in of op een injecteerbare transponder worden vermeld of vastgelegd;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58b
  - number: 1.58b.2.c
    text: de handel in injecteerbare transponders.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58b
  - number: 1.58c.1
    text: De leverancier van een injecteerbare transponder beschikt over een erkenning van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58c
  - number: 1.58c.2
    text: 'Onze Minister erkent een leverancier indien:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58c
  - number: 1.58c.2.a
    text: |-
      de leverancier een onderneming heeft als bedoeld in [artikel 5 van de Handelsregisterwet 2007][ref1] of een
      rechtspersoon is in de zin van artikel 54 van het Verdrag betreffende de werking van de Europese Unie, die in een
      lidstaat van de Europese Unie of van de Europese Economische Ruimte is gevestigd;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58c
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '5'
  - number: 1.58c.2.b
    text: de leverancier aantoont dat hij gegevens elektronisch en tijdig kan uitwisselen met Onze Minister; en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58c
  - number: 1.58c.2.c
    text: |-
      de leverancier aantoont te voldoen aan de eisen die voortvloeien uit de wetgeving over de verwerking van
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58c
  - number: 1.58c.3
    text: |-
      Onze Minister kan de erkenning schorsen dan wel intrekken indien de leverancier niet voldoet aan één of meer
      voorschriften als bedoeld in het tweede lid of een ander voorschrift dat betrekking heeft op de technische
      specificaties van injecteerbare transponders of de handel in injecteerbare transponders.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58c
  - number: 1.58c.4
    text: |-
      Een injecteerbare transponder wordt uitsluitend overgedragen aan een persoon die is ingeschreven in het register,
      bedoeld in [artikel 2.9, derde lid, van het Besluit diergeneeskundigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58c
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 1.58c.5
    text: |-
      Bij de overdracht van een injecteerbare transponder registreert de persoon die de injecteerbare transponder
      overdraagt de leverdatum, de identificatiecode en de naam van de exploitant die de bestelling heeft gedaan bij
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.58c
  - number: 1.59.1
    text: |-
      Ingeval artikel 243, tweede lid, van verordening (EU) nr. 2016/429 van toepassing is en de regelgeving of de
      bevoegde autoriteit van het derde land waarvoor dieren zijn bestemd, vereist dat de dieren voldoen aan door het
      derde land gestelde vereisten, wordt een officieel certificaat afgegeven door Onze Minister, waaruit blijkt dat aan
      deze eisen is voldaan.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.59
  - number: 1.59.2
    text: |-
      Ingeval de regelgeving of de bevoegde autoriteit van een derde land, bedoeld in het eerste lid, een bepaalde
      gezondheidsstatus vereist van dieren, maar geen eisen stelt aan de laboratoria waarin en de wijze waarop
      laboratoriumanalyses, -tests en -diagnoses worden uitgevoerd, vinden deze plaats in een daartoe door Onze Minister
      erkend laboratorium.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.59
  - number: 1.59.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de uitvoering van werkzaamheden als bedoeld in het tweede lid
      ingeval er voor het onderzoek met betrekking tot een bepaalde gezondheidsstatus geen laboratorium is erkend.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.59
  - number: '1.60'
    text: |-
      Ingeval artikel 234, derde lid, van verordening (EU) nr. 2016/429 van toepassing is, kunnen bij ministeriële
      regeling regels worden gesteld over het binnen Nederland brengen van dieren met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.60
  - number: 1.60.a
    text: de gezondheidsstatus van dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.60
  - number: 1.60.b
    text: de begeleidende documenten die dieren vergezellen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.60
  - number: 1.61.1
    text: Het is verboden om een levende entstof toe te passen bij dieren tegen bij ministeriële regeling aangewezen ziekten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.61
  - number: 1.61.2
    text: |-
      Het verbod in het eerste lid is niet van toepassing op het toepassen van een bij ministeriële regeling aangewezen
      levende entstof tegen een in die regeling aangewezen dierziekte.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.61
  - number: 1.61.3
    text: |-
      Het is verboden om een niet-levende entstof of serum tegen bij ministeriële regeling aangewezen ziekten toe te
      passen bij dieren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.61
  - number: 1.61.4
    text: |-
      Bij ministeriële regeling kan worden bepaald in welke gevallen het verbod, bedoeld in het derde lid, niet van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel1.61
  - number: '2.1'
    text: |-
      Als diersoorten of diercategorieën als bedoeld in [artikel 2.3, tweede lid, van de wet][ref1] worden aangewezen de
      diersoorten en diercategorieën die worden genoemd in [bijlage II][ref2] bij dit besluit, met dien verstande dat
      pluimvee waarbij een lichamelijke ingreep is verricht die krachtens de wet niet is toegestaan, niet is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035217
  - number: '2.2'
    text: |-
      Deze paragraaf en de [artikelen 2.9][ref1] en [2.10][ref2] zijn van toepassing op dieren die met het oog op de
      productie van producten, afkomstig van die dieren of voor andere landbouwdoeleinden worden gefokt of gehouden, met
      uitzondering van vissen, reptielen, amfibieën en ongewervelde dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '2.3'
    text: |-
      Wanneer een dier permanent of geregeld wordt aangebonden, vastgeketend of geïmmobiliseerd, wordt het voldoende
      ruimte gelaten voor zijn fysiologische en ethologische behoeften.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.3
  - number: 2.4.1
    text: Een dier wordt verzorgd door een voldoende aantal vakbekwame personen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.4
  - number: 2.4.2
    text: |-
      Een dier dat wordt gehouden in een veehouderijsysteem waar zijn welzijn afhangt van frequente verzorging door de
      mens, wordt ten minste eenmaal per dag gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.4
  - number: 2.4.3
    text: |-
      Een dier dat in een ander systeem wordt gehouden dan het systeem, bedoeld in het tweede lid, wordt zo vaak
      gecontroleerd dat lijden wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.4
  - number: 2.4.4
    text: |-
      Een ziek of gewond dier wordt zo nodig afgezonderd in een passend onderkomen dat zo nodig is voorzien van droog
      strooisel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.4
  - number: 2.4.5
    text: |-
      Wanneer de zorg, bedoeld in [artikel 1.7, aanhef en onderdeel c][ref1], geen verbetering in de toestand van het
      dier brengt, wordt zo spoedig mogelijk een dierenarts geraadpleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 2.4.6
    text: Een dier krijgt voedsel met ten minste de tussenpozen die bij zijn fysiologische behoeften passen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.4
  - number: 2.4.7
    text: Het toegediende voer en drinken alsmede de wijze van toediening brengen het dier geen onnodig lijden of letsel toe.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.4
  - number: 2.5.1
    text: |-
      Onverminderd [artikel 1.8, eerste lid][ref1], wordt een dier niet permanent in het duister of in kunstlicht
      gehouden zonder dat dit voor een passende periode wordt uitgeschakeld en is, indien het beschikbare natuurlijke
      licht niet voldoende is voor de ethologische en fysiologische behoeften van het dier, in de ruimte waarin het dier
      wordt gehouden geschikt kunstlicht aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 2.5.2
    text: |-
      In een ruimte waarin dieren worden gehouden is voldoende verlichting aanwezig voor een grondige controle van die
      dieren op elk willekeurig tijdstip.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.5
  - number: 2.5.3
    text: |-
      Het materiaal dat wordt gebruikt voor de behuizing waarin een dier wordt gehouden is niet schadelijk voor het dier
      en kan grondig gereinigd en ontsmet worden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.5
  - number: 2.5.4
    text: |-
      De luchtcirculatie, het stofgehalte van de lucht, de temperatuur, de relatieve luchtvochtigheid en de
      gasconcentraties in de omgeving van het dier zijn niet schadelijk voor het dier.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.5
  - number: 2.5.5
    text: |-
      Indien de gezondheid en het welzijn van een dier afhankelijk is van een kunstmatig ventilatiesysteem, is dat
      voorzien van een passend noodsysteem waarmee voldoende verse lucht kan worden aangevoerd om de gezondheid en het
      welzijn van het dier te waarborgen als het hoofdsysteem uitvalt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.5
  - number: 2.5.6
    text: |-
      Indien het ventilatiesysteem, bedoeld in het vijfde lid, uitvalt, treedt een alarmsysteem in werking, dat
      regelmatig wordt getest.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.5
  - number: 2.5.7
    text: |-
      Voeder- of drinkinstallaties zijn zo ontworpen, gebouwd en geplaatst dat het gevaar voor verontreiniging van voer
      en water, alsmede mogelijke schadelijke gevolgen van rivaliteit tussen dieren tot een minimum worden beperkt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.5
  - number: 2.5.8
    text: |-
      De in dit artikel bedoelde apparatuur die noodzakelijk is voor de gezondheid en het welzijn van een dier wordt ten
      minste eenmaal per dag gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.5
  - number: 2.5.9
    text: |-
      Indien bij de controle, bedoeld in het achtste lid, defecten worden geconstateerd, worden deze onmiddellijk
      hersteld of, indien herstel niet mogelijk is, worden de nodige maatregelen getroffen om de gezondheid en het
      welzijn van het dier veilig te stellen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.5
  - number: '2.6'
    text: |-
      Als handeling als bedoeld in [artikel 2.9, derde lid, van de wet][ref1] wordt aangewezen het door de houder van het
      dier verrichten van de ingreep, bedoeld in [artikel 2.5, onderdeel d, van het Besluit diergeneeskundigen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '2'
  - number: '2.7'
    text: |-
      De houder van een dier dat voor de productie van levensmiddelen bestemd is, verstrekt,
      onverminderd [artikel 8.4, tweede lid, van de wet][ref1], aan de door Onze Minister krachtens de
      [artikelen 8.1, eerste lid][ref2], en[ 8.14, eerste lid, van de wet][ref3] aangewezen ambtenaren en de dierenarts
      verbonden aan de Nederlandse Voedsel- en Warenautoriteit desgevraagd alle inlichtingen over het voorschrijven van
      diergeneesmiddelen en het uitvoeren van behandelingen met diergeneesmiddelen bij dieren die voor de productie van
      levensmiddelen zijn bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '8'
  - number: 2.8.1
    text: |-
      Het is verboden een dier te verkopen, voor de verkoop aan te bieden, in de handel te brengen of af te leveren voor
      de slacht als voedselproducerend dier als bedoeld in artikel 2, onderdeel b, van Verordening (EG) nr. 470/2009 van
      het Europees Parlement en de Raad van 6 mei 2009 tot vaststelling van communautaire procedures voor het vaststellen
      van grenswaarden voor residuen van farmacologisch werkzame stoffen in levensmiddelen van dierlijke oorsprong, tot
      intrekking van Verordening (EEG) nr. 2377/90 van de Raad en tot wijziging van [Richtlijn 2001/82/EG](32001L0082)
      van het Europees Parlement en de Raad en van Verordening (EG) nr. 726/2004 van het Europees Parlement en de Raad
      (PbEU 2009, L 152), indien het vlees van het dier een farmacologisch actieve werkzame stof bevat:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.8
  - number: 2.8.1.a
    text: |-
      die een maximum residulimiet overschrijdt als bedoeld in artikel 1, eerste lid, onderdeel a, van deze verordening
      of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.8
  - number: 2.8.1.b
    text: waarvoor een actiedrempel als bedoeld in artikel 1, eerste lid, onderdeel b, van deze verordening is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.8
  - number: 2.8.2
    text: Het eerste lid is van overeenkomstige toepassing na de behandeling van een dier met een gemedicineerd diervoeder.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.8
  - number: '2.9'
    text: |-
      Onverminderd het bepaalde bij of krachtens [artikel 2.19, derde lid, van de wet][ref1], worden geen stoffen aan
      een dier toegediend, behalve stoffen voor therapeutische of profylactische doeleinden, dan wel zoötechnische
      behandeling als bedoeld in artikel 1, tweede lid, onderdeel c, van [richtlijn 96/22/EG](31996L0022) van de Raad
      van 29 april 1996 betreffende het verbod op gebruik, in de veehouderij, van bepaalde stoffen met hormonale werking
      en van bepaalde stoffen met thyreostatische werking alsmede van ß-agonisten en tot intrekking van de [richtlijnen
      81/602/EEG](31981L0602), [88/146/EEG](31988L0146) (PbEG 1996, L 125), tenzij uit wetenschappelijke studies naar het
      welzijn van dieren of uit ervaring is gebleken dat de stof niet schadelijk is voor de gezondheid of het welzijn van
      het dier.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.10.1
    text: |-
      Onverminderd artikel 1.25 en het overigens krachtens de [artikelen 2.2, negende of tiende lid][ref1], en
      [2.19 van de wet][ref2] bepaalde wordt door de houder van een dier een register bijgehouden van de verstrekte
      medische zorg en het bij iedere controle geconstateerde aantal sterfgevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.10.2
    text: De gegevens, bedoeld in het eerste lid, worden ten minste drie jaar door de houder bewaard.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10
  - number: 2.10a.1
    text: |-
      Een houder van tien of meer evenhoevigen beschikt over een reinigings- en ontsmettingsplaats op de inrichting waar
      die evenhoevigen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10a
  - number: 2.10a.2
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10a
  - number: 2.10a.2.a
    text: op die inrichting geen evenhoevigen worden aangevoerd; of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10a
  - number: 2.10a.2.b
    text: |-
      de inrichting is een weide, perceel of een andere plaats zonder opstal, waar geen voorzieningen aanwezig zijn of
      redelijkerwijs kunnen worden aangelegd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10a
  - number: 2.10a.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de aanwezige voorzieningen op een reinigings- en
      ontsmettingsplaats.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10a
  - number: 2.10b
    text: |-
      Een houder als bedoeld in [artikel 2.10a][ref1] verleent na aanvoer van evenhoevigen medewerking aan de reiniging
      en ontsmetting van het vervoermiddel waarmee die dieren zijn vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10b
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 3a
  - number: 2.10c.1
    text: 'Onze Minister erkent een reinigings- en ontsmettingsplaats, indien:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10c
  - number: 2.10c.1.a
    text: |-
      die plaats zodanig is ingericht dat deze geschikt is om vervoermiddelen voor evenhoevigen, pluimvee, broedeieren
      of laadkisten voor deze dieren of broedeieren deugdelijk en efficiënt te reinigen en ontsmetten, ongeacht het type
      vervoermiddel en onder alle klimatologische omstandigheden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10c
  - number: 2.10c.1.b
    text: |-
      de exploitant de wijze van exploitatie en van reiniging en ontsmetting heeft vastgelegd in een protocol, waarin is
      vermeld of de plaats geschikt is voor de reiniging en ontsmetting van vervoermiddelen als bedoeld in onderdeel a en
      waarin wordt gewaarborgd dat elk van die vervoermiddelen deugdelijk en efficiënt gereinigd en ontsmet wordt en op
      zodanige wijze dat de bioveiligheid niet in gevaar komt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10c
  - number: 2.10c.2
    text: Onze Minister houdt een register bij van erkende reinigings- en ontsmettingsplaatsen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10c
  - number: 2.10d.1
    text: |-
      Een exploitant van een op grond van [artikel 2.10c][ref1] erkende reinigings- en ontsmettingsplaats, een slachthuis
      of een verzamelcentrum zorgt ervoor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10d
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 3a
  - number: 2.10d.1.a
    text: |-
      reiniging- en ontsmetting gebeurt volgens een daartoe opgesteld protocol als bedoeld in
      [artikel 2.10c, eerste lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10d
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 3a
  - number: 2.10d.1.b
    text: de exploitant of een vertegenwoordiger van die exploitant aanwezig is bij elke reiniging- en ontsmetting.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10d
  - number: 2.10d.2
    text: 'De exploitant, bedoeld in het eerste lid, registreert per vervoermiddel onmiddellijk:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10d
  - number: 2.10d.2.a
    text: datum en tijdstip waarop reiniging en ontsmetting heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10d
  - number: 2.10d.2.b
    text: het kenteken van het vervoermiddel, of, indien een kenteken ontbreekt, naam, adres en woonplaats van de vervoerder.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10d
  - number: 2.10d.3
    text: |-
      De exploitant, bedoeld in het eerste lid, geeft desgevraagd een bewijs van reiniging en ontsmetting af dat is
      voorzien van de gegevens van:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10d
  - number: 2.10d.3.a
    text: respectievelijk de reinigings- en ontsmettingsplaats, het slachthuis of het verzamelcentrum;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10d
  - number: 2.10d.3.b
    text: de datum van reiniging en ontsmetting; en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10d
  - number: 2.10d.3.c
    text: zijn handtekening.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10d
  - number: 2.10d.4
    text: De exploitant, bedoeld in het eerste lid, bewaart de gegevens, bedoeld in het tweede lid, drie jaar.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10d
  - number: 2.10e.1
    text: |-
      Indien een reinigings- en ontsmettingsplaats niet langer voldoet aan de eisen, bedoeld in de [artikel 2.10c][ref1]
      of [2.10d][ref2], kan Onze Minister de erkenning schorsen of intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10e
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 3a
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 3a
  - number: 2.10e.2
    text: |-
      Onze Minister kan een schorsing beëindigen, als de exploitant heeft aangetoond aan de in het eerste lid bedoelde
      eisen te voldoen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10e
  - number: 2.10f.1
    text: |-
      Een vervoermiddel waarmee een of meer evenhoevigen, pluimvee of broedeieren in Nederland worden gebracht, afkomstig
      uit een derde land of uit een door Onze Minister aangewezen lidstaat, dat wordt gelost op een inrichting die niet
      beschikt over een ingevolge [artikel 2.10c][ref1] erkende reinigings- en ontsmettingsplaats, wordt in voorkomend
      geval na reiniging en ontsmetting als bedoeld in [artikel 2.10b][ref2] onmiddellijk vervoerd naar een ingevolge
      artikel 2.10c erkende reinigings- en ontsmettingsplaats, een slachthuis of een verzamelcentrum, om aldaar te worden
      gereinigd en ontsmet.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10f
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 3a
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 3a
  - number: 2.10f.2
    text: |-
      Een vervoermiddel dat kennelijk is gebruikt voor het vervoeren van evenhoevigen, pluimvee of broedeieren in
      derde landen, of in door Onze Minister aangewezen lidstaten, en dat vanuit deze derde landen of lidstaten,
      anders dan in doorvoer leeg in Nederland wordt gebracht, wordt onmiddellijk gereinigd en ontsmet op een ingevolge
      [artikel 2.10c][ref1] erkende reiniging- en ontsmettingsplaats, een slachthuis of een verzamelcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10f
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 3a
  - number: 2.10f.3
    text: |-
      De exploitant van het vervoermiddel, bedoeld in het eerste of tweede lid, overlegt binnen 24 uur na
      binnenkomst in Nederland aan Onze Minister een bewijs van de reiniging en ontsmetting als bedoeld in
      [artikel 2.10d, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10f
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 3a
  - number: 2.10f.4
    text: |-
      Wanneer het vervoermiddel, bedoeld in het eerste of tweede lid, afkomstig is uit een lidstaat, meldt de exploitant
      aan Onze Minister in aanvulling op het derde lid binnen 24 uur na binnenkomst in Nederland het nummer van het
      gezondheidscertificaat, bedoeld in artikel 143, van verordening (EU) nr. 2016/429, dat het meest recentelijk is
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10f
  - number: 2.10f.5
    text: |-
      Een lidstaat als bedoeld in het eerste en tweede lid kan worden aangewezen indien er op het grondgebied van die
      lidstaat een uitbraak van een bij ministeriële regeling aangewezen besmettelijke dierziekte is bevestigd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10f
  - number: 2.10f.6
    text: |-
      Het eerste, tweede, derde en vierde lid zijn van overeenkomstige toepassing op een vervoermiddel dat afkomstig
      is uit een door Onze Minister aangewezen geografisch afgebakend gebied van een lidstaat waar een besmettelijke
      dierziekte als bedoeld in het vijfde lid bij een in het wild levend dier is bevestigd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.10f
  - number: '2.11'
    text: |-
      In deze paragraaf wordt verstaan onder: - *beer:* geslachtsrijp varken van het mannelijk geslacht dat kennelijk
      bestemd is voor de fokkerij;
        - *gebruiksvarken:* varken met een leeftijd van ten minste tien weken tot aan het moment waarop het wordt geslacht
      dan wel een beer of gelt is geworden;
        - *gelt:* geslachtsrijp varken van het vrouwelijk geslacht dat nog niet heeft geworpen, kennelijk bestemd voor
      de fokkerij;
        - *gespeend varken:* gespeend varken met een leeftijd tot 10 weken;
        - *spenen:* blijvend onttrekken van biggen aan een zogende zeug;
        - *stal:* ruimte bestemd voor het houden van één of meer varkens;
        - *volwassen beer:* beer van 18 maanden of ouder;
        - *zogende zeug:* zeug tot aan het spenen van de biggen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.11
  - number: '2.12'
    text: |-
      Als handelingen als bedoeld in [artikel 2.9, derde lid, van de wet][ref1] worden aangewezen het door de houder van
      het varken:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.12.a
    text: |-
      verrichten van de ingreep, bedoeld in [artikel 2.3, onderdeel a, van het Besluit diergeneeskundigen][ref1], mits
      het dier niet ouder is dan zeven dagen;


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.12.b
    text: |-
      verrichten van ingrepen als bedoeld in de [artikelen 2.3, onderdeel b][ref1] en
      [2.6, onderdelen a tot en met c, l en m, van het Besluit diergeneeskundigen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.12.c
    text: |-
      verrichten van de ingreep, bedoeld in [artikel 2.3, onderdeel c, van het Besluit diergeneeskundigen][ref1], mits
      dit geschiedt met betrekking tot een bepaald dier op aanwijzing van een praktiserende dierenarts.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.13.1
    text: Gespeende varkens, gebruiksvarkens, gelten en zeugen worden in afzonderlijke groepen gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.13
  - number: 2.13.2
    text: Een groep gespeende varkens wordt uiterlijk één week na het spenen gevormd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.13
  - number: 2.13.3
    text: Een groep gebruiksvarkens wordt gevormd uit varkens afkomstig uit één groep gespeende varkens.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.13
  - number: 2.13.4
    text: Aan een eenmaal gevormde groep gespeende varkens of gebruiksvarkens worden geen varkens toegevoegd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.13
  - number: 2.14.1
    text: |-
      Er worden maatregelen getroffen om de agressie in groepen zoveel mogelijk te beperken, waaronder in ieder geval het
      verstrekken van stro of ander materiaal aan gespeende varkens en gebruiksvarkens.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.14
  - number: 2.14.2
    text: Bij tekenen van ernstige gevechten tussen varkens vindt onmiddellijk onderzoek plaats naar de oorzaken daarvan.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.14
  - number: 2.15.1
    text: |-
      In afwijking van [artikel 2.13, eerste lid][ref1], is het toegestaan:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.15.1.a
    text: een zeug ten behoeve van het zogen van de biggen, tezamen met de biggen, individueel te houden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.15
  - number: 2.15.1.b
    text: 'een gelt of zeug individueel te houden:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.15
  - number: 2.15.1.b.1
    text: vanaf één week voor het berekende tijdstip van werpen tot het tijdstip van werpen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.15
  - number: 2.15.1.b.2
    text: vanaf het spenen tot en met vier dagen na de dag van natuurlijke dekking of kunstmatige inseminatie;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.15
  - number: 2.15.1.c
    text: |-
      gespeende varkens, gebruiksvarkens, gelten of zeugen tijdelijk af te zonderen van de groep voor de periode die
      nodig is:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.15
  - number: 2.15.1.c.1
    text: voor het om gezondheidsredenen onderzoeken of behandelen van het varken;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.15
  - number: 2.15.1.c.2
    text: voor het drachtigheidsonderzoek of het winnen van sperma;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.15
  - number: 2.15.1.c.3
    text: voor identificatie, wassen, ontsmetten of wegen van het varken;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.15
  - number: 2.15.1.c.4
    text: voor voeropname;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.15
  - number: 2.15.1.c.5
    text: om de stal te reinigen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.15
  - number: 2.15.1.d
    text: |-
      varkens tijdelijk af te zonderen van de groep indien de varkens buitengewoon agressief zijn of ziek of gewond zijn,
      dan wel door andere varkens zijn aangevallen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.15
  - number: 2.15.2
    text: |-
      Bij een tijdelijke afzondering van de groep als bedoeld in het eerste lid, onderdeel d, beschikken de varkens over
      voldoende ruimte om zich te kunnen omdraaien, voor zover specifiek veterinair advies niet anders luidt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.15
  - number: '2.16'
    text: 'Stallen waarin varkens worden gehouden zijn op zodanige wijze ingericht dat de varkens:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.16
  - number: 2.16.a
    text: |-
      toegang hebben tot een schone en comfortabele ruimte met een adequate waterafvoer, waar alle varkens tegelijk
      kunnen liggen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.16
  - number: 2.16.b
    text: kunnen rusten en ongehinderd kunnen opstaan;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.16
  - number: 2.16.c
    text: andere varkens kunnen zien.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.16
  - number: 2.17.1
    text: |-
      De voor de varkens beschikbare oppervlakte van een stal bestemd voor gelten na dekking of zeugen zonder biggen, die
      in een groep worden gehouden, bedraagt per gelt of zeug ten minste 2,25 m2.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.17
  - number: 2.17.2
    text: |-
      De voor de varkens beschikbare oppervlakte van een stal bestemd voor gespeende varkens, gebruiksvarkens en niet in
      een groep gehouden gelten of zeugen bedraagt per varken met een gemiddeld gewicht ten minste:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.17
  - number: 2.17.2.a
    text: 'tot 15 kg: 0,20 m2;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.17
  - number: 2.17.2.b
    text: 'van 15 tot 30 kg: 0,30 m2;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.17
  - number: 2.17.2.c
    text: 'van 30 tot 50 kg: 0,50 m2;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.17
  - number: 2.17.2.d
    text: 'van 50 tot 85 kg: 0,65 m2;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.17
  - number: 2.17.2.e
    text: 'van 85 tot 110 kg: 0,80 m2;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.17
  - number: 2.17.2.f
    text: 'van meer dan 110 kg: 1,0 m2.'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.17
  - number: 2.17.3
    text: De in het eerste lid bedoelde beschikbare oppervlakte
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.17
  - number: 2.17.3.a
    text: |-
      wordt per gelt of zeug met 10% vergroot indien deze dieren in groepen van minder dan zes varkens worden gehouden,
      of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.17
  - number: 2.17.3.b
    text: |-
      kan per gelt of zeug met 10% worden verkleind indien deze dieren in groepen van meer dan 40 varkens worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.17
  - number: 2.17.4
    text: |-
      De in het tweede lid bedoelde beschikbare oppervlakte kan per gespeend varken of gebruiksvarken met een gemiddeld
      gewicht van meer dan 15 kg, met 10% worden verkleind indien deze dieren in groepen van meer dan 40 varkens worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.17
  - number: 2.18.1
    text: |-
      De voor de varkens beschikbare vloer van een stal bestaat niet geheel uit roostervloer, tenzij de vloer is bestemd
      voor gespeende varkens of zogende zeugen met biggen en niet is vervaardigd van beton.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.18
  - number: 2.18.2
    text: |-
      Indien de vloer van de in [artikel 2.17, eerste lid][ref1], bedoelde stal gedeeltelijk uit roostervloer bestaat,
      bedraagt de oppervlakte van het dichte deel van de voor gelten of zeugen zonder biggen beschikbare vloer per gelt
      of zeug ten minste 1,3 m2.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.18.3
    text: |-
      Indien de vloer van de in [artikel 2.17, tweede lid][ref1], bedoelde stal gedeeltelijk uit roostervloer bestaat,
      bedraagt de oppervlakte van het dichte deel van de vloer per varken ten minste 40% van de ingevolge artikel 2.17
      voorgeschreven beschikbare oppervlakte per varken.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.18.4
    text: |-
      Indien de vloer van de in [artikel 2.17, tweede lid][ref1], bedoelde stal gedeeltelijk uit roostervloer bestaat,
      bedraagt, in afwijking van het derde lid, vanaf een bij koninklijk besluit te bepalen tijdstip de oppervlakte van
      het dichte deel van de voor varkens beschikbare vloer per varken met een gemiddeld gewicht ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.18.4.a
    text: 'tot 30 kg: 0,24 m2;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.18
  - number: 2.18.4.b
    text: 'van 30 tot 50 kg: 0,35 m2;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.18
  - number: 2.18.4.c
    text: 'van 50 tot 85 kg: 0,45 m2;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.18
  - number: 2.18.4.d
    text: 'van 85 tot en met 110 kg: 0,60 m2;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.18
  - number: 2.18.4.e
    text: 'van meer dan 110 kg: 0,75 m2.'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.18
  - number: 2.18.5
    text: |-
      Indien de vloer van de in [artikel 2.20][ref1] bedoelde stal gedeeltelijk uit roostervloer bestaat, bedraagt de
      oppervlakte van het dichte deel van de vloer ten minste twee derden van de totale vloeroppervlakte.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.18.6
    text: 'Een vloer of een gedeelte daarvan, die is voorzien van gierdoorlatende openingen, wordt als dicht beschouwd indien:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.18
  - number: 2.18.6.a
    text: |-
      het totaal aan gierdoorlatende openingen niet meer bedraagt dan 5% van de totale oppervlakte van het dichte deel
      van de vloer, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.18
  - number: 2.18.6.b
    text: |-
      de breedte van gierdoorlatende spleten ten hoogste 10 mm en de doorsnede van ronde gierdoorlatende openingen ten
      hoogste 20 mm bedraagt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.18
  - number: 2.19.1
    text: Gelten en zeugen worden niet aangebonden gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.19
  - number: 2.19.2
    text: |-
      De zijden van de stal waarin een groep gelten en zeugen wordt gehouden, zijn langer dan 2,8 meter. Indien minder
      dan zes gelten of zeugen in een groep worden gehouden, zijn de zijden van de stal waarin deze groep wordt gehouden
      langer dan 2,4 meter.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.19
  - number: 2.19.3
    text: |-
      In een stal waarin gelten of zeugen zonder biggen in voerligboxen worden gehouden, heeft elk varken de beschikking
      over een vrije ruimte met een lengte van ten minste 2 meter.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.19
  - number: 2.19.4
    text: |-
      Een stal bestemd voor een gelt of een zeug is zodanig ingericht dat achter de gelt of de zeug voldoende vrije
      ruimte beschikbaar is voor het natuurlijke of het begeleide werpen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.19
  - number: 2.19.5
    text: |-
      Een stal bestemd voor een zogende zeug met biggen, waarin de zeug zich vrij kan bewegen en kan omdraaien, is
      voorzien van een bescherming voor de biggen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.19
  - number: 2.19.6
    text: |-
      In een stal waarin een zogende zeug met biggen zich niet vrij kan bewegen of omdraaien, beschikken de biggen over
      voldoende ruimte om ongehinderd te kunnen worden gezoogd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.19
  - number: 2.20.1
    text: Een beer wordt op zodanige wijze gehuisvest dat hij zich kan omdraaien en andere varkens kan horen, ruiken en zien.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.20
  - number: 2.20.2
    text: 'De beschikbare oppervlakte in een stal bestemd voor een beer bedraagt ten minste:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.20
  - number: 2.20.2.a
    text: 'voor een beer jonger dan 12 maanden: 4 m2;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.20
  - number: 2.20.2.b
    text: 'voor een beer van 12 maanden tot 18 maanden: 5 m2;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.20
  - number: 2.20.2.c
    text: 'voor een beer van 18 maanden of ouder: 6 m2;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.20
  - number: 2.20.2.d
    text: 'ingeval de stal tevens voor het dekken wordt gebruikt: 10 m2.'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.20
  - number: 2.20.3
    text: |-
      De beschikbare oppervlakte in een stal als bedoeld in het tweede lid, onderdeel d, is voor een beer vrij
      beschikbaar.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.20
  - number: 2.21.1
    text: |-
      De spleetbreedte tussen de roosterbalken van een roostervloer is over de gehele oppervlakte van de roostervloer
      gelijk en bedraagt bij stallen bestemd voor:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.21
  - number: 2.21.1.a
    text: 'zeugen zonder biggen en gelten na dekking: ten hoogste 20 mm;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.21
  - number: 2.21.1.b
    text: 'zogende zeugen met biggen: ten hoogste 10 mm bij betonroostervloeren en 12 mm bij andere roostervloeren;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.21
  - number: 2.21.1.c
    text: 'gespeende varkens: ten hoogste 14 mm bij betonroostervloeren en 15 mm bij andere roostervloeren;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.21
  - number: 2.21.1.d
    text: 'gebruiksvarkens: ten hoogste 18 mm bij betonroostervloeren en 20 mm bij andere roostervloeren.'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.21
  - number: 2.21.2
    text: 'De balkbreedte van de roosterbalken van een betonroostervloer bedraagt bij een stal bestemd voor:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.21
  - number: 2.21.2.a
    text: 'biggen en gespeende varkens: ten minste 50 mm;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.21
  - number: 2.21.2.b
    text: 'gebruiksvarkens, gelten na dekking en zeugen: ten minste 80 mm.'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.21
  - number: 2.22.1
    text: |-
      Varkens beschikken permanent over voldoende materiaal om te onderzoeken en mee te spelen, bestaande uit stro, hooi,
      hout, zaagsel, compost van champignons, turf of een mengsel daarvan, of ander geschikt materiaal, voor zover de
      gezondheid van de dieren daardoor niet in gevaar komt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.22
  - number: 2.22.2
    text: |-
      Zeugen en gelten beschikken in de laatste week voor het werpen over voldoende en adequaat nestmateriaal, tenzij dit
      in verband met de op het bedrijf gebruikte mengmestmethode technisch niet uitvoerbaar is.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.22
  - number: 2.22.3
    text: |-
      Het dichte deel van de vloer van een stal bestemd voor een beer of een zogende zeug met biggen is voorzien van
      strooisel als bedoeld in het eerste lid dan wel, voor wat betreft een zogende zeug met biggen, bedekt met een
      rubber mat.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.22
  - number: 2.22.4
    text: |-
      Biggen beschikken over een dichte vloer of een vloer bedekt met een rubber mat waarvan de oppervlakte ten minste
      0,6 m2 per toom biggen bedraagt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.22
  - number: 2.23.1
    text: |-
      De lichtintensiteit in een stal bestemd voor varkens bedraagt verticaal op dierhoogte gemeten ten minste 40 lux
      gedurende ten minste 8 uur per dag.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.23
  - number: 2.23.2
    text: |-
      In een stal bestemd voor varkens wordt een continue geluidsniveau van 85 dBA of hoger alsmede constant of
      plotseling lawaai vermeden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.23
  - number: '2.24'
    text: |-
      Drachtige zeugen en gelten worden zo nodig tegen uitwendige en inwendige parasieten behandeld en worden voordat zij
      in het kraamhok worden gebracht grondig schoongemaakt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.24
  - number: '2.25'
    text: |-
      Indien varkens in een groep worden gehouden en niet ad libitum of via een automatisch individueel voedersysteem
      worden gevoederd, is de lengte van de rechte trog zodanig dat alle varkens tegelijkertijd kunnen eten. De lengte
      van de rechte trog bedraagt ten minste 0,30 m per geslachtsrijp varken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.25
  - number: 2.26.1
    text: Varkens worden ten minste eenmaal per dag gevoederd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.26
  - number: 2.26.2
    text: Varkens ouder dan twee weken beschikken permanent over voldoende vers water.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.26
  - number: 2.26.3
    text: |-
      Aan guste en drachtige zeugen en gelten wordt een toereikende hoeveelheid bulk- of vezelrijk en energierijk voer
      verstrekt om hun honger te verminderen en in de behoefte tot kauwen te voorzien.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.26
  - number: '2.27'
    text: |-
      De invoer van varkens die vanuit een derde land via Nederland voor het eerst op het grondgebied van de Europese
      Unie worden gebracht, is slechts toegestaan indien de varkens vergezeld gaan van een geldig, door de bevoegde
      autoriteit van dat derde land afgegeven, volledig ingevuld en gedagtekend certificaat als bedoeld in artikel 9
      van [richtlijn 2008/120/EG](32008L0120) van de Raad van 18 december 2008 tot vaststelling van minimumnormen ter
      bescherming van varkens (Gecodificeerde versie; PbEG 2009, L 47).
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27
  - number: 2.27a
    text: 'In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27a
  - number: 2.27a.a
    text: |-
      *A-bedrijf:* inrichting als bedoeld in [artikel 2.27b, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27a
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27a.b
    text: |-
      *B-bedrijf:* inrichting als bedoeld in [artikel 2.27b, eerste lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27a
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27a.c
    text: |-
      *C-bedrijf:* inrichting als bedoeld in [artikel 2.27b, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27a
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27a.d
    text: |-
      *D-bedrijf:* inrichting als bedoeld in [artikel 2.27b, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27a
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27a.e
    text: |-
      *E-bedrijf:* inrichting als bedoeld in [artikel 2.27b, eerste lid, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27a
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27a.f
    text: |-
      *F-bedrijf:* inrichting als bedoeld in [artikel 2.27b, eerste lid, onderdeel e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27a
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27a.g
    text: |-
      *onderzoeksinstituut:* onderzoeksinstituut dat beschikt over een instellingsvergunning als bedoeld in
      [artikel 2 van de Wet op de dierproeven][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27a
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '2'
  - number: 2.27a.h
    text: |-
      *RE-bedrijf:* inrichting als bedoeld in [artikel 2.27b, eerste lid, onderdeel f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27a
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27b.1
    text: |-
      Onze Minister registreert op aanvraag een inrichting waar varkens worden gehouden en waar slechts één varkenshouder
      actief is als:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27b
  - number: 2.27b.1.a
    text: |-
      A-bedrijf, indien op de inrichting vrouwelijke varkens worden gehouden voor het produceren van biggen en wordt
      voldaan aan bij ministeriële regeling te stellen regels;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27b
  - number: 2.27b.1.b
    text: B-bedrijf, indien op de inrichting vrouwelijke varkens worden gehouden voor het produceren van biggen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27b
  - number: 2.27b.1.c
    text: |-
      C-bedrijf, indien op de inrichting gespeende varkens of gebruiksvarkens worden opgefokt tot beer of gelt en wordt
      voldaan aan bij ministeriële regeling te stellen regels;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27b
  - number: 2.27b.1.d
    text: |-
      E-bedrijf, indien op de inrichting gespeende varkens worden opgefokt tot gebruiksvarkens, slechts gespeende varkens
      worden aangevoerd die uitsluitend afkomstig zijn van hetzelfde A-bedrijf en wordt voldaan aan bij ministeriële
      regeling te stellen regels;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27b
  - number: 2.27b.1.e
    text: |-
      F-bedrijf, indien op de inrichting gespeende varkens worden opgefokt tot gebruiksvarkens en slechts gespeende
      varkens worden aangevoerd die uitsluitend afkomstig zijn van hetzelfde B-bedrijf;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27b
  - number: 2.27b.1.f
    text: |-
      RE-bedrijf, indien op de inrichting op elk moment ten hoogste vier of minder varkens en hun eventuele biggen worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27b
  - number: 2.27b.2
    text: |-
      Onze Minister registreert een inrichting waar varkens worden gehouden als D-bedrijf, indien ten aanzien van die
      inrichting niet is voldaan aan de criteria, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27b
  - number: 2.27b.3
    text: 'De regels, bedoeld in het eerste lid, onderdelen a, c en d, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27b
  - number: 2.27b.3.a
    text: de ruimte en het terrein waar dieren worden gehouden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27b
  - number: 2.27b.3.b
    text: de aanwezige voorzieningen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27b
  - number: 2.27b.3.c
    text: |-
      de te verrichten onderzoeken bij dieren naar de aanwezigheid van besmettelijke dierziekten of zoönosen en de
      informatie die daarover aan Onze Minister wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27b
  - number: 2.27b.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de bij een aanvraag als bedoeld in het eerste lid te
      voegen informatie.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27b
  - number: 2.27c
    text: |-
      [Artikel 2.27b][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27c
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27c.a
    text: een onderzoeksinstituut;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27c
  - number: 2.27c.b
    text: een slachthuis;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27c
  - number: 2.27c.c
    text: een spermawininrichting;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27c
  - number: 2.27c.d
    text: een verzamelcentrum in Nederland.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27c
  - number: 2.27d.1
    text: |-
      Ten hoogste drie houders van varkens die zijn geregistreerd als C-bedrijf kunnen zich bij Onze Minister registreren
      als cluster, indien dat cluster:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27d
  - number: 2.27d.1.a
    text: varkens afneemt van telkens hetzelfde A-bedrijf of E-bedrijf, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27d
  - number: 2.27d.1.b
    text: varkens afvoert naar ten hoogste 30 B-bedrijven of D-bedrijven per twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27d
  - number: 2.27d.2
    text: 'Bij de registratie melden de houders via een door Onze Minister beschikbaar gesteld middel:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27d
  - number: 2.27d.2.a
    text: naam en adresgegevens van de betreffende houders;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27d
  - number: 2.27d.2.b
    text: de verdeling van het aantal afleveradressen, bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27d
  - number: 2.27d.3
    text: |-
      De samenstelling van een cluster en de verdeling van het aantal afleveradressen kunnen éénmaal per twaalf maanden
      worden gewijzigd via een daartoe door Onze Minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27d
  - number: 2.27e.1
    text: |-
      Twee houders van varkens die zijn geregistreerd als F-bedrijf kunnen zich bij Onze Minister registreren als
      cluster, indien dat cluster:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27e
  - number: 2.27e.1.a
    text: varkens afneemt van uitsluitend een en hetzelfde B-bedrijf, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27e
  - number: 2.27e.1.b
    text: 'varkens afvoert naar uitsluitend het B-bedrijf, bedoeld in onderdeel a, of naar ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27e
  - number: 2.27e.1.b.1°
    text: zes D-bedrijven per periode van zes weken, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27e
  - number: 2.27e.1.b.2°
    text: twaalf D-bedrijven per periode van zestien weken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27e
  - number: 2.27e.2
    text: |-
      Bij de registratie melden de houders via een door Onze Minister beschikbaar gesteld middel de naam en adresgegevens
      van de betreffende houders.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27e
  - number: 2.27e.3
    text: |-
      De samenstelling van een cluster kan éénmaal per twaalf maanden worden gewijzigd via een daartoe door Onze Minister
      beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27e
  - number: 2.27f
    text: |-
      Onze Minister kan een registratie als bedoeld in [artikel 2.27b, eerste lid][ref1], schorsen of intrekken, indien
      de houder:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27f
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27f.a
    text: niet langer voldoet aan de registratievoorwaarden; of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27f
  - number: 2.27f.b
    text: |-
      in strijd handelt met de vervoersbepalingen, bedoeld in de [artikelen 2.27g tot en met 2.27n][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27f
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27g.1
    text: |-
      Varkens worden slechts vervoerd vanaf of naar een inrichting die is geregistreerd op grond van
      [artikel 2.27b][ref1], indien dat vervoer is toegestaan op grond van de [artikelen 2.27h tot en met 2.27n][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27g
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27g.2
    text: 'Het eerste lid is niet van toepassing, indien een houder varkens:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27g
  - number: 2.27g.2.a
    text: afvoert naar een slachthuis, al dan niet via een verzamelcentrum;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27g
  - number: 2.27g.2.b
    text: afvoert naar een spermawininrichting;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27g
  - number: 2.27g.2.c
    text: afvoert naar een onderzoeksinstituut;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27g
  - number: 2.27g.2.d
    text: afvoert naar een RE-bedrijf;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27g
  - number: 2.27g.2.e
    text: aanvoert van of afvoert naar een inrichting in het buitenland, al dan niet via een verzamelcentrum.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27g
  - number: 2.27h.1
    text: 'Het is toegestaan om varkens aan te voeren op een A-bedrijf, indien:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27h
  - number: 2.27h.1.a
    text: 'het aanvoer betreft van:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27h
  - number: 2.27h.1.a.1°
    text: |-
      gelten of zeugen respectievelijk beren die afkomstig zijn van telkens hetzelfde A-bedrijf, C-bedrijf, E-bedrijf of
      spermawininrichting; of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27h
  - number: 2.27h.1.a.2°
    text: gespeende varkens vanaf een E-bedrijf en die varkens oorspronkelijk van dat A-bedrijf afkomstig waren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27h
  - number: 2.27h.1.b
    text: |-
      die varkens na aanvoer worden gehouden in een stal, afgescheiden van de overige stallen, totdat onderzoek van
      bloedmonsters is uitgevoerd waaruit blijkt dat in die monsters geen antilichamen zijn aangetroffen tegen klassieke
      varkenspest en geen gB-antilichamen tegen de ziekte van Aujeszky; of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27h
  - number: 2.27h.1.c
    text: |-
      vanaf dat bedrijf in de zes weken na de dag waarop die varkens zijn aangevoerd slechts varkens worden afgevoerd
      naar een slachthuis, al dan niet via een verzamelcentrum.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27h
  - number: 2.27h.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de stal waarin varkens worden gehouden en het
      onderzoek, bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27h
  - number: 2.27h.3
    text: 'Het is toegestaan om varkens af te voeren van een A-bedrijf, indien die afvoer plaatsvindt naar:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27h
  - number: 2.27h.3.a
    text: een A-bedrijf, B-bedrijf of D-bedrijf;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27h
  - number: 2.27h.3.b
    text: |-
      telkens hetzelfde C-bedrijf of cluster van C-bedrijven als bedoeld in [artikel 2.27d][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27h
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27h.3.c
    text: telkens hetzelfde E-bedrijf.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27h
  - number: 2.27i.1
    text: 'Het is toegestaan om varkens aan te voeren op een B-bedrijf, indien het aanvoer betreft van:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27i
  - number: 2.27i.1.a
    text: |-
      gelten of zeugen respectievelijk beren die afkomstig zijn van telkens hetzelfde A-bedrijf, C-bedrijf, E-bedrijf of
      spermawininrichting, of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27i
  - number: 2.27i.1.b
    text: gespeende varkens of gelten vanaf een F-bedrijf en die varkens oorspronkelijk van dat B-bedrijf afkomstig waren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27i
  - number: 2.27i.2
    text: 'Het is toegestaan om varkens af te voeren van een B-bedrijf, indien afvoer plaatsvindt naar:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27i
  - number: 2.27i.2.a
    text: 'een D-bedrijf al dan niet via hetzelfde F-bedrijf, waarbij per periode van:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27i
  - number: 2.27i.2.a.1°
    text: zes weken afvoer is toegestaan naar ten hoogste zes D-bedrijven, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27i
  - number: 2.27i.2.a.2°
    text: zestien weken afvoer is toegestaan naar ten hoogste twaalf D-bedrijven;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27i
  - number: 2.27i.2.b
    text: uitsluitend hetzelfde cluster van F-bedrijven.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27i
  - number: 2.27j.1
    text: |-
      Het is toegestaan om varkens aan te voeren op een C-bedrijf, indien aanvoer plaatsvindt vanaf telkens hetzelfde A-
      bedrijf of E-bedrijf.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27j
  - number: 2.27j.2
    text: 'Het is toegestaan om varkens af te voeren van een C-bedrijf, indien die afvoer plaatsvindt naar:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27j
  - number: 2.27j.2.a
    text: een A-bedrijf;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27j
  - number: 2.27j.2.b
    text: 'een B-bedrijf of D-bedrijf, waarbij:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27j
  - number: 2.27j.2.b.1°
    text: per twaalf maanden naar ten hoogste 40 bedrijven wordt afgevoerd; of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27j
  - number: 2.27j.2.b.2°
    text: |-
      voor zover het C-bedrijf onderdeel is van een cluster van C-bedrijven als bedoeld in [artikel 2.27d][ref1], per
      twaalf maanden door de bedrijven in dat cluster gezamenlijk naar ten hoogste 30 bedrijven wordt afgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27j
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27k
    text: |-
      Het is toegestaan om varkens aan te voeren op een D-bedrijf, indien die dieren afkomstig zijn van een A-bedrijf,
      B-bedrijf, C-bedrijf, E-bedrijf of F-bedrijf, waarbij per periode van zestien weken aanvoer plaatsvindt van ten
      hoogste zes bedrijven.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27k
  - number: 2.27l.1
    text: |-
      Het is toegestaan om varkens aan te voeren op een E-bedrijf, indien aanvoer plaatsvindt vanaf uitsluitend een en
      hetzelfde A-bedrijf.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27l
  - number: 2.27l.2
    text: 'Het is toegestaan om varkens af te voeren van een E-bedrijf, indien afvoer plaatsvindt naar:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27l
  - number: 2.27l.2.a
    text: een A-bedrijf, B-bedrijf of D-bedrijf; of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27l
  - number: 2.27l.2.b
    text: |-
      uitsluitend hetzelfde C-bedrijf of cluster van C-bedrijven als bedoeld in [artikel 2.27d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27l
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27m.1
    text: |-
      Het is toegestaan om varkens aan te voeren op een F-bedrijf, indien aanvoer plaatsvindt vanaf uitsluitend een en
      hetzelfde B-bedrijf.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27m
  - number: 2.27m.2
    text: 'Het is toegestaan om varkens af te voeren van een F-bedrijf naar:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27m
  - number: 2.27m.2.a
    text: het B-bedrijf waarvan die dieren oorspronkelijk afkomstig waren; of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27m
  - number: 2.27m.2.b
    text: |-
      een D-bedrijf, waarbij voor zover het F-bedrijf onderdeel is van een cluster van F-bedrijven als bedoeld in
      [artikel 2.27e][ref1], per periode van:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27m
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27m.2.b.1°
    text: zes weken afvoer is toegestaan naar ten hoogste zes D-bedrijven, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27m
  - number: 2.27m.2.b.2°
    text: zestien weken afvoer is toegestaan naar ten hoogste twaalf D-bedrijven.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27m
  - number: 2.27n
    text: |-
      Het is toegestaan om varkens aan te voeren op een RE-bedrijf, indien daarmee op het bedrijf niet meer dan vier
      varkens en hun eventuele biggen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27n
  - number: 2.27o.1
    text: |-
      Een houder van varkens als bedoeld in
      [artikel 2.27h, eerste lid, onderdeel a, onder 1°, of derde lid, onderdelen b of c][ref1], of
      [artikel 2.27i, eerste lid, onderdeel a, onder 1°, of tweede lid][ref2], die uitsluitend van hetzelfde bedrijf
      dieren ontvangt of aan hetzelfde bedrijf of dezelfde bedrijven dieren levert, registreert dat bij Onze Minister via
      een daartoe door Onze Minister beschikbaar gesteld middel.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27o
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27o.2
    text: |-
      Een houder als bedoeld in het eerste lid kan éénmaal per twaalf maanden wisselen van leverancier of afnemer
      van varkens, nadat de houder daarvan melding heeft gedaan bij Onze Minister via een daartoe door Onze Minister
      beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27o
  - number: 2.27o.3
    text: |-
      De wisseling, bedoeld in het tweede lid, kan voor een A-bedrijf of B-bedrijf zowel voor gelten en zeugen
      plaatsvinden als voor beren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27o
  - number: 2.27p.1
    text: |-
      Een houder van varkens voert geen varkens van zijn bedrijf af onderscheidenlijk op zijn bedrijf aan zonder
      voorafgaande toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27p
  - number: 2.27p.2
    text: Het vervoer, bedoeld in het eerste lid, vindt plaats binnen zeven dagen nadat toestemming is verkregen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27p
  - number: 2.27p.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanvraag en de documentatie van de
      toestemming, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27p
  - number: 2.27q.1
    text: |-
      Een houder van varkens als bedoeld in [artikel 2.27b, eerste lid, onderdelen a tot en met e, en tweede lid][ref1],
      laat die dieren onderzoeken op de aanwezigheid van besmettelijke dierziekten.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27q
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.27q.2
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27q
  - number: 2.27q.2.a
    text: de aard en de frequentie van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27q
  - number: 2.27q.2.b
    text: het aanleveren en bewaren van gegevens;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27q
  - number: 2.27q.2.c
    text: het ter beschikking stellen van onderzoeksresultaten;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27q
  - number: 2.27q.2.d
    text: de gevallen waarin het eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.27q
  - number: '2.28'
    text: |-
      Als handelingen als bedoeld in [artikel 2.9, derde lid, van de wet][ref1] worden aangewezen het door houder van
      het rund:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.28.a
    text: |-
      verrichten van de ingreep, bedoeld in [artikel 2.1, onderdeel d, van het Besluit diergeneeskundigen][ref1], bij
      runderen, mits het dier jonger is dan vier weken;


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.28.b
    text: |-
      verrichten van de ingreep, bedoeld in [artikel 2.4, onderdeel a, van het Besluit diergeneeskundigen][ref1], mits de
      ingreep geschiedt op aanwijzing van een plaatselijk praktiserende dierenarts nadat deze een plaatselijke verdoving
      ten behoeve van deze ingreep heeft toegepast en voor zover deze handeling wordt verricht bij runderen jonger dan
      twee maanden met behulp van een elektrische of heteluchtmethode dan wel bij runderen ouder dan zes maanden door
      middel van een draadzaag;


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.28.c
    text: |-
      verrichten van ingrepen als bedoeld in de [artikelen 2.4, onderdeel b][ref1], en
      [2.6, onderdelen b en c, van het Besluit diergeneeskundigen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.28.d
    text: |-
      het intraveneus toedienen aan een rund van een vloeistof die als werkzame bestanddelen uitsluitend calcium en
      magnesium bevat in een hoeveelheid van ten hoogste 450 ml;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.28
  - number: 2.28.e
    text: openleggen van zoolzweren bij runderen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.28
  - number: '2.29'
    text: |-
      In deze paragraaf wordt verstaan onder: - *eenlingbox:* ruimte met ten minste drie wanden bestemd voor het
      huisvesten van één kalf;
        - *kalf:* rund behorend tot de soort Bos primigenius taurus, van ten hoogste zes maanden;
        - *stal:* ruimte bestemd voor het, al dan niet in eenlingboxen, houden van één of meer kalveren;
        - *vleeskalf:* kalf dat kennelijk wordt opgefokt tot een rund bestemd om met het oog op de vleesproductie te worden
      geslacht op een leeftijd van ten hoogste acht maanden;
        - *vleesstierkalf:* kalf van het mannelijk geslacht dat wordt opgefokt tot een rund bestemd om met het oog op de
      vleesproductie te worden geslacht op een leeftijd van ten minste acht maanden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.29
  - number: '2.30'
    text: |-
      De [artikelen 2.32][ref1] en [2.33][ref2] zijn niet van toepassing op een kalf dat door de moeder wordt gezoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.31.1
    text: Een kalf wordt niet aangebonden gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.31
  - number: 2.31.2
    text: |-
      In afwijking van het eerste lid is het toegestaan om kalveren in groepshokken aan te binden tijdens het voederen
      van melk of een melkvervangend preparaat voor ten hoogste één uur.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.31
  - number: 2.31.3
    text: |-
      Het aanbinden, bedoeld in het tweede lid, vindt plaats met een verbindingsmiddel dat zodanig is ontworpen dat er
      geen wurging of verwonding bij het kalf optreedt en het kalf zonder problemen kan liggen, rusten, opstaan en zich
      zonder problemen kan likken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.31
  - number: 2.31.4
    text: |-
      Een verbindingsmiddel als bedoeld in het derde lid wordt regelmatig geïnspecteerd en eventueel bijgesteld om te
      zorgen dat het gemakkelijk zit.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.31
  - number: 2.31.5
    text: Een kalf wordt niet gemuilkorfd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.31
  - number: 2.32.1
    text: Een kalf ouder dan 8 weken wordt niet in een eenlingbox gehuisvest.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.32
  - number: 2.32.2
    text: |-
      Het eerste lid is niet van toepassing indien een dierenarts heeft bepaald dat een kalf in verband met zijn
      gezondheid of gedrag moet worden geïsoleerd om te worden behandeld.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.32
  - number: 2.32.3
    text: 'Indien een kalf anders dan in eenlingboxen wordt gehouden, heeft een kalf met een levend gewicht van:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.32
  - number: 2.32.3.a
    text: minder dan 150 kg, de beschikking over ten minste 1,5 m2 vloeroppervlakte;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.32
  - number: 2.32.3.b
    text: 150 kg tot 220 kg, de beschikking over ten minste 1,7 m2 vloeroppervlakte;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.32
  - number: 2.32.3.c
    text: 220 kg of meer, de beschikking over ten minste 1,8 m2 vloeroppervlakte.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.32
  - number: 2.33.1
    text: |-
      Indien een kalf in een eenlingbox wordt gehouden, heeft die eenlingbox een breedte van ten minste de schofthoogte
      van het kalf, gemeten terwijl het kalf rechtop staat, en een lengte van ten minste 1,1 maal de lichaamslengte van
      het kalf, gemeten van de neuspunt tot aan de achterkant van de zitbeenknobbel (tuber ischii).
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.33
  - number: 2.33.2
    text: |-
      Met uitzondering van een eenlingbox die voor het isoleren van zieke dieren wordt gebruikt, zijn de wanden van een
      eenlingbox zodanig uitgevoerd dat naast elkaar gehouden kalveren elkaar kunnen zien en aanraken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.33
  - number: 2.34.1
    text: |-
      De stal is zodanig ingericht dat een kalf zonder problemen kan liggen, rusten, opstaan en zich zonder problemen
      kan likken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.34
  - number: 2.34.2
    text: |-
      Indien kalveren in een stal met ligboxen worden gehouden, is het aantal ligboxen ten minste gelijk aan het aantal
      kalveren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.34
  - number: 2.35.1
    text: |-
      De vloer van een stal is stroef en aangepast aan het gewicht en de grootte van de kalveren en vormt een stevige,
      vlakke en stabiele oppervlakte.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.35
  - number: 2.35.2
    text: Bij ministeriële regeling kunnen regels worden gesteld over de eigenschappen van de vloer.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.35
  - number: 2.36.1
    text: |-
      De ligruimte van een stal is comfortabel en zindelijk, beschikt over een behoorlijke afvoer en is niet schadelijk
      voor de kalveren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.36
  - number: 2.36.2
    text: De vloer van de stal van kalveren jonger dan twee weken is ingestrooid met adequaat strooisel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.36
  - number: 2.36.3
    text: |-
      Kalveren met uitzondering van vleesstierkalveren ouder dan twee maanden beschikken over ligruimte die is
      ingestrooid of is voorzien van een kunststof mat, houten lattenrooster of rubber toplaag.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.36
  - number: 2.36.4
    text: |-
      De oppervlakte van de ligruimte bedraagt in stallen waarin de kalveren niet zijn aangebonden of niet in
      eenlingboxen zijn gehuisvest, voor kalveren tot een leeftijd van drie maanden ten minste 0,50 m2 beschikbare ruimte
      per kalf en voor kalveren ouder dan drie maanden ten minste 0,70 m2 beschikbare ruimte per kalf.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.36
  - number: 2.37.1
    text: Kalveren beschikken over passend dag- of kunstlicht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.37
  - number: 2.37.2
    text: |-
      Van passend dag- of kunstlicht is in ieder geval sprake indien de oppervlakte van lichtdoorlatend materiaal in wand
      of dak van een stal bestemd voor vleeskalveren ten minste 2% van de vloeroppervlakte van de stal bedraagt en van
      een stal bestemd voor andere kalveren dan vleeskalveren ten minste 5% bedraagt van die oppervlakte, waarbij het
      materiaal zodanig is aangebracht dat het licht in de stal gelijkmatig is gespreid.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.37
  - number: 2.38.1
    text: |-
      Indien kalveren in groepshokken worden gehouden en niet ad libitum of via een automatisch voedersysteem worden
      gevoederd, is de breedte van het voerhek zodanig dat alle kalveren tegelijk kunnen eten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.38
  - number: 2.38.2
    text: De breedte van het voerhek bedraagt ten minste 0,40 m per kalf.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.38
  - number: 2.38.3
    text: |-
      In stallen voorzien van een systeem van voorraadvoedering beschikken kalveren over ten minste één eetplaats per
      drie kalveren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.38
  - number: '2.39'
    text: |-
      De installaties die voor het voederen en drenken worden gebruikt, zijn op zodanige wijze ontworpen, gebouwd
      en geplaatst en worden op zodanige wijze onderhouden, dat gevaar voor verontreiniging van het voor de kalveren
      bestemde voer en water wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.39
  - number: '2.40'
    text: |-
      Maatregelen als bedoeld in [artikel 2.5, negende lid][ref1], bestaan in ieder geval uit het toepassen van andere
      voedermethoden en het handhaven van een acceptabel leefklimaat.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.40
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.41.1
    text: Kalveren worden ten minste tweemaal per dag gevoederd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.41
  - number: 2.41.2
    text: |-
      Onverminderd de [artikelen 1.7, onderdeel e][ref1], en [2.4, zesde lid][ref2], beschikken kalveren over voer dat
      beantwoordt aan de met hun gedrag samenhangende behoeften.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.41
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.41.3
    text: De voeding bevat voldoende ijzer om een gemiddeld hemoglobinegehalte van ten minste 4.5 mmol/l te bereiken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.41
  - number: 2.41.4
    text: |-
      Aan kalveren ouder dan twee weken wordt dagelijks een hoeveelheid vezelhoudend voer verstrekt, welke hoeveelheid
      voor kalveren van 8 tot 20 weken oud wordt verhoogd van 50 gram tot 250 gram per dag.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.41
  - number: 2.42.1
    text: |-
      In afwijking van [artikel 1.7, onderdeel f][ref1], kunnen aan een kalf ouder dan twee weken ook andere vloeistoffen
      dan water worden verstrekt om in zijn behoefte aan drinken te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.42
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 2.42.2
    text: Bij warm weer en voor zieke kalveren is permanent vers drinkwater beschikbaar.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.42
  - number: 2.42.3
    text: Kalveren krijgen zo spoedig mogelijk, maar in elk geval binnen zes uur na hun geboorte, koebiest te drinken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.42
  - number: '2.43'
    text: |-
      In afwijking van [artikel 2.4, tweede lid][ref1], worden op stal gehouden kalveren ten minste tweemaal per dag en
      in de open lucht gehouden kalveren ten minste eenmaal per dag geïnspecteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.43
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.44.1
    text: |-
      De stal, eenlingboxen, uitrusting en gereedschap voor kalveren worden op passende wijze gereinigd en ontsmet
      teneinde kruiscontaminatie en ziekteverwekkers te voorkomen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.44
  - number: 2.44.2
    text: |-
      Uitwerpselen, urine en niet opgegeten of gemorst voer worden zo vaak mogelijk verwijderd, zodat de reuk zoveel
      mogelijk wordt beperkt en geen vliegen en knaagdieren worden aangetrokken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.44
  - number: '2.45'
    text: |-
      Het afzonderen, bedoeld in [artikel 2.4, vierde lid][ref1], vindt plaats in een adequate ruimte die is voorzien van
      droog en comfortabel strooisel en die plaats biedt aan ten minste 1% van het aantal gehouden kalveren en indien dit
      minder is dan één, aan ten minste één kalf.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.45
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '2.46'
    text: |-
      De invoer van kalveren die vanuit een derde land via Nederland voor het eerst op het grondgebied van de de Europese
      Unie worden gebracht, is slechts toegestaan indien de kalveren vergezeld gaan van een geldig, door de bevoegde
      autoriteit van dat derde land afgegeven, volledig ingevuld en gedagtekend certificaat als bedoeld in artikel 8
      van [richtlijn 2008/119/EG](32008L0119) van de Raad van 18 december 2008 tot vaststelling van minimumnormen ter
      bescherming van kalveren (Gecodificeerde versie; PbEU 2008, L 10).
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.46
  - number: 2.46a.1
    text: |-
      Een houder van een rund, dat na een dracht van meer dan 100 dagen een of meer vruchten ter wereld heeft gebracht,
      laat bij dat dier binnen een week nadat die vrucht of vruchten ter wereld zijn gebracht een bloedmonster nemen en
      laat die monsters onderzoeken op de aanwezigheid van antilichamen tegen brucellose, indien die vrucht of vruchten
      spontaan meer dan 21 dagen eerder dan de gemiddelde draagtijd van het desbetreffende runderras ter wereld zijn
      gebracht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.46a
  - number: 2.46a.2
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.46a
  - number: 2.46a.2.a
    text: de monstername en het onderzoek, bedoeld in het eerste lid; en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.46a
  - number: 2.46a.2.b
    text: administratie van de bemonstering.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.46a
  - number: '2.47'
    text: |-
      Als handelingen als bedoeld in [artikel 2.9, derde lid, van de wet][ref1] worden aangewezen het door de houder van
      het pluimvee:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.47.a
    text: |-
      verrichten van de ingreep, bedoeld in [artikel 2.1, onderdeel b, van het Besluit diergeneeskundigen][ref1] ten
      behoeve van het afnemen van bloed bij kippen, kalkoenen en eenden, voor zover deze handeling niet krachtens een
      ander wettelijk voorschrift aan anderen is voorbehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.47.b
    text: |-
      verrichten van de ingreep, bedoeld in [artikel 2.2, onderdeel a, van het Besluit diergeneeskundigen][ref1], mits
      het dier niet ouder is dan twee dagen;


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.47.c
    text: |-
      verrichten van ingrepen als bedoeld in de [artikelen 2.2, onderdelen b tot en met f][ref1],
      en[ 2.6, onderdelen b en f, van het Besluit diergeneeskundigen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.47.d
    text: |-
      verrichten van de ingreep, bedoeld in [artikel 2.6, onderdeel e, van het Besluit diergeneeskundige][ref1]n, mits
      het dier niet ouder is dan twee dagen;


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.47.e
    text: |-
      verrichten van de ingreep, bedoeld in [artikel 2.6, onderdeel n, van het Besluit diergeneeskundigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: '2.48'
    text: |-
      In deze paragraaf wordt verstaan onder: - *bezettingsdichtheid:* totale levende gewicht van vleeskuikens die
      tegelijkertijd in de stal per vierkante meter bruikbare oppervlakte aanwezig zijn;
        - *bruikbare oppervlakte:* van strooisel voorziene oppervlakte die te allen tijde voor vleeskuikens toegankelijk
      is;
        - *dagelijkse mortaliteit:* aantal vleeskuikens dat op dezelfde dag in een stal gestorven is, met inbegrip van de
      vleeskuikens die zijn gedood als bedoeld in [hoofdstuk 5][ref1], gedeeld door het aantal vleeskuikens dat op die
      dag in de stal aanwezig was, vermenigvuldigd met 100;
        - *gecumuleerde dagelijkse mortaliteit:* som van de dagelijkse mortaliteitscijfers;
        - *koppel:* groep vleeskuikens die in een stal zijn ondergebracht en gelijktijdig in die stal aanwezig zijn;
        - *pluimveebedrijf:* productieplaats waar vleeskuikens worden gehouden;
        - *richtlijn 2007/43/EG:* [richtlijn 2007/43](32007L0043)//EG van de Raad van 28 juni 2007 tot vaststelling van
      minimumvoorschriften voor de bescherming van vleeskuikens (PbEU 2007, L 182);
        - *stal:* gebouw op een pluimveebedrijf waar een koppel vleeskuikens wordt gehouden;
        - *vleeskuiken:* dier van de soort Gallus gallus dat wordt gehouden voor de productie van vlees.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.48
    references:
      - id: ref1
        bwb_id: BWBR0035217
        hoofdstuk: '5'
  - number: '2.49'
    text: 'Deze paragraaf is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.49
  - number: 2.49.a
    text: pluimveebedrijven met minder dan 500 vleeskuikens;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.49
  - number: 2.49.b
    text: pluimveebedrijven met alleen vermeerderingsdieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.49
  - number: 2.49.c
    text: broederijen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.49
  - number: 2.49.d
    text: |-
      vleeskuikens in extensieve scharrel- en vrije-uitloophouderijen als bedoeld in bijlage V onder b, c, d en e, bij
      verordening (EG) nr. 543/2008 van de Commissie van 16 juni 2008 houdende uitvoeringsbepalingen voor Verordening
      (EG) nr. 1234/2007 van de Raad wat betreft de handelsnormen voor vlees van pluimvee (PbEU 2007, L 157);
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.49
  - number: 2.49.e
    text: |-
      vleeskuikens gehouden overeenkomstig de regels die zijn vastgesteld op grond van artikel 11, derde lid, van de
      verordening, genoemd in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.49
  - number: 2.49.f
    text: |-
      vleeskuikens gehouden overeenkomstig verordening (EG) nr. 834/2007 van de Raad van 28 juni 2007 inzake de
      biologische productie en de etikettering van biologische producten en tot intrekking van Verordening (EEG)
      nr. 2092/91 (PbEU 1991, L 198).
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.49
  - number: 2.50.1
    text: Het is verboden vleeskuikens te houden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.50
  - number: 2.50.2
    text: 'Het verbod, bedoeld in het eerste lid, is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.50
  - number: 2.50.2.a
    text: de bezettingsdichtheid niet hoger is dan 33 kg/m2, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.50
  - number: 2.50.2.b
    text: |-
      wordt voldaan aan de [artikelen 2.51 tot en met 2.54][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.50
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.50.3
    text: |-
      In afwijking van het eerste lid en het tweede lid, onderdeel a, is het toegestaan vleeskuikens te houden met een
      hogere bezettingsdichtheid dan 33 kg/m2, indien:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.50
  - number: 2.50.3.a
    text: de bezettingsdichtheid niet hoger is dan 39 kg/m2, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.50
  - number: 2.50.3.b
    text: |-
      wordt voldaan aan de [artikelen 2.55 tot en met 2.58][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.50
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.50.4
    text: |-
      In afwijking van het eerste lid, het tweede lid, onderdeel a en het derde lid, is het toegestaan vleeskuikens te
      houden met een hogere bezettingsdichtheid dan 39 kg/m2, indien:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.50
  - number: 2.50.4.a
    text: de bezettingsdichtheid niet hoger is dan 42 kg/m2, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.50
  - number: 2.50.4.b
    text: |-
      wordt voldaan aan het gestelde bij of krachtens de [artikelen 2.55 tot en met 2.64][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.50
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '2.51'
    text: |-
      Vleeskuikens worden gehouden, gehuisvest en verzorgd overeenkomstig de punten 1 tot en met 10 van bijlage I van
      [richtlijn 2007/43/EG](32007L0043).
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.51
  - number: 2.52.1
    text: 'De houder registreert voor elke stal de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.52
  - number: 2.52.1.a
    text: het aantal binnengebrachte vleeskuikens;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.52
  - number: 2.52.1.b
    text: de bruikbare oppervlakte;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.52
  - number: 2.52.1.c
    text: de kruising of het ras van de vleeskuikens, indien bekend;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.52
  - number: 2.52.1.d
    text: |-
      ten aanzien van iedere controle, het aantal dood aangetroffen vleeskuikens met een indicatie van de oorzaken,
      indien bekend, alsmede het aantal gedode vleeskuikens, met de reden, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.52
  - number: 2.52.1.e
    text: het resterende aantal vleeskuikens in het koppel nadat er vleeskuikens uit zijn verwijderd voor verkoop of slacht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.52
  - number: 2.52.2
    text: |-
      De gegevens, bedoeld in het eerste lid, worden drie jaren bewaard en worden bij een inspectie of op verzoek aan
      Onze Minister ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.52
  - number: 2.52.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het verzamelen en verstrekken van
      gegevens die noodzakelijk zijn voor het bepalen van de bezettingsdichtheid.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.52
  - number: 2.53.1
    text: |-
      Wanneer een dierenarts verbonden aan de Nederlandse Voedsel- en Waren Autoriteit, aan de houder en een ambtenaar
      als bedoeld in [artikel 8.1, eerste lid, van de wet][ref1], gegevens heeft verstrekt met betrekking tot de
      dagelijkse mortaliteit, de gecumuleerde dagelijkse mortaliteit of de resultaten van de post mortem keuring die
      wijzen op slechte dierenwelzijnsomstandigheden, neemt de desbetreffende houder passende maatregelen ter verbetering
      van het dierenwelzijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.53
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
  - number: 2.53.2
    text: |-
      Onze Minister treft, ingeval een dierenarts verbonden aan de Nederlandse Voedsel- en Warenautoriteit, informatie
      heeft verstrekt als bedoeld in het eerste lid, maatregelen ter verbetering van het dierenwelzijn, die onder meer
      kunnen inhouden:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.53
  - number: 2.53.2.a
    text: een verplichting voor de houder tot het opstellen van een plan van aanpak;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.53
  - number: 2.53.2.b
    text: |-
      een verbod voor de houder op het houden van vleeskuikens, tenzij de bezettingsdichtheid niet hoger is dan een bij
      die maatregel vast te stellen gewicht per vierkante meter, gedurende een bij die maatregel bepaalde periode.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.53
  - number: 2.53.3
    text: Het plan van aanpak, bedoeld in het tweede lid, onderdeel a, behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.53
  - number: 2.54.1
    text: |-
      De houder van vleeskuikens, voor zover deze een natuurlijke persoon is, is in het bezit van een door Onze Minister
      erkend certificaat waaruit blijkt dat hij passende cursussen heeft voltooid of gelijkwaardige ervaring heeft
      opgedaan.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.54
  - number: 2.54.2
    text: |-
      Van gelijkwaardige ervaring als bedoeld in het eerste lid is in elk geval sprake wanneer de ervaring is opgedaan
      voor 1 februari 2011.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.54
  - number: 2.54.3
    text: |-
      De cursussen, bedoeld in het eerste lid, zijn toegespitst op welzijnsaspecten en hebben in ieder geval betrekking
      op:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.54
  - number: 2.54.3.a
    text: |-
      de voorschriften van bijlage I van [richtlijn 2007/43/EG](32007L0043) en de [artikelen 2.56][ref1] en [2.57][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.54
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.54.3.b
    text: de fysiologie, met name de drink- en voederbehoeften, het diergedrag en het begrip stress;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.54
  - number: 2.54.3.c
    text: |-
      de praktische aspecten van de zorgzame omgang met vleeskuikens en van het vangen, laden en transporteren van
      vleeskuikens;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.54
  - number: 2.54.3.d
    text: eerste hulp voor vleeskuikens, het noodslachten en het doden van vleeskuikens;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.54
  - number: 2.54.3.e
    text: preventieve maatregelen op het gebied van bioveiligheid.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.54
  - number: 2.54.4
    text: |-
      De houder verstrekt instructies en advies over de relevante voorschriften inzake dierenwelzijn, inclusief die met
      betrekking tot de dodingsmethoden die op de pluimveebedrijven worden toegepast, aan de personen die hij in dienst
      heeft of die voor hem diensten verrichten en die voor vleeskuikens zorgen of vleeskuikens vangen en laden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.54
  - number: 2.54.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.54
  - number: 2.55.1
    text: |-
      De houder die voornemens is een zodanig aantal vleeskuikens te gaan houden dat de bezettingsdichtheid hoger zal
      worden dan 33 kg/m2, stelt Onze Minister ten minste 15 dagen voordat het desbetreffende koppel in de stal wordt
      geplaatst, in kennis van zijn voornemen en geeft daarbij aan hoe hoog de bezettingsdichtheid zal zijn.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.55
  - number: 2.55.2
    text: |-
      Indien Onze Minister daarom verzoekt, stuurt de houder een samenvatting van de informatie, bedoeld in
      [artikel 2.56, tweede lid][ref1], toe.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.55
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.55.3
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de wijze waarop de kennisgeving, bedoeld in het eerste
      lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.55
  - number: 2.56.1
    text: De houder legt per stal een verzameling van documenten aan waarin de productiesystemen in detail zijn beschreven.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.56
  - number: 2.56.2
    text: |-
      De verzameling documenten, bedoeld in het eerste lid, bevat in ieder geval informatie over technische details van
      de stal en de uitrusting van de stal, waaronder:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.56
  - number: 2.56.2.a
    text: een plattegrond van de stal met inbegrip van de afmetingen van de door de vleeskuikens ingenomen oppervlakten;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.56
  - number: 2.56.2.b
    text: het ventilatiesysteem en het koel- of verwarmingssysteem en de locatie van deze systemen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.56
  - number: 2.56.2.c
    text: |-
      het ventilatieschema met de beoogde parameters over luchtkwaliteit, zoals luchtstroming, luchtsnelheid en
      temperatuur;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.56
  - number: 2.56.2.d
    text: de voeder- en watervoorziening en de locatie ervan;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.56
  - number: 2.56.2.e
    text: |-
      de alarm- en reservesystemen die in werking treden in geval van een storing van de automatische of mechanische
      apparatuur die noodzakelijk is voor de gezondheid en het welzijn van de dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.56
  - number: 2.56.2.f
    text: het vloertype, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.56
  - number: 2.56.2.g
    text: het normaliter gebruikte strooisel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.56
  - number: 2.56.3
    text: De verzameling documenten, bedoeld in het eerste lid, wordt op verzoek aan Onze Minister ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.56
  - number: 2.56.4
    text: |-
      Indien de documenten op grond van het derde lid aan Onze Minister ter beschikking zijn gesteld, brengt de houder
      Onze Minister onverwijld op de hoogte van eventuele wijzigingen in de beschreven stal, uitrusting of procedures die
      van invloed kunnen zijn op het welzijn van de dieren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.56
  - number: '2.57'
    text: |-
      De houder rust elke stal van zijn pluimveebedrijf uit met een ventilatiesysteem en met koel- of
      verwarmingssystemen, die zo zijn ontworpen en gebouwd en die zo functioneren dat:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.57
  - number: 2.57.a
    text: |-
      de concentratie van ammoniak niet hoger is dan 20 ppm en de concentratie van kooldioxide niet hoger is dan 3.000
      ppm, gemeten ter hoogte van de kop van de vleeskuikens;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.57
  - number: 2.57.b
    text: |-
      de binnentemperatuur de buitentemperatuur met niet meer dan 3°C overschrijdt wanneer het buiten in de schaduw
      warmer is dan 30°C, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.57
  - number: 2.57.c
    text: |-
      de gemiddelde relatieve vochtigheidsgraad in de stal over een periode van 48 uur niet hoger is dan 70% bij een
      buitentemperatuur van minder dan 10°C.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.57
  - number: 2.58.1
    text: |-
      De houder draagt er zorg voor dat de documentatie bij een koppel vleeskuikens dat ter slachting wordt aangeboden,
      gegevens bevat over:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.58
  - number: 2.58.1.a
    text: de door de houder berekende dagelijkse mortaliteit en gecumuleerde dagelijkse mortaliteit en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.58
  - number: 2.58.1.b
    text: de kruising of het ras van de vleeskuikens.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.58
  - number: 2.58.2
    text: |-
      De gegevens, bedoeld in het eerste lid, alsmede het aantal vleeskuikens dat dood bij het slachthuis aankomt, worden
      onder toezicht van de dierenarts verbonden aan de Nederlandse Voedsel- en Waren Autoriteit, door de exploitant van
      het slachthuis geregistreerd met vermelding van het pluimveebedrijf van herkomst en de stal van het desbetreffende
      pluimveebedrijf. De aannemelijkheid van de juistheid van de gegevens wordt door de exploitant van het slachthuis
      geverifieerd, rekening houdend met het aantal geslachte vleeskuikens en met het aantal vleeskuikens dat dood bij
      het slachthuis aankomt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.58
  - number: 2.59.1
    text: |-
      De houder die voornemens is een zodanig aantal vleeskuikens te gaan houden dat de bezettingsdichtheid hoger zal
      worden dan 39 kg/m2, stelt Onze Minister ten minste 15 dagen voordat het desbetreffende koppel in de stal wordt
      geplaatst, in kennis van zijn voornemen en geeft daarbij aan hoe hoog de bezettingsdichtheid zal zijn.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.59
  - number: 2.59.2
    text: |-
      [Artikel 2.55, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.59
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.60.1
    text: |-
      In de twee jaren, voorafgaand aan de kennisgeving, bedoeld in [artikel 2.59, eerste lid][ref1], zijn door
      ambtenaren als bedoeld in [artikel 8.1, eerste lid, van de wet][ref2] op het pluimveebedrijf geen tekortkomingen in
      de naleving van deze paragraaf waargenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.60
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '8'
  - number: 2.60.2
    text: |-
      Ingeval er op het pluimveebedrijf in de twee jaren, bedoeld in het eerste lid, geen toezicht op de naleving van
      deze paragraaf heeft plaatsgevonden, geldt in afwijking van het eerste lid, dat er alsnog toezicht plaatsvindt, en
      hierbij geen tekortkomingen in de naleving van deze paragraaf worden waargenomen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.60
  - number: '2.61'
    text: |-
      De houder maakt bij de bedrijfsvoering gebruik van gidsen voor goede praktijken, die aanbevelingen bevatten voor de
      naleving van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.61
  - number: 2.62.1
    text: |-
      De gecumuleerde dagelijkse mortaliteit van ten minste zeven opeenvolgende gecontroleerde koppels van een stal
      bedraagt voorafgaand aan de kennisgeving, bedoeld in [artikel 2.59, eerste lid][ref1], minder dan de som van:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.62
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.62.1.a
    text: 1% en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.62
  - number: 2.62.1.b
    text: 0,06%, vermenigvuldigd met de slachtleeftijd van de dieren, uitgedrukt in dagen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.62
  - number: 2.62.2
    text: |-
      Ingeval de gecumuleerde dagelijkse mortaliteit meer bedraagt dan de som, bedoeld in het eerste lid, kan Onze
      Minister besluiten het eerste lid buiten toepassing te laten, indien de houder naar het oordeel van Onze Minister
      een toereikende verklaring voor de buitengewone aard van de hogere gecumuleerde dagelijkse mortaliteit heeft
      verstrekt en heeft aangetoond dat er sprake is van overmacht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.62
  - number: 2.63.1
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het voorkomen van de aandoening
      voetzoollaesies bij vleeskuikens.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.63
  - number: 2.63.2
    text: De houder voldoet aan de krachtens het eerste lid vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.63
  - number: 2.63.3
    text: |-
      Indien de houder niet kan voldoen aan de krachtens het eerste lid vastgestelde voorschriften, kan Onze Minister
      ontheffing verlenen van het tweede lid, indien de houder naar het oordeel van Onze Minister een toereikende
      verklaring voor de buitengewone aard van de overschrijding van de norm, heeft verstrekt, en heeft aangetoond dat er
      sprake is van overmacht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.63
  - number: 2.64.1
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder een nieuw pluimveebedrijf: een pluimveebedrijf waar
      vleeskuikens worden gehouden en dat van start gaat na de inwerkingtreding van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.64
  - number: 2.64.2
    text: |-
      De [artikelen 2.60 tot en met 2.62][ref1] zijn niet van toepassing op een pluimveebedrijf waar voorafgaand aan
      1 februari 2011 vleeskuikens worden gehouden tot het tijdstip waarop door een ambtenaar als bedoeld in artikel 114,
      eerste lid, van de wet toezicht is uitgeoefend op de naleving van deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.64
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.64.3
    text: |-
      De houder van een pluimveebedrijf als bedoeld in het tweede lid stelt Onze Minister binnen 15 dagen na
      inwerkingtreding van deze paragraaf in kennis van zijn voornemen om een zodanig aantal vleeskuikens te houden dat
      de bezettingsdichtheid na de inwerkingtreding van deze paragraaf hoger zal zijn dan 39 kg/m2.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.64
  - number: 2.64.4
    text: 'Het tweede lid is van overeenkomstige toepassing op:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.64
  - number: 2.64.4.a
    text: een nieuw pluimveebedrijf;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.64
  - number: 2.64.4.b
    text: |-
      een pluimveebedrijf waar voorheen vleeskuikens werden gehouden op een wijze als bedoeld in
      [artikel 2.49, eerste lid][ref1], en dat overstapt op het houden van vleeskuikens op een wijze waarop deze
      paragraaf van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.64
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.65.1
    text: |-
      De houder die voornemens is wijziging aan te brengen in het door hem te houden aantal vleeskuikens, waardoor
      de bezettingsdichtheid lager wordt dan 33 of 39 kg/m2, stelt Onze Minister ten minste 15 dagen voordat het
      desbetreffende koppel in de stal wordt geplaatst, in kennis van zijn voornemen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65
  - number: 2.65.2
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de wijze waarop de kennisgeving, bedoeld in
      [artikel 2.64, derde lid][ref1], en in het eerste lid, plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.65a
    text: |-
      In deze paragraaf wordt verstaan onder: - *koppel:* een groep ouderdieren die in een stal is ondergebracht, waarbij
      het leeftijdsverschil tussen de oudste hen en de jongste hen ten hoogste zeven dagen is;
        - *legnest:* afgescheiden ruimte voor een individueel ouderdier of een groep ouderdieren die geschikt is voor het
      leggen van eieren;
        - *ouderdier:* dier dat wordt gehouden voor de productie van broedeieren;
        - *plateau:* horizontaal aangebrachte verhoging van hout of kunststof waardoor geen mest kan vallen;
        - *strooisel:* houtkrullen, stro, gehakseld stro, turf, zand, zaagsel of ander materiaal met een losse structuur
      dat de dieren in staat stelt aan hun ethologische behoeften te voldoen;
        - *vleeskuiken:* dier van de soort Gallus gallus dat wordt gehouden voor de productie van vlees;
        - *zitstok:* horizontaal aangebrachte stok of lat van hout of kunststof waar het dier op kan zitten of rusten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65a
  - number: 2.65b
    text: |-
      Deze paragraaf is van toepassing op bedrijfsmatig gehouden ouderdieren van vleeskuikens en dieren van tien weken of
      ouder die worden opgefokt tot ouderdier van vleeskuikens.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65b
  - number: 2.65c.1
    text: 'De houder van ouderdieren registreert dagelijks, voor zover van toepassing, voor elke stal de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65c
  - number: 2.65c.1.a
    text: het aantal binnengebrachte ouderdieren, onderscheiden naar geslacht;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65c
  - number: 2.65c.1.b
    text: het aantal ouderdieren dat niet-levend wordt afgevoerd;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65c
  - number: 2.65c.1.c
    text: het resterend aantal ouderdieren in het koppel dat levend wordt afgevoerd, onderscheiden naar geslacht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65c
  - number: 2.65c.2
    text: De gegevens, bedoeld in het eerste lid, worden drie jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65c
  - number: 2.65d.1
    text: 'Een ouderdier beschikt ten minste over:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65d
  - number: 2.65d.1.a
    text: |-
      1.300 cm2 vloeroppervlakte per ouderdier, waaronder het legnest, waarbij de oppervlakte van in de stal aangebrachte
      plateaus die zich ten minste 35 cm boven de vloeroppervlakte bevinden mogen worden meegerekend en waarvan ten
      minste 300 cm2 per ouderdier is bedekt met strooisel;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65d
  - number: 2.65d.1.b
    text: een hoogte van 70 cm boven de vloeroppervlakte;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65d
  - number: 2.65d.1.c
    text: |-
      een zitstok met een lengte van ten minste 7 cm per ouderdier, met een vrije ruimte van ten minste 10 cm onder de
      zitstok en ten minste 35 cm daarboven;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65d
  - number: 2.65d.1.d
    text: |-
      een voerbak waarvan de lengte van de voor ouderdieren toegankelijke kant per ouderdier ten minste 12,5 cm bedraagt
      of, indien het een ronde voerbak betreft, een per ouderdier toegankelijke plek van ten minste 5 cm.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65d
  - number: 2.65d.2
    text: |-
      Onverminderd het eerste lid, onderdeel a, beschikken ouderdieren die in een kooi worden gehouden over een totale
      vloeroppervlakte van ten minste 2.850 cm2.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65d
  - number: 2.65d.3
    text: |-
      De oppervlakte, bedoeld in het eerste lid, is horizontaal en is dicht of bestaat uit roosters van hout of
      kunststof, niet zijnde draadroosters.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65d
  - number: 2.65d.4
    text: |-
      In afwijking van het eerste lid, onderdeel a, beschikt een ouderdier van een koppel waarvan de hennen een
      eindgewicht van ten hoogste 2,4 kg bereiken over ten minste 1.200 cm2 bruikbare oppervlakte per ouderdier.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65d
  - number: 2.65d.5
    text: |-
      Onverminderd de [artikelen 1.7, onderdeel e][ref1], en [2.4, zesde lid][ref2] beschikt een ouderdier als bedoeld in
      het vierde lid permanent over luzerne, snijmaissilage of daarmee vergelijkbaar ruwvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65d
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.65e
    text: |-
      Een dier dat wordt opgefokt om te worden gehouden als ouderdier beschikt over een vloeroppervlakte van ten minste
      666 cm2 per dier.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65e
  - number: 2.65f.1
    text: |-
      In afwijking van [artikel 2.4, tweede lid][ref1], worden ouderdieren ten minste tweemaal per dag gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65f
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.65f.2
    text: |-
      In afwijking van [artikel 2.5, achtste lid][ref1], wordt de apparatuur die noodzakelijk is voor de gezondheid en
      het welzijn van ouderdieren ten minste tweemaal per dag gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65f
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.65f.3
    text: De houder van ouderdieren controleert tweemaal per dag de kwaliteit van het strooisel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.65f
  - number: '2.66'
    text: |-
      In deze paragraaf wordt verstaan onder: - *legkip:* legrijp dier van de soort Gallus gallus dat wordt gehouden voor
      de productie van andere eieren dan broedeieren;
        - *huisvestingssysteem:* voorziening waarin legkippen op dezelfde wijze worden gehouden;
        - *kooi:* afgesloten ruimte bestemd voor het houden van één of meer legkippen waarin de legkippen zich niet
      vrijelijk over de vloer van de stal of op en naar verschillende niveaus binnen de stal kunnen bewegen;
        - *bruikbare oppervlakte:* een ten minste 30 cm breed oppervlak met een helling van ten hoogste 8 graden met boven
      het gehele oppervlak een vrije ruimte van ten minste 45 cm hoogte. De oppervlakte van het nest wordt niet tot de
      bruikbare oppervlakte gerekend;
        - *nest:* afgescheiden ruimte voor een individuele legkip of een groep legkippen die geschikt is voor het leggen
      van eieren en waarin een legkip niet in contact kan komen met bodembestanddelen die bestaan uit draadgaas;
        - *strooisel:* houtkrullen, stro, gehakseld stro, turf, zand of ander materiaal met een losse structuur dat
      legkippen in staat stelt aan hun ethologische behoeften te voldoen;
        - *zitstok:* horizontaal aangebrachte stok of lat van hout, metaal of kunststof zonder scherpe randen waar de
      legkip op kan zitten of rusten, in ieder geval niet bestaande uit draadgaas.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.66
  - number: '2.67'
    text: Deze paragraaf is niet van toepassing op houders van legkippen die minder dan 350 legkippen houden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.67
  - number: 2.68.1
    text: |-
      Legkippen worden ten minste gehuisvest en verzorgd overeenkomstig de [artikelen 2.70][ref1], [2.73][ref2],
      [2.74, eerste en tweede lid][ref3], [2.75][ref4] en [2.76][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.68
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref5
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.68.2
    text: |-
      In afwijking van het eerste lid is het toegestaan legkippen in een kooi als bedoeld in [artikel 2.71][ref1]
      te houden indien de legkippen ten minste worden gehuisvest en verzorgd overeenkomstig de artikelen 2.71 en
      [2.73 tot en met 2.76][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.68
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.69.1
    text: |-
      Onze Minister registreert houders van legkippen overeenkomstig artikel 7 van [richtlijn 1999/74/EG](31999L0074) van
      de Raad van 19 juli 1999 tot vaststelling van minimumnormen voor de bescherming van legkippen (PbEG 1999, L 203)
      of overeenkomstig de op grond van dat artikel vastgestelde uitvoeringsbepalingen. Hij verstrekt daartoe aan houders
      van legkippen een nummer dat geschikt is om de voor de menselijke consumptie in de handel gebrachte eieren te
      kunnen traceren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.69
  - number: 2.69.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.69
  - number: 2.69.3
    text: Het is verboden legkippen te houden zonder te beschikken over een nummer als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.69
  - number: 2.70.1
    text: 'Legkippen beschikken ten minste over:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.1.a
    text: 1.111 cm2 bruikbare oppervlakte per legkip;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.1.b
    text: één nest per 7 legkippen dan wel een gemeenschappelijk nest van 1 m2 per 120 legkippen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.1.c
    text: |-
      een met strooisel bedekte oppervlakte van 250 cm2 per legkip waarbij in ieder geval een derde deel van het
      grondoppervlak met strooisel is bedekt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.1.d
    text: |-
      een zitstok met een lengte van 15 cm per legkip die niet is aangebracht boven het strooisel. De horizontale afstand
      tussen de zitstokken bedraagt ten minste 30 cm en tussen de zitstokken en de wand ten minste 20 cm;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.1.e
    text: een passende voorziening die het doorgroeien van nagels tegengaat;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.1.f
    text: |-
      een voerbak waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 10 cm per legkip bedraagt of,
      indien het een ronde voerbak betreft, ten minste 4 cm per legkip, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.1.g
    text: 'een bereikbare watervoorziening bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.1.g.1
    text: |-
      een continu werkende drinkgoot waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 2,5 cm per
      legkip bedraagt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.1.g.2
    text: |-
      een ronde drinkbak waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 1 cm per legkip
      bedraagt, of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.1.g.3
    text: |-
      één drinknippel of één waterbakje per 10 legkippen. Bij watervoorziening via nippels of drinkwaterbakjes zijn per
      legkip ten minste twee nippels of drinkwaterbakjes bereikbaar.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.2
    text: 'In een huisvestingssysteem waarin de legkippen zich vrij op en tussen de verschillende niveaus kunnen verplaatsen:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.2.a
    text: is het aantal niveaus op enig punt boven de vloer beperkt tot vier;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.2.b
    text: bedraagt de vrije hoogte tussen de niveaus ten minste 45 cm;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.2.c
    text: |-
      zijn de voeder- en watervoorzieningen zo over de ruimte verdeeld dat alle legkippen er gelijke toegang toe hebben,
      en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.2.d
    text: |-
      komen de uitwerpselen van de legkippen die zich op de hogere niveaus bevinden niet op de voor de legkippen
      toegankelijke lagere niveaus terecht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.3
    text: 'In een huisvestingssysteem waarin de legkippen toegang hebben tot een ruimte buiten:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.3.a
    text: geven over de hele lengte van het gebouw verdeelde uitgangen rechtstreeks toegang tot de ruimte buiten;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.3.b
    text: zijn de uitgangen ten minste 35 cm hoog en 40 cm breed;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.3.c
    text: hebben de beschikbare uitgangen een gezamenlijke breedte van ten minste 2 m per 1.000 legkippen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.3.d
    text: |-
      heeft de ruimte buiten om verontreiniging te voorkomen een grondoppervlakte die is afgestemd op de bezettingsgraad
      en het bodemtype, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.3.e
    text: |-
      is de ruimte buiten voorzien van beschutting tegen slecht weer en roofdieren, en indien nodig van passende
      drinkvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.4
    text: |-
      Een overdekte ruimte mag tot de in het eerste lid, onderdeel c, bedoelde oppervlakte worden gerekend indien de
      ruimte in ieder geval vanaf 6 uur na het begin van de lichtperiode in de stal onbeperkt toegankelijk is voor de
      legkippen, gedurende ten minste 10 uren, en de toegangen tot de ruimte ten minste 35 cm hoog en 40 cm breed zijn en
      een gezamenlijke breedte hebben van ten minste 2 m per 1.000 legkippen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.70.5
    text: |-
      De oppervlakken die tot de bruikbare oppervlakte wordt gerekend bieden steun aan alle naar voren gerichte tenen van
      beide poten van de legkip.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.70
  - number: 2.71.1
    text: |-
      Een kooi als bedoeld in [artikel 2.68, tweede lid][ref1], heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.71.1.a
    text: een hoogte van ten minste 60 cm aan de zijde van de kooi waar de voerbak zich bevindt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.1.b
    text: een hoogte van ten minste 50 cm boven de bruikbare oppervlakte;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.1.c
    text: een oppervlakte van ten minste 25.000 cm2, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.1.d
    text: ten minste twee zitstokken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.2
    text: |-
      Legkippen die worden gehuisvest in een kooi als bedoeld in [artikel 2.68, tweede lid][ref1], hebben ten minste de
      beschikking over:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.71.2.a
    text: |-
      800 cm2 bruikbare oppervlakte per legkip met een gewicht van ten hoogste twee kilogram en 900 cm2 bruikbare
      oppervlakte per legkip met een gewicht van meer dan twee kilogram;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.2.b
    text: een nest;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.2.c
    text: een met strooisel bedekte ruimte waar de legkippen kunnen scharrelen en bodempikken;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.2.d
    text: |-
      een zitstok met een lengte van ten minste 15 cm per legkip en een vrije ruimte boven de zitstok van ten minste
      20 cm;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.2.e
    text: |-
      een voerbak met een lengte van de voor de legkippen toegankelijke kant van ten minste 12 cm per legkip met een
      gewicht van ten hoogste twee kilogram en van ten minste 14,5 cm per legkip met een gewicht van meer dan twee
      kilogram;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.2.f
    text: een passende voorziening die het doorgroeien van nagels tegengaat, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.2.g
    text: |-
      een continu werkende drinkgoot waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 10 cm per
      legkip bedraagt dan wel drinknippels of drinkwaterbakjes, waarvan er ten minste twee voor een legkip bereikbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.3
    text: De zitstokken, bedoeld in het eerste lid, onderdeel d, worden op verschillende hoogtes in de kooi geplaatst.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.4
    text: |-
      Het nest, bedoeld in het tweede lid, onderdeel b, is minder verlicht dan andere gedeelten van de kooi en heeft een
      oppervlak van ten minste:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.4.a
    text: 2.700 cm2, wanneer in de kooi 30 of minder legkippen worden gehouden, of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.4.b
    text: 90 cm2 per legkip, wanneer in de kooi meer dan 30 legkippen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.5
    text: 'De met strooisel bedekte ruimte, bedoeld in het tweede lid, onderdeel c, heeft een oppervlak van ten minste:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.5.a
    text: 2.700 cm2, wanneer in de kooi 30 of minder legkippen worden gehouden, of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.5.b
    text: 90 cm2 per legkip, wanneer in de kooi meer dan 30 legkippen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.6
    text: |-
      Indien een kooi als bedoeld in [artikel 2.68, tweede lid][ref1], wordt gebruikt voor het houden en huisvesten van
      ten minste vijf en ten hoogste acht legkippen voor het testen van legkippen ten behoeve van de fokkerij zijn tot
      1 januari 2035 niet van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.71.6.a
    text: |-
      het eerste lid, onderdelen a en b, met dien verstande dat de hoogte van de kooi aan de zijde waar de voerbak zich
      bevindt en boven de bruikbare oppervlakte ten minste 45 cm bedraagt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.6.b
    text: het eerste lid, onderdeel c;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.6.c
    text: |-
      het vereiste inzake de oppervlakte van het nest, bedoeld in het vierde lid, met dien verstande dat het nest een
      oppervlakte heeft van ten minste 90 cm2 per legkip; en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.6.d
    text: |-
      het vijfde lid, met dien verstande dat de met strooisel bedekte ruimte, bedoeld in het tweede lid, onderdeel c, een
      oppervlakte heeft van ten minste 90 cm2 per legkip.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.7
    text: 'Er is sprake van het testen van legkippen ten behoeve van de fokkerij, bedoeld in het zesde lid, indien:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.7.a
    text: de legkippen nakomelingen zijn uit kruisingen van raszuivere dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.7.b
    text: |-
      het testen ten minste inhoudt dat frequent metingen en waarnemingen worden verricht ten aanzien van het aantal
      gelegde eieren, de sterfte en het gedrag, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.71.7.c
    text: de bij het testen verkregen gegevens ter beschikking zijn van het fokbedrijf.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.71
  - number: 2.72.1
    text: |-
      Legkippen die worden gehuisvest in een kooi als bedoeld in [artikel 2.68, derde lid][ref1] hebben ten minste de
      beschikking over:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.72
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.72.1.a
    text: |-
      750 cm2 oppervlakte waarvan 600 cm2 bruikbare oppervlakte per legkip, met dien verstande dat de kooi boven andere
      plaatsen dan de bruikbare oppervlakte op elk punt ten minste 20 cm hoog moet zijn en dat de totale oppervlakte van
      een kooi niet kleiner mag zijn dan 2.000 cm2;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.72
  - number: 2.72.1.b
    text: een nest;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.72
  - number: 2.72.1.c
    text: een met strooisel bedekte ruimte die ten minste 20 cm hoog is, waar de legkippen kunnen scharrelen en bodempikken;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.72
  - number: 2.72.1.d
    text: een zitstok met een lengte van 15 cm per legkip en een vrije ruimte boven de zitstok van 20 cm;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.72
  - number: 2.72.1.e
    text: een voerbak waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 12 cm per legkip bedraagt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.72
  - number: 2.72.1.f
    text: een passende voorziening die het doorgroeien van nagels tegengaat, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.72
  - number: 2.72.1.g
    text: |-
      een continu werkende drinkgoot waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 10 cm per
      legkip bedraagt dan wel drinknippels of drinkwaterbakjes, waarvan er ten minste twee voor een legkip bereikbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.72
  - number: 2.72.2
    text: De bodem van de kooi biedt steun aan alle naar voren gerichte tenen van beide poten van de legkip.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.72
  - number: 2.73.1
    text: |-
      Het geluidsniveau wordt zo laag mogelijk gehouden. Aanhoudend of plotseling lawaai wordt vermeden. Constructie,
      opstelling, onderhoud en werking van ventilatietoestellen, voedermachines of andere apparaten veroorzaken zo weinig
      mogelijk lawaai.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.73
  - number: 2.73.2
    text: Het huisvestingssysteem is zodanig opgezet dat een legkip niet kan ontsnappen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.73
  - number: 2.74.1
    text: De legkippen worden ten minste eenmaal per dag door de houder geïnspecteerd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.74
  - number: 2.74.2
    text: |-
      De inrichting van het huisvestingssysteem is zodanig dat alle lagen en kooien rechtstreeks en moeiteloos kunnen
      worden geïnspecteerd en de legkippen gemakkelijk kunnen worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.74
  - number: 2.74.3
    text: Rijen kooien zijn van elkaar gescheiden door gangen van ten minste 90 cm breed.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.74
  - number: 2.74.4
    text: De bodem van de onderste kooi is ten minste 35 cm boven de vloer van het gebouw geplaatst.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.74
  - number: 2.74.5
    text: |-
      De vorm en de grootte van de kooiopening zijn zodanig dat een volwassen legkip uit de kooi kan worden gehaald
      zonder dat dit lijden of verwondingen veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.74
  - number: 2.75.1
    text: |-
      Er is voldoende goed werkende verlichtingsapparatuur aanwezig voor een grondige inspectie van iedere legkip op elk
      willekeurig tijdstip.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.75
  - number: 2.75.2
    text: |-
      Een stal waarin legkippen zijn ondergebracht is gedurende de lichtperiode zodanig verlicht dat de legkippen elkaar
      duidelijk kunnen zien, dat zij hun omgeving visueel kunnen verkennen en dat zij hun gebruikelijke activiteiten
      kunnen ontplooien. In geval van verlichting met daglicht zijn de lichtopeningen zodanig gepositioneerd dat het
      licht gelijkmatig over de stal en de kooien wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.75
  - number: 2.75.3
    text: |-
      Per 24 uur is er een ononderbroken duisternisperiode van 8 uur waarin de legkippen kunnen rusten. Bij de
      vermindering van kunstlicht wordt een periode van halfduister in acht genomen om de legkippen de gelegenheid te
      geven zonder verwondingen op stok te gaan.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.75
  - number: 2.76.1
    text: De uitwerpselen van legkippen worden regelmatig verwijderd. Dode legkippen worden dagelijks verwijderd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76
  - number: 2.76.2
    text: |-
      Lokalen, uitrusting en gereedschappen waarmee de legkippen in aanraking komen, worden regelmatig grondig gereinigd
      en ontsmet, in elk geval telkens wanneer de kooien om sanitaire redenen worden leeggemaakt, en ook voordat een
      nieuwe partij legkippen wordt binnengebracht. Zolang de stal of de kooien bezet zijn, worden alle oppervlakken en
      alle installaties goed schoon gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76
  - number: 2.76a
    text: |-
      In deze paragraaf wordt verstaan onder: - *bezettingsdichtheid:* totale levend gewicht van de dieren die
      tegelijkertijd in de stal aanwezig zijn per vierkante meter oppervlakte die voor hen beschikbaar is;
        - *koppel:* een groep vleeskalkoenen van hetzelfde geslacht, waarbij het leeftijdsverschil tussen het oudste dier
      en het jongste dier ten hoogste zeven dagen is;
        - *ouderdier:* dier dat wordt gehouden voor de productie van broedeieren;
        - *uitvalpercentage:* het aantal dieren van een koppel dat vanwege een natuurlijke oorzaak is gestorven, gedeeld
      door het totaal aantal dieren waaruit het koppel aan het begin van het productieproces bestond, vermenigvuldigd
      met 100;
        - *verordening (EG) nr. 1/2005:* verordening (EG) nr. 1/2005 van de Raad van 22 december 2004 inzake de bescherming
      van dieren tijdens het vervoer en daarmee samenhangende activiteiten en tot wijziging van de Richtlijnen 64/432/EEG
      en 93/119/EG en van Verordening (EG) nr. 1255/97 (PbEU 2005, L 3);
        - *vleeskalkoen:* dier van de soort Meleagris gallopavo dat wordt gehouden voor de productie van vlees.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76a
  - number: 2.76b
    text: |-
      Deze paragraaf is van toepassing op bedrijfsmatig gehouden vleeskalkoenen, ouderdieren van vleeskalkoenen en dieren
      die worden opgefokt om te worden gehouden als ouderdier van vleeskalkoenen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76b
  - number: 2.76c.1
    text: 'De houder van vleeskalkoenen of ouderdieren registreert per koppel de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76c
  - number: 2.76c.1.a
    text: het aantal binnengebrachte vleeskalkoenen of ouderdieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76c
  - number: 2.76c.1.b
    text: het aantal vleeskalkoenen of ouderdieren dat vanwege een natuurlijke oorzaak is gestorven of is gedood, per dag;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76c
  - number: 2.76c.1.c
    text: |-
      het totale levend gewicht van de vleeskalkoenen of ouderdieren bij aflevering aan het slachthuis, binnen twee weken
      na die aflevering.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76c
  - number: 2.76c.2
    text: |-
      De houder van vleeskalkoenen registreert ten hoogste een maand na aflevering van een koppel het uitvalpercentage
      van mannelijke en van vrouwelijke vleeskalkoenen en de oorzaak van de sterfte, indien dat percentage hoger is dan:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76c
  - number: 2.76c.2.a
    text: 5% bij een koppel vrouwelijke dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76c
  - number: 2.76c.2.b
    text: 9% bij een koppel mannelijke dieren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76c
  - number: 2.76c.3
    text: De gegevens, bedoeld in het eerste en tweede lid, worden drie jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76c
  - number: 2.76d.1
    text: 'Vleeskalkoenen worden zodanig gehouden dat de bezettingsdichtheid niet hoger is dan:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76d
  - number: 2.76d.1.a
    text: 58 kg/m2 voor mannelijke dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76d
  - number: 2.76d.1.b
    text: 48 kg/m2 voor vrouwelijke dieren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76d
  - number: 2.76d.2
    text: |-
      Dieren die worden opgefokt om te worden gehouden als ouderdier worden zodanig gehouden dat de bezettingsdichtheid
      niet hoger is dan:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76d
  - number: 2.76d.2.a
    text: 56 kg/m2 voor mannelijke dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76d
  - number: 2.76d.2.b
    text: 49 kg/m2 voor vrouwelijke dieren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76d
  - number: 2.76d.3
    text: 'Ouderdieren worden zodanig gehouden dat de bezettingsdichtheid niet hoger is dan:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76d
  - number: 2.76d.3.a
    text: 46 kg/m2 voor mannelijke dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76d
  - number: 2.76d.3.b
    text: 29 kg/m2 voor vrouwelijke dieren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76d
  - number: 2.76d.4
    text: |-
      Indien in een stal verrijkingselementen zijn aangebracht die door de vleeskalkoenen kunnen worden aangeraakt en
      die geschikt zijn om ten minste 10% van die dieren in de stal tegelijkertijd afleiding te bieden, bedraagt de
      bezettingsdichtheid voor vleeskalkoenen, in afwijking van het eerste lid:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76d
  - number: 2.76d.4.a
    text: 59 kg/m2 voor mannelijke dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76d
  - number: 2.76d.4.b
    text: 49 kg/m2 voor vrouwelijke dieren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76d
  - number: 2.76e.1
    text: |-
      De houder van vleeskalkoenen, ouderdieren van vleeskalkoenen en dieren die worden opgefokt om te worden gehouden
      als ouderdier van vleeskalkoenen voorziet de stalvloer die niet is gelegen onder de voedsel- of watervoorziening
      van strooisel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76e
  - number: 2.76e.2
    text: 'Het strooisel:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76e
  - number: 2.76e.2.a
    text: bestaat uit stro of houtkrullen en is niet verontreinigd;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76e
  - number: 2.76e.2.b
    text: is droog en rul, en heeft een droge stofgehalte van ten minste 80% op het moment dat het in de stal wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76e
  - number: 2.76e.2.c
    text: |-
      is aangebracht in een laag die dik genoeg is om dieren de mogelijkheid te bieden om een stofbad te nemen,
      uitwerpselen te absorberen en de stalvloer te isoleren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76e
  - number: 2.76f.1
    text: |-
      Indien vleeskalkoenen en ouderdieren worden gehouden in een ruimte die mechanisch wordt geventileerd bedraagt de
      luchtverversingscapaciteit ten minste 4 m3 per kg levend gewicht per uur.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76f
  - number: 2.76f.2
    text: |-
      Een koppel vleeskalkoenen of dieren die worden opgefokt om te worden gehouden als ouderdier worden de eerste vijf
      dagen na aankomst op het bedrijf waar ze worden gehouden als vleeskalkoen of worden opgefokt om te worden gehouden
      als ouderdier in een ruimte gehouden waar de temperatuur op dierhoogte 35 tot 39° Celsius bedraagt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76f
  - number: 2.76g.1
    text: |-
      Onverminderd [artikel 2.5, eerste en tweede lid][ref1], worden vleeskalkoenen en ouderdieren gehouden in een ruimte
      waar een aaneengesloten rustperiode wordt gehanteerd van ten minste acht uur per etmaal, waarin die ruimte niet of
      nauwelijks kunstmatig wordt verlicht.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76g
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.76g.2
    text: |-
      De lichtintensiteit in een ruimte bestemd voor vleeskalkoenen of ouderdieren bedraagt op dierhoogte ten minste 20
      Lux, tenzij een lagere lichtsterkte tijdelijk noodzakelijk is om letsel als gevolg van pikkerij te voorkomen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76g
  - number: 2.76h
    text: |-
      Tijdens vervoer dat op Nederlands grondgebied begint en eindigt, worden vleeskalkoenen die zwaarder zijn dan 7 kg
      vervoerd in containers als bedoeld in artikel 2, onderdeel g, van verordening (EG) nr. 1/2005.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76h
  - number: 2.76i.1
    text: |-
      In afwijking van [artikel 2.4, tweede lid][ref1], worden vleeskalkoenen en ouderdieren ten minste tweemaal per
      dag gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76i
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.76i.2
    text: |-
      In afwijking van [artikel 2.5, achtste lid][ref1], wordt de apparatuur die noodzakelijk is voor de gezondheid en
      het welzijn van vleeskalkoenen en ouderdieren ten minste tweemaal per dag gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76i
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.76i.3
    text: De houder van vleeskalkoenen en ouderdieren controleert tweemaal per dag de kwaliteit van het strooisel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76i
  - number: 2.76ia
    text: |-
      In deze paragraaf wordt verstaan onder: - *verordening (EG) nr. 2160/2003:* Verordening (EG) nr. 2160/2003 van het
      Europees Parlement en de Raad van 17 november 2003 inzake de bestrijding van salmonella en andere specifieke door
      voedsel overgedragen zoönoseverwekkers (PbEU 2003, L 325).
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ia
  - number: 2.76ib.1
    text: |-
      Een houder van pluimvee als bedoeld in artikel 4, onderdeel 9, van verordening (EU) nr. 2016/429 laat die dieren
      onderzoeken op de aanwezigheid van aviaire influenza.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ib
  - number: 2.76ib.2
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ib
  - number: 2.76ib.2.a
    text: de momenten en de wijze waarop het onderzoek plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ib
  - number: 2.76ib.2.b
    text: de dieren waarbij het onderzoek plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ib
  - number: 2.76ib.2.c
    text: de administratie van de bemonstering.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ib
  - number: 2.76ib.3
    text: |-
      Een houder verplaatst de dieren, bedoeld in het eerste lid, slechts naar een andere in Nederland gelegen inrichting
      indien die dieren zijn onderzocht overeenkomstig de krachtens het tweede lid gestelde regels en de uitslag van het
      onderzoek bekend is.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ib
  - number: 2.76ib.4
    text: |-
      Het derde lid is niet van toepassing op dieren die binnen acht dagen na het uitkomen worden verplaatst, indien kan
      worden aangetoond dat de dieren afkomstig zijn van ouderdieren die zijn onderzocht overeenkomstig de krachtens het
      tweede lid gestelde regels en de uitslag van het onderzoek bekend is.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ib
  - number: 2.76ic.1
    text: |-
      In aanvulling op artikel 97, eerste lid, aanhef, onderdeel a, aanhef en onder ii, van verordening (EU) nr. 2016/429
      en de krachtens artikel 97, tweede lid, onderdeel b, van die verordening vastgestelde gedelegeerde verordening met
      voorschriften over de ziektebewaking ten aanzien van salmonella-serotypen die relevant zijn voor de diergezondheid
      en mycoplasma spp. stelt Onze Minister nadere regels over:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ic
  - number: 2.76ic.1.a
    text: de degene die monsters neemt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ic
  - number: 2.76ic.1.b
    text: het aanleveren van gegevens;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ic
  - number: 2.76ic.1.c
    text: de administratie van uitslag van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ic
  - number: 2.76ic.2
    text: |-
      De in het eerste lid bedoelde voorschriften van de gedelegeerde verordening en de krachtens het eerste lid gestelde
      regels zijn van overeenkomstige toepassing op houders van per ziekte bij ministeriële regeling aan te wijzen
      soorten of categorieën van pluimvee als bedoeld in artikel 4, onderdeel 9, van verordening (EU) 2016/429 die geen
      dieren verplaatsen naar een andere lidstaat, met dien verstande dat bij ministeriële regeling van de genoemde
      verordening afwijkende regels worden gesteld over de frequentie van de monstername en het onderzoek naar mycoplasma
      spp,
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ic
  - number: 2.76id.1
    text: |-
      Een exploitant als bedoeld in artikel 4, onderdeel 24, van verordening (EU) nr. 2016/429 van een inrichting waar
      bij ministeriële regeling aan te wijzen soorten of categorieën van pluimvee als bedoeld in artikel 4, onderdeel
      9, van die verordening of van in gevangenschap levende vogels als bedoeld in artikel 4, onderdeel 10, van die
      verordening worden gehouden, zorgt ervoor dat die dieren gevaccineerd zijn tegen Newcastle disease.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76id
  - number: 2.76id.2
    text: 'Bij de ministeriële regeling, bedoeld in het eerste lid, kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76id
  - number: 2.76id.2.a
    text: de momenten waarop de vaccinatie plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76id
  - number: 2.76id.2.b
    text: administratie van de vaccinatie;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76id
  - number: 2.76id.2.c
    text: onderzoek naar de aanwezigheid van antilichamen en naar aanleiding daarvan te treffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76id
  - number: 2.76id.3
    text: |-
      Een houder verplaatst de dieren, bedoeld in het eerste lid, slechts indien ten aanzien van die dieren is voldaan
      aan de verplichting tot vaccinatie tegen Newcastle disease.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76id
  - number: 2.76id.4
    text: |-
      Het derde lid is niet van toepassing op dieren die binnen acht dagen na het uitkomen worden verplaatst, indien kan
      worden aangetoond dat de dieren afkomstig zijn van ouderdieren die zijn gevaccineerd overeenkomstig de krachtens
      het eerste en tweede lid gestelde regels.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76id
  - number: 2.76ie.1
    text: |-
      Ter uitvoering van [verordening (EG) nr. 2160/2003](32003R2160) worden bij ministeriële regeling regels gesteld
      over monitoring op zoönotische Salmonella bij dieren van bij die regeling aan te wijzen diercategorieën die vallen
      onder pluimvee als bedoeld in artikel 4, onderdeel 9, van verordening (EU) nr. 2016/429.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ie
  - number: 2.76ie.2
    text: |-
      In aanvulling op de krachtens [verordening (EG) nr. 2160/2003](32003R2160) vastgestelde EU-verordeningen kunnen bij
      ministeriële regeling nadere regels worden gesteld over de monitoring op zoönotische Salmonella bij dieren van bij
      die regeling aan te wijzen andere dan de in het eerste lid genoemde diercategorieën die vallen onder pluimvee als
      bedoeld in artikel 4, onderdeel 9, van verordening (EU) nr. 2016/429.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ie
  - number: 2.76ie.3
    text: 'De regels, bedoeld in het eerste en tweede lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ie
  - number: 2.76ie.3.a
    text: de momenten en de wijze waarop monsters worden genomen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ie
  - number: 2.76ie.3.b
    text: degene die de monsters neemt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ie
  - number: 2.76ie.3.c
    text: het onderzoek van monsters;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ie
  - number: 2.76ie.3.d
    text: administratie en rapportage van de onderzoeksresultaten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ie
  - number: 2.76if.1
    text: |-
      Het is verboden om dieren van bij ministeriële regeling aan te wijzen diercategorieën die vallen onder «pluimvee»
      als bedoeld in artikel 4, onderdeel 9, van verordening (EU) nr. 2016/429 aan te voeren op een bedrijf waar de
      aanwezigheid van Salmonella enteritidis is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76if
  - number: 2.76if.2
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing indien die dieren zijn gevaccineerd tegen Salmonella
      enteritidis.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76if
  - number: 2.76ig.1
    text: |-
      Een houder die meer dan 50 schapen of geiten houdt ten behoeve van de bedrijfsmatige productie van melk laat
      maandelijks, of zo veel vaker als Onze Minister verzoekt, een monster onderzoeken van melk, die wordt bewaard in
      een melkkoeltank en die geen behandeling heeft ondergaan, op de aanwezigheid van Coxiella burnettii.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ig
  - number: 2.76ig.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de monstername en het onderzoek, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ig
  - number: 2.76ih.1
    text: |-
      Het is een houder die meer dan 50 schapen of geiten houdt ten behoeve van de bedrijfsmatige productie van melk
      verboden om mest van schapen of geiten uit te rijden of af te voeren, tenzij de mest:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ih
  - number: 2.76ih.1.a
    text: na verwijdering uit de stal 30 dagen luchtdoorlatend afgedekt is opgeslagen, of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ih
  - number: 2.76ih.1.b
    text: rechtstreeks en afgedekt naar een erkende composteerinrichting of erkend composteerbedrijf wordt vervoerd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ih
  - number: 2.76ih.2
    text: 'Een houder als bedoeld in het eerste lid administreert:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ih
  - number: 2.76ih.2.a
    text: de datum waarop mest uit een stal is verwijderd;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ih
  - number: 2.76ih.2.b
    text: de begin- en einddatum van de composteringsperiode, bedoeld in het eerste lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ih
  - number: 2.76ih.2.c
    text: de datum waarop mest op het bedrijf is uitgereden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ih
  - number: 2.76ih.2.d
    text: de hoeveelheid mest, uitgedrukt in kubieke meters, die is verwijderd, opgeslagen of uitgereden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ih
  - number: 2.76ih.3
    text: Een houder bewaart de gegevens, bedoeld in het tweede lid, twee jaar.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76ih
  - number: 2.76j
    text: |-
      In deze paragraaf wordt verstaan onder: - *fokram:* mannelijk konijn dat ten minste eenmaal gedekt heeft of waarvan
      ten minste eenmaal sperma is afgenomen;
        - *gespeend konijn:* konijn dat is gescheiden van de voedster en dat wordt gehouden om te worden geslacht of om te
      worden geselecteerd als opfokkonijn;
        - *konijn:* dier van de soort Oryctolagus cuniculus;
        - *koppel:* een groep konijnen die in dezelfde kalenderweek is gespeend;
        - *opfokkonijn:* konijn dat wordt opgefokt tot voedster of fokram;
        - *spenen:* scheiden van een jong van een voedster;
        - *voedster:* vrouwelijk konijn vanaf drie dagen voor het berekende tijdstip van haar eerste worp;
        - *vrije hoogte:* ruimte die niet wordt belemmerd door obstakels.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76j
  - number: 2.76k
    text: 'Deze paragraaf is van toepassing op bedrijfsmatig gehouden:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76k
  - number: 2.76k.a
    text: gespeende konijnen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76k
  - number: 2.76k.b
    text: opfokkonijnen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76k
  - number: 2.76k.c
    text: |-
      voedsters en fokrammen die worden gehouden voor de productie van konijnen die worden gehouden om te worden geslacht
      of om te worden gebruikt als opfokkonijn.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76k
  - number: 2.76l.1
    text: De houder van konijnen registreert zich bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76l
  - number: 2.76l.2
    text: |-
      De in het eerste lid bedoelde registratie vindt plaats met als doel het bevorderen van een effectief systeem van
      toezicht en handhaving van de op de houder van toepassing zijnde regelgeving met betrekking tot dierenwelzijn.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76l
  - number: 2.76l.3
    text: 'Bij de registratie, bedoeld in het eerste lid, verstrekt de houder de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76l
  - number: 2.76l.3.a
    text: naam, adres en woonplaats van de houder;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76l
  - number: 2.76l.3.b
    text: voor zover de houder een natuurlijk persoon is, de geboortedatum en het geslacht van de houder;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76l
  - number: 2.76l.3.c
    text: |-
      voor zover de houder een rechtspersoon betreft, de datum van oprichting en het inschrijfnummer van de houder bij de
      kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76l
  - number: 2.76l.3.d
    text: adres en locatie van het bedrijf waar de dieren worden gehouden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76l
  - number: 2.76l.3.e
    text: de gehouden diersoort.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76l
  - number: 2.76l.4
    text: |-
      Wijziging van de gegevens, bedoeld in het derde lid, wordt binnen twee weken na het ontstaan van de wijziging door
      de houder doorgegeven aan de hand van een door Onze Minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76l
  - number: 2.76m.1
    text: |-
      De houder van gespeende konijnen, voedsters, fokrammen of opfokkonijnen registreert maandelijks de volgende
      gegevens:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76m
  - number: 2.76m.1.a
    text: het aantal levend geboren konijnen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76m
  - number: 2.76m.1.b
    text: het aantal konijnen dat gespeend is;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76m
  - number: 2.76m.1.c
    text: de aantallen gespeende konijnen, voedsters, fokrammen en opfokkonijnen die op het bedrijf zijn aangevoerd;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76m
  - number: 2.76m.1.d
    text: de aantallen gespeende konijnen, voedsters, fokrammen en opfokkonijnen die levend worden afgevoerd;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76m
  - number: 2.76m.1.e
    text: |-
      de uitvalpercentages, bedoeld in [artikel 2.76n, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76m
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '8'
  - number: 2.76m.1.f
    text: |-
      de uitkomst van de consultatie, bedoeld in [artikel 2.76n, tweede lid][ref1], de maatregelen, bedoeld in artikel
      2.76n, derde lid, en de uitkomst van de evaluatie, bedoeld in artikel 2.76n, vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76m
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '8'
  - number: 2.76m.2
    text: De gegevens, bedoeld in het eerste lid, worden drie jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76m
  - number: 2.76n.1
    text: |-
      De houder van konijnen berekent maandelijks het uitvalpercentage voor gespeende konijnen, voedsters en
      opfokkonijnen, op de volgende wijze: - *voor gespeende konijnen:* het aantal dieren van een koppel dat niet-levend
      van het bedrijf is afgevoerd, gedeeld door de som van het aantal dieren waaruit het koppel na het spenen bestond en
      het aantal dieren dat aan de groep is toegevoegd, vermenigvuldigd met 100;
        - *voor voedsters en opfokkonijnen:* het aantal voedsters of opfokkonijnen dat niet-levend van het bedrijf is
      afgevoerd, gedeeld door het aantal voedsters of opfokkonijnen dat die maand gemiddeld op het bedrijf aanwezig was,
      vermenigvuldigd met 100.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76n
  - number: 2.76n.2
    text: |-
      Indien het uitvalpercentage van gespeende konijnen, voedsters of opfokkonijnen hoger is dan 10%, consulteert de
      houder een dierenarts met als doel dat percentage te verlagen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76n
  - number: 2.76n.3
    text: |-
      Naar aanleiding van de consultatie, bedoeld in het tweede lid, neemt de houder maatregelen om het uitvalpercentage
      te verlagen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76n
  - number: 2.76n.4
    text: |-
      Indien het uitvalpercentage van gespeende konijnen, voedsters of opfokkonijnen gedurende een jaar hoger is dan 10%,
      evalueert de houder in samenwerking met een dierenarts de werking van de maatregelen, bedoeld in het derde lid en
      past de houder die maatregelen aan, indien nodig.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76n
  - number: 2.76o.1
    text: 'Een voedster beschikt over een kooi met ten minste:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.1.a
    text: 'een vloeroppervlakte van 4.500 cm2 per voedster, waaronder:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.1.a.1°
    text: een van nestmateriaal voorziene nestruimte van ten minste 700 cm2 die verbonden is met de kooi, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.1.a.2°
    text: een horizontaal plateau met een oppervlakte van ten minste 900 cm2 en een breedte van ten minste 20 cm;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.1.b
    text: een vrije hoogte van 60 cm boven een vloeroppervlakte van 950 cm2;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.1.c
    text: een doorgang van de bodem naar het plateau met een breedte van 25 cm.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.2
    text: 'Een konijn dat wordt opgefokt tot voedster of fokram beschikt over een kooi met ten minste:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.2.a
    text: een vloeroppervlakte van 2.000 cm2 per dier;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.2.b
    text: een hoogte van 40 cm boven 80% van de vloeroppervlakte.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.3
    text: 'Een fokram beschikt over een kooi met ten minste:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.3.a
    text: een vloeroppervlakte van 4.000 cm2 per dier;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.3.b
    text: een hoogte van 60 cm.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.4
    text: |-
      Een gespeend konijn wordt gehouden in een groep die bestaat uit ten minste twee konijnen en beschikt over een kooi
      met ten minste:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.4.a
    text: |-
      een vloeroppervlakte, waarbij de oppervlakte van een in de kooi aangebracht plateau van ten minste 10 cm breed kan
      worden meegerekend, van:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.4.a.1°
    text: 700 cm2 per dier, indien de groep bestaat uit minder dan vijf dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.4.a.2°
    text: 600 cm2 per dier, indien de groep bestaat uit vijf of meer dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.4.b
    text: |-
      een hoogte van 40 cm boven 80% van de vloeroppervlakte indien in de kooi geen plateau is aangebracht, of een vrije
      hoogte van 40 cm boven 20% van de vloeroppervlakte indien in de kooi een plateau is aangebracht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.5
    text: |-
      Indien in een kooi een plateau is aangebracht, bedraagt de afstand tussen de vloeroppervlakte en het plateau en
      tussen het plateau en de bovenkant van de kooi ten minste 25 cm.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.6
    text: 'Indien de vloeroppervlakte uit gaas bestaat:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.6.a
    text: heeft de bovenliggende draad een diameter van ten minste 2,4 mm;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.6.b
    text: bedraagt de afstand tussen het middelpunt van de bovenliggende draden ten minste 10 mm en ten hoogste 16 mm;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.6.c
    text: |-
      plaatst de houder in een kooi als bedoeld in het eerste en derde lid een mat van ten minste 900 cm2 van plastic of
      van materiaal met vergelijkbare eigenschappen als plastic.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76o.7
    text: Konijnen beschikken permanent over ruwvoer of knaagmateriaal dat voorziet in hun knaagbehoefte.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76o
  - number: 2.76p
    text: Het is verboden om een vrouwelijk konijn te laten dekken of insemineren voordat het 15 weken oud is.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76p
  - number: 2.76q.1
    text: |-
      Onverminderd [artikel 2.5, eerste en tweede lid][ref1], worden konijnen gehouden in een ruimte waar een dag-
      en nachtritme wordt gehanteerd waarbij het ten minste acht uur licht is en ten minste acht uur donker, in beide
      gevallen ten minste vier uur aaneengesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76q
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.76q.2
    text: 'In een ruimte bestemd voor voedsters en fokrammen:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76q
  - number: 2.76q.2.a
    text: |-
      wordt na een periode van licht alsmede na een periode van donkerte als bedoeld in het eerste lid een schemerperiode
      gehanteerd van ten minste een uur;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76q
  - number: 2.76q.2.b
    text: bedraagt de lichtintensiteit op dierhoogte ten minste 20 Lux gedurende ten minste acht uur per dag.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76q
  - number: 2.76r.1
    text: |-
      In afwijking van [artikel 2.4, tweede lid][ref1], worden konijnen ten minste tweemaal per dag gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76r
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.76r.2
    text: |-
      In afwijking van [artikel 2.5, achtste lid][ref1], wordt de apparatuur die noodzakelijk is voor de voer- en
      watervoorzieningen van konijnen ten minste tweemaal per dag gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76r
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.76s
    text: |-
      In deze paragraaf wordt verstaan onder: - *compartiment:* ruimte waarin de dieren vrij kunnen bewegen en waarin
      geen scheidingswanden zijn aangebracht;
        - *fokdier:* dier dat gepaard heeft of een jaar of ouder is;
        - *nerts:* dier van de soort Mustela vison;
        - *nestbox:* slaapplaats voor nertsen;
        - *opgroeiende nerts:* gespeende nerts die nog niet gepaard heeft en jonger is dan één jaar;
        - *pup:* nog niet gespeende nerts;
        - *stereotiep gedrag:* langdurig en herhaaldelijk vertoon van dezelfde gedragingen, met uitzondering van gedrag dat
      normaliter wordt vertoond tijdens het uur voorafgaand aan het moment waarop de dieren worden gevoerd;
        - *verrijkingsobject:* object dat door nertsen kan worden aangeraakt en dat bedoeld is om de nertsen afleiding
      te geven.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76s
  - number: 2.76t
    text: Deze paragraaf is van toepassing op bedrijfsmatig gehouden nertsen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76t
  - number: 2.76u.1
    text: 'De houder van nertsen registreert de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76u
  - number: 2.76u.1.a
    text: het aantal fokdieren dat op het bedrijf aanwezig was op 1 mei, 1 juli en 1 augustus;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76u
  - number: 2.76u.1.b
    text: het aantal pups dat op het bedrijf aanwezig was op 1 juli en 1 augustus;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76u
  - number: 2.76u.1.c
    text: het aantal opgroeiende nertsen dat op het bedrijf aanwezig was op 1 augustus;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76u
  - number: 2.76u.1.d
    text: |-
      het aantal nertsen dat in januari of februari op het bedrijf aanwezig was en stereotiep gedrag vertoont of een kale
      staartpunt van ten minste 1 cm heeft;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76u
  - number: 2.76u.1.e
    text: de handelingen die zijn verricht om stereotiep gedrag of kale staartpunten te voorkomen of te verminderen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76u
  - number: 2.76u.2
    text: De gegevens, bedoeld in het eerste lid, worden drie jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76u
  - number: 2.76v.1
    text: Nertsen worden gehouden in een leefruimte die voldoet aan de eisen in dit artikel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76v
  - number: 2.76v.2
    text: Een leefruimte bestaat uit één of meer compartimenten, waaraan in ieder geval een nestbox is gekoppeld.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76v
  - number: 2.76v.3
    text: |-
      De leefruimte bestaat ten minste uit één compartiment met een afmeting van ten minste 85 cm lengte, 30 cm breedte
      en 45 cm hoogte, waarbij de hoogte wordt berekend als afstand tussen de onder- en bovenkant van het compartiment en
      waarbij eventueel aangebrachte plateaus niet worden meegerekend.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76v
  - number: 2.76v.4
    text: Elk fokdier beschikt over een nestbox.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76v
  - number: 2.76v.5
    text: De nestbox heeft een afmeting van ten minste 20 cm lengte, 20 cm breedte en 15 cm hoogte.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76v
  - number: 2.76v.6
    text: |-
      De nestbox is permanent voorzien van voldoende strooisel, dat droog is en bestaat uit stro, houtkrullen, zaagsel of
      ander materiaal met vergelijkbare eigenschappen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76v
  - number: 2.76v.7
    text: |-
      Indien de leefruimte bestaat uit meerdere compartimenten zijn de compartimenten horizontaal, verticaal of
      horizontaal en verticaal gecombineerd met elkaar geschakeld.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76v
  - number: 2.76v.8
    text: |-
      In het geval, bedoeld in het zevende lid, heeft elk compartiment ten minste een vloeroppervlakte van 1.700 cm2 en
      ten minste een hoogte van 40 cm.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76v
  - number: 2.76v.9
    text: |-
      Indien een leefruimte bestaat uit meerdere compartimenten wordt het vloeroppervlak van de leefruimte bepaald door
      de som van de vloeroppervlakten van de onderscheidenlijke compartimenten, ongeacht of de compartimenten horizontaal
      of verticaal zijn geschakeld.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76v
  - number: 2.76w.1
    text: In een leefruimte worden maximaal twee fokdieren zonder pups of twee opgroeiende nertsen gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76w
  - number: 2.76w.2
    text: 'In afwijking van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76w
  - number: 2.76w.2.a
    text: |-
      is per extra nerts tenminste 850 cm2 extra vloeroppervlak beschikbaar, indien in een leefruimte meer dan twee
      fokdieren of meer dan twee opgroeiende nertsen worden gehouden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76w
  - number: 2.76w.2.b
    text: |-
      is tot 1 augustus van enig jaar ten minste een vloeroppervlakte van 2.550 cm2 beschikbaar, indien in een leefruimte
      één fokdier met maximaal drie pups worden gehouden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76w
  - number: 2.76w.2.c
    text: |-
      is tot 1 juli van enig jaar ten minste een vloeroppervlakte van 2.550 cm2 beschikbaar en tussen 1 juli en
      1 augustus van enig jaar ten minste twee compartimenten, indien in een leefruimte één fokdier met meer dan drie
      pups wordt gehouden, of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76w
  - number: 2.76w.2.d
    text: |-
      is vanaf 1 augustus van enig jaar een vloeroppervlakte van 2.550 cm2 voor twee dieren en 850 cm2 extra voor elke
      nerts beschikbaar, indien in een leefruimte één fokdier met één of meer pups wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76w
  - number: 2.76w.3
    text: |-
      Vanaf 1 augustus van enig jaar is per viertal nertsen of een gedeelte daarvan een vloeroppervlakte van de nestbox
      van 400 cm2 beschikbaar. Voor elk dier extra in de leefruimte is 100 cm2 extra vloeroppervlakte van de nestbox
      beschikbaar.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76w
  - number: 2.76x.1
    text: In iedere leefruimte is tenminste één verrijkingsobject aanwezig.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76x
  - number: 2.76x.2
    text: |-
      Van 1 augustus tot 1 maart van het daaropvolgende jaar is per drie of minder nertsen ten minste één
      verrijkingsobject aanwezig.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76x
  - number: 2.76x.3
    text: |-
      Indien als verrijkingsobject een plateau is aangebracht in de leefruimte, is de afstand tussen het plateau en de
      bovenzijde van het compartiment ten minste 12,5 cm, de afstand tussen het plateau en de bodem ten minste 25 cm en
      is de oppervlakte ten minste 450 cm2.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76x
  - number: 2.76x.4
    text: |-
      Indien als verrijkingsobject een cilinder is aangebracht in de leefruimte, heeft die een lengte van ten minste 15
      cm en een diameter van ten minste 12 cm.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76x
  - number: 2.76y
    text: De houder van nertsen controleert dagelijks de kwaliteit van het strooisel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76y
  - number: 2.76z
    text: |-
      De houder van nertsen beschikt over een actieplan waarin staat vermeld welke maatregelen worden getroffen om
      stereotiep gedrag en kale staartpunten bij nertsen te voorkomen of te verminderen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.76z
  - number: '2.77'
    text: |-
      Als handelingen als bedoeld in [artikel 2.9, derde lid, van de wet][ref1] worden aangewezen het door de houder van
      een op een landbouwbedrijf gehouden dier:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.77
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.77.a
    text: |-
      verrichten van de ingreep, bedoeld in [artikel 2.5, onderdeel b, van het Besluit diergeneeskundigen][ref1],
      bij geiten die worden gehouden met het oog op de melkproduktie, mits de ingreep geschiedt op aanwijzing van een
      dierenarts nadat deze een plaatselijke verdoving ten behoeve van deze ingreep heeft toegepast en voor zover deze
      handeling wordt verricht bij geiten jonger dan één maand met behulp van een electrische of heteluchtmethode dan wel
      bij geiten ouder dan zes maanden door middel van een draadzaag;


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.77
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.77.b
    text: |-
      verrichten van de ingreep, bedoeld in [artikel 2.6, onderdeel a, van het Besluit diergeneeskundigen][ref1], bij
      schapen, geiten, vissen en paarden;


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.77
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.77.c
    text: |-
      verrichten van de ingreep, bedoeld in [artikel 2.6, onderdeel b, van het Besluit diergeneeskundigen][ref1], bij
      schapen en geiten;


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.77
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.77.d
    text: |-
      verrichten van de ingreep, bedoeld in [artikel 2.6, onderdeel c, van het Besluit diergeneeskundigen][ref1], bij
      schapen en geiten;


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.77
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.77.e
    text: |-
      verrichten van ingrepen als bedoeld in [artikel 2.6, onderdelen j en k, van het Besluit diergeneeskundigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.77
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 2.77.f
    text: openleggen van zoolzweren bij schapen en geiten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel2.77
  - number: 3.1.1
    text: |-
      Het is de eigenaren of gebruikers van erven, landerijen of andere terreinen verboden daarop een hond te houden,
      die:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.1
  - number: 3.1.1.a
    text: |-
      aan een ketting of op andere wijze is vastgelegd, indien niet is voldaan aan [artikel 3.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.1.1.b
    text: |-
      is ingesloten in een ren, indien niet is voldaan aan [artikel 3.3][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.1.1.c
    text: is ingesloten in een ren en daarin aan een ketting of op een andere wijze is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.1
  - number: 3.1.2
    text: Het eerste lid is niet van toepassing indien de hond incidenteel is vastgelegd of in een ren wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.1
  - number: 3.2.1
    text: |-
      Het bevestigingsmiddel, waarmee de hond is vastgelegd, en de halsband, waaraan dat middel is bevestigd, zijn
      zodanig ontworpen dat er geen wurging of verwonding bij de hond optreedt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.2
  - number: 3.2.2
    text: Het bevestigingsmiddel heeft een zodanige lengte dat het dier voldoende bewegingsruimte wordt gelaten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.2
  - number: 3.2.3
    text: |-
      De hond wordt niet door obstakels belemmerd in de bewegingsvrijheid die hem door het bevestigingsmiddel, bedoeld in
      het eerste lid, wordt gelaten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.2
  - number: 3.2.4
    text: 'De hond heeft toegang tot een hok dat:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.2
  - number: 3.2.4.a
    text: voldoende ruimte biedt aan die hond;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.2
  - number: 3.2.4.b
    text: de hond bescherming biedt tegen nadelige weersinvloeden en kou;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.2
  - number: 3.2.4.c
    text: eenvoudig kan worden gereinigd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.2
  - number: 3.3.1
    text: |-
      De ren, bedoeld in [artikel 3.1, eerste lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.3.1.a
    text: is uitsluitend bestemd voor het verblijf van één hond of meerdere honden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.3
  - number: 3.3.1.b
    text: is aan één zijde open;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.3
  - number: 3.3.1.c
    text: heeft voldoende oppervlak en hoogte voor de hond of honden die erin wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.3
  - number: 3.3.2
    text: De bodem van de ren wordt zodanig onderhouden dat deze schoon blijft en niet drassig wordt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.3
  - number: 3.3.3
    text: |-
      [Artikel 3.2, vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.3.4
    text: In de ren bevinden zich geen voorwerpen waaraan de hond zich kan verwonden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.3
  - number: 3.3a
    text: |-
      Artikel 10, tweede lid, verordening (EU) nr. 2016/429 is van overeenkomstige toepassing op degene die zich niet-
      beroepsmatig met dieren bezighoudt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.3a
  - number: 3.4.1
    text: |-
      Het is verboden te fokken met gezelschapsdieren op een wijze waarop het welzijn en de gezondheid van het ouderdier
      of de nakomelingen wordt benadeeld.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.4
  - number: 3.4.2
    text: 'In ieder geval wordt bij het fokken, bedoeld in het eerste lid, voor zover mogelijk voorkomen dat:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.4
  - number: 3.4.2.a
    text: ernstige erfelijke afwijkingen en ziekten worden doorgegeven aan of kunnen ontstaan bij nakomelingen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.4
  - number: 3.4.2.b
    text: |-
      uiterlijke kenmerken worden doorgegeven aan of kunnen ontstaan bij nakomelingen die schadelijke gevolgen hebben
      voor welzijn of gezondheid van de dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.4
  - number: 3.4.2.c
    text: ernstige gedragsafwijkingen worden doorgegeven aan of kunnen ontstaan bij nakomelingen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.4
  - number: 3.4.2.d
    text: voortplanting op onnatuurlijke wijze plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.4
  - number: 3.4.2.e
    text: |-
      het aantal nesten of nakomelingen dat een gezelschapsdier krijgt de gezondheid of het welzijn van dat dier of de
      nakomelingen benadeelt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.4
  - number: 3.4.3
    text: Een hond krijgt binnen een aaneengesloten periode van twaalf maanden ten hoogste één nest.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.4
  - number: 3.4.4
    text: |-
      Een kat krijgt binnen een aaneengesloten periode van twaalf maanden ten hoogste twee nesten of ten hoogste drie
      nesten in een aaneengesloten periode van vierentwintig maanden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.4
  - number: 3.4.5
    text: |-
      Op het fokken van paarden (inclusief pony’s) en ezels die anders dan voor landbouwdoeleinden worden gehouden, zijn
      het eerste en tweede lid, met uitzondering van het tweede lid, onder d, van toepassing.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.4
  - number: '3.5'
    text: |-
      In deze paragraaf wordt verstaan onder: - *beheerder:* degene die dagelijks leiding geeft aan in
      [artikel 3.6, eerste lid][ref1], bedoelde activiteiten;
        - *inrichting:* aan één locatie gebonden ruimte of ruimtes, bestemd voor de in [artikel 3.6][ref2] bedoelde
      activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.6.1
    text: |-
      Het is verboden gezelschapsdieren te verkopen, ten verkoop in voorraad te houden, af te leveren, te houden ten
      behoeve van opvang, of te fokken ten behoeve van de verkoop of aflevering van nakomelingen, tenzij daarbij wordt
      voldaan aan deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.6
  - number: 3.6.2
    text: |-
      Deze paragraaf is niet van toepassing indien degene onder wiens verantwoordelijkheid gezelschapsdieren worden
      verkocht, ten verkoop in voorraad worden gehouden, afgeleverd, gehouden ten behoeve van opvang, of gefokt ten
      behoeve van de verkoop of aflevering van nakomelingen, aannemelijk maakt dat er bij de uitoefening van die
      activiteiten geen sprake is van bedrijfsmatig handelen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.6
  - number: 3.7.1
    text: |-
      De activiteiten, bedoeld in [artikel 3.6, eerste lid][ref1], worden verricht in een inrichting die bij Onze
      Minister overeenkomstig [artikel 3.8][ref2] is aangemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.7.2
    text: |-
      In afwijking van het eerste lid, is het toegestaan gezelschapsdieren te verkopen, ten verkoop in voorraad te houden
      of af te leveren buiten een inrichting indien dit plaatsvindt op een tentoonstelling, beurs of markt, voor zover
      daarbij is voldaan aan de [artikelen 3.8, vijfde lid][ref1], [3.11, vierde lid][ref2], [3.12, tweede lid][ref3],
      [3.14, zesde lid][ref4], en [3.17 tot en met 3.20][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.8.1
    text: |-
      De aanmelding van een inrichting geschiedt door degene onder wiens verantwoordelijkheid de in
      [artikel 3.6, eerste lid][ref1], bedoelde activiteiten worden verricht of door de beheerder, indien dat degene
      is onder wiens verantwoordelijkheid de activiteiten worden verricht. Na de aanmelding wordt aan de inrichting een
      uniek nummer toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.8.2
    text: 'Bij de in het eerste lid bedoelde aanmelding wordt opgave gedaan van de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
  - number: 3.8.2.a
    text: |-
      de naam, adres, woonplaats, het burgerservicenummer of het nummer van de inschrijving in het handelsregister van
      degene onder wiens verantwoordelijkheid de in [artikel 3.6][ref1] bedoelde activiteiten worden verricht, of, indien
      die activiteiten worden verricht onder de verantwoordelijkheid van een rechtspersoon, de naam en het adres van
      vestiging van de rechtspersoon en het nummer van de inschrijving in het handelsregister;


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.8.2.b
    text: |-
      het adres van de inrichting en een beschrijving van de gebouwen en voorzieningen die voor het houden van
      gezelschapsdieren worden gebruikt of zullen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
  - number: 3.8.2.c
    text: de naam, adres, woonplaats en geboortedatum van de beheerder;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
  - number: 3.8.2.d
    text: de onder dit besluit vallende activiteiten die in de inrichting worden verricht;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
  - number: 3.8.2.e
    text: de diergroep of diergroepen waarmee de activiteiten worden verricht;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
  - number: 3.8.2.f
    text: |-
      een kopie van het bewijs van vakbekwaamheid als bedoeld in [artikel 3.11, eerste lid][ref1], van de op de
      inrichting werkzame beheerder;


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.8.2.g
    text: de datum waarop met de uitoefening van de activiteiten een aanvang wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
  - number: 3.8.3
    text: |-
      Voor de aanmelding, bedoeld in het eerste lid, wordt gebruik gemaakt van een middel dat door Onze Minister
      beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
  - number: 3.8.4
    text: |-
      Aanmelding van een inrichting geschiedt voor aanvang van de in [artikel 3.6][ref1] bedoelde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.8.5
    text: |-
      Degene die een tentoonstelling, beurs of markt als bedoeld in [artikel 3.7, tweede lid][ref1], organiseert, doet
      uiterlijk twee weken voor het tijdstip waarop de tentoonstelling, beurs of markt aanvang neemt, een melding van het
      houden van de tentoonstelling, beurs of markt bij Onze Minister en doet daarbij opgave van de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.8.5.a
    text: |-
      de naam, adres, woonplaats en het burgerservicenummer of het nummer van de inschrijving in het handelsregister
      van degene onder wiens verantwoordelijkheid de tentoonstelling, beurs of markt wordt gehouden, of, indien die
      activiteiten worden verricht onder de verantwoordelijkheid van een rechtspersoon, de naam en het adres van
      vestiging van de rechtspersoon en het nummer van de inschrijving in het handelsregister;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
  - number: 3.8.5.b
    text: het adres en plaats waar de tentoonstelling, beurs of markt plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
  - number: 3.8.5.c
    text: de datum of data waarop de tentoonstelling, beurs of markt wordt georganiseerd;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
  - number: 3.8.5.d
    text: de diergroep of diergroepen die aanwezig zullen zijn op de tentoonstelling, beurs of markt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
  - number: 3.8.5.e
    text: |-
      een kopie van het bewijs van vakbekwaamheid van de persoon die aanwezig is op de beurs of tentoonstelling, beurs of
      markt, bedoeld in [artikel 3.11, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.9.1
    text: |-
      Bij wijziging van één of meer van de gegevens, bedoeld in [artikel 3.8, tweede lid][ref1], wordt binnen vier
      weken na het intreden daarvan aan Onze Minister melding gemaakt van de wijziging door degene die ten tijde van
      het intreden van die wijziging op de inrichting verantwoordelijk is voor de in [artikel 3.6][ref2] bedoelde
      activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.9.2
    text: |-
      Op de melding, bedoeld in het eerste lid, is [artikel 3.8, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.10.1
    text: |-
      In een inrichting wordt een deugdelijke administratie bijgehouden van de gezelschapsdieren die in de inrichting
      verblijven met daarin in ieder geval de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.10
  - number: 3.10.1.a
    text: naam, adres en woonplaats van degene van wie de gezelschapsdieren afkomstig zijn;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.10
  - number: 3.10.1.b
    text: bewijs van inenting van honden en katten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.10
  - number: 3.10.2
    text: |-
      De in het eerste lid bedoelde gegevens worden ten minste twee jaar schriftelijk of digitaal in de administratie van
      de inrichting bewaard vanaf het tijdstip dat een dier niet meer in de inrichting aanwezig is.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.10
  - number: 3.10.3
    text: |-
      Van het bewijs van inenting, bedoeld in het eerste lid, onderdeel b, wordt gedurende een periode van twee jaar
      schriftelijk of digitaal een kopie in de administratie van de inrichting bewaard.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.10
  - number: 3.10.4
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing op inrichtingen waar gezelschapsdieren gehouden worden ten
      behoeve van opvang en onbekend is van wie de gezelschapsdieren afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.10
  - number: 3.10.5
    text: |-
      Het eerste lid, aanhef en onderdeel a, is niet van toepassing ten aanzien van inrichtingen waar honden worden
      gehouden ten behoeve van de in [artikel 3.6, eerste lid][ref1], bedoelde activiteiten, indien de honden
      overeenkomstig [hoofdstuk 2 van het Besluit identificatie en registratie van dieren][ref2] geregistreerd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009019#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009019
        hoofdstuk: '2'
  - number: 3.11.1
    text: |-
      In de inrichting is een beheerder werkzaam die in het bezit is van een door Onze Minister erkend bewijs van
      vakbekwaamheid voor de diergroep waarmee activiteiten in de inrichting worden verricht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.11
  - number: 3.11.2
    text: |-
      Een kopie van het in het eerste lid bedoelde bewijs van vakbekwaamheid wordt bij een inspectie ter naleving van dit
      besluit aan de daartoe aangewezen ambtenaar ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.11
  - number: 3.11.3
    text: |-
      Bij langdurige ziekte, ontslag of overlijden van de beheerder kan, voor de duur van een periode van ten hoogste 12
      aaneengesloten maanden, worden afgeweken van het eerste lid met dien verstande dat de persoon die dagelijks leiding
      in de inrichting geeft over de in [artikel 3.6][ref1] bedoelde handelingen over voldoende relevante werkervaring
      beschikt en dit kan aantonen.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.11.4
    text: |-
      Degene die een tentoonstelling, beurs of markt als bedoeld in [artikel 3.7, tweede lid][ref1], organiseert, draagt
      zorg voor de aanwezigheid van een persoon die een erkend bewijs van vakbekwaamheid bezit als bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.11.5
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het in het eerste lid bedoelde bewijs
      van vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.11
  - number: 3.12.1
    text: |-
      Onverminderd de [artikelen 1.5 tot en met 1.8][ref1] wordt een gezelschapsdier gehouden in een daarvoor geschikte
      ruimte. Dit houdt tenminste in dat:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 3.12.1.a
    text: het dier over voldoende bewegingsruimte beschikt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.12
  - number: 3.12.1.b
    text: |-
      de ruimte en de daarin gebruikte materialen zijn aangepast aan de fysiologische en ethologische behoeften van het
      dier;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.12
  - number: 3.12.1.c
    text: het dier zo nodig bescherming wordt geboden tegen slechte weersomstandigheden, roofdieren en gezondheidsrisico’s;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.12
  - number: 3.12.1.d
    text: |-
      bij huisvesting van een hoogdrachtig of zogend dier, het met haar jongen de beschikking heeft over voldoende en
      geschikte nestruimte;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.12
  - number: 3.12.1.e
    text: het dier niet tengevolge van de wijze waarop het gehuisvest is onnodige angst en stress ervaart;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.12
  - number: 3.12.1.f
    text: |-
      het aantal en de samenstelling van dieren en diersoorten per verblijf zodanig is dat dit niet het welzijn of de
      gezondheid van het dier nadelig beïnvloedt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.12
  - number: 3.12.2
    text: |-
      Degene die een tentoonstelling, beurs of markt als bedoeld in [artikel 3.7, tweede lid][ref1], organiseert,
      draagt zorg voor geschikte huisvesting van dieren gedurende de tentoonstelling, beurs of markt, die voldoet aan de
      [artikelen 1.5 tot en met 1.8 en het eerste lid][ref2], met dien verstande dat dieren als bedoeld in onderdeel d
      niet worden toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 3.13.1
    text: |-
      Een inrichting beschikt over ten minste drie afzonderlijke ruimtes voor het huisvesten en verzorgen van zieke of
      van ziekte verdachte gezelschapsdieren in afzondering van andere dieren, dan wel over de mogelijkheid deze ruimtes
      in te richten zodra dit nodig is.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.13
  - number: 3.13.2
    text: 'De in het eerste lid bedoelde ruimtes zijn:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.13
  - number: 3.13.2.a
    text: |-
      een quarantaineruimte voor gezelschapsdieren waarvan bij binnenkomst in de inrichting de gezondheidstatus onbekend
      is of de vaccinatiestatus onbekend of onvolledig is;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.13
  - number: 3.13.2.b
    text: |-
      een isolatieruimte voor gezelschapsdieren verdacht van een besmettelijke ziekte en dieren met klinische
      verschijnselen van een besmettelijke ziekte;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.13
  - number: 3.13.2.c
    text: |-
      een ruimte voor huisvesting van gezelschapsdieren die ziek zijn, maar geen besmettelijke ziekte hebben of niet
      verdacht worden van het dragen van een besmettelijke ziekte.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.13
  - number: 3.13.3
    text: |-
      Gezelschapsdieren geplaatst in de in het tweede lid bedoelde ruimtes, worden solitair gehuisvest, tenzij dat vanuit
      veterinair oogpunt niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.13
  - number: 3.13.4
    text: |-
      De ruimtes, bedoeld in het tweede lid, onderdelen a en b, vormen een volledig afgescheiden onderdeel van een
      inrichting.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.13
  - number: 3.13.5
    text: |-
      De ruimte, bedoeld in het tweede lid, onderdeel c, kan bestaan uit een gedeelte van het binnenverblijf dat kan
      worden afgescheiden van overige binnenverblijven en dieren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.13
  - number: 3.14.1
    text: |-
      In de inrichting wordt gebruik gemaakt van een protocol waaruit blijkt dat de gezondheid van gezelschapsdieren die
      in de inrichting verblijven dagelijks gecontroleerd wordt, maatregelen ter voorkoming van ziekten worden genomen en
      zieke gezelschapsdieren op passende wijze worden verzorgd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.14
  - number: 3.14.2
    text: |-
      Indien verzorging geen of onvoldoende verbetering in de toestand van een ziek gezelschapsdier bewerkstelligt, wordt
      zo spoedig mogelijk een dierenarts geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.14
  - number: 3.14.3
    text: |-
      Gezelschapsdieren waarvan bij binnenkomst in een inrichting de gezondheid- of vaccinatiestatus onbekend of
      onvolledig is, worden onmiddellijk in quarantaine geplaatst.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.14
  - number: 3.14.4
    text: |-
      Gezelschapsdieren verdacht van een besmettelijke ziekte en dieren met klinische verschijnselen van een
      besmettelijke ziekte worden na binnenkomst in de inrichting onmiddellijk in een isolatieruimte geplaatst.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.14
  - number: 3.14.5
    text: |-
      Een hond of kat mag de quarantaineruimte van de inrichting niet verlaten gedurende ten minste 7 dagen nadat de
      in [artikel 3.15, onderdeel a][ref1], bedoelde inentingen hebben plaatsgevonden, tenzij het de teruggave aan de
      eigenaar betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.14.6
    text: |-
      Degene die een tentoonstelling, beurs of markt, als bedoeld in [artikel 3.7, tweede lid][ref1], organiseert, draagt
      zorg voor een veterinaire gezondheidscontrole van de dieren voordat toegang wordt verstrekt en laat geen dieren toe
      verdacht van een besmettelijke ziekte of dieren met klinische verschijnselen van een besmettelijke ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '3.15'
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.15
  - number: 3.15.a
    text: vaccinaties voor honden en katten die in de inrichting verblijven;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.15
  - number: 3.15.b
    text: het bewijs van vaccinatie van honden en katten;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.15
  - number: 3.15.c
    text: vaccinaties die plaats vinden voordat honden en katten worden verkocht of afgeleverd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.15
  - number: '3.16'
    text: |-
      Een hond wordt, passend bij zijn ethologische en fysiologische behoefte, dagelijks in de gelegenheid gesteld tijd
      door te brengen buiten de ruimte waarin deze gehouden wordt, indien de gezondheidstoestand van de hond zich daar
      niet tegen verzet.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.16
  - number: 3.17.1
    text: |-
      Bij de verkoop of aflevering van een gezelschapsdier, wordt aan een koper of degene aan wie de aflevering
      plaatsvindt schriftelijke informatie over het verkochte of afgeleverde gezelschapsdier verstrekt teneinde hem in
      staat te stellen het gezelschapsdier zo goed mogelijk te verzorgen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.17
  - number: 3.17.2
    text: |-
      Het eerste lid is niet van toepassing indien de koper of degene aan wie de aflevering plaatsvindt een
      overeenkomstig deze paragraaf geregistreerde inrichting, een circus of een dierentuin is.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.17
  - number: 3.17.3
    text: |-
      De in het eerste lid bedoelde informatie heeft in ieder geval betrekking op de verzorging, de huisvesting en het
      gedrag van het gezelschapsdier en de kosten die gemoeid gaan met het houden van het gezelschapsdier.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.17
  - number: '3.18'
    text: |-
      Bij de verkoop of aflevering van een gezelschapsdier, wordt aan de koper of degene aan wie de aflevering
      plaatsvindt alle relevante informatie verstrekt met betrekking tot de gezondheidsstatus van het
      verkochte of afgeleverde gezelschapsdier, waaronder ten minste het bewijs van inenting, bedoeld in
      [artikel 3.15, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '3.19'
    text: Een gezelschapsdier wordt niet verkocht aan een persoon jonger dan zestien jaar.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.19
  - number: '3.20'
    text: |-
      Indien een gezelschapsdier bij verkoop of aflevering wordt verpakt, vindt dit op zodanige wijze plaats dat het
      welzijn of de gezondheid van het gezelschapsdier niet onnodig worden benadeeld.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.20
  - number: '3.21'
    text: Gezelschapsdieren worden niet in een etalageruimte van een inrichting gehuisvest of tentoongesteld.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.21
  - number: '3.22'
    text: |-
      Indien een gezelschapsdier in een inrichting verblijft tijdens de periode waarin het dier ontvankelijk is voor
      socialisatie, wordt ervoor zorg gedragen dat het dier:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.22
  - number: 3.22.a
    text: went aan de omgang met de mens en relevante diersoorten en aan houderijomstandigheden en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.22
  - number: 3.22.b
    text: in voldoende mate in de gelegenheid is tot het leren en tonen van soorteigen gedrag.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.22
  - number: '3.23'
    text: |-
      Honden en katten die tijdelijk gehouden worden ten behoeve van opvang omdat daarvan afstand is gedaan, of omdat
      de eigenaar op het moment van opvang onbekend is, kunnen in afwijking van [artikel 3.7, eerste lid][ref1], en
      [artikel 3.14, derde tot en met vijfde lid][ref2], tijdelijk buiten de inrichting gehuisvest worden ten behoeve
      van socialisatie, resocialisatie, behandeling van gedragsproblemen of intensieve zorgverlening in geval van ziekte,
      mits de locatie en verblijfsduur uit de administratie van de inrichting blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.24.1
    text: |-
      Onze Minister wijst een punt van binnenkomst voor reizigers aan als bedoeld in artikel 3, onderdeel k, van
      verordening (EU) nr. 576/2013.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.24
  - number: 3.24.2
    text: |-
      Onze Minister kan een ander punt van binnenkomst voor het verkeer van geregistreerde militaire, speur- of
      reddingshonden aanwijzen als bedoeld in artikel 10, derde lid, van verordening (EU) nr. 576/2013.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.24
  - number: 3.24.3
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het andere personen dan dierenartsen is toegestaan transponders
      als bedoeld in verordening (EU) nr. 576/2013 te implanteren. In dat geval worden bij ministeriële regeling regels
      gesteld over de minimumkwalificaties van die andere personen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.24
  - number: 3.24.4
    text: |-
      Bij ministeriële regeling kunnen in aanvulling op verordening (EU) nr. 576/2013 regels worden gesteld over het
      niet-commerciële verkeer van honden, katten en fretten met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.24
  - number: 3.24.4.a
    text: |-
      de uitgifte, het verstrekken of het voorhanden hebben van blanco identificatiedocumenten als bedoeld in die
      verordening;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.24
  - number: 3.24.4.b
    text: een verplichting tot vermelding van aanvullende gegevens op of in het identificatiedocument;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.24
  - number: 3.24.4.c
    text: |-
      de termijn waarin een gemachtigde dierenarts als bedoeld in artikel 3, onderdeel g, van verordening (EU)
      nr. 576/2013 de gegevens, bedoeld in artikel 22, derde lid, van die verordening, en onderdeel b, bewaart;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.24
  - number: 3.24.4.d
    text: |-
      de voorwaarden waaronder het verkeer van geregistreerde militaire, speur- of reddingshonden als bedoeld in artikel
      10, derde lid, van verordening (EU) nr. 576/2013 plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.24
  - number: '3.25'
    text: |-
      In deze paragraaf wordt verstaan onder: - *identificatiedocument:* identificatiedocument als bedoeld in artikel 3,
      onderdeel f, van verordening (EU) nr. 576/2013.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.25
  - number: 3.26.1
    text: |-
      De [artikelen 3.27, eerste lid][ref1], [3.28, eerste lid][ref2], [3.29, eerste lid][ref3], en
      [3.30, eerste lid][ref4], zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.26.1.a
    text: |-
      een hond die wordt gehouden overeenkomstig [artikel 13 van het Dierproevenbesluit 2014][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0035866#Artikel13
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0035866
        artikel: '13'
  - number: 3.26.1.b
    text: |-
      een hond, geboren in Nederland voor 1 april 2013, tenzij de hond wordt overgedragen of wordt voorzien van een
      identificatiedocument.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.26
  - number: 3.26.2
    text: |-
      [Artikel 3.28, eerste lid][ref1], is niet van toepassing op een houder die voor de datum van inwerkingtreding van
      dat artikel de hond reeds hield, tenzij de hond wordt overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.26.3
    text: |-
      De [artikelen 3.29, eerste lid][ref1], en [3.30, eerste lid][ref2], zijn niet van toepassing op uit het buitenland
      afkomstige houders die korter dan drie maanden met hun hond in Nederland verblijven, tenzij de hond wordt
      overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.27.1
    text: |-
      Artikel 70, aanhef en onderdeel a, van verordening (EU) nr. 2019/2035 is van overeenkomstige toepassing op
      een houder met een hond op wie artikel 70, aanhef en onderdeel a, van verordening (EU) nr. 2019/2035 niet van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.27
  - number: 3.27.2
    text: |-
      De houder, bedoeld in het eerste lid, of de exploitant, bedoeld in artikel 70 van verordening (EU)
      nr. 2019/2035 laat de identificatie uitvoeren door een persoon die is ingeschreven in het register, bedoeld
      in [artikel 2.9, derde lid, van het Besluit diergeneeskundigen][ref1] of in het register, bedoeld in
      [artikel 4.3, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '4'
  - number: 3.27.3
    text: |-
      In afwijking van het tweede lid laat een houder of exploitant de identificatie uitvoeren door een dierenarts indien
      de houder of de exploitant een hond overgedragen heeft gekregen zonder injecteerbare transponder.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.27
  - number: 3.28.1
    text: |-
      Artikel 71 van [verordening (EU) nr. 2019/2035](32035R2019) is van overeenkomstige toepassing op een houder met een
      hond op wie artikel 71 van verordening (EU) nr. 2019/2035 niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.28
  - number: 3.28.2
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.28
  - number: 3.28.2.a
    text: de afgifte van identificatiedocumenten;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.28
  - number: 3.28.2.b
    text: de termijn waarbinnen over een identificatiedocument moet worden beschikt; en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.28
  - number: 3.28.2.c
    text: de overdracht van identificatiedocumenten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.28
  - number: 3.29.1
    text: 'Een houder registreert zich bij Onze Minister binnen een bij ministeriële regeling bepaalde termijn, indien:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.29
  - number: 3.29.1.a
    text: de hond van de houder een nakomeling heeft voortgebracht;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.29
  - number: 3.29.1.b
    text: de houder een hond voor het eerst in Nederland brengt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.29
  - number: 3.29.1.c
    text: |-
      de houder een hond heeft verkregen die niet is voorzien van een injecteerbare transponder
      of die niet is geregistreerd overeenkomstig [artikel 3.30, eerste lid][ref1] of
      [artikel 2.9, eerste lid, van het Besluit diergeneeskundigen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 3.29.2
    text: De registratie wordt slechts gedaan indien de houder nog niet bij Onze Minister geregistreerd is.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.29
  - number: 3.30.1
    text: |-
      Een houder draagt er zorg voor dat de registratie van zijn hond, bedoeld in
      [artikel 2.9, eerste lid, van het Besluit diergeneeskundigen][ref1] plaatsvindt en vult deze registratie aan.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 3.30.2
    text: |-
      In afwijking van het eerste lid draagt de houder er zorg voor dat de dierenarts de volledige registratie van de
      hond doet, indien:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.30
  - number: 3.30.2.a
    text: |-
      de hond is verkregen zonder injecteerbare transponder, identificatiedocument of registratie als bedoeld in het
      eerste lid; of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.30
  - number: 3.30.2.b
    text: de hond voor het eerst in Nederland is gebracht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.30
  - number: 3.30.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de registraties, bedoeld in het eerste en tweede lid en over
      het wijzigen van de registratie bij overdracht, vermissing of overlijden van een hond.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.30
  - number: '3.31'
    text: 'Een persoon verkrijgt geen hond van een houder indien de hond:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.31
  - number: 3.31.a
    text: |-
      niet is voorzien van een injecteerbare transponder overeenkomstig [artikel 3.27][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.31.b
    text: |-
      niet is voorzien van een identificatiedocument overeenkomstig [artikel 3.28][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.31.c
    text: |-
      niet is geregistreerd overeenkomstig de [artikelen 2.9, eerste lid, van het Besluit diergeneeskundigen][ref1] en
      [artikel 3.30, eerste lid][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.31.d
    text: |-
      niet is geregistreerd overeenkomstig [artikel 3.30, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.32.1
    text: 'Onze Minister wijst de beheerder van een elektronisch portaal aan voor de registratie van honden en houders indien:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.32
  - number: 3.32.1.a
    text: |-
      de beheerder van het portaal een onderneming heeft als bedoeld in [artikel 5 van de Handelsregisterwet 2007][ref1]
      of een rechtspersoon is in de zin van artikel 54 van het Verdrag betreffende de werking van de Europese Unie, die
      in een lidstaat van de Europese Unie of van de Europese Economische Ruimte is gevestigd;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.32
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '5'
  - number: 3.32.1.b
    text: het portaal schriftelijk en digitaal voldoende bereikbaar is voor houders;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.32
  - number: 3.32.1.c
    text: |-
      de beheerder van het portaal aantoont dat hij gegevens elektronisch, tijdig en correct kan registeren bij Onze
      Minister; en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.32
  - number: 3.32.1.d
    text: de beheerder handelt overeenkomstig de wetgeving over de verwerking van persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.32
  - number: 3.32.2
    text: 'De beheerder van het portaal:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.32
  - number: 3.32.2.a
    text: |-
      registreert de gegevens, bedoeld in [artikel 3.30][ref1] en
      [artikel 2.9, eerste lid, van het Besluit diergeneeskundigen][ref2] direct bij Onze Minister; en


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.32
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 3.32.2.b
    text: wijzigt op verzoek van Onze Minister de wijze waarop gegevens bij Onze Minister worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.32
  - number: 3.32.3
    text: |-
      Onze Minister kan de aanwijzing schorsen dan wel intrekken indien de beheerder niet voldoet aan één of meer
      voorschriften als bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.32
  - number: 3.32.4
    text: |-
      Met toepassing van [artikel 28, eerste lid, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanwijzing, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.32
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 3.32.5
    text: |-
      Aanwijzingen van databanken, verleend op grond van
      [artikel 10 van het Besluit identificatie en registratie van dieren][ref1], gelden na de inwerkingtreding van dit
      artikel als aanwijzingen als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel10
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel3.32
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '10'
  - number: '4.1'
    text: |-
      In deze paragraaf wordt verstaan onder: - *dierentuin:* permanente inrichting waar levende wilde dieren worden
      gehouden om gedurende ten minste zeven dagen per jaar te worden tentoongesteld aan het publiek, met uitzondering
      van circussen en dierenwinkels;
        - *dierenverblijf:* ruimte waar dieren worden gehouden;
        - *diergroep:* dieren levend in een groep, die gelet op hun omvang en kenmerken afzonderlijk niet te
      individualiseren zijn;
        - *wilde dieren:* dieren behorende tot diersoorten of diercategorieën waarvan de daartoe behorende dieren van
      nature in het wild leven met uitzondering van de diersoorten of diercategorieën, genoemd in [bijlage II][ref1] bij
      dit besluit, en honden en katten.


      [ref1]: https://wetten.overheid.nl/BWBR0035217
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0035217
  - number: 4.2.1
    text: Het is verboden een dierentuin te exploiteren zonder een daartoe door Onze Minister verstrekte vergunning.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
  - number: 4.2.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
  - number: 4.2.2.a
    text: |-
      inrichtingen waar wilde dieren worden gehouden van ten hoogste tien diersoorten, niet zijnde diersoorten genoemd
      in [bijlage IIa][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0035217
  - number: 4.2.2.b
    text: 'inrichtingen die voldoen aan elk van de volgende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
  - number: 4.2.2.b.1
    text: |-
      naast wilde dieren van ten hoogste tien diersoorten worden in hoofdzaak dieren behorend tot de diersoorten of
      diercategorieën, genoemd in [bijlage II][ref1] bij dit besluit, gehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0035217
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0035217
  - number: 4.2.2.b.2
    text: de dieren worden niet tijdelijk of langdurig ten behoeve van verzorging of verpleging opgevangen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
  - number: 4.2.2.c
    text: 'inrichtingen die voldoen aan elk van de volgende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
  - number: 4.2.2.c.1
    text: er worden wilde dieren van ten hoogste tien diersoorten gehouden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
  - number: 4.2.2.c.2
    text: de dieren worden niet tijdelijk of langdurig ten behoeve van verzorging of verpleging opgevangen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
  - number: 4.2.2.c.3
    text: het tentoonstellen van de dieren aan het publiek is van ondergeschikt belang voor de inrichting; of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
  - number: 4.2.2.d
    text: |-
      inrichtingen waar dieren gedurende ten hoogste twaalf maanden voor verzorging of verpleging worden opgevangen en
      waar de dieren na het verstrijken van die periode weer in vrijheid worden gesteld of elders worden ondergebracht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
  - number: 4.2.3
    text: |-
      De vergunning, bedoeld in het eerste lid, geldt tevens voor beperkte wijzigingen en uitbreidingen van een
      dierentuin, indien:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
  - number: 4.2.3.a
    text: wordt voldaan aan deze paragraaf en de aan de vergunning verbonden beperkingen en voorschriften;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
  - number: 4.2.3.b
    text: |-
      het voornemen tot het uitvoeren van de verandering door de vergunninghouder schriftelijk aan Onze Minister is
      gemeld; en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
  - number: 4.2.3.c
    text: |-
      Onze Minister aan de vergunninghouder schriftelijk heeft verklaard dat de voorgenomen verandering voldoet aan deze
      paragraaf en de aan de vergunning verbonden beperkingen en voorschriften.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.2
  - number: 4.3.1
    text: |-
      Een vergunning als bedoeld in [artikel 4.2, eerste lid][ref1], wordt op aanvraag verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.3.2
    text: 'De vergunningaanvraag bevat in ieder geval de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.3
  - number: 4.3.2.a
    text: het aantal en de soorten te houden wilde dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.3
  - number: 4.3.2.b
    text: het aantal dagen per jaar dat de diersoorten worden tentoongesteld aan het publiek;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.3
  - number: 4.3.2.c
    text: informatie over het aantal personeelsleden en hun kwalificatie;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.3
  - number: 4.3.2.d
    text: 'een plattegrond met een weergave van:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.3
  - number: 4.3.2.d.1
    text: de locatie van de quarantainevoorziening en de behandelruimte;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.3
  - number: 4.3.2.d.2
    text: de afmeting en inrichting van de dierenverblijven en de daarin verblijvende aantallen dieren, per diersoort;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.3
  - number: 4.3.2.e
    text: |-
      een afschrift van het beleidsprotocol, bedoeld in [artikel 4.12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.3.3
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag voor een vergunning,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 4.4.1
    text: |-
      Alvorens op een aanvraag om een vergunning als bedoeld in [artikel 4.2, eerste lid][ref1], wordt beslist, wordt
      een dierentuin door Onze Minister geïnspecteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.4.2
    text: 'Een vergunning wordt verstrekt indien aan de navolgende eisen wordt voldaan:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.4
  - number: 4.4.2.a
    text: 'bij de inrichting van de dierenverblijven rekening is gehouden met:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.4
  - number: 4.4.2.a.1
    text: |-
      het soorteigen bewegingsgedrag, door het verblijf te voorzien van zoveel mogelijk elementen lijkend op de
      natuurlijke leefomgeving;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.4
  - number: 4.4.2.a.2
    text: |-
      het klimaat waarin het dier van nature leeft en het soorteigen bioritme, door het verblijf te voorzien van adequate
      beschutting en bescherming tegen voor de desbetreffende diersoort extreme weersomstandigheden en een adequate
      klimaatbeheersing en verlichting;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.4
  - number: 4.4.2.a.3
    text: |-
      het soorteigen sociale gedrag, door het verblijf te voorzien bij solitaire huisvesting van een voor de diersoort
      geschikte rust- en schuilplaats en bij groepshuisvesting van een rust- en schuilplaats die een dier de mogelijkheid
      biedt zich af te zonderen van de andere dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.4
  - number: 4.4.2.a.4
    text: |-
      het soorteigen paringsgedrag, door de dieren op adequate wijze van elkaar te scheiden of door in het verblijf
      waarin de dieren gedurende de paringstijd worden gehouden voorzieningen aan te brengen waardoor het soorteigen
      paringsgedrag mogelijk wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.4
  - number: 4.4.2.a.5
    text: |-
      het soorteigen uitscheidingsgedrag, door het verblijf indien nodig te voorzien van een voor de diersoort geschikte
      mestplaats;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.4
  - number: 4.4.2.a.6
    text: de ruimte die nodig is om het aantal dieren te houden dat blijkens de aanvraag in het verblijf zal worden gehouden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.4
  - number: 4.4.2.b
    text: |-
      de dierenverblijven zijn voorzien van een adequate afscheiding die het uitbreken van de dieren voorkomt en die een
      veilige barrière tussen de dieren en het publiek vormt;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.4
  - number: 4.4.2.c
    text: |-
      het beleidsprotocol, bedoeld in [artikel 4.12][ref1], voldoet aan de in dat artikel gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.4.2.d
    text: er is voorzien in een adequate quarantainevoorziening en een behandelruimte;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.4
  - number: 4.4.2.e
    text: |-
      er kan worden voldaan aan de [artikelen 1.6][ref1], [1.7][ref2], [1.8][ref3], [4.7][ref4] en [4.8][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0035217#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0035217#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0035217#Artikel4
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0035217
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0035217
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.5'
    text: |-
      Onze Minister registreert de vergunningen, bedoeld in [artikel 4.2, eerste lid][ref1], in een openbaar register.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.6'
    text: |-
      De voorschriften en beperkingen die op grond van [artikel 7.5, eerste lid, van de wet][ref1] aan een vergunning
      kunnen worden verbonden, strekken tot nadere uitwerking van de [artikelen 4.7 tot en met 4.12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel4
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.7.1
    text: 'De vergunninghouder houdt de dieren op zodanige wijze dat:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.7
  - number: 4.7.1.a
    text: het soorteigen gedrag van de dieren wordt gerespecteerd en zoveel mogelijk in stand wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.7
  - number: 4.7.1.b
    text: |-
      de sociale levenswijze van de dieren in het wild zo veel mogelijk tot uitdrukking komt, rekening houdend met de
      mogelijkheden van het individuele dier;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.7
  - number: 4.7.1.c
    text: rekening wordt gehouden met de behoeften van het individuele dier;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.7
  - number: 4.7.1.d
    text: zieke of gewonde dieren indien nodig worden afgezonderd in een passend onderkomen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.7
  - number: 4.7.1.e
    text: |-
      het in een dierenverblijf verblijvende aantal dieren, bedoeld in [artikel 4.3, tweede lid, onderdeel d][ref1],
      niet wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.7.2
    text: |-
      Van de voorschriften, bedoeld in [artikel 1.6, eerste lid][ref1], en in het eerste lid van dit artikel,
      onderdelen a, b en e, kan tijdelijk worden afgeweken indien er opvang wordt geboden aan een dier of diergroep
      waarvoor voldoende deskundigheid aanwezig is, maar waardoor de capaciteit van de dierentuin wordt overschreden en
      mits de opvang niet elders op betere wijze kan plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 4.8.1
    text: 'De vergunninghouder verzorgt de dieren op zodanige wijze dat:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.8
  - number: 4.8.1.a
    text: |-
      het toedienen van het voer is afgestemd op de fysiologische behoeften van de diersoort en de natuurlijke wijze van
      voedselvergaring stimuleert;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.8
  - number: 4.8.1.b
    text: de verzorging is afgestemd op de behoeften van het dier;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.8
  - number: 4.8.1.c
    text: de conditie en de gezondheid van het dier dagelijks worden gecontroleerd;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.8
  - number: 4.8.1.d
    text: in voorkomend geval op passende wijze wordt gezorgd voor gewonde en zieke dieren, indien nodig door een dierenarts.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.8
  - number: 4.8.2
    text: Een dier wordt verzorgd door een voldoende aantal vakbekwame personen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.8
  - number: 4.8.3
    text: De dierenverblijven worden zo vaak als nodig grondig gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.8
  - number: 4.8.4
    text: Zwemwater, stro of ander bodembedekkend materiaal wordt naar behoefte van de diersoort vervangen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.8
  - number: 4.9.1
    text: |-
      De vergunninghouder voert een inzichtelijk register van elk dier of elke diergroep, waaruit de mutaties van de
      dieren en de ziektegeschiedenis blijken, en waarin in ieder geval de volgende gegevens zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.9
  - number: 4.9.1.a
    text: de wetenschappelijke soortnaam en het aantal dieren dat van die soort in de dierentuin wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.9
  - number: 4.9.1.b
    text: het geslacht, indien mogelijk en relevant;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.9
  - number: 4.9.1.c
    text: de datum van verkrijging of de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.9
  - number: 4.9.1.d
    text: |-
      bij overdracht of verkrijging: de bestemming en de herkomst van de dieren en in voorkomend geval de nummers van de
      in- en uitvoerdocumenten en certificaten;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.9
  - number: 4.9.1.e
    text: |-
      de identificatie van het dier of de diergroep door het ringnummer, het tatoeagenummer, het microchipnummer of,
      indien een registratienummer ontbreekt, een omschrijving aan de hand van bijzondere uiterlijke kenmerken;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.9
  - number: 4.9.1.f
    text: |-
      bij vertrek van een dier of diergroep: de datum en de reden van vertrek en de naam en het adres van de
      eindbestemming;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.9
  - number: 4.9.1.g
    text: 'bij bezoek van de dierenarts: de datum van dit bezoek, alsmede de gezondheidstoestand van het dier;'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.9
  - number: 4.9.1.h
    text: 'in geval van sterfte: de datum en de oorzaak van de sterfte.'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.9
  - number: 4.9.2
    text: Het register, bedoeld in het eerste lid, wordt ten minste een maal per maand bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.9
  - number: 4.9.3
    text: |-
      Bij vertrek gaat het dier of de diergroep vergezeld van een afschrift van alle op basis van het eerste lid
      bijgehouden relevante gegevens en documenten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.9
  - number: 4.9.4
    text: |-
      De gegevens, bedoeld in het eerste lid, worden gedurende vijf jaar na de dood of het vertrek van het dier of de
      diergroep bewaard en worden op verzoek aan de bevoegde autoriteiten overgelegd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.9
  - number: 4.10.1
    text: |-
      De vergunninghouder bevordert de instandhouding van de diersoorten, waartoe de door hem gehouden dieren behoren,
      door het uitvoeren van ten minste een van de volgende activiteiten:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.10
  - number: 4.10.1.a
    text: |-
      de deelname aan onderzoek dat gunstige gevolgen heeft voor het behoud van de diersoorten, de opleiding van het
      personeel in voor het onderzoek relevante vaardigheden en de uitwisseling van de verkregen informatie met andere
      dierentuinen;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.10
  - number: 4.10.1.b
    text: |-
      zoveel mogelijk deelnemen aan programma’s met betrekking tot het fokken van dieren in gevangenschap, het herstel
      van de populatie of het herintroduceren van soorten in hun natuurlijke omgeving;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.10
  - number: 4.10.1.c
    text: het opvangen van dieren uit opvangcentra en in beslag genomen dieren.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.10
  - number: 4.10.2
    text: |-
      In de dierentuin wordt, in het kader van een informatief en educatief programma met betrekking tot de
      tentoongestelde diersoorten, onder meer informatie verstrekt over de tentoongestelde soorten en hun natuurlijke
      habitat.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.10
  - number: '4.11'
    text: |-
      De vergunninghouder verzekert zich er bij een overdracht van dieren van dat de ontvangende partij de dieren houdt,
      huisvest en verzorgt op een wijze die overeenkomt met de voorschriften in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.11
  - number: '4.12'
    text: 'De vergunninghouder beschikt over een beleidsprotocol met daarin opgenomen:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.12
  - number: 4.12.a
    text: een noodplan met betrekking tot de ontsnapping van dieren;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.12
  - number: 4.12.b
    text: |-
      het beleid met betrekking tot de voeding en de preventieve en curatieve diergeneeskundige verzorging van de dieren
      dat is opgesteld onder begeleiding van een dierenarts;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.12
  - number: 4.12.c
    text: |-
      het doel van de activiteiten, bedoeld in [artikel 4.10, eerste lid][ref1], en van het programma, bedoeld in
      artikel 4.10, tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.12.d
    text: |-
      een eenduidig beleid met betrekking tot de in [artikel 4.10][ref1] genoemde onderwerpen,


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.13.1
    text: |-
      Indien de vergunninghouder niet voldoet aan de [artikelen 1.6][ref1], [1.7][ref2] of [1.8][ref3] of aan de bij of
      krachtens deze paragraaf gestelde voorschriften kan de dierentuin op last van Onze Minister geheel of gedeeltelijk
      worden gesloten voor het publiek.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 4.13.2
    text: |-
      Onze Minister kan in het geval, bedoeld in het eerste lid, de exploitant verplichten tot het aanpassen, verwijderen
      of aanbrengen van specifieke voorzieningen binnen de daarbij vermelde termijn, die ten hoogste twee jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.13
  - number: 4.13.3
    text: |-
      Indien een exploitant niet binnen de gestelde termijn voldoet aan de verplichtingen, bedoeld in het tweede lid,
      wordt de vergunning door Onze Minister ingetrokken of gewijzigd en wordt de dierentuin geheel of gedeeltelijk
      gesloten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.13
  - number: 4.14.1
    text: |-
      Het is verboden met andere zoogdieren dan die behoren tot de diersoorten, genoemd in [bijlage IV][ref1], deel te
      nemen aan een circus of een ander optreden.


      [ref1]: https://wetten.overheid.nl/BWBR0035217
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0035217
  - number: 4.14.2
    text: 'Het is verboden dieren als bedoeld in het eerste lid te vervoeren ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.14
  - number: 4.14.2.a
    text: |-
      een in Nederland gevestigd circus of een in Nederland gevestigde natuurlijke persoon, rechtspersoon of vennootschap
      die met die dieren deelneemt aan een circus of een ander optreden, of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.14
  - number: 4.14.2.b
    text: |-
      een niet in Nederland gevestigd circus of een niet in Nederland gevestigde natuurlijke persoon, rechtspersoon of
      vennootschap die met die dieren deelneemt aan een circus of een ander optreden in Nederland.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.14
  - number: 4.14.3
    text: |-
      Het verbod, bedoeld in het eerste en tweede lid, is niet van toepassing op optredens in dierentuinen als bedoeld
      in [artikel 4.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.15.1
    text: Het is verboden om evenhoevigen bijeen te brengen op een tentoonstelling, keuring of ander evenement.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.15
  - number: 4.15.2
    text: Het eerste lid is niet van toepassing op een tentoonstelling of keuring met runderen, schapen of geiten.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.15
  - number: 4.15.3
    text: |-
      Een organisator van een tentoonstelling of keuring met runderen, schapen of geiten doet daarvan ten minste 30 dagen
      voorafgaand aan de dag waarop die tentoonstelling of keuring plaatsvindt melding bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.15
  - number: 4.15.4
    text: |-
      Een houder van runderen, schapen of geiten die worden tentoongesteld of gekeurd laat die dieren in de vijf dagen
      voorafgaand aan de tentoonstelling of keuring klinisch onderzoeken door een dierenarts.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.15
  - number: 4.15.5
    text: |-
      In afwijking van het vierde lid kan het klinische onderzoek van geiten of schapen plaatsvinden op de inrichting
      waar de tentoonstelling of keuring wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.15
  - number: 4.15.6
    text: |-
      Een houder en een dierenarts als bedoeld in het vierde lid leggen de resultaten van het onderzoek vast met behulp
      van een door Onze Minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.15
  - number: 4.15.7
    text: |-
      Een organisator als bedoeld in het derde lid laat slechts dieren toe tot de tentoonstelling of keuring, indien uit
      het onderzoek, bedoeld in het vierde of vijfde lid, blijkt dat de dieren niet besmet zijn met een dierziekte of
      zoönose of drager zijn van een ziekteverwekker of ziekteverschijnselen vertonen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.15
  - number: 4.15.8
    text: 'Runderen, schapen of geiten worden na afloop van een tentoonstelling of keuring zo spoedig mogelijk vervoerd naar:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.15
  - number: 4.15.8.a
    text: de inrichting van herkomst; of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.15
  - number: 4.15.8.b
    text: een slachthuis.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.15
  - number: '4.16'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.16
  - number: 4.16.a
    text: |-
      de gegevens die een organisator als bedoeld in [artikel 4.15, derde lid][ref1] overlegt;


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.16.b
    text: |-
      het vervoermiddel waarmee runderen, schapen of geiten worden aangevoerd naar of afgevoerd van een tentoonstelling
      of keuring;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.16
  - number: 4.16.c
    text: |-
      reiniging en ontsmetting met betrekking tot de aanvoer en afvoer van dieren en het betreden van een tentoonstelling
      of keuring;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.16
  - number: 4.16.d
    text: administratie van aangevoerde en afgevoerde dieren en de gebruikte vervoermiddelen.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.16
  - number: 4.17.1
    text: |-
      Het is verboden schapen of geiten die niet zijn gevaccineerd overeenkomstig [artikel 1.46][ref1] te houden op een
      inrichting die is opengesteld voor het publiek met het oogmerk om direct contact tussen bezoekers en dieren te
      faciliteren, tenzij die schapen of geiten:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '9'
  - number: 4.17.1.a
    text: |-
      in hun eerste levensjaar worden geslacht en geen dieren dekken, onderscheidenlijk gedekt of geïnsemineerd worden;
      of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.17
  - number: 4.17.1.b
    text: jonger zijn dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.17
  - number: 4.17.2
    text: |-
      Het is verboden schapen of geiten die niet zijn gevaccineerd overeenkomstig [artikel 1.46][ref1] bijeen te brengen
      op een tentoonstelling, keuring of ander evenement.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '9'
  - number: 4.17.3
    text: |-
      Het tweede lid is niet van toepassing op lammeren, jonger dan drie maanden, die samen met het moederdier bijeen
      worden gebracht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.17
  - number: 4.18.1
    text: |-
      Het is verboden om pluimvee als bedoeld in artikel 4, onderdeel 9, van verordening (EU) nr. 2016/429 of in
      gevangenschap levende vogels als bedoeld in artikel 4, onderdeel 10, van die verordening bijeen te brengen op een
      tentoonstelling, keuring of ander evenement waar enkel uit Nederland afkomstige dieren aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.18
  - number: 4.18.2
    text: 'In afwijking van het eerste lid is het toegestaan om:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.18
  - number: 4.18.2.a
    text: in gevangenschap levende vogels bijeen te brengen voor een keuring of tentoonstelling;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.18
  - number: 4.18.2.b
    text: postduiven bijeen te brengen voor een wedvlucht.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.18
  - number: 4.18.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over keuringen, tentoonstellingen en wedvluchten als bedoeld in het
      tweede lid, met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.18
  - number: 4.18.3.a
    text: vaccinatie tegen besmettelijke dierziekten;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.18
  - number: 4.18.3.b
    text: onderzoek naar de aanwezigheid van besmettelijke dierziekten;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.18
  - number: 4.18.3.c
    text: melding van het bijeenbrengen bij Onze Minister;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.18
  - number: 4.18.3.d
    text: bij te houden en over te leggen gegevens.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel4.18
  - number: '5.1'
    text: |-
      [Paragraaf 3 van hoofdstuk 1][ref1] is niet van toepassing op het doden van dieren en op met het doden verband
      houdende activiteiten, waarop verordening (EG) nr. 1099/2009 van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0035217
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 5.2.1
    text: Bij ministeriële regeling worden regels gesteld voor een goede uitvoering van verordening (EG) nr. 1099/2009.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.2
  - number: 5.2.2
    text: 'De regels, bedoeld in het eerste lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.2
  - number: 5.2.2.a
    text: het aanwijzen van een bevoegde autoriteit;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.2
  - number: 5.2.2.b
    text: het verstrekken, schorsen en intrekken van getuigschriften van vakbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.2
  - number: 5.2.2.c
    text: het goedkeuren van opleidingsprogramma’s en de inhoud en uitvoeringsbepalingen van examens;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.2
  - number: 5.2.2.d
    text: |-
      het uitvoeren van controles en inspecties die relevant zijn voor de bescherming van dieren bij het doden en met het
      doden verband houdende activiteiten;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.2
  - number: 5.2.2.e
    text: gidsen voor goede praktijken;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.2
  - number: 5.2.2.f
    text: het doden, en daarmee verband houdende activiteiten, van dieren buiten een slachthuis.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.2
  - number: 5.3.1
    text: |-
      Het is verboden buiten het slachthuis rundvee, eenhoevigen of loopvogels te slachten of te doden voor particulier
      huishoudelijk verbruik.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.3
  - number: 5.3.2
    text: |-
      Varkens, geiten en schapen worden buiten het slachthuis uitsluitend gedood na voorafgaande bedwelming met een
      penschiettoestel.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.3
  - number: '5.4'
    text: |-
      Bij het doden van dieren zonder voorafgaande bedwelming, bedoeld in [artikel 2.10, vierde lid, van de wet][ref1],
      wordt voldaan aan het bepaalde bij of krachtens de [artikelen 5.5 tot en met 5.9a][ref2] en aan de terzake
      krachtens [artikel 5.2][ref3] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0035217#Artikel5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0035217
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '5.5'
    text: |-
      Het doden van dieren zonder voorafgaande bedwelming, bedoeld in [artikel 5.4][ref1], geschiedt slechts in een
      inrichting die daartoe over een registratie beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.5a
    text: |-
      Een aanvraag tot registratie als bedoeld in [artikel 5.5][ref1] kan slechts worden gedaan door een inrichting die
      op grond van artikel 4 van verordening (EG) nr. 853/2004 van het Europees Parlement en de Raad van 29 april 2004
      houdende vaststelling van specifieke hygiënevoorschriften voor levensmiddelen van dierlijke oorsprong (PbEU 2004,
      L 226) door Onze Minister is erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5a
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.5b.1
    text: 'Onze Minister besluit tot het verlenen van een registratie indien de inrichting voldoet aan:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5b
  - number: 5.5b.1.a
    text: het bepaalde in verordening (EG) nr. 1099/2009, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5b
  - number: 5.5b.1.b
    text: het bepaalde in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5b
  - number: 5.5b.2
    text: 'Het besluit tot het verlenen van een registratie, bedoeld in het eerste lid, wordt genomen op voordracht van:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5b
  - number: 5.5b.2.a
    text: |-
      de Permanente Commissie tot de Algemene Zaken van het Nederlands-Israëlitisch Kerkgenootschap voor zover het
      betreft doden van dieren zonder voorafgaande bedwelming volgens de israëlitische ritus;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5b
  - number: 5.5b.2.b
    text: |-
      de Commissie Islamitisch Slachten van het Contactorgaan Moslims en Overheid voor zover het betreft doden van dieren
      zonder voorafgaande bedwelming volgens de islamitische ritus;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5b
  - number: 5.5b.2.c
    text: |-
      een andere organisatie die de israëlitische of islamitische geloofsgemeenschap vertegenwoordigen, voor zover het
      betreft het doden van dieren zonder voorafgaande bedwelming volgens de israëlitische onderscheidenlijk islamitische
      ritus.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5b
  - number: 5.5c
    text: |-
      Van de verleende registratie, bedoeld in [artikel 5.5b][ref1], wordt voor de betreffende inrichting aantekening
      gemaakt in het register waarin de erkenning van de inrichtingen op grond van artikel 4 van verordening (EG)
      nr. 853/2004 van het Europees Parlement en de Raad van 29 april 2004 houdende vaststelling van specifieke
      hygiënevoorschriften voor levensmiddelen van dierlijke oorsprong (PbEU 2004, L 226) is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5c
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.5d
    text: |-
      Indien een erkenning op grond van artikel 4 van verordening (EG) nr. 853/2004 van het Europees Parlement en de
      Raad van 29 april 2004 houdende vaststelling van specifieke hygiënevoorschriften voor levensmiddelen van dierlijke
      oorsprong (PbEU 2004, L 226) als bedoeld in [artikel 5.5a][ref1] wordt ingetrokken, vervalt de registratie, bedoeld
      in [artikel 6.5][ref2], van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel6
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5d
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '6'
        hoofdstuk: '6'
  - number: 5.5e
    text: |-
      De registratie, bedoeld in [artikel 5.5][ref1], kan worden geschorst dan wel ingetrokken, indien niet langer wordt
      voldaan aan de eisen, bedoeld in [artikel 5.5b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5e
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.5f.1
    text: |-
      Het doden van dieren zonder voorafgaande bedwelming geschiedt te allen tijde in aanwezigheid van een op grond van
      [artikel 8.1 van de wet][ref1] aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5f
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
  - number: 5.5f.2
    text: |-
      Onze Minister kan besluiten tot afwijking van het bepaalde in het eerste lid voor wat betreft de permanente
      aanwezigheid van een ambtenaar bij het doden van dieren zonder voorafgaande bedwelming, indien in het betrokken
      slachthuis voldoende is gewaarborgd dat het bepaalde bij of krachtens deze paragraaf wordt nageleefd. Van voldoende
      waarborgen kan sprake zijn in geval het slachthuis deelneemt aan een kwaliteitssysteem waarmee naleving van het
      bepaalde bij of krachtens deze paragraaf wordt geborgd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5f
  - number: 5.5f.3
    text: |-
      Indien naar het oordeel van Onze Minister naleving van het bepaalde bij of krachtens deze paragraaf niet
      gewaarborgd is, kan Onze Minister het besluit, bedoeld in het tweede lid, intrekken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.5f
  - number: '5.6'
    text: |-
      Het doden van dieren zonder voorafgaande bedwelming, bedoeld in [artikel 2.10, vierde lid, van de wet][ref1],
      geschiedt slechts door personen die door een organisatie als bedoeld in [artikel 5.5b, tweede lid][ref2] zijn
      voorgedragen om het slachtproces overeenkomstig de betrokken religieuze ritus uit te voeren, en die van die
      voordracht een bewijs overleggen aan de ambtenaar, bedoeld in [artikel 5.5f, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0035217#Artikel5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0035217
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.7.1
    text: |-
      Het doden van dieren zonder voorafgaande bedwelming, bedoeld in [artikel 2.10, vierde lid, van de wet][ref1],
      geschiedt overeenkomstig de door de op grond van [artikel 8.1, eerste lid, van de wet][ref2] aangewezen ambtenaren
      in het belang van de bescherming van het te doden dier gegeven aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '8'
  - number: 5.7.2
    text: 'De in het eerste lid, bedoelde aanwijzingen kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.7
  - number: 5.7.2.a
    text: |-
      de gang van zaken rond het slachtproces, daaronder mede verstaan de wijze waarop en de volgorde waarin dieren
      worden aangeboden voor de doding;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.7
  - number: 5.7.2.b
    text: het aantal personen dat betrokken dient te zijn bij het fixeren, doden en verbloeden van het dier;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.7
  - number: 5.7.2.c
    text: |-
      het staken van het dodingsproces indien onvoldoende is gegarandeerd dat daarbij wordt voldaan aan de eisen van de
      verordening (EG) nr. 1099/2009 en van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.7
  - number: 5.7.3
    text: |-
      Onverminderd het tweede lid mag, naast de bij de dodingshandelingen betrokken personen en de personen die tijdens
      de dodingshandelingen de israëlitische of islamitische ritus verrichten, ten hoogste één persoon bij het doden
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.7
  - number: 5.7.4
    text: |-
      Onverminderd het eerste en tweede lid, hebben de aanwijzingen, bedoeld in het eerste lid, geen betrekking op
      de godsdienstige gebruiken volgens de israëlitische en islamitische ritus bij het proces van het doden zonder
      voorafgaande bedwelming.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.7
  - number: '5.8'
    text: |-
      De persoon die belast is met het doden zonder voorafgaande bedwelming van een dier, beoordeelt voor elk dier of dit
      dier qua type, omvang, gewicht en mentale toestand geschikt is om zonder voorafgaande bedwelming te worden gedood
      en gaat niet over tot het doden van dat dier zonder voorafgaande bedwelming in geval dat dier daartoe ongeschikt
      is bevonden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.8
  - number: 5.8a
    text: 'De fixatievoorzieningen en de fixatie-uitrusting voldoen in elk geval aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.8a
  - number: 5.8a.a
    text: verkeren in een goede staat;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.8a
  - number: 5.8a.b
    text: bevatten geen scherpe uitsteeksels;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.8a
  - number: 5.8a.c
    text: bestaan uit soepel bewegende delen, zonder dat schokkende bewegingen agitatie bij het dier kunnen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.8a
  - number: 5.8a.d
    text: veroorzaken geen geluiden die stress veroorzaken bij het dier;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.8a
  - number: 5.8a.e
    text: zijn geschikt voor de omvang van het te slachten dier en het diersoort;
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.8a
  - number: 5.8a.f
    text: |-
      houden het dier voor en tijdens de fixatie in een comfortabele positie, waarbij de fixatie-uitrusting of
      voorzieningen voldoende druk uitoefenen om het dier gefixeerd te houden, zonder daarbij onnodige stress te
      veroorzaken, en
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.8a
  - number: 5.8a.g
    text: |-
      beschikken over een vloer die antislip is, waardoor dieren op geen enkele wijze net voor en tijdens de fixatie
      kunnen uitglijden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.8a
  - number: 5.8b.1
    text: |-
      Het te doden dier gaat het fixatieapparaat niet eerder binnen dan nadat de slachter gereed staat met het mes om het
      dier te doden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.8b
  - number: 5.8b.2
    text: |-
      De fixatie van het te slachten dier wordt niet eerder opgeheven dan nadat overeenkomstig het gestelde in
      [artikel 5.9a, eerste of tweede lid][ref1], zeker is gesteld dat het dier het bewustzijn heeft verloren.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.8b
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.9.1
    text: Het toebrengen van de halssnede geschiedt met een mes dat te allen tijde zeer scherp en gaaf is.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.9
  - number: 5.9.2
    text: Het mes dat voor het toebrengen van de halssnede wordt gebruikt, wordt na iedere snede gereinigd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.9
  - number: 5.9.3
    text: |-
      De lengte van het mes dat voor het toebrengen van de halssnede wordt gebruikt, is minimaal anderhalf tot twee keer
      de breedte van de hals.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.9
  - number: 5.9.4
    text: |-
      De halssnede wordt met een ononderbroken, vloeiende beweging uitgevoerd, met als doel het dier zo snel mogelijk
      te verbloeden.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.9
  - number: 5.9.5
    text: |-
      Ingeval een dier een te dikke vacht heeft waardoor de halssnede minder gemakkelijk kan worden uitgevoerd, wordt
      de hals van het dier ter plaatse van de halssnede geschoren dan wel op een andere wijze geschikt gemaakt voor het
      uitvoeren van de halssnede.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.9
  - number: 5.9.6
    text: |-
      In afwijking van het derde lid, mag de halssnede worden toegebracht met een kleiner mes, mits voorkomen wordt dat
      de punt van het mes in de wondrand prikt.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.9
  - number: 5.9a.1
    text: |-
      Binnen een periode van 40 seconden vanaf het moment van het aanbrengen van de halssnede wordt het dier bedwelmd
      volgens de methoden en de desbetreffende specifieke toepassingsvoorschriften, bedoeld in artikel 4, eerste lid, van
      de verordening (EG) nr. 1099/2009.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.9a
  - number: 5.9a.2
    text: |-
      Een bedwelming als bedoeld in het eerste lid kan achterwege blijven indien binnen de in het eerste lid bedoelde
      periode van 40 seconden door de slachter ten minste één van de volgende bewustzijnsindicatoren als negatief wordt
      beoordeeld:
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.9a
  - number: 5.9a.2.a
    text: de geïnduceerde ooglidreflex, of
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.9a
  - number: 5.9a.2.b
    text: de corneareflex.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.9a
  - number: '5.10'
    text: |-
      Deze paragraaf is van toepassing op het doden van aal met het oog op de productie van dierlijke producten, tenzij
      dit doden plaatsvindt voor particulier huishoudelijk verbruik.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.10
  - number: 5.11.1
    text: Alen worden voorafgaand aan het doden bedwelmd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.11
  - number: 5.11.2
    text: Bij ministeriële regeling worden regels gesteld ten aanzien van de methode waarmee de aal wordt bedwelmd.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel5.11
  - number: '6.1'
    text: |-
      In afwijking van [artikel 2.76f, eerste lid][ref1], bedraagt de in dat lid bedoelde luchtverversingscapaciteit in
      stallen die voor 1 juni 2003 zijn gebouwd en sindsdien niet zijn verbouwd ten minste 3 m3 per kg levend gewicht
      per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 6.2.1
    text: |-
      Tot en met 22 april 2016 is het toegestaan om een voedster als bedoeld in [artikel 2.76j][ref1] buiten de periode
      van drie dagen voor het berekende tijdstip van werpen tot en met 18 dagen na het werpen te huisvesten in een kooi
      als bedoeld in [artikel 2.76o, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '8'
  - number: 6.2.2
    text: |-
      Tot en met 22 april 2016 is het degene die konijnen houdt in een huisvestingssysteem
      dat op 23 april 2006 reeds in gebruik was toegestaan om af te wijken van de
      __REF000___________________________________________________________________________________________________________
      __________________________________, op voorwaarde dat de houder ten minste 50 punten behaalt volgens de tabel in
      [bijlage III][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0035217
  - number: 6.2.3
    text: |-
      Onze Minister kan tot en met 22 april 2016 ontheffing verlenen van de
      voorwaarde, bedoeld in het tweede lid, aan een konijnenhouder als bedoeld in
      [artikel 16, eerste lid, aanhef en onderdeel a, van de Verordening welzijnsnormen konijnen (PPE) 2006][ref1], zoals
      dat luidde onmiddellijk voor inwerkingtreding van dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019560#Artikel16
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0019560
        artikel: '16'
  - number: 6.2.4
    text: Een ontheffing als bedoeld in het derde lid wordt verleend voor een periode van een jaar.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.2
  - number: 6.2.5
    text: |-
      Ontheffingen, verleend op grond van
      [artikel 16, eerste lid, onderdeel a, van de Verordening welzijnsnormen konijnen (PPE) 2006][ref1] worden
      aangemerkt als ontheffingen als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019560#Artikel16
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0019560
        artikel: '16'
  - number: 6.2.6
    text: |-
      Het tweede lid is niet van toepassing op degene aan wie een ontheffing is verleend als bedoeld in het derde of
      vijfde lid, en die is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.2
  - number: 6.3.1
    text: |-
      [Artikel 2.18, vierde lid][ref1], is gedurende 10 jaar na het in dat lid bedoelde tijdstip niet van toepassing
      indien de gebruiker van de stal kan aantonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 6.3.1.a
    text: |-
      de stal vóór het in [artikel 2.18, vierde lid][ref1], bedoelde tijdstip in gebruik is genomen, en


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 6.3.1.b
    text: |-
      de stal of de vloer van de stal na het in [artikel 2.18, vierde lid][ref1], bedoelde tijdstip niet is verbouwd
      of herbouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 6.3.2
    text: |-
      In afwijking van [artikel 2.11][ref1] wordt in dit artikel verstaan onder stal: de kleinste eenheid waarin varkens
      kunnen worden gehuisvest.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 6.4.1
    text: |-
      Aan inrichtingen waarvan de exploitant een melding heeft gedaan op grond van [artikel 5.5][ref1] zoals dat luidde
      onmiddellijk voorafgaand aan inwerkingtreding van dit artikel, wordt geacht een registratie te zijn verleend op
      grond van de artikelen 5.5 en [5.5b][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.4
    references:
      - id: ref1
