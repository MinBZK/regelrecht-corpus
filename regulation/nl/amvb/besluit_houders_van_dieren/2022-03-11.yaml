    text: |-
      indien degene die verantwoordelijk is voor de in [artikel 3.6][ref1] bedoelde activiteiten desgevraagd
      kan aantonen dat de inrichting voor het tijdstip van inwerkingtreding van dat artikel in gebruik
      is genomen en het een inrichting betreft waarvoor geen aanmeldingsplicht bestond op basis van
      [artikel 3, eerste lid, van het Honden- en Kattenbesluit 1999][ref2], zoals dat gold onmiddellijk voor het
      tijdstip van intrekking van dat besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010200#Artikel3
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.6
