      gebruik is genomen en het een inrichting betreft waarvoor geen aanmeldingsplicht bestond op basis van
      [artikel 3, eerste lid, van het Honden- en Kattenbesluit 1999][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0010200#Artikel3
