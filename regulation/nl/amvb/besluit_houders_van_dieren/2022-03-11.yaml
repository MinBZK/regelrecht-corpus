      maanden vanaf het tijdstip van inwerkingtreding van die artikelen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035217#Artikel3
