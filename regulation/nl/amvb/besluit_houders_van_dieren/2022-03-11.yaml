preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Economische Zaken, Landbouw en Innovatie van 19 oktober 2012,
    nr. 291872, Directie Wetgeving en Juridische Zaken;

    Gelet op verordening (EG) nr. 1099/2009 van de Raad van 24 september 2009 inzake de bescherming van dieren bij het
    doden (PbEU 2009, L 303), verordening (EG) nr. 470/2009 van het Europees Parlement en de Raad van 6 mei 2009 tot
    vaststelling van communautaire procedures voor het vaststellen van grenswaarden voor residuen van farmacologisch
    werkzame stoffen in levensmiddelen van dierlijke oorsprong, tot intrekking van Verordening (EEG) nr. 2377/90 van
    de Raad en tot wijziging van Richtlijn 2001/82/EG van het Europees Parlement en de Raad en van Verordening (EG)
    nr. 726/2004 van het Europees Parlement en de Raad (PbEU 2009, L 152), richtlijn 2008/120/EG van de Raad van
    18 december 2008 tot vaststelling van minimumnormen ter bescherming van varkens (Gecodificeerde versie; PbEU 2009,
    L 47), richtlijn 2008/119/EG van de Raad van 18 december 2008 tot vaststelling van minimumnormen ter bescherming
    van kalveren (Gecodificeerde versie; PbEU 2009, L 10); richtlijn 2007/43/EG van de Raad van 28 juni 2007 tot
    vaststelling van minimumvoorschriften voor de bescherming van vleeskuikens (PbEU 2007, L 182), richtlijn 2001/82/EG
    van het Europees Parlement en de Raad van 6 november 2001 tot vaststelling van een communautair wetboek betreffende
    geneesmiddelen voor diergeneeskundig gebruik (PbEG 2001, L 311), richtlijn 1999/74/EG van de Raad van 19 juli 1999
    tot vaststelling van minimumnormen voor de bescherming van legkippen (PbEG 1999, L 203), richtlijn 1999/22/EG van
    de Raad van 29 maart 1999 betreffende het houden van wilde dieren in dierentuinen (PbEG 1999, L 94), richtlijn
    98/58/EG van de Raad van 20 juli 1998 inzake de bescherming van voor landbouwdoeleinden gehouden dieren (PbEG 1998,
    L 221), richtlijn 96/22/EG van de Raad van 29 april 1996 betreffende het verbod op het gebruik, in de veehouderij,
    van bepaalde stoffen met hormonale werking en van bepaalde stoffen met thyreostatische werking, alsmede van ß-
    agonisten en tot intrekking van de richtlijnen 81/602/EEG, 88/146/EEG en 88/299/EEG (PbEG 1996, L 125), richtlijn
    96/23/EG van de Raad van 29 april 1996 inzake controlemaatregelen ten aanzien van bepaalde stoffen en residuen
    daarvan in levende dieren en in produkten daarvan en tot intrekking van de richtlijnen 85/358/EEG en 86/469/EEG en
    de beschikkingen 89/187/EEG en 91/664//EE (PbEG 1996, L 12523), richtlijn 90/167/EEG van de Raad van 26 maart 1990
    tot vaststelling van de voorwaarden voor de bereiding, het in de handel brengen en het gebruik van diervoeders met
    medicinale werking (PbEG 1990, L 092), de Europese Overeenkomst tot bescherming van kleine huisdieren (Trb. 1988,
    1) en de artikelen 2.1, derde en vijfde lid, 2.2, tweede, derde, zevende, negende en tiende lid, 2.3, tweede en
