  - number: 6.4.2
    text: |-
      Aan inrichtingen waarop artikel 6.4, eerste lid, zoals dat luidde onmiddellijk voorafgaand aan inwerkingtreding dit
      artikel, van toepassing is, wordt geacht een registratie te zijn verleend op grond van de [artikelen 5.5][ref1] en
      [5.5b][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel5
    url: https://wetten.overheid.nl/BWBR0035217/2022-03-11#Artikel6.4
