  - number: '9'
    text: |-
      1 Op grond van internationale verplichtingen worden beslissingen die door andere dan Nederlandse rechters zijn
      gewezen als justitiële gegevens aangemerkt.

      2 Het eerste lid is van overeenkomstige toepassing op strafrechtelijke afdoeningen van andere bevoegde autoriteiten
      die ter kennis zijn gekomen van Onze Minister en voorzover het feit waarvoor de straf is opgelegd in Nederland kan
      worden aangemerkt als een strafbaar feit.

      3 [Artikel 7, eerste lid, onder j][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel7
    url: https://wetten.overheid.nl/BWBR0016544/2012-01-01#Artikel9
