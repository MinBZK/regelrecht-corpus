    text: |-
      1 Indien in een bij dit artikel aangewezen wet en de daarop berustende bepalingen met het oog op het nemen van
      besluiten in de zin van [artikel 1:3, eerste lid, van de Algemene wet bestuursrecht][ref1] justitiële gegevens
      noodzakelijk zijn, worden aan de personen of colleges, die op grond van die wetten zijn belast met het nemen van
      die besluiten, desgevraagd justitiële gegevens verstrekt.

      2 Het eerste lid is van overeenkomstige toepassing op het bestuursorgaan dat beslist in administratief beroep.

      3 De wetten, bedoeld in het eerste lid, zijn:

      a. de [Drank- en Horecawet][ref2];

      b. de [Flora-en faunawet][ref3];

      c. de [Wegenverkeerswet 1994][ref4];

      d. de [Wet explosieven voor civiel gebruik][ref5];

      e. de [Wet op de kansspelen][ref6];

      f. de [Kaderwet dienstplicht][ref7].

      4 Indien in een algemene plaatselijke verordening in het kader van de beoordeling van de aanvraag om een vergunning
      voor het bedrijfsmatig geven van gelegenheid tot het verrichten van seksuele handelingen met een derde tegen
      betaling gevolg wordt verbonden aan bepaalde onherroepelijke afdoeningen, is het eerste lid van overeenkomstige
      toepassing.


