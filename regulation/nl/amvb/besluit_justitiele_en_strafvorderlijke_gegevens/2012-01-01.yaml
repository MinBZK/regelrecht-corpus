    text: |-
      1 Ten behoeve van de handhaving van de openbare orde in verband met de terugkeer van de betrokkene in de
      maatschappij kan Onze Minister, aan de burgemeester of de door hem aangewezen ambtenaar justitiële gegevens
      als bedoeld in [artikel 6, eerste lid][ref1], en [artikel 7, eerste lid, onder a, b, c, d, f, j, k en l][ref2],
      verstrekken van natuurlijke personen die onherroepelijk zijn veroordeeld tot:

      a. een onvoorwaardelijke vrijheidsbenemende straf of vrijheidsbenemende maatregel ter zake van een misdrijf bedoeld
      in de volgende artikelen van het [Wetboek van Strafrecht][ref3]:

      1° [240b][ref4], [242 tot en met 247][ref5], [248a tot en met 248e][ref6], [249][ref7], [250][ref8], [250a][ref9]
      (oud), [252, tweede en derde lid][ref10], [273a][ref11] (oud), [273f][ref12], [282][ref13], [282a][ref14],
      [282b][ref15], [287][ref16], [288][ref17], [288a][ref18] en [289][ref19];

      2° [141, tweede lid][ref20], [302][ref21] en [303][ref22], indien het onvoorwaardelijk deel van de opgelegde
      vrijheidsbenemende straf of maatregel een jaar of langer beloopt.

      b. de maatregel bedoeld in [artikel 37a van het Wetboek van Strafrecht][ref23];

      c. de maatregel bedoeld in [artikel 77s van het Wetboek van Strafrecht][ref24], indien deze verlengd kan worden op
      grond van [artikel 77t, derde lid, van deze wet][ref25].

      2 Ten behoeve van het verstrekken van informatie aan de burgemeester ten behoeve van de handhaving van de
      openbare orde in verband met de terugkeer van de betrokkene in de maatschappij kan Onze Minister van de in het
      eerste lid bedoelde natuurlijke personen de justitiële gegevens, bedoeld in [artikel 6, eerste lid][ref26],
      en [artikel 7, eerste lid, onder a, b, c, d, f, j, k en l][ref27], verstrekken aan binnen het Korps landelijke
      politiediensten aangewezen opsporingsambtenaren.

      3 De justitiële gegevens worden niet eerder verstrekt dan drie maanden voor het moment van de verwachte, al dan
      niet tijdelijke, terugkeer van de betrokkene in de maatschappij.

      4 De burgemeester vernietigt de op grond van het eerste lid verstrekte justitiële gegevens uiterlijk negen maanden
      na de datum van de verstrekking, indien niet tot het treffen van maatregelen is besloten. Indien tot het treffen
      van maatregelen is besloten, verwijdert de burgemeester de op grond van het eerste lid verstrekte justitiële
      gegevens uiterlijk negen maanden na de datum van de verstrekking. De verwijderde gegevens worden gedurende
      een termijn van vijf jaar bewaard ten behoeve van het afleggen van verantwoording, waarna de gegevens worden
      vernietigd.

      5 Het eerste lid, onder a en b, is niet van toepassing op personen op wie
      [Titel VIIIA van het Eerste Boek van het Wetboek van Strafrecht][ref28] is toegepast.


