  - number: '10'
    text: |-
      De justitiële gegevens kunnen uitsluitend afkomstig zijn van:

      a. het openbaar ministerie;

      b. de gerechten;

      c. buitenlandse gerechten;

      d. Onze Minister;

      e. het Centraal Justitieel Incassobureau, bedoeld in
      [artikel 1, van het Besluit Instelling Centraal Justitieel Incassobureau][ref1];

      f. opsporingsambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006713#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2012-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006713
        artikel: '1'
  - number: 10a
    text: |-
      1 De Justitiële Informatiedienst, bedoeld in [artikel 30b][ref1], kan de centrale autoriteit van een andere
      lidstaat verzoeken justitiële gegevens te verstrekken.

      2 Het verzoek wordt gedaan met gebruikmaking van het formulier, opgenomen in de bijlage bij het Besluit nr.
      2005/876/JBZ van de Raad van de Europese Unie van 21 november 2005 inzake de uitwisseling van gegevens uit het
      strafregister (PbEU L 322).

      3 Het formulier, bedoeld in het tweede lid, is gesteld in de officiële taal of een van de officiële talen van de
      aangezochte lidstaat dan wel, indien die lidstaat zulks heeft aangegeven in een bij het secretariaat-generaal van
      de Raad van de Europese Unie neergelegde verklaring, in een van de andere officiële talen van de instellingen van
      de Europese Gemeenschappen.

      4 [Artikel 30f][ref2] is van toepassing.

      5 De op grond van een verzoek als bedoeld in het eerste lid verkregen justitiële gegevens worden niet voor een
      ander doel gebruikt dan waarvoor zij zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel30f
