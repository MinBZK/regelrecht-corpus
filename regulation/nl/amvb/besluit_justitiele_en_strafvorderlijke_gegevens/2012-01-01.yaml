  - number: '16'
    text: |-
      Justitiële gegevens worden desgevraagd verstrekt aan:

      a. Onze Minister ten behoeve van de controle van rechtspersonen met het oog op de voorkoming en
      bestrijding van misbruik van rechtspersonen, waaronder het plegen van misdrijven en overtredingen
      van financieel-economische aard door of door middel van deze rechtspersonen, bedoeld in
      [artikel 2, eerste lid, van de Wet controle op rechtspersonen][ref1];

      b. Onze Minister en de burgemeesters voorzover dit noodzakelijk is in het kader van de beoordeling van een verzoek
      tot verkrijging van het Nederlanderschap op grond van de [Rijkswet op het Nederlanderschap][ref2];

      c. Onze Minister voorzover dit noodzakelijk is voor het verwerken van deze gegevens in het Cliënt-Volgsysteem
      Jeugdcriminaliteit;

      d. Onze Minister en aan de korpschef van een regionaal politiekorps voorzover dit noodzakelijk is voor de uitvoering
      van de [Wet wapens en munitie][ref3], de [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref4] en
      van de [Flora- en faunawet][ref5];

      e. Onze Minister van Defensie en het hoofd van de Belastingdienst/Douane centrale dienst voor in- en uitvoer
      voorzover dit noodzakelijk is voor de uitvoering van de [Wet wapens en munitie][ref6].


