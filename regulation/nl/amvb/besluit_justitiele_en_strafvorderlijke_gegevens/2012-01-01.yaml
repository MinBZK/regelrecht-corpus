  - number: '5'
    text: |-
      1 Als justitiële gegevens worden aangemerkt de strafbeschikkingen uitgevaardigd op grond van
      [artikel 257b van het Wetboek van Strafvordering][ref1], met uitzondering van de met betrekking tot overtredingen
      uitgevaardigde strafbeschikkingen waarin een geldboete wordt opgelegd die minder dan € 100 beloopt.

      2 Als justitiële gegevens worden aangemerkt de strafbeschikkingen terzake van misdrijven, uitgevaardigd krachtens
      de [artikelen 76 van de Algemene wet inzake rijksbelastingen][ref2] en [10:15 van de Algemene douanewet][ref3].

      3 [Artikel 7, eerste lid, onderdelen c en h][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257b
