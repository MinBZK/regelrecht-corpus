      1 Justitiële gegevens worden met het oog op het bij wettelijk voorschrift geregelde onderzoek naar de
      betrouwbaarheid en geschiktheid van een persoon die in aanmerking wil komen voor een functie bij een ambtelijke
      dienst voorzover de functie bijzondere eisen stelt aan de integriteit of verantwoordelijkheid van de betrokkene,
      desgevraagd verstrekt aan:

      a. het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst voorzover het betreft personen die in aanmerking
      willen komen voor een dienstbetrekking;

      b. de korpsbeheerder van een regionaal politiekorps voorzover het betreft personen die in aanmerking willen komen
      voor een dienstbetrekking bij dat korps;

      c. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties voorzover het betreft personen die in aanmerking
      willen komen voor een dienstbetrekking bij het Korps landelijke politiediensten;

      d. het bestuur van Politie Nederland voor zover het betreft personen die in aanmerking willen komen voor een
      dienstbetrekking bij Politie Nederland;

      e. de raad van toezicht van het Landelijk selectie- en opleidingsinstituut politie, Politie onderwijs- en
      kenniscentrum, voorzover het betreft personen die in aanmerking willen komen voor een dienstbetrekking als bedoeld
      in [artikel 10, eerste lid, onderdeel a, van de Wet op het LSOP en het politieonderwijs][ref1];

      f. het college van bestuur van het Landelijk selectie- en opleidingsinstituut politie, Politie onderwijs- en
      kenniscentrum, voorzover het betreft personen die in aanmerking willen komen voor een dienstbetrekking als ambtenaar
      als bedoeld in [artikel 10, eerste lid, onderdeel b, van de Wet op het LSOP en het politieonderwijs][ref2];

      g. Onze Minister voorzover het betreft de personen die in aanmerking willen komen voor een dienstbetrekking als
      bijzondere ambtenaar van politie;

      h. Onze Minister van Buitenlandse Zaken voorzover het betreft personen die in aanmerking willen komen voor een
      dienstbetrekking bij de Dienst Buitenlandse Zaken;

      i. de directeur-generaal Belastingdienst, voorzover het betreft de boete- en fraudecoördinator, de contactambtenaar
      Algemene wet inzake rijksbelastingen, de medewerkers fraudeteam en de autorisatiebeheerder en toepassingsbeheerder;

      j. de voorzitter van het managementteam van de Belastingdienst/Fiscale inlichtingen- en opsporingsdienst
      Economische controledienst voorzover het betreft de personen die in aanmerking willen komen voor de functie van
      opsporingsambtenaar;

      k. het hoofd van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit voorzover
      het betreft de personen die in aanmerking willen komen voor de functie van opsporingsambtenaar;

      l. de inspecteur-generaal van de Inspectie Verkeer en Waterstaat voorzover het betreft de personen die in
      aanmerking willen komen voor de functie van opsporingsambtenaar;

      m. de directeur van een inrichting als bedoeld in
      [artikel 1, onder b, van de Penitentiaire beginselenwet][ref3], de directeur van een inrichting als bedoeld
      in [artikel 1, onder b, van de Beginselenwet verpleging ter beschikking gestelden][ref4], de directeur van een
      voorziening als bedoeld in [artikel 4, eerste lid, van de Tijdelijke wet noodcapaciteit drugskoeriers][ref5],
      de directeur van een grenslogies als bedoeld in
      [artikel 2, aanhef, onder 1, van het Reglement regime grenslogies][ref6] alsmede de directeur van een inrichting
      als bedoeld in [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref7] voorzover het betreft
      personen die in aanmerking willen komen voor een dienstbetrekking.

      2 Het eerste lid is van overeenkomstige toepassing, indien op grond van een wettelijk voorschrift gedurende het
      dienstverband bij een ambtelijke dienst een onderzoek naar de betrouwbaarheid en geschiktheid van een persoon wordt
      gedaan.


