      1 Justitiële gegevens worden voorzover dit noodzakelijk is voor de uitoefening van hun taken desgevraagd verstrekt
      aan:

      a. de directeur van de stichting en de reclasseringsinstelling, bedoeld in
      [artikel 1, onder b en c, van de Reclasseringsregeling 1995][ref1];

      b. de reclasseringswerkers, bedoeld in [artikel 6, eerste lid, van de Reclasseringsregeling 199][ref2]5;

      c. de directeur of ressortsdirecteur van de raad voor de kinderbescherming;

      d. de gedragsdeskundigen die zijn belast met de opstelling van rapporten of adviezen als bedoeld in de
      [artikelen 37, tweede en derde lid][ref3] en [37a, derde lid, van het Wetboek van Strafrecht][ref4].

      2 De in het eerste lid bedoelde personen kunnen tevens kennis nemen van de justitiële gegevens betreffende
      misdrijven tegen de zeden, bedoeld in [artikel 4 van de wet][ref5].

      3 Justitiële gegevens worden voor zover dit nodig is voor de uitvoering van het
      [Interimbesluit forensische zorg][ref6] verstrekt aan zorgaanbieders die forensische zorg verlenen.


