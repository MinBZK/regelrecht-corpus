  - number: '34'
    text: |-
      De rapporten die het persoonsdossier vormen zijn afkomstig van:

      a. een reclasseringsinstelling als bedoeld in [artikel 4 van de Reclasseringsregeling 1995][ref1];

      b. de raad voor de kinderbescherming;

      c. een stichting als bedoeld in [artikel 1, onder f, van de Wet op de jeugdzorg][ref2] bij de uitoefening van de
      taken, bedoeld in [artikel 10, eerste lid, onder c en d, van de Wet op de jeugdzorg][ref3];

      d. een penitentiaire inrichting als bedoeld in [artikel 1, onder b, van de Penitentiaire beginselenwet][ref4];

      e. een inrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet verpleging ter beschikking gestelden][ref5];

      f. een inrichting als bedoeld in [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref6];

      g. Onze Minister.


