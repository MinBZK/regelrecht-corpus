  - number: '18'
    text: |-
      Justitiële gegevens worden desgevraagd verstrekt aan de directeuren van de
      inrichtingen, bedoeld in [artikel 1, onder b, van de Penitentiaire beginselenwet][ref1],
      [artikel 1, onder b, van de Beginselenwet verpleging ter beschikking gestelden][ref2] en
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref3], voorzover zij deze behoeven:

      a. voor de selectie en bejegening van personen ten aanzien van wie de tenuitvoerlegging van een vrijheidsstraf of
      vrijheidsbenemende maatregel plaatsvindt;

      b. voor het nemen van beslissingen over het verlaten van de inrichting bij wijze van verlof.


