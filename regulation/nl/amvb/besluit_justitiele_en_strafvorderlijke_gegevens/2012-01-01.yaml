    text: |-
      Justitiële gegevens worden desgevraagd verstrekt aan:

      a. de hulpofficier van justitie ten behoeve van de daadwerkelijke handhaving van de rechtsorde, bedoeld in
      [artikel 2 van de Politiewet][ref1] alsmede de hulpofficier van justitie van de Koninklijke marechaussee ten
      behoeve van de politietaken, bedoeld in [artikel 6, eerste lid, van de Politiewet][ref2];

      b. het hoofd van de divisie Recherche van het Korps landelijke politiediensten ten behoeve van het controleren van
      de juistheid van de gegevens uit de politieregisters, die op grond van een verzoek om rechtshulp door autoriteiten
      van een vreemde staat, als bedoeld in [artikel 552h van het Wetboek van Strafvordering][ref3], al dan niet namens
      de officier van justitie worden verstrekt;

      c. het hoofd van de divisie Recherche van het Korps landelijke politiediensten, of ingeval van rechtstreekse
      verstrekking de korpschef of de commandant van de Koninklijke marechaussee ten behoeve van het controleren van
      de juistheid van de gegevens uit de politieregisters, die zonder een daartoe strekkend verzoek op grond van
      [artikel 5:1 van het Besluit politiegegevens][ref4] aan politie-autoriteiten in een ander land worden verstrekt;

      d. het hoofd van het Meldpunt Ongebruikelijke Transacties, bedoeld in
      [artikel 12 van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref5], voorzover dit
      noodzakelijk is om te kunnen beoordelen of de ongebruikelijke transacties van belang zijn voor de voorkoming en
      opsporing van misdrijven;

      e. de korpschef van het Korps landelijke politiediensten voorzover dat noodzakelijk is voor de uitvoering van
      artikel 8 van de Europol-Overeenkomst;

      f. de commandant van de Koninklijke marechaussee voorzover dit noodzakelijk is voor de uitvoering van de
      [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref6].


