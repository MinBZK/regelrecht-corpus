  - number: '3'
    text: |-
      Met betrekking tot overtredingen worden als justitiële gegevens aangemerkt:

      a. de in de [artikelen 6][ref1] en [7, eerste lid][ref2], vermelde gegevens van zaken waarin het openbaar
      ministerie een beslissing tot afdoening van de zaak heeft genomen met uitzondering van de beslissing tot
      uitvaardiging van een strafbeschikking waarin uitsluitend een geldboete wordt opgelegd die minder dan € 100,–
      beloopt alsmede de beslissing tot niet verdere vervolging van de zaak, tenzij voorwaarden zijn gesteld aan
      laatstgenoemde beslissing;

      b. de in de [artikelen 6][ref3] en [7, eerste lid][ref4], vermelde gegevens van zaken waarin de rechter een al dan
      niet herroepelijke beslissing heeft genomen voorzover een taakstraf of een vrijheidsstraf, anders dan vervangende,
      is opgelegd of een geldboete van minimaal € 100,– alsmede de zaken waarin een bijkomende straf is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel7
