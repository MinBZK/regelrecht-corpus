preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 20 februari 2004, nr. 5271210/04/6;

    Gelet op de artikelen 2, tweede en derde lid, 4, vijfde lid, 8, vierde en vijfde lid, 9, eerste lid, 13, eerste
    lid, 25, 36, 39 en 49 van de Wet justitiële gegevens;

    De Raad van State gehoord (advies van 24 maart 2004, nr. W03.04.0085/I);

    Gezien het nader rapport van Onze Minister van Justitie van 24 maart 2004, nr. 5278333/04/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet justitiële en strafvorderlijke gegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 1.b
    text: 'sepot: de beslissing van het openbaar ministerie tot niet vervolging of niet verdere vervolging van de zaak;'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel1
  - number: 1.c
    text: |-
      centrale autoriteit: de centrale autoriteit, bedoeld in artikel 1, eerste lid, van het Besluit nr. 2005/876/JBZ van
      de Raad van de Europese Unie van 21 november 2005 inzake de uitwisseling van gegevens uit het strafregister (PbEU
      L 322);
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel1
  - number: 1.d
    text: 'lidstaat: lidstaat van de Europese Unie.'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel1
  - number: '2'
    text: |-
      Met betrekking tot misdrijven worden als justitiële gegevens aangemerkt de in de [artikelen 6][ref1] en [7][ref2]
      vermelde gegevens van zaken waarvan het proces-verbaal door het openbaar ministerie of de procureur-generaal bij de
      Hoge Raad op grond van [artikel 76 van de Wet op de rechterlijke organisatie][ref3] in behandeling is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel76
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '6'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0016544
        artikel: '7'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '76'
  - number: '3'
    text: 'Met betrekking tot overtredingen worden als justitiële gegevens aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel3
  - number: 3.a
    text: |-
      de in de [artikelen 6][ref1] en [7, eerste lid][ref2], vermelde gegevens van zaken waarin het openbaar ministerie
      een beslissing tot afdoening van de zaak heeft genomen met uitzondering van de beslissing tot uitvaardiging van
      een strafbeschikking waarin uitsluitend een geldboete wordt opgelegd die minder dan € 100,– beloopt alsmede de
      beslissing tot niet verdere vervolging van de zaak, tenzij voorwaarden zijn gesteld aan laatstgenoemde beslissing;


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel7
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '6'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0016544
        artikel: '7'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 3.b
    text: |-
      de in de [artikelen 6][ref1] en [7, eerste lid][ref2], vermelde gegevens van zaken waarin de rechter een al dan
      niet herroepelijke beslissing heeft genomen voorzover een taakstraf of een vrijheidsstraf, anders dan vervangende,
      is opgelegd of een geldboete van minimaal € 100,– alsmede de zaken waarin een bijkomende straf is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel7
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel3
    references:
      - id: ref1
