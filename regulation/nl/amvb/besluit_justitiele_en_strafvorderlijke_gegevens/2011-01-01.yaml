      van de [Wet wapens en munitie][ref1], de [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref2] en
      van de [Flora- en faunawet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008804
      [ref2]: https://wetten.overheid.nl/BWBR0008973
      [ref3]: https://wetten.overheid.nl/BWBR0009640
