        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001854
      - id: ref3
        bwb_id: BWBR0001903
  - number: 35.b
    text: |-
      Onze Minister ten behoeve van het voorbereiden van enig rapport met het oog op een juiste toepassing van het
      strafrecht.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel35
  - number: '36.1'
    text: |-
      Voor een mededeling als bedoeld in [artikel 18][ref1], [19][ref2], [43][ref3] of [44 van de wet][ref4] is een
      vergoeding van € 4,54 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0014194#Artikel44
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel36
    references:
