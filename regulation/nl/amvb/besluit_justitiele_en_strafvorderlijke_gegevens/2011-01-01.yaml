  - number: '23.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien op grond van een wettelijk voorschrift gedurende het
      dienstverband bij een ambtelijke dienst een onderzoek naar de betrouwbaarheid en geschiktheid van een persoon wordt
      gedaan.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel23
  - number: '24'
    text: 'Justitiële gegevens worden desgevraagd verstrekt aan Onze Minister ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel24
  - number: 24.a
    text: het nemen van de beslissingen over de betrouwbaarheid van buitengewone opsporingsambtenaren;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel24
  - number: 24.b
    text: |-
      het nemen van de beslissingen over de betrouwbaarheid van de opsporingsambtenaren van de bijzondere
      opsporingsdiensten, genoemd in [artikel 2 van de Wet op de bijzondere opsporingsdiensten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel2
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0019919
        artikel: '2'
  - number: 24.c
    text: |-
      het onderzoek naar de betrouwbaarheid en geschiktheid van personen die in aanmerking willen komen voor een functie
      bij de rechtsprekende macht of als rechterlijk ambtenaar bij het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel24
  - number: '25'
    text: |-
      Justitiële gegevens worden ten behoeve van de toelating tot de inrichting van personen, die niet worden ingesloten
      in de inrichting respectievelijk voorziening, voorzover dat noodzakelijk is voor de orde of de veiligheid van de
      inrichting of de voorziening desgevraagd verstrekt aan:
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel25
  - number: 25.a
    text: |-
      de directeur van een inrichting als bedoeld in [artikel 1, onder b, van de Penitentiaire beginselenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '1'
  - number: 25.b
    text: |-
      de directeur van een inrichting voor verpleging van ter beschikking gestelden als bedoeld in
      [artikel 1, onder b, van de Beginselenwet verpleging ter beschikking gestelden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '1'
  - number: 25.c
    text: |-
      de directeur van een voorziening als bedoeld in
      [artikel 4, eerste lid, van de Tijdelijke wet noodcapaciteit drugskoeriers][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013488#Artikel4
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0013488
        artikel: '4'
  - number: 25.d
    text: |-
      de directeur van een grenslogies als bedoeld in
      [artikel 2, aanhef, onder 1, van het Reglement regime grenslogies][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005848#Artikel2
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005848
        artikel: '2'
  - number: 25.e
    text: |-
      de directeur van een inrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '26.1'
    text: 'Justitiële gegevens worden desgevraagd verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel26
  - number: 26.1.a
    text: |-
      de directeur van het Nederlands Centraal Instituut voor Giraal Effectenverkeer BV ten behoeve van het onderzoek
      naar de betrouwbaarheid en de geschiktheid van personen die in aanmerking willen komen voor een dienstbetrekking
      bij deze rechtspersoon of bij het Nederlands Interprofessioneel Effectencentrum NIEC BV of die al een
      dienstbetrekking bij een van deze rechtspersonen vervullen, maar in aanmerking willen komen voor een andere
      dienstbetrekking bij een van deze rechtspersonen alsmede ten behoeve van het onderzoek naar de betrouwbaarheid en
      de geschiktheid van personen die bij de hiervoor genoemde rechtspersonen werkzaamheden gaan verrichten gedurende
      een zo lange periode dat hun positie kan worden gelijkgesteld met die van werknemers in dienstverband;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel26
  - number: 26.1.b
    text: |-
      de President van De Nederlandsche Bank N.V. ten behoeve van het onderzoek naar de betrouwbaarheid en de
      geschiktheid van personen die in aanmerking willen komen voor een dienstbetrekking bij deze rechtspersoon of bij
      de Europese Centrale Bank of die reeds een dienstbetrekking bij deze rechtspersoon of bij de Europese Centrale Bank
      vervullen, maar in aanmerking willen komen voor een andere dienstbetrekking bij die rechtspersoon of de Europese
      Centrale Bank, alsmede ten behoeve van het onderzoek naar de betrouwbaarheid en de geschiktheid van personen die
      bij de hiervoor genoemde rechtspersonen werkzaamheden gaan verrichten gedurende een zodanige lange periode dat hun
      positie kan worden gelijkgesteld met die van werknemers in dienstverband;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel26
  - number: 26.1.c
    text: |-
      de President van De Nederlandsche Bank N.V. ten behoeve van het onderzoek naar de betrouwbaarheid en de
      geschiktheid van personen die naar aanleiding van een overeenkomst met De Nederlandsche Bank N.V. worden belast met
      het vervoer van bankbiljetten, munten of halffabrikaten die worden gebruikt bij de vervaardiging van bankbiljetten
      of munten;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel26
  - number: 26.1.d
    text: |-
      de directeur van Joh. Enschedé Facilities BV ten behoeve van onderzoek naar de betrouwbaarheid en geschiktheid van
      personen die belast zijn met het produceren van bankbiljetten en waardepapieren;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel26
  - number: 26.1.e
    text: |-
      de voorzitter van de Autoriteit Financiële Markten ten behoeve van het onderzoek naar de betrouwbaarheid en de
      geschiktheid van personen die in aanmerking willen komen voor een dienstbetrekking bij dit bestuursorgaan of die
      reeds een dienstbetrekking vervullen bij dit bestuursorgaan, maar die in aanmerking willen komen voor een andere
      dienstbetrekking bij dit bestuursorgaan, alsmede ten behoeve van het onderzoek naar de betrouwbaarheid en de
      geschiktheid van personen die bij dit bestuursorgaan werkzaamheden gaan verrichten gedurende een zo lange periode
      dat hun positie kan worden gelijkgesteld met die van werknemers in dienstverband.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel26
  - number: '26.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met het oog op het nemen van beslissingen over het ontslag van
      personeel.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel26
  - number: '27.1'
    text: |-
      Justitiële gegevens worden ten behoeve van het onderzoek naar de betrouwbaarheid en de geschiktheid van personen
      die in aanmerking willen komen voor een dienstbetrekking bij de genoemde organisaties desgevraagd verstrekt aan:
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel27
  - number: 27.1.a
    text: het hoofd van de Dienst Bedrijfsbeveiliging van de Koninklijke Luchtvaartmaatschappij NV;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel27
  - number: 27.1.b
    text: de directeur van SAGEM Identification bv.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel27
  - number: '27.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met het oog op het nemen van beslissingen ten behoeve van het
      onderzoek naar de betrouwbaarheid en de geschiktheid van personen die bij de rechtspersonen, genoemd in het eerste
      lid, werkzaamheden gaan verrichten gedurende een zodanig lange periode dat hun positie kan worden gelijkgesteld
      met die van werknemers in dienstverband alsmede met het oog op het nemen van beslissingen over het ontslag van
      personeel.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel27
  - number: '28.1'
    text: |-
      Er worden geen verstrekkingen als bedoeld in de [artikelen 23 tot en met 27][ref1] gedaan dan nadat de persoon,
      instantie, dienst of organisatie die om de gegevens verzoekt een ondertekende verklaring van betrokkene heeft
      overgelegd waaruit blijkt dat hij toestemming voor de verstrekking geeft en op de hoogte is van de wijze waarop met
      de justitiële gegevens wordt omgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel23
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '28.2'
    text: |-
      De persoon, instantie, dienst, college of organisatie die overeenkomstig deze paragraaf justitiële gegevens heeft
      ontvangen doet van deze gegevens en de gevolgen die de persoon, instantie, dienst of organisatie voornemens is
      daaraan te verbinden schriftelijk mededeling aan de betrokkene en stelt hem in het geval bedenkingen van hem zijn
      te verwachten, in de gelegenheid zijn zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel28
  - number: '29.1'
    text: 'Justitiële gegevens worden desgevraagd verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel29
  - number: 29.1.a
    text: |-
      de voorzitter van de commissies die zijn belast met de selectie van personen die in aanmerking willen komen voor
      een functie bij de rechtsprekende macht of als rechterlijk ambtenaar bij het Openbaar Ministerie, ten behoeve van
      onderzoek naar de betrouwbaarheid en geschiktheid van die personen;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel29
  - number: 29.1.b
    text: |-
      de personen belast met het opmaken van een aanbeveling voor de vervulling van het ambt van Nationale ombudsman of
      substituut-ombudsman, ten behoeve van het opmaken van zodanige aanbeveling;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel29
  - number: 29.1.c
    text: |-
      de voorzitters van de kamers van toezicht ten behoeve van het onderzoek naar de betrouwbaarheid en de geschiktheid
      van personen die in aanmerking willen komen voor een benoeming tot notaris;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel29
  - number: '29.2'
    text: |-
      [Artikel 28][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel28
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '30.1'
    text: 'Justitiële gegevens worden desgevraagd verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30
  - number: 30.1.a
    text: |-
      de secretaris-generaal van het Ministerie van Justitie ten behoeve van de voordracht die wordt gedaan met het oog
      op de benoeming van een minister of staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30
  - number: 30.1.b
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties ten behoeve van de voordracht voor benoeming van de
      commissaris van de Koningin en de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30
  - number: 30.1.c
    text: 'de commissaris van de Koningin ten behoeve van het dienen van advies:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30
  - number: 30.1.c.1º
    text: inzake de benoeming van burgemeesters;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30
  - number: 30.1.c.2º
    text: |-
      inzake de verlening van een koninklijke onderscheiding aan een burgemeester op grond van het Reglement op de orde
      van de Nederlandse Leeuw en de Orde van Oranje-Nassau;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30
  - number: 30.1.c.3°
    text: |-
      inzake de verlening van het predikaat Koninklijk, de verlening van het recht tot het voeren van het Koninklijk
      Wapen met de toevoeging «Bij Koninklijke Beschikking Hofleverancier» alsmede de verlening van de Koninklijke
      Erepenning;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30
  - number: 30.1.d
    text: 'de burgemeester ten behoeve van het dienen van advies:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30
  - number: 30.1.d.1°
    text: |-
      inzake de verlening van een koninklijke onderscheiding op grond van het
      [Reglement op de Orde van de Nederlandse Leeuw en de Orde van Oranje-Nassau][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007391
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007391
  - number: 30.1.d.2°
    text: |-
      inzake de verlening van het predikaat Koninklijk, de verlening van het recht tot het voeren van het Koninklijk
      Wapen met de toevoeging «Bij Koninklijke Beschikking Hofleverancier» alsmede de verlening van de Koninklijke
      Erepenning;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30
  - number: 30.1.e
    text: |-
      de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba ten behoeve van het dienen van
      advies inzake de benoeming van gezaghebbers;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30
  - number: 30.1.f
    text: Onze Minister van Defensie met het oog op de toekenning van bij koninklijk besluit te verlenen onderscheidingen.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30
  - number: '30.2'
    text: |-
      Met het oog op de adviserende bevoegdheid, bedoeld in het eerste lid, onder c, onder 2° en onder d, kunnen
      justitiële gegevens betreffende misdrijven tegen de zeden, bedoeld in [artikel 4 van de wet][ref1] worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel4
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '4'
  - number: '30.3'
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder b, onder c, onder 1°, en onder e, is [artikel 28][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel28
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 30a
    text: |-
      Ter uitvoering van een op een verdrag gegrond verzoek kunnen justitiële gegevens door tussenkomst van de
      officier van justitie aan de bevoegde buitenlandse autoriteiten worden verstrekt ten behoeve van strafrechtelijke
      doeleinden.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30a
  - number: 30b
    text: Als centrale autoriteit is in Nederland aangewezen de Justitiële Informatiedienst.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30b
  - number: 30c
    text: |-
      De Justitiële Informatiedienst stelt de centrale autoriteit van een andere lidstaat onverwijld in kennis van de
      justitiële gegevens die betrekking hebben op de veroordeling en van de nadien met betrekking tot die veroordeling
      genomen maatregelen ten aanzien van de onderdanen van die lidstaat wegens een strafbaar feit, voor zover vastgelegd
      bij de Justitiële Informatiedienst. Indien de betrokkene de nationaliteit bezit van twee of meer lidstaten, worden
      de mededelingen aan alle betrokken lidstaten gedaan, tenzij de betrokkene mede de Nederlandse nationaliteit bezit.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30c
  - number: 30d.1
    text: |-
      De Justitiële Informatiedienst kan door tussenkomst van de officier van justitie desgevraagd justitiële gegevens
      aan de centrale autoriteit van een andere lidstaat verstrekken ten behoeve van de doeleinden die gelijk kunnen
      worden gesteld aan die genoemd in de [wet][ref1] en in dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 30d.2
    text: Aan de verstrekking kunnen voorschriften worden gesteld in verband met de verwerking en de verdere verwerking.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30d
  - number: 30d.3
    text: |-
      De Justitiële Informatiedienst zendt het antwoord op het verzoek onverwijld maar in ieder geval binnen tien
      werkdagen na de dag waarop het verzoek is ontvangen. Beantwoording van het verzoek geschiedt met gebruikmaking
      van het formulier, opgenomen in de bijlage bij het Besluit nr. 2005/876/JBZ van de Raad van de Europese Unie van
      21 november 2005 inzake de uitwisseling van gegevens uit het strafregister (PbEU L 322).
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30d
  - number: 30d.4
    text: |-
      Indien het antwoord op het verzoek niet in de Nederlandse taal geschiedt, draagt de Justitiële Informatiedienst
      zorg voor de vertaling.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30d
  - number: 30e.1
    text: |-
      De Justitiële Informatiedienst onderzoekt de volledigheid van de bij de verzoeken, bedoeld in
      [artikel 30d, eerste lid][ref1], verstrekte gegevens met het oog op de verstrekking van de justitiële gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel30d
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30e
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: 30d
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
  - number: 30e.2
    text: |-
      Indien de Justitiële Informatiedienst nadere gegevens nodig heeft met het oog op de deugdelijke vaststelling van
      de identiteit van de persoon op wie het verzoek betrekking heeft, pleegt hij onverwijld overleg met de centrale
      autoriteit die het verzoek heeft gedaan teneinde binnen tien werkdagen na de dag waarop de aanvullende informatie
      is verkregen, een antwoord te kunnen verzenden.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30e
  - number: 30f
    text: |-
      De toezending van verzoeken, antwoorden en andere relevante gegevens als bedoeld in de [artikelen 30c][ref1],
      [30d][ref2] en [30e][ref3] kan plaatsvinden via elk communicatiemiddel op elke wijze die de mogelijkheid biedt een
      schriftelijk document over te leggen op grond waarvan de ontvangende lidstaat de echtheid kan vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel30d
      [ref3]: https://wetten.overheid.nl/BWBR0016544#Artikel30e
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: 30c
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0016544
        artikel: 30d
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0016544
        artikel: 30e
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
  - number: '31.1'
    text: |-
      De personen, instanties of colleges, bedoeld in [artikel 8, eerste en tweede lid van de wet][ref1] en in
      [hoofdstuk 3][ref2], aan wie justitiële gegevens worden verstrekt kunnen onder hen ressorterend personeel
      machtigen tot het doen van een verzoek om justitiële gegevens. In dat geval wordt de machtiging in het verzoek om
      inlichtingen vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0016544
        hoofdstuk: '3'
  - number: '31.2'
    text: |-
      In de gevallen waarin op grond van dit besluit de burgemeester bevoegd is om justitiële gegevens te vragen, kan
      hij de korpschef in wiens regio de gemeente is gelegen, machtigen tot het doen van een verzoek om de betreffende
      gegevens.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel31
  - number: '32'
    text: |-
      Onze Minister kan bij zijn onderzoek met betrekking tot de afgifte van de verklaring omtrent het gedrag kennis
      nemen van de justitiële gegevens betreffende misdrijven tegen de zeden, bedoeld in [artikel 4 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel4
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '4'
  - number: '33.1'
    text: |-
      Onze Minister neemt bij zijn onderzoek als bedoeld in [artikel 36 van de wet][ref1]
      in het kader van de beoordeling van de eis van betrouwbaarheid, bedoeld in
      [artikel 18, eerste lid, van het Besluit goederenvervoer over de weg][ref2] en [artikel 22, eerste lid][ref3],
      [23, eerste lid][ref4], en [30, vierde lid][ref5], [76.1 van het Besluit personenvervoer 2000][ref6] uitsluitend
      kennis van de gegevens bedoeld in de [artikelen 10][ref7], [11][ref8] en [12 van de Wet][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0011982#Artikel22
