  - number: '33.2'
    text: |-
      Het eerste lid is niet van toepassing op de beoordeling van de afgifte van de verklaring omtrent het gedrag in het
      kader van de beoordeling van de eis van betrouwbaarheid van de vervoerder of bestuurder van één of meer taxi's.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel33
  - number: '34'
    text: 'De rapporten die het persoonsdossier vormen zijn afkomstig van:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel34
  - number: 34.a
    text: |-
      een reclasseringsinstelling als bedoeld in [artikel 4 van de Reclasseringsregeling 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel4
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '4'
  - number: 34.b
    text: de raad voor de kinderbescherming;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel34
  - number: 34.c
    text: |-
      een stichting als bedoeld in [artikel 1, onder f, van de Wet op de jeugdzorg][ref1] bij de uitoefening van de
      taken, bedoeld in [artikel 10, eerste lid, onder c en d, van de Wet op de jeugdzorg][ref2];


