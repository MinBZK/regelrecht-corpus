    text: de rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel6
  - number: 6.2.c
    text: de statutaire vestigingsplaats;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel6
