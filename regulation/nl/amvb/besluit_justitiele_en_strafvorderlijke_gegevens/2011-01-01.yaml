  - number: '4.3'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op zaken die door de procureur-generaal bij de Hoge Raad in
      behandeling zijn genomen en waarvan de Hoge Raad ingevolge [artikel 76][ref1] in eerste instantie en tevens in
      hoogste ressort kennis neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel76
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '76'
  - number: '5.1'
    text: |-
      Als justitiële gegevens worden aangemerkt de strafbeschikkingen uitgevaardigd op grond van
      [artikel 257b van het Wetboek van Strafvordering][ref1], met uitzondering van de met betrekking tot overtredingen
      uitgevaardigde strafbeschikkingen waarin een geldboete wordt opgelegd die minder dan € 100 beloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257b
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 257b
  - number: '5.2'
    text: |-
      [Artikel 7, eerste lid, onderdelen c en h][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel7
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel5
