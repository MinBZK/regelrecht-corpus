  - number: 34.g
    text: Onze Minister.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel34
  - number: '35'
    text: 'Afschriften van rapporten uit een persoonsdossier worden verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel35
  - number: 35.a
    text: |-
      de directeur van een stichting als bedoeld in [artikel 1, onder f, van de Wet op de jeugdzorg][ref1] ten
      behoeve van het verlenen van hulp en steun aan jeugdigen die worden verdacht van of zijn veroordeeld wegens
      een strafbaar feit of ten aanzien van wie op grond van bepalingen in het [Wetboek van Strafrecht][ref2] en het
      [Wetboek van Strafvordering][ref3] voorwaarden zijn gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001854
      [ref3]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel35
    references:
