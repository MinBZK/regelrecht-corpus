    text: de sepotcode en de bijkomende sepotgrond of sepotgronden;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.g.3º
    text: de bij de beslissing tot voorwaardelijk seponeren gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.g.4º
    text: de datum waarop aan alle gestelde voorwaarden is voldaan;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.h
    text: 'indien over het feit bij strafbeschikking is beslist:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.h.1°
    text: de datum waarop de strafbeschikking is uitgevaardigd;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.h.2°
    text: de opgelegde straffen, maatregelen en aanwijzingen;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.h.3°
    text: de datum waarop de strafbeschikking onherroepelijk is geworden;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.h.4°
    text: de datum waarop de strafbeschikking volledig ten uitvoer is gelegd;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.h.5°
    text: |-
      de aanduiding dat de strafbeschikking kan worden aangemerkt als een gegeven als bedoeld in de [artikelen 10][ref1],
      [11][ref2] of [12 van de wet][ref3] alsmede de datum waarop dat gegeven niet langer als zodanig kan worden
      aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel12
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '12'
  - number: 7.1.i
    text: |-
      indien een voorlopige maatregel op grond van de [Wet op de economische delicten][ref1] is opgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002063
  - number: 7.1.i.1º
    text: de aanduiding van de voorlopige maatregel;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.i.2º
    text: de beëindiging, verlenging, wijziging, intrekking of opheffing;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.j
    text: 'indien over het feit bij rechterlijke uitspraak is beslist:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.j.1º
    text: het gerecht dat de uitspraak heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.j.2º
    text: de datum van de uitspraak;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.j.3º
    text: de inhoud van de uitspraak, waaronder de kwalificatie van het feit en de daarbij betrokken strafbepalingen;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.j.4º
    text: alle voorwaarden die bij een beslissing zijn opgelegd;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.j.5º
    text: de datum waarop de uitspraak onherroepelijk is geworden;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.j.6º
    text: de datum van het vermoedelijke einde van een proeftijd;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.j.7º
    text: |-
      de aanduiding of de uitspraak kan worden aangemerkt als een gegeven als bedoeld in de [artikelen 10][ref1],
      [11][ref2] of [12 van de wet][ref3] alsmede de datum waarop dat gegeven niet langer als zodanig kan worden
      aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel12
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '12'
  - number: 7.1.k
    text: indien de rechterlijke beslissing ten uitvoer is gelegd;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.k.1º
    text: de datum en de wijze waarop de tenuitvoerlegging is beëindigd;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.k.2º
    text: de datum en de wijze waarop de taakstraf of vrijheidsstraf is aangevangen en beëindigd;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.k.3º
    text: |-
      indien de volledige tenuitvoerlegging niet is gerealiseerd, de datum van tenuitvoerlegging van de vervangende
      straf;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.1.l
    text: de datum van invrijheidstelling.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: '7.2'
    text: |-
      Als justitiële gegevens als bedoeld in de [artikelen 2][ref1] en [4][ref2], worden voorts aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel4
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0016544
        artikel: '4'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 7.2.a
    text: het arrondissementsparket of ressortsparket dat de zaak in behandeling heeft genomen;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.2.b
    text: de datum van ontvangst van het proces-verbaal bij het arrondissementsparket of ressortsparket;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
  - number: 7.2.c
    text: |-
      de datum waarop de procureur-generaal bij de Hoge Raad op grond van
      [artikel 76 van de Wet op de rechterlijke organisatie][ref1] de zaak in behandeling heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel76
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '76'
  - number: '8.1'
    text: |-
      Indien gehele of gedeeltelijke gratie wordt verleend van de opgelegde straf of maatregel, worden de volgende
      gegevens als justitiële gegevens aangemerkt:
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel8
  - number: 8.1.a
    text: de datum en het nummer van het daartoe strekkende koninklijk besluit;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel8
  - number: 8.1.b
    text: de aan het besluit verbonden bepalingen;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel8
  - number: 8.1.c
    text: de wijziging of de herroeping van een besluit tot het verlenen van gratie.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel8
  - number: '8.2'
    text: |-
      Bij de toepassing van de [Wet overdracht tenuitvoerlegging strafvonnissen][ref1] worden als justitiële gegevens
      tevens aangemerkt de in een andere Staat dan Nederland genomen beslissing als gevolg waarvan het recht tot
      tenuitvoerlegging in Nederland van een door de rechter van die Staat gewezen veroordeling geheel of gedeeltelijk is
      komen te vervallen. [Artikel 7, eerste lid, onder j][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004028
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel7
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004028
      - id: ref2
        bwb_id: BWBR0016544
        artikel: '7'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '9.1'
    text: |-
      Op grond van internationale verplichtingen worden beslissingen die door andere dan Nederlandse rechters zijn
      gewezen als justitiële gegevens aangemerkt.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op strafrechtelijke afdoeningen van andere bevoegde autoriteiten
      die ter kennis zijn gekomen van Onze Minister en voorzover het feit waarvoor de straf is opgelegd in Nederland kan
      worden aangemerkt als een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel9
  - number: '9.3'
    text: |-
      [Artikel 7, eerste lid, onder j][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel7
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '7'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '10'
    text: 'De justitiële gegevens kunnen uitsluitend afkomstig zijn van:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel10
  - number: 10.a
    text: het openbaar ministerie;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel10
  - number: 10.b
    text: de gerechten;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel10
  - number: 10.c
    text: buitenlandse gerechten;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel10
  - number: 10.d
    text: Onze Minister;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel10
  - number: 10.e
    text: |-
      het Centraal Justitieel Incassobureau, bedoeld in
      [artikel 1, van het Besluit Instelling Centraal Justitieel Incassobureau][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006713#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006713
        artikel: '1'
  - number: 10.f
    text: opsporingsambtenaren.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel10
  - number: 10a.1
    text: |-
      De Justitiële Informatiedienst, bedoeld in [artikel 30b][ref1], kan de centrale autoriteit van een andere lidstaat
      verzoeken justitiële gegevens te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel30b
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: 30b
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
  - number: 10a.2
    text: |-
      Het verzoek wordt gedaan met gebruikmaking van het formulier, opgenomen in de bijlage bij het Besluit nr. 2005/876/
      JBZ van de Raad van de Europese Unie van 21 november 2005 inzake de uitwisseling van gegevens uit het strafregister
      (PbEU L 322).
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel10a
  - number: 10a.3
    text: |-
      Het formulier, bedoeld in het tweede lid, is gesteld in de officiële taal of een van de officiële talen van de
      aangezochte lidstaat dan wel, indien die lidstaat zulks heeft aangegeven in een bij het secretariaat-generaal van
      de Raad van de Europese Unie neergelegde verklaring, in een van de andere officiële talen van de instellingen van
      de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel10a
  - number: 10a.4
    text: |-
      [Artikel 30f][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel30f
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: 30f
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
  - number: 10a.5
    text: |-
      De op grond van een verzoek als bedoeld in het eerste lid verkregen justitiële gegevens worden niet voor een ander
      doel gebruikt dan waarvoor zij zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel10a
  - number: '11'
    text: |-
      Justitiële gegevens, bedoeld in de [artikelen 10][ref1], [11][ref2] of [12 van de wet][ref3],
      worden desgevraagd verstrekt aan de voorzitter van de commissie, bedoeld in
      [artikel 8, eerste lid, van de Wet schadefonds geweldsmisdrijven][ref4] ten behoeve van de werkzaamheden die de
      commissie bij deze wet zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0002979#Artikel8
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0002979
        artikel: '8'
  - number: '12'
    text: |-
      Justitiële gegevens als bedoeld in de [artikelen 10][ref1], [11][ref2] of [12 van de wet][ref3] worden desgevraagd
      verstrekt aan:


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel12
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '12'
  - number: 12.a
    text: |-
      Onze Minister ten behoeve van het geven van een positieve of negatieve verklaring aan buitenlandse autoriteiten
      over te verlenen visa;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel12
  - number: 12.b
    text: |-
      Onze Minister ten behoeve van het geven van een positieve of negatieve verklaring aan buitenlandse autoriteiten
      voor deelname aan programma’s voor geautomatiseerde grenspassage van andere landen;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel12
  - number: 12.c
    text: |-
      Onze Minister ten behoeve van het verstrekken van bepaalde inlichtingen aan buitenlandse autoriteiten over
      aspirant-emigranten;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel12
  - number: 12.d
    text: |-
      de burgemeesters voorzover dit noodzakelijk is voor de uitoefening van een wettelijke verplichting tot het geven
      van advies over een bepaald persoon aan een ander bestuursorgaan,
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel12
  - number: 12.e
    text: |-
      de burgemeesters, indien deze gegevens op grond van een zwaarwegend algemeen belang noodzakelijk zijn ten behoeve
      van het geven van advies aan een ander bestuursorgaan en het College bescherming persoonsgegevens ontheffing heeft
      verleend.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel12
  - number: '13.1'
    text: |-
      Indien in een bij dit artikel aangewezen wet en de daarop berustende bepalingen met het oog op het nemen van
      besluiten in de zin van [artikel 1:3, eerste lid, van de Algemene wet bestuursrecht][ref1] justitiële gegevens
      noodzakelijk zijn, worden aan de personen of colleges, die op grond van die wetten zijn belast met het nemen van
      die besluiten, desgevraagd justitiële gegevens verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '13.2'
    text: Het eerste lid is van overeenkomstige toepassing op het bestuursorgaan dat beslist in administratief beroep.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel13
  - number: '13.3'
    text: 'De wetten, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel13
  - number: 13.3.a
    text: |-
      de [Drank- en Horecawet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0002458
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002458
  - number: 13.3.b
    text: |-
      de [Flora-en faunawet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009640
  - number: 13.3.c
    text: |-
      de [Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 13.3.d
    text: |-
      de [Wet explosieven voor civiel gebruik][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006803
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006803
  - number: 13.3.e
    text: |-
      de [Wet op de kansspelen][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002469
  - number: 13.3.f
    text: |-
      de [Kaderwet dienstplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008589
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008589
  - number: '13.4'
    text: |-
      Indien in een algemene plaatselijke verordening in het kader van de beoordeling van de aanvraag om een vergunning
      voor het bedrijfsmatig geven van gelegenheid tot het verrichten van seksuele handelingen met een derde tegen
      betaling gevolg wordt verbonden aan bepaalde onherroepelijke afdoeningen, is het eerste lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel13
  - number: '14'
    text: |-
      Justitiële gegevens worden desgevraagd verstrekt aan het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst
      en het hoofd van de Militaire Inlichtingen- en Veiligheidsdienst ten behoeve van de taakvervulling van deze
      diensten.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel14
  - number: '15'
    text: |-
      Justitiële gegevens worden desgevraagd verstrekt aan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], ten behoeve van de
      uitoefening van zijn wettelijk omschreven taak.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
  - number: '16'
    text: 'Justitiële gegevens worden desgevraagd verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel16
  - number: 16.a
    text: |-
      Onze Minister ten behoeve van de afgifte van een verklaring van geen bezwaar in verband met de oprichting van een
      naamloze of besloten vennootschap;
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel16
  - number: 16.b
    text: |-
