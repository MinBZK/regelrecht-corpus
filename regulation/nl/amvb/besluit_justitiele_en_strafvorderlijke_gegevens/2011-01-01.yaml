        artikel: '10'
  - number: 34.d
    text: |-
      een penitentiaire inrichting als bedoeld in [artikel 1, onder b, van de Penitentiaire beginselenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel34
    references:
