  - number: '52'
    text: |-
      De gegevens die voor de inwerkingtreding van de wet overeenkomstig een wettelijk voorschrift door de justitiële
      documentatiedienst waren geregistreerd worden op het moment van inwerkingtreding aangemerkt als justitiële
      gegevens.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel52
  - number: '53'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Wet justitiële gegevens][ref1] in werking treedt met
      uitzondering van [artikel 7, eerste lid, onder k][ref2], dat in werking treedt op een bij koninklijk besluit te
      bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel7
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel53
