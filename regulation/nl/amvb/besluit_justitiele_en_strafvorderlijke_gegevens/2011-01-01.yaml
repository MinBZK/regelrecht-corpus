        artikel: '44'
  - number: '36.2'
    text: |-
      Onze Minister neemt een aanvraag tot afgifte van een verklaring omtrent het gedrag eerst in behandeling nadat de
      bij ministeriële regeling vastgestelde vergoeding voor de kosten van deze behandeling is ontvangen.
    url: https://wetten.overheid.nl/BWBR0016544/2011-01-01#Artikel36
