      justitiële gegevens aangemerkt de in de [artikelen 6][ref2] en [7][ref3] vermelde gegevens van zaken waarvan het
      proces-verbaal door het openbaar ministerie in behandeling is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0016544#Artikel7
