  - number: '30'
    text: |-
      1 Justitiële gegevens worden desgevraagd verstrekt aan:

      a. de secretaris-generaal van het Ministerie van Veiligheid en Justitie ten behoeve van de voordracht die wordt
      gedaan met het oog op de benoeming van een minister of staatssecretaris;

      b. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties ten behoeve van de voordracht voor benoeming van de
      commissaris van de Koningin en de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba;

      c. de commissaris van de Koningin ten behoeve van het dienen van advies:

      1º. inzake de benoeming van burgemeesters;

      2º. inzake de verlening van een koninklijke onderscheiding aan een burgemeester op grond van het Reglement op de
      orde van de Nederlandse Leeuw en de Orde van Oranje-Nassau;

      3°. inzake de verlening van het predikaat Koninklijk, de verlening van het recht tot het voeren van het Koninklijk
      Wapen met de toevoeging «Bij Koninklijke Beschikking Hofleverancier» alsmede de verlening van de Koninklijke
      Erepenning;

      d. de burgemeester ten behoeve van het dienen van advies:

      1°. inzake de verlening van een koninklijke onderscheiding op grond van het
      [Reglement op de Orde van de Nederlandse Leeuw en de Orde van Oranje-Nassau][ref1];

      2°. inzake de verlening van het predikaat Koninklijk, de verlening van het recht tot het voeren van het Koninklijk
      Wapen met de toevoeging «Bij Koninklijke Beschikking Hofleverancier» alsmede de verlening van de Koninklijke
      Erepenning;

      e. de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba ten behoeve van het dienen
      van advies inzake de benoeming van gezaghebbers;

      f. Onze Minister van Defensie met het oog op de toekenning van bij koninklijk besluit te verlenen onderscheidingen.

      2 Met het oog op de adviserende bevoegdheid, bedoeld in het eerste lid, onder c, onder 2° en onder d, kunnen
      justitiële gegevens betreffende seksuele misdrijven, bedoeld in [artikel 4 van de wet][ref2] worden verstrekt.

      3 In de gevallen, bedoeld in het eerste lid, onder b, onder c, onder 1°, en onder e, is [artikel 28][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007391
