    text: |-
      1 Ten behoeve van de naleving van de [artikelen 3, tweede lid][ref1], [4, eerste en tweede lid][ref2], en
      [9, vierde lid, van de Wet politiegegevens][ref3] worden justitiële gegevens als bedoeld in de [artikelen 6][ref4]
      en [7, eerste lid, onder b, g, h, onderdeel 4°, i, j, onderdeel 3°, en k][ref5], verstrekt aan:

      a. de verwerkingsverantwoordelijke, bedoeld in [artikel 1, onderdeel f, van de Wet politiegegevens][ref6];

      b. de verwerkingsverantwoordelijke, bedoeld in
      [artikel 1, onderdeel c, van het Besluit politiegegevens bijzondere opsporingsdiensten][ref7];

      c. de verwerkingsverantwoordelijke, bedoeld in
      [artikel 1, onderdeel c, van het Besluit politiegegevens buitengewoon opsporingsambtenaren][ref8], voor zover de
      gegevens betrekking hebben op een onderzoek als bedoeld in [artikel 9 van de Wet politiegegevens][ref9].

      2 De verwerkingsverantwoordelijke vernietigt de ontvangen justitiële gegevens terstond na het bereiken van het doel
      van de verstrekking.


