      Justitiële gegevens worden desgevraagd verstrekt aan:

      a. de hulpofficier van justitie ten behoeve van de daadwerkelijke handhaving van de rechtsorde,
      bedoeld in [artikel 3 van de Politiewet 2012][ref1] en de uitvoering van de taken, bedoeld
      in [artikel 3 van de Wet op de bijzondere opsporingsdiensten][ref2], alsmede de hulpofficier
      van justitie van de Koninklijke marechaussee ten behoeve van de politietaken, bedoeld in
      [artikel 4, eerste lid, van de Politiewet 2012][ref3];

      b. het hoofd van een dienst die is belast met de behandeling van verzoeken om rechtshulp, van een landelijke
      eenheid als bedoeld in [artikel 25, eerste lid, onderdeel b, van de Politiewet 2012][ref4] ten behoeve van het
      controleren van de juistheid van de gegevens uit de politieregisters, die op grond van een verzoek om rechtshulp
      door autoriteiten van een vreemde staat, als bedoeld in [artikel 552h van het Wetboek van Strafvordering][ref5], al
      dan niet namens de officier van justitie worden verstrekt;

      c. het hoofd van een dienst die is belast met de behandeling van verzoeken om rechtshulp, van een landelijke
      eenheid als bedoeld in [artikel 25, eerste lid, onderdeel b, van de Politiewet 2012][ref6], of ingeval van
      rechtstreekse verstrekking de korpschef of de commandant van de Koninklijke marechaussee ten behoeve van het
      controleren van de juistheid van de gegevens uit de politieregisters, die zonder een daartoe strekkend verzoek op
      grond van [artikel 5:1 van het Besluit politiegegevens][ref7] aan politie-autoriteiten in een ander land worden
      verstrekt;

      d. het hoofd van de Financiële inlichtingen eenheid, bedoeld in
      [artikel 12 van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref8], voorzover dit
      noodzakelijk is om te kunnen beoordelen of de ongebruikelijke transacties van belang zijn voor de voorkoming en
      opsporing van misdrijven;

      e. de korpschef voorzover dat noodzakelijk is voor de uitvoering van artikel 8 van de Europol-Overeenkomst;

      f. de commandant van de Koninklijke marechaussee voorzover dit noodzakelijk is voor de uitvoering van de
      [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref9].


