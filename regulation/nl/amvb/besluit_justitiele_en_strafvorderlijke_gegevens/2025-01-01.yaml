  - number: '36'
    text: |-
      1 Justitiële gegevens, strafvorderlijke gegevens, tenuitvoerleggingsgegevens en gerechtelijke strafgegevens kunnen
      door de verwerkingsverantwoordelijke desgevraagd worden doorgezonden aan een bevoegde autoriteit van een andere
      lidstaat, onder de voorwaarde dat deze slechts kunnen worden verwerkt voor het doel waarvoor ze zijn doorgezonden
      en, indien aanleiding bestaat tot het stellen van grenzen aan de verdere verwerking, binnen die grenzen.

      2 Doorzending van strafvorderlijke gegevens kan uitsluitend met de tussenkomst van de officier van justitie, van
      tenuitvoerleggingsgegevens met tussenkomst van de door Onze Minister van Justitie en Veiligheid dan wel het College
      van procureurs-generaal daartoe aangewezen personen die onder hem ressorteren, en van gerechtelijke strafgegevens
      door het bestuur van een gerecht, bedoeld in [artikel 2 van de Wet op de rechterlijke organisatie][ref1], dat voor
      die gegevens verwerkingsverantwoordelijke is.

      3 De gegevens, bedoeld in het eerste lid, worden doorgezonden onder de voorwaarde dat deze door de ontvangende
      autoriteit worden vernietigd zodra het doel, met het oog waarop de gegevens zijn doorgezonden, is vervuld.

      4 Indien dit uit de wet voortvloeit kunnen bij de doorzending termijnen worden gesteld, na afloop waarvan de
      verstrekte gegevens door de ontvangende autoriteit moeten worden vernietigd, behoudens wanneer verdere verwerking
      noodzakelijk is voor een lopend onderzoek, de vervolging van strafbare feiten of de tenuitvoerlegging van straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0016544/2025-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: '37'
    text: |-
      De van een centrale autoriteit van een andere lidstaat ontvangen gegevens die betrekking hebben op de
      onherroepelijke veroordeling wegens een strafbaar feit van een Nederlandse onderdaan en van de nadien met
      betrekking tot die veroordeling genomen maatregelen ten aanzien van die onderdaan, worden opgeslagen in de
      justitiële documentatie.
    url: https://wetten.overheid.nl/BWBR0016544/2025-01-01#Artikel37
  - number: '38'
    text: |-
      1 Indien justitiële gegevens, strafvorderlijke gegevens, tenuitvoerleggingsgegevens of gerechtelijke strafgegevens
      worden ontvangen van een andere lidstaat en de ontvangende autoriteit in Nederland in kennis is gesteld van
      specifieke voorwaarden die door de bevoegde autoriteit van die lidstaat op grond van het nationale recht zijn
      gesteld aan de verwerking van de gegevens, ziet de ontvangende autoriteit in Nederland toe op de naleving van die
      voorwaarden.

      2 De gegevens, bedoeld in het eerste lid, die zijn ontvangen van een andere lidstaat, kunnen slechts worden
      verwerkt voor het doel waarvoor ze zijn doorgezonden en binnen de door die lidstaat bepaalde grenzen.

      3 De op grond van het eerste lid ontvangen gegevens worden vernietigd zodra het doel, bedoeld in het tweede lid,
      is vervuld of, indien door de doorzendende lidstaat op grond van het nationale recht termijnen zijn gesteld na
      afloop waarvan de verstrekte gegevens moeten worden vernietigd, na afloop van de gestelde termijn. Alsdan ziet de
      ontvangende autoriteit in Nederland erop toe dat de gegevens daadwerkelijk worden vernietigd.

      4 Het derde lid is niet van toepassing op de gegevens die zijn ontvangen in het kader van een verzoek tot
      verkrijging van het Nederlanderschap op grond van de [Rijkswet op het Nederlanderschap][ref1], voor zover het
      Nederlanderschap wordt verleend aan de betrokkene. [Artikel 37][ref2] is van overeenkomstige toepassing op deze
      gegevens.

      5 [Artikel 33, derde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003738
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0016544#Artikel33
