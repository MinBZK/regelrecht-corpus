  - number: '41'
    text: |-
      1 De doorzending van justitiële en strafvorderlijke gegevens aan Eurojust vindt plaats door tussenkomst van het
      nationale lid van Eurojust.

      2 De doorzending van justitiële en strafvorderlijke gegevens aan Eurojust kan worden geweigerd indien wezenlijke
      nationale veiligheidsbelangen worden geschaad of de veiligheid van een persoon in gevaar wordt gebracht.

      3 Justitiële en strafvorderlijke gegevens worden doorgezonden aan het nationale lid van Eurojust, voor zover
      hij deze behoeft in verband met de uit een rechtsinstrument op grond van het Verdrag betreffende de werking van
      de Europese Unie voortkomende doelstelling en taken van deze organisatie. Het tweede lid is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0016544/2025-01-01#Artikel41
  - number: '42'
    text: |-
      1 De doorzending van justitiële en strafvorderlijke gegevens aan Europol vindt plaats door tussenkomst van een
      landelijke eenheid als bedoeld in [artikel 25, eerste lid, onder b, van de Politiewet 2012][ref1].

      2 De doorzending van gegevens aan Europol kan worden geweigerd indien:

      a. wezenlijke nationale veiligheidsbelangen worden geschaad,

      b. het welslagen van lopende onderzoeken of de veiligheid van personen in gevaar wordt gebracht, of

      c. informatie wordt bekend gemaakt die betrekking heeft op specifieke inlichtingendiensten of -activiteiten op het
      gebied van de staatsveiligheid.

      3 Justitiële en strafvorderlijke gegevens worden doorgezonden aan de nationale verbindingsofficieren bij Europol,
      voor zover zij deze behoeven in verband met de uit een rechtsinstrument op grond van het Verdrag betreffende
      de werking van de Europese Unie voortkomende doelstelling en taken van deze organisatie. Het tweede lid is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0016544/2025-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
  - number: '43'
    text: |-
      1 De personen, instanties of colleges, bedoeld in [artikel 8, eerste en tweede lid van de wet][ref1] en in
      [hoofdstuk 3][ref2], aan wie justitiële gegevens worden verstrekt kunnen onder hen ressorterend personeel
      machtigen tot het doen van een verzoek om justitiële gegevens. In dat geval wordt de machtiging in het verzoek om
      inlichtingen vermeld.

      2 In de gevallen waarin op grond van dit besluit de burgemeester bevoegd is om justitiële gegevens te vragen, kan
      hij de politiechef wiens regionale eenheid de politietaak uitvoert in het gebied waarin de gemeente is gelegen,
      machtigen tot het doen van een verzoek om de betreffende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0016544/2025-01-01#Artikel43
