    text: |-
      1 Justitiële gegevens, strafvorderlijke gegevens of tenuitvoerleggingsgegevens kunnen slechts worden verstrekt ten
      behoeve van beleidsinformatie, wetenschappelijk onderzoek en statistiek nadat aan de betrokken onderzoeker daartoe
      schriftelijk toestemming is verleend door Onze Minister van Justitie en Veiligheid onderscheidenlijk het College
      van procureurs-generaal.

      2 Gerechtelijke strafgegevens kunnen slechts worden verstrekt ten behoeve van beleidsinformatie,
      wetenschappelijk onderzoek en statistiek nadat aan de betrokken onderzoeker daartoe schriftelijk
      toestemming is verleend door tussenkomst van het bestuur van een gerecht, bedoeld in
      [artikel 2 van de Wet op de rechterlijke organisatie][ref1], dat voor die gegevens verwerkingsverantwoordelijke is.

      3 De toestemming, bedoeld in het eerste of tweede lid, wordt slechts gegeven indien:

      a. de beleidsinformatie of het onderzoek het algemeen belang dient;

      b. de organisatie die de gegevens verstrekt niet onnodig wordt belast;

      c. de beleidsinformatie zonder de betrokken gegevens onvolledig is of het onderzoek zonder de betrokken gegevens
      niet kan worden uitgevoerd, en

      d. de persoonlijke levenssfeer van de betreffende personen niet onevenredig wordt geschaad.

      4 Aan de toestemming, bedoeld in het eerste of tweede lid, kunnen voorwaarden worden verbonden.

      5 De toestemming, bedoeld in het eerste lid, wordt ter kennis gebracht van de betreffende
      verwerkingsverantwoordelijke en geldt als machtiging tot het verstrekken van de omschreven gegevens.

      6 Benadering van personen over wie justitiële gegevens, strafvorderlijke gegevens, tenuitvoerleggingsgegevens of
      gerechtelijke strafgegevens worden verwerkt door de onderzoeker vindt niet plaats, tenzij dit uitdrukkelijk is
      toegestaan bij de toestemming ingevolge het eerste of tweede lid. Deze toestemming kan slechts worden verleend
      indien rechtstreekse benadering voor het doel van het onderzoek onvermijdelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0016544/2025-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: 31a
    text: |-
      1 Justitiële gegevens worden verstrekt aan het Wetenschappelijk Onderzoek- en Datacentrum ten behoeve van
      beleidsinformatie, wetenschappelijk onderzoek en statistiek, voor zover dat noodzakelijk is ter uitvoering van zijn
      taken, bedoeld in het [Organisatiebesluit Ministerie van Justitie en veiligheid][ref1].

      2 De op grond van het eerste lid verstrekte gegevens kunnen door het Wetenschappelijk Onderzoek- en Datacentrum op
      verzoek aan derden worden verstrekt voor zover dat noodzakelijk is ten behoeve van wetenschappelijk onderzoek en
      statistiek. De gegevens worden slechts in gepseudonimiseerde vorm verstrekt.

      3 Aan de verstrekking, bedoeld in het eerste en tweede lid, kunnen voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0040293
    url: https://wetten.overheid.nl/BWBR0016544/2025-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0040293
  - number: '32'
    text: |-
      1 Justitiële en strafvorderlijke gegevens kunnen door tussenkomst van de officier van justitie, en
      tenuitvoerleggingsgegevens kunnen door tussenkomst van door Onze Minister van Justitie en Veiligheid daartoe
      aangewezen personen die onder hem ressorteren, desgevraagd worden doorgegeven aan de bevoegde autoriteit in een
      derde land of aan een internationale organisatie, onder de voorwaarde dat deze slechts kunnen worden verwerkt voor
      het doel waarvoor ze zijn doorgegeven.

      2 Gerechtelijke strafgegevens kunnen desgevraagd door het bestuur van een gerecht, bedoeld in
      [artikel 2 van de Wet op de rechterlijke organisatie][ref1], dat voor die gegevens verwerkingsverantwoordelijke is,
      worden doorgegeven aan een bevoegde autoriteit van een derde land of aan een internationale organisatie, onder de
      voorwaarde dat deze slechts kunnen worden verwerkt voor het doel waarvoor ze zijn doorgegeven.

      3 De gegevens worden verstrekt onder de voorwaarde dat deze door de ontvangende autoriteit worden vernietigd
      zodra de doeleinden zijn verwezenlijkt. Indien dit uit de wet voortvloeit kunnen bij de verstrekking termijnen
      worden gesteld, na afloop waarvan de verstrekte gegevens door de ontvangende autoriteit moeten worden vernietigd,
      behoudens wanneer verdere verwerking noodzakelijk is voor een lopend onderzoek, de vervolging van strafbare feiten
      of de tenuitvoerlegging van straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0016544/2025-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: '33'
    text: |-
      1 Indien justitiële gegevens, strafvorderlijke gegevens of tenuitvoerleggingsgegevens zonder voorafgaand verzoek
      tot doorgifte worden ontvangen van een derde land of van een internationale organisatie, dan beoordeelt de
      ontvangende autoriteit in Nederland onmiddellijk of deze gegevens noodzakelijk zijn voor het doel waarvoor zij
      zijn verstrekt.

      2 Indien krachtens het recht van het derde land specifieke beperkingen op de verwerking van de gegevens, bedoeld
      in het eerste lid, gelden, ziet de ontvangende autoriteit in Nederland erop toe dat die beperkingen in acht worden
      genomen, indien die beperkingen door de verstrekkende autoriteit zijn gemeld.

      3 Indien gegevens als bedoeld in het eerste lid, worden ontvangen van een derde land of van een internationale
      organisatie, wordt de verstrekkende instantie desgevraagd geïnformeerd over de verwerking van de verstrekte
      gegevens en het daardoor behaalde resultaat.
    url: https://wetten.overheid.nl/BWBR0016544/2025-01-01#Artikel33
  - number: '34'
    text: |-
      1 Justitiële gegevens van natuurlijke personen, die betrekking hebben op een onherroepelijke veroordeling wegens
      een misdrijf waarbij een straf, al dan niet tezamen met een maatregel, is opgelegd en wegens overtredingen
      indien daarbij een vrijheidsstraf – anders dan een vervangende – of een taakstraf is opgelegd, worden onverwijld
      doorgezonden aan de centrale autoriteit van de lidstaat van nationaliteit van de veroordeelde.

      2 De centrale autoriteit stelt de centrale autoriteit die op grond van het eerste lid gegevens heeft ontvangen
      onverwijld in kennis van wijziging of schrapping in de justitiële documentatie van de doorgezonden gegevens.

      3 De centrale autoriteit zendt desgevraagd de centrale autoriteit die op grond van het eerste lid gegevens heeft
      ontvangen een afschrift van de veroordelingen, de daaropvolgende maatregelen en eventuele overige informatie ter
      zake.
    url: https://wetten.overheid.nl/BWBR0016544/2025-01-01#Artikel34
  - number: '35'
    text: |-
      1 Justitiële gegevens worden desgevraagd doorgezonden aan de centrale autoriteit van een andere lidstaat ten
      behoeve van een strafrechtelijke procedure.

      2 Justitiële gegevens worden desgevraagd doorgezonden aan de centrale autoriteit van een andere lidstaat ten
      behoeve van een verzoek van de betrokkene om hem betreffende gegevens uit de justitiële documentatie.

      3 Justitiële gegevens die betrekking hebben op een misdrijf bedoeld in de [artikelen 241][ref1], [243][ref2],
      [245 tot en met 250][ref3] en [251 tot en met 253][ref4] en [273f van het Wetboek van Strafrecht][ref5], worden
      desgevraagd doorgezonden aan de centrale autoriteit van een andere lidstaat ten behoeve van een procedure die
      verband houdt met het aannemen van personeel voor activiteiten waarbij de betrokkene rechtstreeks en geregeld in
      aanraking komt met kinderen.

      4 Justitiële gegevens kunnen desgevraagd worden doorgezonden aan de centrale autoriteit van een andere lidstaat ten
      behoeve van andere doeleinden.

      5 De centrale autoriteit onderzoekt de volledigheid van de bij een verzoek, bedoeld in het eerste tot en met
      het vierde lid, doorgezonden informatie. Indien de bij het verzoek verstrekte informatie volledig is, worden de
      justitiële gegevens onverwijld maar in ieder geval binnen tien werkdagen na de dag waarop het verzoek is ontvangen,
      doorgezonden. Indien nadere informatie nodig is met het oog op vaststelling van de identiteit van de persoon op
      wie het verzoek betrekking heeft, wordt onverwijld overlegd met de centrale autoriteit die het verzoek heeft gedaan
      teneinde binnen tien werkdagen na de dag waarop de aanvullende informatie is verkregen, een antwoord te kunnen
      verzenden.

      6 In afwijking van het vijfde lid wordt een verzoek, bedoeld in het tweede tot en met het vierde lid, in ieder
      geval beantwoord binnen twintig werkdagen na de dag waarop het verzoek is ontvangen respectievelijk de dag waarop
      de aanvullende informatie is verkregen.

      7 De beantwoording van het verzoek bedoeld in het eerste tot en met het vierde lid, geschiedt langs
      geautomatiseerde weg.

      8 Tot uiterlijk een jaar na de doorzending op grond van het eerste tot en met het vierde lid stelt de centrale
      autoriteit onverwijld de centrale autoriteit die de gegevens heeft ontvangen in kennis van wijziging of schrapping
      van de doorgezonden gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel241
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel243
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel241
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel251
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel273f
