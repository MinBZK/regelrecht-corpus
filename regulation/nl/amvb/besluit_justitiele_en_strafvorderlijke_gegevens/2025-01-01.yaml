  - number: '44'
    text: |-
      Onze Minister kan bij zijn onderzoek met betrekking tot de afgifte van de verklaring omtrent het gedrag kennis
      nemen van de justitiële gegevens betreffende seksuele misdrijven, bedoeld in [artikel 4 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel4
