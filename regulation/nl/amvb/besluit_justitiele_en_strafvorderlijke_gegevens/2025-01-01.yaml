      1 Ten behoeve van het nemen van een besluit tot oplegging van een bestuurlijke boete, worden desgevraagd aan het
      bestuursorgaan dat op grond van de in het tweede lid genoemde wetten belast is met het nemen van een dergelijk
      besluit, justitiële gegevens verstrekt die noodzakelijk zijn voor de beoordeling of sprake is van herhaalde
      overtreding van de voorschriften uit die wetten.

      2 De in het eerste lid bedoelde wetten zijn:

      a. de [Toeslagenwet][ref1];

      b. de [Werkloosheidswet][ref2];

      c. de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3];

      d. de [Wet inkomensvoorziening oudere werklozen][ref4];

      e. de [Wet op de arbeidsongeschiktheidsverzekering][ref5];

      f. de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6];

      g. de [Wet werk en inkomen naar arbeidsvermogen][ref7];

      h. de [Ziektewet][ref8];

      i. de [Algemene Kinderbijslagwet][ref9];

      j. de [Algemene nabestaandenwet][ref10];

      k. de [Algemene Ouderdomswet][ref11];

      l. de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref12];

      m. de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref13];

      n. de [Participatiewet][ref14].

      3 Het bestuursorgaan, dat op grond van het eerste lid justitiële gegevens ontvangt, kan deze gegevens verder
