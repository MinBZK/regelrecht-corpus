      d. de directeur of ressortsdirecteur van de raad voor de kinderbescherming;

      e. de gedragsdeskundigen die zijn belast met de opstelling van rapporten of adviezen als bedoeld in de
      [artikelen 37, tweede en derde lid][ref4] en [37a, derde lid, van het Wetboek van Strafrecht][ref5].

      2 De in het eerste lid bedoelde personen kunnen tevens kennis nemen van de justitiële gegevens betreffende seksuele
      misdrijven, bedoeld in [artikel 4 van de wet][ref6].

      3 Justitiële gegevens worden voor zover dit nodig is voor de uitvoering van de [Wet forensische zorg][ref7]
      verstrekt aan zorgaanbieders die forensische zorg verlenen.


