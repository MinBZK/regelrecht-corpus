    text: |-
      Justitiële gegevens worden ten behoeve van de toelating tot de inrichting van personen, die niet worden ingesloten
      in de inrichting respectievelijk voorziening, voorzover dat noodzakelijk is voor de orde of de veiligheid van de
      inrichting of de voorziening desgevraagd verstrekt aan:

      a. de directeur van een inrichting als bedoeld in [artikel 1, onder b, van de Penitentiaire beginselenwet][ref1];

      b. de directeur van een inrichting voor verpleging van ter beschikking gestelden als bedoeld in
      [artikel 1, onder b, van de Beginselenwet verpleging ter beschikking gestelden][ref2];

      c. de directeur van een voorziening als bedoeld in
      [artikel 4, eerste lid, van de Tijdelijke wet noodcapaciteit drugskoeriers][ref3];

      d. de directeur van een grenslogies als bedoeld in
      [artikel 2, aanhef, onder 1, van het Reglement regime grenslogies][ref4];

      e. de directeur van een inrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref5].


