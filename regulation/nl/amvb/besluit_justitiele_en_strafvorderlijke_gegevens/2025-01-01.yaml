    text: |-
      Justitiële gegevens, bedoeld in de [artikelen 10][ref1], [11][ref2] of [12 van de wet][ref3],
      worden desgevraagd verstrekt aan de voorzitter van de commissie, bedoeld in
      [artikel 8, eerste lid, van de Wet schadefonds geweldsmisdrijven][ref4] ten behoeve van de werkzaamheden die de
      commissie bij deze wet zijn opgedragen.


