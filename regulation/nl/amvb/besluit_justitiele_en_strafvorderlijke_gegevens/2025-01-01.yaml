    text: |-
      1 Justitiële gegevens worden met het oog op het bij wettelijk voorschrift geregelde onderzoek naar de
      betrouwbaarheid en geschiktheid van een persoon die in aanmerking wil komen voor een functie bij een ambtelijke
      dienst voorzover de functie bijzondere eisen stelt aan de integriteit of verantwoordelijkheid van de betrokkene,
      desgevraagd verstrekt aan:

      a. het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst voorzover het betreft personen die in aanmerking
      willen komen voor een dienstbetrekking;

      b. de korpschef voor zover het personen betreft die in aanmerking willen komen voor een dienstbetrekking bij de
      politie dan wel personen die krachtens overeenkomst werkzaamheden voor de politie willen verrichten;

      c. Onze Minister voor zover het betreft personen die in aanmerking willen komen voor de functie van korpschef,
      directeur van de Politieacademie of zijn plaatsvervanger;

      d. het College van procureurs-generaal voorzover het betreft de personen die in aanmerking willen komen voor een
      dienstbetrekking als ambtenaar van de rijksrecherche;

      e. Onze Minister van Buitenlandse Zaken voorzover het betreft personen die in aanmerking willen komen voor een
      dienstbetrekking bij de Dienst Buitenlandse Zaken;

      f. de directeur-generaal Belastingdienst, voorzover het betreft de boete- en fraudecoördinator, de contactambtenaar
      Algemene wet inzake rijksbelastingen, de medewerkers fraudeteam en de autorisatiebeheerder en toepassingsbeheerder;

      g. de voorzitter van het managementteam van de Belastingdienst/Fiscale inlichtingen- en opsporingsdienst
      Economische controledienst voorzover het betreft de personen die in aanmerking willen komen voor de functie van
      opsporingsambtenaar;

      h. het hoofd van de Algemene Inspectiedienst van het Ministerie van Economische Zaken, Landbouw en Innovatie
      voorzover het betreft de personen die in aanmerking willen komen voor de functie van opsporingsambtenaar;

      i. de inspecteur-generaal van de Inspectie Verkeer en Waterstaat voorzover het betreft de personen die in
      aanmerking willen komen voor de functie van opsporingsambtenaar;

      j. de directeur van een inrichting als bedoeld in
      [artikel 1, onder b, van de Penitentiaire beginselenwet][ref1], de directeur van een inrichting als bedoeld
      in [artikel 1, onder b, van de Beginselenwet verpleging ter beschikking gestelden][ref2], de directeur van een
      voorziening als bedoeld in [artikel 4, eerste lid, van de Tijdelijke wet noodcapaciteit drugskoeriers][ref3],
      de directeur van een grenslogies als bedoeld in
      [artikel 2, aanhef, onder 1, van het Reglement regime grenslogies][ref4] alsmede de directeur van een inrichting
      als bedoeld in [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref5] voorzover het betreft
      personen die in aanmerking willen komen voor een dienstbetrekking.

      2 Het eerste lid is van overeenkomstige toepassing, indien op grond van een wettelijk voorschrift gedurende het
      dienstverband bij een ambtelijke dienst of gedurende het krachtens overeenkomst verrichten van werkzaamheden voor
      de politie een onderzoek naar de betrouwbaarheid en geschiktheid van een persoon wordt gedaan.

      3 Het eerste lid, onder b, c en d, is van overeenkomstige toepassing voor zover het betreft de personen, bedoeld in
      [artikel 48s, tweede lid, van de Politiewet 2012][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0013488#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005848#Artikel2
