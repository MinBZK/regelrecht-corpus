  - number: '5'
    text: |-
      1 Als justitiële gegevens worden aangemerkt de strafbeschikkingen uitgevaardigd op grond van de
      [artikelen 257b][ref1] en [257ba van het Wetboek van Strafvordering][ref2], met uitzondering van de met betrekking
      tot overtredingen uitgevaardigde strafbeschikkingen waarin een geldboete wordt opgelegd die minder dan € 130,–
      beloopt.

      2 Als justitiële gegevens worden aangemerkt de strafbeschikkingen terzake van misdrijven, uitgevaardigd krachtens
      de [artikelen 76 van de Algemene wet inzake rijksbelastingen][ref3] en [10:15 van de Algemene douanewet][ref4].

      3 [Artikel 7, eerste lid, onderdelen c en h][ref5], is van overeenkomstige toepassing.


