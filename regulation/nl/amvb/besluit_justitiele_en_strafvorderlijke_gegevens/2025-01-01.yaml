    text: |-
      Justitiële gegevens worden desgevraagd verstrekt aan Onze Minister ten behoeve van:

      a. het nemen van de beslissingen over de betrouwbaarheid van buitengewone opsporingsambtenaren;

      b. het nemen van de beslissingen over de betrouwbaarheid van de opsporingsambtenaren van de bijzondere
      opsporingsdiensten, genoemd in [artikel 2 van de Wet op de bijzondere opsporingsdiensten][ref1].

      c. het onderzoek naar de betrouwbaarheid en geschiktheid van personen die in aanmerking willen komen voor een
      functie bij de rechtsprekende macht of als rechterlijk ambtenaar bij het openbaar ministerie;

      d. het onderzoek of bezwaren bestaan tegen de vervulling van de functie als lid van een commissie van toezicht op
      de arrestantenzorg als bedoeld in [artikel 50, eerste lid, van het Besluit beheer politie](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel2
