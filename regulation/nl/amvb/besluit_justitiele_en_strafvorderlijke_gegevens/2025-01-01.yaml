    text: |-
      De rapporten die het persoonsdossier vormen zijn afkomstig van:

      a. een reclasseringsinstelling als bedoeld in [artikel 4 van de Reclasseringsregeling 1995][ref1];

      b. de raad voor de kinderbescherming;

      c. een gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref2] bij de uitvoering van
      reclassering;

      d. een penitentiaire inrichting als bedoeld in [artikel 1, onder b, van de Penitentiaire beginselenwet][ref3];

      e. een instelling als bedoeld in
      [artikel 1, onder b, van de Beginselenwet verpleging ter beschikking gestelden][ref4];

      f. een inrichting als bedoeld in [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref5];

      g. Onze Minister.


