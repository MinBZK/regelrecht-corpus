  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 20 februari 2004, nr. 5271210/04/6;

    Gelet op de artikelen 2, tweede en derde lid, 4, vijfde lid, 8, vierde en vijfde lid, 9, eerste lid, 13, eerste
    lid, 25, 36, 39 en 49 van de Wet justitiële gegevens;

    De Raad van State gehoord (advies van 24 maart 2004, nr. W03.04.0085/I);

    Gezien het nader rapport van Onze Minister van Justitie van 24 maart 2004, nr. 5278333/04/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0016544/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: de [Wet justitiële en strafvorderlijke gegevens][ref1];

      b. sepot: de beslissing van het openbaar ministerie tot niet vervolging of niet verdere vervolging van de zaak;

      c. centrale autoriteit: de centrale autoriteit, bedoeld in artikel 3, eerste lid, van het kaderbesluit 2009/315/
      JBZ van de Raad van de Europese Unie van 26 februari 2009 betreffende de organisatie en de inhoud van uitwisseling
      van gegevens uit het strafregister tussen de lidstaten (PbEU L 93/23). In Nederland is dit de Justitiële
      Informatiedienst;

      d. strafrechtelijke procedure: de fase die aan het strafproces voorafgaat, het strafproces zelf en de
      tenuitvoerlegging van de veroordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0016544/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 1a
    text: |-
      Dit hoofdstuk is van toepassing op de verwerking van justitiële en strafvorderlijke gegevens, persoonsgegevens in
      persoonsdossiers, tenuitvoerleggingsgegevens en gerechtelijke strafgegevens.
    url: https://wetten.overheid.nl/BWBR0016544/2025-01-01#Artikel1a
  - number: 1b
    text: |-
      1 De verwerkingsverantwoordelijke toetst en actualiseert de passende technische en organisatorische maatregelen die
      bij en krachtens de wet zijn getroffen.

      2 Wanneer zulks in verhouding staat tot de verwerkingsactiviteiten omvatten de maatregelen, bedoeld in het eerste
      lid, de uitvoering van een passend gegevensbeschermingsbeleid door de verwerkingsverantwoordelijke.

      3 De verwerkingsverantwoordelijke of de verwerker treft, na beoordeling van de risico’s, maatregelen om:

      a. te verhinderen dat onbevoegden toegang krijgen tot apparatuur voor de verwerking van gegevens;

      b. te verhinderen dat onbevoegden gegevensdragers lezen, kopiëren, wijzigen of verwijderen;

      c. te verhinderen dat onbevoegden gegevens invoeren of opgeslagen gegevens inzien, wijzigen of verwijderen;

      d. te verhinderen dat onbevoegden systemen voor geautomatiseerde gegevensverwerking gebruiken met behulp van
      datatransmissieapparatuur;

      e. ervoor te zorgen dat personen die geautoriseerd zijn om een systeem voor geautomatiseerde gegevensverwerking te
      gebruiken, uitsluitend toegang hebben tot de gegevens waarop hun autorisatie betrekking heeft;

      f. ervoor te zorgen dat kan worden nagegaan en vastgesteld aan welke organen gegevens zijn of kunnen worden
      verstrekt of beschikbaar gesteld met behulp van datatransmissieapparatuur;

      g. ervoor te zorgen dat later kan worden nagegaan en vastgesteld welke gegevens wanneer en door wie in een systeem
      voor geautomatiseerde gegevensverwerking zijn ingevoerd;

      h. te verhinderen dat onbevoegden gegevens lezen, kopiëren, wijzigen of verwijderen tijdens de doorgifte van die
      gegevens of het vervoer van gegevensdragers;

      i. ervoor te zorgen dat de geïnstalleerde systemen in geval van storing opnieuw kunnen worden ingezet;

      j. ervoor te zorgen dat de functies van het systeem werken, dat eventuele functionele storingen worden gesignaleerd
      en dat opgeslagen gegevens niet kunnen worden beschadigd door het verkeerd functioneren van het systeem.
    url: https://wetten.overheid.nl/BWBR0016544/2025-01-01#Artikel1b
  - number: 1c
    text: |-
      De inhoud van een overeenkomst of andere rechtshandeling die de verwerker aan een verwerkingsverantwoordelijke
      bindt, bevat het onderwerp en de duur van de verwerking, de aard en het doel van de verwerking, het soort
      gegevens waarop de wet van toepassing is, de categorieën van betrokkenen en de verplichtingen en de rechten van de
      verwerkingsverantwoordelijke, en met name wordt daarin bepaald dat de verwerker:

      a. uitsluitend volgens de instructies van de verwerkingsverantwoordelijke handelt;

      b. er zorg voor draagt dat de tot het verwerken van gegevens gemachtigde personen zich ertoe hebben verplicht
      vertrouwelijkheid in acht te nemen of door een passende wettelijke verplichting daaraan gebonden zijn;

      c. de verwerkingsverantwoordelijke met passende middelen bijstaat om naleving van de bepalingen betreffende de
      rechten van de betrokkene te verzekeren;

      d. na afloop van de gegevensverwerkingsdiensten, naargelang de keuze van de verwerkingsverantwoordelijke, alle
      gegevens wist of hem deze ter beschikking stelt, en bestaande kopieën verwijdert, tenzij opslag van die gegevens
      verplicht is;

      e. de verwerkingsverantwoordelijke alle informatie ter beschikking stelt die nodig is om nakoming van dit artikel
      aan te tonen;

      f. aan de in dit artikel gestelde voorschriften voldoet bij de inschakeling van een andere verwerker en bij die
      inschakeling in overeenstemming met [artikel 7d, vierde lid, van de wet][ref1], handelt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel7d
