    text: |-
      Justitiële gegevens worden desgevraagd verstrekt aan:

      a. Onze Minister ten behoeve van de controle van rechtspersonen met het oog op de voorkoming en
      bestrijding van misbruik van rechtspersonen, waaronder het plegen van misdrijven en overtredingen
      van financieel-economische aard door of door middel van deze rechtspersonen, bedoeld in
      [artikel 2, eerste lid, van de Wet controle op rechtspersonen][ref1];

      b. Onze Minister en de burgemeesters voorzover dit noodzakelijk is in het kader van de beoordeling van een verzoek
      tot verkrijging van het Nederlanderschap op grond van de [Rijkswet op het Nederlanderschap][ref2];

      c. Onze Minister voorzover dit noodzakelijk is voor het verwerken van deze gegevens in het Cliënt-Volgsysteem
      Jeugdcriminaliteit;

      d. Onze Minister en aan de korpschef voorzover dit noodzakelijk is voor de uitvoering van de
      [Wet wapens en munitie][ref3], de [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref4] en van
      [Afdeling 11.2 van het Besluit activiteiten leefomgeving][ref5];

      e. Onze Minister van Defensie en het hoofd van het onderdeel van de Belastingdienst, de Centrale dienst voor in-
      en uitvoer, voor zover dit noodzakelijk is voor de uitvoering van de [Wet wapens en munitie][ref6] en andere in dat
      kader relevante regelgeving;

      f. Onze Minister ten behoeve van het nemen van een beslissing omtrent de toepassing van de
      [artikelen 2 tot en met 4 van de Tijdelijke wet bestuurlijke maatregelen terrorismebestrijding][ref7];

      g. Onze Minister, Onze Minister van Economische Zaken en Klimaat of Onze Minister of
      Ministers die het mede aangaat, voor zover dit noodzakelijk is voor de uitvoering van de
      [Wet veiligheidstoets investeringen, fusies en overnames][ref8];

      h. Onze Minister, voor zover dit noodzakelijk is voor de uitvoering van de
      [Wet kwaliteit incassodienstverlening][ref9].


