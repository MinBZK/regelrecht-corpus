  - number: '4'
    text: |-
      1 In afwijking van [artikel 3][ref1] worden met betrekking tot de in het tweede lid genoemde overtredingen als
      justitiële gegevens aangemerkt de in de [artikelen 6][ref2] en [7][ref3] vermelde gegevens van zaken waarvan het
      proces-verbaal door het openbaar ministerie in behandeling is genomen.

      2 De overtredingen, bedoeld in het eerste lid, zijn:

      a. de overtredingen betreffende de algemene veiligheid van personen en goederen, genoemd in
      [Titel I van het Derde Boek van het Wetboek van Strafrecht][ref4];

      b. de overtredingen betreffende de openbare orde, genoemd in
      [Titel II van het Derde Boek van het Wetboek van Strafrecht][ref5];

      c. de overtredingen inzake fraude, bedoeld in de [artikelen 447c][ref6] en
      [447d van het Wetboek van Strafrecht][ref7];

      d. de ambtsovertredingen, genoemd in [Titel VIII van het Derde Boek van het Wetboek van Strafrecht][ref8];

      e. de overtredingen van de [Wet op de economische delicten][ref9];

      f. de overtreding van [artikel 30, eerste, tweede en vierde lid][ref10], juncto
      [artikel 2 van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref11];

      g. de overtreding van [artikel 34][ref12], derde lid, juncto
      [artikel 2 van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref13];

      h. de overtreding van [artikel 5 van de Wegenverkeerswet 1994][ref14];

      i. de overtreding van [artikel 107, eerste lid, van de Wegenverkeerswet 1994][ref15];

      j. de overtreding van [artikel 110, eerste lid, van de Wegenverkeerswet 1994][ref16], voor zover de overtreding is
      gepleegd met een voertuig voor het besturen waarvan een rijbewijs is vereist;

      k. de overtreding van [artikel 5.6.8, eerste en tweede lid, Regeling voertuigen][ref17], indien de
      maximumconstructiesnelheid met meer dan 15 kilometer per uur is overschreden;

      l. de overtreding van de [artikelen 19][ref18], [20, aanhef en onder a en b][ref19],
      [21, aanhef en onder a en b][ref20], [22, aanhef en onder a, b, d, e, f en g][ref21] en [62][ref22] juncto bord
      A1 of A3 van [bijlage 1, van het Reglement verkeersregels en verkeerstekens 1990][ref23], voor zover voor de
      overtreding geen administratiefrechtelijke sanctie wordt opgelegd;

      m. de overtreding van [artikel 8.06, eerste lid, van het Binnenvaartpolitiereglement][ref24] en
      [artikel 5.01 Binnenvaartpolitiereglement][ref25] juncto verkeersteken B6 of een bekendmaking met dezelfde strekking
      als een verkeersteken als bedoeld in [artikel 13 Besluit administratieve bepalingen scheepvaartverkeer][ref26]
      voorzover het betreft kleine schepen, elk indien de maximumsnelheid met meer dan vijfentwintig kilometer per uur
      is overschreden;

      n. de overtredingen van de [Vreemdelingenwet 2000][ref27];

      o. de overtredingen van de [Wet op de kansspelen][ref28];

      p. de overtredingen van de [Wet wapens en munitie][ref29];

      q. de overtredingen van de [Alcoholwet][ref30];

      r. de overtredingen van de de [artikelen 4.3, derde lid][ref31], en
      [5.1, tweede lid, onder g, van de Omgevingswet][ref32] in samenhang met
      [afdeling 11.2 van het Besluit activiteiten leefomgeving][ref33];

      s. de overtredingen, bedoeld in [artikel 35b, eerste lid, van de Scheepvaartverkeerswet][ref34];

      t. de overtredingen van het [Reglement verkeersregels en verkeerstekens][ref35], voor zover het betreft:

      1° de overtreding van [artikel 11, tweede lid][ref36];

      2° de overtredingen van [artikel 42][ref37];

      3° de overtredingen van [artikel 43, eerste en tweede lid][ref38];

      4° de overtredingen van [artikel 43, derde lid][ref39], voor zover de overtreding betreft het rijden over de
      vluchtstrook of de luchthaven;

      5° de overtredingen van [artikel 49, eerste en tweede lid][ref40];

      6° de overtreding van [artikel 62][ref41] juncto [artikel 73, sub b][ref42];

      7° de overtreding van [artikel 82, eerste lid][ref43];

      8° de overtredingen van [artikel 82a][ref44] juncto [artikel 41a, lid 1, onder a, sub 1 en 4][ref45], en

      9° de overtredingen van [artikel 83][ref46];

      u. de overtredingen van de [Wegenverkeerswet 1990](onbekend), voor zover het betreft:

      1° de overtreding van [artikel 12][ref47], en

      2° de overtredingen van [artikel 160, eerste lid][ref48], voor zover het betrekking heeft op het niet stilhouden
      van een motorrijtuig op eerste vordering;

      v. de overtredingen van [artikel 3, eerste en tweede lid][ref49], en
      [12, derde lid, van de Wet ter Bescherming Koopvaardij][ref50].

      3 Het eerste lid is van overeenkomstige toepassing op zaken die door de procureur-generaal bij de Hoge Raad in
      behandeling zijn genomen en waarvan de Hoge Raad ingevolge [artikel 76][ref51] in eerste instantie en tevens in
      hoogste ressort kennis neemt.


