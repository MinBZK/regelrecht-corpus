  - number: '47'
    text: |-
      Afschriften van rapporten uit een persoonsdossier worden verstrekt aan:

      a. de directeur van een gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1] ten
      behoeve van het verlenen van hulp en steun aan jeugdigen die worden verdacht van of zijn veroordeeld wegens
      een strafbaar feit of ten aanzien van wie op grond van bepalingen in het [Wetboek van Strafrecht][ref2] en het
      [Wetboek van Strafvordering][ref3] voorwaarden zijn gesteld;

      b. Onze Minister ten behoeve van het voorbereiden van enig rapport met het oog op een juiste toepassing van het
      strafrecht;

      c. een zorgaanbieder als bedoeld in [artikel 1.1, onder o, van de Wet forensische zorg][ref4] ten behoeve van de te
      verlenen forensische zorg;

      d. de commissie als bedoeld in [artikel 37a, negende lid, van het Wetboek van Strafrecht][ref5] ten behoeve van
      het uitbrengen van advies over de aanwezigheid en bruikbaarheid van persoonsgegevens betreffende een mogelijke
      gebrekkige ontwikkeling of ziekelijke stoornis van de geestvermogens van een weigerende observandus als bedoeld in
      artikel 37a, vijfde lid, van het Wetboek van Strafrecht.


