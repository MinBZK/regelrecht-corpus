    text: |-
      1 Ten behoeve van de verantwoordelijkheid, bedoeld in de [artikelen 2.1][ref1] en
      [2.4, tweede lid, van de Jeugdwet][ref2], kan Onze Minister aan een door het college van burgemeester en
      wethouders aangewezen ambtenaar of aan een door het college aangewezen en onder zijn verantwoordelijkheid
      werkzame functionaris justitiële gegevens als bedoeld in [artikel 6, eerste lid, onderdeel f][ref3], en
      [artikel 7, eerste lid, onder j, onderdelen 5 en 6][ref4], verstrekken van personen ten aanzien van wie in het
      kader van een strafrechtelijke beslissing is bepaald dat zij in aanmerking komen voor een vorm van jeugdhulp of
      jeugdreclassering, als bedoeld in [artikel 1.1 van de Jeugdwet][ref5].

      2 Het college van burgemeester en wethouders treft maatregelen opdat de op grond van het eerste lid verstrekte
      justitiële gegevens uiterlijk twaalf maanden na de beëindiging van de tenuitvoerlegging van de in het eerste lid
      bedoelde strafrechtelijke beslissing worden vernietigd.


