  - number: '8'
    text: |-
      1 Indien gehele of gedeeltelijke gratie wordt verleend van de opgelegde straf of maatregel, worden de volgende
      gegevens als justitiële gegevens aangemerkt:

      a. de datum en het nummer van het daartoe strekkende koninklijk besluit;

      b. de aan het besluit verbonden bepalingen;

      c. de wijziging of de herroeping van een besluit tot het verlenen van gratie.

      2 Bij de toepassing van de [Wet overdracht tenuitvoerlegging strafvonnissen][ref1] worden als justitiële gegevens
      tevens aangemerkt de in een andere Staat dan Nederland genomen beslissing als gevolg waarvan het recht tot
      tenuitvoerlegging in Nederland van een door de rechter van die Staat gewezen veroordeling geheel of gedeeltelijk is
      komen te vervallen. [Artikel 7, eerste lid, onder j][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004028
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel7
