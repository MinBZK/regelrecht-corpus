      1 Justitiële gegevens als bedoeld in de [artikelen 10][ref1], [11][ref2] of [12 van de wet][ref3] worden
      desgevraagd verstrekt aan:

      a. Onze Minister ten behoeve van het geven van een positieve of negatieve verklaring aan buitenlandse autoriteiten
      over te verlenen visa;

      b. Onze Minister ten behoeve van het verstrekken van bepaalde inlichtingen aan buitenlandse autoriteiten over
      aspirant-emigranten;

      c. de burgemeesters voorzover dit noodzakelijk is voor de uitoefening van een wettelijke verplichting tot het geven
      van advies over een bepaald persoon aan een ander bestuursorgaan,

      d. de burgemeesters, indien deze gegevens op grond van een zwaarwegend algemeen belang noodzakelijk zijn ten
      behoeve van het geven van advies aan een ander bestuursorgaan en het College bescherming persoonsgegevens
      ontheffing heeft verleend.

      2 Justitiële gegevens worden desgevraagd verstrekt aan Onze Minister ten behoeve van het geven van een positieve of
      negatieve verklaring aan buitenlandse autoriteiten voor deelname aan programma’s voor geautomatiseerde grenspassage
      van andere landen.


