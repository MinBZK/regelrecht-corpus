  - number: '15'
    text: |-
      1 Justitiële gegevens worden desgevraagd verstrekt aan:

      a. het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], ten behoeve van de
      uitoefening van zijn wettelijk omschreven taak;

      b. bestuursorganen en rechtspersonen met een overheidstaak als bedoeld in
      [artikel 1, eerste lid, van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2], voor
      zover dat noodzakelijk is in de gevallen waarin zij bevoegd zijn tot toepassing van die wet.

      2 De krachtens het eerste lid, onder b, verstrekte justitiële gegevens betreffen:

      a. de betrokkene, bedoeld in
      [artikel 1, eerste lid, van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref3];

      b. degene die direct of indirect leiding geeft of heeft gegeven aan betrokkene;

      c. degene die direct of indirect zeggenschap heeft of heeft gehad over betrokkene;

      d. degene die direct of indirect vermogen verschaft of heeft verschaft aan betrokkene;

      e. degene die als leidinggevende, beheerder, bedrijfsleider of vervoersmanager is of zal worden vermeld op de
      beschikking die is aangevraagd of is gegeven;

      f. degene die redelijkerwijs met betrokkene gelijk kan worden gesteld op grond van zijn feitelijke invloed op de
      betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel1
