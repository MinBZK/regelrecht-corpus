    text: |-
      Justitiële gegevens worden met het oog op het bij wettelijk voorschrift geregelde onderzoek naar de betrouwbaarheid
      en geschiktheid van een persoon die in aanmerking wil komen voor een functie bij een ambtelijke dienst voorzover de
      functie bijzondere eisen stelt aan de integriteit of verantwoordelijkheid van de betrokkene, desgevraagd verstrekt
      aan:
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel23
  - number: 23.1.a
    text: |-
      het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst voorzover het betreft personen die in aanmerking
      willen komen voor een dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel23
  - number: 23.1.b
    text: |-
      de korpschef voorzover het betreft personen die in aanmerking willen komen voor een dienstbetrekking bij de
      politie;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel23
  - number: 23.1.c
    text: |-
      Onze Minister voor zover het betreft personen die in aanmerking willen komen voor de functie van korpschef,
      directeur van de Politieacademie of zijn plaatsvervanger;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel23
  - number: 23.1.d
    text: |-
      het College van procureurs-generaal voorzover het betreft de personen die in aanmerking willen komen voor een
      dienstbetrekking als ambtenaar van de rijksrecherche;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel23
  - number: 23.1.e
    text: |-
      Onze Minister van Buitenlandse Zaken voorzover het betreft personen die in aanmerking willen komen voor een
      dienstbetrekking bij de Dienst Buitenlandse Zaken;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel23
  - number: 23.1.f
    text: |-
      de directeur-generaal Belastingdienst, voorzover het betreft de boete- en fraudecoördinator, de contactambtenaar
      Algemene wet inzake rijksbelastingen, de medewerkers fraudeteam en de autorisatiebeheerder en toepassingsbeheerder;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel23
  - number: 23.1.g
    text: |-
      de voorzitter van het managementteam van de Belastingdienst/Fiscale inlichtingen- en opsporingsdienst
      Economische controledienst voorzover het betreft de personen die in aanmerking willen komen voor de functie van
      opsporingsambtenaar;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel23
  - number: 23.1.h
    text: |-
      het hoofd van de Algemene Inspectiedienst van het Ministerie van Economische Zaken, Landbouw en Innovatie voorzover
      het betreft de personen die in aanmerking willen komen voor de functie van opsporingsambtenaar;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel23
  - number: 23.1.i
    text: |-
      de inspecteur-generaal van de Inspectie Verkeer en Waterstaat voorzover het betreft de personen die in aanmerking
      willen komen voor de functie van opsporingsambtenaar;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel23
  - number: 23.1.j
    text: |-
      de directeur van een inrichting als bedoeld in
      [artikel 1, onder b, van de Penitentiaire beginselenwet][ref1], de directeur van een inrichting als bedoeld
      in [artikel 1, onder b, van de Beginselenwet verpleging ter beschikking gestelden][ref2], de directeur van een
      voorziening als bedoeld in [artikel 4, eerste lid, van de Tijdelijke wet noodcapaciteit drugskoeriers][ref3],
      de directeur van een grenslogies als bedoeld in
      [artikel 2, aanhef, onder 1, van het Reglement regime grenslogies][ref4] alsmede de directeur van een inrichting
      als bedoeld in [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref5] voorzover het betreft
      personen die in aanmerking willen komen voor een dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0013488#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005848#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel23
