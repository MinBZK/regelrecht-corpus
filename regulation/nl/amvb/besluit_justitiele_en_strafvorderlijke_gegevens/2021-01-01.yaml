  - number: '13.4'
    text: |-
      Indien in een algemene plaatselijke verordening in het kader van de beoordeling van de aanvraag om een vergunning
      voor het bedrijfsmatig geven van gelegenheid tot het verrichten van seksuele handelingen met een derde tegen
      betaling gevolg wordt verbonden aan bepaalde onherroepelijke afdoeningen, is het eerste lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel13
  - number: 13a.1
    text: |-
      Ten behoeve van het nemen van een besluit tot oplegging van een bestuurlijke boete, worden desgevraagd aan het
      bestuursorgaan dat op grond van de in het tweede lid genoemde wetten belast is met het nemen van een dergelijk
      besluit, justitiële gegevens verstrekt die noodzakelijk zijn voor de beoordeling of sprake is van herhaalde
      overtreding van de voorschriften uit die wetten.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel13a
  - number: 13a.2
    text: 'De in het eerste lid bedoelde wetten zijn:'
