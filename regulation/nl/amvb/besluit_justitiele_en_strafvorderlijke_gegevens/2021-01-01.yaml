  - number: 11a.2
    text: |-
      Ten behoeve van het verstrekken van informatie aan de burgemeester ten behoeve van de handhaving van de
      openbare orde in verband met de terugkeer van de betrokkene in de maatschappij kan Onze Minister van de in het
      eerste lid bedoelde natuurlijke personen de justitiële gegevens, bedoeld in [artikel 6, eerste lid][ref1], en
      [artikel 7, eerste lid, onder a, b, c, d, f, j, k en l][ref2], verstrekken aan binnen een landelijke eenheid als
      bedoeld in [artikel 25, eerste lid, onderdeel b, van de Politiewet 2012][ref3] aangewezen opsporingsambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '6'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0016544
        artikel: '7'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '25'
  - number: 11a.3
    text: |-
      De justitiële gegevens worden niet eerder verstrekt dan drie maanden voor het moment van de verwachte, al dan niet
      tijdelijke, terugkeer van de betrokkene in de maatschappij.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel11a
  - number: 11a.4
    text: |-
      De burgemeester vernietigt de op grond van het eerste lid verstrekte justitiële gegevens uiterlijk negen maanden na
      de datum van de verstrekking, indien niet tot het treffen van maatregelen is besloten. Indien tot het treffen van
      maatregelen is besloten, verwijdert de burgemeester de op grond van het eerste lid verstrekte justitiële gegevens
      uiterlijk negen maanden na de datum van de verstrekking. De verwijderde gegevens worden gedurende een termijn van
      vijf jaar bewaard ten behoeve van het afleggen van verantwoording, waarna de gegevens worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel11a
  - number: 11a.5
    text: |-
      Het eerste lid, onder a en b, is niet van toepassing op personen op wie
      [Titel VIIIA van het Eerste Boek van het Wetboek van Strafrecht][ref1] is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: 11b.1
    text: |-
      Ten behoeve van de naleving van de [artikelen 3, tweede lid][ref1], [4, eerste en tweede lid][ref2], en
      [9, vierde lid, van de Wet politiegegevens][ref3] worden justitiële gegevens, bedoeld in de [artikelen 6][ref4]
      en [7, eerste lid, onder b, g, h, onderdeel 4°, i, j, onderdeel 3°, en k][ref5], verstrekt aan de
      verwerkingsverantwoordelijke, bedoeld in [artikel 1, onderdeel f, van de Wet politiegegevens][ref6] en in
      [artikel 1, onderdeel c, van het Besluit politiegegevens bijzondere opsporingsdiensten][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0016544#Artikel6
