      - id: ref2
        bwb_id: BWBR0016544
        artikel: '7'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '52'
    text: 'Dit besluit wordt aangehaald als: Besluit justitiële en strafvorderlijke gegevens.'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel52
