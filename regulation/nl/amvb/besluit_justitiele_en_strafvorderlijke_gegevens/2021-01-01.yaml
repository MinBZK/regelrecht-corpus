        bwb_id: BWBR0005537
        artikel: '1'
  - number: '13.2'
    text: Het eerste lid is van overeenkomstige toepassing op het bestuursorgaan dat beslist in administratief beroep.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel13
  - number: '13.3'
