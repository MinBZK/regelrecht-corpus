  - number: '48.1'
    text: |-
      Onze Minister neemt een aanvraag tot afgifte van een verklaring omtrent het gedrag eerst in behandeling nadat de
      bij ministeriële regeling vastgestelde vergoeding voor de kosten van deze behandeling is ontvangen.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel48
  - number: '48.2'
    text: |-
      Voor het verstrekken van justitiële gegevens, als bedoeld in [artikel 31][ref1], is een bij ministeriële regeling
      vastgestelde vergoeding verschuldigd.


