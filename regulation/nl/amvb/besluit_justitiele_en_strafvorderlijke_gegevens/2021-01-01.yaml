  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 20 februari 2004, nr. 5271210/04/6;

    Gelet op de artikelen 2, tweede en derde lid, 4, vijfde lid, 8, vierde en vijfde lid, 9, eerste lid, 13, eerste
    lid, 25, 36, 39 en 49 van de Wet justitiële gegevens;

    De Raad van State gehoord (advies van 24 maart 2004, nr. W03.04.0085/I);

    Gezien het nader rapport van Onze Minister van Justitie van 24 maart 2004, nr. 5278333/04/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet justitiële en strafvorderlijke gegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 1.b
    text: 'sepot: de beslissing van het openbaar ministerie tot niet vervolging of niet verdere vervolging van de zaak;'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1
  - number: 1.c
    text: |-
      centrale autoriteit: de centrale autoriteit, bedoeld in artikel 3, eerste lid, van het kaderbesluit 2009/315/JBZ
      van de Raad van de Europese Unie van 26 februari 2009 betreffende de organisatie en de inhoud van uitwisseling
      van gegevens uit het strafregister tussen de lidstaten (PbEU L 93/23). In Nederland is dit de Justitiële
      Informatiedienst;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1
  - number: 1.d
    text: 'lidstaat: lidstaat van de Europese Unie;'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1
  - number: 1.e
    text: |-
      strafrechtelijke procedure: de fase die aan het strafproces voorafgaat, het strafproces zelf en de
      tenuitvoerlegging van de veroordeling.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1
  - number: 1a
    text: |-
      Dit hoofdstuk is van toepassing op de verwerking van justitiële en strafvorderlijke gegevens, persoonsgegevens in
      persoonsdossiers, tenuitvoerleggingsgegevens en gerechtelijke strafgegevens.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1a
  - number: 1b.1
    text: |-
      De verwerkingsverantwoordelijke toetst en actualiseert de passende technische en organisatorische maatregelen die
      bij en krachtens de wet zijn getroffen.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1b
  - number: 1b.2
    text: |-
      Wanneer zulks in verhouding staat tot de verwerkingsactiviteiten omvatten de maatregelen, bedoeld in het eerste
      lid, de uitvoering van een passend gegevensbeschermingsbeleid door de verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1b
  - number: 1b.3
    text: 'De verwerkingsverantwoordelijke of de verwerker treft, na beoordeling van de risico’s, maatregelen om:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1b
  - number: 1b.3.a
    text: te verhinderen dat onbevoegden toegang krijgen tot apparatuur voor de verwerking van gegevens;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1b
  - number: 1b.3.b
    text: te verhinderen dat onbevoegden gegevensdragers lezen, kopiëren, wijzigen of verwijderen;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1b
  - number: 1b.3.c
    text: te verhinderen dat onbevoegden gegevens invoeren of opgeslagen gegevens inzien, wijzigen of verwijderen;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1b
  - number: 1b.3.d
    text: |-
      te verhinderen dat onbevoegden systemen voor geautomatiseerde gegevensverwerking gebruiken met behulp van
      datatransmissieapparatuur;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1b
  - number: 1b.3.e
    text: |-
      ervoor te zorgen dat personen die geautoriseerd zijn om een systeem voor geautomatiseerde gegevensverwerking te
      gebruiken, uitsluitend toegang hebben tot de gegevens waarop hun autorisatie betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1b
  - number: 1b.3.f
    text: |-
      ervoor te zorgen dat kan worden nagegaan en vastgesteld aan welke organen gegevens zijn of kunnen worden verstrekt
      of beschikbaar gesteld met behulp van datatransmissieapparatuur;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1b
  - number: 1b.3.g
    text: |-
      ervoor te zorgen dat later kan worden nagegaan en vastgesteld welke gegevens wanneer en door wie in een systeem
      voor geautomatiseerde gegevensverwerking zijn ingevoerd;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1b
  - number: 1b.3.h
    text: |-
      te verhinderen dat onbevoegden gegevens lezen, kopiëren, wijzigen of verwijderen tijdens de doorgifte van die
      gegevens of het vervoer van gegevensdragers;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1b
  - number: 1b.3.i
    text: ervoor te zorgen dat de geïnstalleerde systemen in geval van storing opnieuw kunnen worden ingezet;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1b
  - number: 1b.3.j
    text: |-
      ervoor te zorgen dat de functies van het systeem werken, dat eventuele functionele storingen worden gesignaleerd en
      dat opgeslagen gegevens niet kunnen worden beschadigd door het verkeerd functioneren van het systeem.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1b
  - number: 1c
    text: |-
      De inhoud van een overeenkomst of andere rechtshandeling die de verwerker aan een verwerkingsverantwoordelijke
      bindt, bevat het onderwerp en de duur van de verwerking, de aard en het doel van de verwerking, het soort
      gegevens waarop de wet van toepassing is, de categorieën van betrokkenen en de verplichtingen en de rechten van de
      verwerkingsverantwoordelijke, en met name wordt daarin bepaald dat de verwerker:
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1c
  - number: 1c.a
    text: uitsluitend volgens de instructies van de verwerkingsverantwoordelijke handelt;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1c
  - number: 1c.b
    text: |-
      er zorg voor draagt dat de tot het verwerken van gegevens gemachtigde personen zich ertoe hebben verplicht
      vertrouwelijkheid in acht te nemen of door een passende wettelijke verplichting daaraan gebonden zijn;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1c
  - number: 1c.c
    text: |-
      de verwerkingsverantwoordelijke met passende middelen bijstaat om naleving van de bepalingen betreffende de rechten
      van de betrokkene te verzekeren;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1c
  - number: 1c.d
    text: |-
      na afloop van de gegevensverwerkingsdiensten, naargelang de keuze van de verwerkingsverantwoordelijke, alle
      gegevens wist of hem deze ter beschikking stelt, en bestaande kopieën verwijdert, tenzij opslag van die gegevens
      verplicht is;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1c
  - number: 1c.e
    text: |-
      de verwerkingsverantwoordelijke alle informatie ter beschikking stelt die nodig is om nakoming van dit artikel aan
      te tonen;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1c
  - number: 1c.f
    text: |-
      aan de in dit artikel gestelde voorschriften voldoet bij de inschakeling van een andere verwerker en bij die
      inschakeling in overeenstemming met [artikel 7d, vierde lid, van de wet][ref1], handelt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel7d
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel1c
    references:
