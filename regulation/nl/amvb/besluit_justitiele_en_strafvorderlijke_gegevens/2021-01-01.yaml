        artikel: '1'
  - number: 11b.2
    text: |-
      De verwerkingsverantwoordelijke vernietigt de ontvangen justitiële gegevens terstond na het bereiken van het doel
      van de verstrekking.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel11b
  - number: 11c.1
    text: |-
      Ten behoeve van de verantwoordelijkheid, bedoeld in de [artikelen 2.1][ref1] en
      [2.4, tweede lid, van de Jeugdwet][ref2], kan Onze Minister aan een door het college van burgemeester en
      wethouders aangewezen ambtenaar of aan een door het college aangewezen en onder zijn verantwoordelijkheid
      werkzame functionaris justitiële gegevens als bedoeld in [artikel 6, eerste lid, onderdeel f][ref3], en
      [artikel 7, eerste lid, onder j, onderdelen 5 en 6][ref4], verstrekken van personen ten aanzien van wie in het
      kader van een strafrechtelijke beslissing is bepaald dat zij in aanmerking komen voor een vorm van jeugdhulp of
      jeugdreclassering, als bedoeld in [artikel 1.1 van de Jeugdwet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0016544#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0016544#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0016544
        artikel: '6'
