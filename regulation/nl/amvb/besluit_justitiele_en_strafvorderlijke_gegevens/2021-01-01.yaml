      - id: ref4
        bwb_id: BWBR0006368
        artikel: '3'
  - number: 11d.2
    text: Het bestuur vernietigt de ontvangen justitiële gegevens na het bereiken van het doel van de verstrekking.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel11d
  - number: '12.1'
    text: |-
      Justitiële gegevens als bedoeld in de [artikelen 10][ref1], [11][ref2] of [12 van de wet][ref3] worden desgevraagd
      verstrekt aan:


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel12
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel12
    references:
