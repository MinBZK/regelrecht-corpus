        artikel: '7'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 11c.2
    text: |-
      Het college van burgemeester en wethouders treft maatregelen opdat de op grond van het eerste lid verstrekte
      justitiële gegevens uiterlijk twaalf maanden na de beëindiging van de tenuitvoerlegging van de in het eerste lid
      bedoelde strafrechtelijke beslissing worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel11c
  - number: 11d.1
    text: |-
      Ten behoeve van de bevoegdheid, bedoeld in [artikel 43, derde lid, van de Wet op de rechtsbijstand][ref1],
      worden desgevraagd justitiële gegevens als bedoeld in de [artikelen 6, eerste lid, onder a, b en f][ref2],
      en [7, eerste lid, onder b en j, onderdelen 3° en 5°][ref3], verstrekt aan het bestuur, bedoeld in
      [artikel 3 van de Wet op de rechtsbijstand][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0016544#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0006368#Artikel3
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel11d
    references:
      - id: ref1
