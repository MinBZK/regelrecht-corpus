  - number: '23.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien op grond van een wettelijk voorschrift gedurende het
      dienstverband bij een ambtelijke dienst een onderzoek naar de betrouwbaarheid en geschiktheid van een persoon wordt
      gedaan.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel23
  - number: '24'
    text: 'Justitiële gegevens worden desgevraagd verstrekt aan Onze Minister ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel24
  - number: 24.a
    text: het nemen van de beslissingen over de betrouwbaarheid van buitengewone opsporingsambtenaren;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel24
  - number: 24.b
    text: |-
      het nemen van de beslissingen over de betrouwbaarheid van de opsporingsambtenaren van de bijzondere
      opsporingsdiensten, genoemd in [artikel 2 van de Wet op de bijzondere opsporingsdiensten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel2
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0019919
        artikel: '2'
  - number: 24.c
    text: |-
      het onderzoek naar de betrouwbaarheid en geschiktheid van personen die in aanmerking willen komen voor een functie
      bij de rechtsprekende macht of als rechterlijk ambtenaar bij het openbaar ministerie;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel24
  - number: 24.d
    text: |-
      het onderzoek of bezwaren bestaan tegen de vervulling van de functie als lid van een commissie van toezicht op de
      arrestantenzorg als bedoeld in [artikel 50, eerste lid, van het Besluit beheer politie](onbekend).
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel24
  - number: '25'
    text: |-
      Justitiële gegevens worden ten behoeve van de toelating tot de inrichting van personen, die niet worden ingesloten
      in de inrichting respectievelijk voorziening, voorzover dat noodzakelijk is voor de orde of de veiligheid van de
      inrichting of de voorziening desgevraagd verstrekt aan:
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel25
  - number: 25.a
    text: |-
      de directeur van een inrichting als bedoeld in [artikel 1, onder b, van de Penitentiaire beginselenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '1'
  - number: 25.b
    text: |-
      de directeur van een inrichting voor verpleging van ter beschikking gestelden als bedoeld in
      [artikel 1, onder b, van de Beginselenwet verpleging ter beschikking gestelden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '1'
  - number: 25.c
    text: |-
      de directeur van een voorziening als bedoeld in
      [artikel 4, eerste lid, van de Tijdelijke wet noodcapaciteit drugskoeriers][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013488#Artikel4
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0013488
        artikel: '4'
  - number: 25.d
    text: |-
      de directeur van een grenslogies als bedoeld in
      [artikel 2, aanhef, onder 1, van het Reglement regime grenslogies][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005848#Artikel2
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005848
        artikel: '2'
  - number: 25.e
    text: |-
      de directeur van een inrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '26.1'
    text: 'Justitiële gegevens worden desgevraagd verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel26
  - number: 26.1.a
    text: |-
      de directeur van het Nederlands Centraal Instituut voor Giraal Effectenverkeer BV ten behoeve van het onderzoek
      naar de betrouwbaarheid en de geschiktheid van personen die in aanmerking willen komen voor een dienstbetrekking
      bij deze rechtspersoon of bij het Nederlands Interprofessioneel Effectencentrum NIEC BV of die al een
      dienstbetrekking bij een van deze rechtspersonen vervullen, maar in aanmerking willen komen voor een andere
      dienstbetrekking bij een van deze rechtspersonen alsmede ten behoeve van het onderzoek naar de betrouwbaarheid en
      de geschiktheid van personen die bij de hiervoor genoemde rechtspersonen werkzaamheden gaan verrichten gedurende
      een zo lange periode dat hun positie kan worden gelijkgesteld met die van werknemers in dienstverband;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel26
  - number: 26.1.b
    text: |-
      de President van De Nederlandsche Bank N.V., ten behoeve van het onderzoek naar de betrouwbaarheid en de
      geschiktheid van personen die werkzaamheden gaan verrichten of verrichten bij deze rechtspersoon of bij de Europese
      Centrale Bank;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel26
  - number: 26.1.c
    text: |-
      de President van De Nederlandsche Bank N.V. ten behoeve van het onderzoek naar de betrouwbaarheid en de
      geschiktheid van personen die naar aanleiding van een overeenkomst met De Nederlandsche Bank N.V. worden belast met
      het vervoer van bankbiljetten, munten of halffabrikaten die worden gebruikt bij de vervaardiging van bankbiljetten
      of munten;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel26
  - number: 26.1.d
    text: |-
      de directeur van Joh. Enschedé Facilities BV ten behoeve van onderzoek naar de betrouwbaarheid en geschiktheid van
      personen die belast zijn met het produceren van bankbiljetten en waardepapieren;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel26
  - number: 26.1.e
    text: |-
      de voorzitter van de Autoriteit Financiële Markten ten behoeve van het onderzoek naar de betrouwbaarheid en de
      geschiktheid van personen die in aanmerking willen komen voor een dienstbetrekking bij dit bestuursorgaan of die
      reeds een dienstbetrekking vervullen bij dit bestuursorgaan, maar die in aanmerking willen komen voor een andere
      dienstbetrekking bij dit bestuursorgaan, alsmede ten behoeve van het onderzoek naar de betrouwbaarheid en de
      geschiktheid van personen die bij dit bestuursorgaan werkzaamheden gaan verrichten gedurende een zo lange periode
      dat hun positie kan worden gelijkgesteld met die van werknemers in dienstverband.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel26
  - number: '26.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met het oog op het nemen van beslissingen over het ontslag van
      personeel.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel26
  - number: '27.1'
    text: |-
      Justitiële gegevens worden ten behoeve van het onderzoek naar de betrouwbaarheid en de geschiktheid van personen
      die in aanmerking willen komen voor een dienstbetrekking bij de genoemde organisaties desgevraagd verstrekt aan:
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel27
  - number: 27.1.a
    text: het hoofd van de Dienst Bedrijfsbeveiliging van de Koninklijke Luchtvaartmaatschappij NV;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel27
  - number: 27.1.b
    text: de directeur van SAGEM Identification bv.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel27
  - number: '27.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met het oog op het nemen van beslissingen ten behoeve van het
      onderzoek naar de betrouwbaarheid en de geschiktheid van personen die bij de rechtspersonen, genoemd in het eerste
      lid, werkzaamheden gaan verrichten gedurende een zodanig lange periode dat hun positie kan worden gelijkgesteld
      met die van werknemers in dienstverband alsmede met het oog op het nemen van beslissingen over het ontslag van
      personeel.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel27
  - number: '28.1'
    text: |-
      Er worden geen verstrekkingen als bedoeld in de [artikelen 23 tot en met 27][ref1] gedaan dan nadat de persoon,
      instantie, dienst of organisatie die om de gegevens verzoekt een ondertekende verklaring van betrokkene heeft
      overgelegd waaruit blijkt dat hij toestemming voor de verstrekking geeft en op de hoogte is van de wijze waarop met
      de justitiële gegevens wordt omgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel23
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '28.2'
    text: |-
      De persoon, instantie, dienst, college of organisatie die overeenkomstig deze paragraaf justitiële gegevens heeft
      ontvangen doet van deze gegevens en de gevolgen die de persoon, instantie, dienst of organisatie voornemens is
      daaraan te verbinden schriftelijk mededeling aan de betrokkene en stelt hem in het geval bedenkingen van hem zijn
      te verwachten, in de gelegenheid zijn zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel28
  - number: '29.1'
    text: 'Justitiële gegevens worden desgevraagd verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel29
  - number: 29.1.a
    text: |-
      de voorzitter van de commissies die zijn belast met de selectie van personen die in aanmerking willen komen voor
      een functie bij de rechtsprekende macht of als rechterlijk ambtenaar bij het Openbaar Ministerie, ten behoeve van
      onderzoek naar de betrouwbaarheid en geschiktheid van die personen;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel29
  - number: 29.1.b
    text: |-
      de personen belast met het opmaken van een aanbeveling voor de vervulling van het ambt van Nationale ombudsman of
      substituut-ombudsman, ten behoeve van het opmaken van zodanige aanbeveling;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel29
  - number: 29.1.c
    text: |-
      de voorzitters van de kamers van toezicht ten behoeve van het onderzoek naar de betrouwbaarheid en de geschiktheid
      van personen die in aanmerking willen komen voor een benoeming tot notaris;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel29
  - number: 29.1.d
    text: |-
      de korpschef ten behoeve van zijn adviserende taak in het kader van de benoeming en de herbenoeming van de leden
      van de commissies van toezicht op de arrestantenzorg, bedoeld in [artikel 50, eerste lid, van het Besluit beheer
      politie](onbekend).
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel29
  - number: '29.2'
    text: |-
      [Artikel 28][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel28
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '30.1'
    text: 'Justitiële gegevens worden desgevraagd verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel30
  - number: 30.1.a
    text: |-
      de secretaris-generaal van het Ministerie van Veiligheid en Justitie ten behoeve van de voordracht die wordt gedaan
      met het oog op de benoeming van een minister of staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel30
  - number: 30.1.b
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties ten behoeve van de voordracht voor benoeming van de
      commissaris van de Koningin en de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel30
  - number: 30.1.c
    text: 'de commissaris van de Koningin ten behoeve van het dienen van advies:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel30
  - number: 30.1.c.1º
    text: inzake de benoeming van burgemeesters;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel30
  - number: 30.1.c.2º
    text: |-
      inzake de verlening van een koninklijke onderscheiding aan een burgemeester op grond van het Reglement op de orde
      van de Nederlandse Leeuw en de Orde van Oranje-Nassau;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel30
  - number: 30.1.c.3°
    text: |-
      inzake de verlening van het predikaat Koninklijk, de verlening van het recht tot het voeren van het Koninklijk
      Wapen met de toevoeging «Bij Koninklijke Beschikking Hofleverancier» alsmede de verlening van de Koninklijke
      Erepenning;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel30
  - number: 30.1.d
    text: 'de burgemeester ten behoeve van het dienen van advies:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel30
  - number: 30.1.d.1°
    text: |-
      inzake de verlening van een koninklijke onderscheiding op grond van het
      [Reglement op de Orde van de Nederlandse Leeuw en de Orde van Oranje-Nassau][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007391
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007391
  - number: 30.1.d.2°
    text: |-
      inzake de verlening van het predikaat Koninklijk, de verlening van het recht tot het voeren van het Koninklijk
      Wapen met de toevoeging «Bij Koninklijke Beschikking Hofleverancier» alsmede de verlening van de Koninklijke
      Erepenning;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel30
  - number: 30.1.e
    text: |-
      de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba ten behoeve van het dienen van
      advies inzake de benoeming van gezaghebbers;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel30
  - number: 30.1.f
    text: Onze Minister van Defensie met het oog op de toekenning van bij koninklijk besluit te verlenen onderscheidingen.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel30
  - number: '30.2'
    text: |-
      Met het oog op de adviserende bevoegdheid, bedoeld in het eerste lid, onder c, onder 2° en onder d, kunnen
      justitiële gegevens betreffende misdrijven tegen de zeden, bedoeld in [artikel 4 van de wet][ref1] worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel4
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '4'
  - number: '30.3'
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder b, onder c, onder 1°, en onder e, is [artikel 28][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel28
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '31.1'
    text: |-
      Justitiële gegevens, strafvorderlijke gegevens of tenuitvoerleggingsgegevens kunnen slechts worden verstrekt ten
      behoeve van beleidsinformatie, wetenschappelijk onderzoek en statistiek nadat aan de betrokken onderzoeker daartoe
      schriftelijk toestemming is verleend door Onze Minister van Justitie en Veiligheid onderscheidenlijk het College
      van procureurs-generaal.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel31
  - number: '31.2'
    text: |-
      Gerechtelijke strafgegevens kunnen slechts worden verstrekt ten behoeve van beleidsinformatie,
      wetenschappelijk onderzoek en statistiek nadat aan de betrokken onderzoeker daartoe schriftelijk
      toestemming is verleend door tussenkomst van het bestuur van een gerecht, bedoeld in
      [artikel 2 van de Wet op de rechterlijke organisatie][ref1], dat voor die gegevens verwerkingsverantwoordelijke is.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: '31.3'
    text: 'De toestemming, bedoeld in het eerste of tweede lid, wordt slechts gegeven indien:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel31
  - number: 31.3.a
    text: de beleidsinformatie of het onderzoek het algemeen belang dient;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel31
  - number: 31.3.b
    text: de organisatie die de gegevens verstrekt niet onnodig wordt belast;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel31
  - number: 31.3.c
    text: |-
      de beleidsinformatie zonder de betrokken gegevens onvolledig is of het onderzoek zonder de betrokken gegevens niet
      kan worden uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel31
  - number: 31.3.d
    text: de persoonlijke levenssfeer van de betreffende personen niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel31
  - number: '31.4'
    text: Aan de toestemming, bedoeld in het eerste of tweede lid, kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel31
  - number: '31.5'
    text: |-
      De toestemming, bedoeld in het eerste lid, wordt ter kennis gebracht van de betreffende
      verwerkingsverantwoordelijke en geldt als machtiging tot het verstrekken van de omschreven gegevens.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel31
  - number: '31.6'
    text: |-
      Benadering van personen over wie justitiële gegevens, strafvorderlijke gegevens, tenuitvoerleggingsgegevens of
      gerechtelijke strafgegevens worden verwerkt door de onderzoeker vindt niet plaats, tenzij dit uitdrukkelijk is
      toegestaan bij de toestemming ingevolge het eerste of tweede lid. Deze toestemming kan slechts worden verleend
      indien rechtstreekse benadering voor het doel van het onderzoek onvermijdelijk is.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel31
  - number: '32.1'
    text: |-
      Justitiële en strafvorderlijke gegevens kunnen door tussenkomst van de officier van justitie, en
      tenuitvoerleggingsgegevens kunnen door tussenkomst van Onze Minister van Justitie en Veiligheid daartoe aangewezen
      personen die onder hem ressorteren, desgevraagd worden doorgegeven aan de bevoegde autoriteit in een derde land
      of aan een internationale organisatie, onder de voorwaarde dat deze slechts kunnen worden verwerkt voor het doel
      waarvoor ze zijn doorgegeven.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel32
  - number: '32.2'
    text: |-
      Gerechtelijke strafgegevens kunnen desgevraagd door het bestuur van een gerecht, bedoeld in
      [artikel 2 van de Wet op de rechterlijke organisatie][ref1], dat voor die gegevens verwerkingsverantwoordelijke is,
      worden doorgegeven aan een bevoegde autoriteit van een derde land of aan een internationale organisatie, onder de
      voorwaarde dat deze slechts kunnen worden verwerkt voor het doel waarvoor ze zijn doorgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: '32.3'
    text: |-
      De gegevens worden verstrekt onder de voorwaarde dat deze door de ontvangende autoriteit worden vernietigd zodra
      de doeleinden zijn verwezenlijkt. Indien dit uit de wet voortvloeit kunnen bij de verstrekking termijnen worden
      gesteld, na afloop waarvan de verstrekte gegevens door de ontvangende autoriteit moeten worden vernietigd,
      behoudens wanneer verdere verwerking noodzakelijk is voor een lopend onderzoek, de vervolging van strafbare feiten
      of de tenuitvoerlegging van straffen.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel32
  - number: '33.1'
    text: |-
      Indien justitiële gegevens, strafvorderlijke gegevens of tenuitvoerleggingsgegevens zonder voorafgaand verzoek tot
      doorgifte worden ontvangen van een derde land of van een internationale organisatie, dan beoordeelt de ontvangende
      autoriteit in Nederland onmiddellijk of deze gegevens noodzakelijk zijn voor het doel waarvoor zij zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel33
  - number: '33.2'
    text: |-
      Indien krachtens het recht van het derde land specifieke beperkingen op de verwerking van de gegevens, bedoeld in
      het eerste lid, gelden, ziet de ontvangende autoriteit in Nederland erop toe dat die beperkingen in acht worden
      genomen, indien die beperkingen door de verstrekkende autoriteit zijn gemeld.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel33
  - number: '33.3'
    text: |-
      Indien gegevens als bedoeld in het eerste lid, worden ontvangen van een derde land of van een internationale
      organisatie, wordt de verstrekkende instantie desgevraagd geïnformeerd over de verwerking van de verstrekte
      gegevens en het daardoor behaalde resultaat.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel33
  - number: '34.1'
    text: |-
      Justitiële gegevens van natuurlijke personen, die betrekking hebben op een onherroepelijke veroordeling wegens
      een misdrijf waarbij een straf, al dan niet tezamen met een maatregel, is opgelegd en wegens overtredingen
      indien daarbij een vrijheidsstraf – anders dan een vervangende – of een taakstraf is opgelegd, worden onverwijld
      doorgezonden aan de centrale autoriteit van de lidstaat van nationaliteit van de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel34
  - number: '34.2'
    text: |-
      De centrale autoriteit zendt desgevraagd de centrale autoriteit die op grond van het eerste lid gegevens heeft
      ontvangen een afschrift van de veroordelingen, de daaropvolgende maatregelen en eventuele overige informatie ter
      zake.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel34
  - number: '35.1'
    text: |-
      Justitiële gegevens worden desgevraagd doorgezonden aan de centrale autoriteit van een andere lidstaat ten behoeve
      van een strafrechtelijke procedure.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel35
  - number: '35.2'
    text: |-
      Justitiële gegevens die betrekking hebben op een misdrijf bedoeld in de [artikelen 240b][ref1],
      [242 tot en met 250][ref2] en [273f van het Wetboek van Strafrecht][ref3], worden desgevraagd doorgezonden aan de
      centrale autoriteit van een andere lidstaat ten behoeve van een procedure die verband houdt met het aannemen van
      personeel voor activiteiten waarbij de betrokkene rechtstreeks en geregeld in aanraking komt met kinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel240b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel242
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel273f
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 240b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '242'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 273f
  - number: '35.3'
    text: |-
      Justitiële gegevens kunnen desgevraagd worden doorgezonden aan de centrale autoriteit van een andere lidstaat ten
      behoeve van andere doeleinden.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel35
  - number: '35.4'
    text: |-
      De centrale autoriteit onderzoekt de volledigheid van de bij een verzoek, bedoeld in het eerste, tweede en derde
      lid, doorgezonden informatie. Indien de bij het verzoek verstrekte informatie volledig is, worden de justitiële
      gegevens onverwijld maar in ieder geval binnen tien werkdagen na de dag waarop het verzoek is ontvangen,
      doorgezonden. Indien nadere informatie nodig is met het oog op vaststelling van de identiteit van de persoon op
      wie het verzoek betrekking heeft, wordt onverwijld overlegd met de centrale autoriteit die het verzoek heeft gedaan
      teneinde binnen tien werkdagen na de dag waarop de aanvullende informatie is verkregen, een antwoord te kunnen
      verzenden.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel35
  - number: '35.5'
    text: De beantwoording van het verzoek bedoeld in het eerste, tweede en derde lid, geschiedt langs geautomatiseerde weg.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel35
  - number: '35.6'
    text: |-
      Tot uiterlijk een jaar na de doorzending op grond van het eerste, tweede of derde lid stelt de centrale autoriteit
      onverwijld de centrale autoriteit die de gegevens heeft ontvangen in kennis van wijziging of schrapping van de
      doorgezonden gegevens.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel35
  - number: '36.1'
    text: |-
      Justitiële gegevens, strafvorderlijke gegevens, tenuitvoerleggingsgegevens en gerechtelijke strafgegevens kunnen
      door de verwerkingsverantwoordelijke desgevraagd worden doorgezonden aan een bevoegde autoriteit van een andere
      lidstaat, onder de voorwaarde dat deze slechts kunnen worden verwerkt voor het doel waarvoor ze zijn doorgezonden
      en, indien aanleiding bestaat tot het stellen van grenzen aan de verdere verwerking, binnen die grenzen.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel36
  - number: '36.2'
    text: |-
      Doorzending van strafvorderlijke gegevens kan uitsluitend met de tussenkomst van de officier van justitie, van
      tenuitvoerleggingsgegevens met tussenkomst van de door Onze Minister van Justitie en Veiligheid dan wel het College
      van procureurs-generaal daartoe aangewezen personen die onder hem ressorteren, en van gerechtelijke strafgegevens
      door het bestuur van een gerecht, bedoeld in [artikel 2 van de Wet op de rechterlijke organisatie][ref1], dat voor
      die gegevens verwerkingsverantwoordelijke is.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: '36.3'
    text: Justitiële gegevens kunnen tevens verder worden verwerkt voor de doelen, genoemd in het derde lid, onder c.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel36
  - number: '36.4'
    text: |-
      De gegevens, bedoeld in het eerste lid, worden doorgezonden onder de voorwaarde dat deze door de ontvangende
      autoriteit worden vernietigd zodra het doel, met het oog waarop de gegevens zijn doorgezonden, is vervuld.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel36
  - number: '36.5'
    text: |-
      Indien dit uit de wet voortvloeit kunnen bij de doorzending termijnen worden gesteld, na afloop waarvan de
      verstrekte gegevens door de ontvangende autoriteit moeten worden vernietigd, behoudens wanneer verdere verwerking
      noodzakelijk is voor een lopend onderzoek, de vervolging van strafbare feiten of de tenuitvoerlegging van straffen.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel36
  - number: '37'
    text: |-
      De van een centrale autoriteit van een andere lidstaat ontvangen gegevens die betrekking hebben op de
      onherroepelijke veroordeling wegens een strafbaar feit van een Nederlandse onderdaan en van de nadien met
      betrekking tot die veroordeling genomen maatregelen ten aanzien van die onderdaan, worden opgeslagen in de
      justitiële documentatie.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel37
  - number: '38.1'
    text: |-
      Indien justitiële gegevens, strafvorderlijke gegevens, tenuitvoerleggingsgegevens of gerechtelijke strafgegevens
      worden ontvangen van een andere lidstaat van de Europese Unie ten aanzien van de verwerking waarvan door de
      bevoegde autoriteit van die lidstaat op grond van het nationale recht specifieke voorwaarden zijn gesteld en de
      ontvangende autoriteit daarvan in kennis is gesteld, ziet de ontvangende autoriteit in Nederland toe op de naleving
      van die voorwaarden.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel38
  - number: '38.2'
    text: |-
      Gegevens, bedoeld in het eerste lid, die zijn ontvangen van een andere lidstaat, kunnen slechts worden verwerkt
      voor het doel waarvoor ze zijn verstrekt en binnen de door de verstrekkende lidstaat bepaalde grenzen. Tevens is
      verdere verwerking mogelijk voor de doelen, genoemd in [artikel 36, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel36
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '6'
        afdeling: '2'
  - number: '38.3'
    text: |-
      De op grond van het eerste lid ontvangen gegevens worden vernietigd zodra het doel, bedoeld in het eerste lid, is
      vervuld of, indien door de doorzendende lidstaat op grond van het nationale recht termijnen zijn gesteld na afloop
      waarvan de verstrekte gegevens moeten worden vernietigd, na afloop van de gestelde termijn. Alsdan ziet de centrale
      autoriteit in Nederland erop toe dat de gegevens daadwerkelijk worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel38
  - number: '38.4'
    text: |-
      Het derde lid is niet van toepassing op de gegevens die zijn ontvangen in het kader van een verzoek tot verkrijging
      van het Nederlanderschap op grond van de [Rijkswet op het Nederlanderschap][ref1], voor zover het Nederlanderschap
      wordt verleend aan de betrokkene. [Artikel 37][ref2] is van overeenkomstige toepassing op deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0003738
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel37
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003738
      - id: ref2
        bwb_id: BWBR0016544
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '6'
        afdeling: '2'
  - number: '38.4'
    text: |-
      [Artikel 33, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel33
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
  - number: '41.1'
    text: |-
      De doorzending van justitiële en strafvorderlijke gegevens aan Eurojust vindt plaats door tussenkomst van het
      nationale lid van Eurojust.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel41
  - number: '41.2'
    text: |-
      De doorzending van justitiële en strafvorderlijke gegevens aan Eurojust kan worden geweigerd indien wezenlijke
      nationale veiligheidsbelangen worden geschaad of de veiligheid van een persoon in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel41
  - number: '41.3'
    text: |-
      Justitiële en strafvorderlijke gegevens worden doorgezonden aan het nationale lid van Eurojust, voor zover hij deze
      behoeft in verband met de uit een rechtsinstrument op grond van het Verdrag betreffende de werking van de Europese
      Unie voortkomende doelstelling en taken van deze organisatie. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel41
  - number: '42.1'
    text: |-
      De doorzending van justitiële en strafvorderlijke gegevens aan Europol vindt plaats door tussenkomst van een
      landelijke eenheid als bedoeld in [artikel 25, eerste lid, onder b, van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
  - number: '42.2'
    text: 'De doorzending van gegevens aan Europol kan worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel42
  - number: 42.2.a
    text: wezenlijke nationale veiligheidsbelangen worden geschaad,
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel42
  - number: 42.2.b
    text: het welslagen van lopende onderzoeken of de veiligheid van personen in gevaar wordt gebracht, of
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel42
  - number: 42.2.c
    text: |-
      informatie wordt bekend gemaakt die betrekking heeft op specifieke inlichtingendiensten of -activiteiten op het
      gebied van de staatsveiligheid.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel42
  - number: '42.3'
    text: |-
      Justitiële en strafvorderlijke gegevens worden doorgezonden aan de nationale verbindingsofficieren bij Europol,
      voor zover zij deze behoeven in verband met de uit een rechtsinstrument op grond van het Verdrag betreffende
      de werking van de Europese Unie voortkomende doelstelling en taken van deze organisatie. Het tweede lid is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel42
  - number: '43.1'
    text: |-
      De personen, instanties of colleges, bedoeld in [artikel 8, eerste en tweede lid van de wet][ref1] en in
      [hoofdstuk 3][ref2], aan wie justitiële gegevens worden verstrekt kunnen onder hen ressorterend personeel
      machtigen tot het doen van een verzoek om justitiële gegevens. In dat geval wordt de machtiging in het verzoek om
      inlichtingen vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0016544
        hoofdstuk: '3'
  - number: '43.2'
    text: |-
      In de gevallen waarin op grond van dit besluit de burgemeester bevoegd is om justitiële gegevens te vragen, kan
      hij de politiechef wiens regionale eenheid de politietaak uitvoert in het gebied waarin de gemeente is gelegen,
      machtigen tot het doen van een verzoek om de betreffende gegevens.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel43
  - number: '44'
    text: |-
      Onze Minister kan bij zijn onderzoek met betrekking tot de afgifte van de verklaring omtrent het gedrag kennis
      nemen van de justitiële gegevens betreffende misdrijven tegen de zeden, bedoeld in [artikel 4 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel4
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '4'
  - number: '45.1'
    text: |-
      Onze Minister neemt bij zijn onderzoek als bedoeld in [artikel 36 van de wet][ref1]
      in het kader van de beoordeling van de eis van betrouwbaarheid, bedoeld in
      [artikel 18, eerste lid, van het Besluit goederenvervoer over de weg][ref2] en [artikel 22, eerste lid][ref3],
      [23, eerste lid][ref4], en [30, vierde lid][ref5], [76.1 van het Besluit personenvervoer 2000][ref6] uitsluitend
      kennis van de gegevens bedoeld in de [artikelen 10][ref7], [11][ref8] en [12 van de Wet][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0011982#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0011982#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0011982#Artikel30
      [ref6]: https://wetten.overheid.nl/BWBR0011982#Artikel76
      [ref7]: https://wetten.overheid.nl/BWBR0014194#Artikel10
      [ref8]: https://wetten.overheid.nl/BWBR0014194#Artikel11
      [ref9]: https://wetten.overheid.nl/BWBR0014194#Artikel12
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0005496
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0011982
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0011982
        artikel: '23'
      - id: ref5
        bwb_id: BWBR0011982
        artikel: '30'
      - id: ref6
        bwb_id: BWBR0011982
        artikel: '76'
      - id: ref7
        bwb_id: BWBR0014194
        artikel: '10'
      - id: ref8
        bwb_id: BWBR0014194
        artikel: '11'
      - id: ref9
        bwb_id: BWBR0014194
        artikel: '12'
  - number: '45.2'
    text: |-
      Het eerste lid is niet van toepassing op de beoordeling van de afgifte van de verklaring omtrent het gedrag in het
      kader van de beoordeling van de eis van betrouwbaarheid van de vervoerder of bestuurder van één of meer taxi's.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel45
  - number: '46'
    text: 'De rapporten die het persoonsdossier vormen zijn afkomstig van:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel46
  - number: 46.a
    text: |-
      een reclasseringsinstelling als bedoeld in [artikel 4 van de Reclasseringsregeling 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel4
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '4'
  - number: 46.b
    text: de raad voor de kinderbescherming;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel46
  - number: 46.c
    text: |-
      een gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1] bij de uitvoering van
      reclassering;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 46.d
    text: |-
      een penitentiaire inrichting als bedoeld in [artikel 1, onder b, van de Penitentiaire beginselenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '1'
  - number: 46.e
    text: |-
      een instelling als bedoeld in [artikel 1, onder b, van de Beginselenwet verpleging ter beschikking gestelden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '1'
  - number: 46.f
    text: |-
      een inrichting als bedoeld in [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: 46.g
    text: Onze Minister.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel46
  - number: '47'
    text: 'Afschriften van rapporten uit een persoonsdossier worden verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel47
  - number: 47.a
    text: |-
      de directeur van een gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1] ten behoeve
      van het verlenen van hulp en steun aan jeugdigen die worden verdacht van of zijn veroordeeld wegens een
      strafbaar feit of ten aanzien van wie op grond van bepalingen in het [Wetboek van Strafrecht][ref2] en het
      [Wetboek van Strafvordering][ref3] voorwaarden zijn gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001854
      [ref3]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001854
      - id: ref3
        bwb_id: BWBR0001903
  - number: 47.b
    text: |-
      Onze Minister ten behoeve van het voorbereiden van enig rapport met het oog op een juiste toepassing van het
      strafrecht;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel47
  - number: 47.c
    text: |-
      een zorgaanbieder als bedoeld in [artikel 1.1, onder o, van de Wet forensische zorg][ref1] ten behoeve van de te
      verlenen forensische zorg;


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '1'
  - number: 47.d
    text: |-
      de commissie als bedoeld in [artikel 37a, negende lid, van het Wetboek van Strafrecht][ref1] ten behoeve van
      het uitbrengen van advies over de aanwezigheid en bruikbaarheid van persoonsgegevens betreffende een mogelijke
      gebrekkige ontwikkeling of ziekelijke stoornis van de geestvermogens van een weigerende observandus als bedoeld in
      artikel 37a, vijfde lid, van het Wetboek van Strafrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
  - number: 47a
    text: |-
      De [artikelen 32, eerste lid][ref1], [33][ref2], [35][ref3], [36, eerste, vierde en vijfde lid][ref4], en
      [38, eerste lid, eerste volzin en tweede tot en met vierde lid][ref5], zijn van overeenkomstige toepassing op de
      verstrekking van persoonsgegevens die in een persoonsdossier zijn verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0016544#Artikel35
