        bwb_id: BWBR0015703
  - number: 13a.3
    text: |-
      Het bestuursorgaan, dat op grond van het eerste lid justitiële gegevens ontvangt, kan deze gegevens verder
      verstrekken aan andere bestuursorganen die belast zijn met het nemen van een besluit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel13a
  - number: '14'
    text: |-
      Justitiële gegevens worden desgevraagd verstrekt aan het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst
      en het hoofd van de Militaire Inlichtingen- en Veiligheidsdienst ten behoeve van de taakvervulling van deze
      diensten.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel14
  - number: '15.1'
    text: 'Justitiële gegevens worden desgevraagd verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel15
  - number: 15.1.a
    text: |-
      het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], ten behoeve van de
      uitoefening van zijn wettelijk omschreven taak;


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
  - number: 15.1.b
    text: |-
      bestuursorganen en rechtspersonen met een overheidstaak als bedoeld in
      [artikel 1, eerste lid, van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], voor
      zover dat noodzakelijk is in de gevallen waarin zij bevoegd zijn tot toepassing van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '1'
  - number: '15.2'
    text: 'De krachtens het eerste lid, onder b, verstrekte justitiële gegevens betreffen:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel15
  - number: 15.2.a
    text: |-
      de betrokkene, bedoeld in
      [artikel 1, eerste lid, van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '1'
  - number: 15.2.b
    text: degene die direct of indirect leiding geeft of heeft gegeven aan betrokkene;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel15
  - number: 15.2.c
    text: degene die direct of indirect zeggenschap heeft of heeft gehad over betrokkene;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel15
  - number: 15.2.d
    text: degene die direct of indirect vermogen verschaft of heeft verschaft aan betrokkene;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel15
  - number: 15.2.e
    text: |-
      degene die als leidinggevende, beheerder, bedrijfsleider of vervoersmanager is of zal worden vermeld op de
      beschikking die is aangevraagd of is gegeven;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel15
  - number: 15.2.f
    text: |-
      degene die redelijkerwijs met betrokkene gelijk kan worden gesteld op grond van zijn feitelijke invloed op de
      betrokkene.
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel15
  - number: 15a.1
    text: |-
      Justitiële gegevens worden desgevraagd verstrekt aan bestuursorganen, ten behoeve van het nemen van een beslissing
      omtrent de toepassing van [artikel 6 van de Tijdelijke wet bestuurlijke maatregelen terrorismebestrijding][ref1],
      uitsluitend voor zover het betreft gegevens omtrent de aanvrager, subsidieontvanger of houder van een vergunning,
      ontheffing of erkenning als bedoeld in artikel 6, onderdeel a, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0039210#Artikel6
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0039210
        artikel: '6'
  - number: 15a.2
    text: |-
      Indien deze aanvrager, subsidieontvanger of houder een rechtspersoon is, betreffen de gegevens zowel
      de rechtspersoon als de bestuurders, alsmede de gegevens met betrekking tot strafbare feiten waaraan
      [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref1] ten grondslag heeft gelegen. Indien een
      bestuurder een rechtspersoon is betreffen de gegevens eveneens deze rechtspersoon, alsmede de bestuurders daarvan.
      Indien de aanvrager, subsidieontvanger of houder een maatschap of vennootschap onder firma is betreffen de gegevens
      de maten, dan wel de vennoten, uitgezonderd de gegevens betreffende de vennoot en commandite, alsmede de gegevens
      met betrekking tot strafbare feiten waaraan artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht ten
      grondslag heeft gelegen. Indien de vennoten of maten rechtspersoonlijkheid bezitten betreffen de gegevens deze
      rechtspersonen, alsmede de bestuurders daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '51'
  - number: '16'
    text: 'Justitiële gegevens worden desgevraagd verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel16
  - number: 16.a
    text: |-
      Onze Minister ten behoeve van de controle van rechtspersonen met het oog op de voorkoming en
      bestrijding van misbruik van rechtspersonen, waaronder het plegen van misdrijven en overtredingen
      van financieel-economische aard door of door middel van deze rechtspersonen, bedoeld in
      [artikel 2, eerste lid, van de Wet controle op rechtspersonen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel2
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0015049
        artikel: '2'
  - number: 16.b
    text: |-
      Onze Minister en de burgemeesters voorzover dit noodzakelijk is in het kader van de beoordeling van een verzoek tot
      verkrijging van het Nederlanderschap op grond van de [Rijkswet op het Nederlanderschap][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: 16.c
    text: |-
      Onze Minister voorzover dit noodzakelijk is voor het verwerken van deze gegevens in het Cliënt-Volgsysteem
      Jeugdcriminaliteit;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel16
  - number: 16.d
    text: |-
      Onze Minister en aan de korpschef voorzover dit noodzakelijk is voor de uitvoering van de
      [Wet wapens en munitie][ref1], de [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref2] en van
      [hoofdstuk 3 van de Wet natuurbescherming][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008804
      [ref2]: https://wetten.overheid.nl/BWBR0008973
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008804
      - id: ref2
        bwb_id: BWBR0008973
      - id: ref3
        bwb_id: BWBR0037552
        hoofdstuk: '3'
  - number: 16.e
    text: |-
      Onze Minister van Defensie en het hoofd van het onderdeel van de Belastingdienst, de Centrale dienst voor in- en
      uitvoer, voor zover dit noodzakelijk is voor de uitvoering van de [Wet wapens en munitie][ref1] en andere in dat
      kader relevante regelgeving;


      [ref1]: https://wetten.overheid.nl/BWBR0008804
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008804
  - number: 16.f
    text: |-
      Onze Minister ten behoeve van het nemen van een beslissing omtrent de toepassing van de
      [artikelen 2 tot en met 4 van de Tijdelijke wet bestuurlijke maatregelen terrorismebestrijding][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039210#Artikel2
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0039210
        artikel: '2'
  - number: '17.1'
    text: |-
      Justitiële gegevens worden voorzover dit noodzakelijk is voor de uitoefening van hun taken desgevraagd verstrekt
      aan:
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel17
  - number: 17.1.a
    text: |-
      de directeur van de stichting en de reclasseringsinstelling, bedoeld in
      [artikel 1, onder b en c, van de Reclasseringsregeling 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '1'
  - number: 17.1.b
    text: |-
      de reclasseringswerkers, bedoeld in [artikel 6, eerste lid, van de Reclasseringsregeling 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel6
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '6'
  - number: 17.1.c
    text: |-
      de medewerkers van de gecertificeerde instelling, bedoeld in [artikel 1.1 van de Jeugdwet][ref1], die zijn belast
      met de uitvoering van de jeugdreclassering;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 17.1.d
    text: de directeur of ressortsdirecteur van de raad voor de kinderbescherming;
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel17
  - number: 17.1.e
    text: |-
      de gedragsdeskundigen die zijn belast met de opstelling van rapporten of adviezen als bedoeld in de
      [artikelen 37, tweede en derde lid][ref1] en [37a, derde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 37a
  - number: '17.2'
    text: |-
      De in het eerste lid bedoelde personen kunnen tevens kennis nemen van de justitiële gegevens betreffende misdrijven
      tegen de zeden, bedoeld in [artikel 4 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel4
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '4'
  - number: '17.3'
    text: |-
      Justitiële gegevens worden voor zover dit nodig is voor de uitvoering van de [Wet forensische zorg][ref1] verstrekt
      aan zorgaanbieders die forensische zorg verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0040634
    url: https://wetten.overheid.nl/BWBR0016544/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0040634
  - number: '18'
    text: |-
      Justitiële gegevens worden desgevraagd verstrekt aan de directeuren van de
      inrichtingen, bedoeld in [artikel 1, onder b, van de Penitentiaire beginselenwet][ref1],
      [artikel 1, onder b, van de Beginselenwet verpleging ter beschikking gestelden][ref2] en
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref3], voorzover zij deze behoeven:


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
