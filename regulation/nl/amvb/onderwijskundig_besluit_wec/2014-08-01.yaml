  - number: 1.c
    text: |-
      *een samenwerkingsschool:* de stichting, bedoeld in [artikel 28j van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28j
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel1
