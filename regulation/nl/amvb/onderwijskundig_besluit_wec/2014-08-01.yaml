    text: |-
      In dit besluit wordt verstaan onder: wet: [Wet op de expertisecentra][ref1]; *Onze Minister:* Onze
      Minister van Onderwijs, Cultuur en Wetenschappen; school: een school voor speciaal onderwijs, voor
      voortgezet speciaal onderwijs of voor speciaal en voortgezet speciaal onderwijs als bedoeld in
      [artikel 2, tweede lid, onder f, g, h, j, k, m of n, van de wet][ref2], dan wel een instelling voor speciaal en
      voortgezet speciaal onderwijs als bedoeld in [artikel 8, eerste lid, tweede of derde volzin, van de wet][ref3],
      tenzij het tegendeel blijkt; instelling: instelling als bedoeld in
      [artikel 8, eerste lid, tweede of derde volzin, van de wet][ref4]; *bevoegd gezag* voor wat betreft:


