  - number: '2.1'
    text: |-
      Aan een school voor speciaal onderwijs en voor speciaal en voortgezet speciaal onderwijs waar onderwijs wordt
      gegeven als bedoeld in [artikel 2, tweede lid onderdeel a tot en met c, f, en h ][ref1] tot en met m van de wet,
      kan een afdeling worden verbonden voor speciaal onderwijs aan meervoudig gehandicapte kinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0003848#Artikel2
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003848
        artikel: '2'
  - number: '2.2'
    text: De afdeling bedoeld in het eerste lid, is bestemd voor kinderen met eenzelfde meervoudige handicap.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel2
  - number: '2.3'
    text: Onze Minister geeft voorschriften voor de toelating tot een afdeling als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel2
  - number: '4.1'
    text: |-
      Voor een leerling in het speciaal onderwijs bevat het ontwikkelingsperspectief, bedoeld in
      [artikel 41a van de wet][ref1], ten minste informatie over naar welk uitstroomprofiel van het voortgezet speciaal
      onderwijs, bedoeld in [artikel 14, eerste lid, van de wet][ref2], uitstroom van de leerling wordt verwacht dan wel
      of uitstroom naar het reguliere voortgezet onderwijs wordt verwacht, en de onderbouwing daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 41a
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '14'
  - number: '4.2'
    text: |-
      De onderbouwing bevat ten minste een weergave van de belemmerende en bevorderende factoren die van invloed zijn op
      het onderwijs aan de leerling.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel4
  - number: '5.1'
    text: |-
      Voor een leerling in het voortgezet speciaal onderwijs bevat het ontwikkelingsperspectief, bedoeld in
      [artikel 41a van de wet][ref1], ten minste informatie over naar welk vervolgonderwijs, naar welke soort arbeid of
      naar welke vorm van dagbesteding uitstroom van de leerling wordt verwacht, en de onderbouwing daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41a
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 41a
  - number: '5.2'
    text: |-
      De onderbouwing bevat ten minste een weergave van de belemmerende en bevorderende factoren die van invloed zijn op
      het onderwijs aan de leerling.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel5
  - number: '6'
    text: Een stage wordt doorlopen op een of meer stageplaatsen, ter beschikking gesteld door een of meer stagegevers.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel6
  - number: '7'
    text: |-
      Indien het onderwijs een stage omvat, worden het doel, de inhoud, de omvang, de opbouw en de organisatie van de
      stage beschreven in een stageplan.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel7
  - number: '8.1'
    text: |-
      De duur van de stage bedraagt gedurende de cursusduur gemiddeld ten hoogste 50% van het aantal uren waarin
      onderwijs wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel8
  - number: '8.2'
    text: |-
      Ten behoeve van het voorzien in of de voltooiing van een stage kan de inspecteur op verzoek van het bevoegd gezag
      ontheffing verlenen van het bepaalde in het eerste lid. Hij kan daarbij voorschriften geven.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel8
  - number: '9.1'
    text: |-
      Het bevoegd gezag sluit met de leerling of diens wettelijke vertegenwoordiger en de stagegever te zamen een
      schriftelijke stage-overeenkomst waaruit blijkt dat de leerling leeractiviteiten ontplooit in het kader van het
      stageplan.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel9
  - number: '9.2'
    text: 'De stage-overeenkomst bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel9
  - number: 9.2.a
    text: de leeractiviteiten die de leerling moet ontplooien en de werkzaamheden die hij bij de stagegever moet verrichten;
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel9
  - number: 9.2.b
    text: de aanvangsdatum, de einddatum en de tijden van de stage;
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel9
  - number: 9.2.c
    text: |-
      een regeling voor de begeleiding van de leerling bij de stagegever waarin in elk geval duidelijk wordt gemaakt welk
      aandeel in de begeleiding door de stageleraar van de school waarop de leerling is ingeschreven, alsmede door de
      stagebegeleider, aan te wijzen door of namens het bevoegd gezag onderscheidenlijk de stagegever, wordt verzorgd;
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel9
  - number: 9.2.d
    text: de wijze waarop de stagegever bij de beoordeling van de leeractiviteiten van de leerling wordt betrokken;
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel9
  - number: 9.2.e
    text: |-
      een regeling die de inspecteur in staat stelt zich op de hoogte te stellen van de leeractiviteiten die de leerling
      bij de stagegever ontplooit.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel9
  - number: '9.3'
    text: |-
      Indien het bevoegd gezag de stagegever is, wordt de stage-overeenkomst enkel gesloten tussen het bevoegd gezag en
      de leerling of diens wettelijke vertegenwoordiger, en is het tweede lid daarop van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel9
  - number: '10'
    text: |-
      Het bevoegd gezag draagt zorg dat de leerling gedurende de stage en gedurende de reis van de school naar het
      terrein van de stagegever en omgekeerd, alsmede de stageleraar gedurende de tijd dat hij zich bevindt op het
      terrein van de stagegever, zijn verzekerd tegen het risico van ongevallen en wettelijke aansprakelijkheid. Van de
      verplichting bedoeld in de vorige volzin, kan Onze Minister op verzoek van het bevoegd gezag ontheffing verlenen,
      indien het godsdienstige of levensbeschouwelijke bezwaren heeft tegen verzekering. Onze Minister verleent de
      ontheffing slechts indien het bevoegd gezag aantoont dat een afdoende andere voorziening is getroffen waaruit de
      gevolgen van een ongeval of van aansprakelijkheid in geval van schade aan derden kunnen worden gedekt.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel10
  - number: '12.1'
    text: |-
      Voor symbiose is vereist dat tussen het bevoegd gezag van een school en het bevoegd gezag van een andere school,
      een basisschool, een speciale school voor basisonderwijs, een school voor voortgezet onderwijs of een instelling
      voor educatie en beroepsonderwijs een schriftelijke overeenkomst inzake de uitvoering daarvan wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel12
  - number: '12.2'
    text: 'De overeenkomst bedoeld in het eerste lid bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel12
  - number: 12.2.a
    text: de termijn waarvoor de overeenkomst is aangegaan;
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel12
  - number: 12.2.b
    text: |-
      de vakken waarin de leerling, dan wel de leerlingen van de school onderwijs zullen ontvangen op de andere school,
      de basisschool, de speciale school voor basisonderwijs, de school voor voortgezet onderwijs of de instelling voor
      educatie en beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel12
  - number: 12.2.c
    text: het aantal lesuren per week dat per vak als bedoeld in onderdeel b, ten minste zal kunnen worden geboden;
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel12
  - number: 12.2.d
    text: |-
      de afspraken welke worden gemaakt inzake de aanwezigheid bij de lessen van een leraar van de school en inzake
      andere begeleiding van de leerling vanuit de school;
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel12
  - number: 12.2.e
    text: |-
      of en zo ja, welk bedrag voor door de leerling, dan wel de leerlingen van de school verbruikte materialen jaarlijks
      aan het bevoegd gezag van de andere school, de basisschool, de speciale school voor basisonderwijs, de school voor
      voortgezet onderwijs of de instelling voor educatie en beroepsonderwijs zal worden betaald;
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel12
  - number: 12.2.f
    text: |-
      of en zo ja, welk bedrag voor het gebruik van de lokalen van de andere school, de basisschool, de speciale school
      voor basisonderwijs, de school voor voortgezet onderwijs of de instelling voor educatie en beroepsonderwijs
      jaarlijks aan het bevoegd gezag van die school of inrichting zal worden betaald.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel12
  - number: '12.3'
    text: |-
      Voor symbiose binnen hetzelfde bevoegd gezag is vereist dat het bevoegd gezag inzake de uitvoering daarvan de
      onderwerpen, bedoeld in het tweede lid, op overeenkomstige wijze regelt, met het oog op een termijn van ten minste
      twee aaneengesloten schooljaren.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel12
  - number: '13'
    text: |-
      Het bevoegd gezag kan, in het kader van [artikel 14b van de wet][ref1], leerlingen van 16 jaar en ouder in de
      gelegenheid stellen deel te nemen aan een examen van een opleiding voortgezet algemeen volwassenenonderwijs.
      Wat betreft leerlingen van 18 jaar en ouder, kan de eerste volzin enkel worden toegepast voor leerlingen die
      ononderbroken in het voortgezet speciaal onderwijs ingeschreven zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14b
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 14b
  - number: '14.1'
    text: |-
      Voor afwijkingen als bedoeld in [artikel 14c, negende lid, eerste volzin][ref1], onderscheidenlijk in
      [artikel 14f, achtste lid, eerste volzin, van de wet][ref2] kunnen in aanmerking komen leerlingen die naar het
      oordeel van het bevoegd gezag niet in staat zijn al het onderwijs dat wordt verzorgd op basis van de kerndoelen
      te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14c
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14f
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 14c
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 14f
  - number: '14.2'
    text: |-
      De commissie voor de begeleiding, bedoeld in [artikel 40b van de wet][ref1], dan wel de commissie
      van onderzoek, bedoeld in [artikel 41 van de wet][ref2], adviseert het bevoegd gezag ten
      aanzien van welke leerlingen [artikel 14c, negende lid, eerste volzin][ref3], onderscheidenlijk
      [artikel 14f, achtste lid, eerste volzin, van de wet][ref4] toepassing kan vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel14c
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel14f
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 40b
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '41'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 14c
      - id: ref4
        bwb_id: BWBR0003549
        artikel: 14f
  - number: '14.3'
    text: |-
      In haar advies doet de commissie aan het bevoegd gezag voorstellen ten aanzien van de aard van de in het tweede lid
      bedoelde afwijkingen. Daarbij geeft zij aan waarop deze voorstellen zijn gegrond.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel14
  - number: '14.4'
    text: 'De commissie betrekt in elk geval bij haar oordeelsvorming:'
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel14
  - number: 14.4.a
    text: |-
      in voorkomende gevallen het onderwijskundig rapport, bedoeld in [artikel 43 van de wet][ref1], dan wel in
      [artikel 42 van de Wet op het primair onderwijs][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel42
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '42'
  - number: 14.4.b
    text: |-
      het ontwikkelingsperspectief, bedoeld in [artikel 41a van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41a
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 41a
  - number: 14.4.c
    text: de zienswijze van de ouders van de leerlingen, welke zienswijze blijkt uit een schriftelijke verklaring;
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel14
  - number: 14.4.d
    text: |-
      de zienswijze van de leraar of leraren, belast met het betrokken onderwijs, welke zienswijze blijkt uit een
      schriftelijke verklaring.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel14
  - number: '14.5'
    text: |-
      Het advies wordt schriftelijk uitgebracht aan het bevoegd gezag. Indien het bevoegd gezag voornemens is af
      te wijken van het advies van de commissie, overlegt het over dit voornemen met de commissie. De beslissing
      van het bevoegd gezag is met redenen omkleed. Het bevoegd gezag zendt een afschrift van zijn beslissing,
      vergezeld van het advies van de commissie en de daarbij gevoegde verklaringen, bedoeld in het vierde lid,
      aan de ouders van de betrokken leerlingen, aan de betrokken leraar of leraren en aan de inspectie, bedoeld in
      [artikel 1 van de Wet op het onderwijstoezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel1
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '1'
  - number: '27.1'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst en werkt terug tot en met 1 augustus 1985.
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel27
  - number: '27.2'
    text: Dit besluit kan worden aangehaald als "Onderwijskundig besluit WEC".
    url: https://wetten.overheid.nl/BWBR0003848/2014-08-01#Artikel27
