    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen, drs. G. van Leijenhorst, van 18 juli 1985,
    nr. 6400/2271B, centrale directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 9, derde lid, 16, eerste lid, 19a, eerste lid, 33 , tweede en derde lid, en 111, derde,
    vierde en zesde lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs ( Stb. 1984,
    654);

    Gehoord de Onderwijsraad (advies van 6 februari 1985, nr. O.R. III/100189LO);

    De Raad van State gehoord (advies van 23 augustus 1985, nr. W05.85.0412/12.5.34);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, drs. G. van Leijenhorst, van 16
    september 1985, nr. 6713/2271B, centrale directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
