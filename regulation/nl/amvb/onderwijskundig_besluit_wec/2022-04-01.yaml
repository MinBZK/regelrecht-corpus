preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen, drs. G. van Leijenhorst, van 18 juli 1985,
    nr. 6400/2271B, centrale directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 9, derde lid, 16, eerste lid, 19a, eerste lid, 33 , tweede en derde lid, en 111, derde,
    vierde en zesde lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs ( Stb. 1984,
    654);

    Gehoord de Onderwijsraad (advies van 6 februari 1985, nr. O.R. III/100189LO);

    De Raad van State gehoord (advies van 23 augustus 1985, nr. W05.85.0412/12.5.34);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, drs. G. van Leijenhorst, van 16
    september 1985, nr. 6713/2271B, centrale directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003848/2022-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *afdeling:* afdeling als bedoeld in
      [artikel 8, tweede lid, van de wet][ref1], tenzij het tegendeel blijkt;
        - *bevoegd gezag* voor wat betreft: a. een openbare school: 1°. het college van burgemeester en wethouders,
      voor zover de raad niet anders bepaalt, en, indien de raad dit besluit, met inachtneming van door hem te
      stellen regelen; 2°. het krachtens de desbetreffende gemeenschappelijke regeling bevoegde orgaan; 3°. de
      openbare rechtspersoon, bedoeld in [artikel 50 van de wet][ref2]; dan wel 4°. de stichting, bedoeld in
      [artikel 28][ref3] of [artikel 51 van de wet][ref4]; b. een bijzondere school: de rechtspersoon, bedoeld in
      [artikel 57 van de wet][ref5]; c. een samenwerkingsschool: de stichting, bedoeld in [artikel 28j van de wet][ref6];
        - *instelling:* instelling als bedoeld in [artikel 8, eerste lid, tweede of derde volzin, van de wet][ref7];
        - *meervoudig gehandicapte kinderen:* kinderen met combinaties van handicaps als bedoeld in
      [artikel 2, vijfde lid, van de wet][ref8];
        - *Onze Minister:* Onze Minister voor Basis- en Voortgezet Onderwijs en Media;
        - *ouders:* ouders, voogden of verzorgers;
        - *samenwerkingsverband:* samenwerkingsverband als bedoeld in [artikel 28a van de wet][ref9];
        - *school:* een school voor speciaal onderwijs, voor voortgezet speciaal onderwijs of voor speciaal en voortgezet
      speciaal onderwijs als bedoeld in [artikel 2, tweede lid, onder f, g, h, j, k, m of n, van de wet][ref10],
      dan wel een instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in
      [artikel 8, eerste lid, tweede of derde volzin, van de wet][ref11], tenzij het tegendeel blijkt;
        - *schooljaar:* het tijdvak van 1 augustus tot en met 31 juli daaraanvolgend;
        - *stage:* de stage bedoeld in [artikel 17 van de wet][ref12];
        - *stagegever:* de rechtspersoon of de natuurlijke persoon bij wie de stage wordt doorlopen;
        - *stageleraar:* leraar van de school waarop de leerling is ingeschreven, belast met de begeleiding van de leerling
      tijdens de stage;
        - *stagebegeleider:* degene die is belast met de begeleiding van de leerling en werkzaam is bij de stagegever;
        - *symbiose:* onderwijs waarbij een leerling of leerlingen, ter uitvoering van een deel van het schoolplan
      voor zover het betrekking heeft op speciaal onderwijs en voortgezet speciaal onderwijs als bedoeld in
      [artikel 14, eerste lid, onderdelen b en c][ref13], en [artikel 14a, eerste lid, onderdeel a, van de wet][ref14],
      onderwijs ontvangt onderscheidenlijk ontvangen op een andere school, een basisschool, een speciale school voor
      basisonderwijs, een school voor voortgezet onderwijs of een instelling voor educatie en beroepsonderwijs;
        - *teldatum:* een van de data, bedoeld in [artikel 116 van de wet][ref15];
        - *wet:* [Wet op de expertisecentra][ref16].


