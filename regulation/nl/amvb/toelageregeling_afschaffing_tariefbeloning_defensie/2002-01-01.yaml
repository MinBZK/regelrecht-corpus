---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: toelageregeling_afschaffing_tariefbeloning_defensie
regulatory_layer: AMVB
publication_date: '2003-12-09'
valid_from: '2002-01-01'
bwb_id: BWBR0003574
url: https://wetten.overheid.nl/BWBR0003574/2002-01-01
preamble:
  text: |-
    WIJ BEATRIX, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister-President en van Onze Ministers van Defensie en van Binnenlandse Zaken, van 14
    december 1982/1 februari 1983, nr. PBGO 82/051/6058/nr. AB82/2489;

    Overwegende dat in verband met de afschaffing van de tariefbeloning bij het Departement van Defensie nadere
    voorzieningen moeten worden getroffen ter vermijding van een ernstige achteruitgang in inkomen van degenen die tot
    het moment van afschaffing aanspraken op extra beloning in verband met de tarifering konden doen gelden;

    Overwegende voorts dat tot verbetering van inkomensverhoudingen tussen verschillende categorieën burgerlijk
    rijkspersoneel bij de onder het Departement van Defensie ressorterende tariefbedrijven moet worden gekomen;

    Gelet op artikel 42 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1948;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel1
  - number: 1.a
    text: '*Onze Minister:* Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel1
  - number: 1.b
    text: |-
      *besluit:* het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren][ref1] 1948;


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 1.c
    text: '*ambtenaar*: de ambtenaar in de zin van het besluit;'
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel1
  - number: 1.d
    text: '*salaris/bezoldiging:* hetgeen daaronder wordt verstaan in het besluit;'
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel1
  - number: 1.e
    text: |-
      *tariefwerker:* de ambtenaar die met toepassing van het gestelde in de beschikking van Onze Minister van
      Binnenlandse Zaken van 24 augustus 1960, nr. A602/U2555, op 31 december 1982 prestatiebeloning geniet welke wordt
      bepaald met behulp van tarieven;
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel1
  - number: 1.f
    text: |-
      *distantiëringstoelage-genietende:* de ambtenaar die met toepassing van de gemeenschappelijke beschikking van Onze
      Minister en van Onze Minister van Binnenlandse Zaken van 9 februari 1972, nr. 235.000/102D, onderscheidenlijk van 1
      maart 1972, nr. AB72/460, op 31 december 1982 aanspraak heeft op een toelage;
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel1
  - number: 1.g
    text: |-
      *tariefbedrijf:* de onder het Departement van Defensie ressorterende dienst, bedrijf of instelling waar op 31
      december 1982 prestatiebeloning toepassing vindt met behulp van tarieven.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel1
  - number: '2.1'
    text: De tariefwerker heeft voor zolang hij geplaatst is bij een tariefbedrijf, aanspraak op een garantietoelage.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      De garantietoelage bedoeld in het vorige lid wordt voor de eerste maal vastgesteld op het bedrag overeenkomende
      met het in het derde lid bedoelde gemiddelde tariefpremiepercentage van het salaris waarop de tariefwerker op 31
      december 1982 aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel2
  - number: '2.3'
    text: Het gemiddelde tariefpremiepercentage bedoeld in het tweede lid is
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel2
  - number: 2.3.a
    text: |-
      voor de tariefwerker die voor 1 mei 1982 als zodanig is geplaatst bij het tariefbedrijf waarbij hij op 31 december
      1982 werkzaam is, gelijk aan het tariefpremiepercentage dat hij in het tijdvak 1 november 1980 tot 1 november 1982
      in dat tariefbedrijf gemiddeld heeft behaald, waarbij voor degene wiens tariefbeloning wordt bepaald op basis van
      groepstarieven wordt uitgegaan van het gemiddelde percentage van de groep waartoe hij behoort;
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel2
  - number: 2.3.b
    text: |-
      voor de niet onder *a* bedoelde tariefwerker, gelijk aan het tariefpremiepercentage dat over het in *a*
      genoemde tijdvak gemiddeld is vastgesteld voor de daar bedoelde tariefwerkers behorende tot de afdeling van het
      tariefbedrijf waarbij hij op 31 december 1982 als zodanig werkzaam is.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het bedrag van de krachtens het tweede lid vastgestelde garantietoelagen wordt na twaalf maanden verminderd met een
      bedrag ter grootte van één percent van het voor de eerste maal vastgestelde toelage-bedrag.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel2
  - number: '2.5'
    text: |-
      Elke volgende periode van twaalf maanden, doch voor de laatste maal op 1 januari 1993, wordt het resterende bedrag
      van de garantietoelage verder verminderd met een gelijk bedrag als bedoeld in het vorige lid.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel2
  - number: '2.6'
    text: |-
      Vermindering, onderscheidenlijk verdere vermindering van de garantietoelage bedoeld in het vierde en vijfde lid
      blijft achterwege indien, onderscheidenlijk zodra de tariefwerker de leeftijd van 60 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel2
  - number: '2.7'
    text: |-
      De krachtens het tweede tot en met het zesde lid berekende garantietoelage wordt aangepast overeenkomstig de
      algemene salarismaatregelen voor het burgerlijk overheidspersoneel.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      De distantiëringstoelage-genietende heeft voor zolang hij geplaatst is bij een tariefbedrijf, aanspraak op een
      garantietoelage.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het bedrag van de in het eerste lid bedoelde garantietoelage wordt de eerste maal vastgesteld op het gemiddelde
      bedrag van de distantiëringstoelagen zoals die bij het tariefbedrijf waarbij distantiëringstoelage-genietende op 31
      december 1982 is geplaatst voor hem zouden zijn berekend over de kalenderjaren 1981/1982 uitgaande van zijn salaris
      op 31 december 1982.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel3
  - number: '3.3'
    text: |-
      Het gezamenlijke bedrag van salaris en garantietoelage is ten hoogste gelijk aan het maximum-salaris verbonden
      aan schaal 71 van het besluit vermeerderd met de daarop aansluitende vijf salarisanciënniteiten in de schalen van
      bijlage A I van het besluit.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel3
  - number: '3.4'
    text: |-
      Het bepaalde in [artikel 2, vierde tot en met zevende lid][ref1], is van overeenkomstige toepassing op de in dit
      artikel bedoelde garantietoelage.


      [ref1]: https://wetten.overheid.nl/BWBR0003574#Artikel2
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003574
        artikel: '2'
  - number: '3.5'
    text: |-
      Op de met inachtneming van het tweede tot en met het vierde lid van dit artikel vastgestelde toelage wordt in
      mindering gebracht hetgeen de distantiëringstoelage-genietende in voorkomend geval geniet als toelage op grond van
      artikel 17, vijfde lid, van het besluit.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      De op 31 december 1982 bij een tariefbedrijf geplaatste ambtenaar, zelf geen tariefwerker of distantiëringstoelage-
      genietende zijnde heeft, voor zolang hij bij een tariefbedrijf is geplaatst en voor zolang zijn salariëring niet
      plaatsvindt overeenkomstig een hogere schaal dan schaal 93 van het besluit, aanspraak op een overgangstoelage.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het bedrag van de in het eerste lid bedoelde toelage wordt vastgesteld op het bedrag dat op de bijlage bij dit
      besluit is vermeld bij het tariefbedrijf waar hij op 31 december 1982 is geplaatst.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      Op het bedrag van de toelage ingevolge de [artikelen 2][ref1], [3][ref2] en [4][ref3] van dit besluit worden
      ingaande 1 januari 1983 in mindering gebracht verhogingen van de bezoldiging, met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0003574#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003574#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003574#Artikel4
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003574
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003574
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003574
        artikel: '4'
  - number: 5.1.a
    text: verhogingen in de vorm van een algemene salarisverhoging;
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel5
  - number: 5.1.b
    text: verhogingen in de vorm van een toelage onregelmatige dienst.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      Op het bedrag van de toelage ingevolge de [artikelen 2][ref1] en [3][ref2] van dit besluit worden eveneens niet in
      mindering gebracht verhogingen van de bezoldiging voortvloeiende uit een individuele inkomstenverbetering, waarop
      naar het oordeel van Onze Minister reeds uitzicht bestond op het tijdstip van inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003574#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003574#Artikel3
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003574
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003574
        artikel: '3'
  - number: '5.3'
    text: |-
      Voor de ambtenaar, die op 31 december 2000 een toelage heeft op grond van dit besluit, wordt de verhoging van
      de salarisschalen per 1 januari 2001 niet in mindering gebracht op het bedrag van de toelage, als bedoeld in het
      eerste lid. Na toepassing van het overige gestelde in het eerste lid wordt de toelage vervolgens met ingang van
      1 januari 2001 verhoogd met 1,9%.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel5
  - number: '5.4'
    text: |-
      Een verhoging van het salaris als gevolg van de toevoeging van nieuwe maximumbedragen in de salarisschalen 1 tot
      en met 7 per 1 januari 2001 leidt, in voorkomend geval, niet tot een verlaging van een toelage als bedoeld in het
      eerste lid of een toelage als bedoeld in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003574#Artikel8
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003574
        artikel: '8'
  - number: '6.1'
    text: Toelagen, waarop aanspraak bestaat ingevolge dit besluit, worden maandelijks tegelijk met het salaris betaald.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel6
  - number: '6.2'
    text: |-
      Een op grond van dit besluit toegekende toelage wordt niet beschouwd als "wedde" bedoeld in artikel 1 van het
      besluit, behoudens ingeval van toepassing van [hoofdstuk VI van het Algemeen Rijksambtenarenreglement][ref1] en
      paragraaf 6 van hoofdstuk III van het Arbeidsovereenkomstenbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VI
  - number: '7'
    text: |-
      Toekenning, aanpassing en intrekking van toelagen, bedoeld in de [artikelen 2][ref1] tot en met [5][ref2] van dit
      besluit geschiedt door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003574#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003574#Artikel5
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003574
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003574
        artikel: '5'
  - number: '8'
    text: |-
      Onze Minister kan dit besluit buiten toepassing laten of daarvan afwijken voor zover toepassing gelet op het belang
      van de ambtenaar, tariefwerker en distantiëringstoelage-genietende, bedoeld in dit besluit, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel8
  - number: '9'
    text: |-
      Dit besluit, dat kan worden aangehaald als: "Toelageregeling afschaffing tariefbeloning Defensie" treedt in werking
      op de datum van zijn dagtekening en werkt terug tot 1 januari 1983.
    url: https://wetten.overheid.nl/BWBR0003574/2002-01-01#Artikel9
