        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002939
        artikel: '1'
  - number: 5a
    text: |-
      1 Indien door een plotselinge verandering in de voorziening van ruwe aardolie, olieproducten of andere
      koolwaterstoffen redelijkerwijs niet kan worden gevergd dat aan de grenswaarden voor het zwavelgehalte, bedoeld in
      [artikel 1, eerste lid, onder a of b][ref1], wordt voldaan, kan Onze Minister na van de Commissie van de Europese
      Gemeenschappen verkregen toestemming als bedoeld in artikel 5 van richtlijn 1999/32/EG, een hogere grenswaarde
      vaststellen van het zwavelgehalte, bedoeld in [artikel 1, eerste lid, onder a of b][ref2].

      2 Nadat het besluit van de Commissie is bekendgemaakt, beslist Onze Minister onverwijld overeenkomstig het besluit
      van de Commissie. Indien de Raad in het kader van artikel 5 van richtlijn 1999/32/EG een andersluidend besluit
      neemt, beslist Onze Minister nadat het besluit van de Raad is bekendgemaakt onverwijld overeenkomstig dat besluit,
      onder gelijktijdige intrekking van het besluit dat hij in eerste instantie heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002939#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002939#Artikel1
