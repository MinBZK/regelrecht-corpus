  - number: '3'
    text: |-
      1 Onze Minister kan ontheffing van het in [artikel 1, eerste lid, onder d][ref1], gestelde verbod verlenen.

      2 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] is van toepassing op de aanvraag om een ontheffing.

      3 Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.

      4 Van een beschikking, strekkende tot het verlenen van ontheffing, wordt op de dag waarop zij aan de aanvrager
      wordt toegezonden mededeling gedaan in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0002939#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
