  - number: '4'
    text: |-
      1 Overeenkomstig voorschrift 18, zesde lid, van Bijlage VI bij het Verdrag wordt door de leverancier van alle
      scheepsbrandstoffen, bestemd voor het gebruik door schepen als bedoeld in voorschrift 5, eerste lid, aanhef, van
      Bijlage VI bij het Verdrag:

      a. op de brandstofleveringsnota ten minste de informatie vermeld die is opgenomen in Aanhangsel V van Bijlage VI
      van het Verdrag;

      b. een door de vertegenwoordiger van de leverancier ondertekend, verzegeld representatief monster van de
      scheepsbrandstof bijgeleverd;

      c. een afschrift van de brandstofleveringsnota gedurende drie jaar bewaard.

      2 Het is verboden andere scheepsbrandstoffen te leveren dan vermeld op de brandstofleveringsnota.

      3 Het handelen in strijd met het bepaalde in het eerste lid is een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0002939/2011-01-01#Artikel4
  - number: '5'
    text: |-
      De methode voor de bepaling van het zwavelgehalte van brandstoffen wordt vastgesteld:

      a. indien het de in [artikel 1, eerste lid, onder a tot en met c][ref1], bedoelde brandstoffen betreft:
      overeenkomstig artikel 6 van richtlijn 1999/32/EG;

      b. indien het de in [artikel 1, eerste lid, onder d][ref2], bedoelde brandstoffen betreft: door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002939#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002939#Artikel1
    url: https://wetten.overheid.nl/BWBR0002939/2011-01-01#Artikel5
