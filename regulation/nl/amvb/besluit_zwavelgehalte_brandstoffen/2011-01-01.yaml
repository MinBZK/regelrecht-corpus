  - number: 5b
    text: |-
      De aan een vergunning verbonden voorschriften met betrekking tot het zwavelgehalte van een brandstof blijven van
      kracht, voor zover zij niet in strijd zijn met het bij of krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0002939/2011-01-01#Artikel5b
  - number: '6'
    text: |-
      1 Dit besluit kan worden aangehaald als Besluit zwavelgehalte brandstoffen.

      2 Het treedt in werking een maand na de datum van uitgifte van het *Staatsblad* waarin het is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002939/2011-01-01#Artikel6
