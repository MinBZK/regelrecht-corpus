preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Volksgezondheid en Milieuhygiëne van 28 mei 1974, DG MH/SL, no. 135152,
    gedaan in overeenstemming met Onze Ministers van Economische Zaken, van Landbouw en Visserij en van Verkeer en
    Waterstaat;

    Overwegende dat het wenselijk is ter beperking van de emissie van zwaveldioxyde grenzen te stellen aan het
    zwavelgehalte van brandstoffen;

    Gelet op de artikelen 13, 73, eerste lid, en 89 van de Wet inzake de luchtverontreiniging (Stb. 1970, 580);

    Gezien het advies van de Raad inzake de luchtverontreiniging van 18 juli 1973;

    De Raad van State gehoord (advies van 19 juni 1974, no. 15);

    Gezien het nader rapport van Onze Minister van Volksgezondheid en Milieuhygiëne van 25 september 1974, DG MH/SL,
    no. 138624;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002939/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het is verboden als brandstof te gebruiken:

      a. gasolie met een zwavelgehalte van meer dan 0,20%, en met ingang van 1 januari 2008 gasolie met een zwavelgehalte
      van meer dan 0,10%;

      b. zware stookolie met een zwavelgehalte van meer dan 1%,

      c. aan boord van een binnenschip met ingang van 1 januari 2010 scheepsbrandstof met een zwavelgehalte van meer dan
      0,1%, en

      d. andere brandstoffen, vast, vloeibaar of gasvormig, met uitzondering van dieselolie voor de scheepvaart en
      gasolie voor de scheepvaart, met een zwavelgehalte van meer dan 1,2%.

      2 Het is voorts verboden stoffen als bedoeld in het eerste lid in te voeren, ten verkoop aan te bieden, te verkopen
      of af te leveren tenzij dit geschiedt aan een persoon of met een bestemming voor een persoon,

      a. die de stoffen, naar redelijkerwijs moet worden aangenomen, anders dan als brandstof of niet in Nederland
      gebruikt;

      b. die op grond van een krachtens [artikel 3][ref1] verleende ontheffing bevoegd is de stoffen als brandstof te
      gebruiken;

      c. die op grond van [artikel 2, derde tot en met zesde lid][ref2], bevoegd is de stoffen als brandstof te
      gebruiken.

      3 Het is voorts verboden in de handel te brengen:

      a. dieselolie voor de scheepvaart met een zwavelgehalte van meer dan 1,5%, en

      b. gasolie voor de scheepvaart met een zwavelgehalte van meer dan 0,1%.

      4 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Verdrag: het op 2 november 1973 te Londen tot stand gekomen Internationaal Verdrag ter voorkoming van
      verontreiniging door schepen, met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147), en met het op
      17 februari 1978 te Londen tot stand gekomen Protocol bij dat Verdrag met Bijlage en Aanhangsels (Trb. 1978, 188);

      b. richtlijn 1999/32/EG: richtlijn van het Europees Parlement en de Raad van de Europese Unie van 26 april 1999
      betreffende een vermindering van het zwavelgehalte van bepaalde vloeibare brandstoffen en tot wijziging van
      Richtlijn 93/12/EEG (PbEG L 121), zoals deze laatstelijk is gewijzigd bij richtlijn nr. 2005/33/EG van het Europees
      Parlement en de Raad van de Europese Unie van 6 juli 2005 (PbEU L 191);

      c. zware stookolie: zware stookolie als bedoeld in artikel 2, onder 1, van richtlijn 1999/32/EG;

      d. gasolie: gasolie als bedoeld in artikel 2, onder 2, van richtlijn 1999/32/EG;

      e. scheepsbrandstof: scheepsbrandstof als bedoeld in artikel 2, onder 3, van richtlijn 1999/32/EG;

      f. dieselolie voor de scheepvaart: dieselolie voor de scheepvaart als bedoeld in artikel 2, onder 3a, van richtlijn
      1999/32/EG;

      g. gasolie voor de scheepvaart: gasolie voor de scheepvaart als bedoeld in artikel 2, onder 3b, van richtlijn
      1999/32/EG;

      h. binnenschip: binnenschip als bedoeld in artikel 2, onder 3j, van richtlijn 1999/32/EG;

      i. in de handel brengen: in de handel brengen als bedoeld in artikel 2, onder 3k, van richtlijn 1999/32/EG;

      j. brandstofleveringsnota: document als bedoeld in artikel 4 bis, zesde lid, tweede gedachtestreepje, van richtlijn
      1999/32/EG in samenhang met voorschrift 18, derde lid, van Bijlage VI van het Verdrag;

      k. emissiereductietechnologie: emissiereductietechnologie als bedoeld in artikel 2, onder 3m, van richtlijn
      1999/32/EG.

      5 Het bevoegd gezag kan bij het nemen van een beslissing met betrekking tot omgevingsvergunning krachtens
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref3]:

      a. een lagere waarde voor het zwavelgehalte voorschrijven dan de in het eerste lid, onder d, opgenomen waarde, doch
      geen lagere waarde dan 0,3%;

      b. indien voor een brandstof onmiddellijk voorafgaand aan het tijdstip van de inwerkingtreding van
      [artikel 14a van de Wet inzake de luchtverontreiniging][ref4] reeds bij de vergunning een lagere waarde voor het
      zwavelgehalte was voorgeschreven dan de in het eerste lid opgenomen waarden, dat voorschrift handhaven.

      6 Een wijziging van de artikelen genoemd in het vierde lid, onderdelen b tot en met k, gaat voor de toepassing
      van die onderdelen gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn
      gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt
      vastgesteld.

      7 Een wijziging van het Verdrag, genoemd in het vierde lid, onderdeel a, en van het Verdrag, genoemd in
      [artikel 2, vijfde lid][ref5], gaat voor de toepassing van dat onderdeel, respectievelijk dat artikellid, gelden
      met ingang van de dag waarop de wijziging internationaal in werking treedt, tenzij bij besluit van Onze Minister
      anders wordt bepaald.


