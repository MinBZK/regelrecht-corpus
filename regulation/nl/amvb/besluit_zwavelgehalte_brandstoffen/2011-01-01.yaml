  - number: '2'
    text: |-
      1 [Artikel 1, eerste lid][ref1], geldt niet voor het gebruik van brandstoffen:

      a. dat noodzakelijk is geworden ten gevolge van schade aan een schip of aan de uitrusting daarvan, mits na het
      ontstaan van de schade alle redelijke voorzorgen zijn getroffen om te hoge emissies te beperken, en mits er zo
      spoedig mogelijk maatregelen worden genomen om de schade te herstellen. Dit artikellid is niet van toepassing
      wanneer de eigenaar van het schip of de kapitein handelde met de bedoeling schade te veroorzaken of roekeloos
      handelde;

      b. in een schip specifiek om de veiligheid van een schip zeker te stellen of om mensenlevens op zee te redden.

      2 [Artikel 1, eerste lid, onder d, en tweede lid][ref2], geldt niet voor stoffen aanwezig in de brandstoftank van
      een vaartuig, voertuig of luchtvaartuig dat binnen het Nederlands grondgebied wordt gebracht.

      3 [Artikel 1, eerste lid, onder b en d][ref3], geldt niet voor zeeschepen.

      4 [Artikel 1, eerste tot en met derde lid][ref4], geldt niet voor:

      a. brandstoffen die bestemd zijn voor onderzoek en testen;

      b. brandstoffen die vóór hun definitieve verbranding nog een processtap ondergaan;

      c. brandstoffen die in de raffinage-industrie worden verwerkt;

      d. brandstoffen bestemd voor het gebruik door oorlogsschepen en andere vaartuigen die in militair verband worden
      gebruikt.

      5 [Artikel 1, eerste lid, onder c][ref5], is niet van toepassing op binnenschepen met een certificaat waaruit
      blijkt dat zij voldoen aan de voorschriften van het op 1 november 1974 te Londen totstandgekomen Verdrag inzake
      de beveiliging van mensenlevens op zee (Trb. 1976, 157) en de bij dat verdrag behorende bindende protocollen,
      aanhangsels en bijlagen, wanneer deze schepen op zee zijn.

      6 Voor zover bij of krachtens een algemene maatregel van bestuur op grond van [artikel 8.40][ref6],
      onderscheidenlijk [artikel 8.44 van de Wet milieubeheer][ref7] gestelde eisen met betrekking tot de uitworp van
      zwaveloxiden als gevolg van het gebruik van een brandstof op een stookinstallatie van toepassing zijn, geldt het in
      [artikel 1, eerste lid][ref8], gestelde verbod niet voor die brandstof.

      7 Dit besluit geldt niet voor brandstoffen waarop het [Besluit kwaliteitseisen brandstoffen wegverkeer][ref9] van
      toepassing is.

      8 Bij ministeriële regeling kan Onze Minister bepalen dat [artikel 1, eerste lid, onder c][ref10], niet geldt,
      indien gebruik wordt gemaakt van een goedgekeurde emissiereductietechnologie. In de ministeriële regeling worden
      regels gesteld met betrekking tot de keuring van een emissiereductietechnologie.


