  - number: '3'
    text: |-
      1 Onze Minister kan ontheffing van het in [artikel 1, eerste lid, onder c][ref1], gestelde verbod verlenen.

      2 Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.

      3 Van een beschikking, strekkende tot het verlenen van ontheffing, wordt op de dag waarop zij aan de aanvrager
      wordt toegezonden mededeling gedaan in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0002939#Artikel1
    url: https://wetten.overheid.nl/BWBR0002939/2004-06-30#Artikel3
