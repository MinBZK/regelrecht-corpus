  - number: '2'
    text: |-
      1 [Artikel 1, eerste lid, onder a, en tweede lid][ref1], geldt niet voor gasolie voor de zeescheepvaart aanwezig
      in de brandstoftank van een vaartuig dat binnen het Nederlands grondgebied wordt gebracht, voorzover de haven van
      vertrek van het desbetreffende vaartuig buiten de Europese Gemeenschap ligt.

      2 [Artikel 1, eerste lid, onder c, en tweede lid][ref2], geldt niet voor stoffen aanwezig in de brandstoftank van
      een vaartuig, voertuig of luchtvaartuig dat binnen het Nederlands grondgebied wordt gebracht.

      3 [Artikel 1, eerste lid, onder ][ref3], geldt niet voor zeeschepen. [Artikel 1, eerste lid][ref4], geldt niet
      voor proeven met voor zeeschepen bestemde motoren, voor zover het gasolie betreft die met het oog op die proeven
      is aangemaakt.

      4 Voor zover bij of krachtens een algemene maatregel van bestuur op grond van artikel 8.40, onderscheidenlijk
      [artikel 8.44 van de Wet milieubeheer][ref5] gestelde eisen met betrekking tot de uitworp van zwaveloxiden
      als gevolg van het gebruik van een brandstof op een stookinstallatie van toepassing zijn, geldt het in
      [artikel 1, eerste lid][ref6], gestelde verbod niet voor die brandstof.

      5 Dit besluit geldt niet voor brandstoffen waarop het [Besluit kwaliteitseisen brandstoffen wegverkeer][ref7] van
      toepassing is.


