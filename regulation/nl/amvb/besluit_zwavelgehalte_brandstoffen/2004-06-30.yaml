        artikel: '8.1'
  - number: '6'
    text: >-
      1 Dit besluit kan worden aangehaald als Besluit zwavelgehalte brandstoffen.


      2 Het treedt in werking een maand na de datum van uitgifte van het *Staatsblad* waarin het is geplaatst.
