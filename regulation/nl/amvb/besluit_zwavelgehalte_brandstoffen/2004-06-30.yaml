        artikel: '1'
  - number: 5b
    text: |-
      De aan een vergunning krachtens [artikel 8.1 van de Wet milieubeheer][ref1] verbonden voorschriften met betrekking
      tot het zwavelgehalte van een brandstof blijven van kracht, voor zover zij niet in strijd zijn met het bij of
      krachtens dit besluit bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0002939/2004-06-30#Artikel5b
