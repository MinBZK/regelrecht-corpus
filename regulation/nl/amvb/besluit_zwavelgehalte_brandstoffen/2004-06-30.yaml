  - number: '5'
    text: |-
      De methode volgens welke het zwavelgehalte van de in [artikel 1][ref1] bedoelde brandstoffen wordt vastgesteld,
      wordt door Onze Minister bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002939#Artikel1
    url: https://wetten.overheid.nl/BWBR0002939/2004-06-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002939
        artikel: '1'
  - number: 5a
    text: |-
      1 Indien door een plotselinge verandering in de voorziening van ruwe aardolie, olieproducten of andere
      koolwaterstoffen redelijkerwijs niet kan worden gevergd dat aan de grenswaarden voor het zwavelgehalte, bedoeld in
      [artikel 1, eerste lid, onder a of b][ref1], wordt voldaan, kan Onze Minister na van de Commissie van de Europese
      Gemeenschappen verkregen toestemming als bedoeld in artikel 5 van [richtlijn nr. 1999/32/EG](31999L0032) van
      de Raad van de Europese Unie van 26 april 1999, betreffende een vermindering van het zwavelgehalte van bepaalde
      vloeibare brandstoffen en tot wijziging van [richtlijn nr. 93/12/EEG](31993L0012) (PbEG L 121), een hogere
      grenswaarde vaststellen van het zwavelgehalte, bedoeld in [artikel 1, eerste lid, onder a of b][ref2].

      2 Nadat het besluit van de Commissie is bekendgemaakt, beslist Onze Minister onverwijld overeenkomstig het
      besluit van de Commissie. Indien de Raad in het kader van artikel 5 van de in het eerste lid genoemde richtlijn
      een andersluidend besluit neemt, beslist Onze Minister nadat het besluit van de Raad is bekendgemaakt onverwijld
      overeenkomstig dat besluit, onder gelijktijdige intrekking van het besluit dat hij in eerste instantie heeft
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002939#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002939#Artikel1
    url: https://wetten.overheid.nl/BWBR0002939/2004-06-30#Artikel5a
