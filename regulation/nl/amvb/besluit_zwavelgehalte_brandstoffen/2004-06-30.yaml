preamble:
  text: >-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van Onze Minister van Volksgezondheid en Milieuhygiëne van 28 mei 1974, DG MH/SL, no. 135152,
    gedaan in overeenstemming met Onze Ministers van Economische Zaken, van Landbouw en Visserij en van Verkeer en
    Waterstaat;


    Overwegende dat het wenselijk is ter beperking van de emissie van zwaveldioxyde grenzen te stellen aan het
    zwavelgehalte van brandstoffen;


    Gelet op de artikelen 13, 73, eerste lid, en 89 van de Wet inzake de luchtverontreiniging (Stb. 1970, 580);


    Gezien het advies van de Raad inzake de luchtverontreiniging van 18 juli 1973;


    De Raad van State gehoord (advies van 19 juni 1974, no. 15);


    Gezien het nader rapport van Onze Minister van Volksgezondheid en Milieuhygiëne van 25 september 1974, DG MH/SL,
    no. 138624;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002939/2004-06-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het is verboden als brandstof te gebruiken:

      a. gasolie of gasolie voor de zeescheepvaart met een zwavelgehalte van meer dan 0,20%, en met ingang van 1 januari
      2008 gasolie of gasolie voor de zeescheepvaart met een zwavelgehalte van meer dan 0,10%;

      b. zware stookolie met een zwavelgehalte van meer dan 1,00% en

      c. andere brandstoffen, vast, vloeibaar of gasvormig, met een zwavelgehalte van meer dan 1,2%.

      2 Het is voorts verboden stoffen als bedoeld in het eerste lid in te voeren, ten verkoop aan te bieden, te verkopen
      of af te leveren tenzij dit geschiedt aan een persoon of met een bestemming voor een persoon,

      a. die de stoffen, naar redelijkerwijs moet worden aangenomen, anders dan als brandstof of niet in Nederland
      gebruikt;

      b. die op grond van een krachtens [artikel 3][ref1] verleende ontheffing bevoegd is de stoffen als brandstof te
      gebruiken;

      c. die op grond van [artikel 2, derde of vierde lid][ref2], bevoegd is de stoffen als brandstof te gebruiken.

      3 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. GN-code: code als bedoeld in de [verordening (EEG) nr. 2658/87](31987R2658) van de Raad van de Europese
      Gemeenschappen van 23 juli 1987 met betrekking tot de tarief- en statistieknomenclatuur en het gemeenschappelijk
      douanetarief (PbEG L 256), als geldend op 11 mei 1999;

      b. ASTM-methode: methode van de American Society for Testing and Materials, zoals omschreven in de uitgave van 1976
      van de standaarddefinities en specificaties voor olieproducten en smeermiddelen;

      c. ISO-norm: norm van de International Organisation for Standardization;

      d. gasolie: elke gasolie behorende tot gasoliën als bedoeld in artikel 2, onderdeel 3, van [richtlijn nr. 98/70/
      EG](31998L0070) van het Europees Parlement en de Raad van de Europese Unie van 13 oktober 1998 betreffende de
      kwaliteit van benzine en van dieselbrandstof en tot wijziging van [Richtlijn 93/12/EEG](31993L0012) van de Raad
      (PbEG L 350), zoals deze laatstelijk is gewijzigd bij [richtlijn nr. 2003/17/EG](32003L0017) van het Europees
      Parlement en de Raad van de Europese Unie van 3 maart 2003 (PbEU L 76);

      e. zware stookolie:

      1°. een uit aardolie verkregen vloeibare brandstof die onder de GN-codes 2710 00 71 tot en met 2710 00 78 valt, of

      2°. een uit aardolie verkregen vloeibare brandstof, met uitzondering van gasolie als bedoeld onder d en f, die op
      grond van de destillatiegrenzen ervan behoort tot de categorie zware oliën welke zijn bestemd om als brandstof te
      worden gebruikt en die, destillatieverliezen inbegrepen, voor minder dan 65 volumeprocent overdestilleren bij 250
      °C, gemeten met ASTM-methode D86, met dien verstande dat, indien de destillatie niet met behulp van ASTM-methode
      D86 kan worden bepaald, het aardolieproduct eveneens wordt ingedeeld als zware stookolie;

      f. gasolie voor de zeescheepvaart: gasolie, bestemd voor de zeescheepvaart, alsmede andere brandstoffen, bestemd
      voor de zeescheepvaart, die een viscositeit of dichtheid hebben die binnen de viscositeits- of dichtheidsgrenzen
      ligt welke in tabel 1 van ISO-norm 8217, versie 1996, voor mariene destillaten zijn bepaald.

      4 Het bevoegd gezag kan bij het nemen van een beslissing met betrekking tot een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref3]:

      a. een lagere waarde voor het zwavelgehalte voorschrijven dan de in het eerste lid, onder c, opgenomen waarde, doch
      geen lagere waarde dan 0,3%;

      b. indien voor een brandstof onmiddellijk voorafgaand aan het tijdstip van de inwerkingtreding van
      [artikel 14][ref4] reeds bij de vergunning een lagere waarde voor het zwavelgehalte was voorgeschreven dan de in
      het eerste lid opgenomen waarden, dat voorschrift handhaven.

      5 Een wijziging van het artikel, genoemd in onderdeel d van het derde lid, gaat voor de toepassing van dat
      onderdeel gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven,
      tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002939#Artikel3
