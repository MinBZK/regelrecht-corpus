---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_eisen_inrichtingen_drank_en_horecawet
regulatory_layer: AMVB
publication_date: '2020-10-28'
valid_from: '2016-07-01'
bwb_id: BWBR0011700
url: https://wetten.overheid.nl/BWBR0011700/2016-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 6 juli 2000, kenmerk GZB/GZ 2.084.060;

    Gelet op artikel 10 van de Drank- en Horecawet;

    De Raad van State gehoord (advies van 11 augustus 2000, no. W13.00.0278);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 2 oktober 2000, met kenmerk
    GZB/GZ 2.108.414;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel1
  - number: 1.1.a
    text: |-
      loopafstand: de afstand, gemeten langs een denkbeeldige, kortst realiseerbare vloeiend verlopende lijn tussen twee
      punten, waarover op een afstand van ten minste 0,30 m van constructie-onderdelen kan worden gelopen;
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel1
  - number: 1.1.b
    text: |-
      neringruimte: ruimte binnen een gebouw, welke ruimte in gebruik is voor het uitoefenen van de kleinhandel of de
      zelfbedieningsgroothandel of een van de hierna te noemen activiteiten:
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel1
  - number: 1.1.b.1°
    text: |-
      het bedrijfsmatig aan particulieren verkopen van goederen in het kader van een openbare verkoping, als bedoeld in
      [artikel 1 van de Wet ambtelijk toezicht bij openbare verkopingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002798#Artikel1
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002798
        artikel: '1'
  - number: 1.1.b.2°
    text: het bedrijfsmatig aanbieden van diensten;
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel1
  - number: 1.1.b.3°
    text: het bedrijfsmatig verhuren van goederen;
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel1
  - number: 1.1.b.4°
    text: het in het openbaar bedrijfsmatig opkopen van goederen;
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel1
  - number: 1.1.c
    text: |-
      verbindingslokaliteit: een tot een inrichting waarin het slijtersbedrijf wordt uitgeoefend behorende lokaliteit in
      gebruik als passage tussen een neringruimte en een slijtlokaliteit.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel1
  - number: '1.2'
    text: |-
      In dit besluit worden aan elkaar grenzende ruimten als één lokaliteit beschouwd, indien zij hetzij verbonden zijn
      door een permanente wandopening met een hoogte van ten minste 2,20 m van de vloer af gemeten en een breedte van ten
      minste twee/derde van de scheidingswand met een minimum van 2,40 m, hetzij slechts gescheiden door een afscheiding
      van geringere hoogte dan 1,25 m van de vloer af gemeten.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel1
  - number: '2'
    text: |-
      Onverminderd het [Bouwbesluit 2012][ref1], voldoet een inrichting waarin het horecabedrijf wordt uitgeoefend, aan
      de in [artikelen 3 tot en met 7][ref2] van het onderhavige besluit vervatte bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030461
      [ref2]: https://wetten.overheid.nl/BWBR0011700#Artikel3
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0030461
      - id: ref2
        bwb_id: BWBR0011700
        artikel: '3'
        paragraaf: '2'
  - number: '3'
    text: |-
      Een inrichting waarin het horecabedrijf wordt uitgeoefend, heeft ten minste één horecalokaliteit met een
      vloeroppervlakte van ten minste 35 m2.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel3
  - number: '4'
    text: Een horecalokaliteit heeft een hoogte van ten minste 2,40 m van de vloer af gemeten.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel4
  - number: 4a
    text: |-
      De burgemeester kan besluiten af te wijken van [artikel 3][ref1] en [4][ref2], indien er sprake is van een
      lokaliteit die is gevestigd in een rijksmonument als bedoeld in [artikel 1.1 van de Erfgoedwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011700#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011700#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037521#Artikel1
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0011700
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011700
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0037521
        artikel: '1'
  - number: '5.1'
    text: |-
      Een horecalokaliteit is voorzien van een rechtstreeks met de buitenlucht in verbinding staande goed werkende
      mechanische ventilatie-inrichting met een luchtverversingscapaciteit van 3,8•10-3 m3/s per m2 vloeroppervlakte.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel5
  - number: '5.2'
    text: |-
      Indien er sprake is van een horecalokaliteit die gevestigd is in een rijksmonument als bedoeld
      in [artikel 1.1 van de Erfgoedwet][ref1], kan de burgemeester in afwijking van het bepaalde in
      [artikel 27 van de Drank- en Horecawet][ref2] een vergunning verlenen indien niet wordt voldaan aan het eerste lid,
      mits de luchtverversing op een andere wijze dan voorzien in het eerste lid wordt gerealiseerd en dit leidt tot een
      luchtkwaliteit in de horecalokaliteit die vergelijkbaar is met de luchtkwaliteit die zou worden gerealiseerd door
      middel van de in het eerste lid bedoelde mechanische ventilatie-inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel27
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '27'
  - number: '6.1'
    text: |-
      In een inrichting waarin het horecabedrijf wordt uitgeoefend is, opdat op veilige wijze kan worden beschikt over
      energie, een voorziening voor elektriciteit aanwezig.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel6
  - number: '6.2'
    text: |-
      In een inrichting waarin het horecabedrijf wordt uitgeoefend is, opdat kan worden beschikt over voor de menselijke
      consumptie en hygiëne geschikt water, een voorziening voor drinkwater aanwezig.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel6
  - number: '7.1'
    text: |-
      In de onmiddellijke nabijheid van een horecalokaliteit zijn, ten behoeve van de bezoekers, ten minste twee volledig
      van elkaar gescheiden toiletgelegenheden aanwezig.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel7
  - number: '7.2'
    text: 'Elke toiletgelegenheid bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel7
  - number: 7.2.a
    text: een of meer behoorlijke en afsluitbare toiletruimten;
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel7
  - number: 7.2.b
    text: een of meer behoorlijke voorzieningen om de handen met stromend deugdelijk drinkwater te kunnen wassen.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel7
  - number: '7.3'
    text: De in de toiletruimten aanwezige toiletpotten en urinoirs zijn voorzien van een waterspoeling.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel7
  - number: '7.4'
    text: De toiletruimten zijn niet rechtstreeks toegankelijk vanuit een horecalokaliteit.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel7
  - number: '8'
    text: |-
      Onverminderd het [Bouwbesluit][ref1], voldoet een inrichting waarin het slijtersbedrijf wordt uitgeoefend, aan de
      in [artikelen 9 tot en met 11][ref2] van het onderhavige besluit vervatte bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005321
      [ref2]: https://wetten.overheid.nl/BWBR0011700#Artikel9
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005321
      - id: ref2
        bwb_id: BWBR0011700
        artikel: '9'
        paragraaf: '3'
  - number: '9'
    text: |-
      Een inrichting waarin het slijtersbedrijf wordt uitgeoefend heeft ten minste één slijtlokaliteit met een
      vloeroppervlakte van ten minste 15 m2.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel9
  - number: '10'
    text: |-
      Een slijtlokaliteit heeft aan alle zijden gesloten wanden met een hoogte van ten minste 2,40 m van de vloer af
      gemeten.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel10
  - number: '11.1'
    text: Een slijtlokaliteit staat niet rechtstreeks in verbinding met een neringruimte.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel11
  - number: '11.2'
    text: |-
      Een verbindingslokaliteit heeft aan alle zijden gesloten wanden met een hoogte van ten minste 2,40 m van de vloer
      af gemeten.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel11
  - number: '11.3'
    text: |-
      Een verbindingslokaliteit bestemd of mede bestemd voor bezoekers, heeft ten hoogste één afsluitbare toegang met
      een breedte van ten hoogste 2,40 m naar de slijtlokaliteit en ten hoogste één afsluitbare toegang met een breedte
      van ten hoogste 2,40 m naar de neringruimte. De loopafstand tussen de toegang naar de slijtlokaliteit en de toegang
      naar de neringruimte bedraagt ten minste 2,00 m.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel11
  - number: '11.4'
    text: |-
      Een verbindingslokaliteit uitsluitend bestemd voor personeel van het slijtersbedrijf, heeft ten hoogste één
      afsluitbare toegang met een breedte van ten hoogste 1,00 m naar de slijtlokaliteit en ten hoogste één afsluitbare
      toegang met een breedte van ten hoogste 1,00 m naar de neringruimte. De loopafstand tussen de toegang naar de
      slijtlokaliteit en de toegang naar de neringruimte bedraagt ten minste 1,00 m.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel11
  - number: '12'
    text: Het Besluit inrichtingseisen Drank- en Horecawet wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel12
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Besluit eisen inrichtingen Drank- en Horecawet.'
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel13
  - number: '14'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de onderdelen I en N van ARTIKEL I van de
      [Wet van 13 april 2000, Stb. 184, tot wijziging van de Drank- en Horecawet][ref1] in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0011300
    url: https://wetten.overheid.nl/BWBR0011700/2016-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011300
