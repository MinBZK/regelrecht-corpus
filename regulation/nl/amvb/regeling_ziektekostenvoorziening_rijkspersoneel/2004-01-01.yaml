preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 19 november 1996, nr. AB96/U1390, directoraat-
    generaal Management en Personeelsbeleid, directie Arbeidszaken Overheid, gedaan mede namens Onze Ministers van
    Justitie en van Onderwijs, Cultuur en Wetenschappen alsmede de Staatssecretaris van Defensie;

    Gelet op artikel 125 en 134 van de Ambtenarenwet; artikel 16 van de Wet rechtspositie rechterlijke ambtenaren;
    artikel 50, eerste lid, van de Politiewet 1993; artikel 9, zesde lid, van de LSOP-wet; artikel 20, tweede lid, van
    de Wet op het basisonderwijs; artikel 28, tweede lid, van de Interimwet op het speciaal onderwijs en het voortgezet
    speciaal onderwijs; de artikelen 38a, tweede lid, en 61 van de Wet op het voortgezet onderwijs; artikel 4 van de
    Experimentenwet onderwijs; de artikelen 4.1.2, tweede lid, 4.1.4, en 4.3.2, tweede lid, van de Wet educatie en
    beroepsonderwijs; de artikelen 4.5, 4.6, 10.10, derde lid, 11.12, eerste lid, 13.1, vijfde lid, en 13.3, vijfde
    lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek; de artikelen 14, eerste lid, en 35 van
    de Wet op de Nederlandse organisatie voor het Wetenschappelijk onderzoek, alsmede artikel 12 van de Militaire
    Ambtenarenwet 1931;

    De Raad van State gehoord (advies van 17 februari 1997, nr.WO4.96 0057);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 19 juni 1997, nr. AB97/233, directoraat-
    generaal Management en Personeelsbeleid, directie Arbeidszaken Overheid, uitgebracht mede namens Onze Ministers van
    Justitie en van Onderwijs, Cultuur en Wetenschappen alsmede de Staatssecretaris van Defensie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008818/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Naar de regels van dit besluit heeft de betrokkene die in voldoende mate is verzekerd tegen het risico van
      ziektekosten recht op een tegemoetkoming in te zijnen laste blijvende ziektekosten van zichzelf en van zijn
      medebetrokkenen.
    url: https://wetten.overheid.nl/BWBR0008818/2004-01-01#Artikel1
  - number: '2'
    text: |-
      In dit besluit wordt verstaan onder:

      a. «Onze Minister»: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. «inkomsten»:

      1. alle door Onze Minister nader te bepalen inkomsten uit of in verband met arbeid daartoe mede gerekend pensioenen
      en uitkeringen ingevolge sociale regelingen, onder welke benamingen dan ook;

      2. inkomsten uit of in verband met de uitoefening van een vrij beroep of eigen bedrijf, zijnde winst uit
      onderneming als bedoeld in de [Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0008818/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '3'
    text: |-
      Degene die een ziektekostenverzekering heeft gesloten die tenminste omvat

      a. volledige vergoeding van kosten van behandeling, verzorging en verpleging in een ziekenhuis gedurende een jaar
      met klinische specialistenhulp en bijkomende kosten, eventueel met een eigen risico aan de voet; en

      b. tenminste 80% vergoeding van niet-klinische (ambulante) specialistenhulp dan wel volledige vergoeding met een
      eigen risico aan de voet,

      is voor de toepassing van deze regeling in voldoende mate verzekerd tegen het risico van ziektekosten.
    url: https://wetten.overheid.nl/BWBR0008818/2004-01-01#Artikel3
  - number: '4'
    text: |-
      1 Betrokkene in de zin van dit besluit is degene die behoort tot een van de volgende categorieën van personen:

      a. degenen die op basis van het [Algemeen Rijksambtenarenreglement][ref1],
      het [Ambtenarenreglement Staten-Generaal][ref2] of ingevolge
      [artikel 17 van het Reglement Dienst Buitenlandse Zaken][ref3] in burgerlijke rijksdienst werkzaam zijn;

      b. gewezen personeel als bedoeld in onderdeel a, dan wel gewezen personeel dat op basis van het
      Arbeidsovereenkomstenbesluit werkzaam was, waaraan wegens ontslag uit de betrekking een uitkering is toegekend
      krachtens of op de voet van het [Rijkswachtgeldbesluit 1959][ref4], de [Uitkeringsregeling 1966][ref5], de
      [Werkloosheidswet][ref6], het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref7],
      de [Wet op de arbeidsongeschiktheidsverzekering][ref8], de Suppletieregeling gedeeltelijk arbeidsongeschikten
      sector Rijk, de Regeling uitkering wegens functioneel leeftijdsontslag, het Besluit ontslaguitkering substantieel
      bezwarende functies, een vutovereenkomst als bedoeld in de [Wet kaderregeling vut overheidspersoneel][ref9] of een
      WAO-conforme uitkering als bedoeld in [artikel 32 van de Wet privatisering ABP][ref10];

      c. degenen aan wie een pensioen is toegekend krachtens het pensioenreglement van de Stichting Pensioenfonds
      ABP, genoemd in [artikel 6 van de Wet privatisering ABP][ref11], en in de maand voorafgaande aan de pensionering
      behoorden tot de categorieën, bedoeld in onderdeel *a* of onderdeel *b*;

      d. de krachtens het reglement, genoemd in onderdeel c, partnerpensioen genietende niet hertrouwde en niet bij
      een nieuw geregistreerd partnerschap dan wel aangemeld partnerschap in de zin van genoemd reglement betrokken
      personen die partner waren van degenen die op de dag van overlijden betrokkenen waren in de zin van dit besluit of
      betrokkenen zouden zijn geweest, indien dit besluit op die dag van kracht zou zijn geweest;

      e. degenen die als betrokkenen in de zin van de Regeling ziektekostenvoorziening overheidspersoneel zijn aangewezen
      bij:

      1°. het Besluit van de Minister van Binnenlandse Zaken van 5 januari 1981, AB81/U3, ter uitvoering van artikel 4,
      tweede lid, van de Z.v.o.-regeling (*Stcrt.* 2), zoals dat besluit luidde op de dag vóór de inwerkingtreding van
      dit besluit;

      2°. het Besluit van de Minister van Binnenlandse Zaken van 25 juni 1982, AB82/U1185, ter uitvoering van artikel 4,
      tweede lid, van de Z.v.o.-regeling (*Stcrt.* 123), zoals dat besluit luidde op de dag vóór de inwerkingtreding van
      dit besluit;

      3°. het Besluit van de Minister van Binnenlandse Zaken van 8 oktober 1982, AB82/U1889, ter uitvoering van artikel
      4, tweede lid, van de Z.v.o.-regeling (*Stcrt.* 205), zoals dat besluit luidde op de dag vóór de inwerkingtreding
      van dit besluit;

      4°. het Besluit van de Minister van Binnenlandse Zaken van 25 maart 1992, AB92/U343, ter uitvoering van artikel 4,
      tweede lid, van de Z.v.o.-regeling (*Stcrt.* 99), zoals dat besluit luidde op de dag vóór de inwerkingtreding van
      dit besluit;

      5°. het Besluit van de Minister van Binnenlandse Zaken van 15 februari 1995, AB95/U224, ter uitvoering van artikel
      4, tweede lid, van de Z.v.o.-regeling (*Stcrt.* 38), zoals dat besluit luidde op de dag vóór de inwerkingtreding
      van dit besluit;

      6°. het Besluit van de Minister van Justitie en de Minister van Binnenlandse Zaken van 8 april 1981 respectievelijk
      14 december 1981, AB81/U2154, ter uitvoering van artikel 4, tweede lid, van de Z.v.o.-regeling, zoals dat besluit
      luidde op de dag vóór de inwerkingtreding van dit besluit.

      2 Onze Minister kan ook andere categorieën van personen, wier bezoldiging, uitkering of pensioen direct of indirect
      komt ten laste van de algemene middelen van het Rijk, aanwijzen als betrokkenen in de zin van dit besluit.


