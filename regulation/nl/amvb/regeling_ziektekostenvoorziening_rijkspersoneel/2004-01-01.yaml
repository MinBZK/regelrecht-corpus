  - number: '9'
    text: |-
      1 De tegemoetkoming, bedoeld in [artikel 1][ref1], wordt aan de betrokkene verleend voor zover de te zijnen laste
      blijvende ziektekosten hoger zijn dan het drempelbedrag. Dit drempelbedrag is gelijk aan de som van de volgende
      bedragen:

      a. een bedrag dat overeenkomt met het werknemersdeel van de ziekenfondspremie, berekend over het
      inkomen van betrokkene op basis van de procentuele ziekenfondspremie zoals deze is vastgelegd ingevolge
      [artikel 15 van de Ziekenfondswet][ref2];

      b. een bedrag dat overeenkomt met het effect van de fiscale bijtelling van het werkgeversdeel van de procentuele
      ziekenfondspremie zoals deze is vastgesteld ingevolge [artikel 15 van de Ziekenfondswet][ref3], berekend over het
      inkomen van de betrokkene;

      c. een bedrag dat overeenkomt met de nominale premie ingevolge [artikel 17 van de Ziekenfondswet][ref4] voor
      betrokkene en zijn medebetrokkenen.

      2 Bij de berekening van het effect, bedoeld in het eerste lid, onderdeel *b*, wordt gerekend met het tarief van de
      laagste belastingschijf, bedoeld in [artikel 2.10 van de Wet inkomstenbelasting 2001][ref5], vermeerderd met het
      heffingspercentage ingevolge [artikel 10 van de Wet financiering volksverzekeringen][ref6].


