  - number: '12'
    text: |-
      Onze Minister kan omtrent het bepaalde in de [artikelen 2, onderdeel b][ref1], [7, eerste lid, onderdeel b][ref2],
      en [9, eerste lid, onderdeel c][ref3], van dit besluit nadere regels stellen.

      Van de bevoegdheid tot het stellen van deze regels met een sterk technisch karakter kan Onze Minister mandaat
      verlenen.


