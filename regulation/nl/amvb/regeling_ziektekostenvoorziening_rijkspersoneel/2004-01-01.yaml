  - number: '7'
    text: |-
      1 Voor het verlenen van een tegemoetkoming kunnen in aanmerking worden gebracht de in [artikel 1][ref1] bedoelde
      kosten die betrokkene als zodanig heeft gemaakt en die betrekking hebben op een aaneengesloten tijdvak van 12
      maanden.

      2 Voor de betrokkene die de leeftijd van 65 jaar heeft bereikt en de medebetrokkene, bedoeld in
      [artikel 6, eerste lid, onderdeel b][ref2], die de leeftijd van 65 jaar heeft bereikt, komt voor tegemoetkoming in
      aanmerking het totaal van:

      a. het bedrag van de premie voor een ziektekostenverzekering, tot ten hoogste het
      bedrag van de premie voor een overeenkomst van standaardverzekering als bedoeld in
      [artikel 3, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref3];

      b. de verschuldigde omslagbijdrage ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref4];

      c. de verschuldigde omslagbijdrage ingevolge
      [artikel 11 van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref5];

      d. de kosten van geneeskundige verzorging, welke in de overeenkomst van de ziektekostenverzekering volledig van
      vergoeding zijn uitgesloten, voor zover deze kosten worden vergoed door een overeenkomst van standaardverzekering
      als bedoeld in [artikel 3, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref6].

      3 Voor de betrokkene jonger dan 65 jaar en de medebetrokkene, bedoeld in [artikel 6, eerste lid, onderdeel b][ref7],
      jonger dan 65 jaar komt voor tegemoetkoming in aanmerking het totaal van:

      a. het bedrag van de premie voor een ziektekostenverzekering, tot ten hoogste het
      bedrag van de premie voor een overeenkomst van standaardverzekering als bedoeld in
      [artikel 3, eerste lid, van de Wet op de toegang tot de ziektekostenverzekering 1998][ref8];

      b. de verschuldigde omslagbijdrage ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref9];

      c. de verschuldigde omslagbijdrage ingevolge
      [artikel 11 van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref10];

      d. de kosten van geneeskundige verzorging, welke in de overeenkomst van de ziektekostenverzekering volledig van
      vergoeding zijn uitgesloten, voor zover deze kosten worden vergoed door een overeenkomst van standaardverzekering
      als bedoeld in [artikel 3, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref11].

      4 Voor de medebetrokkene, bedoeld in [artikel 6, eerste lid, onderdeel a][ref12], komt voor tegemoetkoming in
      aanmerking het totaal van:

      a. het bedrag van de premie voor een ziektekostenverzekering, tot ten hoogste de helft van het bedrag
      van de premie voor een overeenkomst van standaardverzekering als bedoeld in artikel 3, eerste lid, van de
      [Wet op de toegang tot de ziektekostenverzekering 1998][ref13];

      b. de verschuldigde omslagbijdrage ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref14];

      c. de verschuldigde omslagbijdrage ingevolge
      [artikel 11 van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref15];

      d. de kosten van geneeskundige verzorging, welke in de overeenkomst van de ziektekostenverzekering volledig van
      vergoeding zijn uitgesloten, voor zover deze kosten worden vergoed door een overeenkomst van standaardverzekering
      als bedoeld in [artikel 3, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref16].

      5 Indien de betrokkene voor zichzelf en zijn medebetrokkenen een ziektekostenverzekering heeft afgesloten waarvoor
      de premie bestaat uit een totaalbedrag voor alle verzekerden tezamen, waarbij de premie niet tot de individuele
      verzekerden herleid kan worden, worden de premies voor de betrokkene en diens medebetrokkenen bepaald door het
      totaalbedrag te vermenigvuldigen met een breuk.

      6 Bij de in het vijfde lid genoemde breuk is de noemer gelijk aan het aantal gezinsleden, met dien verstande dat de
      medebetrokkenen, bedoeld in [artikel 6, eerste lid, onderdeel a][ref17], voor de helft meetellen.

      7 Bij de in het vijfde lid genoemde breuk is de teller voor de medebetrokkenen, bedoeld in
      [artikel 6, eerste lid, onderdeel a][ref18], 0,5 en voor de betrokkene en de medebetrokkenen als bedoeld in
      [artikel 6, eerste lid, onderdeel b][ref19], 1.

      8 Op het bedrag dat voor tegemoetkoming in aanmerking kan worden gebracht wordt in mindering gebracht een door het
      Rijk of door derden toegekende of toe te kennen tegemoetkoming in ziektekosten.


