  - number: '6'
    text: |-
      1 Indien de inkomsten van betrokkene meer bedragen dan de helft van de totale inkomsten van alle leden van diens
      huishouden worden als medebetrokkene in de zin van dit besluit aangemerkt:

      a. een eigen kind, stiefkind, pleegkind of aanbehuwd kind dat behoort tot het huishouden van betrokkene;

      b. de overige leden van het huishouden van betrokkene, voor zover zij geen eigen
      inkomsten genieten die meer bedragen dan tweemaal de algemene heffingskorting, bedoeld in
      [artikel 8.10, tweede lid, van de Wet inkomstenbelasting 2001][ref1].

      2 Als medebetrokkene wordt niet aangemerkt degene die:

      a. niet in voldoende mate verzekerd is tegen het risico van ziektekosten;

      b. zelfstandig verplicht verzekerd of medeverzekerd is in de zin van de [Ziekenfondswet][ref2];

      c. zelfstandig aanspraak ontleent aan deze of een overeenkomstige regeling, dan wel direct deelneemt aan een
      publiekrechtelijke ziektekostenregeling voor ambtenaren.

      3 Een uitkering krachtens de [Algemene Ouderdomswet][ref3] is geen inkomsten als bedoeld in het eerste lid, onder
      b.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8.10
