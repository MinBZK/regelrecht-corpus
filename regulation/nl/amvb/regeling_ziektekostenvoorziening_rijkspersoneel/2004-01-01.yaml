  - number: '11'
    text: |-
      1 Behoudens het bepaalde in de volgende leden komen de kosten van de tegemoetkomingen ingevolge dit besluit ten
      laste van hoofdstuk VII van de Rijksbegroting.

      2 De kosten van tegemoetkomingen verleend aan betrokkenen, bedoeld in [artikel 4, eerste lid, onderdeel ][ref1],
      komen voor rekening van het hoofdstuk van de Rijksbegroting, ten laste waarvan de bezoldiging van betrokkenen in
      het door hen gekozen tijdvak kwam.

      3 De kosten van tegemoetkomingen verleend aan betrokkenen, bedoeld in
      [artikel 4, eerste lid, onderdeel e, onder 6°][ref2], worden ten laste gebracht van hoofdstuk VI van de
      Rijksbegroting.

      4 Bij de aanwijzing, bedoeld in [artikel 4, tweede lid][ref3], kan Onze Minister bepalen dat de kosten van
      tegemoetkomingen verleend aan betrokkenen als bedoeld in [artikel 4, tweede lid][ref4], voor rekening komen van de
      instelling waar de betrokkenen in dienst zijn.


