  - number: '3'
    text: |-
      De hoogte van de vergoeding die verschuldigd is door degene die een inrichting als bedoeld in
      [artikel 15.51 van de wet][ref1] drijft is de uitkomst van de formule:

      V = ((Et – Er) x P) x (Eb/Et),

      waarin voorstelt:

      V: de door de inrichting verschuldigde vergoeding;

      Et: de door de inrichtingen, bedoeld in [artikel 15.51 van de wet][ref2], in het kalenderjaar gezamenlijk
      geëmitteerde hoeveelheid CO uitgedrukt in tonnen;

      Er: de door Onze Minister in overeenstemming met Onze Minister van Economische Zaken, Landbouw en Innovatie
      vastgestelde hoeveelheid emissies, bedoeld in [artikel 15.51 van de wet][ref3], uitgedrukt in tonnen;

      P: het bedrag in euro per ton geëmitteerde CO;

      Eb: de door de inrichting in het kalenderjaar geëmitteerde hoeveelheid CO uitgedrukt in tonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15.51
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15.51
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel15.51
    url: https://wetten.overheid.nl/BWBR0030463/2015-01-01#Artikel3
