  - number: '4'
    text: |-
      Bij regeling van Onze Minister van Economische Zaken worden nadere regels vastgesteld inzake:

      a. de gegevens die degene die een inrichting als bedoeld in [artikel 15.51 van de wet][ref1] drijft, verstrekt in
      het kader van de uitvoering van [titel 15.13 van de wet][ref2];

      b. het vaststellen van de waarde van V, Et, P en Eb, bedoeld in [artikel 3][ref3].


