    text: |-
      In dit besluit wordt verstaan onder wet: [Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0030463/2015-01-01#Artikel1
