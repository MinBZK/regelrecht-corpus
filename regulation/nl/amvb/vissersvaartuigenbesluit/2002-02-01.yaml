    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.7'
    text: |-
      De radiotelegrafie-installatie moet voorzieningen bevatten voor radiotelefonie-uitzendingen en ontvangst
      op de radiotelefonienoodfrequentie alsmede voor het testen van de goede werking van de radiotelefonie-
      alarmseingever, bedoeld in het achtste lid, onder 4. Aan deze eis kan worden voldaan door zulke voorzieningen
      op te nemen in de hoofd- of reserve-installatie of in andere geïnstalleerde apparatuur. Het zendvermogen en
      de ontvangstgevoeligheid van het radiotelefoniegedeelte van de installatie moeten voldoen aan het bepaalde in
      artikel 267, derde lid, onder 1, onderscheidenlijk artikel 267, zesde lid, indien dat gedeelte is aangebracht
      op of na 1 september 1986. Van installaties die vóór die datum zijn aangebracht, moeten bedoeld zendvermogen en
      ontvangstgevoeligheid zodanig zijn als bepaald door het Hoofd van de Scheepvaartinspectie. De plaats van en de
      overige voorwaarden voor de in dit artikel vereiste radiotelefonievoorzieningen moeten zodanig zijn als bepaald
      door het Hoofd van de Scheepvaartinspectie, behalve wanneer deze voorzieningen een onderdeel vormen van de hoofd-
      of reserveradiotelegrafie-installatie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.8'
    text: |-
      De hoofd- en de reserve-ontvangers moeten de radiotelegrafienoodfrequentie en de door het Radioreglement voor die
      frequentie aangewezen klassen van uitzending kunnen ontvangen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.8'
    text: |-
      Bovendien moet de hoofdontvanger in staat zijn de frequenties en klassen van uitzending te ontvangen waarop
      tijdseinen, meteorologische berichten en de door het Hoofd van de Scheepvaartinspectie noodzakelijk geachte
      mededelingen betreffende de veiligheid van de scheepvaart worden uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.8'
    text: |-
      De radiotelefonieluisterwachtontvanger moet vast zijn afgestemd op de radiotelefonienoodfrequentie. De ontvanger
      moet met een filter zijn uitgerust of met een voorziening waardoor het mogelijk is dat de luidspreker alleen
      een ontvangen radiotelefonie-alarmsein of een sein voor zeer belangrijke waarschuwingen betreffende de navigatie
      weergeeft. Het filter of de voorziening moet gemakkelijk kunnen worden ingeschakeld wanneer naar het oordeel van
      de kapitein de omstandigheden zodanig zijn dat het onderhouden van de luisterwacht de veilige navigatie van het
      vaartuig in gevaar zou brengen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.8'
    text: |-
      De ingevolge het zevende lid, onder 2, vereiste voorziening voor radiotelefonie-uitzendingen moet zijn uitgerust
      met een inrichting voor het automatisch opwekken van het radiotelefonie-alarmsein. Deze inrichting moet zodanig
      zijn uitgevoerd dat zij niet bij vergissing in werking kan worden gesteld en moet voldoen aan de eisen gesteld
      in artikel 267, vijfde lid. De inrichting moet te allen tijde buiten werking kunnen worden gesteld teneinde de
      onmiddellijke uitzending van een noodbericht mogelijk te maken. Voor installaties die zijn aangebracht vóór 1
      september 1986, moet het aanbrengen van een inrichting voor het automatisch opwekken van het radiotelefonie-
      alarmsein geschieden zoals bepaald door het Hoofd van de Scheepvaartinspectie. De goede werking van de inrichting
      moet periodiek worden gecontroleerd op andere frequenties dan de radiotelefonienoodfrequentie, waarbij gebruik moet
      worden gemaakt van een doelmatig geïnstalleerde kunstantenne. Voor bestaande installaties dient gebruik te worden
      gemaakt van een geschikte kunstantenne.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.9'
    text: |-
      De hoofdontvanger moet voldoende gevoeligheid hebben om tekens hoorbaar te maken in een hoofdtelefoon of een
      luidspreker, wanneer de ingangsspanning aan de ontvanger niet meer is dan 50 microvolt. De reserve-ontvanger moet
      voldoende gevoeligheid hebben om tekens hoorbaar te maken, wanneer de ingangsspanning aan de ontvanger niet meer is
      dan 100 microvolt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.10'
    text: |-
      Te allen tijde moet buitengaats een elektrische krachtbron beschikbaar zijn van voldoende vermogen, om zowel
      de hoofdinstallatie over de ingevolge het zevende lid, onder 1, vereiste reikwijdte te doen werken als om alle
      batterijen die deel uitmaken van het radiotelegraafstation te laden. De voedingsspanning voor de hoofdinstallatie
      moet constant worden gehouden binnen + en - 10 percent van de nominale spanning.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.11'
    text: |-
      De reserve-installatie moet zijn voorzien van een krachtbron die onafhankelijk is van de voortstuwings- en
      elektrische installatie van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.12'
    text: |-
      De reservekrachtbron moet bij voorkeur bestaan uit accumulatorenbatterijen die mogen worden geladen door het
      scheepsnet; hij moet onder alle omstandigheden snel in werking kunnen worden gesteld en moet naast elk der in
      het dertiende en veertiende lid genoemde extra belastingen, de reservezender en -ontvanger gedurende ten minste 6
      achtereenvolgende uren onder normale gebruiksomstandigheden kunnen voeden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.13'
    text: |-
      De reservekrachtbron moet worden gebruikt voor voeding van de reserve-installatie en de automatische
      alarmseingever, bedoeld in het achttiende lid, indien deze elektrisch werkt. De reservekrachtbron mag ook worden
      gebruikt voor voeding van:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: 258.13.1°
    text: het radiotelegrafie-auto-alarmtoestel;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: 258.13.2°
    text: de noodverlichting, bedoeld in artikel 257, zevende lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: 258.13.3°
    text: de richtingzoeker;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: 258.13.4°
    text: de VHF radiotelefonie-installatie overeenkomstig het bepaalde in artikel 268, derde lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: 258.13.5°
    text: de inrichting voor het opwekken van het radiotelefonie-alarmsein;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: 258.13.6°
    text: de radiotelefonieluisterwachtontvanger;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: 258.13.7°
    text: de Navtexontvanger;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: 258.13.8°
    text: elk door het Radioreglement voorgeschreven apparaat voor de overgang van zenden op ontvangen en omgekeerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.14'
    text: |-
      In afwijking van het bepaalde in het dertiende lid kan het Hoofd van de Scheepvaartinspectie toestaan dat de
      reservekrachtbron wordt gebruikt voor een klein aantal noodnetten van gering vermogen, die zich uitsluitend
      bevinden in het bovenste deel van het vaartuig, zoals noodverlichting op het sloependek, echter onder voorwaarde
      dat deze netten, indien nodig, gemakkelijk kunnen worden uitgeschakeld en dat de reservekrachtbron van voldoende
      capaciteit is om aan de extra belasting te kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.15'
    text: |-
      De reservekrachtbron en het erbij behorende schakelbord moeten, buiten de ruimten voor machines van categorie A,
      zo hoog als praktisch mogelijk is in het vaartuig zijn opgesteld en gemakkelijk bereikbaar zijn voor de radio-
      officier. Het schakelbord moet zich als dit mogelijk is, in de radiohut bevinden; wanneer dit niet het geval is,
      moet het kunnen worden verlicht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.16'
    text: |-
      Buitengaats moeten de accumulatorenbatterijen, onverschillig of zij deel uitmaken van de hoofdinstallatie of van de
      reserve-installatie, dagelijks op hun volle normale lading worden gebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.17'
    text: |-
      Alle maatregelen moeten worden getroffen om de oorzaken van storing van de radio door elektrische en andere
      apparaten aan boord, voorzover dit mogelijk is, op te heffen en deze storingen te onderdrukken. Indien nodig moeten
      maatregelen worden getroffen om te waarborgen, dat de met omroepontvangers verbonden antennes de doeltreffende of
      juiste werking van de radiotelegrafie-installatie niet storen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.18'
    text: |-
      Naast een middel om het radiotelegrafie-alarmsein met de hand uit te zenden, moet een automatische radiotelegrafie-
      alarmseingever aanwezig zijn die met de hoofd- en de reservezenders het radiotelegrafie-alarmsein kan uitzenden.
      Teneinde onmiddellijke bediening van de zender met de hand mogelijk te maken, moet het apparaat te allen tijde
      buiten gebruik kunnen worden gesteld. Indien het apparaat elektrisch werkt, moet het op de reservekrachtbron kunnen
      werken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.19'
    text: |-
      Buitengaats moet de reservezender, indien niet in gebruik voor verkeer, dagelijks worden beproefd met een
      daarvoor geschikte kunstantenne en ten minste éénmaal gedurende elke reis met de reserve-antenne, indien deze is
      aangebracht. Ook de reservekrachtbron moet dagelijks worden beproefd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.20'
    text: |-
      Alle apparaten waaruit de radiotelegrafie-installatie is samengesteld, moeten bedrijfszeker zijn en zodanig zijn
      geconstrueerd, dat zij gemakkelijk voor onderhoud toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '259.1'
    text: |-
      Elk radiotelegrafie-auto-alarmtoestel, behoudens die toestellen die voor 26 mei 1965 zijn opgesteld, moet aan de
      volgende minimum eisen voldoen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel259
  - number: 259.1.1°
    text: |-
      bij afwezigheid van storing van welke aard ook, moet het zonder bijregelen met de hand in werking kunnen worden
      gesteld door elk radiotelegrafie-alarmsein, uitgezonden op de radiotelegrafienoodfrequentie door de zender van een
      overeenkomstig het Radio-reglement werkend kuststation, de zender van een telegrafie-installatie van een schip of
      vaartuig, of de zender van een telegrafie-installatie van een reddingmiddel, op voorwaarde dat de signaalsterkte
      aan de ingang van de ontvanger groter is dan 100 microvolt en kleiner dan 1 volt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel259
  - number: 259.1.2°
    text: |-
      bij afwezigheid van storing van welke aard ook, moet het in werking worden gesteld door drie of vier opeenvolgende
      strepen, indien de duur van de strepen ligt tussen 3,5 seconden en een waarde zo dicht mogelijk bij 6 seconden
      en de duur van de tussenruimte tussen de strepen ligt tussen 1,5 seconden en de laagst bereikbare waarde, die bij
      voorkeur niet kleiner moet zijn dan 10 milliseconden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel259
  - number: 259.1.3°
    text: |-
      het mag niet in werking worden gesteld door luchtstoringen of door enig signaal anders dan het radiotelegrafie-
      alarmsein, tenzij de ontvangen tekens in feite een signaal vormen, dat binnen de onder 2 aangegeven
      tolerantiegrenzen valt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel259
  - number: 259.1.4°
    text: |-
      de selectiviteit moet zodanig zijn, dat over een band van ten minste 4, doch niet meer dan 8 kHz, aan weerszijden
      van de radiotelegrafienoodfrequentie de gevoeligheid nagenoeg eenzelfde waarde heeft en buiten deze band een
      gevoeligheid die zo snel mogelijk afneemt, een en ander overeenkomstig de stand van de techniek;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel259
  - number: 259.1.5°
    text: |-
      het moet bij aanwezigheid van luchtstoringen of van storende signalen zichzelf automatisch regelen, opdat het
      binnen een redelijk korte tijd weer zo is ingesteld, dat het toestel het radiotelegrafie-alarmsein wederom kan
      onderscheiden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel259
  - number: 259.1.6°
    text: |-
      het moet, wanneer het in werking wordt gesteld door een radiotelegrafie-alarmsein, of als gevolg van een defect
      in het toestel, een onafgebroken hoorbare waarschuwing geven in de radiohut, in de slaaphut van de radio-officier
      en op de brug. Indien mogelijk moet die waarschuwing ook worden gegeven in geval een willekeurig onderdeel van het
      gehele auto-alarm-ontvangsysteem defect is. Slechts één schakelaar mag aanwezig zijn om het waarschuwingssein te
      doen ophouden en deze moet zijn aangebracht in de radiohut;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel259
  - number: 259.1.7°
    text: |-
      teneinde het toestel regelmatig te kunnen beproeven, moet het zijn voorzien van een op de
      radiotelegrafienoodfrequentie afgestemde generator en een sleutelinrichting, met behulp waarvan een
      radiotelegrafie-alarmsein van de minimale sterkte, aangeduid onder 1, kan worden gegeven. Tevens moet een
      hoofdtelefoon kunnen worden aangesloten teinde de op het radiotelegrafie-auto-alarmtoestel ontvangen tekens te
      beluisteren; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel259
  - number: 259.1.8°
    text: |-
      het moet bestand zijn tegen trillingen, vochtigheid en temperatuursverschillen, overeenkomende met die, welke zich
      onder ongunstige omstandigheden aan boord van een vaartuig op zee kunnen voordoen en het moet onder dergelijke
      omstandigheden blijven werken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel259
  - number: '259.2'
    text: |-
      Aan boord van vaartuigen die zijn uitgerust met een radiotelegrafie-auto-alarmtoestel, moet buitengaats de
      doeltreffende werking ervan ten minste éénmaal per 24 uur worden beproefd door een radio-officier. Wanneer het
      toestel niet behoorlijk werkt, moet de radio-officier dit feit aan de kapitein of de navigatie-officier van de
      wacht rapporteren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel259
  - number: '259.3'
    text: |-
      Een radio-officier moet de goede werking van de ontvanger van het radiotelegrafie-auto-alarmtoestel, aangesloten
      op zijn normale antenne, periodiek controleren door op het toestel te luisteren naar tekens, uitgezonden op de
      radiotelegrafienoodfrequentie en deze te vergelijken met de tekens die tegelijkertijd op de hoofdinstallatie op die
      frequentie worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel259
  - number: '259.4'
    text: |-
      Het radiotelegrafie-auto-alarmtoestel mag, wanneer het met een antenne is verbonden, geen invloed hebben op de
      nauwkeurigheid van de richtingzoeker.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel259
  - number: '260.1'
    text: |-
      De ingevolge artikel 283, eerste lid, vereiste richtingzoeker moet doeltreffend zijn en geschikt om seinen te
      ontvangen met een minimum ontvangerruis, zomede om peilingen te nemen waaruit de juiste richting en de ware peiling
      kunnen worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '260.2'
    text: |-
      Het toestel moet seinen kunnen ontvangen op de radiotelegrafiefrequenties die in het Radioreglement zijn aangewezen
      voor noodgevallen, voor het nemen van peilingen en voor de maritieme radiobakens.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '260.3'
    text: |-
      De richtingzoeker moet een gevoeligheid hebben, voldoende om bij afwezigheid van storing nauwkeurige peilingen te
      nemen, zelfs indien de veldsterkte van de ontvangen tekens slechts 50 microvolt per meter bedraagt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '260.4'
    text: |-
      De richtingzoeker moet, voorzover zulks praktisch uitvoerbaar is, zo zijn opgesteld, dat het op doeltreffende wijze
      nemen van peilingen zo min mogelijk wordt gestoord door mechanisch of ander lawaai.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '260.5'
    text: |-
      Het richtingzoekerantennesysteem moet, voorzover zulks praktisch uitvoerbaar is, zo zijn opgesteld, dat de
      nabijheid van andere antennes, tuig, laadbomen en andere grote metalen voorwerpen zo min mogelijk invloed heeft op
      de juiste uitkomst van de peilingen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '260.6'
    text: |-
      Tussen de richtingzoeker en de brug moet een doeltreffend tweezijdig systeem voor oproep en mondeling contact
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '260.7'
    text: De richtingzoeker moet vrij zijn van mechanische en elektrische storingen die de goede werking beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '260.8'
    text: |-
      Het peilraam moet, voorzover zulks praktisch uitvoerbaar is, zo dicht mogelijk bij het vlak van kiel en stevens
      zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '260.9'
    text: |-
      Ter voorkoming van peilfouten dient te worden vermeden dat geleiders aan dek zodanig worden gespannen of met elkaar
      worden verbonden dat hierdoor grote elektrisch gesloten kringen ontstaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '260.10'
    text: |-
      Radio-apparatuur bestemd voor het peilen recht vooruit («homing») op de radiotelefonienoodfrequentie moet geschikt
      zijn voor het nemen van radiopeilingen op deze frequentie binnen een hoek van 30 graden aan elke zijde van de boeg
      zonder dat twijfel ten aanzien van de richtingszin bestaat.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '260.10'
    text: |-
      Bij de installatie en beproeving van de in dit lid bedoelde apparatuur dient goed rekening te worden gehouden met
      de desbetreffende aanbeveling van de Internationale Raadgevende Commissie inzake Radioaangelegenheden (CCIR).
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '260.10'
    text: |-
      Alle redelijke maatregelen moeten worden genomen om de in dit lid vereiste geschiktheid voor het peilen recht
      vooruit te verzekeren. In een geval waar wegens technische moeilijkheden de geschiktheid voor het peilen recht
      vooruit niet kan worden verwezenlijkt, kan het Hoofd van de Scheepvaartinspectie vrijstelling verlenen van de in
      dit lid gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '260.11'
    text: |-
      De richtingzoeker moet bij eerste opstelling aan boord door een bevoegd persoon worden gecalibreerd onder afgifte
      van een grafiek, aangevende de correctie die op de afgelezen peiling moet worden toegepast om de ware peiling ten
      opzichte van de kiellijn te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '260.12'
    text: |-
      Telkens wanneer in de positie van enige antenne, dan wel van enige constructie aan dek, veranderingen zijn
      aangebracht die de gevonden fouten van de richtingzoeker merkbaar zouden kunnen beïnvloeden, dienen deze fouten te
      worden geverifieerd door middel van controlepeilingen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '260.13'
    text: |-
      Telkens wanneer een ambtenaar van de Scheepvaartinspectie dit nodig oordeelt en in ieder geval éénmaal per jaar
      dienen de fouten van de richtingzoeker door een bevoegd persoon te worden geverifieerd, tenzij uit aantekeningen
      van de kapitein blijkt dat deze fouten door waarnemingen op zee geregeld worden geverifieerd en zij binnen
      redelijke grenzen blijven. Van de calibraties en van alle controles op de nauwkeurigheid daarvan moet aantekening
      worden gehouden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel260
  - number: '261.1'
    text: |-
      De ingevolge artikel 197, derde lid, vereiste radiotelegrafie-installatie moet een zender, een ontvanger en een
      krachtbron omvatten. Zij moet zodanig zijn uitgevoerd dat zij in geval van nood door een ongeschoold persoon kan
      worden bediend.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel261
  - number: '261.2'
    text: |-
      De zender moet op de radiotelegrafienoodfrequentie kunnen werken in een door het Radioreglement voor die frequentie
      aangewezen klasse van uitzending. De zender moet eveneens kunnen seinen op de frequentie en in de klasse van
      uitzending als in het Radioreglement voor reddingmiddelen in de banden tussen 4000 en 27 500 kHz zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel261
  - number: '261.3'
    text: |-
      De zender moet, wanneer door het Radioreglement gemoduleerde uitzending is voorgeschreven, een modulatiediepte van
      niet minder dan 70 percent en een toonfrequentie tussen 450 en 1350 Hz hebben.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel261
  - number: '261.4'
    text: |-
      Behalve met een seinsleutel voor uitzendingen met de hand moet de zender zijn uitgerust met een automatische
      seingever voor de uitzending van radiotelegrafie-alarm- en radiotelegrafienoodseinen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel261
  - number: '261.5'
    text: |-
      De zender moet bij gebruik van de vaste antenne op de radiotelegrafienoodfrequentie een minimum normale
      reikwijdte als omschreven in artikel 258, zevende lid, onder 1, van 25 zeemijlen hebben. Bij het ontbreken van een
      veldsterktemeting mag worden aangenomen, dat deze reikwijdte wordt behaald indien het produkt van de hoogte van de
      antenne boven de waterlijn en de effectieve waarde van de antennestroom 10 meter-ampères bedraagt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel261
  - number: '261.6'
    text: |-
      De ontvanger moet de radiotelegrafienoodfrequentie en de door het Radioreglement voor die frequentie aangewezen
      klassen van uitzending kunnen ontvangen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel261
  - number: '261.7'
    text: |-
      De krachtbron moet bestaan uit een accumulatorenbatterij van voldoende capaciteit om de zender onder normale
      bedrijfsomstandigheden onafgebroken gedurende 4 uren te doen werken. Indien de batterij van een type is dat moet
      worden geladen, dienen de middelen aanwezig te zijn om zulks vanuit het scheepsnet te doen geschieden. Bovendien
      moeten de nodige middelen aanwezig zijn om haar te laden, nadat de reddingboot te water is gebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel261
  - number: '261.8'
    text: |-
      Wanneer de radiotelegrafie-installatie en het in artikel 221, tweeënveertigste lid, onder 29, vereiste zoeklicht
      worden gevoed vanuit dezelfde batterij, moet deze van voldoende capaciteit zijn om ook in de extra belasting door
      het zoeklicht te kunnen voorzien.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel261
  - number: '261.9'
    text: Een vaste antenne met de middelen om deze op de grootst bereikbare hoogte op te hangen, moet aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel261
  - number: '261.10'
    text: |-
      Buitengaats moet een radio-officier wekelijks de zender met behulp van een doelmatige kunstantenne beproeven en de
      batterij, wanneer deze van een type is dat moet worden geladen, ten volle laden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel261
  - number: '262.1'
    text: |-
      Het ingevolge artikel 197, eerste lid, vereiste toestel moet een zender, een ontvanger, een antenne en een
      krachtbron omvatten. Het moet zodanig zijn uitgevoerd dat het in geval van nood door een ongeschoold persoon kan
      worden bediend.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel262
  - number: '262.2'
    text: |-
      Het toestel moet gemakkelijk draagbaar en waterdicht zijn, in zeewater kunnen drijven en zonder onklaar te raken
      in zee kunnen worden geworpen. Het toestel moet zo licht en zo compact mogelijk zijn en geschikt zijn voor gebruik
      zowel in reddingvlotten als reddingboten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel262
  - number: '262.3'
    text: |-
      De zender moet op de radiotelegrafienoodfrequentie kunnen zenden in een door het Radioreglement voor die frequentie
      aangewezen klasse van uitzending en, in de banden tussen 4000 en 27 500 kHz, op de radiotelegrafiefrequentie en
      in een klasse van uitzending als in het Radioreglement voor reddingmiddelen is aangewezen. Als vervanging van of
      aanvulling op de uitzending op de radiotelegrafiefrequentie, die door het Radioreglement voor reddingmiddelen in de
      banden tussen 4000 en 27 500 kHz is aangewezen, mag de zender ook kunnen werken op de radiotelefonienoodfrequentie
      in een door het Radioreglement voor die frequentie aangewezen klasse van uitzending.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel262
  - number: '262.4'
    text: |-
      Wanneer door het Radioreglement gemoduleerde uitzending is voorgeschreven moet de zender een modulatiediepte van
      niet minder dan 70 percent en, in geval uitgezonden wordt op radiotelegrafie, een toonfrequentie tussen 450 en 1350
      Hz hebben.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel262
  - number: '262.5'
    text: |-
      Behalve met een seinsleutel voor uitzendingen met de hand moet de zender zijn voorzien van een automatische
      seingever voor de uitzending van radiotelegrafie-alarm- en radiotelegrafienoodseinen. Wanneer met de zender kan
      worden uitgezonden op de radiotelefonienoodfrequentie, moet hij zijn voorzien van een automatische inrichting voor
      het uitzenden van het radiotelefonie-alarmsein, die voldoet aan de in artikel 267, vijfde lid, gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel262
  - number: '262.6'
    text: |-
      De ontvanger moet de radiotelegrafienoodfrequentie en de door het Radioreglement voor die frequentie aangewezen
      klassen van uitzending kunnen ontvangen. Wanneer de zender kan zenden op de radiotelefonienoodfrequentie moet de
      ontvanger ook die frequentie en een door het Radioreglement voor die frequentie aangewezen klasse van uitzending
      kunnen ontvangen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel262
  - number: '262.7'
    text: De antenne moet van het zelfdragende type zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel262
  - number: '262.8'
    text: |-
      De zender moet een voldoend hoogfrequentvermogen kunnen afgeven aan de in het eerste lid vereiste antenne. Aan
      dit voorschrift wordt voldaan indien ten minste 10 Watt aan de anode van de eindtrap of een hoogfrequentvermogen
      van 2 Watt (A 2) op 500 kHz aan een kunstantenne, bestaande uit een serieschakeling van een zuiver Ohmse weerstand
      van 15 Ohm en een capaciteit van 100 x 1012 Farad wordt geleverd. De zender moet bij voorkeur worden gevoed door
      een handgenerator; wanneer hij wordt gevoed door een batterij moet deze van een duurzaam type en van voldoende
      capaciteit zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel262
  - number: '262.9'
    text: |-
      Buitengaats moet een radio-officier of een radiotelefonist wekelijks de zender met behulp van een doelmatige
      kunstantenne beproeven en de batterij, wanneer deze van het type is dat moet worden geladen, ten volle laden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel262
  - number: '263.1'
    text: |-
      Noodradiobakens die volgens het bepaalde in artikel 197, vierde lid, in groepsreddingmiddelen moeten kunnen worden
      meegevoerd, moeten zodanig kunnen uitzenden dat daardoor vliegtuigen in staat zijn de groepsreddingmiddelen te
      lokaliseren; tevens mogen zij uitzenden ten behoeve van waarschuwingsdoeleinden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel263
  - number: '263.2'
    text: |-
      Noodradiobakens moeten ten minste seinen kunnen uitzenden die voldoen aan de van toepassing zijnde normen en
      aanbevolen praktijk van de Internationale Burgerluchtvaart Organisatie (ICAO); die seinen moeten worden uitgezonden
      hetzij afwisselend, hetzij gelijktijdig, op de frequentie 121,5 MHz en 243,0 MHz.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel263
  - number: '263.3'
    text: 'Noodradiobakens moeten:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel263
  - number: 263.3.1°
    text: |-
      een goed zichtbare kleur hebben, zodanig zijn ontworpen dat zij kunnen worden gebruikt door een onervaren persoon,
      en zodanig zijn vervaardigd dat zij gemakkelijk kunnen worden beproefd en onderhouden. Met inachtneming van de
      beproevingsprocedures, moet het niet nodig zijn dat de batterijen met tussenpozen van minder dan 12 maanden moeten
      worden vervangen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel263
  - number: 263.3.2°
    text: |-
      waterdicht zijn, kunnen drijven en vanaf een hoogte van ten minste 20 m in het water geworpen kunnen worden zonder
      dat daarbij beschadiging optreedt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel263
  - number: 263.3.3°
    text: uitsluitend met de hand in of buiten werking kunnen worden gesteld;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel263
  - number: 263.3.4°
    text: draagbaar, licht in gewicht en compact zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel263
  - number: 263.3.5°
    text: voorzien zijn van een aanwijzing dat seinen worden uitgezonden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel263
  - number: 263.3.6°
    text: |-
      hun voeding verkrijgen van een batterij die een integraal onderdeel is van het toestel, en die voldoende capaciteit
      heeft om het toestel gedurende 48 uur te laten werken. De uitzendingen mogen onderbroken zijn. Bij het vaststellen
      van de zendcyclus moet rekening worden gehouden met de kans op een goed uitvoerbare «homing», de noodzaak om
      blokkering van de frequentie te vermijden en de noodzaak te voldoen aan de voorschriften van de Internationale
      Burgerluchtvaart Organisatie (ICAO); en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel263
  - number: 263.3.7°
    text: |-
      worden beproefd met tussenpozen van niet meer dan 12 maanden, waarbij, indien noodzakelijk, de batterij moet worden
      vervangen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel263
  - number: '264'
    text: |-
      De ingevolge het bepaalde in artikel 197, vierde lid, voorgeschreven noodradiobakens moeten met tussenpozen van
      niet meer dan 12 maanden worden gekeurd, waarbij, indien noodzakelijk, de batterij moet worden vervangen. Het Hoofd
      van de Scheepvaartinspectie kan echter deze periode verlengen tot ten hoogste 17 maanden in gevallen waarin hij dat
      juist en redelijk acht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel264
  - number: '265.1'
    text: |-
      De portofoon voor groepsreddingmiddelen, voorgeschreven in artikel 197, vijfde lid, moet zodanig zijn ontworpen dat
      het toestel in een noodsituatie kan worden gebruikt door een onervaren persoon.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel265
  - number: '265.2'
    text: De portofoon moet draagbaar zijn en voor communicatie aan boord gebruikt kunnen worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel265
  - number: '265.3'
    text: |-
      De portofoon moet voldoen aan de van toepassing zijnde voorschriften die in het Radioreglement zijn gesteld ten
      aanzien van apparatuur voor gebruik aan boord in de Maritieme Mobiele Radiodienst en moet kunnen werken op de
      kanalen, aangegeven in het Radioreglement, en op de kanalen die door het Hoofd van de Scheepvaartinspectie worden
      voorgeschreven. Indien de portofoon kan werken op de bij kanaal 16 behorende frequentie in de VHF-band, moeten
      maatregelen zijn genomen om ongewilde overschakeling naar kanaal 16 te voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel265
  - number: '265.4'
    text: |-
      De portofoon moet gevoed worden door een batterij die voldoende capaciteit heeft om het toestel gedurende 4 uur te
      laten werken met een zendcyclus van 1 : 9.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel265
  - number: '265.5'
    text: |-
      Gedurende de reis moet de portofoon in deugdelijke toestand worden gehouden en moet, wanneer nodig, de batterij
      volledig opgeladen of vervangen worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel265
  - number: '266.1'
    text: |-
      Het radiotelefoonstation moet zo veilig mogelijk in het bovenste deel van het vaartuig zijn gelegen en zodanig zijn
      opgesteld, dat het in de grootst mogelijke mate beschermd is tegen lawaai dat aan de goede ontvangst van berichten
      en seinen afbreuk zou kunnen doen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel266
  - number: '266.2'
    text: Er moet een doeltreffende verbinding zijn tussen het radiotelefoonstation en de brug.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel266
  - number: '266.3'
    text: |-
      Een betrouwbaar uurwerk moet op een zodanige plaats vast zijn aangebracht, dat de gehele wijzerplaat gemakkelijk
      vanaf de bedieningsplaats van de radiotelefonie-installatie kan worden waargenomen. Op de wijzerplaat, waarvan
      de diameter niet minder dan 125 mm mag bedragen, moeten de door het Radioreglement voor de radiotelefoondienst
      voorgeschreven stilteperioden zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel266
  - number: '266.4'
    text: |-
      Er moet een betrouwbare noodverlichting aanwezig zijn, onafhankelijk van het systeem waaruit de normale verlichting
      van de radiotelefonie-installatie wordt gevoed en zodanig vast aangebracht, dat zij de bedieningsknoppen van
      de radiotelefonie-installatie, het in het derde lid vereiste uurwerk en de in het zesde lid vereiste instructie
      behoorlijk kan verlichten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel266
  - number: '266.5'
    text: |-
      Wanneer de krachtbron uit een batterij of uit batterijen bestaat, moet het radiotelefoonstation zijn uitgerust met
      een middel om de ladingtoestand daarvan te controleren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel266
  - number: '266.6'
    text: |-
      Een instructie die een duidelijke samenvatting geeft van de radiotelefonienoodprocedure, moet aanwezig zijn en
      zodanig zijn opgehangen, dat zij vanaf de plaats waar de radiotelefonie-installatie wordt bediend, geheel zichtbaar
      is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel266
  - number: '266.7'
    text: |-
      Het radiotelefoonstation moet zijn uitgerust met die reserve-onderdelen en gereedschappen, die naar het oordeel
      van het Hoofd van de Scheepvaartinspectie nodig zijn om de radiotelefonie-installatie buitengaats in doeltreffende
      staat te houden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel266
  - number: '266.8'
    text: |-
      Het radiotelefoonstation moet zijn uitgerust met middelen ter bestrijding van brand, zoals aangegeven in de
      artikelen 157, zevende lid, en 180, zevende lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel266
  - number: '267.1'
    text: |-
      De radiotelefonie-installatie moet een zender, een ontvanger, een radiotelefonie-luisterwachtontvanger en een voor
      het doel passende krachtbron omvatten, als nader voorgeschreven in de volgende leden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: '267.2'
    text: |-
      De zender moet kunnen zenden op de radiotelefonienoodfrequentie en op ten minste één andere frequentie in de banden
      tussen 1605 en 2850 kHz in de door het Radioreglement voor deze frequenties aangewezen klassen van uitzending.
      Bij normaal gebruik moet de modulatie van een enkelzijbanduitzending met volledige draaggolf ten minste 70 percent
      bedragen bij maximaal uitgestraald vermogen. De modulatie van een enkelzijbanduitzending met verminderde of
      onderdrukte draaggolf moet zodanig zijn dat de intermodulatieprodukten de in het Radioreglement vermelde waarden
      niet overschrijden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: '267.3'
    text: |-
      Aan boord van een vaartuig waarvan de lengte 35 m of meer, doch minder dan 75 m bedraagt, moet de zender een
      minimum normale reikwijdte hebben van 150 zeemijlen; daarbij moet hij in staat zijn duidelijk waarneembare
      seinen van schip tot schip, bij dag en onder normale condities en omstandigheden over dit bereik over te brengen.
      Duidelijk waarneembare seinen zullen in normale omstandigheden worden ontvangen wanneer de effectieve waarde
      van de door de ongemoduleerde draaggolf opgewekte veldsterkte bij de ontvanger ten minste 25 microvolt per meter
      is voor enkelzijbanduitzendingen met volledige draaggolf. Wanneer geen directe meting van de veldsterkte kan
      worden uitgevoerd, mag worden aangenomen dat deze reikwijdte zal worden verkregen wanneer een maximaal omhullend
      vermogen van 60 Watt, voor enkelzijbanduitzendingen met volledige draaggolf en 100 percent gemoduleerd door een
      enkelvoudige, sinusvormige trilling, wordt toegevoerd aan de antenne.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: '267.3'
    text: |-
      Aan boord van een vaartuig waarvan de lengte minder dan 35 m bedraagt, moet de zender een minimum normale
      reikwijdte hebben van ten minste 75 zeemijlen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: '267.4'
    text: |-
      De zender moet zijn uitgerust met een inrichting voor het automatisch opwekken van het radiotelefonie-alarmsein.
      Deze inrichting moet zodanig zijn uitgevoerd dat zij niet bij vergissing in werking kan worden gesteld. De
      inrichting moet te allen tijde buiten werking kunnen worden gesteld, teneinde onmiddellijke uitzending van een
      noodbericht mogelijk te maken. De goede werking van de inrichting moet periodiek worden gecontroleerd op andere
      frequenties dan de radiotelefonienoodfrequentie, waarbij van een doelmatig geïnstalleerde kunstantenne gebruik moet
      worden gemaakt. Voor bestaande installaties dient gebruik te worden gemaakt van een geschikte kunstantenne.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: '267.5'
    text: 'De in het vierde lid voorgeschreven inrichting moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: 267.5.1°
    text: de frequentietolerantie voor elk der tonen mag + of - 1,5 percent zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: 267.5.2°
    text: de tolerantie in de duur van elke toon mag + of - 50 milliseconden zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: 267.5.3°
    text: de pauze tussen opeenvolgende tonen mag niet groter zijn dan 50 milliseconden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: 267.5.4°
    text: de verhouding tussen de amplituden van de sterkste en van de zwakste toon moet liggen tussen 1 en 1,2.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: '267.6'
    text: |-
      De ingevolge het eerste lid vereiste ontvanger moet de radiotelefonienoodfrequentie kunnen ontvangen en ten minste
      één andere frequentie die beschikbaar is voor radiotelefoonstations voor de scheepvaart in de banden tussen 1605
      en 2850 kHz in de door het Radioreglement voor deze frequenties aangewezen klassen van uitzending. Bovendien
      moet de ontvanger de frequenties en de door het Radioreglement voor deze frequenties aangewezen klassen van
      uitzending kunnen ontvangen, waarop meteorologische berichten en andere door het Hoofd van de Scheepvaartinspectie
      noodzakelijk geachte berichten betreffende de veiligheid van de scheepvaart worden uitgezonden. De ontvanger moet
      voldoende gevoeligheid hebben om seinen hoorbaar te maken in een luidspreker, wanneer de ingangsspanning aan de
      ontvanger niet meer is dan 50 microvolt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: '267.7'
    text: |-
      De radiotelefonieluisterwachtontvanger moet vast zijn afgestemd op de radiotelefonienoodfrequentie. De ontvanger
      moet met een filter zijn uitgerust of met een voorziening waardoor het mogelijk is dat de luidspreker op de brug
      alleen een ontvangen radiotelefonie-alarmsein of een sein voor zeer belangrijke waarschuwingen betreffende de
      navigatie weergeeft. Het filter of de voorziening moet gemakkelijk kunnen worden ingeschakeld wanneer naar het
      oordeel van de kapitein de omstandigheden zodanig zijn dat het onderhouden van de luisterwacht de veilige navigatie
      van het vaartuig in gevaar zou brengen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: '267.8'
    text: |-
      Om snelle overgang van zenden op ontvangen mogelijk te maken moet, wanneer regeling met de hand wordt toegepast, de
      omschakelinrichting op de microfoon- of op het microtelefoonhandvat zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: '267.9'
    text: |-
      Buitengaats moet te allen tijde een hoofdkrachtbron van voldoende vermogen beschikbaar zijn om de installatie
      over de ingevolge het derde lid vereiste normale reikwijdte te doen werken. Een reservekrachtbron moet,
      buiten de ruimten voor machines van categorie A, in het bovenste deel van het vaartuig zijn opgesteld, tenzij
      de hoofdkrachtbron reeds aldaar is geplaatst. Indien voor de reservekrachtbron batterijen worden gebruikt,
      moeten deze onder alle omstandigheden voldoende capaciteit hebben om de zender en de ontvanger onder normale
      gebruiksomstandigheden gedurende ten minste 6 uren ononderbroken te kunnen doen werken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: '267.10'
    text: |-
      Behoudens het bepaalde in het elfde lid mag de eventueel aanwezige reservekrachtbron alleen worden gebruikt voor de
      voeding van:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: 267.10.1°
    text: de radiotelefonie-installatie;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: 267.10.2°
    text: de ingevolge artikel 266, vierde lid, vereiste noodverlichting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: 267.10.3°
    text: de ingevolge het vierde lid vereiste inrichting voor het opwekken van het radiotelefonie-alarmsein;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: 267.10.4°
    text: de VHF radiotelefonie-installatie overeenkomstig het bepaalde in artikel 268, derde lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: 267.10.5°
    text: de radiotelefonieluisterwachtontvanger; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: 267.10.6°
    text: de Navtexontvanger.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: '267.11'
    text: |-
      In afwijking van het bepaalde in het tiende lid kan het Hoofd van de Scheepvaartinspectie het gebruik van de
      eventueel aanwezige reservekrachtbron ook toestaan voor de voeding van een richtingzoeker, indien aanwezig, en voor
      één of meer noodnetten van gering vermogen, die zich uitsluitend bevinden in het bovenste deel van het vaartuig,
      zoals de noodverlichting van het sloependek, echter onder voorwaarde dat deze extra belastingen gemakkelijk kunnen
      worden uitgeschakeld en dat de reservekrachtbron van voldoende capaciteit is om aan deze extra belastingen te
      kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: '267.12'
    text: |-
      Teneinde aan de eisen van het negende lid te kunnen voldoen moet buitengaats elke aanwezige batterij in geladen
      toestand worden gehouden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: '267.13'
    text: |-
      Een antenne moet zijn aangebracht en moet, indien hij is opgehangen tussen steunpunten die aan zwiepen onderhevig
      zijn, tegen breuk zijn beveiligd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel267
  - number: '268.1'
    text: |-
      De VHF radiotelefonie-installatie moet in het bovenste gedeelte van het vaartuig zijn opgesteld en moet omvatten
      een zender, een ontvanger, een krachtbron die deze zender en ontvanger op hun toelaatbare vermogens kan doen
      werken, en een antenne die geschikt is voor doeltreffende uitstraling en ontvangst van signalen op de frequenties
      waarop wordt gewerkt. Voorts moet worden voldaan aan het bepaalde in de volgende leden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel268
  - number: '268.2'
    text: |-
      De in het bovenste gedeelte van het vaartuig opgestelde krachtbron bedoeld in het eerste lid, moet voldoende
      capaciteit hebben om de VHF radiotelefonie-installatie gedurende ten minste 6 uren te laten werken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel268
  - number: '268.3'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan toestaan gebruik te maken van de reservekrachtbron voor de
      radiotelegrafie- of radiotelefonie-installatie, vermeld in artikel 258, dertiende lid, onderscheidenlijk artikel
      267, tiende lid, om de VHF radiotelefonie-installatie te voeden. In dit geval moet de reservekrachtbron voldoende
      capaciteit hebben om de VHF radiotelefonie-installatie gedurende ten minste 6 uren gelijktijdig te laten werken
      met:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel268
  - number: 268.3.1°
    text: de reserveradiotelegrafiezender en -ontvanger; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel268
  - number: 268.3.2°
    text: |-
      de radiotelefoniezender en -ontvanger; tenzij een schakelapparaat is aangebracht om te verzekeren dat zij slechts
      beurtelings werken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel268
  - number: '268.4'
    text: |-
      De VHF radiotelefonie-installatie moet voldoen aan de eisen die in het Radioreglement zijn gesteld ten aanzien
      van apparatuur voor gebruik in de Maritieme Mobiele VHF Radiotelefoondienst en moet kunnen werken op de kanalen,
      aangegeven in het Radioreglement, en op de kanalen die nader kunnen worden voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel268
  - number: '268.5'
    text: |-
      Het uitgangsvermogen van de draaggolf van de zender behoeft niet groter te zijn dan 10 Watt. Voorzover zulks
      praktisch uitvoerbaar is, moet de antenne een onbelemmerd zicht hebben in alle richtingen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel268
  - number: '268.6'
    text: |-
      De VHF-kanalen bestemd voor de veiligheid van de navigatie moeten op de brug, op de plaats waar de navigatie-orders
      worden gegeven, kunnen worden bediend en waar nodig dienen zodanige voorzieningen te zijn getroffen dat vanaf de
      brugvleugels radioverbindingen kunnen worden onderhouden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel268
  - number: '269.1'
    text: |-
      Voor zover in dit hoofdstuk radiotoestellen zijn genoemd, die niet behoren tot de eigenlijke radiotelegrafie-
      of radiotelefonie-installatie en waarbij niet in het bijzonder is aangegeven dat daarvoor reserve-onderdelen
      en gereedschappen aan boord dienen te worden meegevoerd, moeten de in artikel 257, negende lid en artikel 266,
      zevende lid, voor radiotelegraaf- onderscheidenlijk radiotelefoonstations voorgeschreven reserve-onderdelen en
      gereedschappen tevens die omvatten, welke naar het oordeel van het Hoofd van de Scheepvaartinspectie voor het
      buitengaats onderhouden van de goede werking van bedoelde radiotoestellen nodig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel269
  - number: '269.2'
    text: |-
      Deze bepaling geldt mede ten aanzien van niet in dit hoofdstuk genoemde radiotoestellen, die als niet-
      voorgeschreven uitrusting aan boord van een vaartuig zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel269
  - number: '270.1'
    text: |-
      Aan boord van een vaartuig dat is uitgerust met een radiotelegraafstation moet een dagboek bestemd voor
      radiotelegrafie, in dit artikel verder te noemen radiodagboek, aanwezig zijn, dat gedurende de reis in de radiohut
      moet worden bewaard. Iedere radio-officier moet zijn naam, de tijden waarop hij op wacht komt en van wacht gaat
      en alle met de radiodienst verband houdende voorvallen die zich tijdens de wacht voordoen en die van belang kunnen
      zijn voor de beveiliging van mensenlevens op zee, in het radiodagboek vermelden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: '270.2'
    text: |-
      In het radiodagboek moet, naast hetgeen daarin krachtens het Radioreglement moet worden ingevuld, het volgende
      worden opgenomen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: 270.2.1°
    text: nauwkeurige gegevens omtrent het onderhoud en het laden van de accumulatorenbatterijen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: 270.2.2°
    text: |-
      dagelijks, een verklaring inhoudende dat alle tot de hoofd- en de reserve-installatie behorende
      accumulatorenbatterijen ten volle zijn geladen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: 270.2.3°
    text: |-
      dagelijks een nauwkeurige aantekening omtrent het die dag beproeven of voor het verkeer benutten van de
      reservezender en van de reservekrachtbron;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: 270.2.4°
    text: dagelijks, bijzonderheden omtrent elke beproeving van het aan boord aanwezige radiotelegrafie-auto-alarmtoestel;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: 270.2.5°
    text: |-
      wekelijks, nauwkeurige gegevens omtrent het onderhoud en het laden van de accumulatorenbatterijen behorende tot de
      radiotelegrafie-installatie in een reddingboot, indien die batterijen van een type zijn dat laden vereist;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: 270.2.6°
    text: wekelijks, bijzonderheden omtrent het beproeven van de radiotelegrafie-installatie in een motorreddingboot;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: 270.2.7°
    text: wekelijks, bijzonderheden omtrent het beproeven van het draagbare radiotoestel voor groepsreddingmiddelen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: 270.2.8°
    text: bijzonderheden met betrekking tot de richtingzoeker;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: 270.2.9°
    text: ten minste éénmaal per reis, bijzonderheden omtrent beproeving van de reserve-antenne;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: 270.2.10°
    text: |-
      de tijden gedurende welke luisterdienst als bedoeld in artikel 254 is gehouden. Deze aantekeningen moeten door hen
      die deze luisterdienst verrichten, worden ondertekend;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: 270.2.11°
    text: |-
      het tijdstip waarop de luisterdienst werd onderbroken overeenkomstig het bepaalde in artikel 254, alsmede de reden
      voor onderbreking en het tijdstip waarop de luisterdienst werd hervat; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: 270.2.12°
    text: |-
      de namen van alle personen, die met de radiotelegraafdienst zijn belast, waarbij aangegeven de naam van degene die
      als chef van het radiostation is aangewezen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: '270.3'
    text: |-
      In geval met betrekking tot het onderhoud en het laden der accumulatorenbatterijen, als bedoeld in het tweede lid,
      onder 1 en 5, afzonderlijke, door of namens het Hoofd van de Scheepvaartinspectie aanvaarde accumulatorenrapporten
      worden bijgehouden, kan daarnaar in het radiodagboek worden verwezen. Deze rapporten maken in dat geval deel uit
      van het radiodagboek en zijn onderworpen aan de op het radiodagboek van toepassing zijnde voorschriften.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: '270.4'
    text: Radiodagboeken moeten op verzoek van een ambtenaar van de Scheepvaartinspectie aan hem ter inzage worden gegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel270
  - number: '271'
    text: |-
      Het dagboek bestemd voor radiotelegrafie, als bedoeld in artikel 270, eerste lid, moet zijn uitgevoerd
      overeenkomstig het model als vastgesteld door het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel271
  - number: '272.1'
    text: |-
      Aan boord van een vaartuig dat is uitgerust met een radiotelefoonstation, moet een dagboek bestemd voor
      radiotelefonie, in dit artikel verder te noemen radiodagboek, aanwezig zijn, dat gedurende de reis moet worden
      bewaard op de plaats waar de luisterdienst wordt onderhouden. Wanneer een radio-officier of radiotelefonist, dan
      wel een ander lid van de bemanning de voorgeschreven radiotelefonieluisterdienst uitoefent, moet deze zijn naam en
      de bijzonderheden van alle zich tijdens de wacht voordoende, met de radiodienst verband houdende voorvallen die van
      belang kunnen zijn voor de beveiliging van mensenlevens op zee, in het radiodagboek vermelden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel272
  - number: '272.2'
    text: |-
      In het radiodagboek moet, naast hetgeen daarin krachtens het Radioreglement moet worden ingevuld, het volgende
      worden opgenomen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel272
  - number: 272.2.1°
    text: |-
      de tijden gedurende welke luisterdienst als bedoeld in artikel 255 is gehouden. Deze aantekeningen moeten door hen
      die de luisterdienst hebben verricht, worden ondertekend;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel272
  - number: 272.2.2°
    text: |-
      het tijdstip waarop bij het verlaten van een haven de luisterdienst begint en het tijdstip waarop bij het
      binnenlopen van een haven die dienst wordt beëindigd;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel272
  - number: 272.2.3°
    text: |-
      het tijdstip waarop om enigerlei reden de luisterdienst wordt onderbroken, de reden voor die onderbreking en het
      tijdstip waarop de luisterdienst wordt hervat;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel272
  - number: 272.2.4°
    text: nauwkeurige gegevens omtrent het onderhoud en het laden van de accumulatorenbatterijen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel272
  - number: 272.2.5°
    text: wekelijks, bijzonderheden omtrent het beproeven van het draagbare radiotoestel voor groepsreddingmiddelen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel272
  - number: 272.2.6°
    text: bijzonderheden met betrekking tot de richtingzoeker.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel272
  - number: '272.3'
    text: |-
      In geval met betrekking tot het onderhoud en het laden der accumulatorenbatterijen, als bedoeld in het tweede lid,
      onder 4, afzonderlijke, door of namens het Hoofd van de Scheepvaartinspectie aanvaarde, accumulatorenrapporten
      worden bijgehouden, kan daarnaar in het Radiodagboek worden verwezen. Deze rapporten maken in dat geval deel uit
      van het radiodagboek en zijn onderworpen aan de op het radiodagboek van toepassing zijnde voorschriften.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel272
  - number: '272.4'
    text: Radiodagboeken moeten op verzoek van een ambtenaar van de Scheepvaartinspectie aan hem ter inzage worden gegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel272
  - number: '273'
    text: |-
      Het dagboek bestemd voor radiotelefonie, als bedoeld in artikel 272, eerste lid, moet zijn uitgevoerd
      overeenkomstig het model als vastgesteld door het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel273
  - number: '274'
    text: |-
      Aan boord van een vaartuig dat is uitgerust met een VHF-radiotelefoonstation is ten aanzien van het radiodagboek
      het bepaalde in de artikelen 272 en 273 van overeenkomstige toepassing, met dien verstande dat een samenvatting van
      alle berichtenwisseling betreffende nood-, spoed-en veiligheidsverkeer moet worden opgenomen in het scheepsdagboek.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel274
  - number: '275'
    text: |-
      Het bepaalde in de artikelen 277, 278, tweede lid, 279 tot en met 281, 282, tweede en derde lid, 283 en 284 is niet
      van toepassing op een vaartuig dat gesleept naar zijn bestemming wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel275
  - number: '276.1'
    text: |-
      Aan boord van elk vaartuig moeten de inrichting en indeling van de brug, alsmede de plaatsing van de daar
      opgestelde apparatuur, zodanig zijn dat een doelmatige en veilige navigatie mogelijk is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel276
  - number: '276.2'
    text: 'De plaats van de brug dient zodanig te zijn gekozen dat:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel276
  - number: 276.2.1°
    text: de roerganger vanaf de plaats waar het vaartuig wordt bestuurd een vrij uitzicht over het voorschip heen heeft;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel276
  - number: 276.2.2°
    text: het uitzicht rondom voldoende is om veilig te kunnen manoeuvreren en navigeren; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel276
  - number: 276.2.3°
    text: |-
      de scheepszijden vanaf de brug waarneembaar zijn, tenzij de bedrijfsvoering zich hiertegen verzet. In dat geval kan
      het Hoofd van de Scheepvaartinspectie toestaan dat de brug niet over de gehele breedte van het vaartuig doorloopt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel276
  - number: '276.3'
    text: |-
      Aan boord van een vaartuig dat is voorzien van een automatische stuurinrichting moet op de brug een
      wachtalarminstallatie van een goedgekeurd type zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel276
  - number: '276.4'
    text: |-
      Degene die de lieren bedient heeft goed zicht op deze lieren en op de bemanningsleden die daarmee aan het werk
      zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel276
  - number: '276.5'
    text: Voor de communicatie tussen de brug en het werkdek wordt gebruik gemaakt van een betrouwbaar communicatiesysteem.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel276
  - number: '276.6'
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van het bepaalde in het eerste tot en met het vijfde lid nadere regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel276
  - number: '277.1'
    text: |-
      Aan boord van een vaartuig, waarvan de lengte minder dan 75 m bedraagt, dat is gebouwd vóór 1 september 1984
      en aan boord van een vaartuig waarvan de lengte minder dan 45 m bedraagt, dat is gebouwd op of na 1 september
      1984 moeten ten minste twee vast opgestelde magnetische kompassen aanwezig zijn. Op een van deze kompassen, het
      standaardkompas, moet gepeild en op het andere, het stuurkompas, moet gestuurd kunnen worden. Van deze magnetische
      kompassen mag het stuurkompas worden vervangen door een gyrokompas dat is opgesteld op de wijze als bepaald in het
      tweede lid, onder 1, met dien verstande dat in een dergelijk geval op het standaardkompas tevens moet kunnen worden
      gestuurd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.1'
    text: |-
      In afwijking van het bepaalde in 1.1 kan aan boord van een vaartuig dat een door het Hoofd van de
      Scheepvaartinspectie vast te stellen gebied bevaart, worden volstaan met een vast opgesteld magnetisch
      standaardkompas, waarop zowel kan worden gepeild als gestuurd. Op dit kompas behoeft evenwel niet te kunnen worden
      gepeild indien een naar het oordeel van het Hoofd van de Scheepvaartinspectie gelijkwaardig, elektronisch middel
      tot plaatsbepaling alsmede een radarinstallatie van een goedgekeurd type aanwezig is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.1'
    text: |-
      Aan boord van een vaartuig waarvan de lengte minder dan 45 m bedraagt, moet, indien het vaartuig bestemd is om op
      breedten gebruikt te worden waar de horizontale component van het totale aardmagnetisch veld te gering is om een
      voldoende richtkracht aan het magnetisch kompas te geven, een gyrokompas zijn opgesteld, op de wijze als bepaald in
      het tweede lid, onder 1.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.2'
    text: |-
      Aan boord van een vaartuig waarvan de lengte meer dan 75 m bedraagt, dat is gebouwd vóór 1 september 1984 en aan
      boord van een vaartuig waarvan de lengte 45 m of meer bedraagt, dat is gebouwd op of na 1 september 1984 moet ten
      minste een vast opgesteld magnetisch standaardkompas aanwezig zijn waarop zowel kan worden gepeild als gestuurd.
      Tevens moet een gyrokompas aanwezig zijn, dat voldoet aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: 277.2.1°
    text: |-
      het gyro-moederkompas of een gyro-dochterkompas moet duidelijk afleesbaar zijn voor de roerganger op de plaats waar
      gewoonlijk wordt gestuurd; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: 277.2.2°
    text: |-
      aan boord van een vaartuig waarvan de lengte 75 m of meer bedraagt moeten bovendien gyro-dochterkompassen aanwezig
      zijn, zodanig dat doelmatig peilingen kunnen worden genomen over een boog van de horizon van 360 graden, voor zover
      praktisch uitvoerbaar.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.3'
    text: |-
      De in het eerste en tweede lid voorgeschreven magnetische kompassen moeten doelmatig zijn en dienen in het vlak van
      kiel en stevens te zijn opgesteld. De opstellingsplaatsen van alle kompassen moeten doelmatig zijn en zodanig zijn
      gekozen, dat deze instrumenten, rekening houdend met het doel waarvoor zij worden gebruikt, geen onaanvaardbare
      storing ondervinden van in hun nabijheid geplaatste ijzermassa’s en elektrische leidingen. Hiertoe moeten in
      het ontwerpstadium van het vaartuig aanwijzingen worden gevraagd van het Hoofd van de Scheepvaartinspectie.
      Deze aanwijzingen dienen eveneens te worden gevraagd indien aan het vaartuig of uitrusting wijzigingen worden
      aangebracht die invloed kunnen hebben op de goede werking van deze magnetische kompassen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.3'
    text: |-
      Bij de aanleg van elektrische leidingen in de nabijheid van magnetische kompassen moet rekening worden gehouden met
      het daaromtrent bepaalde in artikel 101.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.3'
    text: |-
      Ter plaatse van een magnetisch kompas waarop moet kunnen worden gepeild, behoort een vrij uitzicht te zijn over een
      boog van de horizon van, voor zover uitvoerbaar, 360 graden, doch in ieder geval van niet minder dan 230 graden,
      gerekend van recht vooruit tot 25 graden achterlijker dan dwars aan elke zijde.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.4'
    text: |-
      Elk magnetisch kompas moet zijn voorzien van een certificaat, afgegeven door een door het Hoofd van de
      Scheepvaartinspectie erkende deskundige.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.5'
    text: |-
      Elk magnetisch kompas en elk gyrokompas moet van een goedgekeurd type zijn en voldoen aan de door het Hoofd van de
      Scheepvaartinspectie ter zake gestelde regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.6'
    text: |-
      De horizontale en vertikale scheepsmagnetische storingsvelden ter plaatse van de magnetische kompassen moeten door
      een bevoegd persoon behoorlijk zijn gecompenseerd, onder afgifte van een foutentabel voor elk magnetisch kompas.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.6'
    text: Bij elk magnetisch kompas dient een foutentabel aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.6'
    text: |-
      Telkenmale wanneer zich omstandigheden hebben voorgedaan die van invloed kunnen zijn op de gevonden fouten dient
      hercompensatie plaats te vinden door een bevoegd persoon.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.6'
    text: |-
      Telkenmale wanneer een ambtenaar van de Scheepvaartinspectie dit nodig oordeelt en in ieder geval eenmaal per
      jaar dienen de fouten van elk magnetisch kompas door een bevoegd persoon te worden geverifieerd, tenzij uit
      aantekeningen van de kapitein blijkt dat deze fouten door waarnemingen op zee geregeld worden geverifieerd en zij
      binnen redelijke grenzen blijven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.6'
    text: |-
      Indien de verificaties als bedoeld onder 6.4 naar het oordeel van een ambtenaar van de Scheepvaartinspectie daartoe
      aanleiding geven, dient hercompensatie ten behoeve van het magnetische kompas door een bevoegd persoon plaats te
      vinden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.6'
    text: |-
      De aanwijzing van de onder 6.1, 6.3, 6.4 en 6.5 bedoelde bevoegde personen geschiedt door Onze Minister, die tevens
      nadere regels kan stellen met betrekking tot de werkzaamheden van die personen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.7'
    text: |-
      Voor een magnetisch kompas en voor een gyrokompas moet, voor zover op deze kompassen moet kunnen worden gepeild,
      een peilinrichting aanwezig zijn. Alle aan boord aanwezige peiltoestellen moeten zijn voorzien van een certificaat,
      afgegeven door een door het Hoofd van de Scheepvaartinspectie erkende deskundige.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.8'
    text: |-
      Wanneer een magnetisch kompas met elektrische overbrenging naar een dochterkompas is aangebracht, moet het ten
      genoegen van het Hoofd van de Scheepvaartinspectie zijn voorzien in een elektrische noodvoeding.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.9'
    text: |-
      Verlichting en een voorziening om deze te kunnen dimmen moet aanwezig zijn, teneinde het mogelijk te maken dat de
      kompasroos te allen tijde afgelezen kan worden. Indien de verlichting wordt gevoed door de hoofdvoeding van het
      vaartuig, moet tevens een noodverlichting zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '277.10'
    text: |-
      Ten genoegen van het Hoofd van de Scheepvaartinspectie moet een spreekbuis of ander doelmatig communicatiemiddel
      zijn aangebracht, tussen de plaats waar het standaardkompas is opgesteld en de plaats waar het vaartuig wordt
      bestuurd en, indien aangebracht, de plaats waar de noodstuurinrichting is opgesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel277
  - number: '278.1'
    text: Aan boord van elk vaartuig moet een handlood met gemerkte lijn van voldoende lengte aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel278
  - number: '278.2'
    text: |-
      Aan boord van elk vaartuig moet een echolood van een goedgekeurd type aanwezig zijn, dat voldoet aan de door het
      Hoofd van de Scheepvaartinspectie nader te stellen regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel278
  - number: '279.1'
    text: |-
      Een vaartuig waarvan de lengte 45 m of meer bedraagt, gebouwd op of na 1 september 1984, en een vaartuig waarvan
      de lengte 75 m of meer bedraagt, gebouwd voor 1 september 1984, moet zijn voorzien van een radarinstallatie van een
      goedgekeurd type die voldoet aan de door het Hoofd van de Scheepvaartinspectie nader te stellen regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel279
  - number: '279.2'
    text: |-
      Aan boord van een vaartuig dat ingevolge het bepaalde in dit artikel is voorzien van een radarinstallatie, moeten
      op de brug voorzieningen aanwezig zijn voor het uitzetten van afgelezen radarwaarnemingen. Aan boord van een
      vaartuig waarvan de lengte 75 m of meer bedraagt, moeten deze voorzieningen ten genoegen van het Hoofd van de
      Scheepvaartinspectie zijn en tenminste even doelmatig als een reflectieplotter.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel279
  - number: '280.1'
    text: |-
      Met uitzondering van vaartuigen die een door het Hoofd van de Scheepvaartinspectie vast te stellen beperkt gebied
      bevaren, moet aan boord van elk vaartuig ten minste een hoekmeetinstrument aanwezig zijn, waarvan de fouten bekend
      zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel280
  - number: '280.1'
    text: |-
      Hoekmeetinstrumenten moeten zijn voorzien van een certificaat, afgegeven door een door het Hoofd van de
      Scheepvaartinspectie erkende deskundige.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel280
  - number: '280.2'
    text: |-
      Met uitzondering van vaartuigen die een door het Hoofd van de Scheepvaartinspectie vast te stellen beperkt gebied
      bevaren, moet aan boord van elk vaartuig ten minste een deugdelijke chronometer aanwezig zijn, waarvan stand en
      gang bekend zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel280
  - number: '280.2'
    text: |-
      Chronometers moeten zijn voorzien van een certificaat, afgegeven door een door het Hoofd van de
      Scheepvaartinspectie erkende deskundige.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel280
  - number: '280.3'
    text: Aan boord van elk vaartuig moet ten minste een barometer aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel280
  - number: '280.3'
    text: |-
      Barometers met inbegrip van barografen, moeten zijn voorzien van een certificaat, afgegeven door een door het Hoofd
      van de Scheepvaartinspectie erkende deskundige.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel280
  - number: '280.4'
    text: Aan boord van elk vaartuig moet een deugdelijke kijker aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel280
  - number: '280.5'
    text: |-
      Aan boord van elk vaartuig moet een roerstandaanwijzer, een tachometer voor elke schroef en bovendien, indien
      het vaartuig is uitgerust met verstelbare schroeven of schroeven met zijdelingse stuwkracht, een instrument dat
      de spoed en de wijze van gebruik van die schroeven aangeeft, aanwezig zijn. Deze instrumenten moeten duidelijk
      afleesbaar zijn vanaf de plaats waar de navigatie wordt gevoerd. Zij moeten van een goedgekeurd type zijn en
      voldoen aan de door het Hoofd van de Scheepvaartinspectie nader te stellen regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel280
  - number: '281.1'
    text: |-
      Aan boord van elk vaartuig moeten de voor de te ondernemen reis benodigde zeekaarten aanwezig zijn. Deze zeekaarten
      moeten van een voldoende grote schaal zijn om er behoorlijk op te kunnen navigeren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel281
  - number: '281.2'
    text: 'Aan boord van elk vaartuig moeten voorts aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel281
  - number: 281.2.1°
    text: de voor de te ondernemen reis benodigde zeemansgidsen en lichtenlijsten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel281
  - number: 281.2.2°
    text: de voor de te ondernemen reis benodigde stroomatlassen of -kaarten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel281
  - number: 281.2.3°
    text: |-
      de nodige getijtafels, een zeemansalmanak van het lopende jaar, alsmede alle andere voor de te ondernemen reis
      benodigde nautische publikaties;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel281
  - number: 281.2.4°
    text: |-
      hulpmiddelen voor zeevaartkundige berekeningen, indien het vaartuig ingevolge het bepaalde in artikel 280, tweede
      lid, is uitgerust met een chronometer;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel281
  - number: 281.2.5°
    text: een parallelliniaal of een stel van twee navigatiedriehoeken;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel281
  - number: 281.2.6°
    text: twee passers; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel281
  - number: 281.2.7°
    text: een betrouwbaar uurwerk.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel281
  - number: '281.3'
    text: |-
      Zeekaarten en boekwerken moeten in goede staat verkeren en worden bijgehouden aan de hand van berichten aan
      zeevarenden. Zeekaarten en boekwerken, die door gebruik of anderszins onvoldoende leesbaar zijn geworden, dan wel
      vanwege de uitgevende instanties vervallen zijn verklaard, worden geacht niet in goede staat te verkeren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel281
  - number: '281.4'
    text: |-
      Aan boord van elk vaartuig moeten op de brug de nodige gegevens betreffende de manoeuvreereigenschappen en de
      stopwegen bij voor het vaartuig karakteristieke vaarsnelheden en beladingstoestanden duidelijk leesbaar zijn
      opgehangen. Het Hoofd van de Scheepvaartinspectie kan nadere regels geven ter uitvoering van het bepaalde in dit
      lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel281
  - number: '282.1'
    text: |-
      Aan boord van een vaartuig waarvan de lengte 24 m of meer bedraagt, moet een dagseinlamp van een goedgekeurd
      type aanwezig zijn. Voor de voeding van de dagseinlamp moet een draagbare batterij aanwezig zijn met voldoende
      capaciteit om de lamp gedurende ten minste 2 uren onafgebroken te kunnen laten branden. Het Hoofd van de
      Scheepvaartinspectie kan nadere regels geven ter uitvoering van het bepaalde in dit lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel282
  - number: '282.2'
    text: Aan boord van een vaartuig waarvan de lengte 24 m of meer bedraagt, moet het Internationaal Seinboek aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel282
  - number: '282.3'
    text: |-
      Aan boord van een vaartuig waarvan de lengte 45 m of meer bedraagt, moet een volledig stel seinvlaggen aanwezig
      zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel282
  - number: '283.1'
    text: |-
      Een vaartuig waarvan de lengte 75 m of meer bedraagt, moet zijn voorzien van een richtingzoeker van een goedgekeurd
      type, die voldoet aan de eisen gesteld in artikel 260.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel283
  - number: '283.2'
    text: |-
      De grafiek als bedoeld in artikel 260, elfde lid, moet voor onmiddellijk gebruik bij de richtingzoeker aanwezig
      zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel283
  - number: '283.3'
    text: |-
      Indien de verificaties als bedoeld in artikel 260, twaalfde en dertiende lid, naar het oordeel van een ambtenaar
      van de Scheepvaartinspectie daartoe aanleiding geven, dient de richtingzoeker door een bevoegd persoon opnieuw te
      worden gecalibreerd onder afgifte van een grafiek als bedoeld in artikel 260, elfde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel283
  - number: '283.4'
    text: |-
      De aanwijzing van de in het derde lid en de in artikel 260, elfde en dertiende lid, bedoelde bevoegde personen
      geschiedt door het Hoofd van de Scheepvaartinspectie. De bevoegde personen moeten in het bezit zijn van een geldig,
      door het Hoofd van de Scheepvaartinspectie verstrekt, legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel283
  - number: '283.5'
    text: |-
      Indien een vaartuig dat is gebouwd op of na 1 september 1980, is uitgerust met een richtingzoeker als bedoeld
      in het eerste lid, moet die richtingzoeker zijn ingericht voor het peilen recht vooruit («homing») op de radio-
      telefonie-noodfrequentie als bedoeld in artikel 260, tiende lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel283
  - number: '284.1'
    text: |-
      Met uitzondering van vaartuigen die een door het Hoofd van de Scheepvaartinspectie vast te stellen beperkt gebied
      bevaren, moet aan boord van elk vaartuig een log aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel284
  - number: '284.2'
    text: |-
      Aan boord van een vaartuig waarvan de lengte 45 m of meer bedraagt en dat is gebouwd op of na 1 september 1984 moet
      de log de vaart en verheid aangeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel284
  - number: '284.3'
    text: |-
      Aan boord van een vaartuig dat is uitgerust met automatische radar-plot-apparatuur, dient de log de vaart en de
      verheid door het water te kunnen aangeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel284
  - number: '284.4'
    text: |-
      De log moet van een goedgekeurd type zijn en voldoen aan de door het Hoofd van de Scheepvaartinspectie nader te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel284
  - number: '285.1'
    text: |-
      Aan boord van elk vaartuig moeten de middelen aanwezig zijn om te kunnen voldoen aan de van kracht zijnde
      bepalingen ter voorkoming van aanvaringen op zee. Deze middelen moeten ook met betrekking tot de opstelling aan
      boord, voldoen aan de eisen gesteld in genoemde bepalingen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel285
  - number: '285.2'
    text: |-
      De lantaarns voorgeschreven in de van kracht zijnde bepalingen ter voorkoming van aanvaringen op zee dienen
      uitsluitend te zijn ingericht voor elektrisch licht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel285
  - number: '285.2'
    text: |-
      Met uitzondering van een vaartuig waarvan de lengte minder dan 45 m bedraagt, moet aan boord van een vaartuig voor
      elk van de top- en boordlantaarns en voor de heklantaarn, een reservelantaarn aanwezig zijn die op de voor het
      gebruik bestemde plaats vast is aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel285
  - number: '285.3'
    text: |-
      De elektrische installatie ten behoeve van de lantaarns en de middelen tot het geven van geluidseinen die zijn
      voorgeschreven in de van kracht zijnde bepalingen ter voorkoming van aanvaringen op zee, met inbegrip van de
      reservelantaarns als bedoeld in het tweede lid, moet voldoen aan de eisen gesteld in artikel 103.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel285
  - number: '285.3'
    text: |-
      Alle lantaarns die ingevolge de van kracht zijnde bepalingen ter voorkoming van aanvaringen op zee aan boord
      aanwezig zijn, met inbegrip van alle reservelantaarns, moeten zijn gemerkt en zijn voorzien van een certificaat,
      afgegeven door een door het Hoofd van de Scheepvaartinspectie erkende deskundige.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel285
  - number: '285.4'
    text: |-
      Aan boord van elk vaartuig dat de openbare wateren in Nederland, de Nederlandse Antillen of Aruba, bevaart,
      die voor de scheepvaart open staan, moeten bovendien de hulpmiddelen aanwezig zijn, die nodig zijn om aan de
      voorschriften van de ter plaatse geldende reglementen te kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel285
  - number: '286'
    text: |-
      De eigenaar van een vaartuig moet de Scheepvaartinspectie ervan in kennis stellen indien het vaartuig wordt
      ingericht of uitgerust met voorzieningen die niet in dit besluit zijn voorgeschreven. Voorzover het voorzieningen
      betreft die in dit besluit met name zijn genoemd, moeten zij voldoen aan alle daarvoor bij of krachtens dit besluit
      gestelde eisen en in deugdelijke toestand verkeren. Voor zover zij niet met name zijn genoemd en het voorzieningen
      betreft die door hun aard, constructie of werking van invloed kunnen zijn op de veiligheid van het vaartuig of de
      opvarenden, moeten zij naar het oordeel van het Hoofd van de Scheepvaartinspectie voor het doel geschikt zijn en in
      deugdelijke toestand verkeren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel286
  - number: '315'
    text: |-
      Het vervoer tegen vergoeding van personen die op grond van het bepaalde in artikel 2, eerste lid, onder 13, moeten
      worden aangemerkt als passagiers, is verboden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel315
  - number: '316.1'
    text: |-
      Voor de toepassing van deze paragraaf en van artikel 156, derde lid, artikel 179, achtste lid, artikel 188, vierde
      lid, artikel 290 en artikel 338 wordt onder lading verstaan: de vangst en de middelen voor de verwerking en de
      conservering van die vangst. Het vervoer van goederen anders dan die genoemd in dit lid, is verboden. In bijzondere
      gevallen echter kan het Hoofd van de Scheepvaartinspectie, onder nader door hem te stellen regels, toestaan dat een
      vaartuig vis vervoert die niet tot de vangst behoort.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel316
  - number: '316.2'
    text: |-
      Het beladen en het stuwen moeten voldoen aan de eisen van goede zeemanschap opdat de lading of een gedeelte daarvan
      niet levendig kan worden. De belading moet zodanig zijn dat zeker is dat de stabiliteit gedurende de reis te allen
      tijde voldoende is en dat wordt voorkomen dat onaanvaardbare spanningen in de scheepsconstructie optreden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel316
  - number: '316.3'
    text: |-
      Een vaartuig dat zonder lading of met weinig lading naar zee gaat, moet zonodig voldoende, goed in het vaartuig
      geplaatste en doelmatige ballast aan boord hebben. Ballast die zou kunnen overgaan, moet hiertegen op afdoende
      wijze zijn verzekerd. Ten aanzien van de stabiliteit en van de spanningen in de scheepsconstructie dient daarbij
      rekening te worden gehouden met het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel316
  - number: '317.1'
    text: |-
      Gevaarlijke stoffen worden in de volgende klassen onderverdeeld: klasse 1 ontplofbare stoffen; klasse 2
      samengeperste, tot vloeistof verdichte of onder druk opgeloste gassen; klasse 3 ontvlambare vloeistoffen; klasse
      4.1 gemakkelijk vlam vattende vaste stoffen; klasse 4.2 aan broei of zelfontbranding onderhevige stoffen; klasse
      4.3 stoffen die in aanraking met water of vochtige lucht brandbare gassen afgeven; klasse 5.1 oxyderende stoffen
      (zuurstofdragers); klasse 5.2 organische peroxyden; klasse 6.1 vergiftige stoffen; klasse 6.2 gevaar voor
      besmetting opleverende stoffen; klasse 7 radioactieve stoffen; klasse 8 bijtende stoffen; en klasse 9 andere
      stoffen die gevaar kunnen opleveren;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel317
  - number: '317.2'
    text: |-
      Indien het voor het conserveren van de visvangst of ten behoeve van de visserij-uitoefening in het algemeen,
      noodzakelijk is dat gevaarlijke stoffen aan boord worden meegevoerd, dient daarvoor toestemming te worden verkregen
      van het Hoofd van de Scheepvaartinspectie. Deze kan nadere regels geven met betrekking tot de verpakking, de
      etikettering, de te vervoeren hoeveelheden en de stuwage van de betreffende gevaarlijke stof, alsmede de wijze van
      vervoer en de daarbij in acht te nemen veiligheidsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel317
  - number: '317.3'
    text: |-
      Wanneer aan boord van het vaartuig gevaarlijke stoffen worden meegevoerd, zijn tevens de bij ministeriële regeling
      voorgeschreven antidota en een zuurstofbeademingskoffer met onderhoudsset, met de daarbij behorende controlelijst
      en handleiding aanwezig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel317
  - number: '318.1'
    text: |-
      Indien zich op enig moment lading aan dek bevindt, mag deze op geen enkele wijze de navigatie, de bediening
      van de reddingen brandblusmiddelen, lieren, peil- en temperatuurkokers, lenspompen en de toegang tot verblijven
      belemmeren, noch een veilig verkeer van de bemanning aan dek in gevaar brengen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel318
  - number: '318.2'
    text: Deklading mag niet verhinderen dat overgekomen water gemakkelijk door de waterloospoorten kan wegvloeien.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel318
  - number: '319.1'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat bij het ondernemen van een reis alsmede gedurende de
      reis het vaartuig niet dieper is afgeladen dan tot de hoogst gelegen lastlijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel319
  - number: '319.2'
    text: |-
      Wanneer een vaartuig naar zee vertrekt is het de kapitein toegestaan dieper af te laden dan op grond van het eerste
      lid is geoorloofd, en wel zoveel als overeenkomt met het gewicht aan brandstof, voorraden en drinkwater dat wordt
      verbruikt tussen de plaats van vertrek en de plaats waar het vaartuig buitengaats komt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel319
  - number: '320.1'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat voor het ondernemen van een reis voldoende gegevens
      aan boord zijn om hem in staat te stellen het vaartuig zodanig te beladen en te ballasten dat onaanvaardbare
      spanningen in de scheepsconstructie worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel320
  - number: '320.2'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat voor het ondernemen van een reis de nodige door het
      Hoofd van de Scheepvaartinspectie goedgekeurde gegevens aan boord zijn betreffende de stabiliteit van het vaartuig
      in onbeschadigde toestand.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel320
  - number: '320.3'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat tijdens de reis de stabiliteit van het vaartuig
      in alle voorkomende bedrijfstoestanden ten minste voldoet aan de door het Hoofd van de Scheepvaartinspectie
      vastgestelde criteria.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel320
  - number: '321.1'
    text: |-
      De kapitein is verplicht dagelijks van tanks, van kofferdammen en van vullingen peiling te doen nemen. Deze
      verplichting geldt niet voor ruimten waarvoor is toegestaan, dat deze zijn voorzien van een inrichting als bedoeld
      in artikel 39, tweede lid, onder 2.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel321
  - number: '321.2'
    text: 'De kapitein is voorts verplicht ten minste eenmaal per vier maanden het volgende te doen controleren:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel321
  - number: 321.2.1°
    text: de juiste aanwijzing van de in artikel 39, tweede lid, onder 1, bedoelde peilinrichtingen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel321
  - number: 321.2.2°
    text: de juiste werking van de in artikel 39, tweede lid, onder 2, bedoelde alarminrichtingen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel321
  - number: 321.2.3°
    text: de juiste werking van de in artikel 134, eerste lid, bedoelde bilge-alarminstallatie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel321
  - number: '322'
    text: 'De kapitein van een vaartuig is verplicht zorg te dragen dat voor het ondernemen van een reis en gedurende de reis:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel322
  - number: 322.1°
    text: |-
      alle reddingmiddelen en -voorzieningen als bedoeld in hoofdstuk 7, zijn geplaatst, opgesteld dan wel geborgen zoals
      aangegeven op het aan boord aanwezige, goedgekeurde veiligheidsplan indien zulk een plan ingevolge het bepaalde in
      artikel 244 is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel322
  - number: 322.2°
    text: |-
      alle reddingmiddelen en -voorzieningen steeds in goede staat verkeren en voor onmiddellijk gebruik gereed zijn, en
      voor het dagelijks toezicht hierop een of meer scheepsofficieren zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel322
  - number: 322.3°
    text: |-
      de uitrusting van de redding- en hulpverleningsboten steeds in goede staat verkeert en voor onmiddellijk gebruik
      gereed is, en in die boten geen andere zaken worden geborgen dan die welke tot de uitrusting behoren;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel322
  - number: 322.4°
    text: |-
      een gediplomeerd sloepsgast is belast met het bevel over elk groepsreddingmiddel, en voor elke reddingboot tevens
      een plaatsvervanger is aangewezen, dan wel, wanneer zulks door het Hoofd van de Scheepvaartinspectie is toegestaan,
      een persoon met ervaring in de behandeling en bediening van reddingvlotten is belast met het bevel over elk
      reddingvlot;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel322
  - number: 322.5°
    text: |-
      degene die met het bevel over een groepsreddingmiddel is belast en de plaatsvervanger beschikken over een lijst
      met namen van de hun toegewezen bemanning van het groepsreddingmiddel en toezien dat die bemanningsleden hun taken
      kennen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel322
  - number: 322.6°
    text: |-
      voor elke reddingboot voorzien van een radiotelegrafie-installatie, iemand is aangewezen die deze installatie kan
      bedienen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel322
  - number: 322.7°
    text: |-
      voor elke reddingboot iemand is aangewezen die de motor kan bedienen en kleine herstellingen daaraan kan
      verrichten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel322
  - number: 322.8°
    text: |-
      de handboeken voor opleiding ter zake van de reddingmiddelen en -voorzieningen, bedoeld in artikel 242, eerste lid,
      aan boord zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel322
  - number: 322.9°
    text: |-
      de instructies voor het onderhoud van de reddingmiddelen en -voorzieningen, bedoeld in artikel 209, tweede lid, aan
      boord zijn en het onderhoud dienovereenkomstig wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel322
  - number: 322.10°
    text: |-
      de periodieke beproevingen, inspecties en keuringen van de reddingmiddelen en -voorzieningen worden uitgevoerd op
      een wijze als voorgeschreven in artikel 209, zesde tot en met negende lid, en in artikel 263, derde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel322
  - number: '323'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat voor het ondernemen van een reis en gedurende de reis
      wordt voldaan aan het bepaalde in artikel 240.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel323
  - number: '324.1'
    text: |-
      De kapitein van een vaartuig waarvan de lengte 45 m of meer bedraagt, is verplicht zorg te dragen dat op daarvoor
      in aanmerking komende plaatsen een exemplaar van het veiligheidsplan als bedoeld in artikel 244 is opgehangen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel324
  - number: '324.2'
    text: |-
      De kapitein van een vaartuig waarvan de lengte 35 m of meer bedraagt, is verplicht zorg te dragen dat het
      brandbeveiligingsplan, voorgeschreven in artikel 164, onderscheidenlijk artikel 184, is opgehangen op daarvoor
      in aanmerking komende plaatsen, dan wel een exemplaar van het in artikel 165 genoemde brandbeveiligingsboekje aan
      iedere scheepsofficier is uitgereikt zomede op een voor een ieder toegankelijke plaats beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel324
  - number: '325'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat wordt voldaan aan het bepaalde in de artikelen 241
      en 242.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel325
  - number: '326'
    text: 'De kapitein van een vaartuig is verplicht zorg te dragen dat:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel326
  - number: 326.1°
    text: |-
      alle brandontdekkingsmiddelen en -bestrijdingsmiddelen steeds in goede staat en voor onmiddellijk gebruik gereed
      zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel326
  - number: 326.2°
    text: |-
      de brandslangen alleen worden gebruikt voor brandblusdoeleinden, voor het beproeven van de brandblusinrichting of
      bij oefeningen en inspecties;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel326
  - number: 326.3°
    text: de brandslangen telkenmale na verloop van ten hoogste zes maanden worden beproefd;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel326
  - number: 326.4°
    text: |-
      de periodieke controle en beproeving van draagbare en niet-draagbare brandblustoestellen, alsmede van vast
      aangebrachte brandblusinstallaties met inbegrip van de eventueel bij deze toestellen of installaties behorende
      gascilinders, geschiedt op een wijze als door het Hoofd van de Scheepvaartinspectie is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel326
  - number: 326.5°
    text: |-
      de voortstuwingsruimten, andere ruimten voor machines en de kombuizen behoorlijk worden schoongehouden en worden
      vrijgehouden van olieresten, lekolie, met olie doordrenkt poetskatoen en dergelijke verontreinigingen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel326
  - number: 326.6°
    text: |-
      voor scheepsgebruik bestemde of tot de scheepsuitrusting behorende, stoffen of onderdelen met brandgevaarlijke
      eigenschappen zeevast worden opgeborgen op een veilige plaats, verwijderd van ruimten voor machines, kombuizen en
      plaatsen waar open vuur wordt gebezigd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel326
  - number: '327'
    text: 'De kapitein van een vaartuig is verplicht zorg te dragen dat:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel327
  - number: 327.1°
    text: |-
      de waterdichte deuren gedurende de reis zijn gesloten, tenzij deze uit hoofde van de behoeften van de dienst
      noodzakelijk geopend moeten blijven, in welk geval maatregelen moeten worden genomen, zodat zij te allen tijde
      onmiddellijk kunnen worden gesloten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel327
  - number: 327.2°
    text: |-
      patrijspoorten die gedurende de reis niet bereikbaar zijn, voor het vaartuig de haven of rede verlaat behoorlijk
      met hun blinden zijn gesloten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel327
  - number: 327.3°
    text: |-
      de deksels en kleppen van stortkokers die niet in gebruik zijn en waarvan de binnenboordsopeningen geheel of
      gedeeltelijk beneden het werkdek zijn gelegen, behoorlijk zijn gesloten; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel327
  - number: 327.4°
    text: |-
      de waterdichte deuren en alle daarbij behorende bewegingsinrichtingen en standaanwijzers, alle afsluiters die
      moeten zijn gesloten om een afdeling waterdicht te maken, benevens alle afsluiters in dwarsscheepse overvloei-
      inrichtingen gedurende de reis geregeld, ten minste eenmaal per week, worden beproefd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel327
  - number: '328'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat de schepelingen bekend zijn met het gebruik van de
      beschermende uitrusting, bedoeld in artikel 190, zesde lid. Hij dient erop toe te zien dat deze uitrusting in
      daartoe in aanmerking komende omstandigheden wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel328
  - number: '329'
    text: 'De kapitein van een vaartuig is verplicht zorg te dragen dat:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel329
  - number: 329.1°
    text: |-
      in vochtige ruimten geen werkzaamheden aan ongeïsoleerde delen van de elektrische installatie worden uitgevoerd,
      zolang deze onder spanning staan;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel329
  - number: 329.2°
    text: |-
      in ruimten met ontploffingsgevaar geen werkzaamheden geschieden, waarbij vonkvorming kan optreden en dat
      werkzaamheden aan elektrische installaties met toebehoren slechts plaatsvinden, nadat het desbetreffende gedeelte
      der installatie spanningloos is gemaakt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel329
  - number: 329.3°
    text: |-
      in andere dan onder 1 en 2 genoemde ruimten slechts werkzaamheden aan ongeïsoleerde of daarmee gelijk te stellen
      delen van de elektrische installatie worden uitgevoerd, zonder dat deze spanningloos zijn gemaakt, indien hiervoor
      dringende redenen aanwezig zijn voor de veiligheid en bedrijfszekerheid van het vaartuig, mits:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel329
  - number: 329.3°.3.1
    text: alle zich in de nabijheid bevindende metalen delen doelmatig tegen aanraking zijn afgeschermd;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel329
  - number: 329.3°.3.2
    text: de metalen delen van het bij de werkzaamheden benodigde gereedschap voorzover mogelijk doelmatig zijn geïsoleerd;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel329
  - number: 329.3°.3.3
    text: zij die de werkzaamheden uitvoeren, zich op een doelmatig isolerende laag bevinden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel329
  - number: 329.3°.3.4
    text: |-
      voorzover dit in verband met de plaats en de omstandigheden nodig is, duidelijk leesbare waarschuwingen zijn
      aangebracht om te voorkomen dat aan een niet met de werkzaamheden belaste persoon een ongeval overkomt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel329
  - number: 329.4°
    text: |-
      werkzaamheden in de nabijheid van ongeïsoleerde of daarmee gelijk te stellen delen van de elektrische installatie
      slechts geschieden, indien deze spanningloos zijn gemaakt, tenzij dit om bedrijfstechnische redenen niet mogelijk
      is, in welk geval alle maatregelen moeten zijn genomen die een veilig verloop van de arbeid waarborgen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel329
  - number: 329.5°
    text: |-
      bij voeding van het scheepsnet of een gedeelte daarvan vanaf de wal, geen spanningen, stroomsoorten en bij
      draaistroom bovendien geen frequenties en volgorden van de fasen worden gebezigd waarvoor de elektrische
      installatie aan boord niet geschikt is;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel329
  - number: 329.6°
    text: isolatiefouten in de elektrische installatie zo spoedig mogelijk worden verholpen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel329
  - number: 329.7°
    text: |-
      de noodkrachtbron en de tijdelijke noodkrachtbron, indien aanwezig, zomede de automatische inrichtingen van de
      noodinstallatie wekelijks worden beproefd; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel329
  - number: 329.8°
    text: de noodverlichting maandelijks wordt beproefd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel329
  - number: '330.1'
    text: 'De kapitein van een vaartuig is met betrekking tot de stuurinrichting verplicht zorg te dragen dat:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.1°
    text: |-
      binnen 12 uur voor vertrek de stuurinrichting door de bemanning wordt gecontroleerd en beproefd op de goede
      werking;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.2°
    text: |-
      bij de beproevingsprocedure, bedoeld onder 1, voor zover van toepassing, de werking van de volgende onderdelen
      is inbegrepen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.2°.2.1
    text: de hoofdstuurinrichting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.2°.2.2
    text: de hulpstuurinrichting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.2°.2.3
    text: de afstandbedieningssystemen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.2°.2.4
    text: de besturingsmogelijkheden op de brug;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.2°.2.5
    text: de noodkrachtvoorziening;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.2°.2.6
    text: de roerstandaanwijzers, vergeleken met de werkelijke stand van het roer;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.2°.2.7
    text: de alarmeringen voor het uitvallen van de bekrachtiging van de afstandbedieningssystemen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.2°.2.8
    text: de alarmeringen voor het uitvallen van de krachtwerktuigen van de stuurinrichting; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.2°.2.9
    text: |-
      de automatische voorzieningen waarmee een defect gedeelte van de stuurinrichting buiten bedrijf wordt gesteld en
      andere automatische uitrusting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.3°
    text: 'bij de onder 1 bedoelde controles en beproevingen tevens zijn inbegrepen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.3°.3.1
    text: het bewegen van het roer over de volle uitslag zoals vereist voor de betreffende stuurinrichting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.3°.3.2
    text: een visuele inspectie van de stuurinrichting met de daaraan verbonden systemen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.3°.3.3
    text: de werking van de communicatiemiddelen tussen de brug en de stuurmachinekamer;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.4°
    text: |-
      eenvoudige gebruiksaanwijzingen met een blokdiagram, waarop de overschakelingsprocedures zijn aangegeven voor
      de afstandbedieningssystemen en de krachtwerktuigen voor de stuurmachine, op de brug en in de stuurmachinekamer
      permanent zijn opgehangen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.5°
    text: |-
      alle schepelingen die betrokken zijn bij de behandeling of het onderhoud van de stuurinrichting, vertrouwd zijn met
      de werking van de stuursystemen en met de procedures om van het ene systeem over te schakelen op het andere;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.6°
    text: |-
      in aanvulling op de geregelde controles en beproevingen, bedoeld onder 1 ten minste eenmaal in de drie maanden
      oefeningen plaatsvinden voor de besturing van het vaartuig in gevallen waarbij een of meer onderdelen van het
      stuursysteem zijn uitgevallen, teneinde hiermede ervaring op te doen. Bij deze oefeningen dienen te zijn inbegrepen
      de directe bediening in de stuurmachinekamer, de communicatieprocedure met de brug en, indien toepasselijk, het
      gebruik van vervangende krachtvoorzieningen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.1.7°
    text: de onderdelen voor de hulpstuurinrichting voor onmiddellijk gebruik gereed zijn opgeborgen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: '330.2'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat in gebieden waar de navigatie bijzondere aandacht
      vergt, meer dan een krachtwerktuig van de stuurinrichting in bedrijf is, indien dergelijke werktuigen geschikt zijn
      om de stuurinrichting gelijktijdig te voeden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: '330.3'
    text: |-
      De kapitein van een vaartuig dat is uitgerust met een automatische stuurinrichting, is verplicht zorg te dragen
      dat:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.3.1°
    text: |-
      in gebieden met een grote vaardichtheid, bij beperkt zicht en in alle andere voor de navigatie gevaarlijke
      situaties, waarin gebruik wordt gemaakt van de automatische stuurinrichting, de chef van de wacht onverwijld kan
      beschikken over de diensten van een bekwame roerganger die op ieder moment de besturing moet kunnen overnemen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.3.2°
    text: |-
      het overschakelen van automatische besturing op handbesturing en omgekeerd, geschiedt door of onder toezicht van de
      chef van de wacht; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: 330.3.3°
    text: |-
      de handbesturing wordt beproefd nadat gedurende een langere tijd gebruik is gemaakt van de automatische
      stuurinrichting en voordat gebieden worden binnengevaren waar de navigatie bijzondere aandacht vergt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel330
  - number: '331.1'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat de fouten van elk magnetisch kompas eenmaal per jaar
      worden geverifieerd door een bevoegd persoon als bedoeld in artikel 277, zesde lid, onder 4, tenzij deze fouten
      door waarnemingen op zee geregeld worden geverifieerd en zij binnen redelijke grenzen blijven. Bovendien is de
      kapitein verplicht hercompensatie door een bevoegd persoon als bovenbedoeld te doen plaatsvinden, telkenmale
      wanneer zich omstandigheden hebben voorgedaan die van invloed kunnen zijn op de gevonden fouten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel331
  - number: '331.2'
    text: De kapitein van een vaartuig is verplicht zorg te dragen dat bij elk magnetisch kompas een foutentabel aanwezig is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel331
  - number: '332'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat op de brug de nodige gegevens beschikbaar zijn
      betreffende de manoeuvreereigenschappen en de stopweg bij voor het vaartuig karakteristieke vaarsnelheden en
      diepgangen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel332
  - number: '333.1'
    text: |-
      De kapitein van een vaartuig uitgerust met een richtingzoeker, is verplicht zorg te dragen dat eenmaal per jaar
      de fouten van de richtingzoeker worden geverifieerd door een bevoegd persoon als bedoeld in artikel 260, dertiende
      lid, tenzij deze fouten door waarnemingen op zee geregeld worden geverifieerd en zij binnen redelijke grenzen
      blijven. Bovendien is de kapitein verplicht verificatie te doen plaatsvinden, telkenmale wanneer in de positie van
      enige antenne, dan wel van enige constructie aan dek, veranderingen zijn aangebracht die de gevonden fouten van de
      richtingzoeker merkbaar zouden kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel333
  - number: '333.2'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat de grafiek, die de correctie aangeeft welke op
      de afgelezen peiling moet worden toegepast om de ware peiling ten opzichte van de kiellijn te verkrijgen, voor
      onmiddellijk gebruik bij de richtingzoeker aanwezig is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel333
  - number: '334'
    text: |-
      De kapitein van een vaartuig is verplicht luisterdienst te doen houden in overeenstemming met het bepaalde in de
      artikelen 254 tot en met 256.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel334
  - number: '335'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat door hen die als chef van de wacht kunnen optreden,
      regelmatig wordt geoefend in het gebruik van de elektronische navigatiemiddelen waarmede het vaartuig is uitgerust.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel335
  - number: '336.1'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat zijn vaartuig is bemand in overeenstemming met het
      bepaalde in hoofdstuk 12.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel336
  - number: '336.2'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nadere regelen stellen omtrent de uitvoering van het bepaalde in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel336
  - number: '336.3'
    text: |-
      De kapitein van een vaartuig is bovendien verplicht zorg te dragen dat de wachtbezetting aan dek in overeenstemming
      is met het bepaalde in artikel 288.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel336
  - number: '336.4'
    text: |-
      De kapitein van een vaartuig dat veilig in de haven gemeerd of ten anker ligt, is verplicht zorg te dragen dat een
      doeltreffende wacht wordt gehouden met het oog op de veiligheid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel336
  - number: '337'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat aan de in het [Schepelingenbesluit][ref1] met
      betrekking tot de voeding en het drinkwater gestelde voorschriften wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001985
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel337
    references:
      - id: ref1
        bwb_id: BWBR0001985
  - number: '338.1'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat het vervoer van lading geschiedt in overeenstemming
      met de voorschriften gesteld in hoofdstuk 13, paragraaf 2, en is voorts verplicht die maatregelen te treffen die in
      verband met de aard van de lading en de wijze van stuwen nodig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel338
  - number: '338.2'
    text: |-
      Bij het gebruik van werktuigen voor het verwerken van lading, is de kapitein verplicht ervoor zorg te dragen dat
      zodanige maatregelen worden getroffen dat de veiligheid en de gezondheid van de gebruikers en andere aanwezige
      personen zoveel doenlijk is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel338
  - number: '338.3'
    text: |-
      Indien gevaarlijke stoffen als bedoeld in artikel 317, tweede lid, worden vervoerd die aanleiding kunnen geven
      tot het aanwezig zijn van ontplofbare, giftige of andere schadelijke dampen, dan wel aanleiding kunnen geven
      tot zuurstofarmoede, is de kapitein verplicht, zodanige voorzorgsmaatregelen te treffen dat de veiligheid en de
      gezondheid van personen die ruimten waarin deze stoffen zijn opgeslagen, openen of betreden, zoveel doenlijk is
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel338
  - number: '339'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat ten aanzien van alarm-, nood- en spoedseinen het
      bepaalde in artikel 245 in acht wordt genomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel339
  - number: '340.1'
    text: |-
      De kapitein van een zich op zee bevindend vaartuig is verplicht, wanneer hij een melding, uit welke bron ook,
      ontvangt dat een schip, vaartuig of vliegtuig of reddingmiddelen daarvan afkomstig, in nood is of zijn, met de
      meeste spoed de in nood verkerende personen te hulp te komen, hen zo mogelijk daaromtrent inlichtende, tenzij hij
      niet in staat is of het, gezien de bijzondere omstandigheden van het geval, onredelijk of onnodig acht hen te hulp
      te komen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel340
  - number: '340.2'
    text: |-
      De kapitein van een in nood verkerend vaartuig heeft het recht, na voorzover dat mogelijk is de kapiteins van
      de schepen of vaartuigen die zijn oproep om hulp hebben beantwoord, te hebben geraadpleegd, een of meer van deze
      schepen of vaartuigen die hij het beste in staat acht hulp te verlenen, daartoe op te vorderen en het is de plicht
      van de kapitein van een opgevorderd schip of vaartuig daaraan te voldoen door met de meeste spoed het te hulp komen
      van de in nood verkerende personen voort te zetten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel340
  - number: '340.3'
    text: |-
      De kapitein van een vaartuig is ontheven van de ingevolge het bepaalde in het eerste lid op hem rustende
      verplichting wanneer hij verneemt, dat een of meer schepen of vaartuigen doch niet het zijne, is of zijn
      opgevorderd en daaraan gevolg geeft of geven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel340
  - number: '340.4'
    text: |-
      De kapitein van een vaartuig is ontheven van de ingevolge het bepaalde in het eerste lid op hem rustende
      verplichting en, indien zijn vaartuig is opgevorderd, van de ingevolge het bepaalde in het tweede lid op hem
      rustende verplichting, indien hem door de in nood verkerende personen of door de kapitein van een ander schip of
      vaartuig dat deze personen heeft bereikt, wordt medegedeeld dat hulpverlening niet langer nodig is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel340
  - number: '341'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat ten aanzien van veiligheidsseinen en berichten omtrent
      gevaren het bepaalde in artikel 247 in acht wordt genomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel341
  - number: '342'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat ten aanzien van de routering van het vaartuig het
      bepaalde in artikel 248 in acht wordt genomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel342
  - number: '343.1'
    text: |-
      Naast hetgeen bij of krachtens de bepalingen van het voor Nederland, de Nederlandse Antillen, onderscheidenlijk
      Aruba geldende [Wetboek van Koophandel][ref1] ten aanzien van het houden van scheeps- en machinedagboeken is
      voorgeschreven, is de kapitein van een vaartuig verplicht in deze dagboeken aantekening te doen houden:


      [ref1]: https://wetten.overheid.nl/BWBR0001838
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
    references:
      - id: ref1
        bwb_id: BWBR0001838
  - number: 343.1.1°
    text: |-
      van het periodiek te water laten van reddingboten, hulpverleningsboten en reddingvlotten van het strijkbare type,
      alsmede van de toestand waarin deze reddingmiddelen zich bevinden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: 343.1.2°
    text: |-
      van de maandelijkse inspectie van de reddingmiddelen en de reddingbootuitrusting, alsmede van de toestand waarin de
      uitrusting zich bevindt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: 343.1.3°
    text: van de beproeving van de brandslangen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: 343.1.4°
    text: van de controles, beproevingen en oefeningen, bedoeld in artikel 330, eerste lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: 343.1.5°
    text: |-
      van de dagelijkse peilingen, bedoeld in artikel 321, eerste lid, en van de viermaandelijkse controle, bedoeld in
      artikel 321, tweede lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: 343.1.6°
    text: |-
      van alle appèls, oefeningen «schip verlaten», oefeningen in het blussen van brand, oefeningen met de
      hulpverleningsboten, opleiding en instructie in het gebruik van de reddingmiddelen en oefeningen met reddingvlotten
      van het strijkbare type, alsmede, wanneer deze niet op de voorgeschreven tijden zijn gehouden, van de redenen
      waarom dit niet is geschied.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: 343.1.7°
    text: |-
      in voorkomende gevallen, van de redenen waarom hij, na het waarnemen of het ontvangen van een noodsein, heeft
      nagelaten de in nood verkerende personen te hulp te komen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: 343.1.8°
    text: |-
      aan boord van een vaartuig uitgerust met een radiotelegrafie-auto-alarmtoestel, van de dagelijkse beproeving
      daarvan;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: 343.1.9°
    text: |-
      aan boord van een vaartuig, uitgerust met een radiotelegraaf- of radiotelefoonstation, dagelijks de staat waarin de
      reservekrachtbron zich bevindt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: 343.1.10°
    text: |-
      aan boord van een vaartuig voorzien van een noodkrachtbron, van een tijdelijke noodkrachtbron en van automatische
      inrichtingen van de noodinstallatie, van de beproevingen daarvan;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: 343.1.11°
    text: aan boord van een vaartuig voorzien van elektrische noodverlichting, van de beproeving daarvan;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: 343.1.12°
    text: van de controles en beproevingen, bedoeld in artikel 326, onder 4;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: 343.1.13°
    text: van de controles en beproevingen, bedoeld in artikel 327, onder 4;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: 343.1.14°
    text: van op de afgelopen reis voorgekomen averijen en ongevallen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: 343.1.15°
    text: |-
      aan boord van een vaartuig, uitgerust met een VHF radiotelefonie-installatie, van een samenvatting van alle
      berichtenwisseling betreffende nood-, spoed- en veiligheidsverkeer.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: '343.2'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen, dat door de chefs van de wacht schriftelijk nauwkeurig
      wordt bijgehouden alles wat nodig is voor een goede invulling van het scheepsdagboek, onderscheidenlijk het
      machinedagboek.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: '343.3'
    text: |-
      De kapitein van een vaartuig is verplicht de laatste data van inspecties, appèls en oefeningen als bedoeld in het
      eerste lid, onder 1, 2, 3, 4, 6, 10, 11 en 12 bij het in gebruik nemen van een nieuw dagboek uit het vorige dagboek
      te doen overnemen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: '343.4'
    text: |-
      De kapitein van een vaartuig binnengekomen in een haven in Nederland, de Nederlandse Antillen of Aruba, is
      verplicht binnen drie dagen na binnenkomst en in ieder geval voor het vertrek het scheepsdagboek en indien daartoe
      het verzoek wordt gedaan tevens het machinedagboek ter inzage te doen toekomen aan de betrokken ambtenaar van de
      Scheepvaartinspectie, die de ingezonden dagboeken, voorzien van een gedagtekende en ondertekende verklaring, zo
      spoedig mogelijk na inzage aan de kapitein terugzendt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: '343.5'
    text: |-
      Indien het vaartuig langer dan een jaar buiten een haven als bedoeld in het vierde lid blijft, is de kapitein
      verplicht de scheepsdagboeken van de afgelopen reizen, telkenmale na verloop van ten hoogste een jaar, te zenden
      aan de Scheepvaartinspectie, aan wie het toezicht op het vaartuig is opgedragen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: '343.6'
    text: |-
      Indien het vaartuig wordt opgelegd in een haven buiten Nederland, de Nederlandse Antillen of Aruba, is de kapitein
      verplicht de scheepsdagboeken binnen acht dagen te zenden aan de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel343
  - number: '344.1'
    text: |-
      De kapitein van een vaartuig uitgerust met een radiostation, is verplicht door de chef van het scheepsradiostation
      een radiodagboek als bedoeld in de artikelen 270, 272 en 274 te doen bijhouden op een wijze als voorgeschreven in
      die artikelen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel344
  - number: '344.2'
    text: De kapitein van een vaartuig is verplicht dagelijks het radiodagboek voor gezien te tekenen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel344
  - number: '345'
    text: 'De kapitein van een vaartuig is verplicht zorg te dragen dat:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel345
  - number: 345.1°
    text: |-
      de loodsladder, bedoeld in artikel 227, schoon en in goede staat wordt gehouden en alleen wordt gebruikt voor het
      aan boord nemen of ontschepen van loodsen, alsmede van havenautoriteiten bij aankomst in of vertrek uit een haven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel345
  - number: 345.2°
    text: |-
      de loodsladder op een zodanige plaats buiten boord wordt opgehangen dat de ladder vrij hangt van spuipijpen van
      het vaartuig, dat elke trede stevig tegen de scheepshuid rust, dat deze zo ver mogelijk is verwijderd van de
      terugwijkende gedeelten van de scheepshuid en dat de loods op een veilige en gemakkelijke wijze het vaartuig
      kan betreden nadat hij niet minder dan 1,50 m en niet meer dan 9 m heeft geklommen. Indien de afstand van het
      wateroppervlak tot aan de inschepingsplaats meer dan 9 m bedraagt, dient toegang tot het vaartuig te worden
      verkregen door middel van een valreep of op een andere even veilige en gemakkelijke wijze;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel345
  - number: 345.3°
    text: |-
      twee handleiders, stevig aan het vaartuig bevestigd, met een omtrek van niet minder dan 65 mm en een lijflijn voor
      gebruik gereed worden gehouden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel345
  - number: 345.4°
    text: |-
      voorzieningen aanwezig zijn teneinde de loods in staat te stellen op veilige en gemakkelijke wijze over te stappen
      vanaf het boveneinde van de loodsladder op of in het vaartuig of op de valreep of ander middel en omgekeerd. Indien
      het overstappen plaatsvindt door een opening in het hekwerk of de verschansing, dienen doelmatige handgrepen te
      zijn aangebracht. Indien het overstappen geschiedt door middel van een verschansingstrap, dient deze stevig te zijn
      bevestigd aan de verschansing of aan het platform en dienen twee rechtopstaande houvasten te zijn aangebracht bij
      de plaats van het aan boord komen of van boord gaan. De onderlinge afstand tussen deze houvasten mag niet minder
      dan 0,70 m en niet meer dan 0,80 m bedragen. Elke houvast dient aan of nabij de onderzijde, alsmede op een hoger
      gelegen punt, stevig aan het vaartuig te zijn bevestigd; de diameter dient niet minder te zijn dan 40 mm en de
      lengte dient zodanig te zijn dat de houvast ten minste 1,20 m boven de verschansing uitsteekt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel345
  - number: 345.5°
    text: |-
      des nachts een zodanige verlichting aanwezig is dat zowel de loodsladder buitenboord als de plaats waar de loods
      aan boord komt, voldoende verlicht zijn. Een reddingboei, voorzien van een zelfontbrandend licht, moet ter plaatse
      voor direct gebruik bij de hand worden gehouden. Een hieuwlijn moet voor direct gebruik beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel345
  - number: 345.6°
    text: voorzieningen zijn getroffen om de loodsladder aan beide zijden van het vaartuig te kunnen gebruiken;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel345
  - number: 345.7°
    text: |-
      het optuigen van de ladder en het aan boord nemen of ontschepen van een loods geschiedt onder toezicht van een
      verantwoordelijk scheepsofficier; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel345
  - number: 345.8°
    text: |-
      indien van een mechanische loodsladder gebruik wordt gemaakt, een loodsladder welke voldoet aan het gestelde in
      artikel 227, aan dek in de onmiddellijke nabijheid voor direct gebruik beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel345
  - number: '346'
    text: 'De kapitein van een vaartuig is verplicht zorg te dragen dat aan boord aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel346
  - number: 346.1°
    text: |-
      de [Schepenwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel346
    references:
      - id: ref1
        bwb_id: BWBR0001876
  - number: 346.2°
    text: het Vissersvaartuigenbesluit;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel346
  - number: 346.3°
    text: |-
      de door het Hoofd van de Scheepvaartinspectie gestelde nadere regels, neergelegd in Bekendmakingen aan de
      Zeevisvaart;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel346
  - number: 346.4°
    text: de van kracht zijnde bepalingen ter voorkoming van aanvaringen op zee; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel346
  - number: 346.5°
    text: alle elders in dit besluit voorgeschreven publicaties en boekwerken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel346
  - number: '347'
    text: |-
      De eigenaar van een vaartuig is verplicht zorg te dragen dat de romp van het vaartuig overeenkomstig het bepaalde
      in artikel 14 aan de buitenzijde wordt onderzocht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel347
  - number: '348'
    text: |-
      De eigenaar van een vaartuig is verplicht aan de kapitein de middelen te verschaffen die deze behoeft, teneinde te
      kunnen voldoen aan het bepaalde in dit besluit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel348
  - number: 348a.1
    text: |-
      De eigenaar van een vaartuig is verplicht zorg te dragen dat de veiligheid en gezondheid van de bemanning niet in
      gevaar wordt gebracht, in het bijzonder door voorzienbare weersomstandigheden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel348a
  - number: 348a.2
    text: |-
      De eigenaar van een vaartuig is verplicht zorg te dragen voor het technische onderhoud, zodat de constructie,
      inrichting en uitrusting van het vaartuig aan dit besluit voldoen en blijven voldoen. De eigenaar ziet er op toe
      dat geconstateerde gebreken die de veiligheid en gezondheid van de bemanning in gevaar kunnen brengen, zo snel
      mogelijk worden verholpen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel348a
  - number: 348a.3
    text: |-
      De in het eerste en tweede lid genoemde verplichtingen van de eigenaar laten de verplichtingen van de kapitein
      onverlet.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel348a
  - number: '349'
    text: |-
      De eigenaar van een vaartuig is verplicht ten aanzien van het voornemen tot een onderzoek van de romp aan de
      buitenzijde en van herstellingen aan het vaartuig of aan de werktuigen, het bepaalde in artikel 15 in acht te
      nemen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel349
  - number: '350.1'
    text: |-
      In het belang van de veiligheid van vaartuigen en hun opvarenden kan het Hoofd van de Scheepvaartinspectie, in
      overeenstemming met de Chef van de Marinestaf, bijzondere voorschriften geven voor nader door hem aan te wijzen
      vaartuigen, in tijden van oorlog, oorlogsgevaar en daaraan verwante of daarmede verband houdende buitengewone
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel350
  - number: '350.2'
    text: |-
      Ter voorkoming van ongevallen ten gevolge van nog aanwezige gevaren die voortvloeien uit oorlog, oorlogsgevaar
      en daaraan verwante of daarmede verband houdende buitengewone omstandigheden, kan het Hoofd van de
      Scheepvaartinspectie bijzondere voorschriften geven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel350
  - number: '350.3'
    text: |-
      De bijzondere voorschriften, bedoeld in het eerste en het tweede lid, treden buiten werking zes maanden na de datum
      van afkondiging, tenzij zij inmiddels bij algemene maatregel van bestuur zijn bekrachtigd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel350
  - number: '351'
    text: |-
      De kapitein van een vaartuig is verplicht zorg te dragen dat wordt voldaan aan de bijzondere voorschriften als
      bedoeld in artikel 350.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel351
  - number: '352.1'
    text: |-
      De kapitein van een vaartuig is verplicht de hem vanwege de Chef van de Marinestaf ter hand te stellen bescheiden
      te aanvaarden en de daarbij gegeven aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel352
  - number: '352.2'
    text: |-
      De kapitein van een vaartuig is verplicht de bescheiden als bedoeld in het eerste lid op een doelmatige plaats
      te bewaren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel352
  - number: '353'
    text: |-
      Overtreding van de artikelen 322, 325, 326, 327, 336, derde lid, 338, 343, vierde, vijfde en zesde lid, 347, 348,
      348a en 349 is een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel353
  - number: '361.1'
    text: In dit artikel wordt onder bestaand vaartuig verstaan een vissersvaartuig gebouwd vóór 1 november 1989.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel361
  - number: '361.2'
    text: |-
      Onverminderd het bepaalde in het derde tot en met het achtste lid moet de constructie, de inrichting en de
      uitrusting van bestaande vaartuigen ten minste blijven voldoen aan de voorschriften zoals die van toepassing waren
      voor 1 november 1989.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel361
  - number: '361.3'
    text: |-
      Voor bestaande vaartuigen zijn de voorschriften van dit besluit met betrekking tot de constructie en de inrichting,
      voor zover deze afwijken van die van voor 1 november 1989, alleen van toepassing, indien en voor zover dit, naar
      het oordeel van het Hoofd van de Scheepvaartinspectie, praktisch uitvoerbaar en redelijk is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel361
  - number: '361.4'
    text: |-
      De uit het bepaalde in het derde lid voortvloeiende veranderingen van de constructie en de inrichting aan boord
      van bestaande vaartuigen moeten, in overleg met de ambtenaren van de Scheepvaartinspectie, worden uitgevoerd
      bij belangrijke reparaties en vernieuwingen aan het casco, bij ingrijpende veranderingen in de accommodatie, bij
      het vernieuwen van installaties en bij andere daartoe geëigende gelegenheden. Bedoelde vaartuigen mogen door het
      ondergaan van een reparatie of een verandering niet in geringere mate aan de voorschriften van dit besluit voldoen
      dan zij vóór de reparatie of de verandering deden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel361
  - number: '361.5'
    text: |-
      In het geval dat bepalingen van dit besluit tot gevolg hebben dat de uitrusting van een bestaand vaartuig moet
      worden aangevuld, vervangen dan wel aangepast:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel361
  - number: 361.5.1°
    text: |-
      moet de vervanging van de vóór 1 november 1989 verplicht gestelde uitrustingsartikelen door die van het in dit
      besluit voorgeschreven type, plaatsvinden bij vernieuwing van de betreffende artikelen of wanneer deze grote
      reparaties vereisen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel361
  - number: 361.5.2°
    text: |-
      moet de verdere aanpassing van de vóór 1 november 1989 verplicht gestelde uitrusting aan die welke is
      voorgeschreven in dit besluit, plaatsvinden in overleg met de ambtenaren van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel361
  - number: '361.6'
    text: 'Het bepaalde in het vijfde lid is niet van toepassing ten aanzien van hetgeen is vereist ingevolge:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel361
  - number: 361.6.1°
    text: de artikelen 200, 201, 209, 240, 241, 242, 243; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel361
  - number: 361.6.2°
    text: de artikelen 197, vierde en vijfde lid, 198, achtste en negende lid, 212, zesde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel361
  - number: '361.7'
    text: |-
      Aan het bepaalde in de artikelen, genoemd in het zesde lid, onder 1, moet worden voldaan met ingang van 1 november
      1989.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel361
  - number: '361.8'
    text: |-
      Met inachtneming van het bepaalde in het zesde en zevende lid behoeven bestaande vaartuigen niet te worden
      aangepast aan de voorschriften van dit besluit, indien de aanpassing uitsluitend voortvloeit uit de toepassing van
      het lengtekriterium in plaats van het tonnagekriterium gebruikt in de voorschriften van vóór 1 november 1989.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel361
  - number: '362'
    text: '[Gereserveerd.]'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel362
  - number: 362a
    text: |-
      Ministeriële regelingen vastgesteld krachtens dit besluit worden bekendgemaakt in de Staatscourant, in de
      Curaçaosche Courant en in het Afkondigingsblad van Aruba.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel362a
  - number: '363'
    text: 'Dit besluit wordt aangehaald als: Vissersvaartuigenbesluit.'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel363
