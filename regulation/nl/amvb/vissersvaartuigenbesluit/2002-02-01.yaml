---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: vissersvaartuigenbesluit
regulatory_layer: AMVB
publication_date: '2002-02-19'
valid_from: '2002-02-01'
bwb_id: BWBR0004607
url: https://wetten.overheid.nl/BWBR0004607/2002-02-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 15 november 1988, nr. S/J 32.011/88, Directoraat-
    Generaal Scheepvaart en Maritieme Zaken;

    Overwegende dat het wenselijk is de veiligheidsvoorschriften voor vissersvaartuigen in overeenstemming te brengen
    met de bepalingen van het op 2 april 1977 te Torremolinos tot stand gekomen Internationaal Verdrag voor de
    beveiliging van vissersvaartuigen, met Bijlage (Trb. 1980, 139);

    Gelet op de artikelen 3, 4 bis, 5, 9, 17, 66 en 73 van de Schepenwet (Stb. 1932, 86);

    De Raad van State van het Koninkrijk gehoord (advies van 8 maart 1989, nr. W09.88.0652/K);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 25 juli 1989, nr. S/J 31.209/89,
    Directoraat-Generaal Scheepvaart en Maritieme Zaken;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Het bepaalde in dit besluit is van toepassing op vissersvaartuigen als bedoeld in
      [artikel 1, eerste lid, van de Schepenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel1
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '1'
  - number: '1.2'
    text: |-
      Het bepaalde in dit besluit is niet van toepassing op vaartuigen die worden gebezigd voor visserijonderzoek of
      voor opleiding van zeevarenden ter visserij. Indien echter deze vaartuigen daarbij geheel of gedeeltelijk dienst
      doen als vissersvaartuig, ongeacht of dit moet worden verondersteld te zijn begrepen onder de werkzaamheden
      welke verband houden met het onderzoek of de opleiding waarvoor het vaartuig bestemd is, kan het Hoofd van de
      Scheepvaartinspectie eisen dat ten minste wordt voldaan aan het bepaalde in dit besluit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel1
  - number: '1.3'
    text: |-
      Het bepaalde in dit besluit is niet van toepassing op vaartuigen waarmee bedrijfsmatige recreatie wordt
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel1
  - number: '1.4'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan voor vaartuigen waarvan de lengte minder dan 24 m bedraagt, afwijkende
      regels stellen, indien naar zijn oordeel de algemene inrichting van die vaartuigen dit rechtvaardigt, rekening
      houdend met de veiligheid van vaartuigen en opvarenden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel1
  - number: '2.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt, tenzij uitdrukkelijk anders bepaald, verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.1°
    text: '**Onze Minister:** Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.2°
    text: '**kapitein:** elke gezagvoerder van een vaartuig of die deze vervangt;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.3°
    text: |-
      **schepelingen:** allen die zich als scheepsofficieren of scheepsgezellen aan boord bevinden of zich als zodanig
      hebben verbonden; scheepsofficieren zijn de schepelingen aan wie de monsterrol de rang van officier toekent,
      scheepsgezellen zijn alle overige schepelingen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.4°
    text: |-
      **Radioreglement:** het Radioreglement (*Trb.* 1981, 78), behorende bij het op 6 november 1982 te Nairobi tot stand
      gekomen Internationaal Verdrag betreffende de Telecommunicatie (*Trb.* 1983, 164);
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.5°
    text: |-
      **radio-officier:** een persoon in het bezit van ten minste het overeenkomstig de bepalingen van het Radioreglement
      afgegeven eerste of tweede klasse certificaat van bekwaamheid als radiotelegrafist, of van een algemeen certificaat
      als radiotelegrafist voor de maritieme mobiele dienst, die te werk is gesteld in het radiotelegraafstation van
      een vaartuig;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.6°
    text: |-
      **radiotelefonist:** een persoon in het bezit van een geëigend certificaat afgegeven in overeenstemming met de
      bepalingen van het Radioreglement;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.7°
    text: '**radiotelegraafstation:** een station voorzien van een radiotelegrafie-installatie;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.8°
    text: '**radiotelefoonstation:** een station voorzien van een radiotelefonie-installatie;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.9°
    text: |-
      **radiotelegrafie-installatie:** een installatie waarmee men kan zenden en ontvangen op de aan de maritieme dienst
      toegewezen radiotelegrafie-frequentiebanden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.10°
    text: |-
      **radiotelefonie-installatie:** een installatie waarmee men kan zenden en ontvangen op de aan de maritieme dienst
      toegewezen radiotelefonie-frequentiebanden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.11°
    text: '**luisterdienst radiotelegrafie:** een luisterdienst welke wordt gehouden op de radiotelegrafienoodfrequentie;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.12°
    text: '**luisterdienst radiotelefonie:** een luisterdienst welke wordt gehouden op de radiotelefonienoodfrequentie;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.13°
    text: '**passagiers:** alle personen aan boord, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.13°.13.1
    text: de kapitein en de schepelingen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.13°.13.2
    text: |-
      andere personen die, in welke hoedanigheid ook, aan boord ten behoeve van het vaartuig in dienst of tewerkgesteld
      zijn; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.13°.13.3
    text: kinderen die op de dag van inscheping de leeftijd van één jaar nog niet hebben bereikt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.14°
    text: '**voortstuwingsvermogen:**'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.14°.14.1
    text: |-
      het maximale vermogen, uitgedrukt in kiloWatt (kW), dat door de voortstuwingsmachine(s) zonder overbelasting
      gedurende onbeperkte tijdsduur kan worden geleverd, zoals dit vermogen, op grond van door de fabrikant verstrekte
      gegevens door het Hoofd van de Scheepvaartinspectie wordt vastgesteld; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.14°.14.2
    text: |-
      een door het Hoofd van de Scheepvaartinspectie vastgesteld lager vermogen, indien te zijnen genoegen wordt
      aangetoond dat slechts dit lagere vermogen ten behoeve van de voortstuwing kan worden gebruikt. Dit vermogen mag
      niet worden vastgesteld op een waarde die minder is dan 75 percent van het maximale vermogen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.15°
    text: |-
      **vlampunt:** de laagste temperatuur van een vloeistof waarbij deze voldoende damp aan de lucht afgeeft om een
      explosief mengsel van damp en lucht te doen ontstaan. Het vlampunt moet worden bepaald volgens de gesloten-kroes-
      methode van Abel, Abel-Pensky of Pensky-Martens en gecorrigeerd voor een barometerstand van 760 mm kwikkolom;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.16°
    text: '**goedgekeurd:** goedgekeurd door het Hoofd van de Scheepvaartinspectie;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.17°
    text: |-
      **lengte (L):** de lengte gelijk aan 96 percent van de lengte van de lastlijn op 85 percent van de kleinste
      holte gemeten vanaf de kiellijn, dan wel gelijk aan de lengte van de voorzijde van de voorsteven tot de hartlijn
      van de roerkoning op deze lastlijn gemeten, indien deze laatste lengte groter is. Bij schepen die met stuurlast
      zijn ontworpen, moet de lastlijn waarop deze lengte wordt gemeten, evenwijdig aan de constructiewaterlijn worden
      genomen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.18°
    text: |-
      **loodlijnen:** de loodlijnen op het voorste en het achterste punt van de lengte. De voorloodlijn moet getrokken
      worden door het snijpunt van de lastlijn waarop de lengte is gemeten en de voorzijde van de voorsteven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.19°
    text: |-
      **breedte (B):** de grootste breedte van het vaartuig, uitgedrukt in meters, midscheeps gemeten op de buitenkant
      der spanten bij een vaartuig met een metalen huid en op de buitenkant van de huid bij een vaartuig met een huid van
      een ander materiaal;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.20°
    text: '**holte:**'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.20°.20.1
    text: |-
      de vertikale afstand, uitgedrukt in meters, gemeten vanaf de kiellijn tot de bovenkant van de balken van het
      werkdek in de zijde;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.20°.20.2
    text: |-
      bij vaartuigen waar de overgang van de huidbeplating naar de dekbeplating als een rondgezette plaat is uitgevoerd,
      wordt de holte gemeten tot het snijpunt van de doorgestrookte onderzijde van de dekbeplating en de binnenzijde van
      de huidbeplating;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.20°.20.3
    text: |-
      indien het werkdek verspringt en het verhoogde gedeelte zich uitstrekt voorbij het punt waar de holte moet worden
      bepaald, wordt de holte gemeten tot een lijn die vanaf het lage gedeelte van het dek, evenwijdig aan het verhoogde
      gedeelte wordt doorgetrokken;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.21°
    text: '**holte (D):** de holte midscheeps gemeten;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.22°
    text: '**hoogst gelegen lastlijn:** de lastlijn behorende bij de maximum toelaatbare diepgang tijdens de reis;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.23°
    text: |-
      **maximum toelaatbare diepgang:** de grootste diepgang welke door het Hoofd van de Scheepvaartinspectie toelaatbaar
      wordt geacht;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.24°
    text: '**midscheeps:** het punt gelegen op het midden van de lengte;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.25°
    text: |-
      **grootspant:** de doorsnede van de romp die bepaald wordt door de snijding van het oppervlak van de romp naar
      de mal met een vertikaal vlak dat midscheeps loodrecht staat op het vlak van de waterlijn en het vlak door kiel
      en stevens;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.26°
    text: '**kiellijn:** de lijn die evenwijdig loopt aan de schuinte van de kiel en die midscheeps gaat door:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.26°.26.1
    text: |-
      de bovenkant van de kielplaat of door de aansnijding van de binnenzijde van de huidbeplating met de stafkiel,
      indien in een vaartuig met een metalen huid een stafkiel boven die lijn uitsteekt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.26°.26.2
    text: de binnenkant van de sponning in de kiel van een houten of van een composiet vaartuig;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.26°.26.3
    text: |-
      de aansnijding van de doorgestrookte lijn van de buitenzijde van de huid met de hartlijn van een vaartuig met een
      huid van een ander materiaal dan hout of metaal;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.27°
    text: '**basislijn:** de horizontale lijn die de kiellijn midscheeps snijdt;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.28°
    text: |-
      **werkdek:** in het algemeen het doorlopende blootgestelde dek van waar de visserij wordt uitgeoefend. Bij
      vaartuigen met twee of meer doorlopende dekken, kan het Hoofd van de Scheepvaartinspectie toestaan dat een lager
      dek als werkdek wordt aangemerkt, mits dit dek is gelegen boven de hoogst gelegen lastlijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.29°
    text: |-
      **bovenbouw:** de overdekte constructie op het werkdek, die zich van boord tot boord uitstrekt of waarvan de
      afstand van de zijbeplating tot elk boord niet groter is dan 4 percent van de breedte;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.30°
    text: '**gesloten bovenbouw:** een bovenbouw waarvan:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.30°.30.1
    text: de eindschotten voldoende sterk zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.30°.30.2
    text: |-
      de eventuele toegangsopeningen in de eindschotten zijn voorzien van vast aangebrachte deuren die dicht zijn tegen
      weer en wind en van gelijke sterkte als het schot, alsof daarin geen opening aanwezig was, en die aan beide zijden
      kunnen worden geopend en gesloten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.30°.30.3
    text: |-
      alle openingen in de zijden, alsmede alle overige openingen in de eindschotten zijn voorzien van doeltreffende
      middelen waarmede deze openingen dicht tegen weer en wind kunnen worden afgesloten; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.30°.30.4
    text: |-
      afzonderlijke toegangen voor de bemanning naar de binnen een brughuis of een kampanje gelegen voortstuwingsruimten
      en andere werkruimten, te allen tijde kunnen worden gebruikt, wanneer de openingen in de schotten zijn gesloten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.31°
    text: |-
      **opbouwdek:** dat doorlopende dek of dekgedeelte dat de bovenkant van een bovenbouw, dekhuis of andere opbouw
      vormt en dat ten minste 1,80 m boven het werkdek ligt. In gevallen waarin de hoogte minder is dan 1,80 m, wordt de
      bovenkant van zulk een bovenbouw, dekhuis of andere opbouw gelijkgesteld met het werkdek;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.32°
    text: |-
      **hoogte van een bovenbouw, dekhuis of andere opbouw:** de kleinste vertikale hoogte gemeten in de zijde vanaf de
      bovenkant van de balken van het opbouwdek tot de bovenkant van de balken van het werkdek;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.33°
    text: |-
      **dicht tegen weer en wind:** zodanig dicht dat onder alle omstandigheden die zich op zee kunnen voordoen, geen
      water in het vaartuig kan binnendringen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.34°
    text: |-
      **waterdicht:** het vermogen van de constructie om het doorlaten van water in enige richting te voorkomen bij een
      waterdruk waartegen de omgevende constructie volgens het ontwerp bestand is;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.35°
    text: |-
      **aanvaringsschot:** een waterdicht schot dat in het voorste deel van het vaartuig tot het werkdek is opgetrokken
      en dat aan de volgende voorwaarden voldoet:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.35°.35.1
    text: 'het schot moet zodanig zijn geplaatst dat de afstand tot de voorloodlijn:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.35°.35.1.1°
    text: |-
      niet kleiner is dan 5 percent en niet groter is dan 8 percent van de lengte bij vaartuigen waarvan de lengte 45 m
      of meer bedraagt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.35°.35.1.2°
    text: |-
      niet kleiner is dan 5 percent van de lengte en niet groter is dan 5 percent van de lengte, vermeerderd met 1,35 m,
      bij vaartuigen waarvan de lengte minder dan 45 m bedraagt, behoudens uitzonderingen toegestaan door het Hoofd van
      de Scheepvaartinspectie;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.35°.35.1.3°
    text: in geen geval kleiner is dan 2 m;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.35°.35.2
    text: |-
      in geval, ten gevolge van een afwijkende stevenvorm, enig deel van het onderwatergedeelte van het vaartuig zich
      uitstrekt tot vóór de voorloodlijn, moet de afstand als bedoeld onder 35.1 van dit onderdeel worden gemeten vanaf
      een punt halverwege het deel dat zich voor de voorloodlijn uitstrekt of vanaf een punt dat 1,5 percent van de
      lengte voor de voorloodlijn ligt, al naar gelang welke afstand kleiner is;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.35°.35.3
    text: |-
      indien het aanvaringsschot voorzien is van trapsgewijze sprongen of nissen moeten deze binnen de beperkingen vallen
      als voorgeschreven onder 35.1 van dit onderdeel;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.36°
    text: |-
      **hoofdstuurinrichting:** de stuurmachine, de krachtwerktuigen hiervoor, indien aanwezig, en de bijbehorende
      inrichtingen, alsmede het middel om het koppel op de roerkoning (bijv. de helmstok of het kwadrant)
      over te brengen, benodigd om de roeruitslag te bewerkstelligen met het doel het vaartuig onder normale
      bedrijfsomstandigheden te kunnen besturen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.37°
    text: '**krachtwerktuig voor de stuurinrichting:**'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.37°.37.1
    text: 'bij een elektrische stuurinrichting: een elektromotor met de daarbij behorende elektrische apparatuur;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.37°.37.2
    text: |-
      bij een elektrisch-hydraulische stuurinrichting: een elektromotor met de daarbij behorende elektrische apparatuur
      en de aangesloten pomp; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.37°.37.3
    text: 'bij een ander type hydraulische stuurinrichting: een pomp en het werktuig voor de aandrijving daarvan;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.38°
    text: |-
      **hulpstuurinrichting:** de inrichting waarmede de roeruitslag wordt bewerkstelligd voor de besturing van het
      vaartuig wanneer de hoofdstuurinrichting is uitgevallen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.39°
    text: |-
      **bedieningsinstallatie van de stuurinrichting:** de uitrusting waarmede de opdrachten worden overgedragen vanaf
      de brug naar de krachtwerktuigen voor de stuurinrichting. Bedieningsinstallaties van stuurinrichtingen bestaan
      uit gevers, ontvangers, hydraulische verstelpompen met daarbij behorende motoren, bedieningen voor motoren,
      pijpleidingen en kabels;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.40°
    text: |-
      **maximum dienstsnelheid vooruit:** de grootste snelheid waarvoor het vaartuig is ontworpen en die tijdens de vaart
      op zee gehandhaafd moet kunnen worden bij de maximum toelaatbare diepgang tijdens de reis;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.41°
    text: |-
      **maximum snelheid achteruit:** de geschatte snelheid die het vaartuig kan bereiken bij het ontworpen vermogen voor
      het achteruitvaren op de maximum toelaatbare diepgang tijdens de reis;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.42°
    text: |-
      **oliestookinrichting:** de installatie gebruikt voor de toebereiding van brandstofolie voor levering aan
      een met olie gestookte ketel, of die installatie gebruikt voor de toebereiding van olie voor levering aan een
      verbrandingsmotor, met inbegrip van alle oliedrukpompen, filters en verhitters die olie behandelen onder een druk
      van meer dan 0,18 N/mm2;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.43°
    text: |-
      **normale toestanden van bedrijfsvoering en leefbaarheid:** de toestanden waarin het vaartuig in zijn geheel,
      met inbegrip van de werktuigen, dienstuitoefening, hoofd- en hulpwerktuigen ten behoeve van de voortstuwing,
      stuurinrichting en bijbehorende uitrusting, hulpmiddelen voor een veilige navigatie en voor de beperking van de
      gevaren van brand en vervulling, middelen voor interne en externe communicatie en seinapparatuur, voorzieningen
      voor ontsnapping en lieren voor reddingboten en hulpverleningsboten, goed functioneert en waarbij aan minimum
      voorwaarden voor een comfortabel verblijf aan boord wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.44°
    text: |-
      **dood-schip-toestand:** de toestand waarbij de hoofdvoortstuwingsinstallatie, ketels en hulpwerktuigen niet in
      bedrijf zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.45°
    text: |-
      **hoofdschakelbord:** een schakelbord dat rechtstreeks wordt gevoed door de elektrische hoofdkrachtbron en bestemd
      is om de elektrische energie voor alle diensten te verdelen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.46°
    text: |-
      **noodschakelbord:** een schakelbord dat, in het geval dat de voeding van de elektrische hoofdkrachtbron uitvalt,
      direct wordt gevoed door de elektrische noodkrachtbron of door de tijdelijke noodkrachtbron, en bestemd is om de
      elektrische energie over de nooddiensten te verdelen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.47°
    text: |-
      **elektrische hoofdkrachtbron:** een krachtbron welke elektrische energie moet kunnen leveren aan het
      hoofdschakelbord voor de verdeling naar alle systemen nodig om het schip in normale toestanden van bedrijfsvoering
      en leefbaarheid te kunnen houden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.48°
    text: |-
      **elektrische noodkrachtbron:** een krachtbron voor elektrische energie, bestemd om het noodschakelbord te voeden
      in het geval dat de voeding van de elektrische noodkrachtbron uitvalt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.49°
    text: |-
      **tijdelijk onbemande machinekamers:** die ruimten waarin zich de hoofdvoortstuwingswerktuigen en bijbehorende
      installaties, alsmede alle elektrische hoofdkrachtbronnen bevinden en die niet te allen tijde bij alle
      werkzaamheden, met inbegrip van het manoeuvreren, bemand behoeven te zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.50°
    text: |-
      **onbrandbaar materiaal:** een materiaal dat noch brandt, noch ontvlambare gassen in voldoende hoeveelheid afgeeft
      om bij verhitting tot ongeveer 750°C tot zelfontbranding over te gaan, hetgeen ten genoegen van het Hoofd van de
      Scheepvaartinspectie moet worden aangetoond door middel van een door hem aanvaarde beproevingsmethode. Elk ander
      materiaal is brandbaar materiaal;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.51°
    text: |-
      **standaard-brandproef:** een proef waarbij gedeelten van de betrokken schotten of dekken in een proef-oven
      blootgesteld worden aan temperaturen die ongeveer overeenkomen met de standaard tijdtemperatuurkromme. De gedeelten
      van de betrokken schotten of dekken moeten een blootgestelde oppervlakte hebben van ten minste 4,65 m2 en een
      hoogte, of lengte van het dek, van 2,44 m; zij moeten zo nauwkeurig mogelijk overeenkomen met de voorgenomen
      constructie en waar nodig ten minste één naad bevatten. Met de standaard tijdtemperatuurkromme wordt bedoeld een
      gelijkmatig verlopende kromme door de volgende punten gemeten boven de aanvankelijke temperatuur in de oven: aan
      het einde van de eerste 5 minuten: 556°C, aan het einde van de eerste 10 minuten: 659°C, aan het einde van de
      eerste 15 minuten: 718°C, aan het einde van de eerste 30 minuten: 821°C, aan het einde van de eerste 60 minuten:
      925°C;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.52°
    text: '**schotten van klasse «A»:** schotten en dekken die aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.52°.52.1
    text: zij moeten geconstrueerd zijn van staal of van ander, gelijkwaardig materiaal;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.52°.52.2
    text: zij moeten voldoende verstijfd zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.52°.52.3
    text: |-
      zij moeten tot aan het einde van de standaard-brandproef van één uur de doortocht van rook en vlammen kunnen
      verhinderen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.52°.52.4
    text: |-
      zij moeten zodanig geïsoleerd zijn met goedgekeurde onbrandbare materialen dat de gemiddelde temperatuur aan de
      niet-blootgestelde zijde niet meer dan 139°C boven de begintemperatuur stijgt, noch de temperatuur op enig punt, de
      naden inbegrepen, meer dan 180°C boven de begintemperatuur stijgt binnen de onderstaand aangegeven tijd: klasse «A-
      60» : 60 minuten, klasse «A-30» : 30 minuten, klasse «A-15» : 15 minuten, klasse «A-0» : 0 minuten; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.52°.52.5
    text: |-
      het Hoofd van de Scheepvaartinspectie kan beproeving eisen van een prototype van een schot van klasse «A» teneinde
      zekerheid te verkrijgen dat dit voldoet aan bovengenoemde eisen omtrent stijfheid, doorlaten van rook en vlammen en
      de beperking van de temperatuurstijging;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.53°
    text: '**schotten van klasse «B»:** schotten, dekken, plafonds of beschietingen die aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.53°.53.1
    text: |-
      zij moeten tot aan het einde van het eerste half uur van de standaard-brandproef de doortocht van vlammen kunnen
      verhinderen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.53°.53.2
    text: |-
      zij moeten een zodanig isolerend vermogen hebben dat de gemiddelde temperatuur aan de niet-blootgestelde zijde niet
      meer dan 139°C boven de begintemperatuur stijgt, noch de temperatuur op enig punt, de naden inbegrepen, meer dan
      225°C boven de begintemperatuur stijgt binnen de onderstaand aangegeven tijd: klasse «B-15» : 15 minuten, klasse
      «B- 0» : 0 minuten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.53°.53.3
    text: |-
      zij moeten zijn opgebouwd uit goedgekeurde onbrandbare materialen en alle materialen die gebruikt worden voor
      schotten van klasse «B» en voor het aanbrengen daarvan, dienen onbrandbaar te zijn, behoudens dat brandbare
      fineerlagen kunnen worden toegestaan onder voorwaarde dat die voldoen aan de daarop van toepassing zijnde
      voorschriften van dit besluit; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.53°.53.4
    text: |-
      het Hoofd van de Scheepvaartinspectie kan de beproeving eisen van een prototype van een schot van klasse «B»
      teneinde zekerheid te verkrijgen dat dit voldoet aan bovengenoemde eisen omtrent het doorlaten van vlammen en de
      beperking van de temperatuurstijging;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.54°
    text: |-
      **schotten van klasse «C»:** schotten en dekken welke zijn opgebouwd uit goedgekeurde onbrandbare materialen.
      Zij behoeven niet te voldoen aan eisen betreffende het doorlaten van rook en vlammen of de beperking van de
      temperatuurstijging. Brandbare fineerlagen kunnen worden toegestaan onder voorwaarde dat die voldoen aan de daarop
      van toepassing zijnde voorschriften van dit besluit;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.55°
    text: '**schotten van klasse «F»:** schotten, dekken, plafonds of beschietingen die aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.55°.55.1
    text: |-
      zij moeten tot aan het einde van het eerste half uur van de standaard-brandproef de doortocht van vlammen kunnen
      verhinderen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.55°.55.2
    text: |-
      zij moeten een zodanig isolerend vermogen hebben dat de gemiddelde temperatuur aan de niet-blootgestelde zijde tot
      aan het einde van het eerste half uur van de standaard-brandproef niet meer dan 139°C boven de begintemperatuur
      stijgt, noch de temperatuur op enig punt, de naden inbegrepen, meer dan 225°C boven de begintemperatuur stijgt; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.55°.55.3
    text: |-
      het Hoofd van de Scheepvaartinspectie kan de beproeving eisen van een prototype van een schot van klasse «F»,
      teneinde zekerheid te verkrijgen dat dit voldoet aan bovengenoemde eisen omtrent het doorlaten van vlammen en de
      beperking van de temperatuurstijging;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.56°
    text: |-
      **doorlopende plafonds of beschietingen van klasse «B»:** plafonds of beschietingen van klasse «B» die slechts
      eindigen bij een schot van klasse «A» of «B»;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.57°
    text: |-
      **staal of ander, gelijkwaardig materiaal:** staal, of elk onbrandbaar materiaal dat zelf, of door middel van
      isolatiemateriaal, een brandwerendheid heeft die gelijkwaardig is aan die van staal tot aan het einde van de van
      toepassing zijnde standaard-brandproef. Aluminiumlegering, voorzien van een doeltreffende isolatie, kan als zodanig
      worden aanvaard;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.58°
    text: |-
      **laag vlamverspreidend vermogen:** de eigenschap die aangeeft dat het aldus omschreven oppervlak de
      vlamuitbreiding op voldoende wijze kan beperken. Deze eigenschap dient ten genoegen van het Hoofd van de
      Scheepvaartinspectie te worden aangetoond door middel van een door hem aanvaarde beproevingsmethode;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.59°
    text: |-
      **ruimten voor accommodatie:** ruimten bestemd voor algemeen gebruik, gangen, toiletten, hutten, kantoren,
      ziekenverblijven, bioscopen, ontspanningsruimten, afzonderlijke pantries zonder voorzieningen om te koken, en
      soortgelijke ruimten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.60°
    text: |-
      **ruimten voor algemeen gebruik:** die delen van de accommodatie welke in gebruik zijn als portalen, eetzalen,
      salons, en soortgelijke permanent ingesloten ruimten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.61°
    text: |-
      **dienstruimten:** ruimten die gebruikt worden voor kombuizen, pantries met voorzieningen om te koken, kasten
      en voorraadkamers, werkplaatsen andere dan die welke deel uitmaken van de ruimten voor machines, en soortgelijke
      ruimten, zomede de bijbehorende schachten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.62°
    text: |-
      **controlestations:** ruimten waarin de radio-installatie van het vaartuig, de voornaamste navigatiemiddelen of de
      elektrische noodkrachtbron zijn ondergebracht of die waarin de uitrusting voor de brandmelding of de brandcontrole
      is samengebracht;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.63°
    text: |-
      **ruimten voor machines van categorie A:** alle ruimten met inbegrip van de bijbehorende schachten, waarin zijn
      ondergebracht:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.63°.63.1
    text: verbrandingsmotoren of gasturbines, die worden gebruikt als hoofdvoortstuwingswerktuig;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.63°.63.2
    text: |-
      verbrandingsmotoren of gasturbines, andere dan die worden gebruikt als hoofdvoortstuwingswerktuig indien zodanige
      machines een gezamenlijk vermogen hebben van 375 kW of meer; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.63°.63.3
    text: met olie gestookte ketels of oliestookinrichtingen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.64°
    text: |-
      **ruimten voor machines:** alle ruimten voor machines van categorie A en alle andere ruimten waarin
      voortstuwingswerktuigen, ketels, oliestookinrichtingen, stoommachines en verbrandingsmotoren, gasturbines,
      generatoren en belangrijke elektrische werktuigen, olielaadstations, koelmachine-installaties, stabilisatie-
      inrichtingen, luchtverversings- en luchtbehandelingsinstallaties zijn ondergebracht, en soortgelijke ruimten,
      zomede de bijbehorende schachten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.65°
    text: '**ontdekking:** de vaststelling van de plaats van de overlevenden of de groepsreddingmiddelen;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.66°
    text: |-
      **inschepingsladder:** de ladder die op de inschepingsplaats voor de groepsreddingmiddelen is aangebracht ten einde
      een veilige toegang te bieden tot de groepsreddingmiddelen nadat deze te water gelaten zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.67°
    text: |-
      **te water laten door middel van vrij opdrijven:** de methode van te water laten van een groepsreddingmiddel
      waarbij dit automatisch van een zinkend vaartuig wordt ontkoppeld en klaar is voor gebruik;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.68°
    text: |-
      **overlevingspak:** een beschermend pak dat het verlies van lichaamswarmte van een persoon gekleed in zulk een pak
      liggend in koud water, vermindert;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.69°
    text: |-
      **opblaasbaar toestel:** een toestel waarvan het drijfvermogen afhankelijk is van niet-verstijfde, met gas gevulde
      drijfkamers en dat gewoonlijk, tot aan de klaar voor gebruik situatie, in niet-opgeblazen toestand wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.70°
    text: |-
      **toestel in opgeblazen toestand:** een toestel waarvan het drijfvermogen afhankelijk is van niet-verstijfde, met
      gas gevulde drijfkamers en dat permanent in opgeblazen toestand en klaar voor gebruik wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.71°
    text: |-
      **tewaterlatingsmiddel of -voorziening:** een middel of voorziening om een groepsreddingmiddel of
      hulpverleningsboot vanaf de opstellingsplaats veilig te water te brengen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.72°
    text: |-
      **reddingmiddelen of -voorzieningen van een nieuw ontwerp:** reddingmiddelen of -voorzieningen die nieuwe
      eigenschappen bevatten die niet geheel vallen onder de voorschriften van dit besluit, maar die een gelijke of
      hogere norm van veiligheid bieden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.73°
    text: |-
      **hulpverleningsboot:** een boot ontworpen om personen in nood uit het water te kunnen halen en voor het bij elkaar
      brengen van reddingvlotten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.74°
    text: |-
      **lichtterugkaatsend materiaal:** materiaal dat een lichtstraal die daarop gericht wordt, in tegengestelde richting
      terugkaatst;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.75°
    text: |-
      **groepsreddingmiddel:** een middel dat personen die in nood verkeren, in leven kan houden vanaf het moment dat zij
      het vaartuig verlaten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.76°
    text: |-
      **hulpmiddel tegen warmteverlies:** een zak of pak, vervaardigd uit waterdicht materiaal met een zeer lage
      warmtegeleiding;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.77°
    text: |-
      **gediplomeerd sloepsgast:** elk lid der bemanning dat in het bezit is van een diploma als stuurman , of als
      sloepsgast, als bedoeld in hoofdstuk 12, paragraaf 3;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.78°
    text: '**een vaartuig gebouwd:** een vaartuig waarvan:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.78°.78.1
    text: de kiel is gelegd; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.78°.78.2
    text: |-
      de aanbouw, herkenbaar als behorend tot een bepaald schip, is aangevangen en is aangevangen met de samenbouw die
      ten minste 50 000 kg moet omvatten of één percent van de geschatte massa van al het bouwmateriaal, welke van deze
      twee waarden de laagste is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.79°
    text: |-
      **laagst gelegen lastlijn:** de lastlijn behorende bij de beladingstoestand, waarbij het vaartuig is beladen met
      een restant brandstof en zoetwater overeenkomende met 10 percent van de beschikbare inhoud van de betreffende tanks
      en met een lading in het visruim gelijk aan 20 percent van de lading die in het visruim in rekening moet worden
      gebracht voor de beoordeling van de stabiliteit;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: 2.1.80
    text: |-
      *klassebureau:* een natuurlijke persoon of rechtspersoon, aangewezen krachtens
      [artikel 6, tweede lid, van de Schepenwet][ref1] en krachtens [artikel 6 van het Schepenbesluit 1965][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel6
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '6'
  - number: '2.2'
    text: |-
      Voor de toepassing van dit besluit wordt onder «vaartuig» begrepen een vissersvaartuig als bedoeld in
      [artikel 1, eerste lid, van de Schepenwet][ref1] alsmede een vissersvaartuig dat over zee naar zijn bestemming
      wordt gesleept.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel1
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '1'
  - number: '2.3'
    text: |-
      Voor de toepassing van dit besluit worden personen, die tengevolge van schipbreuk of andere bijzondere, onvoorziene
      omstandigheden aan boord zijn genomen, niet als passagiers aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: '2.4'
    text: |-
      Voor de toepassing van dit besluit wordt, ook wat de strafbepalingen betreft, onder «eigenaar» verstaan de
      persoon die het beheer over het vaartuig heeft, hetzij hij eigenaar, reder of boekhouder is van de rederij van het
      vaartuig, hetzij hem het vaartuig in gebruik is gegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel2
  - number: '4.1'
    text: |-
      Met de bij of krachtens dit besluit vastgestelde technische normen of technische eisen worden gelijkgesteld daaraan
      gelijkwaardige technische normen of technische eisen, vastgesteld door of vanwege een andere lid-staat van de
      Europese Unie dan wel door of vanwege een staat die partij is bij de overeenkomst inzake de Europese Economische
      Ruimte.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel4
  - number: '4.2'
    text: |-
      Met de bij of krachtens dit besluit geëiste typegoedkeuringen worden gelijkgesteld daaraan gelijkwaardige
      typegoedkeuringen, geëist door of vanwege een andere lid-staat van de Europese Unie dan wel door of van-wege een
      staat die partij is bij de overeenkomst inzake de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel4
  - number: '5.1'
    text: |-
      Indien één of meer bepalingen van dit besluit op het ogenblik dat een reis wordt ondernomen niet op een vaartuig
      van toepassing zijn, zullen zij, voorzover het vaartuig tengevolge van slecht weer of tengevolge van een ander
      geval van overmacht is genoodzaakt van de voorgenomen reis af te wijken, niet op dit vaartuig van toepassing
      worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel5
  - number: '5.2'
    text: |-
      Bij de beoordeling van de vraag of een bepaling van dit besluit op een vaartuig van toepassing is, wordt met
      personen die zich daar aan boord bevinden tengevolge van overmacht of tengevolge van een wettelijke verplichting
      van de kapitein om hetzij schipbreukelingen, hetzij andere in nood verkerende personen te vervoeren, geen rekening
      gehouden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel5
  - number: '6.1'
    text: |-
      In het belang van een goede uitvoering van dit besluit kunnen door het Hoofd van de Scheepvaartinspectie nadere
      voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel6
  - number: '6.2'
    text: |-
      De ambtenaren, bedoeld in [artikel 10 van de Schepenwet][ref1], kunnen in elk bijzonder geval, rekening houdende
      met de ter zake door het Hoofd van de Scheepvaartinspectie gegeven algemene aanwijzingen, voorschriften geven ter
      bevordering van de juiste naleving van het bepaalde in dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel10
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '10'
  - number: '7.1'
    text: |-
      De bouw, de inrichting, de uitrusting, of de toestand van het vaartuig, kunnen leiden tot beperkingen van het
      vaargebied dat door het Hoofd van de Scheepvaartinspectie aan elk vaartuig wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel7
  - number: '7.2'
    text: |-
      De grenzen van de in het voorgaande lid bedoelde vaargebieden worden vastgesteld door het Hoofd van de
      Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel7
  - number: '9.1'
    text: |-
      Voordat een eerste onderzoek plaatsvindt, kiest de eigenaar of de bouwer van een schip voor de regels van een
      bepaald klassebureau. Bij volgende onderzoeken worden de regels van dat klassebureau toegepast.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel9
  - number: '9.2'
    text: |-
      De zeewaardigheid van een vaartuig wordt met betrekking tot de bouw en de uitrusting beoordeeld volgens de regels
      van een krachtens het eerste lid gekozen klassebureau, voor zover deze regels niet in strijd zijn met het bepaalde
      bij of krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel9
  - number: '9.3'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan keuringen die zijn verricht door een klassebureau gelijkstellen met
      keuringen die zijn verricht door een ambtenaar van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel9
  - number: '10'
    text: |-
      De eigenaar, de kapitein en de schepelingen zijn verplicht aan degene die een onderzoek verricht alle medewerking
      te verlenen die deze redelijkerwijs bij de uitoefening van zijn taak kan vorderen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel10
  - number: '12.1'
    text: |-
      Een vaartuig is, met inachtneming van het bepaalde in de volgende leden van dit artikel, onderworpen aan de
      volgende onderzoeken:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel12
  - number: 12.1.1°
    text: een onderzoek voordat het vaartuig in dienst wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel12
  - number: 12.1.2°
    text: tussentijdse onderzoeken;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel12
  - number: 12.1.3°
    text: periodieke onderzoeken; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel12
  - number: 12.1.4°
    text: aanvullende onderzoeken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel12
  - number: '12.2'
    text: |-
      Het in het eerste lid, onder 1, bedoelde onderzoek voordat het vaartuig in dienst wordt gesteld, omvat: een
      volledige inspectie van de constructie, de voor de visserij bestemde inrichtingen, machine-installaties, algemene
      inrichting en het materiaal, met inbegrip van de romp van het vaartuig aan de buitenzijde en het in- en uitwendige
      van de ketels en uitrusting, benevens een beoordeling van de stabiliteit. Dit onderzoek moet zodanig zijn dat het
      zeker is dat de stabiliteit, de algemene inrichting, het materiaal en de verbanddelen van de romp, ketels en andere
      drukvaten met toebehoren, hoofd- en hulpwerktuigen, elektrische installaties, radio-installaties, radiotelegrafie-
      installaties in reddingboten, draagbare radiotoestellen voor groepsreddingmiddelen, nood radiobakens voor
      groepsreddingmiddelen, reddingmiddelen, brandontdekkings- en brandblusmiddelen, brandbeveiligingsplannen, radars,
      echoloden, gyrokompassen en andere uitrusting ten volle voldoen aan de eisen van dit besluit. Het onderzoek moet
      ook zodanig zijn, dat het zeker is dat de technische uitvoering van alle delen van het vaartuig en zijn uitrusting
      in alle opzichten bevredigend is en dat het vaartuig is voorzien van de lichten, dagmerken, middelen voor het geven
      van geluidsseinen en noodseinen zoals vereist krachtens de voorschriften van dit besluit. In het geval loodsladders
      worden meegevoerd, moeten deze eveneens onderzocht worden teneinde zeker te stellen dat zij deugdelijk zijn en
      voldoen aan het daaromtrent bepaalde in dit besluit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel12
  - number: '12.3'
    text: |-
      Het in het eerste lid, onder 2, bedoelde tussentijdse onderzoek omvat elk jaar een inspectie van de constructie, de
      voor de visserij bestemde inrichtingen, de machine-installatie en de uitrusting van het vaartuig. Het tussentijdse
      onderzoek moet zodanig zijn dat het zeker is dat geen wijzigingen zijn aangebracht waardoor de veiligheid van het
      vaartuig of de opvarenden nadelig zou worden beïnvloed.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel12
  - number: '12.4'
    text: 'Het in het eerste lid, onder 3, bedoelde periodieke onderzoek omvat:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel12
  - number: 12.4.1°
    text: |-
      elke vijf jaar een inspectie waar het de constructie en de machine-installatie van het vaartuig betreft, bedoeld in
      de hoofdstukken 2, 3, 4, 5 en 6;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel12
  - number: 12.4.2°
    text: |-
      elke twee jaar een inspectie waar het de uitrusting van het vaartuig betreft, bedoeld in de hoofdstukken 2, 3, 4,
      5, 6, 7, 8 en 10; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel12
  - number: 12.4.3°
    text: |-
      een jaarlijkse inspectie van de medische uitrusting aan boord, met de daarbij behorende controlelijsten
      en handleidingen, bedoeld in de artikelen 231, 237, en 317, derde lid, van de medicijnkisten aan boord van
      reddingboten en hulpverleningsboten, bedoeld in artikel 221, tweeënveertigste lid, onderdeel 20, onderscheidenlijk
      artikel 223, elfde lid, onderdeel 9, en van de radio-installaties, de radiorichtingzoeker en de radar, bedoeld in
      de hoofdstukken 9 en 10.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel12
  - number: '12.5'
    text: |-
      De in het eerste lid, onder 4, bedoelde aanvullende onderzoeken dienen hetzij geheel, hetzij gedeeltelijk,
      al naar gelang de omstandigheden, te worden gehouden telkens wanneer zich een ongeval heeft voorgedaan of een
      onvolkomenheid is ontdekt, waardoor de veiligheid van het vaartuig of de doeltreffendheid of volledigheid van
      de reddingmiddelen of andere uitrusting kan zijn aangetast of wanneer belangrijke herstellingen of vernieuwingen
      worden uitgevoerd. Het onderzoek moet zodanig zijn, dat het zeker is dat de noodzakelijke herstellingen of
      vernieuwingen deugdelijk zijn uitgevoerd, dat het materiaal en de uitvoering van zulke reparaties of vernieuwingen
      in alle opzichten bevredigend zijn en dat het vaartuig in alle opzichten voldoet aan de eisen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel12
  - number: '13'
    text: |-
      Het onderzoek van stoom- en damptoestellen geschiedt in overeenstemming met de regels die zijn vastgesteld door het
      klassebureau, voorzover bij of krachtens dit besluit daaromtrent geen nadere regels zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel13
  - number: '14.1'
    text: |-
      Van een vaartuig moet ten minste eenmaal in de 36 maanden de gehele romp aan de buitenzijde worden onderzocht, met
      dien verstande dat het tijdsverloop tot het volgende onderzoek van de romp aan de buitenzijde zodanig is dat het
      vaartuig ten minste twee zulke onderzoeken ondergaat in een periode van 5 jaar.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel14
  - number: '14.2'
    text: |-
      Afhankelijk van de leeftijd van het vaartuig, het materiaal van de romp, de toestand van de romp tijdens het
      laatste onderzoek en de getroffen voorzieningen ter bescherming tegen corrosie en intering, kan het Hoofd van de
      Scheepvaartinspectie een kortere periode tussen 2 opeenvolgende onderzoeken van de romp aan de buitenzijde eisen,
      dan toegestaan in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel14
  - number: '15'
    text: |-
      Telkens wanneer van een vaartuig de romp aan de buitenzijde zal worden onderzocht, of wanneer aan het vaartuig of
      aan de werktuigen herstellingen zullen plaatshebben, moet hiervan tijdig aan de Scheepvaartinspectie worden kennis
      gegeven, opdat deze in de gelegenheid zal zijn hierbij toezicht te houden of te doen houden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel15
  - number: '16'
    text: 'Nadat een onderzoek als bedoeld in artikel 12, is beëindigd:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel16
  - number: 16.1°
    text: |-
      dient de toestand van het vaartuig en de uitrusting te worden gehandhaafd in overeenstemming met het bepaalde in
      dit besluit, voorzover dit van toepassing is, om zeker te stellen dat het vaartuig in alle opzichten veilig blijft
      om zonder gevaar voor vaartuig en opvarenden naar zee te vertrekken; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel16
  - number: 16.2°
    text: |-
      mag, zonder goedkeuring van het Hoofd van de Scheepvaartinspectie, generlei verandering in de constructie,
      in de werktuiglijke inrichting en in de uitrusting worden aangebracht, voorzover deze aan het onderzoek waren
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel16
  - number: '17.1'
    text: |-
      Indien een vaartuig schade heeft opgelopen of zich iets heeft voorgedaan waardoor het vermoeden rijst dat schade
      dan wel een gebrek is ontstaan, waardoor de veiligheid van het vaartuig of de deugdelijkheid of volledigheid van
      de reddingmiddelen of van de andere uitrusting kan zijn beïnvloed, dient de kapitein de Scheepvaartinspectie, zo
      spoedig mogelijk in te lichten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel17
  - number: '17.2'
    text: |-
      Indien een van de gevallen als bedoeld in het eerste lid zich heeft voorgedaan en het vaartuig bevindt zich
      in een haven buiten Nederland, buiten de Nederlandse Antillen of buiten Aruba, dan dient de kapitein bovendien
      onmiddellijk de ter plaatse bevoegde autoriteiten in te lichten. De reis mag niet worden voortgezet voordat de
      kapitein met een surveyor van het klassebureau in verbinding is getreden en voordat deze een verklaring heeft
      afgegeven, inhoudende dat de herstelling naar behoren is geschied of dat de reis zonder bezwaar kan worden
      vervolgd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel17
  - number: '17.3'
    text: |-
      Indien in de haven buiten Nederland, buiten de Nederlandse Antillen of buiten Aruba de in het voorgaande lid
      bedoelde surveyor niet ter plaatse is of zal komen, is de kapitein bevoegd met inachtneming van het bepaalde in
      [artikel 9, derde lid, van de Schepenwet][ref1] de reis te vervolgen, tenzij de ter plaatse bevoegde autoriteiten
      zich hiertegen verzetten. De kapitein dient een en ander in het scheepsdagboek te doen aantekenen en zo mogelijk te
      doen vaststellen door een ter plaatse aanwezige Nederlandse consulaire ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel9
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '9'
  - number: '20.1'
    text: |-
      Voor het verkrijgen van een certificaat moet de eigenaar of de bouwer van het vaartuig een aanvraag indienen bij
      de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel20
  - number: '20.2'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nadere regels stellen betreffende de aanvraag ter verkrijging van een
      certificaat en de daarbij over te leggen tekeningen en gegevens van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel20
  - number: '21'
    text: |-
      Alle op grond van dit besluit afgegeven certificaten of gewaarmerkte afschriften daarvan moeten ter inzage liggen
      op een voor alle schepelingen toegankelijke plaats, onder aanduiding van de plaats op een zichtbare wijze, zodat
      zij van de inhoud daarvan behoorlijk kunnen kennisnemen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel21
  - number: '22.1'
    text: |-
      Behoudens het bepaalde in het vierde lid, wordt een certificaat van deugdelijkheid afgegeven nadat bij het
      onderzoek bedoeld in artikel 12, eerste lid, onder 1 en 3, en ook overigens is gebleken, dat aan de voorschriften
      van dit besluit is voldaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel22
  - number: '22.2'
    text: |-
      De aanvraag tot het verkrijgen van een eerste certificaat van deugdelijkheid moet vergezeld gaan van de voor
      de controle van bouw en inrichting benodigde tekeningen en berekeningen, voorzover deze tevoren nog niet
      waren ingezonden, van het bewijs van inschrijving in het centraal visserij-register en van de meetbrief of van
      gewaarmerkte afschriften van deze stukken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel22
  - number: '22.3'
    text: |-
      Voor een vaartuig voorzien van een stoomketelinstallatie, moet elke aanvraag tot het verkrijgen van een certificaat
      van deugdelijkheid vergezeld gaan van een opgave van de datum van het laatste onderzoek van genoemde installatie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel22
  - number: '22.3'
    text: |-
      Voor een vaartuig onder toezicht van een van de klassebureaus, moet bij elke aanvraag tot het verkrijgen van een
      certificaat van deugdelijkheid bovendien het op het ogenblik van aanvraag geldige certificaat van dat bureau worden
      overgelegd. Bevindt het vaartuig zich in het buitenland, dan kan met toezending van een gewaarmerkt afschrift van
      dat certificaat worden volstaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel22
  - number: '22.4'
    text: |-
      Voor een vaartuig waarvoor een certificaat als bedoeld in het derde lid, onder 2, is overgelegd, kan een
      certificaat van deugdelijkheid worden afgegeven, tenzij aan de ambtenaren van de Scheepvaartinspectie bij onderzoek
      blijkt dat het certificaat van het klassebureau ten onrechte werd toegekend of dat sedert die toekenning de
      toestand van het vaartuig zodanig is veranderd, dat de zeewaardigheid onvoldoende is geworden of dat uit anderen
      hoofde tegen de afgifte van een certificaat van deugdelijkheid bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel22
  - number: '22.5'
    text: Het Hoofd van de Scheepvaartinspectie stelt vast voor welk tijdvak het certificaat van deugdelijkheid zal gelden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel22
  - number: '22.5'
    text: |-
      De geldigheidsduur van een certificaat van deugdelijkheid kan door of namens het Hoofd van de Scheepvaartinspectie
      worden verlengd, nadat ten genoegen van genoemd hoofd is gebleken dat aan de betreffende voorschriften van dit
      besluit is voldaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel22
  - number: '22.6'
    text: Op het certificaat van deugdelijkheid wordt het vaargebied, bedoeld in artikel 7, eerste lid, vermeld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel22
  - number: '23.1'
    text: Een vaartuig moet een veiligheidscertificaat voor vissersvaartuigen aan boord hebben.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel23
  - number: '23.2'
    text: |-
      Een veiligheidscertificaat voor vissersvaartuigen wordt afgegeven nadat bij een onderzoek als bedoeld in artikel
      12, eerste lid, onder 1 en 3, is gebleken, dat aan de voorschriften van de hoofdstukken 2 tot en met 10 is voldaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel23
  - number: '23.3'
    text: |-
      De aanvraag tot het verkrijgen van een veiligheidscertificaat voor vissersvaartuigen moet vergezeld gaan van de
      nodige gegevens betreffende de redding- en veiligheidsmiddelen, de verdere uitrusting en van de radio-installaties
      en -toestellen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel23
  - number: '23.4'
    text: |-
      Het Hoofd van de Scheepvaartinspectie stelt vast voor welk tijdvak een door hem afgegeven veiligheidscertificaat
      voor vissersvaartuigen zal gelden, met dien verstande dat dit tijdvak niet langer mag zijn dan vijf jaar.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel23
  - number: '23.4'
    text: |-
      Indien een vaartuig zich ten tijde van het aflopen van de geldigheidsduur van het veiligheidscertificaat voor
      vissersvaartuigen in het buitenland bevindt, kan de geldigheidsduur van genoemd certificaat door of namens het
      Hoofd van de Scheepvaartinspectie worden verlengd met een tijdsduur van ten hoogste vijf maanden, teneinde het
      vaartuig in staat te stellen zijn reis te voltooien naar een haven waar het aan een onderzoek als bedoeld in
      artikel 12, eerste lid, onder 3, zal worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel23
  - number: '23.4'
    text: |-
      Een vaartuig ten behoeve waarvan een verlenging als bedoeld onder 4.2 is verleend, mag, nadat het in de haven waar
      het aan het onderzoek zal worden onderworpen is aangekomen, niet krachtens een dergelijke verlenging die haven
      verlaten zonder een nieuw veiligheidscertificaat voor vissersvaartuigen te hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel23
  - number: '23.4'
    text: |-
      Een niet op grond van het bepaalde onder 4.2 verlengde geldigheidsduur van een veiligheidscertificaat voor
      vissersvaartuigen kan door of namens het Hoofd van de Scheepvaartinspectie worden verlengd voor een tijdsduur van
      ten hoogste een maand, aanvangende op de op het certificaat vermelde vervaldatum.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel23
  - number: '23.5'
    text: |-
      Het veiligheidscertificaat voor vissersvaartuigen moet door of namens het Hoofd van de Scheepvaartinspectie van
      aantekeningen worden voorzien waaruit blijkt dat de inspecties bedoeld in artikel 12, derde lid en vierde lid,
      onder 2 en 3, hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel23
  - number: '24'
    text: |-
      Indien het Hoofd van de Scheepvaartinspectie ontheffing verleent, voegt hij aan het desbetreffende certificaat een
      certificaat van ontheffing toe. De geldigheidsduur van een certificaat van ontheffing kan niet langer zijn dan de
      geldigheidsduur van het certificaat waarop de ontheffing betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel24
  - number: '26.1'
    text: |-
      Blijkt aan een ambtenaar van de Scheepvaartinspectie, dat niet meer wordt voldaan aan de eisen die voor de afgifte
      van enig certificaat waren gesteld en dat in het ontbrekende niet voldoende wordt voorzien, dan trekt hij het
      betreffende certificaat in.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel26
  - number: '26.2'
    text: |-
      Indien de in het eerste lid bedoelde ambtenaar een certificaat intrekt, deelt hij dit terstond mede aan het Hoofd
      van de Scheepvaartinspectie. In Nederland draagt het Hoofd zorg voor de bekendmaking van de intrekking. In de
      Nederlandse Antillen en in Aruba geeft het Hoofd de eigenaar onder opgaaf van redenen bij aangetekend schrijven
      kennis van de intrekking.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel26
  - number: '27.1'
    text: |-
      Materiaal te gebruiken voor de bouw van de scheepsromp en de voornaamste werktuigen alsmede voor verbouwing,
      belangrijke herstelling of vernieuwing van vitale delen, moet voldoen aan en zijn gekeurd volgens de door een
      klassebureau gestelde eisen, dan wel voldoen aan het bepaalde in paragraaf 2 en zijn gekeurd op de wijze als daarin
      is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel27
  - number: '27.2'
    text: |-
      De sterkte en de constructie van de romp, bovenbouwen, dekhuizen, schachten van machinekamers, toegangskappen en
      elke andere constructie en die van de scheepsuitrusting moeten voldoende bestand zijn tegen alle omstandigheden
      waaronder het vaartuig moet kunnen opereren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel27
  - number: '27.3'
    text: |-
      Zowel de afmetingen van alle verbanddelen van de in het tweede lid genoemde onderdelen, als de wijze waarop deze
      ten opzichte van elkaar zijn aangebracht en verbonden, moeten zodanig zijn dat, rekening houdende met de afmetingen
      van het vaartuig en het vaargebied waarvoor het bestemd is, zowel de algemene sterkte, als het weerstandsvermogen
      tegen plaatselijk optredende krachten aan redelijke eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel27
  - number: '27.4'
    text: |-
      De romp van vaartuigen bestemd om in ijs dienst te doen, moet versterkt worden, rekening houdend met de te
      verwachten omstandigheden tijdens de vaart en in het werkgebied.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel27
  - number: '27.5'
    text: |-
      De uitvoering van het constructiewerk van de in het tweede lid genoemde onderdelen moet aan redelijke eisen
      voldoen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel27
  - number: '27.6'
    text: |-
      Schotten, afsluitmiddelen en afsluitingen van openingen in deze schotten, evenals de methoden om deze te
      beproeven, moeten voldoen aan door het Hoofd van de Scheepvaartinspectie te stellen voorwaarden. Vaartuigen welke
      zijn vervaardigd van ander materiaal dan hout, moeten zijn voorzien van een aanvaringsschot, van waterdichte
      schotten die de ruimte voor machines, waarin zich het hoofdvoortstuwingswerktuig bevindt, omsluiten, en van een
      achterpiekschot, met dien verstande dat het achterpiekschot kan dienen als het achterste machinekamerschot. Deze
      schotten moeten zijn opgetrokken tot aan het werkdek, met uitzondering van een achterpiekschot dat niet tevens als
      achterste machinekamerschot dienst doet; dit achterpiekschot dient ten minste te zijn opgetrokken tot het eerste
      dek boven de hoogst gelegen lastlijn. In houten vaartuigen moeten dergelijke schotten eveneens zijn aangebracht en,
      voor zover zulks praktisch uitvoerbaar is, moeten deze schotten waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel27
  - number: '27.7'
    text: |-
      Pijpen die door het aanvaringsschot zijn gevoerd, moeten zijn voorzien van doelmatige afsluiters, die boven het
      werkdek moeten kunnen worden bediend en welke tegen het aanvaringsschot in de voorpiek moeten zijn bevestigd.
      Op de plaats van bediening dient een standaanwijzer te zijn aangebracht die aangeeft of de afsluiter geopend
      danwel gesloten is. Het Hoofd van de Scheepvaartinspectie kan evenwel toestaan dat de betreffende afsluiters aan
      de achterzijde van het aanvaringsschot worden aangebracht en daar ter plaatse bedienbaar zijn mits de afsluiters
      onder alle bedrijfsomstandigheden gemakkelijk bereikbaar zijn en beschermd zijn tegen beschadiging. Door het
      aanvaringsschot mag slechts één pijpleiding worden gevoerd, tenzij de voorpiek in twee afdelingen is verdeeld.
      In dat geval is het toegestaan door het aanvaringsschot twee pijpleidingen te voeren, te weten één pijpleiding
      voor elke afdeling. In het aanvaringsschot mogen geen deuren, mangaten, ventilatiekokers of andere openingen zijn
      aangebracht onder het werkdek.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel27
  - number: '27.8'
    text: |-
      Indien een lange bovenbouw op het voorschip is aangebracht, dient als voortzetting van het aanvaringsschot
      een schot, dicht tegen weer en wind, te zijn aangebracht tussen het werkdek en het dek boven het werkdek. Deze
      voortzetting van het aanvaringsschot boven het werkdek behoeft niet onmiddellijk te zijn geplaatst boven het
      aanvaringsschot, mits het wordt geplaatst binnen de grenzen, als bepaald in artikel 2, eerste lid, onder 35.1 en
      het gedeelte van het dek dat de trapsgewijze verspringing vormt, dicht is tegen weer en wind. Het Hoofd van de
      Scheepvaartinspectie kan ten aanzien hiervan nadere regels geven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel27
  - number: '27.9'
    text: |-
      Het aantal openingen in de voortzetting van het aanvaringsschot boven het werkdek moet worden beperkt tot het
      minimum dat verenigbaar is met de bestemming en de normale bedrijfsuitoefening van het vaartuig. Dergelijke
      openingen moeten dicht tegen weer en wind kunnen worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel27
  - number: '27.10'
    text: |-
      In vaartuigen waarvan de lengte 75 m of meer bedraagt, moet, voor zover dit praktisch uitvoerbaar is, tussen het
      aanvaringsschot en het achterpiekschot een waterdichte dubbele bodem zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel27
  - number: '28.1'
    text: |-
      De huid en de wanden van waterdichte afdelingen, zoals schotten, dekken en de tanktop van een dubbele bodem, moeten
      deugdelijk waterdicht zijn afgewerkt. De huid en deze wanden moeten voldoende zijn verstijfd tegen de waterdruk die
      ter plaatse, ook in geval van nood, kan optreden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel28
  - number: '28.2'
    text: |-
      De waterdichte indeling moet zo doeltreffend zijn als redelijkerwijs, in verband met de eisen van het bedrijf, kan
      worden verlangd. Het Hoofd van de Scheepvaartinspectie kan ten aanzien hiervan nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel28
  - number: '29.1'
    text: |-
      Met inachtneming van het bepaalde in artikel 27, zesde lid, moet het aantal openingen in waterdichte schotten
      beperkt worden tot het minimum dat verenigbaar is met de algehele inrichting en de noodzakelijke voorzieningen
      ten behoeve van de werkzaamheden op het vaartuig; openingen moeten, ten genoegen van het Hoofd van de
      Scheepvaartinspectie, zijn voorzien van waterdichte afsluitmiddelen. Waterdichte deuren moeten van gelijke sterkte
      zijn als de aangrenzende constructie, zonder zulke openingen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel29
  - number: '29.2'
    text: 'Waterdichte deuren moeten als schuifdeuren zijn uitgevoerd indien:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel29
  - number: 29.2.1°
    text: |-
      deze deuren op zee geopend moeten kunnen worden en de bovenkant van de drempel onder de hoogst gelegen lastlijn
      ligt, tenzij het Hoofd van de Scheepvaartinspectie, rekening houdend met het type en de bestemming van het
      vaartuig, van oordeel is dat zulks praktisch onuitvoerbaar of niet noodzakelijk is; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel29
  - number: 29.2.2°
    text: |-
      deze toegang geven tot het lagere gedeelte van een ruimte voor machines, van waaruit een schroefastunnel kan worden
      bereikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel29
  - number: '29.3'
    text: |-
      Waterdichte schuifdeuren moeten nog geopend en gesloten kunnen worden wanneer het vaartuig een helling heeft van 15
      graden, ongeacht over welke zijde.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel29
  - number: '29.4'
    text: |-
      Waterdichte schuifdeuren moeten ter plaatse van de deur aan beide zijden geopend en gesloten kunnen worden;
      bovendien moeten deze deuren door middel van afstandbediening geopend en gesloten kunnen worden vanaf een
      toegankelijke plaats boven het werkdek.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel29
  - number: '29.5'
    text: |-
      Op alle plaatsen van waaruit afstandbediening plaatsvindt, moet een standaanwijzer aanwezig zijn, die aangeeft of
      een schuifdeur geopend dan wel gesloten is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel29
  - number: '30.1'
    text: |-
      Terugslagkleppen of afsluiters in waterdichte schotten, die deel uitmaken van een pijpleidingsysteem, en
      waterdichte deuren moeten goed sluiten en voldoende sterk zijn en hun bewegings- en sluitingsinrichtingen moeten te
      allen tijde een goede werking kunnen waarborgen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel30
  - number: '30.2'
    text: |-
      Mangaten op ruimten voor berging van water en olie en op kofferdammen en droge tanks moeten, wanneer het vaartuig
      leeg is, gemakkelijk bereikbaar zijn en naar behoren kunnen worden gesloten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel30
  - number: '31.1'
    text: |-
      Openingen waardoor water het vaartuig kan binnendringen moeten zijn voorzien van afsluitmiddelen die voldoen aan
      het bepaalde in dit besluit. Dekopeningen die tijdens de visvangst geopend kunnen zijn, moeten zoveel mogelijk ter
      plaatse van het vlak van kiel en stevens van het vaartuig zijn aangebracht. Het Hoofd van de Scheepvaartinspectie
      kan afwijkende voorzieningen toestaan, indien naar zijn oordeel daardoor de veiligheid van het vaartuig niet
      vermindert.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel31
  - number: '31.2'
    text: |-
      Luiken boven visstortopeningen op hektreilers moeten waterdicht zijn, mechanisch kunnen worden bewogen en vanaf een
      plaats die een onbelemmerd uitzicht biedt op de werking van deze luiken, kunnen worden bediend.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel31
  - number: '32.1'
    text: |-
      Openingen in het scheepsboord, als toegangs- en laadpoorten, moeten door deugdelijke afsluitmiddelen van voldoende
      sterkte waterdicht kunnen worden gesloten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel32
  - number: '32.2'
    text: |-
      Alle toegangsopeningen in schotten van gesloten bovenbouwen en in andere aan weer en wind blootgestelde
      constructies waardoor, met gevaar voor het vaartuig, water zou kunnen binnendringen, moeten zijn voorzien
      van deuren die permanent aan het schot zijn bevestigd en zodanig zijn ingeraamd en verstijfd dat het gehele
      samenstel, indien de opening daardoor gesloten is, even sterk is alsof geen opening in het schot aanwezig
      was. De deuren moeten dicht tegen weer en wind kunnen worden afgesloten door middel van pakking en knevels of
      andere, gelijkwaardige middelen die permanent aan het schot of aan de deuren zelf zijn bevestigd en zodanig zijn
      uitgevoerd, dat de deuren aan beide zijden van het schot kunnen worden geopend en gesloten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel32
  - number: '32.3'
    text: |-
      In deuropeningen die rechtstreeks toegang geven tot gedeelten van het blootgestelde dek en die gelegen zijn in
      toegangskappen, opbouwen en schachten van machinekamers, moet de hoogte boven het dek van drempels ten minste
      600 mm op het werkdek of ten minste 300 mm op een opbouwdek bedragen. Wanneer de bedrijfservaringen zulks
      rechtvaardigen kan het Hoofd van de Scheepvaartinspectie toestaan dat van deze drempelhoogten wordt afgeweken,
      met dien verstande dat de drempelhoogte nimmer minder mag bedragen dan 380 mm op het werkdek of 150 mm op een
      opbouwdek. Ten aanzien van de minimum drempelhoogte van deuropeningen die rechtstreeks toegang geven tot de ruimten
      voor machines kan niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel32
  - number: '32.4'
    text: Het Hoofd van de Scheepvaartinspectie kan nadere regels geven ten aanzien van het bepaalde in dit artikel.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel32
  - number: '33.1'
    text: |-
      De hoogte boven het dek van luikhoofden moet op blootgestelde gedeelten van het werkdek ten minste 600 mm of op
      een opbouwdek ten minste 300 mm bedragen. Wanneer de bedrijfservaringen zulks rechtvaardigen kan het Hoofd van de
      Scheepvaartinspectie toestaan dat de hoogte van de luikhoofden wordt verlaagd dan wel de luikhoofden geheel worden
      weggelaten, mits de veiligheid van het vaartuig daardoor niet vermindert. In dat geval moeten de luikopeningen
      zo klein als praktisch uitvoerbaar worden gehouden en moeten de luiken blijvend zijn bevestigd door middel van
      scharnieren of gelijkwaardige middelen en snel gesloten en geborgd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel33
  - number: '33.2'
    text: |-
      Voor de berekening van de sterkte moet worden aangenomen, dat luiken voor luikopeningen zijn onderworpen aan het
      gewicht van de lading die daarop wordt vervoerd of aan de hierna vermelde statische belasting, al naar gelang welke
      waarde groter is:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel33
  - number: 33.2.1°
    text: 10,0 kN per vierkante meter, voor vaartuigen waarvan de lengte minder dan 24 m bedraagt; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel33
  - number: 33.2.2°
    text: 17,0 kN per vierkante meter, voor vaartuigen waarvan de lengte 100 m of meer bedraagt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel33
  - number: '33.3'
    text: |-
      Wanneer de luiken van staal zijn vervaardigd, mag de volgens het bepaalde in het voorgaande lid berekende
      trekspanning vermenigvuldigd met de factor 4,25 niet groter zijn dan de minimumtreksterkte van het staal. Bij de
      aangenomen belastingen mogen de doorbuigingen niet meer bedragen dan 0,0028 maal de overspanning van het luik.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel33
  - number: '33.4'
    text: |-
      Luiken van een ander materiaal dan staal moeten ten minste even sterk zijn als stalen luiken en hun constructie
      moet van zodanige stijfheid zijn, dat de dichtheid tegen weer en wind onder de belastingen als bepaald in het
      tweede lid, is verzekerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel33
  - number: '33.5'
    text: |-
      Luiken moeten zijn voorzien van knevels en pakkingen of daaraan gelijkwaardige voorzieningen, welke ten genoegen
      van het Hoofd van de Scheepvaartinspectie moeten zijn. De uitvoering dient de zekerheid te geven dat de dichtheid
      tegen weer en wind gehandhaafd blijft onder alle omstandigheden die zich op zee kunnen voordoen. Voor dit doel
      moeten de luiken bij het onderzoek als bedoeld in artikel 12, tweede lid, op dichtheid tegen weer en wind worden
      beproefd. Een dergelijke beproeving kan ook worden geëist bij het periodieke onderzoek als bedoeld in artikel 12,
      vierde lid, en zonodig met kortere tussenpozen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel33
  - number: '33.6'
    text: Het Hoofd van de Scheepvaartinspectie kan nadere regels geven ten aanzien van luikhoofden en sluitmiddelen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel33
  - number: '34'
    text: De toepassing van houten luiken op aan weer en wind blootgestelde dekken is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel34
  - number: '35.1'
    text: |-
      Openingen boven voortstuwingsruimten moeten rondom versterkt en omsloten zijn door schachten van een sterkte gelijk
      aan die van de aangrenzende bovenbouw. Indien deze schachten niet door andere constructies zijn beschermd, moet
      de sterkte aan bijzondere eisen voldoen; toegangsopeningen in dergelijke schachten moeten zijn voorzien van deuren
      die voldoen aan het bepaalde in artikel 32, tweede en derde lid, en alle overige openingen in dergelijke schachten
      moeten zijn voorzien van gelijkwaardige, vast aangebrachte afsluitmiddelen en moeten dicht tegen weer en wind
      kunnen worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel35
  - number: '35.2'
    text: |-
      Ventilatieschachten en schoorstenen op voorstuwingsruimten op blootgestelde plaatsen op het werkdek of op een
      opbouwdek moeten zo hoog boven het dek worden opgetrokken als redelijk en uitvoerbaar is. De openingen van
      ventilatieschachten moeten zijn voorzien van voldoende sterke, vast aangebrachte afsluitmiddelen van staal of
      een ander goedgekeurd materiaal die de openingen dicht tegen weer en wind kunnen afsluiten, tenzij het naar het
      oordeel van het Hoofd van de Scheepvaartinspectie niet waarschijnlijk is dat water het vaartuig binnendringt via
      ventilatieschachten, in welk geval bijzondere voorzieningen kunnen worden verlangd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel35
  - number: '36.1'
    text: |-
      Wanneer zulks voor de visserijwerkzaamheden van belang is, mogen in het dek verzonken stortranden van het schroef-
      of bajonettype of een soortgelijk type, met een maximum van één stortrand per twee viskeeën in het ruim, en
      mangaten worden aangebracht, mits deze waterdicht gesloten kunnen worden; de desbetreffende afsluitmiddelen moeten
      blijvend bevestigd zijn aan de aangrenzende constructie. Met inachtneming van afmetingen en plaats van de openingen
      alsmede de uitvoering van de afsluitmiddelen, mogen metaal op metaal afsluitingen zijn aangebracht mits het deksel
      en de rand zijn voorzien van een grove schroefdraad of van goedpassende geschaafde nokken met een schuinte van 1
      op 24.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel36
  - number: '36.2'
    text: |-
      Openingen die geen luikhoofden, openingen boven de voortstuwingsruimte, mangaten of verzonken stortranden in het
      werk- of opbouwdek zijn, moeten worden beschermd door gesloten constructies, voorzien van deuren die voldoen aan
      het bepaalde in artikel 32, tweede en derde lid, of daaraan gelijkwaardige afsluitingen. Toegangskappen moeten zo
      dicht als praktisch uitvoerbaar is ter hoogte van het vlak van kiel en stevens van het vaartuig geplaatst zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel36
  - number: '37.1'
    text: |-
      Bij vaartuigen waarvan de lengte 45 m of meer bedraagt moeten de schachten van luchtkokers, geen schachten van
      luchtkokers van de voortstuwingsruimte zijnde, een hoogte van ten minste 900 mm boven het werkdek of ten minste 760
      mm boven het opbouwdek hebben. Bij vaartuigen waarvan de lengte minder dan 45 m bedraagt, moet de hoogte van deze
      schachten respectievelijk 760 mm of 450 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel37
  - number: '37.2'
    text: |-
      De sterkte van schachten van luchtkokers moet gelijk zijn aan die van de aangrenzende constructie. Indien de
      schacht van een luchtkoker hoger is dan 900 mm moet deze extra zijn gesteund. Behoudens het bepaalde in het
      navolgende lid moeten schachten van luchtkokers zijn voorzien van afsluitmiddelen die een doeltreffende afsluiting
      vormen dicht tegen weer en wind. De afsluitmiddelen moeten vast zijn aangebracht. Indien het naar het oordeel van
      het Hoofd van de Scheepvaartinspectie niet waarschijnlijk is dat water het vaartuig binnendringt via de luchtkokers
      van de voortstuwingsruimte, kunnen afsluitmiddelen aan deze luchtkokers vervallen, in welk geval bijzondere
      voorzieningen kunnen worden verlangd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel37
  - number: '37.3'
    text: |-
      Bij vaartuigen waarvan de lengte 45 m of meer bedraagt, behoeven de luchtkokers waarvan de schachten meer dan
      4.50 m boven het werkdek of meer dan 2.30 m boven het opbouwdek uitsteken niet van afsluitmiddelen als bedoeld
      in het tweede lid, te zijn voorzien, tenzij het Hoofd van de Scheepvaartinspectie van oordeel is dat dergelijke
      afsluitmiddelen noodzakelijk zijn. Bij vaartuigen waarvan de lengte minder dan 45 m bedraagt, behoeven luchtkokers
      waarvan de schachten meer dan 3.40 m boven het werkdek of meer dan 1.70 meter boven het opbouwdek uitsteken niet te
      zijn voorzien van afsluitmiddelen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel37
  - number: '37.4'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan voor schachten van luchtkokers op blootgestelde plaatsen in afwijking van
      het bepaalde in het eerste lid een grotere hoogte voorschrijven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel37
  - number: '38.1'
    text: Op dubbele bodem- of andere tanks moeten luchtpijpen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel38
  - number: '38.2'
    text: |-
      De blootgestelde delen van luchtpijpen welke boven het werkdek of boven het opbouwdek uitsteken, moeten voldoende
      sterk en in voldoende mate beschermd zijn. Voorts moeten luchtpijpen in laadruimten en aan dek zodanig beschermd of
      zo sterk zijn, dat zij door verschuiven van lading niet kunnen worden beschadigd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel38
  - number: '38.3'
    text: |-
      Luchtpijpen van tanks die, hetzij door het openen van een of meer kranen of afsluiters van buitenboord kunnen
      vollopen, hetzij door middel van een werktuiglijk gedreven pomp kunnen worden gevuld, alsmede alle luchtpijpen
      van dubbele bodemtanks en kofferdammen en van voorraad-, bezink- en dagtanks voor brandstofolie, moeten boven het
      werkdek in de open lucht uitmonden en aldaar steeds toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel38
  - number: '38.4'
    text: |-
      De luchtpijpen van brandstoftanks moeten bovendien op een naar het oordeel van het Hoofd van de
      Scheepvaartinspectie veilige plaats uitkomen en zijn voorzien van een doelmatige vlamkerende inrichting.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel38
  - number: '38.5'
    text: |-
      Het is toegestaan de luchtpijpen van die tanks waarvan de inhoud bij uitvloeien op het open dek gevaar kan
      opleveren of om andere redenen ongewenst is, naar een overvloeitank of een andere hiervoor geschikte voorraadtank
      te leiden. In dat geval dient de ontluchting van de overvloeitank boven het werkdek in de open lucht uit te monden
      en aldaar steeds toegankelijk te zijn. De ontluchting van de overvloeitank dient zodanig te zijn bemeten, dat deze
      de maximum te verwachten toevoer zonder overmatige drukverhoging kan verwerken. De overvloeitank dient voldoende
      ruim bemeten te zijn. Een alarminrichting moet worden aangebracht welke alarmeert bij een vooraf bepaald niveau in
      tanks of wanneer de tanks overvloeien.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel38
  - number: '38.6'
    text: |-
      De hoogte van de opening van luchtpijpen boven het dek moet op het werkdek ten minste 760 mm of op een opbouwdek
      ten minste 450 mm bedragen. Indien de hoogte van een luchtpijp een belemmering vormt voor de visserijwerkzaamheden
      aan boord, kan het Hoofd van de Scheepvaartinspectie een kleinere hoogte toestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel38
  - number: '38.7'
    text: |-
      Voor de afsluiting van de opening van de luchtpijpen moet worden gebruik gemaakt van automatisch werkende
      afsluitmiddelen die ten genoegen van het Hoofd van de Scheepvaartinspectie moeten zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel38
  - number: '38.8'
    text: Vulpijpen op drinkwatertanks moeten ten minste 150 mm boven het dek reiken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel38
  - number: '39.1'
    text: |-
      Op dubbele bodem- of andere tanks alsmede op de vullingen van alle ruimten die niet te allen tijde toegankelijk
      zijn, moeten voorzieningen voor peilen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: '39.2'
    text: 'Als voorzieningen voor peilen worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: 39.2.1°
    text: peilinrichtingen welke al dan niet zijn ingericht voor aflezing op afstand;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: 39.2.2°
    text: |-
      inrichtingen welke door alarmering aangeven dat het vloeistofniveau in een ruimte een bepaalde, vooraf ingestelde
      waarde overschrijdt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: 39.2.3°
    text: peilpijpen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: 39.2.4°
    text: peilglazen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: '39.3'
    text: |-
      De voorziening voor peilen van brandstoftanks, smeerolietanks, drinkwatertanks en andere tanks voor
      verbruiksvloeistoffen, alsmede van waterballasttanks, dient te bestaan uit een peilinrichting ingericht voor
      aflezing op afstand, als bedoeld in het tweede lid, onder 1.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: '39.4'
    text: |-
      In afwijking van het bepaalde in het derde lid kan het Hoofd van de Scheepvaartinspectie toestaan dat kleine, in
      de machinekamer dan wel in andere, vanuit de machinekamer bereikbare ruimten gelegen verbruikstanks alsmede kleine
      buffertanks behorend bij werktuigen, zijn voorzien van peilpijpen of peilglazen. Indien zulke tanks brandbare
      vloeistoffen bevatten, moet tevens worden voldaan aan het bepaalde in artikel 83, derde, elfde en twaalfde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: '39.5'
    text: |-
      In afwijking van het gestelde in het derde lid kan het Hoofd van de Scheepvaartinspectie voorts toestaan dat
      op vaartuigen waarvan de lengte minder dan 45 m bedraagt de in dat artikel genoemde tanks zijn voorzien van
      peilpijpen. Indien zulke tanks brandbare vloeistoffen bevatten, moet tevens worden voldaan aan het bepaalde in
      artikel 83, derde, elfde en twaalfde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: '39.6'
    text: |-
      De voorziening voor peilen op de vullingen van ruimten die niet te allen tijde toegankelijk zijn, waaronder
      begrepen laadruimten, dient te bestaan uit een peilinrichting ingericht voor aflezing op afstand, als bedoeld in
      het tweede lid, onder 1, dan wel uit een alarminrichting als bedoeld in het tweede lid, onder 2.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: '39.7'
    text: |-
      Peilinrichtingen, bedoeld in het tweede lid, onder 1, alsmede inrichtingen, bedoeld in het tweede lid onder 2,
      moeten van een goedgekeurd type zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: '39.8'
    text: |-
      Peilinrichtingen, bedoeld in het tweede lid, onder 1, moeten zijn voorzien van een ingebouwde mogelijkheid tot
      calibratie. Het Hoofd van de Scheepvaartinspectie kan afzien van een mogelijkheid tot calibratie, indien de
      betreffende ruimte of ruimten tevens zijn voorzien van een peilpijp en de bestemming van deze ruimte of ruimten
      zodanig is dat peilen door middel van deze peilpijp geen bezwaar voor de veiligheid oplevert.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: '39.9'
    text: |-
      Indien is toegestaan dat een ruimte is voorzien van een inrichting als bedoeld in het tweede lid onder 2, moet deze
      ruimte tevens zijn voorzien van een peilpijp.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: '39.10'
    text: |-
      Indien is toegestaan dat tanks of kofferdammen zijn voorzien van peilpijpen, moeten deze zoveel mogelijk boven het
      werkdek, op een steeds toegankelijke plaats uitkomen. Peilpijpen van brandstofolietanks moeten bovendien op een
      naar het oordeel van het Hoofd van de Scheepvaartinspectie veilige plaats uitkomen. Korte peilpijpen die onder het
      werkdek uitkomen, moeten zijn voorzien van zelfsluitende kranen; op brandstofolietanks moeten zij voldoen aan het
      ter zake bepaalde in artikel 83, derde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: '39.11'
    text: |-
      Indien peilpijpen door laadruimten worden gevoerd, moeten zij aldaar en aan dek zodanig zijn beschermd of zo sterk
      zijn dat zij door verschuiven van lading niet kunnen worden beschadigd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: '39.12'
    text: Onder peilpijpen moeten stootplaatjes zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: '39.13'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nadere regels geven voor de constructie en aanleg van peilinrichtingen,
      bedoeld in het tweede lid, onder 1, en van inrichtingen, bedoeld in het tweede lid onder 2.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: '39.14'
    text: Indien op drinkwatertanks peilpijpen zijn toegestaan, moeten deze ten minste 150 mm boven het dek reiken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel39
  - number: '40.1'
    text: |-
      Met inachtneming van het bepaalde in de artikelen 144 en 170, tiende lid, moeten patrijspoorten, ramen en vaste
      lichtranden in ruimten onder het werkdek of in een gesloten bovenbouw aan de binnenzijde zijn voorzien van
      scharnierende blinden die deugdelijk en waterdicht kunnen worden gesloten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel40
  - number: '40.2'
    text: |-
      Het laagste punt van de dagopening van patrijspoorten en lichtranden mag niet lager zijn gelegen dan een lijn
      die evenwijdig aan het werkdek in de zijde op het scheepsboord is getrokken en die haar laagste punt heeft op een
      hoogte boven de hoogst gelegen lastlijn, overeenkomend met 2,5 percent van de breedte, dan wel 500 mm indien deze
      laatste hoogte groter is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel40
  - number: '40.3'
    text: |-
      Alle patrijspoorten met inbegrip van de zich daarin bevindende glasschijven, ramen, vaste lichtranden en
      blinden moeten van deugdelijke constructie zijn en moeten overigens voldoen aan de door het Hoofd van de
      Scheepvaartinspectie gestelde eisen betreffende type, afmetingen en sterkte.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel40
  - number: '40.4'
    text: Voor de ramen van het stuurhuis moet gehard veiligheidsglas of soortgelijk materiaal worden toegepast.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel40
  - number: '40.5'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan toestaan dat patrijspoorten, ramen, en vaste lichtranden welke zijn
      aangebracht in de zij- en achterschotten van dekhuizen op of boven het werkdek, niet zijn voorzien van blinden,
      indien naar zijn oordeel de veiligheid van het vaartuig daardoor niet vermindert.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel40
  - number: '41.1'
    text: |-
      De door het scheepsboord gaande afvoerpijpen van ruimten onder het werkdek of van ruimten in gesloten bovenbouwen
      of dekhuizen op het werkdek, voorzien van deuren die voldoen aan het bepaalde in artikel 32, tweede en derde lid,
      moeten zijn voorzien van doelmatige middelen ter voorkoming van het binnendringen van water. Deze middelen tot
      afsluiting moeten steeds bereikbaar zijn. Behoudens het bepaalde in het volgende lid moet in het algemeen elke
      afzonderlijke uitlaatopening zijn voorzien van een terugslagklep met een inrichting door middel waarvan de klep in
      gesloten toestand rechtstreeks vanaf een plaats boven het werkdek kan worden geborgd. Deze plaats moet gemakkelijk
      bereikbaar zijn en er moet aldaar een inrichting zijn aangebracht die aanwijst of de klep open dan wel gesloten is.
      De spuipijpen voor waterafvoer vanuit de ruimten voor accommodatie mogen niet in de ruimte voor machines uitmonden.
      Indien de vertikale afstand van de hoogst gelegen lastlijn tot de binnenboordsopening van een afvoerpijp groter is
      dan één percent van de lengte, mag de uitlaatopening zijn voorzien van twee terugslagkleppen zonder bovengenoemde
      borginrichting, mits de bovenste klep gedurende de normale dienst bruikbaar is teneinde te worden nagezien. Indien
      de vertikale afstand van de hoogst gelegen lastlijn tot de binnenboordsopening van een afvoerpijp groter is dan
      twee percent van de lengte, kan het Hoofd van de Scheepvaartinspectie toestaan dat de uitlaatopening is voorzien
      van een enkele terugslagklep zonder borginrichting.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel41
  - number: '41.2'
    text: |-
      Indien bij de maximum toelaatbare diepgang de binnenboordsopening van een afvoerpijp van een toilet eerst bij een
      hellingshoek groter dan 15 graden wordt ondergedompeld, kan in plaats van de in het voorgaande lid voorgeschreven
      afsluiting van de buitenboordsopening worden volstaan met het afsluiten van de binnenboordsopening door middel
      van een in het toilet ingebouwde terugslagklep van een door het Hoofd van de Scheepvaartinspectie goedgekeurde
      constructie en met het aanbrengen van een afvoerpijp welke over de gehele lengte dikwandig moet zijn. Ter plaatse
      van de huid en dekdoorvoering moet de ondersteuning van de pijp deugdelijk zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel41
  - number: '41.3'
    text: |-
      Buitenboordsin- en uitlaatopeningen van pijpleidingen behorende tot de werktuiglijke inrichting, moeten zijn
      voorzien van afsluiters of kranen, welke door middel van een flensverbinding aan de huid of aan een op de huid
      gebouwde stalen kast zijn aangebracht. Voor uitlaatopeningen mag in de plaats van een afsluiter of kraan gebruik
      worden gemaakt van een terugslagklep, mits deze in gesloten stand kan worden geborgd. Bedoelde afsluitmiddelen
      moeten gemakkelijk kunnen worden bediend, hetzij vanaf een te allen tijde bereikbare plaats boven het werkdek
      hetzij ter plaatse, in welk laatste geval de bedieningsinrichting onder normale omstandigheden te allen tijde
      bereikbaar moet zijn en zich boven de vloerplaten moet bevinden. Afsluiters, kranen en terugslagkleppen moeten op
      de plaats waar zij kunnen worden bediend, zijn voorzien van een standaanwijzer.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel41
  - number: '41.4'
    text: |-
      Spui- en afvoerpijpen die op een afstand van meer dan 450 mm onder het werkdek of minder dan 600 mm boven de hoogst
      gelegen lastlijn, door het scheepsboord worden gevoerd, moeten ongeacht het niveau van de binnenboordsopening,
      zijn voorzien van een tegen het scheepsboord geplaatste terugslagklep. Tenzij vereist ingevolge het bepaalde in het
      eerste lid, mag deze terugslagklep vervallen indien de wanddikte van de afvoerpijp voldoende is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel41
  - number: '41.5'
    text: |-
      Spuipijpen vanuit bovenbouwen of dekhuizen die niet zijn voorzien van deuren die voldoen aan het bepaalde in
      artikel 32, tweede en derde lid, moeten naar buitenboord worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel41
  - number: '41.6'
    text: |-
      Alle terugslagkleppen, kranen, afsluiters en huidappendages die vereist zijn ingevolge de voorgaande leden
      van dit artikel moeten van staal, brons of een ander door het Hoofd van de Scheepvaartinspectie goedgekeurd
      materiaal zijn vervaardigd. Gewoon gietijzer of ander dergelijk materiaal is hiervoor niet toegestaan. Zij moeten
      zijn voorzien van een deksel dat afdoende tegen loswerken is beveiligd. Alle pijpen die zich tussen de huid
      en de terugslagkleppen bevinden, dienen te zijn vervaardigd van staal, met dien verstande dat het Hoofd van de
      Scheepvaartinspectie op niet-stalen vaartuigen het gebruik van andere materialen kan toestaan in ruimten, andere
      dan ruimten voor machines.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel41
  - number: '41.7'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nadere regels geven voor de afsluiting van afvoervoorzieningen andere dan
      bedoeld in de voorgaande leden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel41
  - number: '42.1'
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder de standaardzeeg een kromme die bestaat uit twee halve
      parabolen die hun top hebben ter plaatse van het midden van de lengte en waarvan de ordinaten op de voorloodlijn
      en de achterloodlijn respectievelijk de waarden 50 (L/3 + 10) mm en 25 (L/3 + 10) mm hebben. De ordinaten worden
      gemeten van het dek in de zijde tot een denkbeeldige lijn die evenwijdig aan de kiel door de zeeglijn op het
      midden van de lengte is getrokken. Voor een vaartuig dat met stuurlast is ontworpen wordt deze denkbeeldige lijn
      evenwijdig aan de constructiewaterlijn getrokken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel42
  - number: '42.2'
    text: |-
      Indien ter plaatse van een kuil op aan weer en wind blootgestelde gedeelten van werkdek en opbouwdekken een
      verschansing is aangebracht, moet voldoende gelegenheid tot lozing van water bestaan. Behoudens het bepaalde in
      het derde en het vierde lid moet de totale oppervlakte (A) van de waterloospoorten in elk scheepsboord voor elke
      kuil op het werkdek, indien de zeeg van dit dek gelijk is aan of groter is dan de standaardzeeg, ten minste gelijk
      zijn aan de volgens een van de onderstaande formules bepaalde waarde. De totale oppervlakte van de waterloospoorten
      in elk scheepsboord voor elke kuil op het dek van een bovenbouw moet ten minste de helft van de in een van deze
      formules gegeven oppervlakte bedragen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel42
  - number: 42.2.1°
    text: 'Indien de lengte van de verschansing (l) aan een zijde in de kuil 20 m of minder bedraagt: A = 0,7 + 0,035 l m2;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel42
  - number: 42.2.2°
    text: 'Indien l meer dan 20 m bedraagt: A = 0,07 l m2;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel42
  - number: '42.3'
    text: |-
      Op een vaartuig zonder zeeg moet de oppervlakte van de waterloospoorten, berekend volgens de in het tweede lid
      gegeven formules, met 50 percent worden vergroot. Indien het oppervlak tussen de actuele zeeglijn en de in het
      eerste lid genoemde denkbeeldige lijn kleiner is dan het oppervlak tussen de standaardzeeg en die lijn, moet het
      vereiste oppervlak van de waterloospoorten door lineaire interpolatie worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel42
  - number: '42.4'
    text: |-
      Indien een vaartuig voorzien van een trunk, naast die trunk niet is voorzien van een verschansing welke over ten
      minste de halve lengte van de aan weer en wind blootgestelde gedeelten van het werkdek door open relingwerk is
      onderbroken, of indien doorlopende of grotendeels doorlopende langshoofden en luikopeningen zijn aangebracht tussen
      delen van een onderbroken bovenbouw, moet de verhouding van de totale oppervlakte van de waterloospoorten tot de
      oppervlakte van de verschansing ten minste gelijk zijn aan die vermeld in onderstaande tabel:






                    Breedte van het luikhoofd of de trunk in verhouding tot de scheepsbreedte


                    Totale oppervlakte van de waterloospoorten in verhouding tot de oppervlakte van de verschansing






                    40% of minder


                    20%




                    75% of meer


                    10%




           Bij tussengelegen breedten wordt de vereiste totale oppervlakte van de waterloospoorten door interpolatie
      bepaald.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel42
  - number: '42.5'
    text: |-
      Op een vaartuig met bovenbouwen die aan een van de einden of aan beide einden open zijn, moeten doelmatige
      voorzieningen worden getroffen voor lozing van water uit deze bovenbouwen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel42
  - number: '42.6'
    text: |-
      De onderkanten van de waterloospoorten moeten zo dicht mogelijk boven het dek liggen. Tweederde van de
      voorgeschreven oppervlakte der waterloospoorten moet in die helft van de kuil zijn aangebracht, die het dichtst bij
      het laagste punt van de zeeg is gelegen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel42
  - number: '42.7'
    text: |-
      Waterloospoorten en dergelijke openingen in de verschansing moeten door rasterwerk of door staven met een
      onderlinge afstand van ongeveer 230 mm worden beschermd. Indien kleppen zijn aangebracht, moet voor ruime speling
      worden gezorgd teneinde klemmen te vermijden. De scharnieren moeten van pennen van roestvrij materiaal zijn
      voorzien. Indien inrichtingen voor het vastzetten van deze kleppen zijn aangebracht, moeten deze zijn goedgekeurd
      door het Hoofd van de Scheepvaartinspectie en vanaf een gemakkelijke bereikbare plaats eenvoudig te bedienen
      zijn. Deze vastzetinrichtingen kunnen alleen worden toegestaan indien zij naar het oordeel van het Hoofd van de
      Scheepvaartinspectie noodzakelijk zijn voor het uitoefenen van de visserij.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel42
  - number: '42.8'
    text: |-
      Lastplanken en inrichtingen waarmede vistuig wordt vastgezet, moeten zodanig zijn aangebracht dat de werking van
      waterloospoorten niet vermindert. Lastplanken moeten zo zijn geconstrueerd dat zij bij gebruik in de juiste stand
      kunnen worden vastgezet en de lozing van overkomend water niet belemmeren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel42
  - number: '42.9'
    text: |-
      Bij vaartuigen bestemd om te worden gebruikt in wateren waar ijsafzetting kan voorkomen, moeten kleppen en
      voorzieningen ter bescherming van waterloospoorten als bedoeld in het zevende lid, gemakkelijk kunnen worden
      verwijderd teneinde ijsafzetting te beperken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel42
  - number: '43.1'
    text: |-
      Een vaartuig moet zodanig zijn uitgerust dat het snel en veilig kan ankeren. De uitrusting dient daartoe te bestaan
      uit ankers met toebehoren, ankerkettingen of staaldraadkabels, stoppers en een ankerspil of andere voorzieningen
      voor het laten vallen van het anker, het lichten van het anker en het ten anker houden van het vaartuig tijdens
      elke te voorziene bedrijfsomstandigheid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel43
  - number: '43.2'
    text: |-
      Een vaartuig moet tevens zijn uitgerust met doelmatig meergerei, teneinde onder alle bedrijfsomstandigheden veilig
      te kunnen meren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel43
  - number: '43.3'
    text: |-
      De uitrusting voor het ankeren en voor het meren moet voldoen aan het bepaalde in deze paragraaf en moet tevens ten
      genoegen van het Hoofd van de Scheepvaartinspectie zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel43
  - number: '44.1'
    text: |-
      De ankers moeten in voldoend aantal aanwezig zijn en van voldoende gewicht en sterkte zijn. De ankerkettingen of
      ankerkabels moeten van voldoende lengte, gewicht en sterkte zijn, terwijl elk van de ankerkettingen uit de nodige,
      onderling verbonden, losneembare einden moet bestaan. Er moet een reserve anker- en kettingsluiting aan boord
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel44
  - number: '44.2'
    text: De ankers en kettingen moeten worden gekeurd op de wijze, als in deze paragraaf is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel44
  - number: '44.3'
    text: |-
      De ankerkettingen moeten zodanig aan het vaartuig zijn bevestigd, dat zij buiten de kettingbak kunnen worden
      ontsloten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel44
  - number: '44.4'
    text: |-
      De voor een vaartuig bestemde ankerkettingen mogen niet worden gebruikt voor het remmen tijdens het te water lopen
      van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel44
  - number: '44.5'
    text: |-
      De ankerinrichting moet wat bouw, plaatsing en vermogen betreft, zodanig zijn, dat de ankers gemakkelijk en snel
      kunnen worden bediend, terwijl een bijzondere borginrichting van de ankers aanwezig moet zijn, die het uitlopen ten
      gevolge van schok of stoot voorkomt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel44
  - number: '44.6'
    text: |-
      Al het aan boord aanwezige meergerei moet van voldoende sterkte zijn en moet geschikt zijn voor het beoogde
      gebruik.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel44
  - number: '44.7'
    text: Het Hoofd van de Scheepvaartinspectie kan nadere regels geven ten aanzien van anker- en meergerei.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel44
  - number: '45'
    text: |-
      Alleen indien materialen bestemd voor de bouw van of herstellingen aan vaartuigen of scheepswerktuigen dan wel
      voor ankers en kettingen, niet zijn gekeurd door of vanwege een klassebureau, geschiedt de keuring daarvan door
      de ambtenaren van de Scheepvaartinspectie, die daarbij de in deze paragraaf vermelde voorschriften in acht nemen.
      Bovendien kunnen door het Hoofd van de Scheepvaartinspectie nadere regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel45
  - number: '46'
    text: |-
      Een toestel waarin materialen naar hoedanigheid worden beproefd, dient, blijkens een certificaat afgegeven door een
      door het Hoofd van de Scheepvaartinspectie erkende instelling, te zijn geijkt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel46
  - number: '47.1'
    text: De kosten van de beproeving komen ten laste van de betrokken scheepsbouwmeester of machinefabrikant.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel47
  - number: '47.2'
    text: |-
      Indien een beproeving buiten Nederland, de Nederlandse Antillen of Aruba plaatsvindt, dienen de
      beproevingstoestellen door een in het betrokken land bevoegde instantie te zijn geijkt. Een geldig bewijs hiervan
      wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel47
  - number: '48'
    text: |-
      Elke beproeving of keuring mag door de betrokken scheepsbouwmeester of machinefabrikant of zijn gemachtigde worden
      bijgewoond.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel48
  - number: '49.1'
    text: |-
      De voorschriften betreffende maatafwijkingen, keuze en aanwijzing van proefstukken, keuring, afkeuring, wijze en
      middelen van beproeving, keuringseisen en al wat daarbij hoort zoals deze zijn neergelegd in de desbetreffende
      normen van het Nederlands Normalisatie Instituut worden bij de beoordeling van materialen gevolgd, tenzij in de
      volgende bepalingen van deze paragraaf afwijkende voorschriften voorkomen. Bovendien kunnen door het Hoofd van de
      Scheepvaartinspectie nadere regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel49
  - number: '49.2'
    text: |-
      Waar in de in het eerste lid bedoelde normen wordt gesproken van «besteller of diens gemachtigde» of «leverancier»,
      dient voor de toepassing van deze paragraaf te worden gelezen: «ambtenaar van de Scheepvaartinspectie»
      onderscheidenlijk «scheepsbouwmeester of machinefabrikant».
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel49
  - number: '49.3'
    text: |-
      Staal gebezigd bij de bouw van romp en werktuigen en voor ankers en kettingen moet zijn vervaardigd volgens het
      open-haardproces of volgens een proces dat door het Hoofd van de Scheepvaartinspectie of door een klassebureau
      wordt geacht een gelijkwaardig product te leveren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel49
  - number: '50'
    text: |-
      Zowel de proefstukken als de stukken waaraan deze zijn ontleend, worden door de met de keuring belaste ambtenaar
      voorzien van het hierna afgebeelde slagmerkteken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel50
  - number: '51'
    text: |-
      Afgekeurde voorwerpen worden door de met de keuring belaste ambtenaar voorzien van het in artikel 50 afgebeelde
      slagmerkteken, waardoor een kruis wordt geslagen op een wijze zoals hierna is afgebeeld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel51
  - number: '52'
    text: |-
      De betrokken ambtenaar van de Scheepvaartinspectie kan voor bepaalde gevallen, met het oog op de aard van het
      werk waarvoor het materiaal moet worden gebruikt, gedeeltelijk van het nemen van proeven afzien. Indien het in
      dergelijke gevallen zeer kleine partijen betreft, kan door hem de keuring geheel achterwege worden gelaten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel52
  - number: '53'
    text: |-
      Elk onderdeel kan te allen tijde, zowel tijdens als na de bewerking, nog worden afgekeurd wanneer dit gebreken
      vertoont, ook wanneer deze gebreken materiaalfouten zijn die bij de materiaalkeuring niet zijn opgemerkt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel53
  - number: '54.1'
    text: |-
      Elk ter beproeving aangeboden anker moet zijn voorzien van een goed leesbaar slagmerk en ingeslagen nummer,
      onderscheidenlijk aanduidend de naam van de fabrikant en het doorlopend fabrikatienummer.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel54
  - number: '54.2'
    text: |-
      Tevens moeten de massa van het anker zonder stok en dat van de eventueel bijbehorende stok, beide afzonderlijk
      gewogen, duidelijk op de schacht van het anker zijn ingeslagen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel54
  - number: '54.3'
    text: |-
      Nadat de voorgeschreven belastingproef met goed gevolg heeft plaatsgehad, wordt onder de in het voorgaande
      lid genoemde merken door of ten overstaan van de met de keuring belaste ambtenaar het slagmerkteken van de
      Scheepvaartinspectie ingeslagen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel54
  - number: '54.4'
    text: Ankers met een massa van niet meer dan 70 kg behoeven niet te worden beproefd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel54
  - number: '54.5'
    text: Waar in deze paragraaf van de massa van het anker wordt gesproken, wordt de massa zonder stok bedoeld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel54
  - number: '55.1'
    text: |-
      Ankerdelen van gegoten staal moeten worden onderworpen aan een valproef die zij moeten kunnen doorstaan zonder te
      breken, te scheuren of andere belangrijke beschadiging. Hierbij laat men een dergelijk gegoten stalen onderdeel,
      of indien het anker uit één stuk is gegoten het gehele anker, vallen over een vrije valhoogte van 4,50 m voor
      ankers lichter dan 750 kg, over een hoogte van 4 m voor ankers van 750 tot 1500 kg en over een hoogte van 3 m voor
      zwaardere ankers. Het voorwerp moet bij de val neerkomen op een ijzeren of stalen grondplaat die zo sterk is dat
      zij niet breekt of scheurt. De grondplaat moet door een massieve gemetselde of betonnen fundatie worden gesteund.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel55
  - number: '55.2'
    text: |-
      Een hamerproef moet op de in het voorgaande lid bedoelde valproef volgen, waarbij alle delen van gegoten staal,
      vrij opgehangen, met een hamer van 3 kg worden beklopt voor onderzoek naar niet zichtbare gebreken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel55
  - number: '55.3'
    text: |-
      Alle ankers, onverschillig uit welk materiaal vervaardigd, met uitzondering van dreggen en ankers als bedoeld in
      artikel 54, vierde lid, moeten worden onderworpen aan een belastingproef. Deze proef wordt genomen met behulp van
      een kettingtrekbank of op een andere door het Hoofd van de Scheepvaartinspectie goedgekeurde wijze. Voor de te
      bezigen werktuigen geldt het bepaalde in artikel 46. De in artikel 58 opgenomen tabel geeft, in verband met de
      massa van het anker, de te gebruiken belasting aan. Ankers die op grond van hun constructie van geringere massa
      mogen zijn dan de gebruikelijke typen, moeten worden beproefd met een belasting zoals voorgeschreven indien geen
      reductie op de massa zou zijn toegepast.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel55
  - number: '55.4'
    text: |-
      Voor de belastingproef wordt het te beproeven anker zodanig opgehangen, dat de trekkracht aan de ene zijde
      aangrijpt aan de roering en aan de andere zijde aan een van de vloeien, bij stokloze ankers aan beide vloeien, op
      een derde van de lengte van de arm van de vloei, van de punt van de vloei gemeten. Met deze lengte wordt bedoeld
      de afstand van de punt van de vloei tot het snijpunt van de hartlijn van de schacht met ondereind anker. Bij ankers
      met een scharnierende schacht neemt men voor deze lengte de loodrechte afstand tussen de punt van de vloei en de
      hartlijn van het scharnier. Elk anker wordt tweemaal beproefd. Na de eerste beproeving wordt het anker gedraaid,
      zodat bij ankers met stok de andere vloeiarm wordt belast en bij stokloze ankers beide vloeien aan de keerzijde
      worden belast.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel55
  - number: '55.5'
    text: |-
      Gedurende en na afloop van de beproeving wordt het anker nagezien om te constateren of zich gebreken voordoen als
      scheuren, blijvende vormveranderingen en dergelijke. Indien zich gebreken voordoen, wordt het anker afgekeurd. Bij
      ankers met scharnierende schacht wordt bovendien nagezien of de scharnierpunten gangbaar zijn gebleven. Indien zij
      niet gangbaar zijn gebleven, wordt dit hersteld en de proef herhaald.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel55
  - number: '56.1'
    text: |-
      Met uitzondering van de eindschalmen en de onmiddellijk daarop aansluitende grote schalmen aan elk kettingeind,
      moeten alle schalmen van gelijke grootte zijn. In de lengte- en breedte-afmetingen wordt voor de schalmen en
      sluitingen een speling toegestaan van ten hoogste plus of min 2 percent. De speling van de middellijnen van de
      schalmdoorsnede mag naar beneden niet meer bedragen dan: 1 mm, voor ketting van kettingmateriaal met een middellijn
      kleiner dan 50 mm; 1,5 mm voor ketting van kettingmateriaal met een middellijn van 50 tot en met 75 mm; en 2 mm
      voor ketting van kettingmateriaal met een middellijn groter dan 75 mm.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel56
  - number: '56.2'
    text: Elk kettingeind, ongeveer 27 m lang, moet uit een oneven aantal schalmen bestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel56
  - number: '56.3'
    text: Wartels mogen alleen aan de uiteinden van de gehele ketting voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel56
  - number: '56.4'
    text: De kettingen mogen tijdens de beproeving noch geschilderd, noch geolied, noch met enig ander smeersel zijn bedekt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel56
  - number: '56.5'
    text: |-
      Elk kettingeind dat aan de eisen voldoet, moet op beide eindschalmen en op alle sluitings, eindharpen en wartels
      door of ten overstaan van de met de keuring belaste ambtenaar duidelijk worden gemerkt met het slagmerkteken als
      bedoeld in artikel 50.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel56
  - number: '57.1'
    text: |-
      Alle kettingeinden, ook voorloopkettingen, behorende tot het ankergerei van een vaartuig moeten worden beproefd.
      Hiertoe worden alle schalmen, wartels, sluitings en eindharpen, die tot zulk een eind behoren, alsmede de bij de
      ketting eventueel behorende reserve sluitings en harpen, onderworpen aan een rekproef. De in artikel 59 opgenomen
      tabel geeft voor de verschillende zwaarten van ketting de voorgeschreven belasting. Belangrijke vormveranderingen,
      breuken of andere uitwendige tekenen van beschadiging mogen zich daarbij niet voordoen. Indien dit wel het
      geval mocht zijn, wordt het betrokken eind ketting of reservedeel afgekeurd. Het bepaalde in artikel 46 is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel57
  - number: '57.2'
    text: |-
      Voordat tot deze rekproef wordt overgegaan, kunnen door de met de keuring belaste ambtenaar, drie willekeurige,
      opvolgende gewone schalmen uit een kettingeind worden aangewezen voor een proef met verhoogde belasting, de
      zogenaamde breekproef, met dien verstande dat uit elke 27 m nooit meer dan een eerste breekproef wordt gehouden.
      Bij deze breekproef mogen de schalmen niet breken beneden of bij een belasting zoals is aangegeven voor elk zwaarte
      van ketting in de in het voorgaande lid bedoelde tabel. Breekt een van de drie schalmen voordat de belasting is
      overschreden dan moet een tweede serie van drie opvolgende schalmen uit hetzelfde eind worden onderworpen aan
      dezelfde proef. Treedt er nogmaals een breuk op, dan wordt het betrokken kettingeind afgekeurd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel57
  - number: '57.3'
    text: |-
      Na afloop van de breekproef worden de drie hoogbelaste schalmen uit het kettingeind verwijderd en de ketting weer
      tot een geheel gemaakt, door een of drie nieuwe schalmen tussen beide gedeelten te brengen. Daarna kan tot de in
      het eerste lid genoemde rekproef worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel57
  - number: '57.4'
    text: |-
      Na afloop van de rekproef wordt elk kettingeind grondig nagezien om vast te stellen of de lassen in orde zijn, de
      verschillende delen de vereiste vorm en de vereiste afmetingen hebben en er geen gebreken zijn. Bij het voorkomen
      van gebreken moeten deze worden hersteld en het kettingeind daarna opnieuw aan de rekproef worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel57
  - number: '57.5'
    text: |-
      Voor kettingen vervaardigd van staal met een treksterkte die gelijk is aan of groter is dan 690 N/mm2 moeten
      aanvullende beproevingen van de mechanische eigenschappen worden uitgevoerd, zoals voorgeschreven door de
      klassebureaus.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel57
