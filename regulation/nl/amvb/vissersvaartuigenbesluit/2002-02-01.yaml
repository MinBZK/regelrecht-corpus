    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel59
  - number: '60'
    text: |-
      Vaartuigen moeten zo zijn ontworpen en geconstrueerd dat aan de bepalingen van dit hoofdstuk wordt voldaan in de
      bedrijfstoestanden als bedoeld in artikel 66. Berekeningen van de krommen van de armen van statische stabiliteit
      moeten voldoen aan de door het Hoofd van de Scheepvaartinspectie nader te stellen regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel60
  - number: '61.1'
    text: |-
      Een vaartuig moet voldoen aan de door het Hoofd van de Scheepvaartinspectie te stellen eisen betreffende de minimum
      stabiliteitscriteria.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel61
  - number: '61.2'
    text: |-
      Wanneer voorzieningen, andere dan kimkielen zijn aangebracht teneinde het slingeren te beperken, moet ten genoegen
      van het Hoofd van de Scheepvaartinspectie worden aangetoond dat in alle bedrijfstoestanden de stabiliteit ten
      minste zal blijven voldoen aan de criteria als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel61
  - number: '61.3'
    text: |-
      Wanneer ballast is aangebracht teneinde zeker te stellen dat wordt voldaan aan het bepaalde in het eerste lid,
      moet deze in het algemeen bestaan uit vast aangebrachte ballast. Het Hoofd van de Scheepvaartinspectie kan in
      gevallen als bedoeld in artikel 67 het gebruik van waterballast toestaan in welk geval de in artikel 69, eerste
      lid, bedoelde stabiliteitsgegevens duidelijke instructies voor de kapitein moeten bevatten voor het gebruik van
      zulke ballast.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel61
  - number: '62.1'
    text: |-
      Op vaartuigen, andere dan die waarmede de boomkorvisserij wordt uitgeoefend, moeten luikopeningen die tijdens
      het uitoefenen van visserijwerkzaamheden niet gesloten zijn en die niet snel gesloten kunnen worden, zodanig zijn
      aangebracht dat bij een hellingshoek van 20 graden of minder geen water de visruimen kan binnendringen, tenzij aan
      het bepaalde in artikel 61, eerste lid, kan blijven worden voldaan wanneer die visruimen geheel of gedeeltelijk
      vervuld zijn geraakt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel62
  - number: '62.2'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing op vaartuigen waarmede de boomkorvisserij wordt
      uitgeoefend, met dien verstande dat de hellingshoek waarbij geen water de visruimen kan binnendringen, 30 graden of
      minder moet bedragen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel62
  - number: '63'
    text: |-
      Vaartuigen die worden gebruikt voor bijzondere vismethoden waarbij extra krachten van buitenaf op het vaartuig
      werken tijdens de visserij-werkzaamheden, moeten ten minste voldoen aan de stabiliteitscriteria bedoeld in artikel
      61, tweede lid, die zonodig ten genoegen van het Hoofd van de Scheepvaartinspectie kunnen worden uitgebreid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel63
  - number: '64'
    text: |-
      Vaartuigen moeten ten genoegen van het Hoofd van de Scheepvaartinspectie weerstand kunnen bieden aan de invloed
      van de wind en het slingeren in de daarmede verband houdende zeegang, waarbij rekening moet worden gehouden met
      de weersomstandigheden en de toestand van de zee in de jaargetijden waarin het vaartuig dienst zal doen, het type
      vaartuig en het doel waarvoor het vaartuig wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel64
  - number: '65'
    text: |-
      Vaartuigen moeten ten genoegen van het Hoofd van de Scheepvaartinspectie weerstand kunnen bieden aan de invloed
      van water aan dek, waarbij rekening moet worden gehouden met de weersomstandigheden en de toestand van de zee in
      de jaargetijden waarin het vaartuig dienst zal doen, het type vaartuig en het doel waarvoor het vaartuig wordt
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel65
  - number: '66'
    text: |-
      Het aantal en soort bedrijfstoestanden waarmede rekening moet worden gehouden wordt vastgesteld door het Hoofd van
      de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel66
  - number: '67.1'
    text: |-
      Het Hoofd van de Scheepvaartinspectie geeft nadere regels voor het berekenen van de stabiliteit van vaartuigen
      welke de visserij zullen uitoefenen in gebieden waar zich ijsafzetting kan voordoen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel67
  - number: '67.2'
    text: |-
      Vaartuigen die zijn bestemd voor het uitoefenen van de visserij in gebieden waarvan het bekend is dat zich
      ijsafzetting voordoet, moeten ten genoegen van het Hoofd van de Scheepvaartinspectie:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel67
  - number: 67.2.1°
    text: zodanig zijn ontworpen dat ijsafzetting tot een minimum wordt beperkt; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel67
  - number: 67.2.2°
    text: met middelen voor het verwijderen van ijs zijn uitgerust.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel67
  - number: '68.1'
    text: |-
      Elk vaartuig moet na voltooiing aan een hellingproef worden onderworpen waarbij het werkelijke gewicht en de
      ligging van het zwaartepunt moeten worden bepaald voor de toestand van het lege, bedrijfsklare vaartuig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel68
  - number: '68.2'
    text: |-
      Indien een vaartuig wijzigingen heeft ondergaan die van invloed kunnen zijn op de toestand van het lege,
      bedrijfsklare vaartuig en de ligging van het zwaartepunt, moet het vaartuig, indien zulks naar het oordeel van het
      Hoofd van de Scheepvaartinspectie noodzakelijk is, opnieuw aan een hellingproef worden onderworpen en moeten de
      stabiliteitsgegevens worden herzien.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel68
  - number: '68.3'
    text: |-
      Evenzo kan een vaartuig aan een hellingproef worden onderworpen indien de nodige stabiliteitsgegevens niet kunnen
      worden overgelegd dan wel deze gegevens naar het oordeel van het Hoofd van de Scheepvaartinspectie onvoldoende
      betrouwbaar zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel68
  - number: '68.4'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nadere regels geven voor de wijze waarop een hellingproef moet worden
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel68
  - number: '69.1'
    text: |-
      Aan de kapitein moeten voldoende nauwkeurige en betrouwbare gegevens betreffende de stabiliteit ter beschikking
      worden gesteld, opdat door hem op een snelle en eenvoudige wijze de stabiliteit van het vaartuig onder
      verschillende bedrijfstoestanden kan worden beoordeeld. Deze gegevens moeten zonodig gerichte instructies voor de
      kapitein bevatten die hem waarschuwen voor die bedrijfstoestanden die een ongunstige invloed kunnen hebben op de
      stabiliteit of de trim van het vaartuig. De stabiliteitsgegevens moeten ter goedkeuring worden overgelegd aan het
      Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel69
  - number: '69.2'
    text: De goedgekeurde stabiliteitsgegevens moeten te allen tijde aan boord aanwezig en beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel69
  - number: '69.3'
    text: |-
      Indien een vaartuig wijzigingen heeft ondergaan die van invloed zijn op zijn stabiliteit, moeten de gegevens
      betreffende de stabiliteit opnieuw worden berekend en ter goedkeuring aan het Hoofd van de Scheepvaartinspectie
      worden overgelegd. Indien op grond van deze stabiliteitsberekeningen het Hoofd van de Scheepvaartinspectie van
      oordeel is dat de bestaande stabiliteitsgegevens moeten worden herzien, moeten de nieuwe gegevens aan de kapitein
      ter beschikking worden gesteld en moeten de vervangen gegevens worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel69
  - number: '70'
    text: |-
      De vislading moet deugdelijk worden gestuwd teneinde het overgaan van de lading, waardoor een gevaarlijke
      vertrimming of slagzij van het vaartuig zou kunnen ontstaan, tegen te gaan. Indien hiertoe keeschotten worden
      toegepast, moeten deze voldoen aan door het Hoofd van de Scheepvaartinspectie te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel70
  - number: '71.1'
    text: |-
      De boeghoogte moet toereikend zijn om te voorkomen dat het vaartuig bovenmatige hoeveelheden water overkrijgt en
      moet zodanig zijn vastgesteld, dat rekening is gehouden met de weersomstandigheden en de toestand van de zee in
      de jaargetijden waarin het vaartuig dienst zal doen, het type vaartuig en het doel waarvoor het vaartuig wordt
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel71
  - number: '71.2'
    text: Het Hoofd van de Scheepvaartinspectie kan nadere regels geven ten aanzien van de boeghoogte.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel71
  - number: '72'
    text: |-
      Ten genoegen van het Hoofd van de Scheepvaartinspectie moet een maximum toelaatbare diepgang worden vastgesteld
      waarbij nog wordt voldaan aan de stabiliteitscriteria gesteld in dit hoofdstuk zomede aan het bepaalde, voorzover
      van toepassing, in de hoofdstukken 2 en 6. De vastgestelde waarde van de maximum toelaatbare diepgang moet in de in
      artikel 69, eerste lid, bedoelde stabiliteitsgegevens worden opgenomen. Indien een vaartuig is ingericht voor meer
      dan één vismethode, kan het Hoofd van de Scheepvaartinspectie voor elk van die methoden een maximum toelaatbare
      diepgang in overweging nemen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel72
  - number: '73'
    text: |-
      Van een vaartuig waarvan de lengte 100 m of meer bedraagt en met 100 of meer opvarenden aan boord moet ten genoegen
      van het Hoofd van de Scheepvaartinspectie de stabiliteit toereikend zijn om het lek geraken van enig compartiment
      te kunnen doorstaan, waarbij rekening moet worden gehouden met het type vaartuig, de aard van de dienst waarvoor
      het vaartuig bestemd is en het vaargebied.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel73
  - number: '74.1'
    text: |-
      Hoofdvoortstuwingsinstallaties en toebehoren, hulpwerktuigen, brandstofsystemen, elektrische installaties,
      koelsystemen, ketels en andere drukvaten, pijpleidingen en pompinstallaties, stuurmachines en toebehoren, assen en
      koppelingen, bestemd voor de overdracht van vermogen, moeten zijn ontworpen, geconstrueerd, ingericht, beproefd en
      onderhouden ten genoegen van het Hoofd van de Scheepvaartinspectie. De uitvoering en opstelling van deze machine-
      installaties, met inbegrip van hefwerktuigen, lieren en uitrusting voor de behandeling en verwerking van vis,
      moeten zodanig zijn, dat de veiligheid en de gezondheid van in de nabijheid aanwezige personen zoveel mogelijk
      is gewaarborgd. Waar nodig moeten ter beveiliging tegen bewegende delen, hete oppervlakken en andere gevaren,
      schermplaten, handgrepen of hekwerk zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.2'
    text: |-
      Ruimten voor machines moeten zodanig zijn ontworpen dat alle werktuigen en de daarbij behorende
      bedieningsinstallaties, alsmede alle andere onderdelen die onderhoud kunnen vereisen, veilig en gemakkelijk
      toegankelijk zijn. De betreffende ruimten moeten voldoende kunnen worden geventileerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.3'
    text: |-
      De bouw en de uitvoering van de werktuiglijke installatie en de inrichting der ruimten waarin tot de installatie
      behorende werktuigen zijn geplaatst, moeten ten minste voldoen aan de eisen gesteld door een klassebureau,
      voor zover bij of krachtens dit besluit daaromtrent geen andere voorschriften zijn gegeven. Het Hoofd van de
      Scheepvaartinspectie kan hieromtrent nadere voorschriften geven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.4'
    text: |-
      Roosters, bordessen en vloerplaten moeten deugdelijk zijn gesteund en bevestigd. Vloerplaten moeten gemakkelijk
      kunnen worden losgenomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.5'
    text: |-
      Reservedelen, scheepsbenodigdheden en dergelijke moeten deugdelijk zijn opgeborgen en mogen de doorgang niet
      versperren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.6'
    text: |-
      In ruimten voor machines moeten de vullings of de tanktop ter plaatse van de lenskorven kunnen worden gecontroleerd
      zonder dat hiertoe vloerplaten behoeven te worden losgenomen. Aan boord van een vaartuig, waarvan de lengte 45 m
      of meer bedraagt, moet voor dit doel tevens een vast aangebrachte verlichting aanwezig zijn, die voldoet aan het
      bepaalde in artikel 127.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.6'
    text: |-
      In ruimten waarin één of meer met olie gestookte ketels zijn opgesteld, moeten op doelmatige plaatsen roosters zijn
      aangebracht teneinde de tanktop of de vullings onder de stookplaat te allen tijde te kunnen controleren. Voor dit
      doel moet tevens een vast aangebrachte verlichting aanwezig zijn, die voldoet aan het bepaalde in artikel 127.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.7'
    text: |-
      Voorzieningen moeten zijn aangebracht om de goede werking van de voortstuwingsinstallatie te kunnen handhaven of
      herstellen, zelfs indien één van de essentiële hulpinstallaties uitvalt. Bijzondere aandacht moet daarbij worden
      gegeven aan de goede werking van:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: 74.7.1°
    text: de inrichtingen die de brandstoftoevoer naar de hoofd-voortstuwingsinstallatie verzorgen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: 74.7.2°
    text: de normale middelen die de smeeroliedruk verzorgen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: 74.7.3°
    text: |-
      de hydraulische, pneumatische en elektrische middelen voor de bediening van de hoofdvoortstuwingsinstallatie met
      inbegrip van de verstelbare schroeven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: 74.7.4°
    text: |-
      de middelen om de koelwaterdruk ten behoeve van de koelsystemen van de hoofdvoortstuwingsinstallatie en de
      hulpwerktuigen te verzorgen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: 74.7.5°
    text: de luchtcompressoren en de luchtvaten voor aanzet- of bedieningsdoeleinden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.7'
    text: |-
      Voorzieningen moeten zijn aangebracht met behulp waarvan de machine-installatie in werking kan worden gesteld
      vanuit een dood-schip-toestand zonder dat hulp van buiten wordt geboden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.8'
    text: |-
      Hoofdvoortstuwingsinstallaties en alle hulpinstallaties die noodzakelijk zijn voor de voortstuwing en de veiligheid
      van het vaartuig, moeten, zoals zij zijn geïnstalleerd, kunnen functioneren ongeacht of het vaartuig recht ligt
      dan wel een slagzij maakt tot 15 graden naar beide zijden onder statische omstandigheden of een slagzij tot 22½
      graden naar beide zijden onder dynamische omstandigheden, waarbij het vaartuig over beide zijden slingert en
      gelijktijdig een dynamisc he stampbeweging tot 7½ graden over de boeg of achtersteven maakt. Het Hoofd van de
      Scheepvaartinspectie kan, rekening houdende met het type, de afmetingen en het gebruik van het vaartuig, toestaan
      dat van deze criteria wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.9'
    text: |-
      Het ontwerp, de constructie en de installatie van voortstuwingssystemen moet zodanig zijn, dat binnen de normale
      bedrijfsgebieden op geen enkele wijze door trillingen abnormale spanningen in deze voortstuwingssystemen worden
      veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.10'
    text: |-
      Aan boord van elk vaartuig, moeten met betrekking tot de controle over en de beveiliging van de werktuiglijke
      installatie en van de ruimten waarin de tot de installatie behorende werktuigen zijn geplaatst, zodanige
      voorzieningen zijn getroffen als door het Hoofd van de Scheepvaartinspectie worden nodig geacht. Indien onder deze
      voorzieningen een alarmering is begrepen welke waarschuwt tegen een te hoge waterstand in de vullingen van genoemde
      ruimten, moeten constructie, uitvoering en aanleg van een dergelijke alarmeringsinstallatie voldoen aan de eisen
      gesteld door het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.11'
    text: 'Elektrische installaties moeten zodanig zijn uitgevoerd dat:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: 74.11.1°
    text: |-
      alle elektrische hulpdiensten, nodig om de normale toestand van bedrijfsvoering en leefbaarheid te handhaven,
      verzekerd zijn zonder dat behoeft te worden teruggevallen op de noodkrachtbron;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: 74.11.2°
    text: |-
      elektrische diensten welke essentieel zijn voor de veiligheid tijdens verschillende noodtoestanden, verzekerd zijn;
      en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: 74.11.3°
    text: de veiligheid van bemanning en vaartuig tegen gevaren van elektrische aard is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.12'
    text: |-
      Ten aanzien van elektrische installaties dient te allen tijde te worden voldaan aan het bepaalde in paragraaf 3,
      voor zover op het vaartuig van toepassing.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.13'
    text: 'Aan boord van vaartuigen met tijdelijk onbemande machinekamers:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: 74.13.1°
    text: |-
      moet, onverminderd het bepaalde in de paragrafen 1 en 2 en het bepaalde in hoofdstuk 5, bovendien worden voldaan
      aan het bepaalde in paragraaf 4;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: 74.13.2°
    text: |-
      moeten, ten genoegen van het Hoofd van de Scheepvaartinspectie, zodanige voorzieningen worden getroffen dat het
      zeker is dat de gehele machine-installatie onder alle omstandigheden op betrouwbare wijze functioneert. In elk
      geval moeten deze voorzieningen regelmatige inspecties en ronden omvatten teneinde de voortdurende goede werking
      van de machine-installatie te verzekeren; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: 74.13.3°
    text: |-
      moet een verklaring aanwezig zijn, afgegeven door of namens het Hoofd van de Scheepvaartinspectie, waaruit blijkt
      dat deze vaartuigen zijn ingericht om met tijdelijk onbemande machinekamers te varen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.14'
    text: |-
      Aan boord van een werktuiglijk voortbewogen vaartuig moeten gereedschap, materiaal en verwisselstukken in voldoende
      hoeveelheid aanwezig zijn, om op zee noodherstellingen aan de werktuigen, de ketels, de stuurinrichting en de
      elektrische installatie te kunnen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '74.15'
    text: |-
      De samenstellende delen van de scheepsromp en van de werktuigen en inrichtingen, die van belang kunnen zijn voor
      de veiligheid van vaartuig en opvarenden, mogen niet te veel zijn ingeteerd of versleten. Assen mogen niet op
      gevaarlijke wijze zijn verzakt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel74
  - number: '75.1'
    text: |-
      De hoofd- en hulpwerktuigen moeten, zowel in hun geheel als in onderdelen, goed functioneren, voldoende sterk
      geconstrueerd, nauwkeurig gesteld, deugdelijk gefundeerd en voor hun taak berekend zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel75
  - number: '75.2'
    text: |-
      Hoofd- en hulpwerktuigen die noodzakelijk zijn voor de voortstuwing en de veiligheid van het vaartuig, moeten zijn
      voorzien van doelmatige bedieningsmiddelen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel75
  - number: '75.3'
    text: |-
      Verbrandingsmotoren met een cilinderdiameter van 200 mm of meer, of een krukkast volume van 0,6 m3 of meer, moeten
      zijn voorzien van ontlastkleppen voor krukkastexplosies; deze ontlastkleppen moeten van een geschikt type zijn
      en een voldoende ontlast-oppervlak hebben. De ontlastkleppen moeten zodanig zijn aangebracht of met zodanige
      voorzieningen zijn uitgerust dat bij in werking treden van de ontlastkleppen de uitstroming zodanig wordt geleid
      dat de kans op letsel aan de opvarenden tot een minimum wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel75
  - number: '75.4'
    text: |-
      Indien hoofd- of hulpwerktuigen, drukvaten inbegrepen, of onderdelen van deze werktuigen aan inwendige druk
      zijn onderworpen en aan gevaarlijke overdruk kunnen worden blootgesteld moeten, waar praktisch uitvoerbaar,
      voorzieningen worden getroffen die tegen zulk een te hoge druk beschermen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel75
  - number: '75.5'
    text: |-
      Alle tandwieloverbrengingen en elke as en koppeling welke gebruikt worden voor het overbrengen van vermogen naar
      werktuigen die essentieel zijn voor de voortstuwing en veiligheid van het vaartuig en van de opvarenden, moeten
      zodanig zijn ontworpen en vervaardigd dat zij bestand zijn tegen de hoogste spanningen waaraan zij kunnen worden
      onderworpen in alle bedrijfstoestanden. Speciale aandacht dient te worden geschonken aan de uitvoering van de
      werktuigen waardoor zij worden aangedreven of waarvan zij een onderdeel uitmaken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel75
  - number: '75.6'
    text: |-
      Voortstuwingswerktuigen en, waar van toepassing, hulpwerktuigen moeten voorzien zijn van automatisch werkende
      voorzieningen om deze uit te schakelen bij storingen, zoals het uitvallen van de smeerolietoevoer, die aanleiding
      kunnen geven tot ernstige schade, onklaar geraken of explosie. Tevens moet een vooralarm zijn aangebracht
      opdat een waarschuwingssignaal wordt gegeven alvorens de machines automatisch worden gestopt. Het Hoofd van de
      Scheepvaartinspectie kan echter voorzieningen toestaan, waarmede de automatische stopinrichtingen buiten werking
      kunnen worden gesteld, dan wel ontheffing verlenen van het bepaalde in dit lid, rekening houdende met het type
      vaartuig of het bijzondere gebruik daarvan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel75
  - number: '76.1'
    text: |-
      Er moet een zodanig voortstuwingsvermogen kunnen worden ontwikkeld, dat het vaartuig onder alle in de praktijk
      voorkomende omstandigheden behoorlijk manoeuvreerbaar is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel76
  - number: '76.2'
    text: |-
      Ten genoegen van het Hoofd van de Scheepvaartinspectie moet worden aangetoond dat de machine-installatie in staat
      is de richting van de stuwdruk van de schroef binnen redelijke tijd om te keren en hiermede binnen redelijke
      afstand de vaart uit het vaartuig te halen vanuit de maximum dienstsnelheid vooruit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel76
  - number: '77.1'
    text: |-
      Stoom- en damptoestellen, aanzetluchtvaten en andere drukhouders moeten voldoende sterk zijn geconstrueerd en
      beveiligd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel77
  - number: '77.2'
    text: |-
      Bij de beoordeling van de constructie en uitvoering van de in het voorgaande lid bedoelde toestellen, luchtvaten
      en drukhouders, zomede van hun appendages, aansluitingen en leidingen, zullen de regels van de klassebureaus worden
      gevolgd, voor zover bij of krachtens dit besluit geen andere voorschriften zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel77
  - number: '77.3'
    text: |-
      De in het eerste lid bedoelde toestellen, luchtvaten en drukhouders moeten worden beproefd overeenkomstig de regels
      van de klassebureaus, voor zover bij of krachtens dit besluit geen andere voorschriften zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel77
  - number: '77.4'
    text: |-
      Hydrofoortanks moeten zijn voorzien van een manometer, een veiligheidsklep en een peilglas of van daaraan naar het
      oordeel van het Hoofd van de Scheepvaartinspectie gelijkwaardige veiligheidsvoorzieningen. Een tank met een inhoud
      van meer dan 200 l moet zijn voorzien van een man- of handgat.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel77
  - number: '77.5'
    text: |-
      Onverminderd het bepaalde in dit artikel moeten stoom- en damptoestellen, aanzetluchtvaten en andere drukhouders
      tevens voldoen aan het bepaalde in de artikelen 78 tot en met 80, voor zover van toepassing.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel77
  - number: '78.1'
    text: |-
      Elke stoomketel en elke ongestookte stoomgenerator moet zijn voorzien van ten minste twee veiligheidskleppen
      van voldoende capaciteit, met dien verstande dat het Hoofd van de Scheepvaartinspectie, rekening houdende met de
      capaciteit of enige andere eigenschap van stoomketels of ongestookte stoomgenerators, kan toestaan dat slechts
      één veiligheidsklep is aangebracht, mits hij ervan overtuigd is dat in dat geval voorzien is in een afdoende
      beveiliging tegen overdruk.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel78
  - number: '78.2'
    text: |-
      Elke met olie gestookte stoomketel die is ontworpen om niet met de hand te worden bediend, moet voorzien zijn van
      veiligheidsinrichtingen die de olietoevoer afsluiten en alarm geven in geval van laag waterpeil, storing in de
      luchttoevoer of vlamstoring.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel78
  - number: '78.3'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nadere regels geven voor stoomketelinstallaties, teneinde zeker te
      stellen dat voedingwatersystemen, bedieningsapparatuur en veiligheidsvoorzieningen in alle opzichten geschikt zijn
      om de veiligheid van ketels, stoomdrukvaten en stoomleidingen te garanderen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel78
  - number: '79'
    text: |-
      Afsluiters aan een stoomketel, door middel waarvan stoom kan worden toegelaten in een hoofd- of hulpstoomleiding,
      moeten vanaf een door het Hoofd van de Scheepvaartinspectie goedgekeurde plaats kunnen worden gesloten. Daar
      waar de afsluiters worden bediend, moet een duidelijke aanwijzing zijn aangebracht in welke richting moet worden
      gedraaid om de stoomtoevoer af te sluiten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel79
  - number: '80.1'
    text: |-
      Op elk vaartuig moeten voorzieningen zijn aangebracht om ongewenste overdruk te voorkomen in enig deel van systemen
      voor samengeperste lucht en in die gevallen waarin watermantels of cilinderblokken van luchtcompressoren en
      huizen van koelers kunnen worden onderworpen aan een gevaarlijke overdruk ten gevolge van lekkage naar deze delen
      afkomstig van onder luchtdruk staande onderdelen. Doelmatige ontlastvoorzieningen moeten op deze systemen zijn
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel80
  - number: '80.2'
    text: |-
      De aanzetluchtleidingen van alle voortstuwingsmotoren moeten zijn voorzien van een veiligheidsinrichting.
      De aanzetluchtleidingen van direct omkeerbare voortstuwingsmotoren moeten voorts zijn voorzien van
      veiligheidsinrichtingen nabij de aanzetluchtkleppen op elke werkcilinder, teneinde explosies in de
      aanzetluchtleidingen te voorkomen of te localiseren. De hierboven genoemde veiligheidsinrichtingen moeten zodanig
      zijn geplaatst of beschermd, dat bij het in werking komen daarvan geen gevaar voor het bedienend personeel kan
      ontstaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel80
  - number: '80.3'
    text: |-
      Alle persleidingen van de aanzetluchtcompressoren moeten rechtstreeks zijn aangesloten op de aanzetluchtvaten,
      terwijl alle aanzetluchtleidingen van de aanzetluchtvaten naar de hoofden hulpmotoren geheel moeten zijn gescheiden
      van het persleidingsysteem van de compressoren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel80
  - number: '80.4'
    text: |-
      Voorzieningen moeten zijn getroffen om het binnendringen van olie in de systemen voor samengeperste lucht tot een
      minimum te beperken en om deze olie uit het betreffende systeem af te voeren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel80
  - number: '80.5'
    text: |-
      De totale capaciteit van aanzetluchtvaten voor voortstuwingsmotoren moet voldoende groot zijn om, zonder
      tussentijds bijpompen van lucht, bij:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel80
  - number: 80.5.1°
    text: 'direct omkeerbare motoren: twaalf maal te kunnen aanzetten, afwisselend in beide draairichtingen;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel80
  - number: 80.5.2°
    text: 'motoren met één draairichting: zes maal te kunnen aanzetten.'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel80
  - number: '81.1'
    text: |-
      Vanaf de brug moeten door middel van ten minste twee onafhankelijke communicatiemiddelen op doeltreffende
      wijze orders kunnen worden gegeven naar de plaats in de machinekamer of in de controlekamer waar in normale
      omstandigheden de voortstuwingsinstallatie kan worden bediend. Bedoelde orders moeten vanaf deze plaats ook
      kunnen worden beantwoord. Aan boord van een vaartuig waarvan de lengte 45 m of meer bedraagt moet een van deze
      communicatiemiddelen een machinekamertelegraaf zijn, die zowel op de brug als op de bedieningsplaats de orders en
      de beantwoording daarvan zichtbaar aangeeft. Tussen de brug en elke andere plaats waar de voortstuwingsinstallatie
      kan worden bediend moet een doelmatig communicatiemiddel aanwezig zijn. Aan boord van een vaartuig waarvan de
      lengte minder dan 45 m bedraagt, waarop de bediening vanaf de voortstuwingsinstallatie geschiedt vanaf de brug, kan
      indien de uitvoering van de afstandsbediening voldoet aan de daarvoor door het Hoofd van de Scheepvaartinspectie
      te stellen eisen en de inrichting en uitvoering van de machineinstallatie naar zijn oordeel hiervoor in aanmerking
      komt, de telegraaf worden vervangen door een andere doeltreffende rechtstreekse verbinding.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel81
  - number: '81.2'
    text: |-
      Vanaf de brug, dient eveneens een doeltreffende rechtstreekse spreekverbinding te bestaan met de plaats waar de
      hulpstuurinrichting wordt bediend en met de verblijven van de kapitein.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel81
  - number: '81.3'
    text: |-
      Op vaartuigen waarvan de lengte 45 m of meer bedraagt moet vanaf de plaats of plaatsen waar het
      voortstuwingswerktuig of de voortstuwingswerktuigen kan of kunnen worden bediend, een doeltreffende rechtstreekse
      spreekverbinding bestaan met de verblijven van de hoofdwerktuigkundige.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel81
  - number: '81.4'
    text: De in de voorgaande leden bedoelde doeltreffende spreekverbinding moet voldoen aan het bepaalde in artikel 111.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel81
  - number: '82.1'
    text: |-
      Indien een voortstuwingswerktuig, behalve ter plaatse of vanaf een daartoe speciaal aanwezige bedieningspost, ook
      rechtstreeks vanaf de brug kan worden bediend:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: 82.1.1.1
    text: |-
      moeten onder alle bedrijfsomstandigheden waaronder het manoeuvreren, de snelheid, de richting van de stuwkracht en,
      indien van toepassing, de spoed van de verstelbare schroef volledig door middel van afstandbediening vanaf de brug
      kunnen worden geregeld;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: 82.1.1.2
    text: |-
      moet de afstandbediening als bedoeld onder 1 ten genoegen zijn van het Hoofd van de Scheepvaartinspectie en
      verricht worden door middel van een bedieningsapparaat, dat zonodig voorzien moet zijn van een inrichting die
      voorkomt dat de voortstuwingswerktuigen worden overbelast;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: 82.1.1.3
    text: |-
      moeten de hoofdvoortstuwingswerktuigen voorzien zijn van een noodstopinrichting op de brug, die onafhankelijk moet
      werken van het bedieningssysteem op de brug als bedoeld onder 1;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: 82.1.1.4
    text: |-
      moet de hiervoor benodigde omschakelinrichting ten genoegen van het Hoofd van de Scheepvaartinspectie zodanig zijn
      uitgevoerd, dat:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: 82.1.1.4.1°
    text: |-
      nimmer gelijktijdig vanaf meer dan één bedieningsplaats het voortstuwingswerktuig kan worden aangezet, dan wel,
      indien van toepassing, de spoed van de verstelbare schroef kan worden versteld;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: 82.1.1.4.2°
    text: |-
      het nimmer kan voorkomen dat door omschakeling van de bediening de stuwkracht een noemenswaardige verandering
      ondergaat; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: 82.1.1.4.3°
    text: |-
      op elke bedieningsplaats op duidelijke wijze blijkt welke bedieningsplaats is ingeschakeld. De overschakeling
      van de bediening van de brug naar de ruimte voor machines dient alleen mogelijk te zijn in de ruimte voor
      machines of in de controlekamer. Voor vaartuigen waarvan de lengte minder dan 45 m bedraagt, kan het Hoofd van de
      Scheepvaartinspectie toestaan dat de bedieningsplaats in de ruimte voor machines alleen een noodbedieningsplaats
      is, mits de controle- inrichting en bedieningsorganen op de brug doelmatig zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: 82.1.1.5
    text: 'moeten instrumenten op de brug zijn aangebracht die aangeven:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: 82.1.1.5.1°
    text: |-
      de omwentelingssnelheid en de draairichting van de schroef in het geval het vaartuig is voorzien van vaste
      schroeven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: 82.1.1.5.2°
    text: |-
      de omwentelingssnelheid en de stand van de spoed in het geval het vaartuig is voorzien van verstelbare schroeven;
      en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: 82.1.1.5.3°
    text: het vooralarm zoals voorgeschreven in artikel 75, zesde lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: 82.1.1.6
    text: |-
      moeten, indien een storing optreedt in een onderdeel van het afstandbedieningssysteem, de voortstuwingswerktuigen
      op andere wijze kunnen worden bediend;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: 82.1.1.7
    text: |-
      moet, tenzij het Hoofd van de Scheepvaartinspectie van oordeel is dat zulks praktisch niet uitvoerbaar is, het
      afstandbedieningssysteem zodanig zijn ontworpen, dat bij uitvallen alarm wordt gegeven en de vooraf ingestelde
      snelheid en richting van de stuwkracht worden gehandhaafd totdat de bediening op andere wijze wordt overgenomen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: 82.1.1.8
    text: |-
      moet, indien de afstandsbediening van het voortstuwingswerktuig is ingericht voor automatisch aanzetten, het aantal
      keren waarop automatische, opeenvolgende, vergeefse startpogingen verricht kunnen worden zodanig zijn begrensd
      dat voldoende aanzetlucht aanwezig blijft voor het aanzetten van het voortstuwingswerktuig ter plaatse. Er moet
      een alarm zijn aangebracht in de ruimte voor machines dat een lage aanzetdruk aangeeft en dat is afgesteld op een
      druk waarbij aanzetten van het voortstuwingswerktuig nog mogelijk is. Indien het voortstuwingswerktuig een direct
      omkeerbare motor is moet dit alarm ook op de brug zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: '82.2'
    text: |-
      Aan boord van een vaartuig waar het omkeren van de door de schroef uitgeoefende stuwdruk geschiedt door het
      verstellen van de schroefbladen, moet dit verstellen in elk geval in de ruimte voor machines kunnen geschieden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: '82.3'
    text: |-
      Wanneer de hoofdvoortstuwingswerktuigen en bijbehorende machine-installaties met inbegrip van de elektrische
      hoofdkrachtbron zijn voorzien van verschillende graden van automatische bediening of afstandbediening en daarop
      voortdurend toezicht wordt gehouden vanuit een controlekamer, moet deze controlekamer zodanig zijn ontworpen,
      uitgerust en ingericht, dat de werking van de machine-installaties even veilig en doeltreffend is als wanneer
      daarop rechtstreeks toezicht wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: '82.4'
    text: |-
      Automatische systemen voor aanzetten, regeling en bediening moeten in het algemeen voorzieningen omvatten om de
      bediening van deze systemen met de hand over te kunnen nemen. Storing in enig gedeelte van deze systemen mag het
      gebruik van voorzieningen voor handbediening niet verhinderen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel82
  - number: '83.1'
    text: |-
      Als vloeibare brandstof mag slechts olie worden gebruikt waarvan het vlampunt niet lager is dan 60°C, behalve voor
      noodagregaten, waarvoor olie met een vlampunt van niet lager dan 43°C mag worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '83.2'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan echter het algemeen gebruik toestaan van brandstofolie met een vlampunt
      lager dan 60°C, maar niet lager dan 43°C, onder zodanige voorzorgen als hij nodig acht en op voorwaarde dat de
      temperatuur in de ruimte waarin zulk brandstofolie is opgeslagen of wordt gebruikt, niet zal mogen stijgen tot een
      waarde hoger dan 10°C onder het vlampunt van de brandstofolie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '83.3'
    text: |-
      Veilige en doeltreffende middelen ter bepaling van de hoeveelheid brandstofolie in een tank dienen aanwezig te
      zijn. Indien peilpijpen zijn aangebracht, moeten de boveneinden daarvan op veilige plaatsen uitkomen en voorzien
      zijn van doeltreffende middelen voor afsluiting. Buisvormige peilglazen mogen niet worden toegepast. Andere
      middelen ter vaststelling van de hoeveelheid brandstofolie in een tank kunnen worden toegestaan, mits het bij het
      onklaar raken daarvan of het overvullen van de tanks niet mogelijk is dat daardoor brandstofolie buiten de tank
      geraakt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '83.4'
    text: |-
      Voorzieningen moeten zijn getroffen ter vermijding van overdruk in een brandstofolietank of in een gedeelte van het
      brandstofoliesysteem, met inbegrip van verwarmingstoestellen, vulpijpen en dergelijke. Ontlastkleppen en lucht- of
      overvloeipijpen moeten afvoeren naar een veilige plaats, ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '83.5'
    text: |-
      Iedere brandstofleiding waaruit bij beschadiging olie zou kunnen ontsnappen uit een boven de dubbele bodem
      opgestelde voorraad-, bezink- of dagtank moet direct aan de tank zijn voorzien van een afsluiter die vanaf een
      veilige plaats buiten de betrokken ruimte waarin dergelijke tanks zijn geplaatst, kan worden gesloten in het
      geval dat in die ruimte brand uitbreekt. In het bijzondere geval van dieptanks in een schroefas- of pijpentunnel
      of een dergelijke ruimte, moeten afsluiters op deze tanks zijn aangebracht. De afsluiting in het geval van brand
      mag evenwel worden bewerkstelligd door middel van een extra afsluiter in de pijp of pijpen buiten de tunnel of
      dergelijke ruimte. Indien zulk een extra afsluiter is aangebracht in de ruimte voor machines, moet deze afsluiter
      vanaf een plaats buiten deze ruimte kunnen worden bediend.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '83.6'
    text: |-
      Pompen die deel uitmaken van het brandstofleidingsysteem, moeten gescheiden zijn van elk ander leidingsysteem en
      de aansluitingen op de betrokken pompen moeten zijn voorzien van een doelmatige ontlastklep die deel uitmaakt van
      een gesloten systeem. Wanneer brandstofolietanks tevens gebruikt kunnen worden als ballasttanks, moeten doelmatige
      voorzieningen zijn getroffen om het brandstofleidingsysteem en het ballastleidingsysteem van elkaar te scheiden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '83.7'
    text: |-
      Olietanks mogen niet zodanig zijn gelegen dat overvloeien of lekkage van vloeistof daaruit op hete oppervlakken een
      gevaar kan vormen. Voorzorgsmaatregelen moeten zijn genomen om te voorkomen dat olie onder druk, die uit een pomp,
      filter of voorwarmers zou kunnen ontsnappen, in aanraking komt met hete oppervlakken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '83.8'
    text: |-
      Brandstofleidingen en hun afsluiters en bevestigingen, moeten van staal of ander goedgekeurd materiaal zijn,
      behoudens dat het Hoofd van de Scheepvaartinspectie een beperkt gebruik van flexibele leidingen kan toestaan op
      plaatsen waar ten genoegen van genoemd hoofd kan worden aangetoond dat deze noodzakelijk zijn. Dergelijke flexibele
      leidingen en hun eindbevestigingen moeten van goedgekeurd brandbestendig materiaal van voldoende sterkte zijn en
      hun constructie moet ten genoegen van het Hoofd van de Scheepvaartinspectie zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '83.8'
    text: |-
      Waar dit noodzakelijk is, moeten brandstofolie- en smeerolieleidingen, voor zover praktisch uitvoerbaar, zijn
      afgeschermd of op andere wijze doeltreffend zijn beveiligd teneinde olienevel of olielekkage op hete oppervlakken
      of in luchtinlaten van werktuigen te voorkomen. Het aantal koppelingen in pijpleidingen moet tot een minimum worden
      beperkt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '83.9'
    text: |-
      Voor zover dit praktisch uitvoerbaar is, moeten de brandstofolietanks deel uitmaken van de scheepsconstructie en
      buiten de ruimten voor machines van categorie A gelegen zijn. Wanneer brandstofolietanks, geen dubbele bodemtanks
      zijnde, noodzakelijkerwijze naast of in ruimten voor machines van categorie A gelegen zijn, moet ten minste
      één van hun verticale zijden samenvallen met de begrenzingswanden van de ruimte voor machines en moeten zij bij
      voorkeur een gemeenschappelijke begrenzingswand hebben met dubbele bodemtanks indien deze zijn aangebracht. De
      oppervlakte van de begrenzingswand tussen de tank en de ruimte voor machines moet zo klein mogelijk zijn. Wanneer
      dergelijke tanks gelegen zijn binnen de begrenzingswanden van ruimten voor machines van categorie A mogen zij
      geen brandstofolie bevatten met een vlampunt dat lager is dan 60°C. Het gebruik van vrijstaande brandstofolietanks
      in brandgevaarlijke ruimten en in het bijzonder in ruimten voor machines van categorie A is in het algemeen niet
      toegestaan. Het Hoofd van de Scheepvaartinspectie kan echter de toepassing van vrijstaande brandstofolietanks
      toestaan. In dat geval moeten zij zijn geplaatst in een lekbak van ruime afmetingen welke is voorzien van een
      afvoerleiding van voldoende afmetingen, welke naar een lekolietank leidt met voldoende capaciteit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '83.10'
    text: |-
      De ventilatie van ruimten voor machines moet onder alle bedrijfsomstandigheden voldoende zijn om opeenhoping van
      oliedampen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '83.11'
    text: |-
      De inrichtingen voor de opslag, verdeling en het gebruik van olie voor smeeroliesystemen onder druk moeten ten
      genoegen zijn van het Hoofd van de Scheepvaartinspectie. Wanneer deze inrichtingen zijn aangebracht in ruimten voor
      machines, moeten zij ten minste voldoen aan het bepaalde in het eerste, tweede, vierde, zevende en achtste lid en,
      voor zover het Hoofd van de Scheepvaartinspectie dit noodzakelijk acht, aan het bepaalde in het derde en vijfde
      lid. Het gebruik van kijkglazen in smeeroliesystemen is toegestaan, mits door middel van een proef is aangetoond
      dat zij in voldoende mate brandbestendig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '83.12'
    text: |-
      De inrichtingen voor de opslag, verdeling en het gebruik van ontvlambare oliën die onder druk worden toegepast
      in hydraulische systemen voor het overbrengen van vermogen en die geen oliën zijn als bedoeld in het voorgaande
      lid, zomede van oliën die worden gebruikt in bedienings-, bekrachtigings- en verwarmingssystemen, moeten ten
      genoegen zijn van het Hoofd van de Scheepvaartinspectie. Op plaatsen waar ontstekingsbronnen aanwezig zijn, moeten
      dergelijke inrichtingen ten minste voldoen aan het bepaalde in het derde, vijfde en zevende lid en ten aanzien van
      sterkte en constructie aan het bepaalde in het vierde en het achtste lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '83.13'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan het Hoofd van de Scheepvaartinspectie onder door hem te bepalen
      nadere voorwaarden, toestaan dat voor motoren van hulpverleningsboten vloeibare brandstof met een lager vlampunt
      wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '83.14'
    text: Voorpiektanks mogen geen brandstofolie, smeerolie of andere ontvlambare oliën bevatten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel83
  - number: '84.1'
    text: |-
      Elk gedeelte van een vaartuig, voor zover het Hoofd van de Scheepvaartinspectie het hiervoor vatbaar acht, en
      elke waterdichte afdeling die niet permanent is bestemd voor de berging van olie of water, moeten onder alle
      omstandigheden die in de praktijk kunnen voorkomen, ongeacht of het vaartuig recht ligt dan wel slagzij heeft,
      door de lensinrichting kunnen worden leeggepompt. Voor dit doel moet een hoofdlensleiding aanwezig zijn, waarop
      de lenspompen zijn aangesloten en die is voorzien van de nodige afsluiters en zuigpijpen naar lenskorven in de
      afdelingen die moeten kunnen worden lensgepompt. De plaatsing van de lenspompen en de ligging van de lensleiding
      moeten zodanig zijn, dat een goede werking onder alle vorenbedoelde omstandigheden is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel84
  - number: '84.2'
    text: |-
      De lenskorven moeten als regel in de zijden der afdelingen zijn aangebracht. In smalle afdelingen kan, dit ter
      beoordeling van het Hoofd van de Scheepvaartinspectie, met één lenskorf worden volstaan, terwijl deze in afdelingen
      van bijzondere vorm extra lenskorven kan eisen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel84
  - number: '84.3'
    text: Voorzieningen moeten worden getroffen, opdat in een afdeling aanwezig water naar de lenskorven kan toevloeien.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel84
  - number: '84.4'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan het Hoofd van de Scheepvaartinspectie toestaan dat bepaalde
      afdelingen waarin een zuigaansluiting onnodig of ongewenst zou zijn, niet op de lensleiding zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel84
  - number: '84.5'
    text: |-
      Indien in een gedeelte van een vaartuig door de aard van het bedrijf of om andere redenen, ongewenste hoeveelheden
      water kunnen voorkomen, kan het Hoofd van de Scheepvaartinspectie bijzondere voorzieningen voorschrijven voor het
      lenzen van dit gedeelte.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel84
  - number: '84.6'
    text: Het lenzen van koelruimen moet op een doelmatige wijze kunnen geschieden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel84
  - number: '85.1'
    text: |-
      De inrichting van lensleidingen en ballastleidingen met de daarbij behorende pompen moet zodanig zijn, dat
      geen water rechtstreeks van buitenboord of uit waterballastruimten naar laadruimten en ruimten voor machines of
      uit de ene waterdichte ruimte naar een andere kan vloeien. Voorts moeten alle leidingen aangesloten op pompen
      die dienen om laadruimten, ruimten voor machines of andere in artikel 84, eerste lid, bedoelde ruimten lens te
      houden, afdoende zijn gescheiden van leidingen die kunnen worden gebruikt voor het vullen of ledigen van ruimten
      waarin water, olie of andere vloeistof wordt vervoerd. Dezelfde voorzorgen moeten zoveel mogelijk in acht worden
      genomen ten aanzien van brandstof- en ballastleidingen in gevallen waarin tanks afwisselend voor de berging van
      brandstofolie en ballastwater kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel85
  - number: '85.2'
    text: |-
      Bijzondere voorzieningen moeten zijn getroffen om te voorkomen dat een dieptank met aansluiting zowel aan de
      lensleiding als aan de ballastleiding door onachtzaamheid hetzij met zeewater volloopt, hetzij door een lenspomp
      wordt leeggepompt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel85
  - number: '85.3'
    text: |-
      In een lensleiding die door het openen van afsluiters of kranen in verbinding kan worden gesteld met een
      buitenboordopening of waterballastruimte, moeten zich tussen de inlaat en het open einde van de zuigpijp ten minste
      twee terugslagkleppen bevinden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel85
  - number: '85.4'
    text: |-
      De doorvoering van een lensleiding door het aanvaringsschot moet voldoen aan het bepaalde in artikel 27, zevende
      lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel85
  - number: '86'
    text: |-
      Indien een tank of ruimte die niet op de lensleiding is aangesloten, is voorzien van een wateraftapinrichting moet
      deze hetzij boven het werkdek kunnen worden bediend, hetzij zich op een steeds toegankelijke plaats bevinden en in
      dat geval zelfsluitend zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel86
  - number: '87.1'
    text: |-
      Lens- en ballastleidingen moeten zijn vervaardigd van staal of een ander goedgekeurd materiaal en, waar nodig,
      behoorlijk tegen beschadiging zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel87
  - number: '87.2'
    text: |-
      Verdeelkasten in lensleidingen moeten zodanig zijn ingericht dat het niet mogelijk is losse en vaste kleppen
      daarin bij montage abusievelijk te verwisselen. Kleppen in de verdeelkasten van de lensleiding moeten van het
      terugslagtype zijn. Afsluiters en terugslagkleppen in lensleidingen moeten bij onklaar raken op eenvoudige wijze
      weer bedrijfsklaar kunnen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel87
  - number: '87.3'
    text: |-
      Een leiding van niet-corrosiebestendig materiaal die wordt gevoerd door een tank die niet in open verbinding
      staat met die leiding, moet binnen die tank een wanddikte hebben die ten genoegen van het Hoofd van de
      Scheepvaartinspectie is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel87
  - number: '88.1'
    text: 'De inwendige middellijn van de lensleidingen moet zijn berekend volgens volgende formules, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel88
  - number: 88.1.1°
    text: |-
      als inwendige middellijn mag worden toegepast de dichtstbijzijnde standaardpijpmiddellijn, mits deze niet meer dan
      5 percent kleiner is dan de berekende;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel88
  - number: 88.1.2°
    text: |-
      de inwendige middellijn van de hoofdlensleiding en van de leidingen naar de pompen niet kleiner mag zijn dan die
      van de zuigleidingen naar de lenskorven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel88
  - number: 88.1.3°
    text: de inwendige middellijn van een lensleiding niet kleiner mag zijn dan 50 mm.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel88
  - number: '88.2'
    text: 'De in het eerste lid bedoelde berekende middellijn, uitgedrukt in millimeters, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel88
  - number: 88.2.1°
    text: 'voor de hoofdlensleiding en de leidingen naar de pompen: 25 + 1,68 L(B+D);'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel88
  - number: 88.2.2°
    text: |-
      voor de zuigpijpen naar de lenskorven: 25 + 2,14 l(B+D). In deze formules is: L = de lengte, bedoeld in artikel 2,
      eerste lid, onder 17; B = de breedte, bedoeldin artikel 2, eerste lid, onder 19; D = de holte, bedoeld in artikel
      2, eerste lid, onder 21; en l = de lengte van de waterdichte ruimte, uitgedrukt in meters.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel88
  - number: '88.3'
    text: |-
      De doorlaat van zuigopeningen van pompen, kranen en afsluiters moet ten minste gelijk zijn aan die van de daarop
      aangesloten leidingen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel88
  - number: '88.4'
    text: |-
      De lensinrichting moet zodanig zijn, dat de totale capaciteit van de pompen, bedoeld in artikel 89, derde lid, kan
      worden aangewend voor elke waterdichte afdeling die ligt tussen het aanvaringsschot en het achterpiekschot.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel88
  - number: '89.1'
    text: |-
      De in artikel 91, eerste lid, voorgeschreven lenspompen moeten werktuiglijk aangedreven zijn en aangesloten zijn op
      de hoofdlensleiding.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel89
  - number: '89.2'
    text: |-
      Met uitzondering van eventueel extra voorgeschreven pompen, uitsluitend bestemd voor piektanks, moet elke
      voorgeschreven lenspomp kunnen pompen op elke ruimte die ingevolge het bepaalde in artikel 84, eerste lid, moet
      kunnen worden lensgepompt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel89
  - number: '89.3'
    text: |-
      Sanitaire-, ballast- en algemene-dienst-pompen kunnen worden aanvaard als onafhankelijk werktuiglijk gedreven
      lenspompen, mits zij zijn voorzien van de nodige aansluitingen op de lensleiding. Pompen waarvan de persleiding
      kan worden afgesloten, moeten zonodig van ontlastkleppen zijn voorzien. Elke pomp die is bestemd om als lenspomp te
      worden gebruikt, moet zelfaanzuigend zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel89
  - number: '89.4'
    text: |-
      Indien de werking van twee of meer pompen afhankelijk is van slechts een aandrijfwerktuig of van een krachtbron,
      kan slechts een van deze pompen als een voorgeschreven pomp worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel89
  - number: '90.1'
    text: |-
      Elke in artikel 91, eerste lid, voorgeschreven lenspomp moet zijn voorzien van een rechtstreekse zuigpijp op
      de ruimte waarin deze is opgesteld. Wanneer twee of meer van dergelijke zuigpijpen in een ruimte aanwezig zijn,
      moet ten minste een aan bakboordszijde en een aan stuurboordszijde van de ruimte uitmonden. De middellijn van een
      rechtstreekse zuigpijp mag niet kleiner zijn dan die van de hoofdlensleiding.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel90
  - number: '90.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid, behoeft aan boord van een vaartuig waarvan de lengte minder dan
      75 m bedraagt, slechts een lenspomp voorzien te zijn van een rechtstreekse zuigpijp op de ruimte waarin deze is
      opgesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel90
  - number: '90.3'
    text: |-
      In ruimten voor machines moeten de afsluiters van rechtstreekse zuigpijpen boven de vloerplaten kunnen worden
      bediend.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel90
  - number: '91.1'
    text: |-
      Een vaartuig moet zijn uitgerust met ten minste twee op de hoofdlensleiding aangesloten lenspompen, die
      onafhankelijk van het hoofdvoortstuwingswerktuig kunnen worden gebruikt, met dien verstande dat op een vaartuig
      waarvan de lengte minder dan 55 m bedraagt, kan worden volstaan met één zodanige pomp, mits een andere door het
      hoofdvoortstuwingswerktuig gedreven lenspomp in staat is alle ruimten van het vaartuig lens te pompen. Het Hoofd
      van de Scheepvaartinspectie kan voor vaartuigen, waarvan de lengte minder dan 24 m bedraagt, afwijking toestaan van
      het bepaalde in dit lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel91
  - number: '91.2'
    text: |-
      Een van de lenspompen, voorgeschreven in het voorgaande lid, mag worden vervangen door een lensejecteur
      met bijbehorende werktuiglijk gedreven pomp, mits de andere voorgeschreven lenspomp onafhankelijk van het
      hoofdvoortstuwingswerktuig kan worden gebruikt. De bij de lensejecteur behorende pomp moet van voldoende capaciteit
      zijn en onafhankelijk van het hoofdvoortstuwingswerktuig en het lenssysteem kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel91
  - number: '91.3'
    text: |-
      Elke voorgeschreven lenspomp moet aan het water in de hoofdlensleiding een snelheid van ten minste 122 m/min.
      kunnen geven. Een door het hoofdvoortstuwingswerktuig gedreven lenspomp moet dezelfde snelheid kunnen geven in de
      voor de ruimte voor machines voorgeschreven zuigpijp naar de lensflessen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel91
  - number: '92.1'
    text: |-
      Aan boord van een vaartuig met meer dan een ruim voor of achter de ruimte voor machines, moeten voorzieningen zijn
      getroffen, opdat een van deze ruimen niet door een daarin aanwezige lensaansluiting zal vollopen, indien de hierop
      aangesloten leiding, buiten dat ruim wordt beschadigd. Hiertoe moet in elke zuigleiding, binnen het ruim waarin
      zich het open zuigeinde bevindt, ter plaatse waar zij dat ruim binnentreedt, een terugslagklep of een vanaf een
      steeds toegankelijke plaats te bedienen afsluiter aanwezig zijn, indien deze leiding zich op enige plaats dichter
      bij het scheepsboord bevindt dan 20 percent van de breedte van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel92
  - number: '92.2'
    text: |-
      Lensleidingen die aan boord van een vaartuig in de dubbele bodem of in een kokerkiel zijn ondergebracht op een
      wijze die naar het oordeel van het Hoofd van de Scheepvaartinspectie beschadiging van die leidingen bij aan de
      grond lopen mogelijk maakt, moeten ter plaatse van het open zuigeinde zijn voorzien van een terugslagklep of van
      een afsluiter die vanaf een steeds toegankelijke plaats is te bedienen. Het Hoofd van de Scheepvaartinspectie kan
      een andere uitvoering toestaan die dezelfde veiligheid waarborgt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel92
  - number: '93.1'
    text: Maatregelen moeten worden getroffen om geluidhinder in ruimten voor machines te beperken tot aanvaardbare niveaus.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel93
  - number: '93.2'
    text: |-
      Indien de geluidhinder niet voldoende kan worden beperkt moeten de bronnen van het overmatige geluid doeltreffend
      worden geïsoleerd of afgezonderd, óf er moet voor een aparte geluidarme ruimte worden gezorgd indien de ruimte
      voor machines bemand moet zijn. Indien nodig moeten oorbeschermers worden verstrekt aan personeel dat deze ruimten
      moet betreden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel93
  - number: '93.3'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nadere regels geven ten aanzien van maatregelen in verband met
      bescherming tegen geluidhinder.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel93
  - number: '94.1'
    text: |-
      Elk vaartuig moet ten genoegen van het Hoofd van de Scheepvaartinspectie zijn voorzien van een hoofdstuurinrichting
      en van een hulpstuurinrichting. Deze inrichtingen moeten zodanig zijn, dat voor zover dit mogelijk en praktisch
      uitvoerbaar is, een enkelvoudige fout in een van de inrichtingen de ander niet buiten werking stelt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.2'
    text: |-
      De hoofdstuurinrichting moet voldoende sterk zijn gebouwd en geschikt zijn voor de besturing van het vaartuig bij
      maximum dienstsnelheid vooruit. De hoofdstuurinrichting, het roer en de roerkoning moeten zodanig zijn ontworpen,
      dat zij, ook bij maximum snelheid achteruit of bij het manoeuvreren tijdens het vissen, niet worden beschadigd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.3'
    text: |-
      Het vermogen en de uitvoering van de hoofdstuurinrichting moeten zodanig zijn dat het roer van 35 graden uitslag
      aan een zijde naar 35 graden uitslag aan de andere zijde kan worden bewogen wanneer het vaartuig zich bij maximum
      toelaatbare diepgang, met maximum dienstsnelheid vooruit beweegt. Het roer moet onder deze omstandigheden van 35
      graden uitslag aan één zijde in niet meer dan 28 seconden naar 30 graden uitslag aan de andere zijde kunnen worden
      bewogen. Zonodig dient de hoofdstuurinrichting werktuiglijk te kunnen worden bewogen teneinde aan deze eisen te
      voldoen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.4'
    text: |-
      Wanneer de hoofdstuurinrichting twee of meer gelijkwaardige krachtwerktuigen omvat, behoeft geen
      hulpstuurinrichting te zijn aangebracht indien de hoofdstuurinrichting geschikt is om het roer te bewegen
      overeenkomstig het bepaalde in het zesde lid, in het geval dat een van de krachtwerktuigen buiten bedrijf is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.5'
    text: |-
      De hulpstuurinrichting moet voldoende sterk zijn gebouwd en geschikt zijn voor de besturing van het vaartuig bij
      een snelheid, waarbij het nog manoeuvreerbaar is en voorts zijn ingericht om in noodgevallen snel in werking te
      kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.6'
    text: |-
      De hulpstuurinrichting moet geschikt zijn om het roer in niet meer dan 60 seconden van 15 graden uitslag aan
      een zijde te bewegen naar 15 graden uitslag aan de andere zijde, bij een snelheid vooruit welke maximaal of de
      helft van de maximum dienstsnelheid of 7 mijl per uur bedraagt, welke van de twee waarden het grootst is. Zonodig
      dient de hulpstuurinrichting werktuiglijk te kunnen worden bewogen teneinde aan deze eisen te voldoen. Indien
      een roerkoning met een middellijn ter plaatse van de helmstok van meer dan 230 mm is voorgeschreven moet de
      hulpstuurinrichting in ieder geval werktuiglijk kunnen worden bewogen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.7'
    text: |-
      De stand van het roer moet op de brug worden aangegeven indien het roer werktuiglijk wordt bewogen. De
      roerstandaanwijzing moet onafhankelijk zijn van het afstandbedieningssysteem.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.8'
    text: |-
      Aan boord van een vaartuig moet elk krachtwerktuig van een elektrische of elektrisch-hydraulische stuurinrichting
      rechtstreeks vanaf het hoofdschakelbord worden gevoegd. Eén van de stroomkringen mag vanaf het noodschakelbord
      worden gevoed. De stroomkringen moeten over hun gehele lengte zover als praktisch mogelijk is, van elkaar
      verwijderd zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.9'
    text: |-
      Elke stroomkring en elke motor moet zijn voorzien van een kortsluitbeveiliging en een overbelastingsalarm.
      Indien een overbelastingsbeveiliging is aangebracht moet deze niet lager zijn ingesteld dan tweemaal de nominale
      stroomsterkte van de motor of stroomkring en moet verder zodanig zijn uitgevoerd dat deze bij de gebruikelijke
      aanloopstroom niet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.10'
    text: |-
      Aan boord van elk vaartuig moet het in bedrijf zijn van de motoren van elektrische en elektrisch-hydraulische
      stuurinrichtingen op de brug worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.11'
    text: |-
      De krachtwerktuigen voor de hoofdstuurinrichting en de hulpstuurinrichting moeten zodanig zijn uitgevoerd dat zij
      automatisch weer in werking treden, zodra de energievoorziening, na te zijn uitgevallen, weer is hersteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.12'
    text: |-
      De krachtwerktuigen voor de hoofdstuurinrichting en de hulpstuurinrichting moeten op de brug in werking kunnen
      worden gesteld. Het uitvallen van de energievoorziening van enig krachtwerktuig moet op de brug door middel van een
      hoorbaar en zichtbaar alarm worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.13'
    text: De hoofdstuurinrichting moet op de brug kunnen worden bediend.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.14'
    text: |-
      Indien de hoofdstuurinrichting is uitgevoerd zoals aangegeven in het vierde lid moeten twee
      afstandbedieningssystemen aanwezig zijn, welke onafhankelijk van elkaar kunnen werken en vanaf de brug zijn
      te bedienen. Het is evenwel niet noodzakelijk dat elk systeem is voorzien van een afzonderlijk stuurwiel of
      stuurhandel.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.15'
    text: |-
      Indien de hulpstuurinrichting door een krachtwerktuig wordt aangedreven moet zij tevens zijn voorzien van
      een afstandbedieningssysteem dat op de brug kan worden bediend en dit systeem moet onafhankelijk zijn van het
      afstandbedieningssysteem voor de hoofdstuurinrichting.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.16'
    text: |-
      Elk afstandbedieningssysteem voor hoofdstuurinrichtingen en hulpstuurinrichtingen dat vanaf de brug kan worden
      bediend, moet aan de volgende eisen voldoen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: 94.16.1°
    text: |-
      indien elektrisch uitgevoerd moet het afstandbedieningssysteem worden gevoed door een afzonderlijk voor dit doel
      bestemde stroomkring, betrokken vanuit de voeding van een krachtwerktuig voor de stuurinrichting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: 94.16.2°
    text: |-
      het uitvallen van de elektrische voeding van een afstandbedieningssysteem moet op de brug door middel van alarmen
      worden aangegeven. Deze alarmen moeten zowel hoorbaar als zichtbaar zijn en moeten gemakkelijk kunnen worden
      waargenomen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: 94.16.3°
    text: de voeding voor de afstandbedieningssystemen mag uitsluitend tegen kortsluiting zijn beveiligd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '94.17'
    text: |-
      Indien voorzien is in een automatische stuurinrichting, dient deze te voldoen aan door het Hoofd van de
      Scheepvaartinspectie te stellen regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel94
  - number: '95'
    text: |-
      Aan boord van een vaartuig waarvan de lengte 75 m of meer bedraagt, moet een alarminstallatie zijn aangebracht die
      hetzij vanuit de machine-controlekamer, hetzij vanaf de manoeuvreerstand in werking moet kunnen worden gesteld en
      die duidelijk hoorbaar moet zijn in de verblijven welke zijn bestemd voor de werktuigkundigen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel95
  - number: '96.1'
    text: |-
      Koelinstallaties moeten ten genoegen van het Hoofd van de Scheepvaartinspectie zodanig zijn ontworpen,
      geconstrueerd, beproefd en geïnstalleerd, dat rekening is gehouden met de veiligheid in het bijzonder met het oog
      op mogelijk letsel dat personen kunnen oplopen ten gevolge van het gebruikte koelmedium.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel96
  - number: '96.2'
    text: |-
      Koelmedia voor het gebruik in koelinstallaties moeten ten genoegen van het Hoofd van de Scheepvaartinspectie zijn.
      Het gebruik van methylchloride als koelmedium is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel96
  - number: '96.3'
    text: |-
      Koelinstallaties moeten voldoende zijn beschermd tegen trillen, schokken, uitzetten, krimpen en dergelijke
      en moeten voorzien zijn van een automatische veiligheidsinrichting, waardoor een gevaarlijke stijging van de
      temperatuur en van de druk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel96
  - number: '96.3'
    text: |-
      Koelinstallaties waarin giftige of ontvlambare koelmedia worden gebruikt, moeten zijn voorzien van
      afvoerinrichtingen die uitmonden op een plaats waar het koelmedium geen gevaar oplevert.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel96
  - number: '96.4'
    text: |-
      Koelmachines, met inbegrip van koelers en gastanks, die giftige koelmedia gebruiken, moeten zijn ondergebracht
      in een afzonderlijke ruimte die door gasdichte schotten van aangrenzende ruimten is gescheiden. Deze ruimte moet
      zijn voorzien van een lekzoeksysteem met een aanwijsinstrument dat moet zijn aangebracht naast de ingang tot deze
      ruimte, een onafhankelijk ventilatiesysteem en een watersproei-installatie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel96
  - number: '96.4'
    text: |-
      Indien ten gevolge van de grootte van het vaartuig het praktisch niet uitvoerbaar is, dat een koelinstallatie als
      bedoeld in het derde lid, in een afzonderlijke ruimte wordt ondergebracht, mag de installatie worden geplaatst in
      de ruimte voor machines, mits de hoeveelheid gebruikt koelmedium in geval van ontsnapping van de totale hoeveelheid
      gas geen gevaar oplevert voor personen in de ruimte voor machines.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel96
  - number: '96.5'
    text: |-
      In ruimten voor koelmachines en in koel- en vriesruimten moet een installatie zijn aangebracht waarmee door
      personen die opgesloten raken op doelmatige plaatsen alarm kan worden gegeven. Ten minste één uitgang van een
      dergelijke ruimte moet van binnenuit geopend kunnen worden. Uitgangen van de ruimten waarin koelinstallaties zijn
      ondergebracht die giftig of ontvlambaar gas gebruiken dienen waar mogelijk niet rechtstreeks toegang te geven tot
      ruimten voor accommodatie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel96
  - number: '96.6'
    text: |-
      Wanneer in een koelinstallatie een giftig koelmedium wordt gebruikt, moeten ten minste twee persluchttoestellen
      aanwezig zijn, die te allen tijde bereikbaar zijn in geval koelmedium ontsnapt. Voor elke tot het toestel behorende
      luchtcilinder moet ten minste een reserve-cilinder met samengeperste lucht aanwezig zijn. Persluchttoestellen
      die deel uitmaken van de brandweeruitrusting van het vaartuig, kunnen hiertoe worden gebruikt, mits de plaatsing
      daarvan zodanig is dat aan beide doeleinden kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel96
  - number: '96.7'
    text: |-
      Ten behoeve van een veilige bedrijfsvoering en het optreden in noodsituaties moeten, met betrekking tot
      koelinstallaties, aan boord doelmatige richtlijnen duidelijk zichtbaar zijn opgehangen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel96
  - number: '97.1'
    text: |-
      Elektrische installaties moeten zijn ingericht volgens de voorschriften die dienaangaande worden gegeven door
      het desbetreffende klassebureau, voorzover in deze paragraaf geen afwijkende of aanvullende voorschriften worden
      gegeven. Voor niet geklasseerde vaartuigen worden gelijkwaardige eisen gesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel97
  - number: '97.2'
    text: |-
      Elektrische inrichtingen ten behoeve van liften die aan boord van vaartuigen worden opgesteld, moeten behalve
      aan de voorschriften van deze paragraaf en aan die van het desbetreffende klassebureau, ook voldoen aan de eisen
      gesteld door het particuliere bureau, bedoeld in artikel 192, vierde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel97
  - number: '97.3'
    text: |-
      In aanvulling op het bepaalde in deze paragraaf kunnen door het Hoofd van de Scheepvaartinspectie nadere regels
      voor elektrische installaties worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel97
  - number: '98'
    text: 'In aanvulling op het bepaalde in artikel 2, eerste lid, wordt voor de toepassing van deze paragraaf verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel98
  - number: 98.1°
    text: '**elektrische machines:** generatoren, motoren en omvormers;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel98
  - number: 98.2°
    text: '**spanning:** nominale spanning waarbij de elektrische energie onder normale omstandigheden wordt verbruikt; en'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel98
  - number: 98.3°
    text: |-
      **vochtige ruimten:** ruimten waarin vocht het behouden van een normale isolatietoestand bemoeilijkt of de
      elektrische weerstand van de daarin vertoevende personen belangrijk vermindert.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel98
  - number: '99.1'
    text: 'Bij gelijkstroom mag de spanning ten hoogste bedragen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.1.1°
    text: 250 V voor alle doeleinden, met uitzondering van het bepaalde in artikel 132, tweede lid; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.1.2°
    text: |-
      500 V voor de vast aangebrachte krachtinstallatie onder door het Hoofd van de Scheepvaartinspectie te stellen
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: '99.2'
    text: 'Bij wisselstroom mag de spanning ten hoogste bedragen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.1°
    text: '250 V voor:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.1°.1.1
    text: de vast aangebrachte verlichting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.1°.1.2
    text: de vast aangebrachte telecommunicatie-toestellen voor het intern gebruik;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.1°.1.3
    text: |-
      de vast aangebrachte krachtinstallatie en de verwarmingstoestellen in hutten en verblijven, geen ruimten voor
      algemeen gebruik zijnde;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.1°.1.4
    text: contactdozen bestemd voor het aansluiten van navigatielantaarns;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.1°.1.5
    text: contactdozen in ruimten voor accommodatie, ruimten voor algemeen gebruik en controlestations;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.1°.1.6
    text: |-
      contactdozen bestemd voor het aansluiten van scheerapparaten in badkamers en doucheruimten, mits voorzien van een
      speciaal voor dit doel aangepaste beschermingstransformator; contactdozen voor andere bestemmingen mogen in die
      ruimten niet zijn aangebracht; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.1°.1.7
    text: |-
      contactdozen in vochtige ruimten of aan dek, bestemd voor het aansluiten van handgereedschappen, ruim- of
      looplampen en dergelijke, met uitzondering van die bedoeld onder 2, onder de voorwaarden dat:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.1°.1.7.1.7.1
    text: |-
      deze spanning voor elke contactdoos afzonderlijk wordt verkregen van een bij deze contactdoos vast aangebrachte
      beschermingstransformator; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.1°.1.7.1.7.2
    text: de op de contactdozen aan te sluiten toestellen dubbel geïsoleerd zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.2°
    text: '55 V, mits deze spanning wordt verkregen van een omvormer of beschermingstransformator; voor:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.2°.2.1
    text: de onder 1.7 bedoelde contactdozen welke niet voldoen aan de daarin onder 1.7.1 en 1.7.2 genoemde voorwaarden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.2°.2.2
    text: |-
      contactdozen ten behoeve van werkzaamheden in nauwe ruimten zoals ketels, tanks en dergelijke en in het algemeen
      op plaatsen waar naar het oordeel van het Hoofd van de Scheepvaartinspectie bijzondere veiligheidsvoorzorgen nodig
      zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.3°
    text: '660 V voor:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.3°.3.1
    text: de vast aangebrachte krachtinstallatie en verwarmingstoestellen, andere dan die bedoeld onder 1; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: 99.2.3°.3.2
    text: |-
      contactdozen op aansluitkasten voor verplaatsbare werktuigen en toestellen die bij het gebruik niet in de hand
      worden genomen, een en ander onder de door het Hoofd van de Scheepvaartinspectie te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: '99.3'
    text: |-
      Het bepaalde in de voorgaande leden van dit artikel geldt niet voor voortstuwingsinstallaties en voor installaties
      waarbij een hogere spanning noodzakelijk is, onder voorwaarde dat zodanige voorzieningen zijn getroffen dat de
      veiligheid naar het oordeel van het Hoofd van de Scheepvaartinspectie op overeenkomstige wijze is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel99
  - number: '100.1'
    text: |-
      Het voor de elektrische installatie gebruikte materiaal benevens de wijze van aanleggen van de installatie moeten
      onder alle omstandigheden een voldoende veiligheid en bedrijfszekerheid waarborgen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel100
  - number: '100.2'
    text: |-
      Installaties moeten zodanig zijn ingericht en opgesteld, dat zij onder normale bedrijfsomstandigheden niet zijn
      blootgesteld aan gevaar van beschadiging van buitenaf en geen zodanig hoge temperatuur kunnen bereiken, dat de
      goede werking wordt geschaad. Zonodig moeten ruimten waarin elektrische installaties zijn ondergebracht, van een
      doeltreffende ventilatie-inrichting zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel100
  - number: '100.3'
    text: |-
      Installaties moeten zowel in het geheel als in onderdelen zodanig zijn ingericht en opgesteld, dat het optreden van
      brand en van stroomovergang op personen, zowel bij het gebruik en de bediening als bij herstellings-, onderhouds-,
      meet- en controlewerkzaamheden, zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel100
  - number: '100.4'
    text: |-
      Elektrische machines, schakel- en verdeelinrichtingen en toestellen mogen, voorzover zij niet doelmatig beschermd
      zijn uitgevoerd, zich niet in de nabijheid van openingen van peilpijpen voor brandstoftanks bevinden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel100
  - number: '101.1'
    text: |-
      De inrichting en de opstelling van elektrische machines, elektronische apparatuur, transformatoren en
      accumulatoren, zomede de keuze en het systeem van aanleg van leidingen moeten zodanig zijn, dat de goede werking
      van magnetische kompassen, chronometers en elektrische en elektronische instrumenten onderling is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel101
  - number: '101.1'
    text: |-
      Ter voorkoming van storing in de elektronische navigatie- en communicatie-apparatuur door de elektrische
      installatie van het vaartuig en de hierop aangesloten elektrische uitrustingen, moeten alle maatregelen zijn
      genomen om deze storingen te onderdrukken of op te heffen. Hiertoe dient aandacht te worden besteed, in het
      bijzonder in de direkte omgeving van apparatuur, aan de toepassing en aanleg van elektrische leidingen met
      afscherming en de aarding hiervan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel101
  - number: '101.1'
    text: |-
      Ter voorkoming van storing in de elektrische en elektronische installaties van het vaartuig ten gevolge van
      elektromagnetische velden die door de zendinstallaties aan boord worden opgewekt, moeten de elektrische en
      elektronische installaties van het vaartuig zodanig zijn ingericht en opgesteld dat de goede werking ervan niet
      wordt geschaad door de in die installaties en in de leidingen geïnduceerde hoogfrequente spanningen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel101
  - number: '101.2'
    text: |-
      Om aan de in het eerste lid gestelde eisen te voldoen zal in het ontwerp van een vaartuig bijzondere aandacht
      moeten worden besteed aan de noodzakelijke voorzieningen ter voorkoming van wederzijdse storingen in en op
      navigatie en communicatie-apparatuur en de installatie van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel101
  - number: '102.1'
    text: |-
      Elk vaartuig waarvoor elektrische energie het enig middel vormt tot het onderhouden van de voor de voortstuwing en
      de veiligheid van het vaartuig onontbeerlijke hulpdiensten, moet van een elektrische hoofdkrachtbron zijn voorzien.
      Deze hoofdkrachtbron moet ten minste bestaan uit twee generatoraggregaten, waarbij een van de generatoren door het
      hoofdvoortstuwingswerktuig mag worden aangedreven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel102
  - number: '102.2'
    text: |-
      Het vermogen van de generatoren, bedoeld in het voorgaande lid, moet zodanig zijn dat, met uitzondering van het
      vermogen dat benodigd is voor het vissen, de verwerking en het conserveren van de vangst, de goede werking van
      de diensten, bedoeld in artikel 74, elfde lid, onder 1, wordt verzekerd, indien een generatoraggregaat buiten
      bedrijf is geraakt. Voor vaartuigen waarvan de lengte minder dan 45 m bedraagt, behoeven bij het in ongerede raken
      van een van de generatoraggregaten slechts de noodzakelijke hulpdiensten voor de voortstuwing, de besturing en de
      veiligheid van het vaartuig te zijn gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel102
  - number: '102.3'
    text: |-
      Indien de elektrische energievoorziening in de regel door meer dan één generator in parallelbedrijf wordt verzorgd,
      moeten voorzieningen zijn getroffen, zoals door middel van het afschakelen van minder belangrijke groepen, teneinde
      te waarborgen dat in het geval één van deze generatoren uitvalt, de overige generatoren in dienst blijven zonder
      dat overbelasting optreedt, teneinde de voortstuwing en de besturing van het vaartuig te kunnen behouden en de
      veiligheid van het vaartuig te waarborgen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel102
  - number: '102.4'
    text: |-
      De elektrische hoofdkrachtbron van het vaartuig moet zodanig zijn ingericht dat de diensten genoemd in
      artikel 74, elfde lid, onder 1, kunnen worden gehandhaafd, ongeacht het toerental en de draairichting van het
      voortstuwingswerktuig of de schroefas.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel102
  - number: '102.5'
    text: |-
      Indien transformatoren een essentieel onderdeel vormen van de volgens deze paragraaf vereiste stroomvoorziening,
      moeten deze zodanig zijn ingericht dat dezelfde continuïteit van de stroomvoorziening bedoeld in het tweede lid,
      verzekerd is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel102
  - number: '102.6'
    text: |-
      De elektrische hoofdverlichtingsinstallatie moet zodanig zijn ingericht dat een brand of ander ongeval in de ruimte
      of ruimten waarin de elektrische hoofdkrachtbron, inclusief eventuele transformatoren, het hoofdschakelbord en het
      hoofdverlichtingsschakelbord zijn opgesteld, niet de noodverlichtingsinstallatie als vereist in de artikelen 112,
      tweede lid, en 113, tweede lid, buiten werking stelt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel102
  - number: '102.7'
    text: |-
      De noodverlichtingsinstallatie moet zodanig zijn ingericht dat een brand of ander ongeval in de ruimte of
      ruimten waarin de elektrische noodkrachtbron, inclusief eventuele transformatoren, het noodschakelbord en het
      noodverlichtingsschakelbord is opgesteld, niet de hoofdverlichtingsinstallatie buiten werking stelt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel102
  - number: '103.1'
    text: |-
      De elektrische installatie voor de in artikel 205, tweede lid, bedoelde navigatielantaarns moet aan de volgende
      eisen voldoen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel103
  - number: 103.1.1°
    text: |-
      de top-, boord- en heklantaarns moeten zijn aangesloten op een speciaal voor dit doel bestemde verdeelinrichting
      geplaatst in het stuurhuis of in de kaartenkamer. Deze verdeelinrichting moet rechtstreeks dan wel via
      transformatoren door het hoofdschakelbord worden gevoed. De voeding voor deze verdeelinrichting mag ook
      worden betrokken van een verdeelbord mits dit verdeelbord rechtstreeks dan wel via transformatoren door het
      hoofdschakelbord wordt gevoed en geplaatst is in het stuurhuis of in de kaartenkamer;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel103
  - number: 103.1.2°
    text: |-
      de reserve top-, boord- en heklantaarns moeten zijn aangesloten op een speciaal voor dit doel bestemde
      verdeelinrichting geplaatst in het stuurhuis of in de kaartenkamer. Deze verdeelinrichting moet rechtstreeks
      danwel via transformatoren door het noodschakelbord worden gevoed. De voeding voor deze verdeelinrichting mag
      ook worden betrokken van een verdeelbord mits dit verdeelbord rechtstreeks dan wel via transformatoren door het
      noodschakelbord wordt gevoed en geplaatst is in het stuurhuis of in de kaartenkamer;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel103
  - number: 103.1.3°
    text: |-
      de onder 1 en 2 genoemde navigatie- en reserve navigatielantaarns mogen ook op een voor dit doel gecombineerde
      verdeelinrichting worden aangesloten. Deze verdeelinrichting moet zowel door het hoofdschakelbord als door
      het noodschakelbord kunnen worden gevoed met inachtneming van de eisen ten aanzien van de voeding van deze
      verdeelinrichting zoals gesteld in 1 en 2;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel103
  - number: 103.1.4°
    text: |-
      in het geval dat volgens artikel 285, tweede lid, de reserve navigatielantaarns niet zijn vereist, moet de
      installatie voor de top-, boord- en heklantaarns voldoen aan het bepaalde onder 1 met dien verstande dat de
      verdeelinrichting eveneens rechtstreeks dan wel via transformatoren door het noodschakelbord moet kunnen worden
      gevoed. Deze noodvoeding mag ook worden betrokken van een verdeelbord mits dit verdeelbord rechtstreeks dan wel via
      transformatoren door het noodschakelbord wordt gevoed en geplaatst is in het stuurhuis of in de kaartenkamer;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel103
  - number: 103.1.5°
    text: |-
      de top-, boord- en heklantaarns en indien vereist de reserve top-, boord- en heklantaarns moeten elk via een
      afzonderlijke leiding op de in 1 en 4 genoemde verdeelinrichting(en) zijn aangesloten. Alle stroomkringen moeten
      van smeltveiligheden en van schakelaars zijn voorzien. In plaats van smeltveiligheden en schakelaars mogen
      automatische schakelaars met kortsluit- en overbelastingsbeveiliging worden toegepast; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel103
  - number: 103.1.6°
    text: |-
      voor ieder van de top-, boord- en heklantaarns en indien vereist de reserve top-, boord- en heklantaarns, moet een
      doeltreffende controle-inrichting aanwezig zijn die waarschuwt in geval van doven van het licht. Bij toepassing
      van een optische inrichting in serie met het licht, mag defect raken van deze inrichting niet kunnen leiden tot het
      doven van het licht. Genoemde controle-inrichtingen zijn niet vereist op een vaartuig waarvan de lengte minder dan
      24 m bedraagt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel103
  - number: '103.2'
    text: |-
      Alle overige in de van kracht zijnde bepalingen ter voorkoming van aanvaringen op zee genoemde navigatielantaarns
      moeten door de noodkrachtbron kunnen worden gevoed. Deze navigatielantaarns mogen op de in het eerste lid
      genoemde verdeelinrichting(en) van de top-, boord- en heklantaarns zijn aangesloten, mits alle stroomkringen van
      smeltveiligheden en schakelaars zijn voorzien. In plaats van smeltveiligheden en schakelaars mogen automatische
      schakelaars met kortsluit- en overbelastingsbeveiliging worden toegepast.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel103
  - number: '103.3'
    text: |-
      Een elektrische installatie ten behoeve van middelen voor het geven van geluidsseinen aan boord van een vaartuig,
      dient te kunnen worden gevoed door de noodkrachtbron.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel103
  - number: '104.1'
    text: |-
      In alle ruimten waar brandbare gasmengsels zich zouden kunnen verzamelen, in elke afgescheiden ruimte voornamelijk
      bestemd voor accumulatoren, in verfhutten, opslagplaatsen voor acetyleen of soortgelijke ruimten, mogen geen
      elektrische inrichtingen zijn aangebracht tenzij het Hoofd van de Scheepvaartinspectie van oordeel is dat deze:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel104
  - number: 104.1.1°
    text: noodzakelijk zijn vanwege bedrijfstechnische redenen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel104
  - number: 104.1.2°
    text: van een soort zijn die het betreffende mengsel niet kan ontsteken;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel104
  - number: 104.1.3°
    text: geschikt zijn voor de betreffende ruimte; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel104
  - number: 104.1.4°
    text: van een goedgekeurd explosieveilig type zijn voor gebruik daar waar stof, dampen of gassen aanwezig kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel104
  - number: '104.2'
    text: |-
      Indien kabels aangebracht in gevaarlijke ruimten, aanleiding zouden geven tot brand- en explosiegevaar bij een
      elektrische fout in die ruimte, moeten ten genoegen van het Hoofd van de Scheepvaartinspectie voorzorgsmaatregelen
      tegen deze gevaren zijn genomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel104
  - number: '104.3'
    text: |-
      Schakelaars en beveiligingstoestellen ten behoeve van installaties in ruimten met explosiegevaar moeten alpolig
      verbreken en mogen niet in die ruimte zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel104
  - number: '104.4'
    text: |-
      Voor tijdelijke verlichting van de in het eerste lid bedoelde ruimten mag slechts gebruik worden gemaakt van
      draagbare lampen die voldoen aan de eisen gesteld in artikel 105.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel104
  - number: '105'
    text: |-
      Een elektrische veiligheidslamp die bestemd is te worden gebruikt voor tijdelijke verlichting van gevaarlijke
      ruimten als bedoeld in artikel 104, eerste lid, moet van een goedgekeurd type zijn en moet:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel105
  - number: 105.1°
    text: draagbaar zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel105
  - number: 105.2°
    text: |-
      een eigen stroombron hebben, bestaande uit droge elementen of accumulatoren met een totale spanning van ten hoogste
      6 V;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel105
  - number: 105.3°
    text: een brandduur hebben van ten minste drie achtereenvolgende uren; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel105
  - number: 105.4°
    text: |-
      zodanig zijn uitgevoerd, dat zij geen aanleiding kan geven tot ontsteking van een ontvlambaar mengsel van
      koolwaterstoffen en lucht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel105
  - number: '106.1'
    text: 'Elektrisch gedreven dekwerktuigen moeten zodanig zijn ingericht dat:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel106
  - number: 106.1.1°
    text: het inschakelen van de aandrijfmotor alleen vanuit de ruststand van de bedieningsorganen kan geschieden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel106
  - number: 106.1.2°
    text: |-
      bij het wegvallen van de netspanning of bij het onderbreken van de stroomtoevoer naar de aandrijfmotor de rem
      automatisch in werking treedt en de last vasthoudt. Deze bepaling geldt niet voor dekwerktuigen waarbij voor het
      vieren van de last de rem met de hand moet worden gelicht; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel106
  - number: 106.1.3°
    text: |-
      bij toepassing van hulpstroom, het ontstaan van een aardsluiting in de hulpstroomketen niet tot het in gang komen
      of blijven van de aandrijfmotor of het lichten of gelicht blijven van de rem van het lierwerk kan leiden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel106
  - number: '106.2'
    text: |-
      Nabij de bedieningshandel van elektrisch gedreven dekwerktuigen moet de stand van de handel bij hieuwen en vieren
      op duidelijke en duurzame wijze zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel106
  - number: '106.3'
    text: |-
      Nabij de plaats waar het werktuig wordt bediend, moet een schakelaar of hulpschakelaar zijn aangebracht, waarmede
      de stroomtoevoer naar de aandrijfmotor of naar de motor van het voedingsaggregaat onafhankelijk van de stand van de
      bedieningsinrichting van de motor kan worden uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel106
  - number: '107'
    text: Het Hoofd van de Scheepvaartinspectie kan nadere regels geven betreffende de uitvoering van vislieren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel107
  - number: '108.1'
    text: |-
      Bij toepassing van een elektrisch gedreven noodbrandbluspomp als bedoeld in artikel 154, vierde lid, onder 3, moet
      de voeding geleverd worden door een onafhankelijke generator van voldoende capaciteit, die op een veilige plaats
      buiten de ruimte voor machines en bij voorkeur boven het werkdek is opgesteld. Deze generator mag de noodgenerator
      als bedoeld in artikel 112 zijn, mits deze van voldoende capaciteit is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel108
  - number: '108.2'
    text: |-
      De pompmotor en de voedingskabels, de starter en eventuele voorzieningen voor afstandbediening met de daarbij
      behorende elektrische leidingen moeten geheel buiten de ruimten zijn aangebracht waar een brand alle overige
      brandbluspompen buiten werking zou kunnen stellen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel108
  - number: '108.3'
    text: |-
      Voor het bepalen van de plaats waar de pompmotor in werking moet kunnen worden gesteld moet rekening worden
      gehouden met het bepaalde in artikel 154, vierde lid, onder 4.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel108
  - number: '109.1'
    text: 'Aan boord van een vaartuig moeten de elektromotoren voor:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel109
  - number: 109.1.1°
    text: |-
      kunstmatige ventilatie van ruimten voor accommodatie, dienstruimten, controlestations en ruimten voor machines
      voldoen aan het bepaalde in artikel 146, derde lid, of artikel 171, eerste lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel109
  - number: 109.1.2°
    text: kunstmatige ventilatie van ladingruimten buiten deze ruimten kunnen worden gestopt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel109
  - number: 109.1.3°
    text: |-
      geforceerde trek vanaf een plaats buiten de ruimte waar de ketel is of waar de ketels zijn opgesteld, en buiten een
      ruimte voor machines van categorie A kunnen worden gestopt; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel109
  - number: 109.1.4°
    text: |-
      brandstoftrimpompen, pompen van oliestookinrichtingen en dergelijke brandstofpompen voldoen aan het gestelde in
      artikel 148, achtste lid of artikel 173, zevende lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel109
  - number: '109.2'
    text: |-
      Aan boord van een vaartuig moeten elektrisch gedreven dekwerktuigen zijn voorzien van een noodstopinrichting als
      bedoeld in artikel 106, derde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel109
  - number: '109.3'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nadere regels geven voor noodstopinrichtingen van centrale
      verwarmingsinstallaties.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel109
  - number: '109.4'
    text: Het Hoofd van de Scheepvaartinspectie kan nadere regels geven voor noodstopinrichtingen van vislieren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel109
  - number: '110.1'
    text: |-
      Aan boord van een vaartuig voorzien van elektrische aanzetinrichtingen ten behoeve van de voortstuwingsmotor of
      -motoren, moet aan het volgende zijn voldaan:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel110
  - number: 110.1.1°
    text: |-
      bij aanwezigheid van één voortstuwingsmotor moet voor deze motor een startbatterij van zodanige capaciteit zijn
      aangebracht, dat de motor in koude toestand ten minste zesmaal kan worden aangezet. Het laden van deze batterij
      moet kunnen geschieden door twee laadinrichtingen die niet van hetzelfde werktuig afhankelijk mogen zijn. Bovendien
      moet een tweede batterij van ten minste dezelfde capaciteit aanwezig zijn waarmee de voortstuwingsmotor kan worden
      gestart. In plaats van de bovengenoemde tweede batterij mag een accumulatorenbatterij die dienst doet voor de
      verlichting of de noodverlichting van het vaartuig, voor het starten worden gebezigd mits deze, behalve voor de
      verlichting of de noodverlichting de energie voor zesmaal starten van de motor in koude toestand kan leveren; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel110
  - number: 110.1.2°
    text: |-
      bij aanwezigheid van twee of meer voortstuwingsmotoren moeten de elektrische aanzetinrichtingen aan het onder 1
      gestelde voldoen, echter met dien verstande dat elke voortstuwingsmotor op beide batterijen moet kunnen worden
      gestart.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel110
  - number: '110.2'
    text: |-
      Indien voortstuwingsmotoren alleen van een elektrische aanzetinrichting zijn voorzien, moet voor de
      startinstallatie een complete startmotor als reserve aan boord aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel110
  - number: '111.1'
    text: |-
      De doeltreffende rechtstreekse spreekverbinding als bedoeld in de artikelen 81, vierde lid, en 135, moet van het
      scheepsnet onafhankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel111
  - number: '111.2'
    text: |-
      Indien een centrale telefooninstallatie of gelijkwaardig spreeksysteem wordt toegepast, dienen de brug, de
      machinekamer en de verblijven van de kapitein en de hoofdwerktuigkundige te zijn voorzien van toestellen die door
      middel van een voorkeurschakeling een directe onderlinge verbinding mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel111
  - number: '112.1'
    text: |-
      Aan boord van een vaartuig waarvan de lengte 45 m of meer bedraagt moet zijn voorzien in een onafhankelijk werkende
      elektrische noodkrachtbron.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: '112.1'
    text: |-
      De elektrische noodkrachtbron, inclusief eventuele transformatoren, de tijdelijke elektrische noodkrachtbron,
      het noodschakelbord en het noodverlichtingsschakelbord moeten boven het bovenste doorlopende dek zijn opgesteld.
      Zij mogen niet voor het aanvaringsschot zijn geplaatst, echter in bijzondere gevallen kan door het Hoofd van de
      Scheepvaartinspectie ontheffing worden verleend.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: '112.1'
    text: |-
      De elektrische noodkrachtbron, inclusief eventuele transformatoren, de tijdelijke elektrische noodkrachtbron,
      het noodschakelbord en het noodverlichtingsschakelbord, moeten ten opzichte van de elektrische hoofdkrachtbron,
      inclusief eventuele transformatoren en het hoofdschakelbord zodanig zijn opgesteld dat de voeding, de bediening
      en de verdeling van de elektrische energie van de noodkrachtbron niet kunnen worden beïnvloed door een brand
      of ander ongeval in de ruimte waar de elektrische hoofdkrachtbron, inclusief eventuele transformatoren en het
      hoofdschakelbord zijn opgesteld of in een ruimte voor machines van categorie A, zulks ten genoegen van het Hoofd
      van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: '112.2'
    text: |-
      Het beschikbare elektrische vermogen moet voldoende zijn om de stroom te kunnen leveren aan al die diensten welke
      in geval van nood belangrijk zijn voor de veiligheid, waarbij rekening moet worden gehouden met die diensten die
      gelijktijdig in bedrijf moeten kunnen zijn. De elektrische noodkrachtbron moet in staat zijn om, rekening houdend
      met startstromen en inschakelverschijnselen van bepaalde verbruikers, gelijktijdig, gedurende de hierna aangegeven
      tijd, de stroom te kunnen leveren aan ten minste de volgende diensten, voor zover deze voor hun werking afhankelijk
      zijn van een elektrische krachtbron:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.1°
    text: |-
      gedurende 3 uur de noodverlichting bij elke verzamelplaats en, zowel aan dek als buitenboord, bij elke
      inschepingsplaats waar de groepsreddingmiddelen zijn opgesteld, als voorgeschreven ingevolge het bepaalde in de
      artikelen 202, vierde lid, en 206, zevende lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.2°
    text: gedurende 6 uur de noodverlichting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.2°.2.1
    text: |-
      in alle dienst- en accommodatiegangen, bij alle trappen en uitgangen, en in liftkooien en schachten van liften met
      betreedbare kooi;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.2°.2.2
    text: in ruimten voor machines en hoofdgeneratorstations, inclusief hun bedieningsplaatsen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.2°.2.3
    text: in alle controlestations, machine-controlekamers en bij elk hoofd- en noodschakelbord;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.2°.2.4
    text: bij alle bergplaatsen van brandweeruitrustingen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.2°.2.5
    text: bij de stuurinrichting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.2°.2.6
    text: |-
      bij de noodbrandbluspomp, indien aanwezig, bij de sprinklerpomp, indien aanwezig, en op de plaatsen waar de bij die
      pompen behorende motoren kunnen worden ingeschakeld;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.2°.2.7
    text: bij magnetische kompassen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.2°.2.8
    text: bij peilglazen van stoomketels;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.2°.2.9
    text: in kombuizen, eetzalen en andere ruimten voor algemeen gebruik;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.2°.2.10
    text: bij de centrale bedieningsplaatsen van vast aangebrachte brandblusinstallaties; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.2°.2.11
    text: in de ruimten waar de vis wordt behandeld en verwerkt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.3°
    text: |-
      gedurende 6 uur de navigatielichten en andere lichten vereist volgens de van kracht zijnde bepalingen ter
      voorkoming van aanvaringen op zee;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.4°
    text: 'gedurende 6 uur:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.4°.4.1
    text: |-
      alle interne communicatiemiddelen welke in geval van nood noodzakelijk zijn, zoals de rechtstreekse
      spreekverbindingen, bedoeld in artikel 81, vierde lid, en artikel 135 en het nood-communicatiesysteem indien dit
      vast is aangebracht, bedoeld in artikel 239, eerste lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.4°.4.2
    text: de brandontdekkings- en brandalarminstallatie;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.4°.4.3
    text: |-
      het intermitterend gebruik van de dagseinlamp, de middelen tot het geven van geluidsseinen indien elektrisch
      uitgevoerd of elektrisch te bedienen en alle interne signaleringen welke in geval van nood zijn vereist; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.4°.4.4
    text: |-
      de algemeen alarminstallatie en de omroepinstallatie, bedoeld in artikel 239, tweede lid, de alarminstallatie voor
      de vast aangebrachte brandblusinstallatie met gas als blusstof en de alarminstallatie van liften met betreedbare
      kooi, tenzij deze diensten worden gevoed door een onafhankelijke stroombron bestaande uit een accumulatorenbatterij
      van voldoende capaciteit voor een periode van 6 uur, opgesteld op een voor noodgebruik geschikte plaats;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.2.5°
    text: |-
      gedurende 3 uur de noodbrandbluspomp als bedoeld in artikel 108, eerste lid, indien de elektrische krachtbron
      hiervoor afhankelijk is van de noodgenerator.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: '112.3'
    text: |-
      De elektrische noodkrachtbron mag hetzij een generator hetzij een accumulatorenbatterij zijn, die aan de volgende
      voorwaarden moet voldoen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.3.1°
    text: 'indien de elektrische noodkrachtbron een generator is, dan moet deze:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.3.1°.1.1
    text: |-
      aangedreven worden door een daartoe geschikte werktuiglijke inrichting, voorzien van een onafhankelijke
      brandstofvoeding en van een goedgekeurd aanzetsysteem en waarbij het vlampunt van de te gebruiken brandstof niet
      lager is dan 43°C;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.3.1°.1.2
    text: |-
      automatisch starten bij het uitvallen van de elektrische voeding, vanaf de elektrische hoofdkrachtbron, tenzij is
      voorzien in een tijdelijke noodkrachtbron als bedoeld onder 1.3. Indien de noodgenerator automatisch wordt gestart
      moet deze automatisch op het noodschakelbord worden geschakeld. De diensten welke genoemd zijn in het vierde lid
      moeten dan automatisch op de noodgenerator worden geschakeld. Tenzij in een tweede onafhankelijke aanzetinrichting
      voor de noodgenerator is voorzien, moet de enige bron met geaccumuleerde energie worden beveiligd tegen volledige
      uitputting door de automatische aanzetinrichting; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.3.1°.1.3
    text: |-
      voorzien zijn van een tijdelijke elektrische noodkrachtbron zoals omschreven in het vierde lid tenzij er een
      noodgenerator aanwezig is die in staat is om de stroom te leveren voor de in dat artikel genoemde diensten en in
      staat is om automatisch te starten en zo snel als veilig en praktisch mogelijk is de benodigde stroom te leveren,
      zulks echter binnen ten hoogste 45 seconden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.3.2°
    text: 'indien de elektrische noodkrachtbron een accumulatorenbatterij is, moet deze in staat zijn:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.3.2°.2.1
    text: |-
      zonder wederoplading de noodbelasting op te nemen, waarbij gedurende de gehele ontlaadperiode de spanning van de
      accumulatorenbatterij binnen 12 percent boven of onder zijn nominale spanning blijft;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.3.2°.2.2
    text: automatisch op het noodschakelbord te schakelen bij uitvallen van de elektrische hoofdvoeding; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.3.2°.2.3
    text: onmiddellijk de stroom te leveren aan ten minste de in het vierde lid genoemde diensten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: '112.4'
    text: |-
      De tijdelijke elektrische noodkrachtbron, indien vereist volgens het derde lid, onder 1.3, dient te bestaan uit
      een accumulatorenbatterij, opgesteld op een voor noodgebruik geschikte plaats, van voldoende capaciteit om zonder
      wederopladen te kunnen werken, waarbij gedurende de gehele ontlaadperiode de spanning binnen 12 percent boven of
      onder zijn nominale spanning blijft, en zodanig ingericht dat bij uitvallen van hetzij de elektrische hoofd- hetzij
      de elektrische noodkrachtbron automatisch ten minste de volgende diensten gedurende een half uur van stroom worden
      voorzien, voor zover deze voor hun werking afhankelijk zijn van een elektrische krachtbron:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.4.1°
    text: |-
      de verlichting vereist volgens het tweede lid, onder 1 tot en met 3. Voor de overgangsfase mag ten aanzien van de
      vereiste elektrische noodverlichting in ruimten voor machines, in ruimten voor accommodatie en in dienstruimten
      gebruik worden gemaakt van vast aangebrachte, afzonderlijke, automatische ladende, relais bediende verlichting die
      wordt gevoed door een accumulator; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: 112.4.2°
    text: |-
      alle diensten vereist volgens het tweede lid, onder 4.1 tot en met 4.4, tenzij deze diensten onafhankelijk worden
      gevoed door een accumulatorenbatterij met een capaciteit voor de aangegeven tijdsduur, opgesteld op een voor
      noodgebruik geschikte plaats.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: '112.5'
    text: Het noodschakelbord moet zo dicht als praktisch mogelijk bij de elektrische noodkrachtbron zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: '112.5'
    text: |-
      Indien de elektrische noodkrachtbron een generator is, moet het noodschakelbord in dezelfde ruimte zijn opgesteld
      tenzij de werking daardoor nadelig zou worden beïnvloed.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: '112.5'
    text: |-
      Accumulatorenbatterijen die ingevolge dit artikel aanwezig moeten zijn, mogen niet met het noodschakelbord
      in dezelfde ruimte zijn geplaatst. Op een daartoe geschikte plaats op het hoofdschakelbord of in de machine-
      controlekamer moet een aanwijsinrichting zijn aangebracht die aangeeft wanneer de accumulatoren-batterijen, zijnde
      de elektrische noodkrachtbron of de tijdelijke elektrische noodkrachtbron als bedoeld in het derde lid onder 2, of
      het vierde lid, in ontlading zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: '112.5'
    text: |-
      Het noodschakelbord moet bij normaal bedrijf via een koppelkabel die in het hoofdschakelbord doelmatig tegen
      overbelasting en kortsluiting moet zijn beveiligd, worden gevoed vanaf het hoofdschakelbord en automatisch
      worden ontkoppeld op het noodschakelbord bij het uitvallen van de elektrische hoofdvoeding. Indien het systeem is
      ingericht voor een bedrijf met terugvoedmogelijkheid, dan moet de koppelkabel ook in het noodschakelbord tegen ten
      minste kortsluiting zijn beveiligd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: '112.6'
    text: |-
      De noodgenerator en zijn aandrijvend werktuig, en elke noodaccumulatorenbatterij moeten zodanig zijn ingericht
      en opgesteld dat hun goede werking bij hun nominaal vermogen is verzekerd bij rechtliggend vaartuig en bij elke
      slagzijhoek tot 22½ graad of bij een trimhoek voor- of achterover tot 10 graden of bij enige combinatie van
      hellinghoeken binnen genoemde grenzen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: '112.7'
    text: |-
      Voorzieningen moeten zijn aangebracht voor het periodiek testen van de gehele noodinstallatie inclusief het testen
      van de automatische aanzetinrichting.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel112
  - number: '113.1'
    text: |-
      Aan boord van een vaartuig waarvan de lengte minder dan 45 m bedraagt moet zijn voorzien in een onafhankelijk
      werkende elektrische noodkrachtbron.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: '113.1'
    text: |-
      De elektrische noodkrachtbron, inclusief eventuele transformatoren, het noodschakelbord en het
      noodverlichtingsschakelbord moeten ten opzichte van de elektrische hoofdkrachtbron, inclusief eventuele
      transformatoren en het hoofdschakelbord zodanig zijn opgesteld dat de voeding, de bediening en de verdeling van de
      elektrische energie van de noodkrachtbron niet kunnen worden beïnvloed door een brand of ander ongeval in de ruimte
      waar de elektrische hoofdkrachtbron, inclusief eventuele transformatoren en het hoofdschakelbord zijn opgesteld of
      in een ruimte voor machines van categorie A, zulks ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: '113.2'
    text: |-
      Het beschikbare elektrische vermogen moet voldoende zijn om de stroom te kunnen leveren aan al die diensten welke
      in geval van nood belangrijk zijn voor de veiligheid, waarbij rekening moet worden gehouden met die diensten die
      gelijktijdig in bedrijf moeten kunnen zijn. De elektrische noodkrachtbron moet in staat zijn om, rekening houdend
      met startstromen en inschakelverschijnselen van bepaalde verbruikers, gelijktijdig, gedurende de hierna aangegeven
      tijd, de stroom te kunnen leveren aan ten minste de volgende diensten, voor zover deze voor hun werking afhankelijk
      zijn van een elektrische krachtbron:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.1°
    text: |-
      gedurende 3 uur de noodverlichting bij elke verzamelplaats en, zowel aan dek als buitenboord, bij elke
      inschepingsplaats waar de groepsreddingmiddelen zijn opgesteld, als voorgeschreven ingevolge het bepaalde in de
      artikelen 202, vierde lid, en 206, zevende lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.2°
    text: gedurende 3 uur de noodverlichting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.2°.2.1
    text: |-
      in alle dienst- en accommodatiegangen, bij alle trappen en uitgangen, en in liftkooien en schachten van liften met
      betreedbare kooi;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.2°.2.2
    text: in ruimten voor machines en hoofdgeneratorstations, inclusief hun bedieningsplaatsen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.2°.2.3
    text: in alle controlestations, machine-controlekamers en bij elk hoofd- en noodschakelbord;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.2°.2.4
    text: bij de stuurinrichting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.2°.2.5
    text: bij magnetische kompassen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.2°.2.6
    text: bij peilglazen van stoomketels;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.2°.2.7
    text: in kombuizen, eetzalen en andere ruimten voor algemeen gebruik;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.2°.2.8
    text: bij de centrale bedieningsplaatsen van vast aangebrachte brandblusinstallaties; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.2°.2.9
    text: in de ruimten waar de vis wordt behandeld en verwerkt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.3°
    text: |-
      gedurende 3 uur de navigatielichten en andere lichten vereist volgens de van kracht zijnde bepalingen ter
      voorkoming van aanvaringen op zee;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.4°
    text: 'gedurende 3 uur:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.4°.4.1
    text: |-
      alle interne communicatiemiddelen welke in geval van nood noodzakelijk zijn, zoals de rechtstreekse
      spreekverbindingen, bedoeld in de artikelen 81, vierde lid, en 135;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.4°.4.2
    text: de brandontdekkings- en brandalarminstallatie;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.4°.4.3
    text: |-
      het intermitterend gebruik van de dagseinlamp, de middelen tot het geven van geluidseinen indien elektrisch
      uitgevoerd of elektrisch te bedienen, en alle interne signaleringen welke in geval van nood zijn vereist; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.2.4°.4.4
    text: |-
      de algemeen alarminstallatie, de alarminstallatie voor de vast aangebrachte brandblusinstallatie met gas als
      blusstof en de alarminstallatie van liften met betreedbare kooi, tenzij deze diensten worden gevoed door een
      onafhankelijke stroombron bestaande uit een accumulatorenbatterij van voldoende capaciteit voor een periode van 3
      uur, opgesteld op een voor noodgebruik geschikte plaats.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: '113.3'
    text: |-
      De elektrische noodkrachtbron mag hetzij een generator hetzij een accumulatorenbatterij zijn, die aan de volgende
      voorwaarden moet voldoen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.3.1°
    text: |-
      indien de elektrische noodkrachtbron een generator is, dan moet deze aangedreven worden door een daartoe geschikte
      werktuiglijke inrichting, voorzien van een onafhankelijke brandstofvoeding en van een goedgekeurd aanzetsysteem
      en waarbij het vlampunt van de te gebruiken brandstof niet lager is dan 43°C. Tenzij in een tweede onafhankelijke
      aanzetinrichting voor de noodgenerator is voorzien, moet de enige bron met geaccumuleerde energie worden beveiligd
      tegen volledige uitputting door de automatische aanzetinrichting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.3.2°
    text: 'indien de elektrische noodkrachtbron een accumulatorenbatterij is, moet deze in staat zijn:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.3.2°.2.1
    text: |-
      zonder wederoplading de noodbelasting op te nemen, waarbij gedurende de gehele ontlaadperiode de spanning van de
      accumulatorenbatterij binnen 12 percent boven of onder zijn nominale spanning blijft;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.3.2°.2.2
    text: automatisch op het noodschakelbord te schakelen bij uitvallen van de elektrische hoofdvoeding; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: 113.3.2°.2.3
    text: onmiddellijk de stroom te leveren aan ten minste de in het tweede lid genoemde diensten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: '113.4'
    text: Het noodschakelbord moet zo dicht als praktisch mogelijk bij de elektrische noodkrachtbron zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: '113.4'
    text: |-
      Indien de elektrische noodkrachtbron een generator is, moet het noodschakelbord in dezelfde ruimte zijn opgesteld
      tenzij de werking daardoor nadelig zou worden beïnvloed.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: '113.4'
    text: |-
      Accumulatorenbatterijen die ingevolge dit artikel aanwezig moeten zijn, mogen niet met het noodschakelbord
      in dezelfde ruimte zijn geplaatst. Op een daartoe geschikte plaats op het hoofdschakelbord of in de machine-
      controlekamer moet een aanwijsinrichting zijn aangebracht die aangeeft wanneer de accumulatorenbatterijen, zijnde
      de elektrische noodkrachtbron in ontlading zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: '113.4'
    text: |-
      Het noodschakelbord moet bij normaal bedrijf via een koppelkabel, die in het hoofdschakelbord doelmatig tegen
      overbelasting en kortsluiting moet zijn beveiligd, worden gevoed vanaf het hoofdschakelbord en automatisch
      worden ontkoppeld op het noodschakelbord bij het uitvallen van de elektrische hoofdvoeding. Indien het systeem is
      ingericht voor een bedrijf met terugvoedmogelijkheid, dan moet de koppelkabel ook in het noodschakelbord tegen ten
      minste kortsluiting zijn beveiligd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: '113.5'
    text: |-
      De noodgenerator en zijn aandrijvend werktuig, en elke noodaccumulatorenbatterij moeten zodanig zijn ingericht
      en opgesteld dat hun goede werking bij hun nominaal vermogen is verzekerd bij rechtliggend vaartuig en bij
      elke slagzijhoek tot 22 graad of bij een trimhoek voor- of achterover tot 10 graden of bij enige combinatie van
      hellinghoeken binnen genoemde grenzen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: '113.6'
    text: |-
      Voorzieningen moeten zijn aangebracht voor het periodiek testen van de gehele noodinstallatie inclusief het testen
      van de automatische aanzetinrichting.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel113
  - number: '114.1'
    text: |-
      Accumulatorenbatterijen moeten zodanig zijn opgesteld, dat zij tegen beschadiging van buitenaf doelmatig zijn
      beschermd en dat zij niet zijn blootgesteld aan overmatige warmte dan wel zeer grote koude of aan andere invloeden
      die de goede werking kunnen schaden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel114
  - number: '114.1'
    text: |-
      Accumulatorenbatterijen moeten zodanig zijn opgesteld, dat voldoende ruimte aanwezig is ten behoeve van het
      onderhoud en de controle.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel114
  - number: '114.1'
    text: |-
      Accumulatorenbatterijen moeten zodanig zijn opgesteld, dat de vrijkomende gassen geen schade aan voorwerpen in de
      omgeving kunnen veroorzaken. Plaatsing in verblijven is niet toegestaan. Alkalische accumulatoren mogen niet te
      zamen met loodaccumulatoren in één kist, kast of accuruimte zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel114
  - number: '114.1'
    text: |-
      De opstelling van accumulatorenbatterijen ten behoeve van de noodinstallatie, moet bovendien voldoen aan het
      bepaalde in de artikelen 112, vijfde lid, en 113, vierde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel114
  - number: '114.2'
    text: |-
      Accumulatorenbatterijen aangesloten aan een laadinrichting met een laadvermogen van 2 kW of meer, te berekenen uit
      de nominale spanning van de batterij en de laadstroom die maximaal kan worden verkregen, moeten in een speciaal
      voor accumulatorenbatterijen bestemde ruimte zijn geplaatst, dan wel in een doelmatige kist of kast aan dek.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel114
  - number: '114.2'
    text: |-
      Accumulatorenbatterijen aangesloten aan een laadinrichting met een laadvermogen van 0,2 kW of meer, doch minder dan
      2 kW, te berekenen als omschreven onder 2.1, moeten in een speciaal voor accumulatorenbatterijen bestemde ruimte
      zijn geplaatst, dan wel in een doelmatige kist of kast. Evenwel mogen zij ook in een ruimte voor machines zijn
      geplaatst, mits is voldaan aan het bepaalde in het voorgaande lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel114
  - number: '114.2'
    text: |-
      Accumulatorenbatterijen aangesloten aan een laadinrichting met een laadvermogen van minder dan 0,2 kW, te berekenen
      als omschreven onder 2.1, mogen op een daartoe geschikte plaats vrij zijn opgesteld, mits is voldaan aan het
      bepaalde in het voorgaande artikel.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel114
  - number: '115.1'
    text: |-
      Accuruimten, -kisten en -kasten moeten op zodanige wijze worden geventileerd, dat zich hierin geen explosieve
      gasmengsels kunnen verzamelen. Daartoe moet zodanig kunnen worden geventileerd dat per uur een aantal liters lucht,
      gelijk aan 110 maal het produkt van het aantal cellen en de laadstroomsterkte in ampère, de ruimte, kist of kast
      doorstroomt. Voor de berekening van het aantal liters lucht moet de maximale waarde van de laadstroomsterkte worden
      genomen, die gedurende de periode van gasvorming zal optreden. Deze waarde mag echter niet kleiner worden genomen
      dan één vierde van de waarde van de laadstroom die ten hoogste door de laadinrichting kan worden geleverd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel115
  - number: '115.2'
    text: |-
      Bij toepassing van kunstmatige ventilatie van accuruimten, -kisten en -kasten moet de inrichting zodanig zijn, dat
      de af te voeren gassen boven uit de ruimte, kist of kast worden afgezogen. Deze gassen mogen de ventilatormotor
      niet kunnen bereiken. De waaier of het schoepenrad moet van zodanig materiaal zijn, dat vonkvorming onder alle
      omstandigheden wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel115
  - number: '115.3'
    text: 'Bij toepassing van natuurlijke ventilatie wordt voldaan aan het bepaalde in het eerste lid, indien:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel115
  - number: 115.3.1°
    text: de te verwijderen gassen boven uit de ruimte, kist of kast worden afgevoerd;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel115
  - number: 115.3.2°
    text: |-
      ventilatiepijpen of -kokers zodanig zijn aangebracht, dat hun hartlijn op geen enkele plaats een grotere hoek met
      de vertikaal vormt dan 45 graden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel115
  - number: 115.3.3°
    text: |-
      de inwendige weerstand van de ventilatiepijpen of -kokers zo gering mogelijk is. Vlamkerende inrichtingen die de
      doortocht noemenswaard verkleinen, mogen niet worden toegepast;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel115
  - number: 115.3.4°
    text: |-
      de doortocht van ventilatiepijpen of -kokers ten minste een waarde heeft als in onderstaande tabel is aangegeven:







                        Maximum laadvermogen in kW als bedoeld in artikel 114, tweede lid


                        Doortocht in mm2




                        loodbatterijen


                        alkalische batterijen






                        minder dan 1,0


                        7 500


                        12 000




                        1,0 tot 1,5


                        12 000


                        18 000




                        1,5 tot 2,0


                        15 000


                        24 000




                        2,0 tot 3,0


                        24 000


                        40 000
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel115
  - number: 115.3.5°
    text: |-
      ventilatiepijpen of -kokers voor afvoer aan het boveneinde zijn voorzien van een doelmatige zuigkap of
      gelijkwaardige inrichting. Zij moeten zo hoog als praktisch mogelijk zijn opgetrokken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel115
  - number: '115.4'
    text: 'Het bepaalde in het voorgaande lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel115
  - number: 115.4.1°
    text: |-
      accumulatorenbatterijen van de categorie als omschreven in artikel 114, tweede lid, onder 2, indien zij vrij in de
      ruimte voor machines of in een andere daartoe geschikte goed geventileerde ruimte zijn opgesteld;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel115
  - number: 115.4.2°
    text: accumulatorenbatterijen van de categorie als omschreven in artikel 114, tweede lid, onder 3.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel115
  - number: '115.5'
    text: |-
      Indien naar het oordeel van het Hoofd van de Scheepvaartinspectie door middel van natuurlijke ventilatie niet
      voldoende veiligheid kan worden verkregen, kan genoemd hoofd kunstmatige ventilatie voorschrijven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel115
  - number: '116.1'
    text: |-
      Het inwendige van de accuruimten, -kisten of -kasten en van hierop aangesloten ventilatiepijpen of -kokers moet
      duurzaam zijn beschermd tegen aantasting door het elektrolyt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel116
  - number: '116.2'
    text: |-
      In accuruimten, -kisten of -kasten mogen geen machines of toestellen zijn aangebracht die tot vonkvorming
      aanleiding kunnen geven. Voor kunstmatige verlichting van accuruimten mogen slechts lampen in vast aangebrachte
      explosieveilige drukvaste lamparmaturen worden gebruikt. Voor tijdelijke verlichting van deze ruimten mag slechts
      van draagbare lampen worden gebruik gemaakt, die voldoen aan het bepaalde in artikel 105. In genoemde ruimten mogen
      geen andere leidingen aanwezig zijn dan die, benodigd voor de daarin aanwezige delen der elektrische installatie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel116
  - number: '116.3'
    text: |-
      Op de deuren van accuruimten moet zijn aangegeven, dat het binnengaan met open vuur en licht is verboden. Op
      de deksels of deuren van accukisten of -kasten moet zijn aangegeven dat het openen daarvan in de nabijheid van
      open vuur en licht is verboden. Bij vrij opgestelde accumulatorenbatterijen moet zijn aangegeven, dat het in de
      nabijheid brengen van open vuur en licht is verboden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel116
  - number: '116.4'
    text: |-
      Bij een helling tot en met 40 graden met de vertikale as mag geen elektrolyt uit cellen van accumulatorenbatterijen
      kunnen vloeien.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel116
  - number: '116.5'
    text: |-
      In alle gevallen waarin een accumulatorenbatterij kan worden ontladen terwijl deze tevens geladen wordt, mag
      de laadspanning aan de batterij een voor de aangesloten toestellen veilige waarde niet te boven gaan. Indien in
      bovengenoemd geval via een weerstand vanuit het scheepsnet wordt geladen, moeten de aangesloten toestellen de
      netspanning tegen aarde kunnen weerstaan. Tevens moet op een doelmatige plaats zijn aangegeven welke handelingen
      dienen te worden verricht om een veilig werken aan de batterij en aan door de batterij gevoede stroomkringen of
      toestellen te waarborgen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel116
  - number: '117.1'
    text: |-
      Bij de uitvoering van schakel- en verdeelinrichtingen moet zoveel mogelijk zijn gebruik gemaakt van hoofdrails en
      verdeelrails die niet van een isolerende bekleding zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel117
  - number: '117.2'
    text: Leidingen die behoren tot verschillende stroomkringen, mogen niet aan eenzelfde stel klemmen zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel117
  - number: '117.3'
    text: |-
      Bij schakel- en verdeelinrichtingen moet voldoende bedieningsruimte aanwezig zijn. Onderhoud en bediening mogen
      niet door in de nabijheid opgestelde toestellen of voorwerpen worden belemmerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel117
  - number: '117.4'
    text: |-
      Schakel- en verdeelinrichtingen moeten zijn voorzien van de nodige bedrijfsvoorschriften. De gegevens omtrent de
      toelaatbare stroomsterkte van iedere stroomkring moeten, samen met die van de nominale waarde of de afstelling van
      het voor de beveiliging tegen overbelasting geschikte apparaat, doelmatig en duurzaam zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel117
  - number: '117.5'
    text: |-
      Niet-geïsoleerde, onder spanning staande stroomgeleiders van verschillende polariteit of fase moeten door middel
      van verschillende kleuren duidelijk van elkaar te onderscheiden zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel117
  - number: '118.1'
    text: |-
      In elke elektrische installatie moeten de voor het bedrijf en voor het doelmatig en veilig verrichten van
      bedienings-, herstellings- en onderhoudswerkzaamheden nodige schakelaars aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel118
  - number: '118.2'
    text: |-
      Motoren en bijbehorende aanloopinrichtingen moeten door middel van schakelaars volledig van het net kunnen worden
      gescheiden. Een zodanige schakelaar moet zich aan of in de nabijheid van de aanloopinrichting bevinden. Indien
      de motor niet in de nabijheid van de aanloopinrichting is opgesteld, of indien geen aanloopinrichting aanwezig
      is, moet nabij de motor een dergelijke scheidingsschakelaar of gelijkwaardige inrichting zijn geplaatst, tenzij
      de schakelaar aan of bij de aanloopinrichting op deugdelijke en doelmatige wijze in de uit-stand kan worden
      vergrendeld of een zodanige voorziening voor een andere voor het doel geschikte schakelaar is getroffen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel118
  - number: '118.3'
    text: |-
      De scheidingsschakelaar of gelijkwaardige inrichting genoemd in het tweede lid behoeft niet te zijn aangebracht
      indien er naar het oordeel van het Hoofd van de Scheepvaartinspectie geen gevaar aanwezig is voor letsel aan
      personen door bewegende delen gedurende het verrichten van herstellings- en onderhoudswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel118
  - number: '118.4'
    text: |-
      Indien voor de bediening van motoren automatische schakelaars met afstandbediening worden toegepast, moeten zonodig
      maatregelen zijn genomen, die verhinderen dat ten gevolge van een aardsluiting in de hulpstroomketen de motoren
      onverwacht in beweging kunnen komen of ongewild in beweging kunnen blijven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel118
  - number: '118.5'
    text: |-
      Schakelaars voor stroomverbruikende toestellen, met uitzondering van lampen, moeten in de uit-stand het betreffende
      toestel volledig van het net scheiden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel118
  - number: '118.6'
    text: |-
      Schakelaars mogen niet zijn aangebracht in leidingen die uit hoofde van het bedrijf met de aarde in verbinding
      zijn, tenzij deze door één handeling gelijktijdig met de overige bijbehorende leidingen kunnen worden
      uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel118
  - number: '118.7'
    text: |-
      Indien een dieselmotor elektrisch op afstand kan worden gestart moet een schakelaar zijn aangebracht waarmede het
      elektrisch starten kan worden voorkomen. Een zodanige schakelaar moet op of in de nabijheid van de dieselmotor
      zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel118
  - number: '119'
    text: |-
      Aanloopinrichtingen voor motoren met een vermogen van 500 W of meer moeten zodanig zijn ingericht, dat bij het
      wegvallen van de spanning dan wel na het optreden van een spanningsdaling tot ongeveer 20 percent van de nominale
      waarde en bij normale frequentie, de stroomtoevoer naar de motor wordt verbroken en het vanzelf in bedrijf komen
      bij terugkeren van de spanning of bij spanningsstijging niet mogelijk is, tenzij de aard van het bedrijf dit eist.
      Zij moeten verder zijn voorzien van een beveiliging tegen overbelasting. Dit laatste geldt niet voor motoren van
      elektrische en elektro-hydraulische stuurinrichtingen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel119
  - number: '120'
    text: |-
      Elektrische verwarmings- en kooktoestellen moeten vast zijn opgesteld. De toestellen moeten zodanig zijn ingericht
      dat de verwarmingselementen zijn omgeven door een doelmatig beschuttend omhulsel.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel120
  - number: '121.1'
    text: |-
      Smeltveiligheden moeten als schroefsmeltveiligheden of daarmede ten minste gelijkwaardige patroonveiligheden zijn
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel121
  - number: '121.2'
    text: 'Smeltveiligheden moeten zodanig zijn ingericht, dat:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel121
  - number: 121.2.1°
    text: |-
      het bij smeltpatronen die zijn ontworpen om stoomsterkte gelegen tussen 6 en 25 A, met inbegrip van deze beide
      grenswaarde, niet mogelijk is door onachtzaamheid of bij vergissing een smeltpatroon in te zetten van een hogere
      nominale stroomsterkte dan die waarvoor de betreffende smeltveiligheid is ontworpen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel121
  - number: 121.2.2°
    text: |-
      bij een nominale stroomsterkte van de smeltpatroon van minder dan 6 A, het niet mogelijk is een smeltpatroon van
      meer dan 6 A in te zetten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel121
  - number: '121.3'
    text: |-
      Smeltveiligheden moeten zodanig zijn ingericht, dat het uitnemen of inzetten van de smeltpatroon kan geschieden,
      zonder dat daartoe niet-geïsoleerde, onder spanning staande delen met de hand of met ongeïsoleerd gereedschap
      behoeven te worden aangeraakt. Bovendien mag er geen gevaar bestaan om met onder spanning staande delen in
      aanraking te komen of om letsel ten gevolge van vlamboogverschijnselen op te lopen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel121
  - number: '121.4'
    text: |-
      Het gebruik van open buisveiligheden, dan wel het gebruik van smeltveiligheden met verwisselbare smeltdraad van een
      nominale stroomsterkte van 25 A of minder, is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel121
  - number: '121.5'
    text: |-
      Het gebruik van gerepareerde smeltpatronen die kennelijk niet voor vervanging van de smeltdraad zijn ingericht, is
      niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel121
  - number: '121.6'
    text: |-
      Op de smeltveiligheidshouder en op de smeltpatronen moeten de nominale stroomsterkte en de spanning waarvoor zij
      mogen worden gebruikt, zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel121
  - number: '121.7'
    text: |-
      Smeltveiligheden en maximumschakelaars moeten zoveel mogelijk een uitschakelvermogen bezitten dat ten minste
      gelijk is aan het kortsluitvermogen ter plaatse. Indien dit niet het geval is, moeten deze smeltveiligheden en
      maximumschakelaars zijn beveiligd door smeltveiligheden en maximumschakelaars, die het uitschakelvermogen wel
      bezitten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel121
  - number: '121.8'
    text: In serie geschakelde smeltveiligheden en maximumschakelaars moeten onderling voldoende selectief zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel121
  - number: '122.1'
    text: |-
      In elke installatie moeten voor een deugdelijke bediening en controle en voor een doelmatig gebruik nodige meet- en
      controletoestellen zijn aangebracht. Op de meetinstrumenten moet de hoogst toelaatbare waarde door een rode streep
      zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel122
  - number: '122.2'
    text: |-
      Ter controle van het al of niet in bedrijf zijn van de generatoren en motoren ten dienste van de voortstuwing of de
      besturing van het vaartuig, moeten op een of meer doelmatige plaatsen controle-inrichtingen zijn aangebracht, een
      en ander ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel122
  - number: '122.3'
    text: |-
      Indien een beveiligingsinrichting aanwezig is als bedoeld in artikel 102, derde lid, dient op het hoofdschakelbord
      een controle-inrichting te zijn aangebracht, die het in werking treden van deze beveiligingsinrichting aangeeft.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel122
  - number: '122.4'
    text: |-
      Indien een niet-geaard primair of secundair verdeelsysteem wordt gebruikt voor kracht, verwarming of verlichting,
      moet dit zijn voorzien van een middel voor de voortdurende controle van de isolatie-weerstand ten opzichte van
      aarde, dat een hoorbare of zichtbare aanwijzing geeft in geval van een te lage isolatieweerstand.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel122
  - number: '123.1'
    text: |-
      Aan boord van een vaartuig moet, wanneer elektro-motoren met een vermogen van meer dan 2,5 kW deel uitmaken van
      de elektrische installatie, ter controle van de isolatieweerstand van deze installatie, een daartoe geschikte
      draagbare isolatiemeter aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel123
  - number: '123.2'
    text: |-
      Om te onderzoeken of de delen van elektrische installatie al of niet onder spanning staan, moeten daartoe geschikte
      draagbare voltmeters, proeflampen of andere spanningaanwijzers aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel123
  - number: '123.3'
    text: 'Een draagbare spanningaanwijzer moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel123
  - number: 123.3.1°
    text: hij moet zodanig zijn ingericht, dat daarin geen kortsluiting kan optreden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel123
  - number: 123.3.2°
    text: |-
      het deel dat de aanwezigheid van spanning aanwijst, moet zijn omgeven door deugdelijk en moeilijk breekbaar
      isolatiemateriaal; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel123
  - number: 123.3.3°
    text: hij moet bestand zijn tegen ruwe behandeling, vallen en stoten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel123
  - number: '124.1'
    text: |-
      Verlichtingsarmaturen moeten zodanig zijn uitgevoerd, dat geen temperatuurstijging kan ontstaan die schade aan de
      leidingen kan veroorzaken. Geen enkel deel van de armatuur, voor zover dit binnen handbereik kan worden aangeraakt,
      mag bij normaal gebruik een hogere temperatuur dan 60°C kunnen bereiken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel124
  - number: '124.2'
    text: |-
      Gloeilampen, fluorescentiebuizen en andere lichtbronnen, aangebracht op plaatsen waar zij aan beschadiging
      blootstaan, moeten doelmatig zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel124
  - number: '124.3'
    text: |-
      In vochtige ruimten moeten waterdichte lamparmaturen worden gebruikt. Het Hoofd van de Scheepvaartinspectie kan
      toestaan dat in bepaalde vochtige ruimten hetzij druipwaterdichte, hetzij spatwaterdichte lamparmaturen worden
      toegepast.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel124
  - number: '125.1'
    text: |-
      In ruimten voor machines, ketelruimen, in het algemeen in gangen en bij trappen, alsmede in die ruimten die naar
      het oordeel van het Hoofd van de Scheepvaartinspectie daarvoor in aanmerking komen, moeten bij aanwezigheid van
      twee of meer lichtpunten per ruimte, deze op ten minste twee afzonderlijke groepen zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel125
  - number: '125.2'
    text: |-
      Verlichtingsgroepen aangebracht in laadruimen of bunkers, moeten zijn voorzien van alpolige schakelaars die buiten
      deze ruimten zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel125
  - number: '125.3'
    text: |-
      Groepleidingen voor verlichting moeten zijn beveiligd door smeltpatronen of maximumschakelaars van ten hoogste 16 A
      nominale stroomsterkte.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel125
  - number: '126.1'
    text: |-
      Handlampen bestemd voor tijdelijke verlichting, geen ladinglampen zijnde, moeten zijn vervaardigd van isolerend
      materiaal van voldoende sterkte of van tegen vocht geïmpregneerd hout, waarin de lamphouder zoveel mogelijk
      verzonken moet zijn aangebracht. Metalen lamphouders in houten handlampen moeten zodanig op isolatiemateriaal
      zijn bevestigd, dat zij niet met het hout in aanraking komen. Zij moeten zijn voorzien van een beschermkorf en
      een schutglas. Bij afgenomen korf en glas mogen geen metalen delen van de lamphouder en de lampvoet kunnen worden
      aangeraakt. De bescherming van de lampvoet moet voldoende tegen mechanische beschadiging bestand zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel126
  - number: '126.2'
    text: |-
      Handlampen van afwijkend type mogen worden toegepast indien zij naar het oordeel van het Hoofd van de
      Scheepvaartinspectie ten aanzien van de veiligheid ten minste gelijkwaardig zijn aan de handlampen als bedoeld in
      het voorgaande lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel126
  - number: '127'
    text: |-
      De vast aangebrachte verlichting bedoeld in artikel 74, zesde lid, moet waterdicht zijn uitgevoerd. Het lichtpunt
      of de lichtpunten hiervoor moeten op een speciaal voor dit doel bestemde stroomkring zijn aangesloten, dan wel door
      middel van een afzonderlijke schakelaar geheel van de overige verlichting kunnen worden gescheiden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel127
  - number: '128.1'
    text: |-
      Iedere afzonderlijke stroomkring moet tegen kortsluiting zijn beveiligd. Iedere afzonderlijke stroomkring moet
      ook tegen overbelasting zijn beveiligd, uitgezonderd de stroomkringen als bedoeld in artikel 94, negende lid, en
      zestiende lid, onder 3, of indien het Hoofd van de Scheepvaartinspectie bij uitzondering anders toestaat.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel128
  - number: '128.2'
    text: |-
      Leidingen mogen niet met een hogere stroomsterkte worden belast dan de maximum stroomsterkte voorgeschreven door
      een klassebureau. De gegevens omtrent de toelaatbare stroomsterkte van iedere stroomkring moeten, samen met die van
      de nominale waarde of de afstelling van het voor de beveiliging tegen overbelasting geschikte apparaat, doelmatig
      en duurzaam zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel128
  - number: '129.1'
    text: |-
      Leidingen moeten wat betreft de constructie en samenstelling voldoen aan de voorschriften van een klassebureau. De
      voorschriften van dit bureau dienen eveneens te worden gevolgd bij de keuze van het leidingtype en met betrekking
      tot de wijze van aanbrengen, een en ander voor zover in deze paragraaf geen afwijkende voorschriften zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel129
  - number: '129.2'
    text: |-
      Behalve daar waar het Hoofd van de Scheepvaartinspectie in bijzondere omstandigheden zulks anders toestaat, moeten
      alle metalen omhulsels en afschermingen van elektrische leidingen ononderbroken zijn en zijn geaard.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel129
  - number: '129.3'
    text: |-
      Alle elektrische leidingen en uitwendige bedrading naar uitrustingen moeten ten minste van het brandvertragende
      type zijn en zo zijn aangebracht dat hun oorspronkelijke brandvertragende eigenschappen niet worden aangetast.
      Indien bijzondere omstandigheden dit noodzakelijk maken, kan het Hoofd van de Scheepvaartinspectie het gebruik
      toestaan van speciale kabeltypen, zoals hoogfrequent kabels, die niet voldoen aan het voorafgaande.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel129
  - number: '129.4'
    text: |-
      Leidingen of bedradingen ten behoeve van essentiële of noodkracht-installaties, verlichting en interne communicatie
      of signaalinrichtingen moeten, voor zover uitvoerbaar, zo zijn aangelegd dat zij niet door kombuizen, wasserijen,
      ruimten voor machines van categorie A, andere ruimten met groot brandrisico en ruimten waar de vis wordt behandeld
      en verwerkt, lopen. Onverminderd het bepaalde in artikel 108, tweede lid, moeten verbindingskabels tussen het
      noodschakelbord en de noodbrandbluspomp, die door ruimten lopen met een groot brandrisico van het brandwerend type
      zijn. Waar mogelijk moeten al deze kabels op zodanige wijze zijn gelegd dat buiten bedrijf raken door opwarming van
      schotten, veroorzaakt door een brand in een aangrenzende ruimte, wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel129
  - number: '129.5'
    text: |-
      Elektrische leidingen en bedrading moeten zodanig zijn aangebracht, dat beschadiging door schavielen of anderszins
      wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel129
  - number: '129.6'
    text: |-
      De aansluitingen en aftakkingen van elke leiding moeten zodanig zijn uitgevoerd, dat de oorspronkelijke
      elektrische, mechanische, brandvertragende en waar nodig brandwerende eigenschappen van de leiding behouden
      blijven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel129
  - number: '129.7'
    text: |-
      Leidingen die in koelruimten zijn aangebracht moeten geschikt zijn voor gebruik bij lage temperaturen en bij een
      hoge vochtigheidsgraad.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel129
  - number: '130.1'
    text: |-
      Indien kabels door waterdichte schotten of dekken zijn gevoerd, moeten voorzieningen zijn getroffen teneinde de
      waterdichtheid van het schot of het dek te verzekeren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel130
  - number: '130.2'
    text: |-
      Indien kabels door dekken zijn gevoerd, moeten zij tot een hoogte van ten minste 200 mm boven het dek tegen
      beschadiging zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel130
  - number: '130.3'
    text: |-
      Indien kabels door schotten of dekken van klasse «A» onderscheidenlijk van klasse «B» zijn gevoerd, moeten
      voorzieningen zijn getroffen teneinde het brandwerende vermogen van de betreffende schotten of dekken niet nadelig
      te beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel130
  - number: '131.1'
    text: |-
      Het casco van een vaartuig waarvan de lengte 75 m of meer bedraagt, mag niet als terugleider worden gebruikt voor
      kracht, verwarming, of verlichting.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel131
  - number: '131.1'
    text: |-
      Het bepaalde onder 1.1 is niet van toepassing op het gebruik van onder door het Hoofd van de Scheepvaartinspectie
      goedgekeurde omstandigheden:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel131
  - number: 131.1.1°
    text: kathodische beschermingen welke werken met opgedrukte stroom;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel131
  - number: 131.1.2°
    text: systemen van beperkte omvang die plaatselijk zijn geaard; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel131
  - number: 131.1.3°
    text: |-
      inrichtingen voor controle van de isolatieweerstand mits de stroom onder de meest ongunstige omstandigheid niet
      meer bedraagt dan 30 mA.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel131
  - number: '131.2'
    text: |-
      Indien het casco als terugleider wordt gebruikt moeten alle eindgroepen, zijnde alle stroomkringen achter de
      laatste beveiliging, dubbelpolig zijn en de verbindingen met het casco moeten op toegankelijke plaatsen tot stand
      zijn gebracht en wel zodanig dat zij gemakkelijk kunnen worden gecontroleerd en losgemaakt voor het verrichten van
      isolatiemetingen. Het Hoofd van de Scheepvaartinspectie kan voor verdeelsystemen waarbij het casco als terugleider
      wordt gebruikt, aanvullende eisen stellen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel131
  - number: '132.1'
    text: |-
      Onbeschermde metalen delen van elektrische machines of uitrustingen, die niet zijn bestemd om onder spanning te
      staan, doch ten gevolge van een defect onder spanning kunnen geraken, moeten zijn geaard, tenzij de machines of
      uitrustingen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel132
  - number: 132.1.1°
    text: |-
      worden gevoed met een spanning niet hoger dan 55 V gelijkspanning of 55 V wisselspanning tussen de geleiders.
      Spaartransformatoren mogen voor het verkrijgen van de genoemde wisselspanning niet worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel132
  - number: 132.1.2°
    text: |-
      worden gevoed met een spanning niet hoger dan 250 V, verkregen van een beschermingstransformator waarop slechts één
      verbruiker is aangesloten; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel132
  - number: 132.1.3°
    text: zijn geconstrueerd volgens het principe van dubbele isolatie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel132
  - number: '132.2'
    text: |-
      Voor verplaatsbare elektrische uitrustingen die gedurende het gebruik in de hand worden gehouden gelden de volgende
      eisen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel132
  - number: 132.2.1°
    text: |-
      verplaatsbare elektrische uitrustingen die gedurende het gebruik in de hand worden gehouden zoals
      handgereedschappen, ruim- en looplampen en dergelijke dienen bij voorkeur te zijn geconstrueerd volgens het
      principe van dubbele isolatie. Indien dit niet het geval is mag in vochtige ruimten en aan dek de voedingsspanning
      niet hoger zijn dan 55 V gelijkspanning of 55 V wisselspanning tussen de geleiders; spaartransformatoren mogen
      voor het verkrijgen van de genoemde wisselspanning niet worden gebruikt. Deze spanning mag worden verhoogd tot ten
      hoogste 250 V, onder voorwaarde dat deze spanning wordt verkregen van een beschermingstransformator waarop slechts
      één verbruiker is aangesloten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel132
  - number: 132.2.2°
    text: |-
      voor werkzaamheden in nauwe ruimten zoals ketels, tanks en dergelijke mag de voedingsspanning in geen geval hoger
      zijn dan 55 V gelijkspanning of 55 V wisselspanning tussen de geleiders; spaartransformatoren mogen voor het
      verkrijgen van de genoemde wisselspanning niet worden gebruikt; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel132
  - number: 132.2.3°
    text: |-
      het Hoofd van de Scheepvaartinspectie kan aanvullende voorzorgsmaatregelen eisen voor verplaatsbare elektrische
      uitrustingen die worden gebruikt in nauwe of uitzonderlijk vochtige ruimten waar in verband met de geleidbaarheid
      bijzonder gevaar kan bestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel132
  - number: '132.3'
    text: |-
      Alle elektrische toestellen moeten zo zijn geconstrueerd en geïnstalleerd dat zij geen letsel kunnen veroorzaken,
      wanneer deze op de normale wijze worden behandeld of aangeraakt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel132
  - number: '132.4'
    text: |-
      Hoofd- en noodschakelborden moeten zodanig zijn geplaatst en ingericht, dat zij zonder gevaar voor het aanwezige
      personeel gemakkelijk toegang geven tot de apparatuur en verdere uitrusting. De zijkanten en de achterzijde
      en zonodig de voorzijde moeten doelmatig zijn beschermd. Aan de voorzijde van deze schakelborden mogen geen
      onbeschermde stroomvoerende delen zijn aangebracht waarvan de spanning ten opzichte van aarde hoger is dan de
      spanning welke door het Hoofd van de Scheepvaartinspectie aanvaardbaar wordt geacht. Waar nodig moeten aan voor-
      en achterzijde matten of roosters van niet-elektrisch-geleidend materiaal aanwezig zijn. Aan de voorzijde van
      schakelborden moet een handgeleider zijn aangebracht. Bij een schakelbord van het open type moet deze handgeleider
      geïsoleerd zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel132
  - number: '132.5'
    text: |-
      Indien de achterzijde van hoofd- en noodschakelborden open is, moet zich aan die zijde een goed toegankelijke
      vrije ruimte bevinden, die bij een totale lengte van 6 meter of meer van beide einden goed toegankelijk is. Langs
      de achterzijde moet een geïsoleerde handgeleider zijn aangebracht. De toegangen moeten door middel van doelmatig
      afsluitbare, naar buiten draaiende deuren of schuifdeuren kunnen worden afgesloten. Op de deuren moet aan de
      buitenzijde de nominale spanning en de stroomsoort zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel132
  - number: '132.6'
    text: Hoofd- en noodschakelborden moeten zijn voorzien van de nodige aanduidingen ten dienste van het bedrijf.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel132
  - number: '132.7'
    text: |-
      Aan alle houten masten of stengen moeten bliksemafleiders zijn aangebracht. Op vaartuigen die van niet geleidende
      materialen zijn vervaardigd, moeten de bliksemafleiders door middel van geschikte geleiders verbonden zijn met een
      koperen plaat die ruimschoots onder de waterlijn van de romp van het vaartuig is bevestigd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel132
  - number: '133.1'
    text: |-
      Bijzondere aandacht moet worden gegeven aan de afscherming van hogedruk brandstofleidingen. Waar praktisch
      uitvoerbaar, moeten lekkages van deze leidingsystemen in een doelmatige afvoertank worden opgevangen, die moet zijn
      voorzien van een hoog niveau alarm.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel133
  - number: '133.2'
    text: |-
      Wanneer brandstofdagtanks automatisch of door middel van afstandbediening worden gevuld, moet een inrichting zijn
      aangebracht teneinde overlopen te voorkomen. Deze bepaling is eveneens van toepassing op andere inrichtingen voor
      de automatische behandeling van brandbare vloeistoffen. Brandstofcentrifuges moeten zo mogelijk zijn geïnstalleerd
      in een speciale ruimte voor centrifuges, filters en hun voorwarmers.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel133
  - number: '133.3'
    text: |-
      Wanneer brandstofdagtanks of bezinktanks zijn voorzien van een verwarmingsinrichting, moet, indien het vlampunt van
      de brandstofolie kan worden overschreden, een hoog-temperatuur-alarm zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel133
  - number: '133.4'
    text: |-
      In ruimten voor machines moet een automatische brandalarmen brandontdekkingsinstallatie van een goedgekeurd type
      zijn aangebracht, die voldoet aan het bepaalde in artikel 176, tweede lid. Ten aanzien van vaartuigen waarvan de
      lengte minder dan 45 m bedraagt, kan het Hoofd van de Scheepvaartinspectie toestaan dat deze installatie niet wordt
      aangebracht, mits de ruimte voor machines zodanig is gelegen, dat een hierin optredende brand door de aan boord
      aanwezige personen gemakkelijk kan worden opgemerkt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel133
  - number: '133.5'
    text: |-
      Inwendige verbrandingsmotoren met een vermogen van 2250 kW of meer of met een cilinder diameter groter dan 300
      mm, moeten zijn voorzien van oliemistdetectie in de krukkasten of van temperatuurmeting aan de lagers, of van
      gelijkwaardige voorzieningen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel133
  - number: '133.6'
    text: |-
      Ten genoegen van het Hoofd van de Scheepvaartinspectie moet een vast aangebrachte brandblusinstallatie aanwezig
      zijn die voldoet aan het bepaalde in de artikelen 159, eerste lid of 182, eerste lid, al naar gelang van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel133
  - number: '133.7'
    text: |-
      Aan boord van een vaartuig waarvan de lengte 75 m of meer bedraagt, moeten voorzieningen zijn getroffen voor een
      onmiddellijke waterlevering uit de hoofdbrandblusleiding, hetzij door middel van afstandbediening van één van
      de hoofdbrandbluspompen vanaf de brug en vanuit het eventuele brandcontrolestation, hetzij door middel van het
      voortdurend onder druk houden van de hoofdbrandblusleiding in welk laatste geval voorzieningen dienen te worden
      getroffen teneinde beschadiging van de hoofdbrandblusleiding door bevriezing te voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel133
  - number: '133.8'
    text: |-
      De brandveiligheid van ruimten voor machines, van de plaats waar de bedieningsapparatuur van de
      brandblusinstallatie is samengebracht en van het veiligheidssysteem als bedoeld in artikel 138, moet ten genoegen
      van het Hoofd van de Scheepvaartinspectie zijn. Onverminderd het bepaalde in hoofdstuk 5 kan het Hoofd van de
      Scheepvaartinspectie daartoe aanvullende brandblustoestellen, brandbestrijdingsmiddelen alsmede persluchttoestellen
      voorschrijven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel133
  - number: '134.1'
    text: |-
      Vullings in ruimten voor machines moeten voorzien zijn van een goedgekeurde alarminstallatie die een hoog-niveau-
      alarm geeft en waarvan de goede werking binnen de normale toestanden van stuur- en koplast is verzekerd. Deze
      bilge-alarminstallatie moet daar, waar voortdurend de wacht wordt gehouden, een hoorbaar en zichtbaar alarmsignaal
      in werking kunnen stellen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel134
  - number: '134.2'
    text: |-
      Aan boord van een vaartuig waarvan de lengte 45 m of meer bedraagt, moet de bedieningsplaats van elke afsluiter die
      deel uitmaakt van een zee-inlaat, een uitlaat beneden de waterlijn of een bilge-ejector, zodanig zijn gelegen dat
      er voldoende tijd is om deze afsluiters te bedienen ingeval water de ruimte binnenstroomt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel134
  - number: '135'
    text: |-
      Aan boord van een vaartuig waarvan de lengte 75 m of meer bedraagt, moet in aanvulling op het bepaalde in artikel
      81, bovendien een doeltreffende spreekverbinding tussen de brug en de verblijven van de werktuigkundigen zijn
      aangebracht, die moet voldoen aan het bepaalde in artikel 111.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel135
  - number: '136.1'
    text: Een alarminstallaties moet zijn aangebracht die elke storing welke verholpen dient te worden, aangeeft.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel136
  - number: '136.2'
    text: |-
      De alarminstallatie moet in de ruimte voor machines een hoorbaar alarmsignaal kunnen geven en moet elke
      afzonderlijke alarmfunctie op een doelmatige plaats zichtbaar aangeven. Aan boord van een vaartuig waarvan de
      lengte minder dan 45 m bedraagt, kan het Hoofd van de Scheepvaartinspectie toestaan dat de installatie elke
      afzonderlijke alarmfunctie alleen op de brug hoorbaar en zichtbaar aangeeft.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel136
  - number: '136.2'
    text: |-
      Aan boord van een vaartuig waarvan de lengte 45 m of meer bedraagt, moet de alarminstallatie verbonden
      kunnen worden met de hutten van de werktuigkundigen door middel van een keuzeschakelaar naar elke hut en met
      het dagverblijf van de werktuigkundigen, indien aanwezig. Het Hoofd van de Scheepvaartinspectie kan andere
      voorzieningen toestaan die dezelfde veiligheid waarborgen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel136
  - number: '136.2'
    text: |-
      Aan boord van een vaartuig waarvan de lengte 45 m of meer bedraagt, moet een algemeen werktuigkundigenalarm en een
      alarm op de brug, bestemd voor de personen die de wacht houden, in werking treden, indien op enige alarmfunctie
      geen acht is geslagen binnen een tijdsverloop dat ten genoegen van het Hoofd van de Scheepvaartinspectie moet zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel136
  - number: '136.2'
    text: |-
      Op de brug moeten hoorbare en zichtbare alarmen in werking treden in elke situatie die onder de aandacht moet
      worden gebracht van de verantwoordelijke wachtdoende persoon, dan wel waarin deze handelend dient op te treden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel136
  - number: '136.2'
    text: De alarminstallatie moet zoveel mogelijk zijn ontworpen volgens een principe dat het optreden van fouten uitsluit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel136
  - number: '136.3'
    text: 'De alarminstallatie moet:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel136
  - number: 136.3.1°
    text: |-
      ononderbroken gevoed worden; ingeval de normale voeding wegvalt moet de installatie automatisch overschakelen op
      een noodvoeding; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel136
  - number: 136.3.2°
    text: alarmeren ingeval een storing in de normale voeding optreedt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel136
  - number: '136.4'
    text: |-
      De alarminstallatie moet tegelijkertijd meer dan één storing kunnen aangeven. Het accepteren van een alarm mag het
      doorkomen van een ander alarm niet verhinderen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel136
  - number: '136.5'
    text: |-
      Acceptatie van iedere alarmtoestand op de plaatsen als bedoeld in het tweede lid, onder 1, moet worden aangegeven
      op de plaatsen waar de alarmtoestand werd gemeld. Een alarmtoestand moet gehandhaafd blijven totdat deze is
      geaccepteerd, terwijl de zichtbare aanduidingen van afzonderlijke alarmen zichtbaar moeten blijven totdat de
      storing verholpen is, waarna het alarmsysteem automatisch moet terugkeren in de normale bedrijfstoestand
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel136
  - number: '137.1'
    text: |-
      Wanneer aan boord van een vaartuig, waarvan de lengte 75 m of meer bedraagt, de elektrische energievoorziening
      in de regel kan worden verzorgd door één generator, moeten doelmatige voorzieningen zijn getroffen teneinde de
      energielevering ten dienste van de noodzakelijke werktuigen bestemd voor de voortstuwing, de besturing en de
      veiligheid van het schip te kunnen waarborgen. Passende voorzieningen moeten aanwezig zijn voor het automatisch
      starten en op het net schakelen van een «stand-by» generator bij het uitvallen van de te werk staande generator.
      Deze generator moet van voldoende capaciteit zijn om de voortstuwing en de besturing van het schip te kunnen
      verzekeren en de veiligheid van het schip te kunnen waarborgen door automatisch starten van de hiervoor belangrijke
      werktuigen, waar nodig met behulp van een volgorde schakeling.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel137
  - number: '137.2'
    text: |-
      In geval «stand-by» hulpwerktuigen worden vereist voor andere, voor de voortstuwing noodzakelijke hulpwerktuigen,
      moeten automatische omschakelinrichtingen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel137
  - number: '137.3'
    text: 'Een automatisch regel- en alarmsysteem moet voldoen aan de volgende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel137
  - number: 137.3.1°
    text: |-
      het regelsysteem moet zodanig zijn uitgevoerd dat de diensten nodig voor de werking van het
      hoofdvoortstuwingswerktuig en de hulpwerktuigen, door de noodzakelijke automatische voorzieningen zijn verzekerd;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel137
  - number: 137.3.2°
    text: automatisch overschakelen moet door middel van een alarm worden aangegeven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel137
  - number: 137.3.3°
    text: |-
      een alarmsysteem dat voldoet aan het bepaalde in artikel 136 moet zijn aangebracht voor alle belangrijke drukken,
      temperaturen, vloeistofniveaus en andere van belang zijnde parameters;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel137
  - number: 137.3.4°
    text: |-
      een centrale post moet zijn ingericht met de noodzakelijke alarm- en instrumentenpanelen, welke elk alarm kunnen
      aangeven; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel137
  - number: 137.3.5°
    text: |-
      voorzieningen moeten zijn getroffen om de aanzetluchtdruk op het vereiste niveau te houden wanneer
      verbrandingsmotoren voor de voortstuwing worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel137
  - number: '138'
    text: |-
      Een veiligheidssysteem moet zijn aangebracht teneinde te verzekeren dat een ernstige storing aan de te werk staande
      werktuigen of ketels, welke een direct gevaar oplevert, automatisch het desbetreffende gedeelte van de installatie
      zal uitschakelen, waarbij tevens een alarm wordt gegeven. Het stopzetten van de voortstuwingsinstallatie mag niet
      automatisch plaatsvinden, behalve in die gevallen welke tot ernstige schade, algeheel onklaar raken of explosie
      zouden kunnen leiden. Indien voorzieningen zijn aangebracht welke het stopzetten van het hoofdvoortstuwingswerktuig
      ongedaan kunnen maken, moeten deze voorzieningen zodanig zijn uitgevoerd dat ongewild gebruik ervan niet mogelijk
      is. Wanneer zulk een voorziening is gebruikt, dient dit zichtbaar te worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel138
  - number: '139.1'
    text: De voorschriften in deze paragraaf zijn van toepassing op vaartuigen waarvan de lengte 55 m of meer bedraagt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel139
  - number: '139.2'
    text: 'In ruimten voor accommodatie en dienstruimten moet een van de volgende methoden van bescherming zijn toegepast:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel139
  - number: 139.2.1°
    text: |-
      **methode I F**- het aanbrengen van scheidingsschotten van klasse «B» of «C» van onbrandbare kwaliteit, in het
      algemeen zonder dat daarbij installaties als voorgeschreven bij methode II of III F in de ruimten voor accommodatie
      en de dienstruimten zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel139
  - number: 139.2.2°
    text: |-
      **methode II F**- het installeren van een automatische sprinkler- en brandalarm- en brandontdekkingsinstallatie
      voor het ontdekken en blussen van brand in alle ruimten waarin het ontstaan van een brand kan worden verwacht, in
      het algemeen zonder beperkingen ten aanzien van het type van de scheidingsschotten; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel139
  - number: 139.2.3°
    text: |-
      **methode III F**- het installeren van een automatische brandalarm- en brandontdekkingsinstallatie in alle ruimten
      waarin het ontstaan van een brand kan worden verwacht, in het algemeen zonder beperkingen ten aanzien van het type
      van de scheidingsschotten, met dien verstande dat de oppervlakte van enige ruimte of ruimten voor accommodatie
      die door een schot van klasse «A» of «B» dienen te worden begrensd, in geen geval meer dan 50 m2 mag bedragen. Het
      Hoofd van de Scheepvaartinspectie kan voor ruimten voor algemeen gebruik echter een grotere oppervlakte toestaan.
      De bepalingen met betrekking tot de toepassing van onbrandbare materialen bij de constructie en isolatie van
      schotten die de begrenzing vormen van ruimten voor machines, controlestations en dergelijke, en de bescherming van
      trapomsluitingen en gangen zijn voor alle drie methoden gelijk.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel139
  - number: '140.1'
    text: |-
      De romp, de bovenbouw, structurele schotten, dekken en dekhuizen moeten van staal of ander, gelijkwaardig materiaal
      zijn vervaardigd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel140
  - number: '140.2'
    text: |-
      De isolatie van onderdelen van schotten van klasse «A» of «B» welke van aluminiumlegering zijn vervaardigd, met
      uitzondering van die welke naar het oordeel van het Hoofd van de Scheepvaartinspectie niet lastdragend zijn,
      dient zodanig te zijn dat de temperatuur van de metalen kern van de constructie gedurende de van toepassing zijnde
      brandproef te eniger tijd niet meer dan 200°C boven de temperatuur van de omgeving stijgt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel140
  - number: '140.3'
    text: |-
      Bijzondere aandacht dient te worden geschonken aan de isolatie van onderdelen van stutten, stijlen en andere delen
      van de constructie die van aluminiumlegering zijn vervaardigd en die nodig zijn ter ondersteuning van de plaatsen
      voor de opstelling en het te water brengen van en de inscheping in de groepsreddingmiddelen en van schotten van
      klasse «A» en «B» teneinde zeker te stellen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel140
  - number: 140.3.1°
    text: |-
      dat voor dergelijke constructiedelen die de plaatsen met de groepsreddingmiddelen en schotten van klasse «A»
      steunen, de grens voor de temperatuurstijging genoemd in het voorgaande lid, aan het einde van een uur zal gelden;
      en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel140
  - number: 140.3.2°
    text: |-
      dat voor dergelijke constructiedelen die schotten van klasse «B» moeten ondersteunen, de grens voor de
      temperatuurstijging genoemd in het voorgaande lid, aan het einde van een half uur zal gelden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel140
  - number: '140.4'
    text: |-
      In afwijking van het bepaalde in het eerste lid moeten kappen en schachten van ruimten voor machines van categorie
      A van staal zijn en naar behoren zijn geïsoleerd, terwijl de openingen daarin, indien aanwezig, doelmatig moeten
      zijn aangebracht en zijn voorzien van middelen om uitbreiding van brand tegen te gaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel140
  - number: '141.1'
    text: |-
      Binnen ruimten voor accommodatie en dienstruimten dienen alle schotten welke van klasse «B» moeten zijn, te zijn
      opgetrokken van dek tot dek en zich uit te strekken tot de huid of tot andere begrenzingswanden, tenzij aan beide
      zijden van de schotten doorlopende plafonds of beschietingen van klasse «B» zijn aangebracht, in welk geval het
      schot mag eindigen bij het doorlopende plafond of de doorlopende beschieting.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel141
  - number: '141.2'
    text: |-
      **Methode I F**- Alle schotten die niet ingevolge het bepaalde in deze paragraaf van klasse «A» of «B» moeten zijn,
      dienen ten minste schotten van klasse «C» te zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel141
  - number: '141.3'
    text: |-
      **Methode II F**- De constructie van schotten die niet ingevolge het bepaalde in deze paragraaf van klasse «A» of
      «B» moeten zijn, is niet aan beperking onderworpen, behoudens in die gevallen waarin schotten van klasse «C» zijn
      vereist overeenkomstig tabel 1 van artikel 144, onder 2.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel141
  - number: '141.4'
    text: |-
      **Methode III F**- De constructie van schotten die niet ingevolge het bepaalde in deze paragraaf van klasse «A»
      of «B» moeten zijn, is niet aan beperkingen onderworpen, behoudens in die gevallen waarin schotten van klasse
      «C» zijn vereist overeenkomstig tabel 1 van artikel 144, onder 2. De oppervlakte van enige ruimte of ruimten voor
      accommodatie die door een doorlopend schot van klasse «A» of «B» dienen te worden begrensd, mag in geen geval meer
      dan 50 m2 bedragen. Het Hoofd van de Scheepvaartinspectie kan voor ruimten voor algemeen gebruik echter een grotere
      oppervlakte toestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel141
  - number: '142.1'
    text: |-
      Trappen die niet meer dan twee dekken bedienen, moeten ten minste op een niveau zijn beschermd door schotten van
      klasse «B-O» en zelfsluitende deuren. Liften die niet meer dan twee dekken bedienen, moeten zijn omsloten door
      schotten van klasse «A-O» die op beide niveaus moeten zijn voorzien van stalen deuren. Trappen en liftschachten
      die meer dan twee dekken bedienen, moeten ten minste zijn omsloten door schotten van klasse «A-O» en zijn beschermd
      door zelfsluitende deuren op alle niveaus.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel142
  - number: '142.2'
    text: |-
      Het constructieve deel van alle trappen moet van staal zijn, behalve wanneer het Hoofd van de Scheepvaartinspectie
      het gebruik van ander, gelijkwaardig materiaal toestaat.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel142
  - number: '143.1'
    text: |-
      Deuren moeten een brandwerend vermogen hebben dat - voor zover als praktisch mogelijk - gelijkwaardig is aan dat
      van het schot waarin zij zijn aangebracht. Deuren en deurkozijnen in schotten van klasse «A» moeten van staal zijn.
      Deuren in schotten van klasse «B» moeten van onbrandbaar materiaal zijn. Deuren aangebracht in begrenzingsschotten
      van ruimten voor machines van categorie A, moeten zelfsluitend en redelijk gasdicht zijn. Het Hoofd van de
      Scheepvaartinspectie kan het gebruik van brandbare materialen toestaan in deuren die hutten scheiden van de eigen
      bijbehorende sanitaire ruimten, zoals douchecellen, indien methode I F is toegepast.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel143
  - number: '143.2'
    text: |-
      Deuren die zelfsluitend moeten zijn, mogen niet zijn voorzien van vastzethaken. Vastzetinrichtingen mogen evenwel
      worden toegepast, indien deze zijn voorzien van op afstand bediende ontkoppelingsinrichtingen van een type dat de
      deur doet sluiten indien het systeem in het ongerede geraakt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel143
  - number: '143.3'
    text: |-
      Ventilatie-openingen mogen zijn aangebracht in en onder deuren in schotten van gangen, met dien verstande dat
      dergelijke openingen niet mogen zijn aangebracht in en onder deuren van trapomsluitingen. De openingen in deuren
      mogen uitsluitend in de onderste helft van een deur zijn aangebracht. Indien een dergelijke opening zich bevindt
      in of onder een deur, mag de totale oppervlakte van deze opening of openingen niet meer bedragen dan 0,05 m2.
      Indien een dergelijke opening in een deur is aangebracht, moet deze zijn voorzien van een rooster van onbrandbaar
      materiaal.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel143
  - number: '143.4'
    text: Waterdichte deuren behoeven niet te zijn geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel143
  - number: '144.1'
    text: |-
      Behalve dat moet zijn voldaan aan de specifieke bepalingen voor brandwerendheid van schotten en dekken die elders
      in deze paragraaf worden voorgeschreven, moet de brandwerendheid van schotten en dekken ten minste zijn zoals
      voorgeschreven in tabel 1 en tabel 2 van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: '144.2'
    text: 'De toepassing van de tabellen wordt geregeld door de volgende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.2.1°
    text: |-
      de tabellen 1 en 2 zijn onderscheidenlijk van toepassing op schotten en dekken welke aan elkaar grenzende ruimten
      scheiden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.2.2°
    text: |-
      ter bepaling van de passende normen voor de brandwerendheid die moeten worden aangelegd voor schotten en dekken
      tussen aan elkaar grenzende ruimten, zijn deze ruimten ingedeeld op grond van hun brandrisico als hieronder
      is aangegeven, waarbij het tussen haken geplaatste nummer dat achter elke categorie vermeld staat, naar de
      desbetreffende kolom of rij in de tabellen verwijst:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.2.2°.2.1
    text: |-
      **Controlestations (1)** Ruimten waarin de noodkrachtbronnen en de voorzieningen voor de noodverlichting
      zijn ondergebracht; stuurhuis en kaartenkamer; ruimten waarin de radio-installatie van het vaartuig
      is ondergebracht; ruimten ten behoeve van brandblussing, stations voor brandcontrole en brandmelding;
      controleruimte voor de voortstuwingsinstallatie indien gelegen buiten de ruimten voor machines; ruimten waarin de
      brandalarmeringsapparatuur bijeen is gebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.2.2°.2.2
    text: '**Gangen (2)** Gangen en portalen.'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.2.2°.2.3
    text: |-
      **Ruimten voor accommodatie (3)** Ruimten zoals omschreven in artikel 2, eerste lid, onder 59, met uitzondering
      van gangen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.2.2°.2.4
    text: |-
      **Trappen (4)** Binnentrappen, liften en roltrappen, andere dan die welke geheel binnen de ruimten voor machines
      liggen, zomede de bijbehorende ingesloten ruimten. In dit verband dient een trap die slechts op één niveau
      is ingesloten, te worden beschouwd als een deel van de ruimte waarin hij niet door een brandwerende deur is
      gescheiden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.2.2°.2.5
    text: |-
      **Dienstruimten die in geringe mate brandgevaarlijk zijn (5)** Bergkasten en bergplaatsen die een oppervlakte
      hebben van minder dan 2 m2, droogkamers en wasserijen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.2.2°.2.6
    text: '**Ruimten voor machines van categorie A (6)** Ruimten zoals omschreven in artikel 2, eerste lid, onder 63.'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.2.2°.2.7
    text: |-
      **Andere ruimten voor machines (7)** Ruimten zoals omschreven in artikel 2, eerste lid, onder 64, alsmede ruimten
      waar vis tot vismeel wordt verwerkt, doch met uitzondering van ruimten voor machines van categorie A.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.2.2°.2.8
    text: |-
      **Laadruimten (8)** Alle ruimten die gebruikt worden voor lading, met inbegrip van lading-olietanks alsmede
      schachten en luikhoofden van zodanige ruimten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.2.2°.2.9
    text: |-
      **Dienstruimten die in hoge mate brandgevaarlijk zijn (9)** Kombuizen, pantries die voorzien zijn van
      kooktoestellen, verfhutten, lampenhutten, bergkasten en bergplaatsen die een oppervlakte hebben van 2 m2 of meer,
      alsmede werkplaatsen die geen deel uitmaken van de ruimten voor machines.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.2.2°.2.10
    text: |-
      **Open dekken (10)** Open dekruimten en gesloten wandelgangen, ruimten waar vis in rauwe staat wordt verwerkt,
      ruimten waar vis wordt schoongespoeld en soortgelijke ruimten die niet brandgevaarlijk zijn; luchtruimten buiten de
      bovenbouwen en dekhuizen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: '144.3'
    text: |-
      Doorlopende plafonds of beschietingen van klasse «B» kunnen, te zamen met de desbetreffende dekken of schotten,
      worden aanvaard als een volledige of gedeeltelijke bijdrage tot de vereiste isolatie en brandwerendheid van een
      afscheiding.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: '144.4'
    text: 'Voor ruimten voor machines geldt ten aanzien van schijnlichten, ramen, patrijspoorten en lichtranden het volgende:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.4.1°
    text: |-
      wanneer schijnlichten kunnen worden geopend, moeten zij van buiten de ruimte waarop zij zijn aangebracht,
      gemakkelijk kunnen worden gesloten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.4.2°
    text: |-
      schijnlichten voor ruimten voor machines van categorie A mogen niet zijn voorzien van ramen, patrijspoorten of
      lichtranden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.4.3°
    text: |-
      indien in schijnlichten voor ruimten voor machines, andere dan ruimten voor machines van categorie A, ramen,
      patrijspoorten of lichtranden zijn aangebracht, moeten deze van draadglas zijn. Zij moeten tevens aan de
      buitenzijde zijn voorzien van blinden die vast aan het schijnlicht zijn verbonden en die zijn vervaardigd van staal
      of ander, gelijkwaardig materiaal; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: 144.4.4°
    text: |-
      glas of soortgelijk materiaal mag niet in begrenzingsschotten van ruimten voor machines zijn aangebracht. Dit sluit
      het gebruik van glas in wanden van controlekamers die geheel in de ruimten voor machines zijn gelegen, niet uit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: '144.5'
    text: |-
      In de buitenste begrenzingswanden die ingevolge het bepaalde in artikel 140, eerste lid, van staal of ander,
      gelijkwaardig materiaal moeten zijn, mogen ramen en patrijspoorten zijn aangebracht, mits niet elders in deze
      paragraaf is voorgeschreven dat zodanige begrenzingswanden een brandwerendheid van klasse «A» moeten hebben. Evenzo
      mogen deuren in dergelijke begrenzingswanden die geen brandwerendheid van klasse «A» behoeven te hebben, zijn
      vervaardigd van materialen die ten genoegen van het Hoofd van de Scheepvaartinspectie zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel144
  - number: '145.1'
    text: |-
      **Methode I F**- In ruimten voor accommodatie, in dienstruimten en in controlestations moeten alle beschietingen,
      afstoppingen, plafonds en het bijbehorende grondhout van onbrandbaar materiaal zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel145
  - number: '145.2'
    text: |-
      **Methoden II F en III F**- In de gangen en ingesloten ruimten voor trappen die toegang geven tot ruimten voor
      accommodatie, dienstruimten en controlestations, moeten plafonds, beschietingen, afstoppingen en het bijbehorende
      grondhout van onbrandbaar materiaal zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel145
  - number: '145.3'
    text: '**Methode I F, II F en III F**:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel145
  - number: 145.3.1°
    text: |-
      Tenzij toegepast in laadruimten of koel- en vrieskamers in dienstruimten, moeten de isolatiematerialen
      onbrandbaar zijn. Dampwerende lagen, kleefstoffen gebruikt bij isolatie, alsmede de isolatie van pijpleidingen
      van koudwatersystemen behoeven niet van onbrandbaar materiaal te zijn, doch zij moeten tot het praktisch mogelijk
      minimum worden beperkt en het vlamverspreidend vermogen van de blootgestelde oppervlakken ervan moet ten genoegen
      van het Hoofd van de Scheepvaartinspectie zijn. In ruimten waarin olieprodukten aanwezig kunnen zijn, moet het
      oppervlak van de isolatie ondoordringbaar zijn voor olie en oliedampen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel145
  - number: 145.3.2°
    text: |-
      Indien onbrandbare schotten, beschietingen en plafonds zijn aangebracht in ruimten voor accommodatie en
      dienstruimten, mogen deze binnen deze ruimten zijn voorzien van een brandbare fineerlaag mits deze niet dikker is
      dan 2 mm, behalve in gangen, ingesloten ruimten voor trappen en controlestations, waar deze laag niet dikker mag
      zijn dan 1,5 mm.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel145
  - number: 145.3.3°
    text: |-
      Luchtruimten, ingesloten achter wanden en beschietingen en tussen plafonds en dekken, moeten op passende wijze
      zijn onderverdeeld door afstoppingen die de trek tegengaan en die niet verder dan 14 m uiteenliggen. In vertikale
      richting moeten dergelijke ruimten, met inbegrip van die achter beschietingen van trappenhuizen, schachten en
      dergelijke, op elk dek zijn afgestopt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel145
  - number: '146.1'
    text: |-
      Ventilatiekanalen moeten zijn vervaardigd van onbrandbaar materiaal. Korte stukken van kanalen die over het
      algemeen niet langer zijn dan 2 m en waarvan de oppervlakte van de dwarsdoorsnede niet meer dan 0,02 m2 bedraagt,
      behoeven echter niet onbrandbaar te zijn, mits aan onderstaande voorwaarden wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: 146.1.1°
    text: |-
      de kanalen moeten zijn vervaardigd van een materiaal dat slechts in beperkte mate brandgevaarlijk is, dit ten
      genoegen van het Hoofd van de Scheepvaartinspectie;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: 146.1.2°
    text: zij mogen alleen worden gebruikt aan het eind van het ventilatiesysteem; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: 146.1.3°
    text: |-
      zij mogen zich, langs het kanaal gemeten, niet minder dan 600 mm vanaf een doorvoering door een schot van klasse
      «A» of «B», doorlopende plafonds van klasse «B» daaronder begrepen, bevinden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: '146.2'
    text: |-
      Indien ventilatieschachten of -kanalen ruimten aan weerszijden van schotten of dekken van klasse «A» bedienen,
      moeten kleppen zijn aangebracht ter voorkoming van verspreiding van vuur en rook van de ene ruimte naar de andere.
      Handbedienbare kleppen moeten aan beide zijden van het schot of het dek geopend en gesloten kunnen worden. Indien
      de oppervlakte van de dwarsdoorsnede van dergelijke schachten of kanalen meer dan 0,075 m2 bedraagt, moeten
      automatisch sluitende kleppen zijn aangebracht, die tevens aan beide zijden van het schot met de hand kunnen worden
      gesloten. De kleppen moeten zijn voorzien van een standaanwijzer die aangeeft of de klep geopend of gesloten is.
      Ter plaatse van schot- en dekdoorvoeringen moeten ventilatieschachten of -kanalen voldoen aan het bepaalde onder
      2.2.1 en 2.2.2.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: '146.2'
    text: |-
      Indien ventilatieschachten of -kanalen ruimten bedienen welke alleen aan één zijde van schotten of dekken van
      klasse «A» zijn gelegen en een dwarsdoorsnede hebben van meer dan 0,02 m2, moet aan het volgende zijn voldaan:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: 146.2.1°
    text: |-
      in de doorvoeringen voor de kanalen in schotten of dekken van klasse «A» moet een stalen ommantelingskoker zijn
      aangebracht, tenzij de kanalen ter plaatse van de doorvoeringen van staal zijn. De ommantelingskoker moet een
      dikte van ten minste 3 mm en een lengte van ten minste 900 mm hebben. Bij doorvoering door een schot verdient het
      aanbeveling deze lengte gelijkelijk over beide zijden van het schot te verdelen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: 146.2.2°
    text: |-
      de kanalen moeten, indien van toepassing, ter plaatse van de doorvoering zijn voorzien van een brandisolatie.
      Het aldus geïsoleerde kanaal moet ten minste dezelfde brandwerendheid hebben als het schot of dek waardoor het
      kanaal is gevoerd. Het Hoofd van de Scheepvaartinspectie kan een door hem gelijkwaardig geachte beveiliging van de
      doorvoering toestaan;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: 146.2.3°
    text: |-
      kanalen waarvan de oppervlakte van de dwarsdoorsnede meer dan 0,075 m2 bedraagt, moeten, in aanvulling op het
      bepaalde onder 2.2.1 en 2.2.2, zijn voorzien van brandkleppen. De brandklep moet automatisch werkend zijn, doch
      moet tevens aan beide zijden van het schot of dek met de hand kunnen worden gesloten. De klep moet zijn voorzien
      van een standaanwijzer die aangeeft of de klep geopend of gesloten is. Brandkleppen zijn echter niet vereist,
      indien kanalen door ruimten lopen die zijn omsloten door schotten van klasse «A» en die niet door deze kanalen
      worden bediend, mits deze kanalen dezelfde brandwerendheid hebben als de schotten waar doorheen zij gevoerd worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: '146.2'
    text: |-
      Ventilatiekanalen voor ruimten voor machines van categorie A of voor kombuizen mogen over het algemeen niet door
      ruimten voor accommodatie, dienstruimten of controlestations lopen. Het Hoofd van de Scheepvaartinspectie kan
      evenwel toestaan dat deze ventilatiekanalen door de bovengenoemde ruimten lopen, mits zij zijn vervaardigd van
      staal of ander, gelijkwaardig materiaal en zodanig zijn uitgevoerd dat de brandwerendheid van schotten en dekken
      niet vermindert.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: '146.2'
    text: |-
      Ventilatiekanalen voor ruimten voor accommodatie, dienstruimten of controlestations mogen over het algemeen niet
      door ruimten voor machines van categorie A of door kombuizen lopen. Het Hoofd van de Scheepvaartinspectie kan
      evenwel toestaan dat deze ventilatiekanalen door de bovengenoemde ruimten lopen, mits zij zijn vervaardigd van
      staal of ander, gelijkwaardig materiaal en zodanig zijn uitgevoerd dat de brandwerendheid van schotten en dekken
      niet vermindert.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: '146.2'
    text: |-
      Indien ventilatiekanalen waarvan de oppervlakte van de dwarsdoorsnede meer dan 0,02 m2 bedraagt, door schotten van
      klasse «B» gaan, moeten de openingen zijn voorzien van stalen ommantelingskokers die een lengte van ten minste 900
      mm moeten hebben, tenzij de kanalen over dezelfde lengte ter plaatse van de doorvoering zijn vervaardigd van staal.
      Deze lengte moet, waar mogelijk, gelijkelijk over beide zijden van het schot van klasse «B» zijn verdeeld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: '146.2'
    text: |-
      Al het mogelijke moet worden gedaan om te bereiken, dat in controlestations die buiten ruimten voor machines zijn
      gelegen, ventilatie, zicht en afwezigheid van rook worden gehandhaafd, zodat in geval van brand de werktuigen en
      toestellen daarin op deugdelijke wijze blijven werken en gecontroleerd kunnen worden. Een extra gescheiden systeem
      van luchttoevoer moet zijn aangebracht; de inlaatopeningen van de beide systemen van luchttoevoer moeten zo zijn
      gelegen, dat het gevaar dat zij gelijktijdig rook aanzuigen tot een minimum beperkt blijft. Dergelijke eisen
      behoeven niet te worden gesteld aan controlestations, gelegen op en uitgang verlenend naar een open dek, of daar
      waar plaatselijke afsluitmiddelen zijn aangebracht die even doeltreffend zijn, dit ter beoordeling van het Hoofd
      van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: '146.2'
    text: |-
      Indien kokers van afvoerkappen boven fornuizen door ruimten voor accommodatie of ruimten met brandbare materialen
      lopen, moeten zij zijn geconstrueerd als schotten van klasse «A». Elke afvoerkoker moet zijn uitgerust met:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: 146.2.1°
    text: een vetvanger die gemakkelijk kan worden verwijderd voor reiniging;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: 146.2.2°
    text: een brandklep in het onderste deel van de koker;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: 146.2.3°
    text: een inrichting die vanuit het kombuis kan worden bediend voor het stoppen van de afzuigventilator; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: 146.2.4°
    text: |-
      een vast aangebrachte inrichting om een brand in de koker te blussen, tenzij naar het oordeel van het Hoofd van de
      Scheepvaartinspectie het aanbrengen van een dergelijke inrichting op een vaartuig, waarvan de lengte minder dan 75
      m bedraagt, niet praktisch uitvoerbaar is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: '146.3'
    text: |-
      De hoofdin- en uitlaten van alle ventilatiesystemen moeten buiten de ruimten die worden geventileerd, kunnen worden
      gesloten. Toestellen voor mechanische ventilatie van ruimten voor accommodatie, dienstruimten, controlestations
      en ruimten voor machines moeten vanaf een gemakkelijk bereikbare plaats buiten de ruimten die zij bedienen, kunnen
      worden gestopt. Deze plaats moet zodanig zijn gelegen dat die niet gemakkelijk onbereikbaar wordt in geval van
      brand in de ruimten die worden bediend. De inrichting waarmee de toestellen voor mechanische ventilatie van de
      ruimten voor machines kunnen worden gestopt, moet geheel gescheiden zijn van die, waarmee de ventilatie van andere
      ruimten kan worden gestopt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: '146.4'
    text: |-
      Middelen moeten aanwezig zijn om de ringvormige ruimten rond schoorstenen vanaf een veilige plaats te kunnen
      sluiten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: '146.5'
    text: |-
      Ventilatiesystemen die ruimten voor machines bedienen, moeten onafhankelijk zijn van systemen die andere ruimten
      bedienen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: '146.6'
    text: |-
      Bergplaatsen waarin zich aanzienlijke hoeveelheden gemakkelijk ontvlambare stoffen bevinden, moeten zijn voorzien
      van ventilatie-inrichtingen die gescheiden zijn van andere ventilatiesystemen. De ventilatie moet plaatsvinden op
      hoog en op laag niveau. De in- en uitlaten van de ventilatoren moeten op een veilige plaats zijn aangebracht en
      zijn voorzien van vlamkerende inrichtingen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel146
  - number: '147.1'
    text: |-
      De verwarming van ruimten voor accommodatie, dienstruimten en controlestations dient te geschieden door toevoer van
      stoom, heet water, warme lucht of elektriciteit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel147
  - number: '147.2'
    text: |-
      Verwarmings- en kooktoestellen moeten vast zijn opgesteld en moeten zo zijn ingericht dat het brandgevaar tot een
      minimum is beperkt. Deze toestellen mogen niet zijn voorzien van een verwarmingselement dat stoffen in de directe
      omgeving kan doen schroeien of in brand doen geraken door de door het element geleverde hitte.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel147
  - number: '147.3'
    text: |-
      De constructie en opstelling van oliekachels moeten voldoen aan door het Hoofd van de Scheepvaartinspectie te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel147
  - number: '147.4'
    text: |-
      Propaan- en butaaninstallaties voor huishoudelijke doeleinden moeten voldoen aan door het Hoofd van de
      Scheepvaartinspectie te stellen regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel147
  - number: '148.1'
    text: |-
      Alle blootgestelde oppervlakken in gangen en ingesloten ruimten voor trappen, alsmede oppervlakken, met inbegrip
      van het daarmee verbonden grondhout, in verborgen of ontoegankelijke plaatsen in ruimten voor accommodatie,
      dienstruimten en controlestations moeten een laag vlamverspreidend vermogen hebben. Blootgestelde oppervlakken van
      plafonds in ruimten voor accommodatie, dienstruimten en controlestations moeten een laag vlamverspreidend vermogen
      hebben.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel148
  - number: '148.2'
    text: |-
      Verven, vernissen en andere stoffen voor afwerking gebruikt op blootgestelde inwendige oppervlakken, moeten zodanig
      zijn dat zij naar het oordeel van het Hoofd van de Scheepvaartinspectie geen onnodig brandgevaar opleveren, en
      mogen geen overmatige hoeveelheden rook of giftige gassen of dampen kunnen voortbrengen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel148
  - number: '148.3'
    text: |-
      De onderste laag van dekbedekkingen in ruimten voor accommodatie, dienstruimten en controlestations moet van
      goedgekeurd materiaal zijn dat noch gemakkelijk kan ontbranden, noch aanleiding kan geven tot vergiftigings- of
      explosiegevaar bij verhoogde temperaturen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel148
  - number: '148.4'
    text: |-
      Wanneer schotten of dekken van klasse «A» of «B» zijn doorboord voor het doorvoeren van elektrische leidingen,
      pijpen, schachten, kanalen en dergelijke, of voor het aanbrengen van uitmondingen van het ventilatiesysteem,
      verlichtingsarmaturen en soortgelijke inrichtingen, moeten zodanige maatregelen zijn getroffen dat de
      brandwerendheid van de schotten of dekken niet vermindert.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel148
  - number: '148.5'
    text: |-
      In ruimten voor accommodatie, dienstruimten en controlestations moeten pijpen die door schotten of dekken
      van klasse «A» of «B» zijn gevoerd, van goedgekeurde materialen zijn vervaardigd, rekening houdende met de
      temperatuur waaraan de betrokken schotten of dekken weerstand moeten kunnen bieden. Indien door het Hoofd van
      de Scheepvaartinspectie wordt toegestaan dat door ruimten voor accommodatie en dienstruimten olie of brandbare
      vloeistoffen worden gevoerd, moeten de pijpen waardoor die olie of brandbare vloeistoffen worden gevoerd van
      goedgekeurd materiaal zijn vervaardigd, rekening houdende met het brandgevaar.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel148
  - number: '148.5'
    text: |-
      Materialen die gemakkelijk onbruikbaar worden door warmte, mogen niet worden gebruikt voor spuipijpen, sanitaire
      uitlaten en andere uitlaten, die dicht bij de lastlijn liggen en waarvan smelten, in geval van brand, gevaar voor
      instromen van water zou meebrengen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel148
  - number: '148.6'
    text: Filmmateriaal op basis van cellulosenitraat mag niet in cinematografische installaties worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel148
  - number: '148.7'
    text: |-
      Afvalbakken, andere dan die worden gebruikt bij de verwerking van vis, moeten zijn vervaardigd van onbrandbare
      materialen en mogen geen openingen in de zijkanten of bodem hebben.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel148
  - number: '148.8'
    text: |-
      Werktuigen voor de aandrijving van brandstoftrimpompen, pompen van oliestookinrichtingen en dergelijke
      brandstofpompen moeten zijn voorzien van afstandsbedieningsinrichtingen welke zijn aangebracht buiten de
      desbetreffende ruimten, zodat bedoelde werktuigen kunnen worden stopgezet bij het uitbreken van brand in de ruimte
      waarin zij zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel148
  - number: '148.9'
    text: Waar nodig moeten lekbakken zijn aangebracht, teneinde te voorkomen dat olie naar de vullings kan vloeien.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel148
  - number: '148.10'
    text: Brandbare isolatie in visruimen moet door een goed afsluitende bekleding zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel148
  - number: '149.1'
    text: |-
      Flessen bestemd voor samengeperste, vloeibaar gemaakte of onder druk opgeloste gassen, waaronder begrepen
      ontvlambare en andere gevaarlijke gassen, alsmede de bijbehorende installaties, moeten voldoen aan de door het
      Hoofd van de Scheepvaartinspectie te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel149
  - number: '149.2'
    text: |-
      Ruimten waarin gemakkelijk ontvlambare vloeistoffen, zoals vluchtige verfstoffen, paraffine en dergelijke
      zijn opgeslagen, mogen uitsluitend zijn voorzien van directe toegangen vanaf blootgestelde dekken. Wanneer
      begrenzingsschotten van dergelijke ruimten grenzen aan andere omsloten ruimten, moeten deze schotten gasdicht zijn
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel149
  - number: '149.3'
    text: |-
      Elektrische bedrading en aansluitingen zijn niet toegestaan binnen ruimten welke worden gebruikt voor het bergen
      van gemakkelijk ontvlambare vloeistoffen, tenzij benodigd binnen die ruimten. In dat geval moeten de elektrische
      aansluitingen ten genoegen van het Hoofd van de Scheepvaartinspectie geschikt zijn voor gebruik in een ontvlambare
      atmosfeer. Warmtebronnen mogen zich niet dicht bij dergelijke ruimten bevinden en opschriften met «niet roken» en
      «geen open vuur» moeten zijn aangebracht op een doelmatige plaats.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel149
  - number: '149.4'
    text: |-
      Elk soort samengeperst gas moet afzonderlijk zijn opgeslagen. Ruimten die voor opslag van dergelijke gassen
      worden gebruikt, mogen niet worden gebruikt voor het opslaan van brandbare produkten, noch voor gereedschappen of
      onderdelen die geen deel uitmaken van het gasdistributiesysteem. Het Hoofd van de Scheepvaartinspectie kan echter
      met inachtneming van de kenmerkende eigenschappen, hoeveelheid en voorgenomen gebruik van dergelijke samengeperste
      gassen, verlichting van deze voorschriften toestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel149
  - number: '150.1'
    text: |-
      In en vanuit alle ruimten voor accommodatie en ruimten waarin door de bemanning onder normale omstandigheden dienst
      wordt gedaan, andere dan ruimten voor machines, moeten trappen en ladders zijn aangebracht waarlangs het open dek
      en vervolgens de groepsreddingmiddelen gemakkelijk kunnen worden bereikt. In het bijzonder moet aan de volgende
      bepalingen zijn voldaan:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel150
  - number: 150.1.1°
    text: |-
      op elk dek waarop zich ruimten voor accommodatie bevinden, moeten ten minste twee, zo ver mogelijk van elkaar
      verwijderde voorzieningen voor ontsnapping zijn aangebracht. De normale voorzieningen voor toegang tot elke
      besloten ruimte of groep van ruimten mogen hieronder worden begrepen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel150
  - number: 150.1.2.1°
    text: |-
      onder het blootgestelde dek moet de hoofdvoorziening voor ontsnapping bestaan uit een trap, terwijl de tweede
      voorziening voor ontsnapping mag bestaan uit een schacht of trap; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel150
  - number: 150.1.2.2°
    text: |-
      boven het blootgestelde dek moeten de voorzieningen voor ontsnapping bestaan uit trappen of deuren naar een open
      dek, dan wel uit een combinatie van beide;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel150
  - number: 150.1.3°
    text: |-
      bij wijze van uitzondering kan het Hoofd van de Scheepvaartinspectie toestaan dat slechts een voorziening voor
      ontsnapping is aangebracht, indien de aard en de plaats van de ruimten en het aantal van de personen die in normale
      omstandigheden daarin verblijven of dienst doen, daartoe aanleiding geven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel150
  - number: 150.1.4°
    text: doodlopende gangen met een lengte van meer dan 7 m zijn niet toegestaan;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel150
  - number: 150.1.5°
    text: |-
      de afmetingen van en de wijze waarop de voorzieningen voor ontsnapping zijn uitgevoerd, dienen ten genoegen van het
      Hoofd van de Scheepvaartinspectie te zijn; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel150
  - number: 150.1.6°
    text: |-
      indien een radiotelegraafstation geen rechtstreekse toegang tot het open dek heeft, moeten ten genoegen van het
      Hoofd van de Scheepvaartinspectie twee voorzieningen voor ontsnapping zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel150
  - number: 150.1.7°
    text: |-
      voorzieningen voor ontsnapping zijn op de juiste plaats voorzien van signaleringen die voldoen aan bij ministeriële
      regeling vast te stellen nadere regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel150
  - number: '150.2'
    text: |-
      In elke ruimte voor machines van categorie A moeten twee voorzieningen voor ontsnapping zijn aangebracht, die
      moeten bestaan uit hetzij:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel150
  - number: 150.2.1°
    text: |-
      twee stel stalen ladders, aangebracht op een zo groot mogelijke onderlinge afstand, die leiden naar eveneens zo
      ver mogelijk van elkaar verwijderde deuren in het bovenste gedeelte van de ruimte vanwaar het open dek kan worden
      bereikt. In het algemeen moet een van deze ladders een ononderbroken bescherming tegen brand geven vanaf het
      onderste gedeelte van de ruimte tot een veilige plaats buiten de ruimte. Deze bescherming moet van staal zijn,
      waar nodig geisoleerd ten genoegen van het Hoofd van de Scheepvaartinspectie en aan de onderzijde voorzien van
      een zelfsluitende stalen deur. Het Hoofd van de Scheepvaartinspectie kan toestaan dat een zodanige bescherming
      niet wordt aangebracht, indien de inrichting en de afmetingen van de ruimte voor machines zodanig zijn, dat in een
      veilige vluchtweg uit het onderste gedeelte van deze ruimte is voorzien; hetzij
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel150
  - number: 150.2.2°
    text: |-
      een stel stalen ladders, dat leidt naar een deur in het bovenste gedeelte van de ruimte, vanwaar het open dek kan
      worden bereikt. Bovendien moet in het onderste gedeelte van de ruimte, ruimschoots verwijderd van deze ladder, een
      stalen deur zijn aangebracht, die aan beide zijden kan worden bediend en die een veilige vluchtweg biedt vanuit het
      onderste gedeelte van de ruimte naar het open dek.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel150
  - number: '150.3'
    text: |-
      Vanuit ruimten voor machines, andere dan die van categorie A, moet ten genoegen van het Hoofd van de
      Scheepvaartinspectie in veilige vluchtwegen zijn voorzien, daarbij rekening houdend met de aard en de ligging van
      de betreffende ruimte alsmede of daarin onder normale omstandigheden personen dienst doen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel150
  - number: '150.4'
    text: Liften mogen niet worden beschouwd als een van de vereiste voorzieningen voor ontsnapping.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel150
  - number: '151.1'
    text: |-
      Op vaartuigen waar methode II F wordt toegepast, moet een automatische sprinkler-, brandalarm- en
      brandontdekkingsinstallatie van een goedgekeurd type zijn aangebracht, die voldoet aan de bepalingen van dit
      artikel. Deze installatie moet op zodanige wijze zijn aangebracht, dat ruimten voor accommodatie en dienstruimten,
      met uitzondering van ruimten die vrijwel geen brandgevaar opleveren, zoals lege ruimten en sanitaire ruimten,
      worden beschermd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.2'
    text: |-
      De installatie dient te allen tijde voor onmiddellijk gebruik gereed te zijn en generlei handeling van de zijde
      van de bemanning moet nodig zijn om de installatie in werking te stellen. De installatie moet van het natte-
      pijp-type zijn, doch kleine blootgestelde delen kunnen van het droge-pijp-type zijn, indien dit naar het oordeel
      van het Hoofd van de Scheepvaartinspectie een noodzakelijke voorzorg is. Delen van het systeem die kunnen worden
      blootgesteld aan temperaturen beneden het vriespunt, dienen op passende wijze tegen bevriezing te zijn beschermd.
      De installatie moet steeds onder voldoende druk staan en een voortdurende watertoevoer moet zijn verzekerd, zoals
      vereist in het zesde lid, onder 2.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.2'
    text: |-
      In elke sprinklersectie moeten middelen zijn aangebracht voor het automatisch geven van zichtbare en hoorbare
      signalen op een of meer alarmpanelen, wanneer een sprinkler gaat werken. Deze alarmpanelen moeten een aanwijzing
      geven in welke door de installatie beschermde sectie zich brand voordoet en moeten zijn gecentraliseerd op de brug;
      bovendien moeten zichtbare en hoorbare signalen afkomstig van het alarmpaneel op een zodanige plaats buiten het
      stuurhuis waarneembaar zijn, dat zeker is dat de brandmelding onmiddellijk door de bemanning wordt opgemerkt. Een
      dergelijke alarminstallatie moet zodanig zijn geconstrueerd, dat eventueel in de installatie optredende defecten
      worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.3'
    text: De sprinklers moeten zijn gegroepeerd in afzonderlijke secties, elk niet meer dan 200 sprinklers omvattend.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.3'
    text: |-
      Elke sprinklersectie moet door middel van slechts één afsluiter kunnen worden afgescheiden van het overige deel
      van de installatie. De afsluiter in elke sectie moet gemakkelijk bereikbaar zijn en de plaats ervan moet duidelijk
      en duurzaam zijn aangegeven. Voorzieningen moeten zijn getroffen teneinde te voorkomen dat de afsluiters door een
      onbevoegde kunnen worden bediend.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.3'
    text: |-
      Een manometer die de druk in de installatie aangeeft, moet zijn aangebracht bij iedere sectie-afsluiter en op een
      centrale plaats.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.3'
    text: |-
      De sprinklers moeten bestand zijn tegen corrosie. In ruimten voor accommodatie en dienstruimten moeten de
      sprinklers gaan werken bij een temperatuur tussen 68°C en 79°C, behoudens dat in ruimten zoals droogkamers, waar
      een hoge temperatuur kan worden verwacht, de temperatuur waarbij de sprinkler gaat werken, kan worden verhoogd tot
      niet meer dan 30°C boven de maximumtemperatuur bij het plafond.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.3'
    text: |-
      Op of bij elk alarmpaneel moeten duidelijk zijn aangegeven de door de installatie bestreken ruimten en de plaats
      van de betreffende sprinklersectie ten opzichte van de overige secties. Passende instructies voor de beproeving en
      het onderhoud moeten aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.4'
    text: |-
      De sprinklers moeten hoog in de ruimte zijn aangebracht in een zodanig patroon dat de levering van een gemiddelde
      hoeveelheid water van niet minder dan 5 l/m2/min. wordt gehandhaafd over de nominale oppervlakte die door de
      sprinklers wordt bestreken. Het Hoofd van de Scheepvaartinspectie kan het gebruik van sprinklers toestaan die
      een andere hoeveelheid water, op de juiste wijze verdeeld, leveren en waarvan ten genoegen van genoemd hoofd is
      aangetoond dat zij niet minder doeltreffend zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.5'
    text: |-
      Een druktank moet zijn aangebracht met een inhoud gelijk aan ten minste het dubbele van de hoeveelheid water zoals
      aangegeven in dit lid. De tank moet permanent een hoeveelheid zoet water bevatten die gelijk is aan de hoeveelheid
      water die in één minuut zou worden geleverd door de pomp bedoeld in het zesde lid, onder 2. De inrichting moet erin
      voorzien dat een zodanige luchtdruk in de tank wordt gehandhaafd, dat wordt gewaarborgd dat, nadat de permanente
      hoeveelheid zoet water uit de tank is gedreven, de druk niet minder zal zijn dan de werkdruk van de sprinkler,
      vermeerderd met de statische druk van een kolom water gemeten van de bodem van de tank tot de hoogste sprinkler in
      het systeem. Passende middelen moeten aanwezig zijn voor de aanvulling van de onder druk staande lucht en van de
      zoetwatervoorraad in de tank. Een peilglas moet zijn aangebracht dat het waterpeil in de tank aangeeft.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.5'
    text: Middelen moeten aanwezig zijn om te verhinderen dat zeewater in de tank kan stromen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.6'
    text: |-
      Een onafhankelijke mechanisch aangedreven pomp moet aanwezig zijn, die uitsluitend bestemd is voor het automatisch
      doen doorgaan van de afgifte van water uit de sprinklers. De pomp moet automatisch in werking treden door een
      drukval in het systeem voordat de permanente hoeveelheid zoet water in de druktank volledig is uitgeput.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.6'
    text: |-
      De pomp en het leidingstelsel moeten in staat zijn de nodige druk ter hoogte van de hoogste sprinkler te handhaven,
      teneinde een voortdurende afgifte van water te verzekeren die voldoende is voor het gelijktijdig bestrijken van
      de maximum oppervlakte die wordt begrensd door onbrandbare schotten van klasse «A» en «B» of van een oppervlakte
      van 280 m2, waarbij de kleinste oppervlakte mag worden aangehouden, bij een hoeveelheid water per tijdseenheid als
      aangegeven in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.6'
    text: |-
      De pomp moet aan de drukzijde zijn voorzien van een proefkraan met een korte open afvoerpijp. De effectieve
      doorstroomopening van de kraan en de pijp moet groot genoeg zijn om de vereiste pompcapaciteit af te voeren bij een
      druk in het systeem, zoals die is omschreven in het vijfde lid, onder 1.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.6'
    text: |-
      De zee-inlaat van de pomp moet, indien mogelijk, in dezelfde ruimte zijn gelegen als waarin de pomp is opgesteld,
      en zodanig zijn geplaatst dat het bij het te water liggende vaartuig niet nodig is de toevoer van zeewater naar de
      pomp af te sluiten voor andere doeleinden dan inspectie of reparatie van de pomp.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.7'
    text: |-
      De sprinklerpomp en -tank moeten zijn opgesteld op een redelijke afstand van ruimten voor machines van categorie A.
      Zij mogen niet zijn opgesteld in een ruimte die door het sprinklersysteem moet worden beschermd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.8'
    text: |-
      Ten minste twee krachtbronnen moeten aanwezig zijn voor de aandrijving van de sprinklerpomp en voor de voeding van
      de automatische brandalarm- en brandontdekkingsinstallatie. Indien de pomp door een elektromotor wordt aangedreven,
      moet deze zijn aangesloten op de elektrische hoofdkrachtbron die door ten minste twee generatoren moet kunnen
      worden gevoed.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.8'
    text: |-
      De voedingsleidingen moeten zodanig zijn aangelegd dat zij niet door kombuizen, ruimten voor machines en andere
      ingesloten ruimten met een hoog brandrisico lopen, behoudens voor zover het noodzakelijk is om het desbetreffende
      schakelbord te bereiken. Een van de krachtbronnen voor de brandalarm- en brandontdekkingsinstallatie moet een
      noodkrachtbron zijn. Indien een van de krachtbronnen voor de pomp een verbrandingsmotor is, moet de opstelling
      hiervan voldoen aan het bepaalde in het zevende lid en tevens zo zijn gelegen, dat de luchttoevoer naar de
      desbetreffende motor niet wordt beïnvloed door een brand in een beschermde ruimte.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.9'
    text: |-
      De sprinklerinstallatie moet een verbinding hebben met de hoofdbrandblusleiding van het vaartuig door middel van
      een afsluiter met een losse klep die is voorzien van een borginrichting met slot, waardoor het terugvloeien van
      water vanuit de sprinklerinstallatie naar de hoofdbrandblusleiding wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.10'
    text: |-
      Een proefkraan moet aanwezig zijn voor de beproeving van het automatische alarm voor elke sprinklersectie, waardoor
      een hoeveelheid water kan worden afgevoerd die gelijkwaardig is aan de werking van een sprinkler. De proefkraan
      voor elke sectie moet bij de sectie-afsluiter zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.10'
    text: |-
      Middelen moeten aanwezig zijn voor de beproeving van de automatische werking van de pomp door de druk in het
      systeem te verminderen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.10'
    text: |-
      Schakelaars moeten aanwezig zijn bij een van de alarmpanelen als bedoeld in het tweede lid, onder 2, waarmede de
      hoorbare en zichtbare alarmen van elke sprinklersectie kunnen worden beproefd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '151.11'
    text: |-
      Voor elke sprinklersectie moet een door het Hoofd van de Scheepvaartinspectie te bepalen aantal reserve
      sprinklerkoppen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel151
  - number: '152.1'
    text: |-
      Op vaartuigen waar methode III F wordt toegepast, moet een automatische brandalarm- en brandontdekkingsinstallatie
      van een goedgekeurd type zijn aangebracht, die voldoet aan het bepaalde in dit artikel. Deze installatie moet op
      zodanige wijze zijn aangebracht, dat de aanwezigheid van brand in alle ruimten voor accommodatie, dienstruimten
      en controlestations met uitzondering van ruimten die vrijwel geen brandgevaar opleveren, zoals lege ruimten en
      sanitaire ruimten, kan worden ontdekt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel152
  - number: '152.2'
    text: |-
      De installatie moet te allen tijde voor onmiddellijk gebruik gereed zijn en generlei handeling van de zijde van de
      bemanning moet nodig zijn om de installatie in werking te stellen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel152
  - number: '152.2'
    text: |-
      In elke sectie als bedoeld in het derde lid moeten middelen zijn aangebracht voor het automatisch geven van
      zichtbare en hoorbare alarmsignalen op een of meer alarmpanelen, wanneer een branddetector gaat werken. Deze
      alarmpanelen moeten een aanwijzing geven in welke door de installatie beschermde sectie zich brand voordoet
      en moeten zijn gecentraliseerd op de brug en op zodanige andere plaatsen, dat zeker is dat elk alarm van de
      installatie onmiddellijk door de bemanning wordt opgemerkt. Bovendien moeten voorzieningen zijn aangebracht
      teneinde zeker te stellen dat een hoorbaar alarmsignaal wordt gegeven op het dek waarop de brand is ontdekt. Een
      dergelijke alarminstallatie moet zodanig zijn geconstrueerd, dat eventueel in de installatie optredende defecten
      worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel152
  - number: '152.3'
    text: |-
      De branddetectors moeten zijn gegroepeerd in afzonderlijke secties, die zich uitstrekken tot niet meer dan 50
      ruimten, waarin een dergelijke installatie is aangebracht en die niet meer dan 100 detectors mogen omvatten. De
      branddetectors moeten op zodanige wijze in zones zijn ondergebracht, dat kan worden aangegeven op welk dek zich
      brand voordoet.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel152
  - number: '152.4'
    text: |-
      De installatie moet in werking worden gesteld door een abnormale temperatuur van de lucht, door een abnormale
      rookconcentratie of door andere factoren, die een begin van brand in een te beschermen ruimte aanduiden. De
      installaties die reageren op de temperatuur van de lucht, mogen niet in werking treden bij een temperatuur
      van minder dan 57°C en moeten in werking treden bij een temperatuur van niet meer dan 74°C, wanneer de
      temperatuurstijging tot die waarden niet meer is dan 1°C/min. Het Hoofd van de Scheepvaartinspectie kan toestaan
      dat in ruimten zoals droogkamers, waar hoge omgevingstemperaturen kunnen worden verwacht, de temperatuur waarbij
      de installatie in werking treedt, wordt verhoogd tot niet meer dan 30°C boven de maximumtemperatuur bij het
      plafond. Installaties die reageren op rookconcentratie, moeten in werking treden door de vermindering van de
      intensiteit van een uitgezonden lichtstraal in een door het Hoofd van de Scheepvaartinspectie te bepalen mate.
      Andere even doeltreffende methoden voor inwerkingstelling van de installatie kunnen door het Hoofd van de
      Scheepvaartinspectie worden aanvaard. De ontdekkingsinstallatie mag niet voor andere doeleinden worden gebruikt dan
      voor brandontdekking.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel152
  - number: '152.5'
    text: |-
      De branddetectors moeten zodanig zijn uitgevoerd dat zij het alarm in werking stellen door hetzij openen of sluiten
      van contacten, hetzij op een andere doelmatige wijze. Zij moeten hoog in de ruimte zijn geplaatst en op deugdelijke
      wijze zijn beschermd tegen stoten en mogelijke andere oorzaken van beschadiging. Zij moeten bestand zijn tegen de
      inwerking van zeelucht. Zij moeten op een open plaats zijn aangebracht, vrij van dekbalken en andere voorwerpen
      die het toestromen van hete gassen of rook naar het gevoelige element zouden kunnen belemmeren. Detectors die in
      werking treden door het sluiten van contacten, moeten van een type zijn waarbij de contacten zijn afgesloten van de
      buitenlucht. Voorzieningen moeten aanwezig zijn om het systeem voortdurend op defecten te kunnen controleren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel152
  - number: '152.6'
    text: |-
      In elke ruimte waar voorzieningen van brandontdekking zijn vereist, moet ten minste een detector zijn aangebracht,
      met dien verstande dat voor elke 37 m2 dekoppervlakte tenminste een detector aanwezig moet zijn. In grote ruimten
      moeten de detectors zijn aangebracht in een regelmatig patroon, zodat geen enkele detector meer dan 9 m van een
      andere detector of meer dan 4,5 m van een schot is verwijderd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel152
  - number: '152.7'
    text: |-
      Ten minste twee krachtbronnen moeten aanwezig zijn voor de elektrische apparatuur, nodig voor het functioneren
      van de brandalarm- en brandontdekkingsinstallatie. Een van deze krachtbronnen moet een noodkrachtbron zijn. De
      voeding moet geschieden door uitsluitend voor dit doel bestemde voedingsleidingen. De voedingsleidingen moeten
      zijn aangesloten op een omschakelaar in het controlestation voor het brandontdekkingssysteem. De leidingen moeten
      zodanig zijn aangelegd dat zij niet door kombuizen, ruimten voor machines en andere besloten ruimten met een groot
      brandrisico lopen, behoudens voor zover dergelijke leidingen nodig zijn voor brandontdekking in deze ruimte of om
      het betreffende schakelbord te bereiken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel152
  - number: '152.8'
    text: |-
      Op of bij elk alarmpaneel moeten de door de installatie bestreken ruimten en de ligging van de betreffende zone van
      het ontdekkingssysteem duidelijk zijn aangegeven. Instructies voor de beproeving moeten aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel152
  - number: '152.8'
    text: |-
      Middelen moeten aanwezig zijn waarmede hete lucht of rook op detectors kan worden gericht, teneinde de goede
      werking daarvan en die van de alarmpanelen te beproeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel152
  - number: '152.9'
    text: |-
      Voor elke sectie van de brandontdekkingsinstallatie moet een door het Hoofd van de Scheepvaartinspectie te bepalen
      aantal reserve detectorelementen aan boord aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel152
  - number: '153'
    text: |-
      Laadruimten die bestemd zijn voor ladingen die in hoge mate brandgevaarlijk zijn, moeten zijn beschermd door een
      vast aangebrachte brandblusinstallatie met gas als blusstof of door een brandblusinstallatie die naar het oordeel
      van het Hoofd van de Scheepvaartinspectie een gelijkwaardige bescherming biedt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel153
  - number: '154.1'
    text: Aan boord van een vaartuig moeten ten minste twee brandbluspompen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel154
  - number: '154.2'
    text: |-
      Wanneer een brand in een bepaalde afdeling alle brandbluspompen buiten werking zou kunnen stellen, moet een
      vervangend middel aanwezig zijn voor het leveren van water voor het blussen van brand. Op vaartuigen waarvan de
      lengte 75 m of meer bedraagt, moet dit vervangend middel bestaan uit een vast opgestelde, onafhankelijk aangedreven
      noodbrandbluspomp. Deze noodbrandbluspomp moet in staat zijn tot het leveren van twee stralen water, een en ander
      ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel154
  - number: '154.3'
    text: |-
      De brandbluspompen, de noodbrandbluspomp uitgezonderd, moeten in staat zijn voor brandblusdoeleinden een
      hoeveelheid water te leveren met een minimumdruk van 0,25 N/mm2, met een totale capaciteit (Q) van ten minste: Q =
      (0,15L(B+D) + 2,25)2 m3/uur. De vereiste totale capaciteit der brandbluspompen behoeft echter niet meer dan 180 m3/
      uur te bedragen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel154
  - number: '154.3'
    text: |-
      Elke voorgeschreven brandbluspomp, behalve de noodbrandbluspomp, moet een capaciteit hebben van niet minder dan 40
      percent van de onder 3.1 vereiste totale capaciteit van de brandbluspompen en moet in elk geval in staat zijn ten
      minste de in artikel 156, tweede lid, onder 1, vereiste stralen water te leveren. Deze brandbluspompen moeten in
      staat zijn de hoofdbrandblusleiding onder de in artikel 155, tweede lid, voorgeschreven voorwaarden van water te
      voorzien. Wanneer meer dan twee pompen zijn opgesteld, moet de capaciteit van die extra pompen ten genoegen van het
      Hoofd van de Scheepvaartinspectie zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel154
  - number: '154.4'
    text: |-
      Brandbluspompen moeten werktuiglijk gedreven pompen zijn die onafhankelijk van het voortstuwingswerktuig kunnen
      worden gebruikt. Sanitaire, ballast-, lens- of algemene dienstpompen mogen worden aanvaard als brandbluspompen,
      mits zij onder normale omstandigheden niet worden gebruikt voor het pompen van olie en, indien zij af en toe voor
      dit doel moeten worden gebezigd, doelmatige verwisselinrichtingen zijn aangebracht die ten genoegen van het Hoofd
      van de Scheepvaartinspectie zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel154
  - number: '154.4'
    text: |-
      Brandbluspompen moeten van ontlastkleppen zijn voorzien indien zij in staat zijn een druk te leveren die de
      druk overtreft waarvoor de brandblusleidingen, brandkranen en brandslangen zijn ontworpen. Deze ontlastkleppen
      moeten op zodanige plaats zijn aangebracht en zodanig zijn afgesteld, dat een te hoge druk in enig deel van de
      hoofdbrandblusleiding wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel154
  - number: '154.4'
    text: |-
      Werktuiglijk gedreven noodbrandbluspompen moeten zelfaanzuigende pompen zijn die zijn uitgerust met een eigen
      dieselmotor en brandstoftoevoer, welke zijn opgesteld op een toegankelijke plaats buiten de ruimte waarin de
      overige brandbluspompen zijn ondergebracht. De aandrijving van de noodbrandbluspomp mag elektrisch geschieden, mits
      voldaan wordt aan het bepaalde in artikel 108. De werking van de noodbrandbluspomp moet voor ten minste drie uur
      zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel154
  - number: '154.4'
    text: |-
      Noodbrandbluspompen, zee-inlaatafsluiters en andere noodzakelijke afsluiters moeten kunnen worden bediend vanaf
      een plaats die is gelegen buiten de ruimten waarin de overige brandbluspompen zijn ondergebracht. Deze plaats moet
      zodanig zijn dat het niet waarschijnlijk is dat zij in geval van brand in de bedoelde ruimten onbereikbaar wordt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel154
  - number: '155.1'
    text: Aan boord van een vaartuig moet een hoofdbrandblusleiding zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel155
  - number: '155.1'
    text: |-
      Hoofdbrandblusleidingen mogen geen andere aansluitingen hebben dan die, welke voor de brandbestrijding zijn
      vereist, met uitzondering van aansluitingen die zijn aangebracht om het dek te wassen, de ankerkettingen schoon te
      spuiten of een ejector voor de kettingbak te bedienen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel155
  - number: '155.1'
    text: |-
      In hoofdbrandblusleidingen moeten aftapkranen zijn aangebracht op doelmatige plaatsen, waardoor beschadiging door
      bevriezing kan worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel155
  - number: '155.1'
    text: Hoofdbrandblusleidingen moeten zijn vervaardigd van materialen die in voldoende mate hittebestendig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel155
  - number: '155.2'
    text: |-
      De doorlaat van de hoofdbrandblusleiding en van de aftakkingen daarvan moet voldoende groot zijn voor een
      doelmatige verwerking van de maximaal voorgeschreven opbrengst van twee gelijktijdig werkende brandbluspompen. De
      doorlaat behoeft echter niet groter te zijn dan voor de verwerking van 140 m3/uur nodig is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel155
  - number: '155.2'
    text: |-
      Wanneer de onder 2.1 genoemde opbrengst, geleverd door de aldaar genoemde pompen, wordt verwerkt door straalpijpen
      als omschreven in artikel 156, vijfde lid, gekoppeld aan slangen aangesloten op in elkaars nabijheid gelegen
      brandkranen, moet bij alle brandkranen ten minste een druk van 0,25 N/mm2 kunnen worden gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel155
  - number: '156.1'
    text: |-
      Bij elke voorgeschreven brandkraan dient een brandslang aanwezig te zijn. Bovendien moet een reserve brandslang
      aanwezig zijn. Het Hoofd van de Scheepvaartinspectie kan een groter aantal brandslangen voorschrijven opdat,
      rekening houdende met de grootte van het vaartuig, steeds voldoende slangen beschikbaar en bereikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel156
  - number: '156.1'
    text: |-
      Brandslangen moeten zijn vervaardigd van goedgekeurd materiaal en van voldoende lengte zijn om met een waterstraal
      alle ruimten te kunnen bereiken waarvoor zij zijn bestemd. Deze lengte mag niet meer dan 20 m bedragen. Elke
      brandslang moet zijn voorzien van een straalpijp en de nodige koppelingen. Brandslangen moeten te zamen met
      de benodigde onderdelen en gereedschappen voor gebruik gereed worden gehouden op opvallende plaatsen nabij de
      brandkranen of slangaansluitingen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel156
  - number: '156.2'
    text: |-
      Het aantal en de plaats van de brandkranen moeten zodanig zijn dat met ten minste twee stralen water, niet
      afkomstig uit dezelfde brandkraan, waarbij voor een van deze stralen slechts een brandslanglengte mag worden
      gebruikt, elk deel van het vaartuig dat gedurende de vaart onder normale bedrijfsomstandigheden toegankelijk is,
      kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel156
  - number: '156.2'
    text: Een brandkraan moet zijn aangebracht bij de toegang van de ruimte die moet worden beveiligd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel156
  - number: '156.2'
    text: |-
      In ruimten voor machines van categorie A moeten ten minste twee brandkranen zijn aangebracht, waarvan een aan
      stuurboord en een aan bakboord.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel156
  - number: '156.3'
    text: |-
      Brandkranen moeten zijn vervaardigd van materialen die in voldoende mate hittebestendig zijn. Brandblusleidingen
      en brandkranen moeten zodanig zijn geplaatst dat de brandslangen gemakkelijk daaraan kunnen worden gekoppeld. Aan
      boord van vaartuigen die lading aan dek kunnen vervoeren, moet de plaats van de brandkranen altijd gemakkelijk
      bereikbaar zijn en de leidingen moeten, zoveel als praktisch mogelijk, zodanig zijn aangelegd, dat gevaar voor
      beschadiging door een dergelijke lading wordt vermeden. Tenzij bij elke brandkraan een bijbehorende brandslang met
      straalpijp aanwezig is moet elke brandslang op elke brandkraan en elke straalpijp op elke brandslang kunnen worden
      aangesloten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel156
  - number: '156.4'
    text: |-
      Elke aansluiting voor een brandslang moet zijn voorzien van een kraan of afsluiter, opdat een brandslang
      gemakkelijk en snel kan worden aan- of afgekoppeld terwijl de brandbluspompen te werk staan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel156
  - number: '156.5'
    text: |-
      Straalpijpen moeten van een goedgekeurd type zijn en moeten een standaard spuitopening hebben met een diameter van
      12, 16 of 19 mm, dan wel een doorlaat die hier nagenoeg mee overeenkomt. Het Hoofd van de Scheepvaartinspectie kan
      een grotere spuitopening toestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel156
  - number: '156.5'
    text: |-
      In ruimten voor accommodatie en dienstruimten behoeft de spuitopening van de straalpijpen niet groter te zijn dan
      12 mm.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel156
  - number: '156.5'
    text: |-
      In ruimten voor machines en op open dekken moet de diameter van de spuitopening van de straalpijpen zodanig zijn,
      dat met twee stralen water bij de druk genoemd in artikel 155, tweede lid, onder 2, met de kleinste pomp een zo
      groot mogelijke hoeveelheid water kan worden geleverd; er behoeft echter geen straalpijp te worden gebruikt met een
      spuitopening waarvan de diameter meer dan 19 mm bedraagt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel156
  - number: '156.5'
    text: |-
      Elke straalpijp moet zijn voorzien van een inrichting die het mogelijk maakt tijdens het blussen met een eenvoudige
      handbeweging over te gaan van spuiten op sproeien en omgekeerd, zonder dat daarvoor de watertoevoer naar de
      straalpijp behoeft te worden onderbroken. Tevens moet de straalpijp zijn voorzien van een inrichting om de
      watertoevoer te onderbreken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel156
  - number: '156.6'
    text: Brandkranen, slangenhaspels, brandslangkasten en dergelijke moeten in een rode kleur zijn geschilderd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel156
  - number: '157.1'
    text: |-
      Een brandblustoestel moet van een goedgekeurd type zijn. De inhoud van een voorgeschreven draagbaar
      brandblustoestel met vloeibare blusstof mag niet groter zijn dan 13,5 l en niet kleiner dan 9 l. Een
      brandblustoestel met een andere blusstof moet ten minste even goed draagbaar zijn als een toestel met vloeibare
      blusstof van 13,5 l en het blusvermogen moet ten minste gelijkwaardig zijn aan dat van een dergelijk toestel
      met een blusstof van 9 l. De gelijkwaardigheid van brandblustoestellen wordt bepaald door het Hoofd van de
      Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel157
  - number: '157.2'
    text: |-
      Het aantal aan boord aanwezige reservevullingen dient in overeenstemming te zijn met de door het Hoofd van de
      Scheepvaartinspectie te geven regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel157
  - number: '157.3'
    text: |-
      Brandblustoestellen gevuld met een blusstof die naar het oordeel van het Hoofd van de Scheepvaartinspectie, hetzij
      uit zichzelf, hetzij onder te verwachten gebruiksomstandigheden, zodanige hoeveelheden giftige gassen afgeeft dat
      dit schadelijk is voor de gezondheid, zijn aan boord niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel157
  - number: '157.4'
    text: |-
      Brandblustoestellen, zowel draagbare als niet-draagbare, moeten periodiek worden nagezien en worden onderworpen aan
      de beproevingen die door het Hoofd van de Scheepvaartinspectie zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel157
  - number: '157.5'
    text: |-
      Eén van de draagbare brandblustoestellen die voor het gebruik in een bepaalde ruimte zijn bestemd, moet nabij de
      toegang tot die ruimte zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel157
  - number: '157.6'
    text: |-
      In de nabijheid van elektrische werktuigen, schakelborden en dergelijke, mogen geen draagbare brandblustoestellen
      zijn geplaatst waarvan de blusstof de elektrische stroom geleidt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel157
  - number: '157.7'
    text: |-
      Buiten de radiohut moet nabij de toegangsdeur van deze hut een draagbaar brandblustoestel, gevuld met een de
      elektrische stroom niet geleidende blusstof, zijn opgesteld. In de radiohut, alsmede nabij een niet in de radiohut
      ondergebracht radiotelefoonstation, moet voorts ten minste een draagbaar brandblustoestel, eveneens gevuld met een
      de elektrische stroom niet geleidende blusstof, met een inhoud van ten hoogste 2 kg blusstof, zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel157
  - number: '157.8'
    text: |-
      Een speciaal, draagbaar schuimbrandblustoestel moet van een goedgekeurd type zijn en moet bestaan uit een
      luchtschuimstraalpijp van het inductortype die door middel van een brandslang kan worden verbonden met de
      hoofdbrandblusleiding, alsmede een draagbare tank die ten minste 20 l schuimvormend middel bevat en een reservetank
      met schuimvormend middel. De straalpijp moet in staat zijn doeltreffend schuim, geschikt voor het blussen van een
      oliebrand, te maken met een capaciteit van 1,5 m3/min.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel157
  - number: '157.9'
    text: Brandblustoestellen moeten in een rode kleur zijn geschilderd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel157
  - number: '157.10'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nadere regels geven ten aanzien van de plaatsing, het juiste type in
      verband met de te verwachten klasse branden en het blusvermogen van brandblustoestellen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel157
  - number: '158'
    text: |-
      Een voldoende aantal draagbare brandblustoestellen moet zijn geplaatst in controlestations, ruimten voor
      accommodatie en dienstruimten opdat ten minste een brandblustoestel met een voor de in deze ruimte te verwachten
      branden geschikte blusstof, direct beschikbaar is voor gebruik op elke plaats in deze ruimte. Het totale aantal
      brandblustoestellen voor bovengenoemde ruimten moet ten minste vijf bedragen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel158
  - number: '159.1'
    text: 'Ruimten voor machines van categorie A moeten zijn voorzien van:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: 159.1.1°
    text: 'een van de volgende vast aangebrachte brandblusinstallaties:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: 159.1.1°.1.1
    text: een sproei-installatie voor water onder druk;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: 159.1.1°.1.2
    text: een installatie met gas als blusstof;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: 159.1.1°.1.3
    text: een installatie met gehalogeniseerde koolwaterstoffen met een lage giftigheidsgraad als blusstof; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: 159.1.1°.1.4
    text: |-
      een installatie voor schuim met een hoog verschuimingsgetal; Indien ruimten voor machines aan elkaar grenzen
      en niet volkomen van elkaar zijn gescheiden of wanneer brandstofolie van een ruimte naar een andere ruimte kan
      vloeien, moeten de betrokken ruimten als één ruimte worden beschouwd. Het Hoofd van de Scheepvaartinspectie kan
      nadere regels geven ten aanzien van bedoelde brandblusinstallaties;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: 159.1.2°
    text: ten minste een speciaal draagbaar schuimbrandblustoestel dat voldoet aan het bepaalde in artikel 157, achtste lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: '159.2'
    text: |-
      Een ruimte voor machines van Categorie A waarin oliegestookte ketels of oliestookinrichtingen zijn opgesteld, moet
      in aanvulling op het bepaalde in het eerste lid tevens zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: 159.2.1°
    text: |-
      ten minste twee draagbare schuimbrandblustoestellen of daaraan gelijkwaardig gestelde brandblustoestellen op elke
      stookplaats van elk ketelruim en in elke ruimte waarin een deel van de oliestookinrichting is ondergebracht;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: 159.2.2°
    text: |-
      ten minste een schuimbrandblustoestel met een inhoud van ten minste 136 l of een daaraan gelijkwaardig gesteld
      brandblustoestel, voorzien van op haspels aangebrachte slangen die lang genoeg zijn om elk deel van de ruimte te
      kunnen bereiken;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: 159.2.3°
    text: |-
      één of meer bakken, tezamen inhoudende ten minste 0,3 m zand, met soda doordrenkt zaagsel of andere doelmatige
      stoffen op elke stookplaats, benevens schoppen om deze stoffen te verspreiden; Een draagbaar schuimbrandblustoestel
      of daaraan gelijkwaardig gesteld brandblustoestel kan hiervoor in de plaats worden gesteld; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: 159.2.4°
    text: |-
      een stoombrandblusinrichting op de onder overdruk staande luchtkanalen van ketels met geforceerde trek, indien zich
      in deze luchtkanalen lekolie kan verzamelen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: '159.3'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan, rekening houdend met de afmetingen en de aard van de ruimte die moet
      worden beschermd, vermindering van het in het tweede lid, onder 1 en 2, vereiste, toestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: '159.4'
    text: |-
      Een ruimte voor machines van categorie A waarin verbrandingsmotoren of gasturbines zijn opgesteld, moet in
      aanvulling op het bepaalde in het eerste lid, tevens zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: 159.4.1°
    text: |-
      een voldoende aantal schuimbrandblustoestellen met een inhoud van ten minste 45 l of daaraan gelijkwaardig gestelde
      brandblustoestellen om blusstof te kunnen richten op ieder deel van de brandstofsystemen, smeeroliedruksystemen,
      tandwielkasten en andere brandgevaarlijke plaatsen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: 159.4.2°
    text: |-
      een voldoende aantal draagbare schuimbrandblustoestellen of daaraan gelijkwaardig gestelde brandblustoestellen,
      die zo moeten zijn geplaatst dat geen enkel punt in de ruimte op een loopafstand van meer dan 10 m van een
      brandblustoestel is gelegen, met dien verstande dat in elke ruimte ten minste twee van deze brandblustoestellen
      aanwezig moeten zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: '159.5'
    text: |-
      Voor kleinere ruimten kan het Hoofd van de Scheepvaartinspectie afwijking van het in het vierde lid, onder 1 en 2,
      gestelde, toestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: '159.6'
    text: |-
      Ruimten voor machines waarin stoomturbines of gesloten stoommachines zijn opgesteld, gebezigd hetzij als
      hoofdvoortstuwingswerktuigen, hetzij voor andere doeleinden waarbij deze werktuigen tezamen een totaal vermogen
      hebben van 375 kW of meer, moeten zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: 159.6.1°
    text: |-
      een voldoende aantal schuimbrandblustoestellen met een inhoud van ten minste 45 l of daaraan gelijkwaardig gestelde
      brandblustoestellen, om blusstof te kunnen richten op ieder deel van het smeeroliedruksysteem, van de omkastingen
      van de onder druk gesmeerde delen van de turbines, machines of daarbij behorende tandwielkasten en andere
      brandgevaarlijke plaatsen. Deze brandblustoestellen zijn echter niet vereist, indien in dergelijke ruimten een vast
      aangebrachte brandblusinstallatie aanwezig is als bedoeld in het eerste lid, onder 1; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: 159.6.2°
    text: |-
      een voldoende aantal draagbare schuimbrandblustoestellen of daaraan gelijkwaardig gestelde brandblustoestellen,
      die zo moeten zijn geplaatst dat geen enkel punt in de ruimte op een loopafstand van meer dan 10 m van een
      brandblustoestel is gelegen, met dien verstande dat in elke ruimte ten minste twee van deze brandblustoestellen
      aanwezig moeten zijn. Het bepaalde in dit onderdeel is niet van toepassing wanneer ingevolge het bepaalde in het
      vierde lid, onder 2, reeds schuimbrandblustoestellen zijn vereist.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: '159.7'
    text: |-
      Indien naar het oordeel van het Hoofd van de Scheepvaartinspectie brandgevaar aanwezig is in ruimten voor machines
      ten aanzien waarvan geen bepaalde voorschriften omtrent brandblusmiddelen zijn gegeven in voorgaande leden, moeten
      in of dicht bij deze ruimten een zodanig aantal brandblustoestellen of andere brandblusmiddelen zijn opgesteld als
      door hem voldoende wordt geacht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: '159.8'
    text: |-
      Bij toepassing van tweetaktmotoren, moet elk van deze motoren met een vermogen van 750 kW of meer zijn voorzien van
      een inrichting om gas of stoom als blusstof toe te laten in spoelluchtleidingen, tenzij ten genoegen van het Hoofd
      van de Scheepvaartinspectie wordt aangetoond dat deze voorziening niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel159
  - number: '160'
    text: |-
      Voor een ruimte voor machines van categorie A die op een laag niveau toegankelijk is vanuit een aangrenzende
      schroefastunnel, moet - behalve een waterdichte deur -, aan de van deze ruimte voor machines afgekeerde zijde een
      lichte stalen brandwerende deur zijn aangebracht die aan beide zijden geopend moet kunnen worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel160
  - number: '161.1'
    text: |-
      Ten minste een internationale walaansluiting die voldoet aan het bepaalde in de navolgende leden, moet aanwezig
      zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel161
  - number: '161.2'
    text: |-
      De standaardafmetingen van flenzen voor de internationale walaansluiting moeten overeenstemmen met de onderstaande
      tabel:






                    Beschrijving


                    Afmeting






                    Uitwendige flensdiameter


                    178 mm




                    Inwendige flensdiameter


                    64 mm




                    Diameter van de steekcirkel der bouten


                    132 mm




                    Boutgaten


                    4 gaten van 19 mm diameter, aangebracht op onderling gelijke afstanden op de bovenstaande steekcirkel
      van de bouten, met sleuven radiaal doorgetrokken tot de omtrek.




                    Flensdikte


                    ten minste 14,5 mm




                    Bouten en moeren


                    4, elk met een diameter van 16 mm en een lengte van 50 mm
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel161
  - number: '161.3'
    text: De internationale walaansluiting moet zijn vervaardigd van materiaal, geschikt voor een werkdruk van 1,0 N/mm2.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel161
  - number: '161.4'
    text: |-
      De flens moet aan een zijde vlak zijn. Op de andere zijde moet een koppeling, passend op de brandkranen en
      brandslangen van het vaartuig, permanent zijn aangebracht. De internationale walaansluiting moet aan boord van het
      vaartuig bewaard worden, te zamen met een flensverpakking geschikt voor een werkdruk van 1,0 N/mm2, alsmede met de
      bouten en moeren als genoemd in de tabel in het tweede lid, alsmede 8 sluitringen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel161
  - number: '161.5'
    text: |-
      Voorzieningen moeten zijn aangebracht om een dergelijke aansluiting aan beide zijden van het vaartuig te kunnen
      gebruiken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel161
  - number: '162.1'
    text: |-
      Elk vaartuig dient te zijn uitgerust met ten minste twee brandweeruitrustingen die voldoen aan het bepaalde in
      artikel 163.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel162
  - number: '162.2'
    text: |-
      De brandweeruitrustingen moeten zo worden opgeborgen, dat zij gemakkelijk bereikbaar en gereed voor gebruik zijn.
      Zij moeten op ver uiteenliggende plaatsen worden bewaard.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel162
  - number: '163.1'
    text: |-
      Een brandweeruitrusting dient te bestaan uit een persoonlijke uitrusting die voldoet aan het bepaalde in het tweede
      lid en uit een persluchttoestel dat voldoet aan het bepaalde in het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: '163.2'
    text: 'Een persoonlijke uitrusting moet de volgende onderdelen omvatten die van een goedgekeurd type dienen te zijn:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: 163.2.1°
    text: 'beschermende kleding. Het materiaal waaruit deze kleding wordt vervaardigd, dient zodanig te zijn dat:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: 163.2.1°.1.1
    text: |-
      de huid van de gebruiker wordt beschermd tegen de hitte die een brand uitstraalt en tegen het ontstaan van
      brandwonden door stoom;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: 163.2.1°.1.2
    text: de lichaamsventilatie van de gebruiker niet wordt belemmerd; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: 163.2.1°.1.3
    text: de buitenste laag water afstoot;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: 163.2.2°
    text: |-
      laarzen en handschoenen, vervaardigd uit rubber of ander materiaal dat elektrische stroom niet geleidt. Laarzen
      dienen antislip te zijn uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: 163.2.3°
    text: een stevige helm die doelmatige bescherming biedt tegen stoten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: 163.2.4°
    text: een elektrische veiligheidslamp die voldoet aan het bepaalde in artikel 105, eerste lid; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: 163.2.5°
    text: een brandweerbijl.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: '163.3'
    text: |-
      Een persluchttoestel moet van een goedgekeurd type zijn. Het volume aan lucht in de cilinders moet ten minste 1200
      l bij atmosferische druk bedragen. Elk persluchttoestel moet zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: 163.3.1°
    text: een draagstel;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: 163.3.2°
    text: een gelaatstuk;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: 163.3.3°
    text: |-
      een inrichting waarmee de gebruiker op gemakkelijke wijze de nog aanwezige voorraad samengeperste lucht kan
      controleren;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: 163.3.4°
    text: |-
      een inrichting, akoestisch dan wel weerstandverhogend werkend, die de gebruiker waarschuwt zodra de nog veilige
      minimum voorraad samengeperste lucht is bereikt; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: 163.3.5°
    text: |-
      een brandbestendige reddinglijn van voldoende lengte en sterkte, die, teneinde te voorkomen dat het toestel
      losraakt bij gebruik van de reddinglijn, door middel van een musketonhaak moet kunnen worden bevestigd aan het
      harnas van het toestel of aan een afzonderlijke gordel.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: '163.4'
    text: |-
      Bij elk persluchttoestel moet voor elke tot het toestel behorende luchtcilinder ten minste een reservecilinder met
      samengeperste lucht aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: '163.5'
    text: Het Hoofd van de Scheepvaartinspectie kan nadere regels geven betreffende de onderdelen van de brandweeruitrusting.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel163
  - number: '164'
    text: |-
      Ter instructie van de scheepsofficieren moet een brandbeveiligingsplan permanent zijn opgehangen, op daarvoor in
      aanmerking komende plaatsen. De uitvoering van dit plan dient te voldoen aan het bepaalde in artikel 165, eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel164
  - number: '165.1'
    text: |-
      Een brandbeveiligingsplan moet zijn een algemeen plan, waarop voor elk dek duidelijk zijn aangegeven de
      controlestations, de verschillende brandsecties, omgeven door schotten van klasse «A», de secties omgeven
      door schotten van klasse «B» indien aanwezig, alsmede de aanwijzingen betreffende de brandalarmsystemen,
      de brandontdekkingssystemen, de sprinklerinstallatie, indien aanwezig, de brandblusmiddelen, de toegangen
      tot de verschillende afdelingen, dekken, enzovoort en het ventilatiesysteem met inbegrip van bijzonderheden
      omtrent de plaatsen waar de ventilatoren kunnen worden bediend, de plaatsen van de brandkleppen en de nummers
      van de ventilatoren die elke sectie bedienen. In plaats daarvan mogen, ter beoordeling van het Hoofd van de
      Scheepvaartinspectie, de genoemde details zijn opgenomen in een boekje, waarvan een exemplaar moet worden verstrekt
      aan iedere officier, terwijl een exemplaar steeds aan boord op een toegankelijke plaats beschikbaar moet zijn.
      Plannen en boekjes moeten goed worden bijgehouden door veranderingen zo spoedig mogelijk daarin aan te brengen.
      Een vertaling in het Engels dient te worden opgenomen. Bovendien moeten instructies betreffende het onderhoud
      en de werking van alle uitrusting en installaties aan boord voor het alarmeren en ontdekken, voor het insluiten
      en voor de bestrijding van brand in een verzamelband worden bijeengebracht, die op een toegankelijke plaats voor
      onmiddellijk gebruik beschikbaar moet zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel165
  - number: '165.2'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nadere regels stellen betreffende de uitvoering van het
      brandbeveiligingsplan of -boekje.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel165
  - number: '166'
    text: Brandbestrijdingsmiddelen moeten goed worden onderhouden en te allen tijde voor onmiddellijk gebruik gereed zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel166
  - number: '167'
    text: |-
      Waar in deze paragraaf een speciaal toestel, apparaat, speciale blusstof of inrichting van een bepaalde aard is
      voorgeschreven, kan, met inachtneming van het bepaalde in artikel 4, elk ander toestel, apparaat, andere blusstof
      of inrichting daarvoor in de plaats worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel167
  - number: '168'
    text: |-
      Een vast aangebrachte brandblusinstallatie die niet in deze paragraaf wordt voorgeschreven, moet ten genoegen van
      het Hoofd van de Scheepvaartinspectie zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel168
  - number: '169'
    text: De voorschriften in deze paragraaf zijn van toepassing op vaartuigen waarvan de lengte minder dan 55 m bedraagt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel169
  - number: '170.1'
    text: |-
      De romp, de bovenbouw, structurele schotten, dekken en dekhuizen moeten van onbrandbare materialen zijn
      vervaardigd. Het Hoofd van de Scheepvaartinspectie kan een brandbare constructie toestaan, mits is voldaan aan de
      van toepassing zijnde bepalingen van dit artikel en aan die van de artikelen 176, eerste lid, en 182, vijfde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.2'
    text: |-
      In vaartuigen waarvan de romp is vervaardigd van onbrandbare materialen, moet ten aanzien van begrenzingsschotten
      en dekken van ruimten voor machines en van controlestations aan het volgende zijn voldaan:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: 170.2.1°
    text: |-
      dekken en schotten, die ruimten voor machines van categorie A scheiden van ruimten voor accommodatie, dienstruimten
      en controlestations, moeten ten minste van klasse «A-30» zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: 170.2.2°
    text: |-
      dekken en schotten, die ruimten voor machines, andere dan die van categorie A, scheiden van ruimten voor
      accommodatie, dienstruimten en controlestations, moeten ten minste van klasse «A-0» zijn; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: 170.2.3°
    text: |-
      dekken en schotten, die controlestations scheiden van ruimten voor accommodatie en dienstruimten, moeten ten minste
      van klasse «A-30» zijn. Het Hoofd van de Scheepvaartinspectie kan het aanbrengen van wanden van klasse «B-15»
      toestaan voor de scheiding tussen ruimten zoals de hut van de kapitein en de brug.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.2'
    text: |-
      In vaartuigen waarvan de romp is vervaardigd van brandbare materialen, moet ten aanzien van begrenzingsschotten en
      dekken van ruimten voor machines en van controlestations aan het volgende zijn voldaan:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: 170.2.1°
    text: |-
      dekken en schotten, die ruimten voor machines scheiden van ruimten voor accommodatie, dienstruimten en
      controlestations moeten ten minste van klasse «F» of klasse «B-15» zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: 170.2.2°
    text: |-
      dekken en schotten, die ruimten voor machines omgeven, moeten zoveel als praktisch mogelijk de doortocht van rook
      verhinderen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: 170.2.3°
    text: |-
      dekken en schotten, die controlestations scheiden van ruimten voor accommodatie en dienstruimten, moeten ten minste
      van klasse «F» zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.3'
    text: |-
      Tenzij op grond van het bepaalde in het tweede lid, onder 2.1, anders is voorgeschreven, moeten in vaartuigen
      waarvan de romp is vervaardigd van onbrandbare materialen, schotten van gangen in ruimten voor accommodatie,
      dienstruimten en controlestations van klasse «B-15» zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.3'
    text: |-
      In vaartuigen waarvan de romp is vervaardigd van brandbare materialen, moeten schotten van gangen in ruimten voor
      accommodatie, dienstruimten en controlestations ten minste van klasse «F» zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.3'
    text: |-
      Schotten van gangen als bedoeld onder 3.1 of 3.2 moeten zijn opgetrokken van dek tot dek, tenzij aan beide zijden
      van het schot doorlopende plafonds met dezelfde brandwerendheid als van de gangschotten zijn aangebracht, in welk
      geval het schot mag eindigen tegen het doorlopende plafond.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.4'
    text: |-
      Binnentrappen in ruimten voor accommodatie, dienstruimten en controlestations moeten van staal of ander,
      gelijkwaardig materiaal zijn. In vaartuigen waarvan de romp is vervaardigd van onbrandbare materialen, moeten
      dergelijk binnentrappen zijn ondergebracht in ruimten die zijn omgeven door schotten van klasse «B-15». In
      vaartuigen waarvan de romp is vervaardigd van brandbare materialen, moeten dergelijke binnentrappen zijn
      ondergebracht in ruimten die zijn omgeven door schotten van klasse «F». Indien evenwel een dergelijke binnentrap
      slechts twee dekken verbindt, behoeft deze slechts op een dek door schotten te zijn omsloten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.5'
    text: |-
      Deuren en andere afsluitmiddelen in schotten en dekken als bedoeld in het tweede en het derde lid, deuren welke
      zijn aangebracht in schotten die trappen omsluiten als bedoeld in het vierde lid en deuren welke zijn aangebracht
      in schachtwanden van ruimten voor machines en ketelruimen, moeten ten minste dezelfde brandwerendheid bezitten als
      de schotten en dekken waarin zij zijn aangebracht. Deuren die toegang geven tot ruimten voor machines van categorie
      A, moeten zelfsluitend zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.6'
    text: |-
      Liftschachten welke door ruimten voor accommodatie en dienstruimten gaan, moeten van staal of van een ander,
      gelijkwaardig materiaal zijn vervaardigd en moeten zijn voorzien van afsluitmiddelen waarmee de trek en de
      rookverspreiding onder controle kunnen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.7'
    text: |-
      In vaartuigen waarvan de romp is vervaardigd van onbrandbare materialen, moet ten aanzien van begrenzingsschotten
      en dekken van ruimten waarin de noodkrachtbron is opgesteld en van kombuizen, verfhutten, lampenhutten en andere
      bergplaatsen, aan het volgende zijn voldaan:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: 170.7.1°
    text: |-
      van de begrenzingsschotten en dekken van ruimten waarin een noodkrachtbron is opgesteld, moeten de bovenliggende
      dekken ten minste van klasse «A-0» zijn en moeten de onderliggende dekken en de begrenzingsschotten ten minste van
      klasse «A-30» zijn. Voor schotten en dekken welke de begrenzing vormen met de buitenlucht, gelden geen eisen ten
      aanzien van de brandwerendheid; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: 170.7.2°
    text: |-
      dekken en schotten, die kombuizen, verfhutten, lampenhutten of andere bergplaatsen waarin zich belangrijke
      hoeveelheden licht ontvlambaar materiaal bevinden, scheiden van ruimten voor accommodatie, dienstruimten en
      controlestations, moeten ten minste van klasse «A-15» zijn. Indien in een kombuis alleen een elektrisch fornuis,
      elektrische warmwaterbereiders en andere elektrisch verwarmde apparaten zijn opgesteld, mogen de dekken en schotten
      tussen een dergelijke kombuis en ruimten voor accommodatie, dienstruimten en controlestations van klasse «B-15»
      zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.7'
    text: |-
      In vaartuigen waarvan de romp is vervaardigd van brandbare materialen, moeten de begrenzingswanden en schotten van
      de ruimten als genoemd onder 1.1 en 1.2, ten minste van klasse «F» of klasse «B-15» zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.7'
    text: Licht ontvlambare produkten moeten in hiervoor geschikte gesloten vaten worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.8'
    text: |-
      Wanneer schotten en dekken, die ingevolge het bepaalde in het tweede, derde, vijfde of het zevende lid van klasse
      «A», klasse «B» of klasse «F» moeten zijn, worden doorboord voor het doorlaten van elektrische leidingen, pijpen,
      schachten, kokers en dergelijke, moeten zodanige maatregelen zijn getroffen dat de brandwerendheid van de schotten
      en dekken niet vermindert.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.9'
    text: |-
      Luchtruimten ingesloten achter wanden en beschietingen tussen plafonds en dekken in ruimten voor accommodatie,
      dienstruimten en controlestations, moeten zijn onderverdeeld door afstoppingen welke de trek tegengaan en die niet
      verder dan 7 m uiteenliggen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.10'
    text: 'Voor ruimten van machines geldt ten aanzien van schijnlichten, ramen, patrijspoorten en lichtranden het volgende:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: 170.10.1°
    text: |-
      wanneer schijnlichten kunnen worden geopend, moeten zij van buiten de ruimte waarop zij zijn aangebracht,
      gemakkelijk kunnen worden gesloten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: 170.10.2°
    text: |-
      schijnlichten voor ruimten voor machines van categorie A mogen niet zijn voorzien van ramen, patrijspoorten of
      lichtranden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: 170.10.3°
    text: |-
      indien in schijnlichten voor ruimten voor machines, andere dan ruimten voor machines van categorie A, ramen,
      patrijspoorten of lichtranden zijn aangebracht, moeten deze van draadglas zijn. Zij moeten tevens aan de
      buitenzijde zijn voorzien van blinden, die vast aan het schijnlicht zijn verbonden en die zijn vervaardigd van
      staal of ander, gelijkwaardig materiaal; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: 170.10.4°
    text: |-
      glas of soortgelijk materiaal mag niet in begrenzingswanden van ruimten voor machines zijn aangebracht. Dit sluit
      het gebruik van glas in wanden van controlekamers die geheel in de ruimten voor machines zijn gelegen, niet uit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.11'
    text: |-
      Isolatiematerialen in ruimten voor accommodatie, dienstruimten met uitzondering van proviand-, koel- en
      vrieskamers, in controlestations en in ruimten voor machines, moeten onbrandbaar zijn. Het oppervlak van
      isolatiemateriaal dat is aangebracht aan de binnenzijde van begrenzingsschotten en -dekken van ruimten voor
      machines van categorie A, moet ondoordringbaar zijn voor olie of oliedampen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '170.12'
    text: Brandbare isolatie in visruimen moet door een goed afsluitende bekleding zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel170
  - number: '171.1'
    text: |-
      Middelen moeten aanwezig zijn voor het stopzetten van ventilatoren en het sluiten van hoofdin- en uitlaten van
      ventilatiesystemen van buiten de ruimten die worden geventileerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel171
  - number: '171.2'
    text: |-
      Middelen moeten aanwezig zijn om de ringvormige ruimten rond schoorstenen vanaf een veilige plaats te kunnen
      sluiten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel171
  - number: '171.3'
    text: |-
      Ventilatie-openingen mogen zijn aangebracht in en onder deuren in schotten van gangen, met dien verstande dat
      dergelijke openingen niet mogen zijn aangebracht in en onder deuren van trapomsluitingen. De openingen in deuren
      mogen alleen in de onderste helft van de deur zijn aangebracht. Indien een dergelijke opening zich bevindt in of
      onder een deur, mag de totale oppervlakte van deze opening of openingen niet meer bedragen dat 0,05 m2. Indien een
      dergelijke opening in een deur is aangebracht, moet deze zijn voorzien van een rooster van onbrandbaar materiaal.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel171
  - number: '171.4'
    text: |-
      Ventilatiekanalen voor ruimten voor machines van categorie A of voor kombuizen mogen over het algemeen niet door
      ruimten voor accommodatie, dienstruimten of controlestations lopen. Het Hoofd van de Scheepvaartinspectie kan
      evenwel toestaan dat deze ventilatiekanalen door de bovengenoemde ruimten lopen, mits zij zijn vervaardigd van
      staal of ander, gelijkwaardig materiaal en zodanig zijn uitgevoerd dat de brandwerendheid van schotten en dekken
      niet vermindert.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel171
  - number: '171.5'
    text: |-
      Ventilatiekanalen voor ruimten voor accommodatie, dienstruimten of controlestations mogen over het algemeen niet
      door ruimten voor machines van categorie A of door kombuizen lopen. Het Hoofd van de Scheepvaartinspectie kan
      evenwel toestaan dat deze ventilatiekanalen door de bovengenoemde ruimten lopen, mits zij zijn vervaardigd van
      staal of ander, gelijkwaardig materiaal en zodanig zijn uitgevoerd dat de brandwerendheid van schotten en dekken
      niet vermindert.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel171
  - number: '171.6'
    text: |-
      Bergplaatsen waarin zich aanzienlijke hoeveelheden gemakkelijk ontvlambare stoffen bevinden, moeten zijn voorzien
      van ventilatie-inrichtingen die zijn gescheiden van andere ventilatiesystemen. De ventilatie moet plaatsvinden
      op hoog en op laag niveau in de ruimte; de in- en uitlaten van de ventilatoren moeten op een veilige plaats zijn
      aangebracht en zijn voorzien van vlamkerende inrichtingen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel171
  - number: '171.7'
    text: |-
      Ventilatiesystemen die ruimten voor machines bedienen, moeten onafhankelijk zijn van systemen die andere ruimten
      bedienen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel171
  - number: '171.8'
    text: Ventilatiekanalen moeten voldoen aan het bepaalde in artikel 146, eerste lid en tweede lid, onder 1 en 2.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel171
  - number: '172.1'
    text: |-
      De verwarming van ruimten voor accommodatie, dienstruimten en controlestations dient te geschieden door toevoer van
      stoom, heet water, warme lucht of elektriciteit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel172
  - number: '172.2'
    text: |-
      Verwarmings- en kooktoestellen moeten vast zijn opgesteld en moeten zo zijn ingericht dat het brandgevaar tot een
      minimum is beperkt. Deze toestellen mogen niet zijn voorzien van een verwarmingselement dat stoffen in de directe
      omgeving kan doen schroeien of in brand doen geraken door de door het element geleverde hitte.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel172
  - number: '172.3'
    text: |-
      De constructie en opstelling van oliekachels moeten voldoen aan door het Hoofd van de Scheepvaartinspectie te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel172
  - number: '172.4'
    text: |-
      Propaan- en butaaninstallaties voor huishoudelijke doeleinden, moeten voldoen aan door het Hoofd van de
      Scheepvaartinspectie te stellen regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel172
  - number: '173.1'
    text: |-
      Blootgestelde oppervlakken in ruimten voor accommodatie, dienstruimten, controlestations, gangen en ingesloten
      ruimten voor trappen, alsmede oppervlakken verborgen achter schotten, beschietingen en plafonds in bovengenoemde
      ruimten, moeten een laag vlamverspreidend vermogen hebben.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel173
  - number: '173.2'
    text: |-
      Alle blootgestelde oppervlakken van glasversterkte polyester constructies binnen ruimten voor accommodatie,
      dienstruimten, controlestations, ruimten voor machines van categorie A en andere ruimten voor machines met
      eenzelfde brandgevaar, moeten zijn voorzien van een afwerkingslaag van goedgekeurde hars welke blijvende
      brandvertragende eigenschappen heeft of moeten zijn bedekt met een goedgekeurde brandvertragende verf of moeten
      zijn beschermd door onbrandbare materialen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel173
  - number: '173.3'
    text: |-
      Verven, vernissen en andere stoffen voor afwerking gebruikt op blootgestelde inwendige oppervlakken, moeten zodanig
      zijn dat zij naar het oordeel van het Hoofd van de Scheepvaartinspectie geen onnodig brandgevaar opleveren, en
      mogen geen overmatige hoeveelheden rook of giftige gassen of dampen kunnen voortbrengen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel173
  - number: '173.4'
    text: |-
      De onderste laag van dekbedekkingen in ruimten voor accommodatie, dienstruimten en controlestations moet van
      goedgekeurd materiaal zijn dat noch gemakkelijk kan ontbranden, noch aanleiding kan geven tot vergiftigings- of
      explosiegevaar bij verhoogde temperaturen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel173
  - number: '173.5'
    text: |-
      In ruimten voor accommodatie, dienstruimten of controlestations moeten pijpen die door schotten of dekken
      van klasse «A» of «B» zijn gevoerd, van goedgekeurde materialen zijn vervaardigd, rekening houdende met de
      temperatuur waaraan de betrokken schotten of dekken weerstand moeten kunnen bieden. Indien door het Hoofd van
      de Scheepvaartinspectie wordt toegestaan dat door ruimten voor accommodatie en dienstruimten olie of brandbare
      vloeistoffen worden gevoerd, moeten de pijpen waardoor die olie of brandbare vloeistoffen worden gevoerd van
      goedgekeurd materiaal zijn vervaardigd, rekening houdende met het brandgevaar.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel173
  - number: '173.5'
    text: |-
      Materialen die gemakkelijk onbruikbaar worden door warmte, mogen worden gebruikt voor spuipijpen, sanitaire
      uitlaten en andere uitlaten, die dicht bij de lastlijn liggen en waarvan smelten, in geval van brand, gevaar voor
      instromen van water zou meebrengen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel173
  - number: '173.6'
    text: |-
      Afvalbakken, andere dan die worden gebruikt bij de verwerking van vis, moeten zijn vervaardigd van onbrandbare
      materialen en mogen geen openingen in de zijkanten of bodem hebben.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel173
  - number: '173.7'
    text: |-
      Werktuigen voor de aandrijving van brandstoftrimpompen, pompen van oliestookinrichtingen en dergelijke
      brandstofpompen, moeten zijn voorzien van afstandbedieningsmiddelen welke zijn aangebracht buiten de desbetreffende
      ruimten, zodat bedoelde werktuigen kunnen worden stopgezet bij het uitbreken van brand in de ruimte waarin zij
      zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel173
  - number: '173.8'
    text: Waar nodig moeten lekbakken zijn aangebracht, teneinde te voorkomen dat olie naar de vullings kan vloeien.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel173
  - number: '173.9'
    text: Filmmateriaal op basis van cellulosenitraat mag niet in cinematografische installaties worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel173
  - number: '174.1'
    text: |-
      Flessen bestemd voor samengeperste, vloeibaar gemaakte of onder druk opgeloste gassen, waaronder begrepen
      ontvlambare en andere gevaarlijke gassen, alsmede de bijbehorende installaties, moeten voldoen aan door het Hoofd
      van de Scheepvaartinspectie te stellen regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel174
  - number: '174.2'
    text: |-
      Ruimten waarin gemakkelijk ontvlambare vloeistoffen, zoals vluchtige verfstoffen, paraffine en dergelijke
      zijn opgeslagen, mogen uitsluitend zijn voorzien van directe toegangen vanaf blootgestelde dekken. Wanneer
      begrenzingsschotten van dergelijke ruimten grenzen aan andere omsloten ruimten, moeten deze schotten gasdicht zijn
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel174
  - number: '174.3'
    text: |-
      Elektrische bedrading en aansluitingen zijn niet toegestaan binnen ruimten welke worden gebruikt voor het bergen
      van gemakkelijk ontvlambare vloeistoffen, tenzij benodigd binnen deze ruimten. In dat geval moeten de elektrische
      aansluitingen ten genoegen van het Hoofd van de Scheepvaartinspectie geschikt zijn voor gebruik in een ontvlambare
      afmosfeer. Warmtebronnen mogen zich niet dicht bij dergelijke ruimten bevinden en opschriften met «niet roken» en
      «geen open vuur» moeten zijn aangebracht op een doelmatige plaats.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel174
  - number: '174.4'
    text: |-
      Elk soort samengeperst gas moet afzonderlijk zijn opgeslagen. Ruimten die voor de opslag van dergelijke
      gassen worden gebruikt, mogen niet worden gebruikt voor het opslaan van andere brandbare produkten, noch
      voor gereedschappen of onderdelen, die geen deel uitmaken van het gasdistributiesysteem. Het Hoofd van de
      Scheepvaartinspectie kan echter met inachtneming van de kenmerkende eigenschappen, hoeveelheid en voorgenomen
      gebruik van dergelijke samengeperste gassen, verlichting van deze voorschriften toestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel174
  - number: '175.1'
    text: |-
      In en vanuit alle ruimten voor accommodatie en ruimten waarin door de bemanning onder normale omstandigheden dienst
      wordt gedaan, andere dan ruimten voor machines, moeten trappen en ladders zijn aangebracht waarlangs het open dek
      en vervolgens de groepsreddingmiddelen gemakkelijk kunnen worden bereikt. In het bijzonder moet aan de volgende
      bepalingen zijn voldaan:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel175
  - number: 175.1.1°
    text: |-
      op elk dek waarop zich ruimten voor accommodatie bevinden, moeten ten minste twee, zo ver mogelijk van elkaar
      verwijderde voorzieningen voor ontsnapping zijn aangebracht. De normale voorzieningen voor toegang tot elke
      besloten ruimte of groep van ruimten mogen hieronder worden begrepen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel175
  - number: 175.1.2.1°
    text: |-
      onder het blootgestelde dek moet de hoofdvoorziening voor ontsnapping bestaan uit een trap, terwijl de tweede
      voorziening voor ontsnapping mag bestaan uit een schacht, een luik of een trap; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel175
  - number: 175.1.2.2°
    text: |-
      boven het blootgestelde dek moeten de voorzieningen voor ontsnapping bestaan uit trappen of deuren naar een open
      dek, dan wel uit een combinatie van beide. Indien het uit praktische overwegingen niet mogelijk is om trappen of
      deuren aan te brengen, mag één van de voorzieningen voor ontsnapping bestaan uit een luik, dat zonodig beschermd
      moet zijn tegen ijsafzetting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel175
  - number: 175.1.3°
    text: |-
      bij wijze van uitzondering kan het Hoofd van de Scheepvaartinspectie toestaan dat slechts één voorziening voor
      ontsnapping is aangebracht, indien de aard en de plaats van de ruimten en het aantal van de personen die in normale
      omstandigheden daarin verblijven of dienst doen, daartoe aanleiding geven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel175
  - number: 175.1.4°
    text: doodlopende gangen met een lengte van meer dan 2,5 m zijn niet toegestaan;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel175
  - number: 175.1.5°
    text: |-
      de afmetingen van en de wijze waarop de voorzieningen voor ontsnapping zijn uitgevoerd, dienen ten genoegen van het
      Hoofd van de Scheepvaartinspectie te zijn; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel175
  - number: 175.1.6°
    text: |-
      indien een radiotelegraafstation geen rechtstreekse toegang tot het open dek heeft, moeten ten genoegen van het
      Hoofd van de Scheepvaartinspectie twee voorzieningen voor ontsnapping zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel175
  - number: 175.1.7°
    text: |-
      voorzieningen voor ontsnapping zijn op de juiste plaats voorzien van signaleringen die voldoen aan bij ministeriële
      regeling vast te stellen nadere regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel175
  - number: '175.2'
    text: |-
      In elke ruimte voor machines van categorie A moeten twee voorzieningen voor ontsnapping zijn aangebracht, die
      zo ver mogelijk van elkaar moeten zijn verwijderd. Vertikale vluchtmiddelen moeten bestaan uit stalen trappen
      of ladders. Indien de afmetingen van de ruimten voor machines daartoe aanleiding geven, kan het Hoofd van de
      Scheepvaartinspectie toestaan dat slechts een voorziening voor ontsnapping is aangebracht. In een dergelijk geval
      moet bijzondere aandacht zijn geschonken aan deze uitgang.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel175
  - number: '175.3'
    text: Liften mogen niet worden beschouwd als een van de vereiste voorzieningen voor ontsnapping.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel175
  - number: '176.1'
    text: |-
      Op vaartuigen waar het Hoofd van de Scheepvaartinspectie op grond van het bepaalde in artikel 170, eerste lid,
      een brandbare constructie heeft toegestaan, alsmede op alle overige vaartuigen waarvan de lengte 35 m of meer
      bedraagt, dient in ruimten voor accommodatie, dienstruimten en controlestations met uitzondering van ruimten
      die vrijwel geen brandgevaar opleveren zoals lege ruimten en sanitaire ruimten, een automatische brandalarm- en
      brandontdekkingsinstallatie van een goedgekeurd type te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel176
  - number: '176.2'
    text: 'Een installatie als bedoeld in het eerste lid, dient aan het volgende te voldoen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel176
  - number: 176.2.1°
    text: een mogelijkheid moet aanwezig zijn om de installatie periodiek te kunnen beproeven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel176
  - number: 176.2.2°
    text: |-
      op de brug moet zowel hoorbaar als zichtbaar alarm kunnen worden gegeven. Bovendien dient dit te kunnen geschieden
      in daarvoor in aanmerking komende ruimten om, wanneer het vaartuig in een haven ligt, de aan boord aanwezige
      personen te waarschuwen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel176
  - number: 176.2.3°
    text: op de alarmpanelen moet zichtbaar zijn dat het systeem is ingeschakeld;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel176
  - number: 176.2.4°
    text: |-
      de installatie moet zijn aangesloten op de noodkrachtbron, dan wel op de hoofdkrachtbron waarbij in geval van het
      wegvallen van de stroomvoorziening, automatisch wordt overgeschakeld op de noodkrachtbron; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel176
  - number: 176.2.5°
    text: |-
      de positie van de brandmelders in de te beschermen ruimten moet ten genoegen van het Hoofd van de
      Scheepvaartinspectie zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel176
  - number: '177.1'
    text: |-
      Aan boord van een vaartuig dient ten minste een brandbluspomp aanwezig te zijn. Een dergelijke brandbluspomp moet
      zijn:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel177
  - number: 177.1.1°
    text: een werktuiglijk gedreven pomp welke niet door de hoofdmotor wordt aangedreven; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel177
  - number: 177.1.2°
    text: |-
      een werktuiglijk gedreven pomp welke door de hoofdmotor wordt aangedreven, onder voorwaarde dat de
      voortstuwingsinstallatie is voorzien van een uitschakelbare keerkoppeling, of van een verstelbare schroef.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel177
  - number: '177.2'
    text: |-
      Sanitair, ballast-, lens-, algemene dienstpompen of andere pompen mogen als brandbluspompen worden gebruikt, indien
      zij voldoen aan het gestelde in deze paragraaf en, bij gebruik van deze pompen als brandbluspomp, de lenscapaciteit
      van het vaartuig hierdoor niet wordt beïnvloed. Brandbluspompen moeten zo zijn aangesloten, dat het niet mogelijk
      is hiermede olie of andere brandbare vloeistoffen te verpompen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel177
  - number: '177.3'
    text: |-
      Bij centrifugaalpompen of andere op de brandblusleiding aangesloten pompen waarbij het mogelijk is dat het water
      door de pomp kan terugstromen, moet in de persleiding een terugslagklep zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel177
  - number: '177.4'
    text: |-
      De totale capaciteit (Q) van de werktuiglijk gedreven brandbluspomp(en) moet ten minste gelijk zijn aan: Q = (0,15
      L(B+D) + 2,25)2 m3/uur.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel177
  - number: '177.5'
    text: |-
      Onverminderd het bepaalde in het vierde lid, mag, indien twee werktuiglijk gedreven brandbluspompen welke niet door
      een en dezelfde krachtbron worden aangedreven, zijn aangebracht, de capaciteit van elk der geïnstalleerde pompen
      niet minder zijn dan 40 percent van de volgens dat lid vereiste totale capaciteit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel177
  - number: '177.6'
    text: |-
      Indien de brandbluspompen de volgens de in het vierde lid vereiste totale opbrengst leveren aan de
      hoofdbrandblusleiding, brandslangen en straalpijpen dient de druk bij elke brandkraan ten minste gelijk te zijn aan
      0,25 N/mm2.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel177
  - number: '178.1'
    text: |-
      Indien ingevolge het bepaalde in artikel 179, eerste lid, meer dan een brandkraan is vereist, moet een
      hoofdbrandblusleiding zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel178
  - number: '178.1'
    text: |-
      Hoofdbrandblusleidingen mogen geen andere aansluitingen hebben dan die, welke voor de brandbestrijding zijn
      vereist, met uitzondering van aansluitingen die zijn aangebracht om het dek te wassen, de ankerkettingen schoon te
      spuiten of een ejector voor de kettingbak te bedienen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel178
  - number: '178.1'
    text: |-
      In hoofdbrandblusleidingen moeten aftapkranen zijn aangebracht op doelmatige plaatsen, waardoor beschadiging door
      bevriezing kan worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel178
  - number: '178.1'
    text: Hoofdbrandblusleidingen moeten zijn vervaardigd van materialen die in voldoende mate hittebestendig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel178
  - number: '178.2'
    text: |-
      Indien de door de brandbluspompen geleverde druk de ontwerpdruk van de hoofdbrandblusleiding kan overschrijden,
      moeten ontlastkleppen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel178
  - number: '179.1'
    text: |-
      Elke aansluiting voor een brandslang moet zijn voorzien van een kraan of afsluiter, opdat een brandslang
      gemakkelijk en snel kan worden aan- of afgekoppeld terwijl de brandbluspompen te werk staan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel179
  - number: '179.1'
    text: |-
      Brandkranen moeten zodanig zijn geplaatst dat elk deel van het vaartuig dat onder normale bedrijfsomstandigheden
      toegankelijk is, met ten minste een straal water kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel179
  - number: '179.2'
    text: Voor de in het eerste lid genoemde waterstraal mag slechts een brandslanglengte worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel179
  - number: '179.3'
    text: |-
      In aanvulling op het bepaalde in het eerste lid moet buiten ruimten voor machines van categorie A, nabij de toegang
      ten minste een brandkraan met slang en straalpijp zijn aangebracht voor gebruik in genoemde ruimte.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel179
  - number: '179.4'
    text: |-
      Bij elke voorgeschreven brandkraan dient een brandslang aanwezig te zijn. Bovendien moet een reserve brandslang
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel179
  - number: '179.5'
    text: |-
      Brandslangen moeten zijn vervaardigd van goedgekeurd materiaal en van voldoende lengte zijn om met een waterstraal
      alle ruimten te kunnen bereiken waarvoor zij zijn bestemd. Deze lengte mag niet meer dan 20 m bedragen. Elke
      brandslang moet zijn voorzien van een straalpijp en de nodige koppelingen. Brandslangen moeten te zamen met
      de benodigde onderdelen en gereedschappen voor gebruik gereed worden gehouden op opvallende plaatsen nabij de
      brandkranen of slangaansluitingen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel179
  - number: '179.6'
    text: |-
      Straalpijpen moeten van een goedgekeurd type zijn. De standaard spuitopening van een straalpijp moet zijn aangepast
      aan de totale opbrengst van de geïnstalleerde brandbluspompen. De spuitopening dient evenwel een inwendige diameter
      te hebben van ten minste 12 mm, of een doorlaat die hiermee nagenoeg overeenkomt. Elke straalpijp moet zijn
      voorzien van een inrichting die het mogelijk maakt tijdens het blussen met een eenvoudige handbeweging over te
      gaan van spuiten op sproeien en omgekeerd, zonder dat daarvoor de watertoevoer naar de straalpijp behoeft te worden
      onderbroken. Tevens moet de straalpijp zijn voorzien van een inrichting om de watertoevoer te onderbreken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel179
  - number: '179.7'
    text: |-
      Op vaartuigen, waarvan de lengte minder dan 24 m bedraagt, mag voor brandblusdoeleinden de dekwasslang worden
      gebruikt mits deze van voldoende lengte is om alle compartimenten te kunnen bereiken. In dit geval moet een
      straalpijp met spuitstuk, verloopstuk en overig toebehoren voor het bevestigen hiervan aan de dekwasslang, op de
      brug zijn opgehangen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel179
  - number: '179.8'
    text: |-
      Brandkranen moeten zijn vervaardigd van materialen die in voldoende mate hittebestendig zijn. Brandblusleidingen
      en brandkranen moeten zodanig zijn geplaatst dat de brandslangen gemakkelijk daaraan kunnen worden gekoppeld. Aan
      boord van vaartuigen die lading aan dek kunnen vervoeren, moet de plaats van de brandkranen altijd gemakkelijk
      bereikbaar zijn en de leidingen moeten, zoveel als praktisch mogelijk, zodanig zijn aangelegd, dat gevaar van
      beschadiging door een dergelijke lading wordt vermeden. Tenzij bij elke brandkraan een bijbehorende brandslang met
      straalpijp aanwezig is, moet elke brandslang op elke brandkraan en elke straalpijp op elke brandslang kunnen worden
      aangesloten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel179
  - number: '179.9'
    text: Brandkranen, slangenhaspels, brandslangkasten en dergelijke moeten in een rode kleur zijn geschilderd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel179
  - number: '180.1'
    text: |-
      Een brandblustoestel moet van een goedgekeurd type zijn. De inhoud van een voorgeschreven draagbaar
      brandblustoestel met vloeibare blusstof mag niet groter zijn dan 13,5 l en niet kleiner dan 9 l. Een
      brandblustoestel met een andere blusstof moet ten minste even goed draagbaar zijn als een toestel met vloeibare
      blusstof van 13,5 l en het blusvermogen moet ten minste gelijkwaardig zijn aan dat van een dergelijk toestel van 9
      l. De gelijkwaardigheid van brandblustoestellen wordt bepaald door het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel180
  - number: '180.2'
    text: |-
      Het aantal aan boord aanwezige reservevullingen dient in overeenstemming te zijn met door het Hoofd van de
      Scheepvaartinspectie te geven regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel180
  - number: '180.3'
    text: |-
      Brandblustoestellen gevuld met een blusstof die naar het oordeel van het Hoofd van de Scheepvaartinspectie, hetzij
      uit zichzelf, hetzij onder te verwachten gebruiksomstandigheden, zodanige hoeveelheden giftige gassen afgeeft dat
      dit schadelijk is voor de gezondheid, zijn aan boord niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel180
  - number: '180.4'
    text: |-
      Brandblustoestellen, zowel draagbare als niet-draagbare, moeten periodiek worden nagezien en worden onderworpen aan
      de beproevingen die door het Hoofd van de Scheepvaartinspectie zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel180
  - number: '180.5'
    text: |-
      Eén van de draagbare brandblustoestellen die voor het gebruik in een bepaalde ruimte zijn bestemd, moet nabij de
      toegang tot die ruimte zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel180
  - number: '180.6'
    text: |-
      In de nabijheid van elektrische werktuigen, schakelborden en dergelijke, mogen geen draagbare brandblustoestellen
      zijn geplaatst waarvan de blusstof de elektrische stroom geleidt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel180
  - number: '180.7'
    text: |-
      Buiten de radiohut moet nabij de toegangsdeur van deze hut een draagbaar brandblustoestel, gevuld met een de
      elektrische stroom niet geleidende blusstof, zijn opgesteld. In de radiohut, alsmede nabij een niet in de radiohut
      ondergebracht radiotelefoonstation, moet voorts ten minste een klein, draagbaar brandblustoestel, eveneens
      gevuld met een de elektrische stroom niet geleidende blusstof, met een inhoud van ten hoogste 2 kg blusstof, zijn
      opgesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel180
  - number: '180.8'
    text: Brandblustoestellen moeten in een rode kleur zijn geschilderd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel180
  - number: '180.9'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nadere regels geven ten aanzien van de plaatsing, het juiste type in
      verband met de te verwachten klasse branden en het blusvermogen van brandblustoestellen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel180
  - number: '181'
    text: |-
      Een voldoende aantal draagbare brandblustoestellen moet zijn geplaatst in controlestations, ruimten voor
      accommodatie en dienstruimten opdat ten minste een brandblustoestel met een voor de in deze ruimte te verwachten
      branden geschikte blusstof, direct beschikbaar is voor gebruik op elke plaats in deze ruimte. Het totale aantal
      brandblustoestellen voor bovengenoemde ruimten moet ten minste drie bedragen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel181
  - number: '182.1'
    text: |-
      Ruimten voor machines van categorie A moeten zijn voorzien van een vast aangebrachte brandblusinstallatie met
      uitsluitend gehalogeniseerde koolwaterstoffen met een lage giftigheidsgraad als blusstof. Indien ruimten voor
      machines aan elkaar grenzen en niet volkomen van elkaar zijn gescheiden of wanneer brandstofolie van één ruimte
      naar een andere ruimte kan vloeien, moeten de betrokken ruimten als één ruimte worden beschouwd. Het Hoofd van de
      Scheepvaartinspectie kan nadere regels geven ten aanzien van bedoelde brandblusinstallatie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel182
  - number: '182.2'
    text: |-
      De in het eerste lid bedoelde brandblusinstallatie moet kunnen worden bediend vanaf een gemakkelijk toegankelijke
      plaats buiten de te beschermen ruimten, welke zodanig is gelegen dat het niet waarschijnlijk is dat, in geval van
      brand in een te beschermen ruimte, deze plaats onbereikbaar wordt. Voorzieningen moeten zijn getroffen teneinde de
      krachtvoorziening zeker te stellen, die noodzakelijk is voor het inwerking stellen van de installatie in geval van
      brand in de te beschermen ruimte.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel182
  - number: '182.3'
    text: 'Ruimten voor machines van categorie A moeten bovendien zijn voorzien van:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel182
  - number: 182.3.1°
    text: ten minste twee draagbare schuimbrandblustoestellen of daaraan gelijkwaardig gestelde brandblustoestellen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel182
  - number: 182.3.2°
    text: |-
      ten minste een draagbaar schuimbrandblustoestel of daaraan gelijkwaardig gesteld brandblustoestel meer dan het
      aantal genoemd onder 1 indien in de ruimte verbrandingsmotoren of gasturbines zijn opgesteld die een gezamenlijk
      vermogen hebben van 250 kW of meer;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel182
  - number: 182.3.3°
    text: |-
      één of meer bakken, tezamen inhoudende ten minste 0,3 m3 zand, met soda doordrenkt zaagsel of andere doelmatige
      stoffen op elke stookplaats, benevens schoppen om deze stoffen te verspreiden. Een draagbaar schuimbrandblustoestel
      of daaraan gelijkwaardig gesteld brandblustoestel kan hiervoor in de plaats worden gesteld; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel182
  - number: 182.3.4°
    text: |-
      een stoombrandblusinrichting op de onder overdruk staande luchtkanalen van ketels met geforceerde trek, indien zich
      in deze luchtkanalen lekolie kan verzamelen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel182
  - number: '182.4'
    text: |-
      Indien in een ruimte voor machines van categorie A een oliegestookte verwarmingsketel is opgesteld moet een van de
      in het derde lid vereiste draagbare brandblustoestellen in de nabijheid daarvan zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel182
  - number: '182.5'
    text: |-
      Op vaartuigen welke grotendeels of geheel zijn vervaardigd van hout, kunststof of aluminium en waarvan de ruimten
      voor machines geheel of gedeeltelijk door schotten, dekken of kappen van deze materialen zijn omsloten moeten
      deze ruimten, indien daarin oliegestookte ketels, oliestookinrichtingen, verbrandingsmotoren of gasturbines zijn
      opgesteld, zijn voorzien van een vast aangebrachte brandblusinstallatie zoals voorgeschreven in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel182
  - number: '182.6'
    text: |-
      Indien naar het oordeel van het Hoofd van de Scheepvaartinspectie brandgevaar aanwezig is in ruimten voor machines
      ten aanzien waarvan geen bepaalde voorschriften omtrent brandblusmiddelen zijn gegeven in de voorgaande leden,
      moeten in of dicht bij deze ruimten een zodanig aantal brandblustoestellen of andere brandblusmiddelen zijn
      opgesteld als door hem voldoende wordt geacht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel182
  - number: '182.7'
    text: |-
      Bij toepassing van tweetaktmotoren moet elk van deze motoren met een vermogen van 750 kW of meer, zijn voorzien
      van een inrichting om gas of stoom als blusstof toe te laten in de spoelluchtleidingen, tenzij ten genoegen van het
      Hoofd van de Scheepvaartinspectie wordt aangetoond dat deze voorziening niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel182
  - number: '183.1'
    text: |-
      Een vaartuig, waarvan de lengte 45 m of meer bedraagt moet zijn uitgerust met ten minste twee
      brandweeruitrustingen, ieder bestaande uit:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel183
  - number: 183.1.1°
    text: een persluchttoestel dat voldoet aan het bepaalde in artikel 163, derde tot en met vijfde lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel183
  - number: 183.1.2°
    text: een elektrische veiligheidslamp die voldoet aan het bepaalde in artikel 105; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel183
  - number: 183.1.3°
    text: een brandweerbijl.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel183
  - number: '183.2'
    text: Een vaartuig waarvan de lengte minder dan 45 m bedraagt moet zijn uitgerust met een brandweerbijl.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel183
  - number: '183.3'
    text: |-
      De in het eerste en tweede lid bedoelde uitrustingen moeten zo worden opgeborgen, dat zij gemakkelijk bereikbaar en
      gereed voor gebruik zijn. Ze moeten op ver uiteenlopende plaatsen worden bewaard.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel183
  - number: '184'
    text: |-
      Op vaartuigen waarvan de lengte 35 m of meer bedraagt, moet een ter instructie van de scheepsofficieren een
      brandbeveiligingsplan op een daarvoor in aanmerking komende plaats permanent zijn opgehangen. De uitvoering van dit
      plan dient te voldoen aan het bepaalde in artikel 165.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel184
  - number: '185'
    text: Brandbestrijdingsmiddelen moeten goed worden onderhouden en te allen tijde voor onmiddellijk gebruik gereed zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel185
  - number: '186'
    text: |-
      Waar in deze paragraaf een speciaal toestel, apparaat, speciale blusstof of inrichting van een bepaalde aard is
      voorgeschreven, kan met inachtneming van het bepaalde in artikel 4, elk ander toestel, apparaat, andere blusstof of
      inrichting daarvoor in de plaats worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel186
  - number: '187'
    text: |-
      Een vast aangebrachte brandblusinstallatie die niet in deze paragraaf wordt voorgeschreven, moet ten genoegen van
      het Hoofd van de Scheepvaartinspectie zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel187
  - number: '188.1'
    text: |-
      Dekopeningen voorzien van luikhoofden of drempels waarvan de hoogte minder dan 600 mm bedraagt, moeten zijn
      uitgerust met beveiligingsmiddelen zoals scharnierende of verplaatsbare relingen of netwerk. Het Hoofd van de
      Scheepvaartinspectie kan voor kleine openingen verlichting toestaan van deze eisen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel188
  - number: '188.2'
    text: |-
      Schijnlichten of andere, soortgelijke openingen moeten zijn voorzien van beveiligingsstaven waarvan de onderlinge
      afstand niet meer bedraagt dan 350 mm. Het Hoofd van de Scheepvaartinspectie kan voor kleine openingen verlichting
      toestaan van deze eis.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel188
  - number: '188.3'
    text: |-
      Het oppervlak van elk dek moet zodanig zijn ontworpen of behandeld dat de mogelijkheid van uitglijden door
      opvarenden tot een minimum is beperkt. In het bijzonder moeten dekken op plaatsen waar gewerkt wordt, zoals in
      ruimten voor machines, in kombuizen, bij lieren en op plaatsen waar vis wordt verwerkt alsmede ter plaatse van de
      onder- en bovenkant van ladders en voor deuren voorzien zijn van antislipoppervlakken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel188
  - number: '188.4'
    text: |-
      Deklading moet ter plaatse van openingen die toegang geven tot de verblijven, voortstuwingsruimten en andere
      ruimten die in verband met de werkzaamheden aan boord moeten worden betreden, zodanig zijn gestuwd, dat deze
      openingen behoorlijk kunnen worden bereikt, geopend en afgesloten tegen het binnendringen van water.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel188
  - number: '188.5'
    text: |-
      Er is een valreep, loopplank of vergelijkbare voorziening aanwezig waarmee op een adequate en veilige manier aan en
      van boord kan worden gegaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel188
  - number: '189.1'
    text: |-
      Scharnierende deksels van luiken, mangaten en andere openingen moeten beveiligd zijn tegen per ongeluk sluiten.
      In het bijzonder moeten zware deksels op noodluiken zijn uitgerust met contragewichten. Voorts moeten deksels
      op noodluiken zodanig zijn geconstrueerd dat zij uitsluitend vanaf de binnenzijde van het deksel geopend kunnen
      worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel189
  - number: '189.2'
    text: |-
      De afmetingen van toegangsluiken en ontsnappingsluiken mogen niet kleiner zijn dan 600 bij 600 mm of een kleinere
      diameter hebben dan 600 mm.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel189
  - number: '189.3'
    text: Waar praktisch uitvoerbaar, moeten boven het dek waarin zich nooduitgangen bevinden, handgrepen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel189
  - number: '190.1'
    text: |-
      Alle aan weer en wind blootgestelde dekken, voor zover deze bestemd zijn om daar te werken, moeten zijn voorzien
      van een deugdelijke verschansing of reling. De hoogte van de verschansing of van de reling moet ten minste
      1 m boven het dek, inclusief de dekbedekking, zijn. Indien deze hoogte een belemmering vormt voor de normale
      werkzaamheden aan boord, kan het Hoofd van de Scheepvaartinspectie een geringere hoogte toestaan, mits in voldoende
      bescherming is voorzien.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel190
  - number: '190.2'
    text: |-
      De kleinste afstand, vertikaal gemeten, vanaf de hoogst gelegen lastlijn tot aan het laagste punt van de bovenzijde
      van de verschansing of tot aan de rand van het werkdek indien een reling is aangebracht, moet ten genoegen van het
      Hoofd van de Scheepvaartinspectie voldoende bescherming van de bemanning garanderen tegen overkomend water, waarbij
      rekening moet worden gehouden met de toestand van de zee en de weersomstandigheden waarbij het vaartuig dienst moet
      kunnen doen, alsmede met het vaargebied, het type vaartuig en de vismethode waarvoor het bestemd is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel190
  - number: '190.3'
    text: |-
      De hoogte van de opening onder de onderste roede van het relingwerk mag niet groter zijn dan 230 mm. De onderlinge
      afstand van de overige roeden mag niet meer dan 380 mm bedragen en de onderlinge afstand tussen scepters mag niet
      meer dan 1,50 m zijn. Op vaartuigen waar de overgang van de huidbeplating naar de dekbeplating als een rondgezette
      plaat is uitgevoerd, moeten de scepters van het relingwerk op het vlakke gedeelte van het dek geplaatst zijn.
      Relingen mogen geen scherpe punten, randen en hoeken hebben en moeten van voldoende sterkte zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel190
  - number: '190.4'
    text: |-
      Ten genoegen van het Hoofd van de Scheepvaartinspectie moeten voorzieningen zijn aangebracht zoals relingen,
      handleiders, loopbruggen of onderdeks gelegen gangen ter bescherming van de bemanning bij het gaan naar of het
      komen van hun verblijven, de ruimten voor machines en andere werkruimten. Zonodig moeten buiten alle dekhuizen
      en schachten handleiders of andere doelmatige voorzieningen zijn aangebracht teneinde de opvarenden een veilige
      doorgang en veilig werk te garanderen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel190
  - number: '190.5'
    text: |-
      De bovenzijde van een aflopend deel van het dek aan boord van hektreilers moet voorzien zijn van een doelmatige
      beveiliging in de vorm van deuren, hekken of netwerk die op dezelfde hoogte moeten zijn aangebracht als de
      aangrenzende verschansing of reling. Voor het geval tijdelijk niet is voorzien in een dergelijke beveiliging moeten
      een ketting of andere beveiligingsmiddelen over het hellende deel zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel190
  - number: '190.6'
    text: |-
      Aan boord van een vaartuig moeten middelen aanwezig zijn ter persoonlijke bescherming van de schepelingen tegen
      letsel dat uit door hen te verrichten werkzaamheden zou kunnen voortvloeien. Het Hoofd van de Scheepvaartinspectie
      kan nadere regels stellen ten aanzien van het aantal, de soort en het gebruik van de persoonlijke
      beschermingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel190
  - number: '191'
    text: |-
      Met het oog op de veiligheid van de bemanning moeten, ten genoegen van het Hoofd van de Scheepvaartinspectie,
      trappen en ladders van voldoende afmetingen en sterkte zijn aangebracht, die moeten zijn voorzien van leuningen
      en antisliptreden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel191
  - number: '192.1'
    text: |-
      De toegangen naar de verblijven van de bemanning moeten te allen tijde buiten ruimten voor machines om, behoorlijk
      bereikbaar zijn. Daarbij dient rekening te worden gehouden met de eisen gesteld in hoofdstuk 5.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel192
  - number: '192.2'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing ten aanzien van plaatsen die bestemd zijn om daar
      te werken, tenzij deze plaatsen geheel binnen de ruimten voor machines zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel192
  - number: '192.3'
    text: Ruimten voor machines mogen niet in rechtstreekse verbinding staan met de verblijven van de bemanning.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel192
  - number: '192.4'
    text: |-
      Elektrische personen- en goederenliften en roltrappen die aan boord zijn opgesteld, moeten zijn voorzien van een
      geldig certificaat, afgegeven door een daartoe door het Hoofd van de Scheepvaartinspectie gemachtigd particulier
      bureau.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel192
  - number: '193'
    text: |-
      Onverminderd het bepaalde in dit hoofdstuk moeten de verblijven van de bemanning voldoen aan de eisen gesteld bij
      of krachtens het [Schepelingenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001985
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0001985
  - number: 193a.1
    text: |-
      De plaats, de constructie, de geluids- en warmte-isolatie en de inrichting van de verblijfsruimten en de
      dienstruimten, voor zover aanwezig, alsmede de toegangen daartoe bieden adequate bescherming tegen trillingen en
      geluidhinder tijdens de rustperiode van de bemanning.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel193a
  - number: 193a.2
    text: |-
      Wanneer de constructie, de afmetingen of de bestemming van het vaartuig het mogelijk maken, zijn de
      verblijfsruimten zodanig gelegen dat de gevolgen van bewegingen en versnellingen zo veel mogelijk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel193a
  - number: 193a.3
    text: |-
      Voor zover mogelijk worden er passende maatregelen genomen voor de bescherming van niet-rokers tegen hinder door
      tabaksrook.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel193a
  - number: 193a.4
    text: Voor voedselopslag zijn koelkasten of andere koelvoorzieningen aanwezig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel193a
  - number: 193a.5
    text: |-
      Indien ten behoeve van de ventilatie in gesloten werkruimten een mechanische luchtverversingsinstallatie wordt
      gebruikt, is deze altijd bedrijfsklaar.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel193a
  - number: 193a.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van het bepaalde in het eerste tot en met
      het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel193a
  - number: 193b.1
    text: |-
      In de verblijven van de bemanning, voor zover aanwezig, zijn trillingen, geluid en de gevolgen van bewegingen en
      versnellingen tot een minimum beperkt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel193b
  - number: 193b.2
    text: Voor voedselopslag zijn koelkasten of andere koelvoorzieningen aanwezig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel193b
  - number: 193b.3
    text: |-
      Indien ten behoeve van de ventilatie in gesloten werkruimten een mechanische luchtverversingsinstallatie wordt
      gebruikt, is deze altijd bedrijfsklaar.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel193b
  - number: 193b.4
    text: |-
      Bij ministriële regeling kunnen nadere regels worden gesteld ten aanzien van het bepaalde in het eerste tot en met
      het derde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel193b
  - number: '194'
    text: |-
      Het bepaalde in dit hoofdstuk is niet van toepassing op een vaartuig dat gesleept naar zijn bestemming wordt
      gebracht, met dien verstande dat, indien het vaartuig is bemand, het moet zijn uitgerust met reddingmiddelen en
      -voorzieningen en veiligheidsmiddelen zoals deze door het Hoofd van de Scheepvaartinspectie worden voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel194
  - number: '195.1'
    text: |-
      Behoudens het bepaalde in het vijfde lid dienen de reddingmiddelen en -voorzieningen die in dit hoofdstuk zijn
      voorgeschreven, van een goedgekeurd type te zijn en te voldoen aan de door het Hoofd van de Scheepvaartinspectie te
      stellen nadere regels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel195
  - number: '195.2'
    text: |-
      Alvorens een goedkeuring te kunnen verkrijgen, dienen de reddingmiddelen en -voorzieningen te worden beproefd om
      vast te stellen of zij aan het bepaalde in dit hoofdstuk voldoen, op een wijze als nader voorgeschreven door het
      Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel195
  - number: '195.3'
    text: |-
      Alvorens een goedkeuring te kunnen verkrijgen, dienen reddingmiddelen of -voorzieningen van een nieuw ontwerp
      te worden beoordeeld en beproefd om vast te stellen of zij voldoen aan normen van veiligheid die ten minste
      gelijkwaardig zijn aan het bepaalde in dit hoofdstuk. De beproeving dient te geschieden op een wijze als nader
      voorgeschreven door het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel195
  - number: '195.4'
    text: |-
      De door het Hoofd van de Scheepvaartinspectie afgegeven goedkeuringen vermelden tevens de voorwaarden waaronder de
      goedkeuring geldig blijft.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel195
  - number: '195.5'
    text: |-
      Reddingmiddelen en -voorzieningen die ingevolge het bepaalde in dit hoofdstuk zijn voorgeschreven, doch
      waarvoor geen nadere voorschriften in paragraaf 3 zijn opgenomen, dienen ten genoegen van het Hoofd van de
      Scheepvaartinspectie te zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel195
  - number: '196'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nadere regels stellen omtrent de produktiecontrole van reddingmiddelen,
      teneinde zeker te stellen dat deze middelen worden vervaardigd volgens dezelfde normen als het goedgekeurde
      prototype.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel196
  - number: '197.1'
    text: |-
      Ten behoeve van de groepsreddingmiddelen moet aan boord van een vaartuig waarvan de lengte 45 m of meer bedraagt,
      en dat niet is uitgerust met noodradiobakens als bedoeld in het vierde lid, een draagbaar radiotoestel aanwezig
      zijn, dat voldoet aan het bepaalde in artikel 262. Het draagbaar radiotoestel dient te worden opgeborgen op een
      beschermde en gemakkelijk toegankelijke plaats, gereed om in geval van nood meegenomen te kunnen worden naar welk
      groepsreddingmiddel dan ook; wanneer op een vaartuig reddingboten op ver uiteenliggende plaatsen zijn opgesteld,
      dient het draagbaar radiotoestel te worden geborgen in de nabijheid van de reddingboten die het verste verwijderd
      zijn van de hoofdzender van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel197
  - number: '197.2'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan voor vaartuigen die reizen van zodanig korte duur maken dat een draagbaar
      radiotoestel voor groepsreddingmiddelen naar zijn oordeel onnodig is, vrijstelling verlenen van het bepaalde in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel197
  - number: '197.3'
    text: |-
      Wanneer het totale aantal personen aan boord van een vaartuig 200 of meer bedraagt, moet ten minste een van de
      reddingboten waarmee het vaartuig ingevolge het bepaalde in artikel 199 moet zijn uitgerust, zijn voorzien van een
      radiotelegrafie-installatie die voldoet aan het bepaalde in artikel 261.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel197
  - number: '197.4'
    text: |-
      Aan iedere zijde van een vaartuig moet een met de hand in werking te stellen noodradiobaken dat voldoet aan het
      bepaalde in artikel 263 zijn geplaatst, op zodanige wijze dat het snel in een groepsreddingmiddel kan worden gezet.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel197
  - number: '197.5'
    text: |-
      Ten behoeve van de radiocommunicatie tussen de groepsreddingmiddelen onderling, tussen de groepsreddingmiddelen en
      het vaartuig, alsmede tussen het vaartuig en de hulpverleningsboot, moeten portofoons die voldoen aan het bepaalde
      in artikel 265, aan boord zijn. Het is niet noodzakelijk dat er voor ieder groepsreddingmiddel een afzonderlijke
      portofoon is, maar er moeten ten minste drie portofoons aan boord zijn. Aan deze bepaling kan ook worden voldaan
      door toepassing van andere draagbare communicatie-apparaten die aan boord worden gebruikt, mits die apparaten
      voldoen aan het bepaalde in artikel 265.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel197
  - number: '197.6'
    text: |-
      Op of in de nabijheid van de brug dienen ten minste twaalf valschermsignalen die voldoen aan het bepaalde in
      artikel 215, aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel197
  - number: '198.1'
    text: |-
      Vaartuigen moeten ten minste het aantal reddingboeien aan boord hebben, voorgeschreven in de onderstaande tabel:






                    lengte van het vaartuig in meters


                    minimum aantal reddingboeien






                    minder dan 45


                    4




                    45 of meer doch minder dan 100


                    8




                    100 of meer


                    10
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: '198.2'
    text: 'Reddingboeien dienen te voldoen aan het bepaalde in artikel 211 en moeten:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: 198.2.1°
    text: |-
      zo zijn verdeeld dat zij aan beide zijden van het vaartuig en, voor zover praktisch uitvoerbaar, op alle open
      dekken die tot aan de zijden doorlopen voor onmiddellijk gebruik gereed zijn; ten minste één reddingboei dient in
      de nabijheid van de achtersteven te zijn geplaatst; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: 198.2.2°
    text: |-
      zo zijn geplaatst dat zij snel overboord kunnen worden geworpen en niet op een of andere manier permanent zijn
      vastgezet.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: '198.3'
    text: |-
      Aan iedere zijde van het vaartuig moet ten minste één reddingboei zijn voorzien van een drijvende reddinglijn
      die voldoet aan het bepaalde in artikel 211, vierde lid, met een lengte van ten minste 30 m of tweemaal de hoogte
      waarop de reddingboei geplaatst is boven de laagst gelegen lastlijn van het vaartuig in zeewater, welke van beide
      het grootste is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: '198.4'
    text: |-
      Ten minste de helft van het totale aantal reddingboeien moet zijn voorzien van een zelfontbrandend licht dat
      voldoet aan het bepaalde in artikel 211, tweede lid. Ten minste twee van deze reddingboeien moeten bovendien
      zijn voorzien van een zelfwerkend rooksignaal dat voldoet aan het bepaalde in artikel 211, derde lid, en deze
      reddingboeien moeten vanaf de brug snel ontkoppeld kunnen worden; reddingboeien met licht en die met licht en
      rooksignaal moeten gelijkelijk verdeeld zijn over beide zijden van het schip en mogen niet zijn voorzien van
      reddinglijnen als bedoeld in het derde lid. Aan boord van een vaartuig waarvan de lengte minder dan 45 m bedraagt,
      is het bepaalde in dit lid met betrekking tot zelfwerkende rooksignalen niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: '198.5'
    text: |-
      Op iedere reddingboei moet de naam en thuishaven, of het vismerk van het vaartuig waarop de boei is geplaatst, in
      blokletters zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: '198.6'
    text: |-
      Voor elke opvarende dient een reddinggordel die voldoet aan het bepaalde in artikel 212, aan boord te zijn,
      bovendien dient een voldoend aantal extra reddinggordels aan boord te zijn voor personen die op wacht zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: '198.7'
    text: |-
      De reddinggordels moeten zo zijn opgeborgen dat ze gemakkelijk bereikbaar zijn en hun bergplaats moet duidelijk
      zijn aangegeven. Wanneer, vanwege de bijzondere indeling van het vaartuig, de reddinggordels, voorgeschreven
      in het voorgaande lid, onbereikbaar kunnen worden, moeten andere maatregelen ten genoegen van het Hoofd van de
      Scheepvaartinspectie worden genomen, welke kunnen inhouden dat een groter aantal reddinggordels aan boord moet
      zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: '198.8'
    text: |-
      Aan boord van een vaartuig moeten voor iedere reddingboot aan boord ten minste 3 overlevingspakken aanwezig zijn
      die voldoen aan het bepaalde in artikel 213, of, indien het Hoofd van de Scheepvaartinspectie dat noodzakelijk
      en uitvoerbaar vindt, een overlevingspak dat voldoet aan het bepaalde in artikel 213 voor iedere opvarende. Het
      vaartuig moet echter naast de hulpmiddelen tegen warmteverlies, voorgeschreven in artikel 218, dertiende lid,
      onder 24, artikel 221, tweeënveertigste lid, onder 31 en artikel 223, elfde lid, onder 13, hulpmiddelen tegen
      warmteverlies die voldoen aan het bepaalde in artikel 214, aan boord hebben voor de opvarenden die niet zijn
      voorzien van overlevingspakken. Deze overlevingspakken en hulpmiddelen tegen warmteverlies behoeven niet aan boord
      te zijn indien het vaartuig geheel overdekte reddingboten heeft, die gezamenlijk per zijde voldoende ruimte bieden
      aan het totale aantal opvarenden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: '198.9'
    text: |-
      Aan boord van een vaartuig dat voldoet aan het bepaalde in artikel 199, tweede lid, moeten overlevingspakken die
      voldoen aan het bepaalde in artikel 213 aanwezig zijn voor alle opvarenden, tenzij het vaartuig:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: 198.9.1°
    text: |-
      reddingvlotten van het strijkbare type heeft, die door middel van tewaterlatingsmiddelen aan beide zijden van het
      vaartuig te water kunnen worden gelaten; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: 198.9.2°
    text: |-
      reddingvlotten heeft, die door middel van goedgekeurde gelijkwaardige middelen aan beide zijden van het vaartuig te
      water kunnen worden gelaten en waarvoor het niet noodzakelijk is via het water in het reddingvlot te komen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: '198.10'
    text: |-
      Aan boord van een vaartuig moet voor elke persoon die is aangewezen om de hulp verleningsboot te bemannen, een
      overlevingspak van de juiste maat aanwezig zijn dat voldoet aan het bepaalde in artikel 213. De overlevingspakken,
      bedoeld in het achtste of het negende lid mogen voor dit doel worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: '198.11'
    text: |-
      Een overlevingspak dat voldoet aan het bepaalde in artikel 213, mag worden meegeteld als reddinggordel bij de
      toepassing van het bepaalde in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel198
  - number: '199.1'
    text: 'Aan boord van een vaartuig moeten aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel199
  - number: 199.1.1°
    text: |-
      aan elke zijde een of meer reddingboten die voldoen aan het bepaalde in artikel 222, en die per zijde van het
      vaartuig gezamenlijk voldoende ruimte bieden aan het totale aantal opvarenden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel199
  - number: 199.1.2°
    text: |-
      een of meer reddingvlotten die voldoen aan het bepaalde in artikel 219 of 220 en die aan beide zijden van het
      vaartuig te water gelaten kunnen worden en gezamenlijk voldoende ruimte bieden aan het totale aantal opvarenden.
      Indien de reddingvlotten niet gemakkelijk van de ene zijde van het vaartuig naar de andere kunnen worden
      overgebracht om te water gelaten te worden, moet de totale beschikbare ruimte in de reddingvlotten aan elke zijde
      voldoende zijn om het totale aantal opvarenden op te nemen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel199
  - number: '199.2'
    text: |-
      Vaartuigen waarvan de lengte minder dan 85 m bedraagt mogen, in plaats van te voldoen aan het bepaalde in het
      eerste lid volstaan met het volgende:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel199
  - number: 199.2.1°
    text: |-
      zij moeten aan elke zijde van het vaartuig een of meer reddingvlotten hebben die voldoen aan het bepaalde in
      artikel 219 of 220, en die per zijde gezamenlijk voldoende ruimte bieden aan het totale aantal opvarenden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel199
  - number: 199.2.2°
    text: |-
      tenzij de reddingvlotten, voorgeschreven onder 1, gemakkelijk van de ene zijde van het vaartuig naar de andere
      kunnen worden overgebracht om te water gelaten te worden, moeten extra reddingvlotten worden geplaatst zodat de
      totale capaciteit die aan elke zijde beschikbaar is, voldoende ruimte biedt aan ten minste 150 percent van het
      totale aantal opvarenden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel199
  - number: 199.2.3°
    text: |-
      indien de hulpverleningsboot voorgeschreven in het vierde lid, tevens een reddingboot is die voldoet aan het
      bepaalde in artikel 222, mag deze gerekend worden tot de gezamenlijke capaciteit, voorgeschreven onder 1, mits
      de totale capaciteit die aan elke zijde beschikbaar is, voldoende ruimte biedt aan ten minste 150 percent van het
      totale aantal opvarenden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel199
  - number: 199.2.4°
    text: |-
      ingeval een van de groepsreddingmiddelen verloren gaat of in het ongerede raakt, moeten er voldoende
      groepsreddingmiddelen voor gebruik aan elke zijde beschikbaar zijn voor het totale aantal opvarenden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel199
  - number: '199.3'
    text: |-
      Met uitzondering van de groepsreddingmiddelen, bedoeld in artikel 206, eerste lid, onder 1, moeten alle
      groepsreddingmiddelen die zijn voorgeschreven om het totale aantal opvarenden te ontschepen, met hun volle
      bezetting en volledige uitrusting te water gelaten kunnen worden binnen een tijdbestek van 10 minuten, gerekend
      vanaf het tijdstip waarop het sein «schip verlaten» wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel199
  - number: '199.4'
    text: |-
      Aan boord van een vaartuig moet ten minste een hulpverleningsboot aanwezig zijn, die voldoet aan het bepaalde
      in artikel 223. Een reddingboot kan worden aanvaard als hulpverleningsboot, mits tevens wordt voldaan aan de
      voorschriften voor een hulpverleningsboot.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel199
  - number: '200'
    text: |-
      Op of nabij de groepsreddingmiddelen en de bedieningsplaatsen van de tewaterlatingsmiddelen dienen instructieplaten
      of aanduidingen te zijn aangebracht, die:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel200
  - number: 200.1°
    text: |-
      het doel van de bedieningsmiddelen, de volgorde van behandeling ervan en de ter zake dienende instructies of
      waarschuwingen aangeven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel200
  - number: 200.2°
    text: duidelijk zichtbaar zijn bij het licht van de noodverlichting; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel200
  - number: 200.3°
    text: voldoen aan bij ministeriële regeling vast te stellen nadere regels inzake symbolen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel200
  - number: '201.1'
    text: |-
      Er moet een voldoend aantal geoefende bemanningsleden aan boord zijn om het verzamelen te leiden en om ongeoefende
      personen bijeen te brengen en behulpzaam te zijn bij «schip verlaten».
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel201
  - number: '201.2'
    text: |-
      Er moet een voldoend aantal gediplomeerde sloepsgasten aan boord zijn om de groepsreddingmiddelen en de
      tewaterlatingsvoorzieningen, die vereist zijn om alle opvarenden te ontschepen, te bedienen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel201
  - number: '201.3'
    text: |-
      Over elk te gebruiken groepsreddingmiddel dient een gediplomeerde sloepsgast de leiding te hebben. Rekening houdend
      met de aard van de reis, het aantal opvarenden en het soort vaartuig kan het Hoofd van de Scheepvaartinspectie
      evenwel toestaan dat personen met ervaring in de behandeling en bediening van reddingvlotten, met de leiding over
      reddingvlotten worden belast in plaats van de bovengenoemde gediplomeerde sloepsgasten. Bij reddingboten dient
      tevens een plaatsvervanger van de sloepscommandant te zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel201
  - number: '201.4'
    text: |-
      Degene die de leiding heeft over een groepsreddingmiddel, moet beschikken over een lijst met namen van de hem
      toegewezen bemanning van het groepsreddingmiddel en moet er op toezien dat die bemanningsleden hun taken kennen. De
      plaatsvervangende sloepscommandant moet ook over een lijst van de bemanning van de reddingboot beschikken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel201
  - number: '201.5'
    text: |-
      Voor een reddingboot waarin een radiotelegrafie-installatie is aangebracht volgens het bepaalde in artikel 197,
      derde lid, moet iemand zijn aangewezen die de installatie kan bedienen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel201
  - number: '201.6'
    text: |-
      Voor iedere reddingboot moet iemand zijn aangewezen die de motor kan bedienen en kleine herstellingen daaraan kan
      verrichten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel201
  - number: '201.7'
    text: |-
      Het aantal personen bedoeld in het eerste tot en met het derde lid, moet gelijkelijk over de groepsreddingmiddelen
      worden verdeeld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel201
  - number: '202.1'
    text: |-
      Reddingboten en reddingvlotten waarvoor goedgekeurde tewaterlatingsmiddelen zijn voorgeschreven, moeten zo dicht
      mogelijk bij ruimten voor accommodatie en dienstruimten zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel202
  - number: '202.2'
    text: |-
      De verzamelplaatsen moeten dicht bij de inschepingsplaatsen zijn gelegen. Elke verzamelplaats moet voldoende ruimte
      bieden om alle daar te verzamelen personen te kunnen bevatten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel202
  - number: '202.3'
    text: |-
      Verzamel- en inschepingsplaatsen moeten gemakkelijk toegankelijk zijn vanuit de ruimten voor accommodatie en
      dienstruimten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel202
  - number: '202.4'
    text: |-
      Verzamel- en inschepingsplaatsen moeten een doelmatige noodverlichting hebben, welke moet worden gevoed door de
      elektrische noodkrachtbron, voorgeschreven in artikel 112, eerste lid, of artikel 113, eerste lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel202
  - number: '202.5'
    text: |-
      Gangen, trappen en uitgangen die leiden naar de verzamelen inschepingsplaatsen moeten een doelmatige
      noodverlichting hebben, welke moet worden gevoed door de elektrische noodkrachtbron, voorgeschreven in artikel 112,
      eerste lid, of artikel 113, eerste lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel202
  - number: '202.6'
    text: |-
      Verzamel- en inschepingsplaatsen voor groepsreddingmiddelen van het strijkbare type moeten zo zijn ingericht dat
      het mogelijk is om een gewonde op een draagbaar in het groepsreddingmiddel te plaatsen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel202
  - number: '202.7'
    text: |-
      Op iedere tewaterlatingsplaats of op iedere twee naast elkaar gelegen tewaterlatingsplaatsen moet een
      inschepingsladder aanwezig zijn, die voldoet aan het bepaalde in artikel 224, vierentwintigste tot en met
      zesentwintigste lid, bestaat uit één lengte en lang genoeg is om aan de hoge zijde tot op het water te reiken,
      onder ongunstige omstandigheden van kop- of stuurlast en bij een slagzij van 20 graden, waarbij het vaartuig ligt
      op de laagst gelegen lastlijn in zeewater. Het Hoofd van de Scheepvaartinspectie kan echter toestaan dat dergelijke
      ladders worden vervangen door goedgekeurde middelen om inscheping in de groepsreddingmiddelen wanneer deze in het
      water liggen, mogelijk te maken, op voorwaarde dat er ten minste één inschepingsladder aan iedere zijde van het
      vaartuig aanwezig is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel202
  - number: '202.8'
    text: |-
      Waar nodig moeten middelen aanwezig zijn om groepsreddingmiddelen van het strijkbare type tegen het scheepsboord te
      brengen en daar te houden opdat personen veilig kunnen worden ingescheept.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel202
  - number: '202.9'
    text: |-
      De voorzieningen ten behoeve van het inschepen in groepsreddingmiddelen moeten zo zijn ontworpen dat de
      reddingboten ingescheept en te water gelaten kunnen worden vanaf de opstellingsplaats en dat de reddingvlotten
      van het strijkbare type ingescheept en te water gelaten kunnen worden vanaf een plaats direct nabij de
      opstellingsplaats, of vanaf een plaats waarheen in overeenstemming met het bepaalde in artikel 204, vijfde lid, het
      reddingvlot wordt overgebracht voorafgaand aan het te water laten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel202
  - number: '203'
    text: |-
      Tewaterlatingsplaatsen moeten zodanig zijn gelegen dat de groepsreddingmiddelen veilig te water kunnen
      worden gelaten. Daarbij moet bijzondere aandacht worden geschonken aan de afstand tot de schroef en aan sterk
      terugwijkende gedeelten van de romp, zodat de groepsreddingmiddelen, zoveel mogelijk langs het verticale
      gedeelte van de zijden van het vaartuig afgevierd kunnen worden. Bij plaatsing op het voorschip moeten de
      groepsreddingmiddelen op een beschermde plaats achter het aanvaringsschot zijn gelegen en in dit geval moet
      bijzondere aandacht worden geschonken aan de sterkte van het tewaterlatingsmiddel.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel203
  - number: '204.1'
    text: 'Ieder groepsreddingmiddel moet zijn geplaatst:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel204
  - number: 204.1.1°
    text: |-
      zodanig dat noch het groepsreddingmiddel noch de plaatsingsvoorzieningen de behandeling van enig ander
      groepsreddingmiddel of van een hulpverleningsboot op een andere tewaterlatingsplaats belemmeren;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel204
  - number: 204.1.2°
    text: |-
      zo laag mogelijk boven het wateroppervlak als veilig en uitvoerbaar is doch, met uitzondering van een reddingvlot
      bestemd voor tewaterlating door overboord werpen, op een zodanige plaats dat het groepsreddingmiddel aan de lage
      zijde op de inschepingsplaats komt op een hoogte van ten minste 2 m boven de hoogst gelegen lastlijn van het
      vaartuig in zeewater, onder ongunstige omstandigheden van kop- of stuurlast en bij een slagzij van 20 graden of bij
      een slagzij waarbij de rand van het bovenste doorlopende dek onder water raakt, welke van beide het kleinste is;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel204
  - number: 204.1.3°
    text: |-
      zodanig dat het voortdurend en voor onmiddellijk gebruik gereed is, zodat twee bemanningsleden binnen 5 minuten de
      voorbereidingen kunnen treffen voor het te water laten en de inscheping;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel204
  - number: 204.1.4°
    text: voorzien van de volledige uitrusting, voorgeschreven in paragraaf 3; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel204
  - number: 204.1.5°
    text: voor zover uitvoerbaar, op een veilige en beschutte plaats en beschermd tegen schade door brand en explosie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel204
  - number: '204.2'
    text: |-
      Reddingboten die langs de scheepszijden afgevierd worden, moeten zo ver mogelijk als praktisch uitvoerbaar voor de
      schroef zijn geplaatst. Aan boord van een vaartuig waarvan de lengte 80 m of meer, doch minder dan 120 m bedraagt,
      moet iedere reddingboot zo zijn geplaatst dat de afstand van de achterkant van de reddingboot tot de schroef ten
      minste éénmaal de lengte van de reddingboot bedraagt. Aan boord van een vaartuig waarvan de lengte 120 m of meer
      bedraagt, moet iedere reddingboot zo zijn geplaatst dat de afstand van de achterkant van de reddingboot tot de
      schroef ten minste 1½ maal de lengte van de reddingboot bedraagt. Waar toepasselijk moet het vaartuig zo zijn
      ingericht dat de reddingboten op hun opstellingsplaatsen beschermd zijn tegen schade door overkomende zeeën.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel204
  - number: '204.3'
    text: Reddingboten moeten zijn verbonden met bijbehorende tewaterlatingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel204
  - number: '204.4'
    text: |-
      Reddingvlotten van het strijkbare type moeten binnen bereik van de hijshaken zijn geplaatst, tenzij er middelen
      voor overbrenging van de reddingvlotten zijn aangebracht, die niet buiten werking kunnen geraken binnen de gestelde
      grenzen van kop- of stuurlast en slagzij, omschreven in het eerste lid, onder 2, of door de bewegingen van het
      vaartuig of door het uitvallen van de krachtbron.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel204
  - number: '204.5'
    text: |-
      Reddingvlotten bestemd voor tewaterlating door overboord werpen, moeten zo zijn geplaatst dat zij gemakkelijk aan
      beide zijden van het vaartuig te water kunnen worden gelaten, tenzij de capaciteit van de reddingvlotten aan elke
      zijde van het vaartuig afzonderlijk, gelijk is aan de gezamenlijke capaciteit van de vlotten, voorgeschreven in
      artikel 199, eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel204
  - number: '204.6'
    text: |-
      Alle reddingvlotten moeten geplaatst zijn met de vanglijn permanent aan het vaartuig bevestigd en met een
      voorziening voor vrij opdrijven die voldoet aan het bepaalde in artikel 218, zestiende tot en met achttiende
      lid, en wel zodanig dat wanneer het vaartuig zinkt, het reddingvlot vrij opdrijft en, indien het een opblaasbaar
      reddingvlot betreft, automatisch opblaast. Bovendien moeten alle reddingvlotten zodanig zijn geplaatst dat het
      mogelijk is ze ook met de hand van hun sjorringen te ontdoen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel204
  - number: '205'
    text: 'Hulpverleningsboten moeten zijn geplaatst:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel205
  - number: 205.1°
    text: |-
      zodanig dat ze voortdurend en voor onmiddellijk gebruik gereed zijn en de tewaterlating binnen 5 minuten kan
      geschieden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel205
  - number: 205.2°
    text: op een plaats die zowel geschikt is voor het te water laten als voor het terugplaatsen van de boot;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel205
  - number: 205.3°
    text: |-
      zodanig dat noch de hulpverleningsboot noch de plaatsingsvoorzieningen de behandeling van enig ander
      groepsreddingmiddel op een andere tewaterlatingsplaats belemmeren; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel205
  - number: 205.4°
    text: in overeenstemming met het bepaalde in artikel 204, indien ze tevens dienstdoen als reddingboot.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel205
  - number: '206.1'
    text: |-
      Tewaterlatingsmiddelen die voldoen aan het bepaalde in artikel 224, moeten beschikbaar zijn voor alle
      groepsreddingmiddelen, behalve voor:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel206
  - number: 206.1.1°
    text: |-
      reddingvlotten waarin wordt ingescheept vanaf een plaats aan dek op minder dan 4,5 m boven de laagst gelegen
      lastlijn van het vaartuig in zeewater en die:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel206
  - number: 206.1.1°.1.1
    text: een massa hebben van niet meer dan 185 kg; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel206
  - number: 206.1.1°.1.2
    text: |-
      geplaatst zijn voor het te water laten rechtstreeks vanaf de opstellingsplaats onder ongunstige omstandigheden van
      kop- of stuurlast tot 10 graden en met een slagzij van het vaartuig van 20 graden naar iedere zijde;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel206
  - number: 206.1.2°
    text: |-
      groepsreddingmiddelen die een massa hebben van niet meer dan 185 kg en die aan boord aanwezig zijn in aanvulling op
      de groepsreddingmiddelen ten behoeve van 200 percent van het aantal opvarenden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel206
  - number: '206.2'
    text: Elke reddingboot moet zijn voorzien van een middel dat de reddingboot te water kan laten en weer terug kan zetten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel206
  - number: '206.3'
    text: |-
      De middelen voor het te water laten en weer terugzetten moeten zo zijn uitgevoerd dat de bediener daarvan aan boord
      te allen tijde in staat is het groepsreddingmiddel bij het te water laten, en voor de reddingboten tevens bij het
      weer terugzetten, te zien.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel206
  - number: '206.4'
    text: |-
      Voor gelijksoortige groepsreddingmiddelen aan boord van één vaartuig mag slechts één type ontkoppelingsmechanisme
      worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel206
  - number: '206.5'
    text: |-
      Het gereedmaken en bedienen van een groepsreddingmiddel op een tewaterlatingsplaats mag het gereedmaken en bedienen
      van andere groepsreddingmiddelen of hulpverleningsboten op andere tewaterlatingsplaatsen niet belemmeren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel206
  - number: '206.6'
    text: |-
      Lopers, wanneer toegepast, moeten van voldoende lengte zijn om aan de hoge zijde met de groepsreddingmiddelen
      het water te kunnen bereiken indien het vaartuig ligt op de laagst gelegen lastlijn in zeewater onder ongunstige
      omstandigheden van kop- of stuurlast en een slagzij van 20 graden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel206
  - number: '206.7'
    text: |-
      Gedurende het gereedmaken en te water laten, moeten het groepsreddingmiddel, het daarbij behorende
      tewaterlatingsmiddel en de omgeving van het wateroppervlak waarin het wordt afgevierd of te water wordt geworpen,
      doelmatig kunnen worden verlicht door middel van noodverlichting gevoed door de elektrische noodkrachtbron,
      voorgeschreven in artikel 112, eerste lid, of artikel 113, eerste lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel206
  - number: '206.8'
    text: |-
      Teneinde te voorkomen dat waterlozing op de groepsreddingmiddelen plaatsvindt tijdens «schip verlaten», moeten
      de werktuiglijk gedreven pompen die overboord kunnen spuien en die niet door het hoofdvoortstuwingswerktuig
      worden aangedreven, vanaf een doelmatige plaats buiten werking kunnen worden gesteld. Het Hoofd van de
      Scheepvaartinspectie kan hiervoor nadere regels geven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel206
  - number: '206.9'
    text: |-
      Indien een vaartuig is uitgerust met stabilisatoren en er gevaar bestaat dat de groepsreddingmiddelen hierdoor
      beschadigd kunnen worden, moeten middelen beschikbaar zijn, gevoed door een noodkrachtbron, om die stabilisatoren
      binnenboord te brengen. Op de brug moet een aanwijzer, gevoed door een noodkrachtbron, aanwezig zijn die de stand
      van de stabilisatoren aangeeft.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel206
  - number: '207.1'
    text: |-
      De voorzieningen voor inscheping in en tewaterlating van hulpverleningsboten moeten zo zijn uitgevoerd dat in de
      kortst mogelijke tijd de hulpverleningsboot kan worden bemand en te water gelaten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel207
  - number: '207.2'
    text: |-
      Indien de hulpverleningsboot een van de groepsreddingmiddelen van het vaartuig is, moeten de
      inschepingsvoorzieningen en de tewaterlatingsplaats voldoen aan het bepaalde in de artikelen 202 en 203.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel207
  - number: '207.3'
    text: |-
      De tewaterlatingsvoorzieningen moeten voldoen aan het bepaalde in artikel 206. Alle hulpverleningsboten moeten
      bovendien te water gelaten kunnen worden, waar nodig met gebruikmaking van een vanglijn, terwijl het vaartuig met
      een snelheid tot 5 zeemijl per uur in kalm water vooruit vaart.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel207
  - number: '207.4'
    text: |-
      Het snel weer terugzetten van de hulpverleningsboot met volle bezetting en volledige uitrusting moet mogelijk zijn.
      Indien de hulpverleningsboot tevens dienst doet als reddingboot, dan moet snel terugzetten mogelijk zijn wanneer de
      boot is voorzien van de voor een reddingboot voorgeschreven uitrusting en een bezetting van ten minste 6 personen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel207
  - number: '208'
    text: Aan boord van elk vaartuig moet een lijnwerptoestel aanwezig zijn, dat voldoet aan het bepaalde in artikel 225.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel208
  - number: '209.1'
    text: |-
      Alvorens een reis te ondernemen en gedurende de gehele reis moeten alle reddingmiddelen in goede staat verkeren en
      voor onmiddellijk gebruik gereed zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: '209.2'
    text: |-
      Instructies voor het onderhoud van de reddingmiddelen aan boord, die voldoen aan het bepaalde in artikel 226,
      moeten aanwezig zijn en het onderhoud moet dienovereenkomstig worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: '209.3'
    text: |-
      In plaats van de in het voorgaande lid voorgeschreven instructies kan het Hoofd van de Scheepvaartinspectie een
      voor het vaartuig opgesteld onderhoudsprogramma toestaan, waarin de bepalingen van artikel 226 zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: '209.4'
    text: |-
      Lopers die bij het afvieren van de reddingmiddelen worden gebruikt, moeten met tussenpozen van niet meer dan 30
      maanden gekeerd worden en moeten worden vernieuwd wanneer ze gebreken vertonen dan wel na niet meer dan 5 jaar.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: '209.5'
    text: |-
      Voor de groepsreddingmiddelen en hun onderdelen die onderhevig zijn aan uitzonderlijke slijtage of intering en
      regelmatig vervangen dienen te worden, moeten aan boord reserve-onderdelen en reparatiegereedschap aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: '209.6'
    text: 'De volgende beproevingen en inspecties moeten wekelijks worden uitgevoerd:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: 209.6.1°
    text: |-
      een visuele inspectie van alle groepsreddingmiddelen, hulpverleningsboten en tewaterlatingsmiddelen, teneinde zeker
      te stellen dat deze gereed zijn voor onmiddellijk gebruik;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: 209.6.2°
    text: |-
      het draaien van de motoren in alle reddingboten en hulpverleningsboten in voor-en achteruit stand in totaal
      gedurende ten minste 3 minuten, mits de omgevingstemperatuur hoger is dan de minimumtemperatuur vereist om de motor
      te kunnen starten; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: 209.6.3°
    text: het beproeven van de algemeen alarminstallatie, voorgeschreven in artikel 239, tweede lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: '209.7'
    text: |-
      Een inspectie van de reddingmiddelen met inbegrip van de reddingbootuitrusting moet maandelijks worden uitgevoerd,
      waarbij gebruik moet worden gemaakt van de in artikel 226, eerste lid, onder 1, voorgeschreven controlelijst,
      teneinde zeker te stellen dat de middelen en de uitrusting volledig zijn en in goede staat verkeren. Een verslag
      van de inspectie moet in het scheepsdagboek worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: '209.8'
    text: |-
      Ieder automatisch opblaasbaar reddingvlot en de daarbij behorende medische uitrusting en iedere automatisch
      opblaasbare reddinggordel moeten worden gekeurd:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: 209.8.1°
    text: |-
      met tussenpozen van ten hoogste 12 maanden. In bijzondere gevallen kan het Hoofd van de Scheepvaartinspectie deze
      periode verlengen tot ten hoogste 17 maanden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: 209.8.2°
    text: |-
      in Nederland in een door het Hoofd van de Scheepvaartinspectie erkend keuringsstation en in het buitenland in een
      door de overheid aldaar erkend keuringsstation dat vanwege de fabrikant bevoegd is deze keuringen te verrichten.
      Het Hoofd van de Scheepvaartinspectie kan nadere regels stellen omtrent de voorwaarden voor de erkenning van de
      keuringsstations in Nederland en omtrent de keuring.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: '209.8'
    text: |-
      Alle reparaties en onderhoud aan hulpverleningsboten in opgeblazen toestand moeten worden uitgevoerd overeenkomstig
      de aanwijzingen van de fabrikant. Noodreparaties mogen aan boord van het vaartuig worden uitgevoerd. Permanente
      reparaties en periodiek onderhoud moeten worden uitgevoerd in een erkend keuringsstation als bedoeld onder 1.2.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: '209.9'
    text: 'Automatische hydrostatische ontkoppelingsmechanismen moeten periodiek worden gekeurd:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: 209.9.1°
    text: |-
      met tussenpozen van ten hoogste 12 maanden. In bijzondere gevallen kan het Hoofd van de Scheepvaartinspectie deze
      periode verlengen tot ten hoogste 17 maanden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: 209.9.2°
    text: in een erkend keuringsstation als bedoeld in het achtste lid, onder 1.2.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel209
  - number: '210.1'
    text: |-
      Tenzij uitdrukkelijk anders is bepaald of tenzij naar het oordeel van het Hoofd van de Scheepvaartinspectie,
      rekening houdend met de bijzondere reizen die het vaartuig voortdurend maakt, andere voorschriften passend zijn,
      moeten alle in deze paragraaf beschreven reddingmiddelen aan de volgende eisen voldoen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel210
  - number: 210.1.1°
    text: zij moeten zijn vervaardigd met goed vakmanschap en van deugdelijk materiaal;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel210
  - number: 210.1.2°
    text: op de opstellingsplaats mogen zij niet worden aangetast bij luchttemperaturen tussen minus 30°C en plus 65°C;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel210
  - number: 210.1.3°
    text: |-
      indien zij mogelijkerwijs tijdens gebruik in zeewater worden ondergedompeld, moeten zij kunnen blijven werken bij
      een zeewatertemperatuur tussen minus 1°C en plus 30°C;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel210
  - number: 210.1.4°
    text: |-
      waar van toepassing, moeten zij bestand zijn tegen verrotting en corrosie en niet overmatig aangetast worden door
      zeewater, olie of schimmel;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel210
  - number: 210.1.5°
    text: zij mogen niet worden aangetast door blootstelling aan zonlicht;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel210
  - number: 210.1.6°
    text: zij moeten een goed zichtbare kleur hebben op alle delen waar dit ontdekking kan bevorderen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel210
  - number: 210.1.7°
    text: |-
      zij moeten zijn voorzien van lichtterugkaatsend materiaal op die plaatsen waar dit ontdekking kan bevorderen en
      volgens de door het Hoofd van de Scheepvaartinspectie te stellen nadere regels; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel210
  - number: 210.1.8°
    text: wanneer van toepassing, moeten zij bij zeegang doelmatig kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel210
  - number: '210.2'
    text: |-
      Het Hoofd van de Scheepvaartinspectie stelt het tijdvak vast gedurende hetwelk reddingmiddelen waarvan de kwaliteit
      in belangrijke mate vermindert naarmate zij ouder worden, voor gebruik aan boord mogen worden gehandhaafd. Deze
      reddingmiddelen moeten zijn voorzien van een duidelijk zichtbare vermelding van de datum van fabricage. Hiertoe kan
      het Hoofd van de Scheepvaartinspectie nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel210
  - number: '211.1'
    text: 'Een reddingboei moet aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.1.1°
    text: |-
      hij moet een uitwendige middellijn hebben van niet meer dan 800 mm en een inwendige middellijn van niet minder dan
      400 mm;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.1.2°
    text: |-
      hij moet zijn vervaardigd van zelfopdrijvend materiaal dat niet bestaat uit biezen, kurkafval, kurkkorrels of
      enige andere korrelige stof zonder samenhang, noch uit een luchtkast waarbij het drijfvermogen afhankelijk is van
      opblazen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.1.3°
    text: hij moet in staat zijn om ten minste 14,5 kg ijzer gedurende 24 uur in zoet water te kunnen dragen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.1.4°
    text: hij moet een massa van ten minste 4,5 kg hebben;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.1.5°
    text: |-
      hij mag niet blijven branden of doorgaan met smelten indien hij niet langer dan 2 seconden volledig in vuur gehuld
      is geweest;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.1.6°
    text: |-
      hij moet zo zijn vervaardigd dat een val vanaf een hoogte van 30 m in het water wordt doorstaan, zonder dat
      de gebruiksmogelijkheden of de er aan bevestigde onderdelen worden aangetast. Indien de plaats waar de boei is
      geplaatst, meer dan 30 m boven de laagst gelegen lastlijn van het vaartuig in zeewater is gelegen, dient de boei
      een val vanaf die hoogte te kunnen doorstaan; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.1.7°
    text: |-
      hij moet zijn voorzien van een grijplijn die een doorsnede heeft van ten minste 9,5 mm en een lengte van ten minste
      4 maal de uitwendige middellijn van de boei. De grijplijn moet op vier, op onderling gelijke afstand liggende,
      punten op de omtrek van de boei zijn bevestigd en wel zodanig dat vier gelijke bochten worden gevormd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: '211.2'
    text: 'Een zelfontbrandend licht als voorgeschreven in artikel 198, vierde lid, moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.2.1°
    text: het moet zo zijn vervaardigd, dat het niet door water kan worden gedoofd;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.2.2°
    text: |-
      het moet onafgebroken in alle richtingen boven de horizon kunnen branden met een lichtsterkte van ten minste 2 cd,
      of flikkerlicht kunnen geven met een frequentie van ten minste 50 flikkeringen per minuut en met een doeltreffende
      lichtsterkte van ten minste 2 cd;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.2.3°
    text: |-
      het moet zijn voorzien van een zodanige krachtbron dat gedurende ten minste 2 uur kan worden voldaan aan het
      bepaalde onder 2; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.2.4°
    text: het moet een valproef als bedoeld in het eerste lid, onder 6, kunnen doorstaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: '211.3'
    text: 'Een zelfwerkend rooksignaal als voorgeschreven in artikel 198, vierde lid, moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.3.1°
    text: |-
      het moet drijvend in kalm water, gedurende ten minste 15 minuten rook van een goed zichtbare kleur met gelijkmatige
      snelheid kunnen afgeven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.3.2°
    text: het mag niet explosief ontsteken en geen vlammen afgeven gedurende de gehele periode van rookafgifte;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.3.3°
    text: het mag tijdens zeegang niet vollopen met water;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.3.4°
    text: |-
      het moet tevens rook afgeven tijdens en na een 10 seconden durende volledige onderdompeling, 100 mm diep in water;
      en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.3.5°
    text: het moet een valproef als bedoeld in het eerste lid, onder 6, kunnen doorstaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: '211.4'
    text: 'Een drijvende lijn als voorgeschreven in artikel 198, derde lid, moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.4.1°
    text: zij mag niet kinken;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.4.2°
    text: zij moet een doorsnede hebben van ten minste 8 mm; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: 211.4.3°
    text: zij moet een breeksterkte hebben van niet minder dan 5 kN.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel211
  - number: '212.1'
    text: |-
      Een reddinggordel mag niet blijven branden of doorgaan met smelten indien hij niet langer dan 2 seconden volledig
      in vuur gehuld is geweest.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: '212.2'
    text: 'Een reddinggordel moet zo zijn vervaardigd dat:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.2.1°
    text: hij, na instructie, binnen 1 minuut op de juiste wijze en zonder hulp van anderen kan worden aangedaan;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.2.2°
    text: |-
      hij binnenste buiten kan worden gedragen of zeer duidelijk uitsluitend op één manier kan worden aangedaan; voor
      zover mogelijk moet de reddinggordel zo zijn vervaardigd dat hij niet op een niet-correcte manier kan worden
      aangedaan of vastgemaakt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.2.3°
    text: hij gemakkelijk zit; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.2.4°
    text: |-
      hij de drager in staat stelt van een hoogte van ten minste 4,5 m in het water te springen zonder letsel op te lopen
      en zonder dat daarbij de reddinggordel losraakt of beschadigt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: '212.3'
    text: 'Een reddinggordel moet voldoende drijfvermogen en stabiliteit in kalm, zoet water hebben om:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.3.1°
    text: |-
      de mond van een uitgeput of bewusteloos persoon ten minste 120 mm boven water te houden, met het lichaam achterover
      hellend in het water onder een hoek van niet minder dan 20 graden en niet meer dan 50 graden ten opzichte van de
      vertikale positie; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.3.2°
    text: |-
      het lichaam van een bewusteloze persoon uit iedere stand in het water zo te wentelen dat de mond in niet meer dan 5
      seconden vrij van het water komt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: '212.4'
    text: |-
      Een reddinggordel moet een drijfvermogen hebben dat niet meer dan 5 percent afneemt na onderdompeling in zoet water
      gedurende 24 uur.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: '212.5'
    text: |-
      Een reddinggordel moet de drager in staat stellen een korte afstand ermee te zwemmen en in een groepsreddingmiddel
      te klimmen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: '212.6'
    text: |-
      Een reddinggordel moet zijn voorzien van een signaalfluit, stevig met een koord eraan bevestigd, en van een licht
      dat voldoet aan het bepaalde in het achtste lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: '212.7'
    text: |-
      Een reddinggordel waarvan het drijfvermogen afhankelijk is van opblazen, moet niet minder dan twee gescheiden
      compartimenten hebben en moet, in aanvulling op het bepaalde in het eerste tot en met het zesde lid, tevens voldoen
      aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.7.1°
    text: |-
      hij moet automatisch opblazen bij onderdompeling, voorzien zijn van een middel waarbij het opblazen met een
      eenvoudige handeling kan geschieden, en met de mond kunnen worden opgeblazen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.7.2°
    text: |-
      hij moet, ook bij verlies van drijfvermogen in een van de compartimenten, voldoen aan het bepaalde in de het
      tweede, derde en vijfde lid; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.7.3°
    text: hij moet voldoen aan het bepaalde in het vierde lid, nadat de reddinggordel automatisch is opgeblazen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: '212.8'
    text: 'Een licht voor een reddinggordel moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.8.1°
    text: het moet een lichtsterkte hebben van ten minste 0,75 cd;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.8.2°
    text: |-
      het moet zijn voorzien van een zodanige krachtbron dat een lichtsterkte van 0,75 cd kan worden geleverd gedurende
      een periode van ten minste 8 uur; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.8.3°
    text: |-
      het moet zichtbaar zijn over een zo groot mogelijk gedeelte boven de horizon als praktisch uitvoerbaar is wanneer
      het licht bevestigd is aan de reddinggordel.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: '212.9'
    text: |-
      Indien het licht als genoemd in het achtste lid een flikkerlicht is, moet het bovendien voldoen aan de volgende
      eisen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.9.1°
    text: het moet zijn voorzien van een met de hand bedienbare schakelaar;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.9.2°
    text: het mag niet zijn uitgerust met een lens of gebogen reflector om de straal te bundelen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: 212.9.3°
    text: |-
      het moet flikkerlicht kunnen geven met een frequentie van ten minste 50 flikkeringen per minuut met een doelmatige
      lichtsterkte van ten minste 0,75 cd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel212
  - number: '213.1'
    text: 'Een overlevingspak moet uit waterdicht materiaal zijn vervaardigd en wel zodanig dat:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: 213.1.1°
    text: het binnen 2 minuten zonder hulp van anderen uitgepakt en aangetrokken kan worden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: 213.1.2°
    text: |-
      het niet blijft branden of doorgaat met smelten indien het niet langer dan 2 seconden volledig in vuur gehuld is
      geweest;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: 213.1.3°
    text: |-
      het, met uitzondering van het gezicht, het hele lichaam bedekt. De handen moeten bedekt zijn, hetzij door
      handschoenen die een geheel vormen met het pak, hetzij door afzonderlijke handschoenen die permanent aan het pak
      zijn bevestigd;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: 213.1.4°
    text: er voorzieningen zijn om de hoeveelheid vrije lucht in de pijpen van het pak te verminderen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: 213.1.5°
    text: |-
      er geen overmatige hoeveelheid water in het pak binnendringt na een sprong vanaf een hoogte van ten minste 4,5 m in
      het water.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: '213.2'
    text: 'Een overlevingspak moet de drager in staat stellen om:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: 213.2.1°
    text: een verticaal geplaatste ladder van 5 m lengte op te klimmen en af te dalen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: 213.2.2°
    text: normale taken tijdens «schip verlaten» uit te voeren;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: 213.2.3°
    text: |-
      vanaf een hoogte van ten minste 4,5 m in het water te springen zonder dat het overlevingspak beschadigt of
      losraakt, of de drager letsel toebrengt; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: 213.2.4°
    text: een korte afstand door het water te zwemmen en in een groepsreddingmiddel te klimmen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: '213.3'
    text: |-
      Een overlevingspak moet zijn voorzien van een licht dat voldoet aan het bepaalde in artikel 212, achtste en negende
      lid, en een signaalfluit als voorgeschreven in artikel 212, zesde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: '213.4'
    text: |-
      Een overlevingspak moet vervaardigd zijn uit materiaal dat zelf isolerend is, en moet de drager een zodanige
      thermische isolatie bieden dat de lichaamstemperatuur van de drager niet meer dan 2°C daalt na een sprong vanaf
      een hoogte van 4,5 m in het water en een daarop aansluitend verblijf van 6 uur in rustig stromend water met een
      temperatuur tussen 0°C en 2°C.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: '213.5'
    text: |-
      Het overlevingspak moet de drager in staat stellen met de handen bedekt, een potlood op te pakken en te schrijven
      na een verblijf van 1 uur in water van 5°C.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: '213.6'
    text: 'Een overlevingspak moet voldoende inherent drijfvermogen en stabiliteit in kalm, zoet water hebben om:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: 213.6.1°
    text: de mond van de drager, drijvend met het gezicht naar boven, ten minste 120 mm boven water te houden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: 213.6.2°
    text: |-
      de drager in staat te stellen zich in niet meer dan 5 seconden te keren van de stand met het gezicht naar beneden
      tot die met het gezicht naar boven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel213
  - number: '214.1'
    text: |-
      Een hulpmiddel tegen warmteverlies moet gemaakt zijn van waterdicht materiaal dat een thermische geleiding van
      niet meer dan 0,25 W/mK heeft, en moet zo zijn vervaardigd dat het, wanneer het wordt gebruikt om een persoon te
      omhullen, het verlies aan lichaamswarmte, zowel door convectie als door verdamping vermindert.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel214
  - number: '214.2'
    text: 'Een hulpmiddel tegen warmteverlies moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel214
  - number: 214.2.1°
    text: |-
      het moet het hele lichaam van een persoon die een reddinggordel draagt, bedekken, met uitzondering van het gezicht.
      De handen moeten bedekt zijn, hetzij door het hulpmiddel tegen warmteverlies zelf, hetzij door handschoenen die een
      geheel vormen met het hulpmiddel tegen warmteverlies, hetzij door afzonderlijke handschoenen die daaraan permanent
      zijn bevestigd;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel214
  - number: 214.2.2°
    text: |-
      het moet zonder hulp van anderen kunnen worden uitgepakt en gemakkelijk kunnen worden aangedaan in een
      groepsreddingmiddel of hulpverleningsboot;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel214
  - number: 214.2.3°
    text: |-
      het moet de drager in staat stellen het middel in het water in niet meer dan 2 minuten uit te trekken, wanneer dit
      het zwemmen belemmert; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel214
  - number: 214.2.4°
    text: het moet goed functioneren bij temperaturen van minus 30°C tot plus 20°C.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel214
  - number: '215.1'
    text: 'Een valschermsignaal moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel215
  - number: 215.1.1°
    text: het moet verpakt zijn in een waterbestendige houder;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel215
  - number: 215.1.2°
    text: op de houder moeten korte en duidelijke aanwijzingen of pictogrammen voor het gebruik zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel215
  - number: 215.1.3°
    text: het moet een ingebouwd ontstekingsmechanisme hebben; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel215
  - number: 215.1.4°
    text: |-
      het moet zo zijn ontworpen dat het voor de persoon die de houder moet vasthouden, geen gevaar oplevert, wanneer het
      wordt gebruikt overeenkomstig de gebruiksaanwijzingen van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel215
  - number: '215.2'
    text: |-
      Een valschermsignaal moet, wanneer het loodrecht omhoog wordt afgeschoten, een hoogte bereiken van ten minste 300
      m. Op of nabij het hoogtepunt van de baan moet de raket een valschermsignaal afgeven dat:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel215
  - number: 215.2.1°
    text: met een helder rode kleur moet branden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel215
  - number: 215.2.2°
    text: gelijkmatig een gemiddelde lichtsterkte van ten minste 30 000 cd moet afgeven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel215
  - number: 215.2.3°
    text: een brandduur moet hebben van ten minste 40 seconden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel215
  - number: 215.2.4°
    text: een daalsnelheid moet hebben van niet meer dan 5 m/s; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel215
  - number: 215.2.5°
    text: het valscherm of de verbindingen daarmee tijdens het branden niet beschadigt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel215
  - number: '216.1'
    text: 'Een handstakellicht moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel216
  - number: 216.1.1°
    text: het moet zijn verpakt in een waterbestendige houder;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel216
  - number: 216.1.2°
    text: op de houder moeten korte en duidelijke aanwijzingen of pictogrammen voor het gebruik zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel216
  - number: 216.1.3°
    text: het moet een zelfstandig ontstekingsmiddel hebben; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel216
  - number: 216.1.4°
    text: |-
      het moet zo zijn ontworpen dat het voor de persoon die de houder moet vasthouden, geen gevaar oplevert, wanneer het
      wordt gebruikt overeenkomstig de gebruiksaanwijzingen van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel216
  - number: '216.2'
    text: 'Een handstakellicht moet:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel216
  - number: 216.2.1°
    text: met een helder rode kleur branden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel216
  - number: 216.2.2°
    text: gelijkmatig een gemiddelde lichtsterkte van ten minste 15 000 cd afgeven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel216
  - number: 216.2.3°
    text: een brandduur hebben van ten minste 1 minuut; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel216
  - number: 216.2.4°
    text: blijven branden, nadat het gedurende 10 seconden 100 mm diep in water is ondergedompeld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel216
  - number: '217.1'
    text: 'Een drijvend rooksignaal moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel217
  - number: 217.1.1°
    text: het moet zijn verpakt in een waterbestendige houder;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel217
  - number: 217.1.2°
    text: |-
      het mag niet explosief ontsteken wanneer het overeenkomstig de gebruiksaanwijzing van de fabrikant wordt gebruikt;
      en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel217
  - number: 217.1.3°
    text: op de houder moeten korte en duidelijke aanwijzingen of pictogrammen voor het gebruik zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel217
  - number: '217.2'
    text: 'Een drijvend rooksignaal moet:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel217
  - number: 217.2.1°
    text: |-
      in kalm water drijvend, gedurende ten minste 3 minuten met een gelijkmatige snelheid rook van goed zichtbare kleur
      afgeven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel217
  - number: 217.2.2°
    text: gedurende de gehele periode van rookafgifte geen vlammen afgeven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel217
  - number: 217.2.3°
    text: tijdens zeegang niet vollopen met water; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel217
  - number: 217.2.4°
    text: rook blijven afgeven indien ondergedompeld gedurende 10 seconden 100 mm diep in water.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel217
  - number: '218.1'
    text: |-
      Een reddingvlot moet zo zijn vervaardigd dat het drijvende, gedurende 30 dagen bestand is tegen blootstelling aan
      invloeden van weer en zee in alle toestanden van zeegang.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.2'
    text: |-
      Een reddingvlot moet zo zijn vervaardigd dat, indien het van een hoogte van 18 m in het water wordt geworpen, het
      vlot en de uitrusting naar behoren blijven werken. Wanneer het reddingvlot op een hoogte van meer dan 18 m boven de
      laagst gelegen lastlijn van het vaartuig in zeewater wordt geplaatst, moet het van een type zijn dat een valproef
      van ten minste die hoogte met goed gevolg heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.3'
    text: |-
      Het drijvende reddingvlot moet bestand zijn tegen herhaalde sprongen daarop, vanaf een hoogte van ten minste 4,5 m
      boven de vloer van het vlot, zowel met als zonder opstaande overkapping.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.4'
    text: |-
      Een reddingvlot met toebehoren moet zo zijn vervaardigd dat het met zijn volle bezetting en volledige uitrusting,
      en met een van de drijfankers uitgebracht, in kalm water met een vaart van 3 zeemijl per uur kan worden gesleept.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.5'
    text: |-
      Het reddingvlot moet een overkapping hebben, die automatisch wordt opgezet wanneer het vlot te water wordt gelaten,
      teneinde de inzittenden te beschermen tegen weersinvloeden. De overkapping moet aan de volgende eisen voldoen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.5.1°
    text: |-
      zij moet bescherming bieden tegen hitte en koude door middel van twee lagen materiaal, gescheiden door een
      luchtlaag, of door andere, even doeltreffende middelen. Er dienen voorzieningen te zijn getroffen om het
      binnendringen van water in de luchtlaag te voorkomen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.5.2°
    text: de binnenkant moet een kleur hebben die voor de inzittenden van het reddingvlot niet hinderlijk is;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.5.3°
    text: |-
      elke ingang moet duidelijk zijn aangegeven en zijn voorzien van doeltreffende, verstelbare afsluitmiddelen die
      zeewater, wind en kou buitensluiten, en die gemakkelijk en snel van binnenuit en van buitenaf geopend kunnen worden
      zodat ventilatie mogelijk is. Reddingvlotten bestemd voor meer dan 8 personen, moeten ten minste twee tegenover
      elkaar gelegen ingangen hebben;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.5.4°
    text: zij moet te allen tijde, zelfs met afgesloten ingangen, voldoende lucht voor de inzittenden toelaten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.5.5°
    text: zij moet zijn voorzien van ten minste één uitkijkopening;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.5.6°
    text: zij moet zijn voorzien van middelen voor het opvangen van regenwater; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.5.7°
    text: |-
      onder alle delen van de overkapping moet voldoende hoofdruimte geboden worden aan de inzittenden in zittende
      houding.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.6'
    text: Een reddingvlot bestemd voor minder dan zes personen, is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.7'
    text: |-
      Tenzij een reddingvlot te water gelaten wordt door een goedgekeurd tewaterlatingsmiddel dat voldoet aan het
      bepaalde in artikel 224, en zulk een reddingvlot bovendien niet draagbaar behoeft te zijn, mag de totale massa van
      een reddingvlot, de verpakking en de uitrusting niet meer dan 185 kg bedragen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.8'
    text: Langs de binnen- en buitenzijde van het reddingvlot moeten stevig vastgezette grijplijnen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.9'
    text: |-
      Het reddingvlot moet zijn uitgerust met voorzieningen voor het in gebruiksklare toestand plaatsen en vastzetten van
      de antenne behorende bij het draagbaar radiotoestel, voorgeschreven in artikel 197, eerste lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.10'
    text: |-
      Het reddingvlot moet zijn uitgerust met een doelmatige vanglijn met een lengte van niet minder dan 15 m of van
      tweemaal de afstand vanaf de opstellingsplaats tot de laagst gelegen lastlijn van het vaartuig in zeewater, welke
      van beide het grootste is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.11'
    text: |-
      In aanvulling op de bovenstaande bepalingen moet een reddingvlot van het strijkbare type aan de volgende eisen
      voldoen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.11.1°
    text: |-
      wanneer het reddingvlot beladen is met de volle bezetting en volledige uitrusting moet het een zijdelingse slag
      tegen de scheepshuid met een stootsnelheid van ten minste 3,5 m/s en tevens een val op het water van een hoogte van
      ten minste 3 m kunnen doorstaan, zonder dat schade ontstaat waardoor de goede werking wordt aangetast; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.11.2°
    text: |-
      het moet zijn voorzien van middelen om het reddingvlot langs het inschepingsdek te brengen en daar te houden
      gedurende de inscheping.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.12'
    text: |-
      Ieder reddingvlot van het strijkbare type moet zo zijn ingericht dat het volledige aantal personen waarvoor het
      vlot is bestemd, zich kan inschepen in niet meer dan 3 minuten vanaf het moment dat het bevel tot inscheping wordt
      gegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.13'
    text: 'De standaarduitrusting van ieder reddingvlot moet bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.1°
    text: |-
      een drijvende werplijn van ten minste 30 m lengte, waarvan het ene uiteinde is voorzien van een drijvende werpring
      en het andere uiteinde aan het reddingvlot is vastgemaakt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.2°
    text: |-
      een mes van een niet vouwbaar type met een heft dat blijft drijven, verbonden aan het vlot met een lijn en geborgen
      in een zak op de buitenkant van de overkapping nabij de plaats waar de vanglijn aan het reddingvlot is bevestigd.
      Daarnaast moet een reddingvlot bestemd voor 13 of meer personen, zijn voorzien van een tweede mes dat van een
      vouwbaar type mag zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.3°
    text: |-
      een drijvend hoosvat. Een reddingvlot bestemd voor 13 of meer personen moet zijn uitgerust met twee drijvende
      hoosvaten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.4°
    text: twee sponzen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.5°
    text: |-
      twee drijfankers, ieder met een schokbestendige sleeplijn en kaailijn, waarvan er één dient als reserve en
      één blijvend aan het reddingvlot moet zijn bevestigd en wel op een zodanige manier dat wanneer het reddingvlot
      opgeblazen wordt of in het water ligt, het drijfanker er automatisch voor zorgt dat het reddingvlot op de meest
      stabiele wijze met de kop op de wind komt te liggen. De sterkte van het drijfanker, de sleeplijn en de kaailijn
      moet geschikt zijn voor elke toestand van de zee;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.6°
    text: twee drijvende pagaaien;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.7°
    text: drie blikopeners of drie veiligheidsmessen die voorzien zijn van een blikopener;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.8°
    text: |-
      een waterdichte medicijnkist die na gebruik weer goed gesloten kan worden, met een bij ministeriële regeling vast
      te stellen inhoud, met de daarbij behorende controlelijst en handleidingen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.9°
    text: een fluit of een gelijkwaardig middel voor het geven van geluidsignalen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.10°
    text: vier valschermsignalen die voldoen aan het bepaalde in artikel 215;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.11°
    text: zes handstakellichten die voldoen aan het bepaalde in artikel 216;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.12°
    text: twee drijvende rooksignalen die voldoen aan het bepaalde in artikel 217;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.13°
    text: |-
      een waterdichte elektrische lantaarn geschikt voor het geven van morseseinen, alsmede een stel reservebatterijen en
      een reservelamp, verpakt in een waterdichte houder;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.14°
    text: een doelmatige radarreflector of gelijkwaardig middel voor ontdekking door middel van radar;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.15°
    text: een dagseinspiegel met gebruiksaanwijzingen voor het seinen naar vaartuigen, schepen en vliegtuigen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.16°
    text: |-
      een exemplaar van een door het Hoofd van de Scheepvaartinspectie vastgestelde lijst van reddingseinen, afgedrukt op
      een waterbestendige kaart of geborgen in een waterdichte verpakking;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.17°
    text: een vislijn met haken;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.18°
    text: |-
      een noodrantsoen met een voedingswaarde van ten minste 10 000 kJ voor elk van de personen waarvoor het reddingvlot
      is bestemd; deze noodrantsoenen moeten worden bewaard in een luchtdichte verpakking en zijn geborgen in een
      waterdichte houder;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.19°
    text: |-
      waterdichte houders die samen 1,5 liter zoet water bevatten voor elk van de personen waarvoor het reddingvlot
      is bestemd; hiervan mag 0,5 liter per persoon vervangen worden door een ontzoutingsapparaat dat in 2 etmalen een
      gelijke hoeveelheid zoet water kan produceren;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.20°
    text: een roestvrije drinkbeker met maatverdeling;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.21°
    text: |-
      voor elk van de personen waarvoor het reddingvlot is bestemd, zes doses van een middel tegen zeeziekte en een zak
      voor overgeven bij zeeziekte;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.22°
    text: aanwijzingen voor het overleven op zee;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.23°
    text: instructies omtrent maatregelen die onmiddellijk na inscheping in het vlot moeten worden genomen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.13.24°
    text: |-
      hulpmiddelen tegen warmteverlies die voldoen aan het bepaalde in artikel 214, voldoende voor 2 personen of 10
      percent van het aantal personen waarvoor het reddingvlot is bestemd, welke van beide het grootste is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.14'
    text: |-
      De aanduiding betreffende het bij het reddingvlot verpakte type noodpakket, voorgeschreven in artikel 219,
      achttiende lid, onder 5, en artikel 220, dertiende lid, onder 7, op reddingvlotten die overeenkomstig het
      voorgaande lid zijn uitgerust, moet zijn: «SOLAS-A-PACK» in blokletters.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.15'
    text: |-
      De daartoe geschikte onderdelen van de uitrusting moeten worden geborgen in een verpakking die, wanneer deze
      geen volledig onderdeel is van of blijvend bevestigd is aan het reddingvlot, moet worden geborgen en vastgezet
      binnen het reddingvlot, en die ten minste 30 minuten in het water moet kunnen drijven zonder dat de inhoud wordt
      beschadigd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.16'
    text: |-
      Het vanglijnsysteem van een reddingvlot moet een verbinding tussen het vaartuig en het reddingvlot vormen, en moet
      zo zijn ingericht dat het reddingvlot, wanneer het ontkoppeld is en, in het geval van een opblaasbaar reddingvlot,
      wanneer het opgeblazen is, niet door het zinkende vaartuig ondergetrokken kan worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.17'
    text: |-
      Indien in de voorziening voor vrij opdrijven een breekdraad wordt toegepast, moet deze aan de volgende eisen
      voldoen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.17.1°
    text: hij mag niet breken bij de kracht die nodig is om de vanglijn uit de verpakking van het reddingvlot te trekken;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.17.2°
    text: indien van toepassing, mag hij niet breken bij het opblazen van het reddingvlot; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.17.3°
    text: hij moet breken bij een kracht gelegen tussen 1.8 kN en 2.6 kN.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '218.18'
    text: |-
      Indien in de voorziening voor vrij opdrijven een hydrostatisch ontkoppelingssysteem wordt toegepast, moet dit aan
      de volgende eisen voldoen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.18.1°
    text: |-
      het moet zijn vervaardigd uit niet op elkaar inwerkende materialen, om te voorkomen dat het systeem onklaar raakt.
      Gegalvaniseerde of op andere wijze met metaal bedekte delen mogen niet worden gebruikt als onderdelen van het
      systeem;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.18.2°
    text: het reddingvlot moet automatisch ontkoppeld worden op een diepte onder water van niet meer dan 4 m;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.18.3°
    text: |-
      het moet afvoergaten hebben om te voorkomen dat een opeenhoping van water in de hydrostatische ruimte ontstaat,
      wanneer de inrichting normaal is opgesteld;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.18.4°
    text: het moet zo vervaardigd zijn dat ontkoppeling bij overkomend water wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.18.5°
    text: het moet op de buitenkant onuitwisbaar zijn gemerkt met type en serienummer;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.18.6°
    text: |-
      voor elk hydrostatisch ontkoppelingssysteem moet aan boord van een vaartuig dat voorzien is van een dergelijk
      systeem, een document aanwezig zijn waarop de fabricagedatum, het type en het serienummer vermeld zijn, alsmede de
      datum van de laatste periodieke keuring, bedoeld in artikel 209, negende lid; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: 218.18.7°
    text: |-
      het moet zo zijn ontworpen, dat ieder onderdeel verbonden met het vanglijnsysteem, een sterkte heeft die niet
      minder is dan die vereist voor de vanglijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel218
  - number: '219.1'
    text: |-
      Naast het bepaalde in artikel 218 moeten automatisch opblaasbare reddingvlotten tevens voldoen aan het bepaalde in
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.2'
    text: |-
      De hoofddrijfkamer moet in ten minste twee afzonderlijke compartimenten zijn verdeeld, die ieder via een
      terugslagklep worden opgeblazen. De drijfkamers moeten zo zijn ontworpen dat, wanneer een van de compartimenten is
      beschadigd of zich niet opblaast, de overige compartimenten die nog intact zijn, het reddingvlot drijvend kunnen
      houden met positief vrijboord rondom en met het aantal personen waarvoor het reddingvlot is bestemd, ieder met een
      massa van 75 kg en zittend op de normale plaats.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.3'
    text: 'De vloer van een reddingvlot moet waterdicht zijn en moet voldoende bescherming kunnen bieden tegen koude, hetzij:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.3.1°
    text: |-
      door middel van een of meer compartimenten die door de inzittenden opgeblazen kunnen worden of die zich automatisch
      opblazen, en door de inzittenden ontlucht en weer opgeblazen kunnen worden, hetzij
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.3.2°
    text: door andere, even doelmatige middelen, die niet afhankelijk zijn van opblazen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.4'
    text: |-
      Het reddingvlot moet worden opgeblazen met een niet-giftig gas. Het opblazen moet bij een omgevingstemperatuur
      tussen 18°C en 20°C binnen 1 minuut en bij een omgevingstemperatuur van minus 30°C binnen 3 minuten zijn voltooid.
      Na het opblazen moet het reddingvlot zijn vorm behouden, ook wanneer het beladen is met de volle bezetting en
      volledige uitrusting.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.5'
    text: |-
      Ieder opblaasbaar compartiment moet een druk van ten minste driemaal de werkdruk kunnen doorstaan; door middel van
      een overdrukventiel of door beperkte gastoevoer moet worden voorkomen dat een druk groter dan tweemaal de werkdruk,
      wordt bereikt. Er moeten voorzieningen zijn om de luchtpomp of blaasbalg, voorgeschreven in het tweeëntwintigste
      lid, onder 2, zodanig aan te sluiten dat de werkdruk gehandhaafd kan worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.6'
    text: |-
      Het aantal personen waarvoor een reddingvlot wordt goedgekeurd, is gelijk aan het kleinste van de volgende
      getallen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.6.1°
    text: |-
      het grootste gehele getal verkregen door de inhoud van de opgeblazen hoofddrijfkamers, waarbij noch de bogen noch
      de doften, indien aangebracht, mogen worden meegerekend, uitgedrukt in kubieke meters, te delen door 0,096;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.6.2°
    text: |-
      het grootste gehele getal verkregen door de oppervlakte van de vloer van het opgeblazen reddingvlot, gemeten tot
      de binnenste rand van de drijfkamer, waarbij de doft of doften, indien aangebracht, wel mogen worden meegerekend,
      uitgedrukt in vierkante meters, te delen door 0,372; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.6.3°
    text: |-
      het aantal personen met een gemiddelde massa van 75 kg per persoon, allen met een reddinggordel aan, dat
      gemakkelijk en met voldoende hoofdruimte, zittend plaats kan nemen, zonder het gebruik van enig uitrustingsstuk van
      het reddingvlot te belemmeren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.7'
    text: |-
      Ten minste één ingang moet zijn voorzien van een in vorm blijvende inklimsteun om personen in staat te stellen
      vanuit zee in het reddingvlot te klimmen; deze inklimsteun moet zo zijn aangebracht dat bij beschadiging van
      de steun aanzienlijk leeglopen van het reddingvlot wordt voorkomen. Bij reddingvlotten van het strijkbare
      type met meer dan een ingang moet de inklimsteun zijn aangebracht bij de ingang tegenover de aanhaaltalies en
      inschepingsvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.8'
    text: |-
      Ingangen die niet zijn voorzien van een inklimsteun, moeten een inschepingsladder hebben, waarvan de onderste trede
      ten minste 0,4 m beneden de waterlijn van het lege reddingvlot moet kunnen reiken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.9'
    text: |-
      Aan de binnenzijde van het reddingvlot moeten middelen zijn aangebracht waarmee personen zichzelf vanaf de
      inschepingsladder in het reddingvlot kunnen trekken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.10'
    text: |-
      Een opblaasbaar reddingvlot moet zo zijn geconstrueerd, dat het in opgeblazen toestand en drijvend met opgezette
      overkapping, in zeegang voldoende stabiliteit bezit.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.11'
    text: |-
      De stabiliteit van een reddingvlot in omgekeerde toestand moet zodanig zijn dat het door één persoon zowel in
      zeegang als in kalme zee gekeerd kan worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.12'
    text: |-
      De stabiliteit van een reddingvlot beladen met de volle bezetting en volledige uitrusting, moet zodanig zijn dat
      het in kalme zee gesleept kan worden met een snelheid van 3 zeemijl per uur.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.13'
    text: |-
      De breeksterkte van het vanglijnsysteem, de wijze van bevestiging aan het reddingvlot inbegrepen, maar met
      uitzondering van de breekdraad, bedoeld in artikel 218, zeventiende lid, moet ten minste 10,0 kN zijn voor een
      reddingvlot dat is goedgekeurd voor 9 of meer personen en ten minste 7,5 kN voor een reddingvlot dat is goedgekeurd
      voor minder dan 9 personen. Het opblaasmechanisme van een reddingvlot moet door één persoon bediend kunnen worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.14'
    text: |-
      Op het hoogste punt van de overkapping van het reddingvlot moet een met de hand in- en uitschakelbare lamp zijn
      aangebracht, die bij donkere nacht en heldere atmosfeer over een afstand van ten minste 2 zeemijl gedurende ten
      minste 12 uur zichtbaar is. Indien die lamp een flikkerlicht geeft, moet de frequentie ten minste 50 flikkeringen
      per minuut bedragen gedurende de eerste 2 van de 12 gebruiksuren. De lamp moet worden gevoed door een door zeewater
      geactiveerde batterij of door een droge batterij, en moet automatisch gaan branden wanneer het reddingvlot wordt
      opgeblazen. De batterij moet van een type zijn dat niet door vocht of vochtigheid in het ingepakte reddingvlot
      wordt aangetast.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.15'
    text: |-
      Aan de binnenzijde van het reddingvlot moet een met de hand in- en uitschakelbare lamp zijn aangebracht, die
      ten minste 12 uur onafgebroken kan branden. De lamp moet automatisch gaan branden wanneer het reddingvlot wordt
      opgeblazen, en moet voldoende licht geven om daarbij aanwijzingen en instructies te kunnen lezen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.16'
    text: 'Het reddingvlot moet zijn verpakt in een container die voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.16.1°
    text: hij moet zo vervaardigd zijn dat hij niet bovenmatig slijt door omstandigheden die zich op zee kunnen voordoen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.16.2°
    text: |-
      wanneer het reddingvlot en de uitrusting erin verpakt zijn, moet hij voldoende eigen drijfvermogen hebben om de
      vanglijn naar buiten te doen trekken en het opblaasmechanisme in werking te stellen terwijl het vaartuig zinkt; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.16.3°
    text: hij moet, voor zover uitvoerbaar, waterdicht zijn, met uitzondering van lekgaten in de bodem van de container.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.17'
    text: |-
      Het reddingvlot moet zodanig in de container worden verpakt dat, voor zover mogelijk, verzekerd is dat het
      reddingvlot in het water recht overeind wordt opgeblazen, zodra het vrijkomt van de container.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.18'
    text: 'Op de container moet zijn aangegeven:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.18.1°
    text: de naam van de fabrikant of het handelsmerk van het reddingvlot;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.18.2°
    text: het type- en serienummer van het reddingvlot;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.18.3°
    text: |-
      de naam van de bevoegde autoriteit die de oorspronkelijke type-goedkeuring van het reddingvlot heeft verricht, en
      het aantal personen waarvoor het reddingvlot is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.18.4°
    text: de aanduiding «SOLAS»;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.18.5°
    text: het type van het bij het reddingvlot verpakte noodpakket, bedoeld in artikel 218, veertiende lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.18.6°
    text: de datum waarop de laatste keuring van het reddingvlot heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.18.7°
    text: de lengte van de vanglijn van het reddingvlot;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.18.8°
    text: |-
      de maximum hoogte boven de waterlijn behorend bij de laagst gelegen lastlijn van het vaartuig in zeewater, waarop
      het reddingvlot opgesteld mag worden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.18.9°
    text: aanwijzingen voor het te water brengen van het reddingvlot.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.19'
    text: 'Op het reddingvlot moet zijn aangegeven:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.19.1°
    text: de naam van de fabrikant of het handelsmerk;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.19.2°
    text: het type- en serienummer;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.19.3°
    text: jaar en maand van fabricage;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.19.4°
    text: de naam van de bevoegde autoriteit die de oorspronkelijke type-goedkeuring heeft verricht;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.19.5°
    text: de naam en plaats van het keuringsstation waar de laatste keuring heeft plaatsgevonden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.19.6°
    text: |-
      het aantal personen waarvoor het is goedgekeurd, aangebracht boven iedere ingang in cijfers die ten minste 100 mm
      hoog zijn, in een kleur die contrasteert met de kleur van het materiaal van het reddingvlot.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.20'
    text: |-
      Naast het bepaalde in de voorgaande leden moet een reddingvlot van het strijkbare type, wanneer het aan de
      ontkoppelingshaak of spruit hangt, tevens voldoen aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.20.1°
    text: |-
      het reddingvlot moet een belasting kunnen doorstaan van 4 maal de massa van de volle bezetting en volledige
      uitrusting bij een temperatuur van de omgeving en van het reddingvlot zelf, gelegen tussen 17°C en 23°C, met alle
      overdrukventielen gesloten; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.20.2°
    text: |-
      het reddingvlot moet een belasting kunnen doorstaan van 1,1 maal de massa van de volle bezetting en
      volledige uitrusting bij een temperatuur van de omgeving en van het reddingvlot zelf van minus 30°C, met alle
      overdrukventielen open.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.21'
    text: |-
      Containers van vlotten van het strijkbare type moeten zo zijn geborgd, dat voorkomen wordt dat de container of
      delen daarvan in zee vallen tijdens en na het opblazen en te water laten van het reddingvlot.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.22'
    text: |-
      In aanvulling op de uitrusting, voorgeschreven in artikel 218, dertiende lid, moet een automatisch opblaasbaar
      reddingvlot tevens zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.22.1°
    text: |-
      reparatiemateriaal om lekken in de drijfkamers te herstellen, bestaande uit ten minste drie lekstoppers van diverse
      grootte voor tijdelijke afdichting en uit materiaal voor blijvende afdichting; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: 219.22.2°
    text: een handpomp of blaasbalg.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.23'
    text: De messen voorgeschreven in artikel 218, dertiende lid, onder 2, moeten veiligheidsmessen zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.24'
    text: |-
      De vervaardiging van automatisch opblaasbare reddingvlotten in Nederland staat onder voortdurend toezicht van het
      Hoofd van de Scheepvaartinspectie. Indien deze vlotten in het buitenland worden vervaardigd, kan genoegen worden
      genomen met een schriftelijke verklaring, dat zodanig toezicht door een van de fabriek onafhankelijke inspectie,
      aangewezen door de overheid van het betreffende land, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '219.25'
    text: |-
      Een automatisch opblaasbaar reddingvlot moet voor zijn aflevering worden gekeurd door een ambtenaar van de
      Scheepvaartinspectie of door een door het Hoofd van de Scheepvaartinspectie aangewezen andere deskundige. Het vlot
      moet zijn voorzien van een document afgegeven door of namens de fabrikant, dat door voornoemde deskundige, wanneer
      de keuring met goed gevolg heeft plaats gehad, wordt voorzien van een dienststempel, datum en handtekening. De
      geldigheidsduur moet op dit document worden vermeld. Een volgend document wordt slechts afgegeven, nadat het vlot
      opnieuw met goed gevolg aan eenzelfde keuring onderworpen is geweest.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel219
  - number: '220.1'
    text: Naast het bepaalde in artikel 218, moeten vaste reddingvlotten tevens voldoen aan het bepaalde in dit artikel.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '220.2'
    text: |-
      Het drijfvermogen van het reddingvlot moet worden geleverd door goedgekeurd zelfdrijvend materiaal dat zo dicht
      mogelijk bij de zijden van het reddingvlot is aangebracht. Het drijvend materiaal moet brandvertragend zijn of
      beschermd zijn door een brandvertragende laag.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '220.3'
    text: |-
      De bodem van het reddingvlot moet het binnendringen van water voorkomen, de inzittenden doeltreffend uit het water
      houden en hen tegen de koude beschermen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '220.4'
    text: 'Het aantal personen waarvoor een reddingvlot wordt goedgekeurd is gelijk aan het kleinste van de volgende getallen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: 220.4.1°
    text: |-
      het grootste gehele getal verkregen door de inhoud van het drijfmateriaal, vermenigvuldigd met een factor 1 minus
      het soortelijk gewicht van het materiaal, uitgedrukt in kubieke meters, te delen door 0,096;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: 220.4.2°
    text: |-
      het grootste gehele getal verkregen door de oppervlakte van de bodem van het reddingvlot, uitgedrukt in vierkante
      meters, te delen door 0,372; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: 220.4.3°
    text: |-
      het aantal personen met een gemiddelde massa van 75 kg per persoon, allen met een reddinggordel aan, dat
      gemakkelijk en met voldoende hoofdruimte zittend plaats kan nemen, zonder het gebruik van enig uitrustingsstuk van
      het reddingvlot te belemmeren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '220.5'
    text: |-
      Ten minste één ingang moet zijn voorzien van een vaste inklimsteun om personen in staat te stellen vanuit zee in
      het reddingvlot te klimmen. Bij reddingvlotten van het strijkbare type met meer dan één ingang, moet de inklimsteun
      zijn aangebracht bij de ingang tegenover de aanhaaltalies en inschepingsvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '220.6'
    text: |-
      Ingangen die niet zijn voorzien van een inklimsteun, moeten een inschepingsladder hebben, waarvan de onderste trede
      ten minste 0,4 m beneden de waterlijn van het lege reddingvlot moet kunnen reiken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '220.7'
    text: |-
      Aan de binnenzijde van het reddingvlot moeten middelen zijn aangebracht waarmede personen zichzelf vanaf de
      inschepingsladder in het reddingvlot kunnen trekken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '220.8'
    text: |-
      Tenzij het reddingvlot veilig kan worden gebruikt ongeacht welke zijde boven drijft, moeten de sterkte en
      stabiliteit zodanig zijn dat het zelfrichtend is of gemakkelijk door één persoon zowel bij zeegang als in kalme zee
      gekeerd kan worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '220.9'
    text: |-
      De stabiliteit van een reddingvlot beladen met volle bezetting en volledige uitrusting moet zodanig zijn dat het in
      kalme zee gesleept kan worden met een snelheid van 3 zeemijl per uur.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '220.10'
    text: |-
      Het reddingvlot moet zijn uitgerust met een doelmatige vanglijn. De breeksterkte van het vanglijnsysteem, de wijze
      van bevestiging aan het reddingvlot inbegrepen, maar met uitzondering van de breekdraad, bedoeld in artikel 218,
      zeventiende lid, moet ten minste 10,0 kN zijn voor een reddingvlot dat is goedgekeurd voor 9 of meer personen en
      ten minste 7,5 kN voor een reddingvlot dat is goedgekeurd voor minder dan 9 personen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '220.11'
    text: |-
      Op het hoogste punt van de overkapping van het reddingvlot moet een met de hand- in en uitschakelbare lamp zijn
      aangebracht, die bij donkere nacht en heldere atmosfeer over een afstand van ten minste 2 zeemijl gedurende ten
      minste 12 uur zichtbaar is. Indien die lamp een flikkerlicht geeft, moet de frequentie ten minste 50 flikkeringen
      per minuut bedragen gedurende de eerste 2 van de 12 gebruiksuren. De lamp moet worden gevoed door een door zeewater
      geactiveerde batterij of door een droge batterij, en moet automatisch gaan branden wanneer de overkapping wordt
      opgezet. De batterij moet van een type zijn dat niet door vocht of vochtigheid in het ingepakte reddingvlot wordt
      aangetast.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '220.12'
    text: |-
      Aan de binnenzijde van het reddingvlot moet een met de hand in- en uitschakelbare lamp zijn aangebracht, die ten
      minste 12 uur onafgebroken kan branden. De lamp moet automatisch gaan branden wanneer de overkapping wordt opgezet,
      en moet voldoende licht geven om daarbij aanwijzingen en instructies te kunnen lezen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '220.13'
    text: 'Op het reddingvlot moet zijn aangegeven:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: 220.13.1°
    text: de naam en thuishaven of het vismerk, van het vaartuig waartoe het reddingvlot behoort;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: 220.13.2°
    text: de naam van de fabrikant of het handelsmerk;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: 220.13.3°
    text: het serienummer;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: 220.13.4°
    text: de naam van de bevoegde autoriteit die de oorspronkelijke type-goedkeuring heeft verricht;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: 220.13.5°
    text: |-
      het aantal personen waarvoor het is goedgekeurd, aangebracht boven iedere ingang in cijfers die ten minste 100 mm
      hoog zijn, in een kleur die contrasteert met de kleur van het materiaal van het reddingvlot;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: 220.13.6°
    text: de aanduiding «SOLAS»;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: 220.13.7°
    text: het type van het bij het reddingvlot verpakte noodpakket, bedoeld in artikel 218, veertiende lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: 220.13.8°
    text: de lengte van de vanglijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: 220.13.9°
    text: |-
      de maximum hoogte boven de laagst gelegen lastlijn van het vaartuig in zeewater, waarop het reddingvlot opgesteld
      mag worden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: 220.13.10°
    text: aanwijzingen voor het te water brengen van het reddingvlot.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '220.14'
    text: |-
      Naast het bepaalde in de voorgaande leden moet een vast reddingvlot van het strijkbare type, wanneer het aan
      de ontkoppelingshaak of spruit hangt, een belasting van 4 maal de massa van de volle bezetting en de volledige
      uitrusting kunnen doorstaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '220.15'
    text: |-
      In aanvulling op de uitrusting voorgeschreven in artikel 218, dertiende lid; moet een vast reddingvlot tevens zijn
      voorzien van het nodige reparatiemateriaal.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel220
  - number: '221.1'
    text: |-
      Alle reddingboten moeten deugdelijk zijn gebouwd en moeten van zodanige vorm en afmetingen zijn, dat zij in
      zeegang een ruime mate van stabiliteit en voldoende vrijboord hebben wanneer zij zijn beladen met volle bezetting
      en volledige uitrusting. Alle reddingboten moeten een vaste romp hebben en moeten, recht overeind liggend in
      kalm water en beladen met volle bezetting en volledige uitrusting, een positieve stabiliteit behouden wanneer er
      ergens beneden de waterlijn een gat is ontstaan, aangenomen dat daarbij geen verlies van drijfmateriaal of andere
      beschadiging optreedt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.2'
    text: 'Alle reddingboten moeten sterk genoeg zijn om:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.2.1°
    text: veilig te water gelaten te kunnen worden, beladen met volle bezetting en volledige uitrusting; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.2.2°
    text: |-
      te water gelaten en gesleept te kunnen worden wanneer het vaartuig een vaart loopt van 5 zeemijl per uur in rustig
      water.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.3'
    text: Rompen en vaste overkappingen moeten van brandvertragend of onbrandbaar materiaal zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.4'
    text: |-
      Zitplaatsen moeten worden gesitueerd op dwars- en langsdoften of als vaste zetels, die zo laag mogelijk in de
      reddingboot moeten zijn aangebracht, en zo zijn vervaardigd dat zij het aantal personen, ieder met een massa van
      100 kg, waarvoor ruimte is bestemd in overeenstemming met het bepaalde in het negende lid, onder 2, kunnen dragen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.5'
    text: |-
      Iedere reddingboot moet sterk genoeg zijn om onderstaande belasting te doorstaan, zonder blijvende vervorming na
      het verwijderen van de belasting:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.5.1°
    text: |-
      voor boten met een metalen romp: 1,25 maal de totale massa van de reddingboot beladen met volle bezetting en
      volledige uitrusting; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.5.2°
    text: 'voor andere boten: 2 maal de totale massa van de reddingboot beladen met volle bezetting en volledige uitrusting.'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.6'
    text: |-
      Iedere reddingboot moet sterk genoeg zijn om, beladen met volle bezetting en volledige uitrusting en met, waar
      dat van toepassing is, glijspanten of stootdempers op hun plaatsen, een zijdelingse slag tegen de scheepszijde
      met een stootsnelheid van ten minste 3,5 m/s en tevens een val op het water vanaf een hoogte van ten minste 3 m
      te doorstaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.7'
    text: |-
      De vertikale afstand tussen het vloeroppervlak en de binnenzijde van de overkapping over 50 percent van dat
      vloeroppervlak moet zijn:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.7.1°
    text: ten minste 1,3 m voor een reddingboot bestemd voor 9 personen of minder;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.7.2°
    text: ten minste 1,7 m voor een reddingboot bestemd voor 24 personen of meer; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.7.3°
    text: |-
      ten minste de afstand vastgesteld door lineaire interpolatie tussen 1,3 en 1,7 m voor een reddingboot bestemd voor
      meer dan 9 personen doch minder dan 24 personen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.8'
    text: Een reddingboot bestemd voor meer dan 150 personen is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.9'
    text: |-
      Het aantal personen waarvoor in een reddingboot ruimte wordt toegestaan, is gelijk aan het kleinste van de volgende
      getallen:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.9.1°
    text: |-
      het aantal personen met een gemiddelde massa van 75 kg per persoon en allen met een reddinggordel om, dat normaal
      zittend plaats kan nemen zonder de behandeling van de voortstuwingsmiddelen of het gebruik van enig uitrustingsstuk
      te belemmeren; of
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.9.2°
    text: |-
      het aantal plaatsen dat wordt verkregen door een indeling van de zitplaatsen in overeenstemming met figuur 1. De
      vormen kunnen elkaar, als aangegeven, gedeeltelijk overlappen, mits er voetsteunen zijn aangebracht en er voldoende
      beenruimte is en de vertikale afstand tussen de boven- en onderzitplaatsen ten minste 350 mm is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.10'
    text: Iedere zitplaats in de reddingboot moet duidelijk zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.11'
    text: |-
      Iedere reddingboot moet zo zijn ingericht dat het volledige aantal daarvoor bestemde personen binnen 3 minuten
      vanaf het moment dat het bevel daartoe wordt gegeven, zich kan inschepen. Snelle ontscheping moet eveneens mogelijk
      zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.12'
    text: |-
      Reddingboten moeten een inschepingsladder hebben die aan beide zijden van de reddingboot gebruikt kan worden, om
      personen in staat te stellen vanuit het water in de reddingboot te klimmen. De onderste trede van de ladder moet
      tot ten minste 0,4 m beneden de waterlijn van de lege reddingboot reiken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.13'
    text: |-
      De reddingboot moet zo zijn ingericht dat hulpbehoevende personen, zowel vanuit zee als per draagbaar, aan boord
      gebracht kunnen worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.14'
    text: Alle oppervlakken waarop personen kunnen lopen, moeten van een antisliplaag zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.15'
    text: |-
      Alle reddingboten moeten een eigen drijfvermogen hebben, of moeten zijn voorzien van drijvend materiaal dat niet
      nadelig wordt beïnvloed door zeewater, olie en olieprodukten, en dat voldoende is om de reddingboot met volledige
      uitrusting drijvende te houden wanneer zij vol water staat en de zee vrij kan binnendringen. Bovendien moet er voor
      het aantal personen waarvoor in de reddingboot ruimte is bestemd, drijvend materiaal met een opdrijvend vermogen
      gelijk aan 280 N per persoon, zijn aangebracht. Het voorgeschreven drijvend materiaal mag niet aan de buitenzijde
      van de romp van de reddingboot zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.16'
    text: |-
      Alle reddingboten moeten, beladen met 50 percent van het aantal personen waarvoor in de reddingboot ruimte is
      bestemd, gezeten op hun normale plaatsen aan één zijde van de reddingboot, een vrijboord hebben, gemeten vanaf de
      waterlijn tot aan de laagst gelegen opening waardoor de reddingboot kan vollopen, van ten minste 1,5 percent van de
      lengte van de reddingboot of 100 mm, welke van beide het grootste is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.17'
    text: |-
      Iedere reddingboot moet worden aangedreven door een dieselmotor. Voor een reddingboot mag geen motor worden
      gebruikt, waarvan de brandstof een vlampunt van 43°C of lager heeft.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.18'
    text: |-
      De motor moet zijn voorzien van een handstartinrichting of een bekrachtigde startinrichting met twee
      onafhankelijk werkende oplaadbare krachtbronnen. Voorts moet de motor zijn voorzien van alle voor het starten
      benodigde hulpmiddelen. De startinrichting van de motor en de hulpmiddelen voor het starten moeten bij een
      omgevingstemperatuur van minus 15°C de motor kunnen starten binnen 2 minuten vanaf het moment waarop de handelingen
      daarvoor zijn begonnen, tenzij naar het oordeel van het Hoofd van de Scheepvaartinspectie, met inachtneming van de
      bijzondere reizen die het vaartuig met die reddingboot voortdurend maakt, een andere temperatuur van toepassing is.
      De startinrichtingen mogen niet worden belemmerd door de motoromkasting, doften of andere obstakels.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.19'
    text: |-
      De motor moet ook gedurende ten minste 5 minuten na de koude start, met de reddingboot uit het water, kunnen
      draaien.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.20'
    text: De motor moet ook kunnen draaien indien de reddingboot tot aan de hartlijn van de krukas is volgelopen met water.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.21'
    text: |-
      De inrichting van de schroefas moet zodanig zijn dat de schroef kan worden ontkoppeld van het
      voortstuwingswerktuig. Er moeten voorzieningen zijn aangebracht waardoor het mogelijk is met de reddingboot zowel
      voor- als achteruit te varen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.22'
    text: |-
      De uitlaat van de motor moet zo zijn ingericht dat onder normaal gebruik wordt voorkomen dat water de motor
      binnendringt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.23'
    text: |-
      Alle reddingboten moeten zo zijn ontworpen dat rekening is gehouden met de veiligheid van personen in het water, en
      dat mogelijke beschadiging van de schroef door in het water drijvend materiaal wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.24'
    text: |-
      De snelheid van een reddingboot in kalm water vooruit varend moet, indien beladen met volle bezetting en volledige
      uitrusting en met alle door de motor aangedreven hulpuitrusting in bedrijf, ten minste 6 zeemijl per uur kunnen
      zijn en, wanneer een 25-persoons reddingvlot beladen met volle bezetting en volledige uitrusting of gelijkwaardige
      massa wordt gesleept, 2 zeemijl per uur. Er moet voldoende brandstof, geschikt voor gebruik bij de temperaturen
      die in het vaargebied van het vaartuig te verwachten zijn, aanwezig zijn om de volbeladen reddingboot gedurende ten
      minste 24 uur met een vaart van 6 zeemijl per uur te laten varen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.25'
    text: |-
      De motor van de reddingboot, de overbrenging en de motoraccessoires moeten zijn omgeven door een brandwerende
      omkasting of door geschikte voorzieningen die soortgelijke bescherming bieden. Dergelijke voorzieningen moeten
      tevens bescherming bieden tegen onopzettelijke aanraking van hete of bewegende delen van de motor door personen en
      moeten de motor beschermen tegen blootstelling aan weersinvloeden en zeewater. Er moeten doeltreffende maatregelen
      zijn getroffen om het lawaai van de motor te beperken. Startaccumulatoren moeten zijn aangebracht in omkastingen
      die een waterdichte ruimte vormen rondom de bodem en de zijden van de accumulatoren. De omkastingen moeten goed
      sluitende deksels hebben, waarin voorzieningen zijn aangebracht waardoor gassen kunnen ontsnappen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.26'
    text: |-
      De motor van de reddingboot en de accessoires moeten zo zijn ontworpen dat geen elektromagnetische velden ontstaan,
      die een storende invloed hebben op de radio-apparatuur die in de reddingboot wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.27'
    text: |-
      Er moeten voorzieningen zijn om alle accumulatoren ten behoeve van het starten van de motor, de radio-apparatuur en
      het zoeklicht op te laden. De radio-accumulatoren mogen niet worden gebruikt om stroom te leveren voor het starten
      van de motor. Er moeten voorzieningen zijn om de accumulatoren van de reddingboot door middel van het scheepsnet
      op te kunnen laden met een voedingsspanning die niet hoger is dan 55 V, en die op de inschepingsplaats van de
      reddingboot ontkoppeld kunnen worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.28'
    text: |-
      Er moeten waterbestendige start- en bedieningsvoorschriften van de motor voorhanden zijn, die duidelijk
      waarneembaar nabij de bedieningsplaats van de motor zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.29'
    text: |-
      Alle reddingboten moeten zijn voorzien van ten minste één afvoerklep, aangebracht bij het laagste punt in de
      romp, die automatisch opent om water uit de boot te lozen wanneer de reddingboot niet in het water ligt, en die
      automatisch afsluit om te voorkomen dat er water binnendringt wanneer de reddingboot in het water ligt. Om de
      afvoerklep te kunnen afsluiten moet deze zijn voorzien van een dop of prop die met een lijn, ketting of ander
      geschikt middel aan de reddingboot verbonden is. De afvoerkleppen moeten in de reddingboot gemakkelijk bereikbaar
      zijn en de plaats ervan moet duidelijk zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.30'
    text: |-
      Alle reddingboten moeten een roer en een helmstok hebben, ook indien er een stuurrad of een ander mechanisme
      voor afstandsbesturing is aangebracht. Het roer moet permanent aan de reddingboot zijn bevestigd. De helmstok
      moet permanent zijn aangebracht op of zijn verbonden met de roerkoning; indien de reddingboot een mechanisme
      voor afstandsbesturing heeft, is een afneembare helmstok toegestaan, die vast opgeborgen kan worden nabij de
      roerkoning. Het roer en de helmstok moeten zo zijn uitgevoerd dat zij niet beschadigd worden bij het gebruik van
      het ontkoppelingsmechanisme of van de schroef.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.31'
    text: |-
      Uitgezonderd in de omgeving van roer en schroef, moet langs de buitenzijde van de reddingboot een in bochten
      hangende en tot op het water komende drijvende grijplijn zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.32'
    text: |-
      Indien aan de onderzijde van de romp van een reddingboot handgrepen zijn aangebracht, moeten deze zodanig aan
      de reddingboot zijn bevestigd dat de reddingboot niet wordt beschadigd, indien de handgrepen door een kracht van
      buiten afbreken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.33'
    text: |-
      Alle reddingboten moeten zijn uitgerust met voldoende waterdichte kasten of compartimenten om bergruimte te bieden
      aan kleine uitrustingsstukken, water en andere benodigdheden, voorgeschreven in het tweeënveertigste lid. Er moeten
      voorzieningen aanwezig zijn voor het opslaan van opgevangen regenwater.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.34'
    text: |-
      Iedere reddingboot die door middel van een loper of lopers te water wordt gelaten, moet zijn uitgerust met een
      ontkoppelingsmechanisme dat aan de volgende eisen voldoet:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.34.1°
    text: het mechanisme moet zo zijn uitgevoerd dat alle haken gelijktijdig ontkoppeld worden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.34.2°
    text: 'het mechanisme moet de volgende twee ontkoppelingsmogelijkheden hebben:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.34.2°.2.1
    text: |-
      een normale ontkoppelingsmogelijkheid die de reddingboot kan ontkoppelen wanneer deze in het water ligt of wanneer
      de haken onbelast zijn; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.34.2°.2.2
    text: |-
      een belaste ontkoppelingsmogelijkheid die de reddingboot kan ontkoppelen wanneer de haken belast zijn. Deze
      ontkoppeling moet zo zijn uitgevoerd dat de reddingboot wordt ontkoppeld onder alle beladingstoestanden, reikend
      van onbelast met de reddingboot in het water liggend tot een belasting van 1,1 keer de totale massa van de
      reddingboot met volle bezetting en volledige uitrusting. Deze ontkoppelingsmogelijkheid moet voldoende beschermd
      zijn tegen ongewild of voortijdig gebruik;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.34.3°
    text: de ontkoppelingsbediening moet duidelijk zijn aangegeven in een kleur die contrasteert met die van de omgeving; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.34.4°
    text: |-
      het mechanisme moet zijn ontworpen met een veiligheidsfactor van 6, gebaseerd op de treksterkte van het gebruikte
      materiaal, waarbij aangenomen moet worden dat de massa van de reddingboot gelijkelijk verdeeld is over de lopers.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.35'
    text: |-
      Iedere reddingboot moet zijn uitgerust met een ontkoppelingsmiddel om de voorvanglijn te kunnen ontkoppelen wanneer
      daar kracht op staat.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.36'
    text: |-
      Iedere reddingboot moet zijn voorzien van een vast aangebrachte aardverbinding en van voorzieningen om de
      antenne behorende bij het in artikel 197, onder 1, voorgeschreven draagbaar radiotoestel, doelmatig in de
      gebruiksopstelling te kunnen plaatsen en vastzetten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.37'
    text: |-
      Reddingboten bestemd om langs de zijden van het vaartuig te water te worden gelaten, moeten de noodzakelijke
      glijspanten en stootdempers hebben om het te water laten mogelijk te maken en schade aan de reddingboot te
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.38'
    text: |-
      Op het hoogste punt van de overkapping moet een met de hand in- en uitschakelbare lamp zijn aangebracht, die bij
      donkere nacht en heldere atmosfeer over een afstand van ten minste 2 zeemijl gedurende ten minste 12 uur zichtbaar
      is. Indien de lamp een flikkerlicht geeft, moet de frequentie ten minste 50 flikkeringen per minuut bedragen
      gedurende de eerste 2 van de 12 gebruiksuren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.39'
    text: |-
      Aan de binnenzijde van de reddingboot moet een lamp of andere lichtbron zijn aangebracht, die gedurende ten minste
      12 uur voldoende licht geeft om daarbij aanwijzingen en instructies te kunnen lezen. Olielantaarns zijn voor dit
      doel niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.40'
    text: |-
      Tenzij anders bepaald, moet iedere reddingboot zijn voorzien van doelmatige middelen om te lozen of automatisch
      zelflozend zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.41'
    text: |-
      Iedere reddingboot moet zo zijn ingericht dat men vanaf de stuurstand voldoende uitzicht vooruit, achteruit en naar
      de zijden heeft in verband met het veilig te water laten en het manoeuvreren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.42'
    text: |-
      Alle uitrustingsstukken van een reddingboot, of die nu in dit lid of elders in dit hoofdstuk worden voorgeschreven,
      met uitzondering van de boothaken die beschikbaar moeten blijven om de reddingboten af te houden, moeten in
      de reddingboot zijn vastgezet door middel van sjorringen, opgeborgen in kasten of compartimenten, bevestigd in
      beugels of soortgelijke armaturen of op andere geschikte wijze. De uitrusting moet zo zijn vastgezet dat zij
      geen belemmering vormt bij «schip verlaten». Alle uitrustingsstukken moeten zo klein mogelijk zijn, een zo gering
      mogelijke massa hebben, en moeten op doeltreffende en compacte wijze verpakt zijn. Tenzij anders bepaald, moet de
      normale uitrusting van elke reddingboot bestaan uit:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.1°
    text: |-
      voldoende drijvende riemen om in kalme zee vooruit te kunnen komen. Voor iedere riem moeten er dollen, steunen
      of gelijkwaardige voorzieningen aanwezig zijn. De dollen of steunen moeten met lijnen of kettingen aan de boot
      bevestigd zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.2°
    text: twee boothaken;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.3°
    text: een drijvend hoosvat en twee emmers;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.4°
    text: aanwijzingen voor het overleven op zee;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.5°
    text: |-
      een nachthuis met een doelmatig kompas dat lichtgevend is of voorzien is van een doelmatige verlichting. In
      een geheel overdekte reddingboot moet het nachthuis permanent zijn aangebracht bij de stuurstand; in iedere
      andere reddingboot moeten er geschikte voorzieningen zijn om het nachthuis op te stellen. Het kompas moet zijn
      voorzien van een certificaat als bedoeld in artikel 277, vierde lid, afgegeven door een door het Hoofd van de
      Scheepvaartinspectie erkende deskundige;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.6°
    text: |-
      een drijfanker van voldoende grootte met een schokbestendige sleeplijn en een kaailijn die een goede greep biedt
      in natte toestand. De sterkte van het drijfanker, de sleeplijn en de kaailijn moet geschikt zijn voor elke toestand
      van de zee;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.7°
    text: |-
      twee doelmatige vanglijnen met een lengte van niet minder dan tweemaal de afstand van de opstellingsplaats van
      de reddingboot tot de laagst gelegen lastlijn van het vaartuig in zeewater of 15 m, welke van beide de grootste
      is. Eén vanglijn, bevestigd aan het ontkoppelingsmiddel, voorgeschreven in het vijfendertigste lid, moet aan de
      voorkant van de reddingboot gereed liggen en de andere moet in de reddingboot gereed liggen en stevig vastgezet
      zijn bij of inn de buurt van de boeg;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.8°
    text: twee bijlen, één aan ieder eind van de reddingboot;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.9°
    text: |-
      waterdichte houders die samen 3 liter zoet water bevatten voor iedere persoon waarvoor in de reddingboot ruimte is
      bestemd; hiervan mag 1 liter per persoon vervangen worden door een ontzoutingsapparaat dat in 2 etmalen een gelijke
      hoeveelheid zoet water kan produceren;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.10°
    text: een roestvrije aker met lijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.11°
    text: een roestvrije drinkbeker met maatverdeling;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.12°
    text: |-
      een noodrantsoen met een voedingswaarde van ten minste 10 000 kJ voor iedere persoon waarvoor in de reddingboot
      ruimte is bestemd; deze noodrantsoenen moeten worden bewaard in een luchtdichte verpakking en zijn geborgen in een
      waterdichte houder;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.13°
    text: vier valschermsignalen die voldoen aan het bepaalde in artikel 215;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.14°
    text: zes handstakellichten die voldoen aan het bepaalde in artikel 216;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.15°
    text: twee drijvende rooksignalen die voldoen aan het bepaalde in artikel 217;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.16°
    text: |-
      een waterdichte elektrische lantaarn geschikt voor het geven van morseseinen, alsmede een stel reservebatterijen en
      een reservelamp, verpakt in een waterdichte houder;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.17°
    text: een dagseinspiegel met gebruiksaanwijzingen voor het seinen naar vaartuigen, schepen en vliegtuigen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.18°
    text: |-
      een exemplaar van een door het Hoofd van de Scheepvaartinspectie vastgestelde lijst van reddingseinen, afgedrukt op
      een waterbestendige kaart of opgeborgen in een waterdichte verpakking;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.19°
    text: een fluit of een gelijkwaardig middel voor het geven van geluidsignalen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.20°
    text: |-
      voor iedere groep van maximaal 50 personen waarvoor in de reddingboot ruimte is bestemd, een waterdichte
      medicijnkist die na gebruik weer goed gesloten kan worden, met een bij ministeriële regeling vast te stellen
      inhoud, met de daarbij behorende controlelijst en handleidingen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.21°
    text: |-
      voor iedere persoon waarvoor in de reddingboot ruimte is bestemd, zes doses van een middel tegen zeeziekte en een
      zak voor overgeven bij zeeziekte;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.22°
    text: een zakmes dat met een lijn aan de reddingboot verbonden moet blijven;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.23°
    text: drie blikopeners;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.24°
    text: twee drijvende werplijnen van ten minste 30 m lengte, ieder voorzien van een drijvende werpring;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.25°
    text: een handpomp;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.26°
    text: een vislijn met haken;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.27°
    text: voldoende gereedschap voor kleinere reparaties aan de motor en de accessoires;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.28°
    text: een draagbaar brandblustoestel geschikt voor het blussen van oliebranden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.29°
    text: |-
      een zoeklicht dat een lichtgekleurd voorwerp van 18 m breedte op 180 m afstand bij nacht gedurende in totaal 6 uur,
      waarvan ten minste 3 uur achtereen, doelmatig kan verlichten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.30°
    text: een doelmatige radarreflector of gelijkwaardig middel voor ontdekking door middel van radar;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.31°
    text: |-
      hulpmiddelen tegen warmteverlies die voldoen aan het bepaalde in artikel 214, voldoende voor 2 personen of 10
      percent van het aantal personen waarvoor in de reddingboot ruimte is bestemd, welke van beide het grootste is; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: 221.42.32°
    text: |-
      in het geval van vaartuigen die reizen maken waarvan aard en duur zodanig zijn dat naar het oordeel van het Hoofd
      van de Scheepvaartinspectie de in 12 en 26 voorgeschreven uitrustingsartikelen niet noodzakelijk zijn, kan genoemd
      Hoofd vrijstelling verlenen van die bepalingen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.43'
    text: |-
      De afmetingen van de reddingboot en het aantal personen waarvoor in de reddingboot ruimte is bestemd, moeten in
      duidelijke, onuitwisbare tekens daarop zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.44'
    text: |-
      De naam en thuishaven, of het vismerk van het vaartuig waartoe de reddingboot behoort, moeten aan beide zijden van
      de voorsteven van de reddingboot zijn aangebracht in blokletters.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.45'
    text: |-
      Middelen ter identificatie van het vaartuig waartoe de reddingboot behoort en het nummer van de reddingboot, moeten
      zodanig zijn aangebracht dat zij vanuit de lucht zichtbaar zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '221.46'
    text: Reddingboten moeten doorlopend zijn genummerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel221
  - number: '222.1'
    text: Naast het bepaalde in artikel 221, moeten geheel overdekte reddingboten voldoen aan het bepaalde in dit artikel.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: '222.2'
    text: |-
      Iedere geheel overdekte reddingboot moet zijn uitgerust met een waterdichte overkapping die de gehele reddingboot
      overdekt. De overkapping moet zo zijn uitgevoerd dat:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: 222.2.1°
    text: de inzittenden worden beschermd tegen hitte en kou;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: 222.2.2°
    text: toegang tot de reddingboot wordt geboden door luiken die waterdicht afgesloten kunnen worden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: 222.2.3°
    text: |-
      de toegangsluiken op zodanige plaatsen zijn aangebracht dat handelingen voor het te water laten en weer terugzetten
      van de boot kunnen worden uitgevoerd zonder dat daarbij een van de inzittenden de overdekte ruimte behoeft te
      verlaten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: 222.2.4°
    text: |-
      de toegangsluiken zowel van binnenuit als van buitenaf geopend en gesloten kunnen worden, en voorzien zijn van
      middelen om ze in open toestand vast te zetten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: 222.2.5°
    text: het mogelijk is met de reddingboot te roeien;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: 222.2.6°
    text: |-
      deze, indien de reddingboot in omgekeerde toestand verkeert met de toegangsluiken gesloten en zonder lekkage van
      betekenis, de gehele massa van de reddingboot met volledige uitrusting en volle bezetting kan dragen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: 222.2.7°
    text: |-
      aan iedere zijde vensters of doorzichtige panelen zijn aangebracht, die voldoende daglicht binnen de reddingboot
      toelaten wanneer de toegangsluiken gesloten zijn, zodat kunstlicht onnodig is;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: 222.2.8°
    text: |-
      de buitenkant een goed zichtbare kleur heeft en de binnenkant een kleur heeft die voor de inzittenden niet
      hinderlijk is;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: 222.2.9°
    text: |-
      handgrepen zijn aangebracht die houvast bieden aan personen die zich langs de buitenkant van de reddingboot
      verplaatsen, en die steun geven bij in- en ontschepen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: 222.2.10°
    text: |-
      personen vanaf een toegang hun zitplaatsen kunnen bereiken, zonder over doften of andere obstakels te moeten
      klimmen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: 222.2.11°
    text: |-
      de inzittenden beschermd zijn tegen de gevolgen van gevaarlijke atmosferische onderdruk die door de motor kan
      worden veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: '222.3'
    text: |-
      Er moet bij iedere aangegeven zitplaats een veiligheidsgordel zijn aangebracht. De veiligheidsgordel moet zo zijn
      ontworpen dat een persoon met een massa van 100 kg vast op zijn plaats wordt gehouden wanneer de reddingboot in
      omgeslagen toestand verkeert.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: '222.4'
    text: |-
      De stabiliteit van de reddingboot moet zodanig zijn dat deze automatisch zelfrichtend is, indien zij beladen is
      met de volle of gedeeltelijke bezetting en volledige of gedeeltelijke uitrusting, alle toegangen en openingen
      waterdicht afgesloten zijn en de personen met hun veiligheidsgordel zijn vastgezet.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: '222.5'
    text: |-
      De reddingboot moet de volle bezetting en de volledige uitrusting kunnen dragen wanneer de reddingboot in de in
      artikel 221, eerste lid, omschreven, beschadigde toestand verkeert, en de stabiliteit moet zodanig zijn dat in
      het geval de reddingboot omslaat, zij automatisch een stand verkrijgt waarbij ontsnapping boven water voor de
      inzittenden mogelijk is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: '222.6'
    text: |-
      Het ontwerp van de motoruitlaatpijpen, luchtkanalen en andere openingen moet zodanig zijn dat water buiten de motor
      wordt gehouden wanneer de reddingboot omslaat en zich weer opricht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: '222.7'
    text: De motor en de overbrenging moeten vanaf de bestuurdersplaats kunnen worden bediend.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: '222.8'
    text: |-
      De motor en motorinstallatie moeten kunnen blijven draaien in iedere stand tijdens het omslaan en nadat de
      reddingboot zich weer heeft opgericht, dan wel automatisch stoppen bij het omslaan en gemakkelijk opnieuw te
      starten zijn nadat de reddingboot zich weer heeft opgericht. De brandstof- en smeersystemen moeten zodanig zijn
      uitgevoerd dat geen brandstofolie en niet meer dan 250 ml smeerolie uit de motor wordt verloren tijdens het
      omslaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: '222.9'
    text: |-
      Luchtgekoelde motoren moeten zijn voorzien van een systeem om koellucht aan te zuigen uit en af te voeren naar de
      buitenlucht. Met de hand bedienbare kleppen moeten aangebracht zijn om koellucht aan te zuigen uit en af te voeren
      in de reddingboot.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: '222.10'
    text: |-
      Onverminderd het bepaalde in artikel 221, zesde lid, moet een geheel overdekte reddingboot zo zijn gebouwd en van
      stootdempers zijn voorzien, dat zeker wordt gesteld dat de reddingboot aan inzittenden bescherming biedt tegen
      schadelijke versnellingen als gevolg van een slag van de reddingboot, beladen met volle bezetting en volledige
      uitrusting, tegen de scheepszijde met een stootsnelheid van ten minste 3,5 m/s.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel222
  - number: '223.1'
    text: |-
      Naast het bepaalde in dit artikel, moeten alle hulpverleningsboten voldoen aan het bepaalde in artikel 221, leden 1
      tot en met 7, 10 tot en met 32, 34, 35, 37, 40 en 43 tot en met 46.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.2'
    text: |-
      Hulpverleningsboten mogen van een vaste constructie zijn of van een constructie van het opblaasbare type, of van
      een constructie waarin beide mogelijkheden gecombineerd zijn, en moeten:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.2.1°
    text: een lengte hebben van ten minste 3,8 m en niet meer dan 8,5 m; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.2.2°
    text: ten minste vijf personen in zittende en een persoon in liggende houding kunnen dragen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.3'
    text: |-
      Hulpverleningsboten die zijn uitgevoerd als een combinatie van een vaste constructie en een constructie van
      het opblaasbare type, behoeven aan de navolgende bepalingen slechts te voldoen voor zover het Hoofd van de
      Scheepvaartinspectie dit bepaalt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.4'
    text: |-
      Tenzij de hulpverleningsboot voldoende zeeg heeft, moet de boot zijn voorzien van een boegbedekking die zich over
      ten minste 15 percent van de lengte uitstrekt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.5'
    text: |-
      Hulpverleningsboten moeten kunnen manoeuvreren bij een snelheid tot 6 zeemijl per uur en moeten gedurende ten
      minste 4 uur die snelheid kunnen aanhouden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.6'
    text: |-
      Hulpverleningsboten moeten voldoende handelbaar en manoeuvreerbaar zijn om bij zeegang personen uit het water
      te kunnen halen, reddingvlotten bij elkaar te kunnen brengen, en het grootste type reddingvlot dat aan boord is,
      beladen met volle bezetting en volledige uitrusting of een gelijkwaardige massa, met een vaart van ten minste 2
      zeemijl per uur te kunnen slepen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.7'
    text: |-
      Een hulpverleningsboot moet met een binnenboord- of buitenboordmotor zijn uitgerust. Indien een buitenboordmotor
      is toegepast, mogen het roer en de helmstok een onderdeel van de motor vormen. In afwijking van het bepaalde
      in artikel 221, zeventiende lid, kunnen buitenboordbenzinemotoren met een goedgekeurd brandstofsysteem worden
      toegepast in hulpverleningsboten, mits de brandstoftanks op bijzondere wijze tegen brand en explosie worden
      beschermd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.8'
    text: |-
      Er moeten permanente sleepvoorzieningen in de hulpverleningsboot zijn aangebracht en deze moeten sterk genoeg zijn
      om reddingvlotten bij elkaar te brengen of te slepen, als voorgeschreven in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.9'
    text: |-
      Hulpverleningsboten moeten zijn uitgerust met een berging voor kleinere uitrustingsstukken, die dicht is tegen weer
      en wind.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.10'
    text: |-
      Alle uitrustingsstukken van een hulpverleningsboot, met uitzondering van de boothaak die beschikbaar moet blijven
      om de boot af te houden, moeten in de hulpverleningsboot zijn vastgezet door middel van sjorringen, opgeborgen
      in kasten of compartimenten, bevestigd in beugels of soortgelijke armaturen of op andere geschikte wijze. De
      uitrusting moet zo zijn vastgezet dat zij geen belemmering vormt bij de handelingen voor het te water laten of het
      weer terugzetten. Alle uitrustingsstukken moeten zo klein mogelijk zijn, een zo gering mogelijke massa hebben en
      moeten op doeltreffende en compacte wijze zijn verpakt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.11'
    text: 'De normale uitrusting van een hulpverleningsboot moet bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.1°
    text: |-
      voldoende drijvende riemen of pagaaien om in kalme zee vooruit te kunnen komen. Voor iedere riem moeten er dollen,
      steunen of gelijkwaardige voorzieningen aanwezig zijn. De dollen of steunen moeten met lijnen of kettingen aan de
      boot bevestigd zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.2°
    text: een drijvend hoosvat;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.3°
    text: |-
      een nachthuis met een doelmatig kompas dat lichtgevend is of voorzien is van een doelmatige verlichting. Het kompas
      moet zijn voorzien van een certificaat als bedoeld in artikel 277, vierde lid, afgegeven door een door het Hoofd
      van de Scheepvaartinspectie erkende deskundige;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.4°
    text: |-
      een drijfanker van voldoende grootte met een schokbestendige sleeplijn van ten minste 10 m lengte en een kaailijn
      die een goede greep biedt in natte toestand. De sterkte van het drijfanker, de sleeplijn en de kaailijn moet
      geschikt zijn voor elke toestand van de zee;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.5°
    text: |-
      een vanglijn van voldoende lengte en sterkte, bevestigd aan het ontkoppelingsmiddel voorgeschreven in artikel 221,
      vijfendertigste lid, gereedliggend aan de voorkant van de hulpverleningsboot;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.6°
    text: |-
      een drijvende lijn van ten minste 50 m lengte, sterk genoeg om een reddingvlot te slepen als voorgeschreven in het
      zesde lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.7°
    text: |-
      een waterdichte elektrische lantaarn geschikt voor het geven van morseseinen, alsmede een stel reservebatterijen en
      een reservelamp, verpakt in een waterdichte houder;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.8°
    text: een fluit of een gelijkwaardig middel voor het geven van geluidsignalen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.9°
    text: |-
      een waterdichte medicijnkist die na gebruik weer goed gesloten kan worden, met een bij ministeriële regeling vast
      te stellen inhoud, met de daarbij behorende controlelijst en handleidingen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.10°
    text: |-
      twee drijvende werplijnen van ten minste 30 meter lengte, waarvan het ene uiteinde is voorzien van een drijvende
      werpring en het andere uiteinde aan de boot is vastgemaakt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.11°
    text: |-
      een zoeklicht dat een lichtgekleurd voorwerp van 18 m breedte op 180 m afstand bij nacht gedurende in totaal 6 uur,
      waarvan ten minste 3 uur achtereen, doelmatig kan verlichten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.12°
    text: een doelmatige radarreflector of gelijkwaardig middel voor ontdekking door middel van radar;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.13°
    text: |-
      hulpmiddelen tegen warmteverlies die voldoen aan het bepaalde in artikel 214, voldoende voor 2 personen of 10
      percent van het aantal personen waarvoor in de hulpverleningsboot ruimte is bestemd, welke van beide het grootste
      is;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.14°
    text: doelmatige middelen om personen in staat te stellen vanuit het water in de boot te klimmen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.15°
    text: voldoende gereedschap voor kleinere reparaties aan de motor en de accessoires; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.11.16°
    text: een draagbaar brandblustoestel geschikt voor het blussen van oliebranden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.12'
    text: |-
      Naast de uitrusting voorgeschreven in het elfde lid, moet de normale uitrusting van iedere vaste hulpverleningsboot
      bestaan uit:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.12.1°
    text: een boothaak;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.12.2°
    text: een emmer; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.12.3°
    text: een mes of bijl.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.13'
    text: |-
      Naast de uitrusting voorgeschreven in het elfde lid, moet de normale uitrusting van iedere hulpverleningsboot in
      opgeblazen toestand bestaan uit:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.13.1°
    text: een drijvend veiligheidsmes;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.13.2°
    text: twee sponzen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.13.3°
    text: een doelmatige, met de hand te bedienen blaasbalg of pomp;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.13.4°
    text: reparatiemateriaal in een geschikte houder, voor het herstellen van lekkages;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.13.5°
    text: een veiligheidsboothaak;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.13.6°
    text: een in bochten vastgebindselde grijplijn of voldoende handgrepen aan de binnenzijde van de boot; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.13.7°
    text: omkeerlijnen of andere middelen om de omgeslagen boot te keren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.14'
    text: |-
      Het bepaalde in artikel 221, derde en vijfde lid, is niet van toepassing op hulpverleningsboten in opgeblazen
      toestand.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.15'
    text: |-
      Een hulpverleningsboot in opgeblazen toestand moet zo zijn vervaardigd dat, wanneer deze aan zijn spruit of haak
      hangt:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.15.1°
    text: |-
      hij voldoende sterk en stijf genoeg is om afgevierd en teruggehesen te kunnen worden met volle bezetting en
      volledige uitrusting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.15.2°
    text: |-
      hij sterk genoeg is om een belasting van 4 maal de massa van de volle bezetting en volledige uitrusting te
      doorstaan, bij een temperatuur van de omgeving gelegen tussen 17°C en 23°C met alle overdrukventielen gesloten; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.15.3°
    text: |-
      hij sterk genoeg is om een belasting van 1,1 maal de massa van de volle bezetting en volledige uitrusting te
      doorstaan, bij een temperatuur van de omgeving van minus 30°C met alle overdrukventielen open.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.16'
    text: |-
      Hulpverleningsboten in opgeblazen toestand moeten zo zijn vervaardigd dat ze bestand zijn tegen blootstelling aan
      invloeden van weer en zee:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.16.1°
    text: opgesteld op een open dek aan boord van een vaartuig op zee; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: 223.16.2°
    text: gedurende 30 dagen drijvend in alle toestanden van zeegang.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.17'
    text: |-
      Naast het bepaalde in artikel 221, drieënveertigste tot en met zesenveertigste lid, moeten hulpverleningsboten in
      opgeblazen toestand gemerkt zijn met het serienummer, de naam of het handelsmerk van de fabrikant en de datum van
      fabricage.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.18'
    text: |-
      Het drijfvermogen van een hulpverleningsboot in opgeblazen toestand moet worden geleverd hetzij door een enkel
      drijflichaam onderverdeeld in ten minste vijf verschillende compartimenten van nagenoeg dezelfde inhoud, hetzij
      door twee verschillende drijflichamen die geen van beide groter zijn dan 60 percent van het totale volume. De
      drijflichamen moeten zo zijn ontworpen dat wanneer een van de compartimenten is beschadigd, de compartimenten
      die nog intact zijn, de hulpverleningsboot drijvend kunnen houden met het aantal personen waarvoor de
      hulpverleningsboot is bestemd, ieder met een massa van 75 kg en zittend op de normale plaats, met een positief
      vrijboord rondom de boot.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.19'
    text: |-
      De buitenste drijflichamen van de hulpverleningsboot moeten in opgeblazen toestand een inhoud hebben van ten minste
      0,17 m voor elke persoon waarvoor de hulpverleningsboot is bestemd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.20'
    text: |-
      Ieder drijflichaam moet zijn voorzien van een terugslagklep ten behoeve van het opblazen met de hand en van
      middelen om het drijflichaam te laten leeglopen. Tenzij het Hoofd van de Scheepvaartinspectie oordeelt dat een
      dergelijk middel niet noodzakelijk is, moet er tevens een overdrukventiel zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.21'
    text: |-
      Aan de onderzijde van de bodem en op kwetsbare plaatsen aan de buitenzijde van een hulpverleningsboot van het
      opblaasbare type, moeten ten genoegen van het Hoofd van de Scheepvaartinspectie schavielstrippen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.22'
    text: |-
      Indien de hulpverleningsboot met een spiegelplaat is uitgerust, mag deze niet verder naar binnen zijn aangebracht
      dan 20 percent van de lengte over alles van de hulpverleningsboot.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.23'
    text: |-
      Er moeten doelmatige bevestigingspunten zijn aangebracht om de vanglijnen voor en achter, en de grijplijnen langs
      de binnenzijde en de buitenzijde van de boot aan te bevestigen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '223.24'
    text: |-
      Een hulpverleningsboot van het opblaasbare type moet te allen tijde in volledig opgeblazen toestand worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel223
  - number: '224.1'
    text: |-
      Ieder tewaterlatingsmiddel met inbegrip van al het vier- en hijsgerei, moet zo zijn uitgevoerd dat het volledig
      uitgeruste groepsreddingmiddel of de hulpverleningsboot, die daarmee wordt bediend, met een kop- of stuurlast van
      10 graden en met een slagzij van 20 graden naar enige kant kant, veilig afgevierd kan worden:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: 224.1.1°
    text: na het inschepen, voorgeschreven in artikel 202, negende lid, met de volle bezetting; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: 224.1.2°
    text: zonder personen in het groepsreddingmiddel of in de hulpverleningsboot.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.2'
    text: |-
      Een tewaterlatingsmiddel mag, bij het afvieren van een groepsreddingmiddel of een hulpverleningsboot in de toestand
      omschreven in het eerste lid, onder 1 of 2, alleen afhankelijk zijn van zwaartekracht of opgeslagen mechanische
      kracht die onafhankelijk is van de energievoorziening van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.3'
    text: |-
      Een tewaterlatingsmiddel moet zo zijn ingericht dat het vanaf een plaats aan dek en vanaf een plaats
      in het groepsreddingmiddel of de hulpverleningsboot door een persoon in werking gesteld kan worden. Het
      groepsreddingmiddel en de hulpverleningsboot moeten zichtbaar zijn voor degene die het tewaterlatingsmiddel aan
      dek bedient.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.4'
    text: |-
      Ieder tewaterlatingsmiddel moet zo zijn geconstrueerd dat er een minimum aan onderhoud nodig is. Alle onderdelen
      die regelmatig onderhoud door de bemanning behoeven, moeten goed bereikbaar en gemakkelijk te onderhouden zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.5'
    text: 'De lierremmen van het tewaterlatingsmiddel moeten sterk genoeg zijn om:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: 224.5.1°
    text: een statische beproeving te doorstaan met een proefbelasting van ten minste 1,5 maal de maximale werkbelasting; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: 224.5.2°
    text: |-
      een dynamische beproeving te doorstaan met een proefbelasting van ten minste 1,1 maal de maximale werkbelasting bij
      de maximale afviersnelheid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.6'
    text: |-
      Een tewaterlatingsmiddel met toebehoren, met uitzondering van de lierremmen, moet sterk genoeg zijn om een
      statische beproeving met een proefbelasting van ten minste 2,2 maal de maximale werkbelasting te doorstaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.7'
    text: |-
      Structurele onderdelen en alle blokken, lopers, ogen, sluitingen, bevestigingen en alle andere benodigdheden
      die in verband met het te water laten worden gebruikt, moeten zijn ontworpen met een minimum veiligheidsfactor
      gebaseerd op de vastgestelde maximum werkbelasting en de treksterkte van het materiaal dat voor de constructie werd
      toegepast. Voor alle structurele onderdelen van davits en lieren moet een minimum veiligheidsfactor van 4,5 en voor
      alle lopers, kettingen, sluiten en blokken moet een minimum veiligheidsfactor van 6 worden toegepast.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.8'
    text: Ieder tewaterlatingsmiddel moet, voor zover uitvoerbaar, ook bij ijsafzetting doeltreffend blijven werken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.9'
    text: Een tewaterlatingsmiddel voor een reddingboot moet die reddingboot met zijn bedieningsbemanning kunnen ophijsen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.10'
    text: |-
      Een tewaterlatingsmiddel moet zodanig zijn ingericht dat de inscheping in het groepsreddingmiddel, in
      overeenstemming met het bepaalde in de artikelen 218, twaalfde lid, en 221, elfde lid, mogelijk is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.11'
    text: Lopers moeten van draaivrij en corrosiebestendig staaldraad zijn vervaardigd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.12'
    text: |-
      Tenzij een doeltreffende compensatie is aangebracht, moeten de lopers bij het gebruik van een meervoudige
      trommellier zo zijn ingericht dat zij bij het vieren met dezelfde snelheid van de trommel afwinden en dat ze bij
      het ophijsen gelijkmatig met dezelfde snelheid opwinden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.13'
    text: |-
      Ieder tewaterlatingsmiddel voor een hulpverleningsboot moet zijn uitgerust met een motorlier met een zodanig
      vermogen dat de hulpverleningsboot met volle bezetting en volledige uitrusting uit het water opgehesen kan worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.14'
    text: |-
      Teneinde ieder groepsreddingmiddel en iedere hulpverleningsboot weer op te kunnen hijsen, moet er een doeltreffende
      handbediening zijn. Zwengels en tandwielen van de handbediening mogen niet meedraaien met de bewegende delen van de
      lier wanneer het groepsreddingmiddel of de hulpverleningsboot wordt afgevierd of werktuiglijk wordt opgehesen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.15'
    text: |-
      Indien davits werktuiglijk binnenboord worden gehieuwd, moeten er veiligheden op worden aangebracht, die
      automatisch de drijfkracht uitschakelen voordat de davits de eindstand bereiken, om te vermijden dat de lopers of
      de davits overbelast worden, tenzij de motor zodanig is ontworpen dat een dergelijke overbelasting wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.16'
    text: |-
      De snelheid waarmee het groepsreddingmiddel of de hulpverleningsboot te water gelaten wordt, mag niet minder zijn
      dan die verkregen volgens de formule: S = 0,4 + (0,02 x H) waarin S = afviersnelheid in meters per seconde H =
      hoogte in meters vanaf de davitkop tot aan de laagst gelegen lastlijn van het vaartuig in zeewater.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.17'
    text: |-
      De maximale afviersnelheid wordt door het Hoofd van de Scheepvaartinspectie vastgesteld, met inachtneming van het
      ontwerp van het groepsreddingmiddel of de hulpverleningsboot, de bescherming van de inzittenden tegen buitensporige
      krachten en de sterkte van de tewaterlatingsvoorzieningen, en rekening houdend met de traagheidskrachten bij een
      noodstop. Het tewaterlatingsmiddel moet zodanig zijn ingericht dat wordt verzekerd dat deze snelheid niet zal
      worden overschreden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.18'
    text: |-
      Ieder tewaterlatingsmiddel voor de hulpverleningsboot moet de hulpverleningsboot beladen met volle bezetting en
      volledige uitrusting met een snelheid van ten minste 0,3 m/s kunnen ophijsen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.19'
    text: |-
      Op ieder tewaterlatingsmiddel moeten remmen zijn aangebracht die het afvieren van het groepsreddingmiddel of
      de hulpverleningsboot kunnen stoppen en deze met volle bezetting en volledige uitrusting beladen veilig kunnen
      vasthouden; de remblokken moeten waar nodig worden beschermd tegen water en olie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.20'
    text: |-
      Met de hand bedienbare remmen moeten zo zijn aangebracht dat de rem altijd in werking staat, tenzij de bediener
      daarvan, of een mechanisme dat door de bediener in werking wordt gesteld, de rem in de afvierstand houdt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.21'
    text: Onderblokken of enkele lopers mogen niet zijn voorzien van haken, anders dan veiligheidshaken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.22'
    text: |-
      Wanneer voor een groepsreddingmiddel een tewaterlatingsmiddel is voorgeschreven, terwijl het groepsreddingmiddel
      ook vrij moet kunnen opdrijven, moet de desbetreffende ontkoppeling van het groepsreddingmiddel op de
      opstellingsplaats automatisch zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.23'
    text: |-
      Ieder tewaterlatingsmiddel voor reddingvlotten moet voldoen aan het bepaalde in het eerste lid tot en met het
      eenentwintigste lid, met uitzondering van de bepalingen die betrekking hebben op het gebruik van zwaartekracht om
      het middel naar buiten te draaien, op het inschepen op de opstellingsplaats, en het weer ophijsen van het beladen
      reddingvlot. Het tewaterlatingsmiddel moet zo zijn ingericht dat voortijdige ontkoppeling tijdens het afvieren
      wordt voorkomen, en dat het reddingvlot automatisch wordt ontkoppeld wanneer dit het water raakt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.24'
    text: |-
      Er moeten handgrepen zijn aangebracht om een veilig overstappen van het dek op de bovenste treden van de
      inschepingsladder en omgekeerd te waarborgen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.25'
    text: 'De treden van de inschepingsladder moeten:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: 224.25.1°
    text: |-
      zijn vervaardigd van hardhout, zonder kwasten of andere onregelmatigheden, glad afgewerkt en vrij van scherpe
      randen en splinters, dan wel van geschikt materiaal met gelijkwaardige eigenschappen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: 224.25.2°
    text: |-
      zijn voorzien van een doeltreffend anti-slip oppervlak, verkregen door groeven in lengterichting of door het
      aanbrengen van een goedgekeurde anti-slip laag;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: 224.25.3°
    text: |-
      niet minder dan 480 mm lang, 115 mm breed en 25 mm dik zijn, waarbij een anti-slip oppervlak of -laag niet
      meegerekend wordt; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: 224.25.4°
    text: |-
      op gelijke afstanden van niet minder dan 300 mm en niet meer dan 380 mm van elkaar op zodanige wijze zijn
      bevestigd, dat zij de horizontale stand behouden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '224.26'
    text: |-
      De zijleiders van de inschepingsladder dienen aan elke zijde te bestaan uit twee onbeklede manilla-einden met
      een omtrek van ten minste 65 mm. Elk eind dient uit één stuk te bestaan zonder verbindingen beneden de bovenste
      trede. Ander materiaal kan worden gebruikt op voorwaarde dat de afmetingen, breeksterkte, verwering, rek- en
      grijpeigenschappen ten minste gelijkwaardig zijn aan die van manillatouwwerk. Alle touweinden dienen zo te zijn
      afgewerkt dat ze niet kunnen rafelen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel224
  - number: '225.1'
    text: 'Ieder lijnwerptoestel moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel225
  - number: 225.1.1°
    text: het moet een lijn met redelijke nauwkeurigheid kunnen wegschieten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel225
  - number: 225.1.2°
    text: |-
      het moet zijn voorzien van ten minste vier projectielen die bij gunstige weersomstandigheden een lijn kunnen
      wegschieten over een afstand van ten minste 230 m;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel225
  - number: 225.1.3°
    text: het moet zijn voorzien van ten minste vier lijnen, ieder met een breeksterkte van ten minste 2 kN; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel225
  - number: 225.1.4°
    text: |-
      het moet zijn voorzien van beknopte gebruiksaanwijzingen of pictogrammen, die duidelijk het gebruik van het
      lijnwerptoestel aangeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel225
  - number: '225.2'
    text: |-
      Het projectiel, in het geval van een door een pistool afgevuurd projectiel, of het projectiel en de lijn wanneer
      die een geheel vormen, moeten zijn geborgen in een waterbestendige houder. In het geval van een door een pistool
      afgevuurd projectiel moeten de lijnen en projectielen, tezamen met de ontstekingsmiddelen bovendien zijn geborgen
      in een verpakking die bescherming biedt tegen weersinvloeden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel225
  - number: '226'
    text: |-
      Instructies voor het onderhoud van reddingmiddelen aan boord moeten gemakkelijk te begrijpen zijn, waar mogelijk
      geïllustreerd zijn en al naar gelang de volgende gegevens voor elk reddingmiddel omvatten:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel226
  - number: 226.1°
    text: een controlelijst, te gebruiken wanneer de inspecties voorgeschreven in artikel 209, zevende lid, worden verricht;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel226
  - number: 226.2°
    text: aanwijzingen ten behoeve van onderhoud en reparaties;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel226
  - number: 226.3°
    text: schema voor periodiek onderhoud;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel226
  - number: 226.4°
    text: schematische voorstelling van smeerpunten en aanbevolen smeermiddelen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel226
  - number: 226.5°
    text: een lijst met vervangbare onderdelen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel226
  - number: 226.6°
    text: een lijst met adressen waar reserve-onderdelen verkregen kunnen worden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel226
  - number: 226.7°
    text: een logboek voor het aantekenen van inspecties en onderhoud.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel226
  - number: '227.1'
    text: |-
      Aan boord van een vaartuig dat reizen maakt waarbij het waarschijnlijk is dat van een loods gebruik zal worden
      gemaakt, moet een deugdelijke loodsladder aanwezig zijn die loodsen in staat stellen veilig aan en van boord te
      gaan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel227
  - number: '227.2'
    text: 'Een loodsladder dient aan de volgende eisen te voldoen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel227
  - number: 227.2.1°
    text: |-
      de ladder moet uit een enkele lengte bestaan en lang genoeg zijn om vanaf de inschepingsplaats aan boord het water
      te bereiken. Hierbij moet rekening worden gehouden met alle beladingstoestanden van het vaartuig, met kop- of
      stuurlast en met slagzij naar de andere zijde van 15 graden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel227
  - number: 227.2.2°
    text: 'de treden van de loodsladder dienen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel227
  - number: 227.2.2°.2.1
    text: |-
      te zijn vervaardigd van hardhout of ander materiaal met gelijkwaardige eigenschappen, uit één stuk te bestaan
      zonder kwasten en een doelmatig stroeve bovenzijde te hebben. De onderste vier treden mogen zijn vervaardigd van
      rubber van voldoende sterkte en stijfheid of van ander geschikt materiaal met gelijkwaardige eigenschappen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel227
  - number: 227.2.2°.2.2
    text: |-
      niet minder dan 480 mm lang, 115 mm breed en 25 mm dik te zijn, eventueel gebruikt anti-slipmateriaal niet
      meegerekend; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel227
  - number: 227.2.2°.2.3
    text: |-
      op gelijke afstanden van niet minder dan 300 mm en niet meer dan 380 mm van elkaar te zijn geplaatst en op zodanige
      wijze te zijn bevestigd dat zij de horizontale stand behouden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel227
  - number: 227.2.3°
    text: |-
      in een loodsladder mogen niet meer dan twee vervangende treden voorkomen die op hun plaats worden gehouden op een
      wijze die afwijkt van die waarop de oorspronkelijke treden zijn bevestigd. Elke trede die zo is vastgezet, dient
      zo spoedig mogelijk te worden vervangen door een trede die is bevestigd op de wijze zoals bij de oorspronkelijke
      samenstelling van de ladder is gebezigd. Indien vervangende treden aan de zijleiders zijn bevestigd door middel
      van uitsparingen in de zijkant van de treden, dienen deze uitsparingen zich te bevinden in de lange zijden van
      de treden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel227
  - number: 227.2.4°
    text: |-
      de zijleiders van de ladder dienen aan elke zijde te bestaan uit twee onbeklede manila-einden met een omtrek van
      ten minste 60 mm. Elk eind dient uit één stuk te bestaan zonder verbindingen in de lange zijden van de treden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel227
  - number: 227.2.5°
    text: |-
      spreilatten vervaardigd van hardhout of ander materiaal met gelijkwaardige eigenschappen, uit één stuk bestaande en
      met een lengte van niet minder dan 1,80 m, dienen op zodanige afstanden te zijn aangebracht dat er geen slag in de
      loodsladder kan komen. De laagste spreilat dient te zijn aangebracht ter plaatse van de vijfde trede van onderen en
      de tussenruimte tussen twee spreilatten mag niet meer dan 9 treden bedragen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel227
  - number: '227.3'
    text: |-
      Waar speciale constructies zoals berghouten, verhinderen dat de treden van de loodsladder stevig tegen de
      scheepshuid rusten, dienen ten genoegen van het Hoofd van de Scheepvaartinspectie zodanige maatregelen te worden
      getroffen dat het aan of van boord gaan veilig kan geschieden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel227
  - number: '227.4'
    text: |-
      Een mechanische loodsladder en bijbehorende uitrusting moeten van een goedgekeurd type zijn. De installatie moet
      zodanig zijn ontworpen en gebouwd dat de loods veilig aan of van boord kan gaan, een veilige toegang van de ladder
      naar het dek en omgekeerd inbegrepen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel227
  - number: '228'
    text: |-
      Aan boord van een vaartuig moet ten minste één elektrische veiligheidslamp van een goedgekeurd type aanwezig zijn
      om te gebruiken in ruimten waar dampen die tot een ontploffing aanleiding kunnen geven, kunnen worden verwacht. Een
      elektrische veiligheidslamp moet voldoen aan het bepaalde in artikel 105.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel228
  - number: '229.1'
    text: |-
      Aan boord van een vaartuig moeten de voor het visserijbedrijf bestemde inrichtingen en vaste toestellen zodanig
      zijn geconstrueerd en opgesteld, dat zij geen gevaar opleveren voor de veiligheid van het vaartuig en de
      gebruikers.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel229
  - number: '229.2'
    text: |-
      De masten en gieken, het staand en lopend tuig, alsmede het laad- en losgerei aan boord van een vaartuig moeten
      voldoende sterk zijn en in goede staat verkeren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel229
  - number: '229.3'
    text: |-
      De bij het in het tweede lid bedoelde tuig behorende blokken moeten voldoende sterk zijn en zodanig zijn uitgevoerd
      en aangebracht, dat zij geen gevaar opleveren voor de veiligheid der gebruikers.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel229
  - number: '229.4'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nadere regels stellen ter uitvoering van het bepaalde in de voorgaande
      leden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel229
  - number: '230'
    text: |-
      Hefwerktuigen met een maximale veilige werkbelasting van 10 kN of meer moeten zijn voorzien van een geldig
      certificaat, afgegeven door een door het Hoofd van de Scheepvaartinspectie erkende deskundige.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel230
  - number: '231.1'
    text: |-
      Aan boord van een vaartuig is de bij ministeriële regeling voorgeschreven medische uitrusting, bestaande uit
      geneesmiddelen, verplegingsartikelen en antidota, met de daarbij behorende controlelijsten en handleidingen
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel231
  - number: '231.2'
    text: |-
      De kapitein is verplicht zorg te dragen dat de medische uitrusting in goede staat verkeert, wordt
      aangevuld en zonodig wordt vernieuwd zodra dit mogelijk is, in ieder geval bij voorrang tijdens de normale
      bevoorradingsprocedures. Hij kan het gebruik en het beheer van de medische uitrusting aan boord, onverminderd zijn
      eigen verantwoordelijkheid, overdragen aan een of meer schepelingen die voldoen aan de eisen, bedoeld in artikel
      238.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel231
  - number: '232'
    text: De medische uitrusting wordt in daarvoor geschikte kisten of in daarvoor ingerichte kasten of ruimten bewaard.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel232
  - number: '233.1'
    text: |-
      De geneesmiddelen en antidota worden gescheiden van de verplegingsartikelen bewaard. Indien zij samen in één kist
      worden bewaard, zijn zij door een tussenschot gescheiden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel233
  - number: '233.2'
    text: |-
      De morfinepreparaten die deel uitmaken van de medische uitrusting, worden bewaard in een afgesloten ruimte,
      waarvan de sleutel berust bij de kapitein of bij de schepeling aan wie de kapitein het gebruik en het beheer van de
      medische uitrusting heeft overgedragen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel233
  - number: '234.1'
    text: |-
      Op de verpakking van de bestanddelen van de medische uitrusting is, voor zover mogelijk, het nummer aangebracht dat
      is vermeld in de ministeriële regeling op grond van artikel 231, eerste lid, en artikel 317, derde lid. Tevens is
      een afschrift van de controlelijsten bevestigd in de in artikel 232 bedoelde kisten, kasten of ruimten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel234
  - number: '234.2'
    text: |-
      Op de etiketten, aanwezig op de verpakking der middelen, zijn ten behoeve van in het buitenland te raadplegen
      deskundigen, zo veel mogelijk naast de Nederlandse, de Latijnse benamingen vermeld, overeenkomstig de nomenclatuur
      van de Wereld Gezondheids Organisatie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel234
  - number: '235'
    text: De geneesmiddelen en de antidota worden geleverd door een apotheker, hetgeen blijkt uit een merk op de verpakking.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel235
  - number: '236.1'
    text: |-
      Indien er nog andere geneesmiddelen, verplegingsartikelen en antidota aan boord aanwezig zijn dan die zijn
      voorgeschreven op grond van de ministeriële regeling, bedoeld in de artikelen 231, eerste lid, en 317, derde lid,
      zijn ten aanzien van deze aanvullende middelen de artikelen 232 tot en met 235 van toepassing.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel236
  - number: '236.2'
    text: |-
      Indien er sprake is van een medisch spoedgeval waarvoor de noodzakelijke geneesmiddelen, verplegingsartikelen of
      antidota aan boord niet aanwezig zijn, is de kapitein verplicht zorg te dragen dat deze zo spoedig mogelijk ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel236
  - number: '237'
    text: |-
      Ten behoeve van het gebruik van de medische uitrusting is aan boord een bijgehouden exemplaar van een bij
      ministeriële regeling aan te wijzen geneeskundig handboek.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel237
  - number: '239.1'
    text: |-
      Ten behoeve van de communicatie tussen controlestations, verzamel- en inschepingsplaatsen en overige strategische
      punten aan boord, moet er een noodcommunicatiesysteem aanwezig zijn, vast aangebracht dan wel draagbaar, of een
      combinatie van beide.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel239
  - number: '239.2'
    text: |-
      Aan boord van elk vaartuig moet een algemeen alarminstallatie zijn aangebracht die voldoet aan het bepaalde in
      het derde lid en die dient te worden gebruikt om de bemanning naar de verzamelplaatsen te roepen wanneer het sein
      «schip verlaten» wordt gegeven, alsmede om de in de alarmrol vermelde handelingen te doen aanvangen. De installatie
      moet worden aangevuld met een omroepinstallatie of ander doelmatig middel voor berichtgeving, in alle ruimten voor
      accommodatie, dienstruimten en controlestations.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel239
  - number: '239.3'
    text: |-
      De algemeen alarminstallatie moet bestaan uit een elektrische installatie die vanaf de brug en vanaf de andere
      strategisch gelegen punten aan boord bediend kan worden, en waarmee in alle ruimten voor accommodatie en in
      ruimten waarin door de bemanning gewoonlijk wordt gewerkt, door middel van bellen, claxons of andere gelijkwaardige
      waarschuwingssystemen, het algemeen alarmsignaal gegeven kan worden. Dit algemeen alarmsignaal bestaat uit zeven
      of meer korte stoten, gevolgd door een lange stoot. De algemeen alarminstallatie moet worden gevoed door de
      elektrische hoofdkrachtbron van het vaartuig en door de elektrische noodkrachtbron voorgeschreven in artikel 112,
      eerste lid of artikel 113, eerste lid. Het algemeen alarmsignaal moet vanaf de brug ook gegeven kunnen worden op de
      scheepsfluit of sirene.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel239
  - number: '239.4'
    text: |-
      Bij de aanleg van elektrische leidingen van systemen en installaties als bedoeld in het eerste en het tweede lid,
      moet worden voldaan aan het bepaalde in hoofdstuk 4, paragraaf 3.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel239
  - number: '239.5'
    text: |-
      Het bepaalde in het eerste en het tweede lid voor wat betreft een omroepinstallatie of ander doelmatig middel voor
      berichtgeving, is niet van toepassing op vaartuigen waarvan de lengte minder dan 45 m bedraagt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel239
  - number: '240.1'
    text: |-
      Aan boord van een vaartuig dienen voor elke opvarende duidelijke instructies aanwezig te zijn, die in geval van
      nood gevolgd moeten worden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: '240.2'
    text: |-
      Op in het oog vallende plaatsen aan boord van het vaartuig, met inbegrip van de brug, de machinekamer en de
      bemanningsverblijven, moeten exemplaren van de alarmrol zijn opgehangen, die voldoen aan het bepaalde in de
      navolgende leden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: '240.3'
    text: |-
      De alarmrol moet bijzonderheden bevatten inzake het algemeen alarmsignaal, voorgeschreven in artikel 239, derde
      lid, en moet tevens de maatregelen aangeven die door de bemanning genomen moeten worden wanneer dit signaal gegeven
      wordt. Op de alarmrol moet ook aangegeven worden hoe het sein «schip verlaten» wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: '240.4'
    text: |-
      Op de alarmrol moeten de taken worden vermeld die aan de verschillende bemanningsleden worden opgedragen,
      waaronder:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: 240.4.1°
    text: |-
      het sluiten van de waterdichte deuren, brandwerende deuren, afsluiters, stortkokers, spuigaten, zijpoorten,
      schijnlichten, patrijspoorten en overige soortgelijke openingen in het vaartuig;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: 240.4.2°
    text: |-
      het uitrusten van groeps- en overige reddingmiddelen, daarbij inbegrepen het draagbaar radiotoestel, bedoeld in
      artikel 197, eerste lid;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: 240.4.3°
    text: het gereed maken en te water laten van groepsreddingmiddelen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: 240.4.4°
    text: het gereed maken van andere reddingmiddelen in het algemeen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: 240.4.5°
    text: het gebruik van communicatiemiddelen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: 240.4.6°
    text: het bemannen van de brandweerploegen die aangewezen zijn om branden te bestrijden; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: 240.4.7°
    text: |-
      bijzondere taken, opgedragen in verband met het gebruik van de brandbestrijdingsuitrusting en -installaties, met
      inachtneming van de instructies in de brandbeveiligingsplannen of -boekjes van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: '240.5'
    text: |-
      Voor een vaartuig waarvan de lengte minder dan 45 m bedraagt, kan het Hoofd van de Scheepvaartinspectie afwijking
      van het bepaalde in het voorgaande lid toestaan, indien hij van oordeel is dat in verband met het kleine aantal
      bemanningsleden een alarmrol niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: '240.6'
    text: |-
      Op de alarmrol moet aangegeven zijn welke officieren aangewezen zijn om er voor te zorgen dat de redding- en
      brandbestrijdingsmiddelen in goede staat en klaar voor onmiddellijk gebruik worden gehouden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: '240.7'
    text: |-
      Op de alarmrol moeten plaatsvervangers aangegeven zijn voor de belangrijkste personen, indien deze niet tot
      handelen in staat zouden zijn, rekening houdende met het gegeven dat verschillende noodsituaties verschillende
      maatregelen noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: '240.8'
    text: |-
      De alarmrol moet zijn opgemaakt voordat het vaartuig een reis onderneemt. Nadat de alarmrol eenmaal is opgemaakt,
      moet, wanneer een verandering in de samenstelling van de bemanning wijziging van de alarmrol noodzakelijk maakt, de
      rol worden herzien of een nieuwe rol worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: '240.9'
    text: |-
      Het model van de alarmrol moet zijn ingericht overeenkomstig het model, vastgesteld door het Hoofd van de
      Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel240
  - number: '241.1'
    text: |-
      Ieder bemanningslid moet ten minste eenmaal per maand deelnemen aan een oefening «schip verlaten» en een oefening
      in het blussen van brand. Deze oefeningen voor de bemanning moeten tevens in ieder geval plaatsvinden binnen 24 uur
      nadat het vaartuig een haven heeft verlaten, wanneer meer dan 25 percent van de bemanning in de voorafgaande maand
      niet heeft deelgenomen aan dergelijke oefeningen aan boord van dat vaartuig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: '241.2'
    text: 'Iedere oefening «schip verlaten» moet onder meer omvatten:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: 241.2.1°
    text: |-
      het oproepen van de bemanning naar hun verzamelplaatsen door middel van de alarminstallatie voorgeschreven in
      artikel 239, tweede lid, en het zeker stellen dat zij op de hoogte zijn gebracht van het sein «schip verlaten»,
      vermeld in de alarmrol;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: 241.2.2°
    text: het melden op de verzamelplaatsen en het voorbereiden op de taken vermeld in de alarmrol;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: 241.2.3°
    text: een controle op doelmatige kleding van de bemanning;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: 241.2.4°
    text: een controle of de reddinggordels goed zijn aangedaan;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: 241.2.5°
    text: het afvieren van ten minste een reddingboot nadat deze voor het afvieren is gereed gemaakt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: 241.2.6°
    text: het starten en laten draaien van de reddingbootmotor; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: 241.2.7°
    text: het bedienen van de tewaterlatingsmiddelen voor de reddingvlotten van het strijkbare type.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: '241.3'
    text: |-
      Bij het afvieren als voorgeschreven in het tweede lid, onder 5, moeten, voor zover uitvoerbaar, bij opeenvolgende
      oefeningen de reddingboten afwisselend worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: '241.4'
    text: |-
      Voor zover uitvoerbaar moeten de oefeningen «schip verlaten» worden uitgevoerd alsof er daadwerkelijk sprake is van
      een noodsituatie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: '241.5'
    text: |-
      Iedere reddingboot moet ten minste eenmaal in de drie maanden tijdens een oefening «schip verlaten» met de
      aangewezen bemanning aan boord te water worden gelaten, waarbij tevens met de boot moet worden gevaren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: '241.6'
    text: |-
      Voor zover dat redelijk en uitvoerbaar is moeten hulpverleningsboten, andere dan hulpverleningsboten die tevens
      dienstdoen als reddingboten, iedere maand met hun aangewezen bemanning te water worden gelaten waarbij tevens moet
      worden gevaren. In ieder geval moet dit ten minste éénmaal in de drie maanden geschieden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: '241.7'
    text: |-
      Wanneer oefeningen met het te water laten van hulpverleningsboten gehouden worden met een vaartlopend vaartuig,
      moeten deze oefeningen in verband met de gevaren die daaraan verbonden zijn, uitsluitend uitgevoerd worden in
      beschutte wateren en onder toezicht van een scheepsofficier met ervaring in dergelijke oefeningen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: '241.8'
    text: |-
      De noodverlichting ten behoeve van het verzamelen en het «schip verlaten» moet bij iedere oefening «schip verlaten»
      worden beproefd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: '241.9'
    text: |-
      De oefeningen in het blussen van brand dienen er op gericht te zijn dat de leden van de bemanning vertrouwd raken
      met de inrichtingen en voorzieningen van het vaartuig, met hun taak en met het gebruik van de daarbij benodigde
      middelen. Voor zover uitvoerbaar moeten deze oefeningen worden uitgevoerd alsof er daadwerkelijk sprake is van een
      noodsituatie. Alle brandbluspompen moeten tijdens zulke oefeningen worden beproefd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel241
  - number: '242.1'
    text: |-
      In ieder bemanningsverblijf of in iedere hut voor bemanningsleden moet een handboek voor opleiding voorhanden
      zijn. Dit handboek, dat uit verschillende banden kan bestaan, dient instructies en informatie te bevatten, gesteld
      in gemakkelijk te begrijpen bewoordingen en waar mogelijk geïllustreerd, ten aanzien van de aan boord geplaatste
      reddingmiddelen en de beste overlevingsmethoden. In plaats van in dit handboek kan de informatie of enig deel
      daarvan ook met behulp van audio-visuele middelen worden verstrekt. De volgende punten dienen uitvoerig te worden
      toegelicht:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.1°
    text: het aandoen van reddinggordels en overlevingspakken;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.2°
    text: het verzamelen op de daarvoor aangewezen plaatsen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.3°
    text: het inschepen in, het te water laten en het vrijkomen van de groepsreddingmiddelen en de hulpverleningsboten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.4°
    text: de manier waarop het groepsreddingmiddel vanuit dat middel te water wordt gelaten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.5°
    text: het ontkoppelen van de tewaterlatingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.6°
    text: |-
      de werkwijze en het gebruik van de middelen voor bescherming op de tewaterlatingsplaatsen, voor zover van
      toepassing;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.7°
    text: de verlichting van de tewaterlatingsplaatsen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.8°
    text: het gebruik van alle overlevingsuitrusting;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.9°
    text: het gebruik van alle ontdekkingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.10°
    text: met behulp van illustraties, het gebruik van radio-apparatuur voor reddingmiddelen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.11°
    text: het gebruik van drijfankers;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.12°
    text: het gebruik van motor en accessoires;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.13°
    text: het terughijsen van de groepsreddingmiddelen en hulpverleningsboten, plaatsen en sjorren daarbij inbegrepen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.14°
    text: de gevaren van blootstelling aan weer en zee en de noodzaak van warme kleding;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.15°
    text: het op de beste wijze gebruiken van de voorzieningen van de groepsreddingmiddelen ten behoeve van overleving;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.16°
    text: |-
      de manier van redding van drenkelingen uit zee, waarbij inbegrepen het gebruik van helicopterreddinguitrusting
      (stroppen, manden, draagbaren), reddingboeien met broeking, overige reddingapparatuur gebruikt vanaf de wal en het
      lijnwerptoestel van het vaartuig;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.17°
    text: alle andere activiteiten die de alarmrol en de instructies voor noodgevallen aangeven; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.1.18°
    text: aanwijzingen voor noodreparaties van de reddingmiddelen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: '242.2'
    text: |-
      Opleiding aan boord in het gebruik van de reddingmiddelen, met inbegrip van de uitrusting van de
      groepsreddingmiddelen, moet zo snel mogelijk worden gegeven, echter uiterlijk 2 weken nadat een bemanningslid aan
      boord is gekomen. Wanneer echter het bemanningslid op een regelmatig aflosschema aan boord is geplaatst, moet deze
      opleiding worden gegeven binnen 2 weken nadat hij voor het eerst aan boord is gekomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: '242.3'
    text: |-
      Met dezelfde tussenpozen als de oefeningen «schip verlaten» en de oefeningen in het blussen van brand moet
      instructie in het gebruik van de reddingmiddelen en het overleven op zee worden gegeven. Individuele instructie kan
      verschillende onderdelen van het reddingsysteem omvatten, maar alle reddinguitrusting en -middelen moeten binnen
      een tijdsbestek van 2 maanden zijn behandeld. Ieder bemanningslid moet ten minste instructie krijgen betreffende:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.3.1°
    text: de behandeling en het gebruik van de automatisch opblaasbare reddingvlotten van het vaartuig;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.3.2°
    text: |-
      de problemen in verband met onderkoeling, eerste hulp bij onderkoeling en andere van belang zijnde eerste hulp
      maatregelen; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: 242.3.3°
    text: het gebruik van de reddingmiddelen bij zwaar weer en hoge zeeën.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: '242.4'
    text: |-
      Wanneer een vaartuig is uitgerust met reddingvlotten van het strijkbare type, moet, met tussenpozen van niet meer
      dan 4 maanden, opleiding in het gebruik van zulke reddingvlotten worden gegeven. Deze opleiding moet omvatten
      de behandeling van een tewaterlatingsmiddel en een reddingvlot, alsmede het afvieren en het tewaterlaten van
      het reddingvlot. Ten minste eenmaal in de 12 maanden dient dit afvieren en tewaterlaten te geschieden met de
      aangewezen bemanning ingescheept in het reddingvlot. Indien het vaartuig is uitgerust met automatisch opblaasbare
      reddingvlotten van het strijkbare type, moet het opblazen en het tewaterlaten geschieden voor zover dat praktisch
      uitvoerbaar is, en in ieder geval eenmaal in de 12 maanden. Het voor de opleiding gebruikte automatisch opblaasbare
      reddingvlot kan hetzij een van de voorgeschreven reddingvlotten zijn, hetzij een speciaal oefenvlot dat geen deel
      uitmaakt van de reddingmiddelen van het vaartuig en dat duidelijk als zodanig gemerkt moet zijn. Zulk een oefenvlot
      moet periodiek worden gekeurd overeenkomstig het bepaalde in artikel 209, achtste lid, onder 1.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: '242.5'
    text: |-
      Aan boord van elk vaartuig, met uitzondering van een vaartuig dat gesleept naar zijn bestemming wordt gebracht,
      moet het Handboek Opsporing en Redding op Zee (MERSAR), alsmede een door het Hoofd van de Scheepvaartinspectie
      vastgestelde lijst van reddingseinen aanwezig zijn. Dit handboek en deze lijst moeten steeds op de brug bij de
      hand zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel242
  - number: '243'
    text: |-
      De data waarop appèls worden gehouden, de bijzonderheden van oefeningen «schip verlaten» en oefeningen in het
      blussen van brand, oefeningen met andere reddingmiddelen en opleiding aan boord moeten in het scheepsdagboek worden
      aangetekend. Wanneer een volledig appèl, oefening of opleiding niet op de vastgestelde tijd plaatsvindt, moet dat
      worden aangetekend in het scheepsdagboek, waarbij vermeld moet worden onder welke omstandigheden en in welke mate
      het appèl, de oefening of de opleiding wèl is gehouden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel243
  - number: '244.1'
    text: |-
      Aan boord van een vaartuig waarvan de lengte 45 m of meer bedraagt moet een door het Hoofd van de
      Scheepvaartinspectie goedgekeurd veiligheidsplan, bestaande uit een algemeen plan van het vaartuig, aangevende de
      diverse dekken en compartimenten, toegangen tot deze compartimenten en de verbindingen tussen de dekken onderling,
      aanwezig zijn. Voorts moet op dat plan op duidelijke en overzichtelijke wijze worden aangegeven:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel244
  - number: 244.1.1°
    text: redding- en veiligheidsmiddelen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel244
  - number: 244.1.2°
    text: waterdichte deuren met hun bedieningsplaatsen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel244
  - number: 244.1.3°
    text: bedieningsmiddelen voor overvloeiinrichtingen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel244
  - number: 244.1.4°
    text: algemeen alarminstallatie; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel244
  - number: 244.1.5°
    text: noodstop- en snelsluitinrichtingen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel244
  - number: '244.2'
    text: Het Hoofd van de Scheepvaartinspectie kan nadere regels geven omtrent de uitvoering van het veiligheidsplan.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel244
  - number: '244.3'
    text: |-
      Veranderingen in de op het veiligheidsplan aangegeven inrichting en uitrusting behoeven de goedkeuring van het
      Hoofd van de Scheepvaartinspectie. Het aan boord aanwezige exemplaar van het veiligheidsplan moet zijn bijgewerkt
      overeenkomstig deze veranderingen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel244
  - number: '244.4'
    text: |-
      Het in het eerste lid voorgeschreven veiligheidsplan mag met de brandbeveiligingsplannen als bedoeld in de
      artikelen 164 en 184 tot een gezamenlijk plan worden gecombineerd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel244
  - number: '245'
    text: 'Ten aanzien van alarm-, nood- en spoedseinen moeten de volgende bepalingen in acht worden genomen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel245
  - number: 245.1°
    text: slechts de kapitein is bevoegd bevel te geven tot het gebruik van de in dit artikel genoemde seinen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel245
  - number: 245.2°
    text: 'het alarmsein mag slechts worden gebruikt om aan te kondigen:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel245
  - number: 245.2°.2.1
    text: dat een noodoproep of -bericht zal volgen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel245
  - number: 245.2°.2.2
    text: |-
      dat een bericht betreffende man-over-boord zal volgen, doch uitsluitend als hulp van andere schepen of vaartuigen
      wordt verlangd en deze niet op afdoende wijze kan worden verkregen door het uitzenden van het spoedsein alleen;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel245
  - number: 245.3°
    text: |-
      het noodsein mag slechts worden gebruikt, indien het vaartuig in ernstig en dreigend gevaar verkeert en
      onmiddellijk hulp nodig heeft;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel245
  - number: 245.4°
    text: |-
      het spoedsein mag slechts worden gebruikt, indien een zeer dringend bericht overgebracht moet worden betreffende de
      veiligheid van een schip, vaartuig, vliegtuig of ander middel van vervoer, of de veiligheid van een persoon;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel245
  - number: 245.5°
    text: |-
      de radiotelegrafische en radiotelefonische alarm-, nood- en spoedseinen en de daarop volgende nood- en
      spoedberichten moeten worden uitgezonden op de wijze als voorgeschreven in het Radioreglement;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel245
  - number: 245.6°
    text: |-
      het annuleren van radiotelegrafische en radiotelefonische nood- en spoedberichten dient te geschieden op de wijze
      als aangegeven in het Radioreglement;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel245
  - number: 245.7°
    text: |-
      het gebruik van enig noodsein anders dan om aan te geven dat een schip, vaartuig, vliegtuig of ander middel van
      vervoer in ernstig en dreigend gevaar verkeert en onmiddellijk hulp nodig heeft, evenals het gebruik van enig sein,
      dat met een noodsein kan worden verward, is verboden;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel245
  - number: 245.8°
    text: |-
      geen enkele bepaling van het Radioreglement of van hoofdstuk 9 kan een beletsel zijn, dat een in nood verkerend
      vaartuig of reddingmiddel van alle middelen waarover het beschikt, gebruik maakt om de aandacht te trekken, zijn
      plaats bekend te maken en hulp te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel245
  - number: '246.1'
    text: |-
      Wanneer aan boord van een vaartuig dat zich op zee bevindt een melding, uit welke bron ook, wordt ontvangen dat
      een schip, een vaartuig of een vliegtuig, of reddingmiddelen daarvan afkomstig, in nood is of zijn, moet worden
      gehandeld overeenkomstig het bepaalde in artikel 340.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel246
  - number: '246.2'
    text: Aan boord van een in nood verkerend vaartuig moet worden gehandeld overeenkomstig het bepaalde in artikel 340.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel246
  - number: '247.1'
    text: |-
      Indien gevaarlijk ijs, een gevaarlijk wrak of een ander onmiddellijk gevaar voor de scheepvaart, of een
      tropische storm wordt ontmoet, òf luchttemperaturen onder het vriespunt, gepaard gaande met stormwinden die zware
      ijsafzetting op de bovenbouw veroorzaken, of stormen met windkracht 10 of hoger volgens de schaal van Beaufort,
      waarvoor geen stormwaarschuwing werd ontvangen, worden ondervonden, moeten met alle ter beschikking staande
      middelen schepen en vaartuigen in de omgeving en via het eerste punt aan de wal waarmede verbinding kan worden
      verkregen, ook de bevoegde autoriteiten daarvan op de hoogte worden gebracht. De vorm waarin de inlichtingen worden
      gegeven, is niet bindend voorgeschreven. Zij mogen worden uitgezonden hetzij in verstaanbare taal, bij voorkeur
      Engels, hetzij in code met gebruikmaking van het Internationaal Seinboek.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel247
  - number: '247.2'
    text: |-
      Alle per radio uitgezonden berichten die ingevolge het bepaalde in het voorgaande lid worden uitgezonden moeten
      worden voorafgegaan door het betreffende veiligheidssein, waarbij de in het Radioreglement voorgeschreven procedure
      dient te worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel247
  - number: '247.3'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nadere regels geven betreffende de inlichtingen die een bericht dat wordt
      verzonden ingevolge het bepaalde in het eerste lid, moet bevatten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel247
  - number: '248.1'
    text: |-
      Voor de toepassing van het bepaalde in dit artikel wordt onder routeringssysteem verstaan: elk systeem bestaande
      uit een of meer routes of routeringsmaatregelen, gericht op het verminderen van gevaar voor scheepsongevallen. Het
      systeem omvat verkeersscheidingsstelsels, vaarwegen voor tweerichtingsverkeer, aanbevolen koerslijnen, gebieden die
      dienen te worden gemeden, zones voor kustverkeer, rotondes, voorzorgsgebieden en diepwaterroutes.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel248
  - number: '248.2'
    text: |-
      Van de verkeersscheidingsstelsels als bedoeld in Voorschrift 10 van het besluit «Bepalingen ter voorkoming
      van aanvaringen op zee, 1972» (*Stb.* 773) moet een passend gebruik worden gemaakt waarbij in het bijzonder de
      gedragsregels ten aanzien van het gebruik van deze verkeersscheidingsstelsels, vervat in genoemd Voorschrift,
      moeten worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel248
  - number: '248.3'
    text: |-
      Van de overige routeringssystemen die door de Internationale Maritieme Organisatie worden vastgesteld, moet een
      passend gebruik worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel248
  - number: '248.4'
    text: |-
      Elk vaartuig dat vaart in de buurt van de Grote Banken van Newfoundland, dient, voor zover dit uitvoerbaar is, te
      varen buiten de gebieden waarvan bekend is of verondersteld wordt dat zij ten gevolge van ijs gevaarlijk zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel248
  - number: '248.4'
    text: |-
      Indien ijs is gemeld op of nabij de koerslijn van het vaartuig moet ’s nachts een matige vaart worden gelopen of de
      koers zodanig worden veranderd dat deze goed vrij van het gevaarlijke gebied loopt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel248
  - number: '249'
    text: 'Voor de toepassing van dit hoofdstuk wordt, tenzij uitdrukkelijk anders bepaald, verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel249
  - number: 249.1°
    text: '**bestaande installatie:**'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel249
  - number: 249.1°.1.1
    text: een installatie die in zijn geheel vóór 1 september 1984 aan boord van een vaartuig is opgesteld, dan wel
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel249
  - number: 249.1°.1.2
    text: |-
      een installatie waarvan een gedeelte vóór 1 september 1984 aan boord van een vaartuig is opgesteld en waarvan het
      resterende gedeelte bestaande uit onderdelen, aangebracht ter vervanging van gelijksoortige onderdelen, of uit
      onderdelen die voldoen aan het bepaalde in dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel249
  - number: 249.2°
    text: '**nieuwe installatie**: elke installatie die geen bestaande installatie is;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel249
  - number: 249.3°
    text: |-
      **noodradiobaken**: een station in de Maritieme Mobiele Radiodienst, waarvan de uitzendingen bedoeld zijn om
      opsporingsen reddingsacties te vergemakkelijken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel249
  - number: '250'
    text: |-
      Een vaartuig waarvan de lengte 75 m of meer bedraagt, moet zijn uitgerust met een radiotelegraafstation dat voldoet
      aan het bepaalde in de artikelen 257 en 258.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel250
  - number: '251'
    text: |-
      Een vaartuig waarvan de lengte minder dan 75 m bedraagt, moet zijn uitgerust met een radiotelefoonstation dat
      voldoet aan het bepaalde in de artikelen 266 en 267, tenzij het is uitgerust met een radiotelegraafstation dat
      voldoet aan het bepaalde in de artikelen 257 en 258.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel251
  - number: '252'
    text: |-
      Elk vaartuig moet zijn uitgerust met een VHF radiotelefonie-installatie die voldoet aan het bepaalde in artikel
      268.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel252
  - number: '253.1'
    text: |-
      Het bepaalde in de artikelen 250 tot en met 252 is niet van toepassing op een vaartuig dat gesleept naar zijn
      bestemming wordt gebracht, met dien verstande dat, indien het vaartuig is bemand, radiocommunicatie met het
      slepende schip of vaartuig mogelijk moet zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel253
  - number: '253.2'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan van de in de artikelen 250 en 251 gestelde eisen geheel, gedeeltelijk of
      voorwaardelijk vrijstelling verlenen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel253
  - number: '254.1'
    text: |-
      Aan boord van een vaartuig dat ingevolge het bepaalde in artikel 250 of 251 is uitgerust met een
      radiotelegraafstation, moet een radio-officier als chef van het scheepsstation zijn aangewezen. Buitengaats
      moet door de radio-officier, door middel van een hoofdtelefoon of luidspreker worden geluisterd op de
      radiotelegrafienoodfrequentie gedurende de hieronder aangegeven tijden:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel254
  - number: 254.1.1°
    text: 'indien het niet is uitgerust met een radiotelegrafie-auto-alarmtoestel: de gehele duur van de reis;'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel254
  - number: 254.1.2°
    text: 'indien het is uitgerust met een radiotelegrafie-auto-alarmtoestel:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel254
  - number: 254.1.2°.2.1
    text: ten minste 8 uren in totaal per dag, indien de lengte van het vaartuig 75 m of meer bedraagt;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel254
  - number: 254.1.2°.2.2
    text: |-
      gedurende een door het Hoofd van de Scheepvaartinspectie bepaalde tijdsduur, indien de lengte van het vaartuig
      minder dan 75 m bedraagt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel254
  - number: '254.2'
    text: |-
      Gedurende de tijd dat een radio-officier ingevolge het bepaalde in het eerste lid moet uitluisteren op de
      radiotelegrafienoodfrequentie, mag de radio-officier de luisterdienst onderbreken gedurende de tijd waarin hij
      verkeer op andere frequenties behandelt of andere belangrijke radiowerkzaamheden verricht, doch alleen wanneer het
      praktisch onmogelijk is met een gesplitste hoofdtelefoon of met een luidspreker op de radiotelegrafienoodfrequentie
      te blijven luisteren. Tijdens de in het Radioreglement voorgeschreven stilteperiode mag de in het eerste lid
      voorgeschreven luisterdienst echter niet worden onderbroken, maar moet deze altijd worden onderhouden door een
      radio-officier die daarbij gebruik maakt van een hoofdtelefoon of luidspreker. Onder de in dit lid bedoelde
      belangrijke radiowerkzaamheden zijn begrepen het dringend herstel van radiocommunicatie-apparatuur voor
      veiligheidsdoeleinden, en van radionavigatie-apparatuur in opdracht van de kapitein.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel254
  - number: '254.3'
    text: |-
      Bovendien kan de luisterdienst in opdracht van de kapitein worden onderbroken om onderhoudswerkzaamheden te
      verrichten ter voorkoming van een dreigend defect aan radiocommunicatie-apparatuur voor veiligheidsdoeleinden, aan
      radionavigatie-apparatuur, en aan andere elektronische navigatie-apparatuur met inbegrip van reparaties daaraan.
      Deze onderbreking van de luisterdienst is slechts toegestaan, indien het praktisch onmogelijk is met een gesplitste
      hoofdtelefoon of met een luidspreker op de radiotelegrafienoodfrequentie te blijven luisteren, en het vaartuig
      is uitgerust met een decoder voor selectieve aanroepen, die voldoet aan de eisen van het Radioreglement. Tijdens
      de in het Radioreglement voorgeschreven stilteperioden mag de luisterdienst echter niet worden onderbroken, maar
      moet deze altijd worden onderhouden door een radio-officier die daarbij gebruik maakt van een hoofdtelefoon of
      luidspreker.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel254
  - number: '254.4'
    text: |-
      Aan boord van een vaartuig, uitgerust met een radiotelegrafie-auto-alarmtoestel, moet buitengaats dit toestel
      bijstaan gedurende de tijd dat geen luisterdienst als bedoeld in het eerste lid, wordt gehouden, ook tijdens het
      nemen van radiopeilingen indien deze daardoor niet worden beïnvloed.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel254
  - number: '254.5'
    text: |-
      De in het eerste lid voorgeschreven luistertijden moeten bij voorkeur worden gehouden tijdens de door het
      Radioreglement voor de radiotelegraafdienst voorgeschreven tijdvakken.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel254
  - number: '255.1'
    text: |-
      Aan boord van een vaartuig dat ingevolge het bepaalde in artikel 251 slechts is uitgerust met een
      radiotelefoonstation, moet een radio-officier, of een radiotelefonist als chef van het scheepsstation
      zijn aangewezen. Buitengaats moet op de brug een ononderbroken luisterwacht worden gehouden op de
      radiotelefonienoodfrequentie door middel van een radiotelefonie-luisterwachtontvanger voorzien van een luidspreker,
      al dan niet uitgerust met een filter voor het radiotelefonie-alarmsein.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel255
  - number: '255.2'
    text: |-
      Aan boord van een vaartuig dat ingevolge het bepaalde in artikel 250 of 251 is uitgerust met een
      radiotelegraafstation, moet buitengaats op de brug een ononderbroken luisterwacht worden gehouden op de
      radiotelefonie-noodfrequentie door middel van een radiotelefonieluisterwachtontvanger voorzien van een luidspreker,
      al dan niet uitgerust met een filter voor het radiotelefonie-alarmsein.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel255
  - number: '255.3'
    text: |-
      Wanneer aan boord van een vaartuig ingevolge het bepaalde in het eerste lid een radiotelefonist als chef van
      het scheepsstation is aangewezen, moet, indien de lengte van het vaartuig 45 m of meer bedraagt een tweede
      radiotelefonist aan boord zijn. Deze tweede radiotelefonist behoeft niet aan boord te zijn als de chef van het
      scheepsstation uitsluitend is belast met werkzaamheden op het gebied van de radiotelefonie.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel255
  - number: '256'
    text: |-
      Aan boord van een vaartuig dat ingevolge het bepaalde in artikel 252 is uitgerust met een VHF radiotelefonie-
      installatie, moet buitengaats op de brug een ononderbroken luisterwacht worden gehouden op, indien uitvoerbaar,
      156,8 MHz (kanaal 16) of gedurende zodanige perioden op zodanige kanalen als nader kan worden voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel256
  - number: '257.1'
    text: |-
      Het radiotelegraafstation moet zodanig zijn gelegen, dat de goede ontvangst van radioseinen niet hinderlijk
      wordt gestoord door lawaai van buitenaf van mechanische of andere aard. Het station moet zo hoog als praktisch
      uitvoerbaar is en zo veilig mogelijk in het vaartuig zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel257
  - number: '257.2'
    text: |-
      De radiohut moet van voldoende afmetingen zijn en behoorlijk kunnen worden geventileerd om het mogelijk te maken
      de hoofd- en reservetelegrafie-installaties doelmatig te doen bedienen; de hut mag niet worden gebruikt voor enig
      doel, dat de bediening van het radiotelegraafstation zou kunnen belemmeren.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel257
  - number: '257.3'
    text: |-
      De slaapplaats van ten minste één radio-officier moet zo dicht bij de radiohut zijn gelegen als praktisch
      uitvoerbaar is. Deze slaapplaats mag zich niet in de radiohut bevinden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel257
  - number: '257.4'
    text: |-
      Tussen de radiohut en de brug en eventueel een andere plaats, vanwaar genavigeerd wordt, moet een doelmatig
      tweezijdig systeem voor oproep en mondeling contact aanwezig zijn, dat onafhankelijk moet zijn van het
      hoofdcommunicatiesysteem van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel257
  - number: '257.5'
    text: |-
      De radiotelegrafie-installatie moet op een zodanige plaats zijn opgesteld, dat zij is beschermd tegen schadelijke
      inwerking van water of van extreme temperaturen. Zij moet gemakkelijk toegankelijk zijn, zowel voor onmiddellijk
      gebruik in een noodgeval als voor herstelwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel257
  - number: '257.6'
    text: |-
      Er moet een betrouwbaar uurwerk aanwezig zijn met een wijzerplaat van niet minder dan 125 mm middellijn, waarop
      de door het Radioreglement voor de radiotelegraafdienst voorgeschreven stilteperioden zijn aangegeven. Dit uurwerk
      moet zijn voorzien van een in het middelpunt van de wijzerplaat geplaatste secondewijzer. Het moet solide op een
      dusdanige plaats in de radiohut zijn gemonteerd, dat de gehele wijzerplaat gemakkelijk en nauwkeurig door de radio-
      officier vanaf de bedieningsplaats van de radiotelegrafie-installatie en vanaf de plaats, waar het radiotelegrafie-
      auto-alarmtoestel wordt beproefd, kan worden waargenomen.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel257
  - number: '257.7'
    text: |-
      In de radiohut moet een betrouwbare noodverlichting, bestaande uit een elektrische lamp, die de bedieningsknoppen
      van de hoofd- en reserveradiotelegrafie-installaties en het in het voorgaande lid vereiste uurwerk voldoende
      verlicht, vast zijn aangebracht. Indien aangesloten op de ingevolge artikel 258, eerste lid, onder 3, vereiste
      reservekrachtbron moet deze lamp kunnen worden in- en uitgeschakeld door middel van hotelschakelaars die zijn
      geplaatst nabij de hoofdingang van de radiohut en bij de bedieningsplaats van de radiotelegrafie-installatie,
      tenzij de inrichting van de radiohut zulks overbodig maakt. Deze schakelaars moeten van een duidelijke aanwijzing
      zijn voorzien waaruit hun doel blijkt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel257
  - number: '257.8'
    text: |-
      Er moet óf een elektrische looplamp die door de ingevolge artikel 258, eerste lid, onder 3, vereiste
      reservekrachtbron wordt gevoed en is voorzien van een flexibel snoer van voldoende lengte, óf een zaklantaarn
      aanwezig zijn en in de radiohut worden bewaard.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel257
  - number: '257.9'
    text: |-
      Het radiotelegraafstation moet zijn uitgerust met die reserve-onderdelen, gereedschappen en meetapparaten, die
      naar het oordeel van het Hoofd van de Scheepvaartinspectie nodig zijn om de radiotelegrafie-installatie buitengaats
      in doeltreffende staat te houden. De meetapparatuur moet een instrument of instrumenten voor het meten van
      wisselspanningen, gelijkspanningen en weerstanden omvatten.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel257
  - number: '257.10'
    text: |-
      Wanneer een afzonderlijke noodradiohut aanwezig is, moeten de eisen ingevolge het vierde tot en met het achtste lid
      daarop worden toegepast.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel257
  - number: '257.11'
    text: |-
      Het radiotelegraafstation moet zijn uitgerust met middelen ter bestrijding van brand, zoals aangegeven in de
      artikelen 157, zevende lid, en 180, zevende lid.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel257
  - number: '258.1'
    text: 'Tenzij uitdrukkelijk anders is bepaald moet:'
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: 258.1.1°
    text: |-
      het radiotelegraafstation een hoofdinstallatie en een reserve-installatie omvatten, die elektrisch gescheiden en
      elektrisch onafhankelijk van elkaar zijn;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: 258.1.2°
    text: |-
      de hoofdinstallatie een hoofdzender, een hoofdontvanger, een radiotelefonie-luisterwachtontvanger en een
      hoofdkrachtbron omvatten;
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: 258.1.3°
    text: de reserve-installatie, een reservezender, een reserve-ontvanger en een reservekrachtbron omvatten; en
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: 258.1.4°
    text: |-
      een hoofdantenne en een reserve-antenne aanwezig en aangebracht zijn, met dien verstande dat de reserve-antenne
      niet behoeft te zijn aangebracht wanneer dat ondoenlijk of onredelijk is. In een dergelijk geval moet een voor
      het doel geschikte, geheel voor ogenblikkelijk aanbrengen klaargemaakte reserve-hoofdantenne worden meegevoerd.
      Bovendien moeten, om het mogelijk te maken een voor het doel geschikte antenne op te hangen, in alle gevallen
      voldoende antennedraad en isolatoren aanwezig zijn. De hoofdantenne moet op doeltreffende wijze tegen breuk zijn
      beveiligd, indien hij is opgehangen tussen steunpunten die aan zwiepen onderhevig zijn.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.2'
    text: |-
      In installaties op vaartuigen waarvan de lengte minder dan 75 m bedraagt is, wanneer de hoofdzender voldoet aan
      alle eisen voor de reservezender, deze laatste niet verplicht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.3'
    text: |-
      De hoofd- en reservezenders moeten vlug kunnen worden verbonden met en afgestemd op de hoofdantenne en op de
      reserve-antenne wanneer deze is aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.3'
    text: |-
      De hoofd- en reserve-ontvangers moeten vlug kunnen worden verbonden met elke antenne, waarmede zij moeten kunnen
      worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.4'
    text: |-
      Alle onderdelen van de reserve-installatie moeten zo hoog mogelijk en zo veilig mogelijk in het vaartuig zijn
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.5'
    text: |-
      De hoofd- en reservezenders moeten kunnen zenden op de radiotelegrafienoodfrequentie in een klasse van uitzending
      zoals door het Radioreglement voor die frequentie is aangewezen. Bovendien moet de hoofdzender kunnen zenden op ten
      minste twee werkfrequenties in de band tussen 405 en 535 kHz, in de door het Radioreglement voor die frequenties
      aangewezen klasse van uitzending. De reservezender mag bestaan uit een scheepsnoodzender zoals die is omschreven
      in, en in gebruik beperkt door, het Radioreglement.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.6'
    text: |-
      Wanneer gemoduleerde uitzending door het Radioreglement is voorgeschreven moeten de hoofd- en de reservezenders een
      modulatiediepte van niet minder dan 70 percent en een toonfrequentie tussen 450 en 1350 Hz hebben.
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: '258.7'
    text: |-
      De hoofd- en de reservezenders moeten, verbonden met de hoofdantenne, een minimum normale reikwijdte hebben als
      hierna aangegeven; daarbij moeten zij in staat zijn duidelijk waarneembare tekens van schip tot schip, bij dag
      en onder normale condities en omstandigheden over de aangegeven afstanden over te brengen. Duidelijk waarneembare
      tekens zullen in normale omstandigheden worden ontvangen, wanneer de effectieve waarde van de veldsterkte bij
      de ontvanger ten minste 50 microvolt per meter is. Wanneer geen directe meting van de veldsterkte kan worden
      uitgevoerd, mogen de volgende gegevens als leidraad voor een benadere bepaling van de normale reikwijdte worden
      gebruikt:
    url: https://wetten.overheid.nl/BWBR0004607/2002-02-01#Artikel258
  - number: 258.7.1.1°
    text: |-
