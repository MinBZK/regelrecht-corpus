        artikel: '4'
        hoofdstuk: '2'
  - number: '11'
    text: |-
      1 Het is verboden binnen een bij ministeriële regeling te bepalen afstand van een bijzondere spoorweg op, in,
      naast, boven of onder de bijzondere spoorweg leidingen, werken, andere inrichtingen of beplantingen aan te
      brengen, te doen aanbrengen, of te hebben, te graven, bouwwerken op te richten, dan wel daarmee verband houdende
      werkzaamheden uit te voeren of te doen uitvoeren.

      2 Het eerste lid is niet van toepassing voor zover de handelingen worden verricht ten behoeve van de rechtmatige
      uitoefening van beheerstaken als bedoeld in [artikel 3][ref1], vervoer als bedoeld in [artikel 4][ref2], of
      toezicht als bedoeld in de [wet][ref3].

      3 De afstand, bedoeld in het eerste lid, kan voor verschillende activiteiten en voor verschillende categorieën van
      bijzondere spoorwegen verschillend worden vastgesteld.

      4 Onze Minister kan op aanvraag ontheffing verlenen van het bepaalde in het eerste lid, indien dit de veiligheid
      van het spoorverkeer niet in gevaar brengt of kan brengen. De ontheffing kan onder beperkingen worden verleend. Aan
      de ontheffing kunnen voorschriften worden verbonden.

      5 Het is verboden te handelen in strijd met de beperkingen en voorschriften, bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0036778#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0036778#Artikel4
