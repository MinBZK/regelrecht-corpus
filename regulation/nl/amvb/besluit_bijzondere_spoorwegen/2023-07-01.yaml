      spoorwegen die gelegen zijn binnen een niet vrij voor het publiek toegankelijk terrein van een bedrijf.

      3 De [artikelen 3][ref24], [4][ref25], [69][ref26], [88 tot en met 91][ref27] en [97 van de wet][ref28] en
      de [artikelen 3 tot en met 9][ref29], [12 tot en met 17][ref30] en [26][ref31] van dit besluit zijn niet van
      toepassing op bijzondere spoorwegen of gedeelten daarvan waarvan de bijzondere spoorweginfrastructuur of een deel
      daarvan is verwijderd of die op een andere wijze voor gebruik ontoegankelijk zijn gemaakt.


