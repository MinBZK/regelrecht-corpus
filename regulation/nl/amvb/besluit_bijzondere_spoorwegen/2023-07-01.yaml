        artikel: '8'
        hoofdstuk: '2'
  - number: '10'
    text: |-
      1 Het is verboden om:

      a. in te grijpen in de bediening of de werking van installaties van de bijzondere spoorweginfrastructuur;

      b. de bijzondere spoorweginfrastructuur of delen daarvan te verwijderen, beschadigen, wijzigen of er voorwerpen of
      vloeistoffen op, naast, boven of onder te plaatsen;

      c. dieren te drijven of te laten lopen dan wel zich te bevinden op of langs delen van een bijzondere spoorweg die
      niet zijn gelegen in een spoorwegovergang of samenlopen met een voor het openbaar verkeer openstaande weg, tenzij
      de spoorwegbeheerder toestemming heeft gegeven.

      2 Het eerste lid is niet van toepassing voor zover de handelingen worden verricht ten behoeve van de rechtmatige
      uitoefening van beheerstaken als bedoeld in [artikel 3][ref1], vervoer als bedoeld in [artikel 4][ref2], of
      toezicht als bedoeld in de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0036778#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0036778#Artikel4
    url: https://wetten.overheid.nl/BWBR0036778/2023-07-01#Artikel10
