articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *treinbestuurder:* machinist of rangeerder;
        - *bijzondere spoorweginfrastructuur:* spoorweginfrastructuur, waarbij de spoorwegen bijzondere spoorwegen zijn;
        - *gevaarlijke stoffen:* gevaarlijke stoffen als bedoeld in de [Wet vervoer gevaarlijke stoffen][ref1];
        - *spoorwegbeheerder:* degene die een bijzondere spoorweg operationeel beschikbaar stelt;
        - *spoorwegovergang:* kruising van een bijzondere spoorweg en een weg;
        - *sein:* baken, bord, lichtsein, een aanwijzing inhoudende een ge- of verbod, een waarschuwing of een aanduiding;
        - *trein:* spoorvoertuig of samenstel van spoorvoertuigen;
        - *vervoerder:* degene die gebruik maakt of gebruik laat maken van een bijzondere spoorweg en daartoe over tractie
      beschikt;
        - *wegbeheerder:* een van de overheden, genoemd in de [artikelen 15 tot en met 17 van de Wegenwet][ref2] of, indien
      van toepassing, het openbaar lichaam als bedoeld in [artikel 20, derde lid van de Wet personenvervoer 2000][ref3]
      voor zover het wegbeheer aan het openbaar lichaam is overgedragen;
        - *wet:* [Spoorwegwet][ref4].


