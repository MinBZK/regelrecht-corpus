  - number: '13'
    text: |-
      1 De spoorwegbeheerder kan, Onze Minister gehoord, een overweg als bedoeld in [artikel 1 van het RVV 1990][ref1],
      beveiligen.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze van beveiliging, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel1
