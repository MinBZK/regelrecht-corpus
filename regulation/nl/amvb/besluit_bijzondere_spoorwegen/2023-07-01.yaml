        artikel: '14'
        hoofdstuk: '4'
  - number: '16'
    text: |-
      Op een beweegbare brug die uitsluitend bestemd is voor het gebruik door spoorvoertuigen, gelegen in een bijzondere
      spoorweg, zijn de artikelen van [25][ref1] en [26 van het Besluit hoofdspoorweginfrastructuur][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017626#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0017626#Artikel26
    url: https://wetten.overheid.nl/BWBR0036778/2023-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0017626
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0017626
        artikel: '26'
  - number: '17'
    text: |-
      1 De spoorwegbeheerder doet onverwijld melding aan Onze Minister van incidenten en ongevallen waardoor de
      veiligheid van het spoorverkeer of van de daarbij betrokken personen in gevaar is gebracht of in gevaar gebracht
      had kunnen worden, waaronder in elk geval de incidenten en ongevallen die resulteren in een dodelijke afloop,
      blijvend letsel of een ziekenhuisopname.

      2 Bij de melding worden in elk geval de aard en omvang van het incident of het ongeval vermeld.

      3 De melding wordt niet gedaan indien er reeds een melding over het incident of ongeval is gedaan overeenkomstig
      een andere wet en het incident of ongeval heeft plaatsgevonden binnen een niet voor het publiek vrij toegankelijk
      terrein van een bedrijf.
    url: https://wetten.overheid.nl/BWBR0036778/2023-07-01#Artikel17
  - number: '18'
    text: |-
