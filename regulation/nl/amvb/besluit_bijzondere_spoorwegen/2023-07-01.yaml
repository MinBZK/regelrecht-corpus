        bwb_id: BWBR0004825
        artikel: '1'
  - number: '14'
    text: |-
      1 Daar waar een bijzondere spoorweg samenloopt met voor het openbaar verkeer openstaande weg, is de treinbestuurder
      van een trein verplicht:

      a. snelheid te verminderen en te stoppen als de veiligheid van het verkeer dat verlangt;

      b. weggebruikers voor te laten gaan;

      c. de aanwijzingen 1 tot en met 7 van [bijlage 2, behorende bij het RVV 1990][ref1], op te volgen; en

      d. aan de weggebruikers de voor het rijden van de trein en voor de veiligheid van het verkeer benodigde stoptekens,
      bedoeld in [artikel 82, vierde lid, van het RVV 1990][ref2], en andere aanwijzingen te geven.

      2 De stoptekens en aanwijzingen, bedoeld in het eerste lid, onderdeel d, mogen ook worden gegeven door een
      begeleider van een trein.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel82
    url: https://wetten.overheid.nl/BWBR0036778/2023-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004825
      - id: ref2
        bwb_id: BWBR0004825
        artikel: '82'
  - number: '15'
    text: |-
      1 Bij spoorwegovergangen waar bijzondere spoorwegen met niet voor het openbaar verkeer openstaande wegen kruisen,
      verlenen weggebruikers voorrang aan treinen. De gehele spoorwegovergang wordt daarbij vrij gelaten.

      2 Het is weggebruikers verboden een spoorwegovergang als bedoeld in het eerste lid op te gaan indien:

      a. het niet mogelijk is deze spoorwegovergang onmiddellijk te passeren en de spoorwegovergang geheel vrij te maken;

      b. door de treinbestuurder of de begeleider van de trein een stopteken als bedoeld in
      [artikel 82, vierde lid, van het RVV 1990][ref1] wordt getoond.

      3 [Artikel 14, eerste lid, onderdeel d, en tweede lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0036778#Artikel14
    url: https://wetten.overheid.nl/BWBR0036778/2023-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '82'
      - id: ref2
