  - number: '3'
    text: |-
      1 De spoorwegbeheerder draagt er zorg voor dat de bijzondere spoorweg veilig kan worden gebruikt. Deze zorg omvat
      onder meer de zorg voor het onderhoud van de bijzondere spoorweginfrastructuur, de toegang tot de bijzondere
      spoorweg en de treindienstleiding, en houdt in ieder geval in dat hij:

      a. de aan het gebruik van de bijzondere spoorweg en aan de bedrijfsvoering verbonden risico’s onderkent,
      waaronder de geschiktheid en vakbekwaamheid van de onder zijn verantwoordelijkheid vallende personen met een
      veiligheidsfunctie, de aard van het vervoer over de bijzondere spoorweg en de spoorverkeersintensiteit, en

      b. passende maatregelen neemt en passende voorzieningen treft om deze risico’s te beheersen.

      2 De spoorwegbeheerder beschrijft en documenteert de risico’s, de maatregelen en de voorzieningen, bedoeld in het
      eerste lid, onder a en b.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de beschrijving en documentatie, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0036778/2023-07-01#Artikel3
  - number: '4'
    text: |-
      1 De vervoerder draagt zorg voor het veilig gebruik van de bijzondere spoorweg en voor de veiligheid van de
      personen die hij vervoert en die in- of uit de trein stappen. Deze zorg houdt in ieder geval in dat hij:

      a. de aan het gebruik van de bijzondere spoorweg en aan de bedrijfsvoering verbonden risico’s onderkent,
      waaronder de geschiktheid en vakbekwaamheid van de onder zijn verantwoordelijkheid vallende personen met een
      veiligheidsfunctie, en

      b. passende maatregelen neemt en passende voorzieningen treft om deze risico’s afdoende te beheersen.

      2 De vervoerder beschrijft en documenteert de risico’s, de maatregelen en de voorzieningen, bedoeld in het eerste
      lid, onder a en b.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de beschrijving en documentatie, bedoeld in het
      tweede lid.

      4 De vervoerder doet voor het vertrek van de betrokken trein mededeling aan de spoorwegbeheerder en de
      treinbestuurder van het UN-nummer en het gevaarsidentificatienummer van gevaarlijke stoffen, bedoeld in de
      [Regeling vervoer over de spoorweg van gevaarlijke stoffen][ref1], indien dergelijke stoffen worden vervoerd en van
      de plaats waar deze zich in de trein bevinden.

      5 Het is de vervoerder verboden een trein te doen vertrekken indien niet aan het vierde lid is voldaan.

      6 De spoorwegbeheerder kan naar aanleiding van een mededeling als bedoeld in het vierde lid in het belang van een
      veilig en ongestoord gebruik van de bijzondere spoorweg aan de vervoerder aanwijzingen inzake dat gebruik geven.

      7 De vervoerder is verplicht de aanwijzingen, bedoeld in het zesde lid, op te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0036778/2023-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: '5'
    text: |-
      1 De treindienstleider, bedoeld in [artikel 2 van het Besluit spoorwegpersoneel 2011][ref1], oefent een
      veiligheidsfunctie uit.

      2 Een veiligheidsfunctie wordt slechts uitgeoefend door een persoon die de leeftijd van achttien jaar heeft
      bereikt.

      3 Onze Minister kan ontheffing van het tweede lid verlenen voor 16- en 17 jarige personen indien er geen gevaar
      voor personen of ander treinverkeer kan ontstaan. De ontheffing kan onder beperkingen worden gegeven. Aan de
      ontheffing kunnen voorschriften in het belang van de veiligheid worden verbonden.

      4 Onze Minister kan een ontheffing als bedoeld in het derde lid, wijzigen of intrekken:

      a. indien gehandeld wordt in strijd met de voorschriften of beperkingen, bedoeld in het derde lid;

      b. bij gewijzigde omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0030006#Artikel2
    url: https://wetten.overheid.nl/BWBR0036778/2023-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0030006
        artikel: '2'
  - number: '6'
    text: |-
      1 De spoorwegbeheerder regelt het spoorverkeer door seinen, indien hij dit noodzakelijk acht om de veiligheid van
      het spoorverkeer te borgen.

      2 In elk geval wordt het spoorverkeer geregeld door seinen:

      a. op delen van de bijzondere spoorweg waar de toegestane maximumsnelheid meer dan 30 kilometer per uur bedraagt;
      en

      b. bij beweegbare bruggen.

      3 De treinbestuurder die gebruik maakt van een bijzondere spoorweg of daarvan gebruik gaat maken neemt de voor hem
      bestemde seinen in acht.
    url: https://wetten.overheid.nl/BWBR0036778/2023-07-01#Artikel6
  - number: '7'
    text: |-
      1 Treinen zijn ’s nachts, bij mistig weer en bij slecht zicht voldoende zichtbaar door, gelet op de rijrichting,
      te zijn voorzien van ten minste een wit of geel stralend licht aan de voorzijde en een rood stralend licht aan de
      achterzijde van het voertuig waarvan de bewegende kracht uitgaat.

      2 In afwijking van het eerste lid is een trein ’s nachts, bij mistig weer of slecht zicht tijdens het rangeren
      voorzien van ten minste een wit, geel of rood stralend licht aan de voorzijde, gelet op de rijrichting.

      3 Het is verboden gebruik te maken van de bijzondere spoorweg als niet is voldaan aan het eerste of tweede lid.

      4 In afwijking van het derde lid mag de treinbestuurder in geval van defecte verlichting aan de voorzijde van de
      trein doorrijden tot het eindpunt van de rit:

      a. met zodanige snelheid dat het voor de bestuurder mogelijk is de trein tot stilstand te brengen binnen de afstand
      waarover de treinbestuurder de bijzondere spoorweg kan overzien en waarover deze vrij is, en

      b. wanneer bij de nadering van een spoorwegovergang een geluidssignaal gegeven wordt.

      5 Onder rangeren wordt in dit artikel verstaan het splitsen of opnieuw samenvoegen van treinen, dan wel in een
      bepaalde volgorde op een spoor of naar andere sporen manoeuvreren.
    url: https://wetten.overheid.nl/BWBR0036778/2023-07-01#Artikel7
  - number: '8'
    text: |-
      1 De maximumsnelheid op bijzondere spoorwegen is 30 kilometer per uur.

      2 Onze Minister kan voor een bijzondere spoorweg of een gedeelte daarvan, op aanvraag van de spoorwegbeheerder,
      ontheffing verlenen van het bepaalde in het eerste lid door een hogere toegestane maximumsnelheid te bepalen,
      indien dit de veiligheid van het spoorverkeer niet nadelig beïnvloedt. Indien de bijzondere spoorweg kruist of
      samenloopt met een voor het openbaar verkeer openstaande weg wordt de wegbeheerder gehoord. De ontheffing kan
      onder beperkingen worden gegeven. Aan de ontheffing kunnen voorschriften in het belang van de veiligheid worden
      verbonden.

      3 Onze Minister kan voor een bijzondere spoorweg of een gedeelte daarvan, in het belang van het veilig spoorverkeer
      of, indien de bijzondere spoorweg kruist of samenloopt met voor het openbaar verkeer openstaande wegen, in het
      belang van het veilig wegverkeer, een lagere toegestane maximumsnelheid vaststellen. De spoorwegbeheerder wordt
      gehoord, en indien de bijzondere spoorweg kruist of samenloopt met voor het openbaar verkeer openstaande wegen,
      wordt de wegbeheerder gehoord.

      4 Onze Minister kan een ontheffing als bedoeld in het tweede lid, wijzigen of intrekken:

      a. indien gehandeld wordt in strijd met de voorschriften of beperkingen, bedoeld in het tweede lid;

      b. bij gewijzigde omstandigheden.

      5 Het is verboden om met een hogere snelheid over een bijzondere spoorweg te rijden dan de in het eerste, tweede
      of derde lid bedoelde toegestane maximumsnelheid, of te handelen in strijd met de beperkingen en voorschriften,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0036778/2023-07-01#Artikel8
  - number: '9'
    text: |-
      Onverminderd [artikel 8][ref1] is het verboden gebruik te maken van een bijzondere spoorweg met een snelheid
      die niet in overeenstemming is met het remvermogen van de trein, of met de eigenschappen van de bijzondere
      spoorweginfrastructuur.


      [ref1]: https://wetten.overheid.nl/BWBR0036778#Artikel8
    url: https://wetten.overheid.nl/BWBR0036778/2023-07-01#Artikel9
