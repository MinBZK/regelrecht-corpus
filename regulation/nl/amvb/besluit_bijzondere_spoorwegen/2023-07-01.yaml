      1 De [artikelen 1 tot en met 4][ref1], [69][ref2], [76, eerste lid][ref3], [77][ref4], [80][ref5],
      [86 tot en met 91][ref6] en [97 van de wet][ref7], en de [artikelen 1 tot en met 19][ref8], [26][ref9] en
      [27][ref10] van dit besluit, zijn niet van toepassing op bijzondere spoorwegen:

      a. met een nominale spoorwijdte van minder dan 500 millimeter; of

      b. die zijn aan te merken als een attractie- of speeltoestel als bedoeld in het
      [Warenwetbesluit attractie- en speeltoestellen 2023][ref11].

      2 De [artikelen 3][ref12], [4][ref13], [69][ref14], [76, eerste lid][ref15], [77][ref16], [80][ref17],
