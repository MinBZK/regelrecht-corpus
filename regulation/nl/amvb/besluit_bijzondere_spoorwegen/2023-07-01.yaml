  - number: '26'
    text: |-
      1 Beschikkingen op grond van de [artikelen 4, eerste of tweede lid, van het Reglement op de raccordementen][ref1],
      [artikel 54, eerste lid, van het Reglement dienst hoofd- en lokaalspoorwegen][ref2], dan wel concessies afgegeven
      op grond van [artikel 2 van de Locaalspoor- en tramwegwet][ref3] voor zover deze op een toegestane snelheid van
      meer dan 30 kilometer per uur zien en geldend op het tijdstip van inwerkingtreding van [artikel 8][ref4] van dit
      besluit, worden geacht ontheffingen te zijn, afgegeven op grond van artikel 8, tweede lid.

      2 Beschikkingen afgegeven op grond van een [artikel 4, tweede lid, van het Reglement op de raccordementen][ref5],
      voor zover deze op een maximaal toegestane snelheid van minder dan 30 kilometer per uur zien en geldend op het
      tijdstip van inwerkingtreding van [artikel 8][ref6] van dit besluit, worden geacht beschikkingen te zijn, afgegeven
      op grond van artikel 8, derde lid.


