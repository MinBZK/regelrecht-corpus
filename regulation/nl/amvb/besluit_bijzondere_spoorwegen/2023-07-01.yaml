  - number: '12'
    text: |-
      1 Spoorwegovergangen gelegen in voor het openbaar verkeer openstaande wegen worden door de spoorwegbeheerder
      voorzien van aan iedere rechterzijde van de weg geplaatste Andreaskruisen volgens model J12 of J13 van
      [bijlage 1 van het RVV 1990][ref1].

      2 Het eerste lid geldt niet voor spoorwegovergangen waarover minder dan eenmaal per week een trein rijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
