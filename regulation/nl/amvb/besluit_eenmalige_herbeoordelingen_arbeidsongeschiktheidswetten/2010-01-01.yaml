  - number: '2'
    text: |-
      1 [Artikel 3:28, vijfde lid, eerste zin, van de Wet werk en arbeidsondersteuning jonggehandicapten][ref1]
      en [artikel 34, vierde lid, eerste zin, van de Wet op de arbeidsongeschiktheidsverzekering][ref2]
      is niet van toepassing op personen die op 31 december 1986 dan wel 31 juli 1993 recht hadden op een
      arbeidsongeschiktheidsuitkering op grond van artikel 6, eerste lid, onderdeel b, van de Algemene
      Arbeidsongeschiktheidswet.

      2 De [artikelen 34, vierde lid, eerste zin, van de Wet op de arbeidsongeschiktheidsverzekering][ref3],
      [35, vijfde lid, eerste zin van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] en
      [28, vijfde lid, eerste zin, van de Wet arbeidsongeschiktheidsvoorziening jongehandicapten][ref5] zijn niet van
      toepassing op:

      a. personen als bedoeld in [artikel 1, eerste lid, onderdeel a][ref6], ten aanzien van wie in de periode
      genoemd in dat onderdeel op een andere grond reeds een arbeidsongeschiktheidsbeoordeling als bedoeld in het
      [Schattingsbesluit arbeidsongeschiktheidswetten][ref7] heeft plaatsgevonden;

      b. personen als bedoeld in [artikel 1, eerste lid, onderdeel b][ref8], ten aanzien van wie in de periode genoemd
      in [artikel 1, eerste lid, onderdeel a of b][ref9], op een andere grond reeds een arbeidsongeschiktheidsbeoordeling
      als bedoeld in het [Schattingsbesluit arbeidsongeschiktheidswetten][ref10] heeft plaatsgevonden.

      3 Het tweede lid is niet van toepassing indien de arbeidsongeschiktheidsbeoordeling nog heeft plaats gevonden op
      grond van het [Schattingsbesluit arbeidsongeschiktheidswetten][ref11] zoals dat luidde voor 1 oktober 2004.


