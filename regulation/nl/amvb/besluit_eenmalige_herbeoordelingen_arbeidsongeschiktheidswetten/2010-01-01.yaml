    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 6 augustus 2004, Directie Sociale
    Verzekeringen, nr. SV/A&L/04/54594;

    Gelet op de artikelen 34, vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering, 35, vijfde lid, van de
    Wet arbeidsongeschiktheidsverzekering zelfstandigen, 28, vijfde lid, van de Wet arbeidsongeschiktheidsvoorziening
    jonggehandicapten, en XIII, achtste lid, en XXIV, zevende lid, van de Invoeringswet nieuwe en gewijzigde
    arbeidsongeschiktheidsregelingen;

    De Raad van State gehoord (advies van 25 augustus 2004, No. W12.04.0405/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 9 september 2004, Directie
    Sociale Verzekeringen, Nr. SV/A&L/04/62642;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017207/2010-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het tijdstip, bedoeld in de [artikelen 34, vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1],
      [35, vijfde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] en
      [artikel 3:28, vijfde lid, van de Wet werk en arbeidsondersteuning jonggehandicapten][ref3], waarop door
      het Uitvoeringsinstituut werknemersverzekeringen wordt bezien of er in verband met wijziging van de mate van
      arbeidsongeschiktheid gronden zijn voor herziening of intrekking van de arbeidsongeschiktheidsuitkering wordt als
      volgt vastgesteld:

      a. ten aanzien van personen geboren op of na 1 juli 1956: een tijdstip gelegen in de periode van 1 oktober 2004 tot
      en met 31 december 2006;

      b. ten aanzien van personen geboren tussen 1 juli 1954 en 1 juli 1956: een tijdstip gelegen in de periode van
      1 oktober 2006 tot en met 30 juni 2007.

      2 Bij ministeriële regeling kan zonodig worden afgeweken van de in het eerste lid, onderdeel a of b, genoemde data.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
