preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 15 juli 2008, nr. WJZ / 8074858;

    Gelet op Richtlijn nr. 2006/32/EG van het Europees Parlement en de Raad van de Europese Unie van 5 april 2006
    betreffende energie-efficiëntie bij het eindgebruik en energiediensten en houdende intrekking van Richtlijn 93/76/
    EEG van de Raad (PbEU L 114), de artikelen 4, 5 en 6 van de Wet implementatie EG-richtlijnen energie-efficiëntie en
    artikel 40, vierde lid, van de Gaswet;

    De Raad van State gehoord (advies van 13 augustus 2008, nr. W10.08.0305/III);

    Gezien het nader rapport van Onze Minister van Economische Zaken, Landbouw en Innovatie van 24 februari 2011,
    nr. WJZ / 11026264;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Indien een eindafnemer in het bezit is van een op afstand uitleesbare meetinrichting die op afstand wordt
      uitgelezen, verstrekt de leverancier ten minste zesmaal per jaar een recent verbruiks- en indicatief
      kostenoverzicht, gebaseerd op het actuele energieverbruik van warmte of koude, aan deze eindafnemer.
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel1
  - number: '1.2'
    text: |-
      Indien een eindafnemer niet in het bezit is van een op afstand uitleesbare meetinrichting die op afstand
      wordt uitgelezen, verstrekt de leverancier ten minste eenmaal per jaar een recent verbruiks- en indicatief
      kostenoverzicht, gebaseerd op het actuele energieverbruik van warmte of koude, aan deze eindafnemer.
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel1
  - number: '1.3'
    text: |-
      In afwijking van het eerste lid verstrekt de leverancier op verzoek van de eindafnemer minder dan zesmaal per jaar
      een verbruiks- en indicatief kostenoverzicht.
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel1
  - number: '2'
    text: |-
      Het verbruiks- en indicatief kostenoverzicht, bedoeld in [artikel 1][ref1], vermeldt in duidelijke en begrijpelijke
      taal:


      [ref1]: https://wetten.overheid.nl/BWBR0029673#Artikel1
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029673
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.a
    text: de periode waarop het verbruiks- en indicatief kostenoverzicht betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel2
  - number: 2.b
    text: |-
      het totale verbruik in de periode waarop het verbruiks- en indicatief kostenoverzicht betrekking heeft in
      meeteenheden;
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel2
  - number: 2.c
    text: |-
      met betrekking tot de prijs: een reële indicatie van de energiekosten in de periode waarop het verbruiks- en
      indicatief kostenoverzicht betrekking heeft, uitgedrukt in:
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel2
  - number: 2.c.1°
    text: |-
      de prijs per meeteenheid in de periode waarop het verbruiks- en indicatief kostenoverzicht betrekking heeft,
      waarbij gebruik kan worden gemaakt van de prijs per meeteenheid voor overeenkomsten voor onbepaalde duur voor
      eindafnemers van dezelfde verbruikerscategorie, en
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel2
  - number: 2.c.2°
    text: |-
      de variabele kosten van het verbruik in de periode waarop het verbruiks- en indicatief kostenoverzicht betrekking
      heeft;
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel2
  - number: 2.d
    text: |-
      wanneer dit mogelijk is, een vergelijking van het verbruik van de eindafnemer in de periode waarop het verbruiks-
      en indicatief kostenoverzicht betrekking heeft met het verbruik van die eindafnemer in dezelfde periode van het
      voorgaande jaar, waarbij tevens de actuele gegevens onder c aan het verbruik in dezelfde periode van het voorgaande
      jaar worden gerelateerd;
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel2
  - number: 2.e
    text: |-
      wanneer dit mogelijk en nuttig is, een vergelijking met een gemiddelde genormaliseerde of benchmark-energieafnemer
      van dezelfde verbruikerscategorie;
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel2
  - number: 2.f
    text: |-
      contactinformatie van consumentenorganisaties of soortgelijke organisaties, met inbegrip van internetadressen,
      waar informatie kan worden verkregen over de beschikbare maatregelen ter verbetering van energie-efficiëntie,
      vergelijkende eindafnemersprofielen of objectieve technische specificaties voor energieverbruikende apparatuur.
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel2
  - number: '3.1'
    text: |-
      De [artikelen 1][ref1] en [2][ref2] zijn van overeenkomstige toepassing ten aanzien van op afstand uitleesbare
      meetinrichtingen voor elektriciteit, met dien verstande dat in plaats van «meeteenheden» telkens wordt gelezen:
      kWh elektriciteit en het verbruiks- en indicatief kostenoverzicht in aanvulling op artikel 2 tevens vermeldt
      de hoeveelheid door de afnemer aan het net teruggeleverde elektriciteit in de periode waarop het verbruiks- en
      indicatief kostenoverzicht betrekking heeft, uitgedrukt in kWh elektriciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0029673#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0029673#Artikel2
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029673
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0029673
        artikel: '2'
        hoofdstuk: '1'
  - number: '3.2'
    text: |-
      De [artikelen 1][ref1] en [2][ref2] zijn van overeenkomstige toepassing ten aanzien van op afstand uitleesbare
      meetinrichtingen voor gas, met dien verstande dat in plaats van «meeteenheden» telkens wordt gelezen: m3 (n) gas.


      [ref1]: https://wetten.overheid.nl/BWBR0029673#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0029673#Artikel2
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel3
    references:
