        hoofdstuk: '1'
  - number: '4'
    text: |-
      Een handelaar in transportbrandstoffen vermeldt in of bij facturen of ontvangstbewijzen over niet-netgebonden
      energie aan eindafnemers:
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel4
  - number: 4.a
    text: de afgenomen hoeveelheid in meeteenheden;
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel4
  - number: 4.b
    text: de huidige actuele prijs per meeteenheid; en
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel4
  - number: 4.c
    text: |-
      contactinformatie van consumentenorganisaties of soortgelijke organisaties, met inbegrip van internetadressen,
      waar informatie kan worden verkregen over de beschikbare maatregelen ter verbetering van energie-efficiëntie,
      vergelijkende eindafnemersprofielen of objectieve technische specificaties voor energieverbruikende apparatuur.
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel4
  - number: 5a
    text: |-
      Dit besluit berust mede op de [artikelen 95lb][ref1] en [95lc van de Elektriciteitswet 1998][ref2] en de
      [artikelen 42b][ref3] en [42c van de Gaswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95lb
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95lc
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel42b
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel42c
    url: https://wetten.overheid.nl/BWBR0029673/2012-01-01#Artikel5a
