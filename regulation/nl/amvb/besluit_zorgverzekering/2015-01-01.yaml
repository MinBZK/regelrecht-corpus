  - number: '2.17'
    text: |-
      1 Kosten van het gebruik van zorg en overige diensten die buiten het verplicht eigen risico vallen, betreffen
      kosten van:

      a. verloskundige zorg en kraamzorg,

      b. zorg zoals huisartsen die plegen te bieden,

      c. zorg als bedoeld in [artikel 2.10, eerste lid][ref1],

      d. zorg die wordt bekostigd met toepassing van de op grond van de [Wet marktordening gezondheidszorg][ref2]
      vastgestelde beleidsregel voor de prestatiebekostiging multidisciplinaire zorgverlening chronische aandoeningen,

      e. nacontroles van de donor nadat de periode, bedoeld in [artikel 2.5, eerste lid, onderdeel d][ref3], is
      verstreken, en

      f. de kosten van vervoer, [bedoeld in artikel 2.5, tweede lid][ref4].

      2 De zorgverzekeraar kan bepalen dat kosten van het gebruik van zorg en overige diensten als bedoeld in
      [artikel 11 van de wet][ref5] geheel of gedeeltelijk buiten het verplicht eigen risico vallen, indien:

      a. de verzekerde zich wendt tot een door de zorgverzekeraar aangewezen zorgaanbieder, of

      b. de verzekerde een door de zorgverzekeraar aangewezen programma heeft gevolgd met betrekking tot diabetes,
      depressie, hart- en vaatziekten, chronisch obstructief longlijden, overgewicht of stoppen met roken en de kosten
      betrekking hebben op de aandoening waarvoor de verzekerde dat programma heeft gevolgd, of

      c. de verzekerde gebruik maakt van een door de zorgverzekeraar aangewezen geneesmiddel of hulpmiddel.

      3 De dag, bedoeld in [artikel 19, vierde lid, van de wet][ref6], is 31 december.

      4 In afwijking van het derde lid is de zorgverzekeraar gerechtigd het verplicht eigen risico in rekening te brengen
      indien het aan de verzekerde te wijten is dat de rekening niet voor de in het derde lid genoemde dag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2.10
      [ref2]: https://wetten.overheid.nl/BWBR0020078
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel2.5
