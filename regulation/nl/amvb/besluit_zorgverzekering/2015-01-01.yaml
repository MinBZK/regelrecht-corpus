  - number: 3a.2
    text: |-
      1 Onze Minister geeft het Zorginstituut voorafgaande aan ieder kalenderjaar een aanwijzing
      over de voor dat jaar ten laste van het Zorgverzekeringsfonds komende beheerskosten, bedoeld in
      [artikel 39, derde lid, onderdeel f, van de wet][ref1].

      2 Met inachtneming van het eerste lid stelt het Zorginstituut jaarlijks het budget voor de beheerskosten, bedoeld
      in het eerste lid, vast.

      3 Het Zorginstituut bepaalt de wijze van betaalbaarstelling van het budget.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel39
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3a.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '39'
  - number: 3a.3
    text: |-
      1 Het CAK neemt in zijn jaarrekening op:

      a. de omvang van de egalisatiereserve voor de uitvoering van de compensatieregeling voor het verplicht eigen
      risico, met dien verstande dat de totale egalisatiereserve maximaal 5% van het totale beheerskostenbudget van het
      betreffende jaar bedraagt;

      b. het verschil tussen het budget en de realisatie, dat ten laste of ten bate komt van de egalisatiereserve.

      2 Het Zorginstituut stelt jaarlijks aan de hand van het financieel jaarverslag van het CAK vast of de reserve het
      gestelde maximum te boven gaat. Indien dit het geval is, stort het CAK het door het Zorginstituut vastgestelde
      bedrag van de overschrijding binnen vier weken in het Zorgverzekeringsfonds.
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3a.3
  - number: 3a.4
    text: |-
      Indien het CAK op een naar het oordeel van de zorgautoriteit onverantwoorde wijze op zijn beheerskosten bespaart,
      wordt het budget, bedoeld in [artikel 3a.2][ref1], voor het desbetreffende kalenderjaar door het Zorginstituut
      verlaagd met het door de zorgautoriteit aangegeven bedrag van die besparing.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3a.2
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3a.4
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: 3a.2
        hoofdstuk: 3a
  - number: 3b.1
    text: |-
      Als vormen van zorg als bedoeld in [artikel 122a, tweede lid, van de wet][ref1], worden aangewezen:

      a. genderbehandelingen;

      b. in-vitrofertilisatiebehandelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel122a
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3b.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 122a
  - number: '4.1'
    text: |-
      Bij de inwerkingtreding van de [wet][ref1] kunnen voor een zorgverzekeraar die als nieuwe rechtspersoon de
      [wet][ref2] uitvoert de gegevens van zijn rechtsvoorganger worden aangemerkt als historische gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0018450
  - number: '4.2'
    text: |-
      De rijksbelastingdienst verstrekt aan de zorgverzekeraar op een verzoek als bedoeld in
      [artikel 89, eerste lid, van de wet][ref1], het persoonsgegeven dat een persoon als niet-ingezetene aan de
      loonbelasting is onderworpen ter zake van in Nederland in dienstbetrekking verrichte arbeid dan wel als niet-
      ingezetene aan de inkomstenbelasting is onderworpen ter zake van in Nederland verrichte beroepswerkzaamheden anders
      dan in dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel89
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '89'
  - number: '4.4'
    text: 'Dit besluit wordt aangehaald als: Besluit zorgverzekering.'
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel4.4
