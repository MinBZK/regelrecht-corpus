  - number: '3.1'
    text: |-
      1 Het macro-prestatiebedrag is de som van de volgende macro-deelbedragen:

      a. het macro-deelbedrag variabele kosten van medisch-specialistische zorg;

      b. het macro-deelbedrag vaste zorgkosten;

      c. het macro-deelbedrag kosten van geneeskundige geestelijke gezondheidszorg;

      d. het macro-deelbedrag kosten van overige prestaties.

      2 Tot het macro-prestatiebedrag of de macro-deelbedragen behoren niet de kosten van zorg of andere verzekerde
      diensten die noodzakelijk zijn geworden ten gevolge van een terroristische handeling.

      3 De hoogte van het macro-prestatiebedrag en van de macro-deelbedragen voor een vereveningsjaar worden jaarlijks
      voor 1 oktober van het daaraan voorafgaande jaar bij ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 De hoogte van de totale opbrengst van de nominale rekenpremie voor een vereveningsjaar wordt jaarlijks voor 1
      oktober van het daaraan voorafgaande jaar bij ministeriële regeling geraamd.

      2 De hoogte van de totale opbrengst van het verplicht eigen risico voor een vereveningsjaar wordt jaarlijks voor 1
      oktober van het daaraan voorafgaande jaar bij ministeriële regeling geraamd.
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      Het Zorginstituut verdeelt de in [artikel 3.1][ref1] genoemde macro-deelbedragen op de bij en krachtens de
      [artikelen 3.4 tot en met 3.8][ref2] bepaalde wijze in deelbedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3.4
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.3
    references:
