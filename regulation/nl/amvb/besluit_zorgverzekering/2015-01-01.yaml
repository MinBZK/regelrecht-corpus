  - number: '2.1'
    text: |-
      1 De zorg en overige diensten, bedoeld in [artikel 11, eerste lid, onderdeel a, van de wet][ref1]
      omvatten de vormen van zorg of diensten die naar inhoud en omvang zijn omschreven in de
      [artikelen 2.4 tot en met 2.15][ref2], met uitzondering van vormen van zorg of diensten die voor de verzekerden
      kunnen worden bekostigd op grond van een wettelijk voorschrift.

      2 De inhoud en omvang van de vormen van zorg of diensten worden mede bepaald door de stand van de wetenschap
      en praktijk en, bij ontbreken van een zodanige maatstaf, door hetgeen in het betrokken vakgebied geldt als
      verantwoorde en adequate zorg en diensten.

      3 Onverminderd hetgeen is bepaald in de [artikelen 2.4 tot en met 2.15][ref3], heeft de verzekerde op een vorm van
      zorg of een dienst slechts recht voor zover hij daarop naar inhoud en omvang redelijkerwijs is aangewezen.

      4 Onder de zorg en overige diensten, bedoeld in het eerste lid, valt niet forensische zorg als bedoeld in
      [artikel 2 van het Interimbesluit forensische zorg][ref4].

      5 In afwijking van het tweede lid vallen onder de zorg en overige diensten, bedoeld in de [artikelen 2.4][ref5],
      [2.8][ref6] of [2.9][ref7], ook de zorg en diensten die bij ministeriële regeling zijn aangewezen onder de daarbij
      geregelde voorwaarden en gedurende een daarbij aan te geven termijn van maximaal zeven jaar, voor zover er sprake
      is van verantwoorde zorg en diensten.

      6 De zorg en diensten, bedoeld in het eerste lid, omvatten niet geestelijke gezondheidszorg als bedoeld in
      [artikel 10.2, eerste lid, van de Jeugdwet][ref8] aan jeugdigen als bedoeld in [artikel 1.1 van die wet][ref9].


