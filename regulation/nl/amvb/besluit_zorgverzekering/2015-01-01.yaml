  - number: '3.23'
    text: |-
      1 In aanvulling op de vereveningsbijdrage, bedoeld in de [artikelen 3.10][ref1] en [3.19][ref2], kan het
      Zorginstituut een bijdrage verstrekken in verband met een substantieel verschil tussen kosten en deelbedrag per
      verzekeraar dat rechtstreeks verband houdt met hogere kosten van verzekerden als gevolg van een zeer uitzonderlijke
      omstandigheid.

      2 Ingevolge het eerste lid worden geen bijdragen verstrekt dan nadat bij ministeriële regeling is vastgesteld
      dat sprake is van een ramp die niet opgevangen kan worden binnen de reguliere wijze van vaststelling van de
      vereveningsbijdrage aan zorgverzekeraars.

      3 Bij ministeriële regeling wordt de wijze waarop het Zorginstituut de bijdrage, bedoeld in het eerste lid
      vaststelt, geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.10
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3.19
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.23
