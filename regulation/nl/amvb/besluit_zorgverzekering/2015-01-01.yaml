      1 De zorgverzekeraar kan toestaan dat het ziekenvervoer plaatsvindt met een ander door
      de zorgverzekeraar aan te geven vervoermiddel dan een motorvoertuig als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Tijdelijke wet ambulancezorg][ref1], auto of openbaar middel van
      vervoer.

      2 Het ziekenvervoer omvat tevens vervoer van een begeleider, indien begeleiding noodzakelijk is, of indien het
      betreft begeleiding van kinderen beneden zestien jaar. In bijzondere gevallen kan de zorgverzekeraar vervoer van
      twee begeleiders toestaan.


