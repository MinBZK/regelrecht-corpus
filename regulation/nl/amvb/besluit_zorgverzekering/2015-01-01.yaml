  - number: 2.16e
    text: |-
      1 De verzekerde is voor ziekenvervoer, anders dan per motorvoertuig als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Tijdelijke wet ambulancezorg][ref1], een eigen bijdrage per
      kalenderjaar verschuldigd.

      2 Bij ministeriële regeling kan worden bepaald in welke situaties de eigen bijdrage niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0031557#Artikel1
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel2.16e
