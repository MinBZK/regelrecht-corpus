      Kraamzorg omvat zorg zoals kraamverzorgenden die plegen te bieden aan moeder en kind in verband met een bevalling,
      gedurende ten hoogste tien dagen, te rekenen vanaf de dag van bevalling.
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel2.11
  - number: '2.12'
    text: |-
      1 Verblijf omvat verblijf gedurende een onafgebroken periode van ten hoogste 1.095 dagen, dat medisch noodzakelijk
      is in verband met de geneeskundige zorg, bedoeld in [artikel 2.4][ref1], of in verband met chirurgische
      tandheelkundige hulp van specialistische aard als bedoeld in [artikel 2.7][ref2], al dan niet gepaard gaande met
      verpleging, verzorging of paramedische zorg.

      2 Een onderbreking van ten hoogste dertig dagen wordt niet als onderbreking beschouwd, maar deze dagen tellen niet
      mee voor de berekening van de 1.095 dagen.

      3 In afwijking van het tweede lid tellen onderbrekingen wegens weekend- en vakantieverlof mee voor de berekening
      van de 1.095 dagen.


