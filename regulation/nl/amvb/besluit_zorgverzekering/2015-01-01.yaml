  - number: 2.16b
    text: |-
      1 De verzekerde betaalt een eigen bijdrage voor een geneesmiddel als bedoeld in [artikel 2.8, eerste lid][ref1],
      dat is ingedeeld in een groep van onderling vervangbare geneesmiddelen, indien de inkoopprijs hoger is dan de
      vergoedingslimiet. Een eigen bijdrage wordt ook betaald voor zover een geneesmiddel is bereid uit een geneesmiddel
      waarvoor een eigen bijdrage is verschuldigd.

      2 Bij ministeriële regeling wordt geregeld hoe de eigen bijdrage wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2.8
