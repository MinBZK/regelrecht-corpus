  - number: 2.5a
    text: |-
      Zintuiglijk gehandicaptenzorg omvat multidisciplinaire zorg in verband met een visuele beperking, een auditieve
      beperking, of een communicatieve beperking als gevolg van een taalontwikkelingsstoornis, gericht op het leren
      omgaan met, het opheffen of het compenseren van de beperking, met als doel de verzekerde zo zelfstandig mogelijk te
      kunnen laten functioneren.
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel2.5a
  - number: 2.5b
    text: |-
      1 Zorg bij stoppen-met-rokenprogramma omvat geneeskundige en farmacotherapeutische interventies ter ondersteuning
      van gedragsverandering met als doel te stoppen met roken.

      2 De zorg, bedoeld in het eerste lid, omvat het één keer per kalenderjaar volgen van een programma.
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel2.5b
  - number: 2.5c
    text: |-
      1 Geriatrische revalidatie omvat integrale en multidisciplinaire revalidatiezorg zoals specialisten
      ouderengeneeskunde die plegen te bieden in verband met kwetsbaarheid, complexe multimorbiditeit en afgenomen
      leer- en trainbaarheid, gericht op het dusdanig verminderen van de functionele beperkingen van de verzekerde dat
      terugkeer naar de thuissituatie mogelijk is.

      2 De geriatrische revalidatie valt slechts onder de zorg, bedoeld in het eerste lid, indien:

      a. de zorg binnen een week aansluit op verblijf als bedoeld in [artikel 2.12][ref1] in verband met geneeskundige
      zorg zoals medisch-specialisten die plegen te bieden, waarbij dat verblijf niet vooraf is gegaan aan verblijf in
      een instelling als bedoeld in [artikel 3.1.1, eerste lid, onderdeel a, van de Wet langdurige zorg][ref2] gepaard
      gaande met behandeling als bedoeld in artikel 3.1.1, eerste lid, onderdeel c, van die wet in dezelfde instelling,
      en

      b. de zorg bij aanvang gepaard gaat met verblijf als bedoeld in [artikel 2.12][ref3].

      3 Het tweede lid, onderdeel a, is niet van toepassing indien er als gevolg van een acute aandoening sprake
      is van acute mobiliteitstoornissen of afname van zelfredzaamheid en waar sprake is van voorafgaande medisch-
      specialistische zorg voor deze aandoening.

      4 De duur van de geriatrische revalidatie, bedoeld in het eerste lid, bedraagt maximaal zes maanden. In bijzondere
      gevallen kan de zorgverzekeraar een langere periode toestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel3.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel2.12
