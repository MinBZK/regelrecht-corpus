  - number: '3.10'
    text: |-
      1 Het Zorginstituut brengt vervolgens op het normatieve bedrag, bedoeld in [artikel 3.9][ref1], in mindering,
      de voor de zorgverzekeraar geraamde opbrengst van de nominale rekenpremie en de voor de zorgverzekeraar geraamde
      opbrengst van het verplicht eigen risico.

      2 De raming van de opbrengst van de nominale rekenpremie en van het verplicht eigen risico vindt plaats op een bij
      ministeriële regeling te bepalen wijze.

      3 Het Zorginstituut kent aan de zorgverzekeraar een vereveningsbijdrage toe ter hoogte van de uitkomst van de
      berekening, bedoeld in het eerste lid.

      4 Het Zorginstituut deelt aan de zorgverzekeraar het berekende normatieve bedrag, bedoeld in [artikel 3.9][ref2],
      en de toegekende vereveningsbijdrage, bedoeld in het derde lid, mee, en geeft hierbij aan welke bedragen, bedoeld
      in het eerste lid, bij de toekenning van de vereveningsbijdrage zijn betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.9
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3.9
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.10
