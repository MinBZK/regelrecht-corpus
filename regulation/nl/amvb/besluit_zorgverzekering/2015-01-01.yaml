        artikel: '24'
  - number: '3.18'
    text: |-
      Het Zorginstituut sommeert de ingevolge [artikel 3.12][ref1] herberekende deelbedragen voor de clusters «variabele
      kosten van medisch-specialistische zorg», «geneeskundige geestelijke gezondheidszorg» en «overige prestaties»,
      het op grond van [artikel 3.15][ref2] berekende nieuwe deelbedrag en, voor zover van toepassing, de op grond van
      [artikel 3.17][ref3] berekende bedragen, tot één normatief bedrag per zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.12
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3.15
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel3.17
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.18
    references:
      - id: ref1
