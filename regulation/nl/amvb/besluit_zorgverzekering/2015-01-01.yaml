  - number: 2.16c
    text: |-
      De verzekerde betaalt voor een bij ministeriële regeling aan te wijzen hulpmiddel als bedoeld in
      [artikel 2.9][ref1], een eigen bijdrage ter grootte van:

      a. een daarbij vermeld bedrag wegens besparing van kosten,

      b. het verschil tussen de aanschaffingskosten en het bij dat hulpmiddel vermelde bedrag, dat kan verschillen naar
      gelang de groep van verzekerden, waartoe de verzekerde behoort, of

      c. een bij die regeling te bepalen percentage van de kosten van het hulpmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel2.16c
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2.9'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.16d
    text: |-
      1 De verzekerde betaalt voor verzorging als bedoeld in [artikel 2.11][ref1], een eigen bijdrage per uur, indien het
      betreft verzorging ten huize van de verzekerde.

      2 De verzekerde en haar kind betalen ieder voor verzorging als bedoeld in [artikel 2.11][ref2], die verleend
      wordt in een instelling zonder dat verblijf in de instelling medisch noodzakelijk is, een eigen bijdrage per dag,
      vermeerderd met een bij ministeriële regeling te bepalen bedrag waarmee het tarief van de instelling per dag te
      boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2.11
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel2.16d
