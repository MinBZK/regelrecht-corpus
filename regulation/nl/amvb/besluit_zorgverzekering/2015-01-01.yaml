  - number: '3.9'
    text: |-
      Het Zorginstituut sommeert de ingevolge de [artikelen 3.3 tot en met 3.8][ref1] aan een zorgverzekeraar
      toegerekende deelbedragen tot één normatief bedrag per zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.3
