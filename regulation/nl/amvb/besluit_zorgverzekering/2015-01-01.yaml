  - number: '3.11'
    text: |-
      1 Na het vereveningsjaar herberekent het Zorginstituut de deelbedragen, bedoeld in de [artikelen 3.4][ref1],
      [3.6][ref2] en [3.7][ref3], op de bij en krachtens dit artikel en de [artikelen 3.12 tot en met 3.17][ref4]
      bepaalde wijze.

      2 Met inachtneming van het bepaalde bij en krachtens de [artikelen 3.13][ref5], [3.14][ref6] en
      [3.15, eerste lid][ref7], bepaalt het Zorginstituut de over het vereveningsjaar gerealiseerde kosten per cluster
      van prestaties voor alle zorgverzekeraars tezamen.

      3 Tot de gerealiseerde kosten behoren niet kosten waarvoor bijdragen als bedoeld in [artikel 3.23][ref8] zijn
      verstrekt.

      4 Het Zorginstituut corrigeert de geraamde kosten per cluster van prestaties voor het werkelijke aantal verzekerden
      in het vereveningsjaar en hun werkelijke verzekerdenkenmerken.

      5 Met inachtneming van bij ministeriële regeling te bepalen regels herberekent het Zorginstituut, uitgaande van de
      door alle zorgverzekeraars tezamen gerealiseerde kosten voor het destreffende cluster van prestaties, de gewichten,
      bedoeld in de [artikelen 3.4][ref9], [3.6][ref10], [3.7][ref11], en [3.8][ref12], door deze te vermenigvuldigen
      met een factor die gelijk is aan het quotiënt van de gerealiseerde kosten, bedoeld in het tweede lid, en de
      gecorrigeerde geraamde kosten, bedoeld in het vierde lid.

      6 Bij ministeriële regeling wordt bepaald in welke mate een verzekerde die niet gedurende het gehele
      vereveningsjaar bij een zorgverzekeraar verzekerd is of die gedurende het vereveningsjaar bij meerdere
      zorgverzekeraars tegelijk verzekerd is, voor de vaststelling van de vereveningsbijdrage meetelt.


