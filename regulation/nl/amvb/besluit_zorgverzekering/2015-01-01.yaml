  - number: '2.18'
    text: |-
      1 De kosten van inschrijving bij een huisarts of bij een instelling die huisartsenzorg verleent, vallen buiten het
      vrijwillig eigen risico.

      2 Onder kosten van inschrijving worden verstaan:

      a. een bedrag ter zake van de inschrijving als patiënt, tot ten hoogste het tarief dat op grond van de
      [Wet marktordening gezondheidszorg][ref1] als beschikbaarheidstarief is vastgesteld;

      b. vergoedingen die samenhangen met de wijze waarop de geneeskundige zorg in de praktijk van de huisarts of in
      de instelling wordt verleend, met de kenmerken van het patiëntenbestand of met de locatie van de praktijk of de
      instelling, voor zover deze vergoedingen tussen de zorgverzekeraar van de verzekerde en zijn huisarts of instelling
      zijn overeengekomen en de huisarts of instelling deze vergoedingen krachtens eerderbedoelde overeenkomst bij de
      inschrijving van een verzekerde in rekening mag brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: '2.19'
    text: |-
      Het percentage, bedoeld in [artikel 21, eerste lid, van de wet][ref1], bedraagt 100.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel21
