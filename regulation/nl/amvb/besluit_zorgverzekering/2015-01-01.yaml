        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018492
        artikel: '3.17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.19'
    text: |-
      1 Het Zorginstituut brengt vervolgens op het normatieve bedrag, bedoeld in [artikel 3.18][ref1], in mindering, de
      voor de zorgverzekeraar naar gerealiseerde verzekerdenaantallen berekende opbrengst van de nominale rekenpremie en
      de voor de zorgverzekeraar naar gerealiseerde verzekerdenaantallen genormeerde opbrengst van het verplicht eigen
      risico.

      2 De berekening van de naar gerealiseerde verzekerdenaantallen berekende opbrengst van de nominale rekenpremie en
      van de naar gerealiseerde verzekerdenaantallen genormeerde opbrengst van het verplicht eigen risico, vindt plaats
      op een bij ministeriële regeling te bepalen wijze.

      3 Het Zorginstituut stelt de vereveningsbijdrage vast op de uitkomst van de berekening, bedoeld in het eerste lid.

      4 Het Zorginstituut deelt aan de zorgverzekeraar het normatieve bedrag, bedoeld in [artikel 3.18][ref2], en de
      vastgestelde vereveningsbijdrage, bedoeld in het derde lid, mee, en geeft hierbij aan welke bedragen, bedoeld in
      het eerste lid, bij de vaststelling van de vereveningsbijdrage zijn betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.18
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3.18
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.19
