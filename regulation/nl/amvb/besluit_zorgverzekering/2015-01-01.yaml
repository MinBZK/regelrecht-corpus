  - number: 3a.1
    text: |-
      1 Verzekerden hebben recht op de uitkering, bedoeld in [artikel 118a, eerste lid, van de wet][ref1] indien zij:

      a. in de twee opeenvolgende jaren voorafgaande aan het jaar waarop de uitkering betrekking heeft, voldoen aan bij
      ministeriële regeling gestelde voorwaarden met betrekking tot aan hen ter hand gestelde, in die regeling aan te
      wijzen geneesmiddelen, of

      b. in het jaar dat drie jaren voorafgaat en in het jaar dat twee jaren voorafgaat aan het jaar waarop de uitkering
      betrekking heeft, zijn ingedeeld in bij ministeriële regeling aangewezen DKG’s, of

      c. op 1 juli van het jaar waarop de uitkering betrekking heeft, zonder onderbreking meer dan een half jaar in een
      AWBZ-instelling verblijven.

      2 Gewezen personen als bedoeld in [artikel 2, tweede lid, onderdeel a, van de wet][ref2] hebben eveneens recht op
      een uitkering als bedoeld in het eerste lid, indien zij in de twee opeenvolgende jaren voorafgaande aan het jaar
      waarop de uitkering betrekking dient te hebben, zorg hebben ontvangen ten laste van een ziektekostenregeling voor
      militairen die overeenkomt met de zorg waarop het eerste lid, onderdelen a of b, betrekking heeft.

      3 Een verzekerde wordt voor wat betreft de geneeskundige zorg, bedoeld in [artikel 10 van de wet][ref3], die hij
      in een andere lidstaat van de Europese Unie heeft ontvangen, ingedeeld in de DKG met de chronische aandoening, die
      te identificeren is op grond van uitgevoerde diagnose behandeling combinaties die naar aard en strekking met die
      geneeskundige zorg overeenkomen.

      4 Voor de toepassing van dit artikel en de daarop berustende bepalingen wordt met een lidstaat van de Europese Unie
      gelijkgesteld, een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel118a
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel10
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3a.1
