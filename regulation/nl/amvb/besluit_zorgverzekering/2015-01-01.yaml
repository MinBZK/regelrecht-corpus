  - number: '3.4'
    text: |-
      1 Het Zorginstituut verdeelt het macro-deelbedrag variabele kosten van medisch-specialistische zorg over de
      zorgverzekeraars aan de hand van de verzekerdenaantallen per zorgverzekeraar, verdeeld naar leeftijd en geslacht,
      FKG’s, DKG’s, aard van het inkomen, SES, meerjarig hoge kosten en regio.

      2 Onze Minister kent aan alle klassen van de genoemde criteria gewichten toe.

      3 De klassen, bedoeld in het eerste lid, en de gewichten, bedoeld in het tweede lid, worden jaarlijks bij
      ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      1 Het Zorginstituut verdeelt het macro-deelbedrag vaste zorgkosten over de zorgverzekeraars aan de hand van
      verzekerdenaantallen en van historische gegevens per zorgverzekeraar.

      2 De historische gegevens, bedoeld in het eerste lid, worden jaarlijks bij ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 Het Zorginstituut verdeelt het macro-deelbedrag kosten van geneeskundige geestelijke gezondheidszorg over de
      zorgverzekeraars aan de hand van de verzekerdenaantallen per zorgverzekeraar, verdeeld naar leeftijd en geslacht,
      FKG’s psychische aandoeningen, aard van het inkomen, SES, éénpersoonsadres, GGZ-regio, en kosten van geneeskundige
      geestelijke gezondheidszorg boven de lage drempel.

      2 Onze Minister kent aan alle klassen van de genoemde criteria gewichten toe.

      3 De klassen, bedoeld in het eerste lid, en de gewichten, bedoeld in het tweede lid, worden jaarlijks bij
      ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.6
  - number: '3.7'
    text: |-
      1 Het Zorginstituut verdeelt het macro-deelbedrag kosten van overige prestaties over de zorgverzekeraars aan de
      hand van de verzekerdenaantallen per zorgverzekeraar, verdeeld naar leeftijd en geslacht, FKG’s, DKG’s, aard van
      het inkomen, SES, meerjarig hoge kosten en regio.

      2 Onze Minister kent aan alle klassen van de genoemde criteria gewichten toe.

      3 De klassen, bedoeld in het eerste lid, en de gewichten, bedoeld in het tweede lid, worden jaarlijks bij
      ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      In afwijking van de [artikelen 3.4][ref1], [3.6][ref2] en [3.7][ref3] worden verzekerden die in het buitenland
      wonen ingedeeld in de klassen «Geen FKG», «Geen FKG psychische aandoeningen», respectievelijk «DKG «0»» en worden
      de bij deze klasse behorende gewichten voor deze verzekerden op bij ministeriële regeling bepaalde wijze door het
      Zorginstituut vastgesteld.


