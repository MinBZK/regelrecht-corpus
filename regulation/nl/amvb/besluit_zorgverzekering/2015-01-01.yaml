      1 Hulpmiddelenzorg omvat bij ministeriële regeling aangewezen, functionerende hulpmiddelen en verbandmiddelen,
      waarbij kan worden geregeld:

      a. in welke gevallen de verzekerde recht heeft op die zorg;

      b. vergoeding van bij die regeling aangewezen kosten in verband met thuisdialyse.

      2 De kosten van normaal gebruik van hulpmiddelen komen, tenzij bij ministeriële regeling anders is bepaald, voor
      rekening van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel2.9
  - number: '2.10'
    text: |-
      1 Verpleging en verzorging omvat zorg zoals verpleegkundigen die plegen te bieden, waarbij die zorg:

      a. verband houdt met de behoefte aan de geneeskundige zorg, bedoeld in [artikel 2.4][ref1], of een hoog risico
      daarop,

      b. niet gepaard gaat met verblijf als bedoeld in [artikel 2.12][ref2], en

      c. geen kraamzorg als bedoeld in [artikel 2.11][ref3] betreft.

      2 Onder de zorg, bedoeld in het eerste lid, valt niet verzorging van verzekerden tot achttien jaar, tenzij er
      sprake is van verzorging vanwege complexe somatische problematiek of vanwege een lichamelijke handicap, waarbij:

      a. sprake is van behoefte aan permanent toezicht, of

      b. vierentwintig uur per dag zorg in de nabijheid beschikbaar moet zijn en die zorg gepaard gaat met een of meer
      specifieke verpleegkundige handelingen.


