  - number: '3.13'
    text: |-
      Voor zover deze onder een zorgverzekering worden gedekt, deelt het Zorginstituut bij ministeriële regeling te
      bepalen soorten kosten van zorg en overige diensten die niet zonder meer aan een bepaalde kostencategorie kunnen
      worden toegedeeld, overeenkomstig een bij die regeling te bepalen verdeelsleutel toe aan de variabele kosten van
      medisch-specialistische zorg, de vaste zorgkosten, de kosten van geneeskundige geestelijke gezondheidszorg of de
      kosten van overige prestaties.
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.13
  - number: '3.14'
    text: |-
      Het Zorginstituut merkt voor een bij ministeriële regeling te bepalen gedeelte van de verschillende geldende
      tarieven binnen de kosten van medisch-specialistische zorg, kosten aan als variabele kosten van medisch-
      specialistische zorg.
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.14
  - number: '3.15'
    text: |-
      1 Het Zorginstituut merkt voor een bij ministeriële regeling te bepalen gedeelte van de verschillende geldende
      tarieven binnen de kosten van medisch-specialistische zorg, kosten aan als vaste zorgkosten.

      2 Het Zorginstituut calculeert in een bij ministeriële regeling te bepalen mate na op het verschil tussen de vaste
      zorgkosten in het betreffende jaar enerzijds, en het op grond van [artikel 3.12][ref1] herberekende deelbedrag
      vaste zorgkosten anderzijds, leidende tot een nieuw deelbedrag per zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.12
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3.12'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.17'
    text: |-
      Indien voor een zorgverzekeraar het verschil tussen enerzijds het ingevolge [artikel 3.12][ref1] herberekende
      deelbedrag voor het cluster «geneeskundige geestelijke gezondheidszorg» en anderzijds de gerealiseerde kosten voor
      het cluster «geneeskundige geestelijke gezondheidszorg», gedeeld door het aantal bij hem ingeschreven verzekerden
      van achttien jaar en ouder waarop [artikel 24 van de wet][ref2] niet van toepassing is, meer dan een bij
      ministeriële regeling te bepalen bedrag afwijkt van het gemiddelde marktresultaat van de zorgverzekeraars voor het
      cluster «geneeskundige geestelijke gezondheidszorg», calculeert het Zorginstituut de buiten de bedoelde bandbreedte
      liggende meer- of minderkosten voor een bij die ministeriële regeling te bepalen percentage na.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.12
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel24
    url: https://wetten.overheid.nl/BWBR0018492/2015-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3.12'
