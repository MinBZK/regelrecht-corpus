---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_zorgverzekering
regulatory_layer: AMVB
publication_date: '2014-12-18'
valid_from: '2006-01-01'
bwb_id: BWBR0018492
url: https://wetten.overheid.nl/BWBR0018492/2006-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 22 april 2005, kenmerk Z/VV-2577868;

    Gelet op de artikelen 11, derde en vierde lid, 20, 22, vijfde lid, 32, tweede en derde lid, 34, derde lid, en 89,
    vijfde lid, van de Zorgverzekeringswet;

    De Raad van State gehoord (advies van 20 juni 2005, nr. W13.05.0153/III);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 27 juni 2005, kenmerk Z/VV-
    2596179;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
  - number: 1.a
    text: |-
      *wet:* de [Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 1.b
    text: '*verblijf:* verblijf gedurende het etmaal;'
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
  - number: 1.c
    text: |-
      *eigen bijdrage:* een eigen bijdrage als bedoeld in [artikel 11, derde lid van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
  - number: 1.d
    text: |-
      *geregistreerd geneesmiddel:* een geneesmiddel dat is ingeschreven in het register, bedoeld in
      [artikel 3 van de Wet op de Geneesmiddelenvoorziening][ref1], of voor het in de handel brengen waarvan de
      Gemeenschap ingevolge de [Verordening (EEG) nr. 2309/93](31993R2309) van de Raad van de Europese Gemeenschappen van
      22 juli 1993 tot vaststelling van communautaire procedures voor het verlenen van vergunningen voor en het toezicht
      op geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting van een Europees bureau voor de
      geneesmiddelenbeoordeling (PbEG L 214) een vergunning heeft afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: 1.e
    text: |-
      *beschikbare middelen:* het bedrag dat in totaal voor het daaropvolgende kalenderjaar aan de zorgverzekeraars kan
      worden toegekend, bedoeld in [artikel 32, vierde lid, onderdeel a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel32
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '32'
  - number: 1.f
    text: |-
      *premie:* de premie, bedoeld in [artikel 16 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel16
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '16'
  - number: 1.g
    text: |-
      *nominale rekenpremie:* het fictieve bedrag voor verzekerde prestaties inclusief de nominale premie no-claim,
      dat in de Rijksbegroting Volksgezondheid, Welzijn en Sport bij de berekening van de beschikbare middelen wordt
      gehanteerd als het fictieve bedrag dat op jaarbasis per verzekerde door een zorgverzekeraar in rekening wordt
      gebracht;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
  - number: 1.h
    text: |-
      *gemiddelde no-claimteruggave:* het geraamde bedrag dat verzekerden gemiddeld op grond van
      [artikel 22, eerste lid, van de wet][ref1] na afloop van het kalenderjaar zullen ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel22
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '22'
  - number: 1.i
    text: |-
      *macro-prestatiebedrag:* de beschikbare middelen, met uitzondering van de middelen, bedoeld in de
      [artikelen 3.15][ref1] en [3.16][ref2], vermeerderd met de voor zorgverzekeraars geraamde opbrengsten van de
      nominale rekenpremie en verminderd met de gemiddelde no-claimteruggave voor alle verzekerden tezamen;


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 1.j
    text: |-
      *bijdrage:* de bijdrage, bedoeld in [artikel 32, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel32
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '32'
  - number: 1.k
    text: '*leeftijd en geslacht:* verdeelcriteria waarbij verzekerden worden ingedeeld op basis van hun leeftijd en geslacht;'
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
  - number: 1.l
    text: |-
      *aard van het inkomen:* een verdeelcriterium waarbij verzekerden worden ingedeeld op basis van de aard van hun
      inkomen;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
  - number: 1.m
    text: |-
      *regio:* een verdeelcriterium waarbij verzekerden worden ingedeeld in categorieën op basis van de postcode van het
      adres waar de verzekerde woonachtig is;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
  - number: 1.n
    text: |-
      *FKG’s:* Farmaceutische kostengroepen, een verdeelcriterium waarbij verzekerden worden ingedeeld in categorieën
      chronische aandoeningen op basis van geneesmiddelengebruik in het verleden;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
  - number: 1.o
    text: |-
      *DKG’s:* Diagnose kostengroepen, een verdeelcriterium waarbij verzekerden worden ingedeeld in clusters van
      aandoeningengroepen die geïdentificeerd zijn op grond van uitgevoerde Diagnose Behandeling Combinaties;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
  - number: 1.p
    text: '*normatief bedrag:* het aan een zorgverzekeraar toegerekende aandeel in het macro-prestatiebedrag.'
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
  - number: 1.q
    text: |-
      *hogekostencompensatie:* het poolen dan wel verrekenen met het Zorgverzekeringsfonds van een bij ministeriële
      regeling te bepalen percentage van de kosten van verzekerden met betrekking tot in dit besluit genoemde
      deelbedragen, voor zover zij uitgaan boven een bij ministeriële regeling te omschrijven drempel;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
  - number: 1.r
    text: |-
      *nacalculatie:* bijstelling van het deelbedrag op basis van het verschil tussen kosten en het deelbedrag per
      zorgverzekeraar, per onderscheiden categorie van prestaties;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
  - number: 1.s
    text: '*deelbedrag:* het normatief bedrag per onderscheiden categorie van prestaties'
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
  - number: 1.t
    text: |-
      *generieke verevening:* bijstelling van het deelbedrag op basis van het verschil per zorgverzekeraar tussen
      de kosten en het deelbedrag in relatie met de verschillen tussen de kosten en het deelbedrag bij andere
      zorgverzekeraars, per onderscheiden categorie van prestaties.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel1
  - number: 2.1.1
    text: |-
      De zorg en overige diensten, bedoeld in [artikel 11, eerste lid, onderdeel a, van de wet][ref1] omvatten de vormen
      van zorg of diensten die naar inhoud en omvang zijn omschreven in de [artikelen 2.4 tot en met 2.15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.1.2
    text: |-
      De inhoud en omvang van de vormen van zorg of diensten worden mede bepaald door de stand van de wetenschap
      en praktijk en, bij ontbreken van een zodanige maatstaf, door hetgeen in het betrokken vakgebied geldt als
      verantwoorde en adequate zorg en diensten.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.1
  - number: 2.1.3
    text: |-
      Onverminderd hetgeen is bepaald in de [artikelen 2.4 tot en met 2.15][ref1], heeft de verzekerde op een vorm van
      zorg of een dienst slechts recht voor zover hij daarop naar inhoud en omvang redelijkerwijs is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.1
    text: |-
      De vergoeding van kosten, bedoeld in [artikel 11, eerste lid, onderdeel b, van de wet][ref1] omvat de kosten die
      de verzekerde heeft gemaakt voor zorg of overige diensten zoals die naar inhoud en omvang zijn omschreven in de
      [artikelen 2.4 tot en met 2.15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.2
    text: 'Bij het bepalen van de vergoeding worden in mindering gebracht:'
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.2
  - number: 2.2.2.a
    text: |-
      hetgeen de verzekerde als eigen bijdrage had moeten betalen indien hij krachtens de zorgverzekering recht zou
      hebben op prestaties bestaande uit zorg of overige diensten;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.2
  - number: 2.2.2.b
    text: de kosten die hoger zijn dan in de Nederlandse marktomstandigheden in redelijkheid passend is te achten.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.2
  - number: '2.3'
    text: |-
      Indien Onze Minister van Financiën van de in [artikel 18b, eerste lid, van de Noodwet financieel verkeer][ref1]
      geregelde bevoegdheid gebruik heeft gemaakt, en de behoefte aan zorg of overige diensten ontstaan is naar
      aanleiding van een of meer in die bepaling bedoelde terroristische handelingen, heeft de verzekerde slechts recht
      op een of meer prestaties voor zover de kosten daarvan niet hoger zijn dan door Onze Minister van Financiën is
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003173#Artikel18b
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0003173
        artikel: 18b
  - number: 2.4.1
    text: |-
      Geneeskundige zorg omvat zorg zoals huisartsen, medisch-specialisten, klinisch-psychologen en verloskundigen
      die plegen te bieden, met uitzondering van de zorg zoals tandarts-specialisten die plegen te bieden, alsmede
      paramedische zorg als bedoeld in [artikel 2.6][ref1], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.4.1.a
    text: 'de zorg niet omvat:'
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.a.1°
    text: het vaccineren ten behoeve van grieppreventie,
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.a.2°
    text: de eerste dan wel vierde of volgende in-vitrofertilisatiepoging per te realiseren zwangerschap;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.b
    text: 'behandeling van plastisch-chirurgische aard slechts onder de zorg valt indien die strekt tot correctie van:'
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.b.1°
    text: afwijkingen in het uiterlijk die gepaard gaan met aantoonbare lichamelijke functiestoornissen;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.b.2°
    text: verminkingen die het gevolg zijn van een ziekte, ongeval of geneeskundige verrichting;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.b.3°
    text: |-
      verlamde of verslapte bovenoogleden die het gevolg zijn van een aangeboren afwijking of een bij de geboorte
      aanwezige chronische aandoening;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.b.4°
    text: |-
      de volgende aangeboren misvormingen: lip-, kaak- en gehemeltespleten, misvormingen van het benig aangezicht,
      goedaardige woekeringen van bloedvaten, lymfevaten of bindweefsel, geboortevlekken of misvormingen van urineweg-
      en geslachtsorganen;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.b.5°
    text: uiterlijke geslachtskenmerken bij een vastgestelde transsexualiteit;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.c
    text: 'transplantatie van weefsels en organen slechts tot de zorg behoort indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.c.1°
    text: beenmergtransplantatie;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.c.2°
    text: bottransplantatie;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.c.3°
    text: hoornvliestransplantatie;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.c.4°
    text: huidweefseltransplantatie;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.c.5°
    text: niertransplantatie;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.c.6°
    text: harttransplantatie;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.c.7°
    text: levertransplantatie, gepaard gaande met verwijdering van de eigen lever van de ontvanger;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.c.8°
    text: longtransplantatie;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.c.9°
    text: hartlongtransplantatie;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.1.c.10°
    text: nierpancreastransplantatie;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Bij ministeriële regeling kunnen vormen van zorg zoals medisch-specialisten die plegen te bieden, worden
      uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.4
  - number: '2.5'
    text: |-
      De geneeskundige zorg, bedoeld in [artikel 2.4, eerste lid, onderdeel c][ref1], omvat tevens vergoeding van de
      kosten van:


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.a
    text: specialistisch geneeskundige zorg in verband met de selectie van de donor;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.5
  - number: 2.5.b
    text: |-
      specialistisch geneeskundige zorg in verband met de operatieve verwijdering van het transplantatiemateriaal bij de
      gekozen donor;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.5
  - number: 2.5.c
    text: |-
      het onderzoek, de preservering, de verwijdering en het vervoer van het postmortale transplantatiemateriaal, in
      verband met de voorgenomen transplantatie;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.5
  - number: 2.5.d
    text: |-
      de zorg waarop ingevolge dit hoofdstuk aanspraak bestaat aan de donor, gedurende ten hoogste dertien weken na de
      datum van ontslag uit de instelling waarin de donor ter selectie of verwijdering van het transplantatiemateriaal
      opgenomen is geweest, voor zover die zorg verband houdt met die opneming;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.5
  - number: 2.5.e
    text: |-
      het vervoer van de donor in de laagste klasse van een openbaar middel van vervoer binnen Nederland of, indien
      medisch noodzakelijk, vervoer per auto binnen Nederland, in verband met de selectie, opneming en ontslag uit het
      ziekenhuis en met de zorg, bedoeld in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.5
  - number: 2.5.f
    text: |-
      het vervoer van en naar Nederland, van een in het buitenland woonachtige donor, in verband met transplantatie van
      een nier of beenmerg bij een verzekerde in Nederland en overige kosten gemoeid met de transplantatie die verband
      houden met het wonen van de donor in het buitenland, met uitzondering van de verblijfskosten in Nederland en
      gederfde inkomsten.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.5
  - number: 2.6.1
    text: Paramedische zorg omvat fysiotherapie, oefentherapie, logopedie, ergotherapie en dieetadvisering.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.6
  - number: 2.6.2
    text: |-
      Fysiotherapie of oefentherapie omvat zorg zoals fysiotherapeuten en oefentherapeuten die plegen te bieden ter
      behandeling van de in [bijlage 1][ref1] aangegeven aandoeningen, voor zover de daarbij aangegeven termijn niet is
      overschreden. Deze zorg omvat voor de verzekerden van achttien jaar en ouder niet de eerste negen behandelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018492
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0018492
  - number: 2.6.3
    text: |-
      Voor verzekerden jonger dan achttien jaar bestaat fysiotherapie en oefentherapie in andere gevallen dan het tweede
      lid tevens uit ten hoogste negen behandelingen van dezelfde aandoening per jaar, bij ontoereikend resultaat te
      verlengen met ten hoogste negen behandelingen.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.6
  - number: 2.6.4
    text: |-
      Logopedie omvat zorg zoals logopedisten die plegen te bieden, mits de zorg een geneeskundig doel heeft en van de
      behandeling herstel of verbetering van de spraakfunctie of het spraakvermogen kan worden verwacht.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.6
  - number: 2.6.5
    text: |-
      Ergotherapie omvat zorg zoals ergotherapeuten die plegen te bieden, mits deze als doel heeft de zelfzorg en de
      zelfredzaamheid van de verzekerde te bevorderen en te herstellen, tot een maximum van tien behandeluren per jaar.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.6
  - number: 2.6.6
    text: |-
      Dieetadvisering omvat voorlichting met een medisch doel over voeding en eetgewoonten, zoals diëtisten die plegen te
      bieden, tot een maximum van vier behandeluren per jaar.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.6
  - number: 2.7.1
    text: |-
      Mondzorg omvat zorg zoals tandartsen die plegen te bieden, met dien verstande dat het slechts betreft
      tandheelkundige zorg die noodzakelijk is:
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.1.a
    text: |-
      indien de verzekerde een zodanige ernstige ontwikkelingsstoornis, groeistoornis of verworven afwijking van het
      tand-kaak-mondstelsel heeft dat hij zonder die zorg geen tandheelkundige functie kan behouden of verwerven,
      gelijkwaardig aan die welke hij zou hebben gehad als de aandoening zich niet zou hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.1.b
    text: |-
      indien de verzekerde een niet-tandheelkundige lichamelijke of geestelijke aandoening heeft en hij zonder die zorg
      geen tandheelkundige functie kan behouden of verwerven gelijkwaardig aan die welke hij zou hebben gehad als de
      aandoening zich niet had voorgedaan; of
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.1.c
    text: |-
      indien een medische behandeling zonder die zorg aantoonbaar onvoldoende resultaat zal hebben en de verzekerde
      zonder die andere zorg geen tandheelkundige functie kan behouden of verwerven gelijkwaardig aan die welke hij zou
      hebben gehad als de aandoening zich niet had voorgedaan.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.2
    text: |-
      Onder de zorg, bedoeld in het eerste lid, onderdeel a, is tevens begrepen het aanbrengen van een tandheelkundig
      implantaat en het aanbrengen van het vaste gedeelte van de suprastructuur, indien er sprake is van een zeer ernstig
      geslonken tandeloze kaak en deze dienen ter bevestiging van een uitneembare prothese;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.3
    text: |-
      Orthodontische hulp is slechts onder de zorg, bedoeld in het eerste lid, begrepen in geval van een zeer ernstige
      ontwikkelings- of groeistoornis van het tand-kaak-mondstelsel, waarbij medediagnostiek of medebehandeling van
      andere disciplines dan de tandheelkundige noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4
    text: |-
      Mondzorg omvat voor verzekerden jonger dan achttien jaar in andere gevallen dan het eerste lid, onderdelen a tot en
      met c:
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4.a
    text: |-
      periodiek preventief tandheelkundig onderzoek, eenmaal per jaar, tenzij de verzekerde tandheelkundig meer keren per
      jaar op die hulp is aangewezen;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4.b
    text: incidenteel tandheelkundig consult;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4.c
    text: het verwijderen van tandsteen;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4.d
    text: |-
      fluorideapplicatie aan verzekerden vanaf de leeftijd van zes jaar, maximaal tweemaal per jaar, tenzij de verzekerde
      tandheelkundig meer keren per jaar op die hulp is aangewezen;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4.e
    text: sealing;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4.f
    text: parodontale hulp;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4.g
    text: anesthesie;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4.h
    text: endodontische hulp;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4.i
    text: restauratie van gebitselementen met plastische materialen;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4.j
    text: gnathologische hulp;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4.k
    text: uitneembare prothetische voorzieningen;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4.l
    text: |-
      tandvervangende hulp met niet-plastische materialen alsmede het aanbrengen van tandheelkundige implantaten, indien
      het de vervanging van een of meer ontbrekende, blijvende snij- of hoektanden betreft die niet zijn aangelegd, dan
      wel omdat het ontbreken van die tand of die tanden het directe gevolg is van een ongeval;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4.m
    text: chirurgische tandheelkundige hulp, met uitzondering het aanbrengen van tandheelkundige implantaten;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.4.n
    text: röntgenonderzoek, met uitzondering van röntgenonderzoek ten behoeve van orthodontische hulp.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.5
    text: |-
      Mondzorg omvat voor verzekerden van achttien jaar en ouder in andere gevallen dan het eerste lid, onderdelen a tot
      en met c:
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.5.a
    text: |-
      chirurgische tandheelkundige hulp van specialistische aard en het daarbij behorende röntgenonderzoek, met
      uitzondering van parodontale chirurgie en het aanbrengen van een tandheelkundig implantaat;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.5.b
    text: uitneembare volledige prothetische voorzieningen voor de boven- of onderkaak.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.7.6
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de verzekerde een eigen bijdrage betaalt voor de zorg, bedoeld in
      het eerste of vijfde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.7
  - number: 2.8.1
    text: 'Farmaceutische zorg omvat aflevering van:'
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.8
  - number: 2.8.1.a
    text: |-
      de bij ministeriële regeling aangewezen geregistreerde geneesmiddelen voor zover deze zijn aangewezen door de
      zorgverzekeraar;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.8
  - number: 2.8.1.b
    text: |-
      andere geneesmiddelen die op grond van de [Wet op de Geneesmiddelenvoorziening][ref1] in Nederland mogen worden
      afgeleverd, indien het rationele farmacotherapie betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: 2.8.1.c
    text: polymere, oligomere, monomere en modulaire dieetpreparaten.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.8
  - number: 2.8.2
    text: 'Farmaceutische zorg omvat geen:'
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.8
  - number: 2.8.2.a
    text: farmaceutische zorg in bij ministeriële regeling aangegeven gevallen;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.8
  - number: 2.8.2.b
    text: geneesmiddelen ingeval van ziekterisico bij reizen;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.8
  - number: 2.8.2.c
    text: |-
      geneesmiddelen als bedoeld in de [artikel 54][ref1] en
      [55 van het Besluit bereiding en aflevering van farmaceutische producten][ref2], tenzij de verzekerde lijdt aan een
      ziekte die in Nederland niet vaker voorkomt dan bij 1 op de 150 000 inwoners;


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel55
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '55'
  - number: 2.8.2.d
    text: |-
      geneesmiddelen die gelijkwaardig of nagenoeg gelijkwaardig zijn aan enig niet aangewezen, geregistreerd
      geneesmiddel.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.8
  - number: 2.8.3
    text: |-
      De aanwijzing door de zorgverzekeraar geschiedt zodanig dat van alle werkzame stoffen die voorkomen in de bij
      ministeriële regeling aangewezen geneesmiddelen ten minste een geneesmiddel voor de verzekerde beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.8
  - number: 2.8.4
    text: |-
      Farmaceutische zorg omvat ook een ander bij ministeriële regeling aangewezen geneesmiddel dan het door de
      zorgverzekeraar aangewezen geneesmiddel, voor zover behandeling met het door de zorgverzekeraar aangewezen
      geneesmiddel voor de verzekerde medisch niet verantwoord is.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.8
  - number: 2.8.5
    text: |-
      Bij de ministeriële regeling, bedoeld in het eerste lid, onderdeel a, worden de aangewezen geneesmiddelen zoveel
      mogelijk ingedeeld in groepen van onderling vervangbare geneesmiddelen. In die ministeriële regeling wordt tevens
      de aanvraagprocedure voor de aanwijzing geregeld, worden regels gesteld met betrekking tot de systematiek van
      de indeling in groepen van onderling vervangbare geneesmiddelen en worden regels gesteld met betrekking tot de
      vaststelling van een vergoedingslimiet voor elke groep van onderling vervangbare geneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.8
  - number: 2.8.6
    text: |-
      De verzekerde betaalt een eigen bijdrage voor een geneesmiddel dat is ingedeeld in een groep van onderling
      vervangbare geneesmiddelen, indien de inkoopprijs hoger is dan de vergoedingslimiet. Een eigen bijdrage wordt ook
      betaald voor zover een geneesmiddel is bereid uit een geneesmiddel waarvoor een eigen bijdrage is verschuldigd. Bij
      ministeriële regeling wordt geregeld hoe de eigen bijdrage wordt berekend.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Hulpmiddelenzorg omvat bij ministeriële regeling aangewezen, functionerende hulpmiddelen en verbandmiddelen,
      waarbij kan worden geregeld:
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.9
  - number: 2.9.1.a
    text: in welke gevallen de verzekerde recht heeft op die zorg;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.9
  - number: 2.9.1.b
    text: vergoeding van bij die regeling aangewezen kosten in verband met thuisdialyse.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.9
  - number: 2.9.2
    text: |-
      De kosten van normaal gebruik van hulpmiddelen komen, tenzij bij ministeriële regeling anders is bepaald, voor
      rekening van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.9
  - number: 2.9.3
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de verzekerde voor een hulpmiddel een eigen bijdrage betaalt ter
      grootte van:
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.9
  - number: 2.9.3.a
    text: |-
      het verschil tussen de aanschaffingskosten en het bij dat hulpmiddel vermelde bedrag, dat kan verschillen naar
      gelang de groep van verzekerden, waartoe de verzekerde behoort;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.9
  - number: 2.9.3.b
    text: een daarbij vermeld bedrag wegens besparing van kosten.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.9
  - number: 2.10.1
    text: |-
      Verblijf omvat verblijf gedurende een ononderbroken periode van ten hoogste 365 dagen, dat medisch noodzakelijk is
      in verband met de geneeskundige zorg, bedoeld in [artikel 2.4][ref1], al dan niet gepaard gaande met verpleging,
      verzorging of paramedische zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.10.2
    text: |-
      Een onderbreking van ten hoogste dertig dagen wordt niet als onderbreking beschouwd, maar deze dagen tellen niet
      mee voor de berekening van de 365 dagen.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.10
  - number: 2.10.3
    text: |-
      In afwijking van het tweede lid tellen onderbrekingen wegens weekend- en vakantieverlof mee voor de berekening van
      de 365 dagen.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.10
  - number: '2.11'
    text: |-
      Naast de in [artikel 2.10][ref1] bedoelde verpleging, omvat verpleging tevens zorg zoals verpleegkundigen die
      plegen te bieden, zonder dat die zorg gepaard gaat met verblijf, en die noodzakelijk is in verband met medisch-
      specialistische zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.12.1
    text: |-
      Naast de in [artikel 2.10][ref1] bedoelde verzorging, omdat verzorging tevens zorg zoals kraamverzorgenden die
      plegen te bieden aan moeder en kind in verband met een bevalling, gedurende ten hoogste tien dagen, te rekenen
      vanaf de dag van bevalling.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.12.2
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de verzekerde een eigen bijdrage betaalt voor de zorg, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.12
  - number: 2.13.1
    text: |-
      Vervoer omvat ziekenvervoer per ambulance als bedoeld in [artikel 1, eerste lid, van de Wet ambulancevervoer][ref1],
      van de verzekerde over een afstand van maximaal 200 kilometer:


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel1
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '1'
  - number: 2.13.1.a
    text: |-
      naar een persoon bij wie of een instelling waarin hij zorg zal ontvangen waarvan de kosten geheel of gedeeltelijk
      ten laste van de zorgverzekering komen;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.13
  - number: 2.13.1.b
    text: |-
      naar een instelling waarin hij geheel of gedeeltelijk ten laste van de bijzondere ziektekostenverzekering als
      bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref1] zal gaan verblijven;


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 2.13.1.c
    text: 'vanuit een instelling, bedoeld in onderdeel b, naar:'
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.13
  - number: 2.13.1.c.1°
    text: |-
      een persoon bij wie of een instelling waarin hij geheel of gedeeltelijk ten laste van de bijzondere
      ziektekostenverzekering een onderzoek of een behandeling zal ondergaan;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.13
  - number: 2.13.1.c.2°
    text: |-
      een persoon of instelling voor het aanmeten en passen van een prothese die geheel of gedeeltelijk ten laste van de
      bijzondere ziektekostenverzekering wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.13
  - number: 2.13.1.d
    text: |-
      naar zijn woning of een andere woning, indien hij in zijn woning redelijkerwijs niet de nodige verzorging kan
      krijgen, indien hij komt van een van de personen of instellingen, bedoeld in de onderdelen a, b of c.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.13
  - number: 2.13.2
    text: |-
      Indien de zorgverzekeraar een verzekerde toestemming geeft zich te wenden tot een bepaalde persoon of instelling,
      geldt de beperking van 200 kilometer niet.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.13
  - number: 2.14.1
    text: |-
      Het vervoer omvat tevens ziekenvervoer per auto, anders dan per ambulance als bedoeld in
      [artikel 1, eerste lid, van de Wet ambulancevervoer][ref1], dan wel uit vervoer in de laagste klasse
      van een openbaar middel van vervoer van en naar een persoon, instelling of woning als bedoeld in
      [artikel 2.13, eerste lid][ref2], over een enkele reisafstand van maximaal 200 kilometer voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.14.1.a
    text: de verzekerde nierdialyses moet ondergaan;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.14
  - number: 2.14.1.b
    text: de verzekerde oncologische behandelingen met chemotherapie of radiotherapie moet ondergaan;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.14
  - number: 2.14.1.c
    text: de verzekerde zich uitsluitend met een rolstoel kan verplaatsen;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.14
  - number: 2.14.1.d
    text: het gezichtsvermogen van de verzekerde zodanig is beperkt dat hij zich niet zonder begeleiding kan verplaatsen.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.14
  - number: 2.14.2
    text: |-
      Indien het vervoer, bedoeld in het eerste lid, vervoer met een particuliere auto betreft, bedraagt de vergoeding
      een bij ministeriële regeling te bepalen bedrag per kilometer.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.14
  - number: 2.14.3
    text: |-
      In afwijking van het eerste lid, onderdelen a tot en met d, omvat vervoer ook vervoer in andere gevallen, indien
      de verzekerde in verband met de behandeling van een langdurige ziekte of aandoening langdurig is aangewezen op
      vervoer en het niet verstrekken of vergoeden van dat vervoer voor de verzekerde zal leiden tot een onbillijkheid
      van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.14
  - number: 2.14.4
    text: |-
      Indien de zorgverzekeraar een verzekerde toestemming zich te wenden tot een bepaalde persoon of instelling, geldt
      de beperking van 200 kilometer niet.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.14
  - number: 2.15.1
    text: |-
      In gevallen waarin ziekenvervoer per auto of een openbaar middel van vervoer niet mogelijk is, kan de
      zorgverzekeraar toestaan dat het ziekenvervoer plaatsvindt met een ander door de zorgverzekeraar aan te geven
      vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.15
  - number: 2.15.2
    text: |-
      Het ziekenvervoer omvat tevens vervoer van een begeleider, indien begeleiding noodzakelijk is, of indien het
      betreft begeleiding van kinderen beneden zestien jaar. In bijzondere gevallen kan de zorgverzekeraar vervoer van
      twee begeleiders toestaan.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.15
  - number: '2.16'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de verzekerde voor ziekenvervoer, anders dan ambulancevervoer als
      bedoeld in [artikel 1, eerste lid, van de Wet ambulancevervoer][ref1], een eigen bijdrage betaalt tot een bij die
      regeling aangeven maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel1
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '1'
  - number: 2.17.1
    text: |-
      De kosten van inschrijving bij een huisarts of bij een instelling die huisartsenzorg verleent, vallen buiten een
      eigen risico.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.17
  - number: 2.17.2
    text: 'Onder kosten van inschrijving worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.17
  - number: 2.17.2.a
    text: |-
      een bedrag ter zake van de inschrijving als patiënt, tot ten hoogste het tarief dat op grond van de
      [Wet tarieven gezondheidszorg][ref1] als beschikbaarheidstarief is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0003356
  - number: 2.17.2.b
    text: |-
      vergoedingen die samenhangen met de wijze waarop de geneeskundige zorg in de praktijk van de huisarts of in de
      instelling wordt verleend, met de kenmerken van het patiëntenbestand of met de locatie van de praktijk of de
      instelling, voor zover deze vergoedingen tussen de zorgverzekeraar van de verzekerde en zijn huisarts of instelling
      zijn overeengekomen en de huisarts of instelling deze vergoedingen krachtens eerderbedoelde overeenkomst bij de
      inschrijving van een verzekerde in rekening mag brengen.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.17
  - number: 2.18.1
    text: |-
      Het bedrag, bedoeld in [artikel 22 van de wet][ref1], bedraagt: € 255.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel22
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '22'
  - number: 2.18.2
    text: |-
      Het indexcijfer, bedoeld in [artikel 22, vijfde lid, onderdeel d, van de wet][ref1],
      betreft het percentage waarmee het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref2],
      op 1 juli van het jaar voorafgaand aan het kalenderjaar waarop de no-claimteruggave
      betrekking heeft, is gewijzigd ten opzichte van het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref3], op 1 juli van het
      tweede jaar voorafgaand aan dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 2.18.3
    text: Het met toepassing van het tweede lid berekende bedrag wordt naar beneden afgerond op een veelvoud van € 10.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.18
  - number: 2.18.4
    text: Bij de jaarlijkse toepassing van het indexcijfer wordt de afronding buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.18
  - number: 2.18.5
    text: Indien toepassing van het derde lid leidt tot een lager bedrag dan € 255, wordt het bedrag vastgesteld op € 255.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.18
  - number: 2.19.1
    text: |-
      Voor de toepassing van [artikel 22, eerste lid, van de wet][ref1] wordt het gebruik van zorg in verband met
      zwangerschap, bevalling en kraambed alsmede de zorg zoals huisartsen die plegen te bieden buiten beschouwing
      gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel22
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '22'
  - number: 2.19.2
    text: |-
      De no-claimteruggave wordt uiterlijk op 31 maart van het kalenderjaar volgend op het kalenderjaar waarop de no-
      claimteruggave betrekking heeft, uitgekeerd door overmaking op de bankrekening van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.19
  - number: 2.19.3
    text: |-
      Indien blijkt dat zorg is gebruikt, met de kosten waarvan de zorgverzekeraar bij de berekening van de no-
      claimteruggave geen rekening kon houden, wordt de no-claimteruggave uiterlijk op 31 maart van het tweede
      kalenderjaar volgend op het kalenderjaar waarop de no-claimteruggave betrekking heeft, gecorrigeerd.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel2.19
  - number: 3.1.1
    text: 'Het macro-prestatiebedrag is onderverdeeld in de volgende macro-deelbedragen:'
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.1
  - number: 3.1.1.a
    text: |-
      het macro-deelbedrag variabele kosten van ziekenhuisverpleging en kosten van specialistische hulp, dat betreft
      geneeskundige zorg zoals medisch-specialisten die plegen te bieden, met uitzondering van zorg zoals klinisch-
      psychologen en psychiaters die plegen te bieden, en de variabele kosten van verblijf, verpleging en verzorging, met
      uitzondering van verblijf gepaard gaande met zorg zoals klinisch-psychologen en psychiaters die plegen te bieden,
      voor zover deze prestaties voor vergoeding op grond van de wet in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.1
  - number: 3.1.1.b
    text: |-
      het macro-deelbedrag vaste kosten van ziekenhuisverpleging, dat betreft vaste kosten van verblijf, verpleging en
      verzorging, met uitzondering van verblijf gepaard gaande met zorg zoals klinisch-psychologen en psychiaters die
      plegen te bieden, voor zover deze prestaties voor vergoeding op grond van de wet in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.1
  - number: 3.1.1.d
    text: |-
      het macro-deelbedrag kosten van overige prestaties, dat betreft overige prestaties die voor vergoeding op grond van
      de wet in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Bij de ministeriële regeling ingevolge [artikel 32, vierde lid, van de wet][ref1] wordt voor 1 oktober van ieder
      jaar de hoogte van het macro-prestatiebedrag en van de macro-deelbedragen bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel32
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '32'
  - number: '3.2'
    text: |-
      Het College zorgverzekeringen verdeelt de in [artikel 3.1][ref1] genoemde macro-deelbedragen elk volgens de
      [artikelen 3.3 tot en met 3.6][ref2] in deelbedragen voor iedere zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.3.1
    text: |-
      Het College zorgverzekeringen verdeelt het macro-deelbedrag variabele kosten van ziekenhuisverpleging en kosten van
      specialistische hulp aan de hand van de verzekerdenaantallen onderverdeeld in klassen naar leeftijd en geslacht,
      FKG’s, DKG’s, aard van het inkomen en regio.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.3
  - number: 3.3.2
    text: De minister kent aan alle klassen van de genoemde criteria gewichten toe.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.3
  - number: 3.3.3
    text: |-
      De klassen, bedoeld in het eerste lid, en de gewichten, bedoeld in het tweede lid, worden jaarlijks bij
      ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Het College zorgverzekeringen verdeelt het macro-deelbedrag vaste kosten van ziekenhuisverpleging op basis van
      enerzijds een vergoeding voor de uitgaven die gefinancierd worden op basis van gelijke bedragen per verzekerde en
      anderzijds een vergoeding voor de uitgaven met betrekking tot de overige vaste kosten van ziekenhuisverpleging.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.4
  - number: 3.4.2
    text: |-
      De vergoeding voor de uitgaven die gefinancierd worden op basis van gelijke bedragen per verzekerde is gelijk aan
      een bij ministeriële regeling te bepalen bedrag per bij de zorgverzekeraar ingeschreven verzekerde, vermenigvuldigd
      met het aantal bij de zorgverzekeraar ingeschreven verzekerden.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.4
  - number: 3.6.1
    text: |-
      Het College zorgverzekeringen verdeelt het macro-deelbedrag kosten van overige prestaties aan de hand van de
      verzekerdenaantallen onderverdeeld in klassen naar leeftijd en geslacht, FKG’s, DKG’s, aard van het inkomen en
      regio.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.6
  - number: 3.6.2
    text: De minister kent aan alle klassen van de genoemde criteria gewichten toe.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.6
  - number: 3.6.3
    text: |-
      De klassen, bedoeld in het eerste lid, en de gewichten, bedoeld in het tweede lid, worden jaarlijks bij
      ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.6
  - number: 3.7.1
    text: |-
      Het College zorgverzekeringen sommeert de ingevolge [artikelen 3.2 tot en met 3.6][ref1] aan een zorgverzekeraar
      toegerekende deelbedragen tot één normatief bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.7.2
    text: |-
      Het College zorgverzekeringen brengt vervolgens op het berekende normatieve bedrag de door hem voor de
      zorgverzekeraar geraamde opbrengst van de nominale rekenpremie gecorrigeerd voor de geraamde gemiddelde no-
      claimteruggave in mindering.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.7
  - number: 3.7.3
    text: |-
      Het College zorgverzekeringen kent een bijdrage toe aan de zorgverzekeraar ter hoogte van de uitkomst van de
      berekening, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.7
  - number: 3.7.4
    text: |-
      Het College zorgverzekeringen deelt aan de zorgverzekeraar het berekende normatieve bedrag en de toegekende
      bijdrage mee, en geeft hierbij aan welk geraamd bedrag voor opbrengst van de nominale rekenpremie en voor de
      geraamde gemiddelde no-claimteruggave, bedoeld in het tweede lid, bij de berekening van de bijdrage zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.7
  - number: 3.8.1
    text: |-
      Ter herberekening van de bijdrage, bedoeld in [artikel 34, tweede lid, van de wet][ref1], vindt een herberekening
      plaats van de gewichten, genoemd in de [artikelen 3.3][ref2] en [3.6][ref3], rekening houdend met de verwachte
      financiële gevolgen van de toepassing van een specifieke compensatie van hoge kosten voor groepen van verzekerden
      naar leeftijd en geslacht, FKG’s, DKG’s, aard van het inkomen en regio.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.8.2
    text: |-
      Ter herberekening van de bijdrage, bedoeld in [artikel 34, tweede lid, van de wet][ref1] vindt een herberekening
      plaats van de gewichten, genoemd in [artikel 3.5][ref2], rekening houdend met de verwachte financiële gevolgen
      van de toepassing van een specifieke compensatie van hoge kosten voor groepen van verzekerden naar leeftijd en
      geslacht, en regio.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.8.3
    text: |-
      Ter herberekening van de bijdrage, bedoeld in [artikel 34, tweede lid, van de wet][ref1], herberekent het College
      zorgverzekeringen het normatieve bedrag ten behoeve van een zorgverzekeraar. Het College zorgverzekeringen baseert
      de herberekening van het normatieve bedrag op de ingevolge dit besluit voor de onderscheiden deelbedragen relevante
      gegevens over het betreffende jaar. Indien zulks naar zijn oordeel is aangewezen, kan het College zorgverzekeringen
      in afwijking van de tweede volzin bepalen dat voor door hem aan te geven herberekeningen niet wordt uitgegaan van
      de resultaten in het betreffende jaar maar van de resultaten in een daaraan al dan niet onmiddellijk voorafgaand
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel34
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '34'
  - number: 3.8.4
    text: |-
      Het College zorgverzekeringen deelt de vergoede kosten van ziekenhuisverpleging en specialistische hulp verleend
      door instellingen in het buitenland, overeenkomstig een bij ministeriële regeling te bepalen verdeelsleutel toe
      aan de variabele kosten van ziekenhuisverpleging en kosten van specialistische hulp, onderscheidenlijk aan de vaste
      kosten van ziekenhuisverpleging.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.8
  - number: 3.8.5
    text: |-
      Indien uit de specificatie van de kosten van in het buitenland verleende hulp niet blijkt om welke soort prestatie
      het gaat, deelt het College zorgverzekeringen de vergoede kosten overeenkomstig een bij ministeriële regeling te
      bepalen verdeelsleutel toe aan de kosten voor overige prestaties, variabele kosten van ziekenhuisverpleging en
      specialistische hulp en vaste kosten van ziekenhuisverpleging.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.8
  - number: 3.9.1
    text: |-
      Het College zorgverzekeringen merkt voor een bij ministeriële regeling te bepalen gedeelte van de
      verschillende geldende tarieven binnen de kosten van ziekenhuisverpleging, kosten aan als variabele kosten van
      ziekenhuisverpleging en kosten van specialistische hulp.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.9
  - number: 3.9.2
    text: |-
      Het College zorgverzekeringen merkt de declaraties van specialisten volledig aan als variabele kosten van
      ziekenhuisverpleging en kosten van specialistische hulp.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.9
  - number: 3.9.3
    text: Het College zorgverzekeringen past op een bij ministeriële regeling te bepalen wijze hogekostencompensatie toe.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.9
  - number: 3.9.4
    text: |-
      Na toepassing van het derde lid past het College zorgverzekeringen in een bij ministeriële regeling te bepalen mate
      generieke verevening toe.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.9
  - number: 3.9.5
    text: |-
      Het College zorgverzekeringen calculeert ten slotte in een bij ministeriële regeling te bepalen mate na op het
      verschil tussen de variabele kosten van ziekenhuisverpleging en kosten van specialistische hulp, en het resultaat
      na toepassing van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.9
  - number: 3.10.1
    text: |-
      Het College zorgverzekeringen merkt voor een bij ministeriële regeling te bepalen gedeelte van de
      verschillende geldende tarieven binnen de kosten van ziekenhuisverpleging, die kosten aan als vaste kosten van
      ziekenhuisverpleging.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.10
  - number: 3.10.2
    text: |-
      Het College zorgverzekeringen calculeert in een bij ministeriële regeling te bepalen mate na het verschil tussen
      de vaste kosten van ziekenhuisverpleging vastgesteld ingevolge het eerste lid en het deelbedrag vaste kosten van
      ziekenhuisverpleging in het betreffende jaar.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.10
  - number: 3.12.1
    text: |-
      Het College zorgverzekeringen past op het deelbedrag kosten van geneeskundige geestelijke gezondheidszorg op een
      bij ministeriële regeling te bepalen wijze hogekostencompensatie toe.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.12
  - number: 3.12.2
    text: |-
      Na toepassing van het eerste lid past het College zorgverzekeringen in een bij ministeriële regeling te bepalen
      mate generieke verevening toe.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.12
  - number: 3.12.3
    text: |-
      Het College zorgverzekeringen calculeert tenslotte in een bij ministeriële regeling te bepalen mate na op het
      verschil tussen de kosten van geneeskundige geestelijke gezondheidszorg, en het resultaat na toepassing van het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.12
  - number: 3.13.1
    text: |-
      Het College zorgverzekeringen sommeert de ingevolge de [artikelen 3.8 tot en met 3.12][ref1] herberekende
      deelbedragen tot één normatief bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.13.2
    text: |-
      Het College zorgverzekeringen brengt vervolgens op het herberekende normatieve bedrag de aan de zorgverzekeraar
      toegerekende opbrengsten van de nominale rekenpremie gecorrigeerd voor de gemiddelde no-claimteruggave in
      mindering.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.13
  - number: 3.13.3
    text: Het College zorgverzekeringen stelt de bijdrage vast op de uitkomst van de berekening, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.13
  - number: 3.13.4
    text: |-
      Het College zorgverzekeringen deelt aan de zorgverzekeraar het herberekende normatieve bedrag en de vastgestelde
      bijdrage mee, en geeft hierbij aan welke bedragen, bedoeld in het tweede lid, bij de vaststelling van de bijdrage
      zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.13
  - number: 3.13.5
    text: |-
      Het College zorgverzekeringen kan het normatieve bedrag ten behoeve van een zorgverzekeraar voorlopig herberekenen
      en de bijdrage voorlopig vaststellen. Het vierde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.13
  - number: 3.13.6
    text: |-
      Het College Zorgverzekeringen kan bij de voorlopige herberekeningen en de vaststelling van de bijdragen, bedoeld in
      het vijfde lid, [artikel 3.8, eerste en tweede lid][ref1], achterwege laten.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.14.1
    text: |-
      Waar het College zorgverzekeringen bij de berekening en de vaststelling van het normatieve bedrag ten behoeve van
      een zorgverzekeraar gebruik maakt van historische gegevens, kan hij, indien die gegevens niet beschikbaar zijn,
      uitgaan van een andere basis die een goede benadering geeft van de ontbrekende historische gegevens.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.14
  - number: 3.14.2
    text: |-
      Indien het toepassen van historische gegevens tot onredelijke en niet-beoogde uitkomsten leidt, is het College
      zorgverzekeringen bevoegd om uit te gaan van een alternatieve basis.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.14
  - number: 3.15.1
    text: |-
      In aanvulling op de bijdrage, bedoeld in de [artikelen 3.7][ref1] en [3.13][ref2], verstrekt het College
      zorgverzekeringen een uitkering in verband met uitvoeringskosten van verzekerden jonger dan 18 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.15.2
    text: |-
      De uitkering is gelijk aan een vast bedrag maal het aantal verzekerden jonger dan 18 jaar op peilmoment 1 juli van
      het betreffende jaar.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.15
  - number: 3.15.3
    text: De hoogte van het vaste bedrag per verzekerde jonger dan 18 jaar wordt jaarlijks bij ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.15
  - number: 3.16.1
    text: |-
      In aanvulling op de bijdrage bedoeld in de [artikelen 3.7][ref1] en [3.13][ref2], kan het College zorgverzekeringen
      een uitkering verstrekken in verband met een substantieel of structureel verschil tussen kosten en deelbedrag per
      verzekeraar dat rechtstreeks verband houdt met hogere kosten van verzekerden als gevolg van een zeer uitzonderlijke
      omstandigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.16.2
    text: |-
      Ingevolge het eerste lid worden geen uitkeringen verstrekt dan nadat bij ministeriële regeling is vastgesteld dat
      sprake is van een nationale ramp die niet opgevangen kan worden binnen de reguliere wijze van vaststelling van de
      bijdrage aan zorgverzekeraars.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.16
  - number: 3.16.3
    text: |-
      Bij ministeriële regeling wordt de wijze waarop het College zorgverzekeringen de uitkering, bedoeld in het eerste
      lid, vaststelt, geregeld.
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.16
  - number: '3.17'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de bijdrage, bedoeld in de [artikelen 3.7][ref1] en [3.13][ref2],
      wordt verhoogd met de specifiek voor de verzekeraar geraamde no-claimteruggave en dat het College zorgverzekeringen
      bij het in mindering brengen van de geraamde opbrengst van de nominale rekenpremie op het berekende normatieve
      bedrag niet corrigeert voor de geraamde gemiddelde no-claimteruggave.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '4.1'
    text: |-
      Bij de inwerkingtreding van de [wet][ref1] kunnen voor een zorgverzekeraar die als nieuwe rechtspersoon de
      [wet][ref2] uitvoert de gegevens van zijn rechtsvoorganger worden aangemerkt als historische gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0018450
  - number: '4.2'
    text: |-
      De rijksbelastingdienst verstrekt aan de zorgverzekeraar op een verzoek als bedoeld in
      [artikel 89, eerste lid, van de wet][ref1], het persoonsgegeven dat een persoon als niet-ingezetene aan de
      loonbelasting is onderworpen ter zake van in Nederland in dienstbetrekking verrichte arbeid dan wel als niet-
      ingezetene aan de inkomstenbelasting is onderworpen ter zake van in Nederland verrichte beroepswerkzaamheden anders
      dan in dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel89
    url: https://wetten.overheid.nl/BWBR0018492/2006-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '89'
  - number: 4.3.1
    text: |-
      Dit besluit treedt in werking op 1 januari 2006, met uitzondering van [artikel 2.4, eerste lid][ref1],
      voor zover het betreft zorg zoals psychiaters, zenuwartsen en klinisch-psychologen die
      plegen te bieden, de eerstelijnspsychologische zorg voor zover die niet wordt verleend door
      een huisarts, de [onderdelen d, e en f van dat lid, het derde lid van dat artikel][ref2],
      [artikel 3.1, eerste lid, subonderdeel c][ref3], [artikel 3.5][ref4] en [artikel 3.11][ref5].


