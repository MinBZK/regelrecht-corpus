---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_zorgverzekering
regulatory_layer: AMVB
publication_date: '2014-12-18'
valid_from: '2026-01-01'
bwb_id: BWBR0018492
url: https://wetten.overheid.nl/BWBR0018492/2026-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 22 april 2005, kenmerk Z/VV-2577868;

    Gelet op de artikelen 11, derde en vierde lid, 20, 22, vijfde lid, 32, tweede en derde lid, 34, derde lid, en 89,
    vijfde lid, van de Zorgverzekeringswet;

    De Raad van State gehoord (advies van 20 juni 2005, nr. W13.05.0153/III);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 27 juni 2005, kenmerk Z/VV-
    2596179;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.a
    text: |-
      *wet:* de [Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 1.b
    text: '*verblijf:* verblijf gedurende het etmaal;'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.c
    text: |-
      *eigen bijdrage:* een eigen bijdrage als bedoeld in [artikel 11, derde lid van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
  - number: 1.d
    text: |-
      *geregistreerd geneesmiddel:* een geneesmiddel waarvoor een handelsvergunning of parallelhandelsvergunning
      is verleend krachtens de [Geneesmiddelenwet][ref1] dan wel krachtens de verordening, bedoeld in
      [artikel 1, eerste lid, onder fff, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0021505
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '1'
  - number: 1.e
    text: '*in-vitrofertilisatiepoging:* zorg volgens de in-vitrofertilisatiemethode, inhoudende:'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.e.1°
    text: het door hormonale behandeling bevorderen van de rijping van eicellen in het lichaam van de vrouw;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.e.2°
    text: de follikelpunctie;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.e.3°
    text: de bevruchting van eicellen en het kweken van embryo's in het laboratorium;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.e.4°
    text: |-
      het een of meer keren implanteren van een of twee embryo's in de baarmoederholte teneinde zwangerschap te doen
      ontstaan;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.f
    text: |-
      *vereveningsbijdrage:* de bijdrage, bedoeld in [paragraaf 4.2 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Paragraaf4.2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        paragraaf: '4.2'
  - number: 1.g
    text: '*vereveningsjaar:* het kalenderjaar waarop een vereveningsbijdrage betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.h
    text: |-
      *cluster van prestaties:* het cluster «variabele zorgkosten», het cluster «vaste zorgkosten», of het cluster
      «kosten van geneeskundige geestelijke gezondheidszorg»;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.i
    text: |-
      *variabele zorgkosten:* de variabele kosten van in het kader van medisch-specialistische zorg verleend verblijf,
      verpleging en verzorging, met uitzondering van verblijf gepaard gaande met zorg zoals klinisch-psychologen en
      psychiaters die plegen te bieden, alsmede de kosten van geneeskundige zorg zoals medisch-specialisten die plegen
      te bieden, met uitzondering van zorg zoals klinisch-psychologen en psychiaters die plegen te bieden, kosten van
      zorg als bedoeld in [artikel 2.10][ref1], dit alles voor zover deze kosten onder de dekking van een zorgverzekering
      vallen en niet bij ministeriële regeling is bepaald dat deze als tot een ander cluster behorende kosten worden
      aangemerkt en de kosten van onder de dekking van een zorgverzekering vallende prestaties die niet als tot een ander
      cluster behorende kosten worden aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.j
    text: |-
      *vaste zorgkosten:* bij ministeriële regeling aangewezen kosten van zorg die voor verzekeraars niet te beïnvloeden
      zijn of door onvoldoende gegevens in het kader van de risicoverevening niet normeerbaar zijn, voor zover deze
      kosten onder de dekking van een zorgverzekering vallen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.m
    text: |-
      *macro-deelbedrag:* een in de ministeriële regeling, bedoeld in [artikel 3.1, derde lid][ref1], voor een cluster
      van prestaties genoemd bedrag dat ex ante over de zorgverzekeraars wordt verdeeld;


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 1.n
    text: '*deelbedrag:* een bedrag dat een zorgverzekeraar voor een cluster van prestaties ontvangt;'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.o
    text: |-
      *leeftijd en geslacht:* vereveningscriteria op grond waarvan verzekerden worden ingedeeld op grond van hun leeftijd
      en geslacht;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.p
    text: |-
      *FKG’s:* farmaceutische kostengroepen, een vereveningscriterium op grond waarvan verzekerden worden ingedeeld in
      klassen chronische aandoeningen op basis van geneesmiddelengebruik in het verleden;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.q
    text: |-
      *FKG’s psychische aandoeningen:* farmaceutische kostengroepen psychische aandoeningen, een vereveningscriterium
      op grond waarvan verzekerden worden ingedeeld in klassen chronische psychische aandoeningen op basis van
      geneesmiddelengebruik in het verleden;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.r
    text: |-
      *DKG’s:* diagnosekostengroepen, een vereveningscriterium op grond waarvan verzekerden worden ingedeeld in
      kostenhomogene klassen met verschillende chronische aandoeningen die geïdentificeerd zijn op grond van uitgevoerde
      diagnose behandeling combinaties in het verleden;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.s
    text: |-
      *AVI:* aard van het inkomen, een vereveningscriterium op grond waarvan verzekerden worden ingedeeld in klassen op
      basis van de aard van hun inkomen en hun leeftijd;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.t
    text: |-
      *SES:* sociaaleconomische status, een vereveningscriterium op grond waarvan verzekerden worden ingedeeld in klassen
      op basis van hun leeftijd en het inkomen per adres;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.u
    text: |-
      *PPA:* personen per adres, een vereveningscriterium op grond waarvan verzekerden worden ingedeeld op basis van hun
      leeftijd en de aard van het huishouden;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.v
    text: |-
      *regio:* een vereveningscriterium op grond waarvan verzekerden op basis van de vier cijfers van de postcode van
      hun woonadres worden ingedeeld in klassen, waarbij op postcodeniveau rekening is gehouden met de verschillen met
      betrekking tot sociaaleconomische omstandigheden en gezondheid;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.w
    text: |-
      *GGZ-regio:* een vereveningscriterium op grond waarvan verzekerden op basis van de vier cijfers van de postcode van
      hun woonadres worden ingedeeld in klassen, waarbij op postcodeniveau rekening is gehouden met de verschillen met
      betrekking tot GGZ-zorgaanbod, sociaaleconomische omstandigheden en geestelijke gezondheid;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.z
    text: |-
      *MHK:* meerjarig hoge kosten, een vereveningscriterium op grond waarvan verzekerden op basis van de kosten van de
      zorg die zij in het verleden hebben genoten, worden ingedeeld in klassen van voorspelbare zorgkosten;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.aa
    text: |-
      *nominale rekenpremie:* een bij de berekening van de vereveningsbijdrage in aanmerking te nemen bedrag, ter hoogte
      van de door Onze Minister geraamde premie die een zorgverzekeraar op jaarbasis bij een premieplichtige verzekerde
      voor verzekerde prestaties in rekening brengt;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.bb
    text: |-
      *geraamde kosten:* de bij de ministeriële regeling, bedoeld in [artikel 3.1, derde lid][ref1], bepaalde macro-
      deelbedragen, vermeerderd of verminderd met na vaststelling van deze deelbedragen maar voor 1 januari van het
      vereveningsjaar geraamde, bij ministeriële regeling te bepalen kosten die het gevolg zijn van wijzigingen in de
      over het vereveningsjaar op grond van een zorgverzekering te verzekeren prestaties waarmee bij het opstellen van de
      ministeriële regeling, bedoeld in artikel 3.1, derde lid, nog geen rekening kon worden gehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 1.cc
    text: |-
      *nacalculatie:* bijstelling van het deelbedrag op basis van het verschil tussen gerealiseerde kosten en het
      herberekende deelbedrag per zorgverzekeraar, per onderscheiden cluster van prestaties;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.dd
    text: |-
      *HKG’s:* hulpmiddelenkostengroepen, een vereveningscriterium op grond waarvan verzekerden worden ingedeeld in
      klassen van hulpmiddelengebruik op basis van gebruik in het verleden;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.ee
    text: |-
      *DKG’s psychische aandoeningen:* diagnosekostengroepen, een vereveningscriterium op grond waarvan verzekerden
      worden ingedeeld in kostenhomogene klassen met verschillende chronische psychische aandoeningen die geïdentificeerd
      zijn op grond van diagnose behandeling combinaties in het verleden;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.hh
    text: |-
      *GGZ-MHK:* meerjarig hoge kosten in de GGZ, een vereveningscriterium op grond waarvan verzekerden op basis van
      de kosten van geestelijke gezondheidszorg die zij in het verleden hebben genoten worden ingedeeld in klassen van
      kosten in de GGZ;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.ii
    text: |-
      *kosten van geneeskundige geestelijke gezondheidszorg:* de kosten van geneeskundige zorg zoals klinisch-psychologen
      en psychiaters die plegen te bieden alsmede het daarmee gepaard gaande verblijf gedurende een onafgebroken periode
      van niet meer dan 1.095 dagen, voor zover deze kosten onder de dekking van een zorgverzekering vallen en niet bij
      ministeriële regeling is bepaald dat deze als tot een ander cluster behorende kosten worden aangemerkt;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.jj
    text: |-
      *FDG:* fysiotherapiediagnosegroepen, een vereveningscriterium op grond waarvan verzekerden worden ingedeeld in
      klassen op basis van de fysiotherapiediagnose in het verleden;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.kk
    text: |-
      *MVV:* meerjarig hoge kosten van verpleging en verzorging, een vereveningscriterium op grond waarvan verzekerden
      op basis van de kosten van verpleging en verzorging, die zij in het verleden hebben genoten, worden ingedeeld in
      klassen van kosten van verpleging en verzorging;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.ll
    text: '*hogekostencompensatie:* verevening van een percentage van hoge kosten van verzekerden boven een bepaalde drempel;'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.mm
    text: |-
      *MFK:* meerjarige farmaciekosten, een vereveningscriterium op grond waarvan verzekerden worden ingedeeld in klassen
      op basis van hun farmaciekosten in het verleden;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.nn
    text: |-
      *HSM:* historische somatische morbiditeit, een vereveningscriterium op grond waarvan verzekerden worden ingedeeld
      in klassen op basis van hun morbiditeit in het verleden;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.oo
    text: |-
      *SEI:* seizoenarbeiders, een vereveningscriterium op grond waarvan verzekerden worden ingedeeld in klassen waarbij
      seizoenarbeiders worden onderscheiden van overige verzekerden;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 1.pp
    text: |-
      *IBZ:* indicatie bevallingen en zwangerschappen, een vereveningscriterium op grond waarvan verzekerden die zwanger
      zijn in het vereveningsjaar worden onderscheiden van overige verzekerden.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel1
  - number: 2.1.1
    text: |-
      De zorg en overige diensten, bedoeld in [artikel 11, eerste lid, onderdeel a, van de wet][ref1] omvatten de vormen
      van zorg of diensten die naar inhoud en omvang zijn omschreven in de [artikelen 2.4 tot en met 2.15][ref2], met
      uitzondering van vormen van zorg of diensten die voor de verzekerden kunnen worden bekostigd op grond van een
      wettelijk voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.1.2
    text: |-
      De inhoud en omvang van de vormen van zorg of diensten worden mede bepaald door de stand van de wetenschap
      en praktijk en, bij ontbreken van een zodanige maatstaf, door hetgeen in het betrokken vakgebied geldt als
      verantwoorde en adequate zorg en diensten.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.1
  - number: 2.1.3
    text: |-
      Onverminderd hetgeen is bepaald in de [artikelen 2.4 tot en met 2.15][ref1], heeft de verzekerde op een vorm van
      zorg of een dienst slechts recht voor zover hij daarop naar inhoud en omvang redelijkerwijs is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.1.4
    text: |-
      Onder de zorg en overige diensten, bedoeld in het eerste lid, valt niet forensische zorg als bedoeld in
      [artikel 1.1, tweede lid, van de Wet forensische zorg][ref1] of forensische zorg als aangemerkt in of krachtens een
      algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel1
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '1'
  - number: 2.1.5
    text: |-
      In afwijking van het tweede lid vallen onder de zorg en overige diensten, bedoeld in de [artikelen 2.4][ref1],
      [2.6][ref2], [2.8][ref3] of [2.9][ref4], ook de zorg en diensten die bij ministeriële regeling zijn aangewezen
      onder de daarbij geregelde voorwaarden en gedurende een daarbij aan te geven termijn van maximaal veertien jaar,
      voor zover er sprake is van verantwoorde zorg en diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.1
    text: |-
      De vergoeding van kosten, bedoeld in [artikel 11, eerste lid, onderdeel b, van de wet][ref1], omvat de kosten die
      de verzekerde heeft gemaakt voor zorg of overige diensten zoals die naar inhoud en omvang zijn omschreven in de
      [artikelen 2.4 tot en met 2.15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.2
    text: 'Bij het bepalen van de vergoeding worden in mindering gebracht:'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.2
  - number: 2.2.2.a
    text: |-
      hetgeen de verzekerde als eigen bijdrage had moeten betalen indien hij krachtens de zorgverzekering recht zou
      hebben op prestaties bestaande uit zorg of overige diensten;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.2
  - number: 2.2.2.b
    text: de kosten die hoger zijn dan in de Nederlandse marktomstandigheden in redelijkheid passend is te achten.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Indien de behoefte aan zorg of een andere dienst het gevolg is van een of meer terroristische handelingen en
      de totale schade die in een kalenderjaar ten gevolge van dergelijke handelingen bij schade-, levens- of natura-
      uitvaartverzekeraars waarop de [Wet financieel toezicht][ref1] van toepassing is, zal worden gedeclareerd, naar
      verwachting van de Nederlandse Herverzekeringsmaatschappij voor Terrorismeschaden N.V. hoger zal zijn dan het door
      die maatschappij herverzekerde maximumbedrag per kalenderjaar, heeft de verzekerde slechts recht op prestaties tot
      een door die maatschappij te bepalen, voor alle verzekeringen gelijk percentage van de kosten of waarde van de zorg
      of overige diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 2.3.2
    text: |-
      Het eerste lid geldt slechts indien de zorgverzekeraar waarbij de verzekerde zijn zorgverzekering heeft, zijn
      verplichtingen die in geval van terroristische handelingen uit de zorgverzekering voortvloeien, heeft herverzekerd
      bij de Nederlandse Herverzekeringsmaatschappij voor Terrorismeschaden N.V.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Indien na een terroristische handeling op grond van [artikel 33 van de wet][ref1] of [artikel 3.23][ref2] van dit
      besluit een aanvullende bijdrage ter beschikking wordt gesteld, heeft de verzekerde in aanvulling op de prestaties,
      bedoeld in het eerste lid, recht op prestaties van een bij de regeling, bedoeld in [artikel 33 van de wet][ref3] of
      [artikel 3.23][ref4] van dit besluit, te bepalen omvang.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '33'
      - id: ref4
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 2.4.1
    text: |-
      Geneeskundige zorg omvat zorg zoals huisartsen, medisch-specialisten, klinisch-psychologen en verloskundigen
      die plegen te bieden, zintuiglijk gehandicaptenzorg als bedoeld in [artikel 2.5a][ref1], zorg bij stoppen-met-
      rokenprogramma als bedoeld in [artikel 2.5b][ref2], geriatrische revalidatie als bedoeld in [artikel 2.5c][ref3] en
      paramedische zorg als bedoeld in [artikel 2.6][ref4], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.4.1.a
    text: 'de zorg niet omvat:'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
  - number: 2.4.1.a.1°
    text: het vaccineren ten behoeve van grieppreventie;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
  - number: 2.4.1.a.2°
    text: |-
      de vierde of volgende in-vitrofertilisatiepoging per te realiseren zwangerschap, nadat drie pogingen zijn
      geëindigd tussen het moment dat een follikelpunctie is geslaagd en het moment dat er sprake is van een doorgaande
      zwangerschap van tien weken te rekenen vanaf het moment van de follikelpunctie en indien de implantatie van
      gecryopreserveerde embryo’s niet heeft geleid tot een doorgaande zwangerschap van negen weken en drie dagen te
      rekenen vanaf de implantatie;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
  - number: 2.4.1.a.3°
    text: |-
      de eerste en tweede in-vitrofertilisatiepoging bij een verzekerde jonger dan achtendertig jaar, indien er meer dan
      één embryo wordt teruggeplaatst;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
  - number: 2.4.1.a.4°
    text: |-
      vruchtbaarheidsgerelateerde zorg, indien de verzekerde vrouw drieënveertig jaar of ouder is, behoudens voor zover
      het een in-vitrofertilisatiepoging betreft die reeds is aangevangen voordat de verzekerde vrouw de leeftijd van
      drieënveertig jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
  - number: 2.4.1.a.5°
    text: zorg zoals tandarts-specialisten plegen te bieden;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
  - number: 2.4.1.b
    text: 'behandeling van plastisch-chirurgische aard slechts onder de zorg valt indien die strekt tot correctie van:'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
  - number: 2.4.1.b.1°
    text: afwijkingen in het uiterlijk die gepaard gaan met aantoonbare lichamelijke functiestoornissen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
  - number: 2.4.1.b.2°
    text: verminkingen die het gevolg zijn van een ziekte, ongeval of geneeskundige verrichting;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
  - number: 2.4.1.b.3°
    text: |-
      verlamde of verslapte bovenoogleden, indien de verlamming of verslapping een ernstige gezichtsveldbeperking
      tot gevolg heeft dan wel het gevolg is van een aangeboren afwijking of een bij de geboorte aanwezige chronische
      aandoening;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
  - number: 2.4.1.b.4°
    text: |-
      de volgende aangeboren misvormingen: lip-, kaak- en gehemeltespleten, misvormingen van het benig aangezicht,
      goedaardige woekeringen van bloedvaten, lymfevaten of bindweefsel, geboortevlekken of misvormingen van urineweg-
      en geslachtsorganen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
  - number: 2.4.1.b.5°
    text: primaire geslachtskenmerken bij een vastgestelde transsexualiteit;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
  - number: 2.4.1.c
    text: |-
      transplantaties van weefsels en organen slechts tot de zorg behoren indien de transplantatie is verricht in een
      lidstaat van de Europese Unie, in een staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of in een andere staat indien de donor woonachtig is in die staat en de echtgenoot, de geregistreerde
      partner of een bloedverwant in de eerste, tweede of derde graad van de verzekerde is.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
  - number: 2.4.2
    text: Bij ministeriële regeling kunnen vormen van zorg worden uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4
  - number: 2.4a.1
    text: |-
      Onverminderd [artikel 2.4, tweede lid][ref1], kan bij ministeriële regeling de verstrekking van een geneesmiddel in
      het kader van de behandeling van een of meer nieuwe indicaties worden uitgezonderd van geneeskundige zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.4a.2
    text: |-
      De uitzondering, bedoeld in het eerste lid, vindt plaats uiterlijk binnen vier weken na de dag dat voor het
      geneesmiddel voor de uit te zonderen indicaties:
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
  - number: 2.4a.2.a
    text: |-
      een handelsvergunning of een parallelhandelsvergunning is verleend krachtens de [Geneesmiddelenwet][ref1] dan wel
      krachtens de verordening, bedoeld in [artikel 1, eerste lid, onder fff, van die wet][ref2] indien een vergunning is
      aangevraagd voor het in de handel brengen van het geneesmiddel voor de uit te zonderen indicatie of


      [ref1]: https://wetten.overheid.nl/BWBR0021505
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0021505
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '1'
  - number: 2.4a.2.b
    text: |-
      een protocol of standaard als bedoeld in [artikel 68 van de Geneesmiddelenwet][ref1] is vastgesteld door de
      beroepsgroep indien geen vergunning is verleend of aangevraagd voor het in de handel brengen van het geneesmiddel
      voor de uit te zonderen indicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel68
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '68'
  - number: 2.4a.3
    text: |-
      De uitzondering, bedoeld in het eerste lid, vindt slechts plaats indien in vergelijking met de verstrekking van
      andere geneesmiddelen in het kader van geneeskundige zorg naar verwachting onevenredig hoge kosten per jaar of per
      behandeling kunnen ontstaan gelet op:
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
  - number: 2.4a.3.a
    text: de prijs van het geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
  - number: 2.4a.3.b
    text: het aantal met het geneesmiddel voor de nieuwe en daaropvolgende indicaties te behandelen patiënten;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
  - number: 2.4a.3.c
    text: het risico op ander gebruik dan gepast gebruik van het geneesmiddel voor de nieuwe en daaropvolgende indicaties.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
  - number: 2.4a.4
    text: |-
      Onder de kosten, bedoeld in de aanhef van het derde lid, kunnen mede worden begrepen de kosten van andere
      geneesmiddelen die voor de behandeling met het geneesmiddel in combinatie daarmee worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
  - number: 2.4a.5
    text: |-
      Bij ministeriële regeling kan de uitzondering, bedoeld in het eerste lid, geheel dan wel onder daarbij te stellen
      voorwaarden of voor een daarbij te bepalen periode gedeeltelijk worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
  - number: 2.4a.6
    text: |-
      Bij ministeriële regeling kan de uitzondering, bedoeld in het eerste lid, of de gedeeltelijke opheffing, bedoeld in
      het vijfde lid, worden uitgebreid met daaropvolgende indicaties. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
  - number: 2.4a.7
    text: |-
      De uitzondering, bedoeld in het eerste lid, wordt niet opgeheven dan nadat Onze Minister met inachtneming van een
      daarbij te stellen termijn voor zover noodzakelijk de gelegenheid heeft geboden aan:
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
  - number: 2.4a.7.a
    text: |-
      het Zorginstituut om aan Onze Minister advies uit te brengen over het onderbrengen van de behandeling met het
      geneesmiddel voor de uitgezonderde indicaties onder geneeskundige zorg;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
  - number: 2.4a.7.b
    text: |-
      het Zorginstituut om te initiëren dat maatregelen worden getroffen voor gepast gebruik van het geneesmiddel voor de
      uitgezonderde indicaties en om Onze Minister te informeren over deze maatregelen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
  - number: 2.4a.7.c
    text: |-
      de aanvrager of houder van de handelsvergunning of parallelhandelsvergunning van het geneesmiddel om maatregelen
      te treffen ter verlaging van de kosten van het geneesmiddel voor de uitgezonderde indicaties en om Onze Minister te
      informeren over deze maatregelen.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.4a
  - number: 2.5.1
    text: |-
      De geneeskundige zorg, bedoeld in [artikel 2.4, eerste lid, onderdeel c][ref1], omvat tevens vergoeding van de
      kosten van:


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.1.a
    text: specialistisch geneeskundige zorg in verband met de selectie van de donor;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.5
  - number: 2.5.1.b
    text: |-
      specialistisch geneeskundige zorg in verband met de operatieve verwijdering van het transplantatiemateriaal bij de
      gekozen donor;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.5
  - number: 2.5.1.c
    text: |-
      het onderzoek, de preservering, de verwijdering en het vervoer van het postmortale transplantatiemateriaal, in
      verband met de voorgenomen transplantatie;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.5
  - number: 2.5.1.d
    text: |-
      de zorg waarop ingevolge dit hoofdstuk aanspraak bestaat aan de donor, gedurende ten hoogste dertien weken, dan wel
      een half jaar in geval van een levertransplantatie, na de datum van ontslag uit de instelling waarin de donor ter
      selectie of verwijdering van het transplantatiemateriaal opgenomen is geweest, voor zover die zorg verband houdt
      met die opneming;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.5
  - number: 2.5.1.e
    text: |-
      het vervoer van de donor in de laagste klasse van een openbaar middel van vervoer binnen Nederland of, indien
      medisch noodzakelijk, vervoer per auto binnen Nederland, in verband met de selectie, opneming en ontslag uit het
      ziekenhuis en met de zorg, bedoeld in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.5
  - number: 2.5.1.f
    text: |-
      het vervoer van en naar Nederland, van een in het buitenland woonachtige donor, in verband met transplantatie van
      een nier, beenmerg of lever bij een verzekerde in Nederland en overige kosten gemoeid met de transplantatie die
      verband houden met het wonen van de donor in het buitenland, met uitzondering van de verblijfskosten in Nederland
      en gederfde inkomsten.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.5
  - number: 2.5.2
    text: |-
      Indien de donor een zorgverzekering heeft afgesloten, komen de kosten van het vervoer, bedoeld in het eerste lid,
      onderdelen e en f, ten laste van de zorgverzekering van de donor.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.5
  - number: 2.5a
    text: |-
      Zintuiglijk gehandicaptenzorg omvat multidisciplinaire zorg in verband met een visuele beperking, een auditieve
      beperking, of een communicatieve beperking als gevolg van een taalontwikkelingsstoornis, gericht op het leren
      omgaan met, het opheffen of het compenseren van de beperking, met als doel de verzekerde zo zelfstandig mogelijk te
      kunnen laten functioneren.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.5a
  - number: 2.5b.1
    text: |-
      Zorg bij stoppen-met-rokenprogramma omvat geneeskundige en farmacotherapeutische interventies ter ondersteuning van
      gedragsverandering met als doel te stoppen met roken.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.5b
  - number: 2.5b.2
    text: De zorg, bedoeld in het eerste lid, omvat het maximaal drie keer per kalenderjaar volgen van een programma.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.5b
  - number: 2.5c.1
    text: |-
      Geriatrische revalidatie omvat integrale en multidisciplinaire revalidatiezorg zoals specialisten
      ouderengeneeskunde die plegen te bieden in verband met kwetsbaarheid en complexe multimorbiditeit met als doel
      herstel of verbetering van het functioneren en de participatie in de maatschappij van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.5c
  - number: 2.5c.2
    text: |-
      De geriatrische revalidatie valt slechts onder de zorg, bedoeld in het eerste
      lid, indien er niet aan vooraf is gegaan verblijf in een instelling als bedoeld in
      [artikel 3.1.1, eerste lid, onderdeel a, van de Wet langdurige zorg][ref1], gepaard gaande met behandeling als
      bedoeld in artikel 3.1.1, eerste lid, onderdeel c, van die wet in dezelfde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.5c
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '3'
  - number: 2.6.1
    text: Paramedische zorg omvat fysiotherapie, oefentherapie, logopedie, ergotherapie en diëtetiek.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.6
  - number: 2.6.2
    text: |-
      Fysiotherapie of oefentherapie omvat zorg zoals fysiotherapeuten en oefentherapeuten die plegen te bieden ter
      behandeling van de in [bijlage 1][ref1] aangegeven aandoeningen, voor zover de daarbij aangegeven termijn niet is
      overschreden. Deze zorg omvat voor de verzekerden van achttien jaar en ouder niet de eerste twintig behandelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018492
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0018492
  - number: 2.6.3
    text: |-
      Fysiotherapie omvat tevens bekkenfysiotherapie in verband met urine-incontinentie. Deze zorg omvat voor de
      verzekerden van achttien jaar of ouder ten hoogste negen behandelingen.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.6
  - number: 2.6.4
    text: |-
      Fysiotherapie omvat tevens gesuperviseerde oefentherapie bij perifeer arterieel vaatlijden in stadium 2 Fontaine.
      Deze zorg omvat voor de verzekerden van achttien jaar of ouder ten hoogste zevenendertig behandelingen gedurende
      maximaal twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.6
  - number: 2.6.5
    text: |-
      Fysiotherapie omvat tevens gesuperviseerde oefentherapie bij artrose van heup- of kniegewricht. Deze zorg omvat
      voor de verzekerden van achttien jaar of ouder ten hoogste twaalf behandelingen gedurende maximaal twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.6
  - number: 2.6.6
    text: |-
      Fysiotherapie of oefentherapie omvat voor verzekerden van achttien jaar of ouder tevens gesuperviseerde
      oefentherapie bij chronic obstructive pulmonary disease, indien sprake is van stadium II of hoger van de GOLD
      Classificatie voor spirometrie.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.6
  - number: 2.6.7
    text: |-
      Fysiotherapie of oefentherapie omvat tevens een valpreventieve beweeginterventie voor personen met een hoog
      valrisico die als gevolg van onderliggende of bijkomende somatische of psychische problemen zijn aangewezen op
      begeleiding op het niveau van een fysiotherapeut. Deze zorg omvat ten hoogste één valpreventieve beweeginterventie
      per twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.6
  - number: 2.6.8
    text: |-
      Fysiotherapie of oefentherapie omvat voor verzekerden van achttien jaar of ouder tevens langdurige
      gepersonaliseerde gesuperviseerde actieve oefentherapie bij reumatoïde artritis of axiale spondyloartritis, indien
      de verzekerde ernstige functionele beperkingen heeft.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.6
  - number: 2.6.9
    text: |-
      Voor verzekerden jonger dan achttien jaar bestaat fysiotherapie en oefentherapie in andere gevallen dan het tweede
      lid tevens uit ten hoogste negen behandelingen van dezelfde aandoening per kalenderjaar, bij ontoereikend resultaat
      te verlengen met ten hoogste negen behandelingen.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.6
  - number: 2.6.10
    text: |-
      Logopedie omvat zorg zoals logopedisten die plegen te bieden, mits de zorg een geneeskundig doel heeft en van de
      behandeling herstel of verbetering van de spraakfunctie of het spraakvermogen kan worden verwacht.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.6
  - number: 2.6.11
    text: |-
      Ergotherapie omvat zorg zoals ergotherapeuten die plegen te bieden, mits deze als doel heeft de zelfzorg en
      de zelfredzaamheid van de verzekerde te bevorderen en te herstellen, tot een maximum van tien behandeluren per
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.6
  - number: 2.6.12
    text: |-
      Diëtetiek omvat zorg zoals diëtisten die plegen te bieden, mits de zorg een geneeskundig doel heeft, tot een
      maximum van drie behandeluren per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.6
  - number: 2.7.1
    text: |-
      Mondzorg omvat zorg zoals tandartsen die plegen te bieden, met dien verstande dat het slechts betreft
      tandheelkundige zorg die noodzakelijk is:
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.1.a
    text: |-
      indien de verzekerde een zodanige ernstige ontwikkelingsstoornis, groeistoornis of verworven afwijking van het
      tand-kaak-mondstelsel heeft dat hij zonder die zorg geen tandheelkundige functie kan behouden of verwerven,
      gelijkwaardig aan die welke hij zou hebben gehad als de aandoening zich niet zou hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.1.b
    text: |-
      indien de verzekerde een niet-tandheelkundige lichamelijke of geestelijke aandoening heeft en hij zonder die zorg
      geen tandheelkundige functie kan behouden of verwerven gelijkwaardig aan die welke hij zou hebben gehad als de
      aandoening zich niet had voorgedaan; of
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.1.c
    text: |-
      indien een medische behandeling zonder die zorg aantoonbaar onvoldoende resultaat zal hebben en de verzekerde
      zonder die andere zorg geen tandheelkundige functie kan behouden of verwerven gelijkwaardig aan die welke hij zou
      hebben gehad als de aandoening zich niet had voorgedaan.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.2
    text: |-
      Onder de zorg, bedoeld in het eerste lid, onderdeel a, is tevens begrepen het aanbrengen van een tandheelkundig
      implantaat, indien er sprake is van een zeer ernstig geslonken tandeloze kaak en deze dienen ter bevestiging van
      een uitneembare prothese.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.3
    text: |-
      Orthodontische hulp is slechts onder de zorg, bedoeld in het eerste lid, begrepen in geval van een zeer ernstige
      ontwikkelings- of groeistoornis van het tand-kaak-mondstelsel, waarbij medediagnostiek of medebehandeling van
      chirurgische tandheelkundige hulp van specialistische aard of van andere disciplines dan de tandheelkundige
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.4
    text: |-
      Mondzorg omvat voor verzekerden jonger dan achttien jaar in andere gevallen dan het eerste lid, onderdelen a tot en
      met c:
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.4.a
    text: |-
      periodiek preventief tandheelkundig onderzoek, eenmaal per jaar, tenzij de verzekerde tandheelkundig meer keren per
      jaar op die hulp is aangewezen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.4.b
    text: incidenteel tandheelkundig consult;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.4.c
    text: het verwijderen van tandsteen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.4.d
    text: |-
      fluorideapplicatie, maximaal tweemaal per jaar, tenzij de verzekerde tandheelkundig meer keren per jaar op die hulp
      is aangewezen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.4.e
    text: sealing;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.4.f
    text: parodontale hulp;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.4.g
    text: anesthesie;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.4.h
    text: endodontische hulp;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.4.i
    text: restauratie van gebitselementen met plastische materialen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.4.j
    text: gnathologische hulp;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.4.k
    text: uitneembare prothetische voorzieningen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.4.l
    text: chirurgische tandheelkundige hulp, met uitzondering het aanbrengen van tandheelkundige implantaten;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.4.m
    text: röntgenonderzoek, met uitzondering van röntgenonderzoek ten behoeve van orthodontische hulp.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.5
    text: |-
      Mondzorg omvat voor verzekerden van achttien jaar en ouder in andere gevallen dan het eerste lid, onderdelen a tot
      en met c:
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.5.a
    text: |-
      chirurgische tandheelkundige hulp van specialistische aard en het daarbij behorende röntgenonderzoek, met
      uitzondering van parodontale chirurgie, het aanbrengen van een tandheelkundig implantaat en ongecompliceerde
      extracties;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.5.b
    text: |-
      uitneembare volledige prothetische voorzieningen voor de boven- of onderkaak, al dan niet te plaatsen op
      tandheelkundige implantaten. Tot een uitneembare volledige prothetische voorziening te plaatsen op tandheelkundige
      implantaten, behoort eveneens het aanbrengen van het vaste gedeelte van de suprastructuur.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.7.6
    text: |-
      Mondzorg omvat voor verzekerden jonger dan drieëntwintig jaar in andere gevallen dan het eerste lid, onderdelen
      a tot en met c, tandvervangende hulp met niet-plastische materialen alsmede het aanbrengen van tandheelkundige
      implantaten, indien het de vervanging van een of meer ontbrekende, blijvende snij- of hoektanden betreft die in
      het geheel niet zijn aangelegd, dan wel omdat het ontbreken van die tand of die tanden het directe gevolg is van
      een ongeval, en indien de noodzaak van deze zorg is vastgesteld voordat de verzekerde de leeftijd van achttien jaar
      heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.7
  - number: 2.8.1
    text: |-
      Farmaceutische zorg omvat terhandstelling van of advies en begeleiding zoals apothekers die plegen te bieden ten
      behoeve van medicatiebeoordeling en verantwoord gebruik van:
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
  - number: 2.8.1.a
    text: |-
      de bij ministeriële regeling aangewezen geregistreerde geneesmiddelen voor zover deze zijn aangewezen door de
      zorgverzekeraar;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
  - number: 2.8.1.b
    text: 'mits het rationele farmacotherapie betreft, geneesmiddelen als bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
  - number: 2.8.1.b.1°
    text: |-
      [artikel 40, derde lid, onder a, van de Geneesmiddelenwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
  - number: 2.8.1.b.2°
    text: |-
      [artikel 40, derde lid, onder c, van de Geneesmiddelenwet][ref1], die in Nederland zijn bereid door een fabrikant
      als bedoeld in [artikel 1, eerste lid, onder mm, van die wet][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '1'
  - number: 2.8.1.b.3°
    text: |-
      [artikel 40, derde lid, onder c, van de Geneesmiddelenwet][ref1], die in de handel zijn in een andere lidstaat of
      in een derde land en binnen het grondgebied van Nederland worden gebracht en bestemd zijn voor een patiënt van hem
      die aan een ziekte lijdt die in Nederland niet vaker voorkomt dan bij 1 op de 150.000 inwoners,


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
  - number: 2.8.1.b.4°
    text: |-
      [artikel 40, derde lid, onder c, van de Geneesmiddelenwet][ref1], die in de handel zijn in een andere lidstaat
      van de Europese Unie of in een derde land en binnen het grondgebied van Nederland zijn gebracht, indien het
      geneesmiddel dient ter vervanging van een geregistreerd geneesmiddel als bedoeld onder a dat tijdelijk niet
      of niet in voldoende aantallen afgeleverd kan worden door de houder of houders van de handelsvergunning of
      parallelhandelsvergunning, verleend krachtens de [Geneesmiddelenwet][ref2] dan wel krachtens de verordening,
      bedoeld in [artikel 1, eerste lid, onder fff, van die wet][ref3], of


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0021505
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0021505
      - id: ref3
        bwb_id: BWBR0021505
        artikel: '1'
  - number: 2.8.1.b.5°
    text: |-
      [artikel 52, eerste lid, van de Geneesmiddelenwet][ref1], indien het geneesmiddel dient ter vervanging
      van een geregistreerd geneesmiddel als bedoeld onder a dat tijdelijk niet of niet in voldoende aantallen
      afgeleverd kan worden door de houder of houders van de handelsvergunning of parallelhandelsvergunning,
      verleend krachtens de [Geneesmiddelenwet][ref2] dan wel krachtens de verordening, bedoeld in
      [artikel 1, eerste lid, onder fff, van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0021505
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0021505
      - id: ref3
        bwb_id: BWBR0021505
        artikel: '1'
  - number: 2.8.1.c
    text: polymere, oligomere, monomere en modulaire dieetpreparaten.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
  - number: 2.8.2
    text: 'Farmaceutische zorg omvat geen:'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
  - number: 2.8.2.a
    text: farmaceutische zorg in bij ministeriële regeling aangegeven gevallen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
  - number: 2.8.2.b
    text: geneesmiddelen in geval van ziekterisico bij reizen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
  - number: 2.8.2.c
    text: |-
      geneesmiddelen voor onderzoek als bedoeld in [artikel 40, derde lid, onder b, van de Geneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
  - number: 2.8.2.d
    text: |-
      geneesmiddelen die gelijkwaardig of nagenoeg gelijkwaardig zijn aan enig niet aangewezen, geregistreerd
      geneesmiddel, tenzij bij ministeriële regeling anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
  - number: 2.8.2.e
    text: |-
      geneesmiddelen als bedoeld in [artikel 40, derde lid, onder f, van de Geneesmiddelenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
  - number: 2.8.3
    text: |-
      De aanwijzing door de zorgverzekeraar geschiedt zodanig dat van alle werkzame stoffen die voorkomen in de bij
      ministeriële regeling aangewezen geneesmiddelen ten minste een geneesmiddel voor de verzekerde beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
  - number: 2.8.4
    text: |-
      Farmaceutische zorg omvat ook een ander bij ministeriële regeling aangewezen geneesmiddel dan het door de
      zorgverzekeraar aangewezen geneesmiddel, voor zover behandeling met het door de zorgverzekeraar aangewezen
      geneesmiddel voor de verzekerde medisch niet verantwoord is.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
  - number: 2.8.5
    text: |-
      Bij de ministeriële regeling, bedoeld in het eerste lid, onderdeel a, worden de aangewezen geneesmiddelen zoveel
      mogelijk ingedeeld in groepen van onderling vervangbare geneesmiddelen. In die ministeriële regeling wordt tevens
      de aanvraagprocedure voor de aanwijzing geregeld, worden regels gesteld met betrekking tot de systematiek van
      de indeling in groepen van onderling vervangbare geneesmiddelen en worden regels gesteld met betrekking tot de
      vaststelling van een vergoedingslimiet voor elke groep van onderling vervangbare geneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
  - number: 2.8.6
    text: |-
      In afwijking van het vijfde lid kan bij ministeriële regeling worden bepaald dat voor bij die regeling aangewezen
      groepen van onderling vervangbare geneesmiddelen de vergoedinglimiet kan worden herberekend of buiten werking kan
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Hulpmiddelenzorg omvat bij ministeriële regeling aangewezen, functionerende hulpmiddelen en verbandmiddelen,
      waarbij kan worden geregeld:
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.9
  - number: 2.9.1.a
    text: in welke gevallen de verzekerde recht heeft op die zorg;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.9
  - number: 2.9.1.b
    text: vergoeding van bij die regeling aangewezen kosten in verband met thuisdialyse.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.9
  - number: 2.9.2
    text: |-
      De kosten van normaal gebruik van hulpmiddelen komen, tenzij bij ministeriële regeling anders is bepaald, voor
      rekening van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.9
  - number: '2.10'
    text: 'Verpleging en verzorging omvat zorg zoals verpleegkundigen die plegen te bieden, waarbij die zorg:'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.10
  - number: 2.10.a
    text: |-
      verband houdt met de behoefte aan de geneeskundige zorg, bedoeld in [artikel 2.4][ref1], of een hoog risico daarop,


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.10.b
    text: |-
      niet gepaard gaat met verblijf als bedoeld in [artikel 2.12][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.10.c
    text: |-
      geen kraamzorg als bedoeld in [artikel 2.11][ref1] betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.11'
    text: |-
      Kraamzorg omvat zorg zoals kraamverzorgenden die plegen te bieden aan moeder en kind in verband met een bevalling,
      gedurende ten hoogste zes weken, te rekenen vanaf de dag van bevalling.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.11
  - number: 2.12.1
    text: |-
      Verblijf omvat verblijf gedurende een onafgebroken periode van ten hoogste 1.095 dagen, dat medisch noodzakelijk
      is in verband met de geneeskundige zorg, bedoeld in [artikel 2.4][ref1], of in verband met chirurgische
      tandheelkundige hulp van specialistische aard als bedoeld in [artikel 2.7][ref2], al dan niet gepaard gaande met
      verpleging, verzorging of paramedische zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.12.2
    text: |-
      Een onderbreking van ten hoogste dertig dagen wordt niet als onderbreking beschouwd, maar deze dagen tellen niet
      mee voor de berekening van de 1.095 dagen.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.12
  - number: 2.12.3
    text: |-
      In afwijking van het tweede lid tellen onderbrekingen wegens weekend- en vakantieverlof mee voor de berekening van
      de 1.095 dagen.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.12
  - number: 2.12.4
    text: |-
      De vergoeding voor verblijf als bedoeld in het eerste lid dat noodzakelijk is in verband met geneeskundige zorg
      zoals medisch specialisten die plegen te bieden en dat niet gepaard gaat met verpleging, verzorging of paramedische
      zorg bedraagt een bij ministeriële regeling te bepalen bedrag.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.12
  - number: 2.13.1
    text: |-
      Vervoer omvat ziekenvervoer per motorvoertuig als bedoeld in
      [artikel 1, eerste lid, van de Wet ambulancezorgvoorzieningen][ref1], van de verzekerde over een afstand van
      maximaal 200 kilometer:


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel1
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '1'
  - number: 2.13.1.a
    text: |-
      naar een persoon bij wie of een instelling waarin hij zorg zal ontvangen waarvan de kosten geheel of gedeeltelijk
      ten laste van de zorgverzekering komen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.13
  - number: 2.13.1.b
    text: |-
      naar een instelling waarin hij geheel of gedeeltelijk ten laste van de verzekering als bedoeld in de
      [Wet langdurige zorg][ref1] zal gaan verblijven;


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: 2.13.1.c
    text: |-
      naar een persoon bij wie of een instelling waarin een verzekerde jonger dan achttien jaar geestelijke
      gezondheidszorg zal ontvangen waarvan de kosten geheel of gedeeltelijk ten laste komen van het krachtens de
      [Jeugdwet][ref1] verantwoordelijke college van burgemeester en wethouders;


      [ref1]: https://wetten.overheid.nl/BWBR0034925
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0034925
  - number: 2.13.1.d
    text: 'vanuit een instelling, bedoeld in onderdeel b, naar:'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.13
  - number: 2.13.1.d.1°
    text: |-
      een persoon bij wie of een instelling waarin hij geheel of gedeeltelijk ten laste van de verzekering als bedoeld in
      de [Wet langdurige zorg][ref1] een onderzoek of een behandeling zal ondergaan;


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: 2.13.1.d.2°
    text: |-
      een persoon of instelling voor het aanmeten en passen van een prothese die geheel of gedeeltelijk ten laste van de
      verzekering als bedoeld in de [Wet langdurige zorg][ref1] wordt verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: 2.13.1.e
    text: |-
      naar zijn woning of een andere woning, indien hij in zijn woning redelijkerwijs niet de nodige verzorging kan
      krijgen, indien hij komt van een van de personen of instellingen, bedoeld in de onderdelen a tot en met d.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.13
  - number: 2.13.2
    text: |-
      Indien de zorgverzekeraar een verzekerde toestemming geeft zich te wenden tot een bepaalde persoon of instelling,
      geldt de beperking van 200 kilometer niet.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.13
  - number: 2.14.1
    text: |-
      Het vervoer omvat tevens ziekenvervoer per auto, anders dan per motorvoertuig als bedoeld in
      [artikel 1, eerste lid, van de Wet ambulancezorgvoorzieningen][ref1], dan wel uit vervoer in de
      laagste klasse van een openbaar middel van vervoer van en naar een persoon of instelling als bedoeld in
      [artikel 2.13, eerste lid, onderdelen a, b of d][ref2], of een woning als bedoeld in artikel 2.13, eerste lid,
      onderdeel e, over een enkele reisafstand van maximaal 200 kilometer voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.14.1.a
    text: de verzekerde nierdialyses moet ondergaan;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.14
  - number: 2.14.1.b
    text: de verzekerde oncologische behandelingen met chemotherapie, immuuntherapie of radiotherapie moet ondergaan;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.14
  - number: 2.14.1.c
    text: de verzekerde zich uitsluitend met een rolstoel kan verplaatsen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.14
  - number: 2.14.1.d
    text: het gezichtsvermogen van de verzekerde zodanig is beperkt dat hij zich niet zonder begeleiding kan verplaatsen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.14
  - number: 2.14.1.e
    text: |-
      de verzekerde jonger is dan achttien jaar en vanwege complexe somatische problematiek of vanwege een lichamelijke
      handicap is aangewezen op verpleging en verzorging, waarbij sprake is van de behoefte aan permanent toezicht of aan
      de beschikbaarheid van vierentwintig uur per dag van zorg in de nabijheid;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.14
  - number: 2.14.1.f
    text: |-
      de verzekerde is aangewezen op geriatrische revalidatie als bedoeld in [artikel 2.5c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.14.1.g
    text: |-
      de verzekerde is aangewezen op dagbehandeling die in een groep wordt verleend en die onderdeel is van een
      zorgprogramma bij chronisch progressieve degeneratieve aandoeningen, niet-aangeboren hersenletsel of in verband met
      een verstandelijke beperking.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.14
  - number: 2.14.2
    text: |-
      Indien het vervoer, bedoeld in het eerste lid, vervoer met een particuliere auto betreft, bedraagt de vergoeding
      een bij ministeriële regeling te bepalen bedrag per kilometer.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.14
  - number: 2.14.3
    text: |-
      In afwijking van het eerste lid, onderdelen a tot en met e, omvat vervoer ook vervoer in andere gevallen, indien
      de verzekerde in verband met de behandeling van een langdurige ziekte of aandoening langdurig is aangewezen op
      vervoer en het niet verstrekken of vergoeden van dat vervoer voor de verzekerde zal leiden tot een onbillijkheid
      van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.14
  - number: 2.14.4
    text: |-
      Indien de zorgverzekeraar een verzekerde toestemming geeft zich te wenden tot een bepaalde persoon of instelling,
      geldt de beperking van 200 kilometer niet.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.14
  - number: 2.14.5
    text: |-
      Het vervoer, bedoeld in het eerste lid, onderdelen a en b, en het derde lid, omvat mede het vervoer naar consulten,
      onderzoek en controles die als onderdeel van de behandeling noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.14
  - number: 2.14.6
    text: |-
      Indien een verzekerde is aangewezen op vervoer als bedoeld in het eerste of derde lid, en dit vervoer op tenminste
      drie achtereenvolgende dagen nodig is, kan de zorgverzekeraar op verzoek van de verzekerde een bij ministeriële
      regeling te bepalen vergoeding voor kosten van logeren verstrekken die gedeeltelijk in de plaats komt van een
      vergoeding voor kosten van vervoer.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.14
  - number: 2.15.1
    text: |-
      De zorgverzekeraar kan toestaan dat het ziekenvervoer plaatsvindt met een ander door
      de zorgverzekeraar aan te geven vervoermiddel dan een motorvoertuig als bedoeld in
      [artikel 1, eerste lid, van de Wet ambulancezorgvoorzieningen][ref1], auto of openbaar middel van vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel1
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '1'
  - number: 2.15.2
    text: |-
      Het ziekenvervoer omvat tevens vervoer van een begeleider, indien begeleiding noodzakelijk is, of indien het
      betreft begeleiding van kinderen beneden zestien jaar. In bijzondere gevallen kan de zorgverzekeraar vervoer van
      twee begeleiders toestaan.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15
  - number: 2.15a.1
    text: |-
      Met het Zvw-pgb kan worden vergoed verpleging en verzorging als bedoeld in [artikel 2.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15a
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.15a.2
    text: |-
      De zorgverzekeraar kan in zijn modelovereenkomst opnemen dat met het Zvw-pgb tevens kan worden vergoed verblijf
      als bedoeld in [artikel 2.12][ref1] voor zover gepaard gaande met verpleging en verzorging voor verzekerden tot
      achttien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15a
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.15b
    text: |-
      Tenzij het zorg betreft waarop de [artikelen 50 tot en met 56 van de Wet marktordening gezondheidszorg][ref1]
      van toepassing zijn, kunnen bij ministeriële regeling bedragen worden vastgesteld die ten hoogste met een Zvw-pgb
      worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15b
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
  - number: 2.15c.1
    text: |-
      Onverminderd andere bij wettelijk voorschrift gestelde voorwaarden of beperkingen alsmede in de zorgverzekering
      opgenomen voorwaarden wordt een Zvw-pgb verstrekt indien:
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15c
  - number: 2.15c.1.a
    text: |-
      de verzekerde naar het oordeel van de zorgverzekeraar in staat is te achten met het Zvw-pgb op doelmatige wijze te
      voorzien in toereikende zorg of andere diensten van goede kwaliteit,
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15c
  - number: 2.15c.1.b
    text: |-
      de verzekerde naar het oordeel van de zorgverzekeraar in staat is te achten op eigen kracht of met hulp van een
      vertegenwoordiger, de aan het Zvw-pgb verbonden taken en verplichtingen op verantwoorde wijze uit te voeren,
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15c
  - number: 2.15c.1.c
    text: |-
      de verzekerde naar het oordeel van de zorgverzekeraar in staat is te achten op eigen kracht of met hulp van een
      vertegenwoordiger, de door hem verkozen zorgaanbieders op zodanige wijze aan te sturen en hun werkzaamheden op
      elkaar af te stemmen, dat sprake is of zal zijn van verantwoorde zorg en
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15c
  - number: 2.15c.1.d
    text: |-
      de verzekerde naar het oordeel van de zorgverzekeraar in staat is op eigen kracht of met hulp van een
      vertegenwoordiger te motiveren dat hij de zorg met een Zvw-pgb geleverd wil en kan krijgen.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15c
  - number: 2.15c.2
    text: |-
      Onverminderd andere bij wettelijk voorschrift gestelde voorwaarden of beperkingen alsmede in de zorgverzekering
      opgenomen voorwaarden wordt het Zvw-pgb geweigerd indien:
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15c
  - number: 2.15c.2.a
    text: |-
      de verzekerde bij de eerdere verstrekking van een Zvw-pgb niet in staat is gebleken zich op eigen kracht of met
      hulp van een vertegenwoordiger te houden aan de aan het Zvw-pgb verbonden taken en verplichtingen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15c
  - number: 2.15c.2.b
    text: de verzekerde blijkens de basisregistratie personen niet beschikt over een woonadres;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15c
  - number: 2.15c.2.c
    text: de verzekerde rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15c
  - number: 2.15c.2.d
    text: |-
      de vertegenwoordiger van de verzekerde niet voldoet aan regels inhoudende beperkingen of eisen die bij ministeriële
      regeling aan de kring van vertegenwoordigers kunnen worden gesteld in het belang van de bescherming van de
      verzekerde of van het waarborgen van de hulp, bedoeld in het eerste lid, onderdeel b, c en d.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15c
  - number: 2.15c.3
    text: |-
      De zorgverzekeraar neemt in zijn modelovereenkomst geen andere voorwaarden en weigeringsgronden op ten aanzien van
      de persoon van de verzekerde of zijn vertegenwoordiger dan vermeld in het eerste, tweede en vierde lid.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15c
  - number: 2.15c.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de voorwaarden en
      weigeringsgronden ten aanzien van de persoon van de verzekerde of zijn vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.15c
  - number: 2.16a
    text: |-
      De verzekerde van achttien jaar of ouder betaalt een eigen bijdrage voor mondzorg, bedoeld in
      [artikel 2.7, eerste en vijfde lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.16a
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.16b.1
    text: |-
      De verzekerde betaalt een eigen bijdrage voor een geneesmiddel als bedoeld in [artikel 2.8, eerste lid][ref1],
      dat is ingedeeld in een groep van onderling vervangbare geneesmiddelen, indien de inkoopprijs hoger is dan de
      vergoedingslimiet. Een eigen bijdrage wordt ook betaald voor zover een geneesmiddel is bereid uit een geneesmiddel
      waarvoor een eigen bijdrage is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.16b
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.16b.2
    text: Bij ministeriële regeling wordt geregeld hoe de eigen bijdrage wordt berekend.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.16b
  - number: 2.16c
    text: |-
      De verzekerde betaalt voor een bij ministeriële regeling aan te wijzen hulpmiddel als bedoeld in
      [artikel 2.9][ref1] een eigen bijdrage ter grootte van:


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.16c
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.16c.a
    text: een daarbij vermeld bedrag wegens besparing van kosten,
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.16c
  - number: 2.16c.b
    text: |-
      het verschil tussen de aanschaffingskosten en het bij dat hulpmiddel vermelde bedrag, dat kan verschillen naar
      gelang de groep van verzekerden, waartoe de verzekerde behoort, of
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.16c
  - number: 2.16c.c
    text: |-
      een bij die regeling te bepalen percentage van de kosten van het hulpmiddel, dat kan verschillen voor verzekerden
      tot achttien jaar en verzekerden van achttien jaar of ouder.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.16c
  - number: 2.16d.1
    text: |-
      De verzekerde betaalt voor kraamzorg als bedoeld in [artikel 2.11][ref1] een eigen bijdrage per uur, indien het
      betreft zorg ten huize van de verzekerde.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.16d
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.16d.2
    text: |-
      De verzekerde en haar kind betalen ieder voor kraamzorg als bedoeld in [artikel 2.11][ref1], voor zover die
      verleend wordt in een instelling zonder dat verblijf in de instelling medisch noodzakelijk is, een eigen bijdrage
      per dag, vermeerderd met een bij ministeriële regeling te bepalen bedrag waarmee het tarief van de instelling per
      dag te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.16d
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.16e.1
    text: |-
      De verzekerde is voor ziekenvervoer, anders dan per motorvoertuig als bedoeld in
      [artikel 1, eerste lid, van de Wet ambulancezorgvoorzieningen][ref1], een eigen bijdrage per kalenderjaar
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel1
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.16e
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '1'
  - number: 2.16e.2
    text: Bij ministeriële regeling kan worden bepaald in welke situaties de eigen bijdrage niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.16e
  - number: 2.16f
    text: |-
      Bij ministeriële regeling wordt de hoogte van de eigen bijdragen, bedoeld in de [artikelen 2.16a][ref1] en
      [2.16c tot en met 2.16e][ref2], vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.16f
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 1b
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 1b
  - number: 2.17.1
    text: |-
      Kosten van het gebruik van zorg en overige diensten die buiten het verplicht eigen risico vallen, betreffen kosten
      van:
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
  - number: 2.17.1.a
    text: verloskundige zorg en kraamzorg,
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
  - number: 2.17.1.b
    text: de niet-invasieve prenatale test,
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
  - number: 2.17.1.c
    text: huisartsenzorg,
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
  - number: 2.17.1.d
    text: multidisciplinaire eerstelijnszorg waar huisartsenzorg deel van uitmaakt,
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
  - number: 2.17.1.e
    text: |-
      advies van een zorgverlener indien de huisarts dit heeft gevraagd teneinde de patiënt een passende diagnose,
      behandeling of doorverwijzing te kunnen bieden,
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
  - number: 2.17.1.f
    text: gecombineerde leefstijlinterventie,
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
  - number: 2.17.1.g
    text: |-
      de zorg waarop ingevolge dit hoofdstuk aanspraak bestaat aan de donor nadat de periode, bedoeld in
      [artikel 2.5, eerste lid, onderdeel d][ref1], is verstreken, voor zover die zorg verband houdt met de opneming,
      bedoeld in artikel 2.5, eerste lid, onderdeel d,


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.17.1.h
    text: |-
      vervoer, bedoeld in [artikel 2.5, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.17.1.i
    text: |-
      verpleging en verzorging als bedoeld in [artikel 2.10][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.17.1.j
    text: |-
      niet specifiek op individuele verzekerden gerichte samenwerking tussen aanbieders of tussen aanbieders en derden,
      voor zover dat samenwerken direct ten dienste staat van de levering van zorg of overige diensten als bedoeld in
      paragraaf 1.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
  - number: 2.17.2
    text: |-
      De zorgverzekeraar kan bepalen dat kosten van het gebruik van zorg en overige diensten als bedoeld in
      [artikel 11 van de wet][ref1] geheel of gedeeltelijk buiten het verplicht eigen risico vallen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
  - number: 2.17.2.a
    text: de verzekerde gebruik maakt van een door de zorgverzekeraar aangewezen zorgaanbieder,
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
  - number: 2.17.2.b
    text: |-
      de verzekerde een bij ministeriële regeling aangewezen gezondheidsbevorderend of op preventie gericht programma
      volgt, voor zover dat programma is aangewezen door de zorgverzekeraar en de kosten betrekking hebben op de
      aandoening waarvoor de verzekerde dat programma heeft gevolgd, of
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
  - number: 2.17.2.c
    text: de verzekerde gebruik maakt van door de zorgverzekeraar aangewezen farmaceutische zorg of hulpmiddel.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
  - number: 2.17.3
    text: |-
      De dag, bedoeld in [artikel 19, vierde lid, van de wet][ref1], is 31 december.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel19
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '19'
  - number: 2.18.1
    text: |-
      De kosten van inschrijving bij een huisarts of bij een instelling die huisartsenzorg verleent, vallen buiten het
      vrijwillig eigen risico.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.18
  - number: 2.18.2
    text: 'Onder kosten van inschrijving worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.18
  - number: 2.18.2.a
    text: |-
      een bedrag ter zake van de inschrijving als patiënt, tot ten hoogste het tarief dat op grond van de
      [Wet marktordening gezondheidszorg][ref1] als beschikbaarheidstarief is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: 2.18.2.b
    text: |-
      vergoedingen die samenhangen met de wijze waarop de geneeskundige zorg in de praktijk van de huisarts of in de
      instelling wordt verleend, met de kenmerken van het patiëntenbestand of met de locatie van de praktijk of de
      instelling, voor zover deze vergoedingen tussen de zorgverzekeraar van de verzekerde en zijn huisarts of instelling
      zijn overeengekomen en de huisarts of instelling deze vergoedingen krachtens eerderbedoelde overeenkomst bij de
      inschrijving van een verzekerde in rekening mag brengen.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.18
  - number: 2.18.3
    text: |-
      Kosten als bedoeld in [artikel 2.17, aanhef en onderdeel j][ref1], vallen buiten het vrijwillig eigen risico.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '2.19'
    text: |-
      Het percentage, bedoeld in [artikel 21, eerste lid, van de wet][ref1], bedraagt 100.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel21
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '21'
  - number: 3.1.1
    text: 'Het macro-prestatiebedrag is de som van de volgende macro-deelbedragen:'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.1
  - number: 3.1.1.a
    text: het macro-deelbedrag variabele zorgkosten;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.1
  - number: 3.1.1.b
    text: het macro-deelbedrag vaste zorgkosten;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.1
  - number: 3.1.1.c
    text: het macro-deelbedrag kosten van geneeskundige geestelijke gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Tot het macro-prestatiebedrag of de macro-deelbedragen behoren niet de kosten van zorg of andere verzekerde
      diensten die noodzakelijk zijn geworden ten gevolge van een terroristische handeling.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.1
  - number: 3.1.3
    text: |-
      De hoogte van het macro-prestatiebedrag en van de macro-deelbedragen voor een vereveningsjaar worden jaarlijks voor
      1 oktober van het daaraan voorafgaande jaar bij ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.1
  - number: 3.2.1
    text: |-
      De hoogte van de totale opbrengst van de nominale rekenpremie voor een vereveningsjaar wordt jaarlijks voor 1
      oktober van het daaraan voorafgaande jaar bij ministeriële regeling geraamd.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.2
  - number: 3.2.2
    text: |-
      De hoogte van de totale opbrengst van het verplicht eigen risico voor een vereveningsjaar wordt jaarlijks voor 1
      oktober van het daaraan voorafgaande jaar bij ministeriële regeling geraamd.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      Het Zorginstituut verdeelt de in [artikel 3.1][ref1] genoemde macro-deelbedragen op de bij en krachtens de
      [artikelen 3.4 tot en met 3.8][ref2] bepaalde wijze in deelbedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.4.1
    text: |-
      Het Zorginstituut verdeelt het macro-deelbedrag variabele zorgkosten aan de hand van de verzekerdenaantallen per
      zorgverzekeraar, verdeeld naar leeftijd en geslacht, HKG’s, FKG’s, DKG’s, AVI, SES, MHK, regio, PPA, FDG, MVV, IBZ,
      HSM en SEI.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.4
  - number: 3.4.2
    text: Onze Minister kent aan alle klassen van de genoemde criteria gewichten toe.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.4
  - number: 3.4.3
    text: |-
      De klassen, bedoeld in het eerste lid, en de gewichten, bedoeld in het tweede lid, worden jaarlijks bij
      ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.4
  - number: 3.4.4
    text: |-
      In afwijking van het eerste lid verdeelt het Zorginstituut voor het vereveningsjaar 2023 het macro-deelbedrag
      variabele zorgkosten voor het vereveningsjaar 2023 aan de hand van de verzekerdenaantallen per zorgverzekeraar,
      verdeeld naar leeftijd en geslacht, HKG’s, FKG’s, DKG’s, AVI, SES, MHK, regio, PPA, FDG, MVV, MFK, HSM en SEI.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      Het Zorginstituut verdeelt het macro-deelbedrag vaste zorgkosten over de zorgverzekeraars aan de hand van de
      geraamde verzekerdenaantallen voor het betreffende vereveningsjaar.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.5
  - number: 3.6.1
    text: |-
      Het Zorginstituut verdeelt het macro-deelbedrag kosten van geneeskundige geestelijke gezondheidszorg aan de hand
      van de verzekerdenaantallen per zorgverzekeraar, verdeeld naar leeftijd en geslacht, DKG’s psychische aandoeningen,
      FKG’s psychische aandoeningen, AVI, SES, PPA, GGZ-regio, GGZ-MHK en SEI.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.6
  - number: 3.6.2
    text: Onze Minister kent aan alle klassen van de genoemde criteria gewichten toe.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.6
  - number: 3.6.3
    text: |-
      De klassen, bedoeld in het eerste lid, en de gewichten, bedoeld in het tweede lid, worden jaarlijks bij
      ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.6
  - number: 3.8.1
    text: |-
      In afwijking van de [artikelen 3.4][ref1] en [3.6][ref2] worden verzekerden die in het buitenland wonen:


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.8.1.a
    text: |-
      ingedeeld in de klassen «Geen FKG», «Geen FKG psychische aandoeningen», «Geen HKG», «Geen DKG», «Geen DKG
      psychische aandoeningen», «Geen FDG», «Geen HSM»;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.8
  - number: 3.8.1.b
    text: niet ingedeeld bij de criteria regio, GGZ-regio, SES en PPA;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.8
  - number: 3.8.1.c
    text: voor het vereveningsjaar 2023 ingedeeld in de klasse «Geen MFK».
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.8
  - number: 3.8.2
    text: |-
      De bij de klassen, bedoeld in het eerste lid, behorende gewichten voor de verzekerden, bedoeld in het eerste lid,
      worden op bij ministeriële regeling bepaalde wijze door het Zorginstituut vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.8
  - number: '3.9'
    text: |-
      Het Zorginstituut sommeert de ingevolge de [artikelen 3.3 tot en met 3.8][ref1] aan een zorgverzekeraar
      toegerekende deelbedragen tot één normatief bedrag per zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.10.1
    text: |-
      Het Zorginstituut brengt vervolgens op het normatieve bedrag, bedoeld in [artikel 3.9][ref1], in mindering de voor
      de zorgverzekeraar geraamde opbrengst van de nominale rekenpremie en de voor de zorgverzekeraar geraamde opbrengst
      van het verplicht eigen risico.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.10.2
    text: |-
      De raming van de opbrengst van de nominale rekenpremie en van het verplicht eigen risico vindt plaats op een bij
      ministeriële regeling te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.10
  - number: 3.10.3
    text: |-
      Het Zorginstituut kent aan de zorgverzekeraar een vereveningsbijdrage toe ter hoogte van de uitkomst van de
      berekening, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.10
  - number: 3.10.4
    text: |-
      Het Zorginstituut deelt aan de zorgverzekeraar het berekende normatieve bedrag, bedoeld in [artikel 3.9][ref1], en
      de toegekende vereveningsbijdrage, bedoeld in het derde lid, mee en geeft hierbij aan welke bedragen, bedoeld in
      het eerste lid, bij de toekenning van de vereveningsbijdrage zijn betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.10a
    text: |-
      Het Zorginstituut kan het normatieve bedrag, bedoeld in [artikel 3.9][ref1], en de toegekende vereveningsbijdrage,
      bedoeld in [artikel 3.10][ref2], in het vereveningsjaar herzien op basis van de werkelijke verzekerdenaantallen.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.10a
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.11.1
    text: |-
      Na het vereveningsjaar herberekent het Zorginstituut de deelbedragen, bedoeld in de [artikelen 3.4][ref1] en
      [3.6][ref2], op de bij en krachtens dit artikel en de [artikelen 3.12 tot en met 3.14][ref3] en [3.16][ref4]
      bepaalde wijze. Voor wat betreft het vereveningsjaar 2023 herberekent het Zorginstituut de deelbedragen, bedoeld
      in de artikelen 3.4 en 3.6, op de bij en krachtens dit artikel en de artikelen 3.12 tot en met 3.14, 3.16 en
      [3.17][ref5] bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.11.2
    text: |-
      Met inachtneming van het bepaalde bij en krachtens de [artikelen 3.13][ref1], [3.14][ref2] en
      [3.15, eerste lid][ref3], bepaalt het Zorginstituut de over het vereveningsjaar gerealiseerde kosten per cluster
      van prestaties voor alle zorgverzekeraars tezamen.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.11.3
    text: 'Tot de gerealiseerde kosten behoren niet:'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.11
  - number: 3.11.3.a
    text: |-
      kosten ten gevolge van een catastrofe als bedoeld in [artikel 33, eerste lid, onderdeel a, van de wet][ref1], in
      het catastrofejaar, bedoeld in artikel 33, eerste lid, onderdeel b van de wet en het daaropvolgende kalenderjaar,
      anders dan toeslagen voor onderdekking van doorlopende kosten als gevolg van die catastrofe;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel33
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '33'
  - number: 3.11.3.b
    text: |-
      kosten waarvoor bijdragen als bedoeld in [artikel 3.23][ref1] zijn verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.11.3.c
    text: de als zodanig bij ministeriële regeling aangewezen voor rekening van de verzekerden gekomen kosten; en
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.11
  - number: 3.11.3.d
    text: de als zodanig bij ministeriële regeling aangewezen rentekosten.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.11
  - number: 3.11.4
    text: |-
      Het Zorginstituut corrigeert de geraamde kosten per cluster van prestaties voor het werkelijke aantal verzekerden
      in het vereveningsjaar, hun werkelijke verzekerdenkenmerken en de krachtens het vijfde lid bepaalde gewichten.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.11
  - number: 3.11.5
    text: |-
      Bij ministeriële regeling worden ten behoeve van de herberekening, bedoeld in het eerste lid, regels gesteld over
      de wijze van vaststelling van de werkelijke verzekerdenkenmerken, bedoeld in het vierde lid en de bepaling van
      gewichten die worden toegekend aan klassen van de in [paragraaf 1.2][ref1] van dit hoofdstuk genoemde criteria.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0018492
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.11.6
    text: |-
      Bij ministeriële regeling wordt bepaald in welke mate een verzekerde die niet gedurende het gehele vereveningsjaar
      bij een zorgverzekeraar verzekerd is of die gedurende het vereveningsjaar bij meerdere zorgverzekeraars tegelijk
      verzekerd is, voor de vaststelling van de vereveningsbijdrage meetelt.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.11
  - number: 3.12.1
    text: |-
      Ten behoeve van de herberekening, bedoeld in [artikel 3.11, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.12.1.a
    text: |-
      corrigeert het Zorginstituut de deelbedragen, bedoeld in de [artikelen 3.4][ref1] en [3.6][ref2], voor het
      werkelijke aantal verzekerden van de zorgverzekeraar, hun werkelijke verzekerdenkenmerken en de gewichten toegekend
      aan klassen van toepasselijke criteria, en


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
