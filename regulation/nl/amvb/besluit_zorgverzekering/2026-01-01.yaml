  - number: 3.12b.4
    text: |-
      Het Zorginstituut verlaagt het na toepassing van [artikel 3.12][ref1] resulterende deelbedrag voor het cluster
      «variabele zorgkosten» op een bij ministeriële regeling bepaalde wijze ter bekostiging van de toe te passen
      hogekostencompensatie.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.12b
