      resulterende deelbedrag voor het cluster «variabele zorgkosten» op een bij de ministeriële regeling bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.12b
    references:
