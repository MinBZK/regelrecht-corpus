  - number: 3.12a.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het Zorginstituut op de gerealiseerde kosten van geneeskundige
      geestelijke gezondheidszorg van een verzekerde hogekostencompensatie toepast.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.12a
  - number: 3.12a.2
    text: |-
      De hogekostencompensatie betreft een bij regeling, bedoeld in het eerste lid, vastgesteld percentage van de
      gerealiseerde kosten van de verzekerde die de daarvoor op grond van die regeling geldende drempelwaarde, te boven
      gaan.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.12a
  - number: 3.12a.3
    text: |-
      De gerealiseerde kosten van een verzekerde in verband met een catastrofe als bedoeld in
      [artikel 33, eerste lid, onderdeel a, van de wet][ref1] in een catastrofejaar als bedoeld in onderdeel b van dat
      lid en het daaropvolgende kalenderjaar blijven bij de toepassing door het Zorginstituut van hogekostencompensatie
      buiten aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel33
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.12a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '33'
  - number: 3.12a.4
    text: |-
      Het Zorginstituut verlaagt het na toepassing van [artikel 3.12][ref1] resulterende deelbedrag voor het cluster
      «kosten van geneeskundige geestelijke gezondheidszorg» op een bij de ministeriële regeling, bedoeld in het eerste
      lid, bepaalde wijze, ter bekostiging van de toe te passen hogekostencompensatie.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.12a
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.12a.5
    text: |-
      Het Zorginstituut past vervolgens de hogekostencompensatie toe op het na toepassing van [artikel 3.12][ref1]
      resulterende deelbedrag voor het cluster «kosten van geneeskundige geestelijke gezondheidszorg» op een bij de
      ministeriële regeling, bedoeld in het eerste lid, bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.12a
    references:
      - id: ref1
