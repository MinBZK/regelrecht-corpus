  - number: '3.13'
    text: |-
      Voor zover deze onder een zorgverzekering worden gedekt, deelt het Zorginstituut bij ministeriële regeling te
      bepalen soorten kosten van zorg en overige diensten die niet zonder meer aan een bepaalde kostencategorie kunnen
      worden toegedeeld, overeenkomstig een bij die regeling te bepalen verdeelsleutel toe aan de variabele zorgkosten,
      de vaste zorgkosten of de kosten van geneeskundige geestelijke gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.13
  - number: '3.14'
    text: |-
      Het Zorginstituut merkt voor een bij ministeriële regeling te bepalen gedeelte van de verschillende geldende
      tarieven binnen de kosten van medisch-specialistische zorg, kosten aan als variabele zorgkosten.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.14
  - number: 3.15.1
    text: |-
      Het Zorginstituut merkt voor een bij ministeriële regeling te bepalen gedeelte van de verschillende geldende
      tarieven binnen de kosten van medisch-specialistische zorg, kosten aan als vaste zorgkosten.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.15
  - number: 3.15.2
    text: |-
      Het Zorginstituut herberekent het deelbedrag vaste zorgkosten aan de hand van de gerealiseerde
      verzekerdenaantallen.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.15
  - number: 3.15.3
    text: |-
      Het Zorginstituut calculeert in een bij ministeriële regeling te bepalen mate na op het verschil tussen de vaste
      zorgkosten in het betreffende jaar enerzijds, en het op grond van het tweede lid herberekende deelbedrag vaste
      zorgkosten anderzijds, leidende tot een nieuw deelbedrag per zorgverzekeraar.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.15
  - number: '3.16'
    text: |-
      Indien voor een zorgverzekeraar voor het vereveningsjaar 2023 of 2024 het verschil tussen enerzijds het na
      toepassing van [artikel 3.12a][ref1] resulterende deelbedrag voor het cluster «kosten van geneeskundige geestelijke
      gezondheidszorg», en anderzijds de gerealiseerde kosten voor dat cluster, gedeeld door het aantal bij hem in
      het vereveningsjaar ingeschreven verzekerden van achttien jaar en ouder waarop [artikel 24 van de wet][ref2]
      niet van toepassing is, meer dan € 10 afwijkt van het gemiddelde marktresultaat voor dat cluster, vermindert het
      Zorginstituut het buiten de bedoelde bandbreedte liggende deel van die afwijking met 90 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel24
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '24'
  - number: 3.17.1
    text: |-
      Voor het vereveningsjaar 2023 stelt het Zorginstituut per modelovereenkomst het deel van het voor een
      zorgverzekeraar na toepassing van [artikel 3.12, eerste lid][ref1], resulterende deelbedrag vast voor het cluster
      «variabele zorgkosten» dat op die modelovereenkomst betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.17.2
    text: |-
      Het Zorginstituut bepaalt vervolgens per modelovereenkomst de gerealiseerde kosten voor het cluster «variabele
      zorgkosten».
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.17
  - number: 3.17.3
    text: |-
      Het Zorginstituut bepaalt het verschil tussen het op grond van het eerste lid bepaalde bedrag en het op grond
      van het tweede lid bepaalde bedrag en deelt dit verschil door het aantal bij die modelovereenkomst in het
      vereveningsjaar ingeschreven verzekerden waarop [artikel 24 van de wet][ref1] niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel24
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '24'
  - number: 3.17.4
    text: |-
      Indien het resultaat van het derde lid voor een modelovereenkomst meer dan € 50 of minder dan minus € 50 bedraagt,
      vermenigvuldigt het Zorginstituut 75 procent van het buiten die bandbreedte liggende deel van het resultaat met het
      aantal bij die modelovereenkomst ingeschreven verzekerden waarop [artikel 24 van de wet][ref1] niet van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel24
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '24'
  - number: 3.17.5
    text: |-
      Het Zorginstituut sommeert het resultaat van het vierde lid over alle modelovereenkomsten van alle
      zorgverzekeraars en deelt deze som door het totaal aantal verzekerden van achttien jaar of ouder waarop
      [artikel 24 van de wet][ref1] niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel24
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '24'
  - number: 3.17.6
    text: |-
      Het Zorginstituut vermenigvuldigt per modelovereenkomst het resultaat van het vijfde lid met het aantal bij die
      modelovereenkomst ingeschreven verzekerden van achttien jaar of ouder waarop [artikel 24 van de wet][ref1] niet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel24
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '24'
  - number: 3.17.7
    text: |-
      Het Zorginstituut stelt per modelovereenkomst het deel van het voor een zorgverzekeraar na toepassing van
      [artikel 3.12][ref1] resulterende deelbedrag voor het cluster «variabele zorgkosten» dat op die modelovereenkomst
      betrekking heeft vast. Het Zorginstituut vermindert dit deelbedrag per modelovereenkomst met het verschil tussen
      het resultaat van het vierde lid en het resultaat van het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.17.8
    text: |-
      Het Zorginstituut sommeert voor de bepaling van het deelbedrag voor het cluster «variabele zorgkosten» voor een
      zorgverzekeraar het resultaat van het zevende lid van alle modelovereenkomsten van die zorgverzekeraar.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.17
  - number: '3.18'
    text: |-
      Het Zorginstituut sommeert de herberekende deelbedragen, bedoeld in [artikel 3.11, eerste lid][ref1], voor de
      clusters «variabele zorgkosten» en «kosten van geneeskundige geestelijke gezondheidszorg» en het op grond van
      [artikel 3.15][ref2] berekende nieuwe deelbedrag tot één normatief bedrag per zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.19.1
    text: |-
      Het Zorginstituut brengt vervolgens op het normatieve bedrag, bedoeld in [artikel 3.18][ref1], in mindering de
      voor de zorgverzekeraar naar gerealiseerde verzekerdenaantallen berekende opbrengst van de nominale rekenpremie en
      de voor de zorgverzekeraar naar gerealiseerde verzekerdenaantallen genormeerde opbrengst van het verplicht eigen
      risico.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.19.2
    text: |-
      De berekening van de naar gerealiseerde verzekerdenaantallen berekende opbrengst van de nominale rekenpremie en van
      de naar gerealiseerde verzekerdenaantallen genormeerde opbrengst van het verplicht eigen risico, vindt plaats op
      een bij ministeriële regeling te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
  - number: 3.19.3
    text: |-
      De berekening van de voor de zorgverzekeraar naar gerealiseerde verzekerdenaantallen genormeerde opbrengst van het
      verplicht eigen risico over het vereveningsjaar 2021, vindt, in afwijking van het tweede lid, op de volgende wijze
      plaats:
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
  - number: 3.19.3.a
    text: |-
      het Zorginstituut vermenigvuldigt de uitkomst voor het verplicht eigen risico van de berekening, bedoeld in het
      tweede lid, voor de zorgverzekeraar over het vereveningsjaar 2021, met het quotiënt van de gesommeerde door de
      zorgverzekeraars gerealiseerde opbrengsten van het verplicht eigen risico en van de gesommeerde uitkomsten voor het
      verplicht eigen risico, van de berekening, bedoeld in het tweede lid, voor de zorgverzekeraars;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
  - number: 3.19.3.b
    text: 'het Zorginstituut vermindert de onder a verkregen uitkomst met een bedrag dat het als volgt berekent:'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
  - number: 3.19.3.b.1°
    text: |-
      het Zorginstituut bepaalt het verschil tussen de gesommeerde door de zorgverzekeraars over het vereveningsjaar 2021
      gerealiseerde opbrengsten van het verplicht eigen risico en van de gesommeerde uitkomsten voor het verplicht eigen
      risico, van de berekening, bedoeld in het tweede lid, voor de zorgverzekeraars;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
  - number: 3.19.3.b.2°
    text: het Zorginstituut vermenigvuldigt de onder 1° verkregen uitkomst met 0,15;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
  - number: 3.19.3.b.3°
    text: |-
      het Zorginstituut deelt de onder 2° verkregen uitkomst door het totale aantal in het vereveningsjaar 2021
      ingeschreven verzekerden van achttien jaar en ouder waarop [artikel 24 van de wet][ref1] niet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel24
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '24'
  - number: 3.19.3.b.4°
    text: |-
      het Zorginstituut vermenigvuldigt de onder 3° verkregen uitkomst met het aantal in het vereveningsjaar 2021 bij
      die verzekeraar ingeschreven verzekerden van achttien jaar en ouder, waarop [artikel 24 van de wet][ref1] niet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel24
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '24'
  - number: 3.19.4
    text: |-
      De berekening van de voor de zorgverzekeraar naar gerealiseerde verzekerdenaantallen genormeerde opbrengst van het
      verplicht eigen risico over het vereveningsjaar 2022, vindt, in afwijking van het tweede lid, op de volgende wijze
      plaats:
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
  - number: 3.19.4.a
    text: |-
      het Zorginstituut vermenigvuldigt de uitkomst voor het verplicht eigen risico van de berekening, bedoeld in het
      tweede lid, voor de zorgverzekeraar over het vereveningsjaar 2022, met het quotiënt van de gesommeerde door de
      zorgverzekeraars gerealiseerde opbrengsten van het verplicht eigen risico en van de gesommeerde uitkomsten voor het
      verplicht eigen risico, van de berekening, bedoeld in het tweede lid, voor de zorgverzekeraars;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
  - number: 3.19.4.b
    text: 'het Zorginstituut vermindert de onder a verkregen uitkomst met een bedrag dat het als volgt berekent:'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
  - number: 3.19.4.b.1°
    text: |-
      het Zorginstituut bepaalt het verschil tussen de gesommeerde door de zorgverzekeraars over het vereveningsjaar 2022
      gerealiseerde opbrengsten van het verplicht eigen risico en van de gesommeerde uitkomsten voor het verplicht eigen
      risico, van de berekening, bedoeld in het tweede lid, voor de zorgverzekeraars;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
  - number: 3.19.4.b.2°
    text: het Zorginstituut vermenigvuldigt de onder 1° verkregen uitkomst met 0,30;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
  - number: 3.19.4.b.3°
    text: |-
      het Zorginstituut deelt de onder 2° verkregen uitkomst door het totale aantal in het vereveningsjaar 2022
      ingeschreven verzekerden van achttien jaar en ouder waarop [artikel 24 van de wet][ref1] niet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel24
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '24'
  - number: 3.19.4.b.4°
    text: |-
      het Zorginstituut vermenigvuldigt de onder 3° verkregen uitkomst met het aantal in het vereveningsjaar 2022 bij
      die verzekeraar ingeschreven verzekerden van achttien jaar en ouder, waarop [artikel 24 van de wet][ref1] niet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel24
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '24'
  - number: 3.19.5
    text: |-
      Het Zorginstituut laat de gerealiseerde opbrengsten van het verplicht eigen risico ten gevolge van een catastrofe
      als bedoeld in [artikel 33, eerste lid, onderdeel a, van de wet][ref1] over het vereveningsjaar 2021, buiten
      beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel33
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '33'
  - number: 3.19.6
    text: Het Zorginstituut stelt de vereveningsbijdrage vast op de uitkomst van de berekening, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
  - number: 3.19.7
    text: |-
      Het Zorginstituut deelt aan de zorgverzekeraar het normatieve bedrag, bedoeld in [artikel 3.18][ref1], en de
      vastgestelde vereveningsbijdrage, bedoeld in het zesde lid, mee en geeft hierbij aan welke bedragen, bedoeld in het
      eerste lid, bij de vaststelling van de vereveningsbijdrage zijn betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.20.1
    text: |-
      Het Zorginstituut kan het normatieve bedrag, bedoeld in [artikel 3.18][ref1], en de vereveningsbijdrage, bedoeld in
      [artikel 3.19][ref2], ten behoeve van een zorgverzekeraar voorlopig vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.20.2
    text: |-
      Het Zorginstituut kan bij een voorlopige vaststelling als bedoeld in het eerste lid de nacalculatie, bedoeld in
      [artikel 3.15][ref1], achterwege laten.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.20.3
    text: |-
      Het Zorginstituut past bij een voorlopige vaststelling als bedoeld in het eerste lid indien dat instituut
      de hogekostencompensatie, bedoeld in [artikel 3.12a][ref1], achterwege heeft gelaten, in afwijking van
      [artikel 3.16][ref2], dat artikel toe op het verschil tussen enerzijds het na toepassing van [artikel 3.12][ref3]
      resulterende deelbedrag voor het cluster «kosten van geneeskundige geestelijke gezondheidszorg», en anderzijds de
      gerealiseerde kosten voor dat cluster.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.20.4
    text: |-
      [Artikel 3.19, zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.21.1
    text: |-
      Waar het Zorginstituut bij de berekening van het normatieve bedrag, bedoeld in [artikel 3.9][ref1] of [3.18][ref2],
      ten behoeve van een zorgverzekeraar gebruik maakt van historische gegevens, kan hij, indien die gegevens niet
      beschikbaar zijn, uitgaan van een andere basis die een goede benadering geeft van de ontbrekende historische
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.21.2
    text: |-
      Indien het toepassen van historische gegevens tot onredelijke en niet-beoogde uitkomsten leidt, is het
      Zorginstituut bevoegd om uit te gaan van een alternatieve basis.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.21
  - number: 3.22.1
    text: |-
      In aanvulling op de vereveningsbijdrage, bedoeld in de [artikelen 3.10][ref1] en [3.19][ref2], verstrekt het
      Zorginstituut een uitkering in verband met uitvoeringskosten voor verzekerden jonger dan achttien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.22.2
    text: |-
      De uitkering is gelijk aan een jaarlijks bij ministeriële regeling te bepalen bedrag, vermenigvuldigd met het
      aantal verzekerden jonger dan achttien jaar op 1 juli van het jaar waarop de vereveningsbijdrage betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.22
  - number: 3.23.1
    text: |-
      In aanvulling op de vereveningsbijdrage, bedoeld in de [artikelen 3.10][ref1] en [3.19][ref2], kan het
      Zorginstituut een bijdrage verstrekken in verband met een substantieel verschil tussen kosten en deelbedrag per
      verzekeraar dat rechtstreeks verband houdt met hogere kosten van verzekerden als gevolg van een zeer uitzonderlijke
      omstandigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.23.2
    text: |-
      Ingevolge het eerste lid worden geen bijdragen verstrekt dan nadat bij ministeriële regeling is vastgesteld
      dat sprake is van een ramp die niet opgevangen kan worden binnen de reguliere wijze van vaststelling van de
      vereveningsbijdrage aan zorgverzekeraars.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.23
  - number: 3.23.3
    text: |-
      Bij ministeriële regeling wordt de wijze waarop het Zorginstituut de bijdrage, bedoeld in het eerste lid vaststelt,
      geregeld.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.23
  - number: '3.24'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de berekening van de bijdragen, bedoeld in
      [artikel 34, eerste lid, van de wet][ref1], voor zover het de vaststelling betreft van de bijdragen die het
      Zorginstituut op grond van [artikel 33 van de wet][ref2] heeft toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel33
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '33'
  - number: 3b.1
    text: |-
      Als vormen van zorg als bedoeld in [artikel 122a, tweede lid, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel122a
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3b.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 122a
  - number: 3b.1.a
    text: genderbehandelingen;
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3b.1
  - number: 3b.1.b
    text: in-vitrofertilisatiebehandelingen.
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel3b.1
  - number: '4.1'
    text: |-
      Bij de inwerkingtreding van de [wet][ref1] kunnen voor een zorgverzekeraar die als nieuwe rechtspersoon de
      [wet][ref2] uitvoert de gegevens van zijn rechtsvoorganger worden aangemerkt als historische gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0018450
  - number: '4.2'
    text: |-
      De rijksbelastingdienst verstrekt aan de zorgverzekeraar op een verzoek als bedoeld in
      [artikel 89, eerste lid, van de wet][ref1] het persoonsgegeven dat een persoon als niet-ingezetene aan de
      loonbelasting is onderworpen ter zake van in Nederland in dienstbetrekking verrichte arbeid dan wel als niet-
      ingezetene aan de inkomstenbelasting is onderworpen ter zake van in Nederland verrichte beroepswerkzaamheden anders
      dan in dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel89
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '89'
  - number: '4.4'
    text: 'Dit besluit wordt aangehaald als: Besluit zorgverzekering.'
    url: https://wetten.overheid.nl/BWBR0018492/2026-01-01#Artikel4.4
