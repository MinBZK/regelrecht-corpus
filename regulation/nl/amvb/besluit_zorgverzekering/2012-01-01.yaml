      1 Naast de in [artikel 2.10][ref1] bedoelde verpleging, omvat verpleging tevens zorg zoals verpleegkundigen die
      plegen te bieden, zonder dat die zorg gepaard gaat met verblijf, en die noodzakelijk is in verband met medisch-
      specialistische zorg.

      2 De zorg, bedoeld in het eerste lid, omvat niet verpleging die noodzakelijk is in verband met thuisbeademing of
      die noodzakelijk is in verband met palliatieve terminale zorg.


