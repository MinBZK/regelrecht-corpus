  - number: '3.22'
    text: |-
      1 In aanvulling op de vereveningsbijdrage, bedoeld in de [artikelen 3.10][ref1] en [3.19][ref2], verstrekt het
      College zorgverzekeringen een uitkering in verband met uitvoeringskosten voor verzekerden jonger dan achttien jaar.

      2 De uitkering is gelijk aan een jaarlijks bij ministeriële regeling te bepalen bedrag, vermenigvuldigd met het
      aantal verzekerden jonger dan achttien jaar op 1 juli van het jaar waarop de vereveningsbijdrage betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.10
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3.19
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3.22
