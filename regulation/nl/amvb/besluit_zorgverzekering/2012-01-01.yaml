  - number: '3.12'
    text: |-
      1 Ten behoeve van de herberekening, bedoeld in [artikel 3.11, eerste lid][ref1], berekent het College
      zorgverzekeringen allereerst de deelbedragen, bedoeld in de [artikelen 3.4 tot en met 3.8][ref2], uitgaande van:

      a. de werkelijke verzekerdenaantallen en de werkelijke verzekerdenkenmerken per zorgverzekeraar;

      b. de herberekende gewichten, bedoeld in [artikel 3.11, vijfde lid][ref3].

      2 Het College zorgverzekeringen vermindert ieder op grond van het eerste lid voor een zorgverzekeraar berekend
      deelbedrag met een bedrag dat het als volgt berekent:

      a. het College zorgverzekeringen berekent het verschil tussen de gerealiseerde kosten, bedoeld in
      [artikel 3.11, tweede lid][ref4], en de gecorrigeerde geraamde kosten, bedoeld in artikel 3.11, vierde lid, voor
      het met het deelbedrag overeenkomende cluster van prestaties;

      b. het College zorgverzekeringen deelt de onder a verkregen uitkomst door het totaal aantal in het vereveningsjaar
      ingeschreven verzekerden van achttien jaar en ouder waarop [artikel 24 van de wet][ref5] niet van toepassing is;

      c. het College zorgverzekeringen vermenigvuldigt voor iedere zorgverzekeraar de onder b verkregen uitkomst met
      het aantal in het vereveningsjaar bij die verzekeraar ingeschreven verzekerden van achttien jaar en ouder waarop
      [artikel 24 van de wet][ref6] niet van toepassing is.

      3 Het op grond van het eerste en tweede lid berekende bedrag wordt voor de toepassing van de overige artikelen van
      dit hoofdstuk genoemd: het herberekende deelbedrag per het in die artikelen aangegeven cluster van prestaties.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.11
