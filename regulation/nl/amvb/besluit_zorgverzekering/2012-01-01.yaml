  - number: '3.20'
    text: |-
      1 Het College zorgverzekeringen kan het normatieve bedrag, bedoeld in [artikel 3.18][ref1], en de
      vereveningsbijdrage, bedoeld in [artikel 3.19][ref2], ten behoeve van een zorgverzekeraar voorlopig vaststellen.

      2 Het College zorgverzekeringen kan bij een voorlopige vaststelling als bedoeld in het eerste lid de
      hogekostencompensatie, bedoeld in [artikel 3.16][ref3], of de nacalculatie, bedoeld in de [artikelen 3.15][ref4],
      3.16 of [3.17][ref5], achterwege laten.

      3 [Artikel 3.19, vierde lid][ref6], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.18
