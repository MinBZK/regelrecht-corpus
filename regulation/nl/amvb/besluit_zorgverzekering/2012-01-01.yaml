  - number: '3.11'
    text: |-
      1 Na het vereveningsjaar herberekent het College zorgverzekeringen de deelbedragen, bedoeld
      in de [artikelen 3.4 tot en met 3.8][ref1], op de bij en krachtens dit artikel en de
      [artikelen 3.12 tot en met 3.17][ref2] bepaalde wijze.

      2 Met inachtneming van het bepaalde bij en krachtens de [artikelen 3.13][ref3], [3.14][ref4] en
      [3.15, eerste lid][ref5], bepaalt het College zorgverzekeringen de over het vereveningsjaar gerealiseerde kosten
      per cluster van prestaties voor alle zorgverzekeraars tezamen.

      3 Tot de gerealiseerde kosten behoren niet kosten waarvoor bijdragen als bedoeld in [artikel 3.23][ref6] zijn
      verstrekt.

      4 Het College zorgverzekeringen corrigeert de geraamde kosten per cluster van prestaties voor het werkelijke aantal
      verzekerden in het vereveningsjaar en hun werkelijke verzekerdenkenmerken.

      5 Met inachtneming van bij ministeriële regeling te bepalen regels herberekent het College zorgverzekeringen,
      uitgaande van de door alle zorgverzekeraars tezamen gerealiseerde kosten voor het destreffende cluster van
      prestaties, de gewichten, bedoeld in de [artikelen 3.4][ref7], [3.5][ref8], [3.7][ref9], [3.8][ref10] en
      [3.8a][ref11], door deze te vermenigvuldigen met een factor die gelijk is aan het quotiënt van de gerealiseerde
      kosten, bedoeld in het tweede lid, en de gecorrigeerde geraamde kosten, bedoeld in het vierde lid.

      6 Bij ministeriële regeling wordt bepaald in welke mate een verzekerde die niet gedurende het gehele
      vereveningsjaar bij een zorgverzekeraar verzekerd is, voor de vaststelling van de vereveningsbijdrage van de
      desbetreffende verzekeraar meetelt.


