        bwb_id: BWBR0018492
        artikel: '3.1'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '3.4'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.4'
    text: |-
      1 Het College zorgverzekeringen verdeelt het macro-deelbedrag kosten van dbc-zorgproducten in het vrije segment
      over de zorgverzekeraars aan de hand van de verzekerdenaantallen per zorgverzekeraar, verdeeld naar leeftijd en
      geslacht, FKG’s, DKG’s, aard van het inkomen, SES, meerjarig hoge kosten en regio.

      2 Onze Minister kent aan alle klassen van de genoemde criteria gewichten toe.

      3 De klassen, bedoeld in het eerste lid, en de gewichten, bedoeld in het tweede lid, worden jaarlijks bij
      ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      1 Het College zorgverzekeringen verdeelt het macro-deelbedrag variabele kosten van ziekenhuisverpleging en kosten
      van specialistische hulp over de zorgverzekeraars aan de hand van de verzekerdenaantallen per zorgverzekeraar,
      verdeeld naar leeftijd en geslacht, FKG’s, DKG’s, aard van het inkomen, SES, meerjarig hoge kosten en regio.

      2 Onze Minister kent aan alle klassen van de genoemde criteria gewichten toe.

      3 De klassen, bedoeld in het eerste lid, en de gewichten, bedoeld in het tweede lid, worden jaarlijks bij
      ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 Het College zorgverzekeringen verdeelt het macro-deelbedrag vaste kosten van ziekenhuisverpleging over de
      zorgverzekeraars aan de hand van verzekerdenaantallen en van historische gegevens per zorgverzekeraar.

      2 De historische gegevens, bedoeld in het eerste lid, worden jaarlijks bij ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3.6
  - number: '3.7'
    text: |-
      1 Het College zorgverzekeringen verdeelt het macro-deelbedrag kosten van geneeskundige geestelijke gezondheidszorg
      over de zorgverzekeraars aan de hand van de verzekerdenaantallen per zorgverzekeraar, verdeeld naar leeftijd
      en geslacht, FKG’s psychische aandoeningen, aard van het inkomen, SES, éénpersoonsadres, GGZ-regio, leeftijd
      onder achttien jaar, kosten van geneeskundige geestelijke gezondheidszorg boven de lage drempel en kosten van
      geneeskundige geestelijke gezondheidszorg boven de hoge drempel.

      2 Onze Minister kent aan alle klassen van de genoemde criteria gewichten toe.

      3 De klassen, bedoeld in het eerste lid, en de gewichten, bedoeld in het tweede lid, worden jaarlijks bij
      ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      1 Het College zorgverzekeringen verdeelt het macro-deelbedrag kosten van overige prestaties over de
      zorgverzekeraars aan de hand van de verzekerdenaantallen per zorgverzekeraar, verdeeld naar leeftijd en geslacht,
      FKG’s, DKG’s, aard van het inkomen, SES, meerjarig hoge kosten en regio.

      2 Onze Minister kent aan alle klassen van de genoemde criteria gewichten toe.

      3 De klassen, bedoeld in het eerste lid, en de gewichten, bedoeld in het tweede lid, worden jaarlijks bij
      ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3.8
  - number: 3.8a
    text: |-
      In afwijking van de [artikelen 3.4][ref1], [3.5][ref2] en [3.8][ref3] worden verzekerden die in het buitenland
      wonen ingedeeld in de klasse «Geen FKG» respectievelijk «DKG «0»» en worden de bij deze klasse behorende gewichten
      voor deze verzekerden op bij ministeriële regeling bepaalde wijze door het College zorgverzekeringen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.4
