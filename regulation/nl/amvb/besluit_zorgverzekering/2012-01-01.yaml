  - number: 2.5a
    text: |-
      1 Dyslexiezorg omvat zorg in verband met ernstige dyslexie aan kinderen van zeven jaar of ouder die basisonderwijs
      volgen.

      2 In afwijking van het eerste lid behoort dyslexiezorg niet tot de te verzekeren prestaties indien deze zorg
      aanvangt:

      a. in 2009: op of na het bereiken van de negenjarige leeftijd;

      b. in 2010: op of na het bereiken van de tienjarige leeftijd;

      c. in 2011: op of na het bereiken van de elfjarige leeftijd;

      d. in 2012: op of na het bereiken van de twaalfjarige leeftijd;

      e. in 2013: op of na het bereiken van de dertienjarige leeftijd.
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel2.5a
  - number: '2.6'
    text: |-
      1 Paramedische zorg omvat fysiotherapie, oefentherapie, logopedie, ergotherapie en dieetadvisering.

      2 Fysiotherapie of oefentherapie omvat zorg zoals fysiotherapeuten en oefentherapeuten die plegen te bieden ter
      behandeling van de in [bijlage 1][ref1] aangegeven aandoeningen, voor zover de daarbij aangegeven termijn niet is
      overschreden. Deze zorg omvat voor de verzekerden van achttien jaar en ouder niet de eerste twintig behandelingen.

      3 Fysiotherapie omvat tevens bekkenfysiotherapie in verband met urine-incontinentie. Deze zorg omvat voor de
      verzekerden van achttien jaar of ouder ten hoogste negen behandelingen.

      4 Voor verzekerden jonger dan achttien jaar bestaat fysiotherapie en oefentherapie in andere gevallen dan het
      tweede lid tevens uit ten hoogste negen behandelingen van dezelfde aandoening per kalenderjaar, bij ontoereikend
      resultaat te verlengen met ten hoogste negen behandelingen.

      5 Logopedie omvat zorg zoals logopedisten die plegen te bieden, mits de zorg een geneeskundig doel heeft en van de
      behandeling herstel of verbetering van de spraakfunctie of het spraakvermogen kan worden verwacht.

      6 Ergotherapie omvat zorg zoals ergotherapeuten die plegen te bieden, mits deze als doel heeft de zelfzorg en
      de zelfredzaamheid van de verzekerde te bevorderen en te herstellen, tot een maximum van tien behandeluren per
      kalenderjaar.

      7 Dieetadvisering omvat voorlichting met een medisch doel over voeding en eetgewoonten, zoals diëtisten die plegen
      te bieden, tot een maximum van vier behandeluren per kalenderjaar, indien de dieetadvisering onderdeel is van de
      gecoördineerde, multidisciplinaire zorg aan een verzekerde die lijdt aan een chronische obstructieve longziekte, of
      aan diabetes of die een cardiovasculair risico heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0018492
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0018492
  - number: '2.7'
    text: |-
      1 Mondzorg omvat zorg zoals tandartsen die plegen te bieden, met dien verstande dat het slechts betreft
      tandheelkundige zorg die noodzakelijk is:

      a. indien de verzekerde een zodanige ernstige ontwikkelingsstoornis, groeistoornis of verworven afwijking van
      het tand-kaak-mondstelsel heeft dat hij zonder die zorg geen tandheelkundige functie kan behouden of verwerven,
      gelijkwaardig aan die welke hij zou hebben gehad als de aandoening zich niet zou hebben voorgedaan;

      b. indien de verzekerde een niet-tandheelkundige lichamelijke of geestelijke aandoening heeft en hij zonder die
      zorg geen tandheelkundige functie kan behouden of verwerven gelijkwaardig aan die welke hij zou hebben gehad als de
      aandoening zich niet had voorgedaan; of

      c. indien een medische behandeling zonder die zorg aantoonbaar onvoldoende resultaat zal hebben en de verzekerde
      zonder die andere zorg geen tandheelkundige functie kan behouden of verwerven gelijkwaardig aan die welke hij zou
      hebben gehad als de aandoening zich niet had voorgedaan.

      2 Onder de zorg, bedoeld in het eerste lid, onderdeel a, is tevens begrepen het aanbrengen van een tandheelkundig
      implantaat en het aanbrengen van het vaste gedeelte van de suprastructuur, indien er sprake is van een zeer ernstig
      geslonken tandeloze kaak en deze dienen ter bevestiging van een uitneembare prothese;

      3 Orthodontische hulp is slechts onder de zorg, bedoeld in het eerste lid, begrepen in geval van een zeer ernstige
      ontwikkelings- of groeistoornis van het tand-kaak-mondstelsel, waarbij medediagnostiek of medebehandeling van
      andere disciplines dan de tandheelkundige noodzakelijk is.

      4 Mondzorg omvat voor verzekerden jonger dan achttien jaar in andere gevallen dan het eerste lid, onderdelen a tot
      en met c:

      a. periodiek preventief tandheelkundig onderzoek, eenmaal per jaar, tenzij de verzekerde tandheelkundig meer keren
      per jaar op die hulp is aangewezen;

      b. incidenteel tandheelkundig consult;

      c. het verwijderen van tandsteen;

      d. fluorideapplicatie aan verzekerden vanaf de leeftijd van zes jaar, maximaal tweemaal per jaar, tenzij de
      verzekerde tandheelkundig meer keren per jaar op die hulp is aangewezen;

      e. sealing;

      f. parodontale hulp;

      g. anesthesie;

      h. endodontische hulp;

      i. restauratie van gebitselementen met plastische materialen;

      j. gnathologische hulp;

      k. uitneembare prothetische voorzieningen;

      l. tandvervangende hulp met niet-plastische materialen alsmede het aanbrengen van tandheelkundige implantaten,
      indien het de vervanging van een of meer ontbrekende, blijvende snij- of hoektanden betreft die niet zijn
      aangelegd, dan wel omdat het ontbreken van die tand of die tanden het directe gevolg is van een ongeval;

      m. chirurgische tandheelkundige hulp, met uitzondering het aanbrengen van tandheelkundige implantaten;

      n. röntgenonderzoek, met uitzondering van röntgenonderzoek ten behoeve van orthodontische hulp.

      5 Mondzorg omvat voor verzekerden van achttien jaar en ouder in andere gevallen dan het eerste lid, onderdelen a
      tot en met c:

      a. chirurgische tandheelkundige hulp van specialistische aard en het daarbij behorende röntgenonderzoek, met
      uitzondering van parodontale chirurgie, het aanbrengen van een tandheelkundig implantaat en ongecompliceerde
      extracties;

      b. uitneembare volledige prothetische voorzieningen voor de boven- of onderkaak.

      6 Bij ministeriële regeling kan worden bepaald dat de verzekerde een eigen bijdrage betaalt voor de zorg, bedoeld
      in het eerste of vijfde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel2.7
  - number: '2.8'
    text: |-
      1 Farmaceutische zorg omvat terhandstelling van of advies en begeleiding zoals apothekers die plegen te bieden ten
      behoeve van medicatiebeoordeling en verantwoord gebruik van:

      a. de bij ministeriële regeling aangewezen geregistreerde geneesmiddelen voor zover deze zijn aangewezen door de
      zorgverzekeraar;

      b. mits het rationele farmacotherapie betreft, geneesmiddelen als bedoeld in:

      1°. [artikel 40, derde lid, onder a, van de Geneesmiddelenwet][ref1],

      2°. [artikel 40, derde lid, onder c, van de Geneesmiddelenwet][ref2], die op verzoek van een
      arts als bedoeld in die bepaling, in Nederland zijn bereid door een fabrikant als bedoeld in
      [artikel 1, eerste lid, onder mm, van die wet][ref3], of

      3°. [artikel 40, derde lid, onder c, van de Geneesmiddelenwet][ref4], die in de handel zijn in een andere lidstaat
      of in een derde land en op verzoek van een arts als bedoeld in die bepaling, binnen het grondgebied van Nederland
      worden gebracht en bestemd zijn voor een patiënt van hem die aan een ziekte lijdt die in Nederland niet vaker
      voorkomt dan bij 1 op de 150.000 inwoners;

      c. polymere, oligomere, monomere en modulaire dieetpreparaten.

      2 Farmaceutische zorg omvat geen:

      a. farmaceutische zorg in bij ministeriële regeling aangegeven gevallen;

      b. geneesmiddelen in geval van ziekterisico bij reizen;

      c. geneesmiddelen voor onderzoek als bedoeld in [artikel 40, eerste lid, onder b, van de Geneesmiddelenwet][ref5];

      d. geneesmiddelen die gelijkwaardig of nagenoeg gelijkwaardig zijn aan enig niet aangewezen, geregistreerd
      geneesmiddel;

      e. geneesmiddelen als bedoeld in [artikel 40, derde lid, onder e, van de Geneesmiddelenwet][ref6].

      3 De aanwijzing door de zorgverzekeraar geschiedt zodanig dat van alle werkzame stoffen die voorkomen in de bij
      ministeriële regeling aangewezen geneesmiddelen ten minste een geneesmiddel voor de verzekerde beschikbaar is.

      4 Farmaceutische zorg omvat ook een ander bij ministeriële regeling aangewezen geneesmiddel dan het door de
      zorgverzekeraar aangewezen geneesmiddel, voor zover behandeling met het door de zorgverzekeraar aangewezen
      geneesmiddel voor de verzekerde medisch niet verantwoord is.

      5 Bij de ministeriële regeling, bedoeld in het eerste lid, onderdeel a, worden de aangewezen geneesmiddelen zoveel
      mogelijk ingedeeld in groepen van onderling vervangbare geneesmiddelen.

      In die ministeriële regeling wordt tevens de aanvraagprocedure voor de aanwijzing geregeld, worden regels
      gesteld met betrekking tot de systematiek van de indeling in groepen van onderling vervangbare geneesmiddelen en
      worden regels gesteld met betrekking tot de vaststelling van een vergoedingslimiet voor elke groep van onderling
      vervangbare geneesmiddelen.

      6 De verzekerde betaalt een eigen bijdrage voor een geneesmiddel dat is ingedeeld in een groep van onderling
      vervangbare geneesmiddelen, indien de inkoopprijs hoger is dan de vergoedingslimiet. Een eigen bijdrage wordt ook
      betaald voor zover een geneesmiddel is bereid uit een geneesmiddel waarvoor een eigen bijdrage is verschuldigd. Bij
      ministeriële regeling wordt geregeld hoe de eigen bijdrage wordt berekend.

      7 In afwijking van het vijfde lid kan bij ministeriële regeling worden bepaald dat voor bij die regeling aangewezen
      groepen van onderling vervangbare geneesmiddelen de vergoedinglimiet kan worden herberekend of buiten werking kan
      worden gesteld.


