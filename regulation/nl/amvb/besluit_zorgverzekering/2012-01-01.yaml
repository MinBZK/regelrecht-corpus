    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 22 april 2005, kenmerk Z/VV-2577868;

    Gelet op de artikelen 11, derde en vierde lid, 20, 22, vijfde lid, 32, tweede en derde lid, 34, derde lid, en 89,
    vijfde lid, van de Zorgverzekeringswet;

    De Raad van State gehoord (advies van 20 juni 2005, nr. W13.05.0153/III);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 27 juni 2005, kenmerk Z/VV-
    2596179;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *wet:* de [Zorgverzekeringswet][ref1];

      b. *verblijf:* verblijf gedurende het etmaal;

      c. *eigen bijdrage:* een eigen bijdrage als bedoeld in [artikel 11, derde lid van de wet][ref2];

      d. *geregistreerd geneesmiddel:* een geneesmiddel waarvoor een handelsvergunning of parallelhandelsvergunning
      is verleend krachtens de [Geneesmiddelenwet][ref3] dan wel krachtens de verordening, bedoeld in
      [artikel 1, eerste lid, onder fff, van die wet][ref4];

      e. *in-vitrofertilisatiepoging:* zorg volgens de in-vitrofertilisatiemethode, inhoudende:

      1°. het door hormonale behandeling bevorderen van de rijping van eicellen in het lichaam van de vrouw;

      2°. de follikelpunctie;

      3°. de bevruchting van eicellen en het kweken van embryo's in het laboratorium;

      4°. het een of meer keren implanteren van een of twee embryo's in de baarmoederholte teneinde zwangerschap te doen
      ontstaan;

      f. *vereveningsbijdrage:* de bijdrage, bedoeld in [paragraaf 4.2 van de wet][ref5];

      g. *vereveningsjaar:* het kalenderjaar waarop een vereveningsbijdrage betrekking heeft;

      h. *cluster van prestaties:* het cluster «dbc-zorgproducten in het vrije segment», het cluster «variabele kosten
      van ziekenhuisverpleging en kosten van specialistische hulp», het cluster «vaste kosten van ziekenhuisverpleging»,
      het uit de clusters «geneeskundige geestelijke gezondheidszorg voor verzekerden jonger dan achttien jaar»
      en «geneeskundige geestelijke gezondheidszorg voor verzekerden van achttien jaar en ouder» bestaande cluster
      «geneeskundige geestelijke gezondheidszorg» of het cluster «overige prestaties»;

      i. *kosten van dbc-zorgproducten in het vrije segment:* de kosten van onder de dekking van een zorgverzekering
      vallende dbc-zorgproducten in het vrije segment, voor zover niet bij ministeriële regeling is bepaald dat deze als
      tot een ander cluster behorende kosten worden aangemerkt;

      j. *variabele kosten van ziekenhuisverpleging en kosten van specialistische hulp:* de variabele kosten van
      verblijf, verpleging en verzorging, met uitzondering van verblijf gepaard gaande met zorg zoals klinisch-
      psychologen en psychiaters die plegen te bieden, alsmede de kosten van geneeskundige zorg zoals medisch-
      specialisten die plegen te bieden, met uitzondering van zorg zoals klinisch-psychologen en psychiaters die
      plegen te bieden, dit alles voor zover deze kosten onder de dekking van een zorgverzekering vallen en niet bij
      ministeriële regeling is bepaald dat deze als tot een ander cluster behorende kosten worden aangemerkt;

      k. *vaste kosten van ziekenhuisverpleging:* de vaste kosten van verblijf, verpleging en verzorging, met
      uitzondering van verblijf gepaard gaande met zorg zoals klinisch-psychologen en psychiaters die plegen te bieden,
      alsmede bij ministeriële regeling aan te wijzen kosten, dit alles voor zover deze kosten onder de dekking van een
      zorgverzekering vallen;

      l. *kosten van geneeskundige geestelijke gezondheidszorg:* de in de kosten voor verzekerden jonger dan achttien
      jaar enerzijds en de kosten voor verzekerden van achttien jaar en ouder anderzijds onder te verdelen kosten van
      geneeskundige zorg zoals klinisch-psychologen en psychiaters die plegen te bieden alsmede het daarmee gepaard
      gaande verblijf, voor zover deze kosten onder de dekking van een zorgverzekering vallen;

      m. *kosten van overige prestaties:* de kosten van onder de dekking van een zorgverzekering vallende prestaties die
      niet als tot een ander cluster behorende kosten worden aangemerkt;

      n. *macro-deelbedrag:* een in de ministeriële regeling, bedoeld in [artikel 3.1, derde lid][ref6], voor een cluster
      van prestaties genoemd bedrag dat ex ante over de zorgverzekeraars wordt verdeeld;

      o. *deelbedrag:* een bedrag dat een zorgverzekeraar voor een cluster van prestaties ontvangt;

      p. *leeftijd en geslacht:* vereveningscriteria op grond waarvan verzekerden worden ingedeeld op grond van hun
      leeftijd, hun geslacht of hun leeftijd en geslacht;

      q. *FKG’s:* farmaceutische kostengroepen, een vereveningscriterium op grond waarvan verzekerden worden ingedeeld in
      klassen chronische aandoeningen op basis van geneesmiddelengebruik in het verleden;

      r. *FKG’s psychische aandoeningen:* farmaceutische kostengroepen psychische aandoeningen, een vereveningscriterium
      op grond waarvan verzekerden worden ingedeeld in klassen chronische psychische aandoeningen op basis van
      geneesmiddelengebruik in het verleden;

      s. *DKG’s:* diagnose kostengroepen, een vereveningscriterium op grond waarvan verzekerden worden ingedeeld
      in kostenhomogene klassen met verschillende chronische aandoeningen die geïdentificeerd zijn op grond van de
      uitgevoerde diagnose behandeling combinaties;

      t. *aard van het inkomen:* een vereveningscriterium op grond waarvan verzekerden worden ingedeeld in klassen op
      basis van de aard van hun inkomen;

      u. *SES:* sociaaleconomische status, een vereveningscriterium op grond waarvan verzekerden worden ingedeeld in
      klassen op basis van het aantal personen op een adres, hun leeftijd en het gemiddelde inkomen per adres;

      v. *éénpersoonsadres:* een vereveningscriterium op grond waarvan verzekerden worden ingedeeld in een klasse «woont
      op een adres waarop één persoon is ingeschreven» of in een klasse «woont niet op een adres waarop één persoon is
      ingeschreven»;

      w. *regio:* een vereveningscriterium op grond waarvan verzekerden op basis van de vier cijfers van de postcode van
      hun woonadres worden ingedeeld in klassen, waarbij op postcodeniveau rekening is gehouden met de verschillen met
      betrekking tot zorgaanbod, sociaaleconomische omstandigheden en gezondheid;

      x. *GGZ-regio:* een vereveningscriterium op grond waarvan verzekerden op basis van de vier cijfers van de postcode
      van hun woonadres worden ingedeeld in klassen, waarbij op postcodeniveau rekening is gehouden met de verschillen
      met betrekking tot GGZ-zorgaanbod, sociaaleconomische omstandigheden en geestelijke gezondheid;

      y. *kosten van geneeskundige geestelijke gezondheidszorg boven de lage drempel:* kosten per verzekerde van
      intramuraal en extramuraal gebruik van geneeskundige geestelijke gezondheidszorg in het voorafgaande jaar, die
      hoger zijn dan een bij ministeriële regeling te bepalen bedrag;

      z. *kosten van geneeskundige geestelijke gezondheidszorg boven de hoge drempel:* kosten per verzekerde van
      intramuraal en extramuraal gebruik van geneeskundige geestelijke gezondheidszorg in het voorafgaande jaar, die
      hoger zijn dan een bij ministeriële regeling te bepalen bedrag;

      aa. *meerjarig hoge kosten:* een vereveningscriterium op grond waarvan verzekerden op basis van de kosten van de
      zorg die zij in de drie jaren voorafgaande aan het vereveningsjaar hebben genoten, worden ingedeeld in klassen van
      voorspelbare zorgkosten;

      bb. *nominale rekenpremie:* een bij de berekening van de vereveningsbijdrage in aanmerking te nemen bedrag, ter
      hoogte van de door Onze Minister geraamde premie die een zorgverzekeraar op jaarbasis bij een premieplichtige
      verzekerde voor verzekerde prestaties in rekening brengt;

      cc. *geraamde kosten:* de bij de ministeriële regeling, bedoeld in [artikel 3.1, derde lid][ref7], bepaalde macro-
      deelbedragen, vermeerderd of verminderd met na vaststelling van deze deelbedragen maar voor 1 januari van het
      vereveningsjaar geraamde, bij ministeriële regeling te bepalen kosten die het gevolg zijn van wijzigingen in de
      over het vereveningsjaar op grond van een zorgverzekering te verzekeren prestaties waarmee bij het opstellen van de
      ministeriële regeling, bedoeld in artikel 3.1, derde lid, nog geen rekening kon worden gehouden;

      dd. *hogekostencompensatie:* het verrekenen met het Zorgverzekeringsfonds van een bij ministeriële regeling te
      bepalen percentage van de kosten van verzekerden met betrekking tot in dit besluit aangewezen deelbedragen, voor
      zover zij uitgaan boven een bij ministeriële regeling te omschrijven drempel;

      ee. *nacalculatie:* bijstelling van het deelbedrag op basis van het verschil tussen gerealiseerde kosten en het
      herberekende deelbedrag per zorgverzekeraar, per onderscheiden cluster van prestaties;

      ff. *bandbreedte:* een bedrag waarboven en waaronder meer- of minderkosten kunnen worden nagecalculeerd.


