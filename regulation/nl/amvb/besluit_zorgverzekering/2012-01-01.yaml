  - number: 3a.1
    text: |-
      1 Verzekerden hebben recht op de uitkering, bedoeld in [artikel 118a, eerste lid, van de wet][ref1] indien zij:

      a. in de twee opeenvolgende jaren voorafgaande aan het jaar waarop de uitkering betrekking heeft, voldoen aan bij
      ministeriële regeling gestelde voorwaarden met betrekking tot aan hen ter hand gestelde, in die regeling aan te
      wijzen geneesmiddelen, of

      b. in twee opeenvolgende jaren voorafgaande aan het jaar waarop de uitkering betrekking heeft, zijn ingedeeld in
      bij ministeriële regeling aangewezen DKG’s, of

      c. op 1 juli van het jaar waarop de uitkering betrekking heeft, zonder onderbreking meer dan een half jaar in een
      AWBZ-instelling verblijven.

      2 Gewezen personen als bedoeld in [artikel 2, tweede lid, onderdeel a, van de wet][ref2] hebben eveneens recht op
      een uitkering als bedoeld in het eerste lid, indien zij in de twee opeenvolgende jaren voorafgaande aan het jaar
      waarop de uitkering betrekking dient te hebben, zorg hebben ontvangen ten laste van een ziektekostenregeling voor
      militairen die overeenkomt met de zorg waarop het eerste lid, onderdelen a of b, betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel118a
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel2
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3a.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 118a
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '2'
  - number: 3a.2
    text: |-
      1 Onze Minister geeft het College zorgverzekeringen voorafgaande aan ieder kalenderjaar een aanwijzing
      over de voor dat jaar ten laste van het Zorgverzekeringsfonds komende beheerskosten, bedoeld in
      [artikel 39, derde lid, onderdeel f, van de wet][ref1].

      2 Met inachtneming van het eerste lid stelt het College zorgverzekeringen jaarlijks het budget voor de
      beheerskosten, bedoeld in het eerste lid, vast.

      3 Het College zorgverzekeringen bepaalt de wijze van betaalbaarstelling van het budget.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel39
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3a.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '39'
  - number: 3a.3
    text: |-
      1 Het CAK neemt in zijn jaarrekening op:

      a. de omvang van de egalisatiereserve voor de uitvoering van de compensatieregeling voor het verplicht eigen
      risico, met dien verstande dat de totale egalisatiereserve maximaal 5% van het totale beheerskostenbudget van het
      betreffende jaar bedraagt;

      b. het verschil tussen het budget en de realisatie, dat ten laste of ten bate komt van de egalisatiereserve.

      2 Het College zorgverzekeringen stelt jaarlijks aan de hand van het financieel jaarverslag van het CAK vast
      of de reserve het gestelde maximum te boven gaat. Indien dit het geval is, stort het CAK het door het College
      zorgverzekeringen vastgestelde bedrag van de overschrijding binnen vier weken in het Zorgverzekeringsfonds.
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3a.3
  - number: 3a.4
    text: |-
      Indien het CAK op een naar het oordeel van de zorgautoriteit onverantwoorde wijze op zijn beheerskosten bespaart,
      wordt het budget, bedoeld in [artikel 3a.2][ref1], voor het desbetreffende kalenderjaar door het College
      zorgverzekeringen verlaagd met het door de zorgautoriteit aangegeven bedrag van die besparing.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3a.2
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3a.4
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: 3a.2
        hoofdstuk: 3a
  - number: 3b.1
    text: |-
      Als vormen van zorg als bedoeld in [artikel 122a, tweede lid, van de wet][ref1], worden aangewezen:

      a. genderbehandelingen;

      b. in-vitrofertilisatiebehandelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel122a
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3b.1
    references:
