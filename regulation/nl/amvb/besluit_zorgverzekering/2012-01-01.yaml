    text: |-
      1 Hulpmiddelenzorg omvat bij ministeriële regeling aangewezen, functionerende hulpmiddelen en verbandmiddelen,
      waarbij kan worden geregeld:

      a. in welke gevallen de verzekerde recht heeft op die zorg;

      b. vergoeding van bij die regeling aangewezen kosten in verband met thuisdialyse.

      2 De kosten van normaal gebruik van hulpmiddelen komen, tenzij bij ministeriële regeling anders is bepaald, voor
      rekening van de verzekerde.

      3 Bij ministeriële regeling kan worden bepaald dat de verzekerde voor een hulpmiddel een eigen bijdrage betaalt ter
      grootte van:

      a. het verschil tussen de aanschaffingskosten en het bij dat hulpmiddel vermelde bedrag, dat kan verschillen naar
      gelang de groep van verzekerden, waartoe de verzekerde behoort;

      b. een daarbij vermeld bedrag wegens besparing van kosten.
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel2.9
  - number: '2.10'
    text: |-
      1 Verblijf omvat verblijf gedurende een ononderbroken periode van ten hoogste 365 dagen, dat medisch noodzakelijk
      is in verband met de geneeskundige zorg, bedoeld in [artikel 2.4][ref1], of in verband met chirurgische
      tandheelkundige hulp van specialistische aard als bedoeld in [artikel 2.7][ref2], al dan niet gepaard gaande met
      verpleging, verzorging of paramedische zorg.

      2 Een onderbreking van ten hoogste dertig dagen wordt niet als onderbreking beschouwd, maar deze dagen tellen niet
      mee voor de berekening van de 365 dagen.

      3 In afwijking van het tweede lid tellen onderbrekingen wegens weekend- en vakantieverlof mee voor de berekening
      van de 365 dagen.

      4 Bij ministeriële regeling kan worden bepaald dat de verzekerde een eigen bijdrage betaalt voor zorg als bedoeld
      in het eerste lid.


