  - number: '2.2'
    text: |-
      1 De vergoeding van kosten, bedoeld in [artikel 11, eerste lid, onderdeel b, van de wet][ref1] omvat de kosten die
      de verzekerde heeft gemaakt voor zorg of overige diensten zoals die naar inhoud en omvang zijn omschreven in de
      [artikelen 2.4 tot en met 2.15][ref2].

      2 Bij het bepalen van de vergoeding worden in mindering gebracht:

      a. hetgeen de verzekerde als eigen bijdrage had moeten betalen indien hij krachtens de zorgverzekering recht zou
      hebben op prestaties bestaande uit zorg of overige diensten;

      b. de kosten die hoger zijn dan in de Nederlandse marktomstandigheden in redelijkheid passend is te achten.


