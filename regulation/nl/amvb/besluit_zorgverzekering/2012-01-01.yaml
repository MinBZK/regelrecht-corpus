  - number: '3.9'
    text: |-
      Het College zorgverzekeringen sommeert de ingevolge [artikelen 3.3 tot en met 3.8][ref1] aan een zorgverzekeraar
      toegerekende deelbedragen tot één normatief bedrag per zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3.9
