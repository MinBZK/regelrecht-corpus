      1 In gevallen waarin ziekenvervoer per ambulance, per auto of met een openbaar middel van vervoer niet mogelijk
      is, kan de zorgverzekeraar toestaan dat het ziekenvervoer plaatsvindt met een ander door de zorgverzekeraar aan te
      geven vervoermiddel.

      2 Het ziekenvervoer omvat tevens vervoer van een begeleider, indien begeleiding noodzakelijk is, of indien het
      betreft begeleiding van kinderen beneden zestien jaar. In bijzondere gevallen kan de zorgverzekeraar vervoer van
      twee begeleiders toestaan.
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel2.15
  - number: '2.16'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de verzekerde voor ziekenvervoer, anders dan ambulancevervoer als
      bedoeld in [artikel 1, eerste lid, van de Wet ambulancevervoer][ref1], een eigen bijdrage betaalt tot een bij die
      regeling aangeven maximum.


