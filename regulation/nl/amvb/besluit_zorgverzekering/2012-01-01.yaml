  - number: '3.21'
    text: |-
      1 Waar het College zorgverzekeringen bij de berekening van het normatieve bedrag, bedoeld in [artikel 3.9][ref1]
      of [3.18][ref2], ten behoeve van een zorgverzekeraar gebruik maakt van historische gegevens, kan hij, indien die
      gegevens niet beschikbaar zijn, uitgaan van een andere basis die een goede benadering geeft van de ontbrekende
      historische gegevens.

      2 Indien het toepassen van historische gegevens tot onredelijke en niet-beoogde uitkomsten leidt, is het College
      zorgverzekeringen bevoegd om uit te gaan van een alternatieve basis.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.9
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3.18
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3.21
