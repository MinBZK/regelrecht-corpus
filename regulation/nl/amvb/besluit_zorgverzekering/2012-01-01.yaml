  - number: '3.13'
    text: |-
      Voor zover deze onder de zorgverzekering worden gedekt, deelt het College zorgverzekeringen bij ministeriële
      regeling te bepalen soorten kosten van zorg en overige diensten die niet zonder meer aan een bepaalde
      kostencategorie kunnen worden toegedeeld, overeenkomstig een bij die regeling te bepalen verdeelsleutel toe aan
      de kosten van dbc-zorgproducten in het vrije segment, de variabele kosten van ziekenhuisverpleging en kosten
      van specialistische hulp, de vaste kosten van ziekenhuisverpleging, de kosten van geneeskundige geestelijke
      gezondheidszorg of de kosten van overige prestaties.
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3.13
  - number: '3.14'
    text: |-
      Het College zorgverzekeringen merkt voor een bij ministeriële regeling te bepalen gedeelte van de
      verschillende geldende tarieven binnen de kosten van ziekenhuisverpleging, kosten aan als variabele kosten van
      ziekenhuisverpleging en kosten van specialistische hulp.
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3.14
  - number: '3.15'
    text: |-
      1 Het College zorgverzekeringen merkt voor een bij ministeriële regeling te bepalen gedeelte van de
      verschillende geldende tarieven binnen de kosten van ziekenhuisverpleging, die kosten aan als vaste kosten van
      ziekenhuisverpleging.

      2 Het College zorgverzekeringen calculeert in een bij ministeriële regeling te bepalen mate na op het verschil
      tussen de vaste kosten van ziekenhuisverpleging in het betreffende jaar enerzijds, en het op grond van
      [artikel 3.12][ref1] herberekende deelbedrag vaste kosten van ziekenhuisverpleging anderzijds, leidende tot een
      nieuw deelbedrag per zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.12
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3.12'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.16'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat het College zorgverzekeringen op het op grond van
      [artikel 3.12][ref1] herberekende deelbedrag kosten van geneeskundige geestelijke gezondheidszorg, op een bij die
      regeling te bepalen wijze hogekostencompensatie toepast.

      2 Het College zorgverzekeringen calculeert in een bij ministeriële regeling te bepalen mate na op het verschil
      tussen de kosten van geneeskundige geestelijke gezondheidszorg enerzijds, en het resultaat na eventuele toepassing
      van het gestelde in het eerste lid anderzijds.

      3 Het resultaat van toepassing van het tweede lid, dan wel, indien van toepassing, van het eerste en tweede lid,
      leidt tot een nieuw, in een deelbedrag voor verzekerden jonger dan achttien jaar enerzijds en een deelbedrag voor
      verzekerden van achttien jaar en ouder anderzijds te onderscheiden, deelbedrag per zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.12
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '3.12'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.17'
    text: |-
      1 Indien voor een zorgverzekeraar het verschil tussen enerzijds de som van de ingevolge [artikel 3.12][ref1]
      herberekende deelbedragen voor de clusters «dbc-zorgproducten in het vrije segment» en «variabele kosten van
      ziekenhuisverpleging en kosten van specialistische hulp» en anderzijds de som van de gerealiseerde kosten voor
      de clusters «dbc-zorgproducten in het vrije segment» en «variabele kosten van ziekenhuisverpleging en kosten van
      specialistische hulp», gedeeld door het aantal bij hem ingeschreven verzekerden van achttien jaar en ouder waarop
      [artikel 24 van de wet][ref2] niet van toepassing is, meer dan een bij ministeriële regeling te bepalen bedrag
      afwijkt van het gemiddelde marktresultaat van de zorgverzekeraars voor deze clusters, calculeert het College
      zorgverzekeringen de buiten de bedoelde bandbreedte liggende meer- of minderkosten voor een bij die regeling te
      bepalen percentage na.

      2 Indien voor een zorgverzekeraar het verschil tussen het deelbedrag, bedoeld in [artikel 3.16, derde lid][ref3],
      voor verzekerden van achttien jaar en ouder en de gerealiseerde kosten voor het cluster «geneeskundige geestelijke
      gezondheidszorg voor verzekerden van achttien jaar en ouder», gedeeld door het aantal bij hem ingeschreven
      verzekerden van achttien jaar en ouder waarop [artikel 24 van de wet][ref4] niet van toepassing is, meer dan een
      bij ministeriële regeling te bepalen bedrag afwijkt van het gemiddelde marktresultaat van de zorgverzekeraars voor
      het cluster «geneeskundige geestelijke gezondheidszorg voor verzekerden van achttien jaar en ouder», calculeert
      het College zorgverzekeringen de buiten de bedoelde bandbreedte liggende meer- of minderkosten voor een bij die
      regeling te bepalen percentage na.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.12
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel3.16
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel24
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3.17
