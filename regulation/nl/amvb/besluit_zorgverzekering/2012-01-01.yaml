  - number: '2.5'
    text: |-
      De geneeskundige zorg, bedoeld in [artikel 2.4, eerste lid, onderdeel c][ref1], omvat tevens vergoeding van de
      kosten van:

      a. specialistisch geneeskundige zorg in verband met de selectie van de donor;

      b. specialistisch geneeskundige zorg in verband met de operatieve verwijdering van het transplantatiemateriaal bij
      de gekozen donor;

      c. het onderzoek, de preservering, de verwijdering en het vervoer van het postmortale transplantatiemateriaal, in
      verband met de voorgenomen transplantatie;

      d. de zorg waarop ingevolge dit hoofdstuk aanspraak bestaat aan de donor, gedurende ten hoogste dertien weken, dan
      wel een half jaar in geval van een levertransplantatie, na de datum van ontslag uit de instelling waarin de donor
      ter selectie of verwijdering van het transplantatiemateriaal opgenomen is geweest, voor zover die zorg verband
      houdt met die opneming;

      e. het vervoer van de donor in de laagste klasse van een openbaar middel van vervoer binnen Nederland of, indien
      medisch noodzakelijk, vervoer per auto binnen Nederland, in verband met de selectie, opneming en ontslag uit het
      ziekenhuis en met de zorg, bedoeld in onderdeel d;

      f. het vervoer van en naar Nederland, van een in het buitenland woonachtige donor, in verband met transplantatie
      van een nier, beenmerg of lever bij een verzekerde in Nederland en overige kosten gemoeid met de transplantatie die
      verband houden met het wonen van de donor in het buitenland, met uitzondering van de verblijfskosten in Nederland
      en gederfde inkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2.4
