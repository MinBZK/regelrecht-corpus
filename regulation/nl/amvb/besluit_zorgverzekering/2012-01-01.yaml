  - number: '3.18'
    text: |-
      Het College zorgverzekeringen sommeert de ingevolge [artikel 3.12][ref1] herberekende deelbedragen voor de
      clusters «dbc-zorgproducten in het vrije segment», «variabele kosten van ziekenhuisverpleging en kosten van
      specialistische hulp» en «overige prestaties», de op grond van de [artikelen 3.15][ref2] en [3.16][ref3] berekende
      nieuwe deelbedragen en, voor zover van toepassing, de op grond van [artikel 3.17][ref4] berekende bedragen, tot één
      normatief bedrag per zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel3.12
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel3.15
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel3.16
      [ref4]: https://wetten.overheid.nl/BWBR0018492#Artikel3.17
    url: https://wetten.overheid.nl/BWBR0018492/2012-01-01#Artikel3.18
