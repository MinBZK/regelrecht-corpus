  - number: '2.13'
    text: |-
      1 Vervoer omvat ziekenvervoer per ambulance als bedoeld in
      [artikel 1, eerste lid, van de Wet ambulancevervoer][ref1], van de verzekerde over een afstand van maximaal 200
      kilometer:

      a. naar een persoon bij wie of een instelling waarin hij zorg zal ontvangen waarvan de kosten geheel of
      gedeeltelijk ten laste van de zorgverzekering komen;

      b. naar een instelling waarin hij geheel of gedeeltelijk ten laste van de bijzondere ziektekostenverzekering als
      bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref2] zal gaan verblijven;

      c. vanuit een instelling, bedoeld in onderdeel b, naar:

      1°. een persoon bij wie of een instelling waarin hij geheel of gedeeltelijk ten laste van de bijzondere
      ziektekostenverzekering een onderzoek of een behandeling zal ondergaan;

      2°. een persoon of instelling voor het aanmeten en passen van een prothese die geheel of gedeeltelijk ten laste van
      de bijzondere ziektekostenverzekering wordt verstrekt;

      d. naar zijn woning of een andere woning, indien hij in zijn woning redelijkerwijs niet de nodige verzorging kan
      krijgen, indien hij komt van een van de personen of instellingen, bedoeld in de onderdelen a, b of c.

      2 Indien de zorgverzekeraar een verzekerde toestemming geeft zich te wenden tot een bepaalde persoon of instelling,
      geldt de beperking van 200 kilometer niet.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614
