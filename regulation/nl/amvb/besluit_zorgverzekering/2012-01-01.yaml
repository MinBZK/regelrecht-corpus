      1 Naast de in [artikel 2.10][ref1] bedoelde verzorging, omdat verzorging tevens zorg zoals kraamverzorgenden die
      plegen te bieden aan moeder en kind in verband met een bevalling, gedurende ten hoogste tien dagen, te rekenen
      vanaf de dag van bevalling.

      2 Bij ministeriële regeling kan worden bepaald dat de verzekerde een eigen bijdrage betaalt voor de zorg, bedoeld
      in het eerste lid.


