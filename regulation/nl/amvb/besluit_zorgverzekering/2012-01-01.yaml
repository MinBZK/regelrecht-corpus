  - number: '2.4'
    text: |-
      1 Geneeskundige zorg omvat zorg zoals huisartsen, medisch-specialisten, klinisch-psychologen en verloskundigen
      die plegen te bieden, met uitzondering van de zorg zoals tandarts-specialisten die plegen te bieden, alsmede
      dyslexiezorg als bedoeld in [artikel 2.5a][ref1] en paramedische zorg als bedoeld in [artikel 2.6][ref2], met dien
      verstande dat:

      a. de zorg niet omvat:

      1°. het vaccineren ten behoeve van grieppreventie,

      2°. prenatale screening naar aangeboren afwijkingen, anders dan via een structureel echoscopisch onderzoek in
      het tweede trimester van de zwangerschap, indien de verzekerde jonger is dan 36 jaar en hiervoor geen medische
      indicatie heeft;

      3°. de vierde of volgende in-vitrofertilisatiepoging per te realiseren zwangerschap, nadat drie pogingen zijn
      geëindigd tussen het moment dat een follikelpunctie is geslaagd en het moment dat er sprake is van een doorgaande
      zwangerschap van tien weken te rekenen vanaf het moment van de follikelpunctie en indien de implantatie van
      gecryopreserveerde embryo’s niet heeft geleid tot een doorgaande zwangerschap van negen weken en drie dagen te
      rekenen vanaf de implantatie;

      b. behandeling van plastisch-chirurgische aard slechts onder de zorg valt indien die strekt tot correctie van:

      1°. afwijkingen in het uiterlijk die gepaard gaan met aantoonbare lichamelijke functiestoornissen;

      2°. verminkingen die het gevolg zijn van een ziekte, ongeval of geneeskundige verrichting;

      3°. verlamde of verslapte bovenoogleden die het gevolg zijn van een aangeboren afwijking of een bij de geboorte
      aanwezige chronische aandoening;

      4°. de volgende aangeboren misvormingen: lip-, kaak- en gehemeltespleten, misvormingen van het benig aangezicht,
      goedaardige woekeringen van bloedvaten, lymfevaten of bindweefsel, geboortevlekken of misvormingen van urineweg-
      en geslachtsorganen;

      5°. primaire geslachtskenmerken bij een vastgestelde transsexualiteit;

      c. transplantaties van weefsels en organen slechts tot de zorg behoren indien de transplantatie is verricht in een
      lidstaat van de Europese Unie, in een staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of in een andere staat indien de donor woonachtig is in die staat en de echtgenoot, de geregistreerde
      partner of een bloedverwant in de eerste, tweede of derde graad van de verzekerde is.

      d. de zorg ten hoogste vijf zittingen eerstelijnspsychologische zorg per kalenderjaar omvat.

      2 Bij ministeriële regeling kunnen vormen van zorg, worden uitgezonderd.

      3 Bij ministeriële regeling kan worden bepaald dat de verzekerde voor zorg op het terrein van de geestelijke
      gezondheidszorg een eigen bijdrage betaalt. Daarbij kan worden bepaald dat hij die bijdrage betaalt tot een bij die
      regeling aangeven maximum.


