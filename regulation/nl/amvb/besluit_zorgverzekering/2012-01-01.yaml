  - number: '2.14'
    text: |-
      1 Het vervoer omvat tevens ziekenvervoer per auto, anders dan per ambulance als bedoeld in
      [artikel 1, eerste lid, van de Wet ambulancevervoer][ref1], dan wel uit vervoer in de laagste klasse
      van een openbaar middel van vervoer van en naar een persoon, instelling of woning als bedoeld in
      [artikel 2.13, eerste lid][ref2], over een enkele reisafstand van maximaal 200 kilometer voor zover:

      a. de verzekerde nierdialyses moet ondergaan;

      b. de verzekerde oncologische behandelingen met chemotherapie of radiotherapie moet ondergaan;

      c. de verzekerde zich uitsluitend met een rolstoel kan verplaatsen;

      d. het gezichtsvermogen van de verzekerde zodanig is beperkt dat hij zich niet zonder begeleiding kan verplaatsen.

      2 Indien het vervoer, bedoeld in het eerste lid, vervoer met een particuliere auto betreft, bedraagt de vergoeding
      een bij ministeriële regeling te bepalen bedrag per kilometer.

      3 In afwijking van het eerste lid, onderdelen a tot en met d, omvat vervoer ook vervoer in andere gevallen, indien
      de verzekerde in verband met de behandeling van een langdurige ziekte of aandoening langdurig is aangewezen op
      vervoer en het niet verstrekken of vergoeden van dat vervoer voor de verzekerde zal leiden tot een onbillijkheid
      van overwegende aard.

      4 Indien de zorgverzekeraar een verzekerde toestemming zich te wenden tot een bepaalde persoon of instelling, geldt
      de beperking van 200 kilometer niet.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel1
