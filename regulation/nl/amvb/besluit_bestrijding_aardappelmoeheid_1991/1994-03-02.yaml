preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 18 april 1991, No. J. 914 441,
    Directie Juridische en Bedrijfsorganisatorische Zaken;

    Gelet op artikel 3 Plantenziektenwet (Stb. 1951, 96);

    Gehoord het Landbouwschap, het Hoofdproduktschap Akkerbouwprodukten en de Pootaardappelcontactcommissie;

    De Raad van State gehoord (advies van 27 augustus 1991, No. W11.91.0215;

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 11 oktober 1991, No. J.
    9112 194, Directie Juridische en Bedrijfsorganisatorische Zaken.

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005234/1994-03-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. aardappelplanten: planten van de soort Solanum tuberosum;

      b. aardappelcysteaaltje: Globodera rostochiensis (Wollenweber) Mulvey & Stone of Globodera pallida (Stone) Mulvey
      & Stone;

      c. tuinen: stukken grond, waarop anders dan ter uitoefening van een bedrijf, de land- of tuinbouw wordt
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0005234/1994-03-02#Artikel1
  - number: '4'
    text: |-
      Onze Minister kan met het oog op de bestrijding van het aardappelcysteaaltje de teelt van aardappelen in tuinen
      verbieden of aan voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005234/1994-03-02#Artikel4
  - number: '5'
    text: |-
      1 Het telen van door Onze Minister aangewezen planten is verboden op grond waarvan de gebruiksgerechtigde niet in
      het bezit is van een door Onze Minister afgegeven verklaring, waaruit blijkt, dat de grond vrij is bevonden van
      besmetting met het aardappelcysteaaltje.

      2 In de verklaring, als bedoeld in het eerste lid, kunnen voorschriften worden opgenomen. Zij kan onder beperkingen
      worden verleend en te allen tijde worden ingetrokken.

      3 Aangewezen kunnen worden planten, welke gevaar opleveren voor de verbreiding of voor de vermeerdering van het
      aardappelcysteaaltje.
    url: https://wetten.overheid.nl/BWBR0005234/1994-03-02#Artikel5
  - number: '6'
    text: |-
      1 Het is verboden in gebieden of op terreinen die Onze Minister aanwijst aardappelplanten en andere door Onze
      Minister aangewezen planten te telen of op zodanige wijze te bewaren, dat zij in aanraking komen met grond van deze
      gebieden of terreinen.

      2 Aangewezen kunnen worden:

      a. gebieden en terreinen, waarbinnen of waarop de aanwezigheid van het aardappelcysteaaltje is aangetoond of wordt
      vermoed;

      b. tuinen, gelegen in gebieden, waarbinnen de land- of tuinbouw overwegend met het oog op de uitvoer wordt
      uitgeoefend;

      c. planten, die gevaar opleveren voor de verspreiding of voor de vermeerdering van het aardappelcysteaaltje.
    url: https://wetten.overheid.nl/BWBR0005234/1994-03-02#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister kan van het bij of krachtens dit besluit bepaalde ontheffing of vrijstelling verlenen.

      2 Aan een ontheffing of vrijstelling kunnen voorschriften worden verbonden. Zij kan onder beperkingen worden
      verleend. Zij kan te allen tijde geheel of gedeeltelijk worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005234/1994-03-02#Artikel7
  - number: '8'
    text: |-
      1 Na de inwerkingtreding van dit besluit berust de Beschikking aardappelteelt in tuinen 1973 (*Stcrt.* 34) op
      [artikel 4][ref1] van dit besluit.

      2 Verklaringen en aanwijzingen afgegeven of gedaan op grond van artikel 1a van het Besluit bestrijding
      aardappelmoeheid (*Stb.* 1952, 288) die nog van kracht zijn bij de inwerkingtreding van dit besluit, worden geacht
      te zijn afgegeven of gedaan op grond van [artikel 5][ref2] van dit besluit.

      3 Aanwijzingen, gedaan op grond van artikel 3 van het Besluit bestrijding aardappelmoeheid, en nog van kracht bij
      de inwerkingtreding van dit besluit, worden geacht te zijn gedaan op grond van [artikel 6][ref3] van dit besluit.

      4 Ontheffingen, verleend ingevolge artikel 4 van het Besluit bestrijding aardappelmoeheid en nog van kracht bij de
      inwerkingtreding van dit besluit, worden geacht te zijn verleend op grond van [artikel 7][ref4] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005234#Artikel4
