        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '42'
  - number: '5'
    text: |-
      1 De in [artikel 3][ref1] bedoelde regels inzake de kwaliteit van het teeltmateriaal kunnen onder meer betrekking
      hebben op:

      a. de rasechtheid, de gezondheid, de groeikracht, het vochtgehalte, de afmetingen en de zuiverheid van het
      teeltmateriaal;

      b. de sortering, de classificatie, de verzorging, de verpakking, de verlading en de aanduiding of etikettering van
      het teeltmateriaal, voor zover verband houdende met de in onderdeel a bedoelde onderwerpen;

      c. de wijze van keuring van het teeltmateriaal;

      2 De wijze van keuring van het teeltmateriaal, bedoeld in het eerste lid, onder c, heeft onder meer betrekking op
      de voorwaarden waaronder leveranciers en laboratoria door de keuringsinstellingen erkend kunnen worden voor het
      verrichten van de bij ministeriële regeling aan te duiden keuringsactiviteiten.

      3 De in het eerste en tweede lid bedoelde regels kunnen per gewas verschillen overeenkomstig de van toepassing
      zijnde handelsrichtlijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0019210#Artikel3
    url: https://wetten.overheid.nl/BWBR0019210/2007-09-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019210
        artikel: '3'
        paragraaf: '3'
  - number: '6'
    text: |-
      1 Teeltmateriaal waarvan op basis van een keuring is komen vast te staan dat het voldoet aan de eisen die bij of
      krachtens dit besluit gesteld worden inzake de kwaliteit en verhandeling van teeltmateriaal, wordt voorzien van
      een bewijsstuk of kenteken. Een bewijsstuk of kenteken wordt aangebracht op het teeltmateriaal of de verpakking
      daarvan, dan wel bij het teeltmateriaal gevoegd.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de vorm en inhoud van de in het eerste
      lid bedoelde bewijsstukken en kentekenen.

      3 Bij ministeriële regeling kunnen regels worden gesteld betreffende het uitreiken, aanbrengen, vervaardigen,
      voorhanden en in voorraad hebben, alsmede het afleveren en gebruiken van bewijsstukken en kentekenen en van
      clichés, stempels en andere werktuigen tot het vervaardigen of aanbrengen van die bewijsstukken en kentekenen.

      4 De in het tweede en derde lid bedoelde regels kunnen per gewas verschillen overeenkomstig de van toepassing
      zijnde handelsrichtlijnen.
    url: https://wetten.overheid.nl/BWBR0019210/2007-09-28#Artikel6
