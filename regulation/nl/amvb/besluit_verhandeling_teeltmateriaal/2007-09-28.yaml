        artikel: '1'
  - number: '2'
    text: |-
      Als keuringsinstellingen worden aangewezen:

      a. NAK, belast met de keuring van landbouwgewassen, het uitreiken van bewijsstukken of kentekenen en de erkenning
      of registratie van leveranciers van landbouwgewassen;

      b. Naktuinbouw, belast met de keuring van tuinbouwgewassen en bosbouwgewassen, het uitreiken van bewijsstukken of
      kentekenen en de erkenning of registratie van leveranciers van tuinbouwgewassen en bosbouwgewassen.
    url: https://wetten.overheid.nl/BWBR0019210/2007-09-28#Artikel2
  - number: '3'
    text: |-
      Het in de handel brengen van teeltmateriaal van landbouwgewassen, tuinbouwgewassen en bosbouwgewassen is slechts
      toegestaan indien is voldaan aan de bij ministeriële regeling gestelde regels inzake de verhandeling en de
      kwaliteit van teeltmateriaal.
    url: https://wetten.overheid.nl/BWBR0019210/2007-09-28#Artikel3
  - number: '4'
    text: |-
      1 De in [artikel 3][ref1] bedoelde regels inzake de verhandeling van teeltmateriaal kunnen onder meer betrekking
      hebben op:

      a. de voorwaarde dat slechts de bij deze regels aan te wijzen categorieën van teeltmateriaal in de handel worden
      gebracht;

      b. de voorwaarde dat de bij deze regels aan te wijzen categorieën van teeltmateriaal uitsluitend in de handel
      worden gebracht door de houder van het kwekersrecht van het desbetreffende ras, of, indien voor het ras geen
      kwekersrecht bestaat, door de voor het ras bij de Raad geregistreerde instandhouders;

      c. de voorwaarde dat teeltmateriaal van landbouwgewassen, bosbouwgewassen en groentegewassen uitsluitend in de
      handel wordt gebracht indien het afkomstig is van een ras dat of een opstand die is toegelaten en is ingeschreven
      in het rassenregister, dan wel is opgenomen op een vanwege de Commissie van de Europese Gemeenschappen vastgestelde
      gemeenschappelijke lijst van rassen;

      d. de termijn waarbinnen teeltmateriaal van landbouwgewassen na beëindiging van de toelating en inschrijving in het
      rassenregister in de handel gebracht mag worden;

      e. de erkenning of registratie van leveranciers als bedoeld in [artikel 42 van de wet][ref2];

      f. de uitvoering van het onderzoek naar de instandhouding van een ras;

      g. voorwaarden voor de verhandeling van teeltmateriaal van een ras dat niet langer in stand gehouden wordt;

      h. het in de handel brengen met het oog op uitvoer buiten het grondgebied van de Europese Unie van teeltmateriaal
      van rassen en opstanden die niet voldoen aan de bij of krachtens dit besluit gestelde voorwaarden.

      2 De regels inzake de erkenning of registratie van leveranciers, als bedoeld in het eerste lid, onder e, kunnen
      onder meer betrekking hebben op:

      a. de technische inrichting en administratie van het bedrijf alsmede de technische bedrijfsvoering;

      b. het productieproces, de productiemethoden en de opslag;

      c. de documentatie met betrekking tot het productieproces, de opslag of de aflevering;

      d. de voorzieningen ten behoeve van het toezicht op de naleving van het bepaalde bij of krachtens dit besluit
      inzake de erkenning of registratie.

      3 De in het eerste en tweede lid bedoelde regels kunnen per gewas verschillen overeenkomstig de van toepassing
      zijnde handelsrichtlijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0019210#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel42
    url: https://wetten.overheid.nl/BWBR0019210/2007-09-28#Artikel4
    references:
      - id: ref1
