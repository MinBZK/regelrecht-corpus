preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 1 september 2005, TRCJZ/2005/2593,
    Directie Juridische Zaken;

    Gelet op de Europese richtlijnen met betrekking tot het in de handel brengen van teeltmateriaal van verschillende
    soorten gewassen alsmede gelet op de artikelen 19, 39, eerste en tweede lid, 40, 41, 43, 85, en 87, tweede, derde
    en zesde lid, van de Zaaizaad- en plantgoedwet 2005;

    De Raad van State gehoord (advies van 14 oktober 2005, nr. W11.05.0400/V);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 1 december 2005, nr.
    TRCJZ/2005/3569, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019210/2007-09-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Zaaizaad- en plantgoedwet 2005][ref1];

      b. keuringsinstelling: privaatrechtelijke rechtspersoon als bedoeld in [artikel 19 van de wet][ref2];

      c. NAK: de Stichting Nederlandse Algemene Keuringsdienst voor zaaizaad en pootgoed van landbouwgewassen;

      d. Naktuinbouw: de Stichting Nederlandse Algemene Kwaliteitsdienst Tuinbouw;

      e. groenvoedergewassen: gewassen, bedoeld in artikel 2, eerste lid, onder A, van [richtlijn nr. 66/401/EEG]
      (31966L0401) van de Raad van de Europese Gemeenschappen van 14 juni 1966 betreffende het in de handel brengen van
      zaaizaad van groenvoedergewassen (PbEG L 125);

      f. zaaigranen: gewassen, bedoeld in artikel 2, eerste lid, onder A, van [richtlijn nr. 66/402/EEG](31966L0402) van
      de Raad van de Europese Gemeenschappen van 14 juni 1966 betreffende het in de handel brengen van zaaigranen (PbEG
      L 125);

      g. bieten: gewassen, bedoeld in artikel 2, eerste lid, onder b, van [richtlijn nr. 2002/54/EG](32002L0054) van de
      Raad van de Europese Unie van 13 juni 2002 betreffende het in de handel brengen van bietenzaad (PbEG L 193);

      h. oliehoudende planten en vezelgewassen: gewassen, bedoeld in artikel 2, eerste lid, onder b, van [richtlijn nr.
      2002/57/EG](32002L0057) van de Raad van de Europese Unie van 13 juni 2002 betreffende het in de handel brengen van
      zaaizaad van oliehoudende planten en vezelgewassen (PbEG L 193);

      i. fruitgewassen: gewassen, alsmede hybriden daarvan, die zijn opgenomen in bijlage II van [richtlijn nr. 92/34/
      EEG](31992L0034) van de Raad van de Europese Gemeenschappen van 28 april 1992 betreffende het in de handel brengen
      van teeltmateriaal van fruitgewassen, alsmede van fruitgewassen die voor de fruitteelt worden gebruikt (PbEG
      L 157);

      j. siergewassen: gewassen waarvan teeltmateriaal, bedoeld in artikel 2, eerste lid, van [richtlijn nr. 98/56/
      EG](31998L0056) van de Raad van de Europese Unie van 20 juli 1998 betreffende het in de handel brengen van
      teeltmateriaal van siergewassen (PbEG L 226), wordt voortgebracht, met uitzondering van bloembollen, bedoeld in
      [artikel 1, onder t, van het Landbouwkwaliteitsbesluit 2007][ref3];

      k. groenteplanten: teeltmateriaal van gewassen, alsmede hybriden daarvan, die zijn opgenomen in bijlage II van
      [richtlijn nr. 92/33/EEG](31992L0033) van de Raad van de Europese Gemeenschappen van 28 april 1992 betreffende het
      in de handel brengen van teeltmateriaal en plantgoed van groentegewassen, met uitzondering van zaad (PbEG L 157);

      l. groentezaden: teeltmateriaal van de gewassen, bedoeld in artikel 2, eerste lid, onder b, van [richtlijn nr.
      2002/55/EG](32002L0055) van de Raad van de Europese Unie van 13 juni 2002 betreffende het in de handel brengen van
      groentezaad (PbEG L 193);

      m. groentegewassen: gewassen waarvan groentezaden en groenteplanten worden voortgebracht;

      n. bosbouwgewassen: boomsoorten en kunstmatige hybriden daarvan die in de gehele Europese Unie of in een deel
      daarvan voor de bosbouw van belang zijn en met name, die welke zijn opgenomen in bijlage I bij [richtlijn nr.
      1999/105/EG](31999L0105) van de Raad van de Europese Unie betreffende het in de handel brengen van bosbouwkundig
      teeltmateriaal (PbEG 2000 L 11);

      o. tuinbouwgewassen: fruitgewassen, groentegewassen en siergewassen;

      p. landbouwgewassen: bieten, groenvoedergewassen, oliehoudende planten en vezelgewassen, pootaardappelen en
      zaaigranen.

      2 Een wijziging van de desbetreffende handelsrichtlijn gaat voor de toepassing van dit besluit gelden met ingang
      van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


