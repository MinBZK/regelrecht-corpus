preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 1 september 2005, TRCJZ/2005/2593,
    Directie Juridische Zaken;

    Gelet op de Europese richtlijnen met betrekking tot het in de handel brengen van teeltmateriaal van verschillende
    soorten gewassen alsmede gelet op de artikelen 19, 39, eerste en tweede lid, 40, 41, 43, 85, en 87, tweede, derde
    en zesde lid, van de Zaaizaad- en plantgoedwet 2005;

    De Raad van State gehoord (advies van 14 oktober 2005, nr. W11.05.0400/V);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 1 december 2005, nr.
    TRCJZ/2005/3569, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.a
    text: |-
      wet: [Zaaizaad- en plantgoedwet 2005][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018040
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018040
  - number: 1.1.b
    text: |-
      keuringsinstelling: privaatrechtelijke rechtspersoon als bedoeld in [artikel 19 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel19
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '19'
  - number: 1.1.c
    text: 'NAK: de Stichting Nederlandse Algemene Keuringsdienst voor zaaizaad en pootgoed van landbouwgewassen;'
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.d
    text: 'Naktuinbouw: de Stichting Nederlandse Algemene Kwaliteitsdienst Tuinbouw;'
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.e
    text: |-
      groenvoedergewassen: gewassen, bedoeld in artikel 2, eerste lid, onder A, van [richtlijn nr. 66/401/EEG]
      (31966L0401) van de Raad van de Europese Gemeenschappen van 14 juni 1966 betreffende het in de handel brengen van
      zaaizaad van groenvoedergewassen (PbEG L 125);
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.f
    text: |-
      zaaigranen: gewassen, bedoeld in artikel 2, eerste lid, onder A, van [richtlijn nr. 66/402/EEG](31966L0402) van
      de Raad van de Europese Gemeenschappen van 14 juni 1966 betreffende het in de handel brengen van zaaigranen (PbEG
      L 125);
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.g
    text: |-
      bieten: gewassen, bedoeld in artikel 2, eerste lid, onder b, van [richtlijn nr. 2002/54/EG](32002L0054) van de Raad
      van de Europese Unie van 13 juni 2002 betreffende het in de handel brengen van bietenzaad (PbEG L 193);
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.h
    text: |-
      oliehoudende planten en vezelgewassen: gewassen, bedoeld in artikel 2, eerste lid, onder b, van [richtlijn nr.
      2002/57/EG](32002L0057) van de Raad van de Europese Unie van 13 juni 2002 betreffende het in de handel brengen van
      zaaizaad van oliehoudende planten en vezelgewassen (PbEG L 193);
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.i
    text: 'fruitgewassen: gewassen, alsmede hybriden daarvan, die zijn opgenomen in bijlage I van richtlijn nr. 2008/90/EG;'
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.j
    text: |-
      siergewassen: gewassen waarvan teeltmateriaal, bedoeld in artikel 2, eerste lid, van [richtlijn nr. 98/56/
      EG](31998L0056) van de Raad van de Europese Unie van 20 juli 1998 betreffende het in de handel brengen van
      teeltmateriaal van siergewassen (PbEG L 226), wordt voortgebracht, met uitzondering van bloembollen, bedoeld in
      [artikel 1, onder t, van het Landbouwkwaliteitsbesluit 2007][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022535#Artikel1
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022535
        artikel: '1'
  - number: 1.1.k
    text: |-
      groenteplanten: teeltmateriaal van gewassen, alsmede hybriden daarvan, die zijn opgenomen in bijlage II van
      [richtlijn nr. 92/33/EEG](31992L0033) van de Raad van de Europese Gemeenschappen van 28 april 1992 betreffende het
      in de handel brengen van teeltmateriaal en plantgoed van groentegewassen, met uitzondering van zaad (PbEG L 157);
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.l
    text: |-
      groentezaden: teeltmateriaal van de gewassen, bedoeld in artikel 2, eerste lid, onder b, van [richtlijn nr.
      2002/55/EG](32002L0055) van de Raad van de Europese Unie van 13 juni 2002 betreffende het in de handel brengen van
      groentezaad (PbEG L 193);
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.m
    text: 'groentegewassen: gewassen waarvan groentezaden en groenteplanten worden voortgebracht;'
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.n
    text: |-
      bosbouwgewassen: boomsoorten en kunstmatige hybriden daarvan die in de gehele Europese Unie of in een deel daarvan
      voor de bosbouw van belang zijn en met name, die welke zijn opgenomen in bijlage I bij [richtlijn nr. 1999/105/EG]
      (31999L0105) van de Raad van de Europese Unie betreffende het in de handel brengen van bosbouwkundig teeltmateriaal
      (PbEG 2000 L 11);
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.o
    text: 'tuinbouwgewassen: fruitgewassen, groentegewassen en siergewassen;'
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.p
    text: |-
      landbouwgewassen: bieten, groenvoedergewassen, oliehoudende planten en vezelgewassen, pootaardappelen en
      zaaigranen;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.q
    text: |-
      richtlijn 2008/90/EG: richtlijn 2008/90/EG van de Raad van de Europese Unie van 29 september 2008 betreffende het
      in de handel brengen van teeltmateriaal van fruitgewassen, alsmede van fruitgewassen die voor de fruitteelt worden
      gebruikt (PbEU L 267);
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.r
    text: 'landbouwzaaizaad: zaaizaad van landbouwgewassen;'
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: 1.1.s
    text: 'landbouwgrond: grond waarop landbouwgewassen worden geteeld of onmiddellijk kunnen worden geteeld.'
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: '1.2'
    text: |-
      Een wijziging van de desbetreffende handelsrichtlijn gaat voor de toepassing van dit besluit gelden met ingang van
      de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel1
  - number: '2'
    text: 'Als keuringsinstellingen worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel2
  - number: 2.a
    text: |-
      NAK, belast met de keuring van landbouwgewassen, het uitreiken van bewijsstukken of kentekenen en de erkenning of
      registratie van leveranciers van landbouwgewassen;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel2
  - number: 2.b
    text: |-
      Naktuinbouw, belast met de keuring van tuinbouwgewassen en bosbouwgewassen, het uitreiken van bewijsstukken of
      kentekenen en de erkenning of registratie van leveranciers van tuinbouwgewassen en bosbouwgewassen.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel2
  - number: '3'
    text: |-
      Het in de handel brengen van teeltmateriaal van landbouwgewassen, tuinbouwgewassen en bosbouwgewassen is slechts
      toegestaan indien is voldaan aan de bij ministeriële regeling gestelde regels inzake de verhandeling en de
      kwaliteit van teeltmateriaal.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel3
  - number: '4.1'
    text: |-
      De in [artikel 3][ref1] bedoelde regels inzake de verhandeling van teeltmateriaal kunnen onder meer betrekking
      hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0019210#Artikel3
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019210
        artikel: '3'
        paragraaf: '3'
  - number: 4.1.a
    text: |-
      de voorwaarde dat slechts de bij deze regels aan te wijzen categorieën van teeltmateriaal in de handel worden
      gebracht;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
  - number: 4.1.b
    text: |-
      de voorwaarde dat de bij deze regels aan te wijzen categorieën van teeltmateriaal uitsluitend in de handel worden
      gebracht door de houder van het kwekersrecht van het desbetreffende ras, of, indien voor het ras geen kwekersrecht
      bestaat, door de voor het ras bij de Raad geregistreerde instandhouders;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
  - number: 4.1.c
    text: |-
      de voorwaarde dat teeltmateriaal van landbouwgewassen, bosbouwgewassen en groentegewassen uitsluitend in de handel
      wordt gebracht indien het afkomstig is van een ras dat of een opstand die is toegelaten en is ingeschreven in het
      rassenregister, dan wel is opgenomen op een vanwege de Europese Commissie vastgestelde gemeenschappelijke lijst
      van rassen;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
  - number: 4.1.d
    text: |-
      de voorwaarde dat teeltmateriaal van fruitgewassen uitsluitend in de handel wordt gebracht indien het afkomstig
      is van een ras dat kwekersrechtelijk is beschermd, dat is toegelaten of dat overeenkomstig artikel 7, tweede lid,
      onder c, van richtlijn 2008/90/EG als algemeen bekend wordt beschouwd;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
  - number: 4.1.e
    text: |-
      de termijn waarbinnen teeltmateriaal van landbouwgewassen na beëindiging van de toelating en inschrijving in het
      rassenregister in de handel gebracht mag worden;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
  - number: 4.1.f
    text: |-
      de erkenning of registratie van leveranciers als bedoeld in [artikel 42 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel42
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '42'
  - number: 4.1.g
    text: de uitvoering van het onderzoek naar de instandhouding van een ras;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
  - number: 4.1.h
    text: voorwaarden voor de verhandeling van teeltmateriaal van een ras dat niet langer in stand gehouden wordt;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
  - number: 4.1.i
    text: |-
      het in de handel brengen met het oog op uitvoer buiten het grondgebied van de Europese Unie van teeltmateriaal van
      rassen en opstanden die niet voldoen aan de bij of krachtens dit besluit gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
  - number: '4.2'
    text: |-
      De regels inzake de erkenning of registratie van leveranciers, als bedoeld in het eerste lid, onder e, kunnen onder
      meer betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
  - number: 4.2.a
    text: de technische inrichting en administratie van het bedrijf alsmede de technische bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
  - number: 4.2.b
    text: het productieproces, de productiemethoden en de opslag;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
  - number: 4.2.c
    text: de documentatie met betrekking tot het productieproces, de opslag of de aflevering;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
  - number: 4.2.d
    text: |-
      de voorzieningen ten behoeve van het toezicht op de naleving van het bepaalde bij of krachtens dit besluit inzake
      de erkenning of registratie.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
  - number: '4.3'
    text: |-
      De in het eerste en tweede lid bedoelde regels kunnen per gewas verschillen overeenkomstig de van toepassing zijnde
      handelsrichtlijnen.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel4
  - number: '5.1'
    text: |-
      De in [artikel 3][ref1] bedoelde regels inzake de kwaliteit van het teeltmateriaal kunnen onder meer betrekking
      hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0019210#Artikel3
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019210
        artikel: '3'
        paragraaf: '3'
  - number: 5.1.a
    text: |-
      de rasechtheid, de gezondheid, de groeikracht, het vochtgehalte, de afmetingen en de zuiverheid van het
      teeltmateriaal;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel5
  - number: 5.1.b
    text: |-
      de sortering, de classificatie, de certificering, de verzorging, de verpakking, de verlading en de aanduiding of
      etikettering van het teeltmateriaal, voor zover verband houdende met de in onderdeel a bedoelde onderwerpen;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel5
  - number: 5.1.c
    text: de wijze van keuring van het teeltmateriaal;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel5
  - number: '5.2'
    text: |-
      De wijze van keuring van het teeltmateriaal, bedoeld in het eerste lid, onder c, heeft onder meer betrekking op
      de voorwaarden waaronder leveranciers en laboratoria door de keuringsinstellingen erkend kunnen worden voor het
      verrichten van de bij ministeriële regeling aan te duiden keuringsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel5
  - number: '5.3'
    text: |-
      De in het eerste en tweede lid bedoelde regels kunnen per gewas verschillen overeenkomstig de van toepassing zijnde
      handelsrichtlijnen.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel5
  - number: '6.1'
    text: |-
      Teeltmateriaal waarvan op basis van een keuring is komen vast te staan dat het voldoet aan de eisen die bij of
      krachtens dit besluit gesteld worden inzake de kwaliteit en verhandeling van teeltmateriaal, wordt voorzien van
      een bewijsstuk of kenteken. Een bewijsstuk of kenteken wordt aangebracht op het teeltmateriaal of de verpakking
      daarvan, dan wel bij het teeltmateriaal gevoegd.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel6
  - number: '6.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de vorm en inhoud van de in het eerste
      lid bedoelde bewijsstukken en kentekenen.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel6
  - number: '6.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende het uitreiken, aanbrengen, vervaardigen,
      voorhanden en in voorraad hebben, alsmede het afleveren en gebruiken van bewijsstukken en kentekenen en van
      clichés, stempels en andere werktuigen tot het vervaardigen of aanbrengen van die bewijsstukken en kentekenen.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel6
  - number: '6.4'
    text: |-
      De in het tweede en derde lid bedoelde regels kunnen per gewas verschillen overeenkomstig de van toepassing zijnde
      handelsrichtlijnen.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel6
  - number: 6a
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de toestemming, bedoeld in artikel 3, vierde lid, van
      richtlijn 2008/90/EG.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel6a
  - number: 6b.1
    text: |-
      De teelt van landbouwgewassen, tuinbouwgewassen en bosbouwgewassen is slechts toegestaan indien is voldaan aan de
      bij ministeriële regeling gestelde regels inzake teelt.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel6b
  - number: 6b.2
    text: 'De regels, bedoeld in het eerste lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel6b
  - number: 6b.2.a
    text: |-
      het gebruik, de opslag en de bewerking van landbouwzaaizaad dat niet overeenkomstig de bij die regels aangewezen
      voorschriften is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel6b
  - number: 6b.2.b
    text: het verstrekken van gegevens inzake landbouwzaaizaad aan Onze Minister;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel6b
  - number: 6b.2.c
    text: het bewerken van landbouwgrond teneinde de verontreiniging van zaaizaad tegen te gaan;
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel6b
  - number: 6b.2.d
    text: |-
      het voorkomen van economische schade door het naast elkaar bestaan van genetisch gemodificeerde gewassen en niet-
      genetisch gemodificeerde gewassen.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel6b
  - number: '7'
    text: 'De volgende besluiten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel7
  - number: 7.a
    text: |-
      [Aansluitingsbesluit N.A.K.][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002567
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002567
  - number: 7.b
    text: |-
      [Aansluitingsbesluit Naktuinbouw][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002566
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002566
  - number: 7.c
    text: |-
      [Besluit Categorieën Teeltmateriaal][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002570
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002570
  - number: 7.d
    text: |-
      [Besluit verhandeling teeltmateriaal landbouwgewassen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009072
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009072
  - number: 7.e
    text: |-
      [Besluit verhandeling teeltmateriaal tuinbouwgewassen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004347
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004347
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit verhandeling teeltmateriaal.'
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel8
  - number: '9'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0019210/2015-01-01#Artikel9
