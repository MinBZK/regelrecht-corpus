  - number: '3.3'
    text: |-
      Het is verboden zich van afvalstoffen zijnde plantenresten te ontdoen door deze voor het opslaan op of in de bodem
      te brengen.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3
  - number: '3.4'
    text: 'Het derde lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3
  - number: 3.4.a
    text: huishoudelijke afvalstoffen die nog niet zijn ingezameld of afgegeven,
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3
  - number: 3.4.b
    text: |-
      het opslaan van plantenresten waarop het [Besluit activiteiten leefomgeving][ref1] van toepassing is,


      [ref1]: https://wetten.overheid.nl/BWBR0041330
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3
    references:
      - id: ref1
