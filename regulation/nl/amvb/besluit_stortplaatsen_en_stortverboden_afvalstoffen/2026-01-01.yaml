        bwb_id: BWBR0003245
        artikel: '10'
  - number: 3a.1
    text: |-
      Het bevoegd gezag verbindt aan een omgevingsvergunning voor de opslag van afvalstoffen het voorschrift dat opslag
      van afvalstoffen is toegestaan voor een termijn van ten hoogste één jaar.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3a
  - number: 3a.2
    text: |-
      Indien de vergunninghouder ten genoegen van het bevoegd gezag aantoont dat de opslag van afvalstoffen gevolgd wordt
      door nuttige toepassing van afvalstoffen, kan het bevoegd gezag, in afwijking van het eerste lid, aan een zodanige
      vergunning het voorschrift verbinden dat de opslag van afvalstoffen is toegestaan voor een termijn van ten hoogste
      drie jaar.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3a
  - number: 3a.3
    text: |-
      Het bevoegd gezag kan, in afwijking van het eerste en tweede lid, aan een omgevingsvergunning voor de opslag in
      oppervlaktewater van baggerspecie niet zijnde een gevaarlijke afvalstof als bedoeld in de [Wet milieubeheer][ref1]
      het voorschrift verbinden dat de opslag is toegestaan voor een termijn van ten hoogste tien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 3a.4
    text: |-
      In afwijking van het eerste en tweede lid, gelden met betrekking tot de bij voorschrift aan een
      omgevingsvergunning, voor de opslag van metallisch kwik, te verbinden termijnen de daarover bij of krachtens
      Verordening (EU) nr. 2017/852 van het Europees Parlement en de Raad van 17 mei 2017 betreffende kwik, en tot
      intrekking van [Verordening (EG) nr. 1102/2008](32008R1102) (PbEU 2017, L 137) gestelde regels.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3a
  - number: '4.1'
    text: |-
      Aan een omgevingsvergunning voor een milieubelastende activiteit die betrekking heeft op een stortplaats als
      bedoeld in [artikel 3.85, eerste lid van het Besluit activiteiten leefomgeving][ref1], kan het bevoegd gezag het
      voorschrift verbinden dat voor daarbij aangewezen afvalstoffen het in [artikel 1, eerste lid][ref2], bedoelde
      verbod niet geldt indien die afvalstoffen zijn aangewezen krachtens [artikel 5][ref3], dan wel indien daarvoor een
      verklaring geldt als bedoeld in [artikel 6.][ref4]


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009094#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009094#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0009094#Artikel6
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009094
        artikel: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009094
        artikel: '5'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0009094
        artikel: '6'
        paragraaf: '1'
  - number: '4.2'
    text: |-
      In een voorschrift als bedoeld in het eerste lid, bepaalt het bevoegd gezag tevens dat door toepassing van dat
      voorschrift geen strijd mag ontstaan met het ingevolge [artikel 11f][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel11f
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: 11f
        paragraaf: '2'
  - number: '4.3'
    text: |-
      Het eerste lid is niet van toepassing op de categorieën van afvalstoffen, genoemd in
      [artikel 1, eerste lid, onder 1 tot en met 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '1'
        paragraaf: '1'
  - number: '5'
    text: |-
      Bij regeling van Onze Minister kunnen categorieën van afvalstoffen, genoemd in
      [artikel 1, eerste lid, categorie 15][ref1] en volgende, of delen van die categorieën worden aangewezen, waarvoor
      naar zijn oordeel in Nederland geen andere wijze van afvalbeheer mogelijk is dan storten.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '1'
        paragraaf: '1'
  - number: '6.1'
    text: |-
      Op verzoek van degene die een stortplaats exploiteert, kunnen gedeputeerde staten verklaren dat
      er naar hun oordeel in Nederland geen andere wijze van afvalbeheer mogelijk is dan storten voor in
      [artikel 1, eerste lid, categorie 15][ref1] en volgende, genoemde afvalstoffen of voor een deel van een zodanige
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '1'
        paragraaf: '1'
  - number: '6.2'
    text: |-
      In de verklaring nemen gedeputeerde staten op dat de verklaring geldt zolang de omstandigheden voor toepassing van
      het eerste lid aanwezig zijn, nog gevolgd door een overgangsperiode van tien werkdagen.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel6
  - number: '6.3'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] niet van toepassing op een verzoek om een verklaring
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '6.4'
    text: |-
      Van een verklaring als bedoeld in het eerste lid, doen gedeputeerde staten zo spoedig mogelijk mededeling aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel6
  - number: '7'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld omtrent de gegevens die worden verstrekt aan gedeputeerde
      staten bij een verzoek als bedoeld in [artikel 6, eerste lid][ref1], en omtrent de gegevens die moeten worden
      verstrekt aan Onze Minister na het storten van afvalstoffen overeenkomstig de regeling bedoeld in [artikel 5][ref2]
      en met een verklaring als bedoeld in artikel 6.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009094#Artikel5
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009094
        artikel: '5'
        paragraaf: '1'
  - number: '8'
    text: |-
      Het is verboden afvalstoffen te verdunnen of te vermengen om te voldoen aan de voorschriften, bedoeld in
      [artikel 11f, eerste lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel11f
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: 11f
        paragraaf: '2'
  - number: '9'
    text: Bij regeling van Onze Minister worden de gevallen aangewezen, waarin straalgrit niet reinigbaar is.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel9
  - number: '10'
    text: |-
      Voor degene waarvoor een verbod als bedoeld in de [artikelen 1, eerste lid][ref1], of [3, eerste lid][ref2],
      gaat gelden en waarin in de periode van drie maanden voorafgaand aan het tijdstip waarop dat verbod gaat gelden,
      handelingen plegen te worden verricht, waarop dat verbod betrekking heeft, blijft dat verbod met betrekking tot die
      handelingen buiten toepassing gedurende drie maanden na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009094#Artikel3
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009094
        artikel: '3'
        paragraaf: '1'
  - number: 11a
    text: |-
      In het bepaalde bij of krachtens deze paragraaf wordt verstaan onder: - *anorganische afvalstoffen:* afvalstoffen
      met een organisch stofgehalte van ten hoogste tien procent;
        - *behandeling*: fysische, thermische, chemische of biologische processen, met inbegrip van het sorteren, die
      de eigenschappen van de afvalstoffen zodanig veranderen dat het volume of de gevaarlijke eigenschappen worden
      gereduceerd, de behandeling wordt vergemakkelijkt of de nuttige toepassing wordt bevorderd;
        - *biologisch afbreekbare afvalstoffen*: afvalstoffen die aëroob of anaëroob kunnen worden afgebroken;
        - *cel:* stortvak of een deel daarvan met een bepaalde hoogte;
        - *inerte afvalstoffen*: onbrandbare afvalstoffen die geen significante fysische, chemische of biologische
      veranderingen ondergaan;
        - *korrelvormige afvalstoffen:* afvalstoffen, niet zijnde monolithische afvalstoffen;
        - *monolithische afvalstoffen:* afvalstoffen die door menging met toeslagstoffen of andersoortige bewerkingen zijn
      omgevormd tot afvalstoffen met een beperkte uitloging en een duurzame vaste vorm;
        - *omschrijving:* omschrijving als bedoeld in [artikel 10.39, eerste lid, onder a, van de Wet milieubeheer][ref1];
        - *ondergrondse stortplaats:* stortplaats waar afvalstoffen in de diepe ondergrond worden gebracht;
        - *Raad voor Accreditatie:* Stichting Raad voor Accreditatie te Utrecht;
        - *regelmatige afvalstoffen:* afvalstoffen die regelmatig tijdens hetzelfde proces ontstaan en een constante
      samenstelling hebben;
        - *stabiele, niet-reactieve gevaarlijke afvalstoffen:* gevaarlijke afvalstoffen waarvan het uitlooggedrag onder
      normale omstandigheden niet in ongunstige zin verandert.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 11c.1
    text: |-
      Aan een omgevingsvergunning die betrekking heeft op een stortplaats als bedoeld in
      [artikel 3.85, eerste lid van het Besluit activiteiten leefomgeving][ref1] verbindt het bevoegd gezag
      voorschriften, waarin ten minste is opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel3
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '3'
  - number: 11c.1.a
    text: |-
      tot welke van de hierna volgende klassen de stortplaats, dan wel de onderscheiden delen van de stortplaats,
      behoort:
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11c
  - number: 11c.1.a.1°
    text: stortplaats voor inerte afvalstoffen, niet zijnde een ondergrondse stortplaats;
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11c
  - number: 11c.1.a.2°
    text: stortplaats voor niet-gevaarlijke afvalstoffen, niet zijnde een ondergrondse stortplaats;
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11c
  - number: 11c.1.a.3°
    text: stortplaats voor gevaarlijke afvalstoffen, niet zijnde een ondergrondse stortplaats;
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11c
  - number: 11c.1.a.4°
    text: ondergrondse stortplaats;
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11c
  - number: 11c.1.b
    text: een lijst van de afvalstoffen die op de stortplaats of het desbetreffende deel van de stortplaats worden gestort;
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11c
  - number: 11c.1.c
    text: de hoeveelheid afvalstoffen die ten hoogste op de stortplaats wordt gestort;
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11c
  - number: 11c.1.d
    text: |-
      maatregelen voor het voorkomen of beperken van overlast en risico's ten gevolge van: - stank en stof,
        - zwerfvuil,
        - lawaai en verkeer,
        - vogels, ongedierte en insekten,
        - aërosolen, en
        - brand.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11c
  - number: 11c.2
    text: 'Ten aanzien van de toegankelijkheid van de stortplaats verbindt het bevoegd gezag aan een zodanige vergunning:'
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11c
  - number: 11c.2.a
    text: voorschriften, inhoudende dat de omheining zodanig is dat vrije toegang tot de stortplaats niet mogelijk is, en
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11c
  - number: 11c.2.b
    text: |-
      voorschriften, inhoudende een controle- en toegangssysteem dat bestaat uit een programma van maatregelen om
      illegaal storten van afvalstoffen op de stortplaats op te sporen of tegen te gaan.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11c
  - number: 11c.3
    text: |-
      Voorts verbindt het bevoegd gezag aan een zodanige vergunning voorschriften, inhoudende dat ten minste eenmaal
      per jaar aan het bevoegd gezag verslag wordt uitgebracht over de soorten en hoeveelheden afvalstoffen die op de
      stortplaats zijn gestort.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11c
  - number: 11d
    text: |-
      Het bevoegd gezag kan aan een omgevingsvergunning als bedoeld in [artikel 11c, eerste lid][ref1], voorschriften
      verbinden die afwijken van de bijlage bij dit besluit, voor zover dit uitdrukkelijk in die bijlage is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel11c
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: 11c
        paragraaf: '2'
  - number: 11f.1
    text: 'Het is verboden op een stortplaats afvalstoffen te accepteren:'
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
  - number: 11f.1.a
    text: die geen behandeling hebben ondergaan,
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
  - number: 11f.1.b
    text: |-
      indien aan degene die de stortplaats exploiteert, met betrekking tot de afvalstoffen geen omschrijving is verstrekt
      die voldoet aan [artikel 10 van het Besluit melden bedrijfsafvalstoffen en gevaarlijke afvalstoffen][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel10
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: '10'
  - number: 11f.1.c
    text: 'die blijkens de omschrijving die aan degene die de stortplaats exploiteert is verstrekt, in geval van:'
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
  - number: 11f.1.c.1°
    text: |-
      een stortplaats als bedoeld in [artikel 11c, eerste lid, onder a, onder 1°][ref1]: niet voldoen aan de bij of
      krachtens onderdeel 1 van de bijlage bij dit besluit gestelde voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel11c
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: 11c
        paragraaf: '2'
  - number: 11f.1.c.2°
    text: |-
      een stortplaats als bedoeld in [artikel 11c, eerste lid, onder a, onder 2°][ref1]: niet voldoen aan de bij of
      krachtens onderdeel 2 van de bijlage bij dit besluit gestelde voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel11c
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: 11c
        paragraaf: '2'
  - number: 11f.1.c.3°
    text: |-
      een stortplaats als bedoeld in [artikel 11c, eerste lid, onder a, onder 3°][ref1]: niet voldoen aan de bij of
      krachtens onderdeel 3 van de bijlage bij dit besluit gestelde voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel11c
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: 11c
        paragraaf: '2'
  - number: 11f.1.c.4°
    text: |-
      een stortplaats als bedoeld in [artikel 11c, eerste lid, onder a, onder 4°][ref1]: niet voldoen aan de bij of
      krachtens onderdeel 4 van de bijlage bij dit besluit gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel11c
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: 11c
        paragraaf: '2'
  - number: 11f.2
    text: 'Het verbod, bedoeld in het eerste lid, aanhef en onder a, geldt niet ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
  - number: 11f.2.a
    text: 'inerte afvalstoffen: indien de behandeling technisch niet realiseerbaar is, en'
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
  - number: 11f.2.b
    text: |-
      andere afvalstoffen: indien de behandeling niet bijdraagt aan het beperken van de negatieve gevolgen van het
      storten voor de volksgezondheid of het milieu.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
  - number: 11f.3
    text: Het verbod, bedoeld in het eerste lid, aanhef en onder c, geldt niet ten aanzien van monolithische afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
  - number: 11f.4
    text: 'Degene die een stortplaats exploiteert:'
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
  - number: 11f.4.a
    text: |-
      bewaart de in het eerste lid, onder c, bedoelde omschrijving gedurende vijf jaar nadat de laatste partij
      afvalstoffen waarop de omschrijving betrekking heeft, is geaccepteerd, en
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
  - number: 11f.4.b
    text: |-
      stelt het bevoegd gezag onverwijld in kennis van een weigering om afvalstoffen te accepteren, waarbij melding wordt
      gemaakt van de naam van degene van wie de afvalstoffen afkomstig zijn en van de aard van de afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
  - number: 11f.5
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de acceptatie van gevaarlijke,
      anorganische, monolithische afvalstoffen. Bij de regeling, bedoeld in de eerste volzin, worden tevens regels
      gesteld met betrekking tot de wijze van storten van zodanige afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
  - number: 11f.6
    text: |-
      Het verbod, bedoeld in het eerste lid, aanhef en onder c, onder 3°, geldt niet voor metallisch kwik met een
      kwikgehalte hoger dan 99,9 gewichtsprocent.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
  - number: 11f.7
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de aanvaardingsprocedures
      voor en de wijze van de tijdelijke opslag van metallisch kwik op stortplaatsen als bedoeld in
      [artikel 11c, eerste lid, onder a, onder 3° en 4°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel11c
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: 11c
        paragraaf: '2'
  - number: 11g.1
    text: |-
      Degene die een stortplaats exploiteert, verricht alvorens afvalstoffen te accepteren, achtereenvolgens de volgende
      handelingen:
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11g
  - number: 11g.1.a
    text: |-
      hij controleert de volledigheid van de in de omschrijving, bedoeld in [artikel 11f, eerste lid, onder c][ref1],
      opgenomen gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel11f
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11g
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: 11f
        paragraaf: '2'
  - number: 11g.1.b
    text: hij onderwerpt de afvalstoffen aan een visuele inspectie.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11g
  - number: 11g.2
    text: |-
      De visuele inspectie, bedoeld in het eerste lid, kan plaatsvinden op de plaats van verzending van de afvalstoffen
      naar de stortplaats, in gevallen waarin de stortplaats deel uitmaakt van dezelfde locatie waarop de afvalstoffen
      zijn vrijgekomen.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11g
  - number: 11g.3
    text: |-
      Het bevoegd gezag kan voorschriften aan de omgevingsvergunning verbinden, inhoudende een verplichting om de
      afvalstoffen aan een uitgebreide inspectie te onderwerpen. Indien toepassing wordt gegeven aan de eerste volzin,
      worden aan de omgevingsvergunning voorschriften verbonden met betrekking tot de wijze waarop, de frequentie waarmee
      en de plaats waar de uitgebreide inspectie moet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11g
  - number: 11g.4
    text: |-
      De monsters die in het kader van de visuele inspectie zijn genomen, worden gedurende een periode van ten minste een
      maand nadat deze zijn genomen, bewaard.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11g
  - number: 11g.5
    text: |-
      De persoon, bedoeld in het eerste lid, registreert de datum, het tijdstip en de resultaten van de visuele
      inspectie.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11g
  - number: 11h.1
    text: |-
      Degene die een stortplaats exploiteert, draagt er zorg voor dat ten minste eenmaal per jaar door middel van het
      nemen en analyseren van monsters wordt gecontroleerd of de regelmatige afvalstoffen die hij accepteert:
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11h
  - number: 11h.1.a
    text: |-
      in overeenstemming zijn met de omschrijving, bedoeld in [artikel 11f, eerste lid, onder c][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel11f
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11h
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: 11f
        paragraaf: '2'
  - number: 11h.1.b
    text: voldoen aan de ingevolge dat onderdeel van toepassing zijnde voorschriften.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11h
  - number: 11h.2
    text: |-
      Hij draagt er tevens zorg voor dat met betrekking tot de monsterneming en analyse van monsters gegevens worden
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11h
  - number: 11h.3
    text: |-
      De analyse van de monsters wordt uitgevoerd door een persoon of instelling die beschikt over een bewijs
      waarmee de Raad voor Accreditatie of een daaraan gelijkwaardig instituut in een andere lidstaat van de
      Europese Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een
      daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, kenbaar heeft gemaakt dat gedurende
      de periode waarin deze worden uitgevoerd, een gerechtvaardigd vertrouwen bestaat dat de betrokken persoon
      of instelling competent is voor het uitvoeren van de analyse overeenkomstig de krachtens het vierde lid
      gestelde regels. Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om accreditatie als
      bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11h
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 11h.4
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld omtrent de monsterneming, de analyse van monsters en
      de registratie.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11h
  - number: 11h.5
    text: |-
      Het eerste lid is niet van toepassing op afvalstoffen waarvoor ingevolge
      __REF000___________________________________________________________________________________________________________
      _______________ de in het eerste lid van dat artikel gestelde verplichting niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel10a
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11h
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: 10a
  - number: 11h.6
    text: |-
      Degene die een stortplaats exploiteert, bewaart de resultaten van de analyse van een monster gedurende vijf jaar
      nadat de analyse is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11h
  - number: 11h.7
    text: Het is verboden te doen handelen in strijd met het derde lid.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11h
  - number: 11h.8
    text: Dit artikel is niet van toepassing op monolithische afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11h
  - number: 11i.1
    text: Degene die een stortplaats exploiteert, registreert de op de stortplaats geaccepteerde afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11i
  - number: 11i.2
    text: |-
      De registratie, bedoeld in het eerste lid, omvat ten minste een overzicht van de stortvakken en stortlagen waar
      afvalstoffen zijn gestort.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11i
  - number: 11k.1
    text: |-
      Voor de toepassing van dit artikel wordt onder radioactieve afvalstof, natuurlijke bron, activiteit
      en activiteitsconcentratie verstaan hetgeen daaronder wordt verstaan in [artikel 1.2][ref1] juncto de
      [bijlagen 1][ref2] en [2 van het Besluit basisveiligheidsnormen stralingsbescherming][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0040179
      [ref3]: https://wetten.overheid.nl/BWBR0040179
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11k
    references:
      - id: ref1
        bwb_id: BWBR0040179
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0040179
      - id: ref3
        bwb_id: BWBR0040179
  - number: 11k.2
    text: |-
      Dit besluit is, met uitzondering van [paragraaf 1][ref1], van overeenkomstige toepassing op radioactieve
      afvalstoffen afkomstig van handelingen met natuurlijke bronnen waarvan de activiteitsconcentratie van de
      radionucliden in de betrokken natuurlijke bronnen gelijk is aan of hoger is dan de desbetreffende bij of krachtens
      [artikel 3.20][ref2] of [3.21 van het Besluit basisveiligheidsnormen stralingsbescherming][ref3] vastgestelde
      vrijgavewaarde en lager is dan tien maal deze waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0040179#Artikel3
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11k
    references:
      - id: ref1
        bwb_id: BWBR0009094
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0040179
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0040179
        artikel: '3'
  - number: 11k.3
    text: |-
      Voor zover ingevolge het tweede lid dit besluit van overeenkomstige toepassing is op de in dat lid bedoelde
      afvalstoffen, worden die afvalstoffen, in afwijking van [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1],
      voor de toepassing van dit besluit en de daarop berustende bepalingen mede aangemerkt als afvalstoffen in de zin
      van [die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11k
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003245
  - number: 11k.4
    text: |-
      Het is verboden afvalstoffen als bedoeld in het tweede lid te vermengen met of te voegen bij een afvalstof waarvoor
      ingevolge [paragraaf 1][ref1] een stortverbod geldt, teneinde die afvalstof te storten.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel11k
    references:
      - id: ref1
        bwb_id: BWBR0009094
        paragraaf: '1'
  - number: '12'
    text: 'Na inwerkingtreding van dit besluit:'
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel12
  - number: 12.a
    text: |-
      berusten de krachtens het Besluit stortverbod afvalstoffen (Stb. 1995, 345) vastgestelde regels en andere besluiten
      op dit besluit;
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel12
  - number: 12.b
    text: |-
      worden de met toepassing van het Besluit stortverbod afvalstoffen (Stb. 1995, 345) vastgestelde regels en andere
      besluiten gelijkgesteld met regels onderscheidenlijk besluiten, vastgesteld met toepassing van dit besluit.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel12
  - number: 12a
    text: |-
      Dit besluit berust mede op [artikel 32, eerste lid, van de Kernenergiewet][ref1],
      [artikel 5.34, tweede lid, van de Omgevingswet][ref2] en de [artikelen 8.40][ref3] en
      [10.2, tweede lid, van de Wet milieubeheer][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '14.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop vier weken zijn verstreken sedert
      de datum van uitgifte van het Staatsblad waarin het wordt geplaatst met uitzondering van
      [artikel 1, eerste lid, categorieën 11, 13, 17, 18, 23 en 25][ref1], [artikel 2, onderdeel b][ref2],
      [artikel 6, tweede lid][ref3], en [artikel 9][ref4]; deze artikelen of onderdelen daarvan treden in werking op een
      bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend
      kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009094#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009094#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0009094#Artikel9
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009094
        artikel: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009094
        artikel: '6'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0009094
        artikel: '9'
        paragraaf: '1'
  - number: '14.2'
    text: |-
      [Artikel 2, onder a][ref1], vervalt met ingang van een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel2
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '2'
        paragraaf: '1'
  - number: '15'
    text: 'Dit besluit wordt aangehaald als: Besluit stortplaatsen en stortverboden afvalstoffen.'
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel15
