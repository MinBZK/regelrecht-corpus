  - number: '1.2'
    text: |-
      Een wijziging van de bijlage bij beschikking nr. 2000/532/EG of van bijlage III bij de Kaderrichtlijn afvalstoffen
      gaat voor de toepassing van het eerste lid gelden met ingang van de dag waarop aan die wijziging uitvoering moet
      zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel1
  - number: 1a.1
    text: |-
      Onze minister van Infrastructuur en Waterstaat kan op verzoek een verklaring afgeven waaruit blijkt dat grond als
      bedoeld in [artikel 1, eerste lid, onderdelen 17a, 17b, 30 en 31][ref1], van dit besluit niet reinigbaar en niet
      koud-immobiliseerbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '1'
        paragraaf: '1'
  - number: 1a.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de beoordeling van de reinigbaarheid van grond
      en het afgeven van een verklaring van niet reinigbaarheid van grond.
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel1a
  - number: '2'
    text: |-
      In dit besluit en de daarop berustende regels wordt verstaan onder stortplaats hetgeen daaronder wordt verstaan in
      de [bijlage bij de Omgevingswet](onbekend).
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het is verboden afvalstoffen als bedoeld in [artikel 1, eerste lid][ref1], anders dan voor het opslaan, op of in de
      bodem te brengen, anders dan deze te storten op een stortplaats of winningsafvalvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '1'
        paragraaf: '1'
  - number: '3.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3
  - number: 3.2.a
    text: huishoudelijke afvalstoffen die nog niet zijn ingezameld of afgegeven;
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3
  - number: 3.2.b
    text: afvalwater;
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3
  - number: 3.2.c
    text: plantenresten die zijn aangewezen bij regeling van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3
  - number: 3.2.d
    text: |-
      het op of in de bodem brengen van meststoffen, bedoeld in
      [paragraaf 3.2.20 van het Besluit activiteiten leefomgeving][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Paragraaf3.2.20
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3
