    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3
  - number: '3.5'
    text: |-
      Als categorie van gevallen als bedoeld in [artikel 10.2, tweede lid, van de Wet milieubeheer][ref1], zijn de in het
      tweede lid onder b tot en met g en de in het vierde lid onder b en c aangegeven gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0009094/2026-01-01#Artikel3
    references:
