    text: |-
      niet-geïdentificeerde of nieuwe chemische stoffen, die afkomstig zijn van onderzoek, ontwikkelingsactiviteiten of
      onderwijs en waarvan de effecten op de volksgezondheid of het milieu niet bekend zijn.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel1
  - number: '1.2'
    text: |-
      Het verbod als bedoeld in het eerste lid, onder 1 tot en met 11, geldt alleen voor zover deze afvalstoffen
      afzonderlijk zijn ingezameld of afgegeven.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel1
  - number: '1.3'
    text: |-
      Een wijziging in de bijlage van beschikking nr. 2000/532/EG gaat voor de toepassing van het eerste lid gelden met
      ingang van de dag waarop aan die wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel1
  - number: '1.3'
    text: |-
      Een wijziging van de in het eerste lid, onderdeel 34, bedoelde bijlage gaat voor de toepassing van dat onderdeel
      gelden met ingang van de dag waarop aan de betreffende wijziging uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel1
  - number: '1.4'
    text: |-
      Het is verboden afvalstoffen te verdunnen of te vermengen om te voldoen aan de criteria, bedoeld in
      [artikel 11b, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel11b
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: 11b
        paragraaf: '2'
  - number: '2'
    text: |-
      Het in [artikel 1][ref1] gestelde verbod geldt niet met betrekking tot afvalstoffen, behorende tot de categorieën,
      genoemd in [artikel 1][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009094#Artikel1
