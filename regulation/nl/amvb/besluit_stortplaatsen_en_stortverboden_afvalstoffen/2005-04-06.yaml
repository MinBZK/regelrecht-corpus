        artikel: '1'
  - number: 3.2.b
    text: de categorieën 20 en 21.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel3
  - number: '4.1'
    text: |-
      In afwijking van [artikel 1][ref1] kan het bevoegd gezag bij het verlenen of wijzigen van een vergunning
      krachtens [artikel 8.1 van de Wet milieubeheer][ref2] in de daaraan te verbinden voorschriften bepalen dat het in
      [artikel 1][ref3] gestelde verbod niet geldt met betrekking tot het storten van afvalstoffen, behorende tot een
      daarbij aangewezen, in dat artikel genoemde categorie, voor zover dat in het belang van een doelmatig beheer van
      afvalstoffen noodzakelijk is, in gevallen waarin naar het oordeel van het bevoegd gezag:


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009094#Artikel1
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0009094
        artikel: '1'
        paragraaf: '1'
  - number: 4.1.a
    text: |-
      een tijdelijke stagnatie optreedt in de afzetmogelijkheden van een produkt dat is verkregen door be- of verwerking
      van de betrokken afvalstoffen, terwijl daarvoor geen andere be- of verwerkingsmogelijkheid beschikbaar is, of
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel4
  - number: 4.1.b
    text: een tijdelijk gebrek aan beheersmogelijkheden voor de betrokken afvalstoffen bestaat of ontstaat, of
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel4
  - number: 4.1.c
    text: door een ongewoon voorval het op een andere wijze beheren van de betrokken afvalstoffen niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel4
  - number: '4.2'
    text: |-
      Indien het bevoegd gezag toepassing geeft aan het eerste lid, zendt het een afschrift van de vergunning aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel4
  - number: '4.3'
    text: |-
      Het bevoegd gezag stemt slechts in met de toepassing van een op grond van het eerste lid in de vergunning opgenomen
      voorschrift, voor zover Onze Minister verklaart dat geen andere wijze van afvalbeheer mogelijk is.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel4
  - number: '4.4'
    text: |-
      Onze Minister wijst bij ministeriële regeling de gegevens aan, die het bevoegd gezag ten behoeve van het toepassen
      van het derde lid aan hem verstrekt. Onze Minister kan categorieën van gevallen aanwijzen, waarin het tweede en het
      derde lid niet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel4
  - number: '4.5'
    text: |-
      Het eerste lid geldt niet voor de categorieën van afvalstoffen, genoemd in
      [artikel 1, eerste lid, onder 6, 15, 33, 34 en 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '1'
        paragraaf: '1'
  - number: '4.6'
    text: |-
      Het bevoegd gezag verbindt aan de vergunning geen voorschrift als bedoeld in het eerste lid, indien daardoor strijd
      zou ontstaan met het ingevolge [artikel 11b][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel11b
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: 11b
        paragraaf: '2'
  - number: '5'
    text: |-
      Degene die voldoet aan de eisen ter zake van het bewerken van bouw- en sloopafval en residuen afkomstig van
      het bewerken van bouw- en sloopafval, zoals die zijn gesteld door een door de Raad voor Accreditatie erkende
      certificatie-instelling, is gemachtigd een merkteken te voeren dat daartoe door Onze Minister bij ministeriële
      regeling is vastgesteld. Onze Minister kan voor verschillende categorieën van gevallen verschillende merktekens
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel5
  - number: '6.1'
    text: |-
      Bij ministeriële regeling geeft Onze Minister de gevallen aan, waarin bouw- en sloopafval en residuen afkomstig van
      het bewerken van bouw- en sloopafval niet herbruikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel6
  - number: '6.2'
    text: |-
      Bij ministeriële regeling kan Onze Minister voorts de gevallen aangeven, waarin niet herbruikbaar bouw- en
      sloopafval en niet herbruikbare residuen afkomstig van het bewerken van bouw- en sloopafval niet verbrandbaar zijn.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel6
  - number: '7'
    text: Bij ministeriële regeling geeft Onze Minister de gevallen aan, waarin straalgrit niet reinigbaar is.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel7
  - number: '11'
    text: |-
      Voor een inrichting waarvoor een verbod als bedoeld in de [artikelen 1][ref1] of [3][ref2] gaat gelden en waarin
      onmiddellijk voorafgaand aan het tijdstip waarop dat verbod gaat gelden, handelingen plegen te worden verricht,
      als waarop dat verbod betrekking heeft, blijft dat verbod met betrekking tot die handelingen buiten toepassing
      gedurende 3 maanden na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009094#Artikel3
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009094
        artikel: '3'
        paragraaf: '1'
  - number: 11a.1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11a
  - number: 11a.1.a
    text: |-
      stortplaats: hetgeen daaronder wordt verstaan in [artikel 8.47, eerste lid, onder b, van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 11a.1.b
    text: |-
      behandeling: fysische, thermische, chemische of biologische processen, met inbegrip van het sorteren, die de
      eigenschappen van de afvalstoffen zodanig veranderen dat het volume of de gevaarlijke eigenschappen worden
      gereduceerd, de behandeling wordt vergemakkelijkt of de nuttige toepassing wordt bevorderd;
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11a
  - number: 11a.1.c
    text: |-
      inerte afvalstoffen: onbrandbare afvalstoffen die geen significante fysische, chemische of biologische
      veranderingen ondergaan.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11a
  - number: 11a.2
    text: |-
      De bij of krachtens dit besluit gestelde voorschriften ter uitvoering van [richtlijn nr. 1999/31/EG](31999L0031)
      van de Raad van de Europese Unie van 26 april 1999 betreffende het storten van afvalstoffen (PbEG L 182),
      zijn, met uitzondering van de artikelen waarvoor op grond van de richtlijn vrijstelling kan worden gegeven, van
      overeenkomstige toepassing op een permanente afvalopslagvoorziening in diepe onderaardse ruimten.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11a
  - number: 11a.3
    text: |-
      Een wijziging van de in het tweede lid bedoelde richtlijn gaat voor de toepassing van dat lid gelden met ingang van
      de dag waarop aan de betreffende wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11a
  - number: 11b.1
    text: |-
      Het bevoegd gezag verbindt aan een vergunning als bedoeld in
      [artikel 8.1, eerste lid, van de Wet milieubeheer][ref1], voor een stortplaats, voorschriften, inhoudende een
      verbod op de stortplaats afvalstoffen te accepteren:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 11b.1.a
    text: die niet zijn behandeld;
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11b
  - number: 11b.1.b
    text: |-
      die niet voldoen aan de criteria, die in [bijlage I][ref1], behorende bij dit besluit, zijn aangegeven voor de
      acceptatie op een stortplaats van de desbetreffende klasse.


      [ref1]: https://wetten.overheid.nl/BWBR0009094
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0009094
  - number: 11b.2
    text: 'Het verbod, bedoeld in het eerste lid, aanhef en onder a, geldt niet ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11b
  - number: 11b.2.a
    text: 'inerte afvalstoffen: indien de behandeling technisch niet realiseerbaar is;'
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11b
  - number: 11b.2.b
    text: |-
      andere afvalstoffen: indien de behandeling niet bijdraagt aan het beperken van de negatieve gevolgen van het
      storten voor de volksgezondheid of het milieu.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11b
  - number: 11b.3
    text: |-
      Onze Minister stelt nadere regels met betrekking tot de acceptatie van geconditioneerde gevaarlijke afvalstoffen
      als bedoeld in [bijlage I][ref1], behorende bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009094
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0009094
  - number: 11c.1
    text: 'Aan de vergunning verbindt het bevoegd gezag verder voorschriften of beperkingen, waarin ten minste is opgenomen:'
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11c
  - number: 11c.1.a
    text: |-
      tot welke van de hierna volgende klassen de stortplaats, dan wel de onderscheiden delen van de stortplaats,
      behoort:
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11c
  - number: 11c.1.a.1°
    text: stortplaats voor gevaarlijke afvalstoffen,
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11c
  - number: 11c.1.a.2°
    text: stortplaats voor niet-gevaarlijke afvalstoffen,
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11c
  - number: 11c.1.a.3°
    text: stortplaats voor inerte afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11c
  - number: 11c.1.b
    text: een lijst van de afvalstoffen die op de stortplaats of het desbetreffende deel van de stortplaats worden gestort;
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11c
  - number: 11c.1.c
    text: de hoeveelheid afvalstoffen die ten hoogste op de stortplaats wordt gestort;
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11c
  - number: 11c.1.d
    text: |-
      de verplichting voor degene die de stortplaats drijft, om het bevoegd gezag onverwijld overeenkomstig
      [bijlage II][ref1] in kennis te stellen van een weigering om de afvalstoffen te accepteren, en


      [ref1]: https://wetten.overheid.nl/BWBR0009094
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0009094
  - number: 11c.1.e
    text: |-
      maatregelen voor het voorkomen of beperken van overlast en risico's ten gevolge van: - stank en stof,
        - zwerfvuil,
        - lawaai en verkeer,
        - vogels, ongedierte en insekten,
        - aërosolen, en
        - brand.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11c
  - number: 11c.2
    text: 'Ten aanzien van de toegankelijkheid van de stortplaats verbindt het bevoegd gezag aan de vergunning:'
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11c
  - number: 11c.2.a
    text: voorschriften, inhoudende dat de omheining zodanig is dat vrije toegang tot de stortplaats niet mogelijk is, en
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11c
  - number: 11c.2.b
    text: |-
      voorschriften, inhoudende een controle- en toegangssysteem dat bestaat uit een programma van maatregelen om
      illegaal storten van afvalstoffen op de stortplaats op te sporen of tegen te gaan.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11c
  - number: 11c.3
    text: |-
      Voorts verbindt het bevoegd gezag aan een zodanige vergunning voorschriften, inhoudende dat ten minste eenmaal
      per jaar aan het bevoegd gezag verslag wordt uitgebracht over de soorten en hoeveelheden afvalstoffen die op de
      stortplaats zijn gestort.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11c
  - number: 11d
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voor een stortplaats het voorschrift dat degene die de stortplaats
      drijft, bij het in ontvangst nemen van afvalstoffen de procedure volgt, die is aangegeven in [bijlage II][ref1],
      behorende bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009094
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0009094
  - number: 11e.1
    text: |-
      Het bevoegd gezag verbindt aan een vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1] voor
      een inrichting voor de opslag van afvalstoffen het voorschrift dat opslag van afvalstoffen is toegestaan voor een
      termijn van ten hoogste één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 11e.2
    text: |-
      Indien de vergunninghouder ten genoegen van het bevoegd gezag aantoont dat de opslag van afvalstoffen gevolgd wordt
      door nuttige toepassing van afvalstoffen, kan het bevoegd gezag, in afwijking van het eerste lid, aan een zodanige
      vergunning het voorschrift verbinden dat de opslag van afvalstoffen is toegestaan voor een termijn van ten hoogste
      drie jaar.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel11e
  - number: '12'
    text: 'Na inwerkingtreding van dit besluit:'
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel12
  - number: 12.a
    text: |-
      berusten de krachtens het Besluit stortverbod afvalstoffen (Stb. 1995, 345) vastgestelde regels en andere besluiten
      op dit besluit;
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel12
  - number: 12.b
    text: |-
      worden de met toepassing van het Besluit stortverbod afvalstoffen (Stb. 1995, 345) vastgestelde regels en andere
      besluiten gelijkgesteld met regels onderscheidenlijk besluiten, vastgesteld met toepassing van dit besluit.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel12
  - number: '13'
    text: Het Besluit stortverbod afvalstoffen (Stb. 1995, 345) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel13
  - number: '14.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop vier weken zijn verstreken sedert
      de datum van uitgifte van het Staatsblad waarin het wordt geplaatst met uitzondering van
      [artikel 1, eerste lid, categorieën 11, 13, 17, 18, 23 en 25][ref1], [artikel 2, onderdeel b][ref2],
      [artikel 6, tweede lid][ref3], en artikel 9; deze artikelen of onderdelen daarvan treden in werking op een bij
      koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan
      worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009094#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009094#Artikel6
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009094
        artikel: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009094
        artikel: '6'
        paragraaf: '1'
  - number: '14.2'
    text: |-
      [Artikel 2, onder a][ref1], vervalt met ingang van een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel2
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '2'
        paragraaf: '1'
  - number: '15'
    text: 'Dit besluit wordt aangehaald als: Besluit stortplaatsen en stortverboden afvalstoffen.'
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel15
