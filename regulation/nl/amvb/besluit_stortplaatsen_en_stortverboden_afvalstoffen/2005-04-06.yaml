        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005829
  - number: '3.2'
    text: 'Het eerste lid is niet van toepassing voor afvalstoffen behorende tot:'
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel3
  - number: 3.2.a
    text: |-
      categorie 19, voor zover het betreft asfalt- of betongranulaat, afkomstig van het breken of frezen van werken als
      bedoeld in [artikel 1, onderdeel a, van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel1
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel3
    references:
