      dat de grond niet reinigbaar is.
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel2
  - number: '3.1'
    text: |-
      Het is verboden afvalstoffen, behorende tot de categorieën, genoemd in
      [artikel 1][ref1], op of in de bodem te brengen in inrichtingen als bedoeld in
      [bijlage I, categorie 28.1, onder d, van het Inrichtingen- en vergunningenbesluit milieubeheer][ref2], anders dan
      voor het opslaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005829
    url: https://wetten.overheid.nl/BWBR0009094/2005-04-06#Artikel3
