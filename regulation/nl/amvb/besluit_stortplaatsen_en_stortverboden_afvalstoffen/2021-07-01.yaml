  - number: 11k
    text: |-
      1 Voor de toepassing van dit artikel wordt onder radioactieve afvalstof, natuurlijke bron, activiteit
      en activiteitsconcentratie verstaan hetgeen daaronder wordt verstaan in [artikel 1.2][ref1] juncto de
      [bijlagen 1][ref2] en [2 van het Besluit basisveiligheidsnormen stralingsbescherming][ref3].

      2 Dit besluit is, met uitzondering van [paragraaf 1][ref4], van overeenkomstige toepassing op radioactieve
      afvalstoffen afkomstig van handelingen met natuurlijke bronnen waarvan de activiteitsconcentratie van de
      radionucliden in de betrokken natuurlijke bronnen gelijk is aan of hoger is dan de desbetreffende bij of krachtens
      [artikel 3.20][ref5] of [3.21 van het Besluit basisveiligheidsnormen stralingsbescherming][ref6] vastgestelde
      vrijgavewaarde en lager is dan tien maal deze waarde.

      3 Voor zover ingevolge het tweede lid dit besluit van overeenkomstige toepassing is op de in dat lid bedoelde
      afvalstoffen, worden die afvalstoffen, in afwijking van [artikel 1.1, eerste lid, van de Wet milieubeheer][ref7],
      voor de toepassing van dit besluit en de daarop berustende bepalingen mede aangemerkt als afvalstoffen in de zin
      van [die wet][ref8].

      4 Het is verboden afvalstoffen als bedoeld in het tweede lid te vermengen met of te voegen bij een afvalstof
      waarvoor ingevolge [paragraaf 1][ref9] een stortverbod geldt, teneinde die afvalstof te storten.


