preamble:
  text: |-
    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 4 november 1997,
    nr. MJZ97566861, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op de artikelen 8.44, eerste, vierde en zesde lid, van de Wet milieubeheer;

    De Raad van State gehoord (advies van 26 november 1997, nr. W08.97.0711);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 4
    december 1997, nr. MJZ97580608, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
