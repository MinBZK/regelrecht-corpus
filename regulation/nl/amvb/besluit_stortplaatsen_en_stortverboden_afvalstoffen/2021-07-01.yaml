        artikel: '8.47'
  - number: '3'
    text: |-
      1 Het is verboden afvalstoffen als bedoeld in [artikel 1, eerste lid][ref1], anders dan voor het
      opslaan, op of in de bodem te brengen in inrichtingen als bedoeld in categorie 28.1, onder d, van
      [bijlage I, onderdeel C, bij het Besluit omgevingsrecht][ref2].

      2 Het eerste lid is niet van toepassing op afvalstoffen die worden toegepast overeenkomstig het
      [Besluit bodemkwaliteit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027464
