  - number: '4'
    text: |-
      1 Gedeputeerde staten kunnen aan een omgevingsvergunning voor een stortplaats het voorschrift verbinden dat
      voor daarbij aangewezen afvalstoffen het in [artikel 1, eerste lid][ref1], bedoelde verbod niet geldt indien die
      afvalstoffen zijn aangewezen krachtens [artikel 5][ref2], dan wel indien daarvoor een verklaring geldt als bedoeld
      in [artikel 6.][ref3]

      2 In een voorschrift als bedoeld in het eerste lid, bepaalt gedeputeerde staten tevens dat door toepassing van dat
      voorschrift geen strijd mag ontstaan met het ingevolge [artikel 11f][ref4] bepaalde.

      3 Het eerste lid is niet van toepassing op de categorieën van afvalstoffen, genoemd in
      [artikel 1, eerste lid, onder 1 tot en met 14][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009094#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009094#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0009094#Artikel11f
      [ref5]: https://wetten.overheid.nl/BWBR0009094#Artikel1
