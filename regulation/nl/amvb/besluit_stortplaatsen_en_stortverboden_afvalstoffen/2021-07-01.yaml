      a. berusten de krachtens het Besluit stortverbod afvalstoffen (Stb. 1995, 345) vastgestelde regels en andere
      besluiten op dit besluit;

      b. worden de met toepassing van het Besluit stortverbod afvalstoffen (Stb. 1995, 345) vastgestelde regels en andere
      besluiten gelijkgesteld met regels onderscheidenlijk besluiten, vastgesteld met toepassing van dit besluit.
