      1 Degene die een stortplaats drijft, registreert de op de stortplaats geaccepteerde afvalstoffen.

      2 De registratie, bedoeld in het eerste lid, omvat ten minste een overzicht van de stortvakken en stortlagen waar
      afvalstoffen zijn gestort.
