        artikel: '1'
        paragraaf: '1'
  - number: '6'
    text: |-
      1 Op verzoek van degene die een stortplaats drijft, kunnen gedeputeerde staten verklaren dat er
      naar hun oordeel in Nederland geen andere wijze van afvalbeheer mogelijk is dan storten voor in
      [artikel 1, eerste lid, categorie 15][ref1] en volgende, genoemde afvalstoffen of voor een deel van een zodanige
      categorie.

      2 In de verklaring nemen gedeputeerde staten op dat de verklaring geldt zolang de omstandigheden voor toepassing
      van het eerste lid aanwezig zijn, nog gevolgd door een overgangsperiode van tien werkdagen.

      3 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref2] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref3] niet van toepassing op een verzoek om een verklaring
      als bedoeld in het eerste lid.

      4 Van een verklaring als bedoeld in het eerste lid, doen gedeputeerde staten zo spoedig mogelijk mededeling aan
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0009094/2021-07-01#Artikel6
