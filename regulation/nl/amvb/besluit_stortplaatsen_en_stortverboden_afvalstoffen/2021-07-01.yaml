        paragraaf: '2'
  - number: '9'
    text: Bij regeling van Onze Minister worden de gevallen aangewezen, waarin straalgrit niet reinigbaar is.
    url: https://wetten.overheid.nl/BWBR0009094/2021-07-01#Artikel9
  - number: '10'
    text: |-
      Voor een inrichting waarvoor een verbod als bedoeld in de [artikelen 1, eerste lid][ref1], of
      [3, eerste lid][ref2], gaat gelden en waarin in de periode van drie maanden voorafgaand aan het tijdstip waarop dat
      verbod gaat gelden, handelingen plegen te worden verricht, waarop dat verbod betrekking heeft, blijft dat verbod
      met betrekking tot die handelingen buiten toepassing gedurende drie maanden na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009094#Artikel3
    url: https://wetten.overheid.nl/BWBR0009094/2021-07-01#Artikel10
    references:
