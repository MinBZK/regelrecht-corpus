  - number: '2'
    text: |-
      In dit besluit en de daarop berustende regels wordt verstaan onder stortplaats hetgeen daaronder wordt verstaan in
      [artikel 8.47, eerste lid, onder a, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.47
    url: https://wetten.overheid.nl/BWBR0009094/2021-07-01#Artikel2
