articles:
  - number: '1'
    text: |-
      1 Het is verboden in inrichtingen die behoren tot een van de categorieën die zijn aangewezen in onderdeel C van
      [bijlage I bij het Besluit omgevingsrecht][ref1], afvalstoffen te storten, die behoren tot een of meer van de
      navolgende categorieën:









                    1.


                    vloeibare afvalstoffen, niet zijnde metallisch kwik waarvan het storten met het oog op de veilige
      opslag ervan is toegestaan bij of krachtens Verordening (EU) nr. 2017/852 van het Europees Parlement en de Raad van
      17 mei 2017 betreffende kwik, en tot intrekking van Verordening (EG) nr. 1102/2008 (PbEU 2017, L 137);




                    2.


                    afvalstoffen, aangewezen in de bijlage bij beschikking nr. 2000/532/EG van de Commissie van de
      Europese Gemeenschappen van 3 mei 2000 tot vervanging van Beschikking 94/3/EG houdende vaststelling van een
      lijst van afvalstoffen overeenkomstig artikel 1, onder a), van Richtlijn 75/442/EEG van de Raad van de Europese
      Gemeenschappen betreffende afvalstoffen en Beschikking 94/904/EG van de Raad van de Europese Unie tot vaststelling
      van een lijst van gevaarlijke afvalstoffen overeenkomstig artikel 1, lid 4, van Richtlijn 91/689/EEG van de
      Raad van de Europese Gemeenschappen betreffende gevaarlijke afvalstoffen (PbEG 2000, L 226/3) met een van de
      afvalstoffencodes 18 01 01, 18 01 02, 18 01 03*, 18 01 04, 18 01 06*, 18 01 07, 18 01 08*, 18 01 09, 18 01 10*,
      18 02 01, 18 02 02*, 18 02 03, 18 02 05*, 18 02 07*, 18 02 08, 20 01 31* of 20 01 32;




                    3.


                    afvalstoffen die ontplofbaar, corrosief, oxiderend, licht ontvlambaar of ontvlambaar zijn, zoals
      omschreven in bijlage III bij de Kaderrichtlijn afvalstoffen;




                    4.


                    niet-geïdentificeerde of nieuwe chemische stoffen die afkomstig zijn van onderzoek,
      ontwikkelingsactiviteiten of onderwijs en waarvan de effecten op de volksgezondheid of het milieu niet bekend zijn;




                    5.


                    a.


                    kwikhoudende materialen en producten met een gehalte aan kwik van meer dan 50 mg/kg droge stof,
      tenzij:
                    de afvalstof door aanwezigheid van andere gevaarlijke stoffen dan kwik ook na het ontkwikken
      uitsluitend zou kunnen worden gestort, of
      het een afvalstof betreft waarvoor een bedrijf dat voldoende is toegerust en vergund om afvalstoffen te ontkwikken,
      schriftelijk heeft verklaard dat deze afvalstof: niet doelmatig kan worden ontkwikt, of
      zich vanwege de aard of samenstelling niet leent voor ontkwikken;





                    b.


                    kwikhoudende materialen en producten met een gehalte aan kwik van ten hoogste 10 mg/kg droge stof,
      tenzij de afvalstof verontreinigd is met veel onbrandbare verontreinigingen, zodat verbranden leidt tot diffuse
      verspreiding hiervan of tot relatief grote belasting van actief kool in de rookgasreiniging;




                    6.


                    voorwerpen en preparaten die gereguleerde stoffen of nieuwe stoffen bevatten als bedoeld
      in Verordening (EG) nr. 1005/2009 van het Europees Parlement en de Raad van 16 september 2009 betreffende
      ozonlaagafbrekende stoffen (PbEU 2009, L 286/1) of gefluoreerde broeikasgassen bevatten als bedoeld in Verordening
      (EG) nr. 842/2006 van het Europees Parlement en de Raad van 17 mei 2006 inzake bepaalde gefluoreerde broeikasgassen
      (PbEU 2006, L 161/1);




                    7.


                    gasontladingslampen of onderdelen daarvan, met uitzondering van niet-herbruikbaar fluorescentiepoeder
      dat overblijft na het ontkwikken;




                    8.


                    oliefilters;




                    9.


                    batterijen en accu’s;




                    10.


                    PCB-houdende voorwerpen en preparaten met een gehalte van 0,5 mg/kg per polychloorbifenyl-congeneer
      28, 52, 101, 118, 138, 153, 180;




                    11.


                    vast fotografisch afval;




                    12.


                    gasflessen, drukhouders en brandblussers, met uitzondering van bluspoeder;




                    13.


                    autowrakken, zijnde motorrijtuigen op meer dan twee wielen die een afvalstof zijn als bedoeld in
      [artikel 1.1 van de Wet milieubeheer][ref2], of onderdelen van zodanige autowrakken;




                    14.


                    banden, afkomstig van motorrijtuigen en aanhangwagens als bedoeld in
      [artikel 1 van de Wegenverkeerswet 1994][ref3];




                    15.


                    a.


                    huishoudelijk restafval en daarmee vergelijkbaar restafval van bedrijven;





                    b.


                    deelstromen of residuen, afkomstig van de handmatige en mechanische verwerking van stromen restafval
      als bedoeld onder a;




                    16.


                    a.


                    grof huishoudelijk restafval;





                    b.


                    deelstromen of residuen van de handmatige en mechanische verwerking van grof huishoudelijk afval;




                    17.


                    a.


                    slib van riolen, kolken of gemalen, met uitzondering van riool-, kolken- of gemalenslib dat als
      grond, bedoeld in [artikel 1 van het Besluit bodemkwaliteit][ref4], kan worden gekwalificeerd en bij de stortplaats
      wordt aangeboden onder overlegging van een verklaring van Onze Minister als bedoeld in de ministeriële regeling
      op grond van [artikel 28a Wet bodembescherming][ref5], waaruit blijkt dat de grond niet reinigbaar en niet koud-
      immobiliseerbaar is;





                    b.


                    veegvuil, met uitzondering van veegvuil dat als grond, bedoeld in
      [artikel 1 van het Besluit bodemkwaliteit][ref6], kan worden gekwalificeerd en bij de stortplaats wordt aangeboden
      onder overlegging van een verklaring van Onze Minister als bedoeld in de ministeriële regeling op grond van
      [artikel 28a Wet bodembescherming][ref7], waaruit blijkt dat de grond niet reinigbaar en niet koud-immobiliseerbaar
      is;





                    c.


                    marktafval;





                    d.


                    drijfafval;




                    18.


                    bioafval;




                    19.


                    dierlijke bijproducten en afgeleide producten daarvan die vallen onder de werkingssfeer van
      Verordening (EG) nr.1069/2009 van het Europees Parlement en de Raad van 21 oktober 2009 tot vaststelling van
      gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke bijproducten en tot intrekking
      van Verordening (EG) nr. 1774/2002 (Verordening dierlijke bijproducten) (PbEU 2009, L 300/1);




                    20.


                    reststoffen van composterings- of vergistingsinstallaties;




                    21.


                    slib, afkomstig van installaties voor het biologisch reinigen van afvalwater;




                    22.


                    reststoffen van de drinkwaterbereiding;




                    23.


                    a.


                    AVI-bodemas;





                    b.


                    deelstromen of residuen van de mechanische en fysische verwerking van de stromen van bodemas, bedoeld
      onder a;




                    24.


                    reststoffen van slibverbranding;




                    25.


                    reststoffen van kolengestookte energiecentrales;




                    26.


                    a.


                    zuurteer dat vrijkomt bij de petrochemische industrie;





                    b.


                    zwavelhoudend afval met meer dan 5% zwavel;




                    27.


                    a.


                    shredderafval;





                    b.


                    gemengde deelstromen of residuen van de handmatige en mechanische verwerking van de stromen van
      shredderafval, bedoeld onder a;




                    28.


                    oxykalkslik;




                    29.


                    a.


                    gemengd bouw- en sloopafval, met uitzondering van partijen waarvan de concentratie serpentijnasbest,
      vermeerderd met tien maal de concentratie amfiboolasbest, meer bedraagt dan 100 mg/ kg droge stof;





                    b.


                    deelstromen of residuen van de handmatige en mechanische verwerking van de stromen van afval, bedoeld
      onder a, met uitzondering van partijen waarvan de concentratie serpentijnasbest, vermeerderd met tien maal de
      concentratie amfiboolasbest, meer bedraagt dan 100 mg/kg droge stof;




                    30.


                    zeefzand, met uitzondering van zeefzand dat als grond, bedoeld in
      [artikel 1 van het Besluit bodemkwaliteit][ref8], kan worden gekwalificeerd en bij de stortplaats wordt
      aangeboden onder overlegging van een verklaring als bedoeld in de ministeriële regeling op grond van
      [artikel 28a Wet bodembescherming][ref9], waaruit blijkt dat de grond niet reinigbaar en niet koud-immobiliseerbaar
      is;




                    31.


                    grond, met uitzondering van grond, bedoeld in [artikel 1 van het Besluit bodemkwaliteit][ref10], die
      bij de stortplaats wordt aangeboden onder overlegging van een verklaring als bedoeld in de ministeriële regeling
      op grond van [artikel 28a Wet bodembescherming][ref11], waaruit blijkt dat de grond niet reinigbaar en niet koud-
      immobiliseerbaar is;




                    32.


                    straalgrit, met uitzondering van straalgrit dat krachtens [artikel 9][ref12] is aangewezen als niet
      reinigbaar;




                    33.


                    a.








                    b.


                    asbesthoudend staalschroot;




                    34.


                    a.


                    steenachtige materialen, met uitzondering van cellenbeton;





                    b.


                    asfalt dat als teerhoudend wordt aangemerkt vanwege het bevatten van een hoger
      gehalte PAK’s dan de maximale samenstellingswaarde voor PAK’s in bouwstoffen, bedoeld in
      [bijlage A, tabel 2, van de Regeling bodemkwaliteit][ref13];




                    35.


                    gips;




                    36.


                    a.


                    bitumineus dakafval;





                    b.


                    dakafval dat als teerhoudend wordt aangemerkt vanwege het bevatten van een
      hoger gehalte PAK’s dan de maximale samenstellingswaarde voor PAK’s in bouwstoffen, bedoeld in
      [bijlage A, tabel 2, van de Regeling bodemkwaliteit][ref14];





                    c.


                    composieten van dakafval bestaande uit mengsels van bitumineus of teerhoudend dakafval en mengsels
      van bitumineus of teerhoudend dakafval dat verkleefd of vermengd is met andere materialen;





                    d.


                    met teer of bitumen verkleefd dakgrind;




                    37.


                    a.


                    A-hout, zijnde ongeverfd, onbehandeld hout;





                    b.


                    B-hout, zijnde hout dat niet A-hout of C-hout is;





                    c.


                    C-hout, zijnde geïmpregneerd hout, met uitzondering van gewolmaniseerd C-hout;




                    38.


                    metalen;




                    39.


                    papier en karton;




                    40.


                    kunststof- en rubberafval;




                    41.


                    glas;




                    42.


                    textiel;




                    43.


                    a.


                    verpakkingen, niet zijnde verpakkingen als bedoeld onder b of c;





                    b.


                    verpakkingen van verf, lijm, kit of hars;





                    c.


                    verpakkingen van overige gevaarlijke stoffen;




                    44.


                    a.


                    papier- en kunststofgeïsoleerde kabels en restanten daarvan;





                    b.


                    glasvezelkabels;




                    45.


                    elektrische en elektronische apparatuur, bedoeld in
      [artikel 1, eerste lid, onder f, van de Regeling afgedankte elektrische en elektronische apparatuur][ref15], met
      uitzondering van glas van de verwerking van zwart-wit CRT-beeldbuizen en de conus van kleur CRT-beeldbuizen, zowel
      glas dat gescheiden als in een gemengde fractie wordt aangeleverd;






      2 Een wijziging van de bijlage bij beschikking nr. 2000/532/EG of van bijlage III bij de Kaderrichtlijn
      afvalstoffen gaat voor de toepassing van het eerste lid gelden met ingang van de dag waarop aan die wijziging
      uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een
      ander tijdstip wordt vastgesteld.


