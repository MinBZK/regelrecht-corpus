  - number: '8'
    text: |-
      Het is verboden afvalstoffen te verdunnen of te vermengen om te voldoen aan de voorschriften, bedoeld in
      [artikel 11f, eerste lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel11f
    url: https://wetten.overheid.nl/BWBR0009094/2021-07-01#Artikel8
