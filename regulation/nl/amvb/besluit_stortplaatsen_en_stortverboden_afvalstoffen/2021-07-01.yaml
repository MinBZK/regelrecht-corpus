        artikel: '3'
        paragraaf: '1'
  - number: 11a
    text: |-
      In het bepaalde bij of krachtens deze paragraaf wordt verstaan onder:

        - *anorganische afvalstoffen:* afvalstoffen met een organisch stofgehalte van ten hoogste tien procent;
        - *behandeling*: fysische, thermische, chemische of biologische processen, met inbegrip van het sorteren, die
      de eigenschappen van de afvalstoffen zodanig veranderen dat het volume of de gevaarlijke eigenschappen worden
      gereduceerd, de behandeling wordt vergemakkelijkt of de nuttige toepassing wordt bevorderd;
        - *biologisch afbreekbare afvalstoffen*: afvalstoffen die aëroob of anaëroob kunnen worden afgebroken;
        - *cel:* stortvak of een deel daarvan met een bepaalde hoogte;
        - *inerte afvalstoffen*: onbrandbare afvalstoffen die geen significante fysische, chemische of biologische
      veranderingen ondergaan;
        - *korrelvormige afvalstoffen:* afvalstoffen, niet zijnde monolithische afvalstoffen;
        - *monolithische afvalstoffen:* afvalstoffen die door menging met toeslagstoffen of andersoortige bewerkingen zijn
      omgevormd tot afvalstoffen met een beperkte uitloging en een duurzame vaste vorm;
        - *omschrijving:* omschrijving als bedoeld in [artikel 10.39, eerste lid, onder a, van de Wet milieubeheer][ref1];
        - *ondergrondse stortplaats:* stortplaats waar afvalstoffen in de diepe ondergrond worden gebracht;
        - *Raad voor Accreditatie:* Stichting Raad voor Accreditatie te Utrecht;
        - *regelmatige afvalstoffen:* afvalstoffen die regelmatig tijdens hetzelfde proces ontstaan en een constante
      samenstelling hebben;
        - *stabiele, niet-reactieve gevaarlijke afvalstoffen:* gevaarlijke afvalstoffen waarvan het uitlooggedrag onder
      normale omstandigheden niet in ongunstige zin verandert;
        - *vergunning:* een omgevingsvergunning voor een inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.39
    url: https://wetten.overheid.nl/BWBR0009094/2021-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10.39'
  - number: 11c
    text: |-
      1 Aan de vergunning verbindt het bevoegd gezag voorschriften of beperkingen, waarin ten minste is opgenomen:

      a. tot welke van de hierna volgende klassen de stortplaats, dan wel de onderscheiden delen van de stortplaats,
      behoort:

      1°. stortplaats voor inerte afvalstoffen, niet zijnde een ondergrondse stortplaats;

      2°. stortplaats voor niet-gevaarlijke afvalstoffen, niet zijnde een ondergrondse stortplaats;

      3°. stortplaats voor gevaarlijke afvalstoffen, niet zijnde een ondergrondse stortplaats;

      4°. ondergrondse stortplaats;

      b. een lijst van de afvalstoffen die op de stortplaats of het desbetreffende deel van de stortplaats worden
      gestort;

      c. de hoeveelheid afvalstoffen die ten hoogste op de stortplaats wordt gestort;

      d. maatregelen voor het voorkomen of beperken van overlast en risico's ten gevolge van:

        - stank en stof,
        - zwerfvuil,
        - lawaai en verkeer,
        - vogels, ongedierte en insekten,
        - aërosolen, en
        - brand.

      2 Ten aanzien van de toegankelijkheid van de stortplaats verbindt het bevoegd gezag aan de vergunning:

      a. voorschriften, inhoudende dat de omheining zodanig is dat vrije toegang tot de stortplaats niet mogelijk is, en

      b. voorschriften, inhoudende een controle- en toegangssysteem dat bestaat uit een programma van maatregelen om
      illegaal storten van afvalstoffen op de stortplaats op te sporen of tegen te gaan.

      3 Voorts verbindt het bevoegd gezag aan een zodanige vergunning voorschriften, inhoudende dat ten minste eenmaal
      per jaar aan het bevoegd gezag verslag wordt uitgebracht over de soorten en hoeveelheden afvalstoffen die op de
      stortplaats zijn gestort.
    url: https://wetten.overheid.nl/BWBR0009094/2021-07-01#Artikel11c
  - number: 11d
    text: |-
      Het bevoegd gezag kan bij het verlenen of wijzigen van een vergunning afwijken van de voorschriften die in de
      bijlage bij dit besluit zijn opgenomen, voor zover dit uitdrukkelijk in die bijlage is vermeld.
    url: https://wetten.overheid.nl/BWBR0009094/2021-07-01#Artikel11d
  - number: 11e
    text: |-
      1 Het bevoegd gezag verbindt aan een vergunning voor een inrichting voor de opslag van afvalstoffen het voorschrift
      dat opslag van afvalstoffen is toegestaan voor een termijn van ten hoogste één jaar.

      2 Indien de vergunninghouder ten genoegen van het bevoegd gezag aantoont dat de opslag van afvalstoffen gevolgd
      wordt door nuttige toepassing van afvalstoffen, kan het bevoegd gezag, in afwijking van het eerste lid, aan een
      zodanige vergunning het voorschrift verbinden dat de opslag van afvalstoffen is toegestaan voor een termijn van ten
      hoogste drie jaar.

      3 Het bevoegd gezag kan, in afwijking van het eerste en tweede lid, aan een vergunning voor een inrichting
      voor de opslag in oppervlaktewater van baggerspecie niet zijnde een gevaarlijke afvalstof als bedoeld in de
      [Wet milieubeheer][ref1] het voorschrift verbinden dat de opslag is toegestaan voor een termijn van ten hoogste
      tien jaar.

      4 In afwijking van het eerste en tweede lid gelden met betrekking tot de bij voorschrift aan een vergunning, voor
      de opslag van metallisch kwik, te verbinden termijnen de daarover bij of krachtens Verordening (EU) nr. 2017/852
      van het Europees Parlement en de Raad van 17 mei 2017 betreffende kwik, en tot intrekking van Verordening (EG)
      nr. 1102/2008 (PbEU 2017, L 137) gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0009094/2021-07-01#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 11f
    text: |-
      1 Het is verboden op een stortplaats afvalstoffen te accepteren:

      a. die geen behandeling hebben ondergaan,

      b. indien aan degene die de stortplaats drijft, met betrekking tot de afvalstoffen geen omschrijving is verstrekt
      die voldoet aan [artikel 10 van het Besluit melden bedrijfsafvalstoffen en gevaarlijke afvalstoffen][ref1], of

      c. die blijkens de omschrijving die aan degene die de stortplaats drijft is verstrekt, in geval van:

      1°. een stortplaats als bedoeld in [artikel 11c, eerste lid, onder a, onder 1°][ref2]: niet voldoen aan de bij of
      krachtens onderdeel 1 van de bijlage bij dit besluit gestelde voorschriften;

      2°. een stortplaats als bedoeld in [artikel 11c, eerste lid, onder a, onder 2°][ref3]: niet voldoen aan de bij of
      krachtens onderdeel 2 van de bijlage bij dit besluit gestelde voorschriften;

      3°. een stortplaats als bedoeld in [artikel 11c, eerste lid, onder a, onder 3°][ref4]: niet voldoen aan de bij of
      krachtens onderdeel 3 van de bijlage bij dit besluit gestelde voorschriften;

      4°. een stortplaats als bedoeld in [artikel 11c, eerste lid, onder a, onder 4°][ref5]: niet voldoen aan de bij of
      krachtens onderdeel 4 van de bijlage bij dit besluit gestelde voorschriften.

      2 Het verbod, bedoeld in het eerste lid, aanhef en onder a, geldt niet ten aanzien van:

      a. inerte afvalstoffen: indien de behandeling technisch niet realiseerbaar is, en

      b. andere afvalstoffen: indien de behandeling niet bijdraagt aan het beperken van de negatieve gevolgen van het
      storten voor de volksgezondheid of het milieu.

      3 Het verbod, bedoeld in het eerste lid, aanhef en onder c, geldt niet ten aanzien van monolithische afvalstoffen.

      4 Degene die een stortplaats drijft:

      a. bewaart de in het eerste lid, onder c, bedoelde omschrijving gedurende vijf jaar nadat de laatste partij
      afvalstoffen waarop de omschrijving betrekking heeft, is geaccepteerd, en

      b. stelt het bevoegd gezag onverwijld in kennis van een weigering om afvalstoffen te accepteren, waarbij melding
      wordt gemaakt van de naam van degene van wie de afvalstoffen afkomstig zijn en van de aard van de afvalstoffen.

      5 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de acceptatie van gevaarlijke,
      anorganische, monolithische afvalstoffen. Bij de regeling, bedoeld in de eerste volzin, worden tevens regels
      gesteld met betrekking tot de wijze van storten van zodanige afvalstoffen.

      6 Het verbod, bedoeld in het eerste lid, aanhef en onder c, onder 3°, geldt niet voor metallisch kwik met een
      kwikgehalte hoger dan 99,9 gewichtsprocent.

      7 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de aanvaardingsprocedures
      voor en de wijze van de tijdelijke opslag van metallisch kwik op stortplaatsen als bedoeld in
      [artikel 11c, eerste lid, onder a, onder 3° en 4°][ref6].


