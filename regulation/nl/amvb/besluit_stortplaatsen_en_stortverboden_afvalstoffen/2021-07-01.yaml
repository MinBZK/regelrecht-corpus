  - number: 11g
    text: |-
      1 Degene die een stortplaats drijft, verricht alvorens afvalstoffen te accepteren, achtereenvolgens de volgende
      handelingen:

      a. hij controleert de volledigheid van de in de omschrijving, bedoeld in [artikel 11f, eerste lid, onder c][ref1],
      opgenomen gegevens;

      b. hij onderwerpt de afvalstoffen aan een visuele inspectie.

      2 De visuele inspectie, bedoeld in het eerste lid, kan plaatsvinden op de plaats van verzending van de afvalstoffen
      naar de stortplaats, in gevallen waarin de stortplaats deel uitmaakt van dezelfde inrichting als de inrichting
      waarbinnen de afvalstoffen zijn vrijgekomen.

      3 Het bevoegd gezag kan voorschriften aan de vergunning verbinden, inhoudende een verplichting om de afvalstoffen
      aan een uitgebreide inspectie te onderwerpen. Indien toepassing wordt gegeven aan de eerste volzin, worden aan de
      vergunning voorschriften verbonden met betrekking tot de wijze waarop, de frequentie waarmee en de plaats waar de
      uitgebreide inspectie moet plaatsvinden.

      4 De monsters die in het kader van de visuele inspectie zijn genomen, worden gedurende een periode van ten minste
      een maand nadat deze zijn genomen, bewaard.

      5 De persoon, bedoeld in het eerste lid, registreert de datum, het tijdstip en de resultaten van de visuele
      inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel11f
    url: https://wetten.overheid.nl/BWBR0009094/2021-07-01#Artikel11g
