  - number: 11h
    text: |-
      1 Degene die een stortplaats drijft, draagt er zorg voor dat ten minste eenmaal per jaar door middel van het nemen
      en analyseren van monsters wordt gecontroleerd of de regelmatige afvalstoffen die hij accepteert:

      a. in overeenstemming zijn met de omschrijving, bedoeld in [artikel 11f, eerste lid, onder c][ref1], en

      b. voldoen aan de ingevolge dat onderdeel van toepassing zijnde voorschriften.

      2 Hij draagt er tevens zorg voor dat met betrekking tot de monsterneming en analyse van monsters gegevens worden
      geregistreerd.

      3 De analyse van de monsters wordt uitgevoerd door een persoon of instelling die beschikt over een bewijs
      waarmee de Raad voor Accreditatie of een daaraan gelijkwaardig instituut in een andere lidstaat van de
      Europese Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een
      daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, kenbaar heeft gemaakt dat gedurende
      de periode waarin deze worden uitgevoerd, een gerechtvaardigd vertrouwen bestaat dat de betrokken persoon
      of instelling competent is voor het uitvoeren van de analyse overeenkomstig de krachtens het vierde lid
      gestelde regels. Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref2] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref3] niet van toepassing op de aanvraag om accreditatie als
      bedoeld in de eerste volzin.

      4 Bij regeling van Onze Minister worden nadere regels gesteld omtrent de monsterneming, de analyse van monsters en
      de registratie.

      5 Het eerste lid is niet van toepassing op afvalstoffen waarvoor ingevolge
      __REF000___________________________________________________________________________________________________________
      _______________ de in het [eerste lid van dat artikel][ref5] gestelde verplichting niet geldt.

      6 Degene die een stortplaats drijft, bewaart de resultaten van de analyse van een monster gedurende vijf jaar nadat
      de analyse is uitgevoerd.

      7 Het is verboden te doen handelen in strijd met het derde lid.

      8 Dit artikel is niet van toepassing op monolithische afvalstoffen.


