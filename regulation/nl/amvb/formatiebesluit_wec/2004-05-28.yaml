  - number: 24a
    text: |-
      Wijziging in de besteding van de formatie voor personeelsbeleid, kwaliteitsverbetering en innovatie mag niet leiden
      tot kosten van werkloosheidsuitkeringen.
    url: https://wetten.overheid.nl/BWBR0005442/2004-05-28#Artikel24a
  - number: 24b
    text: |-
      Indien het verbruik van het aantal formatierekeneenheden in een maand afwijkt van het aantal formatierekeneenheden,
      dat op grond van het formatiebudget beschikbaar is voor de school, kan een bevoegd gezag het te weinig of te veel
      verbruikte aantal formatierekeneenheden van die maand besteden onderscheidenlijk minder besteden in een of meer
      andere maanden van het schooljaar.
    url: https://wetten.overheid.nl/BWBR0005442/2004-05-28#Artikel24b
  - number: '25'
    text: |-
      1 Het bevoegd gezag van een school dan wel een regionaal expertisecentrum kan telkens voor de periode van
      een schooljaar van het beschikbare formatiebudget formatierekeneenheden overdragen aan een andere school, een
      instelling als bedoeld in [artikel 8, eerste lid, tweede volzin][ref1], van de wet, een basisschool of een speciale
      school voor basisonderwijs van hetzelfde bevoegd gezag of van een ander bevoegd gezag dan wel een regionaal
      expertisecentrum waarbij het bevoegd gezag van de school is aangesloten.

      2 Indien overdracht van formatierekeneenheden als bedoeld in het eerste lid plaatsvindt, delen het bevoegd gezag
      van de overdragende school dan wel het overdragend regionaal expertisecentrum en dat van de ontvangende school of
      de ontvangende instelling als bedoeld in het eerste lid deze overdracht en het aantal formatierekeneenheden dat het
      betreft voor 15 mei voorafgaand aan het desbetreffende schooljaar mee aan Onze Minister. Het bevoegd gezag kan voor
      1 oktober en voor 1 februari van een schooljaar een nadere beslissing als bedoeld in het eerste lid nemen en voor
      die data aan Onze Minister meedelen hoeveel formatierekeneenheden worden overgedragen.

      3 Indien het bevoegd gezag van een school ingevolge artikel 8 op 1 januari van een schooljaar aanspraak kan maken
      op verhoging van de formatie, kan het bevoegd gezag in afwijking van het eerste lid voor de periode van 1 januari
      tot en met 31 juli van het desbetreffende schooljaar de toename in formatierekeneenheden overdragen aan een andere
      school, een instelling als bedoeld in het eerste lid, een basisschool, een speciale school voor basisonderwijs
      of een school voor voortgezet onderwijs van hetzelfde bevoegd gezag of van een ander bevoegd gezag dan wel een
      regionaal expertisecentrum waarbij het bevoegd gezag van de school is aangesloten.

      4 Indien overdracht van formatierekeneenheden als bedoeld in het derde lid plaatsvindt, delen het bevoegd gezag
      van de overdragende school dan wel overdragend regionaal expertisecentrum en dat van de ontvangende school of de
      ontvangende instelling als bedoeld in het eerste lid dan wel ontvangend regionaal expertisecentrum deze overdracht
      en het aantal formatierekeneenheden dat het betreft voor 1 november van het desbetreffende schooljaar mee aan Onze
      Minister.

      5 Overdracht van formatierekeneenheden mag niet leiden tot kosten van werkloosheidsuitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel8
    url: https://wetten.overheid.nl/BWBR0005442/2004-05-28#Artikel25
