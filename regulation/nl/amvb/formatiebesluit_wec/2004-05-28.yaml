      Indien een leerling, die toelaatbaar is verklaard tot een andere onderwijssoort binnen het cluster, bedoeld in
      [artikel 2, vierde lid, van de wet][ref1] dan de onderwijssoort die door de school wordt verzorgd, bij de school
      is ingeschreven met toepassing van [artikel 76a van de wet][ref2], wordt met betrekking tot die leerling voor de
      berekening van de formatie uitgegaan van het aantal formatierekeneenheden dan wel minuten dat is vermeld achter de
      onderwijssoort waarvoor die leerling toelaatbaar is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
