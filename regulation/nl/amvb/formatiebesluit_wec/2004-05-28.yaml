  - number: '4'
    text: |-
      De normatieve formatie van de school, bedoeld in [artikel 3, onderdeel ][ref1], omvat de formatie voor het
      onderwijzend personeel en de schoolleiding, en de formatie voor het onderwijsondersteunend personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel3
    url: https://wetten.overheid.nl/BWBR0005442/2004-05-28#Artikel4
