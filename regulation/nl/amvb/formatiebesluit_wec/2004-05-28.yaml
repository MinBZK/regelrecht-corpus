      1 Het bevoegd gezag van een instelling kan telkens voor de periode van een schooljaar beslissen om ten hoogste 10%
      van de beschikbare formatierekeneenheden minder te besteden dan voor die instelling mogelijk zou zijn op grond van
      [artikel 26][ref1] van dit besluit en op grond van artikel 117, vijfde lid, van de wet.

      2 Het bevoegd gezag neemt een beslissing als bedoeld in het eerste lid voor 15 mei voorafgaande aan het
      desbetreffende schooljaar en deelt deze beslissing en het aantal formatierekeneenheden dat het betreft voor
      die datum mee aan Onze Minister. Het bevoegd gezag kan voor 1 oktober en voor 1 februari van een schooljaar
      een nadere beslissing als bedoeld in het eerste lid nemen en voor die data aan Onze Minister meedelen hoeveel
      formatierekeneenheden worden verzilverd, met dien verstande dat deze nadere beslissingen niet kunnen inhouden dat
      minder formatierekeneenheden worden verzilverd dan voor 15 mei of voor 1 oktober aan Onze Minister is meegedeeld.

      3 Voor zover toepassing is gegeven aan het eerste en tweede lid keert Onze Minister aan het bevoegd gezag van
      een instelling een bedrag uit dat overeenkomt met de geldswaarde van de gedurende het schooljaar niet verbruikte
      formatierekeneenheden.


