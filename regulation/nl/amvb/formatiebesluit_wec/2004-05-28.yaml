  - number: '9'
    text: |-
      1 Onverminderd [artikel 7, vierde lid][ref1], wordt de formatie, bedoeld in de [artikelen 7][ref2], [11][ref3],
      [13][ref4], [13a][ref5] en [22b][ref6], opnieuw berekend indien het verschil tussen

      a. het aantal leerlingen op 16 januari van het schooljaar, en

      b. het aantal leerlingen op 1 oktober van het schooljaar onderscheidenlijk het aantal leerlingen op de teldatum die
      op grond van [artikel 118, tweede lid, van de wet][ref7] van toepassing is,

      gelijk is aan of groter is dan de helft van de kleinste factor N, bedoeld in de tabel in
      [artikel 14 van het Bekostigingsbesluit WEC][ref8], die op de school van toepassing is.

      2 Aanspraak op verhoging van de formatie ingevolge het eerste lid, ontstaat met ingang van 1 augustus van het
      daarop volgende schooljaar.


