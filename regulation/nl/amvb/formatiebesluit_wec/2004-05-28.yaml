      1 Tenzij Onze Minister anders beslist, wordt ten behoeve van een nieuwe school acht weken voor de opening van
      de school 1 formatieplaats voor de directeur en, afhankelijk van het aantal te verwachten leerlingen, bedoeld
      bij de factor B in [artikel 7, tweede lid][ref1], formatie voor de overige leden van de commissie van onderzoek,
      bedoeld in [artikel 41 tweede lid, van de wet][ref2], voor een psychologisch assistent en voor een administratief
      medewerker toegekend. Indien sprake is van een nieuwe afdeling, wordt geen formatieplaats voor een directeur
      toegekend.

      2 De formatieplaats voor de directeur, bedoeld in het eerste lid, wordt uitgedrukt in 251 formatierekeneenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel41
