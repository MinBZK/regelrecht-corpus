  - number: '13'
    text: |-
      1 De formatie van een school met betrekking tot het onderwijsondersteunend personeel wordt per groep, bedoeld in
      [artikel 12, groep a tot en met d][ref1], berekend aan de hand van de formule I' = B * P, afgerond op een veelvoud
      van 15 minuten. De omvang van de gehele formatie van een school met betrekking tot het onderwijsondersteunend
      personeel, genoemd in [artikel 12, groep a tot en met d][ref2], wordt berekend aan de hand van de formule I = de
      som van de afzonderlijke I'.

      2 In de formules, bedoeld in het eerste lid, is:

      I de formatie van de school ten behoeve van het onderwijsondersteunend personeel, genoemd in
      [artikel 12, groep a tot en met d][ref3];

      I' de formatie per groep onderwijsondersteunend personeel, genoemd in [artikel 12, groep a tot en met d][ref4],
      uitgedrukt in minuten en per school afgerond op een veelvoud van 15 minuten;

      B 1. het aantal leerlingen op de teldatum en 2. het aantal leerlingen dat bepalend is voor de formatie ten behoeve
      van leerlingen uit een residentiële instelling als bedoeld in [artikel 117, achtste lid, van de wet][ref5];

      P het aantal minuten per week dat per groep onderwijsondersteunend personeel voor de desbetreffende schoolsoort en
      onderwijsvorm per leerling is aangegeven in [artikel 18][ref6].

      3 Bij de berekening van de formatie, bedoeld in het eerste lid, kan het aantal minuten voor groep b van het
      onderwijsondersteunend personeel voor een school niet meer bedragen dan 3600.

      4 Een leerling die is toegelaten op basis van formatie die is toegekend ten behoeve van leerlingen uit een
      residentiële instelling wordt niet meegeteld als leerling op een teldatum.

      5 De formatie met betrekking tot de groep d van het onderwijsondersteunend personeel wordt verminderd voor zover
      anders dan op grond van [artikel 131][ref7] en [artikel 133 tot en met 141 van de wet][ref8] vergoeding voor dit
      personeel kan worden verkregen.


