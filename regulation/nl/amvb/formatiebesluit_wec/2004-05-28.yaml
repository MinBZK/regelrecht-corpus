  - number: 13a
    text: |-
      1 Ten behoeve van een school waar onderwijs wordt gegeven als bedoeld in [artikel 2, tweede lid, onderdeel ][ref1]
      en een afdeling waar onderwijs wordt gegeven als bedoeld in [artikel 2, tweede lid, onderdeel ][ref2] wordt
      formatie voor groep e van het onderwijsondersteunend personeel toegekend. Onder een school als bedoeld in de eerste
      volzin wordt niet begrepen een aan deze school verbonden afdeling, tenzij het een afdeling betreft waar onderwijs
      wordt gegeven als bedoeld in [artikel 2, tweede lid, onderdeel ][ref3].

      2 Voor de berekening van de formatie, bedoeld in het eerste lid, en het aantal leerlingen worden als een geheel
      beschouwd:

      a. een school als bedoeld in het eerste lid waar zowel speciaal onderwijs als voortgezet speciaal onderwijs in de
      desbetreffende onderwijssoorten wordt gegeven;

      b. een school als bedoeld in het eerste lid met een daaraan verbonden afdeling waar onderwijs wordt gegeven als
      bedoeld in [artikel 2, tweede lid, onderdeel ][ref4].

      3 Onder het aantal leerlingen worden tevens begrepen de leerlingen die tot de school zijn toegelaten op basis van
      formatie die is toegekend ten behoeve van leerlingen uit een residentiële instelling.

      4 Indien het aantal leerlingen op de school op de teldatum kleiner is dan of gelijk is aan 120 bedraagt de in
      het eerste lid bedoelde formatie 1200 minuten per schooljaar, en indien het aantal leerlingen op de school op de
      teldatum groter is dan 120 bedraagt deze formatie 2400 minuten per schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
