      1 Voor zover het een school betreft waar onderwijs wordt gegeven als bedoeld in
      [artikel 2, tweede lid onderdeel a tot en met c, f en h, j, k, m en n, van de wet][ref1] wordt de formatie ten
      behoeve van de ambulante begeleiding in verband met terugplaatsing toegekend volgens het tweede en derde lid.

      2 De formatie van een school ten behoeve van de ambulante begeleiding in verband met terugplaatsing wordt berekend
      aan de hand van de formule H =J * K.

      3 In de formule, bedoeld in het tweede lid, is:

      H het aantal formatierekeneenheden;

      J het aantal leerlingen op de teldatum dat in het direct daaraan voorafgaande schooljaar was toegelaten
      tot een school, niet zijnde een instelling, en dat zonder dat voor hen nog een leerlinggebonden budget
      beschikbaar is, is teruggeplaatst naar een basisschool als bedoeld in de [Wet op het primair onderwijs][ref2],
      een school als bedoeld in de [Wet op het voortgezet onderwijs][ref3] dan wel een opleiding als bedoeld in
      [artikel 7.2.2., eerste lid, onder a en b, van de Wet educatie en beroepsonderwijs][ref4];

      K het aantal formatierekeneenheden per ambulant begeleide leerling, bedoeld in [artikel 17][ref5].

      4 De uitkomst van de formule, bedoeld in het tweede lid, wordt afgerond.


