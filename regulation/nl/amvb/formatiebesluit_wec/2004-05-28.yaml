    text: |-
      1 Van de voor de instelling op grond van [artikel 26a van dit besluit][ref1] en
      [artikel 117, vijfde lid, van de wet][ref2], beschikbare formatierekeneenheden, kan het bevoegd gezag van een
      instelling telkens voor de periode van een schooljaar formatierekeneenheden overdragen aan een school, een andere
      instelling, of een basisschool van hetzelfde bevoegd gezag of van een ander bevoegd gezag.

      2 Indien overdracht van formatierekeneenheden als bedoeld in het eerste lid plaatsvindt, delen het bevoegd gezag
      van de overdragende instelling en dat van de ontvangende school of instelling deze overdracht en het aantal
      formatierekeneenheden dat het betreft voor 15 mei voorafgaand aan het desbetreffende schooljaar mee aan Onze
      Minister. Het bevoegd gezag van de overdragende instelling kan voor 1 oktober en voor 1 februari van een schooljaar
      een nadere beslissing als bedoeld in het eerste lid nemen en voor die data aan Onze Minister meedelen hoeveel
      formatierekeneenheden worden overgedragen.

      3 Overdracht van formatierekeneenheden mag niet leiden tot kosten van ontslaguitkeringen krachtens het
      [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref3].


