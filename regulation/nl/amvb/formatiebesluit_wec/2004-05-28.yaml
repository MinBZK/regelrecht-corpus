    text: |-
      1 Het formatiebudget waarop het bevoegd gezag van een school per schooljaar aanspraak heeft, bestaat uit:

      a. de formatie voor de vervulling van reguliere taken van de school, bedoeld in
      [artikel 117, eerste lid onderdeel ][ref1],

      b. in voorkomende gevallen formatie voor speciale doeleinden, bedoeld in [artikel 117, eerste lid onderdeel ][ref2],

      c. in voorkomende gevallen de verhoging van de formatie als gevolg van het opnieuw berekenen van de formatie bij
      een bepaalde toename van het aantal leerlingen, overeenkomstig de [artikelen 8][ref3] en [9][ref4],

      d. in voorkomende gevallen aanvullende formatie als bedoeld in [artikel 117, derde of vierde lid, van de wet][ref5],

      e. in voorkomende gevallen formatie, bedoeld in
      [artikel 117, zesde, achtste, negende en tiende lid, van de wet][ref6].

      2 De omvang van het formatiebudget is gelijk aan de som van de aantallen formatierekeneenheden zoals voor de school
      berekend op grond van de [artikelen 3 tot en met 23][ref7].


