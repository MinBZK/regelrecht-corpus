  - number: '12'
    text: |-
      Voor de toepassing van de [artikelen 13][ref1], [13a][ref2] en [18][ref3] worden de volgende groepen
      onderwijsondersteunend personeel onderscheiden:

      groep a: administratief medewerker, psychologisch assistent, klassenassistent;

      groep b: conciërge;

      groep c: creatieve therapeut, ergotherapeut, speltherapeut, fysiotherapeut, logopedist, maatschappelijk deskundige,
      akoepedist, schoolverpleegkundige, instructeur mobiliteit;

      groep d: orthopedagoog, psycholoog, medisch specialist, audioloog;

      groep e: technicus.


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005442#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0005442#Artikel18
    url: https://wetten.overheid.nl/BWBR0005442/2004-05-28#Artikel12
