        artikel: '8'
        paragraaf: '2'
  - number: '26'
    text: |-
      1 Het bevoegd gezag van een school kan telkens voor de periode van een schooljaar beslissen minder
      formatierekeneenheden te besteden dan voor die school mogelijk zou zijn op grond van het beschikbare
      formatiebudget, tot ten hoogste:

      a. 10% van het voor de school beschikbare formatiebudget daaronder niet begrepen de formatie voor
      personeelsbeleid, kwaliteitsverbetering en innovatie en het aantal formatierekeneenheden dat nodig is
      voor de bekostiging van de vervanging van het personeel dat gebruik maakt van het verlof op grond van
      [artikel 32, zevende lid, van het Rechtspositiebesluit WPO/WEC][ref1],

      b. de formatie voor personeelsbeleid, kwaliteitsverbetering en innovatie,

      c. het aantal formatierekeneenheden dat nodig is voor het betalen van vergoedingen aan een school voor voortgezet
      onderwijs voor de inzet van personeel,

      d. het aantal formatierekeneenheden dat nodig is voor de bekostiging van de vervanging van het personeel dat
      gebruik maakt van het verlof op grond van [artikel 32, zevende lid, van het Rechtspositiebesluit WPO/WEC][ref2], en

      e. het aantal formatierekeneenheden per personeelslid voor meer werken als bedoeld in
      [artikel 107, tweede lid][ref3], in samenhang met [artikel 295a van het Rechtspositiebesluit WPO/WEC][ref4] dat
      wordt berekend door het totaal aantal uren dat meer is gewerkt, te delen door 1659 en de uitkomst van die deling te
      vermenigvuldigen met het aantal formatierekeneenheden dat voor de betreffende functie bij een normbetrekking wordt
      verbruikt, bedoeld in [artikel 112 van het Rechtspositiebesluit WPO/WEC][ref5].

      In dat geval keert Onze Minister aan het bevoegd gezag van de school een bedrag uit dat overeenkomt met de
      geldswaarde van de gedurende het schooljaar niet verbruikte formatierekeneenheden.

      2 Het verzilveren van formatierekeneenheden, bedoeld in het eerste lid, onderdeel *c*, mag niet leiden tot kosten
      van werkloosheidsuitkeringen.

      3 Het bevoegd gezag neemt een beslissing als bedoeld in het eerste lid voor 15 mei voorafgaande aan het
      desbetreffende schooljaar en deelt dit voor die datum mee aan Onze Minister. Bij die mededeling wordt tevens
      vermeld, hoeveel formatierekeneenheden het betreft. Het bevoegd gezag kan voor 1 oktober en voor 1 februari van een
      schooljaar een nadere beslissing als bedoeld in het eerste lid nemen en voor die data aan Onze Minister meedelen
      hoeveel formatierekeneenheden worden verzilverd, met dien verstande dat deze nadere beslissingen niet kunnen
      inhouden dat minder formatierekeneenheden worden verzilverd dan voor 15 mei of voor 1 oktober aan Onze Minister
      is meegedeeld.

      4 Indien het bevoegd gezag van een school ingevolge [artikel 8][ref6] op 1 januari van een schooljaar aanspraak
      kan maken op verhoging van de formatie, kan het bevoegd gezag beslissen de toename in formatierekeneenheden niet te
      besteden, tot ten hoogste het aantal formatierekeneenheden dat wordt verkregen door de toename te vermenigvuldigen
      met het percentage dat resulteerde in de mededeling bedoeld in het tweede lid daaronder niet begrepen de formatie
      genoemd in het eerste lid, eerste volzin, onderdeel *b*, en de uitkomst daarvan af te ronden. In dat geval keert
      Onze Minister aan het bevoegd gezag van de school een bedrag uit dat overeenkomt met de geldswaarde van deze niet
      verbruikte formatierekeneenheden.

      5 Het bevoegd gezag neemt een beslissing als bedoeld in het vierde lid voor 1 november van het desbetreffende
      schooljaar en deelt deze beslissing en het aantal formatierekeneenheden dat het betreft voor die datum mee aan
      Onze Minister.

      6 De geldswaarde van de formatierekeneenheden voor speciale doeleinden die zijn verzilverd, wordt besteed aan de
      speciale doeleinden waarvoor die rekeneenheden waren bestemd.

      7 Het tweede en het derde lid zijn van overeenkomstige toepassing op een regionaal expertisecentrum dat beslist
      minder formatierekeneenheden te besteden dan mogelijk zou zijn op grond van het aan het regionaal expertisecentrum
      overgedragen aantal formatierekeneenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel107
      [ref4]: https://wetten.overheid.nl/BWBR0015136#Artikel295a
      [ref5]: https://wetten.overheid.nl/BWBR0015136#Artikel112
      [ref6]: https://wetten.overheid.nl/BWBR0005442#Artikel8
