      De opslag in verband met rechtspositionele aanspraken van personeel bij vermindering van de formatie bedraagt voor
      de school 18 formatierekeneenheden.
    url: https://wetten.overheid.nl/BWBR0005442/2004-05-28#Artikel20
  - number: 20a
    text: |-
      1 De aantallen formatierekeneenheden voor het onderwijzend personeel en schoolleiding en de aantallen
      formatierekeneenheden voor speciale doeleinden, berekend op grond van [artikel 23, eerste lid][ref1], worden
      verhoogd met 8,11% vanwege herbezetting in verband met arbeidsduurverkorting.

      2 De aantallen formatierekeneenheden voor onderwijsondersteunend personeel, berekend op grond
      van [artikel 23, tweede lid][ref2], worden verhoogd met 5,68% vanwege herbezetting in verband met
      arbeidsduurverkorting.

      3 Het aantal formatierekeneenheden, berekend op grond van [artikel 23][ref3] en verhoogd op grond van het eerste
      en het tweede lid, wordt tevens verhoogd met het aantal formatierekeneenheden dat behoort bij het gedeelte van de
      betrekkingsomvang dat kan worden herbezet in verband met toepassing van de regeling bevordering arbeidsparticipatie
      ouderen, bedoeld in [titel 16 van hoofdstuk 1 van het Rechtspositiebesluit WPO/WEC][ref4].

      4 De uitkomst van het aantal formatierekeneenheden, berekend op grond van het eerste, het tweede en het derde lid,
      wordt telkens afgerond.


