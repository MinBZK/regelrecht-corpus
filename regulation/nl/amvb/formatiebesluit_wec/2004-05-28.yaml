      a. voor het schooljaar 1994-1995 een percentage van 1,2%, met dien verstande dat na de afronding op grond van
      [artikel 22][ref2], de uitkomst van deze berekening wordt verminderd met de uitkomst van de berekening op grond van
      [artikel 20][ref3] juncto [artikel 26][ref4]

      b. voor het schooljaar 1995-1996 een percentage van 1,7%, en

      c. voor het schooljaar 1996-1997 een percentage van 2,2%.


