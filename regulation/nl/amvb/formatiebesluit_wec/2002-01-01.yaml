  - number: 24a
    text: |-
      Wijziging in de besteding van de formatie voor personeelsbeleid, kwaliteitsverbetering en innovatie mag niet leiden
      tot kosten van uitkeringen krachtens het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0005442/2002-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: 24b
    text: |-
      Indien het verbruik van het aantal formatierekeneenheden in een maand afwijkt van het aantal formatierekeneenheden,
      dat op grond van het formatiebudget beschikbaar is voor de school, kan een bevoegd gezag het te weinig of te veel
      verbruikte aantal formatierekeneenheden van die maand besteden onderscheidenlijk minder besteden in een of meer
      andere maanden van het schooljaar.
    url: https://wetten.overheid.nl/BWBR0005442/2002-01-01#Artikel24b
  - number: '25'
    text: |-
      1 Het bevoegd gezag van een school kan telkens voor de periode van een schooljaar van het beschikbare
      formatiebudget formatierekeneenheden overdragen aan een andere school, een instelling als bedoeld in
      [artikel 8, eerste lid, tweede volzin][ref1], van de wet, een school voor voortgezet speciaal onderwijs als
      bedoeld in [deel II van de Wet op het voortgezet onderwijs](onbekend), een basisschool of een speciale school voor
      basisonderwijs van hetzelfde bevoegd gezag of van een ander bevoegd gezag.

      2 Indien overdracht van formatierekeneenheden als bedoeld in het eerste lid plaatsvindt, delen het bevoegd
      gezag van de overdragende school en dat van de ontvangende school of de ontvangende instelling als bedoeld in
      het eerste lid deze overdracht en het aantal formatierekeneenheden dat het betreft voor 15 mei voorafgaand aan
      het desbetreffende schooljaar mee aan Onze Minister. Het bevoegd gezag kan voor 1 oktober van een schooljaar
      een nadere beslissing als bedoeld in het eerste lid nemen en voor die datum aan Onze Minister meedelen hoeveel
      formatierekeneenheden worden overgedragen.

      3 Indien het bevoegd gezag van een school ingevolge artikel 8 op 1 januari van een schooljaar aanspraak kan
      maken op verhoging van de formatie, kan het bevoegd gezag in afwijking van het eerste lid voor de periode van 1
      januari tot en met 31 juli van het desbetreffende schooljaar de toename in formatierekeneenheden overdragen aan
      een andere school, een instelling als bedoeld in het eerste lid, een school voor voortgezet speciaal onderwijs als
      bedoeld in [deel II van de Wet op het voortgezet onderwijs](onbekend), een basisschool, een speciale school voor
      basisonderwijs of een school voor voortgezet onderwijs van hetzelfde bevoegd gezag of van een ander bevoegd gezag.

      4 Indien overdracht van formatierekeneenheden als bedoeld in het derde lid plaatsvindt, delen het bevoegd gezag
      van de overdragende school en dat van de ontvangende school of de ontvangende instelling als bedoeld in het eerste
      lid deze overdracht en het aantal formatierekeneenheden dat het betreft voor 1 november van het desbetreffende
      schooljaar mee aan Onze Minister.

      5 Overdracht van formatierekeneenheden mag niet leiden tot kosten van ontslaguitkeringen krachtens het
      [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006445
