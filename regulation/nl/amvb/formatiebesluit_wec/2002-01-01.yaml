  - number: 26e
    text: |-
      1 Het bevoegd gezag van een instelling kan telkens voor de periode van een schooljaar besluiten om ten hoogste 10%
      van de beschikbare formatierekeneenheden minder te besteden dan voor die instelling mogelijk zou zijn op grond van
      [artikel 26][ref1] van dit besluit en op grond van artikel 117, vijfde lid, van de wet.

      2 Het bevoegd gezag neemt een besluit als bedoeld in het eerste lid voor 15 mei voorafgaande aan het desbetreffende
      schooljaar en deelt dit besluit en het aantal formatierekeneenheden dat het betreft voor die datum mee aan Onze
      Minister. Het bevoegd gezag kan voor 1 oktober van een schooljaar een nadere beslissing als bedoeld in het eerste
      lid nemen en voor die datum aan Onze Minister meedelen hoeveel formatierekeneenheden worden verzilverd, met dien
      verstande dat deze nadere beslissing niet kan inhouden dat in totaal minder formatierekeneenheden worden verzilverd
      dan overeenkomstig de eerste volzin is medegedeeld aan Onze Minister.

      3 Voor zover toepassing is gegeven aan het eerste en tweede lid keert Onze Minister aan het bevoegd gezag van
      een instelling een bedrag uit dat overeenkomt met de geldswaarde van de gedurende het schooljaar niet verbruikte
      formatierekeneenheden.


