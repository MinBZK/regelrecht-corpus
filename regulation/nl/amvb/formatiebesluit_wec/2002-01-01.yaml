      1 De formatie, bedoeld in [de artikelen 7][ref1], [11][ref2], [13][ref3], [13][ref4] en [22][ref5], wordt opnieuw
      berekend indien het verschil tussen

      a. het aantal leerlingen op 16 januari van het schooljaar, en

      b. het aantal leerlingen op 1 oktober van het schooljaar onderscheidenlijk het aantal leerlingen op de teldatum die
