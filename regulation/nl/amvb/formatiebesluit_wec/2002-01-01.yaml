  - number: '8'
    text: |-
      1 De formatie, bedoeld in [de artikelen 7][ref1], [11][ref2], [13][ref3], [13a ][ref4] en [22b ][ref5] wordt
      opnieuw berekend indien het verschil tussen

      a. het aantal leerlingen op 1 oktober van het schooljaar, en

      b. het aantal leerlingen, bedoeld bij de factor B in [artikel 7, tweede lid][ref6], gelijk is aan of groter is dan
      de kleinste factor N, bedoeld in de tabel in [artikel 14][ref7] die op de school van toepassing is.

      2 Indien in het voorafgaande schooljaar toepassing is gegeven aan [artikel 9][ref8], wordt in afwijking van
      het eerste lid de formatie, bedoeld in de [artikelen 7][ref9], [11][ref10], [13][ref11], [13a ][ref12] en
      [22b ][ref13], opnieuw berekend indien het verschil tussen

      a. het aantal leerlingen op 1 oktober van het schooljaar, en

      b. het aantal leerlingen op 16 januari van het voorafgaande schooljaar gelijk is aan of groter is dan de kleinste
      factor N, bedoeld in de tabel in [artikel 14][ref14], die op de school van toepassing is.

      3 Aanspraak op verhoging van de formatie ingevolge het eerste en tweede lid, ontstaat met ingang van 1 januari van
      het schooljaar.


