  - number: '21'
    text: |-
      De formatie voor speciale doeleinden omvat:

      a. de formatie voor personeelsbeleid, kwaliteitsverbetering en innovatie, en

      b. de formatie voor de bestrijding van onderwijsachterstanden, bedoeld in artikel 117 van de wet.
    url: https://wetten.overheid.nl/BWBR0005442/2002-01-01#Artikel21
  - number: 22a
    text: |-
      1 De formatie voor personeelsbeleid, kwaliteitsverbetering en innovatie wordt vastgesteld door de som van de
      aantallen formatierekeneenheden berekend op grond van de[artikelen 7][ref1] en [22b][ref2] te vermenigvuldigen
      met 2,3%.

      2 De uitkomst van de berekening op grond van het eerste lid wordt vervolgens afgerond.

      3 De[artikelen 8][ref3] en [9][ref4] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel7
