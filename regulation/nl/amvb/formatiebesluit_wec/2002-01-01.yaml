  - number: '13'
    text: |-
      1 De formatie van een school met betrekking tot het onderwijsondersteunend personeel wordt per categorie, genoemd
      in [artikel 12, eerste lid][ref1], berekend aan de hand van de formule I' = B * P, afgerond op een veelvoud
      van 15 minuten. De omvang van de gehele formatie van een school met betrekking tot het onderwijsondersteunend
      personeel, genoemd in [artikel 12, eerste lid][ref2], wordt berekend aan de hand van de formule I = de som van de
      afzonderlijke I'.

      2 In de formules, bedoeld in het eerste lid, is:

      I de formatie van de school ten behoeve van het onderwijsondersteunend personeel, genoemd in
      [artikel 12, eerste lid][ref3];

      I' de formatie per categorie onderwijsondersteunend personeel, genoemd in [artikel 12, eerste lid][ref4],
      uitgedrukt in minuten en per school afgerond op een veelvoud van 15 minuten;

      B het aantal leerlingen op de teldatum;

      P het aantal minuten per week dat per categorie onderwijsondersteunend personeel voor de desbetreffende schoolsoort
      en onderwijsvorm per leerling is aangegeven in [artikel 18][ref5].

      3 Bij de berekening van de formatie, bedoeld in het eerste lid, kan het aantal minuten voor de categorie conciërge
      van het onderwijsondersteunend personeel voor een school niet meer bedragen dan 3600.

      4 Met betrekking tot de scholen genoemd in [artikel 18, eerste lid onderdeel ][ref6], wordt voor de vaststelling
      van de omvang van de formatie met betrekking tot de categorie klasse-assistent van het onderwijsondersteunend
      personeel in afwijking van de factor B in het tweede lid uitgegaan van het aantal leerlingen dat op 31 december van
      het voorafgaande schooljaar jonger is dan 8 jaar.

      5 Indien [artikel 8, eerste en tweede lid][ref7], of [artikel 9][ref8] toepassing vindt, wordt met betrekking tot
      de scholen, bedoeld in het vierde lid, in afwijking van de factor B in het tweede lid uitgegaan van het aantal
      leerlingen dat op 31 december van het desbetreffende schooljaar jonger is dan 8 jaar.

      6 De formatie met betrekking tot de categorieën medisch specialist en audioloog van het onderwijsondersteunend
      personeel wordt verminderd voor zover anders dan op grond van artikel 131 en artikel 133 tot en met 141 van de wet
      vergoeding voor dit personeel kan worden verkregen.


