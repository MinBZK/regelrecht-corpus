        artikel: '3'
        paragraaf: '1'
  - number: '5'
    text: |-
      1 Tenzij anders is bepaald, wordt de formatie van het personeel en het aantal leerlingen van een school voor
      speciaal en voortgezet speciaal onderwijs voor het speciaal onderwijs en het voortgezet speciaal onderwijs
      afzonderlijk berekend met uitzondering van het bepaalde in [artikel 7, tweede lid][ref1], voor zover het betreft de
      factoren F en G, en [artikel 11][ref2].

      2 Op een school waaraan een afdeling is verbonden, is het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005442#Artikel11
