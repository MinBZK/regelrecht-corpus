  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen van 30 oktober 1991, nr. 91024452/2425,
    centrale directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 19a, eerste lid onderdeel c, 93a, eerste en tweede lid, en 93d, tweede lid, van de Interimwet
    op het speciaal onderwijs en het voortgezet speciaal onderwijs (Stb. 1987, 614);

    Gehoord de Onderwijsraad (advies van 15 februari 1991, nr. OR/90000146 t/m 148/1 P);

    De Raad van State gehoord (advies van 12 februari 1992, nr. W05.91.0607);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen van 9 maart 1992, nr.
    92017005/2425, centrale directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005442/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit verstaat onder:

      wet: [Wet op de expertisecentra][ref1];

      Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschappen;

      school: een school voor speciaal onderwijs, voor voortgezet speciaal onderwijs of voor speciaal en voortgezet
      speciaal onderwijs als bedoeld in [artikel 2, tweede lid, onder a, b, c, f, h, j, k, m of n][ref2],
      van de wet, dan wel een instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in
      [artikel 8, eerste lid, tweede volzin, van de wet][ref3], tenzij het tegendeel blijkt;

      bevoegd gezag: wat betreft

      a. een openbare school of instelling: het college van burgemeester en wethouders, voor zover de raad niet anders
      bepaalt, en, indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen regelen, dan wel het
      krachtens een gemeenschappelijke regeling bevoegde orgaan;

      b. een bijzondere school of instelling: de rechtspersoon, bedoeld in artikel 57 van de wet;

      afdeling: afdeling als bedoeld in [artikel 8, tweede lid][ref4], van de wet;

      instelling: instelling als bedoeld in [artikel 8, eerste lid, tweede volzin][ref5], van de wet;

      schooljaar: het tijdvak van 1 augustus tot en met 31 juli daaropvolgend;

      teldatum: een van de data, bedoeld in artikel 118 van de wet;

      schoolsoort: soort school als bedoeld in [artikel 8, eerste lid][ref6], van de wet, verdeeld als aangegeven in
      [artikel 2, tweede lid][ref7], van de wet;

      onderwijsvorm: speciaal onderwijs of voortgezet speciaal onderwijs;

      leerling met een niet-Nederlandse culturele achtergrond: leerling:

      a. die behoort tot de Molukse bevolkingsgroep;

      b. van wie ten minste een van de ouders of voogden afkomstig is uit Griekenland, Italië, het voormalige
      Joegoslavië, Kaapverdië, Marokko, Portugal, Spanje, Tunesië of Turkije;

      c. van wie ten minste een van de ouders of voogden afkomstig is uit Suriname, de Nederlandse Antillen of Aruba;

      d. van wie ten minste een van de ouders of voogden door Onze Minister van Justitie als vluchteling is toegelaten op
      grond van artikel 15 van de Vreemdelingenwet (*Stb.* 1965, 40);

      e. van wie ten minste een van de ouders of voogden afkomstig is uit een ander niet-Engelstalig land buiten Europa,
      echter met uitzondering van Indonesië;

      vakonderwijs: onderwijs dat gegeven wordt door een leraar bij het speciaal onderwijs of het voortgezet speciaal
      onderwijs die uitsluitend is benoemd voor het geven van bepaalde onderwijsactiviteiten of vakken;

      groepsonderwijs: onderwijs dat gegeven wordt door een leraar bij het speciaal onderwijs of het voortgezet speciaal
      onderwijs die niet is benoemd voor het geven van vakonderwijs;

      ambulante begeleiding: de begeleiding door een aan een school verbonden leraar van een of meer leerlingen van
      een basisschool, een speciale school voor basisonderwijs, een school voor voortgezet onderwijs of een school voor
      voortgezet speciaal onderwijs als bedoeld in [deel II van de Wet op het voortgezet onderwijs](onbekend) die zonder
      deze begeleiding zou onderscheidenlijk zouden zijn aangewezen op het onderwijs dat de school verzorgt, alsmede de
      ondersteuning van een basisschool, een speciale school voor basisonderwijs, een school voor voortgezet onderwijs
      of een school voor voortgezet speciaal onderwijs als bedoeld in [deel II van de Wet op het voortgezet onderwijs]
      (onbekend) bij de opvang van zodanige leerlingen door een leraar, orthopedagoog, psycholoog of logopedist van de
      school;

      formatiebudget: het formatiebudget, bedoeld in artikel 120, eerste lid, van de wet.


