  - number: '26'
    text: |-
      1 Het bevoegd gezag van een school kan telkens voor de periode van een schooljaar beslissen minder
      formatierekeneenheden te besteden dan voor die school mogelijk zou zijn op grond van het beschikbare
      formatiebudget, tot ten hoogste:

      a. 10% van het voor de school beschikbare formatiebudget daaronder niet begrepen de formatie voor
      personeelsbeleid, kwaliteitsverbetering en innovatie en het aantal formatierekeneenheden dat nodig is
      voor de bekostiging van de vervanging van het personeel dat gebruik maakt van het verlof op grond van
      [artikel I-C41, zevende lid, van het Rechtspositiebesluit onderwijspersoneel][ref1],

      b. de formatie voor personeelsbeleid, kwaliteitsverbetering en innovatie,

      c. het aantal formatierekeneenheden dat nodig is voor het betalen van vergoedingen aan een school voor voortgezet
      onderwijs voor de inzet van personeel, en

      d. het aantal formatierekeneenheden dat nodig is voor de bekostiging van de
      vervanging van het personeel dat gebruik maakt van het verlof op grond van
      [artikel I-C41, zevende lid, van het Rechtspositiebesluit onderwijspersoneel][ref2].

      In dat geval keert Onze Minister aan het bevoegd gezag van de school een bedrag uit dat overeenkomt met de
      geldswaarde van de gedurende het schooljaar niet verbruikte formatierekeneenheden.

      2 Het verzilveren van formatierekeneenheden, bedoeld in het eerste lid, onderdeel *c*, mag niet leiden tot kosten
      van ontslaguitkeringen krachtens het Besluit Werkloosheid onderwijs- en onderzoekpersoneel.

      3 Het bevoegd gezag neemt een besluit als bedoeld in het eerste lid voor 15 mei voorafgaande aan het desbetreffende
      schooljaar en deelt dit voor die datum mee aan Onze Minister. Bij die mededeling wordt tevens vermeld, hoeveel
      formatierekeneenheden het betreft. Het bevoegd gezag kan voor 1 oktober van een schooljaar een nader besluit als
      bedoeld in het eerste lid nemen en voor die datum aan Onze Minister meedelen hoeveel formatierekeneenheden worden
      verzilverd, met dien verstande dat dit nader besluit niet kan inhouden dat in totaal minder formatierekeneenheden
      worden verzilverd dan overeenkomstig de eerste en tweede volzin is medegedeeld aan Onze Minister.

      4 Indien het bevoegd gezag van een school ingevolge artikel 8 op 1 januari van een schooljaar aanspraak kan
      maken op verhoging van de formatie, kan het bevoegd gezag besluiten de toename in formatierekeneenheden niet te
      besteden, tot ten hoogste het aantal formatierekeneenheden dat wordt verkregen door de toename te vermenigvuldigen
      met het percentage dat resulteerde in de mededeling bedoeld in het tweede lid daaronder niet begrepen de formatie
      genoemd in het eerste lid, eerste volzin, onderdeel *b*, en de uitkomst daarvan af te ronden. In dat geval keert
      Onze Minister aan het bevoegd gezag van de school een bedrag uit dat overeenkomt met de geldswaarde van deze niet
      verbruikte formatierekeneenheden.

      5 Het bevoegd gezag neemt een besluit als bedoeld in het vierde lid voor 1 november van het desbetreffende
      schooljaar en deelt dit besluit en het aantal formatierekeneenheden dat het betreft voor die datum mee aan Onze
      Minister.

      6 De geldswaarde van de formatierekeneenheden voor speciale doeleinden die zijn verzilverd, wordt besteed aan de
      speciale doeleinden waarvoor die rekeneenheden waren bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003771#ArtikelI-C41
      [ref2]: https://wetten.overheid.nl/BWBR0003771#ArtikelI-C41
