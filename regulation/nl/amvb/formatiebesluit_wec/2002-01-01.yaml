  - number: 13a
    text: |-
      1 Ten behoeve van een school waar onderwijs wordt gegeven als bedoeld in [artikel 2, tweede lid, onderdeel ][ref1],
      van de wet en een afdeling waar onderwijs wordt gegeven als bedoeld in [artikel 2, tweede lid, onderdeel ][ref2],
      van de wet wordt formatie voor de categorie technicus van het onderwijsondersteunend personeel toegekend. Onder een
      school als bedoeld in de eerste volzin wordt niet begrepen een aan deze school verbonden afdeling, tenzij het een
      afdeling betreft waar onderwijs wordt gegeven als bedoeld in [artikel 2, tweede lid, onderdeel ][ref3], van de wet.

      2 Voor de berekening van de formatie, bedoeld in het eerste lid, en het aantal leerlingen worden als een geheel
      beschouwd:

      a. een school als bedoeld in het eerste lid waar zowel speciaal onderwijs als voortgezet speciaal onderwijs in de
      desbetreffende onderwijssoorten wordt gegeven;

      b. een school als bedoeld in het eerste lid met een daaraan verbonden afdeling waar onderwijs wordt gegeven als
      bedoeld in [artikel 2, tweede lid, onderdeel ][ref4], van de wet.

      3 Indien het aantal leerlingen op de school op de teldatum kleiner is dan of gelijk is aan 120 bedraagt de in
      het eerste lid bedoelde formatie 1200 minuten per schooljaar, en indien het aantal leerlingen op de school op de
      teldatum groter is dan 120 bedraagt deze formatie 2400 minuten per schooljaar.


