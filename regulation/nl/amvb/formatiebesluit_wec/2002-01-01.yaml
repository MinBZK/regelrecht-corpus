      gelijk is aan of groter is dan de helft van de kleinste factor N, bedoeld in de tabel in [artikel 14][ref6], die op
      de school van toepassing is.

      2 Aanspraak op verhoging van de formatie ingevolge het eerste lid, ontstaat met ingang van 1 augustus van het
      daarop volgende schooljaar.


