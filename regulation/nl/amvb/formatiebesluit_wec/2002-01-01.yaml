  - number: '11'
    text: |-
      1 Voor zover het een school betreft waar onderwijs wordt gegeven als bedoeld in
      [artikel 2, tweede lid onderdeel a tot en met c, f en h, j, k, m en n, van de wet][ref1] wordt de formatie ten
      behoeve van de ambulante begeleiding toegekend volgens het tweede en derde lid.

      2 De formatie van een school ten behoeve van de ambulante begeleiding wordt berekend aan de hand van de formule H
      =J * K.

      3 In de formule, bedoeld in het tweede lid, is:

      H het aantal minuten per week, afgerond op een veelvoud van 60 minuten;

      J het aantal leerlingen op de teldatum voor wie de school ingevolge [artikel 14][ref2], eerste tot en met zevende
      lid, en [artikel 16 van het Onderwijskundig besluit WEC][ref3] aanspraak kan maken op ambulante begeleiding;

      K het aantal minuten per week per ambulant begeleide leerling, bedoeld in [artikel 17][ref4].


