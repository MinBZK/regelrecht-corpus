    text: |-
      Acht weken voor de opening van een nieuwe instelling worden ten behoeve van de werkzaamheden voor de start van de
      instelling 1.025 formatierekeneenheden toegekend.
    url: https://wetten.overheid.nl/BWBR0005442/2002-01-01#Artikel26b
