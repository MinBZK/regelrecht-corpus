  - number: 26d
    text: |-
      1 Van de voor de instelling op grond van [artikel 26][ref1] van dit besluit en artikel 117, vijfde lid, van de
      wet, beschikbare formatierekeneenheden, kan het bevoegd gezag van een instelling telkens voor de periode van een
      schooljaar formatierekeneenheden overdragen aan een school, een school voor voortgezet speciaal onderwijs als
      bedoeld in [deel II van de Wet op het voortgezet onderwijs](onbekend), een andere instelling” of een basisschool
      van hetzelfde bevoegd gezag of van een ander bevoegd gezag.

      2 Indien overdracht van formatierekeneenheden als bedoeld in het eerste lid plaatsvindt, delen het bevoegd
      gezag van de overdragende instelling en dat van de ontvangende school of instelling deze overdracht en het
      aantal formatierekeneenheden dat het betreft voor 15 mei voorafgaand aan het desbetreffende schooljaar mee
      aan Onze Minister. Het bevoegd gezag van de overdragende instelling kan voor 1 oktober van een schooljaar een
      nadere beslissing als bedoeld in het eerste lid nemen en voor die datum aan Onze Minister meedelen hoeveel
      formatierekeneenheden worden overgedragen.

      3 Overdracht van formatierekeneenheden mag niet leiden tot kosten van ontslaguitkeringen krachtens het
      [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel26a
      [ref2]: https://wetten.overheid.nl/BWBR0006445
