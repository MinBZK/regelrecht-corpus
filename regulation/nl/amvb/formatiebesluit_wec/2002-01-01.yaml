    text: |-
      1 De formatie van een instelling als bedoeld in artikel 117, eerste lid onderdeel a 2°, van de wet, wordt berekend
      aan de hand van de formule

      A = B x 128.

      2 In de formule, genoemd in dit artikel is:

      A de formatie, uitgedrukt in minuten en afgerond op een veelvoud van 480 minuten;

      B het aantal leerlingen op de teldatum.

      3 Voor de omrekening in formatierekeneenheden van de formatie berekend op grond van het eerste en tweede lid wordt
      het aantal minuten formatie gedeeld door 2400 en wordt de uitkomst daarvan vermenigvuldigd met 200.
    url: https://wetten.overheid.nl/BWBR0005442/2002-01-01#Artikel26a
