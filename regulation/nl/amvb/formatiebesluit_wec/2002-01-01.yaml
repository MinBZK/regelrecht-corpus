    text: |-
      1 Voor de toepassing van de [artikelen 13][ref1] en [18][ref2] worden de volgende categorieën
      onderwijsondersteunend personeel onderscheiden:

      a. administratief medewerker,

      b. conciërge,

      c. creatieve therapeut,

      d. ergotherapeut,

      e. speltherapeut,

      f. fysiotherapeut,

      g. logopedist,

      h. maatschappelijk deskundige,

      i. orthopedagoog,

      j. psycholoog,

      k. psychologisch assistent,

      l. medisch specialist,

      m. audioloog,

      n. klassenassistent,

      o. akoepedist, en

      p. instructeur mobiliteit.

      2 Voor de toepassing van [artikel 13a ][ref3] wordt als categorie van het onderwijsondersteunend personeel
      onderscheiden: de technicus.


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005442#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0005442#Artikel13a
