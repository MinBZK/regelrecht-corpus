    text: |-
      1 Het formatiebudget waarop het bevoegd gezag van een school per schooljaar aanspraak heeft, bestaat uit:

      a. de formatie voor de vervulling van reguliere taken van de school, bedoeld in artikel 117, eerste lid onderdeel
      a, van de wet,

      b. in voorkomende gevallen formatie voor speciale doeleinden, bedoeld in artikel 117, eerste lid onderdeel b, van
      de wet,

      c. in voorkomende gevallen de verhoging van de formatie als gevolg van het opnieuw berekenen van de formatie bij
      een bepaalde toename van het aantal leerlingen, overeenkomstig de [artikelen 8][ref1] en [9][ref2],

      d. in voorkomende gevallen aanvullende formatie als bedoeld in artikel 117, derde of vierde lid, van de wet.

      2 De omvang van het formatiebudget is gelijk aan de som van de aantallen formatierekeneenheden zoals voor de school
      berekend op grond van de [artikelen 3 tot en met 23][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005442#Artikel9
