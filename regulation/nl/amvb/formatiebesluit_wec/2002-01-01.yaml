  - number: '6'
    text: |-
      Indien in dit besluit sprake is van:

      a. afronding van een getal, worden de decimalen verwaarloosd indien het eerste cijfer achter de komma kleiner is
      dan 5, en worden de decimalen verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma
      gelijk is aan of groter is dan 5;

      b. afronding naar boven van een getal, worden de decimalen verwaarloosd en wordt het getal verhoogd met 1;

      c. afronding op een veelvoud van een aantal minuten, vindt afronding naar beneden plaats indien bij het quotiënt
      van de uitkomst van de formule of formules en dat aantal minuten het eerste cijfer achter de komma kleiner is dan
      5 en vindt afronding naar boven plaats indien bij dat quotiënt het eerste cijfer achter de komma gelijk is aan of
      groter is dan 5.
    url: https://wetten.overheid.nl/BWBR0005442/2002-01-01#Artikel6
  - number: '7'
    text: |-
      1 De formatie van een school met betrekking tot het onderwijzend personeel met inbegrip van de schoolleiding wordt
      berekend aan de hand van de formule A = B * C + B * D + B * E + G.

      2 In de formules, genoemd in dit artikel en in artikel 16, vijfde lid, is:

      A de formatie, uitgedrukt in minuten en afgerond op een veelvoud van 480 minuten;

      B het aantal leerlingen op de teldatum;

      C het aantal minuten groepsonderwijs per week aan een school voor speciaal onderwijs dat voor de desbetreffende
      schoolsoort en onderwijsvorm per leerling is aangegeven in [artikel 14][ref1];

      D het aantal minuten groeps- of vakonderwijs per week aan een school voor voortgezet speciaal onderwijs dat voor de
      desbetreffende schoolsoort en onderwijsvorm per leerling is aangegeven in [artikel 14][ref2];

      E het aantal minuten vakonderwijs per week dat voor de desbetreffende schoolsoort en onderwijsvorm per leerling is
      aangegeven in [artikel 14][ref3];

      F het aantal minuten per week dat ten behoeve van leerlingen met een niet-Nederlandse culturele achtergrond op de
      teldatum wordt vastgesteld aan de hand van [artikel 22][ref4];

      G het aantal minuten per week dat, uitgaande van het aantal formatieplaatsen, ten behoeve van de schoolleiding
      wordt vastgesteld aan de hand van [artikel 16, tweede lid][ref5], waarbij G niet groter kan zijn dan 3600; het
      aantal formatieplaatsen, bedoeld in de vorige zinsnede, is de uitkomst van de formule (B * C + B * D + B * E + F +
      H + I + Ia): 2400, naar boven afgerond;

      H het aantal minuten per week dat ten behoeve van ambulante begeleiding wordt vastgesteld aan de hand van
      [artikel 11][ref6] juncto [artikel 17][ref7];

      I de som van de formatie, bedoeld in [artikel 13, eerste lid][ref8], ten behoeve van het onderwijsondersteunend
      personeel;

      Ia het aantal minuten per week dat ten behoeve van de formatie voor de categorie technicus van het
      onderwijsondersteunend personeel wordt vastgesteld aan de hand van [artikel 13][ref9].

      3 De uitkomst van de formules B * C, B * D en B * E wordt telkens afgerond op een veelvoud van 15 minuten.

      4 Het aantal minuten vakonderwijs, bedoeld in het tweede lid bij de factor E, dat is berekend op grond van het
      eerste en tweede lid juncto [artikel 14][ref10], wordt besteed aan het geven van vakonderwijs.


