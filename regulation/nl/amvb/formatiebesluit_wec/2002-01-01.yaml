  - number: '23'
    text: |-
      1 Voor de omrekening in formatierekeneenheden van de formatie voor onderwijzend personeel en schoolleiding en de
      formatie voor speciale doeleinden, wordt het aantal minuten formatie gedeeld door 2400 en wordt de uitkomst daarvan
      vermenigvuldigd met 200.

      2 Voor de omrekening in formatierekeneenheden van de formatie voor onderwijsondersteunend personeel wordt het
      aantal minuten formatie gedeeld door 2400 en wordt de uitkomst daarvan vermenigvuldigd met het getal, behorend bij
      de desbetreffende categorie, opgenomen in de tabel in [artikel 24, derde lid, onderdeel ][ref1]. In afwijking van
      het bepaalde in de vorige volzin is voor de administratief medewerker met een functie, waarbij de maximumschaal 3
      behoort alsmede voor de klassenassistent met een functie, waarbij de maximumschaal 3 behoort, het getal 144.

      3 De uitkomst van de som van het aantal formatierekeneenheden, berekend op grond van het eerste en tweede lid wordt
      telkens afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel24
