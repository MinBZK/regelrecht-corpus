  - number: '4'
    text: |-
      1 Het UWV kan aan een uitkeringsgerechtigde al dan niet op diens aanvraag voor een periode van maximaal zes
      maanden ontheffing verlenen van de verplichtingen, bedoeld in [artikel 30, eerste lid, van de Wet WIA][ref1],
      de [artikelen 2:31, eerste lid][ref2], en [2:39, derde lid, onderdelen e, f en g, van de Wajong][ref3],
      [artikel 30, eerste lid, van de ZW][ref4], de [artikelen 24, eerste lid, onderdeel b, onder 1°, 2° en 4°][ref5],
      en [26, eerste lid, onderdelen d, f en g, van de WW][ref6] of in de [artikelen 12, tweede lid, onderdeel c][ref7],
      [14, tweede lid, onderdeel b][ref8], en [15, onderdelen a tot en met e, van de IOW][ref9], indien van die
      uitkeringsgerechtigde tijdelijk redelijkerwijs niet kan worden verlangd dat hij aan die verplichtingen voldoet in
      verband met een plotselinge, ernstige crisissituatie in de privé-sfeer.

      2 Het UWV kan al dan niet op aanvraag van de uitkeringsgerechtigde na afloop van de periode waarover op grond van
      het eerste lid ontheffing is verleend, de ontheffing aansluitend verlengen tot maximaal zes maanden, indien nog
      steeds wordt voldaan aan de voorwaarden, bedoeld in het eerste lid.


