  - number: '3'
    text: |-
      1 Het UWV kan aan een uitkeringsgerechtigde op diens aanvraag voor een periode van maximaal zes maanden ontheffing
      verlenen van de verplichtingen, bedoeld in [artikel 30, eerste lid, onderdelen a en b, van de Wet WIA][ref1],
      [artikel 2:39, derde lid, onderdelen e en f, van de Wajong][ref2],
      [artikel 30, eerste lid, onderdelen a en b, van de ZW][ref3],
      [artikel 24, eerste lid, onderdeel b, onder 1° en 2°, van de WW][ref4], of in
      [artikel 15, onderdelen b, c en e, van de IOW][ref5], indien:

      a. de uitkeringsgerechtigde mantelzorg verricht; en

      b. die mantelzorg zodanig intensief is, dat in redelijkheid niet van hem kan worden gevraagd te voldoen aan die
      verplichtingen.

      2 Het UWV kan al dan niet op aanvraag van de uitkeringsgerechtigde na afloop van de periode waarover op grond van
      het eerste lid ontheffing is verleend, de ontheffing telkens verlengen met een periode van een maand, indien nog
      steeds wordt voldaan aan de voorwaarden, bedoeld in het eerste lid, en het niet verlengen van die ontheffing gezien
      de individuele omstandigheden van de uitkeringsgerechtigde zal leiden tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel30
