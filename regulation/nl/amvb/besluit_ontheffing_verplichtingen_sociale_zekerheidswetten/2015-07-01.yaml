  - number: '6'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de in de
      [artikelen 2 tot en met 4][ref1] gestelde voorwaarden en de wijze waarop aangetoond kan worden dat aan die
      voorwaarden is voldaan.


