  - number: '5'
    text: |-
      Een ontheffing als bedoeld in de [artikelen 3 tot en met 4a][ref1] kan eenmalig worden verleend per toestand of
      gebeurtenis.


      [ref1]: https://wetten.overheid.nl/BWBR0020483#Artikel3
