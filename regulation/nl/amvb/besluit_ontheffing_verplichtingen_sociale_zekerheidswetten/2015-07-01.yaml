  - number: 4a
    text: |-
      1 Het UWV kan aan een uitkeringsgerechtigde, die partner is als bedoeld in
      [artikel 3:1a, tweede lid, van de Wazo][ref1], op diens aanvraag ontheffing verlenen van de
      verplichtingen, bedoeld in de [artikelen 30, eerste lid, van de Wet WIA][ref2], [2:31, eerste lid][ref3],
      en [2:39, derde lid, onderdelen e, f en g, van de Wajong][ref4], [30, eerste lid, van de ZW][ref5],
      [24, eerste lid, onderdeel b, onder 1°, 2° en 4°, en 26, eerste lid, onderdelen d, f en g, van de WW][ref6],
      [12, tweede lid, onderdeel c][ref7], [14, tweede lid, onderdeel b][ref8], of
      [15, onderdelen a tot en met e, van de IOW][ref9], indien:

      a. de moeder van het kind overlijdt:

      1°. tijdens het bevallingsverlof indien zij een werknemer is als bedoeld in
      [artikel 3:6, eerste lid, onderdeel a, en tweede lid, onderdeel a, van de Wazo][ref10];

      2°. tijdens de bevallingsuitkering indien zij gelijkgestelde als bedoeld in
      [artikel 3:6, eerste lid, onderdeel b, en tweede lid, onderdeel b, van de Wazo][ref11]
      of zelfstandige of beroepsbeoefenaar op arbeidsovereenkomst is als bedoeld in
      [artikel 3:17, eerste lid, onderdelen a en b, van die wet][ref12]; of

      3°. binnen tien weken na de dag van de geboorte van het kind indien de moeder geen recht had op bevallingsverlof of
      een bevallingsuitkering als bedoeld in [afdeling 2 van hoofdstuk 3 van de Wazo][ref13]; en

      b. er een akte van geboorte van haar kind is opgemaakt.

      2 Deze ontheffing eindigt op de dag dat:

      a. het bevallingsverlof van de moeder, die werknemer is als bedoeld in
      [artikel 3:6, eerste lid, onderdeel a, en tweede lid, onderdeel a, van de Wazo][ref14], zou zijn geëindigd;

      b. de bevallingsuitkering van de moeder, die gelijkgestelde als bedoeld in
      [artikel 3:6, eerste lid, onderdeel b, en tweede lid, onderdeel b, van de Wazo][ref15]
      of zelfstandige of beroepsbeoefenaar op arbeidsovereenkomst is als bedoeld in
      [artikel 3:17, eerste lid, onderdelen a en b, van die wet][ref16], zou zijn geëindigd; of

      c. tien weken na de dag van de geboorte van het kind zijn verstreken, indien de moeder geen recht had op
      bevallingsverlof of een bevallingsuitkering als bedoeld in [afdeling 2 van hoofdstuk 3 van de Wazo][ref17].

      3 Indien [artikel 3:1, vijfde lid][ref18], of [artikel 3:18, tweede lid, van de Wazo][ref19] van toepassing, is
      eindigt de ontheffing, in afwijking van het tweede lid, na afloop van de overeenkomstig die artikelen geldende
      verlenging.


