  - number: 6a
    text: |-
      Indien door het UWV aan de uitkeringsgerechtigde, voor de inwerkingtreding van artikel IV van het besluit van 18
      juni 2015, houdende wijziging van enige algemene maatregelen van bestuur in verband met de Wet werk en zekerheid,
      het invoeren van een ontheffing in verband met de zorg voor een pasgeboren kind bij overlijden van de moeder, een
      wijziging van het Remigratiebesluit in verband met de berekenwijze van de jaarlijkse indexatie van de remigratie-
      uitkeringen, het vrijlaten van de afkoopsom klein pensioen voor verschillende uitkeringen in het Algemeen
      inkomensbesluit socialezekerheidswetten alsmede enkele technische wijzigingen in enkele besluiten (Stb. 242), een
      ontheffing is verleend op grond van de [artikelen 2][ref1], [3][ref2] of [4][ref3], blijven de artikelen 2, 3 en
      4 zoals deze luidden voor die inwerkingtreding van toepassing voor de uitkeringsgerechtigde gedurende de resterende
      duur van die ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0020483#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020483#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020483#Artikel4
