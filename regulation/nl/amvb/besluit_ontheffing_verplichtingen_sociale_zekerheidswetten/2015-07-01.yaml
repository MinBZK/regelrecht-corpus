articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      *IOW:* [Wet inkomensvoorziening oudere werklozen][ref1];

      *IOW-uitkering:* een uitkering op grond van de [IOW][ref2];

      *mantelzorg*: noodzakelijke zorg voor een zieke of gehandicapte;

      *uitkeringsgerechtigde*: de verzekerde, bedoeld in de [Wet WIA][ref3], die zijn resterende verdiencapaciteit
      als bedoeld in [paragraaf 7.2 van die wet][ref4] niet volledig benut of de werknemer, bedoeld in
      [hoofdstuk 1, paragraaf 2, van de WW][ref5], die recht heeft op een WGA-uitkering respectievelijk een WW-
      uitkering, of de jonggehandicapte die recht heeft op arbeidsondersteuning, bedoeld in [artikel 2:15][ref6] en
      [2:17 van de Wajong][ref7], de verzekerde die ziekengeld ontvangt of de persoon die recht heeft op een IOW-
      uitkering;

      *Wajong:* [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8];

      *Wazo:* [Wet arbeid en zorg][ref9];

      *Wet WIA*: [Wet werk en inkomen naar arbeidsvermogen][ref10];

      *WGA-uitkering*: een werkhervattingsuitkering gedeeltelijk arbeidsgeschikten als bedoeld in
      [hoofdstuk 7 van de Wet WIA][ref11];

      *WW*: [Werkloosheidswet][ref12];

      *WW-uitkering*: een uitkering op grond van de [WW][ref13];

      *Ziekengeld:* ziekengeld op grond van de [ZW][ref14];

      *ZW:* [Ziektewet][ref15].


