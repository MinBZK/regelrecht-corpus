    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 9 augustus 2006, nr. SV/WV/2006/56306;

    Gelet op de artikelen 24, negende lid, en 26, zesde lid, van de Werkloosheidswet en 32, derde lid, van de Wet werk
    en inkomen naar arbeidsvermogen;

    De Raad van State gehoord (advies van 17 augustus 2006, no. W12.06.0346/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 27 oktober 2006, Directie
    Sociale Verzekeringen, nr. SV/WV/2006/88880;

    Hebben goedgevonden en verstaan:
