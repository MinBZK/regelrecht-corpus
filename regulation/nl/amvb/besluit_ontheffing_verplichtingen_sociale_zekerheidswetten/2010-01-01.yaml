  - number: '3'
    text: |-
      1 Het UWV kan aan een uitkeringsgerechtigde op diens aanvraag voor een periode
      van maximaal zes maanden ontheffing verlenen van de verplichtingen, bedoeld in
      [artikel 30, eerste lid, onderdelen a en b, van de Wet WIA][ref1]__REF001__________________________________________
      ___________________, of in [artikel 24, eerste lid, onderdeel b, onder 1° en 2°, van de WW][ref3], of in
      [artikel 15, onderdeel b, c en e, van de IOW][ref4], indien:

      a. de uitkeringsgerechtigde mantelzorg verricht; en

      b. die mantelzorg zodanig intensief is, dat in redelijkheid niet van hem kan worden gevraagd te voldoen aan die
      verplichtingen.

      2 Het UWV kan na afloop van de periode, bedoeld in het eerste lid, de ontheffing op aanvraag van de
      uitkeringsgerechtigde eenmalig verlengen met een periode van maximaal zes maanden, indien:

      a. de uitkeringsgerechtigde voldoet aan de in het eerste lid gestelde voorwaarden; en

      b. de verwachting is dat hij op korte termijn niet meer aan die voorwaarden zal voldoen.

      3 Het UWV kan al dan niet op aanvraag van de uitkeringsgerechtigde na afloop van de periode waarover op grond van
      het eerste en tweede lid ontheffing is verleend, de ontheffing telkens verlengen met een periode van een maand,
      indien is voldaan aan de voorwaarden, bedoeld in het eerste en tweede lid, en het niet verlengen van die ontheffing
      gezien de individuele omstandigheden van de uitkeringsgerechtigde zal leiden tot een onbillijkheid van overwegende
      aard.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel30
