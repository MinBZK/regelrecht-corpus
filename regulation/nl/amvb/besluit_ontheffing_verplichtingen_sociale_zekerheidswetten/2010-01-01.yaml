  - number: '5'
    text: |-
      1 Een ontheffing als bedoeld in [artikel 2][ref1] kan aan een uitkeringsgerechtigde gedurende de duur van zijn WW-
      uitkering, recht op arbeidsondersteuning, bedoeld in [artikel 2:15 van de Wet Wajong][ref2], WGA-uitkering of IOW-
      uitkering slechts eenmalig worden verleend.

      2 Een ontheffing als bedoeld in [artikel 3][ref3] of een ontheffing als bedoeld in [artikel 4][ref4] kan eenmalig
      worden verleend per toestand of gebeurtenis.


