  - number: '2'
    text: |-
      1 Het UWV kan aan een uitkeringsgerechtigde al dan niet op diens aanvraag voor een
      periode van maximaal zes maanden ontheffing verlenen van de verplichting, bedoeld in
      [artikel 30, eerste lid, onderdeel b, van de Wet WIA][ref1]__REF001________________________________________________
      _______, of in [artikel 24, eerste lid, onderdeel b, onder 1°, van de WW][ref3], of in
      [artikel 15, onderdeel b, van de IOW][ref4], indien:

      a. de uitkeringsgerechtigde een gebleken grote afstand heeft tot de arbeidsmarkt;

      b. het verrichten van vrijwilligerswerk er tezamen met de ontheffing naar het oordeel van het UWV toe bijdraagt dat
      de afstand van de uitkeringsgerechtigde tot de arbeidsmarkt wordt verkleind; en

      c. de uitkeringsgerechtigde gedurende de duur van die ontheffing gemiddeld ten minste 20 uur per week
      vrijwilligerswerk verricht.

      2 Het UWV kan na afloop van de periode, bedoeld in het eerste lid, de ontheffing al dan niet op aanvraag van de
      uitkeringsgerechtigde eenmalig verlengen met een periode van maximaal zes maanden, indien:

      a. de uitkeringsgerechtigde voldoet aan de in het eerste lid gestelde voorwaarden; en

      b. de afstand van de uitkeringsgerechtigde tot de arbeidsmarkt is verkleind als gevolg van de ontheffing en een
      verlenging van de ontheffing er tezamen met het verrichten van vrijwilligerswerk naar het oordeel van het UWV toe
      bijdraagt dat de afstand van de uitkeringsgerechtigde tot de arbeidsmarkt verder wordt verkleind.

      3 Het UWV kan al dan niet op aanvraag van de uitkeringsgerechtigde na afloop van de periode waarover op grond van
      het eerste en tweede lid ontheffing is verleend, de ontheffing telkens verlengen met een periode van een maand,
      indien de uitkeringsgerechtigde gedurende die maand gemiddeld ten minste 20 uur per week vrijwilligerswerk verricht
      en het niet verlengen van die ontheffing gezien de individuele omstandigheden van de uitkeringsgerechtigde zal
      leiden tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel30
