  - number: '4'
    text: |-
      Het UWV kan aan een uitkeringsgerechtigde al dan niet op diens aanvraag voor een periode van maximaal vier
      weken ontheffing verlenen van de verplichtingen, bedoeld in [artikel 30, eerste lid, van de Wet WIA][ref1]
      de artikelen [2:31, eerste lid][ref2], en [2:39, derde lid, onderdelen e f en g, van de Wet Wajong][ref3],
      of in de [artikelen 24, eerste lid, onderdeel b, onder 1°, 2° en 4°][ref4], en
      [26, eerste lid, onderdeel d, f en g, van de WW][ref5] of in de [artikelen 12, tweede lid, onderdeel c][ref6],
      [14, tweede lid, onderdeel b][ref7], en [15, onderdelen a tot en met e, van de IOW][ref8], indien van die
      uitkeringsgerechtigde tijdelijk redelijkerwijs niet kan worden verlangd dat hij aan die verplichtingen voldoet in
      verband met een plotselinge, ernstige crisissituatie in de privé-sfeer.


