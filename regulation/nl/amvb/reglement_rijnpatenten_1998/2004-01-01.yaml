  - number: '5.03'
    text: |-
      De vaartijd en de reizen op bepaalde riviergedeelten, die vóór de inwerkingtreding van dit reglement zijn gemaakt,
      worden volgens de normen van de voorgaande voorschriften berekend.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel5.03
