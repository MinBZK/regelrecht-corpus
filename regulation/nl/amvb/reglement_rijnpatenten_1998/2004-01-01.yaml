  - number: '3.03'
    text: |-
      1 De gegadigde die voldoet aan de vereisten als bedoeld in de artikelen 2.01, 2.02, of 2.03, met uitzondering van
      de artikelen 2.01, tweede lid, onderdeel *c*, 2.02, tweede lid, onderdeel *c*, of 2.03, tweede lid, onderdeel *c*,
      alsmede aan de voorwaarden als bedoeld in artikel 3.02 wordt tot het examen toegelaten. Indien uit de medische
      verklaring slechts een beperkte geschiktheid blijkt, wordt de gegadigde toch tot het examen toegelaten. De bevoegde
      autoriteit kan in dit geval aan het patent voorwaarden verbinden, die bij afgifte in het patent worden aangetekend.

      Een afwijzing van de aanvraag moet met redenen worden omkleed.

      2 De bevoegde autoriteit kan voor een gegadigde, die niet voldoet aan de eis als bedoeld in de artikelen 2.01,
      tweede lid, onderdeel *b*, 2.02, tweede lid, onderdeel *b*, of 2.03, tweede lid, onderdeel *b*, bepalen dat deze
      vóór afloop van een bepaalde termijn niet tot een examen kan worden toegelaten (uitsluitingstermijn).
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel3.03
  - number: '3.04'
    text: |-
      1 De gegadigde moet tijdens het examen voor de examencommissie aantonen dat hij overeenkomstig het examenprogramma
      bedoeld in de bijlage C:

      a. beschikt over voldoende kennis van de voorschriften terzake van het voeren van schepen en de voor het veilig
      voeren daarvan vereiste nautische en scheepstechnische kennis, beroepsvaardigheden en kennis van de grondbeginselen
      van het voorkomen van ongevallen en

      b. beschikt over de vereiste kennis van het betreffende riviergedeelte.

      2 Voor het verkrijgen van het grote patent en het kleine patent is met het oog op de vereisten met betrekking tot
      de vaartijd als bedoeld in de artikelen 2.01, eerste lid, en 2.02, eerste lid, een theoretisch examen, en voor het
      verkrijgen van het sportpatent en het overheidspatent een theoretisch en een praktisch examen vereist.

      3 Indien het examen niet wordt gehaald worden de redenen van afwijzing medegedeeld aan de gegadigde. De
      examencommissie kan aan het opnieuw deelnemen aan een examen verplichtingen of voorwaarden verbinden dan wel
      daarvoor vrijstellingen verlenen.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel3.04
  - number: '3.05'
    text: |-
      1 Degene die het eindexamen van een beroepsopleiding met goed gevolg heeft afgelegd kan worden vrijgesteld van
      die gedeelten van het examen, die betrekking hebben op kennis en vaardigheden, die reeds onderwerp van een door de
      Centrale Commissie voor de Rijnvaart als gelijkwaardig erkend examen waren.

      2 De houder van een bewijs van vaarbekwaamheid als bedoeld in artikel 1.03, vierde lid, kan bij het verwerven van
      het sportpatent van dat gedeelte van het examen worden vrijgesteld dat betrekking heeft op nautische kennis.

      3 De houder van een vaarbewijs van één der Rijnoeverstaten of België dan wel een ander geldig en door de Centrale
      Commissie voor de Rijnvaart als gelijkwaardig erkend bewijs van vaarbekwaamheid voor het voeren van een schip op
      andere vaarwegen moet voor het verkrijgen van een Rijnpatent voldoen aan de toelatingseisen als bedoeld in artikel
      3.03, doch tijdens het examen slechts de kennis van de op de Rijn van toepassing zijnde reglementen en bepalingen
      en de kennis van het betreffende riviergedeelte aantonen.

      4 De houder van een overheidspatent verkrijgt op aanvraag een sportpatent voor hetzelfde riviergedeelte zonder
      daarvoor examen te doen.

      5 Voor het verkrijgen van een ander patent als bedoeld in artikel 1.04 of van een uitbreiding tot een ander
      riviergedeelte kan de houder van een Rijnpatent van dat deel van het examen worden vrijgesteld, dat betrekking
      heeft op de kennis of de vaardigheden, welke reeds voor het verkrijgen van zijn huidige patent moesten worden
      aangetoond. De patenten bedoeld in de artikelen 2.01, 2.02, 2.03 en 2.05 gelden op de riviergedeelten tussen Basel
      en de sluizen te Iffezheim alsmede benedenstrooms van het Spijksche Veer zonder dat zij tot die riviergedeelten
      zijn uitgebreid.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel3.05
  - number: '3.06'
    text: |-
      1 De bevoegde autoriteit geeft aan degene die het examen met goed gevolg heeft afgelegd een Rijnpatent af volgens
      het model van de bijlage A1.

      Het model voor het kanaalspitsenpatent wordt vastgesteld door de bevoegde autoriteit.

      Het is voorzien van respectievelijk één der navolgende opdrukken: «Groot Patent», «Klein Patent», «Sportpatent»,
      «Kanaalspitsenpatent», of «Overheidspatent».

      2 De voorwaarden bedoeld in artikel 3.03, eerste lid, of de beperkingen bedoeld in artikel 5.02, derde lid, worden
      in het patent aangetekend.

      3 Voor de tijd gelegen tussen het slagen voor het examen en de afgifte van het patent volgens het model van de
      bijlage A1, verstrekt de autoriteit die het patent afgeeft een voorlopig Rijnpatent volgens het model van de
      bijlage A2.

      4 Ingeval van een uitbreiding kan een bevoegde autoriteit het document als bedoeld in het derde lid ook afgeven
      ter overbrugging van de tijd gelegen tussen het slagen voor het examen en de afgifte van het nieuwe Rijnpatent.
      In verband met de afgifte van een nieuw Rijnpatent wordt de autoriteit die het patent heeft afgegeven hiervan in
      kennis gesteld.

      5 De autoriteit die het patent heeft afgegeven geeft op verzoek een vervangend patent af indien het Rijnpatent
      onbruikbaar is geworden, verloren is gegaan of anderszins in het ongerede is geraakt. Dit patent wordt als zodanig
      gewaarmerkt. Het verlies moet bij de bevoegde autoriteit aannemelijk worden gemaakt. Een onbruikbaar geworden of
      een teruggevonden patent moet bij de autoriteit die het heeft afgegeven worden ingeleverd of worden voorgelegd
      teneinde ongeldig gemaakt te worden.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel3.06
  - number: '3.07'
    text: |-
      Het examen, de afgifte, de uitbreiding en het verstrekken van het Rijnpatent evenals het vervangen en het omruilen
      worden gedaan tegen een redelijke vergoeding van de kosten door de aanvrager. De hoogte van de kosten wordt door de
      bevoegde autoriteit vastgesteld. Deze kan de kosten geheel of ten dele vanaf het tijdstip van de aanvraag vorderen.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel3.07
  - number: '4.01'
    text: |-
      1 De houder van het grote patent, het kleine patent of het sportpatent moet zijn lichamelijke en geestelijke
      geschiktheid opnieuw aantonen bij de autoriteit die het patent heeft afgegeven door het overleggen van een medische
      verklaring, als bedoeld in de bijlage B2, die niet ouder dan drie maanden mag zijn:

      a. iedere vijf jaren vanaf het bereiken van de leeftijd van 50 jaar tot de leeftijd van 65 jaar;

      b. ieder jaar vanaf het bereiken van de leeftijd van 65 jaar.

      Bij het aantonen van de lichamelijke en geestelijke geschiktheid kan deze autoriteit tot aan de ontvangst van het
      Rijnpatent een tijdelijke verklaring als vervangend document afgeven.

      Het bewijs van de lichamelijke en geestelijke geschiktheid kan ook bij een andere bevoegde autoriteit worden
      overgelegd. Deze autoriteit geleidt de bescheiden verder naar de autoriteit die het patent afgeeft en geeft zonodig
      een tijdelijke verklaring als vervangend document af.

      2 Onverminderd het eerste lid stelt de bevoegde autoriteit bij twijfel aan de lichamelijke en geestelijke
      geschiktheid van de houder van een patent de autoriteit die het patent heeft afgegeven hiervan in kennis. Deze
      kan verlangen dat een medische verklaring als bedoeld in de bijlage B2 over de huidige staat van lichamelijke en
      geestelijke geschiktheid wordt overgelegd. De kosten van de medische verklaring worden alleen dan gedragen door de
      houder van het patent indien het vermoeden gegrond blijkt te zijn.

      3 Indien uit de medische verklaring blijkt dat het om een beperkte geschiktheid gaat, kan de autoriteit die het
      afgeeft aan het patent voorwaarden verbinden, die daarin worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel4.01
  - number: '4.02'
    text: |-
      1 De geldigheid van een patent wordt opgeschort,

      a. door een beslissing van de bevoegde autoriteit die daarbij de duur van het opschorten vaststelt. De bevoegde
      autoriteit kan een dergelijke beslissing tot opschorten nemen wanneer de voorwaarden voor intrekken nog niet zijn
      vervuld maar er twijfel bestaat aan de bekwaamheid van de patenthouder. Indien deze twijfel vóór het einde van de
      termijn van opschorten wordt weggenomen, dient de beslissing te worden ingetrokken;

      b. automatisch zonder dat een dergelijke beslissing is genomen, tot aan de verlenging van het bewijs van
      lichamelijke en geestelijke geschiktheid, indien de lichamelijke en geestelijke geschiktheid niet binnen 3 maanden
      na de verlengingstermijn, bedoeld in artikel 4.01, eerste lid, eerste volzin, opnieuw is aangetoond.

      2 In het geval bedoeld in het eerste lid, onderdeel *a*, moet het Rijnpatent bij de bevoegde autoriteit in bewaring
      worden gegeven.

      3 De bevoegde autoriteit deelt een door haar genomen beslissing als bedoeld in het eerste lid, onderdeel *a*, mede
      aan de Centrale Commissie voor de Rijnvaart en aan de autoriteit die het patent heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel4.02
  - number: '4.03'
    text: |-
      1 De autoriteit die het patent heeft afgegeven moet het patent intrekken indien blijkt dat de houder van een
      Rijnpatent niet bekwaam is tot het voeren van een schip in de zin van de artikelen 2.01, 2.02 en 2.03.

      2 De autoriteit die het patent heeft afgegeven kan het patent intrekken indien de houder van een Rijnpatent
      herhaaldelijk een voorwaarde of een beperking als bedoeld in artikel 3.06, tweede lid, niet nakomt.

      3 Bij intrekking verliest het Rijnpatent haar geldigheid. Het ongeldige patent dient onverwijld bij de autoriteit
      die het patent heeft afgegeven te worden ingeleverd dan wel te worden overgelegd om ongeldig verklaard te worden.

      4 De autoriteit die het patent heeft afgegeven kan bij het intrekken bepalen dat

      a. vóór het einde van een bepaalde termijn geen nieuw patent mag worden afgegeven, of

      b. de kandidaat voor een nieuw patent, teneinde tot een nieuw examen te worden toegelaten, aan bepaalde voorwaarden
      moet hebben voldaan.

      5 Na ontvangst van de aanvraag tot het verstrekken van een nieuw patent kan de bevoegde autoriteit de gegadigde
      geheel of gedeeltelijk van het examen vrijstelling verlenen.

      6 De autoriteit die het patent intrekt deelt dit aan de Centrale Commissie voor de Rijnvaart mede. Indien een
      bevoegde autoriteit feiten vaststelt, die tot het intrekken van een patent kunnen leiden, stelt hij de autoriteit
      die het patent heeft afgegeven hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel4.03
  - number: '4.04'
    text: |-
      1 Indien er dringende redenen aanwezig zijn om het patent in te trekken als bedoeld in [artikel 4.03][ref1] of om
      de geldigheid daarvan op te schorten als bedoeld in [artikel 4.02 eerste lid, aanhef en onderdeel a][ref2], kan de
      bevoegde autoriteit besluiten dat het patent tijdelijk wordt ingevorderd.

      2 Een patent dat tijdelijk is ingevorderd wordt onverwijld en onder opgave van redenen bij de autoriteit die het
      heeft afgegeven of bij de ingevolge de nationale voorschriften bevoegde rechtbank, overgelegd.

      3 De autoriteit die het patent heeft afgegeven moet onverwijld, nadat zij van het besluit van de tijdelijke
      invordering kennis heeft genomen, besluiten over het opschorten van de geldigheid van het patent of het intrekken
      daarvan. Indien een rechtbank bevoegd is, wordt besloten volgens de nationale voorschriften. Totdat een besluit als
      bedoeld in dit lid is genomen, geldt het besluit van de tijdelijke invordering tevens als een besluit als bedoeld
      in [artikel 4.02, eerste lid, onderdeel a][ref3].

      4 Het tijdelijk invorderen van het patent moet worden opgeheven en het patent moet aan de houder worden
      teruggegeven, wanneer de reden daarvoor is komen te vervallen of een opschorting niet wordt voorgeschreven, dan wel
      het patent niet wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008934#Artikel4.03
      [ref2]: https://wetten.overheid.nl/BWBR0008934#Artikel4.02
      [ref3]: https://wetten.overheid.nl/BWBR0008934#Artikel4.02
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel4.04
    references:
