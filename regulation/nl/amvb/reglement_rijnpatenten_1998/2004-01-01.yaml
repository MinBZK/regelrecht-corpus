        artikel: '4.02'
        hoofdstuk: '4'
  - number: '5.01'
    text: |-
      1 Patenten, afgegeven overeenkomstig de voorschriften die van toepassing zijn tot aan de inwerkingtreding van dit
      reglement dan wel waarvan de geldigheid volgens die voorschriften is verlengd, blijven geldig met inachtneming van
      die voorschriften tot de eerste vernieuwing van het bewijs van lichamelijke en geestelijke geschiktheid.

      2 Artikel 4.01 met betrekking tot de controle van de lichamelijke en geestelijke geschiktheid is van toepassing op
      het in het eerste lid bedoelde Rijnschipperspatent, kleine patent en sportpatent, waarbij het anomaalquotiënt bij
      het kleuronderscheidingsvermogen 0,7 tot 3,0 mag bedragen. De houders van een patent die bij de inwerkingtreding
      van dit reglement reeds de leeftijd, bedoeld in artikel 4.01, eerste lid, onderdeel *a*, hebben bereikt moeten hun
      lichamelijke en geestelijke geschiktheid bij de eerstvolgende voorgeschreven onderzoeksdatum laten controleren. Bij
      de eerste verlenging van de gebleken lichamelijke en geestelijke geschiktheid wordt aan hun een patent volgens het
      model van de bijlage A1 afgegeven.

      3 De artikelen 4.02 en 4.03 zijn van toepassing op de patenten als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel5.01
  - number: '5.02'
    text: |-
