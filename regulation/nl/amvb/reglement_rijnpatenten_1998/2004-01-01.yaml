      2 Een geldig patent kan volgens de tabel in het eerste lid worden omgewisseld voor het gelijkwaardige patent voor
      hetzelfde riviergedeelte.

      3 De gegadigde die aantoont, dat hij voor de inwerkingtreding van dit reglement

      a. een pleziervaartuig met een lengte van meer dan 15 m heeft gevoerd, krijgt op aanvraag een sportpatent voor
      het voeren van pleziervaartuigen met een waterverplaatsing van ten hoogste 15 m3, zonder daarvoor examen te doen.
      Als bewijs is een verklaring, afgegeven door een door de bevoegde autoriteit erkende watersportbond of een tot de
      erkende watersportbond behorende watersportvereniging, toereikend;

      b. een ander schip met een lengte van meer dan 15 m heeft gevoerd, krijgt op aanvraag een klein patent voor het
      voeren van schepen met een waterverplaatsing van ten hoogste 15 m3, zonder daarvoor examen te doen. Als bewijs is
      een verklaring, afgegeven door de voor het te bevaren riviergedeelte bevoegde autoriteit, toereikend.


      [ref1]: https://wetten.overheid.nl/BWBR0008934#Artikel5.01
