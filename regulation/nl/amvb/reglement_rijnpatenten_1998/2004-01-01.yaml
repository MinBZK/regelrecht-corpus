articles:
  - number: '1.01'
    text: |-
      In dit reglement wordt verstaan onder:

      1. *schip:* een binnenschip, een zeeschip of een drijvend werktuig;

      2. binnenschip: een schip, met inbegrip van een veerpont, dat uitsluitend of overwegend is bestemd voor de vaart op
      de binnenwateren;

      3. *zeeschip:* een schip dat is toegelaten voor de zee- of kustvaart en overwegend daartoe bestemd is;

      4. *drijvend werktuig:* een drijvend bouwsel waarop zich werkinstallaties bevinden, zoals kranen, baggermolens,
      hei-installaties of elevatoren;

      5. *pleziervaartuig:* een schip dat is bestemd voor sportieve of recreatieve doeleinden en dat niet is een
      passagiersschip;

      6. *passagiersschip:* een schip dat is gebouwd en ingericht voor het vervoer van meer dan 12 passagiers;

      7. *sleepboot:* een schip dat speciaal is gebouwd om te slepen;

      8. *duwboot:* een schip dat speciaal is gebouwd voor het voortbewegen van een duwstel;

      9. *kanaalspits:* een schip waarvan de lengte niet meer dan 38,50 m en de breedte niet meer dan 5,05 m bedraagt en
      dat gewoonlijk op het Rijn-Rhône kanaal vaart;

      10. *overheidsvaartuig:* een schip waarvan de lengte niet meer dan 25 m bedraagt en dat ter uitvoering van
      overheidstaken wordt ingezet;

      11. *brandweerboot:* een schip waarvan de lengte 15 m of meer bedraagt en dat ter uitvoering van brandweerdiensten
      wordt ingezet;

      12. *lengte:* de grootste lengte van de scheepsromp in m, het roer en de boegspriet niet inbegrepen;

      13. *breedte:* de grootste breedte van de scheepsromp in m, gemeten op de buitenkant van de huidbeplating
      (schoepraderen, schuurlijsten en dergelijke niet inbegrepen);

      14. *gekoppeld samenstel:* een hecht samenstel van langszijde van elkaar vastgemaakte schepen, waarvan er geen is
      geplaatst vóór het motorschip dat dient voor het voortbewegen van het samenstel;

      15. *dekbemanning:* de bemanning met uitzondering van machinisten;

      16. *matroos, matroos-motordrijver, volmatroos, stuurman:* een persoon, die de bekwaamheid bedoeld in de
      bemanningsvoorschriften van het Reglement onderzoek schepen op de Rijn bezit;

      17. *vaartijd:* de tijd aan boord van een schip, dat een reis maakt.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel1.01
  - number: '1.02'
    text: |-
      Dit reglement regelt de verplichting tot het hebben van een Rijnpatent voor de betreffende typen en afmetingen van
      schepen en voor de te bevaren riviergedeelten alsmede de voorwaarden betreffende het verkrijgen van een Rijnpatent.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel1.02
  - number: '1.03'
    text: |-
      1 Degene die op de Rijn een schip wil voeren, moet ingevolge dit reglement zijn voorzien van een Rijnpatent voor
      het type en de grootte van het betreffende schip alsmede voor het te bevaren riviergedeelte.

      2 Het Rijnpatent wordt verleend voor de gehele Rijn of voor afzonderlijke gedeelten daarvan.

      3 Voor de vaart benedenstrooms van het Spijksche Veer (km 857,40) kan worden volstaan met,

      a. voorzover de Duits-Nederlandse grens in de ene of de andere richting niet wordt overschreden, in plaats van het
      patent bedoeld in artikel 2.01,

        - een vaarbewijs als bedoeld in de bijlage I van de [Richtlijn 91/672/EEG](31991L0672), of
        - een vaarbewijs afgegeven ingevolge de [Richtlijn 96/50/EG](31996L0050);

      b. in plaats van het patent, bedoeld in de artikelen 2.02 tot en met 2.05, een ander door de bevoegde autoriteit
      als gelijkwaardig erkend bewijs van vaarbekwaamheid.

      4 Voor schepen met een lengte van minder dan 15 m, met uitzondering van passagiersschepen, duw- en sleepboten,
      kan worden volstaan met een bewijs van vaarbekwaamheid voor de binnenwateren, dat in overeenstemming is met de
      nationale voorschriften van de Rijnoeverstaten en België.

      5 Voor veerponten en voor schepen die uitsluitend door spierkracht worden voortbewogen alsmede voor schepen met een
      lengte van minder dan 15 m die slechts

      a. door middel van zeilen worden voortbewogen, dan wel

      b. zijn uitgerust met mechanische middelen tot voortbeweging van niet meer dan 3,68 kW, wordt de verplichting tot
      het hebben van een patent uitsluitend geregeld door de nationale voorschriften van de Rijnoeverstaten.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel1.03
  - number: '1.04'
    text: |-
      1 Rijnpatenten als bedoeld in dit reglement zijn:

      a. het grote patent voor het voeren van alle schepen,

      b. het kleine patent voor het voeren van een schip met een lengte van minder dan 35 m, mits het geen sleep- of
      duwboot is dan wel het niet voor het voortbewegen van een gekoppeld samenstel dient, of voor het voeren van een
      schip, dat bestemd is voor het vervoer van niet meer dan 12 passagiers,

      c. het sportpatent voor het voeren van een pleziervaartuig met een lengte van minder dan 25 m,

      d. het kanaalspitsenpatent voor het voeren van kanaalspitsen op het riviergedeelte tussen de Mittlere Rheinbrücke
      te Basel (km 166,64) en de sluizen te Iffezheim (km 335,92),

      e. het overheidspatent voor het voeren van overheidsschepen en van brandweerboten.

      2 De patenten bedoeld in het eerste lid mogen eveneens worden gebruikt voor het voeren van een schip als bedoeld in
      artikel 1.03, vierde lid.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel1.04
  - number: '1.05'
    text: |-
      De Centrale Commissie voor de Rijnvaart kan voor de toepassing van dit reglement richtlijnen vaststellen. De
      bevoegde autoriteiten dienen zich aan deze richtlijnen te houden.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel1.05
  - number: '1.06'
    text: |-
      De Centrale Commissie voor de Rijnvaart kan voorschriften van tijdelijke aard vaststellen, wanneer het voor een
      aanpassing aan de technische ontwikkeling van de binnenscheepvaart noodzakelijk wordt geacht om in dringende
      gevallen afwijkingen van dit reglement toe te laten dan wel proefnemingen mogelijk te maken, waardoor de veiligheid
      en de vlotte afwikkeling van het scheepvaartverkeer niet worden benadeeld. Deze voorschriften van tijdelijke
      aard worden door de bevoegde autoriteit gepubliceerd en hebben een geldigheidsduur van ten hoogste drie jaren.
      Zij worden in alle Oeverstaten en in België op hetzelfde tijdstip in werking gesteld en worden onder dezelfde
      voorwaarden buiten werking gesteld.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel1.06
  - number: '2.01'
    text: |-
      1 Degene die het grote patent wil verkrijgen moet ten minste 21 jaar oud zijn en de nodige kwalificatie bezitten,
      alsmede een vaartijd aantonen van ten minste vier jaar als lid van een dekbemanning, waarvan aan boord van een
      motorschip in de binnenvaart ten minste twee jaren als matroos of matroos-motordrijver dan wel ten minste één jaar
      als volmatroos. De gegadigde moet tevens in het bezit zijn van een marifoonbedieningscertificaat als bedoeld in
      bijlage 5 van de Regionale regeling betreffende de marifoondienst in de Binnenvaart.

      2 Gekwalificeerd is degene die:

      a. lichamelijk en geestelijk geschikt is om een schip te voeren.

      De geschiktheid wordt aangetoond door het overleggen van een medische verklaring, als bedoeld in de bijlagen B1 en
      B2, afgegeven door een arts, die door de bevoegde autoriteit is aangewezen;

      b. geen strafbare feiten in de scheepvaart heeft begaan, terwijl uit voorgaand gedrag verwacht mag worden dat een
      schip veilig gevoerd en het bevel over een bemanning uitgeoefend kan worden;

      c. bekwaam is, dat wil zeggen beschikt over de noodzakelijke beroepsmatige vaardigheden en kennis, ook in
      nautisch opzicht, alsmede over voldoende kennis van de reglementen en van de vaarweg, in het bijzonder van het
      riviergedeelte waarvoor het patent wordt aangevraagd. Aan de voorwaarden wordt geacht te zijn voldaan wanneer de
      gegadigde het daartoe ingestelde examen met goed gevolg heeft afgelegd.

      3 De vaartijd moet zijn doorlopen op een schip voor het voeren waarvan respectievelijk het grote patent, het
      kleine patent of het kanaalspitsenpatent vereist zou zijn. Als één jaar vaartijd gelden 180 effectieve vaardagen
      in de binnenvaart. Binnen een periode van 365 opeenvolgende dagen kunnen maximaal 180 dagen als vaartijd worden
      meegerekend.

      Tot de vaartijd als bedoeld in het eerste lid, die niet als matroos, matroos-motordrijver of volmatroos verricht
      hoeft te zijn, wordt meegerekend:

      a. de tijd van de opleiding, met een maximum van twee jaren, indien de gegadigde in het bezit is van een door de
      bevoegde autoriteit erkende verklaring inzake een met goed gevolg afgesloten beroepsopleiding met praktijkgedeelten
      op het gebied van de binnenvaart,

      b. de aangetoonde vaartijd, met een maximum van twee jaren, die op zee als lid van een dekbemanning is
      doorgebracht, waarbij 250 zeedagen als één jaar vaartijd gelden.

      4 Bovendien moet het riviergedeelte, waarvoor het grote patent wordt aangevraagd als matroos, matroos-motordrijver,
      volmatroos of stuurman aan boord van een motorschip, voor het voeren waarvan een groot patent is vereist, in
      een tijdvak van tien jaren voorafgaand aan de aanvraag tenminste zestien maal zijn bevaren, waarvan binnen de
      laatste drie jaren tenminste drie maal in elke richting. Deze eis is niet van toepassing voor het riviergedeelte
      benedenstrooms van het Spijksche Veer.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel2.01
  - number: '2.02'
    text: |-
      1 Degene die het kleine patent wil verkrijgen moet ten minste 21 jaar oud zijn en de nodige kwalificatie bezitten,
      alsmede een vaartijd aantonen van ten minste één jaar aan boord van een motorschip in de binnenvaart als matroos
      of als matroos-motordrijver. De gegadigde moet tevens in het bezit zijn van een marifoonbedieningscertificaat als
      bedoeld in bijlage 5 van de Regionale regeling betreffende de marifoondienst in de Binnenvaart.

      2 Gekwalificeerd is degene die:

      a. lichamelijk en geestelijk geschikt is om een schip te voeren.

      De geschiktheid wordt aangetoond door het overleggen van een medische verklaring, als bedoeld in de bijlagen B1 en
      B2, afgegeven door een arts, die door de bevoegde autoriteit is aangewezen;

      b. geen strafbare feiten in de scheepvaart heeft begaan, terwijl uit voorgaand gedrag verwacht mag worden dat een
      schip veilig gevoerd en het gezag over een bemanning uitgeoefend kan worden;

      c. bekwaam is, dat wil zeggen beschikt over de noodzakelijke beroepsmatige vaardigheden en kennis, ook in
      nautisch opzicht, alsmede over voldoende kennis van de reglementen en van de vaarweg, in het bijzonder van het
      riviergedeelte waarvoor het patent wordt aangevraagd. Aan de voorwaarden wordt geacht te zijn voldaan wanneer de
      gegadigde het daartoe ingestelde examen met goed gevolg heeft afgelegd.

      3 De vaartijd moet zijn doorlopen op een schip voor het voeren waarvan respectievelijk het grote patent, het kleine
      patent of het kanaalspitsenpatent vereist zou zijn. Als één jaar vaartijd gelden 180 effectieve vaardagen in de
      binnenvaart.

      4 Bovendien moet het riviergedeelte, waarvoor het kleine patent wordt aangevraagd, als matroos, matroos-
      motordrijver, volmatroos of stuurman aan boord van een motorschip, voor het voeren waarvan een groot patent, een
      klein patent of een kanaalspitsenpatent vereist zou zijn, in een tijdvak van tien jaren voorafgaand aan de aanvraag
      tenminste zestien maal zijn bevaren, waarvan binnen de laatste drie jaren tenminste drie maal in elke richting.
      Deze eis is niet van toepassing voor het riviergedeelte benedenstrooms van het Spijksche Veer.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel2.02
  - number: '2.03'
    text: |-
      1 Degene die het sportpatent wil verkrijgen moet ten minste 18 jaar oud zijn en de nodige kwalificatie bezitten.

      2 Gekwalificeerd is degene die:

      a. lichamelijk en geestelijk geschikt is om een schip te voeren.

      De geschiktheid wordt aangetoond door het overleggen van een medische verklaring, als bedoeld in de bijlagen B1 en
      B2, afgegeven door een arts, die door de bevoegde autoriteit is aangewezen;

      b. geen strafbare feiten in de scheepvaart heeft begaan, terwijl uit voorgaand gedrag verwacht mag worden dat een
      schip veilig kan worden gevoerd;

      c. bekwaam is, dat wil zeggen beschikt over de noodzakelijke vaardigheden en kennis, ook in nautisch opzicht,
      alsmede over voldoende kennis van de reglementen en van de vaarweg, in het bijzonder van het riviergedeelte
      waarvoor het patent wordt aangevraagd. Aan de voorwaarden wordt geacht te zijn voldaan wanneer de gegadigde het
      daartoe ingestelde examen met goed gevolg heeft afgelegd.

      3 Bovendien moet het riviergedeelte waarvoor het sportpatent wordt aangevraagd met een schip met een lengte van 15
      m of meer

      a. hetzij ten minste zestien maal in een tijdvak van tien jaren voorafgaand aan de aanvraag, waarvan binnen de
      laatste drie jaren tenminste drie maal in elke richting,

      b. hetzij binnen het kader van een vakkundige opleiding tenminste viermaal in elke richting in het laatste jaar
      voorafgaand aan de aanvraag zijn bevaren.

      Deze eis is niet van toepassing voor het riviergedeelte benedenstrooms van het Spijksche Veer.

      4 Slechts reizen gemaakt vanaf de leeftijd van 15 jaar komen in aanmerking.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel2.03
  - number: '2.04'
    text: |-
      Degene die het kanaalspitsenpatent wil verkrijgen moet:

      a. ten minste 18 jaar oud zijn;

      b. voldoen aan de voorwaarden noodzakelijk voor het voeren van kanaalspitsen op het Rijn-Rhônekanaal.

      Het kanaalspitsenpatent wordt niet uitgebreid tot de riviergedeelten buiten het gebied tussen Basel en de sluizen
      te Iffezheim.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel2.04
  - number: '2.05'
    text: |-
      1 Degene die het overheidspatent wil verkrijgen moet:

      a. ten minste 21 jaar oud zijn;

      b. deel uit maken van een politie- of douanedienst, een andere autoriteit dan wel van een erkende brandweerdienst;

      c. lichamelijk en geestelijk geschikt zijn om een schip te voeren.

      De geschiktheid wordt aangetoond door het overleggen van een medische verklaring, als bedoeld in de bijlagen B1 en
      B2, afgegeven door een arts, die door de bevoegde autoriteit is aangewezen;

      d. bekwaam zijn, dat wil zeggen beschikken over de noodzakelijke beroepsmatige vaardigheden en kennis, ook in
      nautisch opzicht, alsmede over voldoende kennis van de reglementen en van de vaarweg, in het bijzonder van het
      riviergedeelte waarvoor het patent wordt aangevraagd.

      Aan de eisen wordt geacht te zijn voldaan wanneer de gegadigde het daartoe ingestelde examen met goed gevolg heeft
      afgelegd;

      e. ten minste drie jaren de binnenvaart in de praktijk hebben uitgeoefend, waarvan ten minste drie maanden
      gedurende het laatste jaar;

      f. binnen een tijdvak van tien jaren voorafgaand aan de aanvraag moet het riviergedeelte, waarvoor het patent wordt
      aangevraagd, op een schip met een lengte van 15 m of meer ten minste zestien maal hebben bevaren, waarvan binnen de
      laatste drie jaren ten minste drie maal in elke richting. Deze eis is niet van toepassing voor het riviergedeelte
      benedenstrooms van het Spijksche Veer.

      2 De dienst waarvan de aanvrager deel uitmaakt moet een verklaring hebben afgegeven, waarin de informatie bedoeld
      in het eerste lid, onderdelen *b*, *e* en *f*, wordt bevestigd.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel2.05
  - number: '2.06'
    text: |-
      1 De vereiste vaartijd en de reizen op bepaalde riviergedeelten van de Rijn moeten worden aangetoond aan de hand
      van een behoorlijk ingevuld en gewaarmerkt dienstboekje, als bedoeld in de bijlage F van het Reglement onderzoek
      schepen op de Rijn. Het dienstboekje moet door de bevoegde autoriteit zijn afgegeven. Het kan zijn opgesteld in de
      Duitse, Franse of Nederlandse taal.

      2 Voorzover een dienstboekje ingevolge het Reglement onderzoek schepen op de Rijn of ingevolge nationale
      voorschriften voor de vaarwegen buiten de Rijn niet is voorgeschreven, kunnen de reizen op bepaalde riviergedeelten
      van de Rijn en de vaartijd ook worden aangetoond door een geldig ambtelijk document, dat tenminste de volgende
      gegevens bevat:

      a. soort, grootte, aantal passagiers, naam en vermogen van de schepen, waarop de aanvrager heeft gevaren;

      b. de naam van de schipper;

      c. het tijdstip van het begin en het einde van de reizen;

      d. de uitgeoefende functie;

      e. de bevaren riviergedeelten (precieze aanduiding met plaatsen van vertrek en aankomst).

      3 De vaartijd kan eveneens worden aangetoond met een vaarbewijs of een bewijs van vaarbekwaamheid als bedoeld in
      artikel 3.05, derde lid, tot de omvang die voor het verkrijgen van dit bewijs reeds is aangetoond.

      4 De vaartijd op zee moet worden aangetoond door middel van een monsterboekje.

      5 De tijd doorgebracht op een vakschool voor schippers moet worden aangetoond door een getuigschrift van die
      school.

      6 Voor zover noodzakelijk, moeten de documenten, als bedoeld in het tweede tot en met het vijfde lid, vergezeld van
      een officiële vertaling in de Duitse, Franse of Nederlandse taal worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel2.06
  - number: '3.01'
    text: |-
      1 De bevoegde autoriteit benoemt één of meer examencommissies voor het afnemen van de examens. Iedere
      examencommissie bestaat uit een voorzitter, die vertegenwoordiger is van de overheid van één der Rijnoeverstaten of
      België, en tenminste twee bijzitters, die voldoende terzake kundig zijn.

      2 De examencommissie moet zo zijn samengesteld, dat tenminste één examinator houder is van het patent van het type
      dat wordt aangevraagd dan wel van het grote patent en deze, of een andere examinator, houder is van het patent voor
      het aangevraagde riviergedeelte.
    url: https://wetten.overheid.nl/BWBR0008934/2004-01-01#Artikel3.01
  - number: '3.02'
    text: |-
      1 Degene die een Rijnpatent verkrijgen of uitbreiden wil moet een aanvraag voor toelating tot het examen en afgifte
      van het patent richten aan de bevoegde autoriteit, onder opgave van het volgende:

      a. voor- en achternamen, geboortedatum, geboorteplaats en adres;

      b. type patent dat men verkrijgen wil;

      c. gedeelte van de Rijn waarvoor het patent wordt aangevraagd.

      2 2. Bij de aanvraag moeten worden overgelegd:

      a. een recente pasfoto;

      b. een medische verklaring als bedoeld in [bijlage B2][ref1], die niet ouder dan drie maanden mag zijn. Ingeval
      van twijfel aan de lichamelijke en geestelijke geschiktheid kan de bevoegde autoriteit verlangen dat verklaringen
      van een arts of een specialist worden overgelegd; de lichamelijke en geestelijke geschiktheid kan eveneens
      worden aangetoond met een geldig vaarbevoegdheidsbewijs, dat door de Centrale Commissie voor de Rijnvaart is
      erkend en waarvoor dezelfde eisen gelden als bedoeld in [bijlage B1][ref2] en [B2][ref3] en als bedoeld in
      [artikel 4.01][ref4];

      c. voor zover vereist, een bewijs van de vaartijd en van de reizen op bepaalde riviergedeelten;

      d. een kopie van de identiteitskaart of het paspoort;

      e. voor zover vereist, een kopie van het marifoonbedieningscertificaat als bedoeld in bijlage 5 van de Regionale
      regeling betreffende de marifoondienst in de Binnenvaart.

      3 Het vereiste met betrekking tot de kwalificatie als bedoeld in de artikelen 2.01, tweede lid, onderdeel *b*,
      2.02, tweede lid, onderdeel *b*, of 2.03, tweede lid, onderdeel *b*, moet door middel van

        - een uittreksel uit het strafregister of
        - een ander gelijkwaardig document worden aangetoond. Personen die hun domicilie hebben buiten het
      toepassingsgebied van dit reglement moeten een overeenkomstig geldig document overleggen dat is afgegeven ingevolge
      het geldende recht van hun woonplaats.

      Deze documenten mogen in elk geval niet ouder zijn dan 6 maanden.

      4 Indien het patent tot een ander riviergedeelte moet worden uitgebreid, behoeft bij de aanvraag slechts een kopie
      van het patent en het bewijs van de reizen op het bedoelde riviergedeelte te worden bijgevoegd.

      Wanneer een houder van een Rijnpatent een ander type Rijnpatent wenst te verkrijgen, kan de bevoegde autoriteit
      beslissen dat de bescheiden bedoeld in het tweede lid, onderdeel *b*, of de documenten, bedoeld in het derde lid,
      niet opnieuw moeten worden overgelegd.

      5 De aanvraag voor de afgifte van een kanaalspitsenpatent is niet aan een bepaalde vorm gebonden.


