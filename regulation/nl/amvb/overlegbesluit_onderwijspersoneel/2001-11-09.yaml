  - number: 25b
    text: |-
      1 Het Werkgeversoverleg stelt zijn standpunt vast over de hem voorgelegde dan wel op zijn verzoek in het overleg
      behandelde aangelegenheden.

      2 Over aangelegenheden waarover Onze Minister overleg voert met de Sectorcommissie, geeft het Werkgeversoverleg
      zijn standpunt voorafgaand aan de afronding van het overleg met die commissie.

      3 Het standpunt van het Werkgeversoverleg wordt bepaald bij eenvoudige meerderheid van stemmen. Elke in
      [artikel 24][ref1] genoemde organisatie brengt één stem uit.

      4 Indien Onze Minister voornemens is om in het overleg met de Sectorcommissie af te wijken van het standpunt van
      het Werkgeversoverleg voert hij vooraf opnieuw overleg met het Werkgeversoverleg. Indien het niet mogelijk is
      vooraf opnieuw overleg te voeren, informeert Onze Minister het Werkgeversoverleg in elk geval zo spoedig mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006446#Artikel24
