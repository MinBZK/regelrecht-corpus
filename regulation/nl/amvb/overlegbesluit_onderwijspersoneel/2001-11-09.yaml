  - number: '2'
    text: |-
      1 Er is een Sectorcommissie Onderwijspersoneel voor overleg in zaken betreffende de rechtspositie van het personeel
      werkzaam bij instellingen.

      2 Zij ressorteert onder Onze Minister.

      3 Met de Sectorcommissie wordt door of namens Onze Minister met betrekking tot het personeel van
      instellingen als bedoeld in [artikel 1, onderdeel g, onder 1 en 4][ref1], indien op die instellingen het
      [Rechtspositiebesluit onderwijspersoneel][ref2] van toepassing is, overleg gepleegd over aangelegenheden van
      algemeen belang voor de rechtstoestand van het personeel, met inbegrip van de algemene regels volgens welke het
      personeelsbeleid zal worden gevoerd.

      4 Met de Sectorcommissie wordt door of namens Onze Minister met betrekking tot het personeel van
      instellingen als bedoeld in [artikel 1, onderdeel g, onder 2, 3 en 4][ref3], indien op die instellingen het
      [Rechtspositiebesluit onderwijspersoneel][ref4] niet van toepassing is, overleg gepleegd over:

      a. de algemene salarisontwikkeling,

      b. de mutaties in de algemene arbeidsduur,

      c. de mutaties in algemeen aanvullende aanspraken met betrekking tot ziekte en werkloosheid voor zover die uitgaan
      boven de wettelijke aanspraken van de werknemersverzekeringen,

      d. de overige arbeidsvoorwaarden, waarover partijen afspraken hebben gemaakt of willen maken.

      5 Met betrekking tot onderwerpen als bedoeld in het vierde lid onder a, b en c, is [artikel 11][ref5] van
      toepassing. Artikel 11 is niet van toepassing met betrekking tot onderwerpen als bedoeld in het vierde lid onder d.

      6 Het derde en het vierde lid blijven buiten toepassing ten aanzien van:

      a. aangelegenheden van algemeen belang voor de rechtstoestand van al het overheidspersoneel waaromtrent overleg
      als bedoeld in de Regeling overleg Raad voor het Overheidspersoneelsbeleid is gevoerd met de Raad voor het
      Overheidspersoneelsbeleid, welke aangelegenheden mede van algemeen belang zijn voor de rechtstoestand van het
      onderwijspersoneel, tenzij in het overleg over deze aangelegenheden is voorzien in een bevoegdheid om aanvullende
      of afwijkende voorzieningen te treffen ten behoeve van het onderwijspersoneel;

      b. aangelegenheden als bedoeld [onder ][ref6], zolang het overleg met de Raad voor het Overheidspersoneelsbeleid
      nog niet heeft plaatsgevonden, tenzij het aangelegenheden betreft waaromtrent Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties en de Raad voor het Overheidspersoneelsbeleid zijn overeengekomen dat het overleg
      dienaangaande voor de sector Onderwijs en Wetenschappen met de Sectorcommissie gevoerd zal worden.


