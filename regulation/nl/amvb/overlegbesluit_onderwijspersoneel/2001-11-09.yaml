  - number: '11'
    text: |-
      1 Voorstellen in aangelegenheden waarover ingevolge [artikel 2][ref1] overleg moet worden gepleegd en waaromtrent
      in het overleg geen overeenstemming is bereikt met de meerderheid van de centrales, worden niet ten uitvoer gelegd,
      voor zover het betreft:

      a. voorstellen met betrekking tot de bestemming van gelden die in het overleg met de Raad voor het
      Overheidspersoneelsbeleid ten behoeve van de arbeidsvoorwaarden voor het onderwijspersoneel beschikbaar zijn
      gesteld;

      b. voorstellen strekkende tot invoering of wijziging van een regeling met rechten of verplichtingen van individuele
      leden van het onderwijspersoneel.

      2 Het eerste lid, aanhef en onder b, is niet van toepassing op voorstellen strekkende tot:

      a. invoering of wijziging van een wettelijke regeling die betrekking heeft op alle burgers of alle werknemers,
      waaronder begrepen het onderwijspersoneel;

      b. invoering of wijziging van een wettelijke regeling voor het onderwijspersoneel met een overeenkomstige inhoud
      als een voorstel tot invoering of wijziging van een wettelijke regeling die betrekking heeft op werknemers die
      krachtens arbeidsovereenkomst als bedoeld in [artikel 610 van Boek 7 van het Burgerlijk Wetboek][ref2] werkzaam
      zijn;

      c. van toepassing verklaring op het onderwijspersoneel van een wettelijke regeling
      die betrekking heeft op werknemers die krachtens arbeidsovereenkomst als bedoeld in
      [artikel 610 van Boek 7 van het Burgerlijk Wetboek][ref3] werkzaam zijn en met die van toepassing verklaring
      samenhangende wijzigingen in voor het onderwijspersoneel geldende regelingen, een en ander mits het totaal van
      rechten en verplichtingen van dat personeel over het geheel beoordeeld niet ongunstiger wordt;

      d. implementatie van verplichtingen voortvloeiend uit een internationaal verdrag.

      3 Indien na toepassing van [artikel 10, derde of zesde lid][ref4], en, in voorkomende gevallen, de
      [artikelen 13][ref5] en [14][ref6], eerste en derde of tweede en derde lid, blijkt dat in het overleg over
      een voorstel als bedoeld in het eerste lid de stemmen tussen de centrales staken en de deelnemers aan het
      overleg geen gebruik maken van de mogelijkheid om een advies of een arbitrale uitspraak als bedoeld in
      [artikel 16, eerste lid][ref7], te vragen of, indien het een vaste afdeling betreft, te doen vragen, kan Onze
      Minister, in afwijking van het eerste lid, besluiten dat het voorstel ten uitvoer zal worden gebracht. Ten aanzien
      van dat besluit is [artikel 21, tweede lid][ref8], van overeenkomstige toepassing.


