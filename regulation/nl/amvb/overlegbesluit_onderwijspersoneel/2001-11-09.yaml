  - number: '13'
    text: |-
      1 Indien de voorzitter SCOP of de voorzitter van een vaste afdeling, dan wel één of meer van de centrales, tijdens
      het overleg in de Sectorcommissie, respectievelijk een vaste afdeling, tot het oordeel komen dat het overleg niet
      tot een uitkomst zal leiden die de instemming van alle deelnemers aan dat overleg zal hebben, brengen zij dat
      oordeel binnen drie dagen nadat zij daarvan in het overleg blijk hebben gegeven schriftelijk ter kennis van de
      overige deelnemers aan het overleg.

      2 Het eerste lid is van overeenkomstige toepassing indien de voorzitter van een andere afdeling dan bedoeld in
      het eerste lid, of één of meer van de centrales, tijdens het overleg in deze afdeling over een onderwerp dat ter
      afhandeling naar deze afdeling is verwezen, tot het in het eerste lid bedoelde oordeel komen. De centrale, de
      centrales of de voorzitter die het betreft, brengen het in het eerste lid bedoelde oordeel binnen de in dat lid
      gestelde termijn tevens schriftelijk ter kennis van de voorzitter SCOP.
    url: https://wetten.overheid.nl/BWBR0006446/2001-11-09#Artikel13
  - number: '14'
    text: |-
      1 Binnen vijf dagen na de kennisgeving, bedoeld in [artikel 13, eerste lid][ref1], schrijft de voorzitter die het
      aangaat een buitengewone vergadering uit van het overlegorgaan waarin het geschil is gerezen. De vergadering moet
      worden gehouden binnen zeven dagen nadat deze is uitgeschreven.

      2 Binnen vijf dagen na de kennisgeving, bedoeld in [artikel 13, tweede lid][ref2], schrijft de voorzitter SCOP een
      buitengewone vergadering uit van de Sectorcommissie. De vergadering moet worden gehouden binnen zeven dagen nadat
      deze is uitgeschreven.

      3 Tenzij door de desbetreffende voorzitter en de centrales wordt besloten het overleg voort te zetten, dan wel
      te beëindigen, wordt in de vergadering nagegaan of overeenstemming bestaat over de vraag wat het onderwerp en de
      inhoud van het geschil is.

      4 Een in de Sectorcommissie gerezen geschil kan zowel door de voorzitter SCOP als door de Sectorcommissie voor
      advies bij de Advies- en Arbitragecommissie aanhangig worden gemaakt. Het geschil kan aan arbitrage worden
      onderworpen, indien daarover overeenstemming bestaat tussen alle deelnemers aan het overleg in de Sectorcommissie.

      5 Een in de Sectorcommissie gerezen geschil over de vraag of bij een voorstel als bedoeld in
      [artikel 11, tweede lid, onder ][ref3], voldaan wordt aan de voorwaarde dat het totaal van rechten en
      verplichtingen van het onderwijspersoneel over het geheel beoordeeld niet ongunstiger wordt, wordt onderworpen
      aan arbitrage.

      6 Een in een vaste afdeling gerezen geschil kan zowel door de voorzitter van die afdeling als door de meerderheid
      van de centrales in die afdeling aan de Sectorcommissie worden voorgelegd, met het verzoek dat geschil bij de
      Advies- en Arbitragecommissie aanhangig te maken. Een verzoek als evenbedoeld wordt ingediend binnen drie dagen na
      een vergadering als bedoeld in het eerste lid.

      7 De voorzitter SCOP schrijft binnen drie dagen na ontvangst van een verzoek als bedoeld in het zesde lid een
      buitengewone vergadering van de Sectorcommissie uit, welke moet worden gehouden binnen vijf dagen nadat deze
      is uitgeschreven. In die vergadering wordt nagegaan of overeenstemming bestaat over de vraag of het voorgelegde
      geschil voor advies of voor arbitrage aan de Advies- en Arbitragecommissie zal worden voorgelegd. Het vierde en
      vijfde lid zijn van overeenkomstige toepassing.

      8 Indien in het overleg met de Sectorcommissie, bedoeld in het zevende lid, wordt geconstateerd dat de
      mogelijkheden voor nader overleg nog niet zijn uitgeput, kan de Sectorcommissie de vaste afdeling die het betreft
      verzoeken het overleg voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0006446#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006446#Artikel13
