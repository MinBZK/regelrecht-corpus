  - number: '18'
    text: |-
      1 De Advies- en Arbitragecommissie besluit bij meerderheid van stemmen.

      2 Het advies of de arbitrale uitspraak moet inhouden:

      a. de namen van de deelnemers die het advies of de arbitrale uitspraak hebben aangevraagd;

      b. een overzicht van de standpunten van alle deelnemers over het onderwerp en de inhoud van het geschil;

      c. het advies dan wel de arbitrale uitspraak en de redenen die daaraan ten grondslag liggen.

      3 Het advies of de arbitrale uitspraak wordt gedagtekend en door ieder der optredende leden van de Advies- en
      Arbitragecommissie ondertekend.
    url: https://wetten.overheid.nl/BWBR0006446/2001-11-09#Artikel18
  - number: '19'
    text: Binnen twee weken na ontvangst van het advies wordt het overleg over het geschil voortgezet.
    url: https://wetten.overheid.nl/BWBR0006446/2001-11-09#Artikel19
  - number: '20'
    text: De arbitrale uitspraak van de Advies- en Arbitragecommissie heeft bindende kracht.
    url: https://wetten.overheid.nl/BWBR0006446/2001-11-09#Artikel20
  - number: '21'
    text: |-
      1 De voorzitter SCOP brengt het standpunt van de Sectorcommissie dan wel de afdeling waarnaar de Sectorcommissie
      een onderwerp ter afhandeling heeft verwezen, schriftelijk, met het advies van de werkgroep of werkgroepen en de
      Advies- en Arbitragecommissie, in geval dit is uitgebracht, ter kennis van Onze Minister en van Onze Ministers van
      Financiën en van Landbouw, Natuurbeheer en Visserij.

      2 Van het besluit omtrent een onderwerp waarover de Sectorcommissie haar standpunt heeft bepaald, wordt
      door Onze Minister aan de voorzitter SCOP schriftelijk mededeling gedaan. Indien wordt afgeweken van het
      meerderheidsstandpunt van de commissie, worden tevens de redenen van die afwijking vermeld.

      3 De voorzitter SCOP doet van het in het tweede lid bedoelde besluit en eventuele redenen van afwijking
      schriftelijk mededeling aan de leden en plaatsvervangende leden van de Sectorcommissie en aan de voorzitter, de
      leden en plaatsvervangende leden van de betrokken afdelingen of werkgroepen.
    url: https://wetten.overheid.nl/BWBR0006446/2001-11-09#Artikel21
  - number: '22'
    text: |-
      1 In het overleg tussen de leden van de Sectorcommissie en de voorzitter SCOP kan desgewenst een reglement van orde
      worden vastgesteld.

      2 Het overleg met de Sectorcommissie wordt gevoerd op een plaats, dag en uur, door de voorzitter na overleg met de
      commissie te bepalen.

      3 Indien een lid van de Sectorcommissie, onder vermelding van hetgeen hij behandeld wenst te zien, de voorzitter
      verzoekt daartoe een vergadering uit te schrijven, belegt de voorzitter deze zo spoedig mogelijk, doch uiterlijk
      een maand na ontvangst van het verzoek.

      4 Het eerste en tweede lid zijn van overeenkomstige toepassing op de afdelingen en werkgroepen.
    url: https://wetten.overheid.nl/BWBR0006446/2001-11-09#Artikel22
  - number: '23'
    text: |-
      1 Er is een Werkgeversoverleg voor overleg in zaken betreffende de rechtspositie van het personeel werkzaam bij
      instellingen.

      2 Het Werkgeversoverleg ressorteert onder Onze Minister.

      3 Met het Werkgeversoverleg wordt voor zover de deelnemende organisaties van gemeente- en schoolbesturen
      daarbij belang hebben door of namens Onze Minister met betrekking tot het personeel van instellingen
      als bedoeld in [artikel 1, onderdeel g, onder 1 en 4][ref1], indien op die instellingen het
      [Rechtspositiebesluit onderwijspersoneel][ref2] van toepassing is, overleg gepleegd over aangelegenheden van
      algemeen belang voor de rechtstoestand van het personeel, met inbegrip van de algemene regels volgens welke het
      personeelsbeleid zal worden gevoerd.

      4 Met het Werkgeversoverleg wordt voor zover de deelnemende organisaties van gemeente- en schoolbesturen
      daarbij belang hebben door of namens Onze Minister met betrekking tot het personeel van instellingen
      als bedoeld in [artikel 1, onderdeel g, onder 2, 3 en 4][ref3], indien op die instellingen het
      [Rechtspositiebesluit onderwijspersoneel][ref4]l niet van toepassing is, overleg gepleegd over de
      onderwerpen genoemd in [artikel 38a, tweede en derde lid, van de Wet op het voortgezet onderwijs][ref5] en
      [artikel 4.1.2, tweede en derde lid, van de Wet educatie en beroepsonderwijs][ref6].

      5 Het overleg, bedoeld in het derde en vierde lid, is gericht op het bereiken van overeenstemming en het wordt
      voorbereid in een werkgroep van het Werkgeversoverleg aangeduid als het Technisch Informeel Werkgeversoverleg.

      6 De voorzitter en het Werkgeversoverleg kunnen gezamenlijk besluiten dat het overleg, bedoeld in het derde en
      vierde lid, wordt gevoerd met het Technisch Informeel Werkgeversoverleg. De voorzitter en het Werkgeversoverleg
      bepalen daarbij onder welke voorwaarden dat overleg wordt gevoerd.


