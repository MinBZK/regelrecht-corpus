  - number: '10'
    text: |-
      1 De Sectorcommissie stelt haar standpunt vast over de haar voorgelegde dan wel op haar verzoek in het overleg
      behandelde aangelegenheden.

      2 Over aangelegenheden waarover Onze Minister overleg voert met het Werkgeversoverleg, geeft de Sectorcommissie
      haar standpunt na afronding van het overleg met het Werkgeversoverleg. De Sectorcommissie is bevoegd om haar
      moverende redenen van de eerste volzin af te wijken.

      3 Het standpunt van de Sectorcommissie wordt bepaald bij eenvoudige meerderheid van stemmen. Elke centrale brengt
      één stem uit.

      4 Voor zover omtrent enig onderwerp in de Sectorcommissie een minderheidsstandpunt blijkt, wordt hiervan in de in
      [artikel 21, eerste lid][ref1], bedoelde kennisgeving mededeling gedaan, alsook van de overwegingen, waarmee de
      onderscheidene standpunten zijn ondersteund.

      5 De voorzitter, de leden en plaatsvervangende leden van de vaste afdelingen worden, voorzover het aangelegenheden
      betreft die uitsluitend betrekking hebben op de groep of groepen van onderwijspersoneel waarvoor deze afdelingen
      zijn ingesteld, door de voorzitter SCOP op de hoogte gesteld van de bij de Sectorcommissie aanhangig gemaakte
      aangelegenheden.

      6 Een afdeling of werkgroep stelt haar standpunt vast over de haar voorgelegde in het overleg behandelde
      aangelegenheden. Het tweede tot en met het vierde lid zijn van overeenkomstige toepassing.

      7 De voorzitter SCOP brengt het standpunt van de afdeling of werkgroep schriftelijk ter kennis van de leden en
      plaatsvervangende leden van de Sectorcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0006446#Artikel21
