  - number: '15'
    text: |-
      1 Een verzoek om advies als bedoeld in [artikel 14, vierde of zevende lid][ref1], wordt binnen drie dagen na een
      buitengewone vergadering van de Sectorcommissie als bedoeld in dat artikel, ter kennis gebracht van de voorzitter
      van de Advies- en Arbitragecommissie. Het verzoek wordt ondertekend door de deelnemers aan het overleg in de
      Sectorcommissie die zich voor inwinning van advies hebben uitgesproken en bevat tenminste het onderwerp en de
      inhoud van het geschil.

      2 Indien in een vergadering als bedoeld in het eerste lid geen overeenstemming is bereikt tussen alle deelnemers
      aan het overleg in de Sectorcommissie over de vraag wat het onderwerp en de inhoud van het geschil is, brengen de
      overige deelnemers aan het overleg hun visie op het onderwerp en de inhoud van het geschil eveneens binnen drie
      dagen na eerdergenoemde vergadering ter kennis van de voorzitter van de Advies- en Arbitragecommissie. In geval
      het geschil in een vaste afdeling is gerezen, is de eerste volzin van toepassing ten aanzien van de desbetreffende
      deelnemers aan het overleg in die afdeling.

      3 De eerste volzin van het eerste lid is van overeenkomstige toepassing ten aanzien van het onderwerpen van het
      geschil aan een arbitrale uitspraak. Het verzoek daartoe wordt ondertekend door alle deelnemers aan het overleg in
      de Sectorcommissie en dient tenminste te bevatten:

      a. het onderwerp en de inhoud van het geschil;

      b. de standpunten van alle deelnemers aan het overleg omtrent onderwerp en inhoud van het geschil.

      4 In geval het geschil in een vaste afdeling is gerezen, is het derde lid, onder *b*, van toepassing ten aanzien
      van de deelnemers aan het overleg in die afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006446#Artikel14
