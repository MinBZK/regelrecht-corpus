  - number: '16'
    text: |-
      1 Geschillen welke ingevolge [artikel 13][ref1], 14 en 15 voor het inwinnen van advies in aanmerking komen dan wel
      aan arbitrage zijn onderworpen, worden voorgelegd aan de Advies- en Arbitragecommissie.

      2 Ten aanzien van de samenstelling van de Advies- en Arbitragecommissie is [artikel 110][ref2] van overeenkomstige
      toepassing, met dien verstande dat de Advies- en Arbitragecommissie voor de behandeling van een in het overleg
      met de Sectorcommissie gerezen geschil wordt uitgebreid met twee leden die worden benoemd door Onze Minister, in
      overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij. Van deze leden wordt één lid benoemd op
      voordracht van de voorzitter SCOP en één lid op voordracht van de Sectorcommissie.

      3 Uitgesloten van het lidmaatschap en plaatsvervangend lidmaatschap zijn:

      a. personen die lid dan wel plaatsvervangend lid zijn van de Sectorcommissie of van de Raad voor het
      Overheidspersoneelsbeleid;

      b. personen die bestuurslid zijn van, dan wel werkzaam zijn bij een centrale of een daarbij aangesloten vereniging;

      c. personen die werkzaam zijn bij de ministeries en de daaronder ressorterende instellingen, diensten en bedrijven,
      wier onafhankelijkheid en onpartijdigheid op grond van hun dienstverband door de deelnemers aan het overleg
      onvoldoende wordt geacht.

      Deze personen zijn eveneens uitgesloten van het lidmaatschap of plaatsvervangend lidmaatschap gedurende de periode
      van twee jaar na beëindiging van het lidmaatschap [onder ][ref3] en [][ref4] bedoeld, alsmede na beëindiging van de
      werkzaamheden bedoeld [onder ][ref5] en [][ref6].


