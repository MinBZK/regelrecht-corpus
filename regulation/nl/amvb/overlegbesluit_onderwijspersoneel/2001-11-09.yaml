  - number: '3'
    text: |-
      1 De Sectorcommissie bestaat uit vertegenwoordigers van de volgende centrales: de Algemene Centrale van
      Overheidspersoneel, de Christelijke Centrale van Overheids- en Onderwijspersoneel, het Ambtenarencentrum en de
      Centrale van Middelbare en Hogere Functionarissen bij Overheid en Onderwijs, Bedrijven en Instellingen. Elk van
      deze centrales is bevoegd vier leden en vier plaatsvervangende leden aan te wijzen.

      2 Van overeenkomstig het eerste lid gedane aanwijzingen doen de centrales mededeling aan Onze Minister en aan de
      voorzitter SCOP.
    url: https://wetten.overheid.nl/BWBR0006446/2001-11-09#Artikel3
  - number: '4'
    text: |-
      1 Het overleg met de Sectorcommissie staat onder leiding van de voorzitter SCOP, die door Onze Minister wordt
      aangewezen en die hem vertegenwoordigt.

      Onze Minister kan één of meer plaatsvervangende voorzitters aanwijzen.

      2 De voorzitter SCOP kan bij het overleg terzijde worden gestaan door adviseurs die door Onze Minister zijn
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0006446/2001-11-09#Artikel4
  - number: '6'
    text: |-
      1 Het secretariaat van het overleg met de Sectorcommissie wordt gevoerd door een door Onze Minister benoemde of
      aangewezen secretaris, die onder leiding van de voorzitter SCOP mede ter beschikking staat van de Sectorcommissie.
      De benoeming of aanwijzing van de secretaris geschiedt na overleg met de Sectorcommissie.

      2 Van het ter vergadering met de Sectorcommissie behandelde worden door de secretaris notulen gemaakt, die
      gelijktijdig worden toegezonden aan de voorzitter, de hem eventueel bij het overleg ter zijde staande adviseurs en
      aan de leden en de plaatsvervangende leden van de Sectorcommissie. De eerste volzin is eveneens van toepassing ten
      aanzien van de leden van de vaste afdelingen van de Sectorcommissie, die niet tevens lid of plaatsvervangend lid
      van de Sectorcommissie zijn.

      3 De secretaris van het overleg met de Sectorcommissie verleent zijn bemiddeling om aan de leden een lokaliteit
      beschikbaar te stellen, indien deze leden daartoe een verzoek doen ten behoeve van een door hen te houden
      beraadslaging.

      4 De secretaris draagt er zorg voor dat de Sectorcommissie in afschrift alle stukken ontvangt welke worden
      toegezonden aan het Werkgeversoverleg.

      5 Het eerste lid, het tweede lid, eerste volzin, en het derde lid zijn van overeenkomstige toepassing ten aanzien
      van de afdelingen en werkgroepen.
    url: https://wetten.overheid.nl/BWBR0006446/2001-11-09#Artikel6
  - number: '7'
    text: |-
      1 De Sectorcommissie kan in overeenstemming met de voorzitter SCOP afdelingen instellen waarnaar zij onderwerpen
      ter afhandeling kan verwijzen.

      2 De Sectorcommissie kan in overeenstemming met de voorzitter SCOP werkgroepen instellen waarnaar zij onderwerpen
      ter voorbereiding van het overleg in de Sectorcommissie verwijst.

      3 De Sectorcommissie regelt de samenstelling der afdelingen en werkgroepen.

      4 De voorzitter SCOP wijst de voorzitter en desgewenst de plaatsvervangend voorzitter van een afdeling of werkgroep
      aan. Zij kunnen bij het overleg terzijde worden gestaan door adviseurs die door Onze Minister zijn aangewezen.

      5 Het tweede lid en, voor zover het werkgroepen betreft, het derde en vierde lid zijn van overeenkomstige
      toepassing ten aanzien van de vaste afdelingen van de Sectorcommissie, onderscheidenlijk de voorzitters van die
      afdelingen.

      6 Er is in elk geval een vaste afdeling en wel de afdeling PO voor het personeel werkzaam bij
      instellingen als bedoeld in [artikel 1, onderdeel g, onder 1 en 4][ref1], indien op die instellingen het
      [Rechtspositiebesluit onderwijspersoneel][ref2] van toepassing is.

      7 De Sectorcommissie verwijst in elk geval die onderwerpen ter afhandeling naar een vaste afdeling, welke
      uitsluitend betrekking hebben op de groep of groepen van onderwijspersoneel waarvoor de desbetreffende afdeling
      is ingesteld.

      8 Het zevende lid is niet van toepassing indien alle centrales in de Sectorcommissie met betrekking tot een
      onderwerp als bedoeld in dat lid van oordeel zijn dat het overleg daarover, gelet op het gewicht ervan, in de
      Sectorcommissie dient plaats te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0006446#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003771
