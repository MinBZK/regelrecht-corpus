  - number: '17'
    text: |-
      Ten aanzien van de werkwijze van de Advies- en Arbitragecommissie is [artikel 110][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110h
