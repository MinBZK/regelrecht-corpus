  - number: '24'
    text: |-
      1 Het Werkgeversoverleg bestaat uit vertegenwoordigers van de Algemeen Besturen Centrale, de Besturenraad
      Protestants Christelijk Onderwijs, de Vereniging Bonden van Besturen voor het Katholiek Beroeps- en Voortgezet
      Onderwijs en Bond voor Katholiek Basisonderwijs, VOS/ABB, de BVE-Raad en het COLO. Elk van de in de eerste volzin
      genoemde organisaties is bevoegd twee leden en twee plaatsvervangende leden aan te wijzen.

      2 Van een overeenkomstig het eerste lid gedane aanwijzing doen de organisaties mededeling aan Onze Minister en de
      voorzitter van het Werkgeversoverleg.
    url: https://wetten.overheid.nl/BWBR0006446/2001-11-09#Artikel24
  - number: '25'
    text: |-
      1 Het Werkgeversoverleg staat onder leiding van een voorzitter, die door Onze Minister wordt aangewezen en die hem
      vertegenwoordigt. Onze Minister kan één of meer plaatsvervangende voorzitters aanwijzen.

      2 De voorzitter kan bij het overleg terzijde worden gestaan door adviseurs die door Onze Minister zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0006446/2001-11-09#Artikel25
  - number: 25a
    text: |-
      [Artikel 6][ref1] is van overeenkomstige toepassing


