articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschappen en, voor zover het betreft het
      landbouwonderwijs, Onze Minister van Landbouw, Natuurbeheer en Visserij;

      b. Sectorcommissie: de commissie, bedoeld in [artikel 2, eerste lid][ref1];

      c. de voorzitter SCOP: de voorzitter van het overleg met de Sectorcommissie;

      d. afdelingen: de afdelingen van de Sectorcommissie, bedoeld in [artikel 7][ref2];

      e. werkgroepen: de werkgroepen van de Sectorcommissie en van de vaste afdelingen van de Sectorcommissie, bedoeld
      in [artikel 7][ref3];

      f. Werkgeversoverleg: het overleg, bedoeld in [artikel 23, eerste lid][ref4];

      g. instellingen:

      1. instellingen als bedoeld in [artikel I-A1, onder d, van het Rechtspositiebesluit onderwijspersoneel][ref5];

      2. scholen als bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref6];

      3. instellingen als bedoeld in [artikel 1.3.1 van de Wet educatie en beroepsonderwijs][ref7], agrarische
      innovatie- en praktijkcentra en landelijke organen voor het beroepsonderwijs als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref8];

      4. instellingen die krachtens [artikel 2, eerste lid, van de Experimentenwet onderwijs][ref9] uit de openbare kas
      worden bekostigd;

      h. onderwijspersoneel: het aan de instellingen, bedoeld [onder g][ref10], verbonden personeel;

      i. Advies- en Arbitragecommissie: de Advies- en Arbitragecommissie, bedoeld in [artikel 16][ref11].


