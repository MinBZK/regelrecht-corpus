  - number: '12'
    text: |-
      Deze paragraaf is van toepassing op in het overleg met de Sectorcommissie gerezen geschillen inzake aangelegenheden
      die in overeenstemming met [artikel 2][ref1] aan de Sectorcommissie zijn voorgelegd, waaronder begrepen geschillen
      inzake de toepassing van [artikel 2][ref2] en [artikel 11, eerste en tweede lid][ref3], respectievelijk op in
      het overleg met een vaste afdeling van de Sectorcommissie gerezen geschillen inzake onderwerpen die door de
      Sectorcommissie ter afhandeling naar die afdeling zijn verwezen, waaronder begrepen geschillen inzake de toepassing
      van [artikel 11, eerste en tweede lid][ref4].


