preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs en Wetenschappen, mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij, van 15 juli 1993, nr. 93044110, Aspectdirectie Arbeidsvoorwaardenbeleid en
    Beroepskwaliteit;

    Gelet op artikel 125, eerste lid, van de Ambtenarenwet 1929, artikel 4a, eerste lid, van de Experimentenwet
    onderwijs, artikel 61, eerste lid, van de Wet op de onderwijsverzorging, artikel 43 van de Wet op het
    basisonderwijs, artikel 52 van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs,
    artikel 40, eerste lid, van de Wet op het voortgezet onderwijs, artikel 9, tweede lid, van de Kaderwet
    Volwasseneneducatie 1991, de artikelen 2.51, eerste lid, en 2.59 van de Wet op het cursorisch beroepsonderwijs,
    artikel 4.3, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek en artikel 14 van de Wet
    op de Nederlandse organisatie voor wetenschappelijk onderzoek;

    De Raad van State gehoord (advies van 17 november 1993, nr. W05.93.0442);

    Gezien het nader rapport van Onze Minister van Onderwijs en Wetenschappen, mede namens Onze Minister van
    Landbouw, Natuurbeheer en Visserij, van 28 januari 1994, nr. 94000858, Aspectdirectie Arbeidsvoorwaardenbeleid
    en Beroepskwaliteit;

    Hebben goedgevonden en verstaan:
