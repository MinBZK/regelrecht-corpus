  - number: 1.02.6
    text: |-
      Voor een stilliggend zeeschip onder beslag, is de beslaglegger verantwoordelijk voor de naleving van de artikelen
      [3.01, vierde lid][ref1], [3.06][ref2], [3.20][ref3], [3.21][ref4], [3.26][ref5], [3.31 tot en met 3.33][ref6],
      [4.04, eerste en tweede lid][ref7], [7.01, derde lid][ref8], en [7.08][ref9], wanneer daarin niet door een
      schipper, een exploitant, een wachtsman of toezichthouder overeenkomstig het gestelde in het vijfde lid of artikel
      7.08 kan worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0003628#Artikel4
      [ref8]: https://wetten.overheid.nl/BWBR0003628#Artikel7
      [ref9]: https://wetten.overheid.nl/BWBR0003628#Artikel7
