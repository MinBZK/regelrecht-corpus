  - number: 1.02.1
    text: |-
      Een schip, met uitzondering van een duwbak, en een samenstel moeten zijn gesteld onder het gezag van een persoon
      die het schip of het samenstel voert. Deze persoon wordt hierna aangeduid als schipper. Onder schipper wordt tevens
      verstaan degene die de leiding heeft over een drijvend voorwerp of een drijvende inrichting.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.02
  - number: 1.02.2
    text: |-
      De schipper is verantwoordelijk voor de naleving van de bepalingen van dit reglement, tenzij uit die bepalingen
      blijkt, dat de naleving aan anderen is opgedragen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.02
  - number: 1.02.3
    text: |-
      De schipper van een schip dat deel uitmaakt van een samenstel moet de aanwijzingen van de schipper van het
      samenstel opvolgen. Hij moet evenwel, ook wanneer zulke aanwijzingen niet worden gegeven, alle maatregelen nemen,
      die voor het op juiste wijze voeren van zijn schip door de omstandigheden worden geboden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.02
  - number: 1.02.4
    text: |-
      De schipper moet tijdens de vaart aan boord zijn; de schipper van een drijvend werktuig moet tevens aan boord zijn,
      wanneer het werktuig in bedrijf is.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.02
  - number: 1.02.5
    text: Indien een stilliggend schip geen schipper heeft,
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.02
  - number: 1.02.5.a
    text: |-
      is de exploitant verantwoordelijk voor de naleving van de [artikelen 1.02, eerste lid][ref1], [1.06][ref2],
      [1.07][ref3], [1.18][ref4], [2.01][ref5], [2.02][ref6], [3.01, vierde lid][ref7], [3.05][ref8],
      [3.06][ref9], [3.07][ref10], [3.20 tot en met 3.26][ref11], [3.29][ref12], [3.31][ref13], [3.32][ref14],
      [3.33][ref15], [5.01 eerste en tweede lid][ref16], voorzover het de naleving betreft van de tekens,
      A.5, A.5.1, A.6 en A.7 ([bijlage 7][ref17]) of een bekendmaking met dezelfde strekking als deze tekens,
      [7.01, eerste, tweede en derde lid][ref18], [7.02][ref19], [7.04, derde lid][ref20], [7.08][ref21], en
      [9.03][ref22];


