  - number: 1.26.2
    text: De bevoegde autoriteit kan aan een ontheffing als bedoeld in het eerste lid voorschriften en beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.26
  - number: 1.26.3
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld over de ontheffingsmogelijkheid, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.26
  - number: 2.01.1
    text: |-
      Een groot schip mag niet deelnemen aan de scheepvaart, indien niet op de romp of op duurzaam bevestigde borden of
      platen zijn aangebracht:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.01
  - number: 2.01.1.a
    text: |-
      hetzij de naam van een schip die ook een kenspreuk kan zijn, hetzij de naam van een instelling waaraan het schip
      toebehoort of de gebruikelijke afkorting daarvan, al dan niet gevolgd door een nummer, aan beide zijden van het
      schip en bovendien, met uitzondering van een duwbak, op een zodanige plaats, dat deze aanduiding van achteren
      zichtbaar is;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.01
  - number: 2.01.1.b
    text: |-
      de thuishaven van het schip en de letter of de lettercombinatie die volgens [bijlage 1 van dit reglement][ref1] het
      land aangeeft, waarin deze is gelegen, hetzij aan beide zijden van het schip hetzij aan de achterzijde.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.01
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 2.01.2
    text: |-
      De kentekens, bedoeld in het eerste lid, moeten zijn aangebracht in lichte kleur op donkere ondergrond of in
      donkere kleur op lichte ondergrond in goed leesbare en onuitwisbare Latijnse letters en Arabische cijfers met een
      hoogte voor de naam van tenminste 20 cm en voor de overige aanduidingen van tenminste 15 cm en met een breedte en
      een stamdikte die in goede verhouding tot de hoogte staan.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.01
  - number: 2.02.1
    text: 'Een klein schip mag niet deelnemen aan de scheepvaart, indien hierop niet zijn aangebracht:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.02
  - number: 2.02.1.a
    text: |-
      hetzij de naam van het schip die ook een kenspreuk kan zijn, hetzij de naam van de instelling waaraan het schip
      toebehoort of de gebruikelijke afkorting daarvan, al dan niet gevolgd door een nummer, aan de buitenzijde van
      het schip in lichte kleur op donkere ondergrond of in donkere kleur op lichte ondergrond in goed leesbare en
      onuitwisbare Latijnse letters en Arabische cijfers; en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.02
  - number: 2.02.1.b
    text: |-
      de naam en de woonplaats van de eigenaar op een in het oog vallende plaats aan de binnen- of de buitenzijde van
      het schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.02
  - number: 2.02.2
    text: |-
      Op een bijboot van een schip behoeft echter, aan de binnen- of de buitenzijde, slechts een zodanig kenteken te zijn
      aangebracht, dat daaruit kan worden opgemaakt wie de eigenaar is.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.02
  - number: 2.02.3
    text: |-
      Het eerste lid is niet van toepassing op snelle motorboten, waarop het registratieteken bedoeld in
      [artikel 8.02][ref1] is aangebracht, en op een door spierkracht voortbewogen schip noch op een zeilschip met een
      lengte van minder dan 7 m.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel8
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.02
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '8'
        hoofdstuk: '8'
  - number: '2.03'
    text: (niet overgenomen).
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.03
  - number: '2.04'
    text: (niet overgenomen).
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.04
  - number: '2.05'
    text: (niet overgenomen).
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.05
  - number: 2.06.1
    text: Een schip dat vloeibaar aardgas (LNG) als brandstof gebruikt, voert een kenteken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.06
  - number: 2.06.2
    text: |-
      Dit kenteken is rechthoekig, met de vermelding «LNG» in witte letters op een rode ondergrond, met een witte rand
      met een breedte van ten minste 5 cm. De afmeting van de langste zijde van de rechthoek bedraagt ten minste 60 cm.
      De letters hebben een hoogte van ten minste 20 cm. De breedte van de letters en de stamdikte staan in goede
      verhouding tot de hoogte.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.06
  - number: 2.06.3
    text: Het kenteken is op een geschikte en goed zichtbare plaats aangebracht.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.06
  - number: 2.06.4
    text: Het teken wordt zo nodig verlicht om 's nachts duidelijk zichtbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel2.06
  - number: 3.01.1
    text: |-
      Op een varend schip zijn de [artikelen 3.08 tot en met 3.18][ref1] van toepassing. Op een varend drijvend voorwerp
      en een varende drijvende inrichting is [artikel 3.19][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.01
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 3.01.2
    text: |-
      Op een stilliggend schip zijn de [artikelen 3.20 tot en met 3.22][ref1] en [3.24 tot en met 3.26][ref2]
      van toepassing. Op een stilliggend drijvend voorwerp en een stilliggende drijvende inrichting zijn de
      [artikelen 3.23][ref3] en [3.26][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.01
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
      - id: ref4
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
  - number: 3.01.3
    text: |-
      De [artikelen 3.21][ref1], [3.23][ref2], [3.25][ref3] en [3.26][ref4] zijn eveneens van toepassing op een schip,
      een drijvend voorwerp of een drijvende inrichting die is vastgevaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.01
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
      - id: ref4
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
  - number: 3.01.4
    text: Wanneer het zicht dit vereist, moeten de voor des nachts voorgeschreven lichten ook des daags worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.01
  - number: 3.01.5
    text: |-
      Bij het varen door de doorvaartopening van een vaste brug of van een beweegbare brug in gesloten toestand dan wel
      van een ander kunstwerk mogen de in dit hoofdstuk bedoelde tekens zoveel lager worden gevoerd als hiervoor nodig
      is.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.01
  - number: 3.01.6
    text: |-
      Een vóór een sluis stilliggend schip dat wacht om te worden geschut en een vóór een beweegbare brug stilliggend
      schip dat wacht tot het doorvaren wordt toegestaan mogen de lichten en dagtekens blijven voeren, die zijn
      voorgeschreven voor een varend schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.01
  - number: 3.01.7
    text: |-
      Een schetsmatige weergave van de bij dit hoofdstuk voorgeschreven tekens is opgenomen in [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.01
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 3.01a
    text: 'In dit reglement wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.01a
  - number: 3.01a.a
    text: |-
      toplicht: wit krachtig licht dat schijnt over een boog van de horizon van 225° en wel aan elke zijde van het schip
      van recht vooruit tot 22°30' achterlijker dan dwars en dat uitsluitend over deze boog zichtbaar is;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.01a
  - number: 3.01a.b
    text: |-
      boordlichten: groen helder licht aan stuurboordszijde en rood helder licht aan bakboordszijde die elk schijnen
      over een boog van de horizon van 112°30' en wel elk aan zijn zijde van het schip van recht vooruit tot 22°30'
      achterlijker dan dwars en die uitsluitend over deze boog zichtbaar zijn;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.01a
  - number: 3.01a.c
    text: |-
      heklicht: wit helder of gewoon licht dat schijnt over een boog van de horizon van 135° en wel aan elke zijde van
      het schip over 67°30' van recht achteruit en dat uitsluitend over deze boog zichtbaar is;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.01a
  - number: 3.01a.d
    text: 'rondom schijnend licht: een licht dat schijnt over een boog van 360° en dat over deze boog zichtbaar is;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.01a
  - number: 3.01a.e
    text: |-
      hoogte: '- hetzij: de hoogte boven het vlak door de onderkant der inzinkingsmerken ter plaatse van de grootst'
      toegelaten diepgang, zoals deze ingevolge de voorschriften omtrent het vlak van de grootst toegelaten diepgang
      van binnenschepen voor het schip is vastgesteld voor de Rijn of daarmede volgens die voorschriften gelijkgestelde
      vaarwegen;
        - hetzij voor een schip dat niet is voorzien van inzinkingsmerken: de hoogte boven het bovenste doorlopende dek of
      bij gebreke hieraan boven het potdeksel.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.01a
  - number: 3.02.1
    text: |-
      Voor zover niet anders wordt bepaald, moeten de lichten die een schip ingevolge dit reglement moet voeren
      gelijkmatig zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.02
  - number: 3.02.2
    text: 'Een schip mag slechts de navigatielantaarns gebruiken:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.02
  - number: 3.02.2.a
    text: |-
      waarvan de lantaarnhuizen, de uitrusting en de lichtbronnen het keurmerk dragen dan wel voorzien zijn van het
      certificaat voorgeschreven in de voorschriften die krachtens [artikel 1.01, onder C.3° en C.4°][ref1], zijn
      vastgesteld, en


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel1
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.02
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.02.2.b
    text: |-
      waarvan de lichten voor wat betreft hun horizontale uitstraling, kleur en sterkte in overeenstemming zijn met dit
      reglement.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.02
  - number: 3.02.3
    text: |-
      De lichten van stilliggende schepen die niet zijn uitgerust met een motor behoeven niet aan bovenvermelde
      voorschriften te voldoen. Bij goed zicht en tegen een donkere achtergrond dient de zichtbaarheid daarvan echter
      ongeveer 1000 m te bedragen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.02
  - number: 3.03.1
    text: |-
      Voor zover niet anders wordt bepaald, moeten de borden en vlaggen die een schip ingevolge dit reglement moet voeren
      rechthoekig zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.03
  - number: 3.03.2
    text: Zij mogen niet vervuild en de kleuren mogen niet verbleekt zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.03
  - number: 3.03.3
    text: 'De afmetingen moeten tenminste als volgt zijn:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.03
  - number: 3.03.3.a
    text: 'voor borden en vlaggen: een lengte en een hoogte van elk tenminste 1 m;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.03
  - number: 3.03.3.b
    text: 'voor wimpels: een lengte van tenminste 1 m en een hoogte aan één zijde van tenminste 0,50 m.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.03
  - number: 3.03.4
    text: |-
      In afwijking van het derde lid mogen voor kleine schepen voorwerpen van geringere afmetingen worden gebruikt die in
      verhouding staan tot de grootte van het kleine schip. De afmetingen moeten echter in ieder geval zodanig zijn, dat
      een goede zichtbaarheid wordt verzekerd.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.03
  - number: 3.04.1
    text: |-
      De cylinders, bollen, kegels en ruiten, die een schip ingevolge dit reglement moet voeren, mogen worden vervangen
      door voorwerpen die op een afstand dezelfde vorm vertonen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.04
  - number: 3.04.2
    text: Zij mogen niet vervuild en de kleuren mogen niet verbleekt zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.04
  - number: 3.04.3
    text: 'De afmetingen moeten tenminste als volgt zijn:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.04
  - number: 3.04.3.a
    text: 'voor cilinders: een hoogte van 80 cm en een middellijn van 50 cm;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.04
  - number: 3.04.3.b
    text: 'voor bollen: een middellijn van 60 cm;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.04
  - number: 3.04.3.c
    text: |-
      voor kegels: een hoogte van 60 cm en een middellijn van het grondvlak van 60 cm, zodanig dat de middellijn van het
      grondvlak niet meer is dan de hoogte;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.04
  - number: 3.04.3.d
    text: |-
      voor ruiten: een lengte van de verticale middellijn van 80 cm en van de horizontale middellijn van 50 cm, zodanig
      dat de lengte van de horizontale middellijn niet meer is dan die van de verticale middellijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.04
  - number: 3.04.4
    text: |-
      In afwijking van het derde lid mogen voor kleine schepen voorwerpen van geringere afmetingen worden gebruikt die in
      verhouding staan tot de grootte van het kleine schip. De afmetingen moeten echter in ieder geval zodanig zijn, dat
      een goede zichtbaarheid wordt verzekerd.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.04
  - number: 3.05.1
    text: |-
      Een schip mag geen andere tekens voeren of tonen dan die welke in dit reglement worden vermeld en mag niet deze
      tekens voeren of tonen onder andere omstandigheden dan die welke in dit reglement zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.05
  - number: 3.05.2
    text: |-
      Een schip mag voor het wisselen van berichten met andere schepen of met de wal geen tekens gebruiken die kunnen
      leiden tot verwarring met de in dit reglement vermelde tekens.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.05
  - number: '3.06'
    text: |-
      Indien de lichten die een schip ingevolge dit reglement moet voeren niet kunnen werken, moet het schip deze
      onverwijld door noodlichten vervangen. Ingeval een krachtig licht wordt voorgeschreven, mag echter het noodlicht
      helder, en ingeval een helder licht wordt voorgeschreven, mag het noodlicht gewoon zijn. Het schip moet zo spoedig
      mogelijk wederom lichten van de voorgeschreven sterkte in gebruik stellen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.06
  - number: 3.07.1
    text: |-
      Een schip mag geen lichten, verlichting of zoeklichten dan wel vlaggen, borden, wimpels of andere voorwerpen
      doen zichtbaar zijn, die kunnen leiden tot verwarring met de in dit reglement vermelde tekens dan wel de
      waarneembaarheid of de herkenning daarvan kunnen bemoeilijken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.07
  - number: 3.07.2
    text: |-
      Een schip mag zijn lichten dan wel zijn verlichting of zijn zoeklichten niet op zodanige wijze gebruiken, dat zij
      door verblinding gevaar of hinder voor de scheepvaart kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.07
  - number: 3.08.1
    text: 'Een alleenvarend groot motorschip moet ’s nachts voeren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.08
  - number: 3.08.1.a
    text: |-
      een toplicht op het voorschip in de lengte-as van het schip op een hoogte van tenminste 5 m. Deze hoogte mag worden
      verminderd tot 4 m, indien de lengte van het schip niet meer dan 40 m bedraagt;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.08
  - number: 3.08.1.b
    text: |-
      boordlichten op gelijke hoogte en in een lijn loodrecht op de lengte-as van het schip, tenminste 1 m lager dan het
      toplicht, en niet meer dan 1 m binnen de buitenzijden van het schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.08
  - number: 3.08.1.c
    text: |-
      een heklicht op het achterschip, zoveel als mogelijk in de lengte-as van het schip op een zodanige hoogte, dat het
      goed zichtbaar is voor een ander schip dat het schip oploopt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.08
  - number: 3.08.2
    text: |-
      Een alleenvarend groot motorschip mag ’s nachts op het achterschip een tweede toplicht voeren op een grotere hoogte
      dan het toplicht op het voorschip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.08
  - number: 3.08.3
    text: 'Een groot motorschip dat wordt geassisteerd moet voeren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.08
  - number: 3.08.3.a
    text: '’s nachts: de in het eerste en tweede lid voorgeschreven lichten;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.08
  - number: 3.08.3.b
    text: |-
      overdag: een gele bol op het voorschip op een hoogte van tenminste 5 m. Indien dit schip een zeegaand schip is,
      behoeft het de gele bol niet te voeren, doch mag het deze voeren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.08
  - number: 3.08.4
    text: |-
      Een snel schip moet overdag en ’s nachts, naast de overige tekens die bij dit reglement zijn voorgeschreven,
      voeren: twee gele krachtige rondom schijnende lichten die snel flikkeren, in een verticale lijn met een onderlinge
      afstand van ongeveer 1 m, op een geschikte plaats en op een zodanige hoogte, dat zij van alle zijden zichtbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.08
  - number: 3.08.5
    text: |-
      Een groot schip dat onder zeil vaart en tegelijkertijd zijn mechanische middelen tot voortbeweging gebruikt moet
      overdag voeren: een zwarte kegel met de punt naar beneden, zo hoog mogelijk, op een plaats waar hij het best kan
      worden gezien.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.08
  - number: 3.08.6
    text: Dit artikel is niet van toepassing op een veerpont, een vissersschip en een schip dat loodsdienst uitoefent.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.08
  - number: 3.09.1
    text: |-
      Het motorschip aan de kop van een sleep bestaande uit grote schepen, alsmede het motorschip dat een groot
      motorschip, duwstel of gekoppeld samenstel assisteert, moet voeren:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.09
  - number: 3.09.1.a
    text: '’s nachts:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.09
  - number: 3.09.1.a.1°
    text: |-
      twee toplichten op het voorschip, in de lengte-as van het schip, in een verticale lijn met een onderlinge afstand
      van ongeveer 1 m, het bovenste op een hoogte van tenminste 5 m en het onderste voorzover mogelijk ten minste 1 m
      hoger dan de boordlichten. De hoogte van het bovenste licht mag worden verminderd tot 4 m, indien de lengte van het
      schip niet meer dan 40 m bedraagt;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.09
  - number: 3.09.1.a.2°
    text: |-
      boordlichten op gelijke hoogte en in een lijn loodrecht op de lengte-as van het schip, tenminste 1 m lager dan het
      toplicht en niet meer dan 1 m binnen de buitenzijden van het schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.09
  - number: 3.09.1.a.3°
    text: |-
      een geel helder of gewoon licht op het achterschip in de lengte-as van het schip, dat schijnt over dezelfde boog
      van de horizon als een heklicht en dat is aangebracht op een geschikte plaats en op een zodanige hoogte, dat het
      goed zichtbaar is voor de gesleepte lengten achter het schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.09
  - number: 3.09.1.b
    text: |-
      overdag: een gele cilinder die aan de bovenzijde en aan de benedenzijde is voorzien van twee banden, zwart en wit,
      de witte banden aan de uiteinden van de cilinder, en die is aangebracht in verticale stand op het voorschip op een
      zodanige hoogte, dat hij van alle zijden zichtbaar is.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.09
  - number: 3.09.2
    text: |-
      Indien een sleep verscheidene motorschepen bevat die niet in kiellinie varen dan wel verscheidene motorschepen
      tezamen een motorschip, een duwstel of een gekoppeld samenstel assisteren, moet elk van deze schepen, in plaats
      van de in het eerste lid bedoelde toplichten, ’s nachts voeren: drie toplichten op het voorschip, in de lengte-
      as van het schip, in een verticale lijn telkens met een onderlinge afstand van ongeveer 1 m. Het bovenste en het
      onderste toplicht moeten op dezelfde hoogte zijn aangebracht als voor de in het eerste lid bedoelde toplichten
      is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.09
  - number: 3.09.3
    text: |-
      Een groot schip van een sleep dat niet is het motorschip of een der motorschepen, bedoeld in het eerste en tweede
      lid, moet voeren: a. ’s nachts: een wit helder rondom schijnend licht, op een hoogte van tenminste 5 m. Deze
      hoogte mag worden verminderd tot 4 m, indien de lengte van het schip niet meer dan 40 m bedraagt; b. overdag: een
      gele bol, op een geschikte plaats en op een zodanige hoogte, dat hij van alle zijden zichtbaar is. Indien echter:
      i. een lengte in een sleep langer is dan 110 m, moet deze lengte ’s nachts twee van deze lichten voeren, waarvan
      één voorop en één achterop; ii. een lengte in een sleep is samengesteld uit meer dan twee langszijde van elkaar
      vastgemaakte schepen, moeten alleen de schepen aan de buitenzijden dit licht of deze lichten dan wel deze bol
      voeren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.09
  - number: 3.09.4
    text: |-
      Het grote schip of de grote schepen die de laatste lengte van een sleep vormen moeten ’s nachts, behalve het licht
      of de lichten voorgeschreven bij het derde lid, een heklicht op het achterschip voeren dat zoveel als mogelijk in
      de lengte-as van het schip is geplaatst op een zodanige hoogte, dat het goed zichtbaar is voor een ander schip dat
      het schip oploopt. Indien echter de laatste lengte van een sleep is samengesteld uit meer dan twee langszijde van
      elkaar vastgemaakte schepen, moeten alleen de schepen aan de buitenzijden deze lichten voeren. Indien de laatste
      lengte van een sleep uit een klein schip of kleine schepen bestaat, wordt voor de toepassing van dit lid geen
      rekening met deze kleine schepen gehouden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.09
  - number: 3.09.5
    text: |-
      Indien het in het derde lid bedoelde schip een zeegaand schip is, mag het, in plaats van de in het eerste tot en
      met vierde lid voorgeschreven tekens, voeren:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.09
  - number: 3.09.5.a
    text: '’s nachts:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.09
  - number: 3.09.5.a.1°
    text: |-
      boordlichten op gelijke hoogte en in een lijn loodrecht op de lengte-as van het schip, tenminste 1 m lager dan het
      toplicht en niet meer dan 1 m binnen de buitenzijden van het schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.09
  - number: 3.09.5.a.2°
    text: |-
      een heklicht op het achterschip, zoveel als mogelijk in de lengte-as van het schip op een zodanige hoogte, dat het
      goed zichtbaar is voor een ander schip dat het schip oploopt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.09
  - number: 3.09.5.b
    text: 'overdag: een gele bol als voorgeschreven in het derde lid, doch behoeft het deze niet te voeren.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.09
  - number: 3.10.1
    text: 'Een duwstel moet des nachts voeren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.10
  - number: 3.10.1.a.1e
    text: |-
      drie toplichten op het voorschip van het voorste schip of van het meest aan bakboord geplaatste der voorste
      schepen, in de vorm van een gelijkzijdige driehoek met een horizontale basis in een vlak loodrecht op de lengte-as
      van het duwstel, het bovenste licht op een hoogte van ten minste 5 m en de beide onderste lichten, ongeveer 1,25 m
      uit elkaar, ongeveer 1,10 m onder het bovenste licht;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.10
  - number: 3.10.1.a.2e
    text: |-
      een toplicht op het voorschip van elk ander schip dat van voren over de volle breedte zichtbaar is, voorzover
      mogelijk 3 m lager dan het bovenste licht, bedoeld onder 1e.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.10
  - number: 3.10.1.b
    text: boordlichten die moeten zijn geplaatst
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.10
  - number: 3.10.1.b.1°
    text: op gelijke hoogte in een lijn loodrecht op de lengte-as,
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.10
  - number: 3.10.1.b.2°
    text: op het breedste gedeelte van het duwstel op of zo dicht mogelijk bij de duwboot,
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.10
  - number: 3.10.1.b.3°
    text: ten hoogste 1 m binnen de zijkanten van het duwstel, en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.10
  - number: 3.10.1.b.4°
    text: op een hoogte van tenminste 2 m;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.10
  - number: 3.10.1.c.1°
    text: |-
      drie heklichten op de duwboot in een horizontale lijn loodrecht op de lengte-as, telkens ongeveer 1,25 m uit
      elkaar, op een zodanige hoogte dat zij niet door een van de andere schepen van het duwstel aan het zicht kunnen
      worden onttrokken;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.10
  - number: 3.10.1.c.2°
    text: |-
      een heklicht op elk ander schip dat van achteren over de volle breedte zichtbaar is. Indien, behalve de duwboot,
      meer dan twee schepen van achteren zichtbaar zijn, moet dit licht alleen door de schepen aan de buitenzijden worden
      gevoerd. Dit licht moet worden gevoerd op het achterschip, zoveel als mogelijk in de lengte-as van het schip op een
      zodanige hoogte, dat het goed zichtbaar is voor een ander schip dat het schip oploopt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.10
  - number: 3.10.2
    text: |-
      Een duwstel dat wordt geassisteerd moet voeren: - des nachts: de lichten voorgeschreven bij het eerste lid. De
      lichten bedoeld in het eerste lid, onder *c*, 1e, dienen echter gele lichten te zijn;
        - des daags: een gele bol op de duwboot op een hoogte van tenminste 5 m.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.10
  - number: 3.10.3
    text: |-
      Een duwstel dat door twee duwboten naast elkaar wordt voortbewogen moet de heklichten bedoeld in het eerste lid,
      onder *c*, 1e, voeren op de duwboot aan stuurboord; de andere duwboot moet het heklicht bedoeld in het eerste lid,
      onder *c*, 2e, voeren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.10
  - number: 3.10.4
    text: |-
      Een duwstel, waarvan de grootste lengte niet meer dan 110 m en de grootste breedte niet meer dan 12 m bedraagt,
      wordt voor de toepassing van dit hoofdstuk beschouwd als één motorschip van dezelfde afmetingen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.10
  - number: 3.11.1
    text: 'Een gekoppeld samenstel bestaande uit grote schepen moet ’s nachts voeren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.11
  - number: 3.11.1.a
    text: |-
      een toplicht op het voorschip van elk schip, in de lengte-as op een hoogte van tenminste 5 m. Op een schip dat geen
      motorschip is, mag in plaats van dit licht worden gevoerd een wit helder rondom schijnend licht, op een geschikte
      plaats en op een hoogte van tenminste 5 m, maar niet hoger dan het toplicht van het motorschip of de toplichten van
      de motorschepen. De hoogte van zowel het toplicht als het rondom schijnende licht mag worden verminderd tot 4 m,
      indien de lengte van het schip niet meer dan 40 m bedraagt;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.11
  - number: 3.11.1.b
    text: |-
      boordlichten aan de buitenzijden van het samenstel, voorzover mogelijk op onderling dezelfde hoogte en tenminste 1
      m lager dan het laagste licht, bedoeld onder a. Zij moeten zijn geplaatst in een lijn loodrecht op de lengte-as van
      het schip en niet meer dan 1 m binnen de buitenzijden van het schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.11
  - number: 3.11.1.c
    text: |-
      een heklicht op het achterschip van elk schip, zoveel als mogelijk in de lengte-as van het schip en op een zodanige
      hoogte, dat het goed zichtbaar is voor een ander schip dat het schip oploopt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.11
  - number: 3.11.2
    text: 'Een gekoppeld samenstel bestaande uit grote schepen dat wordt geassisteerd moet voeren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.11
  - number: 3.11.2.a
    text: '’s nachts: de lichten voorgeschreven in het eerste lid;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.11
  - number: 3.11.2.b
    text: 'overdag: een gele bol, voorop op een hoogte van ten minste 5 m.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.11
  - number: 3.11.3
    text: |-
      Indien bij een gekoppeld samenstel bestaande uit grote schepen het langszijde van het motorschip vastgemaakte
      andersoortige schip een zeegaand schip is, mag het motorschip, in plaats van de bij het eerste lid voorgeschreven
      lichten, de lichten voeren, bedoeld in [artikel 3.09, eerste lid][ref1], en mag het andersoortige schip voeren:
      boordlichten en een heklicht, als bedoeld in het eerste lid, onder b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 3.11.4
    text: |-
      Een gekoppeld samenstel, waarvan de grootste lengte meer dan 140 m bedraagt, wordt voor de toepassing van dit
      hoofdstuk beschouwd als een duwstel van dezelfde lengte.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.11
  - number: '3.12'
    text: 'Een groot zeilschip moet ’s nachts voeren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.12
  - number: 3.12.a
    text: |-
      boordlichten op gelijke hoogte en in een lijn loodrecht op de lengte-as en ten hoogste 1 m binnen de zijkanten van
      het schip. Zij mogen gewone lichten zijn;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.12
  - number: 3.12.b
    text: |-
      een heklicht op het achterschip, zoveel als mogelijk in de lengte-as van het schip op een zodanige hoogte, dat het
      goed zichtbaar is voor een ander schip dat het schip oploopt;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.12
  - number: 3.12.c
    text: |-
      twee heldere of gewone rondom schijnende lichten in een verticale lijn, het bovenste rood en het onderste groen,
      met een onderlinge afstand van ten minste 1 m, aan of nabij de top van de mast, waar deze het best kunnen worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.12
  - number: 3.13.1
    text: 'Een alleenvarend klein motorschip moet ’s nachts voeren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.13.1.a
    text: 'hetzij:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.13.1.a.1°
    text: |-
      een toplicht in de lengteas van het schip, op dezelfde hoogte als de boordlichten en tenminste 1 m voor deze
      lichten. Dit licht moet een helder licht zijn;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.13.1.a.2°
    text: |-
      boordlichten. Deze lichten mogen gewone lichten zijn. Zij moeten zich op gelijke hoogte en in één lijn loodrecht op
      de lengteas van het schip bevinden; en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.13.1.a.3°
    text: een heklicht op het achterschip, op zodanige hoogte dat het voor een oploper goed zichtbaar is;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.13.1.b
    text: 'hetzij:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.13.1.b.1°
    text: |-
      een toplicht, zoals voorgeschreven onder a, 1°. Dit licht moet echter ten minste 1 m hoger dan de boordlichten
      worden gevoerd;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.13.1.b.2°
    text: |-
      de boordlichten, zoals voorgeschreven onder a, 2°. Deze lichten mogen echter onmiddellijk naast elkaar of in één
      lantaarn verenigd in de lengteas van het schip aan of nabij de boeg worden gevoerd; en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.13.1.b.3°
    text: |-
      een heklicht, zoals voorgeschreven onder a, 3°. In plaats van dit heklicht en van het onder b, 1°, bedoelde
      toplicht mag een wit rondom schijnend licht worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.13.2
    text: |-
      Een alleenvarend klein open motorschip met een lengte van minder dan 7 m waarvan de hoogst bereikbare snelheid
      niet meer is dan 13 km per uur ten opzichte van het water mag, in plaats van de bij het eerste lid voorgeschreven
      lichten, een wit gewoon rondom schijnend licht voeren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.13.3
    text: |-
      Een klein motorschip dat slechts kleine schepen sleept dan wel langszijde daarvan vastgemaakte kleine schepen
      voortbeweegt moet des nachts de bij het eerste lid voorgeschreven lichten voeren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.13.4
    text: |-
      Een klein schip dat wordt gesleept dan wel langszijde van een ander schip vastgemaakt wordt voortbewogen moet des
      nachts een wit gewoon rondom schijnend licht voeren. Dit lid is niet van toepassing op de bijboot van een schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.13.5
    text: |-
      Een klein zeilschip moet des nachts voeren: - hetzij boordlichten en een heklicht, zodanig dat de boordlichten
      naast elkaar of in één lantaarn verenigd in de lengte-as van het schip aan of nabij de boeg en het heklicht op het
      achterschip zijn aangebracht. De boordlichten mogen gewone lichten zijn;
        - hetzij boordlichten en een heklicht, verenigd in één lantaarn, aan of nabij de top van de mast waar deze het best
      kan worden gezien. Dit mag een gewoon licht zijn;
        - hetzij, indien de lengte van het schip minder dan 7 m bedraagt, een wit gewoon rondom schijnend licht op een
      zodanige hoogte, dat het van alle zijden zichtbaar is. Het schip moet dan bovendien bij het naderen van een ander
      schip, bij gevaar voor aanvaring, een tweede wit gewoon licht tonen om de aandacht te trekken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.13.6
    text: Een klein door spierkracht voortbewogen schip moet des nachts een wit gewoon rondom schijnend licht voeren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.13.7
    text: |-
      Een klein schip dat onder zeil vaart en tegelijkertijd zijn mechanische middelen tot voortbeweging gebruikt moet
      overdag voeren: een zwarte kegel met de punt naar beneden, zo hoog mogelijk, op een plaats waar hij het best kan
      worden gezien.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.13
  - number: 3.14.1
    text: |-
      Een schip dat bepaalde brandbare stoffen vervoert, bedoeld in het ADN, nr. 7.1.5.0 of nr. 7.2.5.0, moet, teneinde
      dit kenbaar te maken, als bijkomend teken voeren:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.14
  - number: 3.14.1.a
    text: '’s nachts: een blauw licht;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.14
  - number: 3.14.1.b
    text: 'overdag: een blauwe kegel met de punt naar beneden.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.14
  - number: 3.14.2
    text: |-
      Een schip dat bepaalde voor de gezondheid schadelijke stoffen vervoert, bedoeld in het ADN, nr. 7.1.5.0 of
      nr. 7.2.5.0, moet, teneinde dit kenbaar te maken, als bijkomende tekens voeren:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.14
  - number: 3.14.2.a
    text: '’s nachts: twee blauwe lichten;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.14
  - number: 3.14.2.b
    text: 'overdag: twee blauwe kegels met de punt naar beneden.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.14
  - number: 3.14.3
    text: |-
      Een schip dat bepaalde ontplofbare stoffen vervoert, bedoeld in het ADN, nr. 7.1.5.0, moet, teneinde dit kenbaar te
      maken, als bijkomende tekens voeren:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.14
  - number: 3.14.3.a
    text: '’s nachts: drie blauwe lichten;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.14
  - number: 3.14.3.b
    text: 'overdag: drie blauwe kegels met de punt naar beneden.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.14
  - number: 3.14.4
    text: |-
      Indien een duwstel of een gekoppeld samenstel één of meer schepen bevat, bedoeld in één der voorgaande leden,
      moet, in plaats van dit schip of van deze schepen, de duwboot of het schip dat dient voor het voortbewegen van het
      gekoppeld samenstel het teken of de tekens, vermeld in dat lid, voeren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.14
  - number: 3.14.5
    text: |-
      Een duwstel, dat door twee duwboten naast elkaar wordt voortbewogen, moet de tekens bedoeld in het vierde lid op de
      duwboot aan stuurboord voeren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.14
  - number: 3.14.6
    text: |-
      Een schip, een duwstel of een gekoppeld samenstel dat verschillende gevaarlijke stoffen vervoert, bedoeld in het
      eerste, tweede of derde lid, moet uitsluitend de tekens voeren voor de gevaarlijke stof die volgens de voorgaande
      leden het grootste aantal blauwe lichten of kegels vereist.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.14
  - number: 3.14.7
    text: |-
      Een schip, dat in het bezit is van een certificaat van goedkeuring, als bedoeld in het ADN, nr. 1.16.1.1.1, en
      dat voldoet aan de veiligheidsvoorschriften die gelden voor een schip als bedoeld in het eerste lid, mag, indien
      het gelijktijdig met een schip, dat de tekens bedoeld in het eerste lid moet voeren, wil worden geschut, bij het
      naderen van een sluis, de tekens bedoeld in het eerste lid voeren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.14
  - number: 3.14.8
    text: |-
      De sterkte van de blauwe lichten voorgeschreven in één der voorgaande leden dient tenminste gelijk te zijn aan die
      van blauwe gewone lichten.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.14
  - number: 3.15.1
    text: |-
      Een varend passagiersschip waarvan de maximale lengte van de romp minder is dan 20 m moet overdag voeren: een gele
      ruit, op een geschikte plaats en op een zodanige hoogte dat hij van alle zijden zichtbaar is.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.15
  - number: 3.15.2
    text: De bevoegde autoriteit kan vaarwegen aanwijzen waarop de verplichting van het eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.15
  - number: 3.16.1
    text: 'Een niet-vrijvarende veerpont moet des nachts voeren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.16
  - number: 3.16.1.a
    text: |-
      een wit helder rondom schijnend licht op een hoogte van tenminste 5 m. Deze hoogte mag echter worden verminderd,
      indien de lengte van de pont 15 m niet overschrijdt;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.16
  - number: 3.16.1.b
    text: een groen helder rondom schijnend licht ongeveer 1 m boven het onder *a* bedoelde licht.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.16
  - number: 3.16.2
    text: |-
      De het meest bovenstrooms gelegen ankerschuit of drijver van een veerpont aan een langskabel moet des nachts zijn
      voorzien van een wit helder rondom schijnend licht, tenminste 3 m boven het wateroppervlak.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.16
  - number: 3.16.3
    text: 'Een vrijvarende veerpont moet des nachts voeren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.16
  - number: 3.16.3.a
    text: een wit helder rondom schijnend licht, bedoeld in het eerste lid, onder *a*;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.16
  - number: 3.16.3.b
    text: een groen helder rondom schijnend licht, bedoeld in het eerste lid, onder *b*, en,
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.16
  - number: 3.16.3.c
    text: |-
      boordlichten en een heklicht. Deze lichten moeten voldoen aan [artikel 3.08, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: '3.17'
    text: |-
      Een schip dat recht van voorrang heeft voor de doorvaart op plaatsen waar de volgorde van doorvaren is geregeld en
      dat van dit recht gebruik wil maken moet, teneinde dit kenbaar te maken, als bijkomend dagteken voeren: een rode
      wimpel op het voorschip op een voldoende hoogte om goed zichtbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.17
  - number: 3.18.1
    text: |-
      Een schip dat onmanoeuvreerbaar wordt moet, teneinde dit kenbaar te maken, als bijkomende tekens zo nodig tonen: -
      des nachts: a. een rood licht waarmee heen en weer wordt gezwaaid. In het geval van een klein schip mag dit een wit
      licht zijn, of b. twee rode gewone rondom schijnende lichten in een verticale lijn met een onderlinge afstand van
      ongeveer 1 m, op een geschikte plaats en op een zodanige hoogte dat zij van alle zijden zichtbaar zijn;
        - des daags: c. een rode vlag waarmee heen en weer wordt gezwaaid, of d. twee zwarte bollen in een verticale lijn
      met een onderlinge afstand van ongeveer 1 m, op een geschikte plaats en op een zodanige hoogte dat zij van alle
      zijden zichtbaar zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.18
  - number: 3.18.2
    text: |-
      De in het eerste lid bedoelde tekens vervangen het in bijlage 6 onder A vermelde geluidssein of vullen dat aan. De
      vlag mag worden vervangen door een bord van dezelfde kleur.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.18
  - number: '3.19'
    text: |-
      Onverminderd de bijzondere voorschriften die ingevolge [artikel 1.21][ref1] kunnen worden gesteld moeten een
      drijvend voorwerp en een drijvende inrichting des nachts voeren: witte heldere rondom schijnende lichten in
      voldoend aantal om hun omtrek aan te duiden, op een zodanige hoogte dat zij van alle zijden zichtbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel1
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.20.1
    text: |-
      Een groot schip dat direct of indirect aan de oever gemeerd ligt moet ’s nachts voeren: een wit gewoon rondom
      schijnend licht aan de zijde van het vaarwater op een hoogte van tenminste 3 m. In plaats van dit licht mogen ook
      twee witte gewone rondom schijnende lichten aan de zijde van het vaarwater op dezelfde hoogte, één op het voorschip
      en één op het achterschip, worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
  - number: 3.20.2
    text: 'Een groot schip dat stilligt zonder direct of indirect aan de oever gemeerd te liggen moet voeren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
  - number: 3.20.2.a
    text: |-
      ’s nachts: twee witte gewone rondom schijnende lichten waar deze het best kunnen worden gezien, het ene op het
      voorschip op een hoogte van tenminste 4 m en het andere op het achterschip op een hoogte van tenminste 2 m en
      tenminste 2 m lager dan het licht op het voorschip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
  - number: 3.20.2.b
    text: 'overdag: een zwarte bol op het voorschip, op een zodanige hoogte dat hij van alle zijden zichtbaar is.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
  - number: 3.20.3
    text: |-
      Een duwstel dat stilligt zonder direct of indirect aan de oever gemeerd te liggen moet voeren: - des nachts: een
      wit gewoon rondom schijnend licht op elk schip, telkens waar dit het best kan worden gezien, op een hoogte van
      tenminste 4 m. Het duwstel behoeft op de duwbakken tezamen niet meer dan vier lichten te voeren, mits de contouren
      van het duwstel hierdoor goed worden aangegeven.
        - des daags: een zwarte bol op de duwboot of de duwboten en op het voorste andersoortige schip of de voorste
      andersoortige schepen aan de buitenzijden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
  - number: 3.20.4
    text: 'Een klein schip dat stilligt, met uitzondering van de bijboot van een schip, moet voeren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
  - number: 3.20.4.a
    text: '’s nachts: een wit gewoon rondom schijnend licht waar dit het best kan worden gezien;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
  - number: 3.20.4.b
    text: |-
      overdag, indien het niet direct of indirect aan de oever gemeerd ligt: een zwarte bol op een geschikte plaats, op
      een zodanige hoogte dat hij van alle zijden zichtbaar is.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
  - number: 3.20.5
    text: 'De in dit artikel bedoelde tekens behoeven niet gevoerd te worden door een schip:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
  - number: 3.20.5.a
    text: dat ligt in een vaarweg of in een gedeelte van een vaarweg, aangewezen door de bevoegde autoriteit;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
  - number: 3.20.5.b
    text: dat ligt in een vaarweg waar varen niet mogelijk dan wel verboden is;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
  - number: 3.20.5.c
    text: dat direct of indirect aan de oever gemeerd ligt en vanwege aldaar aanwezige verlichting voldoende zichtbaar is;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
  - number: 3.20.5.d
    text: dat op een veilige ligplaats ligt;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
  - number: 3.20.5.e
    text: |-
      dat ligt op een ligplaats die de bevoegde autoriteit als zodanig heeft aangeduid en waar hij het achterwege laten
      van het voeren van de tekens heeft toegestaan.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
  - number: 3.20.6
    text: |-
      Dit artikel is niet van toepassing op de schepen, bedoeld in de [artikelen 3.22][ref1] en [3.25][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
  - number: '3.21'
    text: |-
      [Artikel 3.14][ref1] is eveneens van toepassing op het schip, het duwstel of het gekoppeld samenstel, bedoeld in
      dat artikel, wanneer het stilligt.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 3.22.1
    text: |-
      Een op zijn aanlegplaats stilliggende niet-vrijvarende veerpont moet des nachts de bij
      [artikel 3.16, eerste lid][ref1], voorgeschreven lichten voeren. Bovendien moet de het meest bovenstrooms
      gelegen ankerschuit of drijver van een veerpont aan een langskabel des nachts het bij artikel 3.16, tweede lid,
      voorgeschreven licht voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 3.22.2
    text: |-
      Een op zijn aanlegplaats stilliggende vrijvarende veerpont, die dienst doet, moet des nachts de
      bij [artikel 3.16, eerste lid][ref1], voorgeschreven lichten voeren. Hij mag bovendien de bij
      [artikel 3.08, eerste lid, onder b en c][ref2], voorgeschreven lichten blijven voeren. Hij moet de lichten bedoeld
      in artikel 3.08, eerste lid, onder b en c, en het groene licht bedoeld in artikel 3.16, derde lid, onder b, doven,
      zodra hij buiten dienst is.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: '3.23'
    text: |-
      Onverminderd de bijzondere voorschriften die op grond van [artikel 1.21][ref1] kunnen worden gesteld, moeten
      een drijvend voorwerp en een drijvende inrichting des nachts voeren: witte gewone rondom schijnende lichten, in
      voldoend aantal om hun omtrek aan de zijde van het vaarwater aan te duiden, op een zodanige hoogte dat zij van het
      vaarwater af goed zichtbaar zijn. [Artikel 3.20, vijfde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
  - number: '3.24'
    text: |-
      Een schip dat op een vaarweg waar stroom loopt een net of een uitlegger in of in de nabijheid van het vaarwater
      heeft uitstaan, moet, teneinde dit kenbaar te maken, als bijkomend teken, en zodanig dat het zijn net of uitlegger
      aanduidt, voeren: - des nachts: een wit gewoon rondom schijnend licht;
        - des daags: een gele vlag.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.24
  - number: 3.25.1
    text: |-
      Een in bedrijf zijnd drijvend werktuig en een schip dat in het vaarwater werken uitvoert, dan wel peilingen of
      metingen verricht, moeten voeren:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.25
  - number: 3.25.1.a
    text: |-
      aan de zijde waar de doorvaart vrij is: - des nachts: twee groene heldere of gewone rondom schijnende lichten in
      een verticale lijn met een onderlinge afstand van ongeveer 1 m;
        - des daags: twee groene ruiten in een verticale lijn met een onderlinge afstand van ongeveer 1 m;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.25
  - number: 3.25.1.b
    text: |-
      aan de zijde waar de doorvaart niet vrij is: - des nachts: een rood rondom schijnend licht op dezelfde hoogte als
      het bovenste van de onder *a* voorgeschreven groene lichten en van dezelfde lichtsterkte als die lichten;
        - des daags: een rode bol op dezelfde hoogte als de bovenste van de onder *a* voorgeschreven groene ruiten; of, in
      het geval dat deze schepen tevens tegen hinderlijke waterbeweging beschermd willen worden:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.25
  - number: 3.25.1.c
    text: |-
      aan de zijde waar de doorvaart vrij is: - des nachts: een rood helder of gewoon rondom schijnend licht en een wit
      helder of gewoon rondom schijnend licht in een verticale lijn, met een onderlinge afstand van ongeveer 1 m, het
      bovenste rood en het onderste wit;
        - des daags: een bord waarvan de bovenste helft rood en de onderste helft wit is dan wel twee borden in een
      verticale lijn, het bovenste rood en het onderste wit;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.25
  - number: 3.25.1.d
    text: |-
      aan de zijde waar de doorvaart niet vrij is: - des nachts: een rood rondom schijnend licht op dezelfde hoogte als
      het onder *c* voorgeschreven rode licht en van dezelfde lichtsterkte als dit licht;
        - des daags: een rood bord op dezelfde hoogte als het rood-witte bord of als het rode bord, voorgeschreven onder
      *c*. Deze tekens moeten zijn aangebracht op een zodanige hoogte, dat zij van alle zijden zichtbaar zijn. De borden
      mogen worden vervangen door vlaggen van dezelfde kleur.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.25
  - number: 3.25.2
    text: |-
      Een vastgevaren of gezonken schip moet de bij het eerste lid, onder *c* en *d*, voorgeschreven tekens voeren.
      Indien een gezonken schip zodanig ligt dat daarop de tekens niet kunnen worden aangebracht, moeten deze op
      roeiboten of op een andere doelmatige wijze zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.25
  - number: 3.25.3
    text: |-
      De bevoegde autoriteit kan ontheffing verlenen van de verplichting tot het voeren van de bij het eerste lid
      voorgeschreven tekens.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.25
  - number: 3.26.1
    text: |-
      Een schip waarvan een anker zodanig is uitgezet, dat daardoor een gevaar voor de scheepvaart kan worden gevormd,
      moet des nachts, teneinde dit kenbaar te maken, als bijkomend licht voeren: een tweede wit gewoon rondom schijnend
      licht: '- hetzij, ingeval op het schip [artikel 3.20, eerste, derde of vierde lid][ref1], van toepassing is,'
      ongeveer 1 m loodrecht onder het aldaar bedoelde licht; indien in het geval van [artikel 3.20, eerste lid][ref2],
      twee van deze lichten zijn aangebracht, moet het bijkomend licht worden gevoerd onder het licht dat het meest nabij
      het uitstaande anker is aangebracht;
        - hetzij, ingeval op het schip [artikel 3.20, tweede lid][ref3] , van toepassing is, ongeveer 1 m loodrecht onder
      het aldaar bedoelde licht op het voorschip.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
  - number: 3.26.2
    text: |-
      Een drijvend voorwerp en een drijvende inrichting waarvan één of meer ankers zodanig zijn uitgezet, dat daardoor
      een gevaar voor de scheepvaart kan worden gevormd, moeten van de in [artikel 3.23][ref1] bedoelde lichten het licht
      dan wel elk van de lichten dat zich het meest nabij dit anker dan wel deze ankers bevindt vervangen door: twee
      gewone rondom schijnende lichten in een verticale lijn met een onderlinge afstand van ongeveer 1 m.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
  - number: 3.26.3
    text: |-
      Een schip, een drijvend voorwerp en een drijvende inrichting moeten het anker of elk van de ankers bedoeld in het
      eerste en tweede lid aanduiden door: een gele boei voorzien van een radarreflector.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.26
  - number: 3.26.4
    text: |-
      Een drijvend werktuig waarvan één of meer ankers een gevaar voor de scheepvaart kunnen vormen moet dit anker dan
      wel elk van deze ankers aanduiden door: - des nachts: een boei voorzien van een wit gewoon rondom schijnend licht
      en een radarreflector;
        - des daags: een gele boei voorzien van een radarreflector.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.26
  - number: '3.27'
    text: |-
      Een schip van ambtenaren belast met toezicht of opsporing mag, om zich kenbaar te maken, als bijkomend teken
      een blauw gewoon rondom schijnend flikkerlicht of licht dat snel flikkert tonen. Het zelfde geldt voor een
      brandweerboot die hulp biedt of daartoe op weg is en voor een reddingsvaartuig bij een reddingsoperatie met
      toestemming van de bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.27
  - number: '3.28'
    text: |-
      Een schip dat in of nabij het vaarwater werkzaamheden uitvoert mag, om dit kenbaar te maken, als bijkomend teken,
      met toestemming van de bevoegde autoriteit, tonen: een geel helder of gewoon rondom schijnend flikkerlicht of licht
      dat snel flikkert.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.28
  - number: 3.29.1
    text: |-
      De in het tweede lid vermelde schepen, drijvende voorwerpen en drijvende inrichtingen, die beschermd willen
      worden tegen hinderlijke waterbeweging veroorzaakt door het langsvaren van andere schepen of drijvende voorwerpen,
      mogen, teneinde dit kenbaar te maken, als bijkomende tekens tonen: - des nachts: een rood helder of gewoon rondom
      schijnend licht en een wit helder of gewoon rondom schijnend licht, in een verticale lijn met een onderlinge
      afstand van ongeveer 1 m, het bovenste rood en het onderste wit, op een zodanige plaats dat zij van alle zijden
      zichtbaar zijn en niet met andere lichten kunnen worden verward;
        - des daags: een bord waarvan de bovenste helft rood en de onderste helft wit is dan wel twee borden in een
      verticale lijn, het bovenste rood en het onderste wit, op een geschikte plaats en op een zodanige hoogte, dat elk
      bord van alle zijden zichtbaar is. De borden mogen worden vervangen door vlaggen van dezelfde kleur.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.29
  - number: 3.29.2
    text: |-
      De schepen, drijvende voorwerpen en drijvende inrichtingen, die de in het eerste lid bedoelde tekens mogen tonen,
      zijn:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.29
  - number: 3.29.2.a
    text: |-
      schepen, drijvende voorwerpen en drijvende inrichtingen die zwaar zijn beschadigd of in het vaarwater werkzaamheden
      verrichten, alsmede schepen die niet in staat zijn te manoeuvreren;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.29
  - number: 3.29.2.b
    text: |-
      schepen, drijvende voorwerpen en drijvende inrichtingen, die zijn voorzien van een schriftelijke toestemming van de
      bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.29
  - number: 3.30.1
    text: |-
      Een in nood verkerend schip, dat hulp wil inroepen, mag tonen: - hetzij: des nachts een licht waarmee in het rond
      wordt gezwaaid, en des daags een vlag of ieder ander geschikt voorwerp waarmee in het rond wordt gezwaaid;
        - hetzij: vuurpijlen, lichtkogels, parachutelichten of rookbommen dan wel vlammen;
        - hetzij: des daags een vlag met daarboven of daaronder een bol of een daarop gelijkend voorwerp.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.30
  - number: 3.30.2
    text: |-
      Deze tekens vervangen de in [artikel 4.01, vierde lid][ref1], vermelde geluidsseinen of vullen deze aan.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel4
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '4'
        hoofdstuk: '4'
  - number: 3.30.3
    text: 'Een schip dat medische hulp wil inroepen, mag geven: vier korte stoten, gevolgd door één lange stoot.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.30
  - number: 3.31.1
    text: |-
      Indien op grond van wettelijke voorschriften de toegang aan boord voor onbevoegden is verboden, wordt dit verbod
      aangeduid door: één of meer ronde witte symbolen met een rode rand en een rode diagonale balk en met, in zwart, de
      afbeelding van een afwerende hand. Deze symbolen wordt naar behoefte aan boord of bij de loopplank aangebracht. De
      doorsnede van deze symbolen bedraagt ongeveer 0,60 m.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.31
  - number: 3.31.2
    text: Deze symbolen worden zo nodig verlicht om ’s nachts duidelijk zichtbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.31
  - number: 3.32.1
    text: 'Indien het op grond van wettelijke voorschriften aan boord is verboden:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.32
  - number: 3.32.1.a
    text: te roken; of
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.32
  - number: 3.32.1.b
    text: onbeschermd licht of vuur te gebruiken,
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.32
  - number: 3.32.2
    text: Deze symbolen worden zo nodig verlicht om ‘s nachts duidelijk zichtbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.32
  - number: 3.33.1
    text: |-
      Indien het op grond van wettelijke bepalingen is verboden dichtbij een schip evenwijdig daaraan ligplaats te nemen,
      moet dit schip op het dek in de lengte-as voeren: een vierkant bord aan de onderzijde waarvan zich een driehoek
      bevindt. Het bord moet aan beide zijden wit zijn met een rode rand en een rode diagonale balk en met, in zwart, de
      letter P en de driehoek aan beide zijden wit met, in zwart, cijfers die de afstand in meters aangeven waarbinnen
      geen ligplaats mag worden genomen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.33
  - number: 3.33.2
    text: Des nachts moet dit bord zodanig zijn verlicht dat het aan beide zijden van het schip duidelijk zichtbaar is.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.33
  - number: 3.33.3
    text: |-
      Dit artikel is niet van toepassing op een schip, een duwstel of een gekoppeld samenstel bedoeld in
      [artikel 3.21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
  - number: 3.34.1
    text: |-
      Een varend schip dat wegens de uitvoering van werkzaamheden in het vaarwater beperkt is in zijn mogelijkheden
      om voor andere schepen uit te wijken overeenkomstig de vaarregels van dit reglement en dat deswege door zijn
      positie of zijn gedrag aanleiding kan geven tot een gevaarlijke situatie moet, behalve de tekens bedoeld in
      [artikel 3.08][ref1], voeren:


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 3.34.1.a
    text: |-
      ’s nachts: drie heldere of gewone rondom schijnende lichten in een verticale lijn met een onderlinge afstand van
      ongeveer 1 m, op een zodanige hoogte dat zij van alle zijden zichtbaar zijn, het bovenste en het onderste rood en
      het middelste wit;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
  - number: 3.34.1.b
    text: |-
      overdag: een zwarte bol, een zwarte ruit en een zwarte bol in een verticale lijn met een onderlinge afstand van
      ongeveer 1 m, op een zodanige hoogte dat zij van alle zijden zichtbaar zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
  - number: 3.34.2
    text: |-
      Indien de doorvaart niet aan beide zijden van het schip vrij is, moet het schip behalve de in het eerste lid
      bedoelde tekens voeren:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
  - number: 3.34.2.a
    text: '’s nachts:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
  - number: 3.34.2.a.1°
    text: |-
      aan de zijde waar de doorvaart niet vrij is: twee rode heldere of gewone rondom schijnende lichten in een verticale
      lijn met een onderlinge afstand van ongeveer 1 m;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
  - number: 3.34.2.a.2°
    text: |-
      aan de zijde waar de doorvaart vrij is: twee groene heldere of gewone rondom schijnende lichten in een verticale
      lijn met een onderlinge afstand van ongeveer 1 m;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
  - number: 3.34.2.b
    text: 'overdag:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
  - number: 3.34.2.b.1°
    text: |-
      aan de zijde waar de doorvaart niet vrij is: twee zwarte bollen in een verticale lijn met een onderlinge afstand
      van ongeveer 1 m;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
  - number: 3.34.2.b.2°
    text: |-
      aan de zijde waar de doorvaart vrij is: twee zwarte ruiten in een verticale lijn met een onderlinge afstand van
      ongeveer 1 m.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
  - number: 3.34.3
    text: |-
      Indien de doorvaart aan beide zijden van het schip vrij is, moet het schip behalve de in het eerste lid bedoelde
      tekens aan beide zijden voeren:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
  - number: 3.34.3.a
    text: |-
      ’s nachts: twee groene heldere of gewone rondom schijnende lichten in een verticale lijn met een onderlinge afstand
      van ongeveer 1 m;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
  - number: 3.34.3.b
    text: 'overdag: twee zwarte ruiten in een verticale lijn met een onderlinge afstand van ongeveer 1 m.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
  - number: 3.34.4
    text: |-
      De lichten, bollen en ruiten, bedoeld in het tweede en derde lid, mogen niet hoger zijn aangebracht dan het laagste
      van de lichten of bollen, bedoeld in het eerste lid, en zij moeten tenminste 2 m daarvan verwijderd zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
  - number: 3.34.5
    text: |-
      In plaats van de in dit artikel bedoelde tekens mogen de tekens, bedoeld in [artikel 3.25][ref1], worden gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
  - number: '3.35'
    text: |-
      Een schip bezig met mijnenopruimingswerkzaamheden moet, behalve de tekens bedoeld in [artikel 3.08][ref1], voeren:


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 3.35.a
    text: |-
      ’s nachts: drie groene heldere of gewone rondom schijnende lichten, één aan of nabij de top van de mast op het
      voorschip en één aan elk uiteinde van de ra van deze mast;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.35
  - number: 3.35.b
    text: 'overdag: drie zwarte bollen op dezelfde plaatsen als de lichten ’s nachts.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.35
  - number: '3.36'
    text: 'Een schip dat loodsdienst uitoefent moet voeren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.36
  - number: 3.36.a
    text: '’s nachts:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.36
  - number: 3.36.a.1°
    text: |-
      een wit helder of gewoon rondom schijnend licht en een rood helder of gewoon rondom schijnend licht in een
      verticale lijn, het bovenste wit en het onderste rood, aan of nabij de top van de mast op het voorschip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.36
  - number: 3.36.a.2°
    text: |-
      boordlichten op gelijke hoogte, in een lijn loodrecht op de lengte-as en ten hoogste 1 m binnen de zijkanten van
      het schip; en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.36
  - number: 3.36.a.3°
    text: |-
      een heklicht op het achterschip, zoveel als mogelijk in de lengte-as van het schip op een zodanige hoogte, dat het
      goed zichtbaar is voor een ander schip dat het schip oploopt;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.36
  - number: 3.36.b
    text: 'overdag: een blauwe vlag met, in wit, de letter L aan of nabij de top van de mast op het voorschip.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.36
  - number: '3.37'
    text: 'Een vissersschip moet voeren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.37
  - number: 3.37.a
    text: '’s nachts:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.37
  - number: 3.37.a.1°
    text: |-
      een groen helder of gewoon rondom schijnend licht en een wit helder of gewoon rondom schijnend licht in een
      verticale lijn met een onderlinge afstand van tenminste 1 m, het bovenste groen en het onderste wit, op een
      zodanige hoogte dat het onderste zich tenminste 2 m boven de boordlichten bevindt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.37
  - number: 3.37.a.2
    text: |-
      boordlichten op gelijke hoogte en in een lijn loodrecht op de lengte-as van het schip, tenminste 1 m lager dan het
      witte licht bedoeld in onderdeel a, 1°, en niet meer dan 1 m binnen de buitenzijden van het schip; en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.37
  - number: 3.37.a.3°
    text: |-
      een heklicht op het achterschip, zoveel als mogelijk in de lengte-as van het schip, op een zodanige hoogte dat het
      goed zichtbaar is voor een ander schip dat het schip oploopt;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.37
  - number: 3.37.b
    text: |-
      overdag: twee zwarte kegels met de punten tegen elkaar (diabolo) in een verticale lijn, op een zodanige hoogte dat
      zij van alle zijden goed zichtbaar zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.37
  - number: 3.38.1
    text: |-
      Een schip dat gebruikt wordt bij het duiken moet, behalve de bij [artikel 3.08][ref1], respectievelijk
      [artikel 3.20][ref2] voorgeschreven tekens, als bijkomend teken voeren: de internationale seinvlag «A» dan wel een
      replica daarvan vervaardigd van niet buigzaam materiaal, op een zodanige hoogte en op een zodanige wijze dat deze
      van alle zijden zichtbaar is. 's Nachts moet dit teken zodanig zijn verlicht, dat het duidelijk zichtbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
  - number: 3.38.2
    text: |-
      Het bijkomende teken, bedoeld in het eerste lid, mag ook worden getoond bij duikwerkzaamheden die vanaf de wal
      worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel3.38
  - number: 4.01.1
    text: |-
      De in [bijlage 6][ref1] vermelde geluidsseinen, niet zijnde klokslagen, moeten worden gegeven door:


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.01
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 4.01.1.a
    text: |-
      een groot motorschip door middel van een mechanisch werkende geluidsinstallatie die voldoende hoog is opgesteld en
      vrij staat naar voren en voorzover mogelijk ook naar achteren;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.01
  - number: 4.01.1.b
    text: |-
      een groot schip, niet zijnde een motorschip, en een klein motorschip door middel van een mechanisch werkende
      geluidsinstallatie dan wel een geschikte scheepstoeter of hoorn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.01
  - number: 4.01.2
    text: |-
      Een groot motorschip moet gelijktijdig met een geluidssein een geel helder rondom schijnend lichtsein tonen. Dit
      geldt niet voor klokslagen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.01
  - number: 4.01.3
    text: |-
      Bij een samenstel mogen de geluidsseinen slechts worden gegeven door het schip aan boord waarvan zich de schipper
      van het samenstel bevindt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.01
  - number: 4.01.4
    text: |-
      Een in nood verkerend schip dat hulp wil inroepen mag reeksen klokslagen of herhaalde lange stoten laten horen.
      Deze seinen dienen ter vervanging of ter aanvulling van de in [artikel 3.30, eerste lid][ref1], bedoelde tekens.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.01
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: IV
  - number: 4.01.5
    text: Een schip moet een reeks klokslagen ongeveer vier seconden doen duren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.01
  - number: 4.01.6
    text: Een schip mag in plaats van een reeks klokslagen een reeks slagen van metaal op metaal geven.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.01
  - number: 4.02.1
    text: |-
      Een groot schip moet ter voorkoming van aanvaring zo nodig de geluidsseinen geven, vermeld in [bijlage 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.02
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 4.02.2
    text: |-
      Een klein schip moet ter voorkoming van aanvaring zo nodig het attentiesein, het sein «Ik kan niet
      manoeuvreren» en zo nodig het noodsein, vermeld in [afdeling A van bijlage 6][ref1], geven en het mag zo
      nodig een der overige algemene geluidsseinen, vermeld in [afdeling A][ref2] alsmede het mistsein, vermeld in
      [afdeling G van bijlage 6][ref3], geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
      [ref2]: https://wetten.overheid.nl/BWBR0003628
      [ref3]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.02
    references:
      - id: ref1
        bwb_id: BWBR0003628
      - id: ref2
        bwb_id: BWBR0003628
      - id: ref3
        bwb_id: BWBR0003628
  - number: 4.02.3
    text: |-
      Een klein schip mag niet de manoeuvreerseinen, vermeld in de [afdelingen B, C, D en E van bijlage 6][ref1], geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.02
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 4.03.1
    text: |-
      Een schip mag slechts van de geluidsinstallatie dan wel van de scheepstoeter of de hoorn gebruik maken voor het
      geven van de geluidsseinen welke in dit reglement worden vermeld en deze geluidsseinen niet geven onder andere
      omstandigheden dan die welke in dit reglement zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.03
  - number: 4.03.2
    text: |-
      Een schip mag voor het wisselen van berichten met andere schepen of met de wal evenwel van de geluidsinstallatie
      dan wel van de scheepstoeter of de hoorn gebruik maken, mits hierdoor geen verwarring kan ontstaan met de in dit
      reglement vermelde geluidsseinen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.03
  - number: 4.04.1
    text: |-
      Tankschepen, die de tekens bedoeld in [artikel 3.14, eerste of tweede lid][ref1], moeten voeren, en schepen, die
      de tekens bedoeld in [artikel 3.14, derde lid][ref2], moeten voeren, moeten ingeval van een gebeurtenis of ongeval,
      waardoor gevaarlijke stoffen die door deze schepen worden vervoerd zouden kunnen vrijkomen, als geluidssein
      achtereenvolgens één korte stoot en één lange stoot geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.04
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 4.04.2
    text: |-
      Het in het eerste lid bedoelde geluidssein moet ononderbroken gedurende tenminste 15 minuten worden herhaald. De
      geluidsinstallatie moet hiertoe zodanig zijn ingericht, dat na het inschakelen het sein automatisch wordt gegeven.
      De inrichting moet van dien aard zijn, dat het sein zich niet ongewild in werking kan stellen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.04
  - number: 4.04.3
    text: |-
      Dit artikel is niet van toepassing op duwbakken noch op andere schepen zonder bemanning. Indien evenwel deze
      schepen deel uitmaken van een samenstel, moet het schip aan boord waarvan zich de schipper van het samenstel
      bevindt het sein geven.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.04
  - number: 4.05.1
    text: |-
      Een schip mag slechts gebruik maken van een marifoon die in overeenstemming is met de Regionale regeling
      betreffende de marifoondienst in de binnenvaart. De marifoon mag slechts worden gebruikt overeenkomstig de
      voorschriften van deze regeling, zoals vermeld in het Handboek voor de radiocommunicatie in de binnenvaart.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.05
  - number: 4.05.2
    text: |-
      Een schip mag bij gebruik van de kanalen bestemd voor het schip--schip verkeer of de nautische informatie en
      bij het verbinding hebben met de voor de scheepvaart ingestelde diensten geen mededelingen doen, die niet in
      dit reglement zijn voorgeschreven of toegelaten dan wel niet zijn toegelaten krachtens de Regionale regeling
      betreffende de marifoondienst in de binnenvaart.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.05
  - number: 4.05.3
    text: |-
      Een varend groot schip moet zijn uitgerust met een marifooninstallatie die geschikt is voor de kanalen voor het
      schip--schip verkeer en voor de nautische informatie en voor het verbinding hebben met de voor de scheepvaart
      ingestelde diensten en die goed functioneert. Op de in [bijlage 9][ref1] vermelde vaarwegen moeten twee marifoons
      aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.05
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 4.05.4
    text: |-
      Een varend groot schip moet op de marifoon uitluisteren. Het moet op de voor het schip--schip verkeer dan wel voor
      de nautische informatie aangewezen kanalen de voor de veiligheid van de scheepvaart noodzakelijke berichten geven.
      Op de in [bijlage 9][ref1] vermelde vaarwegen moet het groot schip op de kanalen voor het schip--schip verkeer
      en voor de nautische informatie gelijktijdig uitluisteren. Het schip--schip kanaal is kanaal 10, tenzij een ander
      kanaal als blokkanaal is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.05
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 4.05.5
    text: |-
      Voor een duwstel en voor een gekoppeld samenstel zijn het derde en vierde lid slechts van toepassing op het schip
      aan boord waarvan zich de schipper van het samenstel bevindt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.05
  - number: 4.05.6
    text: |-
      De bevoegde autoriteit kan van de verplichting, bedoeld in het eerste en tweede lid, ontheffing verlenen aan
      schepen die worden ingezet ten behoeve van het redden van mensen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.05
  - number: 4.05.7
    text: |-
      De bevoegde autoriteit kan van de verplichting, bedoeld in het derde en vierde lid, ontheffing verlenen, voorzover
      dit de vaart betreft in gebieden waar geen doorgaande scheepvaart plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.05
  - number: 4.05.8
    text: |-
      Het vierde lid, eerste en tweede volzin, is van toepassing op een klein schip dat is uitgerust met een marifoon.
      Het vierde lid, derde volzin, is van toepassing op een klein schip dat is uitgerust met meer dan één marifoon.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.05
  - number: 4.05.9
    text: |-
      In afwijking van het eerste lid, wordt op scheepvaartwegen in beheer bij het Rijk bij communicatieproblemen
      tussen scheeps- en walstations dan wel tussen scheepsstations onderling de Duitse taal gebruikt. Op de in
      [bijlage 11][ref1] genoemde vaarwegen is tevens het gebruik van de Engelse taal toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.05
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 4.06.1
    text: 'Een schip mag slechts gebruik maken van radar, indien:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.06
  - number: 4.06.1.a
    text: |-
      het is uitgerust met een voor de behoeften van de binnenvaart geschikte radarinstallatie dan wel een Inland ECDIS
      installatie die kan functioneren in de navigatie modus en een bochtaanwijzer die goed functioneren en die van
      een type zijn dat voor de binnenvaart door de daartoe aangewezen instantie is goedgekeurd volgens de daaromtrent
      vastgestelde voorschriften; en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.06
  - number: 4.06.1.b
    text: |-
      zich aan boord een persoon bevindt die houder is van een radarpatent als bedoeld in het
      [Reglement betreffende het scheepvaartpersoneel op de Rijn][ref1] of een specifieke vergunning voor het varen
      met behulp van een radar zoals bedoeld in het Reglement betreffende het scheepvaartpersoneel op de Rijn of de
      [Binnenvaartregeling][ref2]. Bij goed zicht mag van radar worden gebruik gemaakt teneinde hiermede te oefenen,
      zonder dat zich een zodanig persoon aan boord bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.06
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0025958
  - number: 4.06.2
    text: |-
      Onverminderd het eerste lid moet een klein schip zijn uitgerust met een marifooninstallatie die geschikt is voor de
      daartoe aangewezen kanalen en die goed functioneert.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.06
  - number: 4.06.3
    text: |-
      Op de daartoe aangewezen vaarwegen mag een schip, in plaats van met een radarinstallatie als bedoeld in het
      eerste lid, onder a, zijn uitgerust met een voor het varen op deze vaarwegen geschikte radarinstallatie die
      goed functioneert en die van een type is dat voor het varen op die vaarwegen door de in het eerste lid, onder a,
      bedoelde instantie is goedgekeurd volgens de daaromtrent vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.06
  - number: 4.06.4
    text: |-
      Een schip behorende tot een daartoe aangewezen categorie mag op de daartoe aangewezen vaarwegen in plaats van met
      een bochtaanwijzer als bedoeld in het eerste lid, onder a, zijn uitgerust met een ander daartoe bruikbaar middel.
      Een niet-vrijvarende veerpont behoeft daarmede niet te zijn uitgerust.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.06
  - number: 4.06.5
    text: De bevoegde autoriteit kan van het eerste lid, onder b, voor een niet-vrijvarende veerpont ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.06
  - number: 4.06.6
    text: |-
      Voor een duwstel, voor een gekoppeld samenstel en voor een sleep is het eerste lid slechts van toepassing op het
      schip aan boord waarvan zich de schipper van het samenstel bevindt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.06
  - number: 4.06.7
    text: |-
      Een schip met een lengte van meer dan 110 m mag slechts varen, wanneer het is uitgerust met een radarinstallatie en
      een bochtaanwijzer die voldoen aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.06
  - number: 4.06.8
    text: Een snel schip moet tijdens de vaart gebruik maken van radar.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.06
  - number: 4.07.1
    text: |-
      Een schip dat vaart op een vaarweg van CEMT-klasse I of hoger, moet zijn uitgerust met een Inland AIS-apparaat als
      bedoeld in artikel 7.06, derde lid, van ES-TRIN. Het Inland AIS-apparaat moet goed functioneren. De eerste volzin
      is niet van toepassing op de volgende schepen:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.1.a
    text: |-
      schepen van duwstellen en gekoppelde samenstellen, met uitzondering van het schip dat hoofdzakelijk voor het
      voortbewegen zorgt;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.1.b
    text: 'kleine schepen, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.1.b.1
    text: schepen van de politie die met een radarapparaat zijn uitgerust, en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.1.b.2
    text: |-
      schepen die van een certificaat overeenkomstig het [Reglement onderzoek schepen op de Rijn 1995][ref1] of een
      krachtens dat reglement gelijkwaardig erkend certificaat zijn voorzien;


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 4.07.1.c
    text: duwbakken en drijvende werktuigen zonder eigen mechanische middelen tot voortbeweging.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.2
    text: |-
      Het Inland AIS-apparaat moet permanent ingeschakeld zijn en de ingevoerde gegevens moeten op ieder moment met de
      werkelijke gegevens van het schip of samenstel overeenkomen. De eerste volzin geldt niet,
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.2.a
    text: |-
      indien de bevoegde autoriteit een uitzondering voor wateren die bouwkundig van het vaarwater zijn gescheiden, heeft
      toegestaan;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.2.b
    text: |-
      voor schepen van de politie, ingeval het verzenden van AIS-gegevens het uitvoeren van politieopdrachten in gevaar
      kan brengen;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.2.c
    text: voor schepen die stilliggen langs een vaarweg van CEMT-klasse II of lager,
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.3
    text: |-
      Er moeten minstens de volgende gegevens overeenkomstig hoofdstuk 2 van de bijlage van Verordening (EG) nr. 415/2007
      van de Commissie van 13 maart 2007 inzake de technische specificaties voor tracking- en tracingsystemen voor
      schepen overeenkomstig artikel 5 van Richtlijn 2005/44/EG van het Europees Parlement en de Raad betreffende
      geharmoniseerde River Information Services (RIS) op de binnenwateren in de Gemeenschap (PbEU L 105) worden
      gezonden:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.3.a
    text: User Identifier (Maritime Mobile Service Identity, MMSI, Radio Call Sign);
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.3.b
    text: naam van het schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.3.c
    text: scheeps- of samensteltype;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.3.d
    text: |-
      Uniek Europees scheepsidentificatienummer (ENI) of, voor zeeschepen voor zover geen ENI werd toegekend, het IMO-
      nummer;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.3.e
    text: |-
      lengte over alles van het schip of het samenstel met een nauwkeurigheid van 0,1 m overeenkomstig [bijlage 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 4.07.3.f
    text: |-
      breedte over alles van het schip of het samenstel met een nauwkeurigheid van 0,1 m overeenkomstig
      [bijlage 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 4.07.3.g
    text: positie (WGS 84);
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.3.h
    text: snelheid over de grond;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.3.i
    text: koers over de grond;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.3.j
    text: tijd van de elektronische positiebepaling;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.3.k
    text: vaarstatus overeenkomstig bijlage 4;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.3.l
    text: |-
      referentiepunt voor de positie-informatie op het schip met de nauwkeurigheid van 1 m overeenkomstig
      [bijlage 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 4.07.4
    text: 'De schipper moet de volgende gegevens bij wijzigingen onmiddellijk actualiseren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.4.a
    text: |-
      lengte over alles van het schip of het samenstel met een nauwkeurigheid van 0,1 m overeenkomstig [bijlage 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 4.07.4.b
    text: |-
      breedte over alles van het schip of het samenstel met een nauwkeurigheid van 0,1 m overeenkomstig
      [bijlage 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 4.07.4.c
    text: samensteltype;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.4.d
    text: vaarstatus overeenkomstig bijlage 4;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.4.e
    text: |-
      referentiepunt voor de positie-informatie op het schip met een nauwkeurigheid van 1 m overeenkomstig
      [bijlage 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 4.07.5
    text: |-
      Een klein schip dat AIS gebruikt, mag uitsluitend een Inland AIS-apparaat als bedoeld in
      [artikel 7.06, derde lid, van ES-TRIN][ref1], een krachtens de IMO-voorschriften typegoedgekeurd AIS-apparaat van
      klasse A of een AIS-apparaat van klasse B gebruiken. AIS-apparatuur van klasse B moet aan de dienovereenkomstige
      eisen van Aanbeveling ITU-R.M 1371, aan [Richtlijn 2014/53/EU](32014L0053) van het Europees Parlement en de
      Raad van 16 april 2014 betreffende de harmonisatie van de wetgevingen van de lidstaten inzake het op de markt
      aanbieden van radioapparatuur en tot intrekking van [Richtlijn 1999/5/EG](31999L0005) (PbEU L 153) alsmede aan
      de internationale norm IEC 62287-1 of 2 (inclusief DSC kanaalmanagement) voldoen. Het AIS-apparaat moet goed
      functioneren en de in het AIS-apparaat ingevoerde gegevens moeten op ieder moment met de werkelijke gegevens van
      het schip of samenstel overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel7
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '7'
  - number: 4.07.6
    text: |-
      Een klein schip waaraan geen uniek Europees scheepsidentificatienummer is toegekend, hoeft de gegevens, bedoeld in
      het derde lid, onderdeel d, niet over te dragen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.7
    text: |-
      Een varend klein schip dat AIS gebruikt, moet bovendien zijn uitgerust met een marifooninstallatie voor het schip-
      schip verkeer die goed functioneert en voor ontvangst is ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.8
    text: |-
      Op de in bijlage 4 aangewezen vaarwegen mag een schip zijn uitgerust met een krachtens de IMO-voorschriften
      typegoedgekeurd AIS-apparaat van klasse A. Het AIS-apparaat van klasse A moet ingeschakeld zijn wanneer een schip
      niet is uitgerust met een Inland AIS-apparaat.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 4.07.9
    text: |-
      Ingeval een zeegaand schip is uitgerust met een Inland AIS-apparaat, is dit permanent ingeschakeld en zijn de leden
      1, 2, 3 en 4 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel4.07
  - number: 5.01.1
    text: |-
      Een schip is verplicht gevolg te geven aan een verkeersteken dat een verbod of een gebod bevat en rekening te
      houden met een verkeersteken dat een aanbeveling of een inlichting bevat dan wel dat dient ter markering van het
      vaarwater of van obstakels daarin.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel5.01
  - number: 5.01.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van een bekendmaking met dezelfde strekking als een
      verkeersteken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel5.01
  - number: 5.01.3
    text: Bijlage 7 vermeldt de verkeerstekens voor het verkeer op een vaarweg.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel5.01
  - number: 5.01.4
    text: Bijlage 8 vermeldt de verkeerstekens ter markering van het vaarwater of van obstakels.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel5.01
  - number: '5.02'
    text: |-
      Onverminderd de artikelen 1.04 en 1.05 heeft een verkeersteken prioriteit boven een gedragsregel. Een
      verkeersaanwijzing heeft prioriteit boven een gedragsregel en een verkeersteken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel5.02
  - number: 6.01.1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.01
  - number: 6.01.1.a
    text: |-
      naderen op tegengestelde koersen: elkaar naderen van twee schepen op koersen die recht of vrijwel recht aan elkaar
      tegengesteld zijn;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.01
  - number: 6.01.1.b
    text: |-
      oplopen: naderen door een schip van een ander schip uit een richting van meer dan 22°30´ achterlijker dan dwars van
      dat schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.01
  - number: 6.01.1.c
    text: 'voorbijlopen: manoeuvre die het gevolg is van oplopen totdat de schepen geheel vrij van elkaar zijn;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.01
  - number: 6.01.1.d
    text: |-
      kruisende koersen: elkaar naderen van twee schepen onder zodanige hoek, dat er geen sprake is van naderen
      op tegengestelde koers dan wel oplopen; in geval van twijfel wordt er geacht sprake te zijn van naderen op
      tegengestelde koersen dan wel oplopen;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.01
  - number: 6.01.1.e
    text: 'vertrekkend schip: schip dat gaat varen nadat het heeft stilgelegen of was vastgevaren;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.01
  - number: 6.01.1.f
    text: 'opvarend schip: schip dat vaart in de richting van de bronnen van de rivier;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.01
  - number: 6.01.1.g
    text: 'afvarend schip: schip dat vaart vanaf de richting van de bronnen van de rivier.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.01
  - number: 6.01.2
    text: |-
      In dit hoofdstuk worden onder een klein schip mede begrepen een sleep, een duwstel of een gekoppeld samenstel,
      uitsluitend uit kleine schepen bestaande, alsmede een amfibievoertuig ongeacht de afmetingen van dit voertuig en de
      wijze waarop dit voertuig wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.01
  - number: '6.02'
    text: Een snel schip is verplicht aan andere schepen voorrang te verlenen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.02
  - number: 6.03.1
    text: |-
      Schepen mogen slechts elkaar voorbijvaren op tegengestelde koersen dan wel elkaar voorbijlopen, indien het
      vaarwater voldoende ruimte biedt voor gelijktijdige doorvaart, de plaatselijke omstandigheden en de bewegingen van
      andere schepen daarbij in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.03
  - number: 6.03.2
    text: |-
      Bij een samenstel mogen de tekens, voorgeschreven bij de [artikelen 3.17][ref1], [6.04a][ref2] en [6.05][ref3],
      slechts worden getoond door het schip, aan boord waarvan zich de schipper van het samenstel bevindt, doch in ieder
      geval door het motorschip aan de kop van het samenstel.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003628#Artikel6
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.03
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '6'
        hoofdstuk: '6'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0003628
        artikel: '6'
        hoofdstuk: '6'
        afdeling: II
  - number: 6.03.3
    text: |-
      Bij naderen op tegengestelde koersen, bij voorbijlopen dan wel bij koers kruisen mag het schip waarvan de koers elk
      gevaar voor aanvaring uitsluit zijn koers noch zijn snelheid zodanig wijzigen, dat daaruit gevaar voor aanvaring
      kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.03
  - number: 6.03.4
    text: |-
      Wanneer een schip voorrang moet verlenen aan een ander schip, moet het door tijdige koerswijziging of door
      snelheidsverandering aan dat andere schip de ruimte laten die dit nodig heeft om zijn koers te volgen en te
      manoeuvreren. Het schip dat voorrang moet verlenen aan een ander schip moet daarbij vermijden dat het voor het
      andere schip overloopt en mag niet verlangen dat het andere schip te zijnen gerieve koers of snelheid wijzigt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.03
  - number: 6.03.5
    text: |-
      Wanneer een schip voorrang moet verlenen aan een ander schip, moet laatstbedoeld schip zijn koers en zijn snelheid
      behouden. Wanneer door welke oorzaak ook, het schip dat verplicht is zijn koers en zijn snelheid te behouden zich
      zo dicht bij het schip dat voorrang moet verlenen bevindt, dat aanvaring door een handeling van dat schip alleen
      niet kan worden vermeden, moet het de maatregelen nemen die het beste kunnen bijdragen om aanvaring te voorkomen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.03
  - number: 6.03.6
    text: |-
      Wanneer een schip bij het uitvoeren van een manoeuvre medewerking van een ander schip mag verlangen, moet het
      de eigen koers en snelheid zodanig regelen, dat andere schepen niet worden genoodzaakt hun koers of snelheid
      plotseling en in sterke mate te wijzigen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.03
  - number: 6.03.7
    text: |-
      Wanneer een schip bij het uitvoeren van een manoeuvre medewerking van een ander schip mag verlangen, moet het
      andere schip voorzover mogelijk door koerswijziging of snelheidsverandering zodanig meewerken, dat deze manoeuvre
      veilig kan geschieden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.03
  - number: 6.04.1
    text: |-
      Van de in dit artikel gegeven hoofdregels kan overeenkomstig [artikel 6.04a][ref1] worden afgeweken.
      Dit artikel is niet van toepassing op de gedeelten van de Geldersche IJssel en de Maas, bedoeld in
      [artikel 6.05, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel6
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '6'
        hoofdstuk: '6'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '6'
        hoofdstuk: '6'
        afdeling: II
  - number: 6.04.2
    text: |-
      Indien twee schepen elkaar zodanig naderen op tegengestelde koersen, dat gevaar voor aanvaring bestaat, moet het
      schip dat niet de stuurboordszijde van het vaarwater volgt voorrang verlenen aan het schip dat de stuurboordszijde
      van het vaarwater volgt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04
  - number: 6.04.3
    text: |-
      Indien een groot schip en een klein schip elkaar zodanig naderen op tegengestelde koersen, dat gevaar voor
      aanvaring bestaat, moet, ingeval geen der schepen de stuurboordszijde van het vaarwater volgt, het kleine schip
      voorrang verlenen aan het grote schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04
  - number: 6.04.4
    text: |-
      Indien twee grote motorschepen of een groot motorschip en een groot zeilschip elkaar zodanig naderen op
      tegengestelde koersen, dat gevaar voor aanvaring bestaat, moet, ingeval geen der schepen de stuurboordszijde van
      het vaarwater volgt, elk van beide naar stuurboord uitwijken, zodat zij elkaar bakboord op bakboord voorbijvaren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04
  - number: 6.04.5
    text: |-
      Indien twee grote zeilschepen elkaar zodanig naderen op tegengestelde koersen, dat gevaar voor aanvaring bestaat,
      moet, ingeval geen der schepen de stuurboordszijde van het vaarwater volgt, het schip dat over stuurboordsboeg ligt
      voorrang verlenen aan het schip dat over bakboordsboeg ligt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04
  - number: 6.04.6
    text: |-
      Indien twee kleine zeilschepen elkaar zodanig naderen op tegengestelde koersen, dat gevaar voor aanvaring bestaat,
      moet, ingeval geen der schepen de stuurboordszijde van het vaarwater volgt, het schip dat over stuurboordsboeg ligt
      voorrang verlenen aan het schip dat over bakboordsboeg ligt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04
  - number: 6.04.7
    text: |-
      Indien twee kleine motorschepen elkaar zodanig naderen op tegengestelde koersen, dat gevaar voor aanvaring
      bestaat, moet, ingeval geen der schepen de stuurboordszijde van het vaarwater volgt, elk van beide naar stuurboord
      uitwijken, zodat zij elkaar bakboord op bakboord voorbijvaren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04
  - number: 6.04.8
    text: |-
      Indien een klein motorschip, een klein zeilschip of een klein door spierkracht voortbewogen schip elkaar
      zodanig naderen op tegengestelde koersen, dat gevaar voor aanvaring bestaat, moet, ingeval geen der schepen de
      stuurboordszijde van het vaarwater volgt, het motorschip voorrang verlenen aan het andere schip en moet het door
      spierkracht voortbewogen schip voorrang verlenen aan het zeilschip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04
  - number: 6.04.9
    text: |-
      Indien twee door spierkracht voortbewogen schepen elkaar zodanig naderen op tegengestelde koersen, dat gevaar voor
      aanvaring bestaat, moet, ingeval geen der schepen de stuurboordszijde van het vaarwater volgt, elk van beide naar
      stuurboord uitwijken, zodat zij elkaar bakboord op bakboord voorbijvaren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04
  - number: 6.04a.1
    text: |-
      Dit artikel is niet van toepassing op de gedeelten van de Geldersche IJssel en de Maas, bedoeld in
      [artikel 6.05, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel6
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04a
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '6'
        hoofdstuk: '6'
        afdeling: II
  - number: 6.04a.2
    text: |-
      Een groot schip dat zich wil begeven naar een vaarwater, een haven, een laad- of losplaats, een sluis,
      de doorvaartopening van een brug, een aanlegplaats of een plaats waar schepen mogen liggen, gelegen aan
      zijn bakboordszijde, en een groot schip dat vertrekt vanaf een ligplaats aan de, gezien zijn vaarrichting,
      bakboordszijde van het vaarwater, mag aan een op tegengestelde koers naderend schip het verlangen kenbaar maken,
      dat, in afwijking van [artikel 6.04][ref1], het voorbijvaren stuurboord op stuurboord geschiedt. Het grote schip
      mag het verlangen slechts kenbaar maken, nadat het zich er van heeft vergewist, dat het mogelijk is daaraan zonder
      gevaar te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel6
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04a
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '6'
        hoofdstuk: '6'
        afdeling: II
  - number: 6.04a.3
    text: |-
      Het verlangen wordt kenbaar gemaakt door het tijdig tonen aan stuurboord tot het voorbijvaren heeft plaats gehad,
      van:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04a
  - number: 6.04a.3.a
    text: '’s nachts: een wit helder rondom schijnend flikkerlicht, eventueel in combinatie met een lichtblauw bord;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04a
  - number: 6.04a.3.b
    text: 'overdag: een lichtblauw bord, in combinatie met een wit helder rondom schijnend flikkerlicht.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04a
  - number: 6.04a.4
    text: |-
      Een groot schip waaraan het verlangen wordt kenbaar gemaakt moet daaraan voldoen en, indien het hiermede is
      uitgerust, de tekens tonen, bedoeld in het derde lid. Een klein schip waaraan het verlangen wordt kenbaar gemaakt
      moet voorrang verlenen aan het grote schip, bij voorkeur door aan het verlangen te voldoen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04a
  - number: 6.04a.5
    text: |-
      Zodra is te vrezen, dat de bedoeling van het schip dat het verlangen heeft kenbaar gemaakt niet is begrepen door
      het schip waaraan dit is geschied, moet het schip een geluidssein van twee korte stoten geven. Het andere schip
      moet dan antwoorden door het geven van een geluidssein van twee korte stoten.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04a
  - number: 6.04a.6
    text: |-
      Indien het schip waaraan het verlangen wordt kenbaar gemaakt daaraan niet kan voldoen, moet het een reeks zeer
      korte stoten geven. Elk van beide schepen moet dan de maatregelen nemen die de omstandigheden vereisen om het
      ontstaan van een gevaarlijke situatie te voorkomen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.04a
  - number: 6.05.1
    text: |-
      Dit artikel is slechts van toepassing op de Geldersche IJssel vanaf de IJsselkop (kmr. 878,6) tot aan de stadsbrug
      te Kampen (kmr. 995,5) en op de Maas met aansluitend de Bergsche Maas tot Heusden (kmr. 231). Het is niet van
      toepassing op het naderen op tegengestelde koersen van een snel schip en een ander schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.2
    text: |-
      Indien een opvarend groot schip en een afvarend schip elkaar naderen op tegengestelde koersen, moet het opvarende
      grote schip voor het afvarende schip een geschikte weg vrijlaten, de plaatselijke omstandigheden en de bewegingen
      van andere schepen daarbij in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.3
    text: Het opvarende grote schip dat daartoe aan bakboord voor het afvarende schip de weg vrijlaat toont geen teken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.4
    text: |-
      Het opvarende grote schip dat daartoe aan stuurboord voor het afvarende schip de weg vrijlaat moet tijdig aan
      stuurboord tot het voorbijvaren heeft plaats gehad, tonen:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.4.a
    text: '’s nachts: een wit helder rondom schijnend flikkerlicht, eventueel in combinatie met een lichtblauw bord;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.4.b
    text: 'overdag: een lichtblauw bord, in combinatie met een wit helder rondom schijnend flikkerlicht.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.5
    text: |-
      Zodra is te vrezen, dat de bedoeling van het opvarende grote schip niet door het afvarende schip is begrepen, moet
      het opvarende grote schip geven:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.5.a
    text: één korte stoot, indien het voorbijvaren bakboord op bakboord dient te geschieden; of
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.5.b
    text: twee korte stoten, indien het voorbijvaren stuurboord op stuurboord dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.6
    text: |-
      Een afvarend groot schip moet voorbijvaren aan de zijde die het opvarende grote schip vrijlaat. Het afvarende grote
      schip moet daartoe de tekens en het geluidssein die het opvarende grote schip toont of geeft herhalen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.7
    text: |-
      Een afvarend klein schip moet voorrang verlenen aan het opvarende grote schip, bij voorkeur door voorbij te varen
      aan de zijde die het opvarende grote schip vrijlaat.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.8
    text: Een opvarend klein schip moet voorrang verlenen aan een afvarend groot schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.9
    text: |-
      Indien twee kleine schepen elkaar zodanig naderen op tegengestelde koersen, dat gevaar voor aanvaring bestaat,
      moet het schip dat niet de stuurboordszijde van het vaarwater volgt voorrang verlenen aan het schip dat de
      stuurboordszijde van het vaarwater volgt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.10
    text: |-
      Indien twee kleine zeilschepen elkaar zodanig naderen op tegengestelde koersen, dat gevaar voor aanvaring bestaat,
      moet, ingeval geen der schepen de stuurboordszijde van het vaarwater volgt, het schip dat over stuurboordsboeg ligt
      voorrang verlenen aan het schip dat over bakboordsboeg ligt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.11
    text: |-
      Indien twee kleine motorschepen elkaar zodanig naderen op tegengestelde koersen, dat gevaar voor aanvaring
      bestaat, moet, ingeval geen der schepen de stuurboordszijde van het vaarwater volgt, elk van beide naar stuurboord
      uitwijken, zodat zij elkaar bakboord op bakboord voorbijvaren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.12
    text: |-
      Indien een klein motorschip, een klein zeilschip of een klein door spierkracht voortbewogen schip elkaar
      zodanig naderen op tegengestelde koersen, dat gevaar voor aanvaring bestaat, moet, ingeval geen der schepen de
      stuurboordszijde van het vaarwater volgt, het motorschip voorrang verlenen aan het andere schip en moet het door
      spierkracht voortbewogen schip voorrang verlenen aan het zeilschip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: 6.05.13
    text: |-
      Indien twee door spierkracht voortbewogen schepen elkaar zodanig naderen op tegengestelde koersen, dat gevaar voor
      aanvaring bestaat, moet, ingeval geen der schepen de stuurboordszijde van het vaarwater volgt, elk van beide naar
      stuurboord uitwijken, zodat zij elkaar bakboord op bakboord voorbijvaren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.05
  - number: '6.06'
    text: (niet overgenomen).
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.06
  - number: 6.07.1
    text: |-
      In dit artikel wordt onder een engte verstaan een vak van of een plaats in de vaarweg waar het vaarwater niet
      voldoende ruimte biedt voor het elkaar voorbijvaren van twee schepen of twee samenstellen onderling. Een door
      het teken A.4 of A.4.1 ([bijlage 7][ref1]) aangeduid vak van of plaats in de vaarweg en de doorvaartopening van
      een brug in geopende stand en een sluis of een stuw die aan beide zijden open staat en waarvoor twee groene vaste
      lichten boven elkaar worden getoond overeenkomstig het teken E.1 ([bijlage 7][ref2]), zijn een engte.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
      [ref2]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
    references:
      - id: ref1
        bwb_id: BWBR0003628
      - id: ref2
        bwb_id: BWBR0003628
  - number: 6.07.2
    text: |-
      Het vijfde, zesde, zevende en achtste lid van dit artikel gelden niet voor engten waar de doorvaart door middel van
      tekens wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.3
    text: Een schip moet een engte zonder onnodig oponthoud doorvaren, met dien verstande dat voorbijlopen verboden is.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.4
    text: |-
      Indien het uitzicht niet vrij is, moet een schip, alvorens een engte binnen te varen, één lange stoot geven. Zo
      nodig, in het bijzonder wanneer de engte lang is, moet het dit sein tijdens het doorvaren herhalen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.5
    text: |-
      Bij het doorvaren van een engte moet op een vaarweg waar stroom loopt een tegen stroom varend schip voorrang
      verlenen aan een voor stroom varend schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.6
    text: |-
      Bij het doorvaren van een engte moet op een vaarweg waar geen stroom loopt een klein schip voorrang verlenen aan
      een op tegengestelde koers naderend groot schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.7
    text: 'Bij het doorvaren van een engte moet op een vaarweg waar geen stroom loopt:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.7.a
    text: |-
      een groot motorschip dat aan stuurboord een hindernis tegenkomt of dat bij een bocht de binnenbocht aan stuurboord
      heeft voorrang verlenen aan een op tegengestelde koers naderend groot schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.7.b
    text: |-
      een groot motorschip voorrang verlenen aan een op tegengestelde koers naderend groot zeilschip dat de engte bezeild
      heeft;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.7.c
    text: |-
      een groot zeilschip dat de engte niet bezeild heeft voorrang verlenen aan een op tegengestelde koers naderend groot
      schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.7.d
    text: |-
      een groot zeilschip dat over stuurboordsboeg zeilt en de engte bezeild heeft voorrang verlenen aan een op
      tegengestelde koers naderend groot zeilschip dat over bakboordsboeg zeilt en dat de engte eveneens bezeild heeft.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.8
    text: 'Bij het doorvaren van een engte moet op een vaarweg waar geen stroom loopt:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.8.a
    text: |-
      een klein motorschip dat aan stuurboord een hindernis tegenkomt of dat bij een bocht de binnenbocht aan stuurboord
      heeft voorrang verlenen aan een op tegengestelde koers naderend ander klein motorschip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.8.b
    text: |-
      een klein door spierkracht voortbewogen schip dat aan stuurboord een hindernis tegenkomt of dat bij een bocht
      de binnenbocht aan stuurboord heeft voorrang verlenen aan een op tegengestelde koers naderend ander klein door
      spierkracht voortbewogen schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.8.c
    text: |-
      een klein motorschip of een klein door spierkracht voortbewogen schip voorrang verlenen aan een op tegengestelde
      koers naderend klein zeilschip dat de engte heeft bezeild;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.8.d
    text: |-
      een klein motorschip voorrang verlenen aan een op tegengestelde koers naderend klein door spierkracht voortbewogen
      schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.8.e
    text: |-
      een klein zeilschip dat de engte niet bezeild heeft voorrang verlenen aan een op tegengestelde koers naderend klein
      schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: 6.07.8.f
    text: |-
      een klein zeilschip dat over stuurboordsboeg zeilt en de engte bezeild heeft voorrang verlenen aan een op
      tegengestelde koers naderend klein zeilschip dat over bakboordsboeg zeilt en dat de engte eveneens bezeild heeft.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.07
  - number: '6.08'
    text: |-
      Indien de bevoegde autoriteit in een bepaald vak of op een bepaalde plaats, teneinde naderen op tegengestelde
      koersen te voorkomen, de scheepvaart afwisselend slechts in één richting toelaat, wordt:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.08
  - number: 6.08.a
    text: |-
      het verbod de vaart te vervolgen aangeduid door een teken A.1 ([bijlage 7][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.08
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.08.b
    text: |-
      de toestemming de vaart te vervolgen aangeduid door een teken E.1 ([bijlage 7][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.08
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.09.1
    text: |-
      Een schip mag een ander schip slechts voorbijlopen, nadat het zich er van heeft vergewist, dat dit zonder gevaar
      kan geschieden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.09
  - number: 6.09.2
    text: |-
      Een groot schip dat wordt opgelopen door een groot schip en elk klein schip dat wordt opgelopen moet het
      voorbijlopen, voorzover nodig en mogelijk, vergemakkelijken. Het moet snelheid verminderen, indien dit nodig is
      om het voorbijlopen zonder gevaar en in zo korte tijd te doen geschieden, dat de andere scheepvaart daardoor niet
      wordt gehinderd.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.09
  - number: 6.10.1
    text: |-
      In beginsel moet de oploper aan bakboord van de opgelopene voorbijlopen. Indien daartoe ruimte is, mag echter de
      oploper aan stuurboord van de opgelopene voorbijlopen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.10
  - number: 6.10.2
    text: |-
      Indien een groot zeilschip een ander groot zeilschip oploopt en indien een klein zeilschip een ander zeilschip
      oploopt, moet het, zo mogelijk, aan loef voorbijlopen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.10
  - number: 6.10.3
    text: |-
      Een groot schip dat door een groot zeilschip wordt opgelopen en een klein schip dat door een zeilschip wordt
      opgelopen moet, zo mogelijk, ertoe medewerken, dat dit aan loef kan voorbijlopen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.10
  - number: '6.11'
    text: 'Een schip mag een ander schip niet voorbijlopen:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.11
  - number: 6.11.a
    text: |-
      in een vak van of op een plaats in de vaarweg, aangeduid door het teken A.2 ([bijlage 7][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.11.b
    text: |-
      in het geval van samenstellen onderling, in een vak van of op een plaats in de vaarweg, aangeduid door het teken
      A.3 ([bijlage 7][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.11.c
    text: |-
      in een vak van of op een plaats in de vaarweg, aangeduid door het teken A.4 of A. 4.1 ([bijlage 7][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: '6.12'
    text: |-
      In een vak van of op een plaats in de vaarweg, aangeduid door één der tekens B.1, B.2, B.3 of B.4 (bijlage 7), moet
      een schip de weg volgen die door dat teken wordt kenbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.12
  - number: 6.13.1
    text: Een schip mag slechts keren, nadat het zich er van heeft vergewist dat dit zonder gevaar kan geschieden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.13
  - number: 6.13.2
    text: Een groot schip mag bij het keren medewerking verlangen van een ander schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.13
  - number: 6.13.3
    text: Een klein schip moet bij het keren voorrang verlenen aan een groot schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.13
  - number: 6.13.4
    text: Een klein schip mag bij het keren medewerking verlangen van een ander klein schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.13
  - number: 6.13.5
    text: Dit artikel is niet van toepassing op en ten aanzien van een veerpont.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.13
  - number: 6.13.6
    text: |-
      In een vak van of op een plaats in de vaarweg, aangeduid door het teken A.8 ([bijlage 7][ref1]), mag een schip
      niet keren.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.13.7
    text: |-
      Aanduiding van een vak van of een plaats in de vaarweg door het teken E.8 ([bijlage 7][ref1]) vormt een inlichting,
      dat schepen aldaar kunnen keren.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.14.1
    text: Een schip mag slechts vertrekken, nadat het zich er van heeft vergewist dat dit zonder gevaar kan geschieden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.14
  - number: 6.14.2
    text: Een groot schip mag bij het vertrekken medewerking verlangen van een ander schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.14
  - number: 6.14.3
    text: Een klein schip moet bij het vertrekken voorrang verlenen aan een groot schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.14
  - number: 6.14.4
    text: Een klein schip mag bij het vertrekken medewerking verlangen van een ander klein schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.14
  - number: 6.14.5
    text: Dit artikel is niet van toepassing op en ten aanzien van een veerpont.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.14
  - number: '6.15'
    text: Een schip mag zich niet in de tussenruimten tussen de lengten van een sleep begeven.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.15
  - number: 6.16.1
    text: |-
      Een schip mag slechts een haven of een nevenvaarwater uitvaren en daarbij een hoofdvaarwater invaren of oversteken
      dan wel een haven of een nevenvaarwater invaren, nadat het zich er van heeft vergewist dat dit zonder gevaar kan
      geschieden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.16
  - number: 6.16.2
    text: |-
      Een groot schip mag bij het uitvaren van een haven of een nevenvaarwater en het daarbij invaren of oversteken van
      een hoofdvaarwater dan wel bij het invaren van een haven of een nevenvaarwater medewerking verlangen van een ander
      schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.16
  - number: 6.16.3
    text: |-
      Een klein schip moet bij het uitvaren van een haven of een nevenvaarwater en het daarbij invaren of oversteken
      van een hoofdvaarwater dan wel bij het invaren van een haven of een nevenvaarwater voorrang verlenen aan een groot
      schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.16
  - number: 6.16.4
    text: |-
      Een klein schip mag bij het uitvaren van een haven of een nevenvaarwater en het daarbij invaren of oversteken van
      een hoofdvaarwater dan wel bij het invaren van een haven of een nevenvaarwater medewerking verlangen van een klein
      schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.16
  - number: 6.16.5
    text: |-
      In afwijking van het tweede, derde en vierde lid moet een schip dat een lateraal gemarkeerd hoofdvaarwater
      binnenvaart, anders dan vanuit een daarop uitmondend lateraal gemarkeerd nevenvaarwater, voorrang verlenen aan een
      schip dat in dat hoofdvaarwater langs de laterale markering de stuurboordszijde volgt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.16
  - number: 6.16.6
    text: |-
      Een groot schip dat tegen stroom varend een haven of nevenvaarwater wil invaren moet voorrang verlenen aan een
      groot schip dat voor stroom varend zonder op te draaien diezelfde haven of datzelfde nevenvaarwater in wil varen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.16
  - number: 6.16.7
    text: |-
      Een klein schip dat tegen stroom varend een haven of nevenvaarwater wil invaren moet voorrang verlenen aan een
      schip dat voor stroom varend zonder op te draaien diezelfde haven of datzelfde nevenvaarwater in wil varen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.16
  - number: 6.16.8
    text: |-
      In afwijking van het eerste tot en met zevende lid moet, ingeval langs een haven of een nevenvaarwater voor de
      uitmonding daarvan in het hoofdvaarwater een teken B.9 ([bijlage 7][ref1]) wordt getoond, een schip dat uit deze
      haven of dit nevenvaarwater komt voorrang verlenen aan een schip op het hoofdvaarwater.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.16
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.16.9.a
    text: |-
      Een schip op een hoofdvaarwater mag een haven of een nevenvaarwater niet invaren, indien langs dit hoofdvaarwater
      voor de uitmonding van die haven of dat nevenvaarwater een of twee rode lichten overeenkomstig het teken A.1
      ([bijlage 7][ref1]) in combinatie met een bijkomend teken F.2 onder b ([bijlage 7][ref2]) worden getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
      [ref2]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.16
    references:
      - id: ref1
        bwb_id: BWBR0003628
      - id: ref2
        bwb_id: BWBR0003628
  - number: 6.16.9.b
    text: |-
      Een schip mag een haven of een nevenvaarwater niet uitvaren, indien langs deze haven of dit nevenvaarwater voor de
      uitmonding daarvan in het hoofdvaarwater de onder a genoemde tekens worden getoond.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.16
  - number: 6.16.10.a
    text: |-
      Een schip op een hoofdvaarwater mag een haven of een nevenvaarwater invaren, indien langs dit hoofdvaarwater
      voor de uitmonding van die haven of dat nevenvaarwater een of twee groene lichten overeenkomstig het teken E.1
      ([bijlage 7][ref1]) in combinatie met een bijkomend teken F.2 onder b ([bijlage 7][ref2]) worden getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
      [ref2]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.16
    references:
      - id: ref1
        bwb_id: BWBR0003628
      - id: ref2
        bwb_id: BWBR0003628
  - number: 6.16.10.b
    text: |-
      Een schip mag een haven of een nevenvaarwater uitvaren, indien langs deze haven of dit nevenvaarwater voor de
      uitmonding daarvan in het hoofdvaarwater de onder a genoemde tekens worden getoond.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.16
  - number: 6.16.11
    text: Dit artikel is niet van toepassing op en ten aanzien van een veerpont.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.16
  - number: 6.17.1
    text: 'Dit artikel is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.1.a
    text: |-
      kruisende koersen die ontstaan ingeval van keren, vertrekken of bij een samenkomst van een hoofdvaarwater en een
      nevenvaarwater; en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.1.b
    text: kruisende koersen die ontstaan tussen een veerpont en een ander schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.2
    text: |-
      Indien de koersen van twee schepen elkaar zodanig kruisen, dat gevaar voor aanvaring bestaat, moet het schip dat
      niet de stuurboordszijde van het vaarwater volgt voorrang verlenen aan het schip dat de stuurboordszijde van het
      vaarwater volgt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.3
    text: |-
      Indien de koersen van een groot schip en een klein schip elkaar zodanig kruisen, dat gevaar voor aanvaring bestaat,
      moet, ingeval geen der schepen de stuurboordszijde van het vaarwater volgt, het kleine schip voorrang verlenen aan
      het grote schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.4
    text: |-
      Indien de koersen van twee grote motorschepen of een groot motorschip en een groot zeilschip elkaar zodanig
      kruisen, dat gevaar voor aanvaring bestaat, moet, ingeval geen der schepen de stuurboordszijde van het vaarwater
      volgt, het schip dat van bakboord nadert voorrang verlenen aan het schip dat van stuurboord nadert.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.5
    text: 'Indien de koersen van twee grote zeilschepen:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.5.a
    text: |-
      die over verschillende boeg zeilen, elkaar zodanig kruisen, dat gevaar voor aanvaring bestaat, moet, ingeval geen
      der schepen de stuurboordszijde van het vaarwater volgt, het schip dat over stuurboordsboeg ligt voorrang verlenen
      aan het schip dat over bakboordsboeg ligt;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.5.b
    text: |-
      die over dezelfde boeg zeilen, elkaar zodanig kruisen, dat gevaar voor aanvaring bestaat, moet, ingeval geen der
      schepen de stuurboordszijde van het vaarwater volgt, het loefwaartse schip voorrang verlenen aan het lijwaartse
      schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.5.c
    text: |-
      elkaar zodanig kruisen, dat gevaar voor aanvaring bestaat, moet, ingeval geen der schepen de stuurboordszijde van
      het vaarwater volgt, het lijwaartse schip dat over stuurboordsboeg zeilt en niet met zekerheid kan bepalen of het
      loefwaartse schip over stuurboords- dan wel over bakboordsboeg zeilt, voorrang verlenen aan het loefwaartse schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.6
    text: 'Indien de koersen van twee kleine zeilschepen:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.6.a
    text: |-
      die over verschillende boeg zeilen, elkaar zodanig kruisen, dat gevaar voor aanvaring bestaat, moet, ingeval geen
      der schepen de stuurboordszijde van het vaarwater volgt, het schip dat over stuurboordsboeg ligt voorrang verlenen
      aan het schip dat over bakboordsboeg ligt;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.6.b
    text: |-
      die over dezelfde boeg zeilen, elkaar zodanig kruisen, dat gevaar voor aanvaring bestaat, moet, ingeval geen der
      schepen de stuurboordszijde van het vaarwater volgt, het loefwaartse schip voorrang verlenen aan het lijwaartse
      schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.6.c
    text: |-
      elkaar zodanig kruisen, dat gevaar voor aanvaring bestaat, moet, ingeval geen der schepen de stuurboordszijde van
      het vaarwater volgt, het lijwaartse schip dat over stuurboordsboeg zeilt en niet met zekerheid kan bepalen of het
      loefwaartse schip over stuurboords- dan wel over bakboordsboeg zeilt, voorrang verlenen aan het loefwaartse schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.7
    text: |-
      Indien de koersen van twee kleine motorschepen elkaar zodanig kruisen, dat gevaar voor aanvaring bestaat, moet,
      ingeval geen der schepen de stuurboordszijde van het vaarwater volgt, het schip dat van bakboord nadert voorrang
      verlenen aan het schip dat van stuurboord nadert.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.8
    text: |-
      Indien de koersen van twee door spierkracht voortbewogen schepen elkaar zodanig kruisen, dat gevaar voor aanvaring
      bestaat, moet, ingeval geen der schepen de stuurboordszijde van het vaarwater volgt, het schip dat van bakboord
      nadert voorrang verlenen aan het schip dat van stuurboord nadert.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.17.9
    text: |-
      Indien de koersen van een klein motorschip, een klein zeilschip of een klein door spierkracht voortbewogen schip
      elkaar zodanig kruisen, dat gevaar voor aanvaring bestaat, moet, ingeval geen der schepen de stuurboordszijde
      van het vaarwater volgt, het motorschip voorrang verlenen aan het andere schip en moet het door spierkracht
      voortbewogen schip voorrang verlenen aan het zeilschip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.17
  - number: 6.18.1
    text: |-
      Een schip mag slechts met een ander schip op gelijke hoogte varen, indien de beschikbare ruimte dit zonder hinder
      of gevaar voor de scheepvaart toelaat.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.18
  - number: 6.18.2
    text: |-
      Behalve bij voorbijlopen en bij voorbijvaren op tegengestelde koersen, mag een schip niet varen binnen
      een afstand van 50 m van een schip, een duwstel of een gekoppeld samenstel dat de tekens, bedoeld in
      [artikel 3.14, tweede en derde lid][ref1], voert.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 6.18.3
    text: |-
      Een schip moet een mijnenopruimingsschip dat de tekens voert, bedoeld in [artikel 3.35][ref1], zo mogelijk niet
      dichter naderen dan op een afstand van 1000 m.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: IV
  - number: 6.18.4
    text: |-
      Een schip mag niet langszij komen van een varend schip of een varend drijvend voorwerp, daaraan vastmaken of zich
      in het kielzog daarvan laten meevoeren zonder uitdrukkelijke toestemming van de schipper daarvan. Dit geldt niet
      voor een schip van ambtenaren belast met toezicht of opsporing.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.18
  - number: 6.18.5
    text: |-
      Een schip mag niet een anker, een kabel of een ketting laten slepen. Dit verbod geldt niet voor een schip dat zich
      verplaatst op een ligplaats of dat een manoeuvre uitvoert, tenzij dit geschiedt op een afstand van minder dan 100
      m van een brug, een sluis, een stuw, een veerpont of een drijvend werktuig in bedrijf dan wel in een vak van of
      op een plaats in de vaarweg, aangeduid overeenkomstig [artikel 7.03, eerste lid, onder b][ref1], door het teken
      A.6 ([bijlage 7][ref2]).


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0003628
  - number: 6.18.6
    text: |-
      Een schip mag zich niet met de stroom laten meedrijven, zonder dat het van een middel tot voortbeweging gebruikt
      maakt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.18
  - number: 6.19.1
    text: |-
      Een schip dat het in [artikel 4.04][ref1] bedoelde sein hoort moet alle maatregelen nemen die dienstig zijn om
      gevaar te vermijden. In het bijzonder moet het:


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel4
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.19
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '4'
        hoofdstuk: '4'
  - number: 6.19.1.a
    text: |-
      indien het een koers in de richting van het gevaarsgebied voorligt, zich zover mogelijk hiervan verwijderd houden
      en zo nodig keren;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.19
  - number: 6.19.1.b
    text: indien het het gevaarsgebied reeds is gepasseerd, zijn weg met een zo groot mogelijke snelheid vervolgen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.19
  - number: 6.19.2
    text: |-
      De schipper van een schip als bedoeld in het eerste lid moet onmiddellijk zorg dragen, dat aan boord alle ramen en
      andere openingen die in verbinding staan met de buitenlucht worden gesloten, dat een onbeschermd licht en open vuur
      worden gedoofd, dat niet meer wordt gerookt, dat hulpmotoren die niet noodzakelijkerwijs in bedrijf zijn worden
      afgezet en dat in zijn algemeenheid het veroorzaken van vonken wordt vermeden. Ingeval het schip ligplaats gaat
      nemen, moet de schipper zorg dragen, dat de motoren en de hulpmotoren die nog in werking zijn worden afgezet.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.19
  - number: 6.19.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing op een schip, dat in de nabijheid van het gevaarsgebied stilligt
      en dat het sein hoort. Zo nodig moet de schipper zorg dragen, dat het schip wordt verlaten.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.19
  - number: 6.19.4
    text: Bij de toepassing van dit artikel dient rekening te worden gehouden met de stroom en de windrichting.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.19
  - number: 6.19.5
    text: Dit artikel is eveneens van toepassing, indien het sein niet door een schip maar vanaf de wal wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.19
  - number: 6.19.6
    text: |-
      De schipper die het sein hoort moet, voorzover mogelijk, onverwijld de dichtstbijzijnde bevoegde autoriteit
      inlichten.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.19
  - number: 6.20.1
    text: |-
      Een schip moet zijn snelheid zodanig regelen, dat hinderlijke waterbeweging waardoor schade aan een varend of
      een stilliggend schip of drijvend voorwerp of aan een werk zou kunnen worden veroorzaakt wordt vermeden. Het moet
      daartoe tijdig zijn snelheid verminderen, echter niet beneden de snelheid die nodig is voor veilig sturen:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.20
  - number: 6.20.1.a
    text: voor een havenmond;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.20
  - number: 6.20.1.b
    text: |-
      in de nabijheid van een schip dat gemeerd is aan de oever of aan een ontschepingsplaats dan wel dat wordt geladen
      of gelost;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.20
  - number: 6.20.1.c
    text: in de nabijheid van een schip dat op een gebruikelijke ligplaats stilligt;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.20
  - number: 6.20.1.d
    text: in de nabijheid van een veerpont die dienst doet;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.20
  - number: 6.20.1.e
    text: |-
      in een vak van of op een plaats in de vaarweg, aangeduid door het teken A.9 ([bijlage 7][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.20
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.20.2
    text: |-
      Een schip moet bij het voorbijvaren van een schip, een drijvend voorwerp of een drijvende inrichting, voerende
      de tekens bedoeld in [artikel 3.29][ref1] of [artikel 3.38][ref2], tijdig zijn snelheid verminderen, zoals bij de
      tweede volzin van het eerste lid wordt bepaald. Het moet voorts zover mogelijk daarvan verwijderd blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.20
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: IV
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: IV
  - number: 6.20.3
    text: |-
      Een schip moet bij het voorbijvaren van een schip als bedoeld in [artikel 3.25][ref1] aan de zijde waar de tekens
      van het eerste lid onder *c* van dit artikel worden gevoerd tijdig zijn snelheid verminderen, zoals bij de tweede
      volzin van het eerste lid wordt bepaald. Het moet voorts zover mogelijk daarvan verwijderd blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.20
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
  - number: 6.21.1
    text: |-
      Een motorschip dat zorgt voor de voortbeweging van een samenstel moet een vermogen hebben dat voldoende is om de
      goede manoeuvreerbaarheid daarvan te verzekeren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.21
  - number: 6.21.2
    text: |-
      Een motorschip, een duwstel en een gekoppeld samenstel waarvan de lengte meer dan 110 m bedraagt alsmede een
      motorschip, een duwstel en een gekoppeld samenstel die op een vaarweg waar stroom loopt vóór stroom varend niet
      kunnen keren, moeten tijdig zonder te keren kunnen stilhouden en zij moeten tijdens en na het stilhouden volledig
      manoeuvreerbaar blijven.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.21
  - number: 6.21a.1
    text: |-
      Indien de bevoegde autoriteit dit voorschrijft, moeten een duwstel en een gekoppeld samenstel voor de
      bestuurbaarheid worden geassisteerd. Overigens mag een duwstel slechts worden geassisteerd indien de scheepvaart
      daarvan geen hinder ondervindt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.21a
  - number: 6.21a.2
    text: Een duwstel en een gekoppeld samenstel mogen geen sleepdienst verrichten.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.21a
  - number: 6.21a.3
    text: |-
      Een duwstel mag geen andere schepen dan duwbakken bevatten, tenzij deze langszijde zijn vastgemaakt van het
      samenstel, gevormd door de duwboot en één of twee duwbakken daarvóór.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.21a
  - number: 6.21a.4
    text: |-
      Een duwstel mag niet varen, indien aan de kop uitsluitend een zeeschipbak is geplaatst die niet is voorzien van een
      kopbak. De bevoegde autoriteit kan van dit verbod ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.21a
  - number: 6.21a.5
    text: |-
      Indien de lengte van een alleenvarend motorschip, van een duwstel of van een gekoppeld samenstel meer dan 110 m
      bedraagt, moet dit motorschip zijn voorzien van een spreekverbinding tussen de stuurhut en de kop van het schip,
      dit duwstel van een spreekverbinding tussen de duwboot en de kop van het duwstel en dit gekoppeld samenstel van een
      spreekverbinding tussen de stuurhut van het motorschip of één der motorschepen die dienen voor het voortbewegen en
      de kop van het samenstel.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.21a
  - number: 6.21b
    text: Een schip mag slechts een duwbak buiten het verband van een duwstel verplaatsen, indien dit veilig kan geschieden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.21b
  - number: 6.21c.1
    text: |-
      Bij een sleep bestaande uit grote schepen moet een telefoonverbinding bestaan tussen de stuurstellingen van alle
      schepen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.21c
  - number: 6.21c.2
    text: |-
      Als telefoonverbinding mag de marifoon slechts worden gebruikt op de kanalen bestemd voor het verkeer aan boord
      van schepen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.21c
  - number: 6.22.1
    text: |-
      Een schip moet stilhouden vóór een teken A.1 ([bijlage 7][ref1]) aanduidende dat de scheepvaart is gestremd.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.22.2
    text: |-
      Een schip mag niet varen op een vaarweg of op een gedeelte daarvan, aangeduid door een teken A.1*a*
      ([bijlage 7][ref1]). Deze bepaling is niet van toepassing op een klein schip zonder motor.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.22.3
    text: |-
      Een schip mag niet varen langs een schip, zoals bedoeld in [artikel 3.25][ref1], aan de zijde waar dat des
      nachts het rode licht en des daags de rode bol of het rode bord voert of langs een schip, zoals bedoeld in
      [artikel 3.34][ref2], aan de zijde waar dat des nachts de twee rode lichten en des daags de twee zwarte bollen
      voert.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: IV
  - number: 6.23.1
    text: |-
      Een veerpont mag slechts vertrekken, keren of het vaarwater oversteken, nadat hij zich er van heeft vergewist dat
      dit zonder gevaar kan geschieden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.23
  - number: 6.23.2
    text: Een veerpont mag bij vertrek, keren of oversteken van het vaarwater medewerking verlangen van een groot schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.23
  - number: 6.23.3
    text: Een klein schip moet voorrang verlenen aan een vertrekkende, kerende of overstekende veerpont.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.23
  - number: 6.24.1
    text: |-
      De doorvaartopening van een brug, van een stuw of van een aan beide zijden openstaande sluis waar het vaarwater
      niet voldoende ruimte biedt voor het elkaar voorbijvaren van twee schepen is een engte, zoals bedoeld in
      [artikel 6.07][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel6
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '6'
        hoofdstuk: '6'
        afdeling: II
  - number: 6.24.2
    text: 'Indien bij de doorvaartopening van een brug of van een stuw wordt getoond:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.24
  - number: 6.24.2.a
    text: |-
      het teken A.10 (bijlage 7), mag een schip in deze doorvaartopening niet varen buiten de begrenzing, aangeduid door
      de twee borden die dit teken vormen;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.24
  - number: 6.24.2.b
    text: |-
      het teken D.2 (bijlage 7), wordt aanbevolen in deze doorvaartopening uitsluitend te varen binnen de begrenzing,
      aangeduid door de twee borden die dit teken vormen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.24
  - number: 6.25.1
    text: |-
      Een schip mag niet varen door de doorvaartopening van een vaste brug waarboven een teken A.1 (bijlage 7) wordt
      getoond.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.25
  - number: 6.25.2
    text: |-
      Indien boven een doorvaartopening van een vaste brug wordt getoond: - het teken D.1*a* (bijlage 7) of
        - het teken D.1*b* (bijlage 7), wordt aanbevolen bij voorkeur van deze doorvaartopening gebruik te maken; ingeval
      van het teken D.1*a* is de doorvaartopening vrij voor de doorvaart uit beide richtingen, ingeval van het teken
      D.1*b* is de doorvaart uit tegenovergestelde richting verboden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.25
  - number: 6.25.3
    text: In dit artikel wordt onder een vaste brug mede verstaan het vaste gedeelte van een brug.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.25
  - number: 6.26.1
    text: |-
      De bevoegde autoriteit kan, teneinde de veiligheid of de goede orde van de scheepvaart dan wel het zonder oponthoud
      doorvaren van de doorvaartopening van een beweegbare brug te verzekeren, wanneer een schip de brug nadert of de
      doorvaartopening daarvan doorvaart, aan de schipper een verkeersaanwijzing geven. De schipper is verplicht aan deze
      aanwijzing gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
  - number: 6.26.2
    text: |-
      Een schip mag niet zonder toestemming van de bevoegde autoriteit ligplaats nemen op een wachtplaats van een
      beweegbare brug anders dan om te wachten op een brugopening.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
  - number: 6.26.3
    text: 'Bij het naderen, op een wachtplaats en bij het doorvaren van een beweegbare brug:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
  - number: 6.26.3.a
    text: moet een schip dat met een marifooninstallatie is uitgerust uitluisteren op het kanaal van de brug;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
  - number: 6.26.3.b
    text: |-
      moet een schip snelheid verminderen. Het moet, ingeval het de doorvaartopening niet mag of wil doorvaren, voor het
      teken B.5 ([bijlage 7][ref1]) stilhouden;


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.26.3.c
    text: |-
      mag een schip een ander schip niet voorbijlopen tenzij daartoe een verkeersaanwijzing is gegeven door de bevoegde
      autoriteit;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
  - number: 6.26.3.d
    text: |-
      moet een schip voorrang verlenen aan een schip dat recht van voorrang heeft en de rode wimpel voert, bedoeld in
      [artikel 3.17][ref1], opdat dit schip zonder oponthoud de brug kan doorvaren;


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 6.26.3.e
    text: mag een schip zonder toestemming van de bevoegde autoriteit geen brandstof innemen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
  - number: 6.26.4
    text: |-
      Voor het doorvaren van de doorvaartopening van een beweegbare brug kunnen tekens worden getoond aan weerszijden van
      de doorvaartopening op gelijke hoogte dan wel aan de stuurboordszijde daarvan. Deze tekens betekenen:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
  - number: 6.26.4.a
    text: |-
      twee rode vaste lichten boven elkaar (teken A.1; [bijlage 7][ref1]): het doorvaren is verboden, de brug wordt niet
      bediend;


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.26.4.b
    text: |-
      één rood vast licht (teken A.1; [bijlage 7][ref1]): het doorvaren is verboden, de brug wordt bediend;


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.26.4.c
    text: |-
      een rood vast licht en daaronder een groen vast licht (teken A.11; [bijlage 7][ref1]): het doorvaren is verboden,
      maar dit zal aanstonds worden toegestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.26.4.d
    text: |-
      één groen vast licht (teken E.1; [bijlage 7][ref1]): het doorvaren is toegestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.26.4.e
    text: |-
      twee groene vaste lichten boven elkaar (tekens E 1, G2; [bijlage 7][ref1]): het doorvaren is in beide richtingen
      toegestaan, de brug bevindt zich in geopende stand;


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.26.4.f
    text: |-
      een rood vast licht en daaronder een groen flikkerlicht (teken A.11.1; [bijlage 7][ref1]): het doorvaren is
      verboden, tenzij het schip de doorvaartopening zo dicht is genaderd, dat stilhouden redelijkerwijs niet meer
      mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.26.4.g
    text: |-
      de in de onderdelen a, b of c genoemde markering samen met een geel licht boven de doorvaartopening: doorvaart
      niet toegestaan, behalve voor schepen van beperkte hoogte; doorvaart in beide richtingen toegestaan (teken D.1a;
      [bijlage 7][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.26.4.h
    text: |-
      de in de onderdelen a, b of c genoemde markering samen met twee gele lichten boven de doorvaartopening: doorvaart
      niet toegestaan, behalve voor schepen van beperkte hoogte; doorvaart in de andere richting niet toegestaan (teken
      D.1b; [bijlage 7][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.26.5
    text: |-
      De in het vierde lid onder *a*, *b*, *d* en *e* bedoelde rode en groene lichten kunnen worden vervangen
      onderscheidenlijk door het bord van teken A.1 en het bord van teken E.1 ([bijlage 7][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.26.6
    text: |-
      Een schip kan het verzoek tot het bedienen van een beweegbare brug kenbaar maken door het geven van één lange stoot
      gevolgd door één korte stoot en één lange stoot dan wel door roepen. Het mag dit sein niet herhalen, indien de
      bevoegde autoriteit heeft te kennen gegeven het te hebben gehoord.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
  - number: 6.26.8
    text: In dit artikel wordt onder een beweegbare brug mede verstaan het beweegbare gedeelte van een brug.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.26
  - number: 6.27.1
    text: Een schip mag niet varen door de opening van een stuw, waarbij een teken A.1 (bijlage 7) wordt getoond.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.27
  - number: 6.27.2
    text: |-
      Een schip mag slechts door de opening van een stuw varen, waarbij aan weerszijden een teken E.1 (bijlage 7) wordt
      getoond.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.27
  - number: 6.27.3
    text: |-
      In afwijking van het tweede lid mag bij een stuw met daarboven een brug een schip eveneens door de opening van de
      stuw varen, indien boven de doorvaartopening van de brug het teken D.1*a* of het teken D.1*b* (bijlage 7) wordt
      getoond; ingeval van het teken D.1*a* is de doorvaartopening vrij voor de doorvaart uit beide richtingen, ingeval
      van het teken D.1*b* is de doorvaart uit tegenovergestelde richting verboden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.27
  - number: 6.28.1
    text: |-
      Bij het naderen van een wachtplaats van een sluis moet een schip snelheid verminderen. Het moet, ingeval het de
      sluis niet onmiddellijk mag of wil invaren, vóór het teken B.5 ([bijlage 7][ref1]) stilhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.28.2
    text: |-
      Een schip mag niet zonder toestemming van de bevoegde autoriteit ligplaats nemen op een wachtplaats van een sluis
      anders dan om te worden geschut.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.3
    text: |-
      Op een wachtplaats van een sluis en in een sluis moet een schip, dat met een marifooninstallatie is uitgerust
      uitluisteren op het kanaal van de sluis.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.4
    text: |-
      Een schip kan het verzoek tot het bedienen van een sluis kenbaar maken door het geven van één lange stoot gevolgd
      door één korte stoot en één lange stoot dan wel door roepen. Het mag dit sein niet herhalen, indien de bevoegde
      autoriteit heeft te kennen gegeven het te hebben gehoord.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.5
    text: |-
      De schepen moeten de sluis in volgorde van aankomst op de wachtplaats invaren. Een klein schip dat tezamen met
      grote schepen wordt geschut mag de sluis echter eerst invaren na deze grote schepen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.6
    text: |-
      Bij het naderen van een wachtplaats van een sluis en op een wachtplaats mag een schip een ander schip niet
      voorbijlopen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.7
    text: |-
      In een sluis moet een schip zijn ankers geheel voorhalen. Dezelfde verplichting geldt op een wachtplaats, voorzover
      de ankers niet worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.8
    text: |-
      Bij het invaren en uitvaren van een sluis en bij het bevaren van de wachtplaats moet een schip de waterbeweging
      zoveel beperken als nodig is om beschadiging van de sluisdeuren of de beschermingsinrichtingen dan wel van andere
      schepen, drijvende voorwerpen of drijvende inrichtingen te vermijden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.9
    text: In een sluis
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.9.a
    text: |-
      moeten een schip, een drijvend voorwerp en een drijvende inrichting ligplaats nemen binnen de door stopstrepen of
      op andere wijze aangegeven grenzen;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.9.b
    text: |-
      moet tijdens het vullen en het ledigen van de sluiskolk en totdat het uitvaren van de sluis wordt toegestaan een
      schip zodanig zijn gemeerd en moet het zijn meerdraden zodanig vieren of doorhalen, dat het niet de sluismuren, de
      sluisdeuren of de beschermingsinrichtingen dan wel andere schepen of drijvende voorwerpen kan beschadigen;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.9.c
    text: mag een schip slechts voorwerpen die niet kunnen zinken als wrijfhout gebruiken;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.9.d
    text: mag een schip geen water op het sluisterrein dan wel op andere schepen storten of laten vloeien;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.9.e
    text: |-
      mag een schip, zodra het is gemeerd en totdat het aan de beurt is om uit te varen, geen gebruik maken van zijn
      mechanische middelen tot voortbeweging;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.9.f
    text: moet een klein schip zo mogelijk ligplaats nemen op enige afstand van een groot schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.10
    text: |-
      Op een wachtplaats van een sluis en in een sluis mag een schip zonder toestemming van de bevoegde autoriteit geen
      brandstof innemen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.11
    text: 'Schepen moeten in acht nemen:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.11.a
    text: |-
      in een sluis een onderlinge zijwaartse afstand van tenminste 10 m ten opzichte van een schip, een duwstel of een
      gekoppeld samenstel dat het teken bedoeld in artikel 3.14, eerste lid, voert;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.11.b
    text: 'op een wachtplaats van een sluis een onderlinge zijwaartse afstand van tenminste:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.11.b.i
    text: |-
      10 m ten opzichte van een schip, een duwstel of een gekoppeld samenstel dat het teken bedoeld in
      [artikel 3.14, eerste lid][ref1], voert;


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 6.28.11.b.ii
    text: |-
      50 m ten opzichte van een schip, een duwstel of een gekoppeld samenstel dat de tekens bedoeld in
      [artikel 3.14, tweede lid][ref1], voert;


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 6.28.11.b.iii
    text: |-
      100 m ten opzichte van een schip, een duwstel of een gekoppeld samenstel dat de tekens bedoeld in
      [artikel 3.14, derde lid][ref1], voert.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 6.28.12
    text: 'De verplichtingen, bedoeld in het elfde lid, met uitzondering van onderdeel b, subonderdeel iii, gelden niet:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.12.a
    text: |-
      voor een schip, duwstel of gekoppeld samenstel dat een teken als bedoeld in [artikel 3.14, eerste lid][ref1],
      voert, ten opzichte van een ander schip dat eveneens een teken als bedoeld in artikel 3.14, eerste lid, voert;


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 6.28.12.b
    text: |-
      voor een schip als bedoeld in [artikel 3.14, zevende lid][ref1], ten opzichte van een ander schip dat eveneens een
      teken als bedoeld in artikel 3.14, eerste lid, voert;


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 6.28.12.c
    text: |-
      voor de bij ministeriële regeling aan te wijzen categorieën schepen op daarvoor
      door de bevoegde autoriteit aangewezen wachtplaatsen of in sluizen, onverminderd
      [artikel 6, aanhef en onderdeel i, van het Binnenvaartbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel6
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '6'
  - number: 6.28.13
    text: |-
      Een schip of samenstel dat een teken als bedoeld in [artikel 3.14, eerste lid][ref1], voert, mag een sluis niet
      invaren om tezamen geschut te worden met een passagiersschip met aan boord passagiers. Een passagiersschip met aan
      boord passagiers mag de sluis niet invaren om tezamen geschut te worden met een schip of samenstel dat een hiervoor
      bedoeld teken voert.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 6.28.14
    text: |-
      Een schip of samenstel dat een teken als bedoeld in [artikel 3.14, tweede lid][ref1], voert, mag een sluis niet
      invaren om tezamen geschut te worden met een ander schip. Een ander schip mag een sluis niet invaren om tezamen
      geschut te worden met een schip of samenstel dat dit teken voert.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 6.28.15
    text: |-
      De verplichtingen, bedoeld in het veertiende lid, gelden niet voor de bij ministeriële
      regeling aan te wijzen categorieën schepen op daarvoor door de bevoegde autoriteit aangewezen
      wachtplaatsen of in sluizen. Op die schepen zijn in dat geval het dertiende lid van dit artikel en
      [artikel 6, aanhef en onderdeel i, van het Binnenvaartbesluit][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel6
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '6'
  - number: 6.28.16
    text: |-
      Een schip of samenstel dat een teken als bedoeld in [artikel 3.14, derde lid][ref1], voert, mag een sluis niet
      invaren om tezamen geschut te worden met een ander schip. Een ander schip mag een sluis niet invaren om tezamen
      geschut te worden met een schip of samenstel dat dit teken voert.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 6.28.17
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot hetgeen geregeld is in het elfde
      tot en met het zestiende lid.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28.18
    text: |-
      Schepen en samenstellen die het kenteken, bedoeld in [artikel 2.06][ref1], voeren, mogen de sluis niet binnenvaren
      indien er vloeibaar aardgas (LNG) vrijkomt buiten de LNG-installatie, of indien verwacht kan worden dat er
      vloeibaar aardgas (LNG) buiten de LNG-installatie zal vrijkomen tijdens het schutten.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel2
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.28.19
    text: |-
      De bevoegde autoriteit kan, wanneer een schip zich in een sluis of op een wachtplaats daarvan bevindt, teneinde de
      veiligheid of de goede orde van de scheepvaart te waarborgen, dan wel het zonder oponthoud doorvaren van de sluis
      en het doelmatig gebruik daarvan te verzekeren, aan de schipper een verkeersaanwijzing geven, zo nodig in afwijking
      van dit artikel. De schipper is verplicht aan deze verkeersaanwijzing gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28
  - number: 6.28a.1
    text: |-
      Voor het invaren van een sluis kunnen tekens worden getoond aan weerszijden van de invaartopening op gelijke hoogte
      dan wel aan de stuurboordszijde daarvan. Deze tekens betekenen:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28a
  - number: 6.28a.1.a
    text: |-
      twee rode vaste lichten boven elkaar (teken A.1; [bijlage 7][ref1]): het invaren is verboden, de sluis wordt niet
      bediend;


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28a
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.28a.1.b
    text: |-
      één rood vast licht (teken A.1; [bijlage 7][ref1]): het invaren is verboden, de sluis wordt bediend;


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28a
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.28a.1.c
    text: |-
      een rood vast licht en daaronder een groen vast licht (teken A.11; [bijlage 7][ref1]): het invaren is verboden,
      maar dit zal aanstonds worden toegestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28a
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.28a.1.d
    text: |-
      één groen vast licht (teken E.1; [bijlage 7][ref1]): het invaren is toegestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28a
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.28a.1.e
    text: |-
      twee groene vaste lichten boven elkaar (teken E.1; [bijlage 7][ref1]): het invaren is toegestaan, de sluis is aan
      beide zijden open en wordt niet bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28a
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.28a.2
    text: |-
      Voor het uitvaren van een sluis kunnen tekens worden getoond aan weerszijden van de uitvaartopening op gelijke
      hoogte dan wel aan de stuurboordszijde daarvan. Deze tekens betekenen:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28a
  - number: 6.28a.2.a
    text: |-
      één rood vast licht (teken A.1; [bijlage 7][ref1]): het uitvaren is verboden;


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28a
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.28a.2.b
    text: |-
      één groen vast licht (teken E.1; [bijlage 7][ref1]): het uitvaren is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28a
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.28a.3
    text: |-
      De in het eerste lid, onder *a*, *b*, *d* en *e*, en in het tweede lid bedoelde rode en groene lichten kunnen
      worden vervangen onderscheidenlijk door het bord van teken A.1 en het bord van teken E.1 ([bijlage 7][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28a
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.28b.1
    text: |-
      In afwijking van [artikel 6.28, vijfde lid][ref1], hebben recht op voorschutting:


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel6
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28b
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '6'
        hoofdstuk: '6'
        afdeling: V
  - number: 6.28b.1.a
    text: |-
      schepen van ambtenaren belast met toezicht of opsporing en brandweerboten die in verband met spoedeisende redenen
      van dienstvervulling onderweg zijn;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28b
  - number: 6.28b.1.b
    text: schepen waaraan de bevoegde autoriteit dit recht heeft verleend.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28b
  - number: 6.28b.2
    text: |-
      Een schip moet voorrang verlenen aan een schip dat recht op voorschutting heeft en de rode wimpel voert, bedoeld in
      [artikel 3.17][ref1], opdat dit schip zonder oponthoud de sluis kan invaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.28b
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 6.29.1
    text: Deze afdeling is alleen van toepassing bij slecht zicht.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.29
  - number: 6.29.2
    text: Een schip vaart op radar, indien het gebruik maakt van radar voor het varen bij slecht zicht.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.29
  - number: 6.29.3
    text: |-
      Op de in [bijlage 9][ref1] vermelde vaarwegen moet een schip bij slecht zicht op radar varen. Op deze vaarwegen
      moet een schip dat niet op radar kan varen op de dichtstbijzijnde daarvoor geschikte plaats gaan stilliggen.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.29.4
    text: |-
      Het derde lid is niet van toepassing op een schip dat bestemd is om bedrijfsmatig diensten te verrichten ten
      behoeve van een zeegaand schip en waarop in samenhang met die te verrichten diensten de plaatsing van een radar
      technisch gezien niet mogelijk is. De bevoegde autoriteit kan hieromtrent beleidsregels vaststellen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.29
  - number: 6.30.1
    text: |-
      Een varend schip moet een snelheid aanhouden die is aangepast aan de mate van beperking van het zicht, aan de
      aanwezigheid en de bewegingen van andere schepen en aan de plaatselijke omstandigheden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.30
  - number: 6.30.2
    text: |-
      Een varend schip moet zo veel mogelijk aan de stuurboordszijde van het vaarwater varen. De [artikelen 6.04a][ref1]
      en [6.05][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel6
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.30
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '6'
        hoofdstuk: '6'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '6'
        hoofdstuk: '6'
        afdeling: II
  - number: 6.30.3
    text: |-
      Een schip moet op de dichtstbijzijnde daarvoor geschikte plaats gaan stilliggen, wanneer in verband met de mate
      van beperking van het zicht, met de aanwezigheid en de bewegingen van andere schepen of met de plaatselijke
      omstandigheden de vaart niet zonder gevaar kan worden voortgezet.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.30
  - number: 6.30.4
    text: Een schip moet bij het gaan stilliggen het vaarwater zo veel mogelijk vrijmaken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.30
  - number: 6.31.1
    text: |-
      Een schip dat in het vaarwater of in de nabijheid daarvan op een gevaarlijke plaats stilligt moet, wanneer het
      per marifoon verneemt dat andere schepen naderen of wanneer en zolang het het geluidssein van een naderend schip
      hoort, per marifoon zijn positie opgeven of als geluidssein één reeks klokslagen geven. Het geluidssein moet worden
      herhaald met tussenpozen van ten hoogste één minuut. Deze bepaling is niet van toepassing op een schip dat stil
      ligt in een haven of op een in het bijzonder daartoe door de bevoegde autoriteit bestemde ligplaats.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.31
  - number: 6.31.2
    text: |-
      Het eerste lid is niet van toepassing op andere schepen van een duwstel dan de duwboot. Bij een gekoppeld samenstel
      is het van toepassing op het schip dat zorgt voor de voortbeweging van het samenstel; bij een gekoppeld samenstel
      van twee motorschepen op het motorschip aan stuurboord.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.31
  - number: 6.31.3
    text: |-
      Een zeegaand schip dat stilligt als bedoeld in het eerste lid mag als geluidssein eveneens geven: één korte stoot
      gevolgd door één lange stoot en één korte stoot. Dit sein mag worden herhaald.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.31
  - number: 6.31.4
    text: |-
      Dit artikel is mede van toepassing op een schip dat in het vaarwater of in de nabijheid daarvan op een gevaarlijke
      plaats is vastgevaren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.31
  - number: 6.32.1
    text: |-
      Een schip mag slechts op radar varen, indien zowel een persoon die houder is van een radarpatent als bedoeld in
      het [Reglement betreffende het scheepvaartpersoneel op de Rijn][ref1] of een specifieke vergunning voor het varen
      met behulp van een radar zoals bedoeld in het Reglement betreffende het scheepvaartpersoneel op de Rijn of de
      [Binnenvaartregeling][ref2] en die tevens houder is van het vereiste vaarbevoegdheidsbewijs als een tweede persoon
      die met het varen op radar voldoende op de hoogte is zich voortdurend in de stuurhut bevindt. Voor een schip dat
      is uitgerust met een eenmansstuurstelling voor het varen op radar en dat voldoet aan de daaromtrent vastgestelde
      voorschriften behoeft de tweede persoon slechts aan boord beschikbaar te zijn. Voor een niet-vrijvarende veerpont
      kan de bevoegde autoriteit van de verplichting van dit lid ontheffing verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.32
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0025958
  - number: 6.32.2
    text: |-
      Voor een op radar varend schip blijft [artikel 1.09, vierde lid][ref1], omtrent het hebben naar alle zijden van een
      voldoende vrij direct of indirect uitzicht buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel1
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.32
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.32.3
    text: |-
      Een op radar varend schip moet, zodra het op het scherm een schip waarneemt waarvan de positie of het gedrag tot
      een gevaarlijke situatie zou kunnen leiden of wanneer het een vak van de vaarweg nadert waar zich schepen zouden
      kunnen bevinden die nog niet op het scherm te zien zijn, aan de andere schepen op het schip--schip kanaal dan wel
      op het andere aangewezen kanaal opgeven: zijn naam, zijn positie, zijn vaarrichting en of het een groot schip,
      een klein schip, een snel schip, of een bovenmaats schip is. Het moet vervolgens met die schepen het voorbijvaren
      afspreken. Een klein schip of een snel schip moet daarbij opgeven naar welke zijde het uitwijkt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.32
  - number: 6.32.4
    text: |-
      Een op radar varend schip dat per marifoon wordt opgeroepen moet op het schip--schip kanaal dan wel op het andere
      aangewezen kanaal antwoorden en opgeven: zijn naam, zijn positie, zijn vaarrichting en of het een groot schip, een
      klein schip, een snel schip, of een bovenmaats schip is. Het moet vervolgens met de andere schepen het voorbijvaren
      afspreken. Een klein schip of een snel schip moet daarbij opgeven naar welke zijde het uitwijkt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.32
  - number: 6.32.5
    text: 'Wanneer met de andere schepen geen marifooncontact tot stand komt, moet het op radar varende schip:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.32
  - number: 6.32.5.a
    text: |-
      één lange stoot geven, met dien verstande dat een veerpont een lange stoot gevolgd door vier korte stoten moet
      geven, en dit sein zo dikwijls als nodig is herhalen; en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.32
  - number: 6.32.5.b
    text: de snelheid verminderen en zo nodig stilhouden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.32
  - number: 6.32.6
    text: |-
      Dit artikel geldt ingeval van een duwstel en een gekoppeld samenstel alleen voor het schip aan boord waarvan zich
      de schipper van het samenstel bevindt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.32
  - number: 6.33.1
    text: 'Voor een schip en een samenstel die niet op radar varen geldt:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.33
  - number: 6.33.1.a
    text: |-
      Een alleenvarend schip en een schip aan boord waarvan zich de schipper van een samenstel bevindt moeten als
      mistsein één lange stoot geven. Dit sein moet worden herhaald met tussenpozen van ten hoogste één minuut.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.33
  - number: 6.33.1.b
    text: |-
      Het schip moet voorop een uitkijk hebben, die zich of binnen gezichts- of gehoorsafstand van de schipper bevindt of
      een spreekverbinding met hem heeft. Bij een samenstel behoeft alleen het voorste schip een uitkijk te hebben. Dit
      is niet van toepassing op een klein schip of een veerpont.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.33
  - number: 6.33.1.c
    text: |-
      Wanneer het schip via marifoon door een ander schip wordt aangeroepen, moet het per marifoon antwoorden en opgeven:
      zijn naam, zijn positie, zijn vaarrichting en of het een groot schip, een klein schip, een snel schip of een
      bovenmaats schip is. Het moet daarna met het andere schip het voorbijvaren afspreken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.33
  - number: 6.33.1.d
    text: 'Wanneer het schip andere schepen bemerkt waarmee geen marifooncontact tot stand komt moet het:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.33
  - number: 6.33.1.d.1°
    text: |-
      indien het zich in de nabijheid van een oever bevindt, deze oever aanhouden en, zo nodig, vaart minderen dan wel
      gaan stilliggen, totdat het voorbijvaren heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.33
  - number: 6.33.1.d.2°
    text: |-
      indien het zich niet in de nabijheid van een oever bevindt, het vaarwater zo veel mogelijk en zo snel mogelijk
      vrijmaken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.33
  - number: 6.33.2
    text: |-
      Een varend klein schip dat op een andere vaarweg dan de op de in [bijlage 9][ref1] vermelde vaarwegen vaart en dat
      is uitgerust met een marifooninstallatie voor de kanalen voor het schip--schipverkeer en de nautische informatie
      moet uitluisteren op het daartoe aangewezen kanaal en aan andere schepen de nodige inlichtingen ter verzekering van
      de veiligheid van de scheepvaart geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.33
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 6.33.3
    text: |-
      Een niet op radar varend klein schip is niet verplicht het in het eerste lid bedoelde mistsein te geven, doch het
      mag dit sein geven. Het sein mag worden herhaald.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel6.33
  - number: 7.01.1
    text: |-
      Onverminderd de andere bepalingen van dit reglement moeten een schip en een drijvend voorwerp zodanig ligplaats
      nemen, dat de scheepvaart niet wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.01
  - number: 7.01.2
    text: |-
      Afgezien van andere regelingen moet een drijvende inrichting een zodanige ligplaats innemen, dat het vaarwater
      vrijblijft voor de scheepvaart.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.01
  - number: 7.01.3
    text: |-
      Een schip, een samenstel en een drijvend voorwerp die stilliggen, zomede een drijvende inrichting, moeten zodanig
      zijn verankerd of gemeerd, dat zij door verandering van hun positie geen gevaar of hinder voor andere schepen
      kunnen vormen, dan wel dat daardoor geen schade aan oevers, waterkeringen of werken gelegen in scheepvaartwegen kan
      ontstaan. Hierbij moet met name rekening worden gehouden met wind, stroom en verandering van de waterstand, alsmede
      met zuiging en golfslag.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.01
  - number: 7.01.4
    text: |-
      Een stilliggend schip mag zonder toestemming van de bevoegde autoriteit niet onnodig waterbeweging veroorzaken,
      indien daardoor gevaar of schade voor een ander schip, drijvend voorwerp of drijvende inrichting, dan wel schade
      aan oevers, waterkeringen of werken gelegen in scheepvaartwegen kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.01
  - number: 7.01.5
    text: |-
      Een niet-vrijvarende veerpont moet, indien hij buiten dienst is, ligplaats nemen op de door de bevoegde autoriteit
      aangewezen plaats dan wel, zo deze niet is aangewezen, zodanig, dat het vaarwater vrij blijft, en mag zich niet
      langer in het vaarwater bevinden dan voor de uitoefening van de dienst nodig is.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.01
  - number: 7.02.1
    text: 'Een schip, een drijvend voorwerp en een drijvende inrichting mogen geen ligplaats nemen:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.02
  - number: 7.02.1.a
    text: |-
      op een gedeelte van de vaarweg, waar bij algemene regeling dan wel krachtens een bekendmaking met dezelfde
      strekking als een verkeersteken ligplaats nemen is verboden;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.02
  - number: 7.02.1.b
    text: in een vak van of op een plaats in de vaarweg aangewezen door de bevoegde autoriteit;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.02
  - number: 7.02.1.c
    text: |-
      in een vak van of op een plaats in de vaarweg, aangeduid door het teken A.5 (bijlage 7), waarbij het verbod van
      toepassing is aan de zijde van de vaarweg, waar het teken is aangebracht;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.02
  - number: 7.02.1.d
    text: onder een brug of onder een hoogspanningslijn;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.02
  - number: 7.02.1.e
    text: |-
      in een engte in de zin van artikel 6.07 en in de nabijheid daarvan, zomede in een vak van of op een plaats in de
      vaarweg waar als gevolg van het stilliggen een engte zou ontstaan en in de nabijheid daarvan;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.02
  - number: 7.02.1.f
    text: waar in een vaarweg een andere vaarweg, daaronder begrepen een haven, uitmondt;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.02
  - number: 7.02.1.g
    text: in het traject van een veerpont;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.02
  - number: 7.02.1.h
    text: in de route van schepen die aan een aanlegplaats willen aanleggen of vandaar vertrekken;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.02
  - number: 7.02.1.i
    text: in een vak van of op een plaats in de vaarweg, waar schepen kunnen keren, aangeduid door het teken E.8 (bijlage 7);
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.02
  - number: 7.02.1.j
    text: |-
      evenwijdig aan een schip dat het bord bedoeld in artikel 3.33 voert, binnen de afstand die op de witte driehoek van
      dit bord in meters is aangegeven;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.02
  - number: 7.02.1.k
    text: |-
      in een vak van of op een plaats in de vaarweg, aangeduid door het teken A.5.1. (bijlage 7), binnen de afstand, te
      rekenen vanaf het teken, die daarop in meters is aangegeven.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.02
  - number: 7.02.2
    text: |-
      Op een gedeelte van de vaarweg, waar ligplaats nemen is verboden mag een schip, een drijvend voorwerp of een
      drijvende inrichting evenwel ligplaats nemen op een bijzondere ligplaats aangeduid door één der tekens E.5 tot en
      met E.7 (bijlage 7), met inachtneming van de artikelen 7.03 tot en met 7.06.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.02
  - number: 7.02.3
    text: |-
      De schipper van een schip, een drijvend voorwerp en een drijvende inrichting, die noodgedwongen ligplaats hebben
      genomen op een gedeelte van de vaarweg waar ligplaats nemen is verboden, moet daarvan onverwijld kennis geven aan
      de dichtstbijzijnde bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.02
  - number: 7.03.1
    text: |-
      Een schip, een drijvend voorwerp en een drijvende inrichting mogen niet ankeren en geen gebruik maken van
      spudpalen:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.03
  - number: 7.03.1.a)
    text: op een gedeelte van de vaarweg waar bij algemene regeling ankeren is verboden;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.03
  - number: 7.03.1.b)
    text: |-
      in een vak aangeduid door het teken A.6 ([bijlage 7][ref1]), aan de zijde van de vaarweg waar het teken is
      aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.03
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 7.03.2
    text: |-
      Op een gedeelte van de vaarweg waar ankeren en het gebruik van spudpalen ingevolge het eerste lid, onder a,
      verboden zijn, mogen een schip, een drijvend voorwerp en een drijvende inrichting evenwel ankeren in een vak
      aangeduid door het teken E.6 ([bijlage 7][ref1]), aan de zijde van de vaarweg waar het teken is aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.03
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 7.03.3
    text: |-
      Op een gedeelte van de vaarweg waar ankeren en het gebruik van spudpalen ingevolge het eerste lid, onder a,
      verboden zijn, mogen een schip, een drijvend voorwerp en een drijvende inrichting evenwel spudpalen gebruiken,
      in een vak aangeduid door het teken E.6.1 ([bijlage 7][ref1]), aan de zijde van de vaarweg waar het teken is
      aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.03
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 7.04.1
    text: 'Een schip, een drijvend voorwerp en een drijvende inrichting mogen niet meren:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.04
  - number: 7.04.1.a
    text: |-
      op een gedeelte van de vaarweg, waar bij algemene regeling dan wel krachtens een bekendmaking met dezelfde
      strekking als een verkeersteken meren is verboden;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.04
  - number: 7.04.1.b
    text: |-
      in een vak van of op een plaats in de vaarweg, aangeduid door het teken A.7 (bijlage 7), aan de zijde van de
      vaarweg, waar het teken is aangebracht.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.04
  - number: 7.04.2
    text: |-
      Op een gedeelte van de vaarweg, waar meren is verboden, mag een schip, een drijvend voorwerp of een drijvende
      inrichting evenwel meren in een vak of op een plaats, aangeduid door het teken E.7 (bijlage 7), aan de zijde van de
      vaarweg, waar het teken is aangebracht.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.04
  - number: 7.04.3
    text: |-
      Een schip, een drijvend voorwerp en een drijvende inrichting mogen bij meren of verhalen niet gebruik maken van
      andere voorwerpen dan die welke daartoe zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.04
  - number: 7.05.1
    text: |-
      Op een bijzondere ligplaats, aangeduid door het teken E.5 ([bijlage 7][ref1]), mogen een schip en een drijvend
      voorwerp ligplaats nemen aan de zijde van de vaarweg, waar het teken is aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.05
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 7.05.2
    text: |-
      Op een bijzondere ligplaats, aangeduid door het teken E.5.1 ([bijlage 7][ref1]), mogen een schip en een drijvend
      voorwerp ligplaats nemen binnen de afstand, te rekenen vanaf het teken, die daarop in meters is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.05
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 7.05.3
    text: |-
      Op een bijzondere ligplaats, aangeduid door het teken E.5.2 ([bijlage 7][ref1]), mogen een schip en een drijvend
      voorwerp ligplaats nemen tussen de beide afstanden te rekenen vanaf het teken die daarop in meters zijn aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.05
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 7.05.4
    text: |-
      Op een bijzondere ligplaats aangeduid door de tekens E.5.4 tot en met E.5.15 ([bijlage 7][ref1]) kan de bevoegde
      autoriteit onderscheid maken tussen categorieën van schepen naar gelang de wijze waarop deze de lading vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.05
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 7.05.5
    text: |-
      Op een bijzondere ligplaats, aangeduid door het teken E.5.3 ([bijlage 7][ref1]), mogen aan de zijde van de vaarweg,
      waar het teken is aangebracht, een schip en een drijvend voorwerp ligplaats nemen, indien daarmede het aantal
      schepen en drijvende voorwerpen langszijde van elkaar aldaar niet meer bedraagt dan op het teken in Romeinse
      cijfers is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.05
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 7.05.6
    text: |-
      De in dit artikel vermelde bijzondere ligplaatsen zijn die bedoeld in [artikel 7.02, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel7
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.05
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.06.1
    text: |-
      Op een bijzondere ligplaats aangeduid door één der tekens E.5.4 tot en met E.5.15 (bijlage 7) mag een schip
      ligplaats nemen dat behoort tot de categorie, waarop het teken van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.06
  - number: 7.06.2
    text: |-
      Op de bijzondere ligplaatsen moeten de schepen, indien geen andere voorschriften zijn gesteld, langszijde van
      elkaar en zo dicht mogelijk bij de oever aan de zijde van de vaarweg, waar het teken is aangebracht, ligplaats
      nemen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.06
  - number: 7.06.3
    text: De in dit artikel vermelde bijzondere ligplaatsen zijn die bedoeld in artikel 7.02, tweede lid.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.06
  - number: 7.06a.1
    text: |-
      Op ligplaatsen waar het teken B.12 ([bijlage 7][ref1]) is geplaatst en een walstroomaansluiting beschikbaar en
      bedrijfsklaar is, worden schepen aan een walstroomaansluiting aangesloten en wordt de volledige behoefte aan
      elektrische energie tijdens het stilliggen daaruit gedekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.06a
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 7.06a.2
    text: |-
      Uitzonderingen op het eerste lid kunnen worden aangegeven op een toegevoegd rechthoekig wit bord, dat onder het
      teken B.12 is aangebracht.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.06a
  - number: 7.06a.3
    text: |-
      Het eerste lid is niet van toepassing op schepen die tijdens het stilliggen uitsluitend van een energievoorziening
      gebruikmaken, die geen geluid alsmede geen schadelijke gassen en luchtverontreinigende deeltjes veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.06a
  - number: 7.07.1
    text: |-
      Een schip mag geen ligplaats nemen binnen de afstanden ten opzichte van een ander schip, een duwstel of een
      gekoppeld samenstel, zoals hieronder wordt bepaald:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.07
  - number: 7.07.1.a
    text: |-
      binnen 10 m van een schip, een duwstel of een gekoppeld samenstel dat het teken bedoeld in
      [artikel 3.14, eerste lid][ref1], voert;


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.07
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 7.07.1.b
    text: |-
      binnen 50 m van een schip, een duwstel of een gekoppeld samenstel dat de tekens bedoeld in
      [artikel 3.14, tweede lid][ref1], voert;


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.07
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 7.07.1.c
    text: |-
      binnen 100 m van een schip, een duwstel of een gekoppeld samenstel dat de tekens bedoeld in
      [artikel 3.14, derde lid][ref1], voert.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.07
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 7.07.2
    text: 'Het verbod bedoeld in het eerste lid, onder *a*, geldt niet:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.07
  - number: 7.07.2.a
    text: voor een schip, een duwstel of een gekoppeld samenstel dat eveneens dit teken voert;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.07
  - number: 7.07.2.b
    text: |-
      voor een schip, een duwstel of een gekoppeld samenstel dat dit teken niet voert, maar dat voorzien is van een
      certificaat van goedkeuring bedoeld in het ADN, nr. 8.1.8.1, en dat voldoet aan de veiligheidsvoorschriften die
      gelden voor een schip als bedoeld in [artikel 3.14, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.07
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 7.07.3
    text: |-
      Het verbod in het eerste lid geldt niet voor patrouillevaartuigen als bedoeld in
      [artikel 8, derde lid, van bijlage 3.9 bij de Binnenvaartregeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.07
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: 7.07.4
    text: |-
      Onverminderd [artikel 6, aanhef en onderdeel i, van het Binnenvaartbesluit][ref1], gelden de verboden, bedoeld in
      het eerste lid, onder a en b, niet voor de bij ministeriële regeling aan te wijzen categorieën schepen op daarvoor
      door de bevoegde autoriteit aangewezen ligplaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel6
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.07
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '6'
  - number: 7.07.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over hetgeen geregeld is in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.07
  - number: 7.07.6
    text: |-
      Dit artikel is van overeenkomstige toepassing voor de bij het ligplaats nemen in acht te nemen afstanden door een
      schip, duwstel of gekoppeld samenstel dat verplicht is een teken als bedoeld in [artikel 3.14][ref1] te voeren, ten
      opzichte van andere schepen, duwstellen en samenstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.07
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 7.07.7
    text: |-
      De bevoegde autoriteit kan voor het ligplaats nemen op andere ligplaatsen dan bedoeld in het vierde en zesde lid in
      andere gevallen kleinere afstanden toestaan dan die welke in het eerste lid zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.07
  - number: 7.08.1
    text: |-
      Een stilliggend schip dat is geladen met de stoffen, bedoeld in het ADN, nr. 7.1.5.0.1 of nr. 7.2.5.0.2, of dat na
      het vervoer van dergelijke stoffen nog niet is ontdaan van gassen die gevaar op kunnen leveren moet zijn gesteld
      onder een zich voortdurend aan boord bevindende terzake kundige wachtsman. Deze verplichting geldt niet voor een in
      een haven stilliggend schip waaraan de bevoegde autoriteit daarvan vrijstelling of ontheffing heeft verleend.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.08
  - number: 7.08.2
    text: |-
      Een ander stilliggend schip moet, voor zover het geen schipper heeft, zijn gesteld onder toezicht van een persoon
      die zo nodig snel kan ingrijpen, tenzij de bevoegde autoriteit aan een schip van deze verplichting vrijstelling
      heeft verleend, dan wel hij gedoogt dat dit zonder toezicht stilligt. Deze bepaling is eveneens van toepassing op
      een drijvend voorwerp en een drijvende inrichting wanneer zij stilliggen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.08
  - number: 7.08.3
    text: |-
      Een stilliggend schip dat het kenteken, bedoeld in [artikel 2.06][ref1], voert, is onder een zich voortdurend aan
      boord bevindende terzake kundige wachtsman gesteld, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel2
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.08
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '2'
        hoofdstuk: '2'
  - number: 7.08.3.a
    text: vloeibaar aardgas (LNG) aan boord van het schip niet als brandstof wordt verbruikt;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.08
  - number: 7.08.3.b
    text: de operationele gegevens van de LNG-installatie van het schip op afstand worden uitgelezen; en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.08
  - number: 7.08.3.c
    text: het schip onder toezicht is gesteld van een persoon die zo nodig snel kan ingrijpen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.08
  - number: 7.08.4
    text: |-
      De ter zake kundige bewaking wordt bij schepen bedoeld in het derde lid verzekerd
      door een bemanningslid dat houder is van een kwalificatiecertificaat overeenkomstig
      [artikel 15.02 van het Reglement betreffende het Scheepvaartpersoneel op de Rijn][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel15
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.08
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '15'
  - number: 7.08.5
    text: |-
      De bevoegde autoriteit kan ontheffing of vrijstelling verlenen van het derde lid. Aan de ontheffing of vrijstelling
      kunnen voorschriften verbonden worden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.08
  - number: '7.09'
    text: |-
      Een aan een aanlegplaats gemeerd schip moet gedogen, dat een ander schip langszijde komt of langszijde daarvan
      vastmaakt en daarover gemeenschap met de wal heeft anders dan om te laden of te lossen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.09
  - number: '7.10'
    text: |-
      Indien van langszijde van elkaar stilliggende schepen een schip wil vertrekken of verhalen dan wel ruimte wil
      hebben voor het langszijde komen van een schip ten behoeve van overslag, moet elk van de andere schepen daaraan de
      nodige medewerking verlenen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.10
  - number: '7.11'
    text: |-
      Een aan een aanlegplaats gemeerd schip, dat aldaar niet behoeft te worden geladen of gelost, moet verhalen, indien
      een ander schip aldaar dient te worden geladen of gelost.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel7.11
  - number: 8.01.1
    text: |-
      Een snelle motorboot moet ten name van de eigenaar zijn geregistreerd bij een door de Minister van Infrastructuur
      en Milieu aangewezen instelling. Deze instelling kent aan hem een registratieteken toe en geeft een bijbehorend
      registratiebewijs af volgens een door de Minister van Infrastructuur en Milieu vastgesteld model.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.01
  - number: 8.01.2
    text: |-
      Het registratiebewijs bedoeld in het eerste lid moet tijdens het varen met een snelle motorboot aan boord aanwezig
      zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.01
  - number: 8.01.3
    text: De Minister van Verkeer en Waterstaat kan nadere regels stellen met betrekking tot de registratie.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.01
  - number: 8.02.1
    text: |-
      Een snelle motorboot mag niet deelnemen aan de scheepvaart indien hij niet is voorzien van het, door de in
      [artikel 8.01, eerste lid][ref1], bedoelde instelling toegekende registratieteken. Dit teken bestaat uit een
      of meer letters en een nummer, met een hoogte van ten minste 150 mm, een breedte van ten minste 100 mm en een
      stamdikte van ten minste 20 mm. Het moet goed waarneembaar zijn en in een van de ondergrond afwijkende kleur zijn
      aangebracht aan weerszijden van de boot.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel8
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.02
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.02.2
    text: |-
      Een snelle motorboot, welke tengevolge van de constructie niet kan voldoen aan het in het eerste lid bepaalde
      omtrent de grootte van de registratieletters en nummers, moet zijn voorzien van een of meer letters en een nummer
      van ten minste respectievelijk 100 mm, 60 mm en 15 mm.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.02
  - number: '8.03'
    text: 'Een snelle motorboot mag slechts deelnemen aan de scheepvaart indien:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.03
  - number: 8.03.a
    text: |-
      de inrichting van het schip en van de motor zodanig is, dat gevaar voor brand of ontploffing en hinder voor de
      omgeving door rook, damp of walm wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.03
  - number: 8.03.b
    text: de afgewerkte gassen door een behoorlijk geluiddempende voorziening worden afgevoerd;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.03
  - number: 8.03.c
    text: de stuurinrichting deugdelijk en doelmatig is;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.03
  - number: 8.03.d
    text: |-
      het schip is voorzien van een technische inrichting waardoor bij het onderbreken van de besturing de middelen tot
      voortbeweging onmiddellijk tot stilstand of nagenoeg tot stilstand komen; deze eis geldt niet voor een gesloten
      binnenbesturing;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.03
  - number: 8.03.e
    text: een reddingsvest onder handbereik voor ieder der opvarenden aan boord is;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.03
  - number: 8.03.f
    text: een deugdelijk brandblusapparaat aan boord is.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.03
  - number: '8.04'
    text: |-
      De eigenaar of houder van een snelle motorboot draagt er mede zorg voor dat niet in strijd met de
      [artikelen 8.01][ref1], [8.02][ref2] en [8.03][ref3] wordt gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003628#Artikel8
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.04
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0003628
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.05.1
    text: 'De bestuurder van een snelle motorboot moet tijdens het varen:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.05
  - number: 8.05.1.a
    text: zijn gezeten op de voor hem bestemde zitplaats;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.05
  - number: 8.05.1.b
    text: |-
      te allen tijde gebruik maken van de technische inrichting, bedoeld in [artikel 8.03 onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel8
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.05
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.05.1.c
    text: zich zodanig gedragen, dat geen hinder of gevaar voor andere gebruikers van het vaarwater wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.05
  - number: 8.05.2
    text: De bestuurder draagt er zorg voor dat de motor van een snelle motorboot geen onnodige geluidhinder veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.05
  - number: 8.05.3
    text: |-
      De bestuurder draagt er zorg voor dat de motor van een stilliggende snelle motorboot niet onnodig lang of zonder
      redelijk doel in werking wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.05
  - number: 8.05.4
    text: |-
      De verplichting, genoemd in het eerste lid, onder *a*, is niet van toepassing indien de constructie van een snelle
      motorboot zodanig is dat de bestuurder het schip ook veilig staande dan wel slechts staande kan besturen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.05
  - number: 8.05.5
    text: |-
      De bestuurder die staande een snelle motorboot bestuurt is verplicht een reddingsvest te dragen. Dit geldt niet
      voor het sturen vanaf een gesloten binnenbesturing.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.05
  - number: 8.06.1
    text: |-
      Een snelle motorboot mag niet sneller varen dan 20 km per uur ten opzichte van het water. De bevoegde autoriteit
      kan vaarwegen of gedeelten daarvan aanwijzen waarop dit verbod niet van toepassing is dan wel waarop een andere
      maximum snelheid van toepassing is, daarbij kan onderscheid worden gemaakt tussen snel varen overdag of ’s nachts,
      tussen bedrijfsmatige vaart en recreatieve vaart en veerdiensten.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.06
  - number: 8.06.2
    text: |-
      Het is verboden te waterskiën of te doen waterskiën of op soortgelijke wijze van de vaarweg gebruik te maken
      of gebruik te doen maken. De bevoegde autoriteit kan vaarwegen of gedeelten daarvan aanwijzen waarop dit verbod
      overdag niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.06
  - number: 8.06.3
    text: |-
      De bestuurder van een snelle motorboot, die één of meer waterskiërs of personen die op soortgelijke wijze van de
      vaarweg gebruik maken voortbeweegt, moet zich doen bijstaan door een mede opvarende van ten minste 15 jaar oud
      als uitkijk.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.06
  - number: 8.06.4
    text: |-
      Een waterskiër en een persoon die op soortgelijke wijze van de vaarweg gebruik maakt moeten zich zodanig gedragen,
      dat geen gevaar of hinder voor andere gebruikers van de vaarweg kan worden veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.06
  - number: '8.07'
    text: |-
      De schipper van een snelle motorboot moet er zorg voor dragen, dat niet in strijd met de artikelen 8.05 en 8.06
      wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.07
  - number: 8.08.1
    text: |-
      Een persoon die zwemt dan wel die op andere wijze watersport bedrijft zonder gebruik te maken van een schip moet
      voldoende afstand houden van een varend schip of een varend drijvend voorwerp dan wel van een drijvend werktuig
      in bedrijf.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.08
  - number: 8.08.2
    text: 'Zwemmen, watersport zonder gebruik te maken van een schip en onderwatersport zijn verboden:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.08
  - number: 8.08.2.a
    text: op een wachtplaats of in de onmiddellijke nabijheid van een brug, een sluis of een stuw;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.08
  - number: 8.08.2.b
    text: in gedeelten van de vaarweg bestemd voor de doorgaande scheepvaart;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.08
  - number: 8.08.2.c
    text: in routes van veerponten;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.08
  - number: 8.08.2.d
    text: in havens en nabij de ingangen daarvan;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.08
  - number: 8.08.2.e
    text: in de nabijheid van meergelegenheden;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.08
  - number: 8.08.2.f
    text: in gebieden aangewezen voor snelvaren of waterskiën;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.08
  - number: 8.08.2.g
    text: in de door de bevoegde autoriteit aangewezen gebieden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.08
  - number: 8.08.3
    text: |-
      De bevoegde autoriteit kan vrijstelling of ontheffing verlenen van het tweede lid. Aan de vrijstelling of
      ontheffingen kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.08
  - number: 8.09.1
    text: |-
      Alvorens te beginnen met het bunkeren van vloeibaar aardgas (LNG) vergewist de schipper van het schip dat gaat
      bunkeren zich ervan dat:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.09
  - number: 8.09.1.a
    text: de voorgeschreven brandbestrijdingsmiddelen te allen tijde operationeel zijn; en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.09
  - number: 8.09.1.b
    text: |-
      tussen het schip en de kade de voorgeschreven middelen aanwezig zijn voor de evacuatie van personen aan boord van
      het schip dat gaat bunkeren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.09
  - number: 8.09.2
    text: |-
      Tijdens het bunkeren van vloeibaar aardgas (LNG) zijn alle toegangen en alle openingen van ruimten toegankelijk
      vanaf het dek en alle openingen van ruimten naar de buitenlucht gesloten, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.09
  - number: 8.09.2.a
    text: aanzuigopeningen van in bedrijf zijnde motoren;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.09
  - number: 8.09.2.b
    text: ventilatieopeningen van machinekamers indien de motoren in bedrijf zijn;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.09
  - number: 8.09.2.c
    text: ventilatieopeningen voor een ruimte met een overdrukinstallatie; en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.09
  - number: 8.09.2.d
    text: |-
      ventilatieopeningen van een airconditioningsinstallatie, indien deze openingen zijn voorzien van een gasdetectie-
      installatie.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.09
  - number: 8.09.3
    text: |-
      Tijdens het bunkeren van vloeibaar aardgas (LNG) vergewist de schipper zich er voortdurend van dat het rookverbod
      aan boord en in de bunkerzone wordt nageleefd. Het rookverbod is eveneens van toepassing op elektronische
      sigaretten en andere soortgelijke apparaten. Het rookverbod is niet van toepassing in de accommodatieruimten en het
      stuurhuis, indien daarvan de ramen, deuren, schijnlichten en luiken gesloten zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.09
  - number: 8.09.4
    text: Na het bunkeren van vloeibaar aardgas (LNG) worden alle vanaf het dek toegankelijke ruimten ontlucht.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel8.09
  - number: '9.01'
    text: |-
      Dit hoofdstuk is van toepassing op de in
      [artikel 2, eerste en derde lid, van het Vaststellingsbesluit Binnenvaartpolitiereglement][ref1] bedoelde
      vaarwegen, voorzover deze in beheer zijn bij het Rijk en op de in [bijlage 10][ref2] vermelde vaarwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003627#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.01
    references:
      - id: ref1
        bwb_id: BWBR0003627
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003628
  - number: 9.02.1
    text: |-
      Een schip of samenstel houdt zich op de bij ministeriële regeling vastgestelde vaarwegen en kunstwerken aan de in
      die regeling aangegeven grootste lengte, breedte en diepgang.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.02
  - number: 9.02.2
    text: |-
      Een schip of samenstel voldoet aan de in het eerste lid gestelde eisen, wanneer deze wordt aangemerkt als bijzonder
      transport in de zin van [artikel 1.21, eerste lid][ref1], en daaraan een vergunning is verstrekt op grond van
      artikel 1.21, tweede lid, waarin de lengte, breedte en diepgang van de vaarwegen en kunstwerken op de door het
      schip of samenstel af te leggen route in aanmerking zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel1
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.02
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.02.3
    text: |-
      De bevoegde autoriteit kan ontheffing verlenen van het eerste lid. Deze kan onder beperkingen worden verleend en
      hieraan kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.02
  - number: 9.03.1
    text: |-
      Het is verboden op de in bijlage 14, onder *a*, vermelde vaarwegen, of gedeelten daarvan, ligplaats te nemen
      (ankeren en meren).
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.03
  - number: 9.03.2
    text: |-
      Op een gedeelte van een vaarweg waar ligplaats nemen is toegestaan mogen een schip, een drijvend voorwerp en een
      drijvende inrichting, behoudens toestemming van de bevoegde autoriteit, niet:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.03
  - number: 9.03.2.a
    text: aan herstelwerkzaamheden worden onderworpen;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.03
  - number: 9.03.2.b
    text: laden, lossen; of
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.03
  - number: 9.03.2.c
    text: |-
      ventileren naar de atmosfeer, bedoeld in
      [artikel 1, derde lid, onderdeel u, van het Scheepsafvalstoffenbesluit Rijn- en binnenvaart][ref1], onverminderd
      het verbod in [artikel 4 van dat besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel4
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.03
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '4'
  - number: 9.03.3
    text: |-
      In een vlucht- of overnachtingshaven en een werkhaven mogen een schip, een drijvend voorwerp en een drijvende
      inrichting, behoudens toestemming van de bevoegde autoriteit, niet:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.03
  - number: 9.03.3.a
    text: langer dan drie achtereenvolgende dagen ligplaats nemen;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.03
  - number: 9.03.3.b
    text: binnen twaalf uren, nadat de onder a bedoelde periode is beëindigd, opnieuw ligplaats nemen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.03
  - number: 9.03.4
    text: |-
      Een duwstel als bedoeld in artikel 9.06, eerste lid, mag slechts worden samengesteld of ontkoppeld op de door de
      bevoegde autoriteit aangewezen plaatsen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.03
  - number: 9.03.5
    text: |-
      Het in het eerste lid genoemde verbod is op de in bijlage 14, onder *b*, genoemde vaarwegen niet van toepassing op
      een klein schip dat op een veilige plaats buiten het voor de doorgaande scheepvaart bestemde vaarwater ligt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.03
  - number: 9.03.6
    text: |-
      De bevoegde autoriteit kan ontheffing verlenen van het eerste lid. Deze kan onder beperkingen worden verleend
      en hieraan kunnen voorschriften worden verbonden. Deze mogelijkheid om ontheffing te verlenen geldt ook voor het
      ligplaats nemen door het gebruik van spudpalen, dat op grond van [artikel 7.03, eerste lid, onderdeel a][ref1],
      verboden is op de vaarwegen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel7
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.03
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '7'
        hoofdstuk: '7'
  - number: 9.04.1
    text: |-
      Op de in [bijlage 15, onder a][ref1], vermelde vaarwegen mag een klein schip slechts varen indien het is voorzien
      van een motor die voor onmiddellijk gebruik gereed is, en waarmee een snelheid van ten minste 6 kilometer per uur
      ten opzichte van het water kan worden gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.04
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 9.04.2
    text: |-
      Op de in het eerste lid bedoelde vaarwegen, met uitzondering van de Waal, de Boven-Rijn, de Geldersche IJssel,
      de Neder-Rijn en het Pannerdensch Kanaal, moet een klein schip zo veel mogelijk aan de stuurboordszijde van het
      vaarwater varen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.04
  - number: 9.04.3
    text: Op de in het eerste lid bedoelde vaarwegen is het niet toegestaan het vaarwater op te kruisen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.04
  - number: 9.04.4
    text: |-
      Het in het eerste lid genoemde verbod, is op de daar bedoelde vaarwegen, met uitzondering van de vaarweg ten
      westen van de sluizen te IJmuiden, niet van toepassing op schepen die bestemd zijn om door spierkracht te worden
      voortbewogen en ook daadwerkelijk als zodanig worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.04
  - number: 9.04.5
    text: |-
      Op de vaarweg ten westen van de sluizen te IJmuiden kan de bevoegde autoriteit aan in het vierde lid bedoelde
      schepen ontheffing verlenen van de in het eerste lid vermelde vereisten. Aan een ontheffing kunnen voorschriften
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.04
  - number: 9.04.6
    text: |-
      Op de in [bijlage 15, onder b][ref1], genoemde vaarwegen moeten een varend en een geankerd klein schip bij slecht
      zicht een goed functionerende radarreflector voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.04
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 9.05.1
    text: |-
      Onverminderd [artikel 9.04, eerste lid][ref1], is het op de voor de doorgaande vaart bestemde gedeelten van de in
      [bijlage 16][ref2] opgenomen vaarwegen verboden te varen met een zeilplank.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.05
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003628
  - number: 9.05.2
    text: Het is verboden te varen met een door een vlieger voortbewogen plank of klein schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.05
  - number: 9.05.3
    text: |-
      De bevoegde autoriteit kan vaarwegen of gedeelten daarvan aanwijzen waarop het verbod, bedoeld in het tweede lid,
      overdag niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.05
  - number: 9.06.1
    text: |-
      Op de in [bijlage 17, onder a][ref1], vermelde vaarwegen mogen een duwstel en een gekoppeld samenstel waarvan de
      lengte meer bedraagt dan 193 m ofwel de breedte meer bedraagt dan 22,90 m varen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 9.06.1.a
    text: |-
      de ten hoogste toegelaten afmetingen zijn vermeld in het certificaat van onderzoek van de duwboot of van het
      motorschip dat dient voor het voortbewegen en het sturen van het samenstel onder vermelding van de toegelaten
      formatie en van de toegelaten belading voor de van toepassing zijnde vaarrichting;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
  - number: 9.06.1.b
    text: |-
      het duwstel niet meer dan zes duwbakken bevat, waarbij in afvaart ten hoogste vier duwbakken een diepgang van 1,50
      m of meer mogen hebben. Zeeschipbakken mogen slechts langszijde van andere duwbakken vastgemaakt worden meegevoerd,
      waarbij vier zeeschipbakken achter elkaar gelden als één duwbak;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
  - number: 9.06.1.c
    text: |-
      aan de kop van het samenstel een vanuit de stuurhut van de duwboot of van het motorschip dat dient voor het
      voortbewegen en het sturen van het samenstel bedienbare kopbesturing beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
  - number: 9.06.1.d
    text: de waterstand aan de peilschaal te Lobith tussen 8,50 m en 13,50 m is gelegen;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
  - number: 9.06.1.e
    text: |-
      het geen gevaarlijke stoffen vervoert voor het vervoer waarvan een certificaat van goedkeuring als bedoeld in het
      ADN vereist wordt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
  - number: 9.06.2
    text: 'Onverminderd het eerste lid geldt voor duwstellen met een duwboot met een lengte van niet meer dan 40 m:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
  - number: 9.06.2.a
    text: het maximale vermogen van de aandrijving van de duwboot mag niet groter zijn dan 4500 kW;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
  - number: 9.06.2.b
    text: |-
      in de lange formatie moeten tenminste vier duwbakken een diepgang van 2,50 m of meer hebben. In de brede formatie
      mag ook zonder kopbesturing worden gevaren, indien tenminste twee en ten hoogste vier duwbakken een diepgang van
      2,50 m of meer hebben en twee daarvan in de as van het duwstel zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
  - number: 9.06.3
    text: |-
      Op de in [bijlage 17, onder b][ref1], vermelde vaarwegen mag een duwstel waarvan de lengte meer bedraagt dan 110 m
      slechts bij buitengewone plaatselijke omstandigheden varen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 9.06.3.a
    text: |-
      het is voorzien van een kopbesturing van voldoende effectief vermogen, die vanuit de stuurhut van de duwboot
      kan worden bediend; indien de kopbesturing bestaat uit koproeren moeten deze voor iedere betreffende duwbak een
      effectieve oppervlakte van tenminste 2 m2 hebben;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
  - number: 9.06.3.b
    text: |-
      de gemiddelde diepgang groter is dan 2,00 m of de diepgang over tenminste 50% van de lengte van de duwbakken groter
      is dan 2,50 m; of
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
  - number: 9.06.3.c
    text: het duwstel wordt geassisteerd.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
  - number: 9.06.4
    text: |-
      Op de in [bijlage 17, onder c][ref1], vermelde vaarwegen mogen een alleenvarend motorschip en een duwstel en een
      gekoppeld samenstel waarvan de lengte meer bedraagt dan 90 m varen, indien zij zijn voorzien van een kopbesturing
      van voldoende effectief vermogen die vanuit de stuurhut kan worden bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 9.06.5
    text: |-
      Op de in [bijlage 17, onder d][ref1], vermelde vaarwegen mag een duwstel dat is voorzien van een certificaat van
      onderzoek als bedoeld in [artikel 7, tweede lid, van de Binnenvaartwet][ref2] of van een document als bedoeld in
      [artikel 7, onderdelen a en c, van het Binnenvaartbesluit][ref3] en waarvan de lengte meer bedraagt dan 137 m doch
      niet meer dan 193 m varen, indien het is voorzien van een kopbesturing van voldoende effectief vermogen die vanuit
      de stuurhut kan worden bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0025631#Artikel7
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
    references:
      - id: ref1
        bwb_id: BWBR0003628
      - id: ref2
        bwb_id: BWBR0023009
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0025631
        artikel: '7'
  - number: 9.06.6
    text: |-
      Op de in [bijlage 17][ref1], onder e, vermelde vaarwegen mogen een alleenvarend motorschip en een duwstel en een
      gekoppeld samenstel waarvan de lengte meer bedraagt dan 65 m varen, indien zij zijn voorzien van een kopbesturing
      van voldoende effectief vermogen die vanuit de stuurhut kan worden bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 9.06.7
    text: |-
      Op de in [bijlage 17][ref1], onder f, vermelde vaarwegen mogen een alleenvarend motorschip en een duwstel en een
      gekoppeld samenstel waarvan de lengte meer bedraagt dan 110 m varen, indien zij zijn voorzien van een kopbesturing
      van voldoende effectief vermogen die vanuit de stuurhut kan worden bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 9.06.8
    text: |-
      Als kopbesturing van een duwstel wordt tevens beschouwd de boegschroef van de duwboot, indien deze zich op ten
      hoogste 45% van de lengte van het duwstel gerekend vanaf de kop daarvan bevindt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
  - number: 9.06.9
    text: |-
      De in dit artikel bedoelde duwstellen en gekoppelde samenstellen mogen buiten de daarvoor aangewezen ligplaatsen
      slechts met toestemming van de bevoegde autoriteit worden samengesteld of ontkoppeld.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
  - number: 9.06.10
    text: |-
      De bevoegde autoriteit kan duwstellen en gekoppelde samenstellen met grotere afmetingen dan die welke volgens
      dit artikel zijn toegelaten, met andere wijzen van aandrijving en vermogen en bij andere waterstanden voor het te
      bevaren vaarweggedeelte toelaten.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.06
  - number: 9.07.1
    text: |-
      Een groot schip van een door de bevoegde autoriteit aangegeven categorie, een bijzonder transport, een drijvende
      inrichting en een drijvend voorwerp waarvan het verplaatsen klaarblijkelijk geen hinder of gevaar voor de
      scheepvaart en geen schade aan de kunstwerken kan veroorzaken, melden zich op de door de bevoegde autoriteit
      aangegeven wijze, overeenkomstig de daartoe gestelde regels.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.07
  - number: 9.07.2
    text: |-
      Een in het eerste lid bedoeld groot schip, luistert op de in [bijlage 9][ref1] en [bijlage 10][ref2] genoemde
      vaarwegen uit en neemt zonodig deel aan de ter plaatse gevoerde communicatie op het door de bevoegde autoriteit
      aangewezen marifoonkanaal, overeenkomstig de daartoe gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
      [ref2]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.07
    references:
      - id: ref1
        bwb_id: BWBR0003628
      - id: ref2
        bwb_id: BWBR0003628
  - number: 9.07.3
    text: |-
      De in het eerste lid bedoelde meldingsplicht is tevens van toepassing op een klein schip, waarmee wordt vervoerd
      een gevaarlijke stof als bedoeld in artikel 3, onderdeel g, of een schadelijke stof als bedoeld in artikel 3,
      onderdeel h, van [richtlijn nr. 2002/59/EG](32002L0059).
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.07
  - number: 9.07.4
    text: |-
      De in het tweede lid bedoelde uitluister- en communicatieplicht is tevens van toepassing op een klein schip,
      wanneer het de in het derde lid bedoelde stoffen vervoert, of wanneer het een klein schip betreft dat is uitgerust
      met een marifooninstallatie.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.07
  - number: 9.07.5
    text: |-
      De in het eerste en derde lid bedoelde meldingsplicht is niet van toepassing op een schip dat zich reeds op grond
      van [artikel 2 van het Besluit meldingsformaliteiten en gegevensverwerkingen scheepvaart][ref1] en de daarop
      berustende bepalingen voor vertrek moet melden.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel2
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.07
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '2'
  - number: 9.07.6
    text: |-
      De in het eerste en tweede lid bedoelde regels kunnen betrekking hebben op het gebruik van bepaalde
      communicatiemiddelen aan boord van het schip, het melden van aankomst, vertrek of positie van het schip, alsmede op
      gegevens met betrekking tot het schip, de daarmee vervoerde lading of de uit te voeren reis.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.07
  - number: '9.08'
    text: |-
      Het is verboden op de in [bijlage 18][ref1] vermelde vaarwegen, behoudens toestemming van de bevoegde autoriteit,
      varend brandstof af te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel9.08
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 10.01.1
    text: |-
      Dit hoofdstuk is van toepassing op de vaarwegen en havens, genoemd in [bijlage 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.01
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 10.01.2
    text: Onder een haven is een laad- of losplaats begrepen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.01
  - number: 10.02.1
    text: |-
      Een bovenmaats zeegaand schip moet op de daartoe aangewezen vaarwegen de daartoe vastgestelde voorschriften in
      acht nemen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.02
  - number: 10.02.2
    text: 'De in het eerste lid bedoelde voorschriften kunnen betreffen:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.02
  - number: 10.02.2.a
    text: de toegelaten afmetingen van een schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.02
  - number: 10.02.2.b
    text: de bouw, de uitrusting, het motorvermogen en de manoeuvreerbaarheid van een schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.02
  - number: 10.02.2.c
    text: de grootste snelheid waarmede mag worden gevaren;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.02
  - number: 10.02.2.d
    text: de meteorologische omstandigheden waaronder mag worden gevaren;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.02
  - number: 10.02.2.e
    text: de te volgen route.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.02
  - number: '10.03'
    text: |-
      Een varend bovenmaats zeegaand schip moet, op de wijze en wat de lichten betreft met de lichtsterkte en de kleur,
      vermeld in de internationale bepalingen ter voorkoming van aanvaringen op zee, behalve de tekens bedoeld in
      [artikel 3.08][ref1], als bijkomende tekens voeren:


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.03
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 10.03.a
    text: '’s nachts: drie rode rondom schijnende lichten in een verticale lijn;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.03
  - number: 10.03.b
    text: 'overdag: een zwarte cilinder.'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.03
  - number: 10.04.1
    text: |-
      Een zeegaand schip dat gevaarlijke stoffen vervoert, bedoeld in [bijlage 12][ref1], moet als bijkomende tekens
      voeren:


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.04
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 10.04.1.a
    text: '’s nachts: een rood helder rondom schijnend licht;'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.04
  - number: 10.04.1.b
    text: 'overdag: de internationale seinvlag «B».'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.04
  - number: 10.04.2
    text: Deze tekens moeten worden gevoerd daar waar zij het best kunnen worden gezien en op een hoogte van ten minste 6 m.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.04
  - number: '10.05'
    text: Een zeegaand schip mag de internationale vlaggeseinen "A", "B", "G", "H", "P", "Q" en "Z" geven.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.05
  - number: 10.06.1
    text: |-
      Een zeegaand motorschip behoeft niet het gele lichtsein, bedoeld in [artikel 4.01, tweede lid][ref1], te tonen,
      maar mag dit tonen.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel4
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.06
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '4'
        hoofdstuk: '4'
  - number: 10.06.2
    text: |-
      Een zeegaand schip mag de algemene geluidsseinen, vermeld in [afdeling A van bijlage 6][ref1], aanvullen met een
      wit lichtsein als bedoeld in de internationale bepalingen ter voorkoming van aanvaringen op zee. Het schip mag dan
      niet het in het eerste lid bedoelde gele lichtsein tonen.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.06
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 10.06.3
    text: Het witte lichtsein mag afhankelijk van de omstandigheden worden herhaald.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.06
  - number: 10.06.4
    text: Dit artikel geldt niet voor klokslagen en reeksen klokslagen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.06
  - number: 10.08.1
    text: |-
      In afwijking van [hoofdstuk 6][ref1] is een schip verplicht aan een bovenmaats zeegaand schip voorrang te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.08
    references:
      - id: ref1
        bwb_id: BWBR0003628
        hoofdstuk: '6'
  - number: 10.08.2
    text: |-
      [Artikel 6.09, tweede lid][ref1], geldt niet voor een schip dat de lichten of het dagteken, bedoeld in
      [artikel 10.03][ref2], voert en dat wordt opgelopen door een ander schip.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel10
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.08
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '6'
        hoofdstuk: '6'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.08.3
    text: |-
      Indien één van twee schepen die elkaar naderen op tegengestelde koersen een schip is dat de lichten of het
      dagteken, bedoeld in [artikel 10.03][ref1], voert, is [artikel 6.04a][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel6
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.08
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '6'
        hoofdstuk: '6'
        afdeling: II
  - number: 10.08.4
    text: |-
      Schepen die de lichten of het dagteken, bedoeld in [artikel 10.03][ref1], voeren moeten zich behoudens het derde
      lid onderling gedragen naar de vaarregels van [hoofdstuk 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.08
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003628
        hoofdstuk: '6'
  - number: '10.09'
    text: |-
      Een schip mag behalve bij voorbijlopen en bij voorbijvaren op tegengestelde koersen niet varen binnen een afstand
      van 50 m van een schip dat het licht of het dagteken, bedoeld in artikel 10.04, eerste lid, voert.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.09
  - number: 10.10.1
    text: |-
      Een schip mag geen ligplaats nemen binnen een afstand van 50 m van een schip dat het licht of het dagteken, bedoeld
      in artikel 10.04, eerste lid, voert.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.10
  - number: 10.10.2
    text: |-
      Een schip dat het licht of het dagteken, bedoeld in [artikel 10.04, eerste lid][ref1], voert, mag geen ligplaats
      nemen binnen een afstand van 50 meter van andere schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel10
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.10
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.10.3
    text: De bevoegde autoriteit kan voor het ligplaats nemen afwijkingen toestaan.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.10
  - number: '10.11'
    text: |-
      In afwijking van [artikel 4.05, eerste lid][ref1], mag een zeegaand groot schip zijn uitgerust met een
      marifooninstallatie van het type dat voor het gebruik in de frequentieband van 156 –174 MHz is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel4
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel10.11
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '4'
        hoofdstuk: '4'
  - number: 12.01.1
    text: Dit hoofdstuk is slechts van toepassing op de met de Westerschelde in open verbinding staande havens en voorhavens.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.01
  - number: 12.01.2
    text: Onder een haven is een laad- of losplaats begrepen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.01
  - number: 12.02.1
    text: |-
      Het zeegaand motorschip aan de kop van een sleep alsmede het zeegaand motorschip dat een motorschip,
      een duwstel of een gekoppeld samenstel assisteert mag in plaats van het gele licht, bedoeld in
      [artikel 3.09, eerste lid, onder c][ref1], een heklicht voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.02
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 12.02.2
    text: |-
      Indien een sleep verscheidene zeegaande motorschepen bevat, die niet in kiellinie varen, dan wel verscheidene
      motorschepen tezamen een motorschip, een duwstel of een gekoppeld samenstel assisteren, is het eerste lid van
      toepassing op elk van deze zeegaande schepen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.02
  - number: 12.02.3
    text: |-
      Een zeegaand schip dat wordt gesleept mag een toplicht of achter dit toplicht een tweede toplicht overeenkomstig
      [artikel 3.08, eerste en tweede lid][ref1], voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.02
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 12.02.4
    text: |-
      Een motorschip, waarvoor bij [artikel 3.09, eerste en tweede lid][ref1], een gele cylinder is voorgeschreven,
      behoeft deze niet te voeren maar het mag dit doen. Een motorschip, een duwstel of een gekoppeld samenstel, waarvoor
      bij [artikel 3.09, derde lid][ref2], een gele bol is voorgeschreven, behoeft deze niet te voeren maar het mag dit
      doen.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.02
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: 12.02.5
    text: |-
      Indien een duwstel door één of meer motorschepen wordt geassisteerd, behoeven de drie lichten op de duwboot niet
      overeenkomstig [artikel 3.10, tweede lid][ref1], gele lichten te zijn maar zij mogen dit zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.02
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: II
  - number: '12.03'
    text: |-
      Een schip van de veerdiensten over de Westerschelde, dat op zijn aanlegplaats stilligt terwijl het dienst doet, mag
      de lichten blijven voeren die zijn voorgeschreven voor een varend schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.03
  - number: '12.04'
    text: 'Een zeegaand schip mag, indien de radarinstallatie goed functioneert, gebruik maken van radar:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.04
  - number: 12.04.a
    text: |-
      zonder te zijn uitgerust met een radarinstallatie en een bochtaanwijzer, als bedoeld in
      [artikel 4.06, eerste lid, onder a][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel4
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.04
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '4'
        hoofdstuk: '4'
  - number: 12.04.b
    text: |-
      zonder dat zich aan boord een persoon bevindt die houder is van een radarpatent, als bedoeld in
      [artikel 4.06, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel4
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.04
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '4'
        hoofdstuk: '4'
  - number: 12.05.1
    text: |-
      Een schip mag niet uit een haven of een voorhaven het vaarwater van de Westerschelde invaren, indien daardoor
      een schip dat dit vaarwater in een gestrekte koers volgt zou worden genoodzaakt zijn koers of zijn snelheid te
      wijzigen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.05
  - number: 12.05.2
    text: |-
      Onverminderd het eerste lid mag een tankschip, dat samengeperste vloeibaar gemaakte of onder druk opgeloste gassen
      vervoert, niet zonder toestemming van de bevoegde autoriteit uit een haven of een voorhaven het vaarwater van de
      Westerschelde invaren.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.05
  - number: '12.06'
    text: |-
      Een zeegaand schip mag op radar varen, zonder dat zich overeenkomstig [artikel 6.32, eerste lid][ref1], een persoon
      in de stuurhut bevindt die houder is van een radarpatent, als bedoeld in [artikel 4.06, eerste lid, onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel4
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.06
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '6'
        hoofdstuk: '6'
        afdeling: VI
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '4'
        hoofdstuk: '4'
  - number: 12.07.1
    text: |-
      Bij slecht zicht mag een varend schip, indien het gestopt ligt en geen vaart door het water loopt, in plaats van
      één lange stoot als bedoeld in de artikelen 6.32, vierde lid, en 6.33, eerste lid, geven: twee opeenvolgende lange
      stoten met een tijdruimte daartussen van ongeveer twee seconden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.07
  - number: 12.07.2
    text: |-
      Het schip moet het in het eerste lid bedoelde sein, voor zover dit wordt gegeven ingevolge artikel 6.33, eerste
      lid, herhalen met tussenpozen van ten hoogste twee minuten.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel12.07
  - number: '13.01'
    text: |-
      Behoudens toestemming van de bevoegde autoriteit is het verboden op de rede van Den Helder en in het havengebied te
      dreggen, dan wel zich met snorkel-, duik- of soortgelijke uitrustingsstukken te water te bevinden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel13.01
  - number: '13.02'
    text: |-
      Behoudens toestemming van de bevoegde autoriteit is het verboden met andere schepen dan schepen der krijgsmacht de
      marinehaven te Willemsoord anders te bevaren dan noodzakelijk voor de rechtstreekse doorvaart.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel13.02
  - number: 13.03.1
    text: |-
      De bevoegde autoriteit kan ten behoeve van de veilige in- of uitvaart van de marinehaven Willemsoord door schepen
      die door hem worden aangewezen, de overige scheepvaart een verkeersaanwijzing geven inhoudende een tijdelijk verbod
      deze haven in of uit te varen en zich te bevinden binnen 200 meter aan weerszijden van de lichtenlijn, zowel op de
      rede van Den Helder binnen één zeemijl vanaf de havenmond, als in deze haven.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel13.03
  - number: 13.03.2
    text: |-
      Wanneer de in het eerste lid bedoelde verkeersaanwijzing is gegeven, wordt dit kenbaar gemaakt door het tonen van
      het teken A.1 (bijlage 7) op het Havencoördinatiecentrum Harssens.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel13.03
