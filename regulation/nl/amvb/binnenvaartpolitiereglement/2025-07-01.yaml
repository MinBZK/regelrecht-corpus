  - number: 1.03.1
    text: |-
      Een lid van de bemanning van een schip moet de aanwijzingen opvolgen die hem door de schipper binnen de grenzen van
      diens verantwoordelijkheid worden gegeven. Hij moet ook zonder diens aanwijzing medewerken aan de naleving van de
      bepalingen van dit reglement.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.03
  - number: 1.03.2
    text: |-
      Ieder ander die zich aan boord van een schip bevindt moet de aanwijzingen opvolgen die hem door de schipper in het
      belang van de veiligheid van de scheepvaart of van de goede orde aan boord worden gegeven.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.03
  - number: 1.03.3
    text: |-
      Een lid van de bemanning en ieder ander persoon die zich aan boord bevindt en die tijdelijk zelfstandig de koers en
      de snelheid van een schip bepaalt, is eveneens verantwoordelijk voor de naleving van dit reglement.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.03
  - number: '1.04'
    text: |-
      De schipper moet, ook bij ontbreken van uitdrukkelijke voorschriften in dit reglement, alle voorzorgsmaatregelen
      nemen die volgens goede zeemanschap of door de omstandigheden waarin het schip of het samenstel zich bevindt zijn
      geboden, teneinde met name te voorkomen dat:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.04
  - number: 1.04.a
    text: het leven van personen in gevaar wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.04
  - number: 1.04.b
    text: |-
      schade wordt veroorzaakt aan andere schepen of aan drijvende voorwerpen, dan wel aan oevers of aan werken en
      inrichtingen van welke aard ook die zich in de vaarweg of op de oevers daarvan bevinden;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.04
  - number: 1.04.c
    text: de veiligheid of het vlotte verloop van de scheepvaart in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.04
  - number: '1.05'
    text: |-
      De schipper moet in het belang van de veiligheid of de goede orde van de scheepvaart, voorzover dit door de
      bijzondere omstandigheden waarin het schip of het samenstel zich bevindt is geboden, volgens goede zeemanschap
      afwijken van de bepalingen van dit reglement.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.05
  - number: '1.06'
    text: |-
      Een schip of een samenstel mag niet deelnemen aan de scheepvaart, indien de lengte, de breedte, de hoogte boven
      water, de diepgang, de manoeuvreerbaarheid of de snelheid van dit schip of dit samenstel niet verenigbaar zijn met
      de karakteristiek en met de afmetingen van de vaarweg en van de kunstwerken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.06
  - number: 1.07.1
    text: |-
      Een schip mag niet deelnemen aan de scheepvaart indien het zodanig is beladen, dat het inzinkt tot over het vlak
      door de onderkant van de inzinkingsmerken voor de vaarweg welke het bevaart, dan wel tot over de lijn voor de
      uitwatering vastgesteld voor de vaarweg welke het bevaart.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.07
  - number: 1.07.2
    text: |-
      Een schip mag niet deelnemen aan de scheepvaart indien door de wijze van belading de stabiliteit in gevaar wordt
      gebracht. Tijdens de vaart mag de lading het vrije uitzicht niet meer beperken dan tot 350 m voor het schip of het
      samenstel. In afwijking van de vorige volzin, mag het vrije uitzicht bij het gelijktijdige gebruik van radar en
      camera-installaties tot 500 m voor de boeg worden beperkt, indien
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.07
  - number: 1.07.2.a
    text: door bedoelde hulpmiddelen het uitzicht van 350 m tot 500 m voor de boeg wordt gewaarborgd,
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.07
  - number: 1.07.2.b
    text: |-
      aan de eisen van [artikel 6.32, eerste lid][ref1], wordt voldaan,


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel6
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.07
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '6'
        hoofdstuk: '6'
        afdeling: VI
  - number: 1.07.2.c
    text: de radarantennes en de camera’s aan de boeg van het schip zijn geïnstalleerd,
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.07
  - number: 1.07.2.d
    text: deze hulpmiddelen overeenkomstig artikel 7.02 ES-TRIN als geschikt erkend zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.07
  - number: 1.07.3
    text: |-
      De stabiliteit van de volgende schepen die containers vervoeren moet bovendien voor het begin van de reis worden
      gecontroleerd:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.07
  - number: 1.07.3.a
    text: schepen met een breedte van minder dan 9,50 m, indien de containers in meer dan één laag zijn geladen,
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.07
  - number: 1.07.3.b
    text: schepen met een breedte van 9,50 m tot 11 m, indien de containers in meer dan twee lagen zijn geladen, en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.07
  - number: 1.07.3.c
    text: |-
      schepen met een breedte van 11 m of meer, indien de containers in meer dan drie rijen naast elkaar en in meer dan
      twee lagen zijn geladen of indien de containers in meer dan drie lagen zijn geladen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.07
  - number: 1.08.1
    text: |-
      De bemanningsleden en de andere personen aan boord van een schip bestemd voor bedrijfsmatig vervoer als bedoeld in
      [artikel 1, eerste lid, van de Binnenvaartwet][ref1], moeten reddingsvesten dragen overeenkomstig artikel 13.08,
      tweede en derde lid, ES-TRIN


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel1
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.08
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '1'
  - number: 1.08.1.a
    text: bij het van of aan boord gaan, voor zover er gevaar voor in het water vallen bestaat,
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.08
  - number: 1.08.1.b
    text: bij het verblijven in de bijboot,
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.08
  - number: 1.08.1.c
    text: bij werkzaamheden buiten boord, dan wel
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.08
  - number: 1.08.1.d
    text: |-
      bij verblijf en werkzaamheden aan dek en in het gangboord, indien verschansingen van ten minste 90 cm hoogte niet
      aanwezig zijn of relingen niet doorlopend zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.08
  - number: 1.08.2
    text: |-
      Werkzaamheden buiten boord mogen uitsluitend bij stilliggende schepen worden uitgevoerd en uitsluitend indien van
      de overige scheepvaart geen gevaar te verwachten valt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.08
  - number: 1.09.1
    text: |-
      Een schip mag niet varen, indien het sturen niet wordt verricht door een daartoe bekwaam persoon. Voor deze persoon
      geldt:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.09
  - number: 1.09.1.a
    text: een minimum leeftijd van 18 jaar voor het sturen van een snelle motorboot;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.09
  - number: 1.09.1.b
    text: 'een minimum leeftijd van 16 jaar:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.09
  - number: 1.09.1.b.1°
    text: voor het sturen van een groot schip,
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.09
  - number: 1.09.1.b.2°
    text: |-
      voor het sturen van een klein motorschip niet zijnde een snelle motorboot en niet zijnde een klein open motorschip
      met een lengte van minder dan 7 m waarvan de hoogst bereikbare snelheid ten opzichte van het water niet meer is dan
      13 km per uur, en
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.09
  - number: 1.09.1.b.3°
    text: voor het sturen van een zeilschip met een lengte van 7 m of meer;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.09
  - number: 1.09.1.c
    text: |-
      een minimum leeftijd van 12 jaar voor het sturen van een klein open motorschip met een lengte van minder dan 7 m
      waarvan de hoogst bereikbare snelheid ten opzichte van het water niet meer is dan 13 km per uur.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.09
  - number: 1.09.2
    text: |-
      De bevoegde autoriteit kan van het eerste lid, onderdeel a, ontheffing verlenen voor het in verenigingsverband
      oefenen voor deelname aan met snelle motorboten te houden wedstrijden of voor het deelnemen aan dergelijke
      wedstrijden. Een ontheffing kan onder beperkingen worden verleend en er kunnen voorwaarden aan worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.09
  - number: 1.09.3
    text: |-
      Op ieder snel schip moet tijdens de vaart het roer worden bediend door een persoon die houder is van het vereiste
      vaarbevoegdheidsbewijs alsmede van het radarpatent. Bij een snel schip moet tijdens het snel varen een tweede
      persoon die eveneens houder is van het vereiste vaarbevoegdheidsbewijs en van het radarpatent zich in de stuurhut
      bevinden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.09
  - number: 1.09.4
    text: |-
      Een schip mag niet varen indien degene die het sturen verricht niet in staat is alle in de stuurhut binnenkomende
      of van daar uitgaande inlichtingen en aanwijzingen te vernemen en te geven. In het bijzonder dient hij naar alle
      zijden een voldoende vrij direct of indirect uitzicht te hebben en in de gelegenheid te zijn geluidsseinen te
      horen. Indien geen vrij uitzicht mogelijk is kan dit worden gecompenseerd door een optisch hulpmiddel, waarmede
      over een voldoende ruim gezichtsveld een helder en onvertekend beeld wordt verkregen, dan wel door een uitkijk.
      Indien bijzondere omstandigheden dit vorderen, dient een uitkijk of luisterpost die hem inlicht aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.09
  - number: 1.10.1
    text: |-
      Aan boord van een schip moeten de volgende bescheiden, voorzover deze door de daartoe gestelde wettelijke
      regelingen worden vereist, aanwezig zijn:
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
  - number: 1.10.1.a
    text: de meetbrief van het schip;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
  - number: 1.10.1.b
    text: de bescheiden vereist door het ADN, nrs. 8.1.2.1, 8.1.2.2 en 8.1.2.3;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
  - number: 1.10.1.c
    text: het vaarbevoegdheidsbewijs;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
  - number: 1.10.1.d
    text: |-
      het radarpatent dan wel een ander diploma dat overeenkomstig het
      [Reglement betreffende het scheepvaartpersoneel op de Rijn][ref1] is toegelaten; deze documenten behoeven niet aan
      boord te zijn, indien het Rijnpatent of een ander overeenkomstig het Reglement betreffende het scheepvaartpersoneel
      op de Rijn toegelaten diploma van de schipper de vermelding «Radar» bevat;


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 1.10.1.e
    text: het Handboek voor de radiocommunicatie in de binnenvaart, algemeen en regionaal deel;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
  - number: 1.10.1.f
    text: het registratiebewijs gebruik frequentieruimte (maritiem mobiel);
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
  - number: 1.10.1.g
    text: het marifoon bedieningscertificaat;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
  - number: 1.10.1.h
    text: |-
      het certificaat van onderzoek, overeenkomstig [artikel 7, tweede lid, van de Binnenvaartwet][ref1], met inbegrip
      van het stuwplan of de ladinglijst voor de actuele beladingstoestand en de stabiliteitsberekening, met inbegrip van
      de daarbij gebruikte berekeningsmethode en het resultaat daarvan, voor de actuele, of een vergelijkbare vorige, dan
      wel een standaard beladingstoestand;


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel7
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '7'
  - number: 1.10.1.i
    text: het certificaat voor de navigatielantaarns;
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
  - number: 1.10.1.j
    text: het registratiebewijs snelle motorboot.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
  - number: 1.10.2
    text: |-
      In afwijking van het eerste lid is de aanwezigheid van de in het eerste lid, onder a en h, bedoelde bescheiden
      niet vereist aan boord van duwbakken waarop een metalen plaat is aangebracht van het volgende model: UNIEK EUROPEES
      SCHEEPSIDENTIFICATIENUMMER: 'COMMUNAUTAIR CERTIFICAAT: - NUMMER:'
        - COMMISSIE VAN DESKUNDIGEN:
        - GELDIG TOT: Indien de duwbak over een officieel scheepsnummer beschikt, moet dat begrip en het officieel
      scheepsnummer op de metalen plaat worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
  - number: 1.10.3
    text: |-
      De in het tweede lid bedoelde gegevens moeten, in goed leesbare letters met een hoogte van tenminste 6 mm,
      ingehakt of ingeslagen zijn. De metalen plaat moet een hoogte van ten minste 60 mm en een lengte van ten minste
      120 mm hebben. Zij moet op het achterschip aan stuurboordzijde op een goed zichtbare plaats zijn bevestigd. De
      overeenstemming tussen de gegevens op de plaat met die in het communautair certificaat van de duwbak moet worden
      bevestigd door een Commissie van Deskundigen door middel van het aanbrengen op de plaat van een stempel. De in het
      eerste lid, onder a en h, genoemde bescheiden moeten aanwezig zijn bij de eigenaar van de duwbak.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
  - number: 1.10.4
    text: |-
      De in het eerste lid bedoelde bescheiden moeten op eerste vordering van de bevoegde autoriteit aan deze worden
      overgelegd ter controle van het bepaalde bij of krachtens dit reglement.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
  - number: 1.10.5
    text: |-
      Het Handboek voor de radiocommunicatie in de binnenvaart, bedoeld in het eerste lid, onder e, dat via een
      elektronisch middel op ieder moment geraadpleegd kan worden, is eveneens toegestaan.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.10
  - number: 1.11.1
    text: |-
      Aan boord van een schip moet een bijgewerkt exemplaar van het geldige Binnenvaartpolitiereglement aanwezig zijn.
      Een exemplaar dat via een elektronisch middel op ieder moment geraadpleegd kan worden is eveneens toegestaan.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.11
  - number: 1.11.2
    text: Dit artikel is niet van toepassing op een groot schip zonder bemanningsverblijf noch op een klein open schip.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.11
  - number: 1.12.1
    text: |-
      Een schip, een drijvend voorwerp of een drijvende inrichting mag geen voorwerpen hebben uitsteken, tenzij
      daarmede geen hinder of gevaar voor de scheepvaart en geen schade aan andere schepen en aan kunstwerken kan worden
      veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.12
  - number: 1.12.2
    text: |-
      Een schip moet een anker waarvan geen gebruik wordt gemaakt geheel voorhalen, met dien verstande dat het, zo het
      voorop ook over een klipanker beschikt, het stokanker binnen boord moet hebben gehaald.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.12
  - number: 1.12.3
    text: |-
      Indien een schip, een drijvend voorwerp of een drijvende inrichting een voorwerp verliest waardoor een belemmering
      van of een gevaar voor de scheepvaart kan ontstaan moet de schipper daarvan onverwijld kennis geven aan de
      dichtstbijzijnde bevoegde autoriteit en daarbij zo nauwkeurig mogelijk de plaats aangeven waar het voorwerp is
      verloren. Zo mogelijk moet hij bovendien deze plaats met een kenteken aanduiden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.12
  - number: 1.12.4
    text: |-
      Indien een schip een hindernis in de vaarweg aantreft moet de schipper daarvan onverwijld kennis geven aan de
      dichtstbijzijnde bevoegde autoriteit en daarbij zo nauwkeurig mogelijk de plaats aangeven waar de hindernis is
      aangetroffen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.12
  - number: 1.13.1
    text: |-
      Een schip, een drijvend voorwerp of een drijvende inrichting mag geen verkeerstekens gebruiken om daaraan te meren
      of daaraan te verhalen, ze niet beschadigen en ze niet ongeschikt voor hun bestemming maken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.13
  - number: 1.13.2
    text: |-
      Indien een schip, een drijvend voorwerp of een drijvende inrichting een verkeersteken heeft verplaatst of
      beschadigd, moet de schipper onverwijld daarvan kennis geven aan de dichtstbijzijnde bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.13
  - number: 1.13.3
    text: |-
      In het algemeen genomen, is de schipper verplicht het in het ongerede of beschadigd zijn van verkeerstekens
      onverwijld ter kennis van de dichtstbijzijnde bevoegde autoriteit te brengen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.13
  - number: '1.14'
    text: |-
      Indien een schip, een drijvend voorwerp of een drijvende inrichting een kunstwerk heeft beschadigd, moet de
      schipper onverwijld daarvan kennis geven aan de dichtstbijzijnde bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.14
  - number: 1.15.1
    text: |-
      Het is verboden van een schip, een drijvend voorwerp of een drijvende inrichting af voorwerpen of stoffen die de
      veiligheid van de scheepvaart in gevaar kunnen brengen te water te doen geraken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.15
  - number: 1.15.2
    text: |-
      Indien zodanige voorwerpen of stoffen van een schip, een drijvend voorwerp of een drijvende inrichting af bij
      ongeluk te water geraken of dreigen te water te geraken, moet de schipper onverwijld daarvan kennis geven aan
      de dichtstbijzijnde bevoegde autoriteit en daarbij zo nauwkeurig mogelijk opgeven de aard van deze voorwerpen of
      stoffen en de plaats waar zij te water zijn geraakt of zij dreigen te water te geraken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.15
  - number: '1.16'
    text: (niet overgenomen).
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.16
  - number: 1.17.1
    text: |-
      Indien een schip of een drijvend voorwerp is vastgevaren of gezonken moet de schipper zo spoedig mogelijk daarvan
      kennis geven aan de dichtstbijzijnde bevoegde autoriteit. De schipper of, ingeval deze een ander lid der bemanning
      daartoe opdracht geeft, dit bemanningslid, moet aan boord of in de nabijheid van de plaats van het ongeval blijven,
      zolang de bevoegde autoriteit hem niet heeft toegestaan zich te verwijderen.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.17
  - number: 1.17.2
    text: |-
      Tenzij dit klaarblijkelijk niet nodig is, moet de schipper, onverminderd de verplichting de bij
      [artikel 3.25][ref1] bedoelde lichten en dagtekens te tonen, zo spoedig mogelijk naderende schepen laten
      waarschuwen op daarvoor geschikte plaatsen en op zodanige afstand van de plaats van het ongeval, dat deze schepen
      tijdig de nodige maatregelen kunnen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '3'
        hoofdstuk: '3'
        afdeling: III
  - number: 1.18.1
    text: |-
      Indien een schip of een drijvend voorwerp dat is vastgevaren of gezonken dan wel een door een schip of een drijvend
      voorwerp verloren voorwerp het vaarwater geheel of gedeeltelijk verspert of dreigt te versperren, moet de schipper
      de nodige maatregelen nemen om het vaarwater zo spoedig mogelijk vrij te maken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.18
  - number: 1.18.2
    text: |-
      Een overeenkomstige verplichting geldt voor de schipper wiens schip of drijvend voorwerp dreigt te zinken of
      onmanoeuvreerbaar wordt.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.18
  - number: '1.19'
    text: De schipper is verplicht aan een verkeersaanwijzing gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.19
  - number: '1.20'
    text: |-
      De schipper moet aan de bevoegde autoriteit de nodige medewerking verlenen, in het bijzonder het onmiddellijk aan
      boord komen van deze vergemakkelijken, teneinde deze in staat te stellen zich ervan te vergewissen of de bepalingen
      van dit reglement worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.20
  - number: 1.21.1
    text: 'Als een bijzonder transport wordt beschouwd het verplaatsen op de vaarweg:'
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.21
  - number: 1.21.1.a
    text: |-
      van een schip of een samenstel dat niet voldoet aan [artikel 1.06][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel1
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.21
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.21.1.b
    text: |-
      van een drijvende inrichting of van een drijvend voorwerp, tenzij het verplaatsen daarvan klaarblijkelijk geen
      hinder of gevaar voor de scheepvaart en geen schade aan de kunstwerken kan veroorzaken.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.21
  - number: 1.21.2
    text: |-
      Een bijzonder transport vaart niet dan met een vergunning van de bevoegde autoriteit. Aan een vergunning kunnen
      door de bevoegde autoriteit voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.21
  - number: 1.21.3
    text: |-
      Voor een bijzonder transport wordt een schipper aangewezen. Met [artikel 1.02][ref1] wordt rekening gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel1
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.21
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '1'
        hoofdstuk: '1'
  - number: '1.22'
    text: (niet overgenomen).
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.22
  - number: 1.23.1
    text: |-
      Het is verboden een sportevenement, een festiviteit of een ander evenement, waarbij een of meer schepen of
      drijvende voorwerpen zijn betrokken, een praktijktest met vergaand geautomatiseerd varen, dan wel een tewaterlating
      van een schip of een proefvaart met een schip of van een drijvend voorwerp of werkzaamheden op een vaarweg te doen
      plaats hebben zonder dit tijdig tevoren bij de bevoegde autoriteit te melden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.23
  - number: 1.23.2
    text: |-
      Indien een gebeurtenis als bedoeld in het eerste lid de veiligheid of het vlotte verloop van de scheepvaart in
      gevaar kan brengen, is het verboden deze zonder toestemming van de bevoegde autoriteit te doen plaats hebben. Aan
      een toestemming kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.23
  - number: 1.23.3
    text: |-
      Het is verboden een evenement, waarbij zich personen anders dan op een schip te water bevinden en waardoor hinder
      of gevaar voor het scheepvaartverkeer kan ontstaan, zonder toestemming van de bevoegde autoriteit te doen plaats
      hebben. Aan een toestemming kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.23
  - number: '1.24'
    text: |-
      Schepen van handhavingsdiensten en brandweer, en reddingsvaartuigen betrokken bij reddingsoperaties mogen,
      behoudens het bepaalde in de [artikelen 1.04][ref1] en [1.05][ref2], afwijken van de voorschriften van dit besluit
      voor zover dat voor een goede vervulling van hun taak noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel1
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.24
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '1'
        hoofdstuk: '1'
  - number: '1.25'
    text: (niet overgenomen)
    url: https://wetten.overheid.nl/BWBR0003628/2025-07-01#Artikel1.25
  - number: 1.26.1
    text: |-
      De bevoegde autoriteit kan voor een schip waarmee vergaand geautomatiseerd wordt gevaren of voor
      een schip dat op afstand wordt bestuurd voor een periode van ten hoogste 2 jaar een ontheffing
      verlenen van één of meer van de [artikelen 1.02, vierde lid][ref1], [1.07, tweede lid][ref2],
      [1.09, eerste, derde en vierde lid][ref3], [1.10][ref4], [1.11][ref5], [1.20][ref6], [3.13][ref7],
      [3.25][ref8], [4.05, eerste, derde, vierde en achtste lid][ref9], [4.06, eerste en tweede lid][ref10],
      [4.07, vierde, vijfde en zevende lid][ref11], [6.19, tweede, derde en zesde lid][ref12], [6.32][ref13] of
      [6.33][ref14] en [9.04, tweede lid][ref15].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel1
