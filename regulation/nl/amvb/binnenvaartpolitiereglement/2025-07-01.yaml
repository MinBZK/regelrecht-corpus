  - number: '1.01'
    text: |-
      In dit reglement wordt verstaan onder:

      1°. *schip*: elk vaartuig met inbegrip van een vaartuig zonder waterverplaatsing en een watervliegtuig, gebruikt
      of geschikt om te worden gebruikt als een middel van vervoer te water; 2°. *motorschip*: schip dat gebruik maakt
      van zijn mechanische middelen tot voortbeweging, met uitzondering van een schip waarvan de motor slechts wordt
      gebruikt ter verbetering van zijn bestuurbaarheid, wanneer het wordt gesleept of geduwd; 3°. *groot schip*: schip
      niet zijnde een klein schip; 4°. *klein schip*: schip waarvan de lengte minder dan 20 m bedraagt, waartoe als
      de lengte wordt aangemerkt de afstand van de voorkant van het voorste tot de achterkant van het achterste vaste
      deel van de romp, zonder de boegspriet, de papegaaistok en het trimvlak, zulks met uitzondering van a. een schip
      dat een groot schip sleept, assisteert, duwt of langszijde vastgemaakt meevoert; b. een passagiersschip; c. een
      veerpont die vaart op een vaarweg van klasse II of hoger, zoals vastgesteld door de Conférence Européenne des
      Ministres de Transport en opgenomen in de Richtlijnen vaarwegen zoals periodiek vast te stellen door de Minister
      van Infrastructuur en Milieu; d. een vissersschip; e. een duwbak; 5°. *snel schip*: groot motorschip, dat met een
      snelheid van meer dan 40 km per uur ten opzichte van het water kan varen; 6°. *passagiersschip*: schip dat meer dan
      12 passagiers mag vervoeren; 7°. *zeegaand schip*: groot schip dat, nadat het van zee is gekomen dan wel voordat
      het naar zee vertrekt, deelneemt aan de scheepvaart op een der in [bijlage 11][ref1] genoemde vaarwegen; 8°.
      *bovenmaats schip*: schip, behorende tot een daartoe door de bevoegde autoriteit aangewezen categorie van schepen,
      die in hun manoeuvreerbaarheid zijn beperkt, doordat zij ten gevolge van hun diepgang of hun lengte gebonden zijn
      aan een bepaald gedeelte van de vaarweg; 9°. *duwboot*: motorschip dat deel uitmaakt van een duwstel en daarbij
      dient voor het voortbewegen en het sturen van de andersoortige schepen en dat daartoe is gebouwd of ingericht;
      10°. *duwbak*: schip dat is gebouwd of in het bijzonder geschikt is om te worden geduwd; 11°. *zeeschipbak*:
      duwbak die is gebouwd om aan boord van een zeeschip te kunnen worden vervoerd en om de binnenvaarwegen te
      bevaren; 12°. *drijvend werktuig*: schip voorzien van werktuigen, die zijn bestemd om op vaarwegen of in havens
      te worden gebruikt; 13°. *vissersschip*: schip dat vist met netten, lijnen, sleepnetten of ander vistuig,
      die de manoeuvreerbaarheid beperken; 14°. *veerpont*: schip dat een veerdienst onderhoudt, waarbij de vaarweg
      wordt overgestoken, en dat door de bevoegde autoriteit als veerpont is aangemerkt; 15°. *zeilschip*: schip dat
      uitsluitend door middel van zijn zeilen wordt voortbewogen. Een schip dat onder zeil vaart en tegelijkertijd zijn
      mechanische middelen tot voortbeweging gebruikt is een motorschip; 16°. *zeilplank*: klein zeilschip voorzien van
      een vrij bewegende zeiltuigage, die is gemonteerd op een in alle richtingen draaibare mastvoet en die tijdens het
      zeilen niet in een vaste positie wordt ondersteund; 17°. *snelle motorboot*: klein schip dat, bij gebruikmaking van
      zijn mechanische middelen tot voortbeweging, sneller dan 20 km per uur ten opzichte van het water kan varen; 18°.
      *waterscooter*: snelle motorboot gebouwd of ingericht om door een of meer personen skiënd door of over het water te
      worden voortbewogen;

      1°. *samenstel*: a. sleep; b. duwstel; c. gekoppeld samenstel; d. samenstel van een of meer motorschepen en een
      alleenvarend motorschip, een duwstel of een gekoppeld samenstel dat door deze motorschepen wordt geassisteerd; 2°.
      *sleep*: samenstel van een of meer motorschepen en een of meer op tros daaraan verbonden andersoortige schepen,
      drijvende voorwerpen of drijvende inrichtingen, waarbij de motorschepen dienen voor het voortbewegen dan wel voor
      het voortbewegen en het sturen van de andersoortige schepen, drijvende voorwerpen of drijvende inrichtingen; 3°.
      *duwstel*: hecht samenstel van een of meer duwboten en een of meer andersoortige schepen, waarvan er tenminste één
      is geplaatst voor een der duwboten; 4°. *gekoppeld samenstel*: samenstel van langszijde van elkaar vastgemaakte
      schepen, waarvan er geen is geplaatst voor het motorschip dat dient voor het voortbewegen en het sturen van het
      samenstel; 5°. *assisteren*: bijstaan door een of meer motorschepen van een alleenvarend motorschip dan wel van een
      duwstel of van een gekoppeld samenstel bij het zich voortbewegen en bij het sturen of bij een van deze handelingen;

      1°. *’s nachts*: tijd tussen zonsondergang en zonsopgang; 2°. *overdag*: tijd tussen zonsopgang en zonsondergang;
      3°. *wit licht, rood licht, groen licht, geel licht en blauw licht*: lichten waarvan de kleuren voldoen aan de
      daaromtrent vastgestelde voorschriften in ES-TRIN; 4°. *krachtig licht, helder licht en gewoon licht*: lichten
      waarvan de sterkte voldoet aan de daaromtrent vastgestelde voorschriften in ES-TRIN; 5°. *flikkerlicht*:
      periodelicht tonende 50 tot 60 flikkeringen per minuut; 6°. *licht dat snel flikkert*: zwaailicht of periodelicht
      tonende 100 tot 150 flikkeringen per minuut; 7°. a. *korte stoot*: geluidssein durende ongeveer 1 seconde; b.
      *lange stoot*: geluidssein durende ongeveer 4 seconden; de tijdruimte tussen twee opeenvolgende stoten moet
      ongeveer 1 seconde bedragen; 8°. *reeks zeer korte stoten*: reeks van tenminste 6 stoten, elk durende ongeveer ¼
      seconde; de tijdruimte tussen de opeenvolgende stoten moet ongeveer ¼ seconde bedragen;

      1°. *drijvend voorwerp*: bouwsel dat geschikt is gemaakt om te water te worden verplaatst en dat geen schip
      of drijvende inrichting is; 2°. *drijvende inrichting*: drijvend bouwsel dat vanwege zijn bestemming in de
      regel niet wordt verplaatst; 3°. *stilliggend*: hetzij ten anker hetzij gemeerd liggend; 4°. *varend*: niet ten
      anker of gemeerd liggend noch vastgevaren; 5°. *vaarweg*: elk voor het openbaar verkeer met schepen openstaand
      water; 6°. *vaarwater*: gedeelte van een vaarweg dat feitelijk door de scheepvaart kan worden gebruikt; 7°.
      *exploitant*: eigenaar, rompbevrachter of ieder ander die de zeggenschap heeft over het gebruik van een schip;
      8°. *ADN*: Europese Overeenkomst betreffende het internationale vervoer van gevaarlijke goederen over de
      binnenwateren; 9°. *vaarbevoegdheidsbewijs*: vaarbewijs als bedoeld in de [artikelen 13][ref2], [14][ref3],
      [15][ref4] en [16 van het Binnenvaartbesluit][ref5], bewijs van bekwaamheid voor de binnenvaart als bedoeld in
      [artikel 32, eerste en tweede lid, van de Binnenvaartwet][ref6], kwalificatiecertificaat schipper als bedoeld
      in [artikel 11.01, eerste lid, van het Reglement betreffende het scheepvaartpersoneel op de Rijn][ref7], patent
      als bedoeld in [artikel 11.02, van het Reglement betreffende het scheepvaartpersoneel op de Rijn][ref8] of
      als gelijkwaardig erkend patent als bedoeld in artikel 11.01, tweede lid, van het Reglement betreffende het
      scheepvaartpersoneel op de Rijn; 10°. *richtlijn nr. 2002/59/EG*: [richtlijn nr. 2002/59/EG](32002L0059) van het
      Europees Parlement en de Raad van de Europese Unie van 27 juni 2002 betreffende de invoering van een communautair
      monitoring- en informatiesysteem voor de zeescheepvaart en tot intrekking van [Richtlijn 93/75/EEG](31993L0075)
      van de Raad (PbEG L 208); 11°. *inland AIS apparaat:* een apparaat dat op een binnenschip is ingebouwd en periodiek
      scheeps- of reisgegevens met betrekking tot dat schip uitzendt; 12°. *uitluisteren:* het via de marifoon luisteren
      naar gevoerde gesprekken, het beantwoorden van oproepen en voor zover nodig het deelnemen aan de communicatie
      tussen de verkeersdeelnemers en de verkeersposten, dan wel tussen de verkeersdeelnemers onderling; 13°. *CEMT-
      klasse:* door de Conférence Européenne des Ministres de Transport vastgestelde klassering van vaarwegen opgenomen
      in de Richtlijnen vaarwegen zoals periodiek vast te stellen door de Minister van Infrastructuur en Milieu; 14°.
      vloeibaar aardgas (LNG): aardgas dat vloeibaar is gemaakt door afkoeling tot een temperatuur van -161 °C; 15°.
      ES-TRIN: De Europese standaard tot vaststelling van de technische voorschriften voor binnenschepen, bedoeld in
      [artikel 1.1, eerste lid, van de Binnenvaartregeling][ref9]; 16°. vergaand geautomatiseerd varen: varen met een
      schip waarbij bepaalde menselijke taken worden overgenomen door één of meerdere geautomatiseerde toepassingen.


