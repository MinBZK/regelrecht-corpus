preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 24 juli 1995, nr. 95019 965,
    directie Arbeidsvoorwaarden en Beroepskwaliteit, gedaan mede namens Onze Minister van Landbouw, Natuurbeheer en
    Visserij;

    Gelet op artikel 20, tweede lid, van de Wet op het basisonderwijs; artikel 28, tweede lid, van de Interimwet op
    het speciaal onderwijs en het voortgezet speciaal onderwijs; de artikelen 39, tweede lid, en 76, van de Wet op
    het voortgezet onderwijs; artikel 4 van de Experimentenwet onderwijs; de artikelen 4.1.2, tweede lid, 4.1.4. en
    4.3.1., tweede lid, van de Wet educatie en beroepsonderwijs; artikel 58 van de Wet op de onderwijsverzorging; de
    artikelen 4.5, 9.74, tweede lid, 10.10, derde lid, 11.12, eerste lid, 12.5, 13.1., vijfde lid, 13.3., vijfde lid,
    van de Wet op het hoger onderwijs en wetenschappelijk onderzoek; de artikelen 14, eerste lid, en 35 van de Wet op
    de Nederlandse organisatie voor Wetenschappelijk Onderzoek; de artikelen 125 en 134 van de Ambtenarenwet;

    De Raad van State gehoord (advies van 14 december 1995, nr. W05.95.0411);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen, uitgebracht mede namens Onze
    Minister van Landbouw, Natuurbeheer en Visserij, van 15 december 1995, nr. AB 95034376, directie Arbeidsvoorwaarden
    en Beroepskwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#ArtikelAanhef
