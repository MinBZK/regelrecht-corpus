      [Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref1]; alsmede in voorkomende gevallen
      de gewezen betrokkene door wie een uitkering is aangevraagd of aan wie een uitkering ingevolge dit besluit is
      toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004191
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004191
  - number: 1.d
    text: |-
      bevoegd gezag: Ten aanzien van: - een rijksinstelling zonder rechtspersoonlijkheid: Onze Minister;
        - een rijksinstelling met rechtspersoonlijkheid: het college van bestuur;
        - een publiekrechtelijke provinciale instelling: het college van gedeputeerde staten, voor zover de provinciale
      staten niet anders bepalen, en, indien de provinciale staten dit wenselijk oordelen, met inachtneming van door hen
      te stellen regelen;
        - een gemeentelijke instelling: het college van burgemeester en wethouders, voorzover de raad niet anders bepaalt,
      en, indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen regelen, dan wel, wanneer de
      instelling van meer dan één gemeente uitgaat, het krachtens de desbetreffende gemeenschappelijke regeling bevoegde
      orgaan;
        - een publiekrechtelijke regionale instelling: het krachtens de desbetreffende gemeenschappelijke regeling bevoegde
      orgaan;
        - een privaatrechtelijke instelling met of zonder rechtspersoonlijkheid: het instellingsbestuur.
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel1
  - number: 1.e
    text: |-
      lichamen: rechtspersonen, maat- en vennootschappen, samenwerkingsvormen zonder rechtspersoonlijkheid die met
      verenigingen maatschappelijk gelijk kunnen worden gesteld, ondernemingen van publiekrechtelijke rechtspersonen
      en doelvermogens;
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel1
  - number: 1.f
    text: |-
      bezoldiging: de som van het salaris, de vakantie-uitkering en de overige in het voor de betrokkene van toepassing
      zijnde rechtspositiebesluit of CAO opgenomen toelagen, toeslagen en eindejaarsuitkeringen;
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel1
  - number: 1.g
    text: |-
      arbodienst: een arbodienst als bedoeld in de [Arbeidsomstandighedenwet][ref1];


