    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: 1.h
    text: |-
      geneeskundig onderzoek: een onderzoek door of namens het Uitvoeringsinstituut werknemersverzekeringen, dan wel een
      voor rekening van het bevoegd gezag komend onderzoek door de arbodienst;
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel1
