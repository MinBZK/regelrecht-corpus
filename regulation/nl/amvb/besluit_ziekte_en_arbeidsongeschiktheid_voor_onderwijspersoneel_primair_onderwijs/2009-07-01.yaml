  - number: 1.a
    text: |-
      Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap, en voor wat betreft het landbouwonderwijs, Onze
      Minister van Landbouw, Natuur en Voedselkwaliteit;
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel1
  - number: 1.b
    text: 'instelling:'
