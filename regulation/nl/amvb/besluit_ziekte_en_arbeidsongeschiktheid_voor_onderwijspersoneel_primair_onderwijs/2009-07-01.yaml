    text: |-
      een openbare of uit de openbare kas bekostigde bijzondere basisschool of speciale school voor basisonderwijs in de
      zin van de [Wet op het primair onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003420
