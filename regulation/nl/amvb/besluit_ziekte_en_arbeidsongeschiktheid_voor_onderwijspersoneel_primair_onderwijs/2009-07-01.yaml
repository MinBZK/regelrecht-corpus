        artikel: XV
  - number: '39.7'
    text: |-
      Het bedrag van de een uitkering ter hoogte van de laatstelijk genoten bezoldiging, bedoeld in dit artikel dan wel
      70% daarvan wordt verminderd dan wel, voor zover het reeds is uitbetaald, verrekend met:
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel39
  - number: 39.7.a
    text: |-
      een de betrokkene toegekende ZW-uitkering, een WW-uitkering, een bovenwettelijke WW-uitkering danwel WAO- of WIA-
      uitkering of anderszins een uitkering uit hoofde van ziekte en arbeidsongeschiktheid of werkloosheid;
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel39
  - number: 39.7.b
    text: |-
      een de betrokkene toegekend bovenwettelijke arbeidsongeschiktheidsuitkering door de Stichting Pensioenfonds ABP,
      alsmede een eventuele aanvulling op dat pensioen, als bedoeld in [artikel 41, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel41
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '41'
        hoofdstuk: '4'
  - number: 39.7.c
    text: |-
      inkomsten welke de gewezen betrokkene inmiddels mocht zijn gaan genieten uit of in verband met arbeid of bedrijf,
      daaronder mede begrepen uitkeringen terzake van ziekte en arbeidsongeschiktheid, voor zover niet afkomstig uit
      verzekeringen, waarvoor de premie uitsluitend voor eigen rekening van betrokkene is betaald.
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel39
  - number: '39.8'
    text: |-
      In de gevallen, bedoeld in dit artikel, vinden de [artikelen 14][ref1], [15][ref2], [16][ref3] en [17][ref4], waar
      mogelijk, overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007800#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0007800#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0007800#Artikel17
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '14'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007800
        artikel: '15'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0007800
        artikel: '16'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0007800
        artikel: '17'
        hoofdstuk: '1'
  - number: '39.9'
    text: |-
      In de gevallen, bedoeld in dit artikel, wordt de uitkering krachtens de [Ziektewet][ref1], de [WAO][ref2], de
      [Wet WIA][ref3] of de [Wet arbeid en zorg][ref4] geacht onverminderd te zijn ontvangen, indien deze op grond van
      enige wettelijke bepaling geheel of gedeeltelijk is geweigerd, dan wel niet of niet geheel is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0013008
  - number: '40.1'
    text: |-
      Ter verkrijging van de in [artikel 39, eerste, tweede en vierde lid][ref1] bedoelde
      aanspraken richt de gewezen betrokkene binnen 7 dagen na het ontstaan van de voor die
      aanspraken vereiste omstandigheden een aanvraag tot het bevoegd gezag, dan wel aan Onze
      Minister indien hij in dienstbetrekking werkzaam was bij een of meer instellingen, genoemd in
      __REF001___________________________________________________________________________________________________________
      _____________________________. Bij overschrijding van deze termijn vervalt de aanspraak gedurende het aantal dagen
      van deze overschrijding, tenzij de gewezen betrokkene aantoont, dat hij redelijkerwijs niet in staat is geweest die
      termijn in acht te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0007800#Artikel1
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '39'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007800
        artikel: '1'
        hoofdstuk: '1'
  - number: '40.2'
    text: |-
      De vaststelling en wijziging van de in dit artikel bedoelde aanspraken geschiedt door het bevoegd gezag. De
      uitbetaling vindt maandelijks plaats, tenzij deze met toestemming van de gewezen betrokkene in langere termijnen
      geschiedt.
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel40
  - number: '40.3'
    text: |-
      De gewezen betrokkene wordt door het aanvaarden van de vastgestelde aanspraken, bedoeld in het
      [eerste, tweede, vierde, en zevende lid van artikel 39][ref1], geacht er in toe te stemmen dat allen die daarvoor
      naar het oordeel van het bevoegd gezag in aanmerking komen, omtrent zijn omstandigheden alle inlichtingen
      verschaffen welke voor de uitvoering van evenbedoelde aanspraken nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel39
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '39'
        hoofdstuk: '4'
  - number: '40.4'
    text: |-
      De gewezen betrokkene is verplicht, indien het bevoegd gezag daartoe aanleiding ziet, zich te onderwerpen aan
      een geneeskundig onderzoek tot het verkrijgen van ieder mogelijke uitkering ingevolge arbeidsongeschiktheid, ter
      vervanging van de in [artikel 39, eerste, tweede, vierde, en zevende lid][ref1] bedoelde aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel39
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '39'
        hoofdstuk: '4'
  - number: '40.5'
    text: |-
      De gewezen betrokkene is verplicht het bevoegd gezag uit eigen beweging onverwijld in kennis te stellen van alle
      omstandigheden, waarvan het hem redelijkerwijs duidelijk is, dan wel moet zijn, dat die van invloed kunnen zijn
      op de vaststelling van de in [artikel 39, eerste, tweede, vierde, en zevende lid][ref1] bedoelde aanspraken. Onder
      dergelijke omstandigheden vallen tevens te verwachten inkomsten, van welke aard dan ook, waarvan de hoogte en de
      duur nog niet of niet exact kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel39
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '39'
        hoofdstuk: '4'
  - number: '40.6'
    text: |-
      Het bevoegd gezag kan bepalen, dat geen recht op de aanspraken, bedoeld in het
      [eerste, tweede, vierde, en zevende lid van artikel 39][ref1], bestaat indien de gewezen betrokkene de gegevens die
      noodzakelijk zijn voor de vaststelling van deze aanspraken niet, niet volledig of onjuist heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel39
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '39'
        hoofdstuk: '4'
  - number: '40.7'
    text: |-
      Het recht op de aanspraken, bedoeld in het [eerste, tweede, vierde, en zevende lid van artikel 39][ref1], kan door
      het bevoegd gezag geheel of gedeeltelijk en al dan niet tijdelijk vervallen worden verklaard, indien de gewezen
      betrokkene zonder geldige redenen niet of niet langer voldoet aan de hem opgelegde verplichtingen, bedoeld in het
      vijfde en zesde lid, alsmede indien de gewezen betrokkene niet, niet volledig of onjuiste gegevens heeft verstrekt
      met betrekking tot een wijziging van deze aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel39
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '39'
        hoofdstuk: '4'
  - number: '40.8'
    text: |-
      Het recht op de aanspraken, bedoeld in het [eerste, tweede, vierde, en zevende lid van artikel 39][ref1], vervalt
      in ieder geval indien de gewezen betrokkene daartoe niet binnen 2 jaar na de beëindiging van zijn dienstbetrekking
      een verzoek heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel39
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '39'
        hoofdstuk: '4'
  - number: '40.9'
    text: |-
      Uitkeringen ingevolge de in het [eerste, tweede, vierde, en zevende lid van artikel 39][ref1] bedoelde aanspraken,
      die niet in ontvangst zijn genomen of ingevorderd binnen drie maanden na de betaalbaarstelling, worden niet meer
      betaald. Het bevoegd gezag, dan wel Onze Minister ingeval de betrokkene in dienstbetrekking werkzaam was bij een of
      meer instellingen, genoemd in [artikel 1, onderdeel b1, b2 en b3][ref2], kan in bijzondere gevallen ten gunste van
      betrokkene afwijken van de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0007800#Artikel1
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '39'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007800
        artikel: '1'
        hoofdstuk: '1'
  - number: '42'
    text: |-
      Door het bevoegd gezag kan in bijzondere gevallen aan de betrokkene een tegemoetkoming worden toegekend in
      noodzakelijk gemaakte kosten, verband houdende met ziekte, welke de betrokkene voor zichzelf en voor zijn
      medebetrokkenen, bedoeld in de Regeling ziektekostenvoorziening overheidspersoneel, heeft gemaakt, indien hierin
      niet ingevolge een andere regeling kan worden voorzien en deze kosten redelijkerwijs niet te zijnen laste kunnen
      blijven.
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel42
  - number: '43'
    text: |-
      In geval van ziekte en arbeidsongeschiktheid die naar het oordeel van het bevoegd gezag in overwegende mate
      veroorzaakt is door de aard van de aan de betrokkene opgedragen werkzaamheden, dan wel door de omstandigheden
      waaronder deze moesten worden verricht, en niet aan zijn schuld of onvoorzichtigheid is te wijten, worden hem
      vergoed de naar het oordeel van het bevoegd gezag te zijnen laste blijvende noodzakelijk gemaakte kosten van
      geneeskundige behandeling.
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel43
  - number: '44.1'
    text: |-
      Het bevoegd gezag kan al hetgeen op grond van dit besluit onverschuldigd of te veel is betaald
      geheel of gedeeltelijk terugvorderen of in mindering brengen op een later te betalen bezoldiging
      of uitkering op grond van dit besluit, dan wel verrekenen met uitkeringen op grond van het
      [Kaderbesluit rechtspositie PO][ref1], dan wel het [Besluit werkloosheid onderwijs- en onderzoekpersoneel][ref2] of
      het [Besluit bovenwettelijke werkloosheidsregeling voor onderwijspersoneel primair onderwijs][ref3]:


      [ref1]: https://wetten.overheid.nl/BWBR0020315
      [ref2]: https://wetten.overheid.nl/BWBR0006445
      [ref3]: https://wetten.overheid.nl/BWBR0012177
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020315
      - id: ref2
        bwb_id: BWBR0006445
      - id: ref3
        bwb_id: BWBR0012177
  - number: 44.1.a
    text: |-
      gedurende vijf jaren na de dag van de betaalbaarstelling indien het bevoegd gezag door toedoen van betrokkene
      onverschuldigd heeft betaald; en
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel44
  - number: 44.1.b
    text: |-
      gedurende twee jaren na de dag van de betaalbaarstelling in de overige gevallen waarin het de betrokkene
      redelijkerwijs duidelijk kon zijn dat het bevoegd gezag onverschuldigd betaalde.
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel44
  - number: '44.2'
    text: |-
      Een voorschot wordt door betrokkene op eerste vordering van het bevoegd gezag terugbetaald of door
      het bevoegd gezag in mindering gebracht op een later te betalen bezoldiging of uitkering op grond van
      dit besluit, dan wel verrekend met uitkeringen op grond van het [Kaderbesluit rechtspositie PO][ref1],
      dan wel het [Besluit werkloosheid onderwijs- en onderzoekpersoneel][ref2] of het
      [Besluit bovenwettelijke werkloosheidsregeling voor onderwijspersoneel primair onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020315
      [ref2]: https://wetten.overheid.nl/BWBR0006445
      [ref3]: https://wetten.overheid.nl/BWBR0012177
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020315
      - id: ref2
        bwb_id: BWBR0006445
      - id: ref3
        bwb_id: BWBR0012177
  - number: '45.1'
    text: |-
      Iedere bezoldiging of uitkering op grond van dit besluit, alsmede aanvullingen daarop, is onvervreemdbaar en niet
      vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel45
  - number: '45.2'
    text: |-
      Een machtiging tot het in ontvangst nemen van de in het eerste lid bedoelde bezoldigingen of uitkeringen, alsmede
      aanvullingen daarop, onder welke vorm of benaming ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel45
  - number: '45.3'
    text: Elk beding, strijdig met het eerste of tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel45
  - number: '46'
    text: |-
      De betrokkene, die als ambtenaar in de zin van de [Verhaalswet ongevallen ambtenaren][ref1] wordt aangemerkt, is
      verplicht van een oorzaak van verhindering tot dienstverrichting, ten aanzien waarvan aanspraken tegenover derden
      bestaan zo spoedig mogelijk kennis te geven aan het bevoegd gezag en overigens alle medewerking te verlenen die in
      verband met de uitvoering van die wet van hem wordt verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0002500
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002500
  - number: '47'
    text: |-
      Het bevoegd gezag draagt er zorg voor, dat een bijgewerkt exemplaar van dit besluit op een voor de betrokkene
      steeds toegankelijke plaats ter inzage beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel47
  - number: '48'
    text: |-
      De betrokkene, die op de dag, voorafgaande aan de datum van inwerkingtreding van dit besluit, uit hoofde van
      ziekte of arbeidsongeschiktheid een uitkering ontvangt op grond van het [Rechtspositiebesluit WPO/WEC][ref1] of
      het [Besluit werkloosheid onderwijs- en onderzoekpersoneel][ref2], zoals deze regelingen luidden op 31 december
      1995, heeft recht op een daarmee overeenkomende uitkering ingevolge dit Besluit. De onafgebroken periode van
      arbeidsongeschiktheid welke reeds verlopen is op de dag van inwerkingtreding van dit besluit, telt mee voor de
      periode, genoemd in [artikel 20, tweede lid, onder ][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015136
      [ref2]: https://wetten.overheid.nl/BWBR0006445
      [ref3]: https://wetten.overheid.nl/BWBR0007800#Artikel20
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0015136
      - id: ref2
        bwb_id: BWBR0006445
      - id: ref3
        bwb_id: BWBR0007800
        artikel: '20'
        hoofdstuk: '2'
  - number: 48a
    text: |-
      Indien op het moment van invoering van de WAO het verlof wegens ziekte van betrokkene reeds langer dan 13 weken
      heeft geduurd, is het bevoegd gezag verplicht betrokkene vóór 1 februari 1998 te melden bij het Lisv. De melding
      gaat vergezeld van het reïntegratieplan of de reïntegratieplannen en de resultaten van de uitvoering van dit plan
      of deze plannen.
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel48a
  - number: '50'
    text: |-
      Dit besluit wordt aangehaald als <<Besluit ziekte en arbeidsongeschiktheid voor onderwijspersoneel primair
      onderwijs>>.
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#Artikel50
  - number: VI
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 1996 en vervalt op een door Onze Minister te bepalen
      tijdstip.
    url: https://wetten.overheid.nl/BWBR0007800/2009-07-01#ArtikelVI
