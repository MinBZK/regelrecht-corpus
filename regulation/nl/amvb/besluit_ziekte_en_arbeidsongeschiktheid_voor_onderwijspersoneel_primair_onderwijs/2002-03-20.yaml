  - number: 1.n
    text: |-
      Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen;
    url: https://wetten.overheid.nl/BWBR0007800/2002-03-20#Artikel1
  - number: 1.o
    text: 'pensioenreglement: het pensioenreglement van de Stichting Pensioenfonds ABP;'
    url: https://wetten.overheid.nl/BWBR0007800/2002-03-20#Artikel1
  - number: 1.p
    text: 'arbeidsongeschiktheid: arbeidsongeschiktheid in de zin van artikel 18, eerste lid, van de WAO;'
    url: https://wetten.overheid.nl/BWBR0007800/2002-03-20#Artikel1
  - number: 1.q
    text: |-
      arbeidsongeschiktheidsuitkering: een uit enig dienstverband van de betrokkene voortvloeiende en aan hem periodiek
      uitbetaalde uitkering terzake van het op grond van ziekten of gebreken geheel of gedeeltelijk ongeschikt zijn om
      passende, dan wel gangbare arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0007800/2002-03-20#Artikel1
  - number: 1.r
    text: |-
      passende arbeid: arbeid, die voor de krachten en bekwaamheden van de betrokkene is berekend, en die met het oog
      op zijn opleiding en zijn vroeger beroep hem in billijkheid kan worden opgedragen, om ter plaatse waar hij arbeid
      verricht of het laatst heeft verricht, of op een naburige soortgelijke plaats te verdienen hetgeen lichamelijk
      en geestelijk gezonde personen van dezelfde soort en van soortgelijke opleiding, op zodanige plaats met arbeid
      gewoonlijk verdienen;
    url: https://wetten.overheid.nl/BWBR0007800/2002-03-20#Artikel1
  - number: 1.s
    text: |-
      gangbare arbeid: alle algemeen geaccepteerde arbeid waartoe de betrokkene met zijn krachten en bekwaamheden in
      staat is en waarmee hij kan verdienen, hetgeen gezonde personen met soortgelijke opleiding en ervaring, ter plaatse
      waar hij arbeid verricht of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen.
      Niet daaronder wordt verstaan een dienstbetrekking in de zin van de Wet op de sociale werkvoorziening;
    url: https://wetten.overheid.nl/BWBR0007800/2002-03-20#Artikel1
  - number: 1.t
    text: 'WAO uitkering: een op grond van de WAO toegekende arbeidsongeschiktheidsuitkering;'
    url: https://wetten.overheid.nl/BWBR0007800/2002-03-20#Artikel1
  - number: 1.u
    text: |-
      werkloosheidsuitkering: een periodieke uitkering terzake van ontslag of werkloosheid, die voortvloeit uit enig
      dienstverband van betrokkene;
    url: https://wetten.overheid.nl/BWBR0007800/2002-03-20#Artikel1
  - number: 1.v
    text: |-
      suppletie: een uitkering na ontslag krachtens hoofdstuk 3 van dit besluit terzake van een op het moment van ontslag
      bestaande arbeidsongeschiktheid van minder dan 80% in de zin van de WAO;
    url: https://wetten.overheid.nl/BWBR0007800/2002-03-20#Artikel1
  - number: 1.w
    text: 'invaliditeitspensioen: een invaliditeitspensioen als bedoeld in paragraaf 8 van het pensioenreglement;'
    url: https://wetten.overheid.nl/BWBR0007800/2002-03-20#Artikel1
