  - number: '19'
    text: |-
      1 Ingeval van een geschil over het wel of niet bestaan van ongeschiktheid tot werken wegens ziekte voorziet
      [artikel 30, eerste lid, onderdeel e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] in het
      instellen van een onderzoek en het geven van een oordeel.

      2 De betrokkene die bedenkingen heeft tegen een conclusie van geneeskundige aard, als bedoeld in
      [artikel 18][ref2], kan daarvan binnen drie dagen na ontvangst van de conclusie onder opgave van redenen aan
      het bevoegd gezag schriftelijk mededeling doen. Hij kan ter ondersteuning van zijn bedenkingen een verklaring
      overleggen van een arts, die alsdan door de commissie, bedoeld in het tweede lid, in de gelegenheid wordt gesteld
      tot het geven van een nadere schriftelijke of mondelinge toelichting.

      3 Behalve indien, na overleg met de deskundige persoon of de arbodienst, door het bevoegd gezag de bedenkingen van
      de betrokkene reeds aanstonds voldoende gegrond worden geacht, wordt binnen 14 dagen op last van het bevoegd gezag
      door een commissie van artsen een hernieuwd onderzoek ingesteld. In deze commissie mogen geen zitting hebben de
      arts of artsen, die het eerste onderzoek, bedoeld in [artikel 18][ref3], hebben verricht.

      4 De conclusie van de commissie is bindend.

      5 De conclusie van het onderzoek deelt de commissie zo spoedig mogelijk schriftelijk mede:

      a. aan het bevoegd gezag dat vervolgens hiervan onverwijld schriftelijk kennis geeft aan de betrokkene;

      b. aan de behandelend arts van betrokkene op verzoek van laatstgenoemde.

      6 De kosten van het hernieuwd onderzoek alsmede de kosten, verbonden aan het onderzoek, bedoeld in
      [artikel 30, eerste lid, onderdeel e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4], komen
      voor rekening van het bevoegd gezag. De eventuele reis- en verblijfkosten van de betrokkene worden hem door het
      bevoegd gezag vergoed op basis van nader door het bevoegd gezag te stellen regelen, dan wel, voor zover het een
      instelling betreft, genoemd in [artikel 1, onderdelen b1 tot en met b4, b6 en b7][ref5], op basis van de Regeling
      vergoeding van reis- en verblijfskosten bij dienstreizen voor onderwijspersoneel.

      7 Op de in het tweede en derde lid genoemde termijnen is de [Algemene termijnenwet][ref6] van toepassing.

      8 Dit artikel vindt geen toepassing ten aanzien van betrokkenen die zijn ontslagen of wier dienstverband is
      beëindigd.


