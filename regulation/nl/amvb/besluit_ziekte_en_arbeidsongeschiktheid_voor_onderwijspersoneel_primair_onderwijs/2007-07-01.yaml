  - number: '14'
    text: |-
      Geen aanspraak op bezoldiging bestaat, indien blijkens een geneeskundige verklaring:

      a. de ziekte is voorgewend, althans zodanig overdreven is voorgesteld, dat verhindering tot de verrichting van zijn
      arbeid niet kan worden aangenomen;

      b. de betrokkene de ziekte opzettelijk heeft veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand
      geen verwijt kan worden gemaakt;

      c. de verhindering wegens ziekte zich voordoet binnen een half jaar na de geneeskundige keuring die terzake van
      zijn benoeming heeft plaatsgevonden, en alsdan blijkt dat de betrokkene hierbij kennelijk opzettelijk onjuiste
      informatie over zijn gezondheidstoestand heeft verstrekt of gegevens heeft verzwegen, tengevolge waarvan hij toen
      ten onrechte geschikt is verklaard.
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel14
  - number: '15'
    text: |-
      1 De aanspraak op bezoldiging kan door het bevoegd gezag geheel of ten dele vervallen worden verklaard, indien en
      zolang de betrokkene:

      a. weigert zich te onderwerpen aan een krachtens dit besluit opgedragen geneeskundig onderzoek, dan wel, na voor
      zulk een onderzoek behoorlijk te zijn opgeroepen, zonder geldige reden niet verschijnt;

      b. weigert of verzuimt tijdig een een WAO- of WIA-uitkering bij het Uitvoeringsinstituut werknemersverzekeringen
      aan te vragen, dan wel een verzoek tot verlenging van die uitkering bij het Uitvoeringsinstituut
      werknemersverzekeringen in te dienen;

      c. weigert de volledige medewerking te verlenen aan een geneeskundig onderzoek ter beoordeling van zijn recht op
      een een WAO- of WIA-uitkering;

      d. de controlevoorschriften overtreedt, indien deze voor hem zijn vastgesteld;

      e. het land verlaat zonder een geneeskundige verklaring van geen bezwaar;

      f. ten onrechte verzuimt zich onder geneeskundige behandeling te stellen of te blijven stellen, dan wel zich niet
      houdt aan de hem door de deskundige persoon, de arbodienst of het Uitvoeringsinstituut werknemersverzekeringen
      gegeven voorschriften, of anderszins zich zodanig gedraagt, dat zijn genezing wordt belemmerd of vertraagd, met
      dien verstande, dat te dezen voorschriften tot het verlenen van medewerking aan een ingreep van heelkundige of
      diagnostische aard zijn uitgezonderd;

      g. tijdens de verhindering om zijn dienst te verrichten, voor zichzelf of voor derden arbeid verricht, tenzij dit
      blijkens een geneeskundige verklaring door de arbodienst of het Uitvoeringsinstituut werknemersverzekeringen, in
      het belang van zijn genezing, reïntegratie of herplaatsbaarheid gewenst wordt geacht;

      h. in gebreke blijft op het door de arbodienst of het Uitvoeringsinstituut werknemersverzekeringen bepaalde
      tijdstip en in de door hen bepaalde mate zijn arbeid of hem passende arbeid, dan wel, na afloop van een periode
      van 52 weken onafgebroken arbeidsongeschiktheid, gangbare arbeid te verrichten, tenzij hij daarvoor een inmiddels
      ontstane, door de arbodienst of het Uitvoeringsinstituut werknemersverzekeringen als geldig erkende reden heeft
      opgegeven;

      i. zonder deugdelijke grond weigert mee te werken aan door het bevoegd gezag of door een door het bevoegd gezag
      aangewezen deskundige gegeven redelijke voorschriften of getroffen maatregelen die er op gericht zijn om de
      betrokkene in staat te stellen passende arbeid te verrichten;

      j. zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren en bijstellen van een plan van
      aanpak als bedoeld in [artikel 11, tweede lid][ref1].

      2 Het geheel of gedeeltelijk vervallen van aanspraken, bedoeld in het eerste lid, gaat in op een tijdstip, bij de
      beslissing van het bevoegd gezag vermeld. Dit tijdstip ligt niet voor de dag van die beslissing.

      3 De door het Uitvoeringsinstituut werknemersverzekeringen overeenkomstig [hoofdstuk II van de WAO][ref2] dan
      wel [hoofdstuk 10 van de Wet WIA][ref3] vastgestelde en opgelegde voorschriften en verplichtingen gelden voor de
      betrokkene als waren deze vastgesteld en opgelegd door het bevoegd gezag.

      4 Indien betrokkene door het Uitvoeringsinstituut werknemersverzekeringen één of meer sancties zijn opgelegd
      overeenkomstig [hoofdstuk II van de WAO][ref4] dan wel [hoofdstuk 10 van de Wet WIA][ref5], gelden deze sancties
      voor betrokkene als waren zij hem opgelegd door het bevoegd gezag met dienovereenkomstige uitwerking op de
      bezoldiging.

      5 De ingevolge [artikel 14][ref6] of dit artikel geheel of gedeeltelijk geweigerde of vervallen verklaarde
      bezoldiging, wordt alsnog aan de betrokkene uitbetaald, wanneer de commissie van artsen bij een hernieuwd
      onderzoek, ingesteld overeenkomstig [artikel 19][ref7], te zijnen gunste beslist. Eveneens wordt de geheel
      of gedeeltelijk geweigerde of vervallen verklaarde bezoldiging alsnog aan betrokkene uitbetaald ingeval, en
      afhankelijk van de mate waarin, het Uitvoeringsinstituut werknemersverzekeringen naderhand van oordeel mocht zijn
      dat de sancties, bedoeld in het vierde lid, ten onrechte zijn opgelegd. Uitbetaling van evenbedoelde bezoldiging
      vindt plaats met dien verstande, dat een uitkering ingevolge [artikel 16, tweede lid][ref8], daarop in mindering
      wordt gebracht.


