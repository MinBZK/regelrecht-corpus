  - number: '17'
    text: |-
      1 Onverminderd de [artikelen 11][ref1] en 12 kan het bevoegd gezag de betrokkene doen onderwerpen aan een
      geneeskundig onderzoek ter beoordeling van de vraag:

      a. of er sprake is van verhindering tot het verrichten van zijn arbeid;

      b. of zich een omstandigheid voordoet als bedoeld in [artikel 14][ref2] of in
      [artikel 15, eerste lid onder f][ref3];

      c. of verdere maatregelen in het belang van het herstel nodig zijn;

      d. wanneer en in welke mate de dienst kan worden hervat;

      e. of er termen bestaan een geneeskundige verklaring van geen bezwaar als bedoeld in
      [artikel 15, eerste lid onder e][ref4], af te geven.

      2 Zodra het bevoegd gezag kennis heeft genomen van de conclusies van het onderzoek, wordt de betrokkene van deze
      conclusies onverwijld schriftelijk in kennis gesteld. Op verzoek van betrokkene wordt eveneens zijn behandelend
      arts schriftelijk in kennis gesteld van evenbedoelde conclusies.


