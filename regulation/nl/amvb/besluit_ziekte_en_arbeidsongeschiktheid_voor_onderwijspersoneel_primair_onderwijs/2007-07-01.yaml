  - number: '6'
    text: |-
      1 Het bevoegd gezag en de betrokkene zijn verplicht zich als een goed werkgever en een goed werknemer te gedragen.

      2 Het bevoegd gezag is verplicht de lokalen, werktuigen, hulpmiddelen en gereedschappen waarin of waarmee het de
      arbeid doet verrichten, op zodanige wijze in te richten en te onderhouden alsmede voor het verrichten van de arbeid
      zodanige maatregelen te treffen en aanwijzingen te verstrekken als redelijkerwijs nodig is om te voorkomen dat de
      betrokkene in de uitoefening van zijn werkzaamheden schade lijdt.

      3 Het bevoegd gezag is jegens de betrokkene aansprakelijk voor de schade die de betrokkene in de uitoefening van
      zijn werkzaamheden lijdt, tenzij het aantoont dat het de in het tweede lid bedoelde verplichtingen is nagekomen of
      dat de schade in belangrijke mate het gevolg is van opzet of bewuste roekeloosheid van betrokkene.

      4 Het bevoegd gezag kan uit hoofde van het eerste lid de werknemer schadeloos stellen, kosten vergoeden of
      overigens een geldelijke tegemoetkoming verlenen naar hetgeen met het oog op de omstandigheden redelijk te achten
      is.

      5 Het bevoegd gezag is bij aansprakelijkheid uit hoofde van het derde lid verplicht de betrokkene schadeloos te
      stellen, kosten te vergoeden of overigens een geldelijke tegemoetkoming te verlenen.

      6 De schadeloosstelling vergoedt ten minste de loonschade van de betrokkene tijdens ziekte of
      arbeidsongeschiktheid, voor zover deze niet wordt gedekt door het recht van de werknemer op loondoorbetaling
      bij ziekte, een eventuele vergoeding van kosten op grond van artikel 43 of op een wettelijke of bovenwettelijke
      arbeidsongeschiktheidsuitkering.

      7 Het derde tot en met zesde lid van dit artikel blijven buiten toepassing ten aanzien van de betrokkene die zonder
      aannemelijke redenen verzuimd heeft aan het bevoegd gezag binnen 30 dagen mededeling te doen van het bestaan van
      een omstandigheid als bedoeld in het derde of vierde lid.
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel6
  - number: '7'
    text: |-
      Ter bepaling van de in [artikel 4, eerste lid][ref1], genoemde termijn wordt een opnieuw ingegaan verlof wegens
      ziekte of arbeidsongeschiktheid als een voortzetting van het vorige verlof beschouwd, tenzij het nieuwe verlof zich
      voordoet nadat de betrokkene gedurende ten minste vier weken zijn dienst daadwerkelijk volledig had hervat.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel4
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel7
