  - number: '42'
    text: |-
      Door het bevoegd gezag kan in bijzondere gevallen aan de betrokkene een tegemoetkoming worden toegekend in
      noodzakelijk gemaakte kosten, verband houdende met ziekte, welke de betrokkene voor zichzelf en voor zijn
      medebetrokkenen, bedoeld in de Regeling ziektekostenvoorziening overheidspersoneel, heeft gemaakt, indien hierin
      niet ingevolge een andere regeling kan worden voorzien en deze kosten redelijkerwijs niet te zijnen laste kunnen
      blijven.
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel42
  - number: '43'
    text: |-
      In geval van ziekte en arbeidsongeschiktheid die naar het oordeel van het bevoegd gezag in overwegende mate
      veroorzaakt is door de aard van de aan de betrokkene opgedragen werkzaamheden, dan wel door de omstandigheden
      waaronder deze moesten worden verricht, en niet aan zijn schuld of onvoorzichtigheid is te wijten, worden hem
      vergoed de naar het oordeel van het bevoegd gezag te zijnen laste blijvende noodzakelijk gemaakte kosten van
      geneeskundige behandeling.
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel43
  - number: '44'
    text: |-
      1 Het bevoegd gezag kan al hetgeen op grond van dit besluit onverschuldigd of te veel is betaald
      geheel of gedeeltelijk terugvorderen of in mindering brengen op een later te betalen bezoldiging
      of uitkering op grond van dit besluit, dan wel verrekenen met uitkeringen op grond van het
      [Kaderbesluit rechtspositie PO][ref1], dan wel het [Besluit werkloosheid onderwijs- en onderzoekpersoneel][ref2] of
      het [Besluit bovenwettelijke werkloosheidsregeling voor onderwijspersoneel primair onderwijs][ref3]:

      a. gedurende vijf jaren na de dag van de betaalbaarstelling indien het bevoegd gezag door toedoen van betrokkene
      onverschuldigd heeft betaald; en

      b. gedurende twee jaren na de dag van de betaalbaarstelling in de overige gevallen waarin het de betrokkene
      redelijkerwijs duidelijk kon zijn dat het bevoegd gezag onverschuldigd betaalde.

      2 Een voorschot wordt door betrokkene op eerste vordering van het bevoegd gezag terugbetaald of door
      het bevoegd gezag in mindering gebracht op een later te betalen bezoldiging of uitkering op grond van
      dit besluit, dan wel verrekend met uitkeringen op grond van het [Kaderbesluit rechtspositie PO][ref4],
      dan wel het [Besluit werkloosheid onderwijs- en onderzoekpersoneel][ref5] of het
      [Besluit bovenwettelijke werkloosheidsregeling voor onderwijspersoneel primair onderwijs][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020315
