  - number: 20a
    text: |-
      1 De betrokkene die in verband met ongeschiktheid ten gevolge van ziekte verhinderd is zijn arbeid te verrichten,
      kan worden ontslagen, indien hij zonder deugdelijke grond weigert:

      a. gevolg te geven aan de door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige gegeven
      redelijke voorschriften en mee te werken aan door het bevoegd gezag of een door het bevoegd gezag aangewezen
      deskundige getroffen maatregelen om hem in staat te stellen de eigen of andere passende arbeid te verrichten;

      b. passende arbeid te verrichten waartoe het bevoegd gezag hem in de gelegenheid stelt;

      c. zijn medewerking te verlenen aan het opstellen, evalueren en bijstellen van een plan van aanpak als bedoeld in
      artikel 11, tweede lid.

      2 Om te beoordelen of er sprake is van een situatie als bedoeld in het eerste lid, wint het bevoegd gezag een
      hierop betrekking hebbend advies van het Uitvoeringsinstituut werknemersverzekeringen in en neemt dit mede in
      beschouwing.
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel20a
  - number: '39'
    text: |-
      1 De gewezen betrokkene die wegens ziekte of arbeidsongeschiktheid, ontstaan voor het tijdstip waarop hem ontslag
      is verleend, niet zijnde een ontslag op grond van ziekte of arbeidsongeschiktheid, dan wel waarop een tijdelijke
      taakuitbreiding is beëindigd niet zijnde een beëindiging op grond van ziekte of arbeidsongeschiktheid, dan
      wel waarop zijn benoeming in tijdelijke dienst is afgelopen, nadien nog ongeschikt is hem passende, dan wel,
      na onafgebroken arbeidsongeschiktheid gedurende het in [artikel 19, eerste en tweede lid, van de WAO][ref1]
      dan wel [artikel 23, van de Wet WIA][ref2] bedoelde tijdvak, al dan niet verlengd op grond
      van [artikel 19, zevende lid van de WAO][ref3] dan wel [artikel 24 van de Wet WIA][ref4] of
      [artikel XV, veertiende lid, onder a en c, van de Wet terugdringing ziekteverzuim][ref5], gangbare arbeid te
      verrichten, een en ander voor zover hij niet als herplaatsbaar verklaarde is herplaatst in een betrekking, behoudt
      gedurende zijn ongeschiktheid een uitkering ter hoogte van zijn laatstgenoten bezoldiging. Het in de vorige volzin
      bepaalde geldt slechts voorzover de termijn van 12 maanden, genoemd in [artikel 4, eerste lid][ref6], nog niet is
      verstreken, doch uiterlijk tot de eerste dag van de maand volgende op die waarin de gewezen betrokkene de leeftijd
      van 65 jaar heeft bereikt. Na afloop van de termijn van 12 maanden ontvangt hij gedurende 6 maanden, doch uiterlijk
      tot de eerste dag van de maand volgende op die waarin de gewezen betrokkene de leeftijd van 65 jaar heeft bereikt,
      70% van de laatst genoten bezoldiging.

      2 De gewezen betrokkene die binnen vier weken na het tijdstip waarop hij is ontslagen, dan wel zijn tijdelijke
      taakuitbreiding is beëindigd dan wel waarop zijn benoeming in tijdelijke dienst is afgelopen, wegens ziekte
      ongeschikt wordt hem passende arbeid te verrichten, ontvangt een uitkering ter hoogte van zijn laatstelijk genoten
      bezoldiging, mits hij gedurende tenminste acht weken onmiddellijk aan dat tijdstip voorafgaand in dienst is geweest
      of, ten aanzien van de betrokkene, bedoeld in [artikel 1, onder c1 en c2][ref7], gedurende ten minste in totaal
      drie van de zes maanden onmiddellijk aan dat tijdstip voorafgaand in dienst is geweest. De uitkering ter hoogte van
      de laatstelijk genoten bezoldiging wordt uitbetaald zolang de ongeschiktheid van de betrokkene duurt en voor zover
      hij niet als herplaatsbaar verklaarde is herplaatst in een betrekking, doch uiterlijk tot en met 52 weken na de
      aanvang daarvan, dan wel indien dit eerder is tot uiterlijk de eerste dag van de maand volgende op die waarin hij
      de leeftijd van 65 jaar heeft bereikt.

      3 De gewezen betrokkene met recht op een uitkering krachtens de [ZW][ref8] heeft aanspraak op een uitkering als
      bedoeld in [artikel 39, eerste en tweede lid][ref9], verminderd met de uitkering krachtens de [ZW][ref10].

      4 Voor de gewezen betrokkene bedoeld in het eerste en tweede lid die voor het tijdstip waarop hem ontslag is
      verleend, dan wel waarop zijn benoeming in tijdelijke dienst is afgelopen, gedeeltelijk onbezoldigd buitengewoon
      verlof geniet, wordt onder laatstgenoten bezoldiging verstaan de laatstgenoten bezoldiging die hij genoot voor
      aanvang van de periode van buitengewoon verlof.

      5 Het eerste tot en met het derde lid vinden geen toepassing ten aanzien van de betrokkene, die in verband met de
      aanvaarding van werkzaamheden van ten minste gelijke omvang als die van de beëindigde dienstbetrekking, aanspraak
      kan maken op honorering, loon of bezoldiging, dan wel op een uitkering wegens ziekte en arbeidsongeschiktheid uit
      hoofde van die werkzaamheden.

      6 Indien de gewezen betrokkene binnen een tijdvak van vier weken nadat de volgens het eerste tot en met het
      derde lid geregelde doorbetaling van een uitkering ter hoogte van zijn laatstelijk genoten bezoldiging dan wel
      70% daarvan, in verband met zijn herstel is gestaakt, wederom wegens ziekte ongeschikt wordt hem passende, dan
      wel, na onafgebroken arbeidsongeschiktheid gedurende het in [artikel 19, eerste en tweede lid, van de WAO][ref11]
      dan wel [artikel 23, van de Wet WIA][ref12] bedoelde tijdvak, al dan niet verlengd op grond
      van [artikel 19, zevende lid van de WAO][ref13] dan wel [artikel 24 van de Wet WIA][ref14] of
      [artikel XV, veertiende lid, onder a en c, van de Wet terugdringing ziekteverzuim][ref15], wordt de nieuw
      opgetreden ongeschiktheid als een voortzetting van de vorige ongeschiktheid beschouwd en wordt de doorbetaling
      hervat. Voor het bepalen van het tijdstip, waarop de in het eerste tot en met het derde lid bedoelde termijnen zijn
      verstreken, worden evenbedoelde perioden van ongeschiktheid, welke elkaar met een onderbreking van minder dan vier
      weken zijn opgevolgd, samengeteld.

      7 In geval van zwangerschaps- en bevallingsverlof van de gewezen vrouwelijke betrokkene wordt
      haar uitkering krachtens de [Wet arbeid en zorg][ref16] aangevuld tot 100% van de laatst
      genoten bezoldiging. [Artikel 9, vijfde lid][ref17], is van overeenkomstige toepassing. Zolang
      zij na de beëindiging van de in de eerste volzin bedoelde uitkering nog wegens ziekte en
      arbeidsongeschiktheid ongeschikt is om haar passende arbeid te verrichten, dan wel, na onafgebroken
      arbeidsongeschiktheid gedurende het in [artikel 19, eerste en tweede lid, van de WAO][ref18],
      dan wel [artikel 23, van de Wet WIA][ref19] bedoelde tijdvak, al dan niet verlengd op grond
      van [artikel 19, zevende lid van de WAO][ref20], dan wel [artikel 24 van de Wet WIA][ref21] of
      [artikel XV, veertiende lid, onder a en c, van de Wet terugdringing ziekteverzuim][ref22], gangbare arbeid te
      kunnen verrichten, dan wel binnen vier weken na deze beëindiging in die zin arbeidsongeschikt wordt, is het tweede,
      vijfde en zesde lid van overeenkomstige toepassing. De in het tweede lid bedoelde termijn van 52 weken wordt in
      dat geval geacht aan te vangen op de dag volgende op die der bevalling. De gewezen vrouwelijke betrokkene bedoeld
      in dit lid is de vrouwelijke betrokkene wier bevalling waarschijnlijk is onderscheidenlijk plaatsvindt, binnen een
      periode van tien weken na het tijdstip van haar ontslag.

      8 Het bedrag van de een uitkering ter hoogte van de laatstelijk genoten bezoldiging, bedoeld in dit artikel dan wel
      70% daarvan wordt verminderd dan wel, voor zover het reeds is uitbetaald, verrekend met:

      a. een de betrokkene toegekende ZW-uitkering, een WW-uitkering, een bovenwettelijke WW-uitkering danwel WAO- of
      WIA-uitkering of anderszins een uitkering uit hoofde van ziekte en arbeidsongeschiktheid of werkloosheid;

      b. een de betrokkene toegekend invaliditeitspensioen door de Stichting Pensioenfonds ABP, alsmede een eventuele
      aanvulling op dat pensioen, als bedoeld in [artikel 41, derde lid][ref23];

      c. inkomsten welke de gewezen betrokkene inmiddels mocht zijn gaan genieten uit of in verband met arbeid of
      bedrijf, daaronder mede begrepen uitkeringen terzake van ziekte en arbeidsongeschiktheid, voor zover niet afkomstig
      uit verzekeringen, waarvoor de premie uitsluitend voor eigen rekening van betrokkene is betaald.

      9 In de gevallen, bedoeld in dit artikel, vinden de [artikelen 14][ref24], [15][ref25], [16][ref26] en [17][ref27],
      waar mogelijk, overeenkomstige toepassing.

      10 In de gevallen, bedoeld in dit artikel, wordt de uitkering krachtens de [Ziektewet][ref28], de [WAO][ref29], de
      [Wet WIA][ref30] of de [Wet arbeid en zorg][ref31] geacht onverminderd te zijn ontvangen, indien deze op grond van
      enige wettelijke bepaling geheel of gedeeltelijk is geweigerd, dan wel niet of niet geheel is betaald.


