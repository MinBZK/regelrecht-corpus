preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 24 juli 1995, nr. 95019 965,
    directie Arbeidsvoorwaarden en Beroepskwaliteit, gedaan mede namens Onze Minister van Landbouw, Natuurbeheer en
    Visserij;

    Gelet op artikel 20, tweede lid, van de Wet op het basisonderwijs; artikel 28, tweede lid, van de Interimwet op
    het speciaal onderwijs en het voortgezet speciaal onderwijs; de artikelen 39, tweede lid, en 76, van de Wet op
    het voortgezet onderwijs; artikel 4 van de Experimentenwet onderwijs; de artikelen 4.1.2, tweede lid, 4.1.4. en
    4.3.1., tweede lid, van de Wet educatie en beroepsonderwijs; artikel 58 van de Wet op de onderwijsverzorging; de
    artikelen 4.5, 9.74, tweede lid, 10.10, derde lid, 11.12, eerste lid, 12.5, 13.1., vijfde lid, 13.3., vijfde lid,
    van de Wet op het hoger onderwijs en wetenschappelijk onderzoek; de artikelen 14, eerste lid, en 35 van de Wet op
    de Nederlandse organisatie voor Wetenschappelijk Onderzoek; de artikelen 125 en 134 van de Ambtenarenwet;

    De Raad van State gehoord (advies van 14 december 1995, nr. W05.95.0411);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen, uitgebracht mede namens Onze
    Minister van Landbouw, Natuurbeheer en Visserij, van 15 december 1995, nr. AB 95034376, directie Arbeidsvoorwaarden
    en Beroepskwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap, en voor wat betreft het landbouwonderwijs,
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. instelling:

      1. een openbare of uit de openbare kas bekostigde bijzondere basisschool of speciale school voor basisonderwijs in
      de zin van de [Wet op het primair onderwijs][ref1];

      2. een openbare of uit de openbare kas bekostigde bijzondere school voor speciaal onderwijs, voortgezet speciaal
      onderwijs dan wel speciaal en voortgezet speciaal onderwijs in de zin van de [Wet op de expertisecentra][ref2];

      3. Een instelling gebaseerd op de [Experimentenwet onderwijs][ref3];

      4.

      5.

      6. een centrale dienst als bedoeld in [artikel 68 van de Wet op het primair onderwijs][ref4] en
      [artikel 69 van de Wet op de expertisecentra][ref5];

      7. een rechtspersoon die met toepassing van
      [artikel 2, eerste lid, onderdelen f. en g., dan wel derde lid, onderdeel b. van de Wet privatisering ABP][ref6]
      is aangewezen, onderscheidenlijk wordt geacht te zijn aangewezen als lichaam, welks personeel geheel of ten dele
      overheidswerknemer is in de zin van [die wet][ref7], indien dat lichaam middellijk of onmiddellijk, geheel of
      gedeeltelijk wordt gesubsidieerd ten laste van hoofdstuk VIII van de Rijksbegroting en waarop dit besluit door Onze
      Minister van toepassing is verklaard;

      8. een instelling als bedoeld in
      [artikel 1.2, onder a, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref8];

      9. de organisatie genoemd in de [Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref9].

      c. betrokkene:

      1. een personeelslid als bedoeld in de [artikelen 34][ref10] en [68 van de Wet op het primair onderwijs][ref11];

      2. een personeelslid als bedoeld in de [artikelen 34][ref12] en [69 van de Wet op de expertisecentra][ref13];

      3. een personeelslid van een school waarvoor ingevolge
      [artikel 4, eerste lid, van de Experimentenwet onderwijs][ref14], de formatie wordt vastgesteld;

      4.

      5. een door het bevoegd gezag benoemd personeelslid aan één of meer van de onder b in de onderdelen 5 en 7 genoemde
      instellingen;

      6.

      7. het benoemde lid van het algemeen bestuur van de organisatie genoemd in de
      [Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref15]; alsmede in voorkomende gevallen
      de gewezen betrokkene door wie een uitkering is aangevraagd of aan wie een uitkering ingevolge dit besluit is
      toegekend.

      De betrokkene, alsmede de gewezen betrokkene, die geen overheidswerknemer is in de zin van de [WPA][ref16], kan aan
      dit besluit geen rechten ontlenen.

      d. bevoegd gezag:

      Ten aanzien van:

        - een rijksinstelling zonder rechtspersoonlijkheid: Onze Minister;
        - een rijksinstelling met rechtspersoonlijkheid: het college van bestuur;
        - een publiekrechtelijke provinciale instelling: het college van gedeputeerde staten, voor zover de provinciale
      staten niet anders bepalen, en, indien de provinciale staten dit wenselijk oordelen, met inachtneming van door hen
      te stellen regelen;
        - een gemeentelijke instelling: het college van burgemeester en wethouders, voorzover de raad niet anders bepaalt,
      en, indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen regelen, dan wel, wanneer de
      instelling van meer dan één gemeente uitgaat, het krachtens de desbetreffende gemeenschappelijke regeling bevoegde
      orgaan;
        - een publiekrechtelijke regionale instelling: het krachtens de desbetreffende gemeenschappelijke regeling bevoegde
      orgaan;
        - een privaatrechtelijke instelling met of zonder rechtspersoonlijkheid: het instellingsbestuur.

      e. lichamen: rechtspersonen, maat- en vennootschappen, samenwerkingsvormen zonder rechtspersoonlijkheid die met
      verenigingen maatschappelijk gelijk kunnen worden gesteld, ondernemingen van publiekrechtelijke rechtspersonen
      en doelvermogens;

      f. bezoldiging: de som van het salaris en de toelagen, zoals gedefinieerd in het voor de betrokkene van toepassing
      zijnde rechtspositiebesluit of rechtspositiereglement;

      g. arbodienst: een arbodienst als bedoeld in de [Arbeidsomstandighedenwet][ref17];

      h. geneeskundig onderzoek: een onderzoek door of namens het Uitvoeringsinstituut werknemersverzekeringen, dan wel
      een voor rekening van het bevoegd gezag komend onderzoek door de arbodienst;

      i. geneeskundige verklaring: een geneeskundige verklaring, afgegeven op grond van het geneeskundig onderzoek;

      j. bedrijfsgezondheidskundige begeleiding: de begeleiding door of namens een arbodienst, gericht op het voorkomen
      van ziekte en arbeidsongeschiktheid, dan wel op het eindigen daarvan.

      k. WPA: de [Wet privatisering ABP][ref18];

      l. WAO: de [Wet op de Arbeidsongeschiktheidsverzekering][ref19];

      m. AAW: de Algemene Arbeidsongeschiktheidswet;

      n. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref20];

      o. pensioenreglement: het pensioenreglement van de Stichting Pensioenfonds ABP;

      p. arbeidsongeschiktheid: arbeidsongeschiktheid in de zin van [artikel 18, eerste lid, van de WAO][ref21];

      q. arbeidsongeschiktheidsuitkering: een uit enig dienstverband van de betrokkene voortvloeiende en aan hem
      periodiek uitbetaalde uitkering terzake van het op grond van ziekten of gebreken geheel of gedeeltelijk ongeschikt
      zijn om passende, dan wel gangbare arbeid te verrichten;

      r. passende arbeid: alle arbeid die voor de krachten en bekwaamheden van de betrokkene is berekend, tenzij
      aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan worden gevergd;

      s. gangbare arbeid: alle algemeen geaccepteerde arbeid waartoe de betrokkene met zijn krachten en bekwaamheden in
      staat is en waarmee hij kan verdienen, hetgeen gezonde personen met soortgelijke opleiding en ervaring, ter plaatse
      waar hij arbeid verricht of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen.

      Niet daaronder wordt verstaan een dienstbetrekking in de zin van de Wet op de sociale werkvoorziening;

      t. WAO uitkering: een op grond van de [WAO][ref22] toegekende arbeidsongeschiktheidsuitkering;

      u. werkloosheidsuitkering: een periodieke uitkering terzake van ontslag of werkloosheid, die voortvloeit uit enig
      dienstverband van betrokkene;

      v. suppletie: een uitkering na ontslag krachtens hoofdstuk 3 van dit besluit terzake van een op het moment van
      ontslag bestaande arbeidsongeschiktheid van minder dan 80% in de zin van de [WAO][ref23];

      w. invaliditeitspensioen: een invaliditeitspensioen als bedoeld in paragraaf 8 van het pensioenreglement;

      x. herplaatsingstoelage: een toelage bij herplaatsing als bedoeld in paragraaf 9 van het pensioenreglement;

      y. buitengewoon verlof: een met instandhouding van de arbeidsovereenkomst of aanstelling, tussen een instelling
      en de bij die instelling in dienst zijnde betrokkene, overeengekomen periode van verlof, zonder behoud van
      bezoldiging;

      z. ZW: de [Ziektewet][ref24];

      aa. ZW-uitkering: ziekengeld als bedoeld in [artikel 19 van de Ziektewet][ref25];

      bb. WW: de [Werkloosheidswet][ref26];

      cc. BBWO: [Besluit bovenwettelijke werkloosheidsregeling voor onderwijspersoneel primair onderwijs][ref27];

      dd. de OOW: de [Wet overheidspersoneel onder de werknemersverzekeringen][ref28];

      ee. fase 2 en fase 3 van de OOW: fase 2 respectievelijk fase 3, bedoeld in [artikel 94, tweede lid, OOW][ref29];

      ff. deskundige persoon: een deskundige persoon als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref30] die belast is met de taken, bedoeld in
      [artikel 14, eerste lid, onderdelen b of c, van die wet][ref31];

      gg. Wet WIA: [Wet werk en inkomen naar arbeidsvermogen][ref32];

      hh. WIA-uitkering: de arbeidsongeschiktheidsuitkering of de werkhervattingsuitkering gedeeltelijk
      arbeidsgeschikten, bedoeld in [hoofdstuk 6][ref33] onderscheidenlijk [7 van de Wet WIA][ref34];

      ii. IVA-uitkering: de arbeidsongeschiktheidsuitkering, bedoeld in [hoofdstuk 6 van de Wet WIA][ref35];

      jj. WGA-uitkering: de werkhervattingsuitkering gedeeltelijk arbeidsgeschikten, bedoeld in
      [hoofdstuk 7 van de Wet WIA][ref36].


