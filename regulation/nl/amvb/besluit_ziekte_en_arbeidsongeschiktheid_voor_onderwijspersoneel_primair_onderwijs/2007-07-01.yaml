        artikel: '4'
        hoofdstuk: '1'
  - number: '8'
    text: |-
      1 Ten aanzien van de betrokkene die verlof wegens ziekte of arbeidsongeschiktheid geniet, kan het bevoegd gezag
      bepalen, dat hij zijn arbeid slechts zal mogen hervatten indien blijkens een geneeskundige verklaring, waarbij
      is bepaald de mate, waarin de hervatting kan geschieden, daarvoor toestemming is verleend. Deze toestemming is in
      ieder geval vereist, wanneer de betrokkene gedurende meer dan één jaar evenbedoeld verlof volledig heeft genoten.

      2 De betrokkene die verlof wegens ziekte of arbeidsongeschiktheid geniet kan, doch niet vaker dan éénmaal in een
      tijdvak van één maand, het bevoegd gezag schriftelijk verzoeken hem te doen onderwerpen aan een onderzoek door de
      deskundige persoon of de arbodienst, ter verkrijging van een geneeskundige verklaring als bedoeld in het eerste
      lid. Het bevoegd gezag is gehouden binnen 14 dagen aan dit verzoek te voldoen.
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel8
  - number: '9'
    text: |-
      1 De vrouwelijke betrokkene heeft in verband met haar bevalling aanspraak op zwangerschaps- en bevallingsverlof.

      2 Gedurende het zwangerschap- en bevallingsverlof, bedoeld in het eerste lid, heeft de vrouwelijke betrokkene
      aanspraak op haar volle bezoldiging.

      3 Indien aan de vrouwelijke betrokkene een uitkering op grond van
      [Hoofdstuk 3, afdeling 2 van de Wet Arbeid en Zorg][ref1] is toegekend, wordt het bedrag van die uitkering in
      mindering gebracht op het bedrag, waarop zij ingevolge het tweede lid recht heeft.

      4 Indien de vrouwelijke betrokkene recht heeft op een uitkering als bedoeld in het derde lid, maar deze uitkering
      als gevolg van het achterwege laten van een aanvraag daartoe door de vrouwelijke betrokkene niet wordt toegekend,
      wordt deze uitkering voor de toepassing van het derde lid geacht toch te zijn genoten.

      5 De betrokkene doet ten minste vier weken voor de dag waarop de bevalling over zes weken is te verwachten aan het
      bevoegd gezag mededeling van de datum van ingang van het zwangerschapsverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Afdeling2
