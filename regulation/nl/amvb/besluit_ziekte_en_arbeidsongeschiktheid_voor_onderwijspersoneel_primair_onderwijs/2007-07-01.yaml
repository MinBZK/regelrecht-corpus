  - number: 11a
    text: |-
      De betrokkene die in verband met ongeschiktheid ten gevolge van ziekte verhinderd is zijn arbeid te verrichten,
      is gehouden:

      a. gevolg te geven aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige gegeven redelijke
      voorschriften en mee te werken aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige
      getroffen maatregelen als bedoeld in artikel 11, eerste lid;

      b. zijn medewerking te verlenen aan het opstellen, evalueren en bijstellen van een plan van aanpak als bedoeld in
      artikel 11, tweede lid;

      c. passende arbeid te verrichten waartoe het bevoegd gezag hem in de gelegenheid stelt.
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel11a
  - number: '13'
    text: |-
      1 Indien de betrokkene in het belang van zijn reïntegratie op advies van de deskundige persoon, de Arbo-dienst
      of het reïntegratiebedrijf wenselijk geachte arbeid voor het bevoegd gezag of voor derden verricht, worden
      de inkomsten uit deze arbeid hierop geheel in mindering gebracht zolang hij aanspraak kan maken op zijn volle
      bezoldiging. Onder in het belang van zijn reïntegratie wenselijk geachte arbeid wordt niet verstaan arbeid op
      therapeutische basis. Er is sprake van arbeid op therapeutische basis, indien de arbeid van de betrokkene aan de
      volgende eisen voldoet:

      a. de activiteiten moeten binnen een van tevoren aangegeven periode uitgevoerd worden

      b. de periode mag niet langer dan 6 weken zijn

      c. de werkzaamheden moeten deel uitmaken van een opbouwend reïntegratietraject

      d. het mag géén bestaande functie zijn die in de CAO staat omschreven

      e. het moet een gecreëerde functie zijn

      f. er moet te allen tijde begeleiding aanwezig zijn

      g. de persoon moet op elk moment weg kunnen gaan.

      2 Indien de betrokkene na 12 maanden ziekte in het belang van zijn reïntegratie op advies van de deskundige
      persoon, de ARBO-dienst of het reïntegratiebedrijf voor het bevoegd gezag of voor derden wenselijk geachte
      arbeid verricht, behoudt hij voor de uren dat bedoelde arbeid wordt verricht de bezoldiging per uur in de
      eigen functie en over de resterende verlofuren wegens ziekte 70% van de bezoldiging in de eigen functie.
      [Artikel 4, derde tot en met zevende lid][ref1], is van toepassing.

      3 Scholing ten behoeve van reïntegratie geldt als ziekteverlof, tenzij het op advies van de deskundige persoon,
      de Arbo-dienst of het reïntegratiebedrijf met het bevoegd gezag overeengekomen voor reïntegratie noodzakelijke
      scholing betreft. Deze voor reïntegratie noodzakelijke scholing dient gevolgd te worden binnen het kader van het
      verrichten van de in het eerste en tweede lid bedoelde wenselijk geachte arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel4
