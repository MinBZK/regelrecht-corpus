  - number: '41'
    text: |-
      1 Aan de gewezen betrokkene die een WAO uitkering ontvangt, wordt, indien zijn arbeidsongeschiktheid naar het
      oordeel van het bevoegd gezag in overwegende mate werd veroorzaakt door de aard van de hem opgedragen werkzaamheden
      of door de bijzondere omstandigheden waaronder deze moesten worden verricht, en de arbeidsongeschiktheid niet
      aan zijn schuld of onvoorzichtigheid is te wijten, een uitkering verleend in aanvulling op een hem uit hoofde van
      die arbeidsongeschiktheid toegekende suppletie krachtens hoofdstuk 3 van dit besluit dan wel op een hem toegekend
      invaliditeitspensioen en/of herplaatsingstoelage door de Stichting Pensioenfonds ABP.

      2 Ingeval van toekenning van een suppletie, als bedoeld in het eerste lid, omvat de uitkering, bedoeld in dat lid,
      een zodanig bedrag, dat de betrokkene, te zamen met die suppletie, 90,02% van zijn laatstelijk genoten bezoldiging
      ontvangt.

      3 Ingeval van toekenning van een invaliditeitspensioen, als bedoeld in het eerste lid, omvat de uitkering,
      bedoeld in dat lid, een zodanig bedrag, dat betrokkene, te zamen met het invaliditeitspensioen en/of de
      herplaatsingstoelage, bij een arbeidsongeschiktheid van:

      80% of meer: 90,02%

      65 tot 80%: 65,26%

      55 tot 65%: 54,01%

      45 tot 55%: 45,01%

      35 tot 45%: 36,01%

      25 tot 35%: 27,01%

      15 tot 25%: 18,00%

      van de laatstelijk genoten bezoldiging ontvangt, mits hij gebruik heeft gemaakt van de hem door de Stichting
      Pensioenfonds ABP geboden mogelijkheid tot individuele bijverzekering tegen de gevolgen van de verlaging van zijn
      invaliditeitspensioen in de periode, bedoeld in artikel 21*b* van de WAO.

      Heeft de gewezen betrokkene van deze mogelijkheid tot individuele bijverzekering geen gebruik gemaakt, dan omvat
      de uitkering, bedoeld in het eerste lid, een zodanig bedrag dat betrokkene gedurende de periode, bedoeld in artikel
      21*b* van de WAO, te zamen met het invaliditeitspensioen bij een arbeidsongeschiktheid van:

      80% of meer: 83,59%

      65 tot 80%: 60,76%

      55 tot 65%: 50,15%

      45 tot 55%: 41,80%

      35 tot 45%: 33,44%

      25 tot 35%: 25,08%

      15 tot 25%: 16,72%

      van de laatstelijk genoten bezoldiging ontvangt.

      De uitkering eindigt op het moment dat de gewezen betrokkene niet meer voldoet aan de voorwaarden, genoemd in het
      eerste lid, en in ieder geval met ingang van de eerste dag van de maand waarin de betrokkene de leeftijd van 65
      jaar bereikt.

      4 Indien ingevolge het bepaalde in artikel 8.10 van het pensioenreglement van de Stichting Pensioenfonds ABP een
      algemeen neerwaartse wijziging is doorgevoerd ten aanzien van het invaliditeitspensioen, genoemd in het eerste en
      derde lid, wordt deze neerwaartse wijziging zes maanden nadien op overeenkomstige wijze doorgevoerd ten aanzien
      van de uitkering, bedoeld in het eerste lid, tenzij binnen die periode van zes maanden sociale partners anders
      overeenkomen.

      5 Bij de vaststelling van de uitkering, bedoeld in het eerste lid, worden, indien een WAO uitkering, een suppletie,
      een invaliditeitspensioen, een werkloosheidsuitkering, dan wel een naar aard en strekking met deze uitkeringen
      overeenkomende uitkering, door samenloop met andere inkomsten, dan wel door toedoen of nalaten van betrokkene
      blijvend of tijdelijk en/of geheel of gedeeltelijk worden geweigerd, verminderd of beëindigd, deze uitkeringen
      steeds geacht door betrokkene onverminderd te worden genoten.

      Het bepaalde in [artikel 40, tweede, derde, vijfde, zesde, zevende en negende lid][ref1], is van overeenkomstige
      toepassing.

      6 Indien het overlijden van een betrokkene, dan wel van een voor een uitkering, als bedoeld in de voorgaande
      leden, in aanmerking gekomen gewezen betrokkene, het rechtstreeks gevolg is van arbeidsongeschiktheid, bedoeld in
      het eerste lid, wordt aan degene die in verband met dit overlijden krachtens de WPA een nabestaandenpensioen van
      de Stichting Pensioenfonds ABP geniet een uitkering verleend ten bedrage van 18% van dit pensioen. De uitkering
      eindigt met ingang van de maand waarin de overledene de leeftijd van 65 jaar zou hebben bereikt, dan wel, indien
      de weduwe of de weduwnaar aan wie een pensioen werd toegekend hertrouwt, met ingang van de maand volgend op die van
      het hertrouwen. Het bepaalde in [artikel 40, eerste, tweede, derde, vijfde, zesde, zevende en negende lid][ref2] is
      van overeenkomstige toepassing.

      7 Geen recht op een uitkering, als bedoeld in het eerste lid, heeft de betrokkene die verzuimd heeft binnen 3 jaar,
      te rekenen vanaf de dag volgend op de dag waarop hij is ontslagen, aan het bevoegd gezag mededeling te doen van het
      bestaan van een omstandigheid als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel40
