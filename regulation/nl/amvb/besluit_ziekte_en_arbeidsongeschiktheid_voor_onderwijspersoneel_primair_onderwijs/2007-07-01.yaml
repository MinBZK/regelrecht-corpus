  - number: '20'
    text: |-
      1 Het bevoegd gezag kan, doch niet vaker dan eenmaal in een tijdvak van drie maanden, de betrokkene doen
      onderwerpen aan een geneeskundig onderzoek ter beantwoording van de vraag of volledige hervatting van zijn arbeid
      al dan niet blijvend is uitgesloten.

      2 Indien blijkt dat de betrokkene op grond van ziekten of gebreken is geraakt in een toestand van blijvende
      ongeschiktheid om aan de aan zijn functie gestelde vereisten te voldoen, kan hij worden ontslagen, mits:

      a. deze blijvende ongeschiktheid onafgebroken 2 jaar heeft geduurd en;

      b. herstel binnen een periode van 6 maanden na deze 2 jaar redelijkerwijs niet is te verwachten en;

      c. er bij het bevoegd gezag voor betrokkene geen reële herplaatsingsmogelijkheden zijn.

      3 Bij het bepalen van de periode van twee jaar, bedoeld in het tweede lid, onder a, worden niet in aanmerking
      genomen perioden van afwezigheid van een vrouwelijke betrokkene wegens zwangerschaps- of bevallingsverlof of wegens
      door de zwangerschap of bevalling veroorzaakte ziekte in de periode van het begin van de zwangerschap tot aan het
      einde van het bevallingsverlof.

      4 Ter bepaling van de periode van twee jaar, bedoeld in het tweede lid, onder a, worden perioden van ongeschiktheid
      voor zijn betrekking samengeteld:

      a. indien zij elkaar met een onderbreking van minder dan vier weken opvolgen;

      b. indien zij worden onderbroken door afwezigheid wegens zwangerschaps- of bevallingsverlof of wegens door
      zwangerschap of bevalling veroorzaakte ziekte in de periode vanaf het begin van de zwangerschap tot aan het einde
      van het bevallingsverlof;

      c. indien een onder b bedoelde afwezigheid wordt voorafgegaan of wordt gevolgd door een periode van
      arbeidsgeschiktheid, die in totaal minder dan vier weken bedraagt.

      5 De termijn van twee jaren, bedoeld in het tweede lid, wordt verlengd:

      a. met de duur van de vertraging indien de werkgever de aangifte, bedoeld in
      [artikel 38, eerste lid, van de Ziektewet][ref1] later doet dan in dat artikel is voorgeschreven;

      b. met de duur van de verlenging van de wachttijd, bedoeld in [artikel 19, eerste lid, van de WAO][ref2], indien
      die wachttijd op grond van het zevende lid van dat artikel wordt verlengd; en

      c. met de duur van de verlenging van de wachttijd, bedoeld in [artikel 24, eerste lid van de Wet WIA][ref3]; en

      d. met de duur van het tijdvak dat het Uitvoeringsinstituut werknemersverzekeringen heeft vastgesteld op grond van
      [artikel 71a, negende lid, van de WAO][ref4] dan wel [artikel 25, negende lid, van de Wet WIA][ref5].

      6 Indien het bevoegd gezag wenst over te gaan tot ontslag, dient het de betrokkene schriftelijk aan te zeggen
      dat de procedure ter beoordeling van de medische geschiktheid voor de functie en de kansen op herstel binnen drie
      maanden in gang wordt gezet. Deze aanzegging geschiedt op zijn vroegst vanaf de 21e maand na de eerste ziektedag,
      met dien verstande dat de procedure, bedoeld in het zevende en achtste lid, uiterlijk in de 24e maand na de eerste
      ziektedag moet kunnen zijn afgerond.

      7 Bij het onderzoek ter beoordeling van de vraag of er sprake is van een situatie, als bedoeld in het tweede lid,
      onderdelen a en b, betrekt het bevoegd gezag de uitslag van de WIA-claimbeoordeling en een door het bevoegd gezag
      of de werknemer aangevraagd deskundigenoordeel door het UWV.

      8 Ter beoordeling van de vraag of er sprake is van een situatie, als bedoeld in het tweede lid, onderdeel *c*, is
      vereist dat het bevoegd gezag door middel van een zorgvuldig onderzoek kan aantonen dat er voor betrokkene geen
      reële herplaatsingsmogelijkheden zijn. Hiertoe onderzoekt het bevoegd gezag eerst of de mogelijkheid bestaat van
      plaatsing in een functie met passende arbeid, en daarna, indien die mogelijkheid zich niet voordoet doch niet
      eerder dan na afloop van het eerste ziektejaar, in een functie met gangbare arbeid.

      9 Bij het onderzoek, bedoeld in het achtste lid, betrekt het bevoegd gezag ook het resultaat van de WIA-
      claimbeoordeling en een door bevoegd gezag of de werknemer aangevraagd deskundigenoordeel van het UWV.

      10 Indien bij het onderzoek naar de blijvende ongeschiktheid voor zijn betrekking, bedoeld in de voorgaande leden,
      het Uitvoeringsinstituut werknemersverzekeringen in het kader van de WIA-claimbeoordeling van oordeel is, dat de
      betrokkene arbeidsgeschikt is voor en herplaatsbaar in zijn eigen betrekking onder andere voorwaarden, dan wel
      in één of meer andere functies bij het bevoegd gezag, is ontslag slechts mogelijk indien de betrokkene direct
      aansluitend onder die andere voorwaarden in zijn betrekking, dan wel in die andere functie of één van die andere
      functies wordt benoemd.

      11 Tegen de conclusie van het onderzoek, bedoeld in het achtste lid, alsmede het oordeel van het
      Uitvoeringsinstituut werknemersverzekeringen, bedoeld in het negende lid, staat geen beroep open bij de rechter.

      12 Een betrokkene die door UWV in het kader van de uitvoering van de [Wet WIA][ref6] voor 65% of meer
      arbeidsgeschikt is verklaard, wordt na afloop van de termijn bedoeld in het tweede lid, niet ontslagen uit
      zijn betrekking op grond van arbeidsongeschiktheid tenzij sprake is van een zwaarwegend dienstbelang. Van een
      zwaarwegend dienstbelang is in elk geval sprake indien het in dienst houden van betrokkene leidt tot ernstige
      financiële problemen voor het bevoegd gezag. Bij voortzetting van het dienstverband maken bevoegd gezag en
      betrokkene afspraken over de inhoud van de functie en de daarbij behorende beloning. De afspraken in het kader
      van een voortzetting van het dienstverband worden schriftelijk bevestigd aan de betrokkene. Het eventuele verschil
      tussen de oude en de nieuwe bezoldiging wordt gedurende een periode van 5 jaar voor 65% gecompenseerd. Op deze
      compensatie wordt een recht van de betrokkene op een wettelijke of bovenwettelijke werkloosheidsuitkering terzake
      van werkloosheid uit de in de eerste volzin bedoelde betrekking, in mindering gebracht.

      13 De schriftelijke bevestiging, bedoeld in het twaalfde lid, is een voor beroep vatbare beslissing.

      14 Onder bezoldiging bedoeld in het twaalfde lid wordt verstaan de bezoldiging inclusief de vakantie-uitkering
      en de overige in het voor de betrokkene van toepassing zijnde rechtspositiebesluit of rechtspositiereglement
      opgenomen toelagen, toeslagen en eindejaarsuitkeringen, waarbij een eventuele korting op de bezoldiging op grond
      van [artikel 4][ref7] dan wel op grond van [titel 16 van het Rechtspositiebesluit WPO/WEC][ref8] of een daarmee
      overeenkomende regeling op grond van een collectieve arbeidsovereenkomst, buiten beschouwing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
