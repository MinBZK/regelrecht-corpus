  - number: '40'
    text: |-
      1 Ter verkrijging van de in [artikel 39, eerste, tweede, vierde en zesde lid][ref1] bedoelde
      aanspraken richt de gewezen betrokkene binnen 7 dagen na het ontstaan van de voor die
      aanspraken vereiste omstandigheden een aanvraag tot het bevoegd gezag, dan wel aan Onze
      Minister indien hij in dienstbetrekking werkzaam was bij een of meer instellingen, genoemd in
      __REF001___________________________________________________________________________________________________________
      _____________________________. Bij overschrijding van deze termijn vervalt de aanspraak gedurende het aantal dagen
      van deze overschrijding, tenzij de gewezen betrokkene aantoont, dat hij redelijkerwijs niet in staat is geweest die
      termijn in acht te nemen.

      2 De vaststelling en wijziging van de in dit artikel bedoelde aanspraken geschiedt door het bevoegd gezag. De
      uitbetaling vindt maandelijks plaats, tenzij deze met toestemming van de gewezen betrokkene in langere termijnen
      geschiedt. Het bevoegd gezag kan, vooruitlopende op de vaststelling van de aanspraken, uitbetalingen aan de
      betrokkene verrichten bij wijze van voorschot.

      3 De gewezen betrokkene wordt door het aanvaarden van de vastgestelde aanspraken, bedoeld in het
      [eerste, tweede, vierde, zesde en achtste lid van artikel 39][ref3], geacht er in toe te stemmen dat allen die
      daarvoor naar het oordeel van het bevoegd gezag in aanmerking komen, omtrent zijn omstandigheden alle inlichtingen
      verschaffen welke voor de uitvoering van evenbedoelde aanspraken nodig zijn.

      4 De gewezen betrokkene is verplicht, indien het bevoegd gezag daartoe aanleiding ziet, zich te onderwerpen aan
      een geneeskundig onderzoek tot het verkrijgen van ieder mogelijke uitkering ingevolge arbeidsongeschiktheid, ter
      vervanging van de in [artikel 39, eerste, tweede, vierde, zesde en achtste lid][ref4] bedoelde aanspraken.

      5 De gewezen betrokkene is verplicht het bevoegd gezag uit eigen beweging onverwijld in kennis te stellen van alle
      omstandigheden, waarvan het hem redelijkerwijs duidelijk is, dan wel moet zijn, dat die van invloed kunnen zijn
      op de vaststelling van de in [artikel 39, eerste, tweede, vierde, zesde en achtste lid][ref5] bedoelde aanspraken.
      Onder dergelijke omstandigheden vallen tevens te verwachten inkomsten, van welke aard dan ook, waarvan de hoogte en
      de duur nog niet of niet exact kunnen worden vastgesteld.

      6 Het bevoegd gezag kan bepalen, dat geen recht op de aanspraken, bedoeld in het
      [eerste, tweede, vierde, zesde en achtste lid van artikel 39][ref6], bestaat indien de gewezen betrokkene de
      gegevens die noodzakelijk zijn voor de vaststelling van deze aanspraken niet, niet volledig of onjuist heeft
      verstrekt.

      7 Het recht op de aanspraken, bedoeld in het [eerste, tweede, vierde, zesde en achtste lid van artikel 39][ref7],
      kan door het bevoegd gezag geheel of gedeeltelijk en al dan niet tijdelijk vervallen worden verklaard, indien de
      gewezen betrokkene zonder geldige redenen niet of niet langer voldoet aan de hem opgelegde verplichtingen, bedoeld
      in het vijfde, zesde en zevende lid, alsmede indien de gewezen betrokkene niet, niet volledig of onjuiste gegevens
      heeft verstrekt met betrekking tot een wijziging van deze aanspraken.

      8 Het recht op de aanspraken, bedoeld in het [eerste, tweede, vierde, zesde en achtste lid van artikel 39][ref8],
      vervalt in ieder geval indien de gewezen betrokkene daartoe niet binnen 2 jaar na de beëindiging van zijn
      dienstbetrekking een verzoek heeft ingediend.

      9 Uitkeringen ingevolge de in het [eerste, tweede, vierde, zesde en achtste lid van artikel 39][ref9] bedoelde
      aanspraken, die niet in ontvangst zijn genomen of ingevorderd binnen drie maanden na de betaalbaarstelling, worden
      niet meer betaald. Het bevoegd gezag, dan wel Onze Minister ingeval de betrokkene in dienstbetrekking werkzaam was
      bij een of meer instellingen, genoemd in [artikel 1, onderdeel b1, b2 en b3][ref10], kan in bijzondere gevallen ten
      gunste van betrokkene afwijken van de eerste volzin.


