  - number: '18'
    text: |-
      1 Het bevoegd gezag kan eveneens aan een geneeskundig onderzoek doen onderwerpen de betrokkene die niet reeds
      verlof wegens ziekte of arbeidsongeschiktheid geniet, indien daartoe naar het oordeel van het bevoegd gezag
      gegronde, zowel aan de betrokkene als aan de deskundige persoon of de arbodienst schriftelijk mee te delen redenen
      bestaan.

      2 De betrokkene, die in verband met de uitoefening van zijn dienst aan bijzonder gevaar voor zijn gezondheid
      blootstaat, dan wel aan bijzondere gezondheidseisen moet voldoen, is gehouden zich in overleg met of op aanwijzing
      van de deskundige persoon of de arbodienst te onderwerpen aan een periodiek geneeskundig onderzoek.

      3 Zodra het bevoegd gezag kennis heeft kunnen nemen van de conclusies van het in het eerste en tweede lid bedoelde
      onderzoek, wordt de betrokkene van deze conclusies onverwijld schriftelijk in kennis gesteld onder vermelding van
      de mogelijkheid van een hernieuwd onderzoek binnen de in [artikel 19][ref1] genoemde termijnen en onder de daar
      gestelde voorwaarden. Op verzoek van de betrokkene wordt eveneens zijn behandelend arts schriftelijk in kennis
      gesteld van evenbedoelde conclusies.

      4 Aan de betrokkene wiens lichamelijke of psychische toestand blijkens de conclusie van het onderzoek zodanig is
      dat de belangen van hemzelf, van de instelling of van bij zijn dienstuitoefening betrokken derden zich tegen gehele
      of gedeeltelijke voortzetting van zijn arbeid verzetten, wordt door het bevoegd gezag geheel of gedeeltelijk verlof
      verleend op de voet van de bepalingen van dit hoofdstuk. Gedurende dit verlof draagt het bevoegd gezag aan de
      betrokkene zo mogelijk andere werkzaamheden op, voorzover deze, gezien de voordien door hem verrichte werkzaamheden
      redelijkerwijs passend zijn te achten.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel19
