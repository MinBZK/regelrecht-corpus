  - number: '45'
    text: |-
      1 Iedere bezoldiging of uitkering op grond van dit besluit, alsmede aanvullingen daarop, is onvervreemdbaar en niet
      vatbaar voor verpanding of belening.

      2 Een machtiging tot het in ontvangst nemen van de in het eerste lid bedoelde bezoldigingen of uitkeringen, alsmede
      aanvullingen daarop, onder welke vorm of benaming ook verleend, is steeds herroepelijk.

      3 Elk beding, strijdig met het eerste of tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel45
  - number: '46'
    text: |-
      De betrokkene, die als ambtenaar in de zin van de [Verhaalswet ongevallen ambtenaren][ref1] wordt aangemerkt, is
      verplicht van een oorzaak van verhindering tot dienstverrichting, ten aanzien waarvan aanspraken tegenover derden
      bestaan zo spoedig mogelijk kennis te geven aan het bevoegd gezag en overigens alle medewerking te verlenen die in
      verband met de uitvoering van die wet van hem wordt verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0002500
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002500
  - number: '47'
    text: |-
      Het bevoegd gezag draagt er zorg voor, dat een bijgewerkt exemplaar van dit besluit op een voor de betrokkene
      steeds toegankelijke plaats ter inzage beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel47
  - number: '48'
    text: |-
      De betrokkene, die op de dag, voorafgaande aan de datum van inwerkingtreding van dit besluit, uit hoofde van
      ziekte of arbeidsongeschiktheid een uitkering ontvangt op grond van het [Rechtspositiebesluit WPO/WEC][ref1] of
      het [Besluit werkloosheid onderwijs- en onderzoekpersoneel][ref2], zoals deze regelingen luidden op 31 december
      1995, heeft recht op een daarmee overeenkomende uitkering ingevolge dit Besluit. De onafgebroken periode van
      arbeidsongeschiktheid welke reeds verlopen is op de dag van inwerkingtreding van dit besluit, telt mee voor de
      periode, genoemd in [artikel 20, tweede lid, onder ][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015136
      [ref2]: https://wetten.overheid.nl/BWBR0006445
      [ref3]: https://wetten.overheid.nl/BWBR0007800#Artikel20
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0015136
      - id: ref2
        bwb_id: BWBR0006445
      - id: ref3
        bwb_id: BWBR0007800
        artikel: '20'
        hoofdstuk: '2'
  - number: 48a
    text: |-
      Indien op het moment van invoering van de WAO het verlof wegens ziekte van betrokkene reeds langer dan 13 weken
      heeft geduurd, is het bevoegd gezag verplicht betrokkene vóór 1 februari 1998 te melden bij het Lisv. De melding
      gaat vergezeld van het reïntegratieplan of de reïntegratieplannen en de resultaten van de uitvoering van dit plan
      of deze plannen.
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel48a
  - number: '50'
    text: |-
      Dit besluit wordt aangehaald als <<Besluit ziekte en arbeidsongeschiktheid voor onderwijspersoneel primair
      onderwijs>>.
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel50
  - number: VI
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 1996 en vervalt op een door Onze Minister te bepalen
      tijdstip.
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#ArtikelVI
