  - number: '2'
    text: |-
      1 De betrokkene geniet bedrijfsgezondheidskundige begeleiding overeenkomstig het bepaalde in dit besluit.

      2 De bedrijfsgezondheidskundige begeleiding van de betrokkene geschiedt door of vanwege de deskundige persoon of de
      arbodienst in samenwerking met het bevoegd gezag.

      3 De betrokkene is gehouden mee te werken aan geneeskundig onderzoek en bedrijfsgezondheidskundige begeleiding van
      de deskundige persoon of de arbodienst, welke voortvloeien uit de bepalingen van dit besluit.

      4 Onverminderd de mogelijkheid de deskundige persoon of de arbodienst rechtstreeks te consulteren ter zake van
      met zijn arbeidssituatie samenhangende gezondheidsproblemen kan de betrokkene het bevoegd gezag verzoeken hem in
      verband hiermee aan een onderzoek vanwege de deskundige persoon of de arbodienst te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0007800/2007-07-01#Artikel2
  - number: '3'
    text: |-
      1 De betrokkene die wegens ziekte geheel of gedeeltelijk verhinderd is zijn arbeid te verrichten, geniet van
      rechtswege geheel of gedeeltelijk verlof.

      2 Onder zijn arbeid wordt verstaan de functie van betrokkene, dan wel het samenstel van zijn werkzaamheden en de
      voorwaarden waaronder die verricht worden.

      3 Tijdens het geheel of gedeeltelijk verlof wegens ziekte of arbeidsongeschiktheid wordt de betrekking van de
      betrokkene geacht naar aard en omvang ongewijzigd te blijven, zulks onverminderd:

      a. [artikel 20][ref1] en [artikel 20a][ref2];

      b. de mogelijkheid om de dienstbetrekking, dan wel de betrekkingsomvang, op verzoek van betrokkene geheel of
      gedeeltelijk te beëindigen, onderscheidenlijk te verminderen;

      c. de mogelijkheid van beëindiging van de dienstbetrekking, dan wel vermindering van de betrekkingsomvang, wanneer
      de dienstbetrekking voor bepaalde tijd, onderscheidenlijk de uitbreiding van de betrekkingsomvang voor bepaalde
      tijd is overeengekomen;

      d. de mogelijkheid van een ontslag op staande voet wegens dringende redenen;

      e. de mogelijkheid van beëindiging van de dienstbetrekking op grond van gewichtige redenen, waaronder de
      mogelijkheid om het dienstverband te doen beëindigen in verband met de opheffing van de betrekking.

      4 De betrokkene is verplicht zo spoedig mogelijk aan het bevoegd gezag mededeling te doen van zijn verhindering,
      zijn medewerking te verlenen aan een krachtens dit besluit opgedragen geneeskundig onderzoek en ook overigens de
      hem in dit verband door de deskundige persoon, de arbodienst of het Uitvoeringsinstituut werknemersverzekeringen
      gegeven voorschriften na te leven.

      5 Het bevoegd gezag dat krachtens dit besluit een geneeskundig onderzoek heeft opgedragen kan, in afwachting van
      de conclusie daarvan, de betrokkene in dringende gevallen van medische aard de toegang verbieden tot het gebouw of
      de gebouwen waarin hij zijn werkzaamheden gewoonlijk verricht. Indien blijkens een geneeskundige verklaring gevaar
      voor besmetting met een besmettelijke ziekte bestaat, geldt dit verbod van rechtswege.


