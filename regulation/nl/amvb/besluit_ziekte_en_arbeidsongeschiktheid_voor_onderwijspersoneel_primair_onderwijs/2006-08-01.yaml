      IVA-uitkering: de arbeidsongeschiktheidsuitkering, bedoeld in [hoofdstuk 6 van de Wet WIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '6'
  - number: 1.kk
    text: |-
      WGA-uitkering: de werkhervattingsuitkering gedeeltelijk arbeidsgeschikten, bedoeld in
      [hoofdstuk 7 van de Wet WIA][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '7'
  - number: '2.1'
    text: De betrokkene geniet bedrijfsgezondheidskundige begeleiding overeenkomstig het bepaalde in dit besluit.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel2
  - number: '2.2'
    text: |-
      De bedrijfsgezondheidskundige begeleiding van de betrokkene geschiedt door of vanwege de deskundige persoon of de
      arbodienst in samenwerking met het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel2
  - number: '2.3'
    text: |-
      De betrokkene is gehouden mee te werken aan geneeskundig onderzoek en bedrijfsgezondheidskundige begeleiding van de
      deskundige persoon of de arbodienst, welke voortvloeien uit de bepalingen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel2
  - number: '2.4'
    text: |-
      Onverminderd de mogelijkheid de deskundige persoon of de arbodienst rechtstreeks te consulteren ter zake van
      met zijn arbeidssituatie samenhangende gezondheidsproblemen kan de betrokkene het bevoegd gezag verzoeken hem in
      verband hiermee aan een onderzoek vanwege de deskundige persoon of de arbodienst te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel2
  - number: '3.1'
    text: |-
      De betrokkene die wegens ziekte geheel of gedeeltelijk verhinderd is zijn arbeid te verrichten, geniet van
      rechtswege geheel of gedeeltelijk verlof.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel3
  - number: '3.2'
    text: |-
      Onder zijn arbeid wordt verstaan de functie van betrokkene, dan wel het samenstel van zijn werkzaamheden en de
      voorwaarden waaronder die verricht worden.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel3
  - number: '3.3'
    text: |-
      Tijdens het geheel of gedeeltelijk verlof wegens ziekte of arbeidsongeschiktheid wordt de betrekking van de
      betrokkene geacht naar aard en omvang ongewijzigd te blijven, zulks onverminderd:
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel3
  - number: 3.3.a
    text: |-
      [artikel 20][ref1] en [artikel 20a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0007800#Artikel20a
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '20'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007800
        artikel: 20a
        hoofdstuk: '2'
  - number: 3.3.b
    text: |-
      de mogelijkheid om de dienstbetrekking, dan wel de betrekkingsomvang, op verzoek van betrokkene geheel of
      gedeeltelijk te beëindigen, onderscheidenlijk te verminderen;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel3
  - number: 3.3.c
    text: |-
      de mogelijkheid van beëindiging van de dienstbetrekking, dan wel vermindering van de betrekkingsomvang, wanneer de
      dienstbetrekking voor bepaalde tijd, onderscheidenlijk de uitbreiding van de betrekkingsomvang voor bepaalde tijd
      is overeengekomen;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel3
  - number: 3.3.d
    text: de mogelijkheid van een ontslag op staande voet wegens dringende redenen;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel3
  - number: 3.3.e
    text: |-
      de mogelijkheid van beëindiging van de dienstbetrekking op grond van gewichtige redenen, waaronder de mogelijkheid
      om het dienstverband te doen beëindigen in verband met de opheffing van de betrekking.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel3
  - number: '3.4'
    text: |-
      De betrokkene is verplicht zo spoedig mogelijk aan het bevoegd gezag mededeling te doen van zijn verhindering, zijn
      medewerking te verlenen aan een krachtens dit besluit opgedragen geneeskundig onderzoek en ook overigens de hem in
      dit verband door de deskundige persoon, de arbodienst of het Uitvoeringsinstituut werknemersverzekeringen gegeven
      voorschriften na te leven.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel3
  - number: '3.5'
    text: |-
      Het bevoegd gezag dat krachtens dit besluit een geneeskundig onderzoek heeft opgedragen kan, in afwachting van de
      conclusie daarvan, de betrokkene in dringende gevallen van medische aard de toegang verbieden tot het gebouw of
      de gebouwen waarin hij zijn werkzaamheden gewoonlijk verricht. Indien blijkens een geneeskundige verklaring gevaar
      voor besmetting met een besmettelijke ziekte bestaat, geldt dit verbod van rechtswege.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel3
  - number: '3.6'
    text: |-
      Ten aanzien van de betrokkene, werkzaam aan een instelling voor voortgezet onderwijs met een cursusduur van minder
      dan 12 maanden, is dit besluit van toepassing, met dien verstande dat hij geen aanspraak heeft op doorbetaling
      van zijn bezoldiging, op aanvulling van zijn WAO- of WIA-uitkering, tot zijn bezoldiging, dan wel op enige andere
      uitkering ingevolge dit besluit of aanvulling daarop, onder welke benaming dan ook, in een periode waarin hij geen
      aanspraak op bezoldiging zou hebben gehad, indien hij niet arbeidsongeschikt was geweest.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel3
  - number: '4.1'
    text: |-
      De betrokkene die geheel of gedeeltelijk wegens ziekte verhinderd is zijn dienstbetrekking te vervullen,
      behoudt gedurende een termijn van 12 maanden zijn volle bezoldiging. Vervolgens geniet de betrokkene over
      de verlofuren wegens ziekte 70% van zijn bezoldiging tot het einde van zijn dienstverband. Indien het
      Uitvoeringsinstituut werknemersverzekeringen op grond van [artikel 71a, negende lid van de WAO][ref1] dan wel
      [artikel 25, negende lid, van de Wet WIA][ref2] een tijdvak vast stelt, gedurende hetwelk de betrokkene jegens het
      bevoegd gezag aanspraak op bezoldiging heeft, geniet de betrokkene over dat tijdvak 80% van zijn bezoldiging over
      de verlofuren wegens ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
  - number: '4.2'
    text: |-
      Gedurende de periode van zwangerschap- en bevallingsverlof, bedoeld in [artikel 9][ref1], wordt de termijn van 12
      maanden, bedoeld in het eerste lid, alsmede de termijn die aanvangt na afloop van deze termijn van 12 maanden en
      duurt tot het einde van het dienstverband, bedoeld in het eerste lid, opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel9
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '9'
        hoofdstuk: '1'
  - number: '4.3'
    text: |-
      Indien de betrokkene een ZW-uitkering, een WW-uitkering, een bovenwettelijke WW-uitkering dan wel een WAO-
      of WIA-uitkering is toegekend, wordt het bedrag van die uitkering in mindering gebracht op het bedrag, waarop
      hij ingevolge de in het eerste lid bedoelde bezoldiging recht heeft. Ingeval betrokkene recht heeft op een ZW-
      uitkering, een WW-uitkering, een bovenwettelijke WW-uitkering dan wel een WAO- of WIA-uitkering uit hoofde van
      één of meer dienstbetrekkingen wordt die uitkering voor de toepassing van de vorige volzin toegerekend aan de
      dienstbetrekking, waaruit de bezoldiging wordt doorbetaald, naar rato van het totaal aan inkomsten uit hoofde van
      de desbetreffende dienstbetrekkingen.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel4
  - number: '4.4'
    text: |-
      Indien, als gevolg van het handelen of het nalaten van handelingen door betrokkene, de ZW-uitkering, een WW-
      uitkering, een bovenwettelijke WW-uitkering dan wel een WAO- of WIA-uitkering geheel of gedeeltelijk geweigerd
      wordt, dan wel blijvende of tijdelijke vermindering ondergaat, wordt deze uitkering voor de toepassing van het
      derde lid geacht steeds onverminderd te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel4
  - number: '4.5'
    text: |-
      Ten aanzien van de betrokkene, die zijn arbeid aan meer dan één instelling verricht, worden voor de toepassing van
      dit artikel zijn werkzaamheden overeenkomstig zijn verzoek al dan niet als één geheel beschouwd, tenzij hier tegen
      op grond van een geneeskundige verklaring bezwaren bestaan.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel4
  - number: '4.6'
    text: |-
      Indien de betrokkene geen machtiging afgeeft om de ZW-uitkering, een WW-uitkering, een bovenwettelijke WW-uitkering
      dan wel een WAO- of WIA-uitkering te doen uitbetalen aan zijn bevoegd gezag, geeft hij daarvan onverwijld kennis
      aan het betrokken bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel4
  - number: '4.7'
    text: |-
      Ter bepaling van de periode van 12 maanden, bedoeld in het eerste lid, worden perioden van ongeschiktheid voor
      zijn betrekking samengeteld indien zij elkaar met een periode van minder dan 4 weken opvolgen. Bij de vaststelling
      van de periode van 4 weken blijven perioden, waarin zwangerschaps- of bevallingsverlof wordt genoten buiten
      beschouwing.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel4
  - number: '6.1'
    text: Het bevoegd gezag en de betrokkene zijn verplicht zich als een goed werkgever en een goed werknemer te gedragen.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel6
  - number: '6.2'
    text: |-
      Het bevoegd gezag is verplicht de lokalen, werktuigen, hulpmiddelen en gereedschappen waarin of waarmee het de
      arbeid doet verrichten, op zodanige wijze in te richten en te onderhouden alsmede voor het verrichten van de arbeid
      zodanige maatregelen te treffen en aanwijzingen te verstrekken als redelijkerwijs nodig is om te voorkomen dat de
      betrokkene in de uitoefening van zijn werkzaamheden schade lijdt.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel6
  - number: '6.3'
    text: |-
      Het bevoegd gezag is jegens de betrokkene aansprakelijk voor de schade die de betrokkene in de uitoefening van zijn
      werkzaamheden lijdt, tenzij het aantoont dat het de in het tweede lid bedoelde verplichtingen is nagekomen of dat
      de schade in belangrijke mate het gevolg is van opzet of bewuste roekeloosheid van betrokkene.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel6
  - number: '6.4'
    text: |-
      Het bevoegd gezag kan uit hoofde van het eerste lid de werknemer schadeloos stellen, kosten vergoeden of overigens
      een geldelijke tegemoetkoming verlenen naar hetgeen met het oog op de omstandigheden redelijk te achten is.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel6
  - number: '6.5'
    text: |-
      Het bevoegd gezag is bij aansprakelijkheid uit hoofde van het derde lid verplicht de betrokkene schadeloos te
      stellen, kosten te vergoeden of overigens een geldelijke tegemoetkoming te verlenen.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel6
  - number: '6.6'
    text: |-
      De schadeloosstelling vergoedt ten minste de loonschade van de betrokkene tijdens ziekte of arbeidsongeschiktheid,
      voor zover deze niet wordt gedekt door het recht van de werknemer op loondoorbetaling bij ziekte,
      een eventuele vergoeding van kosten op grond van artikel 43 of op een wettelijke of bovenwettelijke
      arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel6
  - number: '6.7'
    text: |-
      Het derde tot en met zesde lid van dit artikel blijven buiten toepassing ten aanzien van de betrokkene die zonder
      aannemelijke redenen verzuimd heeft aan het bevoegd gezag binnen 30 dagen mededeling te doen van het bestaan van
      een omstandigheid als bedoeld in het derde of vierde lid.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel6
  - number: '7'
    text: |-
      Ter bepaling van de in [artikel 4, eerste lid][ref1], genoemde termijn wordt een opnieuw ingegaan verlof wegens
      ziekte of arbeidsongeschiktheid als een voortzetting van het vorige verlof beschouwd, tenzij het nieuwe verlof zich
      voordoet nadat de betrokkene gedurende ten minste vier weken zijn dienst daadwerkelijk volledig had hervat.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel4
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '4'
        hoofdstuk: '1'
  - number: '8.1'
    text: |-
      Ten aanzien van de betrokkene die verlof wegens ziekte of arbeidsongeschiktheid geniet, kan het bevoegd gezag
      bepalen, dat hij zijn arbeid slechts zal mogen hervatten indien blijkens een geneeskundige verklaring, waarbij
      is bepaald de mate, waarin de hervatting kan geschieden, daarvoor toestemming is verleend. Deze toestemming is in
      ieder geval vereist, wanneer de betrokkene gedurende meer dan één jaar evenbedoeld verlof volledig heeft genoten.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel8
  - number: '8.2'
    text: |-
      De betrokkene die verlof wegens ziekte of arbeidsongeschiktheid geniet kan, doch niet vaker dan éénmaal in een
      tijdvak van één maand, het bevoegd gezag schriftelijk verzoeken hem te doen onderwerpen aan een onderzoek door de
      deskundige persoon of de arbodienst, ter verkrijging van een geneeskundige verklaring als bedoeld in het eerste
      lid. Het bevoegd gezag is gehouden binnen 14 dagen aan dit verzoek te voldoen.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel8
  - number: '9.1'
    text: De vrouwelijke betrokkene heeft in verband met haar bevalling aanspraak op zwangerschaps- en bevallingsverlof.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel9
  - number: '9.2'
    text: |-
      Gedurende het zwangerschap- en bevallingsverlof, bedoeld in het eerste lid, heeft de vrouwelijke betrokkene
      aanspraak op haar volle bezoldiging.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel9
  - number: '9.3'
    text: |-
      Indien aan de vrouwelijke betrokkene een uitkering op grond van
      [Hoofdstuk 3, afdeling 2 van de Wet Arbeid en Zorg][ref1] is toegekend, wordt het bedrag van die uitkering in
      mindering gebracht op het bedrag, waarop zij ingevolge het tweede lid recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Afdeling2
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013008
        afdeling: '2'
  - number: '9.4'
    text: |-
      Indien de vrouwelijke betrokkene recht heeft op een uitkering als bedoeld in het derde lid, maar deze uitkering als
      gevolg van het achterwege laten van een aanvraag daartoe door de vrouwelijke betrokkene niet wordt toegekend, wordt
      deze uitkering voor de toepassing van het derde lid geacht toch te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel9
  - number: '9.5'
    text: |-
      De betrokkene doet ten minste vier weken voor de dag waarop de bevalling over zes weken is te verwachten aan het
      bevoegd gezag mededeling van de datum van ingang van het zwangerschapsverlof.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel9
  - number: '10.1'
    text: |-
      De betrokkene, die in contact staat of kort geleden heeft gestaan met een persoon, die een ziekte heeft, waarvoor
      ingevolge het krachtens de Wet bestrijding infectieziekten en opsporing ziekteoorzaken bepaalde een nominatieve
      aangifteplicht geldt, mag zijn arbeid niet verrichten en heeft geen toegang tot de dienstgebouwen, -lokalen en
      -terreinen, waarin en waarop hij zijn werkzaamheden gewoonlijk verricht dan met toestemming van de deskundige
      persoon of de arbodienst.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel10
  - number: '10.2'
    text: |-
      De betrokkene die verkeert in de in het vorige lid omschreven situatie, is verplicht daarvan ten spoedigste
      kennis te geven aan het bevoegd gezag. Hij is gehouden zich te gedragen naar de door de deskundige persoon of de
      arbodienst gegeven aanwijzingen, waaronder die met betrekking tot het ondergaan van een geneeskundig onderzoek.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel10
  - number: '10.3'
    text: |-
      Gedurende de periode, dat de betrokkene ingevolge dit artikel zijn arbeid niet verricht, geniet hij zijn volle
      bezoldiging.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel10
  - number: '11.1'
    text: |-
      Het bevoegd gezag is gehouden zo tijdig mogelijk zodanige maatregelen te treffen en voorschriften te geven als
      redelijkerwijs nodig is, opdat de betrokkene, die in verband met ongeschiktheid ten gevolge van ziekte verhinderd
      is zijn arbeid te verrichten, in staat wordt gesteld de eigen of andere passende arbeid te verrichten. Indien
      vaststaat dat de eigen arbeid niet meer kan worden verricht en bij het bevoegd gezag geen andere passende arbeid
      voorhanden is, bevordert het bevoegd gezag de inschakeling van de betrokkene in voor hem passende arbeid bij een
      andere werkgever.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel11
  - number: '11.2'
    text: |-
      Uit hoofde van zijn verplichting, bedoeld in het eerste lid, stelt het bevoegd gezag in overeenstemming met
      de betrokkene een plan van aanpak op als bedoeld in [artikel 71a, tweede lid, van de WAO][ref1], dan wel
      [artikel 25, tweede, van de Wet WIA][ref2]. Het plan van aanpak wordt met medewerking van de betrokkene regelmatig
      geëvalueerd en zo nodig bijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
  - number: '11.3'
    text: |-
      Het bevoegd gezag bevestigt een aanbod aan de betrokkene tot plaatsing in een voor hem passende functie bij
      een andere werkgever schriftelijk. In de schriftelijke bevestiging wordt gewezen op de mogelijkheid, bedoeld in
      [artikel 30, eerste lid, onderdeel f, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
  - number: '11.4'
    text: |-
      De in het eerste lid bedoelde plaatsing geschiedt door middel van detachering. De detachering duurt totdat de
      betrokkene is ontslagen op grond van [artikel 20, tweede lid][ref1]. Van de detachering wordt melding gemaakt in de
      schriftelijke bevestiging als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel20
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '20'
        hoofdstuk: '2'
  - number: 11a
    text: |-
      De betrokkene die in verband met ongeschiktheid ten gevolge van ziekte verhinderd is zijn arbeid te verrichten,
      is gehouden:
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel11a
  - number: 11a.a
    text: |-
      gevolg te geven aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige gegeven redelijke
      voorschriften en mee te werken aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige
      getroffen maatregelen als bedoeld in artikel 11, eerste lid;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel11a
  - number: 11a.b
    text: |-
      zijn medewerking te verlenen aan het opstellen, evalueren en bijstellen van een plan van aanpak als bedoeld in
      artikel 11, tweede lid;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel11a
  - number: 11a.c
    text: passende arbeid te verrichten waartoe het bevoegd gezag hem in de gelegenheid stelt.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel11a
  - number: '13.1'
    text: |-
      Indien de betrokkene in het belang van zijn reïntegratie op advies van de deskundige persoon, de Arbo-dienst of het
      reïntegratiebedrijf wenselijk geachte arbeid voor het bevoegd gezag of voor derden verricht, worden de inkomsten
      uit deze arbeid hierop geheel in mindering gebracht zolang hij aanspraak kan maken op zijn volle bezoldiging. Onder
      in het belang van zijn reïntegratie wenselijk geachte arbeid wordt niet verstaan arbeid op therapeutische basis. Er
      is sprake van arbeid op therapeutische basis, indien de arbeid van de betrokkene aan de volgende eisen voldoet:
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel13
  - number: 13.1.a
    text: de activiteiten moeten binnen een van tevoren aangegeven periode uitgevoerd worden
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel13
  - number: 13.1.b
    text: de periode mag niet langer dan 6 weken zijn
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel13
  - number: 13.1.c
    text: de werkzaamheden moeten deel uitmaken van een opbouwend reïntegratietraject
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel13
  - number: 13.1.d
    text: het mag géén bestaande functie zijn die in de CAO staat omschreven
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel13
  - number: 13.1.e
    text: het moet een gecreëerde functie zijn
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel13
  - number: 13.1.f
    text: er moet te allen tijde begeleiding aanwezig zijn
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel13
  - number: 13.1.g
    text: de persoon moet op elk moment weg kunnen gaan.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel13
  - number: '13.2'
    text: |-
      Indien de betrokkene na 12 maanden ziekte in het belang van zijn reïntegratie op advies van de deskundige
      persoon, de ARBO-dienst of het reïntegratiebedrijf voor het bevoegd gezag of voor derden wenselijk geachte
      arbeid verricht, behoudt hij voor de uren dat bedoelde arbeid wordt verricht de bezoldiging per uur in de
      eigen functie en over de resterende verlofuren wegens ziekte 70% van de bezoldiging in de eigen functie.
      [Artikel 4, derde tot en met zevende lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel4
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '4'
        hoofdstuk: '1'
  - number: '13.3'
    text: |-
      Scholing ten behoeve van reïntegratie geldt als ziekteverlof, tenzij het op advies van de deskundige persoon,
      de Arbo-dienst of het reïntegratiebedrijf met het bevoegd gezag overeengekomen voor reïntegratie noodzakelijke
      scholing betreft. Deze voor reïntegratie noodzakelijke scholing dient gevolgd te worden binnen het kader van het
      verrichten van de in het eerste en tweede lid bedoelde wenselijk geachte arbeid.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel13
  - number: '14'
    text: 'Geen aanspraak op bezoldiging bestaat, indien blijkens een geneeskundige verklaring:'
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel14
  - number: 14.a
    text: |-
      de ziekte is voorgewend, althans zodanig overdreven is voorgesteld, dat verhindering tot de verrichting van zijn
      arbeid niet kan worden aangenomen;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel14
  - number: 14.b
    text: |-
      de betrokkene de ziekte opzettelijk heeft veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand
      geen verwijt kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel14
  - number: 14.c
    text: |-
      de verhindering wegens ziekte zich voordoet binnen een half jaar na de geneeskundige keuring die terzake van
      zijn benoeming heeft plaatsgevonden, en alsdan blijkt dat de betrokkene hierbij kennelijk opzettelijk onjuiste
      informatie over zijn gezondheidstoestand heeft verstrekt of gegevens heeft verzwegen, tengevolge waarvan hij toen
      ten onrechte geschikt is verklaard.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel14
  - number: '15.1'
    text: |-
      De aanspraak op bezoldiging kan door het bevoegd gezag geheel of ten dele vervallen worden verklaard, indien en
      zolang de betrokkene:
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
  - number: 15.1.a
    text: |-
      weigert zich te onderwerpen aan een krachtens dit besluit opgedragen geneeskundig onderzoek, dan wel, na voor zulk
      een onderzoek behoorlijk te zijn opgeroepen, zonder geldige reden niet verschijnt;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
  - number: 15.1.b
    text: |-
      weigert of verzuimt tijdig een een WAO- of WIA-uitkering bij het Uitvoeringsinstituut werknemersverzekeringen
      aan te vragen, dan wel een verzoek tot verlenging van die uitkering bij het Uitvoeringsinstituut
      werknemersverzekeringen in te dienen;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
  - number: 15.1.c
    text: |-
      weigert de volledige medewerking te verlenen aan een geneeskundig onderzoek ter beoordeling van zijn recht op een
      een WAO- of WIA-uitkering;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
  - number: 15.1.d
    text: de controlevoorschriften overtreedt, indien deze voor hem zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
  - number: 15.1.e
    text: het land verlaat zonder een geneeskundige verklaring van geen bezwaar;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
  - number: 15.1.f
    text: |-
      ten onrechte verzuimt zich onder geneeskundige behandeling te stellen of te blijven stellen, dan wel zich niet
      houdt aan de hem door de deskundige persoon, de arbodienst of het Uitvoeringsinstituut werknemersverzekeringen
      gegeven voorschriften, of anderszins zich zodanig gedraagt, dat zijn genezing wordt belemmerd of vertraagd, met
      dien verstande, dat te dezen voorschriften tot het verlenen van medewerking aan een ingreep van heelkundige of
      diagnostische aard zijn uitgezonderd;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
  - number: 15.1.g
    text: |-
      tijdens de verhindering om zijn dienst te verrichten, voor zichzelf of voor derden arbeid verricht, tenzij dit
      blijkens een geneeskundige verklaring door de arbodienst of het Uitvoeringsinstituut werknemersverzekeringen, in
      het belang van zijn genezing, reïntegratie of herplaatsbaarheid gewenst wordt geacht;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
  - number: 15.1.h
    text: |-
      in gebreke blijft op het door de arbodienst of het Uitvoeringsinstituut werknemersverzekeringen bepaalde tijdstip
      en in de door hen bepaalde mate zijn arbeid of hem passende arbeid, dan wel, na afloop van een periode van 52 weken
      onafgebroken arbeidsongeschiktheid, gangbare arbeid te verrichten, tenzij hij daarvoor een inmiddels ontstane, door
      de arbodienst of het Uitvoeringsinstituut werknemersverzekeringen als geldig erkende reden heeft opgegeven;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
  - number: 15.1.i
    text: |-
      zonder deugdelijke grond weigert mee te werken aan door het bevoegd gezag of door een door het bevoegd gezag
      aangewezen deskundige gegeven redelijke voorschriften of getroffen maatregelen die er op gericht zijn om de
      betrokkene in staat te stellen passende arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
  - number: 15.1.j
    text: |-
      zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren en bijstellen van een plan van aanpak
      als bedoeld in [artikel 11, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel11
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '11'
        hoofdstuk: '1'
  - number: '15.2'
    text: |-
      Het geheel of gedeeltelijk vervallen van aanspraken, bedoeld in het eerste lid, gaat in op een tijdstip, bij de
      beslissing van het bevoegd gezag vermeld. Dit tijdstip ligt niet voor de dag van die beslissing.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
  - number: '15.3'
    text: |-
      De door het Uitvoeringsinstituut werknemersverzekeringen overeenkomstig [hoofdstuk II van de WAO][ref1] dan wel
      [hoofdstuk 10 van de Wet WIA][ref2] vastgestelde en opgelegde voorschriften en verplichtingen gelden voor de
      betrokkene als waren deze vastgesteld en opgelegd door het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0019057
        hoofdstuk: '10'
  - number: '15.4'
    text: |-
      Indien betrokkene door het Uitvoeringsinstituut werknemersverzekeringen één of meer sancties zijn opgelegd
      overeenkomstig [hoofdstuk II van de WAO][ref1] dan wel [hoofdstuk 10 van de Wet WIA][ref2], gelden deze sancties
      voor betrokkene als waren zij hem opgelegd door het bevoegd gezag met dienovereenkomstige uitwerking op de
      bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0019057
        hoofdstuk: '10'
  - number: '15.5'
    text: |-
      De ingevolge [artikel 14][ref1] of dit artikel geheel of gedeeltelijk geweigerde of vervallen verklaarde
      bezoldiging, wordt alsnog aan de betrokkene uitbetaald, wanneer de commissie van artsen bij een hernieuwd
      onderzoek, ingesteld overeenkomstig [artikel 19][ref2], te zijnen gunste beslist. Eveneens wordt de geheel
      of gedeeltelijk geweigerde of vervallen verklaarde bezoldiging alsnog aan betrokkene uitbetaald ingeval, en
      afhankelijk van de mate waarin, het Uitvoeringsinstituut werknemersverzekeringen naderhand van oordeel mocht zijn
      dat de sancties, bedoeld in het vierde lid, ten onrechte zijn opgelegd. Uitbetaling van evenbedoelde bezoldiging
      vindt plaats met dien verstande, dat een uitkering ingevolge [artikel 16, tweede lid][ref3], daarop in mindering
      wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007800#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0007800#Artikel16
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '14'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007800
        artikel: '19'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0007800
        artikel: '16'
        hoofdstuk: '1'
  - number: '16.1'
    text: |-
      Bij verpleging van de betrokkene in een ziekeninrichting, alsmede in andere buitengewone omstandigheden, kan de
      uitbetaling van de bezoldiging geheel of gedeeltelijk aan daartoe door de betrokkene gemachtigden geschieden.
      Indien de betrokkene niet tot machtiging in staat is, kan door het bevoegd gezag worden bepaald, dat machtiging
      wordt geacht te zijn verleend aan daarvoor redelijkerwijs in aanmerking komende personen.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel16
  - number: '16.2'
    text: |-
      In bijzondere omstandigheden kan door het bevoegd gezag, dan wel door Onze Minister ingeval
      de betrokkene in dienstbetrekking werkzaam is bij een of meer instellingen genoemd in
      __REF000___________________________________________________________________________________________________________
      _____________________________, worden bepaald dat in de gevallen, bedoeld in de [artikelen 14][ref2] en
      [15][ref3], een uitkering tot ten hoogste het bedrag van de ingehouden bezoldiging geheel of gedeeltelijk aan
      daarvoor redelijkerwijs in aanmerking komende personen zal worden uitbetaald. Indien de betrokkene als lid van
      het onderwijsondersteunend personeel in dienstbetrekking werkzaam is bij een of meer instellingen, genoemd in
      [artikel 1, onderdeel b1][ref4], is het oordeel, bedoeld in de vorige volzin, voorbehouden aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007800#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0007800#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0007800#Artikel1
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007800
        artikel: '14'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0007800
        artikel: '15'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0007800
        artikel: '1'
        hoofdstuk: '1'
  - number: '17.1'
    text: |-
      Onverminderd de [artikelen 11][ref1] en 12 kan het bevoegd gezag de betrokkene doen onderwerpen aan een
      geneeskundig onderzoek ter beoordeling van de vraag:


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel11
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '11'
        hoofdstuk: '1'
  - number: 17.1.a
    text: of er sprake is van verhindering tot het verrichten van zijn arbeid;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel17
  - number: 17.1.b
    text: |-
      of zich een omstandigheid voordoet als bedoeld in [artikel 14][ref1] of in [artikel 15, eerste lid onder f][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007800#Artikel15
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '14'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007800
        artikel: '15'
        hoofdstuk: '1'
  - number: 17.1.c
    text: of verdere maatregelen in het belang van het herstel nodig zijn;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel17
  - number: 17.1.d
    text: wanneer en in welke mate de dienst kan worden hervat;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel17
  - number: 17.1.e
    text: |-
      of er termen bestaan een geneeskundige verklaring van geen bezwaar als bedoeld in
      [artikel 15, eerste lid onder e][ref1], af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel15
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '15'
        hoofdstuk: '1'
  - number: '17.2'
    text: |-
      Zodra het bevoegd gezag kennis heeft genomen van de conclusies van het onderzoek, wordt de betrokkene van deze
      conclusies onverwijld schriftelijk in kennis gesteld. Op verzoek van betrokkene wordt eveneens zijn behandelend
      arts schriftelijk in kennis gesteld van evenbedoelde conclusies.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel17
  - number: '18.1'
    text: |-
      Het bevoegd gezag kan eveneens aan een geneeskundig onderzoek doen onderwerpen de betrokkene die niet reeds verlof
      wegens ziekte of arbeidsongeschiktheid geniet, indien daartoe naar het oordeel van het bevoegd gezag gegronde,
      zowel aan de betrokkene als aan de deskundige persoon of de arbodienst schriftelijk mee te delen redenen bestaan.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel18
  - number: '18.2'
    text: |-
      De betrokkene, die in verband met de uitoefening van zijn dienst aan bijzonder gevaar voor zijn gezondheid
      blootstaat, dan wel aan bijzondere gezondheidseisen moet voldoen, is gehouden zich in overleg met of op aanwijzing
      van de deskundige persoon of de arbodienst te onderwerpen aan een periodiek geneeskundig onderzoek.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel18
  - number: '18.3'
    text: |-
      Zodra het bevoegd gezag kennis heeft kunnen nemen van de conclusies van het in het eerste en tweede lid bedoelde
      onderzoek, wordt de betrokkene van deze conclusies onverwijld schriftelijk in kennis gesteld onder vermelding van
      de mogelijkheid van een hernieuwd onderzoek binnen de in [artikel 19][ref1] genoemde termijnen en onder de daar
      gestelde voorwaarden. Op verzoek van de betrokkene wordt eveneens zijn behandelend arts schriftelijk in kennis
      gesteld van evenbedoelde conclusies.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel19
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '19'
        hoofdstuk: '1'
  - number: '18.4'
    text: |-
      Aan de betrokkene wiens lichamelijke of psychische toestand blijkens de conclusie van het onderzoek zodanig is dat
      de belangen van hemzelf, van de instelling of van bij zijn dienstuitoefening betrokken derden zich tegen gehele of
      gedeeltelijke voortzetting van zijn arbeid verzetten, wordt door het bevoegd gezag geheel of gedeeltelijk verlof
      verleend op de voet van de bepalingen van dit hoofdstuk. Gedurende dit verlof draagt het bevoegd gezag aan de
      betrokkene zo mogelijk andere werkzaamheden op, voorzover deze, gezien de voordien door hem verrichte werkzaamheden
      redelijkerwijs passend zijn te achten.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel18
  - number: '19.1'
    text: |-
      Ingeval van een geschil over het wel of niet bestaan van ongeschiktheid tot werken wegens ziekte voorziet
      [artikel 30, eerste lid, onderdeel e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] in het
      instellen van een onderzoek en het geven van een oordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
  - number: '19.2'
    text: |-
      De betrokkene die bedenkingen heeft tegen een conclusie van geneeskundige aard, als bedoeld in [artikel 18][ref1],
      kan daarvan binnen drie dagen na ontvangst van de conclusie onder opgave van redenen aan het bevoegd gezag
      schriftelijk mededeling doen. Hij kan ter ondersteuning van zijn bedenkingen een verklaring overleggen van een
      arts, die alsdan door de commissie, bedoeld in het tweede lid, in de gelegenheid wordt gesteld tot het geven van
      een nadere schriftelijke of mondelinge toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel18
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '18'
        hoofdstuk: '1'
  - number: '19.3'
    text: |-
      Behalve indien, na overleg met de deskundige persoon of de arbodienst, door het bevoegd gezag de bedenkingen van
      de betrokkene reeds aanstonds voldoende gegrond worden geacht, wordt binnen 14 dagen op last van het bevoegd gezag
      door een commissie van artsen een hernieuwd onderzoek ingesteld. In deze commissie mogen geen zitting hebben de
      arts of artsen, die het eerste onderzoek, bedoeld in [artikel 18][ref1], hebben verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel18
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '18'
        hoofdstuk: '1'
  - number: '19.4'
    text: De conclusie van de commissie is bindend.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel19
  - number: '19.5'
    text: 'De conclusie van het onderzoek deelt de commissie zo spoedig mogelijk schriftelijk mede:'
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel19
  - number: 19.5.a
    text: aan het bevoegd gezag dat vervolgens hiervan onverwijld schriftelijk kennis geeft aan de betrokkene;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel19
  - number: 19.5.b
    text: aan de behandelend arts van betrokkene op verzoek van laatstgenoemde.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel19
  - number: '19.6'
    text: |-
      De kosten van het hernieuwd onderzoek alsmede de kosten, verbonden aan het onderzoek, bedoeld in
      [artikel 30, eerste lid, onderdeel e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], komen
      voor rekening van het bevoegd gezag. De eventuele reis- en verblijfkosten van de betrokkene worden hem door het
      bevoegd gezag vergoed op basis van nader door het bevoegd gezag te stellen regelen, dan wel, voor zover het een
      instelling betreft, genoemd in [artikel 1, onderdelen b1 tot en met b4, b6 en b7][ref2], op basis van de Regeling
      vergoeding van reis- en verblijfskosten bij dienstreizen voor onderwijspersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0007800#Artikel1
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0007800
        artikel: '1'
        hoofdstuk: '1'
  - number: '19.7'
    text: |-
      Op de in het tweede en derde lid genoemde termijnen is de [Algemene termijnenwet][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '19.8'
    text: |-
      Dit artikel vindt geen toepassing ten aanzien van betrokkenen die zijn ontslagen of wier dienstverband is
      beëindigd.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel19
  - number: '20.1'
    text: |-
      Het bevoegd gezag kan, doch niet vaker dan eenmaal in een tijdvak van drie maanden, de betrokkene doen onderwerpen
      aan een geneeskundig onderzoek ter beantwoording van de vraag of volledige hervatting van zijn arbeid al dan niet
      blijvend is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: '20.2'
    text: |-
      Indien blijkt dat de betrokkene op grond van ziekten of gebreken is geraakt in een toestand van blijvende
      ongeschiktheid om aan de aan zijn functie gestelde vereisten te voldoen, kan hij worden ontslagen, mits:
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: 20.2.a
    text: deze blijvende ongeschiktheid onafgebroken 2 jaar heeft geduurd en;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: 20.2.b
    text: herstel binnen een periode van 6 maanden na deze 2 jaar redelijkerwijs niet is te verwachten en;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: 20.2.c
    text: er bij het bevoegd gezag voor betrokkene geen reële herplaatsingsmogelijkheden zijn.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: '20.3'
    text: |-
      Bij het bepalen van de periode van twee jaar, bedoeld in het tweede lid, onder a, worden niet in aanmerking genomen
      perioden van afwezigheid van een vrouwelijke betrokkene wegens zwangerschaps- of bevallingsverlof of wegens door de
      zwangerschap of bevalling veroorzaakte ziekte in de periode van het begin van de zwangerschap tot aan het einde van
      het bevallingsverlof.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: '20.4'
    text: |-
      Ter bepaling van de periode van twee jaar, bedoeld in het tweede lid, onder a, worden perioden van ongeschiktheid
      voor zijn betrekking samengeteld:
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: 20.4.a
    text: indien zij elkaar met een onderbreking van minder dan vier weken opvolgen;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: 20.4.b
    text: |-
      indien zij worden onderbroken door afwezigheid wegens zwangerschaps- of bevallingsverlof of wegens door
      zwangerschap of bevalling veroorzaakte ziekte in de periode vanaf het begin van de zwangerschap tot aan het einde
      van het bevallingsverlof;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: 20.4.c
    text: |-
      indien een onder b bedoelde afwezigheid wordt voorafgegaan of wordt gevolgd door een periode van
      arbeidsgeschiktheid, die in totaal minder dan vier weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: '20.5'
    text: 'De termijn van twee jaren, bedoeld in het tweede lid, wordt verlengd:'
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: 20.5.a
    text: |-
      met de duur van de vertraging indien de werkgever de aangifte, bedoeld in
      [artikel 38, eerste lid, van de Ziektewet][ref1] later doet dan in dat artikel is voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
  - number: 20.5.b
    text: |-
      met de duur van de verlenging van de wachttijd, bedoeld in [artikel 19, eerste lid, van de WAO][ref1], indien die
      wachttijd op grond van het zevende lid van dat artikel wordt verlengd; en


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
  - number: 20.5.c
    text: |-
      met de duur van de verlenging van de wachttijd, bedoeld in [artikel 24, eerste lid van de Wet WIA][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
  - number: 20.5.d
    text: |-
      met de duur van het tijdvak dat het Uitvoeringsinstituut werknemersverzekeringen heeft vastgesteld op grond van
      [artikel 71a, negende lid, van de WAO][ref1] dan wel [artikel 25, negende lid, van de Wet WIA][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
  - number: '20.6'
    text: |-
      Indien het bevoegd gezag wenst over te gaan tot ontslag, dient het de betrokkene schriftelijk aan te zeggen dat de
      procedure ter beoordeling van de medische geschiktheid voor de functie en de kansen op herstel binnen zes maanden
      in gang wordt gezet. Deze aanzegging geschiedt op zijn vroegst vanaf de 18e maand na de eerste ziektedag, met dien
      verstande dat de procedure, met inbegrip van het aan het ontslag ten grondslag te leggen medisch- en arbeidskundig
      advies en de afronding van het onderzoek naar de herplaatsingsmogelijkheden uiterlijk in de 24e maand na de eerste
      ziektedag kan zijn afgerond.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: '20.7'
    text: |-
      Bij het onderzoek naar de vraag of er sprake is van een situatie, als bedoeld in het tweede lid, onderdelen *a*. en
      *b*., worden de volgende artsen betrokken:
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: 20.7.a
    text: een arts, aangewezen door het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: 20.7.b
    text: een arts, aangewezen door betrokkene, indien hij hiertoe de wens te kennen heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: 20.7.c
    text: een arts van het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: '20.8'
    text: |-
      Ter beoordeling van de vraag of er sprake is van een situatie, als bedoeld in het tweede lid, onderdeel *c*, is
      vereist dat het bevoegd gezag door middel van een zorgvuldig onderzoek kan aantonen dat er voor betrokkene geen
      reële herplaatsingsmogelijkheden zijn. Hiertoe onderzoekt het bevoegd gezag eerst of de mogelijkheid bestaat van
      plaatsing in een functie met passende arbeid, en daarna, indien die mogelijkheid zich niet voordoet doch niet
      eerder dan na afloop van het eerste ziektejaar, in een functie met gangbare arbeid.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: '20.9'
    text: |-
      Bij het onderzoek, bedoeld in het achtste lid, betrekt het bevoegd gezag ook het oordeel van het
      Uitvoeringsinstituut werknemersverzekeringen. Bij zijn oordeel betrekt het Uitvoeringsinstituut
      werknemersverzekeringen de reïntegratie-inspanningen van het bevoegd gezag, bedoeld in [artikel 11][ref1]. Indien
      de betrokkene dat wenst, stelt het Uitvoeringsinstituut werknemersverzekeringen ook hem in kennis van zijn oordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel11
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '11'
        hoofdstuk: '1'
  - number: '20.10'
    text: |-
      Indien bij het onderzoek naar de blijvende ongeschiktheid voor zijn betrekking, bedoeld in de voorgaande leden,
      het Uitvoeringsinstituut werknemersverzekeringen van oordeel is, dat de betrokkene arbeidsgeschikt is voor en
      herplaatsbaar in zijn eigen betrekking onder andere voorwaarden, dan wel in één of meer andere functies bij het
      bevoegd gezag, is ontslag slechts mogelijk indien de betrokkene direct aansluitend onder die andere voorwaarden in
      zijn betrekking, dan wel in die andere functie of één van die andere functies wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: '20.11'
    text: |-
      Tegen de conclusie van het onderzoek, bedoeld in het achtste lid, alsmede het oordeel van het Uitvoeringsinstituut
      werknemersverzekeringen, bedoeld in het negende lid, staat geen beroep open bij de rechter.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20
  - number: 20a.1
    text: |-
      De betrokkene die in verband met ongeschiktheid ten gevolge van ziekte verhinderd is zijn arbeid te verrichten, kan
      worden ontslagen, indien hij zonder deugdelijke grond weigert:
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20a
  - number: 20a.1.a
    text: |-
      gevolg te geven aan de door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige gegeven redelijke
      voorschriften en mee te werken aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige
      getroffen maatregelen om hem in staat te stellen de eigen of andere passende arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20a
  - number: 20a.1.b
    text: passende arbeid te verrichten waartoe het bevoegd gezag hem in de gelegenheid stelt;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20a
  - number: 20a.1.c
    text: |-
      zijn medewerking te verlenen aan het opstellen, evalueren en bijstellen van een plan van aanpak als bedoeld in
      artikel 11, tweede lid.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20a
  - number: 20a.2
    text: |-
      Om te beoordelen of er sprake is van een situatie als bedoeld in het eerste lid, wint het bevoegd gezag een hierop
      betrekking hebbend advies van het Uitvoeringsinstituut werknemersverzekeringen in en neemt dit mede in beschouwing.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel20a
  - number: '21.1'
    text: |-
      Met uitzondering van degene, die zijn resterende verdienvermogen volledig benut in één of meer aangehouden
      betrekkingen, heeft de betrokkene recht op suppletie vanaf het tijdstip dat aan hem ontslag is verleend op grond
      van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte of gebreken.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel21
  - number: '21.2'
    text: |-
      Het eerste lid is niet van toepassing indien het in dat lid bedoelde ontslag wordt verleend na het moment dat de
      ongeschiktheid tot het verrichten van zijn betrekking wegens ziekte 90 maanden onafgebroken heeft geduurd. Voor
      het bepalen van genoemde periode van 90 maanden worden perioden van ziekte samengeteld indien die elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel21
  - number: '22.1'
    text: |-
      Het verplichtingen- en sanctieregiem van de [Werkloosheidswet][ref1] is van overeenkomstige toepassing op het recht
      op suppletie.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '22.2'
    text: |-
      Onverminderd het eerste lid, omvat passende arbeid in de zin van de [Werkloosheidswet][ref1] voor de toepassing van
      de suppletieregeling mede gangbare arbeid, als bedoeld in [artikel 1, onderdeel ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0007800#Artikel1
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0007800
        artikel: '1'
        hoofdstuk: '1'
  - number: '23'
    text: 'Het recht op suppletie komt niet tot uitbetaling voor zolang:'
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel23
  - number: 23.a
    text: betrokkene een WAO- of WIA-uitkering ontvangt, berekend naar een mate van arbeidsongeschiktheid van 80% of meer;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel23
  - number: 23.b
    text: |-
      betrokkene is herplaatst in een functie waaraan hij recht kan ontlenen op herplaatsingstoelage als bedoeld in
      paragraaf 9 van het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel23
  - number: '24'
    text: 'Het recht op suppletie eindigt:'
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel24
  - number: 24.a
    text: na ommekomst van de duur van de suppletie;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel24
  - number: 24.b
    text: met ingang van de dag volgende op die waarop de betrokkene is overleden;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel24
  - number: 24.c
    text: met ingang van de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar bereikt.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel24
  - number: '25.1'
    text: De suppletie bedraagt een percentage van de berekeningsgrondslag van de suppletie.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel25
  - number: '25.2'
    text: |-
      Als berekeningsgrondslag, bedoeld in het eerste lid, geldt het dagloon van de betrokkene op de dag voorafgaande aan
      het ontslag ter zake waarvan hem recht op suppletie wordt toegekend, voor zover dat betrekking heeft op het inkomen
      uit de betrekking waaraan het recht op suppletie wordt ontleend.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel25
  - number: '25.3'
    text: |-
      Onder het dagloon, bedoeld in het tweede lid, wordt verstaan het dagloon in de
      zin van [artikel 14 van de WAO][ref1] zonder toepassing van het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref2] met betrekking tot een
      loontijdvak van een dag, vermeerderd met het bedrag aan pensioenbijdrageverhaal op grond van de overeenkomst
      naar burgerlijk recht, bedoeld in [artikel 4 van de Wet privatisering ABP][ref3], waarin de aanspraken van
      overheidswerknemers in de zin van [die wet][ref4], gewezen overheidswerknemers en hun nagelaten betrekkingen
      ter zake van pensioenen, alsmede hun daarmee samenhangende verplichtingen, zijn neergelegd, het bedrag aan Vut-
      fonds bijdrageverhaal, bedoeld in [artikel 6 van de regels inzake de financiering van VUT-fonds lasten][ref5],
      [ex artikel 9 van de Wet Kaderregeling VUT overheidspersoneel][ref6] en het verhaal van de verschuldigde
      pensioenpremie voor flexibel pensioen, bedoeld in [artikel 3, tiende lid][ref7], van de overeenkomst naar
      burgerlijk recht, bedoeld in [artikel 4 van de Wet privatisering ABP][ref8], waarin de aanspraken van
      overheidswerknemers in de zin van die wet, gewezen overheidswerknemers en hun nagelaten betrekkingen ter zake van
      pensioenen, alsmede hun daarmee samenhangende verplichtingen, zijn neergelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0007791
      [ref5]: https://wetten.overheid.nl/BWBR0007824#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0007792#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0007800#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0007791#Artikel4
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0007791
      - id: ref5
        bwb_id: BWBR0007824
        artikel: '6'
      - id: ref6
        bwb_id: BWBR0007792
        artikel: '9'
      - id: ref7
        bwb_id: BWBR0007800
        artikel: '3'
        hoofdstuk: '1'
      - id: ref8
        bwb_id: BWBR0007791
        artikel: '4'
  - number: '25.4'
    text: |-
      De berekeningsgrondslag van de suppletie wordt telkens aangepast aan de voor de sector geldende algemene
      bezoldigingswijziging.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel25
  - number: '25.5'
    text: 'Het in het eerste lid bedoelde percentage bedraagt:'
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel25
  - number: 25.5.a
    text: gedurende de eerste 12 maanden 78%; en
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel25
  - number: 25.5.b
    text: gedurende de daaropvolgende 54 maanden 70%.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel25
  - number: '26.1'
    text: |-
      In afwijking van [artikel 25, vijfde lid][ref1], wordt, indien het in [artikel 21][ref2] bedoelde ontslag is
      verleend op een latere datum dan het moment waarop de ongeschiktheid tot het verrichten van zijn arbeid wegens
      ziekte 24 maanden onafgebroken heeft geduurd, de in [artikel 25, vijfde lid][ref3], genoemde periode verminderd
      met de periode die gelegen is tussen de ontslagdatum en het moment waarop genoemde ongeschiktheid 24 maanden
      onafgebroken heeft geduurd. Deze vermindering vindt plaats, te beginnen met de periode gedurende welke de
      betrokkene recht heeft op 80% van de berekeningsgrondslag van de suppletie.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0007800#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0007800#Artikel25
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '25'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0007800
        artikel: '21'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0007800
        artikel: '25'
        hoofdstuk: '3'
  - number: '26.2'
    text: |-
      Voor het bepalen van de in het eerste lid bedoelde periode van 24 maanden worden perioden van ziekte of
      arbeidsongeschiktheid samengeteld indien die elkaar met een onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel26
  - number: '27.1'
    text: |-
      Indien de betrokkene gedurende de periode dat recht bestaat op suppletie, ter zake van de dienstbetrekking
      waaruit dat recht op suppletie is ontstaan, een werkloosheidsuitkering dan wel een arbeidsongeschiktheidsuitkering
      ontvangt, wordt het bedrag van genoemde uitkering of uitkeringen in mindering gebracht op het bedrag van de
      suppletie. Indien de bedoelde betrokkene uit hoofde van twee of meer dienstbetrekkingen bij instellingen, die tot
      de overheids- of onderwijssector behoren, recht heeft op een WAO- of WIA-uitkering, wordt die uitkering voor de
      toepassing van de eerste volzin, toegerekend aan de dienstbetrekking ter zake waarvan hem recht op suppletie is
      toegekend, naar rato van de feitelijk genoten inkomsten uit hoofde van de desbetreffende dienstbetrekkingen.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel27
  - number: '27.2'
    text: |-
      Indien de betrokkene recht heeft op een arbeidsongeschiktheidsuitkering die kan worden toegerekend aan
      een dienstbetrekking, waaruit hij is ontslagen op een datum, gelegen voor de datum van ontslag uit de
      dienstbetrekking ter zake waarvan hem recht op suppletie is toegekend, welk recht voortduurt na laatstgenoemde
      datum, wordt, ingeval van een verhoging van de mate van de arbeidsongeschiktheid waardoor het bedrag
      van die arbeidsongeschiktheidsuitkering verhoogd wordt, uitsluitend het bedrag van die verhoging van die
      arbeidsongeschiktheidsuitkering in mindering gebracht op het bedrag van de suppletie. Indien de bedoelde betrokkene
      uit hoofde van twee of meer dienstbetrekkingen bij instellingen, die tot de overheids- of onderwijssector behoren,
      recht heeft op een WAO- of WIA-uitkering, wordt die uitkering voor de toepassing van de vorige volzin toegerekend
      aan de in die volzin eerstgenoemde dienstbetrekking, naar rato van de feitelijk genoten inkomsten uit hoofde van
      de desbetreffende dienstbetrekkingen, en wordt, ingeval van een verhoging van de mate van arbeidsongeschiktheid
      in die eerstgenoemde dienstbetrekking, waardoor het bedrag van die arbeidsongeschiktheidsuitkering verhoogd wordt,
      uitsluitend het bedrag van die verhoging in mindering gebracht op het bedrag van de suppletie.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel27
  - number: '28.1'
    text: |-
      Indien betrokkene, gedurende de periode dat recht bestaat op suppletie, inkomsten verwerft uit of in verband
      met arbeid of bedrijf, anders dan bedoeld in [artikel 27][ref1], wordt de berekeningsgrondslag van de suppletie
      verminderd met de inkomsten uit of in verband met arbeid of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel27
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '27'
        hoofdstuk: '3'
  - number: '28.2'
    text: |-
      Onder inkomsten uit of in verband met arbeid of bedrijf, bedoeld in het eerste lid, worden begrepen inkomsten uit
      of in verband met arbeid of bedrijf die zijn ontstaan:
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel28
  - number: 28.2.a
    text: |-
      met ingang van of na de dag waarop het ontslag, ter zake waarvan de betrokkene suppletie is toegekend, hem is
      aangezegd;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel28
  - number: 28.2.b
    text: |-
      gedurende non-activiteit, vakantie of verlof onmiddellijk voorafgaande aan het ontslag ter zake waarvan de
      betrokkene suppletie is toegekend;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel28
  - number: 28.2.c
    text: |-
      voor de dag van ontslag, ter zake waarvan de betrokkene suppletie is toegekend, anders dan bedoeld in het artikel
      27, tweede lid, en onderdelen *a* en *b* van dit artikellid, voor zover uit deze arbeid of dit bedrijf na die dag
      inkomsten of meer inkomsten worden genoten door de betrokkene, terwijl die inkomsten of die meerdere inkomsten of
      een gedeelte daarvan, het gevolg zijn van een verhoogde werkzaamheid dan wel verband houden met het ontslag.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel28
  - number: '28.3'
    text: Onze Minister kan in bijzondere gevallen ten gunste van betrokkene afwijken van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel28
  - number: '29'
    text: |-
      Voor de toepassing van de [artikelen 27][ref1] en [28][ref2] worden uitkeringen steeds geacht onverminderd door
      betrokkene te zijn genoten indien, als gevolg van handelingen of het nalaten van handelingen door betrokkene, één
      of meer werkloosheidsuitkeringen, arbeidsongeschiktheidsuitkeringen, uitkeringen op grond van de [Ziektewet][ref3]
      dan wel uitkeringen die naar aard en strekking overeenkomen met laatstgenoemde uitkeringen, waarop betrokkene recht
      heeft,


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007800#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '27'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0007800
        artikel: '28'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0001888
  - number: 29.a
    text: vermindering ondergaan;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel29
  - number: 29.b
    text: blijvend geheel geweigerd worden;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel29
  - number: 29.c
    text: tijdelijk of blijvend gedeeltelijk geweigerd worden; dan wel
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel29
  - number: 29.d
    text: in uitkeringsduur beperkt worden.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel29
  - number: '30.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van de betrokkene, aan wie een suppletie is toegekend, wordt een bedrag
      uitgekeerd, gelijk aan de berekeningsgrondslag van de suppletie van betrokkene over een tijdvak van drie maanden.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel30
  - number: '30.2'
    text: 'Het in het eerste lid bedoelde bedrag wordt uitgekeerd in de navolgende rangorde:'
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel30
  - number: 30.2.a
    text: |-
      aan de langstlevende echtgenoot dan wel aan de langstlevende geregistreerde partner indien de overleden betrokkene
      niet duurzaam van de andere echtgenoot dan wel geregistreerde partner gescheiden leefde;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel30
  - number: 30.2.b
    text: aan de minderjarige kinderen van de overledene;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel30
  - number: 30.2.c
    text: |-
      aan degenen ten aanzien van wie de overledene grotendeels in de kosten van het bestaan voorzag en met wie hij in
      gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel30
  - number: '30.3'
    text: |-
      Voor de toepassing van het eerste lid worden onder kinderen mede begrepen die kinderen voor wie de overledene de
      pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding
      van het kind als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een
      vergoeding daarvoor.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel30
  - number: '30.4'
    text: |-
      Voor de toepassing van het eerste lid worden mede als echtgenoot dan wel geregistreerde partner aangemerkt niet
      gehuwde personen van verschillend of gelijk geslacht die duurzaam een gezamenlijke huishouding voeren, tenzij het
      betreft personen tussen wie bloedverwantschap in de eerste of tweede graad bestaat.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel30
  - number: '30.5'
    text: |-
      5. Van een gezamenlijke huishouding als bedoeld in het derde lid, kan slechts sprake zijn indien twee ongehuwde
      of niet geregistreerde personen gezamenlijk voorzien in huisvesting en bovendien beiden een bijdrage leveren in
      de kosten van de huishouding dan wel op andere wijze in elkaars verzorging voorzien, hetgeen moet kunnen blijken
      uit een ter zake verleden notariële akte alsmede uit een uittreksel van de gemeentelijke basisadministratie
      persoonsgegevens waaruit een gezamenlijk woonadres blijkt.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel30
  - number: '30.6'
    text: |-
      Op het uit te keren bedrag, bedoeld in het eerste lid, wordt in mindering gebracht het bedrag van de uitkering
      waarop de nagelaten betrekkingen van de betrokkene ter zake van diens overlijden aanspraak kunnen maken uit
      hoofde van een of meer werkloosheidsuitkeringen, arbeidsongeschiktheidsuitkeringen, uitkeringen op grond van de
      [Ziektewet][ref1] dan wel uitkeringen die naar aard en strekking overeenkomen met laatstgenoemde uitkeringen,
      waarop betrokkene recht had.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '31.1'
    text: Door Onze Minister wordt op aanvraag vastgesteld of er recht op suppletie bestaat.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel31
  - number: '31.2'
    text: Een aanvraag wordt ingediend door middel van een door Onze Minister beschikbaar gesteld aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel31
  - number: '31.3'
    text: |-
      De suppletie wordt zo spoedig mogelijk uitbetaald, doch uiterlijk binnen een maand nadat het recht op die suppletie
      is vastgesteld. De suppletie wordt in de regel per maand achteraf betaald.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel31
  - number: '31.4'
    text: |-
      De suppletie die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de dag van
      betaalbaarstelling, wordt niet meer betaald. Onze Minister kan in bijzondere gevallen ten gunste van betrokkene
      afwijken van de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel31
  - number: '32.1'
    text: |-
      Door of namens Onze Minister wordt uit eigen beweging een naar redelijkheid vast te stellen voorschot op een
      suppletie betaald, indien uitsluitend onzekerheid bestaat omtrent de hoogte van de suppletie, omtrent het van
      de suppletie aan de betrokkene te betalen bedrag of omtrent het nakomen van een verplichting als bedoeld in
      [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel22
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '22'
        hoofdstuk: '3'
  - number: '32.2'
    text: |-
      Door of namens Onze Minister kan op aanvraag van de betrokkene een naar redelijkheid vast te stellen voorschot op
      een suppletie worden betaald, indien onzekerheid bestaat omtrent het recht op suppletie.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel32
  - number: '32.3'
    text: Een voorschot, bedoeld in het eerste en tweede lid, wordt beschouwd als een suppletie.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel32
  - number: '33.1'
    text: |-
      Onze Minister kan regels stellen op grond waarvan in bij die regels aan te geven gevallen en met inachtneming
      van bij die regels te stellen beperkingen de betrokkene bevoegd is deel te nemen aan een opleiding of scholing
      in dagonderwijs.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel33
  - number: '33.2'
    text: |-
      Indien de betrokkene, die recht heeft op suppletie, gaat deelnemen aan een voor hem naar het oordeel van Onze
      minister noodzakelijke opleiding of scholing, blijft volgens door Onze Minister te stellen regels het recht op
      suppletie bestaan tot dat die opleiding of scholing is geëindigd.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel33
  - number: '33.3'
    text: |-
      In de door Onze Minister ingevolge het tweede lid te stellen regels, worden in ieder geval voorschriften en
      beperkingen gegeven met betrekking tot de aard, de omvang en de duur van de in het tweede lid bedoelde opleiding
      of scholing.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel33
  - number: '34.1'
    text: |-
      De betrokkene die onbeloonde activiteiten verricht, is verplicht daarvan mededeling te doen aan Onze Minister, dan
      wel aan het namens hem handelende Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel34
  - number: '34.2'
    text: |-
      De betrokkene heeft voor het verrichten van bijzondere vormen van onbeloonde activiteiten voorafgaande toestemming
      nodig van Onze Minister, dan wel van het namens hem handelende Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel34
  - number: '35.1'
    text: 'Onze Minister stelt nadere regels vast met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel35
  - number: 35.1.a
    text: een doelmatige controle ten aanzien van de betrokkenen;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel35
  - number: 35.1.b
    text: het genieten van vakantie tijdens de duur van de suppletie.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel35
  - number: '35.2'
    text: |-
      Onze Minister kan nadere regels stellen met betrekking tot [artikel 34][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel34
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '34'
        hoofdstuk: '3'
  - number: '36.1'
    text: |-
      De betrokkene, die op de dag, voorafgaande aan de datum van inwerkingtreding van dit besluit, uit hoofde van een
      ontslag recht heeft op een herplaatsingswachtgeld als bedoeld in artikel K 4, tweede lid, juncto artikel K6 van de
      Algemene Burgerlijke Pensioenwet, zoals die wet luidde op 31 december 1995, heeft recht op suppletie.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel36
  - number: '36.2'
    text: |-
      Het in het eerste lid bedoelde recht op suppletie bedraagt bij een op de dag, voorafgaande aan de datum van
      inwerkingtreding van dit besluit, inmiddels genoten recht op herplaatsingswachtgeld van:
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel36
  - number: 36.2.1
    text: 'maand: gedurende de eerste 27 maanden 80%, vervolgens 33 maanden 70%;'
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel36
  - number: 36.2.2
    text: 'maanden: gedurende de eerste 26 maanden 80%, vervolgens 33 maanden 70%;'
