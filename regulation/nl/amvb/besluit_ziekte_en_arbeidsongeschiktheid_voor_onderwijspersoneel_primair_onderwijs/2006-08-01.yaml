      onderwijs dan wel speciaal en voortgezet speciaal onderwijs in de zin van de [Wet op de expertisecentra][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel1
