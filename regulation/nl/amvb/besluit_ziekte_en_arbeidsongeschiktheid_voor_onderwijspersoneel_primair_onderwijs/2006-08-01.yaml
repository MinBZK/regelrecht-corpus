  - number: '36.3'
    text: |-
      De [artikelen 22][ref1] tot en met [24][ref2], [25, vierde lid][ref3], [26][ref4] tot en met [30][ref5],
      [artikel 31, derde en vierde lid][ref6], alsmede 32 tot en met 35 zijn van overeenkomstige toepassing.


