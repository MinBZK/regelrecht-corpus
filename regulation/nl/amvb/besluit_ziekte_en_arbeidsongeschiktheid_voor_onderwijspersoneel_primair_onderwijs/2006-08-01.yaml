  - number: '36.4'
    text: |-
      Onze Minister stelt ambtshalve voor iedere daarvoor in aanmerking komende betrokkene het recht op suppletie vast
      met inachtneming van het in dit artikel bepaalde.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel36
  - number: '36.5'
    text: |-
      [Artikel 25, eerste lid][ref1], is van overeenkomstige toepassing, met dien verstande dat voor de
      vaststelling van de berekeningsgrondslag voor de betrokkene als dagloon geldt het dagloon zoals
      bepaald in artikel 42, derde lid, van de WPA, zonder toepassing van de maximumdagloongrens van
      [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '25'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0002126
        artikel: '9'
  - number: '36.6'
    text: |-
      Bij de bepaling op het moment van inwerkingtreding van dit besluit van de periode waarover herplaatsingswachtgeld
      is genoten, wordt deze periode naar beneden afgerond op een hele maand.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel36
  - number: '37'
    text: |-
      Indien de betrokkene, die op de datum van inwerkingtreding van dit besluit onafgebroken gedurende een periode
      van 52 weken arbeidsongeschikt is geweest in de zin van artikel 19, eerste lid, van de WAO en de mate van
      zijn algemene invaliditeit op grond van de Algemene Burgerlijke Pensioenwet is vastgesteld op ten minste
      15%, dan wel de mate van arbeidsongeschiktheid ingevolge de ministeriële regeling op grond van artikel
      8, derde lid, van de AAW, zoals dit artikel luidde op de dag voorafgaand aan de inwerkingtreding van de
      [Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref1] is vastgesteld op ten minste 25%,
      binnen een periode van zes maanden is aan te merken als een betrokkene in de zin van dit hoofdstuk, geldt voor hem
      als dagloon het dagloon zoals bepaald in artikel 39, vierde of vijfde lid, van de WPA, zonder toepassing van de
      maximumdagloongrens van [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008658
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008658
      - id: ref2
        bwb_id: BWBR0002126
        artikel: '9'
  - number: '38'
    text: |-
      Tenzij de sectorale sociale partners anders overeenkomen, wordt, indien het niveau van de WAO een algemene
      neerwaartse wijziging ondergaat, deze neerwaartse wijziging, na afloop van zes maanden na de datum van publikatie
      daarvan in het *Staatsblad*, op overeenkomstige wijze ten aanzien van de suppletie doorgevoerd.
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel38
  - number: '39.1'
    text: |-
      De gewezen betrokkene die wegens ziekte of arbeidsongeschiktheid, ontstaan voor het tijdstip waarop hem ontslag
      is verleend, niet zijnde een ontslag op grond van ziekte of arbeidsongeschiktheid, dan wel waarop een tijdelijke
      taakuitbreiding is beëindigd niet zijnde een beëindiging op grond van ziekte of arbeidsongeschiktheid, dan
      wel waarop zijn benoeming in tijdelijke dienst is afgelopen, nadien nog ongeschikt is hem passende, dan wel,
      na onafgebroken arbeidsongeschiktheid gedurende het in [artikel 19, eerste en tweede lid, van de WAO][ref1]
      dan wel [artikel 23, van de Wet WIA][ref2] bedoelde tijdvak, al dan niet verlengd op grond
      van [artikel 19, zevende lid van de WAO][ref3] dan wel [artikel 24 van de Wet WIA][ref4] of
      [artikel XV, veertiende lid, onder a en c, van de Wet terugdringing ziekteverzuim][ref5], gangbare arbeid te
      verrichten, een en ander voor zover hij niet als herplaatsbaar verklaarde is herplaatst in een betrekking, behoudt
      gedurende zijn ongeschiktheid een uitkering ter hoogte van zijn laatstgenoten bezoldiging. Het in de vorige volzin
      bepaalde geldt slechts voorzover de termijn van 12 maanden, genoemd in [artikel 4, eerste lid][ref6], nog niet is
      verstreken, doch uiterlijk tot de eerste dag van de maand volgende op die waarin de gewezen betrokkene de leeftijd
      van 65 jaar heeft bereikt. Na afloop van de termijn van 12 maanden ontvangt hij gedurende 6 maanden, doch uiterlijk
      tot de eerste dag van de maand volgende op die waarin de gewezen betrokkene de leeftijd van 65 jaar heeft bereikt,
      70% van de laatst genoten bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
      [ref6]: https://wetten.overheid.nl/BWBR0007800#Artikel4
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
      - id: ref2
