      arbeidsongeschiktheidsuitkering: een uit enig dienstverband van de betrokkene voortvloeiende en aan hem periodiek
      uitbetaalde uitkering terzake van het op grond van ziekten of gebreken geheel of gedeeltelijk ongeschikt zijn om
      passende, dan wel gangbare arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel1
  - number: 1.r
    text: |-
      passende arbeid: alle arbeid die voor de krachten en bekwaamheden van de betrokkene is berekend, tenzij aanvaarding
      om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan worden gevergd;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel1
  - number: 1.s
    text: |-
      gangbare arbeid: alle algemeen geaccepteerde arbeid waartoe de betrokkene met zijn krachten en bekwaamheden in
      staat is en waarmee hij kan verdienen, hetgeen gezonde personen met soortgelijke opleiding en ervaring, ter plaatse
      waar hij arbeid verricht of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen.
      Niet daaronder wordt verstaan een dienstbetrekking in de zin van de Wet op de sociale werkvoorziening;
    url: https://wetten.overheid.nl/BWBR0007800/2006-08-01#Artikel1
  - number: 1.t
    text: |-
