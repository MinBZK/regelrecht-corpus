---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_aanbestedingen_speciale_sectoren
regulatory_layer: AMVB
publication_date: '2012-11-08'
valid_from: '2013-02-16'
bwb_id: BWBR0018608
url: https://wetten.overheid.nl/BWBR0018608/2013-02-16
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 22 december 2004, nr. WJZ 4082228;

    Gelet op richtlijn nr. 2004/17/EG van het Europees parlement en de Raad van de Europese Unie houdende coördinatie
    van de procedures voor het plaatsten van opdrachten in de sectoren water- en energievoorziening, vervoer en
    postdiensten (PbEG L 134) en de artikelen 2 en 3 van de Raamwet EEG-voorschriften aanbestedingen;

    De Raad van State gehoord (advies van 4 april 2005, nr. W10.04.0634/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 11 juli 2005, nr. WJZ 5033366;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.b
    text: 'Commissie: de Europese Commissie;'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.c
    text: |-
      Overeenkomst inzake overheidsopdrachten: de op 15 april 1995 te Marrakech tot stand gekomen Overeenkomst inzake
      overheidsopdrachten (Trb. 1994, 235);
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.d
    text: 'aannemer: een ieder die de uitvoering van werken op de markt aanbiedt;'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.e
    text: 'leverancier: een ieder die producten op de markt aanbiedt;'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.f
    text: 'dienstverlener: een ieder die diensten op de markt aanbiedt;'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.g
    text: |-
      werk: het product van een geheel van bouwkundige of civieltechnische werken dat ertoe bestemd is als zodanig een
      economische of technische functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.h
    text: |-
      opdracht voor werken: een schriftelijke overeenkomst onder bezwarende titel die tussen een of meer aannemers en een
      of meer aanbestedende diensten is gesloten en betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.h.1°
    text: |-
      de uitvoering of het ontwerp en de uitvoering: - van werken in het kader van een van de werkzaamheden, genoemd in
      [bijlage 1][ref1], of
        - van een werk, of


      [ref1]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018608
  - number: 1.h.2°
    text: |-
      het laten uitvoeren met welke middelen dan ook van een werk dat aan de door de aanbestedende dienst vastgestelde
      eisen voldoet;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.i
    text: |-
      opdracht voor leveringen: een schriftelijke overeenkomst onder bezwarende titel die tussen een of meer leveranciers
      en een of meer aanbestedende diensten is gesloten en betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.i.1°
    text: de aankoop, leasing, huur of huurkoop, met of zonder koopoptie, van producten, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.i.2°
    text: |-
      de levering van producten en zijdelings betrekking heeft op werkzaamheden voor het aanbrengen en installeren van
      die levering;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.j
    text: |-
      opdracht voor diensten: een schriftelijke overeenkomst onder bezwarende titel die tussen een of meer
      dienstverleners en een of meer aanbestedende diensten is gesloten en betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.j.1°
    text: |-
      het verrichten van de diensten, genoemd in [bijlage 3][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018608
  - number: 1.j.2°
    text: |-
      het leveren van producten en het verrichten van de diensten, genoemd in [bijlage 3][ref1], en waarvan de waarde van
      de desbetreffende diensten hoger is dan die van de producten, of


      [ref1]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018608
  - number: 1.j.3°
    text: |-
      het verrichten van de diensten, bedoeld in [bijlage 3][ref1], en van werkzaamheden, genoemd in [bijlage 1][ref2],
      waarbij de werkzaamheden bijkomstig zijn ten opzichte van het verrichten van de diensten;


      [ref1]: https://wetten.overheid.nl/BWBR0018608
      [ref2]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018608
      - id: ref2
        bwb_id: BWBR0018608
  - number: 1.k
    text: 'opdracht: een opdracht voor werken, een opdracht voor leveringen of een opdracht voor diensten;'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.l
    text: |-
      concessieovereenkomst voor werken: een overeenkomst met dezelfde kenmerken als een opdracht voor werken, waarbij
      de tegenprestatie voor de uit te voeren werken in ieder geval bestaat uit het recht het werk te exploiteren, al dan
      niet gecombineerd met een prijs;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.m
    text: |-
      concessieovereenkomst voor diensten: een overeenkomst met dezelfde kenmerken als een opdracht voor diensten met
      uitzondering van het feit dat de tegenprestatie voor de te verrichten diensten bestaat uit het recht de dienst te
      exploiteren, al dan niet gecombineerd met een prijs;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.n
    text: |-
      raamovereenkomst: overeenkomst tussen een of meer ondernemers en een of meer aanbestedende diensten met het doel
      gedurende een bepaalde periode de voorwaarden inzake te gunnen opdrachten vast te leggen, met name wat betreft de
      prijs en de beoogde hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.o
    text: |-
      dynamisch aankoopsysteem: een elektronisch proces voor het doen van gangbare aankopen, met algemeen op de markt
      beschikbare kenmerken, beperkt in de tijd en gedurende de gehele looptijd open voor een ondernemer die voldoet aan
      de selectiecriteria en die overeenkomstig de eisen van het beschrijvend document een indicatieve inschrijving heeft
      ingediend;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.p
    text: |-
      elektronische veiling: een zich herhalend elektronisch proces voor de presentatie van nieuwe, verlaagde prijzen,
      of van nieuwe waarden voor bepaalde elementen van de inschrijvingen, dat plaatsvindt na de eerste volledige
      beoordeling van de inschrijvingen en dat klassering op basis van elektronische verwerking mogelijk maakt;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.q
    text: |-
      aanbestedende dienst: de staat, een provincie, een gemeente, een waterschap, een publiekrechtelijke instelling, een
      samenwerkingsverband van de hiervoor genoemde overheden of publiekrechtelijke instellingen, een overheidsbedrijf,
      of een bedrijf of instelling waaraan door de staat, een provincie, een gemeente, een waterschap of een
      publiekrechtelijke instelling een bijzonder recht of een uitsluitend recht is verleend, wanneer deze een van de
      activiteiten, bedoeld in de [artikelen 2 tot en met 7][ref1], uitoefent;


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel2
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
  - number: 1.r
    text: |-
      publiekrechtelijke instelling: een instelling die is opgericht met het specifieke doel te voorzien in behoeften van
      algemeen belang, niet zijnde van industriële of commerciële aard, die rechtspersoonlijkheid bezit en waarvan:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.r.1°
    text: |-
      de activiteiten in hoofdzaak door de staat, een provincie, een gemeente, een waterschap of een andere
      publiekrechtelijke instelling worden gefinancierd,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.r.2°
    text: |-
      het beheer onderworpen is aan toezicht door de staat, een provincie, een gemeente, een waterschap of een andere
      publiekrechtelijke instelling, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.r.3°
    text: |-
      de leden van het bestuur, het leidinggevend of het toezichthoudend orgaan voor meer dan de helft door de staat, een
      provincie, een gemeente, een waterschap of andere publiekrechtelijke instellingen zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.s
    text: |-
      overheidsbedrijf: een bedrijf waarop de staat, een provincie, een gemeente, een waterschap, een publiekrechtelijke
      instelling of een samenwerkingsverband van de hiervoor genoemde overheden of publiekrechtelijke instellingen,
      rechtstreeks of middellijk een overheersende invloed kan uitoefenen uit hoofde van eigendom, financiële deelneming
      of de op het bedrijf van toepassing zijnde voorschriften;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.t
    text: |-
      overheersende invloed: een invloed die wordt vermoed aanwezig te zijn, wanneer de staat, een provincie, een
      gemeente, een waterschap, een publiekrechtelijke instelling of een samenwerkingsverband van de hiervoor genoemde
      overheden of publiekrechtelijke instellingen, al dan niet rechtstreeks, ten aanzien van een overheidsbedrijf:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.t.1°
    text: de meerderheid van het geplaatste kapitaal van het overheidsbedrijf bezit, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.t.2°
    text: |-
      over de meerderheid van de stemmen beschikt die aan de door het overheidsbedrijf uitgegeven aandelen zijn
      verbonden, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.t.3°
    text: |-
      meer dan de helft van de leden van het bestuurs-, leidinggevend of toezichthoudend orgaan van het overheidsbedrijf
      kan aanwijzen;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.u
    text: |-
      uitsluitend recht: een recht dat bij wettelijk voorschrift of bij besluit van een bestuursorgaan aan een
      onderneming wordt verleend, waarbij voor die onderneming het recht wordt voorbehouden om binnen een bepaald
      geografisch gebied een dienst te verrichten of een activiteit uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.v
    text: |-
      bijzonder recht: een recht dat bij wettelijk voorschrift of bij besluit van een bestuursorgaan aan een beperkt
      aantal ondernemingen wordt verleend en waarbij binnen een bepaald geografisch gebied:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.v.1°
    text: |-
      het aantal van deze ondernemingen die een die een dienst mogen verrichten of een activiteit mogen uitoefenen op een
      andere wijze dan volgens objectieve, evenredige en niet-discriminerende criteria tot twee of meer wordt beperkt,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.v.2°
    text: |-
      verscheidene concurrerende ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen op een
      andere wijze dan volgens deze criteria worden aangewezen, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.v.3°
    text: |-
      aan een of meer ondernemingen op een andere wijze dan volgens deze criteria voordelen worden toegekend waardoor
      enige andere onderneming aanzienlijk wordt belemmerd in de mogelijkheid om dezelfde activiteiten binnen hetzelfde
      geografische gebied onder in wezen gelijkwaardige voorwaarden uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.w
    text: |-
      aankoopcentrale: een aanbestedende dienst die voor aanbestedende diensten bestemde leveringen of diensten verwerft,
      opdrachten gunt of raamovereenkomsten sluit met betrekking tot voor aanbestedende diensten bestemde werken,
      leveringen of diensten;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.x
    text: 'openbare procedure: een procedure, waarbij ondernemers zich mogen inschrijven;'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.y
    text: |-
      niet-openbare procedure: een procedure, waarbij ondernemers mogen verzoeken om deel te nemen, maar waarbij alleen
      de door de aanbestedende dienst aangezochte ondernemers zich mogen inschrijven;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.z
    text: |-
      procedure van gunning door onderhandelingen: een procedure waarbij de aanbestedende dienst met door hem gekozen
      ondernemers overleg pleegt en door onderhandelingen met een of meer van hen de voorwaarden van de opdracht
      vaststelt;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.aa
    text: |-
      prijsvraag: een procedure die tot doel heeft de aanbestedende dienst een plan of ontwerp te verschaffen, dat na een
      oproep tot mededinging door een jury wordt geselecteerd, al dan niet met toekenning van prijzen;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.bb
    text: 'inschrijver: een ondernemer die een inschrijving heeft ingediend;'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.cc
    text: |-
      gegadigde: een ondernemer die heeft verzocht om een uitnodiging tot deelneming aan een niet-openbare procedure of
      aan een procedure van gunning door onderhandelingen;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.dd
    text: |-
      elektronisch middel: een middel waarbij gebruik wordt gemaakt van elektronische apparatuur voor gegevensverwerking,
      met inbegrip van digitale compressie en gegevensopslag, en van verspreiding, overbrenging en ontvangst door middel
      van draden, straalverbindingen, optische middelen of andere elektromagnetische middelen;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.ee
    text: |-
      CPC: de nomenclatuur van de centrale productclassificatie (gemeenschappelijke indeling van de produkten) van de
      Verenigde Naties;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.ff
    text: |-
      CPV: de Gemeenschappelijke Woordenlijst Overheidsopdrachten, vastgesteld bij [verordening (EG) nr. 2195/2002]
      (32002R2195) van het Europees Parlement en de Raad van de Europese Unie van 5 november 2002 betreffende de
      gemeenschappelijke woordenlijst overheidsopdrachten (CPV) (PbEG L 340);
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.gg
    text: |-
      NACE: de statistische nomenclatuur van economische activiteiten in de Europese Gemeenschappen, vastgesteld
      bij [verordening (EEG) nr. 3037/90](31990R3037) van de Raad van de Europese gemeenschappen van 9 oktober 1990
      betreffende de statistische nomenclatuur van de economische activiteiten in de Europese Gemeenschap (PbEG L 293);
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.hh
    text: 'postzending: een geadresseerde zending in de definitieve vorm waarin zij wordt verstuurd, ongeacht het gewicht;'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.ii
    text: 'ii. postdienst: een postdienst welke bestaat uit het ophalen, sorteren, vervoeren en bestellen van postzendingen;'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.jj
    text: |-
      financiële dienst: een dienst als bedoeld in [bijlage 3, categorie 6][ref1], met inbegrip van postwissels en girale
      overschrijvingen;


      [ref1]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018608
  - number: 1.kk
    text: 'logistieke dienst: een dienst waarbij fysieke levering of opslag gecombineerd wordt met een niet-postale dienst;'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.ll
    text: |-
      erkende organisatie: een testlaboratorium, een ijklaboratorium of inspectie- en certificatieorganisatie die voldoen
      aan de toepasselijke Europese normen;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.mm
    text: 'verbonden onderneming:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.mm.1°
    text: |-
      een onderneming waarvan de jaarrekening is geconsolideerd met die van de aanbestedende dienst overeenkomstig de
      voorschriften van [richtlijn nr. 83/349/EEG](31983L0349) van de Raad van de Europese Gemeenschappen van 13 juni
      1983 op de grondslag van artikel 54, lid 3, sub g) van het Verdrag betreffende de geconsolideerde jaarrekening
      (PbEG L 193), of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.mm.2°
    text: |-
      in het geval van aanbestedende diensten die niet onder de richtlijn, genoemd onder 1º, vallen, een onderneming: -
      waarop de aanbestedende dienst rechtstreeks of middellijk overheersende invloed kan uitoefenen,
        - die een overheersende invloed op een aanbestedende dienst kunnen uitoefenen, of
        - die, tezamen met de aanbestedende dienst, onderworpen is aan de overheersende invloed van een andere onderneming
      uit hoofde van eigendom, financiële deelneming of op haar van toepassing zijnde voorschriften;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.nn
    text: 'technische specificatie: in geval van'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.nn.1°
    text: |-
      opdrachten voor werken: een technische voorschrift dat een omschrijving geeft van de vereiste kenmerken van
      een werk, een materiaal, een product of een levering en aan de hand waarvan op objectieve wijze een werk, een
      materiaal, een product of een levering zodanig kan worden omschreven dat dit beantwoordt aan het gebruik waarvoor
      het door de aanbestedende dienst is bestemd;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.nn.2°
    text: |-
      opdrachten voor leveringen of opdrachten voor diensten: een specificatie die voorkomt in een document ter
      omschrijving van de vereiste kenmerken van een product of dienst;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.oo
    text: |-
      norm: een technische specificatie die door een erkende normalisatie-instelling voor herhaalde of voortdurende
      toepassing is goedgekeurd, waarvan de inachtneming niet verplicht is en die tot een van de normen, bedoeld in
      onderdelen pp tot en met ss, behoort;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.pp
    text: |-
      internationale norm: een norm die door een internationale normalisatie-instelling wordt aangenomen en ter
      beschikking van het publiek wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.qq
    text: |-
      Europese norm: een norm die door een Europese normalisatie-instelling wordt aangenomen en ter beschikking van het
      publiek wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.rr
    text: |-
      nationale norm: een norm die door een nationale normalisatie-instelling wordt aangenomen en ter beschikking van het
      publiek wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.ss
    text: |-
      Europese technische goedkeuring: een op de bevinding dat aan de essentiële eisen wordt voldaan gebaseerde,
      gunstig uitgevallen technische beoordeling waarbij een product, gezien zijn intrinsieke eigenschappen en de
      voor de toepassing en het gebruik ervan vastgestelde voorwaarden, geschikt wordt verklaard voor het gebruik voor
      bouwdoeleinden door een erkende organisatie;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.tt
    text: |-
      gemeenschappelijke technische specificatie: een technische specificatie die is opgesteld volgens een door de
      lidstaten van de Europese Unie erkende procedure die in het Publicatieblad van de Europese Gemeenschappen is
      bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.uu
    text: |-
      technisch referentiekader: een ander product dan de officiële normen, dat door de Europese normalisatie-
      instellingen is opgesteld volgens procedures die aan de ontwikkeling van de marktbehoeften zijn aangepast;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.vv
    text: |-
      elektronische handtekening: een handtekening als bedoeld in
      [artikel 15a, vierde lid, van Boek 3 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
  - number: 1.ww
    text: |-
      geavanceerde elektronische handtekening: een handtekening die voldoet aan de eisen van
      [artikel 15a, tweede lid, onderdelen a tot en met f, van Boek 3 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
  - number: 1.xx
    text: |-
      [richtlijn nr. 92/13/EEG](31992L0013): [richtlijn nr. 92/13/EEG](31992L0013) van de Raad van de Europese
      Gemeenschappen van 25 februari 1992 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende
      de toepassing van de communautaire voorschriften inzake de procedures voor het plaatsen van opdrachten door
      diensten die werkzaam zijn in de sectorenwater- en energievoorziening, vervoer en telecommunicatie (PbEG L 76);
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.yy
    text: |-
      [richtlijn nr. 93/38/EEG](31993L0038): [richtlijn nr. 93/38/EEG](31993L0038) van de Raad van de Europese
      Gemeenschappen van 14 juni 1993, houdende coördinatie van de procedures voor het plaatsen van opdrachten in de
      sectoren water- en energievoorziening, vervoer en telecommunicatie (PbEG L 199), naar de tekst zoals deze gold op
      de dag voor intrekking van deze richtlijn;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.aaa
    text: |-
      [richtlijn nr. 2004/17/EG](32004L0017): [richtlijn nr. 2004/17/EG](32004L0017) van het Europees Parlement en de
      Raad van de Europese Unie houdende coördinatie van de procedures voor het plaatsten van opdrachten in de sectoren
      water- en energievoorziening, vervoer en postdiensten (PbEG L 134);
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.bbb
    text: 'kopersprofiel: een beschrijving van de aanbestedende dienst en zijn inkoopbeleid;'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.ccc
    text: |-
      beschrijvend document: een document waarin de opdracht, de aanbestedende dienst, de te volgen
      aanbestedingsprocedure, en de selectie- en gunningscriteria worden beschreven en toegelicht;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.ddd
    text: |-
      gunningsbeslissing: de keuze van de aanbestedende dienst voor de ondernemer met wie hij een raamovereenkomst wil
      sluiten of aan wie hij een opdracht wil gunnen;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.eee
    text: 'ondernemer: aannemer, leverancier of dienstverlener;'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.fff
    text: |-
      schriftelijk: elk uit woorden of cijfers bestaand geheel dat kan worden gelezen, gereproduceerd, en vervolgens
      medegedeeld, dat met elektronische middelen overgebrachte of opgeslagen informatie kan bevatten;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: 1.ggg
    text: 'aanbestedingsstukken: alle documenten in een aanbestedingsprocedure.'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel1
  - number: '2.1'
    text: |-
      Dit besluit is van toepassing op opdrachten die een aanbestedende dienst gunt in het kader van de volgende
      activiteiten:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel2
  - number: 2.1.a
    text: |-
      de beschikbaarstelling of exploitatie van vaste netten bestemd voor openbare dienstverlening op het gebied van de
      productie, het vervoer of de distributie van gas of warmte, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel2
  - number: 2.1.b
    text: de gas- of warmtetoevoer naar de netten, bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel2
  - number: '2.2'
    text: |-
      De toevoer van gas of warmte naar netten bestemd voor openbare dienstverlening door een overheidsbedrijf, of een
      bedrijf of instelling waaraan door de staat, een provincie, een gemeente, een waterschap of een publiekrechtelijke
      instelling een bijzonder recht of een uitsluitend recht is verleend, valt niet onder de activiteiten, bedoeld in
      het eerste lid, wanneer:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel2
  - number: 2.2.a
    text: |-
      de productie van gas of warmte door het betrokken overheidsbedrijf, of bedrijf of instelling waaraan door de
      staat, een provincie, een gemeente, een waterschap of een publiekrechtelijke instelling een bijzonder recht of
      een uitsluitend recht is verleend, het onvermijdelijke resultaat is van de uitoefening van een andere dan de
      activiteit, bedoeld in het eerste lid, [artikel 4, eerste lid][ref1], of de [artikelen 5 tot en met 8][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel5
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '5'
        paragraaf: '2'
  - number: 2.2.b
    text: |-
      de toevoer aan het openbare net tot doel heeft deze productie op economisch verantwoorde wijze te exploiteren en
      overeenstemt met ten hoogste 20 procent van de omzet van de aanbestedende dienst berekend als het gemiddelde over
      de laatste drie jaren, met inbegrip van het lopende jaar.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel2
  - number: '3.1'
    text: |-
      Dit besluit is van toepassing op opdrachten die een aanbestedende dienst gunt in het kader van de volgende
      activiteiten:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel3
  - number: 3.1.a
    text: |-
      de beschikbaarstelling of exploitatie van vaste netten bestemd voor openbare dienstverlening op het gebied van de
      productie, het vervoer of de distributie van elektriciteit, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel3
  - number: 3.1.b
    text: de elektriciteitstoevoer naar de netten, bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel3
  - number: '3.2'
    text: |-
      De toevoer van elektriciteit naar netten bestemd voor openbare dienstverlening door een overheidsbedrijf, of een
      bedrijf of instelling waaraan door de staat, een provincie, een gemeente, een waterschap of een publiekrechtelijke
      instelling een bijzonder recht of een uitsluitend recht is verleend, wordt niet als een activiteit als bedoeld in
      het eerste lid beschouwd, wanneer:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel3
  - number: 3.2.a
    text: |-
      de elektriciteitsproductie door het betrokken overheidsbedrijf, of bedrijf of instelling waaraan door de staat, een
      provincie, een gemeente, een waterschap of een publiekrechtelijke instelling een bijzonder recht of een uitsluitend
      recht is verleend, geschiedt, omdat het verbruik ervan noodzakelijk is voor de uitoefening van een andere dan de
      activiteiten, bedoeld in het eerste lid, [artikel 2, eerste lid][ref1], of de [artikelen 5 tot en met 8][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel5
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '5'
        paragraaf: '2'
  - number: 3.2.b
    text: |-
      de toevoer aan het openbare net slechts van het eigen verbruik van de aanbestedende dienst afhangt en niet
      meer heeft bedragen dan 30 procent van de totale energieproductie van de aanbestedende dienst berekend als het
      gemiddelde over de laatste drie jaren, met inbegrip van het lopende jaar.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel3
  - number: '4.1'
    text: |-
      Dit besluit is van toepassing op opdrachten die een aanbestedende dienst gunt in het kader van de volgende
      activiteiten:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel4
  - number: 4.1.a
    text: |-
      de beschikbaarstelling of exploitatie van vaste netten bestemd voor openbare dienstverlening op het gebied van de
      productie, het vervoer of de distributie van drinkwater of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel4
  - number: 4.1.b
    text: de drinkwatertoevoer naar deze netten.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel4
  - number: '4.2'
    text: |-
      Dit besluit is eveneens van toepassing op de opdrachten of prijsvragen die worden gegunt of georganiseerd door
      een aanbestedende dienst die een activiteit als bedoeld in het eerste lid uitoefent en die verband houden met de
      volgende activiteiten:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel4
  - number: 4.2.a
    text: |-
      waterbouwtechnische projecten, bevloeiing of drainage voor zover de voor drinkwatervoorziening bestemde hoeveelheid
      water groter is dan 20 procent van de totale hoeveelheid water die door middel van deze projecten of deze
      bevloeiings- of drainageinstallaties ter beschikking wordt gesteld, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel4
  - number: 4.2.b
    text: met de afvoer of behandeling van afvalwater.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel4
  - number: '4.3'
    text: |-
      De toevoer van drinkwater naar netten bestemd voor openbare dienstverlening door een overheidsbedrijf, of een
      bedrijf of instelling waaraan door de staat, een provincie, een gemeente, een waterschap of een publiekrechtelijke
      instelling een bijzonder recht of een uitsluitend recht is verleend, wordt niet als een activiteit als bedoeld in
      het eerste lid beschouwd, wanneer:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel4
  - number: 4.3.a
    text: |-
      de productie van drinkwater door het betrokken overheidsbedrijf, of bedrijf of instelling waaraan door de staat,
      een provincie, een gemeente, een waterschap of een publiekrechtelijke instelling een bijzonder recht of een
      uitsluitend recht is verleend, geschiedt omdat het verbruik ervan noodzakelijk is voor de uitoefening van een
      andere activiteit als bedoeld in de [artikelen 2 tot en met 7][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel2
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
  - number: 4.3.b
    text: |-
      de toevoer naar het openbare net slechts van het eigen verbruik van het bedrijf, bedoeld in onderdeel a, afhangt en
      niet meer heeft bedragen dan 30 procent van de totale drinkwaterproductie van het bedrijf, bedoeld in onderdeel a,
      berekend als het gemiddelde over de laatste drie jaren, met inbegrip van het lopende jaar.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel4
  - number: '5.1'
    text: |-
      Dit besluit is van toepassing op opdrachten die een aanbestedende dienst gunt in het kader van activiteiten die het
      ter beschikking stellen of exploiteren van netten bestemd voor openbare dienstverlening op het gebied van vervoer
      per trein, automatische systemen, tram, trolleybus of autobus of kabel beogen, onder door of vanwege de staat, een
      gemeente, of een provincie gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel5
  - number: '5.2'
    text: |-
      Dit besluit is niet van toepassing op opdrachten voor diensten die een openbare busdienst verzorgen, indien andere
      diensten vrijelijk deze dienstverlening, algemeen dan wel voor een bepaald geografisch gebied, onder dezelfde
      voorwaarden als een aanbestedende dienst kunnen verrichten.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel5
  - number: '6'
    text: |-
      Dit besluit is van toepassing op opdrachten die een aanbestedende dienst gunt in het kader van de volgende
      activiteiten:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel6
  - number: 6.a
    text: postdiensten,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel6
  - number: 6.b
    text: het beheer van postdiensten,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel6
  - number: 6.c
    text: |-
      diensten met een meerwaarde die verband houden met elektronische post en die volledig langs elektronische
      weg plaatsvinden, met inbegrip van de beveiligde doorgifte van gecodeerde documenten langs elektronische weg,
      adresbeheerdiensten en het doorzenden van geregistreerde elektronische post,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel6
  - number: 6.d
    text: diensten die betrekking hebben op postzending,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel6
  - number: 6.e
    text: financiële diensten,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel6
  - number: 6.f
    text: filateliediensten, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel6
  - number: 6.g
    text: logistieke diensten.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel6
  - number: '7'
    text: |-
      Dit besluit is van toepassing op opdrachten die een aanbestedende dienst gunt in het kader van activiteiten die
      de exploitatie van een geografisch gebied beogen met het oogmerk op de terbeschikkingstelling aan lucht-, zee- of
      riviervervoerders van luchthaven-, zeehaven-, binnenhaven- of andere aanlandingsfaciliteiten.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel7
  - number: '8.1'
    text: |-
      Dit besluit is van toepassing op opdrachten die een aanbestedende dienst gunt in het kader van meerdere
      activiteiten dan de activiteiten, genoemd in de [artikelen 2 tot en met 7][ref1], indien de opdracht in hoofdzaak
      wordt gegund ten behoeve van het verrichten van de activiteiten, genoemd in de [artikelen 2 tot en met 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel2
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Een aanbestedende dienst maakt de keuze van de methode van berekening van de geraamde
      waarde van een opdracht niet met de intentie om de opdracht aan dit besluit of aan het
      [Besluit aanbestedingsregels voor overheidsopdrachten][ref1] te onttrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018607
  - number: '8.3'
    text: |-
      Wanneer het objectief onmogelijk is om vast te stellen dat de opdracht in hoofdzaak wordt gegund ten behoeve van
      het verrichten van de activiteiten, genoemd in de [artikelen 2 tot en met 7][ref1], wordt de opdracht gegund:


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel2
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
  - number: 8.3.a
    text: |-
      overeenkomstig het [Besluit aanbestedingsregels voor overheidsopdrachten][ref1] indien de opdracht tevens een
      overheidsopdracht als bedoeld in het [Besluit aanbestedingsregels voor overheidsopdrachten][ref2] is;


      [ref1]: https://wetten.overheid.nl/BWBR0018607
      [ref2]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018607
      - id: ref2
        bwb_id: BWBR0018607
  - number: 8.3.b
    text: |-
      overeenkomstig onderhavig besluit indien de opdracht niet tevens een overheidsopdracht als bedoeld in het
      [Besluit aanbestedingsregels voor overheidsopdrachten][ref1] is.


      [ref1]: https://wetten.overheid.nl/BWBR0018607
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018607
  - number: '9'
    text: Een aanbestedende dienst behandelt ondernemers op gelijke en niet-discriminerende wijze en handelt transparant.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel9
  - number: '10.1'
    text: |-
      Een aanbestedende dienst wijst gegadigden of inschrijvers die krachtens de wetgeving van de lidstaat van de
      Europese Unie waarin zij zijn gevestigd, gerechtigd zijn de desbetreffende verrichting uit te voeren, niet af
      louter op grond van het feit dat zij een natuurlijke persoon of een rechtspersoon zouden moeten zijn.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel10
  - number: '10.2'
    text: |-
      Voor opdrachten voor diensten, opdrachten voor werken en opdrachten voor leveringen, die bijkomende diensten of
      werkzaamheden voor aanbrengen en installeren inhouden, kan een aanbestedende dienst van een rechtspersoon verlangen
      dat hij in de inschrijving of in het verzoek tot deelneming de namen en de beroepskwalificaties vermeldt van de
      personen die met de uitvoering van de opdracht worden belast.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel10
  - number: '10.3'
    text: Een samenwerkingsverband van ondernemers kan zich inschrijven of zich als gegadigde opgeven.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel10
  - number: '10.4'
    text: |-
      Een aanbestedende dienst verlangt voor de indiening van een inschrijving of een verzoek tot deelneming van een
      samenwerkingsverband van ondernemers niet dat het samenwerkingsverband van ondernemers een bepaalde rechtsvorm
      heeft.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel10
  - number: '10.5'
    text: |-
      Een aanbestedende dienst kan van het samenwerkingsverband waaraan de opdracht wordt gegund eisen dat zij een
      bepaalde rechtsvorm aanneemt, mits dit voor de goede uitvoering van de opdracht nodig is.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel10
  - number: '11.1'
    text: |-
      Een aanbestedende dienst wendt zich zonder discriminatie en onder dezelfde voorwaarden als die welke hij voor
      gegadigden of inschrijvers in Nederland stelt, tot ondernemers in andere lidstaten van de Europese Unie, in overige
      staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte of in Zwitserland die voldoen
      aan de vereisten gesteld krachtens [richtlijn nr. 2004/17/EG](32004L0017), en handelt hierbij transparant.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel11
  - number: '11.2'
    text: |-
      Een aanbestedende dienst past bij het gunnen van opdrachten op ondernemers uit de andere lidstaten van de
      Europese Unie even gunstige voorwaarden toe als die welke hij bij de tenuitvoerlegging van de in het kader van de
      Overeenkomst inzake overheidsopdrachten, op ondernemers van derde landen toepast.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel11
  - number: '12.1'
    text: |-
      Bij het verstrekken van de technische specificaties aan de belangstellende ondernemers, bij de kwalificatie en
      selectie van de ondernemers en bij de toewijzing en bij de gunning van de opdrachten kunnen de aanbestedende
      diensten eisen stellen ter bescherming van het vertrouwelijke karakter van de door hen verstrekte inlichtingen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel12
  - number: '12.2'
    text: |-
      Onverminderd de [artikelen 40 tot en met 44][ref1], [50][ref2] en [58][ref3] van dit besluit en met inachtneming
      van de [Wet openbaarheid van bestuur][ref4] maakt een aanbestedende dienst de vertrouwelijke informatie die hem
      door een ondernemer is verstrekt niet openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0018608#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '40'
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '44'
        paragraaf: '10'
      - id: ref3
        bwb_id: BWBR0018608
        artikel: '58'
        paragraaf: '13'
      - id: ref4
        bwb_id: BWBR0005252
  - number: '13'
    text: |-
      Dit besluit is van toepassing op opdrachten als bedoeld in de [artikelen 2 tot en met 8][ref1] waarvan de geraamde
      waarde, exclusief omzetbelasting, gelijk is aan of groter dan:


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel2
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
  - number: 13.a
    text: |-
      het bedrag, genoemd in artikel 16, onderdeel a, van [richtlijn nr. 2004/17/EG](32004L0017) voor opdrachten voor
      leveringen en voor diensten;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel13
  - number: 13.b
    text: |-
      het bedrag, genoemd in artikel 16, onderdeel b, van [richtlijn nr. 2004/17/EG](32004L0017) voor opdrachten voor de
      uitvoering van werken.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel13
  - number: '14.1'
    text: |-
      Een aanbestedende dienst baseert de berekening van de geraamde waarde van een opdracht op het totale bedrag,
      exclusief omzetbelasting. Bij deze berekening wordt rekening gehouden met het geraamde totaalbedrag, met inbegrip
      van de eventuele opties en eventuele verlengingen van het contract.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: '14.2'
    text: |-
      Wanneer de aanbestedende dienst voorziet in prijzengeld of betalingen aan gegadigden of inschrijvers, berekent zij
      deze door in de geraamde waarde van de opdracht.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: '14.3'
    text: |-
      Een aanbestedende dienst onttrekt zich niet aan dit besluit door voorgenomen werken of voorgenomen aankopen ter
      verkrijging van bepaalde hoeveelheden leveringen of diensten te splitsen of bijzondere regels te gebruiken voor de
      berekening van de geraamde waarde van de opdrachten.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: '14.4'
    text: |-
      Bij de berekening van de waarde van een raamovereenkomst of een dynamisch aankoopsysteemgaat de aanbestedende
      dienst uit van de geraamde maximale waarde, exclusief omzetbelasting, van alle voor de totale duur van de
      raamovereenkomst of van het dynamisch aankoopsysteem voorgenomen opdrachten.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: '14.5'
    text: |-
      Voor de toepassing van [artikel 13][ref1], houdt een aanbestedende dienst bij de bepaling van de geraamde waarde
      van opdrachten voor de uitvoering van werken rekening met de waarde van het werk en van alle leveringen of diensten
      die voor de uitvoering van het werk noodzakelijk zijn en door de aanbestedende dienst ter beschikking van de
      aannemer worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel13
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '13'
        paragraaf: '4'
  - number: '14.6'
    text: |-
      Een aanbestedende dienst telt de waarde van leveringen of diensten die niet noodzakelijk zijn voor de uitvoering
      van een bepaalde opdracht voor de uitvoering van werken, niet bij de waarde van deze opdrachten met de intentie om
      de verkrijging van deze leveringen of van deze diensten aan de toepassing van dit besluit te onttrekken.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: '14.7'
    text: |-
      Wanneer een voorgenomen werk of een voorgenomen aankoop van diensten aanleiding kan geven tot opdrachten die
      gelijktijdig in afzonderlijke percelen worden geplaatst, neemt de aanbestedende dienst de geraamde totale waarde
      van deze percelen als grondslag.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: '14.8'
    text: |-
      Wanneer de samengetelde waarde van de percelen, bedoeld in het zevende lid, gelijk is aan of groter is dan het
      drempelbedrag, genoemd in [artikel 13][ref1], past de aanbestedende dienst dit besluit toe op de gunning van elk
      perceel.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel13
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '13'
        paragraaf: '4'
  - number: '14.9'
    text: |-
      Dit besluit is niet van toepassing op percelen als bedoeld in het tiende lid waarvan de geraamde waarde, exclusief
      omzetbelasting minder bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: 14.9.a
    text: € 80.000 voor diensten, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: 14.9.b
    text: € 1 miljoen voor werken,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: '14.10'
    text: |-
      Wanneer een voorgenomen verkrijging van homogene leveringen aanleiding kan geven tot opdrachten die gelijktijdig in
      afzonderlijke percelen worden gegund, neemt de aanbestedende dienst de geraamde totale waarde van deze percelen als
      grondslag voor de toepassing van [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel13
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '13'
        paragraaf: '4'
  - number: '14.11'
    text: |-
      Wanneer de samengetelde waarde van de percelen, bedoeld in het tiende lid, gelijk is aan of groter is dan het
      drempelbedrag, genoemd in [artikel 13][ref1], past de aanbestedende dienst dit besluit toe op de gunning van elk
      perceel.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel13
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '13'
        paragraaf: '4'
  - number: '14.12'
    text: |-
      Dit besluit is niet van toepassing op percelen als bedoeld in het tiende lid waarvan de geraamde waarde, exclusief
      omzetbelasting, minder dan € 80.000 bedraagt, mits het samengetelde bedrag van de percelen in kwestie niet meer dan
      20 procent van de totale waarde van alle percelen omvat.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: '14.13'
    text: |-
      In het geval van opdrachten voor leveringen of opdrachten voor diensten die met een zekere regelmaat worden
      verleend of die bestemd zijn om gedurende een bepaalde periode te worden hernieuwd, raamt de aanbestedende dienst
      de waarde van deze opdracht op de volgende grondslag:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: 14.13.a
    text: |-
      de totale reële waarde van de tijdens het voorafgaande boekjaar of tijdens de voorafgaande twaalf maanden gegunde
      soortgelijke opeenvolgende opdrachten, indien mogelijk gecorrigeerd voor verwachte wijzigingen in hoeveelheid, of
      waarde gedurende de twaalf maanden volgende op de eerste opdracht, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: 14.13.b
    text: |-
      de geraamde totale waarde van de opeenvolgende opdrachten over de twaalf maanden volgende op de eerste levering of
      over het boekjaar, indien dit zich over meer dan twaalf maanden uitstrekt.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: '14.14'
    text: |-
      Een aanbestedende dienst raamt de waarde van een opdracht voor diensten en van een opdracht voor leveringen op
      basis van de totale waarde van de diensten en de leveringen, ongeacht het respectieve aandeel ervan. Deze raming
      omvat de waarde van de plaatsing en installatie.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: '14.15'
    text: |-
      Voor een opdracht voor leveringen die betrekking heeft op leasing, huur, of huurkoop van producten raamt de
      aanbestedende dienst de waarde van deze opdracht op de volgende grondslag:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: 14.15.a
    text: |-
      bij opdrachten met een vaste looptijd, de totale geraamde waarde voor de gehele looptijd wanneer die ten hoogste
      twaalf maanden bedraagt, of de totale waarde wanneer de looptijd meer dan twaalf maanden bedraagt met inbegrip van
      de geraamde restwaarde;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: 14.15.b
    text: |-
      bij opdrachten voor onbepaalde duur of waarvan de looptijd niet kan worden bepaald, het maandelijks te betalen
      bedrag vermenigvuldigd met 48.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: '14.16'
    text: 'Een aanbestedende dienst raamt de waarde van een opdracht voor diensten:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: 14.16.a
    text: 'wanneer het verzekeringsdiensten betreft: de te betalen premie en andere vormen van beloning,'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: 14.16.b
    text: |-
      wanneer het bankdiensten en andere financiële diensten betreft: honoraria, provisies en rente, en andere vormen
      van beloning,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: 14.16.c
    text: |-
      wanneer het opdrachten betreffende een ontwerp betreft: de te betalen honoraria, provisies en andere vormen van
      beloning,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: 14.16.d
    text: |-
      wanneer het opdrachten betreft waarin geen totale prijs is vermeld en die een vaste looptijd hebben die gelijk is
      aan of korter is dan 48 maanden: de totale geraamde waarde voor de gehele looptijd, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: 14.16.e
    text: |-
      wanneer het opdrachten betreft waarin geen totale prijs is vermeld en die voor onbepaalde duur zijn of een looptijd
      hebben die langer is dan 48 maanden: het maandelijks te betalen bedrag vermenigvuldigd met 48.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel14
  - number: '15'
    text: |-
      Dit besluit is niet van toepassing op een concessieovereenkomst voor werken of een concessieovereenkomst voor
      diensten die gesloten wordt door een aanbestedende dienst die één of meer van de activiteiten, bedoeld in de
      [artikelen 2 tot en met 6][ref1], uitoefent indien de concessieovereenkomst met het oog op de uitoefening van die
      activiteiten gesloten wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel2
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
  - number: '16.1'
    text: |-
      Dit besluit is niet van toepassing op een opdracht die is gegund voor wederverkoop of verhuur aan derden, indien de
      aanbestedende dienst geen bijzonder recht of uitsluitend recht bezit om het voorwerp van de opdracht te verkopen of
      te verhuren en het andere instanties vrijstaat dit voorwerp te verkopen of te verhuren op dezelfde voorwaarden als
      de aanbestedende dienst.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel16
  - number: '16.2'
    text: |-
      Een aanbestedende dienst doet de Commissie op haar verzoek mededeling van alle categorieën producten en
      activiteiten die hij ingevolge het eerste lid als uitgesloten beschouwt.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel16
  - number: '16.3'
    text: |-
      Een aanbestedende dienst wijst de Commissie bij de verstrekking van de informatie, bedoeld in het tweede lid, op
      alle gevoelige commerciële aspecten en verzoekt de Commissie daarmee rekening te houden.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel16
  - number: '17.1'
    text: |-
      Dit besluit is niet van toepassing op een opdracht die een aanbestedende dienst gunt voor de uitoefening van de
      activiteiten, bedoeld in de [artikelen 2 tot en met 7][ref1], in een derde land, in omstandigheden waarbij er geen
      fysieke exploitatie is van een net of van fysieke exploitatie van een geografisch gebied binnen de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel2
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
  - number: '17.2'
    text: |-
      Een aanbestedende dienst doet de Commissie op haar verzoek mededeling van opdrachten waarop hij dit besluit
      ingevolge het eerste lid en de [artikelen 2 tot en met 7][ref1], niet toepast.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel2
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
  - number: '17.3'
    text: |-
      Een aanbestedende dienst wijst de Commissie bij de verstrekking van de informatie, bedoeld in het tweede lid, op
      alle gevoelige commerciële aspecten en verzoekt de Commissie daarmee rekening te houden.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel17
  - number: '18'
    text: |-
      Dit besluit is niet van toepassing op opdrachten die geheim zijn verklaard of waarvan de uitvoering overeenkomstig
      de geldende wettelijke en bestuursrechtelijke bepalingen met bijzondere veiligheidsmaatregelen gepaard moet gaan of
      wanneer de bescherming van de fundamentele belangen van de staatsveiligheid van het land zulks vereist.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel18
  - number: 18a
    text: 'Het bij of krachtens dit besluit bepaalde is niet van toepassing op het plaatsen van opdrachten waarop:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel18a
  - number: 18a.a
    text: |-
      de [Aanbestedingswet op defensie- en veiligheidsgebied][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0032898
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0032898
  - number: 18a.b
    text: |-
      de [Aanbestedingswet op defensie- en veiligheidsgebied][ref1] niet van toepassing is ingevolge de
      [artikelen 2.3][ref2], [2.16][ref3] en [2.17 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0032898
      [ref2]: https://wetten.overheid.nl/BWBR0032898#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032898#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032898#Artikel2
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0032898
      - id: ref2
        bwb_id: BWBR0032898
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0032898
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0032898
        artikel: '2'
  - number: '19.1'
    text: |-
      Dit besluit is niet van toepassing op een opdracht waarvoor een ander procedurevoorschrift geldt en die wordt
      gegund:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel19
  - number: 19.1.a
    text: |-
      krachtens een tussen het Koninkrijk der Nederlanden en een of meer derde landen overeenkomstig het Verdrag tot
      oprichting van de Europese Gemeenschap gesloten internationale overeenkomst betreffende leveringen, werken,
      diensten of prijsvragen die bestemd zijn voor de gemeenschappelijke verwezenlijking of exploitatie van een project
      door de ondertekenende staten, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel19
  - number: 19.1.b
    text: |-
      krachtens een in verband met de legering van strijdkrachten gesloten internationale overeenkomst betreffende
      ondernemingen in Nederland of in een derde land, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel19
  - number: 19.1.c
    text: volgens de specifieke procedure van een internationale organisatie.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel19
  - number: '19.2'
    text: |-
      Een aanbestedende dienst brengt een internationale overeenkomst als bedoeld in het eerste lid, onderdeel a, ter
      kennis van de Commissie.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel19
  - number: '20.1'
    text: 'Dit besluit is niet van toepassing op opdrachten die worden gegund door:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel20
  - number: 20.1.a
    text: een aanbestedende dienst bij een met hem verbonden onderneming, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel20
  - number: 20.1.b
    text: |-
      een gemeenschappelijke onderneming, bestaande uit verscheidene aanbestedende diensten, en voor de uitoefening van
      de activiteiten, bedoeld in de [artikelen 2 tot en met 7][ref1], bij een met een van deze aanbestedende diensten
      verbonden onderneming, op voorwaarde dat ten minste 80 procent van de gemiddelde omzet die de verbonden onderneming
      de laatste drie jaar op het gebied van het verlenen van diensten heeft behaald, afkomstig is van de verstrekking
      van deze diensten aan de ondernemingen waarmee zij verbonden is.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel2
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
  - number: '20.2'
    text: |-
      Wanneer in verband met de datum van oprichting of aanvang van de bedrijfsactiviteiten van de verbonden onderneming
      de omzet over de afgelopen drie jaar niet beschikbaar is, kan de aanbestedende dienst of de gemeenschappelijke
      onderneming op andere gronden aantonen dat de omzeteis, bedoeld in het eerste lid, aannemelijk is.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel20
  - number: '20.3'
    text: |-
      Wanneer dezelfde of soortgelijke diensten, leveringen of werken door meer dan één met de aanbestedende dienst
      verbonden ondernemingen worden verricht, worden de percentages, bedoelde in het eerste lid, berekend rekening
      houdend met de totale omzet die voortvloeit uit het verrichten van respectievelijk diensten, leveringen of werken
      door deze ondernemingen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel20
  - number: '20.4'
    text: 'Dit besluit is niet van toepassing op opdrachten:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel20
  - number: 20.4.a
    text: |-
      die een gemeenschappelijke onderneming, bestaande uit verscheidene aanbestedende diensten, voor de uitoefening van
      de activiteiten, bedoeld in de [artikelen 2 tot en met 7][ref1], aan een van deze aanbestedende diensten gunt, of


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel2
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
  - number: 20.4.b
    text: |-
      die een aanbestedende dienst gunt bij een dergelijke gemeenschappelijke onderneming waar zijzelf deel van uitmaakt,
      mits die gemeenschappelijke onderneming is opgericht om de betrokken activiteit uit te oefenen gedurende een
      periode van ten minste drie jaar en de oprichtingsakte van die gemeenschappelijke onderneming bepaalt dat de
      aanbestedende diensten waaruit zij bestaat, daar voor ten minste dezelfde termijn deel van zullen uitmaken.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel20
  - number: '20.5'
    text: |-
      Een aanbestedende dienst verstrekt de Commissie desgevraagd de volgende gegevens betreffende de toepassing van het
      eerste tot en met het vierde lid:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel20
  - number: 20.5.a
    text: de namen van de betrokken ondernemingen of gemeenschappelijke ondernemingen,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel20
  - number: 20.5.b
    text: de aard en de waarde van de desbetreffende opdrachten,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel20
  - number: 20.5.c
    text: |-
      de gegevens die de Commissie noodzakelijk acht voor het bewijs dat de betrekkingen tussen de aanbestedende dienst
      en de onderneming of de gemeenschappelijke onderneming waaraan de opdrachten worden gegund, aan de eisen, bedoeld
      in het eerste tot en met het vierde lid, voldoen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel20
  - number: '21'
    text: 'Dit besluit is niet van toepassing op opdrachten voor diensten:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel21
  - number: 21.a
    text: |-
      betreffende de verwerving of huur, ongeacht de financiële modaliteiten ervan, van grond, bestaande gebouwen of
      andere onroerende zaken of betreffende de rechten hierop, met uitzondering van de overeenkomsten betreffende
      financiële diensten die voorafgaand aan, gelijktijdig met of als vervolg op het koop- of huurcontract worden
      afgesloten,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel21
  - number: 21.b
    text: betreffende diensten van arbitrage en bemiddeling,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel21
  - number: 21.c
    text: |-
      op financieel gebied betreffende de uitgifte, de aankoop, de verkoop en de overdracht van effecten of andere
      financiële instrumenten en door de centrale banken verleende diensten,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel21
  - number: 21.d
    text: inzake arbeidsovereenkomsten,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel21
  - number: 21.e
    text: |-
      voor onderzoek en ontwikkeling, met uitzondering van die waarvan de resultaten in hun geheel aan de aanbestedende
      dienst toekomen voor gebruik ervan in de uitoefening van zijn eigen werkzaamheden, mits de dienstverrichting
      volledig door de aanbestedende dienst wordt beloond.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel21
  - number: '22'
    text: |-
      Dit besluit is niet van toepassing op opdrachten voor diensten die worden gegund aan een aanbestedende dienst, of
      aan een samenwerkingsverband van aanbestedende diensten, op basis van een uitsluitend recht, op voorwaarde dat deze
      bepalingen met het Verdrag tot oprichting van de Europese Gemeenschap verenigbaar zijn.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel22
  - number: '23.1'
    text: |-
      Dit besluit is niet van toepassing op opdrachten voor de aankoop van water, gegund door een aanbestedende dienst,
      die activiteiten als bedoeld in [artikel 4, eerste lid][ref1], uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel4
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '4'
        paragraaf: '2'
  - number: '23.2'
    text: |-
      Dit besluit is niet van toepassing op opdrachten voor de levering van energie of brandstof voor energieopwekking,
      gegund door een aanbestedende dienst die een activiteit als bedoeld in [artikel 2, eerste lid][ref1], of
      [artikel 3, eerste lid][ref2], uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel3
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '3'
        paragraaf: '2'
  - number: '24.1'
    text: |-
      Onverminderd het tweede tot en met het vijfde lid, is dit besluit niet van toepassing op een aanbestedende dienst
      die werkzaam is op het gebied van de verkenning, opsporing of winning van delfstoffen, bedoeld in Beschikking nr.
      93/676/EEG van de Commissie van de Europese Gemeenschappen van 10 december 1993 waarbij wordt vastgesteld dat de
      exploitatie van geografische gebieden met het oogmerk van prospectie of winning van aardolie of gas in Nederland
      niet een relevante activiteit vormt in de zin van artikel 2, lid 2, onder b), punt i), van [Richtlijn nr. 90/531/
      EEG](31990L0531) van de Raad van de Europese Gemeenschappen en dat de diensten welke deze activiteit uitoefenen in
      Nederland niet geacht worden in aanmerking te komen voor bijzondere of uitsluitende rechten in de zin van artikel
      2, lid 3, onder b), van deze richtlijn (PbEG L 316).
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel24
  - number: '24.2'
    text: De aanbestedende dienst, bedoeld in het eerste lid, past de bepalingen van het derde tot en met het vijfde lid toe.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel24
  - number: '24.3'
    text: Het gunnen van een opdracht geschiedt op niet-discriminerende wijze.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel24
  - number: '24.4'
    text: |-
      Voorafgaand aan de opdracht worden de volgende gegevens gepubliceerd in het Publicatieblad van de Europese
      Gemeenschappen dan wel in een landelijk verspreid dagblad:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel24
  - number: 24.4.a
    text: |-
      de naam, het adres, het telefoon-, het telex- en het telefaxnummer van de aanbestedende dienst of van de instelling
      waarbij nadere informatie over de opdracht kan worden verkregen;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel24
  - number: 24.4.b
    text: |-
      een aanduiding van de aard en van de hoeveelheid van het uit te voeren werk, de te verrichten levering of de te
      verrichten dienst;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel24
  - number: 24.4.c
    text: een korte aanduiding van de wijze van aanbesteding.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel24
  - number: '24.5'
    text: |-
      Aan de Commissie wordt informatie verstrekt inzake de toekenning van opdrachten onder de overeenkomstig Beschikking
      nr. 93/327/EEG van de Commissie van de Europese Gemeenschappen van 13 mei 1993 tot vaststelling van de voorwaarden
      waaronder aanbestedende diensten die geografische gebieden exploiteren ter wille van de prospectie en de winning
      van aardolie, gas, steenkool of andere vaste brandstoffen, aan de Commissie informatie moeten verstrekken inzake
      door hen geplaatste opdrachten (PbEG L 129) vastgestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel24
  - number: '25.1'
    text: |-
      Dit besluit is niet van toepassing op opdrachten die worden gegund in het kader van de activiteiten, bedoeld in de
      [artikelen 2 tot en met 7][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel2
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
  - number: 25.1.a
    text: |-
      de Commissie overeenkomstig artikel 30 van [richtlijn nr. 2004/17/EG](32004L0017) een besluit heeft genomen dat
      bepaalt dat artikel 30, eerste lid van die richtlijn van toepassing is op dit activiteit, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel25
  - number: 25.1.b
    text: |-
      de Commissie binnen de termijn, bedoeld in artikel 30, zesde lid, van [richtlijn nr. 2004/17/EG](32004L0017), geen
      beslissing over de toepassing van artikel 30, eerste lid, heeft genomen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel25
  - number: '25.2'
    text: |-
      Een aanbestedende dienst kan de Commissie verzoeken te bepalen dat artikel 30, eerste lid, van [richtlijn nr.
      2004/17/EG](32004L0017) van toepassing is, onder mededeling van een dergelijk verzoek aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel25
  - number: '25.3'
    text: |-
      Onze Minister doet van een beslissing als bedoeld in het eerste lid, onderdeel a of van het uitblijven van een
      beslissing, bedoeld in het eerste lid, onderdeel b, mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel25
  - number: '26.1'
    text: |-
      Een aanbestedende dienst kan de deelneming aan procedures voor de gunning
      van opdrachten voorbehouden aan sociale werkvoorzieningen als bedoeld in
      [artikel 1, onderdeel e, van het Besluit uitvoering sociale werkvoorziening en begeleid werken][ref1], indien de
      meerderheid van de bij de uitvoering van de betreffende overheidsopdracht betrokken werknemers personen met een
      handicap zijn die wegens de aard of de ernst van hun handicaps geen beroepsactiviteit in normale omstandigheden
      kunnen uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0017240#Artikel1
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0017240
        artikel: '1'
  - number: '26.2'
    text: |-
      Een aanbestedende dienst vermeldt in de aankondiging dat de opdracht is voorbehouden aan sociale werkvoorzieningen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel26
  - number: '27.1'
    text: Een aanbestedende dienst kan via een aankoopcentrale opdrachten gunnen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel27
  - number: '27.2'
    text: |-
      De aanbestedende dienst, bedoeld in het eerste lid, wordt geacht dit besluit te hebben nageleefd, mits de
      aankoopcentrale, bedoeld in het eerste lid, dit besluit heeft nageleefd.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel27
  - number: '28'
    text: |-
      Een aanbestedende dienst past bij het gunnen van een opdracht voor diensten, die betrekking heeft op diensten als
      bedoeld in [bijlage 3, onderdeel A][ref1], de [artikelen 31 tot en met 69][ref2] toe.


      [ref1]: https://wetten.overheid.nl/BWBR0018608
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel31
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018608
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '31'
        paragraaf: '8'
  - number: '29'
    text: |-
      Een aanbestedende dienst past bij het gunnen van een opdracht voor diensten, die betrekking heeft op diensten als
      bedoeld in [bijlage 3, onderdeel B][ref1], de [artikelen 31][ref2] en [43][ref3] toe.


      [ref1]: https://wetten.overheid.nl/BWBR0018608
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0018608#Artikel43
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018608
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '31'
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0018608
        artikel: '43'
        paragraaf: '10'
  - number: '30'
    text: |-
      Een aanbestedende dienst past bij het gunnen van een opdracht voor diensten die zowel betrekking
      heeftop de diensten als bedoeld in [bijlage 3, onderdeel A][ref1], als op de diensten als bedoeld in
      [bijlage 3, onderdeel B][ref2], toe:


      [ref1]: https://wetten.overheid.nl/BWBR0018608
      [ref2]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018608
      - id: ref2
        bwb_id: BWBR0018608
  - number: 30.a
    text: |-
      de [artikelen 31 tot en met 60][ref1], indien de waarde van de diensten als bedoeld in
      [bijlage 3, onderdeel A][ref2], hoger is dan die van de diensten, genoemd in [bijlage 3, onderdeel B][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0018608
      [ref3]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '31'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0018608
      - id: ref3
        bwb_id: BWBR0018608
  - number: 30.b
    text: |-
      de [artikelen 31][ref1] en [43][ref2], indien de waarde van de diensten als bedoeld in
      [bijlage 3, onderdeel A][ref3], niet hoger is dan die van de diensten als bedoeld in
      [bijlage 3, onderdeel B][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0018608
      [ref4]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '31'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '43'
        paragraaf: '10'
      - id: ref3
        bwb_id: BWBR0018608
      - id: ref4
        bwb_id: BWBR0018608
  - number: '31.1'
    text: Een aanbestedende dienst neemt de technische specificaties op in de aanbestedingsstukken.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: '31.2'
    text: |-
      De technische specificaties bieden de inschrijvers gelijke toegang en leiden niet tot ongerechtvaardigde
      belemmeringen in de mededinging voor de openstelling van opdrachten.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: '31.3'
    text: 'Een aanbestedende dienst formuleert de technische specificaties:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: 31.3.a
    text: |-
      door verwijzing naar technische specificaties en naar nationale normen waarin Europese normen zijn omgezet, de
      Europese technische goedkeuringen, de gemeenschappelijke technische specificaties, internationale normen, andere
      door de Europese normalisatie-instellingen opgestelde technische referentiesystemen, of, bij ontstentenis daarvan,
      de nationale normen, de nationale technische goedkeuringen dan wel de nationale technische specificaties, andere
      technische referentiesystemen, inzake het ontwerpen, het berekenen en het uitvoeren van werken en het gebruik van
      producten,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: 31.3.b
    text: |-
      in termen van prestatie-eisen en functionele eisen, waaronder milieukenmerken, die zodanig nauwkeurig zijn bepaald
      dat de inschrijvers het voorwerp van de opdracht kunnen bepalen en de aanbestedende dienst de opdracht kan gunnen,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: 31.3.c
    text: |-
      in termen van prestatie-eisen en functionele eisen als bedoeld in onderdeel b, waarbij onder vermoeden van
      overeenstemming met deze prestatie-eisen en functionele eisen wordt verwezen naar de specificaties, bedoeld in
      onderdeel a, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: 31.3.d
    text: |-
      door verwijzing naar de specificaties, bedoeld in onderdeel a, voor bepaalde kenmerken, en verwijzing naar de
      prestatie-eisen en functionele eisen, bedoeld in onderdeel b, voor andere kenmerken.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: '31.4'
    text: |-
      Een aanbestedende dienst vergezelt een verwijzing als bedoeld in het derde lid, onderdeel a van de woorden «of
      gelijkwaardig».
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: '31.5'
    text: |-
      Wanneer een aanbestedende dienst verwijst naar de specificaties, bedoeld in het derde lid, onderdeel a, kan
      hij een inschrijving niet afwijzen met de reden dat de aangeboden producten en diensten niet beantwoorden aan
      de specificaties waarnaar hij heeft verwezen, indien de inschrijver in zijn inschrijving tot voldoening van de
      aanbestedende dienst aantoont dat de door hem voorgestelde oplossingen op gelijkwaardige wijze voldoen aan de eisen
      die in de technische specificaties zijn bepaald.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: '31.6'
    text: |-
      Een aanbestedende dienst wijst, wanneer hij gebruik maakt van de in het derde lid, onderdelen b en c, geboden
      mogelijkheid prestatie-eisen of functionele eisen te stellen, een aanbod van werken, producten of diensten niet
      af indien die beantwoordt aan een nationale norm waarin een Europese norm is omgezet, aan een Europese technische
      goedkeuring, aan een gemeenschappelijke technische specificatie, aan een internationale norm, of aan een door een
      Europese normalisatie-instelling opgestelde technisch referentiesysteem, wanneer deze specificaties betrekking
      hebben op de prestaties of functionele eisen die hij heeft voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: '31.7'
    text: |-
      Een inschrijver toont in zijn inschrijving aan dat het product, de dienst of het werk in overeenstemming is met de
      norm en voldoet aan de functionele en presatie-eisen van de aanbestedende dienst.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: '31.8'
    text: |-
      Een aanbestedende dienst die milieukenmerken voorschrijft door verwijzing naar prestatie-eisen of functionele eisen
      als bedoeld in het derde lid, onderdeel b, kan gebruik maken van de gedetailleerde specificaties of van gedeelten
      daarvan, zoals vastgesteld in milieukeuren, voorzover:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: 31.8.a
    text: |-
      die geschikt zijn voor de omschrijving van de kenmerken van de leveringen of diensten waarop de opdracht betrekking
      heeft,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: 31.8.b
    text: de vereisten voor de keur zijn ontwikkeld op grond van wetenschappelijke gegevens,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: 31.8.c
    text: |-
      de milieukeuren zijn aangenomen via een proces waaraan alle betrokkenen, zoals regeringsinstanties, consumenten,
      fabrikanten, kleinhandel en milieuorganisaties kunnen deelnemen, en
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: 31.8.d
    text: de keuren toegankelijk zijn voor alle betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: '31.9'
    text: |-
      Een aanbestedende dienst kan aangeven dat de van een milieukeur voorziene producten of diensten worden geacht te
      voldoen aan de technische specificaties van het beschrijvend document. De aanbestedende dienst aanvaardt hierbij
      elk ander passend bewijsmiddel, zoals een technisch dossier van de fabrikant of een testverslag van een erkende
      organisatie.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: '31.10'
    text: |-
      Een aanbestedende dienst aanvaardt certificaten van in andere lidstaten van de Europese Unie gevestigde erkende
      organisaties.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: '31.11'
    text: |-
      Een aanbestedende dienst maakt in de technische specificaties geen melding van een bepaald fabrikaat, een bepaalde
      herkomst of een bijzondere werkwijze, noch van een verwijzing naar een merk, een octrooi of een type, een bepaalde
      oorsprong of een bepaalde productie, waardoor bepaalde ondernemingen of bepaalde producten worden bevoordeeld of
      geëlimineerd, tenzij dit door het voorwerp van de opdracht gerechtvaardigd wordt.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: '31.12'
    text: |-
      Een aanbestedende dienst mag de melding of de verwijzing, bedoeld in het elfde lid, opnemen in de technische
      specificaties wanneer:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: 31.12.a
    text: |-
      een voldoende nauwkeurige en begrijpelijke beschrijving van het voorwerp van de opdracht niet mogelijk is door
      toepassing van het derde en vijfde lid, en
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: 31.12.b
    text: deze melding of verwijzing vergezeld gaat van de woorden «of gelijkwaardig».
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel31
  - number: '32.1'
    text: |-
      Een aanbestedende dienst deelt de belangstellende ondernemers desgevraagd de technische specificaties mede die
      regelmatig in zijn opdrachten voor leveringen, werken of diensten worden beoogd, of de technische specificaties
      die hij voornemens is toe te passen voor opdrachten waarover periodieke indicatieve aankondigingen als bedoeld in
      [artikel 40, eerste lid][ref1] worden gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel40
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '40'
        paragraaf: '10'
  - number: '32.2'
    text: |-
      Indien de technische specificaties, bedoeld in het eerste lid, gebaseerd zijn op documenten waarover
      belangstellende ondernemers kunnen beschikken, kan de aanbestedende dienst ermee volstaan een verwijzing naar deze
      documenten op te nemen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel32
  - number: '33.1'
    text: |-
      Wanneer voor de gunning het criterium van de economisch voordeligste inschrijving wordt gehanteerd kan een
      aanbestedende dienst de inschrijvers toestaan varianten, voor te stellen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel33
  - number: '33.2'
    text: |-
      Een aanbestedende dienst vermeldt in de aankondiging van de opdracht of hij varianten toestaat. Een aanbestedende
      dienst staat alleen varianten toe wanneer hij in het beschrijvend document heeft vermeld dat varianten zijn
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel33
  - number: '33.3'
    text: |-
      Een aanbestedende dienst die varianten toestaat, vermeldt in het beschrijvend document aan welke minimumeisen deze
      varianten ten minste voldoen, en hoe zij worden ingediend.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel33
  - number: '33.4'
    text: Een aanbestedende dienst houdt alleen rekening met de varianten die aan de gestelde minimumeisen voldoen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel33
  - number: '33.5'
    text: |-
      Bij procedures voor het gunnen van opdrachten voor leveringen of opdrachten voor diensten wijst een aanbestedende
      dienst die varianten heeft toegestaan, een variant niet af omdat deze, indien deze werd gekozen, veeleer tot
      een overheidsopdracht voor diensten dan tot een overheidsopdracht voor leveringen, dan wel veeleer tot een
      overheidsopdracht voor leveringen dan tot een overheidsopdracht voor diensten zou leiden.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel33
  - number: '34'
    text: |-
      In het beschrijvend document kan een aanbestedende dienst een inschrijver verzoeken om in zijn inschrijving aan
      te geven welk gedeelte van de opdracht hij eventueel voornemens is aan derden in onderaanneming te geven en welke
      onderaannemers hij voorstelt.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel34
  - number: '35'
    text: |-
      Een aanbestedende dienst kan bijzondere voorwaarden verbinden aan de uitvoering van een opdracht, mits dergelijke
      voorwaarden met het Verdrag tot oprichting van de Europese Gemeenschapverenigbaar zijn en in de aankondiging of het
      beschrijvend document vermeld zijn. De voorwaarden waaronder de opdracht wordt uitgevoerd, kunnen met name verband
      houden met sociale of milieuoverwegingen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel35
  - number: '36.1'
    text: |-
      In het beschrijvend document geeft een aanbestedende dienst aan bij welk orgaan de gegadigden of inschrijvers
      informatie kunnen verkrijgen over verplichtingen ten aanzien van de bepalingen inzake belastingen,
      milieubescherming, arbeidsbescherming en arbeidsvoorwaarden die gelden in Nederland, of indien de verrichtingen
      buiten Nederland worden uitgevoerd, die gelden in het gebied of de plaats waar de verrichtingen worden uitgevoerd
      en die gedurende de uitvoering van de opdracht op die verrichtingen van toepassing zullen zijn.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel36
  - number: '36.2'
    text: |-
      Een aanbestedende dienst verzoekt de inschrijvers of de gegadigden aan te geven dat zij bij het opstellen
      van hun inschrijving rekening hebben gehouden met de verplichtingen uit hoofde van de bepalingen inzake de
      arbeidsbescherming en de arbeidsvoorwaarden die gelden op de plaats waar de verrichting moet worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel36
  - number: '37.1'
    text: |-
      Een aanbestedende dienst maakt voor het gunnen van een opdracht gebruik van de openbare procedure, de niet-
      openbare procedure of de procedure van gunning door onderhandelingen, mits een aankondiging als bedoeld in
      [artikel 42][ref1] is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel42
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '42'
        paragraaf: '10'
  - number: '37.2'
    text: |-
      Een aanbestedende dienst kan voor het gunnen van zijn opdracht gebruik maken van een procedure van gunning door
      onderhandelingen zonder voorafgaande aankondiging:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.a
    text: |-
      wanneer in het kader van een procedure met voorafgaande aankondiging geen of geen geschikte inschrijvingen of geen
      aanmeldingen zijn ingediend, mits de oorspronkelijke voorwaarden van de opdracht niet wezenlijk zijn gewijzigd,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.b
    text: |-
      wanneer een opdracht ten behoeve van onderzoek, proefneming, studie of ontwikkeling wordt gegund en zonder het doel
      de rendabiliteit te verzekeren dan wel de kosten van onderzoek en ontwikkeling te dekken, voorzover de gunning van
      een dergelijke opdracht niet verhindert dat een aankondiging wordt gedaan voor latere opdrachten die dit doel in
      het bijzonder beogen;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.c
    text: |-
      wanneer de uitvoering van de opdracht om technische of artistieke redenen of om redenen van bescherming van een
      uitsluitend recht slechts aan één bepaalde onderneming kan worden toevertrouwd,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.d
    text: |-
      in strikt noodzakelijke gevallen waarin dringende spoed, voortvloeiende uit gebeurtenissen die door de
      aanbestedende dienst niet kon worden voorzien, de inachtneming van de termijnen gesteld voor een openbare
      procedure, een niet-openbare procedure en een procedure van gunning door onderhandelingen met voorafgaande
      mededeling onmogelijk maakt,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.e
    text: |-
      in het geval van opdrachten voor leveringen ten behoeve van door de oorspronkelijke leverancier verrichtte
      aanvullende leveringen die bestemd zijn voor:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.e.1°
    text: de gedeeltelijke vernieuwing van veelvuldig gebruikte leveringen of installaties, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.e.2°
    text: |-
      de uitbreiding van bestaande leveringen of installaties, indien verandering van leverancier de aanbestedende dienst
      ertoe zou verplichten apparatuur aan te schaffen met andere technische eigenschappen, zodat onverenigbaarheid
      ontstaat of zich onevenredige technische moeilijkheden bij het gebruik en het onderhoud voordoen,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.f
    text: |-
      voor aanvullende werken of diensten die niet in het oorspronkelijk gegunde ontwerp, noch in de eerste gegunde
      opdracht waren opgenomen, maar die ten gevolge van een onvoorziene omstandigheid voor de uitvoering van deze
      opdracht noodzakelijk zijn geworden, mits de gunning geschiedt aan de aannemer of dienstverlener die de eerste
      opdracht uitvoert:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.f.1°
    text: |-
      wanneer deze aanvullende werken of diensten technisch of economisch niet los van de hoofdopdracht kunnen worden
      uitgevoerd zonder de aanbestedende dienst grote ongemakken te bezorgen, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.f.2°
    text: |-
      wanneer deze aanvullende werken of diensten, hoewel zij van de uitvoering van de oorspronkelijke opdracht kunnen
      worden gescheiden, strikt noodzakelijk zijn om deze te vervolmaken,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.g
    text: |-
      in het geval van opdrachten voor werken, wanneer het gaat om nieuwe werken bestaande uit de herhaling van
      soortgelijke werken die door dezelfde aanbestedende dienst opgedragen zijn aan de aannemer die belast is geweest
      met een eerdere opdracht, mits:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.g.1°
    text: |-
      deze werken overeenstemmen met een basisproject en dit project het voorwerp vormde van een eerste opdracht die na
      een aankondiging werd gegund, en
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.g.2°
    text: |-
      de aanbestedende dienst reeds in de aankondiging van de aanbesteding van het basisproject vermeld heeft dat een
      procedure zonder voorafgaande aankondiging kan worden toegepast,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.h
    text: voor op een grondstoffenmarkt genoteerde en aangekochte leveringen;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.i
    text: |-
      in het geval, bedoeld in [artikel 38, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel38
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '38'
        paragraaf: '9'
  - number: 37.2.j
    text: |-
      voor gelegenheidsaankopen, wanneer zich gedurende zeer korte tijd een bijzonder voordelige gelegenheid tot aankopen
      voordoet en de te betalen prijs aanzienlijk lager ligt dan normaal op de markt het geval is,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.k
    text: |-
      voor de aankoop van leveringen tegen bijzonder gunstige voorwaarden bij een leverancier die definitief zijn
      handelsactiviteit stopzet, bij curatoren of vereffenaars van een faillissement of een vonnis of bij de toepassing
      van de schuldsaneringsregeling natuurlijke personen, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: 37.2.l
    text: |-
      wanneer de opdracht voor diensten voortvloeit uit een overeenkomstig dit besluit georganiseerde prijsvraag en
      volgens de toepasselijke voorschriften aan de winnaar of aan één van de winnaars van die prijsvraag dient te worden
      gegund. In dat geval worden alle winnaars van de prijsvraag tot deelneming aan de onderhandelingen uitgenodigd.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel37
  - number: '38.1'
    text: |-
      Een aanbestedende dienst kan een raamovereenkomst gunnen overeenkomstig de voorschriften in dit besluit voor een
      opdracht voor werken, een opdracht voor leveringen of een opdracht voor diensten.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel38
  - number: '38.2'
    text: |-
      Wanneer een aanbestedende dienst een raamovereenkomst heeft gesloten overeenkomstig dit besluit, kan hij bij
      het gunnen van op deze raamovereenkomst gebaseerde opdrachten gebruik maken van de procedure van gunning door
      onderhandelingen zonder aankondiging.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel38
  - number: '38.3'
    text: |-
      Een aanbestedende dienst maakt geen oneigenlijk gebruik van een raamovereenkomst en gebruikt deze evenmin om de
      mededinging te hinderen, te beperken of te vervalsen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel38
  - number: '39.1'
    text: Een aanbestedende dienst kan gebruik maken van een dynamisch aankoopsysteem.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.2'
    text: |-
      Voor de instelling van een dynamisch aankoopsysteem volgt de aanbestedende dienst de voorschriften van alle fasen
      van de openbare procedure tot aan de gunning van de opdrachten die in het kader van dit dynamische aankoopsysteem
      worden gegund.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.3'
    text: |-
      Een aanbestedende dienst laat alle inschrijvers die aan de selectiecriteria voldoen en overeenkomstig het
      beschrijvend document en de eventuele aanvullende documenten een indicatieve inschrijving hebben ingediend, tot het
      dynamische aankoopsysteem toe.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.4'
    text: |-
      Een aanbestedende dienst staat toe dat indicatieve inschrijvingen te allen tijde kunnen worden verbeterd, op
      voorwaarde dat zij niet afwijken van het beschrijvend document.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.5'
    text: |-
      Voor het opzetten van een dynamische aankoopsysteem en voor de gunning van de opdrachten in
      het kader hiervan gebruikt een aanbestedende dienst elektronische middelen overeenkomstig
      [artikel 49, tweede tot en met het negende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel49
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '49'
        paragraaf: '12'
  - number: '39.6'
    text: 'Bij de instelling van het dynamisch aankoopsysteem:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: 39.6.a
    text: |-
      publiceert de aanbestedende dienst een aankondiging van de opdracht en geeft daarbij aan dat het om een dynamisch
      aankoopsysteem gaat,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: 39.6.b
    text: |-
      verstrekt in het beschrijvend document de aanbestedende dienst nadere gegevens over onder andere de aard van
      de overwogen aankopen waarop dit dynamische aankoopsysteem betrekking heeft, alle nodige informatie omtrent het
      aankoopsysteem, de gebruikte elektronische apparatuur en de nadere technische bepalingen en specificaties voor de
      verbinding, en
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: 39.6.c
    text: |-
      tegelijk met de publicatie van de aankondiging van de opdracht en tot aan het vervallen van het dynamische
      aankoopsysteem biedt de aanbestedende dienst langs elektronische weg een vrije, rechtstreekse en volledige toegang
      tot het beschrijvend document en alle aanvullende documenten of geeft de aanbestedende dienst in de aankondiging
      het internetadres aan waar deze documenten kunnen worden geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.7'
    text: |-
      Een ondernemer kan een indicatieve inschrijving indienen om toegelaten te worden tot het dynamische aankoopsysteem
      onder de voorwaarden, bedoeld in het tweede tot en met het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.8'
    text: Een aanbestedende dienst beoordeelt de indicatieve inschrijving binnen 15 dagen na indiening.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.9'
    text: |-
      Een aanbestedende dienst kan de termijn, genoemd in het achtste lid, verlengen, op voorwaarde dat er tussentijds
      geen aankondiging wordt gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.10'
    text: |-
      Een aanbestedende dienst deelt de ondernemer, bedoeld in het zevende lid, zo snel mogelijk mee dat hij is
      toegelaten tot het dynamische aankoopsysteem of dat zijn indicatieve inschrijving is afgewezen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.11'
    text: Een aanbestedende dienst publiceert voor een specifieke opdracht een aankondiging.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.12'
    text: |-
      Alvorens een aankondiging als bedoeld in het elfde lid te plaatsen, publiceert de aanbestedende dienst een
      vereenvoudigde aankondiging waarin alle belangstellende ondernemers worden uitgenodigd om overeenkomstig het vierde
      lid een indicatieve inschrijving in te dienen, binnen een termijn van ten minste 15 dagen, te rekenen vanaf de
      verzenddatum van de vereenvoudigde aankondiging.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.13'
    text: |-
      Een aanbestedende dienst schrijft een aankondiging uit nadat de beoordeling is afgerond van alle indicatieve
      inschrijvingen, die binnen de termijn, bedoeld in het twaalfde lid, zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.14'
    text: |-
      Een aanbestedende dienst nodigt alle tot het dynamisch aankoopsysteem toegelaten inschrijvers uit om voor een
      specifieke opdracht die binnen dat dynamisch aankoopsysteem wordt gegund een inschrijving in te dienen. Daartoe
      stelt de aanbestedende dienst een voldoende lange termijn vast voor de indiening van de inschrijvingen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.15'
    text: |-
      Een aanbestedende dienst gunt de opdracht aan de inschrijver die de beste inschrijving heeft ingediend op grond van
      de gunningcriteria die zijn vermeld in de aankondiging van de opdracht waarbij het dynamische aankoopsysteem wordt
      ingesteld. Deze criteria kunnen gepreciseerd worden in de uitnodiging, bedoeld in het veertiende lid.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.16'
    text: |-
      Een dynamisch aankoopsysteem duurt niet langer dan vier jaar. Een aanbestedende dienst kan in uitzonderlijke
      gevallen van deze termijn afwijken, waarbij hij deze uitzondering deugdelijk dient te motiveren.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.17'
    text: |-
      Aanbestedende diensten maken geen gebruik van een dynamische aankoopsysteem om de mededinging te hinderen, te
      beperken of te vervalsen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '39.18'
    text: |-
      Een aanbestedende dienst, die gebruik maakt van een dynamisch aankoopsysteem, brengt de betrokken ondernemers geen
      administratiekosten in rekening.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel39
  - number: '40.1'
    text: |-
      Een aanbestedende dienst deelt ten minste eenmaal per jaar in een periodieke indicatieve aankondiging die door de
      Commissie of door de aanbestedende dienst zelf via zijn kopersprofiel wordt verspreid, mee:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel40
  - number: 40.1.a
    text: |-
      het geraamde totale bedrag van de opdracht voor leveringen of de raamovereenkomst voor leveringen per productgroep
      die hij voornemens is in de loop van de komende twaalf maanden te gunnen of te sluiten, wanneer het geraamde totale
      bedrag, met inachtneming van [artikel 14][ref1], € 750.000 of meer bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel14
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '14'
        paragraaf: '4'
  - number: 40.1.b
    text: |-
      het geraamde totale bedrag van de opdracht voor diensten of de raamovereenkomst voor diensten voor elk van de
      diensten, genoemd in [bijlage 3, onderdeel A][ref1], die hij voornemens is in de loop van de komende twaalf maanden
      te gunnen of te sluiten, wanneer het geraamde totale bedrag, met inachtneming van [artikel 14][ref2], € 750.000 of
      meer bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0018608
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel14
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018608
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '14'
        paragraaf: '4'
  - number: 40.1.c
    text: |-
      de hoofdkenmerken van de opdracht voor werken of de raamovereenkomst voor werken die hij voornemens is in de
      loop van de komende twaalf maanden te gunnen of te sluiten, wanneer het geraamde bedrag, met inachtneming van
      [artikel 14][ref1], gelijk is aan of meer bedraagt dan de drempel, genoemd in [artikel 13, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel13
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '14'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '13'
        paragraaf: '4'
  - number: '40.2'
    text: |-
      De periodieke indicatieve aankondiging, bedoeld in het eerste lid, bevat de gegevens, genoemd in
      [bijlage 2, onderdeel C][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018608
  - number: '40.3'
    text: |-
      Een aanbestedende dienst gebruikt voor de aankondigingen die via een kopersprofiel meegedeeld kunnen worden,
      bedoeld in het eerste lid, en voor de aankondiging, het formulier volgens het model dat door de Commissie
      overeenkomstig de in artikel 68, tweede lid, van [richtlijn 2004/17/EG](32004L0017) bedoelde procedure is
      vastgesteld..
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel40
  - number: '40.4'
    text: |-
      Het kopersprofiel, bedoeld in het eerste lid, kan voor periodieke indicatieve aankondigingen informatie bevatten
      over lopende aanbestedingsprocedures, voorgenomen aankopen, gegunde opdrachten, geannuleerde procedures, en alle
      nuttige algemene informatie, zoals het contactpunt, een telefoon- en faxnummer, een postadres en een e-mailadres.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel40
  - number: '40.5'
    text: |-
      Een aanbestedende dienst zendt de aankondiging, bedoeld in het eerste lid, onderdelen a en b, zo spoedig mogelijk
      na het begin van het begrotingsjaar toe aan de Commissie of deelt deze aankondiging mee via het kopersprofiel.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel40
  - number: '40.6'
    text: |-
      Een aanbestedende dienst zendt de aankondiging, bedoeld in het eerste lid, onderdeel c, zo spoedig mogelijk nadat
      de beslissing is genomen tot goedkeuring van het programma voor de opdrachten voor werken of de raamovereenkomsten
      die de aanbestedende dienst voornemens is te gunnen of te sluiten, toe aan de Commissie of deelt deze aankondiging
      mee via het kopersprofiel.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel40
  - number: '40.7'
    text: |-
      Een aanbestedende dienst kan de informatie in het kopersprofiel, bedoeld in het vierde lid, via het internet
      publiceren.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel40
  - number: '40.8'
    text: |-
      Een aanbestedende dienst die de periodieke indicatieve aankondiging via zijn kopersprofiel mee deelt, zendt de
      Commissie langs elektronische weg overeenkomstig het model in het derde punt van bijlage XX van [richtlijn nr.
      2004/17/EG](32004L0017) een kennisgeving toe waarin de mededeling van de periodieke indicatieve aankondiging op het
      kopersprofiel wordt meegedeeld.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel40
  - number: '40.9'
    text: |-
      Een aanbestedende dienst kan periodieke indicatieve aankondigingen over belangrijke projecten meedelen of door
      de Commissie bekend laten maken, zonder de reeds eerder in een periodieke indicatieve aankondiging vervatte
      inlichtingen te herhalen, mits duidelijk wordt vermeld dat deze aankondigingen een aanvulling zijn.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel40
  - number: '41.1'
    text: |-
      Wanneer een aanbestedende dienst een regeling voor de erkenning van ondernemers als bedoeld in [artikel 54][ref1]
      wil invoeren, stelt hij aangaande deze regeling een aankondiging als bedoeld in [bijlage 2, onderdeel B][ref2], op,
      waarin het doel van de regeling en de wijze waarop inzage in de regeling kan worden verkregen, worden aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '54'
        paragraaf: '13'
      - id: ref2
        bwb_id: BWBR0018608
  - number: '41.2'
    text: |-
      Wanneer de regeling, bedoeld in het eerste lid, meer dan drie jaar duurt, deelt de aanbestedende dienst de
      aankondiging jaarlijks mee.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel41
  - number: '41.3'
    text: |-
      Wanneer de regeling, bedoeld in het eerste lid, minder dan drie jaar duurt, volstaat de aanbestedende dienst met
      een eenmalige aankondiging.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel41
  - number: '42.1'
    text: 'Een aanbestedende dienst kan voor een opdracht de aankondiging als volgt doen:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel42
  - number: 42.1.a
    text: |-
      door een periodieke indicatieve aankondiging waarin de gegevens, bedoeld in [bijlage 2, onderdeel C][ref1], zijn
      opgenomen,


      [ref1]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018608
  - number: 42.1.b
    text: |-
      door een mededeling inzake het bestaan van een regeling voor de erkenning van ondernemers waarin de gegevens,
      bedoeld in [bijlage 2, onderdeel B][ref1], zijn opgenomen, of


      [ref1]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018608
  - number: 42.1.c
    text: |-
      door een aankondiging van een opdracht waarin de gegevens, bedoeld in
      [bijlage 2, onderdeel A, onder 1°, 2° of 3°][ref1], zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018608
  - number: '42.2'
    text: |-
      Bij een dynamische aankoopsysteem doet de aanbestedende dienst de aankondiging voor het systeem door een
      aankondiging van een opdracht als bedoeld in het eerste lid, onderdeel c, en de aankondiging voor opdrachten
      op grond van deze systemen door een vereenvoudigde aankondiging van een opdracht waarin de gegevens, bedoeld in
      [bijlage 2, onderdeel A, onder 4°][ref1], zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018608
  - number: '42.3'
    text: |-
      Wanneer een aanbestedende dienst een aankondiging door middel van een periodieke indicatieve aankondiging doet,
      voorziet hij erin dat:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel42
  - number: 42.3.a
    text: |-
      de aankondiging specifiek verwijst naar leveringen, werken of diensten waarop de te gunnen opdracht betrekking
      heeft,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel42
  - number: 42.3.b
    text: |-
      de aankondiging vermeldt dat deze opdracht zal worden gegund door middel van een niet-openbare procedure of een
      procedure van gunning door onderhandelingen, waarbij achteraf geen aankondiging wordt gepubliceerd, en worden de
      belangstellende ondernemers verzocht hun belangstelling schriftelijk kenbaar te maken, en
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel42
  - number: 42.3.c
    text: |-
      de aankondiging ten minste twaalf maanden voor de verzenddatum van de uitnodiging, genoemd in
      [artikel 48, zesde lid][ref1], wordt meegedeeld in de vorm van het formulier volgens het model dat door de
      Commissie overeenkomstig de in artikel 68, tweede lid, van [richtlijn 2004/17/EG](32004L0017) bedoelde procedure
      is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel48
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '48'
        paragraaf: '12'
  - number: '43.1'
    text: |-
      Een aanbestedende dienst die een opdracht heeft gegund of een raamovereenkomst heeft gesloten, zendt de Commissie
      een aankondiging van de geplaatste opdrachten waarin de gegevens, bedoeld in [bijlage 2, onderdeel D][ref1], zijn
      opgenomen, binnen twee maanden na de gunning van de opdracht of de sluiting van de raamovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018608
  - number: '43.2'
    text: |-
      Een aanbestedende dienst is, wanneer een raamovereenkomst als bedoeld in [artikel 38, tweede lid][ref1] is gesloten
      niet verplicht een aankondiging betreffende de resultaten van het gunnen van een op de overeenkomst gebaseerde
      opdracht toe te zenden aan de Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel38
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '38'
        paragraaf: '9'
  - number: '43.3'
    text: |-
      Een aanbestedende dienst zendt de Commissie binnen twee maanden na de gunning van een afzonderlijke opdracht een
      mededeling toe van het resultaat van de gunning van de opdracht op basis van een dynamisch aankoopsysteem.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel43
  - number: '43.4'
    text: |-
      Een aanbestedende dienst kan de resultaten, bedoeld in het derde lid, per kwartaal bundelen. Indien de
      aanbestedende dienst daarvoor kiest zendt hij de gebundelde resultaten binnen twee maanden na het einde van elk
      kwartaal toe.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel43
  - number: '43.5'
    text: |-
      De aankondiging van gegunde opdrachten bevat de gegevens uit [bijlage 2, onderdeel D][ref1], en wordt meegedeeld
      in de vorm van het formulier volgens het model dat door de Commissie overeenkomstig de in artikel 68, tweede lid,
      van [richtlijn 2004/17/EG](32004L0017) bedoelde procedure is vastgesteld, met dien verstande dat de gegevens,
      bedoeld in de [punten 6, 9 en 11 van bijlage 2, onderdeel D][ref2], als niet voor publicatie bestemde gegevens
      worden beschouwd, wanneer de aanbestedende dienst van oordeel is dat publicatie daarvan in strijd zou zijn met een
      gevoelig commercieel belang.


      [ref1]: https://wetten.overheid.nl/BWBR0018608
      [ref2]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018608
      - id: ref2
        bwb_id: BWBR0018608
  - number: '43.6'
    text: |-
      Bij de verzending van de aankondiging wijst de aanbestedende dienst de Commissie op de gegevens, die niet voor
      publicatie bestemd zijn, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel43
  - number: '43.7'
    text: 'Wanneer een aanbestedende dienst een opdracht in verband met onderzoeks- en ontwikkelingsdiensten gunt:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel43
  - number: 43.7.1°
    text: |-
      volgens een procedure zonder voorafgaande aankondiging overeenkomstig [artikel 37, derde lid, onderdeel b][ref1],
      mogen zij de gegevens over de aard en de hoeveelheid van de verleende diensten, bedoeld in de
      [punten 2 en 3 van bijlage 2, onderdeel D][ref2], beperken tot de vermelding «onderzoeks- en
      ontwikkelingsdiensten»,


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '37'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0018608
  - number: 43.7.2°
    text: |-
      die overeenkomstig [artikel 39, derde lid, onderdeel b][ref1], niet volgens een procedure zonder voorafgaande
      aankondiging kan worden gegund, kan hij de gegevens over de aard en de hoeveelheid van de verleende diensten,
      bedoeld in de [punten 2 en 3 van bijlage 2, onderdeel D][ref2], beperken indien de bescherming van het zakengeheim
      zulks noodzakelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '39'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0018608
  - number: '43.8'
    text: 'In de gevallen, bedoeld in het zevende lid, onderdelen 1° en 2°, ziet de aanbestedende dienst er op toe dat:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel43
  - number: 43.8.1°
    text: |-
      de verstrekte informatie ten minste even gedetailleerd is als die in de aankondiging, die overeenkomstig
      [artikel 42, eerste lid][ref1], is gepubliceerd, en


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel42
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '42'
        paragraaf: '10'
  - number: 43.8.2°
    text: |-
      wanneer de aanbestedende dienst van een erkenningsregeling gebruik maakt, deze informatie ten minste even
      gedetailleerd is als die in de desbetreffende categorie van de overeenkomstig [artikel 54, elfde lid][ref1],
      opgestelde lijst van erkende dienstverleners.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel54
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '54'
        paragraaf: '13'
  - number: '43.9'
    text: |-
      In het geval van opdrachten voor de in [bijlage 3, onderdeel B][ref1], opgesomde diensten, vermeldt de
      aanbestedende dienst in de aankondiging of hij met de mededeling daarvan instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018608
  - number: '44.1'
    text: |-
      De aankondigingen, bedoeld in [artikel 40 tot en met 43][ref1], bevatten de gegevens, bedoeld in de
      [bijlage 2, onderdelen A tot en met D][ref2], en andere door de aanbestedende dienst nuttig geachte
      informatie, in de vorm van het formulier volgens het model dat door de Commissie overeenkomstig de in artikel
      68, tweede lid, van [richtlijn 2004/17/EG](32004L0017) bedoelde procedure is vastgesteld. De aanbestedende
      dienst deelt deze aankondigingen mee overeenkomstig de technische kenmerken voor een mededeling, bedoeld in
      [artikel 40, derde tot en met het achtste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0018608
      [ref3]: https://wetten.overheid.nl/BWBR0018608#Artikel40
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '40'
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0018608
      - id: ref3
        bwb_id: BWBR0018608
        artikel: '40'
        paragraaf: '10'
  - number: '44.2'
    text: |-
      Een aanbestedende dienst zendt zijn aankondigingen aan de Commissie langs elektronische weg overeenkomstig het
      model in het derde punt van bijlage XX van [richtlijn nr. 2004/17/EG](32004L0017), of langs andere weg.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel44
  - number: '44.3'
    text: |-
      Een aanbestedende dienst maakt de aankondigingen en de inhoud ervan, bedoeld in het eerste lid, niet openbaar vóór
      de datum waarop zij aan de Commissie worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel44
  - number: '44.4'
    text: |-
      Een aanbestedende dienst voorziet er in dat de aankondigingen, bedoeld in het eerste lid, die op nationaal niveau
      worden meegedeeld, geen andere informatie bevatten dan de informatie in de aankondigingen die overeenkomstig
      [artikel 40, eerste lid][ref1], aan de Commissie worden toegezonden of via een kopersprofiel worden meegedeeld, en
      dat de datum van toezending aan de Commissie of van de mededeling via het kopersprofiel wordt vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel40
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '40'
        paragraaf: '10'
  - number: '44.5'
    text: |-
      Een aanbestedende dienst mag een periodieke indicatieve aankondiging slechts via een kopersprofiel mededelen
      nadat de kennisgeving van de mededeling via het kopersprofiel aan de Commissie is verzonden, en de datum van deze
      verzending is vermeld.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel44
  - number: '44.6'
    text: |-
      Een aanbestedende dienst voorziet er in dat hij de verzenddatum van de aankondigingen kan aantonen door middel van
      de bevestiging van de mededeling van de aankondiging, welke verstrekt wordt door de Commissie.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel44
  - number: '45.1'
    text: Een aanbestedende dienst stelt bij het opstellen van een aankondiging de productgroepen vast volgens de CPV.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel45
  - number: '45.2'
    text: |-
      In geval van discrepanties tussen de CPV en de NACE, of tussen de CPV en de CPC, zijn respectievelijk de NACE of de
      CPC van toepassing.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel45
  - number: '46.1'
    text: |-
      Een aanbestedende dienst houdt bij de vaststelling van de termijnen voor de ontvangst van de inschrijvingen en
      verzoeken tot deelneming rekening met de complexiteit van de opdracht en met de voor de voorbereiding van de
      inschrijvingen benodigde tijd, en met de in dit artikel vastgestelde minimumtermijnen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel46
  - number: '46.2'
    text: |-
      Voor openbare procedures bedraagt de termijn voor de ontvangst van de inschrijvingen minimaal 52 dagen, te rekenen
      vanaf de verzenddatum van de aankondiging van de opdracht.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel46
  - number: '46.3'
    text: |-
      Bij niet-openbare procedures en procedures van gunning door onderhandelingen met voorafgaande aankondiging bedraagt
      de termijn voor de ontvangst van de verzoeken tot deelneming in antwoord op een aankondiging, die uit hoofde van
      [artikel 42, eerste lid, onderdeel c][ref1], is meegedeeld, of in antwoord op een uitnodiging van een aanbestedende
      dienst overeenkomstig [artikel 48, zevende lid][ref2], ten minste 37 dagen vanaf de datum van verzending van de
      aankondiging of vanaf de datum van verzending van de uitnodiging, en bedraagt niet minder dan 22 dagen wanneer
      de aankondiging met andere middelen dan elektronische middelen of per fax ter mededeling wordt verzonden, en
      niet minder dan 15 dagen wanneer de aankondiging wel met elektronische middelen of per fax ter mededeling wordt
      verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel48
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '42'
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '48'
        paragraaf: '12'
  - number: '46.4'
    text: |-
      De termijn voor de ontvangst van de inschrijvingen, bedoeld in het derde lid, kan in afwijking van het derde lid
      in onderling overleg tussen de aanbestedende dienst en de uitgekozen gegadigden worden vastgesteld, mits alle
      gegadigden evenveel tijd krijgen om hun inschrijvingen voor te bereiden en in te dienen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel46
  - number: '46.5'
    text: |-
      Wanneer het niet mogelijk is overeenstemming als bedoeld in het vierde lid te bereiken over de termijn voor de
      ontvangst van de inschrijvingen, stelt de aanbestedende dienst een termijn vast die ten minste 24 dagen en niet
      minder dan 10 dagen bedraagt, te rekenen vanaf de verzenddatum van de uitnodiging tot inschrijving.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel46
  - number: '46.6'
    text: |-
      In de gevallen waarin de aanbestedende diensten een periodieke indicatieve aankondiging als bedoeld in
      [artikel 40, eerste lid][ref1] hebben gepubliceerd, bedraagt de termijn voor de ontvangst van de inschrijvingen
      bij openbare procedures ten minste 36 dagen en niet minder dan 22 dagen, te rekenen vanaf de verzenddatum van de
      aankondiging.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel40
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '40'
        paragraaf: '10'
  - number: '46.7'
    text: |-
      De kortere termijnen, bedoeld in het zesde lid, zijn toegestaan, mits de periodieke indicatieve
      aankondiging, naast de op grond van [bijlage 2, onderdeel C, onder 1°][ref1], vereiste informatie, alle
      in [bijlage 2, onderdeel C, onder 2°][ref2], vereiste informatie bevat, voorzover deze informatie bij de
      mededeling van de aankondiging beschikbaar is, en de aankondiging minimaal 52 dagen en maximaal 12 maanden vóór
      de verzenddatum van de aankondiging van de opdracht, bedoeld in [artikel 42, eerste lid, onderdeel c][ref3], als
      mededeling is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018608
      [ref2]: https://wetten.overheid.nl/BWBR0018608
      [ref3]: https://wetten.overheid.nl/BWBR0018608#Artikel42
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018608
      - id: ref2
        bwb_id: BWBR0018608
      - id: ref3
        bwb_id: BWBR0018608
        artikel: '42'
        paragraaf: '10'
  - number: '46.8'
    text: |-
      Een aanbestedende dienst kan, wanneer de aankondigingen overeenkomstig het model in het derde punt van bijlage
      XX van [richtlijn nr. 2004/17/EG](32004L0017) met elektronische middelen zijn opgesteld en verzonden, de termijn
      voor de ontvangst van de verzoeken tot deelneming bij niet-openbare procedures en procedures van gunning door
      onderhandelingen en de termijn voor de ontvangst van de inschrijvingen bij openbare procedures met zeven dagen
      verkorten.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel46
  - number: '46.9'
    text: |-
      Tenzij de termijn overeenkomstig het vierde lid in onderling overleg is vastgesteld, kan de aanbestedende dienst de
      termijn voor de ontvangst van de inschrijvingen bij openbare procedures, niet-openbare procedures en procedures van
      gunning door onderhandelingen met vijf dagen verkorten, indien de aanbestedende dienst het beschrijvend document
      en alle aanvullende stukken vanaf de verzenddatum van de aankondiging van de opdracht, met elektronische middelen
      vrij, rechtstreeks en volledig toegankelijk maakt en in deze aankondiging het internetadres dat toegang biedt tot
      de documenten vermeldt.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel46
  - number: '46.10'
    text: |-
      Bij openbare procedures mag het gecumuleerde effect van de termijnverkorting, bedoeld in het zesde tot en met het
      negende lid, in geen geval leiden tot een termijn van minder dan 15 dagen voor de ontvangst van de inschrijvingen,
      te rekenen vanaf de verzenddatum van de aankondiging van de opdracht.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel46
  - number: '46.11'
    text: |-
      Wanneer de aankondiging van de opdracht echter niet per fax of met een elektronisch middel wordt verzonden,
      voorziet de aanbestedende dienst er in dat het gecumuleerde effect van de termijnverkorting, bedoeld in het zesde
      tot en met het negende lid, bij openbare procedures in geen geval leidt tot een termijn van minder dan 22 dagen
      voor de ontvangst van de inschrijvingen, te rekenen vanaf de verzenddatum van de aankondiging van de opdracht.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel46
  - number: '46.12'
    text: |-
      Het gecumuleerde effect van de termijnverkorting, bedoeld in het vierde tot en met het zevende lid, mag in geen
      geval leiden tot een termijn van minder dan 15 dagen voor de ontvangst van verzoeken tot deelneming in antwoord op
      een aankondiging, die uit hoofde van [artikel 42, eerste lid, onderdeel c][ref1], is meegedeeld, of in antwoord op
      een uitnodiging van een aanbestedende dienst overeenkomstig [artikel 48, zevende lid][ref2], te rekenen vanaf de
      verzenddatum van de aankondiging van de opdracht of van de uitnodiging.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel48
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '42'
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '48'
        paragraaf: '12'
  - number: '46.13'
    text: |-
      Bij niet-openbare procedures en procedures van gunning door onderhandelingen voorziet een aanbestedende dienst er
      in dat het gecumuleerde effect van de termijnverkorting, bedoeld in het vierde tot en met het zevende lid, in geen
      geval leidt tot een termijn van minder dan tien dagen voor de ontvangst van de inschrijvingen, te rekenen vanaf
      de verzenddatum van de uitnodiging tot inschrijving, behalve wanneer de termijn overeenkomstig het derde lid,
      onderdeel b, in onderling overleg wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel46
  - number: '46.14'
    text: |-
      Wanneer het beschrijvend document en de aanvullende stukken of nadere inlichtingen, hoewel tijdig aangevraagd, niet
      binnen de termijnen, bedoeld in de [artikelen 47][ref1] en [48][ref2], zijn verstrekt, of wanneer de inschrijvingen
      slechts na een bezichtiging ter plaatse, of na inzage ter plaatse van de bij de aanbestedingsstukken behorende
      stukken kunnen worden gedaan, verlengt de aanbestedende dienst de termijn voor de ontvangst van de inschrijvingen
      zodanig dat alle betrokken ondernemers op de hoogte kunnen zijn van alle informatie die voor de opstelling van
      de inschrijving nodig is, behalve wanneer de termijn overeenkomstig het vierde lid in onderling overleg wordt
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel48
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '47'
        paragraaf: '11'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '48'
        paragraaf: '12'
  - number: '47.1'
    text: |-
      Wanneer een aanbestedende dienst bij openbare procedures niet met elektronische middelen overeenkomstig
      [artikel 46, negende lid][ref1], vrije, rechtstreekse en volledige toegang biedt tot het beschrijvend document en
      alle aanvullende stukken, zendt de aanbestedende dienst het beschrijvend document en de aanvullende stukken binnen
      zes dagen na ontvangst van de aanvraag aan de ondernemers toe, mits deze aanvraag tijdig voor de uiterste datum
      voor de indiening van de inschrijvingen is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel46
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '46'
        paragraaf: '11'
  - number: '47.2'
    text: |-
      Een aanbestedende dienst verstrekt nadere inlichtingen over het beschrijvend document uiterlijk zes dagen voor
      het verstrijken van de uiterste termijn voor de ontvangst van de inschrijvingen, mits deze aanvraag tijdig voor de
      uiterste datum voor de indiening van de inschrijvingen is gedaan.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel47
  - number: '48.1'
    text: |-
      Bij niet-openbare procedures en procedures voor gunning door onderhandelingen nodigt de aanbestedende dienst
      de daartoe uitgekozen gegadigden gelijktijdig en schriftelijk uit tot het indienen van een inschrijving of tot
      onderhandelen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: '48.2'
    text: 'De uitnodiging aan de gegadigden bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.2.a
    text: een exemplaar van het beschrijvend document en van alle aanvullende stukken, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.2.b
    text: |-
      de vermelding van de toegang tot het beschrijvend document en tot de andere hiervoor vermelde stukken, wanneer deze
      rechtstreeks langs elektronische weg toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: '48.3'
    text: |-
      Wanneer het beschrijvend document of de aanvullende stukken niet bij de aanbestedende dienst die voor de
      gunningsprocedure verantwoordelijk is kunnen worden aangevraagd, vermeldt de aanbestedende dienst in de uitnodiging
      het adres van de instantie waar deze stukken wel kunnen worden aangevraagd en de uiterste datum voor deze aanvraag,
      en het bedrag dat verschuldigd is en de wijze van betaling om de stukken te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: '48.4'
    text: |-
      Een aanbestedende dienst zendt de documentatie, bedoeld in het derde lid, onmiddellijk na ontvangst van de aanvraag
      aan de ondernemers toe.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: '48.5'
    text: |-
      Een aanbestedende dienst verstrekt nadere inlichtingen over het beschrijvend document of de aanvullende stukken
      uiterlijk zes dagen voor de uiterste datum voor de ontvangst van de inschrijvingen door de aanbestedende dienst,
      mits de aanvraag tijdig voor de uiterste datum voor de indiening van de inschrijvingen of de aanvang van de
      onderhandelingen is gedaan.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: '48.6'
    text: |-
      In de uitnodiging tot inschrijving of tot deelneming aan onderhandelingen neemt de aanbestedende dienst ten minste
      de volgende informatie op:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.6.a
    text: |-
      de uiterste datum waarop de eventuele aanvullende stukken kunnen worden gevraagd en het eventueel voor het
      verkrijgen van deze stukken te betalen bedrag en de wijze waarop betaling geschiedt;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.6.b
    text: |-
      de uiterste datum voor de ontvangst van de inschrijvingen, het adres waar deze worden ingediend en de taal of talen
      waarin zij worden gesteld;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.6.c
    text: een verwijzing naar een aankondiging van de opdracht, die is meegedeeld;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.6.d
    text: de aanduiding van de bij te voegen stukken;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.6.e
    text: |-
      de gunningcriteria indien deze niet vermeld worden in de aankondiging van de opdracht over regeling voor de
      erkenning van ondernemers;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.6.f
    text: |-
      het relatieve gewicht van de gunningcriteria of de volgorde van die criteria naar belangrijkheid, indien
      die gegevens niet in de aankondiging van de opdracht, de aankondiging over de regeling voor de erkenning van
      ondernemers of het beschrijvend document vermeld worden.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: '48.7'
    text: |-
      Wanneer er een aankondiging wordt gedaan aan de hand van een periodieke indicatieve aankondiging, verzoekt
      de aanbestedende dienst nadien alle gegadigden hun belangstelling te bevestigen aan de hand van nadere
      gegevens betreffende de betrokken opdracht, alvorens met de selectie van de inschrijvers of deelnemers aan de
      onderhandelingen te beginnen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: '48.8'
    text: 'Een aanbestedende dienst neemt in de uitnodiging, bedoeld in het zevende lid, ten minste op:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.8.a
    text: 'de aard en de hoeveelheid, met inbegrip van eventuele opties voor latere opdrachten en, indien mogelijk:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.8.a.1°
    text: een schatting van de termijn voor de uitoefening van deze opties, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.8.a.2°
    text: |-
      in het geval van periodiek terugkerende opdrachten, een schatting van de termijnen waarop de latere oproepen tot
      mededinging voor werken, leveringen of diensten worden meegedeeld,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.8.b
    text: type aanbestedingsprocedure, te weten niet-openbare procedure of procedure van gunning door onderhandelingen,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.8.c
    text: de begin- of einddatum van de levering, de werken of de diensten,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.8.d
    text: |-
      het adres en de uiterste datum voor de indiening van aanvragen om te worden uitgenodigd tot het indienen van een
      inschrijving en de taal waarin deze wordt gesteld,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.8.e
    text: |-
      het adres van de instantie die de opdracht gunt en de nodige informatie verstrekt voor het verkrijgen van
      specificaties en andere documenten;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.8.f
    text: |-
      de economische en technische eisen, de financiële waarborgen en de inlichtingen die van de ondernemers worden
      verlangd,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.8.g
    text: het te betalen bedrag voor het verkrijgen van de aanbestedingsdocumenten en de wijze van betaling,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.8.h
    text: |-
      de contractvorm van de opdracht waarvoor inschrijvingen worden gevraagd, te weten aankoop, leasing, huur of
      huurkoop, of een combinatie van deze vormen, en
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: 48.8.i
    text: |-
      de gunningcriteria en de weging ervan, of de volgorde van belangrijkheid van die criteria, indien dit niet in
      de indicatieve aankondiging, het beschrijvend document of de uitnodiging tot aanbesteding of onderhandelingen is
      vermeld.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel48
  - number: '49.1'
    text: |-
      Een aanbestedende dienst deelt de inschrijvers en gegadigden mede of de mededelingen en uitwisselingen van
      informatie als bedoeld in de [artikelen 46 tot en met 49][ref1] gedaan worden door middel van de post of de fax,
      langs elektronische weg overeenkomstig het vijfde en zesde lid, per telefoon in de voorwaarden, bedoeld in het
      zesde lid, per telefoon als bedoeld in het dertiende lid of door middel van een combinatie van deze middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel46
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '46'
        paragraaf: '11'
  - number: '49.2'
    text: |-
      Een aanbestedende dienst maakt gebruik van communicatiemiddelen die algemeen beschikbaar zijn en waardoor de
      toegang van de ondernemers tot de gunningsprocedure niet wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: '49.3'
    text: |-
      Een aanbestedende dienst waarborgt bij de mededelingen, uitwisselingen en opslag van informatie de integriteit van
      de gegevens en de vertrouwelijkheid van de inschrijvingen en van de verzoeken tot deelneming.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: '49.4'
    text: |-
      Een aanbestedende dienst neemt pas na het verstrijken van de uiterste termijn voor de indiening kennis van de
      inhoud van de inschrijvingen en van de aanvragen tot deelneming.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: '49.5'
    text: |-
      Een aanbestedende dienst gebruikt voor mededelingen langs elektronische weg middelen, waarvan de technische
      kenmerken niet-discriminerend zijn en algemeen voor het publiek beschikbaar en welke in combinatie met algemeen
      gebruikte informatie- en communicatietechnologieproducten kunnen functioneren.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: '49.6'
    text: |-
      Op de toezending en de middelen voor de elektronische ontvangst van inschrijvingen, en op de middelen voor de
      elektronische ontvangst van verzoeken tot deelneming zijn het zevende tot en met het tiende lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: '49.7'
    text: |-
      Een aanbestedende dienst waarborgt dat de informatie betreffende de specificaties die nodig zijn voor de
      elektronische indiening van inschrijvingen en verzoeken tot deelneming, inclusief de encryptie, voor belanghebbende
      partijen beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: '49.8'
    text: |-
      Een aanbestedende dienst kan met inachtneming van [artikel 15a van Boek 3 van het Burgerlijk Wetboek][ref1] eisen
      dat bij elektronische inschrijvingen gebruik wordt gemaakt van een geavanceerde elektronische handtekening.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
  - number: '49.9'
    text: |-
      Een inschrijver of gegadigde dient de documenten, certificaten, getuigschriften en verklaringen, bedoeld in
      de [artikelen 53, tweede en derde lid][ref1], [54][ref2] en [55][ref3], indien deze niet in elektronische vorm
      beschikbaar zijn, in vóór het verstrijken van de uiterste termijn voor de indiening van inschrijvingen of verzoeken
      tot deelneming.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0018608#Artikel55
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '53'
        paragraaf: '13'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '54'
        paragraaf: '13'
      - id: ref3
        bwb_id: BWBR0018608
        artikel: '55'
        paragraaf: '13'
  - number: '49.10'
    text: |-
      Een aanbestedende dienst voorziet er in dat de middelen voor de elektronische ontvangst van inschrijvingen en
      verzoeken tot deelneming door passende technische voorzieningen ten minste de waarborg bieden dat:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: 49.10.a
    text: |-
      met betrekking tot het gebruik van elektronische handtekeningen bij inschrijvingen en verzoeken tot deelneming
      voldaan wordt aan [artikel 15a van Boek 3 van het Burgerlijk Wetboek][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
  - number: 49.10.b
    text: het tijdstip en de datum van ontvangst van inschrijvingen en verzoeken tot deelneming kunnen worden vastgesteld,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: 49.10.c
    text: |-
      redelijkerwijs kan worden verzekerd dat niemand vóór de opgegeven uiterste datum toegang kan hebben tot de op grond
      van onderhavige eisen verstrekte informatie,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: 49.10.d
    text: |-
      bij een inbreuk op dit toegangsverbod redelijkerwijs kan worden verzekerd dat de inbreuk zonder problemen kan
      worden opgespoord,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: 49.10.e
    text: |-
      alleen de gemachtigde personen de data voor openbaarmaking van de ontvangen informatie kunnen vaststellen of
      wijzigen,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: 49.10.f
    text: |-
      tijdens de verschillende fasen van de gunningsprocedure of van de prijsvraag alleen een gelijktijdig optreden van
      de gemachtigde personen toegang kan geven tot het geheel of een gedeelte van de verstrekte informatie,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: 49.10.g
    text: |-
      het gelijktijdig optreden van de gemachtigde personen slechts na de opgegeven datum toegang tot de verstrekte
      informatie kan geven,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: 49.10.h
    text: de ontvangen en openbaar gemaakte informatie enkel toegankelijk blijft voor de tot inzage gemachtigde personen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: '49.11'
    text: |-
      Een aanbestedende dienst kan vrijwillige accreditatieregelingen instellen of handhaven om te komen tot een hoger
      niveau van de certificeringsdienst van de middelen, bedoeld in het tiende lid.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: '49.12'
    text: Op de verzending van verzoeken tot deelneming zijn het dertiende tot en met het vijftiende lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: '49.13'
    text: |-
      Een aanbestedende diensten voorziet er in dat verzoeken tot deelneming aan een procedure voor de gunning van een
      opdracht schriftelijk of telefonisch kunnen worden gedaan.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: '49.14'
    text: |-
      Wanneer verzoeken tot deelneming telefonisch worden gedaan, verzendt de aanbestedende dienst vóór het verstrijken
      van de ontvangsttermijn een schriftelijke bevestiging.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel49
  - number: '50.1'
    text: |-
      Een aanbestedende dienst stelt de gegadigden en inschrijvers zo spoedig mogelijk en desgevraagd schriftelijk
      in kennis van de beslissingen die zijn genomen inzake de sluiting van een raamovereenkomst, de gunning van een
      opdracht of de toelating tot een dynamisch aankoopsysteem, met inbegrip van de redenen waarom zij hebben besloten
      geen raamovereenkomst te sluiten, een opdracht waarvoor een aankondiging was gedaan niet te gunnen en de procedure
      opnieuw te beginnen of een dynamisch aankoopsysteem in te stellen. Bij deze inkennisstelling neemt de aanbestedende
      dienst een termijn in acht die voor de gegadigden en inschrijvers voldoende is om tegen die beslissingen op te
      komen voordat de overeenkomst door de aanbestedende dienst wordt aangegaan.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel50
  - number: '50.2'
    text: |-
      Op verzoek van een betrokken partij stelt een aanbestedende dienst iedere afgewezen gegadigde zo spoedig mogelijk,
      uiterlijk binnen 15 dagen na ontvangst van zijn schriftelijk verzoek, in kennis van de redenen voor de afwijzing.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel50
  - number: '50.3'
    text: |-
      Op verzoek van een betrokken partij stelt de aanbestedende dienst iedere afgewezen inschrijver zo spoedig mogelijk,
      uiterlijk binnen 15 dagen na ontvangst van zijn schriftelijk verzoek, in kennis van de redenen voor de afwijzing,
      inclusief, voor de gevallen, bedoeld in [artikel 31, vijfde tot en met het zevende lid][ref1], de redenen voor
      zijn beslissing dat er geen gelijkwaardigheid voorhanden is of dat de werken, leveringen of diensten niet aan de
      functionele en prestatie-eisen voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel31
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '31'
        paragraaf: '8'
  - number: '50.4'
    text: |-
      Op verzoek van een betrokken partij stelt de aanbestedende dienst iedere inschrijver die een aan de eisen
      beantwoordende inschrijving heeft gedaan, zo spoedig mogelijk, uiterlijk binnen 15 dagen na ontvangst van zijn
      schriftelijk verzoek, in kennis van de kenmerken en voordelen van de uitgekozen inschrijving, en van de naam van de
      begunstigde of de partijen bij de raamovereenkomst.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel50
  - number: '50.5'
    text: |-
      Een aanbestedende dienst deelt bepaalde gegevens betreffende de gunning van de opdracht, niet mee indien
      openbaarmaking van die gegevens de toepassing van de wet in de weg zou staan, met het openbaar belang in strijd
      zou zijn, de rechtmatige commerciële belangen van ondernemers zou kunnen schaden, of afbreuk aan de eerlijke
      mededinging tussen hen zou kunnen doen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel50
  - number: '50.6'
    text: |-
      Een aanbestedende dienst die een regeling voor de erkenning van ondernemers invoert en beheert, stelt de verzoekers
      binnen zes maanden na de indiening van het verzoek om erkenning in kennis inzake hun erkenning.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel50
  - number: '50.7'
    text: |-
      Wanneer de beslissing omtrent de erkenning meer dan vier maanden vanaf de indiening van het verzoek om erkenning in
      beslag neemt, informeert de aanbestedende dienst de verzoeker binnen twee maanden na deze indiening over de redenen
      waarom deze termijn langer is en over de datum waarop op zijn verzoek wordt beslist.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel50
  - number: '50.8'
    text: |-
      Een aanbestedende dienst stelt degene van wie een verzoek om erkenning afgewezen is, zo spoedig mogelijk,
      uiterlijk binnen vijftien dagen, van deze beslissing in kennis en motiveert deze afwijzing aan de hand van de
      erkenningscriteria, bedoeld in [artikel 54, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel54
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '54'
        paragraaf: '13'
  - number: '50.9'
    text: |-
      Een aanbestedende dienst kan de erkenning van een ondernemer slechts intrekken op grond van de criteria, bedoeld in
      [artikel 54, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel54
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '54'
        paragraaf: '13'
  - number: '50.10'
    text: |-
      Een aanbestedende dienst brengt de betrokkene het voornemen een erkenning te beëindigen, en de redenen daartoe,
      uiterlijk vijftien dagen vóór de datum waarop de erkenning zal worden beëindigd schriftelijk ter kennis.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel50
  - number: '51.1'
    text: |-
      Een aanbestedende dienst bewaart met betrekking tot alle opdrachten de nodige gegevens, opdat hij later de
      beslissingen kan motiveren betreffende:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel51
  - number: 51.1.a
    text: de erkenning en de selectie van de ondernemers en de gunning van de opdrachten,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel51
  - number: 51.1.b
    text: |-
      het gebruik van procedures zonder voorafgaande aankondiging als bedoeld in [artikel 37, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel37
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '37'
        paragraaf: '9'
  - number: 51.1.c
    text: |-
      de niet-toepassing van de [artikelen 28 tot en met 51][ref1] op grond van de afwijkingen, bedoeld in de
      [artikelen 2 tot en met 8][ref2], de [artikelen 13 tot en met 25][ref3] en de [artikelen 38][ref4] en [39][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018608#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0018608#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0018608#Artikel39
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '28'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0018608
        artikel: '13'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0018608
        artikel: '38'
        paragraaf: '9'
      - id: ref5
        bwb_id: BWBR0018608
        artikel: '39'
        paragraaf: '9'
  - number: '51.2'
    text: |-
      Een aanbestedende dienst neemt passende maatregelen om het verloop van de gunningsprocedures die elektronisch
      uitgevoerd worden te documenteren.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel51
  - number: '51.3'
    text: |-
      Een aanbestedende dienst bewaart de gegevens gedurende ten minste vier jaar na de datum van gunning van de
      opdracht, en verstrekt gedurende dit tijdsbestek de Commissie op haar verzoek de noodzakelijke informatie.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel51
  - number: '52.1'
    text: 'Voor de selectie van deelnemers aan een gunningsprocedure:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel52
  - number: 52.1.a
    text: |-
      sluit de aanbestedende dienst die voorschriften en criteria heeft vastgesteld voor de uitsluiting van inschrijvers
      of gegadigden, bedoeld in [artikel 55, eerste, tweede of vierde lid][ref1], ondernemers die aan deze voorschriften
      en criteria voldoen, uit;


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel55
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '55'
        paragraaf: '13'
  - number: 52.1.b
    text: |-
      selecteert de aanbestedende dienst inschrijvers en gegadigden overeenkomstig de objectieve voorschriften en
      criteria, bedoeld in [artikel 55][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel55
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '55'
        paragraaf: '13'
  - number: 52.1.c
    text: |-
      beperkt de aanbestedende dienst in niet-openbare procedures en in procedures van gunning door onderhandelingen
      met een aankondiging het aantal geselecteerde gegadigden, bedoeld in onderdelen a en b, overeenkomstig
      [artikel 55][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel55
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '55'
        paragraaf: '13'
  - number: '52.2'
    text: |-
      Wanneer een aanbestedende dienst een aankondiging doet door een mededeling inzake het bestaan van een regeling
      voor de erkenning van ondernemers met het oog op selectie van deelnemers in gunningsprocedures voor de specifieke
      opdrachten waarop de aankondiging betrekking heeft:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel52
  - number: 52.2.a
    text: |-
      erkent de aanbestedende dienst de ondernemers overeenkomstig [artikel 54][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel54
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '54'
        paragraaf: '13'
  - number: 52.2.b
    text: |-
      beperkt de aanbestedende dienst in niet-openbare procedures en in procedures van gunning door onderhandelingen met
      een aankondiging het aantal gegadigden overeenkomstig [artikel 55, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel55
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '55'
        paragraaf: '13'
  - number: '52.3'
    text: |-
      Een aanbestedende dienst toetst de door de aldus geselecteerde inschrijvers ingediende inschrijvingen aan de op de
      inschrijvingen toepasselijke voorschriften en voorschriften, en gunt de opdracht op basis van de criteria, genoemd
      in de [artikelen 56][ref1] en [59][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel59
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '56'
        paragraaf: '13'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '59'
        paragraaf: '13'
  - number: '53.1'
    text: |-
      Wanneer een aanbestedende dienst de deelnemers aan een niet-openbare procedure of procedure van gunning door
      onderhandelingen kiest, over erkenning een beslissing neemt of de erkenningscriteria en de regeling voor de
      erkenning van ondernemers herziet, eist hij geen bewijzen die een doublure zouden vormen met reeds beschikbare
      objectieve bewijzen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel53
  - number: '53.2'
    text: |-
      Wanneer een aanbestedende dienst de overlegging verlangt van een door een onafhankelijke instantie opgestelde
      verklaring dat de ondernemer aan bepaalde kwaliteitsnormen voldoet, verwijst hij naar kwaliteitsbewakingsregelingen
      die op de Europese normenreeksen op dit terrein zijn gebaseerd en die zijn gecertificeerd door instanties die
      voldoen aan de Europese normenreeks voor certificering.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel53
  - number: '53.3'
    text: |-
      Een aanbestedende dienst erkent gelijkwaardige verklaringen van in andere lidstaten van de Europese Unie gevestigde
      instanties. Een aanbestedende dienst aanvaardt ook andere bewijzen inzake gelijkwaardige maatregelen op het gebied
      van de kwaliteitsbewaking van ondernemers.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel53
  - number: '53.4'
    text: |-
      Voor opdrachten voor werken of opdrachten voor diensten, kan een aanbestedende dienst, teneinde de technische
      bekwaamheid van de ondernemer te verifiëren, de vermelding eisen van de maatregelen inzake milieubeheer die de
      ondernemer kan toepassen in het kader van de uitvoering van de opdracht.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel53
  - number: '53.5'
    text: |-
      Wanneer een aanbestedende dienst de overlegging verlangt van een door een onafhankelijke instantie opgestelde
      verklaring dat de ondernemer aan bepaalde normen inzake milieubeheer als bedoeld in het vierde lid voldoet,
      verwijst hij naar het communautair milieubeheer- en milieuauditsysteem of naar normen inzake milieubeheer die
      gebaseerd zijn op Europese of internationale normen die gecertificeerd zijn door een erkende organisatie of door
      een organisatie die beantwoordt aan de relevante Europese of internationale normen voor certificatie.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel53
  - number: '53.6'
    text: |-
      Een aanbestedende dienst erkent in het geval, bedoeld in het vijfde lid, gelijkwaardige verklaringen van in andere
      lidstaten van de Europese Unie gevestigde instanties. Een aanbestedende dienst aanvaardt tevens andere bewijzen
      inzake gelijkwaardige maatregelen op het gebied van milieubeheer die de ondernemers overleggen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel53
  - number: '54.1'
    text: |-
      Een aanbestedende dienst kan een regeling voor de erkenning van ondernemers invoeren en beheren. Deze regeling kan
      verscheidene fasen van erkenning van geschiktheid omvatten.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel54
  - number: '54.2'
    text: |-
      Een aanbestedende dienst die een regeling als bedoeld in het eerste lid invoert of beheert, waarborgt dat de
      ondernemers te allen tijde een erkenning kunnen aanvragen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel54
  - number: '54.3'
    text: |-
      Een aanbestedende dienst beheert de regeling, bedoeld in het eerste lid, op basis van door de aanbestedende dienst
      omschreven objectieve criteria en voorschriften. Wanneer deze criteria en voorschriften technische specificaties
      bevatten, is [artikel 31][ref1] van toepassing. De criteria en voorschriften inzake erkenning kunnen zo nodig
      worden herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel31
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '31'
        paragraaf: '8'
  - number: '54.4'
    text: |-
      De criteria en voorschriften, bedoeld in het derde lid, kunnen de uitsluitingscriteria, genoemd in
      [artikel 45, eerste en derde lid, van het Besluit aanbestedingsregels voor overheidsopdrachten][ref1], omvatten
      onder de daarin genoemde voorwaarden, met dien verstande dat wanneer een regeling voor de erkenning van
      ondernemers wordt ingevoerd door de staat, een provincie, een gemeente, een waterschap, een publiekrechtelijke
      instelling of een samenwerkingsverband van deze overheden of publiekrechtelijke instellingen die een
      overheidsopdracht gunt in het kader van een van de activiteiten, genoemd in de [artikelen 2 tot en met 7][ref2],
      [artikel 45, eerste tot en met derde lid, van het Besluit aanbestedingsregels voor overheidsopdrachten][ref3] van
      overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018607#Artikel45
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0018607
        artikel: '45'
  - number: '54.5'
    text: |-
      Bij de toepassing van
      [artikel 45, eerste en derde lid, van het Besluit aanbestedingsregels voor overheidsopdrachten][ref1], bedoeld
      in het vierde lid, is [artikel 46 van het Besluit aanbestedingsregels voor overheidsopdrachten][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel46
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '46'
  - number: '54.6'
    text: |-
      Wanneer de criteria en voorschriften inzake erkenning, bedoeld in het derde lid, eisen omvatten betreffende de
      economische en financiële draagkracht van de ondernemer, kan deze zich beroepen op de draagkracht van andere
      natuurlijke personen of rechtspersonen ongeacht de juridische aard van zijn banden met die natuurlijke personen
      of rechtspersonen. In dat geval toont hij ten behoeve van de aanbestedende dienst aan dat hij gedurende de
      geldigheidsduur van de regeling voor de erkenning van ondernemers werkelijk kan beschikken over de voor de
      uitvoering van de opdracht noodzakelijke middelen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel54
  - number: '54.7'
    text: |-
      Wanneer de criteria en voorschriften inzake erkenning, bedoeld in het derde lid, eisen omvatten betreffende
      de technische bekwaamheid of beroepsbekwaamheid van de ondernemer, kan hij zich beroepen op de bekwaamheid van
      andere natuurlijke personen of rechtspersonen, ongeacht de juridische aard van zijn banden met die natuurlijke
      personen of rechtspersonen. In dat geval toont hij ten behoeve van de aanbestedende dienst aan dat hij gedurende
      de geldigheidsduur van de erkenningsregeling werkelijk kan beschikken over de voor de uitvoering van de opdracht
      noodzakelijke middelen van die natuurlijke personen of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel54
  - number: '54.8'
    text: |-
      Onder dezelfde voorwaarden als bedoeld in het zesde en zevende lid, kan een samenwerkingsverband van ondernemers
      zich beroepen op de draagkracht van de deelnemers aan het samenwerkingsverband of aan andere natuurlijke personen
      of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel54
  - number: '54.9'
    text: |-
      Een aanbestedende dienst stelt de criteria en voorschriften inzake erkenning, bedoeld in het derde lid, desgevraagd
      ter beschikking aan ondernemers. Wanneer deze criteria en voorschriften worden bijgewerkt, wordt dit de betrokken
      ondernemers medegedeeld.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel54
  - number: '54.10'
    text: |-
      Wanneer een aanbestedende dienst van oordeel is dat de regeling voor de erkenning van ondernemers van bepaalde
      andere instanties aan de voorwaarden voldoet, deelt hij de betrokken ondernemers de namen van deze andere
      instanties mede.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel54
  - number: '54.11'
    text: |-
      Een aanbestedende dienst houdt een lijst van erkende ondernemers bij, die volgens het type opdrachten waarvoor de
      erkenning geldt in categorieën kan worden ingedeeld.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel54
  - number: '54.12'
    text: |-
      Wanneer een aanbestedende dienst een aankondiging doet door een mededeling inzake het bestaan van een regeling voor
      de erkenning van ondernemers, kiest hij de inschrijvers bij een niet-openbare procedure of de deelnemers aan een
      procedure van gunning door onderhandelingen uit de volgens deze regeling in aanmerking komende gegadigden.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel54
  - number: '55.1'
    text: |-
      Bij het opstellen van selectiecriteria voor een openbare procedure hanteert de aanbestedende dienst objectieve
      voorschriften en criteria. De aanbestedende dienst stelt die voorschriften en criteria aan de belangstellende
      ondernemers ter beschikking.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel55
  - number: '55.2'
    text: |-
      Een aanbestedende dienst die de gegadigden selecteert voor een niet-openbare procedure of een procedure van
      gunning door onderhandelingen, hanteert de door hem omschreven objectieve voorschriften en criteria, die aan
      belangstellende ondernemers ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel55
  - number: '55.3'
    text: |-
      Bij een niet-openbare procedure of een procedure van gunning door onderhandelingen kan de aanbestedende dienst
      de criteria baseren op de objectieve noodzaak voor de aanbestedende dienst de gegadigden te beperken tot een
      aantal dat wordt gerechtvaardigd door het noodzakelijke evenwicht tussen enerzijds de specifieke kenmerken van
      de procedure en anderzijds de daarvoor vereiste middelen. Bij de vaststelling van het aantal gegadigden houdt de
      aanbestedende dienst rekening met de noodzaak om voldoende concurrentie te waarborgen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel55
  - number: '55.4'
    text: |-
      De criteria en voorschriften, bedoeld in het eerste en tweede lid, kunnen de uitsluitingscriteria, genoemd in
      [artikel 45, eerste en derde lid, van het Besluit aanbestedingsregels voor overheidsopdrachten][ref1], omvatten
      onder de daarin genoemde voorwaarden, met dien verstande dat wanneer de criteria en voorschriften worden
      opgesteld door de staat, een provincie, een gemeente, een waterschap, een publiekrechtelijke instelling en
      een samenwerkingsverband van deze overheden of publiekrechtelijke instellingen die een overheidsopdracht gunt
      in het kader van het verrichten van een van de activiteiten, genoemd in de [artikelen 2 tot en met 7][ref2],
      [artikel 45, eerste tot en met derde lid, van het Besluit aanbestedingsregels voor overheidsopdrachten][ref3] van
      overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018607#Artikel45
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0018607
        artikel: '45'
  - number: '55.5'
    text: |-
      Bij de toepassing van
      [artikel 45, eerste en derde lid, van het Besluit aanbestedingsregels voor overheidsopdrachten][ref1], bedoeld
      in het vierde lid, is [artikel 46 van het Besluit aanbestedingsregels voor overheidsopdrachten][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel46
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '46'
  - number: '55.6'
    text: |-
      Wanneer de criteria en voorschriften, bedoeld in het eerste en tweede lid, eisen betreffende de economische en
      financiële draagkracht van de ondernemer omvatten, kan de ondernemer zich beroepen op de draagkracht van andere
      natuurlijke personen of rechtspersonen, ongeacht de juridische aard van zijn banden met deze natuurlijke personen
      of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel55
  - number: '55.7'
    text: |-
      In het geval, bedoeld in het zesde lid, toont de ondernemer ten behoeve van de aanbestedende dienst aan dat
      hij werkelijk kan beschikken over de voor de uitvoering van de opdracht noodzakelijke middelen. Onder dezelfde
      voorwaarden kan een samenwerkingsverband van ondernemers als bedoeld in [artikel 10][ref1] zich beroepen op de
      draagkracht van de deelnemers aan het samenwerkingsverband of andere natuurlijke personen of rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel10
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '10'
        paragraaf: '3'
  - number: '55.8'
    text: |-
      Wanneer de criteria en voorschriften, bedoeld in het eerste en tweede lid, eisen betreffende de technische
      bekwaamheid of beroepsbekwaamheid van de ondernemer, bedoeld in het zesde lid, omvatten, kan deze zich beroepen op
      de bekwaamheid van andere ondernemers ongeacht de juridische aard van zijn banden met die ondernemers. In dat geval
      toont de ondernemer ten behoeve van de aanbestedende dienst aan dat hij werkelijk kan beschikken over de voor de
      uitvoering van de opdracht noodzakelijke middelen van die ondernemers.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel55
  - number: '55.9'
    text: |-
      Onder dezelfde voorwaarden, bedoeld in het achtste lid, kan een samenwerkingsverband van ondernemers als bedoeld
      in [artikel 10][ref1] zich beroepen op de draagkracht van de deelnemers aan het samenwerkingsverband of aan andere
      ondernemers.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel10
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '10'
        paragraaf: '3'
  - number: '56.1'
    text: 'Een aanbestedende dienst gunt een opdracht op grond van:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel56
  - number: 56.1.a
    text: |-
      criteria die verband houden met het voorwerp van de opdracht, indien de gunning aan de inschrijver met de vanuit
      het oogpunt van de aanbestedende dienst economisch meest voordelige inschrijving plaatsvindt, of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel56
  - number: 56.1.b
    text: het criterium de laagste prijs.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel56
  - number: '56.2'
    text: |-
      Een aanbestedende dienst specificeert in het geval, bedoeld in het eerste lid, onderdeel a, in de aankondiging
      die gebruikt wordt alsaankondiging van de opdracht, in de uitnodiging om de belangstelling te bevestigen, bedoeld
      in [artikel 48, zevende lid][ref1], in de uitnodiging om een inschrijving in te dienen of te onderhandelen, of
      in het beschrijvend document, het relatieve gewicht dat hij voor de bepaling van de economisch meest voordelige
      inschrijving aan ieder van de gekozen criteria toekent. Dit gewicht kan worden uitgedrukt door middel van een marge
      met een passend verschil tussen minimum en maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel48
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '48'
        paragraaf: '12'
  - number: '56.3'
    text: |-
      Wanneer geen weging mogelijk is, vermeldt de aanbestedende dienst in de aankondiging die gebruikt wordt
      als aankondiging van de opdracht, in de uitnodiging om de belangstelling te bevestigen, bedoeld in
      [artikel 48, zevende lid][ref1], in de uitnodiging om een inschrijving in te dienen of te onderhandelen, of in het
      beschrijvend document, de criteria in afnemende volgorde van belangrijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel48
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '48'
        paragraaf: '12'
  - number: '57'
    text: |-
      De mededeling van een aanbestedende dienst van een gunningsbeslissing houdt geen aanvaarding in, als bedoeld in
      [artikel 6:217, eerste lid, van het Burgerlijk Wetboek][ref1], van een aanbod van een ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel217
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '217'
  - number: '58.1'
    text: |-
      In het kader van de openbare procedure, de niet-openbare procedure en de procedure van gunning door
      onderhandelingen met voorafgaande aankondiging kan een aanbestedende dienst de gunning van de opdracht vooraf laten
      gaan door een elektronische veiling, indien de nauwkeurige specificaties voor de opdracht kunnen worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.2'
    text: |-
      In het kader van een opdracht in het kader van een dynamisch aankoopsysteem kan een aanbestedende dienst de
      gunning van de opdracht vooraf laten gaan door een elektronische veiling, indien de nauwkeurige specificaties
      voor de opdracht kunnen worden opgesteld. [Artikel 56, eerste lid][ref1], is van overeenkomstige toepassing op de
      elektronische veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel56
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '56'
        paragraaf: '13'
  - number: '58.3'
    text: |-
      Een aanbestedende dienst die gebruik maakt van een elektronische veiling, meldt dit in de aankondiging van de
      opdracht.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.4'
    text: 'Het beschrijvend document bevat ten minste de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: 58.4.a
    text: |-
      de elementen waarvan de waarden vallen onder de elektronische veiling, voor zover deze elementen kwantificeerbaar
      zijn zodat ze kunnen worden uitgedrukt in cijfers of procenten,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: 58.4.b
    text: |-
      de eventuele limieten van de waarden die kunnen worden ingediend, zoals zij voortvloeien uit de specificaties van
      het voorwerp van de opdracht,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: 58.4.c
    text: |-
      de informatie die tijdens de elektronische veiling ter beschikking van de inschrijvers zal worden gesteld en het
      tijdstip waarop die informatie ter beschikking zal worden gesteld,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: 58.4.d
    text: relevante informatie betreffende het verloop van de elektronische veiling,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: 58.4.e
    text: |-
      de voorwaarden waaronder de inschrijvers een bod kunnen doen en met name de vereiste minimumverschillen die voor de
      biedingen vereist zijn, en
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: 58.4.f
    text: |-
      relevante informatie betreffende het gebruikte elektronische systeem en de nadere technische bepalingen en
      specificaties voor de verbinding.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.5'
    text: |-
      Alvorens over te gaan tot de elektronische veiling, verricht een aanbestedende dienst een eerste volledige
      beoordeling van de inschrijvingen aan de hand van de gunningcriteria en de weging daarvan zoals die zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.6'
    text: |-
      Een aanbestedende dienst nodigt alle inschrijvers die een aan de eisen beantwoordende inschrijving hebben gedaan,
      tegelijkertijd langs elektronische weg uit om nieuwe prijzen of nieuwe waarden in te dienen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.7'
    text: |-
      Een aanbestedende dienst voorziet er in dat het verzoek, bedoeld in het zevende lid, alle relevante informatie
      bevat voor de individuele verbinding met het gebruikte elektronische systeem en het tijdstip en het aanvangsuur van
      de elektronische veiling preciseert.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.8'
    text: Een aanbestedende diensten kan de elektronische veiling in verschillende fasen laten verlopen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.9'
    text: |-
      Een aanbestedende dienst verstuurt de uitnodigingen voor een elektronische veiling uiterlijk vijf werkdagen voor de
      aanvang van de veiling.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.10'
    text: |-
      Wanneer de aanbestedende dienst voor de gunning het criterium van de economisch meest voordelige inschrijving
      hanteert, voegt hij bij de uitnodiging:
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: 58.10.a
    text: het resultaat van de volledige beoordeling van de inschrijving van de betrokken inschrijver, en
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: 58.10.b
    text: |-
      de wiskundige formule die tijdens de elektronische veiling de automatische herklasseringen naar gelang van de
      ingediende nieuwe prijzen of nieuwe waarden zal bepalen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.11'
    text: |-
      In de formule, bedoeld in het elfde lid, onderdeel b, verwerkt de aanbestedende dienst het gewicht dat aan alle
      vastgestelde criteria wordt toegekend om de economisch meest voordelige inschrijving te bepalen. Eventuele marges
      worden daartoe door de aanbestedende dienst vooraf in een bepaalde waarde uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.12'
    text: |-
      Wanneer een aanbestedende dienst varianten toestaat, verstrekt de aanbestedende dienst voor een variant de
      afzonderlijke formule.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.13'
    text: |-
      Tijdens alle fases van de elektronische veiling deelt de aanbestedende diensten onverwijld aan alle inschrijvers
      ten minste de informatie mee die de inschrijvers de mogelijkheid biedt op elk moment hun respectieve klassering
      te kennen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.14'
    text: |-
      Een aanbestedende dienst kan andere informatie betreffende andere ingediende prijzen of waarden meedelen indien
      dat in het beschrijvend document is vermeld. Een aanbestedende dienst kan op ieder ogenblik meedelen hoeveel
      inschrijvers aan de fase van de veiling deelnemen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.15'
    text: |-
      Een aanbestedende dienst deelt tijdens het verloop van de fasen van de elektronische veiling in geen geval de
      identiteit van de inschrijvers mee.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.16'
    text: 'Een aanbestedende dienst kan de elektronische veiling afsluiten door:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: 58.16.a
    text: |-
      in de uitnodiging om deel te nemen aan de veiling een vooraf vastgestelde datum en een vooraf vastgesteld tijdstip
      voor de sluiting aan te geven;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: 58.16.b
    text: |-
      de veiling af te sluiten wanneer hij geen nieuwe prijzen meer ontvangt die beantwoorden aan de vereisten
      betreffende de minimumverschillen, waarbij de aanbestedende dienst in de uitnodiging om deel te nemen aan de
      veiling de termijn die hij na ontvangst van de laatste aanbieding in acht zal nemen alvorens de veiling te sluiten
      preciseert;
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: 58.16.c
    text: |-
      de veiling af te sluiten wanneer alle fasen van de veiling die in de uitnodiging om deel te nemen aan de veiling
      zijn vermeld, afgehandeld zijn.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.17'
    text: |-
      Wanneer een aanbestedende dienst besloten heeft om de elektronische veiling overeenkomstig het zestiende lid,
      onderdeel c, af te sluiten, in combinatie met de regelingen, bedoeld in het zestiende lid, onderdeel b, vermeldt
      hij in de uitnodiging om deel te nemen aan de veiling het tijdschema voor elk van de fasen van de veiling.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '58.18'
    text: |-
      Na de sluiting van de elektronische veiling gunt de aanbestedende dienst de opdracht overeenkomstig
      [artikel 56][ref1], op basis van de resultaten van de elektronische veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel56
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '56'
        paragraaf: '13'
  - number: '58.19'
    text: |-
      Een aanbestedende dienst maakt geen misbruik van de methode van de elektronische veiling, noch gebruikt hij de
      methode om concurrentie te beletten, te beperken of te vervalsen of om wijzigingen aan te brengen in het voorwerp
      van de opdracht zoals omschreven in de aankondiging van de opdracht en in het beschrijvend document.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel58
  - number: '59.1'
    text: |-
      Wanneer voor een bepaalde opdracht inschrijvingen worden gedaan die in verhouding tot de te verrichten werken,
      leveringen of diensten abnormaal laag lijken, verzoekt de aanbestedende dienst, voordat hij deze inschrijvingen kan
      afwijzen, schriftelijk om de door hem nodig geachte verduidelijkingen over de samenstelling van de desbetreffende
      inschrijving.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel59
  - number: '59.2'
    text: 'De verduidelijkingen, bedoeld in het eerste lid, kunnen in ieder geval verband houden met:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel59
  - number: 59.2.a
    text: de doelmatigheid van het productieproces van de producten, van de dienstverrichting of van het bouwproces,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel59
  - number: 59.2.b
    text: |-
      de gekozen technische oplossingen of uitzonderlijk gunstige omstandigheden waarvan de inschrijver bij de levering
      van de producten, het verrichten van de diensten of de uitvoering van de werken kan profiteren,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel59
  - number: 59.2.c
    text: de originaliteit van het ontwerp van de inschrijver,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel59
  - number: 59.2.d
    text: |-
      de naleving van de bepalingen inzake arbeidsvoorwaarden en arbeidsomstandigheden die gelden op de plaats waar de
      opdracht wordt uitgevoerd,
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel59
  - number: 59.2.e
    text: de eventuele ontvangst van staatssteun door de inschrijver.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel59
  - number: '59.3'
    text: |-
      De aanbestedende dienst onderzoekt in overleg met de inschrijver de samenstelling van de desbetreffende
      inschrijving aan de hand van de ontvangen toelichtingen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel59
  - number: '59.4'
    text: |-
      Wanneer een aanbestedende dienst constateert dat een inschrijving abnormaal laag is omdat de inschrijver
      overheidssteun heeft gekregen, kan de inschrijving op die grond worden afgewezen, wanneer de inschrijver
      desgevraagd niet binnen een door de aanbestedende dienst bepaalde voldoende lange termijn kan aantonen dat de
      betrokken steun niet in strijd met de artikelen 87 en 88 van het Verdrag tot oprichting van de Europese Gemeenschap
      is toegekend.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel59
  - number: '59.5'
    text: |-
      Wanneer de aanbestedende dienst in een situatie als bedoeld in het vierde lid een inschrijving afwijst, stelt hij
      de Commissie daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel59
  - number: '60.1'
    text: |-
      Een aanbestedende dienst past op inschrijvingen die producten bevatten uit derde landen waarmee de Europese
      Gemeenschappen geen multilateraal of bilateraal verdrag hebben gesloten die de communautaire ondernemingen op
      vergelijkbare wijze daadwerkelijk toegang verschaft tot de markten van deze derde landen, het tweede tot en met het
      zevende lid toe.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel60
  - number: '60.2'
    text: |-
      Een aanbestedende dienst kan iedere inschrijving die wordt ingediend met het oog op de gunning van een opdracht
      voor leveringen, afwijzen wanneer het aandeel van de uit derde landen afkomstige goederen, waarvan de oorsprong
      wordt vastgesteld overeenkomstig [Verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese
      Gemeenschappen van 12 oktober 1992 tot vaststelling van het communautair douanewetboek (PbEG L 302), meer dan
      vijftig procent uitmaakt van de totale waarde van de goederen waarop deze inschrijving betrekking heeft. Voor de
      toepassing van dit artikel worden de programmatuurtoepassingen die in telecommunicatienetten worden gebruikt, als
      producten beschouwd.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel60
  - number: '60.3'
    text: |-
      Wanneer twee of meer inschrijvingen volgens de gunningcriteria van [artikel 56][ref1] gelijkwaardig zijn, geeft de
      aanbestedende dienst de voorkeur aan de inschrijving die niet krachtens het tweede lid kan worden afgewezen. Indien
      het prijsverschil niet meer dan drie procent bedraagt, wordt het bedrag van de inschrijving door de aanbestedende
      diensten als gelijkwaardig beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel56
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '56'
        paragraaf: '13'
  - number: '60.4'
    text: |-
      Een aanbestedende dienst kan afwijken van het derde lid indien hij hierdoor genoodzaakt zou zijn apparatuur aan
      te schaffen met technische kenmerken die afwijken van de bestaande apparatuur, en dit tot onverenigbaarheid of
      tot technische moeilijkheden bij het gebruik of het onderhoud zou leiden of buitensporige kosten met zich mee zou
      brengen.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel60
  - number: '60.5'
    text: |-
      Een aanbestedende dienst laat bij het bepalen van het aandeel van uit derde landen afkomstige goederen, bedoeld in
      het tweede lid, de derde landen buiten beschouwing ten gunste waarvan de toepassing van [richtlijn nr. 2004/17/EG]
      (32004L0017) bij besluit van de Raad van de Europese Unie overeenkomstig het eerste lid is uitgebreid.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel60
  - number: '61'
    text: |-
      Een aanbestedende dienst stelt de voorschriften voor het uitschrijven van een prijsvraag vast overeenkomstig
      [artikelen 62][ref1] en [64 tot en met 67][ref2] en stelt deze voorschriften ter beschikking aan belangstellende
      ondernemers.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel64
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '62'
        paragraaf: '14'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '64'
        paragraaf: '14'
  - number: '62.1'
    text: |-
      De [artikelen 60 tot en met 66][ref1] zijn van toepassing op de prijsvragen die worden georganiseerd in het
      kader van een procedure voor het gunnen van opdrachten voor diensten waarvan de geraamde waarde, exclusief
      omzetbelasting, ten minste het bedrag, genoemd in artikel 61 van [richtlijn nr. 2004/17/EG](32004L0017) bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel60
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '60'
        paragraaf: '13'
  - number: '62.2'
    text: |-
      Het eerste lid is van toepassing op alle prijsvragen waarvan het totale bedrag aan prijzengeld en betalingen aan
      deelnemers ten minste gelijk is aan het bedrag, genoemd in artikel 61 van [richtlijn nr. 2004/17/EG](32004L0017).
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel62
  - number: '62.3'
    text: |-
      Voor de toepassing van het tweede lid wordt onder drempel verstaan het totaalbedrag aan premies en betalingen, met
      inbegrip van de geraamde waarde, exclusief omzetbelasting, van de opdracht voor diensten die later overeenkomstig
      [artikel 37, tweede lid][ref1], kan worden gegund indien de aanbestedende dienst een dergelijke opdracht in de
      aankondiging van een prijsvraag niet uitsluit.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel37
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '37'
        paragraaf: '9'
  - number: '63'
    text: |-
      De [artikelen 17 tot en met 19][ref1] zijn van overeenkomstige toepassing op prijsvragen als bedoeld in
      [artikel 62, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel62
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '17'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '62'
        paragraaf: '14'
  - number: '64.1'
    text: |-
      Een aanbestedende dienst die een prijsvraag wil uitschrijven, publiceert daartoe een aankondiging betreffende een
      prijsvraag.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel64
  - number: '64.2'
    text: |-
      Een aanbestedende dienst die een prijsvraag uitgeschreven heeft, deelt de resultaten daarvan in een aankondiging
      mee.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel64
  - number: '64.3'
    text: |-
      De aankondigingen, bedoeld in het eerste en tweede lid, die de informatie, bedoeld in
      [bijlage 2, onderdeel E][ref1], respectievelijk in [bijlage 2, onderdeel F][ref2], bevatten worden door de
      aanbestedende dienst opgesteld, in het formulier volgens het model dat door de Commissie overeenkomstig de in
      artikel 68, tweede lid, van [richtlijn 2004/17/EG](32004L0017) bedoelde procedure is vastgesteld en gezonden aan
      de Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0018608
      [ref2]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0018608
      - id: ref2
        bwb_id: BWBR0018608
  - number: '64.4'
    text: |-
      Op de aankondigingen, bedoeld in het eerste en tweede lid, is [artikel 44][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel44
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '44'
        paragraaf: '10'
  - number: '64.5'
    text: |-
      Een aanbestedende dienst zendt de aankondiging, bedoeld in het tweede lid, binnen twee maanden na de sluiting van
      de prijsvraag aan de Commissie.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel64
  - number: '64.6'
    text: |-
      Een aanbestedende dienst kan de Commissie bij de verstrekking van de informatie, bedoeld in het derde lid, wijzen
      op alle gevoelige commerciële aspecten van de aankondigingen, bedoeld in het eerste en tweede lid, en de Commissie
      verzoeken daarmee rekening te houden.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel64
  - number: '65.1'
    text: |-
      [Artikel 49, eerste, tweede en vijfde lid][ref1] zijn van toepassing op mededelingen betreffende prijsvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel49
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '49'
        paragraaf: '12'
  - number: '65.2'
    text: |-
      De jury neemt na afloop van de voor de indiening van plannen en ontwerpen gestelde termijn, kennis van de inhoud
      daarvan.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel65
  - number: '65.3'
    text: |-
      [Artikel 49, zesde tot en met elfde lid][ref1], is van overeenkomstige toepassing op de middelen voor elektronische
      ontvangst van plannen en ontwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel49
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '49'
        paragraaf: '12'
  - number: '66.1'
    text: |-
      Bij een prijsvraag met een beperkt aantal deelnemers stelt een aanbestedende dienst duidelijke en niet-
      discriminerende selectiecriteria vast.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel66
  - number: '66.2'
    text: |-
      Een aanbestedende dienst voorziet er in dat in alle gevallen met het aantal kandidaten dat wordt uitgenodigd om aan
      de prijsvraag deel te nemen een daadwerkelijke mededinging wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel66
  - number: '66.3'
    text: |-
      Een aanbestedende dienst voorziet er in dat de jury bestaat uit natuurlijke personen die onafhankelijk van de
      deelnemers aan de prijsvraag zijn.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel66
  - number: '66.4'
    text: |-
      Wanneer de aanbestedende dienst van de deelnemers aan een prijsvraag een bijzondere beroepskwalificatie eist,
      voorziet de aanbestedende dienst er in dat ten minste een derde van de juryleden dezelfde kwalificatie of een
      gelijkwaardige kwalificatie heeft.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel66
  - number: '67.1'
    text: De jury is onafhankelijk.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel67
  - number: '67.2'
    text: |-
      De jury onderzoekt de projecten op basis van door de gegadigden anoniem voorgelegde ontwerpen en op grond van de
      criteria die in de aankondiging van de prijsvraag zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel67
  - number: '67.3'
    text: |-
      De jury stelt een door haar leden ondertekend verslag op met de door haar op basis van de merites van elk project
      vastgestelde rangorde van de projecten, vergezeld van haar opmerkingen en eventuele punten die verduidelijking
      behoeven.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel67
  - number: '67.4'
    text: De jury eerbiedigt de anonimiteit van gegadigden totdat het oordeel van de jury bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel67
  - number: '67.5'
    text: |-
      De jury kan gegadigden zo nodig uitnodigen om door de jury in haar notulen vermelde vragen te beantwoorden teneinde
      duidelijkheid te verschaffen omtrent bepaalde aspecten van de projecten.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel67
  - number: '67.6'
    text: |-
      De aanbestedende dienst voorziet er in dat van de dialoog tussen de leden van de jury en de gegadigden volledige
      notulen worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel67
  - number: '68'
    text: |-
      Onze Minister stelt de Commissie in kennis van alle moeilijkheden die ondernemers hem rapporteren en die te wijten
      zijn aan het feit dat de internationale arbeidsnormen, genoemd in [bijlage 4][ref1], niet in acht zijn genomen door
      derde landen.


      [ref1]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0018608
  - number: '69'
    text: |-
      Een aanbestedende dienst zendt Onze Minister de gegevens die deze nodig heeft voor de informatieverstrekking
      aan de Commissie, bedoeld in [artikel 68][ref1] en [70][ref2]. Een aanbestedende dienst neemt daarbij de nadere
      voorschriften, bedoeld in [artikel 3, tweede lid, van de Raamwet EEG-voorschriften aanbestedingen][ref3], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0018608#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0005937#Artikel3
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '68'
        paragraaf: '15'
      - id: ref2
        bwb_id: BWBR0018608
        artikel: '70'
        paragraaf: '15'
      - id: ref3
        bwb_id: BWBR0005937
        artikel: '3'
  - number: '70.1'
    text: |-
      Onze Minister zendt ieder jaar aan de Commissie het statistische overzicht, bedoeld in artikel 67, eerste lid, van
      [richtlijn nr. 2004/17/EG](32004L0017).
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel70
  - number: '70.2'
    text: |-
      Onze Minister zendt ieder jaar voor 1 november aan de Commissie het statistisch overzicht, bedoeld in artikel 67,
      tweede lid, van [richtlijn nr. 2004/17/EG](32004L0017).
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel70
  - number: '71.1'
    text: |-
      Indien een aanbestedende dienst gebruik maakt van de mogelijkheid van de verificatieregeling, bedoeld in artikel 3
      van [richtlijn nr. 92/13/EEG](31992L0013), zijn de artikelen 4 tot en met 7 van die richtlijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel71
  - number: '71.2'
    text: |-
      Onze Minister wijst de personen, beroepsgroepen of personeel van instellingen, bedoeld in artikel 6, tweede lid,
      van [richtlijn nr. 92/13/EEG](31992L0013) aan. Van de desbetreffende aanwijzing wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel71
  - number: '71.3'
    text: 'Onze Minister verleent een aanwijzing op grond van het tweede lid indien:'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel71
  - number: 71.3.a
    text: |-
      de betrokken personen, beroepsgroepen of personeel van instellingen van de Raad voor Accreditatie of van een met
      de Raad vergelijkbare accreditatie-instelling een accreditatie hebben verkregen op basis van de norm NEN-EN 45503,
      zoals deze in maart 1996 luidde, en
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel71
  - number: 71.3.b
    text: |-
      de betrokkenen, genoemd in onderdeel a, erin toestemmen dat de Raad of de accreditatie-instelling Onze Minister
      inzicht verschaft in zijn functioneren.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel71
  - number: '72'
    text: |-
      Indien de Commissie toepassing geeft aan de procedures, bedoeld in artikel 8 van [richtlijn nr. 92/13/EEG]
      (31992L0013), verleent de betrokken aanbestedende dienst zijn medewerking daaraan overeenkomstig artikel 8, derde
      tot en met vijfde lid, van [richtlijn nr. 92/13/EEG](31992L0013).
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel72
  - number: '73.1'
    text: |-
      Degene, bedoeld in artikel 9, eerste lid, van [richtlijn nr. 92/13/EEG](31992L0013), kan een verzoek indienen om
      toepassing van de bemiddelingsprocedure van de artikelen 10 en 11 van [richtlijn nr. 92/13/EEG](31992L0013).
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel73
  - number: '73.2'
    text: Het verzoek, bedoeld in het eerste lid, wordt schriftelijk ingediend bij de Commissie of bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel73
  - number: '73.3'
    text: |-
      Indien de Commissie toepassing geeft aan de procedure, bedoeld in artikel 9 tot en met 11 van de [richtlijn nr.
      92/13/EEG](31992L0013), verleent de betrokken aanbestedende dienst zijn medewerking daaraan overeenkomstig de
      artikelen 10, tweede tot en met zevende lid, en 11, eerste lid, van [richtlijn nr. 92/13/EEG](31992L0013).
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel73
  - number: '74'
    text: |-
      Onze Minister stelt de Commissie regelmatig in kennis van wijzigingen in de lijst van aanbestedende diensten,
      bedoeld in bijlagen I tot en met X, van [richtlijn nr. 2004/17/EG](32004L0017).
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel74
  - number: '75.1'
    text: |-
      Het [Besluit aanbestedingen nutssector][ref1] wordt ingetrokken, met dien verstande dat het
      [Besluit aanbestedingen nutssector][ref2] tot uiterlijk 31 januari 2006 van toepassing blijft op de gunning van
      opdrachten waarvoor een aanbestedende dienst heeft verklaard dat het [Besluit aanbestedingen nutssector][ref3] tot
      uiterlijk die datum van toepassing blijft, in:


      [ref1]: https://wetten.overheid.nl/BWBR0005948
      [ref2]: https://wetten.overheid.nl/BWBR0005948
      [ref3]: https://wetten.overheid.nl/BWBR0005948
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005948
      - id: ref2
        bwb_id: BWBR0005948
      - id: ref3
        bwb_id: BWBR0005948
  - number: 75.1.a
    text: een aankondiging als bedoeld in artikel 21, eerste lid, van [richtlijn nr. 93/38/EEG](31993L0038), of
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel75
  - number: 75.1.b
    text: |-
      een verzoek om inschrijving als bedoeld in artikel 26, tweede lid, onder c, van [richtlijn nr. 93/38/EEG]
      (31993L0038).
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel75
  - number: '76'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de derde maand na de datum van uitgifte van het
      Staatsblad waarin het wordt geplaatst, met uitzondering van [artikel 6][ref1], dat in werking treedt op een bij
      koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel6
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0018608
        artikel: '6'
        paragraaf: '2'
  - number: '77'
    text: 'Dit besluit wordt aangehaald als: Besluit aanbestedingen speciale sectoren'
    url: https://wetten.overheid.nl/BWBR0018608/2013-02-16#Artikel77
