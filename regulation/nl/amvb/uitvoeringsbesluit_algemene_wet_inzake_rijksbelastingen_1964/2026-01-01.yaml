  - number: '3'
    text: |-
      Degene die verplicht is woonplaats te kiezen, is desgevraagd gehouden de in de [artikelen 47][ref1] en
      [53 van de Algemene wet inzake rijksbelastingen][ref2] bedoelde boeken, bescheiden en andere gegevensdragers of de
      inhoud daarvan, voor raadpleging aan de inspecteur ter beschikking te stellen op de gekozen woonplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel53
    url: https://wetten.overheid.nl/BWBR0002473/2026-01-01#Artikel3
    references:
      - id: ref1
