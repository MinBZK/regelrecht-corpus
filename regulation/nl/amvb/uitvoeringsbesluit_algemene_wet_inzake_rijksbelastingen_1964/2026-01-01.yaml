articles:
  - number: a1
    text: |-
      1 Dit besluit geeft uitvoering aan de [artikelen 21a][ref1], [61][ref2], [66a][ref3] en
      [70 van de Algemene wet inzake rijksbelastingen][ref4].

      2 Dit besluit verstaat onder inzagerecht: het recht op inzage in de stukken die betrekking hebben op een
      belastingaanslag of een voor bezwaar vatbare beschikking jegens een belastingplichtige of inhoudingsplichtige,
      bedoeld in [artikel 66a van de Algemene wet inzake rijksbelastingen][ref5].


