  - number: '1'
    text: |-
      1 De zelfstandige binnenschipper is gehouden woonplaats te kiezen in Nederland, tenzij hij:

      a. in Nederland een vaste woonplaats heeft;

      b. niet in Nederland woont en niet als binnenschipper een binnenlandse onderneming drijft.

      2 Het lid van de bemanning van een binnenschip - daaronder begrepen de niet-zelfstandige binnenschipper - is
      bevoegd, en op vordering van de inspecteur gehouden, woonplaats te kiezen in Nederland. Indien hij geen woonplaats
      heeft gekozen, wordt hij geacht woonplaats te hebben op de vaste woonplaats of de gekozen woonplaats van zijn
      inhoudingsplichtige. Het vorenstaande geldt niet indien:

      a. hij in Nederland een vaste woonplaats heeft;

      b. hij niet in Nederland woont en niet als binnenschipper in Nederland een dienstbetrekking vervult.

      3 De stukken betreffende de heffing en de invordering van belasting kunnen worden gezonden en betekend aan de
      gekozen woonplaats.
    url: https://wetten.overheid.nl/BWBR0002473/2026-01-01#Artikel1
  - number: '2'
    text: |-
      1 De keuze van de woonplaats of een wijziging van de keuze wordt schriftelijk gedaan bij de inspecteur.

      2 Hij die ingevolge [artikel 1, eerste lid][ref1], verplicht is woonplaats te kiezen, doet dit binnen acht weken na
      de aanvang van zijn werkzaamheden. Woont hij niet in Nederland, dan doet hij de keuze binnen een week nadat hij het
      drijven van een binnenlandse onderneming heeft aangevangen.

      3 Hij die ingevolge [artikel 1, tweede lid][ref2], verplicht is woonplaats te kiezen, doet dit binnen een door de
      inspecteur te bepalen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002473#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002473#Artikel1
    url: https://wetten.overheid.nl/BWBR0002473/2026-01-01#Artikel2
