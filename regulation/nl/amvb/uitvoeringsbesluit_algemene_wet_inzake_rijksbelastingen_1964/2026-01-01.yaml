  - number: 5a
    text: |-
      Als authentiek gegeven uit andere basisregistraties als bedoeld in
      [artikel 21a, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1] wordt aangewezen het
      burgerservicenummer van de ingeschrevene, bedoeld in [bijlage 1 bij het Besluit basisregistratie personen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0002473/2026-01-01#Artikel5a
