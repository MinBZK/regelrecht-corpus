  - number: '5'
    text: |-
      Hij die bij de inwerkingtreding van dit besluit ingevolge [artikel 1, eerste lid][ref1], gehouden wordt woonplaats
      te kiezen, doet dit binnen twee maanden na de inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002473#Artikel1
    url: https://wetten.overheid.nl/BWBR0002473/2026-01-01#Artikel5
