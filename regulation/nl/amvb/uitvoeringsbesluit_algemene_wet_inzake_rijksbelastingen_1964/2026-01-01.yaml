        artikel: '53'
  - number: '4'
    text: |-
      Het niet voldoen aan een verplichting bedoeld in de [artikelen 1][ref1] tot en met [3][ref2] is een strafbaar
      feit.


      [ref1]: https://wetten.overheid.nl/BWBR0002473#Artikel1
