articles:
  - number: '1'
    text: |-
      1 Als categorieën van inrichtingen bedoeld in [artikel 1, eerste lid, van de Wet ziekenhuisvoorzieningen][ref1],
      worden aangewezen:

      A. Ziekenhuizen

      1. algemene ziekenhuizen,

      2. categorale ziekenhuizen,

      3. inrichtingen waarin een enkelvoudige onderzoek- of behandelfunctie wordt uitgeoefend,

      4. revalidatie-inrichtingen,

      5. sanatoria,

      6. centra voor epileptici.

      B. Verpleeghuizen

      verpleeghuizen voor somatisch zieken en geestelijk gestoorde bejaarden of verpleeghuizen waarin somatisch zieken
      dan wel geestelijk gestoorde bejaarden worden verpleegd.

      C. Psychiatrische ziekenhuizen

      1. algemene psychiatrische ziekenhuizen,

      2. klinieken voor kinder- en jeugdpsychiatrie,

      3. klinieken voor verslaafden,

      4. centra voor acute psychiatrie,

      5. inrichtingen voor autisten.

      D. Zwakzinnigeninrichtingen, met uitzondering van kleinschalige woonvoorzieningen voor gehandicapten

      E. Overige categorieën inrichtingen

      1. inrichtingen voor zintuiglijk gehandicapten, met uitzondering van kleinschalige woonvoorzieningen voor
      gehandicapten,

      2. Stichting "Het Dorp", met uitzondering van kleinschalige woonvoorzieningen voor gehandicapten.

      2 Door Onze Minister kunnen, voorzover het een andere Minister mede aangaat in overeenstemming met die Minister:

      a. de in het eerste lid vermelde categorieën van inrichtingen voor gezondheidszorg nader worden omschreven;

      b. naast de in het eerste lid aangewezen categorieën andere categorieën van inrichtingen voor gezondheidszorg
      worden aangewezen.


