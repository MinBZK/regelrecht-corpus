        bwb_id: BWBR0011353
        artikel: '7'
  - number: '22.1'
    text: |-
      Als administratieplichtigen als bedoeld in [artikel 10.8, eerste lid, van de wet][ref1] worden aangewezen: banken,
      beheerders, beleggingsinstellingen, beleggingsondernemingen, betaaldienstverleners, elektronischgeldinstellingen,
      financiële instellingen, instellingen voor collectieve belegging in effecten, levensverzekeraars, natura-
      uitvaartverzekeraars en schadeverzekeraars in de zin van de [Wet op het financieel toezicht][ref2] alsmede
      pensioenuitvoerders in de zin van [artikel 1 van de Pensioenwet][ref3], pensioenuitvoerders in de zin van
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref4] en de Stichting Notarieel Pensioenfonds, bedoeld in
      [artikel 113a van de Wet op het notarisambt][ref5].


