      het quotiënt van 100% en het in de vierde kolom van de in [artikel 2.12 van de wet][ref1] opgenomen tabel als
      eerste vermelde percentage, voor zover het bedrag van de kwijtschelding niet meer bedraagt dan het in de eerste en
      tweede kolom van die tabel vermelde bedrag; en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 15a.2.c.2°
    text: |-
      het quotiënt van 100% en het in de vierde kolom van die tabel als tweede vermelde percentage, voor zover het bedrag
      van de kwijtschelding meer bedraagt dan het in de eerste en tweede kolom van die tabel vermelde bedrag; en
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15a
  - number: 15a.2.d
    text: |-
      de reguliere voordelen die ingevolge [artikel 4.12a van de wet][ref1] niet tot het inkomen uit aanmerkelijk
      belang zijn gerekend voor zover deze voordelen toerekenbaar zijn aan de aandelen of winstbewijzen die de
      belastingplichtige verkrijgt, en vermeerderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 15a.2.e
    text: |-
      de waardeaangroei van de aandelen of winstbewijzen bij de niet in Nederland wonende natuurlijke personen in de
      periode dat die personen ter zake van die aandelen of winstbewijzen belastbaar inkomen uit aanmerkelijk belang als
      bedoeld in [afdeling 7.3 van de wet][ref1] hebben genoten, voor zover blijkt dat die personen hierover een naar het
      inkomen geheven belasting hebben betaald die naar Nederlandse maatstaven redelijk is, en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling7.3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '7.3'
  - number: 15a.2.f
    text: |-
      de waardeaangroei van de aandelen of winstbewijzen bij de niet in Nederland wonende natuurlijke personen in de
      periode dat die personen ter zake van die aandelen of winstbewijzen niet in Nederland belastingplichtig waren,
      voor zover blijkt dat de aangroei in die periode is ontstaan en deze waardeaangroei nog niet is begrepen in de
      vermeerdering van de verkrijgingsprijs ingevolge dit lid, onderdeel e, en verminderd met:
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15a
  - number: 15a.2.g
    text: |-
      de waardedaling van de aandelen of winstbewijzen bij de niet in Nederland wonende natuurlijke personen in de
      periode dat die personen ter zake van het aanmerkelijk belang niet in Nederland belastingplichtig waren, voor zover
      blijkt dat de waardedaling in die periode is ontstaan.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15a
  - number: 15a.3
    text: 'Een in het eerste lid bedoelde titel betreft:'
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15a
  - number: 15a.3.a
    text: een overgang onder algemene titel;
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15a
  - number: 15a.3.b
    text: een overgang krachtens erfrecht onder bijzondere titel;
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15a
  - number: 15a.3.c
    text: |-
      een verdeling van een nalatenschap of een huwelijksgemeenschap binnen twee jaren na het overlijden van de erflater,
      respectievelijk na de ontbinding van de huwelijksgemeenschap, of
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15a
  - number: 15a.3.d
    text: een overdracht krachtens schenking.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15a
  - number: 15a.4
    text: |-
      Ingeval het eerste lid toepassing heeft gevonden, wordt de in dat lid bedoelde conserverende
      belastingaanslag door de inspecteur verminderd met het bedrag van de belasting waarvoor krachtens
      [artikel 25, achtste lid, van de Invorderingswet 1990][ref1] ter zake van de aldaar bedoelde
      aandelen of winstbewijzen nog uitstel van betaling loopt. Met betrekking tot deze vermindering is
      [artikel 30g, tweede lid, van de Algemene wet inzake rijksbelastingen][ref2] niet van toepassing. Ingeval het
      eerste lid in verbinding met het tweede lid toepassing heeft gevonden, vindt de eerste en tweede volzin toepassing
      met betrekking tot de in het tweede lid bedoelde conserverende belastingaanslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30g
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30g
  - number: 15a.5
    text: |-
      Ingeval het uitstel van betaling op grond van [artikel 25, achtste lid, van de Invorderingswet 1990][ref1] wordt
      voortgezet in situaties waarin aandelen of winstbewijzen die aan het verleende uitstel ten grondslag liggen
      zijn vervangen door andere aandelen of winstbewijzen, worden die andere aandelen of winstbewijzen geacht aan de
      conserverende belastingaanslag ten grondslag te liggen en wordt de overdrachtsprijs van die andere aandelen of
      winstbewijzen gelijk te zijn aan de overdrachtsprijs van de aandelen of winstbewijzen die zijn vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: '16.1'
    text: |-
      Indien een belastingplichtige met een aanmerkelijk belang in Nederland gaat wonen en de belastingplichtige eerder
      in Nederland heeft gewoond of voordien ten aanzien van een aanmerkelijk belang buitenlands belastingplichtig
      is geweest, wordt de verkrijgingsprijs van de tot dat belang behorende aandelen of winstbewijzen gesteld op de
      verkrijgingsprijs, bedoeld in [artikel 4.21 van de wet][ref1], en vervolgens vermeerderd of verminderd zoals in de
      volgende leden is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '16.2'
    text: |-
      De verkrijgingsprijs volgens [artikel 4.21 van de wet][ref1] wordt vermeerderd met de waardeaangroei van de
      aandelen of winstbewijzen boven die verkrijgingsprijs voorzover blijkt dat de belastingplichtige in verband met het
      gaan wonen in Nederland in het buitenland hierover een naar het inkomen geheven belasting heeft betaald die naar
      Nederlandse maatstaven redelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '16.3'
    text: |-
      De verkrijgingsprijs volgens [artikel 4.21 van de wet][ref1] wordt vermeerderd met de waardeaangroei van de
      aandelen of winstbewijzen boven die verkrijgingsprijs voorzover deze aangroei blijkt te zijn ontstaan in een
      periode dat de belastingplichtige ter zake van die aandelen of winstbewijzen in Nederland niet belastingplichtig
      was en deze waardeaangroei nog niet is begrepen in de vermeerdering van de verkrijgingsprijs ingevolge het tweede
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '16.4'
    text: |-
      De verkrijgingsprijs volgens [artikel 4.21 van de wet][ref1] wordt verminderd met de waardedaling van de aandelen
      of winstbewijzen beneden die verkrijgingsprijs voorzover deze waardedaling is ontstaan in een periode waarin de
      belastingplichtige ter zake van die aandelen of winstbewijzen niet in Nederland belastingplichtig was.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '16.5'
    text: |-
      Indien [artikel 4.16, eerste lid, onderdeel h][ref1], onderscheidenlijk artikel
      [7.5, zevende lid, van de wet][ref2] eerder met betrekking tot het aanmerkelijk belang van toepassing is geweest,
      wordt de belastingaanslag over het jaar bij de vaststelling waarvan een van de genoemde artikelonderdelen van
      toepassing is geweest, verminderd met een bedrag dat overeenkomt met dat gedeelte van de belasting waarvoor
      krachtens [artikel 25, achtste lid, van de Invorderingswet 1990][ref3] nog uitstel van betaling loopt. Met
      betrekking tot deze vermindering is [artikel 30g, tweede lid, van de Algemene wet inzake rijksbelastingen][ref4]
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel30g
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 30g
  - number: '16.6'
    text: |-
      De verkrijgingsprijs volgens [artikel 4.21 van de wet][ref1] van de nog tot het aanmerkelijk
      belang behorende aandelen of winstbewijzen wordt vermeerderd met de aan die aandelen of
      winstbewijzen toe te rekenen kosten welke zijn gemaakt voor het stellen van zekerheid als bedoeld in
      [artikel 25, achtste lid, van de Invorderingswet 1990][ref2], tenzij de verkrijgingsprijs op grond van het
      tweede lid reeds is vermeerderd met de waardeaangroei van de aandelen of winstbewijzen die eerder krachtens
      [artikel 4.16, eerste lid, onderdeel h][ref3], onderscheidenlijk [artikel 7.5, zevende lid, van de wet][ref4] tot
      het belastbare inkomen uit aanmerkelijk belang is gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '7'
  - number: '16.7'
    text: |-
      Indien [artikel 4.16, eerste lid, onderdeel h][ref1], onderscheidenlijk artikel
      [7.5, zevende lid, van de wet][ref2] eerder met betrekking tot het aanmerkelijk belang van toepassing is geweest
      en de belastingplichtige op de belastingaanslag bij de vaststelling waarvan een van de genoemde artikelonderdelen
      van toepassing is geweest betalingen heeft gedaan ter voldoening van de ingevolge een van die artikelonderdelen
      verschuldigde belasting, wordt de verkrijgingsprijs volgens [artikel 4.21 van de wet][ref3] van de nog tot het
      aanmerkelijk belang behorende aandelen of winstbewijzen vermeerderd met een bedrag ter grootte van het bedrag van
      de op die aandelen of winstbewijzen betrekking hebbende betalingen, vermenigvuldigd met:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 16.7.a
    text: |-
      het quotiënt van 100% en het in de vierde kolom van de in [artikel 2.12 van de wet][ref1] opgenomen tabel als
      eerste vermelde percentage, voor zover het bedrag van de op die aandelen of winstbewijzen betrekking hebbende
      betalingen niet meer bedraagt dan het in de eerste en tweede kolom van die tabel vermelde bedrag; en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 16.7.b
    text: |-
      het quotiënt van 100% en het in de vierde kolom van die tabel als tweede vermelde percentage, voor zover het bedrag
      van die betalingen meer bedraagt dan het in de eerste en tweede kolom van die tabel vermelde bedrag.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
  - number: '16.8'
    text: |-
      Indien [artikel 4.16, eerste lid, onderdeel h][ref1], onderscheidenlijk artikel
      [7.5, zevende lid, van de wet][ref2] eerder met betrekking tot het aanmerkelijk belang van toepassing is
      geweest en daarbij sprake was van een negatief vervreemdingsvoordeel, wordt de verkrijgingsprijs volgens artikel
      [4.21 van de wet][ref3] van de nog tot het aanmerkelijk belang behorende aandelen of winstbewijzen verminderd met
      het aan die aandelen of winstbewijzen toe te rekenen negatieve vervreemdingsvoordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '16.9'
    text: |-
      Indien de belastingplichtige een aanmerkelijk belang in een niet in Nederland gevestigde vennootschap
      heeft en [artikel 4.16, eerste lid, onderdeel h, van de wet][ref1] ten aanzien van dat belang krachtens
      [artikel 4.18 van de wet][ref2] niet is toegepast toen hij Nederland verliet, wordt de verkrijgingsprijs van die
      aandelen of winstbewijzen in afwijking van de voorgaande leden gesteld op de waarde in het economische verkeer op
      het tijdstip waarop de belastingplichtige weer in Nederland is gaan wonen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '16.10'
    text: |-
      Indien de belastingplichtige een aanmerkelijk belang in een in Nederland gevestigde vennootschap heeft en daartoe
      aandelen of winstbewijzen behoren die hij krachtens huwelijksvermogensrecht, erfrecht, de verdeling van een
      nalatenschap of huwelijksgemeenschap, of gift heeft verkregen in een periode dat hij niet in Nederland woonachtig
      was en ten aanzien van degene van wie hij de aandelen of winstbewijzen heeft verkregen ter zake van deze overgang
      een conserverende belastingaanslag is opgelegd waarvoor op het tijdstip dat de belastingplichtige in Nederland gaat
      wonen nog uitstel van betaling loopt, wordt ten aanzien van de belastingplichtige de verkrijgingsprijs van deze
      aandelen of winstbewijzen gesteld op de overdrachtsprijs van die aandelen of winstbewijzen waarvan is uitgegaan
      voor die conserverende belastingaanslag, verminderd met:
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
  - number: 16.10.a
    text: |-
      het bedrag waarvoor krachtens [artikel 25, achtste lid, van de Invorderingswet 1990][ref1] nog uitstel van
      betaling loopt voor bedoelde conserverende belastingaanslag voor zover dit uitstel toerekenbaar is aan de aandelen
      of winstbewijzen die de belastingplichtige heeft, vermenigvuldigd met:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 16.10.a.1°
    text: |-
      het quotiënt van 100% en het in de vierde kolom van de in [artikel 2.12 van de wet][ref1] opgenomen tabel als
      eerste vermelde percentage, voor zover het bedrag waarvoor nog uitstel van betaling loopt niet meer bedraagt dan
      het in de eerste en tweede kolom van die tabel vermelde bedrag; en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 16.10.a.2°
    text: |-
      het quotiënt van 100% en het in de vierde kolom van die tabel als tweede vermelde percentage, voor zover het bedrag
      waarvoor nog uitstel van betaling loopt meer bedraagt dan het in de eerste en tweede kolom van die tabel vermelde
      bedrag;
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
  - number: 16.10.b
    text: |-
      het bedrag waarvoor krachtens [artikel 25, achtste lid, onderdeel b, van de Invorderingswet 1990][ref1] het
      uitstel van betaling is beëindigd voor bedoelde conserverende belastingaanslag, voor zover de beëindiging
      toerekenbaar is aan de aandelen of winstbewijzen die de belastingplichtige verkrijgt, vermenigvuldigd met:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 16.10.b.1°
    text: |-
      het quotiënt van 100% en het in de vierde kolom van de in [artikel 2.12 van de wet][ref1] opgenomen tabel als
      eerste vermelde percentage, voor zover het bedrag waarvoor het uitstel van betaling is beëindigd niet meer bedraagt
      dan het in de eerste en tweede kolom van die tabel vermelde bedrag; en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 16.10.b.2°
    text: |-
      het quotiënt van 100% en het in de vierde kolom van die tabel als tweede vermelde percentage, voor zover het bedrag
      waarvoor het uitstel van betaling is beëindigd meer bedraagt dan het in de eerste en tweede kolom van die tabel
      vermelde bedrag;
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
  - number: 16.10.c
    text: |-
      het bedrag waarvoor krachtens [artikel 26, vierde lid, van de Invorderingswet 1990][ref1] kwijtschelding van
      belasting is verleend op bedoelde conserverende belastingaanslagen, voor zover deze kwijtschelding toerekenbaar is
      aan de aandelen of winstbewijzen die de belastingplichtige verkrijgt, vermenigvuldigd met:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
