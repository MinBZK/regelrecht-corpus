        artikel: 10a
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '15.4'
    text: |-
      De opgave, bedoeld in het eerste, tweede en derde lid, wordt door de verzekeraar binnen tien maanden na afloop van
      het kalenderjaar waarop de ingelegde premies betrekking hebben, aan de belastingplichtige verstrekt.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15
  - number: 15bis
    text: |-
      Indien het partnerschap in de loop van het kalenderjaar is aangevangen, wordt het gezamenlijke maximumbedrag,
      bedoeld in [artikel 4.14a, derde lid, tweede zin, van de wet][ref1], gesteld op het bedrag genoemd in
      artikel 4.14a, tweede lid, van de wet, vermeerderd met de bedragen die bij de belastingplichtige of zijn partner
      over een eerdere periode in aanmerking zijn genomen als fictief regulier voordeel als bedoeld in artikel 4.14a,
      eerste lid, van de wet. Indien de belastingplichtige of zijn partner in het kalenderjaar waarin het partnerschap
      aanvangt eerder een partnerschap heeft gehad, is voor de toepassing van de eerste zin [artikel 15ter][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012066#Artikel15ter
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15bis
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012066
        artikel: 15ter
        hoofdstuk: '4'
  - number: 15ter.1
    text: |-
      Indien het partnerschap in het kalenderjaar is geëindigd, wordt met ingang van dat kalenderjaar het gedeelte
      van het gezamenlijke maximumbedrag, bedoeld in [artikel 4.14a, derde lid, tweede zin, van de wet][ref1],
      dat meer bedraagt dan het bedrag genoemd in artikel 4.14a, tweede lid, van de wet in het jaar voorafgaand
      aan het kalenderjaar waarin het partnerschap is geëindigd, gelijkelijk verdeeld tussen de belastingplichtige
      en zijn gewezen partner. De eerste zin is niet van toepassing indien, de belastingplichtige dan wel de
      gewezen partner direct na beëindiging van het partnerschap geen aanmerkelijk belang heeft als bedoeld in
      [afdeling 4.3 van de wet][ref2]. In dat geval wordt bedoeld gedeelte van het maximumbedrag toebedeeld aan degene
      die na beëindiging van het partnerschap wel een aanmerkelijk belang heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Afdeling4.3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15ter
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        afdeling: '4.3'
  - number: 15ter.2
    text: |-
      In afwijking van het eerste lid kan een andere onderlinge verdeling worden gekozen, indien de belastingplichtige en
      zijn gewezen partner of de belastingplichtige en de erfgenamen van zijn gewezen partner bij het doen van aangifte
      van de belastingplichtige en van de gewezen partner over het kalenderjaar waarin het partnerschap eindigt kiezen
      voor partnerschap als bedoeld in [artikel 2.17, zevende lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15ter
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 15ter.3
    text: |-
      Indien de belastingplichtige en zijn gewezen partner kiezen voor partnerschap als bedoeld in
      [artikel 2.17, zevende lid, van de wet][ref1], worden de belastingplichtige en zijn gewezen partner ook voor de
      toepassing van [artikel 4.14a van de wet][ref2], geacht het gehele kalenderjaar elkaars partner te zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15ter
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 15ter.4
    text: |-
      Indien het partnerschap eindigt door emigratie van de belastingplichtige of van zijn partner kan in afwijking van
      het eerste en tweede lid, indien de belastingplichtige en zijn gewezen partner daar schriftelijk om verzoeken, een
      andere onderlinge verdeling worden gekozen.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15ter
  - number: 15a.1
    text: |-
      Indien een belastingplichtige krachtens een in het derde lid omschreven titel aandelen of winstbewijzen verkrijgt
      van een niet in Nederland wonend natuurlijk persoon en eerder ter zake van die aandelen of winstbewijzen een
      conserverende belastingaanslag is opgelegd waarvoor nog uitstel van betaling loopt, wordt ten aanzien van de
      belastingplichtige de verkrijgingsprijs van die aandelen of winstbewijzen gesteld op de overdrachtsprijs van die
      aandelen of winstbewijzen waarvan is uitgegaan voor die conserverende belastingaanslag, verminderd met:
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15a
