  - number: '1.2'
    text: |-
      Dit besluit verstaat onder wet: de [Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 1a.1
    text: |-
      Een regeling als bedoeld in [artikel 1.7, tweede lid, onderdeel b, van de wet][ref1], die vrijwillig wordt
      voortgezet nadat de arbeidsverhouding op grond waarvan deelneming aan die pensioenregeling was verplicht is
      geëindigd, wordt, onder door Onze Minister te stellen voorwaarden, als een zodanige pensioenregeling aangemerkt,
      ingeval:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 1a.1.a
    text: de regeling ten hoogste tien jaar vrijwillig wordt voortgezet;
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel1a
  - number: 1a.1.b
    text: |-
      gedurende de vrijwillige voorzetting als pensioengevend inkomen geen hoger bedrag in aanmerking wordt genomen
      dan het gemiddelde pensioengevend inkomen, bedoeld in [artikel 3.18, vierde lid, onderdeel d, van de wet][ref1],
      in de vijf aan het eerste dienstjaar van vrijwillige voortzetting voorafgaande kalenderjaren, voor zover de
      belastingplichtige in die jaren heeft deelgenomen aan de pensioenregeling;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 1a.1.c
    text: |-
      onverminderd onderdeel b vanaf het vierde kalenderjaar van vrijwillige voortzetting als pensioengevend inkomen
      geen hoger bedrag in aanmerking wordt genomen dan het gezamenlijke bedrag van het pensioengevend inkomen,
      bedoeld in [artikel 3.18, vierde lid, onderdeel d, van de wet][ref1], vermeerderd met het belastbare loon, het
      belastbare resultaat uit overige werkzaamheden en de belastbare periodieke uitkeringen en verstrekkingen van de
      belastingplichtige in het derde kalenderjaar voorafgaande aan het betreffende dienstjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 1a.2
    text: |-
      Ingeval de arbeidsverhouding, bedoeld in het eerste lid, is geëindigd als gevolg van arbeidsongeschiktheid, is het
      eerste lid, onderdelen a en c, niet van toepassing zolang een inkomensvervangende arbeidsongeschiktheidsuitkering
      wordt ontvangen.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel1a
  - number: '11.1'
    text: |-
      Partieel buitenlandse belastingplichtigen die van buiten Nederland in dienstbetrekking worden genomen als bedoeld
      in [hoofdstuk 4A van het Uitvoeringsbesluit loonbelasting 1965][ref1] kunnen gedurende de looptijd, bedoeld
      in [artikel 10e, tweede lid, onderdeel d, van het Uitvoeringsbesluit loonbelasting 1965][ref2], kiezen voor
      toepassing van de regels van de [hoofdstukken 4][ref3] en [5 van de Wet inkomstenbelasting 2001][ref4] zoals
      die volgens [hoofdstuk 7 van die wet][ref5] gelden voor buitenlandse belastingplichtigen (partieel buitenlandse
      belastingplicht). Een keuze voor partieel buitenlandse belastingplicht geldt voor het gehele kalenderjaar, maar ten
      hoogste tot het einde van de looptijd, bedoeld in de eerste zin.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Hoofdstuk4a
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel10e
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002489
        hoofdstuk: 4a
      - id: ref2
        bwb_id: BWBR0002489
        artikel: 10e
      - id: ref3
        bwb_id: BWBR0011353
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0011353
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0011353
        hoofdstuk: '7'
  - number: '11.2'
    text: De in het eerste lid genoemde keuze kan worden gemaakt en herzien zolang de aanslag niet onherroepelijk vaststaat.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11
  - number: 11bis.1
    text: |-
      Indien de belastingplichtige een vermogensbestanddeel dat ingevolge
      [artikel 2.14, derde lid, onderdeel d, van de wet][ref1] tevens in aanmerking wordt genomen bij de bepaling van
      het belastbare inkomen uit sparen en beleggen, niet als zodanig in de aangifte heeft vermeld, is hij gehouden
      daarvan schriftelijk mededeling aan de inspecteur te doen voordat de belastingplichtige weet of redelijkerwijs moet
      vermoeden dat de inspecteur met de desbetreffende onjuistheid of onvolledigheid bekend is of zal worden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11bis
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 11bis.2
    text: |-
      Het niet of niet tijdig dan wel onjuist of onvolledig doen van de mededeling, bedoeld in het eerste lid, wordt
      aangemerkt als een overtreding.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11bis
  - number: 11bis.3
    text: |-
      De bevoegdheid tot het opleggen van een vergrijpboete in de gevallen, bedoeld in het tweede lid,
      vervalt door verloop van vijf jaren na afloop van het kalenderjaar waarin de peildatum, bedoeld in
      [artikel 2.14, derde lid, onderdeel d, van de wet][ref1], is gelegen. Indien het vermogensbestanddeel, bedoeld in
      het eerste lid, in het buitenland wordt gehouden of is opgekomen vervalt de bevoegdheid tot het opleggen van een
      vergrijpboete in de gevallen, bedoeld in het tweede lid, in afwijking in zoverre van de eerste volzin, door verloop
      van twaalf jaren na afloop van het kalenderjaar, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11bis
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 11a.1
    text: |-
      Op verzoek van de belastingplichtige blijven buiten aanmerking de voordelen uit bosbedrijf welke worden
      behaald door onmiddellijk voorafgaande aan het tijdstip met ingang waarvan op hem de vrijstelling van
      [artikel 3.11, eerste lid, van de wet][ref1] van toepassing wordt de tot het bosbedrijf behorende bezittingen te
      stellen op de waarde in het economische verkeer. De vorige volzin is slechts van toepassing indien artikel 3.11,
      eerste lid, van de wet met ingang van een jaar van toepassing wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 11a.2
    text: |-
      De inspecteur stelt het bedrag dat ingevolge het eerste lid buiten aanmerking blijft bij voor bezwaar vatbare
      beschikking vast.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11a
  - number: 11a.3
    text: |-
      De voordelen die ingevolge het eerste lid buiten aanmerking blijven, worden alsnog als winst uit onderneming in
      aanmerking genomen – met dien verstande dat [artikel 3.11, eerste lid, van de wet][ref1] op die voordelen niet
      van toepassing is – indien de belastingplichtige binnen vijf jaren na het tijdstip waarop de in het eerste lid
      bedoelde vrijstelling op hem van toepassing is geworden, het bosbedrijf of een gedeelte van het bosbedrijf – anders
      dan ten gevolge van overlijden of onteigening, daaronder begrepen minnelijke onteigening en verkoop ter voorkoming
      van onteigening – staakt. In geval van staking van een gedeelte van het bosbedrijf worden de in de vorige volzin
      bedoelde voordelen slechts in aanmerking genomen voorzover deze betrekking hebben op dit gedeelte. De voordelen
      worden geacht te zijn genoten ten tijde van de staking.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 11a.4
    text: |-
      Voor de toepassing van het derde lid wordt niet als een staking aangemerkt een overdracht aan een persoon als
      bedoeld in [artikel 3.63, vierde of vijfde lid, van de wet][ref1] mits zowel de belastingplichtige als degene aan
      wie is overgedragen dit schriftelijk verzoekt. Alsdan wordt degene aan wie is overgedragen voor de toepassing van
      het derde lid geacht in de plaats te zijn getreden van de belastingplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 11b
    text: |-
      Voor de overeenkomstige toepassing, bedoeld in [artikel 3.18, vijfde lid, onderdeel a, van de wet][ref1],
      van [artikel 18a, eerste lid en derde lid, vijfde zin, van de Wet op de loonbelasting 1964][ref2] zijn de
      [artikelen 10][ref3] en [10aa van het Uitvoeringsbesluit loonbelasting 1965][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0002489#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002489#Artikel10aa
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18a
      - id: ref3
        bwb_id: BWBR0002489
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0002489
        artikel: 10aa
  - number: 11c.1
    text: |-
      Ingeval een belastingplichtige op jaarbasis minder dan 1.750 uren besteedt aan werkzaamheden
      op grond waarvan hij verplicht deelneemt aan een pensioenregeling als bedoeld in
      [artikel 1.7, tweede lid, onderdeel b, van de wet][ref1], wordt voor de overeenkomstige toepassing, bedoeld
      in [artikel 3.18, vijfde lid, onderdeel a, van de wet][ref2], van de [artikelen 18a, derde lid][ref3], en
      [18ga, eerste lid, van de Wet op de loonbelasting 1964][ref4] het aldaar bedoelde bedrag vermenigvuldigd met de
      deeltijdfactor.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel18ga
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18a
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 18ga
  - number: 11c.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder deeltijdfactor verstaan: een breuk waarvan de teller wordt
      gevormd door het aantal uren dat de belastingplichtige op jaarbasis besteedt aan werkzaamheden op grond waarvan hij
      deelneemt aan een pensioenregeling als bedoeld in [artikel 1.7, tweede lid, onderdeel b, van de wet][ref1] en de
      noemer door 1.750, waarbij de uitkomst ten hoogste 1 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 11c.3
    text: |-
      Ingeval een belastingplichtige in een kalenderjaar dat is gelegen in de periode die aanvangt tien jaar
      direct voorafgaand aan de in de pensioenregeling vastgestelde ingangsdatum ten opzichte van het laatste
      kalenderjaar van de periode die direct voorafgaat aan de eerstgenoemde periode ten hoogste 50% minder uren
      per jaar besteedt aan werkzaamheden op grond waarvan hij deelneemt aan een pensioenregeling als bedoeld in
      [artikel 1.7, tweede lid, onderdeel b, van de wet][ref1], mag als pensioengevend inkomen worden aangemerkt: het
      pensioengevend inkomen, bedoeld in [artikel 3.18, vierde lid, onderdeel d, van de wet][ref2], vermenigvuldigd
      met de verhouding tussen de deeltijdfactor van het laatstgenoemde kalenderjaar en de deeltijdfactor van het
      eerstgenoemde kalenderjaar. Ingeval de vorige volzin toepassing vindt, wordt voor de toepassing van het eerste
      lid als deeltijdfactor in aanmerking genomen: de deeltijdfactor van het in de eerste volzin als tweede genoemde
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 11c.4
    text: |-
      Indien de werkzaamheden, bedoeld in het eerste lid, zijn onderbroken vanwege zwangerschap of bevalling van
      de belastingplichtige, worden deze tijdens de periode die overeenkomt met de periode van zwangerschaps- en
      bevallingsverlof voor vrouwelijke werknemers, voor de bepaling van het aantal gewerkte uren, bedoeld in het tweede
      lid, geacht niet te zijn onderbroken.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11c
  - number: 11d.1
    text: |-
      Ingeval het pensioengevend inkomen, bedoeld in [artikel 3.18, vierde lid, onderdeel d, van de wet][ref1], is
      verlaagd als gevolg van ziekte, arbeidsongeschiktheid of een periode van zwangerschap of bevalling overeenkomstig
      de periode van zwangerschaps- en bevallingsverlof voor vrouwelijke werknemers wordt met het pensioengevend inkomen
      gelijkgesteld: het gemiddelde pensioengevend inkomen, bedoeld in artikel 3.18, vierde lid, onderdeel d, van de wet,
      van de belastingplichtige in de ten hoogste vijf kalenderjaren voorafgaande aan die ziekte, arbeidsongeschiktheid
      of periode van afwezigheid wegens zwangerschap of bevalling, voor zover de belastingplichtige in die jaren heeft
      deelgenomen aan een pensioenregeling als bedoeld in [artikel 1.7, tweede lid, onderdeel b, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 11d.2
    text: |-
      Het ingevolge het eerste lid vastgestelde pensioengevend inkomen mag gedurende de periode van ziekte,
      arbeidsongeschiktheid, zwangerschapsverlof of bevallingsverlof worden geïndexeerd met de loonindex in de
      bedrijfstak waarin de werknemer werkzaam is, dan wel met de gemiddelde loonindex voor de CAO-lonen per maand,
      inclusief bijzondere beloningen, zoals berekend door het Centraal Bureau voor de Statistiek.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11d
  - number: 11e.1
    text: |-
      Gedurende ten hoogste de eerste drie jaar waarin de belastingplichtige anders dan als werknemer deelneemt aan
      een pensioenregeling op grond van de [Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref1],
      de [Wet op het notarisambt][ref2] of de [Wet verplichte beroepspensioenregeling][ref3] wordt met pensioengevend
      inkomen als bedoeld in [artikel 3.18, vierde lid, onderdeel d, van de wet][ref4] gelijkgesteld: een schatting van
      de belastingplichtige van zijn pensioengevend inkomen in het betreffende jaar van deelname.


      [ref1]: https://wetten.overheid.nl/BWBR0012092
      [ref2]: https://wetten.overheid.nl/BWBR0010388
      [ref3]: https://wetten.overheid.nl/BWBR0018831
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0012092
      - id: ref2
        bwb_id: BWBR0010388
      - id: ref3
        bwb_id: BWBR0018831
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 11e.2
    text: |-
      Ingeval de belastingplichtige ter zake van de schatting, bedoeld in het eerste lid, te kwader trouw is, is
      het eerste lid niet van toepassing en wordt het pensioengevend inkomen gesteld op de in het dienstjaar genoten
      winst uit onderneming vóór toevoeging aan en afneming van de oudedagsreserve en vóór de ondernemersaftrek en
      vermeerderd met de ten laste van de winst gebrachte premies uit hoofde van een pensioenregeling als bedoeld in
      [artikel 1.7, tweede lid, onderdeel b, van de wet][ref1], waarbij het pensioengevend inkomen ten minste wordt
      gesteld op nihil. [Artikel 3.95, eerste lid, tweede volzin, van de wet][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 11f.1
    text: |-
      Voor de toepassing van [artikel 3.18 van de wet][ref1] wordt met laatstgenoten pensioengevend loon als bedoeld
      in de [artikelen 18b][ref2] en [18c van de Wet op de loonbelasting 1964][ref3] gelijkgesteld: laatstgenoten
      pensioengevend inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18b
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18c
  - number: 11f.2
    text: |-
      Onder laatstgenoten pensioengevend inkomen als bedoeld in het eerste lid wordt verstaan: het gemiddelde van het
      pensioengevend inkomen, bedoeld in [artikel 3.18, vierde lid, onderdeel d, van de wet][ref1], van de deelnemer of
      gewezen deelnemer in de ten hoogste vijf kalenderjaren voorafgaande aan het kalenderjaar van zijn overlijden, voor
      zover de deelnemer of gewezen deelnemer in die jaren heeft deelgenomen aan een pensioenregeling als bedoeld in
      [artikel 1.7, tweede lid, onderdeel b, van de we][ref2]t.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 11g
    text: |-
      Voor de overeenkomstige toepassing, bedoeld in [artikel 3.18, vijfde lid, onderdeel f, van de wet][ref1],
      van [artikel 19a, eerste lid, onderdeel d, van de Wet op de loonbelasting 1964][ref2]
      wordt voor «de belasting die is verschuldigd door toepassing van [artikel 19b][ref3], ofwel
      [artikel 3.83, eerste of tweede lid][ref4], [artikel 3.136, derde, vierde of vijfde lid][ref5], of
      [artikel 7.2, achtste lid, van de Wet inkomstenbelasting 2001][ref6]» gelezen: de belasting die is verschuldigd
      door toepassing van de [artikelen 3.135][ref7], 3.136, eerste tot en met vijfde lid, of 7.2, tweede lid, van de
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel11g
