  - number: 21bis.1
    text: |-
      Als kwalificerende buitenlandse belastingplichtige als bedoeld in [artikel 7.8 van de wet][ref1] wordt mede
      aangemerkt een buitenlandse belastingplichtige die:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel21bis
    references:
