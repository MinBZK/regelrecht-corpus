  - number: '21.7'
    text: |-
      Het vierde tot en met zesde lid is ook van toepassing indien het betreft een kwijtschelding van een conserverende
      belastingaanslag of een beëindiging van het uitstel van betaling van een conserverende belastingaanslag waarvan
      het uitstel van betaling krachtens [artikel 25, achtste lid, onderdeel a, van de Invorderingswet 1990][ref1] is
      voortgezet bij de vervreemding aan de belastingplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel21
