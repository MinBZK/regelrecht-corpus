  - number: '22.3'
    text: |-
      Als gegevens en inlichtingen als bedoeld in [artikel 10.8, eerste lid, van de wet][ref1] worden mede aangewezen
      de naam, het adres en de geboortedatum van de belastingplichtige op wie de gegevens, bedoeld in het tweede lid,
      betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '22.4'
    text: |-
      Onder rente als bedoeld in het tweede lid, onderdelen a, b en c, wordt verstaan: hetgeen tussen de geldgever en de
      geldnemer is overeengekomen als vergoeding voor het gedurende de looptijd van de geldlening ter beschikking stellen
      van de hoofdsom.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22
  - number: '22.5'
    text: |-
      Een administratieplichtige is gehouden de gegevens en inlichtingen te verstrekken op de door de inspecteur
      voorgeschreven wijze en met een door de inspecteur voorgeschreven frequentie. De gegevens en inlichtingen dienen
      uiterlijk te worden verstrekt:
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22
  - number: 22.5.a
    text: |-
      indien de inspecteur maandelijkse aanlevering voorschrijft: de laatste dag van de kalendermaand volgend op de
      kalendermaand waarop de gegevens en inlichtingen betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22
  - number: 22.5.b
    text: |-
      indien de inspecteur jaarlijkse aanlevering gedurende het kalenderjaar waarop de gegevens en inlichtingen
      betrekking hebben voorschrijft: 30 april van dat kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22
  - number: 22.5.c
    text: |-
      indien de inspecteur jaarlijkse aanlevering na afloop van het kalenderjaar waarop de gegevens en inlichtingen
      betrekking hebben voorschrijft: 31 januari volgend op dat kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22
  - number: '22.6'
    text: 'Een administratieplichtige kan de verstrekking van gegevens en inlichtingen achterwege laten indien:'
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22
  - number: 22.6.a
    text: |-
      naar het oordeel van de inspecteur het belang van ontvangst van de gegevens en inlichtingen niet opweegt tegen de
      inspanning tot verstrekking daarvan door de administratieplichtige;
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22
  - number: 22.6.b
    text: |-
      naar het oordeel van de inspecteur de administratieplichtige tijdelijk niet in staat is de gegevens en
      inlichtingen te verstrekken of niet in de gelegenheid is tijdig de gegevens en inlichtingen te verstrekken en de
      administratieplichtige met de inspecteur een tijdstip is overeengekomen waarop hij geacht wordt daartoe wel weer in
      staat onderscheidenlijk in de gelegenheid te zijn;
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22
  - number: 22.6.c
    text: |-
      de waarde in het economische verkeer van het recht, bedoeld in het tweede lid, onderdelen h en i, onder 1°, lager
      is dan het bedrag, genoemd in [artikel 5.10, onderdeel a, van de wet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 22.6.d
    text: |-
      de gegevens of inlichtingen door de inspecteur zijn aangewezen als van verstrekking vrijgestelde gegevens en
      inlichtingen en aan de voor die vrijstelling verbonden voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22
  - number: 22a.1
    text: |-
      Als administratieplichtigen als bedoeld in [artikel 10.8, eerste lid, van de wet][ref1] worden mede aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: 22a.1.a
    text: |-
      inhoudingsplichtigen als bedoeld in de [Wet op de loonbelasting 1964][ref1] die een of meer betalingen doen aan een
      natuurlijk persoon inzake voor de inhoudingsplichtige of een met de inhoudingsplichtige verbonden vennootschap als
      bedoeld in [artikel 10a, zevende lid, van die wet][ref2] verrichte werkzaamheden en diensten;


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 10a
  - number: 22a.1.b
    text: |-
      collectieve beheersorganisaties als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______________________ die een of meer betalingen doen aan een natuurlijk persoon als rechthebbende in de zin van
      artikel 1, onderdeel h, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel1
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: '1'
  - number: 22a.2
    text: 'Onder een betaling als bedoeld in het eerste lid wordt niet verstaan een betaling aan een natuurlijk persoon die:'
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22a
  - number: 22a.2.a
    text: |-
      de werkzaamheden en diensten heeft verricht als werknemer, artiest of beroepssporter
      als bedoeld in de [Wet op de loonbelasting 1964][ref1], als persoon als bedoeld in
      [artikel 5a, eerste lid, aanhef en onderdeel a, of tweede lid, aanhef en onderdeel b, van die wet][ref2],
      als lid van een buitenlands gezelschap als bedoeld in die wet of als persoon als bedoeld in
      [artikel 5b, eerste lid, aanhef en onder 2°, van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 5a
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 5b
  - number: 22a.2.b
    text: |-
      de werkzaamheden heeft verricht als vrijwilliger als bedoeld in
      [artikel 2, zesde lid, tweede zin, van de Wet op de loonbelasting 1964][ref1] en de van de administratieplichtige,
      bedoeld in het eerste lid, ontvangen vergoedingen en verstrekkingen gezamenlijk niet hoger zijn dan de
      maximumbedragen, bedoeld in artikel 2, zesde lid, eerste zin, van de Wet op de loonbelasting 1964;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
  - number: 22a.2.c
    text: |-
      ter zake van de werkzaamheden een factuur heeft uitgereikt als bedoeld in
      [artikel 34c, eerste lid, van de Wet op de omzetbelasting 1968][ref1] met daarop de vermelding van de
      omzetbelasting, bedoeld in [artikel 35a, eerste lid, onderdeel j, van die wet][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel35a
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34c
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 35a
  - number: 22a.2.d
    text: |-
      een betaling als bedoeld in het eerste lid, onderdeel b, heeft ontvangen als erfgerechtigde tot de inkomsten uit
      een auteursrecht of naburig recht als bedoeld in dat onderdeel.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22a
  - number: 22a.3
    text: |-
      Als gegevens en inlichtingen als bedoeld in [artikel 10.8, eerste lid, van de wet][ref1] worden met betrekking tot
      de betalingen, bedoeld in het eerste lid, aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: 22a.3.a
    text: de naam, het adres en de geboortedatum van de ontvanger van de betaling;
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22a
  - number: 22a.3.b
    text: de in het kalenderjaar betaalde bedragen, daaronder begrepen kostenvergoedingen.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22a
  - number: 22a.4
    text: |-
      Een administratieplichtige als bedoeld in het eerste lid is gehouden de gegevens en inlichtingen te verstrekken
      op de door de inspecteur voorgeschreven wijze. De gegevens en inlichtingen dienen jaarlijks na afloop van het
      kalenderjaar waarop de gegevens en inlichtingen betrekking hebben te worden verstrekt op uiterlijk 31 januari
      volgend op dat kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22a
  - number: 22a.5
    text: |-
      De inspecteur kan de administratieplichtige de mogelijkheid bieden de gegevens en inlichtingen in afwijking van het
      vierde lid gedurende het kalenderjaar waarop de gegevens en inlichtingen betrekking hebben te verstrekken.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22a
  - number: 22a.6
    text: |-
      [Artikel 22, zesde lid, aanhef en onderdelen a, b en d][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012066#Artikel22
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0012066
        artikel: '22'
        hoofdstuk: '8'
  - number: '23.1'
    text: |-
      De werkzaamheden, rechten en verplichtingen van een naamloze vennootschap of besloten vennootschap met
      beperkte aansprakelijkheid welker bezittingen uitsluitend of hoofdzakelijk bestaan uit op de voet van
      [artikel 2 van de Natuurschoonwet 1928][ref1] als landgoed aangemerkte onroerende zaken, worden voor de heffing van
      de inkomstenbelasting beschouwd als werkzaamheden, rechten en verplichtingen van haar gezamenlijke aandeelhouders,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel2
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '2'
  - number: 23.1.a
    text: |-
      de werkzaamheden van de vennootschap uitsluitend of hoofdzakelijk bestaan uit de instandhouding van onroerende
      zaken die zijn aangemerkt als landgoederen in de zin van [artikel 1 van de Natuurschoonwet 1928][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '1'
  - number: 23.1.b
    text: alle aandeelhouders natuurlijke personen zijn;
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel23
  - number: 23.1.c
    text: het aantal aandeelhouders niet meer dan twintig bedraagt.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel23
  - number: '23.2'
    text: |-
      Ingeval niet langer aan de voorwaarden, genoemd in het eerste lid, wordt voldaan, blijft dat lid buiten toepassing
      met ingang van het kalenderjaar waarin de vervulling van die voorwaarden een einde heeft genomen.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel23
  - number: '23.3'
    text: |-
      Voor de toepassing van het eerste lid worden rechtspersonen die zich uitsluitend of hoofdzakelijk het behoud van
      natuurschoon ten doel stellen, met natuurlijke personen gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel23
  - number: '23.4'
    text: |-
      De voorwaarde, genoemd in het eerste lid, onderdeel c, is niet van toepassing, voorzover de toeneming van het
      aantal aandeelhouders boven twintig is toe te schrijven aan vererving of schenking of aan ontbinding van een
      huwelijksgemeenschap.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel23
  - number: '24'
    text: |-
      [Artikel 11a, vierde lid][ref1], is van overeenkomstige toepassing op een overdracht in het kalenderjaar 2001
      waarop [hoofdstuk 2, artikel I, onderdeel Db, van de Invoeringswet Wet inkomstenbelasting 2001](onbekend) van
      toepassing is mits zowel door de ondernemer als degene die de onderneming voortzet, bij de aangifte van de
      ondernemer is verzocht om toepassing van dat onderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0012066#Artikel11a
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012066
        artikel: 11a
        hoofdstuk: '3'
  - number: '25.1'
    text: |-
      Indien op grond van [artikel 26, tweede lid, van de Invorderingswet 1990][ref1], zoals dat op 14 september 2015
      luidde, aan een belastingplichtige ter zake van geconserveerd inkomen uit tot een aanmerkelijk belang behorende
      aandelen of winstbewijzen kwijtschelding van belasting is verleend wegens het verstrijken van de termijn,
      bedoeld in dat lid, of indien ter zake van de vervreemding van tot een aanmerkelijk belang behorende aandelen
      of winstbewijzen aan de belastingplichtige ten aanzien van de overdrager een conserverende belastingaanslag is
      opgelegd en met betrekking tot die belastingaanslag krachtens artikel 26, tweede lid, van de Invorderingswet
      1990, zoals dat op 14 september 2015 luidde, kwijtschelding van belasting is verleend wegens het verstrijken van
      de termijn, bedoeld in dat lid, wordt ten aanzien van de belastingplichtige de in [artikel 7.6 van de wet][ref2]
      bedoelde verkrijgingsprijs van die aandelen of winstbewijzen verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
  - number: 25.1.a
    text: |-
      ingeval geen kwijtschelding van belasting is verleend wegens genoten reguliere voordelen op die aandelen of
      winstbewijzen: een bedrag gelijk aan het bedrag dat is kwijtgescholden aan belasting voor zover die kwijtschelding
      toerekenbaar is aan die aandelen of winstbewijzen, vermenigvuldigd met:
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25
  - number: 25.1.a.1°
    text: |-
      het quotiënt van 100% en het in de vierde kolom van de in [artikel 2.12 van de wet][ref1] opgenomen tabel als
      eerste vermelde percentage, voor zover het bedrag van de kwijtschelding niet meer bedraagt dan het in de eerste en
      tweede kolom van die tabel vermelde bedrag; en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 25.1.a.2°
    text: |-
      het quotiënt van 100% en het in de vierde kolom van die tabel als tweede vermelde percentage, voor zover het bedrag
      van de kwijtschelding meer bedraagt dan het in de eerste en tweede kolom van die tabel vermelde bedrag.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25
  - number: 25.1.b
    text: |-
      ingeval wel kwijtschelding van belasting is verleend wegens genoten reguliere voordelen op die aandelen of
      winstbewijzen: een bedrag gelijk aan het verschil tussen het bedrag dat zou zijn kwijtgescholden indien onderdeel a
      toepassing zou hebben gevonden, vermenigvuldigd met:
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25
  - number: 25.1.b.1°
    text: |-
      het quotiënt van 100% en het in de vierde kolom van de in [artikel 2.12 van de wet][ref1] opgenomen tabel als
      eerste vermelde percentage, voor zover het bedrag dat zou zijn kwijtgescholden niet meer bedraagt dan het in de
      eerste en tweede kolom van die tabel vermelde bedrag; en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 25.1.b.2°
    text: |-
      het quotiënt van 100% en het in de vierde kolom van die tabel als tweede vermelde percentage, voor zover het bedrag
      dat zou zijn kwijtgescholden meer bedraagt dan het in de eerste en tweede kolom van die tabel vermelde bedrag; en
      de eerdere vermindering van de verkrijgingsprijs ingevolge de kwijtschelding wegens de genoten reguliere voordelen
      op die aandelen of winstbewijzen.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25
  - number: '25.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot een kwijtschelding van
      belasting ter zake van een conserverende belastingaanslag waarvan het uitstel van betaling krachtens
      [artikel 25, achtste lid, onderdeel a, van de Invorderingswet 1990][ref1] is voortgezet bij de vervreemding van tot
      een aanmerkelijk belang behorende aandelen of winstbewijzen aan de belastingplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: '25.3'
    text: 'Voor de toepassing van dit besluit worden:'
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25
  - number: 25.3.a
    text: |-
      met [artikel 4.16, eerste lid, onderdeel h, van de wet][ref1] gelijkgesteld: artikel 20a, zesde lid, onderdeel i,
      van de Wet op de inkomstenbelasting 1964 zoals dat artikelonderdeel luidde op 31 december 2000;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 25.3.b
    text: |-
      met [artikel 4.18 van de wet][ref1] gelijkgesteld: artikel 20a, achtste lid, van de Wet op de inkomstenbelasting
      1964 zoals dat artikelonderdeel luidde op 31 december 2000;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 25.3.c
    text: |-
      met [artikel 7.5, zevende lid, van de wet][ref1] gelijkgesteld: artikel 49, vijfde lid, van de Wet op de
      inkomstenbelasting 1964 zoals dat artikelonderdeel luidde op 31 december 2000;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
  - number: 25.3.d
    text: |-
      met [artikel 25, achtste lid, van de Invorderingswet 1990][ref1] gelijkgesteld: artikel 25, zesde lid, van de
      Invorderingswet 1990 zoals dat artikelonderdeel luidde op 31 december 2000;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 25.3.e
    text: |-
      met [artikel 26, tweede, vierde of vijfde lid, aanhef en onderdeel a, van de Invorderingswet 1990][ref1]
      gelijkgesteld: artikel 26, derde lid, van de Invorderingswet 1990, zoals dat luidde op 10 maart 2004 en artikel 26,
      tweede lid, van de Invorderingswet 1990 zoals dat luidde op 31 december 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
  - number: 25a.1
    text: |-
      [Artikel 1a, eerste lid][ref1], is van overeenkomstige toepassing op de beëindiging van deelname aan een
      pensioenregeling als bedoeld in [artikel 150a van de Pensioenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012066#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150a
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0012066
        artikel: 1a
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 150a
  - number: 25a.2
    text: |-
      [Artikel 11e][ref1] is van overeenkomstige toepassing op de deelname aan een pensioenregeling als bedoeld in
      [artikel 150a van de Pensioenwet][ref2], met dien verstande dat dit alleen geldt voor het eerste jaar van deelname.


      [ref1]: https://wetten.overheid.nl/BWBR0012066#Artikel11e
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150a
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0012066
        artikel: 11e
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 150a
  - number: 25b
    text: |-
      In afwijking van [artikel 1a, eerste lid, onderdeel a][ref1], geldt voor de toepassing van artikel 1a, eerste
      lid, onderdeel a, een termijn van vijftien jaar indien de arbeidsverhouding op grond waarvan de deelneming aan
      een pensioenregeling als bedoeld in [artikel 1.7, tweede lid, onderdeel b, van de wet][ref2], was verplicht, is
      geëindigd voor het tijdstip van inwerkingtreding van de Wet toekomst pensioenen en voor zover gedurende de periode
      van vrijwillige voortzetting winst uit onderneming wordt genoten als bedoeld in [artikel 3.8 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012066#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0012066
        artikel: 1a
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '26'
    text: Dit besluit treedt in werking met ingang van 1 januari 2001.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel26
  - number: '27'
    text: 'Dit besluit wordt aangehaald als: Uitvoeringsbesluit inkomstenbelasting 2001.'
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel27
