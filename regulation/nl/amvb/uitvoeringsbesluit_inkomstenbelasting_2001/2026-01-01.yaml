      [artikel 65l van de Wet op de arbeidsongeschiktheidsverzekering][ref2],
      [artikel 67i van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3],
      [artikel 3:75 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref4] en
      [artikel XXXIIID van het Belastingplan 2014][ref5].


