        artikel: '25'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
  - number: 21.3.a
    text: |-
      het quotiënt van 100% en het in de vierde kolom van de in [artikel 2.12 van de wet][ref1] opgenomen tabel als
      eerste vermelde percentage, voor zover het bedrag waarvoor het uitstel van betaling is beëindigd niet meer bedraagt
