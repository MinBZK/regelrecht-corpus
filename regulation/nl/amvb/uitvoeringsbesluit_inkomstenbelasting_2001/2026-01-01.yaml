        artikel: '2'
  - number: 21.2.b
    text: |-
      het quotiënt van 100% en het in de vierde kolom van die tabel als tweede vermelde percentage, voor zover het bedrag
      dat zal worden kwijtgescholden meer bedraagt dan het in de eerste en tweede kolom van die tabel vermelde bedrag.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel21
  - number: '21.3'
    text: |-
      Indien op grond van [artikel 25, achtste lid, onderdeel b, van de Invorderingswet 1990][ref1] bij een
      belastingplichtige ter zake van geconserveerd inkomen uit tot een aanmerkelijk belang behorende aandelen of
      winstbewijzen het uitstel van betaling voor de verschuldigde belasting is beëindigd, wordt ten aanzien van hem de
      in [artikel 7.6 van de wet][ref2] bedoelde verkrijgingsprijs van die aandelen of winstbewijzen verminderd met een
      bedrag gelijk aan het bedrag waarvoor het uitstel van betaling is beëindigd, vermenigvuldigd met:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel21
    references:
