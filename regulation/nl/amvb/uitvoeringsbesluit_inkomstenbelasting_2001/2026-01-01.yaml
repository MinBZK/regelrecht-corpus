  - number: '15.2'
    text: |-
      In afwijking van het eerste lid verstrekt de verzekeraar van een pensioen als bedoeld in
      [artikel 1.7, tweede lid, onderdelen a en b, van de wet][ref1] aan de belastingplichtige die met toepassing van
      [artikel 38r van de Wet op de loonbelasting 1964][ref2] pensioen opbouwt een opgave van het bedrag van de in het
      voorafgaande kalenderjaar in de pensioenregeling van de belastingplichtige ingelegde premies voor ouderdomspensioen
      en partnerpensioen bij overlijden op of na pensioendatum als bedoeld in de [artikelen 18a, eerste lid][ref3], en
      [38r, eerste lid, van de Wet op de loonbelasting 1964][ref4] voor zover dit bedrag het gevolg is van de toeneming
      van de diensttijd in dat voorafgaande kalenderjaar waarbij de aan het voorafgaande kalenderjaar toe te rekenen
      premies worden bepaald overeenkomstig [artikel 10a.25, tweede lid, van de wet][ref5], exclusief de premies voor
      een nettopensioen als bedoeld in [artikel 5.17, tweede lid, van de wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel38r
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel38r
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel10a
      [ref6]: https://wetten.overheid.nl/BWBR0011353#Artikel5
