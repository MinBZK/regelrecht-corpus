    text: |-
      het in de vierde kolom van de in [artikel 2.12 van de wet][ref1] opgenomen tabel als eerste vermelde percentage,
      voor zover het bedrag van de kwijtschelding niet meer bedraagt dan het in de eerste en tweede kolom van die tabel
      vermelde bedrag; en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 16.10.c.2°
    text: |-
      het in de vierde kolom van die tabel als tweede vermelde percentage, voor zover het bedrag van de kwijtschelding
      meer bedraagt dan het in de eerste en tweede kolom van die tabel vermelde bedrag; en
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
  - number: 16.10.d
    text: |-
      de reguliere voordelen die ingevolge [artikel 4.12a van de wet][ref1] niet tot het inkomen uit aanmerkelijk
      belang zijn gerekend voor zover deze voordelen toerekenbaar zijn aan de aandelen of winstbewijzen die de
      belastingplichtige heeft, en vermeerderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 16.10.e
    text: |-
      de waardeaangroei van de aandelen of winstbewijzen in de periode dat de belastingplichtige ter zake van die
      aandelen of winstbewijzen belastbaar inkomen uit aanmerkelijk belang als bedoeld in [afdeling 7.3 van de wet][ref1]
      genoot, voor zover blijkt dat de belastingplichtige hierover een naar het inkomen geheven belasting heeft betaald
      die naar Nederlandse maatstaven redelijk is, en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling7.3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '7.3'
  - number: 16.10.f
    text: |-
      de waardeaangroei van de aandelen of winstbewijzen bij de belastingplichtige in de periode dat hij niet
      in Nederland belastingplichtig was, voor zover blijkt dat de aangroei in die periode is ontstaan en deze
      waardeaangroei nog niet is begrepen in de vermeerdering van de verkrijgingsprijs ingevolge dit lid, onderdeel e, en
      verminderd met:
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
  - number: 16.10.g
    text: |-
      de waardedaling van de aandelen of winstbewijzen bij de belastingplichtige in de periode dat hij niet in Nederland
      belastingplichtig was, voor zover blijkt dat de waardedaling in die periode is ontstaan.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
  - number: '16.11'
    text: |-
      Indien de belastingplichtige een aanmerkelijk belang in een vennootschap heeft die middellijk of onmiddellijk
      aandelen in of winstbewijzen van een in Nederland gevestigde vennootschap heeft en deze aandelen of winstbewijzen,
      al dan niet rechtstreeks, zijn verkregen van de belastingplichtige bij wie die aandelen of winstbewijzen tot
      een aanmerkelijk belang behoorden, wordt de verkrijgingsprijs volgens [artikel 4.21 van de wet][ref1] van het
      eerstbedoelde aanmerkelijk belang verminderd met een bedrag, waarbij deze vermindering kan leiden tot een negatieve
      verkrijgingsprijs; de vermindering is gelijk aan het bedrag waarmee op het tijdstip van bedoelde verkrijging
      door de vennootschap de waarde in het economische verkeer van de door de vennootschap van de belastingplichtige
      verkregen aandelen of winstbewijzen de verkrijgingsprijs volgens artikel 4.21 van de wet van de belastingplichtige
      van die aandelen of winstbewijzen overtreft. De eerste volzin is niet van toepassing voorzover in Nederland
      inkomstenbelasting of in een ander land naar het inkomen geheven belasting is betaald over de waardeaangroei van
      laatstgenoemde aandelen of winstbewijzen die naar Nederlandse maatstaven redelijk is. Voor de berekening van de in
      het slot van de eerste volzin bedoelde vermindering, wordt de verkrijgingsprijs van de door de belastingplichtige
      aan de vennootschap vervreemde aandelen of winstbewijzen vermeerderd met de waardeaangroei, bedoeld in het derde
      lid, tot op het tijdstip van de in het slot van de in de eerste volzin bedoelde verkrijging door die vennootschap
      onderscheidenlijk verminderd met de waardedaling als bedoeld in het vierde lid tot op het tijdstip van die
      verkrijging.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '17'
    text: |-
      Onder natuurterreinen als bedoeld in [artikel 5.7 van de wet][ref1] worden verstaan heidevelden, hoogveenterreinen,
      zandverstuivingen, duinterreinen, kwelders, schorren, gorzen, slikken, riet- en ruigtlanden, laagveenmoerassen,
      voorzover deze terreinen geen landbouwgronden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 17a.1
    text: |-
      De waarde, bedoeld in [artikel 5.20, derde lid, van de wet][ref1], wordt gesteld op de op grond van artikel
      5.20, eerste en tweede lid, van de wet, in aanmerking te nemen waarde (WOZ-waarde) vermenigvuldigd met de
      leegwaarderatio.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 17a.2
    text: |-
      Bij een voor het enkele gebruik van de woning verschuldigde jaarlijkse huur of pacht als percentage van de WOZ-
      waarde van:







