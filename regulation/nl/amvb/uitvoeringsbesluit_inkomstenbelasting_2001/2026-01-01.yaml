  - number: 12bis.1
    text: |-
      Het afgeven van de verklaring uitsluitend zakelijk gebruik bestelauto, bedoeld in
      [artikel 3.20, zesde lid, van de wet][ref1], geschiedt door het duidelijk, stellig en zonder voorbehoud invullen
      van het daartoe langs elektronische weg ter beschikking gestelde modelformulier en het toezenden van het ingevulde
      modelformulier aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel12bis
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 12bis.2
    text: |-
      De belastingplichtige is gehouden voordat met de bestelauto waarop de verklaring, bedoeld in het eerste lid,
      betrekking heeft voor privédoeleinden wordt gereden, mede te delen dat hij de verklaring intrekt.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel12bis
  - number: 12bis.3
    text: |-
      De mededeling, bedoeld in het tweede lid, geschiedt door het toezenden van het daartoe langs elektronische weg ter
      beschikking gestelde modelformulier aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel12bis
  - number: 12bis.4
    text: |-
      Het niet of niet tijdig doen van de mededeling, bedoeld in het tweede lid, en het niet doen van die mededeling op
      de in het derde lid voorgeschreven wijze worden aangemerkt als een overtreding.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel12bis
  - number: 12bis.5
    text: |-
      De bevoegdheid tot het opleggen van een vergrijpboete in de gevallen, bedoeld in het vierde lid, vervalt door
      verloop van vijf jaren na afloop van het kalenderjaar waarin de verplichting tot het doen van de mededeling,
      bedoeld in het tweede lid, is ontstaan.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel12bis
  - number: 12a
    text: |-
      Als nationale regelgeving die leidt tot herstructurering of beëindiging van een bedrijfstak als bedoeld in
      [artikel 3.54, twaalfde lid, onderdeel c, van de wet][ref1] wordt aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 12a.a
    text: |-
      de [Wet verbod pelsdierhouderij][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032739
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0032739
  - number: 12a.b
    text: |-
      de [Subsidieregeling sanering varkenshouderijen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0042634
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel12a
    references:
