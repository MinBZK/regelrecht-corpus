      vermelde bedrag.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel21
  - number: '21.4'
    text: |-
      Indien ter zake van de vervreemding van tot een aanmerkelijk belang behorende aandelen of winstbewijzen aan de
      belastingplichtige ten aanzien van de overdrager een conserverende belastingaanslag is opgelegd en met betrekking
      tot die belastingaanslag krachtens [artikel 26, vierde lid, van de Invorderingswet 1990][ref1] kwijtschelding
      van belasting is verleend wegens in Nederland verschuldigde dividend- of inkomstenbelasting ter zake van nadien
      door de belastingplichtige genoten reguliere voordelen uit die aandelen of winstbewijzen, wordt ten aanzien
      van de belastingplichtige de in [artikel 7.6 van de wet][ref2] bedoelde verkrijgingsprijs van deze aandelen of
      winstbewijzen verminderd met een bedrag gelijk aan het bedrag van die reguliere voordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
  - number: '21.5'
    text: |-
      Indien ter zake van de vervreemding van tot een aanmerkelijk belang behorende aandelen of
      winstbewijzen aan de belastingplichtige ten aanzien van de overdrager een conserverende
      belastingaanslag is opgelegd en met betrekking tot die belastingaanslag krachtens
      [artikel 26, vijfde lid, aanhef en onderdeel a, van de Invorderingswet 1990][ref1] kwijtschelding van belasting
      zal worden verleend wegens een vervreemding van tot dat belang behorende aandelen of winstbewijzen door de
      belastingplichtige tegen een lagere waarde dan waarvan is uitgegaan voor die conserverende belastingaanslag, wordt
      ten aanzien van de belastingplichtige de in [artikel 7.6 van de wet][ref2] bedoelde verkrijgingsprijs van deze
      vervreemde aandelen of winstbewijzen verminderd met een bedrag gelijk aan het bedrag dat zal worden kwijtgescholden
      aan belasting, vermenigvuldigd met:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel21
