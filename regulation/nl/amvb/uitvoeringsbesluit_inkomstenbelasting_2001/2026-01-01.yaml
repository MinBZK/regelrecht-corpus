        bwb_id: BWBR0011353
        artikel: '7'
  - number: 21bis.1.a
    text: 'pensioen, lijfrente of een soortgelijke uitkering geniet:'
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel21bis
  - number: 21bis.1.b
    text: |-
      voldoet aan de voorwaarden, bedoeld in de aanhef en het slot van de eerste volzin van
      [artikel 7.8, zesde lid, van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel21bis
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
  - number: 21bis.1.c
    text: |-
      aannemelijk maakt dat hij wegens de geringe hoogte van zijn inkomen in het woonland geen inkomstenbelasting is
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel21bis
  - number: 21bis.2
    text: |-
      Een buitenlandse belastingplichtige die in een kalenderjaar voldoet aan de voorwaarden, bedoeld in onderdeel a
      of onderdeel b en het slot van de eerste volzin van [artikel 7.8, zesde lid, van de wet][ref1], en die gedurende
      een deel van dat kalenderjaar als inwoner van een andere lidstaat van de Europese Unie, een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, Zwitserland of de BES eilanden in de
      belastingheffing van die staat of op de BES eilanden wordt betrokken, wordt voor dat deel van het kalenderjaar
      aangemerkt als kwalificerende buitenlandse belastingplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel21bis
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
  - number: 21bis.3
    text: |-
      Voor de inkomensverklaring, bedoeld in [artikel 7.8, zesde lid, van de wet][ref1], wordt gebruikgemaakt van een
      door de inspecteur vastgestelde modelverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel21bis
    references:
