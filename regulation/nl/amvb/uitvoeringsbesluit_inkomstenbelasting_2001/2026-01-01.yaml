  - number: '15.3'
    text: |-
      Voor de toepassing van de [artikelen 3.127, eerste en vierde lid][ref1], en
      [10a.25, eerste en tweede lid, van de wet][ref2] verstrekt de verzekeraar van een nettopensioen, bedoeld
      in [artikel 5.17, tweede lid, onderdeel c, van de wet][ref3], aan de belastingplichtige een opgave van het
      gezamenlijke bedrag van de door de belastingplichtige in het voorafgaande kalenderjaar voor een nettopensioen als
      bedoeld in artikel 5.17, tweede lid, van de wet betaalde of verrekende premies.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012066/2026-01-01#Artikel15
    references:
