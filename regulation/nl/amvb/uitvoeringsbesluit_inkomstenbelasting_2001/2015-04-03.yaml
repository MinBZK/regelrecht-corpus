        artikel: '7'
  - number: 21a
    text: |-
      Als voorheffing worden aangewezen door Andorra, British Virgin Islands, Curaçao, Guernsey, Isle of Man, Jersey,
      Liechtenstein, Monaco, San Marino, Turks and Caicos Islands, Sint Maarten en Zwitserland geheven bronbelasting over
      een uit die mogendheid als uiteindelijk gerechtigde als bedoeld in artikel 2 van de Richtlijn 2003/48/EG van de
      Raad van 3 juni 2003 betreffende belastingheffing op inkomsten uit spaargelden in de vorm van rentebetaling (PbEU
      2003, L 157), genoten rentebetaling, mits de bronbelasting vergelijkbaar is met die in artikel 11 van die richtlijn
      en de rentebetaling valt onder de begripsomschrijving van artikel 6 van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel21a
  - number: '22.1'
    text: |-
      Als administratieplichtigen als bedoeld in [artikel 10.8, eerste lid, van de wet][ref1]
      worden aangewezen: banken, beheerders, beleggingsinstellingen, beleggingsondernemingen,
      betaaldienstverleners, elektronischgeldinstellingen, financiële instellingen, levensverzekeraars en
      schadeverzekeraars in de zin van de [Wet op het financieel toezicht][ref2] alsmede pensioenuitvoerders
      in de zin van [artikel 1 van de Pensioenwet][ref3], pensioenuitvoerders in de zin van
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref4] en de Stichting Notarieel Pensioenfonds, bedoeld in
      [artikel 113a van de Wet op het notarisambt][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020368
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel1
