    text: |-
      ingeval wel kwijtschelding van belasting is verleend wegens genoten reguliere voordelen op die aandelen of
      winstbewijzen: een bedrag gelijk aan het verschil tussen vier maal het bedrag dat zou zijn kwijtgescholden indien
      onderdeel a toepassing zou hebben gevonden en de eerdere vermindering van de verkrijgingsprijs ingevolge de
      kwijtschelding wegens de genoten reguliere voordelen op de bedoelde aandelen of winstbewijzen.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel21
  - number: '21.7'
    text: |-
      Het vierde tot en met zesde lid is ook van toepassing indien het betreft een
      kwijtschelding van een conserverende aanslag waarvan het uitstel van betaling krachtens
      [artikel 25, achtste lid, onderdeel a, van de Invorderingswet 1990][ref1] is voortgezet bij de vervreemding aan
      de belastingplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: '21.8'
    text: |-
      Voor de toepassing van dit artikel wordt met
      [artikel 26, tweede, vierde of vijfde lid, aanhef en onderdeel a, van de Invorderingswet 1990][ref1] gelijkgesteld
      artikel 26, derde lid, en artikel 26, tweede lid, van de Invorderingswet 1990 zoals deze artikelonderdelen
      achtereenvolgens luidden op 10 maart 2004, respectievelijk 31 december 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel21
    references:
