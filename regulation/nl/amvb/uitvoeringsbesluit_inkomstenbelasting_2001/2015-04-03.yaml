    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel12a
  - number: '13'
    text: |-
      De waarde in het economische verkeer van opgebouwde aanspraken uit een pensioenregeling als bedoeld in
      [artikel 3.83 van de wet][ref1] wordt gesteld op de bedragen die bij een derde zouden moeten worden gestort ten
      einde de aanspraken te dekken.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '14.1'
    text: |-
      Als een lichaam dat bevoegd het verzekeringsbedrijf uitoefent als bedoeld in
      [artikel 3.126, eerste lid, onderdeel d, van de wet][ref1] kan door Onze Minister worden aangewezen een verzekeraar
      die op grond van de [Wet op het financieel toezicht][ref2] bevoegd is diensten naar Nederland te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
  - number: '14.2'
    text: |-
      Als een pensioenfonds als bedoeld in [artikel 3.126, eerste lid, onderdeel d, van de wet][ref1] kan door
      Onze Minister worden aangewezen een lichaam dat naar het recht van de staat van diens zetel bevoegd gelden
      beheert strekkende tot verzekering van pensioenaanspraken van tenminste 100 deelnemers of gewezen deelnemers
      en dat in aanvulling op of ter voortzetting van die pensioenaanspraken vanuit een vestiging buiten Nederland
      lijfrenteovereenkomsten sluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '14.3'
    text: |-
      Alvorens tot een aanwijzing wordt overgegaan, dient de verzekeraar, onderscheidenlijk het pensioenfonds zich
      tegenover Onze Minister, onder door hem te stellen voorwaarden, te verplichten om met betrekking tot de bij deze
      verzekeraar of dit fonds verzekerde en nog te verzekeren lijfrenten, bedoeld in [artikel 3.124 van de wet][ref1],
      inlichtingen te verstrekken over de uitvoering van de lijfrenteovereenkomsten en een in Nederland uitwinbare
      zekerheid jegens de ontvanger te stellen voor de invordering van de belasting die mocht worden verschuldigd door
      toepassing van de [artikelen 3.133][ref2], [3.135][ref3] of [3.136 van de wet][ref4]. In afwijking van de eerste
      volzin behoeft een in een van de lidstaten van de Europese Unie of in een bij ministeriële regeling aangewezen
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte gevestigde verzekeraar
      of gevestigd pensioenfonds jegens de ontvanger geen in Nederland uitwinbare zekerheid te stellen indien deze
      verzekeraar of dit pensioenfonds, onder door Onze Minister te stellen voorwaarden, ingevolge een overeenkomst met
      de ontvanger aansprakelijkheid aanvaardt voor de in die volzin bedoelde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '14.4'
    text: |-
      De aanwijzing kan eveneens plaatsvinden indien de in het derde lid bedoelde zekerheid niet door de verzekeraar
      of het pensioenfonds maar door de belastingplichtige wordt gesteld, waarbij de belastingplichtige tevens de
      mogelijkheid heeft zekerheid te stellen door middel van verpanding van de aanspraken uit de lijfrenteovereenkomst
      aan de ontvanger, mits de verzekeraar of het pensioenfonds instemt met deze verpanding.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel14
  - number: '14.5'
    text: |-
      De aanwijzing kan door Onze Minister worden ingetrokken wanneer de verzekeraar of het pensioenfonds niet meer aan
      de verplichtingen met betrekking tot het verschaffen van inlichtingen of het stellen van zekerheid voldoet of niet
      aan een juiste wijze van uitvoering van een verpanding of van de in het derde lid bedoelde overeenkomst inzake
      aansprakelijkheid meewerkt.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel14
  - number: '14.6'
    text: |-
      Indien de aanwijzing wordt ingetrokken, worden bij de verzekeringnemers van de bij deze verzekeraar of dit
      pensioenfonds gesloten lijfrenteovereenkomsten, dan wel indien een verzekeringnemer is overleden, bij de
      gerechtigden tot de lijfrenten, geen negatieve uitgaven voor inkomensvoorzieningen in aanmerking genomen indien de
      lijfrenten onder door Onze Minister te stellen voorwaarden alsnog overgaan op een toegelaten aanbieder als bedoeld
      in [artikel 3.126, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '14.7'
    text: |-
      Onze Minister maakt het aanwijzen als een lichaam als bedoeld in het eerste lid, dan wel het aanwijzen als een
      pensioenfonds als bedoeld in het tweede lid, op een daartoe geschikte wijze publiek bekend. Indien Onze Minister
      een aanwijzing intrekt, maakt hij die intrekking ook op een daartoe geschikte wijze publiek bekend.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel14
  - number: 14a.1
    text: |-
      Als een onderneming of instelling die bevoegd als bank of als beheerder van een beleggingsinstelling optreedt als
      bedoeld in [artikel 3.126a, tweede lid, onderdeel c, van de wet][ref1] kan door Onze Minister worden aangewezen
      een onderneming of instelling die op grond van de [Wet op het financieel toezicht][ref2] bevoegd is diensten naar
      Nederland te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
  - number: 14a.2
    text: |-
      Alvorens tot een aanwijzing wordt overgegaan, dient de onderneming of instelling zich tegenover Onze Minister,
      onder door hem te stellen voorwaarden, te verplichten om met betrekking tot de bij deze onderneming of instelling
      aangehouden lijfrentespaarrekeningen, onderscheidenlijk met betrekking tot de door deze onderneming of instelling
      beheerde lijfrentebeleggingsrechten, bedoeld in [artikel 3.126a van de wet][ref1], inlichtingen te verstrekken
      over de uitvoering van de overeenkomsten en een in Nederland uitwinbare zekerheid jegens de ontvanger te stellen
      voor de invordering van de belasting die mocht worden verschuldigd door toepassing van de [artikelen 3.133][ref2],
      [3.135][ref3] of [3.136 van de wet][ref4]. In afwijking van de eerste volzin behoeft een in een van de lidstaten
      van de Europese Unie of in een bij ministeriële regeling aangewezen staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte gevestigde onderneming of instelling jegens de ontvanger geen in
      Nederland uitwinbare zekerheid te stellen indien deze onderneming of instelling, onder door Onze Minister te
      stellen voorwaarden, ingevolge een overeenkomst met de ontvanger aansprakelijkheid aanvaardt voor de in die volzin
      bedoelde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 14a.3
    text: |-
      De aanwijzing kan eveneens plaatsvinden indien de in het tweede lid bedoelde zekerheid niet door de onderneming
      of instelling maar door de belastingplichtige wordt gesteld, waarbij de belastingplichtige tevens de
      mogelijkheid heeft zekerheid te stellen door middel van verpanding van de aanspraken op het tegoed van een
      lijfrentespaarrekening, onderscheidenlijk van de aanspraken op de waarde van een lijfrentebeleggingsrecht aan de
      ontvanger, mits de onderneming of instelling instemt met deze verpanding.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel14a
  - number: 14a.4
    text: |-
      [Artikel 14, vijfde, zesde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012066#Artikel14
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0012066
        artikel: '14'
        hoofdstuk: '3'
  - number: '15.1'
    text: |-
      Voor de toepassing van [artikel 3.127, eerste en vierde lid, van de wet][ref1], verstrekt de verzekeraar van een
      pensioen als bedoeld in [artikel 1.7, tweede lid, onderdelen a en b, van de wet][ref2] aan de belastingplichtige
      een opgave van de aan het voorafgaande kalenderjaar toe te rekenen aangroei van het bedrag van de jaarlijkse
      uitkeringen van de aan hem toekomende aanspraken die recht geven op een levenslange inkomensvoorziening
      bij ouderdom, voor zover deze aangroei het gevolg is van de toeneming van de diensttijd in dat voorafgaande
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '1'
  - number: '15.2'
    text: |-
      De aan het voorafgaande kalenderjaar toe te rekenen pensioenaangroei, bedoeld in het eerste lid, wordt bepaald als
      volgt en vervolgens vermenigvuldigd met 37/40:
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15
  - number: 15.2.a
    text: |-
      bij een aan een beschikbare premie gerelateerde levenslange inkomensvoorziening bij ouderdom: door de op het
      voorafgaande kalenderjaar betrekking hebbende premies te vermenigvuldigen met de volgende factor:






                        *Indien de belastingplichtige bij het begin van het voorafgaande kalenderjaar*


                        *factor*






                        15 jaar of ouder, doch jonger dan 20 jaar is


                        0,43




                        20 jaar of ouder, doch jonger dan 25 jaar is


                        0,36




                        25 jaar of ouder, doch jonger dan 30 jaar is


                        0,30




                        30 jaar of ouder, doch jonger dan 35 jaar is


                        0,24




                        35 jaar of ouder, doch jonger dan 40 jaar is


                        0,20




                        40 jaar of ouder, doch jonger dan 45 jaar is


                        0,17




                        45 jaar of ouder, doch jonger dan 50 jaar is


                        0,14




                        50 jaar of ouder, doch jonger dan 55 jaar is


                        0,11




                        55 jaar of ouder, doch jonger dan 60 jaar is


                        0,09




                        60 jaar of ouder is


                        0,08
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15
  - number: 15.2.b
    text: |-
      bij overige aan het inkomen gerelateerde levenslange inkomensvoorzieningen bij ouderdom: door het opbouwpercentage
      van het voorafgaande kalenderjaar van de aan de belastingplichtige toekomende pensioenaanspraken te
      vermenigvuldigen met de pensioengrondslag van het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15
  - number: '15.3'
    text: |-
      De opgave van de pensioenaangroei wordt door de verzekeraar binnen tien maanden na afloop van het kalenderjaar
      waarop de pensioenaangroei betrekking heeft, aan de belastingplichtige verstrekt.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15
  - number: '15.4'
    text: |-
      De pensioengrondslag, bedoeld in het tweede lid, onderdeel b, wordt bepaald door het pensioengevend inkomen van het
      voorafgaande kalenderjaar te verminderen met het in het voorafgaande kalenderjaar ingevolge de pensioenregeling in
      aanmerking genomen bedrag ter zake van uitkeringen als bedoeld in [artikel 9 van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
  - number: '15.5'
    text: |-
      Ingeval het pensioen op grond van de in de pensioenregeling vastgestelde ingangsdatum
      eerder ingaat dan bij het bereiken van de pensioenrichtleeftijd, bedoeld in
      [artikel 18a, zesde lid, van de Wet op de loonbelasting 1964][ref1], en er geen sprake is van een aan een
      beschikbare premie gerelateerde levenslange inkomensvoorziening bij ouderdom, wordt de in het eerste lid bedoelde
      aangroei gesteld op de met toepassing van het tweede lid, onderdeel b, bepaalde aangroei, vermenigvuldigd met de
      volgende factor:






                    *In de pensioenregeling vastgestelde ingangsdatum*


                    *factor*






                    66 jaar of ouder


                    1,9/1,76




                    65 jaar of ouder, doch jonger dan 66 jaar


                    1,9/1,63




                    64 jaar of ouder, doch jonger dan 65 jaar


                    1,9/1,52




                    63 jaar of ouder, doch jonger dan 64 jaar


                    1,9/1,41




                    62 jaar of ouder, doch jonger dan 63 jaar


                    1,9/1,32




                    61 jaar of ouder, doch jonger dan 62 jaar


                    1,9/1,23




                    60 jaar of ouder, doch jonger dan 61 jaar


                    1,9/1,15


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
  - number: 15a.1
    text: |-
      Indien een belastingplichtige krachtens een in het derde lid omschreven titel aandelen of winstbewijzen verkrijgt
      van een niet in Nederland wonend natuurlijk persoon en eerder ter zake van die aandelen of winstbewijzen
      een conserverende aanslag is opgelegd waarvoor nog uitstel van betaling loopt, wordt ten aanzien van de
      belastingplichtige de verkrijgingsprijs van die aandelen of winstbewijzen gesteld op de overdrachtsprijs van die
      aandelen of winstbewijzen waarvan is uitgegaan voor die conserverende aanslag, verminderd met:
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
  - number: 15a.1.a
    text: |-
      vier maal het bedrag waarvoor krachtens [artikel 25, achtste lid, van de Invorderingswet 1990][ref1] nog uitstel
      van betaling loopt voor bedoelde conserverende aanslag voor zover dit uitstel toerekenbaar is aan de aandelen of
      winstbewijzen die de belastingplichtige verkrijgt;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 15a.1.b
    text: |-
      vier maal het bedrag waarvoor krachtens [artikel 26, vierde lid, van de Invorderingswet 1990][ref1] kwijtschelding
      van belasting is verleend op bedoelde conserverende aanslag, voor zover deze kwijtschelding toerekenbaar is aan de
      aandelen of winstbewijzen die de belastingplichtige verkrijgt, en


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
  - number: 15a.1.c
    text: |-
      de reguliere voordelen die ingevolge [artikel 4.12a van de wet][ref1] niet tot het inkomen uit aanmerkelijk
      belang zijn gerekend voor zover deze voordelen toerekenbaar zijn aan de aandelen of winstbewijzen die de
      belastingplichtige verkrijgt, en vermeerderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 15a.1.d
    text: |-
      de waardeaangroei van de aandelen of winstbewijzen bij de niet in Nederland wonend natuurlijk persoon in de periode
      dat die persoon ter zake van die aandelen of winstbewijzen belastbaar inkomen uit aanmerkelijk belang als bedoeld
      in [afdeling 7.3 van de wet][ref1] genoot, voor zover blijkt dat die persoon hierover een naar het inkomen geheven
      belasting heeft betaald die naar Nederlandse maatstaven redelijk is, en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling7.3
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '7.3'
  - number: 15a.1.e
    text: |-
      de waardeaangroei van de aandelen of winstbewijzen bij de niet in Nederland wonend natuurlijk persoon in de periode
      dat die persoon ter zake van die aandelen of winstbewijzen niet in Nederland belastingplichtig was, voor zover
      blijkt dat de aangroei in die periode is ontstaan en deze waardeaangroei nog niet is begrepen in de vermeerdering
      van de verkrijgingsprijs ingevolge dit lid, onderdeel d, en verminderd met:
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
  - number: 15a.1.f
    text: |-
      de waardedaling van de aandelen of winstbewijzen bij de niet in Nederland wonend natuurlijk persoon in de periode
      dat die persoon ter zake van de aandelen of winstbewijzen niet in Nederland belastingplichtig was, voor zover
      blijkt dat de waardedaling in die periode is ontstaan.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
  - number: 15a.2
    text: |-
      Ingeval aan de in het eerste lid bedoelde verkrijging meerdere gebeurtenissen vooraf zijn gegaan ter zake waarvan
      conserverende aanslagen zijn opgelegd waarvan het uitstel van betaling nog loopt, wordt voor de toepassing van
      het eerste lid als uitgangspunt genomen de overdrachtsprijs waarvan is uitgegaan voor de laatste gebeurtenis. Ter
      bepaling van de verkrijgingsprijs wordt deze overdrachtsprijs, verminderd met:
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
  - number: 15a.2.a
    text: |-
      vier maal het bedrag waarvoor krachtens [artikel 25, achtste lid, van de Invorderingswet 1990][ref1] nog uitstel
      van betaling loopt voor bedoelde conserverende aanslagen voor zover dit uitstel toerekenbaar is aan de aandelen of
      winstbewijzen die de belastingplichtige verkrijgt;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 15a.2.b
    text: |-
      vier maal het bedrag waarvoor krachtens [artikel 26, vierde lid, van de Invorderingswet 1990][ref1] kwijtschelding
      van belasting is verleend op bedoelde conserverende aanslagen, voor zover deze kwijtschelding toerekenbaar is aan
      de aandelen of winstbewijzen die de belastingplichtige verkrijgt, en


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
  - number: 15a.2.c
    text: |-
      de reguliere voordelen die ingevolge [artikel 4.12a van de wet][ref1] niet tot het inkomen uit aanmerkelijk
      belang zijn gerekend voor zover deze voordelen toerekenbaar zijn aan de aandelen of winstbewijzen die de
      belastingplichtige verkrijgt, en vermeerderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 15a.2.d
    text: |-
      de waardeaangroei van de aandelen of winstbewijzen bij de niet in Nederland wonende natuurlijke personen in de
      periode dat die personen ter zake van die aandelen of winstbewijzen belastbaar inkomen uit aanmerkelijk belang als
      bedoeld in [afdeling 7.3 van de wet][ref1] hebben genoten, voor zover blijkt dat die personen hierover een naar het
      inkomen geheven belasting hebben betaald die naar Nederlandse maatstaven redelijk is, en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling7.3
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '7.3'
  - number: 15a.2.e
    text: |-
      de waardeaangroei van de aandelen of winstbewijzen bij de niet in Nederland wonende natuurlijke personen in de
      periode dat die personen ter zake van die aandelen of winstbewijzen niet in Nederland belastingplichtig waren,
      voor zover blijkt dat de aangroei in die periode is ontstaan en deze waardeaangroei nog niet is begrepen in de
      vermeerdering van de verkrijgingsprijs ingevolge dit lid, onderdeel d, en verminderd met:
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
  - number: 15a.2.f
    text: |-
      de waardedaling van de aandelen of winstbewijzen bij de niet in Nederland wonende natuurlijke personen in de
      periode dat die personen ter zake van het aanmerkelijk belang niet in Nederland belastingplichtig waren, voor zover
      blijkt dat de waardedaling in die periode is ontstaan.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
  - number: 15a.3
    text: 'Een in het eerste lid bedoelde titel betreft:'
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
  - number: 15a.3.a
    text: een overgang onder algemene titel;
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
  - number: 15a.3.b
    text: een overgang krachtens erfrecht onder bijzondere titel;
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
  - number: 15a.3.c
    text: |-
      een verdeling van een nalatenschap of een huwelijksgemeenschap binnen twee jaren na het overlijden van de erflater,
      respectievelijk na de ontbinding van de huwelijksgemeenschap, of
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
  - number: 15a.3.d
    text: een overdracht krachtens schenking.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
  - number: 15a.4
    text: |-
      Ingeval het eerste lid toepassing heeft gevonden, wordt de in dat lid bedoelde conserverende
      aanslag door de inspecteur verminderd met het bedrag van de belasting waarvoor krachtens
      [artikel 25, achtste lid, van de Invorderingswet 1990][ref1] ter zake van de aldaar bedoelde
      aandelen of winstbewijzen nog uitstel van betaling loopt. Met betrekking tot deze vermindering is
      [artikel 30g, tweede lid, van de Algemene wet inzake rijksbelastingen][ref2] niet van toepassing. Ingeval het
      eerste lid in verbinding met het tweede lid toepassing heeft gevonden, vindt de eerste en tweede volzin toepassing
      met betrekking tot de in het tweede lid bedoelde conserverende aanslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30g
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30g
  - number: 15a.5
    text: |-
      Ingeval het uitstel van betaling op grond van [artikel 25, achtste lid, van de Invorderingswet 1990][ref1] wordt
      voortgezet in situaties waarin aandelen of winstbewijzen die aan het verleende uitstel ten grondslag liggen
      zijn vervangen door andere aandelen of winstbewijzen, worden die andere aandelen of winstbewijzen geacht aan de
      conserverende aanslag ten grondslag te liggen en wordt de overdrachtsprijs van die andere aandelen of winstbewijzen
      gelijk te zijn aan de overdrachtsprijs van de aandelen of winstbewijzen die zijn vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 15a.6
    text: 'Voor de toepassing van dit artikel wordt:'
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
  - number: 15a.6.a
    text: |-
      met [artikel 25, achtste lid, van de Invorderingswet 1990][ref1] gelijkgesteld artikel 25, zesde lid, van de
      Invorderingswet 1990 zoals dat artikelonderdeel luidde op 31 december 2000;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 15a.6.b
    text: |-
      met [artikel 26, vierde lid, van de Invorderingswet 1990][ref1] gelijkgesteld artikel 26, derde lid aanhef en
      onderdeel a, onderscheidenlijk artikel 26, tweede lid, aanhef en onderdeel a, van de Invorderingswet 1990 zoals
      deze artikelonderdelen luidden op 10 maart 2004, onderscheidenlijk 31 december 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
  - number: '16.1'
    text: |-
      Indien een belastingplichtige met een aanmerkelijk belang in Nederland gaat wonen en de vennootschap waarop het
      belang betrekking heeft in Nederland is gevestigd, de belastingplichtige eerder in Nederland heeft gewoond of
      [artikel 7.5, zevende lid, van de wet][ref1] met betrekking tot dat belang is toegepast, wordt de verkrijgingsprijs
      van de tot dat belang behorende aandelen of winstbewijzen gesteld op de verkrijgingsprijs, bedoeld in
      [artikel 4.21 van de wet][ref2], en vervolgens vermeerderd of verminderd zoals in de volgende leden is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '16.2'
    text: |-
      De verkrijgingsprijs volgens [artikel 4.21 van de wet][ref1] wordt vermeerderd met de waardeaangroei van de
      aandelen of winstbewijzen boven die verkrijgingsprijs voorzover blijkt dat de belastingplichtige in verband met het
      gaan wonen in Nederland in het buitenland hierover een naar het inkomen geheven belasting heeft betaald die naar
      Nederlandse maatstaven redelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '16.3'
    text: |-
      De verkrijgingsprijs volgens [artikel 4.21 van de wet][ref1] wordt vermeerderd met de waardeaangroei van de
      aandelen of winstbewijzen boven die verkrijgingsprijs voorzover deze aangroei blijkt te zijn ontstaan in een
      periode dat de belastingplichtige ter zake van die aandelen of winstbewijzen in Nederland niet belastingplichtig
      was en deze waardeaangroei nog niet is begrepen in de vermeerdering van de verkrijgingsprijs ingevolge het tweede
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '16.4'
    text: |-
      De verkrijgingsprijs volgens [artikel 4.21 van de wet][ref1] wordt verminderd met de waardedaling van de aandelen
      of winstbewijzen beneden die verkrijgingsprijs voorzover deze waardedaling is ontstaan in een periode waarin de
      belastingplichtige ter zake van die aandelen of winstbewijzen niet in Nederland belastingplichtig was.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '16.5'
    text: |-
      Indien [artikel 4.16, eerste lid, onderdeel h][ref1], onderscheidenlijk artikel
      [7.5, zevende lid, van de wet][ref2] eerder met betrekking tot het aanmerkelijk belang van toepassing is geweest,
      wordt de aanslag over het jaar bij de vaststelling waarvan een van de genoemde artikelonderdelen van toepassing
      is geweest, verminderd met een bedrag dat overeenkomt met dat gedeelte van de belasting waarvoor krachtens
      [artikel 25, achtste lid, van de Invorderingswet 1990][ref3] nog uitstel van betaling loopt. Met betrekking
      tot deze vermindering is [artikel 30g, tweede lid, van de Algemene wet inzake rijksbelastingen][ref4] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel30g
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 30g
  - number: '16.6'
    text: |-
      De verkrijgingsprijs volgens [artikel 4.21 van de wet][ref1] van de nog tot het aanmerkelijk
      belang behorende aandelen of winstbewijzen wordt vermeerderd met de aan die aandelen of
      winstbewijzen toe te rekenen kosten welke zijn gemaakt voor het stellen van zekerheid als bedoeld in
      [artikel 25, achtste lid, van de Invorderingswet 1990][ref2], tenzij de verkrijgingsprijs op grond van het
      tweede lid reeds is vermeerderd met de waardeaangroei van de aandelen of winstbewijzen die eerder krachtens
      [artikel 4.16, eerste lid, onderdeel h][ref3], onderscheidenlijk [artikel 7.5, zevende lid, van de wet][ref4] tot
      het belastbare inkomen uit aanmerkelijk belang is gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '7'
  - number: '16.7'
    text: |-
      Indien [artikel 4.16, eerste lid, onderdeel h][ref1], onderscheidenlijk artikel [7.5, zevende lid, van de wet][ref2]
      eerder met betrekking tot het aanmerkelijk belang van toepassing is geweest en de belastingplichtige op de aanslag
      bij de vaststelling waarvan een van de genoemde artikelonderdelen van toepassing is geweest betalingen heeft gedaan
      ter voldoening van de ingevolge een van die artikelonderdelen verschuldigde belasting, wordt de verkrijgingsprijs
      volgens [artikel 4.21 van de wet][ref3] van de nog tot het aanmerkelijk belang behorende aandelen of winstbewijzen
      vermeerderd met een bedrag ter grootte van vier maal het bedrag van de op die aandelen of winstbewijzen betrekking
      hebbende betalingen. De eerste volzin is niet van toepassing voorzover de verkrijgingsprijs op grond van het
      tweede lid reeds is vermeerderd met de waardeaangroei van de aandelen of winstbewijzen die eerder krachtens
      [artikel 4.16, eerste lid, onderdeel h][ref4], onderscheidenlijk [artikel 7.5, zevende lid, van de wet][ref5] tot
      het belastbare inkomen uit aanmerkelijk belang is gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel7
