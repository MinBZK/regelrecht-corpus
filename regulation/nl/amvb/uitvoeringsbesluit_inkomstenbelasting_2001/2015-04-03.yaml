  - number: '20.1'
    text: |-
      Voor de toepassing van de [artikelen 6.16][ref1] en [6.25 van de wet][ref2] wordt iemand als ernstig
      gehandicapt beschouwd indien hij gelet op zijn beperkingen aanspraak maakt op opname in een bij of krachtens de
      [Wet langdurige zorg][ref3] geregelde intramurale inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0035917
  - number: '20.2'
    text: |-
      Voor de toepassing van [artikel 6.16 van de wet][ref1] wordt iemand als zorgafhankelijk beschouwd indien hij, zo
      hij niet bij de belastingplichtige zou inwonen, zou zijn aangewezen op beroepsmatige hulp of verzorging in een
      verzorgingsinrichting of verpleeginrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: '21.1'
    text: |-
      Indien op grond van [artikel 26, vierde lid, van de Invorderingswet 1990][ref1] aan een belastingplichtige
      ter zake van geconserveerd inkomen uit tot een aanmerkelijk belang behorende aandelen of winstbewijzen
      kwijtschelding van belasting is verleend wegens in Nederland verschuldigde dividend- of inkomstenbelasting ter
      zake van nadien genoten reguliere voordelen uit die aandelen of winstbewijzen, wordt ten aanzien van hem de in
      [artikel 7.6 van de wet][ref2] bedoelde verkrijgingsprijs van deze aandelen of winstbewijzen verminderd met een
      bedrag gelijk aan het bedrag van die reguliere voordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
  - number: '21.2'
    text: |-
      Indien op grond van [artikel 26, vijfde lid, aanhef en onderdeel a, van de Invorderingswet 1990][ref1] aan een
      belastingplichtige ter zake van geconserveerd inkomen uit tot een aanmerkelijk belang behorende aandelen of
      winstbewijzen kwijtschelding van belasting zal worden verleend wegens een vervreemding van tot dat belang behorende
      aandelen of winstbewijzen tegen een lagere waarde dan waarvan is uitgegaan voor de bepaling van dat geconserveerd
      inkomen, wordt ten aanzien van hem de in [artikel 7.6 van de wet][ref2] bedoelde verkrijgingsprijs van deze
      vervreemde aandelen of winstbewijzen verminderd met een bedrag gelijk aan vier maal het bedrag dat zal worden
      kwijtgescholden aan belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
  - number: '21.3'
    text: |-
      Indien op grond van [artikel 26, tweede lid, van de Invorderingswet 1990][ref1] aan een belastingplichtige ter zake
      van geconserveerd inkomen uit tot een aanmerkelijk belang behorende aandelen of winstbewijzen kwijtschelding van
      belasting is verleend wegens het verstrijken van de termijn bedoeld in dat lid, wordt ten aanzien van hem de in
      [artikel 7.6 van de wet][ref2] bedoelde verkrijgingsprijs van die aandelen of winstbewijzen verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
  - number: 21.3.a
    text: |-
      ingeval geen kwijtschelding van belasting is verleend wegens genoten reguliere voordelen op die aandelen of
      winstbewijzen: een bedrag gelijk aan vier maal het bedrag dat is kwijtgescholden aan belasting voor zover die
      kwijtschelding toerekenbaar is aan bedoelde aandelen of winstbewijzen;
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel21
  - number: 21.3.b
    text: |-
      ingeval wel kwijtschelding van belasting is verleend wegens genoten reguliere voordelen op die aandelen of
      winstbewijzen: een bedrag gelijk aan het verschil tussen vier maal het bedrag dat zou zijn kwijtgescholden indien
      onderdeel a toepassing zou hebben gevonden en de eerdere vermindering van de verkrijgingsprijs ingevolge de
      kwijtschelding wegens de genoten reguliere voordelen op de bedoelde aandelen of winstbewijzen.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel21
  - number: '21.4'
    text: |-
      Indien ter zake van de vervreemding van tot een aanmerkelijk belang behorende aandelen of winstbewijzen aan
      de belastingplichtige ten aanzien van de overdrager een conserverende aanslag is opgelegd en met betrekking
      tot die aanslag krachtens [artikel 26, vierde lid, van de Invorderingswet 1990][ref1] kwijtschelding van
      belasting is verleend wegens in Nederland verschuldigde dividend- of inkomstenbelasting ter zake van nadien
      door de belastingplichtige genoten reguliere voordelen uit die aandelen of winstbewijzen, wordt ten aanzien
      van de belastingplichtige de in [artikel 7.6 van de wet][ref2] bedoelde verkrijgingsprijs van deze aandelen of
      winstbewijzen verminderd met een bedrag gelijk aan het bedrag van die reguliere voordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
  - number: '21.5'
    text: |-
      Indien ter zake van de vervreemding van tot een aanmerkelijk belang behorende aandelen of winstbewijzen aan de
      belastingplichtige ten aanzien van de overdrager een conserverende aanslag is opgelegd en met betrekking tot die
      aanslag krachtens [artikel 26, vijfde lid, aanhef en onderdeel a, van de Invorderingswet 1990][ref1] kwijtschelding
      van belasting zal worden verleend wegens een vervreemding van tot dat belang behorende aandelen of winstbewijzen
      door de belastingplichtige tegen een lagere waarde dan waarvan is uitgegaan voor die conserverende aanslag, wordt
      ten aanzien van de belastingplichtige de in [artikel 7.6 van de wet][ref2] bedoelde verkrijgingsprijs van deze
      vervreemde aandelen of winstbewijzen verminderd met een bedrag gelijk aan vier maal het bedrag dat zal worden
      kwijtgescholden aan belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel21
    references:
