  - number: 17a.1
    text: |-
      De waarde, bedoeld in [artikel 5.20, derde lid, van de wet][ref1], wordt gesteld op de op grond van artikel
      5.20, eerste en tweede lid, van de wet, in aanmerking te nemen waarde (WOZ-waarde) vermenigvuldigd met de
      leegwaarderatio.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel17a
