           De overeenkomstig de eerste volzin vastgestelde waarde kan niet meer bedragen dan het vierentwintigvoud van
      het jaarlijkse bedrag.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel19
  - number: '19.7'
    text: |-
      Een periodieke uitkering in geld, afhankelijk van het leven van één vrouwelijke persoon, wordt gelijkgesteld
      met een periodieke uitkering, afhankelijk van het leven van een mannelijk persoon die vijf jaar jonger is dan
      vorenbedoeld vrouwelijk persoon.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel19
  - number: '19.8'
    text: 'Een periodieke uitkering in geld die vervalt bij het overlijden:'
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel19
  - number: 19.8.a
    text: |-
      van de langstlevende van twee of meer personen, wordt gelijkgesteld met een periodieke uitkering, afhankelijk van
      het leven van een mannelijk persoon, die tien jaar jonger is dan de jongste van de vorenbedoelde personen;
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel19
  - number: 19.8.b
    text: |-
      van de eerststervende van twee of meer personen, wordt gelijkgesteld met een periodieke uitkering, afhankelijk van
      het leven van een mannelijk persoon, die vijf jaar ouder is dan de oudste van de vorenbedoelde personen.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel19
  - number: '19.9'
    text: |-
      Een periodieke uitkering in geld tot een onzeker jaarlijks bedrag wordt gelijkgesteld met een periodieke uitkering
      tot het geschatte gemiddelde jaarlijkse bedrag.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel19
  - number: '19.10'
    text: |-
      Een periodieke uitkering die recht geeft op andere goederen dan geld, wordt gelijkgesteld met een periodieke
      uitkering in geld tot een jaarlijks bedrag, gelijk aan de overeenkomstig [afdeling 5.4 van de wet][ref1] geschatte
      waarde van de goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling5.4
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '5.4'
  - number: '19.11'
    text: |-
      De waarde van een periodieke uitkering die niet valt onder een van de vorige leden, wordt gesteld op het bedrag,
      waarvoor een zodanige uitkering zou kunnen worden aangekocht.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel19
  - number: 19a
    text: |-
      Bij de bepaling van de omvang van hetgeen op de belastingplichtige aan uitgaven voor specifieke zorgkosten drukt
      blijven buiten beschouwing:
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel19a
  - number: 19a.a
    text: |-
      bijzondere bijstand in de zin van [artikel 35, eerste lid, van de Participatiewet][ref1] die, ondanks een aanspraak
      op deze bijzondere bijstand, niet is genoten en niet wordt genoten;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel35
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel19a
    references:
