        artikel: '35'
  - number: 19a.b
    text: |-
      tegemoetkomingen als bedoeld in de [artikelen 2][ref1] en
      [11a van de Wet tegemoetkoming chronisch zieken en gehandicapten][ref2],
      [artikel 63a van de Wet werk en inkomen naar arbeidsvermogen][ref3],
      [artikel 65l van de Wet op de arbeidsongeschiktheidsverzekering][ref4],
      [artikel 67i van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5],
      [artikel 3:75 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref6] en
      [artikel XXXIIID van het Belastingplan 2014][ref7].


