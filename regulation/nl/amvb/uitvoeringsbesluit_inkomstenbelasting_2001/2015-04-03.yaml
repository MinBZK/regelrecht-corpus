           De overeenkomstig de eerste volzin vastgestelde waarde wordt niet hoger gesteld dan de waarde die zou zijn
      verkregen als de uitkering levenslang zou zijn.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel19
  - number: '19.3'
    text: |-
      De waarde van een levenslange periodieke uitkering in geld die nog niet is ingegaan en die van het leven van één
      mannelijke persoon afhankelijk is, wordt vastgesteld overeenkomstig het tweede lid, waarbij voor het aantal jaren
      dat de periodieke uitkering nog niet is ingegaan, het jaarlijkse bedrag op nihil wordt gesteld en na het twaalfde
      vijftal jaren geen jaren meer in aanmerking worden genomen. De aldus vastgestelde waarde wordt niet hoger gesteld
      dan de waarde die zou zijn verkregen als de uitkering reeds ingegaan zou zijn.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel19
  - number: '19.4'
    text: |-
      De waarde van een periodieke uitkering in geld die nog niet is ingegaan, die van het leven van één mannelijke
      persoon afhankelijk is en die na een bepaalde tijd vervalt, wordt vastgesteld overeenkomstig het tweede lid,
      waarbij voor het aantal jaren dat de periodieke uitkering nog niet is ingegaan, het jaarlijkse bedrag op nihil
      wordt gesteld. De aldus vastgestelde waarde wordt niet hoger gesteld dan de waarde die zou zijn verkregen als de
      uitkering reeds ingegaan zou zijn.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel19
  - number: '19.5'
    text: |-
      De waarde van een periodieke uitkering in geld voor onbepaalde tijd, die niet van het leven afhankelijk is, wordt
      gesteld op het vierentwintigvoud van het jaarlijkse bedrag.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel19
  - number: '19.6'
    text: |-
      De waarde van een periodieke uitkering in geld die na een bepaalde tijd vervalt en die niet van het leven
      afhankelijk is, wordt gesteld op het jaarlijkse bedrag, vermenigvuldigd met het aantal jaren gedurende welke de
      uitkering moet plaatshebben, iedere vermenigvuldigingsuitkomst vermenigvuldigd met een van de volgende factoren:







