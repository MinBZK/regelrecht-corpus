    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel17a
  - number: 17a.3
    text: |-
      De jaarlijkse huur of pacht, bedoeld in het tweede lid, wordt gesteld op twaalf maal de maandelijkse huur,
      onderscheidenlijk pacht, zoals die geldt aan het begin van het kalenderjaar. Indien de huurprijs, onderscheidenlijk
      pachtprijs, zoals die tussen gelieerde partijen is overeengekomen zodanig is dat deze tussen willekeurige derden
      niet overeengekomen zou zijn, wordt de huurprijs, onderscheidenlijk pachtprijs, voor de toepassing van het tweede
      lid gesteld op 3,5% van de WOZ-waarde.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel17a
  - number: 17a.4
    text: |-
      Indien de woning een gedeelte van een gebouwd eigendom is als bedoeld in
      [artikel 16, onderdeel c, van de Wet waardering onroerende zaken][ref1], en niet als een afzonderlijke zaak
      vervreemd kan worden, wordt voor de toepassing van het eerste en het tweede lid de WOZ-waarde van die woning
      verlaagd met een bedrag van € 20 000.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 17a.5
    text: |-
      Indien van een woning een gedeelte verhuurd is, wordt slechts de WOZ-waarde van dat deel vermenigvuldigd met de
      leegwaarderatio. Indien de WOZ-waarde van dat deel niet is vastgesteld, wordt deze bepaald door de totale WOZ-
      waarde van de woning te vermenigvuldigen met de verhuurde vierkante meters en te delen door de totale oppervlakte
      van de woning.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel17a
  - number: 17b
    text: |-
      De waarde van een erfpachtcanon als bedoeld in [artikel 5.20, vierde lid, van de wet][ref1] wordt gesteld op het
      zeventienvoud van het jaarlijkse bedrag. In afwijking van de eerste volzin wordt het deel van een erfpachtcanon
      dat kan worden toegerekend aan een verhuurde woning als bedoeld in [artikel 17a, vierde lid][ref2], gesteld op het
      twintigvoud van het jaarlijkse bedrag. De toerekening van de erfpachtcanon, bedoeld in de vorige volzin, geschiedt
      naar rato van de, met inachtneming van artikel 17a, vierde lid, berekende, WOZ-waarden van de te onderscheiden
      zelfstandige onderdelen van het gebouwd eigendom waarop de erfpachtcanon betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012066#Artikel17a
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel17b
    references:
