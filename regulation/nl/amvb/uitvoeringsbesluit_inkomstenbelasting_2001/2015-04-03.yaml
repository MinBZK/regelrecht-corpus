  - number: 11g
    text: |-
      Voor de overeenkomstige toepassing, bedoeld in [artikel 3.18, vijfde lid, onderdeel f, van de wet][ref1],
      van [artikel 19a, eerste lid, onderdeel f, van de Wet op de loonbelasting 1964][ref2]
      wordt voor «de belasting die is verschuldigd door toepassing van [artikel 19b][ref3], ofwel
      [artikel 3.83, eerste of tweede lid][ref4], [artikel 3.136, derde, vierde of vijfde lid][ref5], of
      [artikel 7.2, achtste lid, van de Wet inkomstenbelasting 2001][ref6]» gelezen: de belasting die is verschuldigd
      door toepassing van de [artikelen 3.135][ref7], 3.136, eerste tot en met vijfde lid, of 7.2, tweede lid, van de
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
