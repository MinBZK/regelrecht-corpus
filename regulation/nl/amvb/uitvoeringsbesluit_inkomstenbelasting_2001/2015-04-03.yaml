        artikel: '26'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
  - number: '21.6'
    text: |-
      Indien ter zake van de vervreemding van tot een aanmerkelijk belang behorende aandelen of winstbewijzen aan de
      belastingplichtige ten aanzien van de overdrager een conserverende aanslag is opgelegd en met betrekking tot die
      aanslag krachtens [artikel 26, tweede lid, van de Invorderingswet 1990][ref1] kwijtschelding van belasting is
      verleend wegens het verstrijken van de termijn bedoeld in dat lid, wordt ten aanzien van de belastingplichtige de
      in [artikel 7.6 van de wet][ref2] bedoelde verkrijgingsprijs van die aandelen of winstbewijzen verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
