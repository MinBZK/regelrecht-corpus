  - number: '16.8'
    text: |-
      Indien [artikel 4.16, eerste lid, onderdeel h][ref1], onderscheidenlijk artikel
      [7.5, zevende lid, van de wet][ref2] eerder met betrekking tot het aanmerkelijk belang van toepassing is
      geweest en daarbij sprake was van een negatief vervreemdingsvoordeel, wordt de verkrijgingsprijs volgens artikel
      [4.21 van de wet][ref3] van de nog tot het aanmerkelijk belang behorende aandelen of winstbewijzen verminderd met
      het aan die aandelen of winstbewijzen toe te rekenen negatieve vervreemdingsvoordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '16.9'
    text: |-
      Indien de belastingplichtige een aanmerkelijk belang in een niet in Nederland gevestigde vennootschap
      heeft en [artikel 4.16, eerste lid, onderdeel h, van de wet][ref1] ten aanzien van dat belang krachtens
      [artikel 4.18 van de wet][ref2] niet is toegepast toen hij Nederland verliet, wordt de verkrijgingsprijs van die
      aandelen of winstbewijzen in afwijking van de voorgaande leden gesteld op de waarde in het economische verkeer op
      het tijdstip waarop de belastingplichtige weer in Nederland is gaan wonen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '16.10'
    text: |-
      Indien de belastingplichtige een aanmerkelijk belang in een in Nederland gevestigde vennootschap heeft en daartoe
      aandelen of winstbewijzen behoren die hij krachtens huwelijksvermogensrecht, erfrecht, de verdeling van een
      nalatenschap of huwelijksgemeenschap, of gift heeft verkregen in een periode dat hij niet in Nederland woonachtig
      was en ten aanzien van degene van wie hij de aandelen of winstbewijzen heeft verkregen ter zake van deze overgang
      een conserverende aanslag is opgelegd waarvoor op het tijdstip dat de belastingplichtige in Nederland gaat wonen
      nog uitstel van betaling loopt, wordt ten aanzien van de belastingplichtige de verkrijgingsprijs van deze aandelen
      of winstbewijzen gesteld op de overdrachtsprijs van die aandelen of winstbewijzen waarvan is uitgegaan voor die
      conserverende aanslag, verminderd met:
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
  - number: 16.10.a
    text: |-
      vier maal het bedrag waarvoor krachtens [artikel 25, achtste lid, van de Invorderingswet 1990][ref1] nog uitstel
      van betaling loopt voor bedoelde conserverende aanslag voor zover dit uitstel toerekenbaar is aan de aandelen of
      winstbewijzen die de belastingplichtige heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 16.10.b
    text: |-
      vier maal het bedrag waarvoor krachtens [artikel 26, vierde lid, van de Invorderingswet 1990][ref1] kwijtschelding
      van belasting is verleend op bedoelde conserverende aanslag, voor zover deze kwijtschelding toerekenbaar is aan de
      aandelen of winstbewijzen die de belastingplichtige heeft, en


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
  - number: 16.10.c
    text: |-
      de reguliere voordelen die ingevolge [artikel 4.12a van de wet][ref1] niet tot het inkomen uit aanmerkelijk
      belang zijn gerekend voor zover deze voordelen toerekenbaar zijn aan de aandelen of winstbewijzen die de
      belastingplichtige heeft, en vermeerderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 16.10.d
    text: |-
      de waardeaangroei van de aandelen of winstbewijzen in de periode dat de belastingplichtige ter zake van die
      aandelen of winstbewijzen belastbaar inkomen uit aanmerkelijk belang als bedoeld in [afdeling 7.3 van de wet][ref1]
      genoot, voor zover blijkt dat de belastingplichtige hierover een naar het inkomen geheven belasting heeft betaald
      die naar Nederlandse maatstaven redelijk is, en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling7.3
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '7.3'
  - number: 16.10.e
    text: |-
      de waardeaangroei van de aandelen of winstbewijzen bij de belastingplichtige in de periode dat hij niet
      in Nederland belastingplichtig was, voor zover blijkt dat de aangroei in die periode is ontstaan en deze
      waardeaangroei nog niet is begrepen in de vermeerdering van de verkrijgingsprijs ingevolge dit lid, onderdeel d, en
      verminderd met:
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
  - number: 16.10.f
    text: |-
      de waardedaling van de aandelen of winstbewijzen bij de belastingplichtige in de periode dat hij niet in Nederland
      belastingplichtig was, voor zover blijkt dat de waardedaling in die periode is ontstaan.
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
  - number: '16.11'
    text: |-
      Indien de belastingplichtige een aanmerkelijk belang in een vennootschap heeft die middellijk of onmiddellijk
      aandelen in of winstbewijzen van een in Nederland gevestigde vennootschap heeft en deze aandelen of winstbewijzen,
      al dan niet rechtstreeks, zijn verkregen van de belastingplichtige bij wie die aandelen of winstbewijzen tot
      een aanmerkelijk belang behoorden, wordt de verkrijgingsprijs volgens [artikel 4.21 van de wet][ref1] van het
      eerstbedoelde aanmerkelijk belang verminderd met een bedrag, waarbij deze vermindering kan leiden tot een negatieve
      verkrijgingsprijs; de vermindering is gelijk aan het bedrag waarmee op het tijdstip van bedoelde verkrijging
      door de vennootschap de waarde in het economische verkeer van de door de vennootschap van de belastingplichtige
      verkregen aandelen of winstbewijzen de verkrijgingsprijs van de belastingplichtige van die aandelen of
      winstbewijzen overtreft. De eerste volzin is niet van toepassing voorzover in Nederland inkomstenbelasting of in
      een ander land naar het inkomen geheven belasting is betaald over de waardeaangroei van laatstgenoemde aandelen
      of winstbewijzen die naar Nederlandse maatstaven redelijk is. Voor de berekening van de in het slot van de eerste
      volzin bedoelde vermindering, wordt de verkrijgingsprijs van de door de belastingplichtige aan de vennootschap
      vervreemde aandelen of winstbewijzen vermeerderd met de waardeaangroei, bedoeld in het derde lid, tot op het
      tijdstip van de in het slot van de in de eerste volzin bedoelde verkrijging door die vennootschap onderscheidenlijk
      verminderd met de waardedaling als bedoeld in het vierde lid tot op het tijdstip van die verkrijging.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '16.12'
    text: |-
      Voor de toepassing van het eerste tot en met het elfde lid worden met de
      [artikelen 4.16, eerste lid, onderdeel h][ref1], [7.5, zevende lid][ref2], en [4.18 van de wet][ref3]
      achtereenvolgens gelijkgesteld de artikelen 20a, zesde lid, onderdeel i, 49, vijfde lid, en 20a, achtste
      lid, van de Wet op de inkomstenbelasting 1964 zoals deze artikelonderdelen luidden op 31 december
      2000. Met [artikel 25, achtste lid, van de Invorderingswet 1990][ref4] wordt gelijkgesteld artikel
      25, zesde lid, van de Invorderingswet 1990 zoals dat artikelonderdeel luidde op 31 december 2000. Met
      [artikel 26, vierde lid, van de Invorderingswet 1990][ref5] worden gelijkgesteld artikel 26, derde lid, aanhef
      en onderdeel a, en artikel 26, tweede lid, aanhef en onderdeel a, van de Invorderingswet 1990 zoals deze
      artikelonderdelen achtereenvolgens luidden op 10 maart 2004, respectievelijk 31 december 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0012066/2015-04-03#Artikel16
