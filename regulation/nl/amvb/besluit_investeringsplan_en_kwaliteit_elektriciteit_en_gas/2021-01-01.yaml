  - number: 4a.4.2.a
    text: |-
      de uitvalsituatie betrekking heeft op een gesloten schakelinstallatie ten tijde van reparatie, modificatie
      en vervanging van dit onderdeel van het net en leidt tot een onderbreking van transport van elektriciteit van
      maximaal:
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.4
  - number: 4a.4.2.a.1°
    text: 100 MW gedurende ten hoogste 48 uur, voor zover het transport ten behoeve van verbruik betreft, of
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.4
  - number: 4a.4.2.a.2°
    text: |-
      500 MW gedurende 48 uur, voor zover het transport ten behoeve van rechtstreeks op de schakelinstallatie
      aangesloten, dan wel op het onderliggende net met een spanningsniveau van hoger dan 1 kV of lager dan 110 kV
      aangesloten productie betreft;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.4
  - number: 4a.4.2.b
    text: |-
      de uitvalsituatie betrekking heeft op een gasdrukpijpkabel of een oliedrukkabel ten tijde van reparatie,
