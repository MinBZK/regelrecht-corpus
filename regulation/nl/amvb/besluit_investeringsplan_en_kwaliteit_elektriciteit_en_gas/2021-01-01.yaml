        artikel: '1'
      - id: ref6
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 2.1.1
    text: 'Een netbeheerder, met uitzondering van de netbeheerder van het net op zee beschrijft in zijn investeringsplan:'
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.1
  - number: 2.1.1.a
    text: |-
      de voortgang en de realisatie van de geplande investeringen over een periode van twee jaren,
      geactualiseerd tot zes maanden voor de voorlegging ter consultatie van het investeringsplan,
      bedoeld in [artikel 21, derde lid, onderdeel a, van de Elektriciteitswet 1998][ref1] en
      [artikel 7a, tweede lid, onderdeel a, van de Gaswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel7a
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 7a
  - number: 2.1.1.b
    text: |-
      de ontwikkelingen in de energiemarkt en andere ontwikkelingen die van invloed zijn op de inrichting van het net of
      gastransportnet en een analyse van de ontwikkelingen in de vorm van scenario’s;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.1
  - number: 2.1.1.c
    text: |-
      de voorgenomen investeringen die noodzakelijk zijn voor het uitvoeren van de taken die bij of krachtens de
      [Elektriciteitswet 1998][ref1] of de [Gaswet][ref2] aan hem zijn toegekend en


      [ref1]: https://wetten.overheid.nl/BWBR0009755
      [ref2]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
      - id: ref2
        bwb_id: BWBR0011440
  - number: 2.1.1.d
    text: een verklaring voor de wijzigingen ten opzichte van het voorgaande investeringsplan.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.1
  - number: 2.1.2
    text: |-
      De netbeheerder van het net op zee beschrijft in zijn investeringsplan de voorgenomen investeringen en een
      verklaring voor de wijzigingen ten opzichte van het voorgaande investeringsplan.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.1
  - number: 2.1.3
    text: 'De beschrijving van de voorgenomen investeringen, bedoeld in het eerste lid, onderdeel c, omvat:'
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.1
  - number: 2.1.3.a
    text: |-
      een kwalitatieve omschrijving van de uitbreidingen en vervangingen die een netbeheerder de eerste tien jaar
      verwacht teneinde voorziene risico’s te verkleinen;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.1
  - number: 2.1.3.b
    text: |-
      een kwantitatief overzicht van de uitbreidings- en vervangingsinvesteringen die de netbeheerder de eerste drie jaar
      zal uitvoeren.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.1
  - number: 2.1.4
    text: |-
      In afwijking van het derde lid, onderdeel b, bedraagt de periode waarop het overzicht betrekking heeft voor de
      netbeheerder van het landelijk hoogspanningsnet of landelijk gastransportnet vijf jaren.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.1
  - number: 2.1.5
    text: Bij ministeriële regeling worden nadere regels gesteld over de inhoud en inrichting van een investeringsplan.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.1
  - number: 2.2.1
    text: |-
      Een netbeheerder consulteert een ontwerpinvesteringsplan gedurende vier weken door publicatie van het
      ontwerpinvesteringsplan op een geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.2
  - number: 2.2.2
    text: Een netbeheerder voegt de zienswijzen bij het ontwerpinvesteringsplan.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.2
  - number: 2.2.3
    text: |-
      De Autoriteit Consument en Markt en Onze Minister toetsen binnen 12 weken nadat het ontwerpinvesteringsplan
      overeenkomstig [artikel 21, derde lid, onderdeel b, van de Elektriciteitswet 1998][ref1] en
      [artikel 7a, tweede lid, onderdeel b, van de Gaswet][ref2] is voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel7a
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 7a
  - number: 2.2.4
    text: 'De Autoriteit Consument en Markt betrekt bij haar toetsing onder meer of het ontwerpinvesteringsplan:'
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.2
  - number: 2.2.4.a
    text: |-
      wanneer het niet het net op zee betreft, de noodzaak van de uitbreidings- en vervangingsinvesteringen aantoont
      voor het vervullen van de taken die bij of krachtens de [Elektriciteitswet 1998][ref1] of de [Gaswet][ref2] aan de
      netbeheerder zijn toegekend;


      [ref1]: https://wetten.overheid.nl/BWBR0009755
      [ref2]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009755
      - id: ref2
        bwb_id: BWBR0011440
  - number: 2.2.4.b
    text: |-
      wanneer dit het net op zee betreft, in lijn is met het ontwikkelkader, bedoeld in
      [artikel 16e, eerste lid, van de Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16e
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16e
  - number: 2.2.5
    text: |-
      Indien het ontwerpinvesteringsplan de Autoriteit Consument en Markt of Onze Minister aanleiding geeft tot
      het opleggen van een bindende gedragslijn als bedoeld in [artikel 5a van Elektriciteitswet 1998][ref1] of
      [artikel 1b van de Gaswet][ref2], respectievelijk [artikel 21, twaalfde lid, van de Elektriciteitswet 1998][ref3]
      of [artikel 7a, elfde lid, van de Gaswet][ref4], stelt de netbeheerder het investeringsplan niet vast dan nadat het
      investeringsplan overeenkomstig de gedragslijn is aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel1b
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel7a
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 1b
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 7a
  - number: 2.2.6
    text: |-
      Een netbeheerder publiceert het investeringsplan na vaststelling onverwijld op een geschikte wijze en zendt het aan
      Onze Minister en de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.2
  - number: 2.2.7
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van het eerste tot en met vierde
      lid en het zesde lid.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.2
  - number: 2.3.1
    text: Een investeringsplan geldt voor een termijn van twee jaren.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Een investeringsplan kan tussentijds worden herzien voor zover hierbij significante wijzigingen worden aangebracht.
      [Artikel 2.2, eerste tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041487#Artikel2
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0041487
        artikel: '2'
        paragraaf: '2'
  - number: 2.3.3
    text: |-
      Een netbeheerder legt een ontwerpinvesteringsplan uiterlijk op 1 januari van een even kalenderjaar voor aan
      de Autoriteit Consument en Markt en, voor zover het een ontwerpinvesteringsplan betreft voor het landelijke
      hoogspanningsnet of landelijke gastransportnet, eveneens aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.3
  - number: 2.3.4
    text: |-
      In afwijking van het eerste en derde lid legt een netbeheerder uiterlijk op 1 juli 2020 het eerste
      ontwerpinvesteringsplan voor, dat na vaststelling geldt voor een termijn van anderhalf jaar.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel2.3
  - number: 3.1.1
    text: 'Het kwaliteitsborgingssysteem bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel3.1
  - number: 3.1.1.a
    text: |-
      de missie, visie en strategie van de netbeheerder met betrekking tot het beheersen van de kwaliteitsaspecten
      betrouwbaarheid, veiligheid, productkwaliteit en kwaliteit van de dienstverlening;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel3.1
  - number: 3.1.1.b
    text: |-
      het kwaliteitsniveau dat de netbeheerder nastreeft op de verschillende kwaliteitsaspecten, weergegeven in
      prestatie-indicatoren;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel3.1
  - number: 3.1.1.c
    text: |-
      de voorwaardenscheppende, ondersteunende en controlerende processen om het nagestreefde kwaliteitsniveau te
      bereiken;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel3.1
  - number: 3.1.1.d
    text: |-
      de procedure voor het identificeren van verbetermaatregelen met betrekking tot het kwaliteitsborgingssysteem en het
      ontwikkelen, prioriteren en implementeren van verbetermaatregelen met betrekking tot het kwaliteitsborgingssysteem;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel3.1
  - number: 3.1.1.e
    text: |-
      de implementatie en realisatie van systematische en gecoördineerde activiteiten met betrekking tot het beheer van
      de bedrijfsmiddelen ter beheersing van de verschillende kwaliteitsaspecten;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel3.1
  - number: 3.1.1.f
    text: |-
      het proces en de doelstellingen van de directiebeoordeling, waaronder tevens begrepen de beoordeling door de
      leiding van het meest betrokken bedrijfsonderdeel.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Het document, bedoeld in [artikel 19, eerste lid, onderdeel b, van de Elektriciteitswet 1998][ref1] en
      [artikel 8, eerste lid, onderdeel b, van de Gaswet][ref2] bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel8
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '8'
  - number: 3.1.2.a
    text: het beleid met betrekking tot de borging van de kwaliteitsaspecten;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel3.1
  - number: 3.1.2.b
    text: het nagestreefde kwaliteitsniveau op de verschillende kwaliteitsaspecten, weergegeven in prestatie-indicatoren;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel3.1
  - number: 3.1.2.c
    text: de gerealiseerde prestaties met betrekking tot de kwaliteitsaspecten in de afgelopen vijf jaar.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel3.1
  - number: 3.1.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inhoud van de processen en de prestatie-indicatoren,
      bedoeld in het eerste en tweede lid, en over de evaluatie van het kwaliteitsborgingssysteem.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel3.1
  - number: 4.1.1
    text: |-
      Een netbeheerder registreert de bij hem gemelde onderbrekingen in het transport van elektriciteit of gas,
      afwijkingen van de eisen aan de kwaliteit van het transport van elektriciteit of gas en waarnemingen van gaslucht.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Bij ministeriële regeling worden de gegevens vastgesteld die de netbeheerder registreert en worden regels gesteld
      over de openbaarmaking van de registratie.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4.1
  - number: 4.2.1
    text: |-
      Een netbeheerder van een gastransportnet dat bestemd is of gebruikt wordt voor het transport van gas bij een druk
      tot en met 16 bar neemt bij het ontwerp, de aanleg, de ingebruikstelling, de exploitatie, de wijziging, het beheer,
      het onderhoud en de buitengebruikstelling van een gastransportnet de technische en organisatorische maatregelen die
      redelijkerwijs van hem gevergd kunnen worden om voorvallen te voorkomen waardoor nadelige gevolgen voor de mens of
      het milieu kunnen ontstaan.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Indien zich een voorval voordoet waardoor nadelige gevolgen voor de mens of het milieu zijn ontstaan, draagt de
      netbeheerder, bedoeld in het eerste lid, zorg voor het zoveel mogelijk beperken of ongedaan maken van de nadelige
      gevolgen voor de mens en het milieu.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4.2
  - number: 4a.1
    text: |-
      Een uitvalsituatie in een net met een spanningsniveau van 220 kV of hoger in normaal bedrijf, is vrijgesteld van de
      norm in de aanhef van [artikel 16, vierde lid, van de Elektriciteitswet 1998][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
  - number: 4a.1.a
    text: |-
      de uitvalsituatie betrekking heeft op een transformator naar een spanning lager dan 110 kV en leidt tot een
      onderbreking van transport van elektriciteit van maximaal:
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.1
  - number: 4a.1.a.1°
    text: 100 MW gedurende ten hoogste tien minuten, voor zover het transport ten behoeve van verbruik betreft, of
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.1
  - number: 4a.1.a.2°
    text: |-
      200 MW gedurende ten hoogste twee weken, voor zover het transport ten behoeve van rechtstreeks op de transformator
      aangesloten, dan wel op het onderliggende net met een spanningsniveau hoger dan 1 kV of lager dan 110 kV
      aangesloten productie betreft;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.1
  - number: 4a.1.b
    text: |-
      de uitvalsituatie betrekking heeft op een railsysteem en leidt tot een onderbreking van transport van elektriciteit
      van maximaal 1.500 MW gedurende ten hoogste zes uur, voor zover het transport ten behoeve van rechtstreeks op het
      railsysteem aangesloten, dan wel op het onderliggende net met een spanningsniveau van hoger dan 1 kV of lager dan
      110 kV aangesloten productie betreft.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.1
  - number: 4a.2
    text: |-
      Een uitvalsituatie in een net met een spanningsniveau van 220 kV of hoger tijdens onderhoud, is vrijgesteld van de
      norm in de aanhef van [artikel 16, vierde lid, van de Elektriciteitswet 1998][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
  - number: 4a.2.a
    text: |-
      de uitvalsituatie betrekking heeft op een transformator naar een spanning lager dan 110 kV en leidt tot een
      onderbreking van transport van elektriciteit van maximaal:
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.2
  - number: 4a.2.a.1°
    text: 100 MW gedurende ten hoogste zes uur, voor zover het transport ten behoeve van verbruik betreft, of
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.2
  - number: 4a.2.a.2°
    text: |-
      200 MW gedurende ten hoogste twee weken, voor zover het transport ten behoeve van rechtstreeks op de transformator
      aangesloten, dan wel op het onderliggende net met een spanningsniveau van hoger dan 1 kV of lager dan 110 kV
      aangesloten productie betreft;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.2
  - number: 4a.2.b
    text: |-
      de uitvalsituatie betrekking heeft op een railsysteem en leidt tot een onderbreking van transport van elektriciteit
      van maximaal:
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.2
  - number: 4a.2.b.1°
    text: |-
      1000 MW gedurende ten hoogste twee uur, waarna de onderbreking maximaal 500 MW is, vervolgens lineair afneemt tot
      maximaal 100 MW en na zes uur is opgelost, voor zover het transport ten behoeve van verbruik betreft, of
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.2
  - number: 4a.2.b.2°
    text: |-
      1.500 MW gedurende ten hoogste zes uur, voor zover het transport ten behoeve van rechtstreeks op het railsysteem
