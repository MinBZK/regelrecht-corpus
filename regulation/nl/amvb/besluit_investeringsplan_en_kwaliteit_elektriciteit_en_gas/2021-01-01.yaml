  - number: 4a.5
    text: |-
      Een uitvalsituatie in een net met een spanningsniveau van 110 kV of hoger is vrijgesteld van de norm in de aanhef
      van [artikel 16, vierde lid, van de Elektriciteitswet 1998][ref1] indien die betrekking heeft op:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.5
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
  - number: 4a.5.a
    text: een mast met een of meer bovengrondse verbindingen;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.5
  - number: 4a.5.b
    text: een railsysteem gedurende een schakelsequentie.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.5
  - number: 4a.6
    text: |-
      Een uitvalsituatie in een net met een spanningsniveau van 110 kV of hoger, is vrijgesteld van de norm in de aanhef
      van [artikel 16, vierde lid, van de Elektriciteitswet 1998][ref1], indien de uitvalsituatie betrekking heeft op
      een netonderdeel waarvoor een ontheffing is aangevraagd als bedoeld in artikel 16, vierde lid, onderdeel b, van de
      wet, tot de dag na die waarop de beslissing op de aanvraag onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4a.6
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
  - number: 4b.1.1
    text: |-
      Een aanvraag als bedoeld in [artikel 16, vierde lid, onderdeel b, van de Elektriciteitswet 1998][ref1] omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
  - number: 4b.1.1.a
    text: een aanduiding van het netonderdeel waarvoor een ontheffing wordt aangevraagd en een locatiebeschrijving daarvan;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.1
  - number: 4b.1.1.b
    text: |-
      de redenen voor afwijking van de norm in [artikel 16, vierde lid, aanhef, van de Elektriciteitswet 1998][ref1] of,
      indien van toepassing, vrijstelling in [paragraaf 4a][ref2] van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0041487#Paragraaf4a
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0041487
        paragraaf: 4a
  - number: 4b.1.1.c
    text: |-
      de maximale omvang van onderbroken transport van elektriciteit in MW en de maximale duur van de onderbreking bij
      een uitvalsituatie met betrekking tot het netonderdeel waarvoor een ontheffing wordt aangevraagd, in voorkomend
      geval uitgesplitst naar transport ten behoeve van productie of verbruik, en een toelichting hierop;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.1
  - number: 4b.1.1.d
    text: een beschrijving van de kans op een onderbreking als bedoeld in onderdeel c;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.1
  - number: 4b.1.1.e
    text: |-
      een toelichting op conformiteit van de aanvraag met Verordening (EU) 2017/1485 van de Commissie tot vaststelling
      van richtsnoeren betreffende het beheer van elektriciteitstransmissiesystemen (PbEU 2017, L 220);
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.1
  - number: 4b.1.1.f
    text: een voorstel voor de duur van de ontheffing en een onderbouwing daarvan;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.1
  - number: 4b.1.1.g
    text: |-
      een beschrijving van de belangrijkste risico’s ten aanzien van de raming en planning van het project voor de
      investering om aan de norm te voldoen en een beschrijving van de maatregelen die de aanvrager neemt om deze
      risico’s te beperken.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.1
  - number: 4b.1.2
    text: |-
      Indien de aanvraag betrekking heeft op het verlengen van de duur van een ontheffing, omvat de aanvraag in afwijking
      van het eerste lid een motivering waarom het project voor de investering om aan de norm te voldoen niet is
      afgerond, waarbij wordt beschreven op welke wijze de aanvrager zich heeft ingespannen om het project te realiseren
      en welke maatregelen worden genomen om het project binnen de gevraagde verlengde termijn te realiseren.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.1
  - number: 4b.2
    text: |-
      Autoriteit Consument en Markt neemt het besluit op de aanvraag tot een ontheffing zo spoedig mogelijk, doch
      uiterlijk zes maanden na ontvangst van de aanvraag. Deze termijn kan eenmaal met ten hoogste zes maanden worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.2
  - number: 4b.3
    text: |-
      Aan de ontheffing wordt de voorwaarde verbonden dat wanneer het netonderdeel waarvoor ontheffing wordt verleend
      ingrijpend wordt gerenoveerd of gemodificeerd, het desbetreffende netonderdeel wordt aangepast overeenkomstig
      de norm in [artikel 16, vierde lid, aanhef, van de Elektriciteitswet 1998][ref1] of, indien van toepassing, een
      vrijstelling in [paragraaf 4a][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0041487#Paragraaf4a
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.3
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0041487
        paragraaf: 4a
  - number: 4b.4.1
    text: |-
      Een ontheffing wordt verleend voor een netonderdeel dat op 1 januari 2021 niet voldoet aan de norm, bedoeld in
      [artikel 16, vierde lid, aanhef, van de Elektriciteitswet 1998][ref1] of, indien van toepassing, een vrijstelling
      als bedoeld in [paragraaf 4a][ref2] van dit besluit, voor ten hoogste de maximale omvang en duur van de
      onderbreking bij een uitvalsituatie met betrekking tot dat netonderdeel op die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0041487#Paragraaf4a
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.4
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0041487
        paragraaf: 4a
  - number: 4b.4.2
    text: |-
      De bij ontheffing toegestane uitvalsituatie leidt niet tot overschrijding van de operationele veiligheidsgrenzen
      die zijn vastgesteld bij of krachtens Verordening (EU) 2017/1485 van de Commissie tot vaststelling van richtsnoeren
      betreffende het beheer van elektriciteitstransmissiesystemen (PbEU 2017, L 220).
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.4
  - number: 4b.4.3
    text: 'Een ontheffing, of een verlenging daarvan, wordt verleend voor ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.4
  - number: 4b.4.3.a
    text: tien jaar, voor zover het een netonderdeel in een net met een spanningsniveau van 220 kV of hoger betreft;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.4
  - number: 4b.4.3.b
    text: vijf jaar, voor zover het een netonderdeel in een net met een spanningsniveau van 110 tot 220 kV betreft.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.4
  - number: 4b.5.1
    text: |-
      De Autoriteit Consument en Markt weigert een ontheffing indien de aanvraag niet voldoet aan de vereisten in
      [artikel 4b.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041487#Artikel4b
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.5
    references:
      - id: ref1
        bwb_id: BWBR0041487
        artikel: 4b
        paragraaf: 4b
  - number: 4b.5.2
    text: |-
      De Autoriteit Consument en Markt kan een verlenging van een ontheffing weigeren indien de aanvrager zich naar het
      oordeel van de Autoriteit Consument en Markt onvoldoende heeft ingespannen om het project voor de investering om
      aan de norm te voldoen te realiseren.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.5
  - number: 4b.5.3
    text: |-
      De Autoriteit Consument en Markt kan een ontheffing of de daaraan verbonden voorschriften en beperkingen wijzigen
      of aanvullen.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.5
  - number: 4b.5.4
    text: 'De Autoriteit Consument en Markt kan een ontheffing intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.5
  - number: 4b.5.4.a
    text: |-
      bij de aanvraag onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste en volledige gegevens
      tot een andere beschikking op de aanvraag zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.5
  - number: 4b.5.4.b
    text: de aan de ontheffing verbonden voorschriften of beperkingen niet worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.5
  - number: 4b.5.4.c
    text: de netbeheerder aan wie de ontheffing is verleend, verzoekt om intrekking van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel4b.5
  - number: '5.1'
    text: |-
      Het [Besluit veiligheid lage druk gastransport][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0030600
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0030600
  - number: '5.2'
    text: Dit besluit treedt in werking met ingang van 1 januari 2019.
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel5.2
  - number: '5.3'
    text: 'Dit besluit wordt aangehaald als: Besluit investeringsplan en kwaliteit elektriciteit en gas.'
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel5.3
