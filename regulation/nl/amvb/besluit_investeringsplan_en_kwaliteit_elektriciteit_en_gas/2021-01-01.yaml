  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken en Klimaat van 10 juli 2018, nr. WJZ / 18145041;

    Gelet op de artikelen 19, derde lid, 19e, tweede lid en 21, tiende lid, van de Elektriciteitswet 1998 en de
    artikelen 7a, negende lid, 8, derde lid, 8a, tweede lid en 35e, tweede lid, van de Gaswet;

    De Afdeling advisering van de Raad van State gehoord (advies van 17 september 2018, nr. W18.18.0200/IV);

    Gezien het nader rapport van Onze Minister van Economische Zaken en Klimaat van 12 oktober 2018, nr. WJZ /
    18244983;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *investeringsplan:*
      investeringsplan als bedoeld in [artikel 21, eerste lid, van de Elektriciteitswet 1998][ref1] of
      [artikel 7a, eerste lid, van de Gaswet][ref2];
        - *kwaliteitsborgingssysteem:* kwaliteitsborgingssysteem als bedoeld in
      [artikel 19, eerste lid, onderdeel a, van de Elektriciteitswet 1998][ref3] of
      [artikel 8, eerste lid, onderdeel a, van de Gaswet][ref4];
        - *netbeheerder:* netbeheerder als bedoeld in
      [artikel 1, eerste lid, onderdeel k, van de Elektriciteitswet 1998][ref5] of
      [artikel 1, eerste lid, onderdeel e, van de Gaswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0041487/2021-01-01#Artikel1.1
    references:
