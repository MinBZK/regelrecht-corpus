  - number: '4.1'
    text: |-
      Fabrikanten voldoen bij het ontwerpen, vervaardigen, het in de handel brengen en het voor eigen doeleinden
      gebruiken van drukapparatuur en samenstellen aan de volgende bepalingen van de richtlijn:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel4
  - number: 4.1.a
    text: artikel 6;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel4
  - number: 4.1.b
    text: artikel 11;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel4
  - number: 4.1.c
    text: artikel 13;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel4
  - number: 4.1.d
    text: artikel 14;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel4
  - number: 4.1.e
    text: artikel 16, voor zover van toepassing;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel4
  - number: 4.1.f
    text: artikel 17;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel4
