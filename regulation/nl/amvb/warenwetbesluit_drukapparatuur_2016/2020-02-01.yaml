    text: artikel 18;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel4
  - number: 4.1.h
    text: artikel 19, eerste tot en met vijfde lid;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel4
  - number: 4.1.i
    text: artikel 40, eerste en derde lid;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel4
  - number: 4.1.j
    text: artikel 42, eerste en tweede lid; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel4
  - number: 4.1.k
    text: bijlage I.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel4
  - number: '4.2'
    text: |-
      Instructies en informatie aangaande de veiligheid, alsmede eventuele etikettering als bedoeld in artikel 6, zevende
      lid, van de richtlijn, zijn in ieder geval gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel4
  - number: '4.3'
    text: |-
      De EU-conformiteitsverklaring, bedoeld in de artikelen 6, tweede lid, en 17, eerste lid, van de richtlijn, is in
      ieder geval gesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel4
  - number: '5.1'
    text: De fabrikant die een gemachtigde aanstelt, voldoet en zorgt dat wordt voldaan aan artikel 7 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel5
  - number: '5.2'
    text: De gemachtigde, bedoeld in het eerste lid, voldoet aan de artikelen 7, tweede lid, en 11 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel5
  - number: '6.1'
    text: |-
      Importeurs voldoen bij het in de handel brengen van drukapparatuur en samenstellen aan de volgende bepalingen van
      de richtlijn:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel6
  - number: 6.1.a
    text: artikel 8;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel6
  - number: 6.1.b
    text: artikel 10;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel6
  - number: 6.1.c
    text: artikel 11;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel6
  - number: 6.1.d
    text: artikel 40, eerste en derde lid;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel6
  - number: 6.1.e
    text: artikel 42, eerste en tweede lid; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel6
  - number: 6.1.f
    text: bijlage I.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel6
  - number: '6.2'
    text: |-
      Instructies en informatie aangaande de veiligheid, bedoeld in artikel 8, vierde lid, van de richtlijn, zijn in
      ieder geval gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel6
  - number: '7.1'
    text: |-
      Distributeurs voldoen bij het op de markt aanbieden van drukapparatuur en samenstellen aan de volgende bepalingen
      van de richtlijn:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel7
  - number: 7.1.a
    text: artikel 9;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel7
  - number: 7.1.b
    text: artikel 10;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel7
  - number: 7.1.c
    text: artikel 11;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel7
  - number: 7.1.d
    text: artikel 40, eerste en derde lid; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel7
  - number: 7.1.e
    text: artikel 42, eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel7
  - number: '7.2'
    text: |-
      Instructies en informatie aangaande de veiligheid, bedoeld in artikel 9, tweede lid, van de richtlijn, zijn in
      ieder geval gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel7
  - number: '8.1'
    text: |-
      Drukapparatuur en samenstellen voldoen aan de essentiële veiligheidseisen als vermeld in bijlage I van de
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel8
  - number: '8.2'
    text: |-
      Drukapparatuur en samenstellen die door fabrikanten en importeurs in de handel worden gebracht of door
      distributeurs op de markt worden aangeboden, die in overeenstemming zijn met geharmoniseerde normen of delen
      daarvan, waarvan de referentienummers in het Publicatieblad van de Europese Unie zijn bekendgemaakt, worden vermoed
      te voldoen aan de eisen die door die normen of delen daarvan worden bestreken, zoals beschreven in artikel 12 en
      bijlage I van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel8
  - number: '9.1'
    text: |-
      Drukapparatuur en samenstellen die in de handel worden gebracht of op de markt worden aangeboden, met uitzondering
      van die genoemd in artikel 16, tweede lid, zijn overeenkomstig de artikelen 18 en 19 van de richtlijn voorzien van
      de CE-markering.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel9
  - number: '9.2'
    text: |-
      Drukapparatuur en samenstellen die niet zijn voorzien van de CE-markering of anderszins niet aan dit besluit
      voldoen, mogen op beurzen en exposities en bij demonstraties worden tentoongesteld met inachtneming van artikel 3,
      derde lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel9
  - number: '10.1'
    text: |-
      De beoordeling van de conformiteit van drukapparatuur en samenstellen, de afgifte van verklaringen en de verlening
      van goedkeuringen ter zake vinden plaats met inachtneming van de artikelen 12, eerste lid, 14 en 17 van de
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel10
  - number: '10.2'
    text: |-
      Fabrikanten vragen de beoordeling van de conformiteit van drukapparatuur en samenstellen, als bedoeld in artikel 14
      van de richtlijn, aan bij een EU-conformiteitsbeoordelingsinstantie of EU-keuringsdienst voor gebruikers.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel10
  - number: '10.3'
    text: |-
      De dossiers en briefwisseling betreffende de in de artikelen 14 en 16 van de richtlijn bedoelde
      conformiteitbeoordelingsprocedures zijn in ieder geval gesteld in de Nederlandse taal of een andere door de EU-
      conformiteitsbeoordelingsinstantie aanvaarde taal.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel10
  - number: '10.4'
    text: |-
      De verlening van de goedkeuring, genoemd in bijlage I, onderdelen 3.1.2 en 3.1.3, bij de richtlijn, kan naast de
      EU-conformiteitsbeoordelingsinstantie geschieden door een erkende onafhankelijke instelling. Het derde lid is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel10
  - number: '11.1'
    text: |-
      De Europese materiaalgoedkeuring, bedoeld in artikel 15 van de richtlijn, wordt op verzoek van één of meer
      materiaalfabrikanten of fabrikanten van drukapparatuur, met inachtneming van genoemd artikel, verleend door een
      hiertoe door Onze Minister aangewezen EU-conformiteitsbeoordelingsinstantie. De kosten van de materiaalgoedkeuring
      zijn voor rekening van de betrokken fabrikant of fabrikanten.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel11
  - number: '11.2'
    text: |-
      De voor de fabricage van drukapparatuur gebruikte materialen die voldoen aan de Europese materiaalgoedkeuringen
      waarvan de referenties door de Commissie van de Europese Unie zijn gepubliceerd in het Publicatieblad van de
      Europese Unie, worden geacht te voldoen aan de daarop van toepassing zijnde essentiële veiligheidseisen, bedoeld in
      bijlage I bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel11
  - number: '12.1'
    text: |-
      De EU-conformiteitsbeoordelingsinstantie en EU-keuringsdienst van gebruikers trekken een door hen afgegeven
      verklaring van EU-typeonderzoek of EU-ontwerponderzoek of een verleende goedkeuring van het kwaliteitssysteem,
      bedoeld in bijlage III bij de richtlijn, in, indien de essentiële veiligheidseisen of voorgeschreven
      gebruiksomstandigheden, bedoeld in bijlage I bij de richtlijn, zodanig zijn gewijzigd dat het type, ontwerp of
      kwaliteitssysteem niet meer voldoet aan de gewijzigde eisen op het tijdstip waarop deze volgens de richtlijn van
      toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel12
  - number: '12.2'
    text: |-
      De EU-conformiteitsbeoordelingsinstantie trekt een door haar verleende Europese materiaalgoedkeuring in,
      indien naar haar oordeel de goedkeuring niet verleend had mogen worden of indien de materiaalsoort onder een
      geharmoniseerde norm valt.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel12
  - number: '12.3'
    text: |-
      De EU-conformiteitsbeoordelingsinstantie en EU-keuringsdienst van gebruikers en erkende onafhankelijke instelling
      trekken een door hen verleende goedkeuring, genoemd in bijlage I, onderdelen 3.1.2 en 3.1.3, bij de richtlijn, in,
      indien die naar hun oordeel niet verleend had mogen worden of er niet meer wordt voldaan aan bijlage I, onderdelen
      3.1.2 of 3.1.3, bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel12
  - number: '13.1'
    text: |-
      Bij een verzoek aan Onze Minister als bedoeld in [artikel 7a van de wet][ref1], voldoet de aanvrager aan artikel
      28, eerste en tweede lid, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: '13.2'
    text: |-
      Een EU-conformiteitsbeoordelingsinstantie, EU-keuringsdienst van gebruikers en erkende onafhankelijke instelling
      voldoen aan of zorgen dat, voor zover op hen van toepassing, wordt voldaan aan de volgende bepalingen van de
      richtlijn:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel13
  - number: 13.2.a
    text: artikel 16, eerste lid, derde lid en vierde lid;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel13
  - number: 13.2.b
    text: artikel 24, tweede tot en met elfde lid;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel13
  - number: 13.2.c
    text: artikel 25, tweede lid tot en met elfde lid;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel13
  - number: 13.2.d
    text: artikel 34; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel13
  - number: 13.2.e
    text: artikel 36.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel13
  - number: '13.3'
    text: |-
      Een EU-conformiteitsbeoordelingsinstantie, EU-keuringsdienst van gebruikers of erkende onafhankelijke instelling,
      die taken uitbesteedt of door ondergeschikte instanties laat uitvoeren, voldoet aan artikel 27 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel13
  - number: '13.4'
    text: |-
      Een EU-conformiteitsbeoordelingsinstantie, EU-keuringsdienst voor gebruikers of erkende onafhankelijke instelling
      voldoet aan de criteria, genoemd in het eerste, tweede en derde lid. Zij tonen dit aan door middel van een
      accreditatie tegen de van toepassing zijnde geharmoniseerde normen of delen daarvan, mits die normen de eisen,
      bedoeld in de eerste zin, dekken en de referentienummers van die normen in het Publicatieblad van de Europese Unie
      zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel13
  - number: '13.5'
    text: |-
      Indien de EU-conformiteitsbeoordelingsinstantie, EU-keuringsdienst voor gebruikers of erkende onafhankelijke
      instelling geen bewijs van accreditatie kan overleggen, verschaft zij Onze Minister alle bewijsstukken die nodig
      zijn om aan te tonen dat zij voldoet aan de criteria, genoemd in het eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister weigert een aanwijzing als EU-conformiteitsbeoordelingsinstantie, EU-keuringsdienst van gebruikers
      of erkende onafhankelijke instelling indien de aanvrager niet heeft voldaan aan het bepaalde bij of krachtens
      [artikel 13, eerste tot en met vijfde lid][ref1], voor zover op hen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel13
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '13'
        hoofdstuk: '2'
  - number: '14.2'
    text: |-
      Een aanwijzing kan worden geschorst, ten nadele van de EU-conformiteitsbeoordelingsinstantie, EU-keuringsdienst van
      gebruikers of erkende onafhankelijke instelling worden gewijzigd of ingetrokken:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel14
  - number: 14.2.a
    text: |-
      op grond van door de EU-conformiteitsbeoordelingsinstantie, EU-keuringsdienst van gebruikers of erkende
      onafhankelijke instelling verstrekte onjuiste inlichtingen over feiten of omstandigheden, mits de onjuistheid
      daarvan aan deze instantie, dienst of instelling bekend was of kon zijn;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel14
  - number: 14.2.b
    text: |-
      indien de EU-conformiteitsbeoordelingsinstantie, EU-keuringsdienst van gebruikers of erkende onafhankelijke
      instelling niet meer voldoet aan het bepaalde bij of krachtens [artikel 13, eerste tot en met vijfde lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel13
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '13'
        hoofdstuk: '2'
  - number: 14.2.c
    text: |-
      indien de EU-conformiteitsbeoordelingsinstantie, EU-keuringsdienst van gebruikers of erkende onafhankelijke
      instelling haar wettelijke verplichtingen niet meer naar behoren nakomt of de taken waarvoor zij is aangewezen,
      niet meer naar behoren uitvoert.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel14
  - number: '15.1'
    text: |-
      Bij de uitoefening van zijn taken als aanmeldende autoriteit voldoet Onze Minister aan artikelen 22 en 29 van de
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel15
  - number: '15.2'
    text: Onze Minister verricht de taken, bedoeld in artikel 21, tweede lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel15
  - number: '16.1'
    text: |-
      Tijdens de looptijd van de aanwijzing stelt Onze Minister periodiek vast of de EU-
      conformiteitsbeoordelingsinstantie, EU-keuringsdienst van gebruikers en erkende onafhankelijke instelling:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel16
  - number: 16.1.a
    text: |-
      nog voldoen aan het bepaalde bij of krachtens [artikel 13, eerste tot en met vijfde lid][ref1], voor zover op hen
      van toepassing; en


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel13
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '13'
        hoofdstuk: '2'
  - number: 16.1.b
    text: |-
      hun wettelijke verplichtingen naar behoren nakomen en de taken waarvoor zij zijn aangewezen, naar behoren
      uitvoeren.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel16
  - number: '16.2'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld betreffende het kosteloos gegevens en inlichtingen
      verstrekken door de EU-conformiteitsbeoordelingsinstantie, EU-keuringsdienst van gebruikers of erkende
      onafhankelijke instelling aan Onze Minister of de nationale accreditatie-instantie respectievelijk door Onze
      Minister of de nationale accreditatie-instantie aan de EU-conformiteitsbeoordelingsinstantie, EU-keuringsdienst
      van gebruikers of erkende onafhankelijke instelling, die zijn verkregen door de uitvoering of het toezicht op
      de naleving van het bepaalde bij of krachtens de [wet][ref1], welke noodzakelijk zijn voor de uitvoering van hun
      wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: '16.3'
    text: |-
      Een EU-conformiteitsbeoordelingsinstantie, een EU-keuringsdienst van gebruikers of een erkende onafhankelijke
      instelling die haar taken waarvoor zij is aangewezen, beëindigt, of waarvan de aanwijzing door Onze Minister wordt
      ingetrokken, is verplicht tijdig voorafgaand aan de beëindiging van de werkzaamheden respectievelijk de datum
      waarop de aanwijzing eindigt, haar dossiers over te dragen aan een EU-conformiteitsbeoordelingsinstantie waarmee
      de marktdeelnemer een overeenkomst is aangegaan. Indien er geen EU-conformiteitsbeoordelingsinstantie is, draagt
      de EU-conformiteitsbeoordelingsinstantie, EU-keuringsdienst van gebruikers of erkende onafhankelijke instelling de
      dossiers over aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel16
  - number: '17'
    text: |-
      Een wijziging van de richtlijn gaat voor de toepassing van dit besluit gelden met ingang van de dag waarop aan de
      betrokken wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel17
  - number: 17a.1
    text: |-
      Gebruikers voldoen bij het ontwerpen, vervaardigen, laten ontwerpen en het laten vervaardigen en in eigen beheer
      assembleren van drukapparatuur of samenstellen voor eigen doeleinden aan de volgende bepalingen van de richtlijn:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel17a
  - number: 17a.1.a
    text: artikel 6;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel17a
  - number: 17a.1.b
    text: artikel 11;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel17a
  - number: 17a.1.c
    text: artikel 13;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel17a
  - number: 17a.1.d
    text: artikel 14;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel17a
  - number: 17a.1.e
    text: artikel 16, voor zover van toepassing;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel17a
  - number: 17a.1.f
    text: artikel 17;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel17a
  - number: 17a.1.g
    text: artikel 40, eerste en derde lid;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel17a
  - number: 17a.1.h
    text: artikel 42, eerste en tweede lid; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel17a
  - number: 17a.1.i
    text: bijlage I.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel17a
  - number: 17a.2
    text: |-
      De beoordeling van de conformiteit van drukapparatuur en samenstellen, bedoeld in het eerste lid, vindt
      plaats met inachtneming van de [artikelen 8][ref1] en [10][ref2], voor zover van toepassing, door een NL-
      conformiteitsbeoordelingsinstantie.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0038083#Artikel10
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0038083
        artikel: '10'
        hoofdstuk: '2'
  - number: 17a.3
    text: |-
      Instructies en informatie aangaande de veiligheid, alsmede eventuele etikettering als bedoeld in artikel 6, zevende
      lid, van de richtlijn, zijn in ieder geval gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel17a
  - number: 17a.4
    text: |-
      De NL-conformiteitsverklaring is in ieder geval gesteld in de Nederlandse of Engelse taal. Artikel 17 van de
      richtlijn is van overeenkomstige toepassing op de NL-conformiteitsverklaring.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel17a
  - number: '18'
    text: |-
      Drukapparatuur en samenstellen gaan vergezeld van een gebruiksaanwijzing, bestemd voor de gebruiker, met alle
      voor de veiligheid van belang zijnde informatie als bedoeld in punt 3.4 van bijlage I bij de richtlijn, en die ten
      minste in de Nederlandse taal is gesteld.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel18
  - number: '19.1'
    text: |-
      De opstelling van drukapparatuur en samenstellen voorzien van een CE-markering, zijn zodanig dat zij toegankelijk
      en bereikbaar zijn voor het gebruik en uitvoeren van onderhoud, onderzoek, inspectie, reparatie en keuringen. Zij
      zijn voorzien van een zodanige ondersteuning dat de veiligheid niet in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel19
  - number: '19.2'
    text: Bij ministeriële regeling kunnen ter uitvoering van het eerste lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel19
  - number: '20.1'
    text: |-
      Degene die drukapparatuur of samenstellen voorhanden heeft, aflevert, tentoonstelt of gebruikt zorgt ervoor dat die
      in goede staat van onderhoud verkeren.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel20
  - number: '20.2'
    text: |-
      Degene die drukapparatuur of samenstellen gebruikt of doet gebruiken, zorgt ervoor dat die drukapparatuur en
      samenstellen overeenkomstig het door de fabrikant beoogde gebruik worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel20
  - number: '20.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing voor zover drukapparatuur en samenstellen hetzij zijn afgekeurd
      hetzij onklaar zijn gemaakt hetzij anderszins kennelijk niet meer voor gebruik zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel20
  - number: '21.1'
    text: Bij ministeriële regeling wordt drukapparatuur aangewezen die overeenkomstig dit artikel wordt gekeurd.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: '21.2'
    text: |-
      De drukapparatuur, bedoeld in het eerste lid, wordt, wanneer die wordt opgesteld en geïnstalleerd, gekeurd voor
      de eerste ingebruikneming alsmede na elke montage op een nieuwe plaats van opstelling en gaat vergezeld van een
      verklaring van ingebruikneming. De kosten van de keuring zijn voor rekening van de gebruiker, bedoeld in het vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: '21.3'
    text: |-
      De verklaring van ingebruikneming, bedoeld in het tweede lid, wordt onder overlegging van de gegevens en
      bescheiden, genoemd in het vierde lid, schriftelijk aangevraagd bij een NL-conformiteitsbeoordelingsinstantie of
      NL-keuringsdienst van gebruikers.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: '21.4'
    text: 'De aanvraag, bedoeld in het derde lid, omvat, voor zover van toepassing:'
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: 21.4.a
    text: naam en adres van de gebruiker en plaats waar de drukapparatuur staat opgesteld; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: 21.4.b
    text: |-
      de gebruiksaanwijzing, bedoeld in bijlage I, punt 3.4, bij de richtlijn, met inbegrip van een vervaardigingsbewijs,
      de EG-verklaring van overeenstemming, bedoeld in [artikel 25][ref1], de EU-conformiteitsverklaring en het
      aantekenblad, bedoeld in [artikel 24][ref2], indien reeds verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0038083#Artikel24
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0038083
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '21.5'
    text: |-
      De documenten, bedoeld in het vierde lid, onder b, kunnen met instemming van de NL-
      conformiteitsbeoordelingsinstantie of NL-keuringsdienst van gebruikers, in afwijking van het derde lid, beschikbaar
      worden gehouden op het moment van de keuring.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: '21.6'
    text: |-
      De NL-conformiteitsbeoordelingsinstantie of NL-keuringsdienst van gebruikers, die de keuring, bedoeld in het tweede
      lid, uitvoert, verricht, voor zover van toepassing, de volgende onderzoeken:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: 21.6.a
    text: de verificatie van de drukapparatuur aan de hand van de gebruiksaanwijzing en markeringen;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: 21.6.b
    text: de controle van de uitwendige toestand van de drukapparatuur;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: 21.6.c
    text: de controle van de werking van de veiligheidsappendages en onder druk staande appendages; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: 21.6.d
    text: de controle van de opstelling van de drukapparatuur.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: '21.7'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de onderzoeken, bedoeld in het zesde
      lid.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: '21.8'
    text: |-
      Bij de toepassing van het tweede en zesde lid wordt rekening gehouden met de onderzoeken in het kader van de
      EU-conformititeitsbeoordeling, bedoeld in de [artikelen 8][ref1], [10][ref2] en de beoordeling, bedoeld in
      [artikel 17a, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0038083#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0038083#Artikel17a
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0038083
        artikel: '10'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0038083
        artikel: 17a
        hoofdstuk: '3'
  - number: '21.9'
    text: |-
      Indien een afzonderlijk drukvat of afzonderlijke installatieleiding met inbegrip van de daarbij behorende
      veiligheidsappendages en onder druk staande appendages, wordt gekoppeld aan een bestaand drukvat of bestaande
      installatieleiding, kan de keuring voor de ingebruikneming, bedoeld in het tweede lid, worden betrokken
      op het afzonderlijk drukvat of de afzonderlijke installatieleiding, met inbegrip van de daarbij behorende
      veiligheidsappendages en onder druk staande appendages.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: '21.10'
    text: |-
      De NL-conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers, bedoeld in het zesde lid, stellen
      een rapport op van de keuring, bedoeld in het tweede lid, en stellen een exemplaar van het rapport beschikbaar aan
      de gebruiker. In dit rapport kunnen voorwaarden worden gesteld waaraan wordt voldaan alvorens een verklaring van
      ingebruikneming wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: '21.11'
    text: |-
      Door de NL-conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers, bedoeld in het zesde lid,
      wordt een verklaring van ingebruikneming afgegeven indien is gebleken dat tegen het in gebruik nemen van de
      drukapparatuur, bedoeld in het tweede lid, geen bezwaar bestaat. In deze verklaring:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: 21.11.a
    text: |-
      wordt de termijn vermeld waarbinnen de drukapparatuur uiterlijk aan een herkeuring als bedoeld in
      [artikel 22][ref1], wordt onderworpen; en


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel22
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 21.11.b
    text: kunnen voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: '21.12'
    text: De verklaring van ingebruikneming kan betrekking hebben op één of meer drukapparaten.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: '21.13'
    text: De gebruiker draagt er zorg voor dat de keuring, bedoeld in het tweede lid, veilig kan worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
  - number: '21.14'
    text: |-
      Dit artikel is niet van toepassing, indien een verklaring als bedoeld in [artikel 23, tweede lid][ref1], is
      afgegeven, tot het tijdstip waarop de betreffende drukapparatuur na montage wordt opgesteld en geïnstalleerd op een
      nieuwe plaats van opstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel23
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '22.1'
    text: |-
      Bij ministeriële regeling wordt in verband met de veiligheid en gezondheid van personen en het milieu
      drukapparatuur aangewezen die overeenkomstig dit artikel wordt herkeurd.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: '22.2'
    text: |-
      De drukapparatuur, bedoeld in het eerste lid, wordt herkeurd en gaat vergezeld van een verklaring van herkeuring.
      De kosten van de herkeuring zijn voor rekening van de gebruiker, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: '22.3'
    text: |-
      De verklaring van herkeuring, bedoeld in het tweede lid, wordt, met inachtneming van de termijn, bedoeld in
      [artikel 21, elfde lid, onder a][ref1], onderscheidenlijk de termijn, bedoeld in het negende lid, onder a,
      onder overlegging van de gegevens en bescheiden, vermeld in het vierde lid, schriftelijk aangevraagd bij een NL-
      conformiteitsbeoordelingsinstantie of NL-keuringsdienst van gebruikers.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel21
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '22.4'
    text: 'De aanvraag, bedoeld in het derde lid, omvat, voor zover van toepassing:'
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: 22.4.a
    text: naam en adres van de gebruiker en de plaats waar de drukapparatuur staat opgesteld;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: 22.4.b
    text: |-
      de verklaring van ingebruikneming, de verklaring van intredekeuring en ingebruikneming en de verklaring van
      herkeuring, afgegeven na een voorgaande herkeuring, met inbegrip van de bij de keuringen behorende rapporten, en
      het aantekenblad, bedoeld in [artikel 24][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel24
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 22.4.c
    text: |-
      de documentatie van de drukapparatuur die is afgegeven tot 29 mei 2002 op grond van de wettelijke voorschriften die
      van toepassing waren vóór 29 november 1999; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: 22.4.d
    text: |-
      naar het oordeel van de NL-conformiteitsbeoordelingsinstantie of NL-keuringsdienst van gebruikers, bedoeld in het
      zesde lid, aanvullende documentatie.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: '22.5'
    text: |-
      [Artikel 21, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel21
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '22.6'
    text: |-
      De NL-conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers die de herkeuring, bedoeld in het
      tweede lid, uitvoeren, verrichten, voor zover van toepassing, de volgende onderzoeken:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: 22.6.a
    text: |-
      de controle van de inwendige toestand van drukapparatuur door een inwendig onderzoek of ander passend onderzoek
      gericht op de inwendige toestand; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: 22.6.b
    text: de controle van de uitwendige toestand van de drukapparatuur.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: '22.7'
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van de onderzoeken, bedoeld in het zesde lid, nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: '22.8'
    text: |-
      De NL-conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers, bedoeld in het zesde lid, stellen een
      rapport op van de herkeuring, bedoeld in het tweede lid, en stellen een exemplaar van het rapport beschikbaar aan
      de gebruiker. In dit rapport kunnen voorwaarden worden gesteld waaraan wordt voldaan alvorens een verklaring van
      herkeuring wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: '22.9'
    text: |-
      Door de NL-conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers, bedoeld in het zesde lid, wordt
      een verklaring van herkeuring afgegeven, indien is gebleken dat tegen het verdere gebruik van de drukapparatuur
      voor de geldende termijn geen bezwaar bestaat. In deze verklaring:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: 22.9.a
    text: wordt de geldigheidstermijn vermeld; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: 22.9.b
    text: kunnen voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: '22.10'
    text: De verklaring van herkeuring kan betrekking hebben op één of meer drukapparaten.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: '22.11'
    text: De gebruiker draagt er zorg voor dat de herkeuring, bedoeld in het tweede lid, veilig kan worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: '22.12'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot bepaalde drukapparatuur als bedoeld in het eerste lid, regels
      worden gesteld die strekken ter aanvulling van dit artikel of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel22
  - number: '23.1'
    text: 'Dit artikel is van toepassing op drukapparatuur die:'
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: 23.1.a
    text: |-
      voor 29 mei 2002 is vervaardigd overeenkomstig de wettelijke voorschriften van een staat, niet zijnde Nederland,
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte; of
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: 23.1.b
    text: |-
      op of na 29 mei 2002 is vervaardigd overeenkomstig de wettelijke voorschriften van een staat, die is toegetreden
      tot de Europese Unie op of na 29 mei 2002, mits de vervaardiging is geschied voor de datum van toetreding van de
      desbetreffende staat, en die niet voor 29 mei 2002 in overeenstemming is gebracht met de richtlijn, en die op grond
      van [artikel 21, eerste lid][ref1], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel21
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '23.2'
    text: |-
      Alvorens de drukapparatuur, bedoeld in het eerste lid, in gebruik wordt genomen, wordt zij aan een intredekeuring
      onderworpen en gaat vergezeld van een verklaring van intredekeuring en ingebruikneming. De kosten van de
      intredekeuring zijn voor rekening van de gebruiker, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: '23.3'
    text: |-
      De verklaring, bedoeld in het tweede lid, wordt, onder overlegging van de gegevens en bescheiden, vermeld in
      het vierde lid, schriftelijk door de gebruiker aangevraagd bij een NL-conformiteitsbeoordelingsinstantie of NL-
      keuringsdienst van gebruikers.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: '23.4'
    text: 'De aanvraag, bedoeld in het derde lid, omvat voor zover van toepassing:'
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: 23.4.a
    text: naam en adres van de gebruiker en het adres van de plaats van opstelling van de drukapparatuur;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: 23.4.b
    text: de documenten omtrent het ontwerp, de vervaardiging en het toegestane gebruik van de drukapparatuur; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: 23.4.c
    text: de afgegeven verklaringen met bijbehorende rapporten met betrekking tot keuringen van drukapparatuur.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: '23.5'
    text: |-
      [Artikel 21, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel21
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '23.6'
    text: |-
      De NL-conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers, die de keuring uitvoeren, verrichten,
      voor zover van toepassing, de volgende onderzoeken:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: 23.6.a
    text: een beoordeling van het ontwerp naar het beoogde gebruiksdoel van de drukapparatuur;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: 23.6.b
    text: een beoordeling van de documenten die betrekking hebben op de vervaardiging van de drukapparatuur;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: 23.6.c
    text: een beoordeling van de integratie en beveiliging van de drukapparatuur;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: 23.6.d
    text: |-
      de onderzoeken, bedoeld in [artikel 21, zesde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel21
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 23.6.e
    text: |-
      de onderzoeken, bedoeld in [artikel 22, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel22
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '23.7'
    text: |-
      Met goedkeuring van een beoordeling als bedoeld in het zesde lid, onder a en b, wordt gelijkgesteld een bewijs
      van goedkeuring afgegeven door een erkende onafhankelijke instelling in een andere staat die partij is bij de
      Overeenkomst inzake de Europese Economische Ruimte, welk bewijs is afgegeven op basis van onderzoeken die aan ten
      minste gelijkwaardige eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: '23.8'
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van de onderzoeken, bedoeld in het zesde lid, onder a en b, nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: '23.9'
    text: |-
      De NL-conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers, bedoeld in het zesde lid, stellen een
      rapport op van de intredekeuring, bedoeld in het tweede lid, en stellen een exemplaar van het rapport beschikbaar
      aan de gebruiker. In dit rapport kunnen voorwaarden worden gesteld waaraan wordt voldaan alvorens een verklaring
      van intredekeuring en ingebruikneming wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: '23.10'
    text: |-
      Door de NL-conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers, bedoeld in het zesde lid, wordt
      een verklaring als bedoeld in het tweede lid afgegeven, indien is gebleken dat tegen het in gebruik nemen van de
      drukapparatuur, bedoeld in het eerste lid, geen bezwaar bestaat. In deze verklaring:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: 23.10.a
    text: |-
      wordt de termijn vermeld waarbinnen de drukapparatuur uiterlijk aan een herkeuring als bedoeld in
      [artikel 22][ref1], wordt onderworpen; en


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel22
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 23.10.b
    text: kunnen voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: '23.11'
    text: De verklaring, bedoeld in het tweede lid, kan betrekking hebben op één of meer drukapparaten.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: '23.12'
    text: De gebruiker draagt er zorg voor dat de keuring, bedoeld in het tweede lid, veilig kan worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel23
  - number: '24.1'
    text: |-
      De verklaring van ingebruikneming, bedoeld in [artikel 21, tweede lid][ref1], en de verklaring van intredekeuring
      en ingebruikneming, bedoeld in [artikel 23, tweede lid][ref2], gaan vergezeld van een aantekenblad.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0038083#Artikel23
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0038083
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '24.2'
    text: |-
      Op het aantekenblad worden de bevindingen van elke verrichting aan de drukapparatuur vermeld, met, indien van
      toepassing, verwijzing naar verklaringen en bijbehorende rapporten, totdat de drukapparatuur is afgekeurd hetzij
      onklaar is gemaakt hetzij anderszins kennelijk niet meer voor gebruik is bestemd.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel24
  - number: '24.3'
    text: |-
      Uitsluitend de betrokken NL-conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers zijn bevoegd op
      het aantekenblad aantekeningen te maken.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel24
  - number: '25.1'
    text: |-
      Gedurende tien jaar na de vervaardiging van drukapparatuur of samenstellen of indien deze in een serie zijn
      vervaardigd, na de vervaardiging van de laatste drukapparatuur of samenstellen, bewaart de fabrikant overeenkomstig
      bijlage III bij de richtlijn, voor zover van toepassing, de technische documentatie, een afschrift van de EG-
      verklaring van overeenstemming, van de EU-conformiteitsverklaring en van de verklaring van EG-typeonderzoek of EG-
      ontwerponderzoek, bedoeld in [Richtlijn 97/23/EG](31997L0023) van het Europees Parlement en de Raad van 29 mei
      1997 inzake de onderlinge aanpassing van de wetgevingen der lidstaten betreffende drukapparatuur (Pb 1997, L 181),
      het certificaat van EU-typeonderzoek of EU-ontwerponderzoek inclusief de aanvullingen daarop, en de gegevens,
      bedoeld in punt 5 van module D, onderscheidenlijk punt 7 van module D1, onderscheidenlijk punt 5 van module E,
      onderscheidenlijk punt 7 van module E1, onderscheidenlijk punt 5 van module H van bijlage III bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel25
  - number: '25.2'
    text: |-
      Indien de fabrikant niet in de Europese Economische Ruimte is gevestigd, is het eerste lid van toepassing op degene
      die de drukapparatuur of samenstellen in de Europese Economische Ruimte in de handel brengt.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel25
  - number: '25.3'
    text: |-
      Zolang de drukapparatuur of samenstellen in werking zijn of in werking kunnen worden gesteld bewaart de
      gebruiker, voor zover van toepassing, de EG-verklaring van overeenstemming, bedoeld in het eerste lid, de EU-
      conformiteitsverklaring, de gebruiksaanwijzing, bedoeld in bijlage I, punt 3.4, bij de richtlijn, de verklaring
      van ingebruikneming, bedoeld in [artikel 20, tweede lid][ref1], de verklaring van herkeuring, bedoeld in
      [artikel 22, tweede lid][ref2], het aantekenblad, bedoeld in [artikel 24, eerste lid][ref3], de verklaring van
      intredekeuring en ingebruikneming, bedoeld in [artikel 23, tweede lid][ref4], en de bij de beoordelingen en
      keuringen behorende rapporten.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0038083#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0038083#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0038083#Artikel23
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '20'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0038083
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0038083
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0038083
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '26.1'
    text: |-
      Op voorgenomen wijzigingen en reparaties aan drukapparatuur, bedoeld in [artikel 21, eerste lid][ref1], is bijlage
      I, met uitzondering van het aanbrengen van de CE-markering, bij de richtlijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel21
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '26.2'
    text: |-
      Van voorgenomen wijzigingen en reparaties aan drukapparatuur, bedoeld in het eerste lid, wordt de NL-
      conformiteitsbeoordelingsinstantie of NL-keuringsdienst van gebruikers onverwijld in kennis gesteld door de
      gebruiker.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
  - number: '26.3'
    text: |-
      De NL-conformiteitsbeoordelingsinstantie of NL-keuringsdienst van gebruikers, bedoeld in het tweede lid, verricht
      de noodzakelijke onderzoeken aan het ontwerp en de constructie van de voorgenomen wijziging of reparatie waarbij,
      voor zover van toepassing, rekening wordt gehouden met eerder uitgevoerd onderzoek en verricht tijdens de
      uitvoering van de wijziging of reparatie passende onderzoeken en proeven. De kosten van de onderzoeken en proeven
      zijn voor rekening van de gebruiker, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
  - number: '26.4'
    text: |-
      Indien de wijzigingen aan de drukapparatuur, bedoeld in het eerste lid, van invloed zijn op de wijze van gebruik,
      de uitrusting of de opstelling, beoordeelt de NL-conformiteitsbeoordelingsinstantie of NL-keuringsdienst van
      gebruikers, bedoeld in het tweede lid, de integratie en beveiliging.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
  - number: '26.5'
    text: |-
      Met betrekking tot voorgenomen wijzigingen aan drukapparatuur dat in gebruik is en voor de voorgenomen wijziging
      niet valt onder de drukapparatuur, bedoeld in [artikel 22, eerste lid][ref1], maar daar na de voorgenomen wijziging
      wel onder valt, is het eerste tot en met het vijfde lid van overeenkomstige toepassing, en worden door de NL-
      conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers, bedoeld in het tweede lid, zo nodig, de
      volgende onderzoeken uitgevoerd:


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel22
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 26.5.a
    text: een beoordeling van het ontwerp naar het beoogde gebruiksdoel van de drukapparatuur;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
  - number: 26.5.b
    text: een beoordeling van de documenten die betrekking hebben op de vervaardiging van de drukapparatuur;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
  - number: 26.5.c
    text: een beoordeling van de integratie en beveiliging van de drukapparatuur;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
  - number: 26.5.d
    text: |-
      de onderzoeken, bedoeld in [artikel 21, zesde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel21
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 26.5.e
    text: |-
      de onderzoeken, bedoeld in [artikel 22, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel22
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '26.6'
    text: |-
      Met betrekking tot de gewijzigde drukapparatuur worden door de NL-conformiteitsbeoordelingsinstantie
      en NL-keuringsdienst van gebruikers, bedoeld in het tweede lid, zo nodig, de onderzoeken, bedoeld in
      [artikel 21, zesde lid][ref1], uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel21
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '26.7'
    text: |-
      De NL-conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers, bedoeld in het tweede lid, stellen
      een rapport op van de beoordelingen, bedoeld in het derde en vierde lid, van het onderzoek, bedoeld in het derde
      lid, en van de onderzoeken, bedoeld in het vijfde, zesde en achtste lid, en stellen een exemplaar van dit rapport
      beschikbaar aan de gebruiker.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
  - number: '26.8'
    text: |-
      Indien is gebleken dat tegen het verder gebruik van de drukapparatuur geen bezwaar bestaat, wordt door de NL-
      conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers, bedoeld in het derde lid, voor zover van
      toepassing:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
  - number: 26.8.a
    text: |-
      een aanvulling op de verklaring van ingebruikneming of de verklaring van intredekeuring en ingebruikneming gegeven;
      of
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
  - number: 26.8.b
    text: een verklaring van ingebruikneming afgegeven indien het zesde lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
  - number: '26.9'
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van de wijze waarop reparaties en wijzigingen als bedoeld in het
      eerste lid, worden uitgevoerd, en onderzoeken en proeven, als bedoeld in het derde lid, nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel26
  - number: '27.1'
    text: |-
      Een NL-conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers trekt een door haar afgegeven
      verklaring van ingebruikneming, een verklaring van herkeuring of een verklaring van intredekeuring en
      ingebruikneming in, indien de drukapparatuur niet meer voldoet aan de eisen, bedoeld in de [artikelen 21][ref1],
      [22][ref2] of [23][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0038083#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0038083#Artikel23
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0038083
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0038083
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '27.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de inhoud en geldigheidsduur van de
      verklaringen en goedkeuringen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel27
  - number: '28.1'
    text: |-
      Als NL-conformiteitsbeoordelingsinstantie kunnen worden aangewezen de instellingen die voldoen aan de volgende
      eisen:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: 28.1.a
    text: artikel 24, tweede, derde, vierde, vijfde, zevende, achtste en negende lid, van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: 28.1.b
    text: |-
      zij zijn in staat alle conformiteitsbeoordelingstaken te verrichten waarvoor zij aangewezen zijn, ongeacht of deze
      taken door henzelf of namens hen en onder hun verantwoordelijkheid worden verricht;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: 28.1.c
    text: |-
      hun medewerkers zijn gebonden aan het beroepsgeheim ten aanzien van alle informatie waarvan zij kennisnemen bij de
      uitoefening van hun wettelijke taken, behalve ten opzichte van de bevoegde autoriteiten;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: 28.1.d
    text: |-
      zij beschikken over een registratiesysteem waarin de gegevens die samenhangen met en betrekking hebben op het
      verrichten van de conformiteitsbeoordelingstaken waarvoor zij aangewezen willen worden, naar behoren worden
      vastgelegd;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: 28.1.e
    text: |-
      zij hebben een schemabeheerder voor het ontwikkelen, onderhouden en publiekelijk en kosteloos toegankelijk maken
      van een schema, dat door hen onverkort wordt gebruikt. De schemabeheerder houdt naar behoren rekening met de
      belangen van alle partijen die belang hebben bij het schema, zonder dat één van de belangen de overhand heeft; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: 28.1.f
    text: |-
      indien zij conformiteitsbeoordelingstaken uitbesteden of door een dochteronderneming laten uitvoeren, is het
      bepaalde in [artikel 30][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel30
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '30'
        hoofdstuk: '5'
  - number: '28.2'
    text: 'Indien er meerdere NL-conformiteitsbeoordelingsinstanties zijn aangewezen:'
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: 28.2.a
    text: |-
      nemen zij deel aan het door hen gezamenlijk te organiseren overleg ten einde te komen tot het geharmoniseerd
      verrichten van de conformiteitsbeoordelingstaken waarvoor zij zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: 28.2.b
    text: |-
      wijzen zij een schemabeheerder aan voor het opstellen, onderhouden en publiekelijk en kosteloos toegankelijk maken
      van een gezamenlijk schema, dat door hen onverkort wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: 28.2.c
    text: |-
      hanteren zij de in het overleg genomen administratieve beslissingen en opgestelde documenten als algemene
      richtsnoeren; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: 28.2.d
    text: |-
      zorgen zij ervoor dat hun medewerkers die de conformiteitsbeoordelingstaken verrichten, op de hoogte zijn van de
      activiteiten, administratieve beslissingen en opgestelde documenten van het overleg.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: '28.3'
    text: 'NL-conformiteitsbeoordelingsinstanties brengen Onze Minister op de hoogte van:'
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: 28.3.a
    text: elke weigering, beperking, schorsing of intrekking van goedkeuringen;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: 28.3.b
    text: omstandigheden die van invloed zijn op de werkingssfeer van of de voorwaarden voor aanwijzing;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: 28.3.c
    text: informatieverzoeken over conformiteitsbeoordelingsactiviteiten die zij van Onze Minister ontvangen; of
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: 28.3.d
    text: |-
      op verzoek, de binnen de werkingssfeer van hun aanwijzing verrichte conformiteitsbeoordelingsactiviteiten en andere
      activiteiten waaronder uitbesteding.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: '28.4'
    text: |-
      NL-conformiteitsbeoordelingsinstanties verstrekken de andere uit hoofde van dit besluit aangewezen
      NL-conformiteitsbeoordelingsinstanties en NL-keuringsdiensten van gebruikers die soortgelijke
      conformiteitsbeoordelingsactiviteiten voor drukapparatuur verrichten, relevante informatie over negatieve
      conformiteitsbeoordelingsresultaten, en, op verzoek, over positieve conformiteitsbeoordelingsresultaten.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: '28.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel28
  - number: '29'
    text: 'Een NL-conformiteitsbeoordelingsinstantie is belast met de volgende taken, voor zover hiervoor aangewezen:'
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel29
  - number: 29.a
    text: |-
      de keuring voor ingebruikneming, bedoeld in [artikel 21][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel21
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 29.b
    text: |-
      de herkeuring, bedoeld in [artikel 22][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel22
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 29.c
    text: |-
      de intredekeuring, bedoeld in [artikel 23][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel23
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 29.d
    text: |-
      de beoordelingen en de onderzoeken bij voorgenomen en uitgevoerde wijzigingen en reparaties in de gebruiksfase,
      bedoeld in [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel26
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '30.1'
    text: |-
      Indien NL-conformiteitsbeoordelingsinstanties conformiteitsbeoordelingstaken uitbesteden of door een
      dochteronderneming laten uitvoeren, waarborgen zij dat de onderaannemer of dochteronderneming aan de criteria,
      bedoeld in [artikel 28, eerste, tweede, derde en vierde lid][ref1], voldoet, en brengen zij Onze Minister hiervan
      op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel28
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '28'
        hoofdstuk: '5'
  - number: '30.2'
    text: |-
      NL-conformiteitsbeoordelingsinstanties nemen de volledige verantwoordelijkheid op zich voor de
      conformiteitsbeoordelingstaken die worden verricht door een onderaannemer of dochteronderneming.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel30
  - number: '30.3'
    text: |-
      NL-conformiteitsbeoordelingsinstanties zorgen ervoor dat de activiteiten van een onderaannemer of
      dochteronderneming geen afbreuk doen aan de vertrouwelijkheid, objectiviteit en onpartijdigheid van de door henzelf
      te verrichten conformiteitsbeoordelingstaken.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel30
  - number: '30.4'
    text: |-
      Conformiteitsbeoordelingstaken mogen uitsluitend met instemming van de klant worden uitbesteed of door een
      dochteronderneming worden verricht.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel30
  - number: '30.5'
    text: |-
      NL-conformiteitsbeoordelingsinstanties houden alle relevante documenten betreffende de beoordeling van
      de kwalificaties van een onderaannemer of dochterondernemer en betreffende de door een onderaannemer of
      dochteronderneming uit hoofde van dit besluit verrichte conformiteitsbeoordelingstaken ter beschikking van de
      aanwijzende autoriteit.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel30
  - number: '31.1'
    text: 'Als NL-keuringsdienst van gebruikers kan worden aangewezen een keuringsdienst die voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: 31.1.a
    text: artikel 25, tweede tot en met negende lid, van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: 31.1.b
    text: zij zijn in staat alle conformiteitsbeoordelingstaken te verrichten waarvoor zij aangewezen zijn;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: 31.1.c
    text: |-
      hun medewerkers zijn gebonden aan het beroepsgeheim ten aanzien van alle informatie waarvan zij kennisnemen bij de
      uitoefening van hun wettelijke taken, behalve ten opzichte van de bevoegde autoriteiten;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: 31.1.d
    text: |-
      zij beschikken over een registratiesysteem waarin de gegevens die samenhangen met en betrekking hebben op het
      verrichten van de conformiteitsbeoordelingstaken waarvoor zij aangewezen willen worden, naar behoren worden
      vastgelegd;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: 31.1.e
    text: |-
      zij hebben een schemabeheerder voor het ontwikkelen, onderhouden en publiekelijk en kosteloos toegankelijk maken
      van een schema, dat door hen onverkort wordt gebruikt. De schemabeheerder houdt naar behoren rekening met de
      belangen van alle partijen die belang hebben bij het schema, zonder dat één van de belangen de overhand heeft; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: 31.1.f
    text: |-
      indien zij conformiteitsbeoordelingstaken uitbesteden of door een dochteronderneming laten uitvoeren, is het
      bepaalde in [artikel 30][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel30
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '30'
        hoofdstuk: '5'
  - number: '31.2'
    text: 'Indien er meerdere NL-keuringsdiensten voor gebruikers zijn aangewezen:'
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: 31.2.a
    text: |-
      nemen zij deel aan het door hen gezamenlijk te organiseren overleg ten einde te komen tot het geharmoniseerd
      verrichten van de conformiteitsbeoordelingstaken waarvoor zij zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: 31.2.b
    text: |-
      wijzen zij een schemabeheerder aan voor het opstellen en onderhouden van een gezamenlijk schema, dat door hen
      onverkort wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: 31.2.c
    text: |-
      hanteren zij de in het overleg genomen administratieve beslissingen en opgestelde documenten als algemene
      richtsnoeren; en
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: 31.2.d
    text: |-
      zorgen zij ervoor dat hun medewerkers die de conformiteitsbeoordelingstaken verrichten, op de hoogte zijn van de
      activiteiten, administratieve beslissingen en opgestelde documenten van het overleg.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: '31.3'
    text: 'NL-keuringsdiensten van gebruikers brengen Onze Minister op de hoogte van:'
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: 31.3.a
    text: elke weigering, beperking, schorsing of intrekking van goedkeuringen;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: 31.3.b
    text: omstandigheden die van invloed zijn op de werkingssfeer van of de voorwaarden voor aanwijzing;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: 31.3.c
    text: informatieverzoeken over conformiteitsbeoordelingsactiviteiten die zij van Onze Minister ontvangen; of
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: 31.3.d
    text: |-
      op verzoek, de binnen de werkingssfeer van hun aanwijzing verrichte conformiteitsbeoordelingsactiviteiten en andere
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: '31.4'
    text: |-
      NL-keuringsdiensten van gebruikers verstrekken de andere uit hoofde van dit besluit aangewezen NL-keuringsdiensten
      van gebruikers en NL-conformiteitsbeoordelingsinstanties die soortgelijke conformiteitsbeoordelingsactiviteiten
      voor drukapparatuur verrichten, relevante informatie over negatieve conformiteitsbeoordelingsresultaten, en, op
      verzoek, over positieve conformiteitsbeoordelingsresultaten.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: '31.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: '31.6'
    text: |-
      Een NL-keuringsdienst van gebruikers die deel uitmaakt van een mijnbouwonderneming, wordt aangewezen door Onze
      Minister in overeenstemming met Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel31
  - number: '32.1'
    text: |-
      Een NL-keuringsdienst van gebruikers werkt uitsluitend voor de groep waarvan hij deel uitmaakt, welke groep een
      gemeenschappelijk veiligheidsbeleid hanteert ten aanzien van de technische specificaties voor ontwerp, fabricage,
      controle, onderhoud en gebruik van drukapparatuur en samenstellen.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel32
  - number: '32.2'
    text: 'Een NL-keuringsdienst van gebruikers is belast met de volgende taken voor zover hiervoor aangewezen:'
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel32
  - number: 32.2.a
    text: |-
      de keuring voor ingebruikneming, bedoeld in [artikel 21][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel21
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 32.2.b
    text: |-
      de herkeuring, bedoeld in [artikel 22][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel22
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 32.2.c
    text: |-
      de intredekeuring, bedoeld in [artikel 23][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel23
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 32.2.d
    text: |-
      de beoordelingen en de onderzoeken bij voorgenomen en uitgevoerde wijzigingen en reparaties in de gebruiksfase,
      bedoeld in [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel26
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '33.1'
    text: |-
      De NL-conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers dienen de aanvraag tot aanwijzing in
      bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel33
  - number: '33.2'
    text: |-
      Een NL-conformiteitsbeoordelingsinstantie toont aan dat zij voldoet aan de criteria, genoemd in
      [artikelen 28, eerste, tweede, derde en vierde lid][ref1], en [30][ref2], door middel van een accreditatie tegen de
      van toepassing zijnde geharmoniseerde normen of delen daarvan, mits die normen de eerdergenoemde eisen dekken en de
      referentienummers van die normen in het Publicatieblad van de Europese Unie zijn bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0038083#Artikel30
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '28'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0038083
        artikel: '30'
        hoofdstuk: '5'
  - number: '33.3'
    text: |-
      Een NL-keuringsdienst van gebruikers toont aan dat zij voldoet aan de eisen, genoemd in de [artikelen 30][ref1] en
      [31, eerste, tweede, derde en vierde lid][ref2], door middel van een accreditatie tegen de van toepassing zijnde
      geharmoniseerde normen of delen daarvan, mits die normen de eerdergenoemde eisen dekken en de referentienummers van
      die normen in het Publicatieblad van de Europese Unie zijn bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0038083#Artikel31
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '30'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0038083
        artikel: '31'
        hoofdstuk: '5'
  - number: '33.4'
    text: |-
      Indien de NL-conformiteitsbeoordelingsinstantie of NL-keuringsdienst van gebruikers geen bewijs van accreditatie
      kan overleggen, verschaft zij Onze Minister alle bewijsstukken die nodig zijn om aan te tonen dat zij voldoet aan
      de criteria, genoemd in het tweede dan wel derde lid.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel33
  - number: '33.5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de accreditatie, bedoeld in het
      tweede, derde of vierde lid, en de indiening en afhandeling van aanvraag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel33
  - number: '34.1'
    text: |-
      Een aanwijzing als NL-conformiteitsbeoordelingsinstantie of NL-keuringsdienst van gebruikers wordt geweigerd,
      indien de aanvrager niet heeft voldaan aan het bepaalde bij of krachtens de [artikelen 28][ref1], [29][ref2],
      [30][ref3] of [31][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0038083#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0038083#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0038083#Artikel31
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '28'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0038083
        artikel: '29'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0038083
        artikel: '30'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0038083
        artikel: '31'
        hoofdstuk: '5'
  - number: '34.2'
    text: |-
      Een aanwijzing kan worden geschorst, ten nadele van de NL-conformiteitsbeoordelingsinstantie of NL-keuringsdienst
      van gebruikers worden gewijzigd of ingetrokken:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel34
  - number: 34.2.a
    text: |-
      op grond van door de NL-conformiteitsbeoordelingsinstantie of NL-keuringsdienst van gebruikers verstrekte onjuiste
      inlichtingen over feiten of omstandigheden, mits de onjuistheid daarvan aan die instantie of dienst bekend was of
      kon zijn;
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel34
  - number: 34.2.b
    text: |-
      indien niet meer is voldaan aan het bepaalde bij of krachtens de [artikelen 28][ref1], [29][ref2] en [30][ref3],
      voor zover het betreft de NL-conformiteitsbeoordelingsinstantie of de artikelen 30, [31][ref4] en [32][ref5], voor
      zover het betreft de NL-keuringsdienst van gebruikers; of


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0038083#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0038083#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0038083#Artikel31
      [ref5]: https://wetten.overheid.nl/BWBR0038083#Artikel32
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '28'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0038083
        artikel: '29'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0038083
        artikel: '30'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0038083
        artikel: '31'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0038083
        artikel: '32'
        hoofdstuk: '5'
  - number: 34.2.c
    text: |-
      indien de NL-conformiteitsbeoordelingsinstantie of NL-keuringsdienst van gebruikers haar wettelijke verplichtingen
      niet meer naar behoren nakomt of de taken waarvoor zij is aangewezen, niet meer naar behoren uitvoert.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel34
  - number: '35.1'
    text: |-
      Tijdens de looptijd van de aanwijzing stelt Onze Minister periodiek vast of de NL-
      conformiteitsbeoordelingsinstantie en NL-keuringsdienst van gebruikers:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel35
  - number: 35.1.a
    text: |-
      nog voldoen aan het bepaalde bij of krachtens de de [artikelen 28][ref1], [29][ref2] en [30][ref3], voor zover het
      betreft de NL- conformiteitsbeoordelingsinstantie, en de artikelen 30, [31][ref4] en [32][ref5], voor zover het
      betreft de NL- keuringsdienst van gebruikers; en


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0038083#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0038083#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0038083#Artikel31
      [ref5]: https://wetten.overheid.nl/BWBR0038083#Artikel32
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '28'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0038083
        artikel: '29'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0038083
        artikel: '30'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0038083
        artikel: '31'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0038083
        artikel: '32'
        hoofdstuk: '5'
  - number: 35.1.b
    text: |-
      hun wettelijke verplichtingen naar behoren nakomen en de taken waarvoor zij zijn aangewezen, naar behoren
      uitvoeren.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel35
  - number: '35.2'
    text: |-
      Bij ministeriele regeling worden nadere regels gesteld betreffende het kosteloos gegevens en inlichtingen
      verstrekken door de NL-conformiteitsbeoordelingsinstantie of NL-keuringsdienst van gebruikers aan Onze Minister of
      de nationale accreditatie-instantie respectievelijk door Onze Minister of de nationale accreditatie-instantie aan
      de NL-conformiteitsbeoordelingsinstantie of NL-keuringsdienst van gebruikers, die zijn verkregen door de uitvoering
      of het toezicht op de naleving van het bepaalde bij of krachtens de [wet][ref1], welke noodzakelijk zijn voor de
      uitvoering van hun wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: '35.3'
    text: |-
      Een NL-conformiteitsbeoordelingsinstantie die haar taken waarvoor zij is aangewezen, beëindigt, of waarvan
      de aanwijzing door Onze Minister wordt ingetrokken, is verplicht tijdig voorafgaand aan de beëindiging van de
      werkzaamheden respectievelijk de datum, waarop de aanwijzing eindigt, haar dossiers over te dragen aan een andere
      NL-conformiteitsbeoordelingsinstantie waarmee de marktdeelnemer een overeenkomst is aangegaan. Indien er geen
      andere NL-conformiteitsbeoordelingsinstantie is, draagt de NL-conformiteitsbeoordelingsinstantie de dossiers over
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel35
  - number: '36.1'
    text: |-
      Een inspectieafdeling van de gebruiker werkt uitsluitend voor de groep waarvan de inspectieafdeling deel uitmaakt.
      Deze groep hanteert een gemeenschappelijk veiligheidsbeleid ten aanzien van de technische specificaties voor
      ontwerp, fabricage, levering, installatie, gebruik, controle en onderhoud van drukapparatuur.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel36
  - number: '36.2'
    text: |-
      Onze Minister kan op verzoek ten aanzien van een inspectieafdeling van de gebruiker ontheffing verlenen van het
      eerste lid, eerste zin.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel36
  - number: '36.3'
    text: |-
      De inspectieafdeling van de gebruiker heeft een identificeerbare structuur en binnen de organisatie waar de
      inspectieafdeling deel van is, rapportagelijnen die haar onpartijdigheid waarborgen. De inspectieafdeling van
      de gebruiker en haar personeel mogen niet verantwoordelijk zijn voor ontwerp, fabricage, levering, installatie,
      gebruik, controle en onderhoud van drukapparatuur en geen activiteiten uitoefenen die strijdig zijn met de
      onafhankelijkheid van hun oordeel en met hun integriteit betreffende hun inspectieactiviteiten.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel36
  - number: '36.4'
    text: |-
      Een inspectieafdeling van de gebruiker hanteert een gecertificeerd kwaliteitsmanagementsysteem voor de uitoefening
      van haar taken.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel36
  - number: '36.5'
    text: |-
      Een inspectieafdeling van de gebruiker is bevoegd tot het uitoefenen, onder toezicht van een NL-
      conformiteitsbeoordelingsinstantie, van de volgende taken voor zover hiervoor gecertificeerd door die NL-
      conformiteitsbeoordelingsinstantie:
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel36
  - number: 36.5.a
    text: |-
      het verrichten van onderzoeken in het kader van herkeuringen als bedoeld in [artikel 22, zesde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel22
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 36.5.b
    text: |-
      het verrichten van onderzoeken in het kader van voorgenomen reparaties als bedoeld in
      [artikel 26, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel26
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '36.6'
    text: |-
      De NL-conformiteitsbeoordelingsinstantie, bedoeld in het vijfde lid, stelt mede met gebruikmaking
      van een rapport van de inspectieafdeling van de gebruiker, de verklaring van herkeuring, bedoeld in
      [artikel 22, negende lid][ref1], onderscheidenlijk de aanvulling op de verklaring van ingebruikneming of de
      verklaring van intredekeuring en ingebruikneming, bedoeld in [artikel 26, achtste lid][ref2], op met betrekking tot
      de door de inspectieafdeling van de gebruiker verrichte inspecties.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0038083#Artikel26
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0038083
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0038083
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '40.1'
    text: |-
      Drukapparatuur die voldoet aan het [Warenwetbesluit drukapparatuur][ref1], zoals dat onmiddellijk vóór 19 juli 2016
      luidde en vóór dat tijdstip in de handel is gebracht, mag ook op en na dat tijdstip op de markt worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0010586
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0010586
  - number: '40.2'
    text: |-
      De aanwijzing als aangewezen instelling op verzoek als bedoeld in
      [artikel 19a van het Warenwetbesluit drukapparatuur][ref1], afgegeven op grond van de wet en geldend op de dag
      voorafgaand aan de datum van inwerkingtreding, genoemd in [artikel 42, tweede lid,][ref2] van dit besluit, wordt
      geacht te zijn afgegeven met inachtneming van de bij of krachtens dit besluit gestelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0038083#Artikel42
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 19a
      - id: ref2
        bwb_id: BWBR0038083
        artikel: '42'
        hoofdstuk: '7'
  - number: '40.3'
    text: |-
      Een verklaring of goedkeuring genoemd in [artikel 19 van het Warenwetbesluit drukapparatuur][ref1], en geldend
      op de dag, onmiddellijk voorafgaand aan de datum van inwerkingtreding, genoemd in [artikel 42, tweede lid][ref2],
      wordt geacht te zijn afgegeven met inachtneming van de bij of krachtens dit besluit gestelde bepalingen,
      onverminderd het bepaalde bij of krachtens [artikel 11][ref3], [12][ref4] en [27][ref5].


