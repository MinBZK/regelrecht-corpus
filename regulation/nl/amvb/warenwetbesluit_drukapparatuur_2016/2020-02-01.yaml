  - number: '1.2'
    text: |-
      Dit besluit is niet van toepassing op drukapparatuur en samenstellen als bedoeld in artikel 1, tweede lid, van
      de richtlijn.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden drukapparatuur en samenstellen in de handel te brengen, in bedrijf te stellen, op de markt aan te
      bieden of te gebruiken die niet voldoen aan de bij of krachtens dit besluit gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden drukapparatuur en samenstellen in de handel te brengen of op de markt aan te bieden anders dan
      met inachtneming van de bij of krachtens dit besluit gestelde voorschriften met betrekking tot het bezigen van
      vermeldingen of aanduidingen.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden drukapparatuur en samenstellen in de handel te brengen, in bedrijf te stellen, op de markt aan te
      bieden of te gebruiken, indien de bij of krachtens dit besluit voorgeschreven conformiteitsbeoordelingsprocedures
      niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel2
  - number: '2.4'
    text: |-
      Het is verboden drukapparatuur en samenstellen te gebruiken anders dan met inachtneming van de voorschriften bij of
      krachtens dit besluit gesteld met betrekking tot het voorhanden zijn van documenten.
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel2
  - number: '3'
    text: |-
      Dit hoofdstuk, met uitzondering van de [artikelen 4, eerste lid, onder a, en tweede lid][ref1],
      [6, eerste lid, onder a, en tweede lid][ref2], en [7, eerste lid, onder a, en tweede lid][ref3], is niet van
      toepassing op drukapparatuur en samenstellen als bedoeld in artikel 4, derde lid, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0038083#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0038083#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0038083#Artikel7
    url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#Artikel3
