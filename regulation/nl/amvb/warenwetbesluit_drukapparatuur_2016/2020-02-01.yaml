    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 18 maart 2016, nr. 2016-0000081054;

    Gelet op richtlijn nr. 2014/68/EU van het Europees Parlement en de Raad van 15 mei 2014 betreffende de harmonisatie
    van de wetgevingen van de lidstaten inzake het op de markt aanbieden van drukapparatuur (herschikking) (PbEU 2014,
    L 189; rectificatie PbEU 2015, L 157), alsmede op de artikelen 4, eerste lid, 5, tweede lid, 7, 7a, derde lid, 11,
    12, 13, 14 en 32b van de Warenwet, artikel 49 van de Mijnbouwwet, artikel 8.40 van de Wet milieubeheer, en artikel
    16, eerste, tweede en derde lid, van de Arbeidsomstandighedenwet;

    De Afdeling advisering van de Raad van State gehoord (advies van 25 april 2016, nr. W12.16.0061/III);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 13 juni 2016, nr. 2016-
    0000120386;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0038083/2020-02-01#ArtikelAanhef
