        artikel: '2'
  - number: '6'
    text: |-
      1 De meerwaarden, bedoeld in [artikel 2, onderdeel g][ref1], worden niet meegeteld dan nadat daarvoor toestemming
      van de Pensioen- & Verzekeringskamer is verkregen.

      2 Maximaal vijftig procent van de meerwaarden op grond van een positief resultaat wordt meegeteld tot een maximum
      van vijfentwintig procent van het totaal van het eigen vermogen of het minimumbedrag van het eigen vermogen,
      naargelang welk bedrag het laagst is.

      3 Het positief resultaat wordt verkregen door het geschatte jaarresultaat te vermenigvuldigen met een factor die
      de gemiddelde resterende looptijd van de overeenkomsten vertegenwoordigt en ten hoogste zes bedraagt. Het geschatte
      positieve jaarresultaat bedraagt maximaal het gemiddelde van de positieve resultaten die de laatste vijf boekjaren
      zijn gemaakt op de werkzaamheden.

      4 De Pensioen- & Verzekeringskamer kan toestemming verlenen voor het meetellen van de meerwaarden op grond van een
      positief resultaat wanneer:

      a. het pensioenfonds een actuarieel verslag overlegt waaruit blijkt dat de positieve resultaten in de toekomst naar
      alle waarschijnlijkheid ook daadwerkelijk zullen worden gerealiseerd; en

      b. niet reeds rekening is gehouden met de toekomstige positieve resultaten die voortvloeien uit de latente netto
      meerwaarden, bedoeld in het vijfde lid.

      5 De latente netto meerwaarden die voortvloeien uit de waardering van de activa worden meegeteld voorzover deze
      netto reserves geen uitzonderlijk karakter hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0019490#Artikel2
    url: https://wetten.overheid.nl/BWBR0019490/2006-02-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019490
        artikel: '2'
  - number: '7'
    text: |-
      Van het obligo van het geplaatste kapitaal of van het in aandelen verdeelde waarborgkapitaal wordt de helft
      meegeteld tot een maximum van vijftig procent van het eigen vermogen of het minimumbedrag van het eigen vermogen,
      naargelang welk bedrag het laagst is, wanneer van het geplaatste kapitaal minimaal vijfentwintig procent is
      gestort.
    url: https://wetten.overheid.nl/BWBR0019490/2006-02-08#Artikel7
  - number: '8'
    text: |-
      1 Het minimumbedrag van het eigen vermogen bedraagt het totaal van de in dit artikel beschreven berekeningen.

      2 Voor pensioenregelingen waarbij door het pensioenfonds beleggingsrisico wordt gelopen wordt vier procent van de
      bruto technische voorzieningen vermenigvuldigd met de verhouding tussen de bruto technische voorzieningen onder
      aftrek van de overdrachten uit hoofde van herverzekering en de bruto technische voorzieningen aan het eind van het
      afgelopen boekjaar. Dit verhoudingsgetal is ten minste vijfentachtig procent.

      3 Voor pensioenregelingen waarbij door het fonds geen beleggingsrisico wordt gelopen en waarbij de beheerslasten
      voor een periode van meer dan vijf jaar zijn vastgelegd wordt één procent van de technische voorzieningen aan het
      einde van het boekjaar gerekend.

      4 Voor pensioenregelingen waarbij door het pensioenfonds geen beleggingsrisico wordt gelopen en waarbij de
      beheerslasten voor een periode van vijf jaar of minder zijn vastgelegd wordt vijfentwintig procent van de netto
      beheerslasten in verband met de bedrijfsuitoefening in het afgelopen boekjaar gerekend.

      5 Voor pensioenregelingen met risicokapitaal wordt 0,3 procent van het risicokapitaal bij overlijden
      vermenigvuldigd met de verhouding tussen het risicokapitaal onder aftrek van de overdrachten uit hoofde van
      herverzekering en het risicokapitaal in het afgelopen boekjaar. Dit verhoudingsgetal is ten minste vijftig procent.

      6 Voor aanvullende pensioenregelingen wordt de hoogste uitkomst van de volgende berekeningen gerekend:

      a. achttien procent van de in het afgelopen boekjaar geboekte dan wel verdiende premies, naargelang welk bedrag
      het hoogst is en van de in rekening gebrachte poliskosten, voor zover deze premies en kosten niet meer bedragen
      dan € 50 miljoen, vermeerderd met zestien procent van deze premies en kosten voor zover deze meer bedragen dan € 50
      miljoen. De uitkomst van deze berekening wordt vermenigvuldigd met de verhouding tussen de schaden die voor eigen
      rekening komen van de verzekeraar na overdracht uit hoofde van herverzekering en de bruto schaden in de afgelopen
      drie boekjaren. Dit verhoudingsgetal is ten minste vijftig procent;

      b. zesentwintig procent van de gemiddeld geboekte bruto schaden in de afgelopen drie boekjaren en van de gemiddelde
      toevoeging aan de schadevoorziening in deze jaren, voor zover deze schaden en toevoeging niet meer bedragen dan
      € 35 miljoen, vermeerderd met drieëntwintig procent van deze schaden en toevoeging, voor zover deze meer bedragen
      dan € 35 miljoen. De uitkomst van deze berekening wordt vermenigvuldigd met de verhouding tussen de schaden die
      voor eigen rekening komen van de verzekeraar na overdracht uit hoofde van herverzekering en de bruto schaden in de
      afgelopen drie boekjaren. Dit verhoudingsgetal is ten minste vijftig procent.

      7 Indien de hoogste uitkomst van de berekeningen, bedoeld in het zesde lid, lager is dan in het afgelopen boekjaar,
      is de uitkomst ten minste gelijk aan de uitkomst van het afgelopen boekjaar vermenigvuldigd met de verhouding
      tussen de technische voorzieningen voor te betalen schaden onder aftrek van de overdrachten uit herverzekering
      aan het einde van het afgelopen boekjaar en de technische voorzieningen voor te betalen schaden onder aftrek van
      de overdrachten uit herverzekering aan het begin van het afgelopen boekjaar. Dit verhoudingsgetal is ten hoogste
      honderd procent.

      8 De Pensioen- & Verzekeringskamer kan tegen de op herverzekering gebaseerde verlaging van het minimumbedrag van
      het eigen vermogen overeenkomstig het tweede, vijfde, zesde en zevende lid, bedenkingen naar voren brengen indien:

      a. de aard of de kwaliteit van de overdracht uit hoofde van herverzekering sinds het afgelopen boekjaar sterk is
      gewijzigd; of

      b. er nauwelijks of geen risico-overdracht plaatsvindt uit hoofde van herverzekering.
    url: https://wetten.overheid.nl/BWBR0019490/2006-02-08#Artikel8
