articles:
  - number: '1'
    text: |-
      In dit besluit wordt onder pensioenfonds verstaan:

      a. pensioenfonds als bedoeld in [artikel 9a, derde lid, van de Pensioen- & spaarfondsenwet][ref1]; en

      b. beroepspensioenfonds als bedoeld in [artikel 59, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel59
    url: https://wetten.overheid.nl/BWBR0019490/2006-02-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 9a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '59'
  - number: '2'
    text: |-
      1 Het eigen vermogen van een pensioenfonds wordt met name gevormd door de volgende vermogensbestanddelen:

      a. het gestorte aandelenkapitaal of waarborgkapitaal vermeerderd met de ledenrekeningen;

      b. de reserves;

      c. het onverdeelde positieve of negatieve resultaat;

      d. het cumulatief preferent aandelenkapitaal;

      e. de achtergestelde leningen;

      f. de effecten met onbepaalde looptijd en andere vermogensinstrumenten;

      g. de meerwaarden in verband met de onderwaardering van activa dan wel op grond van resultaatsverwachtingen van het
      pensioenfonds; en

      h. de helft van het obligo van het geplaatste kapitaal of van het in aandelen verdeeld waarborgkapitaal.

      2 Het eigen vermogen wordt verminderd met het bedrag van de eigen aandelen die rechtstreeks door het pensioenfonds
      worden gehouden en met het bedrag van de immateriële activa.
    url: https://wetten.overheid.nl/BWBR0019490/2006-02-08#Artikel2
  - number: '3'
    text: |-
      1 De ledenrekeningen, bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], worden alleen meegeteld, wanneer de
      statuten bepalen dat:

      a. vanaf deze rekeningen alleen betalingen aan de leden plaatsvinden als daardoor het eigen vermogen niet daalt
      beneden het vereiste niveau, dan wel bij liquidatie van het pensioenfonds, als alle andere schulden zijn voldaan;

      b. elke betaling vanaf deze ledenrekeningen voor andere doeleinden dan de individuele opzegging van het
      lidmaatschap niet eerder plaatsvindt dan nadat dertig dagen zijn verstreken na melding ervan aan de Pensioen- &
      Verzekeringskamer; en

      c. de Pensioen- & Verzekeringskamer tegen deze betalingen bedenkingen naar voren kan brengen aan welke bedenkingen
      het pensioenfonds tegemoet zal komen.

      2 De statutaire bepalingen met betrekking tot de ledenrekeningen worden niet gewijzigd dan nadat daarvoor
      toestemming van de Pensioen- & Verzekeringskamer is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0019490#Artikel2
    url: https://wetten.overheid.nl/BWBR0019490/2006-02-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019490
        artikel: '2'
  - number: '4'
    text: |-
      1 Het cumulatief preferent aandelenkapitaal en de achtergestelde leningen, bedoeld in
      [artikel 2, eerste lid, onderdelen d en e][ref1], worden meegeteld tot een maximum van vijftig procent van het
      totaal van het eigen vermogen of het minimumbedrag van het eigen vermogen, naargelang welk bedrag het laagst is,
      waarvan niet meer dan vijfentwintig procent in de vorm van achtergestelde leningen met vaste looptijd, of het
      cumulatief preferent aandelenkapitaal met vaste termijn, mits bindende overeenkomsten gelden op grond waarvan, in
      geval van liquidatie van het pensioenfonds, de achtergestelde leningen of preferente aandelen achtergesteld worden
      bij de vorderingen van alle andere crediteuren en pas worden terugbetaald als alle andere schulden zijn voldaan.

      2 De achtergestelde leningen worden meegeteld voor zover bedragen zijn gestort.

      3 Achtergestelde leningen met een vaste looptijd worden meegeteld als de oorspronkelijke looptijd ten minste vijf
      jaar bedraagt. Uiterlijk een jaar voor de contractuele vervaldag legt het pensioenfonds een plan ter toestemming
      voor aan de Pensioen- & Verzekeringskamer waarin uiteen wordt gezet op welke wijze het eigen vermogen zal worden
      gehandhaafd of op de vervaldag op het vereiste niveau zal worden gebracht.

      4 Achtergestelde leningen zonder een vaste looptijd worden meegeteld als deze worden of zullen worden afgelost
      met een opzeggingstermijn van ten minste vijf jaar of de Pensioen- & Verzekeringskamer aflossing heeft toegestaan.
      Het verzoek om toestemming voor de aflossing wordt ten minste zes maanden voor de beoogde aflossingsdatum bij de
      Pensioen- & Verzekeringskamer ingediend.

      5 De leningsovereenkomst bevat geen bepaling op grond waarvan de achtergestelde lening voor het einde van de
      looptijd, anders dan bij liquidatie van het pensioenfonds, moet worden afgelost.

      6 In afwijking van het vijfde lid kan de Pensioen- & Verzekeringskamer toestemming verlenen voor vervroegde
      terugbetaling van achtergestelde leningen met een vaste looptijd, wanneer het initiatief hiertoe uitgaat van het
      pensioenfonds en het eigen vermogen niet onder het vereiste niveau daalt.

      7 De leningsovereenkomst wordt niet gewijzigd dan nadat daarvoor toestemming van de Pensioen- & Verzekeringskamer
      is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0019490#Artikel2
    url: https://wetten.overheid.nl/BWBR0019490/2006-02-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019490
        artikel: '2'
  - number: '5'
    text: |-
      1 De effecten met onbepaalde looptijd en andere vermogensinstrumenten, bedoeld in
      [artikel 2, eerste lid, onderdeel f][ref1], worden voor het totaal van deze effecten en van de achtergestelde
      leningen, bedoeld in [artikel 2, eerste lid, onderdeel e][ref2], meegeteld tot een maximum van vijftig procent van
      het totaal van het eigen vermogen of het minimumbedrag van het eigen vermogen, naargelang welk bedrag het laagst
      is, voor zover:

      a. in de emissieovereenkomst is vastgelegd dat het pensioenfonds de rentebetaling uit kan stellen;

      b. de vorderingen op het pensioenfonds uit hoofde van de genoemde effecten zijn achtergesteld ten opzichte van
      overige vorderingen;

      c. in de emissieovereenkomst is vastgelegd dat verliezen kunnen worden gecompenseerd met het bedrag van de lening
      en nog te betalen rente; en

      d. bedragen zijn gestort.

      2 De aflossing van de effecten met onbepaalde looptijd en andere vermogensinstrumenten vindt niet plaats dan nadat
      daarvoor toestemming van de Pensioen- & Verzekeringskamer is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0019490#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019490#Artikel2
    url: https://wetten.overheid.nl/BWBR0019490/2006-02-08#Artikel5
    references:
