  - number: '35'
    text: |-
      1 Indien de ambtenaar van 57 jaar of ouder op diens aanvraag wordt geplaatst in een functie waaraan een
      salarisschaal is verbonden met een lager maximumsalaris dan dat van de reeds voor hem geldende salarisschaal, wordt
      op zijn salaris een inhouding toegepast.

      2 De inhouding is gelijk aan het verschil tussen het salaris dat de ambtenaar geniet en het salaris dat
      de ambtenaar zou genieten bij inpassing in de bij de nieuwe functie behorende salarisschaal op hetzelfde
      salarisnummer. Indien dit salarisnummer in laatstbedoelde salarisschaal niet voorkomt, geschiedt de inpassing op
      het naastlagere salarisnummer.

      3 Indien na 52 weken ziekte de doorbetaling van de bezoldiging op grond van [artikel 54, eerste lid][ref1], wordt
      teruggebracht tot 70%, wordt de inhouding over die uren opgeschort voor de duur van de ziekte.

      4 Inhouding vindt niet plaats indien de in het eerste lid bedoelde functie wordt opgedragen op grond van
      [artikel 27][ref2] of [29][ref3], tenzij betrokkene uitsluitend zijn voorkeur heeft kenbaar gemaakt voor functies
      waaraan een salarisschaal verbonden is met een lager maximumsalaris dan de reeds voor hem geldende salarisschaal,
      ondanks de beschikbaarheid van een passende functie waaraan een salarisschaal is verbonden die ten minste gelijk is
      aan de salarisschaal die voor betrokkene geldt.

      5 In bijzondere gevallen kan geheel of gedeeltelijk van inhouding worden afzien.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel54
