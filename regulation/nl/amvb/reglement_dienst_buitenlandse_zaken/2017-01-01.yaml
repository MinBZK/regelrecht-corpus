  - number: '93'
    text: |-
      1 Onverminderd het bepaalde in [artikel 87, eerste lid, onder k, eerste zinsdeel][ref1], kan de ambtenaar in zijn
      ambt worden geschorst:

      a. indien een strafrechtelijke vervolging ter zake van misdrijf tegen hem is ingesteld;

      b. wanneer hem het voornemen tot bestraffing met onvoorwaardelijk ontslag is te kennen gegeven, dan wel hem die
      straf is opgelegd;

      c. wanneer het belang van de dienst dat vordert.

      2 Schorsing geschiedt door Onze Minister.

      3 Schorsing van een buiten Nederland geplaatste ambtenaar gaat gepaard met terugroeping naar Nederland,
      met verlening van een tegemoetkoming in de verplaatsingskosten tot ten hoogste het bedrag dat in geval van
      overplaatsing in het belang van de dienst zou kunnen worden verleend op grond van de krachtens [artikel 36][ref2]
      gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel36
