      1 De ambtenaar die de hem opgelegde verplichtingen niet nakomt of zich overigens aan plichtsverzuim schuldig maakt,
      kan daarvoor disciplinair worden gestraft.

      2 Plichtsverzuim omvat zowel het overtreden van enig voorschrift, als het doen of nalaten van iets dat een goed
      ambtenaar in gelijke omstandigheden behoort na te laten of te doen.

      3 Tenzij door Ons of met Onze machtiging door Onze Minister anders is bepaald, wordt de straf opgelegd
      door het gezag, dat bevoegd is tot aanstelling in de door de ambtenaar vervulde functie. Indien deze
      bevoegdheid bij Ons berust, geschiedt de bestraffing, behalve voor zover betreft de straffen genoemd in
      [artikel 87, eerste lid, onder i en l][ref1], door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel87
