  - number: '6'
    text: |-
      1 De Dienst Buitenlandse Zaken heeft tot taak, het beleid ter zake van de door het Koninkrijk met het buitenland
      onderhouden betrekkingen en de door de regering bevorderde ontwikkeling van de internationale rechtsorde,
      ambtelijk voor te bereiden, gestalte te geven, te coördineren en tot uitvoering te brengen; hij staat
      daartoe onder leiding van Onze Minister, met inachtneming van de verantwoordelijkheden van Onze Minister voor
      Buitenlandse Handel en Ontwikkelingssamenwerking, alsmede van Onze Minister van Economische Zaken ingevolge het
      [vijfde lid van artikel 12][ref1].

      2 Met inachtneming van het volkenrecht, in het bijzonder de voor het Koninkrijk, Nederland, Aruba, Curaçao of Sint
      Maarten bindende internationale verdragen en andere overeenkomsten alsmede de buitenlandse wetten en gebruiken,
      omvat de in het eerste lid genoemde taak mede:

      a. het vertegenwoordigen van het Koninkrijk buiten zijn grondgebied;

      b. het uitdragen en toelichten van het beleid van het Koninkrijk ten aanzien van internationale vraagstukken en
      ontwikkelingen;

      c. het behartigen en beschermen van de belangen van het Koninkrijk, van Nederlanders en van rechtspersonen van
      Nederland, Aruba, Curaçao en Sint Maarten buiten het grondgebied van het Koninkrijk;

      d. het verzamelen, verwerken en verstrekken van inlichtingen omtrent internationale ontwikkelingen ten behoeve van
      de overheid van Nederland, Aruba, Curaçao en Sint Maarten, van Nederlanders en van rechtspersonen van Nederland,
      Aruba, Curaçao en Sint Maarten;

      e. het verrichten van de gerechtelijke, buitengerechtelijke en administratieve handelingen en werkzaamheden welke
      krachtens internationale overeenkomsten en de wetten en voorschriften van het Koninkrijk aan ambtenaren die in
      diplomatieke of consulaire functies zijn aangesteld, zijn opgedragen en waartoe zij bevoegd zijn verklaard;

      f. andere bij koninklijk besluit, dan wel door de regering, door tussenkomst van Onze Minister, aan
      vertegenwoordigingen van het Koninkrijk in het buitenland op te dragen werkzaamheden welke met het buitenlands
      beleid dan wel de bevordering van de internationale rechtsorde samenhangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel12
