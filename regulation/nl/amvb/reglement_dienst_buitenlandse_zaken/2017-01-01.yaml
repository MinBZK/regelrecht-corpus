  - number: '36'
    text: |-
      1 a. De ambtenaar die geplaatst is bij een vertegenwoordiging van het Koninkrijk in het buitenland, heeft op
      grond van bij ministeriële regeling gestelde regels aanspraak op tegemoetkomingen in de kosten van hemzelf en zijn
      gezinsleden, welke verband houden met het verblijf buiten Nederland, alsmede de kosten welke verband houden met de
      aard en het niveau van de functie. Bedoelde tegemoetkomingen strekken ter bestrijding van beroepskosten.

      b. In dit artikel wordt onder overplaatsing verstaan: een plaatsing bij een vertegenwoordiging van het Koninkrijk
      in het buitenland dan wel, volgende op een dergelijke plaatsing, een plaatsing in Nederland.

      2 Aan de ambtenaar die wordt overgeplaatst, wordt een tegemoetkoming verleend in de daarmee verband houdende kosten
      van betrokkene zelf en de hem vergezellende gezinsleden, op grond van de bij ministeriële regeling gestelde regels.

      3 De ambtenaar die, uit het buitenland komende, in Nederland is geplaatst en voor wie uit die plaatsing bijzondere
      kosten voortvloeien, wordt een tegemoetkoming toegekend in die kosten, op grond van de bij ministeriële regeling
      gestelde regels.

      4 a. Indien de in [artikel 23b, zevende lid, onderdeel a, respectievelijk b,][ref1] bedoelde gezinsleden geen
      gebruik hebben gemaakt van de in die bepalingen vermelde gelegenheid tot geneeskundig onderzoek, dan wel indien
      zij na onderzoek niet geschikt zijn verklaard voor verblijf in het desbetreffende land, respectievelijk voor
      verblijf overal ter wereld, heeft de betrokken ambtenaar ten aanzien van die gezinsleden geen aanspraak op
      vergoedingen op grond van bepalingen die in of krachtens dit reglement zijn gesteld ten behoeve van vergezellende
      gezinsleden bij plaatsing van de ambtenaar buiten Nederland, voor zover die bepalingen direct verband houden met de
      gezondheidstoestand van gezinsleden.

      b. Voor de toepassing van onderdeel a worden onder gezinslid tevens verstaan degenen die eerst tijdens het
      dienstverband van de ambtenaar diens gezinslid worden of zijn geworden.

      c. In bijzondere gevallen kan geheel of gedeeltelijk en al dan niet onder het opleggen van voorwaarden worden
      afgeweken van onderdeel a.

      5 Onze Minister bepaalt per geval in welke muntsoort of muntsoorten de tegemoetkomingen worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel23b
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel36
