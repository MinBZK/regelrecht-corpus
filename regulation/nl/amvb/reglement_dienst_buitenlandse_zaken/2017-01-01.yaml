  - number: '99'
    text: |-
      1 De ambtenaar kan in het kader van een reorganisatie eervol ontslag worden verleend indien het niet mogelijk is
      gebleken om hem te herplaatsen in een passende functie.

      2 Aan de ambtenaar die in het kader van een reorganisatie is herplaatst kan alsnog het ontslag, bedoeld in het
      eerste lid, worden verleend indien binnen een periode van uiterlijk een jaar te rekenen vanaf de datum waarop de
      functie is opgedragen, blijkt dat de desbetreffende functie niet passend is voor de ambtenaar en het niet mogelijk
      is hem binnen een redelijke termijn in een passende functie te plaatsen.

      3 Bij een ontslagverlening op grond van het eerste lid wordt een opzeggingstermijn van drie maanden in acht
      genomen. Bij een ontslagverlening op grond van het tweede lid geldt geen opzeggingstermijn.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel99
  - number: '100'
    text: |-
      1 Aan de ambtenaar kan eervol ontslag worden verleend indien van hem in redelijkheid niet kan worden verlangd, dat
      hij zich zal voegen in zijn verplaatsing over een aanmerkelijke afstand ten gevolge van een verplaatsing van zijn
      functie.

      2 Aan de ambtenaar kan binnen een periode van uiterlijk een jaar nadat hij is verplaatst over een aanmerkelijke
      afstand, alsnog het ontslag, bedoeld in het eerste lid, worden verleend indien van hem in redelijkheid niet kan
      worden verlangd dat hij zich zal blijven voegen in zijn verplaatsing over een aanmerkelijke afstand tengevolge van
      een verplaatsing van zijn functie.

      3 De [artikelen 58g tot en met 58k](onbekend), [58n](onbekend) en [58o](onbekend) zijn op de ambtenaar van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel100
  - number: '101'
    text: |-
      1 Aan de ambtenaar die in verband met de aanvaarding van een functie in een publiekrechtelijk college, waarin
      hij is benoemd of verkozen, tijdelijk wordt ontheven van de waarneming van zijn ambt, wordt, indien hij ophoudt
      zodanige functie te vervullen en hij niet in actieve dienst kan worden hersteld, eervol ontslag verleend.

      2 Tenzij [artikel 46a, eerste lid][ref1], van toepassing is, wordt eervol ontslag eveneens verleend aan de
      ambtenaar, die na afloop van het verlof, verleend met toepassing van [artikel 46][ref2], uitgezonderd het vierde
      lid en in verband met het vervullen van een functie bij een internationale volkenrechtelijke organisatie, niet in
      actieve dienst kan worden hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel46a
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel46
