  - number: 23c
    text: |-
      1 Aan de betrokkene die is onderworpen aan een psychologisch onderzoek als bedoeld in
      [artikel 23, vierde lid, onderdeel a][ref1], wordt op zijn verzoek binnen twee weken na de vaststelling van de
      uitslag van het onderzoek inzage verleend in die uitslag. Dit vindt plaats in het kader van een nagesprek met de
      psycholoog die het onderzoek heeft verricht.

      2 Mededeling van de uitslag van het onderzoek aan Onze Minister blijft achterwege, indien de betrokkene uiterlijk
      een week nadat hij van de uitslag van het onderzoek heeft kennis genomen zijn wens daartoe schriftelijk heeft
      meegedeeld aan degene die met het onderzoek is belast.

      3 De uitslag van het onderzoek wordt niet eerder dan twee weken nadat betrokkene van de uitslag van het onderzoek
      heeft kennis genomen, medegedeeld aan Onze Minister, tenzij die mededeling op een eerder tijdstip nodig is en de
      betrokkene met die eerdere mededeling schriftelijk heeft ingestemd.

      4 Voor zover dit niet heeft plaatsgevonden overeenkomstig het bepaalde in het eerste lid heeft de betrokkene recht
      op een nagesprek met de psycholoog die het onderzoek heeft verricht.

      5 De betrokkene kan na afloop van het in het eerste en vierde lid bedoelde nagesprek afschrift
      nemen van de uitslag of daarvan een fotokopie krijgen overeenkomstig het in en krachtens
      [artikel 12 van de Wet openbaarheid van bestuur][ref2] bepaalde.

      6 De kosten van het onderzoek en van het nagesprek komen voor rekening van het Rijk. Hier te lande daartoe gemaakte
      reis- en verblijfkosten worden vergoed op de voet van het [Reisbesluit binnenland][ref3]. Buitenslands gemaakte
      reis- en verblijfkosten komen voor vergoeding in aanmerking voor zover daartoe vooraf door het bevoegd gezag is
      besloten.


