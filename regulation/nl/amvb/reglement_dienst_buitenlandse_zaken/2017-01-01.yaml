  - number: 149f
    text: |-
      1 Indien aan de ambtenaar met toepassing van [artikel 34, zevende lid][ref1], zoals dat artikellid luidde op
      31 december 2007, een salaris was toegekend overeenkomstig de bezoldiging van een staatssecretaris, wordt dat
      salaris gehandhaafd op het op die dag voor hem geldende niveau, met dien verstande dat het salaris wordt aangepast
      overeenkomstig algemene wijzigingen van het salaris van het burgerlijk rijkspersoneel.

      2 Indien het salaris is vastgesteld met toepassing van het eerste lid en de ambtenaar wordt geplaatst in een
      functie als bedoeld in [artikel 34, zevende lid][ref2], zoals dat artikellid luidt met ingang van 1 januari 2008,
      wordt de ambtenaar een maandelijkse toeslag toegekend ter grootte van het verschil tussen de som van het salaris en
      de toeslag, vastgesteld met toepassing van dat zevende lid, en het met toepassing van het eerste lid vastgestelde
      salaris.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel34
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel149f
