        artikel: '121'
        hoofdstuk: XVIII
        paragraaf: '2'
  - number: '123'
    text: |-
      1 Bij ministeriële regeling wordt voor elke vertegenwoordiging van het Koninkrijk in het buitenland het bepaalde
      in of krachtens dit hoofdstuk nader uitgewerkt, zodanig dat het geheel van arbeidsvoorwaarden en daarmee
      verbandhoudende voorzieningen voldoet aan de eisen van de lokale arbeidsmarkt en naar het oordeel van Onze Minister
      toereikend is.

      2 Bij de in [artikel 121][ref1] bedoelde ministeriële regeling wordt bepaald op welke wijze een ministeriële
      regeling als bedoeld in het eerste lid tot stand komt en de voorwaarden die daarbij in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel121
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel123
    references:
