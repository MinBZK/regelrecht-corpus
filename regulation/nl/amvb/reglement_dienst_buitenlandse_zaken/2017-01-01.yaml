  - number: '37'
    text: |-
      1 Met inachtneming van het bepaalde in dit hoofdstuk en van het bepaalde in of krachtens Nederlandse wetten,
      houdende regels tot beperking van de werktijd, worden voor de ambtenaar een arbeidstijdpatroon vastgesteld. Onder
      arbeidstijdpatroon wordt verstaan een van te voren bekendgemaakt schema van aanvang en einde van de dagelijkse
      werktijden gedurende een bepaalde periode. Het in de arbeidstijdpatroon opgenomen aantal te werken uren op
      jaarbasis kan niet hoger zijn dan gemiddeld 40 uur per week.

      2 De arbeidsduur bedraagt gemiddeld ten hoogste 36 uur per week. De werktijd wordt behoorlijk door rusttijd
      onderbroken. De ambtenaar kan een aanvraag indienen om de arbeidsduur in hele uren vast te stellen op meer dan
      gemiddeld 36 uur per week, waarbij een maximum geldt van gemiddeld 40 uur per week. Deze aanvraag wordt toegewezen,
      tenzij het dienstbelang zich daartegen verzet. Een aanvraag tot het vaststellen van de arbeidsduur op meer dan
      gemiddeld 36 uur per week wordt niet toegewezen voor:

      a. de ambtenaar van 57 jaar of ouder wiens gemiddelde wekelijkse werktijd op basis van [artikel 38][ref1] is
      teruggebracht;

      b. de ambtenaar die op basis van [artikel 45b][ref2] betaald ouderschapsverlof geniet;

      c. de ambtenaar die op basis van [artikel 46][ref3] buitengewoon verlof van lange duur geniet.

      3 Het aantal te werken uren per jaar bedraagt: het aantal kalenderdagen per jaar verminderd met het aantal
      zaterdagen en zondagen en niet op zaterdag of zondag vallende feestdagen, genoemd in het zevende lid, onder
      a, in dat jaar, vermenigvuldigd met 7,2 en vervolgens vermenigvuldigd met de voor de ambtenaar geldende
      arbeidsduurfactor.

      4 Het aantal te werken uren, bedoeld in het derde lid, wordt rekenkundig op hele uren afgerond.

      5 Aan de ambtenaar van 55 jaar en ouder wordt niet opgedragen dienst te verrichten tussen 22.00 uur en 06.00 uur,
      tenzij het een gedeelte van een dienst betreft die doorloopt na 22.00 uur en ten laatste eindigt om 24.00 uur.

      6 Van het vijfde lid kan voor de duur van telkens ten hoogste een jaar worden afgeweken indien de ambtenaar
      dit heeft aangevraagd dan wel zeer gewichtige redenen van dienstbelang hiertoe noodzaken, mits de deskundige
      persoon of de arbodienst daaromtrent een positief medisch advies heeft uitgebracht. In geval van plaatsing bij
      een vertegenwoordiging van het Koninkrijk in het buitenland is afwijking van het vijfde lid voor ten hoogste de
      duur van de plaatsing mogelijk zolang bovendien door de deskundige persoon of de arbodienst daaromtrent jaarlijks
      positief wordt geadviseerd.

      7 a. Geen dienst wordt geëist op zondagen, alsmede op de Nieuwjaarsdag, de Tweede Paasdag, de Hemelvaartsdag, de
      Tweede Pinksterdag, de beide Kerstdagen, de dag waarop de verjaardag van de Koning wordt gevierd en op 5 mei.

      b. Van onderdeel a kan slechts worden afgeweken indien het dienstbelang dit onvermijdelijk maakt en met
      inachtneming van het navolgende:

      1°. geen dienst wordt geëist op ten minste dertien zondagen per periode van zes maanden;

      2°. de ambtenaar wordt zo weinig mogelijk in zijn zondagsrust beperkt en hem wordt zoveel mogelijk de gelegenheid
      geboden op zondag en op de voor hem geldende kerkelijke feestdagen zijn kerk te bezoeken.

      c. De onderdelen a en b vinden ten aanzien van de zondag voor de ambtenaar die aan het hoofd van dienst heeft
      medegedeeld dat hij, in verband met zijn godsdienstige opvattingen, de wekelijkse rustdag op een andere dag dan de
      zondag viert, overeenkomstige toepassing voor die dag in plaats van ten aanzien van de zondag.

      d. Op zaterdag kan dienst worden geëist, mits de belangen van de dienst daartoe aanleiding geven.

      8 a. De ambtenaar van 18 jaar of ouder heeft een onafgebroken rusttijd van hetzij ten minste 36 uren in elke
      aaneengesloten tijdruimte van zeven maal 24 uren, hetzij ten minste 72 uren in elke aaneengesloten periode van 14
      maal 24 uren, welke rusttijd kan worden gesplitst in onafgebroken rustperioden van elk ten minste 32 uren.

      b. De ambtenaar van 16 of 17 jaar heeft een onafgebroken rusttijd van ten minste 36 uren in elke aaneengesloten
      tijdruimte van zeven maal 24 uren.

      9 Van het voor de ambtenaar vastgestelde arbeidstijdpatroon kan slechts worden afgeweken indien het dienstbelang
      dit onvermijdelijk maakt en – behoudens in geval van oorlog, oorlogsgevaar of andere buitengewone omstandigheden –
      mits ervoor wordt gezorgd, dat de ambtenaar in of over het desbetreffende tijdvak van zeven dagen een ononderbroken
      rusttijd van ten minste 36 uren geniet.

      10 In bijzondere gevallen kan van de vaststelling van een arbeidstijdpatroon als bedoeld in het eerste lid worden
      afgezien. In die gevallen vindt het tweede tot en met negende lid overeenkomstige toepassing.

      11 Indien de ambtenaar gedurende vier aaneengesloten weken wegens ziekte geheel of gedeeltelijk geen dienst heeft
      verricht, geldt met ingang van de dag onmiddellijk aansluitend op die vier weken voor zolang wegens ziekte geheel
      of gedeeltelijk geen dienst wordt verricht een arbeidstijdpatroon waarin het aantal te werken uren per week gelijk
      is aan 36 vermenigvuldigd met de voor de ambtenaar geldende arbeidsduurfactor.

      12 a. In overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan in uitzonderlijke
      gevallen van het tweede tot en met negende lid, alsmede van de tweede volzin van het tiende lid, worden afgeweken
      voor zover dat niet in strijd is met het bepaalde in of krachtens de [Arbeidstijdenwet][ref4].

      b. Ten aanzien van buiten Nederland geplaatste ambtenaren is de in onderdeel a bedoelde overeenstemming met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties niet vereist.

      13 Bij de vaststelling van een arbeidstijdpatroon voor degenen die bij een vertegenwoordiging van het Koninkrijk in
      het buitenland zijn geplaatst wordt rekening gehouden met dienst- en werktijden die bij een overheidsdienst in het
      desbetreffende land gelden; daarbij worden voorzieningen getroffen die ertoe strekken dat die vertegenwoordiging
      van het Koninkrijk in het buitenland ononderbroken bezet of bereikbaar is.

      14 Gedurende plaatsing in een functie bij een vertegenwoordiging van het Koninkrijk in het buitenland geldt in de
      regel een volledige arbeidsduur.

      15 Door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties op grond van
      [artikel 21, dertiende lid, van het ARAR][ref5] gestelde regels zijn van overeenkomstige toepassing op in Nederland
      werkzame ambtenaren. Voor de buiten Nederland werkzame ambtenaren kan Onze Minister ter zake van de uitvoering van
      het eerste tot en met veertiende lid nadere regels stellen.


