      1 De aanstelling geschiedt in vaste of tijdelijke dienst.

      2 De aanstelling geschiedt in vaste dienst, tenzij er grond is een aanstelling in tijdelijke dienst te verlenen.
      Bij ministeriële regeling kunnen nadere regels worden gesteld.

      3 De aanstelling geschiedt in de regel met het oogmerk van wisselende functievervulling op het departement en bij
      vertegenwoordigingen van het Koninkrijk in het buitenland.

      4 Degene die geen Nederlander is, kan slechts worden aangesteld indien:

      a. hem in Nederland rechtmatig verblijf is toegestaan als bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref1]
      en Onze Minister voor hem beschikt over een tewerkstellingsvergunning als bedoeld in de
      [Wet arbeid vreemdelingen][ref2], tenzij die tewerkstellingsvergunning krachtens laatstgenoemde wet niet is
      vereist, en

      b. aanstelling niet geschiedt met het in het derde lid genoemde oogmerk, maar met het oogmerk van functievervulling
      op het departement.

      5 Onder aanstelling in vaste dienst wordt tevens verstaan de indiensttreding van een ambtenaar in vaste dienst in
      algemene dienst van het rijk als bedoeld in [artikel 5a van het ARAR][ref3]. Voor de duur van het dienstverband bij
      het Ministerie van Buitenlandse Zaken is op betrokkene niet het [ARAR][ref4], maar dit reglement van toepassing.

      6 Onder aanstelling wordt niet verstaan een benoeming van een lid van de topmanagementgroep als bedoeld in
      [artikel 4, vijfde lid, onder a, van het ARAR][ref5].


