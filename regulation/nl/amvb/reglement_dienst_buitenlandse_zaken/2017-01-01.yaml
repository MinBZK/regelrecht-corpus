  - number: '94'
    text: |-
      1 Tijdens de schorsing kan de bezoldiging voor een derde gedeelte worden ingehouden. Na verloop van zes weken kan
      een verdere inhouding, ook van de volledige bezoldiging, plaatsvinden.

      Geen inhouding vindt plaats in geval van schorsing in het belang van de dienst als bedoeld in
      [artikel 93, eerste lid, onder c][ref1], van het doen opnemen in een psychiatrisch ziekenhuis of
      daarmede gelijk te stellen inrichting dan wel van politiebewaring of inverzekeringstelling als bedoeld in
      [artikel 57 van het Wetboek van Strafvordering][ref2], mits niet gevolgd door inbewaringstelling.

      2 De ingehouden bezoldiging kan alsnog geheel of gedeeltelijk aan de ambtenaar worden uitbetaald, indien de
      schorsing niet wordt gevolgd door een onvoorwaardelijk ontslag bij wijze van straf of ontslag op grond van
      [artikel 104, eerste lid, onderdeel d][ref3]. Op de aldus uit te keren bezoldiging worden in mindering gebracht
      de inkomsten, welke de ambtenaar sedert de schorsing heeft genoten uit arbeid die hij als gevolg van de schorsing
      heeft kunnen verrichten, tenzij dat onredelijk of onbillijk is.

      3 Het niet ingehouden gedeelte van de bezoldiging van de geschorste ambtenaar kan aan anderen worden uitbetaald.

      4 In geval van schorsing tijdens ziekte van de ambtenaar wordt onder bezoldiging verstaan, hetgeen daaronder voor
      de toepassing van [hoofdstuk X][ref4] wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel93
