  - number: '105'
    text: |-
      Indien aan de ambtenaar gedurende de tijd dat hij recht heeft op wachtgeld een voor hem passend geachte functie
      is aangeboden en die functie binnen een periode van uiterlijk een jaar, nadat hij haar is gaan vervullen, niet
      passend voor hem blijkt te zijn, kan hem binnen die periode op zijn aanvraag eervol ontslag uit die functie worden
      verleend, welk ontslag ten aanzien van zijn aanspraken op een wachtgeld wordt geacht niet door eigen toedoen te
      zijn verleend.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel105
  - number: 105a
    text: |-
      1 Aan de ambtenaar die ten gevolge van ziekte verhinderd is zijn arbeid te verrichten kan ontslag worden verleend,
      indien hij zonder deugdelijke grond weigert:

      a. gevolg te geven aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige gegeven redelijke
      voorschriften of mee te werken aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige
      getroffen maatregelen om hem in staat te stellen de eigen of passende andere arbeid te verrichten, of

      b. passende arbeid te verrichten waartoe het bevoegd gezag hem in de gelegenheid stelt, of

      c. zijn medewerking te verlenen aan het opstellen, evalueren of bijstellen van een plan van aanpak als bedoeld in
      [artikel 25, tweede lid, van de WIA][ref1], of

      d. een WIA- uitkering aan te vragen.

      2 Bij de beoordeling of er sprake is van een situatie als bedoeld in het eerste lid, kan het bevoegd gezag de
      uitslag van de beoordeling door het UWV van de claim in het kader van de WIA betrekken indien deze minder dan een
      jaar geleden heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel105a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
  - number: '106'
    text: |-
      1 Aan de ambtenaar in vaste dienst kan ook op andere gronden dan die in [artikel 104][ref1] zijn genoemd of
      waarnaar in dat artikel wordt verwezen, ontslag worden gegeven. Dat ontslag wordt eervol verleend.

      2 In geval van ontslag ingevolge het eerste lid wordt door het tot ontslagverlening bevoegde gezag
      een voorziening getroffen waarbij de ambtenaar een uitkering verleend wordt, die, naar het oordeel
      van dat bevoegde gezag, met het oog op de omstandigheden redelijk is te achten. Deze uitkering zal ten
      minste gelijk zijn aan het voor de ambtenaar geldende totaal van uitkeringen berekend op basis van de
      [Werkloosheidswet][ref2] en het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref3],
      als ware als gevolg van het ontslag geen sprake van verwijtbare werkloosheid als bedoeld in
      [artikel 24 van de Werkloosheidswet][ref4]. Voor zover door het bevoegd gezag ten gunste van de ambtenaar
      niet anders is beslist, zijn op de uitkering voor het overige de[ Werkloosheidswet][ref5] en het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref6] van overeenkomstige toepassing.

      3 Indien de ambtenaar ter zake van zijn ontslag ingevolge het eerste lid recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref7] of het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref8],
      wordt de in het tweede lid bedoelde uitkering met die uitkering verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel104
