  - number: 4a
    text: |-
      1 Berichten inzake het maandelijkse in geld vastgestelde loon en de jaaropgave aan de ambtenaar behoeven
      uitsluitend elektronisch te worden verzonden.

      2 De in het eerste lid bedoelde berichten worden niet uitsluitend elektronisch verzonden:

      a. indien de ambtenaar geen mogelijkheid heeft om kennis te nemen van een elektronisch verzonden bericht;

      b. bij ontslag of overlijden van de ambtenaar;

      c. op verzoek van de ambtenaar in het geval deze een zwaarwegend belang heeft bij incidentele verzending op andere
      wijze.

      3 Onze Minister kan, na overleg met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, nadere regels
      stellen over de wijze waarop de elektronische verzending geschiedt.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel4a
  - number: '5'
    text: |-
      1 Bij het Ministerie van Buitenlandse Zaken bestaat een Dienst Buitenlandse Zaken.

      2 De Dienst Buitenlandse Zaken bestaat uit:

      a. degenen die bij koninklijk besluit, dan wel door Onze Minister, als ambtenaar van de Dienst Buitenlandse Zaken
      zijn aangesteld;

      b. degenen die door Onze Minister als werknemer in dienst zijn genomen;

      c. degenen die bij koninklijk besluit, dan wel door Onze Minister, als honoraire consulaire ambtenaren zijn
      aangesteld, met inachtneming van het [tweede lid van artikel 132][ref1];

      d. degenen die door het hoofd van een der in [artikel 7][ref2] genoemde vertegenwoordigingen van het Koninkrijk
      in het buitenland bij die vertegenwoordiging van het Koninkrijk in het buitenland als honorair adviseur zijn
      aangesteld, met inachtneming van het [tweede lid van artikel 140][ref3].

      3 Met betrekking tot hun dienstverrichtingen worden voorts de in het
      [derde, vierde en zesde lid van artikel 8][ref4] genoemde gedetacheerden dan wel toegevoegden gelijkgesteld met
      degenen die tot de Dienst Buitenlandse Zaken behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel132
