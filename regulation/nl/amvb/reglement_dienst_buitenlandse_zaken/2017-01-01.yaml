        paragraaf: '2'
  - number: '45'
    text: |-
      1 De ambtenaar die zorg draagt voor een of meer personen als bedoeld in het vierde lid heeft aanspraak op
      zorgverlof bij calamiteiten met behoud van bezoldiging.

      2 Onder calamiteit wordt verstaan ziekte of een andere onverwachte gebeurtenis waardoor een noodsituatie ontstaat
      in de verzorging van een of meer van de in het vierde lid bedoelde personen.

      3 Het verlof is bedoeld als eerste opvang en voor het treffen van verdere voorzieningen en bedraagt maximaal een
      dag per calamiteit.

      4 De personen voor wier verzorging het verlof kan worden verleend zijn: de huwelijkspartner, ouders, stiefouders,
      pleegouders, schoonouders, kinderen, stiefkinderen, pleegkinderen of aangehuwd kinderen van de ambtenaar.

      5 De ambtenaar informeert het bevoegd gezag vooraf over het opnemen van het verlof onder vermelding van de reden.

      6 Geëist kan worden dat de ambtenaar achteraf aannemelijk maakt dat daadwerkelijk sprake was van een noodsituatie.
      Indien de ambtenaar dat niet aannemelijk maakt, kunnen de opgenomen uren in mindering worden gebracht op zijn
      vakantie-aanspraken.

      7 Voor de toepassing van dit artikel is [het derde lid van artikel 43e][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel43e
