  - number: 46a
    text: |-
      1 De ambtenaar die na afloop van hem verleend buitengewoon verlof van lange duur en zonder dat dit is verlengd,
      zijn dienst niet tijdig hervat, wordt voor de toepassing van dit reglement geacht een aanvraag tot ontslag te
      hebben ingediend.

      2 Het eerste lid is niet van toepassing, indien de ambtenaar binnen een redelijke termijn aannemelijk maakt dat hij
      geldige redenen had zijn dienst niet te hervatten, in welk geval het verlof geacht wordt te zijn verlengd tot het
      tijdstip, waarop bedoelde geldige redenen hebben opgehouden te bestaan.
