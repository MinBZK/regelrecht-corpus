  - number: '51'
    text: |-
      1 Bij plaatsing buiten Nederland geschiedt het door de ambtenaar raadplegen van de deskundige persoon of de
      arbodienst in het kader van het arbeidsgezondheidskundig spreekuur schriftelijk, in dringende gevallen met
      gebruikmaking van de telecommunicatiemiddelen van het Ministerie van Buitenlandse Zaken, voor rekening van het
      Rijk.

      2 De ambtenaar wordt in elk geval in verband met zijn plaatsing buiten Nederland, in overleg met of op aanwijzing
      van de deskundige persoon of de arbodienst onderworpen aan een periodiek arbeidsgezondheidskundig onderzoek als
      bedoeld in [artikel 50a, eerste lid, onderdeel i][ref1]. Een buiten Nederland geplaatste ambtenaar ondergaat dit
      onderzoek zo mogelijk tijdens verblijf hier te lande.

      3 Onverminderd het bepaalde in [artikel 50a, tweede lid][ref2], vindt buitendienststelling plaats door Onze
      Minister. Daarbij vindt een belangenafweging plaats teneinde na te gaan of het verblijf van de ambtenaar in het
      land van plaatsing kan worden voortgezet.

      4 De deskundige persoon of de arbodienst kan de ambtenaren individueel of gezamenlijk aanwijzingen geven tot
      behoud, herstel of bevordering van hun arbeidsgeschiktheid en de geschiktheid tot verblijf buiten Nederland van hun
      gezinsleden. De ambtenaren zijn gehouden die aanwijzingen op te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel50a
