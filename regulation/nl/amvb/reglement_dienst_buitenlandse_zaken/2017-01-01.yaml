      [54c][ref4] en [77, tweede lid][ref5], zijn niet van toepassing op de ambtenaar en de gewezen ambtenaar die geen
      overheidswerknemer zijn als bedoeld in [artikel 2, eerste lid, van de Wet privatisering ABP][ref6].


