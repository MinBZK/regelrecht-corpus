  - number: '41'
    text: |-
      1 De ambtenaar heeft jaarlijks aanspraak op vakantie met behoud van bezoldiging.

      2 De aanspraak op vakantie wordt uitgedrukt in hele uren, waarbij onderscheid wordt gemaakt tussen wettelijke
      vakantie-uren en bovenwettelijke vakantie-uren.

      3 De omvang van de aanspraak op vakantie is afhankelijk van:

      a. de leeftijd van de ambtenaar;

      b. de arbeidsduur van de ambtenaar.

      4 Voor de ambtenaar met een volledige arbeidsduur bedraagt de aanspraak op vakantie 144 wettelijke vakantie-uren en
      21,6 bovenwettelijke vakantie-uren per kalenderjaar.

      5 De op grond van het vierde lid geldende aanspraak op vakantie wordt met bovenwettelijke vakantie-uren verhoogd
      volgens onderstaande tabel afhankelijk van de leeftijd die de ambtenaar in het desbetreffende kalenderjaar bereikt.








                    Leeftijd


                    Verhoging






                    van 45 tot en met 49 jaar


                    7,2 uren




                    van 50 tot en met 54 jaar


                    14,4 uren




                    van 55 tot en met 59 jaar


                    21,6 uren




                    vanaf 60 jaar


                    28,8 uren






      6 De ingevolge het vierde en vijfde lid geldende aanspraak op vakantie wordt vermenigvuldigd met de voor de
      ambtenaar geldende arbeidsduurfactor. Zo nodig vindt afronding naar boven op hele uren plaats.

      7 Bij beëindiging of aanvang van het dienstverband in de loop van een kalenderjaar, wordt de aanspraak op vakantie
      vastgesteld naar evenredigheid van de dienst, die hij in dat jaar verricht heeft of zal verrichten.

      8 Indien de arbeidsduur van de ambtenaar wordt gewijzigd, wordt de aanspraak op vakantie over een eventueel
      resterend gedeelte van het desbetreffende kalenderjaar opnieuw vastgesteld, rekening houdend met de nieuwe
      arbeidsduur. De tot aan de datum van ingang van de wijziging van de arbeidsduur verworven aanspraak op vakantie
      blijft ongewijzigd gehandhaafd.

      9 Over kalendermaanden gedurende welke de ambtenaar in afwijking van zijn arbeidstijdpatroon in het geheel
      geen dienst verricht, heeft hij geen aanspraak op vakantie. Over kalendermaanden gedurende welke de ambtenaar
      in afwijking van zijn arbeidstijdpatroon gedeeltelijk dienst verricht, heeft hij aanspraak op vakantie naar
      evenredigheid van het gedeelte van de werktijd waarop hij volgens zijn arbeidstijdpatroon dienst verricht.

      10 Het negende lid is niet van toepassing, indien geheel of gedeeltelijk geen dienst wordt verricht wegens:

      a. genoten vakantie;

      b. ziekteverlof;

      c. zwangerschaps- en bevallingsverlof als bedoeld in [artikel 45a, derde en vierde lid][ref1];

      d. verblijf in militaire dienst wegens herhalingsoefeningen;

      e. verlof verleend op basis van [artikel 42a][ref2], [43a][ref3], [43c][ref4], [43d][ref5],
      [43e][ref6], [45][ref7], [45c][ref8] of [45d][ref9] van dit besluit of op basis van
      [hoofdstuk 5, afdeling 2, van de Wet arbeid en zorg][ref10];

      f. het minder uren werken op basis van de in [artikel 40][ref11] bedoelde regels.

      11 In afwijking van het tiende lid, onder b, heeft de ambtenaar gedurende de periode dat
      [artikel 54f, eerste lid, onderdeel i, q of r][ref12], toepassing vindt, geen aanspraak op vakantie.

      12 Met ingang van de dag dat de ambtenaar van 57 jaar of ouder op grond van [artikel 38][ref13] gedeeltelijk geen
      dienst verricht, vervalt de in het vijfde lid bedoelde verhoging van de vakantieaanspraak.


