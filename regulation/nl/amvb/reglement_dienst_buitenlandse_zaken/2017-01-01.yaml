  - number: 33a
    text: |-
      Op de ambtenaar zijn de [artikelen 17 tot en met 20d van het ARAR][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel17
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel33a
