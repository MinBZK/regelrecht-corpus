        bwb_id: BWBR0004052
        artikel: '78'
        hoofdstuk: XII
  - number: '26'
    text: |-
      1 Plaatsing in een functie geschiedt voor een vooraf bepaalde periode. Na afloop van de voor de ambtenaar
      vastgestelde plaatsingsduur eindigt de plaatsing.

      2 Met inachtneming van de in of krachtens de [artikelen 27][ref1] en [29][ref2] gestelde regels wordt de ambtenaar,
      aangesteld in vaste dienst of in tijdelijke dienst voor een proeftijd, in een andere functie geplaatst. In
      bijzondere gevallen kan plaatsing in dezelfde functie geschieden.

      3 Om redenen ontleend aan het dienstbelang of aan het belang van de betrokken ambtenaar of diens gezinsleden, kan
      een plaatsing worden verlengd, dan wel worden beëindigd op een eerder tijdstip dan bedoeld in het eerste lid.

      4 Bij ministeriële regeling worden nadere regels gesteld voor de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel29
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '27'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '29'
        hoofdstuk: V
  - number: '27'
    text: |-
      1 Plaatsing in een functie geschiedt, behoudens het gestelde in [artikel 29][ref1], op het departement of bij
      een vertegenwoordiging van het Koninkrijk in het buitenland. Een plaatsing bij een vertegenwoordiging van het
      Koninkrijk in het buitenland wordt, behoudens bijzondere omstandigheden, niet gevolgd door een plaatsing bij
      diezelfde vertegenwoordiging.

      2 De ambtenaar maakt op de daarvoor vastgestelde wijze kenbaar naar welke functies zijn voorkeur voor plaatsing in
      een volgende functie uitgaat.

      3 De ambtenaar kan in een andere functie worden geplaatst dan die waarvoor hij zijn voorkeur heeft kenbaar gemaakt,
      indien:

      a. hij naar het oordeel van Onze Minister beschikt, dan wel binnen redelijke termijn kan beschikken, over de kennis
      en kunde die noodzakelijk worden geacht om die functie naar behoren te kunnen uitoefenen, en

      b. die functie hem redelijkerwijs kan worden opgedragen in verband met zijn persoonlijkheid, zijn omstandigheden en
      de voor hem bestaande vooruitzichten. Bedoelde plaatsing en de vaststelling van de plaatsingsduur, komen tot stand
      na een zorgvuldige afweging van het dienstbelang en het persoonlijk belang van de betrokkene en diens gezinsleden.

      4 Tussen twee plaatsingen in kan een ambtenaar wiens plaatsing ingevolge [artikel 26, eerste of derde lid][ref2],
      eindigt respectievelijk is beëindigd, gedurende een periode van ten hoogste twaalf maanden ter beschikking worden
      gehouden. Deze periode kan in bijzondere gevallen worden verlengd. Gedurende de periode dat de ambtenaar ter
      beschikking wordt gehouden, wordt hij belast met andere passende werkzaamheden dan wel met studie gericht op het
      voortzetten van zijn loopbaan tenzij dat na overleg met de ambtenaar redelijkerwijs niet mogelijk blijkt.

      5 Behoudens spoedeisende gevallen, wordt de ambtenaar uiterlijk acht weken voor de ingangsdatum in kennis gesteld
      van het besluit tot plaatsing, dan wel het besluit tot terbeschikkinghouding. In het besluit wordt ten minste
      vermeld: de ingangsdatum en, in geval van plaatsing, de nieuwe standplaats, de te vervullen functie en de duur van
      de plaatsing.

      6 De Nederlandse nationaliteit is vereist in geval van plaatsing bij een vertegenwoordiging van het Koninkrijk in
      het buitenland. Indien het dienstbelang dat bepaaldelijk vordert, kan van de eerste volzin worden afgeweken.

      7 Voor de bepaling van de geschiktheid voor een functie zijn de [artikelen 23][ref3], [23b][ref4] en [23c][ref5]
      van overeenkomstige toepassing.

      8 Bij ministeriële regeling worden nadere regels gesteld voor de toepassing van dit artikel.


