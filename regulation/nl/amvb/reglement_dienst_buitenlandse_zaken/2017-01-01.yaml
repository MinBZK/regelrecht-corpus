  - number: '144'
    text: |-
      1 Er is een Commissie van Bezwaar Dienst Buitenlandse Zaken, hierna te noemen de Commissie van Bezwaar, die

      a. Onze Minister van advies dient over de beslissing op een bezwaarschrift gericht tegen een besluit of een
      handeling krachtens dit reglement genomen onderscheidenlijk verricht ten aanzien van

      1°. ambtenaren;

      2°. werknemers als bedoeld in [artikel 114][ref1];

      3°. ingevolge het [derde en vierde lid van artikel 8][ref2] bij een vertegenwoordiging van het Koninkrijk in
      het buitenland gedetacheerde of toegevoegde ambtenaren, voor zover het besluiten of handelingen welke met hun
      detachering of toevoeging verband houden betreft;

      4°. ingevolge het [zesde lid van artikel 8][ref3] aan een tijdelijke diplomatieke zending toegevoegde personen,
      voor zover het besluiten of handelingen welke verband houden met hun toevoeging betreft;

      5°. werknemers als bedoeld in [artikel 115][ref4];

      6°. honoraire consulaire ambtenaren en honoraire adviseurs, voor zover het besluiten of handelingen welke verband
      houden met de ambtsverrichtingen als honorair consulair ambtenaar onderscheidenlijk de advieswerkzaamheden als
      honorair adviseur betreft;

      7°. nagelaten betrekkingen en rechtverkrijgenden van de onder ten 1° tot en met ten 6° genoemden;

      b. Onze Minister, hoofd van het betrokken ministerie, van advies dient over de beslissing op een bezwaarschrift
      gericht tegen een besluit of een handeling,

      1°. als bedoeld in [artikel 8, achtste lid][ref5],

      2°. genomen ten aanzien van zijn werknemers als bedoeld in [artikel 115][ref6].

      2 De Commissie van Bezwaar brengt geen advies uit over de beslissing op een bezwaarschrift tegen een van de in het
      eerste lid bedoelde besluiten of handelingen, indien daarmee bij of krachtens dit reglement een andere commissie
      is belast.

      3 De Commissie van Bezwaar zetelt te 's-Gravenhage en houdt zitting in een door Onze Minister ter beschikking
      gestelde lokaliteit van het Ministerie van Buitenlandse Zaken.


