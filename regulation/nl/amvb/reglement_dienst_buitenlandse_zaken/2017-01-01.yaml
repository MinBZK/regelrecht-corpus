  - number: '46'
    text: |-
      1 Buitengewoon verlof van lange duur kan aan de ambtenaar op zijn aanvraag worden verleend, al dan niet met behoud
      van bezoldiging en al dan niet onder bepaalde voorwaarden.

      2 Het verlof, bedoeld in het eerste lid, gaat pas in nadat de ambtenaar schriftelijk heeft verklaard dat hij de
      daaraan verbonden voorwaarden aanvaardt.

      3 Indien het verlof, bedoeld in het eerste lid, uitsluitend strekt in het persoonlijk belang van de ambtenaar,
      wordt dit verleend zonder behoud van bezoldiging en voor ten hoogste een jaar.

      4 Indien het verlof, bedoeld in het eerste lid, verband houdt met een benoeming van de ambtenaar tot bezoldigd
      bestuurder van een vereniging van ambtenaren, van een centrale of van een internationale organisatie van
      zodanige verenigingen, wordt dit verleend zonder behoud van bezoldiging en voor ten hoogste twee jaren.
      [Artikel 43c, vijfde lid][ref1], is van overeenkomstige toepassing.

      5 Indien het verlof, bedoeld in het eerste lid, ten doel heeft de ambtenaar in de gelegenheid te stellen de
      huwelijkspartner, indien deze als ambtenaar buiten Nederland wordt geplaatst, te vergezellen, wordt dat verlof in
      beginsel verleend voor de duur van de plaatsing van de huwelijkspartner, zonder behoud van bezoldiging.

      6 Het bevoegd gezag biedt de ambtenaar aan wie buitengewoon verlof is verleend op grond van het eerste lid in
      verband met het vervullen van een functie bij een internationale volkenrechtelijke organisatie, dan wel van een
      functie als bedoeld in het vierde lid, na afloop van het verlof een passende functie aan. Indien plaatsing niet
      aanstonds mogelijk is, wordt de ambtenaar ter beschikking gehouden overeenkomstig [artikel 27, vierde lid][ref2].

      7 Een passende functie als bedoeld in het zesde lid, dient zo mogelijk ten minste gelijkwaardig te zijn aan de
      functie waarop het buitengewoon verlof betrekking had.


