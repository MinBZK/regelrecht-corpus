  - number: '58'
    text: |-
      1 Door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties krachtens
      [artikel 49a, eerste lid, van het ARAR][ref1] gestelde regels omtrent de te volgen procedure bij reorganisaties en
      het herplaatsen van ambtenaren zijn van overeenkomstige toepassing.

      2 Bij ministeriële regeling kunnen nadere en zonodig van de in het eerste lid bedoelde regels en van dit hoofdstuk
      afwijkende procedures en regels worden gesteld omtrent reorganisaties, het aanwijzen van herplaatsingskandidaten en
      het herplaatsen van ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49a
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49a
  - number: 58a
    text: |-
      1 Bij een reorganisatie zijn de bepalingen van dit hoofdstuk van toepassing.

      2 Onder reorganisatie als bedoeld in het eerste lid wordt verstaan: iedere wijziging van de organisatiestructuur,
      de omvang of de taakinhoud van het Ministerie van Buitenlandse Zaken of een onderdeel daarvan, waaraan personele
      consequenties zijn verbonden.

      3 De bepalingen van dit hoofdstuk zijn van overeenkomstige toepassing op de overgang van de ambtenaar naar een
      private onderneming of zelfstandig bestuursorgaan in verband met de privatisering of verzelfstandiging van een
      dienstonderdeel van het Ministerie van Buitenlandse Zaken, tenzij bij algemeen verbindend voorschrift anders is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58a
  - number: 58b
    text: |-
      1 De centrales van verenigingen van ambtenaren worden tijdig geïnformeerd over een voorgenomen besluit tot een
      reorganisatie.

      2 De ondernemingsraad en de betrokken medezeggenschapsorganen bij de vertegenwoordigingen van het Koninkrijk in het
      buitenland worden tijdig geïnformeerd over een voorgenomen besluit tot een reorganisatie.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58b
  - number: 58c
    text: |-
      De ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd en de ambtenaar die is aangesteld in vaste
      dienst, wier functie in verband met een reorganisatie is opgeheven, worden aangewezen als te herplaatsen ambtenaar,
      hierna te noemen: herplaatsingskandidaat.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58c
  - number: 58d
    text: |-
      1 Van overtolligheid is sprake indien binnen het te reorganiseren onderdeel van het Ministerie van Buitenlandse
      Zaken meer ambtenaren een vergelijkbare of uitwisselbare functie vervullen en het totale aantal van die functies
      zodanig wordt verminderd dat onvoldoende van die functies voor de betrokken ambtenaren resteren.

      2 De ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd en de ambtenaar die is aangesteld in
      vaste dienst, die in verband met een reorganisatie overtollig zijn, worden aangewezen als herplaatsingskandidaat,
      waarbij de ambtenaar die het geringste aantal jaren in overheidsdienst heeft doorgebracht het eerst als
      herplaatsingskandidaat wordt aangewezen.

      3 Voor de berekening van het aantal in overheidsdienst doorgebrachte jaren wordt mede in aanmerking genomen
      tijd gewijd aan de verzorging van tot het huishouden van de ambtenaar behorende 0–4 jarige eigen, stief- of
      pleegkinderen, tot een maximum van in totaal zes jaren.

      4 Onze Minister kan van de volgorde in het tweede lid afwijken indien zulks naar zijn oordeel noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58d
  - number: 58e
    text: De ambtenaar wordt omtrent zijn aanwijzing als herplaatsingskandidaat zo spoedig mogelijk geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58e
  - number: 58f
    text: |-
      1 Onverminderd het gestelde in [artikel 99, eerste lid][ref1], wordt aan de ambtenaar binnen een periode van 18
      maanden, te rekenen vanaf het moment dat de ambtenaar is aangewezen als herplaatsingskandidaat, ten minste één
      passende functie aangeboden.

      2 De termijn, bedoeld in het eerste lid, kan worden verkort indien:

      a. de herplaatsingskandidaat heeft geweigerd te voldoen aan een hem op grond van dit hoofdstuk opgelegde
      verplichting, of

      b. reeds eerder in overleg met de ambtenaar kan worden vastgesteld dat er geen mogelijkheden zijn om hem binnen de
      termijn te herplaatsen.

      3 Onze Minister kan de termijn verlengen of opschorten, indien de omstandigheden naar zijn oordeel daartoe
      aanleiding geven.

      4 De ambtenaar wordt gelijktijdig met zijn aanwijzing als herplaatsingskandidaat geïnformeerd over de aanvang en
      het einde van de termijn, bedoeld in het eerste lid.

      5 De herplaatsingskandidaat wordt geïnformeerd over het verkorten, verlengen of opschorten van de termijn, bedoeld
      in het tweede en het derde lid.

      6 Op verzoek van de herplaatsingskandidaat wordt de termijn, bedoeld in het eerste lid, met maximaal
      een jaar verlengd ingeval de herplaatsingskandidaat bij het einde van de termijn, bedoeld in het eerste
      lid, in combinatie met de duur van de bovenwettelijke uitkering bij werkloosheid, de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], nog niet heeft bereikt
      en door deze verlenging recht ontstaat op een bovenwettelijke uitkering bij werkloosheid, op grond van
      [artikel 2, tweede lid, van het Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0008114#Artikel2
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58f
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '99'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref3
        bwb_id: BWBR0008114
        artikel: '2'
  - number: 58g
    text: |-
      1 Van een passende functie als bedoeld in [artikel 58f][ref1] is sprake indien de herplaatsingskandidaat naar
      het oordeel van Onze Minister beschikt over de kennis en kunde die noodzakelijk worden geacht om de functie naar
      behoren te kunnen uitoefenen dan wel indien de herplaatsingskandidaat naar het oordeel van Onze Minister binnen
      redelijke termijn om-, her- of bijgeschoold kan worden, en deze functie hem in verband met zijn persoonlijkheid,
      zijn omstandigheden en de voor hem bestaande vooruitzichten, redelijkerwijs kan worden opgedragen.

      2 Bij het eerste lid geldt de beperking dat uitsluitend sprake kan zijn van een passende functie indien de voor
      de functie geldende salarisschaal niet meer dan twee schalen lager is dan de salarisschaal die geldt voor de
      herplaatsingskandidaat.

      3 De herplaatsingskandidaat kan worden geplaatst in een functie waarvan de geldende salarisschaal meer dan twee
      schalen lager is dan de salarisschaal die geldt voor de herplaatsingskandidaat indien er bijzondere omstandigheden
      zijn die zulks rechtvaardigen en indien de herplaatsingskandidaat daarmee instemt.

      4 Bij een herplaatsing met toepassing van het derde lid is [artikel 58m][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel58f
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel58m
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58g
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: 58f
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0004052
        artikel: 58m
        hoofdstuk: XI
  - number: 58h
    text: |-
      Onze Minister kan de naar zijn oordeel meest geschikte herplaatsingskandidaat, voor wie de functie als passend
      wordt aangemerkt, herplaatsen in die functie.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58h
  - number: 58i
    text: |-
      1 Onverminderd het bepaalde in [artikel 58f, eerste lid][ref1], is de herplaatsingskandidaat verplicht al het
      mogelijke te doen om een passende functie te vinden.

      2 De herplaatsingskandidaat is verplicht een passende functie te aanvaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel58f
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58i
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: 58f
        hoofdstuk: XI
  - number: 58k
    text: |-
      1 De herplaatsingskandidaat die heeft geweigerd te voldoen aan een hem op grond van dit hoofdstuk opgelegde
      verplichting, kan in verband daarmee ontslag worden verleend.

      2 Bij een ontslagverlening op grond van het eerste lid wordt een opzeggingstermijn van drie maanden in acht
      genomen.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58k
  - number: 58l
    text: |-
      1 Indien de toename van de reistijd voor woon-werkverkeer ten gevolge van een wijziging van de plaats van
      tewerkstelling in Nederland in verband met plaatsing of herplaatsing in een passende functie anders dan op eigen
      verzoek meer bedraagt dan 15 minuten per enkele reis, wordt de extra reistijd van de ambtenaar, voor zover deze
      meer is dan 15 minuten, gedurende een jaar als werktijd aangemerkt.

      2 Gedurende het tweede, derde en vierde jaar wordt respectievelijk 75%, 50% en 25% van de in het eerste lid
      bedoelde extra reistijd als werktijd aangemerkt.

      3 Voor de ambtenaar die de in het eerste lid bedoelde aanspraak heeft, en voor wie binnen twee jaar opnieuw de
      plaats van tewerkstelling wijzigt, wordt bij de berekening van de extra reistijd uitgegaan van de totale toename
      ten opzichte van de reistijd zoals die was voor de eerste wijziging.

      4 Indien de tweede toename van de reistijd meer dan 15 minuten bedraagt ten opzichte van de de reistijd zoals die
      was na de eerste wijziging, wordt de in het eerste en tweede lid genoemde termijn, gedurende welke de aanspraak
      bestaat, opnieuw gestart.

      5 De ambtenaar voor wie binnen twee jaar voor de tweede maal anders dan op eigen verzoek de plaats van
      tewerkstelling in Nederland wijzigt en voor wie pas na de tweede wijziging de toename van de reistijd meer dan 15
      minuten bedraagt, heeft aanspraak op de voorziening, bedoeld in het eerste en tweede lid vanaf de tweede wijziging.

      6 Voor de bepaling van de reistijd wordt uitgegaan van de route met de minste reistijd, berekend met de ANWB-
      routeplanner.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58l
  - number: 58m
    text: |-
      1 De ambtenaar die in verband met zijn herplaatsing of plaatsing in een passende functie in opdracht van Onze
      Minister is verhuisd, wordt eenmalig een bedrag toegekend van  € 11.637,69 bruto ter tegemoetkoming in de daarmee
      verband houdende kosten.

      2 In de gevallen waarin de ambtenaar en zijn huwelijkspartner beiden in aanmerking komen voor het bedrag, bedoeld
      in het eerste lid, ontvangt elk de helft daarvan.

      3 Het bedrag, bedoeld in het eerste lid, wordt niet toegekend:

      a. indien de verhuizing niet heeft plaatsgevonden binnen twee jaren nadat de opdracht om te verhuizen is gegeven,
      of

      b. indien de ambtenaar aanspraak maakt op een vergoeding of tegemoetkoming op grond van het in of krachtens
      [artikel 36][ref1] gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel36
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58m
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '36'
        hoofdstuk: VII
  - number: 58n
    text: |-
      Onze Minister kan de herplaatsingskandidaat een premie in het vooruitzicht stellen ter grootte van maximaal
      drie maandsalarissen indien aan hem binnen 18 maanden nadat hij is aangewezen als herplaatsingskandidaat op zijn
      aanvraag eervol ontslag wordt verleend.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58n
  - number: 58o
    text: |-
      1 De herplaatsingskandidaat aan wie eervol ontslag op zijn aanvraag is verleend wegens de aanvaarding van een
      functie kan, onverminderd het bepaalde in [artikel 58n][ref1], een salarissuppletie worden toegekend indien het in
      de nieuwe functie genoten salaris lager is dan het salaris in de oorspronkelijke functie.

      2 De suppletie, bedoeld in het eerste lid, wordt toegekend gedurende maximaal vijf jaar en is ten hoogste gelijk
      aan het verschil tussen het in de oorspronkelijke functie genoten salaris en het salaris in de nieuwe functie.

      3 Onder door Onze Minister te stellen voorwaarden kan het recht op suppletie op aanvraag van de
      herplaatsingskandidaat worden afgekocht.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel58n
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel58o
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: 58n
        hoofdstuk: XI
  - number: 58p
    text: |-
      De [artikelen 58i, tweede lid][ref1], [58j][ref2], [58m][ref3], [58n][ref4] en [58o][ref5] kunnen worden toegepast
      op de ambtenaar wiens functie binnen afzienbare tijd wordt opgeheven of die als overtollig zal worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel58i
