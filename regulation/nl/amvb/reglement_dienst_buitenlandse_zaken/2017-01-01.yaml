  - number: '42'
    text: |-
      1 Onverminderd het bepaalde in de [hoofdstukken VI][ref1] en[ X][ref2], geniet verlof:

      a. de ambtenaar die uit hoofde van ziekte of ongeval verhinderd is dienst te verrichten;

      b. de ambtenaar die als militair, dan wel als vrijwillige ambtenaar als bedoeld in
      [artikel 1, onder d, van het Besluit rechtspositie vrijwillige politie][ref3], in werkelijke dienst is;

      c. de ambtenaar die zich bevindt in een van de omstandigheden, genoemd in [artikel 20b van het ARAR][ref4].

      2 De ambtenaar die ingevolge het eerste lid, onder a, verlof geniet, kan, onverminderd
      [artikel 41a, zevende lid][ref5], vakantie opnemen.


