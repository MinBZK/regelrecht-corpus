  - number: '55'
    text: |-
      1 Indien de gewezen vrouwelijke ambtenaar na de datum waarop de periode afloopt gedurende welke zij ingevolge
      artikel 45aa, eerste, tweede of vierde lid, haar bezoldiging en vakantie-uitkering ontvangt, wegens ziekte
      ongeschikt is tot werken, dan wel binnen een maand na die datum wegens ziekte ongeschikt wordt tot werken, heeft
      zij gedurende een tijdvak van 52 weken recht op doorbetaling van haar laatstelijk genoten bezoldiging vermeerderd
      met de vakantie-uitkering overeenkomstig [artikel 54b][ref1], zolang zij wegens ziekte ongeschikt is tot werken. De
      termijn van 52 weken vangt aan na beëindiging van voornoemde periode respectievelijk met ingang van de eerste dag
      waarop zij ongeschikt is een naar aard en omvang soortgelijke functie te vervullen.

      2 Ongeschikt tot werken wegens ziekte in de zin van het eerste lid is de vrouwelijke gewezen ambtenaar die als
      rechtstreeks en objectief medisch vast te stellen gevolg van ziekte of gebreken niet in staat is om een naar aard
      en omvang soortgelijke betrekking te vervullen als zij vervulde.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel54b
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: 54b
        hoofdstuk: X
        paragraaf: '3'
  - number: '56'
    text: |-
      1 In bijzondere gevallen kan aan de ambtenaar een tegemoetkoming worden toegekend in noodzakelijk gemaakte kosten
      die verband houden met ziekte, welke de ambtenaar voor zichzelf en voor zijn medebelanghebbenden heeft gemaakt:

      a. indien hierin niet ingevolge een andere regeling kan worden voorzien, en

      b. deze kosten redelijkerwijs niet voor zijn rekening kunnen blijven.

      2 Door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties krachtens
      [artikel 47, tweede lid, van het ARAR][ref1] gestelde nadere regels zijn van overeenkomstige toepassing.

      3 Bij ministeriële regeling kan van de in het tweede lid bedoelde regels worden afgeweken met betrekking tot de in
      het eerste lid bedoelde kosten welke voortvloeien uit een plaatsing buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel47
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '47'
  - number: 56a
    text: |-
      1 Indien de ziekte, uit hoofde waarvan de ambtenaar of de gewezen ambtenaar ongeschikt is zijn arbeid te
      verrichten, voortvloeit uit een dienstongeval of een door het verrichten van zijn arbeid opgelopen beroepsziekte,
      worden hem vergoed de naar het oordeel van Onze Minister noodzakelijk gemaakte kosten van geneeskundige behandeling
      of verzorging die voor rekening van de ambtenaar blijven.

      2 Door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties krachtens
      [artikel 48, tweede lid, van het ARAR][ref1] gestelde nadere regels zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel48
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel56a
