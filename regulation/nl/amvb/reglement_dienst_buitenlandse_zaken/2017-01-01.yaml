  - number: 41a
    text: |-
      1 De ambtenaar is vrij te bepalen wanneer hij vakantie opneemt, voor zover de belangen van de dienst zich daartegen
      niet verzetten.

      2 Het bevoegd gezag stelt de ambtenaar ieder jaar in de gelegenheid in ieder geval de wettelijke vakantie-uren op
      te nemen.

      3 Aan een ambtenaar kan op zijn aanvraag worden toegestaan, in enig kalenderjaar meer uren vakantie op te nemen
      dan zijn aanspraak tot en met het lopende jaar bedraagt, met dien verstande, dat de opgenomen vakantie de aanspraak
      tot en met het lopende jaar nimmer met meer dan 57,6 uren mag overschrijden. Voor de ambtenaar met onvolledige
      arbeidsduur wordt het in de vorige volzin bedoelde aantal uren van de maximaal toegestane overschrijding verminderd
      naar evenredigheid van de arbeidsduur. De in een kalenderjaar teveel genoten vakantie wordt in mindering gebracht
      op de aanspraak op wettelijke vakantie-uren over het eerstvolgende jaar.

      4 De ambtenaar meldt het voornemen vakantie op te nemen ruimschoots van tevoren.

      5 Tenzij gewichtige redenen van dienstbelang zich hiertegen verzetten, is het de ambtenaar toegestaan op het
      voornemen vakantie op te nemen, terug te komen, dan wel het opnemen niet voort te zetten.

      6 Wanneer dringende redenen van dienstbelang dat noodzakelijk maken, kan de aan de ambtenaar verleende toestemming
      vakantie op te nemen worden ingetrokken, zowel vóór als tijdens de vakantie. Indien de ambtenaar ten gevolge van
      het intrekken van de toestemming vakantie op te nemen geldelijke schade lijdt, wordt deze hem vergoed.

      7 Indien een ambtenaar verlof als bedoeld in [artikel 42, eerste lid, onder a][ref1], geniet, is het hem toegestaan
      het opnemen van vakantie niet voort te zetten. Indien het bevoegd gezag hier om verzoekt, dient de ambtenaar de
      ziekte of het ongeval aan te tonen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel42
