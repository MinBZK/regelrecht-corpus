  - number: '77'
    text: |-
      1 Onze Minister kan naar billijkheid de ambtenaar schadeloosstellen, kosten vergoeden of overigens een geldelijke
      tegemoetkoming verlenen.

      2 De ambtenaar en de gewezen ambtenaar die een beroepsincident als bedoeld in [artikel 49][ref1], hebben gehad,
      hebben recht op volledige vergoeding van de schade die zij ten gevolge van dat beroepsincident lijden. In
      overeenstemming met de ambtenaar kan deze vergoeding mede strekken ter vervanging van de uitkering, bedoeld in
      [artikel 54b, zevende lid][ref2].

      3 Bij ministeriële regeling kunnen omtrent de schadeloosstelling, kostenvergoedingen en overige geldelijke
      tegemoetkomingen aan groepen van ambtenaren in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties regels worden gesteld.

      4 Door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties krachtens
      [artikel 69, vierde lid, van het ARAR][ref3] gestelde regels omtrent de schadeloosstelling, kostenvergoedingen
      en overige geldelijke tegemoetkomingen aan groepen van ambtenaren zijn van overeenkomstige toepassing. Bij
      ministeriële regeling kan Onze Minister andere regels stellen in verband met het verrichten van arbeid buiten
      Nederland.

      5 Lijdt een ambtenaar die voldaan heeft aan het [derde lid van artikel 13][ref4], buiten Nederland schade als
      gevolg van een normaliter niet verzekerbaar molest, dan wordt indien dat molest samenhangt met de functie of
      de plaatsing van betrokkene, die schade volgens bij ministeriële regeling te stellen regels vergoed, voor zover
      betrokkene vorderingen terzake aan het Rijk heeft gecedeerd.

      6 Onze Minister bepaalt de muntsoort of muntsoorten waarin de bedoelde schadeloosstelling, vergoedingen en
      tegemoetkomingen bij plaatsing buiten Nederland worden uitbetaald.


