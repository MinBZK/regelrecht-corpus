  - number: '78'
    text: |-
      1 Met de ambtenaar wordt minimaal een keer per jaar door een leidinggevende functionaris, aangewezen door Onze
      Minister, gesproken over:

      a. de resultaten die de ambtenaar heeft behaald en de wijze waarop en de omstandigheden waaronder de opgedragen
      werkzaamheden zijn uitgevoerd;

      b. de opvatting van zowel de functionaris als de ambtenaar over het onder a besprokene, op basis waarvan de
      functionaris tot een uiteindelijke samenvattende conclusie komt;

      c. welke werkzaamheden de ambtenaar zullen worden opgedragen, de omstandigheden waaronder deze zullen worden
      uitgevoerd en welke resultaten daarbij behaald moeten worden;

      d. de wijze waarop de persoonlijke ontwikkeling van de ambtenaar bevorderd kan worden.

      2 Indien de ambtenaar gedurende vijf aaneengesloten jaren dezelfde functie heeft vervuld, wordt in het gesprek als
      bedoeld in het eerste lid specifieke aandacht besteed aan de wenselijkheid en mogelijkheid van de continuering van
      de loopbaan in een andere functie.

      3 Over de in het eerste lid, onder c en d, genoemde onderwerpen worden met de ambtenaar afspraken gemaakt.

      4 Van het met de ambtenaar besprokene, bedoeld in het eerste, tweede en derde lid, wordt een schriftelijk verslag
      gemaakt.

      5 Onze Minister voor Wonen en Rijksdienst stelt vast aan welke eisen een gesprek als bedoeld in het eerste lid
      alsmede het verslag, bedoeld in het vierde lid moet voldoen.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel78
