      1 De ambtenaar heeft aanspraak op een gratificatie bij ambtsjubileum, overeenkomstig de door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties krachtens [artikel 79, eerste lid, van het ARAR][ref1] te stellen regels.

      2 De ambtenaar die een diensttijd heeft van tien jaar of meer en aan wie ontslag is verleend op grond van
      [artikel 99][ref2] of [104, eerste lid, onder e][ref3], wordt een diensttijdgratificatie toegekend, indien binnen
      een termijn van vijf jaar na de datum van ingang van het ontslag aanspraak op een gratificatie bij ambtsjubileum
      zou hebben bestaan. De diensttijdgratificatie bedraagt een in verhouding tot de doorgebrachte diensttijd evenredig
      gedeelte van een gratificatie bij ambtsjubileum als bedoeld in het eerste lid.


