  - number: 43f
    text: |-
      1 Buitengewoon verlof van korte duur, al dan niet met behoud van bezoldiging, kan bovendien worden verleend in de
      gevallen waarin daartoe aanleiding bestaat.

      2 Door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties gestelde nadere regels als bedoeld in
      [artikel 33e, tweede lid, van het ARAR][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33e
