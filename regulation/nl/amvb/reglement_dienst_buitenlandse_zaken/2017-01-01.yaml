      Voor zover op grond van deze paragraaf buitengewoon verlof met gehele of gedeeltelijke bezoldiging wordt
      verleend, wordt, indien de ambtenaar in het genot is van een toelage als bedoeld in [artikel 17][ref1], [18][ref2]
      en [18a van het BBRA 1984][ref3], dit bezoldigingsdeel vastgesteld met overeenkomstige toepassing van de in
      [artikel 57, tweede tot en met vierde lid][ref4], vermelde berekeningswijze.


