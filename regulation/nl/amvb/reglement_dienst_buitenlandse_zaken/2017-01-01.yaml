  - number: 45b
    text: |-
      1 De ambtenaar die als ouder in familierechtelijke betrekking staat tot een kind, heeft aanspraak op verlof. Indien
      de ambtenaar met ingang van hetzelfde tijdstip tot meer dan één kind in familierechtelijke betrekking komt te
      staan, bestaat er ten aanzien van ieder van die kinderen aanspraak op verlof.

      2 De ambtenaar die blijkens de basisregistratie personen op hetzelfde adres woont als een kind en duurzaam de
      verzorging en de opvoeding van dat kind als eigen kind op zich heeft genomen, heeft aanspraak op verlof. Indien de
      ambtenaar met ingang van hetzelfde tijdstip de verzorging en opvoeding van meer dan één kind op zich heeft genomen,
      bestaat er ten aanzien van ieder van die kinderen aanspraak op verlof.

      3 Geen aanspraak op verlof bestaat na de datum waarop het kind de leeftijd van acht jaren heeft bereikt.

      4 Het verlof wordt uitsluitend verleend aan de ambtenaar wiens dienstbetrekking ten minste een jaar heeft geduurd.
      Het verlof wordt behoudens bijzondere gevallen genoten gedurende een plaatsing in Nederland. Bij ministeriële
      regeling kan worden bepaald in welke gevallen en onder welke voorwaarden het verlof gedurende plaatsing buiten
      Nederland kan worden genoten.

      5 Het aantal uren verlof waarop de ambtenaar per keer ten hoogste aanspraak heeft, bedraagt zesentwintig maal
      de arbeidsduur per week uitgaande van zijn arbeidsduur op het tijdstip waarop het verlof aanvangt. Indien de
      arbeidsduur van de ambtenaar gedurende het verlof wijzigt, wordt de aanspraak op het verlof opnieuw vastgesteld,
      rekening houdend met de mate waarin de arbeidsduur is gewijzigd en de mate waarin de periode gedurende welke het
      verlof wordt genoten is verstreken.

      6 Het verlof wordt opgenomen gedurende een aaneengesloten periode van ten hoogste twaalf maanden en gelijkmatig
      over deze periode verdeeld. In afwijking van de eerste volzin kan de ambtenaar verzoeken om het verlof op een
      andere wijze aaneengesloten te genieten of het verlof op te delen in ten hoogste drie perioden, waarbij iedere
      periode ten minste een maand bedraagt. Met het verzoek wordt ingestemd, tenzij een zwaarwegend dienstbelang zich
      daartegen verzet.

      7 Bij een keuze voor het maximale aantal uren verlof als bedoeld in het vijfde lid, heeft de ambtenaar over de
      verlofuren aanspraak op 27,5% van zijn bezoldiging. Bij een aanvraag voor een geringer aantal uren verlof wordt
      het percentage evenredig verhoogd tot ten hoogste 55. Zo nodig wordt het percentage rekenkundig afgerond op één
      decimaal achter de komma.

      8 De ambtenaar is verplicht tot terugbetaling van hetgeen hem over de genoten uren ouderschapsverlof is toegekend
      over de genoten verlofuren indien hem tijdens de verlofperiode of binnen een jaar na afloop van het verlof
      ontslag wordt verleend op aanvraag dan wel niet op aanvraag op grond van aan de ambtenaar te wijten feiten of
      omstandigheden. Ontslag op aanvraag gevolgd door een overgang binnen een maand naar een andere functie binnen de
      rijksdienst wordt niet als ontslag beschouwd. De ambtenaar kan worden ontheven van de in de eerste volzin bedoelde
      verplichting, indien er bijzondere omstandigheden zijn die dat rechtvaardigen.

      9 De ambtenaar meldt het voornemen verlof op te nemen ten minste twee maanden voor het door hem gewenste tijdstip
      van ingang van het verlof schriftelijk aan het tot verlening van het verlof bevoegde gezag.

      Daarbij geeft de ambtenaar op:

      a. het tijdvak waarin het verlof zal worden genoten;

      b. het aantal uren verlof per week; en

      c. de spreiding van de verlofuren over de week.

      Bij de eerste melding van het desbetreffende kind dient tevens opgave te worden gedaan van het totaal aantal uren
      dat de ambtenaar wenst op te nemen en de eventuele opdeling daarvan in perioden op grond van het zesde lid. Indien
      de ambtenaar het verlof heeft opgedeeld in meerdere perioden geldt de opgave, bedoeld in de onderdelen a tot en
      met c, slechts voor één verlofdeel tegelijk. De tijdstippen van ingang en einde van het verlof kunnen afhankelijk
      worden gesteld van de datum van de bevalling, van het einde van het bevallingsverlof of van de aanvang van de
      verzorging van het kind.

      10 Het bevoegd gezag is verplicht in te stemmen met een aanvraag van de ambtenaar het verlof niet op te nemen of
      niet voort te zetten op grond van het opnemen van zwangerschaps-, bevallings- of adoptieverlof als bedoeld in de
      [artikelen 45a][ref1], onderscheidenlijk [45c][ref2].

      Het bevoegd gezag is tevens verplicht in te stemmen met een aanvraag van de ambtenaar het verlof niet op te nemen
      of niet voort te zetten op grond van onvoorziene omstandigheden, tenzij gewichtige redenen van dienstbelang zich
      hiertegen verzetten.

      11 Het bevoegd gezag behoeft aan een aanvraag als bedoeld in het tiende lid niet met ingang van een vroeger
      tijdstip gevolg te geven dan vier weken na de aanvraag. In het geval het verlof met toepassing van het tiende lid,
      eerste volzin, na het tijdstip van ingang daarvan niet wordt voortgezet, wordt de aanspraak op het overige deel van
      het verlof opgeschort. In het geval het verlof met toepassing van het tiende lid, tweede volzin, na het tijdstip
      van ingang daarvan niet wordt voortgezet, vervalt de aanspraak op het overige deel van dat verlof.

      12 Indien op grond van het zesde lid het verlof is opgedeeld, zijn het tiende en elfde lid op iedere periode van
      toepassing.

      13 Na overleg met de ambtenaar kan de spreiding van de uren over de week op grond van gewichtige redenen van
      dienstbelang worden gewijzigd tot vier weken voor het tijdstip van ingang van het verlof.

      14 Indien het verlof op grond van het zesde lid is opgedeeld en de aanstelling eindigt voordat het verlof volledig
      is genoten, heeft de ambtenaar, indien hij een nieuwe aanstelling krijgt bij een ander bevoegd gezag aanspraak op
      de eventueel resterende deelperioden van het verlof met inachtneming van het bepaalde in dit artikel.

      15 Op de ambtenaar die voor een kind het verlof geheel of gedeeltelijk heeft opgenomen voor 1 januari 2011, blijven
      het vijfde en zevende lid, van toepassing zoals die luidden op 31 december 2010 voor wat betreft zijn recht op
      bezoldiging tijdens de uren waarop hem ouderschapsverlof is verleend, met dien verstande dat aanvullend dertien
      maal de arbeidsduur per week kan worden opgenomen zonder behoud van bezoldiging.


