  - number: '128'
    text: |-
      1 Indien ten behoeve van werknemers verplichtingen bestaan tot deelname aan al dan niet lokale
      oudedagsvoorzieningen, sociale verzekeringen of andere sociale voorzieningen, worden deze werknemers daarvoor
      aangemeld door het hoofd van de desbetreffende vertegenwoordiging van het Koninkrijk in het buitenland.

      2 Indien geen verplichtingen, bedoeld in het eerste lid, bestaan, doch naar het oordeel van Onze Minister passende
      mogelijkheden bestaan, is het eerste lid van overeenkomstige toepassing.

      3 Aan de werknemer kan een deel van de premie worden vergoed van een door hem af te sluiten verzekering die
      voorziet in de opbouw van een oudedags-, nabestaanden- of arbeidsongeschiktheidsvoorziening indien:

      a. de in het eerste en tweede lid bedoelde voorzieningen of regelingen ontbreken of de werknemer er niet voor kan
      worden aangemeld; of

      b. de in het eerste en tweede lid bedoelde voorzieningen of regelingen door Onze Minister in hun gevolg
      ontoereikend worden geacht.

      4 Indien zich bij een vertegenwoordiging van het Koninkrijk in het buitenland een situatie voordoet als bedoeld in
      het derde lid, wordt dit, tezamen met de daarbij geldende voorwaarden, opgenomen in de voor die vertegenwoordiging
      geldende ministeriële regeling, bedoeld in [artikel 123, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel123
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '123'
        hoofdstuk: XVIII
        paragraaf: '2'
  - number: '130'
    text: |-
      1 De werknemer op wie geen voorzieningen, regelingen dan wel verzekeringen als bedoeld in [artikel 128][ref1] van
      toepassing zijn, kan ten behoeve van zichzelf dan wel voor zijn nagelaten gezinsleden in aanmerking worden gebracht
      voor een suppletie op oudedagsvoorzieningen, nabestaandenvoorzieningen of arbeidsongeschiktheidsvoorzieningen
      bij ontslag wegens het bereiken van de voor betrokkene geldende pensioengerechtigde leeftijd, overlijden dan wel
      arbeidsongeschiktheid.

      2 Een suppletie op oudedagsvoorzieningen, nabestaandenvoorzieningen of arbeidsongeschiktheidsvoorzieningen kan door
      Onze Minister worden toegekend indien deze van oordeel is dat de voorzieningen, regelingen dan wel verzekeringen,
      bedoeld in [artikel 128][ref2], niet leiden tot een geheel van voorzieningen dat, mede gelet op de duur van het
      dienstverband alsmede de oorzaak en het tijdstip van ontslag, het overlijden of de arbeidsongeschiktheid, passend
      is te achten, met dien verstande dat geen suppletie wordt verstrekt ingeval verzekeringspremies zijn vergoed,
      maar niet voor verzekering zijn aangewend. Indien overlijden of arbeidsongeschiktheid het rechtstreeks gevolg
      is van de uitoefening van de dienst buiten schuld of onvoorzichtigheid van de werknemer, wordt de duur van het
      dienstverband fictief bepaald op de periode, gelegen tussen diens indiensttreding en de datum waarop de betrokkene
      de pensioengerechtigde leeftijd zou hebben bereikt.

      3 Het hoofd van een vertegenwoordiging van het Koninkrijk in het buitenland ziet erop toe dat in voorkomende
      gevallen de suppletie op oudedagsvoorzieningen, nabestaandenvoorzieningen of arbeidsongeschiktheidsvoorzieningen
      tijdig wordt aangevraagd, en adviseert Onze Minister desgevraagd met betrekking tot grootte en duur ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel128
