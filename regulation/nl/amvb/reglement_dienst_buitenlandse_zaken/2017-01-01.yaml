  - number: '9'
    text: |-
      1 De hoofden van de in [artikel 7][ref1] genoemde vertegenwoordigingen van het Koninkrijk in het buitenland worden,
      behoudens het hierna in het tweede en derde lid bepaalde, bij koninklijk besluit uit de ambtenaren benoemd.

      2 Tot hoofd van een consulaire post kan bij koninklijk besluit ook een honorair consulair ambtenaar worden
      aangesteld.

      3 Tot hoofd van een tijdelijke diplomatieke zending kan bij koninklijk besluit ook een persoon die geen ambtenaar
      is worden aangesteld, mits deze de Nederlandse nationaliteit bezit.

      4 Hoofden van vertegenwoordigingen van het Koninkrijk in het buitenland worden bij koninklijk besluit, waar nodig,
      van geloofds- en terugroepingsbrieven, benoemingsbrevetten of inleidingsbrieven voorzien.

      5 Als hoofd van een vaste diplomatieke zending kan door Onze Minister, indien een benoeming als bedoeld in het
      eerste lid niet heeft plaatsgevonden, een ambtenaar worden aangewezen in de hoedanigheid van Zaakgelastigde. Onze
      Minister voorziet deze, indien nodig, van een inleidingsbrief.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel7
