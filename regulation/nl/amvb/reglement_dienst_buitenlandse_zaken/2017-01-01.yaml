      1 Onze Minister verricht zijn taak met betrekking tot de begeleiding van verzuim en de arbeidsgezondheidskundige
      begeleiding op grond van de [Arbeidsomstandighedenwet][ref1], dan wel zoveel mogelijk overeenkomstig die wet indien
      het de bij een vertegenwoordiging van het Koninkrijk in het buitenland geplaatste ambtenaar betreft, alsmede op
      grond van de bepalingen in dit hoofdstuk.

      2 Ter voorbereiding op plaatsing buiten Nederland, gedurende plaatsing buiten Nederland en in verband met
      terugplaatsing naar Nederland omvat de arbeidsgezondheidskundige begeleiding tevens de gezondheidskundige
      begeleiding van de gezinsleden van de ambtenaar.

      3 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop invulling wordt gegeven
      aan de begeleiding van verzuim, de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen procedures.

      4 De ambtenaar is in geval van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte verplicht dit zo
      spoedig mogelijk, maar in elk geval niet later dan op de tweede dag van die ongeschiktheid, te melden.

      5 Onze Minister kan ten aanzien van de ambtenaar die korter dan een jaar volledig ongeschikt is geweest zijn arbeid
      te verrichten, bepalen dat hij zijn arbeid slechts mag hervatten nadat Onze Minister hiervoor toestemming heeft
      verleend.

      6 De ambtenaar die wegens ziekte gedurende een jaar of langer volledig ongeschikt is geweest zijn arbeid te
      verrichten mag zijn arbeid slechts hervatten, nadat Onze Minister hiervoor toestemming heeft verleend.

      7 De in het vijfde en zesde lid bedoelde toestemming wordt eerst verleend nadat er een medisch advies is van de
      deskundige persoon of de arbodienst.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: 50a
    text: |-
      1 De ambtenaar kan worden verplicht om een arbeidsgezondheidskundig onderzoek te ondergaan:

      a. voor zover dit noodzakelijk is om te beoordelen of de ambtenaar van 55 jaar en ouder in staat is nachtarbeid
      te verrichten;

      b. indien Onze Minister gegronde redenen heeft om te twijfelen aan de goede gezondheidstoestand van de ambtenaar;

      c. indien de ambtenaar niet meer volledig geschikt is gebleken voor het verrichten van zijn arbeid;

      d. ter beantwoording van de vraag of de ambtenaar tijdens het tijdvak waarin hij wegens ziekte ongeschikt is om
      zijn arbeid te verrichten, in het belang van zijn genezing arbeid mag verrichten en om vast te stellen welke arbeid
      wenselijk wordt geacht;

      e. indien de ambtenaar in contact staat of kort geleden heeft gestaan met een persoon die een ziekte heeft waarvoor
      ingevolge de [Wet publieke gezondheid][ref1] een nominatieve aangifteplicht geldt;

      f. om te beoordelen of er sprake is van een situatie als bedoeld in
      [artikel 104, derde lid, aanhef en onderdelen a en b][ref2];

      g. om te beoordelen of de ambtenaar die wegens ziekte volledig ongeschikt is geweest zijn arbeid te verrichten zijn
      arbeid mag hervatten;

      h. voor zover dit voortvloeit uit enige wettelijke verplichting;

      i. indien de ambtenaar in verband met de uitoefening van zijn werkzaamheden aan bijzonder gevaar voor zijn
      gezondheid blootstaat of is benoemd in een functie waarvoor bij aanstelling een geneeskundig onderzoek is vereist
      als bedoeld in [artikel 23, vierde lid, onderdeel b][ref3];

      j. om bij een verzoek als bedoeld in [artikel 104, negende lid][ref4], te beoordelen of de ambtenaar lichamelijk en
      psychisch in staat is zijn functie te blijven vervullen.

      2 Onze Minister stelt de ambtenaar buiten dienst indien na een arbeidsgezondheidskundig onderzoek als bedoeld in
      het eerste lid, blijkt dat sprake is van een zodanige lichamelijke of geestelijke toestand dat de belangen van de
      ambtenaar, van de dienst of van bij het verrichten van de arbeid betrokken derden zich er tegen verzetten dat de
      ambtenaar zijn arbeid blijft verrichten. De ambtenaar wordt niet buiten dienst gesteld indien hem andere passende
      werkzaamheden kunnen worden opgedragen. Indien de ambtenaar buiten dienst wordt gesteld, wordt hij geacht wegens
      ziekte ongeschikt te zijn tot het verrichten van zijn arbeid, in welk geval de overige bepalingen van dit hoofdstuk
      van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0024705
