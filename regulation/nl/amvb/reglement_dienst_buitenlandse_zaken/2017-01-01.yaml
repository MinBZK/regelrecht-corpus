  - number: 149a
    text: |-
      Onze Minister kan de bevoegdheid tot het stellen van regels met een sterk technisch karakter krachtens dit besluit
      mandateren.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel149a
  - number: 149b
    text: |-
      1 Ten aanzien van de ambtenaar en de gewezen ambtenaar van wie de eerste dag van ongeschiktheid tot het verrichten
      van zijn arbeid wegens ziekte is gelegen voor 1 januari 2004, blijven de [artikelen 28][ref1], [35][ref2],
      [38][ref3], [104][ref4], [105a][ref5], [108][ref6] en [109][ref7] en [hoofdstuk X][ref8] van het Reglement Dienst
      Buitenlandse Zaken van toepassing zoals deze luidden op 30 november 2005, met dien verstande dat voor artikel 54cb
      in genoemd hoofdstuk X in de plaats treedt [artikel 54g][ref9] zoals dat thans luidt.

      2 Voor de toepassing van het eerste lid worden perioden van ongeschiktheid tot werken geacht eenzelfde, niet
      onderbroken periode van ongeschiktheid te vormen, indien zij elkaar met een onderbreking van minder dan vier weken
      opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof
      wordt genoten overeenkomstig [artikel 3:1, tweede lid en derde lid, van de Wet arbeid en zorg][ref10] of een
      uitkering op grond van [artikel 3:8][ref11], of [3:10, eerste lid, van die wet][ref12], tenzij de ongeschiktheid
      redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak.


