    text: |-
      1 Waar in dit reglement sprake is van gezinsleden, worden daaronder verstaan:

      a. de huwelijkspartner van betrokkene,

      b. de minderjarige kinderen, adoptief- of stiefkinderen van de betrokkene welke ten laste van betrokkene komen,

      c. door Onze Minister als gezinslid beschouwde andere minderjarige kinderen, adoptief- of stiefkinderen of
      pleegkinderen van betrokkene of van diens huwelijkspartner, alsmede

      d. door Onze Minister als gezinslid beschouwde meerderjarige studerende of invalide kinderen, adoptief-, stief- of
      pleegkinderen van betrokkene of van diens huwelijkspartner.

      2 In dit reglement wordt onder huwelijkspartner mede verstaan de geregistreerde partner alsmede de levenspartner
      met wie de niet-gehuwde ambtenaar samenwoont en – met het oogmerk duurzaam samen te leven – een gemeenschappelijke
      huishouding voert op basis van een notarieel verleden samenlevingscontract bevattende de wederzijdse rechten en
      verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding. Onder weduwe en weduwnaar wordt
      mede begrepen de achtergebleven geregistreerde partner alsmede de achtergebleven levenspartner. Tegelijkertijd kan
      slechts één persoon als levenspartner dan wel weduwe of weduwnaar worden aangemerkt. Onze Minister kan verlangen
      dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt dat een samenlevingscontract als
      bedoeld in de eerste volzin is gesloten.

      3 Bij ministeriële regeling worden regels gesteld op grond waarvan een tijdelijke voorziening kan worden
      getroffen voor de toepassing van dit reglement, indien de vertegenwoordiging van het Koninkrijk in het buitenland
      waar de betrokken ambtenaar is geplaatst geen notariële bevoegdheid heeft en niet de mogelijkheid bestaat een
      samenlevingscontract notarieel in het desbetreffende land te doen opmaken.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel2
  - number: '3'
    text: |-
      1 Waar in dit reglement sprake is van de formatie, wordt daaronder verstaan de kwantitatieve omvang van het
      Ministerie van Buitenlandse Zaken en de zich daarbinnen voordoende kwalitatieve structuur. De formatie is
      samengesteld uit formaties van de binnen het ministerie voorkomende dienstonderdelen en de vertegenwoordigingen van
      het Koninkrijk in het buitenland.

      2 Onze Minister stelt na advies van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de formatie vast.
      Onze Minister bepaalt de inrichting van het Ministerie van Buitenlandse Zaken met inachtneming van de formatie,
      volgens met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties overeen te komen regels.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel3
  - number: '4'
    text: |-
      1 Tenzij anders is bepaald, wordt in dit reglement onder salaris, bezoldiging, vakantie-uitkering en
      eindejaarsuitkering verstaan: hetgeen daaronder wordt verstaan in het [BBRA 1984][ref1].

      2 In gevallen waarin niet is bepaald wie bevoegd is tot het nemen van besluiten of het doen van voordrachten
      krachtens dit reglement, is Onze Minister bevoegd.


