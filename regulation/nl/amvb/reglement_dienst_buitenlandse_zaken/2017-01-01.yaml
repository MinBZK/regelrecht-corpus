  - number: '110'
    text: |-
      1 Indien het overlijden van de ambtenaar is veroorzaakt door een dienstongeval of een door het verrichten van zijn
      arbeid opgelopen beroepsziekte, wordt aan degene die in verband met dit overlijden krachtens het Pensioenreglement
      een nabestaandenpensioen geniet, een uitkering toegekend ten bedrage van 18% van het resultaat van de
      vermenigvuldiging van:

      a. indien het gaat om de partner, vijf zevende deel van 1,75 procent van het pensioengevend inkomen en de
      pensioengeldige diensttijd, zoals deze begrippen door de Stichting Pensioenfonds ABP worden gehanteerd ten aanzien
      van overheidswerknemers als bedoeld in [artikel 2, eerste lid, van de Wet privatisering ABP][ref1];

      b. indien het gaat om de wees waarvan de verzorger geen recht heeft op partnerpensioen of bijzonder
      partnerpensioen, een zevende deel van 1,75 procent van het pensioengevend inkomen en de pensioengeldige diensttijd,
      zoals deze begrippen door de Stichting Pensioenfonds ABP worden gehanteerd ten aanzien van overheidswerknemers als
      bedoeld in [artikel 2, eerste lid, van de Wet privatisering ABP][ref2];

      c. indien het gaat om de wees zonder verzorger als bedoeld in onderdeel b, twee zevende deel van 1,75
      procent van het pensioengevend inkomen en de pensioengeldige diensttijd, zoals deze begrippen door
      de Stichting Pensioenfonds ABP worden gehanteerd ten aanzien van overheidswerknemers als bedoeld in
      [artikel 2, eerste lid, van de Wet privatisering ABP][ref3].

      Indien de weduwe of weduwnaar een samenlevingscontract sluit dan wel een geregistreerd partnerschap aangaat,
      eindigt de uitkering met ingang van de maand volgende op de datum van het sluiten van het samenlevingscontract dan
      wel het aangaan van het geregistreerd partnerschap.

      2 De uitkering eindigt met ingang van de dag waarop de overledene de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref4], zou hebben bereikt, dan wel, indien de partner, zoals
      dit begrip door de Stichting Pensioenfonds ABP wordt gehanteerd ten aanzien van overheidswerknemers als bedoeld
      in [artikel 2, eerste lid, van de Wet privatisering ABP][ref5] aan wie een pensioen werd toegekend, hertrouwt, met
      ingang van de maand volgende op de datum van het hertrouwen.

      3 Het eerste lid is van overeenkomstige toepassing op de gewezen ambtenaar ten aanzien van wie
      [artikel 54b, derde lid][ref6], toepassing heeft gevonden, indien zijn overlijden het rechtstreeks gevolg is van de
      arbeidsongeschiktheid, bedoeld in dat artikel.


