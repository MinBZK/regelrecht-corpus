    text: |-
      Voor de vertegenwoordigingen van het Koninkrijk in het buitenland stelt Onze Minister ter
      zake van de medezeggenschap regels vast, die zoveel mogelijk in overeenstemming zijn met de
      [Wet op de ondernemingsraden][ref1].

      Deze regels houden rekening met de bijzondere omstandigheden van het werkzaam zijn bij een vertegenwoordiging van
      het Koninkrijk in het buitenland.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel143
