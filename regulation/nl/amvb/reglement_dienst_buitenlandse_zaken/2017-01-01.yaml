  - number: 50c
    text: |-
      1 De ambtenaar die in contact staat, of kort geleden gestaan heeft, met een persoon die een ziekte heeft waarvoor
      ingevolge het krachtens de [Wet publieke gezondheid][ref1] bepaalde een nominatieve aangifteplicht geldt, mag zijn
      dienst slechts verrichten en heeft slechts toegang tot dienstgebouwen, -lokalen en -terreinen indien hem daartoe
      toestemming is verleend. Deze toestemming wordt slechts verleend na positief medisch advies van de deskundige
      persoon of de arbodienst.

      2 De ambtenaar die verkeert in de in het vorige lid omschreven situatie, is verplicht daarvan ten spoedigste
      kennis te geven aan de deskundige persoon of de arbodienst. Hij is gehouden zich te gedragen naar de vanwege de
      deskundige persoon of de arbodienst gegeven aanwijzingen, waaronder die met betrekking tot het ondergaan van een
      arbeidsgezondheidskundig onderzoek.

      3 Gedurende de periode dat de ambtenaar ingevolge het bepaalde in dit artikel zijn dienst niet verricht, geniet hij
      zijn volle bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0024705
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel50c
