  - number: '31'
    text: |-
      De ambtenaar ontvangt over de tijd, gedurende welke hij in strijd met zijn verplichtingen opzettelijk nalaat zijn
      dienst te verrichten, geen bezoldiging.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel31
  - number: '32'
    text: |-
      De beloning van de ambtenaar die is aangesteld voor enkele diensten, niet vallende binnen de taak van het
      desbetreffende dienstvak, wordt bepaald op een voor elk geval of voor elke te verrichten dienst, afzonderlijk vast
      te stellen bedrag, met inachtneming van [artikel 16, achtste lid][ref1].


