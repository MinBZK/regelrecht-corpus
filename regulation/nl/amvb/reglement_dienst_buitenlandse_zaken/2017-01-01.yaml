  - number: 41d
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot de [artikelen 41 tot en met 41c][ref1] nadere en zonodig
      afwijkende regels worden gesteld, zonodig onderscheiden naar degenen die in Nederland dan wel buiten Nederland
      zijn geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel41
