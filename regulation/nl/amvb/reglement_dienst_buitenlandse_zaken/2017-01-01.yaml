  - number: 43d
    text: |-
      1 Tenzij de belangen van de dienst zich daartegen verzetten, wordt buitengewoon verlof met behoud van bezoldiging
      verleend:

      a. voor het zoeken van een woning vanwege overplaatsing: ten hoogste twee dagen;

      b. bij verhuizing vanwege overplaatsing: aan hen die een eigen huishouding hebben: twee dagen, zonodig te verlengen
      tot drie en in zeer bijzondere gevallen tot vier dagen en aan hen die niet een eigen huishouding hebben: ten
      hoogste twee dagen.

      2 Bij ministeriële regeling kunnen nadere of afwijkende regels worden gesteld, zonodig onderscheiden naar degenen
      die in Nederland dan wel in het buitenland zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel43d
  - number: 43e
    text: |-
      1 Tenzij de belangen van de dienst zich daartegen verzetten, wordt aan de ambtenaar buitengewoon verlof met behoud
      van bezoldiging verleend:

      a. bij zijn huwelijk: twee dagen;

      b. tot het bijwonen van een huwelijk van bloed- of aanverwanten in de eerste en tweede graad: een dag;

      c. bij overlijden van:

      1e. in [artikel 45d, tweede lid][ref1], genoemde personen: vier dagen;

      2e. bloed- of aanverwanten in de tweede graad: twee dagen, of, indien de ambtenaar is belast met de regeling van de
      lijkbezorging of van de nalatenschap dan wel van beide, ten hoogste vier dagen;

      d. bij bevalling van zijn huwelijkspartner: ten hoogste twee dagen;

      e. na de bevalling van de echtgenote of degene van wie hij het kind erkent, gedurende een tijdvak van vier weken
      vanaf de eerste dag dat het kind feitelijk op hetzelfde adres als de moeder woont: twee dagen.

      2 Voor de toepassing van dit artikel wordt onder huwelijk mede begrepen het sluiten van een samenlevingscontract
      als bedoeld in [artikel 2, tweede lid][ref2], of het aangaan van een geregistreerd partnerschap.

      3 Buitengewoon verlof dat aan de ambtenaar op grond van het eerste lid wordt verleend in verband met
      aanverwantschap die door zijn huwelijk is ontstaan met bloedverwanten van zijn huwelijkspartner, wordt op gelijke
      wijze verleend aan de ambtenaar die ongehuwd samenwoont als bedoeld in [artikel 2, tweede lid][ref3], of aan de
      ambtenaar die een geregistreerd partnerschap is aangegaan, met betrekking tot dezelfde bloedverwanten van zijn
      levenspartner of van zijn geregistreerde partner.

      4 Bij ministeriële regeling kunnen nadere of afwijkende regels worden gesteld voor degenen die in het buitenland
      zijn geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel45d
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel2
