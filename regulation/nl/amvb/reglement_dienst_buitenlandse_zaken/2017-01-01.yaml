  - number: '16'
    text: |-
      1 Op ambtenaren zijn van toepassing de [hoofdstukken I tot en met XIV][ref1] en [XXI tot en met XXV][ref2].

      2 Op degenen die ingevolge het [derde en vierde lid van artikel 8][ref3] bij een vertegenwoordiging
      van het Koninkrijk in het buitenland zijn gedetacheerd of toegevoegd, dan wel ingevolge het
      [zesde lid van artikel 8][ref4] aan een tijdelijke diplomatieke zending zijn toegevoegd, zijn van toepassing de
      [hoofdstukken I tot en met III][ref5] en [XXI tot en met XXV][ref6].

      3 Op werknemers zijn van toepassing de [hoofdstukken I tot en met III][ref7], [XVIII][ref8] en
      [XXI tot en met XXV][ref9].

      4 Op honoraire consulaire ambtenaren zijn van toepassing de [hoofdstukken I tot en met III][ref10], [XIX][ref11]
      en [XXI tot en met XXV][ref12].

      5 Op honoraire adviseurs zijn van toepassing de [hoofdstukken I tot en met III][ref13] en
      [XX tot en met XXV][ref14].

      6 In de artikelen van de in het eerste tot en met vijfde lid genoemde hoofdstukken worden waar nodig bepalingen van
      andere hoofdstukken van overeenkomstige toepassing verklaard, of wordt de toepasselijkheid van artikelen beperkt
      tot een groep of groepen van degenen die daarin zijn genoemd.

      7 De [hoofdstukken VI][ref15], [VIII][ref16] en [IX][ref17] zijn niet van toepassing op ambtenaren met
      gedeeltelijke dag-, week- of jaartaken, die niet regelmatig dienst doen. Ten aanzien van de in die hoofdstukken
      geregelde onderwerpen worden voor hen voor elk betrokken dienstonderdeel de nodige bepalingen vastgesteld.

      8 Op de ambtenaar die is aangesteld voor het verrichten van enkele diensten niet vallende binnen de taak van het
      desbetreffende dienstonderdeel, waarbij per dienst een afzonderlijke beloning wordt vastgesteld, zijn niet van
      toepassing:

      a. [ hoofdstuk V][ref18];

      b. de [artikelen 31][ref19] en [33 tot en met 33a][ref20];

      c. de[ hoofdstukken VIII][ref21] en [IX][ref22];

      d. [hoofdstuk X, paragrafen 2][ref23] en [3][ref24];

      e. de [artikelen 45a][ref25], [54d][ref26], [56][ref27] en [57][ref28].


