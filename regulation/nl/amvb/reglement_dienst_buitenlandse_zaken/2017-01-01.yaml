    text: |-
      1 De ambtenaar kan een aanvraag indienen om zijn arbeidsduur te vermeerderen of te verminderen voor een periode van
      ten hoogste de duur van zijn plaatsing in de huidige of daarop volgende functie. De ambtenaar vermeldt daarbij zijn
      wensen met betrekking tot de omvang van de aanpassing van zijn arbeidsduur en de spreiding van de te werken uren
      over de week.

      2 Een aanvraag als bedoeld in het eerste lid wordt toegewezen, tenzij het dienstbelang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel39
  - number: 39a
    text: |-
      1 Het bevoegd gezag breidt de formatie van de organisatorische eenheid waar de ambtenaar die lid
      is van de ondernemingsraad werkzaam is, uit met de tijd die op grond van de [artikelen 17][ref1] en
      [18 van de Wet op de ondernemingsraden][ref2] voor die ambtenaar is vastgesteld, voor zover dit noodzakelijk is
      om gedurende de periode van het lidmaatschap de door de organisatorische eenheid te verrichten werkzaamheden te
      realiseren.

      2 De ambtenaar, bedoeld in het eerste lid, heeft op zijn aanvraag voor de resterende duur van zijn lidmaatschap van
      de ondernemingsraad recht op uitbreiding van zijn arbeidsduur met het aantal uren waarmee het bevoegd gezag vanwege
      dat lidmaatschap op grond van het eerste lid de formatie heeft uitgebreid. [Artikel 37, tweede lid][ref3], is van
      overeenkomstige toepassing. Een aanvraag als bedoeld in de eerste volzin wordt niet toegewezen zolang de ambtenaar
      geheel of gedeeltelijk ongeschikt is tot het verrichten van zijn arbeid wegens ziekte.


