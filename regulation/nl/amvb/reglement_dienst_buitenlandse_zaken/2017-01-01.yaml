  - number: 57a
    text: |-
      1 Tenzij anders is bepaald, zijn de bepalingen van dit hoofdstuk niet van toepassing in de periode van 15 april
      2013 tot en met 31 december 2017.

      2 [Hoofdstuk VIIbis van het Algemeen Rijksambtenarenreglement][ref1] is van overeenkomstige toepassing in de
      periode van 15 april 2013 tot en met 31 december 2017, met dien verstande dat:

      a. een ambtenaar voor wie een plaatsingsduur is vastgesteld, niet overeenkomstig
      [hoofdstuk VIIbis van het Algemeen Rijksambtenarenreglement][ref2] verplichte VWNW-kandidaat wordt maar ter
      beschikking wordt gehouden tenzij:

      1e. het bevoegd gezag oordeelt dat de betrokken ambtenaar naar verwachting niet binnen de Dienst Buitenlandse Zaken
      herplaatst kan worden, of

      2e. de ambtenaar vooraf aan het bevoegd gezag kenbaar heeft gemaakt overeenkomstig
      [hoofdstuk VIIbis van het Algemeen Rijksambtenarenreglement][ref3] verplichte VWNW-kandidaat te willen worden;

      b. de ambtenaar die is geplaatst in het buitenland niet overeenkomstig
      [artikel 49cc, derde lid, van het Algemeen Rijksambtenarenreglement][ref4] aanspraak kan maken op plaatsing in een
      andere standplaats voordat de voor hem vastgestelde plaatsingsduur is afgelopen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
      [ref2]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
      [ref3]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel49cc
