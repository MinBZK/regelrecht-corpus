  - number: '145'
    text: |-
      1 a. De Commissie van Bezwaar bestaat uit de volgende leden:

      1°. een voorzitter;

      2°. een of meer plaatsvervangende voorzitters;

      3°. drie of meer leden-niet-ambtenaren, en

      4°. negen of meer leden-ambtenaren.

      b. De leden worden door Onze Minister benoemd en ontslagen.

      c. De voorzitter en plaatsvervangende voorzitters zijn niet werkzaam onder de verantwoordelijkheid van Onze
      Minister en Onze Minister, hoofd van het betrokken ministerie, en dienen bij voorkeur te behoren of te hebben
      behoord tot de Nederlandse rechterlijke macht. Zij worden telkenmale voor een periode van vier jaar benoemd.

      d. Leden-niet-ambtenaren worden, telkenmale voor een periode van vier jaar, benoemd op voordracht van, evenwel niet
      uit, de ondernemingsraad.

      e. Geen lid kunnen zijn: ambtenaren die buiten Nederland of bij de personeelsdienst zijn geplaatst, alsmede degenen
      die ophouden ambtenaar te zijn.

      f. Indien bezwaar wordt gemaakt door een gedetacheerde ambtenaar als bedoeld in
      [artikel 8, derde lid, onder a][ref1] of door een werknemer als bedoeld in [artikel 115][ref2] die in dienst is
      genomen ter ondersteuning van een gedetacheerde ambtenaar als bedoeld in [artikel 8, derde lid, onder a][ref3],
      wordt door Onze Minister aan de Commissie van Bezwaar een lid toegevoegd op voordracht van Onze Minister, hoofd van
      het betrokken ministerie.

      2 Met inachtneming van het eerste lid bepaalt Onze Minister:

      a. om welke redenen de leden kunnen worden geschorst en ontslagen;

      b. de wijze waarop de leden aftreden.

      3 De vergoeding van de voorzitter, plaatsvervangende voorzitters en de leden-niet-ambtenaren wordt door Onze
      Minister vastgesteld.

      4 De leden van de Commissie van Bezwaar, alsmede de in het vijfde lid genoemde secretarissen, zijn tot
      geheimhouding verplicht met betrekking tot de beraadslagingen in de Commissie.

      5 Onze Minister voegt een secretaris en zonodig een plaatsvervangend secretaris aan de Commissie van Bezwaar toe.

      6 a. Voor het behandelen van bezwaren vormt en bezet de Commissie van Bezwaar op voorstel van de voorzitter
      meervoudige kamers. Elke kamer bestaat uit:

      1°. de voorzitter of een plaatsvervangend voorzitter;

      2°. één lid-niet-ambtenaar en

      3°. één of drie leden-ambtenaren.

      b. Bij een bezwaar als bedoeld in [artikel 147][ref4] bestaat de kamer uit:

      1°. de voorzitter of een plaatsvervangend voorzitter en

      2°. twee of vier leden, waarvan ten minste één lid-ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
