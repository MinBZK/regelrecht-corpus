        artikel: '8'
        hoofdstuk: II
  - number: '13'
    text: |-
      1 Onze Minister draagt, zoveel mogelijk overeenkomstig de regels welke gelden voor degenen die op het departement
      werkzaam zijn, zorg voor een zo goed mogelijk arbeidsomstandighedenbeleid voor degenen die werkzaam zijn bij een
      vertegenwoordiging van het Koninkrijk in het buitenland.

      2 Ter voorbereiding op plaatsing in het buitenland, gedurende plaatsing in het buitenland, en in verband met
      terugplaatsing naar Nederland van ambtenaren, heeft het eerste lid tevens betrekking op hun gezinsleden. In dit
      kader erkent Onze Minister de bijzondere positie van de huwelijkspartner van de in het buitenland geplaatste
      ambtenaar.

      3 Bij ministeriële regeling kunnen voor de verwezenlijking van het eerste lid regels worden gesteld. De in het
      eerste lid bedoelden zijn gehouden zich naar die regelen te gedragen en zich er voor in te spannen dat deze voor
      zover van toepassing door hun gezinsleden worden nageleefd.

      4 Komt aan het gezinsverband in het buitenland van degenen die in het tweede lid van dit artikel zijn genoemd
      geheel of ten dele een eind, dan richt de bevordering van het welzijn zich, binnen door Onze Minister te stellen
      grenzen, en indien door betrokkenen gewenst, mede op de herplaatsing van de repatriërenden in de Nederlandse
      samenleving of andere samenleving van hun keuze.

      5 Het eerste tot en met vierde lid is van overeenkomstige toepassing op degenen die op de voet van het
      [derde tot en met zesde lid van artikel 8][ref1] bij een vertegenwoordiging van het Koninkrijk in het buitenland
      zijn gedetacheerd, dan wel daaraan zijn toegevoegd.

      6 a. Onze Minister benoemt één of meer ambtenaren tot contactfunctionaris.

      b. De Contactfunctionaris adviseert en assisteert gezinsleden van ambtenaren op hun verzoek aangaande zaken die
      verband houden met het persoonlijk welzijn van die gezinsleden in verband met de plaatsing van de ambtenaar in
      het buitenland, en adviseert Onze Minister aangaande voorzieningen in verband met het persoonlijk welzijn van de
      ambtenaar en diens gezinsleden.


