preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Buitenlandse Zaken van 2 juni 1986, nummer HDBZ/SF-140960;

    Overwegende dat het noodzakelijk is dat het Ministerie van Buitenlandse Zaken bij de zich sterk wijzigende
    internationale verhoudingen kan blijven beschikken over die ambtelijke deskundigheid en internationale ervaring die
    het voor het verwezenlijken van zijn beleidsdoelstellingen behoeft;

    Overwegende dat het gewenst is dat de functies vervuld worden door medewerkers wier loopbaan zich uitstrekt over
    het ministerie van Buitenlandse Zaken hier te lande en over de vertegenwoordigingen van het Koninkrijk in het
    buitenland, tenzij die functies daarvoor naar hun inhoud niet geschikt zijn;

    Overwegende dat het daarom dienstig is te komen tot de integratie van personeel van het ministerie van Buitenlandse
    Zaken hier te lande en van de Buitenlandse Dienst tot een geïntegreerde Dienst Buitenlandse Zaken;

    Overwegende dat daarbij wordt beoogd de door Onze Minister van Buitenlandse Zaken, Onze Minister zonder
    Portefeuille en Onze Minister van Economische Zaken getroffen regeling met betrekking tot de economische
    werkzaamheden van de vertegenwoordigingen van het Koninkrijk in het buitenland (28 januari 1955, nr. DBD-10296/PE)
    zonder wijziging voort te zetten;

    Overwegende ten slotte dat het wenselijk is gebleken de organisatie van deze dienst en de rechtspositie van allen
    die daartoe in binnen- en buitenland behoren in één reglement vast te leggen;

    Gelet op de artikelen 125 en 134 van de Ambtenarenwet 1929 (Stb. 530);

    De Raad van State gehoord (advies van 6 augustus 1986, nr. WO 2.86.0284);

    Gezien het nader rapport van voornoemde Minister van 19 november 1986, nummer HDBZ/SF-305425;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit reglement wordt verstaan onder:

      a. Onze Minister: Onze Minister van Buitenlandse Zaken;

      b. DBZ: Dienst Buitenlandse Zaken;

      c. Ambtenaar: de in [artikel 5, tweede lid, onder a][ref1], bedoelde ambtenaar van de DBZ, tenzij anders blijkt;

      d. Werknemer: degene die buiten Nederland op arbeidsovereenkomst naar burgerlijk recht in dienst is genomen voor
      werkzaamheden bij een vertegenwoordiging van het Koninkrijk in het buitenland;

      e. ARAR: [Algemeen Rijksambtenarenreglement][ref2];

      f. BBRA 1984: [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref3];

      g. Functie: Het samenstel van werkzaamheden, door de ambtenaar of werknemer te verrichten krachtens en
      overeenkomstig hetgeen door het daartoe bevoegde gezag aan betrokkene is opgedragen;

      h. Arbodienst: de door Onze Minister aangewezen arbodienst als bedoeld in de [Arbeidsomstandighedenwet][ref4];

      i. Ministeriële regeling: Regeling van Onze Minister;

      j. Volledige arbeidsduur: een arbeidsduur welke gemiddeld 36 werkuren per week omvat;

      k. Arbeidsduurfactor: een breuk waarvan de teller bestaat uit de voor de ambtenaar vastgestelde arbeidsduur en de
      noemer bestaat uit het getal 36;

      l. deskundige persoon: de door Onze Minister aangewezen deskundige persoon als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref5] die belast is met de taken, bedoeld in
      [artikel 14, eerste lid, onderdelen b of c, van die wet][ref6];

      m. *sector Rijk:* de ambtelijke diensten van:

      1° elk ministerie, met uitzondering van het Ministerie van Defensie;

      2° de Tweede Kamer en de Eerste Kamer der Staten-Generaal;

      3° de Raad van State;

      4° de Algemene Rekenkamer;

      5° de Nationale ombudsman;

      6° de Hoge Raad van Adel;

      7° het Kabinet van de Koning;

      8° de Kanselarij der Nederlandse Orden;

      9° het secretariaat van de commissie van toezicht op de inlichtingen- en veiligheidsdiensten;

      10° de Raad voor de rechtspraak, de rechtbanken, de gerechtshoven, de Centrale Raad van Beroep, het College van
      beroep voor het bedrijfsleven, de niet rechterlijke leden van de Raad voor de rechtspraak en van de besturen van
      voornoemde gerechten daaronder begrepen, en de gemeenschappelijke diensten die twee of meer van de in dit onderdeel
      genoemde organisaties in stand houden;

      n. *bevoegd gezag:* Onze Minister.


