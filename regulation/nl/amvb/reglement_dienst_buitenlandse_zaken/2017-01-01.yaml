      1 In afwijking van [artikel 41, tweede lid][ref1], wordt ten aanzien van aanspraak op vakantie-uren die vóór
      1 januari 2016 is ontstaan geen onderscheid gemaakt tussen wettelijke en bovenwettelijke vakantie-uren; deze
      aanspraak vervalt op 1 januari 2021.

      2 Onverminderd [artikel 41ab, eerste lid][ref2], kan het bevoegd gezag op aanvraag van de ambtenaar eenmaal per
      kalenderjaar zijn aanspraak op vakantie-uren die vóór 1 januari 2016 is ontstaan, met ten hoogste 22 vakantie-uren
      per kalenderjaar verlagen indien de ambtenaar een volledige werktijd heeft. Heeft de ambtenaar een andere werktijd,
      dan wordt dit aantal vermenigvuldigd met de voor hem geldende arbeidsduurfactor. Bij toepassing van de eerste
