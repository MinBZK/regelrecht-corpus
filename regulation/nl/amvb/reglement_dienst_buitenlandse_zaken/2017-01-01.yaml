  - number: '114'
    text: |-
      1 Onze Minister kan voor werkzaamheden bij een vertegenwoordiging van het Koninkrijk in het buitenland, werknemers
      op arbeidsovereenkomst naar burgerlijk recht in dienst nemen.

      2 Onze Minister bepaalt of een functie bij een vertegenwoordiging van het Koninkrijk in het buitenland door een
      lokaal in dienst te nemen werknemer zal worden vervuld.

      3 Het indienstnemen van werknemers die niet de Nederlandse nationaliteit bezitten is mogelijk, mits dezen in hun
      functie niet met daadwerkelijk overheidsgezag worden bekleed.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel114
  - number: '115'
    text: |-
      1 In overeenstemming met Onze Minister kan ter ondersteuning van:

      a. een gedetacheerde ambtenaar van een ander ministerie als bedoeld in [artikel 8, derde lid, onder a][ref1];

      b. een toegevoegde ambtenaar van Aruba, Curaçao of Sint Maarten als bedoeld in [artikel 8, vierde lid][ref2], of

      c. een ander als bedoeld in [artikel 8, vijfde lid][ref3], door Onze Minister, hoofd van het betrokken ministerie,
      onderscheidenlijk door de ander, bedoeld in artikel 8, vijfde lid, aan het hoofd van een vertegenwoordiging van het
      Koninkrijk in het buitenland volmacht worden verleend tot het in dienst nemen van een werknemer voor werkzaamheden
      bij die vertegenwoordiging.

      2 De werknemers, bedoeld in het eerste lid, worden met betrekking tot hun dienstverrichtingen gelijkgesteld met
      werknemers als bedoeld in [artikel 114][ref4]. Op de werknemers, bedoeld in het eerste lid, zijn zo veel mogelijk
      van overeenkomstige toepassing de bepalingen die in of krachtens dit reglement zijn gesteld betreffende werknemers
      als bedoeld in artikel 114.


