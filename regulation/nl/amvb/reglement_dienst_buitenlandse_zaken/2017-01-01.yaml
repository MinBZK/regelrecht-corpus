  - number: '30'
    text: |-
      Bij benoeming van een ambtenaar in een functie buiten het gezagsbereik van Onze Minister is vanaf de dag van ingang
      van de benoeming dit reglement op hem niet meer van toepassing en houdt betrokkene op ambtenaar van de DBZ te
      zijn, tenzij het een plaatsing op grond van [artikel 29][ref1] betreft, of aan betrokkene buitengewoon verlof wordt
      verleend op grond van [artikel 46][ref2].


