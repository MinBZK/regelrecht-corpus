  - number: 45a
    text: |-
      1 De vrouwelijke ambtenaar heeft in verband met haar bevalling aanspraak op zwangerschaps- en bevallingsverlof.

      2 Gedurende het zwangerschaps- en bevallingsverlof behoudt de vrouwelijke ambtenaar haar aanspraak op bezoldiging.

      3 De vrouwelijke ambtenaar heeft recht op een zwangerschapsverlof vanaf de dag waarop de bevalling blijkens
      een verklaring van een arts of van een verloskundige aangevende de vermoedelijke datum van de bevalling, binnen
      zes weken is te verwachten. Dit verlof gaat uiterlijk in vier weken voor de dag na de vermoedelijke datum van
      bevalling.

      4 De vrouwelijke ambtenaar heeft recht op een bevallingsverlof van tien weken vanaf de dag volgend op die van de
      bevalling. Dit verlof wordt verlengd tot ten hoogste zestien weken, voor zover het zwangerschapsverlof voorafgaand
      aan de vermoedelijke datum van bevalling, om andere redenen dan wegens ziekte minder dan zes weken heeft bedragen.

      5 Indien de vrouwelijke ambtenaar aan wie verlof is verleend gedurende dat verlof of gedurende een bepaalde periode
      van dat verlof tevens recht heeft op een financiële tegemoetkoming op basis van de [Wet arbeid en zorg][ref1],
      wordt gedurende de periode waarin sprake is van samenloop een inhouding op de bezoldiging toegepast welke
      overeenkomt met het bedrag van bedoelde financiële tegemoetkoming.

      6 Indien aan de gestelde voorwaarden voor het toekennen van een financiële tegemoetkoming als bedoeld in het vijfde
      lid is voldaan maar geen financiële tegemoetkoming is toegekend omdat de vrouwelijke ambtenaar geen aanvraag heeft
      ingediend, wordt het vijfde lid op overeenkomstige wijze toegepast. In dat geval wordt rekening gehouden met de
      financiële tegemoetkoming die aan de vrouwelijke ambtenaar zou zijn toegekend indien zij wel een aanvraag zou
      hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 45aa
    text: |-
      1 De gewezen vrouwelijke ambtenaar, wier tijdstip van ingang van haar ontslag is gelegen in de periode, bedoeld
      in [artikel 45a, eerste lid][ref1], behoudt haar aanspraak op haar laatstelijk genoten bezoldiging vermeerderd met
      de vakantie-uitkering en de eindejaarsuitkering. De aanspraak eindigt na 16 weken, te rekenen vanaf de eerste dag
      waarop haar zwangerschapsverlof als bedoeld in [artikel 45a, eerste lid][ref2], een aanvang heeft genomen.

      2 De gewezen vrouwelijke ambtenaar, wier bevalling wordt verwacht binnen vier maanden na het tijdstip van ingang
      van haar ontslag, ontvangt haar laatstelijk genoten bezoldiging vermeerderd met de vakantie-uitkering en de
      eindejaarsuitkering gedurende de periode die:

      a. aanvangt op de 41e dag voorafgaande aan de vermoedelijke datum van bevalling; en

      b. eindigt op de 70e dag na de datum van bevalling.

      3 De periode, bedoeld in het tweede lid, wordt verlengd tot 16 weken, indien die periode door een voortijdige
      bevalling minder dan 16 weken heeft bedragen.

      4 De gewezen vrouwelijke ambtenaar, wier bevalling niet wordt verwacht binnen vier maanden na het tijdstip
      van ingang van haar ontslag, maar die niettemin binnen die periode bevalt, ontvangt haar laatstelijk genoten
      bezoldiging vermeerderd met de vakantie-uitkering en de eindejaarsuitkering gedurende de periode die:

      a. aanvangt op de datum van bevalling; en

      b. eindigt op de 70e dag na de datum waarop de bevalling heeft plaatsgevonden.

      5 De [artikelen 45a, vijfde en zesde lid][ref3], [54e, tweede lid][ref4], en [57][ref5], zijn van overeenkomstige
      toepassing.


