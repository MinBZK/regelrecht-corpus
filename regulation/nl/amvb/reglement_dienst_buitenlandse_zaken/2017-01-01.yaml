  - number: '125'
    text: |-
      1 Het loon van de werknemer wordt vastgesteld overeenkomstig het lokale loonpeil.

      2 Onze Minister kan in plaats van een brutoloon een nettoloon toekennen.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel125
  - number: '127'
    text: |-
      Bij beëindiging van de dienstbetrekking, wordt aan de betrokkene een uitkering toegekend overeenkomstig het lokaal
      geldend arbeidsrecht dan wel de lokaal geldende gebruiken onverminderd

      a. de mogelijkheid van uitkeringen op de voet van de in [artikel 128][ref1] genoemde regelingen;

      b. de mogelijkheid van een suppletie op oudedagsvoorzieningen, nabestaandenvoorzieningen of
      arbeidsongeschiktheidsvoorzieningen als bedoeld in [artikel 130][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel130
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel127
