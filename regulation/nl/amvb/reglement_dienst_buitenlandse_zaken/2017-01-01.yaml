      Door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties krachtens [artikel 4a van het ARAR][ref1] gestelde
      regels ten aanzien van de werving en selectie van ambtenaren zijn van overeenkomstige toepassing. Bij ministeriële
      regeling kunnen nadere en zonodig afwijkende regels worden gesteld.


