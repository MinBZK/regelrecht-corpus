  - number: '23'
    text: |-
      1 Een aanstelling voor de tijd van langer dan drie maanden kan slechts plaatsvinden, indien Onze Minister op grond
      van de gegevens waarover hij beschikt van oordeel is dat de betrokkene in voldoende mate geschikt en bekwaam is.

      2 Onze Minister kan voor een bepaalde functie of voor een groep van functies eisen van geschiktheid en bekwaamheid
      vaststellen waaraan de betrokkene moet voldoen om voor een aanstelling in aanmerking te komen.

      3 Teneinde vast te stellen of de betrokkene in voldoende mate geschikt of bekwaam is, wordt deze aan een onderzoek
      onderworpen, waaronder begrepen het verifiëren en zo nodig aanvullen van de gegevens die door de betrokkene
      desgevraagd zijn verstrekt.

      4 Het onderzoek, bedoeld in het derde lid, omvat tevens:

      a. een psychologisch onderzoek, indien daaraan naar het oordeel van Onze Minister behoefte bestaat;

      b. een geneeskundig onderzoek, indien

      1°. dit op grond van een wettelijk voorschrift verplicht is gesteld;

      2°. op grond van functie-eisen een onderzoek naar de medische geschiktheid van de betrokkene noodzakelijk is, of

      3°. indien de aanstelling geschiedt met het oogmerk van wisselende functievervulling op het departement en bij
      vertegenwoordigingen van het Koninkrijk in het buitenland, in welk geval het onderzoek door de deskundige persoon
      of de arbodienst gericht is op de bepaling van de medische geschiktheid voor dienstverrichting waar ook ter wereld.

      5 Onze Minister stelt vast voor welke functies een onderzoek naar de medische geschiktheid van de betrokkene
      noodzakelijk is.

      6 Onze Minister kan, met uitzondering van de gevallen, bedoeld in het zevende en achtste
      lid, van de betrokkene vergen dat deze een verklaring omtrent het gedrag als bedoeld in de
      [Wet justitiële en strafvorderlijke gegevens][ref1] overlegt.

      7 Indien een functie niet zijnde een vertrouwensfunctie als bedoeld in
      [artikel 1, eerste lid, onder a, van de Wet veiligheidsonderzoeken][ref2], bijzondere eisen stelt aan de
      integriteit of de verantwoordelijkheid van degene die deze functie vervult en indien een zwaarwegend algemeen
      belang dit vordert, kunnen aan Onze Minister justitiële gegevens worden verstrekt voor het verrichten van een
      onderzoek naar de betrouwbaarheid en de geschiktheid van een kandidaat voor die functie. Aanstelling in een
      zodanige functie is slechts mogelijk, indien op grond van het onderzoek tegen de vervulling door betrokkene van de
      desbetreffende functie geen bezwaar blijkt te bestaan.

      8 Aanstelling in een vertrouwensfunctie als bedoeld in
      [artikel 1, eerste lid, onder a, van de Wet veiligheidsonderzoeken][ref3], waaronder mede begrepen wordt
      aanstelling welke geschiedt met het oogmerk van wisselende functievervulling op het departement en bij
      vertegenwoordigingen van het Koninkrijk in het buitenland, is slechts mogelijk indien ten aanzien van de betrokkene
      een verklaring als bedoeld in [artikel 1, eerste lid, onder b, van die wet][ref4] is afgegeven.

      9 Onze Minister stelt nadere regels vast ter uitvoering van het onderzoek, bedoeld in het zevende lid. Deze
      nadere regels dienen in ieder geval waarborgen te bevatten omtrent een voldoende bescherming van de persoonlijke
      levenssfeer van betrokkene.

      10 Het geneeskundig onderzoek, bedoeld in het vierde lid, onderdeel b, mag pas plaatsvinden, indien de betrokkene
      naar het oordeel van Onze Minister op grond van het onderzoek, bedoeld in het derde lid, en eventueel na het
      psychologisch onderzoek, bedoeld in het vierde lid, onderdeel a, overigens voldoende bekwaam en geschikt is. Ook
      een verklaring omtrent het gedrag mag dan pas worden gevraagd.

      11 Een onderzoek als bedoeld in het zevende lid of een veiligheidsonderzoek wordt pas ingesteld als naar het
      oordeel van Onze Minister de betrokkene bekwaam en geschikt is voor de desbetreffende functie of voor wisselende
      functievervulling op het departement en bij vertegenwoordigingen van het Koninkrijk in het buitenland.

      12 Door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties gestelde nadere regels omtrent het onderzoek,
      bedoeld in het derde lid, zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0008277#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0008277#Artikel1
