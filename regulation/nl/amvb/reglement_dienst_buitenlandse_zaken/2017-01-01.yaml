        artikel: '48'
  - number: '57'
    text: |-
      1 Het bedrag van de bezoldiging of de laatstgenoten bezoldiging, bedoeld in de [artikelen 54][ref1],
      [54a, vierde lid][ref2], en [54b][ref3], en het bedrag van de eindejaarsuitkering, bedoeld in de genoemde
      artikelen, worden in voorkomende gevallen gewijzigd overeenkomstig een algemene wijziging van het salaris
      respectievelijk de eindejaarsuitkering.

      2 Indien de ambtenaar in het genot is van een toelage als bedoeld in [artikel 17][ref4], [17a][ref5], [18][ref6] of
      [18a van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref7], worden die toelagen voor de vaststelling
      van het in het eerste lid bedoelde bedrag, vastgesteld op het bedrag dat hem ingevolge zijn arbeidstijdpatroon zou
      zijn toegekend indien hij niet ongeschikt was geworden tot het verrichten van zijn arbeid wegens ziekte. Indien de
      vaststelling van het bedrag op deze wijze niet mogelijk is, wordt dit bedrag vastgesteld op het gemiddelde van het
      bedrag dat de ambtenaar per maand aan die toelagen heeft genoten over de twaalf kalendermaanden voorafgaande aan:

      a. de kalendermaand waarin de ambtenaar ongeschikt is geworden tot het verrichten van zijn arbeid wegens ziekte, of

      b. de kalendermaand waarin de gewezen ambtenaar wegens ziekte ongeschikt is geworden een naar aard en omvang
      soortgelijke functie te vervullen.

      3 Indien ook voor het overige de bezoldiging niet in een vast bedrag per maand kan worden uitgedrukt, wordt
      gerekend met het bedrag dat gemiddeld per maand is toegekend over de drie kalenderjaren voorafgaande aan de maand
      waarin:

      a. de ambtenaar ongeschikt is geworden tot het verrichten van zijn arbeid wegens ziekte;

      b. de gewezen ambtenaar wegens ziekte ongeschikt is geworden een naar aard en omvang soortgelijke functie te
      vervullen.

      4 Voor zover de ambtenaar of de gewezen ambtenaar geen drie kalendermaanden in dienst is geweest, wordt voor
      de toepassing van het tweede en derde lid gerekend met het bedrag dat hem gemiddeld aan bezoldiging per maand
      is toegekend over het tijdvak waarin hij in dienst is geweest vóór het ontstaan van de ongeschiktheid tot het
      verrichten van zijn arbeid respectievelijk tot het vervullen van een naar aard en omvang soortgelijke functie.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel54
