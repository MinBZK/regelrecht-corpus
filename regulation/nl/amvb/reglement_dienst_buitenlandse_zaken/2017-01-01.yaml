  - number: '87'
    text: |-
      1 De disciplinaire straffen die kunnen worden opgelegd, zijn:

      a. schriftelijke berisping;

      b. buitengewone dienst op andere dagen dan zondag en de voor de ambtenaar geldende kerkelijke feestdagen, zonder
      beloning of tegen een lagere dan de normale beloning en wel voor ten hoogste zes uren met een maximum van drie uren
      per dag;

      c. vermindering van het recht op jaarlijkse vakantie met ten hoogste een derde gedeelte van het aantal uren, waarop
      in het desbetreffende kalenderjaar aanspraak bestaat;

      d. geldboete van ten hoogste  € 22;

      e. gehele of gedeeltelijke inhouding van salaris tot een bedrag van ten hoogste het salaris over een halve maand;

      f. vaststelling van het salaris in de voor de ambtenaar geldende salarisschaal, op het bedrag behorend bij een
      salarisnummer dat maximaal twee salarisnummers lager is dan voor de ambtenaar geldt, of indien voor de functie
      waarin de ambtenaar is geplaatst geen salarisschaal geldt, vermindering van het salaris met ten hoogste 5%, een en
      ander voor de tijd van ten hoogste twee jaren;

      g. het niet toekennen van een hoger salarisnummer gedurende ten hoogste vier jaren;

      h. uitsluiting voor de tijd van ten hoogste vier jaren van indeling in een salarisschaal waarvoor een hoger
      maximumsalaris geldt, indien zodanige indeling anders volgens de daarvoor geldende regeling zou hebben
      plaatsgevonden;

      i. indeling in een salarisschaal waarvoor een lager maximumsalaris geldt dan dat verbonden aan de salarisschaal
      welke ingevolge het [BBRA 1984][ref1] behoort te gelden, een en ander al dan niet voor een bepaalde tijd en met of
      zonder vermindering van bezoldiging;

      j. verplaatsing, al dan niet met verlening van een tegemoetkoming in mogelijke verplaatsingskosten tot ten hoogste
      het bedrag, dat in geval van verplaatsing in het belang van de dienst zou kunnen worden verleend krachtens het
      [Verplaatsingskostenbesluit 1989][ref2], met dien verstande dat deze straf niet wordt opgelegd aan een buiten
      Nederland geplaatste ambtenaar;

      k. schorsing voor een bepaalde tijd met gehele of gedeeltelijke inhouding van bezoldiging; indien deze straf
      aan een buiten Nederland geplaatste ambtenaar is opgelegd, is [artikel 93, derde lid][ref3], van overeenkomstige
      toepassing;

      l. ontslag.

      2 Indien een straf als bedoeld in het eerste lid, onder g, h of i, is opgelegd, kan, indien het verdere gedrag van
      de ambtenaar naar het oordeel van het tot oplegging van de straf bevoegd gezag daartoe aanleiding heeft gegeven,
      zijn positie met ingang van een bepaald tijdstip geheel of ten dele in overeenstemming worden gebracht met de
      positie, zoals deze zonder strafoplegging zou zijn geweest.

      3 Bij het opleggen van een straf kan worden bepaald, dat zij niet ten uitvoer zal worden gelegd, indien de
      ambtenaar zich gedurende een vastgestelde termijn niet schuldig maakt aan soortgelijk plichtsverzuim, als waarvoor
      de bestraffing plaatsvindt, noch aan enig ander ernstig plichtsverzuim en hij zich houdt aan bij het opleggen van
      de straf eventueel gestelde bijzondere voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
      [ref2]: https://wetten.overheid.nl/BWBR0004630
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel93
