  - number: '118'
    text: |-
      1 Arbeidsovereenkomsten naar burgerlijk recht worden schriftelijk aangegaan in de Nederlandse taal; bij niet-
      Nederlanders met vertaling in een taal die de werknemer voldoende machtig is. Daarin worden ten minste vermeld:

      a. de naam, voornamen en geboortedatum van de werknemer;

      b. de datum waarop betrokkene in dienst treedt;

      c. of de arbeidsovereenkomst wordt aangegaan voor bepaalde of voor onbepaalde tijd; wordt deze voor bepaalde tijd
      aangegaan, dan wordt die tijd vermeld;

      d. welke periode als proeftijd is overeengekomen;

      e. het loon waarop de werknemer in dienst is genomen;

      f. het aan betrokkene toekomende genot van kost, inwoning of andere vormen van loon in natura, alsmede de daarmee
      verbandhoudende inhoudingen;

      g. de aard van de werkzaamheden welke de werknemer gewoonlijk zullen worden opgedragen;

      h. de bepalingen, in of krachtens dit reglement gesteld, welke op de arbeidsovereenkomst van toepassing zijn.

      2 Wijzigingen van de in of krachtens dit reglement getroffen regelingen werken door naar de met betrokkene gesloten
      arbeidsovereenkomst.

      3 De werknemer wordt, zo mogelijk vóór de indiensttreding, schriftelijk in kennis gesteld van de hoofdpunten van
      zijn rechtspositie; indien de werknemer de Nederlandse taal niet machtig is, geschiedt dit in een taal welke in het
      internationale verkeer ter plaatse gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel118
  - number: '121'
    text: |-
      1 Bij ministeriële regeling wordt een regeling vastgesteld ter nadere bepaling van de rechtspositie van lokaal
      indienstgenomen werknemers.

      2 Onze Minister kan in de in het eerste lid bedoelde regeling bepalen, welke onderwerpen, en met inachtneming van
      welke voorwaarden, namens hem nader dienen te worden geregeld.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel121
  - number: '122'
    text: |-
      De in [artikel 121][ref1] bedoelde nadere regeling betreft in elk geval de volgende onderwerpen:

      a. indienstneming voor bepaalde of onbepaalde tijd, al dan niet met een proeftijd;

      b. geneeskundige keuring bij indienstneming;

      c. een functie-indelingsschema, naar werksoort en functieniveau;

      d. een stelsel van loonschalen, met de maximale, minimale en tussengelegen loonnummers;

      e. de toekenning van een loonschaal, en de toekenning van een loonnummer;

      f. vaststelling en uitbetaling van het loon;

      g. vervallen van het recht op loon;

      h. betaling van loon tijdens ziekte;

      i. opdragen van overwerk, en vergoeding van de desbetreffende arbeidsuren;

      j. de muntsoort, of de muntsoorten, waarin lonen en andere bedragen aan de werknemer worden uitbetaald;

      k. dienst- en werktijden;

      l. vakantie en verlof;

      m. bedrijfsgeneeskundige begeleiding;

      n. tegemoetkoming in ziektekosten;

      o. aanspraken bij overlijden;

      p. zwangerschaps- en bevallingsverlof;

      q. opzegging tijdens zwangerschap;

      r. plichtsverzuim en disciplinaire straffen;

      s. het verstrekken van een opdracht tot het volgen van opleidingen, alsmede het verlenen van studiefaciliteiten;

      t. einde, beëindiging en opzegging van de arbeidsovereenkomst;

      u. uitkering bij beëindiging van de dienstbetrekking;

      v. uitreiking van een getuigschrift;

      w. vergoeding van reis- en verblijfkosten bij dienstreizen;

      x. algemene verplichtingen;

      y. functioneringsgesprekken en beoordelingen;

      z. bijzondere beloningen;

      aa. bekendstelling van regelingen waarin de rechtspositie van de werknemer is neergelegd, alsmede van wijzigingen
      daarin;

      bb. sociale voorzieningen, en

      cc. suppletie op oudedags-, nabestaanden- en arbeidsongeschiktheidsvoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel121
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel122
