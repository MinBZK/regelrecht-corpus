  - number: '29'
    text: |-
      1 Naast plaatsingen ingevolge [artikel 27][ref1] kan Onze Minister een ambtenaar:

      a. in overeenstemming met het desbetreffende bevoegde gezag, plaatsen bij een ander ministerie, waaronder in dit
      artikel tevens wordt verstaan een orgaan als bedoeld in [artikel 7, tweede lid, van het ARAR][ref2];

      b. in overeenstemming met de leiding van een volkenrechtelijke organisatie waarvan het Koninkrijk of Nederland lid
      is, voordragen voor een functie dan wel plaatsen bij die volkenrechtelijke organisatie;

      c. in overeenstemming met de regering van Aruba, Curaçao onderscheidenlijk Sint Maarten, plaatsen bij een
      ministerie van Aruba, Curaçao of Sint Maarten;

      d. belasten met een bijzondere opdracht buiten het verband van het Ministerie van Buitenlandse Zaken, mits de aard
      van die opdracht samenhangt met de in [artikel 6][ref3] genoemde taak van de DBZ.

      2 Tot een plaatsing als bedoeld in het eerste lid kan slechts worden besloten indien die plaatsing, mede gezien
      de loopbaan van betrokkene, in het belang van de dienst is. De [artikelen 26][ref4] en [27][ref5] zijn van
      overeenkomstige toepassing.

      3 Plaatsingen als bedoeld in het eerste lid, onder b, c en d, behoeven, ook ten aanzien van de standplaats, de duur
      van de plaatsing en de in het vijfde lid bedoelde voorwaarden, de voorafgaande instemming van betrokkene.

      4 Gedurende plaatsingen als bedoeld in het eerste lid, behoudt betrokkene zijn rechtspositie als ambtenaar zoals
      omschreven in dit reglement, voor zover dat verenigbaar is met zijn rechtspositie uit hoofde van de functie bij
      het andere Nederlandse ministerie, de volkenrechtelijke organisatie of het ministerie van Aruba, Curaçao of Sint
      Maarten, dan wel uit hoofde van de bijzondere opdracht bedoeld in het eerste lid, onder d. Indien de functie bij
      de volkenrechtelijke organisatie, bij het ministerie van Aruba, Curaçao of Sint Maarten, dan wel de bijzondere
      opdracht, dit nodig maakt, is betrokkene ontslagen van de ambtseed met uitzondering van de geheimhoudingsplicht.

      5 Bij plaatsingen als bedoeld in het eerste lid, bericht Onze Minister betrokkene tevoren welke rechten en
      verplichtingen gelden uit hoofde van het vierde lid. Met inachtneming van het zesde lid wordt bepaald welke
      voorzieningen ter zake van bezoldiging alsmede tegemoetkomingen en vergoedingen voor betrokkene in verband met
      bedoelde plaatsing zullen gelden.

      6 Bij plaatsing buiten Nederland worden de voorzieningen, bedoeld in het vijfde lid, tweede volzin, zoveel mogelijk
      afgestemd op die welke voor betrokkene zouden hebben gegolden indien hij in een vergelijkbare functie zou zijn
      geplaatst bij een vertegenwoordiging van het Koninkrijk in het buitenland met als standplaats de plaats van
      vestiging van de desbetreffende instantie. Bij de vaststelling van deze voorzieningen wordt rekening gehouden met
      de gezinsomstandigheden van betrokkene, de aard en de duur van de plaatsing alsmede met de voorzieningen welke door
      de instantie bij wie de plaatsing geschiedt, worden of kunnen worden verstrekt. Een en ander met eerbiediging van
      dwingende bepalingen in een rechtspositieregeling van de desbetreffende instantie.


