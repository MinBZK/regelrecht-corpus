    text: |-
      1 Met betrekking tot het overleg met de centrales van verenigingen van ambtenaren zijn de
      [artikelen 105 tot en met 117 van het ARAR][ref1] van overeenkomstige toepassing, behoudens het gestelde in het
      tweede en derde lid.

      2 Een voorgenomen besluit als bedoeld in de [artikelen 113][ref2] en [115 van het ARAR][ref3] heeft betrekking op:

      1°. ambtenaren;

      2°. werknemers;

      3°. honoraire consulaire ambtenaren;

      4°. honoraire adviseurs;

      5°. personen die ingevolge [artikel 8, zesde lid][ref4], aan een tijdelijke diplomatieke zending zijn toegevoegd;

      6°. bij een vertegenwoordiging van het Koninkrijk in het buitenland toegevoegde ambtenaren als bedoeld
      in [artikel 8, vierde lid][ref5], met dien verstande dat met betrekking tot hen het overleg over de in
      [artikel 113, eerste lid, van het ARAR][ref6] bedoelde aangelegenheden alleen wordt gevoerd voor zover die
      aangelegenheden verband houden met hun toevoeging.

      3 Onder «centrales van verenigingen van ambtenaren» en «centrales» in de
      [artikelen 113 tot en met 117 van het ARAR][ref7], wordt mede begrepen de Vereniging Dienst Buitenlandse Zaken.


