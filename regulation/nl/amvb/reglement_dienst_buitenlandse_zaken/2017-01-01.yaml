  - number: '52'
    text: |-
      1 Bij plaatsingen buiten Nederland worden de gezinsleden van de ambtenaar, overeenkomstig
      [artikel 51, eerste lid][ref1], in de gelegenheid gesteld de deskundige persoon of de arbodienst te raadplegen.

      2 Gezinsleden van de ambtenaar worden, zo mogelijk tijdens verblijf hier te lande, in de gelegenheid gesteld het
      onderzoek, bedoeld in [artikel 51, tweede lid][ref2], te ondergaan.

      3 Indien er gegronde redenen zijn om te twijfelen aan de goede gezondheidstoestand van de gezinsleden van de
      ambtenaar, worden deze in de gelegenheid gesteld een gezondheidskundig onderzoek te ondergaan.

      4 De ambtenaar is verplicht zich in te spannen dat diens gezinsleden hun medewerking verlenen aan:

      a. onderzoeken als bedoeld in het derde lid, alsmede in [artikel 51, tweede lid][ref3];

      b. gezondheidskundige onderzoeken welke worden ingesteld ter beantwoording van de vragen:

      1°. in welke mate en tot welk tijdstip sprake is van verhindering wegens ziekte om in een bepaald gebied, een
      bepaald land of bepaalde landen te verblijven;

      2°. of verdere maatregelen of voorzieningen nodig zijn in het belang van het behoud, het herstel of de bevordering
      van hun gezondheid.

      5 De ambtenaar is verplicht zich in te spannen dat zijn gezinsleden de in [artikel 51, vierde lid][ref4], bedoelde
      aanwijzingen opvolgen, met uitzondering van aanwijzingen tot het ondergaan van een ingreep van heelkundige aard.

      6 [Artikel 36, vierde lid][ref5], is van overeenkomstige toepassing.


