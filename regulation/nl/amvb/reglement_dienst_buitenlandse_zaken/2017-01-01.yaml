  - number: 43a
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt buitengewoon verlof met behoud van bezoldiging
      verleend:

      a. voor de uitoefening van kiesrecht;

      b. voor het voldoen aan een wettelijke verplichting, een en ander voor zover dit niet in vrije tijd kan geschieden
      en omzetting van dienst niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel43a
  - number: 43b
    text: |-
      1 Indien de ambtenaar een vaste vergoeding ontvangt uit de functie waarvoor hem het in
      [artikel 125c, tweede lid, van de Ambtenarenwet][ref1] bedoelde verlof wordt verleend, wordt op zijn bezoldiging
      een inhouding toegepast over de tijd dat hij het verlof geniet. Deze inhouding gaat hetgeen hij geacht kan worden
      te ontvangen als vaste vergoeding voor de met het verlof overeenkomende tijd in de bedoelde functie niet te boven.

      2 Door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties krachtens [artikel 33a van het ARAR][ref2]
      gestelde nadere regels zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125c
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel33a
