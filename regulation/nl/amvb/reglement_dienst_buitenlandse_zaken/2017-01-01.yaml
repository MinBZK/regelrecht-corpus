  - number: 41aa
    text: |-
      1 De aanspraak op wettelijke vakantie-uren vervalt na verloop van één jaar na de laatste dag van het kalenderjaar
      waarin de aanspraak is ontstaan.

      2 Indien de ambtenaar redelijkerwijs niet in staat is geweest de wettelijke vakantie-uren binnen de in het eerste
      lid genoemde termijn op te nemen, staat het bevoegd gezag toe dat van het eerste lid wordt afgeweken. In dit geval
      vervalt de aanspraak alsnog na verloop van vijf jaren na de laatste dag van het kalenderjaar waarin de aanspraak
      is ontstaan.

      3 De aanspraak op bovenwettelijke vakantie-uren vervalt na verloop van vijf jaren na de laatste dag van het
      kalenderjaar waarin deze aanspraak is ontstaan.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel41aa
  - number: 41ab
    text: |-
      1 Tenzij het belang van de dienst zich daartegen verzet, kan het bevoegd gezag op aanvraag van de ambtenaar eenmaal
      per kalenderjaar zijn aanspraak op bovenwettelijke vakantie-uren van dat kalenderjaar verlagen.

      2 Een aanvraag als bedoeld in het eerste lid wordt voor 1 november van het lopende kalenderjaar ingediend.

      3 De ambtenaar wordt een vergoeding toegekend voor elk uur waarmee zijn aanspraak op bovenwettelijke vakantie-uren
      overeenkomstig het eerste lid wordt verlaagd, ten bedrage van het salaris per uur dat hij geniet op de eerste dag
      van de maand waarin hij de aanvraag doet.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel41ab
  - number: 41b
    text: |-
      1 Indien de ambtenaar op de datum van zijn ontslag nog aanspraak heeft op vakantie, wordt hem voor ieder uur
      vakantie dat hij niet heeft opgenomen een vergoeding toegekend ten bedrage van het salaris per uur dat de ambtenaar
      direct voorafgaand aan zijn ontslag genoot.

      2 Indien op de dag van zijn ontslag blijkt dat de ambtenaar teveel vakantie heeft genoten, is hij voor ieder uur
      teveel genoten vakantie een bedrag schuldig ten bedrage van het salaris per uur.

      3 Indien de ambtenaar een aanstelling in tijdelijke dienst heeft en hij zonder onderbreking een nieuwe aanstelling
      binnen de rijksdienst krijgt, behoudt de ambtenaar in afwijking van het eerste lid de vakantieaanspraken die niet
      genoten zijn.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel41b
  - number: 41c
    text: |-
      Indien de ambtenaar in het genot is van een toelage als bedoeld in [artikel 17][ref1] of
      [18a van het BBRA 1984][ref2], wordt die toelage gedurende zijn vakantie vastgesteld op het bedrag dat hem
      ingevolge zijn arbeidstijdpatroon zou zijn toegekend, indien hij geen vakantie zou hebben genoten. Indien de
      vaststelling van het bedrag op deze wijze niet mogelijk is, dan wordt dit bedrag vastgesteld op het gemiddelde van
      het bedrag dat de ambtenaar per maand aan die toelage heeft genoten over de drie kalendermaanden voorafgaande aan
      de kalendermaand waarin zijn vakantie een aanvang nam.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel41c
