  - number: 45d
    text: |-
      1 Tenzij een zwaarwegend dienstbelang zich daartegen verzet, wordt aan de ambtenaar verlof met behoud van
      bezoldiging verleend voor de noodzakelijke verzorging in verband met ziekte van:

      a. zijn huwelijkspartner;

      b. een inwonend kind tot wie de ambtenaar als ouder in een familierechtelijke betrekking staat;

      c. een inwonend kind van zijn huwelijkspartner;

      d. een pleegkind dat blijkens de basisregistratie personen op hetzelfde adres woont als de ambtenaar
      en door hem duurzaam wordt verzorgd en opgevoed op basis van een pleegcontract als bedoeld in
      [artikel 22, eerste lid, van de Wet op de jeugdzorg][ref1].

      2 Tenzij een zwaarwegend dienstbelang zich daartegen verzet wordt aan de ambtenaar verlof met behoud van
      bezoldiging verleend voor de noodzakelijke verzorging in verband met ernstige ziekte van: zijn huwelijkspartner,
      ouders, stiefouders, pleegouders, schoonouders, kinderen, stiefkinderen, pleegkinderen of aangehuwde kinderen.

      3 Het verlof, bedoeld in het eerste en tweede lid, bedraagt in elk kalenderjaar ten hoogste tweemaal de arbeidsduur
      per week.

      4 De ambtenaar meldt vooraf dat hij het verlof, bedoeld in het eerste en tweede lid, opneemt onder opgave van de
      reden. Indien dit niet mogelijk is, meldt de ambtenaar het opnemen van het verlof zo spoedig mogelijk onder opgave
      van de reden. Bij die melding geeft de ambtenaar ook de omvang, de wijze van opneming en de vermoedelijke duur van
      het verlof aan.

      5 Achteraf kan van de ambtenaar worden verlangd dat hij aannemelijk maakt dat hij zijn arbeid niet heeft verricht
      in verband met de noodzakelijke verzorging als bedoeld in het eerste en tweede lid.


