  - number: '69'
    text: |-
      1 De ambtenaar is verplicht aan Onze Minister, op een door Onze Minister te bepalen wijze, opgave te doen van de
      nevenwerkzaamheden die hij verricht of voornemens is te gaan verrichten, die de belangen van de dienst voor zover
      deze in verband staan met zijn functievervulling, kunnen raken.

      2 Onze Minister voert een registratie op basis van de op grond van het eerste lid gedane opgaven.

      3 De door de secretaris-generaal en directeuren-generaal gemelde nevenwerkzaamheden worden openbaar gemaakt met
      vermelding van eventueel door Onze Minister aan het verrichten van de nevenwerkzaamheden gestelde beperkingen.

      4 Het is de ambtenaar verboden nevenwerkzaamheden te verrichten waardoor de goede vervulling van zijn functie
      of de goede functionering van de openbare dienst, voor zover deze in verband staat met zijn functievervulling,
      niet in redelijkheid zou zijn verzekerd. Bij ministeriële regeling kunnen nadere regels omtrent dit verbod worden
      gesteld. Van verboden nevenwerkzaamheden als bedoeld in de eerste volzin, is in ieder geval sprake indien een
      consulaire betrekking van een andere mogendheid wordt aanvaard zonder bij koninklijk besluit verleende voorafgaande
      machtiging.

      5 Bij plaatsing buiten Nederland draagt de ambtenaar er zorg voor, indien zijn gezinsleden hem in het buitenland
      vergezellen en zij ter plaatse werkzaamheden verrichten, dat deze werkzaamheden niet strijdig zijn met de wetten
      van dan wel overeenkomsten met dat land en tevens niet schadelijk kunnen zijn voor het functioneren van de
      desbetreffende vertegenwoordiging van het Koninkrijk in het buitenland.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel69
  - number: 69a
    text: |-
      1 Onze Minister wijst de ambtenaren aan die werkzaamheden verrichten waaraan in het bijzonder het risico van
      financiële belangenverstrengeling of het risico van oneigenlijk gebruik van koersgevoelige informatie verbonden is.
      De aangewezen ambtenaar meldt aan een daartoe aangewezen functionaris financiële belangen, alsmede het bezit van en
      transacties met effecten die de belangen van de dienst voor zover deze in verband staan met zijn functievervulling,
      kunnen raken.

      2 Onze Minister voert een registratie van de op grond van het eerste lid gedane meldingen.

      3 De ambtenaar verstrekt nadere informatie of bescheiden met betrekking tot de financiële belangen of het bezit van
      of de transacties met effecten, indien daarvoor naar het oordeel van Onze Minister of de aangewezen functionaris,
      bedoeld in het eerste lid, aanleiding bestaat op grond van de melding of na de melding gebleken feiten of
      omstandigheden.

      4 Het is de ambtenaar verboden financiële belangen te hebben, effecten te bezitten of effectentransacties te
      verrichten waardoor de goede vervulling van zijn functie of het goed functioneren van de openbare dienst, voorzover
      dit in verband staat met zijn functievervulling, niet in redelijkheid zou zijn verzekerd.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de melding, bedoeld in het eerste lid, de
      registratie, bedoeld in het tweede lid, en het verbod, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel69a
  - number: '70'
    text: |-
      1 Het is de ambtenaar verboden, middellijk of onmiddellijk deel te nemen aan aannemingen en leveringen ten behoeve
      van openbare diensten, tenzij daarvoor door het bevoegd gezag toestemming is verleend.

      2 Hij is verplicht zich te gedragen naar hetgeen voor hem is bepaald ten aanzien van het deelnemen, middellijk of
      onmiddellijk, aan aannemingen en leveringen ten behoeve van anderen.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel70
  - number: '71'
    text: |-
      1 De ambtenaar die een besturende, beherende dan wel toezichthoudende functie vervult in een naamloze vennootschap
      of ander rechtspersoonlijkheid bezittend lichaam, en voor de in die functie verrichte of te verrichten
      werkzaamheden, anders dan uit 's Rijks kas, een vergoeding ontvangt, is verplicht die vergoeding in genoemde kas te
      storten, indien de benoeming in die functie

      a. heeft plaatsgehad door dan wel in overeenstemming met Onze Minister;

      b. is voortgevloeid uit een wettelijk voorschrift dan wel uit een overeenkomst welke met instemming van Onze
      Minister of de ministerraad is tot stand gekomen.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van de ambtenaar die werkzaamheden vervult die
      verband houden met de door hem vervulde functie en hem zijn opgedragen door Onze Minister, en die voor die
      werkzaamheden, anders dan uit 's Rijks kas, een vergoeding ontvangt.

      3 Het eerste en tweede lid vinden geen toepassing in de gevallen, waarin dit door Onze Minister-President is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel71
  - number: '72'
    text: |-
      1 Het is de ambtenaar in zijn ambt verboden, tenzij hem daarvoor door het bevoegd gezag toestemming is verleend,
      vergoedingen, beloningen, giften of beloften van derden te vorderen, te verzoeken of aan te nemen.

      2 Het aannemen van steekpenningen is onvoorwaardelijk en ten strengste verboden.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel72
  - number: '73'
    text: |-
      1 De ambtenaar is verplicht de dienstkleding en de onderscheidingstekenen te dragen, voor zover dit door Onze
      Minister voorgeschreven is.

      2 Het is de ambtenaar verboden in dienst uniformkledingstukken te dragen, tenzij deze door Onze Minister zijn
      verstrekt of voorgeschreven.

      3 Het is de ambtenaar verboden bij gekleed gaan in uniform insignes of andere onderscheidingstekens te dragen,
      tenzij deze van regeringswege zijn verstrekt of voorgeschreven of tot het dragen daarvan door Onze Minister-
      President vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel73
  - number: '74'
    text: |-
      1 De ambtenaar kan worden verplicht tot gehele of gedeeltelijke vergoeding van de door de dienst geleden schade,
      wanneer hem ter zake van die schade een ernstig verwijt kan worden gemaakt.

      2 Het bedrag van de schadevergoeding wordt pas vastgesteld, nadat de ambtenaar in de gelegenheid is gesteld zich
      schriftelijk of mondeling te verantwoorden.
