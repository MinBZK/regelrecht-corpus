  - number: 45c
    text: |-
      1 De ambtenaar heeft in verband met de adoptie van een kind aanspraak op verlof met behoud van bezoldiging.

      2 a. De aanspraak op verlof in verband met adoptie van een kind bedraagt ten hoogste vier aaneengesloten weken. De
      aanspraak bestaat gedurende een tijdvak van achttien weken te rekenen vanaf twee weken vóór de eerste dag dat de
      feitelijke opneming ter adoptie een aanvang heeft genomen of zal nemen zoals die dag is aangeduid in een door de
      ambtenaar overgelegd document waaruit blijkt dat een kind ter adoptie is of zal worden opgenomen.

      b. Ingeval redenen van zwaarwegend dienstbelang daartoe noodzaken, kan besloten worden dat het adoptieverlof
      gedurende plaatsing bij een vertegenwoordiging van het Koninkrijk in het buitenland op een andere wijze wordt
      genoten dan vermeld onder a.

      3 Indien als gevolg van een adoptieverzoek tegelijkertijd twee of meer kinderen feitelijk ter adoptie worden
      opgenomen, bestaat de aanspraak op verlof slechts ten aanzien van een van die kinderen.

      4 De ambtenaar meldt het verlof in verband met adoptie uiterlijk drie weken voor de dag van ingang van het verlof
      onder opgave van de omvang van het verlof. Bij de melding worden documenten gevoegd waaruit blijkt dat een kind ter
      adoptie is of zal worden opgenomen.

      5 Indien de ambtenaar aan wie verlof is verleend gedurende dat verlof of gedurende een bepaalde periode van dat
      verlof tevens recht heeft op een financiële tegemoetkoming op basis van de [Wet arbeid en zorg][ref1], wordt
      gedurende de periode waarin sprake is van samenloop een inhouding op de doorbetaling van bezoldiging als bedoeld in
      het eerste lid toegepast welke overeenkomt met het bedrag van bedoelde financiële tegemoetkoming.

      6 Indien aan gestelde voorwaarden voor het toekennen van een financiële tegemoetkoming als bedoeld in het vijfde
      lid is voldaan, maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen aanvraag heeft ingediend,
      wordt het vijfde lid op overeenkomstige wijze toegepast. In dat geval wordt rekening gehouden met de financiële
      tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een aanvraag zou hebben ingediend.

      7 Dit artikel is van overeenkomstige toepassing op de ambtenaar die een pleegkind opneemt als bedoeld in
      [artikel 5:1, tweede lid, onderdeel d, van de Wet arbeid en zorg][ref2].


