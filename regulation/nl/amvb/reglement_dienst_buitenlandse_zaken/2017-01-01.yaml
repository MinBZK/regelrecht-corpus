  - number: 24a
    text: |-
      Voor zover deze gegevens op hem betrekking hebben en niet reeds in de akte van aanstelling zijn vermeld, worden aan
      de ambtenaar zo spoedig mogelijk schriftelijk medegedeeld:

      a. het dienstonderdeel waarbij en de functie waarin hij wordt geplaatst, de periode gedurende welke hij in die
      functie wordt geplaatst alsmede de hem aangewezen standplaats;

      b. de salarisschaal en de voor de bepaling van die schaal in acht genomen regels;

      c. het salaris dat hem is toegekend, alsmede het salarisnummer en het tijdstip waarop het salaris voor de eerste
      maal periodiek zal kunnen worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel24a
  - number: 24b
    text: |-
      1 De ambtenaar wordt bij zijn aanstelling schriftelijk op de hoogte gesteld van de hoofdlijnen van zijn
      rechtspositie.

      2 Regelingen waarin zijn rechtspositie is neergelegd, worden op een voor de ambtenaar gemakkelijk toegankelijke
      plaats ter inzage gelegd. Van deze regelingen kan hij kosteloos afschriften maken voor zover dat redelijkerwijs
      nodig is.

      3 De schriftelijk vastgestelde en voor hem geldende regelingen en instructies, welke hij bij de vervulling van
      zijn dienst heeft na te leven, worden eveneens op een voor de ambtenaar gemakkelijk toegankelijke plaats ter inzage
      gelegd. Ingeval de vermelde regelingen en instructies niet schriftelijk zijn vastgelegd, worden deze behoorlijk te
      zijner kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel24b
  - number: '25'
    text: |-
      1 De ambtenaar die is aangesteld in vaste dienst dan wel in tijdelijke dienst voor een proeftijd, wordt in de
      gelegenheid gesteld zijn mobiliteit te bevorderen, onder meer door scholing.

      2 De in het eerste lid bedoelde ambtenaar draagt, onder meer door scholing, zorg voor de bevordering van zijn
      mobiliteit, voor zover dat redelijkerwijs van hem kan worden gevergd.

      3 Bij ministeriële regeling of bij beleidsregel van Onze Minister worden regels gesteld betreffende de bevordering
      van de mobiliteit.

      4 In dit artikel wordt onder bevordering van mobiliteit verstaan de vergroting van de geschiktheid van de ambtenaar
      voor de vervulling van een andere functie dan die waarin hij is of was geplaatst.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel25
  - number: 25a
    text: |-
      1 De ambtenaar die ten minste drie jaar een functie dan wel vergelijkbare of uitwisselbare functies vervult, heeft
      de mogelijkheid om, op kosten van het bevoegd gezag, eenmaal per vijf jaar een vertrouwelijke loopbaanscan te doen,
      met behulp van een professionele loopbaandeskundige.

      2 De ambtenaar kan de uitkomsten van de loopbaanscan inbrengen in het gesprek, bedoeld in [artikel 78][ref1],
      ter ondersteuning van het maken van afspraken over de wijze waarop de persoonlijke ontwikkeling van de ambtenaar
      bevorderd kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel78
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel25a
