  - number: '116'
    text: |-
      De werknemer verbindt zich:

      a. de opgedragen werkzaamheden naar beste vermogen te verrichten;

      b. indien [artikel 114, eerste lid][ref1], van toepassing is: zich te gedragen naar de voorschriften en
      aanwijzingen welke hem, met inachtneming van de verantwoordelijkheden van Onze Minister voor Buitenlandse
      Handel en Ontwikkelingssamenwerking alsmede van Onze Minister van Economische Zaken ingevolge het
      [vierde en vijfde lid van artikel 12][ref2], door of namens Onze Minister, dan wel door of namens het hoofd van de
      vertegenwoordiging van het Koninkrijk in het buitenland waarbij de werknemer diens werkzaamheden verricht, worden
      gegeven;

      c. indien [artikel 115][ref3], van toepassing is: zich te gedragen naar de voorschriften en
      aanwijzingen welke hem door of namens zijn werkgever worden gegeven, onverminderd het gestelde in
      [artikel 12, eerste en tweede lid][ref4];

      d. tot het afleggen van de eed of belofte, indien hij deze ingevolge [artikel 117, derde lid][ref5], dient af te
      leggen.


