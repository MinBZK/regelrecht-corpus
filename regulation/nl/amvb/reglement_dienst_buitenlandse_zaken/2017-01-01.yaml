  - number: '24'
    text: |-
      1 Aan de ambtenaar wordt, zo mogelijk voordat zijn aanstelling een aanvang neemt, een akte van aanstelling
      uitgereikt, waarin in ieder geval worden vermeld:

      a. de naam, de voornamen en de geboortedatum van de ambtenaar;

      b. de naam van het ministerie en het dienstonderdeel waarbij hij werkzaam zal zijn;

      c. de datum, met ingang waarvan hij wordt aangesteld;

      d. of de aanstelling geschiedt in vaste of tijdelijke dienst, en

      e. of de aanstelling geschiedt met het oogmerk van wisselende functievervulling op het departement en bij
      vertegenwoordigingen van het Koninkrijk in het buitenland, dan wel met het oogmerk van wisselende functievervulling
      op het departement.

      2 Indien de aanstelling geschiedt in tijdelijke dienst, wordt bovendien in de akte van aanstelling vermeld:

      a. de duur van de aanstelling in tijdelijke dienst;

      b. de toepasselijke, in [artikel 19, tweede lid][ref1], omschreven grond(en) voor de aanstelling in tijdelijke
      dienst, en

      c. de specifieke reden, indien sprake is van een aanstelling op grond van [artikel 19, tweede lid, onder f][ref2].

      3 Indien de aanstelling geschiedt in tijdelijke dienst met toepassing van [artikel 20, eerste lid][ref3],
      wordt bovendien in de akte van aanstelling vermeld welke van de in dat artikellid bedoelde regelingen geheel of
      gedeeltelijk buiten toepassing zijn verklaard.

      4 Indien de aanstelling geschiedt voor een variabel aantal uren wordt in de akte van aanstelling in voorkomende
      gevallen bovendien het op grond van [artikel 21, tweede lid][ref4], voor de ambtenaar geldende aantal garantie-
      uren vermeld.

      5 In geval van indiensttreding van een ambtenaar in vaste dienst in algemene dienst van het rijk als bedoeld in
      [artikel 17, vijfde lid][ref5], zijn het eerste, tweede en vierde lid van overeenkomstige toepassing.


