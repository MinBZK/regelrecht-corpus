    text: |-
      1 De bezoldiging van de ambtenaar wordt uitbetaald tot en met de dag van overlijden.

      2 Indien de ambtenaar bij zijn overlijden een positief of negatief vakantiesaldo heeft, vinden
      [artikel 41b, eerste en tweede lid][ref1], overeenkomstige toepassing. Het aldus openstaande bedrag en de reeds
      voor zijn overlijden aan de ambtenaar uitbetaalde bezoldiging over een na zijn overlijden gelegen tijdvak worden
      verrekend met het eventueel aan de nagelaten betrekkingen of rechtverkrijgenden van de ambtenaar verschuldigde
      bedrag wegens nog niet vergolden aanspraken van de ambtenaar, en bij gebreke hiervan of indien dit bedrag daarvoor
      niet toereikend is, op de uitkering, bedoeld in het derde lid.

      3 Aan de nabestaande, van wie de overleden ambtenaar niet duurzaam gescheiden leefde, wordt een bedrag uitgekeerd
      gelijk aan de bezoldiging over drie maanden, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering over
      die maanden. Indien de ambtenaar op de dag direct voorafgaand aan zijn overlijden aanspraak maakte op een uitkering
      op grond van de [ZW][ref2], [Werkloosheidswet][ref3] of de [WIA][ref4], wordt als maatstaf voor de bezoldiging
      uitgegaan van de bezoldiging die hij zou hebben genoten als hij op die dag arbeidsgeschikt zou zijn geweest.

      4 Indien de ambtenaar in het genot was van een toelage als bedoeld in de artikelen 17, 17a, 18 en 18a en 18b, van
      het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984, wordt de in het derde lid bedoelde bezoldiging in zoverre
      gesteld op het gemiddelde van het bedrag dat de overleden ambtenaar is toegekend of zou zijn toegekend in de drie
      kalendermaanden voorafgaande aan de dag van overlijden, of het intreden van de arbeidsongeschiktheid.

      5 Op het bedrag, bedoeld in het derde lid, wordt in mindering gebracht een uitkering op grond van
      [artikel 35 van de ZW][ref5], [artikel 74 van de WIA][ref6], of een overlijdensuitkering die is verleend door de
      Stichting Pensioenfonds ABP indien recht bestaat op arbeidsongeschiktheidspensioen of andere naar aard en strekking
      hiermee overeenkomende uitkeringen die voortvloeien uit dezelfde dienstbetrekking.

      6 Bij ontstentenis van een nabestaande, van wie de overledene niet duurzaam gescheiden leefde, geschiedt de
      uitkering, bedoeld in het derde lid, ten behoeve van de minderjarige kinderen. Onder kinderen in de zin van dit
      artikel worden mede verstaan natuurlijke kinderen en kinderen waarover de overledene de pleegouderlijke zorg droeg.
      Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding van het kind als was het een
      eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding daarvoor. Ontbreken
      ook zodanige kinderen dan geschiedt de uitkering aan degenen die geheel of grotendeels afhankelijk waren van de
      bezoldiging van de ambtenaar.

      7 Indien de ambtenaar geen betrekkingen als bedoeld in het derde en zesde lid, nalaat, kan de daar bedoelde
      uitkering door het bevoegd gezag geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste
      ziekte en van de lijkbezorging indien de nalatenschap van de overledene hiertoe ontoereikend is.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0004045
