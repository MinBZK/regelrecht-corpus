  - number: 149e
    text: |-
      Met uitzondering van de in [artikel 22, tweede lid][ref1], genoemde ambtenaren, wordt de ambtenaar die voorafgaand
      aan 1 maart 2007 op grond van dit besluit bij Koninklijk Besluit is aangesteld, aangemerkt als te zijn aangesteld
      op grond van [artikel 22, eerste lid][ref2].


