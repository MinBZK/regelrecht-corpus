  - number: '34'
    text: |-
      1 Op de ambtenaar is het [BBRA 1984][ref1] van overeenkomstige toepassing, met inachtneming van het tweede tot en
      met achtste lid.

      2 Gedurende plaatsing buiten Nederland zijn de [artikelen 17][ref2], [17a][ref3], [17b][ref4] en
      [18a van het BBRA 1984][ref5] niet van overeenkomstige toepassing.

      3 In afwijking van [artikel 22c van het BBRA 1984][ref6] wordt een eenmalige mobiliteitstoeslag toegekend op grond
      van bij ministeriële regeling gestelde regels, zoveel mogelijk overeenkomstig genoemd artikel.

      4 Een vergoeding voor overwerk, verricht tijdens plaatsing bij een vertegenwoordiging van het Koninkrijk in het
      buitenland, wordt in afwijking van [artikel 23 van het BBRA 1984][ref7] toegekend op grond van bij ministeriële
      regeling gestelde regels. Deze regels houden rekening met de bijzondere omstandigheden van het werkzaam zijn bij
      een vertegenwoordiging van het Koninkrijk in het buitenland.

      5 Ingeval een plaatsing als bedoeld in [artikel 27][ref8] of [29][ref9] geschiedt in een functie waaraan een lagere
      salarisschaal is verbonden dan de salarisschaal die voor de betrokken ambtenaar geldt, behoudt de ambtenaar, in
      afwijking van [artikel 5, vijfde lid, onderdeel d, van het BBRA 1984][ref10], de voor hem geldende salarisschaal.
      Indien evenwel sprake is van de in [artikel 35, vierde lid][ref11], bedoelde omstandigheid, kan aan betrokkene een
      lagere salarisschaal worden toegekend.

      6 Met inachtneming van [artikel 3, tweede lid][ref12], kan aan functies bij een vertegenwoordiging van het
      Koninkrijk in het buitenland het salaris worden verbonden, behorend bij de functie van directeur-generaal, genoemd
      in [bijlage A van het BBRA 1984][ref13].

      7 Aan de ambtenaar die is geplaatst in een functie waaraan met toepassing van het zesde lid het salaris is
      verbonden behorende bij de functie van directeur-generaal, genoemd in [bijlage A van het BBRA 1984][ref14], waarvan
      de zwaarte en het belang voor de bevordering van de internationale rechtsorde en de buitenlandse betrekkingen van
      het Koninkrijk zodanig groot zijn dat de functie zwaarder is dan de functie van directeur-generaal, wordt voor
      de duur van de plaatsing in die functie een maandelijkse toeslag toegekend ter grootte van 7,5% van het salaris
      behorende bij de functie van directeur-generaal. Deze toeslag maakt deel uit van de bezoldiging.

      8 Bij ministeriële regeling kan worden bepaald in welke andere gevallen dan bedoeld in het tweede tot en met
      zevende lid kan worden afgeweken van het [BBRA 1984][ref15].


