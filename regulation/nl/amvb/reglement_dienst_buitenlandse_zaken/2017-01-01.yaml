  - number: '14'
    text: |-
      1 De bepalingen van dit reglement vinden slechts toepassing, voor zover niet bij of krachtens een wet anders is of
      wordt bepaald.

      2 Bepalingen van dit reglement zijn niet toepasselijk op degenen die in het [tweede lid van artikel 5][ref1] en
      het [derde, vierde en zesde lid van artikel 8][ref2] zijn genoemd ten aanzien van wie een algemene maatregel van
      bestuur of een uit kracht daarvan gegeven voorschrift om bijzondere redenen hun toepasselijkheid uitsluit.


