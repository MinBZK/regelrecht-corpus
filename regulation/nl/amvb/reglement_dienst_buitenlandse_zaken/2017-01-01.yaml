  - number: '67'
    text: |-
      1 De ambtenaar kan in het belang van de rijksdienst worden verplicht om scholing te volgen, voor zover dat
      redelijkerwijs van hem kan worden verlangd. Bij het opleggen van de verplichting tot het volgen van scholing worden
      studiefaciliteiten toegekend.

      2 De ambtenaar die is aangewezen als herplaatsingskandidaat als bedoeld in de [artikelen 58c][ref1] en [58d][ref2],
      die een studie volgt of gaat volgen die aantoonbaar bijdraagt aan het realiseren van vastgelegde loopbaanafspraken
      dan wel het kunnen plaatsen in een andere functie worden studiefaciliteiten toegekend.

      3 De in het eerste en tweede lid bedoelde faciliteiten zijn:

      a. een volledige vergoeding van de met de studie gemoeide scholingskosten;

      b. 100% verlof met behoud van bezoldiging voor de tijd die is gemoeid met:

      1° het volgen van lessen en stages die een onlosmakelijk onderdeel uitmaken van de opleiding;

      2° contacturen die een onlosmakelijk onderdeel uitmaken van de opleiding;

      3° zelfstudie van maximaal een dag per week, en

      4° het afleggen van examens.

      4 Aan de ambtenaar, niet zijnde de ambtenaar, bedoeld in het eerste of tweede lid, die een studie volgt of
      gaat volgen die naar het oordeel van het bevoegd gezag aantoonbaar bijdraagt aan het realiseren van vastgelegde
      loopbaanafspraken worden de volgende studiefaciliteiten toegekend:

      a. een volledige vergoeding van de met de studie gemoeide scholingskosten;

      b. 50% verlof met behoud van bezoldiging voor de tijd die is gemoeid met:

      1° het volgen van lessen en stages die een onlosmakelijk onderdeel uitmaken van de opleiding;

      2° contacturen die een onlosmakelijk onderdeel uitmaken van de opleiding;

      3° zelfstudie van maximaal een dag per week, en

      4° het afleggen van examens.

      5 Aan de niet in het eerste tot en met vierde lid bedoelde ambtenaar die een studie volgt of gaat volgen, kan het
      bevoegd gezag de volgende studiefaciliteiten toekennen:

      a. een vergoeding van de met de studie gemoeide scholingskosten tot ten hoogste 50% van deze scholingskosten;

      b. ten hoogste 25% verlof met behoud van bezoldiging voor de tijd die is gemoeid met het volgen van lessen en
      stages die een onlosmakelijk onderdeel uitmaken van de opleiding, en het afleggen van examens.

      6 De ambtenaar kan worden verplicht tot terugbetaling van de aan hem toegekende vergoeding van de scholingskosten:

      a. bij onvoldoende resultaat in de scholing en bij tussentijds afbreken van de scholing, indien dit aan eigen
      schuld of toedoen van de ambtenaar is te wijten;

      b. bij ontslag tijdens het volgen van de scholing en in bijzondere gevallen bij ontslag binnen een termijn van ten
      hoogste drie jaren na het met voldoende resultaat afronden van de scholing, tenzij de ambtenaar binnen een maand
      na zijn ontslag elders in dienst treedt binnen de rijksdienst of aansluitend aan zijn ontslag recht heeft op een
      uitkering op grond van werkloosheid, arbeidsongeschiktheid of ouderdomspensioen.

      7 De verplichting tot terugbetaling wordt niet opgelegd aan de ambtenaar die binnen de in [artikel 58f][ref3]
      bedoelde termijn nadat hij is aangewezen als herplaatsingskandidaat als bedoeld in de [artikelen 58c][ref4]
      en [58d][ref5], op zijn aanvraag eervol ontslag wordt verleend wegens de aanvaarding van een functie buiten de
      rijksdienst.

      8 Onze Minister kan toestaan dat het verlof voor zelfstudie, bedoeld in het derde lid, onderdeel b, onder 3°, en
      vierde lid, onderdeel b, onder 3°, geldt voor meer dan maximaal een dag per week.

      9 Op reizen en verblijf en de vergoeding van de daaruit voortvloeiende kosten, die de ambtenaar in het kader
      van scholing als bedoeld in het eerste, tweede of vierde lid maakt, is het bepaalde bij of krachtens het
      [Reisbesluit binnenland][ref6] of het [Reisbesluit buitenland][ref7] van overeenkomstige toepassing, met dien
      verstande dat:

      a. in afwijking van [artikel 6, tweede lid, van het Reisbesluit binnenland][ref8] de vergoeding van kosten, voor
      zover binnen Nederland met de trein wordt gereisd, gelijk is aan de gemaakte kosten op basis van het tarief van de
      tweede klasse, en;

      b. Onze Minister, voor zover het reizen betreft waarvan het beginpunt of het eindpunt buiten Nederland ligt, kan
      afwijken van het krachtens [artikel 6, vierde lid, van het Reisbesluit][ref9] buitenland bepaalde.

      10 In deze bepaling wordt onder scholingskosten verstaan de kosten voor de door de onderwijsinstelling verplicht
      gestelde onderwijsmiddelen, les- en examengelden en verplicht gestelde excursies of studiereizen.


