        artikel: 46a
        hoofdstuk: IX
        paragraaf: '2'
  - number: '98'
    text: |-
      1 Aan de ambtenaar die is aangesteld in tijdelijke dienst wordt geacht eervol ontslag te zijn verleend zodra de
      duur van de aanstelling in tijdelijke dienst is verstreken, tenzij sprake is van een stilzwijgende voortzetting als
      bedoeld in [artikel 19, vierde of vijfde lid][ref1].

      2 Aan de ambtenaar die is aangesteld in tijdelijke dienst kan ontslag worden verleend, mits een opzeggingstermijn
      in acht wordt genomen van:

      a. drie maanden, indien de ambtenaar ten tijde van de opzegging laatstelijk ten minste twaalf maanden onafgebroken
      in dienst is geweest;

      b. twee maanden, indien de ambtenaar ten tijde van de opzegging laatstelijk ten minste zes maanden maar korter dan
      twaalf maanden onafgebroken in dienst is geweest;

      c. een maand, indien de ambtenaar ten tijde van de opzegging laatstelijk korter dan zes maanden onafgebroken in
      dienst is geweest.

      3 Opzegging als bedoeld in het tweede lid kan niet geschieden gedurende de zwangerschap van de vrouwelijke
      ambtenaar, noch gedurende het verlof bedoeld in [artikel 45a, vierde lid][ref2], noch, indien zij haar dienst
      heeft hervat, gedurende een periode van zes weken volgend op dat verlof. Ter staving van de zwangerschap kan een
      verklaring van een arts of van een verloskundige worden verlangd.

      4 Opzegging als bedoeld in het tweede lid kan niet geschieden wegens het aanvragen of het opnemen van
      ouderschapsverlof.

      5 Opzegging als bedoeld in het tweede lid kan niet geschieden wegens de omstandigheid dat de ambtenaar in of buiten
      rechte een beroep heeft gedaan op het beginsel van gelijke behandeling van mannen en vrouwen.

      6 Opzegging als bedoeld in het tweede lid kan niet plaatsvinden wegens het feit dat de ambtenaar door een centrale
      als bedoeld in [artikel 142, derde lid][ref3], of door een daarbij aangesloten vereniging is aangewezen om
      bestuurlijke of vertegenwoordigende activiteiten te ontplooien binnen zijn centrale of een daarbij aangesloten
      vereniging dan wel binnen de organisatie van de werkgever, die ertoe strekken de doelstellingen van zijn centrale
      van overheidspersoneel en daarbij aangesloten verenigingen te ondersteunen.

      7 Opzegging als bedoeld in het tweede lid kan niet geschieden wegens de omstandigheid dat de ambtenaar is geplaatst
      op een kandidatenlijst als bedoeld in [artikel 9 van de Wet op de ondernemingsraden][ref4], noch wegens het
      lidmaatschap of het korter dan twee jaren geleden beëindigde lidmaatschap van de ambtenaar van de ondernemingsraad
      of van een commissie van die raad.

      8 Het ontslag kan, al dan niet op aanvraag van de ambtenaar, ingaan voor de afloop van de opzeggingstermijn.
      Indien dit niet op aanvraag van de ambtenaar geschiedt, wordt hem over de tijd, welke aan de opzeggingstermijn
      ontbreekt, een bedrag uitbetaald gelijk aan de laatstgenoten bezoldiging, vermeerderd met de vakantie-uitkering en
      de eindejaarsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel19
