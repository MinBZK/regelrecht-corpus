        bwb_id: BWBR0004052
        artikel: '121'
        hoofdstuk: XVIII
        paragraaf: '2'
  - number: '124'
    text: |-
      Het bepaalde in of krachtens de [artikelen 121][ref1] en [122][ref2] is slechts van toepassing respectievelijk
      van overeenkomstige toepassing voor zover dat niet strijdig is met dwingende bepalingen van lokaal geldend
      arbeidsrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel122
