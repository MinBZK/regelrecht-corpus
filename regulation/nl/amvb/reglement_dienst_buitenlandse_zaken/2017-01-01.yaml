  - number: 42a
    text: |-
      1 Indien de rijksdienst in Nederland op een daartoe aangewezen kerkelijke of niet-kerkelijke, landelijk, regionaal
      of plaatselijk erkende feest- of gedenkdag is gesloten, geniet de ambtenaar verlof voor zover het dienstbelang niet
      anders vereist.

      2 Het eerste lid vindt geen toepassing, indien de sluiting van de rijksdienst regionaal of plaatselijk plaatsvindt
      en de ambtenaar elders werkzaam is.

      3 Bij ministeriële regeling kunnen met betrekking tot het eerste en tweede lid nadere en zonodig afwijkende regels
      worden vastgesteld voor degenen die buiten Nederland zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel42a
  - number: '43'
    text: |-
      1 Onverminderd het bepaalde in [artikel 82][ref1] wordt aan de ambtenaar in de gevallen en onder de voorwaarden,
      genoemd in de [artikelen 43a tot en met 48][ref2], buitengewoon verlof verleend.

      2 Onder zeer persoonlijke omstandigheden als bedoeld in [artikel 4:1 van de Wet arbeid en zorg][ref3] worden in
      ieder geval begrepen de omstandigheden, genoemd in de [artikelen 43d][ref4], [43e][ref5] en [45][ref6].


