  - number: '146'
    text: |-
      1 Onze Minister geeft aanwijzingen omtrent de wijze waarop het bezwaarschrift wordt geadresseerd.

      2 Het horen door de Commissie van Bezwaar is niet openbaar.

      3 De indiener van het bezwaarschrift die in het buitenland is geplaatst of gevestigd, ontvangt overeenkomstig
      de regelen inzake dienstreizen een vergoeding van reis- en verblijfkosten, indien de Commissie van Bezwaar het
      voor haar onderzoek noodzakelijk acht dat betrokkene in persoon wordt gehoord. De Commissie bericht betrokkene zo
      spoedig mogelijk, of zij het voor haar onderzoek al dan niet noodzakelijk acht betrokkene al dan niet in persoon
      te horen.

      4 Degenen die in het [tweede lid van artikel 5][ref1] zijn genoemd zijn verplicht aan een oproep van de Commissie
      van Bezwaar gehoor te geven en desgevraagd alle inlichtingen en ter zake dienende bescheiden zonder voorbehoud
      te verstrekken. Degene die bezwaar heeft gemaakt en dienst bloed- en aanverwanten tot de tweede graad kunnen zich
      echter van het geven van inlichtingen en het verstrekken van bescheiden onthouden.

      5 De Commissie van Bezwaar kan zich door deskundigen schriftelijk van advies en verslag doen dienen. Getuigen en
      deskundigen die ambtshalve zijn opgeroepen of met een opdracht zijn belast, ontvangen een vergoeding overeenkomstig
      de [Wet tarieven in strafzaken][ref2].

      6 Worden aan de Commissie van Bezwaar schriftelijk inlichtingen voorgelegd omtrent degene die het bezwaar heeft
      ingediend, dan mogen die niet ten nadele van betrokkene gelden, tenzij deze vóór de melding aan de Commissie door
      betrokkene voor gezien zijn getekend, of blijkens een daarop gestelde verklaring, ondertekend door twee ambtenaren,
      aan betrokkene zijn voorgelezen.

      7 De Commissie van Bezwaar stelt haar advies in raadkamer vast bij volstrekte meerderheid van stemmen, waarbij geen
      der leden zich van deelneming aan enige stemming onthoudt.

      8 De Commissie van Bezwaar adviseert Onze Minister, onderscheidenlijk Onze Minister, hoofd van het betrokken
      ministerie, behoudens in het geval voorzien in [artikel 147][ref3] binnen acht weken na ontvangst van het
      bezwaarschrift. Indien toepassing is gegeven aan [artikel 7:10, derde lid, van de Algemene wet bestuursrecht][ref4]
      brengt de Commissie binnen twaalf weken na ontvangst van het bezwaarschrift haar advies uit. Indien sprake is
      van verder uitstel als bedoeld in [artikel 7:10, vierde lid, van de Algemene wet bestuursrecht][ref5] brengt de
      Commissie binnen drie weken na sluiting van haar onderzoek haar advies uit. Vanwege de voorzitter wordt in het
      geval bedoeld in de vorige volzin aan de indiener van het bezwaarschrift kennis gegeven van het tijdstip waarop de
      Commissie haar onderzoek heeft afgesloten. Na het uitbrengen van het advies verleent de Commissie de indiener van
      het bezwaarschrift terstond afschrift van dit advies. Het advies wordt niet openbaar gemaakt.

      9 De Commissie van Bezwaar kan Onze Minister, onderscheidenlijk Onze Minister, hoofd van het betrokken ministerie,
      daarbij adviseren de betrokkene bedoeld in het derde lid die in persoon werd gehoord, hoewel de Commissie het
      horen in persoon voor haar onderzoek niet nodig oordeelde, alsnog een vergoeding van reis- en verblijfkosten
      overeenkomstig de regelen inzake dienstreizen toe te kennen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel5
