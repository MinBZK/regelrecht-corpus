  - number: '59'
    text: |-
      1 De ambtenaar is gehouden de plichten uit zijn functie voortvloeiende nauwgezet en ijverig te vervullen en zich te
      gedragen, zoals een goed ambtenaar betaamt.

      2 De ambtenaar is zich er bij voortduring van bewust deel uit te maken van een vertegenwoordiging van het
      Koninkrijk in het buitenland, zolang hij daarbij is geplaatst.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel59
  - number: '60'
    text: |-
      1 De ambtenaar is verplicht een eed of een belofte af te leggen.

      2 De ambtenaar legt zo spoedig mogelijk na diens indiensttreding in handen van Onze Minister of van een door deze
      aangewezen ambtenaar de navolgende eed of belofte af:

      «Ik zweer/beloof trouw aan de Koning, aan de Grondwet en aan de overige wetten van het Rijk. Ik zweer/verklaar dat
      ik tot het verkrijgen van mijn aanstelling aan niemand iets heb gegeven of beloofd, noch zal geven of beloven.

      Ik zweer/beloof dat ik om iets te doen of te laten in mijn functie van niemand enige belofte of geschenk aannemen
      zal.

      Ik zweer/beloof dat ik mijn werkzaamheden als ambtenaar steeds zal verrichten overeenkomstig de mij gegeven
      voorschriften en aanwijzingen, en dat ik de belangen van het Koninkrijk zal voorstaan en bevorderen.

      Ik zweer/beloof dat ik de zaken waarvan ik als ambtenaar kennis draag en waarvan ik het geheim of vertrouwelijk
      karakter moet begrijpen niet zal openbaren aan anderen dan aan hen aan wie ik volgens de wet of uit hoofde van mijn
      werkzaamheden tot mededeling verplicht ben.

      Zo waarlijk helpe mij God Almachtig!

      (Dat verklaar en beloof ik).»

      3 Alvorens voor de eerste maal een functie als hoofd van een vaste diplomatieke zending dan wel van een permanente
      vertegenwoordiging van het Koninkrijk bij een internationale organisatie te aanvaarden, hernieuwt de betrokkene
      de in het tweede lid genoemde eed of belofte in handen van de Koning. In dat geval wordt het woord «aanstelling»
      vervangen door «benoeming als hoofd van een vaste diplomatieke zending» respectievelijk «benoeming als hoofd
      van een permanente vertegenwoordiging van het Koninkrijk bij een internationale organisatie» en wordt het woord
      «ambtenaar» vervangen door «hoofd van een vaste diplomatieke zending» respectievelijk« hoofd van een permanente
      vertegenwoordiging van het Koninkrijk bij een internationale organisatie». In geval van verhindering van de Koning
      wordt de hernieuwde eed of belofte afgelegd in handen van Onze Minister. Bestaat ook daartoe geen gelegenheid, dan
      wordt de hernieuwde eed of belofte schriftelijk afgelegd.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel60
  - number: '61'
    text: |-
      Ter zake van niet-naleving van bepalingen welke redelijkerwijs niet kunnen worden geacht de ambtenaar bekend te
      zijn, worden hem geen voordelen onthouden of nadelen toegebracht.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel61
  - number: '62'
    text: |-
      Indien de ambtenaar verhinderd is zijn dienst te verrichten, is hij verplicht daarvan, onder opgave van redenen, zo
      tijdig mogelijk mededeling te doen, ten einde vertraging of hinder in de dienst zoveel mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel62
  - number: '63'
    text: |-
      1 De ambtenaar kan worden verplicht te gaan wonen of te blijven wonen in of nabij de gemeente, die hem als
      standplaats is aangewezen of waartoe zijn standplaats behoort, indien dit noodzakelijk is in verband met de goede
      vervulling van zijn functie.

      2 De ambtenaar aan wie de verplichting is opgelegd in of nabij de in het eerste lid bedoelde gemeente te gaan
      wonen, is gehouden zo spoedig mogelijk, maar uiterlijk twee jaar nadat die verplichting is opgelegd, daaraan gevolg
      te geven.

      3 De ambtenaar die bij een vertegenwoordiging van het Koninkrijk in het buitenland is geplaatst, is verplicht
      voor de duur van zijn plaatsing te wonen in of nabij de plaats van vestiging van die vertegenwoordiging. Bij
      ministeriële regeling kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel63
  - number: '64'
    text: |-
      1 De ambtenaar is verplicht, indien hem een dienstwoning ter bewoning is aangewezen, deze te betrekken en zich ter
      zake van de bewoning en het gebruik te gedragen naar de voorschriften, die daaromtrent zijn gesteld.

      2 Hij draagt de onderhoudskosten, welke volgens de wet en het plaatselijk gebruik gewoonlijk voor rekening van de
      huurder zijn, tenzij bij ministeriële regeling anders is bepaald.

      3 Voor de buiten Nederland geplaatste ambtenaar:

      a. is het eerste lid van overeenkomstig toepassing met betrekking tot de inrichting indien de ter bewoning
      aangewezen woning geheel of ten dele van Rijkswege is ingericht;

      b. wordt in plaats van «de wet en het plaatselijk gebruik», genoemd in het tweede lid, gelezen: de Nederlandse
      wetten en gebruiken.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld betreffende de aanwijzing, de bewoning en het
      gebruik van dienstwoningen.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel64
  - number: '65'
    text: |-
      1 De ambtenaar kan worden verplicht tijdelijk andere ambtelijke werkzaamheden te verrichten dan die, welke hij
      gewoonlijk verricht, mits die werkzaamheden hem redelijkerwijs kunnen worden opgedragen. Hij kan echter niet
      worden verplicht werkzaamheden te verrichten in de plaats van stakers of uitgeslotenen in particuliere dienst,
      tenzij de opgedragen werkzaamheden worden verricht in dienst van het lichaam, waarbij hij werkzaam is, en voor de
      openbare dienst tijdens de staking of uitsluiting, dan wel als onmiddellijk gevolg daarvan redelijkerwijze dadelijk
      noodzakelijk zijn te achten.

      2 Voorts kan aan de ambtenaar door Onze Minister de verplichting worden opgelegd in tijden van oorlog,
      oorlogsgevaar of andere buitengewone omstandigheden andere werkzaamheden te verrichten dan die, welke hij
      gewoonlijk verricht, mits die werkzaamheden strekken ter uitvoering van de taak, welke het Ministerie van
      Buitenlandse Zaken in die tijden heeft of zal krijgen, dan wel ertoe strekken een zo goed en ongestoord mogelijke
      uitvoering van die taak te verzekeren.

      3 De ambtenaar aan wie de in het tweede lid bedoelde verplichting is opgelegd, is tevens te allen tijde verplicht
      lessen te volgen en deel te nemen aan oefeningen, die verband houden met de in dat lid bedoelde werkzaamheden.

      4 Bij de toepassing van het eerste tot en met derde lid wordt voor zover mogelijk rekening gehouden met de
      persoonlijke omstandigheden van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel65
  - number: '66'
    text: |-
      1 De ambtenaar die is aangewezen om tevens werkzaam te zijn als bedrijfshulpverlener als bedoeld in artikel 15 van
      de Arbeidsomstandighedenwet ontvangt een vergoeding indien hij de taken in verband met bedrijfshulpverlening in
      voldoende omvang verricht.

      2 De vergoeding, bedoeld in het eerste lid, bedraagt per jaar:

      a. voor de basisbedrijfshulpverlener: € 231,27;

      b. voor de allroundbedrijfshulpverlener: € 462,53;

      c. voor de bedrijfshulpverlener die is aangewezen om leidinggevende taken met betrekking tot bedrijfshulpverlening
      uit te oefenen: € 693,81.

      3 De aanspraak op de vergoeding wordt berekend naar het bedrag van de vergoeding, bedoeld in het tweede lid, op
      de eerste dag van de maand die volgt op het verstrijken van het jaar waarin betrokkene bedrijfshulpverlener was.
      De vergoeding voor een gedeelte van een jaar wordt berekend naar evenredigheid van het aantal hele maanden dat de
      aanwijzing tot bedrijfshulpverlener heeft geduurd.

      4 De ambtenaar, bedoeld in het eerste lid, ontvangt vijf jaar na diens aanwijzing tot bedrijfshulpverlener en
      vervolgens elke vijf jaar daarna zolang de aanwijzing duurt, een jubileumtoeslag ten bedrage van:

      a. € 378,44 na vijf jaar;

      b. € 462,53 na tien jaar;

      c. € 551,89 na vijftien jaar en na elke vijf jaar daaropvolgend.

      5 In afwijking van [artikel 23 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] worden taken in
      het kader van de bedrijfshulpverlening die in opdracht van het bevoegd gezag als overwerk worden verricht, vergoed
      voor alle aangewezen ambtenaren en uitsluitend met een bedrag in geld, met dien verstande dat voor elk uur overwerk
      een vergoeding wordt toegekend ten bedrage van 125% van het salaris per uur, behorende bij het maximumsalaris van
      salarisschaal 7.

      6 Indien de bedragen, bedoeld in in [artikel 58a, tweede en vierde lid, van het ARAR][ref2] door Onze Minister
      voor Wonen en Rijksdienst worden aangepast, is die aanpassing van overeenkomstige toepassing op respectievelijk het
      tweede en vierde lid.


