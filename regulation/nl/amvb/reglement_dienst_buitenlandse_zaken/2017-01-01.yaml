      1 Indien dit wenselijk wordt gevonden of de ambtenaar dit aanvraagt, wordt een beoordeling opgemaakt.

      2 Een beoordeling wordt eerst vastgesteld nadat deze met de ambtenaar is besproken en hij zijn zienswijze kenbaar
      heeft kunnen maken.

      3 Bij ministeriële regeling worden, na overleg met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      nadere regels gesteld omtrent het opmaken en vaststellen van beoordelingen.
