  - number: 76a
    text: |-
      1 De ambtenaar die een functie als bedoeld in het derde lid uitoefent of ten minste drie maanden waarneemt,
      ontvangt een maandelijkse tegemoetkoming in verband met representatiekosten.

      2 In deze bepaling wordt onder representatiekosten verstaan de door de ambtenaar gemaakte of te maken kosten in
      verband met de eisen die de uitoefening van de functie stelt ten aanzien van het onderhouden van externe contacten
      en het verrichten van representatieve activiteiten, waaronder worden begrepen de kosten in verband met:

      a. huur of aanschaf van kleding en schoeisel of andere persoonlijke attributen;

      b. aanpassing en inrichting van de eigen woning;

      c. persoonlijke verzorging;

      d. contributies en lidmaatschappen;

      e. ontvangsten van bescheiden omvang in de eigen woning;

      f. het aanbieden van lunches, diners en overige consumpties, persoonlijke attenties en geschenken, en

      g. fooien.

      3 De tegemoetkoming, bedoeld in het eerste lid, bedraagt:

      a. voor de functie van directeur-generaal of secretaris-generaal: € 533,33;

      b. voor het structurele plaatsvervangerschap van een functie als bedoeld onder a: 75% van het onder a genoemde
      bedrag;

      c. voor de functie van directeur of daarmee door Onze Minister voor de toepassing van dit artikel gelijk te stellen
      functie: 50% van het onder a genoemde bedrag;

      d. voor een andere functie waaraan representatiekosten zijn verbonden, voor zover deze functie is vermeld op een
      daartoe door het bevoegd gezag vastgestelde lijst: het bij die functie vermelde bedrag dat maximaal 25% van het
      onder a genoemde bedrag kan zijn.

      4 Indien de ambtenaar op grond van het derde lid in aanmerking zou komen voor meer dan één tegemoetkoming ontvangt
      hij uitsluitend de tegemoetkoming met het hoogste bedrag.

      5 In afwijking van het derde lid, aanhef en onder d, kan in bijzondere gevallen een hogere tegemoetkoming aan de
      betrokken ambtenaar worden toegekend, die maximaal gelijk is aan het bedrag, bedoeld in het derde lid, onder c.

      6 De tegemoetkoming wordt niet uitbetaald vanaf de eerste dag van de kalendermaand volgend op die waarin de
      ambtenaar in het geheel geen dienst heeft verricht, tenzij het niet verrichten van de dienst het gevolg is van
      vakantieverlof of ziekte voor zover het de eerste vier weken van de ziekte betreft. De uitbetaling wordt hervat in
      de kalendermaand volgend op die waarin de ambtenaar zijn dienst heeft hervat.

      7 De ambtenaar die een tegemoetkoming als bedoeld in het eerste lid ontvangt, kan geen representatiekosten
      declareren.

      8 Aan de ambtenaar die geen tegemoetkoming als bedoeld in het eerste lid ontvangt, of de ambtenaar, bedoeld in het
      eerste lid, die kosten voor representatieve activiteiten heeft gemaakt, die niet zijn genoemd in het tweede lid,
      kunnen daadwerkelijk gemaakte representatiekosten geheel of gedeeltelijk worden vergoed, indien:

      a. het onderhouden van externe contacten en het verrichten van representatieve activiteiten plaatsvindt met
      voorafgaande toestemming van of in opdracht van het bevoegd gezag;

      b. de declaratie van representatiekosten is ingediend binnen zes maanden na de kalendermaand waarin de kosten zijn
      gemaakt, en

      c. daarbij door de ambtenaar bewijsstukken worden overgelegd waaruit blijkt dat de kosten daadwerkelijk zijn
      gemaakt.

      9 Indien het bedrag, bedoeld in [artikel 68a, derde lid, onder a, van het ARAR][ref1], door Onze Minister voor
      Wonen en Rijksdienst wordt aangepast, is die aanpassing van overeenkomstige toepassing op het bedrag, bedoeld in
      het derde lid, onder a.


