  - number: 101a
    text: |-
      Aan de ambtenaar die een benoeming tot minister of staatssecretaris aanvaardt, wordt met ingang van de dag van het
      aanvaarden van deze betrekking eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel101a
  - number: '103'
    text: |-
      Voor de ontslagverlening, bedoeld in [artikel 125e, tweede lid, van de Ambtenarenwet][ref1], is overeenstemming
      vereist met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties. Deze is gehouden het advies in te winnen
      van de Adviescommissie grondrechten en functie-uitoefening ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel103
