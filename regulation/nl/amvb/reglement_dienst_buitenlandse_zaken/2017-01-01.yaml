  - number: '7'
    text: |-
      1 Het Ministerie van Buitenlandse Zaken omvat het in Nederland gevestigde deel van het Ministerie van Buitenlandse
      Zaken, verder aangeduid met departement, en de vertegenwoordigingen van het Koninkrijk in het buitenland.

      2 De vertegenwoordigingen van het Koninkrijk in het buitenland kunnen zijn:

      a. vaste diplomatieke zendingen, te weten ambassades en gezantschappen;

      b. permanente vertegenwoordigingen van het Koninkrijk bij internationale organisaties, ook als deze in Nederland
      zijn gevestigd;

      c. consulaire posten, te weten consulaten-generaal, consulaten, vice-consulaten en consulaire agentschappen;

      d. tijdelijke diplomatieke zendingen;

      e. andere, naar het oordeel van Onze Minister met de onder a tot en met d vergelijkbare, posten.

      3 De in het tweede lid genoemde vertegenwoordigingen van het Koninkrijk in het buitenland worden bij koninklijk
      besluit naar behoefte ingesteld, geopend, verplaatst, gesloten en opgeheven; bij de instelling worden hun
      hoedanigheid en plaats van vestiging of bestemming bepaald.

      4 Het ambtsgebied van een vaste diplomatieke zending omvat het grondgebied van de staat of de staten waar de
      zending wordt onderhouden.

      5 Onze Minister bepaalt voor elke consulaire post een ressort en kan dit naar behoefte wijzigen. Binnen de
      ressorten van consulaire posten kan hij sub-ressorten instellen voor consulaire posten van dezelfde of lagere orde.

      6 Consulaire posten die zich binnen het ambtsgebied van een vaste diplomatieke zending bevinden zijn daaraan
      ondergeschikt tenzij Onze Minister anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel7
  - number: '8'
    text: |-
      1 Bij het departement kunnen werkzaam zijn:

      a. ambtenaren;

      b. ambtenaren van Aruba, Curaçao en Sint Maarten welke door Onze Minister in overeenstemming met de regering van
      Aruba, Curaçao dan wel Sint Maarten, bij het departement zijn gedetacheerd.

      c. anderen dan de onder a en b genoemden die door of in overeenstemming met Onze Minister tijdelijk op het
      departement zijn tewerkgesteld.

      2 Bij de vertegenwoordigingen van het Koninkrijk in het buitenland kunnen werkzaam zijn:

      a. ambtenaren;

      b. werknemers als bedoeld in [artikel 114][ref1];

      c. degenen die bij koninklijk besluit dan wel door Onze Minister als honorair consulair ambtenaar zijn aangesteld;

      d. honoraire adviseurs, in de zin van [artikel 5, tweede lid, onder d][ref2].

      3 Bij de vertegenwoordigingen van het Koninkrijk in het buitenland kunnen voorts ter verdere verwezenlijking van de
      in [artikel 6][ref3] genoemde taak

      a. in overeenstemming met Onze Minister worden gedetacheerd ambtenaren van een ander ministerie, wier detachering
      geschiedt door Onze Minister, hoofd van het betrokken ministerie;

      b. werknemers, bedoeld in [artikel 115][ref4] werkzaam zijn.

      4 Aan de vertegenwoordigingen van het Koninkrijk in het buitenland kunnen voorts ter verdere verwezenlijking van
      de in [artikel 6][ref5] genoemde taak door Onze Minister worden toegevoegd ambtenaren van een ander ministerie, dan
      wel van Aruba, Curaçao en van Sint Maarten, die met het oog op die tewerkstelling tijdelijk ter beschikking zijn
      gesteld van Onze Minister.

      5 Onze Minister kan voorts, onder door hem te stellen voorwaarden, anderen dan degenen bedoeld in het tweede tot en
      met vierde lid tijdelijk bij een vertegenwoordiging van het Koninkrijk in het buitenland werkzaam laten zijn.

      6 In bijzondere gevallen kunnen aan tijdelijke diplomatieke zendingen anderen dan de in het tweede, derde, vierde
      en vijfde lid genoemden, worden toegevoegd.

      7 Onze Minister kan, voor wat betreft de dienstverrichtingen van degenen die in het derde, vierde en zesde
      lid zijn genoemd, in overeenstemming met zijn betrokken ambtgenoot, dan wel met de regering van Aruba, Curaçao
      onderscheidenlijk Sint Maarten; nadere regelen stellen.

      8 Onze Minister, hoofd van het betrokken ministerie, stelt in overeenstemming met Onze Minister de vergoedingen en
      tegemoetkomingen vast welke verband houden met de in het derde lid, onder *a*, bedoelde detacheringen volgens de
      regelen die bij of krachtens dit reglement zijn gesteld.

      9 Op degenen die ingevolge het vierde lid aan een vertegenwoordiging van het Koninkrijk in het buitenland worden
      toegevoegd, kan Onze Minister bepalingen van dit reglement, welke gelden voor ambtenaren, van overeenkomstige
      toepassing verklaren.


