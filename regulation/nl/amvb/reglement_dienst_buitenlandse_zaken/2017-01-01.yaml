      In dit hoofdstuk, [hoofdstuk XIV][ref1] en [hoofdstuk XXV][ref2] wordt verstaan onder:

        - *AAOP-uitkering:* ABP ArbeidsongeschiktheidsPensioen als bedoeld in hoofdstuk 11 van het pensioenreglement;
        - *arbeidsongeschiktheid:* volledige en duurzame arbeidsongeschiktheid als bedoeld in
      [artikel 4, eerste lid, van de WIA][ref3] of gedeeltelijke arbeidsgeschiktheid als bedoeld in
      [artikel 5 van de WIA][ref4];
        - *beroepsincident:* een dienstongeval of beroepsziekte voortvloeiend uit een gevaarzettende situatie die
      rechtstreeks verband houdt met de uitvoering van zijn taak waaraan de ambtenaar zich vanwege zijn specifieke
      functie niet kan onttrekken;
        - *beroepsziekte:* een ziekte, die in overwegende mate haar oorzaak vindt in de aard van de aan de ambtenaar
      opgedragen werkzaamheden of in de bijzondere omstandigheden, waaronder deze moesten worden verricht, en niet aan
      zijn schuld of onvoorzichtigheid is te wijten;
        - *bovenwettelijke WW-uitkering:* de uitkering, bedoeld in
      __REF002___________________________________________________________________________________________________________
      _____;
        - *dienstongeval:* een ongeval, dat in overwegende mate zijn oorzaak vindt in de aard van de aan de ambtenaar
      opgedragen werkzaamheden of in de bijzondere omstandigheden, waaronder deze moesten worden verricht, en niet aan
      zijn schuld of onvoorzichtigheid is te wijten;
        - *gewezen ambtenaar:* een ambtenaar aan wie ontslag is verleend, met ingang van de dag waarop het ontslag is
      ingetreden;
        - *passende arbeid:* alle arbeid die voor de krachten en bekwaamheden van de ambtenaar is berekend, tenzij
      aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan worden gevergd;
        - *Pensioenreglement:* het Pensioenreglement van de Stichting Pensioenfonds ABP;
        - *Stichting Pensioenfonds ABP:* de Stichting Pensioenfonds ABP, genoemd in
      [artikel 6 van de Wet privatisering ABP][ref6];
        - *Wet SUWI:* [Wet structuur uitvoeringsorganisatie werk en inkomen][ref7];
        - *UWV:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet SUWI][ref8];
        - *WIA:* [Wet werk en inkomen naar arbeidsvermogen][ref9];
        - *WIA-uitkering:* een uitkering op grond van de [WIA][ref10];
        - *WW-uitkering:* een uitkering op grond van de [Werkloosheidswet][ref11];
        - *ZW:* [Ziektewet][ref12];
        - *ZW-uitkering:* ziekengeld als bedoeld in [artikel 19 van de ZW][ref13];
        - *arbeid:* hetgeen daaronder wordt verstaan ingevolge [artikel 19 van de ZW][ref14].


