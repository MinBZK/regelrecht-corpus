  - number: '95'
    text: Ontslag wordt verleend door het gezag dat bevoegd is tot aanstelling.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel95
  - number: '96'
    text: |-
      1 De ambtenaar wordt op zijn aanvraag ontslag verleend.

      2 Behoudens in het geval, bedoeld in [artikel 46a, eerste lid][ref1], wordt dit ontslag verleend met ingang van een
      dag niet vroeger dan een maand of later dan drie maanden na de dag, waarop de aanvraag om ontslag is ingekomen.

      3 Van het eerste lid kan worden afgeweken:

      a. indien een strafrechtelijke vervolging ter zake van misdrijf tegen de ambtenaar is ingesteld, of

      b. indien wordt overwogen de disciplinaire straf van ontslag op te leggen.

      4 Van het tweede lid kan worden afgeweken:

      a. indien wordt overwogen de ambtenaar een disciplinaire straf op te leggen;

      b. indien het belang van de dienst zulks vordert, met dien verstande, dat de termijn van drie maanden, vermeld in
      het tweede lid, tot ten hoogste zes maanden kan worden verlengd en dat bij de verlenging in redelijkheid met het
      belang van de ambtenaar rekening wordt gehouden, of

      c. op aanvraag van de ambtenaar.

      5 Het ontslag op aanvraag van de ambtenaar wordt eervol verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel46a
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel96
