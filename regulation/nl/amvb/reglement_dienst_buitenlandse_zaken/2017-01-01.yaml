        artikel: 125e
  - number: '104'
    text: |-
      1 Anders dan op aanvraag van de ambtenaar, bij wijze van straf of ingevolge het bepaalde bij
      [artikel 7 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1], bij de
      [artikelen 98 tot en met 101a][ref2] van dit besluit en bij [artikel 125e, tweede lid, van de Ambtenarenwet][ref3],
      kan de ambtenaar worden ontslagen op grond van:

      a. het verlies van een vereiste voor de benoembaarheid, door het bevoegde gezag gesteld bij een regeling aan de
      benoeming voorafgegaan, tenzij het vereiste alleen voor de aanvang van het ambt geldt;

      b. onherroepelijk geworden rechterlijke uitspraak, waarbij de ambtenaar onder curatele is gesteld;

      c. het ondergaan van lijfsdwang wegens schulden krachtens onherroepelijk geworden rechterlijke uitspraak;

      d. onherroepelijk geworden veroordeling tot vrijheidsstraf wegens misdrijf;

      e. ongeschiktheid wegens ziekte voor het vervolgen van zijn loopbaan, dan wel, indien de ambtenaar is aangesteld in
      tijdelijke dienst anders dan voor een proeftijd, tot het verrichten van zijn arbeid;

      f. onbekwaamheid of ongeschiktheid anders dan op grond van ziels- of lichaamsgebreken, voor het vervolgen van zijn
      loopbaan, dan wel, indien de ambtenaar is aangesteld in tijdelijke dienst anders dan voor een proeftijd, voor de
      door hem vervulde functie;

      g. het bereiken van de leeftijd van zeventig jaar;

      h. het bij of in verband met indiensttreding of keuring verstrekken van onjuiste of onvolledige inlichtingen,
      zonder welke handelwijze niet tot indienstneming of goedkeuring zou zijn overgegaan, tenzij de ambtenaar
      aannemelijk maakt dat hij te goeder trouw heeft gehandeld.

      2 Een ontslag op grond van het bepaalde in het eerste lid onder a, e, f en g wordt steeds eervol verleend.

      3 Een ontslag als bedoeld in het eerste lid, onderdeel e, kan slechts plaatsvinden indien:

      a. er sprake is van ongeschiktheid voor het vervolgen van zijn loopbaan, respectievelijk tot het verrichten van
      zijn arbeid, wegens ziekte gedurende een ononderbroken periode van twee jaar,

      b. herstel van zijn ziekte niet binnen een periode van zes maanden na de in onderdeel a genoemde periode van twee
      jaar te verwachten is, en

      c. Onze Minister van oordeel is dat duurzame reïntegratie in arbeid die aansluit bij de benutbare mogelijkheden van
      de ambtenaar, niet binnen een redelijke termijn te verwachten is.

      4 De termijn van twee jaar, bedoeld in het derde lid, onderdeel a, wordt verlengd:

      a. met de duur van de vertraging indien Onze Minister de aangifte, bedoeld in
      [artikel 38, eerste lid, van de ZW][ref4] later doet dan op grond van dat artikel van de ZW is voorgeschreven;

      b. met de duur van de verlenging van de wachttijd, bedoeld in [artikel 23, eerste lid, van de WIA][ref5], indien de
      wachttijd op grond van [artikel 24, eerste lid, van de WIA][ref6] wordt verlengd;

      c. met de duur van het tijdvak dat het UWV op grond van [artikel 25, negende lid, van de WIA][ref7] heeft
      vastgesteld.

      5 Voor de berekening van het tijdvak van twee jaar, bedoeld in het derde lid, onderdeel a, worden perioden
      van ongeschiktheid tot het verrichten van arbeid wegens ziekte tengevolge van zwangerschap voorafgaand aan het
      zwangerschapsverlof en perioden van ongeschiktheid tijdens het zwangerschaps- of bevallingsverlof, bedoeld in
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref8], niet in aanmerking genomen.

      6 Perioden van ongeschiktheid tot het verrichten van zijn arbeid, anders dan bedoeld in het vijfde lid, worden
      samengeteld indien zij elkaar met een onderbreking van minder dan vier weken opvolgen, of indien zij direct
      voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref9], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.

      7 Bij de beoordeling of er sprake is van een situatie als bedoeld in het derde lid, betrekt het bevoegd gezag de
      uitslag van de beoordeling door het UWV van de claim in het kader van de [WIA][ref10]. Indien deze beoordeling niet
      of langer dan een jaar geleden heeft plaatsgevonden, vraagt het bevoegd gezag aan het UWV een oordeel als bedoeld
      in [artikel 32, derde lid, van de Wet SUWI][ref11] en betrekt dit bij zijn beoordeling.

      8 Indien herplaatsing als bedoeld in [artikel 54a][ref12], plaatsvindt in een betrekking voor minder uren dan het
      aantal waarvoor de ambtenaar was aangesteld, heeft het ontslag uitsluitend betrekking op het meerdere aantal uren.

      9 Van ontslag als bedoeld in het eerste lid, onderdeel g, wordt op verzoek van de ambtenaar afgezien voor de duur
      van telkens ten hoogste één jaar, indien de ambtenaar volgens de uitslag van een arbeidsgezondheidskundig onderzoek
      als bedoeld in [artikel 50a, eerste lid, onderdeel k][ref13], in staat is zijn functie te blijven vervullen.

      10 Een verzoek als bedoeld in het negende lid wordt door de ambtenaar ten minste drie maanden voor het bereiken van
      de leeftijd van zeventig jaar of ouder, ingediend.

      11 Een arbeidsgezondheidskundig onderzoek als bedoeld in het negende lid wordt niet eerder dan vier maanden voor
      het bereiken van de leeftijd van zeventig jaar of ouder, bij de ambtenaar uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel98
