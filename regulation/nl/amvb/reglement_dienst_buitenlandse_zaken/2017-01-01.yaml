    text: |-
      1 De ambtenaar heeft recht op vergoeding wegens reis- en verblijfkosten ter zake van dienstreizen.

      2 Deze vergoeding wordt vastgesteld overeenkomstig de daarvoor gestelde regels. De vergoedingen voor de buiten
      Nederland geplaatste ambtenaren worden vastgesteld op grond van bij ministeriële regeling gestelde regels.
