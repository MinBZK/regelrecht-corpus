  - number: '33'
    text: |-
      1 Aan de ambtenaar die in verband met de werkzaamheden die voortvloeien uit een functie in een publiekrechtelijk
      college waarin hij is benoemd of verkozen, tijdelijk wordt ontheven van de waarneming van zijn ambt, wordt voor de
      duur daarvan een non-activiteitswedde toegekend. De non-activiteitswedde is het bedrag waarmee de laatstelijk door
      hem genoten bezoldiging het bedrag overschrijdt van de inkomsten die de ambtenaar in verband met zijn werkzaamheden
      in dat publiekrechtelijk college geniet.

      2 Voor de toepassing van het eerste lid geldt voorts dat:

      a. toekenning van de non-activiteitswedde plaatsvindt op de voet van het
      bepaalde in de [artikelen 4, tweede, derde, vierde en vijfde lid][ref1], en
      [5 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref2];

      b. onder inkomsten die in verband met zijn werkzaamheden in dat publiekrechtelijk college worden genoten wordt
      verstaan: alle inkomsten die aan die werkzaamheden zijn verbonden.

      3 Dit artikel is niet van toepassing op degene die een non-activiteitswedde geniet uit hoofde van
      [artikel 4, eerste lid, van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref3].


