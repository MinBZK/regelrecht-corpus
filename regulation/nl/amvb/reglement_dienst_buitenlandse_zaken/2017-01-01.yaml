  - number: '10'
    text: |-
      1 Het hoofd van een vertegenwoordiging van het Koninkrijk in het buitenland is jegens Onze Minister
      verantwoordelijk voor de leiding en inrichting van die vertegenwoordiging, alsmede voor de goede verrichting van de
      dienst, zulks met inachtneming van [artikel 12][ref1].

      2 Voorts is deze verantwoordelijk voor:

      a. een juist beheer van de zaken en andere waarden in gebruik bij of toevertrouwd aan die vertegenwoordiging van
      het Koninkrijk in het buitenland;

      b. een goed comptabel en financieel beheer;

      c. het toezicht op de ambtenaar die als rekenplichtig ambtenaar in de zin van de Comptabiliteitswet 2001 het beheer
      voert over de aan de vertegenwoordiging van het Koninkrijk in het buitenland toevertrouwde gelden en geldswaardige
      papieren.

      3 Het hoofd van een vaste diplomatieke zending heeft het toezicht op ambtenaren en overheidsinstellingen
      van Nederland, Aruba, Curaçao en Sint Maarten die zich duurzaam of tijdelijk voor ambtsverrichtingen in zijn
      ambtsgebied bevinden. Betrokkene kan in dit ambtsgebied tevens toezicht uitoefenen op de werkzaamheden van
      instellingen van Nederland, Aruba, Curaçao en Sint Maarten, geen ondernemingen zijnde, die zich bezighouden met de
      bevordering van de belangen van Nederland, Aruba, Curaçao en Sint Maarten en de uitvoering van het overheidsbeleid,
      alsmede op die van de vertegenwoordigingen of neveninstellingen daarvan. De vorige volzin geldt niet ten aanzien
      van een permanente vertegenwoordiging van het Koninkrijk bij een internationale organisatie met betrekking tot
      het vertegenwoordigen van het Koninkrijk bij die internationale organisatie, en ten aanzien van een tijdelijke
      diplomatieke zending met betrekking tot de aangelegenheid waartoe die tijdelijke diplomatieke zending werd
      ingesteld.

      4 Het hoofd van een vaste diplomatieke zending geeft aanwijzingen aan en oefent toezicht uit op de hoofden van
      consulaire posten die aan die vaste diplomatieke zending ondergeschikt zijn en kan het toezicht, bedoeld in het
      derde lid, overdragen aan deze consulaire posten.

      5 De bevoegdheden, in het derde en vierde lid voorzien, worden ook uitgeoefend door hoofden van consulaire posten,
      niet gelegen in het ambtsgebied van een vaste diplomatieke zending.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel12
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel10
