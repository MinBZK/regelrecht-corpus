        artikel: '117'
        hoofdstuk: XVIII
        paragraaf: '1'
  - number: '117'
    text: |-
      1 Zo spoedig mogelijk na diens indiensttreding legt de werknemer ten overstaan van een door Onze Minister daartoe
      aangewezen ambtenaar de navolgende eed of belofte af:

      "Ik zweer/beloof trouw aan de Koning, aan de Grondwet en aan de overige wetten van het Rijk.

      Ik zweer/verklaar dat ik tot het verkrijgen van mijn betrekking aan niemand iets heb gegeven of beloofd, noch zal
      geven of beloven.

      Ik zweer/beloof dat ik om iets in mijn werkzaamheden te doen of te laten, van niemand enige belofte of geschenk
      aannemen zal, en dat ik mij als een goed werknemer, zal gedragen, de mij verstrekte opdrachten zal volbrengen, en
      de zaken waarvan ik door mijn werkzaamheden kennis draag en waarvan ik het geheim of vertrouwelijk karakter weet of
      moet begrijpen, niet zal openbaren aan anderen dan aan hen, aan wie ik volgens de wet of ambtshalve tot mededeling
      verplicht ben.

      Zo waarlijk helpe mij God Almachtig!

      (Dat verklaar en beloof ik)."

      2 Indien de werknemer niet in het bezit is van de Nederlandse nationaliteit, blijft de eerste zin van de eed of
      belofte achterwege.

      3 De op de voet van [artikel 114][ref1] of [115][ref2] indienstgenomen werknemer legt de in het eerste en tweede
      lid bedoelde eed of belofte alleen af, indien de door deze te vervullen functie zulks, naar het oordeel van het
      hoofd van de desbetreffende vertegenwoordiging van het Koninkrijk in het buitenland, wettigt.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel115
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel117
