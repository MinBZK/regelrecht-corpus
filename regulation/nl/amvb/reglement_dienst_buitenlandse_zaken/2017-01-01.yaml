  - number: '54'
    text: |-
      1 De ambtenaar heeft bij ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een tijdvak van
      52 weken recht op doorbetaling van zijn bezoldiging. Bij voortdurende ongeschiktheid heeft hij vervolgens recht op
      doorbetaling van 70% van zijn bezoldiging.

      2 Het tijdvak van 52 weken, bedoeld in het eerste lid, vangt aan op de eerste dag waarop wegens ziekte geheel
      of gedeeltelijk niet is of zou zijn gewerkt, of het werken wegens ziekte geheel of gedeeltelijk is of zou zijn
      gestaakt. Indien de ambtenaar buitengewoon verlof zonder behoud van bezoldiging geniet, vangt het tijdvak aan op de
      dag volgend op die waarop het buitengewoon verlof is beëindigd.

      3 Voor de toepassing van het eerste lid worden perioden van ongeschiktheid samengeteld, indien:

      a. zij direct voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten
      overeenkomstig [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], tenzij de ongeschiktheid
      redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak, of

      b. zij elkaar met een onderbreking van minder dan vier weken opvolgen.

      4 In afwijking van het eerste lid, heeft de ambtenaar ook na afloop van het tijdvak van 52 weken, bedoeld in het
      eerste lid, recht op doorbetaling van zijn bezoldiging indien de ongeschiktheid om zijn arbeid te verrichten wordt
      veroorzaakt door een beroepsincident.

      5 In afwijking van het eerste lid, heeft de ambtenaar ook na afloop van het tijdvak van 52 weken, bedoeld in het
      eerste lid, recht op doorbetaling van zijn bezoldiging over het aantal uren dat hij passende arbeid heeft verricht
      of zou hebben verricht indien die arbeid hem zou zijn aangeboden.

      6 De doorbetaling van de bezoldiging eindigt:

      a. met ingang van de dag waarop de ambtenaar op grond van artikel [54a, eerste lid][ref2], is herplaatst;

      b. met ingang van de dag waarop de ambtenaar ontslag is verleend; of

      c. met ingang van de dag volgende op die waarop de ambtenaar is overleden.

      7 Gedurende een plaatsing buiten Nederland kan Onze Minister een ambtenaar, indien de ongeschiktheid tot het
      verrichten van zijn arbeid wegens ziekte naar verwachting langer dan drie maanden zal voortduren, opdracht geven
      tot terugkeer met zijn gezinsleden naar Nederland.

      8 Het eerste lid, tweede volzin, is niet van toepassing op de ambtenaar die na het bereiken van de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], wegens
      ziekte ongeschikt is tot het verrichten van zijn arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel31
