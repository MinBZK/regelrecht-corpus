  - number: '111'
    text: |-
      1 Gedurende de kalendermaand van het overlijden en de volgende drie kalendermaanden behouden de achterblijvende
      gezinsleden het gebruik van de dienstwoning, waarin zij met de ambtenaar woonden. Daarvan kan worden afgeweken als
      Onze Minister dat in het belang van de dienst noodzakelijk acht. Alsdan wordt naar billijkheid een schadevergoeding
      gegeven.

      2 Bij vrijwillig verlaten van de dienstwoning binnen de termijn gedurende welke de woning nog mag worden gebruikt,
      kan een vergoeding worden gegeven. De eerste volzin is niet van toepassing op een buiten Nederland gelegen woning.

      3 Indien door de ambtenaar voor het gebruik van de dienstwoning een vergoeding verschuldigd was, voldoen de
      achtergebleven gezinsleden deze over de tijd, gedurende welke zij het gebruik van die woning behouden.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel111
  - number: '112'
    text: |-
      1 Indien de ambtenaar ten tijde van diens overlijden een tegemoetkoming genoot in de zin van
      [artikel 36, eerste lid][ref1], wordt deze gedurende ten hoogste drie maanden, of zoveel langer als aantoonbaar
      onvermijdelijk blijkt, doorbetaald ten behoeve van de nagelaten gezinsleden, voor zover deze tegemoetkoming verband
      houdt met hun verblijf buiten Nederland.

      2 Indien de ambtenaar overlijdt gedurende het tijdvak waarover aan hem de in het [derde lid van artikel 36][ref2]
      genoemde tegemoetkoming is toegekend, worden de in dat lid bedoelde regels toegepast ten behoeve van de nagelaten
      gezinsleden, voor zolang de bijzondere kosten te hunnen aanzien doorlopen. De hoogte van de vergoeding wordt dan
      berekend als ware de ambtenaar niet overleden.

      3 Indien de ambtenaar overlijdt gedurende een plaatsing buiten Nederland en de nagelaten gezinsleden verkiezen naar
      Nederland terug te keren, gelden de in het [derde lid van artikel 36][ref3] bedoelde regels eveneens voor zolang
      de bijzondere kosten te hunnen aanzien doorlopen. Voor de berekening van de hoogte en de duur van de in die regels
      voorziene tegemoetkoming in de bijzondere kosten wordt de toepassing van de regels dan geacht te zijn ingegaan op
      de dag, volgende op de dag waarop de ambtenaar is overleden. Is na diens overlijden met toepassing van het eerste
      lid, de tegemoetkoming, bedoeld in [artikel 36, eerste lid][ref4], doorbetaald, dan wordt over dat tijdvak de
      eerstgenoemde tegemoetkoming geacht voor de laatstgenoemde in de plaats te zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel36
