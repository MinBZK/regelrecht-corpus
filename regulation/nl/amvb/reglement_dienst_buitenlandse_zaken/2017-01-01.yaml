  - number: 43c
    text: |-
      1 Tenzij de belangen van de dienst zich daartegen verzetten, wordt jaarlijks ten hoogste 120 uren buitengewoon
      verlof met behoud van bezoldiging verleend voor het bijwonen van vergaderingen van statutaire organen van
      verenigingen van ambtenaren, van centrale organisaties waarbij deze verenigingen zijn aangesloten of van
      internationale ambtenarenorganisaties, mits de ambtenaar hieraan deelneemt:

      a. indien het vergaderingen betreft van verenigingen van ambtenaren: als bestuurslid van die vereniging dan wel als
      afgevaardigde of bestuurslid van een onderdeel daarvan;

      b. indien het vergaderingen betreft van centrale organisaties waarbij verenigingen van ambtenaren zijn aangesloten:
      als bestuurslid van die centrale organisatie dan wel als afgevaardigde of bestuurslid van een bij die organisatie
      aangesloten vereniging van ambtenaren;

      c. indien het vergaderingen betreft van een internationale ambtenarenorganisatie: als bestuurslid van deze
      organisatie dan wel als afgevaardigde of bestuurslid van een bij die organisatie aangesloten vereniging van
      ambtenaren.

      2 Tenzij de belangen van de dienst zich daartegen verzetten, wordt tot ten hoogste 208 uren per jaar
      buitengewoon verlof met behoud van bezoldiging verleend aan de ambtenaar, die door een centrale als bedoeld
      in [artikel 142, derde lid][ref1], of door een daarbij aangesloten vereniging is aangewezen om bestuurlijke
      of vertegenwoordigende activiteiten te ontplooien binnen zijn centrale of een daarbij aangesloten vereniging
      dan wel binnen de organisatie van de werkgever, die er toe strekken de doelstellingen van zijn centrale van
      overheidspersoneel en de daarbij aangesloten verenigingen te ondersteunen.

      3 Tenzij de belangen van de dienst zich daartegen verzetten, wordt buitengewoon verlof met behoud van bezoldiging
      verleend aan de ambtenaar voor het – op uitnodiging van een organisatie van ambtenaren – als cursist deelnemen aan
      een cursus, met dien verstande dat dit verlof ten hoogste 48 uren per twee jaren bedraagt.

      4 Het aantal uren dat op grond van het eerste, tweede en derde lid aan een ambtenaar mag worden verleend, bedraagt
      tezamen ten hoogste 240 uren per jaar, met dien verstande dat ten hoogste 320 uren worden verleend:

      a. aan leden van de hoofdbesturen van de centrale organisaties, genoemd in
      [artikel 105, tweede lid, onder a en b, van het ARAR][ref2] en van organisaties, die rechtstreeks bij die centrale
      organisaties zijn aangesloten;

      b. aan leden van het hoofdbestuur van het Ambtenarencentrum en aan leden van het dagelijks bestuur van de bij die
      centrale aangesloten organisaties;

      c. aan leden van het hoofdbestuur van de Centrale van Middelbare en Hogere Functionarissen bij Overheid, Onderwijs,
      Bedrijven en Instellingen, alsmede aan de bestuursleden van de sectoren en secties van die organisatie.

      5 Het verlof, bedoeld in het eerste tot en met vierde lid, wordt slechts verleend aan ambtenaren die lid zijn van
      verenigingen van ambtenaren die zijn aangesloten bij centrales van verenigingen van ambtenaren die deel uitmaken
      van de Sectorcommissie overleg rijkspersoneel.

      6 Tenzij andere belangen van de dienst zich daartegen verzetten, wordt buitengewoon verlof met behoud van
      bezoldiging verleend voor het bijwonen van vergaderingen van georganiseerd overleg in ambtenarenzaken. Dit geldt
      eveneens voor een voorvergadering per in de eerste volzin bedoelde vergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel105
