  - number: 54a
    text: |-
      1 De ambtenaar die ongeschikt is tot het verrichten van zijn arbeid wegens ziekte is verplicht een andere functie
      te aanvaarden indien sprake is van passende arbeid.

      2 De ambtenaar die door het UWV in het kader van de WIA minder dan 35% arbeidsongeschikt is verklaard, wordt
      herplaatst in een functie die passende arbeid omvat, tenzij een zwaarwegend dienstbelang zich daartegen verzet.

      3 De ambtenaar die op grond van het eerste lid is herplaatst voordat de termijn van twee jaar, bedoeld in
      [artikel 104, derde lid, onderdeel a][ref1], is verstreken, heeft tot het eind van genoemde termijn recht op een
      aanvullende uitkering ter grootte van het verschil tussen:

      a. het bedrag waarop de ambtenaar op grond van [artikel 54][ref2] recht zou hebben gehad indien hem geen andere
      functie zou zijn opgedragen, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering; en

      b. zijn bezoldiging na herplaatsing, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering.

      4 Indien de ziekte uit hoofde waarvan de ambtenaar ongeschikt is zijn arbeid te verrichten, wordt veroorzaakt door
      een beroepsincident, heeft de ambtenaar, bedoeld in het derde lid, van wie de arbeidsongeschiktheid ten minste 35%
      bedraagt, nadat de termijn van twee jaar is verstreken tevens recht op een aanvullende uitkering ter grootte van
      het verschil tussen:

      a. een percentage van zijn bezoldiging vermeerderd met de vakantie-uitkering en de eindejaarsuitkering, zoals
      die zou zijn op de dag voor zijn herplaatsing indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot
      werken, en

      b. zijn bezoldiging na herplaatsing vermeerderd met de vakantie-uitkering, de eindejaarsuitkering en een uit de
      oorspronkelijke functie voortvloeiend recht op een WIA-uitkering en een AAOP-uitkering.

      5 Het percentage, bedoeld in het vierde lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van:








                    80% of meer:


                    90,02%;




                    65 tot 80%:


                    65,26%;




                    55 tot 65%:


                    54,01%;




                    45 tot 55%:


                    45,01%;




                    35 tot 45%:


                    36,01%.






      6 De aanvullende uitkeringen, bedoeld in het derde en vierde lid, eindigen in ieder geval:

      a. met ingang van de dag waarop de ambtenaar ontslag is verleend; of

      b. met ingang van de dag volgende op die waarop de ambtenaar is overleden.

      7 In zoverre in afwijking van het derde lid, bedraagt voor de ambtenaar die na het bereiken van de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], wegens
      ziekte ongeschikt is tot het verrichten van zijn arbeid, de aanvullende uitkering na de eerste 52 weken weken het
      verschil tussen:

      a. het bedrag waarop de ambtenaar op grond van [artikel 76a van de Ziektewet][ref4] recht zou hebben gehad indien
      hem geen andere functie zou zijn opgedragen, vermeerderd met de vakantie-uitkering en eindejaarsuitkering; en

      b. zijn bezoldiging na herplaatsing, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
