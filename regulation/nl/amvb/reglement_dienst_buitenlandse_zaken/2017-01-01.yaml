  - number: 54ab
    text: |-
      1 De ambtenaar, bedoeld in [artikel 54a, tweede lid][ref1], ontvangt bij voortdurende arbeidsongeschiktheid
      gedurende hoogstens vijf jaar een uitkering van 70% van het verschil tussen:

      a. zijn bezoldiging, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering zoals die zou zijn geweest op
      de dag voor zijn herplaatsing indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot werken, en

      b. zijn bezoldiging na herplaatsing verminderd met eventuele daarna volgende verhogingen op grond van
      [artikel 7 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2], en vermeerderd met de vakantie-
      uitkering en de eindejaarsuitkering.

      2 In afwijking van het eerste lid heeft de ambtenaar die arbeidsongeschikt is geworden ten gevolge van een
      beroepsincident, ook nadat de termijn van vijf jaar is verstreken recht op een uitkering.

      3 De uitkering eindigt in ieder geval:

      a. met ingang van de dag waarop de ambtenaar ontslag is verleend;

      b. met ingang van de dag volgend op die waarop de ambtenaar is overleden.

      4 Bij eventuele samenloop van een recht op uitkering op grond van dit artikel en een recht op uitkering op grond
      van [artikel 54a, derde of vierde lid][ref3], vervalt laatstbedoelde recht.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel54a
