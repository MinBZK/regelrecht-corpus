  - number: '20'
    text: |-
      1 In zeer bijzondere gevallen kan op aanvraag van betrokkene een aanstelling in tijdelijke dienst worden verleend
      waarin ten aanzien van hem dit besluit gedeeltelijk of andere algemene maatregelen van bestuur als bedoeld in
      [artikel 125, eerste lid, van de Ambtenarenwet][ref1] die specifiek betrekking hebben op ambtenaren in de zin van
      dit besluit of van het [ARAR][ref2], geheel of gedeeltelijk buiten toepassing worden verklaard.

      2 Door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties gestelde nadere regels omtrent het eerste lid
      zijn van overeenkomstige toepassing.


