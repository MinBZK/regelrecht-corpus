  - number: '132'
    text: |-
      1 Voor het vervullen van consulaire taken en het uitoefenen van consulaire bevoegdheden bij vertegenwoordigingen
      van het Koninkrijk in het buitenland kunnen bij koninklijk besluit, indien de benoeming bij koninklijk besluit
      dient te geschieden, dan wel door Onze Minister daartoe geschikt en bekwaam geachte personen als honorair consulair
      ambtenaar worden benoemd en ontslagen.

      2 De in het eerste lid bedoelde personen zijn, binnen het kader van de door hen te vervullen consulaire taken en
      uit te oefenen consulaire bevoegdheden, ambtenaar en behoren als zodanig tot de DBZ.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel132
  - number: '133'
    text: |-
      1 Benoeming tot honorair consulair ambtenaar geschiedt voor een periode van ten hoogste vijf jaar. De benoeming kan
      telkens worden verlengd met een periode van ten hoogste vijf jaar.

      2 Wanneer het belang van de dienst dat bepaaldelijk vordert, kan de honorair consulair ambtenaar door Onze Minister
      met onmiddellijke ingang worden geschorst.

      3 Aan de honorair consulair ambtenaar wordt ontslag verleend door het tot benoeming bevoegde gezag:

      a. op aanvraag van de honorair consulair ambtenaar;

      b. wanneer het dienstbelang dat bepaaldelijk vordert.

      4 Bij ontslag, anders dan vanwege voltooiing van de benoemingsperiode, wordt een opzeggingstermijn van drie maanden
      in acht genomen.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel133
  - number: '134'
    text: |-
      Bij diens benoeming verbindt de honoraire consulaire ambtenaar zich

      a. tot het vervullen van consulaire taken en het uitoefenen van consulaire bevoegdheden overeenkomstig de
      Nederlandse wetten en besluiten, ten behoeve van Nederlanders, in het daarbij aangewezen ressort;

      b. tot het opvolgen van de aanwijzingen, door Onze Minister of door het hoofd van de vertegenwoordiging van het
      Koninkrijk in het buitenland, in welks ambtsgebied diens ressort gelegen is, ter zake gegeven;

      c. tot het nakomen van de voor betrokkene geldende bepalingen van dit reglement en daarop steunende regelingen;

      d. tot het nakomen van de door betrokkene afgelegde eed of belofte.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel134
  - number: '135'
    text: |-
      1 Onze Minister verbindt zich bij de benoeming van de honoraire consulaire ambtenaar die zaken ter beschikking
      te stellen, welke betrokkene voor het vervullen van diens consulaire taken en het uitoefenen van diens consulaire
      bevoegdheden behoeft. Deze zaken blijven Rijkseigendom, evenals de archieven van de desbetreffende consulaire post.

      2 Onze Minister kan de honoraire consulaire ambtenaar een tegemoetkoming toekennen in de kosten die genoemde
      taakvervulling met zich meebrengt.

      3 Bij ministeriële regeling worden regels gesteld ten aanzien van het gestelde in het eerste en tweede lid.

      4 Bij de benoeming van de honoraire consulaire ambtenaar worden aan de betrokkene de voor hem ingevolge
      [artikel 16, vierde lid][ref1], geldende bepalingen van dit reglement schriftelijk medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel16
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '16'
        hoofdstuk: III
  - number: '136'
    text: |-
      1 Honoraire consulaire ambtenaren zijn onbezoldigd; ter zake van hun benoeming worden aan hen geen kosten in
      rekening gebracht.

      2 Honoraire consulaire ambtenaren zijn niet bevoegd tot rechtshandelingen die het Koninkrijk verplichten, tenzij:

      a. Nederlandse wetten of besluiten hen daartoe bevoegd verklaren;

      b. zij daartoe op grond van aan hen gegeven aanwijzingen, bedoeld in [artikel 134, onder ][ref1], zijn gemachtigd
      of gehouden; dan wel

      c. zij daartoe tevoren door Onze Minister, dan wel door het hoofd van de vertegenwoordiging van het Koninkrijk in
      het buitenland in welks ambtsgebied hun consulair ressort gelegen is, zijn gemachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel134
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '134'
        hoofdstuk: XIX
  - number: '137'
    text: |-
      Aan een honoraire consulaire ambtenaar kan door Onze Minister, dan wel door het hoofd van de vertegenwoordiging van
      het Koninkrijk in het buitenland, in welks ambtsgebied het ressort van die honoraire consulaire ambtenaar gelegen
      is, verlof worden verleend, waarbij tevens wordt geregeld op welke wijze tijdens het verlof in de vervulling van de
      consulaire taken en het uitoefenen van de consulaire bevoegdheden wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel137
  - number: '138'
    text: |-
      1 Zo spoedig mogelijk na diens benoeming legt de honoraire consulaire ambtenaar ten overstaan van het hoofd van
      een vertegenwoordiging van het Koninkrijk in het buitenland in welks ambtsgebied diens ressort gelegen is, de
      navolgende eed of belofte af:

      "Ik zweer/beloof trouw aan de Koning, aan de Grondwet en aan de overige wetten van het Rijk.

      Ik zweer/verklaar dat ik tot het verkrijgen van mijn aanstelling aan niemand iets heb gegeven of beloofd, noch zal
      geven of beloven.

      Ik zweer/beloof dat ik om iets in mijn functie als honorair consulair ambtenaar behorende tot de Dienst
      Buitenlandse Zaken te doen of te laten van niemand enige belofte of geschenk zal aannemen.

      Ik zweer/beloof dat ik de mij opgedragen taken zal vervullen overeenkomstig de Nederlandse wetten en besluiten en
      de overige voorschriften en aanwijzingen, mij gegeven of te geven, en dat ik de belangen van het Koninkrijk der
      Nederlanden zal voorstaan en bevorderen.

      Ik zweer/beloof dat ik de zaken waarvan ik bij het vervullen van mijn consulaire taken kennis neem en waarvan ik
      het geheim of vertrouwelijk karakter moet begrijpen, niet zal openbaren aan anderen dan aan hen, aan wie ik volgens
      de wet of uit hoofde van mijn taakvervulling tot mededeling verplicht ben.

      Zo waarlijk helpe mij God Almachtig!

      (Dat verklaar en beloof ik)."

      2 Indien de honoraire consulaire ambtenaar niet in het bezit is van de Nederlandse nationaliteit, blijft de eerste
      zin van de eed of belofte achterwege.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel138
  - number: '139'
    text: |-
      Onze Minister kan [artikel 130, eerste en tweede lid][ref1], overeenkomstig toepassen ten aanzien van honoraire
      consulaire ambtenaren en hun nagelaten gezinsleden, waarbij hij rekening houdt met hun financiële omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel130
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '130'
        hoofdstuk: XVIII
        paragraaf: '2'
  - number: '140'
    text: |-
      1 In bijzondere gevallen kan het hoofd van een vertegenwoordiging van het Koninkrijk in het buitenland met
      machtiging van Onze Minister bij die vertegenwoordiging van het Koninkrijk in het buitenland een persoon van
      Nederlandse nationaliteit tot honorair adviseur benoemen en ontslaan.

      2 Binnen het kader van zijn advieswerkzaamheden behoort de honoraire adviseur tot de DBZ.

      3 Honoraire adviseurs genieten geen bezoldiging; bij hun benoeming worden de duur en de inhoud van hun
      advieswerkzaamheden geregeld, alsmede hun rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel140
  - number: '141'
    text: |-
      1 Aan degenen die ingevolge het [tweede, vierde of zesde lid van artikel 8][ref1] bij een vertegenwoordiging van
      het Koninkrijk in het buitenland werkzaam zijn, kan in overeenstemming met de door hen beklede functies een titel
      worden toegekend, met inachtneming van het tweede tot en met zesde lid.

      2 De in het eerste lid bedoelde titel kan zijn:

      a. Buitengewoon en Gevolmachtigd Ambassadeur

      b. Buitengewoon Gezant en Gevolmachtigd Minister

      c. Zaakgelastigde

      d. Gevolmachtigd Minister

      e. Ambassaderaad, Gezantschapsraad, Handelsraad, dan wel Raad

      f. Eerste Ambassadesecretaris, Gezantschapssecretaris, Handelssecretaris, dan wel Eerste Secretaris

      g. Tweede Ambassadesecretaris, Gezantschapssecretaris, Handelssecretaris, dan wel Tweede Secretaris

      h. Derde Ambassadesecretaris, Gezantschapssecretaris, Handelssecretaris, dan wel Derde Secretaris

      i. Consul-Generaal

      j. Consul

      k. Vice-Consul

      l. Adjunct Vice-Consul

      m. Attaché

      n. Adjunct-Attaché

      o. Directeur der Kanselarij der Eerste Klasse

      p. Directeur der Kanselarij

      q. Kanselier der Eerste Klasse, dan wel

      r. Kanselier der Tweede Klasse.

      3 Aan degenen die ingevolge het [derde of vijfde lid van artikel 8][ref2] bij een vertegenwoordiging van het
      Koninkrijk in het buitenland werkzaam zijn kan in overeenstemming met de door hen beklede functies één van de in
      het tweede lid, onder *e* tot en met *h* en *j* tot en met *n*, genoemde titels worden toegekend, voorafgegaan of
      gevolgd door een aanduiding van hun specialisatie.

      4 Aan een honoraire consulaire ambtenaar kan de titel Consul-Generaal, Consul, dan wel Vice-Consul worden
      toegekend.

      5 Indien de functie dat in verband met de in het buitenland te vervullen ambtsbezigheden vereist, wordt aan een
      hier te lande geplaatste of benoemde ambtenaar de titel Ambassadeur toegekend.

      6 De titels van hoofden van vertegenwoordigingen van het Koninkrijk in het buitenland - met uitzondering van de
      titel Zaakgelastigde - en van degenen genoemd in het vijfde lid worden bij koninklijk besluit toegekend; de titel
      Zaakgelastigde en alle overige titels door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
