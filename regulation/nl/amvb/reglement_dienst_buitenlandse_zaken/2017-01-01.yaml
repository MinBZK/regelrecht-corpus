  - number: 50b
    text: |-
      1 In geval van een geschil over het wel of niet bestaan van ongeschiktheid tot werken wegens ziekte voorziet
      [artikel 32, eerste lid, van de Wet SUWI][ref1] in het instellen van een onderzoek en het geven van een oordeel.

      2 Het medisch advies dat door de deskundige persoon of de arbodienst wordt uitgebracht naar aanleiding van
      een arbeidsgezondheidskundig onderzoek als bedoeld in [artikel 18 van de Arbeidsomstandighedenwet][ref2] en
      [artikel 50a][ref3], wordt zo spoedig mogelijk aan de ambtenaar en Onze Minister medegedeeld.

      3 De ambtenaar of de gewezen ambtenaar kan de deskundige persoon of de arbodienst binnen drie dagen na ontvangst
      van het in het tweede lid bedoelde medisch advies, schriftelijk een hernieuwd onderzoek vragen indien hij het
      niet eens is met het medisch advies. De deskundige persoon of de arbodienst stelt Onze Minister in kennis van een
      ingediend verzoek om een hernieuwd onderzoek.

      4 Zo spoedig mogelijk na ontvangst van het schriftelijk verzoek om een hernieuwd onderzoek, maar uiterlijk binnen
      vier weken, vindt het hernieuwd onderzoek door een commissie van drie geneeskundigen plaats.

      5 Op verzoek van de ambtenaar of de gewezen ambtenaar wordt zijn behandelend arts in de gelegenheid gesteld
      mondeling of schriftelijk zijn mening aan de commissie kenbaar te maken.

      6 De leden van de commissie worden per verzoek om een hernieuwd onderzoek aangewezen. De geneeskundige die het
      medisch advies heeft uitgebracht waarvan herziening wordt gevraagd, heeft in de commissie geen zitting.

      7 De commissie deelt haar oordeel schriftelijk mee aan:

      a. de ambtenaar of de gewezen ambtenaar;

      b. Onze Minister;

      c. de behandelend arts, bedoeld in het vijfde lid.

      8 De kosten, verbonden aan het onderzoek, bedoeld in het eerste lid, respectievelijk, het hernieuwd onderzoek,
      bedoeld in het derde lid, komen voor rekening van Onze Minister. Eventuele reis- en verblijfkosten van de ambtenaar
      worden hem vergoed volgens de geldende regels ter zake van dienstreizen.


