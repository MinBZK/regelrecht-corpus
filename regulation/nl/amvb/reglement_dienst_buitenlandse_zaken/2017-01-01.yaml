  - number: '90'
    text: |-
      De ambtenaar dient van de ontvangst van een besluit inzake strafoplegging te doen blijken door onverwijlde
      terugzending van een door hem ondertekend en gedateerd ontvangstbewijs.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel90
  - number: '91'
    text: |-
      De straf, behalve die van schriftelijke berisping, wordt niet ten uitvoer gelegd, zolang zij niet onherroepelijk is
      geworden, tenzij bij de strafoplegging onmiddellijke tenuitvoerlegging is bevolen.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel91
  - number: '92'
    text: |-
      De ambtenaar is van rechtswege in zijn ambt geschorst, wanneer hij krachtens een Nederlandse wettelijke maatregel
      van zijn vrijheid is beroofd, tenzij de vrijheidsbeneming het gevolg is van een maatregel, anders dan op grond van
      de [Wet bijzondere opneming in psychiatrische ziekenhuizen][ref1], genomen in het belang van de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005700
