  - number: '44'
    text: |-
      1 Behoudens in dringende gevallen moet buitengewoon verlof van korte duur ten minste 24 uren tevoren schriftelijk
      of mondeling worden aangevraagd.

      2 Indien de ambtenaar, die niet vooraf een verzoek om buitengewoon verlof van korte duur heeft ingediend, aantoont
      dat hij daartoe geen gelegenheid heeft gehad, terwijl er voor zijn afwezigheid gegronde redenen bestonden, wordt
      deze afwezigheid beschouwd als buitengewoon verlof met behoud van bezoldiging.

      3 Een gegronde reden als bedoeld in het tweede lid is slechts aanwezig:

      a. indien een omstandigheid als genoemd in de [artikelen 43a tot en met 43f][ref1] aanwezig is geweest, op grond
      waarvan aan de ambtenaar op zijn verzoek buitengewoon verlof wordt verleend, zulks met inachtneming van de daarbij
      vermelde voorwaarden en termijnen;

      b. in alle andere gevallen, indien de ambtenaar, alle omstandigheden in aanmerking genomen, redelijkerwijze de
      dienst mocht verzuimen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel43a
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel44
