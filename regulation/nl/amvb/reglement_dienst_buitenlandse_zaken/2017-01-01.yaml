  - number: '147'
    text: |-
      1 Bezwaarschriften tegen een besluit tot plaatsing, ter beschikking houden of wijziging van een plaatsingsduur van
      de indiener van het bezwaarschrift worden door de Commissie van Bezwaar versneld behandeld, met inachtneming van
      het navolgende:

      a. indien Onze Minister de in [artikel 27, vijfde lid][ref1], genoemde termijn in acht heeft genomen, adviseert
      de Commissie van Bezwaar binnen twee weken na ontvangst van het bezwaarschrift; Onze Minister kan, indien het
      dienstbelang zich daartegen niet verzet, de genoemde termijn van twee weken verlengen;

      b. indien Onze Minister de in [artikel 27, vijfde lid][ref2], genoemde termijn spoedshalve niet in acht heeft
      genomen, adviseert de Commissie van Bezwaar zo spoedig mogelijk na ontvangst van het bezwaarschrift, en wel op een
      zodanig korte termijn dat Onze Minister in staat is na ontvangst van het advies het bestreden besluit in voorkomend
      geval in te trekken dan wel te wijzigen.

      2 Het bezwaar schorst de werking van het besluit totdat Onze Minister op het bezwaarschrift heeft beslist,
      indien het bezwaarschrift binnen twee weken na de dag waarop het op de voorgeschreven wijze is bekendgemaakt, is
      ingediend, dit bezwaarschrift voldoet aan de in [artikel 6:5 van de Algemene wet bestuursrecht][ref3] gestelde
      vereisten en het besluit nog niet ten uitvoer is gelegd.

      3 Bij deze bezwaarschriftprocedures kan door Onze Minister en de buiten Nederland geplaatste, bezwaar makende
      ambtenaar, alsmede door de Commissie van Bezwaar en de daaraan toegevoegde secretarissen, spoedshalve gebruik
      worden gemaakt van de telecommunicatiemiddelen van het Ministerie van Buitenlandse Zaken, onder onverwijlde
      nazending van schriftelijke bevestigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel65
