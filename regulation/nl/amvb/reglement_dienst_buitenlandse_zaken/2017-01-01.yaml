  - number: 54g
    text: |-
      1 Onze Minister zal zo tijdig mogelijk zodanige maatregelen treffen en voorschriften geven als redelijkerwijs
      nodig is, opdat de ambtenaar, die in verband met ongeschiktheid ten gevolge van ziekte verhinderd is zijn arbeid te
      verrichten, in staat wordt gesteld de eigen of andere passende arbeid te verrichten.

      2 De maatregelen en voorschriften, bedoeld in het eerste lid, zijn gericht op duurzame reïntegratie in de eigen
      arbeid of in andere passende arbeid in de sector Rijk waarvan de voor die arbeid geldende salarisschaal niet meer
      dan twee schalen lager is dan de salarisschaal die voor de ambtenaar geldt en waarbij de resterende mogelijkheden
      van de ambtenaar volledig worden benut. Indien na overleg tussen Onze Minister en de ambtenaar vaststaat dat
      dergelijke arbeid niet voorhanden is, zullen de maatregelen en voorschriften zich richten op duurzame reïntegratie
      in andere passende arbeid, zo mogelijk binnen een van de overheidssectoren.

      3 Zolang duurzame reïntegratie als bedoeld in het tweede lid niet mogelijk is, stelt Onze Minister de ambtenaar in
      de gelegenheid andere passende arbeid te verrichten.

      4 In overeenstemming met de ambtenaar stelt Onze Minister een plan van aanpak op als bedoeld in
      [artikel 25, tweede lid, van de WIA][ref1]. Het plan van aanpak wordt met medewerking van de ambtenaar regelmatig
      geëvalueerd en zo nodig bijgesteld.

      5 De ambtenaar die van mening is dat Onze Minister de in het eerste lid bedoelde verplichtingen niet of
      onvoldoende nakomt, legt bij zijn verzoek tot nakoming aan Onze Minister een oordeel van het UWV als bedoeld in
      [artikel 32, derde lid, onderdeel b, van de Wet SUWI][ref2] over. Onze Minister beslist binnen zes weken op het
      verzoek en deelt daarbij mee tot welke aanpassingen in de reïntegratie-inspanningen het verzoek hem aanleiding
      geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel54g
