    text: |-
      1 Aan een ambtenaar die buiten Nederland in samenhang met diens functie onwettig wordt gegijzeld of anderszins
      buiten Nederland onwettig van de vrijheid wordt beroofd op een wijze die door Onze Minister met gijzeling gelijk
      wordt gesteld, wordt na afloop daarvan, onverminderd de mogelijkheid van bedrijfsgeneeskundige begeleiding
      ingevolge de bepalingen van [hoofdstuk X][ref1], naar billijkheid recuperatieverlof verleend met behoud van
      bezoldiging.

      2 Indien het in het eerste lid genoemde recuperatieverlof wordt verleend, wordt aan de ambtenaar een recuperatie-
      uitkering toegekend. Deze uitkering verhoudt zich tot de jaarlijkse vakantie-uitkering als de duur van het
      recuperatieverlof zich verhoudt tot de duur van de jaarlijkse vakantie.

      3 Indien een gezinslid van een ambtenaar buiten Nederland onwettig wordt gegijzeld of anderszins buiten Nederland
      onwettig van de vrijheid wordt beroofd op een wijze die door Onze Minister met gijzeling wordt gelijkgesteld,
      en samenhang bestaat met de functie van de ambtenaar, wordt aan die ambtenaar na afloop daarvan, onverminderd de
      mogelijkheid van geneeskundige begeleiding van dat gezinslid ingevolge de bepalingen van [hoofdstuk X][ref2], naar
      billijkheid recuperatieverlof verleend en een recuperatie-uitkering toegekend overeenkomstig het eerste en tweede
      lid.

      4 In bijzondere gevallen kunnen bij onwettige vrijheidsberovingen als bedoeld in het eerste en derde lid ook kosten
      van gezinshereniging en andere in samenhang met de onwettige vrijheidsberoving gemaakte kosten of schade worden
      vergoed voor zover deze redelijk zijn en als niet verzekerbaar kunnen worden beschouwd. Voor het vrijkopen van
      personen betaalde losprijzen worden nimmer vergoed.

      5 De in het eerste tot en met vierde lid genoemde voorzieningen gelden uitsluitend voor zover de ambtenaar
      aanspraken op vergoeding en verhaal aan het Rijk heeft gecedeerd.


