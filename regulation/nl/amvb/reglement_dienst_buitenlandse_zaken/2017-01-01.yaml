  - number: 23a
    text: |-
      Bij wijziging van omstandigheden, zoals bij omzetting van een tijdelijke in een vaste aanstelling of bij
      plaatsing of tijdelijke tewerkstelling in een andere functie, niet zijnde een vertrouwensfunctie als bedoeld
      in [artikel 1, eerste lid, onder a, van de Wet veiligheidsonderzoeken][ref1], kan een verklaring omtrent het
      gedrag verlangd worden of, indien het een functie betreft die bijzondere eisen stelt aan de integriteit of
      verantwoordelijkheid van de betrokkene, kan om justitiële gegevens worden verzocht, indien de wijziging van
      omstandigheden zodanig is dat dat nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel1
