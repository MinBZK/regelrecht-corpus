  - number: '38'
    text: |-
      1 De gemiddelde wekelijkse werktijd van een ambtenaar van 57 jaar en ouder die daartoe een aanvraag heeft
      ingediend, wordt, met behoud van zijn arbeidsduur, teruggebracht met 15,8%, tenzij het dienstbelang zich daartegen
      verzet. De ambtenaar voor wie de arbeidsduur op meer dan gemiddeld 36 uur is vastgesteld, kan een aanvraag als
      bedoeld in de eerste volzin eerst indienen nadat op zijn aanvraag zijn arbeidsduur is vastgesteld op ten hoogste
      gemiddeld 36 uur.

      2 De in het eerste lid bedoelde ambtenaar dient op het moment van de vermindering van de werktijd ten minste vijf
      aaneengesloten jaren in dienst te zijn van het Rijk.

      3 Voor de uren die het wekelijkse verschil vormen tussen de in het eerste lid bedoelde arbeidsduur en de
      teruggebrachte werktijd wordt de ambtenaar geacht met verlof te zijn.

      4 Op het salaris van de in het eerste lid bedoelde ambtenaar wordt een inhouding toegepast. De hoogte van
      deze inhouding is afhankelijk van de leeftijd op de datum dat de werktijdvermindering op grond van dit artikel
      ingaat en bedraagt een percentage volgens onderstaande tabel van het salaris dat voor hem zou gelden zonder
      werktijdvermindering op grond van dit artikel, nadat dit salaris is verminderd met een eventuele inhouding als
      bedoeld in [artikel 35][ref1]:








                    Leeftijd


                    Inhouding in procenten






                    57


                    5




                    58


                    5




                    59


                    3,5




                    60


                    3,5




                    61


                    2




                    62


                    2




                    63


                    1




                    64


                    1






      5 De inhouding, bedoeld in het vierde lid, wordt teruggebracht tot 70% voor zover op grond van
      [artikel 54, eerste lid][ref2], niet meer dan 70% van de bezoldiging wordt doorbetaald.

      6 Door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties gestelde regels omtrent de verrekening van
      extra inkomsten uit arbeid of bedrijf met het salaris van de in het eerste lid bedoelde ambtenaar zijn van
      overeenkomstige toepassing.

      7 Gedurende plaatsing buiten Nederland is het eerste tot en met zesde lid niet van toepassing, tenzij Onze Minister
      in bijzondere gevallen anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel54
