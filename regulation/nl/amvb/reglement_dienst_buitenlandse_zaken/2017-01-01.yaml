  - number: 23b
    text: |-
      1 De kosten van het geneeskundig onderzoek en het hernieuwd geneeskundig onderzoek komen voor rekening
      van het Rijk. Hier te lande daartoe gemaakte reis- en verblijfkosten worden vergoed op de voet van het
      [Reisbesluit binnenland][ref1]. Buitenslands gemaakte reis- en verblijfkosten komen voor vergoeding in aanmerking
      voor zover daartoe vooraf door het bevoegd gezag is besloten.

      2 De uitslag van het geneeskundig onderzoek wordt uiterlijk binnen twee weken na vaststelling aan de betrokkene
      medegedeeld.

      3 De betrokkene kan binnen twee weken nadat hem de uitslag van het geneeskundig onderzoek is meegedeeld, een
      hernieuwd geneeskundig onderzoek aanvragen.

      4 Door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties gestelde nadere regels omtrent het hernieuwd
      geneeskundig onderzoek zijn van overeenkomstige toepassing. Dit hernieuwd geneeskundig onderzoek mag niet worden
      verricht door de arts die het geneeskundig onderzoek heeft verricht.

      5 Bij wijziging van een tijdelijke in een vaste aanstelling vindt niet opnieuw een geneeskundig onderzoek plaats,
      tenzij ten aanzien van de geschiktheid van de betrokkene ernstige twijfel is gerezen.

      6 De betrokkene die op grond van [artikel 23, vierde lid, onderdeel b][ref2], is onderworpen aan een geneeskundig
      onderzoek, wordt bij plaatsing in een andere functie opnieuw aan een onderzoek naar de medische geschiktheid
      onderworpen indien betrokkene voor het vervullen van die functie aan andere medische eisen dient te voldoen dan
      voor de tot dusverre vervulde functie.

      7 a. Gezinsleden van de in [artikel 23, vierde lid, onder b, ten 2°][ref3], bedoelde ambtenaar die in tijdelijke
      dienst is aangesteld om tijdelijk werkzaam te zijn bij een vertegenwoordiging van het Koninkrijk in het buitenland,
      worden, mede vanwege het bepaalde in [artikel 36, vierde lid][ref4], in de gelegenheid gesteld, door middel van een
      geneeskundig onderzoek inzicht te verwerven in hun geschiktheid tot verblijf in het desbetreffende land.

      b. Gezinsleden van de in [artikel 23, vierde lid, onder b, ten 3°][ref5], bedoelde ambtenaar worden, mede vanwege
      het bepaalde in [artikel 36, vierde lid][ref6], in de gelegenheid gesteld, door middel van een geneeskundig
      onderzoek inzicht te verwerven in hun geschiktheid tot verblijf waar ook ter wereld.

      c. Op de onderdelen a en b is het eerste tot en met vierde lid van overeenkomstige toepassing.


