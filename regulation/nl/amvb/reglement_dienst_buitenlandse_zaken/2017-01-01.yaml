  - number: '113'
    text: |-
      1 Bij vermissing van de ambtenaar vinden, behoudens het bepaalde in het tweede lid, de bepalingen van de
      [artikelen 108 tot en met 112][ref1] overeenkomstige toepassing. De ambtenaar wordt daarbij geacht te zijn
      overleden op een door Onze Minister te bepalen dag.

      2 Het [derde lid van artikel 108][ref2] vindt geen toepassing indien gegronde vermoedens bestaan, dat de vermissing
      het gevolg is van ongeoorloofde afwezigheid.

      3 Indien blijkt dat de als vermist beschouwde ambtenaar in leven is, kan ter beoordeling van Onze Minister, de
      bezoldiging alsnog worden uitbetaald, tenzij gegronde vermoedens bestaan, dat de vermissing het gevolg was van
      ongeoorloofde afwezigheid.

      4 Indien uit hoofde van de vermissing van de ambtenaar pensioen of enige andere uitkering, voortvloeiende uit
      zijn ambtelijke rechtspositieregeling, is toegekend over het tijdvak waarover naar het oordeel van Onze Minister
      aanspraak bestaat op bezoldiging, wordt die bezoldiging verminderd met de over dat tijdvak aldus uitbetaalde
      bedragen.

      5 De bezoldiging, waarop de ambtenaar ingevolge het derde en het vierde lid aanspraak heeft, kan aan anderen dan de
      ambtenaar worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel108
