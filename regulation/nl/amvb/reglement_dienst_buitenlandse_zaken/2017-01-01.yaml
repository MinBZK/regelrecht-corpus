  - number: '22'
    text: |-
      1 De aanstelling van de ambtenaar vindt plaats door Onze minister.

      2 De aanstelling in de functie van secretaris-generaal of directeur-generaal bij het ministerie van Buitenlandse
      Zaken vindt plaats bij Koninklijk Besluit, op de voordracht van Onze minister.
