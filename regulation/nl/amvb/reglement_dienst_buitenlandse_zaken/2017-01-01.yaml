  - number: '88'
    text: |-
      1 Indien de ambtenaar verantwoording aflegt doet hij dit ten overstaan van het gezag dat tot de voorgenomen
      strafoplegging bevoegd is, of van een door dit gezag aangewezen autoriteit, tenzij bij koninklijk besluit anders
      wordt bepaald. Indien deze bevoegdheid bij Ons berust, geschiedt de verantwoording ten overstaan van Onze Minister
      of van een door deze aangewezen autoriteit. Het gezag, ten overstaan waarvan de verantwoording zal plaatsvinden,
      bepaalt of deze mondeling of schriftelijk zal geschieden, met dien verstande dat bij schriftelijke verantwoording
      de ambtenaar op zijn verzoek gelegenheid wordt gegeven tot nadere mondelinge toelichting.

      2 Van de mondelinge verantwoording en van een eventuele nadere mondelinge toelichting wordt zo spoedig mogelijk
      proces-verbaal opgemaakt, dat na kennisneming wordt getekend door hem, ten overstaan van wie de verantwoording
      heeft plaatsgevonden, en door de ambtenaar. Weigert de ambtenaar de ondertekening, dan wordt daarvan in het proces-
      verbaal, zo mogelijk met vermelding van de redenen, melding gemaakt. Een afschrift van het proces-verbaal wordt aan
      de ambtenaar uitgereikt.
    url: https://wetten.overheid.nl/BWBR0004052/2017-01-01#Artikel88
  - number: '89'
    text: |-
      De ambtenaar kan slechts gestraft worden wegens overtreding van
      [artikel 125a, eerste lid, van de Ambtenarenwet][ref1], nadat daarover advies is ingewonnen van de Adviescommissie
      grondrechten en functieuitoefening ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125a
