  - number: 149g
    text: |-
      1 De ambtenaar, bedoeld in [artikel 66, eerste lid][ref1], die voor de datum van inwerkingtreding van het
      Besluit van 26 november 2013 tot wijziging van het Algemeen Rijksambtenarenreglement, het Ambtenarenreglement
      Staten-Generaal en het Reglement Dienst Buitenlandse Zaken in verband met de harmonisatie van enkele secundaire
      arbeidsvoorwaarden Rijk en het herstel van enkele technische omissies (Stb. 2013, nr. 489) is aangewezen om tevens
      werkzaam te zijn als bedrijfshulpverlener, ontvangt eenmalig een compensatievergoeding.

      2 De compensatievergoeding, bedoeld in het eerste lid, bedraagt tweemaal het positieve verschil tussen de
      vergoeding, bedoeld in [artikel 66, eerste lid][ref2], op jaarbasis van het jaar voor inwerkingtreding en de
      vergoeding op jaarbasis van het jaar na inwerkingtreding van genoemd besluit.

      3 Indien de ambtenaar op het moment van inwerkingtreding van genoemd besluit, korter dan één jaar als
      bedrijfshulpverlener is aangewezen, wordt het verschil, bedoeld in het tweede lid, vermenigvuldigd met de breuk van
      het aantal maanden dat hij is aangewezen als bedrijfshulpverlener in de teller en twaalf in de noemer.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel66
