  - number: '121.1'
    text: |-
      Bij ministeriële regeling wordt een regeling vastgesteld ter nadere bepaling van de rechtspositie van plaatselijk
      indienstgenomen werknemers.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel121
  - number: '121.2'
    text: |-
      Onze Minister kan in de in het eerste lid bedoelde regeling bepalen, welke onderwerpen, en met inachtneming van
      welke voorwaarden, namens hem nader dienen te worden geregeld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel121
  - number: '122'
    text: |-
      De in [artikel 121][ref1] bedoelde nadere regeling betreft in elk geval de volgende onderwerpen:


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel121
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '121'
        hoofdstuk: XVIII
        paragraaf: '2'
  - number: 122.a
    text: indienstneming voor bepaalde of onbepaalde tijd, al dan niet met een proeftijd;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.b
    text: geneeskundige keuring bij indienstneming;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.c
    text: een functie-indelingsschema, naar werksoort en functieniveau;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.d
    text: een stelsel van loonschalen, met de maximale, minimale en tussengelegen loonnummers;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.e
    text: de toekenning van een loonschaal, en de toekenning van een loonnummer;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.f
    text: vaststelling en uitbetaling van het loon;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.g
    text: vervallen van het recht op loon;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.h
    text: betaling van loon tijdens ziekte;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.i
    text: aanspraak op loon wegens ziekte na beëindiging van de dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.j
    text: opdragen van overwerk, en vergoeding van de desbetreffende arbeidsuren;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.k
    text: de muntsoort, of de muntsoorten, waarin lonen en andere bedragen aan de werknemer worden uitbetaald;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.l
    text: dienst- en werktijden;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.m
    text: vakantie en verlof;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.n
    text: bedrijfsgeneeskundige begeleiding;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.o
    text: tegemoetkoming in ziektekosten;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.p
    text: aanspraken bij overlijden;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.q
    text: zwangerschaps- en bevallingsverlof;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.r
    text: opzegging tijdens zwangerschap;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.s
    text: plichtsverzuim en disciplinaire straffen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.t
    text: het verstrekken van een opdracht tot het volgen van opleidingen, alsmede het verlenen van studiefaciliteiten;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.u
    text: einde, beëindiging en opzegging van de arbeidsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.v
    text: uitkering bij beëindiging van de dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.w
    text: uitreiking van een getuigschrift;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.x
    text: vergoeding van reis- en verblijfkosten bij dienstreizen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.y
    text: algemene verplichtingen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.z
    text: functioneringsgesprekken en beoordelingen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.aa
    text: bijzondere beloningen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: 122.bb
    text: |-
      bekendstelling van regelingen waarin de rechtspositie van de werknemer is neergelegd, alsmede van wijzigingen
      daarin.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel122
  - number: '123.1'
    text: |-
      Onze Minister draagt er zorg voor dat voor elke vertegenwoordiging van het Koninkrijk in het buitenland het
      bepaalde in of krachtens dit hoofdstuk wordt uitgewerkt in een nadere regeling, zodanig dat het geheel van
      arbeidsvoorwaarden en daarmee verbandhoudende voorzieningen voldoet aan de eisen van de plaatselijke arbeidsmarkt
      en naar het oordeel van Onze Minister als toereikend kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel123
  - number: '123.2'
    text: |-
      Bij ministeriële regeling worden regelen vastgesteld betreffende de wijze waarop de in het eerste lid bedoelde
      uitwerkingen tot stand komen en de voorwaarden die daarbij in acht genomen dienen te worden. Deze regelen worden
      vastgesteld na overleg met de Bijzondere Commissie, genoemd in [artikel 142][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel142
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '142'
        hoofdstuk: XXII
  - number: '124'
    text: |-
      Het bepaalde in of krachtens de [artikelen 119 tot en met 122][ref1] is slechts van toepassing respectievelijk
      van overeenkomstige toepassing voor zover dat niet strijdig is met dwingende bepalingen van plaatselijk geldend
      arbeidsrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel119
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '119'
        hoofdstuk: XVIII
        paragraaf: '2'
  - number: '125.1'
    text: Het loon van de werknemer wordt vastgesteld overeenkomstig het plaatselijk loonpeil.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel125
  - number: '125.2'
    text: Onze Minister kan in plaats van een brutoloon een nettoloon toekennen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel125
  - number: '127'
    text: |-
      Bij beëindiging van de dienstbetrekking, wordt aan de betrokkene een uitkering toegekend overeenkomstig het
      plaatselijk geldend arbeidsrecht dan wel de plaatselijk geldende gebruiken onverminderd
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel127
  - number: 127.a
    text: |-
      de mogelijkheid van uitkeringen op de voet van de in de [artikelen 128][ref1] en [129][ref2] genoemde regelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel129
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '128'
        hoofdstuk: XVIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '129'
        hoofdstuk: XVIII
        paragraaf: '2'
  - number: 127.b
    text: |-
      de mogelijkheid van onderstand bij wijze van pensioen op de voet van [artikel 130][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel130
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '130'
        hoofdstuk: XVIII
        paragraaf: '2'
  - number: '128.1'
    text: |-
      Indien ten behoeve van werknemers verplichtingen bestaan tot deelname aan al dan niet plaatselijke
      oudedagsvoorzieningen, sociale verzekeringen of andere sociale voorzieningen, worden deze werknemers daarvoor
      aangemeld door het hoofd van de desbetreffende vertegenwoordiging van het Koninkrijk in het buitenland.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel128
  - number: '128.2'
    text: |-
      Indien geen verplichtingen, bedoeld in het eerste lid, bestaan, doch naar het oordeel van Onze Minister passende
      mogelijkheden bestaan, is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel128
  - number: '129'
    text: |-
      Indien de in [artikel 128][ref1] bedoelde voorzieningen of regelingen ontbreken, de desbetreffende werknemer
      daarvoor niet kan worden aangemeld, of deze voorzieningen of regelingen door Onze Minister in hun gevolg
      ontoereikend worden geacht, kan bij het sluiten van de arbeidsovereenkomst worden overeengekomen dat aan de
      betrokken werknemer een deel van de premie wordt vergoed van een door die werknemer af te sluiten verzekering,
      welke voorziet in de opbouw van een oudedagvoorziening en een dekking van de risico’s van invaliditeit en
      overlijden. Zulks wordt alsdan in of bij de arbeidsovereenkomst vermeld, waarbij de bij overlijden begunstigde
      gezinsleden worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel128
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '128'
        hoofdstuk: XVIII
        paragraaf: '2'
  - number: '130.1'
    text: |-
      De werknemer op wie geen voorzieningen, regelingen dan wel verzekeringen als bedoeld in de [artikelen 128][ref1] en
      [129][ref2] van toepassing zijn, kan ten behoeve van zichzelf dan wel voor zijn nagelaten gezinsleden in aanmerking
      worden gebracht voor een onderstand bij wijze van pensioen bij ontslag wegens het bereiken van de voor betrokkene
      geldende pensioengerechtigde leeftijd, invaliditeit, dan wel overlijden.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel129
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '128'
        hoofdstuk: XVIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '129'
        hoofdstuk: XVIII
        paragraaf: '2'
  - number: '130.2'
    text: |-
      Voor de bepaling van grootte en duur van de onderstand beziet Onze Minister welke regelingen in het desbetreffende
      land gebruikelijk zijn, en past deze zoveel mogelijk naar analogie toe.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel130
  - number: '130.3'
    text: |-
      Aanvullende onderstand bij wijze van pensioen kan door Onze Minister worden toegekend indien deze van oordeel is,
      dat de voorzieningen, regelingen dan wel verzekeringen als bedoeld in de [artikelen 128][ref1] en [129][ref2],
      niet leiden tot een geheel van voorzieningen dat, mede gelet op de duur van het dienstverband alsmede de oorzaak
      en het tijdstip van ontslag, de invaliditeit of het overlijden, passend is te achten, met dien verstande dat geen
      aanvullende onderstand wordt verstrekt ingeval verzekeringspremies zijn vergoed, maar niet voor verzekering zijn
      aangewend. Indien overlijden of invaliditeit het rechtstreeks gevolg is van de uitoefening van de dienst buiten
      eigen schuld of onvoorzichtigheid, wordt de duur van het dienstverband fictief bepaald op de periode, gelegen
      tussen diens indiensttreding en de datum waarop de betrokkene de pensioengerechtigde leeftijd zou hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel129
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '128'
        hoofdstuk: XVIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '129'
        hoofdstuk: XVIII
        paragraaf: '2'
  - number: '130.4'
    text: |-
      Het hoofd van een vertegenwoordiging van het Koninkrijk in het buitenland ziet erop toe dat in voorkomende
      gevallen de onderstand bij wijze van pensioen tijdig wordt aangevraagd, en adviseert Onze Minister desgevraagd met
      betrekking tot grootte en duur ervan.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel130
  - number: '131'
    text: |-
      Bij ministeriële regeling worden voor de toepassing van de [artikelen 127 tot en met 130][ref1] nadere regelen
      vastgesteld; [artikel 121, tweede lid][ref2], is daarbij van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel121
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '127'
        hoofdstuk: XVIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '121'
        hoofdstuk: XVIII
        paragraaf: '2'
  - number: '132.1'
    text: |-
      Voor het vervullen van consulaire taken en het uitoefenen van consulaire bevoegdheden bij vertegenwoordigingen van
      het Koninkrijk in het buitenland kunnen bij koninklijk besluit, indien de benoeming bij koninklijk besluit dient
      te geschieden, dan wel door Onze Minister daartoe geschikt en bekwaam geachte personen als honorair consulair
      ambtenaar worden benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel132
  - number: '132.2'
    text: |-
      De in het eerste lid bedoelde personen zijn, binnen het kader van de door hen te vervullen consulaire taken en uit
      te oefenen consulaire bevoegdheden, ambtenaar en behoren als zodanig tot de DBZ.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel132
  - number: '133.1'
    text: |-
      De benoeming tot honorair consulair ambtenaar geschiedt voor onbepaalde tijd tot wederopzegging, waarbij zowel door
      het tot benoemen bevoegd gezag, als door de honoraire consulaire ambtenaar een opzeggingstermijn van drie maanden
      in acht genomen wordt.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel133
  - number: '133.2'
    text: |-
      Wanneer het belang van de dienst zulks bepaaldelijk vordert, kan de honoraire consulaire ambtenaar in afwachting
      van diens ontslag, door Onze Minister met directe ingang worden geschorst.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel133
  - number: '133.3'
    text: |-
      Ontslag wordt door het tot benoemen bevoegd gezag verleend. Als regel heeft ontslag plaats bij het bereiken van de
      65-jarige leeftijd van de honoraire consulaire ambtenaar, met de mogelijkheid van verlenging in bijzondere gevallen
      tot uiterlijk diens 70-jarige leeftijd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel133
  - number: '134'
    text: Bij diens benoeming verbindt de honoraire consulaire ambtenaar zich
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel134
  - number: 134.a
    text: |-
      tot het vervullen van consulaire taken en het uitoefenen van consulaire bevoegdheden overeenkomstig de Nederlandse
      wetten en besluiten, ten behoeve van Nederlanders, in het daarbij aangewezen ressort;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel134
  - number: 134.b
    text: |-
      tot het opvolgen van de aanwijzingen, door Onze Minister of door het hoofd van de vertegenwoordiging van het
      Koninkrijk in het buitenland, in welks ambtsgebied diens ressort gelegen is, ter zake gegeven;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel134
  - number: 134.c
    text: tot het nakomen van de voor betrokkene geldende bepalingen van dit reglement en daarop steunende regelingen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel134
  - number: 134.d
    text: tot het nakomen van de door betrokkene afgelegde eed of belofte.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel134
  - number: '135.1'
    text: |-
      Onze Minister verbindt zich bij de benoeming van de honoraire consulaire ambtenaar die zaken ter beschikking te
      stellen, welke betrokkene voor het vervullen van diens consulaire taken en het uitoefenen van diens consulaire
      bevoegdheden behoeft. Deze zaken blijven Rijkseigendom, evenals de archieven van de desbetreffende consulaire post.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel135
  - number: '135.2'
    text: |-
      Onze Minister kan de honoraire consulaire ambtenaar een tegemoetkoming toekennen in de kosten die genoemde
      taakvervulling met zich meebrengt.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel135
  - number: '135.3'
    text: Bij ministeriële regeling worden regels gesteld ten aanzien van het gestelde in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel135
  - number: '135.4'
    text: |-
      Bij de benoeming van de honoraire consulaire ambtenaar worden aan de betrokkene de voor hem ingevolge
      [artikel 16, vierde lid][ref1], geldende bepalingen van dit reglement schriftelijk medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel16
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '16'
        hoofdstuk: III
  - number: '136.1'
    text: |-
      Honoraire consulaire ambtenaren zijn onbezoldigd; ter zake van hun benoeming worden aan hen geen kosten in rekening
      gebracht.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel136
  - number: '136.2'
    text: 'Honoraire consulaire ambtenaren zijn niet bevoegd tot rechtshandelingen die het Koninkrijk verplichten, tenzij:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel136
  - number: 136.2.a
    text: Nederlandse wetten of besluiten hen daartoe bevoegd verklaren;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel136
  - number: 136.2.b
    text: |-
      zij daartoe op grond van aan hen gegeven aanwijzingen, bedoeld in [artikel 134, onder ][ref1], zijn gemachtigd of
      gehouden; dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel134
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '134'
        hoofdstuk: XIX
  - number: 136.2.c
    text: |-
      zij daartoe tevoren door Onze Minister, dan wel door het hoofd van de vertegenwoordiging van het Koninkrijk in het
      buitenland in welks ambtsgebied hun consulair ressort gelegen is, zijn gemachtigd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel136
  - number: '137'
    text: |-
      Aan een honoraire consulaire ambtenaar kan door Onze Minister, dan wel door het hoofd van de vertegenwoordiging van
      het Koninkrijk in het buitenland, in welks ambtsgebied het ressort van die honoraire consulaire ambtenaar gelegen
      is, verlof worden verleend, waarbij tevens wordt geregeld op welke wijze tijdens het verlof in de vervulling van de
      consulaire taken en het uitoefenen van de consulaire bevoegdheden wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel137
  - number: '138.1'
    text: |-
      Zo spoedig mogelijk na diens benoeming legt de honoraire consulaire ambtenaar ten overstaan van het hoofd van
      een vertegenwoordiging van het Koninkrijk in het buitenland in welks ambtsgebied diens ressort gelegen is, de
      navolgende eed of belofte af: "Ik zweer/beloof trouw aan de Koning, aan de Grondwet en aan de overige wetten
      van het Rijk. Ik zweer/verklaar dat ik tot het verkrijgen van mijn aanstelling aan niemand iets heb gegeven of
      beloofd, noch zal geven of beloven. Ik zweer/beloof dat ik om iets in mijn functie als honorair consulair ambtenaar
      behorende tot de Dienst Buitenlandse Zaken te doen of te laten van niemand enige belofte of geschenk zal aannemen.
      Ik zweer/beloof dat ik de mij opgedragen taken zal vervullen overeenkomstig de Nederlandse wetten en besluiten en
      de overige voorschriften en aanwijzingen, mij gegeven of te geven, en dat ik de belangen van het Koninkrijk der
      Nederlanden zal voorstaan en bevorderen. Ik zweer/beloof dat ik de zaken waarvan ik bij het vervullen van mijn
      consulaire taken kennis neem en waarvan ik het geheim of vertrouwelijk karakter moet begrijpen, niet zal openbaren
      aan anderen dan aan hen, aan wie ik volgens de wet of uit hoofde van mijn taakvervulling tot mededeling verplicht
      ben. Zo waarlijk helpe mij God Almachtig! (Dat verklaar en beloof ik)."
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel138
  - number: '138.2'
    text: |-
      Indien de honoraire consulaire ambtenaar niet in het bezit is van de Nederlandse nationaliteit, blijft de eerste
      zin van de eed of belofte achterwege.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel138
  - number: '139'
    text: |-
      Onze Minister kan [artikel 130, eerste en tweede lid][ref1], overeenkomstig toepassen ten aanzien van honoraire
      consulaire ambtenaren en hun nagelaten gezinsleden, waarbij hij rekening houdt met hun financiële omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel130
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '130'
        hoofdstuk: XVIII
        paragraaf: '2'
  - number: '140.1'
    text: |-
      In bijzondere gevallen kan het hoofd van een vertegenwoordiging van het Koninkrijk in het buitenland met machtiging
      van Onze Minister bij die vertegenwoordiging van het Koninkrijk in het buitenland een persoon van Nederlandse
      nationaliteit tot honorair adviseur benoemen en ontslaan.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel140
  - number: '140.2'
    text: Binnen het kader van zijn advieswerkzaamheden behoort de honoraire adviseur tot de DBZ.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel140
  - number: '140.3'
    text: |-
      Honoraire adviseurs genieten geen bezoldiging; bij hun benoeming worden de duur en de inhoud van hun
      advieswerkzaamheden geregeld, alsmede hun rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel140
  - number: '141.1'
    text: |-
      Aan degenen die ingevolge het tweede, vierde, vijfde dan wel zesde lid van artikel 8 bij een vertegenwoordiging van
      het Koninkrijk in het buitenland werkzaam zijn, kan in overeenstemming met de door hen beklede functies een titel
      worden toegekend, met inachtneming van het tweede tot en met zesde lid.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: '141.2'
    text: 'De in het eerste lid bedoelde titel kan zijn:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.a
    text: Buitengewoon en Gevolmachtigd Ambassadeur
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.b
    text: Buitengewoon Gezant en Gevolmachtigd Minister
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.c
    text: Zaakgelastigde
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.d
    text: Gevolmachtigd Minister
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.e
    text: Ambassaderaad, Gezantschapsraad, Handelsraad, dan wel Raad
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.f
    text: Eerste Ambassadesecretaris, Gezantschapssecretaris, Handelssecretaris, dan wel Eerste Secretaris
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.g
    text: Tweede Ambassadesecretaris, Gezantschapssecretaris, Handelssecretaris, dan wel Tweede Secretaris
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.h
    text: Derde Ambassadesecretaris, Gezantschapssecretaris, Handelssecretaris, dan wel Derde Secretaris
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.i
    text: Consul-Generaal
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.j
    text: Consul
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.k
    text: Vice-Consul
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.l
    text: Adjunct Vice-Consul
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.m
    text: Attaché
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.n
    text: Adjunct-Attaché
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.o
    text: Directeur der Kanselarij der Eerste Klasse
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.p
    text: Directeur der Kanselarij
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.q
    text: Kanselier der Eerste Klasse, dan wel
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.2.r
    text: Kanselier der Tweede Klasse.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: '141.3'
    text: |-
      Aan degenen die ingevolge het [derde lid van artikel 8][ref1] bij een vertegenwoordiging van het Koninkrijk in
      het buitenland werkzaam zijn kan in overeenstemming met de door hen beklede functies één van de in het tweede lid,
      onder *e* tot en met *h* en *j* tot en met *n*, genoemde titels worden toegekend, voorafgegaan of gevolgd door een
      aanduiding van hun specialisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '8'
        hoofdstuk: II
  - number: '141.4'
    text: Aan een honoraire consulaire ambtenaar kan de titel Consul-Generaal, Consul, dan wel Vice-Consul worden toegekend.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.5.a
    text: |-
      Indien de functie zulks in verband met in het buitenland te vervullen ambtsbezigheden vereist, wordt aan een hier
      te lande geplaatste of benoemde ambtenaar van de DBZ de titel Ambassadeur toegekend.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: 141.5.b
    text: |-
      De titel Ambassadeur wordt in dat verband ook toegekend aan de Directeur-Generaal voor de Buitenlandse Economische
      Betrekkingen van het Ministerie van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: '141.6'
    text: |-
      De titels van hoofden van vertegenwoordigingen van het Koninkrijk in het buitenland - met uitzondering van de
      titel Zaakgelastigde - en van degenen genoemd in het vijfde lid worden bij koninklijk besluit toegekend; de titel
      Zaakgelastigde en alle overige titels door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel141
  - number: '142.1'
    text: |-
      Met betrekking tot het overleg met de centrales van verenigingen van ambtenaren zijn de
      [artikelen 105 tot en met 117 van het ARAR][ref1] van overeenkomstige toepassing, behoudens het gestelde in het
      tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel105
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '105'
  - number: '142.2'
    text: |-
      Een voorgenomen besluit als bedoeld in de [artikelen 113][ref1] en [115 van het ARAR][ref2] heeft betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel115
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '113'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '115'
  - number: 142.2.1)
    text: overplaatsbare ambtenaren van de DBZ;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel142
  - number: 142.2.2)
    text: niet-overplaatsbare ambtenaren van de DBZ;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel142
  - number: 142.2.3)
    text: tijdelijke ambtenaren van de DBZ;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel142
  - number: 142.2.4)
    text: op arbeidsovereenkomst naar burgerlijk recht in dienst genomen werknemers;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel142
  - number: 142.2.5)
    text: honoraire consulaire ambtenaren;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel142
  - number: 142.2.6)
    text: honoraire adviseurs;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel142
  - number: 142.2.7)
    text: |-
      personen die ingevolge [artikel 8, zesde lid][ref1], aan een tijdelijke diplomatieke zending zijn toegevoegd;


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '8'
        hoofdstuk: II
  - number: 142.2.8)
    text: |-
      bij een vertegenwoordiging van het Koninkrijk in het buitenland toegevoegde ambtenaren als bedoeld in
      [artikel 8, vierde lid][ref1], met dien verstande dat met betrekking tot hen het overleg over de in
      [artikel 113, eerste lid, van het ARAR][ref2] bedoelde aangelegenheden alleen wordt gevoerd voor zover die
      aangelegenheden verband houden met hun toevoeging.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel113
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '113'
  - number: '142.3'
    text: |-
      Onder «centrales van verenigingen van ambtenaren» en «centrales» in de
      [artikelen 113 tot en met 117 van het ARAR][ref1], wordt mede begrepen de Vereniging Dienst Buitenlandse Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel113
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '113'
  - number: '143'
    text: |-
      Voor de vertegenwoordigingen van het Koninkrijk in het buitenland stelt Onze Minister ter
      zake van de medezeggenschap regels vast, die zoveel mogelijk in overeenstemming zijn met de
      [Wet op de ondernemingsraden][ref1]. Deze regels houden rekening met de bijzondere omstandigheden van het werkzaam
      zijn bij een vertegenwoordiging van het Koninkrijk in het buitenland.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 143a
    text: |-
      Over een voorgenomen besluit tot reorganisatie worden door of namens Onze Minister tijdig geïnformeerd: de
      centrales van verenigingen van ambtenaren, bedoeld in [artikel 142, derde lid][ref1], de ondernemingsraad en de
      krachtens [artikel 143][ref2] ingestelde medezeggenschapsorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel143
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel143a
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '142'
        hoofdstuk: XXII
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '143'
        hoofdstuk: XXII
  - number: '144.1'
    text: Er is een Commissie van Bezwaar Dienst Buitenlandse Zaken, hierna te noemen de Commissie van Bezwaar, die
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel144
  - number: 144.1.a
    text: |-
      Onze Minister van advies dient over de beslissing op een bezwaarschrift gericht tegen een besluit of een handeling
      krachtens dit reglement genomen onderscheidenlijk verricht ten aanzien van
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel144
  - number: 144.1.a.1°
    text: overplaatsbare, niet-overplaatsbare en tijdelijke ambtenaren van de DBZ;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel144
  - number: 144.1.a.2°
    text: op arbeidsovereenkomst naar burgerlijk recht in dienst genomen werknemers behorende tot de DBZ;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel144
  - number: 144.1.a.3°
    text: |-
      ingevolge het [derde en vierde lid van artikel 8][ref1] bij een vertegenwoordiging van het Koninkrijk in het
      buitenland gedetacheerde of toegevoegde ambtenaren, voor zover het besluiten of handelingen welke met hun
      detachering of toevoeging verband houden betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '8'
        hoofdstuk: II
  - number: 144.1.a.4°
    text: |-
      ingevolge het [zesde lid van artikel 8][ref1] aan een tijdelijke diplomatieke zending toegevoegde personen, voor
      zover het besluiten of handelingen welke verband houden met hun toevoeging betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '8'
        hoofdstuk: II
  - number: 144.1.a.5°
    text: |-
      ingevolge [artikel 115][ref1] bij een vertegenwoordiging van het Koninkrijk in het buitenland op
      arbeidsovereenkomst naar burgerlijk recht indienstgenomen werknemers;


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel115
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '115'
        hoofdstuk: XVIII
        paragraaf: '1'
  - number: 144.1.a.6°
    text: |-
      honoraire consulaire ambtenaren en honoraire adviseurs, behorende tot de DBZ, voor zover het besluiten of
      handelingen welke verband houden met de ambtsverrichtingen als honorair consulair ambtenaar onderscheidenlijk de
      advieswerkzaamheden als honorair adviseur betreft;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel144
  - number: 144.1.a.7°
    text: nagelaten betrekkingen en rechtverkrijgenden van de onder ten 1° tot en met ten 6° genoemden;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel144
  - number: 144.1.b
    text: |-
      Onze Minister, hoofd van het betrokken ministerie, van advies dient over de beslissing op een bezwaarschrift
      gericht tegen een besluit of een handeling,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel144
  - number: 144.1.b.1°
    text: |-
      als bedoeld in [artikel 8, achtste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '8'
        hoofdstuk: II
  - number: 144.1.b.2°
    text: |-
      genomen ten aanzien van werknemers als bedoeld in [artikel 115][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel115
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '115'
        hoofdstuk: XVIII
        paragraaf: '1'
  - number: '144.2'
    text: |-
      De Commissie van Bezwaar brengt geen advies uit over de beslissing op een bezwaarschrift tegen een van de in het
      eerste lid bedoelde besluiten of handelingen, indien daarmee bij of krachtens dit reglement een andere commissie
      is belast.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel144
  - number: '144.3'
    text: |-
      De Commissie van Bezwaar zetelt te 's-Gravenhage en houdt zitting in een door Onze Minister ter beschikking
      gestelde lokaliteit van het Ministerie van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel144
  - number: 145.1.a
    text: 'De Commissie van Bezwaar bestaat uit de volgende leden:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: 145.1.a.1°
    text: een voorzitter;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: 145.1.a.2°
    text: twee plaatsvervangende voorzitters;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: 145.1.a.3°
    text: drie leden-niet-ambtenaren en
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: 145.1.a.4°
    text: negen leden-ambtenaren waarvan ten minste vijf overplaatsbare ambtenaren van de DBZ.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: 145.1.b
    text: |-
      Indien bezwaar wordt gemaakt door een gedetacheerde ambtenaar als bedoeld in [artikel 8, derde lid, onder ][ref1],
      wordt door Onze Minister aan de Commissie van Bezwaar een lid toegevoegd op voordracht van Onze Minister, hoofd van
      het betrokken ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '8'
        hoofdstuk: II
  - number: '145.2'
    text: 'Met inachtneming van het eerste lid bepaalt Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: 145.2.a
    text: om welke redenen de leden kunnen worden geschorst en ontslagen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: 145.2.b
    text: de wijze waarop de leden aftreden.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: '145.3'
    text: |-
      De vergoeding van de voorzitter, plaatsvervangende voorzitters en de leden-niet-ambtenaren wordt door Onze Minister
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: '145.4'
    text: |-
      [Afdeling 8.1.4 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op de wraking en
      verschoning van leden van de Commissie van Bezwaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.1.4
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.1.4
  - number: '145.5'
    text: |-
      De leden van de Commissie van Bezwaar, alsmede de in het zesde lid genoemde secretarissen, zijn tot geheimhouding
      verplicht met betrekking tot de beraadslagingen in de Commissie.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: '145.6'
    text: Onze Minister voegt een secretaris en zonodig een plaatsvervangend secretaris aan de Commissie van Bezwaar toe.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: 145.7.a
    text: |-
      Voor het behandelen van bezwaren vormt en bezet de Commissie van Bezwaar op voorstel van de voorzitter meervoudige
      kamers. Elke kamer bestaat uit:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: 145.7.a.1°
    text: de voorzitter of een plaatsvervangend voorzitter;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: 145.7.a.2°
    text: één lid-niet-ambtenaar en
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: 145.7.a.3°
    text: één of drie leden-ambtenaren.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: 145.7.b
    text: |-
      Bij een bezwaar als bedoeld in [artikel 147][ref1] bestaat de kamer uit:


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel147
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '147'
        hoofdstuk: XXIII
  - number: 145.7.b.1°
    text: de voorzitter of een plaatsvervangend voorzitter en
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: 145.7.b.2°
    text: twee of vier leden, waarvan ten minste één overplaatsbaar lid-ambtenaar.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel145
  - number: '146.1'
    text: Onze Minister geeft aanwijzingen omtrent de wijze waarop het bezwaarschrift wordt geadresseerd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel146
  - number: '146.2'
    text: Het horen door de Commissie van Bezwaar is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel146
  - number: '146.3'
    text: |-
      De indiener van het bezwaarschrift die in het buitenland is geplaatst of gevestigd, ontvangt overeenkomstig de
      regelen inzake dienstreizen een vergoeding van reis- en verblijfkosten, indien de Commissie van Bezwaar het voor
      haar onderzoek noodzakelijk acht dat betrokkene in persoon wordt gehoord. De Commissie bericht betrokkene zo
      spoedig mogelijk, of zij het voor haar onderzoek al dan niet noodzakelijk acht betrokkene al dan niet in persoon
      te horen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel146
  - number: '146.4'
    text: |-
      Degenen die in het [tweede lid van artikel 5][ref1] zijn genoemd zijn verplicht aan een oproep van de Commissie
      van Bezwaar gehoor te geven en desgevraagd alle inlichtingen en ter zake dienende bescheiden zonder voorbehoud
      te verstrekken. Degene die bezwaar heeft gemaakt en dienst bloed- en aanverwanten tot de tweede graad kunnen zich
      echter van het geven van inlichtingen en het verstrekken van bescheiden onthouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel5
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '5'
        hoofdstuk: II
  - number: '146.5'
    text: |-
      De Commissie van Bezwaar kan zich door deskundigen schriftelijk van advies en verslag doen dienen. Getuigen en
      deskundigen die ambtshalve zijn opgeroepen of met een opdracht zijn belast, ontvangen een vergoeding overeenkomstig
      de [Wet tarieven in strafzaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: '146.6'
    text: |-
      Worden aan de Commissie van Bezwaar schriftelijk inlichtingen voorgelegd omtrent degene die het bezwaar heeft
      ingediend, dan mogen die niet ten nadele van betrokkene gelden, tenzij deze vóór de melding aan de Commissie door
      betrokkene voor gezien zijn getekend, of blijkens een daarop gestelde verklaring, ondertekend door twee ambtenaren
      van de DBZ, aan betrokkene zijn voorgelezen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel146
  - number: '146.7'
    text: |-
      De Commissie van Bezwaar stelt haar advies in raadkamer vast bij volstrekte meerderheid van stemmen, waarbij geen
      der leden zich van deelneming aan enige stemming onthoudt.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel146
  - number: '146.8'
    text: |-
      De Commissie van Bezwaar adviseert Onze Minister, onderscheidenlijk Onze Minister, hoofd van het betrokken
      ministerie, behoudens in het geval voorzien in [artikel 147][ref1] binnen acht weken na ontvangst van het
      bezwaarschrift. Indien toepassing is gegeven aan [artikel 7:10, derde lid, van de Algemene wet bestuursrecht][ref2]
      brengt de Commissie binnen twaalf weken na ontvangst van het bezwaarschrift haar advies uit. Indien sprake is
      van verder uitstel als bedoeld in [artikel 7:10, vierde lid, van de Algemene wet bestuursrecht][ref3] brengt de
      Commissie binnen drie weken na sluiting van haar onderzoek haar advies uit. Vanwege de voorzitter wordt in het
      geval bedoeld in de vorige volzin aan de indiener van het bezwaarschrift kennis gegeven van het tijdstip waarop de
      Commissie haar onderzoek heeft afgesloten. Na het uitbrengen van het advies verleent de Commissie de indiener van
      het bezwaarschrift terstond afschrift van dit advies. Het advies wordt niet openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '147'
        hoofdstuk: XXIII
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '146.9'
    text: |-
      De Commissie van Bezwaar kan Onze Minister, onderscheidenlijk Onze Minister, hoofd van het betrokken ministerie,
      daarbij adviseren de betrokkene bedoeld in het derde lid die in persoon werd gehoord, hoewel de Commissie het
      horen in persoon voor haar onderzoek niet nodig oordeelde, alsnog een vergoeding van reis- en verblijfkosten
      overeenkomstig de regelen inzake dienstreizen toe te kennen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel146
  - number: '147'
    text: |-
      Bezwaarschriften tegen een besluit tot plaatsing, ter beschikking houden of wijziging van een plaatsingsduur worden
      door de Commissie van Bezwaar versneld behandeld, met inachtneming van het navolgende:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel147
  - number: 147.a
    text: |-
      indien Onze Minister de in het [achtste lid van artikel 30][ref1] genoemde termijn in acht heeft genomen, adviseert
      de Commissie van Bezwaar binnen twee weken na ontvangst van het bezwaarschrift;


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel30
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '30'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 147.b
    text: |-
      indien Onze Minister de in het [achtste lid van artikel 30][ref1] genoemde termijn spoedshalve niet in acht heeft
      genomen, adviseert de Commissie van Bezwaar zo spoedig mogelijk na ontvangst van het bezwaarschrift, en wel op een
      zodanig korte termijn dat Onze Minister in staat is na ontvangst van het advies het bestreden besluit in voorkomend
      geval in te trekken dan wel te wijzigen;


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel30
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '30'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 147.c
    text: |-
      het bezwaar schorst de werking van het besluit totdat Onze Minister op het bezwaarschrift heeft beslist, indien het
      bezwaarschrift binnen twee weken na de dag waarop het op de voorgeschreven wijze is bekendgemaakt, is ingediend,
      dit bezwaarschrift voldoet aan de in [artikel 6:5 van de Algemene wet bestuursrecht][ref1] gestelde vereisten en
      het besluit nog niet ten uitvoer is gelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 147.d
    text: bij deze bezwaarschriftprocedures kan door
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel147
  - number: 147.d.1°
    text: Onze Minister,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel147
  - number: 147.d.2°
    text: de in het buitenland geplaatste, bezwaar makende overplaatsbare ambtenaar van de DBZ,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel147
  - number: 147.d.3°
    text: de Commissie van Bezwaar en
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel147
  - number: 147.d.4°
    text: de daaraan toegevoegde secretarissen
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel147
  - number: '148.1'
    text: |-
      Onze Minister stelt telkenjare ten behoeve van degenen die tot de DBZ behoren een sociaal jaarverslag op en stelt
      dit bekend.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel148
  - number: '148.2'
    text: Dit jaarverslag bevat ten minste
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel148
  - number: 148.2.a
    text: |-
      een beschouwing over het personeelsbeleid dat Onze Minister ten aanzien van degenen die tot de DBZ behoren, voert
      en in het verslagjaar heeft uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel148
  - number: 148.2.b
    text: |-
      een overzicht van de formatie voor wat betreft de voor ambtenaren van de DBZ bestemde functies en aan de hand
      daarvan een beschouwing over de bevorderingsprognoses per rang;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel148
  - number: 148.2.c
    text: een overzicht van de bevorderingen per rang en naar geslacht in het verslagjaar.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel148
  - number: '148.3'
    text: Aanspraken op bevordering of andere aanspraken kunnen aan het sociaal jaarverslag niet worden ontleend.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel148
  - number: '149'
    text: |-
      Bij algemene maatregel van bestuur, regelende de overgangsbepalingen, wordt het tijdstip van inwerkingtreding van
      dit besluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel149
  - number: 149a
    text: |-
      Onze Minister kan de bevoegdheid tot het stellen van regels met een sterk technisch karakter krachtens dit besluit
      mandateren.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel149a
  - number: '150'
    text: 'Dit besluit kan worden aangehaald als Reglement Dienst Buitenlandse Zaken (afgekort: RDBZ).'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel150
