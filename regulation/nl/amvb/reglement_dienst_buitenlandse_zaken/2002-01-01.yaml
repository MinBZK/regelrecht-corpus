preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Buitenlandse Zaken van 2 juni 1986, nummer HDBZ/SF-140960;

    Overwegende dat het noodzakelijk is dat het Ministerie van Buitenlandse Zaken bij de zich sterk wijzigende
    internationale verhoudingen kan blijven beschikken over die ambtelijke deskundigheid en internationale ervaring die
    het voor het verwezenlijken van zijn beleidsdoelstellingen behoeft;

    Overwegende dat het gewenst is dat de functies vervuld worden door medewerkers wier loopbaan zich uitstrekt over
    het ministerie van Buitenlandse Zaken hier te lande en over de vertegenwoordigingen van het Koninkrijk in het
    buitenland, tenzij die functies daarvoor naar hun inhoud niet geschikt zijn;

    Overwegende dat het daarom dienstig is te komen tot de integratie van personeel van het ministerie van Buitenlandse
    Zaken hier te lande en van de Buitenlandse Dienst tot een geïntegreerde Dienst Buitenlandse Zaken;

    Overwegende dat daarbij wordt beoogd de door Onze Minister van Buitenlandse Zaken, Onze Minister zonder
    Portefeuille en Onze Minister van Economische Zaken getroffen regeling met betrekking tot de economische
    werkzaamheden van de vertegenwoordigingen van het Koninkrijk in het buitenland (28 januari 1955, nr. DBD-10296/PE)
    zonder wijziging voort te zetten;

    Overwegende ten slotte dat het wenselijk is gebleken de organisatie van deze dienst en de rechtspositie van allen
    die daartoe in binnen- en buitenland behoren in één reglement vast te leggen;

    Gelet op de artikelen 125 en 134 van de Ambtenarenwet 1929 (Stb. 530);

    De Raad van State gehoord (advies van 6 augustus 1986, nr. WO 2.86.0284);

    Gezien het nader rapport van voornoemde Minister van 19 november 1986, nummer HDBZ/SF-305425;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit reglement wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Buitenlandse Zaken;'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel1
  - number: 1.b
    text: 'DBZ: Dienst Buitenlandse Zaken;'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel1
  - number: 1.c
    text: |-
      Ambtenaar van de DBZ: Degene die door Ons, dan wel door Onze Minister is aangesteld om als ambtenaar van de DBZ
      werkzaam te zijn;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel1
  - number: 1.d
    text: |-
      Werknemer: Degene die door Onze Minister op arbeidsovereenkomst naar burgerlijk recht als werknemer, behorende tot
      de DBZ, in dienst is genomen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel1
  - number: 1.e
    text: |-
      ARAR: [Algemeen Rijksambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: 1.f
    text: |-
      BBRA 1984: [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 1.g
    text: |-
      Functie: Het samenstel van werkzaamheden, door de ambtenaar of werknemer te verrichten krachtens en overeenkomstig
      hetgeen door het daartoe bevoegde gezag aan betrokkene is opgedragen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel1
  - number: 1.h
    text: |-
      Wervingsgroep: Groep van kandidaat-overplaatsbare ambtenaren van de DBZ, aan wie, met het oog op de loopbaan
      waarvoor zij worden aangeworven, gelijke leeftijds-, opleidings- of ervaringseisen worden gesteld;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel1
  - number: 1.i
    text: |-
      Arbo-dienst: de door Onze Minister aangewezen deskundige dienst in de zin van
      [artikel 14, derde lid, laatste volzin, van de Arbeidsomstandighedenwet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 1.j
    text: 'Ministeriële regeling: Regeling van Onze Minister.'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel1
  - number: '2.1'
    text: 'Waar in dit reglement sprake is van gezinsleden, worden daaronder verstaan:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel2
  - number: 2.1.a
    text: de huwelijkspartner van betrokkene,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel2
  - number: 2.1.b
    text: de minderjarige kinderen, adoptief- of stiefkinderen van de betrokkene welke ten laste van betrokkene komen,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel2
  - number: 2.1.c
    text: |-
      door Onze Minister als gezinslid beschouwde andere minderjarige kinderen, adoptief- of stiefkinderen of
      pleegkinderen van betrokkene of van diens huwelijkspartner, alsmede
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel2
  - number: 2.1.d
    text: |-
      door Onze Minister als gezinslid beschouwde meerderjarige studerende of invalide kinderen, adoptief-, stief- of
      pleegkinderen van betrokkene of van diens huwelijkspartner.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      In dit reglement wordt onder huwelijkspartner mede verstaan de geregistreerde partner alsmede de levenspartner
      met wie de niet-gehuwde ambtenaar samenwoont en – met het oogmerk duurzaam samen te leven – een gemeenschappelijke
      huishouding voert op basis van een notarieel verleden samenlevingscontract bevattende de wederzijdse rechten en
      verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding. Onder weduwe en weduwnaar wordt
      mede begrepen de achtergebleven geregistreerde partner alsmede de achtergebleven levenspartner. Tegelijkertijd kan
      slechts één persoon als levenspartner dan wel weduwe of weduwnaar worden aangemerkt. Onze Minister kan verlangen
      dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt dat een samenlevingscontract als
      bedoeld in de eerste volzin is gesloten.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld op grond waarvan een tijdelijke voorziening kan worden getroffen
      voor de toepassing van dit reglement, indien de vertegenwoordiging van het Koninkrijk in het buitenland waar
      de betrokken ambtenaar is geplaatst geen notariële bevoegdheid heeft en niet de mogelijkheid bestaat een
      samenlevingscontract notarieel in het desbetreffende land te doen opmaken.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel2
  - number: '3'
    text: |-
      Waar in dit reglement sprake is van de formatie, wordt daaronder verstaan de kwantitatieve omvang van het
      Ministerie van Buitenlandse Zaken en de zich daarbinnen voordoende kwalitatieve structuur. De formatie is
      samengesteld uit formaties van de binnen het ministerie voorkomende dienstonderdelen en de vertegenwoordigingen van
      het Koninkrijk in het buitenland.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel3
  - number: '4'
    text: |-
      Waar in dit reglement sprake is van de anciënniteit van een overplaatsbaar ambtenaar van de DBZ, wordt daaronder
      verstaan: de tijd gedurende welke de overplaatsbare ambtenaar van de DBZ de laatstelijk toegekende rang heeft.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel4
  - number: '5.1'
    text: Bij het Ministerie van Buitenlandse Zaken bestaat een Dienst Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel5
  - number: '5.2'
    text: 'De Dienst Buitenlandse Zaken bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel5
  - number: 5.2.a
    text: |-
      degenen die bij koninklijk besluit, dan wel door Onze Minister, als ambtenaar van de Dienst Buitenlandse Zaken
      zijn aangesteld;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel5
  - number: 5.2.b
    text: |-
      degenen die in het buitenland door Onze Minister op arbeidsovereenkomst naar burgerlijk recht in dienst zijn
      genomen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel5
  - number: 5.2.c
    text: |-
      degenen die bij koninklijk besluit, dan wel door Onze Minister, als honoraire consulaire ambtenaren zijn
      aangesteld, met inachtneming van het [tweede lid van artikel 132][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel132
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '132'
        hoofdstuk: XIX
  - number: 5.2.d
    text: |-
      degenen die door het hoofd van een der in [artikel 7][ref1] genoemde vertegenwoordigingen van het Koninkrijk in het
      buitenland bij die vertegenwoordiging van het Koninkrijk in het buitenland als honorair adviseur zijn aangesteld,
      met inachtneming van het [tweede lid van artikel 140][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel140
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '140'
        hoofdstuk: XX
  - number: '5.3'
    text: |-
      Met betrekking tot hun dienstverrichtingen worden voorts de in het [derde, vierde en zesde lid van artikel 8][ref1]
      genoemde gedetacheerden dan wel toegevoegden gelijkgesteld met degenen die tot de Dienst Buitenlandse Zaken
      behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '8'
        hoofdstuk: II
  - number: '6.1'
    text: |-
      De Dienst Buitenlandse Zaken heeft tot taak, het beleid ter zake van de door het Koninkrijk met het buitenland
      onderhouden betrekkingen en de door de regering bevorderde ontwikkeling van de internationale rechtsorde, ambtelijk
      voor te bereiden, gestalte te geven, te coördineren en tot uitvoering te brengen; hij staat daartoe onder leiding
      van Onze Minister, met inachtneming van de verantwoordelijkheden van Onze Minister voor Ontwikkelingssamenwerking,
      alsmede van Onze Minister van Economische Zaken ingevolge het [vijfde lid van artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel12
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '12'
        hoofdstuk: II
  - number: '6.2'
    text: |-
      Met inachtneming van het volkenrecht, in het bijzonder de voor het Koninkrijk, Nederland, de Nederlandse Antillen
      of Aruba bindende internationale verdragen en andere overeenkomsten alsmede de buitenlandse wetten en gebruiken,
      omvat de in het eerste lid genoemde taak mede:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel6
  - number: 6.2.a
    text: het vertegenwoordigen van het Koninkrijk buiten zijn grondgebied;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel6
  - number: 6.2.b
    text: |-
      het uitdragen en toelichten van het beleid van het Koninkrijk ten aanzien van internationale vraagstukken en
      ontwikkelingen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel6
  - number: 6.2.c
    text: |-
      het behartigen en beschermen van de belangen van het Koninkrijk, van Nederlanders en van Nederlandse, Nederlands-
      Antilliaanse en Arubaanse rechtspersonen buiten het grondgebied van het Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel6
  - number: 6.2.d
    text: |-
      het verzamelen, verwerken en verstrekken van inlichtingen omtrent internationale ontwikkelingen ten behoeve van
      de Nederlandse, Nederlands-Antilliaanse en Arubaanse overheid, van Nederlanders en van Nederlandse, Nederlands-
      Antilliaanse en Arubaanse rechtspersonen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel6
  - number: 6.2.e
    text: |-
      het verrichten van de gerechtelijke, buitengerechtelijke en administratieve handelingen en werkzaamheden welke
      krachtens internationale overeenkomsten en de wetten en voorschriften van het Koninkrijk aan ambtenaren die in
      diplomatieke of consulaire functies zijn aangesteld, zijn opgedragen en waartoe zij bevoegd zijn verklaard;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel6
  - number: 6.2.f
    text: |-
      andere bij koninklijk besluit, dan wel door de regering, door tussenkomst van Onze Minister, aan
      vertegenwoordigingen van het Koninkrijk in het buitenland op te dragen werkzaamheden welke met het buitenlands
      beleid dan wel de bevordering van de internationale rechtsorde samenhangen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het Ministerie van Buitenlandse Zaken omvat het in Nederland gevestigde deel van het Ministerie van Buitenlandse
      Zaken, verder aangeduid met departement, en de vertegenwoordigingen van het Koninkrijk in het buitenland.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel7
  - number: '7.2'
    text: 'De vertegenwoordigingen van het Koninkrijk in het buitenland kunnen zijn:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel7
  - number: 7.2.a
    text: vaste diplomatieke zendingen, te weten ambassades en gezantschappen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel7
  - number: 7.2.b
    text: permanente vertegenwoordigingen van het Koninkrijk bij internationale organisaties;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel7
  - number: 7.2.c
    text: consulaire posten, te weten consulaten-generaal, consulaten, vice-consulaten en consulaire agentschappen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel7
  - number: 7.2.d
    text: tijdelijke diplomatieke zendingen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel7
  - number: '7.3'
    text: |-
      De in het tweede lid genoemde vertegenwoordigingen van het Koninkrijk in het buitenland worden bij koninklijk
      besluit naar behoefte ingesteld, geopend, verplaatst, gesloten en opgeheven; bij de instelling worden hun
      hoedanigheid en plaats van vestiging of bestemming bepaald.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel7
  - number: '7.4'
    text: |-
      Het ambtsgebied van een vaste diplomatieke zending omvat het grondgebied van de staat of de staten waar de zending
      wordt onderhouden.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel7
  - number: '7.5'
    text: |-
      Onze Minister bepaalt voor elke consulaire post een ressort en kan dit naar behoefte wijzigen. Binnen de ressorten
      van consulaire posten kan hij sub-ressorten instellen voor consulaire posten van dezelfde of lagere orde.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel7
  - number: '7.6'
    text: |-
      Consulaire posten die zich binnen het ambtsgebied van een vaste diplomatieke zending bevinden zijn daaraan
      ondergeschikt tenzij Onze Minister anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel7
  - number: '8.1'
    text: 'Bij het departement kunnen werkzaam zijn:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
  - number: 8.1.a
    text: |-
      overplaatsbare ambtenaren van de DBZ in de zin van [artikel 17, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel17
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '17'
        hoofdstuk: IV
  - number: 8.1.b
    text: |-
      niet-overplaatsbare ambtenaren van de DBZ in de zin van [artikel 17, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel17
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '17'
        hoofdstuk: IV
  - number: 8.1.c
    text: |-
      tijdelijke ambtenaren van de DBZ in de zin van [artikel 17, eerste lid, onder ][ref1], in de gevallen bedoeld in
      [artikel 113][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel113a
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '17'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004052
        artikel: 113a
        hoofdstuk: XVIIA
  - number: 8.1.d
    text: |-
      ambtenaren van de Nederlandse Antillen en Aruba welke door Onze Minister in overeenstemming met de regering van de
      Nederlandse Antillen dan wel Aruba, bij het departement zijn gedetacheerd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
  - number: 8.1.e
    text: |-
      anderen dan de onder *a* tot en met *d* genoemden die door Onze Minister tijdelijk bij het departement zijn
      tewerkgesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
  - number: '8.2'
    text: 'Bij de vertegenwoordigingen van het Koninkrijk in het buitenland kunnen werkzaam zijn:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
  - number: 8.2.a
    text: |-
      overplaatsbare ambtenaren van de DBZ in de zin van [artikel 17, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel17
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '17'
        hoofdstuk: IV
  - number: 8.2.b
    text: |-
      tijdelijke ambtenaren van de DBZ in de zin van [artikel 17, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel17
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '17'
        hoofdstuk: IV
  - number: 8.2.c
    text: |-
      degenen die door Onze Minister op arbeidsovereenkomst naar burgerlijk recht in dienst zijn genomen, met als
      standplaats de plaats van vestiging van een der vertegenwoordigingen van het Koninkrijk in het buitenland;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
  - number: 8.2.d
    text: degenen die bij koninklijk besluit dan wel door Onze Minister als honorair consulair ambtenaar zijn aangesteld;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
  - number: 8.2.e
    text: |-
      honoraire adviseurs, in de zin van [artikel 5, tweede lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel5
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '5'
        hoofdstuk: II
  - number: '8.3'
    text: |-
      Bij de vertegenwoordigingen van het Koninkrijk in het buitenland kunnen voorts ter verdere verwezenlijking van de
      in [artikel 6][ref1] genoemde taak


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel6
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '6'
        hoofdstuk: II
  - number: 8.3.a
    text: |-
      in overeenstemming met Onze Minister worden gedetacheerd ambtenaren van een ander ministerie, wier detachering
      geschiedt door Onze Minister, hoofd van het betrokken ministerie;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
  - number: 8.3.b
    text: |-
      werknemers, bedoeld in [artikel 115][ref1] werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel115
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '115'
        hoofdstuk: XVIII
        paragraaf: '1'
  - number: '8.4'
    text: |-
      Aan de vertegenwoordigingen van het Koninkrijk in het buitenland kunnen voorts ter verdere verwezenlijking van de
      in [artikel 6][ref1] genoemde taak door Onze Minister worden toegevoegd ambtenaren van een ander ministerie, dan
      wel van de Nederlandse Antillen en van Aruba, die met het oog op die tewerkstelling tijdelijk ter beschikking zijn
      gesteld van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel6
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '6'
        hoofdstuk: II
  - number: '8.5'
    text: |-
      Niet-overplaatsbare ambtenaren van de DBZ kunnen in de in het [eerste lid van artikel 113][ref1] genoemde gevallen
      aan vertegenwoordigingen van het Koninkrijk in het buitenland worden toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel113
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '113'
        hoofdstuk: XVII
  - number: '8.6'
    text: |-
      In bijzondere gevallen kunnen aan tijdelijke diplomatieke zendingen anderen dan de in het tweede, derde, vierde en
      vijfde lid genoemden, worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
  - number: '8.7'
    text: |-
      Onze Minister kan, voor wat betreft de dienstverrichtingen van degenen die in het derde, vierde en zesde lid zijn
      genoemd, in overeenstemming met zijn betrokken ambtgenoot, dan wel met de regering van de Nederlandse Antillen
      onderscheidenlijk Aruba, nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
  - number: '8.8'
    text: |-
      Onze Minister, hoofd van het betrokken ministerie, stelt in overeenstemming met Onze Minister de vergoedingen en
      tegemoetkomingen vast welke verband houden met de in het derde lid, onder *a*, bedoelde detacheringen volgens de
      regelen die bij of krachtens dit reglement zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
  - number: '8.9'
    text: |-
      Op degenen die ingevolge het vierde lid aan een vertegenwoordiging van het Koninkrijk in het buitenland worden
      toegevoegd, kan Onze Minister bepalingen van dit reglement, welke gelden voor overplaatsbare ambtenaren van de DBZ,
      van overeenkomstige toepassing verklaren.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      De hoofden van de in [artikel 7][ref1] genoemde vertegenwoordigingen van het Koninkrijk in het buitenland worden,
      behoudens het hierna in het tweede en derde lid bepaalde, bij koninklijk besluit benoemd uit de ambtenaren van
      de DBZ.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel7
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '7'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      Tot hoofd van een consulaire post kan bij koninklijk besluit ook een honorair consulair ambtenaar worden
      aangesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel9
  - number: '9.3'
    text: |-
      Tot hoofd van een tijdelijke diplomatieke zending kan bij koninklijk besluit ook een persoon die geen ambtenaar van
      de DBZ is worden aangesteld, mits deze de Nederlandse nationaliteit bezit.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel9
  - number: '9.4'
    text: |-
      Hoofden van vertegenwoordigingen van het Koninkrijk in het buitenland worden bij koninklijk besluit, waar nodig,
      van geloofds- en terugroepingsbrieven, benoemingsbrevetten of inleidingsbrieven voorzien.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel9
  - number: '9.5'
    text: |-
      Als hoofd van een vaste diplomatieke zending kan door Onze Minister, indien een benoeming als bedoeld in het eerste
      lid niet heeft plaatsgevonden, een ambtenaar van de DBZ worden aangewezen in de hoedanigheid van Zaakgelastigde.
      Onze Minister voorziet deze, indien nodig, van een inleidingsbrief.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      Het hoofd van een vertegenwoordiging van het Koninkrijk in het buitenland is jegens Onze Minister verantwoordelijk
      voor de leiding en inrichting van die vertegenwoordiging, alsmede voor de goede verrichting van de dienst, zulks
      met inachtneming van [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel12
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '12'
        hoofdstuk: II
  - number: '10.2'
    text: 'Voorts is deze verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel10
  - number: 10.2.a
    text: |-
      een juist beheer van de zaken en andere waarden in gebruik bij of toevertrouwd aan die vertegenwoordiging van het
      Koninkrijk in het buitenland;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel10
  - number: 10.2.b
    text: een goed comptabel en financieel beheer;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel10
  - number: 10.2.c
    text: |-
      het toezicht op de ambtenaar van de DBZ die als rekenplichtig ambtenaar in de zin van de [Comptabiliteitswet][ref1]
      het beheer voert over de aan de vertegenwoordiging van het Koninkrijk in het buitenland toevertrouwde gelden en
      geldswaardige papieren.


      [ref1]: https://wetten.overheid.nl/BWBR0003075
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003075
  - number: '10.3'
    text: |-
      Het hoofd van een vaste diplomatieke zending heeft het toezicht op de Nederlandse, Nederlands-Antilliaanse en
      Arubaanse ambtenaren en overheidsinstellingen die zich duurzaam of tijdelijk voor ambtsverrichtingen in zijn
      ambtsgebied bevinden. Betrokkene kan in dit ambtsgebied tevens toezicht uitoefenen op de werkzaamheden van
      Nederlandse, Nederlands-Antilliaanse en Arubaanse instellingen, geen ondernemingen zijnde, die zich bezighouden
      met de bevordering van Nederlandse, Nederlands-Antilliaanse of Arubaanse belangen en de uitvoering van het
      overheidsbeleid, alsmede op die van de vertegenwoordigingen of neveninstellingen daarvan. De vorige volzin geldt
      niet ten aanzien van een permanente vertegenwoordiging van het Koninkrijk bij een internationale organisatie met
      betrekking tot het vertegenwoordigen van het Koninkrijk bij die internationale organisatie, en ten aanzien van een
      tijdelijke diplomatieke zending met betrekking tot de aangelegenheid waartoe die tijdelijke diplomatieke zending
      werd ingesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel10
  - number: '10.4'
    text: |-
      Het hoofd van een vaste diplomatieke zending geeft aanwijzingen aan en oefent toezicht uit op de hoofden van
      consulaire posten die aan die vaste diplomatieke zending ondergeschikt zijn en kan het toezicht, bedoeld in het
      derde lid, overdragen aan deze consulaire posten.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel10
  - number: '10.5'
    text: |-
      De bevoegdheden, in het derde en vierde lid voorzien, worden ook uitgeoefend door hoofden van consulaire posten,
      niet gelegen in het ambtsgebied van een vaste diplomatieke zending.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel10
  - number: '11.1'
    text: |-
      Het hoofd van een vertegenwoordiging van het Koninkrijk in het buitenland verlaat diens standplaats niet zonder in
      de leiding of waarneming ervan te hebben voorzien met inachtneming van het tweede tot en met zesde lid.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel11
  - number: '11.2'
    text: |-
      Voor afwezigheid van de standplaats binnen het land van vestiging, alsmede voor verblijf buiten het land van
      vestiging behoeft betrokkene steeds de voorafgaande goedkeuring van Onze Minister, welke goedkeuring ook kan worden
      ontleend aan een door Onze Minister voor die vertegenwoordiging van het Koninkrijk in het buitenland vastgestelde
      regeling.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel11
  - number: '11.3'
    text: |-
      Indien de plaats van hoofd van een vertegenwoordiging van het Koninkrijk in het buitenland openstaat, of indien
      het hoofd van een vertegenwoordiging van het Koninkrijk in het buitenland buiten het ambtsgebied verblijft dan wel,
      indien het een consulaire post betreft, buiten het ressort van die consulaire post, dan wel buiten staat is diens
      functie uit te oefenen, is de hoogste bij die vertegenwoordiging van het Koninkrijk in het buitenland geplaatste
      overplaatsbare ambtenaar van de DBZ met de waarneming belast, tenzij Onze Minister anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel11
  - number: '11.4'
    text: |-
      Degene die met de waarneming is belast treedt op als tijdelijk hoofd van die vertegenwoordiging van het
      Koninkrijk in het buitenland; betrokkene is niet bevoegd om zonder dringende noodzaak wijziging te brengen in de
      dienstverrichting alsmede de inrichting van de vertegenwoordiging van het Koninkrijk in het buitenland.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel11
  - number: '11.5'
    text: |-
      Degene die met de waarneming van een vaste diplomatieke zending is belast treedt, indien betrokkene bij de
      desbetreffende staat met een diplomatieke titel is ingeleid, op als Tijdelijk Zaakgelastigde.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel11
  - number: '11.6'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de waarneming van vertegenwoordigingen
      van het Koninkrijk in het buitenland.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel11
  - number: '12.1'
    text: |-
      Allen die bij de vertegenwoordigingen van het Koninkrijk in het buitenland werkzaam zijn, oefenen hun werkzaamheden
      uit overeenkomstig de voorschriften dan wel aanwijzingen die bij koninklijk besluit dan wel door Onze Minister zijn
      gesteld of gegeven, onverminderd het tweede tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel12
  - number: '12.2'
    text: |-
      Zij staan daarbij onder leiding van het hoofd van de desbetreffende vertegenwoordiging van het Koninkrijk in het
      buitenland of, bij diens afwezigheid of verhindering, van degene die met de leiding of waarneming is belast.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel12
  - number: '12.3'
    text: |-
      De ambtenaren bedoeld in het [derde lid van artikel 8][ref1], oefenen hun werkzaamheden uit overeenkomstig
      de voorschriften en aanwijzingen welke worden gegeven door Onze Minister, hoofd van het betrokken ministerie,
      behoudens bedenkingen van Onze Minister of van het hoofd van de desbetreffende vertegenwoordiging van het
      Koninkrijk in het buitenland, in welk geval gehandeld dient te worden overeenkomstig de regeling welke ter zake
      door Onze Minister, in overeenstemming met Onze Minister, hoofd van het betrokken ministerie, is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '8'
        hoofdstuk: II
  - number: '12.4'
    text: |-
      Voor wat ontwikkelingssamenwerking betreft, worden deze voorschriften en aanwijzingen vastgesteld door Onze
      Minister voor Ontwikkelingssamenwerking.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel12
  - number: '12.5'
    text: |-
      Voor wat economische werkzaamheden betreft, worden deze voorschriften en aanwijzingen vastgesteld op de door Onze
      Minister en Onze Minister van Economische Zaken overeengekomen wijze. Binnen het kader van deze overeenkomst zijn
      de Directeur-Generaal voor de Buitenlandse Economische Betrekkingen, alsmede de Directeur voor Exportbevordering
      en Economische Voorlichting, ter zake van economische onderwerpen bevoegd, onder verantwoordelijkheid van Onze
      Minister van Economische Zaken rechtstreeks bijzondere instructies aan de hoofden der vertegenwoordigingen van het
      Koninkrijk in het buitenland te geven.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister draagt, ook voor degenen, bedoeld in [artikel 5, tweede lid, onder ][ref1], indien zij zijn geplaatst
      op een vertegenwoordiging van het Koninkrijk in het buitenland alsmede degenen, bedoeld onder *b* van dat lid"
      zorg voor de bevordering van de veiligheid, de gezondheid en het welzijn in verband met de arbeid, zulks zoveel als
      mogelijk naar analogie van regelen geldend voor degenen die werkzaam zijn op het departement.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel5
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '5'
        hoofdstuk: II
  - number: '13.2'
    text: |-
      Ter voorbereiding op plaatsing in het buitenland, gedurende plaatsing in het buitenland, en in verband met
      terugplaatsing naar Nederland van ambtenaren van de DBZ, strekt die zorg zich mede uit tot hun gezinsleden. In
      dit kader erkent Onze Minister de bijzondere positie van de huwelijkspartner van de in het buitenland geplaatste
      ambtenaar en de vanuit Nederland uitgezonden werknemer.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel13
  - number: '13.3'
    text: |-
      Bij ministeriële regeling kunnen voor de verwezenlijking van het eerste lid regels worden gesteld. De in het eerste
      lid bedoelden zijn gehouden zich naar die regelen te gedragen en zich er voor in te spannen dat deze voor zover van
      toepassing door hun gezinsleden worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel13
  - number: '13.4'
    text: |-
      Komt aan het gezinsverband in het buitenland van degenen die in het tweede lid van dit artikel zijn genoemd geheel
      of ten dele een eind, dan richt de bevordering van het welzijn zich, binnen door Onze Minister te stellen grenzen,
      en indien door betrokkenen gewenst, mede op de herplaatsing van de repatriërenden in de Nederlandse samenleving of
      andere samenleving van hun keuze.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel13
  - number: '13.5'
    text: |-
      Het eerste tot en met vierde lid is van overeenkomstige toepassing op degenen die op de voet van het
      [derde tot en met zesde lid van artikel 8][ref1] bij een vertegenwoordiging van het Koninkrijk in het buitenland
      zijn gedetacheerd, dan wel daaraan zijn toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '8'
        hoofdstuk: II
  - number: 13.6.a
    text: Onze Minister benoemt één of meer ambtenaren van de DBZ tot contactfunctionaris.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel13
  - number: 13.6.b
    text: |-
      De Contactfunctionaris adviseert en assisteert gezinsleden van overplaatsbare ambtenaren van de DBZ op hun verzoek
      aangaande zaken die verband houden met het persoonlijk welzijn van die gezinsleden in verband met de plaatsing van
      de overplaatsbare ambtenaar van de DBZ in het buitenland, en adviseert Onze Minister aangaande voorzieningen in
      verband met het persoonlijk welzijn van de overplaatsbare ambtenaar van de DBZ en diens gezinsleden.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel13
  - number: '14.1'
    text: |-
      De bepalingen van dit reglement vinden slechts toepassing, voor zover niet bij of krachtens een wet anders is of
      wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel14
  - number: '14.2'
    text: |-
      Bepalingen van dit reglement zijn niet toepasselijk op degenen die in het [tweede lid van artikel 5][ref1] en
      het [derde, vierde en zesde lid van artikel 8][ref2] zijn genoemd ten aanzien van wie een algemene maatregel van
      bestuur of een uit kracht daarvan gegeven voorschrift om bijzondere redenen hun toepasselijkheid uitsluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel8
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '8'
        hoofdstuk: II
  - number: '15'
    text: Onze Minister bepaalt of een functie kan worden vervuld door een werknemer op arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel15
  - number: '16.1'
    text: |-
      Op de ambtenaren van de DBZ zijn van toepassing de [hoofdstukken I tot en met IV][ref1] en
      [XXI tot en met XXV][ref2], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004052#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXXI
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004052
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004052
        hoofdstuk: XXI
  - number: 16.1.a
    text: |-
      op overplaatsbare ambtenaren van de DBZ voorts van toepassing zijn de [hoofdstukken V tot en met XVI][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004052#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004052
        hoofdstuk: V
  - number: 16.1.b
    text: |-
      op niet-overplaatsbare ambtenaren van de DBZ voorts [hoofdstuk XVII][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXVII
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004052
        hoofdstuk: XVII
  - number: 16.1.c
    text: |-
      op tijdelijke ambtenaren van de DBZ voorts [hoofdstuk XVIIA][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXVIIA
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004052
        hoofdstuk: XVIIA
  - number: '16.2'
    text: |-
      Op degenen die ingevolge het [derde en vierde lid van artikel 8][ref1] bij een vertegenwoordiging
      van het Koninkrijk in het buitenland zijn gedetacheerd of toegevoegd, dan wel ingevolge het
      [zesde lid van artikel 8][ref2] aan een tijdelijke diplomatieke zending zijn toegevoegd, zijn van toepassing de
      [hoofdstukken I tot en met III][ref3] en [XXI tot en met XXV][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004052#HoofdstukI
      [ref4]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXXI
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '8'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004052
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0004052
        hoofdstuk: XXI
  - number: '16.3'
    text: |-
      Op werknemers, behorende tot de DBZ, zijn van toepassing de [hoofdstukken I tot en met III][ref1], [XVIII][ref2]
      en [XXI tot en met XXV][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXVIII
      [ref3]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXXI
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004052
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004052
        hoofdstuk: XVIII
      - id: ref3
        bwb_id: BWBR0004052
        hoofdstuk: XXI
  - number: '16.4'
    text: |-
      Op honoraire consulaire ambtenaren, behorende tot de DBZ, zijn van toepassing de
      [hoofdstukken I tot en met III][ref1], [XIX][ref2] en [XXI tot en met XXV][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXIX
      [ref3]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXXI
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004052
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004052
        hoofdstuk: XIX
      - id: ref3
        bwb_id: BWBR0004052
        hoofdstuk: XXI
  - number: '16.5'
    text: |-
      Op honoraire adviseurs, behorende tot de DBZ, zijn van toepassing de [hoofdstukken I tot en met III][ref1] en
      [XX tot en met XXV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXX
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004052
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004052
        hoofdstuk: XX
  - number: '16.6'
    text: |-
      In de artikelen van de in het eerste tot en met vijfde lid genoemde hoofdstukken worden waar nodig bepalingen van
      andere hoofdstukken van overeenkomstige toepassing verklaard, of wordt de toepasselijkheid van artikelen beperkt
      tot een groep of groepen van degenen die daarin zijn genoemd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel16
  - number: '17.1'
    text: 'Ambtenaren van de DBZ kunnen zijn:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel17
  - number: 17.1.a
    text: |-
      overplaatsbare ambtenaren van de DBZ, zijnde ambtenaren van de DBZ die zijn aangesteld om waar ook ter wereld
      werkzaam te zijn;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel17
  - number: 17.1.b
    text: |-
      niet-overplaatsbare ambtenaren van de DBZ, zijnde ambtenaren van de DBZ die zijn aangesteld om hier te lande
      werkzaam te zijn;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel17
  - number: 17.1.c
    text: |-
      tijdelijke ambtenaren van de DBZ, zijnde ambtenaren van de DBZ die hier te lande voor een bepaalde periode
      zijn aangesteld om tijdelijk te worden toegevoegd aan één van de vertegenwoordigingen van het Koninkrijk in het
      buitenland.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel17
  - number: '17.2'
    text: |-
      Of een ambtenaar van de DBZ een overplaatsbaar, een niet-overplaatsbaar dan wel een tijdelijk ambtenaar van de DBZ
      is, blijkt uit de akte van aanstelling.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel17
  - number: '17.3'
    text: |-
      Onze Minister bepaalt of een functie wordt vervuld door een overplaatsbaar, niet-overplaatsbaar dan wel tijdelijk
      ambtenaar van de DBZ. Bij ministeriële regeling kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel17
  - number: '18.1'
    text: De aanstelling geschiedt in vaste of tijdelijke dienst.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel18
  - number: '18.2'
    text: Aan een aanstelling in vaste dienst gaat in de regel vooraf een aanstelling in tijdelijke dienst.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel18
  - number: '18.3'
    text: Aanstelling in tijdelijke dienst geschiedt voor bepaalde of onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel18
  - number: '18.4'
    text: 'Aanstelling in tijdelijke dienst kan plaatsvinden:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel18
  - number: 18.4.a
    text: |-
      voor een proeftijd van ten hoogste twee jaar, zo nodig ambtshalve te verlengen met de tijd gedurende welke
      de overplaatsbare ambtenaar de proeftijd niet in werkelijke dienst heeft doorgebracht. Op aanvraag van de
      overplaatsbare ambtenaar van de DBZ kan de termijn van twee jaar met één jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel18
  - number: 18.4.b
    text: |-
      voor een tijd van ten hoogste drie maanden, indien het antecedenten- en veiligheidsonderzoek, bedoeld in
      [artikel 26][ref1], nog niet is beëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel26
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '26'
        hoofdstuk: V
        paragraaf: '2'
  - number: 18.4.c
    text: van personen die in dienst worden genomen als overplaatsbare ambtenaren van de DBZ, ter opleiding;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel18
  - number: 18.4.d
    text: in de gevallen, waarin dit bij of krachtens algemene maatregel van bestuur is bepaald.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel18
  - number: '18.5'
    text: |-
      Zodra de omstandigheid welke leidde tot een aanstelling in tijdelijke dienst zich niet meer voordoet, wordt een
      aanstelling in vaste dienst verleend, tenzij daartegen uit anderen hoofde bedenkingen bestaan.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel18
  - number: '19.1'
    text: De aanstelling geschiedt door Onze Minister, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel19
  - number: '19.2'
    text: |-
      Indien een aanstelling plaatsvindt in vaste dienst en het aan de rang verbonden maximumsalaris gelijk is aan of
      hoger dan het maximumsalaris van een ambtenaar van de DBZ XV, geschiedt deze bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel19
  - number: '20'
    text: 'Als overplaatsbaar ambtenaar van de DBZ kan worden aangesteld degene die ten tijde van de aanstelling:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel20
  - number: 20.a
    text: de Nederlandse nationaliteit bezit,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel20
  - number: 20.b
    text: |-
      geen volledige of gedeeltelijke leerplicht heeft uit hoofde van de [Leerplichtwet 1969][ref1] (*Stb.* 1968, 303),


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 20.c
    text: |-
      geen verplichtingen heeft ten aanzien van opleiding en oefening uit hoofde van de [Kaderwet dienstplicht][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0008589
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008589
  - number: 20.d
    text: |-
      voldoet aan het in de [artikelen 25][ref1] en [26][ref2] gestelde,


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel26
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '25'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '26'
        hoofdstuk: V
        paragraaf: '2'
  - number: 20.e
    text: |-
      medewerking heeft verleend aan het in [artikel 27][ref1] gestelde,


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel27
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '27'
        hoofdstuk: V
        paragraaf: '2'
  - number: 20.f
    text: |-
      naar het oordeel van Onze Minister voldoet aan de overige normen van bekwaamheid en geschiktheid als overplaatsbaar
      ambtenaar van de DBZ, bedoeld in het derde lid van artikel 22,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel20
  - number: 20.g
    text: bereid is te voldoen aan hetgeen voor betrokkene inzake het afleggen van een eed of belofte is bepaald.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel20
  - number: '21.1'
    text: |-
      Er is een Adviescommissie Aanstellingen Overplaatsbare Ambtenaren DBZ, hierna in dit hoofdstuk te noemen de
      Adviescommissie Aanstellingen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel21
  - number: '21.2'
    text: |-
      De Adviescommissie Aanstellingen bestaat uit twee kamers, te weten Kamer I en Kamer II; deze kamers kunnen naar
      behoefte onderkamers instellen, bestaande uit leden van de Adviescommissie Aanstellingen. Kamers en onderkamers
      tellen een oneven aantal leden.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel21
  - number: '21.3'
    text: |-
      De Adviescommissie Aanstellingen heeft een voorzitter en één of meer plaatsvervangende voorzitters, welke evenals
      de overige leden der Adviescommissie Aanstellingen door Onze Minister worden benoemd en ontslagen. De voorzitter
      is tevens voorzitter van Kamer I, de plaatsvervangende voorzitter dan wel één der plaatsvervangende voorzitters is
      voorzitter van Kamer II.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel21
  - number: '21.4'
    text: |-
      De voorzitter ziet toe op een passende bezetting van de in het tweede lid genoemde onderkamers, en op een juiste
      toepassing van de normen en regelen, bedoeld in het [derde en vierde lid van artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel22
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: '21.5'
    text: |-
      Kamer I van de Adviescommissie Aanstellingen telt ten minste zeven en ten hoogste dertien leden. Wanneer Onze
      Minister een Directeur-Generaal tot lid van Kamer I heeft benoemd, kan deze bij verhindering zijn plaatsvervanger
      aanwijzen. Het merendeel van de leden van deze kamer wordt benoemd uit de overplaatsbare ambtenaren van de
      DBZ. Ten minste één en ten hoogste drie van de leden worden benoemd in overeenstemming met Onze Minister van
      Economische Zaken. Onderkamers van Kamer I tellen ten minste vijf leden, van wie ten minste één lid wordt benoemd
      in overeenstemming met Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel21
  - number: '21.6'
    text: |-
      Kamer II van de Adviescommissie Aanstellingen telt ten minste vijf leden, onder wie één of meer vertegenwoordigers
      van de personeelsdienst, zonder dat die vertegenwoordigers een meerderheid vormen. De leden worden benoemd uit de
      ambtenaren van de DBZ; ten minste één lid van Kamer II en elk van haar onderkamers is een overplaatsbaar ambtenaar
      van de DBZ. Onderkamers van Kamer II tellen ten minste drie leden.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel21
  - number: '21.7'
    text: |-
      Onze Minister ontslaat leden-ambtenaren uiterlijk wanneer zij ophouden actief dienend ambtenaar van de DBZ te zijn,
      en leden-niet-ambtenaren uiterlijk wanneer zij de 70-jarige leeftijd hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel21
  - number: '21.8'
    text: Onze Minister voegt een secretaris aan de Adviescommissie Aanstellingen toe.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel21
  - number: '22.1'
    text: 'De Adviescommissie Aanstellingen heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel22
  - number: 22.1.a
    text: |-
      na een toelatingsonderzoek Onze Minister te adviseren over het aangaan van een dienstverband met kandidaten voor
      een loopbaan als overplaatsbaar ambtenaar van de DBZ;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel22
  - number: 22.1.b
    text: |-
      na examinering Onze Minister te adviseren over het hernieuwen van het dienstverband van ambtenaren van de DBZ, na
      afloop van de eerste opleiding bedoeld in [artikel 29][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel29
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '29'
        hoofdstuk: V
        paragraaf: '4'
  - number: 22.1.c
    text: |-
      Onze Minister te adviseren met betrekking tot ontheffingen als bedoeld in de [artikelen 24][ref1] en [112][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel112
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '24'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '112'
        hoofdstuk: XVII
  - number: 22.2.a
    text: |-
      Kamer I van de Adviescommissie Aanstellingen onderzoekt kandidaten en examineert ambtenaren, bedoeld in het eerste
      lid, welke hun loopbaan als overplaatsbaar ambtenaar van de DBZ aanvangen of aangevangen zijn in de rang van
      ambtenaar van de DBZ X of hoger;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel22
  - number: 22.2.b
    text: |-
      Kamer II van de Adviescommissie Aanstellingen onderzoekt kandidaten en examineert ambtenaren, bedoeld in het eerste
      lid, welke hun loopbaan als overplaatsbaar ambtenaar van de DBZ aanvangen of aangevangen zijn in een rang beneden
      de rang van ambtenaar van de DBZ X, met inachtneming van de tweede volzin van [artikel 29, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel29
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '29'
        hoofdstuk: V
        paragraaf: '4'
  - number: '22.3'
    text: |-
      Ten behoeve van beide kamers van de Adviescommissie Aanstellingen, stelt Onze Minister normen van bekwaamheid en
      geschiktheid vast, waaraan kandidaten, dan wel ambtenaren, in het eerste lid bedoeld, bij het toelatingsonderzoek,
      dan wel bij het examen na afloop van de eerste opleiding ten minste dienen te voldoen. Met betrekking tot Kamer
      II kunnen deze normen zonodig naar wervingsgroep worden onderscheiden. Normen welke betrekking hebben op economie
      of ontwikkelingssamenwerking, worden niet vastgesteld dan na overleg met Onze Minister van Economische Zaken
      respectievelijk Onze Minister voor Ontwikkelingssamenwerking.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel22
  - number: '22.4'
    text: |-
      Onze Minister kan in het belang van de dienst nadere regelen stellen met betrekking tot de werkzaamheden van de
      Adviescommissie Aanstellingen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel22
  - number: '23.1'
    text: |-
      Kandidaten voor een loopbaan als overplaatsbaar ambtenaar van de DBZ dienen een toelatingsonderzoek te ondergaan,
      behoudens in het geval, voorzien in [artikel 112, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel112
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '112'
        hoofdstuk: XVII
  - number: '23.2'
    text: |-
      Dit toelatingsonderzoek wordt gehouden door de Adviescommissie Aanstellingen, op door Onze Minister te bepalen
      tijdstippen en plaats. Kandidaten worden door de Adviescommissie Aanstellingen door toedoen van haar secretaris
      opgeroepen, onder vermelding van de in [artikel 24][ref1] genoemde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel24
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '24'
        hoofdstuk: V
        paragraaf: '2'
  - number: '23.3'
    text: |-
      Bij het toelatingsonderzoek worden kandidaten onderzocht op hun bekwaamheid en geschiktheid als overplaatsbaar
      ambtenaar van de DBZ aan de hand van de in het [derde lid van artikel 22][ref1] bedoelde normen. Kandidaten worden
      tijdig ingelicht over deze normen. Het onderzoek omvat mede het verifiëren en zonodig aanvullen van de gegevens die
      door de kandidaten desgevraagd zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel22
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: '23.4'
    text: |-
      Indien de Adviescommissie Aanstellingen daartoe aanleiding ziet kan deze een niet-aangestelde kandidaat nog eenmaal
      in de gelegenheid stellen aan het toelatingsonderzoek deel te nemen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel23
  - number: '23.5'
    text: |-
      De kosten van het toelatingsonderzoek komen voor rekening van het Rijk. Hier te lande daartoe gemaakte reis- en
      verblijfkosten worden vergoed op de voet van het [Reisbesluit binnenland][ref1] met dien verstande dat de kandidaat
      voor de toepassing van dat besluit gelijk wordt gesteld met een overplaatsbaar ambtenaar van de DBZ.


      [ref1]: https://wetten.overheid.nl/BWBR0005889
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005889
  - number: '24.1'
    text: 'Aan het toelatingsonderzoek door Kamer I van de Adviescommissie Aanstellingen kunnen deelnemen kandidaten die:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel24
  - number: 24.1.a
    text: |-
      bij de aanvang van het onderzoek zijn afgestudeerd aan een Nederlandse universiteit of hogeschool, dan wel een
      daarmee door Onze Minister van Onderwijs en Wetenschappen op één lijn gestelde buitenlandse instelling van hoger
      onderwijs. Onze Minister kan, na advies van de Adviescommissie Aanstellingen, kandidaten die niet aan dit vereiste
      voldoen, maar op grond van een andere opleiding en voor de DBZ van belang zijnde ervaring met die afgestudeerden
      op één lijn kunnen worden gesteld, op hun aanvraag van dit vereiste ontheffen. De Adviescommissie Aanstellingen kan
      kandidaten van wie het afstuderen aanstaande is, toestaan aan het toelatingsonderzoek deel te nemen; aanstelling
      kan eerst na afstuderen geschieden;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel24
  - number: 24.1.b
    text: |-
      bij de aanvang van de eerste opleiding bedoeld in [artikel 29][ref1] de leeftijd van 32 jaar nog niet hebben
      bereikt, tenzij Onze Minister in bijzondere gevallen om redenen van dienstbelang, na advies van de Adviescommissie
      Aanstellingen, ontheffing verleent van dit vereiste. Onze Minister kan de in de vorige volzin genoemde
      leeftijdsgrens voor vrouwen verhogen tot 33 jaar, voor zolang zulks wenselijk is in het kader van het streven tot
      vergroting van het aantal vrouwelijke hogere ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel29
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '29'
        hoofdstuk: V
        paragraaf: '4'
  - number: '24.2'
    text: |-
      Aan het toelatingsonderzoek door Kamer II van de Adviescommissie Aanstellingen kunnen deelnemen kandidaten
      die bij de aanvang van het onderzoek voldoen aan door Onze Minister bepaalde, zonodig naar wervingsgroep te
      onderscheiden vereisten van leeftijd, opleiding en ervaring. Onze Minister kan in bijzondere gevallen om redenen
      van dienstbelang, na advies van de Adviescommissie Aanstellingen, ontheffing verlenen van deze vereisten.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel24
  - number: '25.1'
    text: |-
      Een aanstelling als overplaatsbaar ambtenaar van de DBZ wordt slechts verleend nadat de kandidaat op grond van de
      uitslag van een geneeskundige keuring door de Bgd geschikt is verklaard voor dienstverrichting waar ook ter wereld.
      De gezinsleden dan wel de aanstaande huwelijkspartner van de kandidaat worden in de gelegenheid gesteld via een
      geneeskundige keuring inzicht te verwerven in hun geschiktheid tot verblijf waar ook ter wereld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel25
  - number: '25.2'
    text: |-
      Een aanstelling in tijdelijke dienst kan ook worden verleend nadat de kandidaat voorwaardelijk geschikt
      is verklaard, tenzij het gaat om een aanstelling in tijdelijke dienst ter opleiding, als bedoeld in het
      [vierde lid van artikel 18, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel18
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '18'
        hoofdstuk: V
        paragraaf: '1'
  - number: '25.3'
    text: |-
      Indien de kandidaat niet geschikt is verklaard, kan aan deze in bijzondere gevallen een aanstelling worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel25
  - number: '25.4'
    text: |-
      De kosten van de keuring dan wel keuringen, bedoeld in het eerste lid, komen voor rekening van het Rijk. Hier te
      lande daartoe gemaakte reis- en verblijfkosten worden vergoed op de voet van het [Reisbesluit binnenland][ref1]
      met dien verstande dat de kandidaat voor de toepassing van dat besluit wordt gelijkgesteld met een overplaatsbaar
      ambtenaar van de DBZ. Buitenslands gemaakte reis- en verblijfkosten worden alleen na voorafgaande goedkeuring door
      Onze Minister, vergoed tot het goedgekeurde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005889
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005889
  - number: '25.5'
    text: De uitslag van de keuring wordt uiterlijk binnen veertien dagen na vaststelling aan de onderzochte(n) medegedeeld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel25
  - number: '25.6'
    text: |-
      Indien de kandidaat binnen veertien dagen na ontvangst van deze mededeling daartoe een verzoek indient, vindt een
      herkeuring van de kandidaat of van gezinsleden plaats, mits tevens een door Onze Minister van Binnenlandse Zaken
      vastgesteld bedrag is gestort.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel25
  - number: '25.7'
    text: |-
      De kandidaat krijgt het bedrag, bedoeld in het zesde lid, terug en ontvangt een vergoeding van reis- en
      verblijfkosten overeenkomstig het gestelde in het vierde lid, indien deze of één van de gezinsleden bij
      de herkeuring in plaats van ongeschikt, voorwaardelijk of onvoorwaardelijk geschikt, dan wel in plaats van
      voorwaardelijk geschikt onvoorwaardelijk geschikt is verklaard.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel25
  - number: '25.8'
    text: |-
      De bij koninklijk besluit dan wel door Onze Minister van Binnenlandse Zaken vastgestelde voorschriften ter zake van
      de herkeuring, worden in acht genomen. Deze herkeuring mag niet worden verricht door de arts die de keuring heeft
      verricht.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel25
  - number: '25.9'
    text: |-
      Bij wijziging van een tijdelijk in een vast dienstverband, vindt slechts dan opnieuw een geneeskundige keuring
      plaats indien:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel25
  - number: 25.9.a
    text: de kandidaat voorwaardelijk geschikt was verklaard;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel25
  - number: 25.9.b
    text: over de geschiktheid van de kandidaat ernstige twijfel is gerezen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel25
  - number: '26.1'
    text: |-
      Een aanstelling als overplaatsbaar ambtenaar van de DBZ voor de tijd van langer dan drie maanden wordt slechts
      verleend indien op grond van de uitslag van een ten aanzien van de belanghebbende ingesteld antecedentenonderzoek
      en veiligheidsonderzoek tegen dienstverrichting als overplaatsbaar ambtenaar van de DBZ naar het oordeel van Onze
      Minister geen bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel26
  - number: '26.2'
    text: |-
      Het bepaalde bij of krachtens [artikel 8 van het ARAR][ref1] is van overeenkomstige toepassing; de door
      overplaatsbare ambtenaren van de DBZ te vervullen functies zijn vertrouwensfuncties.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel8
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '8'
  - number: '27.1'
    text: |-
      Alvorens tot een aanstelling als overplaatsbaar ambtenaar van de DBZ over te gaan, laat Onze Minister als regel een
      psychologisch onderzoek verrichten.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel27
  - number: '27.2'
    text: Onze Minister brengt het psychologisch advies ter vertrouwelijke kennis van de Adviescommissie Aanstellingen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel27
  - number: '27.3'
    text: |-
      De Adviescommissie Aanstellingen betrekt het psychologisch advies op door haar te bepalen wijze bij haar advies aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel27
  - number: '27.4'
    text: |-
      De kosten van het psychologisch onderzoek komen voor rekening van het Rijk. Hier te lande daartoe gemaakte reis-
      en verblijfkosten worden vergoed op de voet van het [Reisbesluit binnenland][ref1], met dien verstande dat de
      kandidaat voor de toepassing van dat besluit wordt gelijkgesteld met een overplaatsbaar ambtenaar van de DBZ.
      Buitenslands gemaakte reis- en verblijfkosten worden alleen na voorafgaande goedkeuring door Onze Minister, vergoed
      tot het goedgekeurde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005889
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005889
  - number: '28.1'
    text: |-
      Aan de overplaatsbare ambtenaar van de DBZ wordt, zo mogelijk vóór indiensttreding, een akte van aanstelling
      uitgereikt, waarin in ieder geval worden vermeld:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel28
  - number: 28.1.a
    text: de naam, voornamen en geboortedatum;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel28
  - number: 28.1.b
    text: de aanstelling als overplaatsbaar ambtenaar van de DBZ;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel28
  - number: 28.1.c
    text: de datum van ingang van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel28
  - number: 28.1.d
    text: of de aanstelling geschiedt in vaste of tijdelijke dienst;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel28
  - number: 28.1.e
    text: |-
      de rang waarin betrokkene is aangesteld, de voor deze geldende salarisschaal, het toegekende salaris, zomede het
      salarisnummer en het tijdstip waarop het salaris voor de eerste maal periodiek zal worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel28
  - number: '28.2'
    text: 'Indien de aanstelling geschiedt in tijdelijke dienst, wordt bovendien in de akte van aanstelling vermeld:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel28
  - number: 28.2.a
    text: of de aanstelling geschiedt voor bepaalde tijd, en zo ja, voor hoe lang, of voor onbepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel28
  - number: 28.2.b
    text: |-
      de toepasselijke, in [artikel 18][ref1] omschreven grond(en) voor de aanstelling in tijdelijke dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel18
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '18'
        hoofdstuk: V
        paragraaf: '1'
  - number: '28.3'
    text: |-
      Indien niet reeds in de akte van aanstelling vermeld, worden aan de overplaatsbare ambtenaar van de DBZ zo spoedig
      mogelijk schriftelijk medegedeeld:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel28
  - number: 28.3.a
    text: |-
      plaats, aanvangstijdstip, duur en inhoud van de voor betrokkene geldende eerste opleiding bedoeld in
      [artikel 29][ref1], dan wel de afdeling, het dienstvak of de vertegenwoordiging van het Koninkrijk in het
      buitenland waar deze diens werkzaamheden zal aanvangen, onder vermelding van de aangewezen standplaats;


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel29
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '29'
        hoofdstuk: V
        paragraaf: '4'
  - number: 28.3.b
    text: |-
      de aan betrokkene mogelijk toegekende voordelen, dan wel voor deze geldende financiële regelingen, onder verwijzing
      naar de desbetreffende kortingsregeling.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel28
  - number: '28.4'
    text: |-
      Aan de overplaatsbare ambtenaar van de DBZ wordt, gelijktijdig met de akte van aanstelling, een exemplaar van
      dit reglement uitgereikt. De betrokkene ontvangt daarbij tevens een exemplaar van de schriftelijk vastgestelde
      en de geldende regelingen en instructies, welke deze bij de vervulling van de dienst heeft na te leven, tenzij
      deze op een voor betrokkene gemakkelijk toegankelijke plaats ter inzage liggen. Wanneer dergelijke regelingen en
      instructies niet schriftelijk zijn vastgesteld, worden deze behoorlijk aan betrokkene ter kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel28
  - number: '29.1'
    text: |-
      Overplaatsbare ambtenaren van de DBZ ontvangen zodra mogelijk na hun aanstelling ter opleiding een, zonodig
      naar wervingsgroepen onderscheiden, eerste opleiding, waarvan plaats, aanvangstijdstip, duur en inhoud door Onze
      Minister worden vastgesteld. Onze Minister kan bepaalde wervingsgroepen, die na het onderzoek door Kamer II van de
      Adviescommissie Aanstellingen werden aangesteld, vrijstellen van de eerste opleiding en het afsluitend examen, en
      daarvoor een introductiecursus zonder examen in de plaats stellen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel29
  - number: '29.2'
    text: |-
      Voor zover zich hiertoe mogelijkheden voordoen, zulks ter beoordeling van Onze Minister, zal de huwelijkspartner,
      dan wel aanstaande huwelijkspartner van de overplaatsbare ambtenaar van de DBZ, in het eerste lid bedoeld,
      in de gelegenheid worden gesteld aan voor deze van belang zijnde onderdelen van de eerste opleiding dan wel
      introductiecursus deel te nemen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel29
  - number: '29.3'
    text: |-
      Kosten ingevolge het eerste en tweede lid komen voor rekening van het Rijk; met betrekking tot terugbetaling is
      [artikel 59, zesde lid, van het ARAR][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel59
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '59'
  - number: '29.4'
    text: |-
      De eerste opleiding wordt afgesloten met een door de Adviescommissie Aanstellingen af te nemen examen, onder
      toepassing van de in het [derde lid van artikel 22][ref1] bedoelde normen. Indien de Adviescommissie Aanstellingen
      daartoe termen aanwezig acht, kan op onderdelen herexamen worden afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel22
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: '29.5'
    text: De betrokkenen worden tijdig ingelicht over de normen waaraan zij bij het examen ten minste dienen te voldoen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel29
  - number: '29.6'
    text: |-
      De Adviescommissie Aanstellingen is bevoegd het oordeel van derden bij dit examen te betrekken, dan wel de
      examinering op onderdelen aan derden op te dragen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel29
  - number: '29.7'
    text: |-
      De Adviescommissie Aanstellingen adviseert Onze Minister aan de hand van de uitkomsten van dit examen, omtrent de
      geschiktheid en bekwaamheid van de betrokkenen tot het vervolgen van hun loopbaan als overplaatsbaar ambtenaar van
      de DBZ.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel29
  - number: '29.8'
    text: |-
      Is Onze Minister na advies van de Adviescommissie Aanstellingen van oordeel dat de betrokkene geschikt en bekwaam
      is tot het vervolgen van diens loopbaan als overplaatsbaar ambtenaar van de DBZ, dan wordt laatstgenoemde met
      directe ingang aangesteld in tijdelijke dienst op de voet van het [vierde lid, onder ][ref1]. Komt Onze Minister na
      genoemd advies tot het oordeel, dat zulks niet het geval is, dan eindigt het dienstverband met betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel18
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '18'
        hoofdstuk: V
        paragraaf: '1'
  - number: 30.1.a
    text: |-
      Plaatsingen van overplaatsbare ambtenaren van de DBZ geschieden hetzij bij het departement, hetzij bij een van de
      vertegenwoordigingen van het Koninkrijk in het buitenland, met inachtneming van [artikel 17, vierde lid][ref1],
      [artikel 36][ref2], [artikel 147, onder ][ref3], alsmede de overige bepalingen van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel147
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '17'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '36'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '147'
        hoofdstuk: XXIII
  - number: 30.1.b
    text: |-
      Plaatsingen in de functie van Secretaris-Generaal alsmede van hoofd van een vertegenwoordiging van het Koninkrijk
      in het buitenland geschieden bij koninklijk besluit, alle overige plaatsingen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
  - number: '30.2'
    text: |-
      De eerste plaatsing van een overplaatsbaar ambtenaar van de DBZ na afloop van de eerste opleiding dan wel
      introductiecursus, duurt in de regel twee jaar. Overige plaatsingen duren in de regel niet korter dan drie jaar.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
  - number: '30.3'
    text: |-
      Bij koninklijk besluit, dan wel door Onze Minister, kan, zowel vóór als gedurende de plaatsing, worden afgeweken
      van het in het tweede lid gestelde om redenen aan het dienstbelang of aan het belang van de desbetreffende
      overplaatsbare ambtenaar van de DBZ en diens gezinsleden ontleend.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
  - number: '30.4'
    text: |-
      Tussen twee plaatsingen in kan Onze Minister een overplaatsbaar ambtenaar van de DBZ om redenen aan het
      dienstbelang ontleend, gedurende ten hoogste twaalf maanden ter beschikking houden. Gedurende deze periode is
      de betrokkene bij het departement belast met studie, gericht op het voortzetten van diens loopbaan, tenzij Onze
      Minister aan de betrokkene andere, tot de in [artikel 6][ref1] genoemde taak van de DBZ behorende, werkzaamheden
      opdraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel6
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '6'
        hoofdstuk: II
  - number: 30.5.a
    text: |-
      De overplaatsbare ambtenaar van de DBZ kan met behoud van diens rechtspositie in uitzonderlijke gevallen ter
      beoordeling van Onze Minister, mits betrokkene aan de eisen van de desbetreffende functie voldoet, op diens
      aanvraag, dan wel met diens instemming hier te lande tijdelijk worden geplaatst in een der voor niet-overplaatsbare
      ambtenaren van de DBZ bestemde functies. Reflecteert naar die functie ook een niet-overplaatsbaar ambtenaar van de
      DBZ die aan de eisen van de desbetreffende functie voldoet, dan heeft deze voorrang.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
  - number: 30.5.b
    text: |-
      Het gestelde onder *a* laat de bevoegdheid van de overplaatsbare ambtenaar van de DBZ om te solliciteren naar een
      voor een niet-overplaatsbaar ambtenaar van de DBZ bestemde functie onverlet. Wordt betrokkene daarin benoemd, dan
      verkrijgt deze met ingang van de dag van benoeming voor de rest van het dienstverband bij de DBZ de rechtspositie
      van niet-overplaatsbaar ambtenaar van de DBZ; is betrokkene reeds aangesteld in vaste dienst, dan blijft deze in
      vaste dienst aangesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
  - number: '30.6'
    text: |-
      Bij plaatsingen van overplaatsbare ambtenaren van de DBZ weegt Onze Minister het dienstbelang en het persoonlijk
      belang van de betrokkene alsmede diens gezinsleden af. Bij die overweging houdt Onze Minister rekening met de
      navolgende factoren:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
  - number: 30.6.a
    text: |-
      de noodzaak van een voortdurende taakvervulling door de DBZ, en in samenhang daarmee van een zo goed en tijdig
      mogelijke bezetting van alle functies;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
  - number: 30.6.b
    text: |-
      de wenselijkheid van een geografische spreiding van de totale loopbaan van de overplaatsbare ambtenaar van de
      DBZ over functies hier te lande en in het buitenland en een daarmee gepaard gaande verbreding en verdieping van
      ervaring;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
  - number: 30.6.c
    text: de voorkeur van de desbetreffende overplaatsbare ambtenaar van de DBZ;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
  - number: 30.6.d
    text: |-
      de persoonlijke omstandigheden van de desbetreffende overplaatsbare ambtenaar van de DBZ en diens gezinsleden,
      waaronder eventuele beperkingen van de plaatsbaarheid waar ook ter wereld, bedoeld in [artikel 31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel31
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '31'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '30.7'
    text: |-
      De voorkeur van de overplaatsbare ambtenaar van de DBZ, bedoeld onder *c* van het zesde lid, kan blijken uit de
      registratie van diens belangstelling en uit diens reflecteren op door Onze Minister als vacant komend gemelde
      functies.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
  - number: '30.8'
    text: |-
      Onze Minister maakt, behoudens in spoedeisende gevallen, uiterlijk acht weken voor de vermoedelijke ingangsdatum
      het besluit tot plaatsing dan wel het besluit de betrokkene ter beschikking te houden, bekend. In het besluit wordt
      vermeld: de ingangsdatum en, in geval van plaatsing, de nieuwe standplaats, de te vervullen functie en de beoogde
      duur van de plaatsing.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
  - number: '30.9'
    text: |-
      Plaatsing van overplaatsbare ambtenaren van de DBZ in economische functies bij de vertegenwoordigingen van het
      Koninkrijk in het buitenland geschiedt door Onze Minister na overleg met Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
  - number: '30.10'
    text: |-
      Overplaatsbare ambtenaren van de DBZ beneden de leeftijd van 21 jaar worden in het algemeen niet in het buitenland
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel30
  - number: '31.1'
    text: |-
      Indien een overplaatsbaar ambtenaar van de DBZ van oordeel is dat diens plaatsbaarheid waar ook ter wereld aan
      beperkingen onderhevig is, meldt deze zulks zo spoedig mogelijk aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel31
  - number: '31.2'
    text: |-
      Onze Minister betrekt beperkingen door omstandigheden van medische aard bij de afwegingen rond de plaatsingen
      van de betrokkene, indien de melding steunt op een verklaring van de Arbo-dienst dan wel op een door die dienst
      onderschreven andere geneeskundige verklaring, welke zo mogelijk moet aangeven in welk opzicht en hoe lang de
      plaatsbaarheid waar ook ter wereld aan beperkingen onderhevig is.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel31
  - number: '31.3'
    text: |-
      Wanneer gezinsleden van de overplaatsbare ambtenaar van de DBZ geen medewerking verlenen aan
      onderzoeken als bedoeld in het [tweede tot en met vierde lid van artikel 57][ref1], is het gestelde in
      [artikel 51, vijfde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel51
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '57'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '51'
        hoofdstuk: X
        paragraaf: '3'
  - number: '31.4'
    text: |-
      Indien de plaatsbaarheid van een overplaatsbaar ambtenaar van de DBZ aan beperkingen onderhevig is, plaatst Onze
      Minister betrokkene zo mogelijk met inachtneming van die beperkingen in één van de functies die voor overplaatsbare
      ambtenaren van de DBZ van diens rang bestemd zijn; blijkt zulks niet verenigbaar met het dienstbelang, dan kan Onze
      Minister bij wijze van uitzondering betrokkene met behoud van diens rang
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel31
  - number: 31.4.a
    text: hetzij ten hoogste twaalf maanden ter beschikking houden;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel31
  - number: 31.4.b
    text: |-
      hetzij met toepassing van [artikel 30, vijfde lid, onder ][ref1], plaatsen in één der voor ambtenaren van diens
      rang bestemde functies die voor niet-overplaatsbare ambtenaren van de DBZ zijn bestemd;


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel30
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '30'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 31.4.c
    text: |-
      hetzij met inachtneming van die beperkingen, in afwijking van [artikel 36][ref1], plaatsen in een naastlager
      gewaardeerde, voor een overplaatsbaar ambtenaar van de DBZ bestemde functie.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel36
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '36'
        hoofdstuk: VII
  - number: '32.1'
    text: |-
      Naast plaatsingen ingevolge [artikel 30][ref1] kan Onze Minister een overplaatsbaar ambtenaar van de DBZ:


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel30
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '30'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 32.1.a
    text: |-
      in overeenstemming met diens betrokken ambtgenoot, plaatsen bij een ander ministerie in een functie die verband
      houdt met de loopbaan van betrokkene bij de DBZ;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel32
  - number: 32.1.b
    text: |-
      in overeenstemming met de leiding van een volkenrechtelijke organisatie waarvan het Koninkrijk lid is, voordragen
      voor, dan wel plaatsen bij die volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel32
  - number: 32.1.c
    text: |-
      in overeenstemming met de regering van de Nederlandse Antillen onderscheidenlijk Aruba, plaatsen bij een der
      ministeries van de Nederlandse Antillen of Aruba;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel32
  - number: 32.1.d
    text: |-
      belasten met een bijzondere opdracht buiten het verband van het Ministerie van Buitenlandse Zaken, mits de aard van
      die opdracht samenhangt met de in [artikel 6][ref1] genoemde taak van de DBZ.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel6
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '6'
        hoofdstuk: II
  - number: '32.2'
    text: |-
      Tot plaatsing als bedoeld in het eerste lid kan slechts worden besloten indien die plaatsing naar het oordeel van
      Onze Minister, mede gezien de loopbaan van betrokkene, in het belang van de dienst is. Artikel 30, tweede lid, is
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel32
  - number: '32.3'
    text: |-
      Plaatsingen, in het eerste lid onder *b, c* en *d* bedoeld, behoeven, ook ten aanzien van standplaats, voorgenomen
      duur van de plaatsing en de in het vijfde lid bedoelde voorwaarden, de voorafgaande instemming van de betrokken
      overplaatsbare ambtenaar van de DBZ.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel32
  - number: '32.4'
    text: |-
      Gedurende plaatsingen, in dit artikel bedoeld, behoudt de betrokkene diens rechtspositie als overplaatsbaar
      ambtenaar van de DBZ zoals omschreven in dit reglement, voor zover zulks verenigbaar is met diens rechtspositie uit
      hoofde van de functie bij het andere Nederlandse ministerie, de volkenrechtelijke organisatie, of het ministerie
      van de Nederlandse Antillen of Aruba, dan wel uit hoofde van de bijzondere opdracht bedoeld in het eerste lid,
      onder *d.* Indien de functie bij de volkenrechtelijke organisatie, bij het ministerie van de Nederlandse Antillen
      of Aruba, dan wel de bijzondere opdracht, dit nodig maakt, is betrokkene ontslagen van de ambtseed met uitzondering
      van de geheimhoudingsplicht.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel32
  - number: '32.5'
    text: |-
      Bij plaatsingen in dit artikel bedoeld, bericht Onze Minister de betrokkene tevoren, welke rechten en
      verplichtingen blijven gelden uit hoofde van het vierde lid, in het bijzonder ten aanzien van zijn bevorderingsgang
      en zijn rechten en plichten ingevolge de [Ambtenarenwet][ref1] en het Pensioenreglement van de Stichting
      Pensioenfonds ABP (Stcrt. 1995, 251). Onze Minister bepaalt, met inachtneming van het zesde lid, welke
      voorzieningen ter zake van bezoldiging alsmede tegemoetkomingen en vergoedingen voor betrokkene in verband met
      bedoelde plaatsing zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: '32.6'
    text: |-
      Bij de vaststelling van de voorzieningen, bedoeld in het vijfde lid, derde volzin, wordt rekening gehouden met de
      gezinsomstandigheden van betrokkene, de aard en de duur van de plaatsing, alsmede met de voorzieningen welke door
      de instantie bij wie de plaatsing geschiedt, worden of kunnen worden verstrekt, één en ander met eerbiediging van
      dwingende bepalingen in een rechtspositieregeling van de desbetreffende instantie.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel32
  - number: '33.1'
    text: |-
      Er is een Adviescommissie Plaatsingen en Benoemingen in Topfuncties bij het Ministerie van Buitenlandse Zaken,
      hierna in dit hoofdstuk te noemen Adviescommissie Topfuncties.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: '33.2'
    text: |-
      De Adviescommissie Topfuncties staat onder voorzitterschap van de Secretaris-Generaal. Voorts maken van de
      Adviescommissie Topfuncties deel uit:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: 33.2.a
    text: het hoofd van de personeelsdienst, tevens plaatsvervangend voorzitter,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: 33.2.b
    text: de Directeuren-Generaal,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: 33.2.c
    text: |-
      de Directeur-Generaal van de Buitenlandse Economische Betrekkingen bij het Ministerie van Economische Zaken, in
      elk geval voor wat betreft de plaatsing van overplaatsbare ambtenaren van de DBZ in de functie van hoofd van een
      vertegenwoordiging van het Koninkrijk in het buitenland alsmede
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: 33.2.d
    text: de Plaatsvervangend Secretaris-Generaal.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: '33.3'
    text: 'De Adviescommissie Topfuncties adviseert Onze Minister vertrouwelijk met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: 33.3.a
    text: |-
      plaatsing van overplaatsbare ambtenaren van de DBZ in de functie van hoofd van een vertegenwoordiging van het
      Koninkrijk in het buitenland, en in andere door Onze Minister aangewezen functies bij de vertegenwoordigingen van
      het Koninkrijk in het buitenland;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: 33.3.b
    text: |-
      plaatsing van overplaatsbare ambtenaren en benoeming van niet-overplaatsbare ambtenaren van de DBZ in een der
      navolgende functies bij het departement:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: 33.3.b.1°
    text: chef van een directie of een hogere functie
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: 33.3.b.2°
    text: chef van een rechtstreeks onder de Secretaris-Generaal ressorterende hoofdafdeling of centrale afdeling
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: 33.3.b.3°
    text: rechtstreeks onder de Secretaris-Generaal ressorterende adviseur.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: '33.4'
    text: |-
      De voorzitter en plaatsvervangend voorzitter van de Adviescommissie Topfuncties hebben vertrouwelijk toegang
      tot alle personeelsgegevens van de in beschouwing te nemen ambtenaren van de DBZ; de overige leden ervan kunnen
      vertrouwelijk kennis nemen van de voor plaatsing of benoeming van belang zijnde personeelsgegevens van de in
      beschouwing te nemen ambtenaren van de DBZ, waaronder de over hen sedert hun voorlaatste bevordering opgemaakte
      beoordelingen en eventuele adviezen van de Arbo-dienst met betrekking tot beperkingen waaraan hun plaatsbaarheid
      waar ook ter wereld onderhevig is.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: '33.5'
    text: Onze Minister voegt een secretaris aan de Adviescommissie Topfuncties toe.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: '33.6'
    text: |-
      Leden van de Adviescommissie Topfuncties nemen niet deel aan beraadslagingen over hun eigen plaatsingen of
      benoemingen; voor die beraadslagingen worden zonodig plaatsvervangende leden van de Adviescommissie Topfuncties
      benoemd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: '33.7'
    text: |-
      De leden van de Adviescommissie Topfuncties en de daaraan toegevoegde secretaris zijn tot geheimhouding verplicht
      met betrekking tot de gegevens en beraadslagingen in de Adviescommissie Topfuncties.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: '33.8'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de werkzaamheden van de
      Adviescommissie Topfuncties.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel33
  - number: '35'
    text: |-
      Overplaatsbare ambtenaren van de DBZ hebben één van de volgende rangen: Overplaatsbare ambtenaren van de DBZ hebben
      één van de volgende rangen:








                  in salarisschaal


                  overeenkomend met:






                  amtenaar van de DBZ I


                  schaal 1


                  BBRA 1984




                  amtenaar van de DBZ II


                  schaal 2


                  BBRA 1984




                  amtenaar van de DBZ III


                  schaal 3


                  BBRA 1984




                  amtenaar van de DBZ IV


                  schaal 4


                  BBRA 1984




                  amtenaar van de DBZ V


                  schaal 5


                  BBRA 1984




                  amtenaar van de DBZ VI


                  schaal 6


                  BBRA 1984




                  amtenaar van de DBZ VII


                  schaal 7


                  BBRA 1984




                  amtenaar van de DBZ VIII


                  schaal 8


                  BBRA 1984




                  amtenaar van de DBZ IX


                  schaal 9


                  BBRA 1984




                  amtenaar van de DBZ X


                  schaal 10


                  BBRA 1984




                  amtenaar van de DBZ XI


                  schaal 11


                  BBRA 1984




                  amtenaar van de DBZ XII


                  schaal 12


                  BBRA 1984




                  amtenaar van de DBZ XIII


                  schaal 13


                  BBRA 1984




                  amtenaar van de DBZ XIV


                  schaal 14


                  BBRA 1984




                  amtenaar van de DBZ XV


                  schaal 15


                  BBRA 1984




                  amtenaar van de DBZ XVI


                  schaal 16


                  BBRA 1984




                  amtenaar van de DBZ XVII


                  schaal 17


                  BBRA 1984




                  amtenaar van de DBZ XVIII


                  schaal 18


                  BBRA 1984




                  amtenaar van de DBZ XIX


                  in salaris overeenkomend met Secretaris-Generaal/Directeur-Generaal, conform bijlage A van het BBRA
      1984;




                  amtenaar van de DBZ XX


                  in salaris overeenkomend met de bezoldiging van staatssecretaris
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel35
  - number: '36'
    text: |-
      Onze Minister stelt na advies van Onze Minister van Binnenlandse Zaken de formatie vast. Onze Minister bepaalt de
      inrichting van het Ministerie van Buitenlandse Zaken met inachtneming van de formatie, volgens met Onze Minister
      van Binnenlandse Zaken overeen te komen regelen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel36
  - number: '37'
    text: |-
      De bevordering van overplaatsbare ambtenaren van de DBZ naar de rang van ambtenaar van de DBZ XV en naar
      hogere rangen geschiedt bij koninklijk besluit op voordracht van Onze Minister. De bevordering van de overige
      overplaatsbare ambtenaren van de DBZ geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel37
  - number: '38'
    text: Bevordering van overplaatsbare ambtenaren van de DBZ geschiedt in de regel naar de naasthogere rang.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel38
  - number: '39.1'
    text: |-
      Om voor bevordering in aanmerking te komen dient de overplaatsbare ambtenaar van de DBZ diens dienst op een
      in ieder opzicht bevredigende wijze te hebben verricht, alsmede bekwaam en geschikt te worden geoordeeld voor
      dienstverrichting op het naasthogere functieniveau.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel39
  - number: '39.2'
    text: |-
      De bevordering dient in overeenstemming te zijn met de formatie voor wat betreft de voor overplaatsbare ambtenaren
      van de DBZ bestemde functies.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel39
  - number: '40'
    text: |-
      Een overplaatsbaar ambtenaar van de DBZ kan bij keuze worden bevorderd tot ambtenaar van de DBZ XX, indien deze is
      benoemd in een functie welke, gezien het belang daarvan voor de bevordering van de internationale rechtsorde en de
      buitenlandse betrekkingen van het Koninkrijk, hoger moet worden gewaardeerd dan ambtenaar van de DBZ XIX, en zich
      tevens bijzonder heeft onderscheiden.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel40
  - number: '41'
    text: |-
      De bevordering van uitzonderlijk bekwaam en geschikt voor bevordering geachte overplaatsbare ambtenaren van de DBZ
      kan ten opzichte van andere overplaatsbare ambtenaren van de DBZ worden versneld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel41
  - number: '42'
    text: |-
      Bij ministeriële regeling worden, passend binnen het door Onze Minister van Binnenlandse Zaken gecoördineerde
      beleid, nadere regels gesteld inzake bevordering en loopbaanvorming.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel42
  - number: '43'
    text: |-
      Er is een Adviescommissie Bevorderingen Overplaatsbare Ambtenaren DBZ, hierna in dit hoofdstuk te noemen de
      Adviescommissie Bevorderingen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel43
  - number: '44.1'
    text: |-
      De Adviescommissie Bevorderingen staat onder voorzitterschap van de Secretaris-Generaal; de plaatsvervangend
      Secretaris-Generaal is plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel44
  - number: '44.2'
    text: |-
      Onze Minister benoemt en ontslaat de overige leden van de Adviescommissie Bevorderingen, welke is samengesteld uit
      ambtenaren van de DBZ onder wie in elk geval de Hoofddirecteur Dienst Buitenlandse Zaken, met dien verstande dat de
      meerderheid bestaat uit overplaatsbare ambtenaren van de DBZ.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel44
  - number: '44.3'
    text: De Adviescommissie Bevorderingen kan sub-commissies uit haar midden benoemen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel44
  - number: '44.4'
    text: Onze Minister voegt één of meer secretarissen aan de Adviescommissie Bevorderingen toe.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel44
  - number: '45.1'
    text: |-
      Alvorens een voordracht tot bevordering van een overplaatsbaar ambtenaar van de DBZ te doen, dan wel daartoe zelf
      over te gaan, wint Onze Minister het vertrouwelijk advies in van de Adviescommissie Bevorderingen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel45
  - number: '45.2'
    text: |-
      Minstens éénmaal per jaar ontvangt de Adviescommissie Bevorderingen per rang en in volgorde van anciënniteit een
      opgave van de overplaatsbare ambtenaren van de DBZ die met inachtneming van [artikel 42][ref1] voor bevordering in
      beschouwing moeten worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel42
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '42'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '45.3'
    text: |-
      Onze Minister stelt ten behoeve van de Adviescommissie Bevorderingen, zo nodig naar rang onderscheiden, normen vast
      voor de bepaling van de bekwaamheid en geschiktheid voor bevordering.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel45
  - number: '45.4'
    text: |-
      De voorzitter en plaatsvervangend voorzitter van de Adviescommissie Bevorderingen hebben vertrouwelijk toegang tot
      alle personeelsgegevens van de voor bevordering in beschouwing te nemen overplaatsbare ambtenaren van de DBZ; de
      overige leden ervan kunnen vertrouwelijk kennisnemen van de voor bevordering van belang zijnde personeelsgegevens
      van de in beschouwing te nemen overplaatsbare ambtenaren van de DBZ, waaronder de over hen sedert hun voorlaatste
      bevordering opgemaakte beoordelingen en eventuele adviezen van de Arbo-dienst met betrekking tot beperkingen
      waaraan hun plaatsbaarheid waar ook ter wereld onderhevig is.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel45
  - number: '45.5'
    text: |-
      Leden van de Adviescommissie Bevorderingen nemen niet deel aan beraadslagingen over hun eigen bevordering; voor die
      beraadslagingen worden zonodig plaatsvervangende leden van de Adviescommissie Bevorderingen benoemd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel45
  - number: '45.6'
    text: |-
      De leden en de secretaris van de Adviescommissie Bevorderingen zijn tot geheimhouding verplicht met betrekking
      tot de in het vierde lid bedoelde gegevens en met betrekking tot de beraadslagingen in de Adviescommissie
      Bevorderingen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel45
  - number: '45.7'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de werkzaamheden van de
      Adviescommissie Bevorderingen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel45
  - number: '46.1'
    text: |-
      Behalve de eerste opleiding en introductiecursus, bedoeld in [artikel 29][ref1], en de dienstopdracht tot studie
      gedurende het terbeschikkinghouden, bedoeld in [artikel 30, vierde lid][ref2], kan de overplaatsbare ambtenaar van
      de DBZ gedurende diens loopbaan in het belang van de dienst worden verplicht om scholing te volgen voor zover dat
      redelijkerwijs van hem kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel30
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '29'
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '30'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '46.2'
    text: |-
      Is een in het eerste lid bedoelde verplichting opgelegd, dan zal voor zover zich hiertoe mogelijkheden voordoen
      de huwelijkspartner van de overplaatsbare ambtenaar van de DBZ in de gelegenheid worden gesteld aan voor deze van
      belang zijnde onderdelen van deze scholing deel te nemen, zulks ter beoordeling van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel46
  - number: '46.3'
    text: |-
      Ten aanzien van kosten voor de scholing, scholingsverlof en terugbetalingsverplichtingen is
      [artikel 59, tweede tot en met zesde lid, van het ARAR][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel59
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '59'
  - number: '46.4'
    text: Bij ministeriële regeling kunnen ten aanzien van dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel46
  - number: '47'
    text: |-
      Ten aanzien van de overplaatsbare ambtenaar van de DBZ die op eigen initiatief scholing gaat volgen, is
      [artikel 60 van het ARAR][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel60
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '60'
  - number: '48.1'
    text: |-
      De vaststelling van de salarisschaal welke voor de overplaatsbare ambtenaar van de DBZ zal gelden, geschiedt met
      inachtneming van de [artikelen 35][ref1] en [36][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel36
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '35'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '36'
        hoofdstuk: VII
  - number: '48.2'
    text: Ten aanzien van
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
  - number: 48.2.a
    text: de tijdstippen van uitbetaling van het salaris, de toelagen en de vergoedingen voor extra diensten,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
  - number: 48.2.b
    text: de toekenning van het salaris in de voor de overplaatsbare ambtenaar geldende salarisschaal,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
  - number: 48.2.c
    text: |-
      de toekenning van periodieke salarisverhogingen op grond van in voldoende mate functioneren en het achterwege laten
      daarvan bij het niet in voldoende mate functioneren,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
  - number: 48.2.d
    text: |-
      de toekenning van extra periodieke salarisverhogingen op grond van meer dan in voldoende mate functioneren dan wel
      op andere gronden,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
  - number: 48.2.e
    text: de toekenning van eenmalige of periodieke toeslagen, alsmede de intrekking van toegekende periodieke toeslagen,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
  - number: 48.2.f
    text: de vaststelling van het salaris na bevordering tot een hogere rang,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
  - number: 48.2.g
    text: de vaststelling van het salaris bij een onvolledige werktijd,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
  - number: 48.2.h
    text: |-
      de, op grond van uitstekend functioneren, verhoging van het salaris van de overplaatsbare ambtenaar die het maximum
      van de voor hem geldende salarisschaal heeft bereikt en de intrekking daarvan,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
  - number: 48.2.i
    text: |-
      de toekenning van een toelage bij de tijdelijke waarneming van een andere functie dan die waarin de overplaatsbare
      ambtenaar is geplaatst, wanneer aan eerstbedoelde functie een salarisschaal met een hoger maximumsalaris is
      verbonden dan aan de rang en de daarmee samenhangende salarisschaal welke voor betrokkene geldt,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
  - number: 48.2.j
    text: de toekenning van een vakantie-uitkering,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
  - number: 48.2.k
    text: de toekenning van een toelage wanneer het salaris minder is dan het maandbedrag van het wettelijke minimumloon,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
  - number: 48.2.l
    text: |-
      de toekenning van een toelage wanneer, anders dan bij wijze van overwerk, regelmatig of vrij regelmatig arbeid op
      het departement wordt verricht op andere tijden dan maandag tot en met vrijdag tussen 08.00 en 18.00 uur,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
  - number: 48.2.m
    text: |-
      de toekenning van een toelage of uitkering aan de overplaatsbare ambtenaar of aan een groep overplaatsbare
      ambtenaren, op andere dan de in dit lid onder *h* tot en met *l* bedoelde gronden,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
  - number: 48.2.n
    text: |-
      de vermindering van het salaris van de ambtenaar die arbeidsgehandicapt is in de zin van
      [artikel 2 van de Wet op de (re)ïntegratie arbeidsgehandicapten][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
  - number: 48.2.o
    text: |-
      het deelnemen aan een premiespaarregeling als bedoeld in
      [artikel 11, zesde lid, van de Wet op de loonbelasting 1964][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
  - number: '48.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de toekenning aan overplaatsbare ambtenaren van de DBZ van
      een mobiliteitstoeslag als bedoeld in [artikel 22c van het BBRA 1984][ref1] zoveel mogelijk overeenkomstig genoemd
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel22c
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: 22c
  - number: '48.4'
    text: |-
      Voor de in dit hoofdstuk gehanteerde begrippen salaris, salarisnummer, maximumsalaris en bezoldiging is de
      omschrijving in [artikel 2 van het BBRA 1984][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel2
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '2'
  - number: '49.1'
    text: |-
      Indien het dienstbelang het onvermijdelijk maakt dat aan een hier te lande geplaatste overplaatsbaar ambtenaar
      van de DBZ arbeid buiten de voor deze vastgestelde arbeidsuren wordt opgedragen, waardoor het voor betrokkene
      per werkperiode geldende aantal arbeidsuren wordt overschreden, dan wordt ter zake een vergoeding toegekend
      overeenkomstig artikel 23 van het BBRA 1984.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel49
  - number: '49.2'
    text: |-
      Ten aanzien van een hier te lande geplaatste overplaatsbaar ambtenaar, wiens werktijden bij dienstrooster
      zijn vastgesteld en aan wie arbeid wordt opgedragen, waardoor binnen een werkperiode als bedoeld in
      [artikel 23, vierde lid, onder ][ref1] de voor hem vastgestelde werktijden worden verschoven, is [artikel 17][ref2]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel17a
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: 17a
  - number: '50'
    text: |-
      Het gestelde in [artikel 49, eerste lid][ref1], is van overeenkomstige toepassing op in het buitenland geplaatste
      overplaatsbare ambtenaren van de DBZ, met dien verstande dat een vergoeding wordt toegekend op grond van bij
      ministeriële regeling gestelde regels. Deze regels houden rekening met de bijzondere omstandigheden van het
      werkzaam zijn bij een vertegenwoordiging van het Koninkrijk in het buitenland.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel49
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '49'
        hoofdstuk: X
        paragraaf: '2'
  - number: '51.1'
    text: |-
      Naast salaris worden aan de buiten Nederland geplaatste overplaatsbare ambtenaar van de DBZ tegemoetkomingen
      verleend in de kosten van betrokkene en van diens gezinsleden, welke verband houden met diens verblijf in het
      buitenland, alsmede die kosten welke verband houden met de aard en het niveau van diens functie. Onze Minister
      treft ter zake regelen, en is belast met de vaststelling van genoemde tegemoetkomingen, welke strekken ter
      bestrijding van beroepskosten.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel51
  - number: '51.2'
    text: |-
      Onze Minister bepaalt per geval in welke muntsoort of muntsoorten de salariëring en tegemoetkomingen worden
      uitgekeerd welke voor rekening van het Ministerie van Buitenlandse Zaken worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel51
  - number: '51.3'
    text: |-
      De overplaatsbare ambtenaar van de DBZ die, uit het buitenland komende, in Nederland is geplaatst en voor wie uit
      die plaatsing bijzondere kosten voortvloeien, wordt voor ten hoogste zes jaren na de aanvang van de plaatsing in
      Nederland een tegemoetkoming toegekend in die kosten, volgens door Onze Minister vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel51
  - number: '51.4'
    text: |-
      Omtrent de tegemoetkoming in kosten voor de tijdelijke waarneming door de overplaatsbare ambtenaar van de DBZ van
      een andere functie dan die waarin deze is geplaatst, worden met betrekking tot functies in het buitenland door Onze
      Minister regelen gesteld; vloeien uit die waarneming voor de overplaatsbare ambtenaar van de DBZ als zodanig direct
      aanwijsbare kosten, of op geld waardeerbare schade voort, dan worden die vergoed.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel51
  - number: '51.5'
    text: |-
      Wanneer gezinsleden dan wel de aanstaande gezinsleden van de in [artikel 25][ref1] genoemde kandidaat geen gebruik
      hebben gemaakt van de aldaar vermelde gelegenheid tot geneeskundige keuring, dan wel indien zij na keuring niet
      geschikt zijn verklaard voor verblijf overal ter wereld, heeft de desbetreffende kandidaat na aanstelling als
      overplaatsbaar ambtenaar van de DBZ ten aanzien van die gezinsleden of aanstaande gezinsleden geen aanspraak uit
      hoofde van financiële regelingen welke in dit reglement zijn opgenomen ten behoeve van vergezellende gezinsleden
      bij plaatsing van de desbetreffende overplaatsbare ambtenaar van de DBZ in het buitenland, voor zover deze
      financiële regelingen direct verband houden met de gezondheidstoestand van gezinsleden.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel25
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '25'
        hoofdstuk: V
        paragraaf: '2'
  - number: '52'
    text: |-
      Op overplaatsbare ambtenaren van de DBZ zijn de [artikelen 16 tot en met 20][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel16
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '16'
  - number: '53.1'
    text: |-
      Voor de hier te lande geplaatste overplaatsbare ambtenaar van de DBZ zijn de
      [artikelen 21 tot en met 21i van het ARAR][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '21'
  - number: '53.2'
    text: |-
      Voor de bij een vertegenwoordiging van het Koninkrijk in het buitenland geplaatste ambtenaar van de DBZ is
      [artikel 21 van het ARAR][ref1] eveneens van overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '21'
  - number: 53.2.a
    text: 'het hoofd van de desbetreffende vertegenwoordiging:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel53
  - number: 53.2.a.1°
    text: |-
      het bevoegd gezag is, bedoeld in het eerste lid van [artikel 21 van het ARAR][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '21'
  - number: 53.2.a.2°
    text: |-
      bij het vaststellen van een werktijdregeling rekening houdt met dienst- en werktijdregelingen welke bij de
      overheidsdienst in het land zijner vestiging gelden;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel53
  - number: 53.2.a.3°
    text: |-
      daarbij voorzieningen treft welke ertoe strekken dat die vertegenwoordiging van het Koninkrijk in het buitenland
      ononderbroken bezet of bereikbaar is;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel53
  - number: 53.2.a.4°
    text: door Onze Minister ter zake gegeven nadere aanwijzingen volgt;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel53
  - number: 53.2.b
    text: |-
      voor de toepassing van het zesde lid van [artikel 21 van het ARAR][ref1] voor «ten hoogste één jaar» gelezen
      wordt: ten hoogste de plaatsing, en dat voor «mits de Arbo-dienst daaromtrent een positief medisch advies
      heeft uitgebracht» gelezen wordt: mits de Arbo-dienst daaromtrent jaarlijks een positief medisch advies heeft
      uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '21'
  - number: '53.3'
    text: |-
      Voor de bij een vertegenwoordiging van het Koninkrijk in het buitenland geplaatste ambtenaar van de DBZ zijn de
      [artikelen 21c tot en met 21i van het ARAR][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21c
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21c
  - number: 53a
    text: |-
      Voor de in het buitenland geplaatste overplaatsbare ambtenaar van de DBZ is [artikel 21][ref1] niet van toepassing,
      tenzij Onze Minister in bijzondere gevallen anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21a
  - number: 54.1.a
    text: |-
      Op de in Nederland geplaatste overplaatsbare ambtenaren van de DBZ zijn de
      [artikelen 22 tot en met 34g van het ARAR][ref1] en de [artikelen 21][ref2] en [22 van het BBRA 1984][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel22
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0003630
        artikel: '22'
  - number: 54.1.b
    text: |-
      Indien het verlof, bedoeld in [artikel 34 van het ARAR][ref1], ten doel heeft de overplaatsbare ambtenaar van de
      DBZ in de gelegenheid te stellen de huwelijkspartner, indien deze als overplaatsbaar ambtenaar van de DBZ wordt
      geplaatst bij een vertegenwoordiging van het Koninkrijk in het buitenland, te vergezellen, wordt dat verlof niet
      uitsluitend het persoonlijk belang van de ambtenaar, doch mede het algemeen belang geacht te dienen. In dit geval
      kan het verlof in beginsel voor de duur van de uitzending van de huwelijkspartner, zonder behoud van bezoldiging,
      worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel34
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '34'
  - number: '54.2'
    text: |-
      Op de in het buitenland geplaatste overplaatsbare ambtenaren van de DBZ zijn de [artikelen 21][ref1] en
      [22 van het BBRA 1984][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel22
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '22'
  - number: '54.3'
    text: |-
      Bij ministeriële regeling worden, zonodig ten dele naar vertegenwoordiging van het Koninkrijk in het buitenland
      onderscheiden, regels gesteld betreffende de vakantie en het verlof van de in het buitenland geplaatste
      overplaatsbare ambtenaar van de DBZ, welke ertoe strekken dat de vakantie en het verlof niet achterblijven bij
      de vakantie die en het verlof dat de betrokkene zou genieten als deze in Nederland zou zijn geplaatst. Daarbij
      houdt Onze Minister rekening met de bijzondere omstandigheden van de plaatsing in het buitenland. Vakantie wordt
      genoten met behoud van volle bezoldiging; verlof wordt genoten met behoud van volle bezoldiging, indien zulks bij
      toepassing van de [artikelen 32 tot en met 34g van het ARAR][ref1] het geval zou zijn. Onze Minister bepaalt, in
      hoeverre:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel32
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '32'
  - number: 54.3.a
    text: bij vakantie en verlof reistijd als diensttijd wordt beschouwd;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
  - number: 54.3.b
    text: |-
      reis- en verblijfkosten van betrokkene en diens gezinsleden welke verband houden met vakantie en verlof, voor
      rekening van het Rijk komen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
  - number: 54.3.c
    text: |-
      bij vakantie en verlof wijziging komt in de in het [eerste lid van artikel 51][ref1] genoemde tegemoetkomingen, met
      dien verstande dat tegemoetkomingen in of vergoedingen van vaste lasten daarbij gehandhaafd blijven;


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel51
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '51'
        hoofdstuk: X
        paragraaf: '3'
  - number: 54.3.d
    text: |-
      bij verlofreizen voor zover deze voor rijksrekening komen, in bijzondere gevallen de reis- en verblijfkosten voor
      huishoudelijk personeel kunnen worden vergoed.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
  - number: '54.4'
    text: |-
      Ouderschapsverlof als bedoeld in [artikel 33][ref1] wordt behoudens in bijzondere gevallen genoten gedurende een
      plaatsing in Nederland. Bij ministeriële regeling kunnen nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '33'
  - number: '54.5'
    text: |-
      Gedurende plaatsing bij een vertegenwoordiging van het Koninkrijk in het buitenland is
      [artikel 33h van het ARAR][ref1] van overeenkomstige toepassing, met dien verstande dat voor «adoptie van een kind
      in het buitenland», als bedoeld in het tweede lid van genoemd artikel, wordt gelezen: adoptie van een kind in een
      ander land dan het land waarin de ambtenaar is geplaatst. Ingeval naar het oordeel van Onze Minister redenen van
      zwaarwegend dienstbelang daartoe noodzaken, kan Onze Minister besluiten dat het adoptieverlof gedurende plaatsing
      in het buitenland op een andere wijze wordt genoten dan vermeld in het tweede lid van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33h
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33h
  - number: '54.6'
    text: |-
      Indien een overplaatsbaar ambtenaar van de DBZ buiten Nederland in samenhang met diens functie onwettig wordt
      gegijzeld of anderszins buiten Nederland onwettig van de vrijheid wordt beroofd op een wijze die door Onze Minister
      met gijzeling gelijk wordt gesteld, verleent deze aan betrokkene na afloop daarvan, onverminderd de mogelijkheid
      van bedrijfsgeneeskundige begeleiding ingevolge de bepalingen van [hoofdstuk XIII][ref1], naar billijkheid
      recuperatieverlof met behoud van de volle bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXIII
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004052
        hoofdstuk: XIII
  - number: '54.7'
    text: |-
      Wordt het in het zesde lid genoemde recuperatieverlof toegekend, dan ontvangt de desbetreffende overplaatsbare
      ambtenaar van de DBZ ook een recuperatie-uitkering. Deze uitkering verhoudt zich tot de jaarlijkse vakantie-
      uitkering als de duur van het recuperatieverlof zich verhoudt tot de duur van de jaarlijkse vakantie.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
  - number: '54.8'
    text: |-
      Indien een gezinslid van een overplaatsbaar ambtenaar van de DBZ buiten Nederland onwettig wordt gegijzeld
      of anderszins buiten Nederland onwettig van de vrijheid wordt beroofd op een wijze die door Onze Minister met
      gijzeling wordt gelijkgesteld, en samenhang bestaat met de functie van de overplaatsbare ambtenaar van de DBZ,
      verleent Onze Minister die overplaatsbare ambtenaar van de DBZ na afloop daarvan, onverminderd de mogelijkheid
      van geneeskundige begeleiding van dat gezinslid ingevolge de bepalingen van [hoofdstuk XIII][ref1], eveneens naar
      billijkheid recuperatieverlof en een recuperatie-uitkering overeenkomstig het zesde en zevende lid van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXIII
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004052
        hoofdstuk: XIII
  - number: '54.9'
    text: |-
      In bijzondere gevallen kan Onze Minister bij onwettige vrijheidsberovingen als in het zesde en achtste lid van dit
      artikel bedoeld ook kosten van gezinshereniging en andere in samenhang met de onwettige vrijheidsberoving gemaakte
      kosten of schade vergoeden voor zover deze redelijk zijn en als niet verzekerbaar kunnen worden beschouwd; voor het
      vrijkopen van personen betaalde losprijzen worden echter nimmer vergoed.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
  - number: '54.10'
    text: |-
      De in het zesde tot en met negende lid genoemde voorzieningen gelden uitsluitend voor zover de desbetreffende
      overplaatsbare ambtenaar van de DBZ aanspraken op vergoeding en verhaal aan het Rijk heeft gecedeerd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
  - number: '54.11'
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van het zesde tot en met tiende lid van dit artikel nadere regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel54
  - number: '55.1'
    text: |-
      Onze Minister verricht zijn taak met betrekking tot begeleiding van verzuim en de arbeidsgezondheidskundige
      begeleiding op grond van de [Arbeidsomstandighedenwet 1998][ref1], dan wel zoveel mogelijk overeenkomstig die wet
      indien het de in het buitenland geplaatste overplaatsbare ambtenaar van de DBZ betreft, alsmede op grond van de
      bepalingen van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: '55.2'
    text: |-
      Ter voorbereiding op plaatsing in het buitenland, gedurende plaatsing in het buitenland en in verband met
      terugplaatsing naar Nederland omvat de arbeidsgezondheidskundige begeleiding tevens de gezondheidskundige
      begeleiding van de gezinsleden van de overplaatsbare ambtenaar van de DBZ.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel55
  - number: '56.1'
    text: |-
      Op de overplaatsbare ambtenaren van de DBZ zijn de [35][ref1], [36 tot en met 36b][ref2] en
      [70 van het ARAR][ref3] van overeenkomstige toepassing, met dien verstande dat voor de toepassing van
      [artikel 36a van het ARAR][ref4] voor «[artikel 98, derde lid, aanhef, onderdelen a en b][ref5]» moet worden
      gelezen: [artikel 101, derde lid, aanhef en de onderdele a en b][ref6], van dit reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel70
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel36a
      [ref5]: https://wetten.overheid.nl/BWBR0004052#Artikel98
      [ref6]: https://wetten.overheid.nl/BWBR0004052#Artikel101
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: '70'
      - id: ref4
        bwb_id: BWBR0001950
        artikel: 36a
      - id: ref5
        bwb_id: BWBR0004052
        artikel: '98'
        hoofdstuk: XVI
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0004052
        artikel: '101'
        hoofdstuk: XVI
        paragraaf: '2'
  - number: '56.2'
    text: |-
      Bij plaatsing in het buitenland geschiedt het door de overplaatsbare ambtenaar van de DBZ raadplegen van de
      Arbo-dienst in het kader van het arbeidsgezondheidskundig spreekuur schriftelijk, in dringende gevallen met
      gebruikmaking van de telecommunicatiemiddelen van het Ministerie van Buitenlandse Zaken, voor rekening van het
      Rijk.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel56
  - number: '56.3'
    text: |-
      De overplaatsbare ambtenaar van de DBZ wordt, in verband met zijn plaatsing in het buitenland, in overleg met
      of op aanwijzing van de Arbo-dienst onderworpen aan een periodiek arbeidsgezondheidskundig onderzoek. Een in het
      buitenland geplaatste overplaatsbare ambtenaar van de DBZ ondergaat dit onderzoek zo mogelijk tijdens verblijf hier
      te lande.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel56
  - number: '56.4'
    text: |-
      Onverminderd het bepaalde in [artikel 36a, tweede lid, van het ARAR][ref1], vindt buitendienststelling plaats
      door Onze Minister, of, indien betrokkene anders dan als hoofd bij een vertegenwoordiging in het Koninkrijk is
      geplaatst, door het hoofd van die vertegenwoordiging. Daarbij vindt een belangenafweging plaats teneinde na te gaan
      of het verblijf van de overplaatsbare ambtenaar van de DBZ in het land van plaatsing kan worden voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel36a
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 36a
  - number: '56.5'
    text: |-
      De Arbo-dienst kan de overplaatsbare ambtenaren van de DBZ individueel of gezamenlijk aanwijzingen geven tot
      behoud, herstel of bevordering van hun arbeidsgeschiktheid, en de geschiktheid tot verblijf in het buitenland van
      hun gezinsleden. De overplaatsbare ambtenaren van de DBZ zijn gehouden die aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel56
  - number: '57.1'
    text: |-
      Bij plaatsingen in het buitenland worden de gezinsleden van de overplaatsbare ambtenaar van de DBZ, overeenkomstig
      [artikel 56, tweede lid][ref1], in de gelegenheid gesteld de Arbo-dienst te raadplegen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel56
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '56'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: '57.2'
    text: |-
      Gezinsleden van de overplaatsbare ambtenaar van de DBZ worden, zo mogelijk tijdens verblijf hier te lande, in de
      gelegenheid gesteld het onderzoek, bedoeld in [artikel 56, derde lid][ref1], te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel56
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '56'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: '57.3'
    text: |-
      Indien Onze Minister gegronde redenen heeft om te twijfelen aan de goede gezondheidstoestand van de gezinsleden
      van de overplaatsbare ambtenaar van de DBZ worden deze in de gelegenheid gesteld een gezondheidskundig onderzoek
      te ondergaan.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel57
  - number: '57.4'
    text: |-
      De overplaatsbare ambtenaar van de DBZ is verplicht zich in te spannen dat diens gezinsleden hun medewerking
      verlenen aan:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel57
  - number: 57.4.a)
    text: |-
      onderzoeken als bedoeld in het derde lid, alsmede in [artikel 56, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel56
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '56'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: 57.4.b)
    text: 'gezondheidskundige onderzoeken, welke worden ingesteld ter beantwoording van de vragen:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel57
  - number: 57.4.b).i)
    text: |-
      in welke mate en tot welk tijdstip sprake is van verhindering wegens ziekte om in een bepaald gebied, een bepaald
      land of bepaalde landen te verblijven;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel57
  - number: 57.4.b).ii)
    text: |-
      of verdere maatregelen of voorzieningen nodig zijn in het belang van het behoud, het herstel of de bevordering van
      hun gezondheid.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel57
  - number: '57.5'
    text: |-
      De overplaatsbare ambtenaar van de DBZ is verplicht zich in te spannen dat zijn gezinsleden de in
      [artikel 56, vijfde lid][ref1] bedoelde aanwijzingen opvolgen, met uitzondering van aanwijzingen tot het ondergaan
      van een ingreep van heelkundige aard.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel56
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '56'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: '58.1'
    text: |-
      Onze Minister treft regelen met betrekking tot de mate waarin kosten die verband houden met de begeleiding
      van verzuim en de arbeidsgezondheidskundige begeleiding van overplaatsbare ambtenaren van de DBZ en de
      gezondheidskundige begeleiding van hun gezinsleden ten laste van het Rijk komen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel58
  - number: '58.2'
    text: |-
      Komen reis- en verblijfkosten op de voet van deze regelen ten laste van het Rijk, dan worden hier te lande
      gemaakte reis- en verblijfkosten vergoed volgens de bepalingen van het [Reisbesluit binnenland][ref1]. Eventuele
      buitenslands gemaakte reis- en verblijfkosten worden, uitsluitend na voorafgaande goedkeuring door Onze Minister,
      vergoed tot het goedgekeurde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005889
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005889
  - number: '59'
    text: |-
      Op de overplaatsbare ambtenaren van de DBZ zijn de [artikelen 37 tot en met 49 van het ARAR][ref1] van
      overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '37'
  - number: 59.a)
    text: |-
      gedurende hun plaatsing in het buitenland de bij ministeriële regeling ter zake van kosten van
      gezondheidskundige behandeling en verzorging gestelde regelen in de plaats treden van het bepaalde in de Regeling
      ziektekostenvoorziening overheidspersoneel;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel59
  - number: 59.b)
    text: |-
      gedurende hun plaatsing in het buitenland door Onze Minister kan worden bepaald dat zij, indien de ongeschiktheid
      tot het verrichten van hun arbeid wegens ziekte, bedoeld in [artikel 37 van het ARAR][ref1], langer duurt dan
      drie maanden, opdracht krijgen tot terugkeer met hun gezinsleden naar Nederland, waarna zij, uitsluitend met
      betrekking tot voor hen geldende financiële regelingen, worden gelijkgesteld met degenen die bij het departement
      zijn geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '37'
  - number: 59.c)
    text: |-
      voor de toepassing van [artikel 37 van het ARAR][ref1] voor «[artikel 98, derde lid, onderdeel a][ref2]» moet
      worden gelezen: [artikel 101, derde lid, onderdeel a, van dit reglement][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel98
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel101
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '98'
        hoofdstuk: XVI
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '101'
        hoofdstuk: XVI
        paragraaf: '2'
  - number: 59.d)
    text: |-
      voor de toepassing van de [artikelen 38][ref1] en [42 van het ARAR][ref2] voor
      «[artikel 98, eerste lid, aanhef, onderdeel f][ref3]» steeds moet worden gelezen:
      [artikel 101, eerste lid, aanhef, onderdeel e, van dit reglement][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel98
      [ref4]: https://wetten.overheid.nl/BWBR0004052#Artikel101
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '98'
        hoofdstuk: XVI
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004052
        artikel: '101'
        hoofdstuk: XVI
        paragraaf: '2'
  - number: 59.e)
    text: |-
      voor de toepassing van [artikel 40 van het ARAR][ref1] voor «[artikel 9, vierde lid, onderdeel b][ref2]» moet
      worden gelezen: [artikel 25 van dit reglement][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel25
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '9'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '25'
        hoofdstuk: V
        paragraaf: '2'
  - number: '62.1'
    text: |-
      De overplaatsbare ambtenaar van de DBZ is gehouden de plichten uit diens ambt voortvloeiende nauwgezet en ijverig
      te vervullen en zich te gedragen zoals een goed overplaatsbaar ambtenaar van de DBZ betaamt.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel62
  - number: '62.2'
    text: |-
      Bij plaatsing in het buitenland dient de overplaatsbare ambtenaar van de DBZ er zich bij voortduring van bewust te
      zijn deel uit te maken van een vertegenwoordiging van het Koninkrijk in het buitenland.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel62
  - number: '63.1'
    text: |-
      De overplaatsbare ambtenaar van de DBZ legt zo spoedig mogelijk na diens aanstelling in handen van Onze Minister
      of van een door deze aangewezen ambtenaar van de DBZ de navolgende eed of belofte af: "Ik zweer/beloof trouw aan de
      Koning, aan de [Grondwet][ref1] en aan de overige wetten van het Rijk. Ik zweer/verklaar dat ik tot het verkrijgen
      van mijn aanstelling aan niemand iets heb gegeven of beloofd, noch zal geven of beloven. Ik zweer/beloof dat ik
      om iets te doen of te laten in mijn functie van niemand enige belofte of geschenk aannemen zal. Ik zweer/beloof
      dat ik mijn werkzaamheden als overplaatsbaar ambtenaar van de Dienst Buitenlandse Zaken steeds zal verrichten
      overeenkomstig de mij gegeven voorschriften en aanwijzingen, en dat ik de belangen van het Koninkrijk zal voorstaan
      en bevorderen. Ik zweer/beloof dat ik de zaken waarvan ik als overplaatsbaar ambtenaar van de Dienst Buitenlandse
      Zaken kennis draag en waarvan ik het geheim of vertrouwelijk karakter moet begrijpen niet zal openbaren aan
      anderen dan aan hen aan wie ik volgens de wet of uit hoofde van mijn werkzaamheden tot mededeling verplicht ben. Zo
      waarlijk helpe mij God Almachtig! (Dat verklaar en beloof ik)."


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '63.2'
    text: |-
      Alvorens voor de eerste maal een functie als hoofd van een vaste diplomatieke zending te aanvaarden, hernieuwt de
      betrokkene de in het eerste lid genoemde eed of belofte in handen van de Koning, met dien verstande dat het woord
      "aanstelling" daarbij wordt vervangen door "benoeming als hoofd van een vaste diplomatieke zending" en de woorden
      "overplaatsbaar ambtenaar van de DBZ" door "hoofd van een vaste diplomatieke zending". In geval van verhindering
      van de Koning wordt de hernieuwde eed of belofte afgelegd in handen van Onze Minister. Bestaat ook daartoe geen
      gelegenheid, dan wordt de hernieuwde eed of belofte schriftelijk afgelegd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel63
  - number: '64'
    text: |-
      De overplaatsbare ambtenaar van de DBZ is, behoudens het gestelde in de slotzin van het
      [vierde lid van artikel 32][ref1], verplicht tot nakoming van de in het vorige artikel genoemde eed of belofte.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel32
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '32'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '65'
    text: |-
      Ter zake van niet-naleving van bepalingen welke redelijkerwijs niet kunnen worden geacht de overplaatsbare
      ambtenaar van de DBZ bekend te zijn, worden betrokkene geen voordelen onthouden of nadelen toegebracht.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel65
  - number: '67'
    text: |-
      Indien de overplaatsbare ambtenaar van de DBZ verhinderd is dienst te verrichten, is deze verplicht daarvan onder
      opgave van redenen, zo tijdig mogelijk op de aan betrokkene bekend gestelde wijze mededeling te doen, teneinde
      vertraging of hinder in de dienst zoveel doenlijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel67
  - number: '68.1'
    text: |-
      De hier te lande geplaatste overplaatsbare ambtenaar van de DBZ kan worden verplicht te gaan wonen of te blijven
      wonen in of nabij diens standplaats, indien dit naar het oordeel van het bevoegd gezag noodzakelijk is in verband
      met de goede vervulling van zijn functie.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel68
  - number: '68.2'
    text: |-
      De hier te lande geplaatste overplaatsbare ambtenaar van de DBZ aan wie de verplichting is opgelegd in of nabij het
      in het eerste lid bedoelde gebied te gaan wonen, is gehouden zo spoedig mogelijk, maar uiterlijk twee jaar nadat
      die verplichting is opgelegd, daaraan gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel68
  - number: '68.3'
    text: |-
      De in het buitenland geplaatste overplaatsbare ambtenaar van de DBZ is voor de duur van zijn plaatsing verplicht te
      wonen in of nabij de plaats van vestiging van de vertegenwoordiging van het Koninkrijk in het buitenland, waarbij
      betrokkene is geplaatst. Bij ministeriële regeling kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel68
  - number: '69.1'
    text: |-
      De overplaatsbare ambtenaar van de DBZ is verplicht, indien een ambts- of dienstwoning dan wel bij plaatsing in het
      buitenland een ambtswoning, dienstwoning of andere woning is aangewezen, deze te betrekken en zich ter zake van de
      bewoning en het gebruik te gedragen naar de regels die daaromtrent zijn gesteld; is een woning in het buitenland
      geheel of ten dele van Rijkswege ingericht, dan geldt het voorgaande dienovereenkomstig met betrekking tot die
      inrichting.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel69
  - number: '69.2'
    text: |-
      De overplaatsbare ambtenaar van de DBZ draagt de onderhoudskosten welke volgens de Nederlandse wetten en gebruiken
      gemeenlijk voor rekening van de huurder of gebruiker zijn, tenzij bij ministeriële regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel69
  - number: '70.1'
    text: |-
      De overplaatsbare ambtenaar van de DBZ kan worden verplicht tijdelijk andere ambtelijke werkzaamheden te verrichten
      dan die, welke deze gewoonlijk verricht, mits die werkzaamheden aan betrokkene redelijkerwijs kunnen worden
      opgedragen. Betrokkene kan echter niet worden verplicht werkzaamheden te verrichten in de plaats van stakers
      of uitgeslotenen in particuliere dienst, tenzij de opgedragen werkzaamheden worden verricht in dienst van het
      Ministerie van Buitenlandse Zaken en voor de Nederlandse openbare dienst tijdens de staking of uitsluiting, dan wel
      als onmiddellijk gevolg daarvan redelijkerwijs dadelijk noodzakelijk zijn te achten.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel70
  - number: '70.2'
    text: |-
      Voorts kan aan de overplaatsbare ambtenaar van de DBZ door Onze Minister de verplichting worden opgelegd in tijden
      van oorlog, oorlogsgevaar of andere buitengewone omstandigheden andere werkzaamheden te verrichten dan die welke
      betrokkene gewoonlijk verricht, mits die werkzaamheden strekken ter uitvoering van de taak welke de DBZ in die
      tijden heeft of zal krijgen, dan wel ertoe strekken een zo goed en ongestoord mogelijke uitvoering van die taak
      te verzekeren.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel70
  - number: '70.3'
    text: |-
      De overplaatsbare ambtenaar van de DBZ aan wie de in het tweede lid bedoelde verplichting is opgelegd, is tevens
      te allen tijde verplicht lessen te volgen en deel te nemen aan oefeningen die verband houden met de in dat lid
      bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel70
  - number: '70.4'
    text: |-
      Bij de toepassing van het eerste tot en met derde lid wordt voor zoveel mogelijk rekening gehouden met de
      persoonlijke omstandigheden van de overplaatsbare ambtenaar van de DBZ.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel70
  - number: '71'
    text: |-
      Ten aanzien van het opdragen van andere werkzaamheden aan een overplaatsbare ambtenaar van de DBZ die ongeschikt is
      tot het verrichten van zijn arbeid wegens ziekte is [artikel 57][ref1] van overeenkomstige toepassing,.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel57
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '57'
  - number: '72'
    text: |-
      [Artikel 57b van het ARAR][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel57b
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 57b
  - number: '73.1'
    text: |-
      De overplaatsbare ambtenaar van de DBZ is verplicht aan het bevoegd gezag, op een door dit gezag te bepalen wijze,
      opgave te doen van de nevenwerkzaamheden die hij verricht of voornemens is te gaan verrichten, die de belangen van
      de dienst voor zover deze in verband staan met zijn functievervulling, kunnen raken.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel73
  - number: '73.2'
    text: Onze Minister voert een registratie op basis van de op grond van het eerste lid gedane opgaven.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel73
  - number: '73.3'
    text: |-
      Het is de overplaatsbare ambtenaar van de DBZ verboden nevenwerkzaamheden te verrichten waardoor de goede
      vervulling van zijn functie of de goede functionering van de openbare dienst, voor zover deze in verband staat
      met zijn functievervulling, niet in redelijkheid zou zijn verzekerd. Daarvan is in ieder geval sprake indien een
      consulaire betrekking van een andere mogendheid wordt aanvaard zonder bij koninklijk besluit verleende voorafgaande
      machtiging. Bij ministeriële regeling kunnen nadere regels omtrent dit verbod worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel73
  - number: '73.4'
    text: |-
      De gezinsleden van een overplaatsbaar ambtenaar van de DBZ zijn vrij eigen werkzaamheden uit te oefenen.
      Vergezellen die gezinsleden de in het buitenland geplaatste overplaatsbare ambtenaar van de DBZ, dan dient de
      overplaatsbare ambtenaar van de DBZ ervoor te zorgen dat deze werkzaamheden niet strijdig zijn met de wetten
      van dan wel overeenkomsten met dat land en tevens niet schadelijk kunnen zijn voor het functioneren van de
      desbetreffende vertegenwoordiging van het Koninkrijk in het buitenland. Onze Minister, die ter zake beslist, kan
      aangaande laatstgenoemde voorwaarde regelen stellen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel73
  - number: '74.1'
    text: |-
      Het is de overplaatsbare ambtenaar van de DBZ verboden, middellijk of onmiddellijk deel te nemen aan aannemingen en
      leveringen ten behoeve van openbare diensten, tenzij daarvoor toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel74
  - number: '74.2'
    text: |-
      De overplaatsbare ambtenaar van de DBZ is verplicht zich te gedragen naar hetgeen voor deze is bepaald ten aanzien
      van het deelnemen, middellijk of onmiddellijk, aan aannemingen en leveringen ten behoeve van anderen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel74
  - number: '76.1'
    text: |-
      De overplaatsbare ambtenaar van de DBZ die een besturende, beherende dan wel toezichthoudende functie vervult in
      een naamloze vennootschap of ander rechtspersoonlijkheid bezittend lichaam, en voor de in die functie verrichte of
      te verrichten werkzaamheden, anders dan uit 's Rijks kas, een vergoeding ontvangt, is verplicht die vergoeding in
      genoemde kas te storten, indien de benoeming in die functie:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel76
  - number: 76.1.a
    text: heeft plaatsgehad door, dan wel in overeenstemming met Onze Minister;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel76
  - number: 76.1.b
    text: |-
      is voortgevloeid uit een wettelijk voorschrift, dan wel uit een overeenkomst, welke met instemming van Onze
      Minister of de ministerraad is tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel76
  - number: '76.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de overplaatsbare ambtenaar van de DBZ die
      werkzaamheden vervult welke verband houden met de door hem beklede functie en hem zijn opgedragen door Onze
      Minister, en die voor die werkzaamheden, anders dan uit ’s Rijks kas, een vergoeding ontvangt.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel76
  - number: '76.3'
    text: Het eerste en tweede lid vinden geen toepassing in de gevallen, waarin dit door Onze Minister-President is bepaald.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel76
  - number: '77.1'
    text: |-
      Het is de overplaatsbare ambtenaar van de DBZ in diens functie verboden anders dan met goedvinden van het bevoegd
      gezag, vergoedingen, beloningen, giften of beloften van derden te vorderen, te verzoeken of aan te nemen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel77
  - number: '77.2'
    text: Het aannemen van steekpenningen is onvoorwaardelijk en ten strengste verboden.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel77
  - number: '78.1'
    text: |-
      De overplaatsbare ambtenaar van de DBZ is verplicht de dienstkleding en de onderscheidingstekenen te dragen, voor
      zover dit door Onze Minister voorgeschreven is.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel78
  - number: '78.2'
    text: |-
      Het is de overplaatsbare ambtenaar van de DBZ verboden bij gekleed gaan in uniform, insignes of andere
      onderscheidingstekens te dragen, tenzij deze van regeringswege zijn verstrekt of voorgeschreven of tot het dragen
      daarvan door Onze Minister-President vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel78
  - number: '79.1'
    text: |-
      De overplaatsbare ambtenaar van de DBZ kan worden verplicht tot gehele of gedeeltelijke vergoeding van de door de
      dienst geleden schade voor zover deze aan betrokkene is te wijten.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel79
  - number: '79.2'
    text: |-
      Het bedrag van de schadevergoeding wordt niet vastgesteld, dan nadat de overplaatsbare ambtenaar van de DBZ in de
      gelegenheid is gesteld zich schriftelijk of mondeling te verantwoorden.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel79
  - number: '80.1'
    text: |-
      Aan de overplaatsbare ambtenaar van de DBZ die wordt overgeplaatst, wordt door Onze Minister een tegemoetkoming
      verleend in de daarmee verband houdende kosten van betrokkene zelf en diens vergezellende gezinsleden, zulks met
      inachtneming van daaromtrent vastgestelde regelen, welke, voor wat overplaatsingen naar, in of uit het buitenland
      betreft bij ministeriële regeling worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel80
  - number: '80.2'
    text: |-
      De overplaatsbare ambtenaar van de DBZ kan bij overplaatsing naar, in of uit het buitenland een tegemoetkoming
      worden verleend in de reiskosten en de daarmee verband houdende verblijfkosten voor huishoudelijk personeel, op
      basis van de bij ministeriële regeling gestelde regels.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel80
  - number: '81.1'
    text: |-
      De overplaatsbare ambtenaar van de DBZ heeft naast recht op tegemoetkomingen en vergoedingen bedoeld in de
      [artikelen 51][ref1] en [80][ref2], recht op vergoeding van reis- en verblijfkosten ter zake van dienstreizen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel80
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '51'
        hoofdstuk: X
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '80'
        hoofdstuk: XIV
  - number: '81.2'
    text: |-
      Voor hier te lande geplaatste overplaatsbare ambtenaren van de DBZ worden deze vergoedingen vastgesteld
      overeenkomstig de in of krachtens het [Reisbesluit binnenland][ref1] en het [Reisbesluit buitenland][ref2] gestelde
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005889
      [ref2]: https://wetten.overheid.nl/BWBR0006842
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005889
      - id: ref2
        bwb_id: BWBR0006842
  - number: '81.3'
    text: |-
      Voor de in het buitenland geplaatste overplaatsbare ambtenaren van de DBZ worden deze vergoedingen vastgesteld
      overeenkomstig de bij ministeriële regeling gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel81
  - number: '82.1'
    text: |-
      Lijdt een overplaatsbaar ambtenaar van de DBZ die voldaan heeft aan het [derde lid van artikel 13][ref1], buiten
      Nederland schade als gevolg van een normaliter niet verzekerbaar molest, dan wordt indien dat molest samenhangt
      met de functie van betrokkene, die schade volgens bij ministeriële regeling te stellen regelen vergoed, voor zover
      betrokkene vorderingen ter zake aan het Rijk heeft gecedeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel13
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '13'
        hoofdstuk: II
  - number: '82.2'
    text: |-
      Onze Minister kan naar billijkheid de ambtenaar schadeloos stellen, kosten vergoeden of overigens een geldelijke
      tegemoetkoming verlenen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel82
  - number: '82.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent schadeloosstelling, kostenvergoedingen en overige
      geldelijke tegemoetkomingen aan groepen van ambtenaren in overeenstemming met Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel82
  - number: '82.4'
    text: |-
      Onze Minister bepaalt de muntsoort of muntsoorten waarin de in het eerste tot en met derde lid bedoelde
      schadeloosstelling, vergoedingen en tegemoetkomingen bij plaatsing in het buitenland worden uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel82
  - number: '83'
    text: |-
      [Artikel 71 van het ARAR][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel71
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '71'
  - number: 83a.1
    text: |-
      [Artikel 71a, eerste en tweede lid, van het ARAR][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel71a
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel83a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 71a
  - number: 83a.2
    text: |-
      Bij ministeriële regeling worden, na overleg met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      nadere regels gesteld omtrent het opmaken en vaststellen van beoordelingen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel83a
  - number: '84.1'
    text: |-
      Alvorens de overplaatsbare ambtenaar van de DBZ in een andere functie wordt geplaatst of indien diens functie
      een andere inhoud krijgt, kan ten aanzien van betrokkene een hernieuwd veiligheidsonderzoek worden ingesteld.
      Betrokkene wordt door of namens het tot aanstelling bevoegd gezag van het hernieuwd instellen van het onderzoek in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel84
  - number: '84.2'
    text: |-
      De overplaatsbare ambtenaar van de DBZ wordt van tegen betrokkene op grond van de uitslag van het onderzoek gerezen
      bedenkingen in kennis gesteld. Betrokkene kan diens bezwaren daartegen aan Onze Minister kenbaar maken. Alvorens
      Onze Minister daarop een beslissing neemt, is deze gehouden het advies in te winnen van een door Onze Minister van
      Binnenlandse Zaken ingestelde commissie.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel84
  - number: '84.3'
    text: |-
      Bij de toepassing van dit artikel worden de door Onze Minister van Binnenlandse Zaken ter zake gegeven
      voorschriften in acht genomen. Deze voorschriften bevatten onder meer regels met betrekking tot de werkwijze van de
      in het tweede lid bedoelde commissie.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel84
  - number: '85'
    text: Verplichting tot zekerheidsstelling wordt de overplaatsbare ambtenaar van de DBZ niet opgelegd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel85
  - number: '86.1'
    text: |-
      De overplaatsbare ambtenaar van de DBZ, die ingevolge [artikel 19, tweede lid, van de Comptabiliteitswet][ref1] is
      belast met de in dat lid vermelde taken, is verplicht een tekort geheel of gedeeltelijk aan te zuiveren, wanneer
      hem ter zake van dat tekort een ernstig verwijt kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel19
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '19'
  - number: '86.2'
    text: |-
      De overplaatsbare ambtenaar van de DBZ, die ingevolge [artikel 19, vierde lid, van de Comptabiliteitswet][ref1]
      is aangewezen om beheer te voeren, als bedoeld in het derde lid van dat artikel, is verplicht schade te vergoeden,
      wanneer hem ter zake van die schade een ernstig verwijt kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel19
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '19'
  - number: '88.1'
    text: |-
      Aan de vrouwelijke overplaatsbare ambtenaar van de DBZ die een borstkind heeft en hiervan aan het hoofd van dienst
      kennis heeft gegeven, behoort gelegenheid te worden gegeven haar kind te zogen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel88
  - number: '88.2'
    text: |-
      Bij plaatsing in het buitenland treft het hoofd van de desbetreffende vertegenwoordiging van het Koninkrijk in het
      buitenland ter zake passende maatregelen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel88
  - number: '89.1'
    text: |-
      Aan de overplaatsbare ambtenaar van de DBZ kan door het bevoegd gezag de toegang tot dienstlokalen, dienstgebouwen
      of het werk dan wel het verblijf aldaar, worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel89
  - number: '89.2'
    text: |-
      De overplaatsbare ambtenaar van de DBZ is verplicht zich te gedragen naar de maatregelen van orde die ten aanzien
      van het verblijf aldaar zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel89
  - number: '89.3'
    text: |-
      Het is de overplaatsbare ambtenaar van de DBZ, behoudens in door Onze Minister dan wel het hoofd van een
      vertegenwoordiging van het Koninkrijk in het buitenland om redenen van dienst te bepalen uitzonderingsgevallen,
      verboden gedurende de werktijd alcoholhoudende dranken te gebruiken, bij zich te hebben of in de dienstlokalen
      te bewaren.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel89
  - number: '89.4'
    text: |-
      De overplaatsbare ambtenaar van de DBZ ontvangt over de tijd gedurende welke deze in strijd met diens
      verplichtingen opzettelijk nalaat dienst te verrichten geen bezoldiging; deze maatregel wordt gedurende plaatsingen
      in het buitenland niet ten uitvoer gelegd. Gedurende plaatsingen in het buitenland betaalde bezoldiging wordt in
      dat geval als terug te betalen voorschot beschouwd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel89
  - number: 90a.1
    text: |-
      De overplaatsbare ambtenaar van de DBZ heeft aanspraak op een gratificatie bij ambtsjubileum volgens bij
      ministeriële regeling van Onze Minister van Binnenlandse Zaken te stellen regels.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel90a
  - number: 90a.2
    text: |-
      De overplaatsbare ambtenaar van de DBZ die een diensttijd heeft van 10 jaar of meer en aan wie ontslag is verleend
      op grond van [artikel 98][ref1], [101, eerste lid, onder ][ref2], wordt een diensttijdgratificatie toegekend
      ter grootte van een in verhouding tot de doorgebrachte diensttijd evenredig gedeelte van een gratificatie bij
      ambtsjubileum als bedoeld in het eerste lid. Toekenning vindt niet plaats indien niet binnen een termijn van vijf
      jaar na de datum van ingang van het ontslag aanspraak op een gratificatie bij ambtsjubileum zou hebben bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel101
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '98'
        hoofdstuk: XVI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '101'
        hoofdstuk: XVI
        paragraaf: '2'
  - number: '91'
    text: |-
      Op de overplaatsbare ambtenaren van de DBZ zijn de [artikelen 80 tot en met 84 van het ARAR][ref1] van
      overeenkomstige toepassing, met dien verstande dat gedurende plaatsingen in het buitenland


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel80
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '80'
  - number: 91.a
    text: |-
      de straffen, genoemd in [artikel 81, eerste lid, onder ][ref1] niet worden toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel81
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '81'
  - number: 91.b
    text: |-
      de straf, genoemd in [artikel 81, eerste lid, onder ][ref1] wordt gelezen als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel81
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '81'
  - number: '92.1'
    text: |-
      De overplaatsbare ambtenaar van de DBZ is van rechtswege in diens functie geschorst, wanneer deze krachtens
      een Nederlandse wettelijke maatregel van de vrijheid is beroofd, tenzij de vrijheidsbeneming het gevolg is
      van een maatregel, anders dan op grond van de Krankzinnigenwet (*Stb.* 1984, 96), genomen in het belang van de
      volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel92
  - number: '92.2'
    text: |-
      De overplaatsbare ambtenaar van de DBZ kan worden geschorst, wanneer deze krachtens een andere wettelijke dan een
      Nederlandse maatregel van de vrijheid is beroofd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel92
  - number: '93.1'
    text: |-
      Onverminderd [artikel 91, onder ][ref1], kan de overplaatsbare ambtenaar van de DBZ in diens functie worden
      geschorst:


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel91
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '91'
        hoofdstuk: XV
  - number: 93.1.a
    text: indien een strafrechtelijke vervolging ter zake van misdrijf tegen betrokkene is ingesteld;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel93
  - number: 93.1.b
    text: |-
      wanneer aan betrokkene door Onze Minister het voornemen tot bestraffing met onvoorwaardelijk ontslag is te kennen
      gegeven, dan wel aan deze die straf is opgelegd;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel93
  - number: 93.1.c
    text: wanneer, naar het oordeel van Onze Minister, het belang van de dienst zulks vordert.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel93
  - number: '93.2'
    text: Schorsing geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel93
  - number: '93.3'
    text: |-
      Schorsing van een in het buitenland geplaatste overplaatsbare ambtenaar van de DBZ gaat gepaard met terugroeping
      naar Nederland, met verlening van een tegemoetkoming in de verplaatsingskosten tot ten hoogste het bedrag dat in
      geval van overplaatsing in het belang van de dienst zou kunnen worden verleend krachtens de in [artikel 80][ref1]
      bedoelde regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel80
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '80'
        hoofdstuk: XIV
  - number: '94.1'
    text: |-
      Tijdens de schorsing kan de bezoldiging voor een derde gedeelte worden ingehouden; na verloop van zes weken
      kan een verdere inhouding, ook van het volle bedrag der bezoldiging, plaatsvinden. Geen inhouding vindt
      plaats in geval van schorsing in het belang van de dienst, bedoeld in het [eerste lid, onder ][ref1], van
      plaatsing in een krankzinnigengesticht of daarmede gelijk te stellen inrichting, dan wel van politiebewaring of
      inverzekeringstelling als bedoeld in [artikel 57 van het Wetboek van Strafvordering][ref2] mits niet gevolgd door
      inbewaringstelling. Inhouding heeft niet plaats tijdens plaatsing in het buitenland.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel57
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '93'
        hoofdstuk: XVI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '57'
  - number: '94.2'
    text: |-
      De ingehouden bezoldiging kan alsnog geheel of gedeeltelijk aan de overplaatsbare ambtenaar van de DBZ worden
      uitbetaald, indien de schorsing niet wordt gevolgd door een onvoorwaardelijk ontslag bij wijze van straf of ontslag
      op grond van [artikel 101, eerste lid, onder ][ref1]. Op de aldus uit te keren bezoldiging worden in mindering
      gebracht de inkomsten welke de overplaatsbare ambtenaar van de DBZ sedert de schorsing heeft genoten uit arbeid
      die deze als gevolg van de schorsing heeft kunnen verrichten, tenzij zulks naar het oordeel van Onze Minister
      onredelijk of onbillijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel101
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '101'
        hoofdstuk: XVI
        paragraaf: '2'
  - number: '94.3'
    text: |-
      Het niet ingehouden gedeelte van de bezoldiging van de geschorste ambtenaar van de DBZ kan aan anderen worden
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel94
  - number: '94.4'
    text: |-
      Voor de toepassing van dit artikel wordt onder bezoldiging verstaan de bezoldiging in de zin van het
      [BBRA 1984][ref1], dan wel, in geval van schorsing tijdens ziekte van de overplaatsbare ambtenaar van de DBZ,
      hetgeen daaronder voor de toepassing van [hoofdstuk XIII][ref2] wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
      [ref2]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXIII
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003630
      - id: ref2
        bwb_id: BWBR0004052
        hoofdstuk: XIII
  - number: '95'
    text: |-
      Ontslag wordt verleend door Onze Minister dan wel, indien de aanstelling of benoeming bij koninklijk besluit
      geschiedde, bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel95
  - number: '96.1'
    text: De overplaatsbare ambtenaar van de DBZ wordt op diens aanvraag ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel96
  - number: '96.2'
    text: |-
      Behoudens in het geval dat [artikel 34][ref1] van overeenkomstige toepassing is, wordt dat ontslag verleend met
      ingang van een dag niet vroeger dan een maand of later dan drie maanden na de dag, waarop de aanvraag om ontslag
      is ingekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel34e
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 34e
  - number: '96.3'
    text: |-
      Van het eerste lid kan worden afgeweken, indien een strafrechtelijke vervolging ter zake van misdrijf tegen de
      overplaatsbare ambtenaar van de DBZ is ingesteld of indien wordt overwogen de disciplinaire straf van ontslag op
      te leggen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel96
  - number: '96.4'
    text: 'Van het tweede lid kan worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel96
  - number: 96.4.a
    text: indien wordt overwogen de overplaatsbare ambtenaar van de DBZ een disciplinaire straf op te leggen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel96
  - number: 96.4.b
    text: |-
      indien het belang van de dienst zulks vordert, met dien verstande, dat de termijn van drie maanden, vermeld in het
      tweede lid, tot ten hoogste zes maanden kan worden verlengd en dat bij de verlenging in redelijkheid met het belang
      van de overplaatsbare ambtenaar van de DBZ rekening wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel96
  - number: 96.4.c
    text: ingevolge een aanvraag van de overplaatsbare ambtenaar van de DBZ.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel96
  - number: '96.5'
    text: Het ontslag op aanvraag van de ambtenaar wordt eervol verleend.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel96
  - number: '97.1'
    text: |-
      Aan de overplaatsbare ambtenaar van de DBZ in tijdelijke dienst die blijkens de akte van aanstelling is aangesteld
      voor een bepaalde tijd of voor een proeftijd, wordt, tenzij het tegendeel blijkt, geacht eervol ontslag te zijn
      verleend zodra die tijd is verstreken. Bij voortduring van het dienstverband na het verstrijken van de bepaalde
      tijd of de - eventueel ingevolge [artikel 18, vierde lid, onder a][ref1], verlengde - proeftijd, wordt de
      overplaatsbare ambtenaar van de DBZ geacht voor onbepaalde tijd te zijn aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel18
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '18'
        hoofdstuk: V
        paragraaf: '1'
  - number: '97.2'
    text: |-
      Aan de overplaatsbare ambtenaar van de DBZ in tijdelijke dienst die is aangesteld voor onbepaalde tijd, kan ontslag
      worden verleend, mits een opzeggingstermijn in acht wordt genomen van:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel97
  - number: 97.2.a
    text: |-
      drie maanden, indien de overplaatsbare ambtenaar van de DBZ ten tijde van de opzegging ten minste twaalf maanden
      onafgebroken in dienst is geweest;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel97
  - number: 97.2.b
    text: |-
      twee maanden, indien de overplaatsbare ambtenaar van de DBZ ten tijde van de opzegging ten minste zes, doch korter
      dan twaalf maanden onafgebroken in dienst is geweest;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel97
  - number: 97.2.c
    text: |-
      een maand, indien de overplaatsbare ambtenaar van de DBZ ten tijde van de opzegging laatstelijk korter dan zes
      maanden onafgebroken in dienst is geweest.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel97
  - number: '97.3'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden gedurende de zwangerschap van
      de vrouwelijke overplaatsbare ambtenaar van de DBZ, noch gedurende het verlof bedoeld in
      [artikel 33fb, vierde lid, van het ARAR][ref1], noch - indien zij haar dienst heeft hervat - gedurende een periode
      van zes weken volgend op dat verlof. Onze Minister kan ter staving van de zwangerschap een verklaring van een arts
      of van een verloskundige verlangen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33fb
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33fb
  - number: '97.4'
    text: Opzegging als bedoeld in het tweede lid kan niet geschieden wegens het aanvragen of het opnemen ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel97
  - number: '97.5'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden wegens de omstandigheid dat de overplaatsbare ambtenaar
      van de DBZ in of buiten rechte een beroep heeft gedaan op het beginsel van gelijke behandeling van mannen en
      vrouwen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel97
  - number: '97.6'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet plaatsvinden wegens het feit dat de ambtenaar door een centrale
      als bedoeld in [artikel 105 van het ARAR][ref1] of door een daarbij aangesloten vereniging is aangewezen om
      bestuurlijke of vertegenwoordigende activiteiten te ontplooien binnen zijn centrale of een daarbij aangesloten
      vereniging dan wel binnen de organisatie van de werkgever, die er toe strekken de doelstellingen van zijn centrale
      van overheidspersoneel en daarbij aangesloten verenigingen te ondersteunen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel105
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '105'
  - number: '97.7'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden wegens de omstandigheid dat de ambtenaar geplaatst
      is op een kandidatenlijst als bedoeld in [artikel 9 van de Wet op de ondernemingsraden][ref1], noch wegens het
      lidmaatschap of het korter dan twee jaar geleden beëindigde lidmaatschap van de ambtenaar van de ondernemingsraad
      of van een commissie van die raad.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel9
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '9'
  - number: '97.8'
    text: |-
      Het ontslag kan, al dan niet op aanvraag van de overplaatsbare ambtenaar van de DBZ, ingaan vóór de afloop van
      de opzeggingstermijn. Indien dit niet op aanvraag van de overplaatsbare ambtenaar van de DBZ geschiedt, wordt aan
      betrokkene over de tijd welke aan de opzeggingstermijn ontbreekt, een bedrag uitbetaald gelijk aan de laatstgenoten
      bezoldiging, vermeerderd met de vakantie-uitkering, berekend op de voet van het [BBRA 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '97.9'
    text: |-
      Aan de overplaatsbare ambtenaar van de DBZ in tijdelijke dienst, bedoeld in het eerste lid, kan ontslag worden
      verleend met ingang van een dag, gelegen binnen een bepaalde tijd of proeftijd. In dat geval vindt het bepaalde in
      het tweede tot en met achtste lid overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel97
  - number: '98.1'
    text: |-
      Aan de overplaatsbare ambtenaar van de DBZ kan eervol ontslag worden verleend wegens overtolligheid van personeel
      als gevolg van verandering in de inrichting van het Ministerie van Buitenlandse Zaken dan wel als gevolg
      van vermindering der voor overplaatsbare ambtenaren van de DBZ bestemde werkzaamheden bij het Ministerie van
      Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel98
  - number: '98.2'
    text: |-
      Ontslag op een van de in het eerste lid genoemde gronden kan slechts plaatsvinden, indien het na een zorgvuldig
      onderzoek niet mogelijk is gebleken om de overplaatsbare ambtenaar van de DBZ binnen het gezagsbereik van Onze
      Minister andere mede in verband met betrokkene’s persoonlijkheid en omstandigheden voor betrokkene passende
      werkzaamheden op te dragen, dan wel indien deze zodanige werkzaamheden weigert te aanvaarden. Bij het opdragen van
      passende werkzaamheden zal, teneinde het ontstaan dan wel het vergroten van feitelijke ongelijkheden tegen te gaan,
      uitgangspunt zijn, dat voorrang wordt gegeven aan vrouwelijke overplaatsbare ambtenaren van de DBZ.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel98
  - number: '98.3'
    text: |-
      Ontslag van in vaste dienst aangestelde overplaatsbare ambtenaren van de DBZ wegens overtolligheid van personeel
      geschiedt in de volgende rangorde:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel98
  - number: 98.3.a
    text: zij, die zulks wensen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel98
  - number: 98.3.b
    text: zij, die het geringste aantal jaren in burgerlijke overheidsdienst hebben doorgebracht.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel98
  - number: '98.4'
    text: |-
      Indien het dienstbelang zulks vordert, kan bij de verlening van ontslag van de rangorde, bedoeld in het derde lid,
      worden afgeweken. Omvat de afvloeiing in dat geval meer dan 1% van het aantal overplaatsbare ambtenaren van de DBZ
      in vaste dienst - met een minimum van 5 - dan geschiedt zij naar een bepaald vooraf vastgesteld plan.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel98
  - number: '98.5'
    text: |-
      Bij een ontslagverlening op grond van het eerste lid van dit artikel wordt een opzeggingstermijn van drie maanden
      in acht genomen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel98
  - number: '98.6'
    text: |-
      Binnen een periode van uiterlijk een jaar nadat de overplaatsbare ambtenaar van de DBZ de ingevolge het tweede lid
      van dit artikel opgedragen werkzaamheden is gaan vervullen, kan aan betrokkene alsnog het eervol ontslag bedoeld in
      het eerste lid worden verleend, indien die werkzaamheden blijken niet passend voor betrokkene te zijn. Het vijfde
      lid is daarbij niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel98
  - number: '99.1'
    text: |-
      Aan de overplaatsbare ambtenaar van de DBZ die in verband met de aanvaarding van een functie in een
      publiekrechtelijk college, waarin hij is benoemd of verkozen, tijdelijk is ontheven van de waarneming van zijn
      ambt, wordt, indien hij ophoudt zodanige functie te bekleden en hij naar het oordeel van het bevoegd gezag niet in
      actieve dienst kan worden hersteld, eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel99
  - number: '99.2'
    text: |-
      Tenzij op grond van [artikel 54, eerste lid, onder ][ref1][artikel 34][ref2] van overeenkomstige toepassing is,
      wordt eervol ontslag eveneens verleend aan de overplaatsbare ambtenaar van de DBZ die na afloop van het verlof,
      verleend met overeenkomstige toepassing van [artikel 34, uitgezonderd het derde en vijfde lid, van het ARAR][ref3]
      dan wel [artikel 54, eerste lid, onder ][ref4], van dit reglement, naar het oordeel van Onze Minister, dan wel
      indien betrokkene bij koninklijk besluit werd aangesteld of benoemd naar Ons oordeel, niet in actieve dienst kan
      worden hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0004052#Artikel54
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '54'
        hoofdstuk: XII
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: '34'
      - id: ref4
        bwb_id: BWBR0004052
        artikel: '54'
        hoofdstuk: XII
  - number: '99.3'
    text: |-
      Het eerste lid vindt eveneens toepassing voor de overplaatsbare ambtenaar van de DBZ die ophoudt een functie te
      bekleden, bedoeld in [artikel 16, derde lid, van het ARAR][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel16
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '16'
  - number: '99.4'
    text: |-
      Aan de overplaatsbare ambtenaar van de DBZ die een benoeming tot minister of staatssecretaris aanvaardt wordt, met
      ingang van de dag van het aanvaarden van deze betrekking, eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel99
  - number: '100'
    text: |-
      Voor de ontslagverlening als bedoeld in [artikel 125e, tweede lid, van de Ambtenarenwet][ref1], is overeenstemming
      vereist met Onze Minister van Binnenlandse Zaken. Deze is gehouden het advies in te winnen van de Adviescommissie
      grondrechten en functie-uitoefening ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125e
  - number: '101.1'
    text: |-
      Anders dan op aanvraag van de ambtenaar, bij wijze van straf of ingevolge het bepaalde bij
      [artikel 7 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1] en bij
      de [artikelen 97][ref2], [98][ref3], [99][ref4] en [100 van dit reglement][ref5], alsmede bij
      [artikel 125e, tweede lid, van de Ambtenarenwet][ref6], kan de overplaatsbare ambtenaar van de DBZ worden ontslagen
      op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel98
      [ref4]: https://wetten.overheid.nl/BWBR0004052#Artikel99
      [ref5]: https://wetten.overheid.nl/BWBR0004052#Artikel100
      [ref6]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '97'
        hoofdstuk: XVI
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '98'
        hoofdstuk: XVI
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004052
        artikel: '99'
        hoofdstuk: XVI
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0004052
        artikel: '100'
        hoofdstuk: XVI
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0001947
        artikel: 125e
  - number: 101.1.a
    text: |-
      het verlies van een vereiste voor de benoembaarheid door het tot aanstelling bevoegd gezag gesteld bij een regeling
      aan de benoeming voorafgegaan, tenzij dit vereiste alleen geldt bij de aanvang van de loopbaan;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: 101.1.b
    text: |-
      onherroepelijk geworden rechterlijke uitspraak, waarbij de overplaatsbare ambtenaar van de DBZ onder curatele is
      gesteld;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: 101.1.c
    text: het ondergaan van lijfsdwang wegens schulden krachtens onherroepelijk geworden rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: 101.1.d
    text: onherroepelijk geworden veroordeling tot vrijheidsstraf wegens misdrijf;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: 101.1.e
    text: ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: 101.1.f
    text: |-
      onbekwaamheid of ongeschiktheid voor de vervulling van voor overplaatsbare ambtenaren van de DBZ in diens rang
      bestemde functies, anders dan op grond van ziels- of lichaamsgebreken;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: 101.1.g
    text: het bereiken van de pensioengerechtigde leeftijd;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: 101.1.h
    text: |-
      het bij of in verband met indiensttreding of keuring verstrekken van onjuiste of onvolledige inlichtingen, zonder
      welke handelwijze niet tot indienstneming zou zijn overgegaan, tenzij de overplaatsbare ambtenaar van de DBZ
      aannemelijk maakt dat deze te goeder trouw heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: '101.2'
    text: Een ontslag op grond van het eerste lid, onder *a*, *e*, *f* en *g*, wordt steeds eervol verleend.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: '101.3'
    text: 'Een ontslag als bedoeld in het eerste lid, onderdeel *e*, kan slechts plaatsvinden indien:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: 101.3.a
    text: |-
      er sprake is van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een ononderbroken
      periode van twee jaar,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: 101.3.b
    text: |-
      herstel van zijn ziekte niet binnen een periode van zes maanden na de in onderdeel *a* genoemde termijn van twee
      jaar te verwachten is, en
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: 101.3.c
    text: |-
      na een zorgvuldig onderzoek het niet mogelijk is gebleken om de overplaatsbare ambtenaar van de DBZ binnen het
      gezagsbereik van Onze Minister andere arbeid aan te bieden, dan wel indien de ambtenaar geweigerd heeft deze arbeid
      te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: '101.4'
    text: |-
      Onder arbeid als bedoeld in het derde lid, onder *c*, wordt gedurende het eerste jaar dat de overplaatsbare
      ambtenaar van de DBZ ongeschikt is tot het verrichten van zijn arbeid wegens ziekte passende, en gedurende de
      periode daarna gangbare arbeid verstaan, als bedoeld in [artikel 35 van het ARAR][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel35
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '35'
  - number: '101.5'
    text: |-
      Bij het bepalen van het tijdvak van twee jaar als bedoeld in het derde lid, onder a, wordt niet in aanmerking
      genomen afwezigheid van een vrouwelijke ambtenaar wegens door zwangerschap of bevalling veroorzaakte ziekte in de
      periode vanaf het begin van de zwangerschap tot aan het einde van het bevallingsverlof.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: '101.6'
    text: |-
      Voor het bepalen van het in het derde lid, onder a, bedoelde tijdvak van twee jaar worden tijdvakken van
      ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte samengeteld:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: 101.6.a
    text: indien zij elkaar met een onderbreking van minder dan vier weken opvolgen,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: 101.6.b
    text: |-
      indien zij worden onderbroken door afwezigheid wegens door zwangerschap of bevalling veroorzaakte ziekte in de
      periode vanaf het begin van de zwangerschap tot aan het einde van het bevallingsverlof,
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: 101.6.c
    text: |-
      indien een onder b bedoelde afwezigheid wordt voorafgegaan of wordt gevolgd door een periode van
      arbeidsgeschiktheid, die in totaal minder dan vier weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: '101.7'
    text: |-
      Om te beoordelen of er sprake is van een situatie als bedoeld in het derde lid, onderdelen *a*
      en *b*, vraagt Onze Minister het oordeel van een daartoe door de uitvoeringsinstelling, die de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] uitvoert ten aanzien van de ambtenaar, aangewezen arts.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '101.8'
    text: |-
      De in het zevende lid bedoelde arts betrekt bij zijn beoordeling een door Onze Minister aangewezen arts en, indien
      de overplaatsbare ambtenaar van de DBZ dit wenst, een door de ambtenaar aangewezen arts.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: '101.9'
    text: |-
      Onze Minister stelt de overplaatsbare ambtenaar van de DBZ er schriftelijk van in kennis dat de procedure, bedoeld
      in het zevende lid wordt ingesteld. Daarbij wijst Onze Minister de overplaatsbare ambtenaar op de mogelijkheid om
      een arts van zijn keuze te laten deelnemen aan de procedure.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: '101.10'
    text: |-
      De kennisgeving bedoeld in het negende lid, geschiedt niet eerder dan nadat de overplaatsbare ambtenaar van de DBZ
      gedurende een onafgebroken periode van achttien maanden ongeschikt is geweest tot het verrichten van zijn arbeid
      wegens ziekte. Het zesde lid is hierbij van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: '101.11'
    text: |-
      De in het zevende lid bedoelde arts stelt naar aanleiding van zijn bevindingen een rapport op. Hij zendt dit
      rapport aan Onze Minister. Tevens zendt hij een afschrift van dit rapport aan de overplaatsbare ambtenaar van de
      DBZ.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: '101.12'
    text: |-
      Indien herplaatsing als bedoeld in het derde lid, onder *c*, plaatsvindt in een betrekking voor minder uren dan het
      aantal waarvoor de overplaatsbare ambtenaar van de DBZ was aangesteld, heeft het ontslag uitsluitend betrekking op
      het meerdere aantal uren.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: '101.13'
    text: |-
      Aan een overplaatsbaar ambtenaar van de DBZ kan eervol ontslag worden verleend, indien deze de leeftijd van 60
      jaar heeft bereikt, dan wel 35 voor pensioen geldige dienstjaren bij de DBZ heeft, wanneer betrokkene blijkens een
      arbeidsgezondheidskundig onderzoek niet meer geschikt is om overal ter wereld te worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: '101.14'
    text: |-
      Op de overplaatsbare ambtenaar van de DBZ aan wie op grond van het vierde lid eervol ontslag is verleend, is de
      Regeling uitkering wegens functioneel leeftijdsontslag van overeenkomstige toepassing, met dien verstande dat
      overal waar in die regeling wordt gesproken van "Onze Minister" of "Onze Minister van Binnenlandse Zaken" daarvoor
      wordt gelezen "Onze Minister van Buitenlandse Zaken".
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
  - number: '101.15'
    text: |-
      Met betrekking tot ontslag wegens flexibel pensioen en uittreden is [artikel 94][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel94a
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 94a
  - number: '102'
    text: |-
      Indien aan de overplaatsbare ambtenaar van de DBZ gedurende de tijd dat deze recht heeft op wachtgeld, daaronder
      mede begrepen herplaatsingswachtgeld of een uitkering krachtens de [Uitkeringsregeling 1966][ref1], een voor
      betrokkene passend geachte functie is aangeboden en die functie binnen een periode van uiterlijk een jaar, nadat
      betrokkene deze is gaan vervullen, niet passend voor deze blijkt te zijn, kan aan betrokkene binnen die periode op
      zijn aanvraag eervol ontslag uit die functie worden verleend, welk ontslag ten aanzien van diens aanspraken op een
      wachtgeld of uitkering als evenbedoeld, wordt geacht niet door eigen toedoen te zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0002537
  - number: '103.1'
    text: |-
      Aan de overplaatsbare ambtenaar van de DBZ in vaste dienst kan ook op andere gronden dan die in [artikel 101][ref1]
      zijn geregeld of waarnaar in dat artikel wordt verwezen, ontslag worden gegeven. Dat ontslag wordt eervol verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel101
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '101'
        hoofdstuk: XVI
        paragraaf: '2'
  - number: '103.2'
    text: |-
      In geval van ontslag ingevolge het eerste lid wordt door het tot ontslagverlening bevoegde gezag een voorziening
      getroffen waarbij de overplaatsbare ambtenaar van de Dienst Buitenlandse Zaken een uitkering verleend wordt, die,
      naar het oordeel van dat bevoegde gezag, met het oog op de omstandigheden redelijk is te achten. Deze uitkering
      zal ten minste gelijk zijn aan het voor de ambtenaar geldende totaal van uitkeringen berekend op basis van de
      [Werkloosheidswet][ref1] en het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref2],
      als ware als gevolg van het ontslag geen sprake van verwijtbare werkloosheid als bedoeld in
      [artikel 24 van de Werkloosheidswet][ref3]. Voor zover door het bevoegde gezag ten gunste van de
      ambtenaar niet anders is beslist, zijn op de uitkering voor het overige de [Werkloosheidswet][ref4] en het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008114
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0008114
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008114
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0008114
  - number: '103.3'
    text: |-
      Indien de ambtenaar terzake van zijn ontslag ingevolge het eerste lid recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref1] of het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref2],
      wordt de in het tweede lid bedoelde uitkering met die uitkering verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008114
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008114
  - number: '106.1'
    text: |-
      De bezoldiging van de overplaatsbare ambtenaren van de DBZ wordt niet langer uitbetaald dan tot en met de dag van
      het overlijden. [Artikel 24, eerste lid, van het ARAR][ref1] wordt voorts overeenkomstig toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel24
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '24'
  - number: '106.2'
    text: |-
      Met inachtneming van het vijfde lid wordt zo spoedig mogelijk na het overlijden aan de weduwe of weduwnaar,
      van wie de overleden overplaatsbare ambtenaar van de DBZ niet duurzaam gescheiden leefde, een bedrag
      uitgekeerd gelijk aan de bezoldiging over een tijdvak van drie maanden. Als maatstaf bij de berekening
      van het in de vorige volzin bedoelde bedrag geldt, behoudens het hierna bepaalde, de bezoldiging, welke
      de overplaatsbare ambtenaar van de DBZ op de dag van het overlijden genoot of indien hij op die dag
      aanspraak maakt op een uitkering op grond van de [Ziektewet][ref1], de [Werkloosheidswet][ref2] of de
      [Wet op de arbeidsongeschiktheidsverzekering][ref3] dan wel een bovenwettelijke arbeidsongeschiktheidsverzekering,
      bedoeld in [hoofdstuk VI van het Algemeen rijksambtenarenreglement][ref4], zou hebben genoten indien hij op die
      dag arbeidsgeschikt zou zijn geweest. De uitkering wordt vermeerderd met een bedrag gelijk aan driemaal dat van
      de vakantie-uitkering over een maand, berekend op de voet van het [BBRA 1984][ref5], naar de bezoldiging die de
      overplaatsbare ambtenaar van de DBZ in de maand van het overlijden zou hebben genoten. Indien de overplaatsbare
      ambtenaar van de DBZ in het genot was van een toelage als bedoeld in [artikel 17][ref6], dan wel [18 ][ref7], wordt
      het gedeelte van de in de eerste volzin bedoelde uitkering dat betrekking heeft op bovenbedoelde toelagen gesteld
      op het bedrag dat de overleden overplaatsbare ambtenaar van de DBZ in de drie kalendermaanden voorafgaand aan de
      dag van het overlijden aan zodanige toelagen is toegekend. Bij ontstentenis van een weduwe of weduwnaar, van wie de
      overledene niet duurzaam gescheiden leefde, geschiedt de uitkering ten behoeve van de minderjarige kinderen. Onder
      kinderen in de zin van dit artikel worden mede verstaan natuurlijke kinderen en kinderen, waarover de overledene
      de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding
      van het kind als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van
      een vergoeding daarvoor. Ontbreken ook zodanige kinderen, dan geschiedt de uitkering aan degenen die geheel of
      grotendeels afhankelijk waren van de bezoldiging van de overplaatsbare ambtenaar van de DBZ.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVI
      [ref5]: https://wetten.overheid.nl/BWBR0003630
      [ref6]: https://wetten.overheid.nl/BWBR0003630#Artikel17
      [ref7]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0001950
        hoofdstuk: VI
      - id: ref5
        bwb_id: BWBR0003630
      - id: ref6
        bwb_id: BWBR0003630
        artikel: '17'
      - id: ref7
        bwb_id: BWBR0003630
        artikel: 18a
  - number: '106.3'
    text: |-
      Indien de overledene geen betrekkingen als bedoeld in het tweede lid nalaat, kan het daarbedoelde bedrag door het
      bevoegde gezag geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte en van de
      lijkbezorging, indien de nalatenschap van de overledene voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel106
  - number: '106.4'
    text: |-
      Voor de toepassing van dit artikel wordt, indien de overplaatsbare ambtenaar van de DBZ op de dag van het
      overlijden wegens ziekte of ongeval verhinderd was zijn dienst te verrichten, onder bezoldiging verstaan hetgeen
      daaronder voor de toepassing van [hoofdstuk XIII][ref1] wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXIII
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0004052
        hoofdstuk: XIII
  - number: '106.5'
    text: |-
      Indien de overplaatsbare ambtenaar van de DBZ voor zijn overlijden te veel vakantie heeft genoten, vindt
      [artikel 24, tweede lid, van het ARAR][ref1] overeenkomstige toepassing. Het aldus verschuldigde bedrag en de reeds
      voor zijn overlijden aan de ambtenaar uitbetaalde bezoldiging over een na zijn overlijden gelegen tijdvak worden
      in mindering gebracht op het eventueel aan de nagelaten betrekkingen of rechtverkrijgenden van de overplaatsbare
      ambtenaar van de DBZ verschuldigde bedrag wegens nog niet vergolden aanspraken van de ambtenaar, en bij gebreke
      hiervan of indien en voorzover dit bedrag daarvoor niet toereikend is, op de uitkering bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel24
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '24'
  - number: '106.6'
    text: |-
      Op het bedrag, bedoeld in het tweede lid, wordt in mindering gebracht een uitkering op grond van
      [artikel 35 van de Ziektewet][ref1] of[artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref2] en naar
      aard en strekking daarmee overeenkomende uitkeringen, indien deze uitkeringen worden uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '53'
  - number: '106.7'
    text: |-
      Indien de overplaatsbare ambtenaar van de DBZ ten tijde van diens overlijden een tegemoetkoming genoot in de zin
      van [artikel 51, eerste lid][ref1], wordt deze gedurende ten hoogste drie maanden, of zoveel langer als aantoonbaar
      onvermijdelijk blijkt, doorbetaald ten behoeve van de nagelaten gezinsleden, voor zover deze tegemoetkoming verband
      houdt met hun verblijf in het buitenland.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel51
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '51'
        hoofdstuk: X
        paragraaf: '3'
  - number: '106.8'
    text: |-
      Overlijdt de overplaatsbare ambtenaar van de DBZ gedurende het tijdvak waarover aan deze de in het
      [derde lid van artikel 51][ref1] genoemde tegemoetkoming is toegekend, wordt de in dat lid bedoelde regeling
      voortgezet ten behoeve van de nagelaten gezinsleden, voor zolang de bijzondere kosten te hunnen aanzien doorlopen;
      de hoogte van de vergoeding wordt dan berekend als ware de overplaatsbare ambtenaar van de DBZ niet overleden.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel51
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '51'
        hoofdstuk: X
        paragraaf: '3'
  - number: '106.9'
    text: |-
      Overlijdt de overplaatsbare ambtenaar van de DBZ gedurende een plaatsing in het buitenland en verkiezen de
      nagelaten gezinsleden naar Nederland terug te keren, dan geldt de in het [derde lid van artikel 51][ref1] bepaalde
      regeling eveneens voor zolang de bijzondere kosten te hunnen aanzien doorlopen. Voor de berekening van de hoogte
      en de duur van de in die regeling voorziene tegemoetkoming in de bijzondere kosten wordt de regeling dan geacht
      te zijn ingegaan op de dag, volgende op de dag waarop de overplaatsbare ambtenaar van de DBZ is overleden. Is na
      diens overlijden met toepassing van het zesde lid de tegemoetkoming, bedoeld in [artikel 51, eerste lid][ref2],
      doorbetaald, dan wordt over dat tijdvak de eerstgenoemde tegemoetkoming geacht voor de laatstgenoemde in de plaats
      te zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel51
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '51'
        hoofdstuk: X
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '51'
        hoofdstuk: X
        paragraaf: '3'
  - number: 106a
    text: |-
      Na het overlijden van de gewezen overplaatsbare ambtenaar van de DBZ, die op de dag van zijn overlijden
      op grond van de [artikelen 38][ref1] en [46 van het ARAR][ref2] in het genot was van doorbetaling van zijn
      laatstelijk genoten bezoldiging, wordt aan de in [artikel 106][ref3] bedoelde personen en met overeenkomstige
      toepassing van dat artikel een bedrag uitgekeerd, gelijk aan de bezoldiging welke de gewezen ambtenaar
      op de dag van zijn overlijden genoot, berekend over een tijdvak van drie maanden. Op deze uitkering
      wordt in mindering gebracht het bedrag van de uitkering op grond van [artikel 35 van de Ziektewet][ref4],
      [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref5], de [artikelen 6][ref6] en
      [11 van het Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref7] en naar aard en
      strekking daarmee overeenkomende uitkeringen, indien deze uitkeringen worden uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel106
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel53
      [ref6]: https://wetten.overheid.nl/BWBR0008114#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0008114#Artikel11
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel106a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '46'
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '106'
        hoofdstuk: XVI
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: '53'
      - id: ref6
        bwb_id: BWBR0008114
        artikel: '6'
      - id: ref7
        bwb_id: BWBR0008114
        artikel: '11'
  - number: 106b.1
    text: |-
      Indien het overlijden van een overplaatsbaar ambtenaar van de DBZ is veroorzaakt door een dienstongeval of een
      door het verrichten van zijn arbeid opgelopen beroepsziekte, wordt aan degene die in verband met dit overlijden
      krachtens het Pensioenreglement van de Stichting Pensioenfonds ABP, een nabestaandenpensioen geniet, een uitkering
      toegekend overeenkomstig [artikel 102b van het ARAR][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel102b
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel106b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 102b
  - number: 106b.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de gewezen overplaatsbare ambtenaar van de DBZ ten aanzien van
      wie [artikel 38, derde lid, van het ARAR][ref1] toepassing heeft gevonden, indien zijn overlijden het rechtstreeks
      gevolg is van de arbeidsongeschiktheid, bedoeld in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel38
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel106b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '38'
  - number: '107'
    text: |-
      Gedurende de maand van het overlijden en de volgende drie maanden behouden de achterblijvende gezinsleden het
      gebruik van de ambts- of dienstwoning, waarin zij met de overplaatsbare ambtenaar van de DBZ woonden. Daarvan kan
      echter worden afgeweken als Onze Minister dat in het belang van de dienst noodzakelijk acht. Alsdan wordt door Onze
      Minister naar billijkheid een schadevergoeding gegeven.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel107
  - number: '108'
    text: |-
      Indien door de overplaatsbare ambtenaar van de DBZ voor het gebruik van een ambts- of dienstwoning een vergoeding
      verschuldigd was, voldoen de achtergebleven gezinsleden deze over de tijd gedurende welke zij het gebruik dier
      woning behouden.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel108
  - number: '109.1'
    text: |-
      Bij vermissing van de overplaatsbare ambtenaar van de DBZ vinden, behoudens het tweede lid, de
      [artikelen 106 tot en met 108][ref1] overeenkomstig toepassing. De overplaatsbare ambtenaar van de DBZ wordt
      daarbij geacht te zijn overleden op een door Onze Minister te bepalen dag.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel106
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '106'
        hoofdstuk: XVI
        paragraaf: '2'
  - number: '109.2'
    text: |-
      Het [tweede lid van artikel 106][ref1] vindt geen toepassing indien gegronde vermoedens bestaan, dat de vermissing
      het gevolg is van ongeoorloofde afwezigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel106
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '106'
        hoofdstuk: XVI
        paragraaf: '2'
  - number: '109.3'
    text: |-
      Indien blijkt, dat de als vermist beschouwde ambtenaar van de DBZ in leven is, kan ter beoordeling van het tot
      aanstelling bevoegd gezag de bezoldiging alsnog worden uitbetaald, tenzij gegronde vermoedens bestaan dat de
      vermissing het gevolg was van ongeoorloofde afwezigheid.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel109
  - number: '109.4'
    text: |-
      Indien uit hoofde van de vermissing van de overplaatsbare ambtenaar van de DBZ pensioen of enige andere uitkering,
      voortvloeiende uit diens ambtelijke rechtspositieregeling, is toegekend over het tijdvak waarover naar het oordeel
      van het tot aanstelling bevoegd gezag aanspraak bestaat op bezoldiging, wordt die bezoldiging verminderd met de
      over dat tijdvak aldus uitbetaalde bedragen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel109
  - number: '109.5'
    text: |-
      De bezoldiging, waarop de overplaatsbare ambtenaar van de DBZ ingevolge het derde en het vierde lid aanspraak
      heeft, kan aan anderen dan de overplaatsbare ambtenaar van de DBZ worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel109
  - number: '110'
    text: |-
      Naast de in het [eerste lid, aanhef en onder ][ref1] van toepassing verklaarde bepalingen van dit reglement, zijn
      op niet-overplaatsbare ambtenaren van de DBZ van overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel16
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '16'
        hoofdstuk: III
  - number: 110.a
    text: |-
      de bepalingen van het [ARAR][ref1], behoudens de [artikelen 49ca][ref2], [71][ref3] en [71a][ref4] en
      [hoofdstuk XI van het ARAR][ref5], alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49ca
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel71
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel71a
      [ref5]: https://wetten.overheid.nl/BWBR0001950#HoofdstukXI
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0001950
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 49ca
      - id: ref3
        bwb_id: BWBR0001950
        artikel: '71'
      - id: ref4
        bwb_id: BWBR0001950
        artikel: 71a
      - id: ref5
        bwb_id: BWBR0001950
        hoofdstuk: XI
  - number: 110.b
    text: |-
      de [artikelen 33][ref1], [54, eerste lid, onder b en zesde tot en met elfde lid][ref2], [83][ref3], [83a][ref4] en
      [99, tweede lid, van dit reglement][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel83
      [ref4]: https://wetten.overheid.nl/BWBR0004052#Artikel83a
      [ref5]: https://wetten.overheid.nl/BWBR0004052#Artikel99
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '33'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '54'
        hoofdstuk: XII
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '83'
        hoofdstuk: XIV
      - id: ref4
        bwb_id: BWBR0004052
        artikel: 83a
        hoofdstuk: XIV
      - id: ref5
        bwb_id: BWBR0004052
        artikel: '99'
        hoofdstuk: XVI
        paragraaf: '2'
  - number: '111.1'
    text: |-
      De niet-overplaatsbare ambtenaar van de DBZ kan met behoud van diens rechtspositie in uitzonderlijke gevallen,
      ter beoordeling van Onze Minister, mits betrokkene aan de eisen voor het vervullen van de desbetreffende functie
      voldoet, op diens aanvraag dan wel met diens instemming, hier te lande tijdelijk worden benoemd in een der voor
      overplaatsbare ambtenaren van de DBZ bestemde functies.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel111
  - number: '111.2'
    text: |-
      Reflecteert naar de in het eerste lid bedoelde functie ook een overplaatsbaar ambtenaar van de DBZ die aan de eisen
      van die functie voldoet, dan heeft deze voorrang.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel111
  - number: '112'
    text: |-
      De niet-overplaatsbare ambtenaar van de DBZ kan met overgang naar de rechtspositie van overplaatsbaar ambtenaar
      van de DBZ op diens aanvraag voor de rest van het dienstverband bij de DBZ, mits betrokkene voldoet aan de in
      [artikel 20][ref1] voor overplaatsbare ambtenaren van de DBZ gestelde voorwaarden, als overplaatsbaar ambtenaar van
      de DBZ worden aangesteld met inachtneming van het navolgende:


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel20
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '20'
        hoofdstuk: V
        paragraaf: '2'
  - number: 112.a
    text: |-
      Onze Minister kan in bijzondere gevallen, na advies van de Adviescommissie Aanstellingen Overplaatsbare Ambtenaren
      DBZ, ontheffing verlenen van de gestelde leeftijdseis;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel112
  - number: 112.b
    text: |-
      Onze Minister kan op aanvraag van de betrokkene bepalen dat deze zonder het in [artikel 23][ref1] bedoelde
      toelatingsonderzoek wordt toegelaten tot de eerste opleiding dan wel introductiecursus, bedoeld in
      [artikel 29][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel29
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '23'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '29'
        hoofdstuk: V
        paragraaf: '4'
  - number: 112.c
    text: |-
      Onze Minister kan op aanvraag van de betrokkene, na advies van de Adviescommissie Aanstellingen Overplaatsbare
      Ambtenaren DBZ, bepalen dat vanwege als niet-overplaatsbaar ambtenaar van de DBZ opgedane deskundigheid en ervaring
      een door hem te bepalen deel van de eerste opleiding dan wel introductiecursus kan vervallen; in dat geval heeft
      het examen, bedoeld in [artikel 29][ref1], betrekking op het resterende deel van de eerste opleiding;


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel29
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '29'
        hoofdstuk: V
        paragraaf: '4'
  - number: 112.d
    text: |-
      gedurende de deelname aan de eerste opleiding blijft de rechtspositie ongewijzigd; deelname aan de eerste opleiding
      en het examen geldt voor de betrokkene als dienstopdracht in diens functie als niet-overplaatsbaar ambtenaar voor
      de gehele arbeidstijd of voor een deel daarvan;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel112
  - number: 112.e
    text: |-
      de betrokkene verkrijgt de rechtspositie van overplaatsbaar ambtenaar van de DBZ met ingang van de dag waarop
      deze wordt aangesteld als overplaatsbaar ambtenaar van de DBZ; is betrokkene reeds aangesteld in vaste dienst, dan
      blijft deze in vaste dienst aangesteld, in afwijking van het [achtste lid van artikel 29][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel29
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '29'
        hoofdstuk: V
        paragraaf: '4'
  - number: '113.1'
    text: |-
      Niet-overplaatsbare ambtenaren van de DBZ kunnen, alléén binnen het kader van hun ambtsvervulling dan wel
      opleiding, met hun instemming tijdelijk aan vertegenwoordigingen van het Koninkrijk in het buitenland worden
      toegevoegd.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel113
  - number: '113.2'
    text: |-
      Gedurende toevoegingen, in het eerste lid bedoeld, behouden zij hun rechtspositie, met dien verstande dat
      regelingen welke gelden voor in het buitenland geplaatste overplaatsbare ambtenaren van de DBZ op hen van
      overeenkomstige toepassing worden verklaard, indien en voor zover hun toevoeging zulks verlangt.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel113
  - number: 113a.1
    text: |-
      Naast de in het [eerste lid, aanhef en onder ][ref1] van toepassing verklaarde bepalingen van dit
      reglement, zijn op tijdelijke ambtenaren van de DBZ van overeenkomstige toepassing de [artikelen 6][ref2]
      en[ 12, derde lid, van het ARAR][ref3], alsmede de [artikelen 18, vierde lid, onderdeel ][ref4],
      [19, eerste lid][ref5], [25][ref6], [26][ref7], [27][ref8], [28][ref9], [30, tiende lid][ref10], [33][ref11] en
      [45][ref12] en de [hoofdstukken IX tot en met XVI van dit reglement][ref13], met dien verstande dat


