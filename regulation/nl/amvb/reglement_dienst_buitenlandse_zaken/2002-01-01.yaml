        artikel: '54'
        hoofdstuk: XII
  - number: '120'
    text: |-
      De volgende artikelen van [boek 7, titel 10, van het Burgerlijk Wetboek][ref1] zijn van toepassing op de
      arbeidsovereenkomst met plaatselijk indienstgenomen werknemers:[ 612, tweede tot en met vierde lid][ref2];
      [614][ref3]; [633][ref4]; [652][ref5];[ 674, eerste lid][ref6]; [676][ref7];[ 677, eerste en vierde lid][ref8];
      [678][ref9]; [679][ref10]; [680, eerste lid en vijfde tot en met zevende lid][ref11]; [681][ref12]; [682][ref13]
      en [683, eerste lid][ref14].


