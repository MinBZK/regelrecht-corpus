      - id: ref13
        bwb_id: BWBR0004052
        hoofdstuk: IX
  - number: 113a.1.a
    text: |-
      in afwijking van [artikel 48, eerste lid][ref1], de salarisschaal welke voor de tijdelijke ambtenaren van de DBZ
      zal gelden wordt vastgesteld met overeenkomstige toepassing van de [BBRA 1984][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel113a
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '48'
        hoofdstuk: X
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003630
  - number: 113a.1.b
    text: 'telkens voor "overplaatsbaar ambtenaar" dient te worden gelezen: tijdelijk ambtenaar;'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel113a
  - number: 113a.1.c
    text: |-
      telkens voor "waar ook ter wereld" dient te worden gelezen: het gebied waarin de desbetreffende vertegenwoordiging
      van het Koninkrijk in het buitenland is gevestigd;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel113a
  - number: 113a.1.d
    text: |-
      in [artikel 98, eerste lid][ref1], voor "overtolligheid" dient te worden gelezen: opheffing van zijn functie dan
      wel wegens overtolligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel98
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel113a
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '98'
        hoofdstuk: XVI
        paragraaf: '2'
  - number: 113a.2
    text: |-
      Aanstelling van de tijdelijke ambtenaar van de DBZ geschiedt in tijdelijke dienst voor een bepaalde duur; deze duur
      is ten hoogste een periode van vier jaren.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel113a
  - number: 113a.3
    text: Het dienstverband eindigt na het verstrijken van de in het tweede lid bedoelde duur.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel113a
  - number: 113a.4
    text: |-
      Na het verstrijken van de in het tweede lid bedoelde duur kan, indien het belang van de dienst daarmede wordt
      gediend, een nieuwe aanstelling op grond van dat lid worden verleend.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel113a
  - number: 113a.5
    text: |-
      In bijzondere gevallen kan een tijdelijk ambtenaar van de DBZ, voorafgaande aan zijn uitzending dan wel na
      beëindiging van de uitzending, tijdelijk worden belast met werkzaamheden op het departement.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel113a
  - number: '114.1'
    text: |-
      Onze Minister kan voor werkzaamheden bij een vertegenwoordiging van het Koninkrijk in het buitenland, werknemers op
      arbeidsovereenkomst naar burgerlijk recht in dienst nemen.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel114
  - number: '114.2'
    text: |-
      Onze Minister bepaalt of een functie bij een vertegenwoordiging van het Koninkrijk in het buitenland door een
      plaatselijk in dienst te nemen werknemer zal worden vervuld.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel114
  - number: '114.3'
    text: |-
      Het indienstnemen van werknemers die niet de Nederlandse nationaliteit bezitten is mogelijk, mits dezen in hun
      functie niet met daadwerkelijk overheidsgezag worden bekleed.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel114
  - number: '115'
    text: |-
      Ter ondersteuning van een gedetacheerde ambtenaar als bedoeld in [artikel 8, derde lid, onder ][ref1], kan door
      Onze Minister, hoofd van het betrokken ministerie, in overeenstemming met Onze Minister, aan het hoofd van een
      vertegenwoordiging van het Koninkrijk in het buitenland volmacht worden verleend tot het in dienst nemen van een
      werknemer op arbeidsovereenkomst naar burgerlijk recht voor werkzaamheden bij die vertegenwoordiging. De in de
      vorige volzin bedoelde werknemers worden met betrekking tot hun dienstverrichtingen gelijkgesteld met degenen die
      tot de DBZ behoren. De bepalingen in of krachtens dit reglement gesteld welke van toepassing zijn op werknemers
      behorende tot de DBZ, zijn op hen van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '8'
        hoofdstuk: II
  - number: '116'
    text: 'De op arbeidsovereenkomst naar burgerlijk recht in dienst genomen werknemer verbindt zich:'
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel116
  - number: 116.a
    text: de opgedragen werkzaamheden naar beste vermogen te verrichten;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel116
  - number: 116.b
    text: |-
      indien [artikel 114, eerste lid][ref1], van toepassing is: zich te gedragen naar de voorschriften en aanwijzingen
      welke hem, met inachtneming van de verantwoordelijkheden van Onze Minister voor Ontwikkelingssamenwerking alsmede
      van Onze Minister van Economische Zaken ingevolge het [vierde en vijfde lid van artikel 12][ref2], door of namens
      Onze Minister, dan wel door of namens het hoofd van de vertegenwoordiging van het Koninkrijk in het buitenland
      waarbij de werknemer diens werkzaamheden verricht, worden gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel12
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '114'
        hoofdstuk: XVIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '12'
        hoofdstuk: II
  - number: 116.c
    text: |-
      indien [artikel 115][ref1], van toepassing is: zich te gedragen naar de voorschriften en aanwijzingen welke hem
      door of namens Onze Minister, hoofd van het betrokken ministerie, worden gegeven, onverminderd het gestelde in
      [artikel 12, eerste en tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel12
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '115'
        hoofdstuk: XVIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '12'
        hoofdstuk: II
  - number: 116.d
    text: |-
      tot het afleggen van de eed of belofte, indien hij deze ingevolge [artikel 117, derde lid][ref1], dient af te
      leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel117
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '117'
        hoofdstuk: XVIII
        paragraaf: '1'
  - number: '117.1'
    text: |-
      Zo spoedig mogelijk na diens indiensttreding legt de werknemer ten overstaan van een door Onze Minister daartoe
      aangewezen ambtenaar van de DBZ de navolgende eed of belofte af: "Ik zweer/beloof trouw aan de Koning, aan de
      [Grondwet][ref1] en aan de overige wetten van het Rijk. Ik zweer/verklaar dat ik tot het verkrijgen van mijn
      betrekking aan niemand iets heb gegeven of beloofd, noch zal geven of beloven. Ik zweer/beloof dat ik om iets
      in mijn werkzaamheden te doen of te laten, van niemand enige belofte of geschenk aannemen zal, en dat ik mij
      als een goed werknemer, zal gedragen, de mij verstrekte opdrachten zal volbrengen, en de zaken waarvan ik door
      mijn werkzaamheden kennis draag en waarvan ik het geheim of vertrouwelijk karakter weet of moet begrijpen, niet
      zal openbaren aan anderen dan aan hen, aan wie ik volgens de wet of ambtshalve tot mededeling verplicht ben. Zo
      waarlijk helpe mij God Almachtig! (Dat verklaar en beloof ik)."


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '117.2'
    text: |-
      Indien de werknemer niet in het bezit is van de Nederlandse nationaliteit, blijft de eerste zin van de eed of
      belofte achterwege.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel117
  - number: '117.3'
    text: |-
      De op de voet van [artikel 114][ref1] of [115][ref2] indienstgenomen werknemer legt de in het eerste en tweede lid
      bedoelde eed of belofte alleen af, indien de door deze te vervullen functie zulks, naar het oordeel van het hoofd
      van de desbetreffende vertegenwoordiging van het Koninkrijk in het buitenland, wettigt.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel115
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '114'
        hoofdstuk: XVIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '115'
        hoofdstuk: XVIII
        paragraaf: '1'
  - number: '118.1'
    text: |-
      Arbeidsovereenkomsten naar burgerlijk recht worden schriftelijk aangegaan in de Nederlandse taal; bij niet-
      Nederlanders met vertaling in een taal die de werknemer voldoende machtig is. Daarin worden ten minste vermeld:
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel118
  - number: 118.1.a
    text: de naam, voornamen en geboortedatum van de werknemer;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel118
  - number: 118.1.b
    text: de datum waarop betrokkene in dienst treedt;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel118
  - number: 118.1.c
    text: |-
      of de arbeidsovereenkomst wordt aangegaan voor bepaalde of voor onbepaalde tijd; wordt deze voor bepaalde tijd
      aangegaan, dan wordt die tijd vermeld;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel118
  - number: 118.1.d
    text: |-
      welke periode als proeftijd in de zin van [artikel 652 van boek 7, titel 10, van het Burgerlijk Wetboek](onbekend)
      is overeengekomen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel118
  - number: 118.1.e
    text: het loon waarop de werknemer in dienst is genomen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel118
  - number: 118.1.f
    text: |-
      het aan betrokkene toekomende genot van kost, inwoning of andere vormen van loon in natura, alsmede de daarmee
      verbandhoudende inhoudingen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel118
  - number: 118.1.g
    text: de aard van de werkzaamheden welke de werknemer gewoonlijk zullen worden opgedragen;
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel118
  - number: 118.1.h
    text: de bepalingen, in of krachtens dit reglement gesteld, welke op de arbeidsovereenkomst van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel118
  - number: '118.2'
    text: |-
      Wijzigingen van de in of krachtens dit reglement getroffen regelingen werken door naar de met betrokkene gesloten
      arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel118
  - number: '118.3'
    text: |-
      De werknemer wordt, zo mogelijk vóór de indiensttreding, schriftelijk in kennis gesteld van de hoofdpunten van
      zijn rechtspositie; indien de werknemer de Nederlandse taal niet machtig is, geschiedt dit in een taal welke in het
      internationale verkeer ter plaatse gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel118
  - number: '119'
    text: |-
      Naast de in [artikel 16, derde lid][ref1], van toepassing verklaarde hoofdstukken, zijn de volgende artikelen van
      dit reglement van overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel16
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '16'
        hoofdstuk: III
  - number: 119.a
    text: |-
      [26, eerste lid en tweede lid, eerste zinsdeel][ref1], en [84][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel84
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel119
    references:
