        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '84'
        hoofdstuk: XIV
  - number: 119.b
    text: |-
      [54, zesde tot en met elfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel54
    url: https://wetten.overheid.nl/BWBR0004052/2002-01-01#Artikel119
    references:
      - id: ref1
