articles:
  - number: '1'
    text: |-
      Naar de regels bij of krachtens dit besluit wordt vergoeding verleend van reis- en verblijfkosten in verband met
      buitenlandse dienstreizen.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel1
  - number: '2'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister:

      het hoofd van het betrokken ministerie;

      b. betrokkene:

      degene die op basis van het [Algemeen Rijksambtenarenreglement][ref1], het
      [Ambtenarenreglement Staten-Generaal][ref2] of het [Reglement Dienst Buitenlandse Zaken][ref3]
      werkzaam is, met dien verstande dat bij de tewerkstelling in het buitenland op basis van het
      [Reglement Dienst Buitenlandse Zaken][ref4], de bij of krachtens dat reglement gestelde regels gelden;

      c. dienstreis:

      een door het bevoegd gezag schriftelijk opgedragen reis in verband met het verrichten van werkzaamheden buiten
      Nederland alsmede het hiermee verband houdende verblijf, met uitzondering van de reis die in Nederland is begonnen
      en waarbij het reisgedeelte buiten Nederland beperkt is of waarbij de grensoverschrijding niet noodzakelijkerwijs
      leidt tot uitgaven voor maaltijden of overnachting in het buitenland.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
