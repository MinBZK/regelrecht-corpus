        hoofdstuk: '2'
        paragraaf: '3'
  - number: '4'
    text: Het beginpunt en het eindpunt van de dienstreis worden bepaald door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel4
  - number: '5'
    text: |-
      Indien van derden vergoedingen worden ontvangen voor de in dit besluit bedoelde kosten, worden deze in mindering
      gebracht op de vergoedingen waarop krachtens dit besluit aanspraak bestaat met dien verstande dat de betrokkene op
      wie een door de Commissie van de Europese Gemeenschappen vastgestelde communautaire vergoedingsregeling voor reis-
      en verblijfkosten van toepassing is geen aanspraak heeft op vergoedingen krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel5
  - number: '6'
    text: |-
      1 Wegens reiskosten per openbaar vervoer, per boot en per vliegtuig worden vergoed de kosten die blijkens
      overgelegde bewijsstukken in verband met de dienstreis zijn gemaakt voor het gebruik van daartoe door het bevoegd
      gezag aangewezen vervoermiddelen.

      2 De betrokkene die tijdens een dienstreis gebruik maakt van vervoer per trein, is gerechtigd om voor rijksrekening
      in de eerste klasse te reizen. Indien gebruik wordt gemaakt van een ander openbaar vervoermiddel, een boot of
      een vliegtuig met vervoerklassen, bepaalt het bevoegd gezag in welke vervoerklasse mag worden gereisd, met dien
      verstande dat het reizen per vliegtuig in de eerste klasse of een daarmee vergelijkbare klasse niet voor vergoeding
      in aanmerking komt.

      3 Voor zover het dienstbelang dan wel de reisomstandigheden naar het oordeel van het bevoegd gezag daartoe
      aanleiding geven, worden toeslagen voor bijzondere treinen, kosten van plaatsreservering in treinen en kosten voor
      het gebruik van een slaapwagen alsmede extra kosten voor bagage als reiskosten vergoed.

      4 De volgende kosten worden eveneens als reiskosten vergoed:

      a. kosten van vervoer van het station, de haven of het vliegveld van aankomst naar de plaats van bestemming op de
      heenreis en op de terugreis;

      b. kosten voor luchthavenrechten;

      c. kosten voor een kruier.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel6
  - number: '7'
    text: |-
      Indien voor een binnen Nederland verlopend gedeelte van de dienstreis dat aansluit op een een reisgedeelte per
      openbaar vervoer, vliegtuig of boot met toestemming van het bevoegd gezag gebruik wordt gemaakt van een eigen
      motorvoertuig, wordt daarvoor een vergoeding verleend volgens door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties te stellen regels.

      Daarbij wordt onderscheid gemaakt in:

      a. een vergoeding voor het gebruik van het motorvoertuig indien niet of niet op doelmatige wijze per openbaar
      vervoer kan worden gereisd;

      b. een vergoeding voor het gebruik van het motorvoertuig in bijzondere gevallen indien op doelmatige wijze per
      openbaar vervoer kan worden gereisd.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel7
  - number: '8'
    text: |-
      Indien naar het oordeel van het bevoegd gezag het dienstbelang ermee is gebaat dat tijdens een dienstreis gebruik
      wordt gemaakt van een gehuurd vervoermiddel of een taxi, worden de aan dat gebruik verbonden kosten volledig
      vergoed.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel8
  - number: '9'
    text: |-
      Het bevoegd gezag kan bij een dienstreis van lange duur aan de betrokkene toestemming verlenen voor één of meer
      bezoeken van korte duur naar zijn woonplaats terug te keren. De reiskosten die blijkens overgelegde bewijsstukken
      voor een bezoekreis zijn gemaakt, worden slechts vergoed indien in overeenstemming met het bevoegd gezag gebruik is
      gemaakt van een openbaar middel van vervoer, een vliegtuig of een boot, naar de laagste klasse. Voor een bezoekreis
      is het [vierde lid van artikel 6][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006842#Artikel6
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006842
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '10'
    text: |-
      1 Verblijfkosten zijn de in verband met een dienstreis noodzakelijk gemaakte kosten voor maaltijden, logies en
      kleine uitgaven.

      2 De verblijfkosten worden vergoed volgens door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties te
      stellen regels.

      3 Geen aanspraak op vergoeding wegens verblijfkosten bestaat:

      a. voor een dienstreis van korter dan vier uur;

      b. voor een reisgedeelte in Nederland van korter dan vier uur dat aansluit op een reis of reisgedeelte per boot of
      vliegtuig met uitzondering van vliegreizen binnen Europa;

      c. voor een reisgedeelte per vliegtuig met uitzondering van vliegreizen binnen Europa;

      d. voor een bezoekreis als bedoeld in [artikel 9][ref1] met uitzondering van die delen van de reis die verband
      houden met het afleggen van het traject tijdelijke verblijfplaats-woonplaats.

      4 Aan de betrokkene die tijdens de dienstreis overnachting van overheidswege ontvangt en daarvoor kosten maakt,
      worden deze kosten vergoed. In geval van de verstrekking van overheidswege geen gebruik is gemaakt, bestaat geen
      aanspraak op vergoeding.

      5 Geen aanspraak op vergoeding voor maaltijden bestaat indien tijdens een dienstreis gelegenheid bestaat al dan
      niet tegen betaling maaltijden van overheidswege te ontvangen, tenzij de betrokkene aannemelijk maakt dat hij
      daarvan geen gebruik heeft kunnen maken.

      6 Het bevoegd gezag kan een lagere vergoeding wegens verblijfkosten vaststellen dan de vergoeding die wordt
      vastgesteld volgens de in het tweede lid bedoelde regels, indien veelvuldig dienstreizen moeten worden gemaakt en
      de aard der werkzaamheden of de reisomstandigheden van de betrokkene daartoe naar het oordeel van het bevoegd gezag
      aanleiding geven.

      7 Het bevoegd gezag kan een betrokkene die met alle bewijsstukken aantoont dat een vergoeding vastgesteld volgens
      de in het tweede lid bedoelde regels door bijzondere omstandigheden niet toereikend is om de tijdens de dienstreis
      gemaakte verblijfkosten te bestrijden, toestaan de meerdere kosten, hetzij geheel, hetzij gedeeltelijk in rekening
      te brengen.

      8 Onder overnachting van overheidswege bedoeld in het vierde lid en maaltijden van overheidswege bedoeld in het
      vijfde lid worden verstaan:

      overnachting en maaltijden verstrekt vanwege het Rijk of een ander Nederlands publiekrechtelijk lichaam of semi-
      publiekrechtelijk lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0006842#Artikel9
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006842
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '11'
    text: |-
      De in verband met een dienstreis gemaakte kosten voor interlokale en internationale telefoongesprekken ten
      behoeve van dienstdoeleinden alsmede de naar het oordeel van het bevoegd gezag noodzakelijk gemaakte kosten voor
      vaccinatie, een cursus, representatie en voor inschrijving voor een conferentie worden op basis van overgelegde
      bewijsstukken volledig vergoed.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel11
  - number: '12'
    text: |-
      Indien klimatologische of andere bijzondere omstandigheden in een tijdens een dienstreis te bezoeken land daartoe
      aanleiding geven, kan het bevoegd gezag volgens door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties te
      stellen regels aan de betrokkene een tegemoetkoming verlenen in de aangetoonde en naar het oordeel van het bevoegd
      gezag noodzakelijk gemaakte kosten voor bijzondere kleding en uitrusting.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel12
  - number: '13'
    text: |-
      1 Indien de betrokkene aantoont dat hij tijdens een dienstreis tengevolge van ziekte of van een ongeval kosten
      heeft moeten maken, kan het bevoegd gezag hiervoor een vergoeding vaststellen voor zover deze kosten ten laste van
      betrokkene blijven.

      2 Indien de betrokkene aantoont dat hij tengevolge van verlies, diefstal of beschadiging van voor de dienstreis
      meegenomen noodzakelijke bagage kosten heeft moeten maken, kan het bevoegd gezag hiervoor een vergoeding
      vaststellen, zulks tot ten hoogste een nader door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties vast
      te stellen maximum.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel13
  - number: '14'
    text: |-
      Onze Minister kan ten aanzien van een betrokkene of een door hem aan te wijzen groep van betrokkenen, in afwijking
      van de bij of krachtens dit besluit gestelde regelen besluiten, indien bijzondere omstandigheden daartoe aanleiding
      geven.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel14
  - number: '15'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties voor bepaalde
      groepen personeel in afwijking van dit besluit bijzondere regelingen treffen.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel15
  - number: 15a
    text: |-
      1 Voor de gevallen waarin het bevoegd gezag er op verzoek van de overheid van de Nederlandse Antillen of Aruba
      mee instemt dat de betrokkene wordt uitgezonden naar de Nederlandse Antillen of Aruba, stelt Onze Minister
      voor Nederlands-Antilliaanse en Arubaanse Zaken in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties een bijzondere regeling vast, waarbij kan worden afgeweken van de overige bepalingen van dit
      besluit.

      2 Over de wijziging van de vergoedingen, opgenomen in de in het eerste lid bedoelde regeling, wordt overleg gevoerd
      met de centrales van overheidspersoneel in het Sectoroverleg Rijkspersoneel, voor zover een lid van dat overleg de
      behoefte daaraan aan de voorzitter heeft kenbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel15a
  - number: 15b
    text: |-
      Van de bevoegdheid tot het stellen van regels met een sterk technisch karakter krachtens dit besluit, kunnen Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister mandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel15b
  - number: '16'
    text: |-
      1 Het declareren van de in dit besluit bedoelde kosten geschiedt op een door het bevoegd gezag voorgeschreven
      wijze.

      2 De aanspraak op een vergoeding vervalt, indien de betrokkene de declaratie niet heeft ingediend binnen drie
      maanden na beëindiging van de dienstreis waarop de declaratie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel16
  - number: '17'
    text: |-
      Over de wijzigingen van de vergoedingen voor reis- en verblijfkosten krachtens dit besluit wordt overleg gevoerd
      met de centrales van overheidspersoneel in de Sectorcommissie overleg rijkspersoneel, voor zover een lid de
      behoefte daaraan aan de voorzitter heeft kenbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel17
  - number: '18'
    text: Het Reisbesluit 1971 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel18
  - number: '19'
    text: |-
      Aan de vice-president van de Raad van State, het College van de Algemene Rekenkamer, de Nationale ombudsman,
      de directeur van het Kabinet der Koningin, alsmede aan personen die genoemde ambten waarnemen of de dragers van
      genoemde ambten vervangen, wordt voor hun buitenlandse dienstreizen vergoeding verleend tot de bedragen, die
      volgens hun opgaven met inachtneming van gepaste zuinigheid in totaal, onderscheidenlijk voor reiskosten en voor
      verblijfkosten, zijn uitgegeven, in voorkomende gevallen daaronder begrepen de uitgaven van en ten behoeve van de
      reizigers die hen vergezellen.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel19
  - number: '21'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het *Staatsblad* waarin het is geplaatst.
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel21
  - number: '22'
    text: 'Dit besluit wordt aangehaald als: Reisbesluit buitenland.'
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel22
