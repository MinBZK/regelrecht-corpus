  - number: '3'
    text: |-
      Voor de toepassing van dit besluit worden, behoudens voor de toepassing van [artikel 15a][ref1], met Onze Minister
      gelijkgesteld: het tot aanstelling bevoegd gezag bij elk der beide Kamers der Staten-Generaal, de vice-president
      van de Raad van State, het College van de Algemene Rekenkamer, de Nationale ombudsman en de directeur van het
      Kabinet der Koningin.


      [ref1]: https://wetten.overheid.nl/BWBR0006842#Artikel15a
    url: https://wetten.overheid.nl/BWBR0006842/2007-06-20#Artikel3
