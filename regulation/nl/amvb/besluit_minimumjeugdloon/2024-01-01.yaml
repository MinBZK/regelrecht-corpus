articles:
  - number: '1'
    text: |-
      Werknemers die de leeftijd van 15 jaar doch niet die van 21 jaar hebben bereikt, hebben het recht, bedoeld in
      [artikel 7, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
    url: https://wetten.overheid.nl/BWBR0003599/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
  - number: '2'
    text: |-
      1 Het minimumloon waarop [artikel 1][ref1] recht geeft, bedraagt voor werknemers in de
      hierna te onderscheiden leeftijdscategorieën het daarbij aan te geven percentage van
      het minimumloon, dat geldt ingevolge de [artikelen 8, eerste lid, onderdeel a][ref2], en
      [14, tiende lid, van de Wet minimumloon en minimumvakantiebijslag][ref3]:

      de 20-jarigen: 80

      de 19-jarigen: 60

      de 18-jarigen: 50

      de 17-jarigen: 39½

      de 16-jarigen: 34½

      de 15-jarigen: 30.

      2 Het uit de toepassing van het eerste lid voortvloeiende uurloon wordt afgerond op een veelvoud van € 0,01. Indien
      het restbedrag € 0,005 of meer bedraagt, geschiedt de afronding naar boven.


      [ref1]: https://wetten.overheid.nl/BWBR0003599#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0003599/2024-01-01#Artikel2
    references:
      - id: ref1
