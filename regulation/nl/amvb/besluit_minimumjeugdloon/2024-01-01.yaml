        bwb_id: BWBR0002638
        artikel: '14'
  - number: '3'
    text: |-
      1 In afwijking van [artikel 2][ref1] bedraagt het minimumloon waarop [artikel 1][ref2] recht geeft, voor
      werknemers die werkzaam zijn op basis van een arbeidsovereenkomst die is aangegaan in verband met een
      beroepsbegeleidende leerweg als bedoeld in [artikel 7.2.2 van de Wet educatie en beroepsonderwijs][ref3]
      in de hierna te onderscheiden leeftijdscategorieën het daarbij aan te geven percentage van het
      minimumloon, dat geldt ingevolge de [artikelen 8, eerste lid, onderdeel a, en vierde lid][ref4], en
      [14, tiende lid, van de Wet minimumloon en minimumvakantiebijslag][ref5]:

      de 20-jarigen: 61½

      de 19-jarigen: 52½

      de 18-jarigen: 45½

      de 17-jarigen: 39½

      de 16-jarigen: 34½

      de 15-jarigen: 30.

      2 [Artikel 2, tweede lid][ref6], is van overeenkomstige toepassing.


