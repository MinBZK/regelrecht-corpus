articles:
  - number: '1'
    text: |-
      Werknemers die de leeftijd van 15 jaar doch niet die van 23 jaar hebben bereikt, hebben de aanspraak, bedoeld in
      [artikel 7, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
    url: https://wetten.overheid.nl/BWBR0003599/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
  - number: '2.1'
    text: |-
      Het minimumloon waarop [artikel 1][ref1] aanspraak geeft, bedraagt voor de hierna te onderscheiden
      leeftijdscategorieën het daarbij aan te geven percentage van het minimumloon, dat geldt ingevolge de
      [artikelen 8][ref2], eerste lid en [14 van de Wet minimumloon en minimumvakantiebijslag][ref3]: de 22-jarigen: 85
      de 21-jarigen: 72½ de 20-jarigen: 61½ de 19-jarigen: 52½ de 18-jarigen: 45½ de 17-jarigen: 39½ de 16-jarigen: 34½
      de 15-jarigen: 30.


      [ref1]: https://wetten.overheid.nl/BWBR0003599#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0003599/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003599
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '2.2'
    text: |-
      De uit de toepassing van het voorgaande lid voortvloeiende maand- en weekbedragen worden afgerond op een veelvoud
      van € 0,05; indien het restbedrag € 0,025 of meer bedraagt, geschiedt de afronding naar boven.
    url: https://wetten.overheid.nl/BWBR0003599/2002-01-01#Artikel2
  - number: '3'
    text: |-
      Het Koninklijk besluit van 24 december 1980, houdende vaststelling van een minimumjeugdloonregeling (*Stb.* 699)
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003599/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      In afwijking van het in [artikel 2][ref1] bepaalde behouden werknemers, die op 30 juni 1983 uit hoofde van de
      arbeidsovereenkomst waarop hun dienstbetrekking berust aanspraak hebben op een minimumloon berekend volgens het
      in [artikel 3][ref2] genoemde Koninklijk besluit, aanspraak op een loon tenminste tot het voor hen op die datum
      geldende bedrag. Deze aanspraak geldt zolang de overeenkomst waarop de dienstbetrekking berust na 30 juni 1983
      voortduurt dan wel gedurende een na die datum aangegane andere overeenkomst waarop een dienstbetrekking in de zin
      van de [Wet minimumloon en minimumvakantiebijslag][ref3] berust, doch uiterlijk tot 1 juli 1984.


      [ref1]: https://wetten.overheid.nl/BWBR0003599#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003599#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0003599/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003599
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003599
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002638
  - number: '4.2'
    text: |-
      Indien het minimumloon dat geldt ingevolge de [artikelen 8][ref1], eerste lid, en
      [14 van de Wet minimumloon en minimumvakantiebijslag][ref2] met ingang van een na 30 juni 1983 gelegen datum wordt
      verlaagd, worden de bedragen van het loon waarop ingevolge het eerste lid tenminste aanspraak bestaat, met ingang
      van dezelfde datum naar evenredigheid verlaagd. [Artikel 2, tweede lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003599#Artikel2
    url: https://wetten.overheid.nl/BWBR0003599/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0003599
        artikel: '2'
  - number: '5'
    text: Dit besluit treedt in werking met ingang van 1 juli 1983.
    url: https://wetten.overheid.nl/BWBR0003599/2002-01-01#Artikel5
