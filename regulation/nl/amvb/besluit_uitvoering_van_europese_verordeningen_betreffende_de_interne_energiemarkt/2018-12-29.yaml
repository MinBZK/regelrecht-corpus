preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken en Klimaat van 21 augustus 2018, nr. WJZ / 18167795;

    Gelet op Richtlijn nr. 2009/72/EG van het Europees Parlement en de Raad van 13 juli 2009 betreffende
    gemeenschappelijke regels voor de interne markt voor elektriciteit en tot intrekking van Richtlijn 2003/54/EG
    (Pb EU 2009, L 211), Verordening nr. 714/2009 van het Europees Parlement en de Raad van 13 juli 2009 betreffende
    de voorwaarden voor toegang tot het net voor grensoverschrijdende handel in elektriciteit en tot intrekking van
    Verordening (EG) nr. 1228/2003 (Pb EU 2009, L 211), Richtlijn nr. 2009/73/EG van het Europees Parlement en de Raad
    van 13 juli 2009 betreffende gemeenschappelijke regels voor de interne markt voor aardgas en tot intrekking van
    Richtlijn 2003/55/EG (Pb EU 2009, L 211) en Verordening nr. 715/2009 van het Europees Parlement en de Raad van 13
    juli 2009 betreffende voorwaarden voor de toegang tot aardgastransmissienetten en tot intrekking van Verordening
    (EG) nr. 1775/2005 (Pb EU 2009, L 211) en de artikelen 39 van de Elektriciteitswet 1998 en 35a van de Gaswet;

    De Afdeling advisering van de Raad van State gehoord (advies van 26 oktober, nr. W18.18.0221/IV);

    Gezien het nader rapport van Onze Minister van Economische Zaken en Klimaat van 17 december 2018, nr. WJZ /
    18282731;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0041759/2018-12-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *richtlijn nr. 2009/72:* [Richtlijn nr. 2009/72/EG](32009L0072) van het
      Europees Parlement en de Raad van 13 juli 2009 betreffende gemeenschappelijke regels voor de interne markt voor
      elektriciteit en tot intrekking van [Richtlijn 2003/54/EG](32003L0054) (Pb EU 2009, L 211);
        - *richtlijn nr. 2009/73:* [Richtlijn nr. 2009/73/EG](32009L0073) van het Europees Parlement en de Raad van 13
      juli 2009 betreffende gemeenschappelijke regels voor de interne markt voor aardgas en tot intrekking van [Richtlijn
      2003/55/EG](32003L0055) (Pb EU 2009, L 211);
        - *verordening 2015/1222:* Verordening (EU) 2015/1222 van de Commissie van 24 juli 2015 tot vaststelling van
      richtsnoeren betreffende capaciteitstoewijzing en congestiebeheer (Pb EU 2015, L 197);
        - *benoemde elektriciteitsmarktbeheerder:* een elektriciteitsmarktbeheerder als bedoeld in artikel 2,
      drieëntwintigste lid, van [verordening 2015/1222](33122R2015).
    url: https://wetten.overheid.nl/BWBR0041759/2018-12-29#Artikel1
  - number: '2.1'
    text: |-
      Voordat een netbeheerder, interconnector-beheerder of benoemde elektriciteitsmarktbeheerder de op grond van artikel
      37, zesde lid, van richtlijn nr. 2009/72 of de bij of krachtens [verordening 714/2009](32009R0714) ontwikkelde
      voorwaarden of methoden hanteert, legt hij deze voorwaarden of methoden ter goedkeuring voor aan de Autoriteit
      Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0041759/2018-12-29#Artikel2
  - number: '2.2'
    text: |-
      De Autoriteit Consument en Markt beslist over de goedkeuring van de voorwaarden of
      methoden, bedoeld in het eerste lid, tenzij de Autoriteit Consument en Markt op grond van
      [artikel 5, zesde lid, van de Elektriciteitswet 1998][ref1] beslist over de goedkeuring of op grond van
      [artikel 36 van de Elektriciteitswet 1998][ref2] beslist over de vaststelling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel36
    url: https://wetten.overheid.nl/BWBR0041759/2018-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '36'
  - number: '2.3'
    text: |-
      Indien een voorstel voor voorwaarden of methoden, bedoeld in het eerste lid, naar het oordeel van de Autoriteit
      Consument en Markt in strijd is met het bepaalde bij of krachtens [verordening 714/2009](32009R0714), richtlijn
      nr. 2009/72 of de [Elektriciteitswet 1998][ref1], draagt de Autoriteit Consument en Markt de netbeheerder,
      interconnector-beheerder of benoemde elektriciteitsmarktbeheerder op het voorstel onverwijld zodanig te wijzigen
      dat deze strijd wordt opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0041759/2018-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
  - number: '3'
    text: |-
      De Autoriteit Consument en Markt stelt de voorwaarden of methoden, niet zijnde voorwaarden of methoden, bedoeld
      in [artikel 2][ref1], van een netbeheerder, interconnector-beheerder of benoemde elektriciteitsmarktbeheerder,
      ter uitvoering van het bepaalde bij of krachtens [verordening 714/2009](32009R0714) vast, tenzij de Autoriteit
      Consument en Markt op grond van [artikel 32, tweede lid, van de Elektriciteitswet 1998][ref2] de tariefstructuren
      en voorwaarden, bedoeld in [artikel 36 van de Elektriciteitswet 1998][ref3] wijzigt.


      [ref1]: https://wetten.overheid.nl/BWBR0041759#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel36
    url: https://wetten.overheid.nl/BWBR0041759/2018-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0041759
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '36'
  - number: '4.1'
    text: |-
      Voordat een netbeheerder of interconnector-beheerder de op grond van artikel 41, zesde lid, van richtlijn nr.
      2009/73 of de bij of krachtens [verordening 715/2009](32009R0715) ontwikkelde voorwaarden of methoden hanteert,
      legt hij deze voorwaarden of methoden ter goedkeuring voor aan de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0041759/2018-12-29#Artikel4
  - number: '4.2'
    text: |-
      De Autoriteit Consument en Markt beslist over de goedkeuring van de voorwaarden of methoden, bedoeld in het eerste
      lid, tenzij de Autoriteit Consument en Markt op grond van [artikel 1a, zesde lid, van de Gaswet][ref1] beslist over
      de goedkeuring of op grond van [artikel 12f van de Gaswet][ref2] beslist over de vaststelling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
    url: https://wetten.overheid.nl/BWBR0041759/2018-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12f
  - number: '4.3'
    text: |-
      Indien een voorstel voor voorwaarden of methoden, bedoeld in het eerste lid, naar het oordeel van de Autoriteit
      Consument en Markt in strijd is met het bepaalde bij of krachtens [verordening 715/2009](32009R0715), richtlijn nr.
      2009/73 of de [Gaswet][ref1], draagt de Autoriteit Consument en Markt de netbeheerder of interconnector-beheerder
      op het voorstel onverwijld zodanig te wijzigen dat deze strijd wordt opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0041759/2018-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011440
  - number: '5'
    text: |-
      De Autoriteit Consument en Markt stelt de voorwaarden of methoden, niet zijnde voorwaarden of methoden,
      bedoeld in [artikel 4][ref1], van een netbeheerder of een interconnector-beheerder, ter uitvoering van het
      bepaalde bij of krachtens [verordening 715/2009](32009R0715) vast, tenzij de Autoriteit Consument en Markt
      op grond van [artikel 12c, tweede lid, van de Gaswet][ref2] de tariefstructuren en voorwaarden, bedoeld in
      [artikel 12f van de Gaswet][ref3] wijzigt.


      [ref1]: https://wetten.overheid.nl/BWBR0041759#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12c
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
    url: https://wetten.overheid.nl/BWBR0041759/2018-12-29#Artikel5
    references:
