        bwb_id: BWBR0011440
        artikel: 12f
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0041759/2018-12-29#Artikel6
