preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 28 juni 2002, Z/VU-2296118,
    gedaan in overeenstemming met de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst;


    Gelet op de artikelen 5, derde en vierde lid, 6, eerste, derde en zesde lid, 7, tweede, derde en vierde lid,
    9a, eerste en tweede lid, 11, 16, eerste lid, 40a, derde lid, en 77 van de Algemene Wet Bijzondere Ziektekosten,
    artikel 1, eerste en tweede lid, van de Wet ziekenhuisvoorzieningen, artikel 50, eerste lid, van de Politiewet
    1993, de artikelen 1, tweede lid, en 17a van de Wet tarieven gezondheidszorg en artikel 8, tweede lid, van de
    Ziekenfondswet;


    De Raad van State gehoord (advies van 27 september 2002, no.W13.02.0280/III);


    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 21 oktober 2002, Z/VU-
    2326865,uitgebracht in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Algemene Wet Bijzondere Ziektekosten][ref1];

      b. leefeenheid: een eenheid bestaande uit gehuwde verzekerden die al dan niet tezamen met een of meer ongehuwde
      minderjarige verzekerden duurzaam een huishouden voeren dan wel uit een meerderjarige ongehuwde verzekerde die met
      een of meer ongehuwde minderjarige verzekerden duurzaam een huishouden voert;

      c. verblijf: verblijf gedurende het etmaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '2'
    text: |-
      1 De verzekerde heeft, behoudens voor zover het zorg betreft die kan worden bekostigd op grond van een andere
      wettelijke regeling, aanspraak op:

      a. huishoudelijke verzorging als omschreven in [artikel 3][ref1];

      b. persoonlijke verzorging als omschreven in [artikel 4][ref2];

      c. verpleging als omschreven in [artikel 5][ref3];

      d. ondersteunende begeleiding als omschreven in [artikel 6][ref4];

      e. activerende begeleiding als omschreven in [artikel 7][ref5];

      f. behandeling als omschreven in [artikel 8][ref6];

      g. verblijf als omschreven in [artikel 9][ref7];

      h. vervoer als omschreven in [artikel 10][ref8];

      i. het gebruik van een verpleegartikel als omschreven in [artikel 11][ref9];

      j. ziekenhuiszorg als omschreven in [artikel 13][ref10];

      k. revalidatiezorg als omschreven in [artikel 14][ref11];

      l. zorg als omschreven in [artikel 15][ref12];

      m. prenatale zorg als omschreven in [artikel 16][ref13];

      n. onderzoek naar aangeboren stofwisselingsziekten als omschreven in [artikel 17][ref14];

      o. vaccinaties als omschreven in [artikel 18][ref15].

      2 Op de zorg, omschreven bij dit besluit, bestaat geen aanspraak voor zover deze objectief voorzienbaar
      samenhangt met een onderzoek in een ziekenhuis dat of een behandeling in een ziekenhuis die niet behoort tot de in
      [artikel 13, eerste lid][ref16], omschreven zorg.

      3 De aanspraak op zorg bestaat slechts voor zover de verzekerde, gelet op zijn behoefte en uit een oogpunt van
      doelmatige zorgverlening, redelijkerwijs daarop is aangewezen.

      4 Bij ministeriële regeling kan de aanspraak op de zorg, bedoeld in het eerste lid, nader worden geregeld en
      afhankelijk worden gesteld van daarbij te stellen voorwaarden.


