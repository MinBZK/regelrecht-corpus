  - number: '16'
    text: >-
      Prenatale zorg omvat door een instelling te verlenen begeleiding, voorlichting en andere zorg die met de
      zwangerschap verband houdt, met uitzondering van kraamzorg.
    url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#Artikel16
  - number: '17'
    text: >-
      1 Onderzoek naar aangeboren stofwisselingsziekten omvat zodanig onderzoek voor daarvoor in aanmerking komende, bij
      ministeriële regeling aan te wijzen groepen van verzekerden.


      2 Het onderzoek geschiedt door een bij ministeriële regeling aangewezen entadministratie op een daarbij aan te
      geven wijze.
    url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#Artikel17
  - number: '18'
    text: >-
      1 Vaccinaties omvatten de vaccinaties, opgenomen in een bij ministeriële regeling vast te stellen
      vaccinatieprogramma, waarin wordt aangegeven welke groepen van verzekerden voor vaccinatie in aanmerking komen
      alsmede hoe de uitvoering van dat programma plaatsvindt.


      2 De uitvoering van de vaccinaties geschiedt door een bij ministeriële regeling aangewezen entadministratie.
    url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#Artikel18
  - number: '19'
    text: |-
      1 Ten aanzien van de verzekerde die als gezinslid van een militair met toestemming van Onze Minister van Defensie
      in het buitenland verblijft bij de aldaar geplaatste militair en voor wie de militair ingevolge de Regeling
      ziektekostenverzekering militairen aanspraak heeft op vergoeding van geneeskundige verstrekkingen, treedt die
      aanspraak, voor zover de geneeskundige verstrekkingen zijn verleend door de militair geneeskundige dienst van de
      Nederlandse krijgsmacht ter plaatse, in de plaats van de aanspraken op zorg ingevolge dit besluit.

      2 Onze Minister en Onze Minister van Defensie stellen regelen vast inzake een jaarlijkse uitkering door het College
      zorgverzekeringen aan Onze Minister van Defensie ten laste van het Algemeen Fonds Bijzondere Ziektekosten in
      verband met het vervallen van aanspraken op grond van [artikel 7, eerste en tweede lid, van de wet][ref1].

      3 Onze Minister en Onze Minister van Defensie kunnen nadere regelen vaststellen met betrekking tot de uitvoering
      van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel7
    url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '7'
  - number: '20'
    text: |-
      1 Aan een verzekerde wordt een uitkering gedaan ter zake van de kosten van zorg als omschreven in dit besluit,
      indien die zorg anders dan op de in [artikel 10 van de wet][ref1] omschreven wijze is verkregen als gevolg van de
      navolgende omstandigheden:

      a. tijdelijk verblijf hier te lande buiten het werkgebied van het uitvoeringsorgaan;

      b. wonen in het buitenland;

      c. tijdelijk verblijf in het buitenland wegens uitoefening van bedrijf of beroep of wegens andere door het College
      zorgverzekeringen aan te geven redenen;

      d. niet ingeschreven zijn bij een uitvoeringsorgaan;

      e. in spoedeisende gevallen waarin uitstel redelijkerwijs niet kon worden verlangd.

      2 In de omstandigheid, bedoeld in het eerste lid, onderdeel a, bestaat aanspraak op een uitkering, mits de zorg
      is verleend door instellingen of personen, die in de verblijfplaats van de verzekerde of naaste omgeving daarvan
      praktijk uitoefenen of gevestigd zijn en ter zake van die zorg een overeenkomst met een uitvoeringsorgaan hebben
      gesloten.

      3 In de omstandigheden, bedoeld in het eerste lid, onderdelen b en c, bestaat aanspraak op een uitkering tot een
      door het College zorgverzekeringen vast te stellen bedrag voor zorg, verleend in het land waar de verzekerde woont
      of verblijft, voor zover de verlening van de zorg redelijkerwijs niet kon worden uitgesteld tot na de terugkeer
      in Nederland.

      4 In de omstandigheden, bedoeld in het eerste lid, onderdelen d en e, bestaat aanspraak op een uitkering, mits de
      zorg is verleend in Nederland. Het College zorgverzekeringen kan nadere voorwaarden stellen voor het verkrijgen
      van de uitkering in de omstandigheid, bedoeld in het eerste lid, onderdeel d. Het College zorgverzekeringen kan
      bepalen dat premies, betaald ten behoeve van een overeenkomst met betrekking tot de verzekering van in dit besluit
      omschreven zorg of de kosten daarvan, in de omstandigheid, bedoeld in het eerste lid, onderdeel d, gelden als
      kosten van zodanige zorg.

      5 In de omstandigheden, bedoeld in het eerste lid, onderdelen a, d en e is de uitkering gelijk aan de kosten van
      de zorg indien deze is verleend door een persoon of instelling die ter zake van die zorg een overeenkomst met enig
      uitvoeringsorgaan heeft gesloten. Indien de zorg door een ander is verleend, is de uitkering gelijk aan de kosten
      van de zorg, voor zover deze de kosten van zodanige zorg, verleend door een persoon of instelling waarmee het
      uitvoeringsorgaan een overeenkomst heeft gesloten, niet te boven gaan.


