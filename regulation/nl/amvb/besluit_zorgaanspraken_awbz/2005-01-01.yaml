    text: |-
      Het [Besluit regeling vergoeding Bijzondere Ziektekostenverzekering][ref1] blijft van toepassing op de verzekerde
      die onmiddellijk voorafgaande aan het tijdstip waarop [artikel 32, derde lid][ref2], in werking trad, aanspraak had
      op een vergoeding als bedoeld in dat besluit.


