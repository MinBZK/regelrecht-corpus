        artikel: '10'
  - number: '33'
    text: |-
      1 De [artikelen 1 tot en met 20][ref1] en de [artikelen 1][ref2], [2][ref3], [6][ref4], [9][ref5] en
      [13 van het Zorgindicatiebesluit][ref6] zoals deze artikelen komen te luiden na inwerkingtreding van de
      [onderdelen A, B, E, G en K van artikel 31][ref7], zijn slechts van toepassing voor verzekerden voor wie
      op of na het tijdstip waarop die artikelen in werking treden, een indicatiebesluit als bedoeld in het
      [Zorgindicatiebesluit][ref8] aangevraagd wordt.

      2 Het [Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref9] en de daarop gebaseerde regelgeving alsmede
      de [artikelen 1][ref10], [2][ref11], [6][ref12], [9][ref13] en [13 van het Zorgindicatiebesluit][ref14] zoals deze
      luidden onmiddellijk voorafgaande aan de inwerkingtreding van de [onderdelen A, B, E, G en K van artikel 31][ref15]
      blijven, gedurende de geldigheidsduur van hun indicatiebesluit als bedoeld in het [Zorgindicatiebesluit][ref16]
      en voor de in hun indicatiebesluit geïndiceerde zorg, van toepassing op verzekerden die onmiddellijk voorafgaande
      aan het tijdstip waarop de [artikelen 1 tot en met 20][ref17] en [artikel 31, onderdelen A, B, E, G en K][ref18],
      in werking treden, geïndiceerd waren voor een of meer vormen van zorg als bedoeld in het
      [Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref19].

      3 De [artikelen 20 tot en met 20g van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref20] en
      de daarop gebaseerde regelgeving blijven, zolang zij hun recht hierop tot gelding kunnen brengen, van toepassing
      op verzekerden die onmiddellijk voorafgaande aan het tijdstip waarop de [artikelen 1 tot en met 20][ref21]
      en [artikel 31, onderdelen A, B, E, G en K][ref22], in werking treden, een recht op zorg als bedoeld in de
      [artikelen 20 tot en met 20g van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref23] tot gelding
      konden brengen.


