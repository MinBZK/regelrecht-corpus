  - number: '10'
    text: |-
      Indien de verzekerde zorg als bedoeld in de [artikelen 6][ref1] en [7][ref2] gedurende een dagdeel in een
      instelling ontvangt, omvat de zorg tevens vervoer naar en van de instelling indien daarvoor een medische noodzaak
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel7
