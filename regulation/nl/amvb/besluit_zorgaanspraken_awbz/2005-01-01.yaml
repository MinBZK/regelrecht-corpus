  - number: '3'
    text: >-
      Huishoudelijke verzorging omvat het ondersteunen bij of het overnemen van activiteiten op het gebied van het
      verzorgen van het huishouden in verband met een somatische, psychogeriatrische of psychiatrische aandoening of
      beperking, een verstandelijke, lichamelijke of zintuiglijke handicap of een psychosociaal probleem die of dat leidt
      of dreigt te leiden tot het disfunctioneren van de verzorging van het huishouden van de verzekerde dan wel van de
      leefeenheid waartoe de verzekerde behoort, te verlenen door een instelling.
    url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#Artikel3
  - number: '4'
    text: >-
      Persoonlijke verzorging omvat het ondersteunen bij of het overnemen van activiteiten op het gebied van de
      persoonlijke verzorging in verband met een somatische, psychogeriatrische of psychiatrische aandoening of
      beperking, een verstandelijke, lichamelijke of zintuiglijke handicap of een psychosociaal probleem, gericht op het
      opheffen van een tekort aan zelfredzaamheid, te verlenen door een instelling.
    url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#Artikel4
  - number: '5'
    text: >-
      Verpleging omvat verpleging in verband met een somatische, psychogeriatrische of psychiatrische aandoening of
      beperking of een lichamelijke handicap, gericht op herstel of voorkoming van verergering van de aandoening,
      beperking of handicap, te verlenen door een instelling.
    url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#Artikel5
  - number: '6'
    text: >-
      Ondersteunende begeleiding omvat ondersteunende activiteiten in verband met een somatische, psychogeriatrische
      of psychiatrische aandoening of beperking, een verstandelijke, lichamelijke of zintuiglijke handicap of een
      psychosociaal probleem, gericht op bevordering of behoud van zelfredzaamheid of bevordering van de integratie van
      de verzekerde in de samenleving, te verlenen door een instelling.
    url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#Artikel6
  - number: '7'
    text: >-
      Activerende begeleiding omvat door een instelling te verlenen activerende activiteiten gericht op:


      a. herstel of voorkomen van verergering van gedrags- of psychische problematiek; of


      b. het omgaan met de gevolgen van een somatische of psychogeriatrische aandoening of beperking of een
      verstandelijke, lichamelijke of zintuiglijke handicap.
    url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#Artikel7
  - number: '8'
    text: >-
      1 Behandeling omvat behandeling van medisch-specialistische, gedragswetenschappelijke of specialistisch-
      paramedische aard gericht op herstel of voorkoming van verergering van een somatische, psychogeriatrische of
      psychiatrische aandoening, een verstandelijke, lichamelijke of zintuiglijke handicap, te verlenen door een
      instelling, door een psychiater of zenuwarts of door een psychotherapeut.


      2 Bij psychotherapeutische behandeling die niet gepaard gaat met verblijf in een instelling, bestaat aanspraak op
      ten hoogste vijfentwintig zittingen dan wel, indien sprake is van persoonlijkheidsstoornissen, vijftig zittingen.


      3 In afwijking van het tweede lid heeft de verzekerde tot achttien jaar aanspraak op ten hoogste vijftig zittingen.


      4 In afwijking van het tweede lid en derde lid geldt voor psychotherapeutische behandeling geen beperking van het
      aantal zittingen, indien sprake is van een psychoanalytische behandeling te verlenen door een instelling.


      5 Een zitting als bedoeld in het tweede lid duurt vijfenveertig minuten bij individuele psychotherapie, negentig
      minuten bij partnerrelatie-psychotherapie en honderdtwintig minuten bij gezins- en groepspsychotherapie.


      6 Op de behandeling, bedoeld in het tweede lid, bestaat geen aanspraak indien na beëindiging van een voorafgaande
      psychotherapeutische behandeling in verband met het bereiken van de vijfentwintig respectievelijk vijftig
      zittingen, nog geen jaar is verstreken.
    url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#Artikel8
  - number: '9'
    text: |-
      1 Verblijf omvat het verblijven in een instelling indien de zorg, bedoeld in de [artikelen 4][ref1], [5][ref2],
      [6][ref3], [7][ref4] of [8][ref5], noodzakelijkerwijs gepaard gaat met een beschermende woonomgeving,
      therapeutisch leefklimaat dan wel permanent toezicht.

      2 De echtgenoot van een persoon met een somatische of psychogeriatrische aandoening of beperking die op grond van
      een indicatiebesluit als bedoeld in het [Zorgindicatiebesluit][ref6] in een instelling verblijft, heeft aanspraak
      op verblijf in dezelfde instelling. Hij behoudt aanspraak op verblijf in die instelling na het overlijden van zijn
      echtgenoot dan wel na het vertrek van zijn echtgenoot naar een andere instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel4
