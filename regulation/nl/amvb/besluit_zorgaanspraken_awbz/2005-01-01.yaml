  - number: '11'
    text: >-
      Het gebruik van een verpleegartikel omvat het door een instelling in bruikleen verstrekken van een verpleegartikel
      gedurende een termijn van ten hoogste zesentwintig weken in verband met een somatische aandoening of beperking.
    url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#Artikel11
  - number: '13'
    text: >-
      1 Ziekenhuiszorg omvat het verblijf in een instelling die als ziekenhuis is toegelaten, voor zover dit verblijf
      een ononderbroken periode van 365 dagen in een of meer ziekenhuizen te boven gaat, gepaard gaande met verpleging,
      onderzoek en behandeling van genees-, heel- en verloskundige aard door specialisten, waaronder bij ministeriële
      regeling aangewezen transplantatie van weefsels en organen.


      2 Voor de berekening van de 365 dagen geldt een onderbreking niet langer dan dertig dagen niet als onderbreking,
      doch deze dagen tellen voor de berekening van de 365 dagen evenmin mee. Indien de periode van 365 dagen is
      verstreken en binnen dertig dagen opnieuw verblijf nodig is, is er evenmin sprake van een onderbreking.


      3 Een verzekerde die met toepassing van dit besluit verblijft in een instelling, niet zijnde een ziekenhuis, en
      vanuit die instelling wordt overgeplaatst naar een ziekenhuis heeft, zolang zijn verblijf in dat ziekenhuis een
      periode van 365 dagen niet overschrijdt, geen aanspraak op verblijf in dat ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#Artikel13
  - number: '14'
    text: |-
      1 Revalidatiezorg omvat verblijf in een instelling voor revalidatie zover dit verblijf een ononderbroken periode
      van 365 dagen in een of meer instellingen voor revalidatie te boven gaat, gepaard gaande met verpleging, onderzoek,
      behandeling en advisering van specialistische, paramedische, gedragswetenschappelijke en revalidatietechnische
      aard.

      2 Op revalidatiezorg bestaat slechts aanspraak:

      a. indien deze zorg is aangewezen ter voorkoming, vermindering of overwinning van een handicap die het gevolg is
      van stoornissen of beperkingen in het bewegingsvermogen;

      b. indien de verzekerde met deze zorg in staat is de mate van zelfstandigheid te bereiken of te behouden die,
      gegeven zijn beperkingen, redelijkerwijs mogelijk is; en

      c. indien met deze zorg spoedig betere resultaten te verwachten zijn dan revalidatie zonder verblijf in een
      instelling voor revalidatie.

      3 Het [tweede en het derde lid van artikel 13][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel13
    url: https://wetten.overheid.nl/BWBR0014149/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '13'
        hoofdstuk: II
  - number: '15'
    text: |-
      1 Voor zover gepaard gaande met verblijf in dezelfde instelling, omvat de zorg, bedoeld in de artikelen [8][ref1],
      [13][ref2] en [14][ref3], tevens:

      a. geneeskundige zorg van algemeen medische aard, niet zijnde paramedische zorg;

      b. farmaceutische zorg;

      c. hulpmiddelen, noodzakelijk in verband met de in de instelling gegeven zorg;

      d. tandheelkundige zorg;

      e. kleding, verband houdende met het karakter en de doelstelling van de instelling;

      f. het individueel gebruik van een rolstoel.

      2 De zorg, bedoeld in het eerste lid, aanhef, omvat niet het verkrijgen van onderwijs, kleedgeld en zakgeld.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel13
