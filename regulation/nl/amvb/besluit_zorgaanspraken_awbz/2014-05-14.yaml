        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '1'
  - number: '21'
    text: |-
      1 De verplichting als bedoeld in [artikel 16b, eerste lid, van de wet][ref1], geldt niet voor zover de instelling
      zorg verleent als bedoeld in de [artikelen 4 tot en met 18][ref2].

      2 Voor de instellingen, bedoeld in het eerste lid, geldt niet de verplichting, bedoeld in
      [artikel 16c, eerste lid, van de wet][ref3].


