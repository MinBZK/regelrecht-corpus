  - number: '12'
    text: Doventolkzorg omvat zorg door een doventolk bij het voeren van een gesprek in de leefsituatie.
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel12
  - number: '13'
    text: |-
      1 Voortgezet verblijf omvat verblijf in een instelling gepaard gaande met medisch noodzakelijke geneeskundige
      zorg in aansluiting op verblijf als bedoeld in het [Besluit zorgverzekering][ref1] voor zover dit verblijf een
      ononderbroken periode van 365 dagen te boven gaat, al dan niet gepaard gaande met verpleging, verzorging of
      paramedische zorg.

      2 In afwijking van het eerste lid, bestaat het voortgezet verblijf, indien er sprake is van behandeling van een
      psychiatrische aandoening, uit zorg als omschreven in [artikel 9, eerste en tweede lid][ref2].

      3 Voor de berekening van de 365 dagen geldt een onderbreking niet langer dan dertig dagen niet als onderbreking,
      doch deze dagen tellen voor de berekening van de 365 dagen evenmin mee. Indien de periode van 365 dagen is
      verstreken en binnen dertig dagen opnieuw verblijf nodig is, is er evenmin sprake van een onderbreking.


      [ref1]: https://wetten.overheid.nl/BWBR0018492
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel9
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018492
      - id: ref2
        bwb_id: BWBR0014149
        artikel: '9'
        hoofdstuk: II
  - number: '14'
    text: |-
      Op verzoek van de verzekerde die in het bezit is van een indicatiebesluit voor verblijf als bedoeld in
      [artikel 9, eerste lid][ref1], kan de instelling in afwijking van die bepalingen het verblijf en overige zorg ten
      huize van de verzekerde leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel9
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '9'
        hoofdstuk: II
  - number: '15'
    text: |-
      1 Voor zover gepaard gaande met verblijf in dezelfde instelling, omvat de zorg, bedoeld in de [artikelen 8][ref1]
      en [13][ref2], tevens:

      a. geneeskundige zorg van algemeen medische aard, niet zijnde paramedische zorg;

      b. behandeling van een psychiatrische aandoening indien de behandeling integraal onderdeel uitmaakt van de
      behandeling van een van de in [artikel 8][ref3] genoemde aandoeningen of handicaps;

      c. farmaceutische zorg;

      d. hulpmiddelen, noodzakelijk in verband met de in de instelling gegeven zorg;

      e. tandheelkundige zorg;

      f. kleding, verband houdende met het karakter en de doelstelling van de instelling;

      g. het individueel gebruik van een rolstoel.

      2 De zorg, bedoeld in het eerste lid, aanhef, omvat niet het verkrijgen van onderwijs, kleedgeld en zakgeld.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0014149#Artikel8
