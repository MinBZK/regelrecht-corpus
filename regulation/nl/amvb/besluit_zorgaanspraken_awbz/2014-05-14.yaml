preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 28 juni 2002, Z/VU-2296118,
    gedaan in overeenstemming met de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst;

    Gelet op de artikelen 5, derde en vierde lid, 6, eerste, derde en zesde lid, 7, tweede, derde en vierde lid,
    9a, eerste en tweede lid, 11, 16, eerste lid, 40a, derde lid, en 77 van de Algemene Wet Bijzondere Ziektekosten,
    artikel 1, eerste en tweede lid, van de Wet ziekenhuisvoorzieningen, artikel 50, eerste lid, van de Politiewet
    1993, de artikelen 1, tweede lid, en 17a van de Wet tarieven gezondheidszorg en artikel 8, tweede lid, van de
    Ziekenfondswet;

    De Raad van State gehoord (advies van 27 september 2002, no.W13.02.0280/III);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 21 oktober 2002, Z/VU-
    2326865,uitgebracht in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Algemene Wet Bijzondere Ziektekosten][ref1];

      b. gebruikelijke zorg: de normale, dagelijkse zorg die partners, ouders, inwonende kinderen of andere huisgenoten
      geacht worden elkaar onderling te bieden;

      c. mantelzorg: langdurige zorg die niet in het kader van een hulpverlenend beroep wordt geboden aan een
      hulpbehoevende door personen uit diens directe omgeving, waarbij de zorgverlening rechtstreeks voortvloeit uit de
      sociale relatie en de gebruikelijke zorg overstijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '2'
    text: |-
      1 De verzekerde heeft, behoudens voor zover het zorg betreft die kan worden bekostigd op grond van een andere
      wettelijke regeling of een zorgverzekering als bedoeld in de [Zorgverzekeringswet][ref1], aanspraak op:

      a. persoonlijke verzorging als omschreven in [artikel 4][ref2];

      b. verpleging als omschreven in [artikel 5][ref3];

      c. begeleiding als omschreven in [artikel 6][ref4];

      d. behandeling als omschreven in [artikel 8][ref5];

      e. verblijf als omschreven in [artikel 9][ref6];

      f. kortdurend verblijf als omschreven in [artikel 9a][ref7];

      g. vervoer als omschreven in [artikel 10][ref8];

      h. doventolkzorg als omschreven in [artikel 12][ref9];

      i. voortgezet verblijf als omschreven in [artikel 13][ref10];

      j. zorg als omschreven in [artikel 15][ref11];

      k. een neonatale hielprik;

      l. vaccinaties als omschreven in [artikel 18][ref12].

      2 De verzekerde heeft geen aanspraak op de zorg, bedoeld in het eerste lid, indien hij ter zake
      van die zorg een aanspraak heeft op forensische zorg als bedoeld in [artikel 2][ref13] juncto
      [artikel 5, eerste lid, van het Interimbesluit forensische zorg][ref14].

      3 De aanspraak op zorg bestaat slechts voor zover de verzekerde, gelet op zijn behoefte en uit een oogpunt van
      doelmatige zorgverlening, redelijkerwijs daarop is aangewezen.

      4 Bij ministeriële regeling kan de aanspraak op de zorg, bedoeld in het eerste lid, nader worden geregeld en
      afhankelijk worden gesteld van daarbij te stellen voorwaarden.


