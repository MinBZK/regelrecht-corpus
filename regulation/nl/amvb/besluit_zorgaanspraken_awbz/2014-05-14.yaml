        bwb_id: BWBR0002777
      - id: ref2
        bwb_id: BWBR0014149
        artikel: '32'
        hoofdstuk: IV
  - number: '39'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel39
  - number: 39a
    text: |-
      Dit besluit berust mede op [artikel 47, eerste lid, van de Politiewet 2012][ref1].


