  - number: 20a
    text: |-
      De verzekerde heeft gedurende het reizen of het tijdelijk verblijven buiten het Europese deel van Nederland
      geen aanspraak op zorg als bedoeld in de [artikelen 4 tot en met 8][ref1], of op een vergoeding van
      de kosten daarvan, indien de zorg aan de verzekerde wordt verleend door een instelling als bedoeld in
      [artikel 1, eerste deel, onderdeel e, 1° van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel1
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel20a
    references:
