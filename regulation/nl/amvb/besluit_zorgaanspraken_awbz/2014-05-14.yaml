        artikel: '7'
  - number: '20'
    text: |-
      1 Aan een verzekerde wordt een vergoeding verstrekt voor kosten van zorg als omschreven in dit besluit, indien die
      zorg hier te lande is verleend en anders dan op de in [artikel 10, eerste lid, van de wet][ref1] omschreven wijze
      is verkregen als gevolg van de navolgende omstandigheden:

      a. in spoedeisende gevallen waarin uitstel redelijkerwijs niet kon worden verlangd;

      b. tijdelijk verblijf hier te lande buiten het werkgebied van de zorgverzekeraar.

      2 Aan een verzekerde wordt een vergoeding verstrekt voor kosten van zorg als omschreven in dit
      besluit, indien die zorg buiten het Europese deel van Nederland wordt verleend en anders dan op de in
      [artikel 10, eerste of tweede lid, van de wet][ref2] omschreven wijze is verkregen als gevolg van de navolgende
      omstandigheden:

      a. voortzetting van reeds binnen het Europese deel van Nederland aangevangen zorg:

      een verzekerde aan wie zorg wordt verleend waarop deze aanspraak heeft op grond van [hoofdstuk II][ref3] van dit
      Besluit, behoudt deze aanspraak gedurende ten hoogste dertien weken per kalenderjaar buiten het Europese deel
      van Nederland. In dat geval worden de in rekening gebrachte kosten vergoed tot ten hoogste de kosten die in de
      Nederlandse marktomstandigheden in redelijkheid passend zijn te achten;

      b. voortzetten palliatief terminale zorg:

      in afwijking van het bepaalde in onderdeel a geldt een periode van ten hoogste één jaar wanneer het palliatief
      terminale zorg betreft;

      c. onvoldoende binnenlands zorgaanbod:

      een verzekerde kan met voorafgaande toestemming van de zorgverzekeraar gedurende een periode van ten hoogste één
      jaar zorg buiten het Europese deel van Nederland inroepen, indien, gezien de gezondheidstoestand van betrokkene en
      het te verwachten verloop daarvan, de noodzakelijke zorg binnen het Europese deel van Nederland niet of niet tijdig
      genoeg kan worden verkregen. In dat geval worden de in rekening gebrachte kosten vergoed. Voor zover deze kosten
      die welke in de Nederlandse marktomstandigheden passend zijn te achten overschrijden, wordt het meerdere vergoed
      voor zover deze naar het oordeel van de zorgverzekeraar in redelijkheid in rekening zijn gebracht;

      d. verblijf buiten het Europese deel van Nederland wegens uitoefening van bedrijf of beroep of uitsluitend wegens
      studieredenen:

      een verzekerde die in verband met de uitoefening van bedrijf of beroep al dan niet in dienstbetrekking of
      uitsluitend wegens studieredenen buiten het Europese deel van Nederland verblijft kan zolang deze omstandigheid
      voortduurt en de betrokkene ingevolge de wet verzekerd blijft, buiten het Europese deel van Nederland zorg
      inroepen. In dat geval worden de in rekening gebrachte kosten vergoed, tot ten hoogste de kosten die in de
      Nederlandse marktomstandigheden in redelijkheid passend zijn te achten;

      e. gezinsleden:

      onderdeel d is van overeenkomstige toepassing op een verzekerde die met de verzekerde, bedoeld in dat onderdeel,
      deel uitmaakt van een gezamenlijke huishouding als bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref4];

      f. spoedeisende zorg bij tijdelijk verblijf:

      een verzekerde die gedurende een tijdelijk verblijf buiten het Europese deel van Nederland onvoorzien en
      onmiddellijk noodzakelijke zorg moet inroepen die gelet op de gezondheidstoestand van betrokkene en het te
      verwachten verloop daarvan, niet kan worden uitgesteld tot de verzekerde is teruggekeerd in het Europese deel
      van Nederland, kan deze gedurende ten hoogste dertien weken voortzetten. Deze termijn kan door de zorgverzekeraar
      worden verlengd indien de verzekerde om medische redenen niet gerepatrieerd kan worden.

      De in rekening gebrachte kosten worden vergoed tot ten hoogste de kosten die in de Nederlandse marktomstandigheden
      in redelijkheid passend zijn te achten.

      3 Het in het vorige lid in de onderdelen d, e en f bepaalde, is slechts van toepassing indien door een
      onafhankelijk arts is vastgesteld dat en in welke omvang de verzekerde op de desbetreffende zorg is aangewezen.

      4 Indien de verzekerde op grond van het [Bijdragebesluit zorg][ref5] voor de verleende zorg een bijdrage in de
      kosten is verschuldigd, wordt deze bijdrage in mindering gebracht op de in het eerste en tweede lid bedoelde
      vergoeding.

      5 Aan een verzekerde die zorg inroept op de in [artikel 10, tweede lid, van de wet][ref6] omschreven wijze, worden
      de in rekening gebrachte kosten vergoed tot ten hoogste de kosten die in de Nederlandse marktomstandigheden in
      redelijkheid passend zijn te achten. Het derde en het vierde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel10
