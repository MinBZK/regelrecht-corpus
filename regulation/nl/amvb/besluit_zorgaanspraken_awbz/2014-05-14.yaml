  - number: '34'
    text: |-
      1 In dit artikel wordt verstaan onder:

        - *ADL:* algemene dagelijkse levensverrichtingen;
        - *ADL-woning:* woning die deel uitmaakt van een aantal bij elkaar horende rolstoeldoorgankelijke sociale
      huurwoningen die tot stand zijn gekomen met behulp van subsidie uit de Regeling Geldelijke Steun Huisvesting
      Gehandicapten of het Algemeen Fonds Bijzondere Ziektekosten;
        - *ADL-assistentie:* gedurende het gehele etmaal direct oproepbare persoonlijke assistentie bij algemene dagelijkse
      levensverrichtingen in en om de ADL-woning.

      2 Een verzekerde die in een ADL-woning woont, en voldoet aan de voorwaarden, bedoeld in
      [artikel 2.9.3, eerste lid, onderdelen a tot en met d, van de Regeling subsidies AWBZ][ref1], zoals dat artikel
      luidde voor 1 januari 2012, heeft aanspraak op ADL-assistentie.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2.9.3
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: 2.9.3
  - number: '35'
    text: |-
      Het [Besluit regeling vergoeding Bijzondere Ziektekostenverzekering][ref1] blijft van toepassing op de verzekerde
      die onmiddellijk voorafgaande aan het tijdstip waarop [artikel 32, derde lid][ref2], in werking trad, aanspraak had
      op een vergoeding als bedoeld in dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002777
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel32
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel35
    references:
