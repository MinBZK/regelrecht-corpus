  - number: '3'
    text: |-
      De inhoud en de omvang van de zorg, bedoeld in [artikel 2][ref1], wordt mede bepaald door de stand van de
      wetenschap en praktijk en, bij het ontbreken van een zodanige maatstaf, door hetgeen in het betrokken vakgebied
      geldt als verantwoorde en adequate zorg en diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel2
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '2'
        hoofdstuk: II
  - number: '4'
    text: |-
      Persoonlijke verzorging omvat het ondersteunen bij of het overnemen van activiteiten op het gebied van de
      persoonlijke verzorging in verband met een somatische, psychogeriatrische of psychiatrische aandoening of
      beperking, of een verstandelijke, lichamelijke of zintuiglijke handicap, gericht op het opheffen van een tekort
      aan zelfredzaamheid.
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel4
  - number: '5'
    text: |-
      Verpleging omvat verpleging in verband met een somatische of psychogeriatrische aandoening of beperking of een
      lichamelijke handicap, gericht op herstel of voorkoming van verergering van de aandoening, beperking of handicap.
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel5
  - number: '6'
    text: |-
      1 Begeleiding omvat activiteiten aan verzekerden met een somatische, psychogeriatrische of psychiatrische
      aandoening of beperking, of een verstandelijke, lichamelijke of zintuiglijke handicap die matige of zware
      beperkingen hebben op het terrein van:

      a. de sociale redzaamheid,

      b. het bewegen en verplaatsen,

      c. het psychisch functioneren,

      d. het geheugen en de oriëntatie, of

      e. die matig of zwaar probleemgedrag vertonen.

      2 De activiteiten, bedoeld in het eerste lid, zijn gericht op bevordering, behoud of compensatie van de
      zelfredzaamheid en strekken tot voorkoming van opname in een instelling of verwaarlozing van de verzekerde.

      3 De activiteiten, bedoeld in het eerste lid, bestaan uit:

      a. het ondersteunen bij of het oefenen met vaardigheden of handelingen,

      b. het ondersteunen bij of het oefenen met het aanbrengen van structuur of het voeren van regie, of

      c. het overnemen van toezicht op de verzekerde.
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel6
  - number: '8'
    text: |-
      Behandeling omvat door een instelling te verlenen behandeling van specifiek medische, specifiek
      gedragswetenschappelijke of specifiek paramedische aard gericht op herstel of voorkoming van verergering van een
      somatische of psychogeriatrische aandoening of beperking of van een verstandelijke, lichamelijke of zintuiglijke
      handicap, waaronder voorkoming van verergering van gedragsproblemen in verband met een zodanige aandoening,
      beperking of handicap.
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel8
  - number: '9'
    text: |-
      1 Verblijf omvat verblijf in een instelling met samenhangende zorg bestaande uit persoonlijke verzorging,
      verpleging, begeleiding of behandeling, voor een verzekerde met een somatische, psychogeriatrische of
      psychiatrische aandoening of beperking of een verstandelijke, lichamelijke of zintuiglijke handicap, indien die
      verzekerde aangewezen is op een beschermende woonomgeving, een therapeutisch leefklimaat of permanent toezicht.

      2 Op verblijf bestaat slechts aanspraak indien de verzekerde meer dan drie etmalen per week daarop is aangewezen.

      3 De echtgenoot van een persoon met een somatische of psychogeriatrische aandoening of beperking die op grond van
      een indicatiebesluit als bedoeld in het [Zorgindicatiebesluit][ref1] in een instelling verblijft, heeft aanspraak
      op verblijf in dezelfde instelling. Hij behoudt aanspraak op verblijf in die instelling na het overlijden van zijn
      echtgenoot dan wel na het vertrek van zijn echtgenoot naar een andere instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0008946
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008946
  - number: 9a
    text: |-
      1 Kortdurend verblijf omvat logeren in een instelling gedurende maximaal drie etmalen per week, gepaard gaande met
      persoonlijke verzorging, verpleging of begeleiding voor een verzekerde met een somatische, psychogeriatrische of
      psychiatrische aandoening of beperking, of een verstandelijke, lichamelijke of zintuiglijke handicap, indien de
      verzekerde aangewezen is op permanent toezicht.

      2 Op de zorg, bedoeld in het eerste lid, bestaat slechts aanspraak indien ontlasting van de persoon die
      gebruikelijke zorg of mantelzorg aan de verzekerde levert, noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0014149/2014-05-14#Artikel9a
  - number: '10'
    text: |-
      Indien de verzekerde zorg als bedoeld in [artikel 6][ref1] of [8][ref2] gedurende een dagdeel in een instelling
      ontvangt, omvat de zorg tevens vervoer naar en van de instelling indien daarvoor een medische noodzaak bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel8
