preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Ministers van Wederopbouw en Volkshuisvesting en van Economische Zaken van 8 December
    1953, No. 1201624, afdeling Juridische Zaken;

    Gelet op artikel 4 van de Huurwet (wet van 13 October 1950, Stb. K 452, gewijzigd bij de wet van 24 December 1953,
    Stb. 580;

    De Raad van State gehoord (advies van 15 December 1953, No. 39);

    Gezien het nader rapport van Onze voornoemde Ministers van 22 December 1953, No. 1218962, afdeling Juridische
    Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder Onze Minister:

      Onze Minister met de zorg voor de zaken van de volkshuisvesting belast.
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel1
  - number: '4'
    text: |-
      In afwijking van het bepaalde in [artikel 3 van de Huurwet][ref1] is de huurprijs van een op of na 5 Mei 1945 tot
      stand gekomen gebouwde onroerende zaak, indien en zolang terzake van de bouw of exploitatie niet van overheidswege
      in enigerlei vorm financiële middelen zijn onderscheidenlijk subsidie is verstrekt: de huurprijs, welke partijen
      zijn overeengekomen of zullen overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002066#Artikel3
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002066
        artikel: '3'
  - number: '5'
    text: |-
      1 In afwijking van het bepaalde in [artikel 3 van de Huurwet][ref1] is de huurprijs van een op of na 1 juli 1989
      tot stand gekomen gebouwde onroerende zaak, indien en zodra ter zake van de bouw of exploitatie van overheidswege
      in enigerlei vorm financiële middelen zijn onderscheidenlijk subsidie is verstrekt: de door Onze Minister vast te
      stellen of nader vast te stellen huurprijs.

      2 Onze Minister kan de huurprijs van een gebouwde onroerende zaak, die tot stand is gekomen op of na 5 mei 1945
      doch vóór 1 juli 1989 indien en zodra ter zake van de bouw of exploitatie van overheidswege in enigerlei vorm
      financiële middelen zijn onderscheidenlijk subsidie is verstrekt, bij beschikking vaststellen of nader vaststellen.

      3 In afwijking van hetgeen in de voorgaande leden en in [artikel 3 van de Huurwet][ref2] is bepaald, is de
      huurprijs van door Onze Minister in de *Nederlandse Staatscourant* aangewezen of aan te wijzen categorieën van
      gebouwde onroerende zaken als in die leden bedoeld: de huurprijs welke partijen zijn overeengekomen of zullen
      overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002066#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002066#Artikel3
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002066
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002066
        artikel: '3'
  - number: 5a
    text: |-
      [Artikel 5, eerste en tweede lid][ref1], wordt ieder jaar met ingang van 1 juli in die zin gewijzigd dat daarin
      de aanduiding van het laatst verstreken kalenderjaar wordt vervangen door het jaartal in arabische cijfers van het
      jaar waarin de wijziging plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002127#Artikel5
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002127
        artikel: '5'
  - number: '6'
    text: |-
      In afwijking van het bepaalde in [artikel 3 van de Huurwet][ref1] is de huurprijs van een woonschip: de huurprijs,
      welke partijen zijn overeengekomen of zullen overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002066#Artikel3
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002066
        artikel: '3'
  - number: '7'
    text: |-
      In afwijking van het bepaalde in [artikel 3 van de Huurwet][ref1] is de huurprijs van een gebouwde onroerende zaak
      die een zelfstandige woning vormt en die voor een korte termijn wordt verhuurd met de klaarblijkelijke bedoeling
      dat de huurder daarin niet zijn hoofdverblijf houdt: de huurprijs, welke partijen zijn overeengekomen of zullen
      overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002066#Artikel3
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002066
        artikel: '3'
  - number: '8'
    text: |-
      In afwijking van het bepaalde in [artikel 3 van de Huurwet][ref1] is de huurprijs van een gebouwde onroerende
      zaak die niet een zelfstandige woning vormt en die, hetzij voor één korte termijn, hetzij voor twee of meer
      niet aaneensluitende korte termijnen wordt verhuurd: de huurprijs, welke partijen zijn overeengekomen of zullen
      overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002066#Artikel3
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002066
        artikel: '3'
  - number: '9'
    text: |-
      1 Indien op of na 1 Januari 1954 een vernieuwing van de centrale voorzieningen van een gebouwde onroerende zaak
      tot stand is gekomen kan de huurprijs worden verhoogd met een door Onze Minister vast te stellen percentage van een
      door Onze Minister vast te stellen gedeelte der kosten van deze vernieuwingen, voor zover deze kosten het redelijke
      en gebruikelijke niet overschrijden.

      2 Indien de in het eerste lid bedoelde kosten niet geheel ten laste van de verhuurder komen, wordt het daarin
      bedoelde percentage berekend over het door Onze Minister vast te stellen gedeelte der kosten, nadat van dat
      gedeelte de niet voor rekening van de verhuurder komende kosten zijn afgetrokken.

      3 Onder de centrale voorzieningen, genoemd in het eerste lid, worden verstaan centrale verwarmingsinstallaties,
      warmwaterinstallaties, liftinstallaties, koelinstallaties en andere door Onze Minister, hetzij in het algemeen
      hetzij in een bijzonder geval, nader aan te wijzen installaties.
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel9
  - number: '10'
    text: |-
      1 Indien op of na 1 mei 1968 in of aan een gebouwde onroerende zaak verbeteringen zijn tot stand gekomen is de
      huurprijs de ingevolge [artikel 3 van de Huurwet][ref1] geldende huurprijs vermeerderd met een door de huurder en
      verhuurder vóórdat de verbeteringen tot stand zijn gekomen overeen te komen bedrag. Zijn de verbeteringen tot stand
      gekomen op een tijdstip, waarop de zaak niet is verhuurd, dan is de huurprijs van de verbeterde gebouwde onroerende
      zaak: de huurprijs welke partijen zijn overeengekomen of zullen overeenkomen, voorzover deze huurprijs de ingevolge
      [artikel 3 van de Huurwet][ref2] geldende huurprijs vermeerderd met een bedrag, dat in redelijke verhouding staat
      tot de door de verhuurder bestede kosten van verbetering, niet overschrijdt.

      2 Onder verbeteringen, bedoeld in het eerste lid, worden verstaan alle technische voorzieningen, waardoor het
      woongerief - bij woningen - of de gebruikswaarde - bij bedrijfsruimten - geacht kan worden te zijn gestegen.

      3 Het bepaalde in de voorgaande leden vindt geen toepassing indien de kosten zijn gemaakt in verband met verbouwing
      of splitsing van een gebouwde onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0002066#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002066#Artikel3
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002066
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002066
        artikel: '3'
  - number: '11'
    text: |-
      De krachtens het bepaalde in de [artikelen 9][ref1] en [10][ref2] verhoogde huurprijs kan worden gevorderd van
      de eerste dag af volgende op het einde van de betalingstermijn, waarin de vernieuwingen of verbeteringen zijn tot
      stand gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002127#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002127#Artikel10
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002127
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002127
        artikel: '10'
  - number: '12'
    text: |-
      Indien een gebouwde onroerende zaak op of na 1 januari 1954 wordt verbouwd geldt als huurprijs van de door
      verbouwing ontstane gebouwde onroerende zaak die van een vergelijkbare onroerende zaak. Deze huurprijs kan
      gedurende een termijn van dertien jaren worden verhoogd met 10% 's jaars van een door Onze Minister vast te stellen
      gedeelte der verbouwingskosten, voor zover deze kosten het redelijke en gebruikelijke niet overschrijden. Het
      bepaalde in [artikel 9, tweede lid][ref1], vindt overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002127#Artikel9
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002127
        artikel: '9'
  - number: '13'
    text: |-
      Indien op of na 1 Januari 1954 een gebouwde onroerende zaak met een gewijzigde bestemming wordt verhuurd en
      tengevolge van deze wijziging van bestemming de brandgevaarlijkheid van die gebouwde onroerende zaak is toegenomen,
      kan de huurprijs worden verhoogd met de stijging der brandassurantiekosten van die gebouwde onroerende zaak en
      van de belendende gebouwde onroerende zaken, voor zover deze stijging aan de verhuurder in rekening wordt gebracht
      en voor zover zij niet wordt veroorzaakt door een verhoging van de verzekerde sommen op of na de datum van de
      inwerkingtreding van de [Huurwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002066
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002066
  - number: '14'
    text: |-
      Indien op of na 1 Januari 1954 een gebouwde onroerende zaak wordt gesplitst in twee of meer gebouwde onroerende
      zaken en ten behoeve van deze splitsing technische voorzieningen zijn aangebracht, kan de huurprijs van de nieuw
      ontstane gebouwde onroerende zaken gedurende een termijn van dertien jaren worden verhoogd met 10% 's jaars van
      een door Onze Minister te bepalen gedeelte van de kosten dezer technische voorzieningen, voor zover deze kosten het
      redelijke en gebruikelijke niet overschrijden. Het bepaalde in [artikel 9, tweede lid][ref1], vindt overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002127#Artikel9
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002127
        artikel: '9'
  - number: '15'
    text: |-
      Indien op of na 1 Januari 1954 een gebouwde onroerende zaak wordt gesplitst in twee of meer gedeelten welke niet
      elk afzonderlijk als een gebouwde onroerende zaak kunnen worden aangemerkt en ten behoeve van deze splitsing
      technische voorzieningen zijn aangebracht, kan de huurprijs van de gebouwde onroerende zaak gedurende een termijn
      van dertien jaren worden verhoogd met 10% 's jaars van de kosten dezer technische voorzieningen, voor zover deze
      kosten het redelijke en gebruikelijke niet overschrijden en voor zover zij ten laste van de verhuurder komen.
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel15
  - number: '16'
    text: |-
      Onze Minister kan, indien in de gevallen bedoeld in de [artikelen 12][ref1], [14][ref2] en [15][ref3] een geringere
      verhoging dan die, berekend naar 10% 's jaars aan de huurder in rekening zal worden gebracht, toestaan dat de in de
      genoemde artikelen bepaalde termijn dienovereenkomstig wordt verlengd. Onze Minister kan voorts toestaan, dat een
      grotere verhoging aan de huurder in rekening wordt gebracht, mits de in de vorengenoemde artikelen bepaalde termijn
      dienovereenkomstig wordt verkort.


      [ref1]: https://wetten.overheid.nl/BWBR0002127#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002127#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002127#Artikel15
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002127
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0002127
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0002127
        artikel: '15'
  - number: '17'
    text: |-
      Onze Minister kan de huurprijs van een gebouwde onroerende zaak bij beschikking nader vaststellen, indien de
      huurprijs van die gebouwde onroerende zaak kennelijk zeer aanzienlijk afwijkt van die van een vergelijkbare
      gebouwde onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0002127/1998-01-01#Artikel17
  - number: '19'
    text: |-
      1 Het Besluit bijzondere huurprijzen (*Stb.* 1950, K 588) treedt buiten werking, behoudens het bepaalde in de
      volgende leden.

      2 De [artikelen 11][ref1], [12][ref2] en [13][ref3] blijven van kracht ten aanzien van vernieuwingen en
      verbeteringen, als bedoeld in de [artikelen 11][ref4] en [12][ref5], welke zijn tot stand gekomen tussen 1 Januari
      1951 en 1 Januari 1954.

      3 De [artikelen 14][ref6], [16][ref7] en [17][ref8] blijven van kracht ten aanzien van de kosten van technische
      voorzieningen, als in die artikelen bedoeld, welke zijn gemaakt tussen 1 Januari 1951 en 1 Januari 1954. De termijn
      van 10 jaren, gedurende welke de krachtens deze artikelen toegelaten huurverhoging kan worden berekend, wordt nader
      gesteld op dertien jaren.

      4 [Artikel 15][ref9] blijft van kracht ten aanzien van verhuringen met gewijzigde bestemming, als in dat artikel
      bedoeld, welke zijn tot stand gekomen tussen 1 Januari 1951 en 1 Januari 1954.


