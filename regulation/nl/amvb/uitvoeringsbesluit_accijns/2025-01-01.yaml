  - number: 31e
    text: |-
      1 Teruggaaf van accijns als bedoeld in [artikel 71h, eerste lid, van de wet][ref1], wordt slechts verleend indien
      de motorbrandstof wordt gebruikt voor het aandrijven van motorrijtuigen.

      2 Teruggaaf van accijns als bedoeld in het eerste lid wordt verleend voor motorbrandstof waarvan uit de
      bedrijfsadministratie van de inboeker, bedoeld in [artikel 9.7.1.1 van de Wet milieubeheer][ref2], blijkt dat zij
      geheel of gedeeltelijk bestaat uit:

      a. biobrandstof als bedoeld in artikel 2, onderdeel i, van de Richtlijn hernieuwbare energie en voldoet aan de
      eisen die zijn gesteld in [artikel 9.7.4.2 van de Wet milieubeheer][ref3]; of

      b. hernieuwbare brandstof als bedoeld in [artikel 9.7.1.1 van de Wet milieubeheer][ref4] en voldoet aan de eisen
      die zijn gesteld in [artikel 9.7.4.4 van de Wet milieubeheer][ref5].

      3 Een teruggaaf van accijns op grond van de [artikelen 71][ref6] of [71a van de wet][ref7] voor
      motorbrandstof die geheel of gedeeltelijk bestaat uit biobrandstof of hernieuwbare brandstof als bedoeld in
      [artikel 71h, eerste lid, onderdelen a respectievelijk b, van de wet][ref8] wordt verminderd met een eerdere
      teruggaaf van accijns op grond van artikel 71h van de wet.


