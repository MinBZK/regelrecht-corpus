  - number: '4'
    text: |-
      1 De vergunninghouder van een accijnsgoederenplaats of de in Nederland gevestigde geregistreerde
      geadresseerde kan verzoeken om toestemming tot het toepassen van rechtstreekse aflevering, bedoeld in
      [artikel 2a, vijfde lid, van de wet][ref1].

      2 De toestemming, bedoeld in het eerste lid, wordt opgenomen in de vergunning van de vergunninghouder van de
      accijnsgoederenplaats of van de in Nederland gevestigde geregistreerde geadresseerde. Op de toestemming zijn de
      [artikelen 43 tot en met 46][ref2] en [48 tot en met 50 van de wet][ref3] van overeenkomstige toepassing.

      3 De toestemming, bedoeld in het eerste lid, wordt verleend onder de hierna genoemde voorwaarden en beperkingen:

      a. de toestemming is alleen van toepassing op de accijnsgoederen die in de vergunning zijn vermeld;

      b. de afnemer aan wie rechtstreeks wordt afgeleverd is een ondernemer in de zin van de
      [Wet op de omzetbelasting 1968][ref4] en treedt niet op in de hoedanigheid van een vergunninghouder van een
      accijnsgoederenplaats of een geregistreerde geadresseerde;

      c. alle accijnsgoederen die op het e-AD zijn vermeld, worden rechtstreeks afgeleverd op de plaats van rechtstreekse
      aflevering;

      d. de vergunninghouder van de accijnsgoederenplaats of de geregistreerde geadresseerde zorgt ervoor dat hij wordt
      geïnformeerd over de datum waarop de accijnsgoederen zijn ontvangen op de plaats van rechtstreekse aflevering. Deze
      datum wordt op de commerciële bescheiden, behorende bij de fysieke aflevering, vermeld;

      e. de vergunninghouder van de accijnsgoederenplaats of de geregistreerde geadresseerde blijft verantwoordelijk voor
      de indiening van het bericht van ontvangst. Hij vermeldt daarin de datum waarop de accijnsgoederen zijn ontvangen
      op de plaats van rechtstreekse aflevering;

      f. de vergunninghouder van de accijnsgoederenplaats of de geregistreerde geadresseerde neemt de hoeveelheid
      accijnsgoederen die door de afnemer is ontvangen op de plaats van rechtstreekse aflevering in zijn administratie op
      als ontvangen en tot verbruik uitgeslagen hoeveelheid;

      g. de vergunninghouder van de accijnsgoederenplaats of de geregistreerde geadresseerde richt zijn administratie
      zodanig in dat daarin op overzichtelijke wijze alle gegevens zijn opgenomen omtrent de rechtstreekse afleveringen;

      h. iedere wijziging die zich na het verlenen van de toestemming voordoet, wordt schriftelijk gemeld aan de
      inspecteur die de toestemming voor rechtstreekse aflevering heeft verleend;

      i. bij gebleken misbruik of indien aan één of meer van deze voorwaarden niet wordt voldaan wordt de verleende
      toestemming ingetrokken.

      4 De toestemming, bedoeld in het eerste lid, wordt niet verleend:

      a. aan een vergunninghouder van een accijnsgoederenplaats als bedoeld in [artikel 42a van de wet][ref5];

      b. aan een vergunninghouder van een accijnsgoederenplaats, waar accijnsgoederen worden geproduceerd of verwerkt,
      indien de hoeveelheid accijnsgoederen die gemiddeld over een jaar voorhanden is niet meer bedraagt dan de op
      grond van [artikel 40, eerste lid, onderdeel b, van de wet][ref6], bij ministeriële regeling per soort accijnsgoed
      vastgestelde hoeveelheid;

      c. aan een geregistreerde geadresseerde als bedoeld in [artikel 50a, derde lid, van de wet][ref7].


