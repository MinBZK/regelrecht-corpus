    text: |-
      1 In afwijking van de [artikelen 2, eerste lid][ref1], en [3, eerste lid][ref2], behoeft het door middel
      van een pijpleiding brengen van minerale oliën vanuit een accijnsgoederenplaats naar een belastingentrepot,
      alsmede het door middel van een pijpleiding brengen van minerale oliën vanuit een belastingentrepot naar een
      accijnsgoederenplaats niet te worden aangetoond met een e-AD.

      2 Van het brengen, bedoeld in het eerste lid, wordt door de vergunninghouder van de accijnsgoederenplaats
      maandelijks een opgaaf verstrekt aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel3
