  - number: 6aa
    text: |-
      1 De overbrenging van in Nederland reeds tot verbruik uitgeslagen accijnsgoederen via het grondgebied van een
      andere lidstaat naar een bestemming in Nederland vindt plaats onder dekking van een e-VAD. De [artikelen 6][ref1],
      [6a][ref2], [6b][ref3], [6ba][ref4] en [6bb][ref5] zijn van overeenkomstige toepassing.

      2 De overbrenging van accijnsgoederen die in een andere lidstaat tot verbruik zijn uitgeslagen en waarvan in
      Nederland de accijns niet is geheven via het grondgebied van Nederland naar een bestemming in die andere lidstaat,
      vindt plaats onder dekking van een e-VAD.


