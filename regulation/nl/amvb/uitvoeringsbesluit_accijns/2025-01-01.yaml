  - number: '6'
    text: |-
      1 De overbrenging van reeds tot verbruik uitgeslagen accijnsgoederen vanuit Nederland naar een andere lidstaat
      geschiedt onder dekking van een e-VAD.

      2 De gecertificeerde afzender dient een voorlopig e-VAD in via het EMCS.

      3 Indien de gegevens in het voorlopig e-VAD niet in orde zijn bevonden door de inspecteur, draagt de
      gecertificeerde afzender zorg voor aanpassing van de gegevens en dient hij het voorlopig e-VAD opnieuw in.

      4 Indien de gegevens in het voorlopig e-VAD in orde zijn bevonden door de inspecteur, ontvangt de gecertificeerde
      afzender de VARC die aan het e-VAD is toegekend.

      5 De gecertificeerde afzender verstrekt de persoon die de accijnsgoederen vergezelt de VARC.

      6 De persoon die de accijnsgoederen vergezelt toont desgevraagd de VARC op ieder moment van de overbrenging aan de
      inspecteur of de bevoegde autoriteiten van een andere lidstaat.

      7 Tijdens de overbrenging kan de gecertificeerde afzender via het EMCS de bestemming veranderen in een andere,
      door dezelfde gecertificeerde geadresseerde beheerde plaats van bestemming in dezelfde lidstaat of veranderen in de
      plaats van verzending. De gecertificeerde afzender dient daartoe een voorlopig bericht van bestemmingswijziging in
      bij de inspecteur.

      8 De gecertificeerde afzender ontvangt van de inspecteur een afschrift van het bericht van ontvangst.

      9 Het afschrift van het bericht van ontvangst geldt als afdoende bewijs dat de gecertificeerde geadresseerde alle
      noodzakelijke formaliteiten heeft vervuld en de verschuldigde accijns aan de lidstaat van bestemming heeft betaald,
      tenzij de accijnsgoederen zijn vrijgesteld van accijns.

      10 Het eerste tot en met negende lid zijn niet van toepassing op het vervoer van andere minerale oliën dan bedoeld
      in [artikel 5, vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel5
    url: https://wetten.overheid.nl/BWBR0005360/2025-01-01#Artikel6
