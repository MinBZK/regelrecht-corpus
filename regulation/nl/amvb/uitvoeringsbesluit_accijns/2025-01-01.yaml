    text: |-
      1 De fiscaal vertegenwoordiger, bedoeld in [artikel 50f, eerste lid, van de wet][ref1], moet de administratie van
      zijn bedrijf zodanig doen zijn dat daarin op overzichtelijke wijze alle voor de heffing van de accijns van belang
      zijnde gegevens zijn opgenomen.

      2 De administratie van de fiscaal vertegenwoordiger dient in ieder geval te bevatten de regelmatige aantekening
      van:

      a. de accijnsgoederen die door zijn opdrachtgever zijn geleverd in de zin van [artikel 2f van de wet][ref2] en
      waarvoor de accijns door hem dient te worden voldaan; en

      b. de door hem aan zijn opdrachtgever uitgereikte facturen.


