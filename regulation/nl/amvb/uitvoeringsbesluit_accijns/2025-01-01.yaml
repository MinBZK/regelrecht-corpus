  - number: 2a
    text: |-
      1 Bij het brengen, bedoeld in [artikel 2a, eerste lid, onderdeel a, van de wet][ref1], van een accijnsgoed vanuit
      een accijnsgoederenplaats naar een andere accijnsgoederenplaats die voor dat soort accijnsgoed als zodanig is
      aangewezen, kan het e-AD, bedoeld in [artikel 2, eerste lid][ref2], op verzoek achterwege blijven indien:

      a. zowel de vergunninghouder van de accijnsgoederenplaats van waaruit de accijnsgoederen worden overgebracht, als
      de vergunninghouder van de accijnsgoederenplaats waarnaar de accijnsgoederen worden overgebracht, beschikt over
      een administratie waarin deze overbrengingen afzonderlijk worden bijgehouden en waaruit naar het oordeel van de
      inspecteur de overbrengingen op overzichtelijke wijze zijn af te lezen;

      b. gebruik wordt gemaakt van een maandverklaring, waarin de vergunninghouder van de accijnsgoederenplaats van
      waaruit de accijnsgoederen worden overgebracht opgave doet van de door hem in een kalendermaand zonder e-AD naar
      een andere accijnsgoederenplaats overgebrachte accijnsgoederen; en

      c. de maandverklaring na afloop van een kalendermaand wordt verstrekt aan elke vergunninghouder van een
      accijnsgoederenplaats waarnaar in die kalendermaand accijnsgoederen zijn overgebracht.

      2 De toestemming voor toepassing van het eerste lid wordt opgenomen in de vergunning voor beide in het eerste
      lid bedoelde accijnsgoederenplaatsen. Op de toestemming zijn de [artikelen 43 tot en met 50 van de wet][ref3] van
      overeenkomstige toepassing.

      3 De administratie van de in het eerste lid bedoelde vergunninghouder van de accijnsgoederenplaats van waaruit de
      accijnsgoederen worden overgebracht bevat in ieder geval:

      a. de naam, het adres en het vergunningnummer van de vergunninghouder van de accijnsgoederenplaats waarnaar de
      accijnsgoederen zijn overgebracht;

      b. de soort, de hoeveelheid en de voor de accijnsheffing van belang zijnde samenstelling van de accijnsgoederen;

      c. de datum van verzending van de accijnsgoederen; en

      d. per overbrenging het nummer van de maandverklaring waarin die overbrenging is begrepen.

      4 De administratie van de in het eerste lid bedoelde vergunninghouder van de accijnsgoederenplaats waarnaar de
      accijnsgoederen worden overgebracht, bevat in ieder geval:

      a. de naam, het adres en het vergunningnummer van de vergunninghouder van de accijnsgoederenplaats van waaruit de
      accijnsgoederen zijn overgebracht;

      b. de soort, de hoeveelheid en de voor de accijnsheffing van belang zijnde samenstelling van de accijnsgoederen;

      c. de datum van verzending van de accijnsgoederen;

      d. de datum waarop de accijnsgoederen zijn ontvangen; en

      e. per overbrenging het nummer van de maandverklaring waarin die overbrenging is begrepen.

      5 De vergunninghouder van de accijnsgoederenplaats waarnaar de accijnsgoederen zijn overgebracht, draagt zorg voor
      de terugzending van de in het eerste lid bedoelde maandverklaring.

      6 De in het eerste lid bedoelde maandverklaring moet binnen één maand na de maand waarop de maandverklaring
      betrekking heeft zijn terugontvangen door de vergunninghouder van de accijnsgoederenplaats van waaruit de
      accijnsgoederen zijn overgebracht, voorzien van een verklaring van de vergunninghouder van de accijnsgoederenplaats
      waarnaar de accijnsgoederen zijn overgebracht, dat de accijnsgoederen hun bestemming hebben bereikt en in de
      administratie van zijn accijnsgoederenplaats zijn opgenomen.

      7 Indien de maandverklaring niet wordt terugontvangen voorzien van de in het zesde lid bedoelde verklaring, stelt
      de vergunninghouder van de accijnsgoederenplaats van waaruit de accijnsgoederen zijn overgebracht de inspecteur
      daarvan onverwijld in kennis, maar uiterlijk binnen één week na afloop van de maand waarin de maandverklaring door
      hem moet zijn terugontvangen.

      8 Bij toepassing van het eerste lid is [artikel 34][ref4] van overeenkomstige toepassing.


