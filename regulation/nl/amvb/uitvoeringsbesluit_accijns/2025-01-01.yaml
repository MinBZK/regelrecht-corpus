  - number: 4a
    text: |-
      1 Niettegenstaande [artikel 3d][ref1] vormt in de gevallen, bedoeld in
      [artikel 2a, eerste, tweede en derde lid, van de wet][ref2], het bericht van ontvangst of het bericht van uitvoer
      het bewijs dat een overbrenging overeenkomstig [artikel 2b, tweede lid, van de wet][ref3] is geëindigd.

      2 In afwijking van het eerste lid kan, bij gebreke van een bericht van ontvangst of een bericht van uitvoer om
      andere dan de in [artikel 3d][ref4] vermelde redenen, voor het eindigen van de overbrenging van accijnsgoederen
      onder een accijnsschorsingsregeling een alternatief bewijs worden verstrekt.

      3 Het alternatief bewijs kan in de gevallen, bedoeld in
      [artikel 2a, eerste lid, onderdelen a, b, c en e, en derde lid, onderdelen a, b, c en e, van de wet][ref5],
      een opgestelde aftekening van de bevoegde autoriteiten van de lidstaat van bestemming zijn dat de verzonden
      accijnsgoederen de opgegeven bestemming hebben bereikt.

      4 Het alternatief bewijs kan in de gevallen, bedoeld in
      __REF000___________________________________________________________________________________________________________
      __________, een aftekening zijn van de bevoegde autoriteiten van de lidstaat waar het douanekantoor van uitgang is
      gelegen, ter bevestiging dat de accijnsgoederen het grondgebied van de Unie hebben verlaten of onder de regeling
      extern douanevervoer zijn geplaatst, of een door de inspecteur bepaalde combinatie van:

      a. een pakbon;

      b. een document ondertekend of gewaarmerkt door de marktdeelnemer die de goederen buiten het douanegebied van de
      Unie heeft gebracht ter bevestiging van het uitgaan van de goederen;

      c. een document waarin de douaneautoriteit van een lidstaat of een derde land de levering bevestigt overeenkomstig
      de voor dat certificaat in die staat of dat land toepasselijke voorschriften en procedures;

      d. door de marktdeelnemer bijgehouden administratie waaruit de levering van goederen aan schepen, luchtvaartuigen
      of offshore installaties blijkt;

      e. andere bewijsstukken.

      5 Voor de toepassing van het derde lid geldt het nooddocument als afdoend bewijs.


