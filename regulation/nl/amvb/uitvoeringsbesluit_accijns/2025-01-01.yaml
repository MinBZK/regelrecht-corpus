    text: |-
      Bij het brengen, bedoeld in
      [artikel 2a, eerste lid, onderdeel e, tweede lid, onderdeel c, en derde lid, onderdeel e, van de wet][ref1],
      van een accijnsgoed naar een geadresseerde als bedoeld in [artikel 69 van de wet][ref2], gaan de accijnsgoederen
      vergezeld van een certificaat van vrijstelling.


