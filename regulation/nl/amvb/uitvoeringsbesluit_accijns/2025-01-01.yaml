  - number: '19'
    text: |-
      Vrijstelling van accijns ter zake van de uitslag tot verbruik van minerale oliën die worden gebruikt voor de
      aandrijving van schepen of als scheepsbehoeften aan boord van schepen, wordt verleend indien:

      a. de eigenaar of exploitant van het schip of zijn vertegenwoordiger aan boord van het schip verklaart dat de aan
      hem te leveren minerale oliën worden gebruikt voor het in de aanhef bedoelde gebruik;

      b. de verklaring in tweevoud geschiedt met gebruikmaking van een door de vergunninghouder van de
      accijnsgoederenplaats opgesteld bescheid in geval van uitslag uit de accijnsgoederenplaats of met gebruikmaking van
      een door degene die de levering verricht opgesteld bescheid in geval van invoer;

      c. de eigenaar of exploitant van het schip of zijn vertegenwoordiger aan boord van het schip beide exemplaren van
      de verklaring ondertekent; en

      d. een exemplaar op overzichtelijke wijze wordt bewaard bij de administratie van de vergunninghouder van de
      accijnsgoederenplaats in geval van uitslag uit de accijnsgoederenplaats en bij de administratie van degene die de
      aangifte tot plaatsing onder de douaneregeling brengen in het vrije verkeer doet, in geval van invoer. Het andere
      exemplaar wordt op overzichtelijke wijze bewaard bij de administratie aan boord van het schip.
    url: https://wetten.overheid.nl/BWBR0005360/2025-01-01#Artikel19
  - number: 19a
    text: |-
      [Artikel 19][ref1] is van overeenkomstige toepassing op het verlenen van vrijstelling van accijns ter zake van
      de uitslag tot verbruik van andere accijnsgoederen dan de in [artikel 19][ref2] bedoelde minerale oliën, die
      worden gebruikt aan boord van schepen in het verkeer van Nederland naar een andere lidstaat, anders dan over de
      binnenwateren.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel19
    url: https://wetten.overheid.nl/BWBR0005360/2025-01-01#Artikel19a
