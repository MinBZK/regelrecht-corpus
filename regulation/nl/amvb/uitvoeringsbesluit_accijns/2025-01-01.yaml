        artikel: '64'
  - number: '17'
    text: |-
      Vrijstelling van accijns als bedoeld in [artikel 64, eerste lid, aanhef en onderdeel c, van de wet][ref1] ter zake
      van de uitslag tot verbruik van sigaretten en rooktabak die geheel uit andere stoffen dan tabak bestaan en die
      uitsluitend zijn bestemd om te worden gebruikt voor medicinale doeleinden wordt verleend indien de samenstelling
      van de sigaretten en de rooktabak en de bestemming ervan blijken uit de kleinhandelsverpakking en de presentatie
      van het product.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel64
