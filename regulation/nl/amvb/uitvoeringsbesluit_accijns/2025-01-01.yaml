  - number: 1a
    text: |-
      In dit besluit wordt verstaan onder:

        - *ARC:* de unieke administratieve referentiecode die door de inspecteur of de bevoegde autoriteiten van een
      lidstaat is toegekend aan het e-AD, bedoeld in artikel 20, derde lid, van de Richtlijn;
        - *bericht van ontvangst:* het bericht, bedoeld in artikel 24 of artikel 37 van de Richtlijn;
        - *bericht van uitvoer:* het bericht, bedoeld in artikel 25 van de Richtlijn;
        - *certificaat van vrijstelling:* het document, bedoeld in artikel 12 van de Richtlijn;
        - *e-AD en voorlopig e-AD:* het elektronisch administratief document, bedoeld in artikel 20, eerste, tweede en
      derde lid, van de Richtlijn;
        - *EMCS:* het geautomatiseerde systeem, bedoeld in Besluit 2020/263 van het Europees Parlement en de Raad van
      15 januari 2020 betreffende geautomatiseerde verwerking van gegevens inzake de overbrenging van en de controle op
      accijnsgoederen (PbEU 2020, L 58);
        - *e-VAD en voorlopig e-VAD:* het vereenvoudigd elektronisch administratief document, bedoeld in artikel 36, eerste
      en tweede lid, van de Richtlijn;
        - *noodbericht van ontvangst:* het bericht van ontvangst voor overbrengingen van accijnsgoederen, bedoeld in
      artikel 27, eerste lid, of artikel 39 van de Richtlijn;
        - *noodbericht van uitvoer:* het bericht van uitvoer voor overbrengingen van accijnsgoederen onder schorsing van
      accijns, bedoeld in artikel 27, tweede lid, van de Richtlijn;
        - *nooddocument:* het nooddocument ten geleide van overbrengingen van accijnsgoederen, bedoeld in artikel 26,
      eerste lid, onder a, artikel 26, vierde lid, artikel 38, eerste lid, onder a, van de Richtlijn;
        - *Richtlijn:* [Richtlijn 2020/262](32020L0262) van de Raad van 19 december 2019 houdende een algemene regeling
      inzake accijns (PbEU 2020, L 58);
        - *VARC:* de unieke vereenvoudigde administratieve referentiecode die door de inspecteur of de bevoegde
      autoriteiten van een lidstaat is toegekend aan het e-VAD, bedoeld in artikel 36, tweede lid, van de Richtlijn;
        - *voorlopig bericht van annulering:* het bericht, bedoeld in artikel 20, zesde lid, van de Richtlijn;
        - *voorlopig bericht van bestemmingswijziging:* het document, bedoeld in artikel 20, zevende lid, of artikel 36,
      vijfde lid, van de Richtlijn;
        - *voorlopig bericht van splitsing:* het bericht, bedoeld in artikel 23 van de Richtlijn;
        - *wet:* de [Wet op de accijns][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251
