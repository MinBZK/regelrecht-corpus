  - number: 3a
    text: |-
      1 Het brengen, bedoeld in artikel 2a, derde lid, van de wet, van een accijnsgoed door een in Nederland gevestigde
      geregistreerde afzender van de plaats van invoer naar de in artikel 2a, derde lid, onderdelen a tot en met f, van
      de wet bedoelde bestemmingen, geschiedt onder dekking van een e-AD.

      2 [Artikel 2, tweede tot en met zevende lid, negende en tiende lid][ref1], is van overeenkomstige toepassing.

      3 Tijdens de overbrenging, bedoeld in het eerste lid, kan de geregistreerde afzender
      de accijnsgoederen via het EMCS een nieuwe bestemming geven, die een van de in
      [artikel 2a, derde lid, onderdelen a, b, c, d of f, van de wet][ref2] bedoelde bestemmingen moet zijn. Hij dient
      daartoe een voorlopig bericht van bestemmingswijziging in.

      4 Aan de geregistreerde afzender die onder dekking van een e-AD minerale oliën van de plaats van invoer overbrengt
      naar een van de bestemmingen, bedoeld in [artikel 2a, eerste lid, onderdelen a tot en met c, van de wet][ref3],
      wordt toegestaan dat de desbetreffende overbrenging wordt gesplitst in twee of meer deeltransporten, mits:

      a. de totale hoeveelheid minerale oliën ongewijzigd blijft;

      b. de splitsing wordt verricht op het grondgebied van een lidstaat die deze procedure toestaat;

      c. de bevoegde autoriteiten van laatstgenoemde lidstaat in kennis worden gesteld van de plaats waar de splitsing
      geschiedt; en

      d. elk deeltransport een van de bestemmingen, bedoeld in
      [artikel 2a, eerste lid, onderdelen a, b, c, d of f, van de wet][ref4], krijgt.

      De geregistreerde afzender dient daartoe een voorlopig bericht van splitsing in.

      5 Indien een overbrenging van minerale oliën als bedoeld in [artikel 2, negende lid][ref5], waarvan de
      geadresseerde nog niet definitief vaststaat, wordt gesplitst als bedoeld in het vierde lid, kan de inspecteur
      toestaan dat de geregistreerde afzender voor een van de deeltransporten de gegevens van de geadresseerde niet
      invult met inachtneming van hetgeen is bepaald in artikel 2, tiende lid.

      6 Bij ontvangst van de accijnsgoederen op de in [artikel 2a, derde lid, onderdeel a, van de wet][ref6] bedoelde
      bestemming zendt de geadresseerde, behoudens in ten genoegen van de inspecteur naar behoren gerechtvaardigde
      gevallen, onverwijld en uiterlijk binnen vijf werkdagen na het eindigen van de overbrenging overeenkomstig
      [artikel 2b, tweede lid, van de wet][ref7], een bericht van ontvangst.

      7 Indien de gegevens in het bericht van ontvangst niet in orde zijn bevonden, draagt de geadresseerde zorg voor
      aanpassing van de gegevens en dient hij het bericht van ontvangst onverwijld opnieuw in.


