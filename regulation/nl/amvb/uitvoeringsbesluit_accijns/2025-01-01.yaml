  - number: 9a
    text: |-
      1 De geregistreerde geadresseerde moet de administratie van zijn bedrijf zodanig doen zijn dat daarin op
      overzichtelijke wijze alle voor de heffing van de accijns van belang zijnde gegevens zijn opgenomen.

      2 De administratie van de geregistreerde geadresseerde dient in ieder geval te bevatten de regelmatige aantekening
      van:

      a. de ontvangen accijnsgoederen en de daarbij behorende facturen; en

      b. de documenten en berichten als bedoeld in [artikel 3][ref1].


