  - number: '8'
    text: |-
      1 De vergunninghouder van een accijnsgoederenplaats moet:

      a. de administratieve organisatie van de accijnsgoederenplaats zodanig doen zijn dat zij een juiste en volledige
      vastlegging van de bedrijfshandelingen waarborgt; en

      b. de administratie van de accijnsgoederenplaats zodanig doen zijn dat daarin op overzichtelijke wijze de gegevens
      omtrent alle voor de heffing van de accijns van belang zijnde bedrijfshandelingen zijn opgenomen.

      2 De administratie van de vergunninghouder van de accijnsgoederenplaats dient in ieder geval te bevatten de
      regelmatige aantekening van:

      a. de uitgeslagen accijnsgoederen en de daarvoor uitgereikte facturen;

      b. de voorlopige e-AD’s, e-AD’s, voorlopige berichten van annulering en bestemmingswijziging, berichten van
      ontvangst en uitvoer, nooddocumenten en noodberichten van ontvangst en van uitvoer of, indien [artikel 2a][ref1]
      toepassing vindt, de overgebrachte accijnsgoederen met de daarbij behorende gegevens en de daarvoor uitgereikte
      facturen;

      c. de in Nederland geleverde accijnsgoederen en de uit Nederland betrokken accijnsgoederen;

      d. de naar een andere lidstaat overgebrachte accijnsgoederen en de uit een andere lidstaat betrokken
      accijnsgoederen; en

      e. de naar een derde land overgebrachte accijnsgoederen en de uit een derde land betrokken accijnsgoederen.

      3 Met betrekking tot accijnsgoederenplaatsen waar accijnsgoederen worden geproduceerd of verwerkt, dient de in het
      eerste lid, onderdeel b, bedoelde administratie tevens de voor de heffing van de accijns van belang zijnde gegevens
      te bevatten omtrent de inkoop van grondstoffen en van halffabrikaten, alsmede omtrent de productie of verwerking
      van halffabrikaten en van eindproducten.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005360/2025-01-01#Artikel8
