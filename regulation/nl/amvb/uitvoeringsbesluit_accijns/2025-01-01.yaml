  - number: '18'
    text: |-
      1 Om de in [artikel 65, derde lid, van de wet][ref1] bedoelde vergunning te kunnen verkrijgen dient de
      administratie van degene die om de vergunning verzoekt zodanig te zijn ingericht dat daarin op overzichtelijke
      wijze de gegevens omtrent alle voor de vrijstelling van accijns van belang zijnde bedrijfshandelingen zijn
      opgenomen. Daarin moeten in ieder geval de gegevens zijn opgenomen omtrent de betrokken accijnsgoederen en omtrent
      de daarvan geproduceerde of verwerkte accijnsgoederen en niet-accijnsgoederen, dan wel omtrent het gebruik van de
      desbetreffende accijnsgoederen.

      2 Voor accijnsgoederen als bedoeld in [artikel 65, eerste lid, aanhef en onderdeel a, van de wet][ref2] zijn de
      [artikelen 12][ref3], [15][ref4] en [17][ref5] van overeenkomstige toepassing op de door degene die de goederen met
      vrijstelling betrekt geproduceerde of verwerkte accijnsgoederen.

      3 Degene die de accijnsgoederen met vrijstelling betrekt dient zekerheid te stellen voor de
      accijns die hij verschuldigd kan worden. De [artikelen 56, zesde tot en met negende lid][ref6], en
      [57 tot en met 60, van de wet][ref7] zijn van overeenkomstige toepassing.

      4 Onverminderd de in het eerste tot en met derde lid bedoelde voorwaarden wordt de vrijstelling, bedoeld in
      [artikel 65, eerste lid, van de wet][ref8], verleend indien:

      a. degene die de accijnsgoederen met vrijstelling betrekt verklaart dat de aan hem te leveren accijnsgoederen
      worden gebruikt voor het in [artikel 65, eerste lid, onderdelen a en b, van de wet][ref9] bedoelde gebruik;

      b. de verklaring in tweevoud geschiedt met gebruikmaking van een bescheid opgesteld door:

        - de vergunninghouder van de accijnsgoederenplaats in geval van uitslag uit de accijnsgoederenplaats;
        - de geregistreerde geadresseerde ter zake van de door hem ontvangen accijnsgoederen;
        - de gecertificeerde geadresseerde ter zake van door hem ontvangen accijnsgoederen in geval van overbrenging naar
      Nederland; of
        - degene die de levering verricht in geval van invoer;

      c. degene die de accijnsgoederen met vrijstelling betrekt beide exemplaren van de verklaring ondertekent;

      d. een exemplaar op overzichtelijke wijze is opgenomen in de administratie van:

        - de vergunninghouder van de accijnsgoederenplaats in geval van uitslag uit de accijnsgoederenplaats;
        - de geregistreerde geadresseerde ter zake van de door hem ontvangen accijnsgoederen; of
        - degene die de aangifte doet tot plaatsing onder de douaneregeling in het vrije verkeer brengen, in geval van
      invoer; en

      e. het andere exemplaar op overzichtelijke wijze is opgenomen in de administratie van degene die de accijnsgoederen
      met vrijstelling betrekt.

      5 De verklaring, bedoeld in het vierde lid, onderdeel a, blijft achterwege indien degene die de accijnsgoederen met
      vrijstelling betrekt tevens een van degenen is als bedoeld in het vierde lid, onderdeel b.

      6 De verklaring, bedoeld in het vierde lid, onderdeel a, kan bij levering van een accijnsgoed vanuit een
      accijnsgoederenplaats aan een persoon die de accijnsgoederen met vrijstelling betrekt, op verzoek achterwege
      blijven, indien:

      a. zowel de vergunninghouder van de accijnsgoederenplaats als degene die de accijnsgoederen met vrijstelling
      betrekt, beschikt over een administratie waarin dergelijke leveringen op overzichtelijke wijze worden bijgehouden;

      b. na afloop van elke kalendermaand door de vergunninghouder van de accijnsgoederenplaats een maandverklaring
      in tweevoud wordt opgemaakt, waarin opgaaf wordt gedaan van de door hem in de afgelopen kalendermaand zonder
      verklaring als bedoeld in het vierde lid, onderdeel a, geleverde accijnsgoederen;

      c. een exemplaar van de maandverklaring op overzichtelijke wijze is opgenomen in de administratie van de
      vergunninghouder van de accijnsgoederenplaats; en

      d. het andere exemplaar van de maandverklaring wordt verstrekt aan degene aan wie in de betreffende kalendermaand
      accijnsgoederen met vrijstelling van accijns zijn geleverd, welk exemplaar op overzichtelijke wijze in diens
      administratie wordt opgenomen.

      7 Met betrekking tot het gebruik van de maandverklaring, bedoeld in het zesde lid, onderdeel b, is
      [artikel 2a, tweede tot en met zevende lid][ref10], van overeenkomstige toepassing.


