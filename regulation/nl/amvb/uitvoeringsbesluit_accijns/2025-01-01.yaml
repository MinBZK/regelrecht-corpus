    text: |-
      1 Degene aan wie toestemming is verleend om accijnszegels aan te vragen moet per toestemming een zegeladministratie
      voeren.

      2 Indien de toestemming tot het aanvragen van accijnszegels door de inspecteur wordt ingetrokken, moet degene die
      de accijnszegels heeft aangevraagd de bij hem aanwezige voorraden accijnszegels, die nog niet op tabaksproducten
      zijn aangebracht, onverwijld aan de inspecteur zenden.
