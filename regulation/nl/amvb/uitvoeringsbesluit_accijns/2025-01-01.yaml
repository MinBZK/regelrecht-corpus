        hoofdstuk: IV
        afdeling: '1'
  - number: '25'
    text: |-
      1 Teruggaaf van accijns voor accijnsgoederen waarvoor op de voet van de [artikelen 66][ref1] en
      [66a van de wet][ref2] aanspraak op een vrijstelling zou bestaan, wordt verleend indien:

      a. degene die om teruggaaf verzoekt in zijn administratie een verklaring opneemt van de eigenaar of exploitant
      van het schip of luchtvaartuig of zijn vertegenwoordiger aan boord van het schip of luchtvaartuig dat de
      accijnsgoederen worden gebruikt voor het in de [artikelen 66][ref3] en [66a van de wet][ref4] bedoelde gebruik;

      b. de verklaring in tweevoud geschiedt met gebruikmaking van een door degene die de levering heeft verricht
      opgesteld bescheid;

      c. de eigenaar of exploitant van het schip of luchtvaartuig of zijn vertegenwoordiger aan boord van het schip of
      luchtvaartuig beide exemplaren van de verklaring ondertekent; en

      d. een exemplaar van de verklaring op overzichtelijke wijze wordt bewaard bij de administratie aan boord van het
      schip of bij de administratie van de eigenaar of exploitant van het luchtvaartuig.

      2 Bij de toepassing van het eerste lid is [artikel 20][ref5] van overeenkomstige toepassing voor zover het minerale
      oliën betreft die worden gebruikt voor de aandrijving van schepen of als scheepsbehoeften aan boord van schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel66a
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel66
