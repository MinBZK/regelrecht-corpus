  - number: 6bb
    text: |-
      1 Onverminderd het bepaalde in [artikel 6ba, eerste lid][ref1], vormt het vereiste bericht van ontvangst, het
      bewijs dat de accijnsgoederen aan de gecertificeerde geadresseerde zijn geleverd.

      2 Bij gebreke van een bericht van ontvangst om andere dan de in [artikel 6ba, eerste lid][ref2], genoemde redenen,
      kan de inspecteur in afwijking van het eerste lid een alternatief bewijs van de levering van de accijnsgoederen
      verstrekken door middel van een aftekening van een alternatief document op basis van afdoende bewijs dat de
      goederen de bestemming hebben bereikt.

      3 Het alternatief document bevat ten minste de gegevens van het noodbericht van ontvangst.

      4 Indien de aftekening is aanvaard door de lidstaat van verzending, geldt dit als afdoende bewijs dat de
      gecertificeerde geadresseerde alle noodzakelijke formaliteiten heeft vervuld en verschuldigde accijns in de
      lidstaat van bestemming heeft betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel6ba
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel6ba
