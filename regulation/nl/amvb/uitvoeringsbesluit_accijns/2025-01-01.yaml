      1 De gecertificeerde geadresseerde moet de administratie van zijn bedrijf zodanig doen zijn dat daarin op
      overzichtelijke wijze alle voor de heffing van de accijns van belang zijnde gegevens zijn opgenomen.

      2 De administratie van de gecertificeerde geadresseerde dient in ieder geval te bevatten de regelmatige aantekening
      van:

      a. de ontvangen accijnsgoederen en de daarbij behorende facturen;

      b. de documenten en berichten, bedoeld in de [artikelen 6a][ref1] en [6aa, eerste lid][ref2]; en

      c. het bewijs dat voor de ontvangen accijnsgoederen accijns op aangifte is voldaan behalve als de accijnsgoederen
      zijn vrijgesteld van accijns.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de vergunninghouder van een accijnsgoederenplaats
      of de geregistreerde geadresseerde die optreedt als gecertificeerde geadresseerde.


