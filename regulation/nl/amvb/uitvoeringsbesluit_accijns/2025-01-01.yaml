  - number: 6ba
    text: |-
      1 Indien de gecertificeerde geadresseerde het bericht van ontvangst niet kan indienen overeenkomstig
      [artikel 6a, derde lid][ref1], omdat het EMCS niet beschikbaar is in Nederland of hij het e-VAD nog niet heeft
      ontvangen omdat het EMCS niet beschikbaar is in de lidstaat van verzending, zendt hij de inspecteur een noodbericht
      van ontvangst waarin hij verklaart dat de overbrenging is geëindigd. Het zenden van een bericht van ontvangst is
      niet nodig in naar behoren gerechtvaardigde gevallen.

      2 Zodra het EMCS in Nederland weer beschikbaar komt of de gecertificeerde geadresseerde het e-VAD heeft ontvangen,
      zendt hij onverwijld een bericht van ontvangst overeenkomstig [artikel 6a, derde lid][ref2]. Artikel 6a, vierde
      lid, is van overeenkomstige toepassing.

      3 Indien Nederland de lidstaat van verzending is, ontvangt de gecertificeerde afzender van de inspecteur een
      afschrift van het bericht van ontvangst wanneer de gecertificeerde geadresseerde in een andere lidstaat het bericht
      van ontvangst alsnog via het EMCS heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel6a
