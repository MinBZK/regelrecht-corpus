  - number: 6b
    text: |-
      1 Indien het EMCS niet beschikbaar is in de lidstaat van verzending, worden de accijnsgoederen vergezeld van het
      nooddocument met dezelfde gegevens als het voorlopige e-VAD.

      2 De persoon die de accijnsgoederen vergezelt toont desgevraagd het nooddocument op ieder moment van de
      overbrenging aan de inspecteur.

      3 Onverminderd het bepaalde in het eerste lid en indien het EMCS niet beschikbaar is in Nederland, kan de
      gecertificeerde afzender een overbrenging van accijnsgoederen aanvangen in afwijking van [artikel 6][ref1] op
      voorwaarde dat hij:

      a. indien het EMCS niet beschikbaar is om aan hem toe te schrijven redenen, die redenen afdoend vermeld;

      b. de inspecteur informeert voordat de overbrenging aanvangt; en

      c. vóór aanvang van de overbrenging een kopie van het nooddocument op verzoek overlegt aan de inspecteur.

      4 Zodra het EMCS bij de gecertificeerde afzender opnieuw beschikbaar komt, dient hij een voorlopig e-VAD in via
      het EMCS.

      5 Zodra de gegevens in het voorlopig e-VAD in orde bevonden zijn overeenkomstig [artikel 6, vierde lid][ref2],
      vervangt het voorlopig e-VAD het nooddocument.

      6 Zolang de gegevens in het voorlopig e-VAD niet in orde zijn bevonden, wordt de overbrenging geacht plaats te
      vinden onder dekking van het nooddocument.

      7 De gecertificeerde afzender bewaart een kopie van het nooddocument ter staving van zijn administratie.

      8 Indien het EMCS niet beschikbaar is bij de gecertificeerde afzender, verstrekt hij de informatie, bedoeld in
      [artikel 6, zevende lid][ref3], met behulp van andere communicatiemiddelen. Hij informeert daartoe de inspecteur
      voordat de overbrenging aanvangt in de vorm van gegevenselementen die worden uitgedrukt op dezelfde wijze als in
      het voorlopig bericht van bestemmingswijziging. Het vierde tot en met zevende lid zijn hierop van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005360#Artikel6
