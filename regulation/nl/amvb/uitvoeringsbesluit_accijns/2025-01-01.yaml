  - number: '7'
    text: |-
      1 De ontheffing, bedoeld in artikel 5, derde lid, onderdeel a, van de wet, vindt uitsluitend toepassing indien
      uit de administratie van degene die de accijnsgoederen produceert of verwerkt uit andere accijnsgoederen blijkt
      dat het accijnsbedrag dat eerstbedoelde accijnsgoederen vertegenwoordigen niet hoger is dan het accijnsbedrag
      dat de accijnsgoederen vertegenwoordigen waaruit zij zijn geproduceerd of verwerkt en dat de accijns voor deze
      laatstbedoelde goederen is betaald.

      2 De ontheffing, bedoeld in artikel 5, derde lid, onderdeel b, van de wet, vindt uitsluitend toepassing indien
      degene die de accijnsgoederen produceert of verwerkt in het bezit is van een vergunning als bedoeld in artikel 65,
      derde lid, van de wet, die ziet op de productie of verwerking van accijnsgoederen als bedoeld in artikel 65, eerste
      lid, onderdeel a, van de wet.

      3 De ontheffing, bedoeld in artikel 5, derde lid, onderdeel c, van de wet, vindt uitsluitend toepassing indien de
      thuis geproduceerde accijnsgoederen worden verbruikt door de producent, zijn huisgenoten of zijn gasten.

      4 De ontheffing, bedoeld in [artikel 5, derde lid, onderdeel d, van de wet][ref1], vindt uitsluitend
      toepassing indien uit de administratie van degene die de minerale oliën produceert, verwerkt of voor
      commerciële doeleinden voorhanden of in opslag heeft blijkt dat het minerale oliën betreft bedoeld in
      [artikel 5, derde lid, onderdeel d, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel5
