  - number: '28'
    text: |-
      1 Teruggaaf van accijns voor accijnsgoederen die zijn verloren gegaan wordt verleend indien de goederen tot
      een bedrijfsvoorraad behoren en de belanghebbende onverwijld nadat is geconstateerd dat de accijnsgoederen zijn
      verloren gegaan, daarvan melding doet bij de inspecteur.

      2 De soort, de hoeveelheid en de voor de berekening van de teruggaaf van belang zijnde samenstelling van de
      accijnsgoederen die zijn verloren gegaan, alsmede het tijdstip waarop en de oorzaak waardoor de accijnsgoederen
      verloren zijn gegaan, dienen door de belanghebbende te worden aangetoond.

      3 Teruggaaf wordt uitsluitend verleend indien het verloren gaan van de accijnsgoederen is te wijten aan overmacht
      of ongeval.
    url: https://wetten.overheid.nl/BWBR0005360/2025-01-01#Artikel28
  - number: '29'
    text: |-
      Voor de toepassing van de teruggaaf voor onder ambtelijk toezicht vernietigde accijnsgoederen is
      [artikel 28, eerste en tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel28
    url: https://wetten.overheid.nl/BWBR0005360/2025-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: '28'
        hoofdstuk: IV
        afdeling: '2'
  - number: '30'
    text: |-
      Teruggaaf van accijns voor accijnsgoederen die zijn gebracht naar een derde land, wordt verleend indien in de
      administratie van degene die verzoekt om teruggaaf van accijns documenten zijn opgenomen die zijn vereist op grond
      van wettelijke bepalingen als bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1],
      waarmee wordt aangetoond dat de accijnsgoederen ten uitvoer zijn aangegeven en het grondgebied van de Unie hebben
      verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel11
    url: https://wetten.overheid.nl/BWBR0005360/2025-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: 1:1
  - number: '31'
    text: |-
      Teruggaaf van accijns voor accijnsgoederen die zijn gebracht binnen een accijnsgoederenplaats die voor dat soort
      accijnsgoed als zodanig is aangewezen, wordt verleend aan de vergunninghouder van de accijnsgoederenplaats waarnaar
      de goederen zijn overgebracht wanneer hij om teruggaaf verzoekt en uit de administratie blijkt dat de goederen in
      zijn accijnsgoederenplaats zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0005360/2025-01-01#Artikel31
  - number: 31a
    text: |-
      Voor de toepassing van de teruggaaf van accijns voor accijnsgoederen die door een gecertificeerde afzender zijn
      overgebracht in de zin van [artikel 71, eerste lid, onderdeel e, van de wet][ref1], moet die gecertificeerde
      afzender:

      a. de accijnsgoederen vervoeren onder dekking van een e-VAD; en

      b. het bericht van ontvangst in zijn administratie opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71
    url: https://wetten.overheid.nl/BWBR0005360/2025-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '71'
  - number: 31b
    text: |-
      Voor de toepassing van de teruggaaf van accijns voor accijnsgoederen die zijn geleverd in de zin van
      [artikel 71, eerste lid, onderdeel f, van de wet][ref1], moet belanghebbende:

      a. in zijn administratie een document opnemen waaruit blijkt dat de betaling van accijns in de lidstaat van
      bestemming heeft plaatsgevonden. Indien in de lidstaat van bestemming geen accijns verschuldigd is, blijkt uit de
      administratie dat de accijnsgoederen in de lidstaat van bestemming zijn afgeleverd;

      b. voorafgaand aan de verzending van de accijnsgoederen bij één enkel, door de lidstaat van bestemming speciaal
      voor afstandsverkopen aangewezen loket en onder de door deze lidstaat vast te stellen voorwaarden, zijn identiteit
      bekend maken en zekerheid stellen voor de betaling van de accijns;

      c. bij de aankomst van de accijnsgoederen de accijns voldoen aan het in onderdeel b bedoelde loket;

      d. een administratie voeren van de leveringen van de accijnsgoederen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71
    url: https://wetten.overheid.nl/BWBR0005360/2025-01-01#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '71'
  - number: 31d
    text: |-
      Het verzoek om teruggaaf, bedoeld in [artikel 71g van de wet][ref1], wordt gedaan uiterlijk drie maanden na afloop
      van het kalenderkwartaal waarin het vloeibaar gemaakt petroleumgas is geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71g
