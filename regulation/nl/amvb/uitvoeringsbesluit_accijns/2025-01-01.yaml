        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: '20'
    text: |-
      1 Vrijstelling van accijns als bedoeld in [artikel 19][ref1] wordt voor lichte olie niet verleend.

      2 Vrijstelling van accijns als bedoeld in [artikel 19][ref2] wordt voor halfzware olie en gasolie
      uitsluitend verleend indien die oliën zijn voorzien van herkenningsmiddelen als bedoeld in
      [artikel 1a, derde lid, van de wet][ref3].

      3 Het tweede lid is van overeenkomstige toepassing op producten van GN-code 3824 99 92 (met uitzondering van
      roestwerende preparaten die aminen als werkzame bestanddelen bevatten en anorganische preparaten voor het oplossen
      of voor het verdunnen van vernissen of van dergelijke producten) voor zover deze voor de toepassing van het tarief
      kunnen worden gelijkgesteld met halfzware olie of gasolie alsmede van de GN-codes 3826 00 10 en 3826 00 90.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
    url: https://wetten.overheid.nl/BWBR0005360/2025-01-01#Artikel20
