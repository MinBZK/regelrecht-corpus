  - number: 18b
    text: |-
      1 De vergunning, bedoeld in [artikel 65, derde lid, van de wet][ref1], is niet vereist voor alcohol en
      alcoholhoudende dranken indien zij in ziekenhuizen of apotheken worden gebruikt voor medische doeleinden en de
      ontvanger een zodanig gebruik bevestigende verklaring heeft overgelegd aan degene die de alcohol en alcoholhoudende
      dranken aan hem gaat leveren.

      2 De verklaring geschiedt in tweevoud met gebruikmaking van een bescheid opgesteld door:

      a. de vergunninghouder van de accijnsgoederenplaats in geval van uitslag tot verbruik uit die
      accijnsgoederenplaats; of

      b. de handelaar die over een vergunning beschikt als bedoeld in [artikel 65, derde lid, van de wet][ref2] in geval
      van een levering door die handelaar aan de ontvanger.

      3 Degene die de alcohol en alcoholhoudende dranken met vrijstelling betrekt, ondertekent beide exemplaren van de
      verklaring en neemt een exemplaar op overzichtelijke wijze op in zijn administratie.

      4 Een exemplaar wordt op overzichtelijke wijze in de administratie opgenomen van:

      a. de vergunninghouder van de accijnsgoederenplaats in geval van uitslag tot verbruik uit de accijnsgoederenplaats;
      of

      b. de handelaar die over een vergunning beschikt als bedoeld in [artikel 65, derde lid, van de wet][ref3] in geval
      van een levering door die handelaar aan de ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel65
