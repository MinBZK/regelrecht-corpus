        bwb_id: BWBR0005251
        artikel: '51'
  - number: '12'
    text: |-
      Vrijstelling van accijns als bedoeld in [artikel 64a, eerste lid, aanhef en onderdelen a en b, van de wet][ref1]
      ter zake van de uitslag tot verbruik van overige alcoholhoudende producten die kennelijk niet zijn bestemd voor
      inwendig gebruik door de mens wordt verleend voor producten die zijn vermengd met bij ministeriële regeling
      aangewezen stoffen tot de daarbij te bepalen hoeveelheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel64a
