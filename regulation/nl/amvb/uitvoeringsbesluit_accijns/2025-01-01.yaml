  - number: 8a
    text: |-
      Onverminderd [artikel 8, tweede lid][ref1], moet de administratie van de vergunninghouder van een
      accijnsgoederenplaats als bedoeld in [artikel 42a, eerste lid, onderdeel c, van de wet][ref2] in ieder geval
      bevatten de regelmatige aantekening van:

      a. de minerale oliën die aan boord van schepen zijn afgeleverd in het kader van de bevoorrading van schepen,
      bedoeld in [artikel 66 van de wet][ref3];

      b. de voor de afleveringen, bedoeld in onderdeel a, uitgereikte facturen alsmede de ter zake van die afleveringen
      opgemaakte en terugontvangen verklaringen, bedoeld in [artikel 19][ref4]; en

      c. de ontvangen hoeveelheden minerale oliën volgens de berichten van ontvangst en noodberichten van ontvangst en
      van uitvoer en de afgeleverde hoeveelheden minerale oliën volgens de verklaringen, bedoeld in [artikel 19][ref5],
      op zodanige wijze dat aan de hand van deze berichten en verklaringen het verband tussen de ontvangen en afgeleverde
      hoeveelheden kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel8
