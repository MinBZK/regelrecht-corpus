  - number: '15'
    text: |-
      Vrijstelling van accijns als bedoeld in [artikel 64, eerste lid, aanhef en onderdeel a, van de wet][ref1] wordt
      verleend ter zake van de uitslag tot verbruik van minerale oliën, andere dan minerale oliën van de GN-codes
      3811 11 10, 3811 11 90, 3811 19 00 en 3811 90 00, die kennelijk niet zijn bestemd te worden gebruikt als brandstof
      voor verwarming, als motorbrandstof of als grondstof indien de verkoopprijs exclusief accijns en omzetbelasting
      van de desbetreffende minerale olie hoger is dan de verkoopprijs inclusief accijns en omzetbelasting van de
      gelijkwaardige soort minerale olie die wordt gebruikt als brandstof.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel64
    url: https://wetten.overheid.nl/BWBR0005360/2025-01-01#Artikel15
