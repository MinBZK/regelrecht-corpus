    text: |-
      1 In de in [artikel 75, eerste lid, onderdelen c en d, van de wet][ref1] bedoelde gevallen kunnen tabaksproducten
      worden uitgeslagen tot verbruik door een ander dan degene die de accijnszegels heeft aangevraagd.

      2 Degene die de accijnszegels heeft aangevraagd neemt in zijn zegeladministratie alle bescheiden op waaruit blijkt
      dat de accijns ter zake van de in het eerste lid bedoelde uitslag tot verbruik is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
