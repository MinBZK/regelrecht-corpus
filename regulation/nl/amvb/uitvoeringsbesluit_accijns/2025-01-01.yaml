  - number: 18a
    text: |-
      1 De vergunning, bedoeld in [artikel 65, derde lid, van de wet][ref1], is niet vereist in geval alcoholhoudende
      restproducten worden gebruikt als grondstof voor het produceren van diervoeder ten behoeve van dieren aanwezig
      op de boerderij van de ontvanger en indien de ontvanger een verklaring heeft overgelegd aan degene die de
      alcoholhoudende restproducten aan hem gaat leveren.

      2 Onder alcoholhoudende restproducten worden verstaan producten die zijn overgebleven bij de productie of
      verwerking van alcoholhoudende dranken.

      3 De verklaring, bedoeld in het eerste lid, geschiedt in tweevoud met gebruikmaking van een bescheid opgesteld
      door:

      a. de vergunninghouder van de accijnsgoederenplaats in geval van uitslag tot verbruik uit die
      accijnsgoederenplaats; of

      b. de handelaar die over een vergunning beschikt als bedoeld in [artikel 65, derde lid, van de wet][ref2] in geval
      van een levering van die handelaar aan de ontvanger.

      4 Degene die de alcoholhoudende restproducten met vrijstelling betrekt dient beide exemplaren van de verklaring te
      ondertekenen en daarvan een exemplaar op overzichtelijke wijze in zijn administratie op te nemen.

      5 Een exemplaar dient op overzichtelijke wijze in de administratie te worden opgenomen van:

      a. de vergunninghouder van de accijnsgoederenplaats in geval van uitslag tot verbruik uit de accijnsgoederenplaats;
      of

      b. de handelaar die over een vergunning beschikt als bedoeld in [artikel 65, derde lid, van de wet][ref3] in geval
      van een levering van die handelaar aan de ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel65
