        artikel: '64'
  - number: 15a
    text: |-
      1 Vrijstelling van accijns als bedoeld in [artikel 64, eerste lid, aanhef en onderdeel b, van de wet][ref1] ter
      zake van de uitslag tot verbruik van minerale oliën die in hoogovens met het oog op chemische reductie worden
      ingespoten als toevoeging aan de steenkool, die wordt gebruikt als voornaamste brandstof, wordt verleend, indien
      degene die de minerale oliën betrekt in het bezit is van een vergunning van de inspecteur waaruit blijkt dat hij
      de desbetreffende goederen met vrijstelling mag betrekken met inachtneming van de in het tweede lid opgenomen
      voorwaarden.

      2 In de in het eerste lid bedoelde vergunning kunnen nadere technische en administratieve voorwaarden worden
      gesteld ter vaststelling van de betrokken hoeveelheid minerale oliën ter zake waarvan vrijstelling wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel64
