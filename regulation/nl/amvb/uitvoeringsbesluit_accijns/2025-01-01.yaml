      1 De afzender, bedoeld in [artikel 50f, eerste lid, van de wet][ref1], die geen fiscaal vertegenwoordiger aanstelt,
      neemt in zijn melding bij de inspecteur in ieder geval het volgende op:

      a. zijn contactgegevens;

      b. de soort en hoeveelheid in Nederland te leveren accijnsgoederen en kopieën van de daarvoor uitgereikte facturen.

      2 Bij ministeriële regeling kan worden bepaald waar de afzender zich moet melden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50f
