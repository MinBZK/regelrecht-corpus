  - number: '32'
    text: |-
      1 Bij een verzoek om teruggaaf binnen drie maanden na een tariefwijziging van de accijns wordt de teruggaaf
      ingevolge deze afdeling bij een tariefverhoging naar het daarvóór geldende tarief en bij een tariefverlaging
      naar het dan geldende tarief verleend, tenzij de belanghebbende aantoont dat de accijns waarvan teruggaaf wordt
      gevraagd, is voldaan naar het na de tariefverhoging geldende onderscheidenlijk vóór de tariefverlaging gegolden
      hebbende hogere tarief.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot een gedeeltelijke teruggaaf van accijns.
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel32
  - number: '34'
    text: |-
      1 Van accijnsgoederen, andere dan tabaksproducten die zijn voorzien van de wettelijk voorgeschreven accijnszegels,
      die worden vervoerd of voorhanden zijn, niet zijnde onder een accijnsschorsingsregeling, wordt aan de hand van
      bescheiden de herkomst aangetoond.

      2 Het bescheid dat wordt gebruikt om de herkomst aan te tonen van accijnsgoederen die worden vervoerd, niet zijnde
      onder een accijnsschorsingsregeling, mag niet ouder zijn dan zes dagen, tenzij wordt aangetoond dat het vervoer
      langer dan zes dagen geleden is aangevangen.

      3 Het eerste lid is niet van toepassing op accijnsgoederen:

      a. beneden de op grond van [artikel 2d, tweede lid, van de wet][ref1] vastgestelde hoeveelheden; en

      b. die bij anderen dan ondernemers voorhanden zijn of door hen worden vervoerd voor eigen behoeften voor zover die
      accijnsgoederen zich bevinden in de gebruikelijke kleinhandelsverpakking.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2d
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2d
  - number: '35'
    text: |-
      Van ruwe en van gedeeltelijk tot verbruik bereide tabak die wordt vervoerd moet aan de hand van bescheiden de
      herkomst kunnen worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel35
  - number: '36'
    text: |-
      1 Degene die handel drijft in ruwe tabak dient in het bezit te zijn van een daartoe strekkende vergunning van de
      inspecteur.

      2 De vergunning wordt op verzoek verleend. In het verzoek wordt opgave gedaan van de plaatsen waar het bedrijf
      wordt uitgeoefend. In de vergunning worden voorwaarden opgenomen met het oog op het toezicht op de naleving van de
      wettelijke bepalingen.

      3 Ruwe tabak en monsters van ruwe tabak mogen uitsluitend worden verstrekt aan vergunninghouders van een
      accijnsgoederenplaats voor tabaksprodukten en aan agenten, commissionairs of makelaars in ruwe tabak.

      4 De agent, commissionair of makelaar, die monsters ruwe tabak aan anderen dan vergunninghouders van een
      accijnsgoederenplaats voor tabaksprodukten afstaat, is onderworpen aan de voor handelaren in ruwe tabak geldende
      bepalingen.

      5 Voor de toepassing van dit artikel wordt onder ruwe tabak mede verstaan gedeeltelijk tot verbruik bereide tabak.
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel36
  - number: '37'
    text: |-
      Met betrekking tot het verlenen, het aanpassen en het intrekken van op grond van dit besluit te verlenen
      vergunningen zijn de [artikelen 43 tot en met 50 van de wet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel43
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '43'
  - number: '38'
    text: |-
      In een douane-entrepot van het type B of van het type C als bedoeld in artikel 525 van de toepassingsverordening
      Communautair douanewetboek mogen voorhanden zijn EU-accijnsgoederen als bedoeld in artikel 4, zevende lid, van
      het Communautair douanewetboek die voor uitvoer zijn vrijgegeven en die in afwachting van het verlaten van de Unie
      worden opgeslagen in een douane-entrepot van het type B of van het type C, met toepassing van artikel 106, eerste
      lid, onderdeel a, van het Communautair douanewetboek in samenhang met artikel 534 van de toepassingsverordening
      Communautair douanewetboek.
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel38
  - number: '39'
    text: |-
      1 De voor opslag bestemde inrichtingen van de vergunninghouder van een douane-entrepot van het type E
      of van het type C, bedoeld in artikel 525, tweede lid, onderdeel b, onderscheidenlijk onderdeel c, van
      de toepassingsverordening Communautair douanewetboek, kunnen voor de opslag van accijnsgoederen als
      accijnsgoederenplaats worden aangewezen.

      2 Uit de administratie van de vergunninghouder voor de accijnsgoederenplaats en voor een douane-entrepot als
      bedoeld in het eerste lid, blijkt op overzichtelijke wijze welke goederen in de accijnsgoederenplaats zijn
      opgeslagen en welke in het douane-entrepot.

      3 Met betrekking tot plaatsen waarvoor een vergunning is verleend als bedoeld in het eerste lid, wordt onder het
      in [artikel 2a, derde lid, aanhef en onderdeel a, van de wet][ref1] bedoelde brengen van accijnsgoederen vanuit het
      douane-entrepot naar een accijnsgoederenplaats die voor dat soort accijnsgoederen als zodanig is aangewezen, mede
      verstaan het in de administratie overboeken van de goederen van het douane-entrepot naar de accijnsgoederenplaats.

      4 Voor de in het derde lid bedoelde overbrengingen is geen e-AD vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2a
  - number: 39a
    text: |-
      1 De inspecteur kan toestaan dat de vervoerder of de eigenaar, bedoeld in
      [artikel 56, derde lid, van de wet][ref1], zekerheid stelt in plaats van de vergunninghouder van een
      accijnsgoederenplaats of de geregistreerde afzender, indien hiertoe een gezamenlijk verzoek van die vervoerder of
      eigenaar en die vergunninghouder of geregistreerde afzender wordt ingediend.

      2 In het verzoek worden vermeld:

      a. de naam en het adres van de vergunninghouder van de accijnsgoederenplaats of van de geregistreerde afzender en
      de naam en het adres van de vervoerder of de eigenaar van de goederen;

      b. het accijnsnummer van de vergunninghouder van de accijnsgoederenplaats of van de geregistreerde afzender;

      c. het btw-identificatienummer van de vervoerder of de eigenaar van de goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel56
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '56'
  - number: '42'
    text: |-
      Strafbare feiten zijn:

      a. het nalaten te voldoen aan een in de [artikelen 2, dertiende en veertiende lid][ref1],
      [2a, eerste, vijfde en zevende lid][ref2], [3, derde en vierde lid][ref3], [3a, zesde en zevende lid][ref4],
      [6, tweede lid][ref5], [6a][ref6], [8][ref7], [8a][ref8], [9a][ref9], [9c][ref10], [9d][ref11], [19][ref12],
      [19a][ref13], [21a][ref14], [22][ref15], [25][ref16] en [34, eerste lid][ref17], opgenomen verplichting en een op
      grond van [artikel 9][ref18] opgelegde verplichting;

      b. het in strijd met [artikel 34][ref19] vervoeren of voorhanden hebben van accijnsgoederen, andere dan
      tabaksprodukten die zijn voorzien van de wettelijk voorgeschreven accijnszegels, zonder bescheid aan de hand
      waarvan de herkomst kan worden aangetoond;

      c. het in strijd met [artikel 35][ref20] vervoeren van ruwe en van gedeeltelijk tot verbruik bereide tabak zonder
      bescheiden aan de hand waarvan de herkomst kan worden aangetoond;

      d. het drijven van handel in ruwe of in gedeeltelijk tot verbruik bereide tabak zonder een daartoe strekkende
      vergunning;

      e. het verstrekken van ruwe tabak en monsters ruwe of gedeeltelijk tot verbruik bereide tabak aan anderen dan
      vergunninghouders van een accijnsgoederenplaats voor tabaksprodukten, agenten, commissionairs en makelaars; en

      f. het overigens in strijd met dit besluit vervoeren of voorhanden hebben van accijnsgoederen.


