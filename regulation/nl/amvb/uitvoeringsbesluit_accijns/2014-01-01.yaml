      1 De geregistreerde afzender moet de administratie van zijn bedrijf zodanig doen zijn dat daarin op overzichtelijke
      wijze alle voor de heffing van de accijns van belang zijnde gegevens zijn opgenomen.

      2 De administratie van de geregistreerde afzender dient in ieder geval te bevatten de regelmatige aantekening van:

      a. de accijnsgoederen die door hem zijn overgebracht naar de in
      [artikel 2a, derde lid, onderdelen a tot en met e, van de wet][ref1] bedoelde bestemmingen;

      b. de documenten en berichten als bedoeld in [artikel 3a][ref2].


