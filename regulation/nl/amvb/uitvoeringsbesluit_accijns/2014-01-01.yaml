  - number: 31f
    text: |-
      Indien teruggaaf van accijns is verleend op grond van [artikel 71i van de wet][ref1] wordt bij een later
      verzoek om teruggaaf van accijns op grond van de [artikelen 70, eerste lid, onderdeel b][ref2], [71][ref3] of
      [71a van de wet][ref4] het bedrag aan laatstbedoelde teruggaaf verminderd met het bedrag aan teruggaaf verleend op
      grond van artikel 71i van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71i
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel71
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel31f
