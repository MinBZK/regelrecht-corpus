  - number: '9'
    text: |-
      1 Indien degene die om een vergunning voor een accijnsgoederenplaats verzoekt naar het oordeel van de inspecteur
      niet volledig kan voldoen aan het bepaalde in [artikel 8, eerste lid][ref1], stelt de inspecteur voorwaarden met
      betrekking tot de locatie en de inrichting van de accijnsgoederenplaats, alsmede met betrekking tot het stelsel
      van toezicht.

      2 De in het eerste lid bedoelde inrichting van een accijnsgoederenplaats heeft mede betrekking op de daar aanwezige
      produktie-, transport- en opslaginstallaties.


