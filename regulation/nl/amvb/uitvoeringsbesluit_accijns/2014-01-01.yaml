  - number: '10'
    text: |-
      1 Het bepaalde in [artikel 51, tweede lid, van de wet][ref1] vindt uitsluitend toepassing met betrekking tot
      minerale oliën die zijn uitgeslagen uit een accijnsgoederenplaats op basis van een schriftelijke opdracht van een
      vergunninghouder van een andere accijnsgoederenplaats voor minerale oliën.

      2 De vergunninghouder in wiens opdracht de uitslag heeft plaatsgevonden maakt in zijn administratie aantekening
      van de accijnsgoederenplaats waaruit de uitslag heeft plaatsgevonden, van de naam van de vergunninghouder van de
      desbetreffende accijnsgoederenplaats en van het nummer van de vergunning van die vergunninghouder.

      3 De vergunninghouder van de accijnsgoederenplaats waaruit minerale oliën zijn uitgeslagen maakt in zijn
      administratie aantekening van die uitslag, van de naam van de vergunninghouder van de accijnsgoederenplaats in
      wiens opdracht de accijnsgoederen zijn uitgeslagen en van het nummer van de vergunning van die vergunninghouder.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel51
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '51'
  - number: '12'
    text: |-
      Vrijstelling van accijns ter zake van de uitslag tot verbruik van overige alcoholhoudende produkten die kennelijk
      niet zijn bestemd voor inwendig gebruik door de mens wordt verleend voor produkten die zijn vermengd met bij
      ministeriële regeling aangewezen stoffen tot de daarbij te bepalen hoeveelheden.
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel12
  - number: '15'
    text: |-
      Vrijstelling van accijns wordt verleend ter zake van de uitslag tot verbruik van minerale oliën, andere dan
      minerale oliën van de GN-codes 3811 11 10, 3811 11 90, 3811 19 00 en 3811 90 00, die kennelijk niet zijn bestemd te
      worden gebruikt als brandstof voor verwarming, als motorbrandstof of als grondstof indien de verkoopprijs inclusief
      belastingen van de desbetreffende minerale olie in betekenende mate hoger is dan de verkoopprijs inclusief
      belastingen van de gelijkwaardige soort minerale olie die wordt gebruikt als brandstof.
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel15
  - number: 15a
    text: |-
      1 Vrijstelling van accijns ter zake van de uitslag tot verbruik van minerale oliën die in hoogovens met het oog op
      chemische reductie worden ingespoten als toevoeging aan de steenkool, die wordt gebruikt als voornaamste brandstof,
      wordt verleend, indien degene die de minerale oliën betrekt in het bezit is van een vergunning van de inspecteur
      waaruit blijkt dat hij de desbetreffende goederen met vrijstelling mag betrekken met inachtneming van de in het
      tweede lid opgenomen voorwaarden.

      2 In de in het eerste lid bedoelde vergunning kunnen nadere technische en administratieve voorwaarden worden
      gesteld ter vaststelling van de betrokken hoeveelheid minerale oliën ter zake waarvan vrijstelling wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel15a
  - number: '17'
    text: |-
      Vrijstelling van accijns ter zake van de uitslag tot verbruik van sigaretten en rooktabak die geheel uit andere
      stoffen dan tabak bestaan en die uitsluitend zijn bestemd om te worden gebruikt voor medicinale doeleinden
      wordt verleend indien de samenstelling van de sigaretten en de rooktabak en de bestemming ervan blijken uit de
      kleinhandelsverpakking en de presentatie van het produkt.
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel17
  - number: '18'
    text: |-
      1 Vrijstelling van accijns ter zake van de uitslag tot verbruik van accijnsgoederen die worden gebruikt:

      a. voor het vervaardigen van accijnsgoederen als bedoeld in [artikel 64 van de wet][ref1], dan wel overeenkomstig
      de in dat artikel voor het desbetreffende accijnsgoed aangegeven bestemming; dan wel

      b. als grondstof voor het vervaardigen van niet-accijnsgoederen, wordt verleend indien degene die de
      accijnsgoederen betrekt in het bezit is van een vergunning van de inspecteur waaruit blijkt dat hij de
      desbetreffende accijnsgoederen met vrijstelling mag betrekken met inachtneming van de in het tweede tot en met
      vijfde lid opgenomen voorwaarden.

      2 Om de in het eerste lid bedoelde vergunning te kunnen verkrijgen dient de administratie van degene die om de
      vergunning verzoekt zodanig te zijn ingericht dat daarin op overzichtelijke wijze de gegevens omtrent alle voor
      de vrijstelling van accijns van belang zijnde bedrijfshandelingen zijn opgenomen. Daarin moeten in ieder geval de
      gegevens zijn opgenomen omtrent de betrokken accijnsgoederen en omtrent de daarvan vervaardigde accijnsgoederen en
      niet-accijnsgoederen, dan wel omtrent het gebruik van de desbetreffende accijnsgoederen.

      3 Voor de toepassing van het eerste lid, onderdeel *a*, zijn de [artikelen 12][ref2], [15][ref3] en [17][ref4] van
      overeenkomstige toepassing op de door degene die de goederen met vrijstelling betrekt vervaardigde accijnsgoederen.

      4 Degene die de accijnsgoederen met vrijstelling betrekt dient zekerheid te stellen voor de
      accijns die hij verschuldigd kan worden. De [artikelen 56, vijfde tot en met achtste lid][ref5], en
      [57 tot en met 60, van de wet][ref6] zijn van overeenkomstige toepassing.

      5 Onverminderd de in het tweede tot en met vierde lid bedoelde voorwaarden wordt de vrijstelling, bedoeld in het
      eerste lid, verleend indien:

      a. degene die de accijnsgoederen met vrijstelling betrekt verklaart dat de aan hem te leveren accijnsgoederen
      worden gebruikt voor het in het eerste lid, onderdelen a en b, bedoelde gebruik;

      b. de verklaring in tweevoud geschiedt met gebruikmaking van een bescheid opgesteld door:

        - de vergunninghouder van de accijnsgoederenplaats in geval van uitslag uit de accijnsgoederenplaats;
        - de geregistreerde geadresseerde ter zake van de door hem ontvangen accijnsgoederen; of
        - degene die de levering verricht in geval van invoer;

      c. degene die de accijnsgoederen met vrijstelling betrekt beide exemplaren van de verklaring ondertekent;

      d. een exemplaar op overzichtelijke wijze is opgenomen in de administratie van:

        - de vergunninghouder van de accijnsgoederenplaats in geval van uitslag uit de accijnsgoederenplaats;
        - de geregistreerde geadresseerde ter zake van de door hem ontvangen accijnsgoederen; of
        - degene die de aangifte doet tot plaatsing onder de douaneregeling in het vrije verkeer brengen, in geval van
      invoer; en

      e. het andere exemplaar op overzichtelijke wijze is opgenomen in de administratie van degene die de accijnsgoederen
      met vrijstelling betrekt.

      6 De verklaring, bedoeld in het vijfde lid, onderdeel a, blijft achterwege indien degene die de accijnsgoederen met
      vrijstelling betrekt tevens een van degenen is als bedoeld in het vijfde lid, onderdeel b.

      7 De verklaring, bedoeld in het vijfde lid, onderdeel a, kan bij levering van een accijnsgoed vanuit een
      accijnsgoederenplaats aan een persoon die de accijnsgoederen met vrijstelling betrekt, op verzoek achterwege
      blijven, indien:

      a. zowel de vergunninghouder van de accijnsgoederenplaats als degene die de accijnsgoederen met vrijstelling
      betrekt, beschikt over een administratie waarin dergelijke leveringen op overzichtelijke wijze worden bijgehouden;

      b. na afloop van elke kalendermaand door de vergunninghouder van de accijnsgoederenplaats een maandverklaring
      in tweevoud wordt opgemaakt, waarin opgaaf wordt gedaan van de door hem in de afgelopen kalendermaand zonder
      verklaring als bedoeld in het vijfde lid, onderdeel a, geleverde accijnsgoederen;

      c. een exemplaar van de maandverklaring op overzichtelijke wijze is opgenomen in de administratie van de
      vergunninghouder van de accijnsgoederenplaats; en

      d. het andere exemplaar van de maandverklaring wordt verstrekt aan degene aan wie in de betreffende kalendermaand
      accijnsgoederen met vrijstelling van accijns zijn geleverd, welk exemplaar op overzichtelijke wijze in diens
      administratie wordt opgenomen.

      8 Met betrekking tot het gebruik van de maandverklaring, bedoeld in het zevende lid, onderdeel b, is
      [artikel 2a, tweede tot en met zevende lid][ref7], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005360#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0005360#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0005251#Artikel56
      [ref6]: https://wetten.overheid.nl/BWBR0005251#Artikel57
      [ref7]: https://wetten.overheid.nl/BWBR0005360#Artikel2a
