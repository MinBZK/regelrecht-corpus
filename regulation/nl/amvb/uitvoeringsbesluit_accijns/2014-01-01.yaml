  - number: '22'
    text: |-
      Vrijstelling van accijns ter zake van de uitslag tot verbruik van minerale oliën van de GN-codes 1507 tot en met
      1518 alsmede van minerale oliën van GN-code 3824 90 99, wat hun van biomassa afkomstige bestanddelen betreft, die
      zijn bestemd voor gebruik, worden aangeboden voor verkoop of worden gebruikt voor verwarmingsdoeleinden, wordt
      verleend, indien:

      a. degene die de minerale oliën gebruikt verklaart dat de aan hem te leveren minerale oliën worden gebruikt voor
      het in de aanhef bedoelde gebruik;

      b. in de verklaring de plaats wordt vermeld waar het gebruik zal plaatsvinden;

      c. de verklaring in tweevoud geschiedt;

      d. de verklaring is verstrekt aan de vergunninghouder van de accijnsgoederenplaats in geval van uitslag uit
      de accijnsgoederenplaats, dan wel deze verklaring wordt overgelegd bij de aangifte tot plaatsing onder de
      douaneregeling in het vrije verkeer brengen in geval van invoer;

      e. degene die de minerale oliën gebruikt beide exemplaren van de verklaring ondertekent; en

      f. een exemplaar op overzichtelijke wijze wordt bewaard bij de administratie van de vergunninghouder van de
      accijnsgoederenplaats in geval van uitslag uit de accijnsgoederenplaats, dan wel bij de administratie van degene
      die de aangifte tot plaatsing onder de douaneregeling in het vrije verkeer brengen doet, in geval van invoer.
      Het andere exemplaar wordt op overzichtelijke wijze bewaard bij de administratie van degene die de minerale oliën
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel22
  - number: '23'
    text: |-
      1 Vrijstelling van accijns ter zake van de uitslag tot verbruik van accijnsgoederen die worden gebruikt
      voor onderzoek, kwaliteitscontroles en smaaktesten buiten een accijnsgoederenplaats wordt verleend indien de
      vergunninghouder van de accijnsgoederenplaats van waaruit de accijnsgoederen worden uitgeslagen dan wel degene die
      de goederen invoert, in het bezit is van een vergunning van de inspecteur waaruit blijkt dat hij de desbetreffende
      accijnsgoederen met vrijstelling mag uitslaan dan wel invoeren.

      2 De vergunning wordt op verzoek verleend. In het verzoek om de vergunning worden vermeld:

      a. de soort, de hoeveelheid en de voor de accijnsheffing van belang zijnde samenstelling van de accijnsgoederen;

      b. de naam en het adres van de inrichting waar de accijnsgoederen zullen worden onderzocht, gecontroleerd of
      getest;

      c. de aard en het doel van het onderzoek, de controle of de test; en

      d. de bestemming van de eventueel resterende accijnsgoederen na afloop van het onderzoek, de controle of de test.

      3 Bij het verzoek om de vergunning moet de schriftelijke opdracht voor de in het eerste lid bedoelde onderzoeken,
      controles of testen worden overgelegd.

      4 De vergunning kan worden verleend voor een bepaalde periode of voor periodiek wederkerende onderzoeken, controles
      of testen. De in het tweede lid bedoelde opdrachten dienen alsdan afzonderlijk per onderzoek, controle of test uit
      de administratie te blijken.

      5 De accijnsgoederen die na afloop van de in het eerste lid bedoelde onderzoeken, controles of testen resteren
      moeten na de onderzoeken, controles of testen worden overgebracht naar een accijnsgoederenplaats, worden uitgevoerd
      of onder ambtelijk toezicht worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel23
  - number: 23a
    text: |-
      1 Teruggaaf van accijns voor minerale oliën die worden gebruikt voor het opwekken van elektriciteit in een
      installatie met een elektrisch vermogen van minimaal 60 kilowatt, wordt verleend aan degene die de minerale oliën
      overeenkomstig het vorenstaande heeft gebruikt.

      2 Het gebruik van de minerale oliën als bedoeld in het eerste lid dient te blijken uit de administratie
      van de gebruiker. Uit deze administratie dient eveneens te blijken dat de opgewekte elektriciteit op
      een Nederlands net als bedoeld in [artikel 69a, tweede lid, van de wet][ref1], is ingevoed dan wel,
      indien geen invoeding op een Nederlands net heeft plaatsgevonden, dat die elektriciteit overeenkomstig
      [artikel 50, vierde lid, van de Wet belastingen op milieugrondslag][ref2] in de heffing van energiebelasting is
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel69a
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 69a
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '50'
  - number: '24'
    text: |-
      Voor de toepassing van de teruggaaf van accijns voor accijnsgoederen in gevallen waarin deze accijnsgoederen op de
      voet van [artikel 65 van de wet][ref1] zouden kunnen worden betrokken met vrijstelling, is [artikel 18][ref2] van
      overeenkomstige toepassing met uitzondering van het bepaalde in het vierde tot en met achtste lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel18
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0005360
        artikel: '18'
        hoofdstuk: IV
        afdeling: '1'
  - number: '25'
    text: |-
      1 Teruggaaf van accijns voor accijnsgoederen waarvoor op de voet van de [artikelen 66][ref1] en
      [66a van de wet][ref2] aanspraak op een vrijstelling zou bestaan, wordt verleend indien:

      a. degene die om teruggaaf verzoekt in zijn administratie een verklaring opneemt van de eigenaar of exploitant
      van het schip of luchtvaartuig of zijn vertegenwoordiger aan boord van het schip of luchtvaartuig dat de
      accijnsgoederen worden gebruikt voor het in de [artikelen 66][ref3] en [66a van de wet][ref4] bedoelde gebruik;

      b. de verklaring in tweevoud geschiedt met gebruikmaking van een door degene die de levering heeft verricht
      opgesteld bescheid;

      c. de eigenaar of exploitant van het schip of luchtvaartuig of zijn vertegenwoordiger aan boord van het schip of
      luchtvaartuig beide exemplaren van de verklaring ondertekent; en

      d. een exemplaar van de verklaring op overzichtelijke wijze wordt bewaard bij de administratie aan boord van het
      schip of bij de administratie van de eigenaar of exploitant van het luchtvaartuig.

      2 Bij de toepassing van het eerste lid is [artikel 20][ref5] van overeenkomstige toepassing voor zover het minerale
      oliën betreft die worden gebruikt voor de aandrijving van schepen of als scheepsbehoeften aan boord van schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel66a
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel66
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel66a
      [ref5]: https://wetten.overheid.nl/BWBR0005360#Artikel20
