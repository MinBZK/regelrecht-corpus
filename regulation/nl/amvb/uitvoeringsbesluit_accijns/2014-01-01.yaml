  - number: 6c
    text: |-
      1 Het verbruik bedoeld in [artikel 2, achtste lid, van de wet][ref1] van minerale oliën als brandstof voor het
      vervaardigen van minerale oliën, dient te blijken uit de administratie.

      2 Als verbruik als brandstof voor het vervaardigen van minerale oliën wordt aangemerkt het verbruik voor de
      energielevering aan bijeenbehorende produktie-installaties waar, anders dan door vermenging, ten minste 30 percent
      van de vervaardigde produkten minerale oliën zijn.

      3 De als brandstof voor de energielevering ingezette minerale oliën kunnen bij voorrang worden toegerekend aan de
      energie-afname van de in het tweede lid bedoelde bijeenbehorende produktie-installaties.

      4 Voor de toerekening bij voorrang wordt uitgegaan van een energiebalans per maand per produktielokatie; een
      produktielokatie kan zowel de minerale oliën afdeling als de petrochemische afdeling omvatten.

      5 In de energiebalans worden opgenomen de binnen de produktielokatie opgewekte hoeveelheid energie en de
      hoeveelheid en de soort van de daartoe aangewende brandstoffen, alsmede de hoeveelheid afgegeven energie en alle
      produktie-eenheden waaraan de energie is afgegeven, onderscheiden in die waarin in enigszins betekenende mate
      minerale oliën worden vervaardigd en andere produktie-eenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel6c
    references:
