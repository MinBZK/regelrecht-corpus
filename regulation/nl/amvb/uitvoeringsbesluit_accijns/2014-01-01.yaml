  - number: 1a
    text: |-
      In dit besluit wordt verstaan onder:

        - *EMCS:* het geautomatiseerde systeem, bedoeld in artikel 21, tweede lid, van Richtlijn 2008/118/EG van de Raad
      van 16 december 2008 houdende een algemene regeling inzake accijns en houdende intrekking van Richtlijn 92/12/EEG
      (PbEU 2009, L 9);
        - *Uitvoeringsverordening:* Verordening (EG) nr. 684/2009 van de Commissie van 24 juli 2009 tot uitvoering
      van Richtlijn 2008/118/EG van de Raad wat betreft de geautomatiseerde procedures voor de overbrenging van
      accijnsgoederen onder schorsing van accijns (PbEU 2009, L 197);
        - *voorlopige e-AD en e-AD:* het elektronische administratieve document, bedoeld in artikel 3, eerste lid, en tabel
      1 van bijlage 1, van de Uitvoeringsverordening;
        - *ARC:* unieke administratieve referentiecode die door het EMCS is toegekend aan het elektronische administratieve
      document;
        - *voorlopig bericht van annulering:* het bericht, bedoeld in artikel 4, eerste lid, en tabel 2 van bijlage 1, van
      de Uitvoeringsverordening;
        - *voorlopig bericht van bestemmingswijziging:* het bericht, bedoeld in artikel 5, eerste lid, en tabel 3 van
      bijlage 1, van de Uitvoeringsverordening;
        - *bericht van ontvangst:* het bericht, bedoeld in artikel 7 en tabel 6 van bijlage 1, van de
      Uitvoeringsverordening;
        - *bericht van uitvoer:* het bericht, bedoeld in artikel 7 en tabel 6 van bijlage 1, van de Uitvoeringsverordening;
        - *nooddocument:* nooddocument ten geleide van overbrengingen van accijnsgoederen onder schorsing van accijns,
      bedoeld in artikel 8, eerste lid, van de Uitvoeringsverordening;
        - *noodbericht van ontvangst of van uitvoer:* noodbericht van ontvangst/noodbericht van uitvoer voor overbrengingen
      van accijnsgoederen onder schorsing van accijns, bedoeld in artikel 8, derde lid, van de Uitvoeringsverordening;
        - *certificaat van vrijstelling:* het document, bedoeld in Verordening (EG) nr. 31/96 van de Commissie van
      10 januari 1996 betreffende het certificaat van vrijstelling van accijnzen (PbEG 1996, L 8);
        - *vereenvoudigd administratief geleidedocument:* het document, bedoeld in Verordening (EG) nr. 3649/92 van de
      Commissie van 17 december 1992 betreffende een vereenvoudigd geleidedocument voor het intracommunautaire verkeer
      van accijnsproducten die in de lidstaat van verzending tot verbruik zijn uitgeslagen (PbEG 1992, L 369);
        - *voorlopig bericht van splitsing:* het bericht, bedoeld in artikel 6, eerste lid, en tabel 5 van bijlage 1, van
      de Uitvoeringsverordening.
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel1a
  - number: '2'
    text: |-
      1 Het brengen als bedoeld in [artikel 2a, eerste lid, van de wet][ref1] van een accijnsgoed vanuit een
      accijnsgoederenplaats naar de in [artikel 2a, eerste lid, onderdelen a tot en met e, van de wet][ref2] bedoelde
      bestemmingen, geschiedt onder dekking van een e-AD.

      2 De vergunninghouder van de accijnsgoederenplaats van waaruit de accijnsgoederen worden overgebracht dient een
      voorlopig e-AD in.

      3 Indien de gegevens in het voorlopig e-AD niet in orde zijn bevonden, draagt de vergunninghouder zorg voor
      aanpassing van de gegevens en dient hij het voorlopig e-AD opnieuw in.

      4 Indien de gegevens in het voorlopig e-AD in orde zijn bevonden, ontvangt de vergunninghouder de ARC, die aan het
      e-AD is toegekend.

      5 De vergunninghouder verstrekt de persoon die de accijnsgoederen vergezelt een gedrukt exemplaar van het e-AD of
      een ander handelsdocument waarop de ARC duidelijk herkenbaar is vermeld.

      6 Het in het vijfde lid bedoelde document moet op ieder moment van de overbrenging, bedoeld in het eerste lid, aan
      de inspecteur of aan de bevoegde autoriteiten van een andere lidstaat kunnen worden getoond.

      7 De vergunninghouder mag het e-AD annuleren zolang de overbrenging nog niet is aangevangen overeenkomstig
      [artikel 2b, eerste lid, van de wet][ref3]. Hij dient daartoe een voorlopig bericht van annulering in.

      8 Tijdens de overbrenging, bedoeld in het eerste lid, kan de vergunninghouder de accijnsgoederen via het EMCS een
      nieuwe bestemming geven, die een van de in [artikel 2a, eerste lid, onderdelen a tot en met d, van de wet][ref4]
      bedoelde bestemmingen moet zijn. Hij dient daartoe een voorlopig bericht van bestemmingswijziging in.

      9 Indien de geadresseerde van minerale oliën die onder een accijnsschorsingsregeling over zee of via
      binnenwaterwegen worden overgebracht, nog niet definitief vaststaat wanneer de vergunninghouder het voorlopig e-AD
      indient, kan de inspecteur toestaan dat de vergunninghouder de gegevens van de geadresseerde niet invult.

      10 Zodra de gegevens van de geadresseerde, bedoeld in het negende lid, bekend zijn, maar uiterlijk bij het eindigen
      van de overbrenging overeenkomstig [artikel 2b, tweede lid, van de wet][ref5], zendt de vergunninghouder de
      gegevens toe aan de inspecteur. Hij dient daartoe een voorlopig bericht van bestemmingswijziging in.

      11 Aan de vergunninghouder van een accijnsgoederenplaats van waaruit minerale oliën
      onder dekking van een e-AD worden overgebracht naar een van de bestemmingen, bedoeld in
      [artikel 2a, eerste lid, onderdelen a tot en met c, van de wet][ref6], wordt toegestaan dat de desbetreffende
      overbrenging wordt gesplitst in twee of meer deeltransporten, mits:

      a. de totale hoeveelheid minerale oliën ongewijzigd blijft;

      b. de splitsing wordt verricht op het grondgebied van een lidstaat die deze procedure toestaat;

      c. de bevoegde autoriteiten van laatstgenoemde lidstaat in kennis worden gesteld van de plaats waar de splitsing
      geschiedt; en

      d. elk deeltransport een van de bestemmingen, bedoeld in
      [artikel 2a, eerste lid, onderdelen a tot en met d, van de wet][ref7], krijgt.

      De vergunninghouder dient daartoe een voorlopig bericht van splitsing in.

      12 Indien een overbrenging van minerale oliën als bedoeld in het negende lid, waarvan de geadresseerde nog
      niet definitief vaststaat, wordt gesplitst als bedoeld in het elfde lid, kan de inspecteur toestaan dat de
      vergunninghouder voor een van de deeltransporten de gegevens van de geadresseerde niet invult met inachtneming van
      hetgeen is bepaald in het tiende lid.

      13 Bij ontvangst van de accijnsgoederen op de in [artikel 2a, eerste lid, onderdeel a, van de wet][ref8] bedoelde
      bestemming zendt de geadresseerde, behoudens in ten genoegen van de inspecteur naar behoren gerechtvaardigde
      gevallen, onverwijld en uiterlijk binnen vijf werkdagen na het eindigen van de overbrenging overeenkomstig
      [artikel 2b, tweede lid, van de wet][ref9], een bericht van ontvangst.

      14 Indien de gegevens in het bericht van ontvangst niet in orde zijn bevonden, draagt de geadresseerde zorg voor
      aanpassing van de gegevens en dient hij het bericht van ontvangst onverwijld opnieuw in.


